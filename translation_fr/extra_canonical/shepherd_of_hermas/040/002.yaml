  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/002.yaml
  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: fr
  text: 2. Ceux qui ont l’âme partagée viennent donc le consulter comme un magicien et lui demandent ce qui va leur arriver. Et ce faux prophète, qui n’a en lui aucune puissance venant d’un esprit divin, leur parle selon leurs questions[a] et remplit leur âme selon ce qu’ils désirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins ajoutent : « et selon leurs mauvais désirs ».'
    reason: La proposition καὶ κατὰ τὰς ἐπιθυμίας τῆς πονηρίας αὐτῶν est placée entre crochets dans le texte source fourni, ce qui signale une lecture textuellement incertaine.
lexical_decisions:
- source_word: δίψυχοι
  choice: gens indécis
  rationale: Le terme désigne littéralement des personnes « à l’âme double », partagées et instables. « Indécis » rend naturellement ce trait dans le contexte sans introduire un diagnostic psychologique moderne.
- source_word: ὡς ἐπὶ μάγον ἔρχονται
  choice: viennent le consulter comme on consulte un magicien
  rationale: La formulation explicite en français la valeur idiomatique de ἐπὶ avec l’idée de recours ou de consultation.
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: ce qui va leur arriver
  rationale: Rend la question divinatoire sur leur avenir en français courant.
- source_word: δύναμιν πνεύματος θείου
  choice: puissance venant d’un esprit divin
  rationale: Conserve l’absence d’article devant πνεύματος θείου et évite d’identifier plus précisément cet « esprit divin » que ne le fait ici le grec.
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν
  choice: remplit leur âme
  rationale: Préserve l’image forte de « remplir » et emploie le singulier distributif naturel en français.
theological_decisions:
- issue: Sens de δίψυχοι
  choice: gens indécis
  alternative: hommes à l’âme partagée / irrésolus
  rationale: Le choix conserve l’idée de division intérieure tout en restant immédiatement intelligible; il ne réduit pas le terme à un simple doute intellectuel.
- issue: Identification de πνεῦμα θεῖον
  choice: un esprit divin
  alternative: l’Esprit divin
  rationale: La construction grecque est indéfinie dans cette phrase. La traduction préserve cette forme sans imposer une identification dogmatique, même si le contexte plus large parle aussi de l’Esprit saint.
- issue: Texte entre crochets dans l’édition
  choice: signalé en note plutôt qu’intégré sans réserve
  alternative: et selon leurs désirs mauvais
  rationale: Les crochets de l’édition indiquent une incertitude textuelle; la lecture ne doit pas être présentée comme pleinement assurée.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement déployée pour rendre l’idiome grec naturel. Le terme « âme » maintient le vocabulaire anthropologique du texte, tandis que « gens indécis » évite le calque peu naturel « doubles d’âme ».
