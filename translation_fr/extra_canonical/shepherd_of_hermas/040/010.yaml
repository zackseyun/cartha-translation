  text: 10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.
translation:
  language: fr
  text: 10. Ainsi donc, l’esprit de la divinité sera manifeste. Telle est la puissance que possède l’esprit de la divinité du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τῆς θεότητος
  choice: l’Esprit de la divinité
  rationale: Rend directement l’expression grecque sans la réduire à « Esprit divin »; la majuscule convient ici au contexte, qui parle de l’Esprit venant de Dieu.
- source_word: φανερὸν ἔσται
  choice: se manifestera
  rationale: Formulation française naturelle qui conserve l’idée que la véritable nature de l’Esprit devient reconnaissable par son action.
- source_word: δύναμις
  choice: puissance
  rationale: Préserve le contraste du passage entre la puissance de l’Esprit venu d’en haut et l’impuissance de l’esprit terrestre.
theological_decisions:
- issue: Identification de « l’Esprit de la divinité »
  choice: Employer « Esprit » avec une majuscule tout en conservant le complément « de la divinité »
  alternative: « esprit divin » ou « Esprit de Dieu »
  rationale: Le contexte désigne l’Esprit saint et son action prophétique, mais la traduction garde la formulation particulière du grec au lieu de la normaliser en une expression théologique plus familière.
- issue: Syntaxe elliptique de la seconde phrase grecque
  choice: « Telle est la puissance de l’Esprit de la divinité du Seigneur. »
  alternative: « Quant à l’Esprit de la divinité du Seigneur, telle est sa puissance. »
  rationale: La formulation retenue restitue clairement le sens de la construction grecque difficile sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « l’Esprit de la divinité » est conservée parce qu’elle structure le propos grec et maintient sa formulation théologique propre.
