  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/006.yaml
  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: fr
  text: 6. Mais l’esprit que l’on consulte et qui parle selon les désirs des gens est terrestre et léger, dépourvu de puissance ; il ne parle absolument pas à moins d’être consulté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἐπερωτώμενον
  choice: l’esprit que l’on consulte
  rationale: Rend naturellement le participe passif et maintient le contraste avec l’Esprit venant de Dieu, qui parle sans être interrogé.
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: selon les désirs des êtres humains
  rationale: « Désirs » conserve la portée générale de ἐπιθυμίαι sans lui imposer ici le sens exclusivement négatif de « convoitises » ; la formulation est inclusive et actuelle.
- source_word: ἐπίγειον
  choice: terrestre
  rationale: Équivalent direct qui préserve l’opposition spatiale et théologique avec ce qui vient d’en haut.
- source_word: ἐλαφρόν
  choice: inconsistant
  rationale: Dans ce contexte, le terme désigne l’absence de poids, de sérieux et de substance plutôt que la légèreté physique ; « inconsistant » est idiomatique en français.
- source_word: δύναμιν μὴ ἔχον
  choice: dépourvu de puissance
  rationale: Préserve l’affirmation forte d’une absence de puissance, reprise dans le contexte immédiat.
- source_word: ὅλως οὐ λαλεῖ
  choice: il ne parle absolument pas
  rationale: Rend l’emphase de ὅλως οὐ sans alourdir excessivement la phrase.
theological_decisions:
- issue: Distinction entre l’esprit divin et l’esprit du faux prophète
  choice: Conserver « l’esprit » en minuscule et décrire celui-ci comme terrestre et impuissant
  alternative: Employer « Esprit » ou expliciter « esprit mauvais »
  rationale: Le grec parle ici du πνεῦμα consulté et terrestre, mais ne le qualifie pas explicitement de démoniaque dans ce verset. La traduction maintient donc la distinction contextuelle sans ajouter une identification doctrinale.
- issue: Nature de l’absence de puissance
  choice: « dépourvu de puissance »
  alternative: « sans aucun pouvoir »
  rationale: '« Puissance » fait écho au vocabulaire récurrent de δύναμις dans toute la section et laisse ouverte sa portée précise : autorité, efficacité ou capacité spirituelle.'
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique du grec est conservée, avec une syntaxe naturelle. Aucun appel de note n’est nécessaire.
