base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/015.yaml
  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: fr
  text: '19. « Comment cela peut-il se produire, Seigneur ? dis-je. Car tu as dit que ces deux choses étaient impossibles. » Il dit : « De même que ces choses sont impossibles, de même les esprits terrestres sont impuissants et inactifs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans le dialogue visionnaire, ce vocatif respectueux désigne l’interlocuteur qui instruit Hermas. « Seigneur » conserve le registre ancien et dignifié sans préciser davantage son identité.
- source_word: ἀδύνατα / ἀδύνατά
  choice: impossibles
  rationale: Dans les deux premières occurrences, le terme qualifie les deux phénomènes évoqués dans le contexte antérieur comme ne pouvant se produire.
- source_word: ἀδύνατά ἐστι καὶ ἀδρανῆ
  choice: sont impuissants et inactifs
  rationale: Appliqué aux esprits terrestres, ἀδύνατα prend naturellement le sens d’« impuissants », tandis que ἀδρανῆ indique qu’ils sont sans action ni efficacité.
- source_word: γενέσθαι
  choice: se produire
  rationale: Cette formulation rend naturellement l’idée que les faits évoqués puissent arriver ou devenir réalité.
- source_word: τὰ πνεύματα τὰ ἐπίγεια
  choice: les esprits terrestres
  rationale: Traduction directe qui préserve l’opposition du passage entre ce qui vient d’en haut et les esprits liés à la terre.
theological_decisions:
- issue: Sens de l’impuissance des esprits terrestres
  choice: « impuissants et inactifs »
  alternative: « impossibles et inertes »
  rationale: Le grec répète ἀδύνατα pour établir l’analogie, mais en français « des esprits impossibles » suggérerait surtout qu’ils n’existent pas. Le contexte affirme plutôt leur absence de puissance et d’efficacité; la traduction conserve cette portée sans nier explicitement leur existence.
translation_notes:
  register: Français moderne, clair et dignifié. La répétition argumentative « De même que… de même… » est maintenue. Aucun appel de note n’est requis.
