  to: '19. « Comment cela peut-il se produire, Seigneur ? dis-je. Car tu as dit que ces deux choses étaient impossibles. » Il dit : « De même que ces choses sont impossibles, de même les esprits terrestres sont impuissants et inactifs. »'
