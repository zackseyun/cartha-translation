    issue: Référence moins explicite aux « deux choses »
    rationale: ἀμφότερα ταῦτα désigne explicitement les deux réalités précédemment évoquées. « Ces deux choses étaient impossibles » conserve cette référence plus précisément que le pronom « elles ».
  - severity: low
    issue: Verbe introducteur ajouté et légèrement interprétatif
    rationale: φησίν signifie littéralement « dit-il ». « Il répondit » reste possible en contexte dialogué, mais « dit-il » suit plus étroitement la formulation grecque.
