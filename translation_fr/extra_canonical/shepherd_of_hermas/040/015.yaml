  source_fidelity: Le sens est globalement fidèle. Toutefois, « qu’elles sont toutes deux impossibles » est moins net que le grec ἀμφότερα ταῦτα (« ces deux choses »), et φησίν se rend plus directement par « dit-il » que par « Il répondit ».
  naturalness: Le français est clair et de registre approprié. La reformulation proposée allège l’incise et rend l’objection d’Hermas plus idiomatique sans perdre le pluriel du grec.
  terminology: « Seigneur », « esprits terrestres », « impuissants » et « inactifs » conviennent. « Impuissants » rend ici naturellement ἀδύνατα appliqué aux esprits, sans donner à entendre qu’ils n’existent pas.
