revisions:
- from: '8. Tout d’abord, celui qui a l’Esprit [divin] venu d’en haut est doux, paisible et humble. Il se tient à l’écart de toute méchanceté et de tout désir vain propre au monde présent, et se considère comme inférieur à tous. Quand on l’interroge, il ne répond rien à personne et ne parle pas en privé. L’Esprit saint ne parle pas non plus au gré d’un être humain : il parle lorsque Dieu veut que cet homme parle.'
  to: 8. Tout d’abord, celui qui a l’Esprit [divin] venu d’en haut est doux, paisible et humble. Il s’abstient de toute méchanceté et de tout désir vain de ce monde-ci, et il se fait le moindre de tous. Lorsqu’on l’interroge, il ne répond rien à personne et ne parle pas en privé. L’Esprit saint ne parle pas non plus lorsqu’un homme veut parler ; il parle lorsque Dieu veut que cet homme parle.
  rationale: 'La révision conserve le sens, le registre et l’ambiguïté grammaticale du grec. Elle ne transforme pas la description en doctrine systématique de l’inspiration : le texte maintient simplement que la parole de l’Esprit n’est pas déclenchée par la volonté humaine, mais par la volonté de Dieu. Aucun appel de note n’est présent ni nécessaire pour ce segment.'
  reviewer_model: gpt-5.6-terra
