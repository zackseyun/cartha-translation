  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: fr
  text: 8. Tout d’abord, celui qui a l’Esprit [divin] venu d’en haut est doux, paisible et humble. Il s’abstient de toute méchanceté et de tout désir vain de ce monde-ci, et il se fait le moindre de tous. Lorsqu’on l’interroge, il ne répond rien à personne et ne parle pas en privé. L’Esprit saint ne parle pas non plus lorsqu’un homme veut parler ; il parle lorsque Dieu veut que cet homme parle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς
  choice: doux
  rationale: Rend naturellement la douceur et l’absence d’agressivité exprimées par le grec.
- source_word: ἡσύχιος
  choice: paisible
  rationale: Dans ce portrait moral, « paisible » exprime mieux qu’un simple « silencieux » la tranquillité de conduite.
- source_word: ταπεινόφρων
  choice: humble
  rationale: Formulation française courante et digne pour l’humilité de pensée.
- source_word: ἀπεχόμενος
  choice: se tient à l’écart de
  rationale: Conserve l’idée active d’abstention et de distance.
- source_word: τοῦ αἰῶνος τούτου
  choice: propre au monde présent
  rationale: Le grec αἰών désigne ici l’ordre ou l’époque présente, non une durée précise.
- source_word: ἐνδεέστερον
  choice: inférieur
  rationale: Le comparatif indique qu’il se place plus bas ou s’estime moindre que tous les autres.
- source_word: κατὰ μόνας
  choice: en privé
  rationale: Expression idiomatique désignant une parole donnée à part, hors de l’assemblée.
- source_word: λαλεῖ
  choice: parle
  rationale: Le sujet implicite reste l’Esprit saint dans la proposition finale, tandis que l’homme est celui que Dieu veut faire parler.
theological_decisions:
- issue: Statut de l’adjectif θεῖον après πνεῦμα
  choice: Conserver « [divin] » entre crochets
  alternative: Omettre l’adjectif et traduire simplement « l’Esprit venu d’en haut »
  rationale: Les crochets de l’édition signalent une variation ou une incertitude textuelle; les conserver évite de présenter l’adjectif comme incontesté.
- issue: Référent et agent dans la dernière proposition
  choice: « il parle lorsque Dieu veut que cet homme parle »
  alternative: « l’Esprit parle quand Dieu veut qu’il parle »
  rationale: Le grec passe de l’Esprit comme sujet de λαλεῖ à l’homme comme objet de la volonté divine exprimée par αὐτόν; la formulation choisie rend cette tension grammaticale sans confondre entièrement les deux agents.
- issue: Nature de la parole prophétique
  choice: « ne parle pas au gré d’un être humain »
  alternative: « ne parle pas quand un homme veut parler »
  rationale: La syntaxe grecque est heurtée, mais le contraste porte sur l’initiative humaine face à l’initiative divine; cette formulation le rend sans ajouter de doctrine sur le mécanisme de l’inspiration.
translation_notes:
  register: Français moderne international, sobre et digne. Les phrases ont été légèrement restructurées pour éviter l’ambiguïté pronominale excessive, tout en préservant la distinction entre l’Esprit qui parle et l’homme appelé à parler. Les crochets éditoriaux autour de « divin » sont maintenus dans le corps du texte; il ne s’agit pas d’un appel de note.
