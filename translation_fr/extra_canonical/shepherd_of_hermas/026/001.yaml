base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: fr
  text: 'Avant tout, crois qu’il n’y a qu’un seul Dieu, celui qui a créé et ordonné toutes choses, qui a fait passer toutes choses du non-être à l’existence, qui contient tout, mais que rien ne peut contenir. Crois-le donc et crains-le ; et, dans cette crainte, maîtrise-toi. Observe ces choses : tu te dépouilleras de toute méchanceté et te revêtiras de toute vertu de justice, et tu vivras pour Dieu, si tu observes ce commandement.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταρτίσας
  choice: ordonné
  rationale: Le participe exprime l’idée d’organiser, d’agencer ou de mettre en ordre ; « ordonné » est naturel ici et se coordonne bien avec « créé ».
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: du non-être à l’existence
  rationale: Rend directement le contraste ontologique grec sans développer au-delà du texte.
- source_word: πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν
  choice: qui contient tout, mais que rien ne peut contenir
  rationale: Préserve le jeu antithétique entre χωρῶν et ἀχώρητος dans un français intelligible et digne.
- source_word: φοβηθείς
  choice: dans cette crainte
  rationale: Rend le participe aoriste en maintenant le lien logique entre la crainte de Dieu et la maîtrise de soi, sans lourdeur littérale.
- source_word: ἐγκράτευσαι
  choice: maîtrise-toi
  rationale: Exprime l’exercice de la maîtrise de soi, sens moral usuel du verbe dans ce contexte.
- source_word: ἀποβαλεῖς … ἐνδύσῃ
  choice: tu te dépouilleras … te revêtiras
  rationale: Conserve l’opposition imagée entre rejeter un vêtement et en revêtir un autre.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: toute vertu propre à la justice
  rationale: Conserve la relation génitive sans réduire ἀρετή à une seule qualité ni produire l’expression peu naturelle « vertu de justice ».
- source_word: ζήσῃ τῷ θεῷ
  choice: tu vivras pour Dieu
  rationale: Rend le datif τῷ θεῷ de manière naturelle tout en conservant son orientation vers Dieu.
theological_decisions:
- issue: Affirmation εἷς ἐστὶν ὁ Θεός
  choice: il n’y a qu’un seul Dieu
  alternative: Dieu est un
  rationale: La formulation choisie exprime clairement l’unicité numérique affirmée par le grec, sans imposer une terminologie doctrinale ultérieure.
- issue: Formule cosmologique sur le non-être et l’existence
  choice: a fait passer toutes choses du non-être à l’existence
  alternative: a fait toutes choses à partir de ce qui n’existait pas
  rationale: La traduction conserve la formulation abstraite et la tension du grec sans ajouter une explication dogmatique.
- issue: Relation entre crainte de Dieu et maîtrise de soi
  choice: dans cette crainte, maîtrise-toi
  alternative: après l’avoir craint, garde la maîtrise de toi
  rationale: Maintient la dépendance exprimée par le participe tout en évitant de faire de la crainte une simple étape chronologique achevée.
translation_notes:
  register: Français moderne international, clair et solennel. Le tutoiement singulier suit les impératifs grecs adressés au destinataire. Les parallélismes et les images vestimentaires sont conservés sans archaïsmes inutiles.
