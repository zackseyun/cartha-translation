  to: 'Avant tout, crois qu’il n’y a qu’un seul Dieu, celui qui a créé et ordonné toutes choses, qui a fait passer toutes choses du non-être à l’existence, qui contient tout, mais que rien ne peut contenir. Crois-le donc et crains-le ; et, dans cette crainte, maîtrise-toi. Observe ces choses : tu te dépouilleras de toute méchanceté et te revêtiras de toute vertu de justice, et tu vivras pour Dieu, si tu observes ce commandement.'
