  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/003.yaml
  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: fr
  text: « Maître, dis-je, j’ai entendu de la part de certains enseignants qu’il n’y a pas d’autre repentance que celle qui a eu lieu lorsque nous sommes descendus dans l’eau et avons reçu le pardon de nos péchés antérieurs. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια
  choice: repentance
  rationale: « Repentance » conserve le sens religieux de changement intérieur et de retour moral, sans réduire le terme au simple regret.
- source_word: κύριε
  choice: maître
  rationale: Dans cette adresse respectueuse à l’interlocuteur, « maître » évite d’identifier explicitement celui-ci au Seigneur Dieu, identification que le grec n’impose pas ici.
- source_word: παρά τινων διδασκάλων
  choice: par certains enseignants
  rationale: Cette formulation rend naturellement la provenance du propos rapporté et conserve le caractère indéfini de τινων.
- source_word: εἰς ὕδωρ κατέβημεν
  choice: nous sommes descendus dans l’eau
  rationale: Traduction concrète de l’image baptismale, sans ajouter le mot « baptême », absent du texte.
- source_word: ἄφεσιν ἁμαρτιῶν ἡμῶν τῶν προτέρων
  choice: le pardon de nos péchés passés
  rationale: « Pardon » est naturel en français pour ἄφεσις, et « passés » rend clairement προτέρων dans ce contexte.
theological_decisions:
- issue: Rapport entre la repentance et la descente dans l’eau
  choice: Conserver l’affirmation telle qu’elle est rapportée, sans expliciter davantage le rite.
  alternative: Traduire « la repentance de notre baptême » ou expliquer qu’il s’agit du baptême.
  rationale: Le grec mentionne la descente dans l’eau et le pardon, mais ne nomme pas directement le baptême; l’image et sa portée théologique doivent rester intactes sans ajout interprétatif.
- issue: Portée de ἑτέρα μετάνοια οὐκ ἔστιν
  choice: « il n’existe pas d’autre repentance »
  alternative: « on ne peut se repentir une seconde fois »
  rationale: La traduction retenue préserve la formulation absolue et sa tension théologique, sans la reformuler comme une doctrine explicitement limitée à une deuxième repentance.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe du discours rapporté est légèrement lissée, tout en maintenant l’incise « dis-je » et le vocabulaire théologique du passage.
