  source_fidelity: 'Le sens du grec est globalement respecté : l’affirmation rapportée, la descente « dans l’eau » et le pardon des péchés antérieurs sont conservés sans ajouter explicitement le terme « baptême ». « Repentance » est un rendu défendable de μετάνοια dans ce contexte. La révision proposée maintient l’indétermination et la force de l’énoncé grec.'
  naturalness: La formulation actuelle, « J’ai entendu dire, maître, dis-je, par certains enseignants », est syntaxiquement lourde et peu naturelle en français moderne, notamment en raison de la place de « par certains enseignants ». La réorganisation de l’incise et de la source du propos rend le discours direct plus fluide sans en modifier le contenu.
