  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: fr
  text: « Il ne pèche pas », dit-il. « Mais si quelqu’un reste sans se remarier, il s’acquiert un honneur plus grand et une grande gloire auprès du Seigneur[a]. Toutefois, s’il se marie, il ne pèche pas. Garde donc la pureté et la dignité, et tu vivras pour Dieu. Tout ce que je te dis et vais encore te dire, observe-le désormais, à compter du jour où tu m’as été confié, et j’habiterai dans ta maison. Tes fautes passées te seront pardonnées si tu observes mes commandements. Le pardon sera aussi accordé à tous, s’ils observent ces commandements qui sont les miens et marchent dans cette pureté. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant le Seigneur » ; l’expression grecque peut indiquer la relation avec le Seigneur ou la valeur reconnue en sa présence.'
    reason: Le groupe πρὸς τὸν Κύριον admet ici plus d’une nuance relationnelle ou évaluative.
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: reste seul
  rationale: Dans le contexte immédiat du veuvage et du remariage, l’expression désigne le fait de demeurer sans conjoint; cette formulation est naturelle sans ajouter l’idée plus précise de célibat consacré.
- source_word: περιποιεῖται
  choice: il acquiert pour lui-même
  rationale: Rend la nuance moyenne du verbe, selon laquelle la personne obtient ou se procure cet honneur, sans suggérer qu’elle le mérite par droit.
- source_word: ἁγνείαν
  choice: pureté
  rationale: Conserve le terme général du grec, qui prend ici une dimension sexuelle et morale sans être réduit à la seule continence.
- source_word: σεμνότητα
  choice: dignité
  rationale: Exprime la conduite honorable et respectable visée par le terme grec dans un français actuel.
- source_word: ζήσῃ τῷ Θεῷ
  choice: tu vivras pour Dieu
  rationale: Formulation française naturelle qui maintient l’orientation de la vie vers Dieu exprimée par le datif.
- source_word: παρεδόθης
  choice: tu m’as été confié
  rationale: Respecte le passif et le cadre narratif dans lequel Hermas a été remis à la garde ou à l’autorité de son interlocuteur.
- source_word: παραπτώμασιν
  choice: fautes
  rationale: Rend l’idée de manquements ou transgressions sans durcir automatiquement le terme en une catégorie technique.
- source_word: πορευθῶσιν
  choice: marchent
  rationale: Conserve la métaphore biblique de la conduite de vie, bien établie et compréhensible en français.
theological_decisions:
- issue: Statut moral du remariage après le décès du conjoint
  choice: « s’il se marie, il ne pèche pas »
  alternative: Reformuler comme une simple permission pastorale
  rationale: Le grec affirme explicitement l’absence de péché tout en accordant davantage d’honneur au fait de rester seul; la traduction conserve cette tension sans transformer la préférence ascétique en interdiction.
- issue: Lien entre observation des commandements et pardon
  choice: « recevront le pardon, s’ils observent »
  alternative: Atténuer la condition en disant que l’obéissance manifeste seulement un pardon déjà reçu
  rationale: La construction conditionnelle du texte associe directement le pardon à l’observation des commandements. La traduction ne résout pas cette affirmation selon un système doctrinal ultérieur.
- issue: Nature de la pureté demandée
  choice: « cette pureté »
  alternative: « ce célibat » ou « cette chasteté »
  rationale: Le grec emploie ἁγνεία et renvoie à l’exhortation précédente. « Pureté » préserve une portée potentiellement plus large que l’abstention du remariage.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue est conservé, de même que les impératifs et la répétition structurante autour du pardon, des commandements et de la pureté.
