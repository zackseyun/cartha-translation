revisions:
- from: « Il ne pèche pas, dit-il. Mais si quelqu’un reste seul, il acquiert pour lui-même un plus grand honneur et une grande gloire auprès du Seigneur[a]. Toutefois, s’il se marie, il ne pèche pas. Garde donc la pureté et la dignité, et tu vivras pour Dieu. Tout ce que je te dis et vais encore te dire, observe-le dès maintenant, depuis le jour où tu m’as été confié, et j’habiterai dans ta maison. Tes fautes passées te seront pardonnées si tu observes mes commandements. Tous aussi recevront le pardon, s’ils observent mes présents commandements et marchent dans cette pureté. »
  to: « Il ne pèche pas », dit-il. « Mais si quelqu’un reste sans se remarier, il s’acquiert un honneur plus grand et une grande gloire auprès du Seigneur[a]. Toutefois, s’il se marie, il ne pèche pas. Garde donc la pureté et la dignité, et tu vivras pour Dieu. Tout ce que je te dis et vais encore te dire, observe-le désormais, à compter du jour où tu m’as été confié, et j’habiterai dans ta maison. Tes fautes passées te seront pardonnées si tu observes mes commandements. Le pardon sera aussi accordé à tous, s’ils observent ces commandements qui sont les miens et marchent dans cette pureté. »
  rationale: Révision limitée à des améliorations de précision contextuelle et de naturel français. Elle ne modifie ni l’affirmation que le remariage n’est pas un péché, ni la valeur supérieure attribuée au fait de ne pas se remarier, ni la condition explicitement exprimée entre l’observation des commandements et le pardon.
