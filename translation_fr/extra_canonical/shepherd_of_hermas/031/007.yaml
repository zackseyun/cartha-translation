  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: fr
  text: « Si une femme, dis-je, Seigneur, ou bien un homme vient à s’endormir[a], et que l’un d’eux se marie, celui qui se marie commet-il un péché ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « s’endormir » signifie mourir.
    reason: Clarifie l’euphémisme grec tout en permettant de conserver son image dans le texte.
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue, le terme est une adresse respectueuse au personnage qui enseigne Hermas; « Seigneur » conserve la dignité et l’usage ancien sans imposer ici une identification supplémentaire.
- source_word: κοιμηθῇ
  choice: vient à s’endormir
  rationale: Le grec emploie le sommeil comme euphémisme de la mort. La traduction conserve cette image tout en indiquant en note son sens contextuel.
- source_word: γαμήσῃ / ὁ γαμῶν
  choice: se marie / celui qui se marie
  rationale: Rend directement le verbe grec sans préciser « se remarie », notion impliquée par la situation mais non exprimée lexicalement.
- source_word: μήτι ἁμαρτάνει
  choice: commet-il un péché ?
  rationale: La particule μήτι présente une question appelant normalement une réponse négative; le français naturel laisse cette attente apparaître dans le contexte sans l’expliciter davantage.
theological_decisions:
- issue: Nature du mariage envisagé après la mort d’un conjoint
  choice: Conserver « se marie »
  alternative: Traduire « se remarie »
  rationale: Le contexte concerne manifestement le conjoint survivant, mais le grec dit simplement « se marier ». La formulation retenue préserve cette proximité formelle et évite d’ajouter une qualification absente.
- issue: Métaphore de la mort comme sommeil
  choice: Maintenir l’image de l’endormissement avec une note
  alternative: Traduire directement « meurt »
  rationale: La métaphore peut porter une résonance eschatologique et appartient au langage chrétien ancien; il convient de ne pas l’effacer.
translation_notes:
  register: Dialogue simple, solennel et actuel. L’ordre de la phrase reste proche du grec, mais la ponctuation française distingue clairement l’incise du narrateur et la question.
