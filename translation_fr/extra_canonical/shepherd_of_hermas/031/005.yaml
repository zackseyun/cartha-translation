lexical_decisions:
- source_word: ἀνέχῃ μου
  choice: Sois patient avec moi
  rationale: L’expression demande à l’interlocuteur de continuer à supporter les questions du locuteur ; cette formulation est naturelle en français moderne et convient au ton respectueux du dialogue.
- source_word: δήλωσον
  choice: explique-moi
  rationale: Le verbe signifie ici rendre une chose claire ou la faire comprendre, plutôt que simplement la déclarer.
- source_word: ἔτι … καὶ τοῦτο
  choice: encore ceci
  rationale: Cette tournure restitue la demande d’un éclaircissement supplémentaire sans alourdir la phrase.
