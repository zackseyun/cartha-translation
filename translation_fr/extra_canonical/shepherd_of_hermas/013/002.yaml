base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: fr
  text: « Et ceux que l’on tire des profondeurs, que l’on place dans l’édifice et dont les jointures s’accordent avec celles des autres pierres déjà bâties, qui sont-ils ? » « Ce sont ceux qui ont souffert à cause du nom du Seigneur. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: des profondeurs
  rationale: Rend le lieu profond ou l’abîme d’où les pierres sont retirées, sans imposer ici la connotation plus forte du mot français « abîme ».
- source_word: ἑλκόμενοι
  choice: que l’on retire
  rationale: Exprime le mouvement par lequel les pierres sont tirées vers le haut depuis les profondeurs, de façon naturelle en français.
- source_word: ἐπιτιθέμενοι εἰς τὴν οἰκοδομήν
  choice: que l’on place dans la construction
  rationale: Conserve l’image concrète de pierres posées dans l’ouvrage.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: dont les jointures s’accordent
  rationale: Préserve le vocabulaire architectural et l’idée d’un ajustement harmonieux.
- source_word: τῶν ἤδη ᾠκοδομημένων
  choice: déjà intégrées à l’édifice
  rationale: Le participe passif désigne les pierres déjà employées dans la construction; cette formulation évite l’étrange littéralisme « déjà construites ».
- source_word: οἱ παθόντες
  choice: ceux qui ont souffert
  rationale: Traduction directe qui ne précise pas au-delà du grec la nature ni l’issue de leurs souffrances.
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: à cause du nom du Seigneur
  rationale: Maintient l’expression théologique du texte et sa référence au « nom », sans la paraphraser.
theological_decisions:
- issue: Nature de ceux qui ont souffert pour le nom du Seigneur
  choice: ceux qui ont souffert
  alternative: les martyrs
  rationale: Le grec παθόντες indique qu’ils ont souffert, mais ne dit pas explicitement qu’ils ont été mis à mort; « martyrs » résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français moderne, digne et lisible. La question et la réponse sont conservées sous forme de dialogue; l’image architecturale reste concrète sans lourdeur excessive.
