  source_fidelity: 'Le sens général est fidèlement rendu, ainsi que la triple activité exercée auprès des élus et le parallélisme entre l''ajustement des pierres et la concorde mutuelle. Toutefois, « dont les jointures s’accordent entre elles » déplace légèrement l''image grecque : les pierres s''ajustent à leurs jointures. « Selon la dignité révérencieuse de Dieu » est aussi trop littéral et peu idiomatique ; le grec exprime une conduite conforme à la dignité/gravité qui convient à Dieu.'
