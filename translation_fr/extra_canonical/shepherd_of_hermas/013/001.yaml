base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: fr
  text: « Écoute maintenant ce qui concerne les pierres qui entrent dans la construction. Les pierres carrées, blanches et qui s’ajustent à leurs jointures, ce sont les apôtres, les responsables[a], les enseignants et les serviteurs[b], qui ont vécu avec la dignité qui convient à Dieu. Ils ont veillé sur les élus de Dieu, les ont enseignés et servis avec pureté et dignité — les uns se sont endormis, les autres sont encore en vie. Ils ont toujours été en accord les uns avec les autres, ont vécu en paix entre eux et se sont écoutés mutuellement. Voilà pourquoi leurs jointures s’accordent dans la construction de la tour. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : episkopoi, c’est-à-dire des personnes chargées de veiller sur la communauté ; le mot est aussi traditionnellement traduit par « évêques ».'
    reason: Signale la possibilité d’un titre ecclésial sans imposer une compréhension institutionnelle plus tardive.
  - marker: b
    text: 'Grec : diakonoi, également traduit par « diacres ».'
    reason: Préserve à la fois le sens de service et la possibilité d’un ministère désigné par un titre.
lexical_decisions:
- source_word: ὑπαγόντων εἰς τὴν οἰκοδομήν
  choice: qui entrent dans la construction
  rationale: Rend le mouvement des pierres destinées à prendre place dans l’édifice, en français naturel.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: dont les jointures s’accordent entre elles
  rationale: Conserve l’image architecturale et le champ lexical de l’accord, repris plus loin pour les relations entre les personnes.
- source_word: ἐπίσκοποι
  choice: responsables
  rationale: Dans ce texte ancien, le terme désigne des personnes chargées de veiller sur la communauté; « responsables » évite d’imposer au passage une structure ecclésiastique ultérieure, tandis que la note signale le sens littéral.
- source_word: διάκονοι
  choice: serviteurs
  rationale: Préserve le sens fonctionnel de service et son lien avec le verbe διακονήσαντες, sans présupposer un titre institutionnel précis.
- source_word: κατὰ τὴν σεμνότητα τοῦ Θεοῦ
  choice: selon la dignité révérencieuse de Dieu
  rationale: σεμνότης associe dignité, gravité morale et respect religieux; la formulation garde cette densité sans réduire l’expression à la seule piété.
- source_word: ἐπισκοπήσαντες
  choice: ont veillé sur
  rationale: Rend la fonction de surveillance et de soin, tout en maintenant le lien sémantique avec ἐπίσκοποι.
- source_word: κεκοιμημένοι
  choice: se sont endormis
  rationale: Conserve l’euphémisme ancien désignant la mort et sa portée théologique implicite.
- source_word: ἀλλήλων ἤκουον
  choice: se sont écoutés mutuellement
  rationale: Traduction directe qui peut inclure écoute, attention et déférence réciproques sans trancher davantage.
theological_decisions:
- issue: Statut ecclésial de ἐπίσκοποι et διάκονοι
  choice: « responsables » et « serviteurs » avec notes lexicales
  alternative: « évêques » et « diacres »
  rationale: Le grec peut être lu comme des titres ministériels, mais leur portée institutionnelle exacte à l’époque d’Hermas ne doit pas être définie par une terminologie confessionnelle ultérieure.
- issue: Sens de « se sont endormis »
  choice: Maintien de la métaphore du sommeil
  alternative: « sont morts »
  rationale: La métaphore est authentique au texte et peut porter une nuance d’espérance eschatologique; la remplacer supprimerait cette tension.
- issue: Complément des verbes « enseigné » et « servi »
  choice: « les élus de Dieu, les ont enseignés et servis »
  alternative: « ont enseigné et servi les élus de Dieu »
  rationale: Le datif τοῖς ἐκλεκτοῖς τοῦ Θεοῦ se rapporte naturellement aux trois participes; la reformulation française rend explicitement cette portée sans ajouter « Dieu » comme objet du service.
translation_notes:
  register: 'Français moderne, international et digne. La répétition d’« accord » et de « jointures » est volontaire : elle reproduit le jeu grec entre l’ajustement architectural des pierres et la concorde des responsables. Le discours direct et la progression explicative restent simples pour une lecture publique.'
