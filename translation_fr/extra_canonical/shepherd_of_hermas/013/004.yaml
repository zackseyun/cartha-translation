base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: fr
  text: « Et ceux que l’on amène et que l’on place dans la construction, qui sont-ils ? » « Ils sont nouveaux dans la foi et fidèles. Mais les anges les exhortent à faire le bien, parce qu’on a trouvé en eux de la méchanceté. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγόμενοι καὶ τιθέμενοι
  choice: que l’on amène et que l’on place
  rationale: Rend distinctement les deux participes passifs et conserve l’image concrète des pierres intégrées à la construction.
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: nouveaux dans la foi
  rationale: Expression française naturelle qui traduit directement l’idée de personnes récemment entrées dans la foi.
- source_word: πιστοί
  choice: fidèles
  rationale: Préserve le sens adjectival du grec et sa proximité lexicale avec « foi », sans préciser davantage s’il s’agit de croyants ou de personnes dignes de confiance.
- source_word: νουθετοῦνται
  choice: les exhortent
  rationale: Exprime une admonestation destinée à corriger et à orienter la conduite, dans un français actuel et digne.
- source_word: ἀγαθοποιεῖν
  choice: faire le bien
  rationale: Rend simplement et naturellement l’infinitif grec désignant l’action bonne.
- source_word: πονηρία
  choice: méchanceté
  rationale: Conserve la dimension morale négative du terme sans la réduire à une faute précise ni l’amplifier en doctrine abstraite du mal.
theological_decisions:
- issue: Rapport entre la nouveauté dans la foi, la fidélité et la présence de πονηρία
  choice: Maintenir ensemble « nouveaux dans la foi et fidèles » et « de la méchanceté ... en eux »
  alternative: Atténuer la tension en traduisant πιστοί par « croyants » ou πονηρία par « quelque défaut »
  rationale: Le grec juxtapose explicitement leur fidélité et la découverte d’un mal moral en eux; la traduction ne doit pas résoudre cette tension.
- issue: Agent de l’exhortation
  choice: Conserver explicitement « les anges »
  alternative: Généraliser en « des messagers »
  rationale: Dans le contexte visionnaire, ἀγγέλων désigne naturellement les anges; aucune donnée du passage n’exige le sens humain de messagers.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La structure dialoguée et l’imagerie architecturale sont conservées. Aucun marqueur de note n’est requis.
