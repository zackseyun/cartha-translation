base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: fr
  text: '« Et ceux qu’ils rejetaient et lançaient de côté, qui sont-ils ? » « Ce sont ceux qui ont péché et qui veulent se repentir. C’est pourquoi ils n’ont pas été jetés loin, hors de la tour : ils seront utiles pour la construction, s’ils se repentent. Ainsi donc, ceux qui vont se repentir, s’ils se repentent, seront forts dans la foi, s’ils se repentent maintenant, pendant que la tour se construit. Mais si la construction s’achève, ils n’auront plus de place, mais ils seront rejetés. Ils n’auront plus que ceci : rester couchés près de la tour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: rejetaient et lançaient de côté
  rationale: Conserve les deux verbes grecs et l’image concrète du tri des pierres, sans les fondre en une seule action.
- source_word: μετανοῆσαι / μετανοήσωσιν
  choice: se repentir
  rationale: Rend le changement moral et spirituel exprimé par μετανοέω dans un français biblique actuel et intelligible.
- source_word: εὔχρηστοι
  choice: utiles
  rationale: Exprime directement l’aptitude future de ces pierres à servir dans la construction.
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: forts dans la foi
  rationale: Suit de près la formulation grecque tout en restant naturelle en français.
- source_word: ἔκβολοι
  choice: exclus
  rationale: Rend l’idée d’être rejeté hors de la construction ; le terme français évite une formulation matériellement maladroite tout en conservant la portée communautaire de l’image.
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: rester étendus près de la tour
  rationale: Préserve l’image des pierres déposées au sol à côté de la tour.
theological_decisions:
- issue: Rapport entre désir de repentance et repentance effective
  choice: Maintenir la distinction entre « veulent se repentir » et « s’ils se repentent »
  alternative: Présenter leur intention comme une repentance déjà accomplie
  rationale: Le grec distingue explicitement θέλοντες μετανοῆσαι de la condition répétée ἐὰν μετανοήσωσιν ; cette tension ne doit pas être résolue.
- issue: Limite temporelle de la repentance dans l’image de la tour
  choice: Conserver « maintenant, pendant que la tour se construit » et l’absence de place après son achèvement
  alternative: Généraliser en une affirmation doctrinale explicite sur le jugement dernier
  rationale: Le texte parle dans le cadre symbolique de la construction ; la traduction ne doit pas identifier davantage cette échéance que ne le fait la source.
- issue: Sens de ἔκβολοι
  choice: « exclus »
  alternative: « jetés dehors »
  rationale: « Exclus » transmet la conséquence sans imposer au symbole une interprétation plus précise ; l’image matérielle du rejet est déjà présente au début du passage.
translation_notes:
  register: Français moderne, digne et accessible. La répétition insistante de « s’ils se repentent » est largement conservée, car elle structure l’avertissement grec. Les temps verbaux distinguent la scène observée, l’explication présente et les conséquences futures.
