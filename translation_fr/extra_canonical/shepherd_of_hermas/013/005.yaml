revisions:
- from: '« Et ceux qu’ils rejetaient et lançaient de côté, qui sont-ils ? » « Ce sont ceux qui ont péché et qui veulent se repentir. C’est pourquoi ils n’ont pas été jetés loin, hors de la tour : ils seront utiles à la construction, s’ils se repentent. Ainsi, ceux qui sont sur le point de se repentir seront forts dans la foi, s’ils se repentent maintenant, pendant que la tour se construit. Mais si la construction s’achève, ils n’auront plus de place : ils seront exclus. Il ne leur restera qu’une chose : rester étendus près de la tour. »'
  to: '« Et ceux qu’ils rejetaient et lançaient de côté, qui sont-ils ? » « Ce sont ceux qui ont péché et qui veulent se repentir. C’est pourquoi ils n’ont pas été jetés loin, hors de la tour : ils seront utiles pour la construction, s’ils se repentent. Ainsi donc, ceux qui vont se repentir, s’ils se repentent, seront forts dans la foi, s’ils se repentent maintenant, pendant que la tour se construit. Mais si la construction s’achève, ils n’auront plus de place, mais ils seront rejetés. Ils n’auront plus que ceci : rester couchés près de la tour. »'
  rationale: La révision conserve la syntaxe interrogative et le vocabulaire principal du draft, mais rétablit la double formulation conditionnelle du grec sans en résoudre la tension. Elle remplace aussi « exclus » par « rejetés », plus proche de l’image des pierres écartées, et allège légèrement la dernière expression tout en préservant κεῖσθαι (« être couché, gésir »).
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement l’enchaînement et l’imagerie du grec : péché, intention de se repentir, utilité conditionnelle pour la construction et limite liée à l’achèvement de la tour. Une correction est toutefois nécessaire pour restituer les deux propositions conditionnelles répétées en grec dans la phrase sur ceux qui vont se repentir, et pour conserver plus concrètement l’image du rejet final.'
  naturalness: Le français est clair, moderne et d’un registre convenable. « Rester étendus » est un peu pesant dans ce contexte ; « rester couchés » rend naturellement l’image de pierres gisant près de la tour. La répétition conditionnelle est volontairement maintenue dans la révision, car elle est emphatique dans la source.
  terminology: « Se repentir », « forts dans la foi » et « utiles pour la construction » conviennent bien. « Exclus » atténue l’image concrète de ἔκβολοι, qui évoque des pierres rejetées ou jetées hors de l’ouvrage ; « ils seront rejetés » préserve mieux l’image sans surinterprétation doctrinale.
  issues:
  - severity: medium
    issue: La première condition de la phrase sur ceux qui vont se repentir n’est pas explicitement rendue.
    rationale: Le grec porte successivement ἐὰν μετανοήσωσιν, puis ἐὰν νῦν μετανοήσωσιν (« s’ils se repentent » / « s’ils se repentent maintenant »). Le draft ne conserve que la seconde condition.
  - severity: low
    issue: « Ils seront exclus » abstrait l’image de ἔκβολοι.
    rationale: Le terme désigne ce qui est rejeté ou jeté dehors. « Ils seront rejetés » conserve le caractère matériel de la métaphore des pierres tout en restant idiomatique.
