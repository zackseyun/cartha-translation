base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: fr
  text: '« Je veux savoir qui sont les autres pierres que l’on apporte de la terre ferme, Madame. » Elle dit : « Celles qui sont introduites dans la construction sans être taillées, le Seigneur les a approuvées, parce qu’elles ont marché dans la droiture du Seigneur et accompli ses commandements. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: de la terre ferme
  rationale: Dans le contraste avec les pierres tirées des profondeurs, ξηρά désigne la terre sèche ou ferme; cette expression naturelle conserve l’image spatiale.
- source_word: κυρία
  choice: Madame
  rationale: Adresse respectueuse à la femme qui explique la vision; « Madame » est moderne et digne, sans introduire un titre théologique absent du grec.
- source_word: μὴ λατομουμένους
  choice: sans être taillées
  rationale: Le verbe renvoie au travail de carrière ou à la taille de la pierre; la formulation française convient directement à l’image de construction.
- source_word: ἐδοκίμασεν
  choice: les a jugées dignes
  rationale: Le verbe signifie éprouver puis reconnaître comme approuvé; cette traduction exprime l’issue favorable sans suggérer une simple opinion.
- source_word: ἐπορεύθησαν ἐν τῇ εὐθύτητι τοῦ Κυρίου
  choice: elles ont suivi le droit chemin du Seigneur
  rationale: La métaphore de la marche et l’idée de droiture sont préservées dans une tournure française naturelle.
- source_word: κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ
  choice: ont fidèlement observé ses commandements
  rationale: κατορθόω exprime ici l’accomplissement correct ou réussi; « fidèlement observé » rend cette force plus précisément que le simple « gardé ».
theological_decisions:
- issue: Rapport entre l’approbation du Seigneur et l’obéissance
  choice: Conserver explicitement le lien causal indiqué par ὅτι
  alternative: Atténuer en disant seulement qu’elles étaient droites et obéissantes
  rationale: Le grec affirme que le Seigneur les a approuvées parce qu’elles ont marché dans sa droiture et accompli ses commandements; la traduction ne doit ni supprimer ni développer cette tension théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue visionnaire reste clair; les pierres sont reprises par des pronoms féminins, conformément au genre du nom français.
