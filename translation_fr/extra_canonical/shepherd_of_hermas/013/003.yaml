review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l'image des pierres venant de la terre ferme et leur entrée dans la construction. Toutefois, « les a jugées dignes » est plus interprétatif que ἐδοκίμασεν (« les a approuvées après les avoir mises à l'épreuve »), et « fidèlement » ajoute une nuance non exprimée. « Suivi le droit chemin » explicite une image de chemin qui n'est pas dans le grec, où il est question de marcher « dans la droiture du Seigneur ».
  naturalness: Le français est clair et d'un registre approprié. « Celles qui entrent dans la construction » est compréhensible, mais « sont introduites dans la construction » rend plus naturellement le participe passif et l'image constructive.
  terminology: « Madame » convient à κυρία comme adresse respectueuse sans surcharger le terme d'un titre doctrinal. « Terre ferme », « taillées », « Seigneur » et « commandements » sont appropriés.
  issues:
  - severity: low
    issue: ἐδοκίμασεν traduit par « les a jugées dignes »
    rationale: Le verbe signifie d'abord mettre à l'épreuve, puis approuver. « Les a approuvées » conserve mieux le résultat exprimé sans ajouter le critère de dignité.
  - severity: low
    issue: Ajout de « fidèlement » et développement du « droit chemin »
    rationale: Le grec dit qu'elles ont marché dans la droiture du Seigneur et accompli ses commandements. La révision restitue cette formulation sans ajouter « fidèlement » ni l'image absente d'un chemin.
  revised_text: '« Je veux savoir qui sont les autres pierres que l’on apporte de la terre ferme, Madame. » Elle dit : « Celles qui sont introduites dans la construction sans être taillées, le Seigneur les a approuvées, parce qu’elles ont marché dans la droiture du Seigneur et accompli ses commandements. »'
