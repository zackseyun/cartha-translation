- from: '« Je veux savoir qui sont les autres pierres que l’on apporte de la terre ferme, Madame. » Elle répondit : « Celles qui entrent dans la construction sans être taillées, le Seigneur les a jugées dignes, parce qu’elles ont suivi le droit chemin du Seigneur et ont fidèlement observé ses commandements. »'
  to: '« Je veux savoir qui sont les autres pierres que l’on apporte de la terre ferme, Madame. » Elle dit : « Celles qui sont introduites dans la construction sans être taillées, le Seigneur les a approuvées, parce qu’elles ont marché dans la droiture du Seigneur et accompli ses commandements. »'
  rationale: Révision limitée pour rendre plus précisément ἐδοκίμασεν, ἐπορεύθησαν ἐν τῇ εὐθύτητι et κατωρθώσαντο, tout en conservant le dialogue, l'image architecturale et le lien causal du grec.
