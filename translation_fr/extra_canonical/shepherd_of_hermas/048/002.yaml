revisions:
- from: '« Comment cela se fait-il, Seigneur ? demandai-je. Fais-le-moi comprendre. »


    « Écoute, dit-il. Le riche possède beaucoup d’argent, mais il est pauvre dans ce qui concerne le Seigneur, car le souci de sa richesse l’accapare. Sa confession et sa prière adressées au Seigneur sont très limitées ; même ce qu’il en a est faible, languissant et sans force pour s’élever. Quand donc le riche vient en aide au pauvre et lui fournit ce dont il a besoin, il croit que ce qu’il accomplit pour lui lui vaudra une récompense auprès de Dieu. En effet, le pauvre est riche en prière [et en confession][a], et sa prière a une grande force auprès de Dieu. Le riche fournit donc au pauvre tout ce qu’il lui faut, sans hésiter.


    Le pauvre, soutenu par le riche, prie pour lui et remercie Dieu au sujet de celui qui lui donne. Quant au riche, il redouble d’empressement envers le pauvre, afin que celui-ci ne manque de rien durant sa vie[b] ; car il sait que la prière du pauvre est agréée et riche devant Dieu.


    Ainsi, tous deux accomplissent l’œuvre : le pauvre exerce la prière dans laquelle il est riche, [celle qu’il a reçue du Seigneur][c] ; il la rend au Seigneur en faveur de celui qui le soutient. De même, le riche met sans hésiter au service du pauvre la richesse qu’il a reçue du Seigneur. C’est là une œuvre grande et agréable à Dieu, car le riche a compris le sens de sa richesse : il a œuvré en faveur du pauvre avec les dons du Seigneur et il a correctement accompli le service que le Seigneur lui avait confié.


    Aux yeux des hommes, l’orme semble donc ne pas porter de fruit. Ils ne savent ni ne comprennent que, lorsqu’une sécheresse survient, l’orme, qui conserve de l’eau, nourrit la vigne ; et la vigne, continuellement alimentée en eau, donne deux fois plus de fruit : pour elle-même et pour l’orme. De même, les pauvres, en priant le Seigneur en faveur des riches… »'
