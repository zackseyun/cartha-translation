  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/002.yaml
  text: '‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his reward from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without hesitation. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and rich before God. Therefore both complete the work: the needy
    performs the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without hesitation provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that, if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy, interceding with the Lord on behalf of the rich...'
translation:
  language: fr
  text: '« Comment cela, monsieur ? demandai-je. Fais-le-moi comprendre. »


    « Écoute, dit-il. Le riche possède beaucoup d’argent, mais il est pauvre à l’égard du Seigneur, car il est absorbé par sa richesse. Il a fort peu de confession et d’intercession envers le Seigneur ; et ce peu est faible, languissant et sans force pour monter là-haut. Quand donc le riche va vers le pauvre et lui fournit ce qui est nécessaire, il croit que ce qu’il fait pour le pauvre lui vaudra une récompense de la part de Dieu. Car le pauvre est riche en intercession [et en confession][a], et son intercession a une grande force auprès de Dieu. Le riche fournit donc au pauvre tout ce dont il a besoin, sans hésiter.


    Le pauvre, soutenu par le riche, intercède pour lui, en remerciant Dieu pour celui qui lui donne. Quant au riche, il s’empresse davantage encore de prendre soin du pauvre, afin que celui-ci ne manque de rien durant sa vie[b] ; car il sait que l’intercession du pauvre est agréée et abondante auprès de Dieu.


    Ainsi, tous deux accomplissent l’œuvre : le pauvre exerce l’intercession dans laquelle il est riche, [celle qu’il a reçue du Seigneur][c] ; il la rend au Seigneur pour celui qui le soutient. De même, le riche fournit sans hésiter au pauvre la richesse qu’il a reçue du Seigneur. C’est là une œuvre grande et agréable à Dieu, car il a compris ce qu’il en est de sa richesse, il a œuvré pour le pauvre avec les dons du Seigneur et il a correctement accompli le service du Seigneur.


    Aux yeux des hommes, l’orme semble donc ne pas porter de fruit. Ils ne savent ni ne comprennent que, lorsqu’une sécheresse survient, l’orme, qui a de l’eau, nourrit la vigne ; et la vigne, ayant de l’eau sans interruption, donne un fruit double, pour elle-même comme pour l’orme. De même, les pauvres, en intercédant auprès du Seigneur pour les riches… »'
  philosophy: optimal-equivalence
