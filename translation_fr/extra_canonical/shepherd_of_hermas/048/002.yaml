lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue, le terme est une adresse respectueuse au personnage qui enseigne Hermas. « Seigneur » conserve la dignité et l’ambiguïté du grec, sans l’identifier explicitement à Dieu.
- source_word: ἐξομολόγησιν
  choice: confession
  rationale: Le mot peut désigner la confession, la reconnaissance ou la louange. « Confession » préserve la largeur religieuse du terme et sa distinction d’avec ἔντευξις.
- source_word: ἔντευξιν
  choice: prière
  rationale: Dans ce passage, le terme désigne une requête adressée à Dieu, souvent faite en faveur d’autrui. « Prière » est naturel en français, tandis que le contexte exprime clairement sa dimension d’intercession.
- source_word: πένητα
  choice: pauvre
  rationale: Le grec désigne une personne démunie qui doit travailler ou dépendre d’un soutien, sans nécessairement être totalement indigente. « Pauvre » convient au contraste constant avec πλούσιος.
- source_word: ἐπιχορηγεῖ / χορηγήσῃ
  choice: fournit / soutenu / soutient
  rationale: Le champ lexical exprime l’idée de pourvoir généreusement aux besoins. Des formulations variées et naturelles en français maintiennent ce lien sémantique dans chaque contexte.
- source_word: διακονίαν
  choice: service … confié
  rationale: « Service » rend le sens ordinaire de διακονία sans importer une fonction ecclésiastique technique ; « confié » explicite naturellement que la richesse reçue doit servir le Seigneur.
- source_word: πτελέα
  choice: orme
  rationale: Identification botanique traditionnelle et probable du grec πτελέα.
- source_word: διπλοῦν τὸν καρπὸν
  choice: deux fois plus de fruit
  rationale: Rend naturellement l’image d’un fruit double, attribué à la vigne pour elle-même et pour l’orme.
theological_decisions:
- issue: Relation entre l’aide au pauvre, sa prière et la récompense divine
  choice: 'Traduire directement la logique réciproque du passage : le riche partage les dons reçus de Dieu et le pauvre prie pour lui.'
  alternative: Atténuer cette relation afin d’éviter qu’elle paraisse transactionnelle ou méritoire.
  rationale: Le grec présente explicitement cette réciprocité et parle d’une récompense trouvée auprès de Dieu. La traduction conserve cette tension théologique sans la systématiser ni la corriger.
- issue: Force ascendante de la prière
  choice: « sans force pour s’élever »
  alternative: « inefficace auprès de Dieu »
  rationale: Le texte emploie une image spatiale, ἄνω, que la traduction conserve. Il ne dit pas simplement que Dieu refuse la prière du riche.
- issue: Richesse provenant du Seigneur
  choice: Maintenir que le riche a reçu sa richesse du Seigneur et doit la mettre au service du pauvre.
  alternative: Parler seulement de ses biens personnels ou de sa générosité.
  rationale: Cette provenance divine est explicite et fonde la responsabilité du riche dans le passage.
- issue: Identité du κύριε initial
  choice: Conserver « Seigneur » sans préciser l’identité du locuteur.
  alternative: Employer « monsieur », « maître » ou identifier directement le Christ.
  rationale: L’adresse est respectueuse, mais le segment seul ne justifie pas une identification théologique plus précise.
translation_notes:
  register: Français moderne, international et digne, avec un dialogue naturel et une imagerie agricole claire. La syntaxe a été légèrement aérée pour la lecture publique. Les répétitions structurantes autour du riche, du pauvre, de la prière et du Seigneur ont été conservées. Les passages textuellement incertains sont maintenus entre crochets et signalés par des notes.
