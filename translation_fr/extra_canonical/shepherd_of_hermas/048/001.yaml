  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the servants of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the servants of God, for the poor and the rich.
translation:
  language: fr
  text: 'Car c’est dans ce but que le Maître vous a enrichis : afin que vous accomplissiez pour lui ces services. Il est bien préférable d’acheter de tels champs[a] et des maisons, que vous trouverez dans votre ville lorsque vous y arriverez. Ce luxe-là est bon et réjouissant : il ne comporte ni tristesse ni crainte, mais procure de la joie. Ne pratiquez donc pas le luxe des nations, car il ne vous est d’aucun profit, à vous qui êtes les serviteurs de Dieu. Pratiquez plutôt votre propre luxe, celui dans lequel vous pouvez vous réjouir. Tout luxe de ce genre est profitable, tandis que celui des nations est amer et pénible. Cette parabole s’adresse donc aux serviteurs de Dieu, pauvres et riches.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins ajoutent ici : « et des propriétés ».'
    reason: Les mots grecs καὶ κτήματα sont entre crochets dans l’édition source et constituent une addition textuellement incertaine.
lexical_decisions:
- source_word: δεσπότης
  choice: le Maître
  rationale: Rend le titre d’autorité sans confondre ici δεσπότης avec κύριος; le terme reste naturel et digne en français.
- source_word: διακονίας
  choice: services
  rationale: Le pluriel désigne des actes accomplis au service de Dieu; « services » est plus immédiat que « ministères » et n’introduit pas une fonction ecclésiastique.
- source_word: πολυτέλεια
  choice: luxe
  rationale: Conserve le contraste paradoxal entre le bon luxe des serviteurs de Dieu et le luxe nuisible des nations, au lieu de l’aplanir par « générosité » ou « bienfaisance ».
- source_word: ἱλαρά
  choice: réjouissant
  rationale: Exprime le caractère joyeux et bienfaisant de ce « luxe » dans un français courant, en accord avec la mention explicite de la joie.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Préserve la formulation collective du grec et sa portée ouverte, plutôt que de préciser « païens ».
- source_word: ἀσύμφορον / σύμφορος
  choice: d’aucun profit / profitable
  rationale: Maintient l’antithèse lexicale du passage dans une formulation française naturelle.
- source_word: κεῖται εἰς
  choice: s’adresse à
  rationale: Rend idiomatiquement l’idée que la parabole est proposée ou destinée aux serviteurs de Dieu.
theological_decisions:
- issue: Identification de « votre ville »
  choice: Conserver « votre ville » sans explication dans le texte
  alternative: Préciser qu’il s’agit de la cité céleste
  rationale: Le passage emploie l’image sans l’expliciter ici; une identification directe résoudrait une dimension symbolique que le texte laisse au lecteur.
- issue: Sens du « luxe » propre aux serviteurs de Dieu
  choice: Conserver le mot « luxe » et son paradoxe
  alternative: Traduire par « générosité » ou « largesse »
  rationale: Le contexte oriente vers l’emploi charitable des richesses, mais le terme grec et l’opposition rhétorique doivent rester perceptibles sans imposer une paraphrase interprétative.
- issue: Portée de « nations »
  choice: Employer « nations »
  alternative: Employer « païens »
  rationale: « Nations » maintient l’ambiguïté lexicale et évite de transformer l’opposition éthique du passage en désignation confessionnelle trop explicite.
translation_notes:
  register: Français international moderne, accessible et soutenu. La répétition volontaire de « luxe » est maintenue pour préserver l’antithèse du grec. Les phrases ont été légèrement réarticulées afin d’éviter un style calqué, sans expliciter la symbolique de la ville ni la nature précise des services.
