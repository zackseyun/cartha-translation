  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: fr
  text: 'Homme insensé, à l’âme divisée et malheureux, ne comprends-tu pas que toutes ces choses te sont étrangères et qu’elles sont sous l’autorité d’un autre ? Car le maître de cette ville dira : « Je ne veux pas que tu habites dans ma ville ; sors plutôt de cette ville, car tu ne suis pas mes lois. » Toi donc, qui possèdes des champs, des maisons et beaucoup d’autres biens, s’il te chasse, que feras-tu de ton champ, de ta maison et de tout le reste que tu as préparé pour toi-même ? Car le maître de ce pays te dit à juste titre : « Ou bien suis mes lois, ou bien quitte mon pays. » Que vas-tu donc faire, toi qui as…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρον
  choice: insensé
  rationale: Rend l’idée d’un manque de discernement moral et pratique dans un registre digne et naturel.
- source_word: δίψυχε
  choice: partagé
  rationale: Le terme signifie littéralement « à l’âme double » et décrit une personne irrésolue ou divisée intérieurement ; « partagé » préserve cette image sans imposer une interprétation confessionnelle.
- source_word: ἀλλότριά
  choice: te sont étrangères
  rationale: Exprime que les biens n’appartiennent pas véritablement à l’interlocuteur, conformément à la métaphore de l’étranger résidant dans une ville gouvernée par un autre.
- source_word: κύριος
  choice: maître
  rationale: Dans l’image de la ville et du pays, le mot désigne leur détenteur ou souverain. « Maître » conserve aussi la possible résonance théologique sans confondre automatiquement ce personnage avec le titre divin « Seigneur ».
- source_word: τοῖς νόμοις μου χρᾶσαι / χρῶ
  choice: te conformes à mes lois / conforme-toi à mes lois
  rationale: Le grec emploie littéralement « user de, suivre » les lois ; cette formulation française communique naturellement l’obéissance attendue.
- source_word: ὑπάρξεις
  choice: biens
  rationale: Désigne ici les possessions ou ressources matérielles, terme que le contexte énumère avec champs et maisons.
- source_word: ἡτοίμασας σεαυτῷ
  choice: tu as amassé pour toi-même
  rationale: « Préparé » est possible, mais « amassé » exprime plus naturellement en français l’accumulation de biens évoquée par le contexte.
theological_decisions:
- issue: Résonance de κύριος dans la parabole
  choice: maître de la ville / maître du pays
  alternative: seigneur de la ville / seigneur du pays
  rationale: Le contexte immédiat met en scène l’autorité propriétaire d’un territoire. « Maître » rend ce sens tout en laissant subsister l’allusion possible à l’autorité divine.
- issue: Sens moral de δίψυχος
  choice: partagé
  alternative: hésitant ; à l’âme double
  rationale: « Partagé » conserve l’idée d’une volonté divisée sans réduire le terme à une simple hésitation ni produire une expression française artificielle.
translation_notes:
  register: Français international moderne, clair et digne. La traduction conserve l’adresse directe, la progression argumentative et la fin suspendue du segment grec (« ayant… »), puisque la phrase se poursuit dans l’unité suivante. Aucun marqueur de note n’est requis.
