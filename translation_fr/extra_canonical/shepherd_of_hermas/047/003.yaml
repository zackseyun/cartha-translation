base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/003.yaml
  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: fr
  text: Écoutez-moi donc, et craignez celui qui peut tout, qui peut sauver et faire périr ; gardez ces commandements, et vous vivrez pour Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: Écoutez-moi donc
  rationale: Rend directement l’impératif et la transition logique οὖν dans un français naturel.
- source_word: φοβήθητε
  choice: craignez
  rationale: Conserve le sens religieux et moral de la crainte sans l’atténuer en simple respect.
- source_word: τὸν πάντα δυνάμενον
  choice: celui qui peut tout
  rationale: Préserve la formulation grecque, qui désigne Dieu par sa capacité universelle plutôt que par un titre explicite.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: sauver et faire périr
  rationale: Maintient le contraste fort entre délivrance et destruction; «faire périr» convient au transitif ἀπολέσαι.
- source_word: τηρεῖτε
  choice: gardez
  rationale: Exprime l’observance fidèle et continue des commandements.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: vous vivrez pour Dieu
  rationale: Rend le datif τῷ Θεῷ sans résoudre excessivement sa nuance relationnelle ou orientative.
theological_decisions:
- issue: Identité de «celui qui peut tout»
  choice: Conserver la désignation indirecte
  alternative: Expliciter «Dieu, qui peut tout»
  rationale: Le grec emploie un participe substantivé et n’ajoute pas ici le nom de Dieu; la traduction évite une explicitation absente du texte.
- issue: Portée de ζήσεσθε τῷ Θεῷ
  choice: «vous vivrez pour Dieu»
  alternative: «vous vivrez en Dieu» ou «vous serez vivants aux yeux de Dieu»
  rationale: Le datif autorise plusieurs nuances; «pour Dieu» reste naturel et conserve l’orientation de la vie vers Dieu sans imposer une lecture mystique ou judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative et le parallélisme du grec sont conservés; aucune note n’est nécessaire pour ce segment.
