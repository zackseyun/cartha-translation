base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, j’ai maintenant été fortifié dans toutes les justes exigences du Seigneur, parce que tu es avec moi. Je sais que tu briseras toute la puissance du diable, et nous le dominerons et triompherons de toutes ses œuvres. Et j’espère, Seigneur, pouvoir maintenant garder ces commandements que tu as commandés, avec le Seigneur qui me fortifie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεδυναμώθην
  choice: je suis fortifié
  rationale: Conserve l’idée d’une force reçue ou conférée, exprimée par le passif grec.
- source_word: δικαιώμασι
  choice: prescriptions
  rationale: Dans ce contexte d’obéissance aux commandements, le terme désigne les exigences ou ordonnances justes du Seigneur, plutôt que la justice au sens abstrait.
- source_word: συγκόψεις
  choice: tu briseras
  rationale: Rend l’action énergique de réduire ou d’abattre la puissance du diable sans imposer l’idée plus spécifique d’une destruction totale.
- source_word: κατακυριεύσομεν
  choice: nous le dominerons
  rationale: Exprime la prise d’ascendant ou de maîtrise sur le diable indiquée par le verbe grec.
- source_word: κατισχύσομεν
  choice: nous triompherons de
  rationale: Rend l’idée de se montrer plus fort et de l’emporter sur les œuvres du diable.
- source_word: φυλάξαι
  choice: garder
  rationale: Terme naturel dans un contexte religieux, qui comprend à la fois conserver et observer fidèlement les commandements.
theological_decisions:
- issue: Rapport entre l’effort humain et la force du Seigneur
  choice: « pouvoir maintenant garder […] avec la force que le Seigneur m’accorde »
  alternative: « être maintenant capable […] le Seigneur me fortifiant »
  rationale: La formulation française naturelle maintient que l’obéissance devient possible grâce à l’action fortifiante du Seigneur, sans effacer la responsabilité du locuteur.
- issue: Référent de « Seigneur »
  choice: Conserver « Seigneur » sans préciser davantage
  alternative: Identifier explicitement Dieu, le Christ ou l’interlocuteur angélique
  rationale: Le grec présente une tension entre l’adresse κύριε et la mention du Κυρίου à la troisième personne ; la traduction ne tranche pas cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec tout en évitant les calques lourds. Aucun marqueur de note n’est requis, puisqu’aucune note n’est fournie.
