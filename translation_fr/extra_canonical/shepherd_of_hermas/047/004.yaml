  to: 'Je lui dis : « Seigneur, j’ai maintenant été fortifié dans toutes les justes exigences du Seigneur, parce que tu es avec moi. Je sais que tu briseras toute la puissance du diable, et nous le dominerons et triompherons de toutes ses œuvres. Et j’espère, Seigneur, pouvoir maintenant garder ces commandements que tu as commandés, avec le Seigneur qui me fortifie. »'
  rationale: La révision restitue plus exactement la construction et les nuances du grec, tout en gardant un français moderne. Elle ne précise pas l’identité du « Seigneur », puisque le texte ne permet pas de la fixer sans interprétation.
