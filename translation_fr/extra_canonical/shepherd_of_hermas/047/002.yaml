base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: fr
  text: Faites donc confiance à Dieu, vous qui, à cause de vos péchés, avez désespéré de votre vie, qui ajoutez péché sur péché et alourdissez votre vie. Si vous revenez au Seigneur de tout votre cœur, si vous pratiquez la justice pendant les jours qui vous restent à vivre et si vous le servez avec droiture, conformément à sa volonté, il apportera la guérison pour vos fautes passées[a], et vous aurez la force de dominer les œuvres du diable. Ne craignez absolument pas la menace du diable, car il est sans force, comme les tendons d’un mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fera une guérison pour vos fautes passées ». Le grec présente le traitement des fautes antérieures sous l’image d’une guérison.'
    reason: La construction ποιήσει ἴασιν est inhabituelle ; la note rend visible la métaphore sans imposer une interprétation doctrinale précise.
lexical_decisions:
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: avez désespéré de votre vie
  rationale: Conserve l’expression forte et inhabituelle du grec sans préciser si le désespoir porte sur le salut, l’avenir ou la vie elle-même.
- source_word: προστιθέντες ἁμαρτίαις
  choice: ajoutez péché sur péché
  rationale: Rend naturellement l’idée d’ajouter encore aux péchés déjà commis.
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: pratiquez la justice
  rationale: Exprime une conduite concrète conforme à ce qui est juste, sans réduire δικαιοσύνη à une seule notion doctrinale.
- source_word: ποιήσει ἴασιν
  choice: apportera la guérison
  rationale: Préserve la métaphore thérapeutique explicite du grec.
- source_word: κατακυριεῦσαι
  choice: dominer
  rationale: Traduit l’idée de prendre l’ascendant et d’exercer sa maîtrise sur les œuvres du diable.
- source_word: ἄτονος
  choice: sans force
  rationale: Rend le sens de faiblesse ou d’impuissance, en lien direct avec la comparaison qui suit.
- source_word: νεκροῦ νεῦρα
  choice: les nerfs d’un mort
  rationale: Conserve l’image corporelle frappante du texte grec; νεῦρα peut désigner les nerfs, tendons ou ligaments.
theological_decisions:
- issue: Rapport entre retour au Seigneur, conduite juste et guérison des péchés passés
  choice: Maintenir les propositions conditionnelles dans leur enchaînement grec
  alternative: Reformuler en termes explicites de mérite, de pénitence sacramentelle ou de justification par la foi seule
  rationale: Le passage associe directement conversion entière, pratique de la justice, service fidèle et guérison des péchés, sans exposer ici un système doctrinal détaillé.
- issue: Nature de la puissance accordée contre le diable
  choice: « vous aurez la force de dominer les œuvres du diable »
  alternative: Affirmer une absence totale de tentation ou une victoire automatique sur le diable lui-même
  rationale: Le grec porte sur la capacité de maîtriser ses œuvres, distinction qu’il faut préserver.
translation_notes:
  register: Français moderne, international et digne. La syntaxe exhortative et les répétitions du passage sont conservées, tandis que les enchaînements sont légèrement fluidifiés pour une lecture naturelle. Le tutoiement grec collectif est rendu par « vous ».
