    text: 'Littéralement : « il fera une guérison pour vos fautes passées ». Le grec présente le traitement des fautes antérieures sous l’image d’une guérison.'
    reason: La construction ποιήσει ἴασιν est inhabituelle ; la note rend visible la métaphore sans imposer une interprétation doctrinale précise.
  revision_rationale: La révision corrige la valeur de πιστεύειν avec le datif et le singulier de « menace », tout en améliorant la formulation de l’image thérapeutique. Elle préserve les conditions, les ambiguïtés et le ton exhortatif du grec.
