revisions:
- from: Croyez donc en Dieu, vous qui, à cause de vos péchés, avez désespéré de votre vie, qui ajoutez péché sur péché et alourdissez votre vie. Si vous revenez au Seigneur de tout votre cœur, si vous pratiquez la justice pendant les jours qui vous restent à vivre et si vous le servez avec droiture, conformément à sa volonté, il apportera la guérison à vos péchés passés[a], et vous aurez la force de dominer les œuvres du diable. Ne craignez absolument pas les menaces du diable, car il est sans force, comme les nerfs d’un mort.
  to: Faites donc confiance à Dieu, vous qui, à cause de vos péchés, avez désespéré de votre vie, qui ajoutez péché sur péché et alourdissez votre vie. Si vous revenez au Seigneur de tout votre cœur, si vous pratiquez la justice pendant les jours qui vous restent à vivre et si vous le servez avec droiture, conformément à sa volonté, il apportera la guérison pour vos fautes passées[a], et vous aurez la force de dominer les œuvres du diable. Ne craignez absolument pas la menace du diable, car il est sans force, comme les tendons d’un mort.
  rationale: La révision corrige la valeur de πιστεύειν avec le datif et le singulier de « menace », tout en améliorant la formulation de l’image thérapeutique. Elle préserve les conditions, les ambiguïtés et le ton exhortatif du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’appel à se tourner vers le Seigneur, à pratiquer la justice et à servir selon sa volonté, ainsi que la promesse de guérison et de victoire sur les œuvres du diable, est préservé. Deux détails demandent correction : πιστεύσατε τῷ Θεῷ exprime ici la confiance accordée à Dieu, et τὴν ἀπειλὴν est au singulier (« la menace »).'
  naturalness: Le français est globalement moderne et soutenu. « Il apportera la guérison à vos péchés passés » reste cependant peu idiomatique et risque de faire des péchés les bénéficiaires de la guérison. « Il apportera la guérison pour vos fautes passées » conserve l’image tout en étant naturel.
  terminology: « Pratiquer la justice », « servir avec droiture », « œuvres du diable » et « sans force » correspondent bien au registre et au vocabulaire du passage. « Tendons d’un mort » rend plus naturellement νεῦρα dans cette comparaison, tout en laissant la note signaler l’éventail sémantique possible.
  issues:
  - severity: medium
    issue: πιστεύσατε τῷ Θεῷ rendu par « Croyez donc en Dieu »
    rationale: Le datif μετά πιστεύειν porte ici sur la confiance accordée à Dieu (« croyez Dieu » / « faites confiance à Dieu »), non d’abord sur la simple croyance en son existence. « Faites donc confiance à Dieu » est clair et fidèle.
  - severity: low
    issue: τὴν ἀπειλὴν rendu par « les menaces »
    rationale: 'Le grec emploie le singulier : il s’agit de « la menace du diable ».'
  - severity: medium
    issue: « il apportera la guérison à vos péchés passés »
    rationale: La formulation française est syntaxiquement maladroite et peut suggérer que les péchés eux-mêmes sont guéris. « Pour vos fautes passées » conserve la construction imagée de ποιήσει ἴασιν sans modifier le sens.
  revised_text: Faites donc confiance à Dieu, vous qui, à cause de vos péchés, avez désespéré de votre vie, qui ajoutez péché sur péché et alourdissez votre vie. Si vous revenez au Seigneur de tout votre cœur, si vous pratiquez la justice pendant les jours qui vous restent à vivre et si vous le servez avec droiture, conformément à sa volonté, il apportera la guérison pour vos fautes passées[a], et vous aurez la force de dominer les œuvres du diable. Ne craignez absolument pas la menace du diable, car il est sans force, comme les tendons d’un mort.
  revised_footnotes:
