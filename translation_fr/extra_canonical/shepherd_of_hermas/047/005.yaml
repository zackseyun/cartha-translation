translation:
  language: fr
  text: « Tu les observeras, dit-il, si tu retournes dans ta propre ville.[a] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec fourni est lacunaire et raccorde apparemment deux passages distincts : « Tu les observeras, dit-il, si… » vient de la fin du contexte précédent, tandis que « retourner dans sa propre ville » appartient à la première Similitude. La phrase française traduit ce fragment tel qu’il est transmis, sans prétendre restituer la liaison perdue.'
    reason: Avertir le lecteur de la corruption manifeste de la source normalisée et éviter de présenter le raccord comme une phrase grecque assurée.
lexical_decisions:
- source_word: φυλάξεις
  choice: tu les observeras
  rationale: Le verbe φυλάσσω signifie ici garder ou mettre en pratique les commandements mentionnés dans le contexte précédent.
- source_word: 'ἀνακάμψαι (texte OCR : ἡ κάμψαι)'
  choice: retournes
  rationale: La leçon reconnaissable dans le passage de la première Similitude est ἀνακάμψαι, « revenir, retourner », plutôt que l’idée littérale de « se courber » retenue par la couche anglaise.
- source_word: εἰς τὴν ἰδίαν πόλιν
  choice: dans ta propre ville
  rationale: Rend directement le mouvement vers la ville qui appartient en propre à la personne.
theological_decisions:
- issue: Raccord entre la fin du Mandement précédent et la première Similitude
  choice: Conserver le bref segment fourni tout en signalant que le témoin transmis est disjoint
  alternative: Reconstituer silencieusement soit la fin complète du Mandement, soit la phrase complète de la Similitude
  rationale: 'Le grec fourni résulte manifestement d’une lacune ou d’un raccord OCR : φυλάξεις, φησίν, ἐὰν appartient au contexte précédent, tandis que ἀνακάμψαι εἰς τὴν ἰδίαν πόλιν appartient à la Similitude 1. Une reconstruction silencieuse créerait une certitude textuelle absente des données.'
translation_notes:
  register: Français moderne, sobre et digne. « Observer » convient au registre des commandements sans être archaïque. Le tutoiement suit l’adresse grecque au singulier.
