review_pass:
  verdict: revise
  source_fidelity: 'La formulation française proposée suppose une continuité syntaxique entre deux fragments qui ne relèvent pas du même contexte. Le grec de l’unité est manifestement corrompu ou mal segmenté : « φυλάξεις, φησίν, ἐὰν » conclut le discours précédent (« Tu les observeras, dit-il, si… »), tandis que « ἀνακάμψαι εἰς τὴν ἰδίαν πόλιν » appartient à l’ouverture de la Similitude 1 et dépend d’un sujet et d’une structure absents. Traduire « si tu retournes » introduit un sujet explicite et présente comme complète une proposition que la source fournie ne permet pas d’établir.'
  naturalness: « Tu les observeras, dit-il, si tu retournes dans ta propre ville » est fluide en français, mais cette fluidité masque une lacune et un raccord textuel. Une restitution fragmentaire avec points de suspension est plus honnête, tout en restant lisible.
  terminology: « Observer » convient très bien pour φυλάξεις, au sens d’observer les commandements. Pour ἀνακάμψαι, « retourner » est un choix approprié; toutefois, dans cet état lacunaire, l’infinitif doit être conservé plutôt qu’être transformé en « tu retournes ». « Sa propre ville » rend plus fidèlement ἰδίαν πόλιν que « ta propre ville », puisque le possesseur n’est pas récupérable de façon certaine dans le fragment isolé.
  issues:
  - severity: medium
    issue: Sujet et forme verbale ajoutés dans la seconde proposition
    rationale: Le texte fourni porte un infinitif (« ἀνακάμψαι », sous la forme OCR défectueuse « ἡ κάμψαι »), non une deuxième personne finie. « Si tu retournes » est une reconstruction interprétative qui n’est pas assurée.
  - severity: medium
    issue: Continuité syntaxique présentée comme certaine
    rationale: Les mots transmis juxtaposent la fin d’une condition du contexte antérieur et un fragment de phrase de la Similitude 1. La traduction doit signaler visuellement la rupture, non seulement l’expliquer en note.
  - severity: low
    issue: Possessif « ta » indûment déterminé
    rationale: Le fragment disjoint ne fournit pas avec certitude le référent de ἰδίαν; « sa propre ville » préserve mieux l’indétermination après l’infinitif.
  revised_text: « Tu les observeras, dit-il, si… — retourner dans sa propre ville.[a] »
  revised_footnotes:
  - marker: a
    text: Le texte grec fourni est lacunaire et raccorde apparemment deux passages distincts. « Tu les observeras, dit-il, si… » appartient à la fin du contexte précédent, tandis que « retourner dans sa propre ville » (grec probablement ἀνακάμψαι εἰς τὴν ἰδίαν πόλιν; l’OCR porte ἡ κάμψαι) relève de la première Similitude. Les points de suspension et le tiret signalent la rupture; le sujet de l’infinitif n’est pas restitué.
    reason: Préserver explicitement la disjonction et l’ambiguïté syntaxique du texte source normalisé, sans reconstituer une phrase continue.
  revision_rationale: La révision conserve les deux fragments effectivement présents, mais renonce à leur imposer une articulation grammaticale moderne qui n’est pas attestée. « Observer » est maintenu pour le vocabulaire des commandements; « retourner » reste l’équivalent prudent du verbe reconnu derrière la lecture OCR défectueuse. La ponctuation marque la lacune dans le texte même, et la note explique précisément la difficulté textuelle.
