  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: fr
  text: 3. « Tu écriras donc deux petits livrets et tu en enverras un à Clément et l’autre à Grapté. Clément l’enverra aux villes de l’extérieur, car cela lui a été confié ; mais Grapté exhortera les veuves et les orphelins. Toi, tu le liras dans cette ville avec les anciens qui président l’Église. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδια
  choice: petits livres
  rationale: Le diminutif désigne de petits écrits ou livrets; « petits livres » reste naturel tout en conservant la nuance formelle du grec.
- source_word: τὰς ἔξω πόλεις
  choice: les villes de l’extérieur
  rationale: Expression volontairement peu précise, qui désigne les villes situées hors de la ville présente sans ajouter une identification géographique absente du texte.
- source_word: νουθετήσει
  choice: exhortera
  rationale: Le verbe peut signifier avertir, reprendre ou instruire; « exhortera » rend ici l’idée d’une instruction pastorale pressante sans imposer une nuance exclusivement réprobatrice.
- source_word: ἀναγνωσῇ
  choice: feras la lecture publique
  rationale: Dans ce contexte ecclésial, le verbe désigne la lecture à haute voix devant l’assemblée; cette formulation explicite naturellement la portée publique.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Rend le titre communautaire grec sans lui substituer un terme ecclésiastique français plus tardif ou confessionnel.
- source_word: προϊσταμένων
  choice: qui dirigent
  rationale: Exprime la responsabilité de présidence et de conduite exercée par les anciens, sans surdéterminer la structure institutionnelle.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Le terme désigne ici la communauté chrétienne locale; la majuscule suit l’usage français courant dans un texte ecclésial.
theological_decisions:
- issue: Nature de l’autorité confiée à Clément
  choice: « cette mission lui a été confiée »
  alternative: « cela lui a été confié »
  rationale: Le référent exact de ἐκείνῳ reste implicite. « Cette mission » produit un français clair tout en évitant de définir une charge ecclésiastique précise non explicitée par le grec.
- issue: Fonction des anciens
  choice: « les anciens qui dirigent l’Église »
  alternative: « les presbytres qui président l’Église »
  rationale: Le choix conserve la fonction de conduite indiquée par le participe grec, mais évite d’importer une terminologie ministérielle confessionnelle plus tardive.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct est conservé. Les connecteurs répétés du grec sont rendus avec une légère variation naturelle (« donc », « ensuite », « quant à », « mais »), sans effacer la progression des consignes.
