  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: fr
  text: 'Il me fut révélé, frères, pendant mon sommeil, par un jeune homme d’une très grande beauté, qui me dit : « La femme âgée de qui tu as reçu le petit livre, qui penses-tu qu’elle soit ? » Je répondis : « La Sibylle. » « Tu te trompes, dit-il, ce n’est pas elle. » « Qui est-ce donc ? » demandai-je. « L’Église », répondit-il. Je lui dis : « Pourquoi donc est-elle âgée ? » « Parce qu’elle a été créée avant toute chose, répondit-il ; voilà pourquoi elle est âgée, et c’est à cause d’elle que le monde a été organisé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν / πρεσβυτέρα
  choice: la femme âgée / âgée
  rationale: Le contexte désigne une figure féminine d’un âge avancé. « Femme âgée » est naturel et digne, tandis que « ancienne » risquerait de suggérer principalement l’ancienneté ou une fonction ecclésiale.
- source_word: βιβλίδιον
  choice: petit livre
  rationale: Rend le diminutif grec sans employer le terme plus technique « livret ».
- source_word: Σίβυλλαν
  choice: la Sibylle
  rationale: Translittération française traditionnelle du titre ou nom de la prophétesse antique.
- source_word: Ἐκκλησία
  choice: l’Église
  rationale: Le terme est ici personnifié et identifié à la femme âgée ; la majuscule marque cette référence collective personnifiée.
- source_word: πάντων πρώτη ἐκτίσθη
  choice: elle a été créée avant toute chose
  rationale: Exprime l’antériorité indiquée par πρώτη πάντων sans alourdir le français par « la première de toutes ».
- source_word: διὰ ταύτην
  choice: à cause d’elle
  rationale: Conserve la portée causale ou téléologique ouverte de διά avec l’accusatif, sans préciser davantage « pour elle » ou « en vue d’elle ».
- source_word: ὁ κόσμος κατηρτίσθη
  choice: le monde a été organisé
  rationale: καταρτίζω évoque la mise en ordre, l’agencement ou l’établissement ; « organisé » préserve cette nuance mieux que le simple « créé ».
theological_decisions:
- issue: Préexistence ou création primordiale de l’Église
  choice: « elle a été créée avant toute chose »
  alternative: « elle fut la première de toutes à être créée »
  rationale: La formulation maintient l’affirmation forte du texte concernant l’antériorité de l’Église, sans tenter de l’harmoniser avec une ecclésiologie ultérieure.
- issue: Finalité de la formation du monde
  choice: « c’est à cause d’elle que le monde a été organisé »
  alternative: « c’est pour elle que le monde a été formé »
  rationale: Le grec διὰ ταύτην peut porter une nuance causale ou téléologique. Le choix retenu reste proche de la forme grecque et évite de trancher explicitement entre cause et but.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue conserve les alternances de temps du grec sous une forme naturelle en français. Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
