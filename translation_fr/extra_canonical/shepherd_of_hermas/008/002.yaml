  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: fr
  text: 2. Ensuite, j’eus une vision dans ma maison. La femme âgée vint et me demanda si j’avais déjà remis le livre aux anciens. Je niai l’avoir remis. « Tu as bien fait, dit-elle, car j’ai des paroles à ajouter. Quand j’aurai achevé toutes les paroles, elles seront faites connaître à tous les élus par ton intermédiaire. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέπειτα
  choice: Ensuite
  rationale: Rend naturellement la succession temporelle marquée par l’adverbe grec.
- source_word: ἡ πρεσβυτέρα
  choice: la femme âgée
  rationale: Préserve ici la désignation du personnage féminin par son âge, tout en évitant la confusion avec les « anciens » ecclésiaux mentionnés ensuite.
- source_word: τὸ βιβλίον
  choice: le livre
  rationale: Correspond au terme grec dans ce segment; le contexte antérieur emploie aussi un diminutif, mais βιβλίον désigne ici simplement l’écrit à transmettre.
- source_word: τοῖς πρεσβυτέροις
  choice: aux anciens
  rationale: Terme ecclésial naturel qui maintient le lien avec les responsables de l’Église explicités dans la suite du passage.
- source_word: ῥήματα
  choice: paroles
  rationale: Conserve la portée assez large de ῥήματα, plutôt que de préciser indûment « messages » ou « révélations ».
- source_word: διὰ σοῦ γνωρισθήσεται
  choice: elles seront portées, par ton intermédiaire, à la connaissance
  rationale: Rend le passif et le rôle médiateur d’Hermas sans identifier explicitement l’agent implicite.
- source_word: τοῖς ἐκλεκτοῖς πᾶσιν
  choice: de tous les élus
  rationale: Traduction directe du vocabulaire religieux du texte, sans explicitation doctrinale.
theological_decisions:
- issue: Identité et fonction des πρεσβύτεροι
  choice: anciens
  alternative: responsables
  rationale: Le grec emploie le titre πρεσβύτεροι; « anciens » préserve le vocabulaire institutionnel sans définir davantage leur office.
- issue: Agent implicite de γνωρισθήσεται
  choice: forme passive sans agent explicité
  alternative: tu les feras connaître
  rationale: Le texte dit qu’elles seront rendues connues « par ton intermédiaire »; transformer Hermas en agent direct réduirait la nuance du passif grec.
- issue: Sens de « tous les élus »
  choice: maintien littéral de l’expression
  alternative: tous ceux que Dieu a choisis
  rationale: Le grec ne nomme pas ici l’agent de l’élection; l’expliciter résoudrait une donnée laissée implicite.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide, avec maintien du discours direct et des termes ecclésiaux du grec. Aucun appel de note n’est requis pour ce segment.
