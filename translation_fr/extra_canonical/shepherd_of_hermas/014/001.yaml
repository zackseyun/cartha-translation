revisions:
- from: '« Veux-tu savoir qui sont ceux que l’on taille en pièces et que l’on jette loin de la tour ? Ce sont les fils du mépris de la loi. Ils ont cru avec hypocrisie, et aucune forme de mal ne les a quittés. Voilà pourquoi ils n’ont pas de salut : leurs mauvaises actions les rendent impropres à la construction. Ils ont donc été taillés en pièces et jetés au loin à cause de la colère du Seigneur, car ils l’ont provoqué. »'
  to: '« Veux-tu savoir qui sont ceux que l’on met en pièces et que l’on jette loin de la tour ? Ce sont les fils de l’iniquité. Ils ont cru, mais avec hypocrisie, et toute leur méchanceté ne les a pas quittés. C’est pourquoi ils n’ont pas de salut : ils ne sont pas propres à la construction à cause de leurs méchancetés. C’est pourquoi ils ont été mis en pièces et jetés loin, à cause de la colère du Seigneur, car ils l’ont provoqué. »'
  rationale: La révision conserve le sens, le registre et les ambiguïtés du grec, tout en améliorant l’idiomaticité française et la cohérence terminologique. Elle maintient l’image violente de κατακόπτειν, le présent « ils n’ont pas de salut » et le lien causal avec la colère du Seigneur, sans ajout doctrinal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:41Z'
review_pass:
  verdict: revise
  source_fidelity: La structure et le sens général sont bien rendus, y compris la répétition de l’image des pierres détruites et rejetées. Toutefois, « fils du mépris de la loi » explicite ἀνομία d’une manière peu idiomatique et réductrice; « fils de l’iniquité » conserve mieux l’expression et sa portée morale. « Aucune forme de mal ne les a quittés » est possible, mais affaiblit le pluriel concret de πονηρίαι et alourdit inutilement la formulation.
  naturalness: Le texte est lisible et de registre approprié. « Tailler en pièces » évoque plus spontanément des personnes que des pierres; « mettre en pièces » maintient l’intensité de κατακόπτειν tout en restant compatible avec l’image architecturale. « Ils ont cru avec hypocrisie » est compréhensible mais légèrement raide; la coordination « Ils ont cru, mais avec hypocrisie » est plus naturelle sans résoudre l’ambiguïté du grec.
  terminology: '« Seigneur », « salut » et « construction » sont appropriés. « Iniquité » est ici préférable à « mépris de la loi » pour ἀνομία: le terme garde une résonance éthique et religieuse large, sans imposer une interprétation juridique étroite. « Méchancetés » rend le pluriel πονηρίαι de façon plus directe que « mauvaises actions », qui limite le terme aux actes observables.'
  issues:
  - severity: medium
    issue: Rendu de υἱοὶ τῆς ἀνομίας
    rationale: « Les fils du mépris de la loi » est une paraphrase inhabituelle en français et interprète ἀνομία comme une seule attitude envers la Loi. « Les fils de l’iniquité » préserve l’idiome et le champ sémantique plus ample du grec.
  - severity: low
    issue: Rendu de πᾶσα πονηρία / τὰς πονηρίας
    rationale: « Aucune forme de mal » et « mauvaises actions » ne reproduisent pas clairement la répétition ni le pluriel de πονηρία. « Toute leur méchanceté » et « leurs méchancetés » rendent mieux la cohésion lexicale.
  - severity: low
    issue: Formulation de ἐν ὑποκρίσει
    rationale: La formulation actuelle est littérale mais peu fluide. L’ajout de « mais » explicite naturellement la tension déjà présente dans le grec, sans transformer leur foi en simple simulation.
  revised_text: '« Veux-tu savoir qui sont ceux que l’on met en pièces et que l’on jette loin de la tour ? Ce sont les fils de l’iniquité. Ils ont cru, mais avec hypocrisie, et toute leur méchanceté ne les a pas quittés. C’est pourquoi ils n’ont pas de salut : ils ne sont pas propres à la construction à cause de leurs méchancetés. C’est pourquoi ils ont été mis en pièces et jetés loin, à cause de la colère du Seigneur, car ils l’ont provoqué. »'
