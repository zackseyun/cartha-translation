base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: fr
  text: '« Veux-tu savoir qui sont ceux que l’on met en pièces et que l’on jette loin de la tour ? Ce sont les fils de l’iniquité. Ils ont cru, mais avec hypocrisie, et toute leur méchanceté ne les a pas quittés. C’est pourquoi ils n’ont pas de salut : ils ne sont pas propres à la construction à cause de leurs méchancetés. C’est pourquoi ils ont été mis en pièces et jetés loin, à cause de la colère du Seigneur, car ils l’ont provoqué. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: que l’on taille en pièces / ont été taillés en pièces
  rationale: Le verbe exprime une action violente consistant à couper ou mettre en morceaux; la répétition française préserve le lien interne du passage et l’image des pierres rejetées.
- source_word: υἱοὶ τῆς ἀνομίας
  choice: les fils du mépris de la loi
  rationale: La tournure sémitisante « fils de » est conservée. « Mépris de la loi » rend ἀνομία comme attitude et conduite contraires à la loi, sans réduire le terme à la seule criminalité.
- source_word: ἐπίστευσαν δὲ ἐν ὑποκρίσει
  choice: Ils ont cru avec hypocrisie
  rationale: Cette formulation garde l’affirmation troublante d’une foi réelle en apparence ou mêlée d’hypocrisie, sans la transformer explicitement en fausse profession de foi.
- source_word: πᾶσα πονηρία
  choice: aucune forme de mal
  rationale: La négation française « aucune forme de mal ne les a quittés » restitue naturellement la portée globale de πᾶσα dans la construction grecque.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: impropres à la construction
  rationale: Le choix conserve la métaphore architecturale de la tour et exprime l’inaptitude des pierres à être employées dans l’édifice.
- source_word: διὰ τὰς πονηρίας αὐτῶν
  choice: leurs mauvaises actions
  rationale: Le pluriel désigne ici les manifestations concrètes de leur méchanceté; « mauvaises actions » est clair et idiomatique.
- source_word: παρώργισαν
  choice: ils l’ont provoqué
  rationale: Le verbe signifie susciter ou provoquer la colère; le pronom renvoie sans ambiguïté au Seigneur.
theological_decisions:
- issue: Nature de la foi attribuée aux personnes rejetées
  choice: « Ils ont cru avec hypocrisie »
  alternative: « Leur foi n’était qu’hypocrisie » ou « ils ont fait semblant de croire »
  rationale: Le grec affirme ἐπίστευσαν tout en qualifiant cette foi par ἐν ὑποκρίσει. La traduction conserve cette tension au lieu de décider que la foi était inexistante.
- issue: Sens de « ils n’ont pas de salut »
  choice: Formulation directe au présent
  alternative: « ils ne peuvent être sauvés »
  rationale: Le texte emploie οὐκ ἔχουσιν σωτηρίαν, littéralement « ils n’ont pas de salut ». La traduction n’ajoute ni impossibilité absolue ni théorie précise du salut.
- issue: Colère du Seigneur et responsabilité humaine
  choice: « à cause de la colère du Seigneur, car ils l’ont provoqué »
  alternative: Atténuer par « jugement » ou expliciter « provoqué sa colère »
  rationale: La formulation garde à la fois l’attribution explicite de la colère au Seigneur et la responsabilité des personnes, sans atténuation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative et les répétitions structurantes du grec sont conservées, tandis que les enchaînements sont légèrement fluidifiés pour une lecture naturelle. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est proposée.
