  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: fr
  text: '5. « Et les pierres blanches et rondes qui ne conviennent pas à la construction, qui sont-elles, Dame ? » Elle me répondit : « Jusqu’à quand seras-tu insensé et sans intelligence, posant des questions sur tout sans rien comprendre ? Ce sont ceux qui ont la foi, mais qui possèdent aussi les richesses de ce monde. Quand survient la détresse, ils renient leur Seigneur à cause de leurs richesses et de leurs affaires. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: blanches et rondes
  rationale: Conserve les caractéristiques concrètes des pierres dans la vision et leur contraste implicite avec les pierres aptes à la construction.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: qui ne s’ajustent pas à la construction
  rationale: « S’ajuster » rend l’idée d’adaptation et d’intégration matérielle au bâtiment sans ajouter d’interprétation.
- source_word: κυρία
  choice: Dame
  rationale: Titre d’adresse respectueux adressé à la figure féminine de la vision ; la majuscule marque ici l’apostrophe sans lui attribuer un titre doctrinal.
- source_word: μωρὸς ... καὶ ἀσύνετος
  choice: insensé et sans intelligence
  rationale: Maintient les deux qualificatifs grecs et leur réprimande appuyée, dans un français compréhensible et digne.
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: les richesses de ce monde
  rationale: Formulation française naturelle pour la richesse appartenant à l’âge présent, sans rendre αἰών par un terme chronologique artificiel.
- source_word: θλῖψις
  choice: détresse
  rationale: Préserve la portée générale du terme, qui peut évoquer pression, épreuve ou persécution, sans la réduire à une persécution explicitement nommée.
- source_word: πραγματείας
  choice: affaires
  rationale: Désigne naturellement les activités ou intérêts commerciaux qui les attachent à leur richesse.
- source_word: ἀπαρνοῦνται
  choice: renient
  rationale: Exprime le désaveu explicite de leur Seigneur avec la force du verbe grec.
theological_decisions:
- issue: Rapport entre foi, richesse et reniement
  choice: Traduire littéralement qu’ils « ont la foi » tout en possédant les richesses de ce monde, puis qu’ils renient leur Seigneur dans la détresse.
  alternative: Reformuler leur foi comme seulement apparente ou invalide.
  rationale: Le grec affirme ἔχοντες πίστιν sans qualifier ici cette foi ; la traduction conserve donc la tension du texte plutôt que de trancher leur statut théologique.
- issue: Nature de la θλῖψις
  choice: Employer « détresse ».
  alternative: Employer « persécution » ou « épreuve ».
  rationale: Le contexte peut inclure la persécution, mais le terme grec reste plus large ; « détresse » maintient cette ouverture.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe garde la forme dialoguée et la vigueur de la réprimande, tout en évitant les tournures archaïques. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
