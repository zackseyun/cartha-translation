review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : la richesse doit être « retranchée », selon l’image de la pierre taillée, afin que les riches deviennent εὔχρηστοι (« utiles, propres à servir ») au Seigneur. « Égare » est possible pour ψυχαγωγῶν, mais « séduit » exprime plus directement l’idée de richesse qui exerce une attraction trompeuse. La formulation révisée conserve l’indétermination du texte quant à la manière dont cette richesse est retranchée.'
  naturalness: « Utilisables pour Dieu » est compréhensible, mais demeure peu idiomatique en français moderne. « Utiles à Dieu » est plus naturel et garde le lien avec la répétition grecque de εὔχρηστοι. « Propres à la construction » rend également plus naturellement εἰς οἰκοδομήν dans le cadre de la métaphore architecturale.
  terminology: « Madame » convient à κυρία dans ce dialogue. « Seigneur », « Dieu », « richesse », « monde présent » et l’imagerie de la pierre ronde devenue carrée sont appropriés. La répétition d’« utiles » préserve la cohésion lexicale du passage.
  issues:
  - severity: low
    issue: « utilisables pour Dieu »
    rationale: Cette expression est grammaticalement possible mais peu naturelle; εὔχρηστοι τῷ Θεῷ se rend plus idiomatiquement par « utiles à Dieu ».
  - severity: low
    issue: « la richesse qui les égare »
    rationale: Le verbe ψυχαγωγέω évoque ici une séduction ou un attrait qui les détourne; « qui les séduit » est plus direct sans ajouter d’interprétation.
