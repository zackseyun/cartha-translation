  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: fr
  text: '6. Je lui répondis : « Madame, quand donc deviendront-ils propres à la construction ? » Elle dit : « Quand leur richesse, qui les séduit, aura été retranchée, alors ils seront utiles à Dieu. En effet, de même qu’une pierre ronde ne peut devenir carrée si elle n’est pas taillée et ne rejette pas une partie d’elle-même, de même ceux qui sont riches dans le monde présent ne peuvent devenir utiles au Seigneur si leur richesse n’est pas retranchée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔχρηστοι
  choice: utilisables
  rationale: Conserve l’image concrète des pierres aptes à entrer dans la construction, tout en restant naturel en français.
- source_word: οἰκοδομήν
  choice: construction
  rationale: Désigne ici l’édifice en cours de construction dans la vision et maintient la métaphore architecturale.
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: la richesse qui les égare
  rationale: Dans ce contexte négatif, ψυχαγωγέω indique que la richesse entraîne ou séduit ces personnes loin de leur véritable destination; « égare » exprime cet effet sans surcharger le texte.
- source_word: περικοπῇ
  choice: soit retranchée / être taillée
  rationale: Le verbe évoque littéralement une taille autour de la pierre; « retranchée » convient à la richesse, tandis que « taillée » rend naturellement l’action exercée sur la pierre.
- source_word: τοῦ αἰῶνος τούτου
  choice: le monde présent
  rationale: Rend l’ordre actuel du monde ou l’âge présent, sans imposer exclusivement une nuance temporelle abstraite.
theological_decisions:
- issue: Rapport entre richesse et aptitude au service de Dieu
  choice: Présenter la richesse comme devant être retranchée pour que les riches deviennent utilisables au Seigneur.
  alternative: Interpréter le passage comme exigeant explicitement l’abandon volontaire de toute possession.
  rationale: Le grec affirme la suppression de la richesse dans le cadre de la métaphore de la taille des pierres, mais ne précise ni le moyen ni les circonstances de cette suppression; la traduction préserve cette indétermination.
translation_notes:
  register: Français moderne, clair et digne. Le dialogue et la métaphore architecturale sont conservés; la répétition de « utilisables » reflète le terme grec récurrent et relie explicitement les personnes aux pierres de la vision.
