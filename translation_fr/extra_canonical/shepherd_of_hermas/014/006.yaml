- from: '6. Je lui répondis : « Madame, quand donc deviendront-ils utilisables pour la construction ? » Elle dit : « Quand la richesse qui les égare aura été retranchée, alors ils seront utilisables pour Dieu. En effet, de même qu’une pierre ronde ne peut devenir carrée sans être taillée et perdre une partie d’elle-même, de même ceux qui sont riches dans le monde présent ne peuvent devenir utilisables pour le Seigneur si leur richesse n’est pas retranchée. »'
  to: '6. Je lui répondis : « Madame, quand donc deviendront-ils propres à la construction ? » Elle dit : « Quand leur richesse, qui les séduit, aura été retranchée, alors ils seront utiles à Dieu. En effet, de même qu’une pierre ronde ne peut devenir carrée si elle n’est pas taillée et ne rejette pas une partie d’elle-même, de même ceux qui sont riches dans le monde présent ne peuvent devenir utiles au Seigneur si leur richesse n’est pas retranchée. »'
  rationale: Révision légère visant à améliorer l’idiomaticité française tout en conservant la métaphore architecturale, la répétition du vocabulaire de l’utilité et le caractère non précisé du retranchement de la richesse.
