revisions:
- from: 4. Quant aux pierres tronquées, elles représentent ceux qui ont cru et qui vivent en majeure partie dans la justice, mais chez qui subsistent certains aspects de l’iniquité. C’est pourquoi elles sont tronquées et non entières.
  to: 4. Quant aux pierres tronquées, elles représentent ceux qui ont cru et qui ont la plus grande part dans la justice, mais qui ont certains éléments d’iniquité. C’est pourquoi elles sont tronquées et incomplètes.
  rationale: Révision limitée pour rapprocher « éléments » de μέρη et employer une formulation française plus naturelle pour ὁλοτελεῖς. La tension du grec entre foi, justice majoritaire et iniquité persistante est préservée sans conclusion doctrinale ajoutée.
