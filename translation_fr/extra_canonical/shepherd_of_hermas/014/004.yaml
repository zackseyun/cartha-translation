  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: fr
  text: 4. Quant aux pierres tronquées, elles représentent ceux qui ont cru et qui ont la plus grande part dans la justice, mais qui ont certains éléments d’iniquité. C’est pourquoi elles sont tronquées et incomplètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κεκολοβωμένοι / κολοβοί
  choice: les pierres tronquées / elles sont tronquées
  rationale: Le participe désigne littéralement ce qui a été amputé ou privé d’une partie. « Tronquées » convient naturellement à l’image des pierres et conserve l’idée d’incomplétude.
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: qui vivent en majeure partie dans la justice
  rationale: Cette formulation rend l’idée d’avoir la plus grande part de leur vie ou de leur conduite dans la justice, sans transformer le passage en calcul quantitatif rigide.
- source_word: τινὰ δὲ μέρη ἔχουσιν τῆς ἀνομίας
  choice: mais chez qui subsistent certains aspects de l’iniquité
  rationale: « Aspects » restitue μέρη sans suggérer des parties physiques chez les personnes; « subsistent » exprime naturellement la présence persistante de l’iniquité.
- source_word: ὁλοτελεῖς
  choice: entières
  rationale: Dans la métaphore architecturale des pierres, « entières » garde le sens de complètes, intactes, sans surinterprétation théologique.
theological_decisions:
- issue: Relation entre foi, justice et iniquité
  choice: Conserver côte à côte la foi professée, une vie majoritairement juste et la présence de certains aspects d’iniquité.
  alternative: Interpréter explicitement ces personnes comme partiellement sauvées, imparfaitement sanctifiées ou apostates.
  rationale: Le grec décrit leur état au moyen de la métaphore des pierres sans préciser ici leur statut sotériologique. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. L’ajout explicatif « les pierres » rend le référent métaphorique évident dans ce segment isolé, tout en restant fidèle au contexte immédiat.
