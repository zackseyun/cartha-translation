  terminology: « Couverts de croûtes » préserve l’image concrète et évite un diagnostic médical artificiellement précis. « La vérité », « les saints » et « s’attacher aux saints » rendent les expressions grecques sans surinterprétation. « Inutilisables » convient au contexte des matériaux de construction.
