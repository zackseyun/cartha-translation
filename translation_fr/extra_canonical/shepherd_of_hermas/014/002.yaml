base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: fr
  text: '2. Quant aux nombreux autres que tu as vus étendus là, sans entrer dans la construction, ce sont ceux qui sont couverts de croûtes : ils ont connu la vérité, mais n’y sont pas demeurés et ne se sont pas attachés aux saints. Voilà pourquoi ils sont inutilisables.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: couverts de croûtes
  rationale: Le participe décrit littéralement des pierres atteintes d’une affection croûteuse ou rugueuse. Cette formulation conserve l’image concrète sans employer un diagnostic moderne trop précis.
- source_word: ἐγνωκότες τὴν ἀλήθειαν
  choice: ils ont connu la vérité
  rationale: Rend directement l’aoriste de γινώσκω et préserve la portée religieuse de « la vérité » sans l’expliciter davantage.
- source_word: μὴ ἐπιμείναντες δὲ ἐν αὐτῇ
  choice: mais n’y sont pas demeurés
  rationale: « Demeurer dans » restitue naturellement l’idée de persévérance exprimée par ἐπιμένω avec ἐν.
- source_word: μηδὲ κολλώμενοι τοῖς ἁγίοις
  choice: et ne se sont pas attachés aux saints
  rationale: κολλάω évoque une adhésion étroite; « s’attacher à » garde cette force relationnelle. « Les saints » demeure non interprété comme désignation des membres fidèles de la communauté.
- source_word: ἄχρηστοί
  choice: inutilisables
  rationale: Dans la métaphore de la construction, le mot signifie que les pierres ne peuvent servir à l’édifice; « inutilisables » maintient ce cadre mieux que le jugement général « inutiles ».
theological_decisions:
- issue: Identité des « saints »
  choice: Conserver « les saints » sans précision
  alternative: les croyants / le peuple saint
  rationale: Le grec τοῖς ἁγίοις ne précise pas davantage leur identité; la traduction préserve donc l’expression et son éventuelle portée ecclésiale.
- issue: Nature de la connaissance de la vérité
  choice: « ont connu la vérité »
  alternative: « sont parvenus à connaître la vérité » ou « ont reconnu la vérité »
  rationale: La formulation directe évite de décider si cette connaissance désigne une conversion pleinement accomplie, une instruction reçue ou une simple reconnaissance intellectuelle.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve la progression explicative du grec et la métaphore des pierres destinées à la construction. Le tutoiement correspond au dialogue continu entre Hermas et la Dame.
