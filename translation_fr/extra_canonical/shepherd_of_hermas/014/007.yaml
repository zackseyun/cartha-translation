review_pass:
  verdict: revise
  source_fidelity: La première exhortation et le contraste entre ἄχρηστος et εὔχρηστος sont globalement rendus, mais « inutilisable / utilisable » est inutilement technique et « tu as été employé comme l’une de ces pierres » ajoute à la fois un passé et l’idée explicite d’être une pierre. La dernière clause, χρᾶσαι ἐκ τῶν αὐτῶν λίθων, est textuellement et syntaxiquement difficile; le texte français doit éviter de la présenter comme résolue.
  naturalness: « Inutilisable », « utilisable » et surtout « utile à la vie » ne sont pas idiomatiques dans ce contexte en français moderne. « Utile » / « inutile » et « bénéfique pour la vie » conservent le parallélisme tout en étant naturels.
  terminology: « Utile à Dieu » rend bien εὔχρηστος τῷ Θεῷ, sans imposer un vocabulaire ecclésial. « La vie » est maintenu sans identifier son référent. Une note est nécessaire pour la dernière proposition, dont la leçon et la construction sont incertaines.
  issues:
  - severity: medium
    issue: Rendu trop affirmatif et surinterprété de la dernière proposition
    rationale: « Tu as été employé comme l’une de ces pierres » impose un parfait/passé et identifie explicitement le destinataire à une pierre. Ni le temps ni cette formulation ne sont assurés par χρᾶσαι ἐκ τῶν αὐτῶν λίθων.
  - severity: medium
    issue: Lexique français peu naturel
    rationale: « Inutilisable / utilisable » évoque surtout l’état matériel ou technique d’un objet; « utile / inutile » rend naturellement ἄχρηστος / εὔχρηστος. « Utile à la vie » est également maladroit en français.
  revised_text: '7. « Commence par comprendre à partir de ton propre cas : lorsque tu étais riche, tu étais inutile ; mais maintenant, tu es utile et bénéfique pour la vie. Devenez utiles à Dieu ; car toi aussi, tu viens de ces mêmes pierres.[a] »'
  revised_footnotes:
  - marker: a
    text: 'La dernière proposition traduit de façon prudente un texte grec difficile (χρᾶσαι ἐκ τῶν αὐτῶν λίθων). Elle peut aussi être comprise dans le sens de : « car toi aussi, tu es employé à partir de ces mêmes pierres » ou « sers-toi toi-même de ces mêmes pierres ».'
    reason: Signaler l’incertitude textuelle et syntaxique de la clause finale sans lui attribuer dans le corps du texte un sens plus précis que ne le permet le grec transmis.
  revision_rationale: La révision privilégie un français moderne et naturel, conserve le contraste lexical central entre inutilité et utilité, maintient l’ambiguïté de « la vie », et remplace l’interprétation excessive de la clause finale par une formulation imagée prudente, accompagnée d’une note explicative.
