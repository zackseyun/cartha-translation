base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: fr
  text: '7. « Commence par tirer leçon de ton propre cas : quand tu étais riche, tu étais inutilisable ; mais maintenant, tu es utilisable et utile à la vie. Devenez utilisables pour Dieu ; car toi aussi, tu as été employé comme l’une de ces pierres.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition repose sur un texte grec difficile. Elle peut aussi se comprendre : « car toi aussi, tu proviens de ces mêmes pierres ».'
    reason: Signaler l’incertitude syntaxique et textuelle autour de χρᾶσαι ἐκ τῶν αὐτῶν λίθων sans la masquer dans le corps du texte.
lexical_decisions:
- source_word: εὔχρηστος / ἄχρηστος
  choice: utilisable / inutilisable
  rationale: Conserve le fil de l’image de la construction et l’idée d’aptitude à l’usage, plutôt que le seul jugement général « utile / inutile ».
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: utile à la vie
  rationale: Rend littéralement le datif et préserve l’ambiguïté de « la vie », qui peut désigner la vie véritable ou la vie de la communauté.
- source_word: χρᾶσαι
  choice: tu as été employé
  rationale: Le contexte des pierres utilisées dans la construction favorise le sens passif, malgré une forme textuelle difficile.
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: Commence par tirer leçon de ton propre cas
  rationale: Expression française naturelle qui restitue l’invitation à comprendre à partir de sa propre expérience.
theological_decisions:
- issue: Rapport entre richesse et aptitude au service de Dieu
  choice: Maintenir l’affirmation directe du texte selon laquelle la richesse rendait Hermas inutilisable dans ce contexte.
  alternative: Atténuer en disant que le mauvais usage de la richesse le rendait moins utile.
  rationale: Le grec énonce sans qualification ὅτε ἐπλούτεις, ἄχρηστος ἦς ; il ne faut pas résoudre ou adoucir la tension théologique.
- issue: Référent de « la vie »
  choice: Conserver « la vie » sans explicitation.
  alternative: Traduire « la vie éternelle » ou « la communauté vivante ».
  rationale: Le texte ne précise pas le référent, et l’ambiguïté doit être préservée.
translation_notes:
  register: Français moderne, digne et accessible. Le passage du singulier (« ton propre cas », « tu ») au pluriel (« Devenez ») est conservé, puisqu’il apparaît dans le grec et élargit vraisemblablement l’exhortation aux lecteurs.
