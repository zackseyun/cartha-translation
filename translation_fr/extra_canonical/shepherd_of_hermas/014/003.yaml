base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: fr
  text: 3. « Et ceux qui ont des fissures, qui sont-ils ? Ce sont ceux qui ont quelque chose les uns contre les autres dans leur cœur et qui ne vivent pas en paix entre eux, mais qui donnent une apparence de paix. Pourtant, lorsqu’ils se séparent, leur malveillance demeure dans leur cœur. Voilà donc les fissures que ces pierres ont. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχισμάς
  choice: fissures
  rationale: Dans l’image des pierres, « fissures » rend concrètement les fentes qui symbolisent les divisions intérieures.
- source_word: κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: dans leur cœur, ont quelque chose les uns contre les autres
  rationale: Le grec laisse implicite l’objet du verbe « avoir » ; cette formulation française conserve cette indétermination sans préciser arbitrairement rancune, haine ou grief.
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: affichent un visage paisible
  rationale: Cette expression garde l’image du visage tout en exprimant naturellement le contraste entre une paix extérieure et des dispositions intérieures mauvaises.
- source_word: αἱ πονηρίαι αὐτῶν
  choice: leurs mauvaises dispositions
  rationale: Le pluriel πονηρίαι désigne ici les maux ou sentiments mauvais qui persistent dans le cœur ; « mauvaises dispositions » convient au contexte sans en réduire le sens à une faute particulière.
theological_decisions:
- issue: Nature de la rupture symbolisée par les fissures
  choice: Conserver le contraste entre paix affichée et hostilité intérieure
  alternative: Interpréter explicitement les fissures comme un schisme ecclésial formel
  rationale: Le passage décrit directement des relations interpersonnelles marquées par des griefs cachés ; il ne nomme pas explicitement une séparation institutionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore architecturale des pierres et des fissures est maintenue, ainsi que l’ambiguïté de ce que ces personnes ont les unes contre les autres.
