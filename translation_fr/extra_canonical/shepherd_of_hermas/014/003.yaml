revisions:
- from: 3. « Et ceux qui ont des fissures, qui sont-ils ? Ce sont ceux qui, dans leur cœur, ont quelque chose les uns contre les autres et ne vivent pas en paix entre eux. Ils affichent un visage paisible, mais, lorsqu’ils se séparent, leurs mauvaises dispositions demeurent dans leur cœur. Voilà donc les fissures que portent ces pierres. »
  to: 3. « Et ceux qui ont des fissures, qui sont-ils ? Ce sont ceux qui ont quelque chose les uns contre les autres dans leur cœur et qui ne vivent pas en paix entre eux, mais qui donnent une apparence de paix. Pourtant, lorsqu’ils se séparent, leur malveillance demeure dans leur cœur. Voilà donc les fissures que ces pierres ont. »
  rationale: Révision légère pour mieux rendre le contraste grec entre une paix extérieurement affichée et la malveillance qui persiste intérieurement. La métaphore des fissures et l’ambiguïté de l’objet de « ont contre » sont conservées.
