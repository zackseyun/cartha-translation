translation:
  language: fr
  text: '**Similitude 7**


    **59:1** Quelques jours plus tard, je le vis dans la même plaine où j’avais aussi vu les bergers. Il me dit : « Que demandes-tu ? » Je répondis : « Je suis venu, Seigneur, pour que tu ordonnes au berger chargé de punir de sortir de ma maison, car il m’accable terriblement. » Il me dit : « Il faut que tu sois accablé. Car l’ange glorieux a ordonné cela à ton sujet : il veut que tu sois mis à l’épreuve. » Je lui demandai : « Qu’ai-je donc fait de si mauvais, Seigneur, pour être livré à cet ange ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίωσις (titre traditionnel implicite dans la numérotation de la section)
  choice: Comparaison
  rationale: Rend naturellement le genre d’enseignement par analogie, sans imposer le sens plus étroit de « parabole ».
- source_word: πεδίον
  choice: plaine
  rationale: Équivalent direct et naturel du lieu ouvert désigné par le grec.
- source_word: ποιμένα τὸν τιμωρητήν
  choice: berger chargé de punir
  rationale: Conserve l’image du berger et la fonction punitive de τιμωρητής, tout en évitant l’expression peu naturelle « berger punisseur ».
- source_word: θλίβει / θλιβῆναι
  choice: accable / sois accablé
  rationale: Maintient la répétition grecque et exprime une détresse imposée, sans préciser indûment sa nature physique ou morale.
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: l’ange glorieux
  rationale: Traduction formelle qui préserve le caractère éminent de l’ange sans ajouter d’identification.
- source_word: πειρασθῆναι
  choice: être mis à l’épreuve
  rationale: Préserve ici le sens d’épreuve ou de test; « être tenté » orienterait trop fortement vers l’incitation au mal.
- source_word: παραδοθῶ
  choice: être livré
  rationale: Reproduit l’idée de remise au pouvoir d’un autre, avec sa gravité judiciaire.
theological_decisions:
- issue: Finalité de l’épreuve imposée à Hermas
  choice: « car il veut que tu sois mis à l’épreuve »
  alternative: « car il veut te tenter »
  rationale: Le contexte présente une discipline éprouvante; la traduction ne fait pas de l’ange l’auteur d’une sollicitation au mal.
- issue: Identité de « l’ange glorieux »
  choice: Conserver la désignation sans l’identifier
  alternative: L’assimiler explicitement à un ange particulier ou au Christ
  rationale: Le passage ne donne pas ici d’identification explicite; la traduction préserve cette réserve.
- issue: Nature de l’action du berger
  choice: « chargé de punir »
  alternative: « chargé de châtier » ou « ange du châtiment »
  rationale: Le grec le nomme berger et décrit sa fonction punitive; la formulation choisie conserve les deux éléments sans accentuer une doctrine particulière du châtiment.
translation_notes:
  register: Français moderne, courant et digne. Le dialogue reste direct et la répétition de la racine θλίβω est conservée par « accabler » afin de préserver la cohésion rhétorique. « Seigneur » est retenu comme adresse respectueuse pour κύριε, sans décider de l’identité théologique de l’interlocuteur.
