  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: fr
  text: 2. « Écoute, dit-il. Tes péchés sont nombreux, mais pas au point que tu sois livré à cet ange. Cependant, les membres de ta maison[a] ont commis de grandes transgressions et de grands péchés, et leurs actes ont irrité le glorieux ange. C’est pourquoi il a ordonné que tu sois accablé pendant quelque temps, afin qu’eux aussi se repentent et se purifient de tout désir propre au monde présent[b]. Lorsqu’ils se seront repentis et purifiés, alors l’ange chargé du châtiment se retirera. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta maison »; ici, le mot désigne la maisonnée, c’est-à-dire les personnes qui la composent.'
    reason: Clarifier le sens collectif de οἶκος, confirmé par les pronoms pluriels qui suivent.
  - marker: b
    text: 'Ou : « de toute convoitise de ce monde-ci ».'
    reason: ἐπιθυμία peut désigner plus précisément une convoitise, et αἰών peut être rendu par « monde » ou « époque » selon le contexte.
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: les membres de ta maison
  rationale: Le grec désigne ici la maisonnée, et non le bâtiment; la suite emploie le pluriel pour parler de ses membres.
- source_word: ἀνομίας
  choice: transgressions
  rationale: Rend l’idée d’actes contraires à la loi ou à l’ordre juste, tout en la distinguant de ἁμαρτίας, traduit par « péchés ».
- source_word: παρεπικράνθη
  choice: ont irrité
  rationale: Le verbe exprime le fait de provoquer vivement ou d’aigrir; « irriter » est naturel en français et conserve la force du terme.
- source_word: θλιβῆναι
  choice: sois accablé
  rationale: Le passif évoque une détresse ou une affliction imposée; « accablé » convient au contexte disciplinaire sans préciser indûment sa forme.
- source_word: ἐπιθυμίας
  choice: désir
  rationale: Terme large pouvant désigner une convoitise ou un désir mauvais; le contexte lui donne une valeur négative sans exiger un terme plus étroit.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: l’ange chargé du châtiment
  rationale: Cette formulation française naturelle préserve le rôle disciplinaire exprimé par le génitif grec.
theological_decisions:
- issue: Lien entre l’affliction d’Hermas et la repentance de sa maisonnée
  choice: Conserver explicitement la causalité du passage sans l’expliquer davantage
  alternative: Présenter l’affliction comme une expiation substitutive pour les péchés de sa famille
  rationale: Le texte affirme que son affliction doit conduire les autres à la repentance et à la purification, mais ne définit pas cette affliction comme une expiation.
- issue: Identité du « glorieux ange » et de « l’ange chargé du châtiment »
  choice: Maintenir les deux désignations sans les identifier ni les distinguer explicitement
  alternative: Affirmer qu’il s’agit du même ange ou de deux anges distincts
  rationale: Le passage mentionne les deux figures avec des fonctions différentes, mais ne tranche pas ici explicitement leur relation.
translation_notes:
  register: Français moderne, digne et accessible. Le dialogue est conservé, avec une syntaxe fluide. « Glorieux ange » maintient la formulation distinctive du texte, tandis que « monde présent » rend l’opposition eschatologique implicite de αἰὼν οὗτος sans la développer.
