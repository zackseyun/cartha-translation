  naturalness: Le français est globalement naturel et le registre convient. « Souffrir » et « connaître aucune affliction » produisent toutefois un enchaînement plus net dans l’opposition entre l’affliction du chef de maisonnée et celle des siens.
  terminology: « Seigneur », « ange glorieux » et « maisonnée » sont appropriés. « Chef » rend convenablement κεφαλή dans cette image domestique sans imposer une théorie de l’autorité. La note sur « toute » préserve correctement l’incertitude de ὅλου, entre crochets dans l’édition fournie.
