revisions:
- from: '3. Je lui dis : « Seigneur, s’ils ont commis de tels actes qu’ils ont irrité l’ange glorieux, moi, qu’ai-je fait ? » Il répond : « Ils ne peuvent pas être éprouvés autrement, à moins que toi, le chef de toute la maisonnée[a], tu ne sois éprouvé. Car lorsque tu es éprouvé, eux aussi le sont nécessairement ; mais si tu demeures ferme, ils ne peuvent subir aucune épreuve. »'
  to: '3. Je lui dis : « Seigneur, s’ils ont fait de telles choses au point d’irriter l’ange glorieux, moi, qu’ai-je fait ? » Il répond : « Ils ne peuvent souffrir, à moins que toi, le chef de toute la maisonnée[a], tu ne souffres ; car, lorsque tu souffres, eux aussi souffriront nécessairement. Mais si tu demeures ferme, ils ne peuvent connaître aucune affliction. »'
  rationale: La révision remplace « être éprouvé / épreuve » par un vocabulaire d’affliction et de souffrance, plus immédiatement fidèle à θλιβῆναι, θλιβομένου et θλῖψιν, tout en maintenant la relation causale et corporative exprimée par le grec. « Demeures ferme » est conservé comme rendu naturel et non doctrinal de εὐσταθοῦντος, conformément au contraste établi par le texte et à l’audit anglais.
