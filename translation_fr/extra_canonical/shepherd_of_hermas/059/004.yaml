  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: fr
  text: '3. Je lui dis : « Seigneur, s’ils ont fait de telles choses au point d’irriter l’ange glorieux, moi, qu’ai-je fait ? » Il répond : « Ils ne peuvent souffrir, à moins que toi, le chef de toute la maisonnée[a], tu ne souffres ; car, lorsque tu souffres, eux aussi souffriront nécessairement. Mais si tu demeures ferme, ils ne peuvent connaître aucune affliction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques témoins omettent « toute » : « le chef de la maisonnée ».'
    reason: Le mot ὅλου est placé entre crochets dans l’édition source, signe d’une incertitude textuelle.
lexical_decisions:
- source_word: παραπικρανθῇ
  choice: ont irrité
  rationale: Le verbe exprime ici le fait de provoquer vivement le mécontentement de l’ange ; « irriter » est naturel et conserve la force du grec.
- source_word: θλιβῆναι / θλιβομένου / θλῖψιν
  choice: être éprouvé / épreuve
  rationale: Le champ sémantique comprend affliction, détresse et oppression. « Éprouver » convient au contexte disciplinaire tout en évitant de préciser indûment la forme de la souffrance.
- source_word: ἡ κεφαλὴ τοῦ οἴκου
  choice: le chef de la maisonnée
  rationale: « Chef » rend la métaphore de la tête comme autorité, tandis que « maisonnée » englobe la famille et les personnes rattachées au foyer.
- source_word: εὐσταθοῦντος
  choice: si tu demeures ferme
  rationale: Le participe indique un état stable ou prospère. « Demeurer ferme » suit la consultation anglaise et exprime naturellement l’absence d’ébranlement, sans surinterpréter la situation matérielle.
theological_decisions:
- issue: Lien entre l’épreuve du chef de maison et celle de sa maisonnée
  choice: Conserver l’affirmation causale et corporative du texte
  alternative: L’expliquer comme une simple influence psychologique ou comme une culpabilité transférée
  rationale: Le grec affirme que l’affliction du chef entraîne nécessairement celle des autres, sans définir le mécanisme ni attribuer explicitement au chef leur culpabilité.
translation_notes:
  register: Français moderne, narratif et digne. « Seigneur » conserve l’adresse κύριε dans ce cadre visionnaire ; « maisonnée » évite de réduire οἶκος au bâtiment.
