base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: fr
  text: '2. Il dit : « Écoute : tes péchés sont nombreux, mais pas au point que tu sois livré à cet ange. C’est plutôt ta maisonnée qui a commis de graves transgressions et des péchés. L’ange glorieux a été profondément irrité par leurs œuvres ; voilà pourquoi il a ordonné que tu sois affligé pendant quelque temps, afin qu’eux aussi se repentent et se purifient de tout désir de ce monde-ci. Lorsqu’ils se seront donc repentis et se seront purifiés, alors l’ange du châtiment se retirera. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: ta maisonnée
  rationale: Le grec désigne ici les personnes qui composent le foyer, non le bâtiment ; « maisonnée » conserve cette dimension collective.
- source_word: ἀνομίας
  choice: actes contraires à la loi
  rationale: Cette formulation rend le sens de transgression ou de mépris de la loi sans réduire le terme au simple mot général « fautes ».
- source_word: παρεπικράνθη
  choice: a été profondément irrité
  rationale: Le verbe exprime une vive irritation provoquée par leurs actes ; cette traduction reste naturelle tout en préservant sa force.
- source_word: θλιβῆναι
  choice: que tu sois accablé
  rationale: Le passif grec évoque l’affliction ou la détresse subie ; « accablé » convient au contexte disciplinaire sans préciser indûment la forme de l’épreuve.
- source_word: μετανοήσωσι
  choice: changent d’attitude
  rationale: Le verbe signifie se repentir, avec l’idée d’un changement intérieur et pratique ; cette expression est claire en français moderne et évite un registre exclusivement technique.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: désir propre au monde présent
  rationale: « Monde présent » rend αἰών dans son sens d’ordre ou d’époque actuelle, tandis que « désir » conserve la portée assez large de ἐπιθυμία.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: l’ange du châtiment
  rationale: La construction génitive est conservée avec une formulation concise, sans déterminer davantage la nature ou la durée du châtiment.
theological_decisions:
- issue: Lien entre l’affliction du chef de maison et la repentance de sa maisonnée
  choice: Conserver explicitement que l’ange ordonne son affliction afin qu’eux aussi changent d’attitude
  alternative: Reformuler comme une simple conséquence pédagogique indirecte
  rationale: Le texte grec établit directement cette finalité par ἵνα ; il ne convient pas d’en atténuer la tension théologique.
- issue: Portée de « l’ange du châtiment »
  choice: Employer la désignation littérale sans l’identifier davantage
  alternative: L’identifier à un démon, à Satan ou à un ange précis
  rationale: Le passage ne fournit aucune identification supplémentaire ; la traduction préserve cette indétermination.
- issue: Sens de la purification
  choice: « se purifient de tout désir propre au monde présent »
  alternative: « renoncent à toutes les convoitises mondaines »
  rationale: La formulation retenue maintient le lien entre repentance et purification sans importer une terminologie doctrinale plus étroite ni accentuer systématiquement le caractère sexuel ou matériel du désir.
translation_notes:
  register: Français moderne, naturel et digne. Le discours direct et la progression argumentative du grec sont conservés. « Maisonnée » clarifie que οἶκος vise le foyer humain ; les formulations relatives à l’ange, à l’affliction et au châtiment restent volontairement non spéculatives.
