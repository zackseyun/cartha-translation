review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la responsabilité de la maisonnée, l''affliction temporaire ordonnée par l''ange et son but en vue de leur repentance sont conservés. « Accablé » est toutefois un peu plus interprétatif que θλιβῆναι (« être affligé / éprouvé »), et « changent d’attitude » affaiblit le sens explicite de μετανοήσωσι, « se repentir ».'
  naturalness: Le français est clair, moderne et bien rythmé. « Maisonnée » convient au collectif domestique visé par οἶκος. La révision proposée maintient ce registre tout en employant « se repentent », expression naturelle dans ce contexte.
  terminology: « Ange du châtiment » rend exactement ὁ ἄγγελος τῆς τιμωρίας sans identification doctrinale. « Graves transgressions et péchés » rend plus directement ἀνομίας καὶ ἁμαρτίας. « Désir de ce monde-ci » conserve l'ampleur non spécifiée de ἐπιθυμία et la référence à l'âge/monde présent (αἰών).
  issues:
  - severity: medium
    issue: « changent d’attitude » pour μετανοήσωσι
    rationale: Cette paraphrase peut évoquer une simple modification de comportement. Dans ce passage, le verbe signifie explicitement « se repentir » et est coordonné à la purification ; ce terme doit être conservé pour la fidélité au grec.
  - severity: low
    issue: « que tu sois accablé » pour θλιβῆναι
    rationale: « Accablé » suggère aisément un état d'écrasement. « Que tu sois affligé » reflète plus directement et plus largement l'affliction ou la détresse exprimée par le passif grec.
