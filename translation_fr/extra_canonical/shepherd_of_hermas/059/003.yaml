- from: '2. Il dit : « Écoute : tes péchés sont nombreux, mais pas au point que tu sois livré à cet ange. C’est plutôt ta maisonnée qui a commis de grands actes contraires à la loi et de grands péchés. L’ange glorieux a été profondément irrité par leurs œuvres ; voilà pourquoi il a ordonné que tu sois accablé pendant quelque temps, afin qu’eux aussi changent d’attitude et se purifient de tout désir propre au monde présent. Lorsqu’ils auront donc changé d’attitude et se seront purifiés, alors l’ange du châtiment se retirera. »'
  to: '2. Il dit : « Écoute : tes péchés sont nombreux, mais pas au point que tu sois livré à cet ange. C’est plutôt ta maisonnée qui a commis de graves transgressions et des péchés. L’ange glorieux a été profondément irrité par leurs œuvres ; voilà pourquoi il a ordonné que tu sois affligé pendant quelque temps, afin qu’eux aussi se repentent et se purifient de tout désir de ce monde-ci. Lorsqu’ils se seront donc repentis et se seront purifiés, alors l’ange du châtiment se retirera. »'
  rationale: 'La révision restitue « se repentir » pour μετανοέω et « être affligé » pour θλίβεσθαι, sans modifier la structure argumentative ni ajouter d''interprétation. « Graves transgressions » rend ἀνομίαι dans un français moderne tout en distinguant ce terme de « péchés ». Aucune note n''est requise : le texte français porte les nuances nécessaires sans ambiguïté structurelle.'
