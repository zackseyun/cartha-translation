  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: fr
  text: Mais, dans la deuxième vision, tu l’as vue debout, avec un visage plus jeune et plus joyeux qu’auparavant, tandis que sa chair et ses cheveux paraissaient plus âgés. « Écoute aussi cette parabole », dit-elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: visage
  rationale: Dans ce contexte descriptif, le terme désigne l’apparence du visage ou la physionomie; « visage » est naturel et conserve le contraste avec la chair et les cheveux.
- source_word: ἱλαρωτέραν
  choice: plus joyeux
  rationale: Le comparatif évoque une apparence plus gaie ou rayonnante; « joyeux » est clair en français courant.
- source_word: πρεσβυτέρας
  choice: ceux d’une femme plus âgée
  rationale: L’adjectif qualifie la chair et les cheveux par contraste avec le visage rajeuni. Cette formulation évite l’expression peu naturelle « plus vieux » appliquée à la chair.
- source_word: παραβολήν
  choice: parabole
  rationale: Le terme désigne ici une comparaison développée porteuse d’un enseignement; « parabole » préserve le vocabulaire littéraire et religieux de la source.
theological_decisions: []
translation_notes:
  register: Français moderne, accessible et digne. Le tutoiement est conservé, conformément au singulier grec. Le contraste entre l’apparence rajeunie du visage et l’âge visible de la chair et des cheveux demeure explicite, sans interprétation ajoutée.
