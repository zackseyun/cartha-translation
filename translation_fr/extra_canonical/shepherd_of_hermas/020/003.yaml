base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: fr
  text: Car il a eu compassion de vous, il a renouvelé vos esprits, et vous vous êtes dépouillés de vos faiblesses. La force vous est venue, et vous avez été affermis dans la foi. Lorsqu’il a vu votre affermissement, le Seigneur s’est réjoui. C’est pourquoi il vous a révélé la construction de la tour, et il vous révélera encore d’autres choses, si vous vivez en paix les uns avec les autres de tout votre cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη ἐφ’ ὑμᾶς
  choice: il a eu compassion de vous
  rationale: Rend directement l’idée de compassion profonde exprimée par le verbe grec, dans un français naturel et digne.
- source_word: ἀνενεώσατο τὰ πνεύματα ὑμῶν
  choice: il a renouvelé vos esprits
  rationale: Conserve le pluriel du grec et le lien explicite avec le renouvellement intérieur décrit dans le contexte.
- source_word: ἀπέθεσθε τὰς μαλακίας ὑμῶν
  choice: vous vous êtes dépouillés de vos faiblesses
  rationale: ἀποτίθημι évoque le fait de déposer ou de se dépouiller; μαλακία désigne ici la faiblesse ou le relâchement, plutôt qu’une douceur moralement positive.
- source_word: προσῆλθεν ὑμῖν ἰσχυρότης
  choice: La force vous est venue
  rationale: Préserve le mouvement du grec, où la force survient aux destinataires, sans expliciter une cause non formulée.
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: vous avez été affermis dans la foi
  rationale: Le passif est maintenu; «affermis» exprime idiomatiquement une foi rendue plus forte.
- source_word: τὴν ἰσχυροποίησιν ὑμῶν
  choice: que vous vous fortifiiez
  rationale: Formulation française fluide qui traduit le processus de fortification constaté par le Seigneur, sans ajouter d’objet.
- source_word: ἐδήλωσεν ὑμῖν
  choice: il vous a révélé
  rationale: Dans ce contexte de communication divine, «révéler» rend naturellement l’idée de faire connaître ou manifester.
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: la construction de la tour
  rationale: Conserve l’ambiguïté possible entre le processus de construction et l’édifice en cours d’édification.
- source_word: ἐξ ὅλης καρδίας εἰρηνεύετε ἐν ἑαυτοῖς
  choice: vous vivez en paix les uns avec les autres de tout votre cœur
  rationale: Rend l’exhortation à la concorde mutuelle dans un français courant, tout en maintenant l’exigence de totalité du cœur.
theological_decisions:
- issue: Agent du renouvellement et de l’affermissement
  choice: Maintien de l’enchaînement grammatical du grec, avec le Seigneur comme sujet explicite de la compassion et du renouvellement, puis un passif pour l’affermissement.
  alternative: Expliciter que Dieu ou le Seigneur donne directement la force et affermit la foi.
  rationale: Le grec ne nomme pas explicitement l’agent de chaque proposition; la traduction évite donc de résoudre cette légère ouverture théologique.
- issue: Sens de «vos esprits»
  choice: Conserver le pluriel concret «vos esprits».
  alternative: Employer «votre esprit» collectivement ou «votre courage».
  rationale: Le pluriel τὰ πνεύματα ὑμῶν est textuellement net; le réduire au courage interpréterait davantage le passage.
- issue: Condition de révélations ultérieures
  choice: Conserver la condition introduite par «si».
  alternative: Reformuler comme une promesse générale de révélation.
  rationale: ἐάν exprime une condition réelle liée à la paix mutuelle vécue de tout cœur.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme par propositions brèves suit l’accumulation grecque sans lourdeur excessive. Aucun terme confessionnel particulier n’a été ajouté.
