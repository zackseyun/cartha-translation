base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: fr
  text: Quand un homme âgé, ayant déjà perdu tout espoir pour lui-même à cause de sa faiblesse et de sa pauvreté, n’attend plus rien d’autre que le dernier jour de sa vie, voilà que, soudain, un héritage lui est légué. À cette nouvelle, il se ressaisit et, transporté de joie, il se revêt de force. Il ne reste plus couché, mais se tient debout ; son esprit, déjà corrompu par ses actes passés, se renouvelle ; il ne reste plus assis, mais reprend courage. Il en va de même pour vous, après que vous avez entendu la révélation que le Seigneur vous a dévoilée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτερός τις
  choice: un homme âgé
  rationale: Rend le comparatif idiomatique employé substantivement sans suggérer ici une fonction ecclésiastique.
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: ayant déjà perdu tout espoir pour lui-même
  rationale: Conserve l’idée d’un homme qui ne nourrit plus aucun espoir quant à sa propre situation.
- source_word: κατελείφθη αὐτῷ κληρονομία
  choice: un héritage lui est légué
  rationale: Exprime naturellement le passif grec et le caractère inattendu de l’héritage.
- source_word: ἐξηγέρθη
  choice: il se ressaisit
  rationale: Dans la comparaison, le verbe décrit le passage de l’abattement à un nouvel élan ; ce choix évite une lecture exclusivement physique.
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: il se revêt de force
  rationale: Préserve l’image grecque de la force que l’on revêt.
- source_word: ἐφθαρμένον
  choice: affaibli
  rationale: Dans ce contexte, décrit un esprit détérioré ou épuisé par la conduite antérieure ; « corrompu » risquerait de suggérer seulement une dépravation morale.
- source_word: ἀνδρίζεται
  choice: reprend courage
  rationale: Rend en français inclusif et idiomatique l’idée de faire preuve de courage ou de fermeté, sans calquer la connotation masculine du verbe grec.
- source_word: ἀποκάλυψιν … ἀπεκάλυψεν
  choice: la révélation que le Seigneur vous a dévoilée
  rationale: Maintient la répétition étymologique autant que le permet un français naturel.
theological_decisions:
- issue: Portée morale de ἐφθαρμένον ἀπὸ τῶν προτέρων αὐτοῦ πράξεων
  choice: « son esprit, déjà affaibli par ses actes passés »
  alternative: « son esprit, déjà corrompu par ses actes passés »
  rationale: Le grec autorise l’idée de corruption, de détérioration ou de ruine. Le contexte insiste sur l’abattement et le renouvellement de la vigueur ; « affaibli » garde ce mouvement sans exclure les conséquences morales des actes passés.
- issue: Valeur de la comparaison finale
  choice: « Il en va de même pour vous »
  alternative: « Ainsi en est-il aussi de vous »
  rationale: Formulation actuelle et digne qui conserve l’application directe de la parabole, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La cadence accumulative du grec est conservée par des propositions brèves reliées par des points-virgules. Aucun marqueur de note n’est requis, puisqu’aucune note n’est ajoutée.
