base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/003.yaml
  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: fr
  text: Mais la partie blanche, c’est l’âge à venir, où habiteront ceux que Dieu a choisis, car ceux que Dieu a choisis pour la vie éternelle seront sans tache et purs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: la partie blanche
  rationale: Rend directement l’élément blanc parmi les quatre couleurs décrites sur la tête de la bête.
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: le monde à venir
  rationale: Dans ce contexte eschatologique, αἰών désigne l’ordre ou le monde futur plutôt qu’une simple période chronologique.
- source_word: κατοικήσουσιν
  choice: habiteront
  rationale: Conserve le sens concret et futur du verbe grec.
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ / οἱ ἐκλελεγμένοι ὑπὸ τοῦ Θεοῦ
  choice: ceux que Dieu a choisis
  rationale: Formulation naturelle qui préserve dans les deux occurrences le lien lexical avec le choix divin.
- source_word: ἄσπιλοι καὶ καθαροί
  choice: sans tache et purs
  rationale: Maintient les deux qualificatifs distincts et leur portée morale ou cultuelle.
- source_word: εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  rationale: Rend sobrement εἰς et conserve sans explicitation supplémentaire la relation entre le choix de Dieu et la vie éternelle.
theological_decisions:
- issue: Portée de l’élection divine en vue de la vie éternelle
  choice: « ceux que Dieu a choisis pour la vie éternelle »
  alternative: « les élus de Dieu, destinés à la vie éternelle »
  rationale: La traduction suit la syntaxe grecque sans préciser le mécanisme, le moment ni les conditions de cette élection.
- issue: Sens eschatologique de αἰών
  choice: « le monde à venir »
  alternative: « l’âge à venir »
  rationale: « Monde à venir » est idiomatique en français biblique actuel et convient au lieu où les élus habiteront, tout en conservant l’opposition avec le monde présent.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « ceux que Dieu a choisis » reflète celle du grec et évite un vocabulaire confessionnel plus technique.
