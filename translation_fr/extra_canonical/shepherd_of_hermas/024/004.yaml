review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’adresse passe du singulier (« toi ») au pluriel communautaire (« vous »), la détresse est annoncée comme à venir, et la formulation conditionnelle volontairement elliptique de οὐδὲν ἔσται est conservée. « Aux oreilles des saints » est très littéral, mais ne correspond pas à un tour naturel en français moderne. « Image » rend ici τύπος plus clairement que « figure », qui risque d’évoquer une personne ou une silhouette plutôt qu’une représentation visionnaire.'
  naturalness: 'La révision remplace deux formulations quelque peu raides ou ambiguës en français moderne : « parler aux oreilles des saints » devient « parler aux saints », et « la figure de la grande détresse qui vient » devient « l’image de la grande détresse à venir ». Le ton demeure sobre et direct.'
  terminology: « Saints » conserve le terme ἅγιοι sans confessionnalisation. « Grande détresse » est un rendu juste de μεγάλη θλίψις et évite d’importer un emploi doctrinal spécialisé de « tribulation ». « Image » pour τύπος maintient l’idée d’une représentation ou préfiguration sans en fixer l’interprétation.
  issues:
  - severity: low
    issue: 'Tour français peu naturel : « parler aux oreilles des saints »'
    rationale: Le grec εἰς τὰ ὦτα est une image d’adresse attentive, mais sa reproduction littérale est maladroite en français. « Parler aux saints » transmet le sens sans ajout.
  - severity: low
    issue: « Figure » est ambigu dans ce contexte
    rationale: Pour τύπος, « image » exprime plus naturellement la représentation visionnaire de la détresse annoncée, tout en préservant l’indétermination du rapport exact entre vision et événement.
