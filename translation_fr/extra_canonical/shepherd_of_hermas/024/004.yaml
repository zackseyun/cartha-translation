  to: Toi donc, ne cesse pas de parler aux saints. Vous avez aussi l’image de la grande détresse à venir. Mais si vous le voulez, elle ne sera rien. Souvenez-vous de ce qui a été écrit auparavant.
  rationale: Révision limitée à la fluidité du français et à une meilleure restitution contextuelle de τύπος. La syntaxe, l’alternance singulier/pluriel et l’ellipse conditionnelle du grec sont préservées.
