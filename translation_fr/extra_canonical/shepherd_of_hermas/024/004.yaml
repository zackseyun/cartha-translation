base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: fr
  text: Toi donc, ne cesse pas de parler aux saints. Vous avez aussi l’image de la grande détresse à venir. Mais si vous le voulez, elle ne sera rien. Souvenez-vous de ce qui a été écrit auparavant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ ὦτα
  choice: aux oreilles
  rationale: Conserve l’image concrète du grec tout en restant intelligible en français.
- source_word: ἁγίων
  choice: saints
  rationale: Rend le terme grec usuel désignant les personnes consacrées à Dieu, sans ajout confessionnel.
- source_word: τύπον
  choice: figure
  rationale: Préserve l’idée d’une représentation ou préfiguration donnée par la vision, plutôt que de réduire le mot à un simple « exemple ».
- source_word: θλίψεως
  choice: détresse
  rationale: Exprime l’épreuve oppressante annoncée sans imposer le terme théologique plus spécialisé « tribulation ».
- source_word: τὰ προγεγραμμένα
  choice: ce qui a été écrit auparavant
  rationale: Reproduit explicitement la valeur temporelle du préfixe προ- et laisse ouverte l’identité précise des écrits visés.
theological_decisions:
- issue: Portée conditionnelle de la détresse annoncée
  choice: Mais si vous le voulez, elle ne sera rien.
  alternative: Mais si vous le voulez, ce ne sera rien.
  rationale: Le pronom « elle » rattache naturellement la proposition à la grande détresse, tout en conservant l’énoncé saisissant et non expliqué du grec οὐδὲν ἔσται.
- issue: Valeur de τύπος
  choice: figure
  alternative: modèle / signe précurseur
  rationale: « Figure » maintient l’ambiguïté entre représentation, schéma et préfiguration, sans préciser indûment le rapport entre la bête visionnaire et la détresse future.
translation_notes:
  register: 'Français moderne, sobre et digne. L’alternance entre le singulier « toi » et le pluriel « vous » est conservée, car elle appartient au texte grec : Hermas reçoit personnellement l’ordre de parler, puis la communauté est interpellée collectivement.'
