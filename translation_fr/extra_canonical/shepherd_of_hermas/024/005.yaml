  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/005.yaml
  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: fr
  text: Après avoir dit ces choses, elle s’en alla, et je ne vis pas où elle s’en était allée, car un bruit se fit entendre. Alors, effrayé, je me retournai, pensant que la bête arrivait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψόφος
  choice: un bruit
  rationale: Le grec désigne un bruit ou un son sans en préciser la nature; la traduction conserve cette indétermination.
- source_word: ἐπεστράφην εἰς τὰ ὀπίσω
  choice: je me retournai
  rationale: Cette formulation rend naturellement en français l’action de se tourner vers l’arrière, sans alourdir la phrase.
- source_word: θηρίον
  choice: la bête
  rationale: « Bête » convient à la créature redoutable déjà mentionnée et maintient la continuité du récit.
