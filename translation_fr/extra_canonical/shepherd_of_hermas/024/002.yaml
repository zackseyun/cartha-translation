base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: fr
  text: 'Elle dit : « Écoute : le noir, c’est ce monde dans lequel vous habitez. La partie couleur de feu et rouge sang signifie que ce monde doit être détruit par le sang et le feu. La partie dorée, c’est vous qui avez échappé à ce monde. En effet, de même que l’or est éprouvé par le feu et devient propre à l’usage, de même vous aussi, qui habitez parmi eux, vous êtes mis à l’épreuve.[a] Ceux donc qui demeurent et sont brûlés par lui seront purifiés. De même que l’or rejette ses scories, vous aussi, vous rejetterez toute tristesse et toute détresse ; vous serez purifiés et deviendrez utiles à la construction de la tour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette phrase est incertain : les mots traduits par « qui habitez » sont absents de certains témoins, et le référent de « parmi eux » n’est pas clair.'
    reason: Signaler la leçon placée entre crochets dans l’édition et préserver l’ambiguïté syntaxique du grec.
lexical_decisions:
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: la couleur de feu et de sang
  rationale: Rend les deux adjectifs imagés de façon naturelle tout en conservant leur lien explicatif avec « le sang et le feu » dans la proposition suivante.
- source_word: ἀπόλλυσθαι
  choice: être détruit
  rationale: Le passif exprime ici la destruction du monde, sans préciser davantage l’agent.
- source_word: ἐκφυγόντες
  choice: qui avez échappé
  rationale: Conserve l’idée d’une fuite réussie hors du monde présent.
- source_word: δοκιμάζεται / δοκιμάζεσθε
  choice: est éprouvé / êtes mis à l’épreuve
  rationale: Maintient le parallèle entre l’essai ou l’affinage de l’or et l’épreuve subie par les destinataires.
- source_word: εὔχρηστον / χρήσιμοι
  choice: propre à l’usage / utiles
  rationale: Préserve le jeu lexical grec et prépare l’image de l’utilité pour la construction de la tour.
- source_word: σκωρίαν
  choice: scories
  rationale: Terme français courant dans le contexte de l’affinage d’un métal.
- source_word: οἰκοδομὴν τοῦ πύργου
  choice: construction de la tour
  rationale: Rend directement l’image architecturale récurrente de l’œuvre.
theological_decisions:
- issue: Rapport des croyants au « monde »
  choice: « vous, qui avez échappé à ce monde »
  alternative: « vous qui avez fui ce monde »
  rationale: « Échappé » traduit le résultat exprimé par le participe grec sans préciser si la séparation est géographique, morale ou eschatologique.
- issue: Valeur purificatrice de l’épreuve
  choice: « seront purifiés »
  alternative: « se purifieront »
  rationale: Le passif grec est conservé afin de ne pas attribuer explicitement la purification aux personnes elles-mêmes ni de nommer un agent que le texte ne précise pas.
- issue: Référent de ὑπ’ αὐτοῦ
  choice: « auront subi son feu »
  alternative: « auront été passés au feu par lui »
  rationale: Le pronom grec a un référent peu net dans ce passage. La formulation française maintient une certaine indétermination tout en restant lisible dans la métaphore du feu.
translation_notes:
  register: Français moderne, international et digne. Le dialogue demeure direct et accessible ; le vocabulaire métallurgique est conservé parce qu’il structure l’image de l’épreuve, de la purification et de l’utilité pour la tour.
