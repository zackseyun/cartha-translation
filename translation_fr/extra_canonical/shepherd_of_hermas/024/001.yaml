  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: fr
  text: 'Je l’interrogeai au sujet des quatre couleurs que la bête avait sur la tête. Elle me répondit : « Tu es encore curieux au sujet de telles choses. »


    « Oui, Madame, lui dis-je. Fais-moi connaître ce qu’elles signifient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠρώτησα
  choice: Je l’interrogeai
  rationale: Rend directement l’aoriste narratif et le fait que le narrateur adresse une question à la femme.
- source_word: θηρίον
  choice: bête
  rationale: Terme naturel et traditionnel pour une créature redoutable dans un récit visionnaire, sans préciser indûment son espèce.
- source_word: περίεργος
  choice: tu cherches à en savoir davantage
  rationale: Dans ce contexte, désigne une curiosité insistante concernant des matières extraordinaires; cette formulation conserve le léger reproche sans employer le français « curieux », potentiellement ambigu.
- source_word: κυρία
  choice: ma Dame
  rationale: Conserve l’adresse respectueuse du grec et la relation visionnaire entre Hermas et son interlocutrice.
- source_word: γνώρισόν μοι
  choice: Fais-moi connaître
  rationale: Reproduit l’impératif causatif et le registre digne du passage.
- source_word: τί ἐστιν ταῦτα
  choice: ce qu’elles signifient
  rationale: Le pronom renvoie aux quatre couleurs, dont Hermas demande l’interprétation plutôt que la simple identité matérielle.
