revisions:
- from: 'Mais toi, Hermas, ne garde plus de rancune envers tes enfants et ne laisse pas non plus ta sœur livrée à elle-même[a], afin qu’ils soient purifiés de leurs péchés passés. En effet, ils recevront une juste correction, si tu ne gardes pas de rancune envers eux. La rancune mène à la mort. Quant à toi, Hermas, tu as connu de grandes épreuves personnelles à cause des transgressions de ta maison, parce que tu ne t’es pas soucié des tiens : tu les as négligés et tu t’es laissé entraîner dans tes mauvaises affaires[b].'
  to: Mais toi, Hermas, ne garde plus de rancune envers tes enfants, et ne laisse pas non plus ta sœur[a], afin qu’ils soient purifiés de leurs péchés passés. En effet, ils recevront une juste discipline, si tu ne gardes pas de rancune envers eux. La rancune produit la mort. Quant à toi, Hermas, tu as connu de grandes épreuves personnelles à cause des transgressions de ta maisonnée, parce que tu ne t’en es pas soucié, mais que tu as été négligent et que tu t’es mêlé à tes mauvaises affaires[b].
  rationale: La révision retire l'ajout interprétatif « livrée à elle-même », rend plus précisément la négligence exprimée par παρενεθυμήθης, et restitue plus directement l'implication d'Hermas dans ses πραγματεῖαι πονηραί. Elle conserve l'ambiguïté de l'ellipse par une note et ne modifie pas le sens du passage.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:39Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement l'exhortation contre la rancune, la purification des fautes antérieures, la discipline juste, les épreuves privées et la responsabilité d'Hermas envers sa maisonnée. Toutefois, « livrée à elle-même » introduit un état que l'ellipse grecque ne précise pas, et « tu les as négligés » rend moins exactement παρενεθυμήθης, qui décrit plutôt la négligence comme attitude ou conduite. « Tu t'es laissé entraîner » atténue aussi l'idée de s'être mêlé ou compromis dans les mauvaises affaires.
  naturalness: Le français est globalement naturel, clair et d'un registre approprié. La formulation elliptique concernant la sœur est nécessairement inhabituelle en français; elle peut être conservée sous forme d'ellipse explicitement signalée par une note, plutôt que résolue par une paraphrase interprétative.
  terminology: « Garder de la rancune », « juste discipline », « épreuves personnelles » et « maisonnée » sont des choix justes et accessibles. « Maisonnée » explicite naturellement la portée collective de οἶκος mieux que « maison » dans ce contexte. « Mauvaises affaires » demeure recevable, avec une note maintenant l'éventail sémantique de πραγματεῖαι.
  issues:
  - severity: medium
    issue: « ne laisse pas non plus ta sœur livrée à elle-même »
    rationale: Le grec μηδὲ τὴν ἀδελφήν σου ἐάσῃς est elliptique et ne dit ni « livrée à elle-même » ni ce qu'Hermas ne devrait pas lui permettre de faire. La note reconnaît l'ellipse, mais le texte principal la comble néanmoins par une interprétation.
  - severity: medium
    issue: « tu les as négligés »
    rationale: παρενεθυμήθης signifie plus littéralement qu'il a été négligent / insouciant; l'objet explicite « les » est une clarification possible, mais la tournure fait de la maisonnée un objet direct absent du grec et réduit la nuance d'attitude.
  - severity: low
    issue: « tu t'es laissé entraîner dans tes mauvaises affaires »
    rationale: συνανεφύρης évoque le fait de se mêler à, de s'associer à ou de se compromettre dans ces activités. « Se laisser entraîner » peut suggérer une passivité non exprimée par le grec.
