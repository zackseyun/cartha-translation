base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: fr
  text: Mais toi, Hermas, ne garde plus de rancune envers tes enfants, et ne laisse pas non plus ta sœur[a], afin qu’ils soient purifiés de leurs péchés passés. En effet, ils recevront une juste discipline, si tu ne gardes pas de rancune envers eux. La rancune produit la mort. Quant à toi, Hermas, tu as connu de grandes épreuves personnelles à cause des transgressions de ta maisonnée, parce que tu ne t’en es pas soucié, mais que tu as été négligent et que tu t’es mêlé à tes mauvaises affaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ne laisse pas non plus ta sœur ». Le grec ne précise pas ce qu’Hermas ne doit pas lui laisser faire, ni en quel état il ne doit pas la laisser.'
    reason: Préserver l'ellipse réelle du grec sans lui attribuer dans le texte un contenu non exprimé.
  - marker: b
    text: 'Ou : « à tes mauvaises occupations » ou « entreprises ».'
    reason: πραγματεῖαι peut désigner des affaires, des activités ou des entreprises, sans impliquer nécessairement le commerce.
lexical_decisions:
- source_word: μνησικακέω / μνησικακία
  choice: garder de la rancune / la rancune
  rationale: Rend l’idée de conserver le souvenir d’un tort avec ressentiment, dans un français naturel, tout en maintenant la répétition rhétorique du grec.
- source_word: παιδεία δικαία
  choice: une juste correction
  rationale: παιδεία peut désigner l’éducation, la discipline ou la correction. Ici, le contexte de purification des fautes favorise « correction », qualifiée de « juste ».
- source_word: θλίψεις ἰδιωτικάς
  choice: de grandes épreuves personnelles
  rationale: θλίψις exprime l’affliction ou la détresse, tandis que ἰδιωτικός indique ici ce qui relève de la vie personnelle ou privée.
- source_word: τοῦ οἴκου σου
  choice: de ta maison
  rationale: Conserve l’image du grec, où οἶκος peut désigner à la fois le foyer et les membres de la maisonnée.
- source_word: ταῖς πραγματείαις σου ... ταῖς πονηραῖς
  choice: tes mauvaises affaires
  rationale: πραγματεία peut viser des occupations, entreprises ou affaires. « Affaires » préserve cette largeur sans limiter indûment le sens au commerce.
theological_decisions:
- issue: Lien entre rancune, correction et purification des péchés
  choice: Maintenir les propositions conditionnelles et causales telles qu’elles se présentent
  alternative: Expliquer que le pardon d’Hermas provoquerait directement le pardon divin
  rationale: Le texte relie l’absence de rancune à une juste correction et à la purification, mais ne précise pas le mécanisme théologique; la traduction ne doit pas le systématiser.
- issue: « La rancune mène à la mort »
  choice: Conserver « mort » sans qualification
  alternative: Préciser « mort spirituelle » ou « mort éternelle »
  rationale: Le grec θάνατον ne qualifie pas la mort; conserver cette ouverture respecte la tension du texte.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement est conservé pour l’adresse directe à Hermas. Les répétitions de « rancune » et l’image de la « maison » sont maintenues afin de respecter la structure et le relief du grec.
