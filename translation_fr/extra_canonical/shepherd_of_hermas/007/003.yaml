  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: fr
  text: 'Heureux tous ceux qui pratiquent la justice : ils ne périront jamais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Rend naturellement la formule de bénédiction grecque sans lui imposer un sens émotionnel étroit.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: ceux qui pratiquent la justice
  rationale: Exprime l’idée d’une justice activement mise en œuvre; « pratiquent » est idiomatique en français moderne.
- source_word: οὐ διαφθαρήσονται
  choice: ils ne périront
  rationale: Le passif de διαφθείρω peut évoquer la destruction ou la corruption; dans ce contexte eschatologique, « périr » offre une formulation naturelle tout en conservant la gravité du terme.
- source_word: ἕως αἰῶνος
  choice: jamais
  rationale: Dans une proposition négative, cette expression idiomatique signifie « à jamais / jamais »; « jamais » donne une phrase française claire et fidèle.
theological_decisions:
- issue: Portée de « justice »
  choice: Conserver « justice » sans précision doctrinale
  alternative: « ce qui est juste » ou « la conduite juste »
  rationale: Le grec δικαιοσύνη peut désigner la justice ou la conduite conforme au bien; le terme français préserve cette amplitude.
- issue: Nature de la destruction annoncée
  choice: Employer « périr » sans définir le mode ni le moment
  alternative: « être détruits » ou « connaître la corruption »
  rationale: Le texte affirme la préservation de ceux qui pratiquent la justice sans expliciter davantage la nature de la perte évitée.
translation_notes:
  register: Français moderne, sobre et digne. La structure brève de la béatitude et son parallélisme sont conservés.
