base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: fr
  text: 'Tu diras à Maxime : « Voici que la détresse arrive, s’il te semble bon de renier de nouveau. Le Seigneur est proche de ceux qui reviennent à lui, comme il est écrit dans Eldad et Modat, qui ont prophétisé au peuple dans le désert. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψις
  choice: détresse
  rationale: Le terme désigne une épreuve oppressante ou une affliction; « détresse » convient ici à l’annonce d’une épreuve imminente sans en préciser indûment la nature.
- source_word: ἀρνεῖσθαι
  choice: renier
  rationale: Dans ce contexte, le verbe évoque vraisemblablement un nouveau reniement de la foi sous la pression; « renier » conserve cette portée plus exactement que « nier ».
- source_word: τοῖς ἐπιστρεφομένοις
  choice: ceux qui reviennent à lui
  rationale: Le participe exprime un retournement ou un retour; l’ajout « à lui », implicite dans le contexte, donne une formulation française naturelle.
- source_word: ἐν τῷ Ἐλδὰδ καὶ Μωδὰτ
  choice: dans Eldad et Modat
  rationale: La tournure présente ces noms comme le titre ou la désignation d’un écrit cité; la traduction conserve cette référence sans identifier davantage l’ouvrage perdu.
theological_decisions:
- issue: Portée conditionnelle de ἐάν σοι δοκῇ
  choice: « s’il te semble bon de renier de nouveau »
  alternative: « si tu envisages de renier encore »
  rationale: La traduction retenue garde la formulation grecque volontairement incisive, qui présente le nouveau reniement comme dépendant du choix de Maxime, sans expliquer la nature exacte de la détresse.
- issue: Objet du retournement
  choice: « ceux qui reviennent à lui »
  alternative: « ceux qui se convertissent »
  rationale: « Reviennent à lui » préserve l’image relationnelle du retour et évite de transformer le participe en terme théologique plus spécialisé.
translation_notes:
  register: 'Français moderne, clair et digne. L’impératif futur « Tu diras » et l’introduction solennelle « Voici que » conservent le ton prophétique. Les noms propres suivent la forme du texte grec fourni : Maxime, Eldad et Modat.'
