base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: fr
  text: Mais ce qui te sauve, c’est de ne pas t’être éloigné du Dieu vivant, ainsi que ta simplicité et ta grande maîtrise de toi. Ces qualités t’ont sauvé, si tu y persévères, et elles sauvent tous ceux qui agissent ainsi et qui marchent dans l’innocence et la simplicité. Ceux-là triomphent de toute méchanceté et demeurent jusque dans la vie éternelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ ἀποστήναι σε ἀπὸ Θεοῦ ζῶντος
  choice: de ne pas t’être éloigné du Dieu vivant
  rationale: Rend la construction substantivée et l’idée de ne pas abandonner ou se détourner de Dieu, dans un français naturel.
- source_word: ἁπλότης
  choice: simplicité
  rationale: Conserve le terme central, qui évoque ici la droiture sans duplicité plutôt que la naïveté.
- source_word: ἐγκράτεια
  choice: maîtrise de soi
  rationale: Expression française actuelle couvrant la retenue et la discipline personnelle.
- source_word: ἐν ἀκακίᾳ
  choice: avec innocence
  rationale: Rend l’absence de malice ou de méchanceté sans alourdir la phrase.
- source_word: κατισχύουσιν
  choice: triomphent de
  rationale: Exprime la supériorité effective sur toute forme de mal contenue dans le verbe grec.
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: demeurent pour la vie éternelle
  rationale: Préserve la formulation inhabituelle et sa possible orientation vers l’entrée ou la permanence dans la vie éternelle.
theological_decisions:
- issue: Rapport entre conduite, persévérance et salut
  choice: 'Conserver les affirmations conditionnelles et actives du texte : « si tu y persévères » et « elles sauvent »'
  alternative: Reformuler en faisant de ces qualités de simples signes d’un salut déjà acquis
  rationale: Le grec attribue explicitement une portée salvifique à ces qualités et maintient la condition de persévérance; il ne faut pas résoudre cette tension théologique.
- issue: Valeur de l’aoriste σέσωκέν et du présent σῴζει
  choice: « t’ont sauvé » puis « elles sauvent »
  alternative: Uniformiser les deux verbes au présent ou au passé
  rationale: Cette distinction respecte le parfait grec pour Hermas et le présent à valeur générale pour tous ceux qui agissent ainsi.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement est conservé puisque l’adresse à Hermas est directe. « Ceux-là » reprend explicitement le groupe mentionné et préserve le mouvement argumentatif du grec.
