  to: Mais ce qui te sauve, c’est de ne pas t’être éloigné du Dieu vivant, ainsi que ta simplicité et ta grande maîtrise de toi. Ces qualités t’ont sauvé, si tu y persévères, et elles sauvent tous ceux qui agissent ainsi et qui marchent dans l’innocence et la simplicité. Ceux-là triomphent de toute méchanceté et demeurent jusque dans la vie éternelle.
