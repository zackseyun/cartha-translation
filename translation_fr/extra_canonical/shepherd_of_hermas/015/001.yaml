base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: fr
  text: Quant aux autres pierres que tu as vues être jetées loin de la tour, tomber sur la route, puis rouler de la route vers des lieux sans chemin, ce sont ceux qui ont cru, mais qui, à cause de leur indécision, abandonnent leur véritable chemin. Pensant donc pouvoir trouver un meilleur chemin, ils s’égarent et connaissent la misère en marchant dans des lieux sans chemin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: cœur partagé
  rationale: Rend naturellement en français l’idée d’une loyauté intérieure divisée ou d’une indécision profonde, sans réduire le terme à un simple doute intellectuel.
- source_word: ἀνοδία
  choice: lieux sans chemin
  rationale: Conserve l’image spatiale de terrains dépourvus de voie, qui contraste avec la véritable route et explique l’égarement.
- source_word: ταλαιπωροῦσιν
  choice: peinent misérablement
  rationale: Exprime à la fois la souffrance et la condition malheureuse suggérées par le verbe grec.
- source_word: ὁδός
  choice: route / chemin
  rationale: « Route » convient au mouvement concret des pierres, tandis que « chemin » porte naturellement la dimension figurée du parcours suivi, sans effacer la métaphore.
theological_decisions:
- issue: Nature de ceux qui se détournent
  choice: « ceux qui ont cru »
  alternative: « ceux qui étaient devenus croyants »
  rationale: Le parfait πεπιστευκότες indique une foi acquise dont l’état ou les effets demeurent, tout en laissant intacte la tension du passage avec leur abandon ultérieur.
- issue: Cause de l’abandon
  choice: « à cause de leur cœur partagé »
  alternative: « à cause de leur irrésolution »
  rationale: La formulation conserve la portée morale et spirituelle de διψυχία sans imposer une doctrine particulière sur l’apostasie.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « route/chemin » et l’image des lieux sans chemin sont maintenues, car elles structurent l’explication allégorique.
