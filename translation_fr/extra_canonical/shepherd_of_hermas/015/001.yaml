revisions:
- from: Quant aux autres pierres que tu as vues jetées loin de la tour, tomber sur la route, puis rouler hors de la route vers des lieux sans chemin, ce sont ceux qui ont cru, mais qui, à cause de leur cœur partagé, abandonnent leur véritable chemin. Pensant pouvoir trouver un meilleur chemin, ils s’égarent et peinent misérablement en marchant dans des lieux sans chemin.
  to: Quant aux autres pierres que tu as vues être jetées loin de la tour, tomber sur la route, puis rouler de la route vers des lieux sans chemin, ce sont ceux qui ont cru, mais qui, à cause de leur indécision, abandonnent leur véritable chemin. Pensant donc pouvoir trouver un meilleur chemin, ils s’égarent et connaissent la misère en marchant dans des lieux sans chemin.
  rationale: La révision améliore l’idiomaticité tout en préservant l’imagerie et la séquence du grec. « Indécision » rend διψυχία sans trancher de questions doctrinales, et « connaissent la misère » restitue naturellement ταλαιπωροῦσιν.
