  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la progression de 15:6 : autre emplacement plus petit, tourments, accomplissement des « jours » des péchés, transfert, condition liée au retour des mauvaises œuvres dans le cœur, puis non-salut en raison de la dureté de cœur. Toutefois, « être délivrés de leurs tourments » affaiblit et interprète μετατεθῆναι ἐκ τῶν βασάνων, qui reprend le vocabulaire du transfert et décrit plus précisément un déplacement hors des tourments.'
  naturalness: Le français est moderne et fluide. « Remontent à leur cœur » conserve mieux l’image du grec que « reviennent au cœur » tout en restant idiomatique dans ce contexte élevé.
  terminology: « Tourmentés / tourments », « jours de leurs péchés » et « endurcissement de leur cœur » sont bien rendus. « Parole du juste » avec minuscule, accompagnée d’une note, évite d’identifier ou de personnaliser indûment le référent disputé de τοῦ δικαίου.
