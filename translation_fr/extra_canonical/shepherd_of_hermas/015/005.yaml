base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: fr
  text: Ils pourront toutefois trouver place dans un autre endroit, beaucoup plus petit, mais seulement après avoir été tourmentés et avoir accompli les jours de leurs péchés. Ils y seront transférés parce qu’ils ont eu part à la parole du juste[a]. Alors il arrivera qu’ils soient transférés hors de leurs tourments, si les mauvaises actions qu’ils ont commises remontent à leur cœur. Mais si elles ne remontent pas à leur cœur, ils ne sont pas sauvés, à cause de l’endurcissement de leur cœur.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la parole de justice » ou « à la parole juste » ; le grec peut aussi se comprendre sans référent personnel explicite.
    reason: Signaler l’ambiguïté grammaticale et théologique de τοῦ ῥήματος τοῦ δικαίου sans imposer un référent personnel.
lexical_decisions:
- source_word: ἁρμόσουσιν
  choice: pourront trouver place
  rationale: Rend naturellement l’idée d’être ajustés ou intégrés à un emplacement, en continuité avec l’image des pierres de la tour.
- source_word: βασανισθῶσιν / βασάνων
  choice: avoir été tourmentés / leurs tourments
  rationale: Conserve le lien lexical interne du grec et évite de préciser indûment la nature du châtiment.
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: avoir accompli les jours de leurs péchés
  rationale: Préserve l’expression temporelle inhabituelle et théologiquement chargée du texte source sans l’expliquer à la place du lecteur.
- source_word: μετατεθήσονται
  choice: ils y seront transférés
  rationale: Reproduit le déplacement vers l’autre endroit indiqué dans la phrase précédente.
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: reviennent au cœur
  rationale: Expression française naturelle qui garde le cœur comme siège de la prise de conscience, conformément à l’image grecque.
- source_word: σκληροκαρδίαν
  choice: endurcissement de leur cœur
  rationale: Formulation claire et traditionnelle qui restitue directement le composé grec.
theological_decisions:
- issue: Référent de τοῦ δικαίου
  choice: du Juste
  alternative: de la justice / juste
  rationale: Le génitif peut désigner une personne juste, éventuellement le Christ, mais la forme grecque permet aussi une lecture non personnelle. La traduction principale suit la lecture personnelle sans identifier explicitement le référent; la note conserve l’ambiguïté.
- issue: Valeur de σωθήσονται
  choice: ils ne sont pas sauvés
  alternative: ils ne seront pas sauvés
  rationale: Le présent français reflète le présent grec et énonce la conséquence générale sans préciser davantage sa temporalité eschatologique.
- issue: Rapport entre repentance, tourments et salut
  choice: conserver l’enchaînement conditionnel du grec
  alternative: expliciter une doctrine précise de pénitence ou de châtiment
  rationale: Le passage associe tourments, prise de conscience des actes et salut sans définir systématiquement leur rapport; la traduction ne tranche pas au-delà du texte.
translation_notes:
  register: Français moderne, digne et accessible. L’image architecturale est maintenue par «trouver place» et «autre endroit». Les répétitions de «tourments» et de «cœur» sont conservées parce qu’elles structurent le raisonnement du grec.
