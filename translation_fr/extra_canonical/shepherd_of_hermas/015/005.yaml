    issue: « ils pourront être délivrés de leurs tourments »
    rationale: Le grec dit littéralement qu’il arrivera qu’ils soient « transférés hors de leurs tourments » (μετατεθῆναι ἐκ τῶν βασάνων). « Délivrés » peut suggérer une libération définitive et ne reproduit pas la reprise intentionnelle de μετατίθημι dans la phrase précédente.
  - severity: low
    issue: Majuscule dans « du Juste »
    rationale: La majuscule favorise une lecture personnelle et théologiquement déterminée. Le grec permet aussi une compréhension non personnelle; la minuscule, avec note explicative, préserve mieux l’ambiguïté.
