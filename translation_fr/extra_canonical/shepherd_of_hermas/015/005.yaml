revisions:
- from: Ils pourront toutefois trouver place dans un autre endroit, beaucoup plus petit, mais seulement après avoir été tourmentés et avoir accompli les jours de leurs péchés. Ils y seront transférés parce qu’ils ont eu part à la parole du Juste[a]. Alors ils pourront être délivrés de leurs tourments, si les mauvaises actions qu’ils ont commises leur reviennent au cœur. Mais si elles ne leur reviennent pas au cœur, ils ne sont pas sauvés, à cause de l’endurcissement de leur cœur.»
  to: Ils pourront toutefois trouver place dans un autre endroit, beaucoup plus petit, mais seulement après avoir été tourmentés et avoir accompli les jours de leurs péchés. Ils y seront transférés parce qu’ils ont eu part à la parole du juste[a]. Alors il arrivera qu’ils soient transférés hors de leurs tourments, si les mauvaises actions qu’ils ont commises remontent à leur cœur. Mais si elles ne remontent pas à leur cœur, ils ne sont pas sauvés, à cause de l’endurcissement de leur cœur.»
  rationale: La révision remplace une formulation interprétative (« délivrés ») par « transférés hors de leurs tourments », qui restitue le verbe grec et son écho avec le transfert vers l’autre endroit. Elle conserve l’ambiguïté de τοῦ δικαίου par la minuscule et la note, et ajuste légèrement l’expression du retour des actes dans le cœur.
