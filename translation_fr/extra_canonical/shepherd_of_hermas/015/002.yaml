base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: fr
  text: Mais ceux qui tombent dans le feu et y brûlent sont ceux qui se sont éloignés jusqu’au bout du Dieu vivant, et ils n’ont plus eu à cœur de se repentir, à cause des désirs de leur débauche et des méfaits qu’ils ont commis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: se sont définitivement détournés
  rationale: L’expression indique un éloignement arrivé à son terme. « Se détourner » rend ici l’apostasie sans imposer un vocabulaire confessionnel plus technique.
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: du Dieu vivant
  rationale: Reproduction directe et naturelle de l’expression grecque.
- source_word: οὐκέτι αὐτοῖς ἀνέβη ἐπὶ τὴν καρδίαν
  choice: Il ne leur est plus venu au cœur
  rationale: Conserve l’image sémitisante du mouvement vers le cœur tout en restant intelligible en français moderne.
- source_word: μετανοῆσαι
  choice: se repentir
  rationale: Rend le changement intérieur et moral exprimé par le verbe, dans le registre religieux approprié.
- source_word: τὰς ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: leurs désirs débridés
  rationale: ἀσέλγεια évoque une conduite sans retenue, souvent sensuelle, mais le contexte ne permet pas de la réduire avec certitude à la seule débauche sexuelle.
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: des mauvaises actions qu’ils ont commises
  rationale: Le pluriel désigne ici les méfaits accomplis; cette formulation française explicite naturellement la valeur concrète de πονηριῶν.
theological_decisions:
- issue: Portée de εἰς τέλος dans l’éloignement de Dieu
  choice: définitivement détournés
  alternative: entièrement éloignés
  rationale: Le choix préserve l’idée d’un éloignement mené jusqu’au bout sans développer une doctrine précise sur l’irréversibilité du salut.
- issue: Lien causal entre l’absence de repentance et les fautes
  choice: à cause de leurs désirs débridés et des mauvaises actions qu’ils ont commises
  alternative: en raison des convoitises de leur débauche et de leurs méfaits
  rationale: La syntaxe grecque relie l’absence de repentance à ces désirs et actes; la traduction maintient ce rapport sans expliquer davantage son mécanisme théologique.
translation_notes:
  register: Français moderne, digne et accessible. La phrase longue du grec est divisée en deux pour la clarté, sans modifier sa progression logique. Aucun marqueur de note n’est requis.
