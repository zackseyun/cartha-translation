revisions:
- from: Mais ceux qui tombent dans le feu et y brûlent sont ceux qui se sont définitivement détournés du Dieu vivant. Il ne leur est plus venu au cœur de se repentir, à cause de leurs désirs débridés et des mauvaises actions qu’ils ont commises.
  to: Mais ceux qui tombent dans le feu et y brûlent sont ceux qui se sont éloignés jusqu’au bout du Dieu vivant, et ils n’ont plus eu à cœur de se repentir, à cause des désirs de leur débauche et des méfaits qu’ils ont commis.
  rationale: La révision conserve la structure et le sens de la phrase grecque, tout en évitant de transformer l’expression εἰς τέλος en énoncé explicite d’irréversibilité doctrinale. Elle rend plus précisément ἐπιθυμίαι τῆς ἀσελγείας et emploie une expression française naturelle pour l’image du repentir ne montant plus au cœur.
