review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : chute dans le feu, éloignement consommé du Dieu vivant, absence de mouvement vers le repentir, et lien avec l’ἀσέλγεια et les méfaits. Toutefois, « définitivement détournés » peut suggérer une conclusion doctrinale d’irréversibilité plus nette que εἰς τέλος ἀποστάντες, qui décrit d’abord une apostasie menée jusqu’au bout. « Désirs débridés » affaiblit aussi la référence explicite à l’ἀσέλγεια, conduite licencieuse/débauchée.'
  naturalness: Le français est fluide et d’un registre approprié. « Il ne leur est plus venu au cœur » est compréhensible, mais « ils n’ont plus eu à cœur de se repentir » est plus idiomatique tout en conservant l’expression καρδία.
  terminology: « Dieu vivant » et « se repentir » sont justes. « Se sont éloignés jusqu’au bout » préserve mieux la portée de εἰς τέλος sans fixer une lecture doctrinale. « Les désirs de leur débauche » rend explicitement ἐπιθυμίαι et ἀσέλγεια sans restreindre indûment le terme à un seul acte particulier.
  issues:
  - severity: medium
    issue: Nuance de εἰς τέλος
    rationale: « Définitivement » peut être lu comme une affirmation d’irréversibilité définitive. La formule grecque qualifie l’éloignement comme accompli jusqu’au bout; une formulation moins doctrinalement chargée est préférable.
  - severity: low
    issue: Rendu de ἀσέλγεια
    rationale: « Désirs débridés » est assez général et ne rend pas clairement le substantif grec désignant la licence ou la débauche. « Désirs de leur débauche » conserve les deux éléments du grec.
  revised_text: Mais ceux qui tombent dans le feu et y brûlent sont ceux qui se sont éloignés jusqu’au bout du Dieu vivant, et ils n’ont plus eu à cœur de se repentir, à cause des désirs de leur débauche et des méfaits qu’ils ont commis.
