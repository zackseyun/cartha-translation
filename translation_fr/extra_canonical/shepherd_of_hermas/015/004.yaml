  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/004.yaml
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: fr
  text: Elle acheva donc l’explication de la tour. Mais, m’enhardissant de nouveau, je lui demandai encore si toutes ces pierres qui avaient été rejetées et qui ne convenaient pas à la construction de la tour pouvaient se repentir et trouver une place dans cette tour. « Elles peuvent se repentir, dit-elle, mais elles ne peuvent pas s’ajuster à cette tour. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδευσάμενος
  choice: m’enhardissant
  rationale: Rend l’idée que le narrateur prend de nouveau l’audace de poursuivre son interrogatoire, sans la nuance inutilement péjorative de « devenant impudent ».
- source_word: μετάνοια
  choice: se repentir
  rationale: Expression française naturelle qui conserve le sens de changement intérieur et moral porté par le terme grec dans ce contexte.
- source_word: ἁρμόζοντες / ἁρμόσαι
  choice: convenaient / prendre place
  rationale: Le verbe évoque des pierres qui s’ajustent à une construction. La variation française évite une répétition lourde tout en maintenant l’image architecturale.
- source_word: οἰκοδομή
  choice: construction
  rationale: Désigne ici l’édifice en cours de construction plutôt que l’acte abstrait d’édifier.
theological_decisions:
- issue: Possibilité de repentance pour les pierres rejetées
  choice: « pouvaient se repentir » / « Elles peuvent se repentir »
  alternative: « s’il y avait pour elles une repentance » / « Elles ont une repentance »
  rationale: Le français idiomatique exprime ici μετάνοια comme une possibilité réelle de se repentir, sans préciser davantage la nature, la durée ou les effets de cette repentance.
- issue: Place des pierres dans la tour
  choice: « elles ne peuvent pas prendre place dans cette tour »
  alternative: « elles ne peuvent pas s’ajuster à cette tour »
  rationale: La formulation maintient l’exclusion de cette tour précise sans anticiper la suite du passage ni transformer l’image en affirmation doctrinale plus générale.
translation_notes:
  register: Français moderne, fluide et digne. L’image des pierres et de la tour est conservée, ainsi que la tension entre la possibilité de repentance et l’impossibilité d’intégrer cette tour.
