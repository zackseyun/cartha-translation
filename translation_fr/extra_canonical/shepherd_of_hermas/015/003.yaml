revisions:
- from: Et les autres pierres qui tombent près des eaux sans pouvoir rouler jusque dans l’eau, veux-tu savoir qui elles représentent ? Ce sont ceux qui ont entendu la parole et qui veulent être baptisés au nom du Seigneur. Puis, quand la pureté qu’exige la vérité leur revient à l’esprit, ils changent d’avis et retournent à leurs mauvais désirs.
