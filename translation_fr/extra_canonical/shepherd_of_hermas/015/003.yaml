review_pass:
  verdict: revise
  source_fidelity: 'La structure et l’imagerie sont fidèlement rendues, notamment les pierres, leur chute près des eaux et l’incapacité d’entrer dans l’eau. Deux choix interprètent toutefois le grec au-delà de ce que le texte impose : « la pureté qu’exige la vérité » transforme le génitif τῆς ἀληθείας en exigence éthique explicite, et « ils changent d’avis » remplace μετανοοῦσιν par une valeur contextuelle négative qui n’est pas exprimée lexicalement.'
  naturalness: Le français est fluide, clair et d’un registre approprié. « La pureté de la vérité » demeure naturel dans ce contexte ancien et conserve mieux la formulation imagée du texte.
  terminology: « La parole », « être baptisés au nom du Seigneur » et « mauvais désirs » conviennent. « Ils se repentent » est le correspondant usuel et non confessionnel de μετανοοῦσιν ; la tension narrative avec le retour aux mauvais désirs doit être préservée plutôt que résolue par une paraphrase.
  issues:
  - severity: medium
    issue: Interprétation explicative de ἡ ἁγνότης τῆς ἀληθείας
    rationale: « La pureté qu’exige la vérité » ajoute l’idée d’une exigence de la vérité. Le grec dit plus littéralement « la pureté de la vérité »; le rapport exact du génitif doit rester ouvert.
  - severity: medium
    issue: Rendu de μετανοοῦσιν
    rationale: « Ils changent d’avis » interprète le verbe comme un renoncement au baptême. μετανοοῦσιν signifie normalement « ils se repentent »; malgré la difficulté de la séquence, la traduction doit conserver cette ambiguïté et cette tension.
  revised_text: Et les autres pierres qui tombent près des eaux sans pouvoir rouler jusque dans l’eau, veux-tu savoir qui elles sont ? Ce sont ceux qui ont entendu la parole et qui veulent être baptisés au nom du Seigneur. Puis, lorsque la pureté de la vérité leur revient à l’esprit, ils se repentent et retournent à leurs mauvais désirs.
