base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: fr
  text: Et les autres pierres qui tombent près des eaux sans pouvoir rouler jusque dans l’eau, veux-tu savoir qui elles sont ? Ce sont ceux qui ont entendu la parole et qui veulent être baptisés au nom du Seigneur. Puis, lorsque la pureté de la vérité leur revient à l’esprit, ils se repentent et retournent à leurs mauvais désirs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ... πίπτοντας ἐγγὺς τῶν ὑδάτων
  choice: les autres pierres qui tombent près des eaux
  rationale: Le substantif « pierres », sous-entendu en grec d’après le contexte immédiat, est rétabli en français pour que l’image demeure claire.
- source_word: κυλισθῆναι εἰς τὸ ὕδωρ
  choice: rouler jusque dans l’eau
  rationale: Conserve le mouvement concret des pierres et rend naturellement la destination exprimée par εἰς.
- source_word: τὸν λόγον
  choice: la parole
  rationale: Formulation sobre qui préserve la portée religieuse du terme sans préciser indûment son contenu.
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: être baptisés au nom du Seigneur
  rationale: Expression française naturelle qui conserve la formule baptismale et son orientation vers le nom du Seigneur.
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: la pureté qu’exige la vérité
  rationale: Le génitif peut désigner la pureté propre à la vérité ou celle qu’elle implique. Cette formulation restitue ici le sens éthique probable sans réduire ἁγνότης à une simple notion abstraite.
- source_word: μετανοοῦσιν
  choice: ils changent d’avis
  rationale: Dans ce contexte, le changement est un recul devant les exigences de la vérité, non la repentance positive souvent exprimée par le même verbe.
- source_word: πορεύονται πάλιν ὀπίσω τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: retournent à leurs mauvais désirs
  rationale: Rend clairement le retour aux désirs mauvais, tout en évitant le calque peu naturel « marcher derrière ».
theological_decisions:
- issue: Sens de μετανοοῦσιν dans un contexte de renoncement au baptême
  choice: ils changent d’avis
  alternative: ils se repentent
  rationale: 'Le mouvement décrit est négatif : après avoir envisagé le baptême, ces personnes reculent et retournent à leurs mauvais désirs. « Se repentent » suggérerait en français une conversion morale positive contraire au contexte.'
- issue: Portée de « la pureté de la vérité »
  choice: la pureté qu’exige la vérité
  alternative: la pureté de la vérité
  rationale: La traduction explicite légèrement le rapport éthique suggéré par le contexte, sans identifier cette pureté à une doctrine confessionnelle particulière.
translation_notes:
  register: Français moderne, clair et digne. L’image des pierres est explicitée au début, conformément au contexte du paragraphe parent. La question directe et la progression narrative du grec sont conservées.
