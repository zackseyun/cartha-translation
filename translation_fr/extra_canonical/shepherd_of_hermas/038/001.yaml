  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: fr
  text: '« Écoute donc, dit-il, homme insensé, comment la tristesse épuise l’Esprit saint et, de nouveau, sauve.[a] Lorsqu’un homme partagé entreprend une action et y échoue à cause de son indécision, cette tristesse entre en lui, attriste l’Esprit saint et l’épuise. Puis, lorsque l’irritation s’attache à quelqu’un à propos d’une affaire et qu’il s’aigrit profondément, la tristesse entre à son tour dans le cœur de cet homme qui s’est irrité ; il s’afflige de ce qu’il a fait et se repent, parce qu’il a fait le mal. Cette tristesse paraît donc conduire au salut, puisque, après avoir fait le mal, il s’est repenti. Ainsi, les deux réalités attristent l’Esprit : l’indécision, parce qu’elle n’a pas réussi dans son entreprise, et l’irritation, parce qu’elle a fait le mal.[b] Toutes deux sont donc pénibles à l’Esprit saint : l’indécision et l’irritation. Ôte donc de toi la tristesse et n’accable pas l’Esprit saint qui habite en toi, de peur qu’il ne s’adresse à Dieu et ne se retire de toi.[c] Car
    l’Esprit de Dieu, qui a été donné à cette chair-ci, ne supporte ni tristesse ni oppression. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « épuise » peut aussi signifier « use » ou « accable ». La tristesse est dite sauver lorsqu’elle conduit au repentir.
    reason: Le grec associe fortement l’effet destructeur de la tristesse à son effet apparemment salutaire dans le cas du repentir.
  - marker: b
    text: 'Littéralement : « l’irritation attriste l’Esprit parce qu’elle a fait le mal ». Le grec personnifie ici l’irritation comme si elle accomplissait l’acte mauvais.'
    reason: La note explique la personnification grammaticale sans remplacer dans le texte l’attribution exprimée par le grec.
  - marker: c
    text: Le verbe grec peut signifier « s’adresser à », « adresser une requête à » ou « intercéder auprès de » Dieu.
    reason: Le sens précis de ἐντυγχάνω n’est pas déterminé davantage par le contexte ; la note préserve l’ambiguïté.
lexical_decisions:
- source_word: λύπη
  choice: tristesse
  rationale: Le terme désigne ici la tristesse ou l’affliction; « tristesse » conserve le fil lexical qui relie ses effets nuisibles à sa possible fonction salutaire.
- source_word: ἐκτρίβει
  choice: épuise
  rationale: Le verbe évoque littéralement l’usure par frottement, puis l’épuisement ou la destruction. « Épuise » reste intelligible en français sans atténuer la force de l’image.
- source_word: δίψυχος / διψυχία
  choice: homme partagé / indécision
  rationale: Le grec signifie littéralement « à l’âme double » et exprime une division intérieure qui produit l’hésitation. Les deux choix rendent naturellement la personne puis son état en français.
- source_word: ὀξυχολία
  choice: irritation
  rationale: Le mot désigne un emportement prompt ou une vive irascibilité. « Irritation » convient au registre courant et à l’idée d’un état qui s’attache durablement à la personne.
- source_word: στενοχωρία
  choice: oppression
  rationale: Le terme évoque l’étroitesse, l’angoisse ou la détresse. « Oppression » garde l’image d’un resserrement intérieur et forme un binôme naturel avec « tristesse ».
theological_decisions:
- issue: La tristesse « sauve » tout en attristant l’Esprit
  choice: Conserver les deux affirmations en distinguant la tristesse issue de l’échec et celle qui mène au repentir
  alternative: Harmoniser le passage en parlant seulement d’une tristesse mauvaise et d’un repentir salutaire
  rationale: 'Le texte maintient délibérément la tension : la tristesse peut épuiser l’Esprit, mais elle « paraît » aussi conduire au salut lorsqu’elle suit le mal et mène au repentir.'
- issue: Référent implicite dans « parce qu’elle a commis le mal »
  choice: Expliciter que l’irritation a conduit l’homme à commettre le mal
  alternative: Traduire littéralement « parce qu’elle a fait le mal »
  rationale: Le sujet grammatical grec est l’irritation, personnifiée, mais le contexte attribue l’acte à l’homme. La formulation française conserve le rôle causal de l’irritation sans suggérer qu’une abstraction agit matériellement.
- issue: L’Esprit peut « faire appel à Dieu » et se retirer
  choice: Conserver la personnification et la possibilité exprimée par le texte
  alternative: Reformuler en menace générale d’éloignement divin
  rationale: Le grec présente explicitement l’Esprit comme pouvant s’adresser à Dieu puis se retirer; il ne faut pas neutraliser cette représentation théologique propre à l’œuvre.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct et les répétitions structurantes du grec sont conservés. « Homme insensé » rend l’interpellation sévère sans adopter une tournure archaïque; les personnifications de la tristesse, de l’irritation et de l’Esprit sont maintenues.
