base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: fr
  text: « La tour que tu vois en cours de construction, c’est moi, l’Église, celle qui t’est apparue maintenant et auparavant. Tout ce que tu souhaiteras me demander au sujet de la tour, je te le révélerai, afin que tu te réjouisses avec les saints. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πύργος ὃν βλέπεις οἰκοδομούμενον
  choice: La tour que tu vois en train d’être construite
  rationale: Rend explicitement le participe présent passif, qui décrit une construction encore en cours.
- source_word: ἐγώ εἰμι ἡ Ἐκκλησία
  choice: c’est moi, l’Église
  rationale: Formulation française naturelle qui conserve l’identification emphatique entre la femme qui parle et l’Église.
- source_word: ἡ ὀφθεῖσά σοι
  choice: celle qui t’est apparue
  rationale: Le passif de ὁράω indique ici qu’elle s’est rendue visible à Hermas; « apparue » convient au contexte visionnaire.
- source_word: ὃ ἂν οὖν θελήσῃς ἐπερωτᾷν
  choice: Demande-moi donc tout ce que tu voudras
  rationale: Restitue la portée indéfinie de ὃ ἂν et l’idée d’interroger, tout en évitant une tournure française pesante.
- source_word: ἀποκαλύψω
  choice: je te le révélerai
  rationale: Conserve le vocabulaire de la révélation propre au passage et le futur grec.
- source_word: οἱ ἅγιοι
  choice: les saints
  rationale: Équivalent traditionnel et suffisamment ouvert du substantif grec désignant les personnes saintes ou consacrées.
theological_decisions:
- issue: Identification de la femme et de la tour à l’Église
  choice: « c’est moi, l’Église »
  alternative: « je représente l’Église »
  rationale: Le grec formule une identité directe, non une simple représentation; la traduction préserve cette force sans l’expliquer.
- issue: Référent des « saints »
  choice: Maintenir « les saints » sans précision
  alternative: « les fidèles » ou « le peuple saint »
  rationale: Le texte ne précise ni leur identité ni leur statut; expliciter résoudrait indûment cette ouverture.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement conforme au dialogue direct. La syntaxe reste proche du grec sans sacrifier la fluidité; aucune note n’est nécessaire pour cette unité.
