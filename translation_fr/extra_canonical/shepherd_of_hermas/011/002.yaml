base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: fr
  text: 'Elle dit : « Beaucoup entendront, certes ; après avoir entendu, certains d’entre eux se réjouiront, tandis que d’autres pleureront. Mais ceux-ci aussi, s’ils entendent et se repentent, se réjouiront à leur tour. Écoute donc les paraboles de la tour, car je te révélerai tout. Et ne me donne plus de peine au sujet des révélations : ces révélations ont une fin, car elles sont accomplies. Mais tu ne cesseras pas de demander des révélations, car tu es impudent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσονται
  choice: entendront
  rationale: Le futur passif est rendu directement et conserve l’idée que beaucoup recevront le message.
- source_word: μετανοήσωσιν
  choice: se repentent
  rationale: Ce verbe désigne ici un changement intérieur et moral en réponse à ce qui est entendu; « se repentir » est naturel dans ce contexte religieux.
- source_word: παραβολὰς
  choice: paraboles
  rationale: Le terme peut désigner des comparaisons ou explications figurées; « paraboles » maintient le vocabulaire traditionnel et l’imagerie interprétative de la tour.
- source_word: κόπους πάρεχε
  choice: donne ... de peine
  rationale: L’expression signifie causer de la peine ou du dérangement; cette formulation française reste proche sans être raide.
- source_word: τέλος ἔχουσιν
  choice: arrivent à leur terme
  rationale: Rend l’idée d’une limite ou d’un achèvement tout en évitant une formulation française ambiguë comme « ont une fin ».
- source_word: πεπληρωμέναι
  choice: sont désormais complètes
  rationale: Le parfait indique un état résultant d’un accomplissement; « désormais » fait ressortir cette valeur sans surtraduire.
- source_word: ἀναιδὴς
  choice: sans gêne
  rationale: Le mot peut signifier impudent, effronté ou insistant sans honte; « sans gêne » garde le reproche tout en convenant au ton presque taquin du dialogue.
theological_decisions:
- issue: Relation entre l’écoute, la repentance et la joie
  choice: « s’ils écoutent et se repentent, se réjouiront »
  alternative: « s’ils entendent et changent de conduite, ils se réjouiront »
  rationale: La traduction conserve les deux conditions exprimées par le grec sans préciser davantage leur rapport sotériologique.
- issue: Achèvement des révélations
  choice: « ces révélations arrivent à leur terme, car elles sont désormais complètes »
  alternative: « ces révélations ont une fin, car elles ont été accomplies »
  rationale: La formulation maintient la tension entre la fin prochaine du processus révélatoire et son état d’accomplissement, sans en tirer une doctrine générale sur toute révélation.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve les contrastes et répétitions du grec, avec une syntaxe légèrement assouplie pour la clarté orale.
