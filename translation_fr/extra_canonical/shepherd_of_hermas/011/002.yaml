  to: 'Elle dit : « Beaucoup entendront, certes ; après avoir entendu, certains d’entre eux se réjouiront, tandis que d’autres pleureront. Mais ceux-ci aussi, s’ils entendent et se repentent, se réjouiront à leur tour. Écoute donc les paraboles de la tour, car je te révélerai tout. Et ne me donne plus de peine au sujet des révélations : ces révélations ont une fin, car elles sont accomplies. Mais tu ne cesseras pas de demander des révélations, car tu es impudent. »'
  rationale: La révision conserve la structure argumentative et les répétitions du grec, tout en rendant plus exactement l’opposition entre la limite des révélations et leur accomplissement déjà établi. Elle restitue également la vigueur de l’apostrophe finale.
