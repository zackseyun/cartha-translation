  to: 'Après m’avoir montré ces choses, elle voulait repartir en courant. Je lui dis : « Dame, à quoi me sert-il d’avoir vu ces choses sans comprendre ce qu’elles signifient ? » Elle me répondit : « Tu es un homme rusé : tu veux connaître ce qui concerne la tour. » Je lui dis : « Oui, dame, afin que je les annonce aux frères, pour que ceux-ci, [devenus plus joyeux et] ayant entendu ces choses, connaissent le Seigneur dans une grande gloire. »[a]'
