  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/001.yaml
  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: fr
  text: 'Après m’avoir montré ces choses, elle voulait repartir en courant. Je lui dis : « Dame, à quoi me sert-il d’avoir vu ces choses sans comprendre ce qu’elles signifient ? » Elle me répondit : « Tu es un homme rusé : tu veux connaître ce qui concerne la tour. » Je lui dis : « Oui, dame, afin que je les annonce aux frères, pour que ceux-ci, [devenus plus joyeux et] ayant entendu ces choses, connaissent le Seigneur dans une grande gloire. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « devenus plus joyeux et » sont absents de certains témoins et leur texte est incertain.
    reason: Signaler le statut textuel incertain des mots grecs placés entre crochets dans l’édition source.
lexical_decisions:
- source_word: ἀποτρέχειν
  choice: s’en aller en courant
  rationale: Rend le mouvement rapide exprimé par le verbe, plutôt que le simple « partir ».
- source_word: Κυρία
  choice: Dame
  rationale: Titre respectueux adressé à la figure féminine; « Dame » conserve la dignité du grec sans suggérer qu’elle est le Seigneur.
- source_word: ὄφελος
  choice: à quoi me sert-il
  rationale: Expression française naturelle correspondant à l’idée de profit ou d’utilité.
- source_word: τὰ πράγματα
  choice: ce qu’elles signifient
  rationale: Dans ce contexte visionnaire, il s’agit de comprendre la portée des choses vues; cette formulation française évite le peu naturel « quelles sont les choses ».
- source_word: Πανοῦργος
  choice: rusé
  rationale: Conserve la nuance taquine ou critique de quelqu’un d’habile à obtenir ce qu’il veut, sans accentuer jusqu’à « fourbe ».
- source_word: ἀναγγείλω
  choice: je l’annonce
  rationale: Exprime la transmission aux frères de l’explication concernant la tour.
- source_word: ἐν πολλῇ δόξῃ
  choice: dans une grande gloire
  rationale: Traduction formellement proche qui préserve l’ambiguïté de la relation entre connaître le Seigneur et sa gloire.
theological_decisions:
- issue: Rapport syntaxique de « dans une grande gloire »
  choice: Conserver « ils connaissent le Seigneur dans une grande gloire »
  alternative: « ils connaissent la grande gloire du Seigneur »
  rationale: Le grec rattache directement τὸν Κύριον à γινώσκωσιν, puis ajoute ἐν πολλῇ δόξῃ; la traduction ne transforme donc pas la gloire en objet explicite de la connaissance.
- issue: Texte entre crochets dans la tradition éditoriale
  choice: Traduire les mots attestés entre crochets et les signaler dans le texte
  alternative: Les omettre entièrement
  rationale: Le passage appartient au texte source fourni mais son statut textuel est incertain; le conserver avec une note rend cette incertitude visible.
translation_notes:
  register: Français moderne, narratif et digne. Le présent de narration dans « je lui dis » et « elle me répondit » suit les variations temporelles du grec tout en restant naturel. Les guillemets français structurent clairement le dialogue.
