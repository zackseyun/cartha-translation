base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: fr
  text: 'Je lui demandai : « Pourquoi la tour a-t-elle été bâtie sur les eaux, Dame ? » Elle répondit : « Je te l’ai déjà dit auparavant, et tu poursuis ta recherche avec soin ; c’est donc en cherchant que tu trouves la vérité. Écoute maintenant pourquoi la tour a été bâtie sur les eaux : c’est parce que votre vie a été sauvée par l’eau et qu’elle sera sauvée. La tour a été fondée par la parole du Nom tout-puissant et glorieux, et elle est maintenue par la puissance invisible du Maître. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: tu poursuis ta recherche avec soin
  rationale: Rend à la fois l’idée de recherche soutenue exprimée par ἐκζητέω et l’application diligente indiquée par ἐπιμελῶς, dans un français naturel.
- source_word: διὰ ὕδατος
  choice: par l’eau
  rationale: Conserve la formulation sobre et la portée instrumentale ou médiatrice de διά sans expliciter une interprétation sacramentelle.
- source_word: τῷ ῥήματι
  choice: par la parole
  rationale: Le datif est rendu instrumentalement, conformément au rapport entre la fondation de la tour et la parole du Nom.
- source_word: τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος
  choice: du Nom tout-puissant et glorieux
  rationale: Préserve la personnification ou valeur révérencielle de « Nom » et laisse ouverte l’identification théologique exacte.
- source_word: κρατεῖται
  choice: elle est maintenue
  rationale: Exprime l’idée d’être tenu fermement ou soutenu, sans ajouter une nuance architecturale absente du grec.
- source_word: τοῦ δεσπότου
  choice: du Maître
  rationale: « Maître » rend l’autorité souveraine de δεσπότης dans un registre dignifié, sans la connotation moderne négative possible de « despote ».
theological_decisions:
- issue: Portée salvifique de l’eau
  choice: « votre vie a été sauvée par l’eau et […] le sera encore »
  alternative: Identifier explicitement l’eau au baptême
  rationale: Le texte attribue à l’eau un rôle dans le salut, mais ne nomme pas ici le baptême ; la traduction conserve cette tension sans commentaire doctrinal ajouté.
- issue: Le « Nom » comme agent de fondation
  choice: Conserver « le Nom » avec une majuscule
  alternative: Remplacer par « Dieu » ou préciser le nom du Christ
  rationale: Le grec parle littéralement du « Nom tout-puissant et glorieux ». Le maintien de cette expression respecte son caractère révérenciel et son ambiguïté référentielle.
- issue: Valeur temporelle de σωθήσεται
  choice: « elle le sera encore »
  alternative: « elle sera sauvée »
  rationale: La reprise pronominale évite une lourdeur en français, tandis que « encore » fait entendre la dimension future en continuité avec le salut passé, sans définir le mécanisme eschatologique.
translation_notes:
  register: Français moderne, clair et dignifié. Le dialogue conserve l’adresse « Dame », adaptée au statut symbolique de la femme qui parle. La syntaxe reste proche de l’enchaînement grec tout en évitant les calques pesants.
