review_pass:
  verdict: revise
  source_fidelity: La demande d’Hermas est correctement comprise dans son ensemble, et la restriction de la révélation possible est préservée. Toutefois, « puisque tu m’as jugé digne, une fois pour toutes, que tout me soit révélé » est syntaxiquement défectueux en français et obscurcit le lien grec entre le fait d’avoir été jugé digne et la révélation totale. « Ne doute pas » rend une nuance possible de μὴ διψυχήσῃς, mais le grec exprime plus précisément le fait de ne pas être intérieurement partagé à propos de ce qui sera vu.
  naturalness: Le second énoncé est naturel, hormis une légère lourdeur dans « Que seulement ». La première réplique doit être reformulée pour être idiomatique tout en conservant son insistance.
  terminology: « Dame » est un bon rendu sobre de Κυρία dans ce contexte. « Dieu », « révéler » et « cœur tourné vers Dieu » conviennent au registre et au sens.
  issues:
  - severity: medium
    issue: Construction française ambiguë et fautive dans la première phrase.
    rationale: « Tu m’as jugé digne [...] que tout me soit révélé » ne construit pas clairement l’infinitif/complément attendu et laisse incertain ce dont Hermas a été jugé digne. Une reformulation est nécessaire.
  - severity: low
    issue: « Ne doute pas » atténue la métaphore de la division intérieure.
    rationale: διψυχέω renvoie littéralement à l’état d’être « partagé », « irrésolu ». Une formulation française qui conserve cette nuance est préférable sans imposer une interprétation doctrinale.
  revised_text: 'Je lui dis : « Dame, puisque tu as jugé bon, une fois pour toutes, de tout me révéler, révèle-le-moi. » Elle me dit : « Tout ce qui peut t’être révélé te sera révélé. Seulement, que ton cœur soit tourné vers Dieu, et ne sois pas partagé au sujet de ce que tu verras. »'
