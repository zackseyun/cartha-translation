base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: fr
  text: 'Je lui dis : « Dame, puisque tu as jugé bon, une fois pour toutes, de tout me révéler, révèle-le-moi. » Elle me dit : « Tout ce qui peut t’être révélé te sera révélé. Seulement, que ton cœur soit tourné vers Dieu, et ne sois pas partagé au sujet de ce que tu verras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Dame
  rationale: Titre respectueux et digne, adapté à la figure féminine qui parle, sans introduire la connotation mariale possible de « Notre-Dame ».
- source_word: ἅπαξ
  choice: une fois pour toutes
  rationale: Rend la force de l’adverbe, qui renvoie à la décision déjà prise de l’estimer digne.
- source_word: ἠξίών με ἠγήσω
  choice: tu m’as jugé digne
  rationale: Reproduit l’idée d’une évaluation favorable ou d’une dignité reconnue.
- source_word: Ὃ ἐὰν ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: Tout ce qui peut t’être révélé
  rationale: 'Conserve la limite implicite posée par ἐνδέχηται : seules les choses susceptibles de lui être révélées le seront.'
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: Que seulement ton cœur soit tourné vers Dieu
  rationale: Formulation française naturelle qui préserve l’orientation du cœur vers Dieu.
- source_word: μὴ διψυχήσῃς
  choice: ne doute pas
  rationale: Dans ce contexte de visions, le verbe désigne l’hésitation intérieure ou le doute devant ce qui est vu; « ne sois pas partagé » resterait possible mais moins naturel ici.
theological_decisions:
- issue: Portée de la révélation promise
  choice: « Tout ce qui peut t’être révélé »
  alternative: « Tout ce qu’il t’est possible de recevoir comme révélation »
  rationale: La traduction maintient la restriction du grec sans préciser si la limite tient à Dieu, au contenu ou à la capacité d’Hermas.
- issue: Sens de διψυχήσῃς
  choice: « ne doute pas »
  alternative: « ne sois pas partagé »
  rationale: Le contexte immédiat porte sur la réaction d’Hermas à ce qu’il verra. « Douter » rend clairement cette nuance, tout en évitant d’ajouter une doctrine particulière sur l’instabilité spirituelle.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct garde une légère solennité. « Dame » est retenu comme appellation respectueuse; la syntaxe de la première phrase demeure un peu marquée afin de préserver l’insistance de l’original sur le fait d’avoir été jugé digne d’une révélation complète.
