  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the servants of God to death.”
translation:
  language: fr
  text: 3. « Quels sont, Seigneur, dis-je, les actes du mauvais désir qui livrent les êtres humains à la mort ? Fais-les-moi connaître, afin que je m’en tienne éloigné. » « Écoute, [dit-il,][a] par quels actes le mauvais désir fait mourir les serviteurs de Dieu. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « dit-il » est absent de certains témoins ou considéré comme une précision transmise de façon incertaine.
    reason: Les crochets de l’édition source signalent une incertitude textuelle ; la note la rend visible au lecteur.
lexical_decisions:
- source_word: ἐπιθυμίας τῆς πονηρᾶς
  choice: du mauvais désir
  rationale: Rend l’idée d’un désir moralement mauvais sans réduire le terme à la seule convoitise sexuelle.
- source_word: παραδιδόντα
  choice: qui livrent
  rationale: Conserve l’image forte de la remise au pouvoir ou au sort de la mort.
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: je m’en tienne éloigné
  rationale: Expression française naturelle qui garde le sens de s’abstenir et de rester à distance.
- source_word: θανατοῖ
  choice: fait mourir
  rationale: Reproduit la force causative du verbe grec plutôt que de l’atténuer en simple mise en danger.
- source_word: δούλους τοῦ Θεοῦ
  choice: les serviteurs de Dieu
  rationale: Équivalent français courant et digne dans ce contexte religieux ancien.
theological_decisions:
- issue: Rapport entre le mauvais désir, ses œuvres et la mort
  choice: Conserver successivement « livrent … à la mort » et « fait mourir »
  alternative: Harmoniser les deux formulations en « conduisent à la mort »
  rationale: Le grec emploie deux expressions distinctes et fortes; les préserver maintient la tension entre les actes qui livrent à la mort et le désir qui agit mortellement par eux.
- issue: Portée de ἄνθρωποι
  choice: les êtres humains
  alternative: les hommes
  rationale: Le terme désigne ici les personnes en général; cette formulation évite une lecture exclusivement masculine.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue direct et la répétition de « mauvais désir » sont conservés pour respecter la structure et l’insistance du grec.
