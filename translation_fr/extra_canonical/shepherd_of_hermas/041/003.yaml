  source_fidelity: Le sens est globalement fidèle, y compris la distinction entre les actes qui « livrent » à la mort et le mauvais désir qui « fait mourir ». Toutefois, « demandai-je » affaiblit légèrement le présent narratif φημί (« dis-je »), et « œuvres » est moins direct que « actes » pour ἔργα dans cette question.
  naturalness: La formulation est claire et de registre approprié. La révision proposée retire le « donc », qui n’est pas exprimé dans le grec, et emploie « Quels sont ... les actes » et « dis-je », plus naturels et plus proches du dialogue grec.
  terminology: « Mauvais désir », « livrent ... à la mort », « fait mourir » et « serviteurs de Dieu » rendent adéquatement ἐπιθυμία πονηρά, παραδίδωμι, θανατόω et δοῦλοι τοῦ Θεοῦ. « Actes » rend ici plus précisément ἔργα que « œuvres ».
