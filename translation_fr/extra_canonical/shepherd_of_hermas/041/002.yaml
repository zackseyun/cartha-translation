review_pass:
  verdict: revise
  source_fidelity: Le sens général et la personnification du mauvais désir sont bien rendus. Toutefois, « tombe sous son emprise » explicite davantage que ἐμπέσῃ εἰς αὐτήν (« tombe en lui / y tombe »), et « dévore » infléchit δαπανᾷ, qui évoque plus largement le fait de consumer, épuiser ou ravager. Une formulation moins imagée au sens strict conserve mieux la répétition du verbe grec sans ajouter l'idée d'être mangé.
  naturalness: Le français est clair et d'un registre approprié. La révision proposée allège « En particulier » et emploie « se trouve pris » pour une expression naturelle tout en restant proche de l'image grecque de la chute dans le désir.
  terminology: « Mauvais désir », « bon désir », « vêtement » et « mort » conservent utilement les termes et les images du passage. « Ce monde présent » maintient l'ambiguïté de αἰών sans imposer une lecture théologique. « Discernement » est recevable pour συνετός, mais « n'est pas avisé » rend plus directement la qualité pratique visée.
  issues:
  - severity: medium
    issue: « dévore » pour δαπανᾷ
    rationale: Le grec signifie consumer, épuiser ou ruiner; bien que la sauvagerie prépare une métaphore animale, « dévorer » ajoute une image spécifique absente du verbe et est répété dans une traduction qui peut rester plus exacte avec « ravager ».
  - severity: low
    issue: « tombe sous son emprise » pour ἐμπέσῃ εἰς αὐτήν
    rationale: Cette expression interprète la chute « dans » le mauvais désir comme une relation de domination. « Se trouve pris dans ce désir » conserve le sens sans expliciter l'image.
  - severity: low
    issue: Tour « En particulier, si »
    rationale: « Surtout lorsqu' » correspond plus naturellement à μάλιστα δὲ ἐὰν dans un français suivi.
  revised_text: 2. Car le mauvais désir est sauvage et difficile à dompter. Il est redoutable et, par sa sauvagerie, il ravage grandement les êtres humains. Surtout lorsqu’un serviteur de Dieu se trouve pris dans ce désir et n’est pas avisé, il est terriblement ravagé par lui. Il ravage ceux qui ne portent pas le vêtement du bon désir, mais qui sont mêlés à ce monde présent. Il les livre donc à la mort.
  revised_footnotes: []
