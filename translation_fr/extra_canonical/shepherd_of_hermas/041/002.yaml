base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a servant of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: fr
  text: 2. Car le mauvais désir est sauvage et difficile à dompter. Il est redoutable et, par sa sauvagerie, il ravage grandement les êtres humains. Surtout lorsqu’un serviteur de Dieu se trouve pris dans ce désir et n’est pas avisé, il est terriblement ravagé par lui. Il ravage ceux qui ne portent pas le vêtement du bon désir, mais qui sont mêlés à ce monde présent. Il les livre donc à la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: le mauvais désir
  rationale: Rend directement l’idée d’un désir moralement mauvais, sans la restreindre à la convoitise sexuelle.
- source_word: δυσκόλως ἡμεροῦται
  choice: difficile à dompter
  rationale: L’image grecque est celle d’une créature sauvage qu’on apprivoise; «dompter» conserve cette métaphore en français naturel.
- source_word: δαπανᾷ
  choice: dévore
  rationale: Le verbe signifie littéralement dépenser, consumer ou épuiser. Dans le contexte de la sauvagerie personnifiée, «dévore» exprime vivement l’action destructrice répétée.
- source_word: μὴ ᾖ συνετός
  choice: manque de discernement
  rationale: Συνετός désigne une personne avisée ou intelligente; cette formulation met en avant la prudence spirituelle sans surinterprétation.
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: le vêtement du bon désir
  rationale: Préserve l’image explicite du vêtement introduite dans le contexte précédent.
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  choice: qui se sont mêlés au monde présent
  rationale: Ἐμφύρω évoque le fait d’être mêlé ou amalgamé à quelque chose; αἰών peut désigner l’âge ou le monde présent. La formulation garde l’idée d’une implication profonde.
- source_word: παραδίδωσιν εἰς θάνατον
  choice: livre à la mort
  rationale: Correspondance formelle claire qui conserve la force judiciaire ou destructrice possible de l’expression.
theological_decisions:
- issue: Sens de αἰών dans «τῷ αἰῶνι τούτῳ»
  choice: monde présent
  alternative: siècle présent / époque présente
  rationale: «Monde présent» est idiomatique et conserve la portée morale et eschatologique possible de l’expression, sans préciser davantage la nature de cet attachement.
- issue: Nature de la mort
  choice: la mort
  alternative: la mort spirituelle / la perdition
  rationale: Le grec ne qualifie pas la mort. La traduction maintient donc l’ambiguïté au lieu d’en imposer une interprétation théologique.
- issue: Personnification du mauvais désir
  choice: maintenue par les pronoms et les verbes d’action
  alternative: reformuler comme un état psychologique impersonnel
  rationale: Le passage présente le mauvais désir comme une puissance sauvage qui dévore et livre à la mort; cette tension rhétorique doit être conservée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «dévore» conserve l’insistance du grec. La métaphore continue du mauvais désir comme bête sauvage est maintenue, de même que l’image vestimentaire du bon désir.
