revisions:
- from: 2. Car le mauvais désir est sauvage et difficile à dompter. Il est redoutable et, dans sa férocité, il dévore les êtres humains. En particulier, si un serviteur de Dieu tombe sous son emprise et manque de discernement, il est cruellement dévoré par lui. Il dévore ceux qui ne portent pas le vêtement du bon désir, mais qui se sont mêlés au monde présent. Il les livre donc à la mort.
  to: 2. Car le mauvais désir est sauvage et difficile à dompter. Il est redoutable et, par sa sauvagerie, il ravage grandement les êtres humains. Surtout lorsqu’un serviteur de Dieu se trouve pris dans ce désir et n’est pas avisé, il est terriblement ravagé par lui. Il ravage ceux qui ne portent pas le vêtement du bon désir, mais qui sont mêlés à ce monde présent. Il les livre donc à la mort.
  rationale: 'La révision conserve la structure, les répétitions et les métaphores du grec, tout en évitant de préciser la domination du désir ou de transformer « consumer/ravager » en l''image plus étroite de « dévorer ». Aucune note n''est nécessaire: « monde présent » et « mort » préservent les ambiguïtés pertinentes du texte.'
