base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: fr
  text: 'Il me dit : « Ôte de toi tout mauvais désir, et revêts-toi du désir qui est bon et noble. En effet, une fois revêtu de ce désir, tu détesteras le mauvais désir et tu le tiendras en bride comme tu voudras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le terme peut désigner un désir bon ou mauvais dans ce passage; « désir » préserve cette neutralité lexicale et la répétition structurante du grec.
- source_word: ἔνδυσαι / ἐνδεδυμένος
  choice: revêts-toi / une fois revêtu
  rationale: Conserve la métaphore explicite du vêtement et le lien verbal entre l’ordre et sa conséquence.
- source_word: σεμνήν
  choice: noble
  rationale: Rend l’idée de dignité morale et de respectabilité dans un français naturel, sans surcharge religieuse.
- source_word: χαλιναγωγήσεις
  choice: tu le tiendras en bride
  rationale: Préserve l’image concrète du mors et de la maîtrise plutôt que de la réduire à « contrôler ».
- source_word: καθὼς βούλει
  choice: comme tu voudras
  rationale: Suit le sens volitif du grec sans renforcer artificiellement l’idée de facilité ou de maîtrise absolue.
theological_decisions:
- issue: Relation entre le bon désir et le mauvais désir
  choice: Maintenir la personnification et l’opposition répétée entre les deux désirs
  alternative: Paraphraser en parlant de bonnes et de mauvaises dispositions
  rationale: Le grec présente le désir comme une réalité dont on se revêt, que l’on déteste et que l’on tient en bride; conserver ces images respecte la tension morale du texte sans l’expliquer doctrinalement.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « désir » ainsi que les métaphores du vêtement et de la bride sont volontairement conservées afin de refléter la cohésion du grec.
