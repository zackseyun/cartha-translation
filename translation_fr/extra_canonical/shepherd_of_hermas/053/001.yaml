lexical_decisions:
- source_word: Ηὐφράνθην
  choice: Je me suis réjoui
  rationale: Rend directement l’aoriste passif à sens intransitif, avec un français naturel et digne.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif marque ici une adresse respectueuse au personnage qui instruit Hermas; « Seigneur » conserve la portée du grec sans préciser davantage son statut.
- source_word: ἐπίλυσιν
  choice: explication
  rationale: Dans ce contexte, le terme désigne l’élucidation ou l’interprétation de ce qui précède; « explication » est clair et idiomatique.
- source_word: ἀκούσας
  choice: d’entendre
  rationale: Le participe aoriste exprime la circonstance qui a suscité la joie; l’infinitif français donne une formulation fluide.
