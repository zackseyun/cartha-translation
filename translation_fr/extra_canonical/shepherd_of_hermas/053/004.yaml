  source_fidelity: 'Le texte français rend fidèlement le grec du paragraphe 4 : l’exclusivité de la capacité divine à donner « guérison », l’autorité de Dieu, l’exhortation à se garder, la compassion du Seigneur, la condition de ne souiller ni la chair ni l’esprit, leur solidarité, et la conclusion « tu vivras pour Dieu ». « Fautes commises autrefois par ignorance » explicite de façon justifiée ἀγνοήματα sans réduire la guérison à un pardon. Le segment placé entre crochets dans l’édition grecque est correctement conservé comme textuellement incertain.'
