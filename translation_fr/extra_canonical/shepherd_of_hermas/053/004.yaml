  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/004.yaml
  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: fr
  text: « Pour les fautes commises autrefois par ignorance, dit-il, Dieu seul peut apporter la guérison, car tout pouvoir lui appartient. Mais maintenant, veille sur toi-même, et le Seigneur tout-puissant, dans sa grande compassion, t’accordera la guérison pour les fautes commises autrefois par ignorance[a], si désormais tu ne souilles ni ta chair ni l’esprit. En effet, tous deux sont intimement liés et ne peuvent être souillés séparément. Garde-les donc tous deux purs, et tu vivras pour Dieu. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots allant de « Mais maintenant » à « par ignorance » sont placés entre crochets dans l’édition grecque utilisée, ce qui signale une incertitude textuelle.
    reason: Signaler honnêtement que cette partie du verset est éditorialement tenue pour textuellement incertaine.
lexical_decisions:
- source_word: ἀγνοήματα
  choice: fautes commises… par ignorance
  rationale: Le terme désigne ici non une simple absence de connaissance, mais des actes fautifs imputés à l’ignorance; cette formulation reste claire sans effacer cette nuance.
- source_word: ἴασιν δοῦναι / ἴασιν δώσει
  choice: apporter / accorder la guérison
  rationale: Conserve l’image explicite de la guérison plutôt que de la remplacer par « pardon », notion possible dans le contexte mais non exprimée directement.
- source_word: ἐξουσία
  choice: pouvoir
  rationale: « Tout pouvoir lui appartient » rend naturellement l’idée d’autorité ou de capacité souveraine dans ce contexte.
- source_word: κοινά
  choice: intimement liés
  rationale: Le sens littéral « communs » serait obscur en français; la proposition suivante précise que chair et esprit ne peuvent être souillés séparément. La traduction exprime cette solidarité sans les confondre.
- source_word: ζήσῃ τῷ Θεῷ
  choice: tu vivras pour Dieu
  rationale: 'Rend le datif grec de manière concise tout en conservant son ouverture sémantique: une vie orientée vers Dieu ou vécue en relation avec lui.'
theological_decisions:
- issue: Nature de la guérison des fautes passées
  choice: Conserver le vocabulaire de la « guérison »
  alternative: Traduire par « pardon » ou « rémission »
  rationale: Le grec emploie ἴασις, terme de guérison. Le rendre par « pardon » résoudrait indûment la métaphore et pourrait importer une formulation doctrinale plus précise que le texte.
- issue: Relation entre la chair et l’esprit
  choice: Dire qu’ils sont « intimement liés » et ne peuvent être souillés séparément
  alternative: Dire qu’ils sont « une seule chose » ou que l’esprit est automatiquement coupable de tout acte corporel
  rationale: Le texte affirme leur solidarité sans les identifier ni développer une théorie anthropologique complète.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement suit le dialogue singulier du grec. Les répétitions de « fautes commises… par ignorance », « guérison », « souiller » et « tous deux » sont maintenues parce qu’elles structurent l’exhortation.
