base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: fr
  text: '« Écoute maintenant, dit-il : garde cette chair qui est la tienne pure et sans souillure, afin que l’esprit qui habite en elle témoigne en sa faveur et que ta chair soit reconnue juste. Veille à ce que la pensée que cette chair qui est la tienne est périssable ne monte jamais dans ton cœur, et à ne pas en faire un usage abusif dans quelque souillure. En effet, si tu souilles ta chair, tu souilleras aussi l’Esprit saint ; et si tu souilles ta chair[a], tu ne vivras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis est incertain à cet endroit ; le mot « chair » est signalé comme douteux, et certains proposent de lire « l’esprit » à sa place.
    reason: L'édition marque τὴν σάρκα par un signe critique ; la note informe le lecteur sans imposer une reconstruction.
lexical_decisions:
- source_word: σάρξ
  choice: chair
  rationale: Le terme « chair » conserve ici la désignation du corps humain ainsi que la tension anthropologique du passage, sans le réduire à de simples tendances pécheresses.
- source_word: ἀμίαντος / μιασμός / μιαίνω
  choice: sans souillure / souiller
  rationale: Cette famille lexicale rend de façon cohérente l’idée de contamination ou de profanation exprimée par le grec.
- source_word: μαρτυρέω
  choice: témoigner en faveur de
  rationale: Le contexte demande un témoignage favorable rendu à la chair, nuance mieux exprimée ainsi que par le seul verbe « témoigner ».
- source_word: δικαιόω
  choice: être reconnu juste
  rationale: La formulation passive garde la portée déclarative possible du verbe, sans trancher toutes ses implications théologiques.
- source_word: παραχράομαι
  choice: faire un mauvais usage de
  rationale: Expression française naturelle qui restitue l’idée d’user abusivement de la chair.
theological_decisions:
- issue: Relation entre la chair et l’esprit qui l’habite
  choice: Conserver la distinction entre « chair » et « esprit », tout en exprimant leur solidarité morale.
  alternative: Interpréter la « chair » comme la nature pécheresse ou identifier l’esprit à l’âme humaine.
  rationale: Le grec parle concrètement de la chair et de l’esprit qui demeure en elle; une interprétation plus précise importerait une anthropologie absente du texte.
- issue: Identification de τὸ πνεῦμα τὸ ἅγιον
  choice: « l’Esprit saint »
  alternative: « l’esprit saint »
  rationale: L’expression grecque peut être comprise comme une référence à l’Esprit Saint; la majuscule suit cette lecture probable, sans ajouter de formulation trinitaire au texte.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct et les répétitions structurantes de « chair » et « souiller » sont conservés. La proposition idiomatique βλέπε μήποτε ἀναβῇ ἐπὶ τὴν καρδίαν est rendue naturellement sans effacer l’image de la pensée qui monte au cœur.
