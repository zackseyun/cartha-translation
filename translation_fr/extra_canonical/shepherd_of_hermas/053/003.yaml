  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: fr
  text: « Mais, Seigneur, dis-je, si quelqu’un était auparavant dans l’ignorance, avant que ces paroles ne soient entendues, comment l’homme qui a souillé sa chair sera-t-il sauvé ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue respectueux, le terme peut signifier « seigneur » ou « maître » ; « Seigneur » conserve la dignité de l’adresse sans identifier explicitement l’interlocuteur à Dieu.
- source_word: γέγονεν ἄγνοια προτέρα
  choice: a auparavant péché par ignorance
  rationale: La tournure grecque parle littéralement d’une « ignorance antérieure », mais le contexte et la réponse qui suit (ἀγνοημάτων) visent des fautes commises dans l’ignorance ; cette formulation est naturelle en français et explicite ce lien.
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: avant d’avoir entendu ces paroles
  rationale: Le passif grec, littéralement « avant que ces paroles aient été entendues », se rend plus naturellement en français en prenant la personne concernée comme sujet implicite.
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: celui qui a souillé sa chair
  rationale: « Souiller » conserve le champ de la contamination et de l’impureté exprimé par μιαίνω, tandis que « sa chair » maintient le vocabulaire anthropologique du passage.
theological_decisions:
- issue: Nature de l’ignorance antérieure
  choice: « péché par ignorance »
  alternative: « vécu auparavant dans l’ignorance »
  rationale: Le contexte immédiat traite de la souillure de la chair et la réponse parle de guérison pour les ἀγνοήματα, des fautes d’ignorance. La traduction indique donc une ignorance moralement fautive sans préciser la nature exacte du péché.
- issue: Sens de σωθῇ
  choice: « sera-t-il sauvé ? »
  alternative: « pourra-t-il être sauvé ? »
  rationale: « Être sauvé » garde la portée sotériologique possible du verbe tout en laissant le contexte déterminer si le salut désigne ici la délivrance, la guérison ou le salut final.
translation_notes:
  register: Dialogue direct, actuel et digne. La syntaxe reste accessible, tout en conservant « chair », terme structurant du passage et théologiquement plus précis que « corps ».
