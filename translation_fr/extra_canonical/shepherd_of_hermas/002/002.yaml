review_pass:
  verdict: revise
  source_fidelity: 'Le sens narratif est fidèlement rendu : la délibération intérieure, l’apparition soudaine au présent (« je vois »), le grand siège blanc, la femme âgée tenant un livre, son installation solitaire et le contraste avec la tristesse d’Hermas sont tous conservés. Deux précisions méritent correction : le superlatif λαμπροτάτῳ demande une intensité explicite, et χαῖρε est ici une salutation conventionnelle plutôt qu’un impératif français autonome.'
  naturalness: Le texte est généralement fluide et digne. « Un habit resplendissant » est un peu moins naturel que « un vêtement très éclatant », et l’échange répété « réjouis-toi ! » sonne comme une exhortation en français moderne, là où le grec emploie la formule de salutation χαῖρε.
  terminology: « Siège » rend sobrement καθέδρα sans introduire la royauté d’un « trône ». « Femme âgée » convient pour γυνὴ πρεσβῦτις. « Madame » est une adresse respectueuse plus naturelle en français international moderne que « Dame » pour Κυρία dans ce dialogue.
  issues:
  - severity: low
    issue: Le superlatif de λαμπροτάτῳ n’est pas explicitement marqué.
    rationale: « Resplendissant » exprime l’éclat, mais « très éclatant » ou une tournure équivalente restitue mieux « très/radieux au plus haut degré ».
  - severity: medium
    issue: « Réjouis-toi ! » traite χαῖρε comme un impératif lexical plutôt que comme la formule de salutation qu’il est dans ce contexte.
    rationale: La répétition avec la réponse d’Hermas montre un échange de salutations. « Je te salue » / « Je vous salue » préserve la répétition, le respect et le registre narratif, sans créer en français l’impression d’un ordre.
  revised_text: 'Alors que je réfléchissais à tout cela et le pesais dans mon cœur, je vois devant moi un grand siège blanc, fait de laine blanche comme neige. Une femme âgée arriva, vêtue d’un vêtement très éclatant ; elle tenait un livre entre les mains, s’assit seule et me salua : « Je te salue, Hermas. » Quant à moi, dans ma tristesse et mes larmes, je répondis : « Je vous salue, Madame. »'
