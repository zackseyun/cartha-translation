revisions:
- from: 'Tandis que je réfléchissais à tout cela et le pesais dans mon cœur, je vois devant moi un grand siège blanc, fait de laine couleur de neige. Une femme âgée arriva, vêtue d’un habit resplendissant. Elle tenait un livre entre ses mains, s’assit seule et me salua : « Hermas, réjouis-toi ! » Quant à moi, dans ma tristesse et mes larmes, je répondis : « Dame, réjouis-toi ! »'
  to: 'Alors que je réfléchissais à tout cela et le pesais dans mon cœur, je vois devant moi un grand siège blanc, fait de laine blanche comme neige. Une femme âgée arriva, vêtue d’un vêtement très éclatant ; elle tenait un livre entre les mains, s’assit seule et me salua : « Je te salue, Hermas. » Quant à moi, dans ma tristesse et mes larmes, je répondis : « Je vous salue, Madame. »'
  rationale: La révision conserve toutes les images et la syntaxe visionnaire du grec, tout en explicitant le superlatif de l’habillement et en rendant χαῖρε comme une salutation française naturelle et répétable. Aucun ajout doctrinal ou interprétatif n’est introduit.
