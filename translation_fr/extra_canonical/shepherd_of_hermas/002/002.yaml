  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: fr
  text: 'Alors que je réfléchissais à tout cela et le pesais dans mon cœur, je vois devant moi un grand siège blanc, fait de laine blanche comme neige. Une femme âgée arriva, vêtue d’un vêtement très éclatant ; elle tenait un livre entre les mains, s’assit seule et me salua : « Je te salue, Hermas. » Quant à moi, dans ma tristesse et mes larmes, je répondis : « Je vous salue, Madame. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου καὶ διακρίνοντος ἐν τῇ καρδίᾳ μου
  choice: je réfléchissais à tout cela et le pesais dans mon cœur
  rationale: Rend les deux opérations intérieures, délibérer et discerner, dans un français naturel tout en conservant l’expression biblique « dans mon cœur ».
- source_word: καθέδραν
  choice: siège
  rationale: Terme neutre et digne pour un siège destiné à une figure d’autorité; évite « chaise », trop ordinaire, et « trône », plus précis que le grec.
- source_word: ἐξ ἐρίων χιονίνων γεγονυῖαν
  choice: fait de laine couleur de neige
  rationale: Conserve explicitement la matière et l’image de blancheur neigeuse sans suggérer que la laine est littéralement constituée de neige.
- source_word: γυνὴ πρεσβῦτις
  choice: une femme âgée
  rationale: Traduction directe et respectueuse, plus actuelle que « une vieille femme ».
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: vêtue d’un habit resplendissant
  rationale: Restitue le superlatif d’éclat dans un registre narratif digne.
- source_word: χαῖρε
  choice: réjouis-toi !
  rationale: Préserve la valeur littérale et l’écho verbal de la salutation grecque, répétés dans les deux répliques, plutôt que de les réduire à un simple « bonjour ».
- source_word: Κυρία
  choice: Dame
  rationale: Marque l’adresse respectueuse et le statut de l’interlocutrice sans employer « Seigneur » au féminin ni surcharger le terme d’une nuance confessionnelle.
theological_decisions:
- issue: Nature du siège blanc
  choice: « siège »
  alternative: « trône » ou « chaire »
  rationale: Le grec καθέδρα désigne un siège; traduire par « trône » introduirait une identification ou une symbolique royale que le texte ne formule pas explicitement.
- issue: Portée de la salutation χαῖρε
  choice: « réjouis-toi ! »
  alternative: « salut ! » ou « bonjour ! »
  rationale: 'La formulation littérale maintient la tension narrative: la femme invite Hermas à se réjouir alors qu’il est précisément triste et en pleurs.'
translation_notes:
  register: Français international moderne, narratif et digne. Le présent de vision « je vois » est conservé après l’imparfait, conformément au brusque passage temporel du grec. Les répétitions et le contraste entre la salutation joyeuse et la tristesse d’Hermas sont maintenus.
