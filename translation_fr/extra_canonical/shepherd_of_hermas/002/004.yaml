  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: fr
  text: 'Mais elle dit : « Cela ne saurait aucunement s’appliquer au serviteur de Dieu. Pourtant, une pensée à son sujet t’est certainement montée au cœur. Chez les serviteurs de Dieu, une telle intention est porteuse de péché. Car c’est un dessein mauvais et insensé, pour un esprit très vénérable et déjà éprouvé, que de désirer une action mauvaise — surtout pour Hermas, l’homme maître de lui-même, qui s’abstient de tout mauvais désir et qui est plein de toute simplicité et d’une grande innocence. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρᾶγμα τοῦτο
  choice: cela
  rationale: Rend naturellement « cette affaire/cette chose » en renvoyant à l’accusation évoquée juste avant.
- source_word: βουλή
  choice: intention
  rationale: Le terme désigne ici une pensée délibérative ou un dessein intérieur, plus fort qu’une pensée passagère.
- source_word: ἁμαρτίαν ἐπιφέρουσα
  choice: entraîne le péché
  rationale: Conserve l’idée causative du grec sans préciser au-delà du texte le statut exact de la culpabilité.
- source_word: ἔκπληκτος
  choice: révoltante
  rationale: Dans ce contexte moral, exprime le caractère choquant ou consternant de l’intention.
- source_word: πάνσεμνον πνεῦμα
  choice: un esprit tout à fait pur
  rationale: Rend la haute dignité morale et la révérence exprimées par πάνσεμνος dans un français intelligible.
- source_word: δεδοκιμασμένον
  choice: déjà éprouvé
  rationale: Préserve l’idée d’un caractère mis à l’épreuve et reconnu.
- source_word: ἐγκρατής
  choice: l’homme maître de lui-même
  rationale: Exprime la maîtrise de soi plutôt qu’une abstinence limitée à un domaine particulier.
- source_word: ἁπλότης
  choice: simplicité
  rationale: Conserve le terme moral traditionnel, qui évoque ici la droiture et l’absence de duplicité.
- source_word: ἀκακία
  choice: innocence
  rationale: Rend l’absence de malice ou de méchanceté dans ce portrait moral.
theological_decisions:
- issue: Rapport entre pensée intérieure, intention et péché
  choice: « une telle intention entraîne le péché »
  alternative: « une telle pensée constitue un péché »
  rationale: Le grec emploie une formulation causative et ne définit pas explicitement l’intention elle-même comme étant le péché; la traduction préserve cette tension.
- issue: Portée de la première négation
  choice: « Cela ne saurait aucunement s’appliquer au serviteur de Dieu »
  alternative: « Cette affaire n’est absolument pas arrivée au serviteur de Dieu »
  rationale: La syntaxe grecque est elliptique. Cette formulation maintient le contraste entre le démenti initial et l’affirmation qu’une pensée est néanmoins montée dans le cœur.
translation_notes:
  register: Français moderne, international et digne. La formulation garde le ton moral solennel du passage tout en évitant les archaïsmes. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
