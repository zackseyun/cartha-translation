revisions:
- from: 'Mais elle dit : « Cela ne saurait aucunement s’appliquer au serviteur de Dieu. Pourtant, cette pensée à son sujet t’est certainement montée au cœur. Chez les serviteurs de Dieu, une telle intention entraîne le péché. Car c’est une intention mauvaise et révoltante, pour un esprit tout à fait pur et déjà éprouvé, que de désirer une action mauvaise — à plus forte raison pour Hermas, l’homme maître de lui-même, qui s’abstient de tout mauvais désir et qui est plein d’une entière simplicité et d’une grande innocence. »'
  to: 'Mais elle dit : « Cela ne saurait aucunement s’appliquer au serviteur de Dieu. Pourtant, une pensée à son sujet t’est certainement montée au cœur. Chez les serviteurs de Dieu, une telle intention est porteuse de péché. Car c’est un dessein mauvais et insensé, pour un esprit très vénérable et déjà éprouvé, que de désirer une action mauvaise — surtout pour Hermas, l’homme maître de lui-même, qui s’abstient de tout mauvais désir et qui est plein de toute simplicité et d’une grande innocence. »'
