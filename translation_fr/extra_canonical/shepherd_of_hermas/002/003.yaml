base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: fr
  text: 'Elle me dit : « Pourquoi es-tu sombre, Hermas, toi qui es patient, sans esprit de querelle et toujours à rire ? Pourquoi as-tu l’air si abattu et n’es-tu pas joyeux ? » Je lui répondis : « C’est à cause d’une femme d’une très grande bonté, qui dit que j’ai péché contre elle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: sombre
  rationale: Rend l’humeur morose et l’expression assombrie, tout en évitant un terme trop soutenu.
- source_word: μακρόθυμος
  choice: patient
  rationale: Exprime l’endurance et la patience de caractère dans un français courant et digne.
- source_word: ἀστομάχητος
  choice: sans esprit de querelle
  rationale: Le terme désigne quelqu’un qui ne cherche pas les disputes; cette formulation naturelle préserve le trait de caractère.
- source_word: γελῶν
  choice: souriant
  rationale: Dans ce portrait habituel d’Hermas, « souriant » est plus naturel en français que le littéral « riant toujours ».
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: as-tu l’air si abattu
  rationale: Rend idiomatiquement l’abattement visible dans l’apparence.
- source_word: γυναικὸς ἀγαθωτάτης
  choice: une femme d’une très grande bonté
  rationale: Préserve le superlatif et la valeur morale de ἀγαθωτάτης, sans réduire le sens à la seule respectabilité.
- source_word: ἥμαρτον εἰς αὐτήν
  choice: j’ai péché contre elle
  rationale: Conserve le vocabulaire moral et religieux du grec ainsi que la relation exprimée par εἰς.
theological_decisions:
- issue: Nature de la faute alléguée
  choice: « j’ai péché contre elle »
  alternative: « je lui ai fait du tort »
  rationale: Le grec emploie explicitement ἁμαρτάνω; la traduction garde donc « péché » sans préciser davantage la nature de la faute, qui dépend du contexte plus large.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre le tempérament habituellement patient et joyeux d’Hermas et son abattement présent est conservé. Aucun ajout explicatif ni particularisme confessionnel.
