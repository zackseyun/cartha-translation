- from: 'Après qu’elle eut prononcé ces paroles, les cieux se refermèrent. Quant à moi, je tremblais de tout mon être et j’étais affligé. Je me disais en moi-même : « Si ce péché est porté à mon compte, comment pourrai-je être sauvé ? Comment obtiendrai-je de Dieu le pardon de mes péchés accomplis ? Et par quelles paroles supplierai-je le Seigneur de m’être favorable ? »'
  to: 'Après qu’elle eut prononcé ces paroles, les cieux se fermèrent. Quant à moi, je tremblais de tout mon être et j’étais affligé. Je me disais en moi-même : « Si ce péché est porté à mon compte, comment pourrai-je être sauvé ? Comment pourrai-je rendre Dieu favorable au sujet de mes péchés pleinement commis[a] ? Et par quelles paroles supplierai-je le Seigneur de m’être favorable ? »'
  rationale: La révision corrige la fidélité de la seconde question en maintenant Dieu comme l’objet de l’action propitiatoire, allège deux formulations sans perte de sens, et ajoute une note au seul endroit où le grec demeure lexicalement et contextuellement incertain.
