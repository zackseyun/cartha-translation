  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: fr
  text: 'Après qu’elle eut prononcé ces paroles, les cieux se fermèrent. Quant à moi, je tremblais de tout mon être et j’étais affligé. Je me disais en moi-même : « Si ce péché est porté à mon compte, comment pourrai-je être sauvé ? Comment pourrai-je rendre Dieu favorable au sujet de mes péchés pleinement commis[a] ? Et par quelles paroles supplierai-je le Seigneur de m’être favorable ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de mes péchés accomplis ». Le terme grec est inhabituel ici et peut désigner des péchés menés à leur terme, possiblement par contraste avec une pensée qui n’a pas abouti à l’acte.'
    reason: Conserver l’ambiguïté de τῶν ἁμαρτιῶν μου τῶν τελείων, sans lui attribuer d’emblée le sens de « péchés graves » ou de « péchés passés ».
lexical_decisions:
- source_word: ἐκλείσθησαν
  choice: se refermèrent
  rationale: Le passif grec signifie que les cieux furent fermés; « se refermèrent » est naturel dans le cadre visionnaire et suggère leur fermeture après la parole céleste.
- source_word: ὅλος ἤμην πεφρικὼς
  choice: je tremblais de tout mon être
  rationale: Rend l’intensité de ὅλος et l’état durable exprimé par le participe parfait, dans un français courant et digne.
- source_word: ἀναγράφεται
  choice: est porté à mon compte
  rationale: Conserve l’image d’une faute inscrite ou enregistrée contre Hermas sans imposer un vocabulaire juridique trop technique.
- source_word: ἐξιλάσομαι τὸν Θεόν
  choice: obtiendrai-je de Dieu le pardon
  rationale: La construction grecque évoque l’action de rendre Dieu propice ou d’obtenir son apaisement; cette formulation française évite l’étrange « expier Dieu » tout en gardant Dieu comme celui auprès de qui le pardon est recherché.
- source_word: τῶν ἁμαρτιῶν μου τῶν τελείων
  choice: mes péchés accomplis
  rationale: Traduction volontairement proche de l’expression difficile; τελείων peut désigner des péchés menés à leur terme, par contraste possible avec une pensée qui n’a pas abouti à l’acte.
- source_word: ἵνα ἱλατευθῇ μοι
  choice: de m’être favorable
  rationale: Rend la demande que le Seigneur se montre propice envers le suppliant, sans préciser davantage le mécanisme théologique.
theological_decisions:
- issue: Sens de l’expiation ou de la propitiation dans ἐξιλάσομαι et ἱλατευθῇ
  choice: « obtiendrai-je de Dieu le pardon » et « de m’être favorable »
  alternative: « comment expierai-je mes péchés devant Dieu ? » et « afin qu’il me pardonne »
  rationale: Le texte associe l’idée de rendre Dieu propice à celle d’une supplication. La traduction conserve cette tension sans affirmer qu’Hermas produit lui-même une expiation ni réduire les deux expressions à un seul concept.
- issue: Portée de τῶν τελείων
  choice: « péchés accomplis »
  alternative: « péchés graves » ou « péchés passés »
  rationale: Le sens littéral lié à l’accomplissement convient au contexte immédiat, où une pensée coupable est distinguée d’un acte consommé. Les alternatives résolvent trop vite une expression inhabituelle.
translation_notes:
  register: Français moderne international, narratif et digne. Le rythme interrogatif et l’angoisse d’Hermas sont conservés; aucune terminologie confessionnelle spécialisée n’est ajoutée.
