base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: fr
  text: '« Jésus » est un nom caché ; « Christ » est un nom révélé. Ainsi, « Jésus » ne se traduit pas : il est appelé par son nom, « Jésus ». Mais le nom « Christ » se dit « Messie » en syriaque, « Christ » en grec, et, chez tous les autres, selon leur propre langue. « Le Nazaréen » révèle ce qui est caché. Christ a tout en lui-même, que ce soit l’être humain, l’ange ou le mystère, ainsi que le Père.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni ; la vérification directe du texte copte reste à effectuer.
    reason: Signaler avec transparence que la rédaction n’a pas encore pu être contrôlée directement sur la langue ancienne.
lexical_decisions:
- source_word: Jesus
  choice: Jésus
  rationale: Forme française conventionnelle du nom, conservée comme nom propre conformément à l’opposition du passage entre nom non traduit et titre traduit.
- source_word: Christ
  choice: Christ
  rationale: Forme française reçue, maintenue dans l’explication multilingue du titre.
- source_word: Messiah
  choice: Messie
  rationale: Équivalent français courant du titre sémitique mentionné par le témoin anglais.
- source_word: Syriac
  choice: syriaque
  rationale: Désignation française standard de la langue.
- source_word: The Nazarene
  choice: Le Nazaréen
  rationale: Rend le titre défini et conserve son rôle énigmatique dans l’opposition entre révélé et caché.
- source_word: mystery
  choice: mystère
  rationale: Conserve le terme théologique large sans le préciser ni l’interpréter.
theological_decisions:
- issue: Rapport entre les noms « Jésus », « Christ » et « le Nazaréen »
  choice: Conserver l’opposition paradoxale entre nom caché, nom révélé et titre qui révèle le caché.
  alternative: Expliquer ces expressions comme une théorie précise de l’identité ou de la révélation.
  rationale: Le passage formule ces rapports de manière énigmatique ; les expliciter imposerait une interprétation théologique absente du témoin fourni.
- issue: Portée de « Christ a tout en lui-même »
  choice: Maintenir l’énumération « l’être humain, l’ange ou le mystère, ainsi que le Père » sans harmonisation.
  alternative: Reformuler en catégories ontologiques cohérentes ou préciser que Christ contient seulement leurs réalités ou leurs noms.
  rationale: La syntaxe et la portée théologique de l’énumération sont difficiles ; la traduction préserve cette tension plutôt que de la résoudre.
- issue: Référence de « tous les autres »
  choice: Employer « chez tous les autres, selon leur propre langue » sans identifier explicitement des peuples, des locuteurs ou des langues.
  alternative: Traduire « dans toutes les autres langues » ou « tous les autres peuples le nomment dans leur langue ».
  rationale: Le témoin anglais laisse le référent implicite ; la formulation française garde cette indétermination autant que possible.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition des noms et le caractère énigmatique des affirmations sont volontairement conservés. La formulation évite le jargon spécialisé et n’ajoute aucune interprétation confessionnelle.
