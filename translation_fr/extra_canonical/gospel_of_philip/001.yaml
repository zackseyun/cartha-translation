translation:
  language: fr
  text: 'Un Hébreu engendre un Hébreu, et [les gens] de cette sorte sont appelés « prosélytes ». Mais un [prosélyte] n’engendre pas un autre prosélyte. Ils sont comme […] et ils en engendrent d’autres […] il leur suffit de venir à l’existence.


    L’esclave ne cherche que la liberté ; il ne cherche pas les biens de son maître. Mais le fils n’est pas seulement un fils : il revendique pour lui-même l’héritage de son père. Ceux qui héritent des morts sont eux-mêmes morts, et ils héritent des morts. Ceux qui héritent des vivants sont eux-mêmes vivants, et ils héritent des vivants comme des morts. Les morts ne peuvent hériter de rien, car comment les morts pourraient-ils hériter ? Si celui qui est mort hérite de celui qui est vivant, il ne mourra pas ; au contraire, le mort vivra plus encore ! Un non-Juif ne meurt pas, puisqu’il n’a jamais vécu de manière à pouvoir mourir. Quiconque a cru en la Vérité a vécu, et il risque de mourir, puisqu’il est vivant depuis le jour où le Christ est venu. Le monde est créé, les villes sont embellies[a] et les morts sont emportés.


    Lorsque nous étions Hébreux, nous étions sans père : nous n’avions que notre mère. Mais lorsque nous sommes devenus chrétiens, nous avons reçu à la fois un père et une mère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du terme rendu ici par « embellies » est incertain dans ce contexte. Il peut évoquer le fait d’aménager, d’orner ou d’ennoblir les villes.
    reason: Le témoin anglais « gentrified » est inhabituel et une vérification directe du copte reste à faire.
lexical_decisions:
- source_word: creates
  choice: engendre
  rationale: Dans l’opposition entre Hébreu et prosélyte, le verbe exprime la production ou transmission d’une identité; « engendre » conserve la métaphore familiale reprise ensuite par « fils », « père » et « mère ».
- source_word: proselyte
  choice: prosélyte
  rationale: Terme français courant dans les textes religieux pour une personne convertie et intégrée à une communauté.
- source_word: slave
  choice: esclave
  rationale: Le contraste juridique avec le fils, la liberté et l’héritage exige le sens fort d’« esclave », plutôt que le plus faible « serviteur ».
- source_word: claims
  choice: revendique pour lui-même
  rationale: Rend l’idée d’une prétention effective à l’héritage, sans préciser davantage son fondement juridique.
- source_word: gentile
  choice: non-Juif
  rationale: Expression immédiatement compréhensible en français moderne et adaptée à l’opposition identitaire entre Hébreux, prosélytes et chrétiens.
- source_word: Truth
  choice: Vérité
  rationale: La majuscule préserve la probable valeur personnifiée ou transcendante du terme sans en imposer une définition doctrinale.
- source_word: gentrified
  choice: embellies
  rationale: Le témoin anglais emploie un terme moderne inhabituel; « embellies » restitue prudemment l’idée d’un aménagement ou ennoblissement des villes, signalée en note comme incertaine.
- source_word: gained
  choice: avons reçu
  rationale: Formulation française naturelle qui exprime l’acquisition d’un père et d’une mère sans suggérer nécessairement une possession.
theological_decisions:
- issue: Les vivants et les morts comme catégories spirituelles ou physiques
  choice: Conserver littéralement « vivants » et « morts »
  alternative: Expliciter « spirituellement vivants » et « spirituellement morts »
  rationale: Le passage joue délibérément sur les sens de la vie et de la mort; les préciser supprimerait son ambiguïté et sa tension.
- issue: « Depuis le jour où le Christ est venu »
  choice: Conserver la référence temporelle sans l’interpréter
  alternative: Identifier cette venue à l’incarnation, à la conversion ou à une venue intérieure
  rationale: Le témoin ne détermine pas explicitement la nature de la venue du Christ.
- issue: Le père et la mère des chrétiens
  choice: Ne pas identifier les figures
  alternative: Nommer Dieu, l’Esprit, l’Église ou une autre réalité comme père ou mère
  rationale: Le texte transmis laisse ces identités implicites; toute identification importerait une interprétation théologique particulière.
- issue: Le non-Juif qui « n’a jamais vécu »
  choice: Préserver la déclaration paradoxale
  alternative: L’atténuer ou l’expliquer comme une absence de vie spirituelle
  rationale: La formulation abrupte fait partie de l’argument du passage et ne doit pas être harmonisée.
translation_notes:
  register: Français international moderne, digne et lisible. Les crochets et les points de suspension reproduisent les restaurations et lacunes signalées dans le témoin. Traduction provisoire fondée sur le témoin anglais public, la révision directe du copte étant encore en attente.
