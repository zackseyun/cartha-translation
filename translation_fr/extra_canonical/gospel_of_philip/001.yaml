    issue: Sens de « gentrified » indirect et provisoire
    rationale: Le témoin anglais emploie un terme inhabituel et le contrôle direct du copte est explicitement en attente. Le choix « embellies » est idiomatique, et la note informe honnêtement le lecteur de la marge d’incertitude; aucune correction sûre ne s’impose sur la seule base fournie.
