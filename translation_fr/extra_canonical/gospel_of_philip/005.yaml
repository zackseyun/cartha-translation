    text: Le début de cette parole est très lacunaire ; les crochets et les points de suspension signalent les pertes ou restitutions du manuscrit.
    reason: La note décrit les marques de lacune et de restitution effectivement présentes dans cette parole, sans attribuer ce statut aux parenthèses du segment précédent.
  revision_rationale: La révision rétablit la distinction formelle du témoin entre parenthèses et crochets, supprime une note textuellement inexacte, et remplace une construction française peu naturelle par une expression moderne équivalente. Les ambiguïtés du passage, son vocabulaire cosmologique potentiel et ses tensions théologiques ne sont ni expliqués ni harmonisés.
