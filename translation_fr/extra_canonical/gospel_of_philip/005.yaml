    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: fr
  text: 'Certains disent : « Marie a conçu par l’Esprit saint. » Ils se trompent ; ils ne savent pas ce qu’ils disent. Quand une femme a-t-elle jamais conçu par une femme ? « Marie est la vierge qu’aucune puissance n’a souillée » : tel est le grand témoignage de ces Hébreux qui devinrent les [premiers] apôtres et les [successeurs] apostoliques.[a] La vierge qu’aucune puissance n’a souillée […] les puissances se sont souillées elles-mêmes.


    Et le Seigneur [n’aurait pas] dit : « Mon [Père qui est] au ciel », s’[il] n’avait pas eu un autre père. Il aurait simplement dit : [« Mon Père. »] Le Seigneur dit aux [disciples : « …] [de] chaque [maison], et apportez dans la maison du Père ; mais ne volez rien dans la maison du Père et ne l’emportez pas. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les crochets signalent ici des mots restitués ou incertains dans le témoin utilisé. La formulation exacte devra être vérifiée directement sur le copte.
    reason: Le témoin anglais indique des compléments entre parenthèses, et la révision de la langue source est encore en attente.
  - marker: b
    text: Le début de cette parole est très lacunaire ; les crochets et les points de suspension signalent les pertes ou restitutions du manuscrit.
    reason: Éviter de donner une fausse impression de continuité ou de certitude dans un passage endommagé.
lexical_decisions:
- source_word: Holy Spirit
  choice: l’Esprit saint
  rationale: Formulation française naturelle et reconnue, sans ajouter d’interprétation au témoin anglais provisoire.
- source_word: power / powers
  choice: puissance / puissances
  rationale: Conserve la répétition et la possible portée cosmologique du terme, plutôt que de la réduire à « autorité » ou « force ».
- source_word: defiled
  choice: souillée / se sont souillées
  rationale: Préserve le contraste verbal et la connotation d’impureté du passage.
- source_word: apostolic (successors)
  choice: '[successeurs] apostoliques'
  rationale: Reproduit la restauration signalée dans le témoin fourni, avec une tournure intelligible en français.
- source_word: carry it away
  choice: l’emportez pas
  rationale: Distingue l’action d’emporter de celle de voler, conformément au parallélisme du témoin.
theological_decisions:
- issue: Genre grammatical de « Esprit » et argument « femme par femme »
  choice: Conserver littéralement « l’Esprit saint » puis « une femme par une femme »
  alternative: Expliciter que l’argument dépend du genre féminin du mot « esprit » en copte ou dans une langue sous-jacente
  rationale: Le texte fait lui-même ce rapprochement énigmatique. Une explication dans le corps du texte résoudrait abusivement la tension ; la révision directe du copte reste en attente.
- issue: « un autre père »
  choice: Conserver l’affirmation sans harmonisation doctrinale
  alternative: Reformuler comme une distinction entre le Père céleste et le père terrestre
  rationale: Le passage est théologiquement tendu et fragmentaire ; il ne faut pas imposer une lecture confessionnelle.
- issue: Puissances
  choice: Maintenir le terme ouvert « puissances »
  alternative: Rendre par « autorités spirituelles », « archontes » ou « forces »
  rationale: Le témoin fourni ne permet pas de trancher avec sûreté entre une acception générale et des êtres cosmiques.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions, ruptures logiques, ambiguïtés et marques de lacune ont été conservées. Projet provisoire fondé sur le témoin anglais public fourni, puisque l’examen direct du copte du Codex de Nag Hammadi II,3 reste à effectuer.
