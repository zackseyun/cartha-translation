review_pass:
  verdict: revise
  source_fidelity: 'Le sens du témoin anglais est globalement conservé, y compris l’argument volontairement énigmatique fondé sur « femme », la référence non interprétée aux « puissances » et les lacunes. Toutefois, les parenthèses du témoin (« (the first) », « (the) apostolic (successors) ») ont été transformées en crochets et partiellement déplacées : cela confond des compléments parenthétiques avec les restitutions/lacunes signalées par crochets dans le reste du passage. La note a en tire donc une conclusion matérielle non attestée par le témoin fourni.'
  naturalness: '« Marie a conçu par l’Esprit saint » est peu idiomatique en français moderne. « Marie est devenue enceinte par l’Esprit saint » rend naturellement l’énoncé cité et permet de conserver sans explication l’enchaînement : « Quand une femme est-elle jamais devenue enceinte par une femme ? » Le reste peut garder son caractère abrupt et fragmentaire.'
  terminology: « Esprit saint », « puissances », « souillée » et « Père » sont des choix recevables. « Successeurs apostoliques » demeure ouvert et fidèle à la formulation provisoire. Les parenthèses sont conservées pour ne pas leur attribuer abusivement le statut de restitution manuscrite ; les crochets et l’ellipse continuent de signaler les zones lacunaires ou restituées selon le témoin.
  issues:
  - severity: medium
    issue: Les parenthèses du témoin sont rendues par des crochets dans « [premiers] » et « [successeurs] apostoliques ».
    rationale: Le témoin anglais distingue explicitement les parenthèses des crochets. Les remplacer entraîne une fausse présentation des marques textuelles et rend inexacte la note a.
  - severity: medium
    issue: La note a affirme que les crochets signalent des mots restitués ou incertains dans ce segment.
    rationale: Dans le témoin fourni, les éléments correspondants sont entre parenthèses, non entre crochets. Cette note doit donc être retirée plutôt que d’étendre indûment une information paléographique.
  - severity: low
    issue: « Marie a conçu par l’Esprit saint » n’est pas une formulation française moderne naturelle.
    rationale: La construction avec « concevoir par » est maladroite. « Est devenue enceinte par » transmet le même contenu sans résoudre l’ambiguïté théologique ou textuelle.
  revised_text: 'Certains disent : « Marie est devenue enceinte par l’Esprit saint. » Ils se trompent ; ils ne savent pas ce qu’ils disent. Quand une femme est-elle jamais devenue enceinte par une femme ? « Marie est la vierge qu’aucune puissance n’a souillée » : tel est le grand témoignage de ces Hébreux qui devinrent (les premiers) apôtres et (les) successeurs apostoliques. La vierge qu’aucune puissance n’a souillée […] les puissances se sont souillées elles-mêmes.


    Et le Seigneur [n’aurait pas] dit : « Mon [Père qui est] au ciel », s’[il] n’avait pas eu un autre père. Il aurait simplement dit : [« Mon Père. »] Le Seigneur dit aux [disciples : « …] [de] chaque [maison], et apportez dans la maison du Père ; mais ne volez rien dans la maison du Père et ne l’emportez pas. »[b]'
  revised_footnotes:
