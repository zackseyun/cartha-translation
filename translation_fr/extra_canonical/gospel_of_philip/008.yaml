translation:
  language: fr
  text: 'Jésus les prit tous par surprise, car il ne se montrait pas tel qu’il était, mais il se montrait comme [ils] étaient capables de le voir. Il se montra à eux (de) [toutes ces] (manières) : il [se montra] aux grands comme grand ; il [se montra] aux petits comme petit ; il [se montra] aux anges comme un ange, et aux humains comme un humain. Ainsi, sa Parole se cacha à tous. Certains le virent, mais ils pensaient se voir eux-mêmes. Cependant, lorsqu’il apparut dans la gloire à ses disciples sur la montagne, il n’était pas petit. Il devint grand, mais il rendit aussi les disciples grands, afin qu’ils soient capables de le voir comme grand.


    Ce jour-là, pendant l’eucharistie[a], il dit : « Toi qui as uni la lumière parfaite à l’Esprit saint, unis aussi les anges à nous, aux images[b] ! »


    Ne méprise pas l’agneau, car sans lui il est impossible de voir la porte. Personne ne pourra s’approcher du roi nu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pendant l’eucharistie » traduit un témoin anglais fondé sur le copte ; une révision directe du manuscrit reste à faire.
    reason: Signaler le caractère provisoire de la formulation et éviter de surdéterminer son cadre liturgique.
  - marker: b
    text: 'La construction est obscure : « aux images » peut se rattacher à « nous », mais le rapport exact entre les anges, « nous » et les images demeure incertain.'
    reason: Préserver une ambiguïté réelle du témoin plutôt que proposer une syntaxe théologiquement harmonisée.
lexical_decisions:
- source_word: took all of them by stealth
  choice: les prit tous par surprise
  rationale: Conserve l’idée d’une action dissimulée ou inattendue sans suggérer nécessairement un enlèvement physique, que le témoin anglais ne permet pas d’établir.
- source_word: his Word
  choice: sa Parole
  rationale: La majuscule maintient la possible portée personnifiée ou théologique de « Word » sans la définir davantage.
- source_word: great / small
  choice: grand / petit
  rationale: La répétition et l’opposition sont conservées, car elles structurent le passage et peuvent désigner autant une condition spirituelle qu’une grandeur perçue.
- source_word: Eucharist
  choice: eucharistie
  rationale: Terme français courant et historiquement intelligible, conservé sans préciser une doctrine sacramentelle.
- source_word: images
  choice: images
  rationale: Choix littéral qui préserve l’obscurité du référent au lieu de l’interpréter comme icônes, figures ou reflets.
- source_word: lamb
  choice: agneau
  rationale: Conserve l’image symbolique sans identifier explicitement l’agneau à Jésus, identification possible mais non formulée dans cette phrase.
theological_decisions:
- issue: Mode d’apparition de Jésus selon la capacité des êtres
  choice: Maintenir que Jésus se montre sous des formes adaptées à ceux qui le voient
  alternative: Interpréter ces formes comme de simples perceptions subjectives
  rationale: Le passage associe manifestation et capacité de voir sans expliquer leur mécanisme ; la traduction conserve cette tension.
- issue: La Parole de Jésus se cache
  choice: « sa Parole se cacha à tous »
  alternative: « son enseignement resta caché à tous » ou identification explicite au Logos
  rationale: Le témoin permet une lecture liée au discours comme une lecture personnifiée ; « Parole » préserve les deux.
- issue: Les disciples rendus grands
  choice: « il rendit aussi les disciples grands »
  alternative: « il éleva les disciples » ou « il agrandit leur perception »
  rationale: La formulation concrète et paradoxale du passage est maintenue sans imposer une explication mystique ou psychologique.
- issue: Association des anges, de « nous » et des images
  choice: Conserver la syntaxe ambiguë « unis aussi les anges à nous, aux images »
  alternative: Comprendre « avec nous et avec les images » ou « unis-nous aux anges par les images »
  rationale: Le rapport exact entre les groupes demeure obscur dans le témoin fourni ; la traduction évite de le résoudre silencieusement.
- issue: Voir la porte grâce à l’agneau
  choice: Conserver séparément les symboles de l’agneau et de la porte
  alternative: Identifier explicitement l’un ou l’autre au Christ ou à un rite
  rationale: Le texte juxtapose ces images sans livrer leur interprétation.
- issue: S’approcher du roi nu
  choice: Traduction littérale
  alternative: Ajouter « sans vêtement de gloire », « sans vêtement nuptial » ou une autre explication
  rationale: Toute précision doctrinale dépasserait le témoignage fourni.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions de « grand », « petit » et « se montrer » sont volontairement maintenues. Les crochets et parenthèses reproduisent les signaux de restitution ou d’incertitude du témoin anglais. Projet provisoire établi à partir d’un témoin anglais du domaine public ; la vérification directe du copte est encore en attente.
