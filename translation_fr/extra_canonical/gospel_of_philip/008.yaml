review_pass:
  verdict: revise
  source_fidelity: La traduction suit globalement le témoin anglais fourni et conserve ses signaux d’incertitude. Toutefois, « par surprise » ne rend pas adéquatement « by stealth », qui désigne une action accomplie secrètement ou à la dérobée, non un simple effet de surprise. La formulation de la prière concernant les anges et les images doit aussi mieux refléter l’association ambiguë exprimée par « with ».
  naturalness: Le français est dans l’ensemble lisible et de registre approprié. « Sa Parole se cacha à tous » est cependant peu idiomatique et peut se comprendre comme une dissimulation active envers autrui; « se déroba à tous » rend plus naturellement l’idée qu’elle leur resta cachée. « Aux images » après « à nous » donne en outre une coordination française artificielle et sémantiquement trompeuse.
  terminology: « Parole », « eucharistie », « Esprit saint », « agneau », « porte » et « roi » sont des choix recevables et n’imposent pas d’interprétation confessionnelle. Les oppositions « grand/petit » et « ange/humain » sont convenablement préservées. La majuscule de « Parole » maintient, sans trancher, une éventuelle personnification.
  issues:
  - severity: medium
    issue: « par surprise » pour « by stealth »
    rationale: « Par surprise » décrit principalement la réaction de ceux qui sont surpris; le témoin indique plutôt que Jésus les prit ou les saisit secrètement, « à la dérobée ».
  - severity: medium
    issue: Rendu de « his Word hid itself from everyone »
    rationale: « Sa Parole se cacha à tous » est peu naturel et risque d’altérer la relation. « Sa Parole se déroba à tous » exprime plus directement qu’elle demeura cachée à chacun.
  - severity: medium
    issue: Syntaxe de « unis aussi les anges à nous, aux images »
    rationale: En français, « à nous, aux images » coordonne les destinataires comme si anges, nous et images étaient simplement deux compléments régis identiquement. « Avec nous, avec les images » conserve plus fidèlement l’association répétée par le témoin, tout en laissant son rapport exact obscur.
  revised_text: 'Jésus les prit tous à la dérobée, car il ne se montrait pas tel qu’il était, mais il se montrait comme [ils] étaient capables de le voir. Il se montra à eux (de) [toutes ces] (manières) : il [se montra] aux grands comme grand ; il [se montra] aux petits comme petit ; il [se montra] [aux] anges comme un ange, et aux humains comme un humain. Ainsi, sa Parole se déroba à tous. Quelques-uns le virent, pensant se voir eux-mêmes. Cependant, lorsqu’il apparut dans la gloire à ses disciples sur la montagne, il n’était pas petit. Il devint grand, mais il rendit aussi les disciples grands, afin qu’ils soient capables de le voir comme grand.



    Ce jour-là, pendant l’eucharistie[a], il dit : « Toi qui as uni la lumière parfaite à l’Esprit saint, unis aussi les anges avec nous, avec les images[b] ! »



    Ne méprise pas l’agneau, car sans lui il est impossible de voir la porte. Personne ne pourra s’approcher du roi nu.'
  revised_footnotes:
  - marker: a
    text: « Pendant l’eucharistie » traduit le témoin anglais fourni, fondé sur le copte ; une révision directe du manuscrit reste à faire.
    reason: Signaler le caractère provisoire de cette formulation et ne pas surdéterminer son cadre liturgique.
  - marker: b
    text: 'La construction est obscure : les liens exacts entre les anges, « nous » et « les images » demeurent incertains.'
    reason: Préserver l’ambiguïté du témoin plutôt que d’harmoniser sa syntaxe selon une interprétation théologique.
  revision_rationale: La révision corrige trois écarts sûrs de sens ou d’usage sans résoudre les obscurités du passage. Elle conserve les répétitions, les crochets et parenthèses du témoin anglais, ainsi que les images théologiques non expliquées.
