review_pass:
  verdict: revise
  source_fidelity: 'La version suit globalement le témoin anglais et conserve adéquatement les lacunes, les restaurations entre crochets et les enchaînements obscurs. Quelques formulations demandaient toutefois correction : le passage sur la vision attribuait indûment la parole à un sujet indéfini, le balisage de « [outer] darkness » n’était pas conservé avec précision, et certains choix lexicalement ou syntaxiquement interprétatifs pouvaient être resserrés.'
  naturalness: Le français est généralement digne, clair et adapté à un usage international moderne. Les obscurités du texte sont volontairement maintenues, mais la révision améliore quelques tournures sans lisser les difficultés propres au témoin fragmentaire.
  terminology: « Chrême » rend plus précisément et de façon cohérente le terme rituel anglais « chrism ». « Chambre nuptiale », « plénitude », « figures et images », « résurrection », « repos » et « ténèbres extérieures » préservent le réseau terminologique sans imposer de lecture doctrinale.
  issues:
  - severity: medium
    issue: Attribution de la parole dans la vision fragmentaire
    rationale: Le témoin dit « and they said to them » ; « Et on leur disait » remplaçait le sujet pluriel attesté par un impersonnel et modifiait légèrement la relation syntaxique.
  - severity: medium
    issue: Balisage de la restauration « [outer] darkness »
    rationale: 'Le projet mettait l’ensemble de « ténèbres extérieures » entre crochets. Seul l’équivalent de « outer » doit être marqué comme restauration : « les ténèbres [extérieures] ».'
  - severity: low
    issue: Rendu de « chrism »
    rationale: « Onction » est possible dans certains contextes, mais « chrême » correspond plus directement au terme rituel et permet une cohérence avec l’énoncé « The fire is the chrism ».
  - severity: low
    issue: Relation spatiale dans le passage sur le caché et le supérieur
    rationale: '« ce qui lui est caché » risquait de rendre « hidden » comme un complément possessif. La formulation révisée conserve la relation opaque : « ce qui est caché est, pour lui, ce qui est au-dessus de lui ».'
  revised_text: "Celui qui sort du monde ne peut plus être lié, parce qu’il était dans le monde. Il se révèle au-dessus du désir de [… et] de la peur. Il domine […] ; il est supérieur à l’envie. Si […] viennent, les puissances les lient et les étouffent. Comment pourront-ils échapper aux [grandes puissances…] ? Comment pourront-ils […] ? Certains [disent] : « Nous sommes fidèles », afin que […] [esprit impur] et démon, car s’ils avaient l’Esprit saint, aucun esprit impur ne s’attacherait à eux. Ne crains pas la chair et ne l’aime pas. Si tu la crains, elle te dominera ; si tu l’aimes, elle t’avalera et t’étouffera.\n\n\n      Une personne se trouve soit dans ce monde, soit dans la résurrection, soit dans les lieux intermédiaires. Puissé-je ne jamais m’y trouver ! Il y a dans ce monde du bien et du mal. Ce qu’il a de bon n’est pas bon, et ce qu’il a de mauvais n’est pas mauvais. Mais après ce monde, il existe un mal qui est véritablement mauvais : ce qu’on appelle « l’intermédiaire ». C’est\
    \ la mort. Tant que nous sommes dans ce monde, il convient que nous acquérions pour nous-mêmes la résurrection, afin qu’une fois dépouillés de la chair, nous soyons trouvés dans le repos et que nous ne voyagions pas dans l’intermédiaire, car beaucoup s’égarent en chemin.\n\n\n      Il est bon de sortir du monde avant de pécher. Certains ne le veulent ni ne le peuvent ; mais d’autres, même s’ils le voulaient, n’en retireraient aucun profit, parce qu’ils n’ont pas agi. Leur vouloir fait d’eux des pécheurs. Mais même s’ils ne veulent pas, la justice leur restera cachée. Ce n’est pas la volonté, et ce n’est pas l’acte.[a]\n\n\n      Un apôtre vit [dans une] vision des gens enfermés dans une maison en feu et liés avec des […] brûlants, jetés […] du feu […] eux dans […]. Et ils leur dirent : « [… capables] d’être sauvés […] » Ils ne le voulurent pas et reçurent […] un châtiment appelé « les ténèbres [extérieures] », parce qu’il […].\n\n\n      L’âme et l’esprit sont venus à l’existence à partir\
    \ de l’eau et du feu. L’enfant de la chambre nuptiale est venu de l’eau, du feu et de la lumière. Le feu est le chrême ; la lumière est le feu. Je ne parle pas de ce feu sans forme, mais de l’autre, dont la forme est blanche, qui est éclatant et beau, et qui donne la beauté.\n\n\n      La vérité n’est pas venue nue dans le monde ; elle est venue sous forme de figures et d’images. Le monde ne la recevra d’aucune autre manière. Il y a une nouvelle naissance et une image de la nouvelle naissance. Il est véritablement nécessaire d’être engendré de nouveau par l’image. La résurrection et l’image ? C’est par l’image qu’il lui faut se relever. Et la chambre nuptiale et l’image ? C’est par l’image qu’il leur faut entrer dans la vérité, qui est la restauration. Ce n’est pas seulement nécessaire pour ceux qui acquièrent le nom du Père, du Fils et de l’Esprit saint : eux aussi ont été acquis pour vous.[b] Si quelqu’un ne les acquiert pas, le nom lui sera également retiré. Mais ils sont reçus dans\
    \ le chrême du […] de la puissance de la croix. Les apôtres ont appelé cela « [la] droite et la gauche », car cette personne n’est plus un [chrétien], mais un Christ.\n\n\n      Le Seigneur [a fait] toutes choses dans un mystère : un baptême, un chrême, une eucharistie, une rédemption, une chambre nuptiale […]. Il [a dit] : « Je suis venu rendre [ce qui est en bas] semblable à [ce qui est en haut, et ce qui est à l’extérieur] semblable à [ce qui est à l’intérieur, et les unir] dans le lieu. » […] ici au moyen de [figures…] Ceux qui disent : « […] il y en a un en haut [… » se trompent, car] ce qui est révélé est que […], ce [qui] est appelé « ce qui est en bas », et ce qui est caché est, pour lui, ce qui est au-dessus de lui, parce que c’est bon ; et ils disent : « l’intérieur, ce qui est à l’extérieur et ce qui est à l’extérieur de l’extérieur ». Ainsi, le Seigneur a appelé la destruction « les ténèbres extérieures ». Il n’y a rien en dehors d’elle.\n\n\n      Il a dit : « Mon Père qui\
    \ est caché. » Il a dit : « Entre dans ta chambre, ferme la porte derrière toi et prie ton Père qui est caché », c’est-à-dire celui qui est au-dedans de tous. Or celui qui est au-dedans de tous est la plénitude. Au-delà, il n’y a rien d’autre au-dedans. C’est ce qu’on appelle « ce qui est au-dessus d’eux ».\n\n\n      Avant le Christ, certains sont venus de l’endroit où ils ne pouvaient plus entrer, et ils sont allés à l’endroit d’où ils ne pouvaient plus sortir. Puis le Christ est venu. Il a fait sortir ceux qui étaient entrés et fait entrer ceux qui étaient sortis."
