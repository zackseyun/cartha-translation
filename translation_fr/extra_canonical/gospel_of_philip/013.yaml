  text: 'Whoever comes out of the world can no longer be bound, because they were in the world. They are revealed to be above the desire of the [… and] fear. They are master over […]; they are better than envy. If […] come, they—the powers—bind and choke [them]. How will [they] be able to escape the [great powers …]? How will they be able to […]? Some [say], “We are faithful,” so that […] [impure spirit] and demon, because if they had the Holy Spirit, no impure spirit would cling to them. Do not fear the flesh or love it. If you fear it, it will master you; if you love it, it will swallow and choke you.


    A person exists either in this world, in the resurrection, or in the middle places. May I never be found there! There is both good and evil in this world. Its good things are not good, and its evil things are not evil. But there is an evil after this world that is truly evil: what is called “the middle.” It is death. While we are in this world, it is right for us to acquire the resurrection for ourselves, so that when we are stripped of the flesh, we will be found in the rest and will not travel in the middle, because many stray along the way.


    It is good to come out of the world before one sins. Some neither want to nor can, but others, even if they wanted to, would not benefit, because they did not act. Their wanting makes them sinners. But even if they do not want, justice will still be hidden from them. It is not the will, and it is not the act.


    An apostle saw [in a] vision some people confined in a burning house and bound with burning […], thrown […] of the burning […] them in […], and they said to them [… able] to be saved […] they did not want to, and they received […] punishment, which is called “the [outer] darkness,” because it […].


    The soul and the spirit came into being from water and fire. The offspring of the bridal chamber came from water and fire and light. The fire is the chrism; the light is the fire. I am not talking about that formless fire, but about the other one, whose form is white, which is bright and beautiful and gives beauty.


    Truth did not come into the world naked, but came in types and images. It—the world—will not receive truth in any other way. There is a rebirth and an image of rebirth. It is truly necessary to be begotten again through the image. What’s the resurrection and the image? Through the image, it is necessary for it to arise. The bridal chamber and the image? Through the image, it is necessary for them to enter the truth, which is the restoration. It is not only necessary for those who acquire the name of the Father and the Son and the Holy Spirit, but they too have been acquired for you. If someone does not acquire them, the name will also be taken from them. But they are received in the chrism of the […] of the power of the cross. The apostles called this “[the] right and the left,” because this person is no longer a [Christian], but a Christ.


    The Lord [did] everything in a mystery: a baptism, a chrism, a Eucharist, a redemption, a bridal chamber […]. He [said], “I came to make [the below] like the [above and the outside] like the [inside, and to unite] them in the place.” […] here through [types …] Those who say, “[…] there is one above […,” are wrong, because] what is revealed is that […], that [which] is called “what is below,” and what is hidden is to it what is above it, because it is good, and they say “inside and what is outside and what is outside the outside.” So the Lord called destruction “the outer darkness.” There is nothing outside it.


    He said, “My Father who is hidden.” He said, “Enter your closet, shut the door behind you, and pray to your Father who is hidden,” that is, the one who is within all of them. But the one who is within all of them is the fullness. Beyond that, there is nothing else within. This is what is called “that which is above them.”


    Before Christ, some came from where they were no longer able to enter, and they went where they were no longer able to come out. Then Christ came. He brought out those who entered and brought in those who went out.'
translation:
  language: fr
  text: 'Celui qui sort du monde ne peut plus être lié, parce qu’il était dans le monde. Il se révèle au-dessus du désir de [… et] de la peur. Il domine […] ; il est supérieur à l’envie. Si […] viennent, les puissances les lient et les étouffent. Comment pourront-ils échapper aux [grandes puissances…] ? Comment pourront-ils […] ? Certains [disent] : « Nous sommes fidèles », afin que […] [esprit impur] et démon, car s’ils avaient l’Esprit saint, aucun esprit impur ne s’attacherait à eux. Ne crains pas la chair et ne l’aime pas. Si tu la crains, elle te dominera ; si tu l’aimes, elle t’avalera et t’étouffera.


    Une personne se trouve soit dans ce monde, soit dans la résurrection, soit dans les lieux intermédiaires. Puissé-je ne jamais m’y trouver ! Il y a dans ce monde du bien et du mal. Ce qu’il a de bon n’est pas bon, et ce qu’il a de mauvais n’est pas mauvais. Mais après ce monde, il existe un mal qui est véritablement mauvais : ce qu’on appelle « l’intermédiaire ». C’est la mort. Tant que nous sommes dans ce monde, il convient que nous acquérions pour nous-mêmes la résurrection, afin qu’une fois dépouillés de la chair, nous soyons trouvés dans le repos et que nous ne voyagions pas dans l’intermédiaire, car beaucoup s’égarent en chemin.


    Il est bon de sortir du monde avant de pécher. Certains ne le veulent ni ne le peuvent ; mais d’autres, même s’ils le voulaient, n’en retireraient aucun profit, parce qu’ils n’ont pas agi. Leur vouloir fait d’eux des pécheurs. Mais même s’ils ne veulent pas, la justice leur restera cachée. Ce n’est pas la volonté, et ce n’est pas l’acte.[a]


    Un apôtre vit [dans une] vision des gens enfermés dans une maison en feu et liés avec des […] brûlants, jetés […] du feu […] eux dans […]. Et on leur disait : « [… capables] d’être sauvés […] » Ils ne le voulurent pas et reçurent […] un châtiment appelé « les [ténèbres extérieures] », parce qu’il […].


    L’âme et l’esprit sont venus à l’existence à partir de l’eau et du feu. L’enfant de la chambre nuptiale est venu de l’eau, du feu et de la lumière. Le feu est l’onction ; la lumière est le feu. Je ne parle pas de ce feu sans forme, mais de l’autre, dont la forme est blanche, qui est éclatant et beau, et qui donne la beauté.


    La vérité n’est pas venue nue dans le monde ; elle est venue sous forme de figures et d’images. Le monde ne la recevra d’aucune autre manière. Il y a une nouvelle naissance et une image de la nouvelle naissance. Il est véritablement nécessaire d’être engendré de nouveau par l’image. Qu’en est-il de la résurrection et de l’image ? C’est par l’image qu’il lui faut se relever. Et la chambre nuptiale et l’image ? C’est par l’image qu’il leur faut entrer dans la vérité, qui est la restauration. Cela n’est pas seulement nécessaire à ceux qui acquièrent le nom du Père, du Fils et de l’Esprit saint : eux aussi ont été acquis pour vous.[b] Si quelqu’un ne les acquiert pas, le nom lui sera également retiré. Mais ils sont reçus dans l’onction du […] de la puissance de la croix. Les apôtres ont appelé cela « [la] droite et la gauche », car cette personne n’est plus un [chrétien], mais un Christ.


    Le Seigneur [a fait] toutes choses dans un mystère : un baptême, une onction, une eucharistie, une rédemption, une chambre nuptiale […]. Il [a dit] : « Je suis venu rendre [ce qui est en bas] semblable à [ce qui est en haut, et ce qui est à l’extérieur] semblable à [ce qui est à l’intérieur, et les unir] dans le lieu. » […] ici au moyen de [figures…] Ceux qui disent : « […] il y en a un en haut [… » se trompent, car] ce qui est révélé est que […], ce [qui] est appelé « ce qui est en bas », et ce qui lui est caché est ce qui est au-dessus de lui, parce que c’est bon ; et ils disent : « l’intérieur, ce qui est à l’extérieur et ce qui est à l’extérieur de l’extérieur ». Ainsi, le Seigneur a appelé la destruction « les ténèbres extérieures ». Il n’y a rien en dehors d’elle.


    Il a dit : « Mon Père qui est caché. » Il a dit : « Entre dans ta chambre, ferme la porte derrière toi et prie ton Père qui est caché », c’est-à-dire celui qui est au-dedans de tous. Or celui qui est au-dedans de tous est la plénitude. Au-delà, il n’y a rien d’autre au-dedans. C’est ce qu’on appelle « ce qui est au-dessus d’eux ».


    Avant le Christ, certains sont venus de l’endroit où ils ne pouvaient plus entrer, et ils sont allés à l’endroit d’où ils ne pouvaient plus sortir. Puis le Christ est venu. Il a fait sortir ceux qui étaient entrés et fait entrer ceux qui étaient sortis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation de ce paragraphe est difficile et paraît conserver une contradiction ou une lacune : elle ne permet pas de préciser avec certitude le rapport entre vouloir, agir, péché et justice.'
    reason: Signaler une obscurité substantielle sans la résoudre dans le corps du texte.
  - marker: b
    text: Le pronom « eux » peut renvoyer aux noms du Père, du Fils et de l’Esprit saint, mais la construction du passage demeure ambiguë.
    reason: Préserver l’ambiguïté du référent pronominal.
lexical_decisions:
- source_word: world
  choice: monde
  rationale: Conserve le terme cosmologique central et sa répétition, sans le réduire à la société humaine ni au monde matériel.
- source_word: middle / middle places
  choice: l’intermédiaire / les lieux intermédiaires
  rationale: Préserve la terminologie spatiale et eschatologique du témoin sans identifier ces lieux à une doctrine ultérieure.
- source_word: rest
  choice: repos
  rationale: Rend le contraste avec l’errance et la mort tout en conservant la portée spirituelle du terme.
- source_word: chrism
  choice: onction
  rationale: Terme français intelligible qui désigne à la fois l’acte rituel et sa réalité symbolique ; « chrême » aurait surtout désigné la substance consacrée.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Expression traditionnelle mais transparente, conservant le caractère rituel et symbolique sans l’expliciter.
- source_word: types
  choice: figures
  rationale: « Figures » exprime des formes représentatives ou préfiguratives et s’accorde naturellement avec « images ».
- source_word: fullness
  choice: plénitude
  rationale: Conserve la portée cosmologique du terme sans imposer une définition technique absente du passage.
theological_decisions:
- issue: Statut du vouloir et de l’acte dans le passage fragmentaire
  choice: 'Maintien littéral de la tension : « Ce n’est pas la volonté, et ce n’est pas l’acte. »'
  alternative: Expliciter lequel de la volonté ou de l’acte détermine la culpabilité.
  rationale: Le contexte paraît contradictoire ou lacunaire ; une clarification doctrinale dépasserait les données du témoin.
- issue: « Acquérir la résurrection » dans la vie présente
  choice: Conserver « acquérions pour nous-mêmes la résurrection »
  alternative: Paraphraser par « obtenir l’assurance de ressusciter » ou « vivre dès maintenant en ressuscités ».
  rationale: Le texte affirme une acquisition présente sans en préciser le mécanisme ; la traduction ne tranche pas entre sens rituel, mystique ou eschatologique.
- issue: « Plus un chrétien, mais un Christ »
  choice: Conserver la formulation forte avec la restauration signalée par crochets autour de « chrétien ».
  alternative: Atténuer en « semblable au Christ » ou « oint ».
  rationale: L’alternative atténuée résoudrait une affirmation théologiquement tendue que le témoin formule explicitement.
- issue: Le Père « au-dedans de tous » et la plénitude
  choice: Traduction directe sans harmonisation avec d’autres conceptions de la transcendance divine.
  alternative: Rendre « parmi tous » ou ajouter une explication doctrinale.
  rationale: Le passage développe lui-même son langage spatial ; il faut préserver cette cosmologie propre.
- issue: Genre grammatical du sujet générique initial
  choice: Employer « celui qui » puis le singulier masculin grammatical.
  alternative: Employer systématiquement des doublets ou le pluriel épicène.
  rationale: Le singulier maintient les changements de nombre et les ambiguïtés du passage, tout en restant naturel dans un registre français digne.
translation_notes:
  register: 'Français international moderne, digne et lisible. Les répétitions conceptuelles ont été conservées. Les crochets et points de suspension reproduisent les lacunes ou restitutions éditoriales du témoin fourni. Cette version demeure provisoire : elle repose sur le témoin anglais public fourni, la révision directe du copte étant encore en attente.'
