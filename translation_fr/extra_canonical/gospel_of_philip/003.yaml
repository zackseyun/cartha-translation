translation:
  language: fr
  text: 'Les noms que l’on donne à ceux qui appartiennent au monde sont très trompeurs, car ils détournent le cœur de ce qui est juste vers ce qui ne l’est pas. Celui qui entend « Dieu » ne pense pas à ce qui est juste, mais à ce qui ne l’est pas. Il en va de même pour « le Père », « le Fils », « l’Esprit saint », « la vie », « la lumière », « la résurrection », « l’Église » et tous les autres : ils ne pensent pas à [ce qui est juste], mais à ce qui [ne l’est] pas, [à moins] d’avoir appris ce qui est juste. Les [noms qui ont été entendus] existent dans le monde […] [trompent. S’ils existaient] dans l’Âge[a], ils n’auraient pas été employés comme noms dans le monde ni rangés parmi les réalités de ce monde. Ils ont leur fin dans l’Âge.


    Il est un nom qui n’est pas prononcé dans le monde : le nom que le Père a donné au Fils. Il est élevé au-dessus de tout ; c’est le nom du Père, car le Fils ne serait pas devenu père s’il n’avait pas pris le nom du Père. Ceux qui portent ce nom le connaissent, mais ne le disent pas ; ceux qui ne le portent pas ne le connaissent pas. Mais la Vérité a fait entrer des noms dans le monde pour nous, car il nous est impossible de la connaître sans ces noms. La Vérité est une, mais elle devient pour nous une multitude de choses, afin de nous enseigner dans l’amour cette unique réalité au moyen de réalités multiples.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Éon ». Le terme désigne ici l’âge ou le domaine éternel, par contraste avec le monde présent.
    reason: Le témoin signale « (eternal) age » ; la note conserve la portée technique possible sans surcharger le texte.
lexical_decisions:
- source_word: worldly / world
  choice: ceux qui appartiennent au monde / le monde / réalités de ce monde
  rationale: Rend le champ lexical cohérent tout en employant une formulation française naturelle pour les personnes et les choses.
- source_word: what's right / what's not right
  choice: ce qui est juste / ce qui ne l’est pas
  rationale: Conserve l’opposition répétée du témoin sans la préciser abusivement comme vrai/faux ou bien/mal.
- source_word: (eternal) age
  choice: l’Âge
  rationale: Préserve la notion technique d’un âge ou éon transcendant sans imposer la paraphrase « éternité ».
- source_word: have this name
  choice: portent ce nom
  rationale: Expression française naturelle qui garde l’idée de possession ou d’identification par le nom.
- source_word: learn it (Truth)
  choice: la connaître
  rationale: Le pronom féminin renvoie explicitement à la Vérité ; « connaître » convient mieux à une réalité personnifiée que « apprendre » en français.
- source_word: it's many things for us
  choice: elle devient pour nous une multitude de choses
  rationale: Restitue la tension entre l’unité de la Vérité et la multiplicité de ses formes pédagogiques, sans l’aplanir.
theological_decisions:
- issue: Le Fils « devenu père »
  choice: le Fils ne serait pas devenu père
  alternative: le Fils ne serait pas devenu le Père
  rationale: L’absence d’article dans le témoin crée une ambiguïté réelle. La minuscule évite d’identifier silencieusement le Fils avec « le Père » tout en conservant l’énoncé difficile.
- issue: Statut des noms religieux
  choice: Les noms sont présentés comme trompeurs dans l’usage mondain, puis comme apportés par la Vérité pour instruire.
  alternative: Harmoniser les deux affirmations en déclarant les noms intrinsèquement faux ou intrinsèquement sacrés.
  rationale: Le passage maintient volontairement une tension entre le danger des noms et leur nécessité pédagogique ; la traduction ne la résout pas.
- issue: Personnification de la Vérité
  choice: « la Vérité » avec majuscule et reprise pronominale
  alternative: « la vérité » comme abstraction ordinaire
  rationale: La formulation lui attribue une action propre — faire entrer les noms dans le monde — et justifie de préserver sa personnification probable.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes de « nom », « monde », « juste » et « Vérité » sont maintenues. Les crochets et l’ellipse reproduisent les indications de lacunes et de restitutions du témoin. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et la révision directe du copte reste à effectuer.
