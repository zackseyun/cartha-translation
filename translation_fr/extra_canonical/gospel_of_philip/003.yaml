review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni et préserve correctement les crochets, l’ellipse et l’ambiguïté de « devenu père ». Quelques formulations ajoutaient toutefois une interprétation non nécessaire : « réalités », « porte ce nom », « devient ... une multitude de choses » et « unique réalité » spécifiaient davantage que le témoin.'
  naturalness: Le français est globalement fluide, moderne et d’un registre approprié. Les ajustements proposés rendent la dernière phrase moins lourde et plus proche de la construction paradoxale du témoin, tout en remplaçant « rangés parmi les réalités » par une expression plus directe.
  terminology: « Père », « Fils », « Esprit saint », « Vérité » et « Éon » sont conservés avec une capitalisation cohérente. « Éon » explicite le terme technique derrière « (eternal) age » sans présenter cette option comme une certitude doctrinale; la note conserve « âge éternel » comme explication.
  issues:
  - severity: low
    issue: « réalités de ce monde » pour « worldly things »
    rationale: « Réalités » introduit une nuance métaphysique absente du témoin. « Choses du monde » est plus direct et conserve l’indétermination de l’original.
  - severity: low
    issue: « Ceux qui portent ce nom » pour « Those who have this name »
    rationale: « Porter » peut suggérer un titre ou une désignation publique. « Ont ce nom » restitue la possession exprimée sans préciser son mode.
  - severity: medium
    issue: La dernière phrase interprète et reformule fortement « it’s many things for us ... through many things »
    rationale: « Elle devient ... une multitude de choses » et « unique réalité ... réalités multiples » ajoutent les notions de devenir et de réalité. Une formulation plus sobre préserve mieux le parallélisme délibéré entre « une chose » et « beaucoup de choses ».
  revised_text: 'Les noms que l’on donne à ceux qui appartiennent au monde sont très trompeurs, car ils détournent le cœur de ce qui est juste vers ce qui ne l’est pas. Celui qui entend « Dieu » ne pense pas à ce qui est juste, mais à ce qui ne l’est pas. Il en va de même pour « le Père », « le Fils », « l’Esprit saint », « la vie », « la lumière », « la résurrection », « l’Église » et tous les autres : ils ne pensent pas à [ce qui est juste], mais à ce qui [ne l’est] pas, [à moins] d’avoir appris ce qui est juste. Les [noms qui ont été entendus] existent dans le monde […] [trompent. S’ils existaient] dans l’Éon[a], ils n’auraient pas été employés comme noms dans le monde ni placés parmi les choses du monde. Ils ont leur fin dans l’Éon.


    Il est un nom qui n’est pas prononcé dans le monde : le nom que le Père a donné au Fils. Il est élevé au-dessus de tout ; c’est le nom du Père, car le Fils ne serait pas devenu père s’il n’avait pas pris le nom du Père. Ceux qui ont ce nom le connaissent, mais ne le disent pas ; ceux qui ne l’ont pas ne le connaissent pas. Mais la Vérité a fait entrer des noms dans le monde pour nous, car il nous est impossible de la connaître sans ces noms. La Vérité est une, mais elle est pour nous beaucoup de choses, afin d’enseigner cette seule chose dans l’amour par beaucoup de choses.'
  revised_footnotes:
  - marker: a
    text: Ou « l’âge éternel ». « Éon » rend ici le terme technique désignant l’âge ou le domaine éternel, par contraste avec le monde présent.
    reason: Le témoin porte « (eternal) age ». La note explicite la valeur possible du terme sans imposer une interprétation doctrinale.
  revision_rationale: Révision limitée à des corrections sûres de fidélité et de style. Elle élimine des précisions interprétatives non requises, maintient les lacunes et restaurations signalées, et conserve la tension du passage quant aux noms ainsi que l’ambiguïté de « devenu père ».
