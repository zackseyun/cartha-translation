review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour aligner plus étroitement le français sur le témoin anglais fourni : « récoltes » ajoutait un élément absent; plusieurs pronoms singuliers réduisaient des référents pluriels ou incertains; « obscénité » atténuait « pornography »; et « ami du marié » ne rendait pas précisément « best man ». Les crochets, lacunes et formulations paradoxales sont conservés sans restitution doctrinale.'
  naturalness: Le texte révisé reste en français international moderne. Quelques formulations volontairement abruptes, notamment autour des lacunes et de l’opposition créer/engendrer, reflètent l’état fragmentaire et la syntaxe difficile du témoin plutôt qu’une maladresse à lisser.
  terminology: « Foi, espérance, amour et connaissance », « Fils de l’être humain », « engendrer », « esclave » et « chambre nuptiale » sont maintenus. « Pornographie » reproduit le terme explicite du témoin anglais; « garçon d’honneur » rend « best man » dans le contexte nuptial.
  issues:
  - severity: medium
    issue: Ajout de « récoltes » dans l’image initiale
    rationale: Le témoin dit que « they gather into barns » par les quatre éléments, sans nommer les récoltes. L’ajout précisait indûment l’objet de l’action.
  - severity: medium
    issue: Référents pronominaux pluriels réduits au singulier
    rationale: Dans le passage sur le repos et le mal, « lui » et « Ce n’est pas lui » modifiaient les relations pronominales instables du témoin. Le pluriel est rétabli là où le témoin l’emploie.
  - severity: medium
    issue: « Obscénité » pour « pornography »
    rationale: Le choix atténuait et généralisait un terme explicite du témoin. « Pornographie » conserve la force et l’anachronisme apparent de la formulation transmise.
  - severity: low
    issue: « Ami du marié » pour « best man »
    rationale: Un best man n’est pas simplement un ami; « garçon d’honneur » est l’équivalent fonctionnel français le plus direct.
  - severity: low
    issue: Conclusion rendue « comme eux »
    rationale: Le témoin dit « unless [they become] such »; « à moins de devenir tels eux-mêmes » conserve mieux l’idée de devenir de cette condition, sans imposer un simple rapport de ressemblance.
  revised_text: 'Le monde est cultivé par quatre choses. C’est par l’eau, la terre, le vent et la lumière qu’on l’engrange. De même, Dieu cultive lui aussi par quatre choses : par la foi, l’espérance, l’amour et la connaissance. Notre terre, c’est la foi dans laquelle nous sommes enracinés. [Et] l’[eau], c’est l’espérance par laquelle [nous sommes] nourris. Le vent, c’est l’amour par lequel nous grandissons. Et la lumière, [c’est] la connaissance par laquelle nous [mûrissons]. La grâce existe sous [quatre formes. Elle est] terrestre, elle est [céleste, …] le ciel du ciel […] par […].



    Heureux celui qui n’a pas […] d’âme. Celui-ci est Jésus Christ. Il est allé partout sans être un fardeau pour personne. Heureux donc celui qui est ainsi : c’est une personne parfaite. En effet, la Parole nous dit combien il est difficile de persévérer. Comment pourrons-nous accomplir une chose si grande ? Comment donnera-t-il du repos à tous ? Avant toute chose, il n’est pas juste de faire de la peine à qui que ce soit — grand ou petit, sans foi ou croyant —, puis de donner du repos à ceux qui sont déjà en repos parmi les gens à l’aise. Certains tirent profit du fait de donner du repos à celui qui est à l’aise. Celui qui fait le bien ne peut pas leur donner du repos, car il ne peut pas simplement faire tout ce qu’il veut. Il ne peut pas faire de peine, puisqu’il ne peut pas causer de détresse. Pourtant, il arrive que celui qui est à l’aise leur fasse de la peine. Ils ne sont pas ainsi, mais c’est leur propre mal qui leur cause de la peine. Celui qui possède la nature de la personne parfaite
    donne de la joie à celui qui est bon, mais certains en éprouvent une peine terrible.



    Un maître de maison avait acquis toutes choses : enfant, esclave, bétail, chien, porc, blé [ou] orge, paille, foin, […] viande et glands. [Mais il est] sage et comprend de quoi nourrir [chacun]. Aux enfants, il servait du pain […] ; mais […] aux esclaves, il servait […]. Au bétail, [il jetait de l’orge], de la paille et du foin. Aux chiens, il jetait des os, [et] aux [porcs], des glands et de la pâtée.



    Il en va de même pour le disciple de Dieu. S’il est sage, il comprend ce que signifie être disciple. Les formes corporelles ne le tromperont pas : il considérera l’état de l’âme de chacun et lui parlera. Il y a dans le monde beaucoup d’animaux façonnés sous une forme humaine. Le disciple les reconnaît. Aux porcs, il jettera des glands ; au bétail, de l’orge avec de la paille et du foin ; aux chiens, des os ; aux esclaves, il donnera le hors-d’œuvre ; et aux enfants, la nourriture parfaite.



