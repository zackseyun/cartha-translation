lexical_decisions:
- source_word: farmed / farms
  choice: cultivé / cultive
  rationale: Conserve la métaphore agricole structurante tout en restant naturel en français ; « exploiter » aurait introduit une nuance économique étrangère au passage.
- source_word: faith, hope, love, and knowledge
  choice: la foi, l’espérance, l’amour et la connaissance
  rationale: Termes français courants et théologiquement non marqués ; « connaissance » préserve la portée cognitive et spirituelle sans imposer « gnose ».
- source_word: Son of Humanity
  choice: Fils de l’être humain
  rationale: Rend la formulation inclusive et générique du témoin anglais sans la normaliser silencieusement en titre biblique traditionnel « Fils de l’homme ».
- source_word: beget / begotten
  choice: engendrer / engendré
  rationale: Maintient l’opposition conceptuelle répétée entre créer et engendrer.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Expression traditionnelle mais immédiatement compréhensible, nécessaire à l’imagerie symbolique du passage.
- source_word: pornography
  choice: obscénité
  rationale: Évite l’anachronisme moderne très précis de « pornographie » tout en conservant l’idée d’une exposition sexuelle indécente.
- source_word: slave
  choice: esclave
  rationale: Conserve le statut social explicite du témoin source ; « serviteur » l’atténuerait.
theological_decisions:
- issue: Sens spirituel de « connaissance »
  choice: Conserver « connaissance » sans l’expliquer comme une doctrine technique
  alternative: Employer « gnose »
  rationale: Le passage associe la connaissance à la lumière et à la maturation, mais le témoin fourni ne justifie pas à lui seul l’importation d’un système doctrinal nommé.
- issue: Rapport entre création et engendrement
  choice: Maintenir les affirmations paradoxales et les répétitions
  alternative: Les harmoniser en une explication métaphysique cohérente
  rationale: Le texte endommagé entretient une tension réelle ; la traduction ne doit pas la résoudre au profit d’une christologie ou d’une cosmologie particulière.
- issue: Mariage sans souillure et chambre nuptiale
  choice: Préserver le langage à la fois matrimonial et mystérieux
  alternative: L’interpréter explicitement comme sacrement, rite initiatique ou union purement spirituelle
  rationale: Le passage invite une lecture symbolique, mais ne permet pas de trancher entre ces interprétations dans la traduction même.
- issue: « Celui qui n’a pas […] une âme »
  choice: Conserver la lacune et la syntaxe difficile
  alternative: Restituer un qualificatif supposé devant « âme »
  rationale: Toute restitution préciserait indûment une phrase matériellement incomplète et théologiquement sensible.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve les crochets et les points de suspension du témoin afin de signaler les restaurations et lacunes manuscrites. Les changements de nombre et de référent parfois incertains ont été rendus aussi lisiblement que possible sans reconstruire le copte absent. Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe du copte du Codex de Nag Hammadi II,3 reste nécessaire.
