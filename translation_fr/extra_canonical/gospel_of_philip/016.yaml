translation:
  language: fr
  text: 'Le monde est cultivé grâce à quatre éléments. C’est par l’eau, la terre, le vent et la lumière que l’on rassemble les récoltes dans les greniers. De même, Dieu cultive grâce à quatre réalités : la foi, l’espérance, l’amour et la connaissance. Notre terre, c’est la foi dans laquelle nous sommes enracinés. [Et] l’[eau], c’est l’espérance par laquelle [nous sommes] nourris. Le vent, c’est l’amour par lequel nous grandissons. Et la lumière, [c’est] la connaissance par laquelle nous [mûrissons]. La grâce existe sous [quatre formes. Elle est] terrestre, elle est [céleste, …] le ciel du ciel […] par […].


    Heureux celui qui n’a pas […] une âme. Celui-ci est Jésus Christ. Il est allé partout sans être un fardeau pour personne. Heureux donc celui qui est ainsi : c’est une personne parfaite. En effet, la Parole nous dit combien il est difficile de persévérer. Comment pourrons-nous accomplir une chose si grande ? Comment donnera-t-il du repos à tous ? Avant toute chose, il n’est pas juste de faire de la peine à qui que ce soit — grand ou petit, sans foi ou croyant —, puis de donner du repos à ceux qui sont déjà en repos parmi les gens à l’aise. Certains tirent profit du fait de donner du repos à celui qui est à l’aise. Celui qui fait le bien ne peut pas leur donner du repos, car il ne peut pas simplement faire tout ce qu’il veut. Il ne peut pas faire de peine, puisqu’il ne peut pas causer de détresse. Pourtant, il arrive que celui qui est à l’aise lui fasse de la peine. Ce n’est pas lui qui est ainsi ; c’est leur propre mal qui leur cause de la peine. Celui qui possède la nature de la personne
    parfaite donne de la joie à celui qui est bon, mais certains en éprouvent une peine terrible.


    Un maître de maison avait acquis toutes sortes de biens : enfant, esclave, bétail, chien, porc, blé [ou] orge, paille, foin, […] viande et glands. [Mais il était] sage et savait quelle nourriture donner à [chacun]. Aux enfants, il servait du pain […] ; mais […] aux esclaves, il servait […]. Au bétail, [il jetait de l’orge], de la paille et du foin. Aux chiens, il jetait des os, [et] aux [porcs], des glands et de la pâtée.


    Il en va de même pour le disciple de Dieu. S’il est sage, il comprend ce que signifie être disciple. Les apparences corporelles ne le tromperont pas : il considérera l’état de l’âme de chacun et lui parlera en conséquence. Il y a dans le monde beaucoup d’animaux façonnés sous une forme humaine. Le disciple les reconnaît. Aux porcs, il jettera des glands ; au bétail, de l’orge avec de la paille et du foin ; aux chiens, des os ; aux esclaves, il donnera l’entrée ; et aux enfants, la nourriture parfaite.


    Il y a le Fils de l’être humain, et il y a le fils du Fils de l’être humain. Le Seigneur est le Fils de l’être humain, et le fils du Fils de l’être humain est celui qui crée par le Fils de l’être humain. Le Fils de l’être humain a reçu de Dieu le pouvoir de créer. Il a aussi le pouvoir d’engendrer. Celui qui a reçu le pouvoir de créer est une créature ; celui qui a reçu le pouvoir d’engendrer est engendré. Celui qui crée ne peut pas engendrer ; celui qui engendre peut créer. On dit : « Celui qui crée engendre. » Mais ce qu’il engendre est une créature. [Ainsi], ceux qu’il engendre ne sont pas ses enfants, mais ils sont […]. Celui qui crée agit [au grand jour] et est lui-même [révélé]. Celui qui engendre, engendre [en secret], et ceux qu’il engendre sont cachés […] l’image. [De nouveau], celui qui [crée, crée] au grand jour, mais celui qui engendre [engendre] des enfants en secret.


    [Personne ne pourra] savoir [quand le mari] et la femme s’unissent intimement, excepté eux-mêmes, car le mariage de ce monde est un mystère pour ceux qui sont mariés. Si le mariage souillé reste caché, combien plus le mariage sans souillure est-il un véritable mystère ! Il n’est pas charnel, mais pur. Il ne relève pas du désir, mais de la volonté. Il ne relève ni des ténèbres ni de la nuit, mais du jour et de la lumière.


    Si un mariage est mis à nu, il devient obscénité. Ce n’est pas seulement lorsque la mariée reçoit la semence d’un autre homme qu’elle commet l’adultère : même si elle quitte la chambre nuptiale et se laisse voir, elle commet l’adultère. Qu’elle se montre à son père, à sa mère, à l’ami du marié et aux enfants du marié. Il leur est permis d’entrer chaque jour dans la chambre nuptiale. Mais que les autres désirent seulement entendre sa voix et jouir de son parfum ; et, comme des chiens, qu’ils mangent les miettes qui tombent de la table. Les mariés et les mariées appartiennent à la chambre nuptiale. Personne ne pourra voir le marié et la mariée sans [devenir] comme eux.'
