translation:
  language: fr
  text: 'Dieu est un teinturier. Comme les bonnes teintures — qu’on appelle « véritables » — meurent avec ce qui a été teint en elles, ainsi en va-t-il de ceux que Dieu a teints. Puisque ses teintures sont immortelles, ils deviennent immortels grâce à ses couleurs. Mais Dieu baptise dans l’eau.


    Il est impossible de voir quoi que ce soit qui existe réellement sans devenir semblable à ce que l’on voit. Il n’en va pas comme de la personne qui, dans le monde, voit le soleil sans devenir soleil, et qui voit le ciel, la terre et tout le reste sans devenir ces réalités. Là-bas, il en va autrement. Mais tu as vu quelque chose de ce lieu et tu es devenu ces réalités. Tu as vu l’Esprit, tu es devenu esprit ; tu as vu le Christ, tu es devenu Christ ; tu as vu [le Père, tu] deviendras père. C’est pourquoi [ici], tu vois tout sans [te voir toi-même] ; mais tu te vois [là-bas], car tu [deviendras] ce que tu vois.


    La foi reçoit ; l’amour donne. [Personne ne pourra] [recevoir] sans la foi, et personne ne pourra donner sans l’amour. Ainsi, nous croyons afin de recevoir, mais nous donnons afin d’aimer, puisque celui qui ne donne pas avec amour n’en retire rien. Celui qui n’a pas reçu le Seigneur est encore un Hébreu.


    Les apôtres qui nous ont précédés l’appelaient « Jésus le Nazaréen Messie », c’est-à-dire « Jésus le Nazaréen Christ ». Le dernier nom est « Christ », le premier est « Jésus », celui du milieu est « le Nazaréen ». « Messie » a deux sens : « Christ » et « le mesuré ». En hébreu, « Jésus » signifie « la rédemption ». « Nazara » signifie « la vérité ». Ainsi, « le Nazaréen » est « la vérité ». « Christ » est celui qui a été mesuré. « Le Nazaréen » et « Jésus » sont ceux qui ont été mesurés.[a]


    Une perle ne perd pas de sa valeur si on la jette dans la boue, et elle n’en gagne pas si on l’enduit de baume : elle garde toujours sa valeur pour son propriétaire. Il en va de même des enfants de Dieu : où qu’ils soient, ils gardent leur valeur pour leur Père.


    Si tu dis : « Je suis juif », personne ne s’émouvra. Si tu dis : « Je suis romain », personne ne sera troublé. Si tu dis : « Je suis grec », « barbare », « esclave », [« une personne libre »], personne ne sera bouleversé. [Si] tu [dis] : « Je suis chrétien », le […] tremblera. Si seulement [… de] cette sorte, celui-ci [qui…] ne pourra supporter [d’entendre] son nom.[b]


    Dieu mange les êtres humains. C’est pourquoi l’être humain lui est [sacrifié]. Avant que l’être humain ne soit sacrifié, on sacrifiait des animaux, car ceux à qui on les sacrifiait n’étaient pas des dieux.


    Les récipients de verre et de terre cuite viennent à l’existence par le feu. Mais si les récipients de verre se brisent, on les refait, car ils sont venus à l’existence par un souffle ; tandis que si les récipients de terre cuite se brisent, ils sont détruits, car ils sont venus à l’existence sans souffle.


    Un âne qui faisait tourner une meule parcourut cent milles. Lorsqu’on le détacha, il se retrouva pourtant au même endroit. Beaucoup de gens voyagent sans arriver nulle part. Quand le soir vint, ils ne virent ni ville ni village, ni rien de créé ou de naturel, ni puissance ni ange. Les malheureux avaient travaillé en vain.


    L’eucharistie est Jésus, car en syriaque il est appelé « Pharisatha », c’est-à-dire « celui qui est étendu », parce que Jésus est venu crucifier le monde.[c]


    Le Seigneur entra dans la teinturerie de Lévi. Il prit soixante-douze couleurs et les jeta dans la cuve. Il les en retira toutes blanches et dit : « C’est ainsi que le Fils de l’humanité est venu [comme] teinturier. »


    La Sagesse appelée « la stérile » est la Mère [des anges] et [la] compagne de [… Marie] Madeleine [… l’aimait] plus que les disciples [… il] l’embrassait sur la [… de nombreuses] fois. Les autres […] […] lui dirent : « Pourquoi l’aimes-tu plus que nous tous ? » Le Sauveur leur répondit : « Pourquoi est-ce que je ne vous aime pas comme elle ? Quand une personne aveugle et une personne qui voit sont toutes deux dans l’obscurité, elles ne diffèrent pas l’une de l’autre. Lorsque vient la lumière, celle qui voit verra la lumière, tandis que celle qui est aveugle restera dans l’obscurité. »[d]


    Le Seigneur dit : « Heureux celui qui existe avant d’exister, car ceux qui existent ont existé et existeront. »


    La supériorité de l’humanité ne se manifeste pas au-dehors, mais réside dans ce qui est caché. C’est ainsi que l’humanité domine des animaux plus forts qu’elle, plus grands quant à ce qui est visible comme à ce qui est caché. Cela leur permet de survivre. Mais si l’humanité se sépare d’eux, ils se tuent, se mordent et se dévorent entre eux, faute de trouver de la nourriture. Maintenant, cependant, ils en ont trouvé, parce que l’humanité a travaillé la terre.


    Si quelqu’un descend dans l’eau puis en remonte sans avoir rien reçu et dit : « Je suis chrétien », il a emprunté ce nom à intérêt. Mais s’il reçoit l’Esprit saint, il possède le nom comme un don. À celui qui a reçu un don, on ne le reprend pas ; mais celui qui l’a emprunté à intérêt doit le rendre. Il en va ainsi lorsqu’une personne vient à l’existence dans un mystère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les explications étymologiques données ici reflètent les jeux de mots de l’auteur ancien ; elles ne correspondent pas nécessairement aux étymologies reconnues aujourd’hui.
    reason: Avertit le lecteur que les équivalences « Messie/mesuré », « Jésus/rédemption » et « Nazara/vérité » sont propres au passage et linguistiquement discutables.
  - marker: b
    text: Le manuscrit est très endommagé dans la fin de ce paragraphe ; le sujet de « tremblera » et plusieurs éléments de la phrase suivante sont perdus.
    reason: Évite de donner une fausse impression de continuité ou de certitude dans un passage lacunaire.
  - marker: c
    text: « Pharisatha » est présenté dans le texte comme un mot syriaque signifiant « celui qui est étendu » ; le jeu de mots et son rapport précis avec l’eucharistie restent incertains.
    reason: Signale une explication linguistique ancienne obscure sans la corriger dans le texte.
  - marker: d
    text: Le manuscrit comporte ici plusieurs lacunes. Il ne permet pas de déterminer avec certitude où Jésus embrassait Marie Madeleine.
    reason: Empêche la restauration traditionnelle « sur la bouche » d’être prise pour un texte assuré.
lexical_decisions:
- source_word: dyer / dyes / dyed
  choice: teinturier / teintures / teints
  rationale: Conserve le réseau métaphorique insistant de la teinture, des couleurs et du baptême sans le spiritualiser.
- source_word: 'true'
  choice: véritables
  rationale: « Véritables » garde la portée ontologique possible tout en restant naturel pour qualifier les teintures.
- source_word: Son of Humanity
  choice: Fils de l’humanité
  rationale: Rend la formulation distinctive du témoin sans la normaliser automatiquement en « Fils de l’homme ».
- source_word: human-eater
  choice: mange les êtres humains
  rationale: Préserve l’expression choquante et énigmatique, tout en évitant le néologisme français peu naturel « mangeur d’humains ».
- source_word: breath
  choice: souffle
  rationale: Maintient l’ambivalence entre souffle matériel et principe vital ou spirituel.
- source_word: power
  choice: puissance
  rationale: Conserve la possibilité qu’il s’agisse d’une puissance angélique plutôt que d’une simple capacité.
- source_word: mystery
  choice: mystère
  rationale: Garde le terme rituel et théologique sans le réduire à « rite » ou « sacrement ».
- source_word: borrowed the name at interest
  choice: emprunté ce nom à intérêt
  rationale: Conserve la métaphore financière développée dans les phrases suivantes.
theological_decisions:
- issue: Transformation du voyant en ce qu’il contemple
  choice: Conserver littéralement « tu es devenu esprit/Christ » et « tu deviendras père »
  alternative: Atténuer en « semblable à l’Esprit/au Christ/au Père »
  rationale: Le passage énonce délibérément une transformation forte ; l’atténuer résoudrait une tension théologique présente dans le témoin.
- issue: « L’eucharistie est Jésus »
  choice: Maintenir l’identification directe
  alternative: Paraphraser « représente Jésus »
  rationale: Le texte formule une identité, non une simple représentation ; aucune harmonisation doctrinale n’est ajoutée.
- issue: Dieu qui mange les humains et sacrifice humain
  choice: Traduire sans atténuation ni explication dans le corps du texte
  alternative: Interpréter comme langage eucharistique ou sacrificiel figuré
  rationale: Le sens exact demeure énigmatique et ne doit pas être fixé par une tradition interprétative.
- issue: Marie Madeleine comme « compagne » et geste du baiser
  choice: Préserver « compagne » et la lacune après « sur la »
  alternative: Choisir « associée » ou compléter par « bouche »
  rationale: La relation et l’emplacement du baiser sont disputés ; la lacune interdit une précision certaine.
- issue: Réception de l’Esprit saint au baptême
  choice: Maintenir la distinction entre descendre dans l’eau et recevoir l’Esprit
  alternative: Les identifier automatiquement
  rationale: Le texte lui-même pose une distinction et sa tension sacramentelle doit rester visible.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions, paradoxes et images abruptes sont conservés. Les crochets signalent les restaurations proposées et les points de suspension entre crochets les pertes du manuscrit. Cette version demeure provisoire, car le dossier fourni indique qu’une révision directe du copte est encore attendue.
