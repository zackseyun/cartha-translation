translation:
  language: fr
  text: 'Les dirigeants voulaient tromper l’humanité, car ils voyaient qu’elle avait une parenté avec ceux qui sont véritablement bons. Ils prirent le nom de ceux qui sont bons et le donnèrent à ceux qui ne le sont pas, afin de tromper l’humanité par ces noms et de la lier à ceux qui ne sont pas bons. Et ensuite, quelle faveur lui font-ils ! Ils la retirent de chez ceux qui ne sont pas bons et la placent parmi ceux qui sont bons. Les dirigeants savaient ce qu’ils faisaient, car ils voulaient prendre ceux qui étaient libres et les réduire en esclavage pour toujours.


    Il existe des puissances qui […] l’humanité, ne voulant pas qu’elle soit [sauvée], afin qu’elle puisse être […] ; car si l’humanité [était sauvée], les sacrifices [n’auraient pas] lieu […] et des animaux ne seraient pas offerts aux puissances, puisque ceux à qui l’on faisait des offrandes étaient des animaux. On les offrait vivants, mais, une fois offerts, ils mouraient. Un être humain fut offert à Dieu alors qu’il était mort, et il vécut.[a]


    Avant la venue du Christ, il n’y avait aucun pain dans le monde. De même, le Paradis, où se trouvait Adam, avait beaucoup d’arbres pour nourrir les animaux, mais pas de blé pour nourrir l’humanité. L’humanité se nourrissait comme les animaux. Mais lorsque le Christ, l’être humain parfait, vint, il apporta le pain du ciel, afin que l’humanité soit nourrie de la nourriture propre à l’être humain.[b]


    Les dirigeants pensaient agir par leur propre pouvoir et leur propre volonté, mais, à travers eux, l’Esprit saint accomplissait secrètement tout ce qu’il voulait. La vérité, qui existe depuis le commencement, est semée partout : beaucoup la voient semée, mais peu la voient récoltée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contraste entre les animaux offerts vivants puis morts et l’être humain offert mort puis vivant est conservé tel quel ; il peut évoquer le Christ sans le nommer explicitement.
    reason: Signaler une allusion théologique probable sans résoudre l’implicite du texte.
  - marker: b
    text: « La nourriture propre à l’être humain » traduit littéralement l’opposition du passage entre l’alimentation des animaux et celle de l’humanité ; le symbole du pain n’est pas davantage explicité.
    reason: Préserver l’image et ses interprétations possibles.
lexical_decisions:
- source_word: rulers
  choice: dirigeants
  rationale: Rend le sens général de puissances dominantes sans imposer le terme technique « archontes », que le témoin anglais ne fournit pas explicitement.
- source_word: humanity
  choice: l’humanité
  rationale: Préserve le sens collectif et évite de limiter le propos aux hommes de sexe masculin.
- source_word: kinship
  choice: parenté
  rationale: Conserve l’idée forte d’un lien d’origine ou de nature, sans la réduire à une simple ressemblance.
- source_word: powers
  choice: puissances
  rationale: Terme religieux suffisamment large pour préserver l’ambiguïté sur la nature de ces êtres.
- source_word: perfect human
  choice: l’être humain parfait
  rationale: Reproduit la caractérisation anthropologique du Christ sans la transformer en titre doctrinal.
- source_word: food of humanity
  choice: nourriture propre à l’être humain
  rationale: Expression française naturelle qui maintient le contraste entre nourriture humaine et nourriture animale.
- source_word: Holy Spirit
  choice: l’Esprit saint
  rationale: Équivalent français courant et digne, avec la capitalisation usuelle.
theological_decisions:
- issue: Identité de ceux qui sont « véritablement bons »
  choice: Maintenir la formulation indéfinie « ceux qui sont véritablement bons »
  alternative: Identifier ces êtres à Dieu, aux anges ou à une catégorie gnostique précise
  rationale: Le témoin demeure indéterminé ; préciser leur identité résoudrait indûment une ambiguïté théologique.
- issue: 'Renversement du sacrifice : animal vivant qui meurt, humain mort qui vit'
  choice: Préserver le parallélisme abrupt
  alternative: Expliquer explicitement qu’il s’agit du Christ et de sa résurrection
  rationale: L’allusion est forte, mais le passage ne nomme pas ici l’être humain offert ; la traduction ne doit pas ajouter cette identification.
- issue: Action de l’Esprit saint à travers les dirigeants
  choice: Conserver l’affirmation selon laquelle l’Esprit accomplit sa volonté à travers eux
  alternative: Atténuer en parlant seulement d’une permission divine
  rationale: Le texte exprime une causalité paradoxale et une tension théologique qu’il faut préserver.
- issue: Pain céleste apporté par le Christ
  choice: Garder le langage concret du pain et de la nourriture humaine
  alternative: Interpréter directement le pain comme enseignement, eucharistie ou salut
  rationale: Le symbole peut recevoir plusieurs lectures ; aucune ne doit être imposée dans le corps du texte.
