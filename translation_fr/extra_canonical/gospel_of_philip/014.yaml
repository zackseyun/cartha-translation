lexical_decisions:
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Expression française naturelle et digne, assez technique pour conserver la portée rituelle et symbolique récurrente du passage.
- source_word: chrism
  choice: chrême
  rationale: Terme français précis pour l’huile ou l’onction sacrée, distinct du simple acte d’oindre.
- source_word: powers
  choice: puissances
  rationale: Conserve l’ambivalence entre capacité ou force et entités personnifiées, sans imposer une interprétation cosmologique.
- source_word: redemption
  choice: rédemption / racheter
  rationale: Maintient le vocabulaire sotériologique du témoin tout en employant une forme verbale naturelle dans le dernier paragraphe.
- source_word: rest
  choice: repos
  rationale: Préserve le terme conceptuel récurrent et son emploi comme nom propre dans « Repos ».
- source_word: begotten
  choice: engendré
  rationale: Rend le langage de génération de façon cohérente, même lorsque celui-ci paraît énigmatique, sans le réduire à « né ».
- source_word: slaves
  choice: esclaves
  rationale: Conserve le contraste social explicite entre esclaves et personnes libres, plutôt que de l’atténuer par « serviteurs ».
theological_decisions:
- issue: Réunion de l’homme et de la femme et disparition de la mort
  choice: Conserver littéralement le lien établi par le texte entre séparation, mort et union dans la chambre nuptiale.
  alternative: Interpréter explicitement l’union comme mariage, salut, réintégration spirituelle ou rite sacramentel.
  rationale: Le passage superpose plusieurs niveaux symboliques sans les distinguer clairement ; la traduction ne tranche donc pas entre eux.
- issue: Baptême, lumière, chrême, rédemption et chambre nuptiale
  choice: Maintenir les identifications et la hiérarchie formulées par le texte sans les harmoniser avec une théologie sacramentelle ultérieure.
  alternative: Employer un vocabulaire confessionnel déterminé ou expliquer les rites dans le corps du texte.
  rationale: Le témoin présente ses propres catégories rituelles, dont les rapports demeurent partiellement obscurs à cause des lacunes.
- issue: « Puissances »
  choice: Garder le même mot lorsqu’il peut désigner une force ou des êtres hostiles.
  alternative: Traduire selon les endroits par « autorités », « archontes », « facultés » ou « pouvoirs spirituels ».
  rationale: Cette uniformité préserve le jeu lexical et l’ambiguïté théologique du passage.
- issue: Parole de la croix
  choice: Conserver la formulation composite « Mon Dieu… pourquoi, Seigneur… » telle qu’elle apparaît dans le témoin fourni.
  alternative: Normaliser la citation selon Matthieu 27.46 ou Marc 15.34.
  rationale: Une harmonisation évangélique effacerait une particularité textuelle potentiellement significative.
- issue: Pronoms et référents obscurs
  choice: Préserver autant que possible les pronoms du témoin, même lorsque leur antécédent est incertain.
  alternative: Nommer Adam, Ève, le Christ ou le Père selon une reconstruction interprétative.
  rationale: Les lacunes et la syntaxe du témoin ne permettent pas toujours une identification sûre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition technique de « chambre nuptiale », « engendrer », « rédemption », « puissances » et « repos » est volontaire. Les ruptures syntaxiques, crochets et lacunes ont été maintenus lorsque le témoin ne permet pas une reconstruction assurée.
