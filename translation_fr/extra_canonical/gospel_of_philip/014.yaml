translation:
  language: fr
  text: 'Quand Ève était [en] Adam[a], la mort n’existait pas. Lorsqu’elle se sépara de lui, la mort vint à l’existence. S’il [entre] de nouveau et la reçoit pour lui-même, il n’y aura plus de mort.


    « [Mon] Dieu, mon Dieu, pourquoi, Seigneur, [m’as]-tu abandonné ? » Il dit cela sur la croix, parce qu’en ce lieu il fut divisé. […] qu’il fut engendré par ce qui […] de Dieu. Le […] d’entre les morts […] existe, mais […] il est parfait […] de chair, mais ceci […] est chair véritable […] n’est pas véritable, [mais …] image du véritable.


    Une chambre nuptiale n’est destinée ni aux animaux, ni aux esclaves, ni aux êtres impurs, mais aux personnes libres et aux vierges.


    Nous sommes engendrés de nouveau par l’Esprit saint, mais nous sommes engendrés par le Christ au moyen de deux choses. Nous recevons l’onction par l’Esprit. Lorsque nous avons été engendrés, nous avons été unis.


    Sans lumière, personne ne peut se voir dans l’eau ou dans un miroir ; et l’on ne peut pas non plus voir dans la lumière sans eau ni miroir. C’est pourquoi il est nécessaire d’être baptisé dans les deux : dans la lumière et dans l’eau. Or, la lumière est le chrême.


    Il y avait à Jérusalem trois maisons d’offrande. Celle qui s’ouvre vers l’ouest est appelée « le Saint ». L’autre, qui s’ouvre vers le sud, est appelée « le Saint du Saint ». La troisième, qui s’ouvre vers l’est, est appelée « le Saint des Saints », le lieu où seul entre le grand prêtre. Le baptême est la maison appelée « le Saint ». [La rédemption] est « le Saint du Saint ». « Le [Saint] des Saints » est la chambre nuptiale. Le [baptême] comprend la résurrection [avec] la rédemption. La rédemption est dans la chambre nuptiale. Mais [la] chambre nuptiale vaut mieux que […] Vous ne trouverez pas son […] ceux qui prient […] Jérusalem. […] Jérusalem qui [… Jérusalem], étant vue […] ceux qu’on appelle « [les Saints] des Saints » [… le] voile déchiré […] chambre nuptiale, excepté l’image [… qui] [est en haut. Ainsi] son voile fut déchiré de haut en bas, car il fallait que certains de ceux d’en bas montent en haut.


    Les puissances ne peuvent pas voir ceux qui ont revêtu la lumière parfaite, et elles ne peuvent pas les retenir. Mais on revêtira cette lumière dans le mystère de l’union.


    Si la femme n’avait pas été séparée de l’homme, elle ne serait pas morte avec l’homme. Sa séparation fut le commencement de la mort. C’est pourquoi le Christ est venu réparer la séparation qui existait depuis le commencement, en réunissant de nouveau les deux. Il donnera la vie à ceux qui sont morts à cause de la séparation, en les unissant. Or, la femme s’unit à son mari dans la chambre nuptiale, et ceux qui se sont unis dans la chambre nuptiale ne seront plus séparés. C’est pourquoi Ève se sépara d’Adam : elle ne s’était pas unie à lui dans la chambre nuptiale.


    C’est par un souffle que l’âme d’Adam vint à l’existence. Son partenaire était l’esprit. Ce qui lui fut donné était sa mère. Son âme fut [enlevée], et [la vie] — Ève — lui fut donnée à sa place. Lorsqu’il fut uni […] des paroles qui étaient supérieures aux puissances, et elles l’enviaient […] partenaire spirituel […] caché […] c’est-à-dire le […] eux-mêmes […] chambre nuptiale afin que […] Jésus apparut [… le] Jourdain, la [plénitude du royaume] des cieux. Celui qui [avait été engendré] avant toute chose fut engendré de nouveau. Celui qui [avait reçu l’onction] le premier reçut de nouveau l’onction. Celui qui avait été racheté fut racheté de nouveau.


    S’il faut parler d’un mystère : le Père de tout s’unit à la vierge qui était descendue, et un feu l’illumina ce jour-là. Il révéla la grande chambre nuptiale ; ainsi, son corps vint à l’existence ce jour-là. Il sortit de la chambre nuptiale comme celui qui est venu à l’existence à partir de l’époux et de l’épouse. C’est ainsi que Jésus établit toutes choses en lui-même. Il faut aussi que chacun des disciples entre dans son repos par ces choses.


    Adam vint à l’existence à partir de deux vierges : l’Esprit et la terre vierge. De même, le Christ fut engendré d’une vierge afin de réparer la chute survenue au commencement.


    Deux arbres poussent dans le Paradis. L’un engendre [des animaux], l’autre engendre des humains. Adam [mangea] de l’arbre qui engendrait des animaux ; [il] devint un animal et engendra [des animaux]. Voilà pourquoi les enfants d’Adam adorent les [animaux]. L’arbre […] est fruit […] ceci, ils […] mangèrent le […] fruit du […] engendrer des humains […] de l’humain de […] Dieu fait l’humain, [… les humains] font [Dieu]. Il en va ainsi dans le monde : les humains font des dieux et adorent ce qu’ils ont créé. Il vaudrait mieux que les dieux adorent les humains !


    La vérité, c’est que l’œuvre des humains provient de leur puissance ; c’est pourquoi ils sont appelés « les puissances ». Leurs œuvres sont leurs enfants, qui viennent à l’existence par le repos. Leur puissance se manifeste donc dans leurs œuvres, mais le repos se révèle dans leurs enfants. Et vous constaterez que cela s’étend jusqu’à l’image. Voici ce qu’est la personne dans l’image : elle accomplit ses œuvres par sa puissance, mais engendre ses enfants par le repos.


    Dans ce monde, les esclaves travaillent pour les personnes libres. Dans le royaume des cieux, les personnes libres serviront les esclaves. Les enfants de la chambre nuptiale serviront les enfants du [mariage. Les] enfants de la chambre nuptiale ont un [seul] nom : « Repos ». [Étant] ensemble, ils n’ont pas besoin de prendre forme, [car ils ont] la contemplation […] ils sont nombreux […] avec ceux qui sont dans le […] les gloires du […] ne […] eux […] descendent dans l’[eau …] ils se rachèteront […] c’est-à-dire ceux qui ont […] en son nom, car il a dit : « [C’est ainsi que] nous accomplirons toute justice. »'
