    text: 'Cette traduction est provisoire : elle repose sur le témoin anglais public indiqué, dans l’attente d’une vérification directe du copte. Les mots entre crochets représentent des restitutions proposées dans les passages endommagés ; les points de suspension entre crochets signalent des lacunes.'
