  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: fr
  text: 'Ceux qui sèment en hiver récoltent en été. L’hiver, c’est le monde ; l’été, l’autre ère. Semons dans le monde afin de récolter en été. C’est pourquoi il ne convient pas que nous priions en hiver.[a] L’été vient après l’hiver. Mais si quelqu’un récolte en hiver, il ne récoltera pas : il arrachera, car ce qui est de cette sorte ne produira pas de fruit […] cela ne sort pas simplement […] mais lors de l’autre sabbat […] c’est stérile.[b]


    Le Christ est venu acheter les uns, sauver les autres et en racheter d’autres encore. Il a acheté ceux qui étaient étrangers, en a fait les siens et les a mis à part comme gage, selon sa volonté. Ce n’est pas seulement lorsqu’il s’est manifesté qu’il a donné sa vie quand il l’a voulu ; depuis le jour où le monde est venu à l’existence, il a donné sa vie quand il l’a voulu. Puis il est d’abord venu la reprendre, puisqu’elle avait été donnée en gage.[c] Elle était au pouvoir des brigands qui l’avaient capturée, mais il l’a sauvée. Il a aussi racheté ceux qui sont bons dans le monde, comme ceux qui sont mauvais.


    La lumière et les ténèbres, la droite et la gauche sont sœurs les unes des autres.[d] Elles sont inséparables. Ainsi, ceux qui sont bons ne sont pas bons, ceux qui sont mauvais ne sont pas mauvais ; la vie n’est pas vraiment la vie, et la mort n’est pas vraiment la mort.[e] C’est pourquoi chacun sera dissous dans son origine, celle du commencement.[f] Mais ceux qui sont élevés au-dessus du monde ne peuvent être dissous et sont éternels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens de « prier en hiver » est incertain dans ce contexte. La formulation suit le témoin anglais fourni ; une vérification directe du copte reste nécessaire.
    reason: Signaler une difficulté textuelle ou sémantique sans corriger conjecturalement le texte.
  - marker: b
    text: Les crochets et points de suspension signalent des lacunes du manuscrit ou des passages dont la restitution est incertaine ; l’enchaînement est donc fragmentaire.
    reason: Préserver visiblement les dommages et incertitudes du manuscrit.
  - marker: c
    text: Les pronoms « la » et « elle » semblent renvoyer à « sa vie », mais le passage est grammaticalement et conceptuellement difficile.
    reason: Préserver l’ambiguïté référentielle tout en aidant le lecteur.
  - marker: d
    text: Littéralement, le témoin dit « frères ». Le féminin français s’accorde ici avec « lumière », « ténèbres », « droite » et « gauche ».
    reason: Expliquer l’adaptation grammaticale sans masquer la forme de l’expression source transmise.
  - marker: e
    text: '« Vraiment » explicite la force paradoxale indiquée par le témoin : les réalités nommées dans le monde ne correspondent pas pleinement à leur véritable nature.'
    reason: Clarifier une parenthèse interprétative présente dans le témoin anglais sans supprimer la tension.
  - marker: f
    text: 'La construction peut aussi être comprise : « chacun sera dissous dans son origine première ».'
    reason: Documenter une autre analyse plausible d’une syntaxe ambiguë.
lexical_decisions:
- source_word: winter / summer
  choice: hiver / été
  rationale: Conserve la métaphore saisonnière structurante et son identification explicite au monde présent et à l’autre ère.
- source_word: the other age
  choice: l’autre ère
  rationale: « Ère » exprime une période ou un ordre du monde sans imposer l’idée plus étroite d’un simple âge chronologique.
- source_word: pray
  choice: priions
  rationale: Rend directement le témoin fourni, tout en signalant en note que le contexte demeure difficile en raison de l’état provisoire de la base textuelle.
- source_word: buy / redeem
  choice: acheter / racheter
  rationale: Maintient la distinction lexicale et l’imagerie économique du passage au lieu de fondre les deux verbes en un seul concept théologique.
- source_word: pledge
  choice: gage
  rationale: Préserve l’image d’un bien remis en garantie et permet la reprise cohérente « donnée en gage ».
- source_word: laid down his life
  choice: a donné sa vie
  rationale: Expression française naturelle qui conserve l’idée d’un acte volontaire, soulignée par « quand il l’a voulu ».
- source_word: brothers
  choice: sœurs
  rationale: Accord grammatical naturel avec les noms français féminins « lumière », « ténèbres », « droite » et « gauche » ; la relation de parenté et de correspondance est conservée.
- source_word: dissolved / indissoluble
  choice: dissous / ne peuvent être dissous
  rationale: Conserve le contraste terminologique interne plutôt que de varier inutilement le vocabulaire.
theological_decisions:
- issue: L’interdiction de prier « en hiver »
  choice: Traduction littérale conservée
  alternative: Interpréter « prier » comme une activité agricole ou restaurer conjecturalement un autre verbe
  rationale: Le témoin fourni porte « pray » et la révision directe du copte est annoncée comme encore en attente ; il serait imprudent de résoudre le problème par conjecture dans le texte principal.
- issue: 'Les trois actions du Christ : acheter, sauver, racheter'
  choice: Maintenir trois verbes et trois groupes distincts
  alternative: Les harmoniser sous « sauver » ou « racheter »
  rationale: La différenciation paraît intentionnelle et peut porter une tension théologique propre au traité.
- issue: Le référent féminin de « elle » dans le deuxième paragraphe
  choice: Conserver le pronom sans expliciter son antécédent
  alternative: Ajouter « sa vie » à chaque occurrence
  rationale: Le passage demeure syntaxiquement ambigu ; expliciter partout l’antécédent ferait passer une interprétation dans le texte.
- issue: Bons et mauvais « ne sont pas » réellement tels
  choice: Conserver la formulation paradoxale
  alternative: Paraphraser comme une simple relativité morale
  rationale: Le texte associe ces oppositions à lumière/ténèbres, vie/mort et à leur dissolution ; une paraphrase morale réduirait sa portée cosmologique.
- issue: Retour à l’origine
  choice: « dissous dans son origine, celle du commencement »
  alternative: « dissous dans son origine première » ou « dans son origine dès le commencement »
  rationale: La formulation retenue garde perceptible l’étrangeté et l’ambiguïté de « its origin from the beginning » sans imposer une chronologie ou une cosmologie trop précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste volontairement resserrée et parfois étrange lorsque le passage est fragmentaire ou conceptuellement paradoxal. Cette version est provisoire, car elle repose sur le témoin anglais public fourni ; la révision directe du copte du Codex de Nag Hammadi II,3 reste à effectuer.
