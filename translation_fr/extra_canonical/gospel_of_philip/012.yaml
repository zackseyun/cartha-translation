translation:
  language: fr
  text: '[Le] mystère du mariage [est] grand, car [sans] lui le monde [n’existerait pas] ; car [la] structure du [monde…], mais la structure [… le mariage]. Réfléchissez à ce qui est [intime…] souillé, car cela possède […] puissance. Son image existe dans une [souillure].[a]


    Les esprits impurs prennent des [formes] masculines et féminines. Les masculins sont ceux qui ont des rapports intimes avec les âmes qui habitent une forme féminine, et les féminins sont ceux qui s’unissent à ceux qui sont dans une forme masculine, par désobéissance. Personne ne pourra échapper à leurs liens sans recevoir une puissance masculine et une puissance féminine — l’époux et l’épouse — à l’image de la chambre nuptiale. Quand les femelles insensées voient un homme assis seul, elles se jettent sur lui, jouent avec lui et le souillent. De même, quand les mâles insensés voient une belle femme assise seule, ils la séduisent et la contraignent, voulant la souiller. Mais s’ils voient le mari et sa femme assis ensemble, les femelles ne peuvent pas entrer dans le mari, ni les mâles dans la femme. Il en va ainsi lorsque l’image s’unit à l’ange : personne ne pourra oser entrer dans [l’homme] ou dans la femme.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du passage est très endommagé. Les crochets signalent des restitutions ou des mots incertains, et les points de suspension une lacune du manuscrit ; la syntaxe et le sens exacts restent incertains.
    reason: Informer le lecteur que l’obscurité du premier paragraphe vient de l’état du texte et non d’une clarification omise.
  - marker: b
    text: Le manuscrit est lacunaire devant « homme ». On pourrait aussi rendre le terme restitué par « mâle », en parallèle avec « femelle » ; l’identité de « l’image » et de « l’ange » n’est pas précisée.
    reason: Signaler à la fois la restauration textuelle et l’ambiguïté symbolique finale.
lexical_decisions:
- source_word: mystery of marriage
  choice: mystère du mariage
  rationale: Rend directement la terminologie sacramentelle ou symbolique du témoin sans en préciser davantage la portée.
- source_word: structure
  choice: structure
  rationale: Conserve le terme abstrait et la répétition du passage lacunaire, plutôt que de conjecturer « fondement » ou « constitution ».
- source_word: intimate
  choice: avoir des rapports intimes
  rationale: Exprime l’union à connotation sexuelle sans imposer une formulation plus crue que le témoin.
- source_word: bound by them
  choice: leurs liens
  rationale: Formulation française naturelle qui maintient l’idée d’assujettissement.
- source_word: groom and bride
  choice: l’époux et l’épouse
  rationale: Dans le cadre de la chambre nuptiale, « époux » et « épouse » sont dignes et naturels ; ils maintiennent le couple symbolique.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Terme établi et littéral, important dans la symbolique propre à l’ouvrage.
- source_word: male/female forms
  choice: formes masculines et féminines
  rationale: Distingue les formes prises par les esprits des personnes humaines mentionnées ensuite.
- source_word: males/females
  choice: mâles/femelles
  rationale: Conserve la désignation des esprits en contraste avec « homme », « femme », « mari » et « épouse », malgré sa rudesse voulue en français.
- source_word: image unites with the angel
  choice: l’image s’unit à l’ange
  rationale: Préserve une formulation énigmatique sans identifier l’image ni expliquer l’union.
theological_decisions:
- issue: Nature du mariage et de la chambre nuptiale
  choice: Maintenir le langage symbolique sans l’identifier exclusivement au mariage humain, à un rite ou à une union spirituelle.
  alternative: Interpréter explicitement le passage comme doctrine sacramentelle ou comme éloge du mariage conjugal.
  rationale: Le contexte transmis demeure ambigu et lacunaire ; la traduction ne doit pas résoudre cette tension.
- issue: Puissances masculine et féminine
  choice: Conserver les deux puissances et leur apposition « l’époux et l’épouse ».
  alternative: Les harmoniser en une seule puissance androgyne ou les expliquer comme vertus spirituelles.
  rationale: Le témoin présente une dualité explicite dont la fonction théologique ne doit pas être normalisée.
- issue: Union de l’image avec l’ange
  choice: Traduction littérale et non expliquée.
  alternative: Comprendre « ange » comme conjoint céleste, double spirituel ou être angélique protecteur.
  rationale: Aucune de ces identifications ne peut être imposée à partir du seul témoin fourni.
- issue: Entrée des esprits dans l’homme ou la femme
  choice: Garder le verbe concret « entrer » et son ambiguïté.
  alternative: Paraphraser par « posséder », « envahir » ou « avoir des rapports avec ».
  rationale: Le passage peut évoquer à la fois intrusion, possession et union sexuelle ; une paraphrase trancherait indûment.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe fragmentaire du premier paragraphe est volontairement conservée en raison des lacunes. Le second paragraphe privilégie une prose fluide tout en maintenant les répétitions, les contrastes de genre et le vocabulaire dérangeant du témoin. Projet provisoire fondé sur le témoin anglais du domaine public fourni ; une révision directe du copte reste nécessaire.
