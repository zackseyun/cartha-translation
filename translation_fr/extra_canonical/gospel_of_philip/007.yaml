translation:
  language: fr
  text: 'Ceux qui disent que le Seigneur est d’abord mort, puis ressuscité, se trompent, car il est d’abord ressuscité, puis il est mort. Quiconque n’acquiert pas d’abord la résurrection ne mourra pas. Par le Dieu vivant, celui-là /mourrait\ ![a]


    Personne ne cachera une chose grande et précieuse dans une grande chose ; pourtant, on a souvent placé des dizaines de milliers dans une chose qui ne vaut qu’une petite pièce. Il en va de même de l’âme : une chose précieuse est venue à l’existence dans un corps méprisable.


    Certains ont peur de ressusciter nus. Ils veulent donc ressusciter dans la chair, sans savoir que ceux qui portent la [chair] sont nus. Ceux qui […] se dépouiller pour être nus [ne] sont [pas] nus.[b] « La chair [et le sang n’hériteront pas du] royaume [de Dieu]. » Qu’est-ce qui n’héritera pas ? Ce qui est sur nous. Mais alors, qu’est-ce qui héritera ? C’est la chair et le sang de Jésus. C’est pourquoi il a dit : « Celui qui ne mange pas ma chair et ne boit pas mon sang n’a pas la vie en lui. » Qu’est-ce que sa chair ? C’est la Parole ; et son sang, c’est l’Esprit saint. Celui qui les a reçus possède nourriture, boisson et vêtement.


    Pour ma part, je ne suis donc pas d’accord avec les autres, qui disent : « Cela ne ressuscitera pas. » Les deux camps se trompent. Vous qui dites : « La chair ne ressuscitera pas », dites-moi ce qui ressuscitera, afin que nous puissions vous rendre hommage. Vous dites : « L’esprit dans la chair, et cette autre lumière dans la chair. » Mais cette parole aussi est dans la chair, car quoi que vous disiez, vous ne pouvez rien dire sans la chair. Il est nécessaire de ressusciter dans cette chair, puisque tout existe en elle. Dans ce monde, les personnes valent mieux que les vêtements qu’elles portent. Dans le royaume des cieux, les vêtements valent mieux que ceux qui les portent.


    Tout est purifié par l’eau et le feu : le visible par le visible, le caché par le caché. Certaines choses sont cachées par des choses visibles. Il y a de l’eau dans l’eau, et du feu dans le chrême.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme inhabituelle « /mourrait\ » reproduit le signal typographique du témoin anglais fourni; le sens exact de cette lecture devra être vérifié directement sur le copte.
    reason: Le témoin signale ici une lecture textuellement inhabituelle qu’il ne faut ni masquer ni corriger sans examen du manuscrit.
