  - marker: c
    text: Le chrême est l’huile consacrée employée pour l’onction.
    reason: Le terme précis peut être peu familier au lectorat moderne et mérite une brève clarification.
lexical_decisions:
- source_word: arose / resurrection
  choice: ressuscité / résurrection
  rationale: Conserve le vocabulaire central et son paradoxe intentionnel, sans le réduire à une simple survie spirituelle.
- source_word: flesh
  choice: chair
  rationale: Maintient le terme concret et théologiquement chargé, ainsi que sa répétition structurante.
- source_word: Word
  choice: Parole
  rationale: Rend le titre théologique de manière française courante, avec une majuscule pour signaler son emploi référentiel.
- source_word: Holy Spirit
  choice: Esprit saint
  rationale: Forme française moderne et largement intelligible, sans coloration confessionnelle particulière.
- source_word: chrism
  choice: chrême
  rationale: Terme français précis pour l’huile d’onction; il préserve le lien symbolique entre eau, feu et onction.
- source_word: acquire the resurrection
  choice: acquérir la résurrection
  rationale: Préserve l’idée inhabituelle d’une résurrection à recevoir dès maintenant, au lieu de la normaliser en résurrection future.
- source_word: inherit
  choice: hériter
  rationale: Conserve la formulation scripturaire et la question répétée sur ce qui reçoit l’héritage.
theological_decisions:
- issue: Ordre paradoxal entre résurrection et mort
  choice: « il est d’abord ressuscité, puis il est mort »
  alternative: Interpréter la résurrection comme une expérience spirituelle antérieure à la mort
  rationale: Le texte formule délibérément un paradoxe. La traduction le conserve sans ajouter d’explication doctrinale.
- issue: Résurrection « dans cette chair »
  choice: Conserver littéralement l’affirmation
  alternative: Traduire « hors de cette chair » ou l’harmoniser avec un rejet de la chair
  rationale: Le passage maintient une tension entre la chair portée comme vêtement et la nécessité de ressusciter en elle; cette tension ne doit pas être résolue par la traduction.
- issue: Chair et sang de Jésus identifiés à la Parole et à l’Esprit saint
  choice: Garder les identifications explicites du texte
  alternative: Les paraphraser dans un sens sacramentel ou purement symbolique
  rationale: La formulation propre au passage est conservée sans imposer une lecture confessionnelle.
- issue: Référent de « cela ne ressuscitera pas »
  choice: Employer le neutre « cela »
  alternative: Expliciter immédiatement « la chair »
  rationale: Le référent n’est précisé que dans la réplique suivante; garder « cela » préserve la progression et une légère ambiguïté du témoin.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « chair », « visible », « caché » et « vêtements » est volontairement conservée. Les citations restent intégrées au discours sans harmonisation forcée avec une version biblique particulière. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et la révision directe du copte est encore en attente.
