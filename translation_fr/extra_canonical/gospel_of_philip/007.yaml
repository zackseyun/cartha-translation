  naturalness: 'Deux ajustements sont nécessaires : « Par le Dieu vivant » n’est pas une formule idiomatique dans ce contexte et devient « Aussi vrai que Dieu est vivant » ; la proposition lacunaire sur ceux qui se dépouillent devait recevoir une syntaxe française complète tout en conservant explicitement la lacune et la restauration. « vous honorer » est aussi plus direct et naturel que « vous rendre hommage » ici.'
  terminology: Les choix « résurrection », « chair », « Parole », « Esprit saint », « royaume des cieux » et « chrême » conviennent au registre et restent proches du témoin. « Chrême » est correctement expliqué comme huile consacrée pour l’onction. Les majuscules à « Parole » et « Esprit saint » rendent les identifications du passage sans imposer d’interprétation supplémentaire.
  issues:
