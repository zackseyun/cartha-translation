    issue: Syntaxe inachevée dans la phrase lacunaire sur ceux qui se dépouillent.
    rationale: « Ceux qui […] se dépouiller pour être nus [ne] sont [pas] nus » laisse un infinitif sans verbe conjugué. Une traduction française doit conjuguer le verbe, tout en préservant l’ellipse et le segment restauré.
  - severity: low
    issue: Formule de serment peu idiomatique.
    rationale: « Par le Dieu vivant » est une transposition trop littérale de « As God lives ». « Aussi vrai que Dieu est vivant » rend naturellement la même formule assertive.
  - severity: low
    issue: « Rendre hommage » est légèrement trop cérémoniel pour « honor ».
    rationale: « Vous honorer » maintient la pointe ironique et le registre discursif du passage avec davantage de proximité formelle.
