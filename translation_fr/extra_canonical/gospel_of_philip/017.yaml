  footnotes:
  - marker: a
    text: Le début de la phrase est lacunaire ; les crochets signalent des restitutions éditoriales et les points de suspension une perte de texte.
    reason: Avertir le lecteur que le lien syntaxique et le contexte de l’action d’Abraham ne sont pas entièrement conservés.
  - marker: b
    text: « Chambre » peut désigner ici la chambre nuptiale, motif important ailleurs dans l’Évangile de Philippe ; la formulation du témoin fourni reste toutefois simplement « chambre ».
    reason: Préserver la possible portée nuptiale sans l’imposer avant la vérification directe du copte.
  - marker: c
    text: Littéralement, le terme rendu par « onction » correspond au « chrême » ; il peut désigner l’huile d’onction ou l’acte rituel d’en recevoir.
    reason: Éclairer un terme rituel peu transparent tout en gardant une formulation accessible dans le texte.
lexical_decisions:
- source_word: flesh
  choice: chair
  rationale: Conserve le terme théologiquement chargé et le lien explicite entre prépuce et destruction de la chair, sans l’atténuer en « corps ».
- source_word: root of evil
  choice: racine du mal
  rationale: Maintient l’image directrice du déracinement et ses reprises tout au long du passage.
- source_word: the Word
  choice: la Parole
  rationale: Préserve l’ambiguïté entre parole scripturaire et réalité personnifiée, sans imposer une identification doctrinale.
- source_word: knowledge
  choice: connaissance
  rationale: Rend le contraste explicite avec l’ignorance tout en évitant un vocabulaire technique ou confessionnel ajouté.
- source_word: types
  choice: figures
  rationale: « Figures » est naturel en français et conserve l’idée de formes représentatives ou symboliques sans préciser abusivement leur statut.
- source_word: chamber
  choice: chambre
  rationale: Reproduit la désignation sobre du témoin fourni et ne résout pas dans le corps du texte sa possible connotation nuptiale.
- source_word: fullness
  choice: plénitude
  rationale: Conserve le terme conceptuel sans le paraphraser ni l’identifier explicitement à un système théologique.
- source_word: chrism
  choice: onction
  rationale: Terme français intelligible correspondant au rite ou à la substance d’onction, sans introduire une terminologie ecclésiale plus précise que le témoin.
theological_decisions:
- issue: « détruire la chair » après la circoncision d’Abraham
  choice: Conserver l’affirmation abrupte telle quelle
  alternative: Paraphraser comme renoncement aux désirs charnels
  rationale: Le passage maintient une tension entre geste corporel et portée symbolique ; l’expliciter doctrinalement supprimerait cette tension.
- issue: Statut ontologique de ce qui vient de l’ignorance
  choice: Conserver les négations temporelles et la rupture de nombre du passage endommagé
  alternative: Harmoniser en une affirmation philosophique cohérente au singulier
  rationale: Le témoin est lacunaire et grammaticalement instable ; une harmonisation ferait croire à une certitude absente.
- issue: « toute divinité » fuyant les lieux
  choice: Traduire littéralement sans identifier les êtres ou puissances concernés
  alternative: Interpréter comme présence divine, puissances spirituelles ou faux dieux
  rationale: L’identité du référent demeure ambiguë dans le témoin disponible.
- issue: La chambre cachée
  choice: Employer « chambre » et signaler en note la possibilité d’une chambre nuptiale
  alternative: Inscrire directement « chambre nuptiale » dans le texte
  rationale: La revue directe du copte est annoncée comme encore nécessaire ; le texte principal ne doit pas dépasser l’évidence fournie.
- issue: Semence de l’Esprit saint et esclavage du mal
  choice: Conserver l’alternance entre le collectif « semence » et le pluriel « ils »
  alternative: Réécrire avec un référent uniforme
  rationale: Cette irrégularité peut refléter un passage collectif aux personnes qui en relèvent ; la lisser résoudrait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions structurantes — cacher, révéler, reconnaître, racine, vérité, liberté — sont volontairement maintenues. Les crochets et les ellipses reproduisent les signaux de lacune ou de restitution du témoin anglais public fourni. Comme la vérification directe du copte du Codex II,3 est indiquée comme en attente, cette version demeure explicitement prudente dans les passages endommagés ou techniquement ambigus.
