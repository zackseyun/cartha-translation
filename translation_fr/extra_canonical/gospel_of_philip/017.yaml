  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are servants of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the servants will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: fr
  text: 'Quand Abraham […] pour voir ce qu’il allait voir, [il] circoncit la chair du prépuce, [nous indiquant] qu’il faut détruire la chair.[a]


    [La plupart des choses] du monde peuvent subsister et vivre tant que leur [intérieur reste caché. S’il est révélé], elles meurent, comme [le montre] l’être humain visible. [Tant que] les entrailles d’une personne restent cachées, cette personne est en vie. Si ses entrailles sont mises à découvert et sortent d’elle, elle mourra. Il en va de même pour l’arbre : tant que sa racine est cachée, il fleurit et grandit ; si sa racine est mise à découvert, l’arbre se dessèche. Il en va ainsi de tout ce qui naît dans le monde, non seulement de ce qui est révélé, mais aussi de ce qui est caché. En effet, tant que la racine du mal est cachée, elle est forte. Mais si elle est reconnue, elle se dissout, et si elle est révélée, elle meurt. C’est pourquoi la Parole dit : « Déjà la hache est posée à la racine des arbres. » Elle ne se contentera pas de couper, car ce qui est coupé refleurit. La hache creuse plutôt la terre jusqu’à ce qu’elle en fasse sortir la racine. Jésus a arraché la racine tout entière,
    tandis que d’autres ne l’ont fait qu’en partie.


    Quant à nous, que chacun de nous creuse jusqu’à la racine du mal qui est en lui et l’arrache en nous depuis sa racine. Il sera déraciné si nous le reconnaissons. Mais si nous ne le reconnaissons pas, il s’enracine en nous et porte son fruit en nous. Il nous domine, et nous sommes contraints de le servir. Il nous tient captifs, de sorte que nous faisons ce que nous ne voulons [pas] et que nous ne faisons [pas] ce que nous voulons. [Il est] puissant parce que nous ne l’avons pas reconnu. Il demeure à l’œuvre tant qu’[il existe].


    [L’ignorance] est la mère de [tout mal]. L’ignorance causera [la mort, car] ce qui vient de [l’ignorance] n’existait pas, [n’existe] pas et ne viendra pas à l’existence […] ils seront rendus parfaits lorsque la vérité tout entière sera révélée. Car la vérité ressemble à l’ignorance : lorsqu’elle est cachée, elle repose en elle-même ; mais si elle est révélée et reconnue, elle est glorifiée, puisqu’elle est plus forte que l’ignorance et l’erreur. Elle donne la liberté. La Parole dit : « Si vous connaissez la vérité, la vérité vous rendra libres. » L’ignorance est esclavage ; la connaissance est liberté. Si nous connaissons la vérité, nous trouverons en nous les fruits de la vérité. Si nous nous unissons à elle, elle recevra notre plénitude.


    À présent, nous avons ce qui est révélé de la création. Nous disons : « Ceux qui sont forts sont honorés, mais ceux qui sont cachés sont faibles et méprisés. » Il en va ainsi de ce qui est révélé de la vérité : ces choses sont faibles et méprisées, tandis que celles qui sont cachées sont fortes et honorées. Pourtant, les mystères de la vérité sont révélés sous forme de figures et d’images.


    La chambre, cependant, est cachée : elle est le Saint dans le Saint.[b] Au commencement, le voile cachait la manière dont Dieu gouvernait la création. Mais lorsque le voile sera déchiré et que ce qui est à l’intérieur sera révélé, cette maison sera abandonnée [comme] un désert — ou plutôt, elle sera [détruite]. Et toute divinité fuira [loin de] ces lieux, non pas pour entrer dans le Saint [des] saints, car elle ne pourra pas s’unir à la [lumière] pure ni à la plénitude [sans défaut], [mais] elle viendra se placer sous les ailes de la croix [et sous] ses bras. Cette arche [deviendra leur] salut lorsque les eaux du déluge déferleront sur eux.


    Si certains appartiennent au sacerdoce, ils pourront entrer derrière le voile avec le grand prêtre. Le voile n’a donc pas été déchiré seulement en haut, car il n’aurait alors été ouvert qu’à ceux d’en haut. Il n’a pas non plus été déchiré seulement en bas, car il n’aurait alors été révélé qu’à ceux d’en bas. Il a été déchiré de haut en bas. Ceux d’en haut nous ont ouvert ce qui est en bas, afin que nous entrions dans le secret de la vérité. Voilà véritablement ce qui est honorable et fort. Mais nous y entrerons par des figures méprisées et par des faiblesses. Elles s’abaissent devant la gloire parfaite. Il existe une gloire supérieure à la gloire et une puissance supérieure à la puissance. Ainsi, ce qui est parfait nous a été ouvert avec les secrets de la vérité ; le Saint des saints a été révélé, et la chambre nous a invités à entrer.


    Tant qu’il est caché, le mal est inactif, mais il n’a pas été retiré du milieu de la semence de l’Esprit saint : ils sont esclaves du mal. Mais chaque fois qu’il est révélé, la lumière parfaite se répandra sur tous, et tous ceux qui sont en elle [recevront l’onction].[c] Alors les esclaves seront libérés et les captifs seront rachetés. « [Toute] plante [que] mon Père qui est dans les cieux [n’a pas] plantée [sera] déracinée. » Ceux qui sont séparés s’uniront […] seront remplis.'
