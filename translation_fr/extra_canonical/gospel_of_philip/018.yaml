translation:
  language: fr
  text: 'Tous ceux qui [entreront] dans la chambre allumeront leur [lampe], car [c’est] comme les mariages qui […] ont lieu la nuit : le feu […] la nuit et s’éteint. Mais les mystères de ce mariage s’accomplissent dans le jour et la lumière. Ni ce jour ni sa lumière ne se couchent jamais.


    Si quelqu’un devient un enfant de la chambre nuptiale, il recevra la lumière. Si quelqu’un ne la reçoit pas pendant qu’il est ici, il ne pourra pas la recevoir dans l’autre lieu. Celui qui recevra cette lumière ne sera ni vu ni retenu, et personne ne pourra inquiéter un tel être, même pendant qu’il demeure dans le monde. De plus, lorsqu’il quitte le monde, il a déjà reçu la Vérité dans les images. Le monde est devenu les âges éternels[a], car l’âge éternel est pour lui la plénitude. Et il en est ainsi : cela lui est révélé, à lui seul. Ce n’est pas caché dans les ténèbres et la nuit, mais dans un jour parfait et une sainte lumière.


    L’Évangile


    selon Philippe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « âges éternels » peut aussi se rendre par « éons ». Le témoin fourni marque « éternels » comme une précision éditoriale entre parenthèses.
    reason: Signaler à la fois le terme technique possible et le statut incertain de la précision « éternel », sans alourdir le corps du texte.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: chambre / chambre nuptiale
  rationale: Conserve la variation du témoin entre le terme bref au début et l’expression explicitement nuptiale ensuite, sans réduire d’emblée l’image à un rite précis.
- source_word: mysteries
  choice: mystères
  rationale: Équivalent naturel qui maintient la portée religieuse et l’indétermination du terme.
- source_word: child of the bridal chamber
  choice: enfant de la chambre nuptiale
  rationale: Traduction volontairement formelle d’une image inhabituelle, afin de ne pas en expliquer ni en normaliser le sens.
- source_word: bound
  choice: retenu
  rationale: Préserve l’idée d’entrave ou de mise sous pouvoir tout en restant idiomatique; « lié » demeure possible mais serait plus ambigu en français moderne.
- source_word: Truth
  choice: Vérité
  rationale: La majuscule signale l’emploi quasi personnifié ou transcendant que présente le témoin, sans imposer une identification doctrinale.
- source_word: images
  choice: images
  rationale: Maintient le vocabulaire conceptuel du passage sans substituer « symboles », « figures » ou « sacrements ».
- source_word: (eternal) ages / (eternal) age
  choice: âges éternels / âge éternel
  rationale: Rend la distinction pluriel-singulier et conserve « âge » plutôt que de l’aplanir en « éternité » ou « monde à venir ».
- source_word: fullness
  choice: plénitude
  rationale: Conserve un terme théologiquement chargé mais non interprété, naturel dans ce registre.
theological_decisions:
- issue: Nature de la « chambre nuptiale »
  choice: Conserver l’image littérale sans l’identifier à un sacrement, à une union mystique précise ou à un lieu matériel.
  alternative: Expliciter par « sacrement de la chambre nuptiale » ou par une paraphrase doctrinale.
  rationale: Le passage ne résout pas lui-même la valeur exacte de l’expression; l’explicitation importerait une lecture confessionnelle ou savante.
- issue: Invisibilité et absence de contrainte du récipiendaire de la lumière
  choice: Traduire directement « ne sera ni vu ni retenu » sans en préciser le mécanisme spirituel.
  alternative: Interpréter comme invisibilité aux puissances, délivrance cosmique ou impassibilité morale.
  rationale: Le témoin laisse ouverte la nature des agents et de la protection en question.
- issue: Rapport entre le monde et les âges éternels
  choice: Maintenir l’énoncé paradoxal « Le monde est devenu les âges éternels ».
  alternative: Harmoniser en « le monde a fait place aux âges éternels » ou « devient pour lui l’éternité ».
  rationale: La formulation transmise est théologiquement tendue et ne doit pas être silencieusement résolue.
- issue: Révélation individuelle ou collective
  choice: Employer le singulier générique dans la seconde partie (« lui », « à lui seul »).
  alternative: Employer partout le pluriel (« eux », « à eux seuls »).
  rationale: Le témoin anglais passe du singulier générique à un pluriel de reprise; le français exige une cohérence plus nette. Le singulier suit l’ouverture « Si quelqu’un » tout en préservant la portée générique.
translation_notes:
  register: Français international moderne, digne et lisible. Les crochets et les points de suspension sont conservés exactement comme signaux de restitution et de lacune du manuscrit. La syntaxe du premier paragraphe reste nécessairement heurtée autour des lacunes. Le titre final est rendu selon la forme française traditionnelle, sans ajouter de qualification canonique.
