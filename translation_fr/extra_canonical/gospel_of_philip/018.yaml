    Si quelqu’un devient un enfant de la chambre nuptiale, il recevra la lumière. Si quelqu’un ne la reçoit pas pendant qu’il est ici, il ne pourra pas la recevoir dans l’autre lieu. Celui qui recevra cette lumière ne sera ni vu ni retenu, et personne ne pourra troubler quelqu’un ainsi, même pendant qu’il demeure dans le monde. De plus, lorsqu’ils quitteront le monde, ils auront déjà reçu la Vérité dans les images. Le monde est devenu les âges (éternels)[a], car l’âge (éternel) est pour eux la plénitude. Et il en est ainsi : cela ne leur est révélé qu’à eux. Ce n’est pas caché dans les ténèbres et la nuit, mais c’est caché dans un jour parfait et une sainte lumière.


