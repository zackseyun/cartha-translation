    … Jesus came from that place and brought food from there, and to those who wanted, he gave them [to eat, so that] they would not die.


    … The cup of prayer has wine and water, since it is laid down as the type of the blood over which they give thanks. It fills with the Holy Spirit, and it belongs to the completely perfect human. …


    In this world, union is between male and female, the place of power and weakness. In the (eternal) age, the union is like something else, but we refer to them by the same names. There are other names, however, that are above every name that is named, and they are better than the strong, because where there is force, there are those who are even more powerful. They are not (two) different things, but both are the same thing. …


    Is it not necessary for everyone who has everything to know themselves completely? Some who do not know themselves will not be able to enjoy what they have, but those who have come to understand themselves will enjoy them.


    Not only will they be unable to bind the perfect human, but they will also be unable to see them (the perfect human), because if they see them, they will bind them. …


    The holy man (priest) is completely holy, down to his (very) body, because if he receives the bread, he will make it holy, or the cup, or anything else that he takes and purifies. Why would he not also purify the body?


    … Spiritual love is fragrant wine. All those who will anoint themselves with it enjoy it. …


    Whoever is an unwilling servant will be able to become free. Whoever has become free by the grace of their master and has sold themselves (back) into slavery will no longer be able to become free.'
translation:
  language: fr
  text: '**Le baptême, le chrême, l’eucharistie et la chambre nuptiale**


    Ceux qui disent qu’ils mourront d’abord et qu’ensuite ils ressusciteront se trompent. S’ils ne reçoivent pas d’abord la résurrection pendant qu’ils sont en vie, ils ne recevront rien quand ils mourront. Il en va de même lorsqu’ils parlent du baptême et disent : « Le baptême est une grande chose », car ceux qui le reçoivent vivront.


    L’apôtre Philippe a dit : « Joseph le charpentier planta un jardin parce qu’il avait besoin de bois pour son métier. C’est lui qui fabriqua la croix avec les arbres qu’il avait plantés, et son descendant fut suspendu à ce qu’il avait planté. Son descendant était Jésus, et la plante était la croix. » Mais l’arbre de vie est au milieu du paradis ; de l’olivier est venu le chrême[a], et du chrême, la résurrection.


    Ce monde mange des cadavres. Tout ce qui y est mangé meurt aussi. La Vérité mange la vie ; ainsi, personne de ceux que [la Vérité] nourrit ne mourra. Jésus est venu de ce lieu-là et en a apporté de la nourriture. Il en a donné [à manger à ceux qui] le voulaient, afin qu’ils ne meurent pas.


    [Dieu…] un paradis, [l’être humain…] paradis, il y a […] et […] de Dieu […] ceux qui sont [en lui…] Je souhaite que [le paradis…] on me dise : « [… mange] ceci », ou : « Ne mange pas [cela…] souhaite. » L’arbre de la connaissance est le lieu où je mangerai de tout. Il a tué Adam, mais ici il fait vivre l’humanité. La Loi était l’arbre. Elle a le pouvoir de donner la connaissance du bien et du mal. Elle ne les a ni gardés du mal ni établis dans le bien ; elle a plutôt produit la mort pour ceux qui en ont mangé. En effet, lorsqu’elle a dit : « Mange ceci, ne mange pas cela », elle est devenue le commencement de la mort.


    Le chrême est supérieur au baptême, puisque c’est à cause du chrême que nous sommes appelés « chrétiens », et non à cause du baptême. C’est aussi à cause du chrême que le Christ a reçu son nom : le Père a oint le Fils, le Fils a oint les apôtres, et les apôtres nous ont oints. Celui qui est oint possède tout : la résurrection, la lumière, la croix et l’Esprit saint. Le Père lui a donné cela dans la chambre nuptiale, et il l’a reçu. Le Père était dans le Fils, et le Fils dans le Père. Voilà [le royaume] des cieux.


    Le Seigneur l’a bien dit : « Certains sont allés au royaume des cieux en riant, et ils en sont sortis […] un chrétien […] et dès que [… est descendu] dans l’eau, il […] tout ce qui concerne […] c’est [un] jeu, [mais… méprisent] cela […] au royaume des [cieux…] s’ils méprisent […] et s’ils le tournent en dérision comme un jeu, [… sortiront] en riant. » Il en va de même du pain, de la coupe et de l’huile, bien qu’il y en ait un qui soit supérieur à ceux-ci.


    Le monde est venu à l’existence par suite d’une transgression, car celui qui l’a créé voulait le créer impérissable et immortel. Il a déchu et n’a pas obtenu ce qu’il voulait : le monde n’était pas impérissable, et celui qui l’avait créé ne l’était pas non plus. Car ce ne sont pas les choses qui sont impérissables, mais les enfants. Rien ne pourra recevoir l’impérissabilité sans devenir un enfant. Mais celui qui est incapable de recevoir, combien plus sera-t-il incapable de donner !


    La coupe de la prière contient du vin et de l’eau, puisqu’elle est présentée comme la figure du sang sur lequel on rend grâce. Elle se remplit de l’Esprit saint et appartient à l’être humain entièrement parfait. Chaque fois que nous en buvons, nous recevons l’être humain parfait. L’eau vive est un corps. Il nous faut revêtir l’être humain vivant. C’est pourquoi ceux qui descendent dans l’eau se déshabillent, afin de revêtir celui-là.


    Un cheval engendre un cheval, un être humain engendre un être humain, et un dieu engendre un dieu. Il en va de même du [marié] et des [mariées]. Ils [viennent à l’existence] à partir de […] Aucun Juif […] de […] existe, et […] des Juifs […] les chrétiens […] ont appelé ceux-ci […] « la race choisie de […] », « l’être humain véritable », « le Fils de l’être humain » et « la descendance du Fils de l’être humain ». Cette race véritable est connue dans le monde. C’est en ces lieux que se trouvent les enfants de la chambre nuptiale.


    Dans ce monde, l’union est celle de l’homme et de la femme, le lieu de la force et de la faiblesse. Dans l’âge à venir[b], l’union est d’une autre sorte, mais nous la désignons par les mêmes noms. Il existe toutefois d’autres noms, supérieurs à tout nom que l’on prononce, et ils sont supérieurs aux puissants, car là où il y a de la force, il y en a de plus puissants encore. Ce ne sont pas deux réalités différentes : toutes deux sont une même réalité. Voilà ce qui ne pourra pas descendre sur le cœur de chair.


    Ne faut-il pas que quiconque possède tout se connaisse pleinement ? Ceux qui ne se connaissent pas ne pourront pas jouir de ce qu’ils possèdent, mais ceux qui sont parvenus à se comprendre en jouiront.


    Non seulement ils ne pourront pas attacher l’être humain parfait, mais ils ne pourront même pas le voir, car s’ils le voient, ils l’attacheront. Il n’existe pas d’autre moyen d’acquérir cette grâce [que de] revêtir la lumière parfaite [et de] devenir la [lumière] parfaite. [Celui qui l’a revêtue] ira […] ceci est le parfait […] pour que nous devenions […] avant que nous soyons venus à […] celui qui reçoit tout […] ces lieux, ils pourront […] ce lieu-là, mais ils [… le milieu] comme incomplets. Seul Jésus connaît la fin de celui-ci.


    L’homme saint — le prêtre[c] — est entièrement saint, jusque dans son corps même. Car s’il reçoit le pain, il le sanctifiera ; de même la coupe, ou toute autre chose qu’il prend et purifie. Pourquoi ne purifierait-il pas aussi le corps ?


    De même que Jésus a rendu parfaite l’eau du baptême, de même il a répandu la mort. Ainsi, nous descendons dans l’eau, mais nous ne descendons pas dans la mort, afin de ne pas être répandus dans l’esprit du monde. Quand celui-ci souffle, l’hiver arrive ; quand l’Esprit saint souffle, l’été arrive.


    Celui qui connaît la vérité est une personne libre, et la personne libre ne pèche pas, car « quiconque commet le péché est esclave du péché ». La Vérité est la Mère, mais la connaissance est l’union. Ceux qui ne sont pas livrés au péché sont appelés « libres » par le monde. La connaissance de la vérité rend orgueilleux ceux qui ne sont pas livrés au péché. C’est elle qui les rend libres et les élève au-dessus de tout. Mais « l’amour édifie ». Celui que la connaissance a rendu libre se fait esclave, par amour pour ceux qui ne sont pas encore capables d’atteindre [la] liberté de la connaissance ; [mais] la connaissance les rend capables de devenir libres. L’amour […] rien comme lui appartenant […] il […] ce qui lui appartient. Il ne dit jamais « […] » ni « Ceci est à moi », [mais : « …] est à vous. » L’amour spirituel est un vin parfumé. Tous ceux qui s’en oignent y prennent plaisir. Tant que les personnes ointes restent là, celles qui se trouvent auprès d’elles en profitent aussi. Mais
    si les personnes ointes de parfum les quittent et s’en vont, celles qui ne sont pas ointes et se tenaient seulement auprès d’elles restent dans leur puanteur.


    Le Samaritain n’a rien donné au blessé, sinon du vin mêlé d’huile. Ce n’était rien d’autre que le parfum, et il a guéri les blessures, car « l’amour couvre une multitude de péchés ».


    Les enfants qu’une femme met au monde ressembleront à l’homme qu’elle aime. Si c’est son mari, ils ressembleront à son mari ; si c’est un adultère, ils ressembleront à l’adultère. Souvent, une femme couche avec son mari parce qu’elle y est obligée, mais son cœur est auprès de l’adultère avec lequel elle a des relations ; si elle met au monde un enfant, l’enfant qu’elle enfante ressemble à l’adultère. Mais vous qui vivez avec le Fils de Dieu, n’aimez pas le monde ; aimez plutôt le Seigneur, afin que ceux que vous engendrerez ne viennent pas à ressembler au monde, mais au Seigneur.


    L’être humain s’unit à l’être humain, le cheval au cheval et l’âne à l’âne. Les espèces s’unissent [à] des espèces semblables. Il en va ainsi lorsque l’esprit s’unit à l’esprit, lorsque la [Parole] entre dans l’intimité de la Parole et que [la lumière] entre dans l’intimité [de la lumière]. Si [tu] deviens un être humain, [c’est l’être humain qui] t’aimera. Si tu deviens [esprit], c’est l’Esprit qui s’unira à toi. [Si] tu deviens Parole, c’est la Parole qui s’unira à toi. Si tu deviens lumière, c’est la lumière qui entrera dans ton intimité. Si tu deviens l’un de ceux d’en haut, ceux d’en haut reposeront sur toi. Si tu deviens cheval, âne, veau, chien, brebis ou quelque autre animal du dehors ou d’en bas, ni l’être humain, ni l’esprit, ni la Parole, ni la lumière, ni ceux d’en haut, ni ceux du dedans ne pourront t’aimer. Ils ne pourront reposer en toi, et tu n’auras aucune part avec eux.


    Celui qui est esclave contre son gré pourra être rendu libre. Celui qui, après avoir été libéré par la grâce de son maître, s’est lui-même revendu en esclavage ne pourra plus être rendu libre.'
  philosophy: optimal-equivalence
  footnotes:
