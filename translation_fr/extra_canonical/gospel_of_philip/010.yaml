  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: fr
  text: 'Certains animaux se soumettent aux êtres humains, comme le veau, l’âne et d’autres animaux du même genre. D’autres ne se soumettent pas et vivent seuls dans le désert. L’être humain laboure le champ avec les animaux soumis et, par conséquent, il nourrit aussi bien lui-même que les animaux, qu’ils soient soumis ou non. Il en va de même pour l’être humain parfait : il laboure avec les puissances soumises et prépare ainsi ce qui est nécessaire à tous ceux qui existeront. C’est pourquoi le lieu tout entier subsiste, aussi bien le bien que le mal, la droite que la gauche. L’Esprit saint conduit tout le monde comme un berger et gouverne toutes les puissances — celles qui sont soumises, celles qui ne [le sont pas] et celles qui sont seules — car, en vérité, il […] les retient [de sorte que, même si elles …] le veulent, elles ne pourront pas [partir].[a]


    [Celui qui a été] façonné [est beau, mais] on trouverait que ses enfants sont de nobles formes. S’il n’avait pas été façonné, mais engendré, on trouverait que sa descendance est noble. Or il a été façonné, puis il a engendré. Quelle noblesse y a-t-il là ? Il y eut d’abord l’adultère, puis le meurtre. Et lui, Caïn, fut engendré dans l’adultère, car il était le fils du serpent. C’est pourquoi il devint lui aussi meurtrier comme son père et tua son frère, Abel. Toute union entre des êtres dissemblables est un adultère.[b]'
