lexical_decisions:
- source_word: submit / submissive
  choice: se soumettre / soumis
  rationale: Conserve le rapport d’obéissance et permet de maintenir le parallèle entre les animaux et les puissances.
- source_word: perfect human
  choice: l’être humain parfait
  rationale: Rendu littéral et non genré qui préserve la portée anthropologique et potentiellement spirituelle de l’expression.
- source_word: powers
  choice: puissances
  rationale: Terme suffisamment large pour préserver l’ambiguïté entre forces, autorités et entités spirituelles.
- source_word: the whole place
  choice: le lieu tout entier
  rationale: Préserve l’étrangeté et l’indétermination du témoin plutôt que de préciser « monde » ou « univers ».
- source_word: shepherds
  choice: conduit tout le monde comme un berger
  rationale: Formulation française naturelle qui conserve explicitement l’image pastorale.
- source_word: formed
  choice: façonné
  rationale: Distingue clairement l’acte de formation de l’engendrement mentionné en contraste.
- source_word: seed
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » est idiomatique tout en conservant le sens de lignée.
- source_word: partnership
  choice: union
  rationale: Rend le lien relationnel sans imposer une catégorie juridique ou sacramentelle absente du témoin.
- source_word: dissimilar
  choice: dissemblables
  rationale: Maintient la généralité et la tension de l’énoncé sans définir la nature précise de la différence.
theological_decisions:
- issue: Identité des « puissances »
  choice: Maintien du terme général « puissances »
  alternative: « puissances spirituelles » ou « autorités »
  rationale: Le témoin ne permet pas de déterminer avec certitude s’il s’agit d’entités spirituelles, de forces cosmiques ou d’autorités.
- issue: Portée de « le lieu tout entier »
  choice: Traduction littérale sans explicitation cosmologique
  alternative: « le monde entier » ou « l’univers entier »
  rationale: Évite de résoudre une expression possiblement technique ou cosmologique avant révision directe du copte.
- issue: Caïn comme « fils du serpent »
  choice: Conservation directe de l’affirmation du texte
  alternative: Atténuation métaphorique ou harmonisation avec la Genèse canonique
  rationale: La traduction doit rendre la théologie propre à ce document sans l’harmoniser avec une autre tradition.
- issue: Toute union dissemblable qualifiée d’adultère
  choice: Conservation de la formulation absolue
  alternative: Restriction aux unions sexuelles ou matrimoniales
  rationale: Le champ d’application demeure ambigu ; une restriction interprétative ajouterait au texte.
