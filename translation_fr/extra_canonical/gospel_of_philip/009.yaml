lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: être humain céleste / être humain terrestre / être humain parfait
  rationale: « Être humain » conserve la portée générique de human sans réduire le référent au seul sexe masculin ; les qualificatifs maintiennent le contraste cosmologique du témoin.
- source_word: begotten / beget
  choice: engendré / engendrer
  rationale: Le même champ lexical est maintenu dans tout le passage afin de préserver son raisonnement sur la filiation et la génération spirituelle.
- source_word: physically
  choice: dans la chair
  rationale: Cette expression française, naturelle dans un contexte religieux ancien, conserve l’opposition entre la génération mondaine et l’autre mode de génération sans expliciter davantage le texte.
- source_word: companion / partner
  choice: compagne
  rationale: « Compagne » préserve la proximité relationnelle et l’ambiguïté du terme sans imposer une interprétation conjugale ou purement disciplinaire.
- source_word: Wisdom
  choice: Sagesse
  rationale: La majuscule indique qu’il s’agit ici d’une figure ou réalité personnifiée, et le féminin français correspond aux pronoms féminins du passage.
- source_word: Echamoth / Echmoth
  choice: Échamoth / Échmoth
  rationale: Translittération francisée minimale avec accent initial, tout en conservant strictement la distinction entre les deux formes transmise par le témoin.
theological_decisions:
- issue: Identité de « Marie » dans la formule sœur, mère et compagne
  choice: Conserver le nom « Marie » sans déterminer laquelle des femmes est visée
  alternative: Identifier explicitement chaque titre à l’une des trois femmes
  rationale: Le témoin fourni formule une équivalence énigmatique et potentiellement ambiguë ; la traduction ne doit pas la résoudre par conjecture.
- issue: Référent du pluriel après les trois noms divins
  choice: Maintenir « ils sont partout »
  alternative: Rapporter le pluriel au seul Saint-Esprit ou aux éléments du nom double
  rationale: Le pluriel du témoin peut renvoyer aux noms ou aux réalités précédemment citées. Le maintenir conserve cette tension grammaticale et théologique.
- issue: Action du même Esprit dans l’égarement, l’embrasement et l’extinction
  choice: Traduire littéralement les liens exprimés sans les harmoniser
  alternative: Distinguer plusieurs esprits ou expliquer l’Esprit comme agent de jugement
  rationale: Le passage présente une tension théologique réelle et un référent neutre indéterminé ; aucune résolution doctrinale n’est ajoutée.
- issue: Titre « votre Mère »
  choice: Conserver la majuscule et le titre sans identifier la Mère
  alternative: L’identifier à Marie, à la Sagesse ou au Saint-Esprit
  rationale: Le contexte fourni ne permet pas une identification certaine, et la majuscule signale la valeur particulière du titre sans la définir.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement est employé dans la parole adressée collectivement aux disciples, tandis que le tutoiement convient à l’échange individuel entre le Seigneur et un disciple. Les répétitions de « engendrer », « fils », « bouche » et « Sagesse » sont volontairement conservées. Projet provisoire fondé sur le témoin anglais public fourni ; la révision directe du copte du Codex II de Nag Hammadi reste nécessaire.
