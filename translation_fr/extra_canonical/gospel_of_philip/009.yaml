  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: fr
  text: 'Les enfants de l’être humain céleste sont plus nombreux que ceux de l’être humain terrestre. Si Adam a tant d’enfants, alors même qu’ils meurent, combien plus l’être humain parfait en a-t-il : ceux qui ne meurent pas, mais sont continuellement engendrés !


    Le père engendre un fils, mais il est impossible à un fils d’engendrer un fils, car celui qui a été engendré ne peut engendrer des fils. Le fils engendre des frères, non des fils. Tous ceux qui sont engendrés dans le monde le sont dans la chair, tandis que les autres, dans […] sont engendrés par lui […] là-bas, pour l’être humain […] dans le […] lieu céleste […] cela, de la bouche […] la Parole est sortie de là. Ils seraient nourris de la bouche [et] deviendraient parfaits.[a] Les parfaits sont conçus et engendrés par un baiser. C’est pourquoi, nous aussi, nous nous embrassons les uns les autres, concevant par la grâce qui demeure les uns dans les autres.


    Trois femmes accompagnaient constamment le Seigneur : Marie, sa mère, la sœur de celle-ci, et Madeleine, appelée sa compagne[b] ; car Marie est sa sœur, sa mère et sa compagne.


    « Le Père » et « le Fils » sont des noms simples ; « le Saint-Esprit » est un nom double.[c] En effet, ils sont partout : ils sont au ciel et en bas ; ils sont cachés et révélés. Le Saint-Esprit est révélé en bas et caché au ciel.


    Les puissances mauvaises sont mises au service de ceux qui sont saints, car le Saint-Esprit les a aveuglées : elles pensent servir un être humain ordinaire, alors qu’en réalité elles œuvrent pour les saints. Ainsi, un jour, un disciple interrogea le Seigneur au sujet d’une chose de ce monde. Il lui répondit : « Demande à ta Mère, et elle te donnera ce qui vient d’un autre. »


    Les apôtres dirent aux disciples : « Que toute notre offrande acquière du sel. » Ils appelaient […] « sel ». Sans lui, l’offrande ne [devient] pas acceptable. Mais la Sagesse [est] sans enfant ; c’est pourquoi [elle est] appelée […], ceci du sel, le lieu où ils […] à leur manière. Le Saint-Esprit […] […] beaucoup d’enfants.


    Ce qui appartient au père appartient au fils. Toutefois, tant que le fils est petit, ce qui lui appartient ne lui est pas confié. Lorsqu’il devient un homme, son père lui donne tout ce qui lui appartient.


    Ceux qui ont été engendrés par l’Esprit et qui s’égarent s’égarent aussi par lui. C’est pourquoi, par cet unique Esprit, cela s’embrase — c’est-à-dire le feu — et cela s’éteint.


    Échamoth est une chose, et Échmoth en est une autre. Échamoth est simplement la Sagesse, tandis qu’Échmoth est la Sagesse de la Mort, celle qui connaît la mort. Celle-ci est appelée « la petite Sagesse ».'
