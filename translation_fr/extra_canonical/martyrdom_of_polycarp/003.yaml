base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: fr
  text: 'Heureux et nobles sont donc tous les martyres qui ont eu lieu selon la volonté de Dieu — car il nous faut être très attentifs à reconnaître que Dieu exerce son pouvoir sur toutes choses.


    Qui, en effet, pourrait ne pas admirer leur noblesse, leur endurance patiente et leur fidélité au Maître ? Déchirés par les fouets au point que la structure de leur chair devenait visible jusqu’aux veines et aux artères profondes, ils ont enduré avec patience, si bien que les spectateurs eux-mêmes, pris de compassion, pleuraient. Mais eux ont fait preuve d’un tel courage qu’aucun n’a poussé un cri ni laissé échapper un gémissement. Ils nous montraient ainsi à tous qu’à cette heure-là, tandis qu’ils étaient torturés, les martyrs du Christ étaient comme absents de leur corps — ou plutôt que le Seigneur se tenait auprès d’eux et s’entretenait avec eux.


    Attentifs à la grâce du Christ, ils ont méprisé les tortures de ce monde : au prix d’une seule heure, ils se procuraient la délivrance du châtiment éternel. Le feu de leurs bourreaux inhumains leur paraissait froid, car ils gardaient devant les yeux la délivrance du feu éternel qui ne s’éteint jamais. Et, des yeux du cœur, ils contemplaient les biens réservés à ceux qui endurent avec patience : des biens que l’oreille n’a pas entendus, que l’œil n’a pas vus et qui ne sont pas montés au cœur humain[a], mais que le Seigneur leur montrait, car ils n’étaient déjà plus des êtres humains, mais des anges.


    De même, ceux qui avaient été condamnés aux bêtes sauvages ont enduré d’effroyables supplices : on les étendait sur des coquillages tranchants et on leur infligeait toutes sortes d’autres tortures. Par la prolongation du supplice, le diable cherchait ainsi, si possible, à les amener à renier leur foi ; car il déployait contre eux de nombreuses ruses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho à Ésaïe 64.3 et à 1 Corinthiens 2.9, avec un ordre des membres adapté dans ce récit.
    reason: Signaler l’allusion scripturaire manifeste sans interrompre le texte principal.
lexical_decisions:
- source_word: μαρτύρια (inferred from the Greek tradition; direct review pending)
  choice: martyres
  rationale: Le contexte désigne les souffrances et morts subies comme témoignage chrétien. « Martyres » conserve le sens historique de l’événement, tandis que « martyrs » désignerait les personnes.
- source_word: δεσπότης / Master (source wording to verify)
  choice: Maître
  rationale: Conserve le titre d’autorité et la relation de fidélité sans introduire un titre confessionnel plus spécifique.
- source_word: ὑπομονή / patient endurance (source wording to verify)
  choice: endurance patiente / endurer avec patience
  rationale: Rend à la fois la persévérance sous l’épreuve et la patience, motifs répétés dans le passage.
- source_word: οἰκονομία τῆς σαρκός / mechanism of their flesh (source wording to verify)
  choice: structure de leur chair
  rationale: « Mécanisme de la chair » serait artificiel en français. « Structure » conserve l’image anatomique sans atténuer la violence.
- source_word: ἀπαρνεῖσθαι / denial (source wording to verify)
  choice: renier leur foi
  rationale: Le complément explicite naturellement en français ce que signifie ici le reniement, sans préciser indûment une formule ou une personne reniée.
theological_decisions:
- issue: Volonté et souveraineté divines dans le martyre
  choice: « selon la volonté de Dieu » et « reconnaître que Dieu exerce son pouvoir sur toutes choses »
  alternative: « attribuer toutes choses à la puissance de Dieu »
  rationale: La formulation maintient ensemble la volonté divine et son autorité universelle, sans affirmer plus précisément que Dieu cause directement chaque torture.
- issue: Rapport des martyrs à leur corps pendant la torture
  choice: « étaient comme absents de leur corps — ou plutôt… »
  alternative: « étaient absents de la chair » au sens strict
  rationale: '« Comme » signale le caractère phénoménologique ou rhétorique de l’expression, tandis que « ou plutôt » préserve la correction théologique du texte : la présence du Seigneur explique leur endurance.'
- issue: « Se procurer » la délivrance du châtiment éternel
  choice: 'conserver l’image transactionnelle : « au prix d’une seule heure, ils se procuraient »'
  alternative: « une seule heure leur valait la délivrance »
  rationale: Le témoin emploie explicitement une métaphore d’achat. Elle est conservée sans en tirer une doctrine méritoire systématique.
- issue: Transformation en anges
  choice: « ils n’étaient déjà plus des êtres humains, mais des anges »
  alternative: « ils étaient pour ainsi dire devenus des anges »
  rationale: La force rhétorique de l’affirmation est préservée sans l’expliquer ou la réduire à une comparaison doctrinale.
- issue: Action du diable et possibilité du reniement
  choice: « cherchait ainsi, si possible, à les amener »
  alternative: « voulait les contraindre »
  rationale: Conserve la réserve « si possible » et l’intention de l’adversaire, sans suggérer que la persévérance des martyrs était mécaniquement garantie.
translation_notes:
  register: Français international moderne, digne et narratif. Les images violentes et les tensions théologiques du témoin ont été conservées. La répétition d’« endurer avec patience » reste volontaire, car elle structure le portrait des martyrs. Faute de texte grec fourni et puisque la révision directe de la langue source est indiquée comme en attente, ce projet demeure fondé sur le témoin anglais public avec décisions grecques expressément signalées comme provisoires.
