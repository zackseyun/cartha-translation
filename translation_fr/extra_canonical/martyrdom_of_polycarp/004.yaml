  naturalness: Le français est globalement clair et digne. « Il usa de force pour attirer » est remplacé par « il attira de force », plus direct. La description finale est rendue plus idiomatiquement sans ajouter le démonstratif « ce ».
  terminology: « Dieu », « aimé de Dieu », « craignant Dieu », « athées » et « Polycarpe » sont appropriés. « Athées » est maintenu au sens polémique antique, avec une note historique sobre.
