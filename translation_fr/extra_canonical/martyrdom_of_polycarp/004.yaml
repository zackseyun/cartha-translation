base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: fr
  text: 'Mais grâce soit rendue à Dieu, car c’est lui qui a véritablement triomphé de tous. Le très noble Germanicus, par la fermeté qui l’animait, donna du courage à ceux qui étaient saisis de crainte, et il combattit les bêtes sauvages d’une manière remarquable. Lorsque le proconsul chercha à le persuader et l’exhorta à avoir pitié de sa jeunesse, il attira de force la bête sauvage vers lui, désirant être délivré plus rapidement de leur vie injuste et sans loi.[a]


    Après cela, toute la foule, admirant le courage du peuple des chrétiens aimé de Dieu et craignant Dieu, se mit à crier : « À bas les athées ! Qu’on recherche Polycarpe ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « leur » est incertain. La traduction conserve donc le pronom sans identifier davantage les personnes visées.
    reason: Préserver une ambiguïté textuelle sans imposer une interprétation.
  - marker: b
    text: Dans le monde romain, les chrétiens pouvaient être traités d’« athées » parce qu’ils refusaient d’adorer les dieux reconnus par la cité et l’Empire.
    reason: Éclairer le sens historique paradoxal du cri de la foule.
lexical_decisions:
- source_word: prevailed against all
  choice: triompha véritablement de tous
  rationale: Conserve l’idée forte de victoire exprimée par le témoin anglais, sans préciser artificiellement l’identité exacte de ceux sur qui porte « tous ».
- source_word: right noble Germanicus
  choice: le très noble Germanicus
  rationale: Rend l’éloge honorifique dans un français digne et naturel.
- source_word: encouraged their timorousness
  choice: donna du courage à ceux qui étaient saisis de crainte
  rationale: 'Évite le calque maladroit « encouragea leur crainte » et restitue le sens apparent : sa fermeté fortifia les autres chrétiens apeurés.'
- source_word: constancy
  choice: fermeté
  rationale: Terme courant qui exprime la résolution et l’endurance sans surcharger le texte d’une nuance doctrinale.
- source_word: dragged the wild beast towards him
  choice: attirer la bête sauvage vers lui
  rationale: « Attirer » exprime un geste volontaire dirigé vers soi ; « usa de force » conserve séparément la violence du mouvement attestée par le témoin.
- source_word: release
  choice: être délivré
  rationale: Préserve l’euphémisme de la mort comme libération sans expliciter davantage que la source.
- source_word: Away with the atheists
  choice: À bas les athées !
  rationale: Formule de foule vive et idiomatique ; l’accusation antique d’athéisme est maintenue telle quelle.
- source_word: let search be made for Polycarp
  choice: Qu’on recherche Polycarpe !
  rationale: Rend naturellement l’ordre collectif sans préciser si la recherche implique déjà l’arrestation.
theological_decisions:
- issue: Référent du pronom dans « he truly prevailed against all »
  choice: « il triompha véritablement de tous », avec un pronom non explicité
  alternative: « Dieu triompha véritablement de tous » ou « Germanicus triompha de tous »
  rationale: Le témoin fourni laisse une transition pronominale susceptible d’ambiguïté ; faute de vérification directe du grec, la traduction ne tranche pas silencieusement.
- issue: « their unrighteous and lawless life »
  choice: « leur vie injuste et sans loi »
  alternative: « cette vie injuste et sans loi » ou « la vie injuste et impie de ces gens »
  rationale: Conserve le pronom pluriel du témoin et la tension de son référent, sans transformer le passage en affirmation générale sur la vie terrestre ni identifier arbitrairement les personnes visées.
- issue: Les chrétiens appelés « athées »
  choice: maintien littéral de « athées »
  alternative: « impies » ou une paraphrase explicative dans le corps du texte
  rationale: 'Le paradoxe historique et polémique est important : les chrétiens étaient accusés d’athéisme parce qu’ils rejetaient les dieux civiques. Une note fournit le contexte sans affaiblir le cri.'
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement fluidifiées tout en conservant les répétitions et les tensions du témoin. Projet provisoire fondé sur la traduction anglaise publique fournie ; la révision directe du grec demeure requise.
