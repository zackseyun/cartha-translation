revisions:
- from: 'Mais grâce soit rendue à Dieu, car il triompha véritablement de tous. Le très noble Germanicus, par la fermeté qui l’animait, donna du courage à ceux qui étaient saisis de crainte, et il affronta les bêtes sauvages d’une manière remarquable. Lorsque le proconsul voulut le faire céder et lui ordonna d’avoir pitié de sa jeunesse, il usa de force pour attirer la bête sauvage vers lui, désirant être délivré plus rapidement de leur vie injuste et sans loi.[a]


    Après cela, toute la foule, émerveillée du courage de ce peuple de chrétiens aimé de Dieu et qui craint Dieu, se mit à crier : « À bas les athées ! Qu’on recherche Polycarpe ! »[b]'
  to: 'Mais grâce soit rendue à Dieu, car c’est lui qui a véritablement triomphé de tous. Le très noble Germanicus, par la fermeté qui l’animait, donna du courage à ceux qui étaient saisis de crainte, et il combattit les bêtes sauvages d’une manière remarquable. Lorsque le proconsul chercha à le persuader et l’exhorta à avoir pitié de sa jeunesse, il attira de force la bête sauvage vers lui, désirant être délivré plus rapidement de leur vie injuste et sans loi.[a]


