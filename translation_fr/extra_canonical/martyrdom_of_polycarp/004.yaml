    rationale: Le témoignage anglais dit « wished to prevail upon him » et « bade him » ; la formulation correspond à une tentative de persuasion/exhortation, non nécessairement à un ordre ni à une contrainte visant à le faire céder.
  - severity: medium
    issue: La documentation de décision présente le référent de « il triompha » comme susceptible d’ambiguïté.
    rationale: Dans le texte, ce pronom renvoie à Dieu (« grâce soit rendue à Dieu, car il... »), ce que confirme la syntaxe de la tradition grecque. Le texte français le rend explicitement pour éviter une ambiguïté artificielle.
  - severity: low
