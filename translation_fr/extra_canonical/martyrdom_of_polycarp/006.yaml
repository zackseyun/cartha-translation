    And while praying he falleth into a trance three days before his apprehension; and he saw his pillow burning with fire. And he turned and said unto those that were with him: ''It must needs be that I shall be burned alive.'''
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: fr
  text: 'Quand le glorieux Polycarpe apprit cela, il ne fut nullement effrayé et voulut rester en ville. Mais la plupart le persuadèrent de se retirer. Il se retira donc dans une ferme située non loin de la ville. Là, il demeura avec quelques compagnons, ne faisant rien d’autre, nuit et jour, que de prier pour tous les êtres humains et pour les Églises du monde entier ; c’était là son habitude constante.


    Trois jours avant son arrestation, pendant qu’il priait, il vit en vision son oreiller en feu. Se tournant vers ceux qui étaient avec lui, il leur dit : « Il faut que je sois brûlé vif. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir d’un ancien témoin anglais du texte grec. Une vérification directe du grec reste nécessaire, notamment pour la formulation de l’expérience visionnaire et pour la nuance de nécessité dans « Il faut que ».
    reason: La documentation de travail indique que le contrôle direct du grec reste à compléter; la note conserve cette transparence sans présenter la vision comme une « transe » au sens psychologique.
lexical_decisions:
- source_word: the glorious Polycarp
  choice: le glorieux Polycarpe
  rationale: Conserve le qualificatif honorifique transmis par le témoin, dans un français digne et naturel.
- source_word: the greater part
  choice: la plupart de ses compagnons
  rationale: Le contexte indique vraisemblablement la majorité de son entourage; « ses compagnons » explicite légèrement le référent implicite sans identifier un groupe plus précis.
- source_word: farm
  choice: ferme
  rationale: Équivalent courant du lieu rural où Polycarpe se retire; évite le terme plus vaste et potentiellement ambigu « domaine ».
- source_word: all men
  choice: tous les êtres humains
  rationale: Exprime la portée universelle sans employer le masculin générique « tous les hommes ».
- source_word: falleth into a trance
  choice: il eut une vision
  rationale: Le récit met l’accent sur ce qui lui est montré; « vision » est clair en français moderne, tandis que « transe » pourrait suggérer un état psychologique particulier non assuré par ce témoin indirect.
- source_word: apprehension
  choice: arrestation
  rationale: Terme moderne et précis pour la capture officielle de Polycarpe.
- source_word: It must needs be
  choice: Il faut que
  rationale: Reproduit la nécessité exprimée sans en préciser la nature — divine, prophétique ou circonstancielle.
theological_decisions:
- issue: Nature de la nécessité annoncée par Polycarpe
  choice: « Il faut que je sois brûlé vif »
  alternative: « Je dois être brûlé vif »
  rationale: « Il faut que » maintient la force de nécessité ou de destinée sans expliquer explicitement qu’elle relève d’un décret divin.
- issue: Statut de l’expérience pendant la prière
  choice: « il eut une vision »
  alternative: « il tomba en extase »
  rationale: Le témoin anglais parle d’une transe, mais l’absence de vérification grecque recommande de ne pas imposer une catégorie mystique ou psychologique trop précise; la note signale cette limite.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures archaïques du témoin anglais ont été modernisées. Le rythme reste sobre et proche de la progression du récit. « Églises » prend une majuscule pour désigner les communautés chrétiennes locales dans leur ensemble.
