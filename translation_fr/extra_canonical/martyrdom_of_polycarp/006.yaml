revisions:
- from: 'Quand le glorieux Polycarpe apprit cela, il ne fut nullement effrayé et voulut rester en ville. Mais la plupart de ses compagnons le persuadèrent de se retirer. Il se retira donc dans une ferme située non loin de la ville. Là, il demeura avec quelques compagnons, ne faisant rien d’autre, nuit et jour, que de prier pour tous les êtres humains et pour les Églises du monde entier, comme il en avait constamment l’habitude.


    Trois jours avant son arrestation, pendant qu’il priait, il eut une vision : il vit son oreiller brûler dans les flammes. Se tournant vers ceux qui étaient avec lui, il leur dit : « Il faut que je sois brûlé vif. »[a]'
  to: 'Quand le glorieux Polycarpe apprit cela, il ne fut nullement effrayé et voulut rester en ville. Mais la plupart le persuadèrent de se retirer. Il se retira donc dans une ferme située non loin de la ville. Là, il demeura avec quelques compagnons, ne faisant rien d’autre, nuit et jour, que de prier pour tous les êtres humains et pour les Églises du monde entier ; c’était là son habitude constante.


    Trois jours avant son arrestation, pendant qu’il priait, il vit en vision son oreiller en feu. Se tournant vers ceux qui étaient avec lui, il leur dit : « Il faut que je sois brûlé vif. »[a]'
  rationale: La révision retire l’explicitation non justifiée de « ses compagnons », resserre l’image de l’oreiller en feu et rend l’expérience visionnaire de façon plus proche et moins interprétative. Elle conserve la structure, le registre et l’ambiguïté de la nécessité annoncée.
