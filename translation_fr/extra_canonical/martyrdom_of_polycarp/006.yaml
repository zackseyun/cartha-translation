  source_fidelity: La mention « ses compagnons » après « la plupart » ajoute un référent que le texte ne précise pas. Le grec traditionnel de ce passage emploie un terme de vision/apparition plutôt qu’une catégorie psychologique déterminée; « il eut une vision » reste possible, mais « il vit en vision » rend plus directement l’expérience relatée. « Son oreiller brûler dans les flammes » alourdit et amplifie légèrement l’image; le texte décrit l’oreiller qui brûle de feu.
  naturalness: Le français est globalement clair et de registre approprié. « La plupart le persuadèrent » est plus fidèle et plus sobre. « Il vit en vision son oreiller en feu » est naturel tout en conservant la concision narrative.
  terminology: « Églises » convient pour les communautés chrétiennes. « Brûlé vif » transmet exactement le sens de la mort par le feu. La nécessité de « Il faut que » demeure non interprétée.
