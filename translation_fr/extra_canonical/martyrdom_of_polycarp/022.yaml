base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: fr
  text: Le bienheureux Polycarpe subit le martyre le deuxième jour du premier mois, Xanthique, le septième jour avant les calendes de mars[a], lors d’un grand sabbat[b], à la huitième heure[c]. Il fut arrêté par Hérode, alors que Philippe de Tralles était grand prêtre, durant le proconsulat de Statius Quadratus, mais sous le règne du Roi éternel, Jésus-Christ. À lui soient la gloire, l’honneur, la grandeur et le trône éternel, de génération en génération. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les calendes de mars correspondaient au 1er mars ; selon la manière romaine de compter inclusivement, le septième jour avant les calendes correspond au 23 février.
    reason: Éclaire le repère calendaire romain tout en conservant le terme ancien dans le texte.
  - marker: b
    text: L’expression ancienne « un grand sabbat » est conservée telle quelle ; son sens précis dans ce contexte demeure incertain.
    reason: Préserve l’ambiguïté du témoin au lieu de l’harmoniser avec une fête ou un jour moderne précis.
  - marker: c
    text: Dans le décompte antique des heures à partir du lever du soleil, la huitième heure se situait approximativement au début de l’après-midi.
    reason: Aide le lecteur moderne sans imposer une heure exacte, qui variait selon la saison.
lexical_decisions:
- source_word: Xanthicus
  choice: Xanthique
  rationale: Conserve sous une forme française le nom ancien du mois macédonien, sans l’assimiler à un mois moderne.
- source_word: was martyred
  choice: subit le martyre
  rationale: Expression française naturelle et digne qui garde le sens de mise à mort en qualité de témoin.
- source_word: was apprehended
  choice: fut arrêté
  rationale: Rend clairement l’acte d’arrestation dans un français moderne.
- source_word: high priest
  choice: grand prêtre
  rationale: Équivalent formel usuel, sans préciser davantage la fonction cultuelle ou civique de Philippe.
- source_word: proconsulship
  choice: était proconsul
  rationale: Tour français fluide qui conserve le repère administratif romain.
- source_word: eternal throne
  choice: trône éternel
  rationale: Maintient l’image royale et la portée doxologique du témoin.
theological_decisions:
- issue: Contraste entre l’autorité romaine et le règne du Christ
  choice: « alors que… était proconsul, mais sous le règne du Roi éternel »
  alternative: « durant le proconsulat de…, mais durant le règne… »
  rationale: 'Le contraste introduit par « mais » est conservé : l’autorité politique date l’événement, tandis que la royauté éternelle du Christ reçoit la prééminence.'
- issue: Référent de la doxologie
  choice: « À lui soient… » renvoie à Jésus-Christ
  alternative: Rendre la formule de manière impersonnelle
  rationale: Le référent grammatical immédiat est Jésus-Christ; la traduction garde cette attribution sans ajouter de formulation trinitaire absente du témoin fourni.
- issue: Titre « Roi éternel »
  choice: Majuscule à « Roi »
  alternative: « roi éternel »
  rationale: La majuscule signale ici un titre christologique dans une prose française religieuse, sans modifier le contenu.
translation_notes:
  register: Français international moderne, digne et lisible. Les repères calendaires anciens sont conservés et expliqués en notes. Le texte reste provisoire, car le dossier fourni indique qu’une vérification directe du grec est encore nécessaire; la formulation suit donc prudemment le témoin anglais public fourni.
