revisions:
- from: Le bienheureux Polycarpe subit le martyre le deuxième jour de la première partie du mois de Xanthique, le septième jour avant les calendes de mars[a], un grand sabbat[b], à la huitième heure[c]. Il fut arrêté par Hérode, alors que Philippe de Tralles était grand prêtre et que Statius Quadratus était proconsul, mais sous le règne du Roi éternel, Jésus-Christ. À lui soient la gloire, l’honneur, la grandeur et le trône éternel, de génération en génération. Amen.
  to: Le bienheureux Polycarpe subit le martyre le deuxième jour du premier mois, Xanthique, le septième jour avant les calendes de mars[a], lors d’un grand sabbat[b], à la huitième heure[c]. Il fut arrêté par Hérode, alors que Philippe de Tralles était grand prêtre, durant le proconsulat de Statius Quadratus, mais sous le règne du Roi éternel, Jésus-Christ. À lui soient la gloire, l’honneur, la grandeur et le trône éternel, de génération en génération. Amen.
