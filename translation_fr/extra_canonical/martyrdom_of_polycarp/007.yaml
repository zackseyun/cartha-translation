revisions:
- from: 'Ceux qui le recherchaient ne relâchant pas leurs efforts, il partit pour une autre ferme. Mais ils y arrivèrent aussitôt. Ne le trouvant pas, ils saisirent deux jeunes esclaves, et l’un d’eux avoua sous la torture.


    Il était en effet impossible que Polycarpe demeure caché, puisque ceux-là mêmes qui le trahirent faisaient partie de sa maison. Le chef de la police, qui portait justement le nom d’Hérode, tenait à le conduire au stade. Ainsi, Polycarpe accomplirait le sort qui lui était destiné en partageant celui du Christ, tandis que ses traîtres subiraient le châtiment de Judas lui-même.'
  to: 'Comme ceux qui le recherchaient persistaient, il se retira dans un autre domaine rural. Ceux qui le recherchaient y arrivèrent aussitôt ; ne l’ayant pas trouvé, ils saisirent deux jeunes esclaves, dont l’un avoua sous la torture.


    Il était en effet impossible qu’il reste caché, puisque ceux-là mêmes qui le trahissaient étaient des gens de sa propre maisonnée. Le chef de la police, qui s’appelait justement Hérode, était désireux de le conduire au stade, afin qu’il accomplisse le sort qui lui était destiné, en devenant participant avec le Christ, tandis que ceux qui l’avaient trahi subiraient le châtiment de Judas lui-même.'
  rationale: 'Révision limitée aux points où le texte français risquait de modifier la relation exprimée par le source : le but de l’arrestation est rétabli et κοινωνὸς γενόμενος τῷ Χριστῷ est rendu directement. Les autres ajustements améliorent la fluidité tout en conservant le statut servile, la portée domestique de la trahison et l’ambiguïté non explicitée du « lot » assigné.'
