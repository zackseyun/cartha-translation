review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement la progression du témoin anglais et l’essentiel du grec traditionnel : recherche persistante, déplacement vers un autre domaine, arrestation de deux jeunes esclaves, aveu sous torture, trahison venue de la maisonnée, et intervention d’Hérode. Une correction est toutefois nécessaire à la fin : « en partageant celui du Christ » rattache la participation au « sort » et transforme « devenant participant avec le Christ » en partage d’un même sort. Le grec κοινωνὸς γενόμενος τῷ Χριστῷ exprime plus directement le fait de devenir participant/associé au Christ.'
  naturalness: Le français est globalement clair et d’un registre narratif approprié. « Ne relâchant pas leurs efforts » est un peu plus explicatif que nécessaire, et « Ainsi » affaiblit la relation de but portée par « afin que ». Une formulation plus directe est à la fois naturelle et plus proche de la syntaxe source.
  terminology: « jeunes esclaves », « maisonnée », « chef de la police », « stade », « sort qui lui était destiné » et « châtiment de Judas lui-même » conviennent. « Maisonnée » rend plus naturellement οἰκεῖοι que « faisaient partie de sa maison », tout en évitant de limiter le groupe aux parents. « participant avec le Christ » conserve le terme relationnel sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: La participation de Polycarpe au Christ est rendue comme un partage du sort du Christ.
    rationale: « en partageant celui du Christ » fait de « celui » le sort du Christ et ne rend pas explicitement le mouvement « devenant participant avec le Christ » (κοινωνὸς γενόμενος τῷ Χριστῷ). Il faut préserver cette formulation relationnelle, sans la réduire à une identité de destin.
  - severity: low
    issue: La relation finale de but est rendue par « Ainsi ».
    rationale: 'Le texte introduit le dessein d’Hérode : il était désireux de l’amener au stade afin que Polycarpe accomplisse son lot. « Afin que » rend cette relation avec plus de précision.'
