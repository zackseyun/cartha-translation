base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young servants, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: fr
  text: 'Comme ceux qui le recherchaient persistaient, il se retira dans un autre domaine rural. Ceux qui le recherchaient y arrivèrent aussitôt ; ne l’ayant pas trouvé, ils saisirent deux jeunes esclaves, dont l’un avoua sous la torture.


    Il était en effet impossible qu’il reste caché, puisque ceux-là mêmes qui le trahissaient étaient des gens de sa propre maisonnée. Le chef de la police, qui s’appelait justement Hérode, était désireux de le conduire au stade, afin qu’il accomplisse le sort qui lui était destiné, en devenant participant avec le Christ, tandis que ceux qui l’avaient trahi subiraient le châtiment de Judas lui-même.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: farm
  choice: ferme
  rationale: Rend simplement le domaine rural évoqué par le témoin anglais, sans préciser indûment sa nature.
- source_word: two slave lads
  choice: deux jeunes esclaves
  rationale: Conserve explicitement le statut servile et l’indication d’âge, contrairement à « jeunes serviteurs », qui pourrait atténuer la réalité sociale du texte.
- source_word: people of his own household
  choice: faisaient partie de sa maison
  rationale: « Maison » garde le sens ancien et large du groupe domestique, sans imposer qu’il s’agisse de parents.
- source_word: captain of the police
  choice: chef de la police
  rationale: Expression moderne et claire pour le responsable des agents chargés de l’arrestation, sans lui attribuer un grade français précis.
- source_word: stadium
  choice: stade
  rationale: Préserve le lieu public antique où doit se dérouler le supplice.
- source_word: appointed lot
  choice: le sort qui lui était destiné
  rationale: Conserve l’image du lot assigné et sa nuance providentielle sans en expliciter davantage l’agent.
- source_word: partaker with Christ
  choice: en partageant celui du Christ
  rationale: Formulation naturelle qui maintient l’idée de participation au sort ou aux souffrances du Christ.
theological_decisions:
- issue: Participation de Polycarpe au Christ
  choice: en partageant celui du Christ
  alternative: en devenant participant avec le Christ
  rationale: Le choix français relie naturellement « celui » au sort destiné, tout en maintenant la solidarité théologique entre le martyr et le Christ sans suggérer leur identité.
- issue: Punition des traîtres comparable à celle de Judas
  choice: le châtiment de Judas lui-même
  alternative: un châtiment semblable à celui de Judas
  rationale: La formulation conserve la force et l’ambiguïté du témoin, qui parle du châtiment de Judas lui-même plutôt que d’une simple ressemblance explicitée.
- issue: Dimension providentielle du sort assigné
  choice: le sort qui lui était destiné
  alternative: le sort que Dieu lui avait fixé
  rationale: Le texte laisse l’agent implicite; la traduction évite d’ajouter explicitement Dieu tout en gardant la nuance de destinée.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions lourdes ont été légèrement allégées, tandis que les contrastes entre Polycarpe, le Christ, les traîtres et Judas sont conservés. Le nom de Polycarpe est répété dans le second paragraphe afin de lever deux ambiguïtés pronominales que le français rendrait autrement gênantes.
