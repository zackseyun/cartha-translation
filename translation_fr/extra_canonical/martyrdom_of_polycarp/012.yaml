base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: fr
  text: 'Alors le proconsul dit : « J’ai ici des bêtes sauvages, et je te livrerai à elles si tu ne te repens pas. » Polycarpe répondit : « Fais-les venir ! Car il ne nous est pas permis de changer en passant du meilleur au pire ; mais il est noble de changer pour passer du mal à la justice. »


    Le proconsul lui dit encore : « Puisque tu méprises les bêtes sauvages, je te ferai dévorer par le feu si tu ne te repens pas. » Mais Polycarpe répondit : « Tu me menaces d’un feu qui brûle un temps et s’éteint peu après, car tu ignores le feu du jugement à venir et du châtiment éternel réservé aux impies. Mais pourquoi tardes-tu ? Viens, fais ce que tu veux. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après un témoin anglais du domaine public ; la vérification directe du texte grec reste à effectuer.
    reason: La donnée fournie précise que l’examen de la tradition manuscrite grecque est encore en attente ; la note rend cette limite documentaire transparente.
lexical_decisions:
- source_word: repent
  choice: se repentir
  rationale: 'Conserve le vocabulaire de la repentance ainsi que son emploi ironique : le proconsul exige une rétractation, tandis que Polycarpe redéfinit le vrai changement comme le passage du mal à la justice.'
- source_word: untowardness
  choice: le mal
  rationale: Rend en français courant et digne l’idée de conduite mauvaise ou perverse, sans lui donner une précision absente du témoin fourni.
- source_word: righteousness
  choice: la justice
  rationale: Préserve la portée morale et théologique du terme, plutôt que de la réduire à la seule bonne conduite.
- source_word: ungodly
  choice: les impies
  rationale: Terme français établi qui exprime l’opposition à Dieu visée par le témoin anglais.
theological_decisions:
- issue: Nature du changement refusé puis approuvé
  choice: Maintenir le contraste entre le passage « du meilleur au pire » et celui « du mal à la justice »
  alternative: Paraphraser comme un simple refus de renier la foi
  rationale: Le texte construit un paradoxe autour de la repentance et du changement ; l’expliciter davantage supprimerait sa tension rhétorique.
- issue: Feu du jugement et châtiment éternel
  choice: Conserver les deux expressions coordonnées sans préciser leur relation
  alternative: Les fusionner en « feu éternel du jugement »
  rationale: Le témoin distingue le feu du jugement à venir et le châtiment éternel ; la traduction ne doit pas résoudre leur rapport.
translation_notes:
  register: Français international moderne, sobre et digne. Tutoiement conservé pour refléter l’adresse directe antique et la fermeté de l’échange. Ponctuation et syntaxe modernisées sans atténuer le contraste rhétorique ni les affirmations sur le jugement.
