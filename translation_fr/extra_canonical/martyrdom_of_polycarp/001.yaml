base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: fr
  text: 'L’Église de Dieu qui séjourne à Smyrne, à l’Église de Dieu qui séjourne à Philomélium, ainsi qu’à toutes les communautés de frères et sœurs de l’Église sainte et universelle qui séjourne en tout lieu : que la miséricorde, la paix et l’amour venant de Dieu le Père et de notre Seigneur Jésus-Christ vous soient accordés en abondance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sojourneth
  choice: séjourne
  rationale: Conserve l’image ancienne d’une résidence provisoire et l’identité pèlerine de l’Église sans développer explicitement « comme des étrangers », nuance qui devra être vérifiée directement sur le grec.
- source_word: brotherhoods
  choice: communautés de frères et sœurs
  rationale: Exprime en français naturel des collectivités fraternelles comprenant l’ensemble des croyants, plutôt que le seul genre masculin.
- source_word: universal
  choice: universelle
  rationale: Rend le sens ordinaire de l’universalité de l’Église sans employer « catholique », qui risquerait d’être compris d’abord comme une désignation confessionnelle moderne.
- source_word: be multiplied
  choice: vous soient accordés en abondance
  rationale: Reproduit naturellement en français la formule de bénédiction exprimant une multiplication abondante.
theological_decisions:
- issue: Caractère pèlerin de l’Église
  choice: qui séjourne
  alternative: qui vit comme étrangère
  rationale: La formulation retenue préserve l’idée de résidence temporaire tout en évitant de préciser davantage que ne le permet le témoin anglais fourni avant révision du grec.
- issue: Désignation de l’Église entière
  choice: Église sainte et universelle
  alternative: sainte Église catholique
  rationale: « Universelle » maintient ici la portée translocale sans importer les connotations institutionnelles contemporaines de « catholique ».
- issue: Source de la bénédiction
  choice: venant de Dieu le Père et de notre Seigneur Jésus-Christ
  alternative: de la part de Dieu le Père et de notre Seigneur Jésus-Christ
  rationale: Conserve la coordination du Père et de Jésus-Christ comme source commune de la miséricorde, de la paix et de l’amour, sans explicitation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du ton épistolaire ancien. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque reste nécessaire.
