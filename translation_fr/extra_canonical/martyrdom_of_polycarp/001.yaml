review_pass:
  verdict: revise
  source_fidelity: 'La formule d’adresse et la bénédiction sont globalement fidèles au témoin anglais fourni. Toutefois, « communautés de frères et sœurs » ne correspond pas de façon sûre à la désignation collective visée : la tradition grecque connue emploie probablement le vocabulaire de la παροικία, c’est-à-dire des communautés ecclésiales résidentes/en pèlerinage, et non une expression explicitement genrée. « Universelle » rend correctement le sens de καθολική sans imposer une lecture confessionnelle moderne.'
  naturalness: Le français est fluide, solennel et adapté à une salutation épistolaire ancienne. La construction « à l’Église ... ainsi qu’à toutes les communautés » est claire. « Vous soient accordés en abondance » est une formulation française naturelle de la bénédiction « be multiplied », même si elle est moins littérale.
  terminology: « Église », « séjourne », « sainte et universelle », « Dieu le Père » et « notre Seigneur Jésus-Christ » sont appropriés. Il convient de remplacer « communautés de frères et sœurs » par « communautés de la sainte Église universelle » afin de ne pas ajouter une explicitation absente ou incertaine dans la source.
  issues:
  - severity: medium
    issue: « communautés de frères et sœurs » ajoute une caractérisation qui n’est pas assurée par le témoin et risque de méconnaître le terme grec traditionnellement compris comme « communautés ecclésiales » / « paroisses ».
    rationale: Le texte doit conserver la portée collective et pèlerine de la désignation sans transformer celle-ci en une formule inclusive développée. « Communautés » est naturel et suffisamment précis en français moderne.
  revised_text: 'L’Église de Dieu qui séjourne à Smyrne, à l’Église de Dieu qui séjourne à Philomélium, ainsi qu’à toutes les communautés de la sainte Église universelle qui séjournent en tout lieu : que la miséricorde, la paix et l’amour venant de Dieu le Père et de notre Seigneur Jésus-Christ vous soient accordés en abondance.'
  revised_footnotes: []
  revision_rationale: 'La révision se limite à supprimer l’ajout interprétatif « de frères et sœurs » et à rendre la désignation des groupes destinataires par « communautés », qui préserve mieux l’ambiguïté et le probable arrière-plan grec. Le reste du texte est conservé : « séjourne » maintient l’image de résidence provisoire, et « universelle » rend le sens de « catholic » dans son emploi ancien sans connotation confessionnelle imposée.'
