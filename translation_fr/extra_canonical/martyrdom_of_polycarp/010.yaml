- from: 'Au moment où Polycarpe entrait dans le stade, une voix lui vint du ciel : « Sois fort, Polycarpe, et montre-toi courageux. » Personne ne vit celui qui parlait, mais ceux des nôtres qui étaient présents entendirent la voix. Enfin, lorsqu’on le fit entrer, un grand tumulte s’éleva, car la foule avait appris que Polycarpe avait été arrêté.


    Quand il fut amené devant lui, le proconsul lui demanda s’il était bien Polycarpe. Comme il le reconnaissait, le proconsul chercha à le persuader de renier sa foi en lui disant : « Aie égard à ton âge », ainsi que d’autres paroles de ce genre qu’ils ont coutume de prononcer : « Jure par le génie de César[a] ; repens-toi et dis : “À bas les athées !” » Alors Polycarpe, le visage grave, regarda toute la foule des païens impies qui se trouvait dans le stade et fit un geste de la main dans leur direction. Puis, en gémissant et en levant les yeux vers le ciel, il dit : « À bas les athées ! »


    Mais le magistrat insista vivement : « Prête serment, et je te relâcherai. Insulte le Christ. » Polycarpe répondit : « Voilà quatre-vingt-six ans que je le sers, et il ne m’a fait aucun tort. Comment pourrais-je donc blasphémer mon Roi, celui qui m’a sauvé ? »


    [a] Le « génie de César » était, dans la religion romaine, l’esprit protecteur associé à l’empereur.'
