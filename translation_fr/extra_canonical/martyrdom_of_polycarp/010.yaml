  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: fr
  text: 'Au moment où Polycarpe entrait dans le stade, une voix lui vint du ciel : « Sois fort, Polycarpe, et montre-toi courageux. » Personne ne vit celui qui parlait, mais ceux des nôtres qui étaient présents entendirent la voix. Enfin, lorsqu’on le fit entrer, un grand tumulte s’éleva, car on avait appris que Polycarpe avait été arrêté.


    Quand il fut amené devant lui, le proconsul lui demanda si c’était bien lui. Comme il le reconnaissait, le proconsul chercha à le persuader de se rétracter en lui disant : « Aie égard à ton âge », ainsi que d’autres paroles de ce genre qu’ils ont coutume de prononcer : « Jure par la fortune de César[a] ; repens-toi et dis : “À bas les athées !” » Alors Polycarpe, le visage grave, regarda toute la foule des païens sans loi qui se trouvait dans le stade et fit un geste de la main dans leur direction. Puis, en gémissant et en levant les yeux vers le ciel, il dit : « À bas les athées ! »


    Mais le proconsul insista vivement : « Prête serment, et je te relâcherai. Insulte le Christ. » Polycarpe répondit : « Voilà quatre-vingt-six ans que je le sers, et il ne m’a fait aucun tort. Comment pourrais-je donc blasphémer mon Roi qui m’a sauvé ? »


    [a] La « fortune de César » renvoie à la Fortune (latin Fortuna ; grec τύχη), puissance ou faveur divine associée à l’empereur dans le cadre religieux romain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « fortune de César » renvoie à la Fortune (latin Fortuna ; grec τύχη), puissance ou faveur divine associée à l’empereur dans le cadre religieux romain.
    reason: Le terme « fortune » pourrait être compris au sens moderne de richesse ou de hasard ; la note explicite son sens religieux antique et corrige la confusion avec le « génie » de César.
lexical_decisions:
- source_word: ἀνδρίζου
  choice: montre-toi courageux
  rationale: Rend l’exhortation à faire preuve de courage sans reprendre littéralement l’expression genrée et archaïque « agis en homme ».
- source_word: τύχη Καίσαρος
  choice: génie de César
  rationale: Le témoin anglais porte « genius of Caesar » ; ce terme historique désigne l’esprit protecteur de l’empereur et est explicité en note. La vérification directe du grec reste à faire, certaines traditions ou éditions pouvant employer une formulation liée à la fortune de César.
- source_word: ἄθεοι
  choice: athées
  rationale: Conserve l’accusation antique portée contre les chrétiens qui refusaient les dieux civiques, ainsi que le retournement ironique de Polycarpe contre la foule.
- source_word: λοιδορήσον τὸν Χριστόν
  choice: Insulte le Christ
  rationale: « Insulter » exprime naturellement l’ordre de parler outrageusement contre le Christ ; « blasphémer » est réservé à la réponse de Polycarpe.
- source_word: σῴσαντά με
  choice: celui qui m’a sauvé
  rationale: Préserve le sens personnel et sotériologique du participe grec rapporté par la tradition.
theological_decisions:
- issue: Objet implicite du reniement demandé
  choice: renier sa foi
  alternative: nier qu’il soit Polycarpe / renier le Christ
  rationale: Le contexte montre qu’on cherche à obtenir une apostasie, mais le témoin fourni ne formule pas explicitement l’objet. « Renier sa foi » rend le contexte sans ajouter directement « le Christ » à cet endroit.
- issue: Les quatre-vingt-six années de service
  choice: Voilà quatre-vingt-six ans que je le sers
  alternative: J’ai quatre-vingt-six ans et je le sers depuis toujours
  rationale: 'Conserve l’ambiguïté traditionnelle : il peut s’agir de l’âge de Polycarpe ou de la durée de son service chrétien.'
- issue: Caractère céleste de la voix
  choice: une voix lui vint du ciel
  alternative: il entendit une voix venue du ciel
  rationale: Suit le récit sans identifier le locuteur invisible ni expliquer la nature du phénomène.
translation_notes:
  register: Français international moderne, narratif et digne. Les dialogues restent directs et incisifs. « Païens impies » rend la condamnation du narrateur sans employer « sans loi », peu naturel ici. Projet nécessairement provisoire, puisque le dossier fourni signale que la révision directe du grec est encore en attente.
