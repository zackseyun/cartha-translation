review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais fourni. Quelques choix précisent indûment le texte : « combats de bêtes » restreint les « jeux », et « à ne leur offrir ni sacrifices ni adoration » introduit un pronom et une formulation cultuelle plus explicites que l’original. La vision est mieux rendue en identifiant clairement l’oreiller comme ce qui était en feu.'
  naturalness: Le français est globalement naturel, moderne et d’un registre narratif approprié. « Païens et Juifs » est ici plus idiomatique et historiquement naturel que « non-Juifs et Juifs », sans modifier l’opposition du texte. La syntaxe de la dernière scène a été légèrement clarifiée.
  terminology: « Asiarque » est correctement conservé comme titre antique et reçoit une note prudente. « Jeux » maintient l’étendue du terme source. « Rendre un culte » traduit naturellement « worship » sans imposer une lecture doctrinale.
  issues:
  - severity: medium
    issue: Restriction de « sports » à « combats de bêtes »
    rationale: Le contexte explique la demande d’un lion, mais le témoin dit que les jeux étaient terminés. « Combats de bêtes » réduit le référent institutionnel plus large.
  - severity: medium
    issue: Explicitation dans « ne leur offrir ni sacrifices ni adoration »
    rationale: Le texte accuse Polycarpe d’enseigner à beaucoup de gens à ne pas sacrifier ni adorer; le pronom « leur » et « offrir ... adoration » rendent l’objet plus explicite et plus lourd que nécessaire.
  - severity: low
    issue: Antécédent de l’objet en feu dans la vision
    rationale: La formulation révisée précise que Polycarpe avait vu son oreiller en feu, conformément à la séquence du témoin, tout en gardant la structure narrative.
  revised_text: 'Après avoir dit cela et bien d’autres choses encore, Polycarpe fut animé de courage et de joie, et son visage était plein de grâce. Loin de se laisser abattre par ce qui lui était dit, il stupéfia le proconsul. Celui-ci envoya son propre héraut proclamer trois fois au milieu du stade : « Polycarpe a reconnu qu’il est chrétien. »


    Lorsque le héraut eut fait cette proclamation, toute la foule des païens et des Juifs qui habitaient Smyrne éclata en une rage incontrôlable et poussa un grand cri : « Voilà le maître de l’Asie, le père des chrétiens, celui qui détruit nos dieux, qui enseigne à beaucoup de gens à ne pas sacrifier ni rendre un culte ! » En disant cela, ils criaient à grands cris et demandèrent à Philippe l’asiarque[a] de lâcher un lion sur Polycarpe. Mais il répondit qu’il n’en avait pas le droit, puisque les jeux étaient terminés.


    Alors ils jugèrent bon de crier tous d’une seule voix que Polycarpe devait être brûlé vif. Car il fallait que s’accomplisse la vision qui lui avait été montrée au sujet de son oreiller : pendant qu’il priait, il avait vu son oreiller en feu et, se tournant vers les fidèles qui étaient avec lui, il leur avait dit prophétiquement : « Je dois être brûlé vif. »'
  revised_footnotes:
  - marker: a
    text: L’asiarque était un dignitaire de la province romaine d’Asie, associé notamment à l’organisation des jeux et au culte public.
    reason: Le titre antique est peu connu et n’a pas d’équivalent français exact; la note l’explique sans lui attribuer une fonction institutionnelle trop précise.
  revision_rationale: Révision limitée pour maintenir la portée du témoin, éviter des explicitations inutiles et améliorer quelques formulations françaises. La présente évaluation est nécessairement fondée d’abord sur le témoin anglais fourni, la révision directe du grec étant indiquée comme en attente.
