base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: fr
  text: 'Après avoir dit cela et bien d’autres choses encore, Polycarpe fut rempli de courage et de joie, et son visage rayonnait de grâce. Loin de s’abattre devant les paroles qui lui étaient adressées, il stupéfia le proconsul. Celui-ci envoya son propre héraut proclamer trois fois au milieu du stade : « Polycarpe a déclaré qu’il est chrétien. »


    À cette proclamation du héraut, toute la foule des non-Juifs et des Juifs qui habitaient Smyrne éclata d’une rage incontrôlable et cria à pleine voix : « Voilà le maître de l’Asie, le père des chrétiens, celui qui détruit nos dieux et qui enseigne à tant de gens à ne leur offrir ni sacrifices ni adoration ! » Tout en criant ainsi, ils demandèrent à Philippe l’asiarque[a] de lâcher un lion sur Polycarpe. Mais il répondit qu’il n’en avait pas le droit, puisque les combats de bêtes étaient terminés.


    Alors, d’un commun accord, ils crièrent que Polycarpe devait être brûlé vif. Il fallait en effet que s’accomplisse la vision qu’il avait eue au sujet de son oreiller : pendant qu’il priait, il l’avait vu en flammes ; puis, se tournant vers les fidèles qui étaient avec lui, il leur avait dit prophétiquement : « Je dois être brûlé vif. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’asiarque était un haut responsable provincial associé au culte public et à l’organisation ou à la supervision des jeux dans la province romaine d’Asie.
    reason: Le titre antique est peu connu des lecteurs modernes et ne possède pas d’équivalent français exact.
lexical_decisions:
- source_word: countenance was filled with grace
  choice: son visage rayonnait de grâce
  rationale: Rend naturellement l’idée d’un visage marqué ou rempli de grâce, sans réduire « grâce » à un simple charme physique.
- source_word: Gentiles
  choice: non-Juifs
  rationale: Expression immédiatement compréhensible en français moderne et adéquate dans l’opposition explicite avec les Juifs.
- source_word: teacher of Asia
  choice: maître de l’Asie
  rationale: Conserve le titre accusateur et l’étendue géographique antique sans préciser indûment le type d’enseignement.
- source_word: Asiarch
  choice: asiarque
  rationale: Maintient le titre institutionnel ancien de Philippe; une note en donne une explication prudente.
- source_word: sports
  choice: combats de bêtes
  rationale: Le contexte immédiat de la demande de lâcher un lion indique la partie des jeux concernée; cette formulation explique pourquoi Philippe ne pouvait plus accéder à la demande.
- source_word: must needs
  choice: il fallait / je dois
  rationale: Préserve la nécessité narrative et prophétique sans expliciter davantage sa nature théologique.
theological_decisions:
- issue: Nature de la grâce visible sur le visage de Polycarpe
  choice: « son visage rayonnait de grâce »
  alternative: « son visage était plein de grâce »
  rationale: La formulation conserve le vocabulaire théologique de la grâce tout en exprimant son effet visible, sans définir si elle désigne faveur divine, beauté ou sérénité.
- issue: Nécessité de l’accomplissement de la vision
  choice: « Il fallait en effet que s’accomplisse la vision »
  alternative: « La vision devait nécessairement s’accomplir »
  rationale: Conserve la tension entre annonce prophétique et événement sans déterminer philosophiquement la causalité ni imposer une doctrine de la prédestination.
- issue: Parole prophétique de Polycarpe
  choice: « il leur avait dit prophétiquement »
  alternative: « il leur avait annoncé comme une prophétie »
  rationale: Reproduit l’évaluation du narrateur sans accroître le statut canonique ou doctrinal de la vision.
