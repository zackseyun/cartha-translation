base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: fr
  text: 'Mais lorsqu’il eut enfin achevé sa prière, après avoir évoqué tous ceux qu’il avait rencontrés à un moment ou à un autre — petits et grands, gens en vue et gens modestes — ainsi que toute l’Église universelle répandue dans le monde, l’heure du départ arriva. On le fit monter sur un âne et on le conduisit dans la ville, car c’était un grand sabbat.[a]


    Hérode, le chef de la police, et son père Nicétès vinrent à sa rencontre. Ils le firent monter dans leur voiture, s’assirent à ses côtés et cherchèrent à le convaincre. Ils lui disaient : « Quel mal y a-t-il à déclarer : “César est Seigneur”, à offrir de l’encens », et d’autres choses du même genre, « pour te sauver ? » Au début, il ne leur répondit pas. Mais comme ils insistaient, il leur dit : « Je ne ferai pas ce que vous me conseillez. »


    Alors, puisqu’ils n’avaient pas réussi à le convaincre, ils lui adressèrent des menaces et le firent descendre précipitamment, si bien qu’en sortant de la voiture il se blessa au tibia. Sans même se retourner, il poursuivit aussitôt son chemin d’un pas rapide, comme si rien ne lui était arrivé, tandis qu’on le conduisait au stade. Il y régnait un tel tumulte que personne ne pouvait même faire entendre sa voix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « grand sabbat » est conservée telle quelle; elle désigne un sabbat particulièrement solennel, sans que le présent témoin permette d’en préciser davantage la nature.
    reason: Signaler une expression historique inhabituelle sans l’harmoniser ni lui attribuer une fête précise.
lexical_decisions:
- source_word: all who at any time had come in his way
  choice: tous ceux qu’il avait rencontrés à un moment ou à un autre
  rationale: Rend naturellement l’idée de toutes les personnes croisées au cours de sa vie, sans suggérer qu’elles lui auraient fait obstacle.
- source_word: small and great, high and low
  choice: petits et grands, gens en vue et gens modestes
  rationale: Conserve le parallélisme social tout en évitant une traduction littérale obscure de « high and low ».
- source_word: hour of departure
  choice: l’heure du départ
  rationale: Préserve l’euphémisme et sa possible portée liée à la mort sans l’expliciter.
- source_word: captain of police
  choice: chef de la police
  rationale: Équivalent fonctionnel clair pour le lecteur moderne, sans précision administrative non garantie par le témoin fourni.
- source_word: Caesar is Lord
  choice: César est Seigneur
  rationale: Conserve la formule politique et religieuse provocatrice ainsi que son contraste implicite avec la confession chrétienne.
- source_word: saving thyself
  choice: pour te sauver
  rationale: Préserve l’ambiguïté entre échapper à l’exécution et sauver sa vie, sans lui imposer un sens sotériologique.
- source_word: stadium
  choice: stade
  rationale: Terme historique courant et immédiatement compréhensible.
theological_decisions:
- issue: Portée de « César est Seigneur »
  choice: Maintien littéral de « César est Seigneur »
  alternative: « César est le seigneur » ou « L’empereur est Seigneur »
  rationale: Le titre sans article conserve au mieux la force confessionnelle de la formule et sa tension avec la fidélité chrétienne, sans commentaire doctrinal ajouté.
- issue: Sens de « départ »
  choice: Conserver « départ »
  alternative: « mort » ou « martyre »
  rationale: Le texte emploie un euphémisme; l’expliciter résoudrait indûment sa nuance littéraire et théologique.
- issue: Caractère du sabbat
  choice: « grand sabbat » avec note
  alternative: « jour de grand sabbat », « sabbat solennel » ou harmonisation avec une fête précise
  rationale: La formulation inhabituelle est maintenue sans identifier une observance précise que les données fournies ne permettent pas d’établir.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement restructurées pour la lisibilité, tout en préservant les répétitions, la progression dramatique et les ambiguïtés du témoin. Faute de texte grec directement fourni et puisque la révision de la langue source est signalée comme encore à venir, ce projet reste explicitement fondé sur le témoin anglais public fourni et évite les reconstructions grecques non vérifiables.
