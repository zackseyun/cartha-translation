review_pass:
  verdict: revise
  source_fidelity: 'Le texte restitue fidèlement l’enchaînement du témoin fourni et, dans l’ensemble, les expressions attendues du grec : martyre avec les chrétiens de Philadelphie, renom auprès des païens, modèle de l’Évangile, couronne d’immortalité et triple titre christologique. La désignation « gouverneur » est toutefois trop déterminée pour « ruler » (et pour le grec ἄρχων, terme plus large) : elle peut suggérer une fonction administrative précise que le texte ne spécifie pas ici.'
  naturalness: Français soutenu, moderne et fluide. « Ceux qui venaient de Philadelphie » peut être resserré en « ceux de Philadelphie », plus naturel dans ce contexte ancien sans modifier le sens. Le reste, y compris les présentes affirmations finales et les métaphores de « pilote » et de « berger », se lit naturellement tout en conservant le registre du texte.
  terminology: « Bienheureux », « martyre », « païens », « Évangile du Christ », « couronne de l’immortalité », « Sauveur », « pilote » et « Église universelle » sont des choix appropriés et non confessionnellement surinterprétés. « Dirigeant injuste » préserve l’indétermination institutionnelle de l’original mieux que « gouverneur ».
  issues:
  - severity: medium
    issue: « gouverneur injuste » restreint indûment le sens de « unrighteous ruler ».
    rationale: Le témoin anglais dit « ruler » et le terme grec traditionnellement attesté, ἄρχων, ne requiert pas l’identification à un gouverneur. « Dirigeant injuste » conserve le jugement moral et le caractère individuel sans fixer une charge.
  - severity: low
    issue: « ceux qui venaient de Philadelphie » est un peu plus lourd que nécessaire.
    rationale: « Ceux de Philadelphie » rend directement l’appartenance ou la provenance exprimée par le texte, dans un français plus idiomatique.
  revised_text: 'Ainsi en fut-il du bienheureux Polycarpe, qui subit le martyre à Smyrne avec ceux de Philadelphie — ils étaient douze en tout. Plus que les autres, il demeure dans la mémoire de tous, au point que même les païens parlent partout de lui. En effet, il se montra non seulement un enseignant remarquable, mais aussi un martyr éminent, dont tous désirent imiter le martyre, puisque celui-ci fut conforme au modèle de l’Évangile du Christ.


    Par son endurance, il vainquit dans le combat le dirigeant injuste et reçut ainsi la couronne de l’immortalité. Il se réjouit en compagnie des apôtres et de tous les justes, glorifie Dieu, le Père tout-puissant, et bénit notre Seigneur Jésus-Christ, le Sauveur de nos âmes, le pilote de nos corps et le berger de l’Église universelle répandue dans le monde entier.[a]'
