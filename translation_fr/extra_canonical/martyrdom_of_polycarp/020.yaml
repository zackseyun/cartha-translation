base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: fr
  text: 'Ainsi en fut-il du bienheureux Polycarpe, qui subit le martyre à Smyrne avec ceux qui venaient de Philadelphie — ils étaient douze en tout. Plus que les autres, il demeure dans la mémoire de tous, au point que même les païens parlent partout de lui. En effet, il se montra non seulement un enseignant remarquable, mais aussi un martyr éminent, dont tous désirent imiter le martyre, puisque celui-ci fut conforme au modèle de l’Évangile du Christ.


    Par son endurance, il vainquit dans le combat le gouverneur injuste et reçut ainsi la couronne de l’immortalité. Il se réjouit en compagnie des apôtres et de tous les justes, glorifie Dieu, le Père tout-puissant, et bénit notre Seigneur Jésus-Christ, le Sauveur de nos âmes, le pilote de nos corps et le berger de l’Église universelle répandue dans le monde entier.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais fourni; une vérification directe du texte grec demeure nécessaire.
    reason: Les données indiquent que l’examen de la tradition manuscrite grecque est encore en attente; la note rend transparente cette limitation de la base documentaire.
lexical_decisions:
- source_word: suffered martyrdom
  choice: subit le martyre
  rationale: Formulation française naturelle et digne qui conserve l’idée d’une mise à mort en témoignage de la foi.
- source_word: heathen
  choice: païens
  rationale: Équivalent historique clair en français moderne, sans la nuance inutilement péjorative que pourrait porter « mécréants ».
- source_word: after the pattern of the Gospel of Christ
  choice: conforme au modèle de l’Évangile du Christ
  rationale: Conserve l’idée d’une correspondance exemplaire avec l’Évangile, sans préciser davantage si le modèle visé est le récit, l’enseignement ou la passion du Christ.
- source_word: endurance
  choice: endurance
  rationale: Rend la persévérance ferme dans l’épreuve sans réduire le terme à une simple patience passive.
- source_word: unrighteous ruler
  choice: gouverneur injuste
  rationale: « Gouverneur » convient au représentant de l’autorité engagé dans le procès; « injuste » conserve le jugement moral du texte.
- source_word: crown of immortality
  choice: couronne de l’immortalité
  rationale: Préserve l’image traditionnelle de la récompense victorieuse et sa portée eschatologique.
- source_word: helmsman of our bodies
  choice: pilote de nos corps
  rationale: Maintient la métaphore nautique inhabituelle du témoin au lieu de l’aplanir en « guide ».
- source_word: universal Church
  choice: Église universelle
  rationale: Rend le sens général de l’ensemble de l’Église dans le monde, sans importer une désignation confessionnelle moderne.
theological_decisions:
- issue: Imitation du martyre de Polycarpe
  choice: « dont tous désirent imiter le martyre »
  alternative: « que tous désirent imiter dans son martyre »
  rationale: La formulation retenue suit la syntaxe du témoin et garde la force rhétorique du passage, sans transformer ce désir en prescription universelle.
- issue: État présent de Polycarpe après sa mort
  choice: 'présents narratifs : « il se réjouit… glorifie… bénit »'
  alternative: futurs eschatologiques ou passés narratifs
  rationale: Le témoin affirme ces actions au présent; la traduction conserve cette perspective théologique sans l’expliquer ni la systématiser.
- issue: Relation entre Jésus-Christ, les âmes et les corps
  choice: trois titres maintenus séparément
  alternative: fusionner ou spiritualiser les images
  rationale: « Sauveur de nos âmes », « pilote de nos corps » et « berger de l’Église » sont tous conservés afin de respecter la tension et l’anthropologie du passage.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les périodes longues du témoin ont été légèrement segmentées pour la lisibilité. Les images anciennes et les titres christologiques ont été conservés, avec une capitalisation française sobre.
