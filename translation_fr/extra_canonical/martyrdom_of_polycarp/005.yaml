revisions:
- from: Mais un homme nommé Quintus, un Phrygien récemment arrivé de Phrygie, perdit courage à la vue des bêtes sauvages. C’était lui qui s’était poussé, avec quelques autres, à se présenter de son plein gré. À force d’insistance, le proconsul le persuada de prêter serment et d’offrir de l’encens. C’est pourquoi, frères, nous n’approuvons pas ceux qui se livrent eux-mêmes, car ce n’est pas ce que l’Évangile enseigne.
  to: Mais un homme nommé Quintus, un Phrygien récemment arrivé de Phrygie, perdit courage en voyant les bêtes sauvages. C’était lui qui s’était contraint lui-même, ainsi que quelques autres, à se présenter volontairement. Après l’avoir beaucoup pressé, le proconsul le persuada de prêter serment et d’offrir de l’encens. C’est pourquoi donc, frères, nous ne louons pas ceux qui se livrent eux-mêmes, car l’Évangile ne nous enseigne pas à agir ainsi.
  rationale: La révision restitue plus précisément le verbe grec exprimant que Quintus s’était lui-même contraint à comparaître et avait impliqué d’autres personnes. Elle remplace aussi « n’approuvons pas » par « ne louons pas », correspondant au vocabulaire du texte, et explicite sobrement dans la dernière proposition le complément implicite (« à agir ainsi »), sans ajouter d’interprétation confessionnelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:58Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens narratif est globalement bien rendu. Toutefois, le grec oppose explicitement l’initiative volontaire de Quintus à l’idée qu’il « se contraignit lui-même » (ἀναγκάσας ἑαυτόν) à se présenter; « s’était poussé » est moins précis et peu naturel. La conclusion emploie « nous ne louons pas » (οὐκ ἐπαινοῦμεν), plus direct que « nous n’approuvons pas ».
  naturalness: Le français est fluide et adapté à un registre narratif moderne. « Se contraindre lui-même, ainsi que quelques autres » est à la fois plus idiomatique et plus fidèle que « s’était poussé, avec quelques autres ».
  terminology: « Phrygien », « proconsul », « prêter serment », « offrir de l’encens » et « l’Évangile » conviennent. « Se livrent eux-mêmes » conserve correctement l’idée de personnes qui se remettent volontairement aux autorités, sans surinterprétation.
  issues:
  - severity: medium
    issue: Rendu imprécis de l’action volontairement forcée par Quintus
    rationale: « C’était lui qui s’était poussé » affaiblit ἀναγκάσας ἑαυτόν (« s’étant contraint lui-même ») et rend moins nettement le fait qu’il avait aussi entraîné/contraint d’autres personnes à se présenter volontairement.
  - severity: low
    issue: « Nous n’approuvons pas » atténue le verbe de louange
    rationale: Le texte dit littéralement « nous ne louons pas »; cette formulation française reste naturelle et préserve mieux la portée rhétorique sans transformer le propos en jugement doctrinal plus large.
  revised_text: Mais un homme nommé Quintus, un Phrygien récemment arrivé de Phrygie, perdit courage en voyant les bêtes sauvages. C’était lui qui s’était contraint lui-même, ainsi que quelques autres, à se présenter volontairement. Après l’avoir beaucoup pressé, le proconsul le persuada de prêter serment et d’offrir de l’encens. C’est pourquoi donc, frères, nous ne louons pas ceux qui se livrent eux-mêmes, car l’Évangile ne nous enseigne pas à agir ainsi.
  revised_footnotes: []
  revision_rationale: La révision restitue plus précisément le verbe grec exprimant que Quintus s’était lui-même contraint à comparaître et avait impliqué d’autres personnes. Elle remplace aussi « n’approuvons pas » par « ne louons pas », correspondant au vocabulaire du texte, et explicite sobrement dans la dernière proposition le complément implicite (« à agir ainsi »), sans ajouter d’interprétation confessionnelle.
