base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: fr
  text: Mais un homme nommé Quintus, un Phrygien récemment arrivé de Phrygie, perdit courage en voyant les bêtes sauvages. C’était lui qui s’était contraint lui-même, ainsi que quelques autres, à se présenter volontairement. Après l’avoir beaucoup pressé, le proconsul le persuada de prêter serment et d’offrir de l’encens. C’est pourquoi donc, frères, nous ne louons pas ceux qui se livrent eux-mêmes, car l’Évangile ne nous enseigne pas à agir ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: turned coward
  choice: perdit courage
  rationale: Expression naturelle et digne qui décrit la défaillance de Quintus sans ajouter une qualification durable à son caractère.
- source_word: come forward of their own free will
  choice: se présenter de son plein gré
  rationale: Conserve l’idée d’une démarche volontaire devant les autorités, sans préciser davantage que le témoin anglais.
- source_word: swear the oath
  choice: prêter serment
  rationale: Formulation française idiomatique qui maintient la portée officielle et religieuse de l’acte.
- source_word: offer incense
  choice: offrir de l’encens
  rationale: Rend directement l’acte cultuel exigé, sans explicitation confessionnelle absente du témoin.
- source_word: deliver themselves up
  choice: se livrent eux-mêmes
  rationale: Préserve l’accent sur l’auto-dénonciation ou la reddition volontaire et son contraste avec le martyre subi.
- source_word: the Gospel
  choice: l’Évangile
  rationale: Maintient le terme théologique du témoin, qui peut désigner l’enseignement évangélique plutôt qu’un livre particulier.
theological_decisions:
- issue: Jugement porté sur le martyre volontaire
  choice: nous n’approuvons pas ceux qui se livrent eux-mêmes
  alternative: nous ne louons pas ceux qui se livrent eux-mêmes
  rationale: « N’approuvons pas » exprime clairement la réserve normative du passage en français courant, sans condamner tout désir de témoigner ni résoudre les circonstances au-delà du texte.
- issue: Autorité de l’Évangile
  choice: ce n’est pas ce que l’Évangile enseigne
  alternative: l’Évangile ne nous enseigne pas à agir ainsi
  rationale: Cette tournure relie directement la désapprobation à l’enseignement évangélique tout en évitant d’importer une citation ou une doctrine particulière.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire reste accessible, avec les termes historiques « proconsul », « prêter serment » et « offrir de l’encens ». Draft établi à partir du témoin anglais du domaine public fourni; la révision directe du grec demeure à faire.
