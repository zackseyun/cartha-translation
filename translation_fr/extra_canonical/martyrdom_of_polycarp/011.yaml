    issue: « génie de César » traduit un terme différent de celui attesté dans la tradition grecque indiquée.
    rationale: Le grec τὴν Καίσαρος τύχην désigne la « Fortune de César » (τύχη), non son genius. Conserver « génie » ferait primer de façon indue le témoin anglais sur la source grecque.
  - severity: low
    issue: « Écoute-moi clairement » est maladroit.
    rationale: La formule française suggère que l’interlocuteur doit entendre distinctement, plutôt que l’invitation à écouter une déclaration franche et explicite.
  - severity: low
    issue: La note a définit « génie » plutôt que le référent grec τύχη.
    rationale: Elle doit être remplacée par une explication de « Fortune » dans son contexte cultuel romain.
