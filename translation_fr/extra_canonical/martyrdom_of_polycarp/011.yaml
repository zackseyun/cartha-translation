base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: fr
  text: 'Mais comme il insistait et répétait : « Jure par la Fortune de César[a] », Polycarpe répondit : « Si tu t’imagines vainement que je vais jurer par la Fortune de César, comme tu le dis, et si tu feins d’ignorer qui je suis, écoute-moi donc sans détour : je suis chrétien. Mais si tu veux connaître l’enseignement du christianisme, fixe un jour et accorde-moi une audience. »


    Le proconsul dit : « Convaincs le peuple. » Mais Polycarpe répondit : « Toi, je t’aurais jugé digne d’un entretien, car on nous a enseigné à rendre aux dirigeants et aux autorités établis par Dieu l’honneur qui convient, pour autant que cela ne nous fasse aucun tort[b]. Mais eux, je ne les juge pas dignes que je présente ma défense devant eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « Fortune de César » rend le grec τύχη (« fortune », « destinée »). Dans ce contexte romain, l’expression renvoie à la puissance ou à la fortune protectrice associée au souverain et invoquée dans un serment.
    reason: Corrige l’équivalence lexicale avec le grec tout en expliquant le sens religieux antique de « Fortune ».
  - marker: b
    text: 'Ou : « dans la mesure où cela ne nous porte pas préjudice ». La formule marque une limite, sans préciser la nature exacte du tort ou du préjudice.'
    reason: Préserve l’ambiguïté du texte concernant la limite de l’honneur rendu aux autorités.
lexical_decisions:
- source_word: τὴν Καίσαρος τύχην (reconstructed from the Greek textual tradition; direct review pending)
  choice: le génie de César
  rationale: Conserve la formule cultuelle antique désignant la puissance protectrice ou tutélaire de César, tout en l’explicitant par une note afin d’éviter le sens moderne de « génie » comme intelligence exceptionnelle.
- source_word: τὸν τοῦ Χριστιανισμοῦ λόγον / Christian teaching (source-language review pending)
  choice: l’enseignement du christianisme
  rationale: Formulation naturelle qui garde ici le sens de doctrine ou d’exposé concernant la foi chrétienne.
- source_word: ἄρχαις καὶ ἐξουσίαις / rulers and authorities (source-language review pending)
  choice: aux dirigeants et aux autorités
  rationale: Rend les deux catégories sans les fondre et emploie un français contemporain.
- source_word: ἀπολογεῖσθαι / defend myself (source-language review pending)
  choice: présente ma défense
  rationale: Préserve le contexte judiciaire et rhétorique sans suggérer de simples excuses.
theological_decisions:
- issue: Honneur dû aux autorités établies par Dieu
  choice: « l’honneur qui convient, pour autant que cela ne nous fasse aucun tort »
  alternative: « l’honneur qui ne nous porte pas préjudice »
  rationale: Maintient ensemble la reconnaissance des autorités et la limite de l’obéissance, sans préciser au-delà du témoin fourni la nature exacte du tort envisagé.
- issue: Statut de la foule comme auditoire
  choice: « je ne les juge pas dignes que je présente ma défense devant eux »
  alternative: « je ne les estime pas dignes de recevoir ma défense »
  rationale: Conserve la dureté et la tension du propos de Polycarpe sans en atténuer ni en amplifier le jugement.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement est maintenu dans le dialogue pour refléter le singulier de l’échange antique sans archaïsmes tels que « tu supposes vainement » ou « prête-moi audience ». La rédaction reste provisoire, puisque les données fournies signalent qu’un examen direct du grec est encore en attente.
