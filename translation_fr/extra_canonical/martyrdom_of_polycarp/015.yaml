  revision_rationale: La révision conserve le contenu, les ambiguïtés et les crochets du témoin anglais, tout en corrigeant des formulations françaises qui atténuaient l’imagerie sacrificielle ou restructuraient trop la doxologie. La traduction reste provisoire, puisque le matériau accessible est un témoin anglais et non l’édition grecque directement collationnée.
