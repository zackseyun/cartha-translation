review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais fourni et conserve correctement les deux signaux textuels entre crochets. Deux formulations demandent toutefois correction : « sacrifice généreux » ne rend pas bien « rich sacrifice », qui qualifie la valeur ou l’abondance de l’offrande, et la doxologie finale est trop réagencée par rapport à la construction transmise.'
  naturalness: Le français est globalement moderne, solennel et naturel. « Les mains placées derrière le dos et lié au poteau » est un peu heurté ; « les mains derrière le dos, attaché au poteau » est plus idiomatique. La série verbale « tu l’avais préparé ... et que tu l’as accompli » mélange inutilement les temps.
  terminology: « Holocauste », « puissances », « martyrs », « incorruptibilité », « Esprit Saint » et « grand-prêtre » conviennent au registre et préservent les termes théologiques. « Lignée des justes » est acceptable pour éviter les connotations modernes de « race », mais « peuple des justes » rend plus naturellement l’idée collective sans imposer une généalogie.
  issues:
  - severity: medium
    issue: « sacrifice généreux »
    rationale: « Généreux » décrit normalement une disposition morale ou un don libéral. Dans l’image sacrificielle du témoin, « riche » qualifie l’offrande elle-même. « Sacrifice précieux et agréé » est idiomatique et conserve cette valeur.
  - severity: medium
    issue: Doxologie finale fortement liturgisée
    rationale: « Par lui, avec lui et avec l’Esprit Saint, à toi la gloire » est une formule française fluide, mais elle réorganise sensiblement « through whom with Him and the Holy Spirit be glory ». Une formulation plus proche maintient le rôle médiateur de « par qui » et l’association du Fils et de l’Esprit sans introduire une cadence liturgique déterminée.
  - severity: low
    issue: Construction initiale et concordance des temps
    rationale: « Les mains placées derrière le dos et lié » est moins naturel que « les mains derrière le dos, attaché ». Dans « comme tu l’avais préparé ... et que tu l’as accompli », l’alternance plus-que-parfait/passé composé est évitable sans changement de sens.
  revised_text: 'Ils ne le clouèrent donc pas, mais l’attachèrent. Alors, les mains derrière le dos, attaché au poteau, tel un bélier de choix pris dans un grand troupeau pour être offert, holocauste préparé et agréé par Dieu, il leva les yeux vers le ciel et dit :


    « Seigneur Dieu tout-puissant,


    Père de ton Fils bien-aimé et béni, Jésus-Christ,


    par qui nous avons reçu la connaissance de toi,


    Dieu des anges, des puissances et de toute la création,


    et de tout le peuple des justes qui vivent en ta présence,


    je te bénis de m’avoir accordé ce jour et cette heure,


    afin que j’aie part, au nombre des martyrs,


    dans la coupe de [ton] Christ,


    pour la résurrection à la vie éternelle,


    de l’âme et du corps,


    dans l’incorruptibilité de l’Esprit Saint.


    Puissé-je être reçu aujourd’hui parmi eux, en ta présence,


    comme un sacrifice précieux et agréé,


    comme tu l’as préparé, révélé d’avance et accompli,


    toi, le Dieu fidèle et véritable.


    C’est pourquoi, et pour toutes choses,


    je te loue, je te bénis,


    je te glorifie par le grand-prêtre éternel et céleste,


    Jésus-Christ, ton Fils bien-aimé,


    par qui, avec lui et l’Esprit Saint, soit la gloire,


    maintenant [et toujours] et dans les siècles à venir. Amen. »'
