  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: fr
  text: 'Ils ne le clouèrent donc pas, mais l’attachèrent. Alors, les mains placées derrière le dos et lié au poteau, tel un bélier de choix pris dans un grand troupeau pour être offert, holocauste préparé et agréé par Dieu, il leva les yeux vers le ciel et dit :


    « Seigneur Dieu tout-puissant,

    Père de ton Fils bien-aimé et béni, Jésus-Christ,

    par qui nous avons reçu la connaissance de toi,

    Dieu des anges, des puissances et de toute la création,

    et de toute la lignée des justes qui vivent en ta présence,

    je te bénis de m’avoir accordé ce jour et cette heure,

    afin que j’aie part, au nombre des martyrs,

    à la coupe de [ton] Christ,

    pour la résurrection à la vie éternelle,

    de l’âme et du corps,

    dans l’incorruptibilité de l’Esprit Saint.


    Puissé-je être reçu aujourd’hui parmi eux, en ta présence,

    comme un sacrifice généreux et agréé,

    ainsi que tu l’avais préparé et révélé d’avance,

    et que tu l’as accompli,

    toi, le Dieu fidèle et véritable.


    C’est pourquoi, et pour toutes choses,

    je te loue, je te bénis,

    je te glorifie par le grand-prêtre éternel et céleste,

    Jésus-Christ, ton Fils bien-aimé.

    Par lui, avec lui et avec l’Esprit Saint, à toi la gloire,

    maintenant [et toujours] et dans les siècles à venir. Amen. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tied / bound
  choice: attachèrent / lié
  rationale: « Attacher » décrit naturellement l’action opposée au clouage, tandis que « lié au poteau » conserve l’image concrète de l’immobilisation.
- source_word: noble ram
  choice: bélier de choix
  rationale: Cette expression française naturelle évoque un animal excellent, digne d’être offert, sans attribuer au bélier une qualité morale moderne.
- source_word: burnt sacrifice
  choice: holocauste
  rationale: Dans ce contexte sacrificiel ancien, « holocauste » désigne techniquement une offrande entièrement consumée; le voisinage de « sacrifice » en éclaire le sens.
- source_word: powers
  choice: puissances
  rationale: Le terme conserve l’ambiguïté traditionnelle entre puissances célestes et forces spirituelles sans la résoudre.
- source_word: race of the righteous
  choice: lignée des justes
  rationale: « Lignée » évite les connotations biologiques modernes de « race » tout en gardant l’idée d’un ensemble humain continu.
- source_word: martyrs
  choice: martyrs
  rationale: Le contexte exige le sens chrétien ancien de témoins allant jusqu’à la mort, lexicalisé en français par « martyrs ».
- source_word: incorruptibility
  choice: incorruptibilité
  rationale: Le terme théologique précis maintient le lien entre résurrection, âme, corps et œuvre de l’Esprit.
- source_word: High-priest
  choice: grand-prêtre
  rationale: C’est l’équivalent français conventionnel du titre sacerdotal appliqué ici au Christ.
theological_decisions:
- issue: « la coupe de [ton] Christ »
  choice: Maintien de « [ton] » entre crochets
  alternative: « la coupe de ton Christ » ou « la coupe du Christ »
  rationale: Les crochets du témoin signalent une restauration ou une incertitude textuelle; les conserver évite de présenter la leçon comme certaine.
- issue: Résurrection de l’âme et du corps
  choice: Conserver la coordination explicite « de l’âme et du corps »
  alternative: Reformuler comme une résurrection corporelle seulement
  rationale: Le témoin affirme expressément les deux éléments; la traduction ne doit pas harmoniser cette formulation avec une construction doctrinale particulière.
- issue: Rôle de l’Esprit Saint dans l’incorruptibilité
  choice: « dans l’incorruptibilité de l’Esprit Saint »
  alternative: « par l’incorruptibilité que donne l’Esprit Saint »
  rationale: La relation exacte exprimée par le génitif reste ambiguë; une paraphrase causale la résoudrait indûment.
- issue: Doxologie finale
  choice: « Par lui, avec lui et avec l’Esprit Saint, à toi la gloire »
  alternative: « par qui gloire soit à toi, avec lui et le Saint-Esprit »
  rationale: La formulation retenue rend la syntaxe intelligible en français tout en maintenant l’association du Père, du Fils et de l’Esprit dans la doxologie, sans développer une formule confessionnelle ultérieure.
- issue: « [et toujours] »
  choice: Maintien des crochets
  alternative: Intégrer « et toujours » sans signalement ou l’omettre
  rationale: Le témoin marque ces mots comme textuellement incertains; le signal doit rester visible dans le texte publié.
translation_notes:
  register: 'Français international moderne, digne et accessible, avec une cadence solennelle adaptée à la prière. Le tutoiement est retenu pour l’adresse à Dieu, conformément à l’usage biblique français courant. Les termes sacrificiels et théologiques précis sont conservés lorsque leur remplacement affaiblirait l’imagerie ancienne. Projet nécessairement provisoire : le matériau fourni est un témoin anglais du grec, et une vérification directe de la tradition manuscrite grecque reste requise.'
