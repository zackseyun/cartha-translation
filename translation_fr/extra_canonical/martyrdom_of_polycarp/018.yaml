base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: fr
  text: 'Mais le Mauvais, jaloux et envieux, l’adversaire de la famille des justes, avait vu la grandeur de son martyre, sa vie irréprochable depuis le commencement, comment il avait été couronné de la couronne d’immortalité et avait remporté une récompense que personne ne pouvait contester. Il s’arrangea donc pour que même son pauvre corps ne nous soit pas remis, bien que beaucoup aient désiré le recueillir et toucher sa chair sainte.


    Il poussa donc Nicétès, père d’Hérode et frère d’Alcé, à supplier le magistrat de ne pas remettre son corps : « De peur, disait-on, qu’ils n’abandonnent le Crucifié et ne se mettent à rendre un culte à cet homme. » Cela se fit à l’instigation et sur les instances pressantes des Juifs[a], qui montèrent aussi la garde lorsque nous étions sur le point de retirer le corps du feu. Ils ignoraient qu’il nous sera impossible soit d’abandonner un jour le Christ, qui a souffert pour le salut du monde entier de ceux qui sont sauvés[b] — lui qui était sans faute a souffert pour les pécheurs —, soit de rendre un culte à quelqu’un d’autre.


    Car lui, nous l’adorons parce qu’il est le Fils de Dieu ; quant aux martyrs, nous les aimons comme disciples et imitateurs du Seigneur, ainsi qu’ils le méritent en raison de leur attachement incomparable à leur propre Roi et Maître. Puissions-nous, nous aussi, être trouvés participants avec eux et disciples à leurs côtés !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce récit, « les Juifs » désigne les personnes du groupe local impliquées dans cette action; l’expression ne doit pas être étendue au peuple juif dans son ensemble.
    reason: Évite une généralisation ethnique ou religieuse anachronique tout en conservant la formulation du témoin.
  - marker: b
    text: 'La formulation transmise est difficile : elle peut aussi se comprendre comme « pour le salut de tous ceux qui, dans le monde entier, sont sauvés ».'
    reason: Préserve l’ambiguïté de la portée sotériologique au lieu de la trancher sans examen direct du grec.
lexical_decisions:
- source_word: Evil One
  choice: le Mauvais
  rationale: Rend le titre personnel de l’adversaire dans un français biblique naturel, sans le réduire à une abstraction morale.
- source_word: family of the righteous
  choice: la famille des justes
  rationale: Conserve l’image familiale et la désignation collective du témoin.
- source_word: poor body
  choice: son pauvre corps
  rationale: Préserve la nuance affective et pathétique du texte transmis.
- source_word: holy flesh
  choice: sa chair sainte
  rationale: Maintient le vocabulaire corporel fort et l’honneur accordé au corps du martyr.
- source_word: adore / worship
  choice: adorons / rendre un culte
  rationale: La variation française distingue clairement le culte réservé au Fils de Dieu de l’amour porté aux martyrs, tout en conservant l’opposition théologique du passage.
- source_word: cherish
  choice: aimons
  rationale: Exprime un attachement honorifique compréhensible sans suggérer que les martyrs reçoivent l’adoration.
- source_word: King and Teacher
  choice: Roi et Maître
  rationale: « Maître » convient au rapport disciple-enseignant et garde le registre christologique solennel.
theological_decisions:
- issue: Distinction entre le culte rendu au Christ et l’honneur accordé aux martyrs
  choice: « lui, nous l’adorons » mais « les martyrs, nous les aimons »
  alternative: Employer « vénérer » pour les martyrs
  rationale: Le choix retenu reproduit nettement la distinction argumentative sans importer une terminologie confessionnelle ultérieure.
- issue: Portée de la formule de salut
  choice: « pour le salut du monde entier de ceux qui sont sauvés »
  alternative: « pour le salut de tous ceux, dans le monde entier, qui sont sauvés »
  rationale: La formulation difficile du témoin est conservée plutôt que résolue silencieusement; une note signale l’ambiguïté.
- issue: Désignation collective « les Juifs »
  choice: Conservation du référent historique avec note contextuelle
  alternative: « certains Juifs »
  rationale: Le témoin fourni emploie une désignation collective. La modifier ajouterait une précision absente; la note prévient toutefois une généralisation hors contexte.
- issue: Valeur de « martyrdom »
  choice: « martyre »
  alternative: « témoignage jusqu’à la mort »
  rationale: Dans ce récit ancien, le terme désigne clairement la mort de Polycarpe comme témoin; « martyre » est naturel et historiquement approprié.
translation_notes:
  register: Français international moderne, digne et accessible, avec un rythme narratif soutenu. Les noms propres suivent des formes françaises transparentes. Projet provisoire fondé sur le témoin anglais public fourni; une vérification directe du grec reste nécessaire, notamment pour la formule sur « le monde entier de ceux qui sont sauvés », les verbes de culte et d’affection, et la syntaxe finale.
