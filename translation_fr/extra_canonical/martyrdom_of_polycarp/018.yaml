review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour mieux suivre le témoin : l’action initiale porte sur l’empêchement de l’enlèvement du corps par les chrétiens, non sur sa remise; Nicétès est « mis en avant » auprès du magistrat; et la conclusion demande d’être les compagnons et condisciples des martyrs. La syntaxe difficile concernant « le monde entier des sauvés » est maintenue sans solution doctrinale imposée.'
  naturalness: 'Le français est globalement digne et accessible. Quelques formulations gagnent en précision et en naturel : « surveillaient » plutôt que « montèrent la garde », « chérissons » pour l’affection honorifique, et « compagnons et condisciples » dans la prière finale. La formule transmise sur le salut reste volontairement insolite, avec note explicative.'
  terminology: « le Mauvais », « martyre », « chair sainte », « le Christ », « Fils de Dieu », « Roi et Maître » conviennent. « Adorons » pour le Fils et « chérissons » pour les martyrs reproduisent la distinction du texte sans importer de terminologie confessionnelle postérieure.
  issues:
  - severity: medium
    issue: « ne nous soit pas remis »
    rationale: Le témoin dit que le corps ne devait pas être « taken away by us »; « remis » suggère plutôt une décision de remise par l’autorité, explicitement évoquée seulement dans la phrase suivante.
  - severity: low
    issue: « Il poussa donc Nicétès »
    rationale: Le verbe du témoin (« put forward ») décrit la présentation ou l’intervention de Nicétès auprès du magistrat; « mit en avant » est plus exact et moins physique.
  - severity: low
    issue: « montèrent aussi la garde »
    rationale: Le témoin dit qu’ils « watched » lorsque les chrétiens allaient retirer le corps du feu; « surveillaient » conserve ce sens sans suggérer nécessairement une garde officielle.
  - severity: medium
    issue: 'Conclusion : « participants avec eux et disciples à leurs côtés »'
    rationale: Cette formulation dilue « partakers and fellow-disciples ». « Leurs compagnons et leurs condisciples » rend les deux relations sans répétition maladroite.
  revised_text: 'Mais le Mauvais, jaloux et envieux, l’adversaire de la famille des justes, avait vu la grandeur de son martyre, sa vie irréprochable depuis le commencement, comment il avait été couronné de la couronne d’immortalité et avait obtenu une récompense que personne ne pouvait contester. Il s’arrangea donc pour que même son pauvre corps ne puisse être emporté par nous, bien que beaucoup aient désiré le faire et toucher sa chair sainte.


    Il mit donc en avant Nicétès, père d’Hérode et frère d’Alcé, pour supplier le magistrat de ne pas livrer son corps, « de crainte que, disait-on, ils n’abandonnent le Crucifié et ne se mettent à rendre un culte à cet homme ». Cela se fit à l’instigation et sur les instances pressantes des Juifs[a], qui surveillaient aussi lorsque nous étions sur le point de le retirer du feu. Ils ignoraient qu’il nous sera impossible soit d’abandonner un jour le Christ, qui a souffert pour le salut du monde entier des sauvés[b] — lui qui était sans faute a souffert pour les pécheurs —, soit de rendre un culte à quelque autre.


    Car lui, nous l’adorons parce qu’il est le Fils de Dieu ; quant aux martyrs, nous les chérissons comme disciples et imitateurs du Seigneur, ainsi qu’ils le méritent en raison de leur attachement incomparable à leur propre Roi et Maître. Puissions-nous, nous aussi, être trouvés leurs compagnons et leurs condisciples !'
  revised_footnotes:
  - marker: a
    text: Dans ce récit, « les Juifs » désigne les personnes du groupe local impliquées dans cette action ; l’expression ne doit pas être étendue au peuple juif dans son ensemble.
    reason: Conserve la désignation collective du témoin tout en prévenant une généralisation ethnique ou religieuse hors contexte.
  - marker: b
    text: 'La formulation transmise est difficile : littéralement, « le salut du monde entier des sauvés ». Elle peut aussi se comprendre comme « le salut de tous ceux qui, dans le monde entier, sont sauvés » ; la portée exacte demeure incertaine sans décision textuelle ou interprétative supplémentaire.'
    reason: Préserve l’ambiguïté syntaxique et sotériologique du témoin au lieu de la résoudre.
  revision_rationale: Les changements réparent des glissements de sens localisés et améliorent la lisibilité sans altérer l’argument du passage. La construction difficile relative au salut est conservée de manière aussi littérale que le permet un français compréhensible, et sa note signale explicitement l’incertitude. Les deux ancres de note restent attachées aux expressions pertinentes.
