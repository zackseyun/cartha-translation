base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: fr
  text: 'Lorsqu’il eut fait monter son « amen » et achevé sa prière, les hommes chargés du feu allumèrent le bûcher. Une flamme immense jaillit alors. Nous qui avions reçu la grâce d’en être témoins, nous vîmes une chose merveilleuse ; et si nous avons été préservés, c’est pour raconter aux autres ce qui s’est passé.


    Le feu prit la forme d’une voûte et, semblable à la voile d’un navire gonflée par le vent, il entoura comme d’un mur le corps du martyr. Celui-ci se trouvait au milieu, non comme de la chair qui brûle, mais [comme un pain qui cuit au four ou comme] de l’or et de l’argent affinés dans une fournaise.[a] Nous respirions un parfum si agréable qu’on aurait dit une senteur d’encens ou de quelque autre aromate précieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots placés entre crochets suivent le témoin anglais fourni, où ils signalent une restitution textuelle ou une incertitude dans la transmission. Une vérification directe de la tradition manuscrite grecque reste à effectuer.
    reason: Préserver honnêtement le signal textuel du témoin de travail et le statut provisoire de la rédaction.
lexical_decisions:
- source_word: offered up the Amen
  choice: fait monter son « amen »
  rationale: Conserve le mouvement cultuel de l’expression ancienne plutôt que de réduire le sens à « dit amen » ; les guillemets signalent qu’« amen » est la parole prononcée.
- source_word: the firemen / οἱ τοῦ πυρὸς ἄνθρωποι
  choice: les hommes chargés du feu
  rationale: Évite le faux sens moderne de « pompiers » et désigne naturellement ceux qui devaient mettre le feu au bûcher.
- source_word: vault
  choice: voûte
  rationale: Rend directement l’image architecturale produite par la flamme arquée.
- source_word: made a wall round about
  choice: entoura comme d’un mur
  rationale: Préserve la métaphore du mur sans donner à entendre qu’une construction matérielle s’est formée.
- source_word: martyr
  choice: martyr
  rationale: Terme français courant dans ce récit de témoignage jusqu’à la mort, sans ajout doctrinal.
- source_word: frankincense
  choice: encens
  rationale: « Encens » est le terme français naturel pour l’oliban dans ce contexte odoriférant et cultuel.
- source_word: precious spice / aromate
  choice: aromate précieux
  rationale: Conserve la catégorie ancienne des substances parfumées de prix, plus exactement que le seul mot moderne « épice ».
theological_decisions:
- issue: Caractère merveilleux de la scène
  choice: Présenter le phénomène selon le témoignage narratif à la première personne, sans l’expliquer
  alternative: Le qualifier explicitement de miracle surnaturel ou le rationaliser comme simple effet visuel
  rationale: Le passage affirme que les témoins virent une chose merveilleuse, mais ne fournit pas d’explication causale ; la traduction conserve cette retenue.
- issue: Sens de la préservation des témoins
  choice: « si nous avons été préservés, c’est pour raconter »
  alternative: Identifier explicitement Dieu comme agent de leur préservation
  rationale: La tournure passive laisse l’agent implicite, comme dans le témoignage fourni, tout en maintenant la finalité exprimée.
- issue: « amen » comme offrande ou élévation
  choice: « fait monter son “amen” »
  alternative: « prononcé l’amen »
  rationale: La formulation retenue conserve la nuance d’une prière élevée ou offerte sans élaborer une théologie sacrificielle absente du passage.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme solennel du témoignage ancien est conservé, avec des phrases allégées pour la lisibilité. Cette rédaction s’appuie principalement sur le témoin anglais public fourni ; les choix grecs indiqués demeurent provisoires dans l’attente d’une collation directe de la tradition manuscrite.
