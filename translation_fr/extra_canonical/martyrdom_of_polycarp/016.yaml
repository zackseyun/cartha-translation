review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour rendre plus directement les passifs et les images du témoin : « si nous avons été préservés » introduisait une nuance conditionnelle absente de ἐτηρήθημεν, et « parfum si agréable » explicitait l’évaluation là où le texte constate une odeur/fragrance remarquable. « Bûcher » est plausible dans le contexte, mais « feu » correspond plus strictement au texte fourni et au grec πυρ.'
  naturalness: Le récit est globalement fluide et digne. « Faire monter son “amen” » demeure néanmoins peu naturel en français moderne ; « après avoir fait monter l’Amen » conserve l’élévation/offrande de l’expression tout en s’intégrant mieux à la phrase. La reprise du pronom dans la description du corps est clarifiée.
  terminology: « Martyr », « voûte », « encens » et « aromate précieux » conviennent. Les crochets doivent être maintenus sans en masquer le statut textuel provisoire. « Hommes préposés au feu » est une formulation claire, non anachronique et fidèle à « those tending the fire ».
  issues:
  - severity: medium
    issue: Nuance conditionnelle ajoutée dans « si nous avons été préservés »
    rationale: Le témoin dit que les narrateurs « were preserved » afin de rapporter l’événement ; il ne pose pas cette préservation comme une éventualité ou une concession.
  - severity: low
    issue: « Un parfum si agréable » interprète l’odeur
    rationale: Le texte décrit une fragrance comparable à l’encens ou à un aromate précieux, sans employer l’adjectif français « agréable » ; « une odeur si suave » reste descriptif et proche de l’image.
  - severity: low
    issue: « Le bûcher » est plus spécifique que « le feu »
    rationale: Le contexte permet cette compréhension, mais le texte de contrôle dit explicitement qu’ils allumèrent le feu. La traduction révisée conserve ce référent.
  - severity: low
    issue: Placement de l’ancre de note
    rationale: L’ancre est rapprochée immédiatement du segment entre crochets auquel la note se rapporte.
  revised_text: 'Après avoir fait monter l’Amen et achevé sa prière, les hommes préposés au feu allumèrent le feu. Alors une puissante flamme jaillit ; nous à qui il fut donné de voir, nous vîmes une merveille, et nous avons été préservés afin de raconter aux autres ce qui s’était passé.


    Le feu, prenant l’apparence d’une voûte, comme la voile d’un navire gonflée par le vent, formait tout autour du corps du martyr une muraille ; et celui-ci se trouvait au milieu, non comme de la chair qui brûle, mais [comme un pain qui cuit au four ou comme] de l’or et de l’argent affinés dans une fournaise.[a] Car nous percevions une odeur si suave qu’on aurait dit le parfum qui s’exhale de l’encens ou de quelque autre aromate précieux.'
  revised_footnotes:
  - marker: a
    text: Les mots entre crochets sont conservés d’après le témoin anglais fourni, où ils signalent une restitution textuelle ou une incertitude de transmission. La tradition manuscrite grecque doit encore être vérifiée directement.
    reason: Préserver explicitement le signal de texte incertain du témoin de travail, sans présenter la restitution comme assurée.
  revision_rationale: La révision maintient le caractère narratif et merveilleux du témoignage sans lui ajouter d’interprétation doctrinale. Elle remplace les formulations conditionnelles ou explicatives absentes du texte par des équivalents français naturels, tout en conservant les métaphores de la voûte, de la voile et de la muraille. Le texte reste provisoire, la base fournie étant un témoin anglais public et non une collation directe du grec.
