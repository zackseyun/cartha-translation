base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: fr
  text: 'Frères, nous vous écrivons pour vous raconter ce qui est arrivé à ceux qui ont subi le martyre, et tout particulièrement au bienheureux Polycarpe. Par son martyre, il mit fin à la persécution[a], comme s’il y avait apposé son sceau. En effet, presque tous les événements qui ont précédé sont arrivés afin que le Seigneur nous montre une fois encore un exemple de martyre conforme à l’Évangile.


    Polycarpe attendit d’être livré, comme le Seigneur lui-même, afin que nous devenions, nous aussi, ses imitateurs, en veillant non seulement à nos propres intérêts, mais aussi à ceux de notre prochain. Car l’amour véritable et ferme cherche non seulement son propre salut, mais aussi celui de tous les frères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit cesser la persécution ». Le témoin anglais attribue à son martyre l’arrêt de la persécution, image aussitôt complétée par celle du sceau qui en marque l’achèvement.'
    reason: La formulation ancienne « stayed the persecution » peut être mal comprise aujourd’hui; la note précise le sens retenu et conserve l’image d’achèvement.
lexical_decisions:
- source_word: brethren
  choice: Frères
  rationale: Conserve l’adresse communautaire de l’ancien témoin. Dans ce contexte, le pluriel peut désigner l’ensemble des croyants sans ajouter au texte une formulation double absente du témoin fourni.
- source_word: suffered martyrdom
  choice: ont subi le martyre
  rationale: Rend clairement le sens chrétien technique du martyre tout en gardant l’idée d’une épreuve endurée.
- source_word: the blessed Polycarp
  choice: le bienheureux Polycarpe
  rationale: « Bienheureux » restitue le titre honorifique ancien sans réduire le terme au simple bonheur psychologique.
- source_word: stayed the persecution
  choice: mit fin à la persécution
  rationale: 'Exprime le sens causal apparent du témoin anglais : le martyre de Polycarpe marque l’arrêt de la persécution. Une note signale la nuance possible.'
- source_word: set his seal upon it
  choice: y avait apposé son sceau
  rationale: Préserve l’image du sceau et son lien avec l’achèvement de la persécution.
- source_word: conformable to the Gospel
  choice: conforme à l’Évangile
  rationale: Formulation naturelle qui maintient l’Évangile comme norme du martyre décrit.
- source_word: he lingered
  choice: Polycarpe attendit
  rationale: Le nom est répété pour lever une ambiguïté pronominale en français. « Attendit » évite de suggérer indûment une hésitation ou une fuite.
- source_word: delivered up
  choice: livré
  rationale: Conserve le parallèle explicite avec la passion du Seigneur et la possible résonance du vocabulaire évangélique.
- source_word: looking ... to that which concerns
  choice: en veillant ... aux ... intérêts
  rationale: Rend l’orientation éthique de la phrase dans un français courant et fait entendre son écho probable à Philippiens 2.4 sans insérer de citation explicite.
- source_word: true and steadfast love
  choice: l’amour véritable et ferme
  rationale: Préserve les deux qualités, l’authenticité et la constance, sans vocabulaire confessionnel ajouté.
- source_word: desire that ... be saved
  choice: cherche ... le salut
  rationale: Formulation française idiomatique qui conserve le sens sotériologique plutôt que de l’affaiblir en simple bien-être.
theological_decisions:
- issue: Rapport entre le martyre de Polycarpe et celui du Seigneur
  choice: 'Maintien explicite du parallèle : « comme le Seigneur lui-même »'
  alternative: Présenter Polycarpe comme reproduisant exactement et en tout point la passion du Christ
  rationale: Le passage appelle à l’imitation, mais ne confond pas Polycarpe avec le Seigneur et ne lui attribue pas le même rôle salvifique.
- issue: Sens de « conforme à l’Évangile »
  choice: Conserver la formule sans en définir davantage le contenu
  alternative: L’expliquer comme une doctrine particulière du martyre volontaire ou providentiel
  rationale: Le témoin affirme une conformité à l’Évangile, mais cette seule section ne justifie pas une interprétation confessionnelle plus précise.
- issue: Portée du salut recherché
  choice: « son propre salut » et « celui de tous les frères »
  alternative: Remplacer « salut » par « sécurité » ou affirmer ici un mécanisme sotériologique précis
  rationale: Le vocabulaire du témoin est sotériologique, mais le moyen exact par lequel ce salut est recherché n’est pas développé dans ce passage.
- issue: Sujet de l’imitation
  choice: Le pronom « ses » renvoie naturellement à Polycarpe dans la continuité de la phrase, tandis que Polycarpe imite le Seigneur
  alternative: Faire de « lui » une référence directe et exclusive au Seigneur
  rationale: La structure du témoin permet une tension entre l’imitation de Polycarpe et, à travers lui, celle du Seigneur. La traduction évite d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les phrases ont été légèrement réorganisées pour la fluidité, sans effacer les répétitions argumentatives. Draft provisoire fondé sur le témoin anglais public fourni; une vérification directe de la tradition manuscrite grecque reste nécessaire, notamment pour les verbes rendus par « mit fin », « attendit » et « livré ».
