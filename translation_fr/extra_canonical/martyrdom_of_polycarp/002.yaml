review_pass:
  verdict: revise
  source_fidelity: 'La révision rétablit plus clairement la structure de la phrase concernant Polycarpe : il met fin à la persécution en la scellant, pour ainsi dire, par son martyre. Elle conserve aussi la portée de « nearly all », le pluriel de « neighbors » et le sens de désir dans la dernière phrase. « Lui » dans « imitateurs de lui » est rendu par une reprise explicite de Polycarpe, conformément au mouvement immédiat de la phrase, sans nier le parallèle préalable avec le Seigneur.'
  naturalness: Le texte proposé est naturel en français international moderne et garde un registre ecclésial sobre. « C’est le propre d’un amour véritable et constant » rend idiomatiquement la formulation ancienne sans archaïsme excessif. « Avoir souci de » est plus proche et plus fluide que « veiller aux intérêts » dans ce contexte.
  terminology: « Frères », « bienheureux », « martyre », « Seigneur », « Évangile » et « salut » sont conservés. « Constant » rend ici plus naturellement que « ferme » la stabilité de l’amour. La note conserve l’incertitude de nuance de l’expression relative à l’arrêt de la persécution et maintient l’image du sceau.
  issues:
  - severity: medium
    issue: La première phrase dissociait et réordonnait fortement l’arrêt de la persécution et l’image du sceau.
    rationale: 'Le témoin présente Polycarpe comme mettant fin à la persécution, pour ainsi dire en y apposant le sceau de son martyre. La formulation « Par son martyre, il mit fin ... comme s’il y avait apposé son sceau » obscurcit cette image et omet l’idée explicite du « sceau de son martyre ». '
  - severity: low
    issue: « Tous les événements qui ont précédé » ne rendait pas explicitement « presque tous ».
    rationale: La restriction quantitative du témoin doit être conservée.
  - severity: low
    issue: « Notre prochain » au singulier et « cherche » atténuaient ou modifiaient légèrement le texte.
    rationale: Le témoin vise les « voisins/proches » au pluriel et parle de désirer le salut, non d’en poursuivre le moyen.
  revised_text: 'Frères, nous vous écrivons pour vous raconter ce qui est arrivé à ceux qui ont subi le martyre, et tout particulièrement au bienheureux Polycarpe, qui mit fin à la persécution[a], comme en y apposant, par son martyre, le sceau de son achèvement. En effet, presque tous les événements précédents se sont produits afin que le Seigneur nous montre une fois encore un exemple de martyre conforme à l’Évangile.


    Polycarpe attendit d’être livré, comme le Seigneur lui-même, afin que nous aussi nous devenions ses imitateurs, en ayant souci non seulement de ce qui nous concerne, mais aussi de ce qui concerne nos proches. Car c’est le propre d’un amour véritable et constant de désirer non seulement son propre salut, mais aussi celui de tous les frères.'
  revised_footnotes:
  - marker: a
    text: 'Ou : « fit cesser la persécution ». L’expression décrit Polycarpe comme mettant un terme à la persécution, tout en la comparant à un acte qui en scelle l’achèvement par son martyre.'
    reason: Le verbe rendu par « mit fin » peut aussi être exprimé par « fit cesser » ; la note conserve cette nuance et explicite l’image du sceau sans imposer une interprétation supplémentaire.
  revision_rationale: Une correction est nécessaire pour mieux reproduire l’enchaînement du témoin et pour préserver plusieurs détails de sens. La révision ne dépend d’aucune interprétation confessionnelle et ne prétend pas résoudre au-delà des données fournies les questions qui demanderaient un contrôle direct de la tradition grecque.
