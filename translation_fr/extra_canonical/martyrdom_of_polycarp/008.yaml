    Ils y consentirent. Alors il se tint debout et pria, si rempli de la grâce de Dieu que, pendant deux heures, il ne put garder le silence. Ceux qui l’entendaient étaient stupéfaits, et beaucoup regrettèrent d’être venus s’en prendre à un vieillard aussi vénérable.'
