base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: fr
  text: 'Ils emmenèrent donc le jeune homme avec eux et, le vendredi vers l’heure du dîner, les agents et les cavaliers partirent avec leurs armes habituelles, se hâtant comme s’ils allaient arrêter un brigand. Arrivés tous ensemble tard dans la soirée, ils trouvèrent Polycarpe lui-même couché dans une chambre à l’étage d’une petite maison. Il aurait pu partir de là pour se rendre ailleurs, mais il ne le voulut pas et dit : « Que la volonté de Dieu soit faite. »


    Lorsqu’il apprit leur arrivée, il descendit et s’entretint avec eux. Les personnes présentes s’émerveillaient de son grand âge et de sa fermeté ; elles se demandaient pourquoi on mettait tant d’empressement à arrêter un vieillard comme lui. Aussitôt, il ordonna qu’on leur serve à manger et à boire, à cette heure-là, autant qu’ils le désiraient. Puis il les persuada de lui accorder une heure pour prier sans être dérangé.


    Ils y consentirent. Alors il se tint debout et pria, si rempli de la grâce de Dieu que, pendant deux heures, il ne put garder le silence. Ceux qui l’entendaient étaient stupéfaits, et beaucoup regrettèrent d’être venus arrêter un vieillard aussi vénérable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: jeune homme
  rationale: « Jeune homme » rend naturellement l’âge relatif du personnage sans le rabaisser comme pourrait le faire « garçon ».
- source_word: gendarmes
  choice: agents
  rationale: Le témoin anglais emploie un terme moderne et culturellement marqué. « Agents » désigne sobrement les hommes chargés de l’arrestation, sans leur attribuer précisément un corps français contemporain.
- source_word: robber
  choice: brigand
  rationale: « Brigand » convient au contexte d’une expédition armée contre un criminel dangereux et conserve la résonance biblique de la comparaison.
- source_word: constancy
  choice: fermeté
  rationale: « Fermeté » exprime ici la stabilité courageuse de Polycarpe de manière naturelle en français moderne.
- source_word: repented
  choice: regrettèrent
  rationale: Dans ce contexte, le verbe indique qu’ils regrettent leur participation à l’arrestation ; « regrettèrent » évite d’imposer le sens plus spécifiquement religieux de « se repentirent ».
- source_word: could not hold his peace
  choice: ne put garder le silence
  rationale: Cette formulation conserve l’expression du témoin et son possible caractère rhétorique, plutôt que de la réduire à « continua de prier ».
theological_decisions:
- issue: Formule d’acceptation de la volonté divine
  choice: « Que la volonté de Dieu soit faite. »
  alternative: « La volonté de Dieu sera faite. »
  rationale: Le subjonctif français préserve la valeur traditionnelle et probablement volitive de la formule sans la transformer en simple prédiction.
- issue: Grâce de Dieu et durée de la prière
  choice: « si rempli de la grâce de Dieu que, pendant deux heures, il ne put garder le silence »
  alternative: « par la grâce de Dieu, il parla sans interruption pendant deux heures »
  rationale: La formulation retenue conserve explicitement le lien causal présenté par le témoin, sans expliquer davantage la nature de cette grâce.
- issue: Sens de la réaction des agents
  choice: « beaucoup regrettèrent »
  alternative: « beaucoup se repentirent »
  rationale: Le contexte immédiat porte sur le regret d’être venus l’arrêter. Le choix évite de conclure à une conversion religieuse que le passage n’affirme pas explicitement.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des phrases claires tout en conservant le ton solennel du récit de martyre. « Polycarpe » explicite une fois le référent de « l’homme lui-même » afin d’éviter une tournure française obscure. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe du grec reste nécessaire.
