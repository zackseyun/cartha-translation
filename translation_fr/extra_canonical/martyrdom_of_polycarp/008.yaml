review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour resserrer quelques points du témoin grec/anglais : « arrivant en groupe », l’information qu’il entend qu’ils sont arrivés, et le regret d’être venus « contre » lui ne doivent pas être réduits à une simple arrestation. Le nom de Polycarpe, explicité dans le projet, n’est pas requis par la phrase-source et peut être évité sans perte de clarté.'
  naturalness: Le français est globalement fluide et d’un registre narratif approprié. « À cette heure-là » est cependant un peu lourd dans cette construction ; « aussitôt » rend mieux l’enchaînement. « Ils y consentirent » peut être conservé, mais une reprise explicite de la demande améliore la lisibilité.
  terminology: « Jeune homme », « agents », « cavaliers », « brigand », « fermeté » et « grâce de Dieu » sont recevables en français moderne. « Regrettèrent » préserve utilement l’ambiguïté de μετενόησαν / « repented », sans imposer une conversion religieuse. « S’en prendre à » rend naturellement la direction hostile de « came against » sans prétendre que le texte décrit seulement une procédure d’arrestation.
  issues:
  - severity: low
    issue: « Arrivés tous ensemble » ne rend pas précisément l’arrivée en groupe.
    rationale: Le témoin dit qu’ils arrivent « in a body ». « Arrivés en groupe » est plus direct et ne suggère pas seulement une simultanéité.
  - severity: medium
    issue: « Lorsqu’il apprit leur arrivée » affaiblit légèrement « he heard that they had come ».
    rationale: La formulation révisée garde l’idée qu’il entendit qu’ils étaient arrivés, sans préciser le canal de l’information.
  - severity: medium
    issue: « Regrettèrent d’être venus arrêter » restreint « came against ».
    rationale: Le texte exprime leur regret d’être venus contre/s’en prendre à cet homme vénérable ; il ne qualifie pas explicitement leur action uniquement comme une arrestation.
  revised_text: 'Ils emmenèrent donc le jeune homme avec eux et, le vendredi vers l’heure du dîner, les agents et les cavaliers partirent avec leurs armes habituelles, se hâtant comme s’ils allaient arrêter un brigand. Arrivés en groupe tard dans la soirée, ils le trouvèrent lui-même couché dans une chambre à l’étage d’une petite maison. Il aurait pu partir de là pour se rendre ailleurs, mais il ne le voulut pas et dit : « Que la volonté de Dieu soit faite. »


