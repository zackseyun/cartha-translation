revisions:
- from: 'Le centurion, voyant donc l’opposition suscitée par les Juifs, fit placer Polycarpe au milieu et ordonna de brûler son corps, selon leur coutume.[a]


    Ensuite, nous avons recueilli ses os, plus précieux que des pierres précieuses et plus fins que l’or affiné, et nous les avons déposés dans un lieu approprié.


    Là, le Seigneur nous permettra de nous réunir, dans la mesure du possible, dans l’allégresse et la joie, et de célébrer l’anniversaire de son martyre[b] : nous commémorerons ainsi ceux qui ont déjà soutenu le combat, et ceux qui le soutiendront à l’avenir y trouveront formation et préparation.'
  to: 'Le centurion donc, voyant l’opposition soulevée par les Juifs, plaça Polycarpe au milieu et le brûla selon leur coutume.[a]


    Ensuite, nous avons recueilli ses os, plus précieux que des pierres de grand prix et plus purs que l’or affiné, et nous les avons déposés dans un lieu approprié.


    C’est là que le Seigneur nous permettra, dans la mesure du possible, de nous réunir dans l’allégresse et la joie, et de célébrer l’anniversaire de son martyre[b], en mémoire de ceux qui ont déjà combattu, et pour l’entraînement et la préparation de ceux qui le feront à l’avenir.'
  rationale: Une correction complète est nécessaire pour supprimer l’amplification de la première phrase et pour rétablir la structure des deux finalités de la célébration. La traduction conserve la sobriété du récit, l’estime concrète accordée aux os et l’image agonistique, sans faire de la comparaison une affirmation doctrinale ni expliquer au-delà du texte l’expression relative à la coutume.
