base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: fr
  text: 'Le centurion donc, voyant l’opposition soulevée par les Juifs, plaça Polycarpe au milieu et le brûla selon leur coutume.[a]


    Ensuite, nous avons recueilli ses os, plus précieux que des pierres de grand prix et plus purs que l’or affiné, et nous les avons déposés dans un lieu approprié.


    C’est là que le Seigneur nous permettra, dans la mesure du possible, de nous réunir dans l’allégresse et la joie, et de célébrer l’anniversaire de son martyre[b], en mémoire de ceux qui ont déjà combattu, et pour l’entraînement et la préparation de ceux qui le feront à l’avenir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « leur » renvoie grammaticalement aux Juifs mentionnés dans la phrase. Le texte ne précise pas ici en quoi consistait cette coutume.
    reason: La note clarifie l’antécédent grammatical sans attribuer au texte une explication historique ou polémique qui n’y est pas formulée.
  - marker: b
    text: 'Littéralement : « le jour de naissance de son martyre », expression ancienne employée ici pour la commémoration annuelle de son martyre.'
    reason: La note préserve l’image de la naissance tout en laissant au texte français une expression moderne et non confessionnellement interprétée.
lexical_decisions:
- source_word: set him in the midst and burnt him
  choice: fit placer Polycarpe au milieu et ordonna de brûler son corps
  rationale: Le contexte postérieur à l’exécution appelle vraisemblablement la crémation du corps; l’ajout explicite de « son corps » évite en français de donner à croire à une seconde mise à mort, tandis que « ordonna » rend naturellement l’action du centurion.
- source_word: bones
  choice: os
  rationale: Rendu direct et concret, sans introduire le vocabulaire ecclésiastique plus interprétatif de « reliques ».
- source_word: more valuable than precious stones and finer than refined gold
  choice: plus précieux que des pierres précieuses et plus fins que l’or affiné
  rationale: Conserve le parallélisme évaluatif et l’image matérielle du témoignage.
- source_word: birth-day of his martyrdom
  choice: anniversaire de son martyre
  rationale: Exprime en français courant la commémoration annuelle, tout en signalant en note l’image ancienne du « jour de naissance ».
- source_word: fought in the contest
  choice: soutenu le combat
  rationale: Préserve la métaphore athlétique ou agonistique sans la réduire à un combat militaire.
- source_word: training and preparation
  choice: formation et préparation
  rationale: Maintient les deux notions distinctes et leur orientation vers les futurs martyrs.
theological_decisions:
- issue: Valeur attribuée aux os de Polycarpe
  choice: Conserver sans atténuation la comparaison avec les pierres précieuses et l’or
  alternative: Employer « reliques » ou expliquer une pratique de vénération
  rationale: Le passage exprime clairement l’estime de la communauté pour les restes du martyr, mais ne formule pas ici une doctrine complète de leur vénération; le texte reste donc concret et non confessionnel.
- issue: « Anniversaire » ou naissance céleste du martyr
  choice: « anniversaire de son martyre » dans le texte, avec l’expression littérale en note
  alternative: « jour de sa naissance au ciel »
  rationale: La formulation littérale peut porter une interprétation théologique ancienne, mais « anniversaire de son martyre » rend sûrement la fonction commémorative attestée sans imposer l’explication « au ciel ».
- issue: Mention des Juifs et « leur coutume »
  choice: Conserver l’attribution du témoignage tout en signalant l’ambiguïté du référent
  alternative: Identifier explicitement une coutume juive ou romaine
  rationale: Le témoignage anglais rattache grammaticalement la coutume aux Juifs, mais le sens précis et la base grecque doivent être vérifiés; une note empêche de surinterpréter cette remarque polémique.
translation_notes:
  register: Français international moderne, sobre et digne. Le récit communautaire à la première personne est conservé. La métaphore du combat et la joie commémorative demeurent visibles. Projet provisoire fondé sur le témoin anglais public fourni; une collation directe du grec reste indispensable, notamment pour la première phrase et l’expression « jour de naissance ».
