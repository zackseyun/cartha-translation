translation:
  language: fr
  text: 'Tout cela se passa avec une rapidité impossible à décrire. Aussitôt, la foule alla chercher dans les ateliers et les bains publics du bois et des fagots. Les Juifs, en particulier, y mirent beaucoup de zèle, comme ils en ont l’habitude.[a]


    Quand le bûcher fut prêt, Polycarpe retira tous ses vêtements de dessus et défit sa ceinture. Il essaya aussi d’enlever ses sandales, bien qu’il n’eût pas l’habitude de le faire lui-même auparavant, car tous les fidèles rivalisaient toujours d’empressement pour être les premiers à toucher son corps. En effet, à cause de sa vie sainte, on l’avait entouré de tous les honneurs avant même que ses cheveux ne blanchissent.


    On plaça aussitôt autour de lui les matériaux préparés pour le bûcher. Comme on allait aussi le clouer au poteau, il dit : « Laissez-moi ainsi. Celui qui me donne la force de supporter le feu me donnera aussi de rester immobile sur le bûcher, sans que vous ayez besoin de me maintenir avec des clous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette phrase rapporte la caractérisation polémique de l’auteur ancien dans le contexte local du récit. Elle ne doit pas être comprise comme une affirmation générale sur le peuple juif, hier ou aujourd’hui.
    reason: Prévenir une lecture antisémite anachronique tout en conservant sans l’atténuer la formulation historiquement sensible du témoin.
lexical_decisions:
- source_word: timber and faggots
  choice: du bois et des fagots
  rationale: Conserve la distinction entre les pièces de bois et les petits faisceaux combustibles, dans un français actuel.
- source_word: upper garments
  choice: vêtements de dessus
  rationale: Rend la portée vestimentaire sans supposer un vêtement antique précis que le témoin fourni ne permet pas d’identifier.
- source_word: shoes
  choice: sandales
  rationale: Choix naturel dans le contexte antique, tout en restant intelligible au lectorat moderne.
- source_word: flesh
  choice: corps
  rationale: « Chair » serait possible, mais « corps » exprime ici plus naturellement le contact physique respectueux recherché par les fidèles.
- source_word: stake
  choice: poteau
  rationale: Évite de préciser indûment la forme de l’instrument et correspond à l’objet auquel Polycarpe devait être fixé.
- source_word: remain at the pile unmoved
  choice: rester immobile sur le bûcher
  rationale: Préserve l’idée de constance physique sans la transformer en affirmation abstraite de courage.
theological_decisions:
- issue: Identité de « Celui qui » accorde l’endurance
  choice: « Celui qui me donne la force » avec une majuscule initiale liée à la position en début de phrase seulement
  alternative: « Dieu, qui me donne la force »
  rationale: Le référent divin est clair dans le contexte, mais le nom de Dieu n’est pas explicitement présent dans le témoin; la traduction n’ajoute donc pas cette identification au corps du texte.
- issue: Description honorifique de la sainteté de Polycarpe
  choice: « à cause de sa vie sainte, on l’avait entouré de tous les honneurs »
  alternative: « il était honoré pour sa sainteté »
  rationale: Conserve la relation entre sa conduite sainte et l’honneur reçu, sans introduire une doctrine particulière de la vénération des saints.
- issue: Affirmation concernant « les Juifs »
  choice: Conservation dans le texte avec note historique
  alternative: Généralisation en « certains habitants » ou omission
  rationale: La mention appartient au témoignage ancien et ne doit pas être effacée; une note empêche toutefois de la transformer en jugement général contre les Juifs de toute époque.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme rapide du premier paragraphe est conservé par des phrases brèves. Les archaïsmes du témoin anglais ont été actualisés. Puisque le texte grec n’a pas été fourni et que la révision directe de la tradition manuscrite est signalée comme restant à faire, ce projet demeure explicitement fondé sur le témoin anglais public fourni; les choix susceptibles de dépendre du grec devront être vérifiés avant publication définitive.
