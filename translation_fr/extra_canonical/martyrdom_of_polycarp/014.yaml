review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit globalement le témoin anglais et conserve la séquence narrative. Deux points demandent correction : « matériaux préparés » réduit indûment les « instruments » placés autour de Polycarpe, et « sans que vous ayez besoin » n’explicite pas la « garantie » que les exécutants cherchent à obtenir par les clous. La révision du grec reste nécessaire, puisque le dossier ne fournit qu’un témoin anglais ; les corrections proposées sont néanmoins également cohérentes avec la formulation grecque traditionnellement éditée.'
  naturalness: Le français est clair, actuel et d’un registre narratif approprié. « Retira tous ses vêtements de dessus » est un peu lourd ; « retira tous ses vêtements » est plus idiomatique sans imposer une identification vestimentaire antique précise. La formulation de la parole finale est resserrée pour préserver son opposition précise aux clous.
  terminology: '« Bûcher », « poteau », « fidèles » et « vie sainte » conviennent. La note sur la mention des Juifs est nécessaire et correctement formulée : elle situe la caractérisation polémique de l’auteur sans supprimer ni généraliser le propos ancien. « Sandales » demeure une adaptation contextuelle plausible de « chaussures », mais « chaussures » évite une précision non exigée par le témoin ; ce terme est retenu dans la révision.'
  issues:
  - severity: medium
    issue: « matériaux préparés pour le bûcher » pour « instruments ... prepared for the pile »
    rationale: Des matériaux combustibles ne sont pas nécessairement des instruments. Le texte décrit des instruments/dispositifs placés autour de lui ; la traduction doit conserver cette catégorie sans la réduire à du combustible.
  - severity: medium
    issue: Perte de « the security which ye seek from the nails »
    rationale: « Sans que vous ayez besoin de me maintenir avec des clous » exprime le résultat pratique, mais omet la garantie ou assurance que les bourreaux cherchent à obtenir. Il faut préserver cette motivation telle qu’elle est formulée.
  - severity: low
    issue: « vêtements de dessus » et « sandales »
    rationale: Le premier syntagme est peu naturel en français moderne, et le second spécifie davantage que « shoes ». « Vêtements » et « chaussures » sont plus fluides et plus prudents.
  revised_text: 'Tout cela se passa avec une rapidité impossible à décrire. Aussitôt, la foule alla chercher dans les ateliers et les bains publics du bois et des fagots. Les Juifs, en particulier, y prêtèrent leur concours avec zèle, comme ils en ont l’habitude.[a]


    Quand le bûcher fut prêt, Polycarpe retira tous ses vêtements et défit sa ceinture. Il essaya aussi d’enlever ses chaussures, bien qu’il n’eût pas l’habitude de le faire auparavant, car tous les fidèles rivalisaient toujours d’empressement pour être les premiers à toucher son corps. En effet, on l’avait entouré de tous les honneurs pour sa vie sainte, avant même que ses cheveux ne blanchissent.


    Aussitôt, on plaça autour de lui les instruments préparés pour le bûcher. Comme on allait aussi le clouer au poteau, il dit : « Laissez-moi ainsi. Celui qui m’a accordé d’endurer le feu m’accordera aussi de rester immobile au bûcher, même sans la garantie que vous cherchez à obtenir par les clous. »'
  revised_footnotes:
  - marker: a
    text: Cette phrase rapporte la caractérisation polémique de l’auteur ancien dans le contexte local du récit. Elle ne doit pas être comprise comme une affirmation générale sur le peuple juif, hier ou aujourd’hui.
    reason: Prévenir une lecture antisémite anachronique tout en conservant, sans l’atténuer, la formulation historiquement sensible du témoin.
  revision_rationale: 'La révision maintient le sens et le registre du projet tout en rétablissant deux éléments sémantiques précis du témoin : les instruments disposés autour du martyr et la garantie recherchée par les clous. Elle allège aussi deux choix lexicaux inutilement spécifiques ou lourds. La note historique est conservée avec son ancre au point de la mention sensible.'
