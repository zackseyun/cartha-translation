  footnotes:
  - marker: a
    text: Le pronom du témoin peut être compris comme renvoyant à Gaïus ; la formulation demeure toutefois difficile. Cette section repose provisoirement sur un témoin anglais, dans l’attente d’une vérification directe du grec.
    reason: Signaler une ambiguïté référentielle réelle et la limite de la base documentaire fournie.
  - marker: b
    text: Le manuscrit de Moscou transmet ici une forme développée et différente des paragraphes précédents ; elle est reproduite comme variante manuscrite, sans harmonisation.
    reason: Distinguer clairement la variante textuelle du corps précédent.
  - marker: c
    text: 'Ici, « universelle » rend le sens ancien de « catholique » : ce qui concerne l’ensemble de l’Église, sans référence nécessaire à une dénomination moderne.'
    reason: Éviter un anachronisme confessionnel tout en expliquant le terme historique.
  - marker: d
    text: La première forme nomme « Socrate », tandis que la variante du manuscrit de Moscou nomme « Isocrate ». Les deux noms sont conservés tels qu’ils apparaissent dans les témoins.
    reason: Préserver une variante onomastique substantielle.
lexical_decisions:
- source_word: God speed
  choice: Nous vous souhaitons de marcher avec Dieu
  rationale: Rend la formule de bénédiction et son lien immédiat avec la marche chrétienne sans employer l’archaïque « Dieu vous garde ».
- source_word: walk by the word
  choice: vous vous conduisez selon la parole
  rationale: L’expression biblique de la « marche » désigne la conduite ; la formulation française reste claire tout en préservant l’image dans la proposition introductive.
- source_word: papers / writings
  choice: écrits
  rationale: Terme assez large pour des documents ou écrits attribués à Irénée, sans imposer le sens moderne de « papiers ».
- source_word: gathering it together
  choice: J’en ai rassemblé le texte
  rationale: Exprime un travail de récupération et de reconstitution d’un exemplaire détérioré.
- source_word: catholic rule of the Church
  choice: règle universelle de l’Église
  rationale: Restitue ici le sens ancien de katholikos, « universel », tout en évitant qu’un lecteur moderne y voie nécessairement une désignation confessionnelle ultérieure.
- source_word: orthodox
  choice: conformes à la vraie foi
  rationale: Rend le sens qualitatif ancien sans transformer l’adjectif en étiquette institutionnelle moderne.
- source_word: city of the Romans
  choice: ville des Romains
  rationale: Conserve la tournure du témoin plutôt que de la réduire silencieusement à « Rome ».
- source_word: is martyred
  choice: subit le martyre
  rationale: Formulation française naturelle qui conserve l’idée d’une mise à mort en témoignage de foi.
theological_decisions:
- issue: Référent de « with whom / par lui » dans la doxologie initiale
  choice: Par lui, gloire soit rendue à Dieu
  alternative: À lui soit la gloire auprès de Dieu
  rationale: Le témoin anglais présente une syntaxe difficile. La traduction retient une médiation christologique plausible sans assimiler silencieusement Jésus à Dieu dans cette phrase particulière ; l’ambiguïté textuelle demeure signalée.
- issue: « catholic rule »
  choice: règle universelle de l’Église
  alternative: règle catholique de l’Église
  rationale: Le contexte ancien vise l’universalité et la norme commune de l’Église ; « catholique » risquerait une lecture confessionnelle anachronique.
- issue: Doxologie et variantes trinitaires
  choice: Préserver séparément « avec le Père et le Saint-Esprit » puis « avec le Père, le Fils et le Saint-Esprit »
  alternative: Harmoniser les deux formules
  rationale: Les formes transmises diffèrent ; leur tension ne doit pas être supprimée par harmonisation.
- issue: Révélation de Polycarpe à Pionius
  choice: s’est montré à moi dans une révélation / en obéissance à une révélation
  alternative: m’est apparu en vision
  rationale: « Révélation » suit le témoin et ne précise pas davantage la nature de l’expérience.
translation_notes:
  register: Français international moderne, digne et accessible. Les longues périodes ont été légèrement segmentées pour la lisibilité, sans supprimer les reprises propres aux colophons. Les titres honorifiques « bienheureux » et « saint » sont conservés comme éléments du témoin ancien, non comme prises de position confessionnelles. Le texte reste provisoire, car la source fournie est un témoin anglais du grec et la révision directe de la tradition grecque est annoncée comme en attente.
