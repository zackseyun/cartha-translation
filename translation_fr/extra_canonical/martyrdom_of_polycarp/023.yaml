translation:
  language: fr
  text: 'Nous vous souhaitons de marcher avec Dieu, frères, tandis que vous vous conduisez selon la parole de Jésus-Christ conforme à l’Évangile. Par lui, gloire soit rendue à Dieu pour le salut de ses saints élus, tout comme le bienheureux Polycarpe a subi le martyre. Puissions-nous être trouvés sur ses traces dans le royaume de Jésus-Christ.


    Gaïus a copié ce récit d’après les écrits d’Irénée, disciple de Polycarpe. Gaïus avait lui aussi vécu avec Irénée.[a]


    Et moi, Socrate, je l’ai transcrit à Corinthe d’après la copie de Gaïus. Que la grâce soit avec tous.


    Et moi, Pionius, je l’ai transcrit à mon tour d’après la copie mentionnée plus haut, après l’avoir recherchée — car le bienheureux Polycarpe s’est montré à moi dans une révélation, comme je le raconterai par la suite. J’en ai rassemblé le texte alors que le manuscrit était presque entièrement usé par le temps, afin que le Seigneur Jésus-Christ me rassemble, moi aussi, avec ses élus dans son royaume céleste. À lui soit la gloire, avec le Père et le Saint-Esprit, pour les siècles des siècles. Amen.


    Les trois paragraphes précédents se lisent ainsi dans le manuscrit de Moscou :[b]


    Gaïus a copié ce récit d’après les écrits d’Irénée. Gaïus avait vécu avec Irénée, qui avait été disciple du saint Polycarpe. En effet, cet Irénée se trouvait à Rome au moment du martyre de l’évêque Polycarpe et il en instruisit beaucoup. De très nombreux traités de sa main, remarquables et conformes à la vraie foi, sont en circulation. Il y mentionne Polycarpe et dit avoir reçu son enseignement. Il réfuta avec force toute hérésie et transmit la règle universelle de l’Église telle qu’il l’avait reçue du saint.[c] Il rapporte aussi le fait suivant : un jour, Marcion, dont les marcionites tirent leur nom, rencontra le saint Polycarpe et lui dit : « Reconnais-nous, Polycarpe ! » Celui-ci répondit à Marcion : « Oui, je reconnais le premier-né de Satan. » On lit encore dans les écrits d’Irénée que, le jour et à l’heure mêmes où Polycarpe subissait le martyre à Smyrne, Irénée, qui se trouvait dans la ville des Romains, entendit une voix semblable au son d’une trompette déclarer : « Polycarpe
    subit le martyre. »


    C’est donc d’après ces écrits d’Irénée, comme il a déjà été dit, que Gaïus fit une copie ; puis, à Corinthe, Isocrate en fit une autre d’après celle de Gaïus.[d]


    Et moi, Pionius, je l’ai transcrit à mon tour d’après la copie d’Isocrate, après l’avoir recherchée en obéissance à une révélation du saint Polycarpe. J’en ai rassemblé le texte alors que le manuscrit était presque entièrement usé par le temps, afin que le Seigneur Jésus-Christ me rassemble, moi aussi, avec ses élus dans son royaume céleste. À lui soit la gloire, avec le Père, le Fils et le Saint-Esprit, pour les siècles des siècles. Amen.'
