  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: fr
  text: 'Vous aviez demandé que les événements vous soient exposés plus en détail. Mais, pour le moment, nous vous en avons donné un résumé par l’intermédiaire de notre frère Marcianus. Quand vous en aurez pris connaissance, faites aussi circuler la lettre parmi les frères et sœurs qui sont plus éloignés, afin qu’eux aussi glorifient le Seigneur, qui choisit parmi ses propres serviteurs.


    À celui qui peut, par sa grâce et sa générosité, nous faire tous entrer dans son royaume éternel par son Fils unique, Jésus-Christ, soient la gloire, l’honneur, la puissance et la grandeur pour toujours. Saluez tous les saints. Ceux qui sont avec nous vous saluent, ainsi qu’Euarestus, qui a écrit la lettre, et toute sa maison.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: showed / certified (English witness for Greek tradition pending review)
  choice: exposés / donné un résumé
  rationale: 'Rend naturellement les deux actions distinctes du témoin anglais : un récit détaillé demandé, puis une information provisoire sous forme abrégée.'
- source_word: brother Marcianus
  choice: notre frère Marcianus
  rationale: Conserve le langage communautaire ancien et le nom transmis par le témoin fourni.
- source_word: send the letter about
  choice: faites aussi circuler la lettre
  rationale: Exprime clairement l’idée de transmettre la lettre de communauté en communauté, sans alourdir la formulation.
- source_word: brethren
  choice: les frères et sœurs
  rationale: Dans cette adresse collective, le masculin grec ou ancien peut viser l’ensemble des membres de la communauté ; la formulation française explicite cette portée inclusive.
- source_word: maketh election from His own servants
  choice: qui choisit parmi ses propres serviteurs
  rationale: Préserve le sens d’élection ou de choix et la relation exprimée par « parmi », sans préciser davantage l’objet ou le mode de ce choix.
- source_word: bounty
  choice: générosité
  rationale: Terme moderne et digne qui conserve l’idée de bienfaisance abondante.
- source_word: only-begotten Son
  choice: Fils unique
  rationale: Formulation française naturelle et traditionnelle qui exprime l’unicité filiale sans introduire une explication technique absente du passage.
- source_word: saints
  choice: saints
  rationale: Conserve l’appellation communautaire ancienne sans la paraphraser.
- source_word: house
  choice: maison
  rationale: Maintient l’ambiguïté historique entre maisonnée, famille et personnes attachées au foyer.
theological_decisions:
- issue: Le choix opéré par le Seigneur
  choice: « qui choisit parmi ses propres serviteurs »
  alternative: « qui élit ses propres serviteurs »
  rationale: La traduction retenue conserve la tension de l’expression sans imposer une lecture doctrinale précise de l’élection ni transformer « parmi » en simple objet direct.
- issue: L’entrée dans le royaume éternel
  choice: « peut, par sa grâce et sa générosité, nous faire tous entrer »
  alternative: « est capable de nous conduire tous »
  rationale: La formulation garde ensemble la capacité divine, les moyens gracieux et la destination finale, sans définir le mécanisme sotériologique.
- issue: Le titre filial du Christ
  choice: « son Fils unique »
  alternative: « son Fils unique-engendré »
  rationale: « Fils unique » est intelligible en français moderne et demeure théologiquement sobre ; la révision directe du grec reste nécessaire pour déterminer si une note sur le terme sous-jacent s’impose.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe épistolaire fluide. Le texte reste provisoire puisque les données fournies signalent qu’un contrôle direct de la tradition manuscrite grecque est encore en attente. Les noms propres Marcianus et Euarestus sont conservés sous la forme du témoin fourni afin d’éviter une rétroversion conjecturale.
