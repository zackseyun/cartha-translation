base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: fr
  text: Le dernier souverain de ce temps-là sera laissé en vie lorsque la multitude de ses troupes aura été frappée par l’épée. Il sera alors enchaîné, et on le fera monter sur le mont Sion. Mon Messie lui reprochera toutes ses impiétés et placera devant lui toutes les mauvaises actions de ses troupes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܗ
  choice: ses impiétés
  rationale: « Impiétés » conserve la dimension religieuse et morale de la faute dévoilée par le Messie, plutôt que de réduire celle-ci à une simple méchanceté politique.
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: toutes les mauvaises actions de ses troupes
  rationale: Cette formulation naturelle en français maintient à la fois l’idée d’actes concrets, leur caractère mauvais et leur portée collective.
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: le mont Sion
  rationale: C’est la forme française courante du nom propre et elle préserve le lieu précis de la scène de jugement.
- source_word: ܡܫܝܚܝ
  choice: mon Messie
  rationale: Le possessif et le titre messianique explicites sont conservés sans paraphrase ni interprétation supplémentaire.
- source_word: ܫܠܝܛܐ / chef souverain dans le contexte
  choice: souverain
  rationale: « Souverain » exprime clairement la fonction politique du dernier dirigeant tout en restant naturel dans le registre apocalyptique.
theological_decisions:
- issue: Le rôle du Messie dans le jugement du dernier souverain
  choice: Le Messie est présenté comme une figure personnelle qui déclare coupable le dernier souverain sur le mont Sion.
  alternative: Comprendre le Messie comme le simple symbole d’une ère nouvelle ou comme un agent oint indéterminé.
  rationale: Le texte dit explicitement « mon Messie » et lui attribue une action judiciaire personnelle; la traduction garde ces éléments sans développer leur portée doctrinale.
- issue: La nature des fautes reprochées
  choice: Employer « impiétés » pour conserver leur portée religieuse et morale.
  alternative: Employer le terme plus général « méchancetés » ou « fautes ».
  rationale: Le contexte est celui d’un jugement messianique, et le lexème désigne ici une conduite mauvaise dirigée aussi contre l’ordre divin; « impiétés » garde cette nuance sans préciser davantage les infractions.
translation_notes:
  register: Français international moderne, digne et lisible. Les tournures apocalyptiques sont conservées sans archaïsme marqué. « Sera laissé en vie » maintient la forme passive et l’implicite sur l’agent; « on le fera monter » conserve également l’indétermination de ceux qui conduisent le souverain à Sion. L’extrait syriaque fourni s’interrompt au seuil du verset 40; la formulation est donc contrôlée par les données lexicales communiquées et par la couche anglaise auditée.
