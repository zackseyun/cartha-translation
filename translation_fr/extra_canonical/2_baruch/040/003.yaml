  text: And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.
translation:
  language: fr
  text: Et sa domination subsistera pour toujours, jusqu’à ce que le monde de la corruption arrive à sa fin et que soient accomplis les temps annoncés auparavant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܛܢܗ
  choice: sa domination
  rationale: Rend l’autorité souveraine exercée par le personnage évoqué, sans lui donner le sens territorial plus étroit de « royaume ».
- source_word: ܥܠܡܐ ܕܚܒܠܐ
  choice: le monde de la corruption
  rationale: 'Conserve la construction sémitique et son ambiguïté : il peut s’agir du monde caractérisé par la corruption, soumis à elle ou voué à la destruction.'
- source_word: ܙܒ̈ܢܐ
  choice: les temps
  rationale: Préserve le pluriel temporel et la portée eschatologique du terme, plutôt que de le réduire à des « événements ».
theological_decisions:
- issue: La tension entre « pour toujours » et « jusqu’à ce que »
  choice: Conserver les deux expressions sans les harmoniser
  alternative: Traduire « durablement » ou reformuler la limite temporelle
  rationale: Le texte associe une affirmation de permanence à une proposition introduite par « jusqu’à » ; la traduction garde cette tension théologique et littéraire.
- issue: Nature du « monde de la corruption »
  choice: Employer une formulation génitive ouverte
  alternative: « le monde corruptible » ou « le monde mauvais »
  rationale: La formulation retenue n’impose ni une lecture exclusivement ontologique ni une lecture exclusivement morale.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de la formulation syriaque tout en étant naturelle ; « soient accomplis » maintient le registre prophétique sans archaïsme excessif.
