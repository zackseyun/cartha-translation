  text: And afterward he will put him to death, and he will protect the rest of my people, those who are found in the place that I have chosen.
translation:
  language: fr
  text: Puis il le mettra à mort et protégera le reste de mon peuple, ceux qui seront trouvés dans le lieu que j’ai choisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܩܛܠܝܘܗܝ
  choice: il le fera mourir
  rationale: Rend l’idée causative de mise à mort dans un français naturel et digne, sans préciser un moyen d’exécution absent du texte.
- source_word: ܢܢܛܪ
  choice: protégera
  rationale: Exprime la garde et la préservation du reste du peuple dans le contexte d’une menace.
- source_word: ܫܪܟܗ ܕܥܡܝ
  choice: le reste de mon peuple
  rationale: Conserve le motif collectif du « reste » sans lui ajouter une interprétation théologique.
- source_word: ܐܬܪܐ ܕܓܒܝܬ
  choice: le lieu que j’ai choisi
  rationale: Préserve la désignation générale du lieu ainsi que la première personne divine.
theological_decisions:
- issue: Identité de celui qui est mis à mort et de celui qui agit
  choice: Conserver les pronoms « il » et « le » sans explicitation
  alternative: Nommer le Messie ou le dernier chef ennemi
  rationale: Le verset dépend du contexte immédiat pour ses référents; les expliciter ici résoudrait une référence que le texte laisse pronominale.
- issue: Sens de la protection accordée au reste
  choice: Employer « protégera » sans préciser la nature du salut
  alternative: « sauvera » ou « préservera en vie »
  rationale: « Protégera » maintient l’idée de garde sans imposer une portée sotériologique plus large.
translation_notes:
  register: Français international moderne, sobre et soutenu. La coordination et les pronoms du texte sont conservés; « ceux qui se trouveront » clarifie naturellement l’apposition sans modifier son sens.
