  language: fr
  text: 'Nous serons vraiment dans les ténèbres,


    et il n’y aura pas de lumière pour le peuple qui restera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: vraiment
  rationale: L’adverbe exprime la certitude ou la véracité de l’affirmation; « vraiment » est naturel et fidèle dans ce contexte.
- source_word: ܒܚܫܘܟܐ
  choice: dans les ténèbres
  rationale: Rend directement l’image de l’obscurité, avec un registre biblique actuel et digne.
- source_word: ܢܘܗܪܐ
  choice: lumière
  rationale: Équivalent direct qui conserve le contraste avec les ténèbres.
- source_word: ܠܥܡܐ ܕܐܫܬܚܪܘ
  choice: pour le peuple qui restera
  rationale: Le verbe désigne ceux qui demeurent ou sont laissés après les événements; le futur français convient à la perspective annoncée par le discours.
theological_decisions:
- issue: Portée métaphorique des ténèbres et de la lumière
  choice: Conserver les images sans les expliquer
  alternative: Paraphraser en termes de détresse et d’espérance
  rationale: Le syriaque garde une formulation imagée susceptible de porter plusieurs nuances; une explicitation réduirait cette richesse et trancherait indûment.
translation_notes:
  register: Français moderne, simple et solennel. Le parallélisme des deux propositions est conservé, ainsi que le contraste entre ténèbres et lumière.
