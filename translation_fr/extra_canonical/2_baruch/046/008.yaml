  text: But the word concerning my being taken up I did not make known to them, nor to my son.
translation:
  language: fr
  text: Mais je ne leur ai pas fait connaître la parole concernant mon enlèvement, ni à leurs fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le syriaque lit «leurs fils»; certaines traductions donnent «mon fils».
    reason: Signaler sobrement la divergence entre le témoin syriaque fourni et la couche anglaise de consultation.
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: la parole
  rationale: Le terme syriaque peut désigner une parole, un propos ou une affaire; «la parole concernant…» conserve ici sa formulation concrète sans réduire le sens à une simple information.
- source_word: ܕܡܬܬܣܝܡ ܐܢܐ
  choice: concernant mon enlèvement
  rationale: La tournure est comprise, conformément au contexte et à la tradition textuelle de ce passage, comme évoquant le fait que Baruch sera retiré ou enlevé. «Enlèvement» préserve la dimension exceptionnelle de l’événement sans préciser davantage sa nature.
- source_word: ܠܐ ܐܒܕܬ ܐܢܘܢ
  choice: je ne leur ai pas fait connaître
  rationale: Le contexte exige un verbe de communication avec un destinataire pluriel; la traduction française rend naturellement cette construction malgré l’état imparfait de la transcription fournie.
- source_word: ܠܒܢܝ̈ܗܘܢ
  choice: à leurs fils
  rationale: La forme syriaque transmise porte le suffixe pluriel «leurs». «Fils» conserve le sens direct de ܒܢܝ̈ܐ, qui peut aussi, selon le contexte, désigner plus largement les enfants ou descendants.
theological_decisions:
- issue: Nature de l’enlèvement de Baruch
  choice: mon enlèvement
  alternative: le fait que je serai emporté / ma prise en charge
  rationale: Le texte évoque le retrait futur de Baruch sans exposer ici son mécanisme ni sa portée théologique; la traduction ne précise donc ni ascension, ni mort, ni transformation.
- issue: Destinataires secondaires
  choice: leurs fils
  alternative: mon fils
  rationale: Le syriaque fourni lit explicitement «leurs fils». La leçon de la couche anglaise «my son» n’est donc pas suivie, tout en étant signalée en note comme divergence.
translation_notes:
  register: Français moderne, digne et direct. La structure adversative et la répétition négative du syriaque sont conservées. «Enlèvement» reste volontairement non explicité afin de préserver l’ambiguïté du passage.
