review_pass:
  verdict: revise
  source_fidelity: La leçon syriaque fournie porte ܬܘܝܒܘܬܐ (twybūṯā), terme usuel pour le repentir / la conversion, et le verbe ܦܠܚ (plḥ), « travailler, peiner, s’appliquer à ». Elle ne contient pas le terme correspondant à « tourment ». L’audit anglais (« torment ») ne concorde donc pas avec cette leçon et ne doit pas déterminer le français.
  naturalness: « Vous ne vous donnerez pas de peine dans le repentir » est idiomatique, conserve le lien du verbe avec « repentir » et évite d’imposer une explication doctrinale ou eschatologique.
  terminology: « Repentir » rend directement ܬܘܝܒܘܬܐ. « Tourment » constitue un changement sémantique majeur. La relative passive « qui vous a été annoncé » est remplacée par une tournure indéfinie qui rend le pluriel implicite du syriaque (« ils vous l’ont dit ») sans identifier les locuteurs.
  issues:
  - severity: high
    issue: « tourment » traduit ܬܘܝܒܘܬܐ.
    rationale: Le mot syriaque désigne le repentir / la conversion, non un tourment. La traduction proposée suit ici l’audit anglais contre le texte-source fourni.
  - severity: medium
    issue: Le verbe « tomber dans » ne rend pas le verbe syriaque ܦܠܚ.
    rationale: Le syriaque exprime l’idée de travailler ou de peiner « dans le repentir », non celle de tomber dans une épreuve.
  revised_text: Et vous ne vous donnerez pas de peine dans le repentir dont on vous a parlé d’avance.
  revised_footnotes: []
  revision_rationale: 'Correction nécessaire afin de rendre les deux termes déterminants de la leçon syriaque fournie : ܦܠܚ (« peiner, travailler ») et ܬܘܝܒܘܬܐ (« repentir »). La divergence substantielle avec l’audit anglais est signalée, mais aucune note de bas de page n’est requise pour une traduction française lisible.'
