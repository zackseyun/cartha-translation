lexical_decisions:
- source_word: ܬܘܝܒܘܬܐ
  choice: tourment
  rationale: Dans ce contexte d’avertissement et de jugement, le terme désigne une épreuve pénible ou un châtiment; « tourment » conserve la force du propos sans en préciser indûment la nature.
- source_word: ܕܩܕܡܘ ܐܡܪܘܗ̇ ܠܟܘܢ
  choice: qui vous a été annoncé d’avance
  rationale: Rend naturellement l’idée d’une annonce faite antérieurement, avec le destinataire explicite « à vous ».
theological_decisions:
- issue: Nature du tourment annoncé
  choice: Ne pas préciser s’il s’agit d’un châtiment historique, eschatologique ou spirituel
  alternative: Interpréter explicitement le tourment comme un châtiment divin futur
  rationale: Le verset évoque un tourment annoncé auparavant sans en définir ici la nature; la traduction préserve cette ouverture.
