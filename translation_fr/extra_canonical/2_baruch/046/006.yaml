translation:
  language: fr
  text: Car, si vous faites ces choses, l’espérance reposera sur vous — ces choses qui vous ont été dites auparavant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ ܣܒܪܐ
  choice: deviendront pour vous une espérance assurée
  rationale: La tournure syriaque associe l’idée de repos ou d’établissement à l’« espérance ». En français courant et digne, « une espérance assurée » exprime cette stabilité sans reproduire maladroitement l’image par « l’espérance reposera sur vous ».
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: celles qui vous ont été annoncées auparavant
  rationale: Le démonstratif pluriel renvoie aux choses ou paroles antérieurement dites. Le passif français respecte l’absence d’un agent explicitement nommé dans le contexte immédiat.
theological_decisions:
- issue: Nature de l’espérance promise
  choice: une espérance assurée
  alternative: l’espérance reposera sur vous
  rationale: Le texte lie l’accomplissement des exhortations à une espérance rendue stable; il ne précise pas davantage son contenu ni n’impose une lecture doctrinale particulière.
translation_notes:
  register: Français moderne international, sobre et solennel. La syntaxe a été légèrement réorganisée pour rendre clairement le rapport entre les annonces antérieures et l’espérance, tout en conservant la condition exprimée par « si ».
