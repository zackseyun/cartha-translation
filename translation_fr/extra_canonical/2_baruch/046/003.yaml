translation:
  language: fr
  text: « Car où chercherons-nous de nouveau la Loi ? Ou bien, qui nous conduira de la maison de la mort à la vie ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Le terme syriaque désigne ici la Loi comme réalité reconnue et normative; la majuscule française marque cette référence sans ajouter de précision confessionnelle.
- source_word: ܡܕܪܟܢ ܠܢ
  choice: nous conduira
  rationale: Rend naturellement l’idée de guider ou de faire suivre un chemin.
- source_word: ܒܝܬ ܡܘܬܐ
  choice: la maison de la mort
  rationale: Conserve l’image concrète et solennelle du syriaque plutôt que de la réduire à une simple situation mortelle.
- source_word: ܠܚܝ̈ܐ
  choice: à la vie
  rationale: Préserve l’opposition directe entre la mort et la vie.
theological_decisions:
- issue: Portée de « la Loi »
  choice: Conserver « la Loi » sans l’identifier davantage
  alternative: Préciser « la Loi de Dieu » ou « la Torah »
  rationale: Le syriaque ne fournit pas ici ce complément; la formulation retenue maintient la portée ouverte du texte.
- issue: Image du passage de la mort à la vie
  choice: Conserver le mouvement « de la maison de la mort à la vie »
  alternative: Paraphraser par « de la mort vers la vie »
  rationale: L’image spatiale appartient au texte et porte sa tension eschatologique sans qu’il soit nécessaire de l’interpréter.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative et le parallélisme sont conservés; « de nouveau » exprime l’idée de chercher encore la Loi dans le contexte de la disparition annoncée du guide.
