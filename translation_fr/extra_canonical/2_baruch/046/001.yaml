  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: fr
  text: '1 Mon fils et les anciens du peuple me répondirent :


    « Le Puissant nous a-t-il donc humiliés au point de t’enlever si soudainement ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Ce titre divin syriaque désigne celui qui possède la puissance. « Le Puissant » en conserve la valeur de titre tout en restant naturel en français.
- source_word: ܡܟܟܢ
  choice: nous a humiliés
  rationale: Le verbe exprime ici l’abaissement subi par le peuple; « humiliés » préserve sa force dans le contexte de la perte annoncée de Baruch.
- source_word: ܕܢܣܒܟ
  choice: t’enlever
  rationale: Le verbe signifie littéralement « te prendre »; dans ce contexte de départ imposé, « t’enlever » rend clairement l’idée sans préciser davantage la manière.
- source_word: ܫܠܝ
  choice: si soudainement
  rationale: Le terme porte ici l’idée d’un départ brusque ou inattendu. La tournure française traduit naturellement l’intensité de la plainte.
theological_decisions:
- issue: Identification du titre divin
  choice: le Puissant
  alternative: Dieu / le Tout-Puissant
  rationale: Le texte emploie un titre fondé sur la puissance sans utiliser le nom divin ni le terme ordinaire pour « Dieu ». « Le Puissant » évite donc une explicitation théologique absente de la source.
- issue: Nature de l’enlèvement de Baruch
  choice: t’enlever
  alternative: te faire mourir / t’enlever au ciel
  rationale: Le verset ne précise pas encore s’il s’agit de mort, d’ascension ou simplement de départ. La traduction maintient cette indétermination.
translation_notes:
  register: Français moderne, digne et accessible. La question directe conserve la plainte des interlocuteurs ainsi que l’ambiguïté entourant le départ de Baruch.
