  yaml_path: translation/extra_canonical/2_baruch/046/004.yaml
  text: 'And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the seed of Jacob a son of the law.'
translation:
  language: fr
  text: 'Et je leur répondis :

    « Je ne peux m’opposer à la volonté du Puissant.

    Cependant, Israël ne manquera pas d’un sage,

    ni la lignée de Jacob d’un fils de la Loi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Ce titre divin rend directement le syriaque tout en conservant sa forme distinctive et solennelle.
- source_word: ܚܟܝܡܐ
  choice: un sage
  rationale: Le substantif français exprime naturellement la figure d’une personne sage, sans ajouter de fonction particulière.
- source_word: ܒܪ ܢܡܘܣܐ
  choice: un fils de la Loi
  rationale: La formulation littérale préserve l’expression sémitique et son possible sens de personne formée par la Loi ou qui lui appartient, sans trancher cette nuance.
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ
  choice: la lignée de Jacob
  rationale: « Lignée » restitue ici l’idée de descendance ou de peuple issu de Jacob dans un français actuel et digne.
theological_decisions:
- issue: La continuité d’un guide sage et fidèle à la Loi en Israël
  choice: Conserver les deux désignations parallèles, « un sage » et « un fils de la Loi »
  alternative: Fusionner les deux expressions en une seule figure, telle qu’un « maître de la Loi »
  rationale: Le syriaque maintient un parallélisme entre Israël et la lignée de Jacob ainsi qu’entre le sage et le fils de la Loi; le texte ne précise pas s’il s’agit exactement de la même fonction.
- issue: L’impossibilité de résister au dessein divin
  choice: « Je ne peux m’opposer à la volonté du Puissant »
  alternative: « Je ne peux tenir tête au Puissant »
  rationale: La traduction retient l’interprétation syntaxique attestée par la tradition de lecture tout en gardant le titre divin et sans développer la nature de cette volonté.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique du syriaque est conservé, ainsi que le titre divin « le Puissant » et l’expression théologiquement ouverte « fils de la Loi ».
