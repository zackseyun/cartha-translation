translation:
  language: fr
  text: Mais préparez vos cœurs à écouter la Loi et à vous attacher fermement à la compréhension.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܒܘ ܠܒܒ̈ܝܟܘܢ
  choice: préparez votre cœur
  rationale: L’expression syriaque appelle les destinataires à disposer intérieurement leur cœur; le singulier collectif français est naturel tout en s’adressant au groupe.
- source_word: ܕܬܫܡܥܘܢ ܠܢܡܘܣܐ
  choice: à écouter la Loi
  rationale: ܫܡܥ peut inclure l’idée d’obéir, mais «écouter» conserve ici l’image et l’ouverture sémantique du verbe; «Loi» rend ܢܡܘܣܐ dans son sens religieux.
- source_word: '[lecture sous-jacente correspondant à l’idée de tenir fermement l’intelligence]'
  choice: à vous attacher fermement à l’intelligence
  rationale: Cette formulation suit la couche de consultation auditée pour la fin du verset, dont le détail est mal lisible dans l’extrait syriaque fourni, et exprime naturellement la persévérance intellectuelle demandée.
theological_decisions:
- issue: Portée de l’écoute de la Loi
  choice: écouter la Loi
  alternative: obéir à la Loi
  rationale: Le choix retenu évite de réduire le champ de ܫܡܥ à la seule obéissance, tout en laissant cette implication accessible au lecteur.
- issue: Sens de l’intelligence
  choice: l’intelligence
  alternative: la compréhension
  rationale: «Intelligence» conserve le caractère sapientiel et la légère ambiguïté entre faculté de discernement et compréhension acquise.
translation_notes:
  register: Français moderne, digne et direct. La coordination reste simple, et «fermement» restitue l’idée de persévérance sans alourdir la phrase.
