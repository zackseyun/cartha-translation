  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: fr
  text: 'Le Seigneur me répondit et me dit[a] : « Pour le Très-Haut, le grand ou le petit nombre des années n’entre pas en ligne de compte. Quel avantage Adam a-t-il tiré du fait d’avoir vécu neuf cent trente ans, puisqu’il a transgressé ce qui lui avait été ordonné ? Ainsi, la longue durée de sa vie ne lui a été d’aucun profit ; elle lui a plutôt apporté la mort et a abrégé les années de ceux qui sont nés de lui. Et en quoi Moïse a-t-il été désavantagé parce qu’il n’a vécu que cent vingt ans ? Parce qu’il s’est soumis à celui qui l’avait formé, il a mis la Loi à la portée des descendants de Jacob et allumé une lampe pour le peuple d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le Seigneur me dit ».'
    reason: Formulation introductive plus brève attestée comme autre rendu possible, bien que le syriaque standard exprime explicitement l’idée de réponse.
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: n’entre pas en ligne de compte
  rationale: Cette tournure française naturelle conserve l’idée de compte ou d’évaluation devant le Très-Haut, dans le contraste entre une vie longue et une vie courte.
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: le grand ou le petit nombre des années
  rationale: Le texte transmis est matériellement difficile, mais l’opposition entre beaucoup et peu d’années est nette ; cette formulation conserve le contraste quantitatif.
- source_word: ܡܘܬܪܐ
  choice: avantage / profit
  rationale: Ces termes rendent l’idée de bénéfice dans l’argument moral portant sur la durée de la vie d’Adam, sans donner au passage une coloration strictement commerciale.
- source_word: ܡܒܣܪܝܢ
  choice: allumé
  rationale: Avec « lampe », « allumé » exprime simplement et vivement l’image de l’illumination et de la direction donnée à Israël.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: le peuple d’Israël
  rationale: La référence finale est collective ; « peuple d’Israël » est idiomatique en français et préserve la portée communautaire.
- source_word: ܩܪܒ ܢܡܘܣܐ
  choice: a rendu la Loi proche
  rationale: Cette formulation garde l’image syriaque de la Loi rendue proche des descendants de Jacob, plutôt que de la réduire à la seule idée de transmission.
theological_decisions:
- issue: Valeur morale de la durée de la vie
  choice: La longueur de la vie n’a aucune valeur en elle-même lorsque le commandement est transgressé.
  alternative: Le passage pourrait être compris seulement comme un contraste biographique entre Adam et Moïse.
  rationale: La question sur Adam, puis le contraste avec Moïse, établissent que l’obéissance, et non le nombre des années, détermine le véritable profit d’une vie.
- issue: Moïse porteur de lumière
  choice: La lampe évoque la lumière directrice apportée à Israël en lien avec la Loi transmise par Moïse.
  alternative: La lampe pourrait désigner plus étroitement Moïse lui-même comme exemple lumineux.
  rationale: La proximité immédiate des images de la Loi et de la lampe invite à maintenir leur lien, sans préciser davantage que le texte.
- issue: Conséquence de la faute d’Adam
  choice: La faute d’Adam lui apporte la mort et affecte la durée de vie de ses descendants.
  alternative: L’expression pourrait être lue de façon moins causale, comme une simple succession historique entre sa mort et les vies plus courtes de ses descendants.
  rationale: La syntaxe argumentative associe directement la transgression, la mort et l’abrègement des années, tout en évitant d’ajouter un système doctrinal absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques sont conservées, ainsi que le contraste tendu entre la longue vie d’Adam et la vie plus courte mais obéissante de Moïse. « Celui qui l’avait formé » maintient l’image du Créateur sans ajouter de titre absent du texte.
