revisions:
- from: 'Le Seigneur me répondit et me dit[a] : « Pour le Très-Haut, le grand ou le petit nombre des années n’entre pas en ligne de compte. Quel avantage Adam a-t-il tiré du fait d’avoir vécu neuf cent trente ans, puisqu’il a transgressé ce qui lui avait été ordonné ? Ainsi, la longue durée de sa vie ne lui a été d’aucun profit ; elle lui a plutôt apporté la mort et a abrégé les années de ceux qui sont nés de lui. Et qu’a-t-il manqué à Moïse parce qu’il n’a vécu que cent vingt ans ? Parce qu’il s’est soumis à celui qui l’avait formé, il a rendu la Loi proche des descendants de Jacob et allumé une lampe pour le peuple d’Israël. »'
  to: 'Le Seigneur me répondit et me dit[a] : « Pour le Très-Haut, le grand ou le petit nombre des années n’entre pas en ligne de compte. Quel avantage Adam a-t-il tiré du fait d’avoir vécu neuf cent trente ans, puisqu’il a transgressé ce qui lui avait été ordonné ? Ainsi, la longue durée de sa vie ne lui a été d’aucun profit ; elle lui a plutôt apporté la mort et a abrégé les années de ceux qui sont nés de lui. Et en quoi Moïse a-t-il été désavantagé parce qu’il n’a vécu que cent vingt ans ? Parce qu’il s’est soumis à celui qui l’avait formé, il a mis la Loi à la portée des descendants de Jacob et allumé une lampe pour le peuple d’Israël. »'
  rationale: La révision ne modifie pas le sens. Elle remplace deux formulations françaises moins idiomatiques par des équivalents naturels qui maintiennent respectivement l’image de la Loi rendue proche et la question sur le désavantage éventuel de Moïse. L’ancre et le contenu de la note sont conservés.
