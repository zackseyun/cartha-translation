  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: fr
  text: 'Il me répondit : « Tout ce qui doit arriver en ce temps-là arrivera sur toute la terre ; c’est pourquoi tous les vivants le ressentiront[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le percevront » ou « le sentiront ».'
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ
  choice: doit arriver
  rationale: La tournure exprime ce qui est à venir ou destiné à se produire. « Doit arriver » conserve cette orientation sans préciser davantage s’il s’agit d’une nécessité, d’une destinée ou simplement du futur.
- source_word: ܢܪܓܫܘܢ
  choice: le ressentiront
  rationale: Le verbe ܪܓܫ désigne le fait de percevoir ou de sentir. « Ressentir » convient ici à l’effet universel des événements tout en conservant la nuance sensorielle du syriaque.
- source_word: ܥܠ ܟܠܗ̇ ܐܪܥܐ
  choice: sur toute la terre
  rationale: Rendu direct de la préposition et du nom ; « terre » laisse ouverte la portée géographique exacte du passage apocalyptique.
theological_decisions:
- issue: Force de ܕܥܬܝܕ dans le contexte apocalyptique
  choice: doit arriver
  alternative: est destiné à arriver
  rationale: Le texte indique un avenir arrêté, mais n’explicite pas ici l’agent ni la nature de cette détermination. La formulation retenue préserve cette tension sans ajouter explicitement une doctrine de la prédestination.
translation_notes:
  register: Français moderne, international et digne. La formule sémitique redondante « répondit et me dit » est rendue naturellement par « me répondit ». Le démonstratif temporel est conservé par « en ce temps-là ».
