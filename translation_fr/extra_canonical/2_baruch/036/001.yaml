lexical_decisions:
- source_word: ܥܒ̈ܐ
  choice: forêt
  rationale: Le symbole représente une vaste masse d’arbres couvrant une grande étendue ; « forêt » conserve naturellement l’ampleur apocalyptique de l’image.
- source_word: ܓܦܢ
  choice: vigne
  rationale: Ce terme français garde le symbolisme biblique sans identifier prématurément la figure ni ajouter l’explication donnée plus loin.
- source_word: ܡܒܘܥܐ
  choice: source
  rationale: « Source » désigne naturellement en français une eau qui jaillit et devient ensuite un puissant courant ; « fontaine » suggérerait trop facilement un aménagement artificiel.
- source_word: ܐܪܙܐ
  choice: cèdre
  rationale: Le nom simple suffit et préserve cette image d’arbre symbolique bien établie dans la littérature biblique.
- source_word: ܒܫܠܡܐ
  choice: paisiblement / dans la paix
  rationale: La reprise du vocabulaire de paix maintient le contraste voulu entre l’arrivée calme de la source et sa force dévastatrice.
theological_decisions:
- issue: Faut-il intégrer dès la vision l’interprétation ultérieure de la vigne et de la source ?
  choice: Les symboles restent sans identification explicite dans le texte de la vision.
  alternative: Employer des majuscules ou des gloses pour présenter d’emblée la vigne ou la source comme des figures messianiques.
  rationale: La structure narrative réserve l’explication à un passage ultérieur. Laisser ici les images ouvertes préserve la progression du récit et évite d’imposer une interprétation dans le texte.
- issue: Portée de la déclaration finale sur le retour et des tourments accrus
  choice: Conserver la formulation temporelle et punitive sans préciser la nature de ce retour.
  alternative: Expliciter une résurrection, un jugement final ou une doctrine précise de l’au-delà.
  rationale: La parole annonce un retour et un tourment ultérieur, mais ce verset ne définit pas leur mécanisme théologique ; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne, avec un rythme visionnaire soutenu. Les répétitions structurantes (« et voici », « la forêt », « la source ») sont maintenues lorsque leur fonction rhétorique est nette. Les symboles ne reçoivent ni majuscules interprétatives ni gloses doctrinales. Le matériau syriaque fourni est une page de transition qui ne contient que le début du cadre visionnaire ; pour la totalité de 36:1, les détails ont été contrôlés à partir de la couche anglaise auditée et de ses décisions lexicales explicitement rattachées au syriaque.
