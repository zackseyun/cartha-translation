  yaml_path: translation/extra_canonical/2_baruch/036/001.yaml
  text: 'When I had said these things, I fell asleep there, and in the night I saw a vision. And behold, a forest of trees planted on the plain, and high, rugged mountains surrounded it; and that forest covered a great expanse. And behold, opposite it a vine arose, and from beneath it a fountain came forth peacefully. Then that fountain came to the forest and swelled into mighty waves, and those waves submerged that forest, and suddenly uprooted the greater part of it and threw down all the mountains around it. And the height of the forest was brought low, and the tops of the mountains were lowered, and that fountain prevailed greatly, so that nothing was left of that great forest except one cedar alone. And when it had cast down and destroyed and uprooted the greater part of that forest, so that nothing remained of it and its place could no longer be recognized, then that vine came with the fountain in peace and great stillness, and it came to a place not far from that cedar, and they brought
    the cedar that had been thrown down to it. And I saw, and behold, the vine opened its mouth and said to the cedar: “Are you not that cedar which was left from the forest of wickedness, by whose means wickedness continued and was worked all those years, while goodness was not? And you kept taking what was not yours, and what was yours you never treated with compassion; and those far away you brought under your power, and those who came near you, you held fast in the snares of your evil; and you always lifted yourself up like one that could not be uprooted. But now your time has hastened, and your hour has come. So depart also, O cedar, after the forest which went before you, and become dust with it, and let your ashes be mixed together. And lie down in grief, and rest in torment until your last time comes, when you will return again and be tormented still more.”'
translation:
  language: fr
  text: 'Après avoir dit cela, je m’endormis en ce lieu et, pendant la nuit, j’eus une vision. Voici : une forêt d’arbres était plantée dans la plaine, entourée de hautes montagnes escarpées, et cette forêt couvrait une vaste étendue. Et voici qu’en face d’elle s’éleva une vigne ; de dessous la vigne jaillit paisiblement une source. Puis la source atteignit la forêt et se gonfla en vagues puissantes. Ces vagues submergèrent la forêt ; soudain, elles en déracinèrent la plus grande partie et renversèrent toutes les montagnes qui l’entouraient. La hauteur de la forêt fut abaissée, et les sommets des montagnes furent rabaissés. La source devint extrêmement puissante, si bien qu’il ne resta de cette grande forêt qu’un seul cèdre. Après avoir abattu, détruit et déraciné la plus grande partie de la forêt, au point qu’il n’en restait rien et qu’on ne pouvait même plus reconnaître son emplacement, la vigne s’avança avec la source, dans la paix et un grand calme. Elle parvint en un lieu peu éloigné
    du cèdre, et on lui amena le cèdre qui avait été renversé. Je regardai, et voici que la vigne ouvrit la bouche et dit au cèdre : « N’es-tu pas ce cèdre qui subsistait de la forêt de la méchanceté, celui par lequel la méchanceté s’est maintenue et a été pratiquée durant toutes ces années, tandis qu’on ne faisait pas le bien ? Tu n’as cessé de prendre ce qui ne t’appartenait pas, et tu n’as jamais traité avec compassion ce qui était à toi. Tu as soumis à ton pouvoir ceux qui étaient loin, et tu as retenu ceux qui s’approchaient de toi dans les pièges de ton mal. Tu t’es toujours élevé comme si tu ne pouvais pas être déraciné. Mais maintenant, ton temps a hâté son cours et ton heure est venue. Va donc, toi aussi, ô cèdre, rejoindre la forêt qui t’a précédé ; deviens poussière avec elle, et que vos cendres soient mêlées. Couche-toi dans la douleur et repose dans le tourment jusqu’à ce que vienne ton dernier temps, où tu reviendras et subiras des tourments plus grands encore. »'
