  text: And he answered and said to me, “Because of this, at that time it was said …”
translation:
  language: fr
  text: 'Et il me répondit : « C’est pourquoi, en ce temps-là, il fut dit… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Et il me répondit
  rationale: La formule narrative syriaque signifie littéralement « et il répondit et me dit » ; en français naturel, « il me répondit » conserve à la fois l’idée de réponse et l’adresse au narrateur sans lourdeur.
- source_word: ܡܛܠ ܗܢܐ
  choice: C’est pourquoi
  rationale: Cette expression rend clairement le lien causal avec ce qui précède, dans un français courant et digne.
- source_word: ܒܗܘ ܙܒܢܐ
  choice: en ce temps-là
  rationale: La formulation conserve la valeur temporelle explicite du syriaque et convient au registre narratif et apocalyptique.
- source_word: ܐܡܝܪ
  choice: il fut dit
  rationale: Le passif impersonnel respecte la forme syriaque et évite d’identifier un locuteur que le fragment ne nomme pas.
theological_decisions:
- issue: Attribution de la parole introduite par « il fut dit »
  choice: Ne pas préciser qui a prononcé la parole
  alternative: Expliciter qu’il s’agit d’une déclaration divine
  rationale: Le texte syriaque conservé emploie un passif et ne désigne pas ici l’auteur de la parole ; la traduction préserve cette réserve.
translation_notes:
  register: Français moderne international, naturel et digne. La tournure redondante du syriaque « répondit et dit » est allégée en « répondit », tandis que le passif final et l’interruption du fragment sont maintenus.
