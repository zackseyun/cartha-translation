  language: en
  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: fr
  text: 'Alors je priai et dis : « Seigneur, mon Seigneur, tu éclaires sans cesse ceux qui se laissent conduire avec discernement. Ta Loi est vie, et ta sagesse est droiture. Fais-moi donc connaître l’interprétation de cette vision. Car tu sais que mon âme a marché selon ta Loi et que, depuis mes tout premiers jours, je n’ai pas été séparé de ta sagesse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: ceux qui se laissent conduire avec discernement
  rationale: Le passif de ܕܒܪ est conservé, tandis que « discernement » exprime la portée intellectuelle et morale de ܣܘܟܠܐ dans un français naturel.
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: Ta Loi est vie
  rationale: La formulation nominale et fortement identificatrice est préservée, sans l’affaiblir en « donne la vie ».
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: ta sagesse est droiture
  rationale: « Droiture » rend l’idée de rectitude morale de ܬܪܝܨܘܬܐ sans lui imposer un sens juridique ou confessionnel plus étroit.
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: l’interprétation de cette vision
  rationale: Dans ce contexte apocalyptique, ܦܘܫܩܐ désigne l’explication des symboles révélés; « interprétation » convient au genre.
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: je n’ai pas été séparé
  rationale: Cette traduction conserve la force relationnelle et passive du verbe, sans suggérer seulement un éloignement volontaire.
theological_decisions:
- issue: Rapport de la Loi et de la sagesse à la révélation divine
  choice: Conserver les affirmations parallèles « Ta Loi est vie » et « ta sagesse est droiture ».
  alternative: Comprendre « droiture » dans un sens spécifiquement judiciaire, ou traiter ces mots comme de simples titres dévotionnels.
  rationale: Les prédicats forts du texte présentent la Loi et la sagesse divines comme le cadre vital et moral dans lequel Baruch demande l’intelligence de la vision.
- issue: Nature de la fidélité de Baruch à la sagesse
  choice: « je n’ai pas été séparé de ta sagesse »
  alternative: « je ne me suis pas éloigné de ta sagesse »
  rationale: Le passif préserve la tension entre fidélité personnelle et maintien dans une relation accordée par Dieu, sans trancher en faveur d’une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Loi » prend une majuscule pour désigner l’enseignement révélé de Dieu; « droiture » reste courant tout en gardant la densité sapientielle. La syntaxe conserve le ton solennel d’une prière sans archaïsmes.
