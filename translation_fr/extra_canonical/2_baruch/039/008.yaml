review_pass:
  verdict: revise
  source_fidelity: Une correction est nécessaire. Le syriaque emploie un verbe passif au féminin (« lorsqu’elle sera révélée/manifeste »), en continuité avec l’image de la vigne féminine. De plus, « la multitude de son armée » ajoute l’idée d’« armée », qui n’est pas exprimée dans le syntagme syriaque; celui-ci désigne une multitude « issue d’elle/d’elle-même », avec un référent qui reste contextuellement délicat.
  naturalness: La phrase est globalement naturelle, mais « celles que tu as entendues » est lourd et le masculin « il » brouille l’accord avec la vigne figurative. La révision conserve une formulation française moderne et fluide.
  terminology: « Grand cèdre » est recevable pour le cèdre élevé. « Vigne » conserve l’image source. « Multitude » rend le terme collectif sans interpréter celui-ci comme une armée.
  issues:
  - severity: high
    issue: Accord et référent figuratif de « il sera révélé »
    rationale: La forme syriaque est féminine et se rattache à la vigne (féminine) de la comparaison immédiatement précédente. Le masculin français ne reproduit pas cette cohésion grammaticale et imagée.
  - severity: high
    issue: Ajout interprétatif de « armée »
    rationale: Le texte parle d’une multitude liée par « de/issue de celle-ci »; il ne comporte pas de terme pour « armée ». Cette précision militaire ne doit pas être introduite.
  - severity: low
    issue: Note de bas de page inutilement spéculative
    rationale: La note actuelle présente comme une ambiguïté manuscrite une question de rattachement que la traduction peut résoudre sans modifier le sens. Aucune note n’est requise ici.
