  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: fr
  text: 'Quand elle sera révélée, elle déracinera la multitude qui en est issue. Quant au grand cèdre que tu as vu rester de cette forêt, et aux paroles que la vigne lui a adressées et que tu as entendues, voici ce qu’elles signifient :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܐ ܕܐܬܓܠܝܬ
  choice: Quand il sera révélé
  rationale: La tournure syriaque exprime la manifestation future du Messie mentionné immédiatement auparavant; le passif « sera révélé » conserve la formulation du texte.
- source_word: ܬܥܩܘܪ
  choice: il déracinera
  rationale: Le verbe signifie littéralement « déraciner » et prolonge naturellement l’imagerie végétale de la vision.
- source_word: ܗܝܘܬܐ ܕܡܢܗ̇
  choice: la multitude de son armée
  rationale: Le substantif désigne ici une masse ou multitude, comprise dans le contexte comme la force armée issue de ce royaume; « son » conserve la référence pronominale sans la préciser davantage.
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: le grand cèdre
  rationale: ܪܡܐ décrit ce qui est élevé ou haut; « grand » est idiomatique en français pour un arbre imposant tout en gardant l’image.
- source_word: ܗܢܘ ܡܠܬܗ
  choice: voici ce que cela signifie
  rationale: Cette formule introduit explicitement l’interprétation de la vision; elle ne doit pas être réduite à une simple ponctuation.
theological_decisions:
- issue: Référent de celui qui est révélé
  choice: Employer le pronom masculin « il » sans ajouter « le Messie » dans ce verset
  alternative: Répéter explicitement « le Messie »
  rationale: Le contexte précédent identifie le référent comme le Messie, mais le syriaque de ce verset poursuit par un pronom implicite; la traduction conserve cette cohésion sans explicitation doctrinale superflue.
- issue: Référent du possessif dans « son armée »
  choice: Conserver le possessif sans identifier explicitement son antécédent
  alternative: Écrire « l’armée du royaume »
  rationale: La chaîne référentielle syriaque peut renvoyer à la puissance hostile évoquée; conserver « son » respecte cette légère ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du syriaque tout en évitant une accumulation maladroite de relatives; les images du déracinement, du cèdre et de la vigne sont conservées.
