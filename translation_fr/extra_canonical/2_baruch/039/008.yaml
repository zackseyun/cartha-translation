revisions:
- from: 'Quand il sera révélé, il déracinera la multitude de son armée. Quant au grand cèdre que tu as vu rester de cette forêt et aux paroles que la vigne lui a adressées — celles que tu as entendues[a] —, voici ce que cela signifie :'
  to: 'Quand elle sera révélée, elle déracinera la multitude qui en est issue. Quant au grand cèdre que tu as vu rester de cette forêt, et aux paroles que la vigne lui a adressées et que tu as entendues, voici ce qu’elles signifient :'
  rationale: La révision rend le féminin de la vigne dans la proposition de manifestation, retire l’ajout non attesté « armée », et traduit la relation exprimée par le syriaque sans trancher indûment le référent exact de « en ». La formule finale introduisant l’explication est conservée explicitement. La syntaxe des paroles entendues est rendue directement; la note n’apporte pas d’information textuelle nécessaire.
