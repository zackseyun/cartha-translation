  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: fr
  text: Après celles-ci surgira un quatrième royaume, dont la puissance sera plus dure et plus mauvaise que celle des royaumes qui l’auront précédé. Il dominera durant de nombreuses périodes, comme les nuages de la plaine ; il connaîtra des temps et s’élèvera plus haut que les cèdres du Liban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: royaume
  rationale: Le terme désigne ici une puissance royale ou un empire dans la succession symbolique des royaumes ; « royaume » conserve le vocabulaire apocalyptique traditionnel sans préciser abusivement sa forme politique.
- source_word: ܩܫܝܐ
  choice: plus dure
  rationale: Le syriaque exprime la dureté ou la rigueur. « Plus dure » préserve cette image et évite de réduire le sens à la seule cruauté.
- source_word: ܒܝܫ
  choice: plus mauvaise
  rationale: Le mot peut qualifier ce qui est mauvais, malfaisant ou pire. La coordination avec « plus dure » et la comparaison avec les royaumes antérieurs favorisent ici « plus mauvaise ».
- source_word: ܙܒ̈ܢܐ ܣܓܝ̈ܐܐ
  choice: durant de nombreuses périodes
  rationale: Le pluriel de « temps/période » est maintenu plutôt que normalisé en une durée précise.
- source_word: ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: les cèdres du Liban
  rationale: Rendu direct de l’image proverbiale de grandeur et d’élévation.
theological_decisions:
- issue: Identification historique du quatrième royaume
  choice: Ne pas nommer le royaume
  alternative: L’identifier explicitement à un empire historique particulier
  rationale: Le verset emploie une figure apocalyptique sans fournir ici d’identification explicite ; la traduction conserve cette réserve.
- issue: Portée de la domination sur les temps
  choice: « il tiendra les temps sous son emprise »
  alternative: « il subsistera pendant un certain temps »
  rationale: Ce rendu suit la compréhension attestée par la couche de consultation et conserve la personnification forte de la puissance du royaume, sans en tirer une affirmation théologique supplémentaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les reprises pronominales sont explicitées lorsque nécessaire pour éviter toute ambiguïté de référent. Aucune note n’est requise, donc aucun marqueur n’apparaît dans le texte.
