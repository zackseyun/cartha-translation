  - severity: low
    issue: La note de bas de page formule l’alternative comme « le commencement du règne ».
    rationale: Le terme ܪܝܫܝܬܐ est polysémique, mais cette formulation ajoute « du règne » au lieu de signaler directement les nuances de commencement, primauté ou autorité.
  revised_text: Et il arrivera que, lorsque approchera le temps de sa fin et de sa chute, alors se révélera le règne[a] de mon Messie, qui est semblable à la source et à la vigne.
