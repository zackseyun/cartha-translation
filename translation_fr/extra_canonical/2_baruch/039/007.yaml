  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: fr
  text: Et il arrivera que, lorsque approchera le temps de sa fin et de sa chute, alors se révélera le règne[a] de mon Messie, qui est semblable à la source et à la vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la primauté » ou « l’autorité souveraine » de mon Messie. Le terme syriaque peut aussi avoir la nuance de « commencement ».
    reason: Préserver la polysémie de ܪܝܫܝܬܐ sans imposer dans le texte principal une lecture plus étroite.
lexical_decisions:
- source_word: ܫܘܠܡܗ̇
  choice: où elle atteindra son terme
  rationale: Le terme syriaque désigne son achèvement ou sa fin; la tournure française exprime ici l’arrivée de ce royaume à son terme sans préciser au-delà du texte la nature de cet accomplissement.
- source_word: ܕܐܦܠܐ
  choice: et tombera
  rationale: Le verbe de chute, qui se rapporte au royaume évoqué dans le contexte, doit être rendu explicitement; il ne faut pas l’omettre.
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ
  choice: le règne de mon Messie
  rationale: ܪܝܫܝܬܐ peut évoquer le commencement, la primauté ou l’autorité souveraine. Dans ce contexte apocalyptique, « règne » rend naturellement l’avènement manifeste de l’autorité du Messie tout en signalant l’autre possibilité en note.
- source_word: ܡܒܘܥܐ
  choice: la source
  rationale: Équivalent direct et naturel de l’image syriaque d’une source jaillissante.
- source_word: ܓܦܢ
  choice: la vigne
  rationale: Conserve sans l’interpréter la seconde image symbolique de la vision.
theological_decisions:
- issue: Nature de ce qui se révèle au sujet du Messie
  choice: le règne de mon Messie
  alternative: le commencement de mon Messie
  rationale: Le contexte oppose la chute d’un royaume à la manifestation de l’autorité messianique. Cependant, la polysémie du mot syriaque est réelle; l’autre lecture est donc conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la progression temporelle du syriaque et rend explicitement la chute du royaume, omise dans certaines formulations antérieures.
