revisions:
- from: La vérité y sera établie[a], et tous ceux qui sont souillés par l’iniquité fuiront vers elle, comme les bêtes sauvages fuient et se glissent dans la forêt.[b]
  to: La vérité y sera établie, et tous ceux qui sont souillés d’iniquité s’y enfuiront, comme les bêtes malfaisantes fuient et se glissent dans la forêt.
  rationale: La révision maintient la leçon du syriaque de contrôle, « la vérité y sera établie », et conserve le mouvement paradoxal des personnes souillées qui fuient dans ce royaume. Elle corrige la caractérisation des bêtes et supprime deux notes qui contredisent ou obscurcissent indûment les données textuelles disponibles.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:22Z'
review_pass:
  verdict: revise
  source_fidelity: Le syriaque transmis pour ce verset porte « et la vérité sera établie en elle » (ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ). La traduction française principale rend donc correctement ce membre, contrairement à l’audit anglais qui dépend manifestement d’une autre lecture verbale. La comparaison finale décrit les mêmes bêtes qui fuient et se glissent dans la forêt; « bêtes sauvages » affaiblit toutefois la qualification défavorable retenue dans la tradition anglaise et l’analyse fournie.
  naturalness: La phrase est claire et de registre approprié. « S’y enfuiront » est plus naturel et plus direct que « fuiront vers elle », tout en conservant le mouvement vers le royaume. « Bêtes malfaisantes » est plus exact que « bêtes sauvages » sans être inutilement lourd.
  terminology: '« Vérité » et « souillés d’iniquité » conviennent. Il faut supprimer les notes proposées : la note a contredit sans nécessité le texte source fourni et présente à tort « sera établie » comme seulement apparent; la note b introduit une lecture nominale (« reptiles ») que l’analyse grammaticale du dossier écarte.'
  issues:
  - severity: medium
    issue: La note a présente « la vérité s’y cachera » comme une autre lecture et met en doute la leçon « sera établie ».
    rationale: Le témoin syriaque fourni pour ce passage lit explicitement le verbe « sera établie ». Une note qui privilégie ou crédibilise ici une leçon non attestée dans la source de contrôle est trompeuse.
  - severity: low
    issue: « Bêtes sauvages » ne rend pas la qualification négative des bêtes.
    rationale: La formulation « bêtes malfaisantes » conserve mieux le sens de « evil beasts » retenu par l’analyse transmise, sans transformer l’image en catégorie zoologique neutre.
  - severity: medium
    issue: La note b propose « reptiles » comme si le second terme pouvait être un second sujet nominal.
    rationale: L’audit grammatical fourni analyse le terme comme une action parallèle, « se glissent / rampent », accomplie par les bêtes. La note crée une ambiguïté que cette analyse ne justifie pas.
  revised_text: La vérité y sera établie, et tous ceux qui sont souillés d’iniquité s’y enfuiront, comme les bêtes malfaisantes fuient et se glissent dans la forêt.
  revised_footnotes: []
