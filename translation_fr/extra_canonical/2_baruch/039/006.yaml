  text: And truth will hide itself in it, and all those who are stained with iniquity will flee to it, just as evil beasts flee and creep into the forest.
translation:
  language: fr
  text: La vérité y sera établie, et tous ceux qui sont souillés d’iniquité s’y enfuiront, comme les bêtes malfaisantes fuient et se glissent dans la forêt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܪܐ (šrārā)
  choice: la vérité
  rationale: Le nom syriaque désigne normalement la vérité, la véracité ou ce qui est ferme; « vérité » convient aussi à son opposition immédiate avec l’iniquité.
- source_word: ܘܬܬܩܝܡ (w-tetqayyām)
  choice: y sera établie
  rationale: La forme verbale visible dans le témoin fourni signifie « sera établie / se tiendra », et non « se cachera ».
- source_word: ܕܡܟܬܡܝܢ ܒܥܘܠܐ (d-mkattmīn b-ʿawlā)
  choice: qui sont souillés par l’iniquité
  rationale: Rend directement l’image de personnes tachées ou souillées par l’injustice, sans l’atténuer en simple culpabilité.
- source_word: ܬܥܪܘܩ ܠܘܬܗ̇ (teʿrōq lwāṯāh)
  choice: fuiront vers elle
  rationale: 'Conserve la tension du texte: ces personnes fuient en direction de cette réalité ou de ce royaume, plutôt que de s’en éloigner.'
- source_word: ܥܪܩܝܢ … ܘ… (ʿārqīn … w-…)
  choice: fuient et se glissent
  rationale: Traite les deux termes comme des actions parallèles accomplies par les bêtes, conformément à l’analyse grammaticale transmise.
theological_decisions:
- issue: Rapport entre vérité et royaume
  choice: La vérité y sera établie
  alternative: La sécurité y sera établie / la vérité s’y cachera
  rationale: Le substantif appuie « vérité » et le verbe lisible dans le témoin fourni appuie « sera établie ». La traduction ne transforme donc pas la phrase en affirmation de sécurité et ne suit pas la révision anglaise « se cachera », qui paraît reposer sur une autre lecture verbale.
- issue: Direction de la fuite des personnes iniques
  choice: fuiront vers elle
  alternative: s’enfuiront loin d’elle
  rationale: La préposition syriaque indique un mouvement vers elle. La formulation conserve cette difficulté interprétative au lieu de la résoudre théologiquement.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe conserve le mouvement paradoxal « fuiront vers elle » et l’image animale sans ajouter d’explication confessionnelle.
