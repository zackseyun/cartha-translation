  yaml_path: translation/extra_canonical/2_baruch/039/002.yaml
  text: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding it, this is the interpretation:'
translation:
  language: fr
  text: 'Quant à la grande forêt que tu as vue, entourée de montagnes hautes et escarpées, voici ce qu’elle signifie[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « voici la parole » ou « voici le propos ».
    reason: Le syriaque ܗܕܐ ܗܝ ܡܠܬܐ peut être rendu formellement par « ceci est la parole », mais le contexte lui donne le sens de « voici ce que cela signifie ».
lexical_decisions:
- source_word: ܥܒ̈ܐ ܣܓܝ̈ܐܐ
  choice: la grande forêt
  rationale: Dans le contexte de la vision, l’expression désigne l’imposante étendue boisée vue par Baruch ; cette formulation française naturelle concorde avec l’image reprise dans l’explication.
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: hautes et escarpées
  rationale: Les adjectifs décrivent les montagnes par leur grandeur ou hauteur et leur caractère rude, abrupt ; « hautes et escarpées » restitue clairement l’image.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: voici ce qu’elle signifie
  rationale: Littéralement « ceci est la parole », mais, dans l’introduction à l’explication d’une vision, ܡܠܬܐ désigne ici le sens ou la teneur de celle-ci. La traduction explicite cette fonction sans y importer le contenu des versets suivants.
theological_decisions:
- issue: Identification de la forêt à un royaume
  choice: Ne pas identifier encore la forêt à un royaume dans ce verset
  alternative: « C’est un royaume qui surgira en ces jours-là »
  rationale: Cette identification appartient à la suite de l’interprétation et ne figure pas dans le texte syriaque de 39:2 ; l’introduire ici confondrait les versets.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Quant à… voici… » conserve la fonction introductive du verset, tandis que « escarpées » rend concrètement le relief rude des montagnes.
