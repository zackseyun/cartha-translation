  text: And he answered and said to me, “But this is the interpretation of the vision that you saw.
translation:
  language: fr
  text: 'Il me répondit : « Mais voici l’interprétation de la vision que tu as vue :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Il me répondit
  rationale: Cette tournure française naturelle exprime pleinement l’idiome syriaque « il répondit et me dit » sans lourdeur artificielle.
- source_word: ܒܪܡ
  choice: cependant
  rationale: Le terme marque une transition adversative ou corrective. « Cependant » en conserve la valeur sans donner au début du discours une rudesse excessive.
- source_word: ܦܘܫܩܗ
  choice: l’interprétation
  rationale: Le nom désigne l’explication ou l’interprétation d’un contenu symbolique; « interprétation » convient précisément à une vision apocalyptique.
- source_word: ܚܙܘܐ
  choice: la vision
  rationale: Équivalent français direct du terme syriaque désignant ce qui est vu dans une révélation.
theological_decisions:
- issue: Nature de l’explication de la vision
  choice: interprétation
  alternative: explication
  rationale: « Interprétation » maintient le caractère symbolique et révélé de la vision sans identifier d’avance ses référents historiques.
translation_notes:
  register: Français international moderne, digne et fluide. L’idiome sémitique « répondit et dit » est rendu naturellement par « répondit ». « Voici cependant » conserve à la fois la transition et l’annonce de l’interprétation. Le deux-points final indique que l’explication se poursuit dans les versets suivants.
