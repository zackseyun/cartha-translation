- from: Celle-là aussi, après un certain temps, sera détruite. Une autre, une troisième, se lèvera ; elle dominera, elle aussi, pendant le temps qui lui est accordé, puis elle sera détruite.
  to: Elle aussi, après quelque temps, sera détruite. Alors un troisième royaume se lèvera ; lui aussi régnera en son temps, puis sera détruit.
  rationale: La révision conserve la succession et la répétition voulues, clarifie que le royaume qui surgit est le troisième et retire l’ajout théologique ou causal contenu dans « accordé ».
