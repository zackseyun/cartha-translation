  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: fr
  text: Elle aussi, après quelque temps, sera détruite. Alors un troisième royaume se lèvera ; lui aussi régnera en son temps, puis sera détruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܝ
  choice: celle-là
  rationale: Le pronom démonstratif féminin reprend naturellement « le royaume » (féminin en syriaque et en français) mentionné dans le contexte.
- source_word: ܙܒܢܐ
  choice: un certain temps / le temps qui lui est accordé
  rationale: Le terme désigne une période ou un temps déterminé. La formulation française distingue idiomatiquement le délai précédant la destruction et la période propre de domination, sans en préciser la durée.
- source_word: ܬܩܘܡ
  choice: se lèvera
  rationale: Le verbe exprime ici l’apparition ou l’établissement d’un royaume ; « se lèvera » conserve l’image du texte tout en restant naturel.
- source_word: ܬܫܬܠܛ
  choice: dominera
  rationale: Ce verbe renvoie à l’exercice du pouvoir ou de la souveraineté ; « dominera » convient au royaume évoqué.
- source_word: ܬܬܚܒܠ
  choice: sera détruite
  rationale: Dans cette succession de royaumes, le passif indique la ruine ou la destruction du royaume ; la traduction reprend le terme employé dans la proposition parallèle.
theological_decisions:
- issue: Identité des royaumes successifs
  choice: Conserver les désignations indéfinies « celle-là » et « une autre, une troisième »
  alternative: Identifier explicitement les royaumes à des empires historiques précis
  rationale: Le verset ne nomme pas lui-même ces royaumes. Une identification historique explicite résoudrait une question interprétative que le texte laisse ouverte.
- issue: Caractère déterminé de la période de domination
  choice: « pendant le temps qui lui est accordé »
  alternative: « pendant son temps »
  rationale: La formulation rend l’idée d’une période propre et limitée sans préciser explicitement qui l’accorde, préservant ainsi la retenue théologique du texte.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « sera détruite » est maintenue pour préserver le rythme de la succession des royaumes ; la ponctuation rend lisible l’enchaînement sans ajouter d’identification historique.
