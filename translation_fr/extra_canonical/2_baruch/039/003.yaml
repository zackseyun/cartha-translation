  text: And this kingdom that once destroyed Zion will be destroyed, and it will be subjected to the one that comes after it.
translation:
  language: fr
  text: Et ce royaume, qui avait détruit Sion, sera détruit et soumis à celui qui viendra après lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ce qui viendra après lui » ; le syriaque emploie une expression masculine sans identifier explicitement le successeur.'
    reason: Le référent peut être compris comme une personne ou comme une puissance politique désignée au masculin ; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: ܬܚܒܠ
  choice: sera détruit
  rationale: Le verbe exprime ici la ruine ou la destruction du royaume, en correspondance avec ce que ce même royaume avait infligé à Sion.
- source_word: ܚܒܠܬ ܠܨܗܝܘܢ
  choice: avait autrefois dévasté Sion
  rationale: « Dévaster » rend naturellement l’action destructrice exercée contre une ville, tandis que l’antériorité est exprimée en français par le plus-que-parfait.
- source_word: ܬܫܬܥܒܕ
  choice: sera […] soumis
  rationale: La forme passive indique l’assujettissement à une autorité étrangère.
- source_word: ܠܗ̇ܘ ܕܐܬܐ ܒܬܪܗ
  choice: à celui qui viendra après lui
  rationale: Le démonstratif masculin est conservé par « celui » et le mouvement de succession temporelle est rendu littéralement, sans identifier davantage le référent.
theological_decisions:
- issue: Identité de « celui qui viendra après lui »
  choice: Conserver la désignation indéterminée
  alternative: L’identifier explicitement comme un roi, un royaume ou une puissance messianique
  rationale: Le verset ne nomme pas ce successeur. Une identification explicite résoudrait une ambiguïté que le texte syriaque maintient.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve le parallélisme entre la dévastation passée de Sion et la destruction future du royaume.
