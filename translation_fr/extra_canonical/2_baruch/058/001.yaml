  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
translation:
  language: fr
  text: 'Écoute ce qu’est la grande nuée que tu as vue monter de la mer et couvrir cette terre : c’est le monde que sa puissance a fait lorsqu’il décida de créer. Quand la parole sortit de devant lui, le commencement du monde se dressa, encore tout petit, et il fut ordonné conformément à ce qu’il devait devenir.


    Quant aux premières eaux noires que tu as vues descendre de la nuée, elles représentent le péché, la transgression commise par le premier Adam. Car, lorsqu’il pécha, la mort fut mise en mouvement avant son temps ; le deuil se fit connaître, les souffrances furent préparées, l’angoisse fut créée, le labeur fut achevé et la grandeur commença à être abaissée.


    Quant au dernier jour, qui t’est apparu sous la forme qu’il avait prise, sache que le temps sera examiné, que la mesure de l’humanité sera mesurée et que sa force sera mise à l’épreuve. C’est pourquoi Adam, lorsqu’il entendit de Dieu quelque chose de ce qui devait arriver, médita sur la délivrance des morts qui avait été accordée et sur l’ordre qu’il avait reçu de Dieu. Il poursuivit sa réflexion et conçut cinq pensées.[a] En effet, il s’était rendu lui-même coupable et, par lui, les anges aussi furent rendus coupables. Au moment de sa création, une vision lui fut montrée : la vie amère et les éléments avec le feu. Ainsi Dieu les rassembla alors, à la ressemblance de ceux qui avaient été créés.'
  philosophy: optimal-equivalence
  footnotes:
