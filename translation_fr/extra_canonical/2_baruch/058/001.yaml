    reason: La relation syntaxique entre l’écoute, la délivrance des morts, l’ordre divin et les cinq pensées demeure incertaine.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: le commencement du monde
  rationale: La locution évoque l’apparition ou l’établissement primordial du monde. « Commencement » conserve le cadre créationnel sans imposer le sens plus technique de « fondement ».
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: le péché, la transgression
  rationale: Le doublet syriaque est conservé afin de rendre à la fois la faute et le franchissement d’une limite.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: la mort fut mise en mouvement
  rationale: Le verbe décrit l’activation de la mort plutôt que sa simple existence. Cette formulation garde l’image sans la préciser abusivement.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: la grandeur commença à être abaissée
  rationale: La traduction préserve à la fois la grandeur ou majesté et le mouvement d’abaissement exprimé par le syriaque.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: la mesure de l’humanité
  rationale: Dans le parallélisme avec le temps examiné et la force éprouvée, « mesure » garde la portée évaluative du terme sans en faire une règle juridique.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: la délivrance des morts
  rationale: La locution est difficile. « Délivrance » reste proche de l’idée de libération ou de remise sans l’identifier explicitement à la résurrection.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: rendu coupable
  rationale: Le terme possède une nuance judiciaire de culpabilité encourue ; « rendu coupable » la conserve mieux qu’une simple mention d’un sentiment de faute.
- source_word: ܐܣܛܘܟܣܐ
  choice: les éléments
  rationale: Cet emprunt grec désigne vraisemblablement les éléments cosmiques. Le terme français est clair et peu chargé d’interprétation.
- source_word: ܒܥܕܢ
  choice: en Éden
  rationale: La graphie permet de comprendre le mot comme le nom Éden, lecture retenue dans le texte tout en signalant en note la possibilité d’une expression temporelle.
theological_decisions:
- issue: La faute d’Adam et l’entrée en action de la mort
  choice: La transgression d’Adam met la mort en mouvement avant son temps et entraîne une série de maux.
  alternative: Comprendre le passage comme une description générale de la condition humaine, avec un lien causal moins marqué.
  rationale: Le syriaque relie directement le péché d’Adam à la mort, au deuil, aux souffrances, à l’angoisse et aux peines. La traduction maintient cette logique sans développer une doctrine au-delà du texte.
- issue: La « délivrance des morts »
  choice: Conserver une expression relativement littérale et l’insérer dans une phrase française lisible.
  alternative: L’expliciter comme la résurrection des morts, la remise de leur peine ou leur envoi dans la mort.
  rationale: La syntaxe et la portée doctrinale de la proposition sont incertaines. Une explicitation trancherait une ambiguïté réelle du témoin syriaque.
- issue: La culpabilité des anges liée à Adam
  choice: Conserver la relation exprimée par « par lui » sans expliquer de quelle manière les anges deviennent coupables.
  alternative: Dire qu’Adam accusait les anges ou qu’il était déclaré coupable devant eux.
  rationale: La construction syriaque est difficile et les lectures possibles ont des implications distinctes. Le texte suit ici la lecture contrôlée de la couche de consultation tout en évitant toute amplification doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe apocalyptique et les répétitions significatives sont conservées, tandis que les segments les plus obscurs sont rendus lisibles sans effacer leurs ambiguïtés. Les termes confessionnellement chargés ont été évités lorsque le syriaque ne permet pas de trancher.
