review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire, surtout pour la clause du jugement individuel : « jugé par lui-même » suggère en français qu’une personne se juge elle-même, alors que le syriaque emploie le verbe « être jugé » et souligne l’isolement / la responsabilité individuelle. Les images d’approche initiales gagnent aussi à être rendues avec des relations syntaxiques explicites. La finale doit conserver l’ambiguïté de ܥܠܡܐ (« monde », « âge ») sans employer l’expression peu naturelle « pour son monde ».'
  naturalness: Le registre est globalement digne et accessible. Toutefois, « le voyage de la ville » et « la vie de son terme » sont elliptiques au point de paraître fautifs en français moderne. « Sera jugé par lui-même, seul » est à la fois peu naturel et sémantiquement trompeur. « Pour son monde » n’est pas idiomatique dans cette fonction.
  terminology: « Très-Haut », « commandements », « miséricorde », « repentance », « repos », « condamnation », « justes » et « péchés » conviennent. « Repentance » reste un terme religieux international compréhensible. « Préserver pour son âge » restitue de manière plus proche du témoin anglais et de l’ambiguïté du syriaque ܥܠܡܐ, tout en évitant d’imposer « éternité ».
  issues:
  - severity: high
    issue: « chacun de nous sera alors jugé par lui-même, seul »
    rationale: Cette tournure peut vouloir dire que chacun agit comme son propre juge. Le syriaque porte directement « être jugé » et l’adverbe « seul » ; il faut exprimer le jugement individuel sans introduire une auto-évaluation.
  - severity: medium
    issue: Images initiales syntaxiquement opaques
    rationale: « le voyage de la ville » et « la vie de son terme » ne rendent pas naturellement les comparaisons d’imminence. Une formulation parallèle explicite conserve les images et leur sens.
  - severity: medium
    issue: « pour son monde » dans la phrase finale
    rationale: L’expression est peu idiomatique et sonne comme une possession géographique. « Pour son âge » restitue le sens eschatologique possible de ܥܠܡܐ, conformément au choix anglais, sans supprimer entièrement l’ambiguïté lexicale.
