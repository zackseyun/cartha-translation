  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
translation:
  language: fr
  text: '… car les temps sont proches et déjà pressants. La cruche est près du puits, le navire près du port, le voyage près de la ville, et la vie près de son terme.


    Recevez donc ses commandements, afin de ne pas être retranchés de l’abondance de sa miséricorde, mais de trouver le repos plutôt que la condamnation.


    Car lorsque le Très-Haut accomplira ces choses, il n’y aura plus de place pour la repentance, plus de limite assignée aux temps, plus de prolongation des saisons ni de retour vers le repos. Personne ne recevra alors d’aide par la prière, par l’intercession des pères, par la supplication des prophètes, par le secours des justes, par les pleurs des femmes, par la tendresse des petits enfants, par les cris des nourrissons, par l’innocence des nouveau-nés ou par la justice de leurs pères. Rien de ce que l’on avait tenu et reconnu pour capable de secourir ne pourra alors apporter de secours.


    Car chacun de nous sera alors jugé seul.[a]


    Et il préservera pour son âge ceux qui espèrent en lui, mais il fera périr sur-le-champ ceux qui sont souillés par les péchés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chacun de nous sera alors jugé pour son propre compte ».'
    reason: Le syriaque emploie directement le verbe « être jugé » et souligne que chacun l’est seul. La note explicite la nuance de responsabilité individuelle sans suggérer qu’une personne se juge elle-même.
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: ses commandements
  rationale: Le terme désigne des prescriptions investies d’une autorité divine; « commandements » conserve sa portée exhortative et religieuse.
- source_word: ܬܐܢܝܚܘܢ
  choice: trouver le repos
  rationale: Cette formulation garde à la fois l’idée de soulagement et celle du repos eschatologique, ici opposé à la condamnation.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: les pleurs des femmes
  rationale: La traduction concrète préserve la force cumulative de cette liste d’appels devenus inefficaces.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: la tendresse des petits enfants
  rationale: Le substantif peut évoquer la bonté, la douceur ou le caractère attendrissant; « tendresse » convient au ressort affectif du passage.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: l’innocence des nouveau-nés
  rationale: « Innocence » exprime naturellement en français la pureté prêtée aux nouveau-nés.
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ (lecture corrigée du texte transmis ܐܪܙܐ ܠܬܚܘܝܬܐ)
  choice: de place pour la repentance
  rationale: Le texte transmis paraît corrompu; la lecture contrôlée sous-jacente à la tradition de traduction donne le sens contextuellement cohérent d’une absence définitive de possibilité de repentance.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: souillés par les péchés
  rationale: Le sens littéral est difficile; cette formulation rend avec retenue l’état moral produit par les péchés sans développer une interprétation doctrinale.
- source_word: ܠܥܠܡܘܗܝ
  choice: pour son monde
  rationale: ܥܠܡܐ peut désigner le monde, l’âge ou l’éternité. « Son monde » préserve ici l’ambiguïté eschatologique mieux que « son époque ».
theological_decisions:
- issue: Maintien du long catalogue des intercessions et secours devenus inefficaces
  choice: Conserver séparément la prière, les pères, les prophètes, les justes, les femmes et les enfants.
  alternative: Résumer l’ensemble par « aucune intercession ne pourra alors aider ».
  rationale: L’accumulation appartient à la rhétorique du syriaque et souligne la responsabilité individuelle lors du jugement final.
- issue: Sens de la proposition sur le jugement individuel
  choice: « chacun de nous sera alors jugé par lui-même, seul »
  alternative: « chacun de nous se tiendra alors seul »
  rationale: La révision textuelle signale un verbe signifiant directement « être jugé ». La formulation conserve néanmoins l’ambiguïté de « par lui-même », qui peut évoquer l’absence de soutien ou une responsabilité propre.
- issue: Relation entre l’espérance et Dieu dans la clause finale
  choice: « ceux qui espèrent en lui »
  alternative: « ceux en qui se trouve l’espérance »
  rationale: Le contexte permet de comprendre que leur espérance se porte vers Dieu; la traduction française explicite seulement la relation requise par l’idiome sans ajouter de qualification doctrinale.
