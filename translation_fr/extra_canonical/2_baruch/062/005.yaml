translation:
  language: fr
  text: Et le temps de la captivité[a] survenue aux neuf tribus et demie, à cause de leurs nombreux péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur captivité, survenue aux neuf tribus et demie » .
    reason: La construction source peut être comprise sans le terme « temps », avec un possessif rattachant explicitement la captivité aux neuf tribus et demie.
  - marker: b
    text: 'Littéralement : « parce qu’ils étaient dans de nombreux péchés ».'
    reason: Conserve en note la tournure sémitique sous-jacente, rendue idiomatiquement dans le texte.
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: le temps
  rationale: Rend le terme temporel de façon directe et conserve la construction elliptique qui s’inscrit dans l’énumération du contexte.
- source_word: captivité (lecture attestée par la couche de consultation)
  choice: captivité
  rationale: Terme français courant et historiquement approprié pour la déportation ou l’état de ceux qui ont été emmenés captifs.
- source_word: neuf tribus et demie (lecture attestée par la couche de consultation)
  choice: les neuf tribus et demie
  rationale: Conserve précisément le nombre traditionnel sans chercher à identifier ou à harmoniser les tribus concernées.
- source_word: péchés (lecture attestée par la couche de consultation)
  choice: leurs nombreux péchés
  rationale: Exprime naturellement en français l’idiome sémitique littéral « être dans de nombreux péchés ».
theological_decisions:
- issue: Lien entre la captivité et les péchés
  choice: à cause de leurs nombreux péchés
  alternative: parce qu’ils étaient dans de nombreux péchés
  rationale: La formulation retenue rend clairement le rapport causal tout en évitant un calque peu naturel; elle ne précise pas davantage la nature théologique de ce rapport.
- issue: Rapport syntaxique entre le temps et la captivité
  choice: le temps de la captivité qui frappa
  alternative: le temps de leur captivité
  rationale: La formulation principale suit la lecture révisée de la couche de consultation; la variante est signalée afin de préserver l’ambiguïté de rattachement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde son caractère d’élément dans une énumération plus large. Le témoin syriaque fourni correspond à un ensemble de pages interpolé et ne permet pas d’isoler avec sûreté chaque mot du verset; les détails non directement repérables sont donc établis avec prudence à partir de la couche anglaise auditée.
