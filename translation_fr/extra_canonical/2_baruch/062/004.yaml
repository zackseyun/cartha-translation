- from: La pluie fut retenue, et des famines survinrent, au point que des femmes mangèrent le fruit de leur propre ventre.
  to: La pluie fut retenue, et des famines survinrent, jusqu’à ce que des femmes mangent le fruit de leur ventre.
  rationale: Remplacement de « au point que » par « jusqu’à ce que » afin de conserver la relation exprimée par le texte de contrôle, et suppression de « propre », non nécessaire en français. Le sens, la sobriété et l’absence d’attribution explicite de l’action à un agent sont préservés.
