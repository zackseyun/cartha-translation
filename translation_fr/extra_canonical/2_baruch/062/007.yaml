  yaml_path: translation/extra_canonical/2_baruch/062/007.yaml
  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: fr
  text: Quant aux nations, il serait trop long de raconter comment elles n’ont cessé d’agir avec impiété et méchanceté, sans jamais se montrer justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܥܡܡ̈ܐ (sens attendu dans le passage : « les nations »)'
  choice: les nations
  rationale: Terme collectif courant pour les peuples autres qu’Israël dans ce contexte; « les païens » ajouterait une coloration religieuse plus interprétative.
- source_word: notion d’action continue (reflétée par la tradition textuelle consultée)
  choice: n’ont cessé d’agir
  rationale: Rend naturellement en français la persistance de leur conduite, sans alourdir la phrase avec « continuellement ».
- source_word: notions d’impiété et de méchanceté
  choice: avec impiété et méchanceté
  rationale: Conserve les deux qualifications morales distinctes au lieu de les fondre en une seule.
- source_word: notion de manifestation comme juste
  choice: se montrer justes
  rationale: Préserve la nuance d’une justice rendue visible dans la conduite, plutôt que d’affirmer seulement un état abstrait.
theological_decisions:
- issue: Portée de l’affirmation concernant la justice des nations
  choice: « sans jamais se montrer justes »
  alternative: « sans jamais être justes »
  rationale: La formulation retenue évite de transformer une appréciation de leur conduite manifeste en déclaration ontologique plus absolue.
translation_notes:
  register: Français international moderne, clair et digne. La construction « Quant aux nations » marque le changement de sujet; « il serait trop long de raconter » reste idiomatique tout en conservant l’idée d’un récit trop ample. Le lot syriaque fourni couvre plusieurs pages et présente un texte fortement bruité dont l’alignement exact du verset est incertain; la rédaction demeure donc prudente et suit le sens attesté par la couche de consultation auditée sans ajouter de précision confessionnelle.
