base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/062/001.yaml
  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: fr
  text: '1. Et les septièmes eaux noires que tu as vues : c’est la perversion suscitée par le dessein de Jéroboam, qui avait projeté de faire deux veaux d’or.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ / ܚܫ̈ܟܐ
  choice: eaux noires
  rationale: « Noires » conserve le contraste visuel marqué de la série apocalyptique, plutôt que de l’atténuer par « sombres ».
- source_word: ܚܒܠܬܐ
  choice: perversion
  rationale: Le terme désigne ici une déformation religieuse et morale; « perversion » garde cette force sans réduire le sens à une simple destruction.
- source_word: ܡܠܟܐ / notion de conseil dans le texte contrôlé
  choice: conseil… résolut
  rationale: « Conseil » préserve l’idée de délibération ou de dessein, tandis que « résolut » rend naturellement en français la décision prise par Jéroboam, sans répétition pesante.
- source_word: ܬܪܝܢ ܥܓ̈ܠܐ ܕܕܗܒܐ
  choice: deux veaux d’or
  rationale: Formulation biblique française claire et directe pour les deux images cultuelles établies par Jéroboam.
theological_decisions:
- issue: Accord du démonstratif avec les eaux au pluriel ou avec « perversion » au singulier
  choice: c’est la perversion
  alternative: ce sont les perversions
  rationale: Le syriaque emploie une construction féminine singulière liée au nom prédicatif « perversion ». Le français « c’est » respecte cette syntaxe tout en restant naturel.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le symbolisme apocalyptique ainsi que la qualification morale forte du geste de Jéroboam.
