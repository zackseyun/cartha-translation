    rationale: Dans l’usage actuel, « conseil » peut désigner une assemblée ou un avis donné à quelqu’un. Le contexte vise plutôt le dessein ou le projet délibéré de Jéroboam. Une légère révision améliore l’intelligibilité tout en préservant l’insistance du texte sur sa délibération.
