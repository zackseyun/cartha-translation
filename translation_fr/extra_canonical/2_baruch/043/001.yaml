  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: fr
  text: Mais toi, Baruch, affermis ton cœur dans ce qui t’a été dit et comprends ce qui t’a été montré, car une grande consolation t’est assurée pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܘܫ ܐܬܩܢ ܠܒܟ
  choice: Mais toi, Baruch, affermis ton cœur
  rationale: L’expression conserve l’image concrète du cœur que l’on rend ferme et exprime naturellement, en français actuel, la stabilité intérieure demandée à Baruch.
- source_word: ܠܡܕܡ ܕܐܬܐܡܪ ܠܟ
  choice: dans ce qui t’a été dit
  rationale: Cette formulation maintient le renvoi général aux paroles précédemment adressées à Baruch sans en préciser davantage le contenu.
- source_word: ܘܐܣܬܟܠ ܐܝܠܝܢ ܕܐܬܚܘܝ ܠܟ
  choice: et comprends ce qui t’a été montré
  rationale: Le passif préserve la formulation révélatoire du syriaque et le parallélisme entre ce qui a été dit et ce qui a été montré.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ
  choice: une grande consolation t’est réservée pour toujours
  rationale: « Consolation » rend la valeur réconfortante du nom, tandis que « pour toujours » conserve explicitement la durée indéfinie exprimée par le syriaque. « T’est réservée » donne une phrase française idiomatique sans réduire cette promesse à un sentiment présent.
theological_decisions:
- issue: Nature et durée de la consolation promise à Baruch
  choice: Une grande consolation promise pour toujours
  alternative: De nombreuses consolations éternelles
  rationale: Le syriaque associe l’abondance de la consolation à sa permanence. Le français au singulier évite une pluralisation incertaine tout en gardant la portée durable, voire eschatologique, de la promesse sans en définir le mécanisme.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif « affermis ton cœur » garde l’image sémitique tout en restant immédiatement compréhensible. La traduction se limite au contenu attribuable à 2 Baruch 43:1 dans le témoin syriaque fourni.
