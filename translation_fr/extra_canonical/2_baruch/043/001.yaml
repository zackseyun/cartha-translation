  source_fidelity: Le verset syriaque exhorte Baruch à affermir/disposer son cœur à l’égard de ce qui lui a été dit et à comprendre ce qui lui a été montré. Il affirme ensuite qu’« une grande consolation » lui appartient ou lui est assurée de façon permanente. Le rendu proposé est globalement fidèle, mais « t’est réservée » introduit plus nettement une idée de mise en réserve future que ne porte ܐܝܬ ܠܟ (« il y a pour toi / tu as »).
  naturalness: « Affermis ton cœur », « ce qui t’a été dit » et « ce qui t’a été montré » sont naturels dans un français moderne de registre soutenu. « Une grande consolation t’est assurée pour toujours » reste fluide et exprime la promesse sans la déplacer indûment dans un avenir seulement implicite.
