translation:
  language: fr
  text: Ou qui, parmi les mortels, peut trouver[a] le commencement et la fin de ta sagesse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « découvrir ».
    reason: Le syriaque ܡܫܟܚ peut être rendu par « trouver » ou « découvrir » ; la note préserve cette nuance lexicale.
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: peut trouver
  rationale: Le verbe syriaque signifie couramment « trouver » ou « découvrir ». « Trouver » reste proche du sens lexical tout en étant naturel dans cette question rhétorique.
- source_word: ܪܥܝܢܐ ܐܢܫܝܢ ܢܫܐ
  choice: parmi les mortels
  rationale: Le texte transmis est difficile à lire à cet endroit, mais désigne les êtres humains. « Mortels » rend naturellement le contraste implicite entre l’humanité limitée et la sagesse divine.
- source_word: ܫܘܠܡܐ ܕܚܟܡܬܟ
  choice: la fin de ta sagesse
  rationale: ܫܘܠܡܐ désigne l’achèvement ou la fin ; le possessif de deuxième personne est conservé directement.
theological_decisions:
- issue: Caractère insondable de la sagesse divine
  choice: Conserver la question rhétorique sans expliciter davantage son implication théologique.
  alternative: Ajouter que nul ne peut sonder pleinement la sagesse de Dieu.
  rationale: Le texte exprime lui-même la limite humaine par une interrogation ; une affirmation explicative supplémentaire dépasserait la formulation source.
translation_notes:
  register: Français moderne, international et digne. La structure interrogative et l’adresse directe à Dieu sont conservées ; la formulation reste intelligible sans résoudre la tension entre recherche humaine et sagesse inaccessible.
