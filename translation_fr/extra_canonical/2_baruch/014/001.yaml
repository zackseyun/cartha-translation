  yaml_path: translation/extra_canonical/2_baruch/014/001.yaml
  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: fr
  text: 'Alors je répondis : « Voici, tu m’as montré le cours des temps et ce qui doit arriver après ces événements ; tu m’as aussi dit que la rétribution dont tu as parlé viendra sur les nations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: le cours
  rationale: Le nom signifie littéralement « voie » ou « chemin », mais, dans ce contexte apocalyptique lié aux temps, « le cours » exprime naturellement leur déroulement ordonné sans effacer l’image sous-jacente.
- source_word: ܦܘܪܥܢܐ
  choice: la rétribution
  rationale: Le terme désigne ici la juste contrepartie ou le châtiment infligé dans un cadre de jugement. « Rétribution » conserve cette portée judiciaire mieux qu’un terme général comme « conséquence ».
- source_word: ܥܡܡ̈ܐ
  choice: les nations
  rationale: Ce choix rend le pluriel collectif usuel et maintient la portée du jugement au-delà d’un seul peuple.
theological_decisions:
- issue: Portée judiciaire des paroles adressées à Baruch
  choice: Conserver explicitement la rétribution annoncée par Dieu et sa venue sur les nations.
  alternative: Parler seulement d’une rétribution future, sans mention de son annonce antérieure ni des nations.
  rationale: La formulation syriaque, confirmée par le contrôle textuel, rattache la rétribution à ce que Dieu a déjà déclaré et précise qu’elle atteindra les nations. Ces éléments soutiennent le thème du jugement divin et ne doivent pas être omis.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » garde la solennité discursive du texte, tandis que « après ces événements » évite une tournure excessivement littérale. Le point-virgule structure la longue déclaration sans en durcir le rythme.
