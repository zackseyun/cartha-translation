translation:
  language: fr
  text: et pour qui les prophètes ont-ils été donnés[a], et pour qui a-t-on recherché l’effort pour le bien[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont-ils été trouvés » ; le sens peut être « ont-ils été mis à disposition » ou « donnés ».'
    reason: La forme passive syriaque du verbe « trouver » est conservée en note, tandis que « donnés » exprime sobrement le sens contextuel en français.
  - marker: b
    text: 'Littéralement : « le labeur du bien » ; autre traduction possible : « les bonnes œuvres ».'
    reason: Le syntagme syriaque est singulier et associe le labeur ou l’effort au bien.
lexical_decisions:
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: l’accomplissement du bien
  rationale: L’expression signifie littéralement « le labeur/l’effort du bien ». « L’accomplissement du bien » conserve l’idée d’un effort actif tout en donnant une formulation française naturelle dans cette question.
- source_word: ܢܫܬܟܚ ܠܗܘܢ
  choice: ont-ils été accordés
  rationale: Le verbe signifie formellement « être trouvé », mais, avec ܠܗܘܢ (« pour eux/à eux »), il peut exprimer ici le fait d’être disponible ou pourvu. « Être accordés » rend ce sens contextuel sans préciser par quel moyen.
- source_word: ܡܬܒܥܝܢ
  choice: a-t-on recherché
  rationale: Le choix conserve l’idée de recherche ou de quête portée par la racine syriaque et maintient la forme interrogative rhétorique.
theological_decisions:
- issue: Rapport entre les bénéficiaires, les bonnes actions et les prophètes
  choice: Conserver deux questions parallèles sans identifier explicitement les bénéficiaires.
  alternative: Interpréter le passage comme une affirmation concernant exclusivement Israël ou les justes.
  rationale: Le syriaque formule une interrogation générale et ne nomme pas ici le groupe visé; l’expliciter résoudrait indûment l’ambiguïté du texte.
- issue: Sens de la venue des prophètes
  choice: « accordés », avec une note signalant le sens littéral « trouvés »
  alternative: « donnés » ou « suscités »
  rationale: « Accordés » exprime la mise à disposition suggérée par le contexte, tandis que la note préserve la forme lexicale du syriaque. « Suscités » ajouterait une précision théologique absente du verbe.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’inversion interrogative et le parallélisme sont conservés. Le verset commence par une minuscule parce qu’il poursuit syntaxiquement la phrase précédente dans le découpage fourni.
