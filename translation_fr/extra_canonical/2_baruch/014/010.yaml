translation:
  language: fr
  text: Car nous sommes tous devenus comme un souffle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ (heblā)
  choice: un souffle
  rationale: Le terme peut évoquer un souffle, une vapeur ou la vanité. « Un souffle » conserve ici l’image de la fragilité et du caractère passager de l’existence, en accord avec le contexte et sans réduire le mot à une notion abstraite.
- source_word: ܗܘܝܘ (forme de hwā, « devenir/être »)
  choice: sommes devenus
  rationale: Cette formulation rend le changement d’état exprimé par le verbe et correspond à la valeur attestée par la tradition textuelle du verset.
theological_decisions:
- issue: Portée de l’image du souffle
  choice: Conserver l’image concrète « comme un souffle »
  alternative: « comme vanité » ou « comme une vapeur »
  rationale: L’image exprime la fragilité commune des êtres humains sans imposer une interprétation théologique supplémentaire; elle préserve aussi la polysémie du syriaque ܗܒܠܐ.
translation_notes:
  register: Français moderne, simple et digne. La phrase brève garde le parallélisme et la force méditative du texte source.
