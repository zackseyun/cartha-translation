  text: But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.
translation:
  language: fr
  text: Mais les justes peuvent à bon droit espérer la fin ; ils sortent de cette demeure sans crainte, car ils ont auprès de toi un dépôt d’œuvres conservé dans des trésors.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܡܐ
  choice: la fin
  rationale: Le terme syriaque peut désigner la fin ou l’achèvement. « La fin » conserve ici la portée eschatologique sans préciser davantage ce que le texte laisse ouvert.
- source_word: ܡܫܪܝ
  choice: demeure
  rationale: Le mot évoque un lieu de séjour ou un campement. « Demeure » rend naturellement l’image d’un séjour présent et provisoire.
- source_word: ܣܝ̈ܡܬܐ / ܐܘܨܪ̈ܐ
  choice: une réserve … dans des trésors
  rationale: Cette formulation conserve l’image concrète d’œuvres mises en dépôt et gardées dans des lieux de stockage célestes, sans la réduire à une simple idée de mérite.
theological_decisions:
- issue: Fondement de l’espérance des justes
  choice: Conserver côte à côte l’espérance des justes et leurs œuvres gardées auprès de Dieu.
  alternative: Reformuler les œuvres comme la cause explicite de leur salut ou, à l’inverse, atténuer leur rôle.
  rationale: Le texte associe ces deux éléments sans définir précisément leur rapport causal ; la traduction préserve cette tension.
- issue: Sens de « auprès de toi »
  choice: Employer « auprès de toi » en maintenant l’adresse à Dieu.
  alternative: Expliciter « dans le ciel » ou « devant Dieu ».
  rationale: Le pronom de deuxième personne exprime une relation directe avec Dieu et ne doit pas être remplacé par une localisation interprétative.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde les images du séjour quitté et des œuvres déposées dans des trésors, tout en évitant un vocabulaire confessionnel technique.
