  text: Therefore they leave this world without fear, and with trust and gladness they wait to receive the world that you promised them …
translation:
  language: fr
  text: C’est pourquoi ils quittent ce monde sans crainte et, avec confiance et joie, ils attendent de recevoir le monde que tu leur as promis…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et, confiants, ils attendent dans la joie de recevoir… »'
    reason: La construction peut être rendue en faisant de la confiance un adjectif se rapportant aux personnes et de la joie une circonstance de leur attente.
lexical_decisions:
- source_word: ܥܠܡܐ / terme correspondant dans la tradition syriaque du verset
  choice: monde
  rationale: Le contexte oppose le monde présent, que les justes quittent, au monde promis qu’ils attendent de recevoir. « Monde » conserve cette symétrie eschatologique sans préciser indûment « âge » ou « vie future ».
- source_word: ܬܟܝܠܐܝܬ / forme adverbiale signalée par le contrôle critique
  choice: avec confiance
  rationale: Cette tournure française naturelle exprime la manière d’attendre et évite de faire de la joie l’objet de la confiance.
- source_word: ܚܕܘܬܐ / terme correspondant à la joie
  choice: joie
  rationale: « Joie » rend directement le sens affectif tout en gardant un registre digne et courant.
theological_decisions:
- issue: Nature du monde promis
  choice: le monde que tu leur as promis
  alternative: le monde à venir
  rationale: La formulation retenue préserve l’accent du texte sur la promesse divine et n’ajoute pas une désignation théologique plus explicite que la source.
- issue: Disposition des justes face à la mort ou au départ du monde présent
  choice: sans crainte… avec confiance et joie
  alternative: hardiment… dans l’allégresse
  rationale: Le choix conserve ensemble l’absence de peur, la confiance et la joie, sans transformer cette assurance en présomption ni expliciter son fondement au-delà du texte.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase conserve le parallélisme entre « ce monde » et « le monde » promis, ainsi que les trois nuances distinctes : absence de crainte, confiance et joie. Les points de suspension reflètent le caractère tronqué ou continu de l’extrait fourni.'
