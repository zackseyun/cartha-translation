  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: fr
  text: 'Mais je parlerai devant toi : qu’ont obtenu de plus ceux qui t’ont connu et qui n’ont pas marché dans la vanité comme le reste des nations[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme les autres ».'
    reason: Signale sobrement la possibilité de rendre plus brièvement l’expression comparative, sans présenter cette option comme une variante textuelle ni retrancher « des nations » du texte principal.
lexical_decisions:
- source_word: ܐܡܠܠ ܩܕܡܝܟ
  choice: je parlerai devant toi
  rationale: Rend directement la tournure syriaque, tout en conservant le registre solennel de la prière.
- source_word: ܡܢܐ ܝܬܝܪ
  choice: quel avantage de plus
  rationale: Exprime naturellement en français la question portant sur ce que ces personnes ont obtenu de plus.
- source_word: ܝܕܥܘ
  choice: ont connu
  rationale: Conserve le sens relationnel et théologique du verbe « connaître » sans le réduire à un simple savoir intellectuel.
- source_word: ܗܒܠܐ
  choice: la vanité
  rationale: Maintient le champ sémantique biblique de ce qui est vain, vide ou futile.
- source_word: ܫܪܟܐ ܕܥܡ̈ܡܐ
  choice: le reste des nations
  rationale: Préserve le contraste explicite avec les autres nations, attesté par la tradition textuelle contrôlant ce passage.
theological_decisions:
- issue: Avantage de ceux qui connaissent Dieu
  choice: La formulation reste interrogative et ne précise pas la réponse.
  alternative: Affirmer qu’ils n’ont obtenu aucun avantage.
  rationale: Le texte pose une question chargée de tension sans en donner ici une résolution explicite.
- issue: Sens de « vanité »
  choice: Conserver « vanité » au sens biblique.
  alternative: Traduire par « futilité », « illusion » ou « idolâtrie ».
  rationale: « Vanité » maintient l’ampleur sémantique du terme et évite d’imposer une interprétation exclusivement idolâtrique.
translation_notes:
  register: Français moderne, digne et accessible. La question est formulée naturellement, tout en conservant l’adresse solennelle à Dieu et l’ambiguïté rhétorique du passage.
