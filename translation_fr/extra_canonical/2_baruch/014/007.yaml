translation:
  language: fr
  text: Ou qui, Seigneur, connaît ton jugement ? Ou qui peut sonder la profondeur de ta voie ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ (dīnak)
  choice: ton jugement
  rationale: Le nom syriaque désigne ici le jugement ou la décision judiciaire de Dieu. « Ton jugement » conserve le sens et le parallélisme sans préciser indûment s’il s’agit d’un verdict particulier ou de la faculté divine de juger.
- source_word: ܒܥܐ / ܒܨܐ (verbe reconstruit dans la lecture contrôlée)
  choice: sonder
  rationale: Dans ce contexte, le verbe exprime une recherche visant à pénétrer ou comprendre ce qui est profond; « sonder » est naturel en français et convient à l’image de la profondeur.
- source_word: ܥܘܡܩܐ (ʿūmqā)
  choice: la profondeur
  rationale: Traduction directe du terme syriaque indiquant la profondeur; cet élément doit être conservé, car il qualifie le caractère insondable de la voie divine.
- source_word: ܐܘܪܚܟ (ʾurḥāk)
  choice: ta voie
  rationale: '« Voie » garde la métaphore syriaque et son amplitude: manière d’agir, dessein ou conduite de Dieu.'
theological_decisions:
- issue: Caractère connaissable du jugement et de la voie de Dieu
  choice: Formuler deux questions rhétoriques sans expliciter la réponse
  alternative: Dire directement que personne ne peut connaître le jugement ni sonder la voie de Dieu
  rationale: Le syriaque maintient la forme interrogative, qui exprime l’humilité devant le mystère divin sans transformer implicitement la question en affirmation doctrinale absolue.
- issue: Portée de « jugement »
  choice: Conserver « ton jugement » au singulier
  alternative: Traduire par « ta justice », « tes décisions » ou « ta manière de juger »
  rationale: « Jugement » respecte au mieux la polysémie du terme source et évite de restreindre le sens à une qualité morale, à plusieurs décrets ou à une procédure.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement de Dieu correspond au registre biblique français courant. La formulation concise conserve le parallélisme et la tension rhétorique du syriaque.
