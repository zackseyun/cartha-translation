  text: who did not seek the vanity of the dead, but desired you, and did not turn their hearts to what is small and passing,
translation:
  language: fr
  text: eux qui n’ont pas recherché la vanité des morts[a], mais qui t’ont désiré et n’ont pas tourné leur cœur vers ce qui est insignifiant et passager,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre compréhension de l’expression : « recherché les morts ».'
    reason: Signale l’ancienne analyse possible de l’expression tout en maintenant dans le texte principal le substantif syriaque rendu par « vanité ».
lexical_decisions:
- source_word: ܣܪܝܩܘܬܐ ܕܡܝ̈ܬܐ
  choice: la vanité des morts
  rationale: Le nom syriaque désigne la vacuité, la vanité ou la futilité; il doit être conservé plutôt que de réduire l’expression à « les morts ».
- source_word: ܨܒܝܢܝ
  choice: t’ont désiré
  rationale: Le verbe exprime ici le désir ou l’attachement dirigé vers Dieu; « t’ont désiré » garde cette force sans préciser davantage sa nature.
- source_word: ܙܥܘܪܘ … ܕܡܬܒܥܝܢ
  choice: ce qui est insignifiant et passager
  rationale: Cette formulation française restitue l’idée de petitesse et de caractère transitoire transmise par le contexte, dans une langue naturelle.
theological_decisions:
- issue: Objet opposé au désir de Dieu
  choice: la vanité des morts
  alternative: les morts
  rationale: La traduction retient explicitement le substantif « vanité/vacuité » attesté dans la formulation syriaque et évite de faire de la recherche des morts eux-mêmes l’unique sens possible.
- issue: Orientation intérieure
  choice: n’ont pas tourné leur cœur
  alternative: n’ont pas attaché leur cœur
  rationale: La formulation avec « tourner » préserve l’image d’une orientation du cœur sans introduire une notion plus forte d’attachement durable.
translation_notes:
  register: Français moderne, international et digne. La structure relative et le parallélisme sont conservés; la virgule finale indique que le verset appartient à une phrase plus large.
