  text: For what profit is there in this, or what is worse than these things that we have seen, that we should desire to wait to see?
translation:
  language: fr
  text: Car quel avantage y a-t-il à cela ? Ou qu’y aurait-il de pire que les choses que nous avons vues, pour que nous désirions attendre pour voir[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « espérer voir ».'
    reason: Le verbe syriaque peut évoquer l’attente, l’espérance ou l’expectative. La note conserve cette possibilité sans préciser l’objet implicite de « voir ».
lexical_decisions:
- source_word: ܝܘܬܪܢܐ (yūtrānā)
  choice: avantage
  rationale: Rend le sens de « profit, bénéfice, avantage » dans un français courant et digne.
- source_word: ܕܒܝܫ (d-bīš)
  choice: de pire
  rationale: Conserve la comparaison rhétorique du syriaque sans préciser à tort la nature du mal évoqué.
- source_word: ܨ̈ܒܝܢ (ṣābeyn)
  choice: nous désirions
  rationale: Préserve l’idée de volonté ou de désir, ainsi que la valeur rhétorique et potentielle du contexte.
- source_word: ܡܣܟܢܝܢ (msakkeyn)
  choice: attendre
  rationale: Le verbe peut exprimer l’attente ou l’espérance; « attendre » maintient ici la succession des verbes avec « voir » sans transformer l’attente en certitude.
- source_word: ܕܢܚܙܘܢ (d-neḥzūn)
  choice: de voir
  rationale: Reproduit directement le verbe de perception et laisse son complément implicite, comme dans le texte syriaque.
theological_decisions:
- issue: Objet implicite de « voir »
  choice: Laisser l’objet non exprimé
  alternative: Ajouter « ce qui arrivera » ou « la suite »
  rationale: Le syriaque ne précise pas l’objet; l’ajouter résoudrait indûment une tension du propos.
translation_notes:
  register: Français international moderne, sobre et rhétorique. La formulation conserve l’enchaînement volontairement difficile « désirer — attendre — voir » et l’objet implicite du dernier verbe.
