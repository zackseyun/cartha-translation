  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: fr
  text: Ou qui peut connaître ton jugement, sonder la profondeur de ta voie, mesurer le poids de ton sentier, ou comprendre ton dessein, qui reste insaisissable ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon le découpage adopté, la dernière proposition peut être rattachée au verset 9.
    reason: La limite du verset est incertaine dans la transmission et l’édition de ce passage.
lexical_decisions:
- source_word: ܕܝܢܟ (sens restitué par le contexte et la tradition textuelle)
  choice: ton jugement
  rationale: Conserve le sens judiciaire sans préciser s’il s’agit d’une sentence particulière ou de la manière divine de juger.
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ
  choice: la profondeur de ta voie
  rationale: Rend directement l’image spatiale du syriaque tout en restant idiomatique en français.
- source_word: ܬܘܩܠܐ ܕܫܒܝܠܟ
  choice: le poids de ton sentier
  rationale: Préserve la métaphore concrète et énigmatique du poids plutôt que de l’aplanir en « importance ».
- source_word: ܬܪܥܝܬܟ ܕܠܐ ܡܬܕܪܟܐ
  choice: ton dessein, qui reste insaisissable
  rationale: « Dessein » exprime ici la pensée ou le conseil délibéré de Dieu; « insaisissable » maintient l’idée d’impossibilité à l’appréhender.
theological_decisions:
- issue: Incompréhensibilité du dessein divin
  choice: comprendre ton dessein, qui reste insaisissable
  alternative: pénétrer ton conseil incompréhensible
  rationale: 'La formulation conserve la tension du texte: l’être humain tente de comprendre ce qui, par nature, échappe à sa prise, sans transformer cette affirmation en doctrine systématique.'
- issue: Portée de « jugement »
  choice: ton jugement
  alternative: ta manière de juger
  rationale: Le substantif plus formel préserve l’ambiguïté entre décision judiciaire et exercice général du jugement divin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme interrogatif et les métaphores de profondeur et de poids sont conservés; « connaître » est préféré à « apprendre » pour une formulation française naturelle dans ce contexte.
