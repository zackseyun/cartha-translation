base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: fr
  text: 'Car, de même qu’un souffle[a] s’élève sans intention et disparaît, ainsi en est-il de la condition des êtres humains : ils ne suivent pas leur propre volonté et ne savent pas ce qui leur arrivera à la fin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une vapeur » ; le mot désigne quelque chose de fugitif et d’évanescent.'
    reason: Le terme syriaque admet plusieurs images proches, et le contexte insiste sur ce qui surgit puis disparaît.
lexical_decisions:
- source_word: ܗܒܠܐ (heblā)
  choice: un souffle
  rationale: Le terme peut évoquer le souffle, la vapeur ou ce qui est évanescent. « Souffle » préserve l’image de quelque chose qui s’élève puis disparaît.
- source_word: ܡܘܠܕܐ (mawldā), lecture contextuelle
  choice: la condition
  rationale: Dans cette comparaison, « condition » exprime naturellement la manière d’être des humains sans imposer le sens biologique plus étroit de « naissance » ni une notion philosophique trop technique de « nature ».
- source_word: ܠܒܐ (lebbā), dans l’expression idiomatique « sans cœur »
  choice: sans intention
  rationale: Le « cœur » désigne ici le siège de la volonté ou du dessein ; la traduction idiomatique française rend l’absence d’intention plutôt qu’un manque d’émotion.
theological_decisions:
- issue: Rapport entre la volonté humaine et les événements
  choice: « ils ne suivent pas leur propre volonté »
  alternative: « ils ne vont pas de leur propre volonté »
  rationale: La formulation retenue conserve l’affirmation limitée du texte sur l’absence de maîtrise humaine, sans la transformer en doctrine exhaustive sur le libre arbitre ou la prédestination.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme de la comparaison tout en évitant un calque peu naturel de l’idiome syriaque.
