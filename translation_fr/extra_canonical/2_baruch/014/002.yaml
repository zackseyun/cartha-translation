  text: And now I know that many have sinned and lived, and only a few will remain in those times to whom these words may be spoken.
translation:
  language: fr
  text: Et maintenant, je sais que beaucoup ont péché et ont vécu, et que, en ces temps-là, il n’en restera qu’un petit nombre à qui ces paroles pourront être dites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܗܫܐ ܝܕܥܬ
  choice: Et maintenant, je sais
  rationale: Rend directement la lecture syriaque établie par le contrôle textuel, plutôt que l’ancienne compréhension « j’ai dit dans mes pensées ».
- source_word: ܣܓܝܐܝܢ … ܕܚܛܘ ܘܚܝܘ
  choice: beaucoup ont péché et ont vécu
  rationale: Formulation française naturelle qui conserve les deux verbes coordonnés sans préciser de quelle manière ils ont vécu.
- source_word: ܩܠܝܠܝܢ … ܢܫܬܚܪܘܢ
  choice: il n’en restera que peu
  rationale: Exprime clairement le contraste quantitatif entre le grand nombre ayant péché et le petit nombre qui subsistera.
- source_word: ܒܗܘܢ ܙܒ̈ܢܐ
  choice: en ces temps-là
  rationale: Équivalent idiomatique de l’expression temporelle syriaque.
- source_word: ܢܬܐܡܪ̈ܢ ܡ̈ܠܐ ܗܠܝܢ
  choice: ces paroles pourront être dites
  rationale: Conserve la tournure passive et la modalité potentielle du texte.
theological_decisions:
- issue: Nature de la vie menée par ceux qui ont péché
  choice: ont péché et ont vécu
  alternative: ont péché et ont vécu dans la prospérité
  rationale: Le verset fourni et la couche anglaise contrôlée n’autorisent pas à ajouter une qualification morale ou matérielle à « vécu ».
- issue: Destinataires des paroles futures
  choice: à qui ces paroles pourront être dites
  alternative: qui entendront ces paroles
  rationale: La formulation retenue préserve le passif et la possibilité exprimée, sans transformer l’énoncé en prédiction certaine d’une audition.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement de la phrase syriaque tout en évitant une tournure artificielle; le référent de « peu » demeure volontairement implicite comme dans le contexte transmis.
