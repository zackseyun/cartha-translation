translation:
  language: fr
  text: Mais quel sera son juste jugement ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ / ܕܝܢ
  choice: jugement
  rationale: Le contexte transmis et la couche de contrôle anglaise indiquent une question portant sur le jugement; « jugement » conserve à la fois l’idée de verdict et celle d’acte judiciaire.
- source_word: ܙܕܝܩܐ / ܒܙܕܝܩܘܬܐ
  choice: juste
  rationale: « Juste » rend naturellement en français la qualité morale du jugement sans ajouter une interprétation confessionnelle.
theological_decisions:
- issue: Référent du possessif dans « son juste jugement »
  choice: Conserver le possessif sans expliciter son référent
  alternative: « le juste jugement qui lui sera réservé »
  rationale: La formulation concise préserve l’ambiguïté de rattachement présente dans la tradition consultée au lieu de préciser silencieusement si le jugement appartient au juge ou concerne la personne jugée.
translation_notes:
  register: Question brève, solennelle et idiomatique en français moderne international. Le matériau syriaque fourni est un extrait de chapitre fortement altéré et ne permet pas d’isoler avec assurance tous les mots du verset; la formulation reste donc proche de la couche anglaise auditée tout en évitant toute explicitation non garantie.
