  text: Do you think the Most High rejoices in these things, or that his name is glorified by them?
translation:
  language: fr
  text: Pensez-vous que le Très-Haut se réjouisse de ces choses, ou que son nom en soit glorifié ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܝܐ / « le Très-Haut » (lecture contrôlée par le contexte et la couche auditée)
  choice: le Très-Haut
  rationale: Titre divin traditionnel, précis et immédiatement compréhensible en français moderne.
- source_word: ܚܕܐ
  choice: se réjouisse
  rationale: Rend naturellement l’idée de prendre plaisir ou de se réjouir, sans accentuer indûment l’un ou l’autre sens.
- source_word: ܫܡܗ
  choice: son nom
  rationale: Conserve l’expression sémitique où le « nom » représente la réputation et l’honneur de Dieu, plutôt que de la paraphraser.
- source_word: ܡܫܬܒܚ
  choice: soit glorifié
  rationale: Le passif français correspond au sens d’être loué ou glorifié et convient au contexte théologique.
theological_decisions:
- issue: La joie attribuée au Très-Haut devant des actes mauvais
  choice: Conserver la question rhétorique sans l’expliquer
  alternative: 'Paraphraser : « le Très-Haut ne saurait approuver ces choses »'
  rationale: La formulation interrogative maintient la force polémique du texte et n’élimine pas sa tension théologique.
- issue: Portée de « son nom »
  choice: Garder l’expression littérale « son nom »
  alternative: Rendre par « sa gloire » ou « son honneur »
  rationale: L’expression biblique est intelligible en français et préserve le langage propre du texte au lieu d’en imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et direct. L’ajout de « donc » restitue la valeur conclusive de la particule syriaque et relie la question au contexte précédent.
