  text: Yet after these things they will be seized by tribulation in the dispersion among the nations, and they will dwell in shame in every place.
translation:
  language: fr
  text: Mais après cela, ils seront saisis par la détresse dans la dispersion parmi les nations, et ils vivront dans la honte en tout lieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܐܚܕܘܢ (lecture syriaque attestée par la révision critique)
  choice: ils seront saisis
  rationale: Rend le passif du verbe « saisir, prendre » sans reprendre l’ancienne lecture erronée « ils comprendront ».
- source_word: ܐܘܠܨܢܐ / notion de tribulation
  choice: la détresse
  rationale: Terme français courant et digne qui exprime une affliction éprouvante sans surcharger le texte d’une nuance confessionnelle.
- source_word: dispersion parmi les nations
  choice: au milieu de leur dispersion parmi les nations
  rationale: Conserve à la fois l’état de dispersion et le cadre constitué par les nations.
- source_word: ܒܚܣܝܪܘ / notion de honte ou d’abaissement
  choice: dans la honte
  rationale: Suit le sens contextuel retenu par la révision critique et maintient le parallélisme avec la détresse.
- source_word: ܒܟܠ ܐܬܪ
  choice: partout
  rationale: Équivalent français naturel de « en tout lieu ».
theological_decisions:
- issue: Nature de l’épreuve subie dans la dispersion
  choice: 'Formulation générale : « la détresse »'
  alternative: « la persécution » ou une interprétation eschatologique explicite
  rationale: Le texte décrit l’affliction sans en préciser ici l’agent ni imposer une identification théologique particulière.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche du mouvement du syriaque tout en étant immédiatement compréhensible.
