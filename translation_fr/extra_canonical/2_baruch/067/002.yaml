  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: fr
  text: 'Ou bien pensez-vous que même les anges, devant le Puissant, n’éprouvent aucun chagrin parce que Sion a été livrée de cette manière et parce que, voici que, les nations se glorifient dans leur cœur, se rassemblent devant leurs idoles[a] et disent : « Celle qui a longtemps foulé les autres aux pieds est foulée aux pieds ; celle qui soumettait les autres est elle-même soumise » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les foules devant leurs idoles disent », si le terme syriaque est compris comme un nom plutôt que comme la forme verbale « se rassemblent ».'
    reason: Le syriaque non vocalisé permet cette analyse nominale, bien que la lecture verbale s’accorde mieux avec la suite des participes et avec l’audit anglais.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: le Puissant
  rationale: Titre divin syriaque rendu de façon formelle et digne, sans substituer un autre nom divin.
- source_word: ܡܠܐܟ̈ܐ (malʾākē)
  choice: les anges
  rationale: Sens ordinaire du pluriel dans ce contexte céleste devant le Puissant.
- source_word: ܡܫܬܒܗܪܝܢ (meštabhrīn)
  choice: se glorifient
  rationale: Le participe exprime l’orgueil ou la vantardise des nations ; « se glorifient » conserve le registre élevé et la nuance négative du contexte.
- source_word: ܡܩ̈ܢܫܐ / lecture contextualisée comme ܟܢܫܝܢ (kānšīn)
  choice: se rassemblent
  rationale: 'La lecture verbale active poursuit la chaîne des participes : les nations se glorifient, se rassemblent et parlent. La lecture nominale reste signalée en note.'
- source_word: ܨܗܝܘܢ / référent féminin implicite
  choice: Celle qui…
  rationale: Le féminin de la citation renvoie à Sion et permet de conserver la personnification sans répéter son nom.
theological_decisions:
- issue: Le chagrin des anges devant Dieu
  choice: « même les anges, devant le Puissant, n’éprouvent aucun chagrin » sous forme de question rhétorique
  alternative: Affirmer directement que les anges éprouvent du chagrin
  rationale: La formulation interrogative préserve la tension du texte sans transformer son implication en déclaration dogmatique explicite.
- issue: Titre divin
  choice: « le Puissant »
  alternative: « le Tout-Puissant »
  rationale: « Le Puissant » correspond plus directement au titre syriaque et évite d’ajouter la nuance d’omnipotence absolue portée par « Tout-Puissant ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue question rhétorique et le parallélisme final sont conservés. Le marqueur [a] figure immédiatement après le segment concerné.
