  text: And the eleventh black waters that you saw—this is the calamity that has now come upon Zion.[a]
translation:
  language: fr
  text: 'Et les onzièmes eaux noires que tu as vues : c’est le malheur qui s’est maintenant abattu sur Sion.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: eaux noires
  rationale: Conserve l’image structurante de la vision et la distinction récurrente entre les eaux noires et les eaux lumineuses, sans l’atténuer en une formulation abstraite.
- source_word: ܫܘܚܬܐ
  choice: le malheur
  rationale: Rend le nom singulier par un terme français naturel qui exprime la catastrophe frappant Sion, tout en respectant l’accord singulier de la proposition syriaque.
- source_word: ܗܕܐ ܗܝ
  choice: c’est
  rationale: Le démonstratif et la copule sont au singulier et renvoient au singulier « le malheur » ; « c’est » reproduit clairement cette identification.
theological_decisions:
- issue: Sens de la chute de Sion
  choice: Le verset identifie les eaux noires au malheur qui frappe Sion, sans préciser ici si ce malheur constitue à lui seul l’accomplissement définitif du jugement divin.
  alternative: Présenter explicitement la chute de Sion comme le jugement final et pleinement approuvé par Dieu.
  rationale: Le verset établit l’identité symbolique entre les eaux et le malheur, mais ne résout pas à lui seul la tension théologique développée dans le contexte. La traduction n’ajoute donc aucune interprétation confessionnelle.
translation_notes:
  register: 'Français international moderne, sobre et digne. L’ordre « les onzièmes eaux noires » reste naturel en français tout en conservant le vocabulaire visionnaire. Le deux-points marque l’explication du symbole. Aucune note n’est nécessaire : la leçon singulière est grammaticalement claire, et la variante anglaise antérieure au pluriel ne représente pas une ambiguïté authentique du syriaque.'
