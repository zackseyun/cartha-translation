review_pass:
  verdict: revise
  source_fidelity: 'Le début (« et dans ma prière »), l’apprentissage « d’eux » des commandements de la lettre, ainsi que les finales « vous serez aimés », « [vous serez] consolés » et « de peur que vous ne tombiez et ne soyez tourmentés » rendent fidèlement le syriaque. La séquence centrale demeure textuellement très difficile : ܬܬܟܦܘܢ soutient « vous serez soumis/courbés », ܒܡܝܬܪܘܬܐ « dans l’excellence », et les termes « nations/peuples » et « promesse » suivent sans relation syntaxique certaine.'
  naturalness: Le français est globalement naturel et garde à bon droit l’ouverture fragmentaire, qui dépend de la phrase précédente. Toutefois, « les nations, en vue de la promesse » entre deux tirets paraît présenter comme établie une relation syntaxique que le syriaque transmis ne permet pas de fixer. Une formulation explicitement suspendue rend mieux à la fois l’obscurité du témoin et le français.
  terminology: « Prière », « commandements », « excellence », « promesse », « aimés », « consolés » et « tourmentés » conviennent au registre moderne et soutenu. « Soumis » est défendable pour le verbe transmis et ne doit pas être remplacé par « affermis » ou par une idée de domination sans signaler une conjecture.
  issues:
  - severity: medium
    issue: La proposition obscure est ponctuée comme si « les nations » et « en vue de la promesse » formaient une construction française déterminée.
    rationale: Le syriaque juxtapose les éléments correspondant à « dans l’excellence », « nations/peuples » et « pour la promesse », sans indiquer de façon sûre si « nations » est objet, vocatif ou élément d’un texte altéré. La traduction doit conserver cette indétermination plutôt que d’imposer « en vue de ».
  revised_text: et dans ma prière. Vous aussi, vous avez appris d’eux les commandements de cette lettre. Vous serez soumis dans l’excellence — les nations, pour la promesse[a] —, vous serez aimés et consolés, de peur que vous ne tombiez et ne soyez tourmentés.
  revised_footnotes:
  - marker: a
    text: 'Le texte syriaque de cette proposition est obscur et peut être altéré. Littéralement, il juxtapose les idées d’« être soumis », d’« excellence », de « nations » et de « promesse », sans en établir sûrement les rapports syntaxiques. On a aussi proposé, par conjecture : « vous serez affermis dans l’excellence en vue de la promesse ».'
    reason: La note explicite que la juxtaposition conservée dans le texte français ne résout pas la syntaxe du syriaque et signale la conjecture sans l’adopter.
  revision_rationale: La révision retire « en vue de », qui interprétait la préposition et stabilisait indûment une construction corrompue ou incertaine. Elle conserve tous les éléments du texte transmis, maintient la note au même ancrage et ne recourt pas à la reconstruction « affermis » ni à l’idée non attestée de gouverner les nations.
