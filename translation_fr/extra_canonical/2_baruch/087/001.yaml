  yaml_path: translation/extra_canonical/2_baruch/087/001.yaml
  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: fr
  text: et dans ma prière. Vous aussi, vous avez appris d’eux les commandements de cette lettre. Vous serez soumis dans l’excellence — les nations, en vue de la promesse[a] —, vous serez aimés et consolés, de peur que vous ne tombiez et ne soyez tourmentés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte syriaque de cette proposition est obscur et peut être altéré. Littéralement, il aligne les idées d’« être soumis », d’« excellence », de « nations » et de « promesse ». On a aussi proposé, par conjecture : « vous serez affermis dans l’excellence en vue de la promesse ».'
    reason: La syntaxe transmise ne permet pas d’établir avec assurance le rapport entre ces mots; la note signale l’incertitude sans remplacer silencieusement le texte source.
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: dans ma prière
  rationale: Le nom peut désigner une prière, une demande ou une supplication. « Prière » convient naturellement au contexte sans développer la phrase en une doctrine explicite de l’intercession.
- source_word: ܝܠܦܬܘܢ
  choice: vous avez appris
  rationale: La forme verbale exprime ici l’apprentissage ou l’instruction reçue. Le passé composé rend naturellement en français la valeur accomplie retenue par le contexte.
- source_word: ܡܢܗܘܢ
  choice: d’eux
  rationale: Le pronom masculin pluriel a un antécédent peu clair dans cet extrait chevauchant. « D’eux » conserve cette indétermination au lieu de lui substituer « ces choses ».
- source_word: ܦܘ̈ܩܕܢܐ
  choice: les commandements
  rationale: Le terme désigne des ordres ou préceptes faisant autorité. « Commandements » maintient le registre exhortatif et religieux de la lettre.
- source_word: ܬܬܟܦܘܢ
  choice: vous serez soumis
  rationale: Le verbe est lié à l’idée de courber ou de soumettre. Cette traduction suit le texte syriaque transmis plutôt que de l’émender conjecturalement en « vous serez affermis ».
- source_word: ܡܝܬܪܘܬܐ
  choice: excellence
  rationale: Le nom peut exprimer l’excellence, la vertu ou la supériorité. « Excellence » reste proche du lexème et évite de préciser abusivement la relation syntaxique, ici obscure.
- source_word: ܡܘܠܟܢܐ
  choice: promesse
  rationale: Le mot signifie « promesse ». Il ne doit pas être confondu avec une forme issue de la racine signifiant « régner ».
theological_decisions:
- issue: Portée de la mention de la prière de Baruch
  choice: La phrase dit simplement que les destinataires sont présents dans sa prière.
  alternative: Développer la mention comme une intercession formelle de Baruch.
  rationale: Le syriaque mentionne explicitement la prière, mais ne fournit pas assez d’éléments pour construire une doctrine plus précise de l’intercession.
- issue: Sens de la proposition obscure sur l’excellence, les nations et la promesse
  choice: Conserver, dans le texte et dans une note, les éléments du syriaque transmis sans imposer une reconstruction théologique.
  alternative: Émender le texte pour obtenir « vous serez affermis dans l’excellence pour la promesse » ou « vous serez fortifiés afin de gouverner les nations ».
  rationale: La syntaxe du texte fourni est difficile et probablement altérée. Une reconstruction silencieuse risquerait d’introduire une idée de domination ou d’accomplissement de la promesse que le texte conservé n’établit pas clairement.
translation_notes:
  register: Français moderne, digne et lisible. La structure demeure volontairement heurtée dans la proposition textuellement obscure; les tirets la délimitent sans prétendre en résoudre la syntaxe. Le marqueur [a] figure dans le texte principal.
