  yaml_path: translation/extra_canonical/2_baruch/074/001.yaml
  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: fr
  text: 1 En ces jours-là, les moissonneurs ne se fatigueront pas et les bâtisseurs ne peineront pas ; car les travaux avanceront d’eux-mêmes avec ceux qui les accomplissent, dans une grande tranquillité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: messores / terme syriaque probable désignant les moissonneurs à la limite de ce chapitre
  choice: les moissonneurs
  rationale: Ce choix conserve l’image agricole concrète de la récolte et s’accorde avec le tableau d’abondance eschatologique.
- source_word: aedificantes / terme syriaque probable désignant ceux qui bâtissent
  choice: les bâtisseurs
  rationale: Le substantif direct maintient le parallélisme avec « les moissonneurs » et évite d’élargir le sens aux travailleurs en général.
- source_word: non fatigabuntur ... neque laborabunt
  choice: ne se fatigueront pas ... ne peineront pas
  rationale: Deux verbes distincts préservent l’équilibre rythmique et la nuance entre fatigue physique et labeur pénible.
- source_word: sponte erunt currentia opera
  choice: les travaux avanceront d’eux-mêmes
  rationale: La formulation garde l’image saisissante d’un accomplissement sans effort pénible, sans lui donner une coloration mécanique moderne.
- source_word: tranquillitate multa
  choice: dans une grande tranquillité
  rationale: Cette expression rend le calme profond du tableau de restauration et ne réduit pas la scène à la seule efficacité du travail.
theological_decisions:
- issue: Degré d’insistance sur le caractère spontané du travail dans l’âge messianique
  choice: les travaux avanceront d’eux-mêmes
  alternative: les travaux seront faciles / les travaux prospéreront
  rationale: 'Le témoin de contrôle évoque davantage qu’une simple réussite : il présente une fécondité extraordinaire et paisible. La traduction conserve cette image apocalyptique sans la transformer en automatisation.'
- issue: Portée de l’expression finale décrivant l’atmosphère
  choice: dans une grande tranquillité
  alternative: dans une grande paix / dans un profond repos
  rationale: Le passage décrit un ordre restauré autant qu’un travail fructueux. « Tranquillité » maintient cette idée de calme général sans préciser indûment s’il est seulement intérieur, social ou cosmique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme concret entre agriculture et construction est conservé. L’incise « entre les mains de ceux qui les accomplissent » rend naturellement l’association des travaux avec leurs exécutants tout en laissant subsister l’image paradoxale de travaux avançant d’eux-mêmes.
