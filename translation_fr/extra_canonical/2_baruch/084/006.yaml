base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: fr
  text: 'Ainsi, moi aussi, je vous le dis après vos souffrances[a] : si vous écoutez les paroles qui vous ont été adressées, vous recevrez du Puissant ce qui a été préparé et mis en réserve pour vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon attendue et le contexte donnent « après vos souffrances »; le texte syriaque fourni semble toutefois porter « après ce que vous avez vu », peut-être à cause d’une faute de transcription ou d’une variante.
    reason: Signaler honnêtement une divergence dans l’attestation fournie au lieu de la résoudre silencieusement.
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: le Puissant
  rationale: Ce titre divin rend directement le syriaque et conserve son caractère distinctif sans le remplacer par une désignation confessionnelle.
- source_word: ܫܡܥ
  choice: écoutez
  rationale: Le verbe peut impliquer l’écoute obéissante. « Écoutez » préserve cette amplitude et correspond naturellement à des paroles adressées.
- source_word: ܕܩܝܡܐ … ܠܟܘܢ
  choice: ce qui a été préparé et mis en réserve pour vous
  rationale: La formulation exprime un bien déjà disposé et conservé en vue des destinataires; le doublet français garde l’insistance du texte.
theological_decisions:
- issue: Nature de la promesse faite par « le Puissant »
  choice: Ne pas préciser l’objet de « ce qui » est réservé
  alternative: Interpréter explicitement la promesse comme le salut, la récompense ou les biens du monde à venir
  rationale: Le texte demeure indéfini; préciser l’objet réduirait une ambiguïté théologique authentique.
- issue: Portée de « écouter »
  choice: Conserver le langage de l’écoute, qui peut inclure l’obéissance
  alternative: Traduire uniquement par « obéir »
  rationale: Le choix retenu ne dissocie pas réception des paroles et mise en pratique, mais évite de durcir le sens au-delà du lexème.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de l’exhortation, le titre divin « le Puissant » et l’indétermination de la récompense promise.
