review_pass:
  verdict: revise
  source_fidelity: Le texte syriaque fourni porte explicitement « après ce que vous avez vu » (ܡܢ ܒܬܪ ܕܚܙܝܬܘܢ), suivi d’une exhortation négative (« ne vous égarez pas »), puis mentionne « le royaume qui demeure » (ܡܠܟܘܬܐ ܕܩܝܡܐ), mis en réserve. La traduction anglaise et le projet suivent une leçon différente, « après vos souffrances », et omettent « royaume ».
  naturalness: La formulation proposée est naturelle et digne en français international moderne. « Ne vous égarez pas » convient au registre exhortatif; « le royaume qui demeure » conserve l’image sans surinterprétation.
  terminology: « Le Puissant » rend convenablement le titre divin syriaque. « Royaume » doit être maintenu, car il est exprimé dans le syriaque fourni. Aucun ajout doctrinal n’est nécessaire.
  issues:
  - severity: high
    issue: La traduction principale adopte « après vos souffrances » au lieu de « après ce que vous avez vu ».
    rationale: Même si l’anglais POB et une leçon attendue peuvent soutenir « souffrances », le témoin syriaque fourni doit être suivi en premier. Une divergence ne doit pas être corrigée silencieusement dans le texte principal.
  - severity: high
    issue: L’exhortation « ne vous égarez pas » est remplacée par une condition « si vous écoutez ».
    rationale: Le syriaque fourni à cet endroit exprime une défense de s’égarer; la condition d’écoute reflète l’audit anglais, mais non la formulation attestée ici.
  - severity: high
    issue: « le royaume qui demeure » est omis.
    rationale: Le syntagme ܡܠܟܘܬܐ ܕܩܝܡܐ est présent dans le texte source; « ce qui » seul en efface le référent.
  revised_text: 'Moi aussi, je vous le dis après ce que vous avez vu[a] : ne vous égarez pas. Vous recevrez du Puissant le royaume qui demeure et qui est mis en réserve pour vous.'
  revised_footnotes:
  - marker: a
    text: 'Le syriaque fourni lit littéralement « après ce que vous avez vu ». L’audit anglais POB suit une leçon ou une restitution différente : « après vos souffrances »; la divergence est conservée sans la trancher dans le texte français.'
    reason: Signaler la divergence textuelle entre le témoin syriaque fourni et l’audit anglais, tout en donnant priorité au texte source fourni.
  revision_rationale: 'Révision nécessaire pour rendre le témoin syriaque fourni avant l’audit anglais : « après ce que vous avez vu », l’avertissement de ne pas s’égarer, et le « royaume qui demeure » sont rétablis. La note documente sobrement la leçon divergente de l’audit sans imposer une harmonisation incertaine.'
