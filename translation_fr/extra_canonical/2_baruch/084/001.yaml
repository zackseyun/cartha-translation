base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: fr
  text: Voici, tant que je suis encore en vie, je vous ai fait connaître ces choses, car j’ai dit que vous deviez apprendre ce qui est bon. En effet, le Puissant m’a ordonné de vous instruire et, avant de mourir, je vous présenterai quelques-unes des ordonnances de son jugement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: le Puissant
  rationale: Ce titre divin marqué est conservé plutôt que remplacé par le terme générique « Dieu » ; il correspond naturellement au registre élevé de l’ouvrage.
- source_word: ܫܦܝܪ̈ܬܐ
  choice: ce qui est bon
  rationale: Cette formulation simple exprime la valeur morale et convenable du terme sans lui donner une nuance esthétique excessive.
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: ordonnances
  rationale: Dans la proposition finale, le contexte judiciaire appelle un terme qui évoque des prescriptions faisant autorité, sans réduire celles-ci à de simples conseils.
- source_word: ܕܝܢܐ / expression judiciaire
  choice: jugement
  rationale: Le substantif conserve la dimension judiciaire de l’expression et son lien direct avec les ordonnances attribuées au Puissant.
theological_decisions:
- issue: Titre divin
  choice: le Puissant
  alternative: Dieu ; le Seigneur
  rationale: Le maintien de l’épithète respecte la texture propre du syriaque et évite de neutraliser un titre divin distinctif.
- issue: Rapport entre instruction et jugement
  choice: « ordonnances de son jugement » est conservé sans explicitation
  alternative: « règles selon lesquelles il jugera »
  rationale: La construction demeure susceptible de désigner soit des décisions judiciaires, soit des prescriptions liées au jugement ; la traduction ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » rend l’ouverture solennelle ; la ponctuation en deux phrases allège la longue période sans modifier sa progression logique. Le futur « je placerai devant vous » conserve l’image de la présentation publique d’instructions.
