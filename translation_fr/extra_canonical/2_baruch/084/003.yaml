  text: He also kept saying other things to you when you were together in the wilderness as twelve tribes.
translation:
  language: fr
  text: Il vous disait aussi d’autres choses lorsque vous étiez ensemble dans le désert, alors que vous formiez douze tribus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̇ܪ ܗܘܐ
  choice: disait
  rationale: La construction périphrastique exprime ici une action répétée ou habituelle dans le passé ; l’imparfait français la rend naturellement.
- source_word: ܒܡܕܒܪܐ
  choice: dans le désert
  rationale: Équivalent français courant et traditionnel du syriaque désignant la région désertique où séjourna Israël.
- source_word: ܫ̈ܒ̣ܛܝܟܘܢ … ܬܪܥܣܪ
  choice: au nombre de douze tribus
  rationale: Cette formulation conserve l’idée numérique explicite tout en produisant une phrase française fluide.
- source_word: ܐܟܚܕܐ (sens attesté par le contexte textuel)
  choice: réunis
  rationale: Rend l’idée que les douze tribus se trouvaient ensemble, sans suggérer nécessairement une unité spirituelle ou politique plus forte.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Conserver le pronom « Il » sans nommer le personnage
  alternative: Expliciter « Moïse » ou « Jérémie »
  rationale: Le texte transmis dans l’extrait est textuellement difficile autour du nom propre, tandis que le contexte et la couche de consultation emploient un sujet anaphorique. Ne pas expliciter préserve l’ambiguïté sans imposer une identification incertaine.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure sémitique tout en évitant une lourdeur littérale. Aucun marqueur de note n’est requis.
