base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: fr
  text: 'Souvenez-vous que Moïse a autrefois pris le ciel et la terre à témoin contre vous et a dit : « Si vous transgressez la Loi[a], vous serez dispersés ; mais si vous la gardez, vous serez gardés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enfreignez la Loi ».'
    reason: Signale une autre formulation française naturelle du verbe exprimant la violation de la Loi.
lexical_decisions:
- source_word: ܢܡܘܣܐ (nāmōsā)
  choice: la Loi
  rationale: Le terme syriaque désigne ici la Loi donnée à Israël; la majuscule explicite ce référent sans ajouter de précision confessionnelle.
- source_word: ܬܬܒܪܘ (forme transmise dans le passage)
  choice: vous serez dispersés
  rationale: Le contexte traditionnel de l’avertissement mosaïque vise la dispersion du peuple; cette formulation française reste naturelle et suit la lecture attestée par la couche de consultation auditée.
- source_word: champ lexical de la garde/conservation
  choice: si vous la gardez, vous serez gardés
  rationale: La répétition conserve le parallélisme et le jeu verbal de la sentence, plutôt que de le lisser en deux verbes différents.
theological_decisions:
- issue: Nature de l’obéissance à la Loi
  choice: « transgressez » et « gardez »
  alternative: « enfreignez » et « observez »
  rationale: Le choix retenu préserve la solennité ainsi que la tension entre désobéissance et fidélité, sans préciser davantage le mode ou la portée théologique de cette obéissance.
- issue: Fonction du ciel et de la terre
  choice: « pris le ciel et la terre à témoin contre vous »
  alternative: « appelé le ciel et la terre comme témoins contre vous »
  rationale: Cette tournure idiomatique française maintient le cadre judiciaire de l’appel à témoins sans l’interpréter au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de l’avertissement est conservé, notamment par la répétition « gardez / gardés ».
