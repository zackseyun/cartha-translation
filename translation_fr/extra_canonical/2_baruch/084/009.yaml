  text: Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.
translation:
  language: fr
  text: Transmettez à vos enfants qui viendront après vous cette lettre et les traditions de la Loi, comme vos pères vous les ont transmis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ / « lettre » (lecture versifiée sous-jacente)
  choice: cette lettre
  rationale: Le démonstratif renvoie naturellement à l’écrit que Baruch confie à ses destinataires.
- source_word: ܡܫܠܡܢܘܬܐ / « transmission, tradition » (lecture versifiée sous-jacente)
  choice: les traditions
  rationale: « Traditions » conserve l’idée d’un enseignement reçu puis transmis, sans le réduire à de simples règles.
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Dans ce contexte juif, le terme désigne la Loi reçue et transmise; la majuscule signale ce sens précis.
- source_word: ܐܫܠܡ / « remettre, transmettre » (lecture versifiée sous-jacente)
  choice: transmettez / ont transmises
  rationale: La répétition française rend le parallèle entre la transmission des pères et celle demandée à la génération présente.
theological_decisions:
- issue: Rapport entre l’écrit de Baruch et les traditions de la Loi
  choice: Maintenir deux compléments distincts coordonnés
  alternative: Fondre la lettre et les traditions en un unique dépôt sacré
  rationale: Le texte distingue la lettre des traditions de la Loi et ne précise pas qu’elles possèdent exactement le même statut.
translation_notes:
  register: Français moderne, clair et digne. « Après vous » est conservé pour exprimer explicitement la transmission intergénérationnelle. Le pluriel féminin de « transmises » reprend les traditions tout en permettant naturellement de comprendre l’ensemble des choses confiées.
