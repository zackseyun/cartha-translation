  text: And now, Moses used to tell you before it happened to you, and look, it has happened to you, because you abandoned the law.
translation:
  language: fr
  text: Et maintenant, Moïse vous l’annonçait avant que cela ne vous arrive ; et voici, cela vous est arrivé parce que vous avez abandonné la Loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܫܐ (mūšē)
  choice: Moïse
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: ܡܢ ܩܕܝܡ (men qadīm)
  choice: avant que cela ne vous arrive
  rationale: L’expression marque l’antériorité de l’avertissement de Moïse par rapport à l’événement subi par les destinataires.
- source_word: ܢܡܘܣܐ (nāmūsā)
  choice: la Loi
  rationale: Dans ce contexte mosaïque, le terme désigne la Loi donnée à Israël plutôt qu’une loi indéterminée ; la majuscule française rend cette référence sans ajouter de précision confessionnelle.
theological_decisions:
- issue: Lien entre le malheur survenu et l’abandon de la Loi
  choice: parce que vous avez abandonné la Loi
  alternative: 'et cela vous est arrivé : reconnaissez-le selon la Loi'
  rationale: Le texte syriaque fourni est matériellement difficile et semble altéré dans cette ligne, mais la couche anglaise auditée atteste une lecture causale liée à l’abandon de la Loi. La formulation française conserve ce rapport sans développer davantage sa portée théologique.
translation_notes:
  register: Français moderne, clair et digne. L’imparfait « vous l’annonçait » rend l’avertissement répété ou continu de Moïse ; « et voici » conserve la force déictique du passage. Le point-virgule distingue l’avertissement antérieur de son accomplissement tout en maintenant leur lien étroit.
