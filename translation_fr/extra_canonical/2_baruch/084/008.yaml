  text: Remember the law and Zion, and the holy land, and your brothers, and the covenant of your fathers; and do not forget the festivals and the sabbaths.
translation:
  language: fr
  text: Souvenez-vous de la Loi, de Sion, de la terre sainte, de vos frères et de l’alliance de vos pères ; n’oubliez pas les fêtes et les sabbats.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Le terme syriaque désigne ici la Loi comme réalité religieuse déterminée ; la majuscule française clarifie cet emploi sans ajouter d’interprétation confessionnelle.
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ (lecture contextuelle)
  choice: la terre sainte
  rationale: Rend naturellement l’expression traditionnelle tout en conservant sa portée géographique et religieuse.
- source_word: ܐܚ̈ܐ / expression correspondante dans la tradition textuelle du verset
  choice: vos frères
  rationale: Conserve l’ambiguïté entre parents, compatriotes et membres de la communauté, sans la résoudre par « compatriotes ».
- source_word: ܥܕ̈ܐ
  choice: les fêtes
  rationale: Désigne les temps de célébration fixés ; « fêtes » est clair et idiomatique en français moderne.
- source_word: ܫܒ̈ܐ
  choice: les sabbats
  rationale: Translittération française usuelle qui préserve la référence précise aux jours de sabbat.
theological_decisions:
- issue: Portée de « vos frères »
  choice: Conserver « vos frères »
  alternative: « vos compatriotes » ou « votre peuple »
  rationale: Le texte peut viser à la fois les liens de parenté, d’appartenance nationale et de solidarité communautaire ; une formulation plus explicite réduirait cette tension.
- issue: Nature de l’alliance
  choice: « l’alliance de vos pères »
  alternative: « l’alliance conclue avec vos ancêtres »
  rationale: La formulation concise respecte le rapport génitif du texte et ne précise pas qui en est grammaticalement le possesseur ou le partenaire au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, sobre et solennel. L’impératif pluriel « Souvenez-vous » suivi de « n’oubliez pas » reproduit la structure exhortative. « Pères » est maintenu plutôt que « ancêtres » afin de préserver la tonalité scripturaire et le lien intergénérationnel du passage.
