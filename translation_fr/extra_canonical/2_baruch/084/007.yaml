  yaml_path: translation/extra_canonical/2_baruch/084/007.yaml
  text: Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.
translation:
  language: fr
  text: Que cette lettre serve aussi de témoin entre vous et moi, afin que vous vous souveniez des commandements du Puissant et qu’elle me serve de justification devant celui qui m’a envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ (reconstitué d’après le contexte textuel de 2 Baruch 84:7)
  choice: cette lettre
  rationale: Le référent est l’écrit adressé aux destinataires; « lettre » est naturel et précis en français.
- source_word: ܣܗܕܐ / notion de témoignage (reconstituée d’après la tradition du verset)
  choice: serve de témoin
  rationale: Cette formulation conserve la personnification juridique de la lettre et sa fonction attestataire.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܚܝܠܬܐ
  choice: les commandements du Puissant
  rationale: « Le Puissant » rend le titre divin syriaque sans le remplacer par un titre confessionnel plus interprétatif.
- source_word: notion de justification/défense (texte du verset non nettement isolable dans l’extrait fourni)
  choice: me serve de justification
  rationale: Le terme français garde la nuance judiciaire d’une pièce établissant le bien-fondé de la conduite du locuteur.
- source_word: celui qui m’a envoyé
  choice: celui qui m’a envoyé
  rationale: La périphrase préserve le référent implicite et évite de préciser son identité au-delà du texte.
theological_decisions:
- issue: Identité de « celui qui m’a envoyé »
  choice: Conserver la périphrase sans explicitation
  alternative: « devant Dieu, qui m’a envoyé »
  rationale: Le texte laisse le référent implicite; l’expliciter réduirait inutilement cette réserve.
- issue: Portée de la « justification »
  choice: Employer un vocabulaire judiciaire non technique
  alternative: « acquittement » ou « défense »
  rationale: « Justification » exprime que la lettre atteste la fidélité du locuteur sans imposer une doctrine particulière du salut.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le parallélisme final et le registre juridique du témoignage. Aucun marqueur de note n’est requis.
