  text: For if he should judge us not according to the abundance of his mercies, woe to all of us who have been born.
translation:
  language: fr
  text: Car s’il ne nous jugeait pas selon l’abondance de ses compassions, malheur à nous tous qui sommes nés !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܐܝܟ (lā ʾak)
  choice: ne… pas selon
  rationale: Cette expression indique ici la norme ou la mesure du jugement. « Pas selon » rend mieux le syriaque que « indépendamment de ».
- source_word: ܣܘܓܐܐ ܕܪ̈ܚܡܘܗܝ (sens contextuel)
  choice: l’abondance de ses compassions
  rationale: « Abondance » conserve l’idée de multitude, tandis que « compassions » exprime au pluriel la miséricorde active évoquée par le terme sémitique.
- source_word: ܘܝ ܠܟܠܢ ܝܠܝ̈ܕܐ (sens contextuel)
  choice: malheur à nous tous qui sommes nés
  rationale: La formulation française garde l’universalité et la force de la lamentation syriaque sans la réduire à une catégorie particulière de personnes.
theological_decisions:
- issue: Rapport entre le jugement divin et la compassion
  choice: 'Conserver la formulation conditionnelle : le jugement qui ne serait pas mesuré selon l’abondance des compassions divines entraînerait le malheur universel.'
  alternative: Reformuler en affirmant directement que Dieu juge avec miséricorde.
  rationale: Le texte exprime une tension rhétorique entre jugement et compassion ; une affirmation doctrinale plus explicite résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, solennel mais courant. « Compassions » est retenu plutôt que le singulier « miséricorde » afin de préserver la coloration sémitique et l’idée d’une abondance d’actes compatissants.
