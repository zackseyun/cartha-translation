base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: fr
  text: En tout temps, continuez à demander avec ferveur et à prier avec assiduité, de tout votre cœur, afin que le Puissant se réconcilie avec vous[a], qu’il ne tienne pas compte de la multitude de vos péchés, mais qu’il se souvienne de la droiture de vos pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se montre favorable envers vous » ; peut-être aussi : « ait pitié de vous ».'
    reason: Le verbe peut évoquer une réconciliation, un retour favorable ou la miséricorde ; la note conserve cette ambiguïté.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Titre divin caractéristique de 2 Baruch, rendu de façon naturelle tout en conservant sa valeur de titre.
- source_word: ܢܦܢܝܟܘܢ
  choice: se réconcilie avec vous
  rationale: Le contexte exprime un retour favorable de Dieu envers les destinataires; cette formulation préserve la dimension relationnelle plutôt que de la réduire à la seule compassion.
- source_word: ܫܦܝܪ̈ܬܐ
  choice: la droiture
  rationale: Le terme désigne ici les qualités ou bonnes actions des pères; «droiture» convient au contraste avec la multitude des péchés sans surdéterminer le mérite.
theological_decisions:
- issue: Nature du retour favorable du Puissant
  choice: se réconcilie avec vous
  alternative: ait pitié de vous / se montre favorable envers vous
  rationale: La formulation retenue conserve l’idée de restauration de la relation, tandis que la note signale une autre lecture sémantiquement possible.
- issue: Prise en compte de la droiture des pères
  choice: qu’il se souvienne de la droiture de vos pères
  alternative: qu’il se souvienne des bonnes actions de vos pères
  rationale: Le texte évoque cette droiture sans expliquer le mécanisme de son efficacité; la traduction garde donc intacte cette tension théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les deux impératifs sont rendus distinctement; «de tout votre cœur» conserve l’intensité de l’expression source. Le titre «le Puissant» et la référence aux pères sont maintenus sans explicitation confessionnelle.
