  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: fr
  text: 'Il arriva que, tandis que je priais et prononçais les premières paroles de cette prière, je fus bouleversé et me mis à trembler. Je réfléchissais à la descendance de l’humanité : combien sont nombreux ceux qui s’en sont allés, et combien peu nombreux ceux qui sont gardés. Pendant que je pensais à ces choses, j’entendis une voix me dire :


    « Fils d’homme, pourquoi es-tu troublé, et pourquoi as-tu peur ? Avant même que tu sois formé, je te connaissais déjà ; avant que tu sortes du ventre de ta mère, je te connaissais déjà. Voilà pourquoi les choses qui doivent arriver t’ont été montrées. »


    Je lui répondis : « Seigneur, tu m’as montré la vaste étendue des temps et ce qui s’y est produit, mais tu ne m’as pas montré combien de temps cela durera.[c] Je demande donc à entendre quelle récompense est gardée pour ceux qui ont rendu témoignage en faveur de la justice. » Une multitude de bonnes et de mauvaises choses à venir me furent promises, puis je montai sur la montagne.


    Au bout de sept jours, j’arrivai à l’endroit où se trouvait une source. Tandis que j’étais assis là, je fus emporté sur le char d’une nuée[b] — non pas corporellement, et je ne le savais pas. Un mystère me fut montré, et j’entendis une voix me dire : « Regarde et comprends comment, dans ce monde, sont conservés les actes et les labeurs de ceux qui ont bien agi comme de ceux qui ont mal agi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Autre ponctuation possible : « Tandis que j’étais assis là sur le char d’une nuée, je fus emporté. »'
    reason: La syntaxe syriaque permet de rattacher « sur le char d’une nuée » soit à la position assise, soit au transport.
  - marker: c
    text: 'Littéralement : « depuis lequel jusqu’auquel » ou « de quel moment à quel moment ».'
    reason: La tournure syriaque exprime les limites d’une période et équivaut idiomatiquement à une question sur sa durée.
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: la descendance de l’humanité
  rationale: Le syriaque emploie littéralement « semence », mais l’expression désigne collectivement la postérité humaine ; « descendance » conserve ce sens sans produire une tournure artificielle en français.
- source_word: ܡܬܕܘܕ
  choice: troublé
  rationale: Exprime l’agitation intérieure et s’accorde naturellement avec le verbe de crainte qui suit.
- source_word: ܡܬܪܗܒ
  choice: as-tu peur
  rationale: Rend le sens courant du verbe syriaque sans amplifier la peur en terreur.
- source_word: ܬܬܒܪܐ
  choice: sois formé
  rationale: Le verbe évoque la formation de la personne ; ce choix respecte le contexte prénatal sans ajouter d’affirmation métaphysique.
- source_word: ܝܕܝܥ ܗܘܝܬ ܠܝ / ܐܬܝܕܥܬ ܠܝ
  choice: tu m’étais connu
  rationale: Les deux expressions appartiennent à la racine « connaître ». La répétition est conservée, plutôt que de transformer la seconde occurrence en « tu m’étais promis », lecture que le syriaque fourni ne soutient pas directement.
- source_word: ܐܬܚܘܝܬ ܠܟ
  choice: je t’ai montré
  rationale: Dans le contexte de révélation, la construction indique que le locuteur divin a fait voir au voyant les événements futurs ; une autre analyse de la forme est signalée en note.
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: combien de temps cela durera
  rationale: L’expression signifie littéralement « depuis lequel jusqu’auquel » et porte ici sur l’étendue temporelle ; la note conserve la formulation littérale.
- source_word: ܬܘܪܨܐ
  choice: justice
  rationale: Le passage transmis est textuellement difficile. Dans la demande relative à ceux qui ont témoigné, « justice » rend le cadre moral retenu par la tradition de traduction sans introduire une doctrine particulière.
- source_word: ܐܫܬܘܕܝܘ
  choice: me furent promises
  rationale: L’ethpaal de la racine correspond ici à l’idée de choses annoncées ou promises au voyant, plutôt qu’à la simple connaissance.
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: le char d’une nuée
  rationale: Préserve l’image apocalyptique concrète du texte syriaque.
- source_word: ܐܬܢܣܒܬ
  choice: je fus emporté
  rationale: Convient à un transport visionnaire sans affirmer une translation corporelle, explicitement niée ensuite.
- source_word: ܪܐܙܐ
  choice: un mystère
  rationale: Terme syriaque usuel pour un secret divin révélé, approprié au registre apocalyptique.
- source_word: ܡܬܢܛܪܝܢ / ܢܬܢܛܪܘܢ
  choice: sont gardés / sont conservés
  rationale: Le verbe peut évoquer la garde, la préservation ou la mise en réserve ; les rendus français laissent ouverte la finalité judiciaire.
theological_decisions:
- issue: Connaissance divine du voyant avant sa formation
  choice: Rendre les deux formulations par une connaissance personnelle antérieure, sans développer une doctrine de prédestination.
  alternative: Lire la seconde formulation comme une promesse ou une consécration prophétique explicite.
  rationale: Les deux formes syriaques fournies relèvent de la racine « connaître ». La traduction garde leur affirmation forte et leur répétition sans importer une formule confessionnelle.
- issue: Nature de l’ascension de Baruch
  choice: Présenter un transport visionnaire non corporel.
  alternative: Comprendre soit un enlèvement physique, soit un rêve purement intérieur.
  rationale: Le texte nie explicitement que l’expérience ait eu lieu dans le corps, mais ne la réduit pas pour autant à un simple rêve.
- issue: Conservation des œuvres et des labeurs
  choice: Conserver une formulation ouverte pouvant évoquer leur préservation ou leur enregistrement.
  alternative: Préciser qu’ils sont mis en réserve exclusivement pour le jugement eschatologique.
  rationale: Le verbe indique la garde ou la conservation, sans préciser ici le moment ni le mode de la rétribution.
- issue: Les nombreux qui sont partis et les rares qui sont gardés
  choice: Maintenir le contraste sans l’expliquer comme une statistique du salut.
  alternative: Y voir explicitement l’opposition entre la multitude des damnés et le petit nombre des sauvés.
  rationale: Le contexte permet une méditation sur la mortalité et la survivance ; la formulation syriaque ne tranche pas à elle seule la question sotériologique.
- issue: Récompense des témoins de la justice
  choice: Conserver la demande de récompense tout en reconnaissant la difficulté textuelle du passage.
  alternative: Traduire ܬܘܪܨܐ par « instruction », « ordonnance » ou « juste conduite » et reconstruire autrement la phrase.
  rationale: Le texte syriaque transmis dans ce segment paraît perturbé. La formulation retenue demeure cohérente avec la demande et évite de préciser la nature de la récompense.
translation_notes:
  register: Français international moderne, digne et lisible, avec un registre narratif apocalyptique. Les répétitions significatives du syriaque sont maintenues, notamment « tu m’étais connu ». Les passages syntaxiquement difficiles sont rendus avec sobriété, et les ambiguïtés substantielles sont signalées en notes plutôt que résolues doctrinalement.
