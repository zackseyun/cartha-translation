review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement le syriaque. La seconde formule prénatale, ܐܬܝܕܥܬ ܠܝ, relève bien de « connaître » et non de « promettre » : la répétition de la connaissance doit donc être maintenue. La note a actuelle propose toutefois une interprétation (« je me suis montré à toi ») qui n’est pas suffisamment fondée par la construction dans ce contexte et risque de créer une ambiguïté artificielle. Le transport est correctement présenté comme non corporel, sans en tirer de conclusion doctrinale.'
  naturalness: Le français est fluide et adapté à un registre narratif-apocalyptique moderne. « Tu m’étais connu » est intelligible, mais demeure sensiblement moins naturel que « je te connaissais déjà » ; cette dernière formulation conserve le sens et la répétition du syriaque. « Sans savoir comment » ajoute légèrement l’idée de manière, absente du texte ; « et je ne le savais pas » reste plus proche.
  terminology: « Descendance de l’humanité », « Fils d’homme », « mystère », « char d’une nuée » et « conservés » sont appropriés. « Justice » dans la clause textuellement difficile est un rendu prudent et non confessionnel. « Ceux qui sont gardés » laisse à juste titre ouverte la portée du contraste.
  issues:
  - severity: medium
    issue: Note a et son ancre
    rationale: La note suggère que le locuteur pourrait dire « je me suis montré à toi », alors que le contexte et la construction se rendent naturellement par la révélation des choses futures au voyant. Cette alternative ne doit pas être promue sans un appui textuel plus clair.
  - severity: low
    issue: Formulation française de la connaissance prénatale
