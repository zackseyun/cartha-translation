revisions:
- from: 'Il arriva que, tandis que je priais et prononçais les premières paroles de cette prière, je fus bouleversé et me mis à trembler. Je réfléchissais à la descendance de l’humanité : combien sont nombreux ceux qui s’en sont allés, et combien peu nombreux ceux qui sont gardés. Pendant que je pensais à ces choses, j’entendis une voix me dire :


    « Fils d’homme, pourquoi es-tu troublé, et pourquoi as-tu peur ? Avant même que tu sois formé, tu m’étais connu ; avant que tu sortes du ventre de ta mère, tu m’étais connu. Voilà pourquoi je t’ai montré les choses qui doivent arriver.[a] »


    Je lui répondis : « Seigneur, tu m’as montré la vaste étendue des temps et ce qui s’y est produit, mais tu ne m’as pas montré combien de temps cela durera.[c] Je demande donc à entendre quelle récompense est gardée pour ceux qui ont rendu témoignage en faveur de la justice. » Une multitude de bonnes et de mauvaises choses à venir me furent promises, puis je montai sur la montagne.


    Au bout de sept jours, j’arrivai à l’endroit où se trouvait une source. Tandis que j’étais assis là, je fus emporté sur le char d’une nuée[b] — non pas corporellement, et sans savoir comment. Un mystère me fut montré, et j’entendis une voix me dire : « Regarde et comprends comment, dans ce monde, sont conservés les actes et les labeurs de ceux qui ont bien agi comme de ceux qui ont mal agi. »'
  to: 'Il arriva que, tandis que je priais et prononçais les premières paroles de cette prière, je fus bouleversé et me mis à trembler. Je réfléchissais à la descendance de l’humanité : combien sont nombreux ceux qui s’en sont allés, et combien peu nombreux ceux qui sont gardés. Pendant que je pensais à ces choses, j’entendis une voix me dire :


    « Fils d’homme, pourquoi es-tu troublé, et pourquoi as-tu peur ? Avant même que tu sois formé, je te connaissais déjà ; avant que tu sortes du ventre de ta mère, je te connaissais déjà. Voilà pourquoi les choses qui doivent arriver t’ont été montrées. »


    Je lui répondis : « Seigneur, tu m’as montré la vaste étendue des temps et ce qui s’y est produit, mais tu ne m’as pas montré combien de temps cela durera.[c] Je demande donc à entendre quelle récompense est gardée pour ceux qui ont rendu témoignage en faveur de la justice. » Une multitude de bonnes et de mauvaises choses à venir me furent promises, puis je montai sur la montagne.


    Au bout de sept jours, j’arrivai à l’endroit où se trouvait une source. Tandis que j’étais assis là, je fus emporté sur le char d’une nuée[b] — non pas corporellement, et je ne le savais pas. Un mystère me fut montré, et j’entendis une voix me dire : « Regarde et comprends comment, dans ce monde, sont conservés les actes et les labeurs de ceux qui ont bien agi comme de ceux qui ont mal agi. »'
  rationale: La révision supprime une note spéculative et son appel, rend de manière plus idiomatique les deux occurrences syriaques de « connaître », et retire l’ajout implicite de « comment » dans la description du transport. Le reste est conservé, notamment les solutions prudentes dans les segments textuellement difficiles et les deux notes qui correspondent à de réelles ambiguïtés de syntaxe ou d’expression.
