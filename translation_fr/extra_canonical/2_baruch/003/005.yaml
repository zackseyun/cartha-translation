  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: fr
  text: Car si tu détruis ta ville, livres ton sanctuaire pour un temps et disperses ton peuple parmi les nations afin qu’ils ne soient plus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒܕ
  choice: détruis
  rationale: Le verbe syriaque exprime ici l’idée de faire périr ou de détruire; « détruis » convient naturellement à la ville et correspond au contexte de sa ruine.
- source_word: ܡܕܝܢܬܟ
  choice: ta ville
  rationale: Le nom signifie « ville », avec suffixe possessif de deuxième personne; la référence contextuelle est Jérusalem.
- source_word: ܬܫܠܡ
  choice: livres
  rationale: Dans ce contexte, le verbe a le sens de remettre ou livrer au pouvoir d’autrui; « livres » préserve cette idée sans préciser indûment l’agent humain.
- source_word: ܠܙܒܢܐ
  choice: pour un temps
  rationale: Cette expression indique une durée limitée ou une période, sans en fixer la longueur.
- source_word: ܒܥܡܡ̈ܐ
  choice: parmi les nations
  rationale: Le pluriel syriaque désigne les peuples ou nations; « parmi les nations » est l’expression française naturelle dans le contexte de la dispersion.
theological_decisions:
- issue: Dieu présenté comme détruisant sa propre ville et livrant son sanctuaire
  choice: Conserver l’adresse directe et l’action attribuée à Dieu
  alternative: Atténuer en parlant seulement de ce que Dieu permet
  rationale: Le texte formule directement l’hypothèse « si tu détruis… si tu livres… »; remplacer l’action par une simple permission résoudrait une tension théologique que la traduction doit préserver.
- issue: Portée de « afin qu’ils ne soient plus »
  choice: Maintenir la formulation existentielle ouverte
  alternative: Préciser « afin qu’ils cessent d’être un peuple » ou « afin qu’ils disparaissent »
  rationale: La formulation reçue ne précise pas explicitement s’il s’agit de la disparition physique du peuple ou de la fin de son existence collective; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français moderne, digne et direct. La répétition de « si tu » clarifie la coordination hypothétique. La virgule finale est maintenue parce que le verset ouvre une phrase qui se poursuit dans le contexte immédiat.
