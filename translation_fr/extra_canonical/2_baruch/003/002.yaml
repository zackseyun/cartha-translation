  yaml_path: translation/extra_canonical/2_baruch/003/002.yaml
  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: fr
  text: Si j’ai trouvé grâce à tes yeux, que tes compassions recueillent sans tarder mon esprit auprès de toi, afin que je rejoigne mes pères sans voir la destruction de ma mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܝܒܘܬܐ
  choice: grâce
  rationale: Dans la formule conditionnelle « trouver grâce devant/aux yeux de », ce terme exprime la faveur accordée par Dieu.
- source_word: ܪ̈ܚܡܝܟ
  choice: tes compassions
  rationale: Le pluriel syriaque est conservé dans une expression française digne et intelligible.
- source_word: ܪܘܚܝ
  choice: mon esprit
  rationale: Correspondance directe qui préserve le langage anthropologique du texte sans le réduire à « ma vie ».
- source_word: ܐܒ̈ܗܝ
  choice: mes pères
  rationale: La formule ancestrale est conservée plutôt que remplacée par une paraphrase comme « mes ancêtres ».
- source_word: ܒܚܪܒܗ̇ ܕܐܡܝ
  choice: la destruction de ma mère
  rationale: Rend le sens de ruine ou destruction et maintient la personnification maternelle de la ville.
theological_decisions:
- issue: Demande que Dieu prenne l’esprit du locuteur
  choice: « que tes compassions prennent vite mon esprit auprès de toi »
  alternative: « fais-moi mourir rapidement dans ta compassion »
  rationale: La formulation retenue préserve l’image et l’ambiguïté du syriaque sans expliciter la demande par une formulation théologiquement plus interprétative.
- issue: Identification de « ma mère »
  choice: Maintien de « ma mère » dans le texte
  alternative: « Jérusalem, ma mère »
  rationale: Le contexte permet d’identifier la ville, mais le verset emploie la métaphore sans nommer explicitement Jérusalem; l’ajout résoudrait inutilement l’image.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La construction « trouver grâce à tes yeux » conserve l’idiome biblique courant. « Rejoindre mes pères » est plus naturel en français actuel que « aller vers mes pères », tout en gardant le sens ancestral.
