review_pass:
  verdict: revise
  source_fidelity: 'La version proposée introduit deux précisions qui ne sont pas suffisamment assurées par le syriaque transmis : « ils » remplace la 2e personne plurielle de ܕܬܚܙܘܢ, et « ce qu’il adviendra » / « deviendra » explicite un avenir que cette formulation fragmentaire n’énonce pas nettement. Une formulation directe, avec note, préserve mieux l’ambiguïté de ܡܢ. La dernière expression demeure syntaxiquement incertaine; le rendu principal suit prudemment la lecture nominale retenue dans la piste anglaise, tout en signalant l’alternative verbale active que permet la forme transmise.'
  naturalness: Le français révisé reste moderne et lisible tout en conservant la personnification féminine de la ville et les images volontairement surprenantes. « Méfaits de ses mains » rend idiomatiquement l’expression sémitique sans en effacer le sens d’actes mauvais. « Veuve dans l’amertume » évite de psychologiser l’adjectif par « plongée » et maintient l’image.
  terminology: « Humiliation » et « butin doux » maintiennent la lecture adoptée par l’audit anglais sans donner au contraste imagé une explication doctrinale. La note indique que le syriaque peut aussi se lire avec un verbe pluriel (« ils l’humilièrent »), sans trancher la difficulté textuelle.
  issues:
  - severity: medium
    issue: Changement non signalé de la personne verbale
    rationale: Le syriaque visible porte une forme à la deuxième personne du pluriel (« que vous voyiez »). Le passage à « qu’ils voient » résout l’incohérence contextuelle supposée, mais ne doit pas être fait dans le texte principal alors que la forme est explicitement attestée.
  - severity: medium
    issue: Ajout d’un événement futur explicite
    rationale: « Ce qu’il adviendra » et « elle deviendra » interprètent la phrase comme l’annonce détaillée d’un devenir. Le texte et la piste anglaise permettent plutôt une formulation comparative sans imposer ce développement.
  - severity: low
    issue: Note a excessivement littérale et peu claire
    rationale: « afin que vous voyiez pour vous de cette ville » n’est pas une glose française compréhensible. Une explication plus simple de la préposition ambiguë remplit mieux la fonction de note.
  revised_text: 'afin que vous voyiez par vous-mêmes ce qui concerne cette ville[a] : à cause des méfaits de ses mains, cette ville est comme une veuve dans l’amertume, et son humiliation est comme un doux butin.[b] »'
  revised_footnotes:
  - marker: a
    text: 'Le syriaque porte littéralement : « afin que vous voyiez par vous-mêmes de cette ville ». La préposition peut aussi se comprendre « depuis cette ville » ou « au sujet de cette ville ».'
    reason: Préserver l’ambiguïté de ܡܢ et la deuxième personne plurielle de la forme verbale transmise.
  - marker: b
    text: 'La syntaxe syriaque de la fin du verset est obscure. On peut aussi comprendre : « cette ville est comme une veuve amère, et ils l’humilièrent comme un doux butin ».'
    reason: Signaler la possibilité que la forme transmise soit un verbe pluriel actif plutôt que le nom abstrait « son humiliation ».
  revision_rationale: La révision évite de résoudre silencieusement les difficultés de personne, de préposition et de syntaxe. Elle conserve le sens comparatif et les images du texte, suit la lecture nominale de l’audit anglais pour le texte principal, et place les alternatives réellement pertinentes en notes ancrées aux segments concernés.
