  yaml_path: translation/extra_canonical/2_baruch/003/007.yaml
  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: fr
  text: 'afin qu’ils voient ce qu’il adviendra de cette ville[a] : à cause du mal commis par ses mains, elle deviendra comme une veuve plongée dans l’amertume, et son humiliation sera comme un doux butin.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que vous voyiez pour vous de cette ville ». Le texte syriaque est difficile; on peut aussi comprendre : « afin que vous voyiez ce qui concerne cette ville » ou « depuis cette ville ».'
    reason: Conserver l’ambiguïté de la préposition ܡܢ et la deuxième personne plurielle du texte transmis.
  - marker: b
    text: 'Le texte syriaque de la fin du verset est obscur. Autre traduction possible : « cette ville est comme une veuve amère, et ils l’ont humiliée comme un doux butin ».'
    reason: Signaler l’incertitude syntaxique, notamment la possibilité de lire un verbe pluriel actif plutôt que le nom abstrait « son humiliation ».
lexical_decisions:
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  choice: afin qu’ils voient ce qu’il adviendra de cette ville
  rationale: La construction syriaque est difficile et littéralement proche de « que vous voyiez pour vous de cette ville ». Cette formulation française exprime naturellement l’idée de constater le sort de la ville, tout en signalant en note la lecture plus formelle.
- source_word: ܒ̈ܝܫܬܗ̇ ܕܐܝܕܝܗ̇
  choice: le mal commis par ses mains
  rationale: L’expression signifie littéralement « les maux de ses mains » et désigne ses actes mauvais; la personnification féminine de la ville est conservée.
- source_word: ܐܝܟ ܥܡܗܕܐ ܡܪܝܪܐ
  choice: comme une veuve plongée dans l’amertume
  rationale: Le substantif paraît désigner une veuve, qualifiée de « bitter/amère ». Une tournure idiomatique évite en français l’ambiguïté involontaire de « veuve amère » tout en gardant l’image et l’affliction.
- source_word: ܐܝܟ ܫܘܕܐ ܚܠܝܬܐ
  choice: comme un doux butin
  rationale: Rendu formel de l’image paradoxale « butin doux/agréable », sans chercher à résoudre sa tension.
theological_decisions:
- issue: Lien entre les mauvaises actions de la ville et son état futur
  choice: ponctuation causale suivie d’un devenir
  alternative: « à cause du mal commis par ses mains, que cette ville est comme… »
  rationale: Le syriaque transmis est syntaxiquement heurté. Le futur « deviendra » s’accorde au contexte d’un jugement annoncé, sans transformer l’image en affirmation doctrinale plus précise.
- issue: Référent de la deuxième personne dans la proposition initiale
  choice: troisième personne plurielle « ils » d’après le contexte immédiat
  alternative: deuxième personne plurielle « vous » selon la forme verbale syriaque conservée
  rationale: La forme syriaque visible est à la deuxième personne plurielle, mais le contexte et la consultation anglaise comprennent vraisemblablement les personnes que Baruch doit avertir. La note conserve explicitement la forme plus littérale et l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et lisible. La ville demeure personnifiée au féminin. Les images inhabituelles de la veuve et du « doux butin » sont préservées; les difficultés du syriaque sont exposées en notes plutôt que résolues silencieusement.
