  naturalness: La formulation est naturelle en français international moderne, avec un registre sobre convenant à une lamentation. « Trop lourdes pour moi » est idiomatique et conserve l’image de ce qui est trop difficile à porter. La coordination par « et » reste fluide et ne force pas une opposition absente du français source proposé.
  terminology: « Abandonner la moitié de ton peuple » conserve la lecture principale adoptée dans le texte anglais sans surinterprétation. « Multitude » et « assemblée » dans la note sont des équivalents convenables pour l’alternative. « Ma mère » maintient la personnification sans ajouter « Jérusalem » au texte.
