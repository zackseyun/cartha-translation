  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: fr
  text: 'Car ces deux choses sont trop lourdes pour moi : je ne peux abandonner la moitié de ton peuple[a], et mon âme ne peut supporter de voir le malheur de ma mère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible du syriaque : « je ne peux mourir avec la multitude ni avec mon assemblée ».'
    reason: Le texte syriaque transmis est difficile à segmenter et permet une autre compréhension de cette proposition.
lexical_decisions:
- source_word: ܡܫܟܚ ܐܢܐ
  choice: je ne peux
  rationale: Exprime naturellement en français l’incapacité indiquée par la tournure syriaque.
- source_word: ܒܒܝܫܬܗ̇ ܕܐܡܝ
  choice: le malheur de ma mère
  rationale: Le substantif désigne ici le mal ou le désastre qui frappe la ville, personnifiée comme la mère de Baruch ; « malheur » évite de suggérer sa faute morale.
- source_word: ܢܦܫܝ
  choice: mon âme
  rationale: Conserve l’anthropologie et l’intensité affective explicites du texte syriaque.
- source_word: ܐܚܙܐ
  choice: voir
  rationale: Correspond directement au verbe de perception sans expliciter davantage la nature de l’expérience.
theological_decisions:
- issue: Personnification de Jérusalem comme mère
  choice: « ma mère »
  alternative: « Jérusalem, ma mère »
  rationale: Le texte dit simplement « ma mère ». L’identification avec la ville ressort du contexte et ne doit pas être ajoutée dans le verset.
- issue: Lecture difficile de la première incapacité
  choice: « je ne peux abandonner la moitié de ton peuple » dans le texte, avec variante en note
  alternative: « je ne peux mourir avec la multitude ni avec mon assemblée »
  rationale: La transmission et la segmentation du syriaque sont difficiles à cet endroit. La leçon principale donne un sens cohérent dans le contexte, tandis que la formulation plus littérale possible est conservée sans être imposée.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination parallèle restitue la détresse de Baruch sans résoudre silencieusement la difficulté textuelle. Le marqueur [a] figure dans le texte principal.
