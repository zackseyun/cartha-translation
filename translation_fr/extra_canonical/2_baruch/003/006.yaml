  text: Or how will one speak of your praise? Or to whom will what is in your law be explained?
translation:
  language: fr
  text: Ou comment parlera-t-on de ta louange ? Ou à qui expliquera-t-on ce qui est dans ta Loi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (teshbḥātāk)
  choice: ta louange
  rationale: Le nom syriaque est au singulier avec suffixe de deuxième personne ; « ta louange » conserve ce nombre et le sens d’éloge adressé à Dieu.
- source_word: ܢܬܦܫܩ (netpashaq)
  choice: expliquera-t-on
  rationale: Le passif syriaque exprime l’idée que le contenu de la Loi est rendu intelligible ou interprété ; la tournure impersonnelle française reste naturelle.
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: ta Loi
  rationale: Dans ce contexte théologique, le terme désigne la Loi divine ; la majuscule française signale ce référent sans ajouter une précision absente du texte.
theological_decisions:
- issue: Destinataire de la louange et propriétaire de la Loi
  choice: Maintien des possessifs « ta » sans expliciter « Dieu » ou « Seigneur »
  alternative: Ajouter « ta louange, Seigneur » ou « ta Loi divine »
  rationale: Le contexte identifie déjà l’interlocuteur ; une explicitation introduirait des mots absents du verset.
- issue: Portée de « ce qui est dans ta Loi »
  choice: Conserver la formulation générale
  alternative: Rendre par « les enseignements de ta Loi »
  rationale: Le syriaque laisse ouverte la nature précise du contenu ; la traduction ne doit pas réduire cette ambiguïté.
translation_notes:
  register: Deux questions coordonnées, dans un français moderne, digne et accessible. L’impersonnel « parlera-t-on / expliquera-t-on » restitue naturellement les formes syriaques sans imposer un sujet déterminé.
