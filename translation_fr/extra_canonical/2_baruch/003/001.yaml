  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: fr
  text: '1 Et je dis : « Ô Seigneur, mon Seigneur, suis-je venu au monde pour cela, pour voir le malheur de ma mère[a] ? Non, mon Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ma mère » désigne ici Jérusalem, ou Sion.
    reason: La note explicite le référent de la métaphore tout en permettant de conserver son expression littérale dans le texte.
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: suis-je venu au monde
  rationale: La leçon syriaque contrôlée, corrigée d’une grave erreur d’OCR dans la transcription fournie, exprime la venue au monde. Cette tournure française en conserve naturellement la portée existentielle.
- source_word: ܒܝܫܬܗ̇
  choice: le malheur
  rationale: Le terme peut évoquer le mal, la calamité ou le désastre. « Le malheur » convient ici à la catastrophe qui frappe Jérusalem sans anticiper le mot plus précis « destruction » du verset suivant.
- source_word: ܐܡܝ
  choice: ma mère
  rationale: La métaphore maternelle désigne Jérusalem/Sion. La conserver maintient la force affective et poétique de la lamentation au lieu de l’interpréter directement comme « ma ville ».
theological_decisions:
- issue: Identité de « ma mère »
  choice: Conserver la personnification de Jérusalem/Sion comme mère dans le texte principal.
  alternative: Traduire directement par « ma ville » ou « Sion ».
  rationale: L’image maternelle est intentionnelle et exprime le lien intime de Baruch avec Jérusalem; une note en précise le référent sans effacer la métaphore.
- issue: Sens de la question de Baruch
  choice: La présenter comme une plainte existentielle devant le malheur de Jérusalem.
  alternative: La reformuler comme une demande antérieure de Baruch ou comme une contestation doctrinale de Dieu.
  rationale: La leçon syriaque contrôlée porte « suis-je venu au monde », et la forme interrogative préserve la tension de la lamentation sans lui imposer une résolution théologique.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe répétée « Ô Seigneur, mon Seigneur » garde la solennité de la prière; « suis-je venu au monde pour cela » reste naturel tout en suivant la leçon syriaque contrôlée.
