    Quant au dernier jour, qui fut montré dans la forme et reçut la ressemblance, sache que le temps fera l’objet d’un examen, que la mesure de l’humanité sera mesurée et que sa force sera éprouvée.[b] Ainsi, puisque Adam, alors qu’il était encore vivant, entendit de Dieu quelque chose de ce qui devait être, comprit la délivrance des morts qui devait être accordée et ce que Dieu lui avait commandé, il y réfléchit et conçut cinq pensées. Car il se rendit lui-même responsable, et rendit aussi les anges responsables. De plus, au temps même où il fut créé, une vision lui fut montrée : celle de la vie amère et des éléments avec le feu. C’est ainsi que Dieu rassembla en Éden, à la ressemblance de ceux qui avaient été créés.[c]'
