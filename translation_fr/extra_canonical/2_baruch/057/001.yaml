base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/057/001.yaml
  text: 'For you saw a great cloud that ascended from the sea and went and covered this earth, hear this: that it is the world that the Mighty One made when he planned to make creation. And it happened that, when the word went out from before him, the beginning of the world stood, small and beautiful, and was established as it was destined to be.


    And the black waters that you saw first, which descended upon it from the cloud—this is the transgression that the first Adam committed at first. For when he sinned, death was stirred up, though it was not its time, and grief was made known, and pains were prepared, and suffering was created, and toil was accomplished, and greatness began to be brought low.


    And the last day, which was shown in the form and took the likeness, know that the time will be inquired into, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, while he was, heard from God something of what was to be, and understood the release of the dead that was to be given, and what had been commanded him by God, he considered it, and he devised five thoughts. For he made himself liable, and he also made the angels liable. And also at that time when he was created, there was shown to him a vision of the bitter life and of the elements with fire. Thus God gathered in Eden, in the likeness of those that were created.'
translation:
  language: fr
  text: 'Car tu as vu une grande nuée monter de la mer, puis aller couvrir cette terre. Écoute ceci : c’est le monde que le Puissant fit lorsqu’il décida de créer la création.[a] Et lorsque la parole sortit de devant lui, le commencement du monde se dressa, petit et beau, et fut établi tel qu’il devait être.


    Les eaux noires que tu as vues en premier, qui descendirent de la nuée sur lui, représentent la transgression que le premier Adam commit au commencement. En effet, lorsqu’il pécha, la mort fut mise en mouvement, bien que son temps ne fût pas encore venu ; le deuil se fit connaître, les douleurs furent préparées, la souffrance fut créée, le labeur fut achevé, et la grandeur commença à être abaissée.


    Quant au dernier jour, qui fut montré dans la forme et reçut la ressemblance, sache que le temps fera l’objet d’un examen, que la mesure de l’humanité sera mesurée et que sa force sera éprouvée.[b] Ainsi, puisque Adam, alors qu’il était encore vivant, entendit de Dieu quelque chose de ce qui devait être, comprit la délivrance des morts qui devait être accordée et ce que Dieu lui avait commandé, il y réfléchit et conçut cinq pensées. Car il se rendit lui-même responsable, et rendit aussi les anges responsables. De plus, au temps même où il fut créé, une vision lui fut montrée : celle de la vie amère et des éléments avec le feu. C’est ainsi que Dieu rassembla en Éden, à la ressemblance de ceux qui avaient été créés.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre ponctuation possible : « couvrir cette terre. C’est le monde que le Puissant fit… »'
    reason: La limite syntaxique après « cette terre » permet de rattacher différemment l’explication qui suit.
  - marker: b
    text: 'Le syriaque de la proposition sur le dernier jour est inhabituel et peut aussi se rendre plus littéralement : « le dernier jour, qui fut montré dans la forme et reçut la ressemblance ».'
    reason: La construction associe de manière obscure « forme », « recevoir » et « ressemblance » ; il convient d’en signaler l’ambiguïté sans la résoudre.
  - marker: c
    text: La formulation de cette dernière phrase est obscure dans le texte syriaque ; le sujet implicite de « avaient été créés » n’y est pas précisé.
    reason: La traduction conserve l’indétermination réelle de la phrase au lieu d’identifier conjecturalement les êtres créés.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: le commencement du monde
  rationale: Le contexte de création primordiale et les témoins de contrôle favorisent l’idée d’origine ou de commencement, plutôt que celle du déroulement ultérieur du monde.
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: la transgression
  rationale: « Transgression » exprime l’acte primordial d’Adam comme franchissement fautif, tout en évitant de le réduire à une faute morale générique.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: la mort fut mise en mouvement
  rationale: Le verbe évoque l’activation de la mort ; cette formulation conserve l’image apocalyptique sans suggérer qu’elle n’existait auparavant sous aucune forme.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: la grandeur commença à être abaissée
  rationale: La traduction garde le mouvement d’abaissement et ne précise pas arbitrairement s’il s’agit de la grandeur humaine, de la majesté ou d’une grandeur plus générale.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: la mesure de l’humanité
  rationale: Dans le parallélisme avec le temps examiné et la force éprouvée, « mesure » convient au cadre évaluatif et judiciaire.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: se rendit… passible de condamnation / rendit… passibles de condamnation
  rationale: Cette expression rend la responsabilité judiciaire encourue, plutôt qu’un simple sentiment de culpabilité, et conserve l’affirmation difficile concernant les anges.
- source_word: ܐܣܛܘܟܣܐ
  choice: les éléments
  rationale: Ce terme syriaque emprunté au grec stoicheia conserve ici sa résonance cosmologique sans imposer l’interprétation plus spécifique de « puissances élémentaires ».
theological_decisions:
- issue: Le rôle d’Adam dans les premières eaux noires
  choice: La transgression d’Adam met en mouvement une série de conséquences touchant la mort et la condition humaine.
  alternative: Présenter Adam comme simple exemple du péché humain en général, ou limiter les conséquences à une culpabilité strictement juridique.
  rationale: Le texte relie directement son acte à la mort, au deuil, aux douleurs, à la souffrance, aux peines et à l’abaissement de la grandeur.
- issue: L’étendue de la responsabilité d’Adam
  choice: Conserver l’affirmation selon laquelle Adam se rend passible de condamnation et y expose aussi les anges.
  alternative: Supprimer la référence aux anges, la paraphraser ou la limiter à la seule responsabilité personnelle d’Adam.
  rationale: Le syriaque formule une affirmation forte et obscure ; la traduction doit préserver cette tension au lieu de la résoudre doctrinalement.
- issue: La délivrance des morts
  choice: Traduire simplement comme une délivrance future qui serait accordée.
  alternative: Préciser qu’il s’agit nécessairement de la résurrection finale ou d’une autre doctrine déterminée.
  rationale: Le passage évoque la libération des morts sans en définir ici exactement le mécanisme ni la portée.
