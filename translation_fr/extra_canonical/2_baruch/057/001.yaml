revisions:
- from: 'Car tu as vu une grande nuée monter de la mer, puis avancer et couvrir cette terre. Écoute ceci : elle représente le monde que le Puissant fit lorsqu’il décida de créer la création.[a] Et lorsque la parole sortit de devant lui, le commencement du monde se dressa, petit et beau, et fut établi tel qu’il devait être.


    Les eaux noires que tu as vues en premier descendre de la nuée sur lui représentent la transgression que le premier Adam commit au commencement. En effet, lorsqu’il pécha, la mort fut mise en mouvement, bien que son temps ne fût pas encore venu ; le deuil se fit connaître, les douleurs furent préparées, la souffrance fut créée, les peines arrivèrent à leur comble, et la grandeur commença à être abaissée.


    Quant au dernier jour, qui fut montré sous une forme et prit une ressemblance, sache que le temps fera l’objet d’un examen, que la mesure de l’humanité sera mesurée et que sa force sera éprouvée.[b] Ainsi, puisque Adam, de son vivant, avait entendu de Dieu une partie de ce qui devait arriver, qu’il avait compris la délivrance des morts qui serait accordée et ce que Dieu lui avait commandé, il y réfléchit et conçut cinq pensées. Car il se rendit lui-même passible de condamnation, et rendit aussi les anges passibles de condamnation. De plus, au temps même où il fut créé, une vision lui fut montrée : celle de la vie amère et des éléments avec le feu. C’est ainsi que Dieu rassembla en Éden, à la ressemblance de ceux qui avaient été créés.[c]'
