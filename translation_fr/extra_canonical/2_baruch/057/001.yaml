    rationale: ܡܚܝܒܢܘܗܝ exprime l’idée de rendre responsable ou redevable ; le texte ne précise pas ici une « condamnation ». Il convient de maintenir la force de la responsabilité sans compléter le jugement.
  - severity: low
    issue: « Sous une forme » et « prit une ressemblance » interprètent légèrement la formulation énigmatique.
    rationale: Le syriaque porte les expressions définies « dans la forme » et « la ressemblance ». Une formulation plus proche conserve mieux l’étrangeté réelle du texte.
  - severity: low
    issue: L’alternance des plus-que-parfaits avec « il y réfléchit » brouille légèrement la progression narrative.
    rationale: Le syriaque enchaîne les actions d’Adam ; des passés simples français donnent une séquence plus cohérente et ne suggèrent pas une antériorité supplémentaire.
