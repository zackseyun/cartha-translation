base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: fr
  text: 'Écoute ce qu’est la grande nuée que tu as vue monter de la mer, avancer et couvrir cette terre : c’est le monde que sa puissance a fait lorsqu’il décida de créer la création. Et lorsque la parole sortit de devant lui, la structure du monde se dressa, toute petite, puis elle fut établie selon ce qu’elle devait devenir.


    Quant aux premières eaux noires que tu as vues descendre de la nuée sur elle, elles représentent le premier péché, la transgression que commit le premier Adam. Car, lorsqu’il pécha, la mort fut mise en mouvement, bien que son temps ne fût pas encore venu ; le deuil se fit connaître, des douleurs furent préparées, la douleur fut créée, le labeur fut accompli et la grandeur commença à être abaissée.


    Quant au dernier jour, qui fut montré sous une forme et prit une apparence, sache que le temps sera examiné, que la norme de l’humanité[a] sera mesurée et que sa force sera mise à l’épreuve. Ainsi Adam, après avoir entendu de Dieu quelque chose de ce qui devait arriver, comprit que la libération des morts[b] avait été accordée, ainsi que ce qui lui avait été commandé par Dieu. Il poursuivit sa réflexion et conçut cinq pensées. En effet, il se rendit lui-même coupable ; il rendit aussi les anges coupables[c]. Et, au moment même où il fut créé, une vision lui fut montrée : les bêtes féroces et les éléments avec le feu. Ainsi Dieu rassembla en Éden, à la ressemblance de ceux qui avaient été créés[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi de l’humanité » ; le terme peut désigner une règle, une norme ou une loi.
    reason: Le nom syriaque a une portée normative dont la nuance exacte reste incertaine dans ce contexte de mesure et d’examen.
  - marker: b
    text: L’expression peut aussi évoquer la délivrance ou la rémission des morts ; elle n’identifie pas explicitement cette libération à la résurrection.
    reason: Préserver l’indétermination théologique de ܫܘܒܩܢܐ.
  - marker: c
    text: Cette affirmation concernant les anges est obscure dans le texte transmis.
    reason: Signaler une difficulté réelle sans supprimer ni réinterpréter silencieusement le propos.
  - marker: d
    text: 'La fin de la phrase est elliptique : l’objet de « rassembla » et le référent de « ceux qui avaient été créés » ne sont pas explicités.'
    reason: Rendre transparente l’obscurité syntaxique du syriaque tout en conservant la lecture assurée « en Éden ».
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: la structure du monde
  rationale: L’expression évoque le monde dressé ou établi. « Structure » conserve l’image concrète d’un ordre créé sans imposer le sens plus abstrait de « commencement ».
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: le premier péché, la transgression
  rationale: Les deux termes sont rendus afin de préserver l’insistance du syriaque sur la faute primordiale d’Adam.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: la mort fut mise en mouvement
  rationale: Le verbe indique une activation ou une mise en branle, plutôt que la simple apparition ou connaissance de la mort.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: la grandeur commença à être abaissée
  rationale: La traduction conserve à la fois le commencement du processus et son mouvement descendant.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: la norme de l’humanité
  rationale: « Norme » maintient la portée évaluative de l’expression dans un contexte d’examen, de mesure et d’épreuve, tout en laissant ouverte la nuance possible de « loi ».
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: la libération des morts
  rationale: Cette formulation reste proche du syriaque et évite de préciser sans certitude s’il s’agit explicitement de résurrection, de délivrance ou de rémission.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: rendre passible de condamnation
  rationale: La tournure préserve la force judiciaire du terme sans réduire d’emblée son sens à une déclaration formelle de culpabilité.
- source_word: ܐܣܛܘܟܣܐ
  choice: les éléments
  rationale: Cet emprunt grec désigne naturellement les éléments cosmiques ; la traduction demeure claire et peu interprétative.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: les bêtes féroces
  rationale: ܚܝܘܬܐ désigne ici des animaux ou des bêtes, tandis que l’adjectif peut exprimer leur caractère farouche ou redoutable.
- source_word: ܒܥܕܢ
  choice: en Éden
  rationale: La lecture géographique « en Éden » convient au contexte adamique et au syntagme syriaque.
theological_decisions:
- issue: La faute d’Adam et la mise en mouvement de la mort
  choice: La transgression d’Adam déclenche la mise en mouvement de la mort avant que son temps soit venu.
  alternative: Comprendre seulement que la mort devint manifeste ou connue.
  rationale: La syntaxe syriaque présente la faute comme la cause de cette activation. La traduction conserve cette force causale sans lui ajouter un développement doctrinal ultérieur.
- issue: La libération des morts
  choice: Conserver l’expression ouverte « la libération des morts ».
  alternative: Traduire plus précisément par « la résurrection des morts » ou par « la rémission concernant les morts ».
  rationale: Le terme syriaque ne permet pas de trancher avec assez de certitude entre ces interprétations théologiques.
- issue: La responsabilité des anges
  choice: Maintenir l’affirmation difficile selon laquelle Adam rendit aussi les anges passibles de condamnation.
  alternative: Corriger implicitement le texte ou limiter la phrase à la responsabilité d’Adam seul.
  rationale: Le texte transmis associe les anges à cette responsabilité. La traduction garde cette tension visible au lieu de la résoudre par conjecture.
- issue: Le dernier jour
  choice: Traduire explicitement ܝܘܡܐ par « le dernier jour ».
  alternative: « Le dernier temps ».
  rationale: Le syriaque emploie le mot précis pour « jour », tandis que le terme pour « temps » apparaît ensuite dans la même phrase.
- issue: Le rassemblement en Éden
  choice: Conserver littéralement l’énoncé selon lequel Dieu rassembla en Éden, malgré sa formulation elliptique.
  alternative: Développer le complément implicite ou comprendre le mot comme une indication temporelle.
  rationale: « En Éden » est lexicalement et contextuellement solide, mais l’objet du rassemblement et le lien exact avec la ressemblance des créatures restent obscurs.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions et les enchaînements apocalyptiques du syriaque sont conservés lorsqu’ils portent le sens. Les formulations obscures relatives aux morts, aux anges et au rassemblement en Éden ne sont pas harmonisées doctrinalement.
