  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: fr
  text: 'Et je dis : « Ainsi donc, j’ai espéré en vain, et c’est en vain que Sion a été bâtie. Car si ceux qui nous haïssent ont pris possession d’elle, que feras-tu pour ton grand nom ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪ
  choice: Et je dis
  rationale: Rend directement la formule narrative syriaque, sans reproduire la répétition accidentelle présente dans une version antérieure.
- source_word: ܒܨܝܘܢ
  choice: Sion
  rationale: Forme biblique française usuelle du nom propre.
- source_word: ܪܒܘ / ܪܒܐ (lecture contextuelle)
  choice: grand
  rationale: Le contexte et la tradition textuelle soutiennent la demande concernant le « grand nom » de Dieu, malgré l’état difficile du texte transmis sur cette page.
- source_word: ܐܬܪܐ ܕܦܘܪܫܢܗܘܢ (passage textuellement difficile)
  choice: ont pris possession d’elle
  rationale: 'Suit le sens contextuel attesté par la couche de consultation auditée : les ennemis se sont emparés de Sion. La formulation française conserve l’accompli sans préciser davantage la nature de leur domination.'
theological_decisions:
- issue: Portée de l’espérance placée en Sion
  choice: Conserver la plainte du locuteur sans identifier explicitement cette Sion à la cité préparée d’avance évoquée au chapitre précédent.
  alternative: Préciser qu’il s’agit uniquement de la Jérusalem terrestre ou, inversement, de la cité céleste.
  rationale: Le verset exprime une tension entre la ruine historique de Sion et le dessein divin. Une explicitation trancherait une relation que le contexte laisse à interpréter.
- issue: Prise de Sion par ses ennemis
  choice: Présenter leur possession comme réelle dans l’histoire, sous la forme conditionnelle « si », sans en faire l’autorité ultime.
  alternative: Dire qu’ils ont détruit Sion indépendamment de Dieu, ou nier toute action véritable de leur part.
  rationale: La suite du chapitre les présente comme instruments temporaires du jugement divin; le présent verset demeure toutefois une plainte et ne résout pas encore cette tension.
- issue: Le « grand nom » de Dieu
  choice: 'Conserver la question directe : « que feras-tu pour ton grand nom ? »'
  alternative: Paraphraser en parlant de la réputation ou de l’honneur de Dieu.
  rationale: La formulation garde la force théologique et rhétorique de l’appel au nom divin sans en réduire le sens à une seule notion.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « en vain… en vain » est maintenu pour préserver l’insistance de la lamentation. Le texte syriaque fourni est matériellement difficile à cet endroit; la formulation retient la lecture contextuelle auditée sans introduire la duplication fautive signalée dans l’ancienne note anglaise.
