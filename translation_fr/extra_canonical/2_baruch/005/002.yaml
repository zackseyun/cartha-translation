  text: And the Lord said to me, "My name and my glory endure forever, but my judgment maintains its right in its time."
translation:
  language: fr
  text: 'Et le Seigneur me dit : « Mon nom et ma gloire subsistent pour toujours, mais mon jugement fera valoir son droit en son temps[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « préservera son droit en son temps ».'
    reason: Le verbe syriaque peut évoquer le fait de garder ou de préserver; la formulation du texte privilégie l’expression française plus idiomatique « faire valoir son droit ».
lexical_decisions:
- source_word: ܫܡܝ … ܘܐܝܩܪܝ (lecture sous-jacente, texte OCR déformé)
  choice: mon nom et ma gloire
  rationale: Cette lecture, attestée par la tradition textuelle de ce passage et reflétée dans la couche anglaise contrôlée, rend la formule divine sans réduire « gloire » à une simple réputation.
- source_word: ܕܝܢܐ / ܕܝܢ
  choice: mon jugement
  rationale: Le contexte et la tradition du texte soutiennent le substantif « jugement »; il s’agit de l’exercice du jugement divin, non d’une simple opinion.
- source_word: ܢܛܪ … ܙܕܩܗ
  choice: maintient son droit
  rationale: La tournure syriaque associe l’idée de garder ou préserver à celle de droit, justice ou juste prérogative. « Maintient son droit » conserve cette nuance juridique sans en préciser excessivement l’issue.
- source_word: ܒܙܒܢܗ
  choice: au temps qui lui est fixé
  rationale: Cette formulation française naturelle exprime « en son temps », c’est-à-dire au moment propre au jugement, sans identifier ce moment.
theological_decisions:
- issue: Rapport entre la permanence divine et le délai du jugement
  choice: Conserver le contraste entre « pour toujours » et le temps fixé du jugement
  alternative: Expliciter que Dieu retarde volontairement son jugement
  rationale: Le texte affirme à la fois la permanence du nom et de la gloire de Dieu et l’exercice temporel de son jugement, sans expliquer la raison du délai.
- issue: Sens de la justice attachée au jugement
  choice: « maintient son droit »
  alternative: « accomplira la justice »
  rationale: L’alternative résout la tension en décrivant directement un accomplissement juste, tandis que le syriaque laisse subsister une image juridique plus concise et ambiguë.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible, tandis que « subsistent » et « jugement » préservent le registre scripturaire. La note signale la formulation plus littérale sans alourdir le verset.
