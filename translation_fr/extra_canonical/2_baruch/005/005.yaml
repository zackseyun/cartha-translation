  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: fr
  text: J’allai chercher Jérémie, Addo, Séraïa, Yabish, Guedalia et tous les notables du peuple. Je les fis descendre dans la vallée du Cédron et leur rapportai tout ce qui m’avait été dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܚܬ (forme causative, d’après la couche de consultation auditée)
  choice: je les fis descendre
  rationale: Rend explicitement le mouvement descendant exprimé par la forme causative et convient à la destination, la vallée du Cédron.
- source_word: désignation des hommes éminents du peuple
  choice: les notables du peuple
  rationale: Expression française naturelle et digne pour des hommes reconnus ou honorés au sein du peuple.
- source_word: verbe de prise/convocation
  choice: chercher
  rationale: Dans ce contexte, « aller prendre » signifie aller trouver et rassembler les personnes nommées; « chercher » évite en français moderne une possible connotation de saisie ou d’arrestation.
- source_word: verbe de parole finale
  choice: rapportai
  rationale: Exprime la transmission fidèle de tout ce qui avait été dit au narrateur.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres sont translittérés sous les formes Jérémie, Addo, Séraïa, Yabish et Guedalia; Cédron est la forme française usuelle. L’extrait syriaque fourni comme corpus de chapitre ne présente pas clairement les mots de ce verset et semble provenir d’une interpolation de pages chevauchantes; le texte a donc été établi avec prudence à partir de la couche anglaise auditée et de ses indications lexicales sur le syriaque, sans ajouter de précision théologique.
