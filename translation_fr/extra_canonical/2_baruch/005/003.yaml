revisions:
- from: Et tu verras de tes propres yeux que ce ne sont pas les ennemis qui renversent Sion, ni ceux qui incendient Jérusalem, mais qu’ils sont, pour un temps, les serviteurs du Juge.[a]
  to: Et tu verras de tes yeux que ce ne sont pas des destructeurs qui sont établis contre Sion, ni des incendiaires contre Jérusalem, mais qu’ils servent le Juge pour un temps.
  rationale: La révision rétablit la construction passive du syriaque, sans imposer une interprétation plus précise de « établis/placés ». Elle conserve la personnification du Juge et supprime une variante de note non justifiée par la morphologie syriaque.
