  yaml_path: translation/extra_canonical/2_baruch/005/003.yaml
  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: fr
  text: Et tu verras de tes yeux que ce ne sont pas des destructeurs qui sont établis contre Sion, ni des incendiaires contre Jérusalem, mais qu’ils servent le Juge pour un temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܒܕܩܢܐ
  choice: les ennemis qui renversent
  rationale: Dans ce contexte de la chute de Sion, le terme désigne ceux qui causent sa ruine. La formulation française conserve la valeur causative retenue par la tradition textuelle consultée tout en restant naturelle.
- source_word: ܡܘܩܕܝܢ
  choice: ceux qui incendient
  rationale: Le participe issu de la racine « brûler » désigne les incendiaires de Jérusalem; « ceux qui incendient » exprime clairement l’action en cours.
- source_word: ܡܫܡܫܝܢ
  choice: les serviteurs
  rationale: Le verbe signifie servir ou exercer un ministère. Le substantif « serviteurs » rend ici l’idée que les destructeurs ne sont que des agents subordonnés.
- source_word: ܒܙܒܢܐ
  choice: pour un temps
  rationale: L’expression marque une durée limitée plutôt qu’un rôle permanent.
theological_decisions:
- issue: Les destructeurs de Jérusalem comme agents d’un jugement supérieur
  choice: les serviteurs du Juge
  alternative: au service du jugement
  rationale: La syntaxe syriaque permet de comprendre ܕܝܢܐ comme le Juge ou comme le jugement. Le texte principal retient la lecture personnelle, cohérente avec l’image d’agents subordonnés, tandis que la note conserve l’autre possibilité sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « De tes propres yeux » restitue naturellement l’insistance syriaque; la coordination explicite évite toute ambiguïté sur les deux groupes évoqués.
