review_pass:
  verdict: revise
  source_fidelity: Le syriaque dit littéralement que des « destructeurs » ne sont pas établis/placés contre (ou sur) Sion et que des « incendiaires » ne le sont pas contre Jérusalem; il ne caractérise pas directement ces personnes par les actions « qui renversent » et « qui incendient ». Le dernier membre porte clairement « ils servent le Juge pour un temps » (ܠܕܝ̈ܢܐ ܡ̇ܫܡܫܝܢ ܒܙܒܢܐ).
  naturalness: La révision reste idiomatique dans un français moderne et soutenu. « Établis contre » rend de manière compréhensible le participe passif « placés/assignés », tout en évitant d’ajouter une précision institutionnelle excessive.
  terminology: « Destructeurs », « incendiaires », « Sion », « Jérusalem » et « le Juge » sont appropriés. Le syriaque ܕܝ̈ܢܐ est ici le nom personnel « le Juge », non le nom abstrait « jugement »; la note proposant cette dernière lecture doit donc être supprimée.
  issues:
  - severity: medium
    issue: Les verbes « renversent » et « incendient » remplacent la construction source qui décrit des destructeurs et incendiaires comme étant établis/placés en relation avec Sion et Jérusalem.
    rationale: Cette reformulation suit l’audit anglais, mais elle efface le participe passif ܣ̇ܝܡܝܢ (« sont placés/établis ») et transforme la syntaxe ainsi que la nuance du syriaque.
  - severity: medium
    issue: La note présente « au service du jugement » comme une alternative textuelle à « les serviteurs du Juge ».
    rationale: Le terme ܕܝ̈ܢܐ correspond à « le Juge »; « jugement » relèverait d’une autre forme nominale. La note introduit donc une ambiguïté qui n’est pas soutenue par le texte source.
  revised_text: Et tu verras de tes yeux que ce ne sont pas des destructeurs qui sont établis contre Sion, ni des incendiaires contre Jérusalem, mais qu’ils servent le Juge pour un temps.
  revised_footnotes: []
