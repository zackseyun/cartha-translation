  text: For the noonday blaze does not burn forever, nor do the rays of the sun continue to give light.
translation:
  language: fr
  text: Car l’ardeur de midi ne brûle pas éternellement, ni les rayons du soleil ne continuent à éclairer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܠ ܕ־ (conjonction causale signalée par la tradition textuelle auditée)
  choice: Car
  rationale: Conserve le lien logique avec l’affirmation précédente, sans alourdir la phrase.
- source_word: expression syriaque correspondant à « noonday blaze »
  choice: l’ardeur de midi
  rationale: Rend à la fois la chaleur intense et l’éclat brûlant du milieu du jour dans un français naturel et soutenu.
- source_word: expression syriaque correspondant aux « rayons du soleil »
  choice: les rayons du soleil
  rationale: Formulation directe qui préserve l’image physique du texte.
- source_word: verbe duratif correspondant à « continuer à donner de la lumière »
  choice: continuent pas à éclairer
  rationale: Exprime explicitement la durée niée tout en restant idiomatique en français.
theological_decisions:
- issue: Portée temporelle des deux images
  choice: ne brûle pas éternellement… ne continuent pas à éclairer
  alternative: s’éteint… cessent d’éclairer
  rationale: La formulation retenue conserve les négations duratives et évite de transformer le verset en affirmation ponctuelle de leur extinction.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux propositions ainsi que la conjonction causale sont conservés. Aucun appel de note n’est nécessaire, car l’ancienne variante anglaise reproduit désormais le sens retenu dans le texte principal. L’extrait syriaque fourni dans le compartiment de chapitre ne contient pas visiblement les mots de ce verset; les choix précis ont donc été contrôlés à partir de la couche anglaise auditée et de ses révisions explicitement fondées sur le syriaque.
