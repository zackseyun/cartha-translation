revisions:
- from: Car, à coup sûr, la colère se déchaînera contre vous au temps fixé ; pour l’instant, elle est retenue par la patience[a], comme par un frein.
  to: Car, à coup sûr, la colère se réveillera contre vous au temps fixé ; pour le moment, elle est retenue par la longanimité[a], comme par une bride.
  rationale: La révision évite le surcroît d’intensité apporté par « se déchaînera », restitue l’image de la bride et emploie « longanimité » pour rendre la nuance de longue patience, avec une note strictement lexicale. Elle ne résout pas l’implicite théologique du texte.
