  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: fr
  text: Car, à coup sûr, la colère se réveillera contre vous au temps fixé ; pour le moment, elle est retenue par la longanimité[a], comme par une bride.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « patience ». Le terme évoque une patience qui endure et retient provisoirement.'
    reason: Précise le sens de « longanimité » sans identifier un agent implicite ni ajouter explicitement le jugement.
lexical_decisions:
- source_word: notion syriaque de « colère »
  choice: la colère
  rationale: Conserve la personnification du courroux qui s’éveille ou se met en mouvement, sans préciser explicitement qu’il s’agit de la colère divine lorsque le verset ne le dit pas directement.
- source_word: notion syriaque du « temps fixé »
  choice: au temps fixé
  rationale: Exprime un moment déterminé ou approprié, plutôt qu’une simple période générale.
- source_word: notion syriaque de « longue patience / longanimité »
  choice: par la patience
  rationale: Formulation française actuelle et naturelle qui garde l’idée d’un jugement temporairement différé.
- source_word: image syriaque de la bride ou du frein
  choice: comme par un frein
  rationale: « Frein » rend clairement l’image d’une force contenue tout en restant idiomatique en français moderne.
theological_decisions:
- issue: Identification de la colère
  choice: Ne pas ajouter « de Dieu »
  alternative: « la colère de Dieu »
  rationale: Le référent divin est probable dans le contexte, mais l’ajout explicite résoudrait une implicitation que le texte laisse subsister.
- issue: Agent de la retenue
  choice: 'Construction passive : « elle est retenue par la patience »'
  alternative: « Dieu la retient dans sa patience »
  rationale: La construction passive préserve l’expression du texte sans introduire un sujet explicite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve la personnification de la colère, le passif et l’image du frein. Le marqueur [a] figure dans le texte principal.
