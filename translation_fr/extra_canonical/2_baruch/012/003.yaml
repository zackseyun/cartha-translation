  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: fr
  text: Ne vous attendez pas à toujours connaître la prospérité et la joie, et ne l’espérez pas non plus. Ne vous élevez pas trop haut et n’opprimez pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: (verbes d’attente et d’espérance, d’après la couche de consultation auditée)
  choice: N’attendez ni n’espérez
  rationale: La coordination négative avec « ni » est naturelle en français et conserve les deux notions distinctes.
- source_word: (prospérité et joie, d’après la couche de consultation auditée)
  choice: la prospérité et la joie
  rationale: Ces termes courants gardent le contraste avec l’avertissement qui suit sans ajouter d’interprétation.
- source_word: (verbe réfléchi d’élévation, 2e personne du pluriel)
  choice: Ne vous élevez pas trop
  rationale: Le pluriel correspond à l’adresse collective signalée par l’analyse grammaticale syriaque; la formulation reste naturelle et n’explicite pas indûment l’orgueil.
- source_word: (verbe d’oppression, 2e personne du pluriel)
  choice: n’opprimez pas
  rationale: Le verbe est laissé sans complément, comme dans le texte de consultation, afin de ne pas préciser arbitrairement qui serait opprimé.
theological_decisions:
- issue: Nature de la prospérité promise ou espérée
  choice: Ne pas préciser si elle est matérielle, politique ou spirituelle
  alternative: Qualifier la prospérité, par exemple de matérielle
  rationale: Le texte ne fournit pas cette précision; la formulation ouverte préserve sa portée.
- issue: Destinataires de l’exhortation
  choice: Employer la deuxième personne du pluriel
  alternative: Employer le singulier collectif avec « vous-même »
  rationale: La morphologie syriaque signalée dans le dossier est plurielle et vise collectivement les destinataires.
translation_notes:
  register: Français international moderne, sobre et digne. La construction « connaître la prospérité et la joie » évite une tournure lourde tout en exprimant l’expérience continue envisagée. L’extrait syriaque fourni dans le paquet de chapitre ne présente pas visiblement les mots de ce verset; les choix détaillés s’appuient donc sur la couche anglaise auditée et sur les indications morphologiques de la révision, sans prétendre reconstituer des lexèmes absents de l’extrait.
