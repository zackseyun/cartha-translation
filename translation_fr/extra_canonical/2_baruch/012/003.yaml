  source_fidelity: L’extrait syriaque fourni relève du contexte de chapitre et ne contient pas visiblement 12:3 ; une vérification mot à mot directe n’est donc pas possible à partir de ce paquet. Par rapport à la piste d’audit anglaise, le projet conserve les deux interdictions initiales, la permanence (« toujours »), la prospérité et la joie, l’autoélévation au pluriel et l’interdiction d’opprimer sans ajouter de complément.
  naturalness: 'La construction « attendre connaître » n’est pas idiomatique en français : attendre, dans ce sens, se construit avec « s’attendre à ». La reformulation proposée est fluide et conserve distinctement l’idée de s’attendre à et celle d’espérer.'
