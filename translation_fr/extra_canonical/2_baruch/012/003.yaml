revisions:
- from: N’attendez ni n’espérez connaître toujours la prospérité et la joie. Ne vous élevez pas trop et n’opprimez pas.
  to: Ne vous attendez pas à toujours connaître la prospérité et la joie, et ne l’espérez pas non plus. Ne vous élevez pas trop haut et n’opprimez pas.
  rationale: Révision limitée à la correction de la rection française de « s’attendre à » et à une expression plus idiomatique de l’élévation excessive. La reprise pronominale « l’ » renvoie à la situation de toujours connaître prospérité et joie et maintient les deux notions coordonnées de l’anglais audité.
