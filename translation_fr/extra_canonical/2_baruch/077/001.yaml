  text: And I, Baruch, went from there and came to the people, and I gathered them from the great to the small. 2 And I said to them, “Hear, children of Israel. See how few of you are left from the twelve tribes of Israel. 3 Yet to you and to your fathers the Lord gave the law more than to all the nations. 4 And because your brothers transgressed the commandments of the Most High, he brought upon them what you have seen. 5 But you also, if you do not do what is right, as your brothers did, 6 the righteous one will judge his works, because he is the Mighty One whom you seek, and he is the Mighty One in whom you hope. 7 And he sees to preserve, not to forsake. 8 Have you not seen what happened to Zion? 9 Or do you think that the place sinned, and for this it was overthrown? Or that the land did some wrong, and for this it was handed over? 10 And do you not know that because of you those things that did not sin were destroyed, and because of what you did, that which did no wrong was delivered
    up? 11 And all the people answered and said to me, “Because we remember the good testimonies that the Mighty One did with you, 12 as we have seen, and also those that we have not seen, the Anointed One will come. 13 But now, ask on our behalf from above, and write also to our brothers in Babylon a letter of instruction and a writing of hope, 14 that you may show them also that which has not departed from you. 15 For the counsels of Israel have perished, and the lamps that gave light are extinguished, and the springs from which we used to drink have ceased. 16 And we are left in darkness, and in the thicket of the forest, and in the thirst of the wilderness.”
translation:
  language: fr
  text: '1 Moi, Baruch, je partis de là et vins vers le peuple. Je les rassemblai tous, du plus grand au plus petit. 2 Je leur dis : « Écoutez, enfants d’Israël ! Voyez combien peu d’entre vous restent des douze tribus d’Israël. 3 Pourtant, c’est à vous et à vos pères que le Seigneur a donné la Loi, plutôt qu’à toutes les nations. 4 Mais puisque vos frères ont transgressé les commandements du Très-Haut, il a fait venir sur eux ce que vous avez vu. 5 Vous aussi, si vous n’agissez pas avec justice, comme vos frères, 6 le Juste jugera leurs œuvres[a], car il est le Puissant que vous cherchez et le Puissant en qui vous espérez. 7 Il veille à préserver, non à abandonner. 8 N’avez-vous pas vu ce qui est arrivé à Sion ? 9 Pensez-vous que le lieu ait péché et que ce soit pour cela qu’il a été dévasté ? Ou que le pays ait commis quelque faute et que ce soit pour cela qu’il a été livré ? 10 Ne savez-vous pas que, par votre faute, ce qui n’avait pas péché a été détruit et que, à cause de vos actes,
    ce qui n’avait commis aucune faute a été livré ? »


    11 Tout le peuple me répondit : « Nous nous souvenons des témoignages de bonté que le Puissant a accomplis parmi vous, 12 de ceux que nous avons vus comme de ceux que nous n’avons pas vus : l’Oint viendra[b]. 13 Mais maintenant, intercède pour nous auprès de Celui qui est en haut. Écris aussi à nos frères de Babylone une lettre d’instruction et un écrit porteur d’espérance, 14 afin de leur montrer, à eux aussi, ce qui ne t’a pas quitté. 15 Car les conseils d’Israël ont disparu, les lampes qui éclairaient se sont éteintes, et les sources auxquelles nous buvions ont cessé de couler. 16 Nous avons été laissés dans les ténèbres, dans l’épaisseur de la forêt et dans la soif du désert. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte syriaque de cette phrase est difficile; on peut aussi comprendre : « le juste jugera ses propres œuvres » ou « le Juste jugera ses injustices ».'
    reason: Préserver l’incertitude portant sur les pronoms et sur la relation entre justice, jugement et œuvres dans un passage transmis de manière instable.
  - marker: b
    text: 'Littéralement : « le Christ viendra », c’est-à-dire « l’Oint viendra ».'
    reason: Signaler le terme syriaque emprunté au grec tout en gardant dans le texte principal une formulation française transparente.
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Le terme désigne ici la Torah donnée à Israël; la majuscule française signale ce référent covenantal sans ajouter d’explication confessionnelle.
- source_word: ܡܪܝܡܐ
  choice: le Très-Haut
  rationale: Titre divin traditionnel, naturel en français et fidèle à l’idée d’élévation exprimée par le syriaque.
- source_word: ܡܚܣܢܢܐ
  choice: le Puissant
  rationale: Dans ce passage textuellement difficile, le contexte et la couche de contrôle soutiennent un titre divin repris en parallèle; « le Puissant » conserve cette fonction sans développer un attribut absent du texte retenu.
- source_word: ܐܓܪܬܐ ܕܝܘܠܦܢܐ
  choice: une lettre d’instruction
  rationale: Rend à la fois la forme épistolaire et la fonction didactique de l’expression.
- source_word: ܡܕܡ ܕܣܒܪܬܐ
  choice: un écrit porteur d’espérance
  rationale: Formulation naturelle qui conserve l’idée d’un document associé à l’espérance sans préciser indûment sa forme exacte.
- source_word: ܪ̈ܥܘܬܐ
  choice: les conseils
  rationale: La lecture de contrôle vocalisée oriente vers les pensées ou conseils plutôt que vers les bergers; « conseils » s’intègre aussi au groupe métaphorique formé avec les lampes et les sources.
- source_word: ܫܪ̈ܓܐ
  choice: les lampes
  rationale: Conserve l’image concrète du texte plutôt que de la réduire à l’idée abstraite de lumière.
- source_word: ܡܒܘ̈ܥܐ
  choice: les sources
  rationale: Préserve l’image d’une eau vive accessible au peuple; « ont cessé de couler » explicite naturellement le verbe dans ce contexte.
- source_word: ܟܪܝܣܛܘܣ
  choice: l’Oint
  rationale: Rend le titre de manière transparente et non confessionnellement surchargée; le verbe qui suit indique sa venue future.
theological_decisions:
- issue: Responsabilité de Sion et du pays dans leur destruction
  choice: Sion, le lieu et le pays sont présentés comme n’ayant pas péché; la catastrophe est imputée aux actes du peuple.
  alternative: Formuler seulement un jugement général sans affirmer l’innocence du lieu et du pays.
  rationale: Les questions rhétoriques du syriaque opposent explicitement l’innocence du lieu ou du pays à la culpabilité humaine.
- issue: Sens de la déclaration concernant l’Oint
  choice: « l’Oint viendra »
  alternative: « il est l’Oint »
  rationale: Le texte transmis contient ܢܝܬ̣ܐ, un verbe de venue; la traduction conserve donc la valeur future malgré la difficulté du contexte.
- issue: Identité du sujet et de l’objet dans le jugement du v. 6
  choice: « le Juste jugera leurs œuvres »
  alternative: « le juste jugera ses œuvres » ou une reformulation attribuant directement le jugement au Très-Haut.
  rationale: Le passage est textuellement et référentiellement difficile. Le corps du texte garde le titre « le Juste » et rattache prudemment les œuvres aux frères mentionnés, tandis qu’une note signale l’incertitude.
translation_notes:
  register: Français international moderne, digne et accessible. Les périodes sont légèrement réorganisées pour une lecture orale naturelle, sans gommer les répétitions, les questions rhétoriques ni les tensions du texte. « Babylone », « Sion », « la Loi », « le Très-Haut », « le Puissant » et « l’Oint » conservent le registre scripturaire et apocalyptique.
