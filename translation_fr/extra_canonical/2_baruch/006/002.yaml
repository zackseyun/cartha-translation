  yaml_path: translation/extra_canonical/2_baruch/006/002.yaml
  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: fr
  text: Et voici que, soudain, un esprit de puissance me souleva et m’emporta au-dessus de la muraille de Jérusalem. Je vis quatre anges debout aux quatre coins de la ville, chacun tenant dans ses mains une torche enflammée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: un esprit de puissance
  rationale: 'Rend littéralement l’expression syriaque tout en conservant son ambiguïté : il peut s’agir d’un esprit doté de puissance ou d’une force agissant comme un esprit.'
- source_word: ܐܣܬܠܩ ܠܥܠܐ
  choice: me souleva et m’emporta au-dessus
  rationale: Exprime le mouvement ascendant et le transport du voyant dans un français naturel, conformément au contexte visionnaire.
- source_word: ܐܪܒܥܐ ܡܠܐܟ̈ܝܢ
  choice: quatre anges
  rationale: Équivalent direct du syriaque, sans explicitation théologique supplémentaire.
- source_word: ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: aux quatre coins de la ville
  rationale: Reproduit l’image spatiale du texte source dans une formulation française courante.
- source_word: ܠܡܦܝܕܐ
  choice: une torche enflammée
  rationale: « Torche » convient à l’objet porté par chaque ange ; « enflammée » préserve la précision attestée par la tradition textuelle contrôlée, même si l’extrait OCR visible s’interrompt après le nom de l’objet.
theological_decisions:
- issue: Nature de « l’esprit de puissance »
  choice: Maintenir la formulation indéterminée « un esprit de puissance »
  alternative: « l’Esprit puissant » ou « une force spirituelle »
  rationale: Le syriaque ne requiert ni une identification explicite à l’Esprit saint ni une réduction à une simple force impersonnelle.
- issue: Fonction des quatre anges
  choice: Ne pas expliquer leur identité ni leur mission
  alternative: Les qualifier d’anges destructeurs ou gardiens
  rationale: Le verset décrit leur position et ce qu’ils portent sans définir encore leur fonction ; l’ajouter résoudrait indûment la tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » conserve la vivacité visionnaire ; la syntaxe reste accessible sans banaliser le registre apocalyptique.
