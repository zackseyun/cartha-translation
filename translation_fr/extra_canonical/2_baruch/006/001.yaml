base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: fr
  text: Le lendemain, voici que les troupes des Chaldéens encerclèrent la ville. Vers le soir, moi, Baruch, je quittai le peuple, puis je sortis et me tins près du chêne. Je m’affligeais au sujet de Sion et me lamentais sur la captivité qui avait frappé le peuple. Je fus rempli d’un esprit de force et élevé bien au-dessus de la place de Jérusalem. Alors je vis quatre anges qui se tenaient aux quatre coins de la ville, chacun une torche à la main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: Le lendemain
  rationale: Cette expression temporelle courante marque naturellement en français la succession du récit.
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: les troupes des Chaldéens
  rationale: Le témoin de contrôle confirme qu’il s’agit des forces militaires chaldéennes. « Troupes » est naturel et n’impose pas l’idée d’une armée constituée en unité unique.
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: Je m’affligeais ... et me lamentais
  rationale: Les deux expressions rendent à la fois la profonde affliction et sa manifestation dans la lamentation, sans réduire le parallélisme affectif.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: un esprit de force
  rationale: Cette formulation reste proche du syriaque et conserve l’ambiguïté entre une force spirituelle reçue et un esprit qui communique la force, sans introduire une expression théologique figée.
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: la place de Jérusalem
  rationale: Le nom peut désigner une rue ou un espace de marché. « Place » convient à la perspective urbaine de la vision tout en évitant de préciser indûment la fonction commerciale du lieu.
- source_word: ܠܡܦܝܕܐ
  choice: une torche
  rationale: Le contexte visionnaire et la nature ardente de l’objet dans la suite favorisent « torche » plutôt que le plus faible « lampe ».
theological_decisions:
- issue: Nature de l’« esprit de force »
  choice: Maintenir la formulation indéterminée « un esprit de force »
  alternative: « l’Esprit de puissance » ou « une force spirituelle »
  rationale: Le syriaque ne commande ni une identification explicite à l’Esprit saint ni une réduction à un simple état psychologique. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le redoublement des actions est légèrement fluidifié sans supprimer les étapes du récit. « Voici que » conserve le signal visionnaire, tandis que « moi, Baruch » maintient l’insistance du narrateur.
