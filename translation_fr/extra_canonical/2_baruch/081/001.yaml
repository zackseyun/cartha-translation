lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: le Très-Haut
  rationale: Titre divin biblique et apocalyptique courant en français, distinct de celui rendu par « le Puissant ».
- source_word: ܚܝܠܬܐ
  choice: le Puissant
  rationale: Conserve la force du titre divin et évite de le confondre avec « le Très-Haut ».
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  choice: ses compassions / sa grâce
  rationale: Maintient la distinction entre les deux termes syriaques apparentés sans les fondre dans un seul mot français.
- source_word: ܚܘ̈ܘܝ
  choice: visions
  rationale: Convient au contexte apocalyptique et préserve le parallélisme avec la parole révélée.
- source_word: ܫܘܠܡܐ / langage d’achèvement
  choice: accomplissement / exécution complète
  rationale: Garde la portée eschatologique tout en distinguant l’accomplissement préparé de l’achèvement du jugement.
- source_word: comparaison avec le crachat
  choice: tenue pour un crachat
  rationale: Conserve l’image volontairement dépréciative au lieu de l’atténuer.
- source_word: ܩܝ̈ܡܘܗܝ / ܦܘܩܕܢܐ
  choice: commandements
  rationale: Rendu clair et naturel qui conserve l’idée d’obligation envers Dieu.
- source_word: ܡܠܬܐ ... consolation
  choice: une parole de consolation
  rationale: Rend directement la relation de construction indiquée par le syriaque.
theological_decisions:
- issue: Langage de la vengeance divine
  choice: notre Créateur tirera vengeance de tous nos ennemis
  alternative: notre Créateur demandera compte à tous nos ennemis
  rationale: Le choix conserve la sévérité du registre apocalyptique tout en présentant la vengeance comme l’action judiciaire du Créateur.
- issue: Imminence eschatologique
  choice: L’accomplissement ... est proche, sa miséricorde arrive
  alternative: La fin ... est proche
  rationale: Le texte associe l’imminence du jugement à celle de la miséricorde ; « accomplissement » préserve mieux cette tension que le simple mot « fin ».
- issue: Alternance des référents dans les comparaisons finales
  choice: Maintien de l’alternance entre « elles » et les abstractions comme la puissance, la beauté et l’assurance
  alternative: Uniformiser tous les référents en les rapportant explicitement aux nations
  rationale: La formulation source et sa consultation anglaise comportent des glissements de référent ; les expliciter partout résoudrait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible, avec ponctuation contemporaine. Les titres divins restent distincts. Les images abruptes — la goutte, le crachat, la chair en souffrance et la vague — sont conservées plutôt que lissées.
