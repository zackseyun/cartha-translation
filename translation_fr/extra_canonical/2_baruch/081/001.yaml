  source_fidelity: 'Le texte rend fidèlement les principaux mouvements du syriaque tels qu’ils sont attestés et contrôlés par la piste d’audit anglaise : consolation, lamentation sur Sion, miséricorde du Très-Haut, action du Puissant, visions, mystères des temps, jugement des ennemis et séries d’images dépréciatives. Les titres divins distincts, « le Très-Haut » et « le Puissant », sont bien conservés. Une légère révision améliore la correspondance de « because of the multitude of your tribulations » et l’expression française de l’achèvement du jugement.'
  naturalness: Le français est globalement naturel, soutenu et actuel. « Afin que vous soyez consolés à cause de vos nombreuses détresses » est plus direct que « au milieu de », qui modifie légèrement le rapport causal. « L’achèvement de son jugement » est plus idiomatique et plus proche de la formule eschatologique que « l’exécution complète de son jugement ».
  terminology: '« Très-Haut », « Puissant », « compassions », « grâce », « visions », « commandements » et « Créateur » conviennent au registre biblique-apocalyptique. La note a ne doit pas être maintenue : la construction syriaque est rendue directement par « une parole de consolation », et l’alternative proposée n’est pas nécessaire pour préserver une ambiguïté textuelle réelle.'
