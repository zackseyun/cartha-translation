  text: 'But also hear a word of consolation. For I was mourning over Zion, and I sought mercy from the Most High, and I said, “Will these things remain for us until the end? And will these afflictions come upon us at every time?” And the Mighty One acted according to the abundance of his mercies, and he spared according to the greatness of his grace. And he revealed a word to me, that I might be strengthened, and he gave me visions, that I might not again be shaken; and he made known to me the mysteries of the times, and showed me the coming of the ages.


    Therefore, my brothers, I have written to you so that you may be comforted because of the multitude of your tribulations. For know that our Maker will require vengeance from all our enemies for all the evil things they have done against us, and that the consummation which the Most High has prepared is near, and his mercy is coming, and the completion of his judgment is not far away.


    For now we see the abundance of the prosperity of the nations while they act wickedly, but they will be reckoned like a drop. And we look at the strength of their power, but it will be accounted as spittle. We think on the glory of their greatness, while they do not keep the commandments of the Mighty One, but have treated them with contempt. And we think on the beauty that is seen, though it is shaken in afflictions, and they will be sought out like flesh in pain. And we reckon only the confidence in which they trust, though it is shaken before our eyes; but they will be crushed like a wave. And we seek only the hope of their strength, when it flourishes in the good things that God gave them; but it will be laid away, and lamentation will overtake it.'
translation:
  language: fr
  text: 'Mais écoutez aussi une parole de consolation. Car je pleurais sur Sion ; j’ai imploré la miséricorde du Très-Haut et j’ai dit : « Ces choses subsisteront-elles pour nous jusqu’à la fin ? Et ces détresses s’abattront-elles sur nous en tout temps ? » Alors le Puissant a agi selon l’abondance de ses compassions et il nous a épargnés selon la grandeur de sa grâce. Il m’a révélé une parole pour que je sois fortifié, et il m’a donné des visions pour que je ne sois plus ébranlé. Il m’a aussi fait connaître les mystères des temps et m’a montré la venue des âges.


    C’est pourquoi, mes frères, je vous ai écrit afin que vous soyez consolés à cause de vos nombreuses détresses. Sachez que notre Créateur tirera vengeance de tous nos ennemis pour tout le mal qu’ils nous ont fait. L’accomplissement que le Très-Haut a préparé est proche, sa miséricorde arrive, et l’achèvement de son jugement n’est pas éloigné.


    Nous voyons maintenant l’immense prospérité des nations tandis qu’elles font le mal, mais elles seront comptées pour une simple goutte. Nous regardons la force de leur puissance, mais elle sera tenue pour un crachat. Nous considérons la gloire de leur grandeur, alors qu’elles ne gardent pas les commandements du Puissant, mais les traitent avec mépris. Nous considérons la beauté qui se donne à voir, bien qu’elle soit ébranlée dans les détresses ; mais elles seront recherchées comme une chair en souffrance. Nous ne tenons compte que de l’assurance dans laquelle elles mettent leur confiance, bien qu’elle soit ébranlée sous nos yeux ; mais elles seront brisées comme une vague. Nous ne recherchons que l’espoir qu’elles placent dans leur force, quand elle s’épanouit grâce aux biens que Dieu leur a donnés ; mais elle sera mise de côté, et les lamentations la rattraperont.'
