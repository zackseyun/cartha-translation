  text: Car les maux et les biens qui doivent arriver se tiennent devant lui comme une seule mémoire établie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ (bīšātā ... w-ṭābātā)
  choice: les maux et les biens
  rationale: Rend directement les deux pluriels abstraits opposés, sans réduire les termes à de simples « événements ».
- source_word: ܥܬܝܕܝܢ ... ܕܢܗܘܘܢ (ʿtīdīn ... d-nehwōn)
  choice: qui doivent arriver
  rationale: La construction exprime ce qui est futur ou destiné à se produire. « Arriver » est idiomatique en français pour des maux et des biens, tandis que la note conserve l'autre valeur possible.
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ (qdāmōhy qāymān)
  choice: se tiennent devant lui
  rationale: Conserve l'image spatiale et le présent du syriaque, plutôt que de l'aplatir en « il connaît ».
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ (ḥdā dukhrānhōn šrā)
  choice: comme un souvenir unique et fermement établi
  rationale: Reproduit l'idée d'un souvenir unifié et fixé, dans un français naturel et digne.
theological_decisions:
- issue: Connaissance divine du futur
  choice: Conserver l'image selon laquelle les réalités futures « se tiennent devant lui »
  alternative: 'Expliciter : « il connaît déjà tous les maux et tous les biens futurs »'
  rationale: Le texte suggère la connaissance divine, mais l'explicitation supprimerait sa métaphore et renforcerait indûment une formulation doctrinale absente du syriaque.
- issue: Portée de « devant lui »
  choice: 'Rattacher l''expression au verbe principal : « se tiennent devant lui »'
  alternative: 'La rattacher à la proposition relative : « qui doivent être devant lui se tiennent… »'
  rationale: Ce rattachement donne la syntaxe la plus cohérente, tout en signalant l'autre analyse possible dans une note.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition imagée du syriaque est conservée sans explicitation confessionnelle; « fermement établi » évite l'étrangeté de « souvenir fixé ».
