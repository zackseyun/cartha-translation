  yaml_path: translation/extra_canonical/2_baruch/069/004.yaml
  text: and the ends of the times of the righteous, which were going to be accomplished before him, stand as one fixed remembrance, besides those things that he is going to do at the consummation of the age.
translation:
  language: fr
  text: Et les fins des temps des justes, qui devaient s’accomplir devant lui, sont présentes devant lui comme un seul souvenir permanent, en plus de ce qu’il fera à l’achèvement de l’âge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’achèvement du monde ». Le mot syriaque peut désigner un âge aussi bien que le monde.'
    reason: Signaler l’ambiguïté réelle de ܥܠܡܐ dans cette formule eschatologique, sans imposer une lecture cosmique ou purement temporelle.
lexical_decisions:
- source_word: ܕܘܟܪܢܗܘܢ
  choice: souvenir
  rationale: Rend le nom syriaque lié à la mémoire ou au rappel, sans préciser davantage la manière dont ce souvenir subsiste devant Dieu.
- source_word: ܫܘܠܡܗ
  choice: achèvement
  rationale: Exprime l’idée d’aboutissement ou de consommation, dans un français actuel et digne.
- source_word: ܥܠܡܐ
  choice: ère
  rationale: Dans cette expression eschatologique, « ère » conserve le sens temporel probable tout en évitant que « monde » ne suggère nécessairement la destruction du cosmos.
- source_word: ܩܿܝܡ … ܫܪܐ
  choice: demeurent comme un unique souvenir établi
  rationale: Conserve ensemble les idées de permanence, d’unité et de stabilité présentes dans la formulation syriaque, malgré l’état difficile du texte transmis.
theological_decisions:
- issue: Portée de « l’achèvement de l’ère »
  choice: Ne pas expliciter en destruction du monde ni en seul changement historique
  alternative: « à la fin du monde »
  rationale: Le syriaque ܥܠܡܐ peut désigner le monde ou l’âge présent; la traduction maintient cette tension eschatologique sans imposer une lecture doctrinale.
- issue: Rapport entre l’accomplissement et la présence devant Dieu
  choice: « qui devaient s’accomplir devant lui »
  alternative: « qui lui étaient connus d’avance »
  rationale: La traduction préserve la syntaxe et l’image de réalités se tenant ou s’accomplissant devant Dieu, sans transformer explicitement l’énoncé en doctrine de prescience.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure conserve la densité et l’ambiguïté du texte syriaque; « en plus de » rend l’addition sans définir précisément le rapport entre le souvenir établi et les actes futurs de Dieu.
