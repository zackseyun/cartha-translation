  verdict: revise
  source_fidelity: Le verset syriaque traditionnellement attesté pour 2 Baruch 83:1 présente deux actions parallèles du Très-Haut, relatives à « ses temps » et « ses heures », avec une forte modalité d’assurance. Le texte français conserve ces éléments sans expliciter indûment la nature du calendrier divin. Le dossier de pages joint paraît relever d’un chevauchement de contexte et ne donne pas lisiblement ce court verset; le contrôle par la formulation anglaise est donc secondaire et concordant.
  naturalness: « Fera certainement venir » est compréhensible, mais l’adverbe entre l’auxiliaire lexical et l’infinitif alourdit légèrement la cadence. « Fera assurément venir » offre un parallélisme plus net avec « hâtera assurément » et un registre solennel naturel.
  terminology: « Le Très-Haut » est un équivalent français établi et approprié du titre divin sémitique. « Ses temps » et « ses heures » préservent le parallélisme et l’ambiguïté du texte; aucune note n’est nécessaire.
