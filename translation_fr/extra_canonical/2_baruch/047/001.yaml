  text: And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”
translation:
  language: fr
  text: 'Après être sorti et les avoir congédiés, je partis de là et leur dis : « Voici, je vais à ma demeure, à Hébron. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܘ ܐܢܘܢ
  choice: les avoir congédiés
  rationale: Le verbe exprime ici l’idée de laisser aller ou de renvoyer. « Congédier » convient à la transition formelle après l’assemblée.
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: à ma demeure, à Hébron
  rationale: La traduction conserve le nom désignant la demeure avant le toponyme ainsi que la reprise de la préposition en syriaque. La virgule garde une légère ambiguïté entre destination et localisation sans alourdir le français.
- source_word: ܗܐ
  choice: Voici
  rationale: Cette particule attire solennellement l’attention sur l’annonce qui suit ; « Voici » en restitue le ton de manière concise et digne.
