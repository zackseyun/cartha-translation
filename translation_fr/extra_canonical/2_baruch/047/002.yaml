  text: And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.
translation:
  language: fr
  text: Ensuite, mes compagnons me quittèrent. Je me rendis auprès du cèdre où il m’avait parlé. Je m’assis là et je jeûnai pendant sept jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܒܪܐ
  choice: mes compagnons
  rationale: Le nom collectif désigne ici les personnes qui accompagnaient Baruch; le pluriel français rend naturellement ce sens.
- source_word: ܐܪܙܐ
  choice: le cèdre
  rationale: Traduction directe du terme syriaque désignant le cèdre, arbre déjà identifié dans le récit.
- source_word: ܨܡ̇ܬ
  choice: je jeûnai
  rationale: Rend directement l’action de jeûner, sans préciser de modalités absentes du texte.
theological_decisions:
- issue: Identité du sujet de « il m’avait parlé »
  choice: Maintien du pronom « il »
  alternative: Expliciter « Dieu » ou « le Très-Puissant »
  rationale: Le syriaque emploie une forme verbale à la troisième personne sans nommer ici le locuteur; conserver le pronom préserve la référence contextuelle et évite une explicitation interprétative.
translation_notes:
  register: Français moderne, clair et digne. La succession des trois phrases conserve la progression narrative du syriaque tout en évitant une coordination trop lourde.
