base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: fr
  text: Ainsi donc, lorsque vous recevrez la lettre, lisez-la dans le calme dans vos assemblées. Prêtez une attention toute particulière à ses paroles les jours des semaines[a], afin de vous en souvenir et d’être redressés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les jours des semaines ». La formulation syriaque est inhabituelle et son sens précis demeure incertain.'
    reason: La tournure transmise est difficile et pourrait recevoir des interprétations plus fluides, comme une référence aux jours de semaine ou à certains jours d’observance, mais celles-ci ne sont pas certaines.
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: avec soin
  rationale: Le terme peut évoquer le calme, le loisir ou une attention sans précipitation. « Avec soin » exprime ici une lecture publique attentive sans renforcer indûment l’idée d’effort soutenu.
- source_word: ܬܬܗܪܘܢ … ܝܬܝܪܐܝܬ
  choice: prêtez une attention toute particulière
  rationale: Le verbe appelle à considérer ou à prendre garde, tandis que l’adverbe marque un degré accru. Cette tournure restitue naturellement les deux éléments en français.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: les jours des semaines
  rationale: La formulation syriaque transmise associe littéralement les « jours » aux « semaines ». Malgré son caractère inhabituel, elle est conservée afin de ne pas introduire une référence conjecturale aux jours de jeûne ou aux jours ouvrables.
- source_word: ܬܬܥܗܕܘܢ
  choice: vous en souvenir
  rationale: Le verbe signifie naturellement se rappeler ou garder à l’esprit. Le pronom « en » renvoie aux paroles de la lettre.
- source_word: ܬܬܪܨܘܢ
  choice: être remis dans le droit chemin
  rationale: La forme exprime l’idée d’être redressé, rectifié ou corrigé. Cette expression française conserve l’image morale du redressement sans réduire le sens à une simple instruction.
theological_decisions:
- issue: Faut-il transformer l’exhortation en langage liturgique familier ?
  choice: Conserver une exhortation sobre à la lecture communautaire, au souvenir et au redressement
  alternative: Paraphraser le passage comme une lecture pratiquée les jours de jeûne ou comme un appel général à la méditation
  rationale: Le syriaque met l’accent sur la réception et la lecture communautaire de la lettre ainsi que sur son effet moral. Rien ne justifie d’y importer une pratique liturgique plus précise.
- issue: Rapport entre l’attention portée aux paroles et les deux verbes finaux
  choice: Rendre le rapport final par « afin de »
  alternative: 'Juxtaposer quatre exhortations indépendantes : lire, prêter attention, se souvenir et être remis dans le droit chemin'
  rationale: Le contexte permet de comprendre le souvenir et le redressement comme le but ou le résultat de l’attention portée aux paroles. « Afin de » rend ce lien naturellement, sans modifier le contenu des deux verbes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant la formulation temporelle inhabituelle du syriaque et la nuance morale de « redresser ».
