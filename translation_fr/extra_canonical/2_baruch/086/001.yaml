revisions:
- from: Ainsi donc, lorsque vous recevrez la lettre, lisez-la avec soin dans vos assemblées. Prêtez une attention toute particulière à ses paroles les jours des semaines[a], afin de vous en souvenir et d’être remis dans le droit chemin.
  to: Ainsi donc, lorsque vous recevrez la lettre, lisez-la dans le calme dans vos assemblées. Prêtez une attention toute particulière à ses paroles les jours des semaines[a], afin de vous en souvenir et d’être redressés.
  rationale: La révision resserre deux rendus lexicaux. « Dans le calme » garde la nuance de lecture sans précipitation de ܒܒܛܝܠܘܬܐ; « être redressés » rend ܬܬܪܨܘܢ sans ajouter l’image d’un chemin. La formulation temporelle incertaine et sa note sont conservées, sans importer une pratique liturgique conjecturale.
