  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: fr
  text: 'Il me répondit : « Puisque tu as prié pour que je te montre ce qui t’arrivera après ces choses, je t’ai montré cette vision[a], afin que tu voies ce qui t’arrivera après ces choses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette révélation ».'
    reason: Le terme syriaque peut désigner une révélation ou, dans ce contexte, la vision par laquelle elle est communiquée.
lexical_decisions:
- source_word: ܓܠܝܢܐ
  choice: révélation
  rationale: Le terme désigne ce qui est dévoilé ou rendu manifeste. « Révélation » convient au contexte apocalyptique tout en laissant la note signaler le sens possible de « vision ».
- source_word: ܢܓܕܫ
  choice: arrivera
  rationale: Le verbe exprime ce qui se produira ou adviendra à Baruch. « Ce qui t’arrivera » est naturel en français et conserve la portée personnelle de la prédiction.
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: après ces choses
  rationale: Cette formulation garde le renvoi démonstratif et la succession temporelle sans préciser indûment les événements concernés.
theological_decisions:
- issue: Nature de ce qui est montré à Baruch
  choice: « cette révélation »
  alternative: « cette vision »
  rationale: Le mot peut désigner soit l’acte de dévoilement, soit son contenu visionnaire. Le texte principal retient le terme apocalyptique large et la note préserve l’autre lecture.
- issue: Contenu de la demande de Baruch
  choice: « ce qui t’arrivera »
  alternative: « ce qui se produira pour toi »
  rationale: La traduction conserve la référence personnelle à l’avenir de Baruch sans préciser la manière dont ces événements se réaliseront.
translation_notes:
  register: Français international moderne, simple et digne. « Il me répondit » évite le calque lourd « il répondit et me dit », tandis que la répétition finale du contenu annoncé est maintenue parce qu’elle structure le verset.
