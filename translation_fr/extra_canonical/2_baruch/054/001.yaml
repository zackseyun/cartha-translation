  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: fr
  text: Ô toi qui as créé la terre, écoute-moi, toi qui as établi le firmament par la parole et affermi la hauteur des cieux par l’esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot syriaque peut signifier « esprit » ou « souffle » ; le parallèle avec « parole » rappelle le Psaume 33.6.
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܒܪܐ
  choice: qui as créé
  rationale: Le verbe syriaque exprime ici l’acte de créer; la tournure relative conserve l’invocation adressée à Dieu.
- source_word: ܬܩܢܬ
  choice: as établi
  rationale: Le verbe désigne la mise en ordre et l’établissement ferme du firmament.
- source_word: ܪܩܝܥܐ
  choice: le firmament
  rationale: Ce terme traditionnel rend précisément l’étendue céleste dans le langage biblique tout en restant intelligible en français moderne.
- source_word: ܒܡܠܬܐ
  choice: par la parole
  rationale: La préposition marque le moyen ou l’agent de l’action créatrice; « parole » rend naturellement ܡܠܬܐ et préserve le parallèle avec ܪܘܚܐ.
- source_word: ܘܫܪܪܬ
  choice: et affermi
  rationale: Le verbe exprime l’idée de rendre ferme, solide ou stable.
- source_word: ܪܘܚܐ
  choice: l’Esprit
  rationale: ܪܘܚܐ peut signifier « esprit » ou « souffle ». « Esprit » convient au registre théologique du passage, tandis qu’une note conserve l’ambiguïté lexicale et le parallèle poétique avec « parole ».
theological_decisions:
- issue: Sens de ܪܘܚܐ dans l’action créatrice
  choice: l’Esprit
  alternative: le souffle
  rationale: La traduction principale retient la désignation théologique courante de l’action créatrice divine, sans exclure le sens concret de « souffle », signalé en note. La majuscule indique ici une référence possible à l’Esprit de Dieu, mais l’ambiguïté du syriaque demeure explicitement ouverte.
translation_notes:
  register: Français moderne, digne et oralement fluide. La reprise « toi qui » évite qu’une proposition relative paraisse se rattacher à « moi ». « Firmament » maintient l’imagerie cosmologique biblique, et « la hauteur des cieux » conserve le singulier abstrait du syriaque.
