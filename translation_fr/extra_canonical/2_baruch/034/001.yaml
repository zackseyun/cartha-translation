revisions:
- from: 'Alors je levai les yeux et je pleurai. En ce temps-là, je dis : « Loin de moi l’idée de garder le silence envers vous ou d’oublier l’un de vous ! Mais vous, allez seulement jusqu’à la demeure funéraire, aux tombeaux de mes pères, et, dans l’affliction et l’angoisse des lamentations, poussez de grands cris, afin que vous ne m’oubliiez ni maintenant ni par la suite.[a] Quant à ces paroles, je vous les ai dites pour que vous vous en souveniez. »'
  to: 'Alors je levai les yeux et je pleurai. En ce temps-là, je dis : « Loin de moi l’idée de garder le silence envers vous ou de vous oublier ! Mais vous seuls, allez jusqu’à la demeure des sépultures de mes pères et, dans l’affliction et l’angoisse des lamentations, poussez de grands cris, afin que je ne sois pas oublié devant vous ni par la suite.[a] Je vous ai dit ces choses pour votre souvenir. »'
  rationale: La révision enlève une particularisation non exigée par le syriaque, préserve la formulation passive et ambiguë de la demande de ne pas être oublié, et améliore la syntaxe française du groupe funéraire. Elle maintient le registre solennel, l'impératif de lamentation et le vocabulaire de la mémoire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:28Z'
review_pass:
  verdict: revise
  source_fidelity: La première affirmation rend correctement l'idiome ܚܣ ܠܝ comme un rejet énergique. Toutefois, « d’oublier l’un de vous » particularise indûment le complément pluriel ; le syriaque permet et appelle plus simplement « vous oublier ». La dernière proposition doit également conserver la voix passive et l'ambiguïté de ܩܕܡ ܐܢܬܘܢ ܘܡܢ ܒܬܪ, plutôt que de l'interpréter comme « ni maintenant ni par la suite ».
  naturalness: Le français est globalement moderne et digne. « Demeure funéraire, aux tombeaux » reste cependant une juxtaposition peu naturelle. « Demeure des sépultures de mes pères » rend le redoublement funéraire sans cette rupture syntaxique. La littéralité inhabituelle de « devant vous ni par la suite » est justifiée ici par une note, car elle préserve une difficulté réelle du texte.
  terminology: « Affliction », « angoisse des lamentations » et « pousser des cris » représentent bien l'accumulation de douleur et l'impératif pluriel. « Souvenir » convient pour ܥܘܗܕܢܘܢ sans introduire de sens cultuel ou doctrinal.
  issues:
  - severity: medium
    issue: « d’oublier l’un de vous »
    rationale: Le tour ܕܐܢܫܝܢ ܡܢܟܘܢ ne requiert pas l'individualisation « l'un de vous ». Celle-ci peut suggérer qu'un seul membre du groupe est visé, alors que « vous oublier » conserve la portée collective du texte.
  - severity: medium
    issue: « afin que vous ne m’oubliiez ni maintenant ni par la suite »
    rationale: Cette formulation convertit la voix passive syriaque et interprète ܩܕܡ ܐܢܬܘܢ (« devant vous ») comme un adverbe temporel (« maintenant »). L'expression demeure difficile ; il est préférable de la maintenir dans le texte et de l'expliquer en note.
  - severity: low
    issue: « demeure funéraire, aux tombeaux »
    rationale: La double désignation est source-fidèle, mais la ponctuation appositive rend la construction française heurtée. Une formulation génitive conserve l'image tout en étant plus lisible.
