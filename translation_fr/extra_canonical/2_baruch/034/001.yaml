  yaml_path: translation/extra_canonical/2_baruch/034/001.yaml
  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: fr
  text: 'Alors je levai les yeux et je pleurai. En ce temps-là, je dis : « Loin de moi l’idée de garder le silence envers vous ou de vous oublier ! Mais vous seuls, allez jusqu’à la demeure des sépultures de mes pères et, dans l’affliction et l’angoisse des lamentations, poussez de grands cris, afin que je ne sois pas oublié devant vous ni par la suite.[a] Je vous ai dit ces choses pour votre souvenir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le syriaque est abrupt : littéralement, « afin que je ne sois pas oublié devant vous et après ». La relation exacte de « devant vous » et de « après » demeure incertaine.'
    reason: Préserve l'ambiguïté syntaxique et temporelle du syriaque sans la résoudre dans la traduction.
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: Loin de moi l’idée de
  rationale: Cette locution idiomatique exprime un rejet énergique, et non une demande de compassion.
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: de garder le silence envers vous
  rationale: Cette formulation conserve le sens fondamental du verbe « se taire » ainsi que son orientation interpersonnelle.
- source_word: ܕܐܢܫܝܢ ܡܢܟܘܢ
  choice: d’oublier l’un de vous
  rationale: Le tour partitif ܡܢܟܘܢ, « parmi vous », indique naturellement « l’un de vous » plutôt qu’un simple pronom collectif.
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: jusqu’à la demeure funéraire, aux tombeaux de mes pères
  rationale: Le rendu garde le redoublement concret du vocabulaire funéraire tout en restant intelligible en français moderne.
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: dans l’affliction et l’angoisse des lamentations, poussez de grands cris
  rationale: La traduction maintient l’accumulation des termes de douleur et l’impératif pluriel, sans réduire la phrase à un simple verbe de lamentation.
- source_word: ܕܠܐ ܐܬܢܫܝܬ
  choice: afin que vous ne m’oubliiez
  rationale: La forme syriaque est comprise comme un passif à valeur relationnelle, littéralement « afin que je ne sois pas oublié devant/par vous » ; le français actif est plus naturel et conserve le sens.
- source_word: ܥܘܗܕܢܘܢ
  choice: pour que vous vous en souveniez
  rationale: Le champ lexical est celui du souvenir ou du mémorial ; cette formulation française est claire sans imposer une nuance cultuelle.
theological_decisions:
- issue: Portée temporelle de ܩܕܡ ܐܢܬܘܢ ܘܡܢ ܒܬܪ
  choice: ni maintenant ni par la suite
  alternative: devant vous et après
  rationale: Le syriaque est abrupt et peut se lire très littéralement « devant vous et après ». Le rendu temporel donne une phrase française cohérente tout en signalant l’incertitude en note, sans tirer de conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de la lamentation est conservé, notamment par l’accumulation « affliction », « angoisse » et « lamentations ». Les formulations archaïques ont été évitées, sauf la tournure encore courante et solennelle « Loin de moi l’idée de ».
