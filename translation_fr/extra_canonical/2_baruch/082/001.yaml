  yaml_path: translation/extra_canonical/2_baruch/082/001.yaml
  text: 'For now we see the abundance of the prosperity of the nations while they act wickedly, but they are compared to a drop. We look on the force of their power, but they will be reckoned as spittle. We consider the glory of their greatness, though they do not keep the commandments of the Mighty One, but have treated them with contempt. And we consider the beauty that is seen, though it is shaken in afflictions; but they will be sought out like flesh in pain. We think on the confidence in which they trust, though before our eyes it is shaken; but they will be crushed like a wave. And we seek only the hope of their strength, though it flourishes in the good things God gave them; but it will be laid away, and lamentation will come upon it.


    For the Most High is indeed hastening his times and bringing near his hours. He will judge those who oppress, and the heraldings of the age will go forth. The hidden things of all their sins will be revealed, and the quiet thoughts of what is right will spring forth. Those who now think they can escape will not be able to save themselves, nor will anyone make a covenant with famine by abundance of food. The humble will not place their hope in prosperity; rather, their heart rejoices in those things that endure. Instead, they will hope all the more because that fearsome end has arrived. They will not look on the delights of the present age, and they will know only that they are being brought to the end. But the consummation of the world will show the great strength of his governance, when everything enters what is inward and returns to what from the beginning had been appointed. Then it will be seen that what has been found was not established by men, but has truly reached its completion.


    For whatever stood, or was made, or came in conflict and passed away, shows this: evil is not forever evil, and good is not forever good. Every health is turned into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into burdened old age. All the beauty you saw turns into darkness and corruption, and every ruin you made turns into peace and pleasantness. Every darkness that had been given turns into the light of truth. Every error and weakness turns into the lowliness of stillness. Every vengeance and wrath turns into rest and strength. And every voice of the wakeful turns into dust-born silence.


    And no possession will again be a return to death for those who seek it. Those who snatch wages will no longer bring forth death before its time, and the death that is the wage of sufferings will be taken away. There will no longer be any occasion of joy merely for delight. The realm of change will be turned into accomplished conflict, and the sound of sinners in Sheol will no longer be heard.


    So when all these things happen, do you think they will not be required from the inhabitants of the earth on one day? If then their own disclosures show that they live, their guilt itself teaches the falsehood that is in them. I have set down its full measure, because they were begotten from falsehood before I die. And I said that they were putting their trust in evil.'
translation:
  language: fr
  text: 'Car, à présent, nous voyons l’abondance de la prospérité des nations tandis qu’elles font le mal, mais elles sont comparées à une goutte. Nous contemplons la force de leur puissance, mais elles seront tenues pour un crachat. Nous considérons la gloire de leur grandeur, bien qu’elles ne gardent pas les commandements du Puissant et les aient traités avec mépris. Nous considérons aussi la beauté qui se donne à voir, bien qu’elle soit ébranlée par les détresses ; mais ces nations seront recherchées comme une chair en proie à la douleur. Nous pensons à l’assurance dans laquelle elles mettent leur confiance, bien que, sous nos yeux, elle soit ébranlée ; mais elles seront broyées comme une vague. Et nous ne recherchons que l’espoir qu’elles placent dans leur force, bien que celle-ci s’épanouisse grâce aux biens que Dieu leur a donnés ; mais cet espoir sera mis à l’écart, et l’on se lamentera sur lui.


    Car le Très-Haut hâte vraiment ses temps et fait approcher ses heures. Il jugera ceux qui oppriment, et les proclamations du siècle retentiront. Tout ce que cachent leurs péchés sera révélé, et les pensées paisibles de ce qui est juste jailliront. Ceux qui pensent maintenant pouvoir échapper ne pourront pas se sauver eux-mêmes, et personne ne conclura d’alliance avec la famine grâce à une abondance de nourriture. Les humbles ne placeront pas leur espoir dans la prospérité ; leur cœur se réjouit plutôt de ce qui demeure. Ils espéreront d’autant plus que cette fin redoutable est arrivée. Ils ne regarderont pas les plaisirs du siècle présent et sauront seulement qu’on les conduit vers la fin. Mais l’achèvement du monde manifestera la grande puissance de son gouvernement, quand toute chose entrera dans ce qui est intérieur[a] et reviendra à ce qui avait été fixé dès le commencement. Alors on verra que ce qui a été trouvé n’a pas été établi par des êtres humains, mais est véritablement parvenu
    à son accomplissement.


    Car tout ce qui s’est tenu debout, a été fait, est entré en conflit puis a disparu montre ceci : le mal ne reste pas toujours mal, ni le bien toujours bien. Toute santé se change en maladie, toute force en faiblesse, toute beauté en difformité, et tout l’éclat de la jeunesse en une vieillesse accablante. Toute la beauté que vous avez vue se change en ténèbres et se corrompt, tandis que toute ruine que vous avez causée se change en paix et en douceur. Toutes les ténèbres qui avaient été données se changent en lumière de la vérité. Toute erreur et toute faiblesse se changent en humble tranquillité. Toute vengeance et toute colère se changent en repos et en force. Et toute parole des vigilants se change en silence né de la poussière.[b]


    Aucun bien possédé ne ramènera plus à la mort ceux qui le recherchent. Ceux qui arrachent un salaire ne feront plus venir la mort avant son temps, et la mort qui est le salaire des souffrances sera enlevée. Il n’y aura plus aucune occasion de joie qui ne serve qu’au plaisir. Le domaine de ce qui change sera transformé en un combat mené à son terme, et la voix des pécheurs ne se fera plus entendre dans le Shéol.


    Ainsi, lorsque toutes ces choses arriveront, penses-tu que, en un seul jour, on ne demandera pas compte de tout cela aux habitants de la terre ? Si donc leurs propres révélations montrent qu’ils vivent, leur culpabilité même fait connaître le mensonge qui est en eux. J’en ai exposé la pleine mesure, parce qu’ils ont été engendrés par le mensonge avant que je meure. Et j’ai dit qu’ils mettaient leur confiance dans le mal.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression syriaque difficile ; on pourrait aussi comprendre : « quand toute chose rentrera en elle-même ».'
    reason: La formulation du témoin est obscure et peut décrire soit une intériorisation, soit un retour à l’état profond ou originel.
  - marker: b
    text: Littéralement, le dernier membre est textuellement difficile ; il associe la parole des « vigilants » à la poussière et au silence.
    reason: Le texte transmis est instable, et une traduction plus fluide risquerait d’effacer ses images distinctes.
  - marker: c
    text: Le manuscrit fait ensuite apparaître « Moïse », vraisemblablement comme mot d’appel ou début de la phrase suivante ; il n’est donc pas rattaché grammaticalement à cette phrase.
    reason: Signale le mot liminaire du passage suivant sans produire en français un nom propre isolé et trompeur.
lexical_decisions:
- source_word: ܡܣܪܗܒ
  choice: hâte vraiment
  rationale: Conserve l’action présente et énergique par laquelle le Très-Haut accélère le calendrier eschatologique.
- source_word: ܟܘܪ̈ܙܐ ܕܥܠܡܐ
  choice: les proclamations de l’ère
  rationale: Préserve l’image d’annonces publiques et la portée apocalyptique de ܥܠܡܐ sans réduire l’expression à de simples « signes ».
- source_word: ܩܨܐ
  choice: fin
  rationale: Rend simplement la limite finale redoutée ; « achèvement » est employé ensuite lorsque la perspective devient cosmique.
- source_word: ܚܘܠܡ̈ܢܐ
  choice: santé
  rationale: Maintient le caractère concret du contraste entre intégrité corporelle et maladie.
- source_word: ܕܘ̈ܓܐ
  choice: difformité
  rationale: Restitue le renversement marqué de la beauté en une réalité défigurée.
- source_word: ܢܗܝܪܘܬܐ ܕܫܪܪܐ
  choice: lumière de la vérité
  rationale: Conserve à la fois l’image lumineuse et la portée morale et cognitive de ܫܪܪܐ.
- source_word: ܡܘܩܣܢ
  choice: colère
  rationale: Français naturel et soutenu dans le couple formé avec la vengeance, sans accentuer indûment le terme.
- source_word: ܫܝܘܠ
  choice: Shéol
  rationale: Garde la référence ancienne au séjour des morts sans lui imposer la notion doctrinale plus tardive d’enfer.
- source_word: ܢܘܛܦܬܐ / ܪܘܩܩܐ
  choice: une goutte / un crachat
  rationale: Respecte les deux images concrètes et distinctes du texte syriaque, conformément au contrôle lexical.
- source_word: ܚܕ̣ܐ
  choice: se réjouit
  rationale: Le mot relève de la racine exprimant la joie, et non du numéral signifiant « un ».
theological_decisions:
- issue: Titres divins
  choice: Distinguer « le Très-Haut » du « Puissant »
  alternative: Uniformiser les deux titres sous une seule désignation
  rationale: La distinction préserve la variété rhétorique des titres syriaques sans leur attribuer une différence doctrinale artificielle.
- issue: Catalogue des renversements
  choice: Le traduire dans son cadre de transformation apocalyptique finale
  alternative: Le comprendre seulement comme une réflexion sapientielle sur l’instabilité de la vie
  rationale: Le jugement, l’achèvement du monde et le Shéol inscrivent la série dans une perspective eschatologique, tout en laissant subsister ses formulations paradoxales.
- issue: ܫܝܘܠ
  choice: Conserver « Shéol »
  alternative: Traduire par « enfer » ou « séjour des morts »
  rationale: « Shéol » évite de préciser au-delà du syriaque la condition ou la destination des morts.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions, parallélismes et paradoxes apocalyptiques ont été conservés autant que possible. Les endroits textuellement obscurs restent légèrement rugueux plutôt que d’être résolus par une paraphrase confessionnelle.
