- from: 'Car, à présent, nous voyons l’abondance de la prospérité des nations tandis qu’elles font le mal, mais elles sont comparées à une goutte. Nous contemplons la force de leur puissance, mais elles seront tenues pour un crachat. Nous considérons la gloire de leur grandeur, bien qu’elles ne gardent pas les commandements du Puissant et les aient traités avec mépris. Nous considérons aussi la beauté qui se donne à voir, bien qu’elle soit ébranlée par les détresses ; mais elles seront recherchées comme une chair en proie à la douleur. Nous pensons à l’assurance dans laquelle elles mettent leur confiance, bien que, sous nos yeux, elle soit ébranlée ; mais elles seront broyées comme une vague. Et nous ne recherchons que l’espoir qu’elles placent dans leur force, bien que celle-ci s’épanouisse grâce aux biens que Dieu leur a donnés ; mais elle sera mise à l’écart, et l’on se lamentera sur elle.


    Car le Très-Haut hâte vraiment ses temps et fait approcher ses heures. Il jugera ceux qui oppriment, et les proclamations de l’ère retentiront. Tout ce que cachent leurs péchés sera révélé, et les pensées paisibles de ce qui est juste jailliront. Ceux qui pensent maintenant pouvoir échapper ne pourront pas se sauver eux-mêmes, et personne ne conclura d’alliance avec la famine grâce à une abondance de nourriture. Les humbles ne placeront pas leur espoir dans la prospérité ; leur cœur se réjouit plutôt de ce qui demeure. Ils espéreront d’autant plus que cette fin redoutable est arrivée. Ils ne regarderont pas les plaisirs de l’ère présente et sauront seulement qu’on les conduit vers la fin. Mais l’achèvement du monde manifestera la grande puissance de son gouvernement, quand toute chose entrera dans ce qui est intérieur[a] et reviendra à ce qui avait été fixé dès le commencement. Alors on verra que ce qui a été trouvé n’a pas été établi par des êtres humains, mais est véritablement parvenu
    à son accomplissement.


    Car tout ce qui s’est tenu debout, a été fait, est entré en conflit puis a disparu montre ceci : le mal ne reste pas toujours mal, ni le bien toujours bien. Toute santé se change en maladie, toute force en faiblesse, toute beauté en difformité, et tout l’éclat de la jeunesse en une vieillesse accablante. Toute la beauté que vous avez vue se change en ténèbres et se corrompt, tandis que toute ruine que vous avez causée se change en paix et en douceur. Toutes les ténèbres qui avaient été données se changent en lumière de la vérité. Toute erreur et toute faiblesse se changent en humble tranquillité. Toute vengeance et toute colère se changent en repos et en force. Et toute parole des vigilants se change en silence né de la poussière.[b]


    Aucun bien possédé ne ramènera plus à la mort ceux qui le recherchent. Ceux qui arrachent un salaire ne feront plus venir la mort avant son temps, et la mort qui est le salaire des souffrances sera enlevée. Il n’y aura plus aucune occasion de joie qui ne serve qu’au plaisir. Le domaine de ce qui change sera transformé en un combat mené à son terme, et la voix des pécheurs ne se fera plus entendre dans le Shéol.


    Ainsi, lorsque toutes ces choses arriveront, penses-tu qu’en un seul jour aucun compte n’en sera demandé aux habitants de la terre ? Si donc leurs propres révélations montrent qu’ils vivent, leur culpabilité même fait connaître le mensonge qui est en eux. J’en ai exposé la pleine mesure, parce qu’ils ont été engendrés par le mensonge avant que je meure. Et j’ai dit qu’ils mettaient leur confiance dans le mal.[c]'
