review_pass:
  verdict: revise
  source_fidelity: 'La révision conserve les images et le caractère apocalyptique du syriaque tels que reflétés par le dossier de contrôle : « goutte » et « crachat » restent distincts, les titres « Très-Haut » et « Puissant » ne sont pas confondus, et « Shéol » est maintenu. Quelques référents pronominaux ont été explicités en français afin de ne pas attribuer aux abstractions (« beauté », « assurance », « espoir ») les verbes qui, dans la chaîne argumentative, visent les nations.'
  naturalness: 'Le texte est globalement solide, mais certains accords et enchaînements pronominaux produisent des formulations grammaticalement ou sémantiquement instables : « la beauté ... mais elles seront recherchées », « l’espoir ... elle sera mise à l’écart ». « Ère » est aussi moins naturel que « siècle » dans ce registre apocalyptique. La révision rend ces passages lisibles sans les paraphraser.'
  terminology: « Très-Haut », « Puissant », « achèvement », « lumière de la vérité », « Shéol » et les termes du catalogue de renversements sont appropriés. « Siècle » remplace « ère » pour ܥܠܡܐ, conformément à un usage français scripturaire moderne et sans réduire le terme à une période historique précise.
  issues:
  - severity: medium
    issue: Référents pronominaux ambigus ou discordants dans le premier paragraphe.
    rationale: Les pluriels « elles » après « beauté » et « assurance », puis le féminin singulier après « espoir », rendent le français fautif ou obscur. L’explicitation par « ces nations » et « cet espoir » garde le mouvement rhétorique sans trancher davantage le texte.
  - severity: low
    issue: « Proclamations de l’ère » et « ère présente » sont peu idiomatiques.
    rationale: « Siècle » est la désignation française plus naturelle dans une prose apocalyptique pour le terme large ܥܠܡܐ (« âge/monde »), tout en préservant l’ambiguïté contextuelle.
  - severity: low
    issue: Question finale formulée de façon pesante par « aucun compte n’en sera demandé aux habitants ».
    rationale: « Ne leur en demandera-t-on pas compte ? » exprime plus directement le tour interrogatif rhétorique sans modifier sa portée.
