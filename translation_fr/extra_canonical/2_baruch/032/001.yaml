  - severity: low
    issue: « Jusqu’au temps fixé » ajoute « fixé ».
    rationale: Le texte transmis porte simplement l’expression temporelle « jusqu’au temps » ; l’idée d’un temps fixé est interprétative, même si elle est contextuellement plausible.
  - severity: low
    issue: La note présente une variante passive et une analyse textuelle sans nécessité suffisante.
    rationale: La voix active est retenue par l’audit et peut être rendue clairement en français. La note ne signale pas une difficulté textuelle établie du témoin source et risque de réintroduire une lecture écartée.
