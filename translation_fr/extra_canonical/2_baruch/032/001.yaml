  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
translation:
  language: fr
  text: 'Mais vous, si vous préparez vos cœurs afin d’y semer les fruits de la Loi, ces fruits vous protégeront au temps où le Puissant ébranlera toute la création.


    Car dans peu de temps, l’édifice de Sion sera ébranlé afin d’être rebâti. Cependant, cet édifice même ne subsistera pas : après un certain temps, il sera de nouveau déraciné et restera dévasté jusqu’au temps. Ensuite, il devra être renouvelé dans la gloire et affermi pour toujours.


    Nous ne devrions donc pas nous affliger autant du mal qui vient d’arriver que de celui qui doit venir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܐܪ̈ܐ / fructus legis
  choice: les fruits de la Loi
  rationale: Le pluriel syriaque est conservé, ainsi que la métaphore agricole et la référence explicite à la Loi.
- source_word: ܢܓܢ / proteget vos
  choice: celle-ci vous protégera
  rationale: La tournure active est maintenue. Le pronom reprend naturellement « la Loi », sans effacer l’ambiguïté possible entre la Loi et ses fruits.
- source_word: Fortis
  choice: le Puissant
  rationale: Cette formulation française naturelle conserve la valeur de titre divin et la solennité du passage.
- source_word: concutiat omnem creaturam
  choice: ébranlera toute la création
  rationale: « Ébranler » rend le bouleversement apocalyptique sans renforcer indûment le verbe, et « toute la création » marque sa portée cosmique.
- source_word: aedificatio Sion
  choice: l’édifice de Sion
  rationale: « Édifice » garde l’image bâtie tout en restant assez large pour désigner la forme construite de Sion.
- source_word: renovari in gloria
  choice: être renouvelé dans la gloire
  rationale: La formulation préserve à la fois l’idée de restauration et celle de gloire, sans les fondre en une simple reconstruction.
- source_word: perficietur in perpetuum
  choice: affermi pour toujours
  rationale: « Affermi » exprime ici l’achèvement durable de l’édifice dans un français idiomatique.
- source_word: contristari tantopere
  choice: nous affliger autant
  rationale: Le choix conserve le ton de deuil et permet de rendre clairement la comparaison entre le mal présent et le mal futur.
theological_decisions:
- issue: Titre divin dans la scène d’ébranlement
  choice: « le Puissant » est traité comme un titre divin
  alternative: « le Fort » ou « le Tout-Puissant »
  rationale: « Le Puissant » conserve la force du titre sans l’assimiler à un titre divin différent et plus chargé.
- issue: Sujet de la protection
  choice: La phrase active « celle-ci vous protégera » renvoie à la Loi, avec ses fruits comme antécédent conceptuel possible
  alternative: « vous serez protégés »
  rationale: La voix active attestée ne doit pas être neutralisée. Le français exige toutefois un choix de reprise grammaticale ; « celle-ci » reprend la Loi tout en laissant la note signaler l’autre analyse.
- issue: Image de la Loi
  choice: Maintien de « fruits de la Loi »
  alternative: « fruits de l’obéissance » ou « œuvres justes »
  rationale: Le texte unit préparation intérieure, semailles et Loi ; une paraphrase doctrinale effacerait cette articulation.
- issue: Reconstructions successives de Sion
  choice: 'Maintien de la séquence : ébranlement, reconstruction, nouvelle dévastation, renouvellement glorieux et permanence'
  alternative: Réduire la séquence à une seule restauration finale
  rationale: La tension entre restauration provisoire et renouvellement définitif appartient au passage et ne doit pas être harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. Les images agricoles et architecturales sont conservées. La majuscule à « Loi » marque la référence à la Torah dans ce contexte, et « le Puissant » demeure un titre divin sans ajout confessionnel.
