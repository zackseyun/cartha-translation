  text: But when he transgressed the commandment, it was taken away from him, just as Paradise also was.
translation:
  language: fr
  text: Mais lorsqu’il transgressa le commandement, elle lui fut retirée, tout comme le paradis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܕ ܐܫܬܕ ܦܘܩܕܢܐ
  choice: lorsqu’il transgressa le commandement
  rationale: Le contexte et la tradition textuelle indiquent la transgression du commandement, même si la forme syriaque transmise est textuellement difficile.
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: elle lui fut retirée
  rationale: Le passif exprime qu’une réalité précédemment montrée ou accordée à Adam lui a été enlevée; le pronom féminin reste volontairement implicite comme dans la source.
- source_word: ܐܝܟ ܕܐܦ ܦܪܕܝܣܐ
  choice: tout comme le paradis
  rationale: Rend directement la comparaison et conserve «paradis» sans explicitation théologique supplémentaire.
theological_decisions:
- issue: Référent du pronom féminin dans «elle lui fut retirée»
  choice: Conserver le pronom sans préciser son antécédent
  alternative: Expliciter «la vision de la cité» ou une autre réalité montrée à Adam
  rationale: Le texte syriaque laisse le référent grammatical dépendre du contexte; l’expliciter résoudrait une ambiguïté réelle sans appui suffisant.
- issue: Rapport entre la réalité retirée et le paradis
  choice: Présenter le paradis comme également retiré à Adam
  alternative: Reformuler en termes d’expulsion du paradis
  rationale: La source emploie une comparaison elliptique fondée sur le retrait; «expulsé» serait plus explicite mais importerait une formulation absente du verset.
translation_notes:
  register: Français moderne, sobre et dignifié. La syntaxe légèrement elliptique préserve l’ambiguïté du pronom féminin dans le syriaque.
