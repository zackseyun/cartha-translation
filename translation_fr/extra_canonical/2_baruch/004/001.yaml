  yaml_path: translation/extra_canonical/2_baruch/004/001.yaml
  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: fr
  text: '1 Le Seigneur me dit : « Cette ville sera livrée pour un temps, et le peuple sera emmené en captivité, mais le monde ne sera pas oublié. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ (b-zabnā)
  choice: pour un temps
  rationale: La locution indique ici une durée limitée; cette formulation française conserve cette nuance sans préciser une durée absente du syriaque.
- source_word: ܡܫܬܠܡܐ (meštalmā)
  choice: sera livrée
  rationale: Le passif exprime la remise de la ville au pouvoir d’autrui, vraisemblablement à ses ennemis, sans les nommer.
- source_word: ܡܬܕܒܪ ܫܒܝܐ (metdabbar šəbyā)
  choice: sera emmené en captivité
  rationale: Rend explicitement le mouvement forcé vers la captivité et évite de réduire l’expression au seul état d’être captif.
- source_word: ܥܠܡܐ (ʿālmā)
  choice: le monde
  rationale: Le terme peut selon le contexte désigner le monde ou l’âge; « le monde » correspond ici au sens contextuel le plus naturel tout en évitant d’ajouter une interprétation eschatologique.
- source_word: ܠܐ ܡܬܬܢܫܐ (lā mettənšē)
  choice: ne sera pas oublié
  rationale: Conserve le passif et la portée rassurante de l’énoncé sans expliciter l’agent, qui reste implicite dans le syriaque.
theological_decisions:
- issue: Portée de « le monde ne sera pas oublié »
  choice: Conserver l’énoncé général sans préciser qui n’oublie pas le monde ni comment il en prend soin.
  alternative: « Dieu n’oubliera pas le monde » ou « le monde ne sera pas abandonné »
  rationale: Le contexte suggère Dieu comme agent implicite, mais le texte emploie un passif et parle d’oubli; l’explicitation ou le remplacement par « abandonné » résoudrait indûment cette formulation.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination et le contraste final reproduisent la progression du syriaque, tandis que « pour un temps » maintient l’idée que la remise de la ville est temporaire.
