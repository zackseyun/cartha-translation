  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: fr
  text: Car ce n’est pas celle qui est faite de main d’homme, mais celle qui sera révélée, celle qui a été préparée d’avance dès le moment où j’ai formé le projet de faire le Paradis et où je l’ai montrée à Adam avant qu’il ne pèche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: faite par des mains humaines
  rationale: L’expression syriaque signifie littéralement « par la main des êtres humains ». Le verbe « faite » est explicité naturellement en français à partir du contexte, qui oppose la cité humaine à la cité préparée par Dieu.
- source_word: ܡܬܓܠܐ
  choice: sera révélée
  rationale: Le participe passif exprime la manifestation future de la cité; le futur français convient au contexte eschatologique immédiat.
- source_word: ܐܬܟܢ ܡܢܩܕܡ
  choice: a été préparée d’avance
  rationale: Cette formulation conserve l’idée d’une préparation antérieure sans préciser davantage son mode ni son lieu.
- source_word: ܐܬܚܫܒܬ
  choice: j’ai décidé
  rationale: Le verbe peut exprimer le fait de penser, concevoir ou former un dessein. « Décidé » rend ici un dessein arrêté tout en restant idiomatique.
- source_word: ܦܪܕܝܣܐ
  choice: le Paradis
  rationale: Le nom désigne ici le Paradis primordial montré à Adam; la majuscule indique ce référent particulier.
theological_decisions:
- issue: Nature de la cité révélée
  choice: Maintenir l’opposition entre une cité faite par les humains et une cité préparée d’avance puis révélée.
  alternative: Identifier explicitement cette cité à une Jérusalem céleste ou éternelle.
  rationale: Le contexte favorise une réalité céleste ou eschatologique, mais le verset ne lui donne pas ici ce titre précis; l’ajouter résoudrait indûment l’identification.
- issue: Rapport entre le Paradis et la cité
  choice: Conserver la formulation selon laquelle Dieu a montré « celle-ci » à Adam au moment de son dessein de faire le Paradis.
  alternative: Dire que Dieu a montré le Paradis lui-même à Adam.
  rationale: Le pronom grammatical renvoie naturellement à la réalité évoquée auparavant, tandis que la relation exacte entre la cité et le Paradis demeure tendue dans le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la répétition structurante « celle… celle… » du syriaque et évite d’ajouter une désignation confessionnelle ou interprétative de la cité.
