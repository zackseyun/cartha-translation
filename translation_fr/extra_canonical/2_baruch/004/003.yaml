revisions:
- from: Car ce n’est pas celle qui est faite par des mains humaines, mais celle qui sera révélée, celle qui a été préparée d’avance depuis le moment où j’ai décidé de faire le Paradis et où je l’ai montrée à Adam avant qu’il ne pèche.
  to: Car ce n’est pas celle qui est faite de main d’homme, mais celle qui sera révélée, celle qui a été préparée d’avance dès le moment où j’ai formé le projet de faire le Paradis et où je l’ai montrée à Adam avant qu’il ne pèche.
  rationale: 'La révision améliore l’idiomaticité française tout en conservant l’ellipse référentielle du texte : « celle » renvoie à la cité du contexte sans l’identifier explicitement à une réalité théologiquement définie. Elle maintient également l’ambiguïté grammaticale et conceptuelle du rapport entre la réalité révélée et le Paradis, plutôt que de substituer « le Paradis » au pronom objet.'
