    issue: Formulation française peu idiomatique de l’origine humaine
    rationale: « Faite par des mains humaines » reproduit le tour source, mais « faite de main d’homme » est plus naturel et garde exactement l’opposition avec une œuvre non humaine.
  - severity: low
    issue: Expression temporelle et délibérative lourde
    rationale: « Depuis le moment où j’ai décidé » est moins fluide que « dès le moment où j’ai formé le projet ». Cette dernière expression rend le verbe syriaque de pensée/projet sans préciser davantage la nature du dessein.
  revised_text: Car ce n’est pas celle qui est faite de main d’homme, mais celle qui sera révélée, celle qui a été préparée d’avance dès le moment où j’ai formé le projet de faire le Paradis et où je l’ai montrée à Adam avant qu’il ne pèche.
