translation:
  language: fr
  text: 'Ou bien penses-tu que ce soit cette ville dont j’ai dit : « Je t’ai gravée sur les paumes de mes mains » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: la ville
  rationale: Le terme syriaque désigne une ville ou cité. « La ville » est ici naturel et renvoie clairement à Jérusalem sans ajouter son nom au texte.
- source_word: ܐܝܕܝܗ̇
  choice: la paume de mes mains
  rationale: La formulation renvoie à l’image d’Ésaïe 49:16. « Paume » rend cette image de façon intelligible en français, tandis que le pluriel « mes mains » respecte la forme transmise dans cette citation.
- source_word: ܓܠܦ
  choice: gravée
  rationale: Le verbe exprime une inscription incisée ou gravée, image plus forte qu’une simple écriture.
theological_decisions:
- issue: Identification entre la Jérusalem terrestre et la ville annoncée par Dieu
  choice: Conserver la question qui met cette identification en doute
  alternative: Préciser explicitement qu’il s’agit de la Jérusalem céleste
  rationale: Le verset entretient encore la tension entre la ville visible et la ville révélée; l’explication vient dans le contexte et ne doit pas être anticipée.
- issue: Genre du référent dans la citation
  choice: Employer « gravée » au féminin pour reprendre « la ville »
  alternative: Employer « gravé » en visant le peuple ou le nom de Jérusalem
  rationale: Le contexte immédiat porte sur « la ville »; l’accord féminin assure une reprise claire sans résoudre davantage l’identité symbolique du référent.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe interrogative reste naturelle, et la citation conserve l’imagerie scripturaire sans explicitation doctrinale.
