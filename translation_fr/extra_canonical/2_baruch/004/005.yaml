  text: And after these things I showed it to my servant Abraham by night, between the pieces of the sacrifice.
translation:
  language: fr
  text: Après cela, je l’ai fait voir à mon serviteur Abraham, de nuit, entre les morceaux du sacrifice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: je l’ai montrée
  rationale: Le verbe signifie « montrer, faire voir ». Le pronom suffixe renvoie vraisemblablement à la cité mentionnée dans le contexte; le féminin français rend cet antécédent naturel.
- source_word: ܠܥܒܕܝ
  choice: à mon serviteur
  rationale: Rend directement le nom « serviteur » avec le suffixe possessif de première personne.
- source_word: ܒܠܠܝܐ
  choice: de nuit
  rationale: Expression temporelle concise et naturelle correspondant à « dans/pendant la nuit ».
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: entre les morceaux du sacrifice
  rationale: Le contexte évoque Genèse 15; ܦܓܪ̈ܐ désigne ici les corps ou morceaux des victimes sacrificielles. « Morceaux du sacrifice » reste clair sans ajouter une précision absente du syriaque.
theological_decisions:
- issue: Référent du pronom dans « je l’ai montrée »
  choice: La cité préparée d’avance
  alternative: Le paradis
  rationale: Le contexte immédiat développe la cité à venir, bien qu’il mentionne aussi le paradis montré à Adam. Le pronom syriaque demeure peu explicite; le féminin requis en français suit le référent contextuel le plus probable sans l’insérer nominalement dans le texte.
- issue: Allusion à Genèse 15
  choice: Conserver l’expression « entre les morceaux du sacrifice »
  alternative: Expliciter « entre les animaux partagés pour le sacrifice »
  rationale: La formulation retenue préserve l’allusion et l’économie du texte sans harmonisation explicative avec un autre passage.
translation_notes:
  register: Français moderne, digne et accessible. Syntaxe proche du syriaque, avec une formulation naturelle; aucune explicitation confessionnelle ni harmonisation ajoutée.
