  text: And again I also showed it to Moses on Mount Sinai, when I showed him the pattern of the tabernacle and all its vessels.”
translation:
  language: fr
  text: Et de nouveau, je l’ai aussi montrée à Moïse, sur le mont Sinaï, lorsque je lui ai montré le modèle de la tente sacrée et de tous ses ustensiles. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܬܘܒ ܐܦ ܠܡܘܫܐ ܚܘܝܬܗ
  choice: Et de nouveau, je l’ai aussi montrée à Moïse
  rationale: Rend directement la reprise syriaque «et de nouveau, aussi, à Moïse je l’ai montrée». Le pronom féminin «la» renvoie à la ville évoquée dans le contexte.
- source_word: τύπος / tabnît (tradition textuelle sous-jacente; fin du verset non visible dans l’extrait syriaque fourni)
  choice: le modèle
  rationale: «Modèle» exprime naturellement l’idée d’un prototype montré à Moïse, sans réduire le terme à un simple plan architectural.
- source_word: ܡܫܟܢܐ / σκηνή (tradition textuelle sous-jacente; fin du verset non visible dans l’extrait syriaque fourni)
  choice: la tente sacrée
  rationale: Expression claire en français courant pour le sanctuaire mobile d’Israël; elle évite le mot «tabernacle», moins immédiatement compréhensible aujourd’hui.
- source_word: ܡܐܢ̈ܐ / σκεύη (tradition textuelle sous-jacente; fin du verset non visible dans l’extrait syriaque fourni)
  choice: tous ses objets
  rationale: Terme français englobant et naturel pour les objets et ustensiles associés à la tente sacrée.
theological_decisions:
- issue: Référent de «la» dans «je l’ai montrée»
  choice: la ville céleste préparée d’avance
  alternative: le paradis
  rationale: Le discours divin revient à «la ville» destinée à être révélée, tandis que le paradis sert de comparaison dans l’explication historique. Le féminin français préserve ce lien contextuel sans ajouter «céleste» dans le corps du texte.
- issue: Nature du modèle montré à Moïse
  choice: Conserver «modèle» sans préciser davantage son statut ontologique
  alternative: plan, copie ou sanctuaire céleste
  rationale: Le texte établit un rapport entre ce qui est montré et la tente, mais il ne faut pas imposer une interprétation confessionnelle précise de ce rapport.
translation_notes:
  register: Français moderne, international et digne. «Tente sacrée» privilégie la compréhension immédiate; «objets» reste volontairement large. L’extrait syriaque fourni s’interrompt après «je l’ai montrée à Moïse»; la fin du verset est donc formulée avec l’appui de la couche anglaise auditée et de la tradition textuelle connue.
