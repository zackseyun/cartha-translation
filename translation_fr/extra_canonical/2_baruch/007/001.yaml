  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: fr
  text: 'Après cela, j’entendis cet ange dire aux anges qui tenaient les torches : « Maintenant, arrachez les soutiens de ses murailles et renversez-les, de peur que les ennemis ne se vantent en disant : “C’est nous qui avons abattu la muraille de Sion et brûlé le lieu du Dieu puissant.” Et tenez-vous là où je me tenais auparavant. »a'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܫܒܩܬܗ [lecture corrigée : ܫܡܥܬܗ]'
  choice: j’entendis
  rationale: 'La leçon transmise dans l’OCR, prise littéralement, signifierait plutôt « je le quittai », mais le contexte syntaxique et la correction textuelle contrôlée soutiennent « j’entendis » : Baruch introduit les paroles de l’ange.'
- source_word: ܠܡܦܐܕ̈ܐ / ܠܡܦܝܕܐ
  choice: les torches
  rationale: Dans cette scène de destruction par le feu, « torches » rend mieux les instruments enflammés que le terme plus domestique « lampes ».
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: les soutiens de ses murailles
  rationale: L’expression désigne les parties qui assurent la solidité des murailles sans permettre de préciser s’il s’agit de fondations ou de contreforts.
- source_word: ܣܚܦܢܝܗܝ
  choice: avons abattu
  rationale: Le verbe exprime une démolition violente ; « abattre » est naturel en français et convient à une muraille.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: le lieu du Dieu puissant
  rationale: Cette formulation conserve le lieu consacré à Dieu et le qualificatif de puissance sans transformer explicitement le lieu en demeure.
- source_word: ܘܐܬܩܝܡܘ
  choice: tenez-vous
  rationale: La lecture corrigée est un impératif pluriel adressé aux anges, non une déclaration narrative de Baruch.
theological_decisions:
- issue: L’agent véritable de la chute de Jérusalem
  choice: Les anges renversent les murailles sur ordre céleste, et les ennemis ne peuvent donc pas s’en attribuer la gloire.
  alternative: Présenter la chute comme l’œuvre autonome des ennemis ou comme un effondrement sans agent précisé.
  rationale: L’ordre donné aux anges vise expressément à empêcher les ennemis de se vanter d’avoir eux-mêmes abattu Sion et brûlé le lieu sacré.
- issue: Identité du locuteur dans la dernière phrase
  choice: La dernière phrase demeure dans le discours de l’ange et commande aux autres anges de se tenir à l’endroit où lui-même se tenait auparavant.
  alternative: 'Faire de cette phrase une remarque narrative de Baruch : « je me tenais là ».'
  rationale: La correction textuelle contrôlée soutient un impératif pluriel et un adverbe relatif de lieu ; la citation doit donc se fermer à la fin du verset.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le relief apocalyptique du récit tout en évitant les archaïsmes. « Murailles » distingue naturellement l’enceinte urbaine d’un simple mur, et les citations imbriquées clarifient les différents locuteurs.
