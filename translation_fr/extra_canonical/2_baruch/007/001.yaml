  verdict: revise
  source_fidelity: Le texte français rend fidèlement la lecture critique qui comprend la conclusion comme un impératif pluriel adressé aux anges. Les « soutiens » des murailles, la prévention de la vantardise ennemie, Sion et le titre divin sont conservés. La variante narrative attestée par une lecture incertaine doit toutefois être signalée, conformément à la trace d’audit anglaise.
  naturalness: Le français est clair, moderne et soutenu. Le remplacement de « Puis » par « et » suit plus exactement la coordination du discours direct et évite d’ajouter une nuance temporelle. « Tenez-vous là » est une formulation naturelle pour l’ordre de se placer/de se tenir.
  terminology: « Torches », « soutiens », « murailles », « Sion » et « Dieu puissant » sont cohérents avec le syriaque et avec un registre biblique français moderne. « Dieu puissant » garde le qualificatif sans imposer une interprétation cultuelle de « lieu ».
