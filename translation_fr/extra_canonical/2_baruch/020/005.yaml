  text: Go, therefore, sanctify yourself for seven days; eat no bread, drink no water, and speak with no one.
translation:
  language: fr
  text: 'Va donc, consacre-toi pendant sept jours : ne mange pas de pain, ne bois pas d’eau et ne parle à personne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܩܕܫ (forme attendue dans la tradition syriaque du verset)
  choice: consacre-toi
  rationale: Rend le sens réfléchi de la racine sémitique liée à la sainteté et à la mise à part, sans réduire l’expression à une simple purification rituelle.
- source_word: ܫܒܥܐ ܝܘܡܝܢ
  choice: pendant sept jours
  rationale: Expression temporelle française naturelle qui conserve exactement la durée indiquée.
- source_word: ܠܐ ܬܐܟܘܠ ܠܚܡܐ
  choice: ne mange pas de pain
  rationale: Traduction concrète et formellement proche; rien n’impose ici d’élargir « pain » à toute nourriture.
- source_word: ܠܐ ܬܫܬܐ ܡܝܐ
  choice: ne bois pas d’eau
  rationale: Conserve l’interdiction explicite et sa formulation sobre.
- source_word: ܥܡ ܐܢܫ ܠܐ ܬܡܠܠ
  choice: ne parle à personne
  rationale: Formulation idiomatique qui garde la portée absolue de l’interdiction.
theological_decisions:
- issue: Nature de l’acte préparatoire
  choice: consacre-toi
  alternative: purifie-toi / sanctifie-toi
  rationale: « Consacre-toi » exprime une mise à part sacrée préparatoire. « Purifie-toi » préciserait indûment un rite de purification, tandis que « sanctifie-toi » est exact mais moins naturel en français courant.
- issue: Portée de l’abstinence de pain
  choice: pain au sens littéral
  alternative: nourriture en général
  rationale: Le texte énumère le pain et l’eau; la traduction maintient cette tension sans transformer explicitement l’ordre en jeûne total.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif « Va donc » conserve l’enchaînement logique; les trois interdictions parallèles sont réunies après deux-points. Le feuillet syriaque fourni est un regroupement de chapitre obtenu par interpolation et ne permet pas d’isoler avec certitude le verset 20:5; les formes syriaques citées dans les décisions lexicales représentent donc la formulation attendue d’après la tradition du verset, contrôlée par la couche anglaise auditée, et non une lecture diplomatique certaine du passage affiché.
