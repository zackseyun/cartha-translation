  source_fidelity: 'Le texte français reproduit fidèlement la séquence impérative attestée pour 2 Baruch 20:5 : ordre de départ, préparation sacrée pour sept jours, puis abstention de pain, d’eau et de toute conversation. « Consacre-toi » rend de manière recevable le réfléchi syriaque attendu (« sanctifie-toi / mets-toi à part ») sans ajouter un rite précis. Le feuillet fourni relevant d’un regroupement de chapitre ne permet pas d’établir diplomatiquement chaque mot du verset; l’audit anglais confirme toutefois la teneur de la traduction.'
