  text: And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.
translation:
  language: fr
  text: Et maintenant, garde fermement dans ton cœur tout ce que je te commande, et scelle-le dans les chambres intérieures de ton esprit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܟ (concept sous-jacent dans la tradition textuelle du verset)
  choice: ton cœur
  rationale: Conserve l’image sémitique du cœur comme siège de l’intériorité, sans la réduire aux seuls sentiments.
- source_word: ܚܬܘܡ / racine « sceller » (concept sous-jacent)
  choice: scelle-le
  rationale: Maintient la métaphore concrète du sceau, qui exprime à la fois conservation et protection.
- source_word: ܬܘܢ̈ܐ / « chambres intérieures » (concept sous-jacent)
  choice: les chambres intérieures
  rationale: Préserve l’image spatiale inhabituelle du texte au lieu de l’aplanir en « au fond de ».
- source_word: ܪܥܝܢܟ / « esprit, pensée » (concept sous-jacent)
  choice: ton esprit
  rationale: Désigne ici la faculté intérieure de réflexion et de mémoire; « esprit » reste naturel en français tout en conservant l’ampleur du terme.
theological_decisions:
- issue: Nature de l’intériorisation du commandement
  choice: Conserver les deux images parallèles du cœur et des chambres intérieures de l’esprit.
  alternative: Fusionner les images en « grave tout cela au plus profond de toi ».
  rationale: Le parallélisme distingue sans les opposer le cœur et l’esprit; le conserver évite d’imposer une anthropologie théologique plus systématique que celle du texte.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La tournure volontairement imagée « chambres intérieures de ton esprit » conserve l’étrangeté poétique du syriaque. Le matériau fourni étant un corpus de pages avec interpolation tentative et ne présentant pas clairement le verset isolé, la formulation s’appuie sur la tradition textuelle attestée par la couche anglaise de consultation, avec prudence lexicale.
