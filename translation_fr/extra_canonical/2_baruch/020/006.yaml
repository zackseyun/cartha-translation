  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: fr
  text: Après cela, viens en ce lieu. Là, je me manifesterai à toi, je m’entretiendrai avec toi de choses véritables et je t’instruirai sur l’ordre des temps, car ils viennent et ne tarderont pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: « apparaître / se révéler » (verbe syriaque sous-jacent, passage non nettement délimité dans l’extrait fourni)
  choice: je me manifesterai
  rationale: Rend une apparition personnelle sans préciser indûment s’il s’agit d’une vision physique ou d’une révélation.
- source_word: « choses vraies / vérités »
  choice: des choses vraies
  rationale: Conserve l’expression concrète et légèrement ouverte plutôt que de l’abstraire en « la vérité ».
- source_word: « ordre / disposition des temps »
  choice: l’ordre des temps
  rationale: Préserve le sens d’une succession organisée des périodes sans imposer une chronologie détaillée absente du texte.
- source_word: « tarder / être retardé »
  choice: ne tarderont pas
  rationale: Formulation française naturelle qui maintient l’imminence affirmée par la proposition finale.
theological_decisions:
- issue: Nature de la manifestation annoncée
  choice: « je me manifesterai à toi »
  alternative: « je t’apparaîtrai »
  rationale: La formulation retenue laisse ouverte la modalité de cette manifestation et évite de trancher entre apparition visible et révélation.
translation_notes:
  register: Français moderne, digne et direct. La segmentation exacte de 2 Baruch 20:6 n’est pas clairement visible dans le bloc syriaque fourni, qui couvre un ensemble de pages avec chevauchement; la formulation reste donc prudente et suit les correspondances sémantiques attestées par la couche de consultation anglaise sans ajouter de précision doctrinale.
