translation:
  language: fr
  text: Alors je te montrerai le jugement de ma puissance et mes voies, qui sont insondables.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ (formulation sous-jacente attestée par la tradition du verset)
  choice: jugement
  rationale: Conserve le champ judiciaire du terme sans le réduire à la seule condamnation ni l’assimiler simplement à la justice abstraite.
- source_word: ܚܝܠܝ (formulation sous-jacente attestée par la tradition du verset)
  choice: ma puissance
  rationale: « Puissance » rend dignement la force souveraine de Dieu; « pouvoir » serait possible, mais moins naturel dans cette construction.
- source_word: ܐܘܪܚ̈ܬܝ (formulation sous-jacente attestée par la tradition du verset)
  choice: mes voies
  rationale: Maintient l’image biblique des voies divines, c’est-à-dire sa manière d’agir, sans l’expliciter excessivement.
- source_word: ܕܠܐ ܡܬܥܩܒ̈ܢ / sens traditionnel correspondant
  choice: qui sont insondables
  rationale: Exprime l’impossibilité de sonder pleinement les voies divines dans un français courant et solennel.
theological_decisions:
- issue: Rapport entre le jugement et la puissance divine
  choice: « le jugement de ma puissance »
  alternative: « le jugement qu’exerce ma puissance »
  rationale: 'La formulation retenue préserve le lien génitif et son ambiguïté: il peut s’agir du jugement manifestant la puissance divine ou procédant d’elle. L’alternative préciserait indûment ce rapport.'
- issue: Caractère inaccessible des voies divines
  choice: « insondables »
  alternative: « impénétrables »
  rationale: « Insondables » conserve l’idée d’une recherche qui ne peut parvenir au fond, sans suggérer que les voies divines seraient absolument inintelligibles ou arbitraires.
translation_notes:
  register: Français international moderne, bref et solennel. La syntaxe conserve le parallélisme entre « le jugement de ma puissance » et « mes voies ». Aucun marqueur de note n’est requis.
