  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: fr
  text: 1 C’est pourquoi, voici que viennent des jours où les temps se hâteront plus que les précédents, où les périodes passeront plus vite que celles qui se sont écoulées, et où les années s’en iront plus rapidement que les années présentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: les temps
  rationale: Le terme syriaque désigne ici des temps ou périodes; «les temps» conserve la portée temporelle générale du passage.
- source_word: ܫܢܝ̈ܐ
  choice: les années
  rationale: Traduction directe du pluriel syriaque «années».
- source_word: ܡܢ ܩܕܡܝܐ
  choice: plus que les précédents
  rationale: La comparaison avec ce qui est antérieur est maintenue sans préciser davantage un référent que le texte laisse implicite.
theological_decisions:
- issue: Accélération eschatologique du temps
  choice: Employer des verbes de mouvement — «se hâteront», «passeront», «s’en iront» — sans expliquer le mécanisme de cette accélération.
  alternative: Paraphraser comme une réduction divine de la durée des jours.
  rationale: Le texte décrit poétiquement l’accélération des temps, des périodes et des années, mais n’en fournit pas ici d’explication théologique explicite.
translation_notes:
  register: Français moderne, soutenu mais accessible. La triple progression parallèle du syriaque est conservée, ainsi que l’introduction solennelle «voici que viennent des jours».
