  text: Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.
translation:
  language: fr
  text: C’est pourquoi j’ai maintenant enlevé Sion, afin de visiter[a] plus rapidement le monde au temps qui lui est fixé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : intervenir dans.'
    reason: « Visiter » a ici le sens biblique large d’une intervention divine et ne désigne pas nécessairement une simple venue.
lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: C’est pourquoi
  rationale: Rend naturellement le lien causal explicite du syriaque.
- source_word: ܡܟܝܠ
  choice: maintenant
  rationale: Dans ce contexte temporel, ce terme marque le moment présent plutôt qu’une simple conclusion logique.
- source_word: « prendre/enlever » (formulation syriaque du verset)
  choice: j’ai enlevé Sion
  rationale: Conserve l’image forte du retrait de Sion sans préciser davantage la nature de l’acte.
- source_word: « visiter » (formulation syriaque du verset)
  choice: visiter
  rationale: Maintient le sens biblique potentiellement large de la visite divine, qui peut impliquer une intervention ou un jugement.
- source_word: « au temps fixé pour lui » (formulation syriaque du verset)
  choice: au temps qui lui est fixé
  rationale: Préserve la référence pronominale et l’idée d’un moment déterminé sans expliciter abusivement son antécédent.
theological_decisions:
- issue: Sens de la visite divine du monde
  choice: visiter
  alternative: intervenir dans le monde / juger le monde
  rationale: Le terme peut désigner une intervention divine favorable ou judiciaire. Le texte principal conserve cette tension, tandis que la note signale une autre formulation possible.
- issue: Nature de l’enlèvement de Sion
  choice: enlevé Sion
  alternative: retiré Sion / fait disparaître Sion
  rationale: La traduction ne détermine pas si l’expression vise uniquement la destruction de la ville, son retrait de la scène historique ou une autre action divine.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit de près le mouvement causal et temporel du texte, tout en conservant l’ambiguïté de la « visite » divine et de l’expression « au temps qui lui est fixé ».
