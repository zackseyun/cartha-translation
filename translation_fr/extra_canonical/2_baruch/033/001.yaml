base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: fr
  text: '« Sont-ce là les instructions que ton compagnon Jérémie[a] t’a données en disant : “Veille sur ce peuple pendant que je vais réconforter le reste de nos frères à Babylone, ceux qui sont tombés en captivité” ? Et maintenant, si toi aussi tu nous quittes, mieux vaudrait pour nous tous mourir avant toi que de te voir nous quitter. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre interprétation : « Jérémie le prophète ».'
    reason: Le texte principal traduit ܚܒܪܟ par « ton compagnon » ; la note conserve l’alternative signalée dans la piste d’audit anglaise sans la présenter comme le sens littéral.
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: instructions
  rationale: Le nom désigne des directives ou des ordres confiés à quelqu’un. « Instructions » est naturel en français et convient à la charge que Jérémie aurait laissée à Baruch.
- source_word: ܚܒܪܟ
  choice: ton compagnon
  rationale: Le terme exprime une relation étroite d’association. « Compagnon » préserve cette proximité sans préciser davantage la fonction de Jérémie.
- source_word: ܚܙܝ ܠܗܘܢ ܥܡܐ
  choice: veille sur ce peuple
  rationale: Littéralement lié au fait de regarder ou de voir, l’expression prend ici le sens de prendre soin du peuple pendant l’absence de Jérémie.
- source_word: ܐܦܝܣ
  choice: réconforter
  rationale: L’Aphel de ܦܝܣ peut exprimer l’action de persuader, d’apaiser ou de consoler. Dans le contexte des frères exilés à Babylone, « réconforter » est le sens contextuel le plus naturel.
- source_word: ܐܚ̈ܝ
  choice: nos frères
  rationale: Cette formulation conserve le langage familial et communautaire du syriaque dans un français moderne.
- source_word: ܕܢܦܠܘ
  choice: ceux qui sont tombés en captivité
  rationale: Le texte à la limite de page est incomplet, mais la proposition identifie les frères de Babylone comme victimes de la captivité. Cette traduction reste proche de la formulation transmise sans reconstruire un décret non explicitement lisible ici.
- source_word: ܫܪܘܟ
  choice: tu nous quittes / partir loin de nous
  rationale: Dans la plainte du peuple, le verbe évoque un départ ressenti comme un abandon. Les deux formulations françaises rendent cette force affective sans lourde répétition.
theological_decisions:
- issue: Identification de Jérémie
  choice: ton compagnon Jérémie
  alternative: Jérémie le prophète
  rationale: Le texte syriaque fourni porte ܚܒܪܟ, « ton compagnon/associé ». La traduction ne remplace pas cette relation textuelle par un titre prophétique, même si celui-ci est vrai dans le cadre narratif.
- issue: Situation des frères à Babylone
  choice: ceux qui sont tombés en captivité
  alternative: ceux dont la déportation a été décrétée
  rationale: La limite matérielle du passage est incertaine. Le choix retenu exprime clairement leur captivité sans introduire une formulation juridique insuffisamment assurée par le segment visible.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La question accusatrice et la détresse collective sont conservées. La répétition syriaque autour du départ est légèrement variée en français pour préserver le naturel sans atténuer le sentiment d’abandon.
