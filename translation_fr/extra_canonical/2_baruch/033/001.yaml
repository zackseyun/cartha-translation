    issue: Ajout de « loin » dans « partir loin de nous »
    rationale: Le syriaque exprime le retrait ou le départ d’auprès du peuple, sans préciser une distance. « T’éloigner de nous » est fidèle et idiomatic.
  - severity: medium
    issue: Note a présentée comme une traduction littérale inexacte
    rationale: Le syriaque porte directement « ton compagnon Jérémie », qui est déjà la formulation du texte principal. La note doit présenter « Jérémie le prophète » comme une autre interprétation, non comme le littéral.
