  text: But remember and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: fr
  text: Mais veillez sur le peuple qui reste, afin qu’il ne s’éloigne pas des commandements de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܛܪܘ
  choice: souvenez-vous
  rationale: Dans ce contexte d’exhortation adressée aux responsables du peuple, le verbe appelle à garder à l’esprit et à prendre soin de ceux qui restent; «souvenez-vous» conserve la formulation attestée par la tradition de traduction consultée.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: les commandements de Dieu
  rationale: Le syriaque conservé porte explicitement «les commandements de Dieu»; cette désignation est retenue plutôt que «du Puissant», qui n’est pas la lecture de ce témoin.
- source_word: ܐܫܬܚܪ
  choice: qui reste
  rationale: Rend naturellement l’idée du peuple demeuré ou survivant, sans préciser davantage la nature de ce reste.
theological_decisions:
- issue: Désignation divine
  choice: Dieu
  alternative: le Puissant
  rationale: Le témoin syriaque primaire lit ܐܠܗܐ, «Dieu». La variante de formulation de la couche anglaise n’a donc pas été importée dans le texte français.
- issue: Nature de l’éloignement
  choice: qu’il ne s’écarte pas
  alternative: qu’il n’abandonne pas
  rationale: «S’écarter» exprime une déviation hors des commandements sans déterminer si elle constitue un abandon définitif.
translation_notes:
  register: Français international moderne, exhortatif et digne. Le pluriel «souvenez-vous» correspond à l’adresse faite aux responsables du peuple; «avertissez-le» évite une tournure lourde tout en conservant la force de l’admonestation.
