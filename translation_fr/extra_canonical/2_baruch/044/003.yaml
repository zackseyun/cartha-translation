  verdict: revise
  source_fidelity: Le syriaque conservé lit littéralement «mais veillez/gardez et soyez auprès du peuple qui reste, afin qu’il ne s’éloigne pas des commandements de Dieu». Le verbe ܢܛܪܘ signifie ici «gardez, veillez [sur]», non «souvenez-vous»; l’idée d’«avertir» n’est pas explicitement exprimée. «Dieu» et «le peuple qui reste» sont bien fondés dans ce témoin.
  naturalness: La formulation révisée est naturelle en français moderne et conserve le ton d’exhortation adressé à plusieurs responsables.
  terminology: «Commandements de Dieu» rend exactement ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ. «S’éloigne de» traduit sans surinterpréter la construction «qu’il ne quitte/ne se retire des».
  issues:
  - severity: high
    issue: «souvenez-vous» ne rend pas le verbe syriaque ܢܛܪܘ.
    rationale: Dans ce contexte, ܢܛܪ signifie garder, observer ou veiller sur; il ne signifie pas se souvenir.
  - severity: medium
    issue: «avertissez-le» ajoute une action absente du texte source.
    rationale: La seconde injonction ܘܗܘܘ ܠ («et soyez auprès/pour») appelle une présence ou un soutien envers le peuple restant, plutôt qu’une admonestation explicite.
