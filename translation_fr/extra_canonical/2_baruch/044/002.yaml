  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: fr
  text: Mais vous, ne vous écartez pas de la voie de la Loi. Veillez plutôt sur le peuple qui reste et avertissez-le, de peur qu’il ne s’écarte des commandements du Puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܥܕܘܢ
  choice: vous écartez
  rationale: Rend naturellement l’idée de se détourner ou de s’éloigner d’une voie, reprise ensuite à propos des commandements.
- source_word: ܐܘܪܚܐ ܕܢܡܘܣܐ
  choice: la voie de la Loi
  rationale: Conserve l’image de la voie ainsi que la référence explicite à la Loi.
- source_word: ܛܪܘ
  choice: veillez sur
  rationale: Exprime la responsabilité active de garder et de protéger le peuple restant.
- source_word: ܪܬܘ
  choice: avertissez-le
  rationale: Terme français courant et digne pour l’exhortation ou la mise en garde demandée.
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  choice: le peuple qui reste
  rationale: Préserve la formulation concrète du reste du peuple sans introduire le terme théologique plus chargé « reste » comme substantif.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Maintient ce titre divin distinctif sans le normaliser automatiquement en « Dieu » ou en « Tout-Puissant ».
theological_decisions:
- issue: Titre divin
  choice: le Puissant
  alternative: le Tout-Puissant
  rationale: La traduction retenue suit plus directement le titre source et évite d’y ajouter l’idée d’omnipotence absolue si elle n’est pas lexicalement explicite.
- issue: Rapport entre la Loi et les commandements
  choice: Conserver les deux expressions distinctes
  alternative: Uniformiser en « Loi » ou en « commandements »
  rationale: Le texte associe la voie de la Loi aux commandements du Puissant; cette variation participe à son exhortation et ne doit pas être effacée.
translation_notes:
  register: Français international moderne, clair et solennel. La phrase est divisée en deux pour améliorer la lisibilité tout en conservant l’opposition entre l’interdiction adressée aux responsables et leur devoir envers le peuple restant.
