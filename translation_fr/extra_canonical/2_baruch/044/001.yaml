  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: fr
  text: '1 Moi, Baruch, je partis de là et me rendis auprès du peuple. J’appelai mon premier-né, ses habitants, les anciens de ses notables et l’humble parmi les anciens du peuple[a], puis je leur dis :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La liste des personnes convoquées est difficile dans le texte syriaque. Littéralement : « mon premier-né, ses habitants, les anciens de ses grands et l’humble parmi les anciens du peuple ». Le référent de « ses habitants » n’est pas clair dans le texte transmis.'
    reason: Le syriaque présente des rapports syntaxiques et des changements de nombre inhabituels. La note préserve la difficulté sans imposer une correction conjecturale ni fixer le référent du suffixe.
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: mon premier-né
  rationale: Le terme signifie normalement « mon premier-né ». Bien que le contexte d’une assemblée civique puisse suggérer un emploi désignant une personne de premier rang, le texte syriaque transmis ne permet pas de trancher; la traduction conserve donc son sens direct.
- source_word: ܥܡܘܪܝܗ
  choice: les habitants du peuple
  rationale: Le suffixe renvoie grammaticalement à un antécédent singulier, vraisemblablement « le peuple ». La formulation est explicitée en français afin d’éviter un pronom possessif sans référent clair.
- source_word: ܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  choice: les anciens de ses notables
  rationale: Cette traduction garde la relation construite du syriaque entre « anciens » et « grands/notables », sans simplifier la liste ni introduire des noms ou des nombres absents du texte.
- source_word: ܡܟܝܟܐ
  choice: les humbles
  rationale: Le mot peut exprimer l’humilité ou une condition sociale modeste. « Les humbles » préserve cette double nuance et contraste avec les notables mentionnés auparavant.
theological_decisions:
- issue: Identité du « premier-né » dans l’assemblée
  choice: mon premier-né
  alternative: les hommes de premier rang
  rationale: Aucune identification personnelle ou fonction institutionnelle n’est ajoutée. Le sens lexical direct est retenu tout en signalant l’obscurité contextuelle.
- issue: Composition des responsables convoqués
  choice: conserver séparément les habitants, les anciens des notables et les humbles parmi les anciens
  alternative: harmoniser en « les notables du peuple et les anciens »
  rationale: La liste difficile du texte syriaque est maintenue plutôt que corrigée d’après des passages parallèles ou une reconstruction conjecturale.
translation_notes:
  register: Français international moderne, digne et lisible. « Me rendis auprès du peuple » garde le mouvement vers la communauté; la syntaxe de l’énumération reste volontairement proche du syriaque, avec une légère explicitation du référent de « ses habitants ».
