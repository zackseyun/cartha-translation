  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: fr
  text: 'Après avoir dit cela, je m’endormis là et j’eus une vision pendant la nuit. Voici ce que je vis : un nuage montait de la grande mer. Il était chargé d’eaux blanches et noires, et de nombreuses vagues agitaient ces eaux. À la tête du nuage apparaissait comme un grand éclair. Je regardai : ce nuage passa rapidement, dans une course violente, et couvrit toute la terre. Ensuite, des eaux se mirent à en descendre sur la terre, et je vis qu’elles n’avaient pas toutes le même aspect. Puis je vis de nouveau des eaux noires, ensuite des eaux lumineuses, puis encore des noires et encore des lumineuses. Cela se produisit jusqu’à douze fois, mais, chaque fois, les eaux noires étaient plus abondantes que les lumineuses.


    À la fin du nuage, des eaux noires et ténébreuses, plus sombres que toutes les eaux précédentes, descendirent. Elles étaient mêlées, et partout où elles descendaient, elles causaient ravage et destruction. Après cela, je vis l’éclair que j’avais vu à la tête du nuage : il saisit le nuage et l’entraîna jusqu’à terre. Ensuite, je vis douze fleuves[a] monter de la mer. Ils entourèrent cet éclair et se soumirent à lui ; ils se réjouirent de cette proclamation[b] et la louèrent. Alors je me réveillai, saisi de peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « douze lumières ».'
    reason: Variante textuelle due à des formes syriaques graphiquement proches.
  - marker: b
    text: 'Ou : « ils s’en réjouirent et le louèrent ».'
    reason: La construction syriaque et ses pronoms permettent de rapporter la joie et la louange à l’éclair plutôt qu’à la proclamation.
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: nuage
  rationale: Terme syriaque courant désignant un nuage ; le contexte le montre montant, se déplaçant et déversant des eaux.
- source_word: ܩ̈ܝܐ
  choice: eaux
  rationale: Dans cette vision, le terme désigne ce qui descend du nuage. « Eaux » maintient la cohérence avec les contrastes de couleur et avec le texte de contrôle, sans réduire l’image à une pluie ordinaire.
- source_word: ܐܘܟܡܐ / ܢܗܝܪܐ
  choice: noires / lumineuses
  rationale: Ce couple conserve l’opposition visuelle entre obscurité et clarté. « Lumineuses » est plus naturel en français pour qualifier des eaux que le littéral « brillantes ».
- source_word: ܒܪܩܐ
  choice: éclair
  rationale: Équivalent direct qui préserve l’image apocalyptique sans préciser s’il s’agit d’un simple éclat ou de la foudre comme phénomène complet.
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: dans une course violente
  rationale: Rend à la fois la rapidité du mouvement et sa force, sans atténuer l’expression syriaque.
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: ravage et destruction
  rationale: Le binôme français conserve les deux termes de ruine concrète et évite une lecture abstraitement théologique d’« abaddon » ou de « perdition ».
- source_word: ܐܚܕ ... ܘܐܬܚܬ
  choice: saisit ... et l’entraîna jusqu’à terre
  rationale: Les verbes associés expriment une prise suivie d’un mouvement forcé vers le bas ; cette formulation garde cette dynamique.
- source_word: ܢܗ̈ܪܐ/ܢܘܗ̈ܪܐ
  choice: fleuves
  rationale: La lecture « fleuves » s’accorde avec leur montée depuis la mer et avec le témoin de contrôle ; la proximité graphique de la lecture « lumières » justifie toutefois une note.
- source_word: ܟܪܘܙܐ
  choice: proclamation
  rationale: Le mot peut évoquer une proclamation ou un héraut. « Proclamation » suit ici la lecture contextuelle retenue tout en signalant dans une note l’ambiguïté de la construction finale.
theological_decisions:
- issue: Identification historique des eaux noires et lumineuses
  choice: Laisser les symboles sans identification dans ce verset
  alternative: Nommer les époques ou personnages auxquels l’interprétation ultérieure du livre les associe
  rationale: Le chapitre présente d’abord la vision, dont l’interprétation vient ensuite. Anticiper celle-ci supprimerait la progression du récit et résoudrait prématurément le symbolisme.
- issue: Lecture « douze fleuves » ou « douze lumières »
  choice: Retenir « douze fleuves » avec une note textuelle
  alternative: Retenir « douze lumières » dans le texte principal
  rationale: La cohérence narrative et le témoin de contrôle favorisent « fleuves », mais la forme syriaque transmise permet réellement l’autre lecture ; il faut donc préserver cette incertitude.
- issue: Référent de la louange dans la dernière proposition
  choice: Traduire la proclamation comme objet de la joie et de la louange, avec une note
  alternative: Comprendre que les douze fleuves se réjouissent au sujet de l’éclair et le louent
  rationale: La syntaxe et l’état du texte rendent les référents pronominaux incertains. La note maintient la tension sans imposer une interprétation théologique de l’éclair.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes de la vision sont conservées, tandis que la syntaxe est légèrement allégée pour rester claire à l’oral comme à l’écrit. Les images apocalyptiques ne sont ni expliquées ni confessionnalisées dans le corps du texte.
