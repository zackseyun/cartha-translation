translation:
  language: fr
  text: Ou qui peut sonder tes miséricordes, qui sont sans fin ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪ̈ܚܡܝܟ
  choice: tes miséricordes
  rationale: Le terme syriaque désigne les manifestations de compassion et de miséricorde de Dieu. Le pluriel français conserve cette pluralité et le registre théologique sans l’alourdir.
- source_word: ܢܒܨܐ
  choice: sonder
  rationale: Le verbe exprime une recherche approfondie visant à pénétrer ou découvrir pleinement une réalité; « sonder » rend cette idée avec naturel en français.
- source_word: ܕܠܐ ܡܣܬܝܟܝܢ
  choice: qui sont sans fin
  rationale: Cette formulation restitue directement l’idée de réalités dépourvues de limite ou de terme, dans une langue claire et courante.
theological_decisions:
- issue: Caractère insondable des miséricordes divines
  choice: La question rhétorique est conservée sans préciser davantage la nature de cette impossibilité.
  alternative: « Personne ne peut sonder tes miséricordes infinies. »
  rationale: La forme interrogative du texte maintient sa force poétique et sa tension théologique, sans transformer l’interrogation en affirmation explicative.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et poétique, avec le tutoiement adressé à Dieu conformément au contexte.
