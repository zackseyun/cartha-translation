  text: And I answered and said, “Who can comprehend your goodness, Lord? For it is beyond comprehension.”
translation:
  language: fr
  text: 'Et je répondis : « Qui peut comprendre ta bonté, Seigneur ? Car elle dépasse toute compréhension[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car elle est incompréhensible. »'
    reason: Cette traduction plus formelle conserve directement l’adjectif du témoin de contrôle, mais « dépasse toute compréhension » est plus naturel et moins susceptible d’évoquer en français quelque chose de confus ou d’absurde.
lexical_decisions:
- source_word: ܛܒܬܐ / bonitati tuae
  choice: ta bonté
  rationale: « Bonté » garde l’ampleur du terme désignant ici un attribut divin, sans le réduire à la seule bienveillance ni à la générosité.
- source_word: ܡܬܬܚܡܐ / incomprehensibilis
  choice: dépasse toute compréhension
  rationale: Cette formulation française naturelle exprime l’impossibilité de saisir pleinement la bonté divine, tout en évitant le sens courant parfois péjoratif d’« incompréhensible ».
- source_word: ܘܥܢܝܬ ܘܐܡܪܬ
  choice: Et je répondis
  rationale: Le français exprime naturellement la formule sémitique « je répondis et dis » par le seul verbe « répondre », sans perte de contenu.
theological_decisions:
- issue: Référent de ce qui dépasse toute compréhension
  choice: elle, c’est-à-dire la bonté du Seigneur
  alternative: le Seigneur lui-même
  rationale: La syntaxe transmise et la couche de contrôle rattachent l’affirmation à « ta bonté ». La traduction conserve ce lien explicite sans élargir silencieusement l’énoncé à l’incompréhensibilité générale de Dieu.
translation_notes:
  register: Français international moderne, sobre et solennel. Le vocatif « Seigneur » et la question directe préservent le ton de prière. La tournure redondante « je répondis et dis » est allégée conformément à l’équivalence optimale.
