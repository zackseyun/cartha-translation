  source_fidelity: 'La syntaxe conditionnelle du brouillon (« Car si… tu ne prends pas… en pitié ») ne rend pas correctement « unless » : le syriaque contrôlé et la piste anglaise expriment que l’accès dépend de la compassion divine. Le maintien de « sous ta main droite », de « parvenir à ces choses » et de « nombre excellent » préserve les images et l’ambiguïté du texte.'
  naturalness: « Dans ta compassion, tu ne prends pas les êtres humains en pitié » est lourd et, avec la double négation, ambigu en français. « À moins que, dans ta compassion, tu prennes les êtres humains en pitié » restitue clairement la condition tout en gardant un registre moderne et soutenu.
