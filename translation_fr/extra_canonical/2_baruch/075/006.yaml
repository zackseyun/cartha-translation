  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: fr
  text: Car, à moins que, dans ta compassion, tu prennes les êtres humains en pitié, ceux qui sont sous ta main droite ne peuvent parvenir à ces choses, sauf ceux qui sont appelés dans le nombre excellent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le nombre excellent » est obscure. Le texte ne précise ni le sens de ce « nombre » ni l’identité de ceux qui y sont appelés.
    reason: Signaler l’ambiguïté de l’expression sans identifier le groupe ni lui attribuer une catégorie théologique déterminée.
lexical_decisions:
- source_word: ܪ̈ܚܡܐ / compassion (reconstructed from the verse context and control reading)
  choice: dans ta compassion
  rationale: Conserve la notion de compassion divine sans la confondre avec le seul acte de faire grâce.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: les êtres humains
  rationale: Expression française inclusive et naturelle correspondant au collectif syriaque.
- source_word: ܬܚܝܬ ܝܡܝܢܟ / under your right hand (control reading)
  choice: sous ta main droite
  rationale: Maintient l’image sémitique de l’autorité et de la protection divines au lieu de l’expliciter.
- source_word: ܢܡܛܘܢ / come to, attain (control reading)
  choice: parvenir à
  rationale: Rend l’idée d’atteindre les réalités évoquées dans le contexte.
- source_word: ܒܡܢܝܢܐ ܡܝܬܪܐ / in the excellent number (control reading)
  choice: dans le nombre excellent
  rationale: Préserve la formulation énigmatique et son ambiguïté au lieu d’identifier ce groupe de manière doctrinale.
theological_decisions:
- issue: Rapport entre la compassion divine et l’accès aux biens annoncés
  choice: 'Conserver la condition négative : « si… tu ne… pas »'
  alternative: 'Reformuler positivement : « seule ta compassion permet… »'
  rationale: La formulation conditionnelle garde la tension du texte entre miséricorde divine et appartenance au groupe appelé.
- issue: Identité de « ceux qui sont appelés dans le nombre excellent »
  choice: Ne pas préciser leur identité
  alternative: Les identifier aux élus, aux justes ou aux sauvés
  rationale: Le texte ne tranche pas explicitement entre ces catégories; une précision importerait une interprétation théologique.
translation_notes:
  register: Français moderne, digne et accessible. La structure reste proche du syriaque, notamment pour « sous ta main droite » et « le nombre excellent », afin de préserver les images et l’ambiguïté du passage.
