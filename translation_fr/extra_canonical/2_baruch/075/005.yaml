  text: Or who among those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?
translation:
  language: fr
  text: Ou qui, parmi ceux qui sont nés, peut espérer parvenir à ces choses, à moins que tu ne lui fasses miséricorde et ne lui accordes ta grâce ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ceux qui sont nés
  choice: ceux qui sont nés
  rationale: Conserve l’expression anthropologique concrète du syriaque plutôt que de la réduire à « les humains ».
- source_word: parvenir à ces choses
  choice: parvenir à ces choses
  rationale: Maintient la référence volontairement générale aux réalités évoquées dans le contexte, sans en préciser artificiellement la nature.
- source_word: faire miséricorde / faire grâce
  choice: te montrer miséricordieux et bienveillant
  rationale: Rend naturellement en français deux dispositions divines proches mais distinctes, sans les fondre en un seul terme.
theological_decisions:
- issue: Rapport entre l’espérance humaine et la faveur divine
  choice: « sinon celui envers qui tu te montres miséricordieux et bienveillant »
  alternative: « à moins que tu ne lui fasses miséricorde et ne lui accordes ta grâce »
  rationale: 'La formulation retenue préserve la restriction du texte : l’accès espéré dépend de la miséricorde et de la bienveillance divines, sans définir davantage leur mode d’action.'
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique ainsi que le doublet « miséricordieux et bienveillant » sont conservés.
