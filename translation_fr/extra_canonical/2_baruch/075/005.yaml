revisions:
- from: Ou qui, parmi ceux qui sont nés, peut espérer parvenir à ces choses, sinon celui envers qui tu te montres miséricordieux et bienveillant ?
  to: Ou qui, parmi ceux qui sont nés, peut espérer parvenir à ces choses, à moins que tu ne lui fasses miséricorde et ne lui accordes ta grâce ?
  rationale: La révision remplace une paraphrase adjectivale par les expressions françaises établies « faire miséricorde » et « accorder sa grâce ». Elle maintient la question rhétorique, l’adresse à Dieu, l’ambiguïté de « ces choses » et la dépendance de l’accès espéré à la faveur divine.
