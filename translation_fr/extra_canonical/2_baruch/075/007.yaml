  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: fr
  text: Mais nous qui vivons[a], si nous savons pourquoi nous sommes venus et si nous nous soumettons[b] à celui qui nous a fait sortir[c] d’Égypte, nous reviendrons, nous nous souviendrons de ce qui s’est passé et nous nous réjouirons de ce qui a été.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous qui restons ».
    reason: Cette autre formulation appartient à la tradition de traduction, bien que le sens premier du verbe syriaque soit « vivre ».
  - marker: b
    text: Ou « si nous demeurons soumis » .
    reason: Le participe syriaque exprime une condition ou disposition présente et continue, parallèle à « nous savons ».
  - marker: c
    text: Ou « nous a conduits hors de » .
    reason: Le verbe syriaque exprime le fait de faire sortir ; cette variante en développe la nuance de conduite.
lexical_decisions:
- source_word: ܚܝܝܢ (ḥayyîn)
  choice: nous qui vivons
  rationale: Le verbe syriaque signifie « vivre ». Cette traduction exprime directement l’état des personnes en vie, sans lui substituer l’idée de demeurer.
- source_word: ܡܫܥܒܕܝܢܢ (mšaʿbdînan)
  choice: nous nous soumettons
  rationale: Le participe décrit une disposition présente et continue, en parallèle avec « nous savons ».
- source_word: ܐܦܩ (appeq)
  choice: a fait sortir
  rationale: Le causatif du verbe « sortir » signifie « faire sortir, conduire hors de » et évoque ici explicitement l’Exode.
- source_word: ܢܬܘܒ (netûb)
  choice: nous reviendrons
  rationale: Le verbe peut porter l’idée de retourner ou revenir; « reviendrons » conserve ici le mouvement de retour indiqué par le contexte.
theological_decisions:
- issue: Rapport entre connaissance, soumission et retour
  choice: Conserver la construction conditionnelle sans préciser la nature du retour
  alternative: Interpréter explicitement le retour comme une conversion ou une restauration eschatologique
  rationale: Le texte associe ces éléments sans définir ici le sens exact du retour; la traduction préserve cette ouverture.
- issue: Référence à la sortie d’Égypte
  choice: Traduire littéralement l’action de faire sortir d’Égypte
  alternative: Expliciter « Dieu, qui nous a délivrés d’Égypte »
  rationale: Le référent divin ressort du contexte, mais le texte met l’accent sur l’acte historique de la sortie plutôt que sur une formulation doctrinale de la délivrance.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le rythme conditionnel et mémoriel du syriaque, ainsi que l’ambiguïté du « retour », sans surcharge interprétative.
