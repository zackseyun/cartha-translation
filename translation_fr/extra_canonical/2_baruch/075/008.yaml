  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: fr
  text: Mais si nous ne savons pas maintenant pourquoi nous sommes venus et si nous ne reconnaissons pas ce qui a eu lieu, ni l’incommensurable ne sera discerné, ni la primauté de celui qui l’a établi dès le commencement ne sera reconnue ; et un nombre considérable d’êtres vivants seront saisis de stupeur. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܡܬܕܪܟܐ / ܕܠܐ ܡܣܬܝܟܝܢ
  choice: ce qui est sans mesure ne sera discerné
  rationale: Le contexte syriaque associe l’impossibilité de saisir ou de délimiter à ce qui dépasse l’entendement humain. « Discerner » conserve l’idée de perception intellectuelle sans transformer l’expression en affirmation purement visuelle.
- source_word: ܡܢ ܩܕܝܡ
  choice: dès le commencement
  rationale: Rend naturellement la valeur temporelle « depuis l’origine / auparavant », tout en conservant la portée cosmologique du passage.
- source_word: ܚܝܘ̈ܬܐ
  choice: êtres vivants
  rationale: Le terme peut désigner largement les vivants ou les créatures vivantes. « Êtres vivants » préserve cette extension sans la réduire aux animaux.
- source_word: ܬܗܪ / notion d’étonnement transmise par la tradition du verset
  choice: être frappés de stupeur
  rationale: Cette formulation française exprime un étonnement intense et convient au registre visionnaire du texte.
theological_decisions:
- issue: Identité de « celui qui l’a établi »
  choice: maintenir la désignation indirecte en minuscules
  alternative: expliciter « Dieu » ou employer une majuscule révérencielle
  rationale: Le texte désigne l’agent sans le nommer ici. L’expliciter résoudrait inutilement une référence que le contexte permet au lecteur d’identifier.
- issue: Référent du pronom dans « l’a établi »
  choice: conserver le singulier indéterminé « l’ »
  alternative: préciser « toutes choses » ou « l’ordre du monde »
  rationale: La formulation transmise laisse le référent peu explicite. La traduction préserve cette tension au lieu d’introduire une interprétation cosmologique précise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conditionnelle et le parallélisme négatif sont conservés, tandis que l’ordre des mots est légèrement adapté pour rester naturel en français.
