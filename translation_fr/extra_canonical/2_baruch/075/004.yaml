  rationale: Le verbe exprime ici l’idée de dénombrer, et non simplement de raconter ou d’exposer.
- source_word: ܡܚܫ̈ܒܬܐ
  choice: les pensées
  rationale: Rend directement le pluriel désignant les pensées ou desseins intérieurs.
- source_word: ܪ̈ܥܝܢܝ
  choice: de ton esprit
  rationale: « Esprit » exprime naturellement en français le siège intérieur des pensées; le possessif conserve l’adresse directe à Dieu.
theological_decisions:
- issue: Possibilité humaine de sonder la pensée divine
  choice: Conserver la question rhétorique sans expliciter la réponse.
  alternative: « Personne ne peut compter les pensées de ton esprit. »
  rationale: La formulation interrogative préserve la force poétique et théologique du texte sans transformer l’implicite en affirmation explicite.
