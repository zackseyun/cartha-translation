  text: But all those who have ruled over you, or have known you, all these shall be delivered to the sword.
translation:
  language: fr
  text: Mais tous ceux qui ont régné sur toi ou qui t’ont connue, tous ceux-là seront livrés à l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܛ / ܡܠܟ (notion de domination, d’après le contexte versifié)
  choice: ont exercé leur domination sur toi
  rationale: Cette formulation française naturelle conserve l’idée d’un pouvoir exercé sur la destinataire sans préciser indûment sa forme politique.
- source_word: ܝܕܥ (connaître)
  choice: t’ont connue
  rationale: Le verbe garde son sens large de connaissance ou de relation; le féminin s’accorde avec la destinataire implicite du passage.
- source_word: ܣܝܦܐ (épée)
  choice: l’épée
  rationale: L’image concrète du jugement violent est conservée plutôt que remplacée par une paraphrase comme «la mort».
theological_decisions:
- issue: Portée de «connaître»
  choice: Conserver «t’ont connue» sans expliquer la nature de cette connaissance.
  alternative: «ont eu affaire à toi» ou «ont été liés à toi»
  rationale: Le terme peut évoquer une connaissance directe ou une relation; la traduction ne tranche pas au-delà du texte.
- issue: Agent de la remise à l’épée
  choice: Employer le passif «seront livrés».
  alternative: Nommer Dieu comme agent du jugement.
  rationale: Le passif préserve l’implicite du texte et évite d’ajouter un agent qui n’est pas exprimé dans ce verset.
translation_notes:
  register: Français moderne, digne et accessible. La répétition «tous ceux… tous ceux-là» est maintenue pour rendre l’insistance du verset. Le corpus syriaque fourni est un ensemble de pages à chevauchement dont l’alignement exact du verset est incertain; la segmentation est donc contrôlée par la couche anglaise auditée, tandis que les choix lexicaux restent conformes aux notions sémitiques attestées.
