  text: Every people that has not known Israel and has not trampled the seed of Jacob—these are the ones that shall live.
translation:
  language: fr
  text: Tout peuple qui n’a pas connu Israël et qui n’a pas foulé aux pieds la descendance de Jacob vivra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܐ / ܥܡ̈ܡܐ
  choice: peuple
  rationale: « Peuple » rend naturellement le collectif ethnopolitique syriaque sans lui donner le sens moderne plus étroit d’État-nation.
- source_word: ܝܕܥ
  choice: connaître
  rationale: Le verbe garde son sens relationnel et cognitif général; rien n’impose ici de préciser « reconnaître ».
- source_word: ܕܫ / expression correspondant à « fouler »
  choice: fouler aux pieds
  rationale: Cette locution française conserve l’image concrète de l’écrasement et sa portée hostile.
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ / expression correspondant à « semence de Jacob »
  choice: descendance de Jacob
  rationale: « Descendance » exprime clairement le sens collectif de « semence » en français actuel, sans suggérer une semence matérielle.
- source_word: ܚܝܐ / forme correspondant à « vivre »
  choice: vivra
  rationale: Le choix suit le sens direct attesté par la couche de consultation et évite de transformer implicitement la survie en acquittement ou en salut théologique.
theological_decisions:
- issue: Portée de la promesse de vie
  choice: « vivra »
  alternative: « sera épargné » ou « sera sauvé »
  rationale: « Vivra » préserve l’indétermination entre survie, maintien en vie et portée eschatologique, sans résoudre la tension en faveur d’une doctrine particulière.
- issue: Sens de « connaître Israël »
  choice: traduction littérale « connaître Israël »
  alternative: « reconnaître Israël » ou « avoir eu affaire à Israël »
  rationale: La formulation conserve l’ambiguïté du verbe de connaissance au lieu d’imposer une nuance politique, relationnelle ou religieuse.
translation_notes:
  register: Français international moderne, sobre et solennel. La reprise « celui-là » conserve l’insistance démonstrative de la proposition finale. Le futur antérieur dans les relatives situe les conduites antérieures au verdict futur, tandis que « vivra » reste direct et accessible.
