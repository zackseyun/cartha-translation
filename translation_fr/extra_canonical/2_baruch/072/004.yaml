review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la proposition conditionnelle est conservé : les peuples qui n’ont pas connu Israël et n’ont pas foulé la descendance de Jacob sont ceux qui vivront. « Descendance » rend correctement le sens collectif de « semence » sans matérialiser l’expression. Le texte syriaque fourni est un extrait de pages englobant le chapitre et ne permet pas, à lui seul, d’isoler avec certitude la ligne du v. 4 ; la formulation anglaise de contrôle est donc suivie pour la segmentation du verset.'
  naturalness: Le futur antérieur (« n’aura pas connu », « n’aura pas foulé ») est grammatical, mais il ajoute une relation temporelle prospective que l’anglais de contrôle ne marque pas explicitement et alourdit inutilement la phrase. Le passé composé est plus idiomatique et plus sobre en français moderne dans cette formulation proverbiale/prophétique.
  terminology: « Israël », « Jacob », « peuple », « fouler aux pieds » et « descendance » sont appropriés. La reprise singulière « celui-là » est possible, mais elle est moins naturelle après « Tout peuple » et n’est pas nécessaire pour préserver le sens.
