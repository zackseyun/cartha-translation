base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: fr
  text: 'Voici la parole : après la venue des signes qui t’ont été annoncés auparavant, les nations seront plongées dans la confusion, et le temps de mon Messie viendra. Il convoquera toutes les nations ; certaines, il les gardera en vie, mais d’autres, il les fera mourir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ (melltā)
  choice: parole
  rationale: Dans cette formule d’introduction, « parole » rend naturellement le sens de déclaration ou de message, tout en conservant le registre prophétique.
- source_word: ܥܡܡ̈ܐ (‘ammē)
  choice: nations
  rationale: Le terme désigne des peuples ou nations collectivement ; « nations » convient au cadre eschatologique et évite de réduire le référent à de simples groupes ethniques.
- source_word: ܡܫܝܚܐ (mšiḥā)
  choice: Messie
  rationale: « Messie » est la translittération française usuelle du titre « oint » et préserve sa portée théologique sans l’interpréter davantage.
- source_word: notion source de maintien en vie
  choice: gardera en vie
  rationale: Cette formulation française actuelle exprime directement la préservation de la vie, sans introduire la nuance supplémentaire de pardon que pourrait suggérer « épargnera ».
theological_decisions:
- issue: L’expression possessive « mon Messie »
  choice: mon Messie
  alternative: le Messie
  rationale: Le possessif est conservé parce qu’il fait partie de la formulation transmise et marque la relation du locuteur au Messie ; le supprimer atténuerait une tension théologique réelle.
- issue: Le sort contrasté des nations convoquées
  choice: certaines seront gardées en vie, d’autres seront mises à mort
  alternative: certaines seront épargnées, d’autres condamnées
  rationale: La traduction conserve le contraste concret entre vie et mort sans transformer celui-ci en vocabulaire explicitement judiciaire ou sotériologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique est conservée, mais légèrement fluidifiée. « Il convoquera » exprime un appel officiel et universel ; la reprise pronominale dans « certaines, il les gardera » donne un contraste naturel et appuyé en français.
