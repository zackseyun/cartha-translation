  text: These, then, are the things that shall happen to those nations which are to be spared by him.
translation:
  language: fr
  text: Voici donc ce qui arrivera aux nations qu’il épargnera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܠܝܢ
  choice: ce qui
  rationale: Dans cette formule récapitulative, le démonstratif pluriel désigne l’ensemble des événements annoncés; « ce qui » est plus naturel en français que « ces choses ».
- source_word: ܥܡ̈ܡܐ
  choice: les nations
  rationale: Rend le pluriel collectif syriaque par le terme français courant dans ce contexte apocalyptique.
- source_word: ܢܫܬܒܩܘܢ
  choice: qu’il épargnera
  rationale: Le verbe peut exprimer le fait d’être laissé, préservé ou épargné; « épargnera » communique clairement ici la survie de certaines nations.
theological_decisions:
- issue: Identité de l’agent qui épargne les nations
  choice: Conserver le simple pronom « il » sans préciser son référent.
  alternative: Nommer explicitement Dieu ou le Messie.
  rationale: Le verset dépend du contexte pour l’antécédent; l’expliciter résoudrait une ambiguïté que le texte ne tranche pas ici.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « Voici donc ce qui arrivera » garde la fonction récapitulative du verset tout en évitant un calque lourd.
