  text: But hear also about the bright waters that are to come at the end, after these dark waters.
translation:
  language: fr
  text: Mais écoute aussi au sujet des eaux lumineuses qui doivent venir à la fin, après ces eaux sombres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: les eaux lumineuses
  rationale: Le qualificatif s’oppose symboliquement aux eaux sombres. « Lumineuses » conserve cette opposition eschatologique plus nettement que le simple « claires ».
- source_word: ܗܠܝܢ
  choice: ces
  rationale: Le démonstratif désigne les eaux sombres évoquées immédiatement auparavant ; « ces » en rend correctement la proximité discursive.
- source_word: ܒܫܘܠܡܐ / notion de fin reflétée par le contexte
  choice: à la fin
  rationale: Cette formulation naturelle conserve la portée terminale et eschatologique sans préciser davantage ce que le texte laisse implicite.
- source_word: formule d’introduction auditive
  choice: écoute aussi ce qui concerne
  rationale: Cette tournure française restitue l’appel à entendre ainsi que l’introduction d’un nouveau volet de l’explication.
theological_decisions:
- issue: Portée symbolique des eaux lumineuses
  choice: Conserver l’image sans l’identifier explicitement à un événement ou à une doctrine particulière
  alternative: Expliquer les eaux comme le règne messianique ou le salut final
  rationale: Le verset annonce la dernière phase lumineuse de la vision, mais ne développe pas encore lui-même son interprétation.
- issue: Rapport temporel entre les eaux sombres et les eaux lumineuses
  choice: « après ces eaux sombres »
  alternative: « après ces dernières eaux sombres »
  rationale: La succession doit être explicite, mais l’ajout de « dernières » serait inutile dans ce verset français et pourrait surdéterminer le référent.
translation_notes:
  register: Français international moderne, simple et digne. L’image apocalyptique des eaux est conservée telle quelle, avec une syntaxe fluide et sans explicitation confessionnelle.
