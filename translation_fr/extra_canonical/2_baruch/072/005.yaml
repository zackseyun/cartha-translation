  text: And this is because they shall be subjected, from among all the nations, to your people.
translation:
  language: fr
  text: Et cela arrivera parce que, parmi toutes les nations, ils seront soumis à ton peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܥܒܕܘܢ (lecture sous-jacente probable)
  choice: ils seront soumis
  rationale: Rend naturellement en français le passif syriaque exprimant l’assujettissement, sans préciser l’agent au-delà de ce que dit le contexte.
- source_word: ܡܢ ܟܠܗܘܢ ܥܡܡ̈ܐ (lecture sous-jacente probable)
  choice: parmi toutes les nations
  rationale: Conserve la valeur partitive de la préposition et la portée universelle du syntagme.
- source_word: ܠܥܡܟ (lecture sous-jacente probable)
  choice: à ton peuple
  rationale: Maintient le destinataire collectif au singulier et le rapport de soumission exprimé par la préposition.
theological_decisions:
- issue: Nature de la soumission des nations
  choice: Ne pas préciser s’il s’agit d’une domination politique, d’une sujétion eschatologique ou d’une autre forme d’assujettissement.
  alternative: Expliciter par « placés sous l’autorité de ton peuple » ou « asservis à ton peuple ».
  rationale: Le bref énoncé transmis ne définit pas la nature de cette soumission; une formulation neutre préserve cette indétermination.
translation_notes:
  register: Français moderne, clair et digne. « Et cela arrivera parce que » explicite sobrement le lien causal tout en restant proche du sens attesté par la couche de consultation anglaise; aucun marqueur de note n’est nécessaire.
