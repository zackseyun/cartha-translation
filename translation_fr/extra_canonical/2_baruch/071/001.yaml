  yaml_path: translation/extra_canonical/2_baruch/071/001.yaml
  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: fr
  text: La terre sainte aura compassion de ceux qui lui appartiennent et, en ce temps-là, elle protégera ses habitants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: la terre sainte
  rationale: Conserve la personnification apocalyptique de la terre ainsi que sa portée sacrée et covenantale, dans une expression française naturelle.
- source_word: ܬܪܚܡ
  choice: aura compassion de
  rationale: Exprime une compassion active avec un registre digne; cette tournure convient mieux en français actuel que «aura pitié de» dans ce contexte solennel.
- source_word: ܕܝܠܗ̇
  choice: ceux qui lui appartiennent
  rationale: Rend explicitement et naturellement l’idiome d’appartenance tout en maintenant le lien personnifié entre la terre et son peuple.
- source_word: ܬܢܛܪ
  choice: elle protégera
  rationale: Traduit clairement l’idée de garder et de préserver, sans préciser davantage le mode de cette protection.
- source_word: ܥܡܘܪ̈ܝܗ̇
  choice: ses habitants
  rationale: Désigne directement ceux qui résident dans la terre et préserve le rapport possessif du texte.
theological_decisions:
- issue: Maintien de la terre comme sujet agissant
  choice: la terre sainte aura compassion… elle protégera
  alternative: Dieu aura compassion des habitants de la terre et les protégera
  rationale: La tradition syriaque pertinente personnifie la terre. Il convient de préserver cette image apocalyptique plutôt que d’introduire explicitement Dieu comme sujet.
- issue: Sens de l’expression d’appartenance
  choice: ceux qui lui appartiennent
  alternative: les siens
  rationale: «Les siens» serait plus concis mais pourrait être moins immédiatement clair. La formulation retenue conserve le lien entre la terre personnifiée et son peuple sans l’identifier plus précisément.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme de la phrase et la personnification inhabituelle de la terre. Le texte syriaque fourni dans le compartiment de page correspond aux chapitres 68–70 et non à 71:1; la traduction suit donc le témoignage pertinent de 71:1 signalé par les contrôles et les données lexicales, plutôt que l’extrait de page mal aligné.
