lexical_decisions:
- source_word: ܐܬܐܒܠܘ (notion de deuil)
  choice: portez le deuil
  rationale: Cette expression rend une lamentation profonde et collective avec un registre digne, sans la réduire au simple fait de pleurer.
- source_word: ܐܬܬܢܚܘ (notion de gémissement)
  choice: gémissez
  rationale: Le verbe français conserve l’expression audible de la douleur et le parallélisme avec le premier impératif.
- source_word: connecteur conclusif
  choice: donc
  rationale: Placé après le verbe, « donc » donne une tournure française naturelle tout en maintenant le lien logique avec ce qui précède.
theological_decisions:
- issue: Objet de la lamentation
  choice: « sur Sion » et « sur Jérusalem »
  alternative: « pour Sion » et « pour Jérusalem »
  rationale: « Sur » présente les deux lieux comme l’objet d’une lamentation funèbre, sans déterminer davantage la nature ou la cause théologique du deuil.
