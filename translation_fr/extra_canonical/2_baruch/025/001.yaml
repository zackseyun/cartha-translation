base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: fr
  text: 'Alors il me répondit : « Toi aussi, tu seras préservé jusqu’à ce temps-là, jusqu’au signe[a] que le Puissant accomplira pour les habitants de la terre à la fin des jours. Voici quel sera ce signe : le désarroi s’emparera des habitants de la terre, et ils tomberont dans de nombreuses détresses, puis dans une profonde angoisse. Et lorsque, accablés par leur détresse, ils se diront : “Le Puissant ne se souvient plus de la terre”, et qu’ils auront perdu tout espoir, alors le temps s’éveillera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre fixé » ou « l’agencement établi ».
    reason: Le terme syriaque peut désigner non seulement un signe reconnaissable, mais aussi une disposition ou un ordre fixé.
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: signe
  rationale: Dans ce contexte apocalyptique, le mot désigne ce qui permet de reconnaître le temps annoncé. « Signe » exprime clairement cette fonction, tandis que la note conserve la nuance possible d’un ordre ou d’un agencement fixé.
- source_word: ܙܘ̈ܥܐ / langage du bouleversement
  choice: désarroi
  rationale: Le contexte évoque un bouleversement qui saisit les humains, et non la seule peur. « Désarroi » reste naturel en français tout en gardant cette force déstabilisante.
- source_word: ܐܘܠܨܢܐ
  choice: détresses
  rationale: « Détresses » rend les épreuves pressantes et croissantes sans imposer le sens technique que « tribulations » pourrait prendre dans certains milieux.
- source_word: ܡܪܝܡܢܐ
  choice: le Puissant
  rationale: Ce titre divin solennel conserve le registre apocalyptique sans ajouter explicitement « Dieu », absent du titre syriaque.
- source_word: ܡܬܕܟܪ
  choice: se souvient
  rationale: Cette formulation préserve l’image biblique de la mémoire divine et la vigueur de la plainte humaine.
- source_word: ܥܪ / image finale de l’éveil
  choice: s’éveillera
  rationale: La personnification du temps annoncé est conservée plutôt que réduite à une simple arrivée chronologique.
theological_decisions:
- issue: La plainte selon laquelle le Puissant ne se souvient plus de la terre
  choice: 'Conserver directement la plainte : « Le Puissant ne se souvient plus de la terre »'
  alternative: « Le Puissant ne se soucie plus de la terre » ou « n’intervient plus en faveur de la terre »
  rationale: Le passage rapporte la pensée désespérée des habitants, sans l’approuver. Adoucir cette parole affaiblirait la tension entre leur désespoir et l’intervention imminente.
- issue: Le sujet de l’éveil dans la dernière proposition
  choice: « le temps s’éveillera »
  alternative: « l’espoir s’éveillera »
  rationale: La lecture retenue suit la compréhension contextuelle d’un temps fixé qui entre soudainement en action, tout en gardant l’image surprenante du texte au lieu de l’expliquer.
translation_notes:
  register: Français international moderne, digne et accessible. Le titre divin « le Puissant » et l’image du temps qui s’éveille maintiennent la solennité apocalyptique. Les répétitions portant sur la terre et la détresse sont volontairement conservées.
