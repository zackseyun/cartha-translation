lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: Il me répondit
  rationale: La tournure syriaque littérale « il répondit et me dit » est une formule narrative. « Il me répondit » en restitue naturellement le sens en français moderne sans perdre l’idée de réponse.
- source_word: ܫܡܥ
  choice: Écoute
  rationale: L’impératif singulier appelle Baruch à prêter attention à la révélation qui suit.
- source_word: ܒܪܡ
  choice: donc
  rationale: Dans ce contexte, la particule marque la transition et l’insistance. « Donc » est plus naturel ici que le sens adversatif « cependant ».
- source_word: ܡܠܬܐ
  choice: la parole
  rationale: Le terme peut désigner une parole, un propos ou un message. « La parole » conserve sa formulation sobre et son caractère solennel sans préciser abusivement le contenu.
