  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: fr
  text: Et il arrivera qu’après qu’il aura abaissé tout ce qui est dans le monde et qu’il se sera assis en paix pour toujours sur le trône de son royaume, alors la joie sera révélée et le repos apparaîtra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour l’âge » au lieu de « pour toujours ».'
    reason: L’expression syriaque peut évoquer soit une durée perpétuelle, soit l’âge eschatologique.
lexical_decisions:
- source_word: ܢܡܟܟ / idée syriaque d’abaissement dans la tradition textuelle du verset
  choice: aura abaissé
  rationale: Conserve l’action d’abaisser ou de soumettre sans préciser par quel moyen ni transformer le verbe en « détruire ».
- source_word: ܠܥܠܡ
  choice: pour toujours
  rationale: Rend naturellement l’expression temporelle syriaque, qui peut aussi désigner « l’âge »; cette nuance est signalée en note.
- source_word: ܚܕܘܬܐ
  choice: la joie
  rationale: Équivalent français direct, courant et digne.
- source_word: ܢܝܚܐ
  choice: le repos
  rationale: Préserve le sens eschatologique ouvert de repos, sans le réduire à la paix intérieure ou à la cessation du travail.
theological_decisions:
- issue: Identité de celui qui siège sur le trône
  choice: Maintien du pronom « il » sans explicitation
  alternative: « le Messie » ou « Dieu »
  rationale: Le verset emploie une référence pronominale dépendante du contexte; l’expliciter résoudrait une donnée que le texte laisse implicite.
- issue: Durée du règne paisible
  choice: « pour toujours » dans le texte, avec variante en note
  alternative: « pour l’âge »
  rationale: « Pour toujours » est le français le plus naturel, tandis que la note préserve la portée possible d’un âge eschatologique.
translation_notes:
  register: Français international moderne, syntaxe solennelle mais claire. Le parallélisme final entre la joie révélée et le repos qui apparaît est conservé, de même que l’implicite du pronom masculin.
