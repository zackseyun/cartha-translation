lexical_decisions:
- source_word: ܗܠܝܢ
  choice: ces choses
  rationale: Le démonstratif reprend naturellement la série de réalités néfastes énumérées dans le contexte immédiat.
- source_word: ܥܠܡܐ
  choice: ce monde
  rationale: Rend le syriaque « monde » dans son sens ordinaire, sans le restreindre à la terre ni l’élargir à une notion théologique particulière.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: les êtres humains
  rationale: Formulation française actuelle et inclusive pour l’expression sémitique « fils des hommes / humains ».
- source_word: ܐ̈ܢܝܢ ܓܝܪ
  choice: Car ce sont
  rationale: Conserve la valeur explicative de la particule « car » et l’identification emphatique introduite par la copule.
theological_decisions:
- issue: Lien causal entre les maux énumérés et le trouble de la vie humaine
  choice: c’est à cause d’elles que
  alternative: par elles
  rationale: La formulation explicite le rapport causal indiqué par le texte sans attribuer ces maux à un agent théologique non mentionné.
- issue: Intensité du trouble subi par la vie humaine
  choice: profondément troublée
  alternative: grandement agitée
  rationale: Restitue l’intensité du propos dans un français naturel tout en évitant de préciser indûment la nature du trouble.
