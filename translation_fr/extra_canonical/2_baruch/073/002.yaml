  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: fr
  text: Alors la guérison descendra dans la rosée[a], l’inquiétude s’apaisera, et la détresse, la maladie et les gémissements fuiront loin des humains. Il y aura de la joie sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le syriaque transmis est difficile; on peut aussi comprendre « descendra avec la rosée » ou « descendra comme la rosée ».
    reason: Signaler une ambiguïté réelle de la formulation source sans la résoudre silencieusement.
lexical_decisions:
- source_word: ܒܒܘܣܡܐ … ܛܠܐ
  choice: avec la rosée
  rationale: La formulation syriaque transmise associe étroitement la guérison et la rosée, mais son agencement est difficile. « Avec la rosée » conserve cette image et son ambiguïté sans imposer une comparaison explicite.
- source_word: ܡܘܪܢܐ
  choice: l’inquiétude
  rationale: Le terme désigne ici un trouble ou une anxiété qui s’apaise; « inquiétude » est naturel et correspond au contraste avec le repos.
- source_word: ܕܘܝܐ ܘܟܘܪܗܢܐ ܘܐܢܚ̈ܬܐ
  choice: la détresse, la maladie et les gémissements
  rationale: Cette série distingue la souffrance ou misère, la maladie et les soupirs/gémissements; la traduction maintient les trois éléments.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: des humains
  rationale: Rend l’expression sémitique « fils des hommes » dans un français international naturel et inclusif, sans perte référentielle.
- source_word: ܬܗܘܐ ܚܕܘܬܐ ܒܟܠܗ̇ ܐܪܥܐ
  choice: La joie régnera sur toute la terre
  rationale: Exprime idiomatiquement l’existence généralisée de la joie dans toute la terre.
theological_decisions:
- issue: Nature de la guérison annoncée
  choice: Conserver le terme général « guérison »
  alternative: Préciser « guérison physique » ou « salut »
  rationale: Le texte ne limite pas explicitement la guérison à un domaine physique ou spirituel; la formulation générale préserve la portée eschatologique ouverte.
- issue: Rapport entre la guérison et la rosée
  choice: « descendra avec la rosée »
  alternative: « descendra comme la rosée » ou « descendra dans la rosée »
  rationale: Le syriaque transmis est difficile et permet plusieurs compréhensions. Le choix retenu garde l’association concrète sans transformer sûrement la rosée en comparaison.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve le mouvement poétique de l’annonce eschatologique, avec des termes accessibles et sans ajout confessionnel.
