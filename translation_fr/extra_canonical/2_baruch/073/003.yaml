  text: And no one will again die before his time, nor will any sudden adversity come to pass.
translation:
  language: fr
  text: Et personne ne mourra plus avant son heure, et aucun malheur soudain ne surviendra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܬܘܒ
  choice: Et plus
  rationale: 'Dans ce contexte, l’expression marque la cessation future d’une situation : « et désormais ne… plus ».'
- source_word: ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ
  choice: personne ne mourra avant son heure
  rationale: La tournure syriaque signifie littéralement « il ne mourra pas hors de son temps » ; l’expression française retenue en rend naturellement le sens temporel.
- source_word: ܡܕܡ ܡܥܝܩ
  choice: aucun malheur
  rationale: Le groupe désigne quelque chose d’affligeant ou d’oppressant ; « malheur » convient au contexte sans préciser indûment la nature de l’épreuve.
- source_word: ܢܓܕܫ
  choice: ne surviendra
  rationale: Le verbe exprime ce qui arrive ou se produit, souvent comme un événement subi.
- source_word: ܣܡܡܠܐ
  choice: soudain
  rationale: La lecture du témoin est textuellement difficile, mais le contexte et la tradition de traduction soutiennent l’idée d’un événement brusque ou inattendu.
theological_decisions:
- issue: Portée de la disparition de la mort prématurée
  choice: Conserver l’énoncé prospectif sans l’interpréter comme abolition totale de la mort.
  alternative: Traduire de manière à suggérer que personne ne mourra plus du tout.
  rationale: Le syriaque nie la mort « hors de son temps », non la mortalité en elle-même ; la traduction maintient cette distinction.
translation_notes:
  register: Français moderne, clair et digne. La formulation parallèle conserve les deux promesses du syriaque tout en évitant un calque peu naturel.
