  naturalness: La liste est fluide en français moderne. « Seront emportés vers la condamnation lorsqu’ils seront supprimés » reste toutefois quelque peu mécanique et « supprimés » évoque facilement une suppression éditoriale ou administrative. « Une fois ôtés, seront voués à la condamnation » est plus idiomatique tout en gardant les deux éléments de la formulation source.
  terminology: « Jugements », « accusations », « querelles », « représailles », « effusions de sang », « convoitises », « envie » et « haine » constituent une série de registre cohérent. « Représailles » demeure une interprétation possible de ܬܒ̈ܥܬܐ dans le contexte; elle peut être conservée sans note, puisque l’anglais POB retient également « retaliations ».
