  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: fr
  text: Les jugements, les accusations, les querelles, les représailles, les effusions de sang, les convoitises, l’envie, la haine et tout ce qui leur ressemble, une fois ôtés, seront voués à la condamnation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: les procès
  rationale: Le pluriel peut désigner des jugements ou des procédures judiciaires; « procès » convient à l’énumération des conflits humains sans introduire l’idée du jugement divin.
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: les accusations
  rationale: Terme de contexte judiciaire ou polémique, rendu conformément au sens d’accusations ou de mises en cause.
- source_word: ܚܪ̈ܝܢܐ
  choice: les querelles
  rationale: Exprime les disputes et les conflits, dans un français actuel.
- source_word: ܬܒ̈ܥܬܐ
  choice: les représailles
  rationale: Le terme peut évoquer poursuite, revendication ou vengeance; dans cette série de violences, « représailles » restitue la réciprocité vindicative sans surdéterminer le mode d’action.
- source_word: ܕܡܐ
  choice: les effusions de sang
  rationale: Le sens littéral est « sang »; l’expression française explicite ici la violence meurtrière visée par l’énumération.
- source_word: ܪ̈ܓܝܓܬܐ
  choice: les désirs passionnés
  rationale: Le mot désigne des convoitises ou passions; cette formulation garde une portée large, sans la limiter au seul domaine sexuel.
- source_word: ܚܣܡܐ
  choice: la jalousie
  rationale: Peut signifier envie ou jalousie; « jalousie » le distingue naturellement des désirs passionnés qui précèdent.
- source_word: ܣܢܐܬܐ
  choice: la haine
  rationale: Équivalent direct et naturel du terme syriaque.
- source_word: ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ
  choice: seront emportés vers la condamnation lorsqu’ils seront supprimés
  rationale: 'La formulation conserve le double mouvement du syriaque: ces réalités sont ôtées du monde et destinées à la condamnation, sans réduire l’un à l’autre.'
theological_decisions:
- issue: Nature de la condamnation des maux énumérés
  choice: « vers la condamnation »
  alternative: « disparaîtront dans la condamnation »
  rationale: La traduction garde l’orientation exprimée par la préposition syriaque sans préciser qui prononce la condamnation ni transformer explicitement l’image en anéantissement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’énumération est conservée, ainsi que la tension de la dernière proposition syriaque, dont l’enchaînement reste inhabituel.
