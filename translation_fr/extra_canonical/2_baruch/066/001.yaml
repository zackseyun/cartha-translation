  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: fr
  text: Et les dixièmes eaux lumineuses que tu as vues représentent la pureté de la génération de Josias, roi de Juda. Lui seul, en ce temps-là, se soumit au Puissant avec la plénitude de son cœur et de toute son âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܥܣܝܪ̈ܝܐ ܒܣܝ̈ܡܐ
  choice: les dixièmes eaux lumineuses
  rationale: Cette expression conserve le numéro et le motif structurant de l’alternance entre eaux sombres et eaux lumineuses dans la vision. « Lumineuses » convient mieux que « agréables » au contraste symbolique.
- source_word: ܕܫܘܝܐ
  choice: la pureté
  rationale: Le contexte décrit le rétablissement religieux et moral associé à Josias. « Pureté » rend cette valeur sans réduire le terme à la seule droiture morale.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Le terme fonctionne comme un titre divin. « Le Puissant » en garde la force révérencielle sans introduire un nom confessionnel absent du texte.
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: de toute la plénitude de son cœur et de toute son âme
  rationale: Cette formulation préserve la distinction du syriaque entre la « plénitude » du cœur et la totalité de l’âme, au lieu d’uniformiser les deux membres.
theological_decisions:
- issue: Nom royal endommagé à l’ouverture du chapitre
  choice: Josias, roi de Juda
  alternative: Amon, roi de Juda
  rationale: La lecture de la page est matériellement instable, mais les réformes décrites ensuite, la fonction des eaux lumineuses et la succession narrative désignent clairement Josias. Amon ne correspond ni à ce portrait ni à la logique de la vision.
- issue: Identification du destinataire de la soumission de Josias
  choice: au Puissant
  alternative: au roi
  rationale: Le mot ܡ̇ܠܟܐ visible dans le voisinage appartient à l’expression « roi de Juda » et ne doit pas être réutilisé comme titre du destinataire. La tradition textuelle contrôlée soutient ici le titre divin ܚܝܠܬܢܐ, « le Puissant ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la solennité apocalyptique, le titre divin et le parallélisme du cœur et de l’âme, tout en évitant une syntaxe excessivement calquée.
