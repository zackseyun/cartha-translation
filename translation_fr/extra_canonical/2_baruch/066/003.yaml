  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: fr
  text: Non seulement il tua les impies qui étaient vivants, mais ils retirèrent aussi des tombes les os de ceux qui étaient morts et les brûlèrent au feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le syriaque passe ici du singulier (« il tua ») au pluriel (« ils retirèrent… et les brûlèrent »), probablement pour désigner les agents du roi.
    reason: Signaler l’alternance réelle de sujet sans l’harmoniser ni identifier plus précisément le groupe pluriel.
lexical_decisions:
- source_word: ܠܨ̈ܥܨܥܐ
  choice: les impies
  rationale: Dans ce contexte de persécution religieuse, le terme désigne les personnes considérées comme impies; ce choix concorde avec le sens contextuel retenu par la couche de consultation anglaise.
- source_word: ܠܡܝ̈ܬܘܗܝ ܕܐܢܫܝܢ ܕܡܝܬܘ
  choice: les os des morts
  rationale: La formulation syriaque transmise est textuellement difficile, mais le contexte funéraire et la tradition de traduction indiquent les restes, plus précisément les os, de personnes mortes.
- source_word: ܡܢ ܩܒܪܐ
  choice: des tombeaux
  rationale: Rend naturellement l’idée d’une extraction hors des sépultures; le pluriel français convient au contexte sans modifier le contenu.
- source_word: ܒܙܘܪܐ
  choice: au feu
  rationale: La fin de la proposition est difficile dans la reproduction fournie; la lecture contextuelle et la tradition textuelle soutiennent l’idée de brûler les os au feu.
theological_decisions:
- issue: Alternance du sujet grammatical
  choice: Conserver « il tua », puis « ils sortirent… et les brûlèrent »
  alternative: Harmoniser tous les verbes au pluriel, comme dans la dernière révision anglaise
  rationale: Le syriaque présente un verbe singulier pour la mise à mort, puis des verbes pluriels pour l’exhumation et l’incinération. La traduction conserve cette alternance au lieu de la résoudre silencieusement; le pluriel peut viser les agents du roi.
translation_notes:
  register: Français moderne, clair et digne. « Étaient encore en vie » exprime naturellement le contraste avec « les morts ». La construction conserve l’alternance des sujets du syriaque et évite d’introduire une précision confessionnelle ou interprétative.
