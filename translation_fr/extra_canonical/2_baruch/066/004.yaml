  yaml_path: translation/extra_canonical/2_baruch/066/004.yaml
  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: fr
  text: Il brûla les magiciens dans le feu. Quant aux faux prophètes qui égaraient le peuple, il les livra eux aussi aux flammes. Et ceux qui les avaient écoutés de leur vivant, il les jeta dans le torrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܝ̈ܒ̣ܝܐ
  choice: les magiciens
  rationale: Le terme désigne ici ceux qui pratiquent les arts magiques; « magiciens » est naturel en français et convient au contexte de condamnation cultuelle.
- source_word: ܒܙܘܪܐ
  choice: par le feu / aux flammes
  rationale: Dans ce passage, la forme transmise est comprise comme renvoyant à la mise au feu. La variation française évite une répétition pesante sans changer le sens.
- source_word: ܢܚܠܐ
  choice: le torrent
  rationale: Le syriaque peut désigner un cours d’eau encaissé, un torrent ou un ravin. « Torrent » préserve l’image concrète sans préciser davantage le lieu.
theological_decisions:
- issue: Nature des personnes condamnées
  choice: Distinguer les magiciens des faux prophètes
  alternative: Fondre les deux groupes en une seule catégorie de praticiens religieux trompeurs
  rationale: La syntaxe présente des groupes distincts et doit conserver cette distinction sans harmonisation doctrinale.
- issue: Moment auquel le peuple les avait écoutés
  choice: « de leur vivant » renvoie aux faux prophètes
  alternative: Comprendre que le peuple auditeur était encore vivant
  rationale: Le pronom possessif syriaque se rapporte le plus naturellement aux personnes écoutées; la formulation française conserve ce rattachement contextuel.
translation_notes:
  register: Français international moderne, sobre et narratif. « Il les livra aux flammes » rend idiomatiquement la seconde mention de la peine par le feu, tandis que l’ordre emphatique de la dernière proposition est légèrement conservé.
