  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: fr
  text: Il purifia le pays de ses idoles, consacra de nouveau les objets qui avaient été profanés, rétablit les offrandes sur l’autel, releva la puissance des saints[a], exalta les justes et honora tous ceux qui étaient sages et intelligents. Il rétablit aussi les prêtres dans leur service et fit disparaître du pays les sorciers, les devins et ceux qui évoquaient les esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « releva la corne des saints »; la corne symbolise ici la force, la puissance ou la dignité.'
    reason: Conserver l’image sémitique du texte source tout en donnant une formulation claire dans le corps du verset.
lexical_decisions:
- source_word: ܕܚ̈ܠܬܐ / terme source sous-jacent relatif aux idoles
  choice: idoles
  rationale: Le contexte décrit une réforme cultuelle et l’élimination des objets d’un culte interdit; « idoles » est naturel et précis en français.
- source_word: ܡܐܢ̈ܐ / terme source sous-jacent pour les vessels
  choice: objets
  rationale: « Objets » convient mieux que le calque « vases » pour désigner de façon générale les objets cultuels profanés.
- source_word: ܩܪܢܐ
  choice: puissance
  rationale: La « corne » est une métaphore sémitique de force, de dignité et de puissance; le sens est rendu dans le texte, tandis que l’image littérale est signalée en note.
- source_word: ܩܕܝ̈ܫܐ
  choice: saints
  rationale: Ce choix conserve la catégorie religieuse du texte sans préciser indûment s’il s’agit des fidèles, des consacrés ou d’un groupe particulier.
- source_word: termes désignant trois catégories de praticiens occultes
  choice: sorciers, devins et ceux qui évoquaient les esprits
  rationale: Cette formulation garde trois catégories distinctes et rend la dernière de manière compréhensible, sans la confondre avec les pécheurs en général.
theological_decisions:
- issue: Identité des « saints »
  choice: les saints
  alternative: les consacrés
  rationale: Le texte ne permet pas de définir plus précisément le groupe; « saints » préserve cette ouverture.
- issue: Métaphore de la corne
  choice: releva la puissance des saints
  alternative: releva la corne des saints
  rationale: Le texte principal communique naturellement le sens de la métaphore en français moderne, et la note en conserve la forme sémitique.
translation_notes:
  register: Français international moderne, digne et lisible. La succession des actes de réforme est conservée, avec un vocabulaire cultuel clair et sans ajout confessionnel.
