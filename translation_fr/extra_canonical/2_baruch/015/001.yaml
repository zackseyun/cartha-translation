  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: fr
  text: 'Et le Seigneur me répondit :


    « Tu as raison de t’étonner de la disparition de l’être humain, mais ton jugement sur les malheurs qui frappent les pécheurs n’est pas juste.


    Quant à ce que tu as dit au sujet des justes qui sont emportés et des méchants qui prospèrent,


    et quant à ce que tu as dit — que l’être humain ne connaît pas mon jugement —,


    à cause de cela, écoute maintenant : je vais te parler. Sois attentif, et je te ferai entendre mes paroles.


    En effet, l’être humain n’aurait pas compris mon jugement s’il n’avait pas reçu la Loi et si je ne lui avais pas enseigné le discernement.


    Mais maintenant, puisqu’il a transgressé tout en comprenant, il sera certainement puni en raison même de cette compréhension.


    Quant aux justes, au sujet desquels tu as dit que le monde était venu à cause d’eux, le monde à venir est aussi pour eux.


    Car, pour eux, le monde présent est un combat et un labeur accompagnés de nombreuses détresses, mais le monde à venir est une couronne d’une grande gloire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: t’étonner
  rationale: Rend la réaction de stupeur devant la disparition humaine sans la réduire à une simple curiosité ni lui donner nécessairement le sens plus affectif de « se désoler ».
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: La majuscule et l’article défini expriment ici la Loi reçue comme révélation normative, tout en évitant d’ajouter une précision confessionnelle absente du texte.
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: discernement / compréhension
  rationale: « Discernement » convient à l’instruction morale reçue, tandis que « compréhension » souligne ensuite la connaissance qui rend la transgression responsable.
- source_word: ܐܝܩܪܐ
  choice: gloire
  rationale: Dans l’image finale de la couronne, « gloire » restitue la valeur d’honneur et de splendeur associée à la récompense future.
theological_decisions:
- issue: Pourquoi une connaissance plus grande entraîne-t-elle un jugement plus sévère ?
  choice: 'La compréhension reçue accroît la responsabilité : transgresser en connaissance de cause entraîne une condamnation fondée sur cette connaissance même.'
  alternative: La connaissance ne ferait qu’identifier le péché sans augmenter la responsabilité.
  rationale: L’enchaînement oppose l’absence hypothétique de Loi et de discernement à la transgression commise après les avoir reçus.
- issue: Rapport des justes au monde présent et à ce qui vient
  choice: Les justes connaissent maintenant le combat, le labeur et la détresse, tandis que ce qui vient leur apporte honneur et gloire.
  alternative: Le passage ne viserait que leur condition dans le monde présent.
  rationale: Le texte construit explicitement un contraste entre « le monde présent » et « ce qui vient », sans effacer ni l’épreuve actuelle ni la récompense future.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « quant à ce que tu as dit » et l’opposition entre le présent et « ce qui vient » sont conservées afin de respecter la progression argumentative. « L’être humain » rend la portée générique de « l’homme » sans donner au passage un sens exclusivement masculin.
