  yaml_path: translation/extra_canonical/2_baruch/001/002.yaml
  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: fr
  text: '« Tu as vu tout ce que ce peuple m’a fait : le mal qu’ont commis les deux tribus qui sont restées est plus grand que celui des dix tribus qui ont été emmenées en captivité. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: Tu as vu
  rationale: Rend directement l’accompli syriaque à la deuxième personne du singulier.
- source_word: ܕܥܒܕ ܠܝ
  choice: m’a fait
  rationale: Conserve la tournure relationnelle littérale « a fait à moi », naturelle en français sous cette forme.
- source_word: ܒܝ̈ܫܬܐ
  choice: le mal
  rationale: Le pluriel morphologique peut désigner collectivement les mauvaises actions; le singulier collectif français convient au parallèle comparatif.
- source_word: ܫܪ̈ܒܢ
  choice: tribus
  rationale: Dans le contexte des deux et des dix divisions d’Israël, « tribus » est l’équivalent contextuel naturel.
- source_word: ܕܐܫܬܚܪܝ
  choice: qui sont restées
  rationale: Traduit le passif syriaque au singulier collectif par un pluriel français accordé avec « deux tribus », sans préciser davantage la nature de leur maintien.
- source_word: ܕܐܫܬܒܝܘ
  choice: qui ont été emmenées en captivité
  rationale: Exprime clairement le passif du verbe signifiant être fait captif ou déporté.
theological_decisions:
- issue: Responsabilité comparative des deux tribus et des dix tribus
  choice: « le mal […] est plus grand que celui […] »
  alternative: « les mauvaises actions […] dépassent celles […] »
  rationale: La formulation garde l’accusation comparative explicite du syriaque sans expliquer pourquoi les deux tribus sont jugées plus coupables.
- issue: Référent des « deux tribus »
  choice: Conserver simplement « les deux tribus »
  alternative: Identifier Juda et Benjamin
  rationale: Le texte ne nomme pas ici les tribus; ne pas les identifier préserve la formulation de la source et évite une explicitation interprétative.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct et la structure comparative de la source sont conservés; les formulations inutilement archaïques sont évitées.
