base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: fr
  text: C’est pourquoi, voici que je fais venir le malheur sur cette ville et sur ses habitants. Elle sera ôtée de devant moi pour un temps, et je disperserai ce peuple parmi les nations, afin qu’il fasse du bien aux nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’il soit utile aux nations »; le syriaque exprime l’idée de leur apporter un avantage.'
    reason: La valeur exacte du verbe final peut se rendre soit par l’action de faire du bien, soit par le fait d’être utile.
lexical_decisions:
- source_word: ܒܝܫܬܐ (bīštā)
  choice: le malheur
  rationale: Dans ce contexte de jugement frappant une ville, le terme désigne une calamité plutôt que le mal moral; « le malheur » est naturel en français et conserve la gravité du propos.
- source_word: ܘܬܬܬܪܝܡ (w-tettrīm)
  choice: Elle sera ôtée
  rationale: Le verbe exprime l’idée d’enlever ou de retirer. Le sujet féminin le plus naturel est « cette ville ».
- source_word: ܥܕ ܙܒܢܐ (ʿad zabnā)
  choice: pour un temps
  rationale: L’expression marque une durée limitée sans en préciser la longueur.
- source_word: ܡܒܕܪ ܐܢܐ (mbaddar ʾnā)
  choice: je disperserai
  rationale: Le verbe signifie répandre ou disperser; le futur français convient à l’annonce du jugement.
- source_word: ܕܠܥܡܡ̈ܐ ܢܘܬܪ (d-la-ʿammē nūtar)
  choice: afin qu’il fasse du bien aux nations
  rationale: La forme issue de la racine ܝܬܪ exprime ici l’idée d’apporter un avantage ou un bienfait. Le verbe syriaque au singulier reprend le collectif « ce peuple ».
theological_decisions:
- issue: Dieu fait venir ܒܝܫܬܐ sur la ville
  choice: je fais venir le malheur
  alternative: je fais venir le mal
  rationale: « Malheur » indique un jugement calamiteux sans laisser entendre que Dieu produirait le mal moral.
- issue: Finalité de la dispersion parmi les nations
  choice: afin qu’il fasse du bien aux nations
  alternative: afin qu’il soit utile aux nations
  rationale: Le texte syriaque transmis évoque le bénéfice apporté aux nations. La formulation retenue reste concrète et compréhensible sans préciser la nature de ce bienfait.
translation_notes:
  register: Français moderne, international et digne. « Voici que » conserve la solennité prophétique; la syntaxe reste fluide pour un lectorat général. Le pronom « elle » renvoie explicitement à la ville, tandis que « il » reprend le nom collectif « ce peuple ».
