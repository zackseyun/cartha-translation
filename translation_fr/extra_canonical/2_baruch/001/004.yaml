review_pass:
  verdict: revise
  source_fidelity: Le texte syriaque fourni porte à la fin ܕܠܥܡܡ̈ܐ ܢܘܬܪ, dont le verbe de la racine ܝܬܪ exprime l’utilité, le profit ou le bénéfice apporté aux nations. Il ne porte pas ici « être serviteur des nations ». La traduction française doit donc suivre le témoin syriaque, tout en signalant sobrement la divergence avec le rendu anglais issu d’une autre lecture signalée dans l’audit.
  naturalness: « Elle sera ôtée de devant moi » est compréhensible mais calque une tournure sémitique et demeure peu naturelle. « Elle sera retirée de devant moi » conserve l’image et le registre prophétique avec une syntaxe française plus fluide. « Afin qu’il soit utile aux nations » rend naturellement le singulier collectif de « ce peuple ».
  terminology: « Malheur » convient pour ܒܝܫܬܐ dans une annonce de jugement. « Nations » rend correctement ܥܡܡ̈ܐ. La note actuelle présente l’alternative comme une incertitude lexicale interne alors que le texte syriaque transmis est suffisamment clair; il vaut mieux documenter la divergence de tradition/rendu qui affecte réellement le sens.
  issues:
  - severity: high
    issue: La note de bas de page ne rend pas compte de la divergence substantielle avec l’audit anglais (« servants to the nations »).
    rationale: Le texte syriaque fourni lit ܢܘܬܪ (« être utile / apporter un bénéfice »), tandis que l’audit anglais invoque une lecture ܥܒܕܝܢ (« serviteurs »). Une note doit identifier cette divergence sans substituer silencieusement la lecture anglaise au texte source fourni.
  - severity: low
    issue: « Elle sera ôtée de devant moi » est une formulation française raide.
    rationale: « Retirée de devant moi » préserve le sens de l’éloignement temporaire et améliore la lisibilité.
  revised_text: C’est pourquoi, voici que je fais venir le malheur sur cette ville et sur ses habitants. Elle sera retirée de devant moi pour un temps, et je disperserai ce peuple parmi les nations, afin qu’il soit utile aux nations.[a]
  revised_footnotes:
  - marker: a
    text: 'Le syriaque transmis porte : « afin qu’il soit utile aux nations » ou « afin qu’il leur apporte un bénéfice ». Une autre lecture, suivie par certains rendus, donne : « afin qu’ils soient serviteurs des nations ».'
    reason: Le texte source fourni contient le verbe ܢܘܬܪ (« être utile, profiter »), tandis que l’audit anglais signale une lecture divergente « serviteurs ». La note préserve cette ambiguïté textuelle sans imposer l’une des lectures au corps du texte.
  revision_rationale: La révision suit d’abord la leçon du texte syriaque soumis, qui soutient l’idée d’utilité ou de bénéfice pour les nations. Elle remplace une note qui formulait artificiellement cette leçon comme une simple hésitation sémantique par une note qui décrit la véritable divergence textuelle signalée par l’audit anglais. Une légère amélioration stylistique rend également le retrait de la ville plus naturel en français.
