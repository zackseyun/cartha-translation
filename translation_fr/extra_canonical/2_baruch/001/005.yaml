  yaml_path: translation/extra_canonical/2_baruch/001/005.yaml
  text: And my people will be chastened, and the time will come when they will seek the prosperity of their times.”
translation:
  language: fr
  text: Et mon peuple sera châtié. Le temps viendra où ils rechercheront la prospérité de leur époque.[a] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le temps viendra, et ils rechercheront la prospérité de leurs temps. »'
    reason: La coordination syriaque permet de maintenir deux propositions successives, et le pluriel « leurs temps » peut être rendu littéralement.
lexical_decisions:
- source_word: ܘܡܬܪܕܐ
  choice: sera châtié
  rationale: Le participe passif exprime une discipline ou une correction subie; « châtié » conserve cette force sans préciser davantage l'agent.
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: la prospérité
  rationale: Le nom désigne la réussite, le bien-être ou la prospérité; ce dernier terme convient au contexte collectif et temporel.
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: de leur époque
  rationale: Le pluriel syriaque signifie littéralement « de leurs temps »; le singulier collectif « leur époque » est plus naturel en français tout en gardant la référence aux temps qui sont les leurs.
theological_decisions:
- issue: Nature du châtiment du peuple
  choice: « sera châtié »
  alternative: « sera corrigé » ou « sera discipliné »
  rationale: Le texte présente une action punitive ou corrective sans en fixer explicitement la portée théologique; « châtié » préserve cette tension.
- issue: Lien syntaxique entre la venue du temps et la recherche
  choice: « Le temps viendra où ils rechercheront »
  alternative: « Le temps viendra, et ils rechercheront »
  rationale: La coordination syriaque peut recevoir une lecture temporelle naturelle, mais la note conserve la structure coordonnée possible.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la sévérité de l'annonce et l'ambiguïté du lien entre les deux dernières propositions.
