  yaml_path: translation/extra_canonical/2_baruch/001/003.yaml
  text: For the former tribes were compelled by their kings to sin, but these two tribes themselves desired to sin and compelled their kings to sin.
translation:
  language: fr
  text: En effet, les premières tribus furent contraintes par leurs rois à pécher ; mais ces deux tribus, elles, voulurent pécher et contraignirent leurs rois à pécher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ ܩܕ̈ܡܝܬܐ
  choice: les premières tribus
  rationale: Rend directement l’expression syriaque désignant les tribus antérieures, en contraste avec les deux tribus restées dans le pays.
- source_word: ܐܬܐܠܨܘ
  choice: furent contraintes
  rationale: Le passif exprime une pression imposée par leurs rois, et prépare le renversement du second membre.
- source_word: ܚܨܘ
  choice: poussèrent
  rationale: Dans le texte syriaque fourni, ce verbe évoque l’action de presser ou de pousser quelqu’un, plutôt qu’un simple désir intérieur. « Poussèrent » est naturel en français et maintient la distinction avec le verbe plus fort qui suit.
- source_word: ܐܠܨܘ
  choice: contraignirent
  rationale: 'Reprend le lexème de contrainte du premier membre sous une forme active et conserve ainsi le contraste rhétorique : d’abord les rois contraignent les tribus, puis les deux tribus contraignent leurs rois.'
theological_decisions:
- issue: Responsabilité respective des rois et des tribus dans le péché
  choice: Conserver le renversement explicite entre les anciennes tribus, contraintes par leurs rois, et les deux tribus, qui poussèrent puis contraignirent leurs rois.
  alternative: Présenter les deux tribus comme ayant simplement « désiré pécher » avant de contraindre leurs rois.
  rationale: Le texte syriaque fourni porte ܚܨܘ, qui décrit ici une action exercée sur les rois. La traduction ne doit donc pas déplacer sans nécessité l’accent vers leur seule volonté intérieure.
translation_notes:
  register: 'Français moderne, digne et lisible. La répétition de « contraindre » est volontaire : elle reproduit le renversement lexical et moral du syriaque. « Ces deux tribus-ci » marque nettement le contraste déictique avec les premières tribus.'
