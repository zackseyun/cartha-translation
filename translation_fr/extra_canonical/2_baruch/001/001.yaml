base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: fr
  text: 'Il arriva, dans la vingt-cinquième année de Jéconias, roi de Juda, que la parole du Seigneur parvint à[a] Baruch, fils de Néria, et lui dit[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vint sur » Baruch.'
    reason: La préposition syriaque ܥܠ signifie d’abord « sur », mais « parvint à » est plus naturel dans cette formule prophétique française.
  - marker: b
    text: 'Ou : « en disant ».'
    reason: Cette autre formulation française rend le dernier verbe comme une introduction au discours direct et évite de faire de « la parole » le sujet explicite de « dit ».
lexical_decisions:
- source_word: ܗܘܐ ܒܫܢܬ ܥܣܪܝܢ ܘܚܡܫ ܕܝܘܟܢܝܐ
  choice: La vingt-cinquième année de Jéconias
  rationale: Cette formulation suit la construction syriaque sans ajouter explicitement « du règne de », absent du texte, tout en employant la forme française biblique usuelle du nom.
- source_word: ܦܬܓܡܗ ܕܡܪܝܐ
  choice: la parole du Seigneur
  rationale: Rend directement la formule prophétique syriaque dans un français biblique clair et courant.
- source_word: ܗܘܐ ... ܥܠ ܒܪܘܟ
  choice: parvint à Baruch
  rationale: « Parvint à » exprime naturellement en français la venue de la parole divine, tandis qu’une note conserve la valeur plus littérale de la préposition « sur ».
- source_word: ܒܪ ܢܪܝܐ
  choice: fils de Nérias
  rationale: Conserve la filiation explicite et emploie la forme française traditionnelle du nom.
- source_word: ܘܐܡܪ ܠܗ
  choice: et lui dit
  rationale: Préserve la coordination et la personnification syntaxique de « la parole » présentes dans le syriaque, sans les réduire silencieusement à une simple formule introductive.
theological_decisions:
- issue: Sujet implicite de « dit »
  choice: Maintenir « la parole du Seigneur » comme sujet grammatical de « et lui dit »
  alternative: « et le Seigneur lui dit » ou « en ces termes »
  rationale: Le syriaque enchaîne directement la venue de la parole et le verbe « dire ». La traduction conserve cette tension plutôt que d’identifier explicitement le sujet au Seigneur ou de fondre les deux propositions.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique reste perceptible sans produire un calque inutilement raide.
