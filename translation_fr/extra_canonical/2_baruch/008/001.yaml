base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: fr
  text: '1 Je vis qu’il entra dans le Saint des saints et qu’il en prit les voiles, l’éphod, l’autel, le propitiatoire, les deux tables[a], les vêtements sacrés des prêtres, l’encensoir[b], les quarante-huit pierres précieuses et tous les ustensiles sacrés du tabernacle. Puis il dit à la terre d’une voix forte : « Terre, terre, terre, écoute la parole du Dieu puissant. Reçois les objets que je te confie et garde-les jusqu’aux derniers temps. Lorsque tu en recevras l’ordre, rends-les, afin que les étrangers ne puissent pas s’en glorifier. Car le temps approche où Jérusalem, elle aussi, sera livrée pour un temps, jusqu’à ce qu’il soit dit qu’elle sera rétablie de nouveau pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les deux tablettes ». Le sens précis du terme syriaque est incertain dans cette liste ; il s’agit probablement des tables de l’alliance.'
    reason: L’incertitude concerne l’identification sémantique de l’objet, non la lecture matérielle du mot syriaque.
  - marker: b
    text: L’identification exacte de cet objet cultuel est incertaine ; on a aussi proposé une pièce du vêtement ou de la parure sacerdotale.
    reason: Le témoin syriaque disponible ne permet pas d’identifier l’objet avec une entière certitude.
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: le Saint des saints
  rationale: Expression cultuelle consacrée qui rend naturellement en français le superlatif sémitique désignant le sanctuaire intérieur.
- source_word: ܦܪ̈ܘܟܬܐ
  choice: les voiles
  rationale: Le terme désigne les tentures du sanctuaire ; « voiles » conserve ici leur fonction cultuelle.
- source_word: ܚܘܣܝܐ
  choice: le propitiatoire
  rationale: Équivalent français traditionnel et précis du couvercle cultuel associé à l’arche, tout en respectant l’identification probable de cet objet dans une liste textuellement fragile.
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: les deux tables
  rationale: La leçon transmise est instable, mais l’inventaire traditionnel favorise les tables de l’alliance ; la formulation courte évite d’ajouter une précision absente du témoin.
- source_word: ܦܝܪܡܐ
  choice: l’encensoir
  rationale: Cette identification cultuelle est probable dans le contexte, bien que le mot et la transmission de la liste laissent subsister une incertitude.
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: Terre, terre, terre
  rationale: La triple apostrophe est conservée pour respecter la solennité et la force rhétorique du syriaque.
theological_decisions:
- issue: Dépôt des objets sacrés dans la terre
  choice: La terre reçoit activement les objets, les garde jusqu’aux derniers temps et les rend sur ordre.
  alternative: Présenter la scène comme un simple enfouissement ou une perte des objets.
  rationale: Le passage décrit une sauvegarde ordonnée par Dieu en vue d’une restitution, non une disparition accidentelle.
- issue: Durée de la remise de Jérusalem
  choice: « livrée pour un temps » puis « rétablie de nouveau pour toujours »
  alternative: Comprendre la remise de la ville comme définitive ou effacer la tension temporelle du passage.
  rationale: La traduction maintient le contraste du texte entre une période de jugement limitée et un rétablissement durable, sans préciser davantage son accomplissement.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition rhétorique et le vocabulaire cultuel traditionnel sont conservés ; les incertitudes réelles de la liste sont signalées en notes plutôt que résolues silencieusement.
