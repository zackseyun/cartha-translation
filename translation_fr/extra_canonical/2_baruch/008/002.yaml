  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: fr
  text: '« Abattez ses murailles et renversez-les jusque dans leurs fondations, de peur que les ennemis ne se vantent en disant : “C’est nous qui avons abattu la muraille de Sion et brûlé la demeure du Dieu puissant.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: ses murailles
  rationale: Le nom apparaît ici sous une forme plurielle dans le texte syriaque fourni ; « murailles » convient naturellement à l’enceinte de Sion.
- source_word: ܥܘܪ̈ܩܘ
  choice: renversez-les jusque dans leurs fondations
  rationale: Le contexte décrit une destruction complète atteignant les fondations ; cette formulation française conserve l’image sans introduire l’idée plus précise d’un déracinement végétal.
- source_word: ܢܫܬܒܗܪܘܢ
  choice: ne se vantent
  rationale: Rend directement l’idée de se glorifier ou de tirer orgueil d’un exploit revendiqué.
- source_word: ܕܘܟܬܐ
  choice: la demeure
  rationale: Dans ce contexte sacré, « demeure » traduit naturellement le lieu associé à Dieu sans préciser davantage qu’il ne le faut.
- source_word: ܐܠܗܐ ܚܝܒܬܐ
  choice: du Dieu puissant
  rationale: Suit le sens retenu par le témoin de consultation tout en employant une désignation française sobre et traditionnelle.
theological_decisions:
- issue: Désignation divine finale
  choice: le Dieu puissant
  alternative: le Dieu fort
  rationale: « Dieu puissant » est naturel en français moderne et ne transforme pas l’expression en titre confessionnel spécialisé.
translation_notes:
  register: Style direct, solennel et intelligible. Le verset est strictement limité à l’ordre de destruction et à sa motivation ; le contenu des versets adjacents présent dans la page source n’est pas inclus.
