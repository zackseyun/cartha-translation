  text: Or if someone sows the earth, unless he loses instead of his fruits, is he afterward ruined by famine?
translation:
  language: fr
  text: Ou encore, celui qui ensemence la terre, à moins qu’il ne perde au lieu d’en recueillir les fruits, la famine le ruinera-t-elle ensuite ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte syriaque de cette phrase est difficile et paraît irrégulier. Littéralement : « à moins qu’il ne perde à la place de ses fruits, la famine ne le détruit plus ». La traduction conserve donc l’incertitude de la formulation.'
    reason: Signaler une difficulté textuelle réelle sans corriger silencieusement le texte ni imposer une reconstruction conjecturale.
lexical_decisions:
- source_word: ܕܙܪܥ ܐܪܥܐ
  choice: qui ensemence la terre
  rationale: Rend directement le verbe « semer » et son objet, dans un français naturel.
- source_word: ܡܘܒܕ
  choice: qu’il ne perde
  rationale: Le participe verbal peut exprimer le fait de perdre ou de détruire; dans le contexte agricole, « perdre » convient mieux sans préciser un objet absent du texte.
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: au lieu d’en recueillir les fruits
  rationale: ܚܠܦ signifie « à la place de / en échange de » et ܦܐܪ̈ܘܗܝ « ses fruits ». L’ajout minimal de « recueillir » rend l’opposition compréhensible en français, tout en maintenant l’étrangeté du syriaque.
- source_word: ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: la famine le ruinera-t-elle
  rationale: ܚܒܠ exprime l’idée de détruire, ravager ou ruiner; la tournure interrogative correspond à la série de questions rhétoriques du passage.
- source_word: ܠܐ ܬܘܒ
  choice: ensuite
  rationale: Le groupe signifie littéralement « non plus / de nouveau »; dans la question française, « ensuite » conserve la progression temporelle reflétée par la consultation anglaise, sans alourdir la phrase.
