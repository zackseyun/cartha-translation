  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: fr
  text: '1 Il arriva, après cela, et voici que j’entendis une voix et que je vis une puissance qui s’était fixée sur moi. Une voix se fit entendre d’en haut et me dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܐ (ḥaylā)
  choice: une puissance
  rationale: Le terme peut désigner la force, la puissance ou une manifestation puissante. « Puissance » garde cette ampleur sans préciser indûment la nature du phénomène.
- source_word: ܕܐܬܩܒܥ ܠܝ (d-’etqba‘ lī)
  choice: se poser sur moi
  rationale: Le verbe exprime l’idée d’être établi, fixé ou placé. Dans ce contexte visionnaire, « se poser sur moi » est naturel en français tout en conservant l’image d’une puissance venant s’établir sur Baruch.
- source_word: ܡܢ ܡܪܘܡܐ (men mrōmā)
  choice: venue d’en haut
  rationale: Rend directement l’origine élevée ou céleste de la voix sans ajouter une identification explicite absente de la formulation.
theological_decisions:
- issue: Nature de la « puissance » vue par Baruch
  choice: Ne pas l’identifier explicitement à l’Esprit, à un ange ou à Dieu
  alternative: Préciser « la puissance de Dieu » ou « l’Esprit »
  rationale: Le syriaque parle simplement d’une puissance; préserver cette indétermination respecte la tension du récit visionnaire.
translation_notes:
  register: Français moderne, digne et narratif. « Voici que » conserve la valeur présentative de ܗܐ sans lourdeur excessive; la répétition de « voix » est maintenue, conformément au texte source.
