translation:
  language: fr
  text: Ou bien une femme enceinte, si elle accouche sans douleurs, ne s’attend-elle pas à avoir dans son sein un enfant mort[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un tué » ou « un mort » ; le syriaque sous-entend ici l’enfant.'
    reason: Signaler le sens propre du terme et l’explicitation contextuelle nécessaire en français.
lexical_decisions:
- source_word: ܐܢܬܬܐ ܕܒܛܢܐ
  choice: une femme enceinte
  rationale: Rend directement l’expression syriaque désignant une femme qui porte un enfant.
- source_word: ܕܠܐ ܟܐܒ̈ܐ
  choice: sans douleurs
  rationale: Traduction naturelle du pluriel « douleurs », ici celles de l’accouchement.
- source_word: ܡܣܒܪܐ
  choice: s’attend-elle
  rationale: Le verbe peut exprimer l’attente ou la supposition; « s’attendre » conserve ici la formulation rhétorique sans la surinterpréter.
- source_word: ܩܛܝܠܐ
  choice: un enfant mort
  rationale: Le terme signifie littéralement « tué » ou « mort »; dans le contexte de la grossesse, le référent implicite est l’enfant.
- source_word: ܒܥܘܒܗ̇
  choice: dans son sein
  rationale: « Sein » garde le registre dignifié de l’image du ventre maternel.
theological_decisions:
- issue: Nature de la question rhétorique
  choice: Conserver la question sans expliciter sa portée figurative
  alternative: Expliquer que l’image illustre l’attente d’un aboutissement après l’épreuve
  rationale: Le verset présente une comparaison dont l’application dépend du contexte; l’expliciter dans le texte résoudrait une tension que le syriaque laisse ouverte.
translation_notes:
  register: Français moderne, naturel et digne. La structure interrogative et l’image obstétricale du syriaque sont conservées; la formulation évite d’ajouter une interprétation doctrinale.
