  text: Or if someone plants a vineyard, unless he takes from it fruit for nourishment, does not the one who planted it expect to take fruit from it?
translation:
  language: fr
  text: Ou encore, si quelqu’un plante une vigne, à moins d’en prendre des fruits pour se nourrir, ne s’attend-il pas à en prendre des fruits ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: plante une vigne
  rationale: Rend directement l’expression syriaque, dans un français naturel.
- source_word: ܢܣܒ ܡܢܗ ܦܐܪ̈ܐ
  choice: en récolte du fruit
  rationale: Le verbe signifie littéralement « prendre/recevoir » ; « récolter » convient au contexte viticole, tandis que le singulier collectif « du fruit » respecte l’expression source.
- source_word: ܕܢܬܪܣܐ
  choice: pour se nourrir
  rationale: Exprime la finalité de subsistance ou de nourriture portée par le verbe syriaque.
- source_word: ܡܣܒܪ
  choice: s’attend-il
  rationale: Le verbe exprime ici l’attente ou l’espérance du planteur ; la forme interrogative restitue la comparaison rhétorique du contexte.
theological_decisions:
- issue: Portée de l’image de la vigne
  choice: Conserver l’image agricole sans en expliciter l’application théologique.
  alternative: Identifier explicitement la vigne à un peuple, à une œuvre ou à une récompense.
  rationale: Le verset lui-même demeure proverbial et rhétorique ; toute identification plus précise importerait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative a été légèrement réorganisée afin de rendre intelligible la construction syriaque tout en conservant sa logique conditionnelle et rhétorique.
