  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: fr
  text: 'Alors moi, Baruch, je dis : « Et je t’ai dit, ô Babylone : “Si tu avais prospéré et que Sion demeurait dans sa gloire, notre douleur aurait néanmoins été grande de ce que tu avais été mise sur un pied d’égalité avec Sion.[a] Mais maintenant, voici que la douleur est infinie et la lamentation sans mesure, car Babylone a prospéré et Sion reste dévastée. Qui donc peut porter un jugement sur ces choses ? À qui nous plaindrons-nous de ce qui nous est arrivé ? Ô Seigneur, comment as-tu pu le supporter ? Nos pères sont entrés dans le repos sans connaître la douleur, et voici que les justes dorment paisiblement dans la terre, car ils n’ont pas connu cette détresse ni entendu parler de ce qui nous est arrivé. Si seulement tu avais des oreilles, ô terre, et si tu avais un cœur, ô poussière ! Alors tu pourrais aller l’annoncer au Shéol et dire aux morts : ‘Heureux êtes-vous, plus que nous qui sommes en vie !’” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Rendu antérieur : « Alors moi, Baruch, je répondis : “Pourquoi, ô Israël, te troubles-tu intérieurement, et pourquoi t’affliges-tu, ô pays, de ce qui est arrivé ? Car si tu avais prospéré, ô Sion, et si Babylone avait été détruite, notre douleur aurait néanmoins été grande, puisque Babylone avait été mise sur un pied d’égalité avec Sion.” »'
    reason: Le début du chapitre est textuellement difficile. Ce rendu antérieur inverse toutefois les destinataires et les éléments de la proposition conditionnelle ; le texte principal suit la lecture contrôlée qui s’adresse à Babylone.
lexical_decisions:
- source_word: ܒܒܠ
  choice: Babylone
  rationale: Le nom traditionnel français convient à la ville impériale personnifiée et directement interpellée.
- source_word: notion de prospérité dans l’adresse à Babylone
  choice: prospéré
  rationale: Ce terme maintient le contraste avec la dévastation de Sion sans ajouter de jugement moral absent de l’expression.
- source_word: ܨܗܝܘܢ
  choice: Sion
  rationale: Forme biblique française usuelle, qui conserve la personnification de la ville.
- source_word: langage de dévastation appliqué à Sion
  choice: reste dévastée
  rationale: La formulation exprime à la fois l’état présent et la force élégiaque du passage.
- source_word: verbe exprimant le fait de porter ou supporter
  choice: comment as-tu pu le supporter ?
  rationale: Cette tournure naturelle garde l’étonnement douloureux adressé au Seigneur sans transformer la plainte en accusation explicite.
- source_word: idiomes du repos et du sommeil des morts
  choice: sont entrés dans le repos / dorment paisiblement
  rationale: Ces expressions conservent le parallélisme solennel et l’euphémisme ancien de la mort.
- source_word: ܫܝܘܠ
  choice: Shéol
  rationale: La translittération préserve la représentation ancienne du séjour des morts sans l’assimiler à une doctrine ultérieure plus précise.
theological_decisions:
- issue: Désignation du séjour des morts
  choice: Shéol
  alternative: le séjour des morts ; l’Hadès ; la tombe
  rationale: Le terme ancien est maintenu afin de préserver l’univers conceptuel du texte et son indétermination concernant l’au-delà.
- issue: Plainte adressée à Dieu
  choice: « Ô Seigneur, comment as-tu pu le supporter ? »
  alternative: « comment l’as-tu supporté ? » ; « comment as-tu pu le permettre ? »
  rationale: La traduction conserve la tension de la lamentation et l’idée de supporter, sans introduire explicitement la notion plus interprétative de permission divine.
- issue: Comparaison entre Babylone et Sion
  choice: Babylone est dite mise sur un pied d’égalité avec Sion
  alternative: Babylone est devenue semblable à Sion
  rationale: La formulation garde le scandale théologique et affectif de la comparaison sans préciser en quoi consiste cette égalité.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification de Babylone, de Sion, de la terre et de la poussière est conservée, de même que le mouvement poétique de la lamentation. La ponctuation rend lisibles les paroles enchâssées sans supprimer leur structure.
