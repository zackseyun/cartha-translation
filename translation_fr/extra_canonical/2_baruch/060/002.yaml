  yaml_path: translation/extra_canonical/2_baruch/060/002.yaml
  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: fr
  text: Mais Israël aussi se souilla par ses péchés au temps des juges, alors même que les Israélites voyaient les nombreux signes accomplis par celui qui les avait créés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “was defiled with sins”'
  choice: se souilla de péchés
  rationale: Formulation française naturelle qui conserve l’idée de souillure morale, sans réduire l’expression à « pécha ».
- source_word: 'English consultation: “in the days of the judges”'
  choice: au temps des juges
  rationale: Expression idiomatique et digne correspondant à la période des juges d’Israël.
- source_word: 'English consultation: “while they were seeing many signs”'
  choice: alors même qu’il voyait les nombreux signes
  rationale: Le singulier collectif reprend « Israël » en français; « alors même que » fait ressortir le contraste implicite.
- source_word: 'English consultation: “done by him who made them”'
  choice: accomplis par celui qui l’avait créé
  rationale: « Accomplis » convient aux signes; le pronom collectif renvoie à Israël, compris comme le peuple créé par Dieu.
theological_decisions:
- issue: Référent de « celui qui l’avait créé »
  choice: Conserver une désignation indirecte de Dieu comme créateur d’Israël.
  alternative: « accomplis par leur Créateur » ou « accomplis par celui qui les avait faits »
  rationale: La formulation évite d’ajouter explicitement le nom de Dieu et préserve la structure de la tradition consultée, tout en restant claire en français.
translation_notes:
  register: Français international moderne, sobre et soutenu. Le contraste entre les signes vus par Israël et sa souillure morale est conservé. Le matériau syriaque fourni étant un corpus de pages avec chevauchement et interpolation tentative, la formulation s’appuie prudemment sur la couche anglaise auditée pour délimiter ce verset.
