  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: fr
  text: Les cinquièmes eaux noires que tu as vues pleuvoir, ce sont les actes commis par les Amoréens, les formules de leurs enchantements qu’ils pratiquaient, la perversité de leurs mystères et le mélange de leurs impuretés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fifth black waters
  choice: les cinquièmes eaux noires
  rationale: Conserve l’image symbolique et l’ordre ordinal de la vision, sans transformer les eaux en simple pluie.
- source_word: deeds
  choice: les actes commis
  rationale: Rend l’idée d’actions effectivement accomplies, dans un français naturel.
- source_word: spells of their enchantments
  choice: les formules de leurs enchantements
  rationale: Maintient la distinction interne entre les formules prononcées et les pratiques d’enchantement, sans réduire l’expression au seul terme « sorcellerie ».
- source_word: wickedness of their mysteries
  choice: la perversité de leurs mystères
  rationale: Préserve le jugement moral ainsi que le caractère secret ou rituel de ces pratiques.
- source_word: mingling of their uncleanness
  choice: le mélange de leurs impuretés
  rationale: Conserve la métaphore du mélange et le pluriel collectif des souillures, sans préciser arbitrairement si elles sont rituelles ou morales.
theological_decisions:
- issue: Nature de l’impureté
  choice: leurs impuretés
  alternative: leur impureté rituelle
  rationale: Le texte ne permet pas de limiter explicitement l’impureté au domaine rituel; la formulation retenue préserve l’ambiguïté morale et cultuelle.
- issue: Rapport entre les eaux et les actes
  choice: représentent
  alternative: ce sont
  rationale: « Représentent » explicite sobrement la fonction symbolique des eaux dans l’interprétation de la vision, sans identifier matériellement les eaux aux actes.
translation_notes:
  register: Français international moderne, lisible et digne. La structure cumulative de l’énumération est conservée. Aucun marqueur de note n’est nécessaire.
