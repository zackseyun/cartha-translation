  source_fidelity: La structure interprétative, l’ordinal (« cinquièmes »), l’image des eaux noires qui tombent en pluie et les quatre éléments de l’énumération suivent fidèlement le texte source tel qu’il est reflété par l’audit anglais. Toutefois, le verbe d’identification direct (« these are ») doit être rendu par « ce sont », plutôt que par « représentent », qui explicite et atténue légèrement l’équivalence formulée dans l’interprétation.
  naturalness: Le français est moderne et lisible. « Que tu as vues pleuvoir » est plus idiomatique et plus direct que « que tu as vues tomber en pluie ».
  terminology: « Amoréens », « enchantements », « mystères » et « impuretés » sont appropriés. « Formules de leurs enchantements » maintient utilement la distinction, dans l’audit anglais, entre les formules et les enchantements eux-mêmes. Le pluriel « impuretés » conserve sans surinterprétation la portée collective de l’expression.
