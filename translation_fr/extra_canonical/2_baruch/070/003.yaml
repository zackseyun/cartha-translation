  text: They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.
translation:
  language: fr
  text: Ils se haïront les uns les autres et s’inciteront mutuellement au combat. Les gens de basse condition domineront les hommes honorables, et les gens sans prestige seront élevés au-dessus des hommes illustres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܢܐ / notion de haine (lecture versifiée attestée par la tradition textuelle)
  choice: se haïront les uns les autres
  rationale: Conserve la réciprocité et la force du verbe, dans un français direct et naturel.
- source_word: notion de provocation au combat
  choice: s’inciteront mutuellement au combat
  rationale: « S’inciter » exprime l’action réciproque sans ajouter l’idée plus précise d’une guerre organisée.
- source_word: notion de basse condition
  choice: les gens de basse condition
  rationale: Rend un rang social inférieur sans transformer automatiquement le jugement en condamnation morale.
- source_word: notion d’honneur
  choice: les hommes honorables
  rationale: Préserve le contraste de statut et de considération avec ceux qui sont de basse condition.
- source_word: notion d’absence de prestige ou de rang
  choice: les gens sans prestige
  rationale: Évite de confondre le manque de rang social avec l’indignité morale.
- source_word: notion d’élévation au-dessus des illustres
  choice: seront élevés au-dessus des hommes illustres
  rationale: Maintient la formulation passive et le renversement hiérarchique exprimé par le texte.
