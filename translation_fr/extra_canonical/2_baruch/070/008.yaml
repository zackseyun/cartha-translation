  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: fr
  text: Quiconque échappera à la guerre mourra dans le tremblement de terre ; quiconque échappera au tremblement de terre sera consumé par le feu ; et quiconque échappera au feu périra de famine.
