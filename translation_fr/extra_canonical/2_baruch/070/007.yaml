  yaml_path: translation/extra_canonical/2_baruch/070/007.yaml
  text: and some will be undone by their own. Then the Most High will reveal the peoples whom he prepared beforehand, and they will come and wage war against the rulers who remain at that time.
translation:
  language: fr
  text: et certains seront anéantis du fait des leurs. Alors le Très-Haut révélera les peuples qu’il avait préparés d’avance ; ils viendront faire la guerre aux dirigeants qui subsisteront à ce moment-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒܘܢ
  choice: seront anéantis
  rationale: Dans ce contexte de destruction et d’absence de salut, cette formulation française exprime naturellement l’issue funeste annoncée.
- source_word: ܡܪܝܡܢܐ
  choice: le Très-Haut
  rationale: Titre divin traditionnel et intelligible, correspondant au sens du terme syriaque.
- source_word: ܓܠܝܘ
  choice: révélera
  rationale: Le verbe syriaque exprime l’action de dévoiler ou de rendre manifeste, nuance importante dans ce contexte apocalyptique.
- source_word: ܡܩܕ̈ܡܢ
  choice: avait préparés d’avance
  rationale: Rend explicitement l’antériorité exprimée par le syriaque.
theological_decisions:
- issue: Manifestation eschatologique des peuples
  choice: « révélera les peuples »
  alternative: « suscitera les peuples »
  rationale: Le choix retenu préserve l’idée de dévoilement portée par le verbe syriaque sans introduire l’idée distincte d’une mise en mouvement.
- issue: Identité des adversaires encore présents
  choice: « les dirigeants qui subsisteront en ce temps-là »
  alternative: « les chefs qui resteront alors »
  rationale: La formulation reste générale et ne précise ni leur fonction politique exacte ni leur identité, que le texte ne développe pas ici.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La succession narrative est conservée : anéantissement, révélation des peuples, venue, puis guerre. Le début en minuscule signale que le verset poursuit syntaxiquement la phrase précédente.'
