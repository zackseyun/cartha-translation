  yaml_path: translation/extra_canonical/2_baruch/070/006.yaml
  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: fr
  text: Quand les événements annoncés d’avance se seront produits, la confusion s’abattra sur tous les peuples. Les uns tomberont à la guerre, d’autres périront dans les détresses, et d’autres seront anéantis par les leurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leurs propres proches »; le groupe visé n’est pas précisé.
    reason: La formulation source permet plusieurs identifications du groupe auquel appartiennent les destructeurs.
lexical_decisions:
- source_word: ܐܬܝܢ
  choice: se seront produits
  rationale: Le verbe syriaque « venir » peut naturellement désigner l’accomplissement d’événements annoncés; cette tournure française restitue ce sens sans suggérer un déplacement physique.
- source_word: ܣ̈ܓܝܐܐ
  choice: tous les peuples
  rationale: Le segment source fourni est matériellement fragmentaire et chevauche le contexte suivant; la formulation suit la lecture contextuelle auditée tout en employant un français collectif naturel.
- source_word: ܒܙܒܘܪ̈ܐ
  choice: dans les détresses
  rationale: « Détresses » conserve la portée large de malheurs ou tribulations sans préciser indûment leur nature.
- source_word: ܐܝܕ̈ܝܐ
  choice: par les leurs
  rationale: La tournure conserve l’indétermination du groupe proche responsable, au lieu de choisir arbitrairement entre parents, compatriotes ou proches.
theological_decisions:
- issue: Identité de « leurs »
  choice: les leurs
  alternative: leurs proches / leur propre peuple
  rationale: Le référent exact n’étant pas explicitement fixé, la traduction maintient l’ambiguïté du texte plutôt que d’introduire une interprétation sociale ou familiale.
translation_notes:
  register: Français international moderne, sobre et solennel. La structure ternaire est conservée. Le dossier syriaque transmis est fragmentaire à la limite du verset; les détails de la phrase sont donc contrôlés par la couche anglaise auditée, sans en reproduire mécaniquement la syntaxe.
