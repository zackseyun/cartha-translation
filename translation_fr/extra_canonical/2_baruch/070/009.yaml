  yaml_path: translation/extra_canonical/2_baruch/070/009.yaml
  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: fr
  text: Et il arrivera que quiconque aura échappé et aura été sauvé de toutes ces choses mentionnées plus haut — aussi bien parmi les vainqueurs que parmi les vaincus — sera livré entre les mains de mon serviteur, le Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒ
  choice: aura été sauvé
  rationale: Le verbe syriaque exprime le fait d’être délivré ou sauvé. « Sauvé » convient au registre eschatologique tout en restant naturel en français.
- source_word: ܐܝܕ̈ܝܐ
  choice: entre les mains de
  rationale: L’expression sémitique désigne le fait d’être livré au pouvoir ou à l’autorité de quelqu’un; la formulation traditionnelle reste claire en français.
- source_word: ܡܫܝܚܐ
  choice: le Messie
  rationale: Rend directement le titre syriaque sans lui substituer « Christ », afin de conserver la formulation propre au contexte juif de l’ouvrage.
theological_decisions:
- issue: Identité et rôle du Messie
  choice: « mon serviteur, le Messie »
  alternative: « mon serviteur messianique » ou « mon serviteur oint »
  rationale: La construction appositionnelle préserve les deux désignations distinctes et n’ajoute aucune identification confessionnelle.
- issue: Portée de la délivrance finale
  choice: « aussi bien parmi les vainqueurs que parmi les vaincus »
  alternative: « ceux qui auront vaincu et ceux qui auront été vaincus »
  rationale: La formulation conserve l’inclusion des deux groupes sans préciser davantage leur identité, qui demeure dépendante du contexte.
translation_notes:
  register: Français moderne, digne et lisible. Les futurs antérieurs rendent les actions accomplies avant la remise au Messie. L’expression « mentionnées plus haut » conserve explicitement le renvoi rétrospectif du syriaque.
