revisions:
- from: Voici que viennent des jours où le temps du monde sera arrivé à maturité et où sera venue la moisson de la semence des méchants et des bons.[a] Alors le Puissant répandra la confusion de l’esprit et l’effroi du cœur sur la terre, sur ses habitants et sur ses dirigeants.
  to: Voici, des jours viennent où le temps du monde arrivera à maturité et où viendra la moisson de la semence des méchants et des bons. Alors le Puissant fera venir sur la terre, sur ses habitants et sur ses dirigeants la confusion de l’esprit et l’effroi du cœur.
  rationale: La révision améliore l’idiomaticité et remplace un verbe trop imagé par une formulation qui correspond plus directement à l’action exprimée dans la source. Elle maintient l’analyse décisive de « la semence des méchants et des bons » et retire une note qui risquerait de réintroduire la lecture précisément écartée par l’audit source.
  reviewer_model: gpt-5.6-terra
