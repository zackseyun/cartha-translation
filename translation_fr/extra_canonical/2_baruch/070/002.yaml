  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: fr
  text: Voici, des jours viennent où le temps du monde arrivera à maturité et où viendra la moisson de la semence des méchants et des bons. Alors le Puissant fera venir sur la terre, sur ses habitants et sur ses dirigeants la confusion de l’esprit et l’effroi du cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܪܥܐ
  choice: semence
  rationale: Le nom est compris au singulier et conserve l’image agricole qui se prolonge dans celle de la moisson.
- source_word: ܒܝ̈ܫܐ … ܛܒ̈ܐ
  choice: des méchants et des bons
  rationale: Les adjectifs pluriels sont substantivés et désignent des personnes; ils ne qualifient pas moralement des semences.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Ce titre divin est rendu de façon sobre et littérale, sans ajouter un nom divin absent du texte.
theological_decisions:
- issue: Rapport entre la semence, les méchants et les bons
  choice: la semence des méchants et des bons
  alternative: ses mauvaises et bonnes semences
  rationale: La construction génitive fait des méchants et des bons les possesseurs ou l’origine de la semence; l’alternative transformerait ces groupes humains en qualités morales des semences.
- issue: Identification du « Puissant »
  choice: Maintien du titre « le Puissant »
  alternative: Dieu / le Tout-Puissant
  rationale: Le texte emploie un titre; le conserver évite de préciser davantage que la source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les images de la maturation, de la semence et de la moisson sont conservées, ainsi que le parallélisme entre confusion de l’esprit et effroi du cœur.
