  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: fr
  text: Les sages garderont le silence, et les insensés parleront. Alors, la pensée des humains ne se réalisera pas, pas plus que le conseil des puissants ni l’espérance de ceux qui espèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܚܫܒܬܐ ܕܒܢܝ ܐܢܫܐ
  choice: la pensée des humains
  rationale: Rend directement « la pensée des fils de l’homme » en français actuel, sans transformer le singulier collectif en projets particuliers.
- source_word: ܬܪܥܝܬܐ
  choice: le conseil
  rationale: Conserve le sens de dessein, avis ou résolution, ainsi que la formulation sobre du passage.
- source_word: ܡܣܒܪܝܢ
  choice: ceux qui espèrent
  rationale: Maintient la reprise intentionnelle de la racine de l’espérance, plutôt que de la lisser en « ceux qui l’attendent ».
- source_word: ܣܟܠܐ
  choice: les insensés
  rationale: Terme français courant dans le registre sapientiel, plus précis et plus digne que « les idiots ».
theological_decisions:
- issue: Non-accomplissement des intentions humaines
  choice: ne se réalisera pas
  alternative: ne sera pas accomplie
  rationale: Exprime l’échec annoncé de la pensée humaine sans préciser qui ou quoi l’empêche, préservant ainsi la tension du texte.
- issue: Portée de l’espérance
  choice: l’espérance de ceux qui espèrent
  alternative: l’attente de ceux qui gardent espoir
  rationale: La formulation conserve la généralité et la répétition du texte, sans identifier l’objet de l’espérance ni lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme en trois membres est conservé, de même que la formulation générale et non explicitée des attentes humaines.
