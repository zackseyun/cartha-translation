lexical_decisions:
- source_word: ܐܪܥܐ ܟܠܗ̇ (expression sous-jacente attestée par la couche de consultation)
  choice: la terre entière
  rationale: Cette formulation naturelle conserve la portée universelle du texte sans ajouter « monde ».
- source_word: ܬܐܟܘܠ / notion de dévorer (texte verset non clairement isolé dans l’extrait fourni)
  choice: dévorera
  rationale: Le verbe fort « dévorer » préserve l’image violente plutôt que de l’atténuer par « engloutir » ou « faire périr ».
- source_word: ܥܡܘܪ̈ܝܗ̇ / notion d’habitants (texte verset non clairement isolé dans l’extrait fourni)
  choice: ses habitants
  rationale: Rend directement le rapport possessif entre la terre et ceux qui l’habitent.
