lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: les dernières eaux noires
  rationale: Conserve l’image symbolique culminante et rend l’idée de dernières eaux sans la réduire à une catastrophe abstraite.
- source_word: ܦܘܫܩܐ
  choice: l’interprétation
  rationale: Terme naturel et précis pour l’explication d’une vision symbolique.
- source_word: ܡܠܬܐ
  choice: ce que cela signifie
  rationale: Dans la formule introductive, cette tournure française exprime naturellement l’annonce de l’explication qui suit, plutôt qu’un littéral « voici la parole ».
theological_decisions:
- issue: Rapport entre les deux mentions des eaux noires
  choice: Maintenir la répétition et présenter les dernières eaux noires comme venant après les eaux noires précédentes.
  alternative: Fondre les deux mentions en une seule référence à une catastrophe finale.
  rationale: La répétition appartient à l’enchaînement symbolique de la vision et ne doit pas être résolue en une interprétation théologique explicite.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif singulier « Écoute » conserve l’adresse directe, tandis que « Voici ce que cela signifie » introduit naturellement l’explication à venir.
