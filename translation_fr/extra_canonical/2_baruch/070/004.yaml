  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: fr
  text: Beaucoup seront livrés aux mains d’un petit nombre. Ceux qui n’étaient rien[a] domineront les puissants, les pauvres posséderont plus que les riches, et les impies s’élèveront au-dessus des vaillants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient sans importance ».
    reason: La tournure syriaque signifie littéralement qu’ils « n’étaient rien » et peut désigner des personnes auparavant tenues pour insignifiantes.
lexical_decisions:
- source_word: ܣ̈ܓܝܐܐ
  choice: beaucoup
  rationale: Rend naturellement le pluriel « nombreux / beaucoup » dans l’opposition avec le petit nombre.
- source_word: ܒܐܝܕ̈ܝܐ
  choice: aux mains de
  rationale: Conserve l’image sémitique de la remise au pouvoir d’autrui, idiomatique également en français.
- source_word: ܕܠܐ … ܡܕܡ
  choice: ceux qui n’étaient rien
  rationale: Préserve la formulation paradoxale et solennelle du syriaque sans le registre trop familier de « ceux qui n’étaient personne ».
- source_word: ܡܣܒܪܝܢ
  choice: domineront
  rationale: Exprime ici l’exercice du pouvoir sur les forts, conformément au parallélisme de renversement social.
- source_word: ܡܪܝܡܢܐ
  choice: s’élèveront
  rationale: Maintient l’image d’exaltation au-dessus d’autrui plutôt que de la réduire à une simple victoire.
theological_decisions:
- issue: Nature des renversements annoncés
  choice: Formulations descriptives au futur
  alternative: Les présenter comme une approbation divine ou morale
  rationale: Le verset annonce des renversements apocalyptiques sans préciser ici qu’ils seraient moralement approuvés; la traduction ne tranche donc pas cette question.
translation_notes:
  register: Français moderne, clair et digne, avec conservation du parallélisme apocalyptique et de la tension entre les groupes opposés.
