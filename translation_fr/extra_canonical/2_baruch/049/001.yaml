    issue: 'Expression peu naturelle : « seront-elles établies comme des êtres vivants ? »'
    rationale: Cette construction est compréhensible, mais elle est lourde et artificielle en français moderne. Elle peut être remplacée par « seront-elles alors dotées de vie ? », qui garde ouverte la question de l’établissement/rétablissement dans la vie.
