revisions:
- from: 'Mais je te poserai encore cette question, ô Puissant, et je demanderai miséricorde à celui qui a tout créé : Sous quelle forme vivront ceux qui seront en vie à son époque ? Et comment l’éclat[a] de ceux qui viendront après ce temps-là sera-t-il préservé ? Revêtiront-ils alors la forme qu’ils ont à présent ? Ces formes humaines subsisteront-elles alors et seront-elles établies comme des êtres vivants ? Ou bien changeras-tu peut-être ces réalités qui ont existé dans le monde, tout comme le monde lui-même ?'
  to: 'Mais je te poserai encore cette question, ô Puissant, et je demanderai miséricorde à celui qui a tout créé : Sous quelle forme vivront ceux qui seront en vie à son époque ? Et comment l’éclat[a] de ceux qui viendront après ce temps-là sera-t-il préservé ? Revêtiront-ils alors la forme qu’ils ont à présent ? Ces formes humaines subsisteront-elles alors et seront-elles dotées de vie ? Ou bien changeras-tu peut-être ces réalités qui ont existé dans le monde, tout comme le monde lui-même ?'
  rationale: 'La seule révision est stylistique et syntaxique : elle remplace un calque français peu naturel par une expression idiomatique qui conserve la portée interrogative et l’ambiguïté du syriaque quant à la vie future des formes humaines. Le reste du texte, y compris la note d’incertitude textuelle, est maintenu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit de près la question syriaque telle qu’elle est éclairée par la tradition de contrôle : prière au Puissant, interrogation sur la forme des vivants, maintien de l’éclat, persistance des formes humaines et éventuel changement du monde. Il conserve à juste titre le caractère interrogatif et non doctrinalement résolu du passage. La leçon immédiatement transmise est difficile à plusieurs endroits, notamment autour de l’« éclat » ; la note signale cette incertitude sans la masquer.'
  naturalness: 'Le français est globalement moderne et soutenu. Toutefois, « seront-elles établies comme des êtres vivants » est calqué sur une formulation analytique et sonne peu idiomatique en français : des « formes » ne sont pas naturellement « établies comme » des êtres vivants. « Seront-elles alors dotées de vie ? » rend plus naturellement la question sans décider davantage de la modalité de cette vie.'
  terminology: « ô Puissant », « forme », « éclat » et « changer » sont des choix appropriés. « Éclat » est préférable ici à une option plus lourde, tout en laissant la variante « splendeur » et l’incertitude textuelle en note. La formulation révisée « dotées de vie » évite d’imposer une doctrine détaillée de la résurrection tout en rendant le rapport des formes à la vie.
  issues:
