base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: fr
  text: 'Mais je te poserai encore cette question, ô Puissant, et je demanderai miséricorde à celui qui a tout créé : Sous quelle forme vivront ceux qui seront en vie à son époque ? Et comment l’éclat[a] de ceux qui viendront après ce temps-là sera-t-il préservé ? Revêtiront-ils alors la forme qu’ils ont à présent ? Ces formes humaines subsisteront-elles alors et seront-elles dotées de vie ? Ou bien changeras-tu peut-être ces réalités qui ont existé dans le monde, tout comme le monde lui-même ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte syriaque est difficile à cet endroit ; autre traduction possible : « splendeur » ou « gloire ».'
    reason: La leçon transmise paraît incertaine, tandis que les témoins de contrôle orientent vers l’idée d’éclat ou de splendeur.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (lecture de contrôle derrière le texte transmis)
  choice: ô Puissant
  rationale: Le titre divin attesté par la tradition de contrôle correspond au contexte de la prière. Il évite de suivre la lecture manifestement instable ܚܒܝܒܝ (« mon bien-aimé ») du texte fourni.
- source_word: ܕܡܘܬܐ
  choice: forme
  rationale: Dans cette question sur l’existence future, le terme désigne la forme ou la ressemblance, et non la mort. « Forme » exprime naturellement la continuité corporelle envisagée sans la trancher.
- source_word: ܙܥܘܪܬܗ (lecture transmise difficile)
  choice: éclat
  rationale: La leçon syriaque fournie paraît altérée; la tradition de contrôle soutient un sens tel qu’« éclat » ou « splendeur ». « Éclat » reste clair tout en signalant l’incertitude en note.
- source_word: ܡܚܠܦ
  choice: changera(s)
  rationale: Le verbe exprime une modification ou une transformation. « Changer » conserve la portée générale de la question sans imposer une doctrine précise de la transformation.
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: seront-elles établies comme des êtres vivants
  rationale: 'La tournure est comprise passivement dans le contexte de la résurrection : les formes humaines sont constituées ou rétablies comme vivantes, plutôt qu’elles ne soutiennent elles-mêmes les vivants.'
theological_decisions:
- issue: Continuité ou transformation de la forme humaine dans l’existence future
  choice: Conserver la série de questions sans décider si la forme présente subsistera ou sera changée.
  alternative: Faire affirmer au verset soit une continuité corporelle strictement identique, soit une transformation totale.
  rationale: Baruch interroge ici; la réponse ne vient pas encore. La traduction préserve donc la tension entre continuité et transformation.
- issue: Portée de l’expression « établies comme des êtres vivants »
  choice: La rendre comme une question portant sur l’établissement ou le rétablissement des formes humaines dans la vie.
  alternative: « qui soutiennent maintenant les vivants »
  rationale: La syntaxe et le contexte apocalyptique favorisent l’idée d’êtres rendus vivants; l’autre lecture attribuerait à ces formes une action que le syriaque n’exprime vraisemblablement pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les interrogations successives et la distinction entre forme présente, formes humaines vivantes et changement du monde ont été conservées. Le passage demeure volontairement ouvert sur la nature exacte de l’existence après la résurrection.
