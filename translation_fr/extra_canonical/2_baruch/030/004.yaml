translation:
  language: fr
  text: Mais les âmes des méchants dépériront davantage lorsqu’elles verront toutes ces choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦ̈ܫܬܐ (napšātā)
  choice: les âmes
  rationale: Rend directement le pluriel syriaque désignant ici les âmes des personnes mortes.
- source_word: ܪ̈ܫܝܥܐ (raššiʿē)
  choice: des méchants
  rationale: Terme moral courant et naturel, sans ajout d’une qualification doctrinale.
- source_word: ܢܬܒ̈ܠܝܢ (netbalyān)
  choice: dépériront
  rationale: Exprime l’idée de se flétrir, s’user ou se consumer progressivement, tout en restant idiomatique en français.
- source_word: ܗܠܝܢ ܟܠܗܝܢ (hālēn kolhēn)
  choice: toutes ces choses
  rationale: Conserve la portée récapitulative de l’expression démonstrative syriaque.
theological_decisions:
- issue: Nature de l’affaiblissement des âmes des méchants
  choice: dépériront
  alternative: seront anéanties
  rationale: Le verbe décrit un dépérissement ou une usure; il ne faut pas en déduire explicitement un anéantissement définitif.
- issue: Moment exprimé par la proposition circonstancielle
  choice: lorsqu’elles verront
  alternative: après avoir vu
  rationale: Préserve le lien temporel direct entre la vision de ces événements et le dépérissement, sans imposer une chronologie plus précise.
translation_notes:
  register: Français moderne, clair et digne. La tournure reste concise et conserve le contraste initial « Mais » ainsi que l’ambiguïté du verbe relatif au sort des âmes.
