lexical_decisions:
- source_word: ܝܕ̈ܥܢ
  choice: elles savent
  rationale: Le sujet implicite renvoie aux âmes des méchants mentionnées dans le contexte immédiat; le féminin pluriel français rend ce référent sans l’expliciter dans le verset.
- source_word: ܫܘܢܩܗܝܢ
  choice: leur tourment
  rationale: « Tourment » conserve l’idée de souffrance punitive sans préciser davantage sa nature.
- source_word: ܐܒܕܢܗܝܢ
  choice: leur destruction
  rationale: « Destruction » rend le sens fort de perte ou de perdition tout en évitant un terme français inutilement confessionnel.
theological_decisions:
- issue: Nature et durée du sort des méchants
  choice: Conserver les termes « tourment » et « destruction » sans les expliquer.
  alternative: Employer « châtiment » et « perdition », ou préciser la nature du jugement.
  rationale: Le verset affirme l’arrivée du tourment et de la destruction, mais ne définit ici ni leur modalité ni leur durée; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, sobre et solennel. La structure parallèle de la phrase source est conservée. Le matériau syriaque fourni pour cette page est fortement perturbé et chevauche plusieurs passages; la délimitation du verset s’appuie sur le contexte du chapitre et sur la couche anglaise auditée, tout en suivant le lexique syriaque traditionnellement attesté pour ce verset.
