base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/001.yaml
  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: fr
  text: 1 Il arrivera, après cela, que, lorsque le temps de la venue du Messie sera arrivé à son terme et qu’il reviendra dans la gloire, tous ceux qui se sont endormis dans l’espérance en lui se relèveront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: le temps de la venue du Messie
  rationale: Rend directement l’expression syriaque désignant le temps de la venue du Messie, sans préciser davantage la nature de cette venue.
- source_word: ܢܬܦܣܩ
  choice: sera arrivé à son terme
  rationale: Exprime l’idée d’un temps achevé ou parvenu à son terme dans un français naturel, sans suggérer qu’il serait simplement interrompu.
- source_word: ܢܗܦܘܟ ܒܫܘܒܚܐ
  choice: il reviendra dans la gloire
  rationale: Conserve le mouvement de retour et le lien avec la gloire; « dans la gloire » est idiomatique et n’explicite pas si celle-ci est accompagnement, état ou sphère.
- source_word: ܐܝܠܝܢ ܕܕܡܟܘ
  choice: ceux qui se sont endormis
  rationale: Préserve la métaphore traditionnelle du sommeil pour la mort au lieu de la remplacer par une explicitation.
- source_word: ܒܣܒܪܗ
  choice: en espérant en lui
  rationale: Rend la relation personnelle exprimée par le suffixe pronominal et garde l’idée d’une espérance orientée vers le Messie.
- source_word: ܢܩܘܡܘܢ
  choice: se relèveront
  rationale: Le verbe peut signifier se lever ou se relever; dans ce contexte eschatologique, « se relèveront » laisse entendre la résurrection sans ajouter le terme abstrait.
theological_decisions:
- issue: Nature du relèvement des personnes endormies
  choice: se relèveront
  alternative: ressusciteront
  rationale: Le choix retenu conserve l’image verbale de la source et sa portée eschatologique sans remplacer celle-ci par une formulation doctrinale plus explicite.
- issue: Rapport des défunts au Messie
  choice: en espérant en lui
  alternative: dans l’espérance de sa venue
  rationale: Le pronom syriaque renvoie au Messie lui-même; il ne faut pas restreindre sans preuve l’objet de l’espérance à sa seule venue.
- issue: Modalité de la gloire au retour du Messie
  choice: dans la gloire
  alternative: avec gloire
  rationale: La préposition syriaque permet une formulation relationnelle concise; « dans la gloire » préserve la tension sans définir la gloire comme simple accompagnement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la solennité eschatologique et la métaphore du sommeil, tout en évitant les archaïsmes et les précisions doctrinales absentes du syriaque.
