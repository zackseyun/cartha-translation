  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: fr
  text: À ce moment-là, les réserves où est gardé le nombre des âmes des justes s’ouvriront, et les âmes en sortiront. On verra alors la multitude des âmes réunie en une seule assemblée, dans une même pensée. Les premières se réjouiront, et les dernières ne seront pas attristées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܙ̈ܐ / notion de « réserves, trésors » (texte sous-jacent attesté par la tradition du verset)
  choice: les réserves
  rationale: Le terme désigne des lieux où quelque chose est conservé. « Réserves » est naturel en français et évite de suggérer principalement des richesses matérielles, comme pourrait le faire « trésors ».
- source_word: ܡܢܝܢܐ
  choice: le nombre
  rationale: Conserve l’expression sémitique et son possible sens de nombre fixé ou de compte total, sans l’expliciter abusivement.
- source_word: ܢܦܫ̈ܬܐ ܕܙܕܝ̈ܩܐ
  choice: les âmes des justes
  rationale: Rend directement la désignation des personnes justes dans leur état désincarné, sans ajouter une interprétation doctrinale.
- source_word: ܒܚܕ ܟܢܫܐ
  choice: en une seule assemblée
  rationale: Préserve l’image d’un rassemblement collectif unique.
- source_word: ܒܚܕ ܪܥܝܢܐ / notion d’unité de pensée
  choice: dans une même pensée
  rationale: Maintient la formulation cognitive du syriaque et la tension entre unité d’esprit, d’intention ou de disposition.
- source_word: ܩܕܡ̈ܝܐ … ܐܚܪ̈ܝܐ
  choice: les premières … les dernières
  rationale: L’accord féminin reprend explicitement « les âmes » et conserve l’opposition temporelle ou ordinale sans préciser à tort l’identité des groupes.
theological_decisions:
- issue: Nature de l’ouverture des réserves et de la sortie des âmes
  choice: Décrire simplement les âmes qui sortent des réserves où elles étaient gardées.
  alternative: Interpréter explicitement la scène comme la résurrection corporelle ou comme la délivrance du séjour des morts.
  rationale: Le verset évoque une manifestation eschatologique des âmes, mais ne précise pas ici le mécanisme ni leur rapport au corps.
- issue: Sens du « nombre » des âmes justes
  choice: Conserver « le nombre » sans glose dans le texte.
  alternative: Traduire par « le nombre complet » ou « le nombre fixé d’avance ».
  rationale: Ces développements sont possibles, mais ils résolvent une implication que la formulation source laisse ouverte.
- issue: Identité des « premières » et des « dernières »
  choice: Maintenir ces désignations relatives sans les identifier.
  alternative: Les expliquer comme les morts d’autrefois et les morts plus récents, ou comme différentes générations de justes.
  rationale: Le contexte suggère un ordre dans le temps, mais le texte ne définit pas expressément les deux groupes.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du mouvement du texte syriaque tout en évitant les calques lourds. « Les premières » et « les dernières » reprennent « les âmes »; « dans une même pensée » conserve volontairement l’ambiguïté entre pensée, intention et disposition communes.
