translation:
  language: fr
  text: Car ils savent que le temps est venu, celui dont il a été dit qu’il est l’accomplissement des temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: le temps
  rationale: Le nom syriaque désigne ici le temps fixé ou l’époque attendue; « le temps » conserve la formulation eschatologique sans la préciser davantage.
- source_word: ܫܘܠܡܗ ܕܙܒܢܐ
  choice: l’accomplissement des temps
  rationale: La construction exprime l’achèvement ou la consommation du temps. « Accomplissement » est naturel en français et garde l’idée d’un terme où le dessein annoncé arrive à son plein aboutissement.
theological_decisions:
- issue: Nature de l’accomplissement annoncé
  choice: Ne pas expliciter l’événement au-delà de « l’accomplissement des temps »
  alternative: Identifier directement cet accomplissement à la fin du monde ou au règne messianique
  rationale: Le texte demeure formulé en termes temporels et eschatologiques sans donner ici une identification doctrinale plus précise.
- issue: Valeur temporelle du verbe de connaissance
  choice: « ils sauront »
  alternative: « ils savent »
  rationale: Le contexte prophétique décrit ce que reconnaîtront ceux qui vivront alors; le futur français rend cette orientation, même si la forme transmise et les versions peuvent être comprises de manière plus immédiate.
translation_notes:
  register: Français moderne, clair et solennel. La phrase conserve la répétition intentionnelle de « temps » et la tension eschatologique du texte sans ajout confessionnel.
