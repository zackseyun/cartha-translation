  text: 'And it happened after the seventh day, that I prayed before the Mighty One[a] and said:'
translation:
  language: fr
  text: 'Il arriva qu’après le septième jour, je priai devant le Puissant[a] et dis :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Titre divin fréquent dans 2 Baruch, qui souligne la puissance souveraine de Dieu.
    reason: lexical_choice
lexical_decisions:
- source_word: ܘܗܘܐ
  choice: Il arriva que
  rationale: Cette formule conserve la transition narrative syriaque tout en restant naturelle dans un récit français au registre soutenu.
- source_word: ܡܢ ܒܬܪ ܝܘܡܐ ܫܒܝܥܝܐ
  choice: après le septième jour
  rationale: Traduction directe de l’expression temporelle, sans préciser davantage une chronologie que le syriaque laisse sobre.
- source_word: ܨ̇ܠܝܬ ܩܕܡ
  choice: je priai devant
  rationale: « Devant » conserve l’image de la prière faite en présence de Dieu plutôt que de réduire l’expression à « je priai Dieu ».
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Ce titre divin rend l’idée de puissance portée par le syriaque et évite d’introduire la nuance plus spécifique de « Tout-Puissant ».
- source_word: ܘܐܡ̇ܪܬ
  choice: et dis
  rationale: Le passé simple s’accorde au registre narratif du verset et introduit directement les paroles qui suivent.
theological_decisions:
- issue: Traitement du titre divin ܚܝܠܬܢܐ
  choice: le Puissant
  alternative: le Tout-Puissant
  rationale: « Le Puissant » reflète l’épithète divine sans ajouter explicitement l’idée d’une puissance absolue, qui n’est pas formulée par ce seul terme.
- issue: Majuscule au titre divin
  choice: Puissant avec une majuscule
  alternative: puissant avec une minuscule
  rationale: La majuscule indique qu’il s’agit ici d’un titre désignant Dieu, et non d’un simple adjectif descriptif.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient à la narration littéraire, tandis que « Il arriva que » préserve la formule de transition du syriaque sans recourir à l’archaïque « Il advint que ».
