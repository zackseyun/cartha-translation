  text: Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.
translation:
  language: fr
  text: Que ceux qui désirent le voir prennent donc garde au temps annoncé et dépassent le fardeau du temps troublé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par «fardeau» peut aussi signifier «dette», «obligation» ou «faute»; l’expression «temps troublé» peut se rendre plus littéralement par «temps éveillé» ou «temps soulevé».
    reason: Préserver les ambiguïtés lexicales de ܚܘܒܐ et de ܡܥܝܪ sans alourdir le corps du verset.
lexical_decisions:
- source_word: ܕܢܬܙܗܪܘܢ
  choice: prennent garde
  rationale: Le verbe exprime l’idée d’être vigilant, de se tenir sur ses gardes; cette formulation est naturelle et conserve la portée exhortative.
- source_word: ܙܒܢܐ ܕܐܡܝܪ
  choice: le temps annoncé
  rationale: Rend littéralement le «temps qui a été dit» par une expression française claire, sans préciser davantage le contenu de l’annonce.
- source_word: ܚܘܒܐ
  choice: le fardeau
  rationale: Dans ce contexte, le terme désigne vraisemblablement une charge pénible; «fardeau» suit la lecture contextuelle retenue par la couche de consultation anglaise, tout en signalant en note l’ambiguïté lexicale.
- source_word: ܙܒܢܐ ܕܡܥܝܪ
  choice: le temps troublé
  rationale: Le participe évoque ce qui est éveillé, soulevé ou agité. «Troublé» communique naturellement l’idée d’une période bouleversée sans en fixer la cause.
theological_decisions:
- issue: Référent implicite de «le voir»
  choice: Maintenir le pronom sans expliciter son référent
  alternative: «voir ce temps» ou «voir cela»
  rationale: Le contexte transmis laisse le référent implicite; l’expliciter risquerait de résoudre une ambiguïté que le texte ne tranche pas.
- issue: Nature du «fardeau»
  choice: Conserver une image générale de charge à traverser
  alternative: Traduire par «dette», «faute» ou «obligation»
  rationale: Le mot syriaque possède une gamme de sens incluant dette, obligation, faute et charge. Le contexte eschatologique favorise ici la charge éprouvante, mais la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, sobre et exhortatif. «Temps» est préféré à «époque» pour conserver la répétition du syriaque. La syntaxe reste fluide tout en maintenant les deux impératifs parallèles.
