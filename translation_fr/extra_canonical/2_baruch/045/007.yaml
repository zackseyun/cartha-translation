review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : exhortation à la vigilance à l’égard du temps annoncé et à passer au-delà de sa charge. Toutefois, « le voir » ajoute un pronom et donc un référent que le syriaque ne précise pas. La forme ܕܢܬܚܙܝܢ est grammaticalement délicate (forme passive/réflexive possible) ; l’anglais auditée adopte « to see it », mais cette explicitation ne devrait pas être imposée en français.'
  naturalness: La formulation est sobre et naturelle. « Passer au-delà du fardeau » rend plus clairement le mouvement de ܢܥܒܪܘܢ que « dépasser le fardeau », tout en conservant l’image.
  terminology: « Temps annoncé », « fardeau » et « temps troublé » sont recevables dans ce contexte. La note doit aussi signaler l’incertitude de la première expression plutôt que de présenter uniquement les options lexicales de « fardeau ».
  issues:
  - severity: medium
    issue: Référent ajouté dans « le voir »
    rationale: Le syriaque ne fournit pas d’antécédent explicite à traduire par « le ». La construction verbale est elle-même incertaine et peut littéralement évoquer le fait d’« être vus » ou de « paraître ». L’omission de l’objet en français préserve mieux l’indétermination.
  - severity: low
    issue: Note incomplète sur l’ambiguïté textuelle initiale
    rationale: La note actuelle documente les termes finaux, mais non la difficulté grammaticale de ܕܢܬܚܙܝܢ, que l’anglais résout interprétativement par « to see it ».
  revised_text: Que ceux qui désirent voir soient donc sur leurs gardes face au temps annoncé et passent au-delà du fardeau du temps troublé.[a]
  revised_footnotes:
  - marker: a
    text: Le syriaque de « désirent voir » emploie une forme qui peut aussi se comprendre plus littéralement comme « désirent être vus » ou « paraître » ; aucun objet explicite n’est donné. Le mot rendu par « fardeau » peut également désigner une dette, une obligation ou une faute. « Temps troublé » traduit un terme pouvant évoquer un temps agité ou un temps d’éveil.
    reason: Préserver les ambiguïtés grammaticale et lexicale du syriaque sans fixer un référent ou une interprétation théologique.
  revision_rationale: La révision retire le pronom ajouté « le », conserve le parallélisme exhortatif et adapte légèrement le second verbe pour exprimer le passage au-delà de la charge. La note est élargie afin de rendre compte de la difficulté de la forme syriaque que la piste anglaise a résolue par « see it ».
