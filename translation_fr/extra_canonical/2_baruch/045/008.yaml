  yaml_path: translation/extra_canonical/2_baruch/045/008.yaml
  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: fr
  text: Mais ceux qui se sont tournés vers les ténèbres, qui ont accueilli les mensonges, perdu le ferme appui de l’espérance, recherché des choses vaines[a], refusé de faire miséricorde[b] et négligé de suivre la voie de la discipline—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : «se sont laissé rechercher parmi des choses vaines».'
    reason: La forme verbale et l’état du texte permettent une analyse passive ou moyenne, moins naturelle dans le contexte.
  - marker: b
    text: 'Littéralement, selon une autre analyse : «n’ont pas épargné la miséricorde».'
    reason: La construction syriaque est inhabituelle et peut recevoir une traduction plus littérale, quoique obscure en français.
lexical_decisions:
- source_word: ܚܫܘܟܐ
  choice: les ténèbres
  rationale: Le lexème désigne l’obscurité ou les ténèbres; ce choix conserve la portée morale de l’image sans la confondre avec l’angoisse.
- source_word: ܕ̈ܓܠܐ
  choice: les mensonges
  rationale: Rend directement le pluriel syriaque désignant des faussetés.
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: le ferme appui de l’espérance
  rationale: La tournure associe ce qui est établi ou déposé à l’espérance. «Ferme appui» donne un français naturel tout en conservant l’idée de stabilité.
- source_word: ܒܗܘܐܢܬ ܐܬܒܥܝܘ
  choice: recherché des choses vaines
  rationale: Le texte transmis est difficile et permet une lecture moyenne ou passive. Le corps du texte retient le sens contextuel d’une poursuite active de réalités vaines, en signalant l’autre analyse en note.
- source_word: ܡܢ ܪ̈ܚܡܐ ܠܐ ܐܚܣܘ
  choice: refusé de faire miséricorde
  rationale: Expression française actuelle et digne pour l’absence de compassion ou de clémence; l’ambiguïté plus littérale est conservée en note.
- source_word: ܡܘܣܪ
  choice: discipline
  rationale: Le terme peut évoquer discipline, correction ou instruction morale. «Discipline» maintient ici l’étendue du champ sémantique.
theological_decisions:
- issue: Valeur morale des ténèbres
  choice: Conserver l’image «les ténèbres»
  alternative: Interpréter par «l’angoisse» ou expliciter comme «le mal»
  rationale: Le syriaque désigne les ténèbres; l’image théologique doit rester intacte plutôt que d’être interprétée ou corrigée.
- issue: Nature de l’espérance perdue
  choice: «le ferme appui de l’espérance»
  alternative: «le dépôt de l’espérance» ou «l’assurance de l’espérance»
  rationale: Cette formulation préserve à la fois l’idée d’une réalité établie et celle d’espérance, sans imposer un sens doctrinal technique à «dépôt».
- issue: Sens de la miséricorde
  choice: Décrire un manquement à faire miséricorde
  alternative: «n’ont pas épargné la miséricorde»
  rationale: Le contexte énumère des fautes morales. La formulation principale exprime clairement ce sens tout en laissant en note la construction plus littérale et incertaine.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La série de participes relatifs garde le rythme de l’énumération syriaque. Le tiret final signale que la phrase se poursuit au verset suivant.
