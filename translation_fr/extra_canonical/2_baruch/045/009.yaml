translation:
  language: fr
  text: Ils désirent sonder la détresse cachée du peuple à venir, mais ils ne verront pas l’examen de cette affaire, dans laquelle beaucoup ont été reconnus justes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « … ils ne verront pas la visitation de cette affaire, dans laquelle beaucoup ont été justifiés. » Le syriaque est difficile, notamment dans le lien entre « cette affaire » et « beaucoup ont été reconnus justes ».'
    reason: Conserve l’alternative plus formelle pour ܡܒܩܪܐ et signale sans la résoudre l’ambiguïté syntaxique de la clause finale.
lexical_decisions:
- source_word: ܠܡܬܒܥܝ
  choice: sonder
  rationale: Le verbe exprime ici la recherche ou l’examen approfondi ; « sonder » convient naturellement avec « l’angoisse cachée ».
- source_word: ܡܬܚܣܟ
  choice: cachée
  rationale: Rend l’idée de ce qui est tenu à l’écart, dissimulé ou inaccessible, conformément au contexte.
- source_word: ܥܡܐ ܕܐܬܐ
  choice: le peuple à venir
  rationale: Traduction directe qui préserve la portée temporelle et l’identité non explicitée du peuple.
- source_word: ܡܒܩܪܐ
  choice: l’intervention
  rationale: Le nom peut évoquer une inspection, une visitation ou une intervention. « Intervention » est idiomatique en français tout en conservant l’idée d’une action décisive sans en préciser indûment la nature.
- source_word: ܐܙܕܕܩܘ
  choice: ont été reconnus justes
  rationale: Rend le passif de la racine « être justifié/tenu pour juste » sans imposer une formulation confessionnelle particulière.
theological_decisions:
- issue: Sens judiciaire ou moral de ܐܙܕܕܩܘ
  choice: ont été reconnus justes
  alternative: ont été justifiés
  rationale: La formulation choisie garde l’idée d’un jugement favorable tout en évitant de charger le texte d’un système doctrinal ultérieur.
- issue: Nature de la « visitation » ou de l’« examen »
  choice: l’intervention concernant ce par quoi
  alternative: la visitation de la réalité par laquelle
  rationale: Le syriaque demeure difficile et peut désigner une inspection ou une action de visitation. Le texte principal privilégie un français intelligible, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation met en relief l’opposition entre leur désir de sonder l’angoisse future et ce qu’ils ne verront pas.
