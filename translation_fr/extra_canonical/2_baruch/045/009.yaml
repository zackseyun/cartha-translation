revisions:
- from: Ils désirent sonder l’angoisse cachée du peuple à venir ; mais ils ne verront pas l’intervention concernant ce par quoi beaucoup ont été reconnus justes.[a]
  to: Ils désirent sonder la détresse cachée du peuple à venir, mais ils ne verront pas l’examen de cette affaire, dans laquelle beaucoup ont été reconnus justes.[a]
  rationale: La révision remplace une interprétation trop active par « examen », conserve l’idée d’enquête portée par le contexte et rend plus fidèlement la relation locative ambiguë du syriaque. Elle maintient « reconnus justes » dans le texte principal et place la formulation traditionnelle « justifiés » en note, sans trancher une question doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:24Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement l’opposition, la détresse cachée du peuple à venir et la finale « ils ne verront pas ». Toutefois, « intervention concernant ce par quoi » s’éloigne de ܡܒܩܪܐ (« examen », éventuellement « visitation ») et transforme la relation ܒܗ (« en/dans laquelle ») en un instrumental « par quoi ».
  naturalness: « Ils désirent sonder » est naturel, mais « l’intervention concernant ce par quoi » reste abstrait et lourd. « L’examen de cette affaire, dans laquelle… » est plus lisible tout en respectant l’enchaînement difficile du syriaque.
  terminology: « Détresse » rend bien ܥܘܩܢ. « Reconnus justes » conserve la valeur passive de ܐܙܕܕܩܘ sans imposer une lecture doctrinale. « Examen » rend le champ sémantique de ܡܒܩܪܐ plus exactement qu’« intervention ».
  issues:
