    issue: Le texte principal rend ܡܒܩܪܐ par « intervention ».
    rationale: Le terme syriaque désigne plus directement un examen, une inspection ou une visitation. « Intervention » ajoute une action décisive qui n’est pas explicitement exprimée.
  - severity: medium
    issue: « ce par quoi beaucoup ont été reconnus justes » modifie la relation syntaxique de ܒܗ.
    rationale: Le syriaque se lit plus littéralement « dans laquelle/en quoi beaucoup ont été reconnus justes ». La construction demeure difficile, mais l’instrumental français est trop interprétatif.
  - severity: low
    issue: La note alternative ne reflète pas exactement la relation « dans laquelle ».
    rationale: Elle emploie « par laquelle », ce qui reproduit la même clarification instrumentale que le texte principal.
