translation:
  language: fr
  text: Car ce qui existe maintenant n’est rien, mais ce qui doit arriver sera immensément grand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ ܕܗܘܐ ܗܫܐ
  choice: ce qui existe maintenant
  rationale: Rend directement l’expression syriaque désignant la réalité présente, dans un français naturel.
- source_word: ܠܐ ܗܘܐ ܡܕܡ
  choice: n’est rien
  rationale: Reproduit la formulation fortement contrastive du syriaque sans l’atténuer.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܗܘܐ
  choice: ce qui doit arriver
  rationale: Exprime l’idée de ce qui est destiné à advenir, sans préciser indûment sa nature.
- source_word: ܪܒ ܣܓܝ
  choice: immensément grand
  rationale: Conserve l’intensification de l’expression syriaque tout en restant idiomatique en français.
theological_decisions:
- issue: Contraste entre la réalité présente et future
  choice: Maintenir l’affirmation absolue « n’est rien » et la grandeur indéterminée de ce qui doit arriver
  alternative: Expliciter que le présent est insignifiant en comparaison du monde futur
  rationale: Le texte syriaque formule un contraste radical mais ne nomme pas ici la réalité future; l’expliciter introduirait une interprétation théologique absente du verset.
translation_notes:
  register: Français moderne, clair et digne. La structure antithétique et la tension eschatologique du syriaque sont conservées sans ajout confessionnel.
