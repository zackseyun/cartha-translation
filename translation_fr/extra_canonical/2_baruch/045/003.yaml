  text: For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.
translation:
  language: fr
  text: Car tout ce qui est périssable disparaît et est réduit à néant, et le temps qui fut tombe dans l’oubli ; on ne le recherche plus dans le souvenir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠ (metḥabbal)
  choice: est périssable
  rationale: Le participe désigne ce qui est sujet à la corruption ou à la destruction. « Périssable » exprime naturellement cette condition en français sans préciser indûment le processus.
- source_word: ܐܙܠ ܠܐ ܡܢܕܡ (ʾāzel lā-menḏem)
  choice: disparaît et est réduit à néant
  rationale: L’expression indique que la chose s’en va vers le néant ou ne devient plus rien; cette formulation française conserve à la fois le mouvement de disparition et son aboutissement.
- source_word: ܡܬܛܥܐ (metṭaʿē)
  choice: tombe dans l’oubli
  rationale: Le verbe passif signifie « être oublié ». L’expression retenue est idiomatique et garde l’image d’un temps désormais oublié.
- source_word: ܡܬܒܥܐ ܒܥܘܗܕܢܐ (metbʿē b-ʿuhdānā)
  choice: on ne cherche plus à s’en souvenir
  rationale: La tournure syriaque associe l’idée d’être recherché à celle du souvenir. La construction impersonnelle française restitue cette formulation sans la durcir en simple « ne sera pas rappelé ».
theological_decisions:
- issue: Portée de l’affirmation sur la disparition des réalités périssables
  choice: Conserver l’énoncé général sans lui donner une interprétation doctrinale supplémentaire
  alternative: Préciser qu’il s’agit exclusivement du monde présent ou de la vie humaine
  rationale: Le verset formule une réflexion générale sur ce qui périt et sur l’oubli du temps passé; le contexte ne justifie pas d’ajouter une qualification théologique absente du texte.
translation_notes:
  register: 'Français moderne, clair et digne. La phrase est légèrement restructurée pour éviter une syntaxe lourde, tout en conservant la progression du syriaque : disparition, néant, oubli du temps passé, absence de recherche dans la mémoire.'
