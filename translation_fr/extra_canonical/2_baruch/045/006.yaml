  text: And if there are any who are appointed for it, it is not withheld from them; and for those who live in it, they will not be led to destruction.
translation:
  language: fr
  text: Et s’il en est qui y sont destinés, cela ne leur est pas refusé ; et ceux qui y vivent ne seront pas conduits à la perdition.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon impersonnelle : « il n’y a pas de mise à la perdition ».'
    reason: Le syriaque autorise une lecture impersonnelle de la dernière proposition.
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: sont destinés
  rationale: Le participe exprime ici ce à quoi certains sont réservés ou destinés ; cette formulation conserve la portée prospective du syriaque.
- source_word: ܡܬܚܣܟ
  choice: est refusée
  rationale: Le verbe signifie que quelque chose est retenu, épargné ou soustrait. Dans ce contexte, « ne leur est pas refusée » rend naturellement l’idée qu’elle ne leur est pas soustraite.
- source_word: ܐܒܕܢܐ
  choice: la perdition
  rationale: Ce terme désigne la destruction ou la ruine définitive. « Perdition » garde ici la gravité eschatologique sans préciser davantage la nature de cette issue.
theological_decisions:
- issue: Portée de la dernière proposition syriaque
  choice: ils ne seront pas conduits à la perdition
  alternative: il n’y a pas de conduite vers la perdition
  rationale: La syntaxe peut se lire en rapport direct avec « ceux qui vivent en elle », d’où le passif personnel retenu dans le texte. La tournure plus impersonnelle demeure possible et est signalée en note.
- issue: Antécédent des pronoms féminins
  choice: lui / elle / en elle
  alternative: expliciter le référent supposé
  rationale: Le verset isolé ne nomme pas explicitement le référent. Les pronoms sont donc conservés afin de ne pas résoudre artificiellement cette ambiguïté contextuelle.
translation_notes:
  register: Français moderne, soutenu mais accessible. La structure parallèle du syriaque et l’ambiguïté des pronoms ont été conservées ; le point-virgule clarifie le lien entre les deux membres sans ajouter d’interprétation.
