  verdict: revise
  source_fidelity: 'Le projet rend correctement le mouvement général du syriaque : ceux qui sont « destinés » à ce qui précède ne s’en voient pas privés, et ceux qui y vivent ne sont pas menés à la perdition. Toutefois, les pronoms français « lui / elle / en elle » imposent un antécédent féminin, alors que le pronom syriaque peut renvoyer à un antécent dont le genre n’est pas déterminable dans ce verset isolé. Une formulation avec « y » et « cela » préserve mieux cette indétermination. La dernière proposition peut être rendue personnellement, comme dans le texte retenu ; l’alternative impersonnelle mérite une note plus idiomatique.'
  naturalness: « S’il en est qui y sont destinés » et « ceux qui y vivent » sont naturels en français moderne et évitent une répétition interprétative. « Cela ne leur est pas refusé » est plus neutre que « elle ne leur est pas refusée » dans ce contexte isolé. « Conduits à la perdition » conserve un registre soutenu approprié.
  terminology: « Destinés », « refusé » et « perdition » sont des choix recevables. « Perdition » maintient la gravité de ܐܒܕܢܐ sans réduire le terme à une destruction uniquement matérielle ni en préciser doctrinalement la portée.
