base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: fr
  text: Car lorsque viendra le temps qui ne passe pas et que son heure arrivera, il mettra ses œuvres en ordre et examinera ses péchés. Ceux qui lui appartiennent n’ajouteront pas la détresse à la destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation syriaque de cette dernière phrase est difficile; on pourrait aussi comprendre : « n’ajouteront ni détresse ni destruction ».'
    reason: Signaler une ambiguïté réelle de la syntaxe et de la relation entre les deux derniers substantifs.
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܪ
  choice: le temps qui ne passe pas
  rationale: Rend directement l’expression syriaque et son contraste avec le temps présent, passager, dans le contexte immédiat.
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: mettra ses œuvres en ordre
  rationale: ܡܫܘܐ peut évoquer l’action d’établir, d’ordonner ou de régler; cette formulation française reste naturelle sans préciser davantage le mécanisme.
- source_word: ܡܒܩܪ ܚܛܗܝܗ
  choice: examinera ses péchés
  rationale: Le verbe signifie inspecter, examiner ou demander compte; « examinera » conserve la portée judiciaire possible sans la surdéterminer.
- source_word: ܥܘܩܢ
  choice: la détresse
  rationale: Correspond au sens d’angoisse, d’affliction ou de détresse et convient au registre eschatologique du passage.
- source_word: ܚܒܠܐ
  choice: la destruction
  rationale: Le terme peut désigner la ruine, la corruption ou la destruction; le contexte oppose ce qui demeure à ce qui se défait.
theological_decisions:
- issue: Référent des pronoms dans « ses œuvres » et « ses péchés »
  choice: Conserver les pronoms masculins renvoyant grammaticalement au « temps »
  alternative: Interpréter explicitement le passage comme l’action de Dieu jugeant les œuvres et les péchés du temps présent
  rationale: Le syriaque personnifie le temps et ne nomme pas explicitement Dieu dans ce verset; expliciter un agent divin résoudrait une tension que le texte laisse ouverte.
- issue: Rapport entre la détresse et la destruction dans la dernière proposition
  choice: « n’ajouteront pas la détresse à la destruction »
  alternative: « n’ajouteront ni détresse ni destruction »
  rationale: La construction transmise est difficile, mais la lecture additive retenue par la couche de consultation anglaise est compatible avec le texte et évite de corriger silencieusement celui-ci.
translation_notes:
  register: Français international moderne, sobre et soutenu. Le futur rend naturellement l’orientation eschatologique de la proposition conditionnelle/temporelle syriaque. La personnification du temps et l’ambiguïté des pronoms sont conservées.
