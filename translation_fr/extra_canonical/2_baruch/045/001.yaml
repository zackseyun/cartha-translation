  yaml_path: translation/extra_canonical/2_baruch/045/001.yaml
  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: fr
  text: 1 …qui appartiennent à la corruption et à ses voies, voies insondables, quelles qu’elles soient. Mais si vous persévérez, si vous demeurez dans la crainte de Dieu et ne vous écartez pas de sa Loi, les temps seront changés en leur temps pour le bien, et vous verrez la consolation de Sion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܚܒܠܬܐ ܘܐܘܪ̈ܚܬܗ
  choice: à la corruption et à ses voies
  rationale: Le nom désigne ici la corruption ou la ruine, et le suffixe de « ses voies » renvoie naturellement à cette corruption. La répétition de « voies » conserve l’enchaînement du syriaque.
- source_word: ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: voies insondables
  rationale: Le participe négatif exprime ce qui ne peut être exploré ou scruté. « Insondables » rend ce sens avec concision dans un registre digne et courant.
- source_word: ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ
  choice: quelles qu’elles soient
  rationale: Cette formule idiomatique, littéralement proche de « elles sont ce qu’elles sont », est conservée plutôt qu’omise.
- source_word: ܬܣܝܒܪܘܢ
  choice: vous persévérez
  rationale: Le verbe évoque l’endurance patiente. « Persévérer » convient à l’exhortation sans la réduire à une simple attente passive.
- source_word: ܬܩܘܡܘܢ ܒܕܚܠܬܗ
  choice: vous demeurez dans la crainte de Dieu
  rationale: Le verbe signifie se tenir ou rester ferme. « Demeurer » est naturel en français; « de Dieu » explicite le référent du pronom dans ce fragment isolé sans introduire une interprétation doctrinale.
- source_word: ܢܡܘܣܗ
  choice: sa Loi
  rationale: Dans ce contexte, le terme désigne la Loi divine. La majuscule signale ce référent précis plutôt qu’une loi quelconque.
- source_word: ܡܬܚܠܦܝܢ ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: les temps seront changés, au moment fixé, pour le bien
  rationale: La formulation conserve le passif et la dimension temporelle et eschatologique. « Au moment fixé » rend idiomatiquement l’idée de leur saison propre, tandis que « pour le bien » évite d’ajouter explicitement la bénédiction.
- source_word: ܒܒܘܝܐܐ ܕܨܝܘܢ
  choice: la consolation de Sion
  rationale: Le nom peut désigner consolation, réconfort ou encouragement. « Consolation » préserve le registre collectif et l’espérance de restauration attachée à Sion.
theological_decisions:
- issue: Référent du suffixe dans « sa crainte » et « sa Loi »
  choice: la crainte de Dieu et sa Loi
  alternative: sa crainte et sa loi
  rationale: Le contexte théocentrique identifie Dieu comme référent. Nommer Dieu une fois rend le fragment français autonome et clair, sans modifier le contenu.
- issue: Espérance eschatologique liée à Sion
  choice: la consolation de Sion
  alternative: le réconfort de Sion
  rationale: « Consolation » maintient la portée communautaire et restauratrice du terme, sans généraliser la promesse en salut abstrait.
- issue: Transformation future des temps
  choice: les temps seront changés… pour le bien
  alternative: les temps tourneront au bien
  rationale: Le passif du syriaque est préservé afin de ne pas effacer l’action divine implicite ni de préciser son agent au-delà du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’ellipse initiale est conservée parce que le verset commence au milieu d’une phrase provenant du contexte précédent. La construction est légèrement rythmée par des répétitions afin de respecter la forme exhortative du syriaque.
