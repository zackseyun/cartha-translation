  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: fr
  text: Car ce qui a existé passe dans la corruption[a], et ce qui se corrompt tombe dans l’oubli et est oublié. Mais c’est ce qui est à venir que l’on recherche ; ce qui a quitté la main n’est plus pris en compte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « disparaît dans la corruption ».'
    reason: Le verbe syriaque ܚܠܦ peut signifier passer, s’en aller ou disparaître ; la traduction principale conserve l’image du passage, tandis que cette variante exprime son aboutissement.
lexical_decisions:
- source_word: ܗܘ ܕܗܘܐ
  choice: ce qui a existé
  rationale: Rend la référence à ce qui a été ou a existé, dans un français naturel, sans la limiter à un événement particulier.
- source_word: ܚܠܦ ܠܡܬܚܒܠܘ
  choice: disparaît dans la corruption
  rationale: Exprime le passage vers la ruine ou la corruption et son caractère transitoire ; la note conserve la possibilité d’une traduction plus formelle par « passe ».
- source_word: ܒܥܘܗܕܢܐ ܢܦܠܐ ܘܡܬܛܥܐ
  choice: tombe dans l’oubli et s’efface
  rationale: Le contexte porte sur la mémoire et l’oubli ; cette formulation française restitue le mouvement d’effacement sans réduire les deux verbes à un seul.
- source_word: ܡܬܒܥܐ
  choice: on recherche
  rationale: Conserve la forme passive ou impersonnelle du syriaque et l’idée de ce qui est recherché.
- source_word: ܥܒܪ ܡܢ ܐܝܕܐ
  choice: a échappé à la main
  rationale: Préserve l’image concrète de la main et l’idée de quelque chose désormais hors de portée.
- source_word: ܡܬܚܫܒ
  choice: pris en compte
  rationale: Rend le sens de compter, considérer ou tenir pour significatif dans ce contexte.
theological_decisions:
- issue: Contraste entre le présent corruptible et l’avenir recherché
  choice: Maintenir le contraste temporel sans préciser la nature de l’avenir
  alternative: Identifier explicitement l’avenir à la vie éternelle ou au monde à venir
  rationale: Le verset souligne la disparition du corruptible et l’importance de ce qui vient, mais ne nomme pas ici précisément cet avenir ; l’expliciter introduirait une interprétation théologique absente de la ligne.
translation_notes:
  register: Français international moderne, sobre et digne. La structure antithétique et les images de la mémoire et de la main sont conservées, avec un léger lissage syntaxique pour la lisibilité.
