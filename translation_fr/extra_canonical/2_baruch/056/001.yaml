base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: fr
  text: 'Cette grande nuée que tu as vue monter de la mer, puis aller couvrir la terre, comprends ceci : elle représente l’ordonnancement du monde que le Puissant réalisa lorsqu’il décida de le créer.[a][b] Lorsque la parole sortit de devant lui, l’établissement du monde se dressa, beau, petit, et fut disposé comme il convenait qu’il soit.[c]


    Quant aux premières eaux noires que tu as vues descendre de cette nuée, elles représentent le péché et la transgression que le premier Adam commit en premier.[d] En effet, lorsqu’il pécha, la mort fut éveillée avant son temps, le deuil devint connu, les afflictions furent préparées, les douleurs furent créées, les peines arrivèrent à leur comble, et la grandeur commença à décliner.


    Quant au dernier jour, qui apparut sous une forme et prit une ressemblance, sache que le temps sera réclamé, que l’apparence de l’humanité sera effacée et que sa force sera mise à l’épreuve.[e]


    Ainsi donc, Adam entendit de Dieu une partie de ce qui devait arriver, comprit que la délivrance des morts avait été accordée et reçut un commandement de Dieu. Il réfléchit et conçut cinq pensées.[f] En effet, il se condamnait lui-même, et les anges aussi le condamnaient.[g] Même au temps où il fut créé, il eut une vision manifeste : les créatures vivantes féroces et les éléments avec le feu.


    Et c’est ainsi que Dieu rassembla, au moment voulu, ceux qui avaient été créés à cette ressemblance.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ceriani porte un verbe signifiant « couvrit »; le témoin de contrôle présente un autre verbe syriaque de même sens. La différence n’affecte pas la traduction.
    reason: textual_variant
  - marker: b
    text: Le syriaque transmis ici est difficile. Le témoin de contrôle permet de lire « l’ordonnancement du monde que le Puissant réalisa », tandis que le texte de Ceriani tel qu’il est conservé peut se comprendre littéralement comme « c’est dans le monde qu’il exerça sa puissance ».
    reason: textual_variant
  - marker: c
    text: L’expression « beau, petit » est surprenante. Elle est conservée littéralement et pourrait évoquer le monde dans son état initial, mais cette explication demeure incertaine.
    reason: lexical_alternative
  - marker: d
    text: 'Autre traduction possible : « elle représente la transgression que le premier Adam commit d’abord ». Les mots « péché » et « transgression » paraissent toutefois tous deux présents dans le texte reçu.'
    reason: lexical_alternative
  - marker: e
    text: La syntaxe de ce passage est très elliptique. Le mot rendu par « apparence » est rare; une autre analyse comprendrait « le dernier jour […] prit la ressemblance de la mort ».
    reason: lexical_alternative
  - marker: f
    text: 'Littéralement : « cinq pensées furent pensées ». Les propositions qui suivent semblent les développer, mais leur nombre et leurs rapports ne sont plus clairs dans le syriaque conservé.'
    reason: textual_difficulty
  - marker: g
    text: 'La construction syriaque est ambiguë. Elle peut aussi être comprise ainsi : « il se rendait coupable lui-même; il rendait aussi les anges coupables ». La traduction retenue comprend Adam comme l’objet implicite du jugement des anges.'
    reason: lexical_alternative
  - marker: h
    text: 'La dernière phrase est obscure : ses sujets, son rapport avec ce qui précède et le sens temporel exact ne sont pas certains. La traduction conserve autant que possible la suite des termes syriaques sans la rattacher à une doctrine précise.'
    reason: textual_difficulty
lexical_decisions:
- source_word: ܥܢܢܐ ܪܒܬܐ
  choice: grande nuée
  rationale: « Nuée » conserve la dignité du registre visionnaire et désigne naturellement une masse nuageuse symbolique.
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  choice: l’ordonnancement du monde
  rationale: Le témoin de contrôle soutient le sens d’organisation ou de structure cosmique; « ordonnancement » rend l’acte de disposer le monde sans évoquer sa durée.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: L’adjectif substantivé fonctionne comme une épithète divine fréquente dans 2 Baruch.
- source_word: ܡܠܬܐ
  choice: la parole
  rationale: Rend directement le terme syriaque tout en conservant l’écho d’un ordre créateur.
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: l’établissement du monde
  rationale: Conserve l’idée de mise en place et le mouvement exprimé par « se dressa ».
- source_word: ܫܦܝܪ ܙܥܘܪ
  choice: beau, petit
  rationale: La juxtaposition étonnante des deux adjectifs est conservée sans expliquer « petit » par une paraphrase conjecturale.
- source_word: ܡܝ̈ܐ ܐܘܟܡ̈ܐ
  choice: eaux noires
  rationale: Traduction directe qui maintient le symbolisme chromatique de la vision.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: la mort fut éveillée
  rationale: Le verbe évoque une mise en mouvement ou un éveil; cette formulation préserve la personnification et l’idée d’une activation prématurée.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ ܬܬܡܫܚ
  choice: l’apparence de l’humanité sera effacée
  rationale: Le nom est rare et peut désigner une apparence ou semblance; le verbe permet le sens d’effacer.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: la délivrance des morts
  rationale: ܫܘܒܩܢܐ peut désigner une remise, une libération ou un pardon. « Délivrance » garde ouverte la nature exacte du don accordé aux morts.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: les créatures vivantes féroces
  rationale: Dans ce contexte visionnaire, le pluriel collectif renvoie vraisemblablement à des êtres vivants redoutables plutôt qu’à « la vie amère ».
- source_word: ܐܣܛܘܟܣܐ
  choice: les éléments
  rationale: Le terme emprunté au grec désigne ici avec le plus de vraisemblance les composantes cosmiques, sans imposer une théorie philosophique précise.
theological_decisions:
- issue: Sens symbolique de la grande nuée
  choice: La nuée représente l’ordonnancement du monde lors de la création.
  alternative: Elle représente une domination impériale ou la propagation du jugement.
  rationale: L’explication immédiate mentionne la décision divine de créer et la parole qui établit le monde.
- issue: La mort éveillée avant son temps
  choice: La transgression d’Adam met prématurément la mort en mouvement.
  alternative: Adam meurt simplement avant la fin possible de sa longévité personnelle.
  rationale: La liste cosmique de conséquences — deuil, afflictions, douleurs et peines — dépasse le seul destin individuel d’Adam, mais le texte ne développe pas davantage le mécanisme théologique.
- issue: Le dernier jour et l’effacement de l’humanité
  choice: Le passage annonce une échéance où le temps est réclamé, l’apparence humaine effacée et sa force éprouvée.
  alternative: Il décrit uniquement le jour de la mort personnelle d’Adam.
  rationale: Le vocabulaire du dernier jour et de la mise à l’épreuve favorise une portée eschatologique, tout en laissant intacte la formulation elliptique.
- issue: ܫܘܒܩܢܐ concernant les morts
  choice: Traduire par « délivrance des morts » sans préciser s’il s’agit du pardon, de la libération ou de la remise de leur état.
  alternative: « Le pardon accordé aux morts » ou « la résurrection des morts ».
  rationale: La construction passive indique un don divin concernant les morts, mais le mot lui-même ne permet pas d’identifier avec certitude la nature doctrinale de ce don.
- issue: Adam et les anges dans la clause de culpabilité
  choice: Adam se condamne lui-même et les anges le condamnent aussi.
  alternative: Adam se rend coupable lui-même et rend également les anges coupables.
  rationale: Le suffixe objet de la seconde proposition peut viser Adam comme celui que les anges condamnent. La syntaxe est toutefois comprimée; une note signale l’autre analyse possible.
- issue: Les éléments avec le feu
  choice: Conserver l’expression cosmique sans identifier les éléments à des esprits ou à un système philosophique déterminé.
  alternative: Des esprits élémentaires ou les lettres du langage.
  rationale: Le prêt grec associé au feu favorise le sens cosmique, mais le passage ne fournit pas une cosmologie détaillée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme visionnaire et les répétitions du syriaque sont conservés lorsque leur étrangeté paraît significative. Les passages syntaxiquement corrompus ou elliptiques ne sont pas harmonisés; les principales possibilités sont signalées en notes.
