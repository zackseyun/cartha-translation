  text: For what then did men lose their life, and for what did those on the earth exchange their soul?
translation:
  language: fr
  text: Dans quel but donc les humains ont-ils perdu leur vie, et contre quoi ceux qui étaient sur la terre ont-ils échangé leur âme ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܝܗܘܢ
  choice: leur vie
  rationale: Rend directement le terme syriaque désignant la vie, tout en conservant le parallélisme avec « leur âme ».
- source_word: ܢܦܫܗܘܢ
  choice: leur âme
  rationale: Préserve le terme anthropologique traditionnel et la tension avec « leur vie », sans réduire les deux expressions à de simples synonymes.
- source_word: ܚܠܦ
  choice: contre quoi … ont-ils échangé
  rationale: Exprime naturellement en français l’idée d’un échange ou d’un troc, sans préciser indûment ce qui aurait été reçu en retour.
- source_word: ܒܢܝܢܫܐ
  choice: les humains
  rationale: Formulation inclusive et courante pour le collectif syriaque « les fils de l’homme / les êtres humains ».
theological_decisions:
- issue: Rapport entre « vie » et « âme »
  choice: 'Conserver deux termes distincts : « vie » et « âme ».'
  alternative: Uniformiser les deux membres avec « vie » ou « existence ».
  rationale: Le parallélisme source emploie des notions apparentées mais distinctes; les fusionner effacerait une possible tension anthropologique.
- issue: Valeur de la question initiale
  choice: « Pourquoi donc »
  alternative: « Dans quel but donc » ou « Pour quoi donc »
  rationale: « Pourquoi » garde en français la portée interrogative de cause ou de finalité tout en restant naturel; « pour quoi » serait artificiel ici.
translation_notes:
  register: Français moderne, digne et direct. La structure interrogative parallèle est conservée, avec une légère variation idiomatique (« pourquoi » / « contre quoi ») nécessaire à la clarté.
