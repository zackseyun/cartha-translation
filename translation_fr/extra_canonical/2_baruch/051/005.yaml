base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: fr
  text: 'Quand donc ils verront que ceux au-dessus desquels ils s’élèvent maintenant seront alors élevés[a] et glorifiés plus qu’eux, les uns et les autres seront transformés : ces derniers, en la splendeur des anges ; les premiers se consumeront davantage encore, dans l’étonnement, à la vue des visions et des formes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « verront ceux au-dessus desquels ils s’élèvent maintenant, qu’ils seront alors élevés » ; le syriaque peut conserver ici une construction anticipée.'
    reason: Signaler l’ambiguïté syntaxique authentique derrière la formulation plus naturelle retenue dans le texte.
lexical_decisions:
- source_word: ܢܬܚܠܦܘܢ (sens présumé dans le passage versifié)
  choice: seront transformés
  rationale: Rend le changement d’état ou d’apparence sans préciser abusivement sa nature.
- source_word: ܫܘܒܚܐ / notion de splendeur
  choice: resplendiront comme des anges
  rationale: Formulation française naturelle qui conserve l’idée d’une splendeur angélique, sans affirmer qu’ils deviennent ontologiquement des anges.
- source_word: ܨܘܪ̈ܬܐ / formes
  choice: l’aspect de ces formes
  rationale: Conserve le terme concret et potentiellement technique « formes », ainsi que son ambiguïté, plutôt que de le remplacer par « corps » ou « apparences ».
- source_word: ܢܬܒܙܒܙܘܢ / notion de dépérissement
  choice: dépériront davantage encore
  rationale: Préserve le contraste avec la glorification et l’intensification exprimée dans le texte de consultation.
theological_decisions:
- issue: Nature de la transformation des justes
  choice: « resplendiront comme des anges »
  alternative: « seront changés en la splendeur des anges »
  rationale: Évite de laisser entendre qu’ils deviennent des anges, tout en maintenant la comparaison ou la participation à leur splendeur.
- issue: Identification des deux groupes
  choice: Répéter « ceux qui seront alors élevés » et « ceux qui s’élèvent maintenant »
  alternative: Employer « les derniers » et « les premiers »
  rationale: La répétition réduit l’ambiguïté référentielle sans modifier l’opposition temporelle et théologique entre les deux groupes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été fluidifiée sans effacer le contraste entre exaltation présente, glorification future et dépérissement. Le témoin syriaque fourni dans l’extrait s’interrompt avant le libellé complet du verset ; la formulation est donc contrôlée à partir de la couche anglaise auditée et du contexte syriaque adjacent.
