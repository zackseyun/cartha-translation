  to: 'Quand donc ils verront que ceux au-dessus desquels ils s’élèvent maintenant seront alors élevés[a] et glorifiés plus qu’eux, les uns et les autres seront transformés : ces derniers, en la splendeur des anges ; les premiers se consumeront davantage encore, dans l’étonnement, à la vue des visions et des formes.'
  rationale: La révision restitue plus précisément le mouvement « changés en la splendeur des anges » et rend la réaction des premiers sans surinterpréter le lien syntaxique avec les visions et les formes. Elle conserve l’ambiguïté signalée par la note et les deux groupes opposés.
