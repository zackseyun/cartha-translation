translation:
  language: fr
  text: Ils verront le temps qui leur est maintenant caché, et le temps ne les fera plus vieillir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: le temps
  rationale: Ce terme syriaque désigne le temps ou l’époque; «le temps» conserve ici la portée générale et la répétition du texte.
- source_word: ܢܣܒ
  choice: fera vieillir
  rationale: Dans ce contexte eschatologique, le verbe exprime l’effet du temps sur l’âge; cette tournure est naturelle en français sans préciser davantage le mécanisme.
theological_decisions:
- issue: Nature du «temps» caché
  choice: Conserver «le temps» sans l’identifier explicitement à l’âge à venir ou au monde futur.
  alternative: Traduire par «l’époque à venir» ou «le monde à venir».
  rationale: Le texte garde une formulation temporelle et ne tranche pas explicitement entre une époque déterminée et le temps en général.
translation_notes:
  register: Français moderne, clair et digne. La répétition de «le temps» est maintenue afin de préserver le lien rhétorique et l’ambiguïté du passage.
