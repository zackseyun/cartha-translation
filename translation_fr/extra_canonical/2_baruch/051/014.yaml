  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: fr
  text: Car ils auront été délivrés de ce monde d’affliction et auront déposé le fardeau des détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: monde
  rationale: Équivalent direct et naturel du syriaque « monde », conservant le cadre eschatologique du passage.
- source_word: not preserved in the supplied page excerpt; reflected in the audited consultation layer as “affliction”
  choice: affliction
  rationale: Terme français digne et compréhensible qui conserve l’idée d’un monde marqué par la souffrance sans en préciser indûment la nature.
- source_word: not preserved in the supplied page excerpt; reflected in the audited consultation layer as “burden”
  choice: fardeau
  rationale: Conserve la métaphore concrète d’un poids dont les justes sont enfin débarrassés.
- source_word: not preserved in the supplied page excerpt; reflected in the audited consultation layer as “distresses”
  choice: détresses
  rationale: Le pluriel préserve la multiplicité des épreuves exprimée par la couche de consultation, plutôt que de la réduire à une seule angoisse.
theological_decisions:
- issue: Nature de la délivrance eschatologique
  choice: Formulation passive « auront été délivrés »
  alternative: « se seront échappés » ou « auront quitté »
  rationale: Le passif laisse ouverte l’identité explicite de l’agent tout en suggérant une délivrance reçue, sans ajouter une précision doctrinale absente du verset.
- issue: Rapport entre la délivrance et les souffrances
  choice: 'Maintien des deux images distinctes : délivrance du monde et dépôt du fardeau'
  alternative: Fusionner les deux propositions en une paraphrase sur la fin des souffrances
  rationale: Préserve la tension et la force poétique des deux affirmations sans les expliquer au-delà du texte.
translation_notes:
  register: Français international moderne, sobre et solennel. Le futur antérieur rend l’accomplissement futur envisagé rétrospectivement. L’extrait syriaque fourni s’interrompt avant le texte matériel du verset 14; la formulation s’appuie donc sur le contexte syriaque du chapitre et sur la couche anglaise auditée pour les mots du verset qui ne figurent pas dans l’extrait visible.
