revisions:
- from: 'Car les étendues du paradis se déploieront devant eux. La beauté majestueuse des êtres vivants qui sont sous le trône leur sera révélée, ainsi que toutes les armées des anges : ceux que ma parole retient maintenant afin qu’ils n’apparaissent pas, et ceux que mon commandement maintient à leur place jusqu’à leur venue[a].'
  to: Car les vastes étendues du paradis se déploieront devant eux ; la beauté de la majesté des êtres vivants qui sont sous le trône leur sera révélée, ainsi que toutes les armées angéliques, retenues maintenant par ma parole afin qu’elles n’apparaissent pas et maintenues par mon commandement à leurs places jusqu’à leur arrivée[a].
  rationale: La révision rétablit l’unité syntaxique des armées angéliques et rend plus exactement la construction décrivant la beauté de la majesté des êtres vivants. Elle conserve l’imagerie et le parallélisme du texte, tout en employant une syntaxe française naturelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:31Z'
