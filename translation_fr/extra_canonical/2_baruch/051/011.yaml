base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: fr
  text: Car les vastes étendues du paradis se déploieront devant eux ; la beauté de la majesté des êtres vivants qui sont sous le trône leur sera révélée, ainsi que toutes les armées angéliques, retenues maintenant par ma parole afin qu’elles n’apparaissent pas et maintenues par mon commandement à leurs places jusqu’à leur arrivée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « jusqu’à ce que leur venue arrive ».'
    reason: Signale la formulation littérale, redondante en français, sans imposer d’interprétation supplémentaire.
lexical_decisions:
- source_word: ܦܬܝܘܬܐ / notion d’« étendues » (texte du verset non visible dans l’extrait fourni)
  choice: les étendues
  rationale: Rend l’idée d’espaces vastes ou de régions du paradis sans ajouter une interprétation topographique précise.
- source_word: ܚܝ̈ܘܬܐ / « êtres vivants » (d’après la tradition textuelle représentée par la couche de consultation)
  choice: les êtres vivants
  rationale: Conserve le terme visionnaire traditionnel sans le réduire à « créatures » ni l’identifier davantage.
- source_word: notion de maintien par la parole et le commandement
  choice: retient / maintient à leur place
  rationale: La variation française évite une répétition lourde tout en préservant les deux actes parallèles d’autorité divine.
theological_decisions:
- issue: Identité des « êtres vivants » sous le trône
  choice: êtres vivants
  alternative: créatures vivantes
  rationale: Le texte ne précise pas davantage leur nature; la traduction conserve donc la désignation visionnaire sans l’assimiler explicitement aux anges.
- issue: Référent de « leur » dans « jusqu’à leur venue »
  choice: maintenir le pronom ambigu
  alternative: jusqu’à l’arrivée des justes glorifiés / jusqu’à l’arrivée des anges
  rationale: Le référent exact n’est pas explicitement résolu; le français garde cette ambiguïté au lieu d’imposer une lecture théologique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe a été légèrement fluidifiée. L’extrait syriaque fourni pour le chapitre s’interrompt avant le texte correspondant clairement à ce verset; les choix précis ont donc été contrôlés avec prudence à partir de la couche anglaise auditée, sans prétendre que les formes syriaques proposées soient directement attestées dans l’extrait visible.
