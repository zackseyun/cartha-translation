  verdict: revise
  source_fidelity: 'Révision nécessaire : la coordination syriaque vise les mêmes armées angéliques, retenues à la fois par la parole et par le commandement divins. La formulation en deux groupes (« ceux… et ceux… ») introduit une distinction qui n’est pas marquée par la syntaxe source. « La beauté de la majesté des êtres vivants » conserve aussi mieux la relation génitivale du texte que « la beauté majestueuse des êtres vivants ».'
  naturalness: Le français révisé demeure moderne et solennel. « Jusqu’à leur arrivée » évite la redondance littérale de « jusqu’à ce que leur venue arrive », tout en conservant le sens.
  terminology: « Paradis », « êtres vivants », « trône », « armées angéliques », « parole » et « commandement » gardent le registre visionnaire et l’autorité lexicale du passage sans identifier indûment les êtres vivants ni résoudre le référent au-delà de ce que permet le texte.
  issues:
  - severity: medium
    issue: Les anges sont présentés comme deux catégories distinctes.
    rationale: 'Le relatif pluriel qui qualifie les armées angéliques reçoit deux prédicats coordonnés : elles sont retenues par la parole afin de ne pas apparaître et maintenues par le commandement à leurs places. Le texte ne signale pas deux ensembles d’anges.'
  - severity: low
    issue: « Beauté majestueuse des êtres vivants » aplanit la construction source.
    rationale: La source exprime la beauté de leur majesté ; cette relation est préférable à un simple adjectif qualificatif.
  - severity: low
    issue: La note affirme que le référent de « leur » est incertain.
    rationale: Cette affirmation va au-delà de ce qui est nécessaire ici et pourrait suggérer une ambiguïté doctrinale. La note peut se limiter à signaler la tournure littérale redondante.
