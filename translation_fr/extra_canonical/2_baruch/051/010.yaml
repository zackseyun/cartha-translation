  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: fr
  text: Car ils habiteront sur les hauteurs de ce monde-là. Ils seront rendus semblables aux anges et égaux aux étoiles. Ils seront transformés en toutes les formes qu’ils désireront, de la beauté à la grâce, et de la lumière à la splendeur de la gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: « les hauteurs de ce monde-là » (tradition syriaque du verset)
  choice: sur les hauteurs de ce monde-là
  rationale: Conserve l’image spatiale et la distinction eschatologique de « ce monde-là », dans un français naturel.
- source_word: « semblables aux anges »
  choice: semblables aux anges
  rationale: Rend directement la comparaison sans suggérer que les humains deviennent des anges par nature.
- source_word: « égaux aux étoiles »
  choice: égaux aux étoiles
  rationale: Préserve le parallélisme avec les anges et l’imagerie astrale du texte.
- source_word: « toute forme qu’ils désirent »
  choice: selon toutes les formes qu’ils désireront
  rationale: Maintient l’étendue de la transformation et la part de désir exprimée, sans préciser davantage la nature de ces formes.
- source_word: « de la beauté à la grâce / beauté admirable »
  choice: de la beauté à une beauté plus admirable
  rationale: Le second terme marque une intensification difficile à reproduire par deux noms français nettement distincts; cette formulation conserve la progression sans employer l’ambigu « grâce » théologique.
- source_word: « de la lumière à la splendeur de la gloire »
  choice: de la lumière à la splendeur de la gloire
  rationale: Conserve l’accumulation lumineuse et la culmination dans la gloire.
theological_decisions:
- issue: Nature de l’assimilation aux anges
  choice: « semblables aux anges »
  alternative: « changés en anges »
  rationale: Le texte exprime une ressemblance, non une identification ontologique; la traduction évite donc d’affirmer que les ressuscités deviennent des anges.
- issue: Portée de la transformation
  choice: « transformés selon toutes les formes qu’ils désireront »
  alternative: « transformés en tout ce qu’ils voudront »
  rationale: La formulation retenue préserve l’idée de « forme » et l’ambiguïté du passage sans étendre la transformation à une toute-puissance illimitée.
- issue: Progression entre les deux termes de beauté
  choice: « de la beauté à une beauté plus admirable »
  alternative: « de la beauté à la grâce »
  rationale: « Grâce » pourrait introduire en français une notion sotériologique absente de cette opposition esthétique; l’intensification demeure néanmoins visible.
translation_notes:
  register: Français moderne, international et digne. Le verset est rythmé en trois phrases pour rendre lisible la série de transformations. L’extrait syriaque fourni s’interrompt avant le texte matériel de 51:10; le libellé est donc établi avec prudence à partir de la tradition syriaque attestée par la couche anglaise auditée, sans prétendre résoudre les nuances que l’extrait ne permet pas de contrôler directement.
