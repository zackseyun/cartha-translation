base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/007.yaml
  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: fr
  text: Mais pour ceux qui ont été sauvés par leurs œuvres, et pour qui la Loi a été une espérance, l’intelligence une attente et la sagesse une assurance, des prodiges se manifesteront en leur temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܕܩܘ / tradition textuelle correspondante
  choice: auront été sauvés
  rationale: Rend le salut reçu tout en conservant son lien explicite avec les œuvres, sans atténuer la tension théologique du passage.
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Terme usuel et digne pour la loi religieuse; la majuscule indique ici la Loi comme réalité reconnue dans le contexte.
- source_word: ܚܟܡܬܐ
  choice: la sagesse
  rationale: Équivalent français direct qui maintient le parallélisme avec la Loi et l’intelligence.
- source_word: 'ܫܘܒ̈ܚܐ / tradition textuelle: wonders'
  choice: des prodiges
  rationale: « Prodiges » convient à des manifestations extraordinaires et garde un registre biblique actuel sans être archaïque.
theological_decisions:
- issue: Rapport entre salut et œuvres
  choice: « sauvés par leurs œuvres »
  alternative: « délivrés grâce à leurs actes »
  rationale: La formulation retenue conserve sans l’expliquer ni la corriger l’affirmation théologiquement tendue transmise par le verset.
- issue: Valeur de la Loi, de l’intelligence et de la sagesse
  choice: 'Trois compléments parallèles: « une espérance », « une attente », « un motif d’assurance »'
  alternative: Faire de « l’intelligence » le qualificatif de l’attente
  rationale: Le parallélisme nominal est le mieux soutenu par la tradition de traduction et donne un français intelligible tout en évitant de fusionner les notions.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le futur antérieur situe le salut avant la manifestation annoncée des prodiges. « Motif d’assurance » est plus naturel que le calque « une assurance » tout en préservant la fonction parallèle de la sagesse.
