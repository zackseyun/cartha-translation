revisions:
- from: Mais pour ceux qui auront été sauvés par leurs œuvres, ceux pour qui la Loi aura été une espérance, l’intelligence une attente et la sagesse un motif d’assurance, des prodiges se manifesteront en leur temps.
  to: Mais pour ceux qui ont été sauvés par leurs œuvres, et pour qui la Loi a été une espérance, l’intelligence une attente et la sagesse une assurance, des prodiges se manifesteront en leur temps.
  rationale: 'La révision limite le futur à la manifestation annoncée des prodiges, conserve le parallélisme des trois noms abstraits et supprime l’ajout interprétatif « motif ». Aucune note n’est nécessaire en français : l’ellipse parallèle « l’intelligence une attente » est grammaticalement claire et ne masque pas une ambiguïté textuelle déterminante.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:25Z'
review_pass:
  verdict: revise
  source_fidelity: La structure ternaire du syriaque et de la tradition anglaise est bien rendue. Toutefois, le futur antérieur (« auront été sauvés », « aura été ») transforme des états/accomplissements antérieurs en un repérage futur plus marqué que le texte ne l’exige. « Motif d’assurance » ajoute l’idée de motif, absente de « confidence ».
  naturalness: Le français est soutenu et clair. La reprise de « ceux » après « pour » est possible, mais une coordination plus directe rend mieux le parallélisme. « La sagesse, une assurance » conserve l’ellipse nominale et demeure naturel dans ce registre.
  terminology: « La Loi », « intelligence », « sagesse » et « prodiges » conviennent. « Sauvés par leurs œuvres » maintient volontairement la formulation théologiquement sensible transmise par le texte, sans l’interpréter. Uniquement remplacer « motif d’assurance » par « assurance ».
  issues:
  - severity: medium
    issue: Emploi généralisé du futur antérieur
    rationale: Le texte présente les personnes caractérisées par leur salut et par le rôle qu’ont eu pour elles la Loi, l’intelligence et la sagesse; le futur porte sur l’apparition des prodiges. Le futur antérieur français impose une relation temporelle plus précise et plus prospective.
  - severity: medium
    issue: Ajout de « motif » dans « motif d’assurance »
    rationale: Le terme source/traditionnel correspondant à « confidence » désigne l’assurance ou la confiance; « motif » introduit une relation causale non exprimée.
  revised_text: Mais pour ceux qui ont été sauvés par leurs œuvres, et pour qui la Loi a été une espérance, l’intelligence une attente et la sagesse une assurance, des prodiges se manifesteront en leur temps.
  revised_footnotes: []
  revision_rationale: 'La révision limite le futur à la manifestation annoncée des prodiges, conserve le parallélisme des trois noms abstraits et supprime l’ajout interprétatif « motif ». Aucune note n’est nécessaire en français : l’ellipse parallèle « l’intelligence une attente » est grammaticalement claire et ne masque pas une ambiguïté textuelle déterminante.'
