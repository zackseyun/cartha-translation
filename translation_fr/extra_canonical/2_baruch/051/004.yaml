  yaml_path: translation/extra_canonical/2_baruch/051/004.yaml
  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: fr
  text: Surtout, ceux qui viendront après seront tout particulièrement bouleversés[a], parce qu’ils ont méprisé mes lois et se sont bouché les oreilles pour ne pas entendre la sagesse ni recevoir le discernement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « profondément ébranlés » ; le verbe peut exprimer une vive agitation, une détresse ou un bouleversement.
    reason: Préserve l’étendue sémantique du verbe syriaque sans imposer une seule forme de souffrance.
lexical_decisions:
- source_word: ܒܘܕܐ
  choice: Assurément
  rationale: Rend l’affirmation emphatique et certaine introduite par le syriaque.
- source_word: ܝܬܝܪܐܝܬ ܢܬܬܙܝܥܘܢ
  choice: seront tout particulièrement bouleversés
  rationale: Conserve à la fois l’intensification et l’image d’un profond ébranlement, sans réduire le terme à la seule tristesse.
- source_word: ܢܡܘܣܝ̈
  choice: mes lois
  rationale: Le nom syriaque porte le suffixe de première personne et présente ici une forme plurielle; «mes lois» suit donc directement le témoin fourni.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: se sont bouché les oreilles
  rationale: Expression française naturelle qui garde l’image concrète du refus volontaire d’écouter.
- source_word: ܢܩܒܠܘܢ ܣܘܟܠܐ
  choice: accueillir l’intelligence
  rationale: «Accueillir» préserve l’idée de recevoir ou d’accepter, tandis qu’«intelligence» rend la faculté de discernement visée.
theological_decisions:
- issue: Nombre du terme désignant la loi divine
  choice: mes lois
  alternative: ma loi
  rationale: Le texte syriaque fourni est morphologiquement pluriel. Le singulier pourrait harmoniser avec une formulation théologique plus familière, mais il ne doit pas remplacer silencieusement la forme attestée.
- issue: Nature de la réaction ou du jugement annoncé
  choice: seront tout particulièrement bouleversés
  alternative: seront affligés / tourmentés
  rationale: Le verbe syriaque évoque d’abord le fait d’être secoué ou ébranlé. La traduction évite de préciser sans nécessité s’il s’agit uniquement de chagrin intérieur ou d’un tourment judiciaire.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase garde l’emphase initiale et réorganise légèrement l’énoncé pour rendre naturelle en français l’identification de «ceux-là» avec ceux qui ont rejeté les lois et refusé d’écouter.
