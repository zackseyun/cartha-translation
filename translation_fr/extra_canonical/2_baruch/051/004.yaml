  - severity: medium
    issue: « Assurément » ne rend pas la relation et l’intensification de l’ouverture
    rationale: Le contexte syriaque emploie une formulation qui intensifie le sort du groupe visé (« plus encore / surtout »), plutôt qu’une simple affirmation de certitude.
  - severity: low
