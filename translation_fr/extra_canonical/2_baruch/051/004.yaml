  naturalness: 'La reprise « ceux-là … : ceux qui » est lourde. « Recevoir le discernement » est plus idiomatique et plus précis dans le français actuel que « accueillir l’intelligence », tout en conservant le sens de compréhension/discernement.'
  terminology: « Sagesse » est exact. « Mes lois » respecte la morphologie plurielle du texte fourni, sans imposer l’harmonisation au singulier de la tradition anglaise. « Discernement » rend naturellement le syriaque ܣܘܟܠܐ (« compréhension, intelligence »).
