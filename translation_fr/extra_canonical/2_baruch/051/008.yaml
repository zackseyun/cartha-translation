lexical_decisions:
- source_word: ܥܠܡܐ
  choice: ce monde
  rationale: Le nom syriaque désigne ici le monde à venir; le démonstratif maintient le renvoi à cette réalité précise sans ajouter une interprétation absente du texte.
- source_word: ܚܒܝܐ
  choice: caché
  rationale: Ce terme exprime ce qui est dissimulé ou soustrait à la vue. « Caché » restitue naturellement l’opposition avec le fait de voir.
theological_decisions:
- issue: Identification du monde contemplé
  choice: « ce monde »
  alternative: « le monde à venir »
  rationale: La traduction ne précise pas explicitement « à venir », afin de conserver la formulation du texte et de ne pas développer son eschatologie au-delà de ce qu’énonce ce membre de phrase.
translation_notes:
  register: Français moderne, simple et digne. La virgule finale est conservée parce que le membre de phrase se poursuit dans le contexte littéraire.
