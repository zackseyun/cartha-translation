base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: fr
  text: Car ils se sont choisi ce temps-ci, qui ne peut s’écouler sans angoisse, et ils se sont choisi ce temps-là, dont la fin est pleine de lamentations et de malheurs. Ils ont rejeté le monde qui ne fait pas vieillir ceux qui y entrent[a], et ils ont rejeté le temps de gloire, si bien qu’ils n’accéderont pas à l’honneur dont je t’ai parlé auparavant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une compréhension moins probable de la forme verbale : « qui ne vieillit pas pour ceux qui y entrent ».'
    reason: Signaler l’autre analyse attestée tout en maintenant dans le texte la valeur causative du syriaque.
lexical_decisions:
- source_word: ܡܣܐܒ / forme causative de ܣܐܒ
  choice: ne fait pas vieillir
  rationale: 'La forme syriaque est causative et transitive : le monde en question ne fait pas vieillir ceux qui y entrent. Cette formulation évite de lui donner à tort un sens intransitif.'
- source_word: ܥܠܡܐ
  choice: monde
  rationale: Dans ce contexte eschatologique, « monde » rend naturellement le domaine durable auquel les personnes peuvent accéder, sans effacer l’ambivalence possible avec « âge ».
- source_word: ܬܫܒܘܚܬܐ
  choice: gloire
  rationale: « Gloire » conserve le vocabulaire honorifique et eschatologique du passage.
- source_word: ܐܝܩܪܐ
  choice: honneur
  rationale: Le choix distingue l’honneur reçu de la gloire caractérisant le temps à venir.
theological_decisions:
- issue: Effet du monde à venir sur ceux qui y entrent
  choice: « le monde qui ne fait pas vieillir ceux qui y entrent »
  alternative: « le monde qui ne vieillit pas pour ceux qui y entrent »
  rationale: La lecture causative présente le monde à venir comme n’imposant pas le vieillissement à ses habitants; elle ne doit pas être réduite à la seule incorruptibilité du monde lui-même.
- issue: Lien entre le rejet du temps de gloire et la privation d’honneur
  choice: « si bien qu’ils n’accéderont pas »
  alternative: « afin qu’ils n’accèdent pas »
  rationale: Le français exprime ici une conséquence de leur rejet sans suggérer qu’ils auraient recherché délibérément leur propre exclusion.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition « ils se sont choisi » est conservée pour refléter l’insistance du texte; « ce temps-ci / ce temps-là » maintient son contraste déictique.
