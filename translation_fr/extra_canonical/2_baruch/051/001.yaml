  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: fr
  text: Et il arrivera qu’après que ce jour fixé sera passé, la forme de ceux qui sont condamnés sera alors transformée, ainsi que la gloire de ceux qui ont été reconnus justes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : «que la forme de ceux qui sont condamnés sera ensuite transformée, ainsi que la gloire de ceux qui ont été reconnus justes».'
    reason: La construction permet de rattacher plus étroitement l’indication temporelle à la transformation de la forme des condamnés.
lexical_decisions:
- source_word: ܨܘܪܬܗܘܢ
  choice: la forme
  rationale: Conserve le terme concret et le motif apocalyptique de la transformation, tout en restant cohérent avec ses autres emplois dans le chapitre.
- source_word: ܐܙܕܩܘ
  choice: ont été reconnus justes
  rationale: Rend la portée judiciaire du verbe sans imposer au passage une terminologie confessionnelle ultérieure; la tournure indique un verdict favorable.
- source_word: ܫܘܒܚܐ / ܬܫܒܘܚܬܗܘܢ
  choice: la gloire
  rationale: Préserve le vocabulaire d’honneur et de splendeur eschatologiques ainsi que le parallèle avec la forme transformée.
- source_word: ܗܘ ܝܘܡܐ …
  choice: ce jour fixé
  rationale: Exprime le jour déterminé dont le passage marque le début de la transformation eschatologique; le témoin transmis est difficile à cet endroit, mais le contexte et les contrôles textuels soutiennent ce sens.
theological_decisions:
- issue: Portée de la reconnaissance des justes
  choice: 'Le texte parle d’un verdict favorable: «ceux qui ont été reconnus justes».'
  alternative: «ceux qui ont été justifiés» ou «les justes»
  rationale: Cette formulation maintient la dimension judiciaire sans réduire le propos à une catégorie doctrinale postérieure ni transformer le verbe en simple désignation morale.
- issue: Transformation de la forme et de la gloire
  choice: La transformation porte syntaxiquement sur la forme des condamnés et sur la gloire de ceux qui sont reconnus justes.
  alternative: Ne rattacher explicitement la transformation qu’à la forme des condamnés
  rationale: La coordination resserrée du passage permet naturellement de comprendre les deux groupes nominaux sous le même verbe, tout en laissant la suite du chapitre préciser la nature différente de leur transformation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. «Il arrivera» garde la solennité narrative; «une fois passé» évite une succession lourde de marqueurs temporels. Le parallélisme eschatologique et la tension judiciaire du texte sont conservés.
