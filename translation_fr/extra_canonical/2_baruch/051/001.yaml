  - severity: low
    issue: Inversion syntaxique pesante
    rationale: « Seront alors transformées la forme… ainsi que la gloire… » retarde deux groupes sujets de nature différente et sonne excessivement littéraire. Placer « la forme » avant « sera transformée » améliore nettement la lisibilité.
  - severity: low
    issue: 'Note a : « puis aussi » ajoute une progression mal fondée'
    rationale: La variante concerne la portée de l’adverbe temporel, non l’ajout d’une étape distincte entre les deux membres coordonnés. La note doit exprimer cette portée sans suggérer une chronologie supplémentaire.
