  verdict: revise
  source_fidelity: 'Le sens de la phrase est conservé : le repère temporel (« après que ce jour fixé sera passé »), la transformation de la forme des condamnés et la gloire de ceux qui ont été reconnus justes correspondent à la formulation syriaque transmise et à l’audit anglais. La note doit toutefois rendre plus précisément l’ambiguïté de portée temporelle, sans introduire une succession supplémentaire (« puis aussi »).'
  naturalness: La construction actuelle avec inversion (« seront alors transformées la forme… ainsi que la gloire… ») est grammaticalement possible, mais lourde et peu naturelle en français moderne. Une formulation où le sujet précède le verbe est plus claire tout en préservant le parallélisme.
  terminology: « forme », « condamnés », « gloire » et « ont été reconnus justes » sont appropriés. « Reconnus justes » conserve la nuance judiciaire de ܐܙܕܩܘ sans imposer la terminologie doctrinale de « justifiés ».
