  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: fr
  text: Car les premiers recevront les derniers, ceux qu’ils attendaient ; et les derniers recevront ceux dont ils avaient entendu dire qu’ils étaient morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡܝ̈ܐ / ܐܚܪ̈ܝܐ (sens attesté par la couche de consultation)
  choice: les premiers / les derniers
  rationale: Conserve le contraste temporel et l’ambiguïté sur les groupes concernés, sans préciser leur identité.
- source_word: recevoir (relation réciproque dans le contexte de la résurrection)
  choice: recevront
  rationale: Terme sobre qui préserve l’idée de retrouvailles sans ajouter explicitement « accueillir » ou « reconnaître ».
- source_word: passer de ce monde / mourir
  choice: étaient morts
  rationale: Dans ce contexte, la formule désigne le décès ; cette expression française est claire et digne, sans atténuer la réalité de la mort.
theological_decisions:
- issue: Identité des « premiers » et des « derniers »
  choice: Maintien des désignations non expliquées
  alternative: Les générations anciennes et les générations ultérieures
  rationale: Le verset ne définit pas explicitement ces groupes ; les préciser introduirait une interprétation.
- issue: Nature de la rencontre après la résurrection
  choice: « recevront »
  alternative: « accueilleront » ou « reconnaîtront »
  rationale: Le choix retenu ne tranche pas entre accueil, retrouvailles et reconnaissance mutuelle.
