base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: fr
  text: Quant à la gloire de ceux qui ont maintenant été reconnus justes selon ma Loi[a] — ceux qui ont fait preuve de discernement durant leur vie et qui ont planté dans leur cœur la racine de la sagesse —, leur splendeur sera alors glorifiée à travers des transformations, et l’aspect de leur visage resplendira de la lumière de leur beauté, afin qu’ils reçoivent le monde qui ne meurt pas, celui qui leur est promis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La transcription syriaque fournie peut aussi se lire : « ceux qui ont été reconnus justes en leur temps »; la leçon suivie dans le texte est : « ceux qui ont maintenant été reconnus justes selon ma Loi ».'
    reason: Divergence textuelle importante touchant à la fois l’indication temporelle et la mention de la Loi.
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ / ܙܝܘܗܘܢ
  choice: leur gloire / leur splendeur
  rationale: La construction détachée présente d’abord la « gloire » comme thème, puis reprend le groupe par un nouveau sujet, « leur splendeur ». Deux termes français permettent de conserver cette reprise sans l’aplanir.
- source_word: ܫܘܒܠܐ
  choice: discernement
  rationale: Dans ce contexte sapientiel, le terme désigne l’intelligence ou la compréhension qui oriente la vie; « discernement » est naturel et digne en français moderne.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: la racine de la sagesse
  rationale: Conservation de la métaphore concrète de la racine plantée dans le cœur.
- source_word: ܒܫܘܒ̈ܚܐ
  choice: à travers des transformations
  rationale: Le contexte décrit le changement eschatologique de l’apparence; cette formulation garde le pluriel et évite de préciser indûment la nature des transformations.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  choice: le monde qui ne meurt pas
  rationale: Traduction imagée et proche de la formulation syriaque, plutôt que l’abstraction « monde impérissable ».
theological_decisions:
- issue: Justification et Loi
  choice: ont maintenant été reconnus justes selon ma Loi
  alternative: ont été reconnus justes en leur temps
  rationale: Le texte de consultation et la tradition textuelle contrôlée de ce passage soutiennent la leçon « maintenant… selon ma Loi ». La transcription fournie paraît toutefois lire « en leur temps »; cette divergence est signalée en note plutôt que résolue silencieusement.
- issue: Nature de la récompense finale
  choice: le monde qui ne meurt pas
  alternative: le monde éternel
  rationale: La formulation concrète du texte est maintenue sans identifier davantage ce monde ni imposer une systématisation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la construction thématique détachée du syriaque (« Quant à la gloire… leur splendeur… »), ainsi que la tension entre gloire présente comme thème et transformation future comme prédicat.
