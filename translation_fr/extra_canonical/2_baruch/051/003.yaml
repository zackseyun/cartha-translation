review_pass:
  verdict: revise
  source_fidelity: La transcription syriaque fournie porte « ceux qui ont été reconnus justes en leur temps » (ܕܗܘܐ ܐܙܕܩܘ ܒܙܒܢܗܘܢ), et non « maintenant… selon ma Loi ». La note du projet signale correctement une divergence, mais le texte principal doit suivre la source fournie. De plus, le verbe concernant la forme du visage décrit un changement en lumière, nuance que « resplendira de » n’exprime pas pleinement.
  naturalness: La phrase est fluide et de registre soutenu accessible. « Quant à la gloire… leur splendeur… » rend naturellement la construction thématique détachée. « Lors de transformations » conserve le pluriel sans alourdir la formulation.
  terminology: « Reconnus justes » rend prudemment le terme de justification sans importer une lecture confessionnelle. « Discernement », « racine de la sagesse » et « monde qui ne meurt pas » sont justes et naturels. « Lumière de leur gloire » reflète plus directement le vocabulaire d’honneur/gloire que « beauté ».
  issues:
  - severity: high
    issue: La leçon principale « ont maintenant été reconnus justes selon ma Loi » ne correspond pas à la transcription syriaque fournie.
    rationale: Le texte source lu dans le dossier porte « ont été reconnus justes en leur temps ». L’audit anglais atteste une autre leçon, mais la divergence ne doit pas être résolue en faveur de celle-ci dans le corps du texte sans base textuelle fournie.
  - severity: medium
    issue: « L’aspect de leur visage resplendira de la lumière » atténue le changement de forme exprimé par le syriaque.
    rationale: Le passage décrit la forme de leur visage comme transformée/changée en lumière; la révision préserve ce mouvement.
  - severity: low
    issue: « Beauté » est moins précis que le champ de la gloire/de l’honneur dans ce contexte.
    rationale: « Gloire » maintient la cohérence terminologique avec le thème initial et reflète plus directement le terme syriaque.
  revised_text: Quant à la gloire de ceux qui ont été reconnus justes en leur temps[a] — ceux qui ont fait preuve de discernement durant leur vie et qui ont planté dans leur cœur la racine de la sagesse —, leur splendeur sera alors glorifiée lors de transformations, et la forme de leur visage sera changée en la lumière de leur gloire, afin qu’ils reçoivent le monde qui ne meurt pas, celui qui leur est promis.
  revised_footnotes:
  - marker: a
    text: 'Autre leçon textuelle, suivie par l’audit anglais : « ceux qui ont maintenant été reconnus justes selon ma Loi ». La transcription syriaque fournie lit : « ceux qui ont été reconnus justes en leur temps ».'
    reason: Divergence textuelle importante concernant l’indication temporelle et la mention de la Loi.
  revision_rationale: La révision suit en texte principal la leçon de la source syriaque fournie, tout en conservant l’autre leçon attestée dans l’audit anglais en note. Elle restitue aussi plus exactement la transformation de la forme du visage en lumière, sans préciser la nature eschatologique des transformations.
