  text: For the form of those who now act wickedly will become worse than it is, so that they may endure torment.
translation:
  language: fr
  text: Car la forme de ceux qui agissent maintenant avec méchanceté deviendra pire qu’elle ne l’est, pour qu’ils endurent le tourment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: l’apparence
  rationale: Dans ce contexte de transformation visible à la résurrection, le terme désigne l’aspect ou la forme manifestée des personnes, plutôt qu’une simple ressemblance.
- source_word: ܒܝܫ
  choice: pire
  rationale: Le comparatif est explicitement marqué par ܡܢ et décrit la dégradation de leur apparence.
- source_word: ܬܫܢܝܩܐ
  choice: le tourment
  rationale: Rend le nom syriaque désignant une souffrance punitive intense, sans préciser davantage sa nature.
theological_decisions:
- issue: Finalité exprimée par la proposition introduite par ܕ
  choice: afin qu’ils subissent le tourment
  alternative: de sorte qu’ils subiront le tourment
  rationale: La construction peut porter une nuance de résultat ou de finalité. « Afin que » conserve la formulation téléologique du texte de consultation sans développer l’agent ni la nature du jugement.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le lien causal, la transformation négative de l’apparence et la tension entre finalité et conséquence.
