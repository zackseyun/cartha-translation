translation:
  language: fr
  text: Alors, l’excellence des justes surpassera celle des anges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[texte syriaque du verset non visible dans l’extrait fourni]'
  choice: l’excellence
  rationale: Le verset précis n’apparaît pas dans l’extrait syriaque transmis, qui s’interrompt au milieu du chapitre. « Excellence » suit donc prudemment la couche anglaise auditée sans préciser indûment la nature de cette supériorité.
- source_word: '[comparatif reflété par « greater than »]'
  choice: surpassera
  rationale: Cette formulation française naturelle conserve la comparaison explicite entre les justes et les anges.
theological_decisions:
- issue: Nature de la supériorité des justes sur les anges
  choice: Ne pas expliquer en quoi consiste cette excellence
  alternative: Préciser qu’il s’agit de gloire, de rang ou de splendeur
  rationale: La formulation disponible demeure générale; une précision introduirait une interprétation absente des données fournies.
translation_notes:
  register: Français moderne, digne et direct. Le futur rend l’orientation eschatologique de l’énoncé; « les justes » et « les anges » conservent la terminologie religieuse courante.
