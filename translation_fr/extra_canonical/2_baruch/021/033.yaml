translation:
  language: fr
  text: '[Aie égard à][a] l’amour de ton nom, qui est devant toi par-dessus tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « Aie égard à » sont restitués pour compléter le sens; le texte transmis dans l’extrait fourni est lacunaire ou incertain à cet endroit.
    reason: Signaler honnêtement que l’impératif est une supplémentation éditoriale, conformément aux crochets de la couche anglaise auditée.
lexical_decisions:
- source_word: ܚܘܒܐ (probable underlying reading)
  choice: l’amour
  rationale: Rend le substantif sémitique « amour » sans préciser à tort s’il s’agit de l’amour porté au nom divin ou de l’amour associé à ce nom.
- source_word: ܫܡܟ (probable underlying reading)
  choice: ton nom
  rationale: Conserve le langage biblique du « nom », avec sa portée ouverte de réputation, de présence et d’identité.
- source_word: ܩܕܡܝܟ
  choice: devant toi
  rationale: Traduction directe de l’expression spatiale et judiciaire, sans la réduire à « connu de toi » ou « présent à ton esprit ».
- source_word: ܡܢ ܟܠ / ܠܥܠ ܡܢ ܟܠ (probable underlying expression)
  choice: par-dessus tout
  rationale: Préserve la valeur superlative attestée par la couche anglaise contrôlée.
theological_decisions:
- issue: Référent de « l’amour de ton nom »
  choice: Maintenir la formulation génitive ouverte
  alternative: « l’amour que nous portons à ton nom » ou « l’amour lié à ton nom »
  rationale: Le génitif peut exprimer plusieurs rapports; la traduction ne doit pas décider sans preuve qui aime ni comment cet amour se rapporte au nom divin.
- issue: Impératif non intégralement assuré dans l’extrait syriaque fourni
  choice: Restituer « Aie égard à » entre crochets
  alternative: Présenter l’impératif sans signalement ou laisser une phrase nominale fragmentaire
  rationale: La couche anglaise auditée indique un verbe suppléé; les crochets rendent cette reconstruction visible sans masquer l’état fragmentaire de la preuve source.
translation_notes:
  register: Français international moderne, sobre et digne. « Aie égard à » garde la tonalité d’une prière solennelle tout en restant compréhensible; la syntaxe conserve l’ambiguïté de « l’amour de ton nom ».
