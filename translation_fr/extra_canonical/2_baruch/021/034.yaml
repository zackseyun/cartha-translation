  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: fr
  text: Dès maintenant donc, manifeste ta grandeur et ne ferme pas les yeux sur ce qui est réduit à néant sous le règne de la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܒܘܬܐ / greatness (reconstructed from the verse-level consultation evidence)
  choice: grandeur
  rationale: « Grandeur » conserve l’idée d’une majesté ou puissance divine rendue manifeste, sans la réduire à la seule gloire.
- source_word: overlook (verse-level sense; Syriac line not securely isolated in the supplied page bucket)
  choice: ne ferme pas les yeux sur
  rationale: Cette tournure française naturelle exprime le fait de ne pas ignorer ou laisser sans intervention ce qui périt.
- source_word: kingdom/reign of death (verse-level consultation evidence)
  choice: règne de la mort
  rationale: « Règne » convient mieux qu’« royaume » à la domination exercée par la mort et préserve la personnification implicite.
theological_decisions:
- issue: Nature de la demande adressée à Dieu
  choice: « manifeste ta grandeur »
  alternative: « montre ta puissance »
  rationale: Le choix retenu garde la portée théologique plus large de la grandeur divine sans préciser indûment qu’il s’agit uniquement de puissance.
- issue: Domination de la mort
  choice: « sous le règne de la mort »
  alternative: « dans le royaume de la mort »
  rationale: « Règne » maintient l’idée d’une puissance dominatrice sans transformer nécessairement la mort en territoire ou en lieu.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif de prière est direct, et l’image du règne de la mort est conservée. Le découpage exact du verset syriaque n’étant pas visible avec certitude dans le lot de pages fourni, la formulation s’appuie sur le sens verset-par-verset audité tout en évitant toute précision doctrinale ajoutée.
