translation:
  language: fr
  text: Tu ne décrètes[a] la pluie et le déluge qu’à cause[b] de l’être humain pécheur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prononces »; littéralement « parles ».
    reason: Le syriaque emploie le verbe courant « parler », ici dans le sens d’une parole faisant autorité.
  - marker: b
    text: Ou « au sujet de ».
    reason: Le rapport exprimé peut être compris comme causal ou thématique; la traduction principale retient la valeur causale indiquée par la couche de consultation auditée.
lexical_decisions:
- source_word: ܡܡܠܠ
  choice: décrètes
  rationale: Le verbe signifie littéralement « parler », mais avec « la pluie et le déluge » comme objets, le contexte évoque une parole souveraine qui ordonne ou décrète ces phénomènes. « Décréter » produit un français naturel sans effacer la valeur de parole, signalée en note.
- source_word: ܛܘܦܢܐ ܡܛܪܐ
  choice: la pluie et le déluge
  rationale: Les deux substantifs désignent respectivement le déluge et la pluie; l’ordre français suit la couche anglaise auditée et forme un couple naturel, sans modifier le sens.
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ
  choice: l’être humain pécheur
  rationale: ܐܢܫܐ est générique et ܡܣܟܠܢܐ qualifie celui qui faute ou pèche. « L’être humain pécheur » est inclusif, actuel et théologiquement non surinterprété.
theological_decisions:
- issue: Lien entre le jugement cosmique et le péché humain
  choice: qu’à cause de l’être humain pécheur
  alternative: qu’au sujet de l’être humain pécheur
  rationale: La lecture causale correspond à la révision auditée et rend le péché humain comme motif de la pluie et du déluge judiciaires. Une lecture thématique demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure restrictive « ne… que » rend naturellement « excepté / sauf », tandis que les notes préservent les ambiguïtés lexicales réelles.
