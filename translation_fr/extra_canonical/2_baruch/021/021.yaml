  text: For if this life alone were given to human beings, nothing would be more bitter than this.
translation:
  language: fr
  text: Car si cette vie seule était donnée aux êtres humains, rien ne serait plus amer qu’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ / expression sous-jacente relative à la vie
  choice: cette vie
  rationale: Rend simplement la référence déictique à la vie présente, conformément au sens attesté par la tradition textuelle.
- source_word: ܒ̈ܢܝ ܐܢܫܐ / expression sous-jacente désignant les humains
  choice: les êtres humains
  rationale: Formulation inclusive et naturelle en français moderne, sans modifier la portée universelle de l’expression sémitique.
- source_word: ܡܪܝܪ / notion d’amertume
  choice: amer
  rationale: Conserve l’image concrète et la force évaluative de l’amertume plutôt que de la remplacer par « pénible » ou « cruel ».
theological_decisions:
- issue: Portée de la restriction
  choice: '« cette vie seule » : la restriction porte sur la vie présente comme unique don ou horizon'
  alternative: '« seulement donnée » : la restriction porterait sur l’acte de donner'
  rationale: Cette place de « seule » préserve le contraste eschatologique implicite sans l’expliciter davantage.
- issue: Valeur de la proposition conditionnelle
  choice: « si cette vie seule était donnée »
  alternative: « si cette vie seule avait été donnée »
  rationale: L’imparfait avec le conditionnel présent exprime une hypothèse générale ou irréelle actuelle et correspond au sens de « were given », sans transformer l’énoncé en hypothèse strictement passée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure conditionnelle, l’ambiguïté sur ce qui dépasse la vie présente et la métaphore de l’amertume.
