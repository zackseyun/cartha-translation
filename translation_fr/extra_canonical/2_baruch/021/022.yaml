  text: For what is visible in them? Or what visible hope is there? Or what visible dwelling is not vanity?
translation:
  language: fr
  text: Car qu’y a-t-il de visible en eux ? Ou quelle espérance visible y a-t-il ? Ou quelle demeure visible n’est pas vaine ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ
  choice: visible
  rationale: Rend le participe/passif lié à la perception visuelle et conserve la répétition rhétorique des trois propositions.
- source_word: ܣܒܪܐ
  choice: espérance
  rationale: Dans ce contexte de prière et de réflexion sur ce qui subsiste, « espérance » exprime mieux l’attente confiante que le simple « espoir ».
- source_word: ܥܘܡܪܐ
  choice: demeure
  rationale: Terme naturel et digne qui conserve l’idée d’un lieu où l’on demeure, sans préciser indûment s’il s’agit d’une habitation terrestre ou durable.
- source_word: ܣܪܝܩܘܬܐ
  choice: vaine
  rationale: L’adjectif « vaine » convient idiomatiquement à « demeure » tout en gardant l’idée de vacuité, d’inconsistance ou de caractère passager.
theological_decisions:
- issue: Portée de la vanité appliquée à la demeure visible
  choice: n’est pas vaine
  alternative: n’est pas vanité
  rationale: 'Le français idiomatique appelle ici un adjectif, mais celui-ci conserve la tension théologique du texte : toute demeure visible est dite inconsistante ou passagère, sans développer cette affirmation en doctrine particulière.'
translation_notes:
  register: Français international moderne, sobre et digne. La triple interrogation et la répétition de « visible » sont conservées afin de reproduire l’insistance rhétorique du passage.
