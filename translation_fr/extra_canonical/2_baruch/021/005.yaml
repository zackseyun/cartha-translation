translation:
  language: fr
  text: Toi qui as commandé à l’air par ton signe et qui as vu les choses à venir comme celles que tu accomplis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܩܝܕܐ … ܒܪܘܙܝܟ
  choice: d’un signe, as donné des ordres
  rationale: Rend l’idée d’ordonner ou de commander au moyen d’un signe, sans ajouter un possessif absent ni réduire le geste à un « hochement de tête ».
- source_word: ܠܐܐܪ / ܠܐܙܐ
  choice: à l’air
  rationale: Suit la lecture contrôlée du syriaque comme « l’air », cohérente avec la tradition textuelle et le contexte de la souveraineté divine sur la création.
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: les choses à venir
  rationale: Expression française naturelle qui conserve le caractère indéfini et futur du syriaque.
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ
  choice: comme celles que tu accomplis
  rationale: Conserve la comparaison présente dans la source et son présent verbal, au lieu de supprimer cette proposition difficile.
theological_decisions:
- issue: Rapport entre la connaissance divine et les événements futurs
  choice: « as vu les choses à venir comme celles que tu accomplis »
  alternative: « as vu les choses à venir »
  rationale: La proposition comparative est explicitement attestée dans le syriaque. La conserver maintient la tension entre vision anticipée et action divine, sans l’expliquer selon un système théologique particulier.
translation_notes:
  register: Prière en adresse directe, dans un français moderne et digne. La formulation conserve le parallélisme des deux propositions relatives et l’étrangeté mesurée de la comparaison finale, qui appartient au texte source.
