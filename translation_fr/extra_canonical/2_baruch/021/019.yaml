  yaml_path: translation/extra_canonical/2_baruch/021/019.yaml
  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: fr
  text: C’est pourquoi celui qui vit ne se réjouit pas de sa vie.[a] J’ai considéré les fils des hommes et j’ai vu qu’ils étaient peu nombreux et qu’ils n’étaient rien d’autre que la vanité d’Adam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui vit ne se réjouit pas tant que dure sa vie » ou « ne se réjouit pas dans sa vie ».'
    reason: La relation exacte entre le fait de vivre, la vie et l’absence de joie peut être comprise de manière temporelle/circonstancielle ou comme portant sur la vie elle-même.
  - marker: b
    text: Ici, « vanité » peut aussi évoquer ce qui est inconsistant, futile ou passager.
    reason: Le terme possède un champ sémantique plus large que la seule prétention orgueilleuse du français courant.
lexical_decisions:
- source_word: ܚܝܐ / ܚܝ̈ܐ (champ lexical de la vie)
  choice: celui qui vit… dans sa vie
  rationale: Cette formulation conserve la répétition du champ lexical de la vie et la relation prépositionnelle sans transformer le propos en jugement sur la valeur de la vie.
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: les fils des hommes
  rationale: Expression anthropologique traditionnelle, intelligible en français biblique moderne, qui maintient le lien avec Adam dans la proposition suivante.
- source_word: ܣܪܝܩܘܬܐ / notion de vanité
  choice: la vanité
  rationale: « Vanité » préserve l’éventail sémantique biblique de ce qui est inconsistant, futile ou passager, au lieu de choisir arbitrairement une seule nuance.
- source_word: ܐܕܡ
  choice: Adam
  rationale: Le nom propre est maintenu, plutôt que généralisé en « humanité », afin de conserver la formulation et la tension anthropologique du texte.
theological_decisions:
- issue: Portée de « la vanité d’Adam »
  choice: Conserver « la vanité d’Adam »
  alternative: « la condition éphémère de l’humanité »
  rationale: La traduction ne réduit pas la phrase à une doctrine particulière du péché originel ni à la seule mortalité; elle garde l’image dense associée à Adam.
- issue: Nature de l’absence de joie
  choice: « ne se réjouit pas dans sa vie »
  alternative: « ne se réjouit pas de sa vie » ou « ne se réjouit pas tant que dure sa vie »
  rationale: Le choix principal suit de près la relation locale ou circonstancielle, tandis que la note signale l’autre compréhension possible sans la trancher.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe garde une légère couleur biblique (« fils des hommes », « vanité d’Adam ») parce que ces expressions structurent l’anthropologie du verset. Les répétitions et ambiguïtés significatives sont conservées plutôt que lissées.
