  text: “Woe to my heart, for it bursts open into a spring of grief, and from there tears flow from my eyes, and I am not satisfied with weeping.”
translation:
  language: fr
  text: « Malheur à mon cœur, oppressé à la source du deuil[a] ! De là, mes yeux versent des larmes, et je ne me rassasie pas de pleurer. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon cœur est resserré à la source du deuil ».'
    reason: Le syriaque peut évoquer un cœur resserré, dans l’angoisse, ou accablé.
lexical_decisions:
- source_word: ܕܡܨܪ (d-meṣar)
  choice: car il est oppressé
  rationale: Le verbe exprime ici l’étroitesse ou l’angoisse du cœur. « Oppressé » rend naturellement cette détresse sans inverser l’image en faisant du cœur une source qui éclate.
- source_word: ܒܡܒܘܥܐ ܕܐܒܠܐ (b-mabbūʿā d-ʾeḇlā)
  choice: à la source du deuil
  rationale: Traduction directe de l’image syriaque de la source ou fontaine associée au deuil.
- source_word: ܘܠܡܒܟܐ ܠܐ ܐܫܒܥ (wa-l-meḇkā lā ʾeśbaʿ)
  choice: et mes pleurs ne me rassasient pas
  rationale: Conserve la métaphore de la satiété exprimée par le verbe « être rassasié », tout en donnant une formulation française intelligible.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. La répétition du champ lexical des pleurs est maintenue, ainsi que les images syriaques de la source et de la satiété.
