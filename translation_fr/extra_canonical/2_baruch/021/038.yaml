  text: Et que ceux qui sont avec eux et qui leur ressemblent sachent que tel est le temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: le temps
  rationale: Le nom syriaque désigne ici le temps ou l’époque déterminée; «le temps» conserve la formulation sobre et eschatologiquement ouverte.
- source_word: ܐܝܟ
  choice: qui leur ressemblent
  rationale: La comparaison est rendue naturellement en français par une relative, sans préciser en quoi consiste la ressemblance.
theological_decisions:
- issue: Nature du «temps» mentionné
  choice: tel est le temps
  alternative: c’est maintenant le moment fixé
  rationale: La traduction ne précise pas s’il s’agit d’une époque historique, d’un délai providentiel ou d’un moment eschatologique, puisque le texte ne tranche pas explicitement.
translation_notes:
  register: Français moderne, digne et direct. La structure exhortative est conservée; «ceux qui sont avec eux» reste volontairement indéterminé. L’identification du verset dans le feuillet syriaque fourni demeure difficile en raison du découpage interpolé et du chevauchement des pages; la formulation suit la lecture attestée par la couche de consultation anglaise tout en maintenant les équivalents syriaques plausibles.
