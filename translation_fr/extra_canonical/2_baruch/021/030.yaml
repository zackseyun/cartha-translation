translation:
  language: fr
  text: afin que la ruine de l’être humain ne paraisse pas de nouveau comme si l’être humain n’avait pas été créé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte syriaque de cette proposition est difficile et sa formulation exacte demeure incertaine. Autre traduction possible : « afin que la ruine de l’être humain ne soit pas de nouveau manifeste, comme si l’être humain n’avait pas été créé ».'
    reason: La syntaxe et la segmentation du témoin syriaque dans ce passage sont obscures. La note signale l’incertitude sans imposer une interprétation de la comparaison.
lexical_decisions:
- source_word: ܡܬܚܒܠܘܬܗܘܢ
  choice: la ruine de l’être humain
  rationale: Le terme exprime l’idée de corruption, de destruction ou de ruine. Le singulier collectif français « l’être humain » restitue ici la portée générique de la proposition.
- source_word: ܠܐ ܗ̈ܘܝ ܕܢܩܘܡܘܢ
  choice: ne donne plus l’impression qu’il n’a jamais été créé
  rationale: 'La transmission et la segmentation du passage sont difficiles. Cette formulation française rend le sens attesté par la tradition de traduction : la ruine de l’humanité ne doit pas faire paraître vaine ou comme inexistante sa création.'
theological_decisions:
- issue: Portée de la comparaison entre la ruine humaine et la non-création
  choice: Conserver l’image paradoxale sans l’expliquer théologiquement
  alternative: 'Paraphraser : « afin que la création de l’être humain ne paraisse pas avoir été vaine »'
  rationale: La paraphrase expliciterait une conclusion possible, mais supprimerait la tension du texte entre destruction et création.
translation_notes:
  register: Français international actuel, sobre et digne. « L’être humain » évite l’ambiguïté moderne de « l’homme » tout en gardant la valeur générique. « Ne donne plus l’impression » produit une phrase naturelle sans dissoudre le paradoxe du texte.
