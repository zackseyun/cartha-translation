  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: fr
  text: Et que les trésors des âmes rendent ceux qui y sont enfermés, afin qu’il y ait un rassemblement des êtres humains, comme tu l’as ordonné depuis les temps anciens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre analyse possible : « Que ceux qui y sont enfermés soient rendus aux fils des hommes, comme tu l’as ordonné depuis les temps anciens, et qu’ils soient réunis dans l’assemblée. »'
    reason: Cette autre construction, attestée dans une traduction antérieure, rattache autrement les groupes syntaxiques ; elle est moins probable au regard de la syntaxe syriaque.
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: les trésors des âmes
  rationale: L’expression apocalyptique désigne les lieux où les âmes sont gardées; « trésors » conserve l’image concrète du terme syriaque sans l’aplatir en « demeures ».
- source_word: ܐܝܠܝܢ ܕܚܒܝܫܢ ܒܗܘܢ
  choice: ceux qui y sont enfermés
  rationale: Rend directement le participe passif et son complément, les personnes retenues dans ces trésors.
- source_word: ܟܢܘܫܝܐ
  choice: soient rassemblés
  rationale: Le substantif exprime un rassemblement; la tournure verbale française restitue naturellement la proposition de but.
- source_word: ܒܢܝܢܫܐ
  choice: les êtres humains
  rationale: Équivalent français courant de l’expression sémitique « fils des hommes », ici collective et inclusive.
- source_word: ܡܢ ܩܕܝܡ
  choice: depuis les temps anciens
  rationale: Restitue la portée temporelle de l’expression sans suggérer un moment ancien précisément daté.
theological_decisions:
- issue: Fonction des trésors des âmes
  choice: Ils rendent les personnes qui y sont enfermées.
  alternative: Les personnes enfermées dans les trésors seraient le sujet de « rendre » et seraient rendues aux fils des hommes.
  rationale: La syntaxe signalée par le texte syriaque fait des « trésors des âmes » le sujet du verbe et des personnes enfermées son objet; cette lecture préserve l’image eschatologique sans préciser davantage la nature du rassemblement.
- issue: Identité des « fils des hommes »
  choice: les êtres humains
  alternative: les fils des hommes
  rationale: L’expression est un sémitisme collectif désignant l’humanité; le français moderne « êtres humains » en communique le sens sans introduire une restriction masculine.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve l’image apocalyptique des « trésors des âmes » et la relation finale entre leur ouverture et le rassemblement de l’humanité.
