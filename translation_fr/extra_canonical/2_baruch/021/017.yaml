  text: Look, for you alone are able to sustain all who are, those who have passed, and those who are to come,
translation:
  language: fr
  text: 'Regarde[a] : toi seul, en effet, tu peux soutenir[c] tous ceux qui sont, ceux qui sont passés et ceux qui sont à venir[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Considère la requête de ceux qui se tiennent devant toi » (la suite de la phrase se rattacherait alors autrement).'
    reason: Le texte syriaque permet une autre segmentation et un autre rattachement de la « requête ».
  - marker: b
    text: 'Ou : « ainsi que de ceux qui sont passés et de ceux qui sont à venir ».'
    reason: Variante de rattachement syntaxique conservant l’ambiguïté du syriaque.
  - marker: c
    text: 'Littéralement : « porter » ou « supporter ».'
    reason: Le verbe syriaque possède un sens concret que « soutenir » rend ici de façon plus naturelle.
lexical_decisions:
- source_word: ܚܘܪ
  choice: Regarde
  rationale: Impératif direct et naturel, qui conserve l’appel solennel adressé à Dieu.
- source_word: ܡܫܟܚ ܐܢܬ
  choice: tu peux
  rationale: Rend simplement l’idée de capacité exprimée par le syriaque.
- source_word: ܕܬܣܒܪ
  choice: soutenir
  rationale: Dans ce contexte, le verbe évoque le fait de porter ou de maintenir l’ensemble des êtres; « soutenir » est idiomatique en français sans effacer le sens concret de « porter ».
- source_word: ܒܠܚܘܕܝܟ
  choice: toi seul
  rationale: Préserve l’insistance exclusive du texte syriaque.
theological_decisions:
- issue: La relation de Dieu avec les êtres de tous les temps
  choice: soutenir tous ceux qui existent, ceux qui sont passés et ceux qui sont encore à venir
  alternative: porter tous ceux qui existent, ceux qui sont passés et ceux qui sont à venir
  rationale: La formulation maintient la portée temporelle universelle et l’affirmation selon laquelle Dieu seul les soutient, sans préciser davantage la nature de cette action.
- issue: Ambiguïté syntaxique autour de la requête et des groupes temporels
  choice: Texte principal conforme à la lecture suivie de la tradition éditoriale, avec variantes en notes
  alternative: « Considère la requête de ceux qui se tiennent devant toi, de ceux qui sont passés et de ceux qui sont à venir »
  rationale: Le syriaque transmis est difficile à segmenter; les notes conservent les autres rattachements possibles au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « ceux qui » maintient le parallélisme temporel; « encore à venir » clarifie le troisième groupe sans ajouter de précision doctrinale.
