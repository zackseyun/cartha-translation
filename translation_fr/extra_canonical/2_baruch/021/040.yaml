  text: And let no one who reigns and has become king boast and grow proud through the pride of man.”
translation:
  language: fr
  text: Et que personne qui règne et est devenu roi ne se glorifie ni ne s’enorgueillisse par l’orgueil de l’homme.[a][b] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Que rien de ce qui règne et est devenu roi ne se glorifie… »'
    reason: Conserve l’alternative impersonnelle signalée dans l’historique anglais, sans la privilégier dans le texte français.
  - marker: b
    text: 'Ou : « Que personne qui règne ne se glorifie, lui qui est devenu roi… »'
    reason: Conserve l’analyse syntaxique qui rattache séparément « est devenu roi » au sujet.
lexical_decisions:
- source_word: ܡܠܟ / ܡܠܟܘ
  choice: règne / est devenu roi
  rationale: La formulation conserve le jeu étymologique royal et la redondance apparente du syriaque, sans la réduire à une seule idée.
- source_word: ܫܘܒܚܐ
  choice: se glorifie
  rationale: « Se glorifier » rend dignement l’idée de tirer gloire de sa position, tout en restant naturel en français biblique moderne.
- source_word: ܪܡܘܬܐ / notion d’orgueil dans le passage
  choice: s’enorgueillisse de l’orgueil humain
  rationale: Cette formulation maintient l’insistance du texte sur l’élévation orgueilleuse propre à l’être humain, sans lui imposer une interprétation confessionnelle.
theological_decisions:
- issue: Identité du sujet qui règne et devient roi
  choice: personne
  alternative: rien
  rationale: Le contexte royal favorise un référent personnel, mais la variante plus littérale et impersonnelle est conservée en note.
- issue: Rapport entre « règne » et « est devenu roi »
  choice: deux qualifications coordonnées du même sujet
  alternative: 'une proposition relative détachée : « que personne qui règne ne se glorifie, lui qui est devenu roi »'
  rationale: La coordination est la lecture française la plus naturelle, tout en gardant les deux éléments distincts du texte.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La redondance « règne et est devenu roi » est volontairement maintenue parce qu’elle appartient à la tension du texte source; les lectures syntaxiques concurrentes sont signalées plutôt que résolues silencieusement.
