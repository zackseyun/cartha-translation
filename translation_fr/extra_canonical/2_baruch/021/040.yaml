revisions:
- from: Et que personne, parce qu’il règne et est devenu roi, ne se glorifie ni ne s’enorgueillisse de l’orgueil humain.[a][b] »
  to: Et que personne qui règne et est devenu roi ne se glorifie ni ne s’enorgueillisse par l’orgueil de l’homme.[a][b] »
  rationale: La révision supprime l’ajout causal, rend l’expression finale de manière plus proche et conserve les deux alternatives de l’audit dans un français grammatical. Le texte principal reste une formulation moderne, naturelle et non interprétative.
