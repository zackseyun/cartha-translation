translation:
  language: fr
  text: Depuis le commencement du monde, tu appelles les choses qui n’existent pas, et elles t’obéissent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: Depuis le commencement du monde
  rationale: Rend directement l’expression temporelle syriaque tout en conservant sa portée cosmique.
- source_word: ܩܪܐ
  choice: tu appelles
  rationale: Le verbe signifie appeler ou convoquer; le présent convient à l’adresse directe à Dieu.
- source_word: ܠܐ … ܘܡܫܬܡܥܝܢ
  choice: les choses qui n’existent pas, et elles t’obéissent
  rationale: Le pluriel français maintient l’accord avec le verbe syriaque au pluriel. «Obéissent» exprime ici le fait de répondre à l’appel avec soumission, mieux que le littéral «écoutent».
theological_decisions:
- issue: L’appel divin de ce qui n’existe pas
  choice: qui n’existent pas
  alternative: qui n’existent pas encore
  rationale: La traduction n’ajoute pas «encore», absent de la formulation reçue, et préserve ainsi l’énoncé abrupt sur l’autorité créatrice de Dieu.
translation_notes:
  register: Français moderne, simple et digne; adresse à Dieu au tutoiement, conformément au discours de la prière. La formulation conserve le présent et le parallélisme de la phrase source.
