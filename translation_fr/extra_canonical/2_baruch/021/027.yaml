lexical_decisions:
- source_word: ܡܬܚܒܠܐ / contexte textuel lacunaire du v. 27
  choice: est préservé
  rationale: Le témoin syriaque transmis dans cette zone est matériellement difficile et partiellement corrompu. « Préservé » restitue le contraste attesté par la tradition du verset sans préciser indûment qui préserve ni de quelle manière.
- source_word: ܡܕܡ ܕܗܘܐ / formulation contextuelle
  choice: demeure pour
  rationale: Cette tournure française conserve l’idée de subsistance en vue d’une réalité ultérieure et reproduit la relation ouverte exprimée par « pour ».
- source_word: racine ܚܕܬ implicite dans la tradition textuelle
  choice: ce qui est renouvelé
  rationale: « Renouvelé » rend l’idée de faire nouveau sans trancher entre création entièrement nouvelle et transformation de ce qui existe déjà.
theological_decisions:
- issue: Nature de la nouveauté eschatologique
  choice: ce qui est renouvelé
  alternative: ce qui est créé de nouveau
  rationale: Le choix retenu préserve la tension entre renouvellement et nouvelle création, sans imposer une lecture doctrinale particulière.
