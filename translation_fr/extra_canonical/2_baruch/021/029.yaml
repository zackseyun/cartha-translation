  text: And because the world was created for a time, and those in it are sustained with much trouble, command concerning evil.
translation:
  language: fr
  text: Et puisque le monde a été créé pour un temps[a], et que ceux qui s’y trouvent vivent au milieu de bien des peines[b], ordonne au sujet du mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le temps ».'
    reason: La formule peut évoquer soit une durée limitée, soit le temps comme cadre assigné à la création.
  - marker: b
    text: 'Ou : « avec beaucoup [de peines] ».'
    reason: La formulation transmise est elliptique; le complément « de peines » explicite naturellement en français l’idée de souffrance ou de difficulté.
  - marker: c
    text: 'Ou : « ordonne au sujet de ce qui est mauvais ». Le sens exact de la formule et son lien avec la suite sont incertains.'
    reason: Le verset s’achève sur une formule abrupte qui peut se poursuivre syntaxiquement dans le verset suivant.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: le monde
  rationale: Le terme syriaque désigne ici le monde créé; « le monde » est naturel et conserve la portée cosmique du passage.
- source_word: ܙܒܢܐ
  choice: un temps
  rationale: Cette traduction exprime une durée limitée sans identifier celle-ci à une époque précise; l’article indéfini convient au français actuel.
- source_word: ܐܝܠܝܢ
  choice: ceux qui s’y trouvent
  rationale: Cette formulation explicite naturellement le référent humain ou animé dans le monde sans ajouter l’idée plus précise d’« habitants ».
- source_word: ܣܘܒܠܐ / racine de l’idée de subsistance
  choice: subsistent
  rationale: Le verbe français rend l’idée d’être maintenu ou de continuer d’exister, tout en laissant ouverte la nuance exacte de la formulation syriaque transmise.
- source_word: ܒܝܫܬܐ
  choice: le mal
  rationale: « Le mal » garde la portée générale et potentiellement morale du terme, sans le réduire à un malheur particulier.
- source_word: ܦܩܕ
  choice: donne des ordres
  rationale: L’impératif adressé à Dieu est rendu directement; le pluriel idiomatique français évite le tour plus raide « ordonne concernant ».
theological_decisions:
- issue: Durée du monde créé
  choice: pour un temps
  alternative: pour le temps
  rationale: Le texte affirme ici le caractère temporel ou limité du monde sans préciser s’il s’agit d’une durée déterminée; la traduction retenue préserve cette indétermination en français naturel.
- issue: Objet du commandement divin
  choice: au sujet du mal
  alternative: contre le mal / au sujet de ce qui est mauvais
  rationale: La préposition et la formulation sont difficiles et le verset paraît abrupt. « Au sujet du mal » conserve la neutralité relationnelle du texte au lieu d’ajouter que l’ordre est nécessairement dirigé contre le mal.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve l’adresse impérative à Dieu et l’abrupt caractère final du verset, tout en évitant un calque difficile à comprendre.
