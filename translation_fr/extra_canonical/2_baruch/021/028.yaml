translation:
  language: fr
  text: Et que ce qui est préservé pour son temps demeure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « subsiste » ou « continue » ; le verbe peut exprimer le maintien dans la durée.'
    reason: Le verbe syriaque peut être rendu par des termes proches qui soulignent la continuité ou la permanence, tandis que le contexte de prière soutient ici la tournure jussive.
lexical_decisions:
- source_word: ܕܢܩܘܐ (forme verbale restituée d’après le contexte et la tradition textuelle)
  choice: demeure
  rationale: Rend la continuité ou le maintien exprimé par le verbe, tout en conservant la valeur de souhait ou de demande du contexte de prière.
- source_word: ܕܢܛܝܪ / idée de ce qui est conservé (lecture reflétée par la tradition de traduction)
  choice: gardé en réserve
  rationale: Expression française naturelle pour quelque chose qui est conservé jusqu’au moment fixé, sans préciser indûment sa nature.
- source_word: ܠܙܒܢܗ
  choice: pour son temps
  rationale: Conserve le singulier et l’idée d’un temps propre ou assigné, sans expliciter davantage qu’il s’agit d’un moment fixé.
theological_decisions:
- issue: Valeur modale du verbe final
  choice: que… demeure
  alternative: … demeure (indicatif)
  rationale: 'Dans cette prière, l’imparfait syriaque a vraisemblablement une force jussive : Baruch formule une demande plutôt qu’un simple constat.'
- issue: Sens du « temps »
  choice: son temps
  alternative: le temps qui lui est fixé
  rationale: La formulation retenue préserve la concision et une légère ambiguïté du syriaque, sans imposer une interprétation eschatologique détaillée.
translation_notes:
  register: Français moderne, sobre et digne. « Gardé en réserve » est plus idiomatique que « préservé pour son temps » et convient au contexte d’une réalité conservée jusqu’au moment qui lui appartient.
