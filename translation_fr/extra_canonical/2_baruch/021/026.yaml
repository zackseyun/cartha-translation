  text: But because he was created from the earth and from dust, whatever passes away departs from it to its own place.
translation:
  language: fr
  text: Mais, puisqu’il a été créé de la terre et de la poussière, tout ce qui passe s’en va de là vers son propre lieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui disparaît » ; littéralement, « tout ce qui passe ».'
    reason: Le terme peut évoquer ce qui passe, s’en va ou disparaît. La note préserve cette amplitude sans imposer « disparaît » dans le texte principal.
lexical_decisions:
- source_word: ܐܪܥܐ / ܥܦܪܐ (lecture sous-jacente attestée par le contexte textuel)
  choice: la terre et la poussière
  rationale: Conserve les deux termes matériels distincts et l’écho au récit de la création, sans les fondre en une seule expression.
- source_word: ܐܬܒܪܝ
  choice: il a été créé
  rationale: Le verbe masculin renvoie à l’être humain évoqué dans le contexte, et non à « la terre », nom féminin en syriaque.
- source_word: expression rendue par « whatever passes away » dans la couche de consultation
  choice: tout ce qui passe disparaît
  rationale: Exprime la disparition ou la mortalité plutôt qu’un simple déplacement, tout en gardant l’image du passage.
- source_word: expression rendue par « to its own place »
  choice: pour rejoindre son propre lieu
  rationale: Préserve l’idée d’une destination propre sans préciser davantage la nature de ce lieu.
theological_decisions:
- issue: Référent du sujet créé
  choice: Le pronom masculin « il » désigne l’être humain.
  alternative: « La terre a été créée de la poussière. »
  rationale: L’accord masculin du verbe syriaque exclut que le nom féminin « terre » soit son sujet; cette lecture maintient aussi le mouvement contextuel de l’humain issu de la terre.
- issue: Sens de la disparition et du retour au lieu propre
  choice: Conserver une formulation générale et imagée.
  alternative: Interpréter explicitement le passage comme la mort et le lieu propre comme la tombe ou la poussière.
  rationale: Le texte évoque la condition mortelle, mais ne nomme pas ici explicitement la mort, la tombe ou une doctrine précise de l’au-delà.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe garde le raisonnement causal et l’image du retour, tout en évitant une lecture confessionnelle ajoutée.
