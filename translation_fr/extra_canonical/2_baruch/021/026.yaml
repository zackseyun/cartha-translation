  naturalness: La phrase est globalement fluide, mais « tout ce qui passe disparaît de celle-ci » est peu naturel et sémantiquement opaque en français moderne. « s’en va de là vers son propre lieu » est plus idiomatique et conserve le mouvement sans explicitation doctrinale.
  terminology: « Terre », « poussière », « créé » et « son propre lieu » sont appropriés. La révision évite de faire de « disparaître » une interprétation principale, tout en la conservant comme possibilité en note.
