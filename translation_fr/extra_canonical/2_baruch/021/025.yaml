  text: If what is reserved for the world were not in them, they would be comforted by their hope.
translation:
  language: fr
  text: Si ce qui est réservé[a] au monde n’était pas en eux[b], ils seraient réconfortés par leur espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui a été mis en réserve ».
    reason: Cette variante rend plus littéralement l’idée de quelque chose déposé ou gardé en vue d’un usage futur.
  - marker: b
    text: Ou « S’il n’y avait pas en eux ce qui est réservé au monde ».
    reason: Cette autre construction française reflète l’ordre existentiel possible de la proposition sans en modifier le sens essentiel.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: monde
  rationale: Le nom syriaque désigne ici le monde; ce choix conserve la portée cosmique de l’expression sans l’interpréter comme une simple époque.
- source_word: ܡܒܣܡܐ
  choice: réconfortés
  rationale: Le terme exprime le soulagement ou la consolation. « Réconfortés » est naturel en français moderne et convient à la construction passive de la proposition.
theological_decisions:
- issue: Nature de « ce qui est réservé au monde »
  choice: Maintenir la formulation indéterminée « ce qui est réservé »
  alternative: Préciser qu’il s’agit d’un bien futur, d’une récompense ou du monde à venir
  rationale: Le texte ne nomme pas explicitement la réalité réservée; la préciser introduirait une interprétation théologique absente de la formulation.
- issue: Référent de « en eux »
  choice: Conserver le pronom sans expliciter son antécédent
  alternative: Remplacer le pronom par un groupe nominal déterminé d’après le contexte
  rationale: L’extrait transmis laisse subsister une ambiguïté référentielle qu’il ne convient pas de résoudre silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase hypothétique et ses pronoms sont maintenus afin de préserver l’ambiguïté du texte; « réconfortés par leur espérance » reste clair pour un lectorat général.
