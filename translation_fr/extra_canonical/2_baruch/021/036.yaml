  text: Let Sheol be sealed, so that from now on it may not receive the dead.
translation:
  language: fr
  text: Que le séjour des morts soit scellé, afin que désormais il ne reçoive plus les morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܝܘܠ (implicite dans le verset reconstitué)
  choice: le séjour des morts
  rationale: Expression française claire et digne pour le shéol, sans l’assimiler automatiquement à l’enfer ni en faire un nom propre opaque.
- source_word: ܬܬܚܬܡ
  choice: soit scellé
  rationale: Le verbe signifie « être scellé »; cette traduction corrige l’ancienne lecture « être mis en mouvement ».
- source_word: ܬܩܒܠ
  choice: reçoive
  rationale: Le verbe signifie ici « recevoir, accueillir », plutôt que « retenir ».
- source_word: ܡܢ ܗܫܐ
  choice: désormais
  rationale: Rend naturellement en français l’idée temporelle « à partir de maintenant ».
theological_decisions:
- issue: Désignation du shéol
  choice: le séjour des morts
  alternative: le Shéol
  rationale: « Le séjour des morts » conserve la notion générale du domaine des défunts sans importer la conception confessionnelle de l’enfer.
translation_notes:
  register: Formulation brève, solennelle et actuelle. Le parallélisme verbal est conservé, et aucune note n’est ajoutée pour l’ancienne traduction, puisque les verbes syriaques appuient nettement « scellé » et « reçoive ».
