translation:
  language: fr
  text: Et les armées du ciel connaissent par l’esprit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: les armées du ciel
  rationale: Rend l’expression désignant les multitudes ou puissances célestes sans l’aplatir en une simple référence aux astres.
- source_word: ܒܪܘܚܐ
  choice: par l’esprit
  rationale: La préposition est rendue instrumentalement par « par ». La minuscule préserve l’ambiguïté du syriaque, qui ne précise pas ici s’il s’agit de l’esprit au sens général ou de l’Esprit divin.
theological_decisions:
- issue: Identification de « l’esprit »
  choice: l’esprit
  alternative: l’Esprit
  rationale: La source ne comporte aucun marquage permettant d’imposer une identification personnelle ou trinitaire; la traduction conserve donc la tension interprétative.
