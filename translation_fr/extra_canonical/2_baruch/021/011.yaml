  naturalness: « Lors du grand décompte » est idiomatique, mais « restent présentes à tes yeux » affaiblit indûment le verbe actif source. Une phrase avec « tu te souviens » est à la fois naturelle, solennelle et exacte.
  terminology: « Fautes » convient à ܚܝ̈ܒܘܬܐ dans ce contexte. « Grand décompte » préserve l’imagerie de ܚܘܫܒܐ ܪܒܐ sans imposer « jugement ».
