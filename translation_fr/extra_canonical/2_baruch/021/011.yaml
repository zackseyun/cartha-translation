translation:
  language: fr
  text: Dans le grand décompte, tu te souviens devant toi des fautes de ceux qui t’ont précédé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܒܘܬܐ
  choice: les fautes
  rationale: Le terme désigne ici des culpabilités ou transgressions; « fautes » est naturel et conserve la portée morale sans la préciser excessivement.
- source_word: ܒܚܘܫܒܐ ܪܒܐ
  choice: lors du grand décompte
  rationale: Rend l'idée de compte ou de calcul solennel sans expliciter prématurément « jugement », qui serait une interprétation théologique.
- source_word: ܩܕܡ̈ܝܟ … ܩܕܡܝܟ
  choice: ceux qui sont devant toi … présentes à tes yeux
  rationale: Préserve la répétition sémantique de « devant toi » tout en évitant en français une tournure lourde et équivoque.
- source_word: ܡܕܟܪܐ
  choice: restent présentes
  rationale: La graphie consonantique peut correspondre à un participe actif (« tu te rappelles ») ou passif (« sont rappelées/gardées en mémoire »). Cette formulation française maintient l'idée de mémoire présente sans trancher silencieusement la voix.
theological_decisions:
- issue: Le « grand décompte » comme jugement divin
  choice: Conserver l'image comptable du syriaque
  alternative: « lors du grand jugement »
  rationale: Le contexte peut évoquer le jugement, mais le lexème signifie d'abord compte, calcul ou décompte; traduire directement par « jugement » résoudrait une implication au lieu de la laisser au lecteur.
- issue: Voix du participe ܡܕܟܪܐ
  choice: 'Employer une tournure neutre: « restent présentes à tes yeux »'
  alternative: « tu te rappelles » ou « sont gardées en mémoire devant toi »
  rationale: Sans vocalisation, les formes active et passive du participe peuvent être graphiquement identiques; la traduction principale préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Grand décompte » conserve l'image source; « restent présentes à tes yeux » rend naturellement la double expression « devant toi » et maintient l'ambiguïté grammaticale.
