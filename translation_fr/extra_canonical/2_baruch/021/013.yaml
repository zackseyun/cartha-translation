  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: fr
  text: Car si les choses passées ne sont pas gardées en mémoire, celles qui se tiennent devant toi t’appartiennent, et celles qui sont à venir sont gardées en mémoire en leur temps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou, selon un autre rattachement syntaxique : « celles qui se tiennent devant toi t’appartiennent, gardées en mémoire en leur temps ».'
    reason: Le rattachement de l’expression finale « en leur temps » et de l’idée de mémoire aux réalités présentes ou à celles qui sont à venir demeure syntaxiquement discutable dans le texte transmis.
lexical_decisions:
- source_word: ܕܘܟܪܢܐ / ܡܕܟ̣ܪܐ
  choice: se souvient / sont rappelées
  rationale: Rend le champ lexical du souvenir et de la mémoire en français naturel, tout en conservant le contraste entre les réalités passées et futures.
- source_word: ܗܠܝܢ ܕܩ̈ܡܝ … ܕܝܠܟ
  choice: celles qui se tiennent devant toi sont à toi
  rationale: Conserve la deuxième personne du singulier indiquée par le suffixe syriaque et le sens spatial ou relationnel de ce qui se tient en présence de Dieu.
- source_word: ܒܙܒܢܘܬܐ
  choice: en leur temps
  rationale: Expression idiomatique qui maintient la référence aux temps assignés sans préciser indûment s’il s’agit d’époques ou de moments déterminés.
theological_decisions:
- issue: Rapport de Dieu au passé, au présent et à l’avenir
  choice: Maintenir trois propositions distinctes portant respectivement sur les choses passées, présentes devant Dieu et futures
  alternative: Rattacher « en leur temps » aux choses qui se tiennent devant Dieu et fondre les deux dernières propositions
  rationale: La structure transmise et le contexte soutiennent le contraste en trois temps; la traduction évite d’expliquer théologiquement comment Dieu se « souvient » et conserve ainsi la tension du texte.
translation_notes:
  register: Français international actuel, sobre et digne. La tournure impersonnelle « si l’on ne se souvient pas » évite une construction passive lourde, tandis que le tutoiement conserve l’adresse directe à Dieu.
