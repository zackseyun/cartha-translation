    rationale: Le dossier d’audit établit que le groupe pertinent porte un suffixe de deuxième personne singulier (« devant toi / près de toi »), et non « les unes près des autres ». Une note qui présente cette dernière comme possibilité induit le lecteur en erreur.
  - severity: low
    issue: « Sont rappelées » est légèrement moins précis et moins naturel que « sont gardées en mémoire ».
    rationale: Le texte emploie le champ de la mémoire; en français, « gardées en mémoire » conserve cette valeur sans l’ambiguïté de « rappeler ».
  revised_text: Car si les choses passées ne sont pas gardées en mémoire, celles qui se tiennent devant toi t’appartiennent, et celles qui sont à venir sont gardées en mémoire en leur temps[b].
