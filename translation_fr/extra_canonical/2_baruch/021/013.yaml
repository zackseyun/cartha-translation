revisions:
- from: Car si l’on ne se souvient pas des choses passées, celles qui se tiennent devant toi sont à toi[a], et celles qui sont à venir sont rappelées en leur temps[b].
  to: Car si les choses passées ne sont pas gardées en mémoire, celles qui se tiennent devant toi t’appartiennent, et celles qui sont à venir sont gardées en mémoire en leur temps[b].
  rationale: La révision supprime la note a, qui perpétue une variante incompatible avec le suffixe de deuxième personne relevé dans le syriaque et dans l’audit anglais. Elle remplace aussi « sont rappelées » par « sont gardées en mémoire » pour un rendu français plus exact du champ lexical de la mémoire. La note b est conservée sous une forme française plus fluide afin de signaler, sans trancher, l’ambiguïté de rattachement de la finale.
