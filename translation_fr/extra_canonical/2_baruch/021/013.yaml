  source_fidelity: 'La traduction conserve correctement les trois propositions contrastant le passé, ce qui est devant Dieu et l’avenir, ainsi que la deuxième personne du singulier. Toutefois, la note a propose une lecture (« les unes près des autres ») que la révision source-critique du dossier a explicitement écartée : le suffixe syriaque vise « toi », non une relation réciproque entre les réalités mentionnées.'
  naturalness: « Sont rappelées » est possible, mais « sont gardées en mémoire » rend plus directement et plus naturellement en français le lexique du souvenir sans suggérer l’idée d’un rappel adressé à quelqu’un. « T’appartiennent » est plus idiomatique que « sont à toi » dans ce contexte.
  terminology: Le champ lexical de la mémoire est maintenu de manière cohérente par « gardées en mémoire ». L’adresse directe à Dieu et l’ambiguïté non doctrinale de l’énoncé sont préservées.
