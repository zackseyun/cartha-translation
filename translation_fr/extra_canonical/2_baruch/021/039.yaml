  text: Bring near those who are sought, and let what began in toil rejoice at the arrival of your glory.
translation:
  language: fr
  text: Fais approcher ceux que l’on recherche, et que ce qui a commencé dans la peine se réjouisse à la venue de ta gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒ / notion d’approche (texte du verset reconstitué dans la tradition éditoriale)
  choice: Fais approcher
  rationale: Rend l’impératif causatif exprimant le rapprochement, sans préciser de manière non attestée s’il est spatial, relationnel ou eschatologique.
- source_word: notion de recherche / personnes recherchées
  choice: ceux que l’on recherche
  rationale: Conserve la valeur passive et l’indétermination de l’agent plutôt que de transformer les personnes recherchées en personnes qui cherchent.
- source_word: notion de commencement dans la peine
  choice: ce qui a commencé dans la peine
  rationale: Préserve le sujet neutre et la tension de la formulation, sans l’identifier arbitrairement à une personne, à une œuvre ou à une époque.
- source_word: notion de venue de la gloire
  choice: à la venue de ta gloire
  rationale: Formulation française naturelle qui présente la venue de la gloire comme l’occasion de la joie, sans imposer une nuance locale.
theological_decisions:
- issue: Identité de « ceux que l’on recherche »
  choice: Maintenir une désignation indéfinie
  alternative: Les identifier aux élus, aux exilés ou à ceux qui cherchent Dieu
  rationale: Le libellé disponible ne justifie aucune identification confessionnelle ou eschatologique plus précise.
- issue: Référent de « ce qui a commencé dans la peine »
  choice: Conserver le neutre singulier
  alternative: Employer « ceux qui ont commencé » ou nommer explicitement une œuvre salvifique
  rationale: Cette formulation respecte l’ambiguïté grammaticale et théologique transmise par le texte.
- issue: Rapport entre la joie et la venue de la gloire
  choice: « se réjouisse à la venue »
  alternative: « se réjouisse dans la venue »
  rationale: Le français choisi exprime naturellement la joie suscitée par cette venue, sans transformer la venue elle-même en sphère mystique.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif « Fais approcher » et le subjonctif exhortatif « que… se réjouisse » conservent la structure de prière. Aucun marqueur de note n’est nécessaire.
