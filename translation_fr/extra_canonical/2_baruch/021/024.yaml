translation:
  language: fr
  text: Et comment cela a-t-il été révélé si, par la suite, ils ne comprennent pas ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܓܠܝ / notion de révélation sous-jacente
  choice: a-t-il été révélé
  rationale: Le passif conserve l’idée d’une révélation sans préciser qui la donne ni ce qui est révélé.
- source_word: ܡܢ ܒܬܪ
  choice: par la suite
  rationale: Expression française naturelle qui rend la postériorité temporelle.
- source_word: notion de connaissance ou de compréhension
  choice: comprennent
  rationale: Dans cette question, « comprendre » exprime naturellement l’absence de saisie ultérieure, sans ajouter d’objet explicite.
theological_decisions:
- issue: Objet et auteur de la révélation non exprimés
  choice: Conserver la tournure impersonnelle « cela a-t-il été révélé »
  alternative: « comment Dieu le leur a-t-il révélé »
  rationale: Le texte ne justifie pas l’ajout explicite de Dieu comme agent ni d’un destinataire à la révélation.
- issue: Lien logique introduit par la condition
  choice: « si »
  alternative: « puisque » ou « alors que »
  rationale: « Si » maintient la tension conditionnelle de la question sans en imposer une interprétation causale.
translation_notes:
  register: Français moderne, clair et digne. La formulation interrogative reste concise et préserve l’indétermination du contenu révélé.
