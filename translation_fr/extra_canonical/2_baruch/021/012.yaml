revisions:
- from: Car même les choses d’autrefois qui ont disparu ne sont pas loin de toi, avec tous ceux à qui elles appartenaient[a] et leur souvenir.
  to: Car même les fautes anciennes qui ont disparu ne sont pas loin de toi, avec tous ceux qui les ont commises[a] et leur souvenir.
  rationale: La révision rétablit le nom syriaque explicite « fautes/offenses », que le brouillon avait omis sous l’influence de la piste d’audit anglaise. Elle rend ensuite de manière idiomatique la relation entre ces fautes et les personnes concernées, sans transformer le terme en accusation doctrinalement chargée ni supprimer la nuance littérale, conservée en note.
