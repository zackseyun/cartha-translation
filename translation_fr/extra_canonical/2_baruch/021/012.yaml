review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le syriaque transmis contient explicitement ܚܝ̈ܒܬܐ (« fautes », « offenses », éventuellement « dettes » au sens moral) : ܩܕ̈ܡܝܬܐ qualifie ce nom et ne doit pas être substantivé en « les choses d’autrefois ». Le sens de cessation ou de réalités révolues de ܕܫܠܝܢ est bien rendu par « ont disparu ». Dans ce contexte, le rapport des personnes aux fautes s’exprime naturellement par « ceux qui les ont commises » / « leurs auteurs », plutôt que par une possession matérielle.'
  naturalness: La phrase est fluide dans l’ensemble, mais « les choses d’autrefois » et « ceux à qui elles appartenaient » créent une relation sémantiquement étrange en français et effacent le sens moral explicite du texte source. La révision conserve un français moderne, sobre et direct.
  terminology: « Fautes anciennes » restitue le nom syriaque sans imposer une catégorie doctrinale plus précise. « Ceux qui les ont commises » rend idiomatiquement le lien que l’expression littérale de possession ou de maîtrise peut indiquer dans ce contexte. « Souvenir » convient pour ܕܘܟܪܢܐ.
  issues:
  - severity: high
    issue: « les choses d’autrefois » omet le nom « fautes/offenses ».
    rationale: Le texte source porte ܚܝ̈ܒܬܐ, « fautes, offenses, dettes », suivi de l’adjectif « anciennes ». Traduire seulement l’adjectif substantivé supprime un élément lexical explicite et modifie le référent.
  - severity: medium
    issue: « ceux à qui elles appartenaient » est insuffisamment contextualisé.
    rationale: Appliquée à des fautes, la tournure de possession ou de maîtrise vise naturellement les personnes qui en sont les auteurs. La formulation actuelle paraît désigner une possession neutre et dépend de l’erreur précédente sur « choses ».
  - severity: low
    issue: La note actuelle présente « possesseurs » comme lecture principale possible sans signaler que le contexte porte sur des fautes.
    rationale: Une note doit préserver l’ambiguïté lexicale, mais le lecteur doit savoir pourquoi la traduction idiomatique parle de personnes ayant commis les fautes.
  revised_text: Car même les fautes anciennes qui ont disparu ne sont pas loin de toi, avec tous ceux qui les ont commises[a] et leur souvenir.
  revised_footnotes:
  - marker: a
    text: Littéralement, l’expression peut évoquer « leurs maîtres » ou « leurs possesseurs ». Dans le contexte de fautes, elle désigne naturellement ceux qui en sont les auteurs.
    reason: La note conserve la nuance de l’expression syriaque tout en expliquant la traduction contextuelle non ambiguë en français.
  revision_rationale: La révision rétablit le nom syriaque explicite « fautes/offenses », que le brouillon avait omis sous l’influence de la piste d’audit anglaise. Elle rend ensuite de manière idiomatique la relation entre ces fautes et les personnes concernées, sans transformer le terme en accusation doctrinalement chargée ni supprimer la nuance littérale, conservée en note.
