translation:
  language: fr
  text: Car même les fautes anciennes qui ont disparu ne sont pas loin de toi, avec tous ceux qui les ont commises[a] et leur souvenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression peut évoquer « leurs maîtres » ou « leurs possesseurs ». Dans le contexte de fautes, elle désigne naturellement ceux qui en sont les auteurs.
    reason: La note conserve la nuance de l’expression syriaque tout en expliquant la traduction contextuelle non ambiguë en français.
lexical_decisions:
- source_word: ܩܕ̈ܡܝܬܐ
  choice: les choses d’autrefois
  rationale: Le terme signifie « les premières » ou « les anciennes » au sens substantivé. Le contexte n’autorise pas à préciser « fautes ».
- source_word: ܕܫܠܝܢ
  choice: qui ont disparu
  rationale: Dans cette phrase, le participe évoque des réalités révolues ou qui ne sont plus présentes; « ont disparu » restitue ce sens naturellement sans les identifier aux morts.
- source_word: ܕܒ̣ܥܝܕܐ
  choice: ne sont pas loin de toi
  rationale: Rend l’idée d’éloignement tout en conservant l’adresse directe à Dieu.
- source_word: ܕܝܠܗܘܢ
  choice: ceux à qui elles appartenaient
  rationale: Formulation française naturelle pour l’expression de possession ou d’appartenance, sans la connotation criminelle indue de « responsables » ou « auteurs ».
- source_word: ܕܘܟܪܢܐ
  choice: leur souvenir
  rationale: Équivalent direct et idiomatique du nom syriaque désignant le souvenir ou la mémoire.
theological_decisions:
- issue: Nature des réalités anciennes mentionnées
  choice: les choses d’autrefois
  alternative: les fautes d’autrefois
  rationale: Le texte lu porte un adjectif substantivé signifiant « anciennes/premières »; traduire par « fautes » introduirait une interprétation morale non exigée ici.
- issue: Rapport entre les choses révolues et les personnes associées
  choice: ceux à qui elles appartenaient
  alternative: leurs auteurs
  rationale: Le rapport peut relever de la possession, de l’association ou de l’origine. La traduction principale préserve cette latitude sans faire de ces personnes des coupables.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le mouvement explicatif introduit par « Car » et évite de transformer les « choses d’autrefois » en fautes ou leurs possesseurs en criminels.
