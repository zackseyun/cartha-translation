translation:
  language: fr
  text: Et c’est à toi seul[a] qu’il appartient de rechercher l’origine de tout l’ordre établi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et à toi seul il appartient de rechercher l’origine de tout l’ordre établi. »'
    reason: La construction syriaque place « à toi seul » au premier plan; cette autre formulation reproduit plus directement cette emphase.
lexical_decisions:
- source_word: ܙܕܩܐ
  choice: il appartient
  rationale: Le terme exprime ici ce qui convient ou revient en propre à quelqu’un; « il appartient » rend naturellement cette idée dans le contexte de la prérogative divine.
- source_word: ܕܬܒܥܝܟ
  choice: de rechercher
  rationale: Le verbe désigne une recherche ou un examen approfondi, plutôt qu’une simple demande.
- source_word: ܒܪܝܫܘܬܗ
  choice: l’origine
  rationale: Le substantif renvoie au commencement ou au principe premier; « origine » convient au contexte cosmologique.
- source_word: ܟܘܠܐ ܕܒܝܬ
  choice: de tout l’ordre établi
  rationale: Cette expression difficile est comprise, conformément au contexte et à la couche de consultation auditée, comme désignant l’ensemble de l’ordre existant, sans préciser davantage sa nature.
theological_decisions:
- issue: Prérogative divine exclusive
  choice: il n’appartient qu’à toi seul
  alternative: à toi seul il convient
  rationale: La formulation conserve l’exclusivité fortement marquée par ܒܠܚܘܕܝܟ, sans introduire une doctrine supplémentaire sur l’omniscience ou la création.
- issue: Nature de l’« ordre »
  choice: tout l’ordre établi
  alternative: tout ce qui existe
  rationale: « Ordre établi » maintient la portée structurée du texte de consultation tout en évitant de réduire l’expression à la seule totalité des êtres.
translation_notes:
  register: Français moderne, digne et fluide. La conjonction initiale « Et » est conservée afin de maintenir le lien avec la prière qui précède; l’exclusivité est rendue sans lourdeur par « il n’appartient qu’à toi seul ».
