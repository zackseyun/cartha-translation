  text: And I saw that, because of one man, those who live came to be, and also the dwelling place of those who are to come.
translation:
  language: fr
  text: Et j’ai vu que, par un seul homme, ceux qui vivent sont venus à l’existence, ainsi que la demeure de ceux qui sont à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: j’ai vu
  rationale: Rend directement le verbe syriaque de perception à la première personne, dans le registre visionnaire du passage.
- source_word: ܒܪ ܢܫܐ ܚܕ / expression correspondant à « un seul homme »
  choice: par un seul homme
  rationale: « Par » conserve une certaine ouverture entre cause et moyen, sans donner à la proposition une nuance nécessairement négative que pourrait suggérer « à cause de ».
- source_word: expression correspondant à « ceux qui vivent »
  choice: ceux qui vivent
  rationale: Formulation sobre qui préserve la portée collective et évite de préciser indûment s’il s’agit de tous les vivants ou d’un groupe déterminé.
- source_word: expression correspondant à « sont venus à l’existence »
  choice: sont venus à l’existence
  rationale: Exprime l’accès à l’existence sans importer un vocabulaire doctrinal plus technique comme « ont été créés ».
- source_word: expression correspondant à « la demeure »
  choice: la demeure
  rationale: Terme français naturel et digne qui conserve l’idée d’un lieu où habiter sans développer ce que le texte ne précise pas.
- source_word: expression correspondant à « ceux qui sont à venir »
  choice: ceux qui sont à venir
  rationale: Préserve l’orientation future et l’ambiguïté sur l’identité exacte des personnes attendues.
theological_decisions:
- issue: Rôle de l’« un seul homme » dans l’existence des vivants
  choice: par un seul homme
  alternative: à cause d’un seul homme
  rationale: La traduction retenue ne tranche pas entre causalité et médiation et n’identifie pas explicitement cet homme à une figure théologique particulière.
- issue: Nature de la demeure future
  choice: la demeure de ceux qui sont à venir
  alternative: le lieu de séjour de ceux qui viendront
  rationale: La formulation nominale suit de près le contenu transmis et ne précise ni le ciel, ni la terre, ni un monde futur.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le parallélisme de l’énoncé et ses référents généraux, sans ajouter d’identification doctrinale. Le découpage exact du verset n’étant pas nettement isolé dans le vaste extrait syriaque fourni, l’anglais POB a servi de couche de contrôle auditée, tandis que les choix ont été maintenus compatibles avec le registre et les formulations syriaques du passage.
