  text: You alone know the arrangement of the times, without being shaken.
translation:
  language: fr
  text: Tu es le seul à connaître l’ordre des temps[a], sans être ébranlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « l’enseignement des temps » ; le terme syriaque peut désigner un enseignement ou une instruction.'
    reason: Préserve le sens lexical premier de ܝܘܠܦܢܐ tout en signalant que « ordre » est un rendu contextuel.
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ (yulpānōh(y) d-zabnē)
  choice: l’ordonnance des temps
  rationale: ܝܘܠܦܢܐ désigne normalement un enseignement ou une instruction, mais, appliqué ici aux temps dans un contexte apocalyptique, il évoque leur ordre ou leur disposition. « Ordonnance » rend ce sens contextuel tout en conservant la nuance d’un ordre établi; l’autre lecture est signalée en note.
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ (kad lā nettazziʿ)
  choice: sans être ébranlé
  rationale: La tournure exprime l’absence d’ébranlement ou de perturbation; elle est conservée sans préciser davantage si l’accent porte sur l’immutabilité divine ou sur l’absence de trouble dans la connaissance.
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝܕܥܬ (ant ba-lḥudayk ydaʿt)
  choice: Toi seul connais
  rationale: Rend directement l’insistance du pronom et de « seul », dans un ordre naturel en français.
theological_decisions:
- issue: Rapport entre Dieu et l’ébranlement
  choice: sans être ébranlé
  alternative: tandis que l’ordre des temps demeure inébranlable
  rationale: La syntaxe permet une certaine hésitation sur le rattachement exact. La formulation retenue suit la lecture où Dieu connaît sans être ébranlé, sans développer doctrinalement l’idée.
translation_notes:
  register: Français moderne, sobre et solennel. « Ordonnance » est employé au sens de disposition ou d’ordre établi, non au sens médical.
