- source_word: valeur présente et future reflétée par « what is … what is to be »
  choice: est … sera
  rationale: L’opposition entre le présent et l’avenir est exprimée clairement et sobrement en français moderne. « Sera » évite la nuance d’obligation que pourrait introduire « doit être ».
