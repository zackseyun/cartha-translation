  text: You command the lightning at your signal, and you have seen the things that are to come, as the things that have passed.
translation:
  language: fr
  text: Tu commandes à l’éclair par ton signal, et tu as vu les choses à venir comme celles qui sont passées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « comme celles que tu accomplis » ou « comme les choses que tu fais ».'
    reason: La forme transmise peut être lue comme provenant de ܥܒܕ, « faire », plutôt que de ܥܒܪ, « passer »; les lettres syriaques correspondantes sont graphiquement proches.
lexical_decisions:
- source_word: ܠܐܙܐ
  choice: à l’éclair
  rationale: Le nom désigne ici l’éclair; la construction avec ܦܩܝܕܐ exprime l’autorité exercée sur lui.
- source_word: ܒܪܘܙܝܟ
  choice: par ton signal
  rationale: ܪܘܙܐ peut désigner un signe ou un signal. « Par ton signal » rend naturellement l’idée que l’éclair obéit au signe donné par Dieu.
- source_word: ܕܥܬܝ̈ܕܢ
  choice: les choses à venir
  rationale: Le participe exprime ce qui est futur ou destiné à arriver.
- source_word: ܕܥܒܪ̈ܝ
  choice: celles qui sont passées
  rationale: Cette lecture, appuyée par la révision du texte source, vient de la racine ܥܒܪ, « passer », et forme un contraste temporel avec « les choses à venir ».
theological_decisions:
- issue: Connaissance divine de l’avenir et du passé
  choice: « tu as vu les choses à venir comme celles qui sont passées »
  alternative: « tu as vu les choses à venir comme celles que tu accomplis »
  rationale: La traduction principale conserve le parallélisme temporel fondé sur la lecture ܥܒܪ, sans développer une formulation doctrinale au-delà du texte. La variante est signalée en note en raison de l’ambiguïté graphique de la transmission.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement convient à la prière adressée directement à Dieu. La phrase reste concise et conserve le contraste entre avenir et passé ainsi que la variante textuelle.
