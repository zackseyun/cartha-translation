review_pass:
  verdict: revise
  source_fidelity: Le syriaque imprimé de Ceriani porte ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ, littéralement « comme celles que tu fais ». La traduction principale actuelle (« celles qui sont passées ») suit l’audit anglais récent, mais ne correspond pas à la leçon fournie et omet l’explicite ܐܢܬ (« tu »). L’alternative temporelle peut être conservée en note comme variante de lecture signalée par l’audit.
  naturalness: « Tu commandes à l’éclair par ton signal » est compréhensible, mais « sur un signe de toi » est plus idiomatique en français moderne tout en gardant l’idée d’un signal. « Les choses à venir » convient au registre de la prière.
  terminology: « Éclair » rend correctement ܠܐܙܐ. La formulation conserve le tutoiement priant et ne surcharge pas le texte d’une interprétation doctrinale.
  issues:
  - severity: high
    issue: La leçon principale inverse la priorité entre le texte syriaque fourni et l’audit anglais.
    rationale: Le texte source visible lit ܕܥܒܕ ܐܢܬ (« que tu fais »), alors que le projet traduit « qui sont passées ». La note actuelle décrit en outre l’ambiguïté dans le sens inverse de la leçon effectivement imprimée.
  - severity: medium
    issue: L’explicite « tu » de la proposition finale est absent de la traduction principale.
    rationale: ܐܢܬ conclut la proposition et doit être rendu, naturellement, par « que tu fais ».
  - severity: low
    issue: La construction « commander à l’éclair par ton signal » est peu naturelle.
    rationale: « Commander à l’éclair sur un signe de toi » garde le sens et améliore la fluidité.
  revised_text: Tu commandes à l’éclair sur un signe de toi, et tu as vu les choses à venir comme celles que tu fais.[a]
  revised_footnotes:
  - marker: a
    text: 'Autre lecture possible : « comme celles qui sont passées ».'
    reason: Le texte syriaque imprimé porte « comme celles que tu fais » (ܕܥܒܕ ܐܢܬ). L’audit anglais signale toutefois une lecture ܥܒܪ, « passer », qui produit le contraste temporel avec « les choses à venir ».
  revision_rationale: 'La révision suit d’abord la leçon du texte syriaque fourni : ܕܥܒܕ ܐܢܬ se rend par « que tu fais ». La lecture concurrente « qui sont passées », présente dans la piste d’audit anglaise, est préservée en note sans être imposée comme texte principal. La première proposition est légèrement reformulée pour un français naturel et digne.'
