  text: For the spirit of man is the ruler of the world, yet they do not know what belongs to it.
translation:
  language: fr
  text: Car l’esprit humain gouverne le monde, mais les humains ne savent pas ce qui est à eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « L’esprit humain est l’ensemble du monde. »'
    reason: Cette note conserve l’alternative textuelle ancienne qui comprend le terme difficile dans le sens d’« ensemble » ou de « multitude », plutôt que dans celui du gouvernement.
lexical_decisions:
- source_word: ܪܘܚ
  choice: esprit
  rationale: Le terme syriaque désigne ici l’esprit humain; « esprit » conserve sa portée anthropologique sans la réduire à l’intelligence ou au souffle.
- source_word: ܡܕܒܪܢܘܬܐ / racine ܕܒܪ (lecture contextuelle)
  choice: gouverne
  rationale: La tradition textuelle et le contexte soutiennent l’idée de conduite ou de gouvernement. Le verbe français est plus naturel que « administre » et moins absolu que « règne sur ».
- source_word: ܥܠܡܐ
  choice: le monde
  rationale: Équivalent courant et contextuellement approprié du syriaque pour le monde ou l’ordre présent.
- source_word: ܕܝܠܗ
  choice: ce qui lui appartient
  rationale: Cette formulation garde la référence pronominale ouverte et reproduit l’idée d’appartenance sans préciser indûment s’il s’agit du domaine, du rôle ou du destin de l’esprit.
theological_decisions:
- issue: Portée du gouvernement exercé par l’esprit humain
  choice: « gouverne le monde »
  alternative: « est le maître du monde »
  rationale: « Gouverne » exprime la fonction de conduite attestée par la lecture contextuelle sans attribuer à l’être humain une souveraineté absolue susceptible d’effacer celle de Dieu.
- issue: Référent du sujet ignorant
  choice: « les humains ne savent pas »
  alternative: « ils ne savent pas »
  rationale: Le nom explicite évite en français un pronom sans antécédent clair, tout en maintenant le sens collectif suggéré par le passage.
translation_notes:
  register: Français international moderne, sobre et digne. « L’esprit humain » est plus naturel que « l’esprit de l’homme » et inclut l’humanité en général. La phrase reste concise, tandis que la note signale l’importante incertitude textuelle.
