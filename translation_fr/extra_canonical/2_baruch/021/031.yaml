review_pass:
  verdict: revise
  source_fidelity: 'La proposition principale suit la lecture contextuelle attestée par le syriaque et retenue dans la piste anglaise : l’esprit humain exerce une fonction de gouvernement à l’égard du monde. La forme plurielle « les humains » explicite de façon acceptable le sujet collectif sous-entendu dans l’anglais, mais le pronom final « lui » est alors inutilement ambigu en français. Le texte-source fourni est un large extrait de chapitre dont le repérage précis du verset est incertain; il convient donc de conserver la variante signalée sans la présenter comme certaine.'
  naturalness: « Car l’esprit humain gouverne le monde » est naturel, sobre et de registre approprié. « Ce qui est à eux » rend plus idiomatiquement le dernier membre avec le sujet collectif explicité, sans imposer si cet objet désigne leur part, leur condition ou leur destinée.
  terminology: « Esprit humain », « gouverne » et « monde » sont des équivalents modernes et non confessionnels. La note remplace « multitude » par « ensemble », formulation française plus claire pour l’alternative de lecture, tout en indiquant qu’il s’agit d’une lecture possible et non du sens retenu.
  issues:
  - severity: low
    issue: Référent pronominal discordant dans « les humains ne savent pas ce qui lui appartient »
    rationale: Après l’explicitation collective « les humains », le singulier « lui » renvoie grammaticalement à « l’esprit » plutôt qu’aux humains. Cette tension peut obscurcir le sens collectif du dernier membre. « Ce qui est à eux » résout l’ambiguïté sans préciser le contenu de leur appartenance.
  - severity: low
    issue: Formulation française peu naturelle de la variante en note
    rationale: « La multitude du monde est l’esprit humain » est un calque opaque. « L’esprit humain est l’ensemble du monde » restitue l’alternative de manière lisible, tout en restant explicitement une lecture possible.
  revised_text: Car l’esprit humain gouverne le monde, mais les humains ne savent pas ce qui est à eux.[a]
