translation:
  language: fr
  text: Et tu connais le nombre de ceux qui passent et de ceux qui demeurent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܪܝܢ (ʿābrīn)
  choice: ceux qui passent
  rationale: Rend le sens fondamental de « passer » sans préciser indûment s’il s’agit de disparaître, de mourir ou d’être transitoire.
- source_word: ܡܩܘܝܢ (məqawīn)
  choice: ceux qui demeurent
  rationale: Conserve le contraste avec ceux qui passent et exprime l’idée de rester ou de subsister.
- source_word: ܡܢܝܢܐ (menyānā)
  choice: le nombre
  rationale: Équivalent direct et naturel du substantif syriaque.
theological_decisions:
- issue: Portée du contraste entre ceux qui passent et ceux qui demeurent
  choice: Maintenir une formulation ouverte
  alternative: Interpréter explicitement « ceux qui meurent » et « ceux qui restent en vie »
  rationale: Le syriaque établit le contraste sans en fixer explicitement la portée; la traduction évite donc d’imposer une lecture eschatologique ou anthropologique particulière.
translation_notes:
  register: Français moderne, sobre et digne. La coordination initiale « Et » ainsi que le parallélisme « de ceux qui… et de ceux qui… » suivent étroitement la structure syriaque.
