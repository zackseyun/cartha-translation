  text: For in his kingdom the death of the sons of men is seen. And what truly exists whose end is not known?
translation:
  language: fr
  text: Car, dans son royaume, on voit la mort des êtres humains. Et qu’est-ce qui existe réellement[a] dont la fin ne soit pas connue[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’y a-t-il qui soit réellement ».'
    reason: La tournure existentielle du syriaque peut être formulée de ces deux manières en français.
  - marker: b
    text: 'Ou : « existe, et dont la fin n’est pas connue »; le rattachement exact de la proposition relative demeure légèrement ambigu.'
    reason: La syntaxe transmise permet une ponctuation et une articulation légèrement différentes de la question.
lexical_decisions:
- source_word: ܡܘܬܐ
  choice: la mort
  rationale: Rend directement le nom syriaque désignant la mort, sans atténuer l’affirmation.
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: des êtres humains
  rationale: Équivalent français naturel de l’expression sémitique « fils des hommes », qui désigne ici l’humanité.
- source_word: ܐܝܬ
  choice: existe réellement
  rationale: Conserve la portée existentielle de la question tout en donnant une formulation française courante.
- source_word: ܚܪܬܐ
  choice: la fin
  rationale: Préserve le sens ouvert de terme, d’issue ou de destinée finale.
theological_decisions:
- issue: Portée de l’expression « fils des hommes »
  choice: des êtres humains
  alternative: des fils des hommes
  rationale: Le contexte porte sur la condition mortelle de l’humanité en général; la formulation retenue évite en français une lecture artificiellement technique ou christologique.
- issue: Nature de la dernière proposition
  choice: Maintien d’une question rhétorique ouverte
  alternative: Affirmation explicite selon laquelle toute chose a une fin connue de Dieu
  rationale: Le texte interroge sans expliciter lui-même la conclusion théologique; la traduction ne la résout donc pas à la place du lecteur.
translation_notes:
  register: Français international moderne, digne et lisible. « Êtres humains » traduit naturellement l’idiome sémitique, tandis que la seconde phrase conserve sa densité philosophique et son ambiguïté syntaxique.
