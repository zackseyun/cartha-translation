  text: of those who live and of those who are as nothing. For life that is not gladdened is no life.
translation:
  language: fr
  text: de ceux qui vivent et de ceux qui sont comme s’ils n’existaient pas. Car une vie sans joie n’est pas une vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: ceux qui vivent / une vie
  rationale: Le terme syriaque relève du champ lexical de la vie; la formulation française varie selon sa fonction nominale dans chaque proposition.
- source_word: ܒܠܐ ܐܝܬ
  choice: comme s’ils n’existaient pas
  rationale: Cette tournure rend naturellement en français l’idée d’être tenu pour inexistant ou réduit à rien, sans affirmer une non-existence absolue.
- source_word: ܡܒܣܡܐ
  choice: joie
  rationale: Le mot évoque ici l’agrément, la réjouissance ou le bonheur; «joie» donne une formulation claire et digne dans l’expression «une vie sans joie».
theological_decisions:
- issue: Statut de «ceux qui sont comme s’ils n’existaient pas»
  choice: Conserver la comparaison «comme si»
  alternative: «ceux qui ne sont rien»
  rationale: La comparaison préserve l’ambiguïté du passage et évite de transformer une description existentielle ou rhétorique en affirmation métaphysique.
translation_notes:
  register: Français moderne, sobre et méditatif. Le fragment initial est conservé comme continuation syntaxique du verset précédent. La seconde phrase privilégie une expression idiomatique concise sans atténuer la tension du texte.
