base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: fr
  text: 1 Je partis de là et m’assis dans la vallée du Cédron, dans une grotte dans la terre[a]. Là, je consacrai mon âme. Je ne mangeai pas de pain, sans pourtant avoir faim, et je ne bus pas d’eau, sans pourtant avoir soif. Je demeurai là jusqu’au septième jour, comme il me l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une grotte de la terre ».'
    reason: La note conserve l’image redoublée du syriaque, tandis que le texte principal emploie une formulation française naturelle sans ajouter que la grotte aurait été creusée.
lexical_decisions:
- source_word: ܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: une grotte creusée dans la terre
  rationale: Cette formulation française conserve l’image concrète et redoublée du syriaque tout en évitant l’expression peu naturelle « grotte de la terre ».
- source_word: ܩܕܫ / forme correspondant à « consacrer, sanctifier » dans la tradition textuelle du verset
  choice: je consacrai mon âme
  rationale: « Consacrer » exprime ici la mise à part de soi dans le jeûne et la retraite, sans suggérer que Baruch se rend lui-même moralement parfait.
- source_word: ܥܕܡܐ ܠܝܘܡܐ ܕܫܒܥܐ / formulation attestée par le contexte transmis
  choice: jusqu’au septième jour
  rationale: La tournure conserve le repère temporel ordinal et le rattache directement à l’ordre reçu.
theological_decisions:
- issue: Sens de la sanctification de l’âme
  choice: « je consacrai mon âme » comme acte de mise à part ascétique
  alternative: « je sanctifiai mon âme »
  rationale: Le contexte est celui d’une retraite accompagnée de jeûne. « Consacrai » préserve le geste religieux sans trancher en faveur d’une doctrine particulière de l’auto-sanctification.
- issue: Caractère extraordinaire de l’absence de faim et de soif
  choice: Conserver les deux affirmations sans les expliquer
  alternative: Les présenter explicitement comme un miracle
  rationale: Le texte affirme l’absence de faim et de soif, mais n’en précise pas la cause ; la traduction maintient cette retenue.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit littéraire. La répétition de « sans pourtant avoir » maintient le parallélisme entre la faim et la soif.
