  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: fr
  text: À ce moment-là, je brûlai leurs corps de l’intérieur, mais je laissai intacts, à l’extérieur, leurs vêtements et leurs armes, afin que les merveilles encore plus grandes du Puissant soient vues et que son nom soit proclamé sur toute la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܐ
  choice: le Seigneur
  rationale: Le contexte introduit une parole divine directe; « le Seigneur » est l’équivalent français naturel du titre syriaque.
- source_word: ܚܝܠܬܢܐ (sens contextuel attesté par la tradition du verset)
  choice: le Puissant
  rationale: Ce titre divin conserve l’accent sur la puissance sans ajouter une interprétation confessionnelle.
- source_word: ܬܕܡܪ̈ܬܐ (sens contextuel attesté par la tradition du verset)
  choice: merveilles
  rationale: « Merveilles » rend les actes extraordinaires de Dieu et convient au registre narratif solennel.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Conserver la première personne sans ajouter « Dieu » dans le verset
  alternative: Expliciter « moi, Dieu »
  rationale: Le contexte immédiat attribue déjà la parole au Seigneur; une explicitation dans le texte résoudrait inutilement ce que la narration établit.
- issue: Titre divin désignant l’auteur des merveilles
  choice: « le Puissant »
  alternative: « le Tout-Puissant »
  rationale: « Le Puissant » évite de renforcer le titre par l’idée d’omnipotence si celle-ci n’est pas explicitement portée par le terme source.
translation_notes:
  register: Français moderne, international et digne. La construction oppose clairement la destruction intérieure des corps à la préservation extérieure des vêtements et des armes, tout en gardant le ton solennel de la parole divine.
