  text: “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up when he destroys Zion.”
translation:
  language: fr
  text: « Voici[a], Sennachérib est prêt à nous détruire, et il sera exalté et élevé quand[b] il détruira Sion. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon un autre découpage des versets, le début se lit : « Et il dit : “Voici…” »'
    reason: La formule introductive peut être rattachée à la fin du verset précédent ou au début de celui-ci.
  - marker: b
    text: 'Ou, selon une autre compréhension : « s’il détruit Sion » ; le syriaque favorise toutefois le sens temporel « quand ».'
    reason: Signaler l’ancienne interprétation conditionnelle tout en indiquant la lecture source privilégiée.
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: Sennachérib
  rationale: Dans ce passage consacré à l’invasion assyrienne sous Ézéchias, cette forme désigne Sennachérib; le contexte et la tradition textuelle permettent de rétablir le nom malgré l’état difficile du témoin reproduit.
- source_word: ܡܛܝܒ (lecture contextuelle)
  choice: est prêt
  rationale: Rend l’idée d’une préparation déjà accomplie et d’une menace imminente, dans un français naturel.
- source_word: ܡܐ ܕ־ (lecture contextuelle)
  choice: quand
  rationale: La construction est temporelle plutôt que conditionnelle; elle exprime l’assurance arrogante attribuée à Sennachérib.
- source_word: ܨܗܝܘܢ (lecture contextuelle)
  choice: Sion
  rationale: Conserve le nom théologique et géographique traditionnel sans le remplacer par « Jérusalem ».
theological_decisions:
- issue: L’élévation de Sennachérib
  choice: « il sera exalté et élevé »
  alternative: « il s’enorgueillira et s’élèvera »
  rationale: La formulation retenue préserve l’ambiguïté de la voix et le parallélisme du texte, sans décider si cette élévation est seulement une prétention orgueilleuse ou une situation permise temporairement.
- issue: Valeur temporelle ou conditionnelle de la destruction de Sion
  choice: « quand il détruira »
  alternative: « s’il détruit »
  rationale: La valeur temporelle est la mieux étayée par la conjonction syriaque; l’autre possibilité est signalée en note pour conserver l’historique de traduction et l’ambiguïté parfois perçue.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme « exalté et élevé » est volontairement conservé afin de respecter la tension et la rhétorique du texte source.
