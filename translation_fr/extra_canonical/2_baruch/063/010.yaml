  text: And all those who were in the holy land rejoiced, and the name of the Mighty One was glorified, so that it was spoken of.
translation:
  language: fr
  text: Tous ceux qui se trouvaient dans la Terre sainte se réjouirent, et le nom du Puissant fut glorifié, si bien qu’on en parlait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: la Terre sainte
  rationale: Rend naturellement l’expression syriaque désignant le pays considéré comme saint; la majuscule indique qu’il s’agit d’un territoire déterminé.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Conserve le titre divin traditionnel fondé sur la puissance, sans le remplacer par un nom divin plus explicite.
- source_word: ܐܫܬܒܚ
  choice: fut glorifié
  rationale: Préserve la forme passive et le registre cultuel de l’expression.
- source_word: ܐܫܬܡܥ
  choice: devint célèbre
  rationale: Dans ce contexte, le sens littéral «fut entendu» exprime la diffusion de la renommée; cette formulation est idiomatique en français.
theological_decisions:
- issue: Identification du «Puissant»
  choice: Conserver le titre «le Puissant»
  alternative: Traduire explicitement par «Dieu» ou «le Tout-Puissant»
  rationale: Le texte emploie un titre divin précis; l’expliciter ou l’intensifier réduirait sa nuance propre.
translation_notes:
  register: 'Français moderne, clair et digne. La coordination a été légèrement resserrée pour éviter une tournure pesante tout en maintenant la progression: joie du peuple, glorification du nom, diffusion de sa renommée.'
