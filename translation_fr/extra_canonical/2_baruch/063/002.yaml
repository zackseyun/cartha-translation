revisions:
- from: Car lorsque Sennachérib se mit en mouvement pour détruire, et que sa fureur s’enflamma au point de tout anéantir, avec la multitude des nations qui l’accompagnaient,
  to: Car lorsque Sennachérib fut poussé à la destruction et que sa colère s’enflamma pour détruire, avec la multitude des nations qui étaient avec lui,
