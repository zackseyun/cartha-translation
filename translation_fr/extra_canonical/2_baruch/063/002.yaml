  rationale: Rend l’idée d’une mise en branle ou d’une agitation dirigée vers l’action, sans réduire le terme à une simple émotion intérieure.
- source_word: ܠܐܒܕܢܐ
  choice: pour détruire
  rationale: Exprime directement la finalité de destruction portée par le terme syriaque.
- source_word: ܣܘܓܐܐ
  choice: la multitude
  rationale: Conserve l’idée quantitative d’un très grand nombre.
theological_decisions:
- issue: Portée de la destruction
  choice: « au point de tout anéantir »
  alternative: « afin de détruire »
  rationale: La formulation conserve l’intensification de la fureur et la portée totale suggérée par le contexte, sans préciser indûment l’objet de la destruction.
