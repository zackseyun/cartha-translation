  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: fr
  text: Quand le roi Ézéchias apprit ce que projetait le roi d’Assyrie — venir, le capturer, détruire son peuple, les deux tribus et demie qui restaient, et même renverser Sion —, il mit alors sa confiance dans ses œuvres, plaça son espérance dans sa justice et parla avec le Puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ ܡ̇ܠܟܐ
  choice: le roi Ézéchias
  rationale: Le contexte et la tradition textuelle identifient clairement le roi comme Ézéchias; la forme du nom dans le témoin est rendue selon l’usage français établi.
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: le roi d’Assyrie
  rationale: Traduction directe et idiomatique du titre royal et du nom géographique.
- source_word: ܥܒ̈ܕܝܗܝ
  choice: ses œuvres
  rationale: « Œuvres » conserve la portée morale et théologique du terme, plutôt que de la réduire à de simples actions.
- source_word: ܙܕܝܩܘܬܗ
  choice: sa justice
  rationale: « Justice » préserve le champ sémantique de droiture et de conformité morale sans explicitation confessionnelle.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Titre divin traditionnel qui rend la notion de puissance tout en maintenant la référence implicite à Dieu.
theological_decisions:
- issue: Référent de « ses œuvres » et de « sa justice »
  choice: Les possessifs renvoient naturellement à Ézéchias.
  alternative: Les comprendre comme les œuvres et la justice de Dieu.
  rationale: La syntaxe du récit présente Ézéchias comme sujet immédiat des verbes « mit sa confiance », « plaça son espérance » et « parla »; la traduction conserve néanmoins les possessifs sans paraphrase explicative.
- issue: Appréciation de la confiance d’Ézéchias dans ses œuvres
  choice: Formulation descriptive, sans jugement ajouté.
  alternative: Présenter cette confiance comme louable ou condamnable.
  rationale: Le verset rapporte l’attitude d’Ézéchias sans résoudre explicitement sa valeur théologique; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue proposition est structurée par des tirets afin de garder l’élan narratif tout en assurant la lisibilité. « Exterminer » exprime ici la destruction projetée du peuple; « renverser Sion » conserve l’image politique et cultuelle du texte.
