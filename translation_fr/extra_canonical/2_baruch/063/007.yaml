  text: And he went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.
translation:
  language: fr
  text: Il sortit et détruisit leur multitude. Les chefs, à eux seuls, étaient au nombre de cent quatre-vingt-cinq mille, et chacun d’eux en comptait autant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « chacun d’eux avait un nombre semblable ». La formulation ne précise pas davantage ce que ce nombre désigne.
    reason: La donnée numérique est syntaxiquement énigmatique ; la note conserve cette difficulté sans imposer une interprétation.
lexical_decisions:
- source_word: ܘܢܦܩ
  choice: Il sortit
  rationale: Le verbe syriaque est à la troisième personne du masculin singulier ; le sujet est donc « il », et non « je ».
- source_word: ܐܘܒܕ
  choice: détruisit
  rationale: Rend directement l’idée de faire périr ou d’anéantir, sans préciser un moyen absent du texte.
- source_word: chiefs (lecture attestée par la couche de consultation auditée)
  choice: les chefs
  rationale: Terme courant et digne qui conserve la fonction dirigeante sans la préciser davantage.
- source_word: the like number (lecture attestée par la couche de consultation auditée)
  choice: en comptait autant
  rationale: Préserve la formulation étonnante et son ambiguïté référentielle au lieu de la rationaliser.
