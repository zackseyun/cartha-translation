lexical_decisions:
- source_word: ܚܝܠܘܗܝ
  choice: le Puissant
  rationale: Dans le contexte transmis, ce terme renvoie à Dieu sous un titre exprimant sa puissance; cette formulation naturelle conserve la valeur titul aire retenue par la tradition du passage.
- source_word: ܦܩܕ
  choice: donna cet ordre
  rationale: Rend clairement l'acte de commander sans alourdir la phrase.
- source_word: ܡܠܐܟܘܗܝ
  choice: son ange
  rationale: Correspond directement au nom syriaque désignant un messager ou ange, ici qualifié par son appartenance à Dieu.
- source_word: ܕܡܡܠܠܐ ܒܣܝܡ
  choice: qui parle avec toi
  rationale: Le texte de la page est matériellement difficile et la segmentation est incertaine; la formulation suit le sens contrôlé du verset, où Ramiel est identifié comme l'ange interlocuteur de Baruch.
theological_decisions:
- issue: Titre divin
  choice: le Puissant
  alternative: le Tout-Puissant
  rationale: « Le Puissant » évite d'introduire la nuance plus absolue de « Tout-Puissant » si elle n'est pas explicitement requise par le terme source.
- issue: Fonction de Ramiel
  choice: son ange qui parle avec toi
  alternative: son ange, celui qui te parle
  rationale: La relative conserve l'identification fonctionnelle sans préciser davantage le rôle ou le statut de Ramiel.
translation_notes:
  register: Français moderne, sobre et digne. L'ordre des constituants est légèrement naturalisé, tout en conservant le titre divin, le nom propre et la relation entre Ramiel et l'interlocuteur.
