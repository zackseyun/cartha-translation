  to: Quant à la huitième série d’eaux lumineuses que tu as vues, elle représente l’intégrité et la droiture d’Ézéchias, roi de Juda, ainsi que la faveur bienveillante qui est venue sur lui.
  rationale: Révision limitée à la clarification de l’ordinal dans l’image récurrente des eaux et à une légère modernisation verbale. Le sens symbolique, le doublet éthique et l’ambiguïté quant à l’agent de la faveur sont préservés.
