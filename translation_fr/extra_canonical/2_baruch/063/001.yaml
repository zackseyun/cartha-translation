  yaml_path: translation/extra_canonical/2_baruch/063/001.yaml
  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: fr
  text: Quant à la huitième série d’eaux lumineuses que tu as vues, elle représente l’intégrité et la droiture d’Ézéchias, roi de Juda, ainsi que la faveur bienveillante qui est venue sur lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: eaux lumineuses
  rationale: Cette formulation conserve l’image symbolique des eaux et leur contraste avec les eaux obscures, sans la développer par une interprétation.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  choice: intégrité et droiture
  rationale: Le doublet français préserve les deux termes éthiques du syriaque dans une langue naturelle et digne.
- source_word: ܛܝܒܘܬܐ
  choice: faveur bienveillante
  rationale: Ce choix exprime une faveur bénéfique reçue par Ézéchias sans réduire le terme à un sens doctrinal plus étroit.
theological_decisions:
- issue: La louange d’Ézéchias relève-t-elle seulement de sa conduite morale, ou également d’une faveur reçue ?
  choice: Conserver distinctement son intégrité et sa droiture, puis la faveur bienveillante venue sur lui.
  alternative: Ne mentionner que sa rectitude, ou comprendre la faveur comme une bonté abstraite.
  rationale: Le texte distingue les qualités d’Ézéchias de la faveur supplémentaire qui vient sur lui; la traduction maintient ces deux aspects sans préciser explicitement l’agent lorsque la formulation ne le fait pas.
translation_notes:
  register: Français international moderne, clair et soutenu. « Quant aux » rend naturelle l’introduction de la huitième séquence de la vision; « elles représentent » explicite sobrement la valeur symbolique de la copule.
