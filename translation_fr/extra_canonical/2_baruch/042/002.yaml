base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: fr
  text: 'Quant à ce que tu as dit : « Pour qui et pour combien ces choses seront-elles ? » les biens annoncés d’avance seront pour ceux qui les auront espérés ; mais pour ceux qui les méprisent, ce sera le contraire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܝܠܝܢ ܕܡܣܒܪܝܢ
  choice: pour ceux qui auront cru
  rationale: Le verbe syriaque exprime ici le fait de croire ou de mettre sa confiance ; le futur antérieur français situe cette foi avant l’attribution des biens annoncés.
- source_word: ܛܒ̈ܬܐ ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: les biens annoncés d’avance
  rationale: Rend littéralement les « bonnes choses » dites auparavant, tout en employant une formulation française naturelle.
- source_word: ܕܒܡܘܒܠܐ ܕܗܠܝܢ
  choice: ce sera le contraire
  rationale: Le texte oppose le sort des contempteurs aux biens promis ; « le contraire » conserve cette formulation générale sans préciser une sanction que le verset ne nomme pas.
theological_decisions:
- issue: Rapport entre la foi et les biens annoncés
  choice: Conserver l’énoncé conditionnel sans expliquer la nature de la foi ni celle de la récompense.
  alternative: Préciser qu’il s’agit du salut ou d’une récompense eschatologique.
  rationale: Le texte affirme une opposition entre ceux qui croient et ceux qui méprisent, mais ne définit pas davantage les biens en question dans ce verset.
- issue: Objet du mépris
  choice: « ceux qui les méprisent », où « les » renvoie aux choses ou aux biens annoncés.
  alternative: « ceux qui méprisent » sans complément explicite.
  rationale: Le pronom rend le lien contextuel clair en français sans résoudre plus précisément l’antécédent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question citée conserve sa portée distributive (« pour qui et pour combien »), et la dernière opposition reste volontairement générale.
