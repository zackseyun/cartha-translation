  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: fr
  text: 'Ceux qui étaient autrefois assujettis, puis se sont retirés et se sont mêlés à la descendance des peuples mêlés : leur période antérieure est comptée pour rien.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܥܒܕܘ
  choice: étaient […] assujettis
  rationale: Le passif exprime ici une condition imposée. « Assujettis » conserve cette idée sans préciser indûment la nature politique ou sociale de la dépendance.
- source_word: ܐܬܢܣܒܘ
  choice: se sont retirés
  rationale: Dans ce contexte, le verbe indique qu’ils ont été enlevés ou se sont soustraits à leur situation antérieure. La tournure pronominale française préserve la lecture retenue tout en restant naturelle.
- source_word: ܒܡܘ̈ܬܐ
  choice: à la descendance des peuples mélangés
  rationale: La formulation rend l’idée de lignée ou de groupe issu de peuples mêlés, sans employer un vocabulaire racial moderne qui ajouterait des connotations étrangères au texte.
- source_word: ܐܬܚܫܒܘ
  choice: est compté
  rationale: Le verbe relève de l’évaluation ou de l’imputation. « Est compté » garde la formulation judiciaire ou comptable du syriaque.
- source_word: ܒܙܒܢܐ
  choice: le temps qu’ils avaient vécu auparavant
  rationale: Cette explicitation légère produit un français intelligible tout en conservant la référence à leur période antérieure.
theological_decisions:
- issue: Valeur de la période antérieure de ces personnes
  choice: « est compté pour rien »
  alternative: « n’entre pas en compte »
  rationale: La formulation retenue conserve la force négative du jugement sans expliquer selon quel principe théologique cette période est annulée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la tension du texte entre l’ancien assujettissement, le retrait et l’intégration à une autre descendance, sans identifier davantage les groupes concernés.
