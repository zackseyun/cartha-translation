lexical_decisions:
- source_word: ܘܕܐܡܪܬ
  choice: Quant à ce que tu as dit
  rationale: La tournure française restitue naturellement la reprise du propos précédent introduite par la conjonction et le verbe « dire » à la deuxième personne.
- source_word: ܥܠ ܐܝܠܝܢ
  choice: au sujet de ceux qui
  rationale: Rend directement la construction prépositionnelle qui introduit les deux groupes concernés.
- source_word: ܡܠܠ
  choice: voici la parole
  rationale: Conserve la formule solennelle annonçant l’explication qui suit, sans réduire « parole » à une simple opinion ou à une paraphrase explicative.
theological_decisions:
- issue: Relation entre ceux qui s’approchent et ceux qui se retirent
  choice: Maintenir deux groupes opposés sans préciser l’objet de leur mouvement
  alternative: Ajouter qu’ils s’approchent de Dieu ou qu’ils s’en éloignent
  rationale: Le verset ne nomme pas explicitement le point de référence; l’ajouter résoudrait une ambiguïté que le texte laisse ouverte.
