  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: fr
  text: Mais ceux qui, autrefois, ne connaissaient pas la vie, puis l’ont connue et se sont mêlés à la descendance du peuple qui s’est mis à part, leur temps passé aussi est compté pour rien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ
  choice: la vie
  rationale: Conserve le sens littéral et potentiellement théologique de «vie», sans le réduire à une simple manière de vivre.
- source_word: ܙܪܥܐ
  choice: la descendance
  rationale: Dans le contexte d’un peuple, «descendance» rend naturellement l’idée collective de semence ou postérité.
- source_word: ܐܬܦܪܫ
  choice: s’est mis à part
  rationale: Préserve la valeur réfléchie/passive du verbe et évite de préciser sans preuve qui aurait opéré cette séparation.
- source_word: ܐܬܚܫܒ
  choice: est compté comme rien
  rationale: Rend l’idée d’une période antérieure tenue pour nulle, sans ajouter celle explicite d’un pardon ou d’un effacement.
theological_decisions:
- issue: Nature de la «vie» connue ultérieurement
  choice: Maintien du terme ouvert «la vie»
  alternative: «la vraie vie» ou «la voie de la vie»
  rationale: Le texte ne qualifie pas explicitement cette vie; l’ambiguïté théologique doit demeurer.
- issue: Statut du temps antérieur
  choice: «est compté comme rien»
  alternative: «ne leur est pas imputé»
  rationale: La formulation retenue conserve l’image comptable sans transformer explicitement l’énoncé en doctrine de non-imputation.
translation_notes:
  register: Français moderne, digne et lisible. La phrase garde le contraste temporel et la tension du texte source; «descendance» est préféré à «semence» dans le corps du texte pour éviter une formulation artificielle.
