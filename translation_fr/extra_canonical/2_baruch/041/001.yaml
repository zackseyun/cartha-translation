lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ (lecture locale altérée dans le texte de Ceriani)
  choice: ton alliance
  rationale: Le témoin de contrôle indique l’idée d’engagement ou de promesse. Dans ce contexte apocalyptique juif, « alliance » rend naturellement la relation d’engagement envers Dieu sans perdre sa portée collective.
- source_word: ܢܡܘܣܐ
  choice: Loi
  rationale: Dans l’expression « le joug de ta Loi », le terme garde sa force juridique et liée à l’alliance. La majuscule signale ici la Loi divine, non une règle quelconque.
- source_word: ܡܘܒܠܐ / expression localement incertaine
  choice: leur vanité
  rationale: La ligne syriaque est difficile, mais le témoin latin de contrôle soutient vanitatem suam. « Vanité » conserve l’idée d’inanité morale et spirituelle sans préciser indûment s’il s’agit d’illusion, d’idolâtrie ou de conduite vaine.
- source_word: ܓܢܦ̈ܐ / expression conservée par le témoin de contrôle
  choice: sous tes ailes
  rationale: La métaphore concrète du refuge divin est conservée, plutôt que réduite à « sous ta protection ».
- source_word: ܡܬܬܚܒܘ / expression de pesée (lecture OCR incertaine)
  choice: sera-t-il pesé
  rationale: L’image immédiatement associée de la balance confirme une métaphore de pesée judiciaire plutôt qu’une simple évaluation.
- source_word: ܡܩܒܠܝܢ
  choice: les accueillera-t-il
  rationale: Le verbe exprime ici la manière dont le temps final recevra ou traitera ces personnes. « Accueillir » préserve la personnification et laisse ouverte l’issue du jugement.
theological_decisions:
- issue: Le sort de ceux qui ont quitté l’alliance et de ceux qui se sont réfugiés auprès de Dieu
  choice: Le passage demeure une question ouverte adressée à Dieu.
  alternative: Anticiper ici une condamnation ou une absolution catégorique.
  rationale: Baruch demande encore comment le temps ultime recevra ces groupes. La traduction préserve l’attente de la réponse et ne tranche pas avant le texte.
- issue: Le sens de l’image « sous tes ailes »
  choice: Conserver littéralement la métaphore du refuge divin.
  alternative: Paraphraser par « sous ta protection ».
  rationale: L’image présente le retour non seulement comme un changement moral, mais comme une fuite vers l’abri offert par Dieu.
- issue: La pesée du « temps » des personnes concernées
  choice: Conserver l’expression énigmatique « leur temps sera-t-il pesé » et l’image de la balance.
  alternative: Expliciter par « leurs actions seront-elles évaluées » ou « leurs mérites seront-ils pesés ».
  rationale: Le texte transmis associe le temps à la pesée sans nommer explicitement les actions ou les mérites. Une explicitation résoudrait une ambiguïté authentique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe interrogative et les métaphores bibliques de la Loi comme joug, des ailes comme refuge et de la balance comme jugement sont conservées. « Ceux-ci » distingue prudemment le groupe revenu sous les ailes de Dieu, sans imposer une conclusion théologique.
