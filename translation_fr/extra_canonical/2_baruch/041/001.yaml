  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: fr
  text: 'Alors j’ai dit : « Pour qui et pour combien de personnes ces choses auront-elles lieu ? Et qui sera jugé digne de voir ce temps-là ?[a]


    Mais je te dirai tout ce que je pense, et je t’interrogerai au sujet de ceux de ton peuple que j’ai vus en grand nombre : ils se sont détournés de ton alliance et ont rejeté loin d’eux le joug de ta Loi.


    Mais j’en ai vu d’autres qui ont abandonné leur vanité[b] et se sont réfugiés sous tes ailes.


    Qu’adviendra-t-il donc de ceux-ci ? Ou comment ce temps final les accueillera-t-il ?


    Ou bien leur temps sera-t-il pesé, et seront-ils jugés selon le côté vers lequel penchera la balance ? »'
