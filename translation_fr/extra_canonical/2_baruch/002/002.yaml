lexical_decisions:
- source_word: ܥܡܘܕܐ ܫܪܝܪܐ
  choice: une colonne solide
  rationale: Rend l’image architecturale et l’idée de fermeté du texte syriaque dans un français naturel.
- source_word: ܨܠܘܬܟܘܢ
  choice: votre prière
  rationale: Conserve le singulier collectif probable et le parallélisme avec les œuvres.
- source_word: ܫܘܪܐ ܚܝܠܬܢܐ
  choice: un mur puissant
  rationale: Exprime la force protectrice de l’image sans ajouter une interprétation théologique.
theological_decisions:
- issue: Rôle protecteur des œuvres et de la prière
  choice: Conserver les comparaisons directes avec la colonne et le mur
  alternative: Expliciter que les justes protègent spirituellement la ville
  rationale: Le texte présente des images fortes sans expliquer leur mécanisme; la traduction préserve cette tension sans développer une doctrine.
translation_notes:
  register: Français moderne, digne et accessible. Le vouvoiement pluriel («vos», «votre») correspond au groupe auquel Baruch doit s’adresser. «Les œuvres de vos mains» conserve l’expression concrète du syriaque plutôt que de la réduire à «vos actes».
