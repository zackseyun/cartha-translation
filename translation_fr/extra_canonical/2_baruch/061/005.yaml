translation:
  language: fr
  text: Et les fêtes saintes furent célébrées[a] dans la bonté et avec une grande joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent accomplies ».
    reason: Le verbe peut exprimer l’idée d’accomplir ou de mener à son terme; « célébrer » est toutefois plus idiomatique avec « fêtes ».
lexical_decisions:
- source_word: ܫܠܡ (forme verbale présumée dans le segment versifié)
  choice: furent célébrées
  rationale: Pour des fêtes, « célébrer » est l’expression française naturelle; la valeur littérale d’accomplissement est conservée en note, puisque le découpage fourni ne permet pas de repérer sûrement le segment exact du verset dans le corpus de page.
- source_word: ܛܒܘܬܐ / terme correspondant (segment non isolable avec certitude)
  choice: dans la bonté
  rationale: Cette formulation conserve le substantif abstrait et évite de préciser sans preuve s’il s’agit de droiture, de bienveillance ou d’une manière convenable.
- source_word: ܚܕܘܬܐ ܣܓܝܐܬܐ / expression correspondante
  choice: avec une grande joie
  rationale: Rendu français direct et idiomatique de l’idée d’une joie abondante ou grande.
theological_decisions:
- issue: Valeur du verbe appliqué aux fêtes saintes
  choice: furent célébrées
  alternative: furent accomplies
  rationale: « Célébrer » convient naturellement à des fêtes en français moderne, sans exclure la nuance d’accomplissement du verbe source; cette nuance est signalée en note plutôt que transformée en affirmation théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le marqueur [a] est placé immédiatement après le verbe concerné. Le corpus syriaque fourni couvre un ensemble de pages avec chevauchement et ne permet pas d’isoler sûrement le texte exact de 61.5; les décisions s’appuient donc sur la lecture versifiée auditée tout en conservant son ambiguïté principale.
