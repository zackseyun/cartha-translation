  naturalness: Le texte est naturel dans un registre moderne soutenu. « Avait reçu miséricorde » est plus idiomatique et plus direct que « avait alors obtenu miséricorde » tout en restant fidèle au passif implicite de l’anglais. La ponctuation en deux phrases soutient clairement le changement de sujet.
