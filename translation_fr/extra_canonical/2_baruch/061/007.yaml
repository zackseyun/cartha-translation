  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: fr
  text: Et le pays, parce qu’il avait alors reçu miséricorde et que ses habitants n’avaient pas péché, fut glorifié plus que tous les autres pays. Quant à la ville de Sion, elle dominait alors sur tous les pays et toutes les régions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle exerçait alors son autorité sur tous les pays et toutes les régions ».'
    reason: Le verbe sémitique peut désigner le fait de dominer, de régner ou d’exercer l’autorité.
lexical_decisions:
- source_word: ܐܪܥܐ (ʾarʿā)
  choice: le pays
  rationale: Dans ce contexte politique et géographique, « le pays » est plus naturel que « la terre » et permet la comparaison avec les autres pays.
- source_word: ܫܠܛ (racine š-l-ṭ)
  choice: dominait
  rationale: Le verbe exprime l’exercice de l’autorité ou de la souveraineté; « dominait » conserve sa force sans préciser indûment la forme de gouvernement.
- source_word: ܨܗܝܘܢ (Ṣehyōn)
  choice: Sion
  rationale: Forme française traditionnelle et largement comprise du nom propre.
theological_decisions:
- issue: Sujet et bénéficiaire de la miséricorde
  choice: Le pays avait obtenu miséricorde
  alternative: Le pays avait eu pitié de ses habitants
  rationale: La formulation retenue suit la lecture attestée par la couche de consultation anglaise; l’extrait syriaque fourni pour le chapitre ne permet pas de localiser avec certitude les mots du verset afin de trancher directement cette variation.
- issue: Portée de l’autorité de Sion
  choice: elle dominait alors sur tous les pays et toutes les régions
  alternative: elle régnait alors sur tous les pays
  rationale: Cette formulation maintient l’affirmation universelle et l’adverbe temporel « alors », sans transformer l’autorité décrite en une construction théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé composé narratif a été évité au profit de l’imparfait et du passé simple, adaptés au récit ancien. L’extraction syriaque fournie correspond à un ensemble de pages du chapitre et ne fait pas apparaître clairement le verset 7; les décisions ponctuelles s’appuient donc aussi sur la couche anglaise auditée et sur les données de révision.
