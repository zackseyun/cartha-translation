lexical_decisions:
- source_word: ܫܠܡܐ
  choice: la paix
  rationale: Rend directement le terme syriaque courant désignant la paix ou l’état de bien-être; ici, le contexte décrit la condition propre à cette époque.
- source_word: '[terme syriaque correspondant à « tranquillité » dans la délimitation verset par verset]'
  choice: la tranquillité
  rationale: Le découpage fourni porte sur l’ensemble du chapitre et son texte est fortement altéré par l’OCR; la couche anglaise auditée atteste néanmoins ce second élément coordonné. « Tranquillité » conserve sa distinction avec « paix » sans introduire une interprétation supplémentaire.
- source_word: ܗܘܐ / forme existentielle au pluriel selon le texte délimité
  choice: régnaient
  rationale: Dans ce contexte descriptif, « régnaient » exprime naturellement en français que la paix et la tranquillité caractérisaient cette période, plutôt que le calque peu idiomatique « existaient ».
