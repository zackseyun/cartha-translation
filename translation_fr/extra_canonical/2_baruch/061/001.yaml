  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: fr
  text: Quant aux sixièmes eaux lumineuses que tu as vues, elles représentent l’époque où David et Salomon sont nés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celles-ci sont l’époque » ; le texte passe du symbole pluriel des eaux à l’époque singulière qu’elles représentent.'
    reason: Signaler l’écart de nombre présent dans la formulation source sans imposer au texte principal une tournure française maladroite.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: eaux lumineuses
  rationale: « Lumineuses » conserve le contraste symbolique avec les eaux obscures et exprime leur éclat favorable sans les réduire à de simples eaux transparentes.
- source_word: ܙܒܢܐ
  choice: l’époque
  rationale: Dans cette rétrospective historique, le terme désigne une période déterminée plutôt qu’un instant ponctuel ; « l’époque » convient naturellement à l’ère de David et de Salomon.
- source_word: ܕܐܬܝܠܕܘ
  choice: où … sont nés
  rationale: Cette formulation rend simplement la naissance historique des deux rois, sans ajouter une interprétation messianique.
theological_decisions:
- issue: Nature de l’époque associée aux sixièmes eaux lumineuses
  choice: L’époque historique de David et de Salomon, présentée comme une période favorable dans le symbolisme de la vision
  alternative: Une désignation directe du règne messianique à venir
  rationale: Le verset identifie explicitement ces eaux à la période où David et Salomon sont nés. Il convient de préserver cette référence historique sans lui substituer une lecture directement eschatologique.
- issue: Accord entre le symbole pluriel (« eaux ») et l’identification à une époque singulière
  choice: « elles représentent l’époque »
  alternative: « c’est l’époque » ou, littéralement, une construction mêlant pluriel et singulier
  rationale: La formulation française rend clairement la relation symbolique tout en conservant le passage du signe pluriel à la période singulière qu’il désigne.
translation_notes:
  register: Français international moderne, sobre et digne. « Quant aux » assure une reprise naturelle dans l’explication suivie de la vision ; « représentent » explicite seulement la relation symbolique nécessaire en français.
