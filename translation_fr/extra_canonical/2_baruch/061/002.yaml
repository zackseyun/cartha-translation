  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: fr
  text: À cette époque eurent lieu[a] la construction de Sion et la consécration du sanctuaire. Beaucoup de sang des nations qui péchèrent alors fut versé, et de nombreuses offrandes furent présentées lors de la consécration du sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il y eut ».'
    reason: La tournure source peut exprimer de manière générale que ces événements arrivèrent ou se produisirent.
lexical_decisions:
- source_word: ܗܘܐ (forme verbale présumée derrière la tradition contrôlée)
  choice: eurent lieu
  rationale: Expression française naturelle pour introduire deux événements, tout en conservant la valeur générale d’avènement ou de survenue signalée par la tradition de traduction.
- source_word: ܨܗܝܘܢ / Sion (selon la tradition contrôlée du verset)
  choice: Sion
  rationale: Forme française biblique usuelle du nom propre.
- source_word: sanctuaire (lexème syriaque non isolable avec certitude dans l’extrait de page fourni)
  choice: sanctuaire
  rationale: Conserve la distinction entre la ville de Sion et le lieu sacré consacré.
- source_word: nations (lexème syriaque non isolable avec certitude dans l’extrait de page fourni)
  choice: nations
  rationale: Maintient le pluriel collectif et la portée internationale du terme sans le réduire à un groupe particulier.
- source_word: offrandes (lexème syriaque non isolable avec certitude dans l’extrait de page fourni)
  choice: offrandes
  rationale: Terme cultuel français suffisamment large pour ne pas préciser indûment la nature des dons ou sacrifices.
theological_decisions:
- issue: Rapport entre le sang versé et les nations pécheresses
  choice: « Beaucoup de sang des nations qui avaient alors péché fut versé »
  alternative: « Il y eut alors une grande effusion du sang des nations pécheresses »
  rationale: La formulation retenue préserve l’affirmation selon laquelle le sang versé est celui des nations qui avaient péché, sans expliciter l’agent ni transformer le constat en commentaire théologique.
- issue: Nature de la consécration du sanctuaire
  choice: consécration
  alternative: dédicace
  rationale: « Consécration » est naturel en français courant et cultuel; il exprime la mise à part inaugurale sans importer une cérémonie confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et lisible. La première phrase conserve la coordination des deux événements; la seconde évite de nommer un agent responsable de l’effusion de sang, puisque le texte transmis n’en précise pas ici.
