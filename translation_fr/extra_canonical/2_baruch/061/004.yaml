lexical_decisions:
- source_word: ܚܟܡܬܐ
  choice: la sagesse
  rationale: Équivalent français direct du nom syriaque « sagesse », dans un registre biblique naturel.
- source_word: ܥܘܬܪܐ
  choice: les richesses
  rationale: Le terme désigne la richesse ou l’abondance; le pluriel français rend naturellement l’idée d’une profusion de ressources.
- source_word: ܣܘܟܠܬܢܘܬܐ
  choice: l’intelligence
  rationale: Rend la faculté de comprendre ou le discernement sans lui donner une coloration doctrinale particulière.
