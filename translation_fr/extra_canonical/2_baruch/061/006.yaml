  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: fr
  text: Et les jugements des dirigeants apparurent alors sans tromperie, et la justice des commandements du Puissant fut accomplie en vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝ̈ܢܐ (dīnē)
  choice: les jugements
  rationale: Le nom syriaque est au pluriel; la traduction conserve ce nombre plutôt que l’ancien singulier signalé dans la note anglaise.
- source_word: ܫܠܝ̈ܛܢܐ (shallīṭānē)
  choice: des dirigeants
  rationale: « Dirigeants » rend naturellement le sens d’autorités ou de gouvernants sans préciser indûment leur fonction.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: du Puissant
  rationale: Titre divin traditionnel dans 2 Baruch, rendu comme un substantif avec majuscule afin de conserver sa valeur titulatrice.
- source_word: ܒܩܘܫܬܐ (ba-qūštā)
  choice: en vérité
  rationale: Cette formulation garde le caractère affirmatif et solennel de l’expression syriaque.
theological_decisions:
- issue: Accomplissement de la justice des commandements
  choice: la justice des commandements du Puissant s’accomplit
  alternative: les justes commandements du Puissant furent accomplis
  rationale: La formulation retenue conserve « justice » comme notion grammaticale distincte et évite de réduire la proposition à la simple exécution des commandements.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination et le parallélisme de la phrase source sont conservés; « apparurent » rend l’idée d’une réalité alors manifestée ou reconnue.
