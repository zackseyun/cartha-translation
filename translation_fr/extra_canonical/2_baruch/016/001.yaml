base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: fr
  text: 'Et je répondis : « Ô Seigneur, mon Seigneur, les années de ce monde[a] sont peu nombreuses et mauvaises. Qui peut, en si peu de temps, acquérir ce qui est sans mesure ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du temps présent » ou « de cette époque ».'
    reason: Le terme syriaque peut désigner soit le temps ou l’époque présente, soit, dans ce contexte apocalyptique, le monde présent.
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: les années
  rationale: Le terme désigne concrètement des années et maintient l’accent sur la brièveté de la vie humaine.
- source_word: ܙܒܘ̈ܢܝ
  choice: de ce monde
  rationale: Dans ce contexte apocalyptique, l’expression vise vraisemblablement l’ordre présent plutôt qu’un simple moment; la note conserve toutefois la possibilité du sens temporel « du temps présent ».
- source_word: ܡܫܟܚ
  choice: peut… acquérir
  rationale: Cette formulation active garde la question de Baruch sur la capacité humaine d’obtenir ou d’atteindre ce qui dépasse sa courte existence.
- source_word: ܡܟܝܠܐ
  choice: en si peu de temps
  rationale: La tournure française exprime naturellement la petitesse de la durée impartie, en contraste avec ce qui est sans mesure.
- source_word: ܡܫܘܚܬܐ
  choice: ce qui est sans mesure
  rationale: Cette expression préserve l’image de la mesure et le contraste entre une durée humaine limitée et une réalité qui la dépasse.
theological_decisions:
- issue: La plainte de Baruch remet-elle en cause la justice divine, ou déplore-t-elle surtout l’incapacité humaine d’atteindre la fin promise au cours d’une vie brève ?
  choice: Le texte demeure une plainte sur la brièveté humaine face à une fin qui dépasse toute mesure, sans nier la réalité ni la valeur de cette fin.
  alternative: Comprendre la question comme une contestation plus directe de l’équité de l’exigence divine.
  rationale: La formulation interrogative conserve la tension, tandis que le contexte des chapitres 15 à 17 met l’accent sur l’obéissance et la conduite plutôt que sur la longueur de la vie.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse solennelle « Ô Seigneur, mon Seigneur » et l’image « sans mesure » gardent la tonalité de la prière et le contraste rhétorique du syriaque.
