  text: Mais après cela, de nombreuses nations tomberont.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: après cela
  rationale: Rend naturellement la locution temporelle syriaque « après ces choses », sans alourdir le français.
- source_word: '[texte syriaque de ce verset transmis de manière incertaine dans l’extrait fourni]'
  choice: de nombreuses nations tomberont
  rationale: L’extrait de page est manifestement brouillé et ne permet pas d’isoler avec assurance tous les mots du verset; la formulation retient le sens attesté par la couche de consultation auditée, tout en évitant d’ajouter une cause, un lieu ou une forme précise de chute.
theological_decisions:
- issue: Nature de la chute des nations
  choice: tomberont
  alternative: seront renversées / connaîtront la ruine
  rationale: Le verbe simple conserve l’indétermination du texte quant à une chute politique, militaire, morale ou eschatologique.
translation_notes:
  register: Français moderne, sobre et prophétique. « Après cela » est plus naturel que « après ces choses »; « de nombreuses nations » garde la portée collective sans préciser leur identité.
