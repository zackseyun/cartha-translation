  yaml_path: translation/extra_canonical/2_baruch/068/005.yaml
  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: fr
  text: Et à ce moment-là[a], après un court intervalle, Sion sera rebâtie, ses offrandes seront rétablies et les prêtres reprendront leur service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et alors ».'
    reason: Signale une autre manière naturelle de rendre la transition temporelle syriaque, tout en maintenant dans le texte principal sa valeur démonstrative plus précise.
lexical_decisions:
- source_word: ܘܒܗܘ ܙܒܢܐ
  choice: Et à ce moment-là
  rationale: Rend explicitement la valeur temporelle et démonstrative de l’expression syriaque, plutôt que la simple succession exprimée par « puis ».
- source_word: ܨܗܝܘܢ
  choice: Sion
  rationale: Conserve le nom traditionnel et immédiatement reconnaissable de la ville sainte.
- source_word: ܩܘܪ̈ܒܢܝܗ̇
  choice: ses offrandes
  rationale: « Offrandes » exprime naturellement le contexte cultuel sans restreindre indûment le terme aux seuls sacrifices sanglants.
- source_word: ܬܫܡܫܬܗܘܢ
  choice: leur service
  rationale: Dans ce contexte sacerdotal, « service » désigne naturellement le ministère cultuel tout en restant accessible en français moderne.
theological_decisions:
- issue: Nature de la restauration de Sion
  choice: Conserver les éléments concrets de la reconstruction, des offrandes et du service sacerdotal.
  alternative: Spiritualiser la restauration en parlant seulement d’un renouveau religieux.
  rationale: Le verset présente une restauration urbaine et cultuelle concrète; la traduction ne doit ni l’allégoriser ni préciser davantage son accomplissement.
translation_notes:
  register: Français moderne, courant et digne. « Sera rebâtie », « seront rétablies » et « reprendront leur service » forment une progression claire de la restauration de la ville, du culte et du sacerdoce.
