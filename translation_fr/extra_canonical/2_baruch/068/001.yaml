  text: 'And the twelfth bright waters that you saw—this is the word:'
translation:
  language: fr
  text: 1 Quant aux douzièmes eaux lumineuses que tu as vues, voici ce qu’elles signifient :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceci est la parole ».'
    reason: Conserve la formulation littérale du syriaque, tandis que le texte français en rend la fonction d’introduction à l’interprétation.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: eaux lumineuses
  rationale: Conserve l’image symbolique récurrente et son opposition aux eaux noires, dans un français naturel et digne.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: en voici le sens
  rationale: Rend la formule syriaque qui introduit l’interprétation des eaux; « sens » exprime ici plus naturellement la valeur explicative de ܡܠܬܐ que le calque « parole ».
theological_decisions:
- issue: Valeur de la formule d’identification qui ouvre l’interprétation
  choice: en voici le sens
  alternative: voici la parole / les voici
  rationale: La formule syriaque signifie littéralement « ceci est la parole », mais fonctionne dans ce contexte comme une introduction à l’explication. « Les voici » modifierait le référent et perdrait cette fonction interprétative.
translation_notes:
  register: Français international moderne, clair et soutenu. L’ordre « les douzièmes eaux lumineuses » maintient directement l’adjectif symbolique avec « eaux ». La ponctuation met en relief la formule d’interprétation sans alourdir la phrase.
