  text: And at that time they will have much joy.
translation:
  language: fr
  text: Et en ce temps-là, ils éprouveront une grande joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ ܗܘ (b-zabnā haw)
  choice: en ce temps-là
  rationale: La préposition avec le nom « temps » et le démonstratif renvoie à un moment déterminé; « en temps voulu » ou « avec le temps » ferait disparaître cette valeur démonstrative.
- source_word: joie (expression syriaque reflétée par la tradition textuelle du verset)
  choice: éprouveront une grande joie
  rationale: Cette formulation rend naturellement en français l’idée d’avoir une joie abondante, sans ajouter de cause ni préciser davantage les bénéficiaires.
theological_decisions:
- issue: Caractère eschatologique du repère temporel
  choice: Conserver le repère précis « en ce temps-là »
  alternative: « avec le temps » ou « en temps voulu »
  rationale: Le démonstratif syriaque désigne la période évoquée dans le contexte plutôt qu’un accomplissement graduel ou indéfini.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « éprouveront une grande joie » est plus naturelle que le calque « auront beaucoup de joie » tout en conservant le sens.
