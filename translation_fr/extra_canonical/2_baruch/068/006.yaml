translation:
  language: fr
  text: Les nations viendront elles aussi lui rendre honneur, mais pas aussi pleinement qu’autrefois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡ̈ܡܐ / notion exprimée dans le passage transmis
  choice: les nations
  rationale: Dans ce contexte, le terme désigne les peuples autres qu’Israël. « Les nations » conserve le vocabulaire biblique tout en restant clair en français moderne.
- source_word: ܐܝܩܪܐ
  choice: rendre honneur
  rationale: Le champ sémantique est celui de l’honneur et de la considération. La tournure verbale française est naturelle et évite de surcharger le texte d’une nuance cultuelle non certaine.
- source_word: construction comparative correspondant à « pas aussi pleinement qu’autrefois »
  choice: mais pas aussi pleinement qu’autrefois
  rationale: Cette formulation garde la restriction comparative sans préciser davantage la nature ni le degré de l’honneur rendu.
theological_decisions:
- issue: Référent du pronom indirect
  choice: Maintenir « lui » sans expliciter le référent
  alternative: Remplacer le pronom par « à Sion » ou par le nom du référent supposé
  rationale: Le verset dépend de son contexte immédiat et le référent n’est pas nommé dans cette unité. L’expliciter introduirait une interprétation absente de la formulation reçue.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre « elles aussi » met naturellement en relief l’ajout des nations. La formulation conserve la comparaison et son imprécision.
