translation:
  language: fr
  text: Telles sont les eaux lumineuses que tu as vues.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܒ̈ܝܐ ܕܢܘܗܪܐ
  choice: les eaux lumineuses
  rationale: Dans le contexte de la vision et de son interprétation, l’expression désigne les eaux claires ou brillantes, par opposition aux grandes eaux obscures. « Lumineuses » conserve l’image du texte syriaque et la distinction symbolique entre lumière et ténèbres.
theological_decisions:
- issue: Valeur symbolique des eaux lumineuses
  choice: Ne pas expliciter leur signification dans le verset
  alternative: les eaux représentant les périodes de justice
  rationale: Le verset identifie simplement un élément de la vision; ajouter son interprétation résoudrait indûment le symbolisme au-delà de ce qui est formulé ici.
translation_notes:
  register: Français moderne, clair et digne. La tournure « Telles sont » convient à une formule d’identification dans l’explication d’une vision; le tutoiement correspond à l’adresse au voyant.
