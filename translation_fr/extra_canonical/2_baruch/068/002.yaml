  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: fr
  text: Après cela viendra un temps où ton peuple tombera dans une détresse telle que tous risqueront de périr ensemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Après cela
  rationale: Rend naturellement la transition temporelle syriaque sans alourdir la phrase par « après ces choses ».
- source_word: ܠܐܒܗܝܟܘܢ / contexte de l’adresse
  choice: ton peuple
  rationale: Le passage relève d’une adresse directe; le tutoiement singulier convient à l’interlocuteur prophétique et reste naturel en français biblique moderne.
- source_word: champ lexical de la diminution et du péril dans le passage
  choice: une détresse telle que tous risqueront de périr ensemble
  rationale: Exprime l’intensité et le danger collectif indiqués par le contexte, sans transformer le péril en disparition déjà accomplie.
theological_decisions:
- issue: Degré de certitude de la destruction du peuple
  choice: risqueront de périr
  alternative: périront
  rationale: Maintient la distinction entre une menace extrême et son accomplissement certain; le texte décrit le peuple comme exposé collectivement à la disparition.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le ton prophétique futur et la portée collective de l’épreuve, sans explicitation doctrinale.
