  text: Nevertheless, they will be saved, and their enemies will fall before them.
translation:
  language: fr
  text: Cependant, ils seront sauvés, et leurs ennemis tomberont devant eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: « ils seront sauvés » (formulation syriaque du verset, selon l’alignement contrôlé)
  choice: ils seront sauvés
  rationale: Conserve le passif et la portée future sans préciser l’agent du salut, que le texte laisse implicite.
- source_word: « leurs ennemis »
  choice: leurs ennemis
  rationale: Terme français courant et digne qui exprime directement l’hostilité du groupe opposé.
- source_word: « tomberont devant eux »
  choice: tomberont devant eux
  rationale: Maintient l’image spatiale et militaire de la chute devant quelqu’un, sans la réduire explicitement à la mort ou à la défaite.
theological_decisions:
- issue: Agent implicite du salut
  choice: Maintenir la tournure passive « ils seront sauvés »
  alternative: « Dieu les sauvera »
  rationale: Le passif préserve la réserve du texte et évite d’expliciter un agent qui n’est pas nommé dans le verset.
- issue: Sens de la chute des ennemis
  choice: « tomberont devant eux »
  alternative: « seront vaincus par eux »
  rationale: La formulation retenue conserve l’image et son ambiguïté possible entre chute, défaite et mort.
translation_notes:
  register: 'Français international moderne, clair et solennel. « Cependant » rend l’opposition du début sans lourdeur. Aucune note n’est ajoutée : l’ancienne variante longue signalée dans la couche anglaise appartient, d’après la révision critique fournie, à 2 Baruch 68:6 et non à 68:3.'
