- source_word: ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: nous qui sommes en vie
  rationale: Rend directement la proposition relative syriaque et conserve le contraste avec ceux qui ne sont pas nés ou qui sont morts au verset précédent.
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: les souffrances de Sion
  rationale: Dans ce contexte de lamentation sur la ruine de la ville, le terme désigne les détresses ou afflictions subies par Sion ; « souffrances » est naturel et suffisamment large en français moderne.
- source_word: ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: et ce qui est arrivé à Jérusalem
  rationale: Reproduit sans préciser davantage la formule syriaque générale désignant ce qui est advenu à Jérusalem.
