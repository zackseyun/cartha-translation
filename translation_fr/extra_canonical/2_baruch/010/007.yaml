  text: 'But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.'
translation:
  language: fr
  text: 'Mais nous qui sommes en vie, malheur à nous !

    Car nous voyons les souffrances de Sion

    et ce qui est arrivé à Jérusalem.'
  philosophy: optimal-equivalence
