translation:
  language: fr
  text: Et je parlai à Jérémie, mon frère, comme le Seigneur me l’avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ ܠܐܪܡܝܐ ܐܚܝ
  choice: Et je dis à Jérémie, mon frère
  rationale: Le verbe ܐܡܪ avec la préposition ܠ introduit naturellement en français le destinataire de la parole. L’apposition « mon frère » conserve le rapport exprimé par ܐܚܝ.
- source_word: ܕܦܩܕܢܝ ܡܪܝܐ
  choice: ce que le Seigneur m’avait ordonné
  rationale: La proposition relative renvoie le plus naturellement au contenu communiqué à Jérémie. Le plus-que-parfait rend l’antériorité de l’ordre divin par rapport à la parole de Baruch.
theological_decisions:
- issue: Référent de la proposition ܕܦܩܕܢܝ ܡܪܝܐ
  choice: 'Elle exprime le contenu de l’ordre transmis à Jérémie : « ce que le Seigneur m’avait ordonné »'
  alternative: « comme le Seigneur me l’avait ordonné », où l’ordre porterait sur l’acte même de parler à Jérémie
  rationale: La syntaxe syriaque permet une certaine souplesse. Le contexte qui se poursuit par le départ de Jérémie avec le peuple favorise la lecture où Baruch lui communique les instructions reçues, sans exclure entièrement la lecture adverbiale.
translation_notes:
  register: Français moderne, sobre et narratif. « Seigneur » traduit le titre syriaque ܡܪܝܐ avec la dignité habituelle du registre biblique; la virgule d’apposition évite de faire de « mon frère » un élément du nom.
