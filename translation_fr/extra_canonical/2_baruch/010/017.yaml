  text: 'Désormais, ne chantez plus la beauté,

    et ne parlez plus de la splendeur…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܗܫܐ
  choice: Désormais
  rationale: Rend naturellement la transition temporelle « à partir de maintenant ».
- source_word: ܠܐ ܗܘܝ ܬܙܡܪܘܢ
  choice: ne chantez plus
  rationale: Le verbe ܙܡܪ désigne normalement l’action de chanter; cette valeur concrète est préférable au plus général « parler » de la couche anglaise.
- source_word: ܫܘܦܪܐ
  choice: la beauté
  rationale: Équivalent direct du nom désignant la beauté ou la splendeur.
- source_word: ܠܐ ܬܚܬܘܢ
  choice: ne célébrez plus
  rationale: Le contexte poétique appelle un verbe parallèle à « chanter »; « célébrer » conserve l’idée d’un discours laudatif sans imposer une nuance technique.
