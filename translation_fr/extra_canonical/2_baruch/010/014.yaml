  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: fr
  text: 'Que les femmes stériles se réjouissent plutôt,

    et que celles qui n’ont pas d’enfants soient dans l’allégresse ;

    mais que celles qui ont des enfants prennent le deuil.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܘܪ̈ܟܐ
  choice: les femmes stériles
  rationale: Dans ce contexte de maternité, de grossesse et d’enfants, le terme désigne les femmes privées de fécondité; le pluriel français explicite le référent féminin impliqué.
- source_word: ܚܕܝܢ
  choice: se réjouissent
  rationale: Rend directement le champ lexical de la joie tout en conservant la forme d’exhortation.
- source_word: ܟܐܒܐ
  choice: prennent le deuil
  rationale: Le contexte est une lamentation sur la catastrophe de Jérusalem; cette formulation française exprime une douleur profonde et publique plutôt qu’une simple tristesse.
theological_decisions:
- issue: Renversement entre stérilité et maternité
  choice: 'Conserver sans l’atténuer le paradoxe: les femmes sans enfants sont appelées à se réjouir, tandis que les mères doivent prendre le deuil.'
  alternative: Expliquer dans le corps du verset que les enfants seront exposés à la catastrophe.
  rationale: Le texte formule volontairement une inversion saisissante dans le cadre du jugement; ajouter sa cause résoudrait une tension que le verset laisse implicite.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique en trois lignes est conservé, avec une opposition nette introduite par « mais ».
