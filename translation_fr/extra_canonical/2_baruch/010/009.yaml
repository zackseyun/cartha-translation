  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: fr
  text: 'Vous, cultivateurs, ne semez plus ;


    et toi, terre, pourquoi donnes-tu encore tes fruits ?


    Garde en toi la douceur de ta subsistance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: terre
  rationale: Le nom syriaque désigne ici la terre personnifiée et directement interpellée.
- source_word: ܦܐܪ̈ܐ
  choice: fruit
  rationale: Le terme signifie littéralement « fruits » ; le singulier collectif français convient naturellement dans l’expression « donner le fruit ».
- source_word: ܚܠܝܡܘܬܐ
  choice: douceur
  rationale: Dans ce contexte de nourriture produite par la terre, le mot évoque la qualité agréable ou savoureuse de ce qu’elle fournit.
- source_word: ܡܙܘ̈ܢܝܟܝ
  choice: ta nourriture
  rationale: Le terme renvoie à la subsistance ou aux aliments que procure la terre ; « nourriture » conserve cette image simplement.
