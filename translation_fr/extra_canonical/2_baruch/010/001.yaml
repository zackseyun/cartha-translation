lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ / ܫܒܥܐ ܝܘܡ̈ܝܢ
  choice: Sept jours plus tard
  rationale: Rend naturellement la succession temporelle exprimée par la tradition syriaque du verset, sans alourdir le français par « il arriva que ».
- source_word: ܦܬܓܡܗ ܕܐܠܗܐ
  choice: la parole de Dieu
  rationale: Conserve l’expression théologique traditionnelle et le sens de message ou parole venant de Dieu.
- source_word: ܗܘܐ ... ܠܘܬܝ
  choice: me fut adressée
  rationale: Formule française idiomatique pour la venue d’une parole à quelqu’un; elle préserve l’initiative divine.
- source_word: ܘܐܡܪ ܠܝ
  choice: en ces termes
  rationale: Évite la répétition peu naturelle « et me dit », tout en introduisant fidèlement le discours qui suit.
theological_decisions:
- issue: Nature de « la parole de Dieu »
  choice: Maintien de « la parole de Dieu » sans personnification explicite
  alternative: « Dieu me parla »
  rationale: Le syriaque présente la parole comme ce qui vient à Baruch; la traduction ne doit ni effacer cette formulation ni lui imposer une interprétation hypostatique.
translation_notes:
  register: Français moderne, sobre et digne. La tournure prophétique traditionnelle est conservée, mais formulée avec une syntaxe naturelle. Le deux-points annonce la parole divine poursuivie au verset suivant.
