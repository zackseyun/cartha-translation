  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: fr
  text: 'Il partit donc avec le peuple. Quant à moi, Baruch, je revins m’asseoir devant les portes du Temple, et je prononçai sur Sion cette lamentation :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܠ ܥܡ ܥܡܐ
  choice: Il partit donc avec le peuple
  rationale: Rend directement le mouvement exprimé par « aller » et conserve le contraste avec Baruch; « donc » marque naturellement la reprise narrative de ܕܝܢ.
- source_word: ܐܦܩܬ
  choice: je revins
  rationale: Le contexte et la tradition textuelle soutiennent ici l’idée du retour de Baruch, bien que la forme syriaque transmise soit difficile et puisse évoquer littéralement une sortie ou le fait de faire sortir.
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: m’asseoir devant les portes du Temple
  rationale: Conserve le pluriel « portes » et rend idiomatiquement la succession des actions en français.
- source_word: ܐܠܝܬ ܐܠܝܬܐ ܗܕܐ ܥܠ ܨܗܝܘܢ
  choice: je prononçai sur Sion cette lamentation
  rationale: La répétition étymologique syriaque « lamenter une lamentation » se rend naturellement par « prononcer une lamentation »; « sur Sion » préserve l’objet du deuil.
