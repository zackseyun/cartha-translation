base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: fr
  text: 'Et toi, soleil, retiens la lumière de tes rayons ;

    et toi, lune, éteins l’abondance de ta lumière.

    Pourquoi, en effet, la lumière se lèverait-elle encore,

    alors que la lumière de Sion s’est obscurcie ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: soleil
  rationale: Équivalent direct du nom syriaque, conservé dans l’apostrophe poétique.
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: la lumière de tes rayons
  rationale: Rend l’association syriaque des rayons et de la lumière sans alourdir la formulation française.
- source_word: ܢܘܗܪܐ
  choice: lumière
  rationale: La répétition de « lumière » structure la lamentation et relie les astres à Sion.
- source_word: ܚܫܟܐ / ܕܠܚܫܟܘܢ
  choice: s’est obscurcie
  rationale: Exprime l’entrée dans les ténèbres tout en gardant l’image de la lumière de Sion.
theological_decisions:
- issue: Portée symbolique de la lumière de Sion
  choice: Conserver simplement « la lumière de Sion »
  alternative: Expliciter cette lumière comme la gloire, le temple ou la présence divine
  rationale: Le texte poétique ne précise pas le référent ; l’expliciter supprimerait une ambiguïté intentionnelle.
- issue: Personnification des astres
  choice: Maintenir l’adresse directe au soleil et à la lune
  alternative: Reformuler comme une description de leur obscurcissement
  rationale: Les impératifs adressés aux astres participent directement à la lamentation cosmique.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme, les apostrophes et la répétition de « lumière » sont préservés. « Se lèverait-elle encore » garde l’image dynamique du retour de la lumière sans l’expliquer.
