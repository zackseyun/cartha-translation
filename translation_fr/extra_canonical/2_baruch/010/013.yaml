  yaml_path: translation/extra_canonical/2_baruch/010/013.yaml
  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: fr
  text: 'Et vous, époux, n’entrez pas ;


    que les vierges ne se parent pas.


    Et vous, femmes, ne priez pas pour avoir des enfants.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܬ̈ܢܐ (reconstitué d’après le contexte et la tradition textuelle)
  choice: jeunes époux
  rationale: Rend le sens de « jeunes mariés / époux » dans cette lamentation, en français naturel, sans réduire le terme au seul moment de la cérémonie nuptiale.
- source_word: ܒܬܘܠ̈ܬܐ (forme attendue dans le passage)
  choice: jeunes filles
  rationale: Dans ce contexte de noces et de parure, cette expression est plus naturelle en français moderne que « vierges », tout en conservant la référence aux jeunes femmes non mariées.
- source_word: ܢܫ̈ܐ
  choice: femmes
  rationale: Équivalent direct et non interprétatif du terme syriaque.
- source_word: ܕܢܐܠܕܢ / formulation syriaque correspondante attendue
  choice: pour avoir des enfants
  rationale: Exprime idiomatiquement en français la prière visant à enfanter, conformément au sens transmis par le texte témoin.
theological_decisions:
- issue: Portée des impératifs négatifs
  choice: Les conserver comme des injonctions poétiques au sein d’une lamentation
  alternative: Les formuler comme des interdictions religieuses générales
  rationale: Le contexte déplore la catastrophe de Sion et suspend les réjouissances, les noces et l’espérance d’une naissance ; il ne fonde pas une règle universelle sur le mariage ou la maternité.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme en trois membres et les impératifs négatifs sont conservés. Aucun marqueur de note n’est nécessaire.
