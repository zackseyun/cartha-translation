  language: fr
  text: 'Et vous, cieux, retenez votre rosée,

    et n’ouvrez pas les réserves de la pluie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܝܐ
  choice: cieux
  rationale: Le pluriel « cieux » conserve la personnification cosmique et le registre solennel de l’apostrophe.
- source_word: ܛܠܐ
  choice: rosée
  rationale: « Rosée » est l’équivalent français direct et naturel du terme météorologique sémitique.
- source_word: ܐܘܨܪ̈ܐ
  choice: réserves
  rationale: Le terme désigne des dépôts ou magasins. « Réserves de la pluie » garde l’image ancienne tout en restant plus naturel en français moderne que « trésoreries ».
- source_word: ܡܛܪܐ
  choice: pluie
  rationale: Traduction directe, sans explicitation supplémentaire.
theological_decisions:
- issue: Personnification des cieux
  choice: Conserver l’adresse directe aux « cieux »
  alternative: Reformuler comme une demande adressée à Dieu afin qu’il retienne la rosée et la pluie
  rationale: Le texte poétique apostrophe les éléments du cosmos; le reformuler en prière explicite à Dieu résoudrait indûment l’image et modifierait son énonciataire grammatical.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux impératifs négatifs est préservé, ainsi que l’image cosmologique des réserves célestes de pluie.
