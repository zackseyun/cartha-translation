  terminology: « Grossesses », « engendrent » et « emmenés en captivité » rendent sobrement les termes concrets du syriaque. « Mère joyeuse » traduit littéralement l’expression transmise sans tenter de résoudre sa tension avec la captivité des enfants.
  issues:
  - severity: high
    issue: Ajout de « la semence de leur nature »
    rationale: Cette expression figure dans l’audit anglais mais n’est pas attestée dans la portion syriaque correspondant au verset, qui parle des femmes, de leurs grossesses et des hommes qui engendrent.
  - severity: high
    issue: « Cette mère est dévastée » remplace « une mère joyeuse »
    rationale: Le syriaque transmis porte ܐܡܐ ܚܕܝܬܐ, littéralement « une mère joyeuse » ; « dévastée » suit l’anglais mais inverse le qualificatif source.
  - severity: medium
    issue: Fusion des femmes enceintes et des hommes qui engendrent
    rationale: Le texte source les énonce dans deux questions distinctes ; les conserver préserve le parallélisme rhétorique.
  revised_text: Ou pourquoi les femmes espéreraient-elles encore dans leurs grossesses ? Ou pourquoi les hommes qui engendrent espéreraient-ils encore, eux qui ont une mère joyeuse, alors que ses enfants sont emmenés en captivité ?
