base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: fr
  text: Ou pourquoi les humains auraient-ils encore des enfants ? Pourquoi parlerait-on encore de la semence de leur nature, alors que cette mère est dévastée et que ses enfants sont partis en captivité ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܝ̈ܐ … ܒܛܢܝ̈ܗܝܢ / ܐܢܫܐ ܕܡܘܠܕܝܢ
  choice: les humains auraient-ils encore des enfants
  rationale: Le syriaque évoque successivement les femmes enceintes et les hommes qui engendrent. La formulation française rassemble naturellement les deux aspects sans limiter la phrase à un seul sexe.
- source_word: semence de leur nature (lecture attestée par la couche de consultation)
  choice: la semence de leur nature
  rationale: Cette expression difficile est conservée plutôt que clarifiée arbitrairement en « descendance » ; elle maintient l’image biologique et l’ambiguïté du texte transmis.
- source_word: ܐܡܐ
  choice: cette mère
  rationale: Le terme « mère » personnifie vraisemblablement Sion ou Jérusalem dans le contexte immédiat ; le référent n’est pas inséré dans le corps du verset afin de préserver l’image.
- source_word: lecture correspondant à « dévastée »
  choice: dévastée
  rationale: Dans le contexte de la chute de Sion, « dévastée » exprime mieux l’état de la ville-mère que « désolée », qui pourrait surtout évoquer un sentiment.
- source_word: ܐܬܬܒܝܘ
  choice: sont partis en captivité
  rationale: Le verbe renvoie au fait d’être emmené captif. « Partis en captivité » reste naturel tout en conservant l’idée d’exil forcé.
theological_decisions:
- issue: Identification de la mère
  choice: Conserver « cette mère » comme personnification non explicitée
  alternative: Remplacer par « Sion » ou « Jérusalem »
  rationale: Le contexte désigne clairement la ville, mais le texte emploie l’image maternelle. L’expliciter dans la traduction réduirait la portée poétique et interprétative.
- issue: Portée de la question sur la procréation
  choice: La rendre comme une lamentation rhétorique liée à la catastrophe
  alternative: La formuler comme une interdiction générale d’avoir des enfants
  rationale: Le contexte est une lamentation sur Sion dévastée et ses enfants captifs, non un enseignement normatif universel sur la procréation.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les questions rhétoriques et la personnification maternelle sont maintenues. L’expression inhabituelle « semence de leur nature » demeure volontairement proche de la tradition textuelle consultée, sans ajout doctrinal.
