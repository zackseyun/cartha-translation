    ܗܠܝܢ. ܐܠܐ ܚܢܢ ܕܒܚܪܢ.

    ܘܐܝܕܘܗܝ ܒܥܝܢܐ ܘܠܒܝܫܝܢ

    ܕܚ̈ܠܬܘܗܝ. ܡܠܒܟܝܢ ܚܒܘ

