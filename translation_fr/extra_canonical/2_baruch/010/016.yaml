  verdict: revise
  source_fidelity: 'Le texte syriaque visible formule deux questions parallèles : les femmes espérant dans leurs grossesses, puis les hommes qui engendrent espérant encore. Il mentionne ensuite une « mère joyeuse » et ses enfants emmenés en captivité. Le projet, suivant la piste anglaise, introduit « la semence de leur nature », « dévastée » et réduit les deux groupes sexués à « les humains » ; ces éléments ne correspondent pas au syriaque fourni.'
