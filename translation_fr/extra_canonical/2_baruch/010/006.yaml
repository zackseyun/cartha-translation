translation:
  language: fr
  text: '« Heureux celui qui n’est pas né,

    ou celui qui est né et qui est mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܘܒܘܗܝ (ṭubawhy)
  choice: Heureux
  rationale: Rend directement la formule syriaque de béatitude tout en conservant ici sa force paradoxale dans le contexte de la lamentation.
- source_word: ܠܗܘ ܕܠܐ ܐܬܝܠܕ (l-haw d-lā etiled)
  choice: celui qui n’est pas né
  rationale: Traduction formellement proche du syriaque, sans transformer l’irréel ou le paradoxe en explication.
- source_word: ܐܬܝܠܕ ܘܡܝܬ (etiled w-mīt)
  choice: est né et qui est mort
  rationale: Conserve la coordination et les deux verbes accomplis du texte source dans un français naturel.
theological_decisions:
- issue: Portée de la béatitude paradoxale
  choice: Maintenir littéralement la bénédiction de celui qui n’est pas né ou qui est déjà mort.
  alternative: L’atténuer en parlant de quelqu’un qui aurait mieux fait de ne pas naître.
  rationale: Le texte appartient à une lamentation poétique et exprime une tension extrême sans offrir ici de résolution doctrinale; la traduction ne doit donc ni l’adoucir ni la systématiser.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme poétique est conservé sur deux lignes; le point d’exclamation rend la force de la lamentation sans ajouter de contenu.
