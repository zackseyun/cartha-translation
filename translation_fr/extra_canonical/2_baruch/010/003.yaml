lexical_decisions:
- source_word: ܩܘܡ
  choice: reste
  rationale: Dans ce contexte, l’impératif exprime le fait de demeurer sur place plutôt que l’action physique de se lever.
- source_word: ܒܚܘܪ̈ܒܝܗ ܕܨܗܝܘܢ
  choice: parmi les ruines de Sion
  rationale: Rend concrètement le cadre de dévastation associé à Sion, conformément au sens contextuel et à la tradition textuelle contrôlée.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: ce qui doit arriver
  rationale: Conserve la portée prospective de la tournure syriaque sans préciser indûment la nature des événements.
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ
  choice: à la fin des jours
  rationale: Formule eschatologique naturelle en français biblique moderne, tout en préservant l’expression temporelle du texte.
theological_decisions:
- issue: Portée eschatologique de la dernière expression
  choice: à la fin des jours
  alternative: dans les derniers temps
  rationale: La formulation retenue conserve l’image sémitique des « jours » et évite de transformer l’expression en catégorie théologique plus systématique.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve le contraste initial, le décor concret de la Sion dévastée et l’ambiguïté relative de l’horizon eschatologique.
