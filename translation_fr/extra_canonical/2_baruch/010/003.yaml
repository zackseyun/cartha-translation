    ܐܬܬܒܝܘ. ܡܢ ܗܫܐ

    ܠܐ ܗܘܝ ܬܙܡܪܘܢ ܥܠ

    ܫܘܦܪܐ. ܘܠܐ ܬܚܬܘܢ'
