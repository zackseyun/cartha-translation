    ܘܝܕܘܥܐ ܡܢ ܥܒ̈ܕܐ.

    ܐܬܬܥܝܪܘ ܘܐܣܗܕܘ

    ܚܝ̈ܝܟܘܢ ܠܡܘܡܬܐ.

    ܘܣܒܘ ܒܗܘܢ ܐܪ̈ܒܥܬܐ

    ܘܐܡܪܘ ܒܫܡܝ ܕܐܢܬܘܢ

    ܦܠܚܝ̈ܢ ܠܐ ܬܙܥܘܢ ܬܘܒ.

    ܘܐܢܬ ܐܢܒܐ ܠܡܢܝ

    ܚܘܒܐ ܦܐܪ̈ܐ ܕܒ̈ܠܠܝܘܗܝ.

    ܐܝܟܢܐ ܒܨܝܪܝܢ ܚܠܝܡܘܬܐ

    ܕܡܙܘ̈ܢܝܟܝ. ܘܐܢܬ ܐܪܥܐ

    ܠܡܢܐ ܡܘܣܦܐܢܬܝ ܕܬܬܠܝܢ

