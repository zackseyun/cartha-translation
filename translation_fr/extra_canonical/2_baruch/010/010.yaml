  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: fr
  text: 'Et toi, vigne, pourquoi produis-tu encore ton vin ?


    Car aucune offrande provenant de toi ne sera plus reçue à Sion,


    et aucune des prémices ne sera plus acceptée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: vigne
  rationale: Le contexte de la production du vin exige ici le sens de « vigne », avec une apostrophe directe au féminin.
- source_word: ܚܡܪܐ (lecture sous-jacente probable au texte transmis avec OCR dégradé)
  choice: vin
  rationale: Cette lecture correspond au parallélisme entre la vigne et son produit ainsi qu’au témoignage de la couche de consultation anglaise.
- source_word: ܡܬܩܒܠ
  choice: reçue / acceptée
  rationale: Le verbe signifie « être reçu, agréé ». « Reçue » convient à l’offrande, tandis qu’« acceptée » rend naturellement la même idée pour les prémices.
- source_word: ܦܐܪ̈ܐ
  choice: prémice
  rationale: Dans ce contexte cultuel, le pluriel syriaque désigne les premiers produits offerts; le singulier collectif français « prémice » conserve ce sens.
theological_decisions:
- issue: Portée cultuelle de l’offrande et des prémices
  choice: Conserver les termes généraux « offrande » et « prémice » sans préciser le rite.
  alternative: Paraphraser comme une offrande de vin ou les premiers fruits de la vendange.
  rationale: Le texte évoque le culte interrompu à Sion sans fournir ici assez de détails pour identifier plus précisément le rite ou la matière de chaque offrande.
translation_notes:
  register: Français moderne, sobre et élégiaque. L’apostrophe à la vigne et le parallélisme des deux derniers membres sont conservés; « ne… plus » rend naturellement l’idée de cessation exprimée par « de nouveau/encore » dans la construction négative.
