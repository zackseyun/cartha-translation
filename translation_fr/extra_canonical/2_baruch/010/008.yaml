base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: fr
  text: 'J’appellerai les Sirènes[a] de la mer,


    et vous, liliths[b], venez du désert,


    et vous, démons et dragons, venez des forêts.


    Réveillez-vous, ceignez-vous les reins pour le deuil,


    entonnez avec moi des chants funèbres


    et lamentez-vous avec moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Sirènes » sont ici des êtres fabuleux associés à la mer, non des avertisseurs sonores.
    reason: Évite le sens moderne courant de « sirène » tout en conservant le terme du texte.
  - marker: b
    text: Les « liliths » sont des êtres nocturnes ou démoniaques que les traditions anciennes associent notamment aux lieux déserts.
    reason: Le terme ancien n’a pas d’équivalent français exact ; la note éclaire la translittération sans imposer une identification précise.
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: Sirènes
  rationale: Transcription naturelle en français du nom emprunté présent dans le syriaque; la majuscule signale ici une catégorie d’êtres fabuleux interpellés, sans les réduire aux sirènes du folklore français moderne.
- source_word: ܠܝ̈ܠܝܬܐ
  choice: liliths
  rationale: Le terme désigne des êtres nocturnes ou démoniaques du désert. La translittération préserve cette catégorie ancienne sans l’identifier arbitrairement à un équivalent folklorique français.
- source_word: ܫܐ̈ܕܐ
  choice: démons
  rationale: Équivalent français courant du pluriel syriaque désignant des esprits malfaisants.
- source_word: ܐܪ̈ܒܥܬܐ
  choice: chants funèbres
  rationale: Dans ce contexte de deuil et de lamentation, le mot renvoie à des complaintes ou chants de deuil; «chants funèbres» rend clairement la fonction poétique.
- source_word: ܐܬܬܥܝܪܘ
  choice: Réveillez-vous
  rationale: Rend directement l’impératif pluriel et conserve l’interpellation vive du poème.
theological_decisions:
- issue: Nature des Sirènes, des liliths, des démons et des dragons
  choice: Conserver les diverses catégories d’êtres nommées par le texte
  alternative: Les généraliser en «êtres mauvais» ou les interpréter comme de simples animaux
  rationale: Le passage emploie une imagerie cosmique et mythopoétique dans une lamentation. La traduction ne tranche pas la question de leur statut ontologique et n’efface pas les distinctions du texte.
translation_notes:
  register: Poésie de lamentation au registre digne et direct. Les impératifs et le parallélisme sont conservés. «Ceignez-vous les reins» garde l’image corporelle ancienne, encore intelligible en français, tandis que «entonnez des chants funèbres» restitue naturellement l’appel collectif au deuil.
