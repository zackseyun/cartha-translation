lexical_decisions:
- source_word: ܠܡܢܐ ܓܝܪ
  choice: Pourquoi, en effet
  rationale: Rend l’interrogation causale et la particule explicative syriaques dans un français naturel et soutenu.
- source_word: '[passage syriaque correspondant à l’idée d’enfanter dans la douleur]'
  choice: enfanteraient-elles dans la douleur
  rationale: « Enfanter » exprime clairement ici le fait de mettre au monde, tandis que « dans la douleur » conserve la force de la lamentation.
- source_word: '[passage syriaque correspondant à l’idée d’ensevelir dans les gémissements]'
  choice: pour ensevelir ensuite dans les gémissements
  rationale: Conserve le parallélisme tragique entre naissance et sépulture; « ensuite » explicite sobrement la succession implicite.
theological_decisions:
- issue: Portée de la question dans la lamentation sur Sion
  choice: Conserver une question rhétorique sans en atténuer la dureté
  alternative: Transformer la phrase en affirmation explicative sur la souffrance et la mort
  rationale: Le texte exprime une lamentation poétique et une tension réelle face à la catastrophe; il ne faut pas lui ajouter une résolution théologique absente du verset.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme naissance–ensevelissement est maintenu, ainsi que l’image collective des femmes évoquées par le contexte.
