  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: fr
  text: 'Et je répondis : « Non, Seigneur, mon Seigneur. » Il me répondit : « Pourquoi te tourmentes-tu au sujet de ce que tu ne connais pas ? Pourquoi t’inquiètes-tu de choses que tu ignores ? De même que tu n’as oublié ni ceux qui existent maintenant ni ceux qui ont disparu, moi non plus, je n’oublie pas ceux qui sont encore à venir. En effet, lorsqu’Adam pécha et que la mort fut décrétée pour ceux qui allaient naître, le nombre de ceux qui naîtraient fut alors fixé. Pour ce nombre, un lieu fut préparé, afin que les vivants y habitent et que les morts y soient gardés. Tant que ce nombre fixé d’avance ne sera pas au complet, la création ne reprendra donc pas vie. Car mon Esprit donne la vie, et le Shéol reçoit les morts. En outre, il t’a été accordé d’entendre ce qui arrivera après ces temps. Car mon salut s’est véritablement approché : il n’est plus aussi éloigné qu’auparavant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܝܪ
  choice: te tourmentes-tu
  rationale: Exprime un trouble intérieur réel sans suggérer une panique extrême; la seconde proposition varie naturellement avec « t’inquiètes-tu ».
- source_word: ܡܢܝܢܐ
  choice: nombre
  rationale: Conserve l’idée apocalyptique d’un total déterminé d’avance, plutôt que celle du simple acte de compter.
- source_word: ܫܝܘܠ
  choice: Shéol
  rationale: La translittération préserve le cadre apocalyptique juif du texte et évite de réduire le terme à la tombe individuelle ou de l’identifier à une conception ultérieure de l’enfer.
- source_word: ܦܘܪܩܢܐ
  choice: salut
  rationale: Rend naturellement la vaste notion d’intervention divine qui délivre, sans la restreindre à un seul aspect.
- source_word: ܪܘܚܝ
  choice: mon Esprit
  rationale: Le possessif divin et la fonction vivifiante justifient cette formulation; la majuscule marque la référence divine sans préciser davantage le statut théologique du terme.
theological_decisions:
- issue: Le péché d’Adam comme moment où la mort est décrétée pour l’humanité future
  choice: « la mort fut décrétée pour ceux qui allaient naître »
  alternative: « la mortalité fut imposée aux descendants d’Adam »
  rationale: La formulation retenue préserve la portée collective et apocalyptique du passage sans importer une systématisation doctrinale ultérieure.
- issue: L’action divine vivifiante et le rôle du Shéol
  choice: « mon Esprit donne la vie, et le Shéol reçoit les morts »
  alternative: « mon souffle fait vivre, et le Shéol garde les morts »
  rationale: Cette traduction maintient le contraste entre vie et mort tout en évitant de préciser indûment la manière dont s’exerce l’action vivifiante.
- issue: Le retour à la vie de la création lorsque le nombre fixé sera complet
  choice: « la création ne reprendra donc pas vie »
  alternative: « la créature ne vivra pas de nouveau »
  rationale: « La création » convient mieux à la portée cosmique et collective du contexte, tandis que « reprendra vie » garde ouverte la nature exacte de ce renouvellement.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes autour du nombre fixé, des vivants et des morts sont conservées; quelques variations verbales évitent une lourdeur artificielle sans effacer les parallélismes.
