base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: fr
  text: Moi, Baruch, je vins avec Jérémie, dont le cœur avait été trouvé pur de péchés[a] et qui n’avait pas été emmené lors de la prise de la ville. Nous déchirâmes nos vêtements, pleurâmes, nous lamentâmes et jeûnâmes pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner l’innocence de Jérémie à l’égard des péchés qui ont conduit à la chute de la ville, sans nécessairement affirmer qu’il était absolument sans péché.
    reason: Préserver la tension entre la formulation morale générale et son contexte immédiat.
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: je vins
  rationale: Le début du chapitre est textuellement fragile, mais le contexte et la tradition de contrôle indiquent un verbe simple de mouvement. « Je vins » évite de préciser indûment s’il s’agit d’un retour ou d’un départ.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: dont le cœur avait été trouvé pur de péchés
  rationale: Cette formulation conserve l’évaluation morale exprimée par le syriaque sans la transformer directement en affirmation doctrinale d’une impeccabilité absolue.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: lors de la prise de la ville
  rationale: « Prise » rend naturellement le contexte militaire et violent de la chute de la ville.
- source_word: ܐܬܚܙܝ
  choice: avait été trouvé
  rationale: Le verbe exprime ici un constat porté sur l’état moral de Jérémie plutôt qu’une simple perception visuelle.
- source_word: ܘܒܩ̈ܝ
  choice: pleurâmes, nous lamentâmes
  rationale: Deux verbes distincts maintiennent le poids cumulatif des gestes de deuil dans le récit.
theological_decisions:
- issue: Jérémie est décrit comme « pur de péchés »
  choice: Conserver la formulation ouverte « pur de péchés » et signaler sa portée contextuelle possible.
  alternative: Traduire comme une affirmation explicite que Jérémie était absolument sans péché.
  rationale: Le contexte immédiat relie cette pureté à la culpabilité de la ville et à sa chute. La traduction ne tranche donc pas silencieusement entre innocence circonstancielle et portée morale plus générale.
translation_notes:
  register: Français international actuel, narratif et digne. Le passé simple convient au récit écrit; les quatre marques successives du deuil sont conservées sans les fondre en une seule expression.
