  language: fr
  text: C’est pourquoi, à cette époque-là, Manassé fut appelé « l’impie » et, à la fin, sa demeure fut dans le feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܫܐ
  choice: Manassé
  rationale: Forme française traditionnelle du nom propre syriaque.
- source_word: ܪܫܝܥܐ
  choice: l’impie
  rationale: Rend le substantif/adjectif syriaque désignant celui qui agit avec impiété, tout en conservant sa valeur de titre attribué à Manassé.
- source_word: ܡܥܡܘܪܗ
  choice: sa demeure
  rationale: Conserve l’image spatiale du lieu où il habite ou séjourne, sans la réduire explicitement à une destination doctrinale particulière.
theological_decisions:
- issue: Nature du séjour final de Manassé dans le feu
  choice: sa demeure fut dans le feu
  alternative: il finit par habiter dans le feu
  rationale: La formulation retenue préserve l’affirmation sévère et imagée du texte sans préciser la durée, la nature exacte du feu ni une doctrine de l’au-delà que le verset n’explicite pas.
translation_notes:
  register: Français moderne, sobre et dignifié. Les guillemets autour de « l’impie » indiquent clairement qu’il s’agit de l’appellation donnée à Manassé.
