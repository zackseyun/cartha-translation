base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/009.yaml
  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: fr
  text: Ce n’était pas parce qu’il avait mené une vie irréprochable, car il n’en était pas digne, mais afin que, dès lors, il sache par qui il serait finalement puni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܐ
  choice: ce n’était pas parce que…
  rationale: La négation syriaque est rendue dans une construction causale française naturelle, conformément au sens attesté par la couche de consultation.
- source_word: 'ܫܘܐ / ܚܫܚ (sens contextuel : être digne)'
  choice: il n’en était pas digne
  rationale: « Être digne » conserve le jugement porté sur le personnage sans préciser davantage la nature de son indignité.
- source_word: 'ܢܬܝܕܥ / ܢܕܥ (sens contextuel : savoir)'
  choice: il sache
  rationale: Le verbe de connaissance est gardé tel quel, sans le remplacer par « comprendre » ou « reconnaître ».
- source_word: 'ܢܬܬܢܓܕ / ܢܬܦܪܥ (sens contextuel : être puni)'
  choice: il serait finalement puni
  rationale: La tournure passive maintient l’indétermination de l’agent immédiat et « finalement » restitue l’orientation vers l’issue dernière.
theological_decisions:
- issue: Rapport entre conduite irréprochable, dignité et châtiment
  choice: 'Conserver les trois affirmations sans les harmoniser : sa vie n’était pas irréprochable, il n’était pas digne, et la connaissance de celui qui le punirait avait un but.'
  alternative: Expliquer son indignité par une faute précise ou identifier explicitement l’auteur du châtiment.
  rationale: Le verset laisse subsister la tension morale et n’autorise ni l’ajout d’une faute déterminée ni l’identification explicite de l’agent.
translation_notes:
  register: Français moderne, international et digne. « Mené une vie irréprochable » est plus idiomatique que « vécu irréprochablement », tandis que « dès lors » et « finalement » préservent les repères temporels. Le témoin syriaque fourni est un corpus de chapitre dont la segmentation et l’état textuel sont difficiles; la formulation suit le sens contrôlé par la couche anglaise auditée sans ajouter d’interprétation confessionnelle.
