revisions:
- from: Car, bien que sa prière ait été entendue par le Très-Haut, à la fin, lorsqu’il fut jeté dans le cheval de bronze et que celui-ci fondit, cela devint pour lui un signe pour un temps.[a]
  to: Car, bien que sa prière ait été entendue par le Très-Haut, pourtant, à la fin, lorsqu’il fut jeté dans le cheval de bronze et que le cheval de bronze fondit, cela fut pour lui, pour le moment, un signe.[a]
