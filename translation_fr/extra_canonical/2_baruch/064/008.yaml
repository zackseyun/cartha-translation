  yaml_path: translation/extra_canonical/2_baruch/064/008.yaml
  text: For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him for the moment.
translation:
  language: fr
  text: Car, bien que sa prière ait été entendue par le Très-Haut, pourtant, à la fin, lorsqu’il fut jeté dans le cheval de bronze et que le cheval de bronze fondit, cela fut pour lui, pour le moment, un signe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour un temps ».
    reason: La locution syriaque peut souligner soit le moment considéré, soit le caractère limité de ce signe.
lexical_decisions:
- source_word: ܐܫܬܡܥܬ ܒܥܘܬܗ ܠܘܬ ܡܪܝܡܐ
  choice: sa prière ait été entendue par le Très-Haut
  rationale: Rend directement la prière entendue auprès du Très-Haut, dans un français naturel et digne.
- source_word: ܠܫܥܬܐ (lecture attestée par la tradition textuelle de la fin du verset)
  choice: pour un temps
  rationale: L’expression syriaque est idiomatique et indique ici une durée limitée ou provisoire, plutôt qu’un propos « concernant l’heure ».
- source_word: cheval de bronze (tradition textuelle du verset)
  choice: cheval de bronze
  rationale: Conserve l’image concrète et inhabituelle du texte sans la réinterpréter comme un autre instrument.
theological_decisions:
- issue: Portée du signe accordé après l’exaucement de la prière
  choice: un signe pour un temps
  alternative: un signe concernant l’heure
  rationale: La formulation retenue préserve le caractère temporaire du signe sans tirer de conclusion doctrinale explicite sur le destin final du personnage.
translation_notes:
  register: Français international moderne, sobre et narratif. La structure concessive est conservée, ainsi que l’image énigmatique du cheval de bronze.
