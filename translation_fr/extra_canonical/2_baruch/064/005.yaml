  text: And a decree also went out against the two and a half tribes, that they too should be led away captive, as you have now seen.
translation:
  language: fr
  text: 'Un décret fut également promulgué contre les deux tribus et demie : elles aussi devaient être emmenées en captivité, comme tu viens de le voir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܝܢ ܫܒ̈ܛܝܢ ܘܦܠܓܗ
  choice: les deux tribus et demie
  rationale: Rend directement l’expression syriaque désignant les tribus établies à l’est du Jourdain.
- source_word: ܕܬܫܬܡܥܘܢ
  choice: devaient être emmenées en captivité
  rationale: Le texte transmis dans ce passage est difficile et paraît corrompu; ce choix suit le sens contextuel contrôlé par la tradition de traduction, où les tribus subissent à leur tour la déportation.
- source_word: ܐܝܟ ܕܚܙܝܬ ܗܫܐ
  choice: comme tu viens de le voir
  rationale: Conserve l’adresse au singulier et la valeur immédiate de ܗܫܐ, « maintenant / à présent ».
theological_decisions:
- issue: Nature de la décision visant les tribus
  choice: Un décret fut aussi prononcé contre
  alternative: Une sentence fut aussi rendue contre
  rationale: « Décret » reste institutionnel sans préciser davantage l’agent, que le segment syriaque disponible ne permet pas d’identifier sûrement.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation garde le passif du jugement et évite d’ajouter explicitement un agent divin ou humain.
