translation:
  language: fr
  text: Alors la colère sortit de devant le Puissant, pour que Sion soit déracinée — comme cela s’est aussi produit à votre époque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ
  choice: la colère
  rationale: Rend directement le nom syriaque désignant la colère ou le courroux, sans expliciter davantage son caractère judiciaire.
- source_word: ܡܢ ܩܕܡ
  choice: de devant
  rationale: Conserve l’expression relationnelle sémitique indiquant que la colère émane de la présence du Puissant.
- source_word: ܚܝܠܬܢܐ
  choice: le Puissant
  rationale: Titre divin traditionnel qui exprime la puissance sans introduire un nom ou une précision absente du texte.
- source_word: ܬܬܥܩܪ
  choice: soit déracinée
  rationale: Préserve l’image forte de l’arrachement à la racine plutôt que de la réduire à une simple destruction.
theological_decisions:
- issue: Rapport entre la colère divine et le déracinement de Sion
  choice: « afin que Sion soit déracinée »
  alternative: « de sorte que Sion fut déracinée »
  rationale: La formulation finale conserve la valeur de but ou de résultat possible dans la construction source, sans atténuer le lien entre le jugement émanant du Puissant et le sort de Sion.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « sortit de devant » est volontairement plus formelle afin de préserver l’image syriaque d’une colère émanant de la présence divine.
