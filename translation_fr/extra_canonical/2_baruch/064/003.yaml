  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: fr
  text: Il fit une statue à cinq visages, dont quatre regardaient vers les quatre vents ; le cinquième se trouvait au sommet de la statue[a], comme un rival du zèle du Puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus de la statue ».
    reason: La tournure syriaque peut désigner soit le sommet de la statue, soit une position au-dessus d’elle.
  - marker: b
    text: Ou « comme s’il s’opposait à la jalousie du Puissant ».
    reason: Le terme source désigne un rival ou un adversaire ; « zèle » peut aussi porter la nuance de jalousie.
lexical_decisions:
- source_word: ܨܠܡܐ (ṣalmā)
  choice: statue
  rationale: Dans ce contexte idolâtrique, « statue » désigne plus naturellement l’objet sculpté que le terme plus général « image ».
- source_word: ܚܡܫܥܣܪܐ / contexte numérique du passage
  choice: cinq visages
  rationale: La lecture attendue décrit quatre visages orientés vers les quatre vents et un cinquième placé au sommet ; la formulation française explicite sobrement cette structure.
- source_word: ܠܥܠ ܡܢ ܨܠܡܐ (leʿel men ṣalmā)
  choice: au sommet de la statue
  rationale: La préposition peut signifier « au-dessus de » ou « sur le haut de ». « Au sommet » convient à la disposition physique du cinquième visage sans suggérer qu’il flotte séparément.
- source_word: ܛܢܢܐ (ṭnānā)
  choice: ardeur jalouse
  rationale: Le mot réunit les idées de zèle et de jalousie. « Ardeur jalouse » conserve cette tension sémantique dans un français naturel.
- source_word: ܚܝܠܬܢܐ / désignation divine correspondante
  choice: le Puissant
  rationale: Ce titre divin est rendu littéralement, sans lui substituer une désignation confessionnelle plus interprétative.
theological_decisions:
- issue: Rapport du cinquième visage au zèle divin
  choice: « rival de l’ardeur jalouse du Puissant »
  alternative: « comme s’il s’opposait à l’ardeur jalouse du Puissant »
  rationale: Le substantif source exprime directement un rival ou adversaire. La traduction garde l’affront idolâtrique sans diluer l’expression en simple comparaison.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la symétrie des quatre vents et du cinquième visage, ainsi que l’ambivalence théologique du zèle jaloux divin.
