base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: fr
  text: 'Car il commit beaucoup d’impiétés : il tua les justes, faussa la justice, répandit le sang innocent, viola des femmes mariées, renversa les autels, supprima les offrandes et chassa les prêtres, de sorte qu’ils ne pouvaient plus assurer le service dans le sanctuaire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪ̈ܫܝܥܐ / notion d’impiété dans le passage transmis
  choice: impiétés
  rationale: Le pluriel français exprime ici les nombreux actes impies détaillés ensuite, dans un registre clair et digne.
- source_word: ܕܡܐ ܐܫܕ
  choice: répandit le sang
  rationale: Cette tournure conserve l’image sémitique traditionnelle de l’effusion de sang tout en restant naturelle en français.
- source_word: notion de service sacerdotal
  choice: assurer le service
  rationale: Cette formulation rend l’exercice cultuel des prêtres sans préciser au-delà de ce que permet le contexte.
- source_word: notion de sanctuaire
  choice: sanctuaire
  rationale: Terme cultuel précis et non confessionnel, préférable à « temple » si le lexème source vise le lieu saint de manière générale.
theological_decisions:
- issue: Nature de la faute envers les femmes mariées
  choice: viola des femmes mariées
  alternative: fit violence à des femmes mariées
  rationale: La série dénonce des actes précis; « viola » rend explicitement la violence sexuelle indiquée par la formulation de consultation, sans euphémisme ni ajout doctrinal.
- issue: Portée de l’abolition cultuelle
  choice: supprima les offrandes
  alternative: abolit leurs sacrifices
  rationale: « Offrandes » garde une portée plus large et évite de limiter sans nécessité la catégorie cultuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le rythme cumulatif de l’accusation et les parallélismes verbaux. Le témoin syriaque fourni est un extrait de chapitre à chevauchement, dans un ordre textuel difficile à isoler avec certitude; la formulation suit donc les éléments contrôlables du passage et la couche anglaise auditée, sans ajouter de précision confessionnelle.
