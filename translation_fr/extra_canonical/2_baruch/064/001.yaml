  yaml_path: translation/extra_canonical/2_baruch/064/001.yaml
  text: And the ninth black waters that you saw—this is all the wickedness that was in the days of Manasseh son of Hezekiah.
translation:
  language: fr
  text: Quant aux neuvièmes eaux noires que tu as vues, elles représentent tout le mal qui régnait au temps de Manassé, fils d’Ézékias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceci est tout le mal »; le syriaque emploie un démonstratif singulier.'
    reason: La traduction courante explicite le rapport symbolique entre les eaux, au pluriel, et le mal, exprimé au singulier dans le texte source.
lexical_decisions:
- source_word: ܡ̈ܠܐ ... ܬܫ̈ܥܝܐ / vision des eaux
  choice: les neuvièmes eaux noires
  rationale: Le verset renvoie à la neuvième séquence d’eaux sombres de la vision. « Noires » maintient l’opposition symbolique entre les eaux claires et les eaux noires.
- source_word: ܚܒܠܐ
  choice: le mal
  rationale: Dans cette explication du règne de Manassé, le terme désigne globalement sa perversité morale et religieuse; « le mal » est naturel en français et conserve la portée collective du singulier syriaque.
- source_word: ܟܠܗ
  choice: tout
  rationale: Le quantificateur présent dans le syriaque doit être rendu explicitement.
- source_word: ܒܝܘܡ̈ܬܐ ܕܡܢܫܐ ܒܪ ܚܙܩܝܐ
  choice: au temps de Manassé, fils d’Ézékias
  rationale: Formulation française courante et fidèle à l’expression temporelle ainsi qu’à la filiation.
theological_decisions:
- issue: Rapport entre les eaux symboliques et le mal du règne de Manassé
  choice: « elles représentent tout le mal »
  alternative: « ceci est tout le mal »
  rationale: La formulation explicite sobrement la fonction symbolique des eaux sans préciser davantage la nature du mal ni atténuer le jugement porté par le texte.
- issue: Valeur du singulier collectif désignant le mal
  choice: le mal
  alternative: la perversité / les actes mauvais
  rationale: Le singulier collectif préserve l’unité du jugement moral sans transformer le texte en liste d’actes particuliers.
translation_notes:
  register: Français international moderne, clair et digne. « Quant aux » assure naturellement la reprise de la vision; « régnait » situe le mal dans l’époque de Manassé sans lui attribuer un sens technique supplémentaire.
