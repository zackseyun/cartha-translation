  text: And the impiety of Manasseh grew so great that it removed the glory of the Most High from the sanctuary.
translation:
  language: fr
  text: L’impiété de Manassé devint si grande qu’elle éloigna du sanctuaire la gloire du Très-Haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre compréhension : « que la gloire du Très-Haut fut éloignée du sanctuaire ».'
    reason: Signale l’ancienne lecture passive sans effacer la construction active appuyée par la grammaire syriaque.
lexical_decisions:
- source_word: ܪܘܫܥܐ / ܪܘܫܥܗ
  choice: l’impiété de Manassé
  rationale: « Impiété » exprime ici une conduite profondément contraire à Dieu, dans un registre digne et naturel.
- source_word: ܐܝܩܪܗ ܕܡܪܝܡܐ
  choice: la gloire du Très-Haut
  rationale: Rend directement le titre divin et le terme désignant sa gloire ou sa présence glorieuse.
- source_word: ܡܢ ܡܩܕܫܐ
  choice: du sanctuaire
  rationale: « Sanctuaire » convient au lieu saint concerné et évite de préciser indûment « temple ».
theological_decisions:
- issue: Rapport entre l’impiété de Manassé et le retrait de la gloire divine
  choice: 'Formulation active : « elle éloigna »'
  alternative: 'Formulation passive : « la gloire du Très-Haut fut éloignée »'
  rationale: La forme verbale syriaque est active et a pour sujet féminin l’impiété; la traduction conserve donc sa responsabilité causale forte, tout en signalant l’autre analyse traditionnelle en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le lien causal marqué par le syriaque et emploie le titre traditionnel « le Très-Haut ».
