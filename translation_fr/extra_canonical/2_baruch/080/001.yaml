  source_fidelity: 'La trame narrative suit le syriaque transmis, en particulier la succession : action des anges contre la ville, dissimulation des objets, puis livraison aux ennemis. Le début demeure textuellement abrupt et l’ellipse doit être conservée. La formulation française actuelle introduit toutefois un participe détaché (« Sachant ») dont le sujet ne correspond pas à « nous savions » et rend la phrase grammaticalement défectueuse. « Sans force » interprète plus étroitement que « peu nombreux et petits/faibles ».'
  naturalness: Le registre est globalement naturel et digne. La correction de l’ouverture rétablit une syntaxe française fluide tout en maintenant l’inachèvement attesté. « Muraille brisée » est plus neutre et plus proche de « broken wall » que « muraille éventrée ».
  terminology: « Anges », « objets sacrés » avec note de réserve, « Temple », « Très-Haut » et « abaissement de Sion » conviennent. La note sur les objets cachés préserve correctement la possibilité d’un sens plus général (« objets précieux »).
  issues:
  - severity: medium
    issue: Participe initial sans rattachement syntaxique correct
    rationale: « Sachant d’avance ... —, nous savions » attribue grammaticalement « sachant » au sujet de « nous savions », mais produit une construction redondante et fautive dans laquelle le contenu elliptique n’est pas intégré. Le syriaque et l’audit anglais autorisent une ouverture volontairement inachevée, non une rupture grammaticale française.
  - severity: low
    issue: « Muraille éventrée » est trop imagé
    rationale: Le texte audit traduit « broken wall » et le syriaque est difficile à cet endroit. « Brisée » restitue la destruction sans ajouter l’image corporelle spécifique d’« éventrée ».
  - severity: low
    issue: « Sans force » est une précision interprétative
    rationale: Le sens transmis est « peu nombreux et petits/faibles ». « Faibles » demeure plus proche et moins explicatif que « sans force ».
  revised_text: 'Nous savions d’avance ce qui devait arriver : Nabuchodonosor, roi de Babylone, avait formé ce dessein dans son cœur…[a] Mais nous savions qu’aucun ordre sorti de sa bouche ne resterait sans effet et que rien ne se produirait autrement qu’il ne l’avait fixé d’avance. En effet, ce qui avait été décidé d’avance fut manifesté au grand jour. Il me fut aussi révélé que des anges intervenaient contre la ville : ils ébranlèrent ses murailles et les arrachèrent, et ils abattirent la puissante muraille avec ses solides angles de fer. Mais, à ce moment-là, ils cachèrent les objets sacrés[b], afin que les ennemis ne les voient pas.


    Après avoir accompli cela, ils livrèrent aux ennemis la muraille brisée, la maison dépouillée, le Temple incendié et le peuple vaincu que l’on emmenait. Ainsi, les ennemis ne pourraient pas se vanter en disant : « Nous avons même encerclé la maison du Très-Haut et nous l’avons renversée au combat. »


    Ils enchaînèrent aussi vos frères, les emmenèrent à Babylone et les y firent habiter. Mais nous, avec nos descendants, nous sommes restés ici, peu nombreux et faibles. Telle est la détresse du peuple au sujet de laquelle je vous ai écrit. Vous savez certainement combien l’abaissement de Sion a pesé sur vous : vous la connaissiez mieux que le reste du peuple, puisque c’était vous qui y assuriez le service, tandis que nous vous prêtions assistance.'
  revised_footnotes:
  - marker: a
    text: Le début de la phrase est abrupt et le texte syriaque transmis ici est difficile ; la traduction conserve l’ellipse sans ajouter les mots proposés par certaines restitutions.
    reason: Préserver l’état fragmentaire et l’incertitude syntaxique du témoin syriaque fourni.
  - marker: b
    text: 'Littéralement : « les bonnes choses » ou « les objets précieux » ; dans ce contexte, il s’agit probablement des objets sacrés du Temple.'
    reason: Signaler l’étendue sémantique du syriaque et éviter de présenter l’interprétation cultuelle comme absolument certaine.
  revision_rationale: Révision limitée à une correction syntaxique nécessaire au début, à deux ajustements de formulation moins interprétatifs, et au repositionnement cohérent de la note a. L’ellipse initiale, les agents angéliques et l’ambiguïté des objets cachés sont conservés.
