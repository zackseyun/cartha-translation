  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: fr
  text: 'Nous savions d’avance ce qui devait arriver : Nabuchodonosor, roi de Babylone, avait formé ce dessein dans son cœur…[a] Mais nous savions qu’aucun ordre sorti de sa bouche ne resterait sans effet et que rien ne se produirait autrement qu’il ne l’avait fixé d’avance. En effet, ce qui avait été décidé d’avance fut manifesté au grand jour. Il me fut aussi révélé que des anges intervenaient contre la ville : ils ébranlèrent ses murailles et les arrachèrent, et ils abattirent la puissante muraille avec ses solides angles de fer. Mais, à ce moment-là, ils cachèrent les objets sacrés[b], afin que les ennemis ne les voient pas.


    Après avoir accompli cela, ils livrèrent aux ennemis la muraille brisée, la maison dépouillée, le Temple incendié et le peuple vaincu que l’on emmenait. Ainsi, les ennemis ne pourraient pas se vanter en disant : « Nous avons même encerclé la maison du Très-Haut et nous l’avons renversée au combat. »


    Ils enchaînèrent aussi vos frères, les emmenèrent à Babylone et les y firent habiter. Mais nous, avec nos descendants, nous sommes restés ici, peu nombreux et faibles. Telle est la détresse du peuple au sujet de laquelle je vous ai écrit. Vous savez certainement combien l’abaissement de Sion a pesé sur vous : vous la connaissiez mieux que le reste du peuple, puisque c’était vous qui y assuriez le service, tandis que nous vous prêtions assistance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de la phrase est abrupt et le texte syriaque transmis ici est difficile ; la traduction conserve l’ellipse sans ajouter les mots proposés par certaines restitutions.
    reason: Préserver l’état fragmentaire et l’incertitude syntaxique du témoin syriaque fourni.
  - marker: b
    text: 'Littéralement : « les bonnes choses » ou « les objets précieux » ; dans ce contexte, il s’agit probablement des objets sacrés du Temple.'
    reason: Signaler l’étendue sémantique du syriaque et éviter de présenter l’interprétation cultuelle comme absolument certaine.
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: des anges
  rationale: Dans ce récit de jugement divin, ces agents agissent contre les murailles avant que la ville soit livrée aux ennemis ; « anges » conserve donc la portée céleste du terme sans réduire celui-ci à de simples messagers humains.
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: ses murailles … la puissante muraille
  rationale: « Murailles » désigne naturellement les défenses urbaines, tandis que « puissante » maintient l’intensification du second syntagme malgré l’état difficile du texte.
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: les objets sacrés
  rationale: Le sens littéral peut être plus général (« bonnes choses », « objets précieux »), mais le contexte immédiat de la ville sainte et du Temple favorise des objets cultuels ; une note préserve l’ambiguïté lexicale.
- source_word: ܐܫܠܡܘ
  choice: ils livrèrent
  rationale: Le verbe exprime la remise au pouvoir de l’ennemi. « Livrer » conserve à la fois la force narrative et l’idée que la prise n’est permise qu’après l’action antérieure des anges.
- source_word: ܚܘܪܐ
  choice: la maison dépouillée
  rationale: Le passage est textuellement difficile. « Dépouillée » convient à la série formée par la muraille éventrée, la maison pillée et le Temple incendié, sans préciser plus que le contexte.
- source_word: ܡܟܝܟ
  choice: l’abaissement
  rationale: Ce choix rend l’état de Sion humiliée et réduite à la faiblesse, dans un registre digne et courant.
theological_decisions:
- issue: L’agent véritable de la chute des défenses de la ville
  choice: Les anges agissent d’abord contre la ville, qui n’est livrée aux ennemis qu’ensuite.
  alternative: Attribuer la destruction aux seuls Babyloniens, ou comprendre les anges comme une simple métaphore.
  rationale: La séquence syriaque distingue explicitement l’action des anges de la remise ultérieure de la ville aux ennemis ; cette tension entre jugement céleste et action militaire humaine doit rester visible.
- issue: La nature et la fonction des objets cachés
  choice: Les objets sont présentés comme sacrés et cachés pour être soustraits au regard des ennemis.
  alternative: Y voir seulement des biens précieux dissimulés pour éviter leur pillage.
  rationale: Le contexte du Temple donne au syntagme une portée cultuelle probable, mais la note signale que l’expression syriaque demeure lexicalement plus large.
- issue: La vantardise interdite aux ennemis
  choice: Les ennemis ne doivent pas pouvoir prétendre avoir vaincu par leur propre force la maison du Très-Haut.
  alternative: Comprendre la phrase comme une simple remarque stratégique sur la prise de la ville.
  rationale: L’enchaînement entre l’action angélique, la livraison de la ville et la parole de vantardise donne au récit une portée théologique sans qu’il soit nécessaire d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement restructurées pour être intelligibles, mais l’ouverture fragmentaire a été conservée et signalée. « Temple » prend une majuscule lorsqu’il désigne le sanctuaire de Jérusalem ; « maison du Très-Haut » garde l’image du texte. Aucun complément absent du témoin fourni, tel que « monter contre la ville », n’a été introduit.
