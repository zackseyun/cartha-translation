translation:
  language: fr
  text: Ainsi, celui qui comprend sera alors sage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait syriaque fourni se termine à 27.10 et ne contient pas le texte de 28.1. La traduction de ce verset suit donc provisoirement la couche anglaise auditée.
    reason: Signaler avec transparence que le témoin original fourni ne permet pas de contrôler directement ce verset.
lexical_decisions:
- source_word: '[texte syriaque de 28.1 non présent dans l’extrait fourni]'
  choice: celui qui comprend
  rationale: L’extrait syriaque transmis s’arrête à l’énumération de 27.10 et ne permet donc pas de vérifier directement le lexème. La formulation suit prudemment la couche de consultation anglaise auditée, sans reconstruire un original absent.
- source_word: '[texte syriaque de 28.1 non présent dans l’extrait fourni]'
  choice: sera alors sage
  rationale: Cette formulation française conserve le caractère prédictif et le lien temporel de la couche anglaise (« shall then be wise »), tout en restant simple et digne.
theological_decisions:
- issue: 'Valeur de « sage » : état, conduite ou acquisition de sagesse'
  choice: sera alors sage
  alternative: agira alors avec sagesse
  rationale: La formulation retenue ne transforme pas l’énoncé en prescription morale et préserve l’ambiguïté entre qualité personnelle et conduite avisée.
translation_notes:
  register: Français international moderne, sobre et sentencieux. « Ainsi » rend naturellement la relation logique; « sera alors sage » conserve sans amplification la brièveté de l’énoncé consulté.
