base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/026/001.yaml
  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: fr
  text: 'Je répondis : « Cette détresse-là, qui doit venir, durera-t-elle longtemps, et cette nécessité s’étendra-t-elle sur de nombreuses années ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܠܨܢܐ
  choice: détresse
  rationale: Le terme désigne une pression accablante, une affliction ou une tribulation. « Détresse » est naturel en français moderne et convient au contexte apocalyptique sans coloration confessionnelle particulière.
- source_word: ܗܘ̇ ܕܐܬܝ̇
  choice: cette détresse-là, qui doit venir
  rationale: Le démonstratif distal est rendu par « -là », tandis que la proposition relative conserve explicitement le caractère futur de la détresse annoncée.
- source_word: ܡܐ ܣܓܝܐܐ
  choice: longtemps
  rationale: La tournure interrogative porte sur la durée. « Longtemps » en donne une expression française claire et idiomatique.
- source_word: expression rendue par l’anglais de contrôle « this necessity »
  choice: cette épreuve inévitable
  rationale: « Nécessité » serait ici un calque obscur. « Épreuve inévitable » conserve l’idée d’une contrainte ou détresse qui doit survenir, tout en restant compréhensible.
theological_decisions:
- issue: Nature et durée de la détresse annoncée
  choice: Conserver deux questions ouvertes, sans préciser l’auteur, la finalité ni l’étendue exacte de l’épreuve.
  alternative: Interpréter explicitement la détresse comme un jugement divin ou comme la tribulation finale.
  rationale: Le verset interroge sa durée sans résoudre ici son statut théologique précis; l’expliciter dépasserait le texte.
translation_notes:
  register: Français international moderne, sobre et solennel. Le passé simple convient au récit littéraire. Deux interrogations successives évitent une phrase trop lourde et rendent clairement le parallélisme de durée.
