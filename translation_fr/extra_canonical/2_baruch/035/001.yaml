    issue: « des réservoirs d’eau »
    rationale: Cette expression transforme les paupières en un objet ou dispositif de stockage. Elle contredit la décision lexicale du dossier, étayée par la tradition de contrôle, qui retient le sens anatomique « paupières » pour ܐܡܘ̈ܬܐ.
  - severity: low
    issue: « trouver du repos au sujet de Sion »
    rationale: « Au sujet de » peut évoquer le thème d’un discours. Avec ܥܠ, dans le cadre de la lamentation, « à cause de Sion » exprime plus naturellement en français le chagrin qui empêche Baruch de trouver le repos.
