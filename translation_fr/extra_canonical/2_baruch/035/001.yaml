  source_fidelity: 'La traduction suit bien la séquence syriaque et conserve les éléments essentiels : la porte sainte, la posture d’abaissement, la lamentation sur Sion/Jérusalem, le peuple nourri par Baruch, sa grandeur passée « en vision » et son ébranlement. Toutefois, « réservoirs d’eau » ne rend pas le terme anatomique ܐܡܘ̈ܬܐ, que le dossier lexical identifie comme « paupières ».'
  naturalness: Le français est globalement naturel, sobre et adapté à une lamentation poétique. « À cause de Sion » est plus idiomatique et plus précis que « au sujet de Sion » pour exprimer le motif du repos impossible. La révision de l’image des paupières maintient une formulation poétique lisible.
  terminology: « Porte sainte », « humblement », « sources », « repos », « Sion » et « Jérusalem » conviennent. La note conserve correctement l’incertitude textuelle autour de ܐܒܠܐ sans présenter l’émendation « Jérusalem » comme certaine.
  issues:
