  to: 'Moi, Baruch, j’allai jusqu’à la porte sainte. Je m’assis humblement, puis je pleurai et dis :


    « Ô mes yeux, devenez des sources,

    et vous, mes paupières, des sources d’eau,

    des fontaines de larmes !


    Car comment pourrais-je trouver du repos à cause de Sion ?

    Et comment pourrais-je pleurer Jérusalem[a] ?


    Car le peuple que je nourrissais,

    et qui autrefois me surpassait en vision,

    a été secoué d’un tremblement. »'
  rationale: La seule correction substantielle remplace « réservoirs d’eau » par « mes paupières », conformément au sens anatomique retenu pour le syriaque. Les « sources d’eau » et les « fontaines de larmes » rendent l’image liquide et poétique sans introduire un dispositif absent du texte. « À cause de Sion » améliore la portée lamentative de la préposition sans modifier le sens. La note est maintenue afin de préserver l’ambiguïté de la leçon contestée.
