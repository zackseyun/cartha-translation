base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: fr
  text: 'Moi, Baruch, j’allai jusqu’à la porte sainte. Je m’assis humblement, puis je pleurai et dis :


    « Ô mes yeux, devenez des sources,

    et vous, mes paupières, des sources d’eau,

    des fontaines de larmes !


    Car comment pourrais-je trouver du repos à cause de Sion ?

    Et comment pourrais-je pleurer Jérusalem[a] ?


    Car le peuple que je nourrissais,

    et qui autrefois me surpassait en vision,

    a été secoué d’un tremblement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible du texte incertain : « Et comment pourrais-je pleurer le deuil et trouver [du repos] ? »'
    reason: La leçon syriaque transmise à cet endroit est instable. « Jérusalem » repose sur le parallélisme avec Sion, tandis qu’une lecture plus littérale donne « deuil ».
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: la porte sainte
  rationale: Le nom syriaque désigne normalement une porte. Cette traduction conserve l’image concrète du lieu sacré sans la généraliser en « lieu saint ».
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: humblement
  rationale: L’adverbe exprime l’abaissement ou l’humilité. « Humblement » est naturel en français moderne et convient à la posture de lamentation.
- source_word: ܡܒܘ̈ܥܐ
  choice: des sources
  rationale: Le pluriel syriaque évoque des eaux jaillissantes. « Sources » garde la force poétique de l’image.
- source_word: ܐܡܘ̈ܬܐ
  choice: mes paupières
  rationale: La tradition de contrôle appuie ici le sens anatomique « paupières ». Le possessif, implicite dans l’apostrophe, rend l’image intelligible en français.
- source_word: ܐܬܬܢܝܚ
  choice: trouver du repos
  rationale: Le verbe peut évoquer le repos, le soulagement ou la consolation. « Trouver du repos » préserve cette amplitude sans réduire le propos à la seule consolation.
- source_word: ܐܒܠܐ
  choice: Jérusalem
  rationale: La leçon visible est textuellement instable et pourrait signifier « deuil ». La restitution « Jérusalem » produit le parallélisme attendu avec Sion, mais l’incertitude est signalée en note.
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  choice: a été secoué d’un tremblement
  rationale: La formulation conserve la répétition étymologique du syriaque et l’intensité du bouleversement subi.
- source_word: ܪܒܝ ܠܝܐ ܚܙܘܐ
  choice: me surpassait en vision
  rationale: Le texte transmis est difficile, mais cette formulation suit la lecture de contrôle « plus grand que moi en vision » tout en donnant un français compréhensible.
theological_decisions:
- issue: Identification de l’objet du second membre de la lamentation
  choice: Jérusalem, en parallèle avec Sion
  alternative: 'le deuil : « comment pourrais-je pleurer le deuil et trouver [du repos] ? »'
  rationale: Le parallélisme Sion/Jérusalem est plausible dans une lamentation sur la ville détruite, mais la formulation syriaque conservée demeure incertaine ; la variante est donc explicitement donnée en note.
- issue: Sens de la supériorité passée du peuple
  choice: une supériorité « en vision », sans explication doctrinale ajoutée
  alternative: une grandeur générale, spirituelle ou cultuelle
  rationale: Le texte associe explicitement la grandeur à la vision. La traduction garde cette expression difficile au lieu de préciser de manière conjecturale la nature de cette vision.
translation_notes:
  register: Français international moderne, sobre et poétique. Les reprises et les images corporelles de la lamentation sont maintenues. La syntaxe est légèrement réorganisée pour être naturelle en français, sans ajouter les détails cultuels qui appartiennent à la suite du chapitre plutôt qu’à ce verset.
