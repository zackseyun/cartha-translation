  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: fr
  text: 'Et je répondis : « Celui qui a reçu de la lumière est capable de la connaître. Mais les nombreux ont reçu des ténèbres d’Adam et ne se sont pas réjouis de la lumière de Moïse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: a reçu
  rationale: 'Le verbe demeure concret et assez large : il évoque ce qui est tiré ou reçu de la lumière ou des ténèbres, sans préciser davantage le mode de transmission.'
- source_word: ܢܘܗܪܐ
  choice: lumière
  rationale: « Lumière » conserve directement l’image apocalyptique de révélation et son opposition aux ténèbres.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: les ténèbres d’Adam
  rationale: Le génitif personnel est conservé afin de ne pas réduire l’expression à de simples ténèbres humaines ou à l’ignorance en général.
- source_word: ܐܬܒܣܡܘ (lecture corrigée de l’OCR ܐܬܒܣܣܘ)
  choice: ne s’est pas réjouie
  rationale: La lecture textuelle corrigée soutient le sens « se réjouir », préférable ici à « être établi », qui suit vraisemblablement une corruption de l’OCR.
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: la lumière de Moïse
  rationale: La formulation garde la référence explicite à Moïse sans la remplacer interprétativement par « la Loi ».
theological_decisions:
- issue: Contraste entre les ténèbres d’Adam et la lumière de Moïse
  choice: Conserver les deux figures nommées et le contraste historique et moral qu’elles structurent.
  alternative: Comprendre l’expression comme une simple opposition générale entre ignorance et instruction.
  rationale: Le syriaque rattache expressément les ténèbres à Adam et la lumière à Moïse ; la traduction ne doit ni effacer ni systématiser davantage cette tension.
- issue: Rôle de Moïse à l’égard de la lumière
  choice: Présenter la lumière comme associée à Moïse, sans faire de lui sa source indépendante.
  alternative: Paraphraser « la lumière transmise par Moïse » ou « la Loi de Moïse ».
  rationale: « La lumière de Moïse » respecte la forme du génitif et laisse ouverte la nature exacte de cette relation.
- issue: Personne grammaticale dans la première proposition
  choice: 'Employer la troisième personne générale : « Celui qui… »'
  alternative: 'Employer la deuxième personne : « Toi qui as reçu… »'
  rationale: La leçon contrôlée corrige les formes de deuxième personne produites par l’OCR et indique une affirmation générale à la troisième personne.
translation_notes:
  register: Français international moderne, digne et lisible. « La multitude des êtres humains » rend naturellement l’idée des nombreux qui existent sans suggérer une entité abstraite ; le singulier collectif permet ensuite « a reçu » et « ne s’est pas réjouie ». Aucun marqueur de note n’est nécessaire.
