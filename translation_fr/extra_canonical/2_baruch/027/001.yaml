  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: fr
  text: 'Je répondis et lui dis : « Après cela, ce temps est divisé en douze périodes[a], et chacune d’elles est connue par ce qui lui est assigné. Dans la première période : le commencement des bouleversements. Dans la deuxième : le meurtre des grands. Dans la troisième : la chute d’un grand nombre. Dans la quatrième : l’envoi de l’épée. Dans la cinquième : la famine. Dans la sixième : les tremblements de terre. Dans la septième : les terreurs et les fléaux. Dans la huitième : les assauts des esprits et des démons d’apparitions[b]. Dans la neuvième : la chute du feu. Dans la dixième : le pillage et une grande oppression. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le numéral du texte syriaque reproduit est incertain et paraît pouvoir se lire « trente », mais l’énumération et les témoins de contrôle appuient « douze périodes ».
    reason: Transparence sur une difficulté textuelle réelle dans le témoin syriaque fourni.
  - marker: b
    text: 'Expression difficile. Le dernier terme signifie littéralement « formes », « visages » ou « apparitions »; son rapport syntaxique avec « démons » n’est pas certain. On peut aussi comprendre : « les assauts des esprits et des démons, et des apparitions ».'
    reason: Préserver l’ambiguïté syntaxique et lexicale de la huitième calamité sans imposer que les démons « prennent diverses formes ».
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: est divisé en douze périodes
  rationale: Le numéral du témoin reproduit est instable, mais l’énumération ordonnée et la tradition de contrôle appuient fortement un schéma en douze parties. « Périodes » rend naturellement le caractère temporel de ܙܒܢܝ̈ܢ.
- source_word: ܡܬܬܝܕܥܐ
  choice: est connue
  rationale: Cette traduction conserve le sens littéral et l’ambiguïté entre ce qui caractérise chaque période et ce qui y est manifesté, tandis que la proposition suivante exprime l’assignation.
- source_word: ܙ̈ܘܥܐ
  choice: bouleversements
  rationale: Le premier emploi paraît plus large que les tremblements de terre explicitement nommés dans la sixième période; ce choix maintient la distinction.
- source_word: ܪ̈ܘܪܒܢܐ
  choice: les grands
  rationale: Le terme désigne des personnages importants ou puissants sans préciser leur statut; « les grands » préserve cette ampleur apocalyptique.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: l’envoi de l’épée
  rationale: Cette formulation garde l’image active d’une épée envoyée, plutôt que de la réduire à la guerre en général.
- source_word: ܬܗܪ̈ܐ
  choice: terreurs
  rationale: Dans cette liste de calamités, le terme évoque une stupeur effrayante; « terreurs » est clair et digne.
- source_word: ܡܚܘ̈ܬܐ
  choice: fléaux
  rationale: « Fléaux » conserve à la fois l’idée de coups et celle de calamités collectives.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: les assauts des esprits
  rationale: La locution est difficile; dans ce catalogue apocalyptique, elle suggère une activité spirituelle hostile. « Assauts » signale cette force sans préciser davantage sa nature.
- source_word: ܫ̈ܐܕܐ ܕܦܪ̈ܨܘܦܐ
  choice: des démons prenant diverses formes
  rationale: ܫ̈ܐܕܐ désigne clairement des démons, tandis que ܦܪ̈ܨܘܦܐ peut évoquer visages, aspects ou formes. Cette formulation française reste intelligible tout en signalant l’incertitude en note.
- source_word: ܚܛܘܦܝܐ
  choice: le pillage
  rationale: Le mot désigne une prise violente; « pillage » est naturel et précis dans une liste de calamités.
- source_word: ܐܢܘܣܝܐ
  choice: oppression
  rationale: Le terme exprime la contrainte ou la violence imposée; « oppression » convient au registre prophétique et laisse ouverte la forme exacte de cette coercition.
theological_decisions:
- issue: Schéma numérique des malheurs
  choice: douze périodes
  alternative: trente temps ou périodes, d’après la lecture apparente du texte reproduit
  rationale: Le numéral visible est textuellement instable, tandis que la suite structurée et les témoins de contrôle soutiennent fortement douze. Une note rend le problème transparent.
- issue: Entités surnaturelles de la huitième période
  choice: conserver les esprits et les démons comme entités du discours visionnaire
  alternative: interpréter ces expressions comme des terreurs psychologiques ou des désastres purement naturels
  rationale: Le syriaque nomme explicitement des esprits et des démons; les naturaliser supprimerait la texture surnaturelle du passage.
- issue: Rapport entre les démons et les « formes/visages »
  choice: des démons prenant diverses formes
  alternative: 'des démons d’apparitions; ou trois groupes coordonnés: esprits, démons et apparitions'
  rationale: La syntaxe et le sens précis de ܦܪ̈ܨܘܦܐ sont difficiles. Le texte principal adopte une lecture française cohérente, et la note conserve les principales possibilités sans imposer une doctrine.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition « Dans la… » garde la structure liturgique et apocalyptique de l’énumération. Les termes concrets du syriaque sont conservés sans naturalisation ni surcharge confessionnelle.
