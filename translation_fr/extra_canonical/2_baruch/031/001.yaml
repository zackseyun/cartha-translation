base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/031/001.yaml
  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: fr
  text: 'Après cela, je me rendis auprès du peuple et lui dis : « Rassemblez auprès de moi vos anciens et vos enfants, et je leur adresserai mes paroles[a]. »


    Ils se rassemblèrent tous dans la vallée du Cédron.


    Alors, je les interrogeai et leur dis :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne syriaque transmise ici est textuellement difficile. Une lecture appuyée par la tradition donne : « et je leur adresserai mes paroles »; le texte de la page fournie pourrait se lire littéralement : « et il dit : Cherchez mes paroles ».'
    reason: Signaler honnêtement une difficulté de transmission à la limite de page et expliquer le choix retenu sans présenter une correction comme certaine.
lexical_decisions:
- source_word: ܗܘܘ ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Après cela
  rationale: Cette formule française restitue naturellement la transition narrative syriaque sans l’alourdir par un calque de « il arriva après ces choses ».
- source_word: ܟܢܫܘ ܠܝ
  choice: Rassemblez auprès de moi
  rationale: L’impératif et le complément indiquant le rassemblement autour du locuteur sont tous deux conservés.
- source_word: ܣܒܝܟܘܢ ܘܒܢܝ̈ܟܘܢ
  choice: vos anciens et vos enfants
  rationale: Le rendu garde les deux groupes explicitement nommés et comprend « anciens » au sens des membres âgés ou responsables du peuple, sans réduire le second terme à de simples descendants.
- source_word: ܡܠܝ
  choice: mes paroles
  rationale: Le suffixe possessif de première personne est explicitement rendu.
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: dans la vallée du Cédron
  rationale: « Cédron » est la forme française biblique courante du toponyme, et « vallée » exprime le nom géographique syriaque.
- source_word: ܘܒܥܝܬ ܘܐܡܪܬ ܠܗܘܢ
  choice: Alors, je les interrogeai et leur dis
  rationale: Le rendu maintient les deux verbes du syriaque et laisse la phrase ouverte sur le discours qui suit.
theological_decisions:
- issue: Identité des anciens et des enfants convoqués
  choice: Conserver « vos anciens et vos enfants » comme deux groupes distincts
  alternative: Généraliser en « tout le peuple » ou comprendre « enfants » comme « descendants »
  rationale: Le texte nomme expressément les deux groupes; les conserver évite d’effacer la portée communautaire et intergénérationnelle de la convocation.
translation_notes:
  register: Français international moderne, narratif et digne. « Après cela » évite un sémitisme pesant; « anciens », « vallée du Cédron » et « mes paroles » préservent toutefois la couleur biblique. La ponctuation finale introduit le discours du verset suivant.
