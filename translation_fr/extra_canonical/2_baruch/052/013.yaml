review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images essentielles sont bien rendues : le temps ne pèsera plus sur les justes, les étendues du paradis leur seront présentées, ils verront les êtres vivants et les groupes angéliques. Toutefois, « par mon autorité » introduit une première personne possessive qui n’est pas exprimée par le syriaque fourni à cet endroit. Une formulation non agentive rend plus sûrement le sens de retenue ou de contrainte. « Seront déployées devant eux » reproduit aussi plus exactement l’image des étendues du paradis que « s’ouvriront ».'
  naturalness: La révision garde un français international moderne et un rythme visionnaire clair. « Retenues sous contrainte » et « maintenues, sur ordre » sont naturels sans attribuer indûment l’action à un locuteur. Le maintien de « au-dessous de lui » est acceptable, puisque la note explique l’antécédent incertain.
  terminology: « Paradis », « êtres vivants » et « anges » conviennent. « Troupes d’anges » rend sans technicisme excessif les compagnies angéliques. La note finale doit expliciter plus précisément l’obscurité du mot syriaque transmis, afin de ne pas présenter « venue fixée » comme assurée.
  issues:
  - severity: medium
    issue: Ajout de « mon » dans « retenues par mon autorité »
    rationale: Le passage syriaque fourni exprime une retenue ou domination, mais ne porte pas ici de possessif de première personne correspondant à « mon ». L’ajout est donc interprétatif et doit être évité.
  - severity: low
    issue: « S’ouvriront » affaiblit l’image spatiale de présentation ou de déploiement
    rationale: Le syriaque décrit les étendues du paradis comme placées ou déployées devant eux. « Seront déployées devant eux » est à la fois plus proche et idiomatique.
  - severity: medium
    issue: La note sur la dernière expression ne décrit pas suffisamment la difficulté du texte transmis
    rationale: La forme syriaque conservée se lit littéralement comme « jusqu’à ce que vienne leur ville », ce qui est difficile dans le contexte. Une note explicite justifie la traduction contextuelle « leur venue » sans masquer l’incertitude.
  revised_text: Et ce temps ne les accablera plus. Car devant eux seront déployées les étendues du paradis ; on leur montrera la beauté majestueuse des êtres vivants qui se trouvent au-dessous de lui[a], ainsi que toutes les troupes d’anges qui sont maintenant retenues sous contrainte afin de ne pas être vues, et maintenues, sur ordre, à leur place jusqu’à leur venue[b].
  revised_footnotes:
  - marker: a
    text: Le référent du pronom n’est pas explicite dans le texte syriaque conservé ; certaines traductions comprennent « sous le trône ».
    reason: Préserver l’ambiguïté du pronom syriaque sans ajouter « le trône » au texte.
  - marker: b
    text: 'La leçon syriaque transmise se lit littéralement : « jusqu’à ce que vienne leur ville » ; son sens est difficile dans ce contexte. « Leur venue » suit une compréhension contextuelle, sans lever entièrement l’incertitude.'
    reason: Signaler précisément la difficulté textuelle et la nature interprétative de la traduction contextuelle.
  revision_rationale: La révision retire l’attribution non explicite à « mon autorité », rend plus directement le déploiement des étendues du paradis, et conserve les deux ambiguïtés textuelles importantes par des notes ciblées. Elle reste conforme à la couche anglaise dans le mouvement général, tout en donnant priorité au syriaque fourni lorsque celui-ci ne soutient pas son ajout de première personne.
