base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: fr
  text: Et le temps ne les accablera plus. Devant eux s’ouvriront en effet les étendues du paradis[a] ; on leur montrera la beauté majestueuse des êtres vivants qui se trouvent au-dessous de lui[b], ainsi que toutes les troupes d’anges qui sont maintenant retenues par mon autorité, afin de ne pas être vues, et maintenues par ordre à leur place jusqu’à leur venue fixée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seront disposées devant eux les étendues du paradis ».'
    reason: Signaler la construction plus formelle du syriaque derrière la tournure française naturelle « s’ouvriront ».
  - marker: b
    text: 'Littéralement : « qui sont au-dessous de lui ». Le référent du pronom n’est pas explicite dans le texte syriaque conservé ; certaines traductions comprennent « sous le trône ».'
    reason: Préserver une ambiguïté textuelle que la couche anglaise résout en ajoutant « le trône ».
  - marker: c
    text: La dernière expression syriaque est difficile ; elle peut désigner leur venue ou le moment qui leur est assigné.
    reason: Rendre transparente l’incertitude lexicale de la forme transmise sans imposer une solution unique.
lexical_decisions:
- source_word: ܢܥܘܩ
  choice: accablera
  rationale: Le verbe exprime l’idée d’opprimer ou de causer de la détresse. « Accabler » donne ici un français naturel sans réduire le sens au seul vieillissement.
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: les étendues du paradis
  rationale: Le substantif désigne des espaces ouverts ou étendus. « Étendues » conserve l’image spatiale du syriaque.
- source_word: ܚܝ̈ܐ
  choice: êtres vivants
  rationale: Le pluriel peut désigner des vivants ou des êtres vivants. Dans ce contexte visionnaire, cette formulation préserve la référence possible à des êtres célestes sans la préciser davantage.
- source_word: ܒܡܫܠܛܘ
  choice: par mon autorité
  rationale: Le terme relève de l’autorité, de la domination ou du pouvoir exercé. Ce choix suit directement le syriaque plutôt que la formulation « par ma parole » de la couche anglaise.
- source_word: ܕܡܠܐܟ̈ܐ
  choice: d’anges
  rationale: Équivalent français direct du terme syriaque pour les anges ou messagers, le contexte céleste favorisant « anges ».
- source_word: ܡܕܝܢܬܗܘܢ
  choice: leur venue fixée
  rationale: La forme transmise est difficile dans ce contexte. La traduction retient le sens contextuel d’une échéance ou venue assignée, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Identité des « êtres vivants »
  choice: Ne pas les identifier davantage
  alternative: Les identifier explicitement comme des créatures angéliques ou des chérubins
  rationale: Le texte les appelle seulement « vivants/êtres vivants »; une identification plus précise importerait une interprétation théologique.
- issue: Agent qui retient les anges
  choice: « mon autorité »
  alternative: « ma parole »
  rationale: Le lexème syriaque disponible renvoie plus directement à l’autorité ou à la domination. La première personne est conservée sans expliciter davantage le locuteur.
- issue: Référent de « au-dessous de lui »
  choice: Conserver le pronom ambigu
  alternative: Ajouter « du trône » comme dans la couche anglaise
  rationale: Le mot « trône » n’apparaît pas explicitement dans le texte syriaque fourni. Le pronom préserve l’ambiguïté réelle du témoin.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement visionnaire du syriaque, avec des formulations concrètes et sans vocabulaire confessionnel spécialisé. Les ambiguïtés portant sur le pronom et l’échéance angélique sont maintenues ou signalées.
