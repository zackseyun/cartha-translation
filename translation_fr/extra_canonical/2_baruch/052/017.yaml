  source_fidelity: La première interrogation, ܒܡܢܐ (« par quoi ? / par quel moyen ? »), ne signifie pas naturellement « contre quoi ». La seconde porte sur ce contre quoi ou ce pour quoi l’âme a été échangée; « en échange de quoi » rend explicitement et idiomatiquement la relation d’échange sans en préciser indûment l’objet.
  naturalness: « Contre quoi » est peu naturel avec « perdre sa vie » et donne une nuance adversative absente ou, au mieux, non nécessaire. Le parallélisme interrogatif est plus clair en français avec « Par quoi donc » puis « en échange de quoi ».
  terminology: La distinction entre « vie » et « âme » est conservée, conformément au contraste du texte et à l’audit anglais. « Êtres humains » est remplacé par « humains », plus fluide dans ce contexte sans changement de référent.
  issues:
  - severity: medium
    issue: « Contre quoi » traduit les deux interrogations.
    rationale: Dans le premier membre, la préposition syriaque ܒ- introduit le moyen (« par quoi »), non une opposition. Dans le second, la formulation française doit exprimer la valeur d’échange (« en échange de quoi »).
