  text: By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?
translation:
  language: fr
  text: Par quoi donc les humains ont-ils perdu leur vie, et en échange de quoi ceux qui étaient sur la terre ont-ils échangé leur âme ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: contre quoi
  rationale: Dans le contexte d’une perte et d’un échange, cette formulation française rend naturellement la valeur interrogative de « pour quoi / en échange de quoi ».
- source_word: ܗܟܝܠ
  choice: dès lors
  rationale: Rend la particule inférentielle tout en conservant le mouvement argumentatif du passage.
- source_word: ܐܘܒܕܘ ܚܝܝ̈ܗܘܢ
  choice: ont-ils perdu leur vie
  rationale: Le verbe peut exprimer le fait de faire périr ou de perdre ; la tournure française retenue correspond ici à l’interrogation sur ce qui a été sacrifié.
- source_word: ܢܦܫܗܘܢ
  choice: leur âme
  rationale: Le terme syriaque attendu dans la suite textuelle peut désigner la vie, la personne ou l’âme ; « âme » préserve ici le contraste lexical avec « vie ».
theological_decisions:
- issue: Rapport entre « vie » et « âme »
  choice: Maintenir deux termes distincts
  alternative: Employer « vie » dans les deux membres
  rationale: La distinction lexicale du verset et sa tension anthropologique ne doivent pas être harmonisées artificiellement.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique est conservée, avec une syntaxe claire et un parallélisme proche de la formulation source.
