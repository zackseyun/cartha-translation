  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: fr
  text: Car ils ont été délivrés de ce monde de détresse et ont déposé le fardeau de leurs afflictions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: ont été délivrés
  rationale: Le passif syriaque exprime le fait d’être libéré ou sauvé; «ont été délivrés» conserve cette forme sans préciser explicitement l’agent.
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ
  choice: ce monde de détresse
  rationale: ܐܘܠܨܢܐ désigne la détresse, l’épreuve ou l’oppression; «détresse» convient au contexte et reste naturel en français.
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ
  choice: ont déposé
  rationale: L’expression signifie littéralement qu’ils ont ôté d’eux-mêmes ou laissé reposer quelque chose; «ont déposé» rend clairement l’image du fardeau abandonné.
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ
  choice: le fardeau de leurs afflictions
  rationale: ܛܘܥܢܐ est une charge portée, et ܥܩ̈ܬܐ désigne des détresses ou afflictions; le possessif explicite naturellement en français que ces afflictions pesaient sur eux.
theological_decisions:
- issue: Agent de la délivrance
  choice: Maintenir le passif «ont été délivrés» sans nommer l’agent.
  alternative: Traduire «Dieu les a délivrés».
  rationale: Le texte syriaque n’explicite pas ici l’agent; la traduction préserve cette retenue et n’ajoute pas une précision théologique.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore du fardeau est conservée, ainsi que le parallélisme entre la délivrance du monde présent et l’abandon des afflictions.
