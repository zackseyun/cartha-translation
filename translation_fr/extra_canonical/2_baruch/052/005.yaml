  text: For the appearance of those who now act wickedly will become worse than it is now, as they suffer torment.
translation:
  language: fr
  text: Car l’apparence de ceux qui font maintenant le mal deviendra pire qu’elle ne l’est aujourd’hui, alors qu’ils subiront le tourment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: l’apparence
  rationale: Le terme désigne ici l’aspect ou la forme visible des personnes; « apparence » conserve cette portée sans préciser indûment qu’il s’agit seulement du visage.
- source_word: ܒܝܫ
  choice: pire
  rationale: Le comparatif introduit par ܡܢ appelle naturellement « pire que » dans ce contexte de détérioration de l’aspect.
- source_word: ܬܫܢܝܩܐ
  choice: le tourment
  rationale: Le mot syriaque exprime une souffrance punitive ou un supplice; « tourment » garde la force du terme et son indétermination.
theological_decisions:
- issue: Nature et moment du tourment
  choice: « lorsqu’ils subiront le tourment »
  alternative: « parce qu’ils subiront le tourment »
  rationale: La formulation temporelle préserve le lien entre la transformation de leur apparence et l’expérience du tourment, sans imposer une explication causale plus précise que le texte.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’image concrète de l’apparence devenue pire ainsi que l’indétermination du « tourment ».
