base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: fr
  text: Car ils ont choisi pour eux-mêmes le temps présent, qui ne peut se dérouler sans détresse, et ils ont choisi pour eux-mêmes ce temps dont les issues sont faites de gémissements et de maux. Ils ont rejeté le monde qui ne fait pas vieillir ceux qui y entrent[a], et ils ont rejeté le temps de la gloire, afin de ne pas parvenir à l’honneur dont je t’ai parlé auparavant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture : « le monde qui ne vieillit pas pour ceux qui y entrent ».'
    reason: Conserve l’alternative de l’ancien rendu signalée dans la piste d’audit anglaise, tout en laissant le texte principal refléter la construction transitive syriaque.
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: temps
  rationale: Le terme syriaque désigne ici une période ou une époque; «temps» conserve le contraste entre le présent et le temps de la gloire.
- source_word: ܥܠܡܐ
  choice: monde
  rationale: «Monde» rend naturellement le syriaque tout en conservant sa portée eschatologique possible sans la préciser davantage.
- source_word: forme pael de ܣܐܒ
  choice: ne fait pas vieillir
  rationale: La forme causative/transitive signifie que ce monde n’inflige pas le vieillissement à ceux qui y entrent, plutôt que de simplement ne pas vieillir lui-même.
- source_word: ܐܝܩܪܐ
  choice: honneur
  rationale: «Honneur» rend le sens premier et maintient sa distinction avec le «temps de la gloire».
theological_decisions:
- issue: Effet du monde à venir sur ceux qui y entrent
  choice: «ne fait pas vieillir ceux qui y entrent»
  alternative: «ne vieillit pas pour ceux qui y entrent»
  rationale: La construction syriaque est transitive et présente ce monde comme n’entraînant pas le vieillissement de ses habitants; la traduction n’explicite toutefois aucun mécanisme doctrinal.
- issue: Lien entre le refus humain et la privation de l’honneur futur
  choice: «afin de ne pas parvenir à l’honneur»
  alternative: «de sorte qu’ils ne parviennent pas à l’honneur»
  rationale: La formulation conserve la force finale du passage et sa tension rhétorique, sans déterminer davantage la psychologie des personnes évoquées.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions de « ils ont choisi pour eux-mêmes » et « ils ont rejeté » sont conservées pour respecter le parallélisme rhétorique du texte.
