  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: fr
  text: Et il arrivera que, lorsque ceux qui se connaissent maintenant se reconnaîtront les uns les autres, l’apparence de ceux qui sont maintenant condamnés deviendra plus effrayante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܢܗܘܐ
  choice: Et voici ce qui arrivera
  rationale: Rend naturellement en français la formule introductive annonçant un événement futur.
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  choice: se reconnaîtront les uns les autres
  rationale: Exprime la reconnaissance mutuelle indiquée par la tournure syriaque, sans la réduire à une simple connaissance abstraite.
- source_word: ܐܝܠܝܢ ܕܗܫܐ ܝܕܥܝܢ
  choice: ceux qui se connaissent maintenant
  rationale: Conserve le contraste temporel entre les relations présentes et la reconnaissance future.
- source_word: ܚܙܘܗ
  choice: l’apparence
  rationale: Correspond au sens visuel de la forme syriaque et préserve la distinction entre la personne et son aspect manifeste.
theological_decisions:
- issue: Condition de ceux dont l’apparence devient effrayante
  choice: ceux qui sont à présent condamnés
  alternative: ceux qui sont à présent jugés
  rationale: « Condamnés » suit la couche de consultation auditée et exprime l’issue défavorable du jugement sans ajouter l’identité du juge ni préciser la nature de la peine.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la répétition sémantiquement importante entre le fait de se connaître maintenant et celui de se reconnaître à venir, tout en adoptant une syntaxe française fluide.
