  text: But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—
translation:
  language: fr
  text: Mais ceux qui ont rejeté mes lois, qui se sont bouché les oreilles pour ne pas entendre la sagesse et ne pas recevoir l’intelligence, seront particulièrement ébranlés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: seront alors plongés dans un trouble
  rationale: Le verbe exprime le fait d’être ébranlé, agité ou troublé. Cette formulation française garde la force du passif sans préciser indûment s’il s’agit de confusion, d’effroi ou de bouleversement.
- source_word: ܕܐܣܠܝܘ
  choice: qui ont rejeté
  rationale: Le verbe signifie mépriser, tenir pour vil ou rejeter. « Rejeté » est naturel ici et rend clairement leur attitude envers la loi.
- source_word: ܢܡܘܣܝ̈
  choice: ma loi
  rationale: La forme syriaque porte vraisemblablement le suffixe de première personne singulier, « mes lois ». Dans ce contexte, le singulier collectif « ma loi » est idiomatique en français et correspond à la tradition sapientielle du passage.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: se sont bouché les oreilles
  rationale: L’expression concrète du syriaque est conservée dans un français courant et expressif.
- source_word: ܣܘܟܠܐ
  choice: l’intelligence
  rationale: Le terme désigne la compréhension, le discernement ou l’intelligence. « Intelligence » préserve ici son sens sapientiel.
theological_decisions:
- issue: Nature du trouble eschatologique
  choice: traduction générale par « plongés dans un trouble »
  alternative: « seront confondus » ou « seront terrifiés »
  rationale: Le contexte évoque le jugement, mais le verbe ne contraint pas à choisir entre honte, confusion et effroi. La traduction conserve cette amplitude.
- issue: Nombre de « loi(s) »
  choice: « ma loi » au singulier collectif
  alternative: « mes lois »
  rationale: Le suffixe personnel est conservé, tandis que le singulier français désigne naturellement l’ensemble de la révélation normative sans introduire une distinction théologique supplémentaire.
translation_notes:
  register: Français moderne, digne et accessible. La phrase a été réordonnée pour placer le sujet avant le verdict, conformément à l’usage naturel du français, tout en conservant la progression causale du syriaque.
