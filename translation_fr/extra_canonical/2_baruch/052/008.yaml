  source_fidelity: 'Le sens général est bien rendu : le verset vise ceux qui ont rejeté les lois, fermé leurs oreilles à la sagesse et refusé le discernement, et annonce qu’ils seront fortement ébranlés. Toutefois, « ma loi » réduit un pluriel syriaque explicite (« mes lois »), tandis que « alors » et « plongés dans un trouble bien plus grand » ajoutent respectivement une précision temporelle et comparative qui ne sont pas requises par le texte. « Ébranlés » rend plus directement le passif de ܢܬܬܙܝܥܘܢ tout en gardant son amplitude sémantique.'
  naturalness: La phrase proposée est naturelle, mais la formulation révisée est plus resserrée et suit plus directement l’organisation du syriaque. « Entendre la sagesse » convient mieux que « écouter la sagesse » pour reproduire l’expression idiomatique « fermer/boucher les oreilles afin de ne pas entendre ».
  terminology: « Mes lois » conserve le pluriel et le suffixe possessif de première personne du syriaque. « Sagesse » et « intelligence » sont des équivalents français établis et accessibles pour les termes sapientiels du passage. Aucun choix doctrinal supplémentaire n’est introduit.
