translation_notes:
  register: 'Français moderne, naturel et digne. Le dossier présente une discordance de référence : l’extrait syriaque et la couche anglaise citée correspondent au passage sur la transformation des ressuscités (habituellement 2 Baruch 51:3), et non à 52:7. La présente rédaction suit donc le contenu traditionnellement attesté pour 2 Baruch 52:7, sans reprendre à tort le texte anglais fourni. Comme les mots syriaques de 52:7 ne figurent pas dans l’extrait transmis, aucune décision lexicale détaillée n’est revendiquée.'
