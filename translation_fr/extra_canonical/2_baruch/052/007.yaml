review_pass:
  verdict: revise
  source_fidelity: 'Le bloc syriaque transmis et la piste anglaise correspondent au passage habituellement numéroté 2 Baruch 51:3 (transformation glorieuse des justes), non à 52:7. Ils ne peuvent donc pas étayer directement le texte du projet. Pour 52:7, le projet paraît suivre le sens général traditionnel, mais « ce qui vous est réservé » et « la récompense qui vous est gardée » ne rendent pas les deux objets distincts traditionnellement attestés : ce qui a été cru et ce qui a été espéré.'
  naturalness: La formulation est fluide et digne, mais « disposez-les » est plus abstrait et moins direct que le parallélisme exhortatif du verset.
  terminology: « âmes » convient. « Cœurs » doit être conservé pour le premier membre, afin de respecter le parallélisme cœur/âme. Aucun terme confessionnel n’est requis.
  issues:
  - severity: high
    issue: Discordance entre la référence et les sources fournies
    rationale: Le syriaque et l’anglais auditables portent sur 51:3, tandis que l’identifiant et le projet portent sur 52:7. Une vérification définitive contre le syriaque de 52:7 exige le témoin correct.
  - severity: medium
    issue: Les objets de l’exhortation sont reformulés en « ce qui vous est réservé » et « la récompense »
    rationale: Cette reformulation efface le contraste textuel entre ce qui a été cru et ce qui a été espéré, et introduit « récompense », qui n’est pas nécessaire.
  revised_text: Préparez donc vos cœurs à ce que vous avez cru, et vos âmes à ce que vous avez espéré.
  revised_footnotes: []
  revision_rationale: 'Révision prudente selon le sens traditionnellement transmis pour 2 Baruch 52:7 : restauration du parallélisme « cœurs/âmes » et « cru/espéré », sans importer le texte de 51:3 fourni par erreur dans le dossier.'
