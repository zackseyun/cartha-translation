base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: fr
  text: Des merveilles leur apparaîtront en leur temps. Car ils verront ce monde qui leur est invisible, ainsi que ce temps qui leur est caché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܡܝ̈ܗܬܐ
  choice: des merveilles
  rationale: Le nom désigne des choses étonnantes ou merveilleuses; « merveilles » conserve ici la portée eschatologique sans préciser abusivement leur nature.
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ
  choice: leur apparaîtront
  rationale: La forme passive de la racine « voir » signifie littéralement « seront vues par eux » et, idiomatiquement, « leur apparaîtront ».
- source_word: ܒܙܒܢܗܝܢ
  choice: au temps fixé pour elles
  rationale: Le suffixe féminin pluriel renvoie naturellement aux « merveilles »; cette formulation française rend leur temps propre ou assigné sans suggérer que les bénéficiaires déterminent ce moment.
- source_word: ܥܠܡܐ
  choice: monde
  rationale: « Monde » convient au contexte de la réalité eschatologique encore invisible; le terme peut aussi évoquer un âge, mais l'opposition visible/invisible favorise ici « monde ».
- source_word: ܠܐ ܡܬܚܙܐ
  choice: maintenant invisible
  rationale: Littéralement « qui ne leur est pas visible »; « maintenant » explicite l'opposition temporelle du contexte entre la condition présente et la révélation future.
theological_decisions:
- issue: Nature des réalités eschatologiques promises
  choice: Conserver les termes généraux « merveilles », « monde » et « temps »
  alternative: Identifier ces réalités plus précisément au paradis, au monde à venir ou à l'éternité
  rationale: Le texte conserve lui-même ces catégories larges; les préciser davantage importerait une interprétation théologique non exigée par le syriaque.
- issue: Valeur temporelle de l'invisibilité et de la dissimulation
  choice: Employer « maintenant » pour marquer l'état présent
  alternative: Traduire strictement « qui leur est invisible » sans adverbe temporel
  rationale: Le contexte oppose une vision future à une réalité actuellement inaccessible; l'ajout rend en français cette opposition implicite sans en modifier le contenu.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire pour un lectorat général tout en préservant les images sobres et l'indétermination eschatologique du syriaque.
