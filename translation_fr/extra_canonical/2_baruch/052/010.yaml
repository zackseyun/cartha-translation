  yaml_path: translation/extra_canonical/2_baruch/052/010.yaml
  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: fr
  text: tandis qu’eux-mêmes sont comptés parmi les amas de péchés, et que le mal de leurs formes dépérit toujours davantage. Car ils voient d’abord, puis ils s’en vont pour être tourmentés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: les amas de péchés
  rationale: Rend directement l’image concrète et inhabituelle du syriaque sans l’atténuer en une catégorie abstraite comme « les pécheurs ».
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: la laideur de leurs formes
  rationale: Dans ce contexte de transformation visible des impies, ܒܝܫܬܐ désigne le caractère mauvais ou hideux de leurs formes; « laideur » donne en français une expression naturelle tout en conservant la dimension extérieure.
- source_word: ܢܫܘܚܘܢ
  choice: dépérit
  rationale: Le verbe exprime l’idée de dépérissement ou d’amaigrissement progressif; le singulier s’accorde avec « la laideur », noyau du groupe nominal français.
- source_word: ܕܢܫܬܢܩܘܢ
  choice: subir le tourment
  rationale: Traduit la forme passive du verbe « être tourmenté » dans un français actuel et digne.
theological_decisions:
- issue: Nature du jugement décrit
  choice: 'Conserver la séquence: ils voient d’abord, puis partent subir le tourment.'
  alternative: Préciser ce qu’ils voient ou identifier explicitement le lieu et l’agent du tourment.
  rationale: Le verset ne fournit pas ici l’objet explicite de la vision ni davantage de détails; les ajouter résoudrait indûment une ellipse du texte.
translation_notes:
  register: Français moderne, sobre et soutenu. La métaphore étrange des « amas de péchés » est maintenue, ainsi que l’ellipse de « ils voient », afin de préserver la formulation et l’ambiguïté du syriaque.
