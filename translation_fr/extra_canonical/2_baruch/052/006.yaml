  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: fr
  text: Mais la gloire de ceux qui ont été reconnus justes en leur temps, de ceux qui ont eu du discernement durant leur vie et de ceux qui ont planté dans leur cœur la racine de la sagesse…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: ont été reconnus justes
  rationale: Le passif syriaque exprime le fait d’être déclaré ou tenu pour juste; cette formulation française conserve cette nuance sans préciser explicitement l’agent.
- source_word: ܫܘܒܠܐ
  choice: ont suivi une voie droite
  rationale: Le terme peut désigner une voie, une direction ou une conduite. La tournure choisie rend naturellement l’idée d’une orientation de vie, plutôt que de reprendre « compréhension », qui correspond moins directement au mot syriaque transmis.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: la racine de la sagesse
  rationale: Traduction directe de la métaphore agricole du texte source.
theological_decisions:
- issue: Nature de la justification
  choice: ont été reconnus justes
  alternative: ont été justifiés
  rationale: Le choix maintient le passif et la portée judiciaire ou évaluative du verbe sans imposer une construction doctrinale particulière.
- issue: Agent de la reconnaissance comme juste
  choice: agent laissé implicite
  alternative: reconnus justes par Dieu
  rationale: Le texte syriaque n’énonce pas ici l’agent; l’ajouter résoudrait une donnée que le verset laisse implicite.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase demeure syntaxiquement ouverte, comme le fragment source, puisque son développement se poursuit au verset suivant.
