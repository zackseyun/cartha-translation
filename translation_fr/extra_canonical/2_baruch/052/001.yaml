base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: fr
  text: 1 Car alors la terre rendra certainement les morts qu’elle reçoit maintenant afin de les garder, sans rien changer à leur forme. Mais elle les restituera tels qu’elle les a reçus et, tels que je les lui ai remis, elle les relèvera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܦܩܐ
  choice: rendra / restituera
  rationale: Ces verbes expriment la remise des morts par la terre, dans la continuité de l’état où elle les a reçus. La variation française évite une répétition pesante tout en conservant l’idée de restitution.
- source_word: ܒܨܘܪܬܗܘܢ
  choice: à leur forme
  rationale: '« Forme » conserve la portée assez large du syriaque : il s’agit de la continuité reconnaissable des morts, sans préciser outre mesure la constitution physique.'
- source_word: ܡܩܝܡܐ
  choice: relèvera
  rationale: Le verbe porte ici la force de « faire se lever » et, dans ce contexte, celle de ressusciter. « Relèvera » garde à la fois l’image verbale et le sens eschatologique.
- source_word: ܕܬܢܛܪ ܐܢܘܢ
  choice: afin de les garder
  rationale: La proposition finale présente la terre comme dépositaire des morts. « Garder » est naturel en français et conserve cette idée sans ajouter celle d’une transformation.
theological_decisions:
- issue: Continuité entre les morts déposés dans la terre et les personnes relevées
  choice: La traduction maintient que la terre les restitue tels qu’elle les a reçus, sans changement de leur forme.
  alternative: Comprendre la résurrection comme purement spirituelle, sans continuité reconnaissable avec les morts reçus par la terre.
  rationale: La répétition des actes de recevoir, garder, restituer et relever souligne la continuité de l’identité et de la forme, sans définir les mécanismes de la résurrection.
translation_notes:
  register: Français international moderne, digne et accessible. « Les lui ai remis » exprime naturellement la remise des morts à la terre ; « relèvera » préserve l’image de la résurrection sans recourir à une formulation technique.
