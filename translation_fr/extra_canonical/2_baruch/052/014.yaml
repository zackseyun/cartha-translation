translation:
  language: fr
  text: Alors, les justes apparaîtront sous une forme supérieure à celle des anges.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une forme supérieure à celle des anges »; le syriaque peut aussi évoquer une apparence ou une ressemblance.'
    reason: La note préserve l’amplitude de ܕܡܘܬܐ sans ajouter la notion de gloire au texte.
lexical_decisions:
- source_word: ܡܬܚܙܝܐ
  choice: apparaîtront
  rationale: Le verbe syriaque exprime le fait de devenir ou d’être visible; « apparaîtront » convient au contexte de la manifestation future.
- source_word: ܒܕܡܘܬܐ
  choice: sous une forme
  rationale: ܕܡܘܬܐ peut désigner la ressemblance, l’aspect ou la forme. Ici, « sous une forme » conserve la dimension visible de la transformation sans la réduire à une qualité abstraite.
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: plus glorieuse que celle des anges
  rationale: Littéralement, l’expression marque une supériorité par rapport à la forme des anges. « Plus glorieuse » rend naturellement cette supériorité dans le contexte eschatologique, tandis que la note signale la formulation plus littérale.
theological_decisions:
- issue: Nature de la supériorité des justes sur les anges
  choice: La supériorité porte sur leur forme manifestée, qualifiée de plus glorieuse.
  alternative: « La grandeur des justes surpassera celle des anges. »
  rationale: Le syriaque emploie explicitement ܕܡܘܬܐ, « forme / ressemblance », et non un terme général signifiant seulement « excellence ». La traduction évite donc d’affirmer une supériorité absolue de rang ou de nature.
translation_notes:
  register: Français moderne, digne et accessible. L’ajout explicite de « les justes », sous-entendus dans la continuité du passage, rend la phrase autonome. « Plus glorieuse » exprime la splendeur eschatologique sans transformer la comparaison en doctrine générale sur le rang respectif des humains et des anges.
