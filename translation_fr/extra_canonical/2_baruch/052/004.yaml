  yaml_path: translation/extra_canonical/2_baruch/052/004.yaml
  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: fr
  text: Et lorsque ce jour fixé sera passé, l’apparence de ceux qui sont condamnés sera ensuite transformée, ainsi que la gloire de ceux qui sont reconnus justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘ ܝܘܡܐ
  choice: ce jour
  rationale: Le démonstratif et le nom sont rendus directement, avec une formulation naturelle en français.
- source_word: ܕܡܘܬܐ / ܕܡܘ̈ܬܐ
  choice: l’apparence
  rationale: Dans ce contexte de transformation eschatologique, le terme désigne l’aspect visible ou la forme. « L’apparence » est idiomatique et évite de suggérer plusieurs corps distincts.
- source_word: ܡܬܚܠܦܝܢ / ܡܬܚܘܝܘ (lecture du passage selon le contexte manuscrit)
  choice: sera transformée
  rationale: Le contexte oppose l’état initial à une modification ultérieure; le passif français conserve l’agent non exprimé.
- source_word: ܐܝܠܝܢ ܕܐܙܕܩܘ
  choice: ceux qui sont reconnus justes
  rationale: Cette formulation garde la valeur passive du syriaque et ne décide pas ici par quel processus ou sur quelle base ils sont déclarés justes.
theological_decisions:
- issue: Sens de la justification
  choice: « ceux qui sont reconnus justes »
  alternative: « les justes » ou « ceux qui sont justifiés »
  rationale: Le choix conserve le passif et l’ambiguïté théologique du texte, sans importer une doctrine particulière de la justification.
- issue: Nature de la transformation future
  choice: « l’apparence […] sera transformée »
  alternative: « le corps […] sera transformé »
  rationale: Le texte parle de forme ou d’aspect; « corps » préciserait indûment la nature de cette transformation.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’enchaînement temporel du syriaque tout en évitant une lourdeur excessive. Aucun marqueur de note n’est requis.
