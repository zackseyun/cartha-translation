  yaml_path: translation/extra_canonical/2_baruch/052/011.yaml
  text: But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and purity a crown,
translation:
  language: fr
  text: Mais ceux qui ont été délivrés par leurs œuvres, ceux pour qui la Loi était une espérance, le discernement une attente, la sagesse une assurance et la pureté une couronne,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: auront été délivrés
  rationale: Le passif syriaque exprime la délivrance ou le salut. Le futur antérieur convient au cadre eschatologique du passage sans préciser ici l’agent.
- source_word: ܒܥ̈ܒܕܝܗܘܢ
  choice: par leurs œuvres
  rationale: Rend directement la préposition et le nom pluriel, tout en conservant la tension théologique de la formulation syriaque.
- source_word: ܢܡܘܣܐ
  choice: la Loi
  rationale: Dans ce contexte religieux, le terme désigne la Loi comme norme reçue, et non une loi quelconque.
- source_word: ܣܒܪܐ
  choice: une espérance
  rationale: Le terme syriaque peut désigner l’espoir ou l’espérance; « espérance » convient au registre eschatologique.
- source_word: ܣܘܟܠܐ
  choice: l’intelligence
  rationale: Désigne la compréhension ou le discernement; « intelligence » préserve la structure nominale parallèle.
- source_word: ܬܘܟܠܢܐ
  choice: une assurance
  rationale: Le sens est celui de confiance ou d’appui assuré; « assurance » s’intègre naturellement au parallélisme.
- source_word: ܚܟܡܬܐ
  choice: la sagesse
  rationale: Équivalent direct et usuel du terme syriaque.
- source_word: ܕܟܝܘܬܐ / ܟܠܝܠܐ
  choice: la pureté / une couronne
  rationale: 'Retient la lecture contrôlée signalée par la révision la plus récente: la pureté est présentée comme une couronne.'
theological_decisions:
- issue: Rapport entre les œuvres et la délivrance
  choice: « délivrés par leurs œuvres »
  alternative: « délivrés à cause de leurs œuvres » ou reformulation atténuée
  rationale: La traduction conserve la formulation causale ou instrumentale du syriaque et sa tension théologique, sans l’harmoniser avec une doctrine particulière.
- issue: Valeur religieuse de ܢܡܘܣܐ
  choice: « la Loi » avec majuscule
  alternative: « la loi »
  rationale: Le contexte oppose les attitudes envers la Loi reçue; la majuscule indique cette référence religieuse sans ajouter d’identification confessionnelle.
translation_notes:
  register: Français moderne, digne et lisible. Le parallélisme nominal du syriaque est conservé. La phrase reste ouverte par une virgule parce que le verset se poursuit syntaxiquement dans le contexte suivant. L’ancienne variante anglaise « endurance/force » n’est pas reprise, car la dernière vérification textuelle l’identifie comme une traduction erronée.
