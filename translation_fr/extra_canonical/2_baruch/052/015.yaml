  text: For the first will receive the last, whom they were expecting, and the last those they had heard had passed away.
translation:
  language: fr
  text: Car les premiers accueilleront les derniers, ceux qu’ils attendaient, et les derniers accueilleront ceux dont ils avaient entendu dire qu’ils étaient morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux dont ils avaient appris qu’ils étaient morts ».'
    reason: La construction syriaque de la proposition finale permet de rendre le verbe soit par « entendre dire », soit plus largement par « apprendre » ; les deux formulations conservent la référence aux personnes décédées.
lexical_decisions:
- source_word: ܢܩܒܠܘܢ
  choice: accueilleront
  rationale: Le verbe signifie « recevoir, accueillir ». Dans le contexte des retrouvailles après la résurrection, « accueilliront » est naturel et conserve la réciprocité du passage.
- source_word: ܩܕܡܝܐ / ܐܚܪ̈ܝܐ
  choice: les premiers / les derniers
  rationale: Ces termes corrélatifs distinguent les générations antérieures et postérieures. La traduction littérale préserve cette opposition sans en préciser davantage le référent.
- source_word: ܡܣܟܝܢ ܗܘܘ
  choice: attendaient
  rationale: La forme exprime une attente qui se prolongeait; l’imparfait français rend naturellement cette valeur.
- source_word: ܫܡܥܝܢ ܗܘܘ
  choice: avaient appris
  rationale: Littéralement « avaient entendu ». En français, « avaient appris » exprime naturellement une connaissance reçue par ouï-dire dans ce contexte.
- source_word: ܕܒܓܘܗ
  choice: qu’ils étaient partis
  rationale: La leçon transmise dans l’extrait est difficile prise isolément, tandis que la tradition de traduction comprend ici ceux dont les derniers avaient appris le départ de ce monde. La formulation retenue suit ce sens contextuel tout en signalant en note une autre tournure possible.
theological_decisions:
- issue: Identification des « premiers » et des « derniers »
  choice: Maintenir les désignations sans les expliciter
  alternative: Paraphraser par « les générations anciennes » et « les générations récentes »
  rationale: Le texte évoque vraisemblablement des groupes morts à des époques différentes, mais ne les définit pas explicitement dans ce verset. La traduction conserve donc l’ambiguïté.
- issue: Nature de l’accueil
  choice: Employer simplement « accueilleront »
  alternative: Ajouter qu’ils se reconnaîtront ou se retrouveront
  rationale: Le contexte peut suggérer des retrouvailles, mais le verbe source ne justifie pas l’ajout d’une précision théologique.
translation_notes:
  register: Français moderne, international et digne. La répétition d’« accueilleront » clarifie en français le verbe sous-entendu dans le second membre, tandis que les termes « premiers » et « derniers » conservent la tension du texte.
