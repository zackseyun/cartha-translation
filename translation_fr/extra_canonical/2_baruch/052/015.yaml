  source_fidelity: 'Le parallélisme est bien rendu : les « premiers » reçoivent les « derniers » qu’ils attendaient, puis les « derniers » reçoivent ceux dont ils avaient eu connaissance comme étant morts. Toutefois, « partis » est trop euphémistique et peut simplement désigner un départ ; le contexte et le sens adopté par l’audit anglais demandent d’expliciter la mort.'
