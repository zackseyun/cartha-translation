  text: 'For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.'
translation:
  language: fr
  text: Car ces choses sont nécessaires pour montrer aux vivants que les morts ont repris vie et que ceux qui étaient partis sont revenus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: il faut
  rationale: Rend naturellement en français l’idée syriaque de nécessité ou de convenance, sans préciser un agent absent du texte.
- source_word: ܠܡܚܘܝܘ
  choice: que ceci soit montré
  rationale: Conserve la valeur démonstrative et la tournure passive/impersonnelle du contexte.
- source_word: ܕܚܝܘ ܡ̈ܝܬܐ
  choice: les morts ont repris vie
  rationale: Exprime l’entrée ou le retour à la vie avec un français courant et digne.
- source_word: ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: et ceux qui étaient partis sont revenus
  rationale: « Sont revenus » explicite le mouvement de retour impliqué par la succession « étaient partis / sont venus », tout en restant idiomatique.
theological_decisions:
- issue: Nature de la reprise de vie
  choice: ont repris vie
  alternative: sont ressuscités
  rationale: Le syriaque dit littéralement qu’ils ont vécu; la formulation retenue préserve cette affirmation sans imposer un vocabulaire doctrinal plus spécialisé.
translation_notes:
  register: Français moderne international, clair et solennel. La structure en deux propositions parallèles est conservée.
