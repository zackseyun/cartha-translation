  text: quand ils verront que ceux qu’ils considèrent maintenant comme rien se reposent et sont glorifiés avec les anges,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܫܒܝܢ
  choice: ils tiennent… pour
  rationale: Rend le verbe de jugement ou d’estimation dans une tournure française naturelle; avec le contexte, il exprime le fait de ne compter ces personnes pour rien.
- source_word: ܡܬܬܢܝܚܝܢ
  choice: sont dans le repos
  rationale: Conserve la valeur passive ou stative du syriaque et la portée eschatologique du repos, sans la réduire au simple fait de se détendre.
- source_word: ܡܫܬܒܚܝܢ
  choice: glorifiés
  rationale: Reproduit le passif du verbe syriaque et son sens d’accès à la gloire.
- source_word: ܥܡ ܡܠܐܟ̈ܐ
  choice: avec les anges
  rationale: Rend directement l’association aux anges sans préciser davantage la nature de cette glorification.
theological_decisions:
- issue: Nature du repos et de la glorification
  choice: « sont dans le repos et glorifiés »
  alternative: « se reposent et partagent la gloire »
  rationale: Le choix retenu préserve les formes passives ou statives et évite d’expliquer le mécanisme ou le statut théologique de la glorification.
translation_notes:
  register: Français moderne, clair et digne. La proposition reste ouverte, conformément à sa fonction syntaxique dans le contexte. Aucun marqueur de note n’est nécessaire.
