  text: Therefore, he formerly did not spare even his own sons, but afflicted them like his enemies because they sinned.
translation:
  language: fr
  text: C’est pourquoi, autrefois, il n’a pas même épargné ses propres fils, mais il les a frappés comme ses ennemis, parce qu’ils avaient péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܣ / « épargner »
  choice: épargné
  rationale: Rend directement l’idée de retenir un châtiment ou d’user de clémence envers quelqu’un.
- source_word: ܒܢ̈ܘܗܝ / « ses fils »
  choice: ses propres fils
  rationale: Le possessif est conservé, et « propres » fait ressortir le contraste implicite entre les fils et les ennemis sans modifier le référent.
- source_word: ܡ̇ܚܝܢ / « frapper, affliger »
  choice: frappés
  rationale: Choix concret et digne qui conserve la force punitive du verbe syriaque sans préciser indûment la forme du châtiment.
- source_word: ܐܝܟ ܒܥܠܕܒܒ̈ܘܗܝ / « comme ses ennemis »
  choice: comme ses ennemis
  rationale: Conserve le suffixe possessif signalé par la source et maintient l’ambiguïté entre statut comparé et manière de traiter.
- source_word: « auparavant, autrefois »
  choice: autrefois
  rationale: Exprime naturellement en français la référence temporelle au passé sans lui donner une précision absente du texte.
theological_decisions:
- issue: Relation entre la filiation et le jugement
  choice: Conserver le contraste « ses propres fils » / « ses ennemis »
  alternative: Reformuler « il a traité ses fils en ennemis »
  rationale: 'La formulation retenue ne résout pas la tension théologique : les personnes restent désignées comme ses fils tout en étant frappées comme ses ennemis à cause de leur péché.'
- issue: Portée de l’indication temporelle
  choice: Rattacher « autrefois » à l’ensemble de l’action passée
  alternative: Le rattacher uniquement au fait de ne pas épargner
  rationale: La position française est naturelle et garde une portée suffisamment ouverte, sans imposer une lecture syntaxique trop étroite.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase demeure proche de la structure syriaque tout en évitant une syntaxe artificielle. Aucun terme confessionnel ou interprétation doctrinale supplémentaire n’est introduit.
