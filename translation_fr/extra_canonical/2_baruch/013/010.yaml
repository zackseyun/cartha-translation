  text: C’est pourquoi ils furent alors châtiés, afin d’être sanctifiés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܗܘ ܙܒܢܐ
  choice: alors
  rationale: Rend naturellement en français la circonstance temporelle « en ce temps-là » sans alourdir la phrase.
- source_word: ܐܬܪܕܝܘ
  choice: furent châtiés
  rationale: Le passif exprime une correction punitive ou disciplinaire; « châtiés » conserve cette portée sans préciser explicitement l’agent.
- source_word: ܢܬܩܕܫܘܢ
  choice: être sanctifiés
  rationale: Conserve le vocabulaire cultuel et théologique de la sanctification ainsi que la valeur passive du syriaque.
theological_decisions:
- issue: Lien entre le châtiment et la sanctification
  choice: afin d’être sanctifiés
  alternative: pour qu’ils deviennent saints
  rationale: La formulation retenue préserve la finalité exprimée et le passif théologique, sans expliquer davantage la manière dont le châtiment conduit à la sanctification.
translation_notes:
  register: Français moderne, sobre et dignifié. Le passif est maintenu dans les deux propositions afin de ne pas nommer un agent que le verset laisse implicite.
