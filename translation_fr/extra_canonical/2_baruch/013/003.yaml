  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: fr
  text: Parce que tu as été bouleversé par ce qui est arrivé à Sion, tu seras donc certainement gardé jusqu’à l’accomplissement des temps, afin de servir de témoignage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥ
  choice: as été bouleversé
  rationale: Le verbe syriaque exprime le fait d’être ébranlé ou profondément troublé ; « bouleversé » convient ici à une réaction intérieure devant le sort de Sion.
- source_word: ܢܫܬܘܙܒ
  choice: seras gardé
  rationale: Le terme peut évoquer la délivrance ou la préservation. « Gardé » rend ici l’idée d’être maintenu en vie jusqu’au terme annoncé, sans préciser davantage le mode de cette protection.
- source_word: ܫܘܠܡܐ ܕܙܒ̈ܢܐ
  choice: l’accomplissement des temps
  rationale: Cette expression conserve la portée eschatologique du terme, qui peut désigner à la fois l’achèvement et la pleine réalisation des temps.
- source_word: ܣܗܕܘܬܐ
  choice: témoignage
  rationale: « Témoignage » préserve le sens juridique et religieux du substantif sans préciser si Baruch est lui-même le témoin ou si son existence constitue le témoignage.
theological_decisions:
- issue: Nature de la préservation promise à Baruch
  choice: « tu seras […] gardé jusqu’à l’accomplissement des temps »
  alternative: « tu seras sauvé jusqu’à la fin des temps »
  rationale: « Gardé » évite d’imposer l’idée d’un salut au sens doctrinal et conserve l’ambiguïté entre protection, préservation et délivrance.
- issue: Fonction testimoniale de Baruch
  choice: « afin de servir de témoignage »
  alternative: « afin que tu sois un témoin »
  rationale: La formulation retenue ne transforme pas explicitement Baruch en témoin personnel et respecte la possibilité que sa préservation elle-même fasse office de témoignage.
translation_notes:
  register: Français international moderne, sobre et digne. La structure causale et la tension eschatologique sont conservées, avec une formulation naturelle et accessible.
