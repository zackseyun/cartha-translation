translation:
  language: fr
  text: Car en tout temps je vous ai fait du bien, mais en tout temps vous avez rejeté ma bonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܟܠ ܙܒܢ
  choice: en tout temps
  rationale: Conserve la répétition temporelle et le contraste symétrique du syriaque.
- source_word: ܐܒܐ
  choice: j’ai fait du bien
  rationale: Dans ce contexte, le verbe exprime l’action bienfaisante de Dieu envers ses interlocuteurs; cette formulation est naturelle en français sans affaiblir l’opposition.
- source_word: ܛܝܒܘܬܝ
  choice: ma bonté
  rationale: Rend le terme syriaque dans son sens de bonté ou bienveillance manifestée, sans lui imposer une nuance confessionnelle plus étroite.
- source_word: ܟܦܪܬܘܢ
  choice: vous avez rejeté
  rationale: Exprime ici le refus ou le reniement de la bonté divine; « rejeté » reste clair en français moderne.
theological_decisions:
- issue: Nature de la bonté divine refusée
  choice: ma bonté
  alternative: ma grâce / mes bienfaits
  rationale: « Ma bonté » préserve la portée assez large du terme syriaque, qui peut désigner la bienveillance ou la faveur, sans réduire le sens aux seuls dons reçus ni charger le verset d’une terminologie doctrinale.
translation_notes:
  register: Français moderne, digne et direct. La répétition « en tout temps » est maintenue afin de reproduire l’insistance et le parallélisme antithétique de la phrase source.
