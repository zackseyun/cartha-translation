review_pass:
  verdict: revise
  source_fidelity: Le corpus syriaque fourni est un regroupement de pages à interpolation seulement tentative et ne permet pas d’isoler avec certitude les mots de 13:11. Les formes visibles près de la limite de page ne suffisent pas à contrôler directement toute la proposition. La révision reste donc alignée sur la piste d’audit anglaise, qui rend une adresse aux nations et aux peuples, leur culpabilité, l’action de fouler la terre et un traitement de la création dépourvu de droiture.
  naturalness: La syntaxe est fluide et le ton d’interpellation solennel convient. « Sans droiture » est plus idiomatique et plus précis que « sans justice » pour qualifier moralement la manière d’agir envers la création, sans réduire l’expression à la seule justice institutionnelle.
  terminology: « Nations et peuples », « coupables », « la terre » et « la création » conservent le parallélisme et l’ampleur du texte audité. « Droiture » rend le registre moral de “righteousness” sans imposer une interprétation confessionnelle.
  issues:
  - severity: low
    issue: « sans justice » est sémantiquement plus étroit et légèrement moins naturel dans cette collocation.
    rationale: En français moderne, « traiter la création sans justice » peut évoquer principalement l’iniquité ou l’injustice sociale, tandis que le sens moral général de l’audit anglais est mieux préservé par « sans droiture ».
  - severity: medium
    issue: Le témoin syriaque transmis ne permet pas de vérifier de manière directe l’intégralité de ce verset précis.
    rationale: Le contexte source est explicitement un bucket de chapitre à interpolation tentative et son texte visible ne fournit pas une segmentation assurée de 13:11. Une vérification humaine sur un témoin ou une édition segmentée est souhaitable.
  revised_text: Mais maintenant, nations et peuples, vous êtes coupables, car, de tout temps, vous avez foulé la terre et traité la création sans droiture.
  revised_footnotes: []
  revision_rationale: Correction limitée de « sans justice » en « sans droiture » afin de rendre plus exactement le sens moral général attesté par la piste anglaise, tout en conservant la structure et le contenu du projet. Aucun appel de note n’est justifié par le texte français.
