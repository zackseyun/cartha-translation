  text: But now, you nations and peoples, you are guilty, because at all times you have trodden the earth and dealt with creation without righteousness.
translation:
  language: fr
  text: Mais maintenant, nations et peuples, vous êtes coupables, car, de tout temps, vous avez foulé la terre et traité la création sans justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̈ܘܬܐ
  choice: peuples
  rationale: Le terme syriaque désigne des communautés humaines ou des nations ; « peuples » convient ici en parallèle avec « nations ».
- source_word: ܚܝܒܝܢ
  choice: vous êtes coupables
  rationale: Le mot exprime la culpabilité ou le fait d’être passible d’un jugement ; cette formulation conserve sa portée judiciaire.
- source_word: ܐܪܥܐ / ܐܬܪܘܬ
  choice: la terre
  rationale: Le contexte transmis renvoie au monde habité ou à la terre foulée ; « la terre » est naturel et garde l’ampleur du propos.
- source_word: ܕܠܐ … ܟܐܢܘܬܐ
  choice: sans justice
  rationale: Cette expression préserve le sens moral de l’absence de droiture ou de justice sans préciser indûment la nature de la faute.
theological_decisions:
- issue: Portée de « création »
  choice: la création
  alternative: les créatures
  rationale: Le singulier collectif maintient l’ambiguïté entre l’ordre créé dans son ensemble et ce qui a été créé, sans restreindre le propos aux seuls êtres vivants.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve l’adresse directe aux collectivités et le parallélisme « nations et peuples ». Aucun marqueur de note n’est requis.
