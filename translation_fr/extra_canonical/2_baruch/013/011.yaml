    ܡܕܡ ܕܐ̇ܡܪܬ ܠܩܘܒܠܝ.

    ܡܛܠ ܗܢܐ ܡܬܝܗܒ

    ܠܟܘܢ ܠܡܫܡܥܘ ܡ̈ܠܐ.

    ܕܬܬܒܝܐܘ ܒܬܪܟܢ.

    ܐܢ ܢܬܒܥ ܡܢܟܘܢ

    ܡܕܝ̈ܢܬܐ ܐܝܠܝܢ ܕܡ̈ܠܝܢ

    ܕܠܡܒܢܐ ܐܢܬܝܢ ܒܠܚܘ

    ܐܠܗܐ ܚܝܠܬܢܐ. ܦܘܪܥܢܐ

    ܗܘܐ. ܐܡܪ ܠܗܘܢ ܐܢܐ

    ܘܐܝܠܝܢ ܕܕܡ̈ܝܢ ܠܗܘܢ ܐܝܠܝܢ

    ܕܚܕܝܘܬܗܘܢ ܒܝܫܬܐ ܗܘܬ

    ܘܦܘܪܥܢܐ ܕܐܝܠܝܢ ܒܠܝܫܘ

    ܗܠܝܢ ܒܡܠܟܝܢ. ܒܙܒܢܘ

    ܕܡܬܝܕܥܐ ܠܐܬܪܘܬ

    ܠܡܡܠܠܘ ܘܡ̇ܚܝܢ ܢܦܫܗܘܢ.

    ܘܐܢ ܠܐܡܕܢ ܒܗܘ̇ ܙܒܢܐ

    ܕܐܬܬܚܝܘ. ܘܐܡܪ ܠܗܘܢ

    ܐܢܬܝܢ ܕܐܫܬܬܝܬܝܢ ܚܡܪܐ

