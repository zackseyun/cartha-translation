  text: If the cities that now prosper should ever say, ‘Why has the mighty God brought this retribution upon us?’
translation:
  language: fr
  text: 'Si les villes qui prospèrent aujourd’hui venaient à dire : « Pourquoi le Dieu puissant nous a-t-il infligé cette rétribution ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝ̈ܢܬܐ
  choice: les villes
  rationale: Rend directement le pluriel syriaque désignant les villes.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: le Dieu puissant
  rationale: Conserve le titre divin et l’idée de puissance sans introduire une formulation confessionnelle particulière.
- source_word: ܦܘܪܥܢܐ
  choice: rétribution
  rationale: Préserve la notion de retour accordé en réponse aux actes, avec sa possible portée punitive, plutôt que de la réduire d’emblée à un simple châtiment.
theological_decisions:
- issue: Nature de l’action judiciaire de Dieu
  choice: « infligé cette rétribution »
  alternative: « infligé ce châtiment »
  rationale: « Rétribution » maintient la relation entre les actes et leur retour judiciaire, tandis que « châtiment » résoudrait plus fortement le terme dans un sens exclusivement punitif.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La tournure hypothétique « venaient à dire » rend naturellement l’éventualité exprimée, et la question directe conserve la tension du texte.
