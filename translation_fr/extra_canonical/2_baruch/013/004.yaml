    ܒܚܘܫܒܐ ܘܐܡܪܘ ܠܡܘܬܐ.

    ܛܘܒܝܟܘܢ ܠܟܘܢ ܕܐܝܬ

    .. ܡܠܝܢ ܕܝܠܢ ܕܚܢܢ ܚܝܝܢ܀

