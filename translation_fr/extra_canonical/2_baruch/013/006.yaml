  text: Therefore, they were disciplined at that time so that they might be forgiven.
translation:
  language: fr
  text: C’est pourquoi ils furent alors corrigés, afin d’être pardonnés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin d’être épargnés » ; le verbe syriaque peut aussi signifier « être laissés » ou « subsister ».
    reason: 'Le verbe ܢܫܬܒܩܘܢ admet ici plusieurs nuances réelles : pardon, préservation ou maintien en vie.'
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: furent corrigés
  rationale: Le parfait passif exprime une correction ou une discipline déjà subie. « Corrigés » conserve la visée éducative du terme sans imposer la nuance plus punitive de « châtiés ».
- source_word: ܗܝܕܝܢ
  choice: alors
  rationale: Rend directement et naturellement l’indication temporelle « à ce moment-là ».
- source_word: ܢܫܬܒܩܘܢ
  choice: être pardonnés
  rationale: Dans ce contexte de correction, le passif de la racine ܫܒܩ se comprend naturellement comme « être pardonnés », tout en pouvant aussi évoquer le fait d’être épargnés ou laissés en vie.
theological_decisions:
- issue: Finalité de la correction
  choice: afin d’être pardonnés
  alternative: afin d’être épargnés
  rationale: La formulation retient le pardon comme sens contextuel principal, sans effacer dans une note la polyvalence du verbe syriaque. Elle n’ajoute pas « les nations », sujet absent du texte.
translation_notes:
  register: Français moderne, sobre et digne. « Furent alors corrigés » garde la valeur passée et la nuance disciplinaire du syriaque ; la phrase finale exprime clairement le but sans surinterprétation.
