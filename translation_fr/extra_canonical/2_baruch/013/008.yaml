  text: I say to you, ‘You who have drunk strained wine shall also drink its dregs. For the judgment of the Most High shows no partiality.’
translation:
  language: fr
  text: 'Je vous le dis : « Vous qui avez bu du vin filtré, vous boirez aussi sa lie, car le jugement du Très-Haut ne fait preuve d’aucun favoritisme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܪ ܐܢܐ ܠܟܘܢ
  choice: Je vous le dis
  rationale: La construction exprime une parole à la première personne adressée à un groupe ; elle préserve la dynamique du locuteur attestée par le syriaque.
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: du vin filtré
  rationale: « Filtré » rend naturellement l’idée d’un vin passé au filtre ou débarrassé de ses impuretés, en contraste avec la lie qui suit.
- source_word: ܕܠܡܐ
  choice: la lie
  rationale: Le terme désigne ici le dépôt ou résidu du vin ; « la lie » est l’équivalent français courant et maintient l’image du jugement inévitable.
- source_word: ܠܐ ܡܣܒܪ ܒܐܦ̈ܐ
  choice: ne fait pas de favoritisme
  rationale: Cette expression idiomatique indique l’absence de partialité ou de considération privilégiée pour certaines personnes ; la formulation française est claire et actuelle.
- source_word: ܥܠܝܐ
  choice: le Très-Haut
  rationale: Titre divin traditionnel et transparent en français, sans ajout confessionnel.
theological_decisions:
- issue: Impartialité du jugement divin
  choice: le jugement du Très-Haut ne fait pas de favoritisme
  alternative: le jugement du Très-Haut est impartial
  rationale: La formulation choisie conserve l’énoncé négatif et concret de l’idiome source sans développer sa portée théologique.
- issue: Identité du locuteur et des destinataires
  choice: Je vous le dis
  alternative: Tu leur diras
  rationale: La lecture syriaque attestée emploie la première personne avec un destinataire pluriel ; l’alternative modifierait sans fondement la dynamique du discours.
translation_notes:
  register: Français international moderne, digne et direct. L’image du vin filtré puis de la lie est conservée, tandis que l’idiome relatif à la partialité est rendu par une expression française immédiatement compréhensible.
