    ܬܬܢܣܒ ܘܬܫܬܒܩܝܢ.

    ܫܪܝܪܐܝܬ ܓܝܪ ܒܙܒܢܐ

    ܡܬܬܒܪܐ ܒܥܝܢܝ ܚܛܝ̈ܐ.

    ܗܘ ܕܐܡܪ ܒܠܒܗ ܪܘܚܐ

    ܐܝܟ ܕܦ̇ܩܕܬ ܐܚܝܕܐ.

    ܘܟܕ ܐܡ̇ܪܢܐ ܗܠܝܢ ܪ̇ܡܬ

    ܫܒܥܐ ܝܘܡ̈ܝܢ.܀ ܘܗܘܬ

    ܡܢ ܒܬܪ ܗܠܝܢ ܐܢܐ ܒܪܘܟ

    ܩܐܡ ܗܘܝܬ ܥܠ ܨܝܕܐ

    ܕܢܗܪܐ. ܘܗܘܐ ܩܠܐ

    ܐܙܐ ܡܢ ܡܪܘܡܐ

    ܘܐܡ̇ܪ ܠܝ. ܩܘܡ ܥܠ

