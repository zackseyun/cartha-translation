    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܐܘ

    ܡܢܘ ܐܡܪ ܣܓܝܐܘ

    ܚܟܡܗ ܐܟܡܐ ܕܠܐ

    ܡܐ̈ܙܐ ܘܕ̈ܢܦܐ ܗܘܐ

    ܕܡܢܝܢ ܟܐܢܐ ܟܢܝܫܘ.

