  text: And a voice came from on high and said to me, “Stand on your feet, Baruch, and hear the word of the Mighty One.”
translation:
  language: fr
  text: 'Alors, une voix venue d’en haut me dit : « Tiens-toi debout, Baruch, et écoute la parole de Dieu, le Puissant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܡܪܘܡܐ (men meromā)
  choice: venue d’en haut
  rationale: Rend naturellement l’origine céleste de la voix sans préciser davantage ce que le syriaque laisse implicite.
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ (qūm ʿal reglayk)
  choice: Tiens-toi debout
  rationale: Expression française idiomatique correspondant à l’ordre littéral de se lever sur ses pieds.
- source_word: ܡܠܬܐ (melltā)
  choice: la parole
  rationale: Le singulier désigne ici le message divin que Baruch doit entendre; « parole » conserve le registre biblique sans archaïsme.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ (Alāhā ḥayltānā)
  choice: Dieu, le Puissant
  rationale: Conserve explicitement « Dieu » et rend l’épithète « puissant » comme un titre, sans élargir le sens en « Tout-Puissant ».
theological_decisions:
- issue: Statut de l’épithète divine ܚܝܠܬܢܐ
  choice: Dieu, le Puissant
  alternative: le Dieu puissant / le Tout-Puissant
  rationale: La formulation retenue préserve à la fois le nom divin explicite ܐܠܗܐ et la force titulaire de l’adjectif. « Tout-Puissant » serait traditionnel mais lexicalement plus absolu que le terme source.
translation_notes:
  register: Français moderne, digne et oralement fluide. La ponctuation met en relief l’épithète divine tout en conservant la brièveté solennelle du verset.
