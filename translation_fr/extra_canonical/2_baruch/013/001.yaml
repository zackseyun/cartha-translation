  text: 'And it happened after these things that I, Baruch, was standing on the bank of the river, and a voice came from the height and said to me:'
translation:
  language: fr
  text: 'Après cela, il arriva que moi, Baruch, je me tenais sur la rive du fleuve[a]. Une voix vint d’en haut et me dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une tradition de contrôle lit : « sur le mont Sion ».'
    reason: Signaler la variante de lieu sans remplacer la leçon du texte syriaque primaire.
lexical_decisions:
- source_word: ܨܝܕܐ ܕܢܗܪܐ
  choice: sur la rive du fleuve
  rationale: Le syriaque primaire désigne le bord ou la rive d’un cours d’eau. « Sur la rive du fleuve » est naturel en français et conserve ce cadre sans l’harmoniser avec la tradition de contrôle.
- source_word: ܡܢ ܡܪܘܡܐ
  choice: d’en haut
  rationale: L’expression indique la provenance céleste de la voix. « D’en haut » restitue ce sens en français courant et digne sans préciser davantage ce que le texte laisse implicite.
- source_word: ܘܗܘܐ ܩܠܐ ܐܙܐ
  choice: Une voix vint
  rationale: Cette formulation brève conserve le mouvement exprimé par le syriaque et évite de supprimer l’arrivée de la voix, présente dans le texte source.
theological_decisions:
- issue: Lieu de la révélation reçue par Baruch
  choice: La rive du fleuve
  alternative: Le mont Sion
  rationale: Le texte syriaque primaire de Ceriani porte « la rive du fleuve ». La leçon « mont Sion », attestée dans la tradition de contrôle, est signalée en note plutôt que substituée au témoin principal.
translation_notes:
  register: Français moderne, international et digne. La construction « moi, Baruch » garde l’insistance explicite du syriaque; « d’en haut » demeure naturelle tout en préservant la provenance céleste non davantage définie.
