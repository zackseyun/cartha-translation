  source_fidelity: Le texte syriaque transmis pour ce segment porte le singulier « ce châtiment » (ܦܘܪܥܢܐ ... ܗܢܐ) et l’accompli « qui est venu / est arrivé », avec un suffixe singulier dans l’expression temporelle. La traduction française rend correctement ces données par « ce châtiment » et « au temps qui lui était fixé ». Le référent de « votre ville » demeure suffisamment incertain pour justifier la variante « votre peuple » en note, conformément à la piste textuelle conservée dans l’audit anglais.
  naturalness: 'La phrase est naturelle dans un français moderne soutenu. « S’est abattu sur » est possible, mais « est arrivé à » reflète plus directement le verbe de mouvement syriaque et évite d’ajouter une image de violence qui n’est pas explicitement portée par le verbe. Le tiret final est justifié : l’énoncé se poursuit au verset suivant.'
