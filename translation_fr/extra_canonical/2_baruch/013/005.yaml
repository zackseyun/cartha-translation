  text: You shall say to them, and to those like them, ‘You who have seen this calamity and this retribution that has come upon you and upon your city at its appointed time—
translation:
  language: fr
  text: 'Vous leur direz, ainsi qu’à ceux qui leur ressemblent : « Vous qui avez vu ce malheur et ce châtiment qui vous est arrivé, à vous et à votre ville[a], au temps qui lui était fixé — »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre peuple ».
    reason: Variante possible pour le référent rendu par « votre ville ».
lexical_decisions:
- source_word: ܒܝܫܬܐ
  choice: malheur
  rationale: Dans ce contexte de catastrophe subie, « malheur » rend naturellement le terme syriaque sans le réduire à la seule idée de faute morale.
- source_word: ܦܘܪܥܢܐ
  choice: châtiment
  rationale: Le mot désigne ici une rétribution punitive; « châtiment » est clair et naturel en français tout en conservant sa portée judiciaire.
- source_word: ܡܕܝܢܬܐ
  choice: ville
  rationale: « Ville » est le sens contextuel le plus naturel; la variante « peuple » est conservée en note en raison de l’incertitude textuelle ou interprétative signalée par la tradition de contrôle.
- source_word: ܒܙܒܢܗ
  choice: au temps qui lui était fixé
  rationale: Cette formulation française exprime un temps déterminé ou assigné et respecte le suffixe singulier renvoyant au châtiment.
theological_decisions:
- issue: Nature de la rétribution
  choice: châtiment
  alternative: rétribution
  rationale: « Châtiment » rend explicitement la dimension punitive du contexte sans préciser davantage l’agent ou la doctrine du jugement.
- issue: Référent du suffixe temporel singulier
  choice: 'le châtiment : « au temps qui lui était fixé »'
  alternative: 'le malheur et le châtiment : « au temps qui leur était fixé »'
  rationale: Le syriaque porte un suffixe singulier; le rattachement au châtiment préserve cette donnée grammaticale sans harmoniser artificiellement les deux substantifs.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste ouverte par un tiret, conformément au caractère syntaxiquement inachevé du verset et à sa continuation dans le contexte.
