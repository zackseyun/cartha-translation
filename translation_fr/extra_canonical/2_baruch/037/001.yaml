  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: fr
  text: Après cela, je vis que le cèdre brûlait, ainsi que la forêt qui l’entourait. La vigne, elle, grandissait, et la plaine autour d’elle était couverte de fleurs qui ne se fanent pas. Puis je me réveillai et me levai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: le cèdre
  rationale: Le nom précis de l’arbre est conservé, car il porte la valeur symbolique de la vision sans qu’il soit nécessaire d’ajouter « arbre ».
- source_word: ܓܘܦܢܐ
  choice: la vigne
  rationale: La figure demeure désignée par l’image de la vigne; le texte ne l’identifie pas encore explicitement à une personne ou à une figure messianique.
- source_word: fleurs décrites comme ne se flétrissant pas
  choice: des fleurs qui ne se fanent pas
  rationale: Cette formulation naturelle en français conserve l’idée de fleurs impérissables sans employer le peu courant « infanables ».
theological_decisions:
- issue: Identification de la vigne
  choice: Maintenir « la vigne » dans le corps du texte.
  alternative: Identifier directement la vigne au Messie ou employer une majuscule interprétative.
  rationale: L’explication de la figure vient dans la suite du récit. La conserver comme élément de la vision respecte la progression narrative et évite d’anticiper son interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Les imparfaits rendent les actions observées dans la vision, tandis que les passés simples marquent le réveil et le lever de Baruch. La tournure détachée « elle » souligne le contraste entre la destruction du cèdre et la croissance de la vigne.
