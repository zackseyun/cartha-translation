  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: fr
  text: Et en ce temps-là, toi et la multitude qui est avec toi, vous verrez la patience dont le Très-Haut a fait preuve au fil de toutes les générations envers tous ceux qui naissent, pécheurs comme justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܗܘ ܙܒܢܐ
  choice: en ce temps-là
  rationale: Rend directement l’expression temporelle syriaque dans un français narratif naturel et digne.
- source_word: ܣܘܓܐܐ ܕܥܡܟ
  choice: la multitude qui est avec toi
  rationale: Conserve l’idée collective et l’association au destinataire sans réduire le groupe à de simples compagnons.
- source_word: ܡܥܝܪܢܘܬܗ ܕܥܠܝܐ
  choice: la patience du Très-Haut
  rationale: Dans ce contexte, le terme désigne la longanimité ou la retenue divine; « patience » reste clair et naturel, tandis que « Très-Haut » préserve le titre divin.
- source_word: ܒܟܠ ܕܪ
  choice: à travers toutes les générations
  rationale: Exprime la continuité historique de la patience divine, et non un seul acte ponctuel.
- source_word: ܟܠܗܘܢ ... ܕܚܛܝܢ ܘܡܙܕܩܝܢ
  choice: tous ceux qui naissent, tant les pécheurs que les justes
  rationale: Maintient l’universalité et le contraste moral du texte sans suggérer que les deux catégories reçoivent nécessairement le même jugement final.
theological_decisions:
- issue: Portée de la patience divine envers pécheurs et justes
  choice: La patience du Très-Haut s’étend à tous ceux qui naissent, pécheurs comme justes.
  alternative: Comprendre cette patience comme visant seulement les pécheurs, les justes étant mentionnés à part.
  rationale: La syntaxe transmise coordonne les deux groupes sous la même affirmation générale; la traduction garde cette tension sans en tirer une conclusion doctrinale sur leur destinée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’adresse au singulier (« toi ») suivie d’un sujet coordonné et d’un verbe au pluriel (« vous verrez »).
