  yaml_path: translation/extra_canonical/2_baruch/024/004.yaml
  text: For I know what has happened to us, but what will happen to our enemies I do not know, nor when you will visit your works.”
translation:
  language: fr
  text: Car je sais ce qui nous est arrivé, mais j’ignore ce qui arrivera à nos ennemis, et je ne sais pas non plus quand tu visiteras tes œuvres[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « visiter » signifie intervenir à l’égard de ses œuvres, que ce soit pour les examiner, les juger ou leur venir en aide.
    reason: Le sens biblique de « visiter » est plus large que celui d’une simple visite et doit rester théologiquement ouvert.
lexical_decisions:
- source_word: ܓܕܫ
  choice: arriver
  rationale: Le verbe syriaque exprime ce qui survient ou advient; « arriver » convient naturellement aux deux volets de la phrase.
- source_word: ܣܥܪ / ܦܩܕ (sens probable dans la portion lacunaire)
  choice: visiter
  rationale: Le français biblique « visiter » conserve l’éventail de sens de l’intervention divine — examen, jugement ou secours — sans le réduire à une seule interprétation.
- source_word: ܥܒܕ̈ܝܟ
  choice: tes œuvres
  rationale: « Œuvres » garde la référence ouverte aux actes ou aux créatures relevant de Dieu, conformément à la formulation transmise.
theological_decisions:
- issue: Sens de la visite divine
  choice: « quand tu visiteras tes œuvres »
  alternative: « quand tu interviendras en faveur de tes œuvres »
  rationale: La traduction retenue préserve l’ambivalence théologique entre jugement, inspection et intervention bienveillante.
- issue: Portée du malheur subi
  choice: « ce qui nous est arrivé »
  alternative: « ce qui m’est arrivé »
  rationale: Le texte de consultation et le contexte collectif indiquent « nous », même si la portion syriaque visible et imparfaitement délimitée peut présenter une forme à la première personne du singulier.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination a été légèrement explicitée pour rendre clairement les deux objets de l’ignorance, tout en conservant la tension et l’ambiguïté du langage de la visite divine.
