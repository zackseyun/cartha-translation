revisions:
- from: 1 Car voici que viennent des jours où seront ouverts les livres dans lesquels sont écrits les péchés de tous ceux qui ont péché, ainsi que les réserves où est rassemblée la justice de tous ceux qui ont été justes dans la création.
  to: 1 Car voici, des jours viennent où les livres seront ouverts, dans lesquels sont écrits les péchés de tous ceux qui ont péché, ainsi que les chambres des trésors où est rassemblée la justice de tous ceux qui ont été justes dans la création.
  rationale: Révision limitée à la fluidité de l'annonce et au rendu de ܒܝܬ ܓܙ̈ܐ. La formulation conserve l'ambiguïté de « dans la création » et ne précise pas la nature ni le mode d'évaluation de la justice réunie.
