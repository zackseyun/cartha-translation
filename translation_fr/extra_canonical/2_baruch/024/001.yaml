  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: fr
  text: 1 Car voici, des jours viennent où les livres seront ouverts, dans lesquels sont écrits les péchés de tous ceux qui ont péché, ainsi que les chambres des trésors où est rassemblée la justice de tous ceux qui ont été justes dans la création.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܬ̈ܒܐ (reconstitué d’après le contexte textuel contrôlé)
  choice: les livres
  rationale: Désigne les registres célestes qui doivent être ouverts; « livres » conserve l’image concrète du texte sans l’expliciter.
- source_word: ܚܛܗ̈ܐ / ܚܛܘ
  choice: les péchés / ont péché
  rationale: Maintient en français la répétition étymologique du texte source.
- source_word: ܒܝܬ ܓܙ̈ܐ
  choice: les réserves
  rationale: Rend l’idée de lieux où quelque chose est conservé ou accumulé, sans imposer l’image plus étroite de coffres matériels.
- source_word: ܙܕܝܩܘܬܐ / ܐܙܕܕܩܘ
  choice: la justice / ont été justes
  rationale: Préserve le lien lexical entre la qualité rassemblée et les personnes qui l’ont manifestée.
- source_word: ܒܒܪܝܬܐ
  choice: dans la création
  rationale: Traduction formelle qui conserve la portée potentiellement cosmique de l’expression au lieu de la réduire à « durant leur vie » ou « dans le monde ».
theological_decisions:
- issue: Nature de la justice conservée
  choice: « la justice [...] est rassemblée »
  alternative: « les actes justes [...] sont consignés »
  rationale: Le texte parle abstraitement de « justice » et oppose son rassemblement à l’inscription des péchés. La traduction ne transforme donc pas cette justice en une catégorie doctrinale plus précise.
- issue: Portée de « dans la création »
  choice: Conserver l’expression littérale
  alternative: « parmi les créatures » ou « dans le monde créé »
  rationale: La formulation source peut désigner le cadre de la création sans préciser davantage le rapport des justes à celle-ci; l’ambiguïté est maintenue.
translation_notes:
  register: Français international actuel, solennel mais accessible. « Car voici que viennent des jours » garde la force d’annonce du passage; la syntaxe parallèle conserve l’opposition entre les péchés écrits dans les livres et la justice rassemblée dans les réserves.
