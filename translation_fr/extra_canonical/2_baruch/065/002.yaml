  yaml_path: translation/extra_canonical/2_baruch/065/002.yaml
  text: For he committed much impiety, and he killed the righteous, and he perverted the law, and he shed innocent blood, and he polluted the sanctuary, and he caused the people to sin.
translation:
  language: fr
  text: 'Car il commit beaucoup d’impiétés : il tua les justes, pervertit la Loi, répandit le sang innocent, profana le sanctuaire et entraîna le peuple dans le péché.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ
  choice: les justes
  rationale: Rend directement le pluriel syriaque désignant ceux qui sont tenus pour droits ou fidèles devant Dieu.
- source_word: ܚܛܝܬܐ
  choice: le péché
  rationale: Terme français courant et théologiquement non restrictif pour le syriaque désignant le péché.
- source_word: ܡܕܒܚܐ
  choice: le sanctuaire
  rationale: Dans ce contexte cultuel, « sanctuaire » restitue naturellement le lieu sacré profané, sans le réduire au seul autel.
theological_decisions:
- issue: Sens de la loi pervertie
  choice: la Loi
  alternative: la loi
  rationale: La majuscule indique ici la Loi donnée à Israël, sans préciser davantage une interprétation confessionnelle.
- issue: Responsabilité de Manassé dans le péché du peuple
  choice: entraîna le peuple dans le péché
  alternative: fit pécher le peuple
  rationale: Cette formulation exprime la causalité morale du texte tout en restant naturelle en français et sans supprimer la responsabilité du peuple.
translation_notes:
  register: Français moderne, digne et accessible. La série cumulative des actes mauvais est conservée, avec deux-points après l’énoncé général afin de présenter les précisions qui suivent. Aucun renvoi aux anciennes variantes désalignées du verset 1 n’est retenu.
