  yaml_path: translation/extra_canonical/2_baruch/065/001.yaml
  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: fr
  text: Après Manassé vint Amon. En son temps, il pensait que le Puissant ne demanderait pas compte de ces choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܐ
  choice: vint
  rationale: Dans la formule narrative qui suit « après Manassé », ce verbe d’existence ou de survenue introduit Amon. « Vint » reste proche du syriaque sans ajouter explicitement l’idée de succession royale.
- source_word: ܘܡܬܚܫܒ
  choice: il pensait
  rationale: Le verbe exprime ici une conviction ou un raisonnement intérieur, non une déclaration publique.
- source_word: ܒܙܒܢܗ
  choice: en son temps
  rationale: Cette formulation conserve la portée temporelle et le renvoi à l’époque d’Amon dans un français naturel.
- source_word: ܚܝܒܘܬܐ
  choice: demanderait compte
  rationale: La tournure française garde la nuance judiciaire du passage sans la réduire à l’idée plus précise de punition.
- source_word: ܡܪܝܐ / désignation divine reflétée par le contexte contrôlé
  choice: le Puissant
  rationale: Cette désignation divine concorde avec le texte de consultation et conserve un titre sobre sans introduire une appellation confessionnelle.
theological_decisions:
- issue: Nature du jugement divin attendu
  choice: ne demanderait pas compte de ces choses
  alternative: ne punirait pas ces actes
  rationale: Le choix retenu préserve la portée judiciaire tout en évitant de préciser que la reddition de comptes prend nécessairement la forme d’une punition immédiate.
translation_notes:
  register: Français international actuel, sobre et narratif. « Après Manassé vint Amon » conserve la concision de la formule syriaque; aucune note n’est ajoutée, car l’ancienne variante « Amon agit avec impiété » n’est pas soutenue par le texte syriaque.
