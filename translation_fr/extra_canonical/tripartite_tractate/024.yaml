  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: fr
  text: 'Par inclination à la compassion, notre Sauveur est devenu semblable à ce qu’étaient devenus, sous l’effet d’une passion instinctive, ceux pour lesquels il est apparu : chair et âme, qui les dominent sans cesse, si bien qu’ils se détruisent et meurent. Quant à ceux qui [vinrent à l’existence] […] [comme] invisibles, il leur enseigna invisiblement ce qui le concernait.[a] Non seulement il prit sur lui la mort de ceux qu’il voulait sauver, mais il assuma aussi la petitesse dans laquelle ils étaient tombés lorsqu’ils étaient nés avec un corps et une âme, car il consentit à naître enfant, avec un corps et une âme. Il prit part à toutes les autres conditions que partageaient ceux qui étaient tombés, bien qu’ils possèdent la lumière et que lui-même soit élevé au-dessus d’eux, car il consentit à être conçu sans péché, sans souillure et sans corruption. Il fut engendré dans la vie physique tout en demeurant dans la Vie, car il avait été décidé que tous deux deviendraient pareillement corps
    et âme, à cause de la passion et de l’inclination changeante issue de la Parole, qui s’était mise en mouvement dans un retournement.[b]


    Mais, conformément au plan du salut, c’est lui qui prit sur lui les effets de ce que nous avons mentionné plus haut, c’est-à-dire ce qui vint à l’existence à partir de la vision illuminatrice et de la pensée ferme de la Parole, après son retournement sur elle-même, après qu’elle se fut mise en mouvement. C’est ainsi que ceux qui, comme lui, assumèrent un corps et une âme reçurent aussi affermissement, stabilité et sagesse.[c] Il avait été décidé d’avance qu’ils se rassembleraient lors de la venue du Sauveur, elle aussi décidée d’avance. Ce fut seulement lorsque le Sauveur eut pris sa décision qu’ils vinrent, eux aussi. Ils vinrent donc, surpassant de beaucoup, dans leur émanation charnelle, ceux qui avaient été produits à partir de la déficience […] ; car c’est ainsi qu’eux aussi connurent une émanation corporelle, comme le Sauveur, par la révélation de leur union avec lui.[d]


    Ce sont ceux qui sont d’une seule substance, à savoir la substance spirituelle. Le plan du salut, toutefois, présente une diversité : ceci est une chose, cela en est une autre. Les uns proviennent de la passion et de la division et ont besoin de guérison. Les autres procèdent de la prière qui guérit les malades et sont chargés de soigner ceux qui sont tombés : ce sont les apôtres et les proclamateurs du message. Ils sont les disciples du Sauveur et les instructeurs de ceux qui ont besoin d’enseignement.


    Pourquoi donc prennent-ils part aux mêmes passions que ceux qui ont été produits à partir de la passion, si, conformément au plan du salut, ils ont été produits en un seul corps avec le Sauveur, qui, lui, n’a pas pris part à de telles passions ? Le Sauveur était l’image d’une entité unique : il était la Totalité sous une forme corporelle. Il conserva donc le modèle de l’inséparabilité, d’où vient l’impassibilité.[e] Mais eux sont les images de chacun de ceux qui furent révélés. C’est pourquoi ils admettent la séparation d’avec leur modèle, puisqu’ils ont pris forme pour la plantation qui existe sous le ciel et qui, elle aussi, […] prend part au mal dominant dans les lieux qu’ils ont atteints.[f] En effet, la volonté a tenu la Totalité captive sous le péché, afin que, par la volonté, il puisse faire miséricorde à la Totalité et qu’ils puissent être sauvés, puisque celui qui est unique est choisi pour donner la vie, tandis que tous les autres ont besoin du salut.[g]


    C’est pourquoi il fut le premier parmi ceux qui reçurent la grâce de dispenser les dons proclamés par ceux qu’il jugea dignes de les annoncer à d’autres. En effet, la semence de la promesse de Jésus Christ fut mise en place, elle dont nous avons servi la révélation et l’union. La promesse rendit possible l’enseignement, et même le retour à ce qu’ils étaient au commencement. Ils possèdent une goutte qui les incline à y retourner. C’est ce qu’ils appellent la « rédemption » : la libération de la captivité et l’accès à la liberté.


    La captivité est celle de ceux qui étaient asservis à l’ignorance. La liberté, en revanche, est la connaissance de la vérité qui existait avant l’ignorance et demeure éternellement, sans commencement ni fin. Elle est ce qui est bon, un remède à tout et la délivrance de la nature asservissante qui faisait souffrir ceux qui avaient été produits dans une pensée inférieure de la vacuité : la nature de l’inclination mauvaise […] au moyen de la pensée qui les rabaisse jusqu’au désir de dominer.[h] Grâce à la richesse de la grâce qui porta son regard sur les enfants, ils reçurent le trésor de la liberté. La liberté abat la passion et détruit les choses qu’elle avait auparavant rejetées loin d’elle-même, lorsque la Parole les avait séparées d’elle-même.[i] Il les destina à la destruction jusqu’à ce que le plan du salut parvienne à son terme, et il leur permit de continuer d’exister parce qu’elles aussi étaient utiles à ce qui avait été décidé d’avance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte est lacunaire et sa syntaxe reste incertaine : les mots restitués entre crochets correspondent à des éléments proposés dans le témoin de travail.'
    reason: Signaler une lacune manuscrite qui affecte directement le sens.
  - marker: b
    text: « Tous deux » n’a pas d’antécédent entièrement assuré. « Retournement » peut aussi être compris comme « conversion » ou « réorientation ».
    reason: Préserver deux ambiguïtés importantes du passage sans les résoudre dans le corps du texte.
  - marker: c
    text: La phrase du témoin est grammaticalement incomplète ; « reçurent aussi » explicite seulement le lien syntaxique probable avec la liste qui suit.
    reason: Rendre le français lisible tout en déclarant l’incertitude de la reconstruction.
  - marker: d
    text: Une lacune intervient après « déficience » ; elle peut avoir contenu un élément nécessaire à l’enchaînement logique.
    reason: Le défaut matériel du texte peut modifier la comparaison entre les groupes.
  - marker: e
    text: Ici, « impassibilité » désigne l’absence de sujétion aux passions ; le mot ne signifie pas nécessairement absence de toute souffrance.
    reason: Éviter un contresens courant sur un terme philosophique et théologique technique.
  - marker: f
    text: Une lacune coupe la description de la « plantation » sous le ciel. Ce terme peut désigner ce qui est planté, une semence ou un ensemble implanté.
    reason: Conserver une image technique obscure et signaler les possibilités lexicales.
  - marker: g
    text: Le référent de « la volonté » et celui du pronom « il » ne sont pas certains dans le témoin disponible.
    reason: Ne pas attribuer sans preuve l’action à une figure théologique déterminée.
  - marker: h
    text: Le passage est lacunaire et son articulation syntaxique est incertaine ; « au moyen de la pensée » peut se rattacher de plusieurs manières aux expressions précédentes.
    reason: Avertir que la relation entre vacuité, inclination mauvaise et désir de domination n’est pas entièrement assurée.
  - marker: i
    text: 'Les pronoms et leurs référents fluctuent dans cette phrase : « elle » peut renvoyer à la liberté, tandis que le second mouvement de séparation est attribué à la Parole.'
    reason: Préserver l’obscurité du témoin plutôt que d’imposer une chaîne de référents conjecturale.
lexical_decisions:
- source_word: mercy
  choice: compassion / faire miséricorde
  rationale: « Compassion » exprime naturellement l’élan initial, tandis que « faire miséricorde » convient à l’action salvatrice ultérieure ; le même champ sémantique est maintenu sans rigidité artificielle.
- source_word: Savior
  choice: Sauveur
  rationale: Terme français courant, digne et historiquement approprié au vocabulaire sotériologique du traité.
- source_word: soul
  choice: âme
  rationale: Équivalent traditionnel et intelligible, conservant l’anthropologie duale du passage sans la réinterpréter.
- source_word: Word
  choice: Parole
  rationale: Rend le titre conceptuel et personnel avec une majuscule, sans imposer systématiquement le calque savant « Logos ».
- source_word: conversion / self-conversion
  choice: retournement / retournement sur elle-même
  rationale: « Retournement » préserve l’idée de réorientation ou de retour sans réduire le terme à la conversion morale moderne.
- source_word: plan of salvation
  choice: plan du salut
  rationale: Expression claire et naturelle qui conserve la dimension ordonnée de l’économie salvatrice.
- source_word: emanation
  choice: émanation
  rationale: Le terme technique est conservé, car une paraphrase comme « naissance » effacerait la cosmologie particulière du traité.
- source_word: deficiency
  choice: déficience
  rationale: Conserve le caractère technique et ontologique de la notion, plutôt que de la banaliser en « manque ».
- source_word: Totality
  choice: Totalité
  rationale: La majuscule signale un concept cosmologique défini sans trancher sa portée théologique exacte.
- source_word: impassability
  choice: impassibilité
  rationale: Terme philosophique précis désignant l’absence de sujétion aux passions, à ne pas confondre avec l’insensibilité.
- source_word: planting
  choice: plantation
  rationale: Le substantif concret et inhabituel est maintenu afin de ne pas résoudre une image ou un terme technique obscur.
- source_word: redemption
  choice: rédemption
  rationale: Le texte donne lui-même une définition de ce terme ; le mot traditionnel permet de préserver ce lien explicatif.
- source_word: panacea
  choice: remède à tout
  rationale: Formulation moderne et immédiatement compréhensible qui conserve la portée universelle de l’image.
theological_decisions:
- issue: Participation du Sauveur à la condition humaine
  choice: Employer « assuma », « prit part » et « consentit à naître », selon les propositions du texte
  alternative: Uniformiser par « s’incarna »
  rationale: Le passage développe plusieurs aspects distincts de l’abaissement du Sauveur ; le terme doctrinal unique « incarnation » réduirait cette diversité.
- issue: Conception sans péché, souillure ni corruption
  choice: Conserver les trois qualifications sans explication
  alternative: Les harmoniser avec une doctrine confessionnelle précise de la conception ou de la naissance
  rationale: Le texte affirme l’absence de péché et de corruption, mais ne précise pas ici le mécanisme doctrinal ; aucune précision confessionnelle n’est importée.
- issue: Référent de « tous deux »
  choice: Maintenir « tous deux »
  alternative: Identifier explicitement le Sauveur et un groupe déterminé
  rationale: L’antécédent demeure obscur dans le témoin disponible ; expliciter ferait disparaître une ambiguïté réelle.
- issue: Unité de substance des êtres spirituels
  choice: « d’une seule substance, à savoir la substance spirituelle »
  alternative: Employer un vocabulaire conciliaire comme « consubstantiels »
  rationale: Le calque conciliaire pourrait importer une controverse et une précision postérieures étrangères à ce contexte.
- issue: Impassibilité du Sauveur
  choice: Conserver « impassibilité » et la tension avec sa participation aux conditions humaines
  alternative: Expliquer que ses souffrances étaient seulement apparentes ou pleinement identiques à celles des autres
  rationale: Le traité juxtapose incarnation, participation et impassibilité ; la traduction ne doit pas résoudre cette tension.
- issue: Agent de la captivité sous le péché
  choice: Conserver « la volonté » puis le pronom « il »
  alternative: Identifier la volonté à Dieu, au Sauveur ou à une autre entité
  rationale: Le changement grammatical et le référent sont difficiles ; une identification explicite dépasserait le témoignage fourni.
- issue: Nature de la liberté
  choice: « connaissance de la vérité »
  alternative: Réduire la liberté à un statut juridique ou moral
  rationale: Le traité définit explicitement la liberté en termes de connaissance antérieure à l’ignorance ; cette sotériologie propre doit rester audible.
- issue: Destruction finale des réalités passionnelles
  choice: Conserver leur destination à la destruction et leur utilité provisoire
  alternative: Identifier ces réalités à des personnes condamnées ou à de simples abstractions
  rationale: Le référent fluctue et reste incertain ; la traduction préserve cette indétermination.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les termes techniques propres à la cosmologie du traité — « émanation », « déficience », « Totalité », « impassibilité » — sont conservés lorsqu’une simplification effacerait un enjeu conceptuel. Les répétitions argumentatives sont maintenues, mais la syntaxe est légèrement réorganisée pour rester lisible. Ce projet demeure provisoire : il repose sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente.'
