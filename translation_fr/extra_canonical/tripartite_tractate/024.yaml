    C’est pourquoi il fut le premier parmi ceux qui reçurent la grâce de dispenser les dons proclamés par ceux qu’il jugea dignes de les annoncer à d’autres. En effet, <la> semence de la promesse de Jésus Christ fut mise en place, elle dont nous avons servi la révélation et l’union. La promesse rendit possible l’enseignement, et même le retour à ce qu’ils étaient au commencement. Ils possèdent une goutte qui les incline à y retourner. C’est ce qu’ils appellent la « rédemption » : la libération de la captivité et l’accès à la liberté.



