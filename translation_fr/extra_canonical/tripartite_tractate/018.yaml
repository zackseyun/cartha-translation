  - severity: low
    issue: « principe fondateur » atténue « foundational rule »
    rationale: Le témoin qualifie le Verbe de « foundational rule ». « Règle fondatrice » en rend plus directement la notion, tout en laissant intacte la syntaxe difficile de la comparaison avec le Père.
