translation:
  language: fr
  text: 'Il convient, [a] compte tenu de la prière qu’il a offerte et de la conversion qui en a résulté, que certains périssent, que d’autres en tirent profit et que d’autres encore soient mis à part. Il prépara d’abord le châtiment des désobéissants, en se servant d’une puissance venue de celui qui était apparu et de qui il avait reçu autorité sur toutes choses, afin d’être séparé de lui. Il est celui qui est en bas, et il demeure séparé du Très-Haut jusqu’à ce qu’il prépare, extérieurement, le dessein de salut pour toutes choses et donne à chacune la place qui lui est assignée.


    Le Verbe s’établit d’abord lui-même lorsqu’il ordonna les Totalités, comme principe fondateur, cause et dirigeant des êtres venus à l’existence, de même que le Père, cause de cet établissement, fut le premier à exister après lui.[b] Il créa les images préexistantes, qu’il produisit dans l’action de grâce et la glorification.


    Puis il ordonna le lieu destiné à ceux qu’il avait produits dans la gloire. Ce lieu est appelé « Paradis », « Délices », « Joie riche en nourriture » et « Joie des Préexistants ».[c] Il conserve l’image de tous les biens qui demeurent dans la Plénitude.


    Puis il ordonna le Royaume comme une ville remplie de tout ce qui est agréable, à savoir l’amour fraternel et une généreuse abondance, remplie [d] d’esprits saints et des puissances vigoureuses qui les gouvernent, que le Verbe produisit et établit avec puissance.


    Ensuite, il y avait, parmi ce qu’il ordonna, le lieu de l’Église qui se rassemble en ce lieu. Elle possède la forme de l’Église qui demeure dans les éons, pour la glorification du Père.


    Après cela, il ordonna le lieu destiné à la foi et à l’obéissance qui vient de l’espérance. Le Verbe reçut celles-ci lorsque la lumière apparut.[e]


    Ensuite, il ordonna le lieu de la disposition à la prière et à la supplication. Vinrent après cela le pardon et la parole au sujet de celui qui devait apparaître.


    Tout lieu spirituel subsiste dans une puissance spirituelle. Ces lieux diffèrent des êtres de la mémoire, car leur puissance repose sur une image : c’est ce qui sépare la Plénitude du Verbe.[f] En revanche, la puissance — qui agit dans la prophétie concernant l’avenir — guide les êtres de la mémoire, venus à l’existence en vue de ce qui préexiste.[g] Cela les empêche de se mêler aux choses qui parviennent à l’existence par une vision de celles qui demeurent auprès de lui.'
