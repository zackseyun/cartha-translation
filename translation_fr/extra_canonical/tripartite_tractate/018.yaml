lexical_decisions:
- source_word: Word
  choice: Verbe
  rationale: « Verbe » est le terme français traditionnel et intelligible pour le Logos personnel; la majuscule préserve son statut technique dans le traité.
- source_word: Totalities
  choice: Totalités
  rationale: La majuscule et le pluriel conservent le terme cosmologique collectif sans le réduire à « univers ».
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le terme technique correspondant au Plérôme tout en restant compréhensible en français courant.
- source_word: adorned
  choice: ordonna
  rationale: Dans cette série cosmologique, le verbe désigne à la fois l’aménagement et la mise en ordre; « ordonna » est plus naturel que la répétition de « para » ou « orna ».
- source_word: beings of the memory
  choice: êtres de la mémoire
  rationale: Traduction formelle qui conserve une expression technique obscure au lieu de lui imposer une interprétation.
- source_word: aeons
  choice: éons
  rationale: Terme technique courant en français pour les réalités ou âges supracosmiques du texte.
- source_word: conversion
  choice: conversion
  rationale: Maintient l’ambivalence entre retournement, changement d’orientation et conversion religieuse.
theological_decisions:
- issue: Référents des pronoms dans le premier paragraphe
  choice: Conserver les pronoms masculins sans identifier davantage les personnages
  alternative: Remplacer les pronoms par « le Verbe » ou par le nom supposé d’une puissance
  rationale: Le passage fourni ne permet pas de fixer tous les référents sans résoudre artificiellement son ambiguïté.
- issue: Relation chronologique exprimée par « the Father ... was first to exist after him »
  choice: 'Traduction littérale : « le Père ... fut le premier à exister après lui »'
  alternative: Réordonner la phrase pour faire du Verbe le premier après le Père
  rationale: La formulation du témoin est théologiquement tendue et peut refléter une difficulté textuelle ou syntaxique; elle ne doit pas être corrigée tacitement.
- issue: Séparation de la Plénitude et du Verbe
  choice: Conserver « c’est ce qui sépare la Plénitude du Verbe »
  alternative: Interpréter l’image comme frontière ou intermédiaire entre les deux
  rationale: Le rapport exact de l’image, de la puissance, de la Plénitude et du Verbe demeure syntaxiquement incertain.
- issue: « Church » comme réalité terrestre et éonique
  choice: Employer « Église » avec majuscule dans les deux occurrences
  alternative: Employer « assemblée » pour la communauté locale
  rationale: La répétition semble établir une correspondance entre deux réalités portant le même nom; la majuscule préserve ce lien conceptuel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques du traité portent une majuscule lorsqu’ils désignent des réalités cosmologiques personnifiées ou définies. La traduction est nécessairement provisoire, car elle repose sur le témoin anglais public fourni et la révision directe du copte reste à effectuer. Les lacunes et suppléments éditoriaux sont signalés par des notes appelées dans le texte.
