  terminology: Les choix techniques « Verbe », « Totalités », « Plénitude », « Église » et « éons » sont cohérents. « Ordonna » demeure une solution acceptable pour le verbe d’aménagement/mise en ordre, sans réduire le vocabulaire cosmologique à une interprétation doctrinale. Les notes maintiennent correctement les signaux textuels du témoin.
