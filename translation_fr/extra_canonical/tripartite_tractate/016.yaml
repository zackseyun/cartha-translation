    text: La syntaxe de cette phrase et l’identité exacte des groupes appelés « ceux de la ressemblance » et « ceux de la mémoire » sont incertaines dans le témoin disponible.
    reason: Signaler une obscurité textuelle et conceptuelle réelle sans imposer une reconstruction.
  - marker: b
