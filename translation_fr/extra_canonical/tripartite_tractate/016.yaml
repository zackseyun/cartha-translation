    reason: Préserver une ambiguïté pronominale que la version anglaise laisse également ouverte.
lexical_decisions:
- source_word: Word
  choice: Logos
  rationale: Dans le vocabulaire technique du traité, « Logos » conserve mieux qu’« Parole » la désignation personnelle et cosmologique, tout en restant reconnaissable en français moderne.
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le terme technique valentinien sans l’interpréter davantage ; la majuscule signale son emploi quasi personnel ou hypostatique.
- source_word: Repose
  choice: Repos
  rationale: Préserve le terme abstrait élevé et sa fonction technique, avec une majuscule.
- source_word: aeons
  choice: éons
  rationale: Translittération française courante du terme cosmologique, préférable à une paraphrase doctrinalement chargée.
- source_word: Totalities
  choice: Totalités
  rationale: Conserve l’abstraction collective et la majuscule du témoin, sans identifier prématurément son référent.
- source_word: He Who Is
  choice: Celui qui est
  rationale: Formulation française naturelle qui maintient l’écho ontologique et le statut de titre.
- source_word: likeness / memory
  choice: ressemblance / mémoire
  rationale: Traduction formelle de deux catégories techniques dont le sens précis reste obscur ; aucune explicitation spéculative n’est ajoutée.
- source_word: stature
  choice: stature
  rationale: Conserve l’image de grandeur verticale plutôt que de la réduire à « puissance » ou « gloire ».
theological_decisions:
- issue: Statut du Logos déficient
  choice: « le Logos déficient »
  alternative: « la Parole déficiente » ou « le Logos imparfait »
  rationale: « Déficient » garde l’idée de manque sans conclure à une imperfection morale ; « Logos » respecte la fonction technique du personnage.
- issue: Relation entre le producteur, le révélateur et les images
  choice: Maintien de la formulation « union entre celui qui… et celui qui… »
  alternative: Identifier les deux figures ou préciser la nature de l’union
  rationale: Le passage est textuellement endommagé et conceptuellement ambigu ; la traduction ne tranche pas l’identité des acteurs.
- issue: Référent du pronom final féminin
  choice: « Elle lui est révélée… il ne se mêle à elle »
  alternative: Remplacer par « le Père lui est révélé… il ne se mêle à lui »
  rationale: Le témoin emploie un pronom pouvant renvoyer à une notion féminine antérieure, probablement la perfection ou la foi ; l’ambiguïté est conservée et signalée.
- issue: Catégories « ressemblance » et « mémoire »
  choice: 'Les présenter comme des appartenances : « ceux qui appartiennent à… »'
  alternative: « les êtres de ressemblance / de mémoire »
  rationale: Cette formulation reste lisible sans définir ontologiquement des groupes dont la nature exacte n’est pas assurée.
- issue: « décision des éons »
  choice: Conserver le génitif ambigu
  alternative: « décision prise par les éons » ou « décision concernant les éons »
  rationale: Le rapport entre la décision et les éons n’est pas suffisamment certain pour être explicité.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des termes techniques majeurs (Logos, Plénitude, Repos, éons, Totalités). Les chevrons conservent les mots suppléés par l’éditeur et les crochets vides [] signalent les lacunes du manuscrit. Projet provisoire fondé sur le témoin anglais public fourni ; une collation directe avec le copte du Codex de Nag Hammadi I,5 reste requise.
