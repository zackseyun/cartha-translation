  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: fr
  text: 'Quand le Logos déficient fut illuminé, sa Plénitude vint à l’existence. Il échappa à ceux qui l’avaient troublé au commencement. Il se dégagea d’eux. Il se dépouilla de cette pensée orgueilleuse. Lorsque ceux qui lui avaient d’abord désobéi se prosternèrent et s’humilièrent devant lui, il se mêla au Repos.


    Et <il> se réjouit de la visite de ses frères venus le visiter. Il glorifia et loua ceux qui s’étaient révélés être pour lui une aide. Il rendit grâce d’avoir échappé à ceux qui s’étaient révoltés contre lui, et il estima et honora la Grandeur ainsi que ceux qui étaient résolus à se révéler à lui. Il engendra des images vivantes des figures vivantes. Elles sont agréables et bonnes, car elles proviennent de réalités vivantes et leur ressemblent par leur beauté ; pourtant, elles ne les égalent pas en vérité, parce qu’elles ne proviennent pas d’une union entre celui qui les a produites [] et celui qui s’est révélé à lui. Malgré cela, il œuvre avec sagesse et connaissance, mêlant entièrement le Logos à lui-même. Ainsi, ceux qui ont été produits à partir de lui sont grands, tout comme Celui qui est est véritablement grand.


    Après s’être émerveillé de la beauté de ceux <qui> lui étaient apparus, il exprima sa reconnaissance pour cette visite. Le Logos accomplit cette œuvre avec l’aide de ceux qui l’assistaient, à cause de la fermeté de ceux qui étaient venus à l’existence par lui, afin qu’ils puissent obtenir quelque chose de bon. Car il se souvint de prier pour le dessein de salut concernant tous ceux qu’il avait produits, dessein qui fut affermi afin de les établir.


    Ainsi, ceux qu’il produisit intentionnellement sont sur des chars, comme ceux qui vinrent à l’existence, ceux qui apparurent afin de pouvoir traverser tous les lieux de ce qui est en bas, pour que chacun d’eux reçoive la place conforme à sa nature.


    Cela entraîne la destruction de ceux qui appartiennent à la ressemblance, mais procure un bien à ceux qui appartiennent à la mémoire : c’est une révélation de ceux qui sont issus de la décision des éons, laquelle était unité et miséricorde, tandis qu’eux ne sont encore que des semences qui ne sont pas parvenues à la pleine existence.[a]


    Celui qui apparut était un visage du Père et de l’harmonie. Il était un vêtement de toutes les grâces et une nourriture pour ceux que le Logos produisit tandis qu’il priait, glorifiait et louait. C’est celui-là qu’il glorifia et loua [] tout en regardant ceux qu’il suppliait, afin de pouvoir les rendre parfaits au moyen des images qu’il avait produites.


    Le Logos fit croître leur aide mutuelle et leur espérance en la promesse, car ils possèdent la joie, une abondance de repos et des délices sans souillure. Accordant la perfection avec la vision pour but, il engendra ceux dont il s’était souvenu au commencement, alors qu’ils n’étaient pas encore avec lui. Il demeure dans l’espérance et la foi au Père parfait, tout comme les Totalités. Elle lui est révélée avant qu’il ne se mêle à elle,[b] afin que ceux qui sont venus à l’existence ne périssent pas en contemplant la lumière, puisqu’ils sont incapables de supporter cette stature immense et élevée.'
