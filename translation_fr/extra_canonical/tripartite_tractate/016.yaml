  terminology: « Logos », « Plénitude », « Repos », « éons », « Totalités » et « Celui qui est » sont des choix cohérents pour ce traité. Les catégories obscures de la ressemblance et de la mémoire restent non interprétées.
  issues:
  - severity: medium
    issue: Le pronom féminin final (« Elle lui est révélée… il ne se mêle à elle ») impose un genre et oriente le référent.
    rationale: Le témoin anglais emploie le neutre « It », dont l'antécédent demeure incertain. En français, « Cela lui est révélé avant qu'il ne s'y mêle » préserve mieux l'indétermination sans postuler une réalité féminine.
  - severity: low
    issue: « Cela entraîne la destruction… mais procure un bien… » est plus interprétatif et moins direct que le prédicat du témoin.
    rationale: « Cela est destructeur… mais bénéfique… » restitue plus exactement l'opposition descriptive de l'anglais sans modifier le sens.
