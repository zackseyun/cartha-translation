translation:
  language: fr
  text: 'La pensée du Verbe, qui avait retrouvé sa stabilité et en était venu à régner sur ceux qui avaient reçu l’existence par lui, fut appelée « Éon » et « Lieu » pour tous ceux qu’il avait produits conformément à la décision. Elle fut même appelée « Synagogue du salut », parce qu’il s’était guéri de la dispersion qu’est la pensée multiple et était revenu à la pensée unique. Elle est aussi appelée « Dépôt », à cause du repos qu’il avait obtenu et qu’il s’était accordé à lui seul.[a] Elle est encore appelée « Épouse », à cause de la joie de celui qui s’était livré à lui dans l’espoir que leur union porte du fruit, celui-là même qui lui était apparu. Elle est également appelée « Royaume », à cause de la fermeté qu’il avait acquise en se réjouissant de dominer ceux qui lui avaient fait la guerre. Enfin, elle est appelée « Joie du Seigneur », à cause de l’allégresse dont[b] il s’était revêtu. La lumière demeure avec lui et lui accorde en retour les biens qui lui appartiennent, c’est-à-dire
    les pensées[c] de liberté.


    L’éon dont nous avons parlé plus haut est supérieur aux deux ordres qui se combattent. Il n’est pas l’allié de ceux qui exercent le pouvoir et il ne relève pas des infirmités ni des faiblesses, choses qui appartiennent au souvenir et à la ressemblance. Ce dans quoi le Verbe s’était établi était un éon rempli de joie, qui possédait la forme de la matière tout en ayant la nature de sa cause, laquelle avait été révélée. En effet, cet éon était une image de ceux qui demeurent dans la Plénitude et qui sont venus à l’existence grâce aux richesses de la joie de Celui qui est.


    De plus, se réjouissant devant la face de celui qui s’était révélé, dans ses <délices>[d], son attente et la promesse de ce qu’il avait demandé, il possédait le nom du Fils, ainsi que son essence, sa puissance et sa forme. Celui-ci était celui qu’il aimait et en qui il prenait plaisir,[e] celui pour qui des prières avaient été offertes avec amour. Cet éon était une lumière, un désir d’être affermi, une disposition à recevoir l’enseignement et un œil pour voir : autant de qualités qu’il tenait des êtres élevés. Il était aussi sagesse pour sa pensée, face à ceux qui se trouvaient plus bas dans le plan du salut, parole pour parler, et perfection de toutes les autres choses semblables.


    Quant à ceux qui avaient pris forme avec lui selon l’image de la Plénitude, leurs parents sont ceux qui s’étaient révélés, chacun étant la copie de l’une des figures. Puisqu’ils sont des formes masculines et ne proviennent pas de l’infirmité qu’est le féminin, ils proviennent de celui qui avait déjà échappé à l’infirmité. <Ils>[f] portent le nom d’« Église », parce qu’ils ressemblent harmonieusement à l’harmonie de l’assemblée de ceux qui se sont manifestés. Ce qui est venu à l’existence à l’image de la lumière est également parfait, puisque c’est une image de l’unique lumière existante, qui est les Totalités. Même si cette image est inférieure à ce dont elle est l’image, elle en possède néanmoins le caractère inséparable, car elle est une face de la lumière inséparable.


    Cependant, ceux qui sont venus à l’existence à l’image de chacun des éons sont, par leur essence, ce que nous avons mentionné plus haut ; mais par leur énergie, ils sont inégaux, car celle-ci réside différemment en chacun d’eux. Dans leur union les uns avec les autres, ils sont égaux,[g] mais chaque éon a conservé les différences qui lui sont propres. Voilà pourquoi ils éprouvent des passions, la passion étant une infirmité. En effet, ils n’ont pas été produits à partir de l’unité de la Plénitude, mais prématurément, à partir d’un seul, avant que celui-ci ne la reçoive du Père, ou à partir de l’unité avec sa Totalité et sa volonté.


    Malgré cela, la chose était utile au futur plan du salut. Il leur fut permis de traverser les lieux inférieurs, car ces lieux ne peuvent supporter leur arrivée soudaine, si ce n’est un par un. Leur venue est nécessaire, puisque tout sera mené à son accomplissement par eux.


    En somme, le Verbe reçut la vision de toutes choses : de celles qui étaient, de celles qui sont maintenant et de celles qui seront, car le plan du salut de tout ce qui existe lui a été confié. Certaines choses sont déjà parvenues à l’existence, car un dessein les concernait. En revanche, il a gardé en lui-même les semences qui doivent encore venir à l’existence, à cause de la promesse relative à ce qu’il avait conçu, promesse concernant les semences encore à venir. Puis il produisit sa descendance, c’est-à-dire la révélation de ce qu’il avait conçu. Toutefois, pendant un temps, les semences promises furent empêchées de venir à l’existence, car elles ont été destinées à une mission pour le temps où viendront le Sauveur et ses compagnons, ceux qui sont les premiers dans la connaissance et la gloire du Père.'
