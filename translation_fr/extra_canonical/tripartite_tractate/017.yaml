    De plus, se réjouissant devant la face de celui qui s’était révélé, dans ses <délices>[d], son attente et la promesse de ce qu’il avait demandé, il possédait le nom du Fils, ainsi que son essence, sa puissance et sa forme. Celui-ci était celui qu’il aimait et en qui il prenait plaisir,[e] celui pour qui des prières avaient été offertes avec amour. Cet éon était une lumière, un désir d’être affermi, une disposition à recevoir l’enseignement et un œil pour voir : autant de qualités qu’il tenait des êtres élevés. Il était aussi sagesse pour sa pensée, face à ceux qui se trouvaient plus bas dans le plan du salut, parole pour parler, et perfection d’autres réalités semblables.



    Quant à ceux qui avaient pris forme avec lui selon l’image de la Plénitude, leurs parents sont ceux qui se sont révélés, chacun étant la copie de l’une des figures. Ils sont des formes masculines et ne proviennent pas de l’infirmité qu’est le féminin ; ils proviennent de celui qui avait déjà échappé à l’infirmité. <Ils>[f] portent le nom d’« Église », parce qu’ils ressemblent harmonieusement à l’harmonie de l’assemblée de ceux qui se sont manifestés. Ce qui est venu à l’existence à l’image de la lumière est également parfait, puisque c’est une image de l’unique lumière existante, qui est les Totalités. Même si cette image est inférieure à ce dont elle est l’image, elle en possède néanmoins le caractère inséparable, car elle est une face de la lumière inséparable.



    Cependant, ceux qui sont venus à l’existence à l’image de chacun des éons sont, par leur essence, ce que nous avons mentionné plus haut ; mais par leur énergie, ils sont inégaux, car celle-ci réside différemment en chacun d’eux. Dans leur union les uns avec les autres, ils sont égaux,[g] mais chaque éon a conservé les différences qui lui sont propres. Voilà pourquoi ils éprouvent des passions, la passion étant une infirmité. En effet, ils n’ont pas été produits à partir de l’unité de la Plénitude, mais prématurément, à partir d’un seul, avant que celui-ci ne la reçoive du Père, ou à partir de l’unité avec sa Totalité et sa volonté.



    Malgré cela, cela était utile au futur plan du salut. Il leur fut permis de traverser les lieux inférieurs, car ces lieux ne peuvent accueillir leur arrivée soudaine qu’un à la fois. Leur venue est nécessaire, puisque tout sera mené à son accomplissement par eux.



    En somme, le Verbe reçut la vision de toutes choses : de celles qui étaient, de celles qui sont maintenant et de celles qui seront, car le plan du salut de tout ce qui existe lui a été confié. Certaines choses sont déjà parvenues à l’existence, car un dessein les concernait. En revanche, il a gardé en lui-même les semences qui doivent encore venir à l’existence, à cause de la promesse relative à ce qu’il avait conçu, promesse concernant les semences encore à venir. Puis il produisit sa descendance, c’est-à-dire la révélation de ce qu’il avait conçu. Toutefois, pendant un temps, les semences promises furent empêchées de venir à l’existence, car elles ont été destinées à une mission pour le temps où viendront le Sauveur et ses compagnons, ceux qui sont les premiers dans la connaissance et la gloire du Père.'
