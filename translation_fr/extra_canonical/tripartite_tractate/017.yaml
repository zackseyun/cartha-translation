  footnotes:
  - marker: a
    text: Le témoin signale ici une lacune dans le manuscrit.
    reason: Conserver la visibilité d’une interruption matérielle du texte.
  - marker: b
    text: Le mot rendu par « dont » correspond à un élément fourni éditorialement dans le témoin afin de compléter la phrase.
    reason: Signaler une reconstruction syntaxique indiquée par les crochets de la traduction témoin.
  - marker: c
    text: Le pluriel « pensées » repose sur une correction éditoriale du témoin, qui marque l’ajout de la désinence du pluriel.
    reason: Préserver l’information textuelle portée par « thought<s> ».
  - marker: d
    text: « délices » est une restitution éditoriale d’un mot manquant ou endommagé.
    reason: Reproduire la prudence signalée par les chevrons du témoin.
  - marker: e
    text: Le témoin signale ici une lacune dans le manuscrit.
    reason: Conserver la visibilité d’une interruption matérielle du texte.
  - marker: f
    text: Le pronom « Ils » est restitué par les éditeurs.
    reason: Signaler que le sujet explicite n’est pas intégralement conservé dans le manuscrit.
  - marker: g
    text: Le témoin signale ici une lacune dans le manuscrit.
    reason: Conserver la visibilité d’une interruption matérielle du texte.
lexical_decisions:
- source_word: Word
  choice: Verbe
  rationale: Terme français traditionnel et intelligible pour le Logos personnifié ; il conserve la portée conceptuelle et théologique du passage.
- source_word: Aeon
  choice: Éon
  rationale: Maintien du terme technique de la cosmologie du traité, plutôt qu’une réduction à « époque » ou « monde ».
- source_word: Place
  choice: Lieu
  rationale: Équivalent formel qui conserve la fonction quasi titulaire du mot dans l’énumération.
- source_word: Synagogue of Salvation
  choice: Synagogue du salut
  rationale: Le terme distinctif « Synagogue » est conservé, sans l’assimiler silencieusement à « Église » ou à une simple assemblée.
- source_word: Storehouse
  choice: Dépôt
  rationale: « Dépôt » rend l’idée d’un lieu où quelque chose est gardé, dans un registre plus naturel et moins matériel qu’« entrepôt ».
- source_word: Fullness
  choice: Plénitude
  rationale: Équivalent français consacré du terme technique désignant la réalité plénière transcendante.
- source_word: He Who Is
  choice: Celui qui est
  rationale: Rend le titre ontologique sans lui substituer un nom divin confessionnel.
- source_word: Totalities
  choice: les Totalités
  rationale: Conservation du pluriel technique et de son étrangeté, afin de ne pas le confondre avec la seule « Plénitude ».
- source_word: energy
  choice: énergie
  rationale: Le terme abstrait et technique est maintenu ; « activité » aurait interprété plus fortement son sens.
- source_word: passions
  choice: passions
  rationale: Conserve la terminologie anthropologique du passage et son association explicite à l’infirmité.
- source_word: plan of salvation
  choice: plan du salut
  rationale: Expression claire qui préserve la dimension ordonnée et progressive de l’économie salvatrice décrite.
- source_word: seeds
  choice: semences
  rationale: « Semences » garde la métaphore générative et convient au registre cosmologique du traité.
theological_decisions:
- issue: Rapport entre l’éon, la pensée du Verbe et le Verbe
  choice: Conserver les alternances de genre et de référent imposées par le témoin, sans identifier systématiquement tous les pronoms.
  alternative: Harmoniser chaque pronom en faisant de l’éon ou du Verbe le sujet explicite.
  rationale: Le passage présente de réelles ambiguïtés référentielles ; les résoudre partout imposerait une lecture théologique non assurée.
- issue: Langage masculin et féminin
  choice: Traduire explicitement « formes masculines » et « l’infirmité qu’est le féminin ».
  alternative: Neutraliser ou reformuler ce contraste dans un langage contemporain.
  rationale: Ce contraste appartient à l’anthropologie symbolique problématique mais réelle du document ; le masquer altérerait le témoignage historique.
- issue: « les Totalités » comme lumière unique
  choice: Conserver la formulation paradoxale « l’unique lumière existante, qui est les Totalités ».
  alternative: Normaliser en « qui constitue la totalité » ou « qui rassemble toutes choses ».
  rationale: La syntaxe demeure difficile, mais sa tension métaphysique ne doit pas être résolue sans contrôle direct du copte.
- issue: Origine prématurée des êtres et réception depuis le Père
  choice: Maintenir les deux constructions possibles reliées par « ou ».
  alternative: Choisir une seule explication causale et réorganiser la phrase.
  rationale: Le témoin laisse subsister une alternative ou une coordination ambiguë ; la traduction la préserve.
- issue: Mission des semences lors de la venue du Sauveur
  choice: Rendre l’assignation temporelle et missionnelle sans identifier les semences à un groupe confessionnel précis.
  alternative: Interpréter les semences comme une catégorie doctrinale déterminée de personnes.
  rationale: Le texte ne justifie pas à lui seul une identification confessionnelle plus précise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques de la cosmologie du traité sont conservés et généralement signalés par une majuscule lorsqu’ils fonctionnent comme noms ou titres. La syntaxe a été assouplie lorsque cela n’effaçait pas les ambiguïtés du témoin. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe du copte du Codex de Nag Hammadi I,5 reste nécessaire, notamment pour les pronoms, les lacunes, les restitutions et plusieurs phrases syntaxiquement incertaines.
