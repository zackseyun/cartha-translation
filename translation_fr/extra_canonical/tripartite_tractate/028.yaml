  naturalness: Le français est globalement fluide et d’un registre approprié. Quelques ajustements mineurs améliorent la lisibilité sans lisser les constructions volontairement spéculatives ou ambiguës du traité, notamment « tout ce dont il est appelé » et « les belles réalités qu’il comprend ».
  terminology: « Totalités », « rédemption », « chambre nuptiale », « connaissance » et « immortalité » sont des choix adéquats. « Évangile » prend une majuscule par cohérence avec le registre du texte. Les signes critiques [], < > et <…> sont conservés tels que les transmet le témoin anglais, la vérification copte directe restant en attente.
  issues:
  - severity: medium
    issue: Les lacunes [] ont été remplacées dans le corps du texte par les appels « [a] » et « [b] ».
    rationale: Le témoin présente expressément des blancs textuels. Un appel de note ne doit pas se substituer au signe de lacune ; il faut maintenir [] et attacher la note séparément.
  - severity: medium
    issue: « <celui-ci a> connus » interprète le pronom restauré « <he has> » comme désignant le baptême.
    rationale: Le témoin conserve un pronom masculin personnel, dont le référent demeure incertain. « <il a> » préserve cette incertitude sans introduire un démonstratif référé au baptême.
  - severity: low
    issue: « Tous les noms qu’on lui donne » réduit légèrement la portée de « whatever it is called ».
    rationale: « Tout ce dont il est appelé » rend plus directement l’énoncé englobant du témoin, y compris les noms omis.
