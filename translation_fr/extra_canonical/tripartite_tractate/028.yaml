lexical_decisions:
- source_word: baptism
  choice: baptême
  rationale: Terme religieux français courant, qui conserve le motif rituel et théologique du passage.
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: La majuscule et le calque préservent le vocabulaire cosmologique technique du traité sans l’assimiler arbitrairement à « plérôme ».
- source_word: redemption
  choice: rédemption
  rationale: Conserve le terme sotériologique et son registre élevé plutôt que de le réduire à une simple délivrance.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Rendu littéral et intelligible qui préserve l’image technique du texte.
- source_word: deathlessness
  choice: immortalité
  rationale: Expression française naturelle correspondant à l’absence de mort, tout en gardant le lien explicatif avec « vie éternelle ».
- source_word: knowledge
  choice: connaissance
  rationale: Préserve la portée épistémique et spirituelle du terme sans introduire explicitement le mot doctrinal « gnose ».
- source_word: return
  choice: retour
  rationale: Maintient l’ambiguïté du mouvement de retour, sans préciser une destination que le témoin ne formule pas.
theological_decisions:
- issue: Rapport entre les noms trinitaires et l’unique nom de l’Évangile
  choice: Conserver « ces noms, [qui] sont l’unique nom » avec le crochet critique
  alternative: Harmoniser en « ce nom » ou expliquer l’unité trinitaire
  rationale: Le passage tient ensemble le pluriel et le singulier ; il ne faut ni corriger ni développer cette tension théologique.
- issue: Union du Père avec le croyant
  choice: « que le Père devienne un avec lui »
  alternative: « habite en lui » ou « l’unisse à lui »
  rationale: La formulation conserve la forte affirmation d’unité du témoin sans l’atténuer ni la systématiser.
- issue: Père et Dieu
  choice: « le Père et Dieu »
  alternative: « Dieu le Père »
  rationale: Le témoin signale une construction incertaine « Father (and) God » ; le rendu retenu garde la coordination possible sans imposer une lecture syntaxique différente.
- issue: Silence et dépassement du silence
  choice: Préserver les deux affirmations
  alternative: Interpréter le silence comme simple absence de parole
  rationale: Le texte nomme le baptême « silence » tout en affirmant qu’il dépasse tout silence ; cette tension apophatique est intentionnellement maintenue.
- issue: Transformation en lumière
  choice: « ceux qui la revêtent et ceux qu’elle revêt sont transformés en lumière »
  alternative: Réduire l’image à une illumination morale
  rationale: Le double mouvement du vêtement et la transformation ontologique apparente appartiennent au texte et ne doivent pas être affaiblis.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire technique du traité. Les crochets indiquent un texte incertain ou endommagé ; les chevrons conservent les restitutions éditoriales du témoin anglais public, puisque la vérification directe du copte reste à effectuer. La syntaxe a été légèrement fluidifiée sans résoudre les ambiguïtés métaphysiques ou théologiques.
