reference: Tripartite Tractate — The True Baptism
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  text: 'Regarding what is the true baptism, into which the Totalities descend and in which they come into existence, there is no other baptism besides this one, which is the redemption in God the Father, the Son and the Holy Spirit, when profession of faith is made in those names, [which] are a single name of the gospel, [] when someone has believed that the things told to them are reality.


    For someone who believes in their existence, this is to obtain, in an invisible manner, the Father, the Son, and the Holy Spirit by testifying with a firm faith and understanding them with a firm hope. Based on this, the attainment of that which someone has believed could become to them a return, so that the Father could become one with him, the Father (and) God, whom he has professed in faith, and who granted that he be made one with him in knowledge.


    The baptism we mentioned earlier is called “the garment <that> those who wear do not remove,” because it is donned by those who have received redemption. It is also called “the confirmation of the unfailing truth,” being unmoving and unshakable in a way that firmly grasps those who have received <restoration>, while they grasp it firmly. It is called “silence” on account of is quietness and its immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and that is without flame,” not because it fails to give light, but because those who don it and those whom it dons are transformed into light. It is also called “eternal life,” which is deathlessness.


    And so what it is called, including its names <omitted> here, accords with all the beauteous things it comprises in a mode that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How is it, then, to be named except as the Totality, so that even were it assigned countless names, they are spoken simply as a means of referring to it, when in fact it transcends all words, all voices, all thoughts, and it transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing an unspeakable and ungraspable face, glorified by those who possess knowledge through what they have grasped.'
