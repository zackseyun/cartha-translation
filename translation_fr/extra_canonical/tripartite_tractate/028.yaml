base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: fr
  text: 'Quant au véritable baptême, dans lequel les Totalités descendent et viennent à l’existence, il n’y a pas d’autre baptême que celui-ci : la rédemption en Dieu le Père, le Fils et le Saint-Esprit, lorsque l’on professe sa foi en ces noms, [qui] sont l’unique nom de l’Évangile, [a] lorsque quelqu’un croit que ce qui lui a été annoncé est réel.


    Pour celui qui croit à leur existence, cela consiste à recevoir, de manière invisible, le Père, le Fils et le Saint-Esprit, en témoignant avec une foi ferme et en les comprenant avec une espérance ferme. Sur cette base, l’obtention de ce en quoi quelqu’un a cru pourrait devenir pour lui un retour, afin que le Père devienne un avec lui — le Père et Dieu qu’il a confessé dans la foi et qui lui a accordé de devenir un avec lui dans la connaissance.


    Le baptême dont nous avons parlé plus haut est appelé « le vêtement <que> ceux qui le portent n’enlèvent pas », parce qu’il est revêtu par ceux qui ont reçu la rédemption. Il est aussi appelé « la confirmation de la vérité qui ne faillit pas », car il est immobile et inébranlable : il saisit fermement ceux qui ont reçu <la restauration>, tandis qu’eux-mêmes le saisissent fermement. Il est appelé « silence » à cause de son calme et de son immobilité. Il est aussi appelé « chambre nuptiale », en raison de l’état harmonieux et inséparable de ceux [que] <celui-ci a> connus <et qui> l’ont connu. Il est encore appelé [b] « la lumière qui ne se couche pas et qui est sans flamme », non parce qu’elle ne donne pas de lumière, mais parce que ceux qui la revêtent et ceux qu’elle revêt sont transformés en lumière. Il est aussi appelé « vie éternelle », c’est-à-dire l’immortalité.


    Ainsi, tous les noms qu’on lui donne, y compris ceux qui sont <omis> ici, correspondent à toutes les belles réalités qu’il contient, d’une manière simple, agréable, inséparable, complexe, parfaite et inébranlable. Comment donc le nommer, sinon la Totalité ? Même si on lui attribuait d’innombrables noms, ceux-ci ne seraient prononcés que comme une simple manière de le désigner, alors qu’en réalité il dépasse toute parole, toute voix et toute pensée ; il dépasse toute chose et il dépasse tout silence. Il en est ainsi <…> de ceux qui sont ce qu’il est.[c] Voilà véritablement ce qu’il est : il possède un visage indicible et insaisissable, et il est glorifié par ceux qui possèdent la connaissance, au moyen de ce qu’ils ont saisi.'
