base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: fr
  text: 'Les prophètes, toutefois, n’ont rien dit de leur propre volonté. Chacun d’eux a parlé de ce qu’il avait vu et entendu au sujet de l’annonce du Sauveur. Ce qu’il proclamait — et le thème central de leur proclamation —, c’était ce que chacun disait au sujet de la venue du Sauveur : qu’elle aurait lieu. Parfois, les prophètes en parlent comme s’il devait encore naître ; à d’autres moments, c’est comme si le Sauveur parlait par leur bouche, disant que le Sauveur viendrait et accorderait sa faveur à ceux qui ne le connaissaient pas. Ils n’ont donc pas tous tout dit de la même manière. En effet, selon la puissance donnée à chacun pour parler de lui et du lieu qu’il avait vu, chacun pensait que c’était de ce lieu que le Sauveur naîtrait et qu’il en viendrait. Ainsi, aucun d’eux ne savait d’où il viendrait ni qui l’engendrerait. Ils n’ont été jugés dignes de parler que de ceci : il naîtrait et souffrirait. Quant à sa préexistence et à son existence éternelle, sans avoir été engendré et
    incapable de souffrir, <…> non issu de la Parole, qui vint à l’existence dans la chair, [], cela ne leur est jamais venu à l’esprit.[a]


    Voici le message qu’ils furent inspirés à transmettre au sujet de sa chair, qui devait apparaître. Il est dit que cette naissance fut semblable à la leur à tous, mais que, par-dessus tout, elle venait de la Parole spirituelle, cause de tout ce qui est venu à l’existence. Celui dont le Sauveur reçut sa chair l’engendra bel et bien sous la forme d’une semence, lors de la révélation de la lumière, conformément à la parole promise de sa révélation, <étant> véritablement l’état d’<une> semence de <ce qui était>, bien qu’engendré en dernier.[b] Cependant, celui que le Père avait destiné à manifester le salut par son intermédiaire, celui qui est l’accomplissement de la promesse, reçut, lorsqu’il descendit dans la vie, tout ce qui était nécessaire à sa descente. Son Père est un, le seul qui soit véritablement un père pour lui : l’Invisible, l’Inconnaissable, insaisissable par nature, qui seul est Dieu et qui, par sa volonté et par son don, a accordé qu’il puisse être vu, connu et saisi.'
