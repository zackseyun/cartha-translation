lexical_decisions:
- source_word: Savior
  choice: Sauveur
  rationale: Équivalent français courant et digne, conservant le titre sotériologique sans précision confessionnelle ajoutée.
- source_word: Word
  choice: Parole
  rationale: Rend le terme théologique de façon intelligible en français et maintient son caractère personnel ou cosmologique sans imposer « Logos ».
- source_word: unbegotten
  choice: sans avoir été engendré
  rationale: Formulation transparente pour le lectorat moderne, plus accessible que le terme technique « inengendré ».
- source_word: impassible
  choice: incapable de souffrir
  rationale: Exprime directement le sens dans ce contexte et évite l’ambiguïté moderne d’« impassible », qui peut suggérer une simple absence d’émotion.
- source_word: bestow favor
  choice: accorderait sa faveur
  rationale: Conserve l’idée de faveur accordée sans préciser indûment s’il s’agit de grâce salvatrice, de bienveillance ou d’un autre bienfait.
- source_word: grasped
  choice: saisi
  rationale: Maintient le parallèle « vu, connu et saisi » ainsi que la tension entre perception, connaissance et appréhension.
theological_decisions:
- issue: Rapport entre la préexistence, l’existence éternelle, l’absence d’engendrement et la souffrance
  choice: Conserver les quatre affirmations dans leur juxtaposition et maintenir la lacune immédiatement après.
  alternative: Réorganiser la phrase pour harmoniser explicitement ces attributs avec l’incarnation.
  rationale: Le passage transmis est syntaxiquement endommagé et théologiquement tendu ; une harmonisation produirait une interprétation absente du témoin fourni.
- issue: Identité de « celui dont le Sauveur reçut sa chair »
  choice: Garder une désignation indéterminée.
  alternative: L’identifier explicitement à un père humain, à la Parole ou à une autre figure.
  rationale: Le témoin ne permet pas de fixer cette identité sans importation doctrinale.
- issue: Référent de « celui que le Père avait destiné » et de « par son intermédiaire »
  choice: Préserver la structure pronominale et la relative appositive.
  alternative: Nommer explicitement le Sauveur ou distinguer plusieurs êtres.
  rationale: Le texte laisse subsister une difficulté référentielle qu’il ne convient pas de résoudre silencieusement.
- issue: Visibilité et saisissabilité finales
  choice: Traduire sans ajouter explicitement le sujet logique de « puisse être vu, connu et saisi ».
  alternative: Préciser que Dieu, le Père ou le Sauveur devient visible et connaissable.
  rationale: L’antécédent demeure grammaticalement interprétable mais n’est pas assez sûr pour être explicité dans la traduction.
