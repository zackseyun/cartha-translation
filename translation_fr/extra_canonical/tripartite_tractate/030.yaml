translation:
  language: fr
  text: 'Voici la nature complète de l’engendrement, produit par ce que [le Christ] a porté lorsqu’il a resplendi sur eux [avec] une [lumière] qu’il a révélée […] comme la sienne […] qui sera […] comme la sienne […], tandis que la seule différence [qui] existe chez ceux qui étaient


    [5 lignes manquent]


    […] ceux qui existent […] par […] comme [je l’ai] dit plus haut. Quant aux êtres matériels, ils seront abandonnés jusqu’à la fin pour être détruits, parce qu’ils ne donneront pas leurs [noms], s’ils retournent encore une fois à ce qui [ne sera pas]. De même qu’ils étaient […] ils n’étaient pas […] mais ils furent utiles [pendant] le temps où ils demeurèrent parmi eux, bien qu’ils n’aient pas été […] au commencement. Alors […] agir autrement, grâce à l’autorité qu’ils possédaient dans la préparation, [afin de] leur résister.


    Bien que j’emploie continuellement ces paroles, [je n’ai pas réussi à saisir] les pensées. Certains anciens […] sa grandeur.


    [5 ou 6 lignes manquent]


    […] chaque […] ange […] des paroles [et] un [son] de trompette, proclamant le grand rétablissement complet depuis l’Orient rayonnant, dans la chambre nuptiale, qui est l’amour de Dieu le [Père], conformément à la puissance qui […] de la grandeur […], la douceur de […] qui est à lui, parce qu’il se révèle aux grandeurs […] sa bonté […] la louange, le règne et la [gloire], par [Jésus-Christ], le Seigneur, le Sauveur, le Rédempteur de tous ceux qu’enveloppe celui qui est rempli de tendre miséricorde, par [son] Esprit saint, dès maintenant, de génération en génération, pour les siècles des siècles. Amen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begetting
  choice: engendrement
  rationale: Conserve le sens abstrait de génération ou de production sans préciser indûment s’il s’agit d’une naissance physique ou d’un processus cosmologique.
- source_word: material ones
  choice: êtres matériels
  rationale: Rend une catégorie de personnes ou d’entités caractérisées par la matière, tout en évitant le terme plus doctrinal « hyliques ».
- source_word: control
  choice: autorité
  rationale: Dans ce contexte, désigne vraisemblablement un pouvoir exercé ou détenu; « autorité » reste naturel tout en préservant cette nuance.
- source_word: complete restoration
  choice: rétablissement complet
  rationale: Préserve l’idée d’une restauration intégrale sans imposer le terme théologique spécialisé « apocatastase ».
- source_word: radiant east
  choice: Orient rayonnant
  rationale: Conserve l’image directionnelle et lumineuse ainsi que sa tonalité solennelle.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Équivalent direct qui maintient l’imagerie nuptiale propre au traité.
- source_word: loving mercy
  choice: tendre miséricorde
  rationale: Exprime ensemble l’affection et la compassion sans alourdir excessivement la formule.
theological_decisions:
- issue: Identification du sujet qui a porté et resplendi
  choice: Conserver « [le Christ] » entre crochets
  alternative: Écrire « le Christ » sans crochets ou laisser seulement une lacune
  rationale: Les crochets signalent que l’identification est une restitution éditoriale et non un texte pleinement conservé.
- issue: Sort final des êtres matériels
  choice: Traduire explicitement « abandonnés jusqu’à la fin pour être détruits »
  alternative: Adoucir en « laissés de côté » ou interpréter la destruction métaphoriquement
  rationale: Le témoin affirme une destruction; la traduction ne doit ni l’atténuer ni en préciser la nature au-delà du texte.
- issue: Portée du « rétablissement complet »
  choice: Maintenir la formule sans expliquer qui ou quoi est restauré
  alternative: La rendre par « restauration universelle »
  rationale: Le passage est lacunaire et ne permet pas d’affirmer sans réserve une restauration universelle.
- issue: Référent de « celui qui est rempli de tendre miséricorde »
  choice: Préserver la périphrase et son référent ambigu
  alternative: L’identifier explicitement à Dieu, au Père ou au Christ
  rationale: La syntaxe transmise ne permet pas de résoudre sûrement le référent.
- issue: Formule doxologique finale
  choice: Conserver les titres « Seigneur, Sauveur, Rédempteur » et les restitutions entre crochets
  alternative: Harmoniser la formule avec une doxologie biblique française traditionnelle
  rationale: Il faut traduire la formulation propre au traité sans l’assimiler à une tradition liturgique particulière.
translation_notes:
  register: Français international moderne, digne et lisible. Les crochets et les points de suspension reproduisent les restitutions et lacunes du témoin; les indications de lignes manquantes sont conservées. La syntaxe demeure parfois fragmentaire afin de ne pas reconstruire artificiellement un texte très endommagé. Projet provisoire fondé sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer. Les éléments étrangers au traité (FAQ, coordonnées et publicité) sont omis.
