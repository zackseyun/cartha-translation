  yaml_path: translation/extra_canonical/tripartite_tractate/025.yaml
  text: 'Humans came to be divided into three natural categories: the spiritual, the soulish, and the material. These correspond to the Word’s threefold inclination, from which the material, the soulish, and the spiritual were produced. Each of the three natural categories is known by its fruit. They were not known at first, however, but only when the Savior came, shone upon the saints, and revealed which category each one belonged to.


    The spiritual category is like light from light and spirit from spirit. When its head appeared, it immediately hurried toward its proper category. Suddenly it grew a body for its head and immediately received knowledge through the revelation.


    The soulish category, by contrast, is like light from fire. It was hesitant to recognize [] the one who appeared to it and even more hesitant to hurry toward him through faith. Instead, although a voice instructed it, <it> was satisfied, because it was not far from the hope of the promise. It received, as it were, assurance of the things to come in the form of a pledge.


    The material category, by contrast, is alien in every way, because it resembles darkness and rejects the light that shines, since its manifestation extinguishes it. Because it did not welcome his <coming>, it is <immoderate> and full of spite toward the revelation of the Lord.


    The spiritual category will receive complete salvation in every respect. The material category will be destroyed in every respect, as happens to an adversary. Because of its middle position, both in the way it was produced and in its nature, the soulish category is duality, corresponding to its inclination toward both good and evil. What has been determined for it is ambiguous <…> and its complete escape <from> what is good.


    Those whom the Word produced according to the preexistent pattern in his thought, when he remembered the Exalted One and prayed for salvation, received salvation immediately. [Because] of the saving thought, they were saved completely by what it produced. The same applies to [the ones] whom these produced in their turn, [] whether angels or humans. Because they acknowledge that one exists who is more exalted than they are, and because they pray and seek after him, they too will receive the same salvation received by those who were produced, since they come from the good inclination. They were assigned the service of proclaiming the Savior’s future coming and his revelation after he had come. Whether angels or humans, when he appointed them to this service, they truly received the nature of their being.


    By contrast, those who came from the thought of lust for control, who came into being through the blow struck by his opponents, were produced by that thought. Since they are mixed, they will receive an ambiguous end. Those who cast off the lust for control that was granted to them only for a time and for particular periods, who glorify the Lord of glory, and who renounce their anger, will receive the reward for their humility, which is unending existence.


    By contrast, those who are arrogant because of their lust for ambition, who love passing glory, and who forget that authority was delegated to them only for particular periods and times—and who therefore did not confess that the Son of God [] is the Lord of all and Savior, and did not renounce their anger or stop imitating the evil ones—will suffer retribution for their ignorance and foolish passion, together with those who have gone astray and wandered away.


    Even more evil are those who committed improper acts against the Lord, as the powers of the left did against him, even putting him to death. They said to themselves, “We will become masters of the Totality if the one proclaimed king of the Totality is killed.” They worked toward this end—the humans and angels who do not belong to the good inclination of those on the right, but come from the mixture. They chose self-glory, even though it is only passing glory and lust, while the way to eternal repose is through humility (that results in) salvation, being of those who are to be saved, those on the right.


    After they praise the Lord, consider what is pleasing to the Church, and sing the hymn of the humble together with her as fully as possible, doing what pleases her, they will share in her sufferings and anguish like those who consider what is good for the Church. They will receive a share in her hope. This applies [] to humans and angels.


    The path of those belonging to the order of the left leads to destruction, because they not only rejected the Lord and devised an evil plot against him, but also directed their hatred, envy, and jealousy against the Church. This is the reason for the condemnation of those who have troubled the Church, even inciting themselves to create <trials> for the Church.'
translation:
  language: fr
  text: 'Les humains en vinrent à se répartir en trois catégories selon leur nature : les spirituels, les psychiques[a] et les matériels. Elles correspondent à la triple inclination du Verbe, dont sont issus les matériels, les psychiques et les spirituels. Chacune de ces trois catégories selon la nature se reconnaît à son fruit. Toutefois, elles ne furent pas reconnues dès le commencement, mais seulement lorsque le Sauveur vint, qu’il fit briller sa lumière sur les saints et révéla à quelle catégorie chacun appartenait.


    La catégorie spirituelle est comme lumière issue de lumière et esprit issu d’esprit. Lorsque sa tête apparut, elle se hâta aussitôt vers ce qui lui correspondait. Soudain, elle devint un corps pour sa tête et reçut immédiatement la connaissance grâce à la révélation.


    La catégorie psychique, en revanche, est comme une lumière issue du feu. Elle hésita à reconnaître […] celui qui lui était apparu, et plus encore à se hâter vers lui par la foi. Mais, bien qu’une voix l’eût instruite, <elle> s’en contenta, car elle n’était pas loin de l’espérance de la promesse : elle reçut, pour ainsi dire, la garantie des réalités à venir sous la forme d’un gage.


    La catégorie matérielle, en revanche, est étrangère à tous égards, car elle ressemble aux ténèbres et repousse la lumière qui brille, puisque la manifestation de celle-ci l’anéantit. Et parce qu’elle n’a pas accueilli sa <venue>, elle est <sans mesure> et pleine d’hostilité envers la révélation du Seigneur.


    La catégorie spirituelle obtiendra un salut complet à tous égards. La catégorie matérielle sera entièrement détruite, comme le sera un adversaire. Quant à la catégorie psychique, sa position intermédiaire, aussi bien par son mode de production que par sa nature, fait d’elle une dualité, conformément à son inclination tant vers le bien que vers le mal. Ce qui a été fixé pour elle demeure ambigu <…>, ainsi que son éloignement total <de> ce qui est bon.[b]


    Ceux que le Verbe produisit selon le modèle préexistant dans sa pensée obtinrent aussitôt le salut lorsqu’il se souvint de l’Exalté et pria pour être sauvé. [Grâce] à la pensée salvatrice, ce qu’elle produisit fut entièrement sauvé. Il en va de même pour [ceux] qu’à leur tour ceux-ci produisirent, […], qu’il s’agisse d’anges ou d’humains. Parce qu’ils reconnaissent qu’il existe quelqu’un de plus exalté qu’eux, qu’ils le prient et le recherchent, eux aussi recevront le même salut que reçurent ceux qui avaient été produits, car ils proviennent de la bonne inclination. Le service d’annoncer la venue future du Sauveur, puis sa révélation après sa venue, leur fut confié. Qu’ils soient anges ou humains, lorsqu’il les établit dans ce service, ils reçurent véritablement la nature de leur être.


    En revanche, ceux qui provinrent de la pensée du désir de domination et vinrent à l’existence sous le coup porté par ses adversaires furent produits par cette pensée. Puisqu’ils sont mêlés, ils connaîtront une fin ambiguë. Ceux qui rejetteront le désir de domination qui ne leur avait été accordé que pour un temps et pour des périodes déterminées, qui glorifieront le Seigneur de gloire et renonceront à leur colère, recevront la récompense de leur humilité : une existence sans fin.


    En revanche, ceux qui s’enorgueillissent par désir des honneurs, qui aiment une gloire passagère et oublient que l’autorité ne leur avait été déléguée que pour des périodes et des temps déterminés — et qui, pour cette raison, n’ont pas confessé que le Fils de Dieu […] est le Seigneur de tous et le Sauveur, n’ont pas renoncé à leur colère ni cessé d’imiter les mauvais — subiront le châtiment de leur ignorance et de leur passion insensée, avec ceux qui se sont égarés et éloignés du chemin.


    Pires encore sont ceux qui ont commis des actes indignes contre le Seigneur, comme le firent contre lui les puissances de la gauche, allant jusqu’à le mettre à mort. Ils se dirent : « Nous deviendrons les maîtres de la Totalité[c] si celui qui a été proclamé roi de la Totalité est tué. » Ils œuvrèrent donc dans ce but — ces humains et ces anges qui ne relèvent pas de la bonne inclination de ceux de la droite, mais qui proviennent du mélange. Ils choisirent leur propre gloire, bien qu’elle ne soit qu’une gloire passagère et un objet de convoitise, tandis que le chemin du repos éternel passe par l’humilité qui conduit au salut, propre à ceux qui doivent être sauvés, ceux de la droite.


    Après avoir loué le Seigneur, recherché ce qui plaît à l’Église et chanté avec elle, aussi pleinement que possible, l’hymne des humbles, en faisant ce qui lui plaît, ils partageront ses souffrances et ses angoisses, comme ceux qui prennent en considération le bien de l’Église. Ils auront part à son espérance. Cela concerne […] les humains et les anges.


    Le chemin de ceux qui appartiennent à l’ordre de la gauche mène à la perdition. En effet, non seulement ils ont rejeté le Seigneur et tramé contre lui un mauvais complot, mais ils ont aussi dirigé leur haine, leur envie et leur jalousie contre l’Église. Telle est la cause de la condamnation de ceux qui ont tourmenté l’Église, allant jusqu’à s’exciter eux-mêmes pour susciter des <épreuves> contre elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « psychiques » désigne ceux qui relèvent de l’âme, catégorie intermédiaire entre les spirituels et les matériels; le mot n’a pas simplement le sens moderne de « psychologiques ».
    reason: Le terme technique pourrait être mal compris par un lectorat contemporain.
  - marker: b
    text: La fin de cette phrase est endommagée ou incertaine dans le témoin. Les chevrons et les points de suspension signalent une restitution et une lacune; le sens exact demeure ambigu.
    reason: Préserver honnêtement l’état textuel et éviter de trancher l’issue sotériologique de la catégorie psychique.
  - marker: c
    text: « Totalité » est un terme cosmologique désignant l’ensemble de la réalité; la majuscule reflète son emploi technique dans le traité.
    reason: Éclairer un terme spécialisé sans l’assimiler à un système doctrinal particulier.
lexical_decisions:
- source_word: spiritual / soulish / material
  choice: spirituels / psychiques / matériels
  rationale: « Psychique » préserve la catégorie technique liée à l’âme sans la réduire au sens moderne de « psychologique »; les trois termes gardent leur parallélisme classificatoire.
- source_word: Word
  choice: Verbe
  rationale: Terme français traditionnel et intelligible pour le Logos dans un contexte chrétien ancien.
- source_word: Totality
  choice: Totalité
  rationale: Majuscule conservée pour signaler la portée cosmologique et technique du terme, sans l’harmoniser avec « univers » ou « plérôme ».
- source_word: inclination
  choice: inclination
  rationale: Conserve l’ambivalence entre orientation, disposition et tendance productive présente dans le témoin.
- source_word: pledge
  choice: gage
  rationale: Rend l’idée d’une garantie présente des réalités futures, tout en conservant la tonalité religieuse ancienne.
- source_word: those of the right / left
  choice: ceux de la droite / de la gauche
  rationale: Maintient la topographie symbolique du traité sans lui substituer une interprétation morale explicative.
- source_word: repose
  choice: repos
  rationale: « Repos éternel » est naturel en français et conserve la notion sotériologique sans ajout doctrinal.
theological_decisions:
- issue: Statut des trois catégories humaines
  choice: Les présenter comme des « catégories selon leur nature » sans préciser si elles sont immuables.
  alternative: Les appeler trois races ou trois essences prédestinées.
  rationale: Le passage emploie un langage de nature, mais décrit aussi pour la catégorie psychique des choix et des issues possibles; la traduction conserve cette tension.
- issue: Issue de la catégorie psychique dans le passage endommagé
  choice: Conserver une formulation ambiguë avec les signes de lacune et de restauration.
  alternative: Corriger le texte pour lui attribuer clairement soit le salut, soit la perte.
  rationale: Le témoin est incertain et le sens transmis est difficile; une résolution théologique silencieuse serait injustifiée.
- issue: Humilité et salut
  choice: « l’humilité qui conduit au salut »
  alternative: « l’humilité qui produit nécessairement le salut »
  rationale: Cette formulation maintient le lien du texte sans imposer une théorie causale précise du salut.
- issue: Référent des pronoms dans le passage sur le Verbe
  choice: Conserver les changements de référent aussi fidèlement que le permet le français.
  alternative: Identifier explicitement chaque pronom au Verbe, au modèle ou à la pensée.
  rationale: Le témoin demeure syntaxiquement et conceptuellement ambigu; l’explicitation risquerait d’introduire une interprétation.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire technique nécessaire. Les crochets, chevrons et points de suspension reproduisent les signaux de lacune, d’ajout ou de restitution du témoin anglais public; une vérification directe du copte demeure nécessaire. Les répétitions structurantes et les oppositions droite/gauche ont été conservées.
