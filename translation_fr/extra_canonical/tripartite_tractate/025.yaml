review_pass:
  verdict: revise
  source_fidelity: 'La traduction conserve bien l’architecture du témoin, ses catégories techniques et ses ambiguïtés doctrinales. Quelques corrections sont nécessaires : les lacunes marquées par [] ne doivent pas être transformées en points de suspension ; « elle devint un corps pour sa tête » ne rend pas « it grew a body for its head » ; et « éloignement » affaiblit et modifie l’image de l’« escape » hors de ce qui est bon.'
  naturalness: Le français est généralement moderne, soutenu et lisible. Les corrections proposées rendent certains passages plus précis sans résoudre les obscurités syntaxiques ou textuelles du témoin.
  terminology: « spirituels / psychiques / matériels », « Verbe », « Totalité », « droite / gauche » et « gage » sont des choix cohérents. Les signaux éditoriaux du témoin ([], <>, <…>) sont conservés de manière uniforme dans la révision.
  issues:
  - severity: medium
    issue: Les lacunes éditoriales [] sont rendues par […] à plusieurs endroits.
    rationale: Le témoin distingue explicitement les crochets vides [] d’une lacune signalée par des points de suspension <…>. Cette distinction doit être conservée sans la normaliser.
  - severity: medium
    issue: « elle devint un corps pour sa tête » dans la section sur la catégorie spirituelle.
    rationale: Cette formulation dit que la catégorie est devenue un corps, alors que le témoin dit qu’elle a fait croître/produit un corps pour sa tête.
  - severity: low
    issue: « son éloignement total <de> ce qui est bon ».
    rationale: Le témoin emploie l’image d’une « escape » complète hors de ce qui est bon. « Éloignement » est plus statique et atténue cette formulation difficile ; « fuite » la préserve mieux.
  revised_text: 'Les humains en vinrent à se répartir en trois catégories selon leur nature : les spirituels, les psychiques[a] et les matériels. Elles correspondent à la triple inclination du Verbe, dont sont issus les matériels, les psychiques et les spirituels. Chacune de ces trois catégories selon la nature se reconnaît à son fruit. Toutefois, elles ne furent pas reconnues dès le commencement, mais seulement lorsque le Sauveur vint, qu’il fit briller sa lumière sur les saints et révéla à quelle catégorie chacun appartenait.


    La catégorie spirituelle est comme lumière issue de lumière et esprit issu d’esprit. Lorsque sa tête apparut, elle se hâta aussitôt vers ce qui lui correspondait. Soudain, elle fit croître un corps pour sa tête et reçut immédiatement la connaissance grâce à la révélation.


    La catégorie psychique, en revanche, est comme une lumière issue du feu. Elle hésita à reconnaître [] celui qui lui était apparu, et plus encore à se hâter vers lui par la foi. Mais, bien qu’une voix l’eût instruite, <elle> fut satisfaite, car elle n’était pas loin de l’espérance de la promesse : elle reçut, pour ainsi dire, la garantie des réalités à venir sous la forme d’un gage.


    La catégorie matérielle, en revanche, est étrangère à tous égards, car elle ressemble aux ténèbres et repousse la lumière qui brille, puisque la manifestation de celle-ci l’anéantit. Et parce qu’elle n’a pas accueilli sa <venue>, elle est <sans mesure> et pleine d’hostilité envers la révélation du Seigneur.


    La catégorie spirituelle obtiendra un salut complet à tous égards. La catégorie matérielle sera entièrement détruite, comme il en va d’un adversaire. Quant à la catégorie psychique, sa position intermédiaire, aussi bien par son mode de production que par sa nature, fait d’elle une dualité, conformément à son inclination tant vers le bien que vers le mal. Ce qui a été fixé pour elle demeure ambigu <…>, ainsi que sa fuite totale <hors de> ce qui est bon.[b]


    Ceux que le Verbe produisit selon le modèle préexistant dans sa pensée obtinrent aussitôt le salut lorsqu’il se souvint de l’Exalté et pria pour être sauvé. [Grâce] à la pensée salvatrice, ce qu’elle produisit fut entièrement sauvé. Il en va de même pour [ceux] qu’à leur tour ceux-ci produisirent, [], qu’il s’agisse d’anges ou d’humains. Parce qu’ils reconnaissent qu’il existe quelqu’un de plus exalté qu’eux, qu’ils le prient et le recherchent, eux aussi recevront le même salut que reçurent ceux qui avaient été produits, car ils proviennent de la bonne inclination. Le service d’annoncer la venue future du Sauveur, puis sa révélation après sa venue, leur fut confié. Qu’ils soient anges ou humains, lorsqu’il les établit dans ce service, ils reçurent véritablement la nature de leur être.


    En revanche, ceux qui provinrent de la pensée du désir de domination et vinrent à l’existence sous le coup porté par ses adversaires furent produits par cette pensée. Puisqu’ils sont mêlés, ils connaîtront une fin ambiguë. Ceux qui rejetteront le désir de domination qui ne leur avait été accordé que pour un temps et pour des périodes déterminées, qui glorifieront le Seigneur de gloire et renonceront à leur colère, recevront la récompense de leur humilité : une existence sans fin.


    En revanche, ceux qui s’enorgueillissent par désir des honneurs, qui aiment une gloire passagère et oublient que l’autorité ne leur avait été déléguée que pour des périodes et des temps déterminés — et qui, pour cette raison, n’ont pas confessé que le Fils de Dieu [] est le Seigneur de tous et le Sauveur, n’ont pas renoncé à leur colère ni cessé d’imiter les mauvais — subiront le châtiment de leur ignorance et de leur passion insensée, avec ceux qui se sont égarés et éloignés du chemin.


    Pires encore sont ceux qui ont commis des actes indignes contre le Seigneur, comme le firent contre lui les puissances de la gauche, allant jusqu’à le mettre à mort. Ils se dirent : « Nous deviendrons les maîtres de la Totalité[c] si celui qui a été proclamé roi de la Totalité est tué. » Ils œuvrèrent donc dans ce but — ces humains et ces anges qui ne relèvent pas de la bonne inclination de ceux de la droite, mais qui proviennent du mélange. Ils choisirent leur propre gloire, bien qu’elle ne soit qu’une gloire passagère et un objet de convoitise, tandis que le chemin du repos éternel passe par l’humilité qui conduit au salut, propre à ceux qui doivent être sauvés, ceux de la droite.


    Après avoir loué le Seigneur, recherché ce qui plaît à l’Église et chanté avec elle, aussi pleinement que possible, l’hymne des humbles, en faisant ce qui lui plaît, ils partageront ses souffrances et ses angoisses, comme ceux qui prennent en considération le bien de l’Église. Ils auront part à son espérance. Cela concerne [] les humains et les anges.


    Le chemin de ceux qui appartiennent à l’ordre de la gauche mène à la perdition. En effet, non seulement ils ont rejeté le Seigneur et tramé contre lui un mauvais complot, mais ils ont aussi dirigé leur haine, leur envie et leur jalousie contre l’Église. Telle est la cause de la condamnation de ceux qui ont tourmenté l’Église, allant jusqu’à s’exciter eux-mêmes pour susciter des <épreuves> contre elle.'
