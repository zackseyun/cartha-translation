lexical_decisions:
- source_word: lust for control
  choice: désir de domination
  rationale: Rend l’impulsion passionnelle et la recherche de pouvoir sans employer « luxure », peu naturel ici en français moderne.
- source_word: the Word
  choice: la Parole
  rationale: Conserve le titre conceptuel du témoin, sans imposer explicitement l’identification théologique que pourrait suggérer « le Logos ».
- source_word: memory
  choice: la mémoire
  rationale: Préserve le terme abstrait et sa possible fonction quasi hypostatique dans le traité.
- source_word: Fullnesses
  choice: Plénitudes
  rationale: Maintient le vocabulaire cosmologique spécialisé et le pluriel du témoin.
- source_word: likeness / likenesses
  choice: ressemblance / ressemblances
  rationale: Reproduit la répétition terminologique, même si le référent demeure obscur.
- source_word: Exalted One
  choice: l’Exalté
  rationale: Rend le titre avec dignité tout en conservant son caractère indéterminé.
theological_decisions:
- issue: Genre grammatical de « la Parole »
  choice: Pronoms féminins en français
  alternative: Employer « le Logos » et des pronoms masculins
  rationale: Le féminin découle de la grammaire française du mot « Parole » et ne tranche pas l’identité théologique du personnage.
- issue: Identité des entités préexistantes et des Plénitudes
  choice: Conserver les désignations du témoin sans les identifier
  alternative: Les assimiler à des éons ou à d’autres figures nommées
  rationale: Le passage ne fournit pas ici assez d’éléments pour imposer une systématisation doctrinale.
- issue: Relation de la lumière, de la vie et de l’amour fraternel dans la dernière phrase
  choice: Préserver l’enchaînement syntaxique ambigu
  alternative: Préciser explicitement ce qui est engendré par la pensée d’amour fraternel
  rationale: Le témoin permet plusieurs rattachements grammaticaux ; la traduction évite de décider silencieusement entre eux.
