base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: fr
  text: 'Les autres avaient un désir de domination plus puissant, parce qu’ils étaient plus honorables [] que les premiers, qui s’étaient soulevés contre eux. Ceux-ci refusèrent de s’abaisser : ils pensaient être issus d’eux-mêmes et n’avoir aucun commencement ; quant à l’engendrement, ils pensaient avoir été les premiers à en engendrer d’autres. Les deux ordres se firent la guerre et luttèrent pour la domination en raison de leur manière d’être. Il en résulta qu’ils furent submergés de puissances et de natures caractéristiques du combat mutuel, animées du désir de domination et de tout ce qui lui ressemble. À partir de là, le vain amour de la gloire les poussa à désirer la domination, alors qu’aucun d’eux ne possédait la pensée exaltée ni ne la reconnaissait.


    Les forces de cette pensée furent préparées avec les <noms> des <êtres> préexistants, dont elles sont les représentations.[a] L’ordre des êtres de cette sorte vivait en harmonie. Cependant, ils combattirent l’ordre des êtres de la ressemblance, tandis que l’ordre des êtres de la ressemblance faisait la guerre aux ressemblances et, dans sa fureur, agissait contre elles. [] De là, cela [se produisit… les leurs] les uns [contre] les autres, beaucoup […] la nécessité les plaça […] afin qu’ils puissent l’emporter […] il ne cessa pas […] ; et leur envie, [leur] fureur, leur violence, leur désir et leur ignorance prévalurent, produisant diverses sortes de matière et des puissances de différentes sortes, mêlées en grand nombre. Pendant ce temps, la Parole, qui avait causé leur engendrement, attendait intérieurement la révélation de l’[espérance] qui devait lui venir d’en haut.[b]


    En se mettant en mouvement, la Parole reçut espérance et attente à l’égard de l’Exalté. Quant à ceux de l’ombre, elle s’éloigna complètement d’eux, parce qu’ils lui faisaient la guerre et ne s’abaissaient absolument pas devant elle. Mais elle trouva le repos auprès de ceux qui appartenaient à la mémoire. Quant à ceux qui étaient venus à l’existence par la mémoire, la Parole produisit, d’une manière invisible et conformément à leur nature, celui qui monta dans les hauteurs, se souvenant de celui qui avait été déficient, jusqu’à ce que la lumière brille sur lui d’en haut et lui donne la vie, engendrée par la pensée d’amour fraternel parmi les Plénitudes préexistantes.[c]'
  philosophy: optimal-equivalence
