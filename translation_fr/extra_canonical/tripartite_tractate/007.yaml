translation:
  language: fr
  text: 'Voici celui qui leur a été donné pour leur satisfaction, leur nourriture, leur joie et une abondance d’illumination — laquelle comprend son travail accompli avec eux, sa connaissance et son mélange avec eux.[a] C’est bien lui qui est à la fois appelé le Fils et qui est le Fils, parce qu’il est les Totalités,[b] et ils savent qui il est et qu’il les couvre de vêtements. C’est lui qu’on appelle « Fils », celui dont ils comprennent l’existence et qu’ils recherchaient. C’est lui qui existe comme Père, celui dont ils ne peuvent parler et qu’ils ne saisissent pas. C’est lui, le premier qui est venu à l’existence. Personne ne peut le saisir ni le comprendre. Ou bien quelqu’un peut-il s’approcher de l’Exalté, de celui qui, à proprement parler, préexiste ? Cependant, tous les noms pensés [] ou prononcés à son sujet sont employés pour l’honorer, comme une allusion à lui, selon la capacité de chacun à le glorifier.[c]


    Celui qui a surgi de lui lorsqu’il s’est étendu pour engendrer et produire la connaissance destinée aux Totalités, il […] tout nom sans fausseté et, à proprement parler, il est le seul qui soit premier, l’humain issu du Père, celui que j’[appelle] :


    la forme sans forme,


    le corps sans corps,


    le visage invisible,


    la parole indicible,


    l’intelligence insaisissable,


    la source qui jaillit de lui,


    la racine de ceux qui ont été plantés,


    et le dieu de ceux qui existent ;


    la lumière de ceux qu’il illumine,


    l’amour de ceux qu’il aime,


    la providence de ceux qu’il guide providentiellement,


    la sagesse de ceux qu’il a rendus sages,


    la puissance de ceux à qui il a donné la puissance,


    l’assemblée <de> ceux qu’il rassemble auprès de lui,


    la révélation des choses recherchées,


    l’œil de ceux qui voient,


    le souffle de ceux qui respirent,


    la vie des vivants,


    l’unité de ceux qui sont mêlés aux Totalités.


    Toutes ces réalités subsistent en l’unique, puisqu’il s’en revêt entièrement ; pourtant, il n’est jamais appelé par son nom unique. Et, selon ce mode singulier, elles sont tout autant l’unique que les Totalités. Il n’est pas séparable comme un corps, et il n’est pas non plus divisé par les noms qu’il a reçus, comme s’il était une chose selon un mode et [] quelque chose [de différent] selon un autre. De plus, il ne change pas dans […], et il ne se transforme pas en fonction des noms qu’il conçoit, devenant tantôt ceci, tantôt cela, étant maintenant une chose puis, à un autre moment, devenant quelque chose de différent. Au contraire, il demeure entièrement lui-même jusqu’au bout. [Il est], simultanément et éternellement, toutes les Totalités sans exception. Il est ce qui les comprend toutes. Il a présenté le Père aux Totalités. Il est même les Totalités, parce qu’il est la connaissance qu’il a de lui-même et qu’il est toute qualité et toute puissance. Et [il] est lui-même l’œil par lequel
    il possède la connaissance, se contemplant lui-même pleinement en lui-même et possédant un Fils et une forme.


    Ses puissances et ses qualités sont donc innombrables et inouïes, en raison de la manière <dont> il les engendre. Innombrables et inséparables sont ceux que ses paroles engendrent ; ses enseignements et ses Totalités le sont aussi. Il les connaît, eux qui sont ce qu’il est lui-même, parce qu’ils subsistent dans le nom unique et qu’ils parlent tous par son moyen. Et il engendre, afin qu’ils découvrent qu’ils existent conformément à leurs qualités propres, selon un mode unifié.'
