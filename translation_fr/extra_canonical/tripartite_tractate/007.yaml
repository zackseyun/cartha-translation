  footnotes:
  - marker: a
    text: 'Cette version française est provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte du Codex I,5 de Nag Hammadi restant à effectuer.'
    reason: Signaler honnêtement la base documentaire et la limite actuelle de l’examen de la langue source.
  - marker: b
    text: « Les Totalités » est conservé comme terme technique collectif. Selon le contexte, il évoque l’ensemble ou la plénitude des réalités, sans que la traduction impose une définition plus étroite.
    reason: Préserver un terme central et polysémique sans l’assimiler à un système doctrinal précis.
  - marker: c
    text: Les crochets vides ou accompagnés de points signalent une lacune ou un texte endommagé ; les mots entre crochets sont des restitutions. Les chevrons < > indiquent un ajout éditorial destiné à compléter la syntaxe.
    reason: Expliquer les signes critiques conservés dans le corps du texte.
lexical_decisions:
- source_word: Totalities
  choice: les Totalités
  rationale: Conserve la majuscule et le pluriel du témoin comme terme technique collectif, sans le réduire à « totalité », « plénitude » ou à une catégorie doctrinale plus précise.
- source_word: mixing
  choice: mélange
  rationale: Maintient l’image métaphysique inhabituelle du témoin plutôt que de l’adoucir en « communion » ou « union ».
- source_word: the single one
  choice: l’unique
  rationale: Rend l’unité personnelle ou principielle sans introduire un titre doctrinal absent ; la minuscule préserve aussi la fluidité entre désignation et qualité.
- source_word: the human from the Father
  choice: l’humain issu du Père
  rationale: Préserve le substantif générique et la relation d’origine, sans spécifier « homme » au sens masculin ni harmoniser avec une christologie particulière.
- source_word: unspeakable word
  choice: la parole indicible
  rationale: « Parole » conserve la tension entre expression et impossibilité de dire, tandis que « indicible » convient au registre apophatique.
- source_word: providentially guides
  choice: guide providentiellement
  rationale: Garde la répétition conceptuelle avec « providence », même si elle est stylistiquement marquée, afin de préserver le parallélisme du témoin.
- source_word: brings forth
  choice: engendre
  rationale: Le complément reste non exprimé comme dans le témoin ; « engendre » relie naturellement cette proposition au vocabulaire génératif du passage.
theological_decisions:
- issue: Le même référent est présenté comme Fils puis comme existant en tant que Père.
  choice: 'Conserver littéralement cette tension : « appelé le Fils et qui est le Fils » puis « existe comme Père ».'
  alternative: Harmoniser les référents ou expliquer que deux êtres distincts sont visés.
  rationale: Le témoin fourni maintient une ambiguïté référentielle et théologique qui ne doit pas être résolue par la traduction.
- issue: « This is the first one who came to be » peut sembler contredire la préexistence mentionnée ensuite.
  choice: Traduire « le premier qui est venu à l’existence », puis conserver « celui qui […] préexiste ».
  alternative: Rendre « premier-né » ou reformuler la venue à l’existence comme manifestation.
  rationale: Ces solutions interprétatives supprimeraient une tension authentique du témoin.
- issue: Rapport entre l’unique et les Totalités.
  choice: Maintenir à la fois l’identité (« il est les Totalités ») et la distinction relationnelle (« il a présenté le Père aux Totalités »).
  alternative: Réduire les Totalités à de simples attributs ou les traiter exclusivement comme des êtres distincts.
  rationale: Le passage oscille intentionnellement entre identité, inclusion et pluralité.
- issue: « possessing a Son and a form » après l’autocontemplation.
  choice: Conserver « possédant un Fils et une forme » sans préciser si les deux termes sont équivalents.
  alternative: Lire « son Fils, sa forme » ou identifier explicitement le Fils à la forme.
  rationale: La syntaxe du témoin ne justifie pas de résoudre cette relation.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien délibéré du registre spéculatif et apophatique. Les répétitions structurantes, les paradoxes et certaines formulations étranges ont été conservés lorsqu’ils portent la pensée du passage. La ponctuation et quelques articulations syntaxiques ont été ajustées pour la lisibilité, sans combler les lacunes ni harmoniser les tensions théologiques.
