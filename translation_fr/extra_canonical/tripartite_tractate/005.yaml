lexical_decisions:
- source_word: the All / the Totality
  choice: le Tout / la Totalité
  rationale: Conserve la variation terminologique du témoin et le vocabulaire cosmologique du traité, sans harmoniser deux formulations potentiellement distinctes.
- source_word: aeons
  choice: éons
  rationale: Terme technique courant en français pour les réalités émanées du contexte valentinien; «âges» effacerait ici la valeur cosmologique.
- source_word: produced / brought forth
  choice: produisit
  rationale: Rendu sobre qui préserve l’idée d’origine sans imposer «créa», terme théologiquement plus déterminé.
- source_word: perfect idea of generosity
  choice: parfaite connaissance de sa générosité
  rationale: «Idée parfaite de générosité» serait opaque en français; ce choix conserve l’objet cognitif et explicite prudemment que la générosité vient du Père.
- source_word: they wear each other
  choice: ils se revêtent les uns des autres
  rationale: Maintient l’image inhabituelle et l’ambiguïté du témoin au lieu de la paraphraser.
- source_word: sweetness
  choice: douceur
  rationale: Préserve le registre affectif et hymnique sans réduire le mot à la bonté morale.
theological_decisions:
- issue: Rapport du Père au Tout
  choice: «produisit le Tout»
  alternative: «créa le Tout» ou «engendra le Tout»
  rationale: Le témoin ne tranche pas explicitement entre création et génération; «produisit» évite d’importer une distinction doctrinale.
- issue: Perfection différée des éons
  choice: «ne devaient pas recevoir leur perfection prématurément»
  alternative: «ne pouvaient pas recevoir leur perfection»
  rationale: La syntaxe du témoin peut exprimer l’incapacité ou le dessein préventif. Le contexte du Père qui retient et accorde au temps choisi favorise ici la finalité, tout en gardant «prématurément».
- issue: Gloire propre au Père
  choice: «la gloire qui appartient au Père seul»
  alternative: «la gloire du Père»
  rationale: Conserve l’explicitation parenthétique du témoin selon laquelle cette gloire relève exclusivement du Père.
- issue: Identité du Fils
  choice: «le Fils dans toute sa plénitude, entier et parfait»
  alternative: «le Fils plein, complet et parfait»
  rationale: Rend naturellement l’accumulation sans l’identifier à une formulation confessionnelle ultérieure.
- issue: Révélation et incomparabilité du Père
  choice: «se révéler malgré son caractère incomparable»
  alternative: «se manifester dans son incomparabilité»
  rationale: Préserve la tension du texte entre révélation réelle et transcendance sans la résoudre.
translation_notes:
  register: Français international actuel, digne et lisible, avec maintien du vocabulaire technique («éons») et des images difficiles du traité. La syntaxe a été légèrement assouplie pour la clarté, mais les lacunes, restitutions, répétitions et tensions conceptuelles du témoin ont été conservées.
