  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: fr
  text: 'Le Père produisit le Tout comme un petit enfant, comme une goutte jaillie d’une source, comme un bourgeon issu d’[une vigne], comme [une fleur], comme une <plantation> […] ; ainsi, il lui fallait recevoir [de la nourriture], grandir et parvenir à la perfection. Il le retint pendant un temps. Celui qui l’avait conçu dès le premier instant du commencement le possédait et le contemplait dès le premier instant du commencement, mais il le <cacha> à ceux qui furent les premiers à tirer de lui leur origine. Ce n’était pas par jalousie, mais parce que les éons ne devaient pas recevoir leur perfection prématurément, dès le premier instant du commencement, ni s’élever jusqu’à la gloire qui appartient au Père seul, ni s’imaginer qu’ils possédaient tout cela par eux-mêmes. Au contraire, de même qu’il voulut leur donner la possibilité de venir à l’existence, afin qu’ils puissent aussi devenir des êtres parfaits, de même, au temps qu’il avait choisi, il leur accorda la parfaite connaissance de
    sa générosité envers eux.


    Celui qu’il éleva pour qu’il soit une lumière pour les êtres issus de lui, celui dont ils tirent leur nom, c’est le Fils dans toute sa plénitude, entier et parfait. Il le produisit mêlé à ce qui était sorti de lui, [] […] participant à la gloire […] la Totalité, en accord avec […], par laquelle chacun est [capable] de la recevoir en [lui-même], bien qu’aucun n’ait possédé cette grandeur avant d’être reçu par elle. Eux, en revanche, n’existent que partiellement selon le mode, la forme et la grandeur qui lui sont propres. [Ils] peuvent le voir et parler de [ce qu’ils] savent à son sujet, parce qu’ils se revêtent les uns des autres, parce qu’ils peuvent [le] saisir. Son mode d’être, au contraire, est sans comparaison : ainsi, le Père pouvait recevoir l’honneur de chacun et se révéler malgré son caractère incomparable. Caché et invisible, il suscite leur émerveillement intérieur. La grandeur de son élévation se manifeste donc lorsqu’ils parlent de lui et le contemplent, le célébrant par
    des hymnes pour les richesses de sa douceur.[a]'
  philosophy: optimal-equivalence
  footnotes:
