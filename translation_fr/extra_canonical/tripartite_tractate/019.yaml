base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: fr
  text: 'Les êtres du souvenir qui se trouvent au-dehors sont humbles et conservent la représentation de la Plénitude, surtout parce qu’ils participent ensemble aux noms qui les ornent. La conversion produit l’humilité envers les êtres du souvenir, et l’humilité envers eux est aussi la loi du jugement, qui consiste en condamnation et en colère.


    L’humilité envers eux est aussi la puissance qui met à part ceux qui tombent au-dessous d’eux et les envoie au loin. Elle les empêche [] [de] se répandre sur les êtres du souvenir et sur la conversion. Cette puissance comprend la peur, la confusion, l’oubli, le désarroi, l’ignorance, ainsi que les choses venues à l’existence par l’imagination, à la manière d’une ressemblance. En outre, des noms élevés sont attribués à ces choses qui étaient en réalité inférieures. La connaissance <fait défaut à ceux> qui sont issus d’elles par l’orgueil, le désir de domination, la désobéissance et la fausseté.


    Il donna un nom à chacun <d’entre> eux, car les deux ordres subsistent dans un nom. Ceux qui appartiennent au souvenir et à la représentation sont appelés « Ceux de la Droite », « les Psychiques »[a], « les Ignés » et « Ceux du Milieu ». Ceux qui appartiennent à la pensée orgueilleuse et à la ressemblance sont appelés « Ceux de la Gauche », « les Matériels », « les Ténébreux » et « les Derniers ».


    Après que la Parole eut établi chacun dans son ordre — à savoir les images, les représentations et les ressemblances —, elle préserva l’éon[b] des images de tous ceux qui luttent contre lui, afin qu’il demeure pur, car c’est un lieu de joie. Cependant, aux êtres du souvenir, elle révéla la pensée dont elle s’était dépouillée. Elle voulait les faire entrer dans une union matérielle et leur procurer une organisation et une demeure, afin qu’ils puissent eux aussi faire naître le désir d’affaiblir l’attrait que le mal exerçait sur eux. Ils pourraient ainsi cesser de prendre un plaisir excessif à la gloire de ce qui les entourait et, par là, de rester en exil ; ils reconnaîtraient plutôt l’infirmité dont ils souffraient. [] De cette manière, ils pourraient faire naître l’amour et une recherche incessante de celui qui peut les guérir de cette faiblesse. Pour leur faire prendre forme, elle plaça la parole de beauté au-dessus de ceux qui appartiennent à la ressemblance, et plaça aussi sur eux
    la loi du jugement. Elle plaça encore au-dessus d’eux les puissances que les racines avaient produites [dans] leur désir de domination. La Parole se plut en elles, parce qu’elles sont utiles au plan du salut ; elle les [choisit] donc pour les établir comme dirigeants au-dessus d’eux. Ainsi, grâce à l’aide de la belle parole, à la menace de la [loi] ou à l’influence du désir de domination, l’ordre pourrait être protégé de ceux qui l’entraîneraient vers le mal.


    La Parole connaît le désir de domination que partagent les deux ordres. À eux comme à tous les autres, elle accorda avec bienveillance ce qu’ils désiraient, donnant à chacun le rang de commandement qui lui convenait. Chacun serait ainsi dirigeant d’un lieu et d’une activité : il se soumettrait à ceux d’un ordre supérieur, commanderait l’activité des lieux inférieurs et exercerait son autorité conformément à sa manière d’être. Il en résulta que, parmi les anges [] et les archanges, il y a des chefs et des subordonnés, dans des positions d’autorité et de soumission, tandis que leurs activités sont diverses et de différentes sortes.


    Chacun des archontes[c], avec sa race et ses privilèges, jouit de ce à quoi la part qui lui est échue lui donne droit. Conformément à la manière dont ils sont apparus, chacun se tint à son poste, chargé du plan du salut. Et aucun lieu n’est privé d’une royauté sur ceux qui s’y trouvent, depuis une extrémité des cieux jusqu’à l’autre extrémité de la [terre], dans toute région de la [terre] et parmi ceux qui sont sous la terre. Il y a des rois, des seigneurs et ceux qui reçoivent des ordres : les uns veillent au châtiment, d’autres à la justice ; d’autres encore accordent le repos et la guérison, d’autres instruisent, et d’autres montent la garde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « psychiques » désigne ceux qui relèvent de l’âme ; le mot n’a pas son sens moderne lié aux phénomènes paranormaux.
    reason: Éviter un contresens courant tout en conservant le terme technique.
  - marker: b
    text: Un « éon » est ici une réalité ou un domaine du monde spirituel, et non simplement une très longue période.
    reason: Clarifier un terme cosmologique spécialisé.
  - marker: c
    text: Les « archontes » sont des puissances dirigeantes ou gouvernantes.
    reason: Rendre accessible une translittération technique sans remplacer le terme dans le corps du texte.
lexical_decisions:
- source_word: Fullness
  choice: Plénitude
  rationale: Terme français naturel et traditionnel pour le concept technique de plérôme, sans imposer inutilement une translittération savante.
- source_word: memory
  choice: souvenir
  rationale: « Souvenir » désigne ici un principe ou un ordre ontologique ; il reste plus concret et accessible que « mémoire », tout en conservant la répétition terminologique du témoin.
- source_word: representation / likeness / image
  choice: représentation / ressemblance / image
  rationale: Maintien de trois termes distincts afin de ne pas effacer les catégories du texte.
- source_word: Word
  choice: la Parole
  rationale: Rend le titre hypostasié tout en respectant le genre grammatical français ; les pronoms correspondants sont féminins sans trancher la question du genre de l’entité dans la source.
- source_word: Soulish
  choice: les Psychiques
  rationale: Terme technique qui distingue cet ordre des spirituels et des matériels ; une note prévient le sens moderne trompeur.
- source_word: aeon
  choice: éon
  rationale: Conservation du terme cosmologique technique plutôt qu’une réduction à « époque ».
- source_word: archons
  choice: archontes
  rationale: Translittération consacrée pour des puissances gouvernantes dans les textes anciens de ce type.
- source_word: plan of salvation
  choice: plan du salut
  rationale: Formulation française claire qui conserve la portée sotériologique sans préciser davantage le mécanisme.
theological_decisions:
- issue: Nature de la « Parole »
  choice: Majuscule et emploi comme sujet personnel, avec pronoms féminins imposés par la grammaire française
  alternative: « le Logos » avec pronoms masculins
  rationale: Le témoin présente une entité hypostasiée, mais l’identifier explicitement à une doctrine chrétienne ultérieure résoudrait une ambiguïté que le passage ne résout pas lui-même.
- issue: Valeur des deux ordres
  choice: Conserver les appellations multiples et la tension entre leur faiblesse, leur désir de domination et leur utilité dans le plan du salut
  alternative: Présenter simplement un ordre bon opposé à un ordre mauvais
  rationale: Le texte attribue des fonctions providentielles même à des puissances issues de dispositions négatives ; cette tension doit rester visible.
- issue: Proposition obscure sur la royauté
  choice: « aucun lieu n’est privé d’une royauté sur ceux qui s’y trouvent »
  alternative: « aucun d’eux ne manque de royauté »
  rationale: La syntaxe du témoin est ambiguë. Le choix proposé rend cohérente l’énumération spatiale sans prétendre que le sujet exact est assuré.
- issue: Signaux de lacune et de restitution
  choice: Conserver [] ainsi que les crochets carrés et angulaires du témoin
  alternative: Combler ou lisser silencieusement les passages
  rationale: La source copte n’ayant pas encore été directement révisée, les incertitudes textuelles du témoin doivent demeurer explicites.
translation_notes:
  register: Français international moderne, digne et lisible, avec conservation du vocabulaire cosmologique technique nécessaire. Les répétitions structurantes (« souvenir », « représentation », « ressemblance », « ordre », « désir de domination ») ont été maintenues. Les marques [] signalent une lacune indéterminée ; [mot] une restitution du témoin ; <mots> un ajout éditorial destiné à rendre une proposition intelligible. Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe du copte du Codex de Nag Hammadi I,5 reste nécessaire.
