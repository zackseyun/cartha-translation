  source_fidelity: 'La version suit globalement le témoin anglais fourni et conserve avec prudence ses ambiguïtés, ses pronoms difficiles et ses marques éditoriales. Quelques formulations devaient toutefois être resserrées : « de faible grandeur » ne rend pas naturellement « small in scale » ; « déposèrent » affaiblit le sens de « deposed » ; et certaines tournures françaises introduisaient une maladresse ou une précision indue. La vérification directe du copte demeure nécessaire, conformément aux limites documentaires indiquées.'
  naturalness: Registre globalement soutenu et adapté. Les corrections rendent plus idiomatiques plusieurs segments sans normaliser la syntaxe volontairement difficile du témoin. Les lacunes vides sont maintenant reproduites par [] plutôt que transformées en […], afin de mieux respecter les conventions du témoin fourni.
  terminology: Les termes techniques « éon », « Verbe », « Totalités », « Totalité », « Plérôme/Plérômes », « déficience » et « émanations » sont cohérents. « Plérôme » reste distinct de « Totalité(s) ».
  issues:
  - severity: medium
    issue: Marquage des lacunes vides modifié
    rationale: Le témoin présente plusieurs lacunes par [] ; le projet les rendait par […]. La restitution de [] préserve plus exactement l’information éditoriale disponible.
  - severity: medium
    issue: Rendu de « deposed » par « déposèrent »
    rationale: En français, « déposer » est ambigu et peu naturel ici. « Renversèrent » rend mieux l’idée de faire tomber ou d’abattre ce qui était survenu dans la déficience, sans en préciser davantage le mécanisme.
  - severity: low
    issue: Quelques formulations françaises peu naturelles ou inutilement interprétatives
    rationale: « de faible grandeur », « se commander les unes aux autres » et « La pensée de ces autres êtres » ont été remplacés par des formulations plus idiomatiques et plus proches de l’indétermination du témoin.
  revised_text: 'Il vint à l’esprit de l’un des éons d’essayer de saisir l’insaisissabilité et de lui rendre gloire, et tout particulièrement de rendre gloire à l’ineffabilité du Père. Puisqu’il est un Verbe issu de l’unité, il est un ; [pourtant] il ne vient pas de l’unité des Totalités[a], ni de celui qui les a produites, c’est-à-dire de celui qui a produit la Totalité, à savoir le Père. Cet éon était de ceux qui avaient reçu la sagesse, ceux dont la pensée préexistait et par laquelle ils produisaient ce qu’ils voulaient. Il reçut donc une sagesse innée pour examiner le fondement caché, car il est un fruit de la sagesse. Le libre arbitre engendré avec les Totalités fut l’une des raisons pour lesquelles celui-ci fit [] ce qu’il désirait, sans que personne ne l’en empêche.


    L’intention de celui-ci, qui est le Verbe, était bonne. Après avoir été produit, il s’empressa de glorifier le Père, bien qu’<il> désirât une chose impossible : il voulait produire un être parfait à partir d’une union à laquelle il n’avait aucune part, et sans en avoir reçu l’ordre. Cet éon fut le dernier à avoir <été> produit par une assistance mutuelle, et il était de petite taille. Avant d’engendrer quoi que ce soit pour la glorification de la volonté et en accord avec les Totalités, il s’avança généreusement, poussé par un amour débordant, et se dirigea vers ce qui entoure la gloire parfaite. En effet, ce ne fut pas en dehors de la volonté du Père que le Verbe fut produit ; autrement dit, il ne s’avança pas sans elle.


    Cependant, le Père l’avait produit pour ceux qu’il savait aptes à produire. Le Père et les Totalités se retirèrent loin de lui afin que soit établie la limite fixée par le Père, car ce n’est pas en saisissant ce qui est insaisissable, mais par la volonté [] du Père. Cela arriva aussi afin que les choses venues à l’existence puissent entrer dans un dessein de salut qui devait se déployer et qui ne pouvait <pas> manquer de se déployer pour révéler le Plérôme[b]. Il ne convient donc pas de parler en mal de cette action du Verbe ; il convient plutôt de dire qu’elle est la cause d’un dessein de salut destiné à se déployer.


    Le Verbe s’engendra lui-même parfait et unique, et il s’en contenta en vue de la gloire du Père qu’il désirait. Mais ceux qu’il voulait saisir fermement, il les engendra sous forme d’ombres, d’images et de ressemblances. Il ne put contempler la lumière ; il regarda plutôt dans les profondeurs et se mit à douter. De là vinrent une séparation qui le troubla profondément et un retrait causé par son propre doute et sa séparation, par l’oubli de lui-même, l’ignorance de lui-même et <de ce qui> existe.


    Son exaltation de lui-même et sa conviction de pouvoir saisir ce qui est insaisissable se durcirent en lui et s’y enracinèrent. Toutefois, ces faiblesses demeurèrent en lui tant qu’il était hors de lui-même ; elles étaient causées par son propre doute, parce qu’<il ne parvint pas à atteindre> les gloires du Père, dont l’élévation ne peut être imitée. Il ne les atteignit pas, car il était incapable de les saisir.


    Celui qu’il avait produit par lui-même [] comme un éon unique s’empressa de monter vers ce qui lui appartenait. Et celui qui lui était apparenté dans le Plérôme abandonna celui qui était venu à l’existence dans la déficience, ainsi que ceux qu’il avait produits de manière imaginaire, car ils ne lui appartiennent pas. Après s’être produit lui-même dans la perfection — lui qui s’était bel et bien produit lui-même —, il s’affaiblit comme une nature féminine qui abandonne son partenaire masculin. De ce qui était déficient en lui-même sortirent les choses issues de sa pensée et de son orgueil ; mais, à partir de ce qui était parfait en lui, il s’en sépara et [s’éleva] vers ceux qui lui appartiennent. Il demeura dans le Plérôme comme un rappel pour lui, parce qu’[il avait été] sauvé de [son orgueil].


    Celui qui s’était empressé de monter et celui qui l’avait attiré à lui ne furent pas stériles : en produisant un fruit dans le Plérôme, ils renversèrent ce qui était apparu dans la déficience. Les choses venues à l’existence à partir de la pensée orgueilleuse ressemblent aux Plérômes : elles en sont les ressemblances, les images, les ombres et les illusions. Elles sont dépourvues de raison et d’illumination et appartiennent à une pensée vide, car rien ne les a produites. [] Par conséquent, leur fin correspondra à leur commencement : ce qui n’a jamais été retournera à ce qui ne sera jamais. Pourtant, elles se croient plus grandes, plus fortes et plus [honorables] que les noms [qui les embellissent] et dont elles sont les ombres. Elles sont semblables à un beau reflet [que quelqu’un voit], car le visage d’une image tire généralement sa beauté de l’image qu’elle reflète.


    Elles pensaient exister par elles-mêmes et n’avoir aucune origine, puisqu’elles ne voyaient rien d’autre qui eût existé avant elles. Elles vécurent donc dans la défiance et la rébellion, sans s’humilier devant celui à cause de qui elles étaient venues à l’existence. Elles désiraient se donner des ordres les unes aux autres et dominer les unes sur les autres [dans] leur ambition de gloire, alors que la gloire qu’elles possédaient renfermait la cause [de] l’ordre qui devait venir. Parce qu’[elles sont] les ressemblances des réalités d’en haut, <elles> s’élevèrent elles-mêmes, poussées par le désir de dominer, chacune à la mesure du grand nom dont elle est l’ombre, chacune se croyant supérieure à ses compagnes.


    La pensée de ces autres ne fut pas stérile. Tout comme chez <ceux> dont ils sont les ombres, où chaque pensée devient un fils, [], ainsi ce qu’ils pensent devient leur descendance. Il arriva donc qu’une multitude de descendants fut produite par eux : combattants, guerriers, fauteurs de troubles, rebelles désobéissants, êtres épris de domination et toute autre sorte d’êtres semblables issus d’eux.


    Le Verbe fut la cause de la venue à l’existence de cette multitude, et il devint toujours plus perplexe et s’interrogea. Au lieu de la perfection, il vit la déficience ; au lieu de l’unité, la séparation ; au lieu de la stabilité, [des] faiblesses ; au lieu du [repos], des agitations. Il [ne pouvait] ni les empêcher d’[aimer] l’agitation ni [la] détruire. Il était [entièrement] impuissant : sa Totalité et sa [perfection] l’avaient abandonné.


    Ceux qui étaient venus à l’existence sans se connaître eux-mêmes ne connaissaient ni les Plérômes dont ils étaient issus ni la cause de leur existence. Dans cette situation instable, le Verbe ne parvint pas à produire quoi que ce soit d’autre qui ressemblât aux émanations, lesquelles demeurent dans le Plérôme, ces gloires qui existent pour la gloire du Père. Il produisit au contraire [] de petits êtres faibles, limités par les infirmités qui le retenaient lui aussi.


    La ressemblance qui était seule dans cette situation avait été la cause de ces êtres qui, dès le commencement, n’avaient pas causé leur propre existence. Celui qui se trouvait dans cet état déficient continua de produire des êtres déficients, jusqu’à ce qu’il prononce un jugement et condamne les êtres dépourvus de raison qu’il avait produits. Il lutta contre eux jusqu’à ce qu’ils soient détruits — ceux, précisément, qui s’étaient opposés à la condamnation —, tandis que la colère les poursuivait.[c]'
