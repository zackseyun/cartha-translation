translation:
  language: fr
  text: 'Il vint à l’esprit de l’un des éons d’essayer de saisir l’insaisissabilité et de lui rendre gloire, et tout particulièrement de rendre gloire à l’ineffabilité du Père. Puisqu’il est un Verbe issu de l’unité, il est un ; [pourtant] il ne vient pas de l’unité des Totalités[a], ni de celui qui les a produites, c’est-à-dire de celui qui a produit la Totalité, à savoir le Père. Cet éon était de ceux qui avaient reçu la sagesse, ceux dont la pensée préexistait et par laquelle ils produisaient ce qu’ils voulaient. Il reçut donc une sagesse innée pour examiner le fondement caché, car il est un fruit de la sagesse. Le libre arbitre engendré avec les Totalités fut l’une des raisons pour lesquelles celui-ci fit […] ce qu’il désirait, sans que personne ne l’en empêche.


    L’intention de celui-ci, qui est le Verbe, était bonne. Après avoir été produit, il s’empressa de glorifier le Père, bien qu’<il> désirât une chose impossible : il voulait produire un être parfait à partir d’une union à laquelle il n’avait aucune part, et sans en avoir reçu l’ordre. Cet éon fut le dernier à avoir <été> produit par une assistance mutuelle, et il était de faible grandeur. Avant d’engendrer quoi que ce soit pour la glorification de la volonté et en accord avec les Totalités, il s’avança généreusement, poussé par un amour débordant, et se dirigea vers ce qui entoure la gloire parfaite. En effet, ce ne fut pas en dehors de la volonté du Père que le Verbe fut produit ; autrement dit, il ne s’avança pas sans elle.


    Cependant, le Père l’avait produit pour ceux qu’il savait aptes à produire. Le Père et les Totalités se retirèrent loin de lui afin que soit établie la limite fixée par le Père, car ce n’est pas en saisissant ce qui est insaisissable, mais par la volonté […] du Père. Cela arriva aussi afin que les choses venues à l’existence puissent entrer dans un dessein de salut qui devait se déployer et qui ne pouvait <pas> manquer de se déployer pour révéler le Plérôme[b]. Il ne convient donc pas de parler en mal de cette action du Verbe ; il convient plutôt de dire qu’elle est la cause d’un dessein de salut destiné à se déployer.


    Le Verbe s’engendra lui-même parfait et unique, et il s’en contenta en vue de la gloire du Père qu’il désirait. Mais ceux qu’il voulait saisir fermement, il les engendra sous forme d’ombres, d’images et de ressemblances. Il ne put contempler la lumière ; il regarda plutôt dans les profondeurs et se mit à douter. De là vinrent une séparation qui le troubla profondément et un retrait causé par son propre doute et sa séparation, par l’oubli de lui-même, l’ignorance de lui-même et <de ce qui> existe.


    Son exaltation de lui-même et sa conviction de pouvoir saisir ce qui est insaisissable se durcirent en lui et s’y enracinèrent. Toutefois, ces faiblesses demeurèrent en lui tant qu’il était hors de lui-même ; elles étaient causées par son propre doute, parce qu’<il ne parvint pas à atteindre> les gloires du Père, dont l’élévation ne peut être imitée. Il ne les atteignit pas, car il était incapable de les saisir.


    Celui qu’il avait produit par lui-même […] comme un éon unique s’empressa de monter vers ce qui lui appartenait. Et celui qui lui était apparenté dans le Plérôme abandonna celui qui était venu à l’existence dans la déficience, ainsi que ceux qu’il avait produits de manière imaginaire, car ils ne lui appartiennent pas. Après s’être produit lui-même dans la perfection — lui qui s’était bel et bien produit lui-même —, il s’affaiblit comme une nature féminine qui abandonne son partenaire masculin. De ce qui était déficient en lui-même sortirent les choses issues de sa pensée et de son orgueil ; mais, à partir de ce qui était parfait en lui, il s’en sépara et [s’éleva] vers ceux qui lui appartiennent. Il demeura dans le Plérôme comme un rappel pour lui, parce qu’[il avait été] sauvé de [son orgueil].


    Celui qui s’était empressé de monter et celui qui l’avait attiré à lui ne furent pas stériles : en produisant un fruit dans le Plérôme, ils déposèrent ce qui était apparu dans la déficience. Les choses venues à l’existence à partir de la pensée orgueilleuse ressemblent aux Plérômes : elles en sont les ressemblances, les images, les ombres et les illusions. Elles sont dépourvues de raison et de lumière et appartiennent à une pensée vide, car rien ne les a produites. […] Par conséquent, leur fin correspondra à leur commencement : ce qui n’a jamais été retournera à ce qui ne sera jamais. Pourtant, elles se croient plus grandes, plus fortes et plus [honorables] que les noms [qui les embellissent] et dont elles sont les ombres. Elles sont semblables à un beau reflet [que quelqu’un voit], car le visage d’une image tire généralement sa beauté de l’objet qu’elle reflète.


    Elles pensaient exister par elles-mêmes et n’avoir aucune origine, puisqu’elles ne voyaient rien d’autre qui eût existé avant elles. Elles vécurent donc dans la défiance et la rébellion, sans s’humilier devant celui à cause de qui elles étaient venues à l’existence. Elles désiraient se commander les unes aux autres et dominer les unes sur les autres [dans] leur ambition de gloire, alors que la gloire qu’elles possédaient renfermait la cause [de] l’ordre qui devait venir. Parce qu’[elles sont] les ressemblances des réalités d’en haut, <elles> s’élevèrent elles-mêmes, poussées par le désir de dominer, chacune à la mesure du grand nom dont elle est l’ombre, chacune se croyant supérieure à ses compagnes.


    La pensée de ces autres êtres ne fut pas stérile. Tout comme chez <ceux> dont ils sont les ombres chaque pensée devient un fils, […], ainsi ce qu’ils pensent devient leur descendance. Il arriva donc qu’une multitude de descendants furent produits par eux : combattants, guerriers, fauteurs de troubles, rebelles désobéissants, êtres épris de domination et toute autre sorte d’êtres semblables issus d’eux.


    Le Verbe fut la cause de la venue à l’existence de cette multitude, et il devint toujours plus perplexe et étonné. Au lieu de la perfection, il vit la déficience ; au lieu de l’unité, la séparation ; au lieu de la stabilité, [des] faiblesses ; au lieu du [repos], des agitations. Il [ne pouvait] ni les empêcher d’[aimer] l’agitation ni [la] détruire. Il était [entièrement] impuissant : sa Totalité et sa [perfection] l’avaient abandonné.


    Ceux qui étaient venus à l’existence sans se connaître eux-mêmes ne connaissaient ni les Plérômes dont ils étaient issus ni la cause de leur existence. Dans cette situation instable, le Verbe ne parvint pas à produire quoi que ce soit d’autre qui ressemblât aux émanations, lesquelles demeurent dans le Plérôme, ces gloires qui existent pour la gloire du Père. Il produisit au contraire […] de petits êtres faibles, limités par les infirmités qui le retenaient lui aussi.


    La ressemblance qui se trouvait seule dans cette situation avait été la cause de ces êtres qui, dès le commencement, n’avaient pas causé leur propre existence. Celui qui se trouvait dans cet état déficient continua de produire des êtres déficients, jusqu’à ce qu’il prononce un jugement et condamne les êtres dépourvus de raison qu’il avait produits. Il lutta contre eux jusqu’à ce qu’ils soient détruits — ceux, précisément, qui avaient résisté à la condamnation —, tandis que la colère les poursuivait.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Totalités » est conservé comme terme technique distinct de « Plérôme ». Le passage emploie également « Totalité » au singulier.
    reason: Préserver une distinction lexicale susceptible d’être théologiquement significative.
  - marker: b
    text: Le « Plérôme » désigne ici la Plénitude divine. Les crochets carrés signalent des restitutions ou des incertitudes du témoin ; […] marque une lacune, et les chevrons <…> une correction ou restitution éditoriale.
    reason: Rendre lisibles les conventions textuelles et le vocabulaire technique sans les incorporer silencieusement au texte.
  - marker: c
    text: Traduction provisoire établie d’après le témoin anglais public fourni ; une vérification directe du copte du Codex de Nag Hammadi I,5 reste nécessaire, notamment dans les phrases lacunaires ou syntaxiquement ambiguës.
    reason: Signaler honnêtement la base documentaire limitée et le statut provisoire du travail.
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Terme technique usuel en français pour les entités ou réalités éternelles de la cosmologie valentinienne ; le remplacer par « âge » effacerait ici sa valeur personnelle.
- source_word: Word
  choice: Verbe
  rationale: Rend le titre personnel et cosmologique avec le terme français traditionnel, tout en restant intelligible ; « Logos » aurait été plus technique.
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: Conserve la distinction terminologique du témoin entre ce collectif et le « Fullness » sans les fusionner par interprétation.
- source_word: Fullness / Fullnesses
  choice: Plérôme / Plérômes
  rationale: Terme technique français établi pour la plénitude divine dans ce corpus ; le pluriel inhabituel est conservé lorsqu’il figure dans le témoin.
- source_word: deficiency
  choice: déficience
  rationale: Préserve l’opposition conceptuelle répétée entre le Plérôme et l’état déficient, sans réduire celui-ci à une simple faute morale.
- source_word: emanations
  choice: émanations
  rationale: Conserve le vocabulaire cosmologique technique du passage.
- source_word: free will
  choice: libre arbitre
  rationale: Expression française naturelle qui maintient l’idée d’une capacité de vouloir sans contrainte.
- source_word: plan of salvation
  choice: dessein de salut
  rationale: Formulation française digne et naturelle, moins administrative que « plan », tout en maintenant la portée sotériologique.
theological_decisions:
- issue: Évaluation de l’action fautive du Verbe
  choice: Maintenir ensemble la bonté de son intention, son désir impossible et le rôle de son action dans le dessein de salut.
  alternative: Qualifier simplement son action de péché, ou au contraire l’absoudre de toute erreur.
  rationale: Le passage maintient expressément cette tension et avertit de ne pas parler négativement de l’action tout en décrivant ses conséquences déficientes.
- issue: Rapport entre la volonté du Père et l’initiative du Verbe
