  yaml_path: translation/extra_canonical/tripartite_tractate/001.yaml
  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: fr
  text: '[] Lorsqu’on aborde des réalités élevées, il convient de commencer par le Père, racine de la Totalité[a], de qui nous avons reçu le don de parler de lui. Avant que quoi que ce soit d’autre que lui vienne à l’existence, il existait.


    Comme un nombre, le Père est un, parce qu’il vient en premier et qu’il est seul en lui-même. Pourtant, il ne ressemble pas à quelqu’un qui serait simplement un. S’il en était ainsi, comment pourrait-il être père ? Car, dès qu’un père existe, le nom de « fils » suit. Celui qui seul est le Père ressemble plutôt à la racine d’un arbre qui porte des branches et du fruit. À proprement parler, on dit de lui qu’il est père parce qu’il est sans égal et immuable. Voilà pourquoi, à proprement parler, il est un et il est un dieu, puisque personne ne se trouve par rapport à lui dans la position d’un dieu, car personne n’est son père. En effet, il est non engendré : personne d’autre ne l’a engendré et personne d’autre ne l’a créé. Car quiconque est le père ou le créateur d’un autre a lui aussi un père et un créateur. Certes, il peut être le père et le créateur de quelqu’un qui est venu à l’existence par lui et qu’il a créé. Mais, à proprement parler, il n’est ni père ni dieu, puisqu’il y a eu []
    quelqu’un qui l’a [engendré et] créé. Par conséquent, à proprement parler, seul est Père et Dieu celui que personne n’a engendré. Quant aux Totalités[b], c’est lui qui les a engendrées et créées.


    Il n’a ni commencement ni fin, mais ce n’est pas seulement qu’il n’a pas de fin. Parce qu’il est non engendré, il ne peut mourir. Pourtant, il est aussi immuable dans son être éternel, dans son identité propre, dans ce qui l’a établi et dans ce qui fait sa grandeur. Jamais il ne sera séparé de ce qui le fait être, et personne ne le contraindra à faire naître une intention qu’il n’a jamais voulue. Personne n’est à l’origine de l’existence du Père ; il est donc immuable. Personne ne peut le séparer de son être propre et de son identité, dans lesquels il existe, ni de sa grandeur — raison pour laquelle personne ne peut le comprendre. Il est impossible à quiconque de donner à sa forme une forme différente, de l’abaisser, de le changer ou de l’amoindrir. C’est <ainsi> que, dans la plénitude de la vérité, il est celui qui ne change ni ne varie, revêtu d’immuabilité. Il n’est pas seulement appelé « Sans commencement » et « Sans fin » : il n’est pas né et il ne mourra pas. Ainsi, de même qu’il
    est sans commencement et sans fin dans sa manière d’exister, de même [] sa grandeur reste hors d’atteinte : il est incompréhensible dans sa sagesse, insondable dans sa puissance et inconnaissable dans sa douceur.


    À proprement parler, lui seul, le bon, le Père non engendré, l’entièrement parfait, est rempli de sa descendance, de toutes les vertus et de tout ce qui a de la valeur. Il possède davantage encore, notamment l’absence de toute malveillance. Ainsi peut-on reconnaître que tous ceux qui possèdent quelque chose le lui doivent, car c’est lui qui le leur accorde. Pourtant, il demeure inaccessible et ne se lasse pas de donner, riche des dons qu’il dispense et en repos au milieu des faveurs qu’il répand.


    Sa condition, sa forme et son immense grandeur sont telles que personne n’a été avec lui depuis le commencement. Il n’existe aucun lieu où il demeure, d’où il sorte ou dans lequel il entre. Il n’existe aucune forme première dont il se serve comme modèle lorsqu’il agit. Aucune difficulté ne l’accompagne dans ce qu’il fait, et aucune matière n’est à sa disposition pour créer ce qu’<il> crée. Il n’y a en lui aucune substance dont il se serve pour engendrer ce qu’il engendre, ni aucun collaborateur qui l’accompagne dans son œuvre. Affirmer quoi que ce soit de semblable relève de l’ignorance. Il faut plutôt déclarer qu’il est bon, sans défaut, parfait, [] entier, puisqu’il est la Totalité.


    Aucun des noms que l’on pense ou prononce, voit ou comprend ne s’applique à lui, si prodigieusement majestueux, glorieux et révérencieux soient-ils. On peut néanmoins prononcer de tels noms pour lui rendre gloire et honneur, selon la capacité de ceux qui le glorifient. Quant à ce qui appartient à son existence, à son être et à sa forme, l’intelligence ne peut le concevoir, les mots ne peuvent l’exprimer, les yeux ne peuvent le contempler, et personne ne peut le comprendre. Cela tient à sa grandeur insondable, à sa profondeur insaisissable, à sa hauteur sans limites et à son <étendue> sans bornes.


    Voici le caractère de ce qui est non engendré : cela ne s’étend pas et ne se joint à rien à la manière de ce qui est limité. Au contraire, il a un caractère propre sans posséder de visage ni de forme, réalités que la perception peut saisir. Voilà pourquoi il est incompréhensible.


    [a] « La Totalité » désigne ici l’ensemble de tout ce qui procède du Père.

    [b] Le témoin passe ici au pluriel, « les Totalités » ; cette variation est conservée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La Totalité » désigne ici l’ensemble de tout ce qui procède du Père.
    reason: Aide le lecteur moderne à comprendre un terme cosmologique technique sans le remplacer dans le corps du texte.
  - marker: b
    text: Le témoin passe ici au pluriel, « les Totalités » ; cette variation est conservée.
    reason: Signale une variation potentiellement importante et évite qu’elle soit prise pour une incohérence de traduction.
lexical_decisions:
- source_word: Father
  choice: Père
  rationale: Conserve le titre relationnel central et la progression explicite entre « père » comme nom commun et « Père » comme désignation propre.
- source_word: Totality / Totalities
  choice: Totalité / Totalités
  rationale: Maintient le vocabulaire cosmologique du témoin ainsi que son alternance significative entre singulier et pluriel, sans la réduire à « univers » ou « création ».
- source_word: unbegotten
  choice: non engendré
  rationale: Expression théologique précise et intelligible, distinguée de « non créé », distinction que le passage lui-même maintient.
- source_word: single / one
  choice: un
  rationale: Préserve l’analogie numérique explicite et la tension entre unité, solitude et paternité.
- source_word: sweetness
  choice: douceur
  rationale: Rend littéralement la qualité attribuée au Père sans la rationaliser en « bonté » ou « bienveillance ».
- source_word: extension
  choice: étendue
  rationale: Reproduit le sens spatial abstrait tout en conservant les chevrons signalant une restitution éditoriale.
- source_word: spite
  choice: malveillance
  rationale: Terme français actuel et digne qui couvre l’hostilité nuisible sans introduire une catégorie doctrinale supplémentaire.
theological_decisions:
- issue: Le Père est dit « un dieu », puis « Dieu »
  choice: Conserver « un dieu » dans la première proposition et « Père et Dieu » dans la conclusion.
  alternative: Uniformiser partout en « Dieu » ou « le Dieu ».
  rationale: Le témoin distingue ces formulations et développe un raisonnement relationnel difficile. L’uniformisation résoudrait silencieusement une tension théologique réelle du texte.
- issue: Alternance entre la Totalité et les Totalités
  choice: Conserver le singulier et le pluriel, avec notes.
  alternative: Employer partout « la Totalité » ou « toutes choses ».
  rationale: L’alternance appartient au témoin et peut refléter une distinction conceptuelle ; elle ne doit pas être effacée avant vérification du copte.
- issue: Langage apophatique et noms divins
  choice: Maintenir que les noms ne s’appliquent pas à lui tout en pouvant être prononcés pour sa gloire.
  alternative: Reformuler en disant que les noms s’appliquent analogiquement.
  rationale: Le texte juxtapose volontairement l’inapplicabilité des noms et leur usage honorifique ; la traduction conserve cette tension sans l’expliquer par une doctrine ultérieure.
- issue: Oscillation grammaticale entre « ce qui est non engendré » et « il »
  choice: Conserver le neutre conceptuel « cela » puis le retour au masculin personnel « il ».
  alternative: Employer uniformément « il » ou « le Non-Engendré ».
  rationale: Cette oscillation entre propriété abstraite et sujet personnel est présente dans le témoin et mérite d’être préservée.
- issue: Création sans modèle, matière ni collaborateur
  choice: Traduire directement les trois négations distinctes.
  alternative: Les résumer par une formule doctrinale comme « création ex nihilo ».
  rationale: La formule doctrinale condenserait et interpréterait davantage que le texte, qui énumère séparément modèle, matière, substance et collaborateur.
translation_notes:
  register: 'Français international moderne, soutenu mais lisible. Les répétitions argumentatives, les formulations paradoxales et les changements de nombre ont été conservés. Les crochets vides [], les restitutions entre crochets carrés et les compléments entre chevrons reproduisent les signaux éditoriaux du témoin fourni. Projet nécessairement provisoire : il repose sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente.'
