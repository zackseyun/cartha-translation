translation:
  language: fr
  text: 'Cependant, il fut un <secours> et un rédempteur qui les délivra de leur manière de penser et de leur rébellion, car de lui [vient] la conversion appelée « repentance »[a]. Cela se produisit [lorsque] la Parole [changea] son jugement et sa pensée. Se détournant du mal, elle se tourna vers ce qui est bon. Après la conversion, elle se souvint de ceux qui existent et de la prière en faveur de celui qui s’était lui-même converti par ce qui est bon. Elle pria d’abord celui qui demeure dans la Plénitude et se souvint de lui, puis de ses frères — de chacun séparément et de tous ensemble en même temps — mais, avant eux tous, du Père.


    [] La prière unanime l’aida à revenir <à> lui-même et à la Totalité. En effet, s’il se souvint de ceux qui existaient depuis le commencement, c’est parce que lui-même avait été gardé en mémoire. C’était la pensée lointaine qui appelle de loin et le ramène.


    Toute sa prière et tout son souvenir comprenaient plusieurs puissances qui s’accordaient avec la limite mentionnée plus haut, car rien de ce qui est dans sa pensée n’est stérile. Ces puissances étaient bonnes et supérieures à celles de la ressemblance, car celles de la ressemblance appartiennent aussi à une nature [ténébreuse]. Ce qu’elles devinrent provenait d’une illusion liée à la similitude et d’une [vaine pensée] orgueilleuse ; elles provenaient aussi d’[une pensée] qui les avait connues la première. À quoi ressemblent les premiers êtres ? Ils sont semblables à <l’oubli> et à un profond sommeil. Ils ressemblent à ceux qui font des rêves troublants et qui, dans leur rêve, sont poursuivis et tourmentés par <quelqu’un>. Pour lui, les autres ressemblent à des êtres lumineux qui attendent le lever du soleil, car ils contemplaient en lui des rêves qui étaient véritablement doux.


    Aussitôt, [] les émanations de la pensée <cessèrent> : elles n’avaient plus aucune substance ni aucun honneur, [car] <elles> ne sont pas les égales de ceux qui existaient auparavant.[b] Si elles étaient supérieures [aux] ressemblances, la seule raison de leur élévation au-dessus d’elles était qu’elles agissaient avec une bonne intention. En effet, elles n’étaient pas issues de la faiblesse qui était venue à l’existence. Cette bonne intention était <celle de celui qui> recherchait le Préexistant après avoir prié et s’être élevé vers le bien. Il sema en elles le désir de chercher le Préexistant glorieux et de le prier. Il sema aussi en elles la capacité d’y penser et de comprendre qu’il existait quelque chose de plus grand qu’elles, qui existait avant leur propre venue à l’existence, bien qu’elles ne sachent pas ce que c’était. Cette pensée fit naître l’harmonie et l’amour mutuel ; elles agirent donc dans l’unité et l’unanimité, puisque c’était de l’unité et de l’unanimité qu’elles tenaient
    leur existence.'
