lexical_decisions:
- source_word: conversion called “repentance”
  choice: la conversion appelée « repentance »
  rationale: Conserve les deux notions distinctes du témoin — conversion et repentance — sans les fondre dans un seul terme ni imposer une définition confessionnelle.
- source_word: the Word
  choice: la Parole
  rationale: Rend le titre personnifié par la formulation française traditionnelle et intelligible, avec une majuscule qui signale sa fonction de désignation.
- source_word: Fullness
  choice: la Plénitude
  rationale: Préserve le terme technique cosmologique sans le remplacer par une paraphrase interprétative.
- source_word: Totality
  choice: la Totalité
  rationale: Maintient la distinction lexicale avec « Plénitude », présente dans le témoin.
- source_word: likeness
  choice: ressemblance
  rationale: Traduction formelle qui préserve le caractère technique et l’ambiguïté du terme collectif dans ce passage.
- source_word: pre-existent
  choice: le Préexistant
  rationale: Traite l’expression comme une désignation substantivée tout en évitant de préciser davantage l’identité du référent.
- source_word: powers
  choice: puissances
  rationale: Conserve le vocabulaire cosmologique du texte plutôt que de le banaliser en « forces » ou « capacités ».
theological_decisions:
- issue: Genre référentiel de « la Parole » et alternance ultérieure des pronoms
  choice: Employer « elle » lorsque le référent est clairement « la Parole », puis conserver « il/lui » là où le témoin passe au masculin ou laisse le référent moins sûr.
  alternative: Uniformiser tout le passage au féminin ou tout le passage au masculin.
  rationale: La non-uniformisation conserve la tension référentielle du témoin au lieu de résoudre silencieusement l’identité du sujet.
- issue: Identité de « celui qui s’était lui-même converti »
  choice: Conserver la formulation à la troisième personne sans identifier explicitement ce personnage à la Parole ou à un autre être.
  alternative: Remplacer par « sa propre prière » ou nommer expressément la Parole.
  rationale: Le témoin fourni présente une syntaxe et un référent ambigus ; une identification explicite dépasserait les données disponibles.
- issue: Nature du Préexistant
  choice: Garder le titre « Préexistant » sans l’assimiler explicitement au Père.
  alternative: Traduire « le Père préexistant » ou « Dieu » dans toutes les occurrences.
  rationale: Le passage distingue plusieurs désignations et ne justifie pas ici leur fusion interprétative.
- issue: Statut des émanations et des ressemblances
  choice: Préserver le langage ontologique du témoin (« substance », « existence », « émanations »).
  alternative: Psychologiser ces termes en parlant seulement d’idées, d’émotions ou d’imaginations.
  rationale: Une paraphrase psychologique effacerait la dimension cosmologique possible du traité.
