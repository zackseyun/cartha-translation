    Aussitôt, [] les émanations de la pensée <cessèrent> : elles n’avaient plus aucune substance ni aucun honneur, [car] <elles> ne sont pas les égales de ceux qui préexistaient.[b] Si elles étaient supérieures [aux] ressemblances, la seule raison de leur élévation au-dessus d’elles était qu’elles agissaient avec une bonne intention. En effet, elles n’étaient pas issues de la faiblesse qui était venue à l’existence. Cette bonne intention était <celle de celui qui> recherchait le Préexistant après avoir prié et s’être élevé vers le bien. Il sema en elles le désir de chercher le Préexistant glorieux et de le prier. Il sema aussi en elles la capacité de penser à lui, et la capacité de penser qu’il existait quelque chose de plus grand qu’elles, qui existait avant qu’elles ne viennent elles-mêmes à l’existence, bien qu’elles ne sachent pas ce que c’était. En engendrant l’harmonie et l’amour mutuel, elles agirent, à partir de cette pensée, dans l’unité et l’unanimité, puisque c’était de l’unité
