review_pass:
  verdict: revise
  source_fidelity: Le projet suit de près le témoin anglais fourni et conserve globalement son lexique cosmologique et ses ambiguïtés. Toutefois, il remplace les signaux textuels exacts « [] » du témoin par « [lacune] », ce qui ajoute une étiquette éditoriale au texte. Quelques formulations explicitent ou infléchissent aussi le témoin, notamment « recouvrer la vue » (qui présuppose une vue antérieure) et « apparence » là où le témoin distingue « face » et « visage ». La vérification directe du copte reste nécessaire.
  naturalness: 'Le français est généralement soutenu et lisible. La révision allège certaines tournures sans résoudre les référents incertains : « se hâta vers les hauteurs », « Père aux intentions bienveillantes », et « cherch[aient] à recevoir la vue ».'
  terminology: « éons », « Totalités », « déficience », « Plénitude », « Paraclet » et « dessein universel de salut » sont des choix recevables et cohérents. « Visage » est rétabli pour conserver la variation du témoin entre « face » et « visage ».
  issues:
  - severity: medium
    issue: Les crochets vides du témoin sont remplacés par « [lacune] ».
    rationale: Le témoin présente littéralement « [] » à plusieurs endroits. Les remplacer par un mot français dans le corps du texte modifie le signal éditorial transmis. Il convient de conserver « [] » et de l’expliquer en note.
  - severity: medium
    issue: « recouvrer la vue » ajoute l’idée que la vue avait été possédée auparavant.
    rationale: Le témoin dit seulement que certains « sought for their sight ». « Cherchaient à recevoir la vue » restitue cette recherche sans présupposer une récupération.
  - severity: low
    issue: La distinction « face » / « visage » est atténuée par « apparence ».
    rationale: Le témoin emploie « face » puis « visage » dans la phrase explicative. « Visage » permet de conserver cette seconde formulation sans élargir le sens.
  - severity: low
    issue: La note a décrit des « [lacune] » qui ne figurent pas dans le témoin.
    rationale: 'La note doit expliquer les signes effectivement conservés : « [] », « […] », crochets carrés et chevrons.'
