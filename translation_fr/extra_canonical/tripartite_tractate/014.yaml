  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: fr
  text: 'La chute qu’ont connue les éons[b] du Père des Totalités ne s’est produite que comme si elle était leur propre expérience : le Père l’avait préparée avec sollicitude, bienveillance et grande bonté. [lacune][a] […] la Totalité, afin de leur faire connaître [la déficience] par celui [de qui seul ils] ont tous reçu le pouvoir de supprimer les déficiences.


    Son propre [ordre vint] à l’existence à partir de <celui> qui s’était empressé de monter, de ce qui s’était produit soi-même à partir de lui, et de la perfection complète. Celui qui s’était empressé de monter devint l’intercesseur de l’être déficient, avec l’émanation des éons qui était venue à l’existence en accord avec les réalités existantes. Lorsqu’il les pria, ils étaient unis ; ils consentirent donc avec joie et empressement, dans un accord harmonieux, à aider l’être déficient. Ils se rassemblèrent et supplièrent le Père, dont l’intention est bienveillante, afin que le secours vienne du Père d’en haut, pour sa gloire. En effet, l’être déficient ne pouvait parvenir à la perfection autrement que par la volonté de la Plénitude[c] du Père, qu’il avait attirée à lui, révélant et accordant <celle-ci> à l’être déficient.


    De l’harmonie née de leur disposition joyeuse, ils produisirent un fruit, engendré par cette harmonie : une unité que possédaient les Totalités et qui révélait la face du Père. C’est à lui que les éons pensaient tandis qu’ils le glorifiaient et priaient pour que leur frère reçoive de l’aide, demandant au Père de s’unir à eux. Ainsi, avec empressement et joie, ils produisirent le fruit. Celui-ci manifesta alors l’accord issu de leur union mutuelle : il est son Fils bien-aimé. [lacune] Le Fils en qui les Totalités prennent plaisir les revêtit de lui-même comme d’un vêtement ; il communiqua la perfection à l’être déficient et donna de la force aux êtres parfaits. À proprement parler, il est appelé « Sauveur », « Rédempteur », « Celui qui plaît », « Bien-Aimé », « Paraclet », « Christ » et « Lumière des êtres désignés ». Il correspond à ceux qui l’avaient produit, puisqu’il devint les noms des lieux qui lui avaient été accordés.[d] Mais quel autre nom pourrait-on lui attribuer, sinon celui
    de « Fils » ? Comme nous l’avons dit auparavant, c’est parce qu’il est la connaissance du Père, que celui-ci désirait leur faire connaître.


    Les éons engendrèrent à la fois la face du Père qu’ils glorifient, comme nous l’avons écrit plus haut, et leur propre face ; car les éons qui glorifient engendrèrent <son> apparence et leur face. Ils furent constitués comme son armée, telle l’armée d’un roi, car les êtres issus de la pensée possèdent une puissante concorde et une harmonie intimement mêlée. Ils furent produits sous une forme complexe, afin que celui qui devait recevoir de l’aide puisse contempler ceux en faveur desquels il avait intercédé. Il contemple aussi celui qui la lui a accordée. Le fruit de l’accord avec lui, dont nous avons parlé plus haut, est soumis à la puissance des Totalités, car le Père a pu placer en lui les Totalités : celles qui existaient auparavant, celles qui existent et celles qui existeront. [lacune] Il révéla ceux que le Père avait placés en lui, sans les donner, mais en les lui confiant. Il mit en œuvre le dessein universel de salut avec l’autorité qui lui avait été accordée dès le commencement
    et la puissance nécessaire à l’œuvre. C’est ainsi qu’il commença à accomplir sa révélation.


    Celui en qui habitent le Père et les Totalités <fut> créé avant celui qui est privé de la vue. Il l’instruisit au sujet de ceux qui cherchaient à recouvrer la vue grâce au rayonnement de la lumière parfaite. Il le rendit d’abord parfait dans une joie inexprimable. Il le rendit parfait pour lui-même, comme un être parfait, et lui accorda aussi ce qui convient à chaque être en particulier. Telle est la nature de la première joie.'
