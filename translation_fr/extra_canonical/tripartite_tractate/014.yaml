  footnotes:
  - marker: a
    text: Les indications « [lacune] » et « […] » signalent des pertes ou interruptions du manuscrit. Les mots entre crochets carrés sont des restitutions du témoin utilisé ; les mots entre chevrons signalent un ajout ou une correction éditoriale.
    reason: Rend visibles les limites matérielles et les interventions éditoriales du texte transmis.
  - marker: b
    text: Les « éons » sont ici des réalités ou êtres célestes appartenant à la cosmologie propre au traité.
    reason: Explique un terme technique peu courant sans lui imposer une définition confessionnelle.
  - marker: c
    text: « Plénitude » traduit un terme cosmologique désignant ici la totalité parfaite liée au Père.
    reason: Évite que le lecteur comprenne seulement une qualité abstraite ordinaire.
  - marker: d
    text: La formule « il devint les noms des lieux qui lui avaient été accordés » demeure obscure dans le témoin et a été conservée sans interprétation supplémentaire.
    reason: Signale une difficulté textuelle ou conceptuelle réelle au lieu de la résoudre conjecturalement.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Conserve le terme technique de cette cosmologie tout en employant sa forme française établie.
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: Maintient la distinction numérique et la terminologie abstraite du témoin, sans l’assimiler silencieusement au monde ou à la création.
- source_word: deficiency / deficient one
  choice: déficience / être déficient
  rationale: Préserve le réseau lexical du passage et évite une interprétation morale comme « faute » ou « pécheur ».
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le concept cosmologique par le terme français traditionnel, avec une majuscule signalant son emploi quasi titulaire.
- source_word: Paraclete
  choice: Paraclet
  rationale: Conserve le titre distinct du texte au lieu de choisir entre les sens possibles de consolateur, défenseur ou intercesseur.
- source_word: the Appointed Ones
  choice: les êtres désignés
  rationale: Rend l’idée de désignation sans importer le vocabulaire doctrinal plus chargé d’« élus ».
- source_word: universal plan of salvation
  choice: dessein universel de salut
  rationale: Expression française naturelle qui conserve à la fois la portée universelle et l’idée d’un projet ordonné.
theological_decisions:
- issue: Rapport entre la chute des éons et le dessein du Père
  choice: '« comme si elle était leur propre expérience : le Père l’avait préparée »'
  alternative: Présenter la chute comme pleinement imputable aux éons ou comme une simple illusion
  rationale: Le témoin associe explicitement l’expérience apparente des éons à une préparation paternelle ; la traduction conserve cette tension sans l’expliquer par un système doctrinal.
- issue: Production du Fils par l’harmonie des éons
  choice: Conserver le vocabulaire de production, de fruit et d’engendrement
  alternative: Remplacer ces expressions par une formulation trinitaire ou créationnelle harmonisée
  rationale: Le passage formule sa propre relation entre le Père, les éons et le Fils ; elle ne doit pas être alignée silencieusement sur une doctrine ultérieure.
- issue: Référents pronominaux ambigus
  choice: Maintenir autant que possible les pronoms et enchaînements ambigus
  alternative: Identifier systématiquement chaque « il » comme le Père, le Fils ou l’intercesseur
  rationale: Le témoin ne permet pas toujours de fixer le référent avec certitude ; une explicitation imposerait une lecture théologique.
- issue: Celui en qui habitent le Père et les Totalités
  choice: Ne pas le nommer explicitement « le Fils »
  alternative: « Le Fils, en qui habitent le Père et les Totalités »
  rationale: Même si le contexte peut suggérer cette identification, le texte transmis emploie une périphrase et il convient de préserver cette formulation.
- issue: « fut créé » appliqué au personnage prééminent
  choice: Conserver « <fut> créé » avec le signal éditorial
  alternative: Employer « fut engendré » pour éviter une difficulté christologique
  rationale: La traduction ne doit pas corriger le témoin en fonction d’une doctrine extérieure ; les chevrons signalent en outre le caractère éditorial de l’élément.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions structurantes — harmonie, accord, perfection, déficience, fruit — sont volontairement conservées. La syntaxe a été légèrement allégée lorsque cela n’effaçait ni les ambiguïtés ni les relations conceptuelles. Projet provisoire fondé sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.
