translation:
  language: fr
  text: 'Le Père le connaissait d’avance, car, avant que quoi que ce soit existe, il demeurait dans ses pensées, où il possédait aussi ceux pour lesquels il l’a révélé.[a] Il a placé la déficience sur ce qui subsiste pendant des périodes passagères, pour la gloire de sa Plénitude.[b] Le fait qu’il était inconnu l’a amené à manifester sa bonté [en donnant la connaissance de lui-même].[c]


    [Il y a ici une lacune dans le manuscrit.][c] De cette manière, il acquit à son sujet une connaissance qui était une manifestation de sa bienveillance et la révélation de la richesse de sa douceur : telle est la seconde gloire. Ainsi, il s’est également manifesté comme la cause de l’ignorance, bien qu’il produise la connaissance : sagesse cachée et insaisissable, dans laquelle il conserve la connaissance jusqu’à la fin, lorsque les Totalités auront épuisé leurs forces dans leur recherche de Dieu le Père, que personne n’a découvert par sa propre sagesse ou sa propre puissance.[d] Il daigne leur accorder la connaissance du grand don de l’excellente pensée, dans une action de grâce sans fin envers lui. Selon son dessein inébranlable, il se révèle éternellement à ceux qui, par sa volonté, ont été jugés dignes de connaître le Père. Celui-ci, par nature, ne peut être connu ; pourtant, dans sa prescience, il avait prévu qu’ils pourraient obtenir la connaissance et tous les biens qui l’accompagnent,
    tout en goûtant aussi l’ignorance et ses souffrances.


    De cette manière, ils goûteraient les choses mauvaises et pourraient, grâce à elles, s’exercer […] pendant un temps, afin d’obtenir pour l’éternité la [jouissance des choses bonnes].[c] [Il y a ici une lacune dans le manuscrit.][c] Ils s’exposent et sont sans cesse rejetés et calomniés par leurs ennemis, considérant cela comme une parure et comme la marque merveilleuse des réalités élevées. Il fallait ainsi montrer clairement que l’ignorance de ceux qui ne connaissent pas le Père venait d’eux-mêmes, à la différence de sa puissance, qui leur donnait la possibilité de parvenir à le connaître.


    Cette connaissance est appelée à juste titre « la connaissance de toute pensée possible » et « le trésor ». Et, pour accroître encore davantage la connaissance, elle est la révélation de ceux qui étaient connus dès le commencement ; elle est aussi le chemin vers l’union et vers celui qui préexiste.[e] Il en résulte que ceux qui grandissent en grandeur sont ceux qui ont abandonné la grandeur qui leur était assignée dans le dessein du salut, conformément à la volonté divine, afin que la fin puisse être semblable au commencement.'
