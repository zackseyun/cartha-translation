lexical_decisions:
- source_word: Fullness
  choice: Plénitude
  rationale: Terme technique conservé avec une majuscule afin de signaler sa portée cosmologique, sans le réduire à la simple idée d’abondance.
- source_word: deficiency
  choice: déficience
  rationale: Préserve le contraste conceptuel avec la Plénitude et évite d’interpréter prématurément le terme comme faute morale ou manque matériel.
- source_word: the Totalities
  choice: les Totalités
  rationale: Le pluriel et la majuscule maintiennent le caractère technique et collectif du terme.
- source_word: excellent thought
  choice: l’excellente pensée
  rationale: Rendu formel qui conserve l’étrangeté possible d’une expression technique sans lui imposer une identification doctrinale.
- source_word: plan of salvation
  choice: dessein du salut
  rationale: Expression française naturelle qui garde la notion d’ordonnancement intentionnel sans importer un vocabulaire confessionnel plus précis.
- source_word: the pre-existent one
  choice: celui qui préexiste
  rationale: Formulation personnelle mais non identifiante, fidèle au masculin singulier du témoin et à son ambiguïté référentielle.
theological_decisions:
- issue: Le Père présenté comme « cause de l’ignorance » tout en produisant la connaissance
  choice: Conserver explicitement cette tension
  alternative: Reformuler comme s’il permettait seulement l’ignorance
  rationale: Le témoin affirme une causalité paradoxale ; l’atténuer résoudrait silencieusement une tension théologique réelle.
- issue: Référents des pronoms masculins au début du passage
  choice: Conserver les pronoms sans identifier les référents
  alternative: Nommer le Fils, le Logos ou une autre figure
  rationale: Le passage fourni ne permet pas de déterminer sûrement les référents ; aucune identification doctrinale ne doit être ajoutée.
- issue: Inconnaissabilité du Père et possibilité de le connaître
  choice: Maintenir côte à côte l’inconnaissabilité par nature et la connaissance accordée par volonté
  alternative: Limiter l’une des deux affirmations pour les harmoniser
  rationale: Cette opposition structure la pensée du passage et doit rester perceptible.
- issue: Ignorance attribuée à ceux qui ignorent le Père
  choice: Traduire qu’elle « venait d’eux-mêmes »
  alternative: L’expliquer comme culpabilité morale volontaire
  rationale: Le témoin exprime l’origine propre de leur ignorance, mais ne précise pas ici le degré de responsabilité morale.
