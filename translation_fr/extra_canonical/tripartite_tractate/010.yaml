base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: fr
  text: 'L’émanation des Totalités, qui existent à partir de Celui qui existe, ne s’est pas produite par une séparation des unes d’avec les autres, comme [quelque chose] que rejetterait celui qui leur donne naissance.[a] Leur engendrement ressemble plutôt à un déploiement : le Père se déploie vers ceux qu’il aime, afin que [ceux] qui sont issus de lui puissent eux aussi devenir lui.


    Bien qu’il forme une unité, l’âge présent est divisé en périodes, elles-mêmes divisées en années ; les années, à leur tour, sont divisées en saisons, puis les saisons en mois, les mois en jours, les jours en heures et les heures en minutes. De même, […] l’âge de vérité, parce qu’il est un et multiple, est honoré par des noms tant modestes qu’importants, selon ce que chacun peut en saisir.[b] Pour prendre une image, il ressemble à une source qui, tout en demeurant ce qu’elle est, ne cesse de couler et s’étend en ruisseaux, en lacs, en canaux et en ramifications. Il ressemble encore à une racine qui s’étend sous des arbres et se ramifie avec leurs fruits, ou à un corps humain, partagé de manière inséparable en divers membres ramifiés — principaux et secondaires, grands et petits.


    Les éons se sont eux-mêmes engendrés en accord avec le troisième fruit, de leur plein gré et grâce à l’intelligence qu’il leur avait donnée pour penser. Ils ne désirent pas rendre gloire [avec] ce que les Plénitudes distinctes ont produit d’une seule voix comme paroles de [louange].[c] Ils ne désirent pas non plus rendre gloire avec la Totalité entière, ni glorifier avec un éon particulier qui aurait atteint un lieu ou un état plus élevé que le sien, à moins qu’il n’obtienne <ce qui> était désiré de celui qui porte un nom plus éminent et occupe un lieu plus élevé.[d]


    […] Ils s’accueillent mutuellement dans le lieu supérieur. Celui qui a désiré s’élever davantage s’engendre lui-même, pour ainsi dire : il s’engendre avec l’autre et avec ce qu’il est. Il est renouvelé avec celui qui lui est venu de la part de son frère ; il le contemple et le supplie à ce sujet.[b]


    Pour que cela se passe ainsi, celui qui a désiré rendre gloire ne lui en dit rien, sinon ceci : une limite a été imposée à la parole dans la Plénitude. Ainsi, ils gardent le silence au sujet du caractère insaisissable du Père, tout en étant autorisés à parler de leur désir de le saisir.'
