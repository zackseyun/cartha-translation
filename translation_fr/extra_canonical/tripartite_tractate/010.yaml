lexical_decisions:
- source_word: emanation
  choice: émanation
  rationale: Terme consacré et transparent dans le contexte cosmologique ; il conserve l’idée d’une provenance sans imposer une séparation matérielle.
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: Maintient la terminologie abstraite et la distinction entre pluriel et singulier du témoin.
- source_word: the existent one
  choice: Celui qui existe
  rationale: Formulation personnelle et intelligible qui conserve la valeur existentielle du titre sans l’assimiler à un nom doctrinal particulier.
- source_word: extension / extends himself
  choice: déploiement / se déploie
  rationale: Exprime une expansion continue sans suggérer une division ou un simple allongement corporel.
- source_word: age
  choice: âge
  rationale: Conserve le parallèle entre l’âge présent et l’âge de vérité, sans substituer automatiquement « monde » ou « éon ».
- source_word: aeons
  choice: éons
  rationale: Terme technique usuel en français pour les réalités personnifiées de cette cosmologie.
- source_word: Fullness / Fullnesses
  choice: Plénitude / Plénitudes
  rationale: Rend le sens du terme tout en gardant sa fonction technique et les alternances de nombre du témoin.
- source_word: grasp / ungraspability
  choice: saisir / caractère insaisissable
  rationale: Préserve le jeu lexical entre le désir de saisir le Père et l’impossibilité de le saisir pleinement.
theological_decisions:
- issue: Rapport entre le Père et les êtres issus de lui
  choice: « afin que […] puissent eux aussi devenir lui »
  alternative: « devenir comme lui »
  rationale: Le témoin dit « become him » ; ajouter « comme » atténuerait une affirmation métaphysique volontairement forte.
- issue: Unité et multiplicité de l’âge de vérité
  choice: « parce qu’il est un et multiple »
  alternative: « à la fois un et multiple »
  rationale: La formulation retenue préserve directement la tension conceptuelle sans l’expliquer ni la résoudre.
- issue: Auto-engendrement des éons
  choice: « se sont eux-mêmes engendrés » et « s’engendre lui-même »
  alternative: « se sont manifestés »
  rationale: Le langage paradoxal de l’engendrement est conservé plutôt que remplacé par une notion théologiquement moins marquée.
- issue: Limite imposée à la parole au sujet du Père
  choice: silence sur le « caractère insaisissable » du Père, mais parole permise sur le désir de le saisir
  alternative: silence absolu concernant le Père
  rationale: Maintient la distinction et la tension présentes dans le passage.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques indispensables (« éons », « Plénitude ») sont conservés, tandis que la syntaxe est légèrement clarifiée sans résoudre les ambiguïtés du témoin. Ce brouillon repose sur le témoin anglais public fourni ; une vérification directe du copte du Codex de Nag Hammadi I,5 reste nécessaire avant publication définitive.
