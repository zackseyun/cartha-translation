review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire, surtout pour préserver exactement les marqueurs critiques du témoin fourni (crochets, parenthèses, chevrons et lacunes) et pour corriger quelques glissements de sens ou de référent. L’examen direct du copte étant explicitement en attente, l’évaluation reste fondée sur le témoin anglais fourni.
  naturalness: Le français est globalement soutenu et intelligible, mais certaines tournures sont inutilement calquées ou peu idiomatiques (« que personne ne commande », « son visage avec son beau nom », « des êtres de maladie »). Elles sont corrigées sans lever les ambiguïtés cosmologiques ou pronominales du texte.
  terminology: « archonte », « Démiurge », « éon », « Parole », « Totalités » et « puissances » sont appropriés. Les notes proposées sont utiles et non confessionnelles. La note sur le Démiurge est légèrement resserrée afin de décrire le passage plutôt que de préjuger de son système.
  issues:
  - severity: medium
    issue: Les marques éditoriales du témoin ne sont pas toujours conservées.
    rationale: Le projet remplace notamment (his works) par [ses œuvres], [] par […] et (entities of) par une paraphrase sans parenthèses. Ces marqueurs signalent des statuts textuels distincts et doivent être reproduits dans la traduction.
  - severity: medium
    issue: Quelques formulations modifient ou obscurcissent la syntaxe du témoin.
    rationale: « que personne ne commande » suggère qu’aucun sujet ne le commande, alors que le sens est qu’il ne reçoit d’ordres de personne. « établi comme père » ne rend pas clairement « being assigned as the father ». La phrase sur les « entités de maladies » doit aussi conserver la parenthèse interprétative du témoin.
  - severity: low
    issue: Plusieurs expressions peuvent être rendues plus naturellement sans interprétation supplémentaire.
    rationale: Les corrections apportées à « laissé derrière lui », « seigneurs gouvernants », « gardent la place » et « archontes qui sont au-dessus d’eux » améliorent le français tout en maintenant les référents ambigus.
  revised_text: 'Au-dessus de tous les archontes[a], il établit un archonte qui ne reçoit d’ordres de personne. Il est le seigneur de tous, c’est-à-dire le visage que la Parole a produit par sa pensée comme représentation du Père des Totalités. Il est donc paré de tout <nom> qui est à son image, puisqu’il possède toute qualité et tout attribut glorieux. C’est pourquoi on l’appelle même « Père », « Dieu », « Démiurge »[b], « Roi », « Juge », « Lieu », « Demeure » et « Loi ». La Parole l’emploie comme une main pour mettre en ordre l’œuvre des réalités d’en bas, et elle l’emploie comme une bouche pour dire ce qui doit être prophétisé. Il parla et mit en ordre ; lorsqu’il vit que (ses œuvres) étaient grandes, bonnes et merveilleuses, il éprouva plaisir et joie, comme [] s’il les avait, dans ses propres pensées, prononcées et accomplies, ignorant que le mouvement en lui provenait de l’Esprit, qui le meut d’une manière prédestinée à faire tout ce qu’il lui arrive de vouloir.


    Quant aux choses qui vinrent à l’existence par lui, il parla à leur sujet, et elles vinrent à l’existence à la ressemblance des lieux spirituels dont nous avons parlé plus haut au sujet des images. Il <fit> plus que simplement œuvrer : puisqu’il avait été désigné comme le père de son dessein de salut, il engendra non seulement par lui-même et par les semences, mais aussi [par] l’Esprit choisi, qui descendra [par lui] vers les lieux d’en bas. Il fait [plus] que simplement prononcer ses propres paroles spirituelles, <mais> il le fait d’une manière cachée par l’Esprit qui crie et donne naissance à des choses qui surpassent sa propre nature. Puisque, par nature, il est Dieu et Père et porte tous les autres titres honorifiques, il pensa qu’ils appartenaient à sa propre nature.


    Il fonda un repos pour ceux qui lui obéissent ; quant à ceux qui lui désobéissent, <il> <institua> aussi des châtiments. Un paradis et un royaume demeurent auprès de lui, ainsi que toutes les autres réalités qui demeurent dans l’éon[c] qui existait avant lui. Elles ont plus de valeur que les copies, en raison de leur rapport à la pensée. Ce rapport est, pour ainsi dire, comparable à [] une ombre et un vêtement, car il ne peut voir comment ce qui existe existe réellement.


    Il institua des ouvriers et des serviteurs pour l’assister dans ce qu’il ferait et dans ce qu’il dirait, car partout où il agissait, il laissait derrière lui son visage avec son beau nom, produisant et prononçant tout ce qu’il contemple. De sa propre essence, [il] établit à sa place des images visibles de la lumière et [les] lieux spirituels (invisibles) [ ]. Ainsi, tout lieu, partout, fut embelli par lui, reflétant l’image de celui qui les y avait placés ; c’est ainsi qu’ils furent établis. Bien que les paradis, les royaumes, les repos, les promesses et les multitudes de serviteurs chargés d’accomplir sa volonté soient des seigneurs gouvernants, ils sont placés au-dessous du seigneur qui les a établis.


    Après l’avoir ainsi écouté, il plaça les lumières qui <constituent> la source <du> système au-dessus de l’agencement des réalités d’en bas. C’est ainsi que l’Esprit invisible le mit en mouvement, afin qu’il [] soit disposé à gouverner par l’intermédiaire de son propre serviteur, qu’il employa aussi comme une main, comme une <bouche> et même comme son visage. Il produisit l’ordre, les menaces et la peur, afin que ceux qui agissaient dans l’ignorance […] puissent garder la place [qui leur avait été donnée à] garder, car ils sont liés à leurs places par [les chaînes des] archontes qui sont au-dessus d’eux.


    La nature entière de la matière [est] divisée en trois catégories : la Parole spirituelle produisit les [premières] puissances à partir de l’imagination et de l’orgueil, et les plaça au premier rang selon l’ordre spirituel. Quant aux (puissances) que celles-ci produisirent par désir de domination, il les plaça au rang intermédiaire, parce qu’elles [par conséquent] <étaient> des puissances avides de domination, afin qu’elles puissent gouverner et imposer avec force des ordres contraignants à l’organisation située au-dessous d’elles. Celles qui vinrent à l’existence par l’envie et la jalousie, ainsi que toute autre descendance issue de telles dispositions, il les plaça dans un ordre de servitude, afin de dominer les limites les plus extérieures et de commander à tout ce qui existe et à toute génération. De celles-ci proviennent des (entités de) maladies qui tuent soudainement et qui sont avides d’engendrer, bien qu’elles n’aient été rien dans le lieu d’où elles étaient issues et où elles
    retourneront. Il établit donc au-dessus d’elles des puissances investies d’autorité, travaillant sans cesse sur la matière, afin que [] la descendance des êtres existants puisse elle aussi exister sans cesse, car telle est leur gloire.'
