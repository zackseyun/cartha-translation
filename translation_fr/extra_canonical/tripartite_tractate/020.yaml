translation:
  language: fr
  text: 'Au-dessus de tous les archontes[a], il établit un archonte que personne ne commande. Celui-ci est leur seigneur à tous : il est le visage que la Parole a produit par sa pensée pour être une représentation du Père des Totalités. Il est donc paré de tout <nom> qui est une ressemblance de celui-ci, puisqu’il possède toute qualité et tout attribut glorieux. C’est pourquoi on l’appelle même « Père », « Dieu », « Démiurge »[b], « Roi », « Juge », « Lieu », « Demeure » et « Loi ». La Parole l’emploie comme une main pour mettre en ordre l’œuvre des réalités inférieures, et elle l’emploie comme une bouche pour dire ce qui doit être prophétisé. Il parla et mit en ordre ; puis, lorsqu’il vit que [ses œuvres] étaient grandes, bonnes et merveilleuses, il éprouva plaisir et joie, comme […] si, dans ses propres pensées, il les avait dites et accomplies. Il ignorait que le mouvement qui était en lui venait de l’Esprit, lequel le pousse, d’une manière prédestinée, à faire tout ce qu’il se trouve
    vouloir.


    Quant aux choses qui vinrent à l’existence par lui, il parla à leur sujet, et elles vinrent à l’existence à la ressemblance des lieux spirituels dont nous avons parlé plus haut à propos des images. Il <fit> plus que simplement œuvrer : établi comme père de son dessein de salut, il engendra non seulement par lui-même et par les semences, mais aussi [par] l’Esprit choisi, qui descendra [par lui] vers les lieux inférieurs. Il fait [plus] que simplement prononcer ses propres paroles spirituelles : <il le fait> d’une manière cachée, par l’Esprit qui crie et donne naissance à des choses qui surpassent sa propre nature. Puisque, selon sa nature, il est Dieu et Père, ainsi que tous les autres titres honorifiques, il pensa que ceux-ci appartenaient à sa propre nature.


    Il fonda un repos pour ceux qui lui obéissent ; pour ceux qui lui désobéissent, <il> <institua> aussi des châtiments. Un paradis et un royaume demeurent auprès de lui, ainsi que toutes les autres réalités qui demeurent dans l’éon[c] qui existait avant lui. Elles ont plus de valeur que les copies, à cause de leur rapport à la pensée. Ce rapport est, pour ainsi dire, comparable à […] une ombre et un vêtement, car il ne peut voir de quelle manière ce qui existe existe réellement.


    Il institua des ouvriers et des serviteurs pour l’assister dans ce qu’il ferait et dirait, car partout où il agissait, il laissait son visage avec son beau nom, produisant et proclamant tout ce qu’il contemple. De sa propre essence, [il] établit à sa place des images visibles de la lumière et [les] lieux spirituels [invisibles]. Ainsi, tout lieu, partout, fut embelli par lui, reflétant l’image de celui qui les avait placés, et c’est ainsi qu’ils furent établis. Bien que les paradis, les royaumes, les repos, les promesses et les multitudes de serviteurs chargés d’accomplir sa volonté soient des seigneurs qui gouvernent, ils sont placés au-dessous du seigneur qui les a établis.


    Après l’avoir ainsi écouté, il plaça les lumières qui <constituent> la source <du> système au-dessus de l’organisation des réalités inférieures. C’est ainsi que l’Esprit invisible le mit en mouvement, afin qu’il […] soit disposé à gouverner par l’intermédiaire de son propre serviteur, qu’il employa aussi comme une main, comme une <bouche> et même comme son visage. Il produisit l’ordre, les menaces et la peur, afin que ceux qui agissaient dans l’ignorance […] puissent conserver le lieu [qui leur avait été donné] à garder, car ils sont attachés à leurs lieux par [les chaînes des] archontes placés au-dessus d’eux.


    La nature entière de la matière [est] divisée en trois catégories. La Parole spirituelle produisit les [premières] puissances à partir de l’imagination et de l’orgueil, et les plaça au premier rang selon l’ordre spirituel. Quant aux [puissances] que celles-ci produisirent par désir de domination, il les plaça au rang intermédiaire, puisqu’elles <étaient> par conséquent des puissances avides de domination, afin qu’elles puissent gouverner et imposer par la force des ordres contraignants à l’organisation située au-dessous d’elles. Celles qui vinrent à l’existence par l’envie et la jalousie, ainsi que toute autre descendance issue de telles dispositions, il les plaça dans un ordre de servitude pour qu’elles dominent les limites les plus extérieures et commandent à tout ce qui existe ainsi qu’à toute génération. De celles-ci proviennent des êtres de maladie qui tuent soudainement et qui sont avides d’engendrer, bien qu’ils n’aient rien été dans le lieu d’où ils étaient issus et où ils retourneront.
    Il établit donc au-dessus d’eux des puissances investies d’autorité, qui travaillent sans cesse sur la matière, afin que […] la descendance de ceux qui existent puisse, elle aussi, exister sans cesse, car telle est leur gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « archontes » sont des puissances dirigeantes du monde inférieur dans la cosmologie du traité.
    reason: Le terme technique est peu courant en français moderne et demande une brève orientation sans identification doctrinale supplémentaire.
  - marker: b
    text: « Démiurge » signifie ici l’ordonnateur ou artisan du monde inférieur ; le passage lui attribue de hauts titres tout en disant qu’il ignore la source spirituelle de son mouvement.
    reason: Le titre technique peut être mal compris comme un simple synonyme de Dieu créateur ; la note préserve la tension propre au passage.
  - marker: c
    text: Un « éon » est, dans le vocabulaire de ce traité, une réalité ou un domaine d’existence du monde spirituel, et pas seulement une longue période de temps.
    reason: Le sens cosmologique diffère du sens courant d’« âge ».
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Terme technique ancien conservé en français afin de ne pas réduire ces puissances dirigeantes à de simples « chefs » ou « autorités ».
- source_word: Word
  choice: la Parole
  rationale: Rend le terme théologique de manière française traditionnelle et intelligible, tout en conservant sa fonction personnelle dans le traité.
- source_word: Demiurge
  choice: Démiurge
  rationale: Conserve le titre cosmologique technique sans lui ajouter une évaluation doctrinale absente de la phrase.
- source_word: Totalities
  choice: Totalités
  rationale: Le pluriel inhabituel est maintenu, car il peut désigner les plérômes ou ensembles transcendants propres au vocabulaire du traité.
- source_word: aeon
  choice: éon
  rationale: Translittération française usuelle du terme technique, préférable à « âge » dans ce contexte cosmologique.
- source_word: repose
  choice: repos
  rationale: Préserve le motif sotériologique du repos sans l’interpréter comme simple détente ou comme lieu précis.
- source_word: system
  choice: système
  rationale: Choix littéral provisoire qui préserve l’abstraction et l’ambiguïté cosmologique du témoin anglais.
- source_word: powers
  choice: puissances
  rationale: Rend des êtres ou forces hiérarchiques sans les assimiler automatiquement à des autorités politiques.
theological_decisions:
- issue: Statut divin et titres du Démiurge
  choice: Conserver tous les titres (« Père », « Dieu », etc.) tout en maintenant l’ignorance que le récit lui attribue.
  alternative: Atténuer « Dieu » ou expliquer explicitement que ces titres seraient faux.
  rationale: Le passage maintient intentionnellement une tension entre la dignité fonctionnelle du personnage et son ignorance de l’Esprit qui le meut ; la traduction ne doit pas la résoudre.
- issue: Agent réel de l’action du Démiurge
  choice: Préserver les pronoms et la causalité indirecte de l’Esprit sans identifier davantage les référents.
  alternative: Réécrire les phrases pour faire de la Parole ou de l’Esprit le sujet explicite de chaque action.
  rationale: Le témoin présente plusieurs référents masculins et une médiation complexe ; une explicitation pourrait imposer une lecture théologique.
- issue: Prédestination du mouvement
  choice: « d’une manière prédestinée »
  alternative: « selon la providence » ou « inévitablement »
  rationale: Le choix conserve le langage fort du témoin sans préciser qui prédestine ni développer une doctrine générale de la prédestination.
- issue: Nature des réalités inférieures et de leurs copies
  choice: Maintenir le vocabulaire d’images, de copies, d’ombre et de vêtement.
  alternative: Parler d’illusions ou de créations mauvaises.
  rationale: Le texte établit une hiérarchie ontologique sans déclarer ici que toute copie est pure illusion ou mal absolu.
- issue: Entités associées aux maladies
  choice: « des êtres de maladie »
  alternative: « des maladies » ou « des démons de maladie »
  rationale: La formulation étrange conserve l’apparente personnification du témoin sans introduire le terme interprétatif « démons ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques indispensables sont conservés et brièvement expliqués. Les crochets, chevrons et points de suspension signalant suppléments, restitutions ou lacunes du témoin fourni sont maintenus autant que possible. Comme l’examen direct du copte reste annoncé comme en attente, le présent texte est un projet provisoire fondé sur le témoin anglais public fourni ; les ambiguïtés de pronoms et les aspérités syntaxiques significatives n’ont pas été harmonisées doctrinalement.
