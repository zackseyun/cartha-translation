  text: 'And <he> invisibly sowed in him a word that was intended to become knowledge, and he gave him power to move away and to cast away from himself those who disobey him. In this way, he revealed himself to him. But to those who came into being for his sake, he revealed a form beyond their grasp. They therefore behaved with hostility toward one another. <He> suddenly revealed himself to them, drawing near in the form of lightning and departing like a flash of lightning. When finishing their mutual entanglement, he ended it [] through the sudden revelation, for which they were unprepared, were not expecting, and did not know.


    This frightened them, and they fell down because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> called the Little One, so they have only a dim idea of the Exalted One who exists before them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. Therefore, they received his revelation and prostrated themselves before him. They became witnesses who were persuaded of <him>, acknowledging that the light which had appeared was stronger than those who resisted them.


    But those of the likeness became terribly afraid because they could not bear to hear about him in the beginning, that a vision of this kind could exist. Consequently, they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, given that it was evidently stronger than they were. They were considered worthy to rule over the indescribable darkness because they own it, and it is the lot assigned to them. He granted that they too would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came into being, the revelation for the one who was deficient, and the revelation for those who came into being because of him. He revealed himself to him within him because he is with him, sharing in his suffering, gradually giving him repose, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. But to those who fell outside, he revealed himself suddenly and in a flash. Then he quickly withdrew himself, not allowing them to gaze on him.'
translation:
  language: fr
  text: 'Et <il> sema invisiblement en lui une parole destinée à devenir connaissance, et il lui donna le pouvoir de s’éloigner et de rejeter loin de lui ceux qui lui désobéissent. C’est ainsi qu’il se révéla à lui. Mais à ceux qui étaient venus à l’existence à cause de lui, il révéla une forme qui échappait à leur compréhension. Ils se comportèrent donc en ennemis les uns envers les autres. <Il> se révéla soudain à eux : il s’approcha sous la forme d’un éclair et repartit comme un éclair. Lorsqu’il mit fin à leur enchevêtrement mutuel, il y mit un terme [] par cette révélation soudaine, à laquelle ils n’étaient pas préparés, qu’ils n’attendaient pas et qu’ils ne connaissaient pas.


    Cela les effraya, et ils tombèrent, car ils ne pouvaient supporter l’apparition de la lumière qui les avait frappés. Celui qui était apparu dévasta les deux ordres. De même que les êtres de la mémoire <ont été> appelés « le Petit », ils n’ont qu’une idée obscure de l’Exalté qui existe avant eux, et ils ont semé en eux-mêmes un sentiment d’émerveillement devant l’Exalté qui doit se manifester. Ils accueillirent donc sa révélation et se prosternèrent devant lui. Ils devinrent des témoins convaincus de <lui>, reconnaissant que la lumière qui était apparue était plus forte que ceux qui leur résistaient.


    Mais ceux de la ressemblance furent saisis d’une grande peur, car, dès le commencement, ils ne pouvaient supporter d’entendre parler de lui ni qu’une vision de cette sorte puisse exister. Ils plongèrent donc dans le gouffre de l’ignorance appelé « les Ténèbres extérieures », « le Chaos », « la Mort » et « l’Abîme ». Il les plaça au-dessous de l’ordre des êtres de la mémoire, puisque celui-ci était manifestement plus fort qu’eux. Ils furent jugés dignes de régner sur les ténèbres indescriptibles, parce qu’elles leur appartiennent et constituent la part qui leur a été attribuée. Il accorda qu’eux aussi soient utiles au dessein de salut qui devait se déployer, [] même à celui dont <ils> n’avaient pas conscience.


    Il y a une [grande] différence entre la révélation destinée à celui qui vint à l’existence, celle destinée à celui qui était déficient et celle destinée à ceux qui vinrent à l’existence à cause de lui. Il se révéla à lui au-dedans de lui, parce qu’il est avec lui : il partage sa souffrance, lui accorde peu à peu le repos, le fait grandir, l’élève et se donne à lui pour qu’il jouisse de sa vision. Mais à ceux qui tombèrent au-dehors, il se révéla soudainement, en un éclair. Puis il se retira rapidement, sans leur permettre de le contempler.'
