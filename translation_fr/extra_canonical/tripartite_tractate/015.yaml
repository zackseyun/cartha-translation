lexical_decisions:
- source_word: word
  choice: parole
  rationale: « Parole » conserve la portée potentiellement personnelle ou révélatrice du terme sans la réduire à un simple mot.
- source_word: knowledge
  choice: connaissance
  rationale: Terme naturel qui préserve le sens cognitif et religieux du témoin.
- source_word: form
  choice: forme
  rationale: Choix formel qui évite de préciser indûment s’il s’agit d’une apparence, d’une figure ou d’une manifestation.
- source_word: orders
  choice: ordres
  rationale: Maintient la désignation de groupes ou niveaux structurés sans imposer une cosmologie plus précise.
- source_word: beings of memory
  choice: êtres de la mémoire
  rationale: Calque intelligible retenu comme appellation technique, faute de vérification directe du copte.
- source_word: likeness
  choice: ressemblance
  rationale: Préserve l’abstraction et la terminologie distinctive du passage.
- source_word: Outer Darkness
  choice: Ténèbres extérieures
  rationale: Expression française établie et littérale, conservée comme nom propre conceptuel.
- source_word: plan of salvation
  choice: dessein de salut
  rationale: « Dessein » rend l’idée d’un plan qui se déploie tout en gardant un registre religieux digne.
- source_word: repose
  choice: repos
  rationale: Rend simplement le terme sans lui attribuer une définition sotériologique particulière.
- source_word: gaze on him
  choice: le contempler
  rationale: Exprime un regard soutenu et chargé de portée visionnaire, plus naturel ici que « le fixer du regard ».
theological_decisions:
- issue: Identité des référents pronominaux
  choice: Maintenir les pronoms ambigus et les suppléments entre chevrons
  alternative: Identifier explicitement chaque figure cosmologique
  rationale: Le témoin ne permet pas toujours de déterminer les référents avec certitude; les expliciter résoudrait artificiellement l’ambiguïté.
- issue: Statut de la « parole » semée
  choice: Employer « parole » sans majuscule
  alternative: Employer « Parole » ou « Logos »
  rationale: Le passage peut avoir une portée hypostatique, mais le témoin fourni ne justifie pas à lui seul une identification dogmatique explicite.
- issue: Jugement porté sur ceux de la ressemblance
  choice: Conserver « jugés dignes » malgré la tension avec leur domaine de ténèbres
  alternative: Rendre par « assignés » ou « condamnés »
  rationale: La formulation paradoxale appartient au texte et ne doit pas être normalisée théologiquement.
- issue: Fonction dans le dessein de salut
  choice: Dire qu’ils seront eux aussi « utiles » au dessein
  alternative: Dire qu’ils participeront volontairement au salut
  rationale: Le texte précise qu’ils n’en avaient pas conscience; la traduction préserve donc une utilité providentielle sans leur attribuer une intention salvifique.
- issue: Différentes modalités de révélation
  choice: Préserver la distinction entre révélation intérieure et manifestation soudaine extérieure
  alternative: Harmoniser toutes les manifestations en une seule expérience
  rationale: Cette opposition structure le passage et porte une tension théologique essentielle.
