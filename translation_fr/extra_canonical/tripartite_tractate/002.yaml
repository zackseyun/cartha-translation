lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: incompréhensible / insaisissable
  rationale: Maintient la distinction du témoin entre l’impossibilité de comprendre et celle de saisir par la pensée.
- source_word: scale
  choice: mesure
  rationale: « Mesure » rend naturellement l’idée d’étendue ou de dimension sans imposer une interprétation plus précise.
- source_word: sustenance, joyful, true, pleasing, and restful
  choice: nourriture, joie, vérité, agrément et repos
  rationale: La syntaxe anglaise est instable ; une série nominale française conserve les catégories positives sans décider si tous les termes sont des adjectifs ou des substantifs dans la source.
- source_word: the Totalities
  choice: les Totalités
  rationale: Conserve comme terme technique la désignation collective propre au cadre cosmologique du traité.
- source_word: self-begotten
  choice: engendré de lui-même
  rationale: Formulation transparente qui préserve l’affirmation paradoxale d’un auto-engendrement.
- source_word: projects himself
  choice: se projette lui-même
  rationale: Préserve le vocabulaire émanationniste du témoin sans le remplacer par « crée » ou « manifeste ».
- source_word: subsisting in him
  choice: qui subsiste en lui
  rationale: Rend la permanence ontologique indiquée sans préciser davantage la relation entre le Père et le Fils.
- source_word: unbegotten
  choice: inengendré
  rationale: Terme théologique français établi, ici nécessaire pour rester distinct d’« engendré de lui-même ».
- source_word: Firstborn and only Son
  choice: Premier-né et Fils unique
  rationale: Conserve les deux titres et l’explication paradoxale qu’en donne immédiatement le traité.
theological_decisions:
- issue: Identité de celui qui s’engendre lui-même
  choice: Conserver les pronoms et la formulation paradoxale du témoin
  alternative: Identifier explicitement l’auto-engendré au Père ou au Fils dans chaque proposition
  rationale: Le passage articule de façon difficile la connaissance de soi du Père, l’auto-engendrement et l’existence du Fils ; préciser davantage résoudrait une tension que le témoin laisse subsister.
- issue: Relation éternelle du Fils au Père
  choice: « le Fils existe éternellement dans le Père »
  alternative: Employer une formulation doctrinale telle que « coéternel au Père »
  rationale: La traduction suit l’affirmation spatiale et temporelle du témoin sans importer une terminologie confessionnelle ultérieure.
- issue: Sens de « silence », « sagesse » et « don »
  choice: Conserver la série sans identifier explicitement chacun de ces termes au Fils
  alternative: Écrire « le Fils est le Silence, la Sagesse et le Don »
  rationale: Le référent de « cela » reste incertain dans le témoin ; la traduction préserve cette ambiguïté.
- issue: Premier-né et Fils unique
  choice: Maintenir côte à côte les deux titres avec les justifications propres au texte
  alternative: Harmoniser les titres selon une christologie canonique particulière
  rationale: Le traité définit lui-même ces termes de manière singulière ; cette tension ne doit pas être corrigée.
- issue: Genre ou statut du « fruit »
  choice: Employer le masculin grammatical « son fruit, lequel » sans identifier son référent
  alternative: Identifier le fruit à une entité, une émanation ou une communauté précise
  rationale: Le passage fourni ne donne pas assez d’éléments pour résoudre le référent théologique.
