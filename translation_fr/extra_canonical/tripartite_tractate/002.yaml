translation:
  language: fr
  text: 'Si donc il est incompréhensible, il ne peut, par conséquent, être connu. Aucune pensée ne peut le saisir ; il est invisible à tout, inexprimable par quelque parole que ce soit, hors d’atteinte de toute main. Lui seul se connaît tel qu’il [] est, et connaît tels qu’ils sont sa forme, sa grandeur et sa mesure. Parce qu’il peut se concevoir lui-même, se voir, se nommer et se comprendre, il est le seul dont la pensée, l’œil, la bouche et la forme propres équivalent à son être même. Ainsi, il est ce qu’il conçoit, ce qu’il voit, ce qu’il dit et ce qu’il comprend, lui qui est inconcevable, inexprimable, insaisissable et immuable ; tandis que ce qu’il conçoit, voit et dit, ce qu’il a pensé, est nourriture, joie, vérité, agrément et repos. Il surpasse toute sagesse et s’élève au-dessus de toute pensée, de toute gloire, de toute beauté, de toute douceur, de toute grandeur, de toute profondeur et de toute hauteur.


    Celui qui est inconnaissable par nature et qui possède tous les grands attributs que j’ai énumérés peut, s’il veut, dans la richesse de sa douceur, accorder la connaissance qui permet de le connaître. Sa puissance pour le faire, c’est sa volonté. Néanmoins, le Grand se retient dans le silence, lui qui fait accéder les Totalités[a] à leur existence éternelle.


    [] À proprement parler, il s’engendre lui-même d’une manière inexprimable, car lui seul est engendré de lui-même : il est conçu de lui-même et il se connaît tel qu’il est. De sa grandeur infinie, de sa sagesse insondable, de sa puissance sans mesure et de sa douceur qui dépasse toute saveur, il produit tout ce qui est digne de son respect, de sa gloire, de son honneur et de sa louange. Il se projette lui-même selon le mode de l’engendrement, recevant gloire et louange, honneur et amour ; il se glorifie et se loue lui-même, se donnant honneur et amour. C’est ainsi qu’il a un Fils, qui subsiste en lui. Il demeure silencieux à son sujet : le Fils est inexprimable dans l’Inexprimable, invisible dans l’Invisible, insaisissable dans l’Insaisissable, incompréhensible dans l’Incompréhensible.


    C’est ainsi que le Fils existe éternellement dans le Père. Comme nous l’avons expliqué précédemment, le Père, sur un mode inengendré, se connaît lui-même en lui-même, lui qui s’est engendré par la pensée — la pensée à son sujet —, laquelle est la perception [] de lui-même, le […] de sa nature éternelle. Toutefois, à proprement parler, cela est le silence, la sagesse et le don, si telle est bien la manière correcte de le nommer. De même que le Père, à proprement parler, existe — lui avant qui [personne d’autre n’existait] et en dehors [duquel] il n’y a aucun autre être inengendré —, de même [le Fils], à proprement parler, existe : personne d’autre n’existait avant lui et aucun autre fils n’existera après lui. Il est donc Premier-né et Fils unique. Il est le Premier-né parce que personne n’existe avant lui, et il est Fils unique parce que personne ne viendra après lui. En outre, il a son fruit, lequel ne peut être connu à cause de sa grandeur transcendante. Pourtant, dans la richesse de
    sa douceur, il a voulu que son fruit soit connu. Il a révélé une puissance inexprimable et l’a mêlée à la grande richesse de sa générosité.'
