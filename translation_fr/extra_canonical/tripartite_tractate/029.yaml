review_pass:
  verdict: revise
  source_fidelity: La traduction suit globalement avec soin le témoin anglais fourni et conserve utilement les crochets, chevrons et lacunes. Cependant, « quelques paroles » affaiblit et pluralise indûment « a minor word from a voice ». Quelques formulations doivent aussi préserver plus exactement les segments lacunaires et la syntaxe volontairement fragmentaire du témoin. L’examen direct du copte restant en attente, les corrections demeurent limitées aux écarts sûrs par rapport au témoin anglais.
  naturalness: Le français est généralement moderne, clair et d’un registre approprié à un traité cosmologique ancien. Les termes techniques sont maniés de façon cohérente. La phrase très lacunaire sur les serviteurs du Mauvais doit nécessairement demeurer incomplète, mais peut être ponctuée de façon moins trompeuse.
  terminology: Les choix « Logos », « Appel », « Élection », « repos », « Totalité », « Plénitude » et « éons » sont cohérents et les notes évitent une harmonisation confessionnelle. « unité » pour « singularity » est une adaptation française justifiée par la note. « élévation » conserve bien l’ambiguïté de « assumption ».
  issues:
  - severity: medium
    issue: « quelques paroles prononcées par une voix » pour « based solely on a minor word from a voice »
    rationale: Le témoin est au singulier (« a word ») et qualifie cette parole de mineure/insignifiante. Le pluriel et « quelques » modifient l’image et renforcent inutilement le contenu verbal.
  - severity: low
    issue: Des marqueurs lacunaires non remplis « [] » sont rendus par « […] »
    rationale: Le projet distingue les crochets de restitution des ellipses entre crochets pour les lacunes. Là où le témoin porte précisément « [] », il est préférable de conserver « [] » afin de ne pas transformer un emplacement vide en lacune explicitement étendue.
  - severity: low
    issue: « établis sur les causes des réalités existantes »
    rationale: Cette formulation française est peu naturelle et rend imparfaitement « being assigned with the causes ». « chargés des causes » conserve mieux l’idée d’une attribution de fonctions causales.
  revised_text: 'Même s’il y aurait encore beaucoup à dire au sujet de l’Élection[a], et qu’il conviendrait d’en parler, nous devons néanmoins <parler> davantage de ceux de l’Appel, comme sont appelés ceux de la droite, car il ne serait pas bon de les oublier. Nous en avons déjà parlé longuement, comme si cela avait suffi. Pourquoi donc n’en avons-nous parlé qu’en partie ?


    J’ai dit que tous ceux qui ont tiré leur origine du Logos[b] — soit du jugement porté sur les mauvais, soit de la colère qui les combat, soit du fait de se détourner d’eux, c’est-à-dire du retour vers les êtres exaltés, soit de la prière et du souvenir de ceux qui préexistaient, soit encore de l’espérance et de la foi que leur salut pourrait être [obtenu] par de bonnes œuvres — ont tous été jugés dignes, parce qu’ils proviennent des bonnes dispositions et qu’une pensée venue de Celui qui est est la cause de leur engendrement.


    J’ai dit en outre qu’avant que le Logos ne s’engage volontairement auprès d’eux d’une manière invisible, l’Exalté leur avait accordé la pensée mentionnée plus haut, parce qu’ils [y avaient prêté attention] [] : cette pensée devint la cause de leur existence. Quand <ils> furent sauvés, ils ne s’élevèrent pas avec arrogance, comme si rien ne les avait précédés. Ils reconnurent au contraire que leur existence avait une origine et qu’ils désiraient connaître celui qui existait avant eux.


    J’ai dit aussi qu’ils se prosternèrent lorsque la lumière se révéla sous l’apparence d’un éclair, et qu’ils témoignèrent qu’elle était apparue pour leur salut.


    J’ai dit que non seulement ceux qui ont tiré leur origine du Logos obtiendront ce qui est bon, mais que même ceux qu’ils ont produits conformément aux bonnes dispositions jouiront du repos, grâce à la richesse du don. Même ceux qui furent produits par le désir de domination et qui portent en eux la semence de ce désir recevront la récompense des bonnes œuvres, s’ils ont coopéré avec ceux qui sont animés d’une bonne disposition et s’ils désirent délibérément abandonner le vain amour d’une gloire passagère afin d’observer le commandement du Seigneur [] de gloire. Au lieu d’un honneur dérisoire et éphémère, ils hériteront du royaume éternel.


    Il nous fallait reprendre notre exposé antérieur. Mais à présent, afin de développer un raisonnement cohérent, nous devons mettre en relation les causes, les effets et les <preuves> permettant de savoir si ceux de la droite, qu’ils soient sans mélange ou mêlés, peuvent recevoir le don du salut et du repos. Nous devons donc le démontrer de manière convaincante à partir de la forme que prend leur foi.


    Si nous confessons le royaume en Christ, <nous> supprimons toute diversité de formes, toute inégalité et tout changement. Car la fin retrouvera l’unité[c], tout comme le commencement était unité : le lieu où il n’y a ni homme ni femme, ni esclave ni personne libre, ni circoncision ni incirconcision, ni ange ni être humain, mais où Christ est tout en tous. Comment celui qui n’existait pas au commencement peut-il se trouver dans l’existence ? Et quelle est la nature de celui qui n’était pas esclave, puisqu’il prendra place avec [] quelqu’un qui est libre ? Ils recevront même une vision sans intermédiaire et n’auront pas besoin de croire que les choses sont ainsi sur la seule foi d’une parole mineure venant d’une voix.


    Il en est ainsi parce que le rétablissement de ce qui existait autrefois est unité. Même si certains sont élevés en raison du plan du salut, chargés des causes des réalités existantes, mettant en action une multitude de puissances naturelles et y trouvant leur joie — qu’ils soient anges ou êtres humains —, ils parviendront au royaume, à l’affermissement et au salut.


    En voici les raisons : ceux qui apparurent dans la chair crurent sans hésiter qu’il est le Fils du Dieu inconnu, ineffable depuis les temps anciens, que nul n’avait pu voir. Ils renoncèrent aux dieux devant lesquels ils s’étaient auparavant prosternés, ainsi qu’aux seigneurs du ciel et de la terre. Avant même qu’<il> ne soit enlevé, alors qu’il était encore enfant, ils témoignèrent qu’il prêchait déjà. Et quand il se trouvait au tombeau [comme] un mort, les anges crurent qu’il était vivant, [recevant même] la vie [] de celui qui était mort.


    La multitude des rites sacrés et des prodiges qu’ils avaient accomplis dans les temples païens se transforma alors en dévotion envers un autre, c’est-à-dire Christ. C’est leur confession de Christ qui leur donna le pouvoir d’opérer ce changement, tandis qu’ils s’empressaient de s’approcher de lui. Ils n’avaient reçu cette préparation païenne que pour la rejeter ensuite en faveur de celui qui n’avait pas été <honoré> ici-bas, c’est-à-dire dans le monde. Mais en rejetant les dieux païens, [ils gagnèrent] Christ, dont ils comprirent qu’il venait du lieu [exalté], [d’où] ils étaient venus avec lui, un lieu où Dieu règne. Les noms de ceux auxquels ils avaient rendu un culte, donné leurs soins et offert leur service ne leur avaient été que prêtés ; ils les transférèrent alors à celui auquel ils appartiennent en propre.


    Cependant, ce ne fut qu’après son élévation[d] qu’ils reconnurent qu’il était leur Seigneur, au-dessus duquel il n’existe aucun seigneur. Ils lui remirent leurs royaumes ; ils se levèrent [de leurs] trônes, les abandonnant, et déposèrent leurs couronnes. Il se révéla pourtant à eux pour les raisons déjà exposées : afin de les guérir et de les [ramener à] la bonne pensée au sujet de […] [] compagnon et des anges […], ainsi qu’à cause de l’abondance du bien qu’ils accomplirent pour elle. [Ainsi], ils furent chargés des services qui profitent aux élus : porter leur iniquité au ciel en vue d’un jugement éternel, rendu avec un [discernement] incontestable et infaillible. Ils poursuivent leur œuvre en leur faveur jusqu’à ce que tous entrent dans la vie terrestre et en sortent, tandis que leurs corps [demeurent] sur terre. Ils servent tous leurs […], se faisant participants de leurs souffrances, de leurs persécutions et des dangers qui frappèrent les saints plus que les autres.


    Quant aux serviteurs du Mauvais, puisque le mal mérite la destruction <…>, fermement à cause de la [vie commune] qui se trouve au-dessus de tous les mondes, laquelle est leur bonne pensée et leur fraternité.


    Et l’Église se souviendra d’eux comme de vrais amis et de serviteurs fidèles, lorsqu’elle aura reçu la rédemption de celui qui [leur donne] la récompense : la joie qui règne dans la chambre nuptiale[e] et la [ … qui] demeure dans sa maison […] qui demeure dans la pensée […] et ce qu’elle doit à […] [] Christ, qui demeure avec elle, [ainsi que] l’attente pleine d’espérance du Père [de] la Totalité[f], car elle leur fournira des anges pour les guider et les servir.


    Les éons[g] se souviendront des pensées agréables consacrées au service de l’Église <et> leur accorderont leur récompense [pour] toutes leurs méditations. Il s’agit d’une émanation venant d’eux : de même que Christ [accomplit sa] volonté, qui produisit les grandes [réalités] exaltées de l’Église et les lui donna, <de même> cette émanation deviendra une pensée pour ceux-ci et leur procurera les demeures où ils habiteront éternellement. [Après qu’ils auront] rejeté l’attraction vers le bas exercée par la déficience, la puissance de la Plénitude[h] les poussera vers le haut par la grandeur de sa générosité et par la douceur de l’éon préexistant.'
  revised_footnotes:
  - marker: a
    text: « Élection » et « Appel » désignent ici deux catégories distinctes dans l’organisation du salut exposée par le traité.
    reason: Clarifier la terminologie structurante sans identifier ces catégories à une doctrine confessionnelle ultérieure.
  - marker: b
    text: Le « Logos » est ici une réalité personnelle et cosmologique ; le mot peut aussi être traduit par « Parole ».
    reason: Préserver la portée technique et l’ambiguïté lexicale du terme.
  - marker: c
    text: 'Littéralement, selon le témoin utilisé : « singularité ». Le contexte évoque un retour à l’unité du commencement.'
    reason: Signaler le choix idiomatique français sans masquer la forme inhabituelle du témoin.
  - marker: d
    text: Le terme rendu par « élévation » peut désigner le fait d’être emporté ou élevé ; la nature exacte de l’événement n’est pas précisée ici.
    reason: Éviter d’imposer l’Ascension ou une autre lecture doctrinale déterminée.
  - marker: e
    text: La « chambre nuptiale » est une image du salut et de l’union finale dans plusieurs écrits de Nag Hammadi.
    reason: Aider le lecteur moderne sans définir plus précisément le rite ou la théologie visés.
  - marker: f
    text: La « Totalité » désigne l’ensemble ordonné des réalités divines ou spirituelles dans le vocabulaire du traité.
    reason: Conserver le terme technique tout en offrant une orientation minimale.
  - marker: g
    text: Les « éons » sont ici des réalités ou puissances du monde divin, et non de simples périodes de temps.
    reason: Prévenir le contresens courant du français « éon » pris uniquement au sens temporel.
  - marker: h
    text: La « Plénitude » désigne l’ordre divin accompli, opposé ici à la « déficience ».
    reason: Éclairer l’opposition cosmologique centrale sans la surinterpréter.
  revision_rationale: 'Révision limitée aux écarts vérifiables avec le témoin anglais : restitution du singulier et de la faiblesse de « a minor word », conservation des marqueurs vides « [] » là où le témoin les porte, et amélioration prudente de « being assigned with the causes ». Les passages corrompus ou syntaxiquement incomplets demeurent explicitement lacunaires, sans reconstruction doctrinale ou interprétative.'
