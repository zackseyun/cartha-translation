lexical_decisions:
- source_word: Election
  choice: Élection
  rationale: Conserve le terme technique personnifié et sa distinction structurante avec l’Appel.
- source_word: Calling
  choice: Appel
  rationale: Rend le concept abstrait et personnifié sans lui substituer une interprétation confessionnelle telle que « vocation ».
- source_word: aeon
  choice: éon
  rationale: Maintient le terme cosmologique technique courant dans les traductions modernes des textes gnostiques.
- source_word: Fullness
  choice: Plénitude
  rationale: Équivalent traditionnel de la notion technique de plérôme, tout en restant intelligible en français courant.
- source_word: Human
  choice: Humain
  rationale: La majuscule préserve le statut technique et probablement archétypal du terme, sans imposer « Homme » ni une identification précise.
- source_word: Totality / Totalities
  choice: Totalité / Totalités
  rationale: Reproduit la variation singulier-pluriel et la valeur technique du témoin.
- source_word: redemption
  choice: rédemption
  rationale: Préserve le terme sotériologique central et ses liens internes, plutôt que d’alterner avec « salut » ou « délivrance ».
- source_word: restoration
  choice: restauration
  rationale: Distingue cette notion de la rédemption et conserve l’idée d’un retour à un état antérieur.
- source_word: archetypes
  choice: archétypes
  rationale: Terme français exact et accessible dans le contexte du couple « images et archétypes ».
- source_word: fleshly humans / fleshly Son
  choice: humains de chair / Fils de chair
  rationale: Conserve le parallélisme lexical et évite la connotation principalement morale de « charnel ».
theological_decisions:
- issue: Le Fils est dit avoir besoin de rédemption
  choice: « Même le Fils […] [avait besoin] lui aussi de rédemption »
  alternative: Atténuer en « participa lui aussi à la rédemption »
  rationale: Le témoin affirme une tension théologique réelle et marque en outre une restitution éditoriale; la traduction ne doit pas la résoudre.
- issue: Référent féminin dans « he hopes for her »
  choice: « il espère en elle »
  alternative: « il l’attend » ou identifier explicitement l’Église/l’Appel
  rationale: Le référent demeure incertain dans le témoin; une formulation légèrement inhabituelle conserve cette ambiguïté plutôt que de la trancher.
- issue: Ceux de la droite et de la gauche
  choice: Conserver les deux groupes sans les identifier
  alternative: Les définir comme puissances mauvaises, psychiques ou cosmiques
  rationale: Le passage ne fournit pas ici une identification suffisante; toute précision importerait un système interprétatif.
- issue: « the pre-existent »
  choice: « ce qui préexistait »
  alternative: « le Préexistant »
  rationale: Le témoin permet une lecture substantivée ou neutre. Le neutre préserve l’ambiguïté et s’accorde avec l’idée de retour sans créer une personne divine distincte.
- issue: « angelic redemption of the Father »
  choice: « la rédemption angélique du Père »
  alternative: « la rédemption des anges venant du Père »
  rationale: La construction est théologiquement et grammaticalement ambiguë; le calque intelligible conserve les relations possibles entre les termes.
- issue: Unité du corps de l’Église
  choice: « jusqu’à ce que tous les membres […] <soient réunis> »
  alternative: Présenter l’union comme déjà accomplie
  rationale: Le supplément éditorial et l’orientation future sont maintenus afin de préserver le mouvement eschatologique du texte.
translation_notes:
  register: 'Français international moderne, soutenu mais lisible. Les majuscules signalent les notions techniques personnifiées ou cosmologiques du témoin. Les crochets carrés, crochets vides, chevrons, parenthèses et l’ellipse entre chevrons ont été conservés comme signaux textuels ou éditoriaux. Aucun appel de note n’est ajouté puisqu’aucune note de bas de page n’est nécessaire dans le corps du passage. Traduction nécessairement provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.'
