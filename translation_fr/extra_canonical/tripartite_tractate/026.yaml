  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose servants and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: fr
  text: 'L’Élection participe à la nature et au corps du Sauveur. Elle est comme une chambre nuptiale, en raison de son unité et de son union avec lui, car c’est avant tout pour elle que le Christ est venu. En revanche, l’Appel est destiné à ceux qui se réjouissent dans la chambre nuptiale, qui éprouvent joie et bonheur devant l’union de l’époux et de l’épouse. Ainsi, le lieu que recevra l’Appel est l’éon des images, où la Parole doit encore s’unir à la Plénitude. À cause de cela, l’Humain de l’Église était joyeux et heureux, et il espère en elle. Il se compose d’esprit, d’âme et de corps, conformément à celui qui a conçu le plan du salut.


    À l’intérieur de (l’Humain) se trouvait un humain qui était une unité, parce qu’il était la Totalité et qu’il était eux tous. Il possédait ce qui était issu du [Père], ce que [] les lieux pouvaient recevoir. Il possédait aussi les membres dont nous avons parlé auparavant. Lorsque la rédemption fut proclamée, l’Humain parfait acquit aussitôt la connaissance qui lui permettait de retourner rapidement à son unité, au lieu d’où il tirait son origine. Avec joie, il retourna au lieu d’où il tirait son origine, au lieu d’où il était sorti.


    Cependant, ses membres avaient besoin d’un lieu d’instruction, comme celui qui se trouve dans les lieux préparés pour leur fournir, tel un miroir, les images et les archétypes, jusqu’à ce que tous les membres du corps de l’Église <soient réunis> dans le même lieu et reçoivent en même temps la restauration, par la manifestation du corps tout entier, <…> la restauration dans la Plénitude.


    Elle possède une harmonie et une union premières, partagées par tous : l’harmonie qui appartient au Père, jusqu’à ce que les Totalités acquièrent un visage semblable au sien. Toutefois, la restauration finale <aura lieu> après que la Totalité aura été dévoilée en celui qui est le Fils, celui qui est la rédemption — c’est-à-dire le chemin vers le Père incompréhensible, autrement dit le retour à ce qui préexistait — et (après que) les Totalités se seront révélées, de la manière appropriée, en celui qui est le chemin vers l’insaisissable, l’indicible, l’[] invisible et l’incompréhensible, afin qu’elle obtienne la rédemption.


    Ce sera une libération, non seulement de la domination de ceux <de> la gauche, et non seulement une fuite hors du pouvoir de ceux de la droite, dont nous pensions être les esclaves et les fils, et auxquels personne n’échappe sans être bientôt repris par eux. La rédemption est aussi une ascension <vers> les degrés de la Plénitude et vers ceux qui ont reçu des noms et les ont saisis selon la capacité de chaque éon. Elle est également une entrée dans ce qui est silencieux, où il n’est besoin ni de voix, ni de connaissance, ni de conception, ni d’illumination, mais (où) toutes choses sont lumière et toutes rayonnent sans avoir besoin d’illumination.


    Les anges aussi bien que les humains ont besoin de rédemption, de même que l’image, les Plénitudes des éons et les puissances merveilleusement rayonnantes. Même le Fils, qui est le modèle de la rédemption de la Totalité, [avait besoin] lui aussi de rédemption, [] parce qu’il est devenu humain et s’est soumis à tout ce qui nous est nécessaire dans la chair, à nous qui sommes son Église. Lorsqu’il obtint alors le premier la rédemption par la Parole qui était descendue sur lui, tous les autres obtinrent de lui la rédemption en l’accueillant pour eux-mêmes. En effet, ceux qui reçurent celui qui avait (déjà) reçu reçurent naturellement ce qui était en lui.


    Parmi les humains de chair, la rédemption commença à [être] accordée lorsque son premier-né, son amour, le Fils de chair et les anges célestes furent jugés dignes de former avec lui une communion sur la terre. C’est pourquoi il est appelé « la rédemption angélique du Père » : il console ceux qui s’étaient affligés à cause de la connaissance de la Totalité, car il fut le premier à recevoir ce don, avant tous les autres.'
