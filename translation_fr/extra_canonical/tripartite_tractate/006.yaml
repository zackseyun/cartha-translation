base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: fr
  text: '<...> De même que les actes merveilleux des silences sont des générations éternelles et des rejetons de l’intelligence, de même les qualités de la Parole sont des émanations spirituelles. Puisqu’ils relèvent de la parole, [] les [actes merveilleux] comme les qualités sont les semences et les pensées de sa descendance, des racines vivantes et éternelles qui apparaissent comme des rejetons issus d’eux-mêmes. Ils existent comme intelligences et rejetons spirituels pour la gloire du Père.


    [Étant] esprits et intelligences, ils n’ont besoin ni de son ni de parole ; ils n’ont pas non plus besoin d’accomplir [un acte] pour obtenir ce qu’ils souhaitent [voir accompli]. Au contraire, selon le modèle de l’existence propre [du Père], [ceux] qui tirent de lui leur origine engendrent tout ce qu’ils veulent. Et il a un ou des enfant(s)[a] : celui auquel vont leurs pensées et leurs paroles, vers lequel ils se meuvent, en qui ils subsistent et auquel ils chantent des hymnes pour le glorifier. Car telle est leur puissance d’engendrement : elle ressemble à celle de ceux dont ils sont issus et s’accorde avec l’aide qu’ils se prêtent en commun, puisqu’ils s’entraident comme le font ceux qui n’ont pas été engendrés.


    Le Père, conformément à sa position élevée au-dessus des Totalités[b], est inconnu et insaisissable. Il possède une grandeur et une ampleur telles que, si elles se révélaient soudain, immédiatement, elles détruiraient tous les êtres élevés parmi les éons issus de lui. Il a donc contenu sa puissance et ses ressources infinies, qui constituent son être lacunaire[c], [demeurant] indicible et innommable, élevé au-dessus de toute intelligence et de toute parole.


    C’est pourtant lui qui s’est étendu, et ce qu’il a étendu a formé un fondement, un lieu et une demeure pour l’univers. L’un de ses noms est « Celui par qui »[d], parce qu’il est le Père de tous. Par son œuvre en faveur des êtres existants, il a semé en eux la pensée de le chercher. La richesse de leur [passage lacunaire][e], c’est qu’ils saisissent qu’il existe et qu’ils cherchent à connaître ce qui existait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit ou son édition laisse incertain le nombre du mot traduit par « enfant(s) » ; la suite emploie un référent singulier.
    reason: Préserver le signal éditorial child<ren> sans reproduire une notation anglaise opaque.
  - marker: b
    text: « Totalités » est ici un terme cosmologique désignant collectivement l’ensemble des réalités ou puissances éoniennes.
    reason: Éclairer un emploi technique sans l’assimiler à un système doctrinal particulier.
  - marker: c
    text: Le texte présente ici une lacune après « son » ; la formulation exacte qui qualifiait l’être du Père est perdue.
    reason: Rendre visible le crochet vide du témoin source et éviter l’expression française trompeuse « son [] être ».
  - marker: d
    text: 'Le titre « Celui par qui » traduit une désignation volontairement elliptique : celui par l’intermédiaire de qui quelque chose advient.'
    reason: Préserver l’étrangeté du nom tout en permettant au lecteur d’en comprendre la construction.
  - marker: e
    text: Une partie du texte est perdue à cet endroit ; le rapport exact entre « leur » et « richesse » demeure donc incertain.
    reason: Signaler l’ellipse manuscrite [. . .] qui empêche une restitution assurée.
lexical_decisions:
- source_word: Word
  choice: la Parole
  rationale: Rend le concept hypostasié de manière naturelle en français tout en conservant son lien avec la parole et le discours dans le contexte immédiat.
- source_word: minds / intellectual
  choice: intelligences / de l’intelligence
  rationale: « Intelligence » convient mieux que « esprit » ici, car le passage distingue les minds des spirits et les associe à l’activité intellective.
- source_word: emanations
  choice: émanations
  rationale: Terme technique transparent et traditionnel, qui conserve le mouvement de provenance sans l’interpréter comme une création.
- source_word: subsist
  choice: subsistent
  rationale: Conserve la portée ontologique du terme et la tension conceptuelle du passage.
- source_word: Totalities
  choice: Totalités
  rationale: La majuscule signale un terme cosmologique collectif plutôt qu’une simple totalité abstraite.
- source_word: aeons
  choice: éons
  rationale: Translittération française courante du terme cosmologique, sans le réduire à de simples périodes temporelles.
- source_word: unbegotten
  choice: ceux qui n’ont pas été engendrés
  rationale: Formulation claire qui préserve la distinction entre origine engendrée et non engendrée sans ajouter d’identité doctrinale.
- source_word: the One by Whom
  choice: Celui par qui
  rationale: Préserve la forme nominale inhabituelle et la fonction médiatrice exprimée par le titre.
theological_decisions:
- issue: Référent du singulier dans « the one of whom they think » après « child<ren> »
  choice: 'Conserver un référent singulier : « celui auquel… »'
  alternative: Mettre toute la série au pluriel ou identifier explicitement cet enfant à une figure nommée
  rationale: Le témoin oscille entre une forme éditorialement incertaine d’« enfant(s) » et une série de pronoms singuliers. La traduction maintient cette tension sans identifier le personnage.
- issue: Rapport entre le Père et les éons
  choice: Employer « issus de lui » et « tirent de lui leur origine »
  alternative: Employer uniformément « créés par lui » ou « engendrés par lui »
  rationale: Le passage varie ses formulations d’origine et d’engendrement. « Issus de lui » évite de trancher le mode précis de provenance.
- issue: Auto-origination des rejetons
  choice: « rejetons issus d’eux-mêmes »
  alternative: « êtres autoengendrés »
  rationale: La formulation conserve l’affirmation paradoxale du témoin sans imposer un vocabulaire doctrinal plus technique que la donnée disponible.
- issue: Transcendance et auto-extension du Père
  choice: Maintenir côte à côte son caractère inconnaissable et l’affirmation qu’il « s’est étendu »
  alternative: Interpréter l’extension comme l’action d’une hypostase distincte
  rationale: Le texte attribue les deux mouvements au même référent et ne résout pas explicitement leur tension.
- issue: « what was existent » final
  choice: « ce qui existait »
  alternative: « l’Existant » ou « ce qui est »
  rationale: Le témoin anglais ne permet pas de décider sûrement s’il s’agit d’une entité hypostasiée ou d’une réalité antérieure ; la formulation française reste ouverte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La traduction demeure provisoire, car la base fournie est un témoin anglais du copte dont la révision directe est encore attendue. Les répétitions conceptuelles, les passifs, les tensions ontologiques et les incertitudes textuelles ont été conservés autant que le permet un français naturel. Les lacunes sont signalées par des notes appelées dans le corps du texte.
