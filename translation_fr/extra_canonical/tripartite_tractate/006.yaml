  terminology: « Parole », « émanations », « intelligences », « éons », « Totalités » et « subsistent » sont appropriés dans ce contexte. « Rejetons intelligibles » rend plus directement « intellectual offspring » tout en maintenant la distinction avec les esprits. Le titre elliptique « Celui par qui » est maintenu.
