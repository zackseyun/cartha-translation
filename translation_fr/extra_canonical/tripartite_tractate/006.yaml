    rationale: Cette substitution introduit un libellé absent du témoin et modifie sa forme textuelle. Il convient de conserver le signe de lacune « [. . .] » et d’en expliquer la portée en note.
  - severity: low
    issue: « un ou des enfant(s) » est une restitution française peu naturelle de child<ren>.
    rationale: « un ou plusieurs enfants » conserve l’incertitude numérique éditoriale de manière lisible, tandis que la note explique que la suite reprend un singulier.
