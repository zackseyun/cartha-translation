base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: fr
  text: 'L’ensemble des éons éprouve de l’amour et un ardent désir de découvrir le Père parfaitement et pleinement ; c’est là leur unité sans entraves. Bien que le Père se révèle éternellement, il n’a pas voulu qu’ils le connaissent d’eux-mêmes. Il permet plutôt qu’on le saisisse en le cherchant, tout en se réservant son essence première, qui demeure insondable. Le Père a donné aux éons des désirs fondamentaux, car ceux-ci constituent des étapes sur le chemin qui mène à lui, comme une école où l’on apprend comment se conduire. Il leur a donné :


    la foi en lui et la prière adressée à celui qu’ils ne voient pas,


    une ferme espérance en celui qu’ils ne peuvent saisir,


    un amour fécond tourné vers ce qu’il ne voit pas,


    une compréhension digne de la pensée éternelle,


    la bénédiction de la richesse et de la liberté,


    et une intelligence qui aspire à glorifier le Père pour sa pensée.[a]


    [b] Par sa volonté, le Père exalté se fait connaître au moyen de l’Esprit qui souffle au sein des Totalités. Il leur inspire même l’idée de rechercher l’Inconnu, comme une odeur agréable pousse quelqu’un à en chercher la source, car le parfum du Père surpasse les parfums naturels. Sa douceur procure aux éons un plaisir indicible et fait naître en eux le désir de s’unir à lui, lui qui veut qu’ils le connaissent dans l’unité, ainsi que le désir de s’entraider dans l’Esprit qui a été implanté en eux. Bien qu’un grand poids pèse sur eux, ils sont renouvelés d’une manière indescriptible. En effet, ils ne peuvent être séparés de ce en quoi ils ont été placés d’une manière qui leur échappe. Ils ne parleront pas, mais garderont le silence au sujet de la gloire du Père, au sujet de celui qui peut parler ; pourtant, ils recevront de lui une forme.


    Bien qu’aucune parole ne puisse le décrire, il s’est révélé.[c] Ils le possèdent, caché au sein d’une pensée.[d] Voilà pourquoi les éons gardent le silence sur la manière dont le Père existe dans sa forme, son essence et sa grandeur.[e] Cependant, les éons sont jugés dignes de savoir, par son Esprit, qu’il ne peut être ni nommé ni compris. Par son esprit — la trace laissée par la recherche de lui —, il leur donne la capacité de le saisir et de parler de lui. Chaque éon est un nom, c’est-à-dire que chacun est une qualité et une puissance du Père,[f] car il existe sous de nombreux noms, mêlés les uns aux autres et en harmonie entre eux. On peut parler de lui grâce à la richesse du langage. De même, bien que le Père soit un seul nom en raison de son unité, il possède d’innombrables qualités et noms.'
