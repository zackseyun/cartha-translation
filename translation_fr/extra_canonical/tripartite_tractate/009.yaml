lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Conserve le terme technique de la cosmologie du traité plutôt que de le banaliser en « âges » ou « éternités ».
- source_word: whole system
  choice: l’ensemble
  rationale: Rendu français naturel qui préserve l’idée de totalité organisée sans imposer une technicité absente du témoin fourni.
- source_word: automatically
  choice: d’eux-mêmes
  rationale: Évite l’anachronisme stylistique de « automatiquement » tout en exprimant une connaissance immédiate, sans démarche de recherche.
- source_word: primal essence
  choice: essence première
  rationale: Maintient le vocabulaire ontologique et l’antériorité fondamentale sans préciser davantage une notion dont le copte reste à contrôler.
- source_word: Totalities
  choice: Totalités
  rationale: La majuscule et le pluriel signalent un terme cosmologique technique ; la formulation reste volontairement non interprétée.
- source_word: mixing with him
  choice: s’unir à lui
  rationale: Rend l’élan vers une participation commune dans un français lisible ; « se mêler à lui » demeure possible mais peut suggérer une confusion matérielle.
- source_word: form
  choice: forme
  rationale: Conserve le terme métaphysique ambigu sans le remplacer par « identité », « image » ou « existence ».
- source_word: name
  choice: nom
  rationale: Préserve le lien conceptuel explicite entre chaque éon, les qualités et les puissances du Père.
theological_decisions:
- issue: Révélation éternelle et connaissance non immédiate du Père
  choice: Le Père se révèle éternellement, mais veut être saisi dans une démarche de recherche.
  alternative: Le Père refuse que les éons le connaissent pleinement.
  rationale: Le passage maintient ensemble révélation et réserve de l’essence insondable ; la traduction ne transforme pas cette tension en refus absolu de connaissance.
- issue: Unité avec le Père
  choice: « s’unir à lui »
  alternative: « se mêler à lui » ou « se fondre en lui »
  rationale: « S’unir » exprime la participation recherchée sans décider que les distinctions ontologiques disparaissent.
- issue: Possession cachée du Père dans une pensée
  choice: « Ils le possèdent, caché au sein d’une pensée »
  alternative: « Ils ont une pensée cachée de lui »
  rationale: Le pronom objet fourni par la restauration du témoin est conservé, sans réinterpréter la relation entre le Père et la pensée.
- issue: Les éons comme noms, qualités et puissances du Père
  choice: Maintien de l’identification formulée par le passage.
  alternative: Les éons ne feraient que représenter les qualités du Père.
  rationale: Le texte dit que chaque éon « est » un nom, une qualité et une puissance ; « représente » affaiblirait cette affirmation métaphysique.
- issue: Possibilité de parler du Père malgré son caractère indicible
  choice: Conserver côte à côte l’impossibilité de le décrire et la capacité accordée d’en parler.
  alternative: Résoudre la tension en distinguant catégoriquement essence et manifestations.
  rationale: Le passage entretient cette tension sans fournir ici une systématisation explicite.
translation_notes:
  register: Français international actuel, digne et accessible, avec maintien des termes techniques « éons » et « Totalités ». Les phrases longues ont été modérément segmentées pour la lisibilité sans effacer le mouvement spéculatif du traité. Le projet reste provisoire puisque la révision directe du copte est annoncée comme non encore effectuée ; les lacunes et restaurations du témoin anglais sont donc signalées en notes.
