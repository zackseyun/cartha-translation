lexical_decisions:
- source_word: Church
  choice: Église
  rationale: Le terme désigne ici la réalité collective préexistante du traité; la majuscule conserve sa portée quasi technique et personnifiée.
- source_word: only son
  choice: fils unique
  rationale: Rend naturellement l’unicité filiale sans ajouter la notion plus précise d’« engendré unique », qui n’est pas explicitement garantie par le témoin fourni.
- source_word: unbegotten
  choice: inengendré
  rationale: Terme théologique français précis, distinct de « sans commencement », que le texte énonce séparément.
- source_word: offspring
  choice: descendants
  rationale: Conserve l’image de la provenance familiale tout en restant intelligible; « progéniture » paraîtrait plus biologique et moins digne.
- source_word: aeons
  choice: éons
  rationale: Translittération usuelle dans la littérature gnostique, préservant le caractère technique et l’ambiguïté entre entités et périodes cosmiques.
- source_word: reposes
  choice: repose
  rationale: Préserve la métaphore de la demeure ou du repos sans la résoudre en « habite » ou « s’appuie ».
theological_decisions:
- issue: Préexistence de l’Église
  choice: Affirmer que l’Église existait dès le commencement
  alternative: Paraphraser comme dessein éternel de l’Église
  rationale: Le passage attribue directement l’existence initiale à l’Église; une paraphrase en « dessein » imposerait une interprétation absente du témoin.
- issue: Le Fils dit « inengendré »
  choice: Conserver « inengendré et sans commencement »
  alternative: Harmoniser avec une christologie d’engendrement éternel
  rationale: La formulation difficile appartient à la tension théologique du traité et ne doit pas être corrigée selon une doctrine extérieure.
- issue: Le Père se conçoit comme Fils
  choice: Traduire littéralement cette identification paradoxale
  alternative: Reformuler comme connaissance du Fils par le Père
  rationale: La proposition du témoin est explicite mais énigmatique; la reformuler supprimerait sa tension métaphysique.
- issue: Origine des êtres « du Fils et du Père »
  choice: Conserver la double provenance
  alternative: Attribuer l’origine au Père par le Fils
  rationale: La syntaxe du témoin associe directement le Fils et le Père; une hiérarchie causale serait un ajout doctrinal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été légèrement fluidifiée sans atténuer les paradoxes du traité. Les crochets du témoin ont été répartis en appels de notes pour distinguer clairement lacunes et restitutions. Projet provisoire fondé sur le témoin anglais public fourni; une vérification directe du copte reste nécessaire.
