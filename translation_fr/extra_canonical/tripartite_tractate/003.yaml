translation:
  language: fr
  text: 'Ce n’est pas seulement le Fils qui existait dès le commencement : l’Église, elle aussi, existait dès le commencement. Si quelqu’un pense que le fait de reconnaître le Fils comme fils unique contredit cette affirmation, en raison du caractère énigmatique du sujet, il n’en est rien. De même que [a] le Père est une unité et ne s’est révélé comme Père qu’à lui-même, de même le Fils ne s’est trouvé frère que de lui-même, puisqu’il est inengendré et sans commencement. Le Père s’émerveille de lui-même [comme] Père, et il se donne [à lui-même gloire], honneur et [amour].[b] De plus, il se conçoit lui-même comme Fils, conformément aux attributs de ce qui est sans commencement et sans fin. C’est ainsi que la question est confirmée.


    Ses descendants innombrables et sans limites sont inséparables. Ceux qui existent sont issus du Fils et du Père, tels les baisers de personnes qui s’embrassent dans une pensée bonne et insatiable : l’étreinte est une, bien qu’elle comprenne de nombreux baisers. Cela signifie que l’Église se compose d’une multitude d’êtres qui existaient avant les éons, ensemble qui, à proprement parler, est appelé « les éons des éons ». Tel est le caractère des saints esprits impérissables, sur lesquels le Fils repose, car telle est sa nature, comme le Père qui, lui aussi, repose [c] sur le Fils.'
