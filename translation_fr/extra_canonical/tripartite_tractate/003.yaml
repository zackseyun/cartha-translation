    Sa progéniture innombrable et sans limite est inséparable. Ceux qui existent sont issus du Fils et du Père, tels les baisers de personnes qui se donnent des baisers, animées d’une pensée bonne et insatiable : l’étreinte est une, bien qu’elle comprenne de nombreux baisers. Cela signifie que l’Église se compose d’une multitude d’êtres qui existaient avant les éons, ensemble qui, à proprement parler, est appelé « les éons des éons ». Tel est le caractère des saints esprits impérissables, sur lesquels le Fils repose, car telle est sa nature, comme le Père qui, lui aussi, repose [c] sur le Fils.'
