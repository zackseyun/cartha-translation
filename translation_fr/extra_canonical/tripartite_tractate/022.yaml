translation:
  language: fr
  text: 'Lorsque les deux ordres, [ceux] de la droite et ceux de la gauche, sont unis l’un à l’autre par la pensée médiatrice qui se trouve entre eux et qui leur donne leur commun dessein de salut, ils agissent tous deux avec la même passion : ceux de la droite imitent ceux de la gauche, et ceux de la gauche imitent ceux de la droite. Parfois, quand l’ordre mauvais se met, par sottise, à faire le mal, l’ordre <sage> l’imite sous une forme masculine et fait lui aussi le mal, comme s’il était, lui aussi, une puissance du mal. À d’autres moments, quand l’ordre sage commence à accomplir de bonnes œuvres, l’ordre <insensé> essaie lui aussi de faire le bien en l’imitant.


    C’est ainsi que les choses sont établies par ces sortes [] d’actes et viennent à l’existence de telle manière que le semblable et le dissemblable se ressemblent. Ceux qui sont sans instruction ne peuvent donc pas connaître la cause de ce qui existe. Aussi ont-ils proposé diverses sortes d’explications. Les uns disent que ce qui existe tient son être de la providence : ce sont ceux qui voient de l’ordre et un agencement dans les mouvements de la création. D’autres disent que l’existence vient de quelque chose d’étranger : ce sont ceux qui voient la <diversité> et le mal provenant de l’absence de loi parmi les puissances. D’autres disent que ce qui existe se produit par le destin : ce sont ceux qui se sont préoccupés de cette question. D’autres disent que tout relève de la nature. D’autres encore, que tout relève du hasard. Mais la plupart de ceux qui ne sont parvenus qu’aux éléments visibles ne connaissent rien au-delà d’eux.


    Les sages grecs et les barbares ne sont parvenus que jusqu’aux puissances venues à l’existence par l’imagination et la pensée vaine, <ainsi qu’à> celles qui sont issues de ces puissances par le conflit et l’attitude rebelle à l’œuvre parmi elles. Par conséquent, lorsqu’ils parlaient des choses qu’ils tenaient pour sagesse, ils ont été trompés par un <simulacre>. Ils croyaient être parvenus à la vérité, [] alors qu’ils étaient parvenus à l’erreur. Cette erreur ne concernait pas seulement des désignations secondaires : les puissances elles-mêmes leur barraient la voie en les persuadant qu’ils avaient <compris> la Totalité.[a]


    Par conséquent, l’ordre en vint à se combattre lui-même, à cause de l’hostilité orgueilleuse d’[un descendant] de l’archonte qui est [supérieur] et qui existait avant lui.[b] Voilà pourquoi tous étaient en désaccord total sur tout : sur la philosophie, les différentes médecines, les catégories de la rhétorique, les genres de musique et les ordres de la logique. Tout n’était qu’opinions et théories. Ainsi, le <verbiage> l’emporta et <ils> furent plongés dans la confusion, parce qu’ils étaient incapables d’expliquer <ceux> qui détiennent le pouvoir et qui leur avaient donné leurs théories.


    Quant à ce qui apparut parmi le <peuple> des Hébreux, les écrits des êtres matériels, <dont> les Grecs suivent l’exemple, tout ce qu’ils conçurent pour l’exprimer, les puissances de la droite <…>, qui les incitèrent tous à raisonner <au moyen de> paroles et d’une représentation d’eux-mêmes.[c] Ils commencèrent ainsi leur marche vers la vérité, en faisant usage des diverses puissances mêlées qui agissaient en eux.


    Ensuite, ils atteignirent l’ordre des puissances sans mélange, <avant> d’atteindre celui qui est établi selon la ressemblance du Père. Il n’est pas invisible [] <en raison de sa> nature, mais parce qu’une sagesse le cache afin de préserver la forme de ce qui est véritablement invisible. C’est pourquoi beaucoup d’anges n’ont pas pu parvenir à le contempler. Les membres du peuple hébreu dont nous avons parlé plus haut, c’est-à-dire les justes et les prophètes, ne pensèrent ni ne dirent rien qui vienne de l’imagination, d’une image illusoire ou d’une pensée obscure. Au contraire, chacun, par la puissance qui agissait en lui, prêta attention à ce qu’il voyait et entendait, et parla avec exactitude, en harmonie avec les autres et en accord avec les puissances qui agissaient en eux, car ils conservaient leur <unité> et leur harmonie mutuelle. Il en était ainsi surtout parce qu’ils louaient celui qui était plus élevé qu’eux et plus grand qu’eux, celui qui existait et avait été établi parce
    qu’ils avaient besoin de lui.


    C’est ce que la Parole spirituelle produisit parmi eux, comme chez quelqu’un qui a besoin du Très-Haut : une espérance et une attente confiante, conformes à la pensée qui est la semence du salut, ainsi qu’une parole lumineuse qui est la mémoire, avec sa descendance et ses émanations — les justes et les prophètes dont nous avons parlé plus haut.[d] Ils conservent la louange de leurs pères et leur témoignage au sujet de ce qui est grand. Ceux-ci vinrent à l’existence [] dans l’espérance et l’attention; en eux fut semée <la> semence de la prière et de la recherche, celle qui est semée dans la multitude de ceux qui ont cherché à être fortifiés. Elle se manifeste et les pousse à aimer le Très-Haut et à proclamer que ces choses appartiennent à l’Unique.


    Quelque chose d’unique agissait en eux lorsqu’ils parlaient. Cependant, leurs visions et leurs paroles étaient diverses, en raison de la diversité de ceux qui leur communiquaient ces visions et ces paroles. C’est pourquoi ceux qui ont prêté attention à ce qu’ils ont dit n’en rejettent rien, mais ont reçu les Écritures en leur donnant diverses interprétations. Cela a conduit à la formation de différents groupes qui existent encore aujourd’hui parmi les Juifs. Les uns disent que Dieu est un, lui qui a parlé dans les anciennes Écritures. D’autres disent qu’il est multiple; certains disent pourtant que Dieu est simple et qu’il est, par nature, une intelligence unique. D’autres disent que ses actes se rapportent aux origines du bien et du mal. D’autres encore disent qu’il est lui-même le créateur de ce qui est venu à l’existence, tandis que d’autres disent que [] il a créé par l’intermédiaire des anges. La diversité de telles idées reflète la diversité des formes et la richesse des genres
    de l’Écriture, qui ont produit leurs maître<s> de la Loi.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Totalité » est ici un terme cosmologique technique. Le manuscrit présente une lacune avant « alors qu’ils étaient parvenus à l’erreur »; « compris » est une restauration éditoriale.
    reason: Signaler à la fois le sens spécialisé et l’état incertain du texte.
  - marker: b
    text: La formulation concernant le descendant, l’archonte « supérieur » et leur antériorité est textuellement et syntaxiquement incertaine; les crochets signalent des éléments endommagés ou suppléés.
    reason: Éviter de donner une fausse précision généalogique ou chronologique.
  - marker: c
    text: Cette phrase est fortement lacunaire et sa syntaxe demeure incertaine. Les chevrons indiquent des restitutions proposées et l’ellipse une perte de texte.
    reason: Avertir que la relation entre les écrits, les êtres matériels, les Grecs et les puissances de la droite ne peut être établie avec certitude.
  - marker: d
    text: 'La construction de cette longue phrase est ambiguë : les rapports entre la pensée, la semence du salut, la parole lumineuse, la mémoire, la descendance et les émanations ne sont pas entièrement assurés.'
    reason: Préserver l’ambiguïté du témoin plutôt que d’imposer une hiérarchie théologique.
  - marker: e
    text: La fin de « maître<s> » comporte une restitution éditoriale. L’expression peut viser les maîtres ou interprètes de la Loi issus de la diversité scripturaire.
    reason: Rendre visible l’incertitude textuelle et sémantique de la conclusion.
lexical_decisions:
- source_word: orders
  choice: ordres
  rationale: Conserve la terminologie cosmologique et la structure collective du témoin, sans la réduire à de simples groupes humains.
- source_word: powers
  choice: puissances
  rationale: Terme français traditionnel et suffisamment large pour désigner les entités ou forces cosmologiques du traité.
- source_word: shared plan of salvation
  choice: commun dessein de salut
  rationale: « Dessein » exprime un projet orienté sans imposer une formulation doctrinale plus précise que le témoin.
- source_word: passion
  choice: passion
  rationale: Maintient l’ambivalence entre impulsion, disposition et affect, au lieu de la résoudre par « désir » ou « souffrance ».
- source_word: providence
  choice: providence
  rationale: Équivalent philosophique et religieux direct.
- source_word: fate
  choice: destin
  rationale: Rend naturellement l’idée de détermination cosmique en français moderne.
- source_word: simulacrum
  choice: simulacre
  rationale: Préserve la nuance philosophique d’une apparence trompeuse ou d’une copie sans réalité pleine.
- source_word: Totality
  choice: Totalité
  rationale: La majuscule signale l’emploi technique cosmologique du terme.
- source_word: archon
  choice: archonte
  rationale: Translittération française usuelle dans les textes gnostiques, préférable à une interprétation comme « chef » ou « souverain ».
- source_word: spiritual Word
  choice: Parole spirituelle
  rationale: Conserve la personnification possible et l’ambiguïté de « Word » sans identifier explicitement cette figure au Logos chrétien.
- source_word: Exalted One
  choice: Très-Haut
  rationale: Expression française dignifiée et intelligible pour désigner celui qui est suprêmement élevé.
- source_word: One and Only
  choice: l’Unique
  rationale: Rend l’unicité absolue sans ajouter une définition ontologique étrangère au passage.
- source_word: self-representation
  choice: représentation d’eux-mêmes
  rationale: Garde le caractère réflexif de l’expression malgré l’incertitude syntaxique du passage lacunaire.
- source_word: teachers of the Law
  choice: maître<s> de la Loi
  rationale: Respecte la restauration éditoriale signalée dans le témoin tout en employant l’expression française naturelle.
theological_decisions:
- issue: Imitation réciproque du bien et du mal
  choice: Maintenir que l’ordre sage peut imiter le mal et l’ordre insensé imiter le bien
  alternative: Atténuer le passage en parlant seulement d’apparence ou de confusion
  rationale: Le texte affirme une symétrie troublante qui fonde l’incapacité des ignorants à discerner la cause des êtres; cette tension ne doit pas être harmonisée.
- issue: Statut du personnage établi selon la ressemblance du Père
  choice: Conserver « celui qui est établi selon la ressemblance du Père » sans l’identifier
  alternative: L’identifier au Dieu créateur, au Christ ou à une figure démiurgique précise
  rationale: Le témoin ne donne pas ici une identification univoque et la traduction ne doit pas importer un système doctrinal.
- issue: Invisibilité médiatisée par la sagesse
  choice: Dire qu’il est caché par une sagesse plutôt qu’invisible par nature
  alternative: Le décrire simplement comme intrinsèquement invisible
  rationale: La distinction paradoxale du passage est théologiquement significative et doit rester explicite.
- issue: Inspiration des justes et des prophètes
  choice: Conserver l’action de puissances diverses tout en affirmant leur exactitude et leur harmonie
  alternative: Uniformiser leur inspiration en une source unique explicitement divine
  rationale: Le texte juxtapose unité et diversité des médiateurs; la traduction préserve cette tension.
- issue: Diversité des conceptions juives de Dieu
  choice: Présenter sans correction les thèses de l’unité, de la multiplicité, de la simplicité et de la création angélique
  alternative: Privilégier une conception comme orthodoxe et qualifier les autres d’erreurs
  rationale: Le passage décrit une pluralité interprétative sans demander au traducteur de la trancher.
- issue: La Parole spirituelle
  choice: Employer « Parole spirituelle » sans identification christologique explicite
  alternative: Traduire par « Logos spirituel » ou « Christ »
  rationale: La personnification est conservée, mais une identification confessionnelle dépasserait les données immédiates du témoin.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La traduction suit une équivalence optimale : elle fluidifie les répétitions et la syntaxe lorsque le sens est raisonnablement clair, mais conserve les termes cosmologiques, les paradoxes et les ambiguïtés. Les crochets carrés, chevrons et ellipses du témoin sont maintenus comme signaux textuels. Le travail reste provisoire, car il repose sur le témoin anglais public fourni; une vérification directe du copte du Codex de Nag Hammadi I,5 demeure nécessaire.'
