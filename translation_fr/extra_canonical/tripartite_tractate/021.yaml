status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: Révision effectuée par rapport au témoin anglais public fourni; le contrôle direct du copte demeure en attente. Le projet suit globalement le témoin et préserve soigneusement crochets, lacunes, chevrons et parenthèses. Quelques formulations ont toutefois été corrigées afin d’éviter un renforcement interprétatif (« tenir pour certain »), une relation non attestée (« ombre tirée de la terre ») et des imprécisions syntaxiques.
  naturalness: Le français est soutenu et généralement naturel. Des ajustements ciblés rendent plus lisibles l’« ordonnancement », l’enchaînement des pronoms relatifs à la Parole, et certaines expressions cosmologiques volontairement techniques, sans combler les lacunes du témoin.
  terminology: Les choix « Parole », « Démiurge », « archontes », « Présomption », « éons », « psychiques » et « Totalité(s) » sont cohérents et adaptés au registre technique du traité. Les notes conservent une fonction explicative prudente et ne confondent pas les agents cosmologiques.
  issues:
  - severity: medium
    issue: Renforcement indu de « it is appropriate to hold »
    rationale: « Il convient donc de tenir pour certain » transforme une convenance ou conclusion appropriée en certitude explicite. « Il convient donc de considérer que » conserve mieux la modalité du témoin.
  - severity: medium
    issue: Ajout possible dans « une ombre tirée de la terre »
    rationale: Le témoin dit « a shadow of earth ». « Tirée de » suggère une provenance ou extraction qui n’est pas exprimée. « Une ombre de la terre » préserve l’image sans ajout.
  - severity: low
    issue: Formulation imprécise de l’ordonnancement
    rationale: « Toute la préparation qui a ordonné » fait de la préparation l’agent de l’ordonnance. Le témoin parle de « preparation of the ordering »; « Toute la préparation de l’ordonnancement » est plus exact.
  - severity: low
    issue: Accord et référence de la Parole dans le passage sur la forme
    rationale: Puisque « la Parole » est féminin en français, « elle » évite une discordance grammaticale. Le maintien de l’ambiguïté référentielle du témoin est assuré sans rendre la phrase fautive.
  revised_text: 'La matière, dont la forme est fluide, est une cause de l’aveuglement qui règne par l’intermédiaire des puissances […] en elles, tout cela […], tandis qu’ensemble elles engendrent et sont [détruites]. La pensée placée entre ceux de la [droite et] ceux de la gauche est une puissance d’[imitation]. Tous ceux que les premiers désirent façonner sont comme la projection d’une ombre qui suit un corps, ce qui <constitue> les racines des créatures visibles.


