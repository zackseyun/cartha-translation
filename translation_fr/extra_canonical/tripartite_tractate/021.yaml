translation:
  language: fr
  text: 'La matière, dont la forme est fluide, est une cause de l’aveuglement qui règne par l’intermédiaire des puissances […] en elles, tout cela […], tandis qu’ensemble elles engendrent et sont [détruites]. La pensée placée entre ceux de la [droite et] ceux de la gauche est une puissance d’[imitation]. Tous ceux que les premiers désirent façonner sont comme la projection d’une ombre qui suit un corps, ce qui <constitue> les racines des créatures visibles.


    Toute la préparation qui a ordonné les images, les représentations et les ressemblances est venue à l’existence à cause de ceux qui ont besoin d’une éducation, d’un enseignement et d’une formation procurés au moyen d’un miroir, afin que ce qui est petit puisse grandir peu à peu. Voilà pourquoi il créa l’humanité en dernier : il prépara et mit d’abord à sa disposition les choses qu’il avait créées pour elle.


    La création de l’humanité eut lieu comme celle de toutes les autres choses. D’une manière invisible, la Parole spirituelle les mit en mouvement et les mena à leur achèvement par l’intermédiaire du Démiurge[a] […] et de ses serviteurs angéliques, qui participèrent à l’œuvre de formation avec la Présomption et ses archontes[b]. Les humains ressemblent à une ombre tirée de la terre, de sorte qu’ils soient comme [ceux] qui sont séparés des Totalités[c]. Ils sont les créatures de tous : ceux de la droite et ceux de la gauche, chacun de ces ordres donnant une forme à l’[humain, tout comme] (la Totalité) elle-même avait été (formée).


    La [forme] produite par la Parole était déficiente, comme une [affliction] due à la faiblesse, car il la conduisit à l’[oubli], à l’ignorance, à la [déficience] et à toute autre faiblesse. En effet, la Parole ne lui donna que la première forme, <chose qu’elle lui donna> dans l’ignorance, par l’intermédiaire du Démiurge, afin qu’il en vienne à savoir qu’il existe quelque chose d’élevé et qu’il en a [besoin]. C’est ce que le prophète a appelé « l’Esprit vivant », « le souffle des éons élevés[d] » et « l’Invisible ». Et c’est là l’âme vivante qui donna la vie au corps, jusque-là sans vie ; or, ce qui est sans vie, c’est l’ignorance.


    Il convient donc de tenir pour certain que l’âme du premier humain provenait de la Parole spirituelle, tandis que le Créateur pensait l’avoir faite. Ce qui fut insufflé passa par lui comme par une bouche.


    De sa propre substance, le Créateur fit aussi descendre des âmes, car [il] possède lui aussi la puissance de procréer, […] <ayant été> produit à partir de la représentation du Père. Ceux de la gauche produisirent également une certaine sorte d’humain qui leur était propre, car eux aussi possèdent la ressemblance de <l’être>.


    La substance spirituelle est une réalité une et une représentation unique, [mais] sa faiblesse est un état qui revêt [de nombreuses] formes. Quant à la substance des êtres psychiques[e], son état est double : elle possède la connaissance et loue l’Élevé, mais elle est <aussi> inclinée au mal en raison de la tendance de la Présomption. Quant à la substance des êtres matériels, son mode d’existence varie et revêt même plusieurs formes ; c’était une faiblesse qui l’emportait sous plusieurs sortes d’inclinations.


    Ainsi, le premier être humain est une formation diverse, une création diverse, un réceptacle pour ceux de la gauche et ceux de la droite, et une Parole spirituelle dont les intérêts se partagent entre chacune des deux substances dont il tient son existence.


    Voilà pourquoi il est dit qu’un paradis fut planté pour lui, afin qu’il puisse manger la nourriture de trois sortes d’arbres : car c’est un jardin composé de trois ordres, et il procure du plaisir. La substance noble et choisie qui était en lui dépassait <la> création, et elle <leur causait> du tort. Ils donnèrent donc un commandement en le menaçant d’un grave danger, […] à savoir la mort. Il ne lui était permis de goûter et d’apprécier que les mauvais arbres ; quant à l’autre arbre, celui de la dualité, il ne lui permit pas d’[en] manger, et encore moins de l’arbre de vie. C’était pour l’empêcher d’obtenir un honneur [égal au] leur et pour l’empêcher [de…] eux.


    Par la puissance mauvaise appelée « le serpent », celui-là même qui est plus rusé que toutes les puissances mauvaises, l’humain <fut> égaré selon le dessein de ceux qui relèvent de la mémoire et des désirs. Elle l’amena à désobéir au commandement, afin qu’il meure. Et il fut chassé de ce lieu et de tous ses plaisirs.


    Telle est l’expulsion par laquelle ils le punirent : il fut chassé des plaisirs de ceux qui relèvent de la ressemblance et de ceux qui relèvent de la représentation. Mais c’était en réalité un acte de providence, destiné à faire comprendre aux humains que les jouissances ne durent que peu de temps, contrairement au lieu éternel du repos. L’Esprit avait ordonné cet acte lorsqu’il avait prévu que l’humain ferait l’expérience du grand mal, à savoir la mort — l’ignorance complète de la Totalité —, et qu’il goûterait aussi tous les maux qui en découlent ; puis, après les passions, les angoisses et ce qui en résulte, il obtiendrait le plus grand […] bien, à savoir la vie éternelle — la connaissance complète des Totalités et l’obtention de tout bien.


    À cause de la désobéissance du premier humain, la mort régna. Elle avait coutume de tuer tout humain aussi longtemps qu’elle détenait [la domination] et l’emportait, domination qu’elle avait reçue [comme] royaume en raison du dessein de salut mentionné plus haut, conformément à la volonté du Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Démiurge » est ici l’agent créateur intermédiaire par lequel la Parole spirituelle accomplit son œuvre.
    reason: Clarifier un terme technique sans l’assimiler automatiquement au Dieu suprême.
  - marker: b
    text: Les « archontes » sont des puissances dirigeantes appartenant à l’ordre cosmique décrit par le traité.
    reason: Le terme translittéré peut être inconnu du lectorat général.
  - marker: c
    text: « Les Totalités » et « la Totalité » sont des termes techniques du traité pour la réalité plénière d’en haut ; le témoin alterne le pluriel et le singulier.
    reason: Préserver et expliquer une terminologie cosmologique ambiguë.
  - marker: d
    text: Les « éons » sont ici des réalités ou ordres du monde transcendant, et non de simples périodes chronologiques.
    reason: Éviter le sens français ordinaire de durée extrêmement longue.
  - marker: e
    text: « Psychiques » désigne ici une catégorie intermédiaire entre les êtres spirituels et les êtres matériels.
    reason: Expliquer une catégorie anthropologique technique sans la paraphraser dans le texte.
lexical_decisions:
- source_word: Demiurge
  choice: Démiurge
  rationale: Terme technique du traité, conservé plutôt que remplacé par « Créateur », puisque le passage emploie aussi « le Créateur » et semble maintenir une distinction lexicale.
- source_word: archons
  choice: archontes
  rationale: Translittération française courante qui préserve la fonction cosmologique spécifique de ces puissances dirigeantes.
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: Les majuscules et l’alternance singulier-pluriel sont conservées comme vocabulaire technique, sans réduire le terme à « univers » ou « plénitude ».
- source_word: soulish ones
  choice: êtres psychiques
  rationale: « Psychiques » conserve la catégorie anthropologique intermédiaire entre spirituel et matériel ; « animiques » serait moins naturel et « dotés d’une âme » risquerait d’effacer son statut technique.
- source_word: Word
  choice: Parole
  rationale: Rendu dignifié et traditionnel de Logos, tout en évitant d’imposer explicitement une identification christologique que l’extrait ne formule pas ici.
- source_word: presumption
  choice: Présomption
  rationale: La majuscule signale qu’il s’agit vraisemblablement d’une puissance ou entité personnifiée dans la cosmologie du traité.
- source_word: aeons
  choice: éons
  rationale: Terme technique conservé en translittération, plutôt que traduit par « siècles », qui serait trompeur dans ce contexte.
theological_decisions:
- issue: Origine de l’âme du premier humain
  choice: Affirmer qu’elle « provenait de la Parole spirituelle », tandis que le Créateur pensait l’avoir faite
  alternative: Harmoniser la Parole et le Créateur en un seul agent
  rationale: Le contraste théologique explicite du témoin est maintenu sans harmonisation.
- issue: Fonction de l’expulsion et de la mort
  choice: Conserver ensemble la punition par les puissances et l’acte providentiel ordonné par l’Esprit
  alternative: Présenter l’expulsion soit uniquement comme châtiment, soit uniquement comme bienfait
  rationale: Le texte porte une tension intentionnelle entre causalité hostile et providence salvatrice.
- issue: Les trois substances humaines
  choice: Maintenir les catégories spirituelle, psychique et matérielle
  alternative: Les reformuler selon une anthropologie chrétienne ultérieure plus familière
  rationale: La structure tripartite propre au traité doit demeurer visible sans ajout confessionnel.
- issue: Le serpent
  choice: Conserver son identification comme puissance mauvaise qui conduit à la désobéissance et à la mort
  alternative: Le présenter comme libérateur ou révélateur
  rationale: Cette section du traité qualifie explicitement le serpent de puissance mauvaise ; une autre lecture importerait une interprétation extérieure.
- issue: Le Créateur et le Démiurge
  choice: Préserver les deux désignations telles qu’elles apparaissent
  alternative: Uniformiser toutes les occurrences sous « Dieu »
  rationale: Une uniformisation effacerait les distinctions cosmologiques et pourrait importer une théologie absente du passage.
translation_notes:
  register: Français international moderne, soutenu mais lisible. Traduction provisoire fondée sur le témoin anglais public fourni, la révision directe du copte restant à effectuer. Les crochets, ellipses entre crochets, parenthèses et chevrons reproduisent les signaux textuels et éditoriaux du témoin ; les segments très lacunaires demeurent volontairement abrupts. Les pronoms ambigus et les tensions cosmologiques n’ont pas été normalisés silencieusement.
