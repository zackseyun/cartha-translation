    La création de l’humanité eut lieu comme celle de toutes les autres choses. D’une manière invisible, la Parole spirituelle les mit en mouvement et les mena à leur achèvement par l’intermédiaire du Démiurge[a] […] et de ses serviteurs angéliques, qui participèrent à l’œuvre de formation avec la Présomption et ses archontes[b]. Les humains ressemblent à une ombre de la terre, afin qu’ils soient comme [ceux] qui sont séparés des Totalités[c]. Ils sont les créatures de tous : ceux de la droite et ceux de la gauche, chacun de ces ordres donnant une forme à l’[humain, tout comme] (la Totalité) elle-même avait été (formée).


    La [forme] produite par la Parole était déficiente, comme une [affliction] due à la faiblesse, car elle la conduisit à l’[oubli], à l’ignorance, à la [déficience] et à toute autre faiblesse. En effet, la Parole ne lui donna que la première forme, <chose qu’elle lui donna> dans l’ignorance, par l’intermédiaire du Démiurge, afin qu’il en vienne à savoir qu’il existe quelque chose d’élevé et qu’il en a [besoin]. C’est ce que le prophète a appelé « l’Esprit vivant », « le souffle des éons élevés[d] » et « l’Invisible ». Et c’est là l’âme vivante qui donna la vie au corps, jusque-là sans vie ; or, ce qui est sans vie, c’est l’ignorance.


    Il convient donc de considérer que l’âme du premier humain provenait de la Parole spirituelle, tandis que le Créateur pensait l’avoir faite. Ce qui fut insufflé passa par lui comme par une bouche.


    De sa propre substance, le Créateur fit aussi descendre des âmes, car [il] possède lui aussi la puissance de procréer, […] <ayant été> produit à partir de la représentation du Père. Ceux de la gauche produisirent également une certaine sorte d’humain qui leur était propre, car eux aussi possèdent la ressemblance de <l’être>.


    La substance spirituelle est une réalité une et une représentation unique, [et] sa faiblesse est un état qui revêt [de nombreuses] formes. Quant à la substance des êtres psychiques[e], son état est double : elle possède la connaissance et loue l’Élevé, mais elle est <aussi> inclinée au mal en raison de la tendance de la Présomption. Quant à la substance des êtres matériels, son mode d’existence varie et revêt même plusieurs formes ; c’était une faiblesse qui l’emportait sous plusieurs sortes d’inclinations.


    Ainsi, le premier être humain est une formation diverse, une création diverse, un réceptacle pour ceux de la gauche et ceux de la droite, et une Parole spirituelle dont les intérêts se partagent entre chacune des deux substances dont il tient son existence.


    Voilà pourquoi il est dit qu’un paradis fut planté pour lui, afin qu’il puisse manger la nourriture de trois sortes d’arbres : car c’est un jardin composé de trois ordres, et il procure du plaisir. La substance noble et choisie qui était en lui était plus élevée que <la> création, et elle <leur causait> du tort. Ils donnèrent donc un commandement en le menaçant d’un grave danger, […] à savoir la mort. Il ne lui était permis de goûter et d’apprécier que les mauvais arbres ; quant à l’autre arbre, celui de la dualité, il ne lui permit pas d’[en] manger, et encore moins de l’arbre de vie. C’était pour l’empêcher d’obtenir un honneur [égal au] leur et pour l’empêcher [de…] eux.


    Par la puissance mauvaise appelée « le serpent », celui-là même qui est plus rusé que toutes les puissances mauvaises, l’humain <fut> égaré selon le dessein de ceux qui relèvent de la mémoire et des désirs. Elle l’amena à désobéir au commandement, afin qu’il meure. Et il fut chassé de ce lieu et de tous ses plaisirs.


    Telle est l’expulsion par laquelle ils le punirent : il fut chassé des plaisirs de ceux qui relèvent de la ressemblance et de ceux qui relèvent de la représentation. Mais c’était en réalité un acte de providence, destiné à faire comprendre aux humains que les jouissances ne durent que peu de temps, contrairement au lieu éternel du repos. L’Esprit avait ordonné cet acte lorsqu’il avait prévu que l’humain ferait l’expérience du grand mal, à savoir la mort — l’ignorance complète de la Totalité —, et qu’il goûterait aussi tous les maux qui en découlent ; puis, après les passions, les angoisses et ce qui en résulte, il obtiendrait le plus grand […] bien, à savoir la vie éternelle — la connaissance complète des Totalités et l’obtention de toute chose bonne.


