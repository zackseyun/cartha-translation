translation:
  language: fr
  text: 'Il ne révéla pas d’un seul coup aux Totalités[b] la diversité des qualités, et il ne révéla pas non plus son égalité avec lui-même à ceux qui étaient issus de lui. Tous ceux qui étaient issus de lui, ‹qui› sont les éons des éons[a], [lacune], puisqu’ils [sont] les émanations et les rejetons de ‹sa› nature génératrice, ‹engendrent› eux aussi, selon leur propre nature génératrice, pour la gloire du Père, car c’est lui qui, en tant que cause, les a établis. Comme nous l’avons dit plus haut, il crée les éons comme des racines, des sources et des pères. C’est lui qu’ils glorifient, parce qu’il possède la connaissance et la sagesse, et parce que les Totalités ont reconnu qu’elles étaient issues de la connaissance et de la sagesse de la Totalité.


    Si ceux de la Totalité avaient rendu gloire selon les ‹capacités› propres à chaque éon, ce qu’ils auraient produit n’aurait été qu’un faible reflet du Père, qui est la Totalité. C’est pourquoi, dans le chant de gloire et par la puissance de son unité, dont ils étaient issus, ils furent amenés à se mêler, à se fondre et à s’unir les uns aux autres. Depuis l’assemblée de la Plénitude, ils offrirent au Père une glorification digne de lui : une image une et multiple, puisqu’elle avait été produite pour la gloire de l’Unique et puisqu’ils s’étaient approchés de celui qui est lui-même les Totalités.


    C’était une louange [des éons] adressée à celui qui avait produit les Totalités comme prémices des immortels et comme réalité éternelle. En effet, puisqu’ils étaient sortis des éons vivants, parfaits et pleins grâce à celui qui est parfait et plein, l’état plein et parfait de ceux qui glorifiaient de manière parfaite demeura intact grâce à la communion. Il en va de même du Père parfait : quand il est glorifié, il entend aussi la glorification qui [le] glorifie, afin de manifester qu’eux aussi sont ce qu’il est.


    La raison du second honneur qui leur fut accordé réside dans ce qui leur revint du Père lorsqu’ils reconnurent le don qui leur permettait de porter du fruit les uns parmi les autres pour le Père. Ainsi, de même qu’ils ‹furent› glorieusement engendrés pour le Père, de même ils apparurent parfaits dans l’acte de glorifier.


    Ils furent les pères de la troisième glorification, conforme à la liberté et à la puissance qui avaient été engendrées avec eux et qui leur donnaient la capacité de glorifier ensemble et de glorifier individuellement, selon leur volonté. Il y eut la première et la deuxième glorification, toutes deux parfaites et pleines, puisqu’elles sont les manifestations du Père parfait et plein et des réalités parfaites issues de la glorification de celui qui est parfait. Mais le fruit de la troisième glorification comprend la volonté de chacun des éons ainsi que chacune des qualités et des puissances du Père. Ce fruit est complet et parfait dans la mesure où la gloire que les éons désirent et peuvent rendre au Père résulte à la fois de leur accord et de chacun pris individuellement. C’est cela qu’il aime et sur quoi il exerce sa puissance, car c’est ainsi que le Père est glorifié. Voilà pourquoi ils sont des intelligences d’intelligences, qui se révèlent être des paroles de paroles, des anciens
    d’anciens et des degrés de degrés, élevés les uns au-dessus des autres.


    Chacun de ceux qui rendent gloire possède sa place, son élévation, sa demeure et son repos, qui consistent dans la gloire qu’il offre. Tous ceux qui glorifient le Père connaissent un engendrement éternel : ils engendrent en s’aidant mutuellement, parce que les émanations sont infinies et sans mesure et parce qu’il n’existe chez le Père aucune trace de jalousie envers ceux qui sont issus de lui lorsqu’ils engendrent quelque chose qui lui est égal ou semblable. En effet, il existe dans les Totalités, engendrant et se révélant lui-même. Il fait de celui qu’il veut un père, lui dont il est véritablement le Père ; il fait de celui qu’il veut un dieu, lui dont il est véritablement le Dieu ; et il fait d’eux les Totalités, ‹pour lesquelles› il est la Totalité. [Lacune.] À proprement parler, tous les grands noms sont réservés là-haut, ces noms que partagent les anges venus à l’existence dans le monde avec les archontes, bien qu’ils n’aient aucune ressemblance avec les êtres éternels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « éon » est ici une réalité éternelle issue du Père, et non seulement une période de temps.
    reason: Éclaire un terme cosmologique indispensable sans le remplacer par une paraphrase réductrice.
  - marker: b
    text: Le texte emploie alternativement « les Totalités » pour la multiplicité des réalités issues du Père et « la Totalité » pour l’unité englobante ; il applique aussi ces expressions au Père selon des formulations volontairement denses.
    reason: Aide le lecteur à suivre une distinction lexicale et théologique récurrente sans en éliminer la tension.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Conserve le terme technique consacré pour les réalités éternelles de cette cosmologie, sans le réduire au simple sens temporel d’« âges ».
- source_word: Totalities / Totality
  choice: Totalités / Totalité
  rationale: Maintient la distinction formelle entre le pluriel collectif et le singulier englobant du témoin, distinction structurante et parfois volontairement tendue.
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le terme cosmologique par son équivalent français traditionnel et intelligible, avec une majuscule signalant son emploi quasi propre.
- source_word: procreative nature / procreate
  choice: nature génératrice / engendrer
  rationale: « Génératrice » exprime la capacité féconde, tandis qu’« engendrer » garde le vocabulaire de filiation employé dans le passage.
- source_word: minds of minds
  choice: intelligences d’intelligences
  rationale: Préserve la construction superlative et hiérarchique sans imposer le terme philosophique plus spécialisé « intellects ».
- source_word: archons
  choice: archontes
  rationale: Conserve le terme technique usuel de la littérature gnostique plutôt que de l’interpréter comme de simples « dirigeants ».
theological_decisions:
- issue: Rapport entre le Père et les éons
  choice: Conserver les affirmations selon lesquelles ils peuvent engendrer quelque chose d’égal ou de semblable au Père et « sont ce qu’il est ».
  alternative: Atténuer ces formulations en parlant seulement de ressemblance ou de participation.
  rationale: Le témoin formule délibérément une forte proximité ontologique tout en maintenant le Père comme cause et Totalité ; la traduction ne doit pas résoudre cette tension.
- issue: Référent de « prémices des immortels » et de « réalité éternelle »
  choice: Maintenir ces expressions près de « les Totalités », conformément à l’ordre syntaxique du témoin.
  alternative: Les rattacher explicitement à celui qui produit les Totalités.
  rationale: La syntaxe transmise reste difficile ; une reformulation doctrinalement explicite supprimerait une ambiguïté réelle.
- issue: Trois glorifications
  choice: Préserver la première, la deuxième et la troisième comme catégories distinctes sans en proposer une identification doctrinale.
  alternative: Les interpréter comme étapes fixes d’une procession ou comme personnes déterminées.
  rationale: Le passage décrit leur origine et leur fruit, mais ne justifie pas une systématisation confessionnelle supplémentaire.
- issue: Emploi de « dieu » pour les êtres issus du Père
  choice: Traduire directement « il fait de celui qu’il veut un dieu ».
  alternative: Employer « être divin » pour atténuer la formulation.
  rationale: La formulation forte appartient au texte et est aussitôt qualifiée par la relation au Père comme leur Dieu ; elle doit être conservée.
translation_notes:
  register: Français international moderne, soutenu mais lisible. Les répétitions structurantes (« parfait et plein », « glorifier », « engendrer ») sont maintenues. Les ajouts conjecturaux du témoin sont signalés par ‹ ›, les restitutions par [ ], et les lacunes par [lacune]. Comme le dossier indique qu’une vérification directe du copte reste à faire, ce projet demeure explicitement fondé sur le témoin anglais public fourni et évite de prétendre résoudre ses difficultés textuelles.
