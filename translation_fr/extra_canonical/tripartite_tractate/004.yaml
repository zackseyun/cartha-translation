  - marker: a
    text: Ici, les « éons » sont des réalités éternelles ou des émanations du monde divin ; le terme technique est conservé.
    reason: Aide le lecteur moderne sans remplacer un terme cosmologique central par une interprétation réductrice.
lexical_decisions:
- source_word: Church
  choice: Église
  rationale: Conserve le terme ecclésiologique traditionnel tout en maintenant sa fonction cosmologique particulière dans ce traité.
- source_word: aeons
  choice: éons
  rationale: Maintient le terme technique propre à la cosmologie du texte plutôt que de le réduire à « siècles » ou « éternités ».
- source_word: births / generations
  choice: générations
  rationale: Rend le processus d’engendrement et de déploiement des éons sans imposer une formulation biologique partout.
- source_word: mind
  choice: intellect
  rationale: « Intellect » convient mieux au registre métaphysique que « esprit », qui pourrait être confondu avec une réalité pneumatique.
- source_word: depth
  choice: profondeur
  rationale: Préserve l’image spatiale et métaphysique sans transformer automatiquement le mot en nom propre.
- source_word: spermatic form
  choice: sous forme de semence
  rationale: Expression française naturelle qui conserve la métaphore germinale sans lourdeur inutile.
- source_word: cognitive entity
  choice: êtres capables de connaître
  rationale: Formulation intelligible en français moderne qui exprime la capacité cognitive sans jargon abstrait excessif.
- source_word: He Who Is
  choice: Celui qui est
  rationale: Conserve la formulation ontologique et son possible écho scripturaire sans l’expliciter davantage.
theological_decisions:
- issue: Relation entre l’Église, les éons et le Fils
  choice: Conserver les formulations d’union et d’engendrement sans les harmoniser avec une ecclésiologie ultérieure.
  alternative: Interpréter l’Église comme la communauté terrestre ou identifier explicitement les éons à des êtres angéliques.
  rationale: Le passage emploie ces termes dans une cosmologie propre au traité ; toute identification confessionnelle plus précise dépasserait le témoignage fourni.
- issue: Référent de « he » dans « he being the perfection of that place »
  choice: Rendre littéralement « lui qui est la perfection de ce lieu », en conservant l’ambiguïté du référent.
  alternative: Identifier explicitement ce référent à l’intellect, au Fils ou au Père.
  rationale: Le témoin anglais et le contexte transmis ne permettent pas de trancher sûrement.
- issue: Nature de la connaissance accordée par le Père
  choice: Conserver « connaître ce qui est, c’est-à-dire celui qui se connaît lui-même éternellement ».
  alternative: Paraphraser en « connaître Dieu » ou en connaissance de soi des éons.
  rationale: La syntaxe entretient une tension entre l’être, le Père et la connaissance de soi ; il ne faut pas la résoudre doctrinalement.
- issue: Nom du Père
  choice: Préserver l’idée que le nom est accordé et « leur appartient » sans explication supplémentaire.
  alternative: Expliquer le nom comme participation ontologique ou adoption filiale.
  rationale: Ces lectures sont possibles mais ne doivent pas être ajoutées au texte.
