translation:
  language: fr
  text: '[. . .] l’Église existe dans les qualités et les attributs dans lesquels existent le Père et le Fils, comme je l’ai dit dès le commencement. Elle subsiste donc dans les générations d’innombrables éons[a]. Par les qualités et les attributs dans lesquels [l’Église existe], [les éons] engendrent eux aussi d’une manière qui dépasse tout dénombrement. En effet, ces [éons constituent] l’union de [l’Église], qu’ils [forment] les uns avec les autres, [avec ceux] qui sont issus [d’eux, et] avec le Fils, pour la gloire duquel ils existent.


    Il est donc impossible que l’intellect les conçoive, lui qui est la perfection de ce lieu. La parole ne peut pas non plus les décrire, car ils sont indicibles, innommables et insaisissables. Eux seuls peuvent se nommer et se concevoir eux-mêmes, parce qu’ils ne sont pas enracinés dans ces lieux-ci. Ceux qui sont en ce lieu-là sont indicibles et innombrables dans l’ordre [qui est] à la fois [le mode] et la mesure : l’allégresse, la joie de celui qui est inengendré, sans nom, innommable, insaisissable, invisible et inconcevable. Telle est la plénitude de la paternité, de sorte que ses richesses sont une génération.


    [] [. . .] des éons demeuraient éternellement dans la pensée, car le Père était pour eux comme une pensée et un lieu. Une fois leurs générations établies, celui qui exerce la maîtrise sur tout voulut saisir et faire paraître ce qui était incomplet dans le [. . .], et il fit paraître ceux qui [étaient en] lui. Cependant, parce qu’il est [tel] qu’il est, [il est] une source que ne diminue pas l’eau qui en coule en abondance.


    Tandis qu’ils demeuraient dans la pensée du Père, c’est-à-dire dans la profondeur cachée, la profondeur les connaissait, mais eux ne pouvaient connaître la profondeur dans laquelle ils demeuraient. Il leur était également impossible de se connaître eux-mêmes ou de connaître quoi que ce soit d’autre. Autrement dit, ils demeuraient avec le Père, mais leur existence n’était pas encore pour eux-mêmes. Ils n’existaient que comme une semence ; ainsi, il apparut qu’ils existaient à la manière d’un fœtus. Il les engendra comme par une parole : ils subsistaient sous forme de semence, tandis que ceux qu’il allait engendrer n’avaient pas encore reçu de lui leur existence.


    [] Le Père fut le premier à les penser. Il sema une pensée comme une semence, non seulement afin qu’ils existent pour lui, mais aussi afin qu’ils existent pour eux-mêmes, qu’ils puissent alors exister dans sa pensée comme des êtres capables de connaître, et qu’ils existent aussi pour eux-mêmes. Pour qu’ils puissent connaître ce qui existe pour eux, il leur [accorda] généreusement la forme première ; et pour [qu’ils puissent] connaître [qui est le Père], celui qui existe pour eux, il leur accorda le nom de Père, par une voix qui leur déclarait que tout ce qui existe existe par ce nom, lequel leur appartient. En effet, ils parvinrent à l’être grâce à l’élévation qui demeure dans le nom, une élévation qu’ils ne reconnurent pas. Tant qu’il est fœtus, l’enfant possède ce qui lui suffit, sans voir encore celui qui l’a semé. Leur seule tâche était donc de le chercher, en reconnaissant qu’il existe et en désirant sans cesse découvrir ce qui existe.


    Cependant, parce que le Père parfait est bon, de même qu’il ne se <ferma> pas à eux pour les faire exister éternellement dans sa pensée, mais leur accorda aussi de parvenir à l’existence pour eux-mêmes, de même il leur fit le don de connaître ce qui est, c’est-à-dire celui qui se connaît lui-même éternellement. [] [. . .] recevoir une forme [afin de savoir] que Celui qui est existe, comme les personnes qui, lorsqu’elles naissent en ce lieu-ci, entrent dans la lumière afin de voir ceux qui les ont engendrées.


    [a] Ici, les « éons » sont des réalités éternelles ou des émanations du monde divin ; le terme technique est conservé.'
