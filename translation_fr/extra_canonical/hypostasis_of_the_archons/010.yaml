translation:
  language: fr
  text: 'Je dis : « Mon Seigneur, instruis-moi au sujet de la [puissance de] ces autorités. [Comment] sont-elles venues à l’existence ? De quelle sorte de substance et de quelle [] matière sont-elles issues ? Qui les a créées, elles et leur puissance ? »[a]


    Le grand ange Éléleth, qui est Sagesse, me dit : « L’Indestructibilité demeure au sein d’éons infinis. Sophia, appelée Pistis, désira créer quelque chose par elle-même, indépendamment de son compagnon, et ce qu’elle produisit eut son origine dans le monde d’en haut.


    « Il y a un voile entre le monde supérieur et les éons d’en bas. Une ombre vint à l’existence sous le voile ; l’ombre devint matière et tomba dans un lieu à part.


    « Ce qu’elle avait produit se développa en une chose matérielle semblable à un fœtus avorté. Sa forme fut façonnée à partir de l’ombre, et elle devint une bête arrogante semblable à un lion. Elle était androgyne, comme je l’ai déjà dit, parce qu’elle avait eu son origine dans la matière.


    « Il ouvrit les yeux et contempla une immense quantité de matière, sans limites. Il s’enorgueillit et dit : “Je suis Dieu, et rien n’existe en dehors de moi.”


    « En disant cela, il avait péché contre le Tout. Une voix se fit entendre d’au-dessus du lieu du pouvoir suprême et dit : “Tu es dans l’erreur, Samaël” — ce qui signifie “dieu aveugle”.


    « Il dit : “S’il existe quelque chose d’autre avant moi, montre-le-moi.”


    « Aussitôt, Sophia étendit son doigt et introduisit la lumière dans la matière. Elle la poursuivit vers le bas jusqu’au lieu du chaos, puis elle remonta vers sa lumière, tandis que les ténèbres [retombaient] sur la matière.[b]


    « Cet archonte, qui était androgyne, se fit un vaste royaume, une étendue sans limites.


    « [] Il conçut le projet de se créer une descendance. Il se créa sept descendants, androgynes comme leur parent.


    « Il dit à ses descendants : “Je suis le Dieu du Tout.”


    « Zoé, la fille de Pistis Sophia, lui cria : “Tu es dans l’erreur, Sakla”, dont l’autre nom est “Yaldabaoth”. Zoé souffla sur son visage ; son souffle devint pour elle un ange de feu. Cet ange lia Yaldabaoth et le précipita dans le Tartare, sous l’abîme. »'
