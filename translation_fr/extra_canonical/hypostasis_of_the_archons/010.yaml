lexical_decisions:
- source_word: authorities / archon
  choice: autorités / archonte
  rationale: « Autorités » traduit le terme collectif initial dans une langue courante, tandis qu’« archonte » conserve le titre technique lorsqu’un dirigeant cosmique particulier est désigné.
- source_word: Indestructibility
  choice: l’Indestructibilité
  rationale: La majuscule et la substantivation préservent le caractère hypostasié du concept sans l’assimiler à une personne ou doctrine déterminée.
- source_word: aeons
  choice: éons
  rationale: Le terme technique « éons » conserve la cosmologie propre au texte et évite de réduire le mot à de simples périodes temporelles.
- source_word: Sophia / Pistis / Zoe
  choice: Sophia / Pistis / Zoé
  rationale: Les noms cosmologiques sont conservés sous leurs formes traditionnelles ; « Zoé » reçoit l’accent usuel en français.
- source_word: the All
  choice: le Tout
  rationale: La formulation nominale et la majuscule préservent la portée cosmologique du terme sans préciser davantage son statut théologique.
- source_word: androgynous
  choice: androgyne
  rationale: Traduction directe et intelligible, qui maintient l’affirmation anthropomorphique inhabituelle du témoin.
- source_word: Tartaros
  choice: le Tartare
  rationale: « Le Tartare » est la forme française établie du lieu mythologique, plus naturelle que la simple translittération grecque.
- source_word: aborted fetus
  choice: fœtus avorté
  rationale: Cette expression directe conserve l’image choquante et dépréciative de la source au lieu de l’atténuer.
theological_decisions:
- issue: Statut de Sophia, Pistis, de l’Indestructibilité et du Tout
  choice: Conserver les noms et les personnifications tels quels
  alternative: Les paraphraser au moyen de catégories théologiques plus familières
  rationale: Le passage présente sa propre cosmologie ; l’expliciter selon une tradition extérieure en réduirait l’ambiguïté et importerait une doctrine étrangère.
- issue: Prétention de l’archonte à être Dieu
  choice: Traduire directement « Je suis Dieu » et « Je suis le Dieu du Tout »
  alternative: Employer « un dieu » ou qualifier explicitement sa déclaration de fausse dans la citation
  rationale: Le récit condamne ensuite cette prétention, mais la parole elle-même doit garder sa force et sa tension.
- issue: Genre grammatical de la créature issue de Sophia
  choice: Employer d’abord le féminin pour « chose/bête », puis le masculin lorsque le récit individualise l’archonte
  alternative: Uniformiser tout le passage au masculin
  rationale: Cette variation suit la syntaxe française et le glissement narratif du produit matériel vers l’archonte personnel, sans résoudre artificiellement son androgynie.
- issue: Rapport entre le souffle de Zoé et l’ange de feu
  choice: Maintenir que son souffle « devint pour elle un ange de feu »
  alternative: Dire qu’elle créa ou engendra intentionnellement l’ange
  rationale: La formulation retenue préserve la relation de transformation exprimée par le témoin et n’ajoute pas de mécanisme théologique.
translation_notes:
  register: 'Français international moderne, soutenu mais lisible. Les termes cosmologiques spécialisés (archonte, éons, Sophia, Pistis) sont conservés afin de respecter l’univers conceptuel du traité. Le texte est provisoire : la base fournie est un témoin anglais du copte, et une vérification directe du manuscrit copte reste nécessaire.'
