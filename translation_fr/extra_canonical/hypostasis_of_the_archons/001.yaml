translation:
  language: fr
  text: '[] Au sujet de la substance des autorités — ce dont elles ont été faites.


    Par l’Esprit du Père de vérité, le grand apôtre a parlé des autorités des ténèbres et nous a fait savoir que « notre combat n’est pas contre la chair et [le sang], mais contre les autorités cosmiques et les esprits du mal ».[a] Je t’ai envoyé cet écrit parce que tu m’as interrogé au sujet de la substance des autorités — ce dont elles ont été faites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation fait écho à Éphésiens 6.12. Les crochets autour de « le sang » signalent une lacune ou une restitution dans le témoin manuscrit.
    reason: Identifier l’allusion scripturaire sans harmoniser la citation et expliquer les crochets hérités de l’état du manuscrit.
lexical_decisions:
- source_word: substance
  choice: substance
  rationale: Conserve le terme conceptuel du témoin tout en laissant ouverte la question de la nature ou de la matière constitutive des autorités; la reformulation explicative « ce dont elles ont été faites » préserve la précision transmise par le témoin.
- source_word: authorities
  choice: autorités
  rationale: Équivalent naturel et traditionnel qui maintient la portée cosmique ou spirituelle du terme sans imposer une interprétation plus précise comme « puissances » ou « archontes ».
- source_word: cosmic authorities
  choice: autorités cosmiques
  rationale: Rend directement la portée cosmique du syntagme et évite de réduire ces êtres à des autorités simplement terrestres.
- source_word: spirits of evil
  choice: esprits du mal
  rationale: Préserve la formulation abstraite et l’ambiguïté du rapport au mal, plutôt que de préciser « esprits mauvais ».
- source_word: battle
  choice: combat
  rationale: Terme français courant et digne, adapté à l’image d’un affrontement spirituel sans suraccentuer le registre militaire.
theological_decisions:
- issue: Nature des « autorités »
  choice: Conserver « autorités » sans les identifier davantage
  alternative: Employer « archontes », « puissances » ou « souverains »
  rationale: Le passage les situe dans les ténèbres et dans le cosmos, mais la donnée fournie ne justifie pas d’imposer une catégorie doctrinale plus étroite.
- issue: Formule « Père de vérité »
  choice: Père de vérité
  alternative: Père de la vérité
  rationale: La construction sans article conserve la densité et l’ambiguïté de la formule du témoin, qui peut exprimer une qualité, une origine ou une relation.
- issue: Citation apostolique
  choice: Garder la formulation propre au témoin et signaler seulement son parallèle
  alternative: Harmoniser le texte avec une traduction biblique française d’Éphésiens 6.12
  rationale: Une harmonisation effacerait les particularités de cette citation, notamment « autorités cosmiques » et « esprits du mal ».
translation_notes:
  register: Français international moderne, clair et digne. La répétition de l’énoncé initial à la fin est conservée. Le numéro de page manuscrit nu « [2] » est omis, tandis que les crochets signalant une lacune ou une restitution sont maintenus. La traduction demeure provisoire, car elle repose sur un témoin anglais du texte copte et qu’une vérification directe du copte reste à effectuer.
