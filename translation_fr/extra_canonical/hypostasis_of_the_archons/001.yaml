review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni, conserve la répétition de l’objet de l’écrit et ne résout pas de manière doctrinale l’identité des « autorités ». Une correction est indiquée : « a parlé des » est plus large que « mentioned »; « a mentionné » rend plus précisément le verbe du témoin.'
  naturalness: Le français est clair, moderne et d’un registre approprié. La formulation « ce dont elles ont été faites » conserve utilement l’explication parenthétique du témoin. L’appel de note doit toutefois se placer avant le point final après la citation selon l’usage typographique français.
  terminology: « substance », « autorités », « autorités cosmiques », « esprits du mal » et « Père de vérité » sont des choix prudents qui préservent les ambiguïtés du témoin. La majuscule à « Esprit » est conservée comme dans le projet, sans que cela ne nécessite une interprétation doctrinale supplémentaire.
  issues:
  - severity: low
    issue: « a parlé des autorités » traduit insuffisamment précisément « mentioned the authorities »
    rationale: Le témoin indique que le grand apôtre les a « mentionnées », non qu’il en a nécessairement traité ou parlé de façon développée.
  - severity: low
    issue: Position de l’appel de note après la citation
    rationale: 'En typographie française, l’appel de note associé à la citation se place avant le point final : « … mal »[a].'
  revised_text: '[] Au sujet de la substance des autorités — ce dont elles ont été faites.


    Par l’Esprit du Père de vérité, le grand apôtre a mentionné les autorités des ténèbres et nous a fait savoir que « notre combat n’est pas contre la chair et [le sang], mais contre les autorités cosmiques et les esprits du mal »[a]. Je t’ai envoyé cet écrit parce que tu m’as interrogé au sujet de la substance des autorités — ce dont elles ont été faites.'
  revised_footnotes:
  - marker: a
    text: La formulation fait écho à Éphésiens 6.12. Les crochets autour de « le sang » signalent une lacune ou une restitution dans le témoin manuscrit.
    reason: Identifier l’allusion scripturaire sans harmoniser la citation et expliquer les crochets hérités de l’état du manuscrit.
  revision_rationale: La révision remplace seulement « a parlé des » par « a mentionné », équivalent plus exact de « mentioned », et normalise la position de l’appel de note. Le reste est conservé, y compris les crochets, la répétition finale et les termes volontairement non spécialisés.
