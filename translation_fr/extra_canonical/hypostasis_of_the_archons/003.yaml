  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: fr
  text: 'Les archontes complotèrent et dirent : « Allons, créons un homme qui soit poussière de la terre. »


    Ils façonnèrent leur créature comme un être entièrement terrestre.


    Les archontes ont des corps à la fois féminins [et masculins], et leurs visages sont des visages de bêtes. Ils prirent [de la terre] et façonnèrent [leur homme] d’après leurs propres corps et [d’après l’image] de Dieu qui leur était apparue sur l’eau.


    Ils dirent : « [Allons], saisissons l’image au moyen de la forme que nous avons modelée, [afin que] l’image contemple son pendant masculin [et s’en éprenne], [a] et afin que nous puissions la saisir dans la forme que nous avons modelée. » Impuissants, ils ne comprenaient pas la puissance de Dieu.


    Il souffla sur son visage, et l’homme reçut une âme, mais il resta à terre pendant plusieurs jours. Impuissants, les archontes ne purent le faire se lever. Ils continuèrent à souffler comme des vents de tempête, cherchant à saisir l’image qui leur était apparue sur les eaux, sans en connaître la puissance.


    Tous ces événements se produisirent par la volonté du Père du Tout.


    Ensuite, l’Esprit regarda l’homme doté d’une âme qui gisait à terre. L’Esprit sortit de la Terre adamique.[b] Il descendit et établit sa demeure en lui ; cet homme devint alors une âme vivante. L’Esprit lui donna le nom d’Adam, parce qu’on le trouva se mouvant sur la terre.[c]


    Une voix venue de l’incorruptibilité se fit entendre pour venir en aide à Adam. Les archontes rassemblèrent tous les animaux de la terre et tous les oiseaux du ciel, puis les amenèrent devant Adam pour savoir comment il les appellerait, afin qu’il donne un nom à tous les oiseaux et à tous les animaux.'
