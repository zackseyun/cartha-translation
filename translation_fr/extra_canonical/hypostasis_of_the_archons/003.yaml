  footnotes:
  - marker: a
    text: Le témoin signale ici une lacune vide après les mots « et s’en éprenne » ; aucun contenu supplémentaire ne peut être restitué avec certitude.
    reason: Préserver le signal de dommage manuscrit sans laisser dans le texte français un crochet vide peu clair.
  - marker: b
    text: « Terre adamique » traduit littéralement une désignation énigmatique du témoin ; son référent exact reste incertain.
    reason: Signaler l’incertitude lexicale et conceptuelle sans imposer une interprétation.
  - marker: c
    text: Le texte associe le nom Adam à la terre et au fait de s’y mouvoir ; le jeu de mots sous-jacent ne se reproduit pas pleinement en français.
    reason: Rendre perceptible l’étiologie du nom sans inventer un équivalent français.
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Conserve le terme technique traditionnel désignant les puissances dirigeantes du récit, sans le réduire à « chefs » ou « autorités ».
- source_word: soil of the earth
  choice: poussière de la terre
  rationale: Formulation naturelle qui maintient l’écho anthropogonique de la matière terrestre ; la tournure du témoin est inhabituelle et reste interprétativement difficile.
- source_word: soulish man
  choice: l’homme doté d’une âme
  rationale: Rend la distinction entre l’homme seulement animé et l’homme habité par l’Esprit, sans employer le peu intelligible « homme psychique » dans le corps du texte.
- source_word: Adamic Land
  choice: Terre adamique
  rationale: Préserve comme désignation technique l’expression énigmatique du témoin au lieu de l’identifier sans preuve à une simple terre matérielle.
- source_word: indestructibility
  choice: incorruptibilité
  rationale: Terme français établi dans la littérature religieuse ancienne pour un domaine ou état soustrait à la corruption.
- source_word: Father of the All
  choice: Père du Tout
  rationale: Conserve le titre cosmologique et sa portée absolue.
theological_decisions:
- issue: Identité du sujet de « Il souffla »
  choice: Maintien du pronom singulier « Il »
  alternative: « Un archonte souffla » ou « ils soufflèrent »
  rationale: Le témoin passe sans explication du pluriel au singulier ; nommer le sujet résoudrait indûment une ambiguïté textuelle et théologique.
- issue: Rapport entre âme et Esprit
  choice: Distinction maintenue entre la réception initiale d’une âme et la demeure ultérieure de l’Esprit
  alternative: Fusionner les deux actes en une seule animation
  rationale: La progression est structurante dans le récit et ne doit pas être harmonisée avec une anthropologie doctrinale extérieure.
- issue: Rôle de la volonté du Père du Tout
  choice: Traduction directe sans explication causale supplémentaire
  alternative: Préciser que le Père approuve, permet ou ordonne les événements
  rationale: Le texte affirme la volonté du Père sans définir ici son mode d’action ; cette tension est conservée.
- issue: Genre de l’image et du pendant masculin
  choice: « l’image » et « son pendant masculin »
  alternative: Identifier explicitement l’image comme féminine ou comme Ève
  rationale: Le passage suggère une polarité sexuée mais le témoin fourni ne justifie pas une identification explicite.
