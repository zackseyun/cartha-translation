  register: 'Français international actuel, narratif et digne. Les crochets du témoin ont été conservés pour les restaurations, sauf la lacune vide, reportée en note [a] pour rester lisible. Le présent projet demeure provisoire : il repose sur le témoin anglais public fourni, la vérification directe du copte du Codex II,4 étant encore en attente.'
