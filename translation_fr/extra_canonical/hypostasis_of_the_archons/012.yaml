lexical_decisions:
- source_word: hyle / matter
  choice: matière
  rationale: « Matière » conserve le sens concret et cosmologique du terme grec transmis dans le texte, sans le spiritualiser.
- source_word: authorities
  choice: autorités
  rationale: Ce terme courant rend la fonction de domination des puissances adverses tout en évitant d’imposer partout le terme technique « archontes ».
- source_word: plasma
  choice: substance malléable
  rationale: Cette expression garde l’idée d’une matière susceptible d’être façonnée ; la variante « matière façonnable » est signalée en note.
- source_word: seed
  choice: semence
  rationale: « Semence » préserve la portée collective, généalogique et spirituelle du terme sans la réduire à une simple descendance biologique.
- source_word: kingless generation
  choice: génération sans roi
  rationale: Traduction formelle d’une expression cosmologique inhabituelle dont l’étrangeté doit être conservée.
- source_word: the All
  choice: le Tout
  rationale: La majuscule marque l’emploi cosmologique et quasi technique de l’expression.
- source_word: hypostasis
  choice: substance
  rationale: Dans le titre, « substance » suit l’interprétation matérielle soutenue par le contexte et reste plus intelligible que le calque « hypostase ».
- source_word: archons
  choice: Archontes
  rationale: Dans le titre traditionnel, le terme technique identifie précisément les êtres visés ; dans le corps du texte, ils sont désignés fonctionnellement comme les « autorités ».
theological_decisions:
- issue: Origine des âmes et impuissance des autorités
  choice: Conserver l’affirmation selon laquelle les âmes viennent de la lumière indestructible et portent en elles l’esprit de vérité.
  alternative: Reformuler en catégories chrétiennes doctrinales plus familières.
  rationale: Le passage présente une cosmologie propre qu’une traduction ne doit ni harmoniser ni corriger.
- issue: Immortalité parmi les mortels
  choice: « sera immortel parmi les humains mortels »
  alternative: « ne mourra pas » ou « recevra la vie éternelle »
  rationale: La formulation retenue conserve le contraste paradoxal du texte entre l’immortel et les mortels.
- issue: Identité de l’Homme véritable
  choice: Maintenir le titre « l’Homme véritable » sans identifier explicitement cette figure.
  alternative: L’identifier au Christ ou à une autre figure salvatrice.
  rationale: Le passage ne donne pas ici une identification explicite ; la traduction préserve cette ouverture.
- issue: Texte restauré concernant l’esprit de vérité
  choice: Maintenir « [l’esprit de] vérité » entre crochets.
  alternative: Imprimer simplement « la vérité » ou intégrer « l’esprit de vérité » sans marque.
  rationale: Les crochets rendent visible l’incertitude textuelle au lieu de présenter la restitution comme assurée.
- issue: Destruction et mort des autorités
  choice: Conserver les possessifs ambigus « leur destruction » et « leur mort ».
  alternative: Préciser qu’il s’agit exclusivement des autorités, des anges ou des démons.
  rationale: Le parallélisme permet plusieurs rattachements ; la traduction ne tranche pas ce que le témoin ne clarifie pas entièrement.
translation_notes:
  register: Français international moderne, digne et accessible. Les titres cosmologiques (« Père », « Homme véritable », « Tout », « Esprit saint », « Fils ») gardent une majuscule. Le passé simple est limité aux incises narratives brèves ; les discours emploient une syntaxe actuelle. Traduction provisoire fondée sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.
