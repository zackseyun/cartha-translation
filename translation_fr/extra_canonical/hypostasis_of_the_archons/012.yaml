  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: fr
  text: 'Je dis : « Mon Seigneur, moi aussi, est-ce que je tire mon origine de leur matière ? »


    « Toi et ta descendance, vous tirez votre origine du Père, qui existait depuis le commencement.


    « Les âmes viennent d’en haut, de la lumière indestructible. C’est pourquoi les autorités ne peuvent pas s’approcher d’elles, à cause de l’esprit de vérité qui est en elles. Quiconque connaît ce chemin de vérité sera immortel parmi les humains mortels.


    « Cependant, cette semence ne sera pas encore connue. Elle le sera après trois âges et les libérera alors de l’asservissement à l’erreur des autorités. »


    Je demandai : « Mon Seigneur, combien de temps faudra-t-il encore avant que cela arrive ? »


    Il me répondit : « Jusqu’au moment où l’Homme véritable, dans une substance malléable[a], révélera [l’esprit de] vérité que le Père a envoyé[b].


    « Alors, il les instruira de toutes choses, en les oignant de l’huile de la vie éternelle, qui lui a été accordée par la génération sans roi.


    « Alors, ils seront libérés de la pensée aveugle. Ils fouleront aux pieds la mort, qui vient des autorités, et ils monteront vers la lumière infinie où demeure cette semence.


    « Alors, les autorités abandonneront les temps qui leur sont impartis. Leurs anges pleureront leur destruction, et leurs démons s’affligeront de leur mort.


    « Alors, tous les fils de la lumière connaîtront véritablement la vérité, leur racine, le Père du Tout et l’Esprit saint. Tous proclameront d’une seule voix : “La vérité du Père est juste. Le Fils règne sur le Tout.” Et tous proclameront : “Pour les siècles des siècles, saint, saint, saint ! Amen.” »


    La Substance des Archontes


    [a] Ou « matière façonnable » ; le texte emploie le terme grec plasma.


    [b] Le manuscrit est endommagé à cet endroit ; les mots « l’esprit de » sont une restitution.'
