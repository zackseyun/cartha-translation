  text: 'Next, Eve gave birth to their son Cain, and Cain cultivated the land. Then Adam knew his wife. She became pregnant again and gave birth to Abel, and Abel was a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    The fleshly Cain pursued his brother Abel.


    God said to Cain, “Where is your brother Abel?”


    Cain answered, “Am I my brother’s keeper?”


    God said to Cain, “Listen! The voice of your brother’s blood cries out to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said, “I have given birth to [another] man through God, to replace [Abel].”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And humanity began to multiply and progress.'
translation:
  language: fr
  text: 'Ensuite, Ève donna naissance à leur fils Caïn, et Caïn cultivait la terre. Puis Adam connut sa femme. Elle devint de nouveau enceinte et donna naissance à Abel, qui était berger. Caïn apporta des produits de son champ, tandis qu’Abel apporta en offrande quelques-uns de ses agneaux. Dieu regarda avec faveur l’offrande d’Abel, mais il n’accepta pas les offrandes de Caïn.


    Caïn, l’homme charnel, poursuivit son frère Abel.[a]


    Dieu dit à Caïn : « Où est Abel, ton frère ? »


    Caïn répondit : « Suis-je le gardien de mon frère ? »


    Dieu dit à Caïn : « Écoute ! La voix du sang de ton frère crie vers moi. Tu as péché par ta bouche. Cela retombera sur toi.[b] Celui qui tuera Caïn déclenchera sept vengeances, et tu vivras sur la terre dans les gémissements et les tremblements. »


    Adam [connut] de nouveau Ève, son pendant féminin ; elle devint enceinte et donna [Seth] à Adam. Elle dit : « Par Dieu, j’ai donné naissance à [un autre] homme pour remplacer [Abel]. »[c]


    Ève devint de nouveau enceinte et donna naissance à [Noréa]. Ève dit : « Il a engendré pour moi une vierge afin qu’elle aide de nombreuses générations humaines. »[d] C’est la vierge que les puissances n’ont pas souillée.[e]


    Et l’humanité commença à se multiplier et à progresser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « l’homme charnel » traduit littéralement la qualification de Caïn dans le témoin disponible. Sa portée exacte demeure incertaine en attendant une vérification directe du copte.
    reason: Signaler une expression anthropologique importante et potentiellement technique.
  - marker: b
    text: Le pronom de « cela retombera sur toi » peut renvoyer au péché commis par la bouche ou à ses conséquences ; le témoin fourni ne permet pas de trancher.
    reason: Préserver l’ambiguïté du référent.
  - marker: c
    text: Les crochets signalent ici des mots restaurés ou incertains dans la transmission du texte. « Par Dieu » peut aussi se comprendre « au moyen de Dieu ».
    reason: Expliquer les restaurations et l’ambiguïté de la préposition.
  - marker: d
    text: Le sujet de « il a engendré » n’est pas identifié explicitement dans le passage transmis.
    reason: Éviter une identification théologique non fondée.
  - marker: e
    text: Les « puissances » sont les forces hostiles évoquées dans le traité, souvent désignées comme les archontes.
    reason: Fournir le contexte littéraire sans remplacer le terme du texte.
lexical_decisions:
- source_word: knew
  choice: connut
  rationale: Conserve l’euphémisme biblique pour l’union sexuelle et son écho à la Genèse, sans l’expliciter dans le corps du texte.
- source_word: fleshly
  choice: l’homme charnel
  rationale: Rend la qualification anthropologique ou polémique sans la réduire au seul sens de « physique ».
- source_word: keeper
  choice: gardien
  rationale: Formulation française naturelle qui conserve la question morale bien connue sans imposer « responsable ».
- source_word: forces
  choice: puissances
  rationale: Dans le contexte du traité, il s’agit vraisemblablement des puissances archontiques ; « puissances » préserve toutefois le terme général du témoin fourni.
- source_word: progress
  choice: progresser
  rationale: Préserve le sens distinct de la simple multiplication, malgré l’ambiguïté sur la nature de ce progrès.
theological_decisions:
- issue: Identité et portée de « Dieu »
  choice: Dieu
  alternative: le Dieu / une désignation archontique explicitée
  rationale: Le témoin dit « God ». Le texte principal ne tranche pas l’identité théologique du locuteur au sein de la cosmologie du traité.
- issue: Formule de la naissance de Seth
  choice: « Par Dieu, j’ai donné naissance »
  alternative: « J’ai donné naissance ... au moyen de Dieu »
  rationale: « Par Dieu » conserve l’ambiguïté instrumentale ou causale de « through God » et produit un français lisible.
- issue: Annonce concernant Noréa
  choice: « Il a engendré pour moi une vierge »
  alternative: « Une vierge m’a été engendrée »
  rationale: Conserve le sujet masculin non identifié du témoin, sans décider s’il désigne Dieu, Adam ou une autre figure.
- issue: Les sept vengeances
  choice: « déclenchera sept vengeances »
  alternative: « subira une vengeance septuple »
  rationale: Suit la syntaxe singulière du témoin fourni plutôt que d’harmoniser silencieusement avec Genèse 4.15.
translation_notes:
  register: 'Français international moderne, digne et accessible, avec maintien des échos à la Genèse. Les crochets du témoin ont été conservés pour signaler les restaurations ou lacunes. Le signe « [] » isolé après la parole d’Ève n’a pas été reproduit tel quel : une note [d] signale plutôt l’incertitude pertinente. Projet nécessairement provisoire, puisque la révision directe du copte est annoncée comme restant à faire.'
