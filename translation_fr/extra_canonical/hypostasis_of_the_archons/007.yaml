base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: fr
  text: 'Les archontes complotèrent ensemble et dirent : « Allons, provoquons de nos propres mains un déluge et anéantissons toute chair, les humains comme les bêtes. »


    Lorsque l’archonte des puissances apprit leur complot, il dit à Noé : « Fais-toi une arche avec du bois qui ne pourrit pas, et caches-y-toi, toi avec tes enfants, ainsi qu’avec les bêtes et les oiseaux du ciel, petits et grands, en la plaçant sur le mont Sir. »


    Oréa[a] s’approcha alors de Noé, car elle voulait monter dans l’arche. Comme il refusa de la laisser entrer, elle souffla sur l’arche, qui fut dévorée par le feu. Il construisit donc une arche une seconde fois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais fourni porte « Orea [3] » ; le chiffre semble être un appel de note éditorial. Le nom est ici transcrit « Oréa ».
    reason: Signaler honnêtement l’indication éditoriale du témoin tout en employant un appel de note adapté à la présente édition.
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Le terme français « archontes » conserve la désignation technique propre à ce texte ancien, plutôt que de la réduire au sens général de « dirigeants ».
- source_word: all flesh
  choice: toute chair
  rationale: 'Cette expression traditionnelle et concrète préserve l’écho au récit du Déluge ainsi que l’explication immédiatement donnée : humains et bêtes.'
- source_word: archon of the forces
  choice: l’archonte des puissances
  rationale: « Puissances » convient au contexte cosmologique tout en conservant l’ambiguïté du terme transmis par le témoin anglais.
- source_word: wood that does not rot
  choice: du bois qui ne pourrit pas
  rationale: Formulation claire et directe, sans identifier arbitrairement une essence de bois particulière.
- source_word: hide in it
  choice: caches-y-toi
  rationale: Conserve l’idée inhabituelle de se dissimuler dans l’arche, au lieu de la normaliser en simple entrée ou refuge.
- source_word: blew on the ark
  choice: elle souffla sur l’arche
  rationale: Maintient l’action étonnante et concise du récit sans en préciser artificiellement le mécanisme.
theological_decisions:
- issue: Identité et statut des êtres qui provoquent le Déluge
  choice: Les désigner comme « archontes »
  alternative: « dirigeants » ou « autorités »
  rationale: Le terme technique préserve la cosmologie propre à l’œuvre et évite d’assimiler silencieusement ces figures à Dieu ou à de simples gouvernants humains.
- issue: Relation entre l’archonte des puissances et les autres archontes
  choice: Conserver la distinction narrative sans expliquer leurs rapports
  alternative: Présenter l’archonte comme leur chef, leur adversaire ou une figure divine
  rationale: L’extrait dit seulement qu’il apprend leur complot et avertit Noé ; toute hiérarchie ou identification supplémentaire dépasserait les données fournies.
- issue: Pouvoir d’Oréa sur l’arche
  choice: Rapporter simplement qu’elle souffle et que l’arche est consumée
  alternative: Expliquer ce souffle comme un miracle, un pouvoir spirituel ou un acte magique
  rationale: Le texte laisse la nature de cet acte inexpliquée ; la traduction conserve cette tension.
translation_notes:
  register: 'Français international moderne, narratif et digne. Ponctuation française et noms bibliques usuels (« Noé ») employés. Cette version demeure provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.'
