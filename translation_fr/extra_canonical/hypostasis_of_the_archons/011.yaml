base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: fr
  text: 'Quand Sabaoth, fils de Yaldabaoth, vit la puissance de cet ange, il se repentit et prononça un jugement contre son père et contre Matière, sa mère, qu’il couvrit d’injures.


    Il chanta des chants de louange à Sophia, qui est en haut, ainsi qu’à sa fille Zoé. Sophia et Zoé l’élevèrent et l’établirent au-dessus du septième ciel, sous le voile qui sépare les domaines supérieurs des domaines inférieurs. Il est appelé « Dieu des armées, Sabaoth », parce qu’il commande les armées du chaos, Sophia l’ayant établi dans cette fonction.


    Après ces événements, Sabaoth se fit un immense char de chérubins à quatre faces, une infinité d’anges pour le servir, ainsi que des harpes et des lyres.


    Sophia amena sa fille Zoé et la fit asseoir à sa droite pour qu’elle l’instruise au sujet des réalités du huitième ciel. Puis elle plaça l’ange de la colère à sa gauche.


    [Depuis] ce jour, [sa droite] fut appelée « vie », […] tandis que la gauche en vint à symboliser l’injustice du domaine supérieur de l’Autocrate.[a] Ces événements avaient eu lieu avant que vous n’existiez.


    Quand Yaldabaoth vit Sabaoth dans une si grande majesté et élevé si haut, il devint jaloux de lui, et sa jalousie devint une entité androgyne. Telle fut l’origine de Jalousie, qui donna naissance à Mort. Mort engendra une descendance et établit chacun de ses enfants à la tête de son propre ciel. Tous les cieux du chaos furent remplis de leurs multitudes.


    Cependant, tous ces événements eurent lieu par la volonté du Père du Tout, selon le modèle de toutes les réalités d’en haut, afin que la totalité du chaos soit menée à son accomplissement.[b]


    Voici, je t’ai instruit au sujet du moule des archontes, de la matière dans laquelle il s’est manifesté, ainsi que de leur parent et de leur monde.[c]'
