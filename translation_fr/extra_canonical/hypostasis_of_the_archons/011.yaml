lexical_decisions:
- source_word: Sabaoth / God of hosts
  choice: Sabaoth / Dieu des armées
  rationale: Conserve le nom traditionnel Sabaoth et rend « hosts » par « armées », formule française reconnue qui garde ici le lien explicite avec les armées du chaos.
- source_word: Sophia / Zoe
  choice: Sophia / Zoé
  rationale: Conserve les noms propres grecs employés comme personnages; l’accent de « Zoé » facilite la lecture française sans traduire les noms en « Sagesse » et « Vie ».
- source_word: Matter
  choice: Matière
  rationale: La majuscule maintient la personnification féminine et évite de réduire le terme à une simple substance impersonnelle.
- source_word: autocrat
  choice: l’Autocrate
  rationale: Conserve le titre technique et sa portée polémique sans l’identifier à une figure doctrinale extérieure au passage.
- source_word: Father of the All
  choice: Père du Tout
  rationale: Rend la formule cosmologique de manière littérale et distincte, sans la normaliser en une appellation confessionnelle plus courante.
- source_word: mold of the archons
  choice: moule des archontes
  rationale: Préserve l’image concrète et l’ambiguïté de « mold » plutôt que de choisir univoquement « forme », « modèle » ou « constitution ».
theological_decisions:
- issue: Repentance of Sabaoth
  choice: « il se repentit »
  alternative: « il changea d’avis »
  rationale: Le témoin exprime explicitement la repentance; la formulation retenue conserve sa portée morale et religieuse sans l’atténuer.
- issue: Status of Sophia, Zoe, Envy, Death, and Matter
  choice: Personnification signalée par les majuscules lorsque le français le permet
  alternative: Traduction entièrement abstraite en noms communs
  rationale: Le récit les présente comme des agents qui agissent et engendrent; les majuscules rendent cette fonction narrative sans définir davantage leur statut ontologique.
- issue: Summation of chaos
  choice: « afin que la totalité du chaos soit menée à son accomplissement »
  alternative: « afin que la récapitulation du chaos s’accomplisse »
  rationale: Cette formulation garde à la fois les idées de totalité et d’aboutissement présentes dans le témoin, sans imposer le sens technique que pourrait prendre « récapitulation ».
- issue: Ambiguous final pronouns
  choice: « de la matière dans laquelle il s’est manifesté, ainsi que de leur parent »
  alternative: Expliciter l’antécédent de « il » ou harmoniser « leur » au singulier
  rationale: Les référents ne sont pas assurés dans le témoin fourni; la traduction conserve cette tension au lieu de la résoudre conjecturalement.
translation_notes:
  register: Français international moderne, digne et lisible. Syntaxe narrative fluide, avec maintien des termes techniques nécessaires (« archontes », « Autocrate ») et des noms cosmologiques. Les anciens repères de page [7] et [8], qui ne font pas partie du discours, ne sont pas reproduits; les crochets liés aux restitutions et à la lacune sont conservés.
