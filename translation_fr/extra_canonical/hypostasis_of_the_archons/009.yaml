base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: fr
  text: 'L’ange dit : « C’est moi, Éléleth, le grand ange Sagesse, qui me tiens devant l’Esprit saint. J’ai été envoyé pour te parler et te sauver de la main des êtres sans loi. Je t’instruirai aussi au sujet de ta racine. »


    Quant à cet ange, je suis incapable de décrire sa puissance. Son apparence ressemble à de l’or fin, et son vêtement à de la neige. Ma bouche est vraiment incapable de décrire sa puissance et l’apparence de son visage.


    Le grand ange Éléleth me parla et dit : « Je suis Sagesse, l’une des Quatre Lumières qui se tiennent devant le grand Esprit invisible. Penses-tu vraiment que ces archontes puissent exercer un quelconque pouvoir sur toi ? Aucun d’eux ne pourra vaincre la racine de la vérité, car il[a] est apparu dans les derniers jours à cause de la racine de la vérité, et ces autorités seront enfermées. De plus, ces autorités ne pourront souiller ni toi ni cette génération, car ta demeure est dans l’incorruptibilité, là où demeure l’Esprit vierge, qui est au-dessus des autorités du chaos et de leur monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « il » est incertain dans le témoin disponible; il pourrait renvoyer à la racine de la vérité ou à une figure qui lui est associée.
    reason: Préserver une ambiguïté grammaticale et théologique que le témoin anglais ne permet pas de résoudre de manière sûre.
lexical_decisions:
- source_word: Wisdom
  choice: Sagesse
  rationale: Conserve le titre personnifié et sa portée conceptuelle, avec une majuscule.
- source_word: root
  choice: racine
  rationale: Maintient l’image technique et son ambiguïté dans ce contexte cosmologique, sans la paraphraser par « origine » ou « lignée ».
- source_word: archons
  choice: archontes
  rationale: Retient le terme français spécialisé pour les puissances dirigeantes de ce traité, tout en le distinguant du terme plus général « autorités » qui apparaît ensuite.
- source_word: indestructibility
  choice: incorruptibilité
  rationale: Rend l’état ou domaine impérissable évoqué par le passage dans un français théologique naturel; « indestructibilité » demeure une possibilité plus littérale.
- source_word: virgin Spirit
  choice: Esprit vierge
  rationale: Préserve la formulation inhabituelle et le genre grammatical sans l’interpréter comme un nom propre distinct.
- source_word: lawless ones
  choice: êtres sans loi
  rationale: Reproduit la désignation substantivée sans réduire son sens à la simple criminalité moderne.
theological_decisions:
- issue: Identité du référent masculin dans « he has appeared »
  choice: Conserver « il » et signaler l’ambiguïté par une note
  alternative: Identifier explicitement « la racine », Éléleth ou un révélateur particulier
  rationale: Le témoin fourni ne permet pas de fixer sûrement l’antécédent; une explicitation résoudrait indûment une tension réelle.
- issue: Rapport entre Éléleth et la Sagesse
  choice: Traduire littéralement « Je suis Sagesse »
  alternative: « Je suis la Sagesse » ou « je suis un ange de sagesse »
  rationale: La formulation identitaire du témoin est maintenue sans imposer une identification doctrinale plus précise.
- issue: Statut des Quatre Lumières et de l’Esprit invisible
  choice: Conserver les appellations avec majuscules
  alternative: Employer des minuscules descriptives
  rationale: Les expressions fonctionnent ici comme des titres ou désignations cosmologiques déterminées, sans ajout d’explication confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni; la vérification directe du copte du Codex II,4 reste à effectuer. Les termes cosmologiques distinctifs sont conservés sans harmonisation confessionnelle.
