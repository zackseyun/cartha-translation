translation:
  language: fr
  text: 'Alors la nature spirituelle féminine vint sous l’apparence du serpent, l’instructeur. Le serpent instruisit Adam et Ève et leur dit : « Que vous a dit Samaël ? A-t-il dit : “Vous pouvez manger de tous les arbres du jardin, mais ne mangez pas de [l’arbre] de la connaissance du bien et du mal” ? »


    [a] La femme charnelle répondit : « Il n’a pas seulement dit : “N’en mangez pas”, mais aussi : “N’y touchez pas, car le jour où vous en mangerez, vous mourrez certainement.” »


    Le serpent, l’instructeur, dit : « Non, vous ne mourrez certainement pas, car c’est par jalousie qu’il vous a dit cela. Au contraire, vos yeux s’ouvriront et vous deviendrez comme des dieux, connaissant le bien et le mal. » Alors la nature féminine qui instruisait se retira du serpent et l’abandonna comme une chose terrestre.


    La femme charnelle prit du fruit de l’arbre et en mangea. Elle en donna aussi à son mari, et c’est ainsi qu’ils mangèrent, eux qui n’étaient que psychiques.[b] Leur déficience se manifesta par leur manque de connaissance. Ils comprirent qu’ils avaient été dépouillés de ce qui est spirituel ; ils prirent des feuilles de figuier et les attachèrent autour de leurs reins nus.


    Comme il ignorait ce qui s’était passé, le chef des archontes arriva et dit : « Adam, où es-tu ? »


    Adam répondit : « J’ai entendu ta voix et j’ai eu peur parce que j’étais nu ; alors je me suis caché. »


    L’archonte dit : « Pourquoi t’es-tu caché, sinon parce que tu as mangé de l’unique arbre dont je t’avais interdit de manger ? Tu en as mangé ! »


    Adam répondit : « La femme que tu m’as donnée m’a [tendu] le fruit, et j’en ai mangé. »


    Alors l’[archonte] arrogant maudit la femme.


    La femme dit : « Le serpent m’a trompée, et j’ai mangé. »


    [Les archontes se tournèrent] vers le serpent et maudirent son ombre, [la rendant] faible.


    Ils ne savaient pas que c’était la forme même qu’ils avaient modelée. Dès lors, le serpent fut soumis à la malédiction des autorités, qui dura [c] jusqu’à la venue de l’Homme parfait.[d]


    Ils se tournèrent vers leur Adam et le chassèrent du jardin avec sa femme. Ils ne possédaient aucune bénédiction, car eux aussi étaient sous la malédiction.


    Ils plongèrent l’humanité dans une immense confusion et dans une vie de labeur, afin que leur humanité soit préoccupée des choses du monde et n’ait pas le temps de se soucier de l’Esprit saint.'
