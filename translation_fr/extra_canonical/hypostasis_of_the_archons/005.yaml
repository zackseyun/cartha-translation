lexical_decisions:
- source_word: archon(s)
  choice: archonte(s)
  rationale: Terme technique consacré en français pour les puissances dirigeantes de ce traité ; le traduire simplement par « chef » ou « autorité » effacerait sa portée cosmologique.
- source_word: female spiritual nature
  choice: nature spirituelle féminine
  rationale: Rendu formel qui préserve l’abstraction et le genre féminin sans l’identifier davantage à une figure particulière.
- source_word: teacher / teaching nature
  choice: l’instructeur / la nature féminine qui instruisait
  rationale: « Instructeur » garde le rôle attribué au serpent ; la tournure verbale naturelle évite l’expression française pesante « nature enseignante ».
- source_word: fleshly woman
  choice: femme charnelle
  rationale: Maintient le contraste explicite entre le charnel, le psychique et le spirituel.
- source_word: soul-ish / merely soulish
  choice: qui n’étaient que psychiques
  rationale: « Psychiques » est le terme français spécialisé qui conserve la catégorie anthropologique du texte ; une note prévient le sens moderne trompeur.
- source_word: Perfect Man
  choice: l’Homme parfait
  rationale: Conserve le titre et sa valeur anthropologique ou eschatologique sans l’identifier à une personne non nommée dans le passage.
- source_word: holy Spirit
  choice: l’Esprit saint
  rationale: Rendu français naturel du syntagme, avec majuscule à « Esprit » pour signaler sa fonction spirituelle distinctive sans imposer une formulation confessionnelle.
theological_decisions:
- issue: Statut du serpent
  choice: Conserver sa présentation positive comme instructeur investi par une nature spirituelle féminine.
  alternative: Harmoniser le serpent avec son rôle négatif dans une lecture traditionnelle de la Genèse.
  rationale: Le passage réinterprète délibérément le récit de la Genèse ; la traduction ne doit pas neutraliser cette tension.
- issue: « Comme des dieux »
  choice: Employer le pluriel « des dieux ».
  alternative: « Comme Dieu » ou « comme des êtres divins ».
  rationale: Le témoin fourni porte un pluriel ; celui-ci est conservé sans harmonisation avec une autre tradition textuelle.
- issue: Nature des humains après avoir mangé
  choice: Garder la catégorie « psychiques » et l’opposition au spirituel.
  alternative: Traduire de façon générale par « animés » ou « dépourvus d’esprit ».
  rationale: Cette distinction est structurante dans l’anthropologie du traité et doit rester visible.
- issue: Identité de l’Homme parfait
  choice: Ne pas expliciter son identité.
  alternative: L’identifier au Christ ou à une autre figure salvatrice.
  rationale: Le passage lui-même ne fournit pas cette identification ; l’ambiguïté théologique est donc préservée.
- issue: Ignorance du chef des archontes
  choice: Dire explicitement qu’il ignorait ce qui s’était passé.
  alternative: Atténuer cette ignorance en simple arrivée après les faits.
  rationale: L’ignorance de l’archonte appartient à la critique théologique développée par le texte.
