  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: fr
  text: 'Les archontes amenèrent Adam et le placèrent dans le jardin pour qu’il le cultive et le garde. Ils lui donnèrent cet ordre : « Tu peux manger de [tous] les arbres du jardin, mais ne mange pas de l’arbre de la connaissance du bien et du mal. Ne le [touche] pas, car le jour où tu en mangeras, tu mourras certainement. »


    [Voilà] ce qu’ils [lui dirent], sans pourtant comprendre ce [qu’ils lui avaient dit]. C’est plutôt selon la volonté du Père [] qu’ils parlèrent ainsi, afin qu’Adam en mange effectivement et qu’Adam ne les considère <pas> comme le ferait un homme entièrement matériel.


    Les archontes complotèrent entre eux et dirent : « Allons, faisons tomber un profond sommeil sur Adam. » Et Adam s’endormit. Le profond sommeil qu’ils firent tomber sur lui et dans lequel il dormit, c’est l’ignorance. Ils ouvrirent son côté, comme une femme vivante.[a] Puis ils refermèrent son côté en remettant de la chair à sa place, et Adam devint seulement psychique.[b]


    La femme spirituelle s’approcha de lui et lui dit : « Lève-toi, Adam. »


    Quand il la regarda, il dit : « Tu m’as donné la vie. Tu seras appelée la Mère des vivants, parce qu’elle est ma mère. Elle est la guérisseuse, la femme, celle qui a enfanté. »[c]


    Les autorités s’approchèrent de leur Adam. Quand elles virent son pendant féminin s’entretenir avec lui, elles furent excitées et la désirèrent. Elles se dirent entre elles : « Allons, répandons notre semence en elle », et elles la poursuivirent. Mais elle se moqua d’elles à cause de leur stupidité et de leur aveuglement. Au moment où elles la saisirent, elle devint un arbre et plaça devant elles une ressemblance obscure d’elle-même. Elles la souillèrent de la manière la plus ignoble, profanant ainsi le sceau de sa voix.[d] Elles attirèrent ainsi le jugement sur elles-mêmes par la forme qu’elles avaient façonnée à leur propre image.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La comparaison « comme une femme vivante » est obscure dans le témoin transmis : elle peut se rapporter à l’ouverture du côté ou à ce qui en est tiré. La traduction ne tranche pas.'
    reason: Signaler une difficulté syntaxique et interprétative importante.
  - marker: b
    text: Ici, « psychique » désigne une catégorie anthropologique distincte du « spirituel » dans le vocabulaire du traité; le mot ne signifie pas simplement « mental » au sens moderne.
    reason: Éviter un contresens moderne tout en préservant le terme technique.
  - marker: c
    text: Le passage de « tu » à « elle » se trouve dans le témoin utilisé et peut refléter soit une rupture grammaticale, soit une distinction que le texte n’explicite pas.
    reason: Préserver et expliquer une discordance pronominale sans la corriger.
  - marker: d
    text: L’expression « le sceau de sa voix » est énigmatique. Elle est traduite littéralement afin de ne pas imposer une interprétation.
    reason: Rendre visible une expression source difficile et théologiquement chargée.
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Le terme technique est conservé par translittération, car « chefs » ou « dirigeants » effacerait sa fonction cosmologique particulière dans ce traité.
- source_word: authorities
  choice: autorités
  rationale: Ce choix maintient la distinction lexicale du témoin entre « archontes » et « autorités », sans décider si les deux désignent exactement le même groupe.
- source_word: tend it and guard it
  choice: le cultive et le garde
  rationale: Formulation naturelle qui conserve les deux actions distinctes et l’écho au récit du jardin.
- source_word: merely soulish
  choice: seulement psychique
  rationale: « Psychique » préserve l’opposition anthropologique du traité entre le psychique et le spirituel; « doté d’une âme » ou « animé » banaliserait cette catégorie.
- source_word: spiritual woman
  choice: femme spirituelle
  rationale: Traduction transparente qui conserve le contraste explicite avec l’état psychique d’Adam.
- source_word: female counterpart
  choice: pendant féminin
  rationale: Cette expression rend l’idée d’une figure correspondante sans l’identifier trop vite à une épouse, à une côte ou à un simple double.
- source_word: semen
  choice: semence
  rationale: « Semence » demeure explicite dans le contexte tout en convenant au registre ancien et dignifié du passage.
- source_word: shadowy likeness
  choice: ressemblance obscure
  rationale: Le choix conserve l’ambiguïté entre une apparence ténébreuse, indistincte ou relevant de l’ombre.
- source_word: signet of her voice
  choice: sceau de sa voix
  rationale: Traduction formelle d’une expression énigmatique, laissée sans paraphrase interprétative.
theological_decisions:
- issue: La volonté du Père et la transgression d’Adam
  choice: « selon la volonté du Père [...] afin qu’Adam en mange effectivement »
  alternative: Atténuer le lien en traduisant « avec la permission du Père »
  rationale: Le témoin établit un rapport intentionnel fort; la traduction conserve cette tension théologique au lieu de la résoudre.
- issue: La négation signalée par crochets obliques
  choice: Conserver « <pas> » dans « ne les considère <pas> »
  alternative: Intégrer silencieusement la négation ou l’omettre
  rationale: Les crochets obliques signalent une intervention textuelle du témoin. Leur maintien rend visible l’incertitude qui influe directement sur le sens.
- issue: Le profond sommeil identifié à l’ignorance
  choice: « c’est l’ignorance »
  alternative: « symbolise l’ignorance »
  rationale: Le texte formule une identification, non une simple comparaison; celle-ci est donc conservée.
- issue: Catégories anthropologiques
  choice: Opposer « psychique » à « spirituelle »
  alternative: Rendre « soulish » par « doté d’une âme »
  rationale: La terminologie catégorielle du traité doit rester perceptible sans être harmonisée avec une anthropologie confessionnelle ultérieure.
- issue: Changement des pronoms dans la parole d’Adam
  choice: Conserver le passage de « tu » à « elle »
  alternative: Harmoniser toute la déclaration à la deuxième personne
  rationale: Cette discordance peut refléter une difficulté textuelle ou une distinction interne; la corriger silencieusement supprimerait une ambiguïté réelle.
- issue: Jugement auto-infligé des autorités
  choice: « Elles attirèrent ainsi le jugement sur elles-mêmes »
  alternative: « Elles se condamnèrent »
  rationale: La formulation retenue garde l’idée d’une conséquence judiciaire sans préciser indûment qui prononce ou exécute le jugement.
translation_notes:
  register: Français international moderne, courant mais dignifié. La syntaxe a été légèrement fluidifiée sans effacer les répétitions intentionnelles ni les aspérités du témoin. Les crochets carrés, les crochets vides et les crochets obliques sont conservés comme signaux textuels. Comme la révision directe du copte reste en attente, ce projet demeure explicitement fondé sur le témoin anglais public fourni; les formulations les plus incertaines sont donc rendues avec retenue et, lorsque nécessaire, accompagnées d’une note.
