  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: fr
  text: 'Les archontes allèrent à sa rencontre, projetant de la tromper. Leur chef lui dit : « Ta mère, Ève, est venue vers nous. » Mais Noréa se tourna vers eux et dit : « Vous êtes les archontes des ténèbres. Maudits soyez-vous ! Vous n’avez pas connu ma mère ; c’est plutôt votre propre partenaire féminine que vous avez connue. Car je ne suis pas votre descendante : je viens du monde d’en haut. »


    Dans sa puissance, l’archonte arrogant se retourna, et son visage devint semblable à un [brasier en flammes].[a] Il se montra insolent envers elle et [dit] : « Tu dois nous rendre des services sexuels, comme l’a fait ta mère Ève, car […] m’a été confié. »[b]


    Mais Noréa, dans la puissance de [Dieu],[c] se retourna et cria d’une voix forte vers le Saint, le Dieu du Tout : « Délivre-moi des archontes de l’injustice et sauve-moi immédiatement de leurs mains ! »


    Un ange descendit du ciel et lui dit : « Pourquoi invoques-tu Dieu ? Pourquoi te montres-tu si hardie envers l’Esprit saint ? »[d]


    Noréa demanda : « Qui es-tu ? »


    Pendant ce temps, les archontes de l’injustice s’étaient retirés loin d’elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « brasier en flammes » traduit une restitution signalée par les crochets dans le témoin disponible.
    reason: Préserver explicitement le statut reconstruit du terme.
  - marker: b
    text: Le texte est lacunaire après « car » ; les mots manquants empêchent de savoir précisément ce qui aurait été confié à l’archonte.
    reason: La lacune touche directement le sens et ne doit pas être comblée conjecturalement.
  - marker: c
    text: Le mot « Dieu » est une restitution dans le témoin utilisé.
    reason: Signaler l’incertitude matérielle du texte.
  - marker: d
    text: 'La question peut aussi se comprendre : « Pourquoi prends-tu tant de liberté envers l’Esprit saint ? » Le ton exact demeure difficile à déterminer.'
    reason: Préserver l’ambiguïté de la formule rendue en anglais par « presumptuous ».
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Conserve le terme technique traditionnel de cette littérature plutôt que de le réduire à « dirigeants » ou « puissances ».
- source_word: female counterpart
  choice: partenaire féminine
  rationale: Rend la relation de correspondance indiquée par le témoin sans préciser indûment s’il s’agit d’une épouse, d’une compagne ou d’une émanation.
- source_word: offspring
  choice: descendante
  rationale: Expression naturelle en français qui conserve l’idée de filiation revendiquée ou niée.
- source_word: world above
  choice: monde d’en haut
  rationale: Formulation claire qui préserve la cosmologie verticale du passage.
- source_word: God of the All
  choice: Dieu du Tout
  rationale: Conserve le titre cosmologique distinctif et son possible sens technique, plutôt que de paraphraser par « Dieu de tous ».
- source_word: holy Spirit
  choice: Esprit saint
  rationale: Rend littéralement le titre tout en évitant d’imposer par la typographie seule une identification doctrinale plus précise que le témoin.
theological_decisions:
- issue: Nature des archontes
  choice: Maintenir « archontes » sans explication intégrée au texte
  alternative: Traduire par « dirigeants », « puissances » ou « autorités »
  rationale: Le mot fonctionne ici comme un titre cosmologique technique ; une équivalence ordinaire effacerait cette dimension.
- issue: Identité de la partenaire féminine des archontes
  choice: Ne pas l’identifier à Ève
  alternative: Reformuler de manière à présenter Ève elle-même comme leur partenaire
  rationale: La réplique de Noréa oppose explicitement sa mère à leur propre contrepartie féminine ; l’ambiguïté sur l’identité de cette dernière doit demeurer.
- issue: Parole de l’ange au sujet de l’Esprit saint
  choice: Conserver la question surprenante et son accusation de hardiesse
  alternative: L’adoucir en approbation ou corriger sa logique apparente
  rationale: Le passage présente une tension narrative et théologique réelle qu’il ne faut pas résoudre silencieusement.
- issue: Puissance divine dans laquelle agit Noréa
  choice: Conserver [Dieu] entre crochets
  alternative: Intégrer « Dieu » sans marque ou choisir une autre restauration
  rationale: Les crochets signalent que le mot dépend d’une restauration ou d’un texte matériellement incertain.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions, les titres cosmologiques et les tensions du récit sont conservés. Les crochets et l’ellipse signalent les restaurations et lacunes du témoin. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe du copte reste nécessaire.
