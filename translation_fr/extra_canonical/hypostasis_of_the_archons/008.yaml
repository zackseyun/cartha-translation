source:
  text: 'The archons went to meet her, scheming to fool her. Their leader said to her, “Your mother, Eve, approached us,” but Norea turned to them, and said: “You are the archons of the darkness; cursed be you! You did not know my mother, but you instead knew your own female counterpart, because I am not your offspring; I come from the world above.”


    In his might, the haughty archon turned, and his expression became as a flaming [inferno]. He was presumptuous toward her, and [said]: “You must render us sexual services, as did your mother Eve, because [. . .] has been delegated to me.”


    Norea, however, in the power of [God] turned and cried with a loud voice to the Holy One, the God of the All: [] “Rescue me from archons of injustice and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her: “Why do you invoke God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked: “Who are you?”


    (Meanwhile), the archons of injustice had withdrawn from her.'
