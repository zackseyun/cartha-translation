    reason: Le marqueur vide [] du témoin source doit être signalé en français sans faire croire qu’il s’agit d’un ajout restitué.
lexical_decisions:
- source_word: indestructability
  choice: l’Incorruptibilité
  rationale: Terme abstrait personnifié dans le récit; « incorruptibilité » convient au registre cosmologique et rend mieux l’idée d’un domaine ou principe impérissable que le calque moins naturel « indestructibilité ».
- source_word: the All
  choice: le Tout
  rationale: Conserve le terme cosmologique englobant et sa majuscule, sans le réduire à « tous » ni l’identifier explicitement à Dieu.
- source_word: authorities
  choice: les autorités
  rationale: Rend littéralement le titre des puissances cosmiques sans importer le terme interprétatif « archontes » dans le corps du texte.
- source_word: aeons
  choice: éons
  rationale: Maintient le terme technique de la cosmologie du traité; « siècles » serait trompeur ici.
- source_word: soulish
  choice: ce qui relève seulement de l’âme
  rationale: Exprime l’opposition anthropologique entre le psychique et le spirituel dans un français compréhensible, tout en conservant la restriction « seulement ».
- source_word: hold onto
  choice: saisir
  rationale: Préserve l’ambivalence entre prendre possession, retenir et appréhender, et fonctionne dans les deux occurrences parallèles.
- source_word: offspring
  choice: descendants
  rationale: Terme naturel et suffisamment large pour désigner les êtres issus du chef sans préciser indûment leur mode de génération.
- source_word: Pistis Sophia
  choice: Pistis Sophia
  rationale: Conserve le nom ou titre traditionnel sans le traduire par « Foi-Sagesse », ce qui résoudrait prématurément son statut.
theological_decisions:
- issue: La déclaration exclusive du chef aveugle
  choice: « Je suis Dieu ; il n’y en a pas d’autre [que moi]. »
  alternative: « Je suis un dieu ; il n’existe personne hormis moi. »
  rationale: La formulation garde la force de la prétention absolue et les crochets du témoin, sans harmonisation avec une formule biblique particulière.
- issue: Personnification de l’Incorruptibilité
  choice: Nom féminin avec majuscule et pronoms féminins
  alternative: Nom commun neutre ou paraphrase par « le monde incorruptible »
  rationale: Le passage agit comme si l’Incorruptibilité regardait et produisait une image; la personnification et le genre grammatical français sont donc maintenus sans définir davantage son identité.
- issue: Rapport entre visible et invisible
  choice: « ce qui est visible a eu son origine dans ce qui est invisible »
  alternative: « les réalités visibles furent créées d’après les invisibles »
  rationale: Conserve l’affirmation d’origine et de correspondance sans introduire explicitement une création ni préciser son mécanisme.
- issue: Union finale à la lumière
  choice: « qu’elle puisse les unir tous à la lumière »
  alternative: « qu’elle les rassemble tous avec la lumière »
  rationale: « Unir à » rend le mouvement relationnel du texte, tout en laissant ouverte la nature exacte de cette union.
- issue: Sujet de la descente vers le Chaos
  choice: « Il déversa sa puissance […] et le suivit dans sa descente »
  alternative: « Il chassa sa puissance […] et elle descendit »
  rationale: Le témoin anglais est syntaxiquement difficile; la traduction conserve autant que possible son enchaînement et l’antécédent masculin « le blasphème », sans reconstruire silencieusement une cosmologie plus précise.
translation_notes:
  register: Français international moderne, digne et lisible. Les termes cosmologiques techniques (« le Tout », « éons », « Pistis Sophia ») sont conservés. Les crochets signalant les restitutions du témoin sont maintenus dans le corps du texte; la lacune vide est représentée par l’appel de note [a]. Traduction provisoire fondée sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.
