translation:
  language: fr
  text: 'Leur chef est aveugle. [À cause de sa] puissance, de son ignorance et de son orgueil, il déclara dans sa [puissance] : « Je suis Dieu ; il n’y en a pas d’autre [que moi]. »


    En prononçant ces paroles, il pécha contre [le Tout]. Cette vantardise monta jusqu’à l’Incorruptibilité, [a] et une voix venue de l’Incorruptibilité lui répondit : « Tu es dans l’erreur, Samael » — ce qui signifie « dieu aveugle » —, car ses pensées étaient aveugles. Il déversa sa puissance, c’est-à-dire le blasphème qu’il avait proféré, et le suivit dans sa descente jusqu’au Chaos et jusqu’à sa mère, l’Abîme, sous l’impulsion de Pistis Sophia. Elle établit chacun de ses descendants selon la puissance qui lui était propre, à la ressemblance des éons éternels d’en haut, car ce qui est visible a eu son origine dans ce qui est invisible.


    L’Incorruptibilité regarda en bas, vers le lieu des eaux. Son image apparut comme un reflet sur les eaux, et les autorités des ténèbres s’éprirent d’elle. Elles ne purent cependant pas saisir l’image qui leur était apparue sur les eaux, car elles étaient faibles. En effet, ce qui relève seulement de l’âme ne peut saisir ce qui est spirituel, puisque les autorités avaient leur origine en bas, tandis que l’image de l’Incorruptibilité avait son origine en haut.


    C’est pourquoi l’Incorruptibilité regarda en bas, vers ce lieu, afin que, par la volonté du Père, elle puisse les unir tous à la lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
