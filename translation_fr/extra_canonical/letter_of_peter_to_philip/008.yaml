review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour mieux conserver les crochets du témoin et éviter d’ajouter une précision temporelle (« Plus tard ») que le témoin-source ne porte pas explicitement. Le rendu de « quatre missions » demeure une résolution contextuelle de la leçon obscure « en quatre messages » et doit donc rester signalé en note.
  naturalness: Le français est globalement naturel, moderne et d’un registre approprié. « En partant » rend plus directement la valeur de « As you go / When you leave » que « Lorsque vous partirez ».
  terminology: '« auteur de notre repos », « un Esprit saint », « prodiges » et « se rendit visible » sont retenus : ils respectent le registre et évitent une harmonisation doctrinale. « Missions de prédication » est acceptable seulement avec une note explicitant l’incertitude textuelle.'
  issues:
  - severity: low
    issue: Crochets déplacés dans la première phrase
    rationale: Le témoin porte séparément « Peter [then] assembled [the others] ». « Pierre [alors] rassembla [les autres] » conserve plus exactement l’étendue des restitutions.
  - severity: low
    issue: Ajout de « Plus tard »
    rationale: Le témoin-source dit simplement que les apôtres se rassemblèrent ensuite; « plus tard » introduit une précision chronologique non attestée.
  - severity: low
    issue: « Lorsque vous partirez »
    rationale: « En partant » est plus idiomatique et correspond mieux à l’injonction liée au départ dans le témoin anglais.
  - severity: medium
    issue: Résolution de l’expression obscure « into four messages »
    rationale: Le français principal ne peut présenter « quatre missions » comme une donnée certaine. La note doit préciser qu’il s’agit d’une interprétation contextuelle et que le texte transmis est obscur.
