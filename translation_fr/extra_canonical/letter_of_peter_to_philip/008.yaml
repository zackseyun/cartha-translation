base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: fr
  text: 'Pierre rassembla [alors les autres] et dit : « Notre Seigneur Jésus-Christ, auteur de notre repos, donne-nous un esprit d’intelligence, afin que nous aussi, nous puissions accomplir des prodiges ! »


    Pierre et les autres apôtres le virent alors. Ils furent remplis d’un Esprit saint, et chacun d’eux accomplit des guérisons. Ils partirent proclamer le Seigneur Jésus. Plus tard, ils se rassemblèrent de nouveau, se saluèrent les uns les autres et dirent : « Amen. »


    Jésus se rendit alors visible et leur dit : « Que la paix soit avec vous [tous], ainsi qu’avec tous ceux qui sont fidèles en mon nom. Lorsque vous partirez, la joie, la grâce et la puissance seront à vous. N’ayez pas peur. Voici, je serai toujours avec vous. »


    Les apôtres se séparèrent alors pour aller prêcher selon quatre missions[a], et ils partirent en paix, avec la puissance de Jésus.


    La Lettre de Pierre à Philippe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte transmis est obscur : littéralement, « en quatre messages »; il pourrait être question de quatre missions, directions ou groupes de prédication.'
    reason: Signaler une difficulté textuelle réelle que la formulation française doit rendre lisible sans la dissimuler.
lexical_decisions:
- source_word: author of our repose/rest
  choice: auteur de notre repos
  rationale: « Repos » conserve la portée spirituelle et eschatologique possible du terme sans la réduire au simple soulagement.
- source_word: spirit of insight/understanding
  choice: esprit d’intelligence
  rationale: Formulation naturelle et digne qui exprime la faculté de comprendre sans imposer une interprétation technique.
- source_word: miracles/wonders
  choice: prodiges
  rationale: « Prodiges » convient au registre religieux ancien et évite de confondre ces actes avec les guérisons mentionnées ensuite.
- source_word: became visible
  choice: se rendit visible
  rationale: Cette tournure respecte l’idée d’une manifestation sans préciser indûment s’il s’agit d’une apparition ou d’un retour corporel ordinaire.
- source_word: holy Spirit
  choice: un Esprit saint
  rationale: L’article indéfini et la minuscule à « saint » préservent la formulation du témoin, sans harmonisation doctrinale automatique avec l’usage canonique « le Saint-Esprit ».
- source_word: into four messages
  choice: selon quatre missions
  rationale: Le contexte exige un départ pour prêcher, mais la formulation transmise est obscure; « missions » donne un français lisible tout en signalant l’incertitude en note.
theological_decisions:
- issue: Nature de l’Esprit saint
  choice: « un Esprit saint »
  alternative: « le Saint-Esprit »
  rationale: Le témoin porte une expression indéfinie. La traduction ne l’identifie pas silencieusement à une formulation trinitaire normalisée.
- issue: Mode de manifestation de Jésus
  choice: « se rendit visible »
  alternative: « apparut »
  rationale: Le choix conserve la nuance du verbe du témoin et ne tranche pas la nature de la manifestation.
- issue: Promesse de présence continuelle
  choice: « je serai toujours avec vous »
  alternative: « je serai continuellement avec vous »
  rationale: La formulation française naturelle garde la force temporelle de la promesse sans ajouter d’explication christologique.
translation_notes:
  register: Français international moderne, simple et digne. Les crochets du texte principal signalent les restitutions incertaines conservées dans le témoin fourni. Projet provisoire établi à partir du témoin anglais public fourni; la vérification directe du copte des codices de Nag Hammadi et Tchacos reste à effectuer.
