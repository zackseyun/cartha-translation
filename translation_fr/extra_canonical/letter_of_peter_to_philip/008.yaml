    Jésus se rendit alors visible et leur dit : « Que la paix soit avec vous [tous], ainsi qu’avec tous ceux qui sont fidèles en mon nom. En partant, la joie, la grâce et la puissance seront à vous. N’ayez pas peur. Voici, je serai toujours avec vous. »


    Les apôtres se séparèrent alors pour leurs quatre missions de prédication[a], et ils partirent en paix, avec la puissance de Jésus.


