lexical_decisions:
- source_word: deficiency
  choice: déficience
  rationale: Conserve le terme cosmologique abstrait et sa répétition structurante, sans le réduire à une simple faute morale ni à un manque matériel.
- source_word: aeons
  choice: éons
  rationale: Maintient le terme technique de la cosmologie du texte, plutôt que de l’aplatir en « siècles » ou « mondes ».
- source_word: the Mother
  choice: la Mère
  rationale: La majuscule signale une figure cosmologique déterminée sans ajouter d’identification doctrinale absente du passage.
- source_word: the Greatness of the Father
  choice: la Grandeur du Père
  rationale: Rend littéralement le titre ou attribut élevé tout en conservant ses majuscules et son caractère énigmatique.
- source_word: the tyrannical one
  choice: le Tyran
  rationale: Formulation française naturelle qui conserve la valeur de désignation personnelle du participe substantivé ; la majuscule indique qu’il fonctionne ici comme un titre.
- source_word: powers and authorities
  choice: des puissances et des autorités
  rationale: Préserve les deux catégories distinctes du vocabulaire cosmologique sans les harmoniser.
- source_word: cosmic power
  choice: puissance cosmique
  rationale: Rend explicitement la portée cosmique du syntagme sans identifier ces puissances à une hiérarchie doctrinale précise.
- source_word: mind
  choice: esprit
  rationale: Dans ce contexte, « esprit » exprime naturellement la faculté intérieure qui s’enorgueillit ; « intelligence » resterait possible après examen du copte.
- source_word: disparity of the likeness
  choice: une dissemblance de l’image
  rationale: 'Conserve l’étrangeté et la tension du texte : les corps procèdent d’un écart par rapport à l’image, sans expliquer davantage la relation.'
theological_decisions:
- issue: Nature de la faute de la Mère
  choice: « défiance et irréflexion »
  alternative: « désobéissance et imprudence »
  rationale: La formulation retenue évite de transformer une expression cosmologique ambiguë en catégories morales ou confessionnelles trop déterminées.
- issue: Rapport du Tyran à la parole de la Mère
  choice: « le Tyran la suivit »
  alternative: « le Tyran s’ensuivit »
  rationale: Le pronom conserve l’ambiguïté possible entre le fait de suivre la Mère et celui de survenir à la suite de sa parole, plutôt que de trancher explicitement.
- issue: Objet du culte des puissances
  choice: « [Au contraire, ce] Tyran reçut le pouvoir, et elles l’adorèrent »
  alternative: « [Mais celui-ci] reçut l’autorité… »
  rationale: Préserve la restauration et l’opposition du témoin, sans identifier le Tyran à une figure théologique nommée.
- issue: Formation des corps mortels
  choice: « à partir d’une dissemblance de l’image »
  alternative: « en raison d’une différence dans la ressemblance »
  rationale: La formulation maintient l’énoncé paradoxal au lieu de reconstruire une théorie précise de la création ou de l’image.
translation_notes:
  register: Français international moderne, soutenu mais lisible. Les répétitions (« déficience », « puissances », « image », « forme ») sont maintenues parce qu’elles structurent l’argument. Les crochets de restauration et les crochets vides sont conservés. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni ; une vérification directe du copte des Codex de Nag Hammadi VIII,2 et Tchacos est encore nécessaire.
