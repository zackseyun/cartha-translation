translation:
  language: fr
  text: '« Maintenant donc, au sujet de [la déficience] des éons[a], voici en quoi consiste cette déficience : lorsque la défiance et l’irréflexion de la Mère se manifestèrent, en dehors de l’ordre de la Grandeur du Père, elle voulut établir des éons. Quand elle parla, le Tyran la suivit ; mais lorsqu’elle délaissa une part, le Tyran s’en empara, et cette part devint une déficience. Telle est la déficience des éons.


    « Après s’être emparé d’une part, le Tyran la planta, plaça au-dessus d’elle des puissances et des autorités, et l’enferma à l’intérieur des éons mortels. Toutes les puissances cosmiques se réjouirent d’avoir été produites. [][b] Cependant, elles ignoraient le [Père] préexistant, puisqu’elles lui étaient étrangères. [Au contraire, ce] Tyran reçut le pouvoir, et elles l’adorèrent et le louèrent.


    « Alors l’esprit du Tyran s’enorgueillit à cause des louanges des puissances. Il devint un adversaire et voulut remplacer une image [par une autre image], et une forme par une autre forme. Puis il chargea les puissances placées sous son autorité de façonner des corps mortels ; ceux-ci vinrent à l’existence à partir d’une dissemblance de l’image qui avait été produite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les crochets à l’intérieur du passage signalent des mots restitués dans un texte lacunaire ou endommagé. « Éons » est ici un terme cosmologique désignant des réalités ou domaines suprahumains.
