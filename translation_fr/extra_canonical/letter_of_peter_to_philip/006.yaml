translation:
  language: fr
  text: '« Cependant, quant à votre détention, elle vient de ce que vous m’appartenez. Lorsque vous vous serez dépouillés de ce qui est périssable, alors vous deviendrez des lumières parmi les mortels.


    « Quant à votre combat contre les puissances, il vient de ce qu’elles sont privées de repos, contrairement à vous, puisqu’elles ne veulent pas que vous soyez sauvés. »


    Alors, une fois encore, les apôtres se prosternèrent et dirent : « Seigneur, enseigne-nous : comment combattrons-nous les archontes[a], puisqu’ils sont plus puissants que nous ? »


    Une voix leur cria alors depuis l’apparition : « Voici comment vous devez les combattre, car les archontes combattent l’être humain intérieur[b]. Voici comment vous devez les combattre :


    « Rassemblez-vous et enseignez au monde le salut accompagné d’une promesse. Revêtez-vous de la puissance de mon Père, faites connaître votre demande, et lui, le Père, vous portera secours, comme il vous a secourus lorsqu’il m’a envoyé. [c] [N’ayez] pas peur, [je serai constamment avec vous], comme je vous l’ai dit autrefois, lorsque j’habitais dans le corps. »


    Alors des éclairs et le tonnerre vinrent du ciel, et celui qu’ils avaient vu là, dans l’apparition, fut emporté au ciel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « archontes » sont ici des puissances dirigeantes suprahumaines, hostiles au salut.
    reason: Le terme translittéré peut être inconnu du lectorat moderne et ne doit pas être confondu avec de simples autorités humaines.
  - marker: b
    text: 'Littéralement, selon le témoin anglais disponible : « l’Homme intérieur ». L’expression peut désigner la dimension intérieure ou spirituelle de la personne; le texte ne l’explicite pas.'
    reason: Préserve l’ambiguïté anthropologique et théologique de l’expression.
  - marker: c
    text: Le témoin présente ici des crochets vides, signalant vraisemblablement une lacune ou un passage illisible. Les mots placés ensuite entre crochets sont des restitutions éditoriales.
    reason: Rend visibles les dommages ou incertitudes du manuscrit signalés par le témoin.
lexical_decisions:
- source_word: detention
  choice: détention
  rationale: Conserve le sens concret et l’ambiguïté du témoin anglais, sans préciser arbitrairement s’il s’agit d’un emprisonnement, d’une rétention ou d’une condition spirituelle.
- source_word: what is destructible
  choice: ce qui est périssable
  rationale: Formulation française naturelle qui maintient l’opposition implicite entre le corruptible et la lumière sans identifier explicitement le corps.
- source_word: powers
  choice: puissances
  rationale: Terme traditionnel et compréhensible pour des puissances suprahumaines; il reste distinct d’« archontes » dans le passage.
- source_word: archons
  choice: archontes
  rationale: Translittération conservée, car le terme désigne ici une catégorie cosmologique particulière que « dirigeants » rendrait trop ordinaire.
- source_word: Inner Man
  choice: l’être humain intérieur
  rationale: Évite le masculin générique moderne tout en conservant la notion anthropologique spécifique; la majuscule anglaise ne suffit pas à imposer une personnification en français.
- source_word: gird yourselves
  choice: revêtez-vous
  rationale: Rend idiomatiquement l’idée de s’équiper ou de se ceindre d’une puissance, sans produire une image vestimentaire maladroite.
- source_word: apparition
  choice: apparition
  rationale: Conserve le caractère visionnaire du phénomène sans le réduire à une simple vision subjective.
- source_word: snatched to heaven
  choice: fut emporté au ciel
  rationale: Préserve le mouvement soudain vers le ciel dans une formulation française naturelle.
theological_decisions:
- issue: Cause du combat mené par les puissances
  choice: « il vient de ce qu’elles sont privées de repos »
  alternative: « il vient de leur agitation »
  rationale: La formulation retenue préserve le motif théologique du « repos » et le contraste explicite avec les destinataires.
- issue: Objet du combat des archontes
  choice: « l’être humain intérieur »
  alternative: « l’Homme intérieur »
  rationale: La traduction reste inclusive et intelligible sans décider si l’expression désigne une entité hypostasiée, l’âme ou la dimension spirituelle de la personne.
- issue: Salut et promesse
  choice: « enseignez au monde le salut accompagné d’une promesse »
  alternative: « enseignez au monde le salut de la promesse »
  rationale: Suit la relation syntaxique du témoin disponible sans déterminer le contenu ou le statut exact de la promesse.
- issue: Parole restaurée concernant la présence continuelle
  choice: conserver les crochets
  alternative: intégrer la phrase sans signalement
  rationale: Les crochets indiquent une restauration éditoriale ou une lacune manuscrite; les supprimer donnerait à tort l’impression d’un texte intégralement attesté.
translation_notes:
  register: 'Français international moderne, digne et oralement fluide. Le draft demeure provisoire : il repose sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente. Les répétitions rhétoriques ont été conservées, ainsi que les marques de lacune et de restitution.'
