base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: fr
  text: '« Maintenant, au sujet de la plénitude : c’est moi, [oui] moi, qui ai été envoyé dans le corps à cause de cette descendance qui s’était perdue, et je suis descendu dans leur forme mortelle. Mais eux ne m’ont pas reconnu, car ils pensaient que j’étais un être humain mortel. J’ai parlé avec celui qui est à moi, et il m’a prêté attention, tout comme vous aussi, vous m’avez prêté attention aujourd’hui. Je lui ai donné autorité pour entrer dans l’héritage de sa paternité, et je l’ai pris [a] […] rempli […] au moyen de son salut. Puisqu’il était déficience, il est devenu plénitude. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte est lacunaire à cet endroit; la suite syntaxique et le contenu exact ne peuvent pas être établis avec certitude à partir du témoin fourni.
    reason: Le témoin anglais comporte des crochets vides et des ellipses signalant une perte ou une restitution incertaine du manuscrit.
lexical_decisions:
- source_word: fullness
  choice: plénitude
  rationale: Conserve le terme conceptuel récurrent et son opposition finale à « déficience », sans en préciser prématurément le sens théologique.
- source_word: seed
  choice: descendance
  rationale: Rend ici le sens collectif probable de « seed » plus naturellement que « semence », tout en préservant l’idée de lignée ou de groupe issu d’une origine.
- source_word: mortal mold
  choice: forme mortelle
  rationale: Maintient l’image d’une condition ou configuration corporelle mortelle sans introduire l’idée plus précise, mais non assurée, de création ou de chair.
- source_word: failed to notice me
  choice: ne m’ont pas reconnu
  rationale: Exprime naturellement l’absence de perception de l’identité véritable, explicitée par le fait qu’ils le prenaient pour un mortel.
- source_word: the one who is mine
  choice: celui qui est à moi
  rationale: Préserve le lien d’appartenance volontairement indéterminé du témoin anglais.
- source_word: fatherhood
  choice: paternité
  rationale: Conserve le substantif abstrait inhabituel plutôt que de l’assimiler sans preuve à « Père » ou à « patrimoine paternel ».
- source_word: deficiency
  choice: déficience
  rationale: Préserve l’opposition technique et théologique avec « plénitude » sans la réduire à un simple manque circonstanciel.
theological_decisions:
- issue: Identité de la « descendance » perdue
  choice: Ne pas l’identifier explicitement
  alternative: La définir comme humanité, élus ou semence spirituelle
  rationale: Le passage fourni ne tranche pas cette identité; une précision importerait une lecture doctrinale.
- issue: Sens de « l’héritage de sa paternité »
  choice: Conserver la formulation abstraite
  alternative: « l’héritage de son Père » ou « son héritage paternel »
  rationale: Ces alternatives résolvent différemment une expression énigmatique; la traduction garde donc sa tension.
- issue: Rapport entre salut, déficience et plénitude
  choice: Maintenir la formulation causale et la transformation
  alternative: Expliquer le salut comme réintégration gnostique ou rédemption au sens confessionnel
  rationale: Le texte affirme un passage de la déficience à la plénitude, mais n’en expose pas ici tout le mécanisme.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition emphatique « c’est moi, [oui] moi » et les termes conceptuels « plénitude », « déficience » et « paternité » sont conservés. Le draft reste provisoire, car il repose sur un témoin anglais du texte copte et la révision directe de la langue source est encore en attente.
