translation:
  language: fr
  text: 'Les apôtres rendirent alors grâce au Seigneur par toutes sortes de louanges, puis retournèrent à Jérusalem.


    Tandis qu’ils descendaient la montagne et suivaient le chemin qui mène à Jérusalem, ils s’entretenaient de la lumière qui était apparue. Une discussion s’engagea au sujet du Seigneur, et ils dirent : « Si lui, notre Seigneur, a souffert, combien plus souffrirons-nous ? »


    Pierre répondit : « Il a souffert pour nous, et nous aussi, nous devrons souffrir, parce que nous sommes petits. »


    Alors une voix leur parvint et dit : « Je vous ai annoncé bien des fois que vous devrez souffrir. On vous traînera dans les synagogues et devant les gouverneurs, et cela vous fera souffrir. Mais celui qui ne souffrira pas, lui non plus, [ne] […] [mon] Père […] afin qu’il puisse […]. »[a]


    Les apôtres, cependant, étaient remplis de joie. Ils montèrent à Jérusalem, se rendirent au temple et enseignèrent le salut au nom du Seigneur Jésus-Christ ; ils guérirent une multitude de personnes.


    Pierre prit alors la parole et dit à ses disciples : « Lorsque notre Seigneur Jésus demeurait dans le corps, il nous a tout dit, car il était lui-même descendu. Mes frères, écoutez attentivement ma voix. »


    Il fut rempli d’un Esprit saint et parla ainsi :


    « Notre lumière, Jésus, est [des]cendue,[b]

    a été crucifiée,

    a porté une couronne d’épines,

    s’est revêtue d’un manteau pourpre,

    a été suspendue à un bois,

    a été déposée dans un tombeau

    et s’est relevée d’entre les morts.


    « Mes frères, Jésus est étranger à une telle souffrance. Mais c’est nous qui avons souffert à cause de la transgression de la Mère.[c] Voilà pourquoi, lorsqu’il était parmi nous, il annonçait toutes choses sous forme de symboles. Le Seigneur Jésus, Fils de la gloire sans mesure du Père, est l’auteur de notre vie.


    « Mes frères, ne prêtons aucune attention à ces impies et ne marchons pas dans […] »[d]'
