lexical_decisions:
- source_word: thanked the Lord with all praises
  choice: rendirent grâce au Seigneur par toutes sortes de louanges
  rationale: Formulation française naturelle qui conserve à la fois l’action de grâce et la pluralité emphatique des louanges.
- source_word: on account of our being small
  choice: parce que nous sommes petits
  rationale: Maintient l’expression inhabituelle et potentiellement technique « petits » sans la résoudre en « faibles » ou « inférieurs ».
- source_word: dragged to synagogues and in front of governors
  choice: traînera dans les synagogues et devant les gouverneurs
  rationale: Conserve la violence du verbe et les deux lieux ou instances de comparution.
- source_word: dwelt in the body
  choice: demeurait dans le corps
  rationale: Rendu formel qui préserve la distinction anthropologique du témoin sans l’interpréter.
- source_word: a holy Spirit
  choice: un Esprit saint
  rationale: L’article indéfini du témoin est conservé, tandis que la majuscule reflète le langage religieux sans imposer une identification dogmatique explicite.
- source_word: hanged on a tree
  choice: suspendue à un bois
  rationale: « Bois » conserve la polysémie traditionnelle de l’instrument, sans normaliser automatiquement en « croix ».
- source_word: alien to such suffering
  choice: étranger à une telle souffrance
  rationale: Préserve l’affirmation théologiquement tendue au lieu de l’atténuer par « au-dessus de » ou « exempt de ».
- source_word: trespass of the Mother
  choice: transgression de la Mère
  rationale: Rendu littéral qui conserve la figure énigmatique de la « Mère » et évite une identification interprétative.
- source_word: author of our life
  choice: l’auteur de notre vie
  rationale: Conserve la métaphore causale du témoin et son ambiguïté entre origine, fondateur et agent.
- source_word: Godless ones
  choice: impies
  rationale: Terme français courant et digne désignant ceux qui sont sans respect pour Dieu, sans lourdeur littérale.
theological_decisions:
- issue: Rapport de Jésus à la souffrance
  choice: « Jésus est étranger à une telle souffrance »
  alternative: « Jésus n’est pas soumis à une telle souffrance »
  rationale: Le choix retenu garde la formulation paradoxale du témoin après le récit de la crucifixion, sans harmonisation doctrinale.
- issue: Nature symbolique des annonces de Jésus
  choice: « il annonçait toutes choses sous forme de symboles »
  alternative: « tout ce qu’il annonçait avait un sens symbolique »
  rationale: La formulation conserve l’étendue de « tout » et ne précise pas si les événements eux-mêmes ou seulement leur annonce sont symboliques.
- issue: Identité de la Mère
  choice: Maintien de « la Mère » avec majuscule
  alternative: Identifier la Mère à Ève, à une puissance cosmique ou à une autre figure
  rationale: Le passage ne fournit pas ici d’identification certaine ; toute précision importerait une interprétation extérieure.
- issue: Esprit saint
  choice: « un Esprit saint »
  alternative: « l’Esprit Saint »
  rationale: Le témoin fourni emploie l’indéfini ; le conserver évite de résoudre la syntaxe ou l’ontologie avant la révision directe du copte.
- issue: Genre grammatical dans l’hymne
  choice: Accord des participes et adjectifs avec « notre lumière »
  alternative: Accord au masculin avec « Jésus »
  rationale: En français, la structure appositive permet de faire de « notre lumière » le support grammatical de la série ; cet accord préserve la poésie, même si Jésus est le référent personnel.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions rhétoriques, le parallélisme de l’hymne et les tensions théologiques sont conservés. Les numéros de pages manuscrites isolés ont été omis. Le projet demeure provisoire, car il repose sur le témoin anglais public fourni et attend une révision directe du copte des codices de Nag Hammadi et Tchacos.
