base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: fr
  text: '[a] Lettre de Pierre, qu’il envoya à Philippe.


    Pierre, apôtre de Jésus-Christ, à Philippe, notre frère bien-aimé et notre compagnon d’apostolat, ainsi qu’aux frères qui sont avec toi. Salutations.


    Je désire que tu comprennes, notre frère, que nous avons reçu de notre Seigneur, le Sauveur du monde entier, des instructions nous demandant de nous réunir afin d’enseigner et de proclamer le salut qui nous a été promis par [b] notre Seigneur Jésus-Christ.


    Mais toi, tu t’es séparé de nous et tu n’as pas voulu te réunir avec nous pour apprendre comment nous pourrions nous organiser ensemble, afin d’annoncer le message.


    Ainsi donc, notre frère, accepterais-tu de venir conformément aux instructions de notre Dieu, Jésus ?[c]


    Après avoir reçu et lu cette lettre, Philippe se rendit auprès de Pierre, rempli de joie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du titre est lacunaire dans le manuscrit témoin.
    reason: Signaler la lacune indiquée par les crochets dans le texte source fourni.
  - marker: b
    text: Le manuscrit présente ici une lacune avant « notre Seigneur Jésus-Christ » ; la formulation exacte du passage demeure incertaine.
    reason: Préserver explicitement l’incertitude textuelle signalée dans le témoin.
  - marker: c
    text: La formulation « notre Dieu, Jésus » suit le témoin fourni ; sa construction exacte devra être vérifiée directement sur le copte.
    reason: Conserver une formulation théologiquement et syntaxiquement sensible tout en rappelant que la révision dans la langue source est encore en attente.
lexical_decisions:
- source_word: dispatched / sent
  choice: envoya
  rationale: Rend simplement l’envoi de la lettre dans un français naturel, sans préciser un mode de transmission absent du témoin.
- source_word: co-apostle
  choice: compagnon d’apostolat
  rationale: Expression idiomatique qui conserve l’idée d’une mission apostolique partagée sans créer le terme peu naturel « coapôtre ».
- source_word: directives
  choice: instructions
  rationale: Conserve l’idée de consignes reçues, avec un registre clair et digne.
- source_word: assemble together
  choice: nous réunir / te réunir avec nous
  rationale: Reproduit le motif insistant du rassemblement tout en évitant une redondance maladroite en français.
- source_word: coordinate ourselves
  choice: nous organiser ensemble
  rationale: Formulation française courante exprimant l’action concertée du groupe.
- source_word: message
  choice: message
  rationale: Ne précise pas « Évangile », puisque le témoin fourni emploie un terme plus général.
- source_word: delighting with glee
  choice: rempli de joie
  rationale: Rend l’intensité joyeuse de l’expression sans la lourdeur d’un doublet littéral.
theological_decisions:
- issue: Désignation de Jésus comme « notre Dieu »
  choice: notre Dieu, Jésus
  alternative: notre Dieu Jésus / Dieu, c’est-à-dire Jésus
  rationale: Préserve la formulation théologiquement marquée et sa tension syntaxique sans l’atténuer ni l’expliciter au-delà du témoin.
- issue: Portée du salut
  choice: le Sauveur du monde entier
  alternative: le Sauveur de tout le monde
  rationale: Maintient la portée universelle exprimée par le témoin, dans un registre plus digne.
- issue: Salut promis
  choice: le salut qui nous a été promis
  alternative: le salut promis pour nous
  rationale: Conserve le bénéficiaire collectif et le caractère promis du salut sans préciser qui en est l’auteur, puisque la lacune voisine rend le passage incertain.
translation_notes:
  register: Français international moderne, naturel et digne. Le texte reste provisoire, car il repose sur un témoin anglais du domaine public et non sur une vérification directe du copte. Les répétitions structurantes autour du rassemblement ont été conservées, tandis que les formulations anglaises peu idiomatiques ont été rendues avec fluidité.
