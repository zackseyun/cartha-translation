translation:
  language: fr
  text: 'Pierre rassembla alors les autres. Ils se rendirent à la montagne appelée mont des Oliviers, où autrefois ils se réunissaient avec le Christ bienheureux, lorsqu’il demeurait dans un corps.


    Quand les apôtres furent réunis, ils tombèrent à genoux et prièrent ainsi :


    « Père, Père, Père de la lumière,

    toi à qui appartiennent les êtres impérissables,

    écoute-nous,

    comme tu as pris plaisir en ton saint Fils, Jésus-Christ,

    car, à cause de nous, il est devenu une lumière [a] dans les ténèbres.

    En vérité, écoute-nous. »


    Puis ils prièrent de nouveau :


    « Fils de la vie, Fils de l’immortalité,

    toi qui demeures dans la lumière,

    Fils, Christ de l’immortalité,

    notre rédempteur,

    donne-nous de la force,

    car on nous traque pour nous tuer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte ici un crochet de restauration vide après « lumière », signe qu’une lacune ou une restitution non précisée se trouve dans le texte transmis.
    reason: Signaler honnêtement l’incertitude textuelle indiquée par le témoin sans inventer les mots manquants.
lexical_decisions:
- source_word: Olivet
  choice: mont des Oliviers
  rationale: Nom français courant et immédiatement reconnaissable pour le lieu traditionnellement appelé Olivet.
- source_word: blessed Christ
  choice: Christ bienheureux
  rationale: Conserve le caractère honorifique de « blessed » sans l’assimiler automatiquement à « béni », dont la nuance peut différer.
- source_word: indestructible ones
  choice: êtres impérissables
  rationale: Rend la désignation substantivée tout en évitant le peu naturel « les indestructibles »; « êtres » est explicité avec prudence puisque le référent exact reste incertain.
- source_word: deathlessness
  choice: immortalité
  rationale: Expression française naturelle pour l’état de celui qui ne meurt pas; elle préserve l’idée fondamentale sans employer le lourd « absence de mort ».
- source_word: redeemer
  choice: rédempteur
  rationale: Terme religieux établi qui conserve la portée sotériologique du titre.
- source_word: they are hunting for us
  choice: on nous traque
  rationale: Rend naturellement l’idée d’une poursuite hostile sans identifier des persécuteurs que le témoin ne nomme pas.
theological_decisions:
- issue: Le Christ « demeurait dans le corps »
  choice: lorsqu’il demeurait dans un corps
  alternative: lorsqu’il vivait dans la chair
  rationale: La formulation retenue conserve la distinction potentiellement significative entre le Christ et son habitation corporelle, sans la normaliser selon une christologie particulière.
- issue: « ceux qui appartiennent » au Père de la lumière
  choice: toi à qui appartiennent les êtres impérissables
  alternative: Père de la lumière, à qui appartiennent les impérissables
  rationale: Maintient la relation d’appartenance et l’identité indéterminée des « impérissables », sans les identifier aux anges, aux élus ou à une autre catégorie doctrinale.
- issue: Plaisir du Père en son Fils
  choice: comme tu as pris plaisir en ton saint Fils
  alternative: comme tu t’es complu en ton saint Fils
  rationale: La tournure conserve le lien comparatif ambigu de la prière et reste compréhensible en français moderne; elle n’explicite pas davantage la raison pour laquelle cette faveur soutient la demande.
- issue: Titre « Christ de l’immortalité »
  choice: Fils, Christ de l’immortalité
  alternative: Fils, Christ immortel
  rationale: La construction inhabituelle est conservée plutôt que transformée en simple adjectif, afin de ne pas effacer une possible valeur technique ou liturgique.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition poétique des prières est conservée. Le chiffre isolé « [1] » du témoin a été omis comme numéro de page intrusif. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni; la vérification directe du copte est encore en attente.
