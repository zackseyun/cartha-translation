translation:
  language: fr
  text: 'Alors, une lumière éclatante apparut, et la montagne resplendit à la vue de celui qui s’était manifesté. Une voix les appela et dit :


    « Prêtez attention à mes paroles, afin que je puisse vous parler.

    Pourquoi me cherchez-vous ?

    Je suis Jésus Christ, celui qui demeure sans cesse avec vous. »


    Les apôtres répondirent :


    « Seigneur, nous voudrions comprendre le manque des éons[a],

    ainsi que leur plénitude,

    et savoir comment nous sommes retenus dans ce lieu où nous demeurons.

    Comment sommes-nous arrivés ici ?

    Comment en partirons-nous ?

    […] [b] Comment obtenons-nous l’autorité de parler avec assurance ?

    Pourquoi les puissances nous combattent-elles ? »


    Alors, une voix les appela depuis la lumière et dit : « C’est vous qui témoignez que je vous ai dit toutes ces choses ; mais à cause de votre manque de foi[c], je vais les répéter. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « éons » peuvent désigner des réalités, des domaines ou des puissances appartenant à l’ordre cosmique. Le terme technique est conservé, car son sens précis demeure incertain ici.
    reason: Clarifier un terme cosmologique peu courant sans résoudre son ambiguïté.
  - marker: b
    text: Le témoin présente ici un signe de lacune ou de texte manquant.
    reason: Préserver explicitement le signal de dommage ou de restauration transmis par le témoin.
  - marker: c
    text: 'Ou : « votre incrédulité » ou « votre manque de fidélité ».'
    reason: Signaler l’étendue sémantique possible du terme rendu par « manque de foi ».
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Le terme technique est conservé par translittération afin de ne pas réduire les réalités cosmologiques visées à de simples « époques » ou « mondes ». Une note en précise le sens possible.
- source_word: fullness
  choice: plénitude
  rationale: « Plénitude » conserve le vocabulaire cosmologique et théologique du témoin sans l’identifier explicitement au terme technique « Plérôme », absent de la formulation fournie.
- source_word: dwelling-place
  choice: lieu où nous demeurons
  rationale: Cette expression française naturelle maintient l’idée d’un lieu de séjour sans préciser indûment s’il s’agit du monde matériel, du corps ou d’un domaine cosmique.
- source_word: boldness of speech
  choice: parler avec assurance
  rationale: La formulation exprime la liberté et la hardiesse de parole, tout en restant intelligible en français courant.
- source_word: powers
  choice: puissances
  rationale: Le terme préserve l’ambiguïté entre autorités spirituelles, puissances cosmiques et forces hostiles.
- source_word: unfaithfulness
  choice: manque de foi
  rationale: Ce choix rend le sens religieux probable tout en évitant le mot « infidélité », qui pourrait suggérer principalement une trahison relationnelle ou conjugale.
theological_decisions:
- issue: Nature des éons et de leur plénitude
  choice: Conserver « éons » et « plénitude » sans explication doctrinale dans le corps du texte.
  alternative: Interpréter comme des « âges », des « mondes » ou le « Plérôme » d’un système cosmologique précis.
  rationale: Le témoin fourni ne permet pas de trancher la nature exacte de ces réalités, et la traduction doit préserver la tension cosmologique.
- issue: Identité de la voix venant de la lumière
  choice: Ne pas ajouter explicitement « Jésus » comme sujet de la dernière parole.
  alternative: Écrire « Jésus les appela depuis la lumière ».
  rationale: Bien que le contexte associe la voix à Jésus Christ, le texte répète simplement « une voix » ; cette formulation est donc conservée.
- issue: Sens de la demeure qui retient les apôtres
  choice: Employer une expression spatialement neutre.
  alternative: Préciser « ce monde », « le corps » ou « la prison matérielle ».
  rationale: Toute précision imposerait une interprétation anthropologique ou cosmologique non explicitée dans le témoin.
- issue: Cause de la répétition de l’enseignement
  choice: Traduire « unfaithfulness » par « manque de foi ».
  alternative: « incrédulité », « infidélité » ou « manque de fidélité ».
  rationale: « Manque de foi » garde une certaine amplitude entre difficulté à croire et défaut de confiance, sans durcir le reproche en rejet complet.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions solennelles et les questions successives ont été maintenues. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni ; une vérification directe du copte des Codex VIII,2 de Nag Hammadi et Tchacos reste nécessaire.
