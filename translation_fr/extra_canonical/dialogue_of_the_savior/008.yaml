review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le témoin dit explicitement « hearts » au pluriel ; le projet français a « le cœur » au singulier. Le reste suit avec prudence le témoin anglais provisoire, notamment les crochets de restitution, « la parole », « la Majesté », « le corps du Père » et l''étrange pluriel « Sons of Man ».'
  naturalness: Le français est généralement naturel et conserve un registre sobre. « dans les cœurs de ceux qui parlent avec joie et vérité » est à la fois fidèle au pluriel et idiomatique. La formulation cosmologique volontairement énigmatique est conservée sans explication doctrinale ajoutée.
  terminology: « parole » plutôt que « Verbe », « Majesté », « première parole », « corps du Père » et « Fils de l’Homme » maintiennent les ambiguïtés et les aspérités du témoin. Les notes encadrent correctement les deux difficultés textuelles sans les résoudre théologiquement.
