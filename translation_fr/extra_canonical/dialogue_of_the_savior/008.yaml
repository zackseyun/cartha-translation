translation:
  language: fr
  text: 'Judas prit la parole et dit : « Dis-moi, Seigneur, comment la secousse d’un [tremblement de terre] fait-elle trembler la terre ? »


    Le Seigneur ramassa une pierre et la tint dans sa main. [Il lui dit : « Qu’est-ce que] je tiens dans ma main ? »[a]


    Il répondit : « [C’est] une pierre. »


    Il leur dit : « Ce qui soutient la [terre] est aussi ce qui soutient le ciel. Lorsqu’une parole sort de la Majesté, elle rencontre ce qui soutient le ciel et la terre. La terre ne bougera pas. Si elle bougeait, elle tomberait ; mais elle ne bouge pas, afin que la première parole n’échoue pas. La parole a établi le monde, elle y a vécu et en a respiré le parfum. À vous tous, Fils de l’Homme[b], je proclame tout ce qui est immuable, car vous venez de ce lieu. Vous vivez dans le cœur de ceux qui parlent avec joie et vérité. Si la parole sort du corps du Père parmi les humains et qu’ils ne l’accueillent pas, elle retournera à son lieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit est endommagé à cet endroit ; les mots entre crochets sont restitués d’après le contexte. La formulation exacte de la question demeure incertaine.
    reason: Signaler honnêtement la lacune textuelle sans reproduire l’imbrication confuse des crochets du témoin.
  - marker: b
    text: L’expression transmise est au pluriel et peut aussi se rendre « fils de l’homme » ou « êtres humains » ; son sens précis ici demeure incertain.
    reason: Préserver une expression inhabituelle et potentiellement chargée théologiquement sans la confondre avec le titre singulier traditionnel.
lexical_decisions:
- source_word: word
  choice: parole
  rationale: Conserve la portée ample du terme transmis par le témoin — parole prononcée, message ou réalité personnifiée — sans imposer « Verbe », qui résoudrait théologiquement l’ambiguïté.
- source_word: Majesty
  choice: Majesté
  rationale: Maintient le titre abstrait et élevé du témoin, avec une majuscule signalant son emploi comme désignation divine.
- source_word: supports
  choice: soutient
  rationale: Rend naturellement l’idée de porter ou maintenir en place, importante dans l’image cosmologique de la pierre.
- source_word: set up
  choice: a établi
  rationale: Exprime la mise en place et l’ordonnancement du monde sans préciser davantage le mode de création.
- source_word: smelled the fragrance thereof
  choice: en a respiré le parfum
  rationale: Préserve l’image sensorielle inhabituelle dans un français intelligible, sans la réduire à une interprétation symbolique.
- source_word: place
  choice: lieu
  rationale: Conserve la spatialité métaphysique et la répétition du passage sans identifier ce lieu à une réalité doctrinale particulière.
- source_word: accept
  choice: accueillent
  rationale: Rend ici une réception personnelle de la parole plus naturellement que le seul « accepter », tout en gardant la possibilité d’un refus.
theological_decisions:
- issue: Statut de « la parole »
  choice: Employer « la parole » avec une minuscule dans tout le passage.
  alternative: Employer « le Verbe » ou personnifier explicitement le terme.
  rationale: Le témoin permet une personnification, mais ne suffit pas à identifier sans équivoque cette parole au Logos d’une formulation doctrinale ultérieure.
- issue: « first word »
  choice: Traduire littéralement par « la première parole ».
  alternative: Interpréter comme « le commandement originel », « la parole première » ou une personne divine.
  rationale: La formulation demeure obscure ; la traduction conserve cette tension plutôt que d’en fixer le référent.
- issue: « Father’s body »
  choice: Conserver « le corps du Père ».
  alternative: Atténuer en « la présence du Père » ou expliquer comme une émanation.
  rationale: L’expression corporelle frappante appartient au témoin et ne doit pas être spiritualisée ni systématisée.
- issue: Destinataires appelés « Sons of Man »
  choice: Maintenir le pluriel « Fils de l’Homme » et signaler son ambiguïté.
  alternative: Normaliser en « êtres humains », « fils des hommes » ou au singulier christologique « Fils de l’homme ».
  rationale: Le pluriel et les majuscules du témoin sont théologiquement inhabituels ; les conserver évite une harmonisation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme dialogué reste simple, tandis que les images cosmologiques et les formulations énigmatiques sont conservées. Les numéros de pages manuscrites qui interrompaient le témoin ont été omis. Le travail demeure provisoire, car le dossier fourni indique qu’une vérification directe du copte est encore attendue.
