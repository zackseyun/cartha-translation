translation:
  language: fr
  text: '« Celui qui ne connaît [pas] l’œuvre de l’accomplissement ne connaît rien.


    « Celui qui ne se tient pas dans les ténèbres ne peut voir la lumière […] [a].


    « Celui qui ne [comprend] pas comment le feu est venu à l’existence brûlera en lui, sans en connaître l’origine.


    « Si quelqu’un ne comprend pas d’abord l’eau, il ne connaît rien, car à quoi lui sert-il d’y être baptisé ?


    « Celui qui ne comprend pas comment le vent qui souffle est venu à l’existence sera emporté avec lui.


    « Celui qui ne comprend pas comment le corps qu’il porte est venu à l’existence sera détruit avec lui.


    « Et comment celui qui ne connaît pas le Fils connaîtra-t-il le [Père] ?


    « Tout est caché à celui qui ne connaît pas la racine de toutes choses.


    « Celui qui ne connaît pas la racine de l’injustice n’y sera pas étranger.


    « Ceux qui ne comprennent pas comment ils sont venus ne comprendront pas comment ils repartiront.


    « Et il n’est pas étranger à ce monde, celui qui [s’élèvera lui-même] et, par conséquent, sera abaissé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit présente ici une lacune avant le mot « lumière »; son contenu ne peut pas être rétabli avec certitude.
    reason: Signaler de façon lisible la lacune indiquée par les crochets vides du témoin, sans inventer de texte.
lexical_decisions:
- source_word: deed of completeness
  choice: l’œuvre de l’accomplissement
  rationale: Conserve le caractère concret de « deed » et l’ambiguïté conceptuelle de « completeness », sans imposer « perfection » comme interprétation morale.
- source_word: knows / understands
  choice: connaît / comprend
  rationale: Maintient la distinction lexicale du témoin entre connaissance et compréhension lorsqu’elle apparaît.
- source_word: the body he wears
  choice: le corps qu’il porte
  rationale: Préserve la métaphore vestimentaire du corps sans l’expliquer doctrinalement.
- source_word: root of iniquity
  choice: racine de l’injustice
  rationale: « Injustice » rend le champ moral de l’iniquité dans un français actuel et digne, sans préciser davantage la nature du mal.
- source_word: will go
  choice: repartiront
  rationale: Rend le mouvement opposé à « sont venus » tout en laissant ouverte la destination ou la signification eschatologique.
theological_decisions:
- issue: Rapport entre connaissance, éléments naturels et baptême
  choice: Traduction littéraire sans explication sacramentelle ou cosmologique
  alternative: Interpréter l’eau comme symbole baptismal défini et le feu ou le vent comme réalités spirituelles précises
  rationale: Le passage associe ces réalités sans expliciter leur statut; la traduction conserve cette tension.
- issue: Corps porté comme un vêtement
  choice: Maintien de la métaphore « le corps qu’il porte »
  alternative: Reformuler en « son corps » ou expliciter une anthropologie dualiste
  rationale: La formulation peut suggérer une distinction entre la personne et son corps, mais le texte fourni ne justifie pas d’en fixer la doctrine.
- issue: S’élever puis être abaissé
  choice: Conserver le lien conséquentiel explicite du témoin
  alternative: Supprimer « par conséquent » ou transformer la phrase en maxime causale plus nette
  rationale: Le témoin marque cette relation tout en laissant obscure la logique exacte de l’appartenance au monde.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Les restaurations signalées dans le témoin sont conservées entre crochets. Le numéro de page manuscrit [15] est omis. Cette version demeure provisoire, car elle repose sur un témoin anglais du texte copte et la vérification directe de la langue source reste à faire.
