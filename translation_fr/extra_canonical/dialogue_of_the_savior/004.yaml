lexical_decisions:
- source_word: Savior
  choice: Sauveur
  rationale: Équivalent français courant et dignifié du titre transmis par le témoin anglais.
- source_word: maintain in order
  choice: maintenir en ordre
  rationale: Conserve la métaphore et son étrangeté sans préciser indûment s’il s’agit d’ordre moral, spirituel ou intérieur.
- source_word: work
  choice: œuvre
  rationale: Préserve l’amplitude du terme, qui peut viser l’action accomplie, son produit ou son effet durable.
- source_word: little ones
  choice: petits
  rationale: Rend littéralement l’expression sans décider s’il s’agit d’enfants, de disciples ou d’un groupe spirituel.
- source_word: mind
  choice: intelligence
  rationale: Terme français naturel pouvant désigner la faculté de comprendre; évite « esprit », déjà présent ailleurs et potentiellement équivoque.
- source_word: companions
  choice: compagnons
  rationale: Conserve la relation non précisée du témoin sans introduire « semblables » ou « frères ».
- source_word: accept
  choice: accueillir
  rationale: Dans ces contextes personnels et discursifs, « accueillir » est plus naturel que « accepter » tout en laissant ouverte la nature de la réception.
theological_decisions:
- issue: Référent des « âmes » et des « petits »
  choice: Maintenir les formulations distinctes et les accords féminins imposés par « âmes »
  alternative: Identifier explicitement les petits aux âmes ou à des enfants
  rationale: Le passage endommagé ne permet pas de fixer précisément leur relation.
- issue: Sens de l’ordre intérieur
  choice: Conserver « ce qui est en vous » et « maintenir en ordre »
  alternative: Paraphraser comme purification, maîtrise de soi ou harmonie spirituelle
  rationale: Une paraphrase résoudrait une tension théologique et anthropologique que le témoin laisse ouverte.
- issue: Relation entre l’intelligence, l’âme, le corps et la lumière
  choice: Préserver l’enchaînement et les restitutions entre crochets
  alternative: Harmoniser le passage en une doctrine explicite de l’illumination de l’âme
  rationale: Le texte est lacunaire et ne justifie pas une systématisation doctrinale.
- issue: La vérité qui « cherche »
  choice: Conserver la personnification
  alternative: Rendre « les sages et les justes cherchent la vérité »
  rationale: L’inversion serait théologiquement significative et contredirait le témoin fourni.
