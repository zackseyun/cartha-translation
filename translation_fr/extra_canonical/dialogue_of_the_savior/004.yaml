translation:
  language: fr
  text: 'Matthieu dit : « Comment […] ? »


    […] Le Sauveur dit : « [Si vous ne maintenez pas en ordre] ce qui est en vous, [votre œuvre] subsistera, mais [pas] vous. »


    Judas [dit] : « Seigneur, [je voudrais connaître toutes] les œuvres des âmes [qui appartiennent à] ces petits. Quand […], où demeureront-elles ? […] l’esprit […] ? »


    Le Seigneur [dit : « … accueillez]-les. Elles ne meurent ni ne sont détruites, parce qu’elles ont reconnu [leurs] compagnons et celui qui les accueillera, car la vérité cherche les sages et les justes. »


    Le Sauveur [dit] : « La lampe [du] corps, c’est l’intelligence. Tant que [ce qui est en] vous est maintenu en ordre, c’est-à-dire [l’âme], vos corps seront [illuminés]. Tant que vos cœurs sont obscurcis, la lumière que vous […] espérez [restera loin de vous]. Je vous ai appelés [auprès de moi], car je partirai bientôt, afin que [vous accueilliez] ma parole parmi [vous. Voici], je vous l’envoie. »[a]'
