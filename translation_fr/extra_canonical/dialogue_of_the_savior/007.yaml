translation:
  language: fr
  text: 'Marie demanda à ses frères : « Où garderez-vous [ces] questions que vous posez au Fils de [l’homme] ? »


    Le Seigneur lui [dit] : « Ma sœur, [personne] ne peut poser de questions sur ces choses, [sinon] celui qui possède dans son cœur un lieu où [] les garder. Une telle personne peut quitter [le monde], entrer dans le lieu [de la vie] et ne pas être retenue dans ce monde de pauvreté. »


    Matthieu dit : « Seigneur, je veux [contempler] ce lieu de vie, [où] il n’y a aucune injustice, mais seulement une [lumière] pure. »


    Le Seigneur répondit : « Frère Matthieu, tu ne peux pas le voir [tant que tu] portes la chair. »


    Matthieu dit : « Seigneur, [si je] ne peux pas le voir, permets-moi au moins de le connaître. »


    Le Seigneur dit : « Quiconque s’est connu lui-même l’a vu. Il accomplit tout ce qu’il lui est donné de faire. Ainsi, une telle personne en est venue, dans la bonté, à [être semblable à] ce lieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: store
  choice: garder / les garder
  rationale: « Garder » restitue naturellement l’idée de conserver intérieurement des questions, sans imposer l’image plus matérielle d’un entrepôt.
- source_word: place in the heart
  choice: un lieu dans son cœur
  rationale: Conservation de la métaphore spatiale et intérieure du témoin, importante pour son développement sur le « lieu de vie ».
- source_word: place of life
  choice: lieu de vie / lieu de la vie
  rationale: La variation française suit le contexte syntaxique tout en maintenant le lien lexical entre les occurrences.
- source_word: world of poverty
  choice: monde de pauvreté
  rationale: Traduction formelle qui préserve la portée potentiellement matérielle, spirituelle ou cosmologique de « pauvreté ».
- source_word: iniquity
  choice: injustice
  rationale: Terme français actuel et digne, assez large pour ne pas réduire le sens à une catégorie juridique ou doctrinale précise.
- source_word: wear the flesh
  choice: portes la chair
  rationale: Maintien de l’image inhabituelle du vêtement charnel plutôt que sa normalisation en « vis dans un corps ».
- source_word: known himself
  choice: s’est connu lui-même
  rationale: Préserve la formulation réflexive et sa possible portée spirituelle sans l’expliquer doctrinalement.
- source_word: come to be like
  choice: en est venue… à être semblable à
  rationale: Rend le processus exprimé dans le témoin et conserve la comparaison restaurée.
theological_decisions:
- issue: Nature du « lieu de vie »
  choice: Conserver littéralement « lieu de vie / lieu de la vie »
  alternative: Interpréter comme le ciel, le Royaume ou un état spirituel
  rationale: Le passage ne définit pas univoquement ce lieu; la traduction préserve donc son ambiguïté spatiale, existentielle et spirituelle.
- issue: Rapport entre connaissance de soi et vision du lieu
  choice: « Quiconque s’est connu lui-même l’a vu »
  alternative: Paraphraser comme connaissance de sa nature divine ou conversion intérieure
  rationale: La formulation demeure ouverte et n’importe aucune anthropologie ou sotériologie confessionnelle.
- issue: « Porter la chair »
  choice: Maintenir l’expression imagée
  alternative: Expliquer comme être vivant, incarné ou prisonnier du corps
  rationale: Le texte peut suggérer une tension entre chair et vision, mais la traduction ne tranche pas sa portée théologique.
- issue: Dernière phrase et ressemblance au lieu
  choice: Préserver la restauration « [être semblable à] »
  alternative: Affirmer une identification complète avec le lieu
  rationale: La lacune et la syntaxe rendent l’énoncé incertain; la comparaison est conservée sans la renforcer.
translation_notes:
  register: Français international moderne, sobre et digne. Les crochets du témoin sont intégralement conservés, y compris les crochets vides, afin de signaler les restaurations éditoriales et les lacunes manuscrites. Le projet reste provisoire puisque la révision directe du copte est annoncée comme pendante.
