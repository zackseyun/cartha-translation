  terminology: 'Les termes structurants sont bien maintenus : « lieu de vie », « monde de pauvreté », « porter la chair », connaissance de soi et ressemblance au lieu. « Injustice » demeure une option moderne suffisamment large pour « iniquity » dans le cadre du témoin fourni.'
