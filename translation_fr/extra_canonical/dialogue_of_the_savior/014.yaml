translation:
  language: fr
  text: '**Dialogue du Sauveur — Les œuvres du Père et les œuvres du monde**


    Marie demanda : « [De quelle] nature est la graine de moutarde ? Vient-elle du ciel ou de la terre ? »[a]


    Le Seigneur dit : « Après que le Père eut établi le monde pour lui-même, il laissa une grande part de ce qui restait à la Mère du Tout. Voilà pourquoi il sème et œuvre. »


    Judas dit : « Tu nous as dit cela en accord avec l’intelligence véritable. Lorsque nous prions, comment devons-nous prier ? »


    Le Seigneur dit : « Priez là où il n’y a pas de femme. »


    Matthieu dit : « Il nous dit : “Priez là où il n’y a pas de femme.” Cela signifie qu’il faut détruire les œuvres du féminin. Ce n’est pas qu’il existe une autre sorte de naissance, mais il faut qu’elles cessent [d’enfanter]. »


    Marie dit : « Ne seront-elles donc jamais détruites ? »


    Le Seigneur dit : « [Vous] savez qu’elles périront [de nouveau], […] et [les œuvres] du [féminin qui sont ici] seront [elles aussi] [détruites]. »[a]


    Judas dit [à Matthieu] : « Les œuvres du [féminin] périront bel et bien. Alors, les archontes [invoqueront leurs éons], et nous serons prêts à les affronter. »[b]


    Le Seigneur dit : « Vous verront-ils ? Et verront-ils ceux qui vous accueillent ? Voici que, venant du Père, une parole véritable descend vers l’abîme, dans le silence, avec l’éclat d’un éclair, et elle engendre. La voient-ils, ou la maîtrisent-ils ? Assurément, vous connaissez mieux [le chemin] que ne le connaît [aucun ange] ni aucune puissance. C’est le chemin du Père et du Fils, car les deux sont un, et vous avancerez sur le [chemin] que vous avez connu. Même si les archontes deviennent immenses, ils ne pourront pas l’atteindre. Je vous dis la [vérité] : même pour moi, il est difficile de l’atteindre. »


    […] [Marie] demanda [au Seigneur] : « Si les œuvres [sont détruites, qu’est-ce donc] qui détruit une œuvre ? »


    [Le Seigneur dit] : « Vous savez que, [chaque fois que] je [la] détruis, elle retourne au lieu qui lui est propre. »


    Judas dit : « Comment l’esprit devient-il visible ? »


    Le Seigneur dit : « Comment l’épée [devient-elle visible] ? »


    Judas dit : « Comment la lumière devient-elle visible ? »


    Le Seigneur dit : « [Elle devient visible] éternellement par elle-même. »


    Judas demanda : « Qui dissout les œuvres de qui ? Les œuvres [dissolvent-elles] le monde, ou est-ce le monde qui dissout les œuvres ? »


    Le Seigneur [répondit] : « Celui qui [comprend est celui qui dissout les œuvres]. En effet, celui qui a connu les œuvres doit accomplir la [volonté] du Père. »


    [a] Les crochets signalent des lacunes du manuscrit ou des mots restitués par les éditeurs. Les points de suspension entre crochets indiquent une lacune dont le contenu n’est pas restitué.


    [b] Les « archontes » sont, dans le vocabulaire de ce texte, des puissances dirigeantes du monde ; les « éons » désignent des réalités ou des ordres du monde spirituel.'
