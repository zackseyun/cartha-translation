lexical_decisions:
- source_word: mustard seed
  choice: graine de moutarde
  rationale: Expression française courante et précise, plus naturelle ici que « grain de sénevé », devenu archaïque.
- source_word: Mother of the All
  choice: Mère du Tout
  rationale: Conserve le titre cosmologique et sa personnification sans l’expliquer ni l’identifier à une figure doctrinale particulière.
- source_word: true mind
  choice: intelligence véritable
  rationale: « Intelligence » rend le domaine de la compréhension ou de l’intellect tout en préservant la portée technique possible de l’expression.
- source_word: works of the female
  choice: œuvres du féminin
  rationale: Distingue l’expression abstraite et cosmologique de la mention concrète d’une « femme » dans la parole précédente, sans en atténuer l’étrangeté.
- source_word: archons
  choice: archontes
  rationale: Translittération consacrée dans les traductions françaises des textes de Nag Hammadi ; une brève note aide le lecteur non spécialiste.
- source_word: aeons
  choice: éons
  rationale: Terme technique conservé afin de ne pas réduire le sens à « siècles » ou à « mondes ».
- source_word: generative
  choice: elle engendre
  rationale: Formulation verbale naturelle qui conserve la puissance génératrice attribuée à la parole véritable.
- source_word: dissolves
  choice: dissout
  rationale: Maintient la métaphore répétée et sa distinction possible d’avec « détruire » employé dans le contexte voisin.
- source_word: work the will of the Father
  choice: accomplir la volonté du Père
  rationale: Idiome français clair qui conserve le lien entre l’action humaine et la volonté du Père, sans forcer la répétition anglaise de « work/works ».
theological_decisions:
- issue: Sens de « là où il n’y a pas de femme »
  choice: Traduction littérale dans le texte, sans paraphrase interprétative
  alternative: Interpréter directement comme célibat, cessation de la génération, état spirituel ou dépassement du féminin
  rationale: Le passage fournit sa propre explication énigmatique et demeure théologiquement tendu ; la traduction ne doit pas trancher entre les lectures possibles.
- issue: Unité du Père et du Fils
  choice: « les deux sont un »
  alternative: « ils sont une seule personne » ou « ils sont unis »
  rationale: Préserve la formulation d’unité sans lui imposer une définition métaphysique ou confessionnelle étrangère au témoin.
- issue: Difficulté du Seigneur à atteindre le chemin
  choice: Conserver « même pour moi, il est difficile de l’atteindre »
  alternative: Corriger ou expliquer la phrase pour éviter une difficulté christologique
  rationale: La leçon transmise présente une tension authentique qui ne doit pas être harmonisée silencieusement.
- issue: Destruction des œuvres et cessation de l’enfantement
  choice: Maintenir les formulations restaurées entre crochets
  alternative: Compléter le raisonnement de façon certaine
  rationale: L’état lacunaire du manuscrit empêche de fixer avec assurance la portée cosmologique, anthropologique ou ascétique de ces paroles.
- issue: La parole qui descend vers l’abîme
  choice: « une parole véritable » avec pronom féminin et « elle engendre »
  alternative: Personnaliser explicitement cette parole comme le Logos ou une autre hypostase
  rationale: Le texte permet une portée personnifiée, mais ne justifie pas ici une identification doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct ; les termes techniques indispensables sont conservés avec une explication minimale. Les numéros de pages manuscrites du témoin anglais ont été omis, tandis que les restaurations et lacunes ont été signalées. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et attend une vérification directe du copte du codex Nag Hammadi III,5.
