lexical_decisions:
- source_word: word
  choice: parole
  rationale: Le passage personnifie la « parole » et la fait sortir, descendre et agir. « Parole » conserve cette portée tout en restant naturelle en français et sans imposer le titre théologique « Verbe ».
- source_word: abyss
  choice: abîme
  rationale: Terme français courant et digne qui préserve la profondeur cosmique du passage.
- source_word: inferno
  choice: immense brasier
  rationale: Évite le mot « enfer », qui résoudrait théologiquement l’image, tout en gardant l’idée d’un feu terrifiant.
- source_word: power
  choice: puissance
  rationale: Conserve le vocabulaire cosmologique abstrait du témoin sans identifier cette puissance à un être ou à une faculté particulière.
- source_word: was deficient
  choice: était déficiente
  rationale: Rendu formel qui garde l’étrangeté et l’indétermination du manque décrit.
- source_word: Majesty
  choice: Majesté
  rationale: La majuscule maintient la fonction quasi titulaire du terme sans ajouter une identification absente du témoin.
- source_word: the good
  choice: ce qui est bon
  rationale: Préserve autant que possible l’ambiguïté entre une réalité bonne et des personnes bonnes.
- source_word: Eternally Existent One
  choice: Celui qui existe éternellement
  rationale: Formulation intelligible qui conserve la valeur de titre et l’existence éternelle sans importer un nom divin particulier.
theological_decisions:
- issue: Personnalité et statut de la « parole »
  choice: Employer « parole » avec une minuscule, y compris lorsqu’elle agit et parle.
  alternative: Employer « le Verbe » avec une majuscule.
  rationale: Le témoin ne permet pas d’identifier sans reste cette figure au Logos johannique ; la traduction conserve donc la personnification sans trancher son identité.
- issue: Nature de la « semence issue d’une puissance »
  choice: Conserver littéralement l’imagerie de la semence et de la puissance.
  alternative: Interpréter la semence comme une âme, une étincelle divine ou une personne élue.
  rationale: Le passage n’explicite pas cette symbolique ; toute identification précise importerait une construction doctrinale.
- issue: Sens de la montée de « ce qui est bon »
  choice: Traduire par le neutre « ce qui est bon ».
  alternative: Traduire par « les bons » ou « le Bien ».
  rationale: Le neutre évite de décider si le texte parle de personnes justes ou d’une réalité abstraite.
- issue: Immanence réciproque finale
  choice: Conserver « le Dieu vivant est en vous » et « vous êtes en Dieu ».
  alternative: Atténuer en « Dieu agit parmi vous » ou expliquer l’union de manière doctrinale.
  rationale: La formulation forte et réciproque appartient à la tension théologique du passage et ne doit pas être réduite ni systématisée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions, les images abruptes et les tensions conceptuelles ont été conservées lorsqu’elles structurent le passage. Les numéros de pages manuscrites ont été omis. Les crochets de restitution, les crochets vides, les chevrons et le mot partiellement restauré ont été maintenus. Cette version reste provisoire, car elle repose sur le témoin anglais public fourni ; une révision directe du copte du Codex III,5 demeure nécessaire.
