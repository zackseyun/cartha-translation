translation:
  language: fr
  text: '**Le Dialogue du Sauveur — La grande hauteur et l’abîme**


    Il [prit] Judas, Matthieu et Marie [] [pour leur montrer l’extrême] limite[a] du ciel et de la terre. Et lorsqu’il posa sa [main] sur eux, ils espérèrent pouvoir [la voir].


    Judas leva les yeux et vit un lieu d’une grande hauteur ; il vit aussi, en bas, le lieu de l’abîme.


    Judas dit à Matthieu : « Frère, qui peut monter jusqu’à une telle hauteur ou descendre dans l’abîme, en bas, puisqu’il s’y trouve un immense brasier et une grande terreur ? »


    À cet instant même, une parole sortit de la hauteur. Tandis que Judas se tenait là, il vit de quelle manière la parole descen[dit].


    Il demanda à la parole : « Pourquoi es-tu descendue ? »


    Le Fils de l’homme les salua et leur dit : « Une semence issue d’une puissance était déficiente[b], et elle descendit dans l’abîme de la terre. La Majesté se souvint [d’elle] et lui envoya la [parole]. La parole éleva la semence devant [la présence] de la Majesté, afin que [] la parole première ne soit pas perdue. »


    [Ses] disciples s’émerveillèrent de tout ce qu’il leur disait et reçurent tout avec foi, sachant même qu’il ne sert à rien de considérer l’injustice.


    Puis il dit à ses disciples : « Ne vous ai-je pas dit que ce qui est bon[c] serait élevé jusqu’à la lumière, comme une voix visible et un éclair ? »


    Tous ses disciples le louèrent et dirent : « Seigneur, avant que tu apparaisses ici, qui te louait, puisque toutes les louanges sont pour toi ? Ou qui te bénissait, puisque toutes les bénédictions <sont pour> toi ? »


    Tandis qu’ils se tenaient là, il vit deux esprits qui emmenaient avec eux une seule âme. Et il y eut un grand éclair. Une parole sortit du Fils de l’homme et dit : « Donnez-leur leurs vêtements ! »[d]


    Alors le petit devint pareil au grand. Ils étaient [semblables] à ceux qui avaient été reçus en haut. [] [Il n’y avait aucune différence] entre eux. Les [paroles] qu’il [prononça convainquirent les] disciples.


    Marie [lui dit : « Voici, je] vois le mal [qui agit sur] les êtres humains depuis le commencement, lorsqu’ils vivent les uns avec les autres. »


    Le Seigneur [lui] dit : « Quand tu les vois, [tu sais] beaucoup de choses. Ils [ne resteront pas là ensemble]. Mais lorsque tu verras Celui qui existe éternellement[e], ce sera la grande vision. »


    Ils lui dirent tous : « Explique-le-nous. »


    Il leur dit : « De quelle manière voulez-vous le voir : [dans] une vision qui passe, ou dans une vision qui demeure pour toujours ? »


    Il poursuivit : « Efforcez-vous autant que vous le pouvez de sauver ce qui subsistera après [vous] ; cherchez-le et parlez depuis son intérieur, afin que tout ce que vous cherchez soit en accord avec vous-mêmes. Car je vous [le dis] en vérité : le Dieu vivant [est] en vous, [] [tout comme vous êtes] en Dieu. »


    [a] Le manuscrit est lacunaire à cet endroit. Les mots entre crochets sont des restitutions éditoriales, et les crochets vides signalent une perte de texte non restituée.


    [b] « Déficiente » conserve l’idée inhabituelle d’un manque ou d’une insuffisance attachée à la semence, sans préciser la nature de ce manque.


    [c] L’expression peut désigner « ce qui est bon » ou, selon le sens du texte sous-jacent, « les bons ». Le français retient ici la formulation la moins déterminante.


    [d] Les pronoms « leur » et « leurs » ont un référent incertain dans le passage conservé : ils peuvent renvoyer aux esprits, à l’âme, ou à plusieurs des êtres évoqués.


    [e] Littéralement, d’après le témoin anglais fourni : « l’Éternellement Existant ». La formulation retenue exprime le titre sans l’identifier davantage.'
