lexical_decisions:
- source_word: deficiency
  choice: déficience
  rationale: Conserve le caractère abstrait et potentiellement cosmologique du terme sans le réduire à une simple faute morale ni à une imperfection matérielle.
- source_word: archons
  choice: archontes
  rationale: Translittération française usuelle qui préserve l’identité et l’ambiguïté de ces puissances dirigeantes, plutôt que de les identifier d’emblée à des autorités politiques ou à des démons.
- source_word: rule over
  choice: régner sur
  rationale: Rend l’idée d’exercice d’autorité tout en maintenant le contraste répété entre les archontes et les interlocuteurs.
- source_word: clothe yourselves with the light
  choice: vous vous revêtirez de lumière
  rationale: Préserve l’image vestimentaire, importante dans le contexte immédiat des vêtements et de la chambre nuptiale.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Expression française claire et traditionnelle, sans expliquer de manière spéculative la portée rituelle ou symbolique de l’image.
- source_word: garments of life
  choice: vêtements de la vie
  rationale: Traduction formellement proche qui conserve le lien lexical avec les autres vêtements du passage et évite d’imposer une interprétation sacramentelle.
- source_word: students / teachers
  choice: disciples / maîtres
  rationale: Couple idiomatique dans un dialogue d’enseignement ancien; « disciples » garde ici le sens général d’apprenants, sans désigner un groupe institutionnel précis.
theological_decisions:
- issue: Nature des archontes
  choice: Conserver « archontes » sans identification supplémentaire
  alternative: « puissances », « dirigeants » ou « démons »
  rationale: Le passage affirme leur autorité présente et son renversement futur, mais ne définit pas explicitement leur nature; une désignation plus précise résoudrait indûment cette tension.
- issue: Portée de la « chambre nuptiale »
  choice: Maintenir l’image littérale
  alternative: L’expliquer comme rite, union céleste ou lieu eschatologique
  rationale: Le contexte associe lumière, vêtements et entrée, mais ne tranche pas entre une lecture rituelle, symbolique et eschatologique.
- issue: Difficulté éprouvée par le Seigneur pour atteindre le lieu
  choice: Traduire directement « même pour moi »
  alternative: Atténuer ou réinterpréter la phrase pour l’accorder à une christologie déterminée
  rationale: La formulation produit une réelle tension théologique dans le témoin fourni; elle doit rester visible plutôt que d’être harmonisée.
- issue: Référents de « certains », « d’autres » et « eux »
  choice: Préserver les pronoms et leur ambiguïté
  alternative: Identifier les donateurs ou les bénéficiaires comme anges, initiés ou puissances
  rationale: Le texte transmis ne fournit pas d’antécédents assez sûrs pour préciser ces groupes.
translation_notes:
  register: 'Français international actuel, digne et lisible, avec vouvoiement collectif afin de rendre clairement les formes plurielles adressées aux disciples. Les répétitions de « régner », « vêtements » et « parvenir » sont maintenues pour conserver les liens internes du passage. Cette version demeure provisoire : elle est fondée sur le témoin anglais public fourni, la vérification directe du copte du Codex de Nag Hammadi III,5 restant à effectuer.'
