translation:
  language: fr
  text: 'Judas [dit][a] : « Je veux vraiment [tout apprendre]. »


    Le [Seigneur] lui dit : « Le [Dieu vivant ne] demeure [nulle part dans] tout le [lieu] de cette déficience. »


    Judas [demanda] : « Qui [régnera sur nous] ? »


    Le Seigneur répondit : « [Voici : ici demeure] tout ce qui existe [parmi] ce qui subsistera. Vous [régnerez] sur eux. »


    Judas dit : « Voici, les archontes[b] sont au-dessus de nous, de sorte qu’ils régneront sur nous. »


    Le Seigneur répondit : « C’est vous qui régnerez sur eux. Lorsque vous aurez ôté de vous la jalousie, vous vous revêtirez de lumière et vous entrerez dans la chambre nuptiale[c]. »


    Judas demanda : « Comment [nos] vêtements nous seront-ils fournis ? »


    Le Seigneur répondit : « Certains vous les fourniront, et d’autres [les] recevront, [][d] et ce sont eux [qui vous donneront] vos vêtements. Car qui peut parvenir à ce lieu, puisqu’il est si [redoutable] ? Toutefois, les vêtements de la vie seront donnés aux êtres humains, parce qu’ils connaissent le chemin qu’ils parcourront. En réalité, même pour moi, il est difficile d’y parvenir. »


    Marie dit : « Ainsi, à chaque jour <suffit>[e] sa peine. Les ouvriers sont dignes de leur nourriture. Les disciples seront égaux à leurs maîtres. »


    Elle dit cela en femme qui comprenait tout.'
