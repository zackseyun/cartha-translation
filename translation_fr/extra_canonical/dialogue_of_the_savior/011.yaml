  naturalness: Le français est globalement clair, soutenu et adapté à un texte ancien. « Dans tout le [lieu] de cette déficience » est toutefois moins naturel en français que « dans toute l’étendue de cette déficience », tout en gardant la valeur spatiale et cosmologique de l’expression. Le reste, y compris les formulations volontairement énigmatiques, doit demeurer proche du témoin.
  terminology: « Déficience », « archontes », « se revêtir de lumière », « chambre nuptiale » et « disciples / maîtres » constituent des choix cohérents. « Étendue » dans la restauration française de [place] évite de faire de « lieu » un espace trop concret, sans résoudre l’ambiguïté du texte.
