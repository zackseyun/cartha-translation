review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « ce chemin est pour » introduit une proposition absente du témoin. La formulation doit conserver l’instruction « concernant la voie du passage pour les élus et les solitaires » sans transformer cette relation en assertion indépendante. Le balisage de la restauration dans « [Je] vous dis » est également ajusté pour ne pas ajouter « le » au texte restauré.'
  naturalness: Le français demeure sobre, moderne et lisible, tout en conservant volontairement les ruptures syntaxiques dues aux lacunes. « La voie du passage » rend plus directement la construction du témoin que « comment passer de l’autre côté », sans en fixer la portée.
  terminology: « repos », « colère », « archontes », « élus », « solitaires », « Père » et « vérité » sont maintenus. « Condition temporelle » reste une solution prudente pour le terme abstrait et lacunaire « temporality ».
  issues:
  - severity: medium
    issue: 'Ajout interprétatif : « ce chemin est pour »'
    rationale: Le témoin dit que le Sauveur a instruit les gens « concerning the way of crossing over for the elect and solitary » ; il n’énonce pas séparément que le chemin est destiné à ce groupe. L’ajout modifie légèrement la relation syntaxique et argumentative.
  - severity: low
    issue: Balisage imprécis de la restitution dans « [Je] vous [le dis] »
    rationale: Le témoin ne met entre crochets que « I say », tandis que « to you » demeure hors crochets. En français, « [Je] vous dis » préserve mieux cette distinction sans introduire le pronom objet « le ».
  revised_text: 'Le Sauveur dit à ses disciples : « Frères, le temps est maintenant venu pour nous de cesser notre travail et de demeurer dans le repos, car celui qui demeure dans le repos se reposera pour toujours. Je vous le dis : dépassez toujours [. . .] la condition temporelle [. . .]. [Je] vous dis : [. . .] ne craignez [pas ceux qui . . .] vous. Je [vous le dis] : la colère est redoutable, [et celui qui] provoque la colère est un [être redoutable]. Cependant, puisque vous avez [pu souffrir], elle pourrait sortir de [vous . . .].


    « Les gens ont accueilli avec crainte et tremblement ces paroles concernant la colère. La colère a établi des archontes sur eux, car personne ne peut échapper à la colère. Mais lorsque je suis venu, j’ai ouvert un chemin et enseigné aux gens la voie du passage pour les élus et les solitaires, [] ceux qui ont connu le Père et sont restés fidèles à la vérité ; et vous avez offert une louange. »[a]'
  revised_footnotes:
  - marker: a
    text: Traduction provisoire fondée sur un témoin anglais du texte copte du codex III,5 de Nag Hammadi. Les crochets et les points de suspension signalent des lacunes ou des restitutions dans le témoin ; les crochets vides sont conservés tels quels. Une révision directe du copte reste nécessaire.
