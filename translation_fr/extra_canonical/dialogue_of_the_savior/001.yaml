translation:
  language: fr
  text: 'Le Sauveur dit à ses disciples : « Frères, le temps est maintenant venu pour nous de cesser notre travail et de demeurer dans le repos, car celui qui demeure dans le repos se reposera pour toujours. Je vous le dis : dépassez toujours [. . .] la condition temporelle [. . .]. [Je] vous [le dis] : [. . .] ne craignez [pas ceux qui . . .] vous. Je [vous le dis] : la colère est redoutable, [et celui qui] provoque la colère est un [être redoutable]. Cependant, puisque vous avez [pu souffrir], elle pourrait sortir de [vous . . .].


    « Les gens ont accueilli avec crainte et tremblement ces paroles concernant la colère. La colère a établi des archontes sur eux, car personne ne peut échapper à la colère. Mais lorsque je suis venu, j’ai ouvert un chemin et enseigné aux gens comment passer de l’autre côté : ce chemin est pour les élus et les solitaires, [] ceux qui ont connu le Père et sont restés fidèles à la vérité ; et vous avez offert une louange. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur un témoin anglais du texte copte du codex III,5 de Nag Hammadi. Les crochets et les points de suspension signalent des lacunes ou des restitutions dans le témoin ; les crochets vides sont conservés tels quels. Une révision directe du copte reste nécessaire.
    reason: La source fournie indique expressément que l’examen de la langue ancienne est encore en attente ; la note rend visibles la base indirecte et l’état fragmentaire du passage.
lexical_decisions:
- source_word: stand at rest / rest
  choice: demeurer dans le repos / se reposer
  rationale: Conserve la répétition conceptuelle du témoin tout en donnant une formulation française naturelle et digne.
- source_word: transcend
  choice: dépassez
  rationale: Rend l’idée de franchir ou d’aller au-delà sans lui imposer un vocabulaire philosophique plus technique.
- source_word: temporality
  choice: condition temporelle
  rationale: Expression intelligible qui conserve le caractère abstrait du témoin anglais, dans un passage lacunaire.
- source_word: anger
  choice: colère
  rationale: Maintient le même terme dans toutes ses occurrences afin de préserver la cohérence et la possible personnification.
- source_word: archons
  choice: archontes
  rationale: Translittération française usuelle qui évite de réduire ce terme ancien à de simples dirigeants humains.
- source_word: crossing over
  choice: passer de l’autre côté
  rationale: Préserve la métaphore du passage sans déterminer sa portée cosmologique, spirituelle ou eschatologique.
- source_word: elect and solitary
  choice: élus et solitaires
  rationale: Traduction formelle qui laisse ouverte la fonction particulière de « solitaires » dans le document.
- source_word: offered up praise
  choice: avez offert une louange
  rationale: Conserve le mouvement cultuel de l’expression sans préciser un destinataire que le témoin ne nomme pas ici.
theological_decisions:
- issue: Nature du « repos »
  choice: Conserver le langage du repos sans l’expliquer
  alternative: Interpréter explicitement le repos comme salut éternel, mort ou contemplation
  rationale: Le témoin associe repos présent et repos éternel, mais ne définit pas précisément leur nature.
- issue: Statut de la colère
  choice: Maintenir la possible personnification de la colère
  alternative: Paraphraser comme une émotion humaine qui soumet les personnes à des puissances
  rationale: La phrase selon laquelle la colère établit des archontes autorise plusieurs lectures qu’il ne faut pas trancher silencieusement.
- issue: Identité des archontes
  choice: Employer « archontes » sans glose doctrinale dans le corps du texte
  alternative: Traduire par « dirigeants », « puissances » ou « puissances cosmiques »
  rationale: Le terme possède une charge historique et religieuse particulière, mais le passage ne suffit pas à en fixer précisément le sens.
- issue: Portée du « passage »
  choice: Garder une métaphore ouverte
  alternative: Préciser qu’il s’agit de quitter le monde matériel ou d’entrer dans le salut
  rationale: Une telle précision importerait une interprétation théologique non explicitée par le témoin.
- issue: « Élus et solitaires »
  choice: Conserver les deux désignations sans les identifier à un groupe ecclésial précis
  alternative: Rendre « solitaires » par « célibataires », « moines » ou « êtres unifiés »
  rationale: Le sens technique éventuel demeure incertain en l’absence de vérification directe du copte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement fluidifiée sans masquer les ruptures du manuscrit. Les répétitions structurantes ont été conservées, de même que les termes ambigus ou historiquement marqués. Le présent intitulé « Introduction » relève de la référence éditoriale fournie et n’a pas été ajouté au corps du passage.
