  rationale: Expression naturelle qui maintient l’idée spatiale et initiatique possible sans préciser indûment la nature du passage.
- source_word: single mind
  choice: une seule pensée
  rationale: Formulation prudente dans une restitution lacunaire ; elle peut évoquer l’unité intérieure sans introduire une doctrine technique.
theological_decisions:
- issue: Nature de la peur et des ténèbres
  choice: « La peur est la véritable puissance [des ténèbres] »
  alternative: « La peur est elle-même le pouvoir réel des ténèbres »
  rationale: Conserve les crochets du témoin et ne tranche pas si « des ténèbres » appartient au texte ou constitue une restitution.
- issue: Intériorité et maîtrise du monde terrestre
  choice: « Regardez plutôt ce qui est à l’intérieur [de vous] »
  alternative: « Tournez votre regard vers votre être intérieur »
  rationale: Évite une paraphrase spiritualisante et maintient la formulation concrète ainsi que l’incertitude textuelle.
- issue: Destination céleste
  choice: « un [lieu] sans pouvoir souverain [et sans] tyran »
  alternative: « un lieu sans royaume ni tyran »
  rationale: Le terme « reign » peut désigner règne, domination ou autorité ; « pouvoir souverain » préserve l’idée politique sans suggérer nécessairement l’absence du Royaume divin.
- issue: Unification de l’intérieur et de l’extérieur
  choice: « soient une seule et même chose »
  alternative: « deviennent identiques »
  rationale: Préserve l’affirmation énigmatique sans l’expliquer comme une doctrine métaphysique particulière.
