source:
  text: '“I will teach you when the time for destruction will come. [1] The first power of darkness will overtake you; be not afraid, [2] nor say: ‘Behold, the time has come.’ [3] When, however, you see a solitary staff [. . .]. [4] Know that [. . .] from the work [. . .] and the archons [. . .] overtake you [. . .]. Fear is the real power [of darkness]. If you, therefore, fear what is soon to overtake you, it will overpower you, and not a single one of them will release you or show you pity. Look instead at [what is] inside (you), [5] because you have mastered every earthly thing. This [] [will] convey you upwards to a [place] without reign [and without] tyrant. When you [. . .] you will see those [. . .], and you, too, will [hear them. I] say to you, logic [. . .]. Logic is [. . . where] the truth [is]. They, however, [. . .] and you [. . .] the truth. This [is . . . inside] the living [mind]. Consequently, [. . .] and your joy [. . .] so that [. . .] your souls [. . .], so that the word
    does not [. . .] that they raised up [. . .] and they were unable to [understand] it [. . .]. Make what is [inside] of you and what is [outside of you to be the same thing]. [6]


    The [] crossing place is certainly fearsome in [your] sight, yet do not hesitate to pass through it. Great is its depth, vast [is its] height! [Have a single mind . . .], and the fire [. . .] drops of dew [. . .] all the powers [. . .] you. They will [. . .], and [all] the powers [. . .] they [. . .] before. I say to [you], [. . .] the soul [. . .] will become [. . .] in all of them [. . .] you are [. . .] and that [. . .] do not sleep [. . .] the sons [. . .] and you [. . .] you [. . .].”'
