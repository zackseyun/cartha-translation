translation:
  language: fr
  text: '« Je vous enseignerai quand viendra le temps de la destruction.[a] La première puissance des ténèbres fondra sur vous ; n’ayez pas peur[b] et ne dites pas : “Voici, le temps est venu.”[c] Mais lorsque vous verrez un bâton solitaire […].[d] Sachez que […] de l’œuvre […] et les archontes […] fondront sur vous […]. La peur est la véritable puissance [des ténèbres]. Si donc vous craignez ce qui doit bientôt fondre sur vous, cela vous dominera, et aucun d’eux ne vous relâchera ni n’aura pitié de vous. Regardez plutôt ce qui est à l’intérieur [de vous],[e] car vous avez maîtrisé toute chose terrestre. Cela […] vous transportera vers le haut, jusqu’à un [lieu] sans pouvoir souverain [et sans] tyran. Quand vous […] vous verrez ceux qui […], et vous aussi, vous [les entendrez. Je] vous le dis : la raison […]. La raison est [… là où] se trouve la vérité. Eux, cependant, […] et vous […] la vérité. Cela [est […] à l’intérieur] de l’intelligence vivante. Par conséquent, […] et votre joie […]
    afin que […] vos âmes […], afin que la parole ne […] pas […] ce qu’ils ont élevé […] et ils n’ont pas pu [le comprendre] […]. Faites que ce qui est [à l’intérieur] de vous et ce qui est [à l’extérieur] de vous soient une seule et même chose.[f]


    Le lieu de passage […] paraît assurément redoutable à [vos] yeux ; pourtant, n’hésitez pas à le traverser. Grande est sa profondeur, immense [est] sa hauteur ! [Ayez une seule pensée…], et le feu […] des gouttes de rosée […] toutes les puissances […] vous. Elles […] et [toutes] les puissances […] elles […] auparavant. Je vous le [dis] : […] l’âme […] deviendra […] en elles toutes […] vous êtes […] et cela […] ne dormez pas […] les fils […] et vous […] vous […]. »


    [a] Le manuscrit est très lacunaire dans tout ce passage. Les crochets signalent des restitutions ou des mots incertains ; les points de suspension entre crochets signalent du texte perdu.

    [b] Ou : « ne craignez pas ».

    [c] Littéralement : « Voyez, le temps est venu. »

    [d] Le sens de « bâton solitaire » demeure incertain dans ce contexte endommagé.

    [e] Le témoin anglais présente ici à la fois des crochets et des parenthèses ; la traduction conserve le caractère restitué de l’expression.

    [f] Ou : « Faites de ce qui est à l’intérieur de vous et de ce qui est à l’extérieur de vous une seule et même chose. »'
