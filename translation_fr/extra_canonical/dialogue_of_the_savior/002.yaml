translation:
  language: fr
  text: '« Quand vous adressez une louange, faites-le ainsi :


    Écoute-nous, Père,

    comme tu as écouté ton Fils unique,

    l’accueillant même auprès de toi.

    [Tu] lui as accordé le repos après beaucoup de [travail].

    Notre puissance [ne peut être vaincue],

    [parce que] tes forces combattantes [ne peuvent être vaincues].

    [... lumière ...] vivante [...] inaccessible [... vivante].

    La parole [véritable a donné] la repentance qui mène à la vie,

    [et celle-ci est venue] de toi.

    Tu es la pensée et la sérénité parfaite du solitaire.

    Écoute-nous encore une fois,

    comme tu as écouté ceux que tu as choisis.

    Par ton sacrifice, ceux que tu as choisis entreront.

    Par leurs bonnes œuvres, ils ont libéré leurs âmes des membres aveugles du corps,

    afin de pouvoir exister [...] pour toujours.

    Amen. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public, dans l’attente d’une révision directe du copte du Codex de Nag Hammadi III,5. Les crochets et les points de suspension signalent des lacunes du manuscrit ou des restitutions éditoriales ; la syntaxe de certains vers demeure donc incertaine.
    reason: Le dossier précise que l’examen de la langue source est encore en attente, et le passage transmis est fortement lacunaire.
lexical_decisions:
- source_word: offer up praise
  choice: adresser une louange
  rationale: Rend naturellement l’acte d’offrir ou de faire monter une louange, sans introduire un vocabulaire sacrificiel absent de la formulation attestée.
- source_word: only Son
  choice: Fils unique
  rationale: Expression française traditionnelle et claire, qui conserve la relation singulière exprimée par le témoin.
- source_word: battle forces
  choice: forces combattantes
  rationale: Préserve l’image militaire sans préciser arbitrairement s’il s’agit d’armées, de puissances ou d’êtres spirituels.
- source_word: repentance for life
  choice: la repentance qui mène à la vie
  rationale: Exprime la relation finale ou orientée vers la vie tout en évitant le calque peu naturel « repentance pour la vie ».
- source_word: elect
  choice: ceux que tu as choisis
  rationale: Formulation actuelle et intelligible qui conserve l’idée d’élection sans employer comme substantif le terme potentiellement technique « élus ».
- source_word: solitary
  choice: solitaire
  rationale: Conserve l’ambiguïté du terme, qui peut désigner une personne seule ou avoir une portée spirituelle particulière.
- source_word: blind bodily limbs
  choice: membres aveugles du corps
  rationale: Maintient l’image difficile et la tension anthropologique du témoin plutôt que de l’expliquer ou de l’atténuer.
theological_decisions:
- issue: Rapport entre bonnes œuvres et libération de l’âme
  choice: « Par leurs bonnes œuvres, ils ont libéré leurs âmes »
  alternative: « Leurs bonnes œuvres ont délivré leurs âmes » ou formulation atténuant la causalité
  rationale: Le témoin attribue explicitement aux personnes, par leurs bonnes œuvres, l’action de libérer leurs âmes. La traduction conserve cette affirmation théologiquement tendue sans l’harmoniser avec une doctrine extérieure.
- issue: Entrée des choisis par le sacrifice du Père
  choice: « Par ton sacrifice, ceux que tu as choisis entreront »
  alternative: Préciser le sacrifice du Fils ou traduire « offrande »
  rationale: L’identité et la nature du sacrifice ne sont pas explicitées dans le témoin. La formulation conserve l’adresse à « toi » et n’importe aucune identification doctrinale.
- issue: Repos accordé au Fils
  choice: « lui as accordé le repos après beaucoup de [travail] »
  alternative: « l’as délivré de nombreux travaux »
  rationale: Cette formulation préserve l’idée de repos et le caractère restauré de « travail », sans développer une christologie particulière.
- issue: « pensée » et « sérénité » du solitaire
  choice: Traduction littérale sans explication métaphysique
  alternative: Interpréter ces termes comme des hypostases ou des attributs divins techniques
  rationale: Faute de révision directe du copte et compte tenu de l’ambiguïté du passage, il convient de ne pas imposer un système gnostique ou doctrinal déterminé.
translation_notes:
  register: Français international moderne, digne et accessible, avec tutoiement cohérent dans la prière. La disposition en lignes est conservée pour refléter la forme liturgique. Les segments endommagés restent volontairement difficiles et fragmentaires ; aucune liaison syntaxique conjecturale n’a été ajoutée au-delà de ce qu’exige un français lisible.
