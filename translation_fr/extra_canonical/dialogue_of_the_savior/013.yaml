translation:
  language: fr
  text: 'Marie dit : « Je veux tout comprendre, [exactement tel que] cela est. »


    Le Seigneur dit : « Pour celui qui cherche la vie, telle sera sa richesse, car le [repos] que donne le monde est illusoire, et son or et son argent sont trompeurs. »[a]


    Ses disciples lui demandèrent : « Que devons-nous faire pour que notre œuvre soit menée à son terme ? »


    Le Seigneur [leur dit] : « Soyez prêts en toute circonstance. Heureux celui qui a connu […] [le combat et qui a contemplé] la bataille de ses propres yeux. Il n’a ni tué ni [été] tué, mais il en est sorti victorieux. »[b]


    Judas demanda : « Seigneur, dis-moi : quel est le commencement du chemin ? »


    Il répondit : « L’amour et la bonté. Si seulement l’un des deux avait existé parmi les archontes, le mal ne serait jamais venu à l’existence. »[c]


    Matthieu dit : « Seigneur, tu as parlé sans difficulté de la fin de toutes choses. »


    Le Seigneur dit : « Vous avez compris tout ce que je vous ai dit et vous l’avez accueilli avec foi. Si vous le connaissez, il vous appartient ; si vous ne le connaissez pas, il ne vous appartient pas. »


    Ils lui demandèrent : « Vers quel lieu allons-nous ? »


    Le Seigneur répondit : « Prenez possession du lieu que vous pouvez atteindre. »[d]


    Marie demanda : « Tout ce qui est disposé de cette manière est-il visible ? »


    Le Seigneur répondit : « Je vous ai dit que celui qui peut voir est aussi celui qui révèle. »[e]


    Ses disciples, les Douze, lui demandèrent : « Maître, [avec] […] sérénité […] enseigne-nous […]. »


    Le Seigneur dit : « [Si vous avez compris] tout ce que je vous ai [dit], vous [deviendrez immortels, parce que] vous […] tout. »[f]


    Marie dit : « Je ne [dirai] qu’une seule chose au Seigneur au sujet du mystère de la vérité : c’est en lui que nous tenons ferme, et c’est en lui que nous sommes transparents à ce qui relève du monde. »[g]


    Judas dit à Matthieu : « Nous voulons comprendre de quels vêtements nous devons être revêtus lorsque nous quitterons la condition périssable de la [chair]. »


    Le Seigneur dit : « Les gouverneurs et les administrateurs possèdent des vêtements qui ne leur sont donnés que pour un temps et qui ne durent pas. Mais vous, en tant que fils de la vérité, vous ne devez pas vous revêtir de ces vêtements qui ne durent qu’un temps. Je vous le dis plutôt : vous serez heureux lorsque vous vous dépouillerez de vos vêtements, car […] [se défaire de ce qui est] extérieur n’est pas une grande chose. »[h]


    […] dit : « Est-ce moi qui parle, et est-ce moi qui reçois […] ? »


    Le Seigneur répondit : « Oui, [celui qui reçoit] votre Père d’une [manière conforme à la raison]. »[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mention du « repos » est une restitution éditoriale. La phrase oppose la richesse de celui qui cherche la vie aux biens trompeurs du monde.
    reason: Signaler une restauration et préserver une formulation difficile.
  - marker: b
    text: Le manuscrit est lacunaire avant « le combat » ; la reconstruction de la phrase reste incertaine.
    reason: Rendre visible l’état fragmentaire du témoin.
  - marker: c
    text: Les « archontes » sont des gouvernants ou puissances ; dans ce type d’écrit, le mot peut désigner des puissances cosmiques.
    reason: Éclairer un terme technique sans fixer une interprétation unique.
  - marker: d
    text: 'On pourrait aussi comprendre : « Occupez le lieu que vous pouvez atteindre. »'
    reason: Préserver l’ambiguïté du verbe relatif au lieu.
  - marker: e
    text: La relation exacte entre voir et révéler demeure difficile à déterminer dans cette formule.
    reason: Ne pas masquer une ambiguïté sémantique réelle.
  - marker: f
    text: Cette phrase comporte plusieurs lacunes ; « si vous avez compris », « deviendrez immortels » et « parce que » sont des restitutions.
    reason: Distinguer le texte conservé des compléments éditoriaux.
  - marker: g
    text: Le sens de « transparents à ce qui relève du monde » est incertain ; la traduction conserve l’image du témoin disponible.
    reason: Préserver une expression obscure sans harmonisation doctrinale.
  - marker: h
    text: Le passage est endommagé avant « se défaire de ce qui est extérieur ». L’image des vêtements n’est pas explicitée par le texte.
    reason: Signaler la lacune et éviter une interprétation anthropologique imposée.
  - marker: i
    text: La fin est lacunaire. « Celui qui reçoit » et l’expression traduite par « d’une manière conforme à la raison » reposent sur une restitution incertaine.
    reason: Signaler l’extrême fragilité textuelle de la dernière réponse.
lexical_decisions:
- source_word: '[rest]'
  choice: '[repos]'
  rationale: Conserve la restauration éditoriale entre crochets et le contraste énigmatique entre la vie véritable et ce que le monde donne.
- source_word: archons
  choice: archontes
  rationale: Le terme technique est conservé en français plutôt que normalisé en « autorités », afin de ne pas effacer sa portée cosmologique possible.
- source_word: work
  choice: œuvre
  rationale: « Œuvre » maintient l’ambiguïté entre tâche, activité et accomplissement spirituel.
- source_word: Occupy
  choice: Prenez possession de
  rationale: Rend l’idée d’occuper ou de tenir un lieu sans réduire le propos à une simple présence physique.
- source_word: deathless
  choice: immortels
  rationale: Formulation française naturelle qui transmet l’absence de mort, tout en maintenant la restauration entre crochets.
- source_word: destructibility
  choice: condition périssable
  rationale: Évite le peu naturel « destructibilité » et exprime clairement l’état soumis à la corruption.
- source_word: garments
  choice: vêtements
  rationale: Conserve l’image concrète et sa portée symbolique sans l’interpréter.
- source_word: logical way
  choice: manière conforme à la raison
  rationale: Préserve la coloration rationnelle du témoin anglais tout en signalant par les crochets le caractère restauré et incertain.
theological_decisions:
- issue: Identité et nature des « archontes »
  choice: Conserver « archontes »
  alternative: Traduire par « dirigeants », « puissances » ou « autorités »
  rationale: Le passage peut viser des puissances cosmiques plutôt que de simples responsables humains ; une traduction générique trancherait indûment.
- issue: Sens des vêtements et du dépouillement
  choice: Maintenir le langage imagé sans explicitation doctrinale
  alternative: Identifier les vêtements au corps, à la matérialité ou à une nature spirituelle précise
  rationale: Le texte associe les vêtements à ce qui est temporaire et extérieur, mais les lacunes empêchent d’imposer une lecture anthropologique déterminée.
- issue: Portée de « fils de la vérité »
  choice: Traduction littérale au masculin grammatical
  alternative: « enfants de la vérité »
  rationale: « Fils » conserve la formule traditionnelle et sa possible valeur de statut, sans ajouter une doctrine de filiation absente du passage.
- issue: Rapport entre voir et révéler
  choice: « celui qui peut voir est aussi celui qui révèle »
  alternative: « celui qui voit est celui qui est révélé »
  rationale: Le témoin fourni favorise le sujet qui révèle, mais la tournure demeure énigmatique ; la note signale cette difficulté.
- issue: Promesse de devenir immortels
  choice: Conserver la restauration éditoriale
  alternative: Intégrer la proposition comme texte assuré
  rationale: Cette affirmation théologiquement importante se trouve dans une portion endommagée et ne doit pas être présentée sans réserve.
translation_notes:
  register: Français international actuel, digne et lisible. Les crochets marquent les restitutions éditoriales ; les points de suspension entre crochets signalent les lacunes. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni et non sur une vérification directe du copte du Codex III,5.
