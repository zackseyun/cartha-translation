translation:
  language: fr
  text: 'Judas demanda : « Dis-[nous], Seigneur, qu’est-ce qui [existait] avant que [le ciel et] la terre viennent à l’existence ? »


    Le Seigneur dit : « Il y avait les ténèbres et l’eau, et […] un esprit était au-dessus de [l’eau]. Et je vous dis [la vérité] : voici, ce que vous cherchez et sur quoi vous vous interrogez [est] au-dedans de vous ; cela [possède] la puissance et le mystère [de l’]esprit, parce que [cela provient] [de l’esprit]. L’iniquité est entrée [pour détruire] sans cesse l’intelligence. Voici, […]. »


    [Matthieu] dit : « Seigneur, dis-nous : où [l’âme] est-elle établie, et où demeure la véritable [intelligence] ? »


    Le Seigneur [dit] : « Le feu de l’esprit vint à l’existence [entre] les deux ; ainsi, [l’esprit] jaillit et, en eux, la véritable intelligence. [Si] quelqu’un établit l’âme dans les hauteurs, alors [elle sera] élevée. »


    Matthieu lui demanda : […] « [La circoncision n’est-elle pas nécessaire], lorsqu’on la comprend [selon l’interprétation véritable] ? »


    Le Seigneur [dit : « La circoncision est] plus profitable que votre [œuvre. Ôtez] de vous-mêmes [ce qui peut] vous persécuter, oui, tout ce qui est [au-dedans] de vos cœurs ; car, à mesure que vos cœurs [sont circoncis], vous [trouverez] le moyen de vaincre les puissances d’en haut et d’en bas. Et je vous le dis : que celui [qui possède] le pouvoir y renonce [et] se repente ; que celui qui [comprend] cherche, trouve et se réjouisse. »


    Judas dit : « Voici, [je] vois que tout est [exactement] comme un signe au-dessus [de la terre], et que c’est pour cette raison que les choses sont venues à l’existence de cette manière. »


    Le Seigneur [dit] : « Lorsque le Père établit le monde, il [rassembla] une partie de son eau, et la parole en sortit. […] Elle endura beaucoup [d’épreuves, mais] elle était plus haute que la trajectoire [des étoiles] qui entoure toute la terre.


    [Il poursuivit] : « L’eau rassemblée [en haut] est au-delà des étoiles et, [au-delà] de l’eau, <il y a> une grande fournaise qui les entoure comme une muraille. Dès que plusieurs des réalités intérieures se furent séparées du reste, on [commença à calculer] les périodes de temps.


    « Lorsque [l’ensemble] [a] eut été établi, il [b] regarda [vers le bas] : le Père lui dit alors : “Va, [fais sortir quelque chose] de toi-même, afin que [la terre] ne manque de rien, de génération en [génération] et d’âge en âge.”


    « Alors [cela] [c] fit sortir de soi des sources de lait, des sources de miel, d’huile et de vin, de bons fruits, des saveurs délicieuses et des racines bienfaisantes, [afin que] la terre ne manque de rien, de génération [en] génération et d’âge en âge.


    « Cela se trouve au-dessus de […]. […] se tenait là [et déployait] sa beauté […]. Et au-dehors [il y avait une grande lumière], plus éclatante [que] celle qui lui ressemble [d], car celle-là règne sur [tous] les éons d’en haut et d’en bas. [La lumière fut] tirée du feu et répandue dans le [firmament], en haut et en bas. Ceux qui sont au-dessus du ciel d’en haut et au-dessus de la terre d’en bas dépendent [e] d’eux. Tout dépend d’eux. »


    Après avoir entendu cela, Judas se prosterna, tomba à genoux et loua le Seigneur.'
