lexical_decisions:
- source_word: spirit
  choice: esprit
  rationale: Conserve le champ sémantique religieux et cosmologique du témoin sans décider si, dans chaque occurrence, il s’agit d’une entité personnelle, d’un principe ou de l’esprit humain.
- source_word: mind
  choice: intelligence
  rationale: « Intelligence » rend mieux ici la faculté intérieure de compréhension que « esprit », déjà requis pour spirit, et évite de confondre les deux termes.
- source_word: secrecy
  choice: mystère
  rationale: Dans ce contexte sapientiel, « mystère » est plus naturel que « caractère secret » tout en conservant l’idée d’une réalité cachée.
- source_word: powers
  choice: puissances
  rationale: Maintient le possible sens cosmologique d’entités ou de forces suprahumaines sans le réduire à une autorité politique ou à une capacité abstraite.
- source_word: aeons
  choice: éons
  rationale: Translittération usuelle pour préserver le terme cosmologique technique et son ambiguïté entre domaines, puissances et âges.
- source_word: inferno
  choice: fournaise
  rationale: Évite « enfer », qui importerait trop directement une conception eschatologique ; « fournaise » exprime l’immense feu encerclant les eaux.
- source_word: word
  choice: parole
  rationale: Conserve l’ambivalence entre parole émise et réalité cosmologique personnifiée, sans imposer une identification doctrinale au Logos.
theological_decisions:
- issue: Rapport entre circoncision corporelle et circoncision du cœur
  choice: Conserver l’affirmation lacunaire sur la circoncision puis l’appel à circoncire les cœurs
  alternative: Interpréter explicitement la circoncision physique comme inutile ou comme obligatoire
  rationale: Le passage transmis est endommagé et met les deux notions en tension sans autoriser une conclusion confessionnelle univoque.
- issue: Nature de l’esprit au-dessus des eaux
  choice: Employer l’indéfini « un esprit »
  alternative: Employer « l’Esprit » avec majuscule
  rationale: Le témoin fourni a un article indéfini et le contexte ne suffit pas à identifier formellement cet esprit à l’Esprit saint.
- issue: Identité de la parole issue de l’eau
  choice: Employer « la parole » sans majuscule
  alternative: Employer « la Parole » comme titre christologique
  rationale: La formulation cosmologique peut évoquer le Logos, mais l’identification n’est pas explicite dans le texte conservé.
- issue: Renoncement au pouvoir
  choice: « que celui qui possède le pouvoir y renonce »
  alternative: Comprendre le pouvoir comme une puissance spirituelle à exercer ou comme un mal déterminé
  rationale: La nature du pouvoir n’est pas précisée ; le pronom maintient cette indétermination.
- issue: Référents pronominaux dans le récit cosmologique
  choice: Maintenir les pronoms ambigus et les signaler en note
  alternative: Identifier leurs référents à l’eau, au monde, à la terre ou à une entité cosmique précise
  rationale: L’état fragmentaire ne permet pas une résolution sûre des antécédents.
