    reason: Ne pas résoudre une ambiguïté conceptuelle réelle.
  - marker: c
    text: Le texte permet de comprendre soit un lieu abandonné par la vérité, soit un lieu qui manque de vérité.
    reason: Rendre compte de l’alternative syntaxique signalée par le témoin.
  - marker: d
    text: Les mots « comme un feu dévorant » sont restitués dans une partie endommagée du manuscrit. Une lacune précède cette restitution.
    reason: Signaler que la comparaison n’est pas intégralement préservée dans le manuscrit.
lexical_decisions:
- source_word: fullness
  choice: plénitude
  rationale: Terme naturel en français qui conserve la portée conceptuelle du témoin sans la réduire à une simple abondance matérielle.
- source_word: deficiency
  choice: manque
  rationale: « Manque » reste accessible et préserve l’opposition à la plénitude ; « déficience » serait plus technique et pourrait évoquer une incapacité personnelle.
- source_word: what animates a person
  choice: ce qui anime une personne
  rationale: 'Traduction volontairement non interprétative : elle n’identifie pas explicitement cet élément à l’âme, à l’esprit ou au souffle.'
- source_word: rest
  choice: trouver le repos
  rationale: Expression idiomatique française qui maintient la possible dimension existentielle ou eschatologique du repos.
- source_word: revealer
  choice: celui qui révèle
  rationale: Formulation claire et digne qui évite le substantif rare « révélateur », susceptible de désigner une personne qui divulgue un secret.
- source_word: harmonize
  choice: s’accorder
  rationale: Préserve l’idée de correspondance ou d’harmonie sans préciser un mécanisme absent du témoin.
theological_decisions:
- issue: Nature de ce qui anime la personne
  choice: ce qui anime une personne
  alternative: son âme / son esprit
  rationale: Le témoin demeure indéterminé ; nommer l’âme ou l’esprit imposerait une anthropologie précise.
- issue: « Tout ce qui vient de la femme mourra »
  choice: Traduction littérale maintenue
  alternative: Tout être né d’une femme mourra
  rationale: La formulation conserve la tension et l’étrangeté du texte sans expliciter si « femme » renvoie à la naissance corporelle, à un symbole ou à autre chose.
- issue: Identité du possesseur dans « sa lumière »
  choice: sa lumière
  alternative: la lumière de Dieu / sa propre lumière
  rationale: L’antécédent du possessif n’est pas explicité dans le témoin ; l’ambiguïté est donc conservée.
- issue: Genre et référent de « vivant » après l’entrée dans le mort
  choice: cela sera appelé vivant
  alternative: il sera appelé vivant / la personne sera appelée vivante
  rationale: Le français neutre « cela » évite de trancher si le référent est l’élément vivant, le mort revivifié ou l’ensemble résultant.
- issue: Lieu délaissé ou dépourvu de vérité
  choice: les deux possibilités sont conservées dans le texte
  alternative: un lieu dépourvu de vérité seulement
  rationale: Le témoin présente une ambiguïté syntaxique entre abandon par la vérité et absence de vérité.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue direct et les répétitions conceptuelles ont été conservés. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni ; la révision directe du copte du Codex de Nag Hammadi III,5 reste à effectuer. Les numéros de pages manuscrites 19 et 20 ont été omis.
