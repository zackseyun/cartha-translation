translation:
  language: fr
  text: 'Les disciples lui demandèrent : « Qu’est-ce que la plénitude, et qu’est-ce que le manque ? »


    Il leur répondit : « Vous êtes venus de la plénitude, et vous demeurez dans le lieu du manque.


    Et voici, sa lumière s’est déversée sur moi. »


    Matthieu demanda : « Seigneur, dis-moi comment ceux qui sont morts meurent, et comment ceux qui sont vivants vivent. »


    Le Seigneur dit : « [Vous m’avez] interrogé au sujet d’une parole [véritable] que l’œil n’a pas vue, et vous êtes les seuls de qui je l’aie entendue. Mais moi, je vous dis que, lorsque ce qui anime une personne lui est retiré, elle sera appelée morte ; et lorsque ce qui est vivant <entre dans> ce qui est mort, cela sera appelé vivant. »[a]


    Judas demanda : « À vrai dire, pourquoi certains <meurent-ils> et d’autres vivent-ils ? »


    Le Seigneur dit : « Tout ce qui vient de la vérité ne mourra pas. Tout ce qui vient de la femme mourra. »


    Marie demanda : « Dis-moi, Seigneur, pourquoi suis-je venue en ce lieu : pour gagner ou pour perdre ? »


    Le Seigneur répondit : « Tu révèles la richesse de celui qui révèle. »[b]


    Marie lui demanda : « Seigneur, y a-t-il donc un lieu délaissé par la vérité, ou qui en est dépourvu ? »[c]


    Le Seigneur dit : « Le lieu où je ne demeure pas. »


    Marie dit : « Seigneur, tu inspires crainte et émerveillement, même [comme un feu dévorant] à ceux qui ne te connaissent pas. »[d]


    Matthieu demanda : « Pourquoi ne trouvons-nous pas le repos dès maintenant ? »


    Le Seigneur dit : « Lorsque vous aurez laissé derrière vous ce que vous ne pouvez emporter, alors vous trouverez le repos. »


    Matthieu demanda : « Comment ce qui est petit s’accorde-t-il avec ce qui est grand ? »


    Le Seigneur dit : « En laissant derrière vous ces fardeaux. »'
