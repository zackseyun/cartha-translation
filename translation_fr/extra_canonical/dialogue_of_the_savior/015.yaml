base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: fr
  text: '« Quant à vous, efforcez-vous avec soin de vous libérer de la [colère] et de la jalousie. Dépouillez-vous de vos [œuvres][a], et ne [. . .] pas. [] [. . .] reproche [. . .], car je vous dis : [vous . . .] recevrez [. . .] beaucoup [. . .] celui qui a cherché et [découvert la vraie vie]. Celui-là [parviendra au repos et] vivra pour toujours. Je vous dis : [prenez garde à vous-mêmes], afin de ne pas égarer [vos] esprits et vos âmes. »


    [Le Dialogue] du Sauveur


    [a] Ici, « œuvres » désigne ce dont il faut se dépouiller ou qu’il faut dissoudre, et non des « péchés pardonnés ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « œuvres » désigne ce dont il faut se dépouiller ou qu’il faut dissoudre, et non des « péchés pardonnés ».
    reason: La note 25 du témoin précise que le copte kō a ici le sens de « délier/dissoudre », non celui de « pardonner ».
lexical_decisions:
- source_word: wrath
  choice: colère
  rationale: Équivalent français naturel et digne, maintenu entre crochets puisque le mot est restitué dans le témoin.
- source_word: works (Coptic kō context)
  choice: œuvres
  rationale: Conserve le terme thématique du passage et son possible lien avec l’idée de défaire ou dissoudre les œuvres, sans le réduire à des actes particuliers.
- source_word: true life
  choice: la vraie vie
  rationale: Rend directement l’expression sans préciser théologiquement la nature de cette vie.
- source_word: achieve rest
  choice: parviendra au repos
  rationale: Préserve le motif religieux du repos tout en restant idiomatique en français.
- source_word: lead ... into error
  choice: égarer
  rationale: Formulation française naturelle qui conserve l’idée de conduire dans l’erreur.
theological_decisions:
- issue: Sens de « œuvres » et du verbe copte kō signalé dans les notes du témoin
  choice: Conserver « œuvres » et expliquer qu’il s’agit de s’en dépouiller ou de les dissoudre
  alternative: Traduire dans le sens de « pardonner vos œuvres »
  rationale: La note source exclut explicitement ici le sens de « pardonner » et rattache le terme à l’idée de défaire ou dissoudre.
- issue: Relation entre esprits et âmes
  choice: Maintenir les deux termes au pluriel sans les harmoniser
  alternative: Les fusionner en une seule notion intérieure
  rationale: Le texte distingue les esprits et les âmes; cette tension anthropologique ne doit pas être résolue par la traduction.
- issue: Promesse de repos et de vie éternelle
  choice: Garder la formulation fragmentaire entre crochets
  alternative: Compléter la promesse en une phrase théologiquement plus explicite
  rationale: Le manuscrit est lacunaire; la traduction ne doit pas transformer une restitution éditoriale en texte certain.
translation_notes:
  register: Français international moderne, sobre et digne. Les crochets et les points de suspension reproduisent les restaurations éditoriales et les lacunes du manuscrit. Le brouillon demeure provisoire, car il repose sur un témoin anglais du domaine public et la vérification directe du copte est encore en attente.
