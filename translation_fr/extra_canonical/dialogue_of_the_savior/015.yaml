review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement les restaurations et lacunes signalées par les crochets et les points de suspension, ainsi que la distinction entre « esprits » et « âmes ». Toutefois, « ne [...] pas » ajoute une négation française complète dont le second élément n’est pas présent hors de la lacune dans le témoin; il faut donc conserver la lacune sans ajouter « pas ». La syntaxe autour de « je dis à [vous…] » et de « celui qui a cherché » doit aussi rester plus proche de l’enchaînement fragmentaire du témoin.
  naturalness: Le registre est globalement sobre et naturel. « Dépouillez-vous de vos œuvres » et « parviendra au repos » conviennent. La séquence « beaucoup [...] celui qui a cherché » demeure nécessairement heurtée en raison de l’état lacunaire, mais la ponctuation révisée évite de lui imposer une relation syntaxique indûment assurée.
  terminology: « colère », « jalousie », « œuvres », « vraie vie », « repos », « esprits » et « âmes » sont des choix appropriés. La note sur les « œuvres » n’est pas requise pour ce bref extrait et introduit une précision interprétative (« péchés pardonnés ») qui ne figure pas dans le texte traduit; elle est supprimée avec son ancre.
  issues:
  - severity: medium
    issue: Ajout de « pas » après une lacune
    rationale: Le témoin porte « and do not [. . .]. »; le français « et ne [. . .]. » préserve la négation sans compléter arbitrairement le texte lacunaire par « pas ».
  - severity: medium
    issue: Représentation imprécise de la restauration « [you, . . .] »
    rationale: '« je vous dis : [vous . . .] recevrez » déplace « vous » hors des crochets et crée une nouvelle restauration. « je dis à [vous, . . .] : vous recevrez » reflète plus exactement le témoin anglais provisoire.'
  - severity: low
    issue: Note a et ancre non nécessaires
    rationale: La note extrapole une opposition aux « péchés pardonnés » sans nécessité dans ce passage; la suppression évite une glose théologique inutile et laisse le terme « œuvres » ouvert.
  revised_text: '« Quant à vous, efforcez-vous avec soin de vous libérer de la [colère] et de la jalousie. Dépouillez-vous de vos [œuvres], et ne [. . .]. [] [. . .] reproche [. . .], car je dis à [vous, . . .] : vous recevrez [. . .] beaucoup [. . .]. Celui qui a cherché, ayant [découvert la vraie vie], [parviendra au repos et] vivra pour toujours. Je vous dis : [prenez garde à vous-mêmes], afin de ne pas égarer [vos] esprits et vos âmes. »


    [Le Dialogue] du Sauveur'
  revised_footnotes: []
  revision_rationale: La révision retire l’achèvement non attesté de la négation, rétablit l’emplacement de la restauration concernant les destinataires, et ponctue la proposition relative de manière à ne pas faire de « beaucoup » un complément français artificiel de « celui qui a cherché ». L’ancre et la note sont retirées, car elles ne sont ni nécessaires à la compréhension ni justifiées comme note textuelle propre à cet extrait.
