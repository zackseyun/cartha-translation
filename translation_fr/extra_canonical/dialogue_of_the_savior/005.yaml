lexical_decisions:
- source_word: seeks
  choice: cherche
  rationale: Rend directement l’action de chercher sans préciser son objet, qui demeure absent du témoin.
- source_word: reveals
  choice: révèle
  rationale: Préserve le parallélisme et l’ambiguïté quant à ce qui est révélé.
- source_word: wearing a body
  choice: je porte un corps
  rationale: Conserve la métaphore du corps comme chose portée, sans la normaliser en simple existence corporelle.
- source_word: mind
  choice: l’intelligence
  rationale: Distingue cette faculté intérieure de « l’esprit » dans la phrase suivante, tout en évitant une terminologie confessionnelle.
- source_word: spirit
  choice: l’esprit
  rationale: Choix volontairement non capitalisé, puisque le témoin ne permet pas de trancher entre l’esprit humain et une réalité spirituelle personnalisée.
- source_word: powers
  choice: puissance
  rationale: Préserve le vocabulaire cosmologique du témoin sans identifier ces puissances à une catégorie doctrinale précise.
- source_word: sons of deceit
  choice: les fils de la tromperie
  rationale: Maintient l’expression sémitisante et son opacité plutôt que de la paraphraser.
theological_decisions:
- issue: Identité de celui qui cherche et de celui qui révèle
  choice: « le même que »
  alternative: « c’est celui qui révèle »
  rationale: Conserve l’affirmation explicite d’identité sans expliquer sa portée anthropologique ou théologique.
- issue: Rapport entre ténèbres et vision de la lumière
  choice: Conserver « ne se tient pas dans les ténèbres » et « incapable de voir la lumière »
  alternative: Corriger en « se tient dans les ténèbres » ou « capable de voir la lumière »
  rationale: La formulation transmise est paradoxale et peut résulter d’une lacune ou d’une restauration incertaine ; elle ne doit pas être corrigée silencieusement.
- issue: « esprit » dans « les fruits de l’esprit »
  choice: minuscule à « esprit »
  alternative: « Esprit » avec majuscule
  rationale: Le témoin fourni ne justifie pas d’identifier sans réserve le référent au Saint-Esprit.
- issue: Sort des puissances d’en haut et d’en bas
  choice: « vous traitera cruellement »
  alternative: « vous tourmentera »
  rationale: Évite de préciser la nature du mauvais traitement au-delà du témoin disponible.
translation_notes:
  register: Français international actuel, sobre et digne. Le dialogue direct reste fluide, tandis que les répétitions, les images et les tensions du témoin sont conservées. La ponctuation française est modernisée. Les restitutions entre crochets et les lacunes sont maintenues sans harmonisation conjecturale.
