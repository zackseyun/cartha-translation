translation:
  language: fr
  text: 'Ses disciples [dirent : « Seigneur], qui est celui qui cherche, et [qui] est celui qui révèle ? »


    [Le Seigneur] leur [dit] : « Celui qui cherche est [le même] que celui qui révèle. »


    Matthieu [lui dit encore : « Seigneur], tandis que je [t’écoute] et que je parle, qui est celui qui [parle, et] qui est celui qui écoute ? »


    Le [Seigneur] dit : « Celui qui parle est le même que celui qui [écoute], et celui qui peut voir est le même que celui qui révèle. »


    Marie dit : « Seigneur, voici : [tant que] je porte un corps, d’où coulent mes larmes, et d’où vient mon rire ? »


    Le Seigneur dit : « [C’est le corps qui] pleure à cause de ses actes, [et à cause des] actes qui restent encore à accomplir. C’est l’intelligence qui rit [à cause des fruits de] l’esprit. Celui qui ne [se tient] pas dans les ténèbres sera [in]capable de voir [la lumière].


    Je vous le dis : [tout ce qui est privé de] lumière est ténèbres, [et celui qui] ne se tient [pas] dans [les ténèbres sera in]capable de voir la lumière. Cependant, [les fils de] la tromperie furent retirés […]. Vous revêtirez la lumière et [vous vivrez ainsi] pour toujours […]. [Si …], alors [toute] puissance d’en haut et d’en bas vous traitera cruellement. En ce lieu, [il y aura] des pleurs et des [grincements] de dents à cause de la fin de [toutes] choses. »[a]'
  philosophy: optimal-equivalence
  footnotes:
