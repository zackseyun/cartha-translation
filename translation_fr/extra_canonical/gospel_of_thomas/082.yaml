base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: fr
  text: 'Jésus a dit : « Celui qui est près de moi est près du feu, et celui qui est loin de moi est loin du royaume.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte traduit par « royaume » peut aussi signifier « royauté » ou « règne royal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲏⲛ / ϩⲱⲛ
  choice: être près de
  rationale: Le statif exprime ici la proximité plutôt qu’un mouvement. « Être près de » conserve le parallélisme avec « être loin de ».
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: près de moi / loin de moi
  rationale: Dans ces constructions idiomatiques, les formes prépositionnelles marquent la relation à Jésus; cette formulation française naturelle maintient l’opposition spatiale du copte.
- source_word: ⲥⲁⲧⲉ
  choice: le feu
  rationale: « Feu » est le sens courant et garde intacte l’image brève et saisissante, sans la préciser en « flamme ».
- source_word: ⲟⲩⲏⲩ
  choice: être loin de
  rationale: Ce choix simple et actuel reproduit directement l’antithèse entre proximité et éloignement.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: le royaume
  rationale: « Royaume » est le rendu français idiomatique dans ce contexte, tandis que le terme copte peut aussi désigner la royauté ou le règne; cette latitude est signalée en note.
- source_word: ⲡⲉⲧ-
  choice: celui qui
  rationale: La relative générique singulière respecte la forme aphoristique et le parallélisme de l’énoncé.
theological_decisions:
- issue: Rapport symbolique entre Jésus, le feu et le royaume
  choice: Conserver sans explication l’image du feu et l’opposition formulée par le texte
  alternative: Identifier le feu au jugement, à la purification ou à une présence divine particulière
  rationale: Le texte ne définit pas le feu. Préciser sa portée dans la traduction résoudrait indûment une ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève ainsi que le strict parallélisme « près de moi… près du feu / loin de moi… loin du royaume » reproduisent le caractère aphoristique du copte. La note est placée après « royaume », le terme qu’elle explique.
