base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: fr
  text: 'Jésus dit : « La moisson est certes abondante, mais les ouvriers sont peu nombreux. Suppliez donc le maître[a] d’envoyer des ouvriers à la moisson[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte peut aussi se traduire par « le Seigneur ». « Le maître » convient ici au cadre agricole.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « à la moisson ». Contrairement aux formulations parallèles de Matthieu 9.38 et de Luc 10.2, le texte de Thomas ne dit ni « le maître de la moisson » ni « sa moisson ».
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: la moisson
  rationale: Terme agricole courant qui désigne aussi bien la récolte que l’action de moissonner; il convient aux deux occurrences.
- source_word: ⲛⲁϣⲱϥ
  choice: est certes abondante
  rationale: Rend l’idée de grand nombre ou d’abondance ainsi que la corrélation emphatique ⲙⲉⲛ…ⲇⲉ (« certes… mais… »).
- source_word: ⲥⲟⲃⲕ
  choice: sont peu nombreux
  rationale: Expression française naturelle pour le petit nombre des ouvriers, préférable ici au simple adjectif « peu ».
- source_word: ⲥⲟⲡⲥ
  choice: Suppliez
  rationale: Le mot est un impératif signifiant prier avec insistance ou supplier; cette traduction conserve la force de la demande sans le confondre avec un simple connecteur discursif.
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: le maître
  rationale: Dans l’image agricole, « maître » désigne naturellement celui qui a autorité pour envoyer les ouvriers, tout en laissant ouverte l’autre valeur possible, « le Seigneur ».
- source_word: ⲛⲁⲛⲟⲩϫⲉ…ⲉⲃⲟⲗ
  choice: d’envoyer
  rationale: La tournure copte signifie littéralement « jeter dehors », mais « envoyer » exprime idiomatiquement l’action de faire partir des ouvriers vers la moisson.
- source_word: ⲉⲡⲱϩⲥ
  choice: à la moisson
  rationale: Conserve la destination exprimée par ⲉ et n’ajoute pas le possessif « sa », absent du texte copte.
theological_decisions:
- issue: Valeur de ⲡϫⲟⲉⲓⲥ
  choice: le maître
  alternative: le Seigneur
  rationale: Les deux sens sont lexicalement possibles. Le contexte d’une moisson et d’ouvriers favorise « maître », mais une note maintient explicitement la lecture théologique possible au lieu de la supprimer.
- issue: Possession de la moisson finale
  choice: à la moisson
  alternative: dans sa moisson
  rationale: Le texte de Thomas ne porte aucun possessif devant la dernière occurrence de « moisson »; la traduction évite donc d’introduire « sa » à partir des parallèles synoptiques.
translation_notes:
  register: Français moderne, sobre et digne. « Certes… mais… » restitue la structure contrastive du copte; « suppliez » conserve l’insistance du verbe sans archaïsme marqué. La formulation reste proche de la syntaxe source tout en demeurant intelligible à la lecture publique.
