base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: fr
  text: 'Jésus dit : « Cherchez, et vous trouverez.[d] Mais les choses[a] au sujet desquelles vous m’avez interrogé[b] en ces jours-là et que je ne vous ai pas dites ce jour-là — maintenant, je suis prêt à vous les dire[c], et vous ne les cherchez pas. »[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction relative peut se comprendre au singulier (« ce que ») ou au pluriel (« les choses que »). Les reprises pronominales plurielles du contexte favorisent le pluriel.
    reason: ambiguïté textuelle et grammaticale
  - marker: b
    text: 'La segmentation morphologique imprimée peut donner l’impression de « vous les avez interrogées », tandis que la lecture suivie du passage permet de comprendre : « les choses au sujet desquelles vous m’avez interrogé ». La traduction suit cette seconde analyse.'
    reason: difficulté textuelle et syntaxique
  - marker: c
    text: 'Le tour copte peut exprimer la disposition ou l’intention, voire l’imminence. On pourrait aussi traduire : « maintenant, je veux vous les dire » ou « je suis sur le point de vous les dire ».'
    reason: alternative lexicale
  - marker: d
    text: La paire « cherchez… trouverez » rappelle Matthieu 7.7 et Luc 11.9, mais la parole de Thomas se poursuit autrement, en opposant le passé au présent.
    reason: renvoi intertextuel
  - marker: e
    text: 'Autre ponctuation possible : « Mais les choses au sujet desquelles vous m’avez interrogé en ces jours-là, et que je ne vous ai pas dites ce jour-là : maintenant, je suis prêt à vous les dire, et vous ne les cherchez pas. »'
    reason: alternative syntaxique
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: chercher / cherchez
  rationale: Le verbe désigne une recherche active. « Cherchez » conserve la forme impérative brève et son association avec « trouver ».
- source_word: ϭⲓⲛⲉ
  choice: trouver / trouverez
  rationale: C’est le correspondant direct et courant de ϣⲓⲛⲉ dans cette formule.
- source_word: ⲁⲗⲗⲁ
  choice: mais
  rationale: Ce mot d’emprunt grec marque ici un contraste net entre l’exhortation initiale et le reproche qui suit.
- source_word: ⲛⲉⲧⲁ… / ⲡⲉⲧⲉⲣⲉ…
  choice: les choses
  rationale: Bien que la normalisation permette une lecture formellement singulière, les reprises pronominales au pluriel dans le manuscrit favorisent ici le pluriel.
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: sur lesquelles vous m’avez interrogé
  rationale: Cette formulation rend à la fois la personne interrogée (« me ») et les sujets au sujet desquels porte l’interrogation.
- source_word: ⲛⲛⲓϩⲟⲟⲩ
  choice: en ces jours-là
  rationale: Le tour temporel garde le mot « jours » et prépare sa reprise au singulier dans « ce jour-là ».
- source_word: ⲙⲫⲟⲟⲩ ⲉⲧⲙⲙⲁⲩ
  choice: ce jour-là
  rationale: La traduction préserve la mention explicite du « jour », plutôt que de la réduire au simple adverbe « alors ».
- source_word: ϫⲱ / ϫⲟⲟⲩ
  choice: dire
  rationale: Avec le contenu repris par un pronom et le destinataire introduit en français, « vous les dire » est naturel et proche du copte.
- source_word: ⲧⲉⲛⲟⲩ
  choice: maintenant
  rationale: L’adverbe temporel explicite oppose le moment présent aux jours évoqués auparavant.
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: je suis prêt à vous les dire
  rationale: La périphrase exprime la disposition, l’intention ou l’imminence. « Être prêt à » rend la disponibilité sans imposer une nuance trop fortement volontaire.
- source_word: ⲛⲥⲱⲟⲩ
  choice: vous ne les cherchez pas
  rationale: La préposition peut introduire ce qui est recherché; le pronom objet direct donne en français une expression claire et fidèle.
theological_decisions:
- issue: Nature de la disposition présente de Jésus à parler
  choice: je suis prêt à vous les dire
  alternative: je veux vous les dire / je suis sur le point de vous les dire
  rationale: Le copte peut exprimer disposition, intention ou imminence. La traduction retient une formulation qui laisse ouverte la force exacte du tour et n’en tire aucune conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la brièveté de l’ouverture, la répétition de « jour(s) », le contraste entre passé et présent, ainsi que le paradoxe final. Le tutoiement collectif du copte est rendu par « vous », sans marquage confessionnel.
