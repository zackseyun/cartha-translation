revisions:
- from: 'Jésus dit : « Qu’êtes-vous allés voir dans le désert[a] ? Un roseau agité par le vent ? Et une personne vêtue d’habits doux[b] ? Regardez : ceux qui portent des habits doux sont dans la demeure de votre roi et de votre dignitaire[c][d], et ils ne peuvent pas connaître la vérité[e]. »'
  to: 'Jésus dit : « Qu’êtes-vous allés voir dans le désert[a] ? Un roseau agité par le vent ? Et une personne ayant des vêtements doux[b] sur elle ? Regardez : ceux qui portent des vêtements doux sont dans la maison de votre roi et de votre dignitaire[c][d], et ils ne peuvent pas connaître la vérité[e]. »'
  rationale: La révision conserve le sens et les ambiguïtés du copte, tout en restituant plus visiblement la double mention des vêtements et la construction concrète « vêtements ... sur elle ». « Maison » rend directement le substantif source et la note de restauration est ancrée sur l’ensemble du passage reconstitué. Aucun enjeu doctrinal n’est introduit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:37:08Z'
review_pass:
