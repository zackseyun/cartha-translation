    issue: La formulation « une personne vêtue d’habits doux » ne reflète pas pleinement la répétition de « vêtements » dans la tournure copte.
    rationale: Le texte décrit « une personne [ayant] des vêtements doux, des vêtements placés sur elle », puis reprend les personnes « aux vêtements doux ». Une formulation française qui conserve « vêtements » dans les deux membres respecte mieux l’imagerie sans sacrifier la lisibilité.
  - severity: low
    issue: « Demeure » est légèrement plus élevé et moins direct que le mot source pour « maison ».
    rationale: ⲏⲉ signifie d’abord « maison » ; « maison de votre roi et de votre dignitaire » est naturel en français moderne et conserve l’étrangeté institutionnelle des deux singuliers.
