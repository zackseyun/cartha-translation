base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: fr
  text: 'Jésus dit : « Qu’êtes-vous allés voir dans le désert[a] ? Un roseau agité par le vent ? Et une personne ayant des vêtements doux[b] sur elle ? Regardez : ceux qui portent des vêtements doux sont dans la maison de votre roi et de votre dignitaire[c][d], et ils ne peuvent pas connaître la vérité[e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte peut aussi se traduire par « région sauvage » ou « lieu désert » ; il ne désigne pas nécessairement un désert de sable.
    reason: lexical_alternative
  - marker: b
    text: L’expression décrit littéralement des vêtements « doux » ; selon le contexte, on pourrait aussi traduire « fins » ou « délicats ».
    reason: lexical_alternative
  - marker: c
    text: 'Le manuscrit est endommagé à cet endroit. La traduction suit le texte reconstitué de l’édition, qui porte le singulier : « dans la maison de votre roi et de votre dignitaire ».'
    reason: lacuna_or_restoration
  - marker: d
    text: « Dignitaire » traduit un emprunt au grec μεγιστανός, qui peut désigner un grand personnage, un notable ou un haut placé.
    reason: lexical_alternative
  - marker: e
    text: « Connaître la vérité » pourrait aussi se rendre par « reconnaître » ou « comprendre la vérité » ; le verbe copte possède un sens assez large.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: Qu’êtes-vous allés voir
  rationale: 'Dans cette construction, l’interrogatif porte naturellement sur l’objet de la sortie et de la vision, plutôt que sur sa cause : « qu’… voir ? ».'
- source_word: ⲡⲥⲱϣⲉ
  choice: le désert
  rationale: Le terme désigne le désert ou une région sauvage. « Désert » est idiomatique en français biblique moderne sans imposer nécessairement un paysage sablonneux.
- source_word: ⲟⲩⲕⲁϣ
  choice: un roseau
  rationale: « Roseau » convient à l’image d’une tige remuée par le vent et conserve son écho proverbial.
- source_word: ⲕⲓⲙ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: agité par le vent
  rationale: Le verbe exprime le mouvement causé par le vent ; « agité » est naturel et reste proche de l’image source.
- source_word: ⲟⲩⲣⲱⲙⲉ
  choice: une personne
  rationale: Le nom peut désigner un être humain de façon générique ; « personne » évite de restreindre inutilement le référent à un homme.
- source_word: ⲛϣⲧⲏⲛ
  choice: habits doux
  rationale: Le mot caractérise la douceur des vêtements. Cette formulation préserve l’expression concrète et légèrement inhabituelle du copte.
- source_word: ϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ
  choice: vêtue
  rationale: La tournure périphrastique indique que les vêtements sont portés sur la personne ; « vêtue » produit un français naturel sans ajouter l’idée de luxe.
- source_word: ⲛ ⲡⲏⲉ
  choice: dans la demeure
  rationale: Le substantif locatif est singulier. « Demeure » convient à la résidence d’un roi ou d’un haut dignitaire et évite la lourdeur de « maison » dans ce contexte.
- source_word: ⲡⲉⲧⲛⲣⲣⲟ
  choice: votre roi
  rationale: Le singulier et le possessif de deuxième personne du pluriel sont conservés.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: dignitaire
  rationale: Cet emprunt grec désigne un grand personnage ou un haut placé. « Dignitaire » est clair et soutenu sans être archaïque.
- source_word: ϣⲥⲟⲟⲩⲛⲡⲙⲉ
  choice: connaître la vérité
  rationale: Le verbe couvre les sens de connaître, comprendre ou reconnaître ; « connaître » préserve cette amplitude et l’expression traditionnelle.
theological_decisions:
- issue: Rapport entre richesse, pouvoir et connaissance de la vérité
  choice: Conserver l’affirmation directe selon laquelle les personnes vêtues d’habits doux dans la demeure des puissants ne peuvent connaître la vérité.
  alternative: Atténuer en disant qu’elles « ne reconnaissent pas » ou « ne comprennent pas » la vérité.
  rationale: Le texte formule une incapacité avec ⲛⲁϣ…ⲁⲛ. Il ne faut ni réduire cette tension à une simple faute de perception, ni développer une doctrine sociale absente du logion.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques restent brèves. « Habits doux » conserve l’étrangeté significative de l’expression source, tandis que « vêtue » rend naturellement la périphrase copte. Les singuliers « votre roi » et « votre dignitaire » sont maintenus malgré la formulation plurielle plus familière des parallèles canoniques.
