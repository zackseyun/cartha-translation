  source_fidelity: La traduction rend correctement les questions rhétoriques, le roseau mû par le vent, le singulier restauré « votre roi et votre dignitaire » et l’incapacité à connaître la vérité. Toutefois, le copte répète explicitement « vêtements » pour la seconde occurrence et présente la personne comme ayant des vêtements doux placés sur elle ; « vêtue d’habits doux » lisse cette répétition et modifie légèrement la formulation concrète.
  naturalness: Le français est globalement naturel et de registre approprié. « Habits doux » demeure volontairement inhabituel, conformément à l’expression source. « Des vêtements doux » est plus idiomatique que « habits doux » tout en gardant cette étrangeté. La reprise « ceux qui portent des vêtements doux » clarifie le contraste sans surinterprétation.
  terminology: « Désert », « roseau », « dignitaire » et « vérité » conviennent. « Demeure » est possible pour ⲏⲉ, mais « maison » est le correspondant direct, moderne et non lourd ; il faut éviter de rehausser indûment le registre. Le marqueur de la note de lacune doit être placé sur le segment restauré plutôt qu’après « dignitaire ».
  issues:
