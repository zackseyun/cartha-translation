base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: fr
  text: '⟨Ils virent⟩[a] un Samaritain qui portait un agneau et se rendait en Judée. Il dit à ses disciples : « Celui-là, autour de l’agneau ? »[b]


    Ils lui répondirent : « Pour le tuer et le manger. »


    Il leur dit : « Tant que l’agneau est vivant, il ne le mangera pas. Mais s’il le tue, il devient un cadavre. »


    Ils dirent : « Autrement, il ne pourra pas le faire. »


    Il leur dit : « Vous aussi, cherchez pour vous-mêmes un lieu dans le repos, de peur que vous ne deveniez des cadavres et qu’ils ne vous mangent. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit porte littéralement « à un Samaritain » sans verbe principal. Les éditeurs rétablissent « ils virent » (ⲁⲩⲛⲁⲩ) d’après le contexte.
    reason: textual_variant
  - marker: b
    text: 'Le copte est elliptique : littéralement, « Celui-là, autour de l’agneau ? » La réponse des disciples montre qu’ils comprennent la question comme portant sur l’intention de l’homme.'
    reason: lexical_alternative
  - marker: c
    text: 'Le copte emploie une tournure active avec un sujet pluriel non identifié : « et qu’ils ne vous mangent », plutôt qu’un passif comme « et que vous ne soyez pas mangés ». Après « de peur que », les « ne » français sont explétifs et ne nient pas l’action redoutée.'
    reason: register_note
lexical_decisions:
- source_word: ⲥⲁⲙⲁⲣⲉⲓⲧⲏⲥ
  choice: Samaritain
  rationale: Correspondant français direct du nom ethnique grec transmis par le copte.
- source_word: ϩⲓⲉⲓⲃ
  choice: agneau
  rationale: Le terme désigne un agneau ou jeune mouton; « agneau » convient au contexte où l’animal est porté puis destiné à être mangé.
- source_word: ⲡⲏ ⲙ̄ⲡⲕⲱⲧⲉ ⲙ̄ⲡⲉϩⲓⲉⲓⲃ
  choice: Celui-là, autour de l’agneau ?
  rationale: La formulation volontairement elliptique conserve le démonstratif et la locution « autour de/au sujet de », sans introduire un « pourquoi » absent du texte.
- source_word: ⲡⲧⲱⲙⲁ
  choice: cadavre
  rationale: Emprunt au grec πτῶμα, qui désigne ici un corps mort; la répétition française préserve le lien entre l’agneau et l’avertissement adressé aux disciples.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: repos
  rationale: Emprunt au grec ἀνάπαυσις; « repos » garde la portée concrète et spirituelle du terme sans la préciser doctrinalement.
- source_word: ⲛ̄ⲥⲉⲟⲩⲱⲙⲧⲏⲩⲧⲛ
  choice: qu’ils ne vous mangent pas
  rationale: Conserve le sujet indéfini à la troisième personne du pluriel et l’image active, plutôt que de transformer la proposition en passif.
theological_decisions:
- issue: Sens du « repos »
  choice: Conserver simplement « le repos »
  alternative: Expliciter comme salut, Royaume ou état spirituel final
  rationale: Le mot peut avoir une portée eschatologique ou spirituelle dans Thomas, mais le passage ne définit pas cette portée; l’explicitation supprimerait une ambiguïté réelle.
- issue: Rapport entre le cadavre de l’agneau et celui des disciples
  choice: Répéter « cadavres » sans expliquer l’image
  alternative: Paraphraser en termes de mort spirituelle ou de vulnérabilité
  rationale: Le texte établit une analogie saisissante sans identifier ceux qui mangent ni préciser la nature de la mort; la traduction maintient cette tension.
- issue: Question elliptique de Jésus
  choice: « Celui-là, autour de l’agneau ? »
  alternative: « Pourquoi cet homme porte-t-il l’agneau ? »
  rationale: La réponse des disciples laisse entendre une question de but, mais la syntaxe copte reste elliptique; une traduction explicative serait plus claire mais moins fidèle à la forme transmise.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct; les ellipses et les images déroutantes du copte sont conservées, tandis que les référents sont ponctuellement répétés (« l’agneau ») pour éviter une ambiguïté pronominale artificielle en français.
