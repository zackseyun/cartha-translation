base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: fr
  text: 'Jésus dit : « Celui qui connaît le Tout[a], mais manque de lui-même[b][c], est déficient à tous égards[d][e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Tout » traduit ⲡⲧⲏⲣϥ. On pourrait aussi comprendre « la totalité » ou « toutes choses » ; l’expression peut avoir ici une portée cosmique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la construction peut se rendre par « manque de lui-même ». Elle peut aussi évoquer quelqu’un qui est déficient en lui-même ou qui se trouve seul dans le manque.
    reason: lexical_alternative
  - marker: c
    text: Comparer Marc 8.36, Matthieu 16.26 et Luc 9.25, où gagner le monde entier est opposé à la perte de soi ; le vocabulaire de Thomas demeure toutefois distinct.
    reason: cross_reference
  - marker: d
    text: 'En NH II, 45.20, le second pronom sujet est restitué par l’éditeur : ⟨ϥ⟩. Son omission probable par le copiste ne change pas le sens général.'
    reason: lacuna_or_restoration
  - marker: e
    text: '« À tous égards » rend une expression copte de totalité employée adverbialement ; autres traductions possibles : « entièrement » ou « tout à fait ».'
    reason: dialect_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (dans ⲡⲉⲧⲥⲟⲟⲩⲛ)
  choice: connaît
  rationale: La construction est un relatif présent, non un parfait relatif. « Connaît » préserve donc la portée présente et générale de la maxime.
- source_word: ⲡⲧⲏⲣϥ
  choice: le Tout
  rationale: Le substantif désigne littéralement la totalité. « Le Tout » conserve la possible portée cosmique et l’étrangeté voulue du propos, sans la réduire à « tout » ou « toutes choses ».
- source_word: ⲣϭⲣⲱϩ
  choice: manque de / est en manque
  rationale: Le verbe exprime le manque, le besoin ou la déficience. La répétition de « manque » dans les deux membres conserve le lien lexical du copte.
- source_word: ⲟⲩⲁⲁϥ
  choice: lui-même
  rationale: La construction associant « seul » au pronom peut recevoir une nuance réflexive. « Manque de lui-même » garde le paradoxe sans préciser indûment s’il s’agit du soi, d’une déficience intérieure ou du fait d’être seul.
- source_word: ⲙ̄ⲡⲙⲁ ⲧⲏⲣϥ
  choice: à tous égards
  rationale: Cette expression de totalité fonctionne ici adverbialement. « À tous égards » rend l’étendue complète de la déficience sans faire du dernier membre une simple liste de choses manquantes.
theological_decisions:
- issue: Portée de « le Tout »
  choice: Maintenir « le Tout » sans explication doctrinale dans le corps du texte.
  alternative: Traduire « toutes choses » ou « le monde entier ».
  rationale: Le contexte autorise une portée cosmique, mais ne l’impose pas avec assez de précision pour identifier « le Tout » à un système métaphysique particulier.
- issue: Nature du manque de soi
  choice: Conserver la formulation paradoxale « manque de lui-même ».
  alternative: Expliciter par « ne se connaît pas lui-même », « a perdu son âme » ou « est intérieurement déficient ».
  rationale: Le copte parle de manque et non explicitement d’ignorance de soi, de perte de l’âme ou d’une doctrine anthropologique déterminée. L’ambiguïté doit rester ouverte.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La répétition de « manque » reproduit la structure du copte, tandis que « le Tout » et « manque de lui-même » conservent volontairement la densité et l’ambiguïté du logion.
