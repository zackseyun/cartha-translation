  to: 'Jésus dit : « Celui qui connaît le Tout[a], mais manque de lui-même[b][c], est déficient à tous égards[d][e]. »'
  rationale: La révision remplace seulement la tournure non idiomatique « est en manque à tous égards » par « est déficient à tous égards » et place l’ancre de restauration sur le membre auquel elle se rapporte. Elle maintient le présent gnomique, l’ambiguïté de « le Tout » et de « manque de lui-même », et l’extension totale de la déficience.
