    issue: Rendre explicitement le pronom datif dans les deux premières clauses.
    rationale: Le copte emploie ⲛⲁⲛⲧⲟϥ, « à lui ». « Il lui sera pardonné » reproduit cette construction sans ajouter l’objet implicite du pardon ni identifier son agent.
