base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: fr
  text: 'Jésus dit : « Celui qui blasphémera contre le Père, il lui sera pardonné ; et celui qui blasphémera contre le Fils, il lui sera pardonné. Mais celui qui blasphémera contre l’Esprit saint ne recevra pas le pardon, ni sur la terre ni dans le ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  choice: blasphémer contre
  rationale: Le verbe copte désigne le fait de blasphémer ou de proférer une malédiction. « Blasphémer contre » restitue ici son sens religieux précis et convient aux trois compléments parallèles.
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: être pardonné
  rationale: Le copte emploie un actif à la troisième personne du pluriel, littéralement « ils lui pardonneront », comme tournure impersonnelle à valeur passive. Le passif français est naturel et conserve l’agent implicite.
- source_word: ⲡⲕⲁϩ
  choice: la terre
  rationale: Dans l’opposition cosmique avec le ciel, ⲕⲁϩ désigne naturellement la terre.
- source_word: ⲧⲡⲉ
  choice: le ciel
  rationale: Traduction directe du terme copte dans le couple spatial « terre / ciel ».
- source_word: ⲡⲡⲛⲉⲩⲙⲁ ⲉⲧⲟⲩⲁⲁⲃ
  choice: l’Esprit saint
  rationale: Rend littéralement le groupe « l’Esprit qui est saint » dans la formulation française consacrée, sans ajouter d’interprétation.
theological_decisions:
- issue: Cadre spatial ou temporel de la non-rémission
  choice: ni sur la terre ni dans le ciel
  alternative: ni dans ce monde ni dans le monde à venir
  rationale: Le texte copte présente explicitement une opposition spatiale entre la terre et le ciel. La formulation temporelle de certains parallèles synoptiques ne doit pas être importée.
- issue: Agent du pardon
  choice: 'passif sans agent explicite : « sera pardonné »'
  alternative: « ils lui pardonneront »
  rationale: Le pluriel copte fonctionne comme une tournure impersonnelle passive. La traduction n’identifie donc pas explicitement Dieu ou un autre agent, préservant l’implicite du texte.
translation_notes:
  register: Français moderne, international et digne. Le futur « blasphémera / sera pardonné » maintient la forme prospective du copte; la répétition des trois propositions est conservée pour respecter la structure rhétorique. Aucun appel de note n’est nécessaire.
