  to: 'Jésus dit : « Celui qui blasphémera contre le Père, il lui sera pardonné ; et celui qui blasphémera contre le Fils, il lui sera pardonné. Mais celui qui blasphémera contre l’Esprit saint ne recevra pas le pardon, ni sur la terre ni dans le ciel. »'
  rationale: La révision conserve la structure prospective et les répétitions du copte. Les deux premières propositions emploient l’impersonnel français pour rendre le pluriel actif copte à valeur passive avec son datif explicite. Dans la dernière proposition, « ne recevra pas le pardon » évite une formulation française maladroite telle que « il ne lui sera pas pardonné » tout en conservant la même valeur passive et l’agent non exprimé.
