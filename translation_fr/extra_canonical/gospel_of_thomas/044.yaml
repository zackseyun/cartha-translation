  naturalness: Le français est naturel, sobre et de registre approprié. La tournure « il lui sera pardonné » est particulièrement idiomatique dans ce contexte et maintient l’implicite de l’agent.
  terminology: « Père », « Fils » et « Esprit saint » sont adéquats. La minuscule à « saint » correspond à l’usage français courant dans le groupe nominal « l’Esprit saint » et ne diminue pas son référent.
