base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: fr
  text: 'Jésus dit : « Adam est venu à l’existence à partir d’une grande puissance et d’une grande richesse, mais il n’est pas devenu digne de vous[a]. Car s’il en avait été digne, il n’aurait pas goûté la mort[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit est endommagé à l’endroit du mot traduit par « digne ». La restitution habituellement adoptée est fortement soutenue par les lettres conservées, le contexte et l’espace disponible.
    reason: textual_variant
  - marker: b
    text: 'Le manuscrit est aussi lacunaire dans l’expression traduite par « il aurait goûté ». La restitution habituellement adoptée correspond au contexte et à la place disponible. La tournure copte exprime ici une condition irréelle : « s’il en avait été digne, il n’aurait pas goûté la mort ».'
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: est venu à l’existence
  rationale: Cette expression désigne le fait de venir à l’existence ou d’avoir son origine; la formulation française évite de préciser sans nécessité qu’Adam serait « né ».
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: une grande puissance
  rationale: L’article ⲟⲩ est singulier et ⲛ relie l’adjectif au nom; le texte parle donc d’une grande puissance, non de plusieurs puissances.
- source_word: ⲟⲩⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: une grande richesse
  rationale: Le nom abstrait exprime la richesse ou l’abondance de biens; le singulier français suit la construction copte.
- source_word: ⲙⲡϣⲁ
  choice: digne
  rationale: « Digne » rend directement l’idée d’être à la hauteur ou de mériter, tout en conservant la relation inhabituelle « digne de vous ».
- source_word: ϫⲓ ϯⲡⲉ
  choice: goûté
  rationale: Il s’agit de l’expression idiomatique « goûter », ici avec « la mort »; le nom ϯⲡⲉ ne désigne pas un lieu.
theological_decisions:
- issue: Rapport d’origine exprimé par ϩⲛ
  choice: à partir d’une grande puissance et d’une grande richesse
  alternative: par une grande puissance et une grande richesse
  rationale: « À partir de » préserve l’idée d’origine sans décider si la puissance et la richesse sont des agents, des moyens ou une réalité dont Adam serait issu.
- issue: Sens de ⲙⲡⲉϥϣⲱⲡⲉ ⲉϥⲙⲡϣⲁ
  choice: il n’est pas devenu digne de vous
  alternative: il ne s’est pas trouvé digne de vous
  rationale: La traduction conserve le verbe « devenir » et ne résout pas la tension entre la grandeur de l’origine d’Adam et son absence de dignité à l’égard des destinataires.
- issue: Valeur de la dernière proposition conditionnelle
  choice: s’il en avait été digne, il n’aurait pas goûté la mort
  alternative: s’il était digne, il ne goûterait pas la mort
  rationale: La construction copte présente une condition irréelle liée à un résultat contraire aux faits; le plus-que-parfait et le conditionnel passé français rendent cette valeur sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du copte, mais la condition irréelle est formulée idiomatiquement en français. Le pluriel « vous » est conservé, de même que l’expression traditionnelle « goûter la mort ».
