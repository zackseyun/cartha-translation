base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: fr
  text: 'Jésus dit : « Peut-être les gens pensent-ils que je suis venu jeter la paix sur le monde. Ils ne savent pas que je suis venu jeter des divisions sur la terre : le feu, l’épée, la guerre. Car cinq seront dans une maison : trois seront contre deux, et deux contre trois, le père contre le fils et le fils contre le père. Et ils se tiendront debout, solitaires[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec transcrit en copte peut signifier « solitaires » ou « personnes seules ». Il donnera aussi le sens de « moines », mais ce sens institutionnel n’est pas nécessairement celui du présent texte.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: Peut-être
  rationale: L’emprunt grec τάχα introduit ici ce que les gens supposent; « peut-être » rend naturellement cette nuance sans la transformer en certitude.
- source_word: ⲛⲟⲩϫⲉ
  choice: jeter
  rationale: Le verbe signifie « jeter, lancer ». Le même terme régit la paix puis les divisions; conserver « jeter » maintient cette répétition frappante et le paradoxe du texte.
- source_word: ⲡⲱⲣϫ
  choice: des divisions
  rationale: Le substantif désigne une séparation ou une division. Le pluriel français convient à la forme du manuscrit et à l’énumération qui suit.
- source_word: ⲉϫⲛ
  choice: contre
  rationale: 'Dans les expressions numériques et familiales, la préposition marque l’opposition: « trois contre deux », « le père contre le fils ».'
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: se tiendront debout
  rationale: L’expression signifie littéralement se tenir sur ses pieds; « se tenir debout » en conserve l’image sans lourdeur excessive.
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitaires
  rationale: Cet emprunt au grec μοναχός peut désigner des personnes seules ou singulières. « Solitaires » évite l’anachronisme possible de « moines » tout en conservant l’ambiguïté du terme.
theological_decisions:
- issue: Portée de ⲙⲟⲛⲁⲭⲟⲥ à la fin du logion
  choice: solitaires
  alternative: seuls; êtres unifiés; moines
  rationale: Le texte ne définit pas explicitement si cette solitude est sociale, spirituelle ou les deux. La traduction ne précise donc pas une doctrine d’unification intérieure et n’importe pas non plus le sens institutionnel plus tardif de « moine ».
- issue: Rapport entre la mission de Jésus et la paix
  choice: Maintien de l’opposition non résolue entre paix supposée et divisions annoncées
  alternative: Expliquer les divisions comme simple conséquence indirecte du message
  rationale: Le texte affirme de manière abrupte que Jésus est venu « jeter » des divisions, puis énumère feu, épée et guerre. La traduction conserve cette tension sans l’atténuer par une explication théologique absente de la source.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe demeure proche du rythme sentencieux du copte. Le choix volontairement inhabituel de « jeter la paix » et « jeter des divisions » reproduit la répétition du même verbe dans la source; la ponctuation française clarifie l’énumération sans en expliquer la portée.
