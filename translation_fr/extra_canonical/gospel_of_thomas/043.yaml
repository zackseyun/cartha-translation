base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Qui es-tu, toi qui nous dis ces choses ? »


    « D’après ce que je vous dis, vous ne savez pas qui je suis.[a] Mais vous, vous êtes devenus comme les Juifs : ils aiment l’arbre, ils détestent son fruit ; et ils aiment le fruit, ils détestent l’arbre.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure copte peut aussi se comprendre comme une question rhétorique : « Ne savez-vous pas qui je suis ? »'
    reason: ambiguïté syntaxique
  - marker: b
    text: Le copte juxtapose « ils aiment » et « ils détestent » sans conjonction adversative, ce qui accentue la contradiction.
    reason: caractéristique stylistique du texte source
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: savoir
  rationale: Le verbe signifie « savoir, connaître, comprendre ». Devant la proposition « qui je suis », « savoir » donne en français courant la tournure la plus naturelle sans réduire le sens à une simple reconnaissance visuelle.
- source_word: ϣⲱⲡⲉ
  choice: être devenus
  rationale: 'L’accompli ⲁⲧⲉⲧⲛ̄ϣⲱⲡⲉ indique ici l’entrée dans un état : « vous êtes devenus ».'
- source_word: ϣⲏⲛ
  choice: arbre
  rationale: Équivalent direct et usuel du nom copte.
- source_word: ⲙⲉ
  choice: aimer
  rationale: Le choix conserve l’opposition lexicale nette avec ⲙⲟⲥⲧⲉ, « détester ».
- source_word: ⲙⲟⲥⲧⲉ
  choice: détester
  rationale: « Détester » exprime naturellement en français moderne l’opposition forte à « aimer » ; « haïr » serait possible, mais plus marqué dans le registre courant.
- source_word: ϩⲛ̄ ⲛⲉϯϫⲱ ⲙ̄ⲙⲟⲟⲩ ⲛⲏⲧⲛ̄
  choice: D’après ce que je vous dis
  rationale: La formule rend la préposition ϩⲛ̄ et la référence aux choses dites, sans reprendre la lecture erronée « dans vos oreilles ».
theological_decisions:
- issue: Déclaration ou question dans la réponse de Jésus
  choice: 'Déclaration : « vous ne savez pas qui je suis »'
  alternative: 'Question rhétorique : « ne savez-vous pas qui je suis ? »'
  rationale: La déclaration suit directement la syntaxe négative copte et prépare naturellement le reproche introduit par « Mais » ; la possibilité interrogative est signalée en note.
- issue: Désignation « les Juifs »
  choice: Conserver la désignation non qualifiée du texte source
  alternative: Paraphraser ou préciser un groupe particulier de Juifs
  rationale: Le copte porte bien ⲛⲓⲓ̈ⲟⲩⲇⲁⲓⲟⲥ. Ajouter une qualification résoudrait ou atténuerait sans preuve la tension polémique du texte.
- issue: Rapport symbolique entre l’arbre et son fruit
  choice: Conserver l’image sans en identifier les référents
  alternative: Expliciter l’arbre et le fruit comme représentant Jésus, ses paroles, la tradition ou un autre référent
  rationale: Le logion ne fournit pas lui-même cette identification ; l’expliciter importerait une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement pluriel est imposé par la scène de maître à disciples. La reprise emphatique « Mais vous, vous… » rend le pronom indépendant copte. La ponctuation française préserve autant que possible les juxtapositions antithétiques du texte.
