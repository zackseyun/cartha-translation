base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: fr
  text: 'Un disciple dit à Jésus : « Dis-nous à quoi ressemble le royaume des cieux.[a] » Il leur dit : « Il ressemble à une graine de moutarde,[b] la plus petite de toutes les graines. Mais lorsqu’elle tombe sur une terre cultivée,[c] elle produit une grande branche et devient un abri[d] pour les oiseaux du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Dis-nous : le royaume des cieux est semblable à quoi ? » Le texte dit bien « des cieux », et non « de Dieu ».'
    reason: source_form_and_textual_distinction
  - marker: b
    text: 'Littéralement : « un grain de moutarde ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sur la terre qu’ils travaillent », expression désignant un sol cultivé.'
    reason: cultural_note
  - marker: d
    text: Le mot copte peut aussi signifier « ombre » ou « couverture » protectrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Dis-nous
  rationale: L’impératif signifie littéralement « dis à nous » ; « Dis-nous » est la formulation française naturelle et directe.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: le royaume des cieux
  rationale: ⲙⲛⲧⲣⲣⲟ peut désigner le royaume ou le règne, et ⲡⲡⲉ le ciel ou les cieux. La formule conserve ici le pluriel du texte copte sans la remplacer par « royaume de Dieu ».
- source_word: ⲉⲛⲓⲙ
  choice: à quoi ressemble
  rationale: 'L’interrogatif porte sur la ressemblance ou la manière : « comme quoi ? / comment ? ».'
- source_word: ⲁⲟⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  choice: une graine de moutarde
  rationale: Littéralement « un grain de moutarde » ; « graine de moutarde » restitue naturellement l’image en français.
- source_word: ⲛⲧⲟⲥ ⲥⲃⲟⲕ ⲡⲁⲣⲁⲡϭⲣⲟϭ ⲧⲏⲣⲛⲧⲟⲟⲩ
  choice: la plus petite de toutes les graines
  rationale: La comparaison avec toutes les graines a ici une valeur superlative.
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲟⲥ ϩⲉ
  choice: lorsqu’elle tombe
  rationale: La construction temporelle exprime ce qui arrive quand la graine tombe.
- source_word: ⲉϫⲛⲡⲕⲁϩ ⲉⲧⲉⲣⲉⲛⲧⲟⲟⲩⲣϩⲱⲃ ⲉⲛⲧⲟϥ
  choice: sur une terre cultivée
  rationale: La relative signifie littéralement « sur la terre qu’ils travaillent » ; le contexte agricole justifie « terre cultivée ».
- source_word: ϣⲁⲣⲉⲛⲧⲟϥⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛⲟⲩⲛⲟϭ ⲛⲧⲁⲣ
  choice: elle produit une grande branche
  rationale: ⲧⲁⲣ désigne une branche ou un rameau ; le verbe exprime le fait de faire sortir ou produire.
- source_word: ⲥⲕⲉⲡⲏ
  choice: abri
  rationale: Le mot peut désigner un abri, une couverture ou de l’ombre ; « abri » convient à la fonction offerte aux oiseaux sans effacer les autres nuances, signalées en note.
- source_word: ϩⲁⲗⲏⲧ ⲛⲡⲡⲉ
  choice: les oiseaux du ciel
  rationale: Traduction directe de l’expression désignant les oiseaux du ciel ou des airs.
theological_decisions:
- issue: Désignation du royaume
  choice: royaume des cieux
  alternative: royaume de Dieu / règne des cieux
  rationale: Le texte copte dit explicitement « des cieux ». La traduction ne l’harmonise pas avec les formulations d’autres traditions évangéliques et conserve l’ambivalence de ⲙⲛⲧⲣⲣⲟ entre domaine royal et exercice du règne.
- issue: Nature de la croissance décrite
  choice: une grande branche
  alternative: une grande plante
  rationale: Le substantif ⲧⲁⲣ désigne spécifiquement une branche ou un rameau. Cette lecture maintient l’image propre au témoin copte sans l’aligner sur les versions synoptiques.
translation_notes:
  register: Français international moderne, simple et digne. Le dialogue demeure direct, la répétition « ressemble » conserve la structure de la comparaison, et les notes se limitent aux nuances lexicales ou textuelles utiles.
