    rationale: 'La périphrase « être en train de vivre » est possible, mais elle est inutilement progressive : le copte signifie plus sobrement « celui qui vit / celui qui est vivant ». La note doit éviter de présenter cette nuance aspectuelle comme littérale.'
  - severity: low
