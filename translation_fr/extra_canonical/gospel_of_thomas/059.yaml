  source_fidelity: 'La structure copte exprime un avertissement : chercher le Vivant pendant que l’on vit, afin d’éviter de mourir puis de chercher à le voir sans en avoir la capacité. Le « puis » du brouillon rend correctement la succession, mais sa subordination à « afin que » est grammaticalement et sémantiquement mal formée en français.'
  naturalness: La formulation proposée est fluide en français international contemporain. « Celui qui vit » rend la relative copte plus idiomatiquement que « celui qui est vivant », tout en évitant d’imposer une lecture titularisée.
  terminology: « Cherchez » conserve le verbe de recherche, y compris sa récurrence dans la seconde proposition. « Celui qui vit » préserve la forme relative de ⲡⲉⲧⲉⲣⲉⲱⲛϩ sans décider s’il s’agit d’un titre. « Sans pouvoir le voir » rend explicitement l’incapacité finale et maintient le pronom référant au même personnage.
