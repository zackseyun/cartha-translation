base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: fr
  text: 'Jésus dit : « Cherchez celui qui vit[a] tant que vous vivez, de peur de mourir, puis de chercher à le voir sans pouvoir le voir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui vit » ou « celui qui est vivant ». On pourrait aussi traduire : « le Vivant » ; le copte est toutefois une proposition relative.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe rendu par « chercher » est le même verbe usuel de la recherche ; dans cette construction, on peut aussi comprendre : « essayer de le voir ». La dernière expression signifie littéralement qu’on ne pourra pas voir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: cherchez
  rationale: Avec ⲛⲥⲁ, le verbe exprime une recherche orientée vers quelqu’un. « Cherchez » est naturel en français et garde l’impératif concis du copte.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: celui qui est vivant
  rationale: Cette formulation rend directement la construction relative, sans imposer à l’expression le statut d’un titre ni identifier explicitement son référent.
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: tant que vous êtes en vie
  rationale: La proposition circonstancielle a ici une valeur temporelle. « Tant que » exprime clairement la période d’occasion encore ouverte.
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ
  choice: cherchiez à le voir
  rationale: ϣⲓⲛⲉ conserve le motif de la recherche, tandis que la construction avec « à le voir » exprime l’action visée sans la réduire au seul sens d’« essayer ».
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: vous ne pourrez pas voir
  rationale: ϣϭⲙϭⲟⲙ est employé idiomatiquement pour la capacité. L’absence de complément après le dernier « voir » reproduit l’ellipse du texte copte.
theological_decisions:
- issue: Statut de « celui qui est vivant »
  choice: celui qui est vivant
  alternative: le Vivant
  rationale: Le copte permet une lecture forte ou quasi titulaire, mais sa forme est celle d’une proposition relative. La traduction retient cette forme afin de ne pas trancher l’identité théologique du référent.
- issue: Rapport entre la mort et la recherche ultérieure
  choice: afin que vous ne mouriez pas, puis cherchiez à le voir
  alternative: de peur que vous ne mouriez et ne cherchiez à le voir
  rationale: 'L’ajout discret de « puis » explicite la succession suggérée par le sens, tout en conservant la tension du propos : une recherche après la mort arriverait trop tard.'
translation_notes:
  register: Français international actuel, sobre et digne. La phrase conserve la répétition de « voir » et l’ellipse finale du complément, caractéristiques de la formulation copte. Les marqueurs [a] et [b] figurent dans le texte principal.
