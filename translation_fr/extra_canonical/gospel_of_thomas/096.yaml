base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: fr
  text: 'Jésus a dit : « Le royaume du Père est comparable à une femme. Elle prit un peu de levain[a], le cacha dans de la pâte et en fit de gros pains[b].[c] Que celui qui a des oreilles entende. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte ⲥⲓⲣ désigne le levain traditionnel, c’est-à-dire une pâte fermentée servant de ferment, et non la levure commerciale moderne.
    reason: cultural_note
  - marker: b
    text: L’expression ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ peut aussi se comprendre comme « une grande quantité de pain » ou « beaucoup de pains ». « De gros pains » conserve ici l’image concrète de leur taille.
    reason: lexical_alternative
  - marker: c
    text: Plusieurs lettres sont endommagées ou restituées dans le manuscrit à cet endroit, mais la lecture générale — « une femme… le cacha dans de la pâte… en fit de gros pains » — est assurée.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: royaume
  rationale: Le terme peut désigner la royauté, le règne ou le royaume. « Royaume » conserve l’expression traditionnelle et son ouverture entre domaine et souveraineté.
- source_word: ⲡⲉⲓⲱⲧ
  choice: le Père
  rationale: Le copte désigne explicitement Dieu comme Père; cette formulation directe doit être conservée.
- source_word: ⲥϩⲓⲙⲉ
  choice: une femme
  rationale: C’est le sens courant du terme; rien dans le contexte n’impose « épouse ».
- source_word: ⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: un peu de levain
  rationale: La construction exprime une petite quantité. « Levain » convient au contexte ancien mieux que la levure commerciale moderne.
- source_word: ϩⲱⲡ
  choice: cacha
  rationale: Rend directement l’idée de cacher ou dissimuler, sans expliciter la manière dont le levain est incorporé.
- source_word: ϣⲱⲧⲉ
  choice: pâte
  rationale: Dans ce contexte de panification, le terme désigne naturellement la masse de pâte plutôt que la farine seule.
- source_word: ⲉⲓⲣⲉ … ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: en fit de gros pains
  rationale: Cette tournure française exprime le résultat de l’action et garde l’image concrète des pains, tout en signalant en note les autres lectures possibles de la grandeur ou de l’abondance.
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: des oreilles … entende
  rationale: Conserve la formule d’exhortation concise et traditionnelle du texte, avec le singulier grammatical de la source.
theological_decisions:
- issue: Sens de « royaume »
  choice: royaume du Père
  alternative: règne du Père / royauté du Père
  rationale: « Royaume » reste naturel et reconnu en français, sans trancher entièrement entre l’exercice de la souveraineté divine et son domaine.
- issue: Formule finale au masculin singulier
  choice: Que celui qui a des oreilles entende
  alternative: Que quiconque a des oreilles entende
  rationale: La formulation retenue suit de près le singulier masculin grammatical du copte sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. Le récit garde le rythme bref de la sentence copte. « Est comparable à » rend naturellement la comparaison sans alourdir la phrase; le passé simple donne à la parabole une tonalité littéraire accessible.
