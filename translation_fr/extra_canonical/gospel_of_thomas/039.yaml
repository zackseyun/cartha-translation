base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: fr
  text: 'Jésus dit : « Les pharisiens et les scribes ont pris les clés de la connaissance et les ont cachées. Ils ne sont pas entrés, et ils n’ont pas laissé entrer ceux qui désiraient entrer.[a] Mais vous, devenez avisés comme les serpents et sans malice comme les colombes.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Comparer Luc 11.52, au sujet de la clé de la connaissance, et Matthieu 23.13, au sujet de ceux qui empêchent les autres d’entrer.
    reason: cross_reference
  - marker: b
    text: 'Comparer Matthieu 10.16. Le manuscrit copte de Thomas emploie ici le pluriel : « les serpents » et « les colombes ».'
    reason: cross_reference_and_source_morphology
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ ⲙⲛ̄ⲛⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: les pharisiens et les scribes
  rationale: Le singulier collectif du premier nom désigne le groupe; le pluriel français rend naturellement les deux catégories. « Scribes » conserve la désignation historique sans la surinterpréter.
- source_word: ⲁⲩϫⲓ
  choice: ont pris
  rationale: ϫⲓ peut signifier « prendre » ou « recevoir ». « Ont pris » conserve ici la force active de l’expression et reste proche du parallèle de Luc 11.52, sans préciser illégitimement la manière dont les clés leur sont venues.
- source_word: ⲛ̄ϣⲁϣⲧ⳿ ⲛ̄ⲧⲅⲛⲱⲥⲓⲥ
  choice: les clés de la connaissance
  rationale: Le manuscrit porte un pluriel pour « clés ». Le grec d’emprunt ⲅⲛⲱⲥⲓⲥ est rendu par le mot français courant « connaissance », plutôt que par le terme technique « gnose ».
- source_word: ⲁⲩϩⲟⲡⲟⲩ
  choice: les ont cachées
  rationale: Le verbe exprime directement l’action de cacher ou dissimuler; le pronom reprend les clés.
- source_word: ⲙ̄ⲡⲟⲩⲕⲁⲁⲩ
  choice: ils n’ont pas laissé entrer
  rationale: Le complément verbal « entrer » est repris du membre précédent en français afin de rendre explicite et naturel l’ellipse copte.
- source_word: ϣⲱⲡⲉ
  choice: devenez
  rationale: Le verbe signifie proprement « devenir »; l’impératif marque une transformation demandée plutôt qu’un simple état.
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: avisés
  rationale: Ce terme grec d’emprunt évoque le discernement pratique. « Avisés » évite aussi bien une sagesse abstraite que la nuance potentiellement négative de « rusés ».
- source_word: ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: sans malice
  rationale: Le terme grec d’emprunt peut signifier « sans mélange, pur, intact » et, dans ce contraste, « candide, sans malice ». Cette formulation française exprime clairement l’absence de duplicité sans imposer l’idée juridique d’innocence.
- source_word: ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ⳿ … ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙ⳿ⲡⲉ
  choice: comme les serpents … comme les colombes
  rationale: Les formes du manuscrit comportent les articles pluriels; la traduction suit donc le pluriel attesté plutôt que le singulier du texte normalisé fourni.
theological_decisions:
- issue: Portée de « connaissance »
  choice: Conserver « connaissance » sans la qualifier
  alternative: « connaissance de Dieu », « connaissance du Royaume » ou « gnose »
  rationale: Le texte ne précise ni l’objet ni une valeur technique du mot. Ajouter un complément ou employer « gnose » résoudrait indûment cette ouverture.
- issue: Référent implicite de l’entrée
  choice: Conserver le verbe « entrer » sans destination exprimée
  alternative: « entrer dans le Royaume » ou « accéder à la connaissance »
  rationale: Le passage ne nomme pas ce dans quoi les personnes entrent. La traduction maintient cette ambiguïté théologique et métaphorique.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe brève conserve l’allure sentencieuse du texte. « Avisés » et « sans malice » forment un contraste naturel sans reproduire mécaniquement une formulation confessionnelle traditionnelle. Les ambiguïtés concernant la connaissance et le lieu d’entrée sont volontairement maintenues.
