base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Quel jour aura lieu le repos des morts, et quel jour viendra le monde nouveau ? »


    Il leur dit : « Ce que vous attendez[a] est venu, mais vous, vous ne le connaissez pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte emploie ici un démonstratif féminin, qui renvoie vraisemblablement au « repos », nom féminin dans cette langue. L’expression traduite par « attendez » signifie littéralement « regardez en avant vers ».
    reason: Préciser le référent grammatical probable et conserver la nuance de l’expression copte.
  - marker: b
    text: 'Le pronom « vous » est exprimé séparément en copte pour marquer l’insistance : « mais vous-mêmes, vous ne le connaissez pas ».'
    reason: Signaler l’emphase portée par le pronom indépendant.
lexical_decisions:
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: repos
  rationale: Ce nom d’origine grecque désigne ici le repos attendu des morts. « Repos » est naturel en français et conserve la portée spirituelle possible du terme sans l’expliciter doctrinalement.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: des morts
  rationale: Le manuscrit porte un pluriel substantivé, rendu directement par « des morts ».
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: le monde nouveau
  rationale: ⲕⲟⲥⲙⲟⲥ est un emprunt grec signifiant « monde », et ⲃⲣⲣⲉ signifie « nouveau ». L’ordre français naturel place l’adjectif après le nom.
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: attendre
  rationale: Cette expression signifie littéralement regarder en avant et, idiomatiquement, attendre ou espérer la venue de quelque chose. « Attendre » préserve le lien avec la question des disciples.
- source_word: ⲁⲥⲉⲓ
  choice: est venu
  rationale: Le parfait copte affirme que la réalité attendue est venue. Aucun adverbe correspondant à « déjà » ne figure dans le texte.
- source_word: ⲛ̄ⲧⲱⲧⲛ̄
  choice: vous, vous
  rationale: Le pronom indépendant placé avant la forme verbale marque l’insistance. La dislocation française « vous, vous » rend cette emphase naturellement.
theological_decisions:
- issue: Réalité eschatologique présente ou accomplissement futur
  choice: « Ce que vous attendez est venu »
  alternative: « Ce que vous attendez viendra »
  rationale: Le parfait ⲁⲥⲉⲓ signifie explicitement « est venu ». La traduction conserve donc la tension entre l’attente future exprimée par les disciples et l’affirmation de Jésus selon laquelle la réalité attendue est déjà présente, sans identifier davantage cette réalité.
- issue: Référent du démonstratif féminin ⲧⲏ
  choice: « Ce que vous attendez » avec une note signalant le renvoi probable au repos
  alternative: « Le repos que vous attendez »
  rationale: Le féminin copte renvoie vraisemblablement à ⲁⲛⲁⲡⲁⲩⲥⲓⲥ, « repos », mais le français ne peut reproduire cet accord puisque « repos » est masculin. La formulation retenue reste naturelle et évite d’expliciter dans le corps du texte un référent que la syntaxe copte laisse sous forme pronominale.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue conserve la répétition « Quel jour » et l’opposition appuyée « mais vous, vous ». « Monde nouveau » est préféré à une paraphrase théologique telle que « création nouvelle ».
