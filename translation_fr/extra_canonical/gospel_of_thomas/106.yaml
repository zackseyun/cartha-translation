base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: fr
  text: 'Jésus dit : « Quand vous ferez des deux un, vous deviendrez fils de l’Humain[a]. Et quand vous direz : “Montagne, déplace-toi”, elle se déplacera[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils » peut aussi se traduire par « enfants », le pluriel copte pouvant être collectif. « L’Humain » rend littéralement l’expression définie propre à ce texte. Voir aussi Thomas 22 et 48 pour le motif des deux qui deviennent un.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: Comparer Marc 11.23 ; Matthieu 17.20 et 21.21 pour le motif de la montagne déplacée.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ … ⲉⲣϣⲁⲛ
  choice: quand
  rationale: La construction introduit une condition envisagée dans l’avenir. « Quand » en conserve la concision et la portée conditionnelle sans alourdir la phrase.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: des deux un seul
  rationale: Cette formulation garde l’opposition énigmatique entre « les deux » et « un », tout en étant naturelle en français. « Un seul » explicite la valeur numérique de ⲟⲩⲁ sans résoudre le symbole.
- source_word: ⲛϣⲏⲣⲉ
  choice: des fils
  rationale: Le nom pluriel peut avoir une portée collective, mais « fils » en conserve le sens littéral marqué. La possibilité de traduire « enfants » est signalée en note.
- source_word: ⲛⲡⲣⲱⲙⲉ
  choice: de l’Humain
  rationale: Le syntagme défini désigne littéralement « l’humain » ou « l’homme ». Cette traduction préserve l’étrangeté de la formule propre à Thomas sans l’assimiler automatiquement au titre synoptique « Fils de l’homme ».
- source_word: ϫⲟⲟⲥ
  choice: vous direz
  rationale: La forme manuscrite est le verbe « dire » muni du pronom suffixe féminin singulier, qui anticipe ici la parole citée. Elle ne contient aucun adverbe signifiant « à haute voix ».
- source_word: ⲡⲧⲟⲟⲩ
  choice: Montagne
  rationale: Bien que le copte emploie l’article défini, le français omet naturellement l’article dans cette apostrophe directe.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: déplace-toi
  rationale: Le verbe exprime un mouvement, renforcé par une direction vers l’extérieur ou au loin. « Déplace-toi » restitue clairement l’ordre sans ajouter un lieu absent du texte.
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: elle se déplacera
  rationale: La construction marque le futur. Le pronom français reprend naturellement « montagne », nom féminin.
theological_decisions:
- issue: Identité des « fils de l’Humain »
  choice: Maintenir la formule « fils de l’Humain » sans l’expliquer dans le corps du texte
  alternative: « enfants de l’être humain », « fils de l’homme »
  rationale: Le texte associe cette identité au fait de rendre les deux un, mais n’en précise ni la nature ni la portée. La traduction conserve donc cette tension au lieu d’imposer une lecture christologique, anthropologique ou initiatique.
- issue: Pouvoir de déplacer la montagne
  choice: Conserver l’affirmation directe au futur
  alternative: L’interpréter comme une métaphore ou comme une promesse conditionnée par la foi
  rationale: Le texte ne précise pas si la montagne est littérale ou symbolique et ne mentionne pas explicitement la foi. La formulation française laisse cette ambiguïté intacte.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux propositions conditionnelles est conservé. La formulation demeure volontairement brève et énigmatique. Aucun équivalent de « à haute voix » n’est introduit, car la forme ϫⲟⲟⲥ du manuscrit signifie « le/la dire » et non « dire ouvertement ».
