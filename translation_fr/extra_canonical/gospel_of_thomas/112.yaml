base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: fr
  text: 'Jésus a dit : « Malheur à la chair qui dépend de l’âme[a] ! Malheur à l’âme[b] qui dépend de la chair ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe copte peut aussi se traduire par « est suspendue à » ou « s’appuie sur », avec une image plus concrète. Dans le manuscrit, le démonstratif est au féminin dans les deux propositions; cette particularité ne modifie pas le sens.
    reason: lexical_alternative_and_dialect_note
  - marker: b
    text: Le mot ⲯⲩⲭⲏ (psychè) peut aussi signifier « vie » ou « soi »; « âme » conserve ici l’opposition marquée avec la « chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: Malheur à
  rationale: Cette formule conserve la force solennelle et menaçante de l’interjection, tout en étant idiomatique en français biblique moderne.
- source_word: ⲥⲁⲣⲝ
  choice: chair
  rationale: Le terme préserve le contraste délibérément abrupt entre la chair et l’âme; « corps » atténuerait cette opposition.
- source_word: ⲯⲩⲭⲏ
  choice: âme
  rationale: « Âme » maintient ici la polarité avec « chair », tout en laissant en note les autres valeurs possibles du mot, notamment « vie » et « soi ».
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: qui dépend de
  rationale: Cette tournure exprime clairement la relation de dépendance ou d’appui, sans imposer l’image plus concrète que peuvent rendre « est suspendu à » ou « s’appuie sur ».
- source_word: ⲡⲁⲓ / MS ⲧⲁⲉⲓ
  choice: qui
  rationale: Le démonstratif suivi de la relative est naturellement intégré en français dans « la chair qui » et « l’âme qui »; la variation de genre manuscrite ne change pas le sens.
- source_word: ⲛ
  choice: à / de
  rationale: La préposition marque respectivement le destinataire de « malheur » et le complément du verbe exprimant la dépendance; le français exige ici deux rendus idiomatiques différents.
theological_decisions:
- issue: Rapport entre la chair et l’âme
  choice: Conserver les deux malédictions symétriques sans expliquer laquelle devrait dominer l’autre.
  alternative: Lire le propos comme une condamnation univoque de la chair ou, inversement, de l’âme.
  rationale: Le texte frappe successivement la chair dépendante de l’âme et l’âme dépendante de la chair. La traduction doit préserver cette tension réciproque plutôt que la résoudre doctrinalement.
translation_notes:
  register: Français international actuel, sobre et solennel. La répétition et le parallélisme du copte sont conservés. Les points d’exclamation rendent la force de l’interjection sans ajouter d’interprétation.
