base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: fr
  text: 'Jésus dit : « Celui qui boira de ma bouche[a] deviendra comme moi. Moi-même, je deviendrai lui[b], et ce qui est caché[c] lui sera révélé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « boire de ma bouche » reproduit l’image copte. La bouche peut évoquer la parole ou l’enseignement, mais le texte ne dit pas explicitement « boire mes paroles ».
    reason: cultural_note
  - marker: b
    text: 'Littéralement, la construction affirme de façon très condensée : « moi-même, je deviendrai lui ». Cette tournure inhabituelle est conservée afin de ne pas expliquer à la place du texte la réciprocité qu’il exprime.'
    reason: translation_note
  - marker: c
    text: Le manuscrit porte une forme pouvant se comprendre comme « les choses cachées », tandis que le texte normalisé l’analyse comme « ce qui est caché » ; le sens général demeure le même.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: Celui qui boira
  rationale: Le relatif à valeur future désigne ici de manière générale toute personne qui accomplira l’action. Le futur français conserve cette forme sans alourdir la phrase.
- source_word: ⲥⲱ ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: boira de ma bouche
  rationale: Le verbe signifie simplement « boire », et ⲉⲃⲟⲗ ϩⲛ indique la provenance. L’image concrète de la bouche est conservée plutôt que paraphrasée par « mes paroles ».
- source_word: ⲛ̄ⲧⲁϩⲉ / ⲛⲡⲁϩⲉ
  choice: comme moi
  rationale: La leçon manuscrite ⲛ̄ⲧⲁϩⲉ signifie littéralement « à ma manière » et forme l’expression idiomatique « comme moi » ; elle ne désigne pas un « égal » ou un « pair ».
- source_word: ϩⲱ(ⲱ)
  choice: Moi aussi
  rationale: La particule renforce et reprend le sujet. « Moi aussi » exprime naturellement en français à la fois la réciprocité et la mise en relief.
- source_word: ⲁⲛⲟⲕ ⲛⲁϣⲱⲡⲉ ⲉⲣⲉ ⲛⲧⲟϥ ⲡⲉ
  choice: je deviendrai lui
  rationale: Cette formulation volontairement saisissante conserve la réciprocité de l’énoncé copulaire sans la réduire à une simple ressemblance ni expliciter davantage l’identité évoquée.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ
  choice: ce qui est caché
  rationale: Le relatif substantivé peut avoir une portée collective. « Ce qui est caché » reste naturel en français tout en laissant le nombre indéterminé.
- source_word: ⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: lui sera révélé
  rationale: Le verbe exprime le fait de devenir manifeste, et la construction avec ⲉ désigne le bénéficiaire. Le passif français rend clairement ce rapport.
theological_decisions:
- issue: Nature de la ressemblance avec Jésus
  choice: comme moi
  alternative: mon égal
  rationale: Le texte manuscrit exprime la manière ou la ressemblance, non explicitement une égalité de rang ou d’essence. La traduction évite donc d’introduire une affirmation théologique plus forte.
- issue: Réciprocité entre Jésus et celui qui boit
  choice: Moi aussi, je deviendrai lui
  alternative: je serai en lui / il deviendra moi
  rationale: La construction est compacte et théologiquement ouverte. La traduction maintient son mouvement réciproque sans l’interpréter comme habitation intérieure, fusion ou identification unilatérale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide sauf dans « je deviendrai lui », où l’étrangeté du texte source est intentionnellement préservée. Le tutoiement ou le vouvoiement ne sont pas en jeu dans ce logion.
