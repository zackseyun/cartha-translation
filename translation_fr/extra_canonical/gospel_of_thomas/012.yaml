revisions:
- from: 'Les disciples dirent à Jésus : « Nous savons que tu vas nous quitter[a]. Qui sera grand au-dessus de nous[b] ? » Jésus leur dit : « Où que vous soyez[c], allez auprès de Jacques le Juste[d], celui pour qui le ciel et la terre sont venus à l’existence[e]. »'
  to: 'Les disciples dirent à Jésus : « Nous savons que tu vas nous quitter[a]. Qui sera grand au-dessus de nous[b] ? » Jésus leur dit : « Au lieu où vous êtes venus[c], allez auprès de Jacques le Juste[d], celui à cause de qui le ciel et la terre sont venus à l’existence[e]. »'
  rationale: La révision rétablit dans le texte principal la relative parfaite attestée par le manuscrit, tout en évitant le pronom intensif que l’ancienne normalisation avait introduit. Elle remplace aussi « pour qui » par « à cause de qui » afin de rendre plus directement ⲉⲧⲃⲏⲧϥ, sans trancher les implications théologiques inhabituelles de l’énoncé. Les ancres de notes demeurent toutes présentes, ordonnées et rattachées aux expressions concernées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte français rend avec fidélité l’essentiel du logion et suit à juste titre la leçon manuscrite contre la normalisation fautive : la relative exprime « le lieu où vous êtes venus/êtes arrivés », sans pronom intensif indépendant. Toutefois, « où que vous soyez » lisse cette relative et introduit une valeur concessive absente du copte. Il est préférable de conserver la relative, même légèrement inhabituelle. La note e attribue en outre à la préposition une finalité qui n’est pas nécessairement portée par le copte ; « à cause de / en raison de » rend plus directement le lien exprimé par ⲉⲧⲃⲏⲧϥ.'
  naturalness: Le français est moderne et lisible. « Grand au-dessus de nous » est compréhensible mais raide ; « grand parmi nous » serait plus idiomatique, mais atténuerait possiblement la prééminence marquée par ⲉϩⲣⲁⲓ ⲉϫⲱⲛ. On peut conserver « au-dessus de nous » afin de privilégier la fidélité formelle. « Allez auprès de » est une directive naturelle. « Sont venus à l’existence » est acceptable mais un peu lourd ; « sont venus à l’être » est plus littéraire, tandis que la formulation actuelle reste accessible.
  terminology: « Les disciples », « Jésus », « Jacques le Juste », « le ciel et la terre » sont appropriés. Le terme « Juste » respecte l’épithète grecque transmise en copte. La dernière proposition doit éviter de décider entre une causalité plus large et une interprétation téléologique ; « à cause de qui » est la formulation française la plus directement correspondante et ne nomme aucun agent créateur.
  issues:
  - severity: medium
    issue: La traduction « Où que vous soyez » ne rend pas explicitement la relative parfaite « le lieu où vous êtes venus » et ajoute une nuance concessive (« où que »).
    rationale: Le manuscrit ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ contient une relative avec sujet 2pl, non un simple présent locatif. La note c reconnaît ce fait ; le texte principal devrait le refléter.
  - severity: low
    issue: La note e affirme que la préposition peut exprimer « la cause ou la finalité ».
    rationale: Dans cette construction, ⲉⲧⲃⲏⲧϥ se rend directement par « à cause de », « en raison de » ou selon le contexte « pour ». Mentionner la finalité comme valeur grammaticale distincte risque de surinterpréter le lien, tandis que le texte peut conserver son ambiguïté théologique par une formulation causale non explicitée.
