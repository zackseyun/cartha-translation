base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: fr
  text: 'Les disciples dirent à Jésus : « Nous savons que tu vas nous quitter[a]. Qui sera grand au-dessus de nous[b] ? » Jésus leur dit : « Au lieu où vous êtes venus[c], allez auprès de Jacques le Juste[d], celui à cause de qui le ciel et la terre sont venus à l’existence[e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe copte signifie littéralement « aller » ; dans cette construction, on peut aussi traduire : « tu vas partir loin de nous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Qui deviendra grand au-dessus de nous ? » Certains comprennent cette expression au sens de « Qui nous dirigera ? ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le lieu où vous êtes venus ». La relative parfaite du manuscrit ne comporte pas de pronom intensif signifiant « vous-mêmes ». La tournure peut être comprise de façon idiomatique : « là où vous vous trouvez ».'
    reason: alternative_reading
  - marker: d
    text: « Le Juste » est une épithète. Pour le rôle de Jacques dans d’autres sources chrétiennes anciennes, voir Actes 15 et Galates 1–2.
    reason: cross_reference
  - marker: e
    text: 'Ou : « celui pour qui le ciel et la terre sont venus à l’existence ». La préposition copte exprime le lien avec Jacques sans préciser comment il doit être compris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲁⲑⲏⲧⲏⲥ
  choice: les disciples
  rationale: Ce nom d’emprunt grec désigne normalement les disciples dans les écrits chrétiens anciens. Le français emploie le pluriel requis par le contexte et par le verbe de parole.
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛⲧⲛⲁⲛⲟⲛ
  choice: tu vas nous quitter
  rationale: ⲃⲱⲕ signifie d’abord « aller », mais le complément « de nous » exprime ici l’éloignement du groupe. « Nous quitter » rend naturellement les deux éléments sans préciser la cause du départ.
- source_word: ⲉⲧⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲱⲛ
  choice: sera grand au-dessus de nous
  rationale: La formulation conserve le langage de grandeur et la relation verticale du copte, sans introduire explicitement les notions de gouvernement ou de direction.
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: où que vous soyez
  rationale: Le manuscrit porte une relative au parfait avec préfixe sujet de deuxième personne du pluriel, sans pronom réfléchi indépendant. Dans ce contexte, l’expression idiomatique désigne le lieu où se trouvent les disciples.
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁ
  choice: allez auprès de
  rationale: La construction donne une directive et ϣⲁ marque la destination, ici une personne. « Auprès de » est naturel en français et peut évoquer le fait de se tourner vers Jacques sans ajouter un titre institutionnel.
- source_word: ⲓ̈ⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: Jacques le Juste
  rationale: Rendu traditionnel et transparent du nom propre suivi de l’épithète grecque signifiant « juste ».
- source_word: ⲡⲁⲉⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ̅
  choice: celui pour qui le ciel et la terre sont venus à l’existence
  rationale: Cette traduction maintient l’affirmation causale ou téléologique surprenante du texte. « Pour qui » préserve mieux que « à cause de qui » la gamme de sens de ⲉⲧⲃⲏⲧϥ, et « venus à l’existence » rend ϣⲱⲡⲉ sans imposer le verbe théologique « créer ».
theological_decisions:
- issue: Nature de l’autorité de Jacques
  choice: Conserver « grand au-dessus de nous » et l’ordre d’aller auprès de Jacques, sans lui attribuer un titre.
  alternative: « Qui nous dirigera ? » ou « allez vers Jacques, votre chef ».
  rationale: Le texte associe Jacques à une prééminence, mais ne nomme pas précisément sa fonction. Une formulation institutionnelle ou ecclésiologique résoudrait indûment cette ambiguïté.
- issue: Rapport de Jacques à l’existence du ciel et de la terre
  choice: « celui pour qui le ciel et la terre sont venus à l’existence »
  alternative: « celui à cause de qui le ciel et la terre ont été créés »
  rationale: La formulation retenue conserve la force et l’étrangeté théologiques de l’énoncé tout en évitant de préciser si Jacques en est la cause, la finalité ou le bénéficiaire, et sans introduire un agent créateur absent de la proposition.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct et accessible. La tournure inhabituelle « grand au-dessus de nous » est volontairement conservée afin de ne pas transformer une image de prééminence en titre politique ou ecclésiastique. La dernière proposition garde sa tension théologique et son caractère saisissant.
