base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: fr
  text: 'Jésus dit : « Nombreux sont ceux qui se tiennent[a] à la porte, mais ce sont les solitaires[b] qui entreront dans le lieu de la chambre nuptiale[c]. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression copte signifie littéralement « se tenir sur leurs pieds » ; elle est rendue ici par le français naturel « se tenir ».
    reason: dialect_note
  - marker: b
    text: Le mot ⲙⲟⲛⲁⲭⲟⲥ, emprunté au grec μονάχος, peut signifier « solitaire », « seul » ou, plus tard, « moine ». Ici, « solitaires » évite de présupposer le sens monastique institutionnel.
    reason: lexical_alternative
  - marker: c
    text: Le copte dit expressément « le lieu de la chambre nuptiale », et non simplement « la chambre nuptiale ».
    reason: lexical_alternative
  - marker: d
    text: 'Le manuscrit porte des formes plurielles : « les solitaires, ceux qui entreront ». Le texte normalisé fourni les remplace par un singulier, qui peut se traduire : « mais c’est le solitaire qui entrera ».'
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: Beaucoup
  rationale: La construction existentielle introduit un grand nombre de personnes; le français permet ici une formulation directe et naturelle, reprise comme sujet de « se tiennent ».
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: se tiennent
  rationale: L’expression copte signifie littéralement « se tenir sur leurs pieds », idiome rendu naturellement en français sans la précision redondante.
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: devant la porte
  rationale: La préposition situe les personnes à la porte ou auprès d’elle; « devant la porte » est idiomatique et conserve l’image spatiale.
- source_word: ⲁⲗⲗⲁ
  choice: mais
  rationale: La conjonction adversative marque le contraste net entre la multitude présente à la porte et ceux qui entreront.
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: les solitaires
  rationale: Le manuscrit porte une construction plurielle. Le terme emprunté au grec μονάχος peut désigner celui qui est seul ou unifié, et plus tard un moine; « les solitaires » conserve le sens premier sans imposer une institution monastique.
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: ce sont … qui entreront
  rationale: Le manuscrit présente un relatif futur pluriel dans une construction identificatrice; la tournure clivée française en restitue la force.
- source_word: ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ
  choice: le lieu de la chambre nuptiale
  rationale: Le mot ⲙⲁ, « lieu », est explicite dans le copte; il est maintenu plutôt que de réduire l’expression à « la chambre nuptiale ».
theological_decisions:
- issue: Sens de ⲙⲟⲛⲁⲭⲟⲥ
  choice: les solitaires
  alternative: les moines; ceux qui sont un
  rationale: Le mot admet plusieurs nuances et participe dans Thomas au motif de l’unique ou de l’unifié. La traduction retenue préserve cette ouverture sans introduire rétrospectivement un sens monastique institutionnel.
- issue: Nombre du sujet qui entre
  choice: pluriel selon le manuscrit
  alternative: singulier selon le texte normalisé éditorial
  rationale: Les formes manuscrites ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ et ⲛⲉⲧⲛⲁⲃⲱⲕ indiquent le pluriel; le corps du texte traduit donc le témoin manuscrit, tandis que la normalisation singulière est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste brève et sentencieuse. La tournure « ce sont … qui » restitue le relief identificatif du copte; « lieu de la chambre nuptiale », légèrement marqué en français, est conservé pour refléter la formulation explicite de la source.
