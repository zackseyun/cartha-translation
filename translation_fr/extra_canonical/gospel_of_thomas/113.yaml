base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Quel jour le règne[a] viendra-t-il ? »


    [Il dit][b] : « Il ne viendra pas de manière observable. On ne dira pas : “Regardez, ici !” ou : “Regardez, là !”[c] Au contraire, le règne du Père est répandu sur la terre[d], et les gens ne le voient pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « royaume ». Le mot copte peut désigner la souveraineté, le règne ou le royaume.
    reason: lexical_alternative
  - marker: b
    text: Les mots « Il dit » ne figurent pas dans le manuscrit ; ils sont ajoutés pour rendre le changement de locuteur explicite.
    reason: supplied_text
  - marker: c
    text: Le manuscrit lit « là », formant le couple « ici/là ». Le texte normalisé consulté lit « ciel » à cet endroit.
    reason: textual_variant
  - marker: d
    text: Le mot traduit par « terre » peut aussi signifier « sol » ou « pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ / ⲧⲙⲛⲧⲉⲣⲟ
  choice: le règne
  rationale: Le nom abstrait formé sur « roi » désigne ici l’exercice de la souveraineté. « Règne » conserve mieux cette nuance que le seul sens territorial de « royaume ».
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: Quel jour
  rationale: Rend littéralement l’interrogation sur le jour, sans la généraliser en un simple « quand ».
- source_word: ϭⲱϣⲧ
  choice: observation
  rationale: Le substantif exprime l’action de regarder ou d’observer. La formulation volontairement concise maintient l’accent sur la recherche de signes visibles.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Regardez
  rationale: Impératif naturel en français actuel, qui garde la force déictique de l’expression copte.
- source_word: ⲡⲓⲥⲁ
  choice: ici
  rationale: Bien que le mot signifie littéralement « le lieu », il fonctionne comme un déictique dans cette formule.
- source_word: ⲧⲏ / ⲡⲏ
  choice: là
  rationale: La lecture du manuscrit ⲧⲏ forme le couple naturel « ici/là ». La normalisation ⲡⲏ donnerait « ciel », lecture signalée en note.
- source_word: ⲥⲡⲟⲣϣ ⲉⲃⲟⲗ
  choice: est répandu
  rationale: Le verbe évoque ce qui est étendu ou dispersé. Le présent passif exprime un état déjà perceptible en principe.
- source_word: ϩⲓϫⲙ ⲡⲕⲁϩ
  choice: sur la terre
  rationale: Conserve l’image spatiale concrète ; ⲡⲕⲁϩ peut aussi désigner le sol ou le pays.
- source_word: ⲣⲣⲱⲙⲉ
  choice: les gens
  rationale: Le pluriel est générique ; « les gens » est inclusif, naturel et non inutilement genré.
theological_decisions:
- issue: Présence actuelle ou accomplissement futur du règne
  choice: Conserver le contraste entre « viendra » et « est répandu »
  alternative: Harmoniser tout le passage au futur ou traduire « a été répandu »
  rationale: Le texte oppose la question portant sur une venue future à l’affirmation que le règne du Père est déjà répandu sur la terre. La traduction préserve cette tension sans l’expliquer doctrinalement.
- issue: Nature du règne
  choice: Employer « règne »
  alternative: « royaume »
  rationale: « Règne » met en avant la souveraineté sans exclure les autres connotations possibles et évite de réduire l’expression à un territoire.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct ; « par l’observation » conserve la concision inhabituelle du copte, tandis que « Regardez, ici/là » restitue clairement la formule déictique. Les crochets rendent visible l’ajout narratif absent du manuscrit.
