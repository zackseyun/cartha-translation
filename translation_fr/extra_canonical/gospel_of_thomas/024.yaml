base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Montre-nous le lieu où tu es, car il nous faut le chercher. » Il leur dit : « Que celui qui a des oreilles entende.[a] Il y a une lumière au-dedans d’un être de lumière,[b] et celui-ci illumine le monde entier.[c] Quand il n’illumine pas, c’est l’obscurité.[d] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Celui qui a des oreilles avec lui, qu’il entende. » Le complément « avec lui » appartient ici à la formule copte.'
    reason: idiome_source
  - marker: b
    text: 'Le copte affirme : « Il y a une lumière au-dedans d’un être de lumière. » Le fragment grec correspondant présente la phrase sous forme conditionnelle : « S’il y a de la lumière dans un être de lumière… »'
    reason: variante_textuelle
  - marker: c
    text: 'Dans le copte, l’être de lumière est le sujet : « celui-ci illumine le monde entier ». Dans le fragment grec, la lumière semble être le sujet : « elle brille ».'
    reason: variante_textuelle
  - marker: d
    text: 'Le copte se rend : « Quand il n’illumine pas, c’est l’obscurité. » Le fragment grec a une formulation différente, généralement reconstruite ainsi : « si elle n’est pas là, le monde est dans l’obscurité ».'
    reason: variante_textuelle
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: Montre-nous
  rationale: Le causatif signifie « faire connaître, enseigner » ; dans cette demande portant sur un lieu, « montre-nous » est naturel et précis.
- source_word: ⲧⲟⲡⲟⲥ
  choice: le lieu
  rationale: Le terme grec emprunté τόπος désigne ici un lieu ; « lieu » conserve la concision et la tonalité du propos.
- source_word: ⲉⲧⲉⲣⲉⲛⲧⲟⲕⲙⲙⲁⲩ
  choice: où tu es
  rationale: La proposition relative exprime la localisation sans imposer l’idée plus marquée de demeure permanente.
- source_word: ⲡⲉⲓⲡⲁⲛⲁⲅⲕⲏ ⲉⲁⲛⲟⲛ ⲡⲉ
  choice: il nous faut
  rationale: Cette tournure française rend naturellement la construction impersonnelle de nécessité.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲛⲧⲟϥ
  choice: le chercher
  rationale: Le pronom renvoie au lieu ; « chercher » garde la force du verbe copte sans explicitation interprétative.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ
  choice: celui qui a des oreilles
  rationale: Formule d’audition idiomatique ; le complément littéral « avec lui » ne se transpose pas naturellement en français.
- source_word: ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  choice: entende
  rationale: Le subjonctif jussif après « que » restitue directement l’exhortation copte.
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ
  choice: Il y a une lumière
  rationale: La formulation existentielle rend ⲟⲩⲛ avec ϣⲟⲟⲡ et préserve l’indétermination de « lumière ».
- source_word: ⲙ̄ⲫⲟⲩⲛ
  choice: au-dedans
  rationale: Exprime l’intériorité spatiale tout en gardant le caractère dense et imagé du texte.
- source_word: ⲛ̄ⲛⲟⲩⲣ̄ⲙ̄ⲟⲩⲟⲉⲓⲛ
  choice: d’un être de lumière
  rationale: « Être » est inclusif et naturel en français moderne, tandis que « de lumière » conserve la construction distinctive du copte sans réduire le syntagme à « lumineux ».
- source_word: ϥⲣ̄ⲟⲩⲟⲉⲓⲛ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: celui-ci illumine le monde entier
  rationale: Le sujet grammatical copte est l’être de lumière, et le verbe porte sur le monde entier ; « celui-ci » clarifie cette reprise sans la transférer à la lumière.
- source_word: ⲉϥⲧⲙ̄ⲣ̄ⲟⲩⲟⲉⲓⲛ
  choice: S’il n’illumine pas
  rationale: La forme circonstancielle négative peut se rendre conditionnellement ; le même sujet personnel est maintenu.
- source_word: ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: c’est l’obscurité
  rationale: Rend la proposition nominale de manière concise sans ajouter de référent absent du copte.
theological_decisions:
- issue: Sujet de l’illumination
  choice: 'L’être de lumière demeure le sujet : « celui-ci illumine »'
  alternative: 'Faire de la lumière le sujet : « elle brille »'
  rationale: Le témoin copte porte le pronom masculin singulier et le verbe sur la personne, tandis que le fragment grec paraît prendre la lumière pour sujet ; la traduction principale suit le copte fourni.
- issue: Existence de la lumière
  choice: 'Déclaration existentielle : « Il y a une lumière »'
  alternative: 'Condition : « S’il y a de la lumière »'
  rationale: Le copte est déclaratif, alors que le témoin grec est conditionnel ; il convient de ne pas harmoniser silencieusement les deux formes.
- issue: Sens de « être de lumière »
  choice: Conserver l’expression imagée sans l’identifier doctrinalement
  alternative: L’interpréter comme l’initié, le croyant ou l’être humain intérieur
  rationale: Le texte ne précise pas l’identité ni le statut théologique de cet être ; la traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste brève et sentencieuse. « Être de lumière » évite le masculin générique marqué de « homme de lumière », tout en préservant le génitif énigmatique du copte. Les variantes grecques sont signalées sans remplacer la leçon du manuscrit copte.
