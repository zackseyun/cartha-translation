base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: fr
  text: 'Jésus a dit : « Celui qui a quelque chose dans sa main[a], on lui donnera[b] ; et celui qui n’a rien, on lui prendra même le peu qu’il a[c][d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction possessive copte peut employer ici un pronom objet sans référent précis. « Quelque chose » est ajouté pour produire une phrase française claire, sans déterminer ce qui est possédé.
    reason: lexical_alternative
  - marker: b
    text: 'Les verbes coptes sont à la troisième personne du pluriel, employée avec un sens impersonnel : littéralement, « ils lui donneront » et « ils prendront de lui ». Le français naturel exprime cette valeur par « on ».'
    reason: dialect_note
  - marker: c
    text: L’expression traduite par « même le peu » signifie littéralement « même la petite chose » ou « même la petite quantité » ; son référent demeure indéterminé.
    reason: lexical_alternative
  - marker: d
    text: Le manuscrit porte une expression signifiant « de lui ». La transcription normalisée fournie présente à cet endroit une forme divergente ; la traduction suit la lecture claire du manuscrit.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: La formule narrative ⲡⲉϫⲉ signifie « dire » ; le passé composé convient au français moderne et au style lapidaire de l’œuvre.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: Celui qui a quelque chose
  rationale: La relative avec la construction possessive ⲟⲩⲛⲧⲁ- exprime le fait d’avoir. Le pronom objet peut être explétif ; « quelque chose » rend la phrase intelligible sans préciser la nature de ce qui est possédé.
- source_word: ϩⲛⲡⲉϥϭⲓϫ
  choice: dans la main
  rationale: Rend directement la préposition spatiale et ϭⲓϫ, « main ». L’article défini est idiomatique en français pour une partie du corps.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ
  choice: on lui donnera
  rationale: La troisième personne du pluriel sert ici à exprimer un agent indéterminé. Le pronom français « on » reproduit naturellement cette valeur impersonnelle.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: celui qui n’a rien
  rationale: La construction possessive est niée. « N’a rien » est naturel en français et maintient la tension avec « le peu qu’il a » dans la proposition suivante.
- source_word: ⲡⲕⲉϣⲏⲙ
  choice: même le peu
  rationale: ϣⲏⲙ, substantivé, désigne une petite chose ou quantité ; ⲕⲉ- ajoute la nuance « même/aussi ». « Le peu » conserve l’indétermination voulue.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ
  choice: on le lui prendra
  rationale: Le futur à la troisième personne du pluriel a de nouveau une valeur impersonnelle. Le pronom « le » reprend « le peu » et ϥⲓ signifie ici « prendre, enlever ».
- source_word: ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: lui
  rationale: La construction disjonctive exprime la séparation, « de lui ». Dans « on le lui prendra », le datif possessif français transmet idiomatiquement cette idée d’enlèvement à la personne.
theological_decisions:
- issue: Nature de ce que la personne possède ou reçoit
  choice: Ne pas identifier l’objet ; conserver « quelque chose » et les pronoms indéfinis
  alternative: Préciser qu’il s’agit de connaissance, de révélation, de foi ou de biens
  rationale: Le texte copte ne nomme pas l’objet. Toute précision imposerait une interprétation théologique absente de l’énoncé.
- issue: Tension entre « n’a rien » et « le peu qu’il a »
  choice: Conserver la formulation paradoxale
  alternative: Harmoniser en disant « celui qui a peu »
  rationale: L’aphorisme juxtapose expressément l’absence de possession et le peu néanmoins possédé ; cette tension ne doit pas être résolue silencieusement.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation reste concise, conserve l’image concrète de la main et rend les pluriels impersonnels coptes par « on », solution plus naturelle que l’ambigu « ils » en français.
