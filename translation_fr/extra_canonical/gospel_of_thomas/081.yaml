base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: fr
  text: 'Jésus a dit : « Celui qui est devenu riche, qu’il soit roi[a] ; et celui qui détient une puissance[b], qu’il y renonce[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe copte peut aussi se traduire par « qu’il règne » ou « qu’il gouverne ». « Qu’il soit roi » en conserve la formulation frappante liée au mot « roi ».
    reason: lexical_alternative
  - marker: b
    text: Le mot ⲇⲩⲛⲁⲙⲓⲥ, emprunté au grec, peut désigner la puissance, la force ou la capacité, et parfois une puissance miraculeuse.
    reason: lexical_alternative
  - marker: c
    text: Le copte n’exprime pas l’objet de « renoncer ». En français, « y » le rapporte à la puissance qui vient d’être mentionnée.
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: Rend naturellement en français la formule narrative copte qui introduit une parole.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: Celui qui est devenu riche
  rationale: La construction relative au parfait indique un état acquis, et le verbe signifie devenir riche.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: qu’il devienne roi
  rationale: Le jussif appelle à l’action ou à l’entrée dans un état ; le verbe formé sur « roi » peut aussi signifier régner. « Devienne roi » conserve l’image nominale et convient mieux que « soit roi » après « est devenu riche ».
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: celui qui détient une puissance
  rationale: La construction exprime la possession. L’article indéfini copte est conservé par « une », tandis que « puissance » maintient l’étendue sémantique du prêt grec δύναμις.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: qu’il y renonce
  rationale: Le verbe signifie nier ou renoncer. Son objet n’est pas exprimé ; le pronom français « y » reprend naturellement la puissance mentionnée juste avant.
theological_decisions:
- issue: Rapport entre richesse, royauté et renoncement à la puissance
  choice: Conserver les deux injonctions sans les harmoniser ni expliquer leur tension
  alternative: Interpréter la royauté au sens spirituel ou faire de la seconde proposition une condamnation explicite du pouvoir politique
  rationale: Le texte source juxtapose de façon abrupte devenir riche, devenir roi et renoncer à une puissance, sans préciser le domaine ni résoudre le contraste.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle et l’étrangeté concise de la parole sont maintenues ; les notes signalent les ambiguïtés lexicales et l’objet implicite.
