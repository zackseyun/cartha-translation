base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: fr
  text: 'Jésus dit : « Je communique mes mystères à ceux qui sont dignes de mes mystères[a]. Ce que ta main droite fera, que ta main gauche ne sache pas ce qu’elle fait. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit est endommagé à cet endroit. « ceux qui sont dignes » et le second « mes » reposent sur des restitutions généralement admises d’après les lettres conservées et le contexte.
    reason: textual_variant
  - marker: b
    text: Comparer Matthieu 6.3, où l’image de la main droite et de la main gauche concerne l’aumône. Ici, le texte ne mentionne pas l’aumône et place cette parole après celle sur les mystères.
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲓϫⲱ
  choice: je révèle
  rationale: Le verbe signifie littéralement « je dis ». Avec « mes mystères » comme complément et des destinataires introduits ensuite, « je révèle » exprime naturellement en français l’acte de communiquer des mystères sans ajouter de contenu.
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: mystères
  rationale: Emprunt au grec μυστήριον. Les articles possessifs coptes indiquent ici le pluriel, même si la forme du nom emprunté reste inchangée.
- source_word: ⲙⲡϣⲁ
  choice: dignes
  rationale: Le terme signifie « être digne, mériter ». Cette lecture appartient toutefois à une restauration du manuscrit endommagé.
- source_word: ⲟⲩⲛⲁⲙ
  choice: main droite
  rationale: Le mot désigne le côté droit ou la main droite; le parallélisme avec « main gauche » impose ici la seconde valeur.
- source_word: ϩⲃⲟⲩⲣ
  choice: main gauche
  rationale: Terme copte courant pour le côté gauche ou la main gauche, ici employé en parallèle avec la main droite.
theological_decisions:
- issue: Rapport entre les mystères et l’image des deux mains
  choice: Conserver deux phrases successives sans expliquer explicitement leur rapport.
  alternative: Présenter la seconde phrase comme une consigne directe de secret concernant les mystères.
  rationale: Thomas juxtapose les deux énoncés, mais ne précise pas grammaticalement que l’action de la main droite désigne la transmission des mystères. La traduction préserve cette tension.
- issue: Contexte de l’aumône dans le parallèle canonique
  choice: Ne pas introduire l’aumône dans le texte.
  alternative: Interpréter l’aphorisme à la lumière de Matthieu 6.3 comme une instruction sur l’aumône secrète.
  rationale: Le texte de Thomas ne mentionne pas l’aumône et place l’aphorisme après une déclaration sur les mystères.
translation_notes:
  register: Français moderne, sobre et digne. « Je révèle » est plus idiomatique que « je dis mes mystères », tout en restant proche du sens contextuel. Le futur de « fera » suit la forme copte; le subjonctif jussif « que… ne sache pas » conserve la tournure aphoristique.
