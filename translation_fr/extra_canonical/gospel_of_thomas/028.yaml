base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: fr
  text: 'Jésus dit : « Je me suis tenu au milieu du monde et je me suis manifesté à eux dans la chair.[a] Je les ai tous trouvés ivres ; je n’en ai trouvé aucun qui ait soif.[b] Mon âme a souffert à cause des enfants des humains,[c] car ils sont aveugles dans leur cœur. Ils ne voient pas qu’ils sont venus dans le monde vides et qu’ils cherchent aussi à sortir du monde vides.[d] Mais maintenant, ils sont ivres. Quand ils se seront défaits de leur vin,[e] alors ils se repentiront.[f] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se traduire : « je leur suis apparu dans la chair » ; le verbe peut porter l’idée de devenir visible ou de se manifester.'
    reason: lexical_alternative
  - marker: b
    text: 'La tournure copte est très resserrée. Le fragment grec correspondant dit explicitement : « je n’en ai trouvé aucun qui ait soif ».'
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « les enfants des humains » ou « les fils des hommes ».'
    reason: lexical_alternative
  - marker: d
    text: Le texte répète « vides ». « Aussi » traduit ici le copte ⲟⲛ ; « sortir du monde » peut aussi se rendre par « quitter le monde ».
    reason: lexical_alternative
  - marker: e
    text: L’expression signifie littéralement qu’ils se défont de leur vin ; elle peut aussi être comprise comme « quand leur vin les aura quittés » ou, plus librement, « quand ils auront dessaoulé ».
    reason: lexical_alternative
  - marker: f
    text: 'Le verbe d’origine grecque peut aussi signifier : « ils changeront leur manière de penser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲡⲙⲏⲧⲉ
  choice: me suis tenu au milieu
  rationale: Rend directement l’idée de prendre position ou de se tenir debout, dans un français digne et naturel.
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: monde
  rationale: Équivalent français courant du terme grec emprunté par le copte, sans imposer le sens plus technique de « cosmos ».
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: me suis manifesté
  rationale: Le verbe peut évoquer l’apparition, la manifestation ou le fait de briller ; « me suis manifesté » conserve cette amplitude mieux que le simple « suis apparu ».
- source_word: ϩⲛⲥⲁⲣⲝ
  choice: dans la chair
  rationale: Conserve l’expression concrète et théologiquement chargée du texte, plutôt que de l’atténuer en « dans un corps ».
- source_word: ⲧⲁϩⲟ / ⲧⲟϩⲉ
  choice: ivres
  rationale: Le contexte mentionne explicitement le vin ; « ivres » maintient la métaphore avec concision.
- source_word: ⲟⲃⲉ
  choice: ait soif
  rationale: Le témoin copte manuscrit et le fragment grec soutiennent le sens concret de la soif, en contraste avec l’ivresse.
- source_word: ⲯⲩⲭⲏ ϯⲧⲕⲁⲥ
  choice: mon âme a souffert
  rationale: Préserve le sujet « mon âme » et exprime naturellement en français la douleur intérieure indiquée par l’idiome copte.
- source_word: ⲃⲗⲗⲉ ... ϩⲙ̄ⲡⲟⲩϩⲏⲧ
  choice: aveugles dans leur cœur
  rationale: Conserve l’image paradoxale de la cécité intérieure sans l’interpréter comme simple ignorance.
- source_word: ϣⲟⲩⲉⲓⲧ
  choice: vides
  rationale: Le terme signifie « vide » et peut aussi suggérer la vanité ; le rendu littéral préserve l’étrangeté et la répétition du texte.
- source_word: ⲛⲟⲩϩⲉⲡⲉⲩⲏⲣⲡ
  choice: auront rejeté leur vin
  rationale: Rend l’image où le vin est l’objet dont ils se défont, sans la réduire à la paraphrase « auront dessaoulé ».
- source_word: ⲣ̄ⲙⲉⲧⲁⲛⲟⲉⲓ
  choice: se repentiront
  rationale: Équivalent français établi de metanoein ; une note signale le sens plus littéral de changement de pensée.
theological_decisions:
- issue: Nature de l’apparition « dans la chair »
  choice: me suis manifesté à eux dans la chair
  alternative: je leur suis apparu dans un corps
  rationale: Le texte affirme une manifestation dans la chair sans expliquer son statut métaphysique ; la traduction conserve cette formulation sans la développer doctrinalement.
- issue: Sens final de metanoein
  choice: ils se repentiront
  alternative: ils changeront leur manière de penser
  rationale: « Se repentir » est idiomatique et traditionnel, tandis que la note conserve la portée cognitive plus large du verbe grec.
- issue: Valeur de l’état « vide »
  choice: vides
  alternative: sans rien
  rationale: Le texte ne précise pas si le vide est matériel, spirituel ou existentiel ; conserver « vides » évite de trancher.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve les images répétées de l’ivresse, de la soif, de la cécité du cœur et du vide, tout en évitant les archaïsmes. Les formulations potentiellement doctrinales restent proches du texte et leurs principales ambiguïtés sont signalées en note.
