base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: fr
  text: Si vous ne jeûnez pas le monde[a], vous ne trouverez pas le Royaume[b] ; et si vous ne faites pas du sabbat un sabbat[c], vous ne verrez pas le Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « jeûner le monde ». Le copte emploie « jeûner » avec « le monde » comme objet, comme le confirme le grec conservé dans POxy 1. La formule peut évoquer le fait de s’abstenir du monde, mais le texte garde une tournure plus ramassée et insolite.
    reason: lexical_alternative
  - marker: b
    text: POxy 1 lit « le Royaume de Dieu », tandis que le copte de Nag Hammadi porte seulement « le Royaume ».
    reason: textual_variant
  - marker: c
    text: Littéralement, « faire du sabbat un sabbat ». La formule peut vouloir dire laisser le sabbat être pleinement ce qu’il est, donc l’observer véritablement, mais le texte ne précise pas davantage.
    reason: cultural_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ … ⲧⲙ-
  choice: si … ne … pas
  rationale: La construction introduit ici une condition à conséquence future ; « si » convient à la forme sentencieuse du passage.
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: jeûnez le monde
  rationale: Le verbe emprunté au grec signifie « jeûner ». ⲉ- introduit ici son objet, conformément au grec τὸν κόσμον du témoin POxy 1 ; la tournure volontairement saisissante rend donc le verbe transitif plutôt que directionnel.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: le monde
  rationale: « Monde » est l’équivalent français courant de ce nom grec emprunté, sans le technicisme de « cosmos ».
- source_word: ⲁϩⲉ
  choice: trouverez
  rationale: Le verbe exprime le fait de trouver ou d’atteindre ; « trouver » conserve la brièveté du texte.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: le Royaume
  rationale: Le copte dit simplement « le royaume », sans complément. La majuscule signale son emploi comme réalité eschatologique désignée, sans ajouter « de Dieu ».
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: faites du sabbat un sabbat
  rationale: Cette formulation française conserve la construction prédicative et la répétition frappante du texte, sans la réduire à l’interprétation « observer le sabbat ».
- source_word: ⲛⲁⲩ
  choice: verrez
  rationale: « Voir » est l’équivalent simple et direct, adapté à la conséquence future négative.
- source_word: ⲡⲉⲓⲱⲧ
  choice: le Père
  rationale: Le nom défini fonctionne comme un titre divin dans ce contexte ; la majuscule française le marque sans explicitation supplémentaire.
theological_decisions:
- issue: Sens de « jeûner le monde »
  choice: Conserver la métaphore transitive sans l’expliquer dans le corps du texte
  alternative: « vous abstenez du monde » ou « jeûnez loin du monde »
  rationale: Les reformulations possibles détermineraient le sens ascétique ou cosmologique que la formulation source laisse condensé et ouvert.
- issue: Désignation du Royaume
  choice: « le Royaume » sans complément
  alternative: « le Royaume de Dieu »
  rationale: Le copte de Nag Hammadi ne contient aucun génitif. Le témoin grec ajoute « de Dieu », mais cette variante ne doit pas être introduite silencieusement dans le texte principal.
- issue: Sabbat rendu véritablement sabbat
  choice: Préserver « faire du sabbat un sabbat »
  alternative: « observer véritablement le sabbat »
  rationale: La traduction littérale maintient la tension entre pratique rituelle et accomplissement plus profond, sans trancher théologiquement.
translation_notes:
  register: Français international moderne, sobre et digne. Le vouvoiement pluriel reproduit l’adresse collective copte. La syntaxe conserve les deux formulations volontairement compactes et paradoxales, tout en employant « faire de X Y », naturel en français. « Sabbat » reste en minuscule selon l’usage français ; « Royaume » et « Père » prennent la majuscule dans leur emploi titulaire.
