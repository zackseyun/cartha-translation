base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: fr
  text: 'Jésus dit : « Aucun prophète n’est bien accueilli dans son village[a][c] ; un médecin ne soigne[b] pas ceux qui le connaissent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fragment grec P.Oxy. 1 porte « dans sa patrie » (πατρίδι), c’est-à-dire dans son lieu d’origine, plutôt que « dans son village » (ϯⲙⲉ). Il dit aussi « accomplir des guérisons pour » plutôt que simplement « soigner ».
    reason: Variante textuelle du témoin grec.
  - marker: b
    text: 'Le préfixe copte ⲙⲁⲣⲉ- est ici une graphie régionale de l’aoriste négatif sahidique ⲙⲉⲣⲉ- : il exprime « ne … pas » dans une vérité générale. Il ne faut pas le confondre avec le préfixe jussif de même apparence, « que… » ou « qu’il… ».'
    reason: Précision dialectale nécessaire pour écarter une analyse grammaticale erronée.
  - marker: c
    text: 'Comparer Luc 4.24 : « aucun prophète n’est bien accueilli dans sa patrie ». Thomas associe cette maxime à celle du médecin ; en Luc 4.23, le proverbe « Médecin, guéris-toi toi-même » apparaît juste auparavant.'
    reason: Renvoi littéraire éclairant le rapport avec la tradition parallèle.
lexical_decisions:
- source_word: ⲙⲛⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: Aucun prophète
  rationale: 'La construction existentielle négative exprime ici une maxime générale et universelle : « aucun prophète ».'
- source_word: ϣⲱⲡ
  choice: n’est bien accueilli
  rationale: Le qualitatif de « recevoir, accepter » décrit le fait d’être reçu favorablement. « Bien accueilli » est naturel en français tout en conservant le sens de δεκτός attesté par le témoin grec.
- source_word: ϯⲙⲉ
  choice: village
  rationale: Le mot copte désigne un village ou une petite localité. « Village » suit précisément le témoin copte sans l’harmoniser avec la « patrie » du fragment grec.
- source_word: ⲥⲟⲓⲛ
  choice: médecin
  rationale: Il s’agit d’une variante sahidique/lycopolitaine de ⲥⲁⲉⲓⲛ, « médecin », et non d’un auxiliaire verbal.
- source_word: ⲣⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: soigne
  rationale: Cet emprunt au grec θεραπεύειν signifie ici soigner ou guérir. « Soigne » convient naturellement à l’action habituelle d’un médecin sans garantir explicitement le résultat.
- source_word: ⲛⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟϥ
  choice: ceux qui le connaissent
  rationale: La forme manuscrite désigne au pluriel les personnes qui connaissent le médecin.
theological_decisions:
- issue: Harmonisation avec les parallèles canoniques
  choice: dans son village
  alternative: dans sa patrie / dans sa ville natale
  rationale: Le copte porte explicitement ϯⲙⲉ, « village ». La traduction conserve cette lecture même si le fragment grec et Luc 4.24 emploient un terme correspondant à « patrie » ou « lieu d’origine ».
- issue: Portée de l’aphorisme médical
  choice: un médecin ne soigne pas ceux qui le connaissent
  alternative: un médecin ne peut pas guérir ceux qui le connaissent
  rationale: Le présent proverbial énonce une observation générale sans ajouter une incapacité explicite (« ne peut pas »), absente du copte.
translation_notes:
  register: Français international moderne, digne et proverbial. « Bien accueilli » rend l’idée d’acceptation favorable plus naturellement que « acceptable ». Le point-virgule préserve l’association étroite des deux maximes sans expliciter leur rapport.
