base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: fr
  text: 'Jésus a dit : « Malheur aux pharisiens ! Car ils ressemblent à un chien couché sur la mangeoire[a] du bétail[b][c] : il ne mange pas et ne laisse[d] pas non plus le bétail manger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mangeoire » traduit ⲡⲟⲩⲟⲙϥ, que l’on peut aussi rendre par « auge » ou « récipient pour la nourriture ».
    reason: lexical_alternative
  - marker: b
    text: ⲉϩⲉ désigne de façon générale des animaux domestiques ou du bétail. Beaucoup de traductions parlent de « bœufs », mais le copte n’est pas aussi précis.
    reason: cultural_note
  - marker: c
    text: À cet endroit, plusieurs lettres du manuscrit sont endommagées et pourraient donner l’apparence du mot « jours ». La normalisation de Dilley lit toutefois « du bétail », lecture confirmée par la nouvelle mention du bétail dans la proposition suivante.
    reason: lacuna_or_restoration
  - marker: d
    text: Avec un infinitif, ⲕⲱ peut signifier « permettre » ou « laisser »; sous la négation, l’expression signifie ici « ne pas laisser le bétail manger ».
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: Malheur à
  rationale: Cette interjection française courante conserve la force de dénonciation de l’expression copte sans archaïsme inutile.
- source_word: ⲉⲓⲛⲉ
  choice: ressembler à
  rationale: Le verbe exprime ici la similitude; « ils ressemblent à » est naturel et précis en français.
- source_word: ⲟⲩϩⲟⲣ
  choice: chien
  rationale: Le terme copte désigne simplement un chien; ce choix maintient le caractère direct de l’image.
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: couché
  rationale: Le contexte décrit la posture de l’animal; « couché » évite de préciser sans nécessité qu’il dort.
- source_word: ϩⲓϫⲛ
  choice: sur
  rationale: La préposition spatiale signifie ici que le chien est placé sur la mangeoire.
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: mangeoire
  rationale: Le mot désigne le récipient où mangent les animaux; « mangeoire » est bref, exact et courant.
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: bétail
  rationale: ⲉϩⲉ est un terme générique pour les animaux domestiques ou le bétail; « bétail » préserve cette généralité plutôt que de spécifier des bœufs.
- source_word: ⲟⲩⲱⲙ
  choice: manger
  rationale: C’est le sens premier et direct du verbe copte, approprié aux deux membres de la phrase.
- source_word: ⲕⲱ (ⲛⲡⲉϩⲉ ⲉⲟⲩⲱⲙ)
  choice: laisser manger
  rationale: Construit avec l’infinitif, ⲕⲱ signifie ici permettre ou laisser faire; sous la négation, il donne « ne laisse pas… manger ».
- source_word: ϫⲉ (causal)
  choice: car
  rationale: Le second ϫⲉ introduit la justification de la déclaration; « car » conserve le lien causal et la concision de l’énoncé.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève et l’image incisive de l’énoncé sont conservées. « Pharisiens » garde la désignation historique, sans ajout interprétatif; « pas non plus » rend clairement la construction corrélative « ni… ni… » du copte.
