base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: fr
  text: 'Jésus dit : « Les cieux et la terre s’enrouleront sous vos yeux, et celui qui vit de celui qui est vivant ne verra pas la mort. » Jésus[a] ne dit-il pas : « Celui qui se trouve lui-même[b], le monde n’est pas digne de lui » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte passe brusquement à la troisième personne et cite Jésus comme une autorité extérieure. Ce commentaire sur la parole de Jésus, singulier dans l’Évangile selon Thomas, pourrait être une glose de compilateur ou une addition rédactionnelle intégrée au texte.
    reason: textual_variant
  - marker: b
    text: 'Le copte ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ signifie grammaticalement « se trouve lui-même », mais ⲟⲩⲁⲁϥ peut aussi faire entendre : « se trouve seul ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: s’enrouleront
  rationale: Le verbe peut signifier « plier » ou « enrouler », notamment dans l’image apocalyptique des cieux enroulés comme un rouleau. « S’enrouleront » conserve cette image en français naturel.
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: sous vos yeux
  rationale: L’expression signifie « en votre présence » ou « devant vous ». « Sous vos yeux » rend clairement l’idée sans alourdir la phrase.
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ ⲡⲉⲧⲟⲛϩ
  choice: celui qui vit de celui qui est vivant
  rationale: Cette formulation maintient la répétition de « vivre/vivant » ainsi que l’ambiguïté sur l’identité du second vivant.
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: ne dit-il pas
  rationale: La locution introduit ici une question rhétorique qui attend une réponse affirmative.
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: se trouve lui-même
  rationale: La construction est réflexive, mais ⲟⲩⲁⲁϥ peut aussi évoquer le fait d’être seul. La traduction principale exprime le sens grammatical, tandis que la note conserve l’autre résonance.
- source_word: ⲙ̄ⲡϣⲁ
  choice: n’est pas digne de lui
  rationale: Rend directement l’idée de ne pas être digne ou à la hauteur de quelqu’un.
theological_decisions:
- issue: Identité de « celui qui est vivant »
  choice: celui qui est vivant
  alternative: le Vivant
  rationale: La minuscule et la périphrase évitent d’identifier explicitement cette figure à Dieu, au Père ou à Jésus, identification que le texte ne précise pas.
- issue: Rapport entre la vie et « celui qui est vivant »
  choice: vit de celui qui est vivant
  alternative: tire sa vie de celui qui est vivant
  rationale: « De » préserve la concision et la possible amplitude de la préposition copte, sans imposer uniquement une relation causale ou mystique.
- issue: Statut de la seconde mention de Jésus
  choice: conserver le passage à la troisième personne
  alternative: harmoniser tout le propos comme une parole directe de Jésus
  rationale: Le changement de voix est présent dans le manuscrit et doit rester perceptible, même s’il peut provenir d’une glose ou d’une couche rédactionnelle.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe aphoristique et les répétitions du copte sont conservées quand elles portent le sens. « Sous vos yeux » est préféré à « en votre présence » pour une formulation plus idiomatique, tandis que « celui qui vit de celui qui est vivant » demeure volontairement marqué afin de préserver l’ambiguïté théologique du texte.
