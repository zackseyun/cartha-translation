base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: fr
  text: 'Jésus dit : « Je vous[a] donnerai ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu, ce que la main n’a pas touché, et ce qui n’est pas monté au cœur[b] de l’être humain.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « vous » est pluriel en copte.
    reason: grammar_note
  - marker: b
    text: 'Littéralement : « sur le cœur ». La tournure « monter au cœur » conserve en français l’image du mouvement ascendant.'
    reason: lexical_alternative
  - marker: c
    text: Voir Ésaïe 64.3 (64.4 dans certaines numérotations) et 1 Corinthiens 2.9 pour des formulations apparentées; le présent texte est toutefois traduit directement du copte.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲛⲁϯ
  choice: Je donnerai
  rationale: Le manuscrit porte la forme ordinaire du futur à la première personne du singulier, sans pronom indépendant emphatique; il n’y a donc pas lieu d’ajouter « moi-même ».
- source_word: ⲛⲏⲧⲛ̄
  choice: vous
  rationale: Le pronom est à la deuxième personne du pluriel. Le français « vous » conserve naturellement ce nombre, précisé en note.
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ ⲉⲣⲟϥ
  choice: ce que l’œil n’a pas vu
  rationale: Le singulier générique « l’œil » et le parfait négatif sont rendus directement, dans une tournure française naturelle.
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙⲉϥ
  choice: ce que l’oreille n’a pas entendu
  rationale: La formulation maintient le parallélisme des perceptions et explicite en français l’objet repris par le suffixe copte.
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙϥ̅
  choice: ce que la main n’a pas touché
  rationale: Dans cette triade sensorielle, « toucher » exprime clairement le contact tactile associé à la main; « saisir » resterait possible mais serait moins directement parallèle à voir et entendre.
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈
  choice: ce qui n’est pas monté
  rationale: La traduction conserve le mouvement ascendant de ⲉϩⲣⲁⲓ plutôt que de l’aplanir en « entrer » ou « venir à l’esprit ».
- source_word: ϩⲓⲫⲏⲧ⳿ ⲣ̄ⲣⲱⲙⲉ
  choice: au cœur de l’être humain
  rationale: « Au cœur » donne en français une expression intelligible avec « monter », tandis que la note signale la valeur plus littérale « sur le cœur ». « L’être humain » préserve la portée générique sans imposer un référent masculin.
theological_decisions:
- issue: Nature de ce qui est donné
  choice: Conserver l’indéfini « ce que / ce qui »
  alternative: Préciser « une révélation », « le Royaume » ou « des réalités célestes »
  rationale: Le texte ne nomme pas le don. La traduction maintient cette ouverture et n’introduit aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme répétitif de la triade est conservé. « L’être humain » rend le générique copte sans langage inutilement genré; « monter au cœur » demeure naturel tout en gardant l’image inhabituelle du texte source.
