    issue: Relation exprimée par « pour que »
    rationale: « Pour que vous cherchiez » suggère facilement une finalité (« afin que »). Dans cette interrogation rhétorique, « alors que vous cherchez » rend le lien sans le surdéterminer.
  - severity: low
    issue: Locatif explicite omis
    rationale: Le copte comporte ϩⲛ ⲡⲙⲁ, « dans le lieu où ». « Là où » restitue l’idée générale, mais « au lieu où … là aussi » préserve mieux la construction insistante du texte source.
  - severity: low
    issue: Formulation de la note sur le pronom
    rationale: La note peut signaler l’ambiguïté du suffixe sans présenter l’évocation d’une « Origine première » comme une alternative lexicalement établie.
