base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: fr
  text: 'Les disciples dirent à Jésus : « Dis-nous comment sera notre fin. » Jésus leur dit : « Avez-vous donc découvert le commencement, alors que vous cherchez la fin ? Car, au lieu où se trouve le commencement, là aussi sera la fin. Heureux celui qui se tiendra devant lui, au commencement[a] : il connaîtra la fin et il ne goûtera pas la mort[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression copte signifie littéralement « se tenir devant lui / en sa présence, dans le commencement ». Le suffixe masculin traduit par « lui » peut renvoyer au « commencement » ou à un référent masculin implicite ; le texte ne permet pas de décider.
    reason: textual_ambiguity
  - marker: b
    text: « Goûter la mort » est une expression signifiant faire l’expérience de la mort.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡϩⲁⲏ
  choice: la fin
  rationale: Le terme désigne la fin, l’extrémité ou l’achèvement et forme ici un contraste répété avec ⲡⲁⲣⲭⲏ.
- source_word: ⲡⲁⲣⲭⲏ
  choice: le commencement
  rationale: Cet emprunt au grec ἀρχή peut aussi signifier « origine » ; « commencement » conserve le contraste direct avec « fin ».
- source_word: ϭⲱⲗⲡ
  choice: découvrir
  rationale: Le verbe signifie « trouver, découvrir ». « Découvrir » convient à l’idée d’accéder au commencement sans rendre la phrase artificielle.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: chercher la fin
  rationale: La construction signifie littéralement chercher après quelque chose ; le français courant dit simplement « chercher ».
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Heureux
  rationale: « Heureux » rend naturellement la formule de béatitude tout en gardant son caractère solennel ; « béni » risquerait d’expliciter une action divine non exprimée.
- source_word: ⲁⲱϩⲉ / ϩⲱϩⲉ
  choice: se tiendra
  rationale: Le verbe signifie se tenir debout ou prendre position. Le futur reflète la forme verbale du texte.
- source_word: ⲥⲟⲟⲩⲛ
  choice: connaîtra
  rationale: Le sens ordinaire est « connaître » ; cette formulation préserve la concision et le parallélisme du propos.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: goûtera la mort
  rationale: Il s’agit d’une expression idiomatique signifiant faire l’expérience de la mort. L’image est conservée en français.
- source_word: ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ
  choice: donc … pour que
  rationale: La séquence donne à la question une portée rhétorique. « Donc » en restitue la pointe, tandis que « pour que » exprime le lien entre la découverte supposée du commencement et la recherche de la fin.
theological_decisions:
- issue: Référent du suffixe masculin dans ⲉⲣⲁⲧϥ
  choice: devant lui, dans le commencement
  alternative: dans le commencement
  rationale: 'Le texte comporte explicitement une expression signifiant « devant lui / en sa présence ». La conserver évite d’effacer l’ambiguïté : le pronom peut renvoyer au commencement grammaticalement masculin ou suggérer une origine première personnifiée, sans que la traduction tranche.'
- issue: Portée de l’affirmation sur la mort
  choice: il ne goûtera pas la mort
  alternative: il ne fera pas l’expérience de la mort
  rationale: La traduction garde l’idiome imagé sans préciser s’il est question de mort physique, spirituelle ou eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition structurante de « commencement » et « fin » est maintenue. « Heureux » reprend le registre traditionnel des béatitudes sans surinterprétation confessionnelle.
