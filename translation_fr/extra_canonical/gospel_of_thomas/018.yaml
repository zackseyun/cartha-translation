  to: 'Les disciples dirent à Jésus : « Dis-nous comment sera notre fin. » Jésus leur dit : « Avez-vous donc découvert le commencement, alors que vous cherchez la fin ? Car, au lieu où se trouve le commencement, là aussi sera la fin. Heureux celui qui se tiendra devant lui, au commencement[a] : il connaîtra la fin et il ne goûtera pas la mort[b]. »'
  rationale: La révision maintient l’ambiguïté du texte et son vocabulaire structurant, tout en améliorant la fidélité à la construction locative copte et en évitant une lecture finalisée de la question rhétorique. Les deux ancres de notes restent correctement placées et les notes expliquent seulement les difficultés textuelles pertinentes.
