translation:
  language: fr
  text: L’Évangile selon Thomas[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La Bonne Nouvelle ». Le mot ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ, emprunté au grec εὐαγγέλιον, peut désigner une « bonne nouvelle »; comme titre d’un écrit, on le traduit habituellement par « Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: Le copte porte littéralement une formule équivalant à « le selon Thomas » (ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ), formule de titre établie dans les manuscrits coptes.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: l’Évangile
  rationale: Emprunt au grec εὐαγγέλιον. Dans le titre d’un écrit de ce genre, « Évangile » est la désignation française consacrée et naturelle; « Bonne Nouvelle » explicite davantage le sens étymologique.
- source_word: ⲡⲕⲁⲧⲁ
  choice: selon
  rationale: Dans cette formule copte de titre, empruntée à l’usage grec de κατά, « selon » exprime l’attribution traditionnelle sans affirmer plus précisément une rédaction directe.
- source_word: ⲑⲱⲙⲁⲥ
  choice: Thomas
  rationale: Forme française usuelle de ce nom propre.
