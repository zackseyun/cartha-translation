base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: fr
  text: 'Jésus a dit : « On a planté une vigne[a] hors du Père. Puisqu’elle n’est pas affermie[b], on l’arrachera par la racine[c], et elle périra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte est un emprunt au grec ἄμπελος, « vigne » ; sa graphie présente ici un trait dialectal ou orthographique.
    reason: dialect_note
  - marker: b
    text: Ou « solidement établie », « ferme ». Le verbe ne signifie pas explicitement « enracinée ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à sa racine ». La préposition peut indiquer le point de séparation aussi bien que la prise par la racine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: une vigne
  rationale: Le mot, emprunté au grec ἄμπελος, désigne la vigne cultivée. « Vigne » est le terme français naturel et précis.
- source_word: ⲁⲩⲧⲟϭⲥ
  choice: on a planté
  rationale: Le verbe signifie « planter » et la troisième personne du pluriel exprime ici un agent indéfini. Le français « on » en conserve naturellement la valeur impersonnelle.
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: hors du Père
  rationale: La locution indique une position extérieure. L’article défini devant « Père » est conservé, sans harmoniser avec une formulation comme « mon Père ».
- source_word: ⲥⲧⲁϫⲣⲟ
  choice: être affermie
  rationale: Le verbe exprime l’état de ce qui est rendu ferme ou solidement établi. « Affermie » convient au contexte sans introduire explicitement l’image supplémentaire de l’enracinement.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲡⲱⲣⲕⲛⲧⲟⲥ
  choice: on l’arrachera
  rationale: La construction emploie de nouveau un pluriel à valeur impersonnelle. « On » préserve cette indétermination mieux qu’un agent explicite.
- source_word: ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ
  choice: par la racine
  rationale: La préposition peut marquer le point de séparation ou le moyen. « Par la racine » reste idiomatique en français tout en maintenant la mention explicite de la racine.
- source_word: ⲧⲁⲕⲟ
  choice: périr
  rationale: Le verbe signifie aller à la ruine, périr ou être détruit. « Périr » conserve la brièveté et la gravité de la sentence.
theological_decisions:
- issue: Sens de « hors du Père »
  choice: Conserver littéralement « hors du Père »
  alternative: Expliciter comme « sans avoir été plantée par le Père »
  rationale: Le texte formule une relation spatiale ou figurée ambiguë et ne dit pas explicitement que le Père est l’agent qui plante. La traduction ne résout donc pas cette tension théologique.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Le double « on » rend l’agent indéfini des formes coptes à la troisième personne du pluriel, tandis que les phrases brèves gardent la cadence de la parole.
