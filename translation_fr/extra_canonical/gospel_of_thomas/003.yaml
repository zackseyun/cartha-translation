base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: fr
  text: 'Jésus dit : « Si ceux qui vous conduisent[a] vous disent : “Voici, le royaume[e] est dans le ciel[b]”, alors les oiseaux du ciel vous devanceront. S’ils vous disent : “Il est dans la mer”, alors les poissons vous devanceront. Mais le royaume est à l’intérieur de vous et à l’extérieur de vous. Lorsque vous vous connaîtrez vous-mêmes, alors vous serez connus[c], et vous comprendrez que vous êtes les enfants du Père vivant[d]. Mais si vous ne vous connaissez pas vous-mêmes, vous êtes dans la pauvreté, et vous êtes la pauvreté. »[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe copte signifie « tirer, entraîner, conduire ». Il ne dit pas explicitement « égarer ».
    reason: lexical_alternative
  - marker: b
    text: Le mot copte peut désigner le ciel ou les cieux. L’expression « les oiseaux du ciel » met ici en avant l’image concrète du ciel visible.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils vous connaîtront ». Le copte emploie une troisième personne du pluriel sans préciser qui connaît ; cette tournure peut avoir un sens passif.'
    reason: dialect_note
  - marker: d
    text: Le manuscrit porte « les enfants » au pluriel. La normalisation « l’enfant » au singulier ne reflète pas cette leçon manuscrite.
    reason: textual_variant
  - marker: e
    text: Le texte copte dit simplement « le royaume » ; il n’ajoute pas « de Dieu ».
    reason: textual_variant
  - marker: f
    text: Le fragment grec POxy 654 est parfois complété par une phrase supplémentaire, « Celui qui se connaît lui-même le trouvera », qui ne figure pas ici dans le manuscrit copte.
    reason: textual_variant
lexical_decisions:
- source_word: ⲥⲱⲕ ϩⲏⲧⲧⲏⲩⲧⲛ̄
  choice: ceux qui vous conduisent
  rationale: ⲥⲱⲕ peut signifier « tirer, entraîner, conduire ». La traduction reste neutre et n’ajoute pas l’idée de conduire dans l’égarement, absente du texte.
- source_word: ⲙⲛ̄ⲧⲉⲣⲟ
  choice: royaume
  rationale: « Royaume » est naturel dans ce contexte et conserve l’ambivalence entre domaine royal, règne et souveraineté.
- source_word: ⲧⲡⲉ
  choice: ciel
  rationale: Le contexte concret des oiseaux favorise « ciel » ; le même mot peut aussi se traduire par « ciel » au sens céleste.
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲥⲙ̄ⲡⲉⲧⲛ̄ϩⲟⲩⲛ⳿ ⲁⲩⲱ ⲥⲙ̄ⲡⲉⲧⲛ̄ⲃⲁⲗ
  choice: le royaume est à l’intérieur de vous et à l’extérieur de vous
  rationale: Cette formulation garde le parallélisme spatial explicite entre l’intérieur et l’extérieur sans réduire la phrase à une intériorité seulement spirituelle.
- source_word: ⲥⲟⲩⲱⲛⲧⲏⲩⲧⲛ̄
  choice: vous vous connaîtrez vous-mêmes
  rationale: Le verbe signifie « connaître » et le pronom réfléchi pluriel exige ici « vous-mêmes ».
- source_word: ⲥⲉⲛⲁⲥⲟⲩⲱⲛⲧⲏⲛⲉ
  choice: vous serez connus
  rationale: La troisième personne du pluriel sans agent exprimé peut servir de tournure impersonnelle en sahidique ; le passif français préserve l’absence d’agent nommé.
- source_word: ⲛ̄ϣⲏⲣⲉ
  choice: les enfants
  rationale: La leçon du manuscrit porte l’article pluriel ⲛ̄-, en accord avec le « vous » pluriel. « Enfants » conserve le rapport filial sans imposer un masculin générique inutile.
- source_word: ⲙⲛ̄ⲧϩⲏⲕⲉ
  choice: pauvreté
  rationale: 'Le nom abstrait est répété avec une force paradoxale : les destinataires sont à la fois « dans la pauvreté » et eux-mêmes « la pauvreté ».'
theological_decisions:
- issue: Localisation du royaume
  choice: à l’intérieur de vous et à l’extérieur de vous
  alternative: au-dedans de vous et au-dehors de vous
  rationale: La traduction conserve les deux pôles du texte et n’interprète pas le royaume comme exclusivement intérieur, extérieur, institutionnel ou cosmique.
- issue: Agent de « vous serez connus »
  choice: ne pas identifier l’agent
  alternative: Dieu vous connaîtra
  rationale: Le copte emploie un pluriel impersonnel et ne nomme ni Dieu ni un autre agent ; l’ambiguïté doit être maintenue.
- issue: Filiation envers le Père vivant
  choice: les enfants du Père vivant
  alternative: les fils du Père vivant
  rationale: Le manuscrit exprime une filiation au pluriel. « Enfants » rend cette relation sans ajouter une restriction de sexe, tout en évitant l’ancienne lecture fautive au singulier.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel du copte est rendu par « vous » et explicité par « vous-mêmes ». La répétition de « pauvreté » et les parallélismes du logion sont conservés. « Jésus dit » suit la valeur narrative du copte ; les citations internes sont distinguées par des guillemets imbriqués.
