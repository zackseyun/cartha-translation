base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: fr
  text: 'Jésus dit : « S’ils vous disent : “D’où êtes-vous venus à l’existence ?”, dites-leur : “Nous sommes venus de la lumière, du lieu où la lumière est venue à l’existence d’elle-même, s’est tenue debout et s’est manifestée dans leur image.”[a][b] S’ils vous disent : “Êtes-vous cela ?”[c], dites-leur : “Nous sommes ses enfants et nous sommes les élus du père vivant.”[d] S’ils vous demandent : “Quel est le signe de votre père qui est en vous ?”, dites-leur : “C’est le mouvement et le repos.”[e] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage « où la lumière est venue à l’existence d’elle-même, s’est tenue debout et s’est manifestée » rend trois verbes très brefs. Dans le manuscrit, une partie de la proposition autour de « s’est tenue debout » est restaurée; la valeur exacte de l’expression réfléchie peut aussi être comprise comme « pour elle-même » ou « auprès d’elle-même ».
    reason: lacuna_or_restoration
  - marker: b
    text: Littéralement, le copte porte « leur image ». L’antécédent du possessif pluriel n’est pas clair; il n’a donc pas été remplacé par « son image » ou « l’image de la lumière ».
    reason: textual_ambiguity
  - marker: c
    text: 'La construction copte est elliptique : littéralement, « Vous, c’est [cela] ? » Le référent sous-entendu n’est pas précisé.'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Ou : « ceux que le père vivant a choisis ». « Les élus » traduit le substantif ⲡⲥⲱⲧⲡ, qui peut aussi se rendre par « les choisis ».'
    reason: lexical_alternative
  - marker: e
    text: 'Ou, plus littéralement quant aux articles coptes : « un mouvement et un repos ». Avec des noms abstraits, ces articles n’imposent toutefois pas nécessairement des articles indéfinis en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: venir à l’existence
  rationale: Dans la question sur l’origine des disciples comme dans la proposition concernant la lumière, ϣⲱⲡⲉ exprime l’entrée dans l’existence. La même formulation française maintient le lien lexical entre les deux occurrences.
- source_word: ⲉⲓ ⲉⲃⲟⲗ ϩⲛⲡⲟⲩⲟⲉⲓⲛ
  choice: venir de la lumière
  rationale: Le verbe ⲉⲓ désigne ici la venue ou la provenance; cette traduction le distingue de ϣⲱⲡⲉ, employé pour l’entrée dans l’existence.
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: la lumière
  rationale: Sens lexical direct, adapté au langage cosmologique du logion.
- source_word: ⲟⲩⲱϩⲉ
  choice: se tenir debout
  rationale: Rend le sens concret et bref de « se tenir, être debout » sans ajouter l’idée de fermeté ou de permanence.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: se manifester
  rationale: L’expression signifie devenir visible ou manifeste; la forme pronominale française conserve ici l’enchaînement actif des verbes.
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: leur image
  rationale: Le possessif copte est pluriel. « Leur » conserve cette donnée ainsi que l’ambiguïté de son antécédent.
- source_word: ⲡⲉϥϣⲏⲣⲉ
  choice: ses enfants
  rationale: « Enfants » convient au pluriel collectif et évite de limiter inutilement le groupe aux fils de sexe masculin.
- source_word: ⲡⲥⲱⲧⲡ
  choice: les élus
  rationale: Le substantif désigne ceux qui ont été choisis. « Les élus » est concis et digne, tandis que l’alternative moins traditionnelle est signalée en note.
- source_word: ⲕⲓⲙ … ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: le mouvement et le repos
  rationale: Les articles indéfinis coptes accompagnent ici des notions abstraites; le français idiomatique les exprime comme deux réalités générales.
theological_decisions:
- issue: Identité impliquée par la question elliptique ⲛⲧⲱⲧⲛ ⲡⲉ
  choice: Êtes-vous cela ?
  alternative: Est-ce vous ?
  rationale: La formulation retenue préserve l’ellipse et ne fournit pas de référent absent du texte.
- issue: Antécédent du possessif dans « leur image »
  choice: Conserver le pluriel « leur » sans identifier l’antécédent
  alternative: son image / l’image de la lumière
  rationale: Le texte copte porte un possessif pluriel dont l’antécédent demeure incertain; le résoudre imposerait une interprétation cosmologique.
- issue: Le père présent dans les destinataires
  choice: votre père qui est en vous
  alternative: votre père en vous
  rationale: La relative copte qualifie explicitement le père. La traduction maintient cette affirmation sans déplacer « en vous » vers le signe.
- issue: Capitalisation de « père »
  choice: minuscule
  alternative: Père
  rationale: La minuscule évite d’ajouter une identification théologique par la typographie, tout en conservant le sens du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions impératives (« dites-leur », « dites ») et la structure catéchétique du logion sont conservées. Les formulations volontairement abruptes ou ambiguës ne sont pas harmonisées.
