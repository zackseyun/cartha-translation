base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: fr
  text: 'Jésus dit : « Pourquoi lavez-vous l’extérieur de la coupe[a] ? Ne savez-vous pas[b] que celui qui a fait[c] l’intérieur est aussi celui qui a fait[c] l’extérieur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le côté extérieur de la coupe ». Une expression parallèle désigne ensuite « l’intérieur ».'
    reason: dialect_note
  - marker: b
    text: Le verbe copte peut aussi se traduire par « comprendre » ou « vous rendre compte ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe copte signifie « faire, façonner, former » ; il est distinct du verbe rendu plus haut par « laver ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲉⲉⲧⲃⲉⲟⲩ
  choice: Pourquoi
  rationale: La construction sahidique ⲉⲧⲃⲉ + ⲟⲩ forme naturellement une interrogation causale directe ; « Pourquoi » conserve la brièveté du propos.
- source_word: ⲉⲓⲱⲉ
  choice: lavez
  rationale: Le verbe désigne concrètement l’action de laver, notamment un récipient. « Laver » est ici plus naturel et moins chargé religieusement que « purifier ».
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ / ⲡⲥⲁ ⲛϩⲟⲩⲛ
  choice: l’extérieur / l’intérieur
  rationale: Ces termes français rendent clairement et symétriquement les deux expressions coptes, littéralement orientées vers le dehors et vers le dedans.
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: la coupe
  rationale: Cet emprunt au grec ποτήριον désigne un récipient pour boire ; « coupe » convient au registre digne du texte tout en restant courant.
- source_word: ⲛⲟⲉⲓ
  choice: savez
  rationale: « Savoir » garde le sens cognitif simple du copte sans imposer la nuance plus interprétative de « comprendre » ou « vous rendre compte ».
- source_word: ⲧⲁⲙⲓⲟ
  choice: a fait
  rationale: Le verbe signifie « faire, façonner, former ». « A fait » est direct et préserve la distinction avec le verbe précédent, « laver ».
- source_word: ⲟⲛ
  choice: aussi
  rationale: L’adverbe exprime ici l’addition et souligne que le même auteur a fait l’intérieur et l’extérieur.
