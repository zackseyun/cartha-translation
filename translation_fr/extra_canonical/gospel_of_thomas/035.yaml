  source_fidelity: La traduction rend correctement l’impossibilité, « l’homme fort », la ligature de ses mains et l’action finale de bouleverser la maison. Toutefois, « s’emparer de lui » tranche dans le texte principal en faveur de l’homme fort, alors que le suffixe masculin singulier copte peut aussi renvoyer à « la maison », masculin en copte. La note signale cette ambiguïté, mais le texte doit lui-même ne pas l’effacer.
  naturalness: Le registre est moderne, clair et naturel. « Mettre sens dessus dessous » est une expression française vivante qui convient à l’image de ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ. « Le saisir de force » permet de maintenir l’ambiguïté grammaticale tout en restant idiomatique.
  terminology: « Homme fort », « lier les mains » et « sens dessus dessous » sont appropriés. La note b distingue à juste titre ce verbe de « piller » et évite une harmonisation avec les Synoptiques.
  issues:
  - severity: medium
    issue: Le texte principal résout indûment l’antécédent de ⲧϥ dans « s’emparer de lui ».
