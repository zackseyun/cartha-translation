base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: fr
  text: 'Jésus dit : « Personne ne peut entrer dans la maison de l’homme fort et le saisir de force[a], à moins de lui lier les mains. Alors il mettra sa maison sens dessus dessous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom copte est masculin singulier. Il peut renvoyer à l’homme fort (« le saisir de force ») ou, puisque « maison » est aussi masculin en copte, à la maison (« la saisir de force »).
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: L’expression copte peut aussi se traduire par « renversera » ou « videra ». Elle ne reprend pas le verbe « piller » employé dans les parallèles synoptiques.
    reason: alternative lexicale et divergence textuelle
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉⲟⲩⲁ
  choice: Personne ne peut
  rationale: Expression française naturelle de la construction copte négative indiquant l’impossibilité, sans en affaiblir la portée.
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: l’homme fort
  rationale: L’adjectif substantivé désigne « le fort »; « l’homme fort » est clair et conserve l’écho proverbial.
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: s’emparer de lui par la force
  rationale: L’expression signifie prendre ou saisir de force. Le pronom masculin singulier peut grammaticalement renvoyer soit à l’homme fort, soit à la maison; le texte principal retient l’homme, référent animé le plus naturel, et la note conserve l’ambiguïté.
- source_word: ⲙⲟⲩⲣ ⲛⲛⲉϥϭⲓϫ
  choice: lui lier les mains
  rationale: Rend directement le pluriel du manuscrit (« ses mains »), que la normalisation citée présente au singulier.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: mettre sens dessus dessous
  rationale: Conserve l’image de renverser ou bouleverser la maison, sans importer le verbe « piller » des parallèles synoptiques.
theological_decisions:
- issue: Identification de l’homme fort et portée de l’image
  choice: Ne pas identifier les personnages ni expliquer l’allégorie dans la traduction.
  alternative: Identifier explicitement l’homme fort à Satan ou donner une interprétation spirituelle précise.
  rationale: Le logion ne fournit lui-même aucune identification; l’ajouter résoudrait indûment sa tension théologique.
- issue: Relation avec les parallèles synoptiques
  choice: Traduire le verbe copte propre à ce témoin comme une action de bouleversement.
  alternative: Harmoniser avec Marc 3.27 et Matthieu 12.29 en traduisant « piller ».
  rationale: Le témoin copte emploie ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ plutôt que le verbe copte habituel pour « piller »; cette divergence doit rester visible.
translation_notes:
  register: Français moderne, international et digne. La tournure « sens dessus dessous » reste courante et concrète; elle restitue mieux le caractère frappant du verbe copte que l’harmonisation « piller ». Les marqueurs de note figurent immédiatement après les segments concernés.
