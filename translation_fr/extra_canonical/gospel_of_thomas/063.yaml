    issue: Formulation française lourde dans la phrase sur les pensées de l’homme.
    rationale: Le copte emploie un démonstratif et un objet pluriels. La rédaction proposée conserve cette pluralité, mais « Telles étaient les choses auxquelles il pensait » est inutilement abstrait et raide en français moderne.
  - severity: low
    issue: 'Note d : paraphrase littérale imprécise et non naturelle.'
    rationale: ⲣϭⲣⲱϩ avec la négation ⲛⲗⲁⲁⲩ signifie « ne manquer de rien » / « ne pas être dans le besoin de quoi que ce soit ». La formulation actuelle « ne me trouver dans le besoin de rien » ne représente pas bien le français ni la construction.
