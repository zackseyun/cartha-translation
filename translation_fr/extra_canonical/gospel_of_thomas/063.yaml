base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: fr
  text: 'Jésus dit : « Il y avait un homme riche qui avait beaucoup d’argent[a]. Il se dit : “Je vais utiliser mon argent afin de semer, de moissonner[e], de planter[b] et de remplir mes greniers[c] de récoltes, pour ne manquer de rien[d].” C’étaient là les pensées qu’il avait dans son cœur. Cette nuit-là, il mourut. Que celui qui a des oreilles entende[f]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte ⲭⲣⲏⲙⲁ, emprunté au grec χρῆμα, peut désigner l’argent, les richesses, les biens ou les possessions.
    reason: lexical_alternative
  - marker: b
    text: Le verbe ⲧⲱⲱϭⲉ signifie ici « planter ». Malgré la ressemblance du récit avec Luc 12, il ne signifie pas « bâtir ».
    reason: lexical_alternative
  - marker: c
    text: Le mot ⲁϩⲟ peut désigner des greniers, des granges ou, plus généralement, des lieux de stockage.
    reason: lexical_alternative
  - marker: d
    text: L’expression signifie littéralement « afin que je ne manque de rien » ou « afin que je ne sois dans le besoin de rien ».
    reason: translation_clarity
  - marker: e
    text: Dans le manuscrit, une lettre du verbe ⲱϩⲥ, « moissonner », est restituée par l’éditeur à cause d’une détérioration du texte.
    reason: lacuna_or_restoration
  - marker: f
    text: 'Comparer Luc 12.16-21, tout en observant les différences importantes de vocabulaire et d’accent. Le copte dit littéralement : « Celui qui a des oreilles, qu’il entende », sans ajouter « pour entendre ».'
    reason: cross_reference
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: riche
  rationale: Le mot, emprunté au grec πλούσιος, désigne directement une personne riche et conserve la nuance socio-économique du texte.
- source_word: ⲭⲣⲏⲙⲁ
  choice: argent
  rationale: Le contexte répète le terme comme moyen que l’homme compte employer dans ses activités agricoles. « Argent » garde ce caractère concret, sans exclure le sens plus large de biens ou de richesses.
- source_word: ⲣⲭⲣⲱ
  choice: utiliser
  rationale: Rend simplement l’idée de faire usage de quelque chose et maintient la brièveté du propos.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: afin de
  rationale: La conjonction introduit explicitement le but visé par l’emploi de l’argent, plutôt qu’une cause.
- source_word: ϫⲟ / ⲱϩⲥ / ⲧⲱⲱϭⲉ
  choice: semer / moissonner / planter
  rationale: Ces verbes conservent l’enchaînement agricole du copte, y compris son ordre inhabituel, sans l’harmoniser avec un récit parallèle.
- source_word: ⲁϩⲟ
  choice: greniers
  rationale: Dans ce contexte agricole, « greniers » désigne naturellement des lieux où l’on entrepose les produits de la récolte; le mot copte peut toutefois avoir un sens plus général.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: récoltes
  rationale: Le terme grec emprunté καρπός peut signifier fruit ou produit; « récoltes » convient au contexte agricole et au stockage.
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: ne manquer de rien
  rationale: La construction négative signifie littéralement ne se trouver dans le besoin de rien.
- source_word: ⲟⲩⲛ ⲙⲁϫⲉ
  choice: a des oreilles
  rationale: La formulation conserve le pluriel et n’ajoute pas « pour entendre », absent du texte copte.
theological_decisions:
- issue: Rapport avec la parabole du riche dans Luc 12.16-21
  choice: Préserver la formulation propre à Thomas
  alternative: Harmoniser le vocabulaire avec Luc, notamment en traduisant le verbe agricole par « bâtir »
  rationale: Le texte copte présente ici une suite d’activités agricoles et doit être traduit selon son propre témoignage, malgré les ressemblances thématiques avec Luc.
- issue: Formule finale d’exhortation
  choice: « Que celui qui a des oreilles entende »
  alternative: « Que celui qui a des oreilles pour entendre entende »
  rationale: Le texte source dit seulement que la personne a des oreilles, puis lui commande d’entendre. Ajouter « pour entendre » importerait la formulation plus développée de parallèles synoptiques.
- issue: Pluralité des pensées de l’homme
  choice: « Telles étaient les choses auxquelles il pensait »
  alternative: « Voilà ce qu’il pensait »
  rationale: Le démonstratif et le pronom objet sont pluriels en copte; la traduction garde cette pluralité plutôt que de la réduire à un contenu singulier.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste concise et paratactique, tandis que la ponctuation clarifie les niveaux de discours. L’ordre inhabituel « semer, moissonner, planter » est conservé afin de respecter le texte copte. « Il se dit » rend naturellement en français un propos qui exprime la délibération intérieure de l’homme, explicitée ensuite par la mention de son cœur.
