  source_fidelity: La traduction restitue correctement la double question, le dépouillement sans honte, la prise des vêtements, leur placement sous les pieds, le piétinement et la promesse finale. « Fils de Celui qui est vivant » est cependant inutilement lourd en français et rend moins clairement la construction titulaire énigmatique ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ. « Fils du Vivant » est à la fois plus naturel et plus proche de la forme compacte du copte, sans identifier le Vivant ni le Fils au-delà de ce que dit le texte.
