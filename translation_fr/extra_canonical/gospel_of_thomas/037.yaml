base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Quand te révéleras-tu à nous[a], et quand te verrons-nous ? » Jésus dit : « Lorsque vous vous dévêtirez sans avoir honte[b], que vous prendrez vos vêtements, les déposerez sous vos pieds comme les petits enfants[c] et les piétinerez, alors[d] vous verrez le Fils du Vivant[e], et vous n’aurez pas peur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Quel jour te manifesteras-tu à nous ? » Le copte emploie « jour » dans une question qui correspond ici à « quand ».'
    reason: Conserver l’idiome temporel et la nuance de « se manifester / se révéler » sans alourdir le texte français.
  - marker: b
    text: 'Littéralement : « lorsque vous vous dévêtirez et n’aurez pas honte ».'
    reason: Préserver la forme concrète de l’expression copte et son lien explicite avec la honte.
  - marker: c
    text: Le texte évoque de jeunes enfants, sans expliquer le sens de cette comparaison.
    reason: Éviter d’importer une interprétation psychologique ou doctrinale dans cette image énigmatique.
  - marker: d
    text: Le manuscrit présente une petite lacune et une reconstruction à cet endroit, autour de « alors » et de « vous verrez ».
    reason: Signaler précisément l’état matériel du texte sans surévaluer la certitude de la restitution.
  - marker: e
    text: 'Littéralement : « le Fils de celui qui vit / est vivant ». « Le Vivant » conserve en français la forme compacte et l’ambiguïté de cette désignation.'
    reason: Rendre la construction génitive comme un titre possible sans identifier explicitement le Vivant à Dieu ni le Fils à Jésus.
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: te révéleras-tu
  rationale: Le composé signifie se manifester ou se révéler; « te révéler » restitue ici la manifestation personnelle demandée par les disciples.
- source_word: ⲕⲉⲕⲧⲏⲩⲧⲛ ⲉϩⲏⲩ
  choice: vous vous dévêtirez
  rationale: L’expression décrit le fait de se dépouiller de ses vêtements; cette formulation française est naturelle sans ajouter une interprétation symbolique.
- source_word: ϣⲓⲡⲉ
  choice: avoir honte
  rationale: Rend directement la honte ou la gêne associée à la nudité.
- source_word: ϣⲧⲏⲛ
  choice: vêtements
  rationale: Terme courant désignant les habits, ici au pluriel dans le manuscrit.
- source_word: ⲛⲓⲕⲟⲩⲉⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ
  choice: les tout-petits
  rationale: La séquence insiste sur de jeunes enfants; « tout-petits » conserve cette nuance et reste idiomatique.
- source_word: ϫⲟⲡϫⲡ
  choice: piétinerez
  rationale: Le verbe exprime l’action de fouler aux pieds.
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: le Fils de Celui qui est vivant
  rationale: Traduction formelle qui préserve la construction génitive et évite de décider si l’expression doit être comprise comme un titre figé.
theological_decisions:
- issue: Sens symbolique du dépouillement et des vêtements piétinés
  choice: Conserver l’image concrète sans l’expliquer dans le texte
  alternative: Paraphraser comme renoncement au corps, à la honte ou au monde matériel
  rationale: Le copte présente une image énigmatique et n’en impose pas explicitement une interprétation doctrinale.
- issue: Identité du « Fils de Celui qui est vivant »
  choice: Maintenir le titre tel quel
  alternative: Identifier explicitement le Fils à Jésus ou rendre « Fils du Dieu vivant »
  rationale: Le texte ne précise pas directement l’identité du référent et dit littéralement « de celui qui vit/est vivant »; la traduction préserve cette tension.
- issue: Portée temporelle de « quel jour »
  choice: Traduire littéralement la formulation temporelle
  alternative: Employer simplement « quand »
  rationale: Le nom copte ⲛϩⲟⲟⲩ signifie « jour » et sa répétition structure la double question, même si l’expression équivaut idiomatiquement à « quand ».
translation_notes:
  register: Français moderne, international et digne. Le tutoiement est conservé parce que les disciples s’adressent à une seule personne; le pluriel « vous » marque la réponse collective de Jésus. La syntaxe garde le caractère énigmatique de la parole tout en restant fluide à l’oral.
