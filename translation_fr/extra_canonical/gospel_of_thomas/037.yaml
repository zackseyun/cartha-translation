- from: 'Ses disciples lui dirent : « Quel jour te révéleras-tu à nous[a], et quel jour te verrons-nous ? » Jésus dit : « Lorsque vous vous dévêtirez sans avoir honte[b], que vous prendrez vos vêtements, les déposerez sous vos pieds comme les tout-petits[c] et les piétinerez, alors[d] vous verrez le Fils de Celui qui est vivant[e], et vous n’aurez pas peur. »'
  to: 'Ses disciples lui dirent : « Quand te révéleras-tu à nous[a], et quand te verrons-nous ? » Jésus dit : « Lorsque vous vous dévêtirez sans avoir honte[b], que vous prendrez vos vêtements, les déposerez sous vos pieds comme les petits enfants[c] et les piétinerez, alors[d] vous verrez le Fils du Vivant[e], et vous n’aurez pas peur. »'
