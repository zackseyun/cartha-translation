base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: fr
  text: 'Jésus dit : « Bien des fois, vous avez désiré entendre cette parole[a] que je vous adresse, et vous n’avez personne d’autre auprès de qui les entendre. Des jours viendront[b] où vous me chercherez[c], mais vous ne me trouverez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte porte d’abord le singulier « cette parole », puis passe au pluriel dans « les entendre ». Ce changement de nombre est conservé ici.
    reason: textual_ambiguity
  - marker: b
    text: Littéralement, le copte emploie une tournure proche de « il y aura des jours qui viendront à l’existence », idiome exprimant la venue de jours futurs.
    reason: cultural_note
  - marker: c
    text: Comparer Jean 7.34 ; 8.21 ; 13.33 pour un motif semblable. La formulation de Thomas demeure toutefois distincte.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: bien des fois
  rationale: L’expression signifie « de nombreuses fois ». « Bien des fois » garde la cadence appuyée du copte tout en restant naturelle en français moderne.
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: avez désiré
  rationale: Le verbe, emprunté au grec ἐπιθυμεῖν, exprime le désir. Ce choix évite d’ajouter l’intensité particulière de « brûler d’envie » ou une nuance spirituelle absente du terme seul.
- source_word: ⲉⲥⲱⲧⲙ
  choice: entendre
  rationale: Le sens de base est « entendre ». La traduction n’introduit pas les notions interprétatives d’obéir ou de prêter attention.
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ … ⲛⲛⲧⲟⲟⲩ
  choice: cette parole … les entendre
  rationale: Le copte commence au singulier (« cette parole »), puis reprend le contenu au pluriel (« les »). La traduction conserve ce changement de nombre, malgré sa légère irrégularité en français, afin de ne pas effacer une particularité réelle du texte.
- source_word: ⲉⲧⲉⲣⲉⲁⲛⲟⲕ ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: que je vous adresse
  rationale: Le tour duratif indique une parole actuellement communiquée. « Je vous adresse » est naturel et maintient l’immédiateté du discours.
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ … ⲛ̄ⲧⲟϥ
  choice: vous n’avez personne d’autre auprès de qui les entendre
  rationale: Le texte dit qu’ils n’ont pas « un autre » de qui entendre ces paroles. « Auprès de qui » rend idiomatiquement en français la relation marquée par le pronom copte sans réduire la phrase à une simple possession.
- source_word: ⲟⲩⲛ ϩⲉⲛϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: Des jours viendront
  rationale: Cette formulation française concise rend l’idiome existentiel et futur du copte, littéralement proche de « il y aura des jours qui surviendront ».
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲁⲛⲟⲕ
  choice: vous me chercherez
  rationale: Le verbe avec la préposition exprime ici la recherche d’une personne. Le futur convient à la construction temporelle et au contexte.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ ⲁⲛ ⲉⲁⲛⲟⲕ
  choice: vous ne me trouverez pas
  rationale: Traduction directe du futur négatif avec le verbe « trouver », sans expliciter la raison de cette absence.
theological_decisions:
- issue: Nature de l’absence future de Jésus
  choice: Ne pas préciser pourquoi Jésus ne sera pas trouvé
  alternative: Interpréter la phrase comme une annonce explicite de sa mort, de son ascension ou d’un retrait spirituel
  rationale: Le texte affirme seulement qu’il sera cherché sans être trouvé. Il ne donne aucune explication et la traduction conserve cette tension.
- issue: Portée de « cette parole » et du pluriel qui suit
  choice: Conserver le passage du singulier au pluriel
  alternative: Uniformiser en « ces paroles » ou tout maintenir au singulier
  rationale: Le changement de nombre appartient au témoin copte et peut refléter une parole comprise comme un ensemble de propos. L’uniformiser résoudrait silencieusement une ambiguïté textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste brève et orale, conformément au genre des sentences. « Bien des fois » donne une légère solennité sans archaïsme marqué. L’irrégularité singulier-pluriel est volontaire et expliquée en note.
