base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: fr
  text: Ne donnez pas ce qui est saint aux chiens[a], de peur qu’ils ne les jettent[b] sur le tas de fumier[c]. Ne jetez pas les perles aux porcs, de peur qu’ils ne le fassent […] [d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ce qui est saint » traduit une expression adjectivale substantivée, littéralement « la chose sainte » ou « ce qui est saint ».
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit porte un objet pluriel, « les », bien que « ce qui est saint » soit grammaticalement singulier. Ce désaccord est conservé.
    reason: textual_ambiguity
  - marker: c
    text: Le mot copte, emprunté au grec, désigne un tas de fumier ou de déchets.
    reason: cultural_note
  - marker: d
    text: Le texte lisible dit « qu’ils ne le fassent », avec un objet singulier après « les perles », puis le manuscrit devient lacunaire. Certains proposent « ne les piétinent », notamment par rapprochement avec Matthieu 7.6, mais ce verbe n’est pas préservé ici.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ϫⲉⲙⲡⲣϯ
  choice: Ne donnez pas
  rationale: La construction prohibitive ⲙⲡⲣ suivie de l’infinitif appelle un impératif négatif direct; « donner » rend le sens courant de ϯ.
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: ce qui est saint
  rationale: Il s’agit d’un adjectif substantivé, littéralement « le [ce] qui est saint »; cette formulation conserve son caractère général sans préciser indûment la nature de la chose sainte.
- source_word: ⲛ̄ⲛⲟⲩϩⲟⲟⲣ (normalisé ⲛⲡⲟⲩϩⲟⲣ)
  choice: aux chiens
  rationale: Le pluriel générique français est naturel et correspond au nom copte « chiens ».
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: de peur que… ne
  rationale: La locution exprime ici une conséquence redoutée; cette tournure française convient au ton proverbial.
- source_word: ⲛⲟⲩⲛⲟϫⲟⲩ
  choice: qu’ils ne les jettent
  rationale: Le verbe signifie « jeter » et porte dans le manuscrit un suffixe objet pluriel, rendu par « les » malgré son désaccord apparent avec le singulier « ce qui est saint ».
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: tas de fumier
  rationale: Cet emprunt au grec désigne un amas de fumier ou de déchets; « tas de fumier » est concret et immédiatement compréhensible.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: Ne jetez pas
  rationale: La répétition du même verbe que dans la première proposition est conservée.
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: les perles
  rationale: L’emprunt grec désigne la perle; le pluriel est imposé par le contexte transmis et donne une formulation française naturelle.
- source_word: ϣⲁⲩ
  choice: porcs
  rationale: « Porcs » rend directement le nom copte, dans un registre actuel et digne.
- source_word: ϩⲓⲛⲁ ϫⲉ
  choice: de peur que… ne
  rationale: La construction introduit une conséquence à éviter et maintient le parallélisme avec la première moitié du logion.
- source_word: ⲛⲟⲩⲁⲁϥ / ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: qu’ils ne le fassent
  rationale: Le texte lisible conserve l’idée de « faire » avec un objet pronominal singulier; la traduction ne conjecture pas l’action perdue dans la lacune.
theological_decisions:
- issue: Identification de « ce qui est saint »
  choice: Maintenir l’expression générale sans identifier son référent
  alternative: Préciser qu’il s’agit d’un enseignement, d’un rite ou d’un objet consacré
  rationale: Le texte ne définit pas ce qui est saint; toute précision introduirait une interprétation théologique absente du témoin.
- issue: Action des porcs après « le fassent »
  choice: Conserver le verbe attesté et signaler la lacune
  alternative: Compléter par « ne les piétinent » sous l’influence de Matthieu 7.6
  rationale: Le manuscrit ne préserve pas assez de texte pour établir « piétiner »; une harmonisation avec Matthieu résoudrait indûment l’incertitude.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le vouvoiement collectif (« donnez », « jetez ») convient à une parole adressée aux disciples. Les deux discordances pronominales du texte transmis sont volontairement maintenues et expliquées, plutôt que régularisées. Le parallélisme des deux interdictions est conservé.
