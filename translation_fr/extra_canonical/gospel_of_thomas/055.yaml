base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: fr
  text: 'Jésus dit : « Celui qui ne hait pas son père et sa mère ne peut être mon disciple ; et celui qui ne hait pas ses frères et ses sœurs[a], et ne porte pas sa croix comme je le fais[b], ne sera pas digne de moi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit imprimé porte « ses frères […] et ses sœurs » (ⲥⲛⲏⲩ […] ⲥⲱⲛⲉ). La lemmatisation normalisée de Dilley indique « son fils […] sa fille ». La traduction suit ici la lecture du manuscrit.
    reason: textual_variant
  - marker: b
    text: Le copte ⲛⲡⲁϩⲉ signifie littéralement « selon ma voie » ou « à ma manière ». Le texte n’emploie pas explicitement le verbe « suivre ».
    reason: dialect_note
  - marker: c
    text: Voir Luc 14.26–27 et Matthieu 10.37–38 pour des motifs apparentés, bien que la formulation de Thomas soit distincte.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: haïr
  rationale: Le verbe copte est fort. « Haïr » en conserve la rudesse sans l’atténuer en « aimer moins ».
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: pouvoir être mon disciple
  rationale: La construction comporte l’élément potentiel ϣ-, d’où « ne peut être », plutôt qu’un simple futur. ⲛⲁⲛⲟⲕ est rendu idiomatiquement par « mon disciple ».
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: père / mère
  rationale: Traduction directe des termes usuels de parenté.
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: frères / sœurs
  rationale: Cette traduction suit la lecture du manuscrit imprimé et respecte le parallélisme des deux termes de parenté.
- source_word: ϥⲓ
  choice: porter
  rationale: Avec « croix », « porter » exprime naturellement l’action de la supporter, sans harmoniser le texte avec la formule synoptique « prendre sa croix ».
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: croix
  rationale: Ce terme emprunté au grec a ici son sens courant de « croix ».
- source_word: ϩⲉ (ⲛⲡⲁϩⲉ)
  choice: comme je le fais
  rationale: La locution signifie littéralement « à ma manière / selon ma voie ». « Comme je le fais » exprime clairement la conformité de manière sans introduire le verbe « suivre », absent du copte.
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: être digne
  rationale: L’expression copte décrit l’état ou la qualité d’être digne ; la formule française conserve aussi le complément « de moi ».
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: celui qui
  rationale: Cette tournure rend naturellement en français la relative indéfinie à valeur générale.
theological_decisions:
- issue: La portée du verbe « haïr » appliqué à la famille
  choice: Conserver « haïr » sans explication interprétative dans le texte
  alternative: « aimer moins », « renoncer à » ou « préférer à »
  rationale: Le texte copte emploie un verbe fort et ne formule pas explicitement une comparaison de degrés d’amour. L’atténuer résoudrait une tension que le texte laisse subsister.
- issue: La manière de porter la croix
  choice: « comme je le fais »
  alternative: « en me suivant »
  rationale: Le copte évoque la voie ou la manière de Jésus, mais n’emploie pas le verbe « suivre ». La traduction évite donc d’importer la formulation des parallèles synoptiques.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe parallèle et la dureté de « haïr » sont conservées. « Comme je le fais » évite l’ambiguïté moderne de « dans ma voie » et la raideur de « à ma manière », tout en restant fidèle à la locution copte.
