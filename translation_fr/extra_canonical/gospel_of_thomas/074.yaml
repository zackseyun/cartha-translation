base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: fr
  text: 'Il dit[a] : « Seigneur, il y en a beaucoup autour de la citerne[b], mais il n’y a rien[c] dans le puits. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte dit littéralement : « Il dit : “Seigneur…” » On ne sait pas clairement si Jésus s’adresse à Dieu ou si quelqu’un s’adresse à Jésus. Certains pensent aussi que cette phrase pourrait prolonger la parole 73.'
    reason: Ambiguïté concernant le locuteur et le destinataire.
  - marker: b
    text: Le mot copte peut désigner un « puits » ou une « citerne ». Le texte emploie ensuite un autre mot, lui aussi susceptible de désigner un puits ou une citerne.
    reason: Chevauchement lexical entre les deux noms de points d’eau.
  - marker: c
    text: 'Le mot copte peut signifier « rien » ou « personne ». On pourrait donc aussi traduire : « mais il n’y a personne dans le puits ».'
    reason: Ambiguïté entre une lecture non personnelle et une lecture personnelle.
lexical_decisions:
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: Seigneur
  rationale: Le nom précédé de l’article fonctionne ici comme une apostrophe. « Seigneur » conserve la lecture vocative sans identifier celui qui parle ni celui auquel il s’adresse.
- source_word: ⲡϫⲱⲧⲉ
  choice: citerne
  rationale: Le terme peut désigner un puits ou une citerne. « Citerne » permet de le distinguer en français du second nom, tout en restant dans son champ lexical attesté, sans introduire l’idée moins directement étayée d’un abreuvoir.
- source_word: ⲡϣⲱⲛⲉ
  choice: puits
  rationale: Le terme peut désigner un puits, une citerne ou une fosse. « Puits » convient au contexte et maintient la distinction lexicale avec ⲡϫⲱⲧⲉ.
- source_word: ⲗⲁⲁⲩ
  choice: rien
  rationale: Après la tournure existentielle négative, le mot peut signifier « rien » ou « personne ». « Rien » suggère naturellement l’absence de contenu dans le puits, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Identité du locuteur et du destinataire
  choice: 'Il dit : « Seigneur… »'
  alternative: Le Seigneur dit…
  rationale: 'Le copte présente d’abord « il dit », puis ⲡϫⲟⲉⲓⲥ dans la parole citée. La traduction préserve donc l’ambiguïté : Jésus pourrait s’adresser à Dieu, ou un autre personnage pourrait s’adresser à Jésus. Elle n’émende pas la phrase en faisant de « Seigneur » le sujet de « dit ».'
- issue: Sens de l’image finale
  choice: il n’y a rien dans le puits
  alternative: il n’y a personne dans le puits
  rationale: La grammaire autorise les deux lectures. Le texte principal retient le sens non personnel, naturel dans l’image d’un point d’eau vide, sans exclure la lecture personnelle, conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « il y en a beaucoup » rend naturellement l’existence d’un grand nombre de personnes sans ajouter un verbe d’action absent du copte. La distinction « citerne / puits » reflète les deux mots coptes tout en reconnaissant leur recouvrement sémantique dans la note.
