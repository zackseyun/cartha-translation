revisions:
- from: 'Jésus dit : « Un vieillard avancé en âge n’hésitera pas à interroger un tout petit enfant de sept jours au sujet du lieu de la vie, et il vivra. Car beaucoup de premiers deviendront derniers[a], et ils deviendront un seul être[b]. »'
  to: 'Jésus dit : « Un vieillard, dans ses vieux jours, n’hésitera pas à demander à un petit enfant de sept jours au sujet du lieu de la vie, et il vivra. Car beaucoup de premiers deviendront derniers[a], et ils deviendront un seul[b]. »'
  rationale: La révision améliore l’idiome français et supprime l’ajout interprétatif « être ». Elle préserve le sens de « hésiter », l’énigme du « lieu de la vie », la variante grecque signalée et l’ambiguïté de la conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens du copte est globalement bien rendu : ϫⲛⲁⲩ signifie « hésiter / tarder », et non « avoir honte »; « le lieu de la vie » conserve à juste titre l’indétermination de ⲡⲧⲟⲡⲟⲥ ⲛⲡⲱⲛϩ. La finale ⲟⲩⲁ ⲟⲩⲱⲧ est toutefois plus littéralement et plus prudemment rendue par « un seul » que par « un seul être », qui introduit une catégorie ontologique absente du texte.'
  naturalness: « Un vieillard avancé en âge » est compréhensible, mais redondant en français moderne. « Un vieillard, dans ses vieux jours » garde l’insistance temporelle inhabituelle de la formulation copte tout en étant plus naturel. « Demander à » est ici plus direct et idiomatique que « interroger », sans modifier le sens.
  terminology: Les noms et les termes essentiels sont appropriés. « Un seul » préserve l’ambiguïté numérale et qualitative de ⲟⲩⲁ ⲟⲩⲱⲧ sans interpréter l’unité comme un « être » déterminé.
  issues:
  - severity: medium
    issue: « un seul être » ajoute « être » à la finale.
    rationale: Le copte dit littéralement « un, seul »; il n’emploie aucun nom équivalant à « être ». Cet ajout peut orienter la lecture vers une affirmation ontologique que le texte ne formule pas.
  - severity: low
    issue: « Un vieillard avancé en âge » est stylistiquement redondant.
    rationale: La redondance reflète partiellement le copte (« un homme vieux dans ses jours »), mais « un vieillard, dans ses vieux jours » le fait plus naturellement en français.
