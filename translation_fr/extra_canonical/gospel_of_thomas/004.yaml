base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: fr
  text: 'Jésus dit : « Un vieillard, dans ses vieux jours, n’hésitera pas à demander à un petit enfant de sept jours au sujet du lieu de la vie, et il vivra. Car beaucoup de premiers deviendront derniers[a], et ils deviendront un seul[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin grec P.Oxy. 654 ajoute ici : « et les derniers premiers ». Cette proposition ne figure pas dans le manuscrit copte.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « un, seul ». L’expression peut évoquer l’unité ou la singularité, sans que le texte en précise davantage la nature.'
    reason: translation_clarity
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: n’hésitera pas
  rationale: Le verbe signifie « hésiter, tarder »; le témoin grec POxy 654 emploie ἀποκνήσει, qui confirme « hésiter ». La traduction « n’aura pas honte » repose sur une confusion lexicale et n’est pas retenue.
- source_word: ϫⲛⲉ
  choice: à interroger
  rationale: Le verbe signifie « demander, interroger ». « Interroger » rend naturellement en français le fait de chercher auprès de l’enfant une réponse concernant le lieu de la vie, même si l’écho sonore copte avec ϫⲛⲁⲩ ne peut être reproduit.
- source_word: ⲡⲧⲟⲡⲟⲥ ⲛⲡⲱⲛϩ
  choice: le lieu de la vie
  rationale: Traduction directe de l’expression, qui en préserve le caractère énigmatique sans préciser arbitrairement s’il s’agit de l’origine, de la demeure ou de la condition de la vie.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: un seul être
  rationale: L’expression signifie littéralement « un seul ». L’ajout sobre de « être » produit un français naturel tout en préservant l’idée de transformation en unité, plutôt que de la réduire à un simple accord collectif.
theological_decisions:
- issue: Nature de l’unité exprimée par ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: ils deviendront un seul être
  alternative: ils ne feront plus qu’un / ils deviendront un seul
  rationale: La formulation conserve la force numérique et existentielle de l’expression sans définir dogmatiquement la nature de cette unité. « Ne feront plus qu’un » pourrait suggérer surtout l’union d’un groupe, tandis que le texte reste plus énigmatique.
- issue: Identification du « lieu de la vie »
  choice: maintien de l’expression littérale et indéterminée
  alternative: la source de la vie / le lieu où se trouve la vie
  rationale: Le copte ne tranche pas entre plusieurs interprétations possibles; la traduction ne doit donc pas les résoudre silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. « Un vieillard avancé en âge » rend idiomatiquement l’expression copte redondante « un homme vieux dans ses jours ». « Un tout petit enfant de sept jours » conserve le contraste frappant entre l’extrême vieillesse et le nouveau-né. Le jeu sonore copte entre ϫⲛⲁⲩ (« hésiter ») et ϫⲛⲉ (« interroger ») n’est pas reproductible naturellement en français.
