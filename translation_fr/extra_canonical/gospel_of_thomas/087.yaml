base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: fr
  text: 'Jésus a dit : « Malheureux est le corps qui dépend d’un corps[a], et malheureuse est l’âme qui dépend de ces deux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Dépend » : le verbe copte peut aussi signifier « repose sur » ou « prend appui sur ».'
    reason: lexical_alternative
  - marker: b
    text: '« Ces deux » renvoie vraisemblablement aux deux corps impliqués dans la première partie : le corps qui dépend et celui dont il dépend, plutôt qu’au corps et à l’âme.'
    reason: referent_clarification
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: malheureux / malheureuse
  rationale: Le terme grec emprunté ταλαίπωρος signifie « misérable, malheureux ». « Malheureux » conserve ici la force évaluative tout en restant naturel et digne en français moderne.
- source_word: ⲥⲱⲙⲁ
  choice: corps
  rationale: Équivalent français direct et usuel de cet emprunt au grec σῶμα.
- source_word: ⲉⲓϣⲉ (ⲁϣⲉ) + ⲛ
  choice: dépendre de
  rationale: La construction peut exprimer le fait de reposer sur quelque chose ou d’en dépendre. « Dépendre de » rend clairement la relation continue sans imposer l’idée d’origine.
- source_word: ⲯⲩⲭⲏ
  choice: âme
  rationale: Cet emprunt au grec ψυχή désigne ici l’âme, en contraste avec le corps ; « vie » ou « personne » atténuerait cette opposition.
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: ces deux
  rationale: Le démonstratif accompagné du duel renvoie explicitement aux deux corps évoqués dans la première proposition et préserve la formulation singulière du texte.
theological_decisions:
- issue: Référent de « ces deux »
  choice: Les deux corps impliqués dans la première proposition
  alternative: Le corps et l’âme
  rationale: La syntaxe fait de l’âme le sujet qui dépend de « ces deux » ; l’expression renvoie donc plus naturellement au corps dépendant et au corps dont il dépend, sans résoudre davantage la portée théologique de l’énoncé.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La répétition de « malheureux / malheureuse » et l’étrangeté de « dépend d’un corps » sont conservées afin de respecter le parallélisme et l’ambiguïté du texte copte.
