base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: fr
  text: 'Jésus a dit : « Les renards ont leurs terriers[a], et les oiseaux y ont leur nid[b] ; mais le fils de l’homme[c] n’a pas d’endroit où incliner la tête et se reposer[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit est lacunaire à cet endroit. Le texte normalisé restitue généralement « leurs terriers », en parallèle avec « leur nid » dans la proposition suivante ; les lettres conservées correspondent à « un trou/terrier ».
    reason: textual_variant
  - marker: b
    text: Le copte emploie le singulier « leur nid » et ne dit pas « les oiseaux du ciel », contrairement aux formulations de Matthieu 8.20 et de Luc 9.58.
    reason: cross_reference
  - marker: c
    text: L’expression peut être comprise comme une désignation humaine ordinaire ou comme un titre. La minuscule conserve cette ambiguïté.
    reason: theological_ambiguity
  - marker: d
    text: Thomas ajoute « et se reposer », mots absents des versions de Matthieu 8.20 et de Luc 9.58.
    reason: cross_reference
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: renards
  rationale: Le nom est pluriel dans le texte copte ; le français naturel demande ici « les renards ».
- source_word: ⲃⲏⲃ
  choice: terriers
  rationale: Le mot peut désigner un trou, une caverne ou une tanière. « Terriers » convient naturellement aux renards tout en conservant l’image concrète.
- source_word: ϩⲁⲗⲏⲧ
  choice: oiseaux
  rationale: Le copte désigne simplement les oiseaux, sans ajouter « du ciel » ou « de l’air » comme dans les parallèles synoptiques.
- source_word: ⲙⲁϩ
  choice: nid
  rationale: 'Le substantif est au singulier avec un possesseur pluriel : littéralement « leur nid ».'
- source_word: ⲣⲓⲕⲉ
  choice: incliner
  rationale: Le verbe signifie « courber, incliner ». Cette traduction reste proche de l’image source et demeure idiomatique dans ce registre.
- source_word: ⲙⲧⲟⲛ
  choice: se reposer
  rationale: La construction réflexive exprime le fait de prendre du repos ; elle constitue une proposition distincte après l’inclination de la tête.
theological_decisions:
- issue: Sens et capitalisation de ⲡϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  choice: le fils de l’homme
  alternative: le Fils de l’homme
  rationale: La minuscule évite de trancher typographiquement entre une expression visant un être humain et un titre christologique. Le contexte et la formulation permettent cette tension, que la traduction ne doit pas résoudre artificiellement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe aphoristique est conservée, avec « incliner la tête » pour refléter le verbe copte sans raideur excessive. Le singulier inhabituel « leur nid » est maintenu conformément au texte.
