    issue: « beaucoup de peine » renforce ϩⲓⲥⲉ.
    rationale: Le mot exprime peine, fatigue ou effort, mais non nécessairement une grande quantité d’effort.
  - severity: low
    issue: 'La formulation de l’alternative dans la note d n’est pas idiomatique : « préférer aux ».'
    rationale: En français standard, on dit « préférer X à Y ».
