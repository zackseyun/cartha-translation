revisions:
- from: 'Jésus a dit : « Le Règne[a] ressemble à un berger qui avait cent brebis. L’une d’elles, la plus grande[b], s’égara. Il laissa les quatre-vingt-dix-neuf et chercha celle-là jusqu’à ce qu’il la trouve. Après s’être donné beaucoup de peine[c], il dit à la brebis : “Je t’aime[d] plus que les quatre-vingt-dix-neuf.” »'
  to: 'Jésus a dit : « Le Règne[a] ressemble à un berger qui avait cent brebis. L’une d’elles, la grande[b], s’égara. Il laissa les quatre-vingt-dix-neuf et chercha celle-là jusqu’à ce qu’il la trouve. Après avoir peiné[c], il dit à la brebis : “Je t’aime[d] plus que les quatre-vingt-dix-neuf.” »'
  rationale: La révision retire le superlatif non marqué du copte et l’intensification « beaucoup », tout en conservant l’ambiguïté lexicale pertinente dans les notes. Elle corrige aussi la formulation française de l’alternative « préférer ».
  reviewer_model: gpt-5.6-terra
