base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: fr
  text: 'Jésus a dit : « Le Règne[a] ressemble à un berger qui avait cent brebis. L’une d’elles, la grande[b], s’égara. Il laissa les quatre-vingt-dix-neuf et chercha celle-là jusqu’à ce qu’il la trouve. Après avoir peiné[c], il dit à la brebis : “Je t’aime[d] plus que les quatre-vingt-dix-neuf.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte désigne la royauté ou le fait de régner ; on peut aussi traduire par « Royaume » ou « souveraineté », selon la nuance retenue.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la grande ». Le terme peut aussi vouloir dire « la grosse » ; il n’est pas explicitement au superlatif.'
    reason: lexical_alternative
  - marker: c
    text: Le copte exprime la peine, l’effort ou la fatigue éprouvés avant que le berger parle.
    reason: lexical_alternative
  - marker: d
    text: 'Le verbe peut aussi se comprendre ainsi : « Je te préfère aux quatre-vingt-dix-neuf. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: le Règne
  rationale: Le nom abstrait en ⲙⲛⲧ- désigne l’exercice de la royauté ou la souveraineté. « Règne » est naturel en français biblique moderne tout en évitant de réduire le sens à un territoire.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: un berger
  rationale: L’expression signifie littéralement un homme de la garde ou de la conduite des troupeaux, donc « berger »; la possession des cent brebis est ensuite exprimée par ⲟⲩⲛⲧⲁϥ.
- source_word: ⲛϣⲉ ⲛⲉⲥⲟⲟⲩ
  choice: cent brebis
  rationale: Le contexte pastoral permet le terme français courant « brebis », employé ici collectivement pour les animaux du troupeau.
- source_word: ⲥⲱⲣⲙ
  choice: s’égara
  rationale: Le verbe signifie s’égarer ou errer; « s’égara » convient au cadre pastoral sans ajouter l’idée d’une faute morale.
- source_word: ⲡⲛⲟϭ
  choice: la plus grande
  rationale: ⲛⲟϭ peut signifier grand ou gros. Dans la comparaison entre les brebis, le superlatif français rend naturellement la brebis distinguée comme « la grande ».
- source_word: ⲡⲥⲧⲉⲯⲓⲧ
  choice: les quatre-vingt-dix-neuf
  rationale: La forme manuscrite est comprise comme le nombre quatre-vingt-dix-neuf; le contexte permet de ne pas répéter « brebis ».
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲡⲓⲟⲩⲁ
  choice: chercha celle-là
  rationale: La construction exprime la recherche de l’unique brebis; « celle-là » maintient le contraste avec les quatre-vingt-dix-neuf.
- source_word: ϩⲓⲥⲉ
  choice: s’être donné beaucoup de peine
  rationale: Le terme évoque la peine, l’effort ou la fatigue. Cette tournure idiomatique française conserve l’effort préalable sans préciser excessivement son état physique.
- source_word: ⲟⲩⲟϣⲕ
  choice: je t’aime
  rationale: Le verbe admet ici les sens « aimer » et « préférer ». « Je t’aime plus que » reste naturel et conserve la comparaison explicite avec les quatre-vingt-dix-neuf.
theological_decisions:
- issue: Nature de ⲡⲙⲛⲧⲣⲣⲟ
  choice: le Règne
  alternative: le Royaume
  rationale: « Règne » préserve le caractère abstrait de la royauté exercée, sans exclure les connotations plus larges traditionnellement associées au Royaume.
- issue: Valeur de la brebis dite ⲡⲛⲟϭ
  choice: la plus grande
  alternative: la grande / la grosse
  rationale: Le texte distingue réellement cette brebis avant sa recherche. La traduction conserve ce trait potentiellement significatif sans en proposer une interprétation théologique.
- issue: Déclaration finale ⲟⲩⲟϣⲕ
  choice: Je t’aime plus que
  alternative: Je te préfère aux
  rationale: Les deux lectures lexicales sont possibles. Le texte principal retient l’amour comparatif et la note signale explicitement l’idée possible de préférence.
translation_notes:
  register: 'Français international moderne, narratif et digne. La formulation suit le texte copte plutôt que les parallèles canoniques : elle conserve notamment « la plus grande », l’effort du berger et la comparaison finale. Les notes sont limitées aux ambiguïtés lexicales importantes.'
