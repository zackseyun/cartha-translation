revisions:
- from: 'Jésus a dit : « Depuis Adam jusqu’à Jean le Baptiste, parmi ceux qui sont nés de femmes, personne n’est plus élevé que Jean le Baptiste, si bien que ses yeux ne s’abaisseront pas.[a] Mais j’ai dit : Celui d’entre vous qui deviendra petit[b] connaîtra le Règne[c] et deviendra plus élevé que Jean. »'
  to: 'Jésus a dit : « Depuis Adam jusqu’à Jean le Baptiste, parmi ceux qui sont nés de femmes, personne n’est plus élevé que Jean le Baptiste, de sorte que ses yeux ne seront pas baissés.[a] Mais j’ai dit : Celui d’entre vous qui deviendra petit[b] connaîtra le Règne[c] et deviendra plus élevé que Jean. »'
  rationale: Révision limitée à une tournure française plus idiomatique pour l’expression copte portant sur les yeux et à un connecteur de conséquence plus direct. Le texte conserve les ambiguïtés de ⲕⲟⲩⲉⲓ et de ⲙⲛⲧⲉⲣⲟ, le parfait inhabituel mais attesté de « j’ai dit », et l’imagerie comparative d’élévation.
