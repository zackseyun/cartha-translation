base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: fr
  text: 'Jésus a dit : « Depuis Adam jusqu’à Jean le Baptiste, parmi ceux qui sont nés de femmes, personne n’est plus élevé que Jean le Baptiste, de sorte que ses yeux ne seront pas baissés.[a] Mais j’ai dit : Celui d’entre vous qui deviendra petit[b] connaîtra le Règne[c] et deviendra plus élevé que Jean. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression copte signifie littéralement que ses yeux ne seront pas « brisés » ou « abaissés » ; elle évoque probablement le fait de baisser les yeux par déférence ou par honte. Le possessif renvoie grammaticalement à Jean.
    reason: idiome et référent grammatical
  - marker: b
    text: 'Ou : « qui deviendra un petit » ou « un enfant ». Le copte peut exprimer la petitesse ou désigner un petit enfant.'
    reason: ambiguïté lexicale
  - marker: c
    text: 'Ou : « le Royaume » ou « la royauté ». Le terme copte peut désigner aussi bien la souveraineté exercée que son domaine.'
    reason: ambiguïté lexicale et conceptuelle
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: ceux qui sont nés
  rationale: Rend naturellement en français l’idée de naissance ou de descendance dans l’expression « parmi ceux qui sont nés de femmes », tout en respectant le pluriel du manuscrit.
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: plus élevé
  rationale: Conserve la métaphore verticale du copte et son possible sens de rang ou d’exaltation, plutôt que de la réduire à « plus grand ».
- source_word: ⲟⲩⲱϭⲡ (avec ⲃⲁⲗ, « yeux »)
  choice: ses yeux ne s’abaisseront pas
  rationale: Rend l’expression idiomatique concernant les yeux baissés, qui peut évoquer la déférence ou la honte, sans traduire littéralement par « briser ».
- source_word: ⲕⲟⲩⲉⲓ
  choice: petit
  rationale: Le mot signifie d’abord « petit » et peut désigner un petit enfant ou quelqu’un qui se fait petit. Cette formulation préserve l’ambiguïté au lieu d’imposer exclusivement « enfant ».
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: le Règne
  rationale: « Règne » garde le sens dynamique ou abstrait de souveraineté, tout en laissant ouverte la traduction traditionnelle « royaume ».
theological_decisions:
- issue: Sens de « devenir petit »
  choice: devient petit
  alternative: devient un enfant / devient un petit
  rationale: Le copte permet un emploi qualitatif ou substantivé. « Devient petit » évite de résoudre le passage selon une lecture théologique particulière et maintient le lien possible avec l’humilité, la petitesse ou l’enfance.
- issue: Nature de ⲙⲛⲧⲉⲣⲟ
  choice: le Règne
  alternative: le Royaume / la royauté
  rationale: Le terme peut désigner le domaine royal, l’exercice de la souveraineté ou la royauté. Le choix retenu préserve cette tension sémantique.
- issue: Comparaison avec Jean
  choice: plus élevé que Jean
  alternative: plus grand que Jean
  rationale: La formulation conserve le langage d’élévation présent dans les deux moitiés du logion, sans définir si la supériorité est spirituelle, statutaire ou autre.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement du texte copte, tandis que les idiomes sont rendus naturellement. « Jean le Baptiste » suit l’usage français courant; « plus élevé » maintient la répétition et l’image verticale du passage.
