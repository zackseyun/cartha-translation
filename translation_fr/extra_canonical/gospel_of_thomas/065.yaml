base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his servant so that the farmers would give him the fruit of the vineyard. They seized his servant and beat him; they almost killed him. The servant went and told his master. His master said, 'Perhaps he did not know them.' He sent another servant[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
translation:
  language: fr
  text: 'Il dit : « Un homme bon[a] avait une vigne. Il la confia à des cultivateurs pour qu’ils la travaillent et qu’il reçoive d’eux son fruit. Il envoya son esclave afin que les cultivateurs lui donnent le fruit de la vigne. Ils saisirent son esclave et le frappèrent ; ils faillirent le tuer[b]. L’esclave alla raconter cela à son maître. Son maître dit : “Peut-être ne les connaissait-il pas[c].” Il envoya un autre esclave. Les cultivateurs frappèrent aussi celui-là. Alors le maître envoya son fils. Il dit : “Peut-être respecteront-ils mon fils.” Comme ces cultivateurs savaient qu’il était l’héritier de la vigne, ils le saisirent et le tuèrent. Que celui qui a des oreilles entende. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit porte ⲛⲭⲣ̣ⲏ̣[ⲥⲧⲟ]ⲥ̣, généralement restitué comme l’emprunt grec χρηστός, « bon » ou « bienveillant ». Certains proposent d’y voir, par confusion de voyelles, χρήστης, « créancier » ou « prêteur » ; cette lecture conviendrait aussi à la situation d’un propriétaire absent.
    reason: textual_variant
  - marker: b
    text: 'L’expression copte signifie littéralement quelque chose comme : « il s’en fallut de peu qu’ils le tuent » ; c’est une tournure idiomatique rendue ici par « ils faillirent le tuer ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le copte du manuscrit dit littéralement : « Peut-être ne les connaissait-il pas. » Le sujet de cette phrase est le maître : il se peut donc qu’il ne connaissait pas ces cultivateurs. Beaucoup de traductions corrigent les pronoms en « Peut-être ne le connaissaient-ils pas », conformément à la logique attendue de la parabole. La présente traduction conserve la leçon du manuscrit.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲭⲣⲏⲥⲧⲟⲥ
  choice: bon
  rationale: Le mot, emprunté au grec χρηστός, signifie normalement « bon » ou « bienveillant ». « Bon » conserve la formulation simple du copte sans ajouter une qualité morale plus précise.
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: cultivateurs
  rationale: Le terme désigne des travailleurs agricoles, ici chargés d’exploiter une vigne. « Cultivateurs » reste suffisamment général et n’impose pas un statut juridique précis de fermiers ou de métayers.
- source_word: ϩⲙϩⲁⲗ
  choice: esclave
  rationale: Le terme copte désigne un esclave ou un serviteur en condition servile. « Esclave » évite d’atténuer la réalité sociale exprimée par le texte.
- source_word: ⲕⲉⲕⲟⲩⲉⲓ
  choice: faillirent
  rationale: Dans cette tournure idiomatique, l’expression signifie qu’ils furent sur le point de le tuer. « Ils faillirent le tuer » rend naturellement cet aspect en français.
- source_word: ⲥⲟⲩⲱⲛ
  choice: connaître
  rationale: La traduction « ne les connaissait-il pas » suit les pronoms du manuscrit sans corriger la phrase selon la logique attendue de la parabole.
- source_word: ϣⲓⲡⲉ ϩⲏⲧ-
  choice: respecter
  rationale: Cette expression peut évoquer la honte ou la déférence ressentie devant quelqu’un. Dans ce contexte, « respecter » en donne un équivalent français naturel sans surinterprétation.
- source_word: ϭⲱⲡⲉ
  choice: saisir
  rationale: Le verbe signifie prendre, attraper ou saisir. « Saisir » convient à l’action violente décrite.
theological_decisions:
- issue: Harmonisation avec les paraboles parallèles des Évangiles synoptiques
  choice: Suivre strictement la forme copte de l’Évangile selon Thomas
  alternative: Ajouter ou laisser entendre des détails des récits synoptiques, ou corriger la logique narrative d’après eux
  rationale: Le texte de Thomas ne mentionne ni pressoir, ni tour, ni clôture, et présente une phrase particulière au sujet de l’esclave qui « ne les connaissait pas ». La traduction conserve ces traits propres sans harmonisation.
- issue: Identité symbolique du fils et des autres personnages
  choice: Ne pas expliciter d’identification théologique dans le corps du texte
  alternative: Identifier expressément le fils à Jésus, le maître à Dieu ou les cultivateurs à un groupe déterminé
  rationale: La parabole permet de telles lectures, mais le texte ne les formule pas explicitement. Les ajouter supprimerait sa tension interprétative.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe narrative reste concise, avec « maître », « esclave » et « héritier » pour préserver les rapports sociaux du récit. Les répétitions du copte sont maintenues lorsqu’elles structurent la parabole, sans calquer ses constructions au point de rendre le français artificiel.
