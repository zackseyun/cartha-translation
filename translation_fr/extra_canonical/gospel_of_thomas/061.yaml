base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: fr
  text: 'Jésus dit : « Deux personnes se reposeront là, sur une couche : l’une mourra, l’autre vivra. »


    Salomé dit : « Qui es-tu, homme ? Comme venant d’un seul[a], tu es monté sur ma couche et tu as mangé à ma table. »


    Jésus lui dit : « Je suis celui qui est issu de ce qui est égal[b]. Ce qui appartient à mon Père m’a été donné. »


    « Je suis ta disciple. »[c]


    « C’est pourquoi je dis : quand quelqu’un devient vide[d], il sera rempli de lumière ; mais quand il devient divisé, il sera rempli de ténèbres. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme venant d’un seul ». L’expression copte est obscure ; elle peut aussi évoquer quelqu’un en particulier ou « l’Un ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui est égal ». On peut aussi comprendre l’expression comme un titre : « l’Égal ».'
    reason: theological_note
  - marker: c
    text: 'Le texte copte n’indique pas les locuteurs des deux dernières répliques. Selon l’enchaînement habituellement retenu, Salomé dit : « Je suis ta disciple », puis Jésus prononce la dernière parole.'
    reason: textual_variant
  - marker: d
    text: Le manuscrit porte « vide ». Certains proposent de corriger le mot en « égal », ce qui donnerait un contraste direct avec « divisé ».
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: lit
  rationale: Le terme désigne un lit ou une couche. « Lit » est naturel en français et convient à la fois au repos et au cadre du repas évoqué ensuite.
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ
  choice: comme venant d’un seul
  rationale: Traduction volontairement littérale d’une expression obscure, afin de ne pas décider entre « d’une seule personne », « de quelqu’un » et une possible allusion à l’Un.
- source_word: ⲧⲉⲗⲟ
  choice: tu es monté sur
  rationale: Rend le mouvement exprimé par la variante de ⲧⲁⲗⲟ sans l’aplatir en simple installation.
- source_word: ⲡⲉⲧϣⲏϣ
  choice: ce qui est égal
  rationale: Le substantif formé sur le statif signifie littéralement « ce qui est égal ». Cette formulation conserve l’étrangeté et évite de transformer trop vite l’expression en titre divin, « l’Égal ».
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: ce qui appartient à mon Père
  rationale: La construction possessive plurielle désigne les choses ou les biens appartenant au Père ; elle ne signifie pas simplement « mon Père ».
- source_word: ϣⲏϥ
  choice: vide
  rationale: Conserve la leçon manuscrite, statif de ϣⲱϥ, et son contraste paradoxal avec « rempli ».
- source_word: ⲡⲏϣ
  choice: divisé
  rationale: Le statif de ⲡⲱϣ signifie « divisé », et non « deux ».
theological_decisions:
- issue: Statut de ⲡⲉⲧϣⲏϣ
  choice: ce qui est égal
  alternative: l’Égal ; ce qui est unifié
  rationale: La traduction garde la valeur grammaticale et l’ambiguïté de l’expression sans imposer une reconstruction théologique de l’unité divine.
- issue: Leçon ϣⲏϥ dans la conclusion
  choice: vide
  alternative: égal, par correction conjecturale en ϣⲏϣ
  rationale: Le manuscrit porte ϣⲏϥ. La correction « égal » produirait un parallélisme séduisant avec « divisé », mais elle n’est pas retenue dans le texte principal.
- issue: Identification des locuteurs dans les deux dernières répliques
  choice: ne pas ajouter de noms de locuteurs dans le texte
  alternative: ajouter « Salomé dit » et « Jésus dit » entre crochets
  rationale: Le copte n’indique pas explicitement les locuteurs. La disposition et une note permettent de signaler l’incertitude sans insérer dans le texte des mots absents du témoin.
- issue: Sens de « comme venant d’un seul »
  choice: préserver la formulation ambiguë
  alternative: comme envoyé par quelqu’un ; comme venant de l’Un
  rationale: Le syntagme peut être compris de plusieurs façons et ne doit pas être réduit à une lecture métaphysique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct. Les formulations inhabituelles sont conservées lorsqu’elles reflètent l’obscurité réelle du copte, avec des notes brèves plutôt qu’une interprétation intégrée au texte.
