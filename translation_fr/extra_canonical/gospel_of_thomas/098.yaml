base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: fr
  text: 'Jésus dit : « La royauté du Père[a] ressemble à un homme qui voulait tuer un grand personnage[b]. Dans sa maison, il tira l’épée et l’enfonça dans le mur afin de savoir si sa main serait assez forte[c]. Puis il tua le grand personnage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Royauté » traduit le nom abstrait ⲡⲙⲛⲧⲣⲣⲟ, qui peut désigner la souveraineté ou le règne ; on peut aussi traduire par « royaume ».
    reason: lexical_alternative
  - marker: b
    text: 'Le mot copte, emprunté au grec, désigne un homme important et de haut rang. Autres traductions possibles : « puissant personnage », « haut dignitaire » ou « magnat ».'
    reason: lexical_alternative
  - marker: c
    text: La formulation copte associe « être fort, capable » à une direction « vers l’intérieur ». Elle peut aussi évoquer la capacité de pénétrer ; son expression exacte demeure inhabituelle.
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: la royauté
  rationale: Le nom abstrait en ⲙⲛⲧ- désigne ici l’état ou l’exercice de la souveraineté plutôt qu’un territoire. « Royauté » conserve cette nuance, tandis que « royaume » reste possible.
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: ressemble à
  rationale: Cette construction copte introduit une comparaison. « Ressemble à » est naturel en français et maintient le lien direct entre la royauté et l’homme du récit.
- source_word: ⲟⲩⲱϣ ⲉⲙⲟⲩ
  choice: voulait tuer
  rationale: Rendu direct de l’intention exprimée par ⲟⲩⲱϣ et du verbe courant « tuer », sans ajouter de nuance juridique ou morale.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: un grand personnage
  rationale: Le terme emprunté au grec désigne un homme de haut rang ou puissant. « Grand personnage » garde cette valeur sociale sans donner à « magnat » son sens français moderne, souvent économique.
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: tira l’épée
  rationale: Expression française concise correspondant au fait de tirer ou dégainer une épée.
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: l’enfonça dans le mur
  rationale: Le verbe exprime une poussée ou un coup porté avec force; « enfonça » rend le mouvement dirigé dans le mur et prépare l’épreuve de force évoquée ensuite.
- source_word: ⲉⲓⲙⲉ
  choice: savoir
  rationale: Le verbe signifie connaître ou apprendre; dans cette proposition de but, « afin de savoir » exprime naturellement l’idée de mise à l’épreuve.
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: serait assez forte
  rationale: ⲧⲱⲕ porte l’idée de force ou de capacité. Le français explicite la force de la main requise par le contexte, tandis qu’une note conserve la formulation directionnelle plus littérale de ⲉϩⲟⲩⲛ.
- source_word: ϩⲱⲧⲙ
  choice: tua
  rationale: Rendu simple et abrupt du verbe « tuer », conforme à la brièveté de la conclusion.
theological_decisions:
- issue: Nature de la « royauté du Père »
  choice: Employer « royauté » sans expliquer l’interprétation de la comparaison
  alternative: Employer « royaume » ou préciser une leçon spirituelle
  rationale: Le copte présente une comparaison énigmatique et n’en donne aucune interprétation. La traduction conserve cette tension au lieu d’identifier l’homme, l’épée, le mur ou le grand personnage à des réalités théologiques déterminées.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative demeure brève, et l’étrangeté de la comparaison est préservée. « Grand personnage » est accessible à un large lectorat et évite le sens principalement économique que « magnat » possède aujourd’hui en français.
