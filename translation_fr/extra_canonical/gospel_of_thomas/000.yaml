base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
translation:
  language: fr
  text: Voici les paroles cachées[a] que Jésus, qui est vivant[b], a dites et que Didymos Judas Thomas[c] a écrites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte peut aussi se traduire par « secrètes ». « Cachées » met l’accent sur ce qui est dissimulé sans ajouter nécessairement l’idée d’un enseignement ésotérique.
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit présente ici une forme orthographique ou dialectale du mot signifiant « vivant » ou « en vie ».
    reason: textual_variant
  - marker: c
    text: Didymos est un mot grec qui signifie « Jumeau ». Thomas vient lui aussi d’un mot sémitique signifiant « jumeau » ; le nom complet juxtapose vraisemblablement ces désignations.
    reason: cultural_note
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  choice: paroles
  rationale: Le pluriel du manuscrit désigne les énoncés qui composent le recueil. « Paroles » convient au genre tout en évitant le sens plus interprétatif d’« enseignements ».
- source_word: ϩⲏⲡ
  choice: cachées
  rationale: Le terme peut signifier « caché » ou « secret ». « Cachées » conserve l’idée de dissimulation sans imposer une connotation ésotérique.
- source_word: ⲉⲧⲟⲛϩ
  choice: qui est vivant
  rationale: La proposition relative copte qualifie Jésus comme vivant. Cette formulation française conserve la valeur prédicative sans décider s’il s’agit formellement d’un titre.
- source_word: ϫⲟⲟⲩ
  choice: a dites
  rationale: Rendu direct du verbe « dire » avec son objet pluriel, dans une formulation naturelle en français.
- source_word: ⲥϩⲁⲓ
  choice: a écrites
  rationale: Le verbe signifie simplement « écrire ». Le pronom objet renvoie aux paroles, d’où l’accord français au féminin pluriel.
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  choice: Didymos Judas Thomas
  rationale: Les trois formes du nom sont conservées telles qu’elles sont transmises, sans traduire Didymos dans le corps du texte ni remplacer Judas par une forme davantage sémitisée.
theological_decisions:
- issue: Valeur de l’expression qualifiant Jésus de vivant
  choice: Jésus, qui est vivant
  alternative: Jésus le Vivant
  rationale: La traduction retenue préserve l’affirmation du texte sans imposer que « le Vivant » soit déjà un titre christologique formel.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste proche de l’incipit copte tout en étant naturelle. « Voici » présente idiomatiquement le recueil pluriel ; les relatives coordonnées conservent les deux actes attribués respectivement à Jésus et à Didymos Judas Thomas.
