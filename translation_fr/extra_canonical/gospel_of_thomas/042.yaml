translation:
  language: fr
  text: 'Jésus a dit : « Devenez des passants.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Devenez ceux qui passent »; « Soyez de passage »; « Soyez des voyageurs ». Le verbe sous-jacent, emprunté au grec, signifie « passer » ou « passer par ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: Formule copte ordinaire introduisant une parole; le passé composé est naturel en français moderne tout en gardant la sobriété du texte.
- source_word: ϣⲱⲡⲉ
  choice: Devenez
  rationale: Le verbe signifie « devenir, venir à être » et prend ici une valeur injonctive; « Devenez » conserve la formulation brève et frappante.
- source_word: ⲣⲡⲁⲣⲁⲅⲉ
  choice: des passants
  rationale: Le verbe d'origine grecque signifie « passer, passer à côté ». Le nom « passants » rend la construction de façon concise, respecte le pluriel des destinataires et préserve le caractère énigmatique de la parole.
theological_decisions:
- issue: Portée figurée possible de l'injonction
  choice: Ne pas expliciter une doctrine du détachement, de l'itinérance ou du caractère transitoire de la vie dans le corps du texte.
  alternative: Traduire « Soyez de passage », « Soyez des voyageurs » ou développer une interprétation spirituelle.
  rationale: Le texte source reste laconique et permet plusieurs lectures. « Des passants » conserve cette tension sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, digne et très concis. « Des passants » est idiomatique, mémorable et volontairement énigmatique, à l'image de la formulation copte.
