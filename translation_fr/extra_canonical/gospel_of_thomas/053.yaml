base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: fr
  text: 'Ses disciples lui dirent : « La circoncision est-elle utile ou non ? » Il leur dit : « Si elle était utile, leur père les engendrerait circoncis dès le sein de leur mère.[a] Mais la circoncision de vérité dans l’esprit[b] s’est révélée pleinement utile.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte exprime littéralement que leur père les engendrerait « de leur mère » alors qu’ils seraient circoncis. La construction est irréelle, contraire aux faits.
    reason: clarification grammaticale et culturelle
  - marker: b
    text: « La circoncision de vérité » peut aussi se traduire par « la vraie circoncision ». « Esprit » peut également être compris comme une référence à l’Esprit.
    reason: ambiguïté lexicale et théologique
  - marker: c
    text: « Pleinement utile » explicite, en reprenant la question initiale, une expression elliptique du copte. Comparer Romains 2.29 et Philippiens 3.3.
    reason: ellipse et renvois conceptuels
lexical_decisions:
- source_word: ⲡⲥⲃⲃⲉ
  choice: la circoncision
  rationale: Terme copte usuel pour la circoncision rituelle ; le contexte confirme ce sens plutôt que celui, plus général, de « coupure ».
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: être utile / profitable
  rationale: L’emprunt au grec ὠφελεῖν exprime l’utilité ou l’avantage. « Utile » convient à la question ; « profitable » maintient le rappel lexical dans la conclusion.
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: si elle était utile
  rationale: La construction irréelle appelle en français une proposition en « si » à l’imparfait, suivie du conditionnel.
- source_word: ϫⲡⲟⲛ
  choice: engendrerait
  rationale: Le sujet explicite est « leur père » ; « engendrer » conserve l’action paternelle du texte, contrairement à « ferait naître ».
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: dès le sein de leur mère
  rationale: La locution source marque l’origine. Cette formulation française naturelle conserve le lien explicite avec la mère.
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: la circoncision de vérité
  rationale: Le génitif copte est conservé afin de ne pas effacer sa formulation singulière ; il peut aussi se comprendre adjectivement comme « la vraie circoncision ».
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: dans l’esprit
  rationale: La minuscule préserve l’ambiguïté entre l’esprit humain ou spirituel et l’Esprit divin, que le texte ne tranche pas explicitement.
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  choice: est devenue entièrement profitable
  rationale: La formulation rend l’idée d’un profit total ; « profitable » est repris du contexte pour expliciter l’ellipse copte.
theological_decisions:
- issue: Sens de « circoncision de vérité »
  choice: Conserver « la circoncision de vérité » dans le texte
  alternative: « la vraie circoncision »
  rationale: Le génitif peut avoir une valeur adjectivale, mais sa conservation laisse ouverte la nuance entre circoncision véritable et circoncision caractérisée par la vérité.
- issue: Identification de l’esprit
  choice: Écrire « l’esprit » avec une minuscule
  alternative: « l’Esprit »
  rationale: Le passage ne désigne pas sans ambiguïté l’Esprit saint ; la minuscule évite d’imposer une lecture trinitaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe dialoguée reste concise. Le terme soutenu « engendrer » est retenu parce qu’il reproduit le rôle explicite du père dans le copte. La formulation inhabituelle « circoncision de vérité » est volontairement préservée et expliquée en note.
