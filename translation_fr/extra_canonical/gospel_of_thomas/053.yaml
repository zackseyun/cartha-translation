  to: 'Ses disciples lui dirent : « La circoncision est-elle utile ou non ? » Il leur dit : « Si elle était utile, leur père les engendrerait circoncis dès le sein de leur mère.[a] Mais la circoncision de vérité dans l’esprit[b] s’est révélée pleinement utile.[c] »'
