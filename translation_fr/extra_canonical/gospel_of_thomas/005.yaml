base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: fr
  text: 'Jésus dit : « Connais ce qui est devant ton visage[a], et ce qui t’est caché te sera dévoilé[b]. Car il n’y a rien de caché qui ne paraîtra au grand jour[c].[d] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant ton visage »; cette expression copte signifie « juste devant toi ».'
    reason: cultural_note
  - marker: b
    text: Le verbe copte signifie littéralement « découvrir, enlever ce qui couvre »; on peut aussi traduire par « révéler » ou « faire connaître ».
    reason: lexical_alternative
  - marker: c
    text: L’expression copte signifie « devenir manifeste, apparaître, venir à la lumière », et non « vivre » dans cette construction.
    reason: lexical_alternative
  - marker: d
    text: 'Le témoin grec POxy 654 ajoute : « et rien d’enfoui qui ne soit relevé ». Le texte copte de Nag Hammadi ne contient pas cette proposition supplémentaire; la présente traduction suit le copte.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: connais
  rationale: L’impératif « connais » conserve la brièveté et la force de l’exhortation, sans préciser s’il s’agit de reconnaître, de comprendre ou de savoir.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ
  choice: ce qui est devant ton visage
  rationale: Cette formulation garde l’image concrète du visage et la tournure spatiale du copte, tout en restant compréhensible grâce à la note.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: ce qui t’est caché
  rationale: « Caché » rend directement ϩⲱⲡ sans ajouter la cause, l’auteur ni la nature de cette dissimulation.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: te sera dévoilé
  rationale: « Dévoilé » préserve l’image d’une chose dont on retire ce qui la couvre; le pronom « te » exprime naturellement en français le complément « à toi ».
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: car il n’y a rien
  rationale: Cette tournure française rend clairement la négation universelle introduite par « car ».
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: paraîtra au grand jour
  rationale: L’expression signifie devenir visible ou manifeste. « Paraître au grand jour » la distingue de « dévoiler » tout en conservant l’idée de manifestation.
theological_decisions:
- issue: Nature de ce qui doit être connu et dévoilé
  choice: Ne pas préciser s’il s’agit de réalités visibles, intérieures ou spirituelles
  alternative: Interpréter explicitement la parole comme une exhortation à la connaissance de soi ou à la révélation spirituelle
  rationale: Le texte formule un contraste entre ce qui est présent, ce qui est caché et ce qui sera manifesté, sans identifier davantage ces réalités. La traduction conserve cette ouverture.
translation_notes:
  register: Français moderne, sobre et sentencieux. Le tutoiement singulier reflète les formes coptes adressées à une seule personne. L’image concrète du « visage » est maintenue plutôt que remplacée silencieusement par l’expression plus courante « devant toi ».
