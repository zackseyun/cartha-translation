base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: fr
  text: 'Jésus dit : « Quand vous verrez celui qui n’est pas né d’une femme[a], jetez-vous face contre terre[b] et adorez-le. Celui-là[c] est votre Père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « né d’une femme » est un idiome biblique pour parler de la naissance humaine (voir notamment Jb 14.1 et Mt 11.11), mais son association ici avec « votre Père » est propre à ce logion.
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « jetez-vous sur vos faces » ; on pourrait aussi traduire : « prosternez-vous ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le copte emploie une expression démonstrative appuyée : « celui-là », plutôt qu’un simple « il ».'
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus dit
  rationale: ⲡⲉϫⲉ introduit le discours direct ; le présent de narration français restitue naturellement la forme brève et sentencieuse du texte.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: Quand vous verrez
  rationale: La conjonction temporelle ϩⲟⲧⲁⲛ et la construction prospective en eršan sont rendues naturellement par le futur après « quand ».
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: celui qui n’est pas né d’une femme
  rationale: La relative est définie et l’expression d’origine vise ici explicitement la naissance ; cette formulation demeure directe sans introduire l’idée plus technique d’engendrement.
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: jetez-vous face contre terre
  rationale: « Jetez-vous » conserve la vigueur de ⲡⲱϩⲧ et « face contre terre » exprime en français courant la posture distributive indiquée par le singulier copte avec possesseur pluriel.
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: adorez-le
  rationale: ⲟⲩⲱϣⲧ désigne ici l’adoration associée à la prosternation ; le pronom reprend sans ambiguïté « celui ».
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: Celui-là
  rationale: Le démonstratif français maintient la force déictique de l’expression copte, plus marquée qu’un simple « il ».
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  choice: votre Père
  rationale: La traduction littérale préserve l’identification finale et sa portée théologique sans l’expliquer ni l’atténuer.
theological_decisions:
- issue: Identification de celui qui n’est pas né d’une femme
  choice: Conserver l’identification directe avec « votre Père »
  alternative: Expliciter l’identité de cette figure ou interpréter la formule de manière christologique
  rationale: Le texte formule l’identification sans autre explication. La traduction doit préserver cette tension propre au logion sans importer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent de narration dans l’introduction et le futur après « quand » produisent une formulation naturelle. « Jetez-vous face contre terre » conserve la vigueur concrète du commandement, tandis que les notes signalent la littéralité et les ambiguïtés pertinentes sans surcharger le texte.
