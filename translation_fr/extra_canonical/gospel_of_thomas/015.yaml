  source_fidelity: 'Le texte français rend fidèlement la structure du copte : condition temporelle prospective (« Quand vous verrez »), relative définie (« celui qui n’est pas né d’une femme »), double impératif de prosternation et d’adoration, puis identification finale par un démonstratif appuyé. « Face contre terre » restitue naturellement la posture exprimée par « sur vos faces », sans modifier le sens.'
