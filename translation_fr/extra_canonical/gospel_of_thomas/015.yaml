  terminology: « Adorez-le » correspond bien à ⲟⲩⲱϣⲧ dans ce contexte de prosternation. « Votre Père » préserve exactement le terme relationnel et théologiquement chargé du texte, sans ajouter d’interprétation. « Celui-là » maintient utilement la force déictique de ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ.
