base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: fr
  text: 'Jésus a dit : « Une ville bâtie sur une haute montagne[a] et fortifiée ne peut pas tomber[b], et elle ne pourra pas non plus être cachée[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le fragment grec P.Oxy. 1 précise : « au sommet d’une haute montagne » ; le copte dit simplement : « sur une haute montagne ».'
    reason: textual_variant
  - marker: b
    text: Comparer Matthieu 5.14 et 7.24-25. Ce logion unit l’image de la ville qu’on ne peut cacher à celle d’une construction qui ne tombe pas.
    reason: cross_reference
  - marker: c
    text: 'Dans le copte, la dernière proposition est au futur (« elle ne pourra pas être cachée »), tandis que le fragment grec met les deux verbes au présent : « elle ne peut ni tomber ni être cachée ».'
    reason: textual_variant
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: bâtie
  rationale: Le circonstanciel ⲉⲩⲕⲱⲧ ⲙ̄ⲙⲟⲥ, littéralement « tandis qu’on la bâtit », fonctionne ici comme une relative indéfinie. Le participe passif français rend naturellement cette valeur.
- source_word: ⲧⲟⲟⲩ
  choice: montagne
  rationale: Le terme désigne une montagne ou une hauteur. « Montagne » conserve le sens premier et correspond au témoin grec.
- source_word: ϫⲓⲥⲉ
  choice: haute
  rationale: 'La forme qualitative masculine ⲉϥϫⲟⲥⲉ qualifie ⲧⲟⲟⲩ, nom masculin : c’est donc la montagne qui est haute.'
- source_word: ⲧⲁϫⲣⲟ
  choice: fortifiée
  rationale: Le qualitatif féminin ⲉⲥⲧⲁϫⲣⲏⲩ qualifie la ville et signifie qu’elle a été rendue ferme, solide ou fortifiée. « Fortifiée » convient à l’image urbaine tout en exprimant sa solidité.
- source_word: ϩⲉ
  choice: tomber
  rationale: Dans ⲙⲛ̄ ϭⲟⲙ ⲛ̄ⲥϩⲉ, l’infinitif signifie « tomber » ; la construction entière exprime l’impossibilité.
- source_word: ϩⲱⲡ
  choice: être cachée
  rationale: 'Le verbe signifie « cacher » ; sa forme dans cette construction a un sens passif potentiel : la ville ne pourra pas être cachée.'
theological_decisions:
- issue: Harmonisation avec Matthieu 5.14
  choice: ne peut pas tomber, et elle ne pourra pas non plus être cachée
  alternative: ne peut être cachée
  rationale: Le texte de Thomas ajoute expressément la solidité de la ville et l’impossibilité de sa chute. La traduction conserve cette forme propre au logion au lieu de la réduire au parallèle de Matthieu.
- issue: Portée de l’adjectif « haute »
  choice: haute qualifie la montagne
  alternative: la ville est élevée
  rationale: L’accord masculin du qualitatif copte rattache clairement la hauteur à ⲧⲟⲟⲩ, « montagne », tandis que le qualificatif féminin suivant décrit la ville comme fortifiée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme et la différence de temps du copte. « Fortifiée » rend la fermeté de la ville sans ajouter l’idée absente d’une force humaine qui tenterait de la renverser.
