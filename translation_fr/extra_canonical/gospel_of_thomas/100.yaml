base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: fr
  text: 'Ils montrèrent à Jésus une pièce d’or[a] et lui dirent : « Ceux qui relèvent de César nous réclament l’impôt[b]. » Il leur dit : « Donnez à César les choses de César, donnez à Dieu les choses de Dieu, et ce qui est à moi, donnez-le-moi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’or » ; le contexte indique vraisemblablement une monnaie d’or, sans en préciser la valeur.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « Ceux qui appartiennent à César nous demandent le tribut. » Le verbe peut signifier « demander » ou « chercher » ; dans un contexte fiscal, « réclamer » convient naturellement.'
    reason: lexical_alternative
  - marker: c
    text: Le dernier impératif — « et ce qui est à moi, donnez-le-moi » — ne figure pas dans les récits parallèles des Évangiles synoptiques.
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲥⲉⲃⲉⲓⲥ … ⲓⲏⲥⲟⲩⲥ
  choice: montrèrent à Jésus
  rationale: Le verbe signifie « montrer, présenter ». Dans la scène, « montrèrent » exprime simplement la présentation de l’objet sans ajouter qu’ils le lui remettent.
- source_word: ⲟⲩⲛⲟⲩⲃ
  choice: une pièce d’or
  rationale: ⲛⲟⲩⲃ signifie littéralement « or », mais le contexte fiscal indique vraisemblablement un objet monétaire. La note conserve la possibilité d’une traduction plus littérale.
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: ceux qui sont au service de César
  rationale: La construction désigne ceux qui relèvent de César ou lui sont attachés. Cette formulation française convient au contexte de perception fiscale sans les identifier plus précisément.
- source_word: ⲥⲉϣⲓⲧⲉ ⲙ̄ⲙⲟⲛ
  choice: nous réclament
  rationale: Le verbe peut signifier « chercher, demander ». Avec un impôt pour objet, « réclamer » rend naturellement la demande officielle, sans accentuer autant la contrainte que « exiger ».
- source_word: ⲡϣⲱⲙ
  choice: l’impôt
  rationale: Dans ce contexte, le terme désigne un prélèvement ou tribut. « L’impôt » est le terme courant et immédiatement compréhensible.
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: les choses de César / les choses de Dieu
  rationale: Les formes coptes sont plurielles. La traduction garde ce pluriel et son contraste grammatical avec le singulier « ce qui est à moi » dans la dernière proposition.
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ ⲡⲉ
  choice: ce qui est à moi
  rationale: La construction relative désigne ce qui appartient au locuteur. La formulation préserve la brièveté et l’énigme de l’ajout propre à Thomas.
theological_decisions:
- issue: Portée des appartenances à César, à Dieu et à Jésus
  choice: Conserver les trois affirmations parallèles sans expliquer leurs domaines ni leur hiérarchie
  alternative: Paraphraser en termes de devoirs civils, religieux et personnels
  rationale: Le texte ne précise ni ce qui appartient à chacun ni la relation exacte entre les trois impératifs. Une explicitation doctrinale résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct. « Les choses de César » et « les choses de Dieu » est légèrement moins idiomatique que « ce qui est à César » et « ce qui est à Dieu », mais ce choix préserve le pluriel du manuscrit et son contraste avec le singulier final.
