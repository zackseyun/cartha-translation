  source_fidelity: La traduction rend correctement la présentation d’une monnaie, l’impôt, les impératifs parallèles et l’ajout final propre à Thomas. Toutefois, « ceux qui sont au service de César » restreint indûment ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ, qui désigne plus largement ceux qui relèvent de César / lui appartiennent, sans préciser qu’ils le servent personnellement ou qu’ils sont des agents fiscaux.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Ceux qui relèvent de César » est naturel dans ce contexte tout en restant moins interprétatif que « au service de César ». Les répétitions de « les choses de » reproduisent utilement le pluriel source et restent acceptables dans ce bref énoncé sentencieux.
  terminology: « César », « Dieu », « l’impôt », « pièce d’or » et « donnez » sont justes. La formulation conserve le pluriel des deux premiers objets et le contraste avec le singulier final, sans imposer d’interprétation théologique.
