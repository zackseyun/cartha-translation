base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: fr
  text: 'Jésus a dit : « Celui qui a trouvé le monde[b] et qui est devenu riche[a], qu’il renonce au monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « devenu grand » ou « devenu important » : le verbe copte peut désigner le fait de devenir riche, grand ou éminent.'
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit présente ici une petite lacune; la préposition placée devant le premier emploi de « monde » est restituée par l’éditeur.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: Formule introductive directe et concise, conforme au tour copte et au rythme des paroles de Thomas.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥϭⲓⲛⲉ
  choice: Celui qui a trouvé
  rationale: Le relatif générique et l’accompli copte sont rendus naturellement par « celui qui a trouvé ».
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: le monde
  rationale: « Monde » est le correspondant français courant de l’emprunt grec κόσμος et conserve la répétition frappante du texte.
- source_word: ⲣⲣⲙⲙⲁⲟ
  choice: est devenu riche
  rationale: Le verbe peut exprimer le fait de devenir riche ou grand; « devenu riche » paraît ici le sens principal, sans effacer l’autre possibilité, signalée en note.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥ
  choice: qu’il
  rationale: Le jussif copte appelle une injonction; « qu’il » est idiomatique en français et reprend le référent générique sans lourdeur.
- source_word: ⲁⲣⲛⲁ
  choice: renonce à
  rationale: « Renoncer à » exprime ici un rejet effectif et volontaire, mieux que le simple fait de nier verbalement.
theological_decisions:
- issue: Portée de la richesse ou de la grandeur acquise après avoir trouvé le monde
  choice: Traduire principalement par « devenu riche » sans expliciter de lecture ascétique ou spirituelle
  alternative: « devenu grand » ou « devenu important »
  rationale: Le lexème permet plusieurs nuances. Le texte ne précise ni la nature exacte de cette richesse ou grandeur ni le sens théologique de la renonciation; la traduction conserve cette tension grâce à une note lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure reste concise et conserve la répétition de « monde ». Le masculin grammatical de « celui… qu’il » a une valeur générique.
