  source_fidelity: Révision nécessaire pour corriger « sur les chemins », qui ne rend pas les « rues » du copte, et le pluriel injustifié de « les lieux ». Le reste suit globalement de près le récit copte, y compris les invitations, les motifs de refus et la conclusion abrupte.
  naturalness: Le français est fluide et d’un registre narratif moderne. « On a besoin de moi pour la journée » rend plus naturellement et plus explicitement la demande formulée dans le texte source que « on me demande une journée ». « Afin qu’ils dînent » est plus idiomatique et plus fidèle que « afin qu’ils prennent le dîner ».
  terminology: « Serviteur », « dîner », « acheteurs » et « marchands » conviennent. « Le lieu de mon Père » doit rester au singulier, conformément à ⲡⲧⲟⲡⲟⲥ. La note sur la lacune est conservée et son ancre reste sur la proposition restituée.
  issues:
  - severity: medium
    issue: « sur les chemins »
    rationale: Le copte ⲉⲡϩⲓⲏ (dans le manuscrit ⲁⲛϩⲓⲟⲟⲩⲉ) désigne les rues, non les chemins.
  - severity: medium
    issue: « les lieux de mon Père »
    rationale: 'Le nom ⲡⲧⲟⲡⲟⲥ est singulier : il faut traduire « le lieu de mon Père » sans introduire un pluriel.'
  - severity: low
    issue: « afin qu’ils prennent le dîner »
    rationale: Cette expression est peu naturelle en français et rend moins directement le verbe « dîner / prendre le repas » ; « afin qu’ils dînent » convient.
  - severity: low
    issue: « on me demande une journée »
    rationale: La formulation française est elliptique. Le sens est qu’on requiert sa présence pour une journée ; « on a besoin de moi pour la journée » l’exprime naturellement sans ajout interprétatif.
  revised_text: 'Jésus dit : « Un homme avait des invités. Après avoir préparé le dîner, il envoya son serviteur les convier. Le serviteur alla trouver le premier et lui dit : “Mon maître t’invite.” Celui-ci répondit : “J’ai de l’argent auprès de marchands. Ils viennent me voir ce soir. Je vais leur donner mes instructions. Je te prie de m’excuser pour le dîner.”


    Le serviteur alla trouver un autre et lui dit : “Mon maître t’a invité[a].” Celui-ci lui répondit : “J’ai acheté une maison, et on a besoin de moi pour la journée. Je n’aurai pas le temps.”


    Il alla trouver un autre et lui dit : “Mon maître t’invite.” Celui-ci lui répondit : “Mon ami se marie, et c’est moi qui préparerai le dîner. Je n’irai pas[b]. Je te prie de m’excuser pour le dîner.”


    Il alla trouver un autre et lui dit : “Mon maître t’invite.” Celui-ci lui répondit : “J’ai acheté un village et je vais en percevoir le loyer. Je n’irai pas. Je te prie de m’excuser.”


    Le serviteur revint et dit à son maître : “Ceux que tu as invités au dîner se sont excusés.” Le maître dit à son serviteur : “Va dehors, dans les rues. Amène ceux que tu trouveras, afin qu’ils dînent. Les acheteurs et les marchands n’entreront pas[c] dans le lieu de mon Père.” »'
  revised_footnotes:
  - marker: a
    text: 'Ici, le copte emploie une forme accomplie : « mon maître t’a invité ». Dans les autres invitations, il emploie le présent : « mon maître t’invite ».'
    reason: textual_variant
  - marker: b
    text: La forme copte correspond au verbe « aller ». Certaines traductions anciennes l’ont comprise comme « je ne pourrai pas », mais ce dernier sens demanderait normalement un infinitif complément.
    reason: lexical_alternative
  - marker: c
    text: Le manuscrit présente ici une courte lacune. La restitution « n’entreront pas » correspond aux traces visibles et à l’espace disponible.
    reason: textual_variant
  revision_rationale: 'La révision conserve la structure répétitive et les ambiguïtés du logion tout en rétablissant deux détails lexicaux du copte : les rues et le singulier « lieu ». Elle améliore aussi deux formulations françaises sans modifier le sens. Aucune note théologique interprétative n’est ajoutée.'
