base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: fr
  text: 'Jésus dit : « Un homme avait des invités. Après avoir préparé le dîner, il envoya son serviteur les convier. Le serviteur alla trouver le premier et lui dit : “Mon maître t’invite.” Celui-ci répondit : “J’ai de l’argent auprès de marchands. Ils viennent me voir ce soir. Je vais leur donner mes instructions. Je te prie de m’excuser pour le dîner.”


    Le serviteur alla trouver un autre et lui dit : “Mon maître t’a invité[a].” Celui-ci lui répondit : “J’ai acheté une maison, et on a besoin de moi pour la journée. Je n’aurai pas le temps.”


    Il alla trouver un autre et lui dit : “Mon maître t’invite.” Celui-ci lui répondit : “Mon ami se marie, et c’est moi qui préparerai le dîner. Je n’irai pas[b]. Je te prie de m’excuser pour le dîner.”


    Il alla trouver un autre et lui dit : “Mon maître t’invite.” Celui-ci lui répondit : “J’ai acheté un village et je vais en percevoir le loyer. Je n’irai pas. Je te prie de m’excuser.”


    Le serviteur revint et dit à son maître : “Ceux que tu as invités au dîner se sont excusés.” Le maître dit à son serviteur : “Va dehors, dans les rues. Amène ceux que tu trouveras, afin qu’ils dînent. Les acheteurs et les marchands n’entreront pas[c] dans le lieu de mon Père.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, le copte emploie une forme accomplie : « mon maître t’a invité ». Dans les autres invitations, il emploie le présent : « mon maître t’invite ».'
    reason: textual_variant
  - marker: b
    text: La forme copte correspond au verbe « aller ». Certaines traductions anciennes l’ont comprise comme « je ne pourrai pas », mais ce dernier sens demanderait normalement un infinitif complément.
    reason: lexical_alternative
  - marker: c
    text: Le manuscrit présente ici une courte lacune. La restitution « n’entreront pas » correspond aux traces visibles et à l’espace disponible.
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: invités
  rationale: Le mot désigne d’abord des étrangers ou des personnes venues d’ailleurs, mais le contexte du repas et de la convocation appelle naturellement « invités » en français.
- source_word: ϩⲟⲙⲧ
  choice: argent
  rationale: Le nom signifie littéralement « cuivre » et, par extension, « monnaie, argent ». Le choix conserve le détail économique concret.
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: donner mes instructions
  rationale: Le composé exprime l’idée de commander ou de donner des ordres. Cette formulation est naturelle dans le contexte d’une affaire commerciale.
- source_word: ⲥⲣϥⲉ
  choice: avoir le temps
  rationale: Le verbe signifie avoir du loisir ou du temps disponible.
- source_word: ϣⲓ
  choice: aller
  rationale: Il s’agit d’une forme dialectale ou variante de ϣⲉ, « aller », et non du verbe « pouvoir ».
- source_word: ϫⲓ ⲛϣⲱⲙ
  choice: percevoir le loyer
  rationale: L’expression idiomatique désigne la perception d’un loyer ou fermage.
- source_word: ⲣⲉϥⲧⲟⲟⲩ
  choice: acheteurs
  rationale: Nom d’agent formé sur le verbe « acheter » ; la traduction conserve son sens distinct de « marchands ».
- source_word: ϣⲟⲧⲉ
  choice: marchands
  rationale: Le terme désigne des commerçants ou négociants.
- source_word: ⲧⲟⲡⲟⲥ
  choice: lieux
  rationale: L’emprunt grec signifie « lieu, endroit » ; le pluriel français suit la forme et évite de remplacer le texte par « royaume ».
theological_decisions:
- issue: La conclusion exclut explicitement « les acheteurs et les marchands » des lieux du Père.
  choice: Traduire directement cette conclusion sans l’harmoniser avec les paraboles synoptiques.
  alternative: Remplacer ou expliquer « les lieux de mon Père » par « le royaume de mon Père », ou atténuer la référence aux acteurs du commerce.
  rationale: Le texte copte nomme précisément les acheteurs, les marchands et les lieux du Père. La traduction préserve cette formulation propre au logion sans imposer une identification théologique supplémentaire ni une interprétation ascétique particulière.
- issue: La succession des motifs économiques et sociaux donnés pour refuser le dîner.
  choice: Conserver chaque motif concret sans les qualifier d’excuses mensongères ou légitimes.
  alternative: Présenter les personnages comme condamnés en raison de leur attachement aux biens matériels.
  rationale: Le récit établit une tension entre l’invitation et leurs occupations, mais ne formule pas explicitement dans chaque cas un jugement sur leurs intentions.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes du récit sont maintenues, tout en variant légèrement les enchaînements pour assurer une lecture naturelle. « Serviteur » rend le rapport de service sans archaïsme inutile ; « dîner » conserve le vocabulaire du repas dans tout le logion. Les formulations volontairement abruptes, notamment « on me demande une journée » et la sentence finale, ne sont pas surinterprétées.
