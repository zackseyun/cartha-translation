base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: fr
  text: 'Jésus a dit : « Heureux[a] les pauvres[b], car le royaume[c] des cieux[d] est à vous[e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Bienheureux » ou « Qu’ils sont favorisés ». « Heureux » conserve la formulation concise d’une béatitude.'
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit porte ici le pluriel « les pauvres »; le texte normalisé fourni présente « le pauvre » au singulier générique. Dans les deux cas, la formulation désigne collectivement les personnes pauvres.
    reason: textual_note
  - marker: c
    text: Le mot copte peut aussi se traduire par « règne » ou « royauté », termes qui mettent davantage l’accent sur la souveraineté que sur un domaine.
    reason: lexical_alternative
  - marker: d
    text: « Des cieux » reproduit le pluriel explicite du copte; il ne faut pas le remplacer silencieusement par « de Dieu ».
    reason: source_form
  - marker: e
    text: 'Comparer Luc 6.20 : « Heureux, vous les pauvres, car le royaume de Dieu est à vous », et Matthieu 5.3 : « Heureux les pauvres en esprit, car le royaume des cieux est à eux ». Thomas associe les « pauvres » à une adresse à la deuxième personne du pluriel, sans les mots « en esprit ».'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: Formule courante et naturelle pour introduire une parole; le second élément ϫⲉ est rendu par les deux-points et les guillemets.
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Heureux
  rationale: Le terme, emprunté au grec, peut exprimer le bonheur ou la condition favorable; « Heureux » conserve en français la forme traditionnelle et évaluative d’une béatitude sans expliciter la source de cette faveur.
- source_word: ⲡϩⲏⲕⲉ / ⲛϩⲏⲕⲉ
  choice: les pauvres
  rationale: Le manuscrit porte un pluriel, tandis que le texte normalisé fourni présente un singulier générique. « Les pauvres » rend naturellement dans les deux cas le groupe visé, sans ajouter « en esprit ».
- source_word: ϫⲉ
  choice: car
  rationale: Le second ϫⲉ introduit ici le motif de la déclaration; « car » en restitue sobrement la valeur causale.
- source_word: ⲧⲱⲧⲛ
  choice: est à vous
  rationale: Le pronom indépendant est à la deuxième personne du pluriel. La tournure française « est à vous » rend clairement l’appartenance exprimée par la proposition copulative.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: le royaume
  rationale: « Royaume » convient à l’usage du terme dans Thomas comme réalité ou domaine auquel on peut appartenir ou accéder; « règne » demeure possible si l’on veut souligner davantage l’exercice de la souveraineté.
- source_word: ⲛⲡⲡⲉ
  choice: des cieux
  rationale: Le copte emploie explicitement le pluriel; la locution française « des cieux » le préserve de façon idiomatique.
theological_decisions:
- issue: Nature de ⲡⲙⲛⲧⲣⲣⲟ
  choice: royaume
  alternative: règne; royauté
  rationale: Le texte ne tranche pas entièrement entre domaine royal et souveraineté exercée. « Royaume » convient le mieux au contexte thomasien, tandis qu’une note maintient ouvertes les autres nuances lexicales.
- issue: Identité des pauvres
  choice: les pauvres
  alternative: les pauvres en esprit
  rationale: Aucun équivalent de « en esprit » ne figure dans le texte copte. L’ajouter harmoniserait indûment cette parole avec Matthieu 5.3.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation conserve le rythme bref de la béatitude, le pluriel « des cieux » et l’adresse directe « à vous », tout en évitant d’importer l’ajout matthéen « en esprit ».
