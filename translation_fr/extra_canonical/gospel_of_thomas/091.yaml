base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: fr
  text: 'Ils lui dirent : « Dis-nous qui tu es, afin que nous croyions en toi[a]. » Il leur dit : « Vous examinez la face du ciel et de la terre[b], mais celui qui est devant vous, vous ne le reconnaissez pas[c] ; et ce moment[d], vous ne savez pas l’examiner. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « croire » peut aussi signifier « faire confiance » ou « se fier à ».
    reason: lexical_alternative
  - marker: b
    text: L’expression copte dit littéralement « la face du ciel et de la terre » ; « face » peut ici désigner l’aspect ou l’apparence.
    reason: cultural_note
  - marker: c
    text: On pourrait aussi comprendre « ce qui est devant vous », mais le pronom masculin singulier qui suit favorise « celui qui est devant vous ».
    reason: textual_variant
  - marker: d
    text: Le mot grec kairos désigne un moment opportun, approprié, fixé ou critique, plutôt que le temps en général.
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Dis-nous
  rationale: Les formes du manuscrit et du texte normalisé expriment toutes deux une demande impérative. « Dis-nous » est direct, naturel et fidèle à la formule dialoguée.
- source_word: ⲛ̄ⲧⲕ ⲛⲓⲙ
  choice: qui tu es
  rationale: Dans ce dialogue, l’interrogatif porte sur l’identité personnelle.
- source_word: ⲣ̄ⲡⲓⲥⲧⲉⲩⲉ
  choice: croyions en toi
  rationale: Le verbe d’emprunt grec πιστεύειν peut exprimer la foi ou la confiance. « Croire en toi » convient à la construction et laisse la nuance de confiance en note.
- source_word: ⲣ̄ⲡⲓⲣⲁⲍⲉ
  choice: examiner
  rationale: Le verbe d’emprunt grec πειράζειν signifie mettre à l’épreuve, éprouver ou examiner. « Examiner » reste naturel avec « la face du ciel et de la terre » et permet de conserver la répétition du même verbe à la fin.
- source_word: ⲡϩⲟ
  choice: face
  rationale: Le sens littéral est « face », avec la possibilité idiomatique d’« aspect » ou d’« apparence ». La formulation imagée est conservée dans le texte et expliquée en note.
- source_word: ⲧⲡⲉ
  choice: ciel
  rationale: Associé à la terre dans un contexte d’observation, le mot désigne ici le ciel visible sans exiger le sens théologique de « cieux ».
- source_word: ⲡⲕⲁϩ
  choice: terre
  rationale: Ce terme désigne la terre, le sol ou le pays ; dans le couple ciel-terre, « terre » est le choix naturel.
- source_word: ⲡⲉⲧⲛ̄ⲡⲉⲧⲛ̄ⲙⲧⲟ ⲉⲃⲟⲗ
  choice: celui qui est devant vous
  rationale: Le relatif peut être compris personnellement ou de manière neutre. Le pronom objet masculin singulier qui suit favorise une référence personnelle, sans rendre l’autre lecture impossible.
- source_word: ⲥⲟⲩⲱⲛϥ
  choice: vous ne le reconnaissez pas
  rationale: Le verbe signifie connaître, mais la présence immédiate de la personne rend ici « reconnaître » particulièrement approprié.
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: moment décisif
  rationale: L’emprunt grec καιρός évoque un temps opportun, déterminé ou critique plutôt que le temps en général. « Moment décisif » communique cette portée en français courant, tandis que la note conserve le terme grec.
- source_word: ⲥⲟⲟⲩⲛ ⲁⲛ ⲛ̄ⲣ̄ⲡⲓⲣⲁⲍⲉ ⲙ̄ⲙⲟϥ
  choice: vous ne savez pas l’examiner
  rationale: La construction exprime le savoir-faire ou la capacité de discernement. La reprise d’« examiner » reproduit la répétition du verbe source.
theological_decisions:
- issue: Référent de « celui qui est devant vous »
  choice: Référence personnelle à l’interlocuteur présent
  alternative: « ce qui est devant vous »
  rationale: Le pronom masculin singulier repris dans « vous ne le reconnaissez pas » favorise la lecture personnelle, tout en laissant l’ambiguïté grammaticale signalée en note.
- issue: Sens de καιρός
  choice: « moment décisif »
  alternative: Conserver « kairos », ou traduire par « temps fixé » / « occasion favorable »
  rationale: Le texte ne précise pas s’il s’agit d’une occasion, d’un temps fixé ou d’une crise eschatologique. « Moment décisif » maintient la tension sans imposer une interprétation confessionnelle précise.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde le contraste et la répétition du texte copte, tout en restant immédiatement compréhensible. « Face » conserve l’image frappante de l’original ; « moment décisif » rend kairos sans jargon non expliqué.
