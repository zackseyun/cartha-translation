base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: fr
  text: 'Jésus dit : « L’écharde qui est dans l’œil de ton frère, tu la vois ; mais la poutre qui est dans ton propre œil, tu ne la vois pas. Quand tu auras retiré la poutre de ton œil, alors tu verras clairement afin de retirer l’écharde de l’œil de ton frère. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la fin peut se rendre : « alors tu verras clairement pour retirer l’écharde de l’œil de ton frère ». Le verbe traduit par « retirer » peut aussi signifier « jeter dehors » ou « expulser ».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: l’écharde
  rationale: Le terme désigne un petit fragment de bois. « Écharde » conserve l’image du bois et le contraste avec la poutre, sans harmonisation implicite avec les parallèles canoniques.
- source_word: ⲡⲥⲟⲓ
  choice: la poutre
  rationale: Le mot désigne une pièce de bois de construction. « Poutre » rend précisément cette valeur architecturale et maintient le contraste saisissant avec l’écharde.
- source_word: ⲛⲟⲩϫⲉ
  choice: retirer
  rationale: Le verbe peut signifier jeter ou expulser, mais, lorsqu’il s’agit d’un objet dans l’œil, « retirer » est idiomatique en français et convient aux deux occurrences.
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: voir clairement
  rationale: L’expression, littéralement « voir au-dehors », indique ici une vision devenue nette ou dégagée.
- source_word: ⲥⲟⲛ
  choice: frère
  rationale: Le sens lexical est « frère » ; le terme peut, dans ce contexte, désigner un autre disciple, mais cette extension n’est pas incorporée au texte.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: quand tu auras retiré
  rationale: La construction introduit une circonstance temporelle future ou conditionnelle. Le futur antérieur français exprime naturellement l’action préalable au fait de voir clairement.
- source_word: ⲃⲁⲗ
  choice: œil
  rationale: Terme anatomique courant, sans nuance particulière dans ce passage.
theological_decisions:
- issue: Portée de « frère »
  choice: Conserver le terme concret « frère » dans le texte
  alternative: « prochain », « semblable » ou « autre disciple »
  rationale: Le copte emploie explicitement ⲥⲟⲛ. Élargir le terme dans le corps du texte ferait disparaître son image familiale et imposerait une interprétation communautaire particulière.
- issue: Lien entre voir clairement et retirer l’écharde
  choice: « alors tu verras clairement et tu pourras retirer »
  alternative: « alors tu verras clairement pour retirer »
  rationale: L’infinitif copte après « voir clairement » peut exprimer le but ou la capacité pratique. La formulation française retenue restitue l’enchaînement logique sans transformer l’énoncé en promesse d’autorité morale ou spirituelle.
translation_notes:
  register: Français moderne, international et digne. La topicalisation copte est conservée par « L’écharde…, tu la vois » et « la poutre…, tu ne la vois pas », avec les pronoms de reprise. « Ton propre œil » rend l’opposition emphatique du contexte sans lourdeur excessive.
