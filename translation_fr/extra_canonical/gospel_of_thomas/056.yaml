base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: fr
  text: 'Jésus a dit : « Quiconque a connu le monde[b] a trouvé un cadavre ; et quiconque a trouvé le cadavre[a], le monde n’est pas digne de lui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première proposition dit « un cadavre », tandis que la seconde dit « le cadavre », renvoyant vraisemblablement au même cadavre déjà découvert. La différence d’article présente dans le copte est conservée.
    reason: dialect_note
  - marker: b
    text: 'Le copte présente la connaissance comme un état acquis. On pourrait aussi traduire : « en est venu à connaître le monde ».'
    reason: lexical_alternative
  - marker: c
    text: 'Comparer Hébreux 11.38 : « le monde n’était pas digne d’eux ». Il ne s’agit pas d’un parallèle synoptique, mais seulement d’un rapprochement thématique.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: La formule copte introduit un enseignement rapporté ; le passé composé convient au français moderne tout en gardant la sobriété narrative.
- source_word: ⲥⲟⲟⲩⲛ
  choice: a connu
  rationale: Le passé composé exprime ici l’état acquis de connaissance indiqué par la construction perfective, sans ajouter l’idée d’un effort ou d’une progression absente du texte.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: le monde
  rationale: Cet emprunt au grec kosmos désigne couramment le monde dans l’Évangile selon Thomas ; « cosmos » serait inutilement technique.
- source_word: ϩⲉ
  choice: a trouvé
  rationale: « Trouver » restitue directement le verbe copte et conserve la formulation brève du logion.
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: un cadavre / le cadavre
  rationale: Le nom signifie « cadavre ». Le passage de l’article indéfini à l’article défini est conservé, le second emploi renvoyant naturellement au cadavre déjà mentionné.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: le monde n’est pas digne de lui
  rationale: Cette formulation rend directement l’idiome copte « ne pas être digne de lui » et maintient le renversement final.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: quiconque
  rationale: « Quiconque » rend la portée indéfinie de la proposition relative et permet de conserver la concision sentencieuse du texte.
theological_decisions:
- issue: Valeur métaphorique de « cadavre »
  choice: Conserver littéralement « cadavre » sans expliciter la métaphore
  alternative: Interpréter ou paraphraser comme « un monde mort »
  rationale: Le texte identifie le monde à un cadavre de manière abrupte sans en préciser la portée. Une paraphrase trancherait une ambiguïté théologique que la traduction doit préserver.
- issue: Portée de « le monde n’est pas digne de lui »
  choice: Conserver le jugement tel quel
  alternative: Préciser que la personne est supérieure au monde
  rationale: La formulation source affirme l’indignité du monde sans expliquer en quoi consiste cette dignité ni développer une hiérarchie spirituelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Quiconque » garde la forme sentencieuse du logion sans lourdeur. La répétition de « monde » et de « cadavre » est volontairement maintenue, de même que l’enchaînement abrupt des deux propositions.
