base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: fr
  text: 'Jésus dit : « Là où il y a trois dieux, ils sont des dieux.[a] Là où il y en a deux ou un,[b] moi, je suis avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit copte porte une formulation difficile : « … parmi/dans des dieux ils sont », tandis que le texte normalisé donne « c’est un dieu ». La traduction « ils sont des dieux » suit la prédication plurielle suggérée par le contexte et attestée par le témoin grec POxy 1.'
    reason: textual_variant
  - marker: b
    text: Le témoin grec POxy 1 ne mentionne ici que « un » et poursuit avec les images de la pierre et du bois ; dans le manuscrit copte, celles-ci figurent séparément dans la parole 77.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus dit
  rationale: Le présent narratif conserve la formulation brève et immédiate qui caractérise les paroles de l’évangile selon Thomas.
- source_word: ⲡⲙⲁ ⲉⲣⲉⲟⲩⲛ- … ⲙⲙⲁⲩ
  choice: Là où il y a…
  rationale: Cette tournure française rend naturellement la construction existentielle et spatiale copte sans répéter inutilement « là ».
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: trois dieux
  rationale: Traduction directe du numéral et du pluriel, sans atténuer la formulation volontairement frappante.
- source_word: ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ / ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ
  choice: ils sont des dieux
  rationale: La prédication au pluriel convient au sujet « trois dieux » et correspond au témoin grec, tout en signalant en note la difficulté textuelle du manuscrit copte.
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: deux ou un
  rationale: Les deux numéraux du texte copte sont conservés sans expliciter leur référent, afin de préserver l’ellipse et l’ambiguïté de la parole.
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ / ⲁⲛⲟⲕϣⲱⲡⲉ
  choice: moi, je suis
  rationale: « Moi, je » rend l’insistance produite par le pronom indépendant suivi de la forme verbale à la première personne, sans donner à tort l’impression d’un « je » bégayé ou répété.
- source_word: ⲙⲛⲛⲧⲟϥ
  choice: avec lui
  rationale: La préposition et le pronom masculin singulier sont rendus directement, sans préciser qui est désigné.
theological_decisions:
- issue: Sens de « trois dieux »
  choice: Conserver littéralement « trois dieux » et « ils sont des dieux »
  alternative: Interpréter « dieux » comme des personnes divines, des êtres humains ou une allusion doctrinale déterminée
  rationale: Le texte ne précise ni l’identité des trois ni la portée théologique de l’énoncé. Une interprétation explicative résoudrait indûment sa tension.
- issue: Référent de « deux ou un » et de « lui »
  choice: Maintenir l’ellipse et le masculin singulier
  alternative: Ajouter « personnes », employer une formulation inclusive ou identifier explicitement l’individu solitaire
  rationale: Le copte laisse le référent sous-entendu et passe à un pronom masculin singulier. La traduction conserve cette ambiguïté grammaticale et théologique.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe volontairement énigmatique est conservée. « Moi, je suis » exprime une insistance naturelle en français sans reproduire artificiellement un double « je ».
