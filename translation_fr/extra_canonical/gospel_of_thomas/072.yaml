base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: fr
  text: 'Un homme lui dit[a] : « Dis à mes frères[b] de partager avec moi les biens[c] de mon père. » Il lui dit : « Homme, qui m’a chargé de faire le partage ? » Il se tourna[d] vers ses disciples et leur dit : « Je ne suis pas chargé de faire le partage, n’est-ce pas ? »[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de la phrase (« Un homme lui dit ») est partiellement restauré, car quelques lettres sont endommagées dans le manuscrit.
    reason: lacuna_or_restoration
  - marker: b
    text: Le texte du manuscrit porte « mes frères » au pluriel ; la forme normalisée fournie porte « mon frère » au singulier.
    reason: textual_variant
  - marker: c
    text: 'Ou : « les possessions » ou « l’héritage ». Le mot copte désigne les biens, sans préciser à lui seul leur statut juridique.'
    reason: lexical_alternative
  - marker: d
    text: La différence entre les formes coptes imprimée et normalisée du verbe « se tourner » est dialectale ou orthographique et ne modifie pas le sens.
    reason: dialect_note
  - marker: e
    text: 'La particule copte ⲙⲏ introduit ici vraisemblablement une question appelant une réponse négative. Autre traduction possible : « Suis-je donc chargé de faire le partage ? »'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁϥ
  choice: Un homme lui dit
  rationale: Formule narrative simple et directe; le début est partiellement restauré dans le manuscrit.
- source_word: ⲛ̄ⲛⲁⲥⲛⲏⲩ / ⲛⲡⲁⲥⲟⲛ
  choice: mes frères
  rationale: Le texte diplomatique porte le pluriel, tandis que la normalisation fournie a le singulier; le pluriel est retenu et la variante signalée.
- source_word: ϣⲓⲛⲁ ⲉⲩⲛⲁⲡⲱϣⲉ
  choice: de partager
  rationale: Après l’impératif « Dis », le français emploie naturellement l’infinitif pour rendre le but exprimé par ϣⲓⲛⲁ et le prospectif.
- source_word: ⲛ̄ⲛ̄ϩⲛⲁⲁⲩ ⲙ̄ⲡⲁⲉⲓⲱⲧ
  choice: les biens de mon père
  rationale: ϩⲛⲁⲁⲩ désigne des biens ou possessions; « les biens » convient au contexte familial sans imposer explicitement la notion juridique d’héritage.
- source_word: ⲙ̄ⲙⲁⲉⲓ
  choice: avec moi
  rationale: Rend directement la construction comitative.
- source_word: ⲱ ⲡⲣⲱⲙⲉ
  choice: Homme
  rationale: Conserve l’adresse vocative abrupte sans l’adoucir en « Monsieur ».
- source_word: ⲛ̄ⲧⲁϩⲁⲁⲧ⳿ ⲛ̄ⲣⲉϥⲡⲱϣⲉ
  choice: qui m’a établi comme partageur ?
  rationale: Le verbe exprime ici le fait de faire ou d’établir quelqu’un dans une fonction; « partageur » préserve le nom d’agent et évite d’harmoniser avec « juge » en Luc 12.
- source_word: ⲁϥⲕⲟⲧϥ̅ ⲁ⳿ⲛⲉϥⲙⲁⲑⲏⲧⲏⲥ
  choice: Puis il se tourna vers ses disciples
  rationale: Rendu idiomatique de la tournure réflexive; « Puis » assure naturellement la progression narrative.
- source_word: ⲙⲏ ⲉⲉⲓϣⲟⲟⲡ̂ ⲛ̄ⲣⲉϥ⳿ⲡⲱϣⲉ
  choice: Je ne suis pas un partageur, n’est-ce pas ?
  rationale: ⲙⲏ introduit ici une question rhétorique orientée vers une réponse négative; la question-tag française en restitue la force.
theological_decisions:
- issue: Relation avec Luc 12.13-14
  choice: Conserver seulement « partageur »
  alternative: Ajouter ou substituer « juge » / « arbitre »
  rationale: Le témoin copte de Thomas ne contient que le nom d’agent formé sur « partager »; l’harmonisation avec Luc effacerait une différence textuelle réelle.
- issue: Force de la dernière parole
  choice: La rendre comme une question rhétorique négative
  alternative: '« Voyez : je ne suis pas un partageur » ou « Suis-je un partageur ? »'
  rationale: La particule ⲙⲏ soutient une interrogation attendant une réponse négative. La formulation retenue conserve à la fois la négation explicite et la tension rhétorique.
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases restent proches de la structure copte tout en étant naturelles. « Partageur », moins courant que « arbitre », est volontairement conservé pour reproduire le terme répété fondé sur le verbe « partager » et pour ne pas importer le mot « juge » du parallèle lucanien.
