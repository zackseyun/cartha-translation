revisions:
- from: 'Un homme lui dit[a] : « Dis à mes frères[b] de partager avec moi les biens[c] de mon père. » Il lui répondit : « Homme, qui m’a établi comme partageur ? » Puis il se tourna vers ses disciples[d] et leur dit : « Je ne suis pas un partageur, n’est-ce pas ? »[e]'
  to: 'Un homme lui dit[a] : « Dis à mes frères[b] de partager avec moi les biens[c] de mon père. » Il lui dit : « Homme, qui m’a chargé de faire le partage ? » Il se tourna[d] vers ses disciples et leur dit : « Je ne suis pas chargé de faire le partage, n’est-ce pas ? »[e]'
  rationale: 'La révision améliore l’idiomaticité de la fonction désignée par le nom d’agent copte : « chargé de faire le partage » est plus clair que « partageur » en français moderne, tout en conservant la répétition intentionnelle de l’expression et le refus de tout rôle judiciaire. La note dialectale est également rattachée au mot qu’elle explique. Aucun changement de sens n’est apporté.'
