base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: fr
  text: 'Jésus a dit : « J’ai jeté un feu sur le monde[a] et, voyez[b], je veille sur lui[c] jusqu’à ce qu’il s’embrase. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Comparer Luc 12.49 : « Je suis venu jeter un feu sur la terre… » Thomas emploie ici « monde » et poursuit par : « je veille sur lui jusqu’à ce qu’il s’embrase ».'
    reason: cross_reference
  - marker: b
    text: L’expression ⲉⲓⲥϩⲏⲏⲧⲉ peut aussi se rendre par « regardez », « voici » ou « prêtez attention ».
    reason: lexical_alternative
  - marker: c
    text: ϩⲁⲣⲉϩ peut aussi se traduire par « je le garde » ou « je monte la garde auprès de lui » ; le verbe comporte l’idée de surveillance et peut avoir une nuance protectrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: J’ai jeté
  rationale: Le verbe ⲛⲟⲩϫⲉ signifie « jeter, lancer ». Le passé composé exprime naturellement en français une action accomplie dont l’effet demeure actuel.
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: un feu
  rationale: L’article indéfini est conservé, et « feu » rend directement le sens fondamental de ⲕⲱϩⲧ.
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: sur le monde
  rationale: « Sur » rend simplement ⲉϫⲛ, tandis que « monde » est l’équivalent français courant du terme emprunté au grec κόσμος.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: voyez
  rationale: Cette interjection déictique attire vivement l’attention. « Voyez » garde cette fonction dans un registre actuel et digne, sans l’archaïsme de « voici que » ou de « voyez donc ».
- source_word: ϩⲁⲣⲉϩ
  choice: je veille sur
  rationale: Le verbe désigne l’action de garder ou de surveiller. « Veiller sur » conserve sa nuance durative et protectrice tout en restant naturel avec le feu comme objet.
- source_word: ⲉⲛⲧⲟϥ
  choice: lui
  rationale: Le pronom masculin singulier reprend « un feu », masculin en français comme en copte. Cette reprise explicite évite de remplacer silencieusement le pronom par le nom.
- source_word: ϣⲁⲛⲧⲉ
  choice: jusqu’à ce que
  rationale: La locution introduit le terme temporel de l’action de veiller et exige naturellement le subjonctif en français.
- source_word: ϫⲉⲣⲟ
  choice: s’embrase
  rationale: « S’embraser » exprime l’entrée dans une combustion vive et restitue mieux la force imagée du verbe que le simple « brûler ».
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et solennel sans archaïsmes. La phrase conserve l’image énigmatique du feu ainsi que la tension entre une action déjà accomplie (« j’ai jeté ») et la vigilance qui se poursuit (« je veille »).
