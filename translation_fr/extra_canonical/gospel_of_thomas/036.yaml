base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: fr
  text: 'Jésus dit : « Ne vous inquiétez pas, du matin au soir et du soir au matin, de ce que vous mettrez sur vous. »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec POxy 655 présente ici une forme plus développée, avec des éléments concernant la nourriture, les lis et la taille; il ne rejoint ce texte que dans la proposition relative à l’habillement. La traduction suit le texte copte de Nag Hammadi.
    reason: textual_variant
  - marker: b
    text: Dans le manuscrit, la lecture de la proposition finale comporte une lettre rétablie par l’éditeur; le texte normalisé comprend la construction au sens de « ce que vous mettrez sur vous ».
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: Ne vous inquiétez pas
  rationale: L’impératif négatif exprime l’interdiction de s’inquiéter ou de se faire du souci. Cette formulation est naturelle, claire et digne en français moderne.
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ ... ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: du matin au soir et du soir au matin
  rationale: Cette tournure conserve le parallélisme temporel et la symétrie du copte dans un français idiomatique.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: de ce que vous…
  rationale: La relative sans antécédent a le sens de « ce que », tandis que la construction avec ⲛⲁ porte une valeur future.
- source_word: ϯⲛⲧⲟϥ ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: mettrez sur vous
  rationale: La formulation garde l’action concrète de mettre un vêtement et la nuance réflexive, sans ajouter explicitement « vêtements », absent du texte copte.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: La coordination simple préserve la parataxe du texte.
theological_decisions:
- issue: Portée de l’exhortation
  choice: Ne pas préciser l’objet implicite au-delà de « ce que vous mettrez sur vous »
  alternative: Ajouter « comme vêtements » ou reformuler « de quoi vous vêtir »
  rationale: Le contexte implique l’habillement, mais le copte laisse l’objet du verbe implicite. La traduction conserve cette sobriété et n’élargit pas l’énoncé en doctrine générale sur la providence.
translation_notes:
  register: Français international moderne, simple et digne. Le discours direct est ponctué selon l’usage français. « Ne vous inquiétez pas » rend l’exhortation sans archaïsme; « mettrez sur vous » conserve la concrétude et la légère étrangeté du copte plutôt que de l’expliciter par « vêtements ».
