base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: fr
  text: 'Le disciple lui dit : « Tes frères et ta mère se tiennent dehors[a]. » Il leur dit : « Ceux qui sont ici[b] et qui font la volonté[c] de mon Père, ceux-là sont mes frères et ma mère. Ce sont eux qui entreront[d] dans le royaume[e] de mon Père[f]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit comporte littéralement une formulation proche de « se tiennent devant eux, dehors » (ⲥⲉⲁϩⲉⲣⲁⲧⲟⲩ ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ). La tournure pronominale paraît redondante ou irrégulière; le texte principal en rend clairement l’indication de lieu.
    reason: dialect_note
  - marker: b
    text: « Ceux qui sont ici » rend l’expression déictique ⲡⲉⲧⲉⲣⲉⲛⲡⲉⲓⲙⲁ, littéralement « ceux qui sont en ce lieu-ci ».
    reason: lexical_alternative
  - marker: c
    text: Le mot ⲟⲩⲱϣ peut signifier « volonté », mais aussi « souhait » ou « désir ».
    reason: lexical_alternative
  - marker: d
    text: « Entrer » traduit ⲃⲱⲕ ⲉϩⲟⲩⲛ, que l’on pourrait rendre plus littéralement par « aller à l’intérieur ».
    reason: lexical_alternative
  - marker: e
    text: « Royaume » (ⲙⲛⲧⲣⲣⲟ) est un nom abstrait formé à partir du mot « roi » (ⲣⲣⲟ); selon le contexte, il peut aussi évoquer la royauté ou le règne.
    reason: cultural_note
  - marker: f
    text: Comparer Marc 3.31-35; Matthieu 12.46-50; Luc 8.19-21. L’Évangile selon Thomas ajoute ici qu’ils entreront dans le royaume du Père.
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: frères
  rationale: En sahidique, le terme désigne normalement des frères de sexe masculin, même si un sens plus large de membres d’une même fratrie reste possible.
- source_word: ⲙⲁⲁⲩ
  choice: mère
  rationale: Équivalent français direct du terme copte courant pour « mère ».
- source_word: ⲁϩⲉⲣⲁⲧⲟⲩ / ⲧⲟⲟⲩⲱϩ ⲉⲣⲁⲧ-
  choice: se tiennent
  rationale: L’expression décrit ici une position présente et convient naturellement à des personnes qui attendent dehors.
- source_word: ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: dehors
  rationale: Cette locution indique l’extérieur; « dehors » est idiomatique et précis en français.
- source_word: ⲡⲉⲓⲙⲁ
  choice: ici
  rationale: Le déictique signifie littéralement « ce lieu-ci »; « ceux qui sont ici » en conserve la portée.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  choice: faire la volonté
  rationale: Locution naturelle dans ce contexte; ⲟⲩⲱϣ peut aussi exprimer le souhait ou le désir.
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: mon Père
  rationale: Le possessif de première personne est conservé, ainsi que la désignation relationnelle du Père.
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: entrer
  rationale: Le mouvement « aller vers l’intérieur » se rend avec concision par « entrer ».
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: royaume
  rationale: Nom abstrait formé sur « roi »; « royaume » est l’équivalent français consacré sans supprimer l’idée de règne royal.
theological_decisions:
- issue: La parenté définie par l’accomplissement de la volonté du Père
  choice: 'Conserver l’identification directe : « ceux-là sont mes frères et ma mère »'
  alternative: Expliciter une famille seulement « spirituelle » ou « véritable »
  rationale: Le texte établit lui-même l’analogie sans employer ces qualificatifs; les ajouter résoudrait indûment sa tension avec la parenté familiale.
- issue: Le rapport entre cette parenté et l’entrée dans le royaume
  choice: Maintenir deux affirmations successives sans préciser un mécanisme doctrinal
  alternative: Introduire une relation causale explicite, par exemple « c’est pourquoi »
  rationale: Le copte juxtapose l’identité familiale et l’entrée future dans le royaume; il ne formule pas explicitement la nature causale de leur rapport.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste oral et immédiatement compréhensible. La répétition « ceux-là » puis « ce sont eux » conserve l’insistance du copte sans alourdir excessivement la phrase. La majuscule à « Père » suit l’usage français pour cette désignation divine.
