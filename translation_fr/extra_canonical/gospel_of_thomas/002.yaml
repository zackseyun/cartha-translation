  source_fidelity: Le jussif de troisième personne est correctement rendu par « Que celui qui cherche ne cesse pas… », sans ajouter de destinataire. La répétition de « cherche », l’objet non exprimé, la borne « jusqu’à ce qu’il trouve », puis la séquence temporelle et causale « trouve / sera troublé / s’étonnera / régnera » correspondent au copte. « Sur le Tout » conserve utilement le collectif défini ⲡⲧⲏⲣϥ.
  naturalness: Le français est moderne, fluide et conserve la forme dense et sentencieuse du logion. Le futur dans « il sera troublé » est idiomatique après « quand il trouve » et marque bien la progression annoncée.
  terminology: « Troublé » distingue convenablement ϣⲧⲟⲣⲧⲣ de ⲣϣⲡⲏⲣⲉ (« s’étonnera »). « Régnera » rend directement le verbe de royauté. La majuscule de « le Tout » soutient l’emploi collectif/cosmologique sans en imposer une interprétation doctrinale. Les notes sont correctement ancrées et la note sur POxy 654 signale sobrement la divergence textuelle pertinente.
