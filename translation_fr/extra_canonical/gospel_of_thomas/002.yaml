base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: fr
  text: 'Jésus dit : « Que celui qui cherche ne cesse pas de chercher jusqu’à ce qu’il trouve. Et quand il trouve, il sera troublé[a] ; quand il sera troublé, il s’étonnera ; et il régnera sur le Tout[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe copte peut aussi se traduire par « sera bouleversé » ou « sera alarmé » ; il est distinct du verbe suivant, qui exprime l’étonnement.
    reason: lexical_alternative
  - marker: b
    text: « Le Tout » désigne ici la totalité des choses, voire le cosmos, et non simplement « beaucoup de choses ».
    reason: cultural_note
  - marker: c
    text: 'Le fragment grec POxy 654 présente une forme différente de la fin : il parle d’être saisi d’étonnement, puis ajoute qu’après avoir régné, la personne trouvera le repos. Le texte copte distingue « être troublé » et « s’étonner », et ne mentionne pas le repos.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  choice: Que … ne cesse pas
  rationale: La construction exprime ici une défense ou exhortation à la troisième personne. Le tour français avec « que » conserve cette valeur jussive sans introduire un destinataire implicite comme le ferait « ne laissez pas ».
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ / ⲉⲣⲉⲛⲧⲟϥϣⲓⲛⲉ
  choice: celui qui cherche / chercher
  rationale: Le participe substantivé désigne la personne en quête, tandis que la répétition de « chercher » préserve l’insistance et la progression lapidaire du texte.
- source_word: ϣⲁⲛⲧⲉⲛⲧⲟϥϭⲓⲛⲉ
  choice: jusqu’à ce qu’il trouve
  rationale: Rend directement la proposition temporelle introduite par « jusqu’à », tout en conservant l’objet non exprimé dans la source.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲟϥϭⲓⲛⲉ
  choice: quand il trouve
  rationale: Le présent français convient à la formulation générale et conserve le parallélisme avec « quand il sera troublé » sans préciser ce qui est trouvé.
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: être troublé
  rationale: Le verbe indique une perturbation ou un bouleversement intérieur. « Troublé » reste distinct du verbe suivant, qui relève de l’étonnement.
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: s’étonner
  rationale: Le verbe signifie éprouver l’étonnement ou l’émerveillement. « S’étonner » évite d’imposer une nuance exclusivement positive tout en maintenant la progression du propos.
- source_word: ⲣ̄ⲣⲣⲟ
  choice: régner
  rationale: Le verbe signifie être roi ou exercer la royauté ; « régner » en donne l’équivalent français le plus direct.
- source_word: ⲉϫⲛⲡⲧⲏⲣϥ
  choice: sur le Tout
  rationale: L’expression collective désigne la totalité de ce qui est. La majuscule signale cet emploi substantivé et cosmologique sans l’expliciter dans le corps du texte.
theological_decisions:
- issue: Nature de « le Tout »
  choice: Conserver l’expression ouverte « le Tout »
  alternative: « tout », « toutes choses » ou « l’univers »
  rationale: La formulation peut évoquer la totalité des choses ou le cosmos, mais le texte ne définit pas davantage ce référent. La traduction conserve donc son amplitude et son possible poids conceptuel.
- issue: Objet de la recherche et de la découverte
  choice: Ne pas ajouter de complément à « cherche » ou « trouve »
  alternative: Préciser « la vérité », « le Royaume » ou « la connaissance »
  rationale: La source laisse l’objet implicite. L’expliciter résoudrait indûment l’énigme et importerait une interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme bref et répétitif de la sentence est conservé. Le jussif « Que celui qui… » restitue la troisième personne sans créer un destinataire absent du texte ; les termes non définis et la progression paradoxale restent volontairement ouverts.
