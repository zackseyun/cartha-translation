base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: fr
  text: 'Jésus a dit : « Le jour où vous voyez votre ressemblance, vous vous réjouissez. Mais si vous voyez vos images[a], qui sont venues à l’existence avant vous[b] et qui ne meurent ni ne se manifestent[c], combien aurez-vous à endurer ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte emploie ici ϩⲓⲕⲱⲛ, emprunté au grec εἰκών (« image »), et le distingue de ⲉⲓⲛⲉ (« ressemblance ») dans la phrase précédente.
    reason: Signaler le contraste lexical important sans en imposer une interprétation théologique.
  - marker: b
    text: 'La forme copte correspondant à « sont venues à l’existence » présente un trait dialectal : ϩ y représente le pronom de troisième personne du pluriel attendu ⲩ.'
    reason: Documenter une particularité dialectale du manuscrit qui éclaire l’analyse grammaticale.
  - marker: c
    text: Dans le manuscrit, les deux verbes négatifs emploient ⲙⲁ-, variante régionale du préfixe habituel négatif ⲙⲉⲣⲉ-.
    reason: Documenter la forme dialectale à la base de « ne meurent ni ne se manifestent ».
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: ressemblance
  rationale: Rend le terme copte courant désignant la ressemblance ou l’apparence, tout en le distinguant du mot d’origine grecque traduit ensuite par « images ».
- source_word: ϩⲓⲕⲱⲛ
  choice: images
  rationale: Transcrit un emprunt au grec εἰκών ; « images » conserve le contraste lexical avec « ressemblance » sans préciser la nature de ces images.
- source_word: ϣⲱⲡⲉ
  choice: sont venues à l’existence
  rationale: Exprime ici l’entrée dans l’existence ou l’origine, sans imposer l’idée plus précise de création ou de fabrication.
- source_word: ϩⲓⲧⲉⲧⲛⲉϩⲏ
  choice: avant vous
  rationale: Rend naturellement l’antériorité, qui peut être temporelle ou, plus littéralement, la position en avant.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: se manifestent
  rationale: Conserve le sens de devenir visible, apparaître ou être révélé, sans choisir entre ces nuances.
- source_word: ϥⲓ ϩⲁ
  choice: avoir à supporter
  rationale: Rend l’expression idiomatique signifiant porter, supporter ou endurer une charge.
theological_decisions:
- issue: Contraste entre ⲉⲓⲛⲉ et ϩⲓⲕⲱⲛ
  choice: « ressemblance » et « images »
  alternative: « apparence » et « formes »
  rationale: Le texte emploie deux termes distincts. La traduction maintient cette distinction sans définir les « images » comme des doubles divins ou éternels, interprétation que le passage lui-même n’explicite pas.
- issue: Nature des images antérieures
  choice: Laisser leur nature indéterminée
  alternative: Les qualifier de préexistantes, immortelles ou divines
  rationale: Le texte dit qu’elles sont venues à l’existence avant les destinataires et qu’elles ne meurent ni ne se manifestent ; il ne donne pas davantage d’explication ontologique.
- issue: Force de la question finale
  choice: « combien aurez-vous à supporter ! »
  alternative: « jusqu’à quel point le supporterez-vous ? »
  rationale: La tournure conserve l’idée d’une charge à porter et la force exclamative de la question, sans expliquer ce que cette expérience implique théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent de vérité générale est conservé dans la première phrase (« vous vous réjouissez »), tandis que « lorsque vous verrez » et « aurez-vous » rendent naturellement la construction conditionnelle suivie du futur. La formulation évite d’expliciter la nature des « images » au-delà de ce qu’affirme le copte.
