base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: fr
  text: 'Ses disciples l’interrogèrent et lui dirent : « Veux-tu que nous jeûnions ? Comment devons-nous prier ? Devons-nous faire l’aumône ? Et que devons-nous observer en matière de nourriture ? »


    Jésus dit : « Ne mentez pas et ne faites pas ce que vous détestez. Car toutes choses sont dévoilées devant le ciel[a]. En effet, il n’y a rien de caché qui ne sera révélé, et rien de couvert qui restera sans être découvert[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fragment grec P.Oxy. 654 porte « devant la vérité » (ἐνώπιον τῆς ἀληθείας) au lieu de « devant le ciel ».
    reason: Variante textuelle entre le témoin copte et le fragment grec.
  - marker: b
    text: Le fragment grec P.Oxy. 654 porte « et rien d’enseveli qui ne sera relevé » (καὶ τεθαμμένον ὃ οὐκ ἐγερθήσεται) au lieu de « et rien de couvert qui restera sans être découvert ».
    reason: 'Variante textuelle importante : le grec emploie l’image de ce qui est enseveli puis relevé, là où le copte parle de ce qui est couvert puis découvert.'
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: jeûner
  rationale: Le verbe, formé sur l’emprunt grec νηστεύω, désigne sans ambiguïté la pratique du jeûne.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: comment
  rationale: L’expression signifie littéralement « quelle est la manière » et correspond naturellement à « comment » en français.
- source_word: ϯⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: faire l’aumône
  rationale: Le nom grec emprunté ἐλεημοσύνη désigne l’aumône; « faire l’aumône » est l’expression française courante et digne.
- source_word: ⲣⲡⲁⲣⲁⲧⲏⲣⲉⲓ
  choice: observer
  rationale: L’emprunt grec παρατηρεῖν exprime ici l’idée d’observer ou de respecter une prescription, sans qu’il soit nécessaire d’ajouter explicitement « règles ».
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  choice: en matière de nourriture
  rationale: Le substantif peut désigner l’action de manger, la nourriture ou le régime alimentaire. Cette formulation conserve la portée diététique sans transformer le groupe nominal en proposition temporelle.
- source_word: ϫⲉϭⲟⲗ
  choice: mentir
  rationale: L’expression signifie littéralement « dire un mensonge »; le verbe français rend directement la force sentencieuse de l’interdiction.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: dévoiler / révéler
  rationale: Le verbe signifie rendre manifeste ou révéler. « Dévoilées » convient au présent de la première occurrence, tandis que « révélé » rend naturellement la reprise au futur.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ ⲛⲧⲡⲉ
  choice: devant le ciel
  rationale: Il s’agit de la locution prépositionnelle « devant, en présence de » suivie de « ciel », et non d’un terme signifiant « couverture ».
- source_word: ϩⲟⲃⲥ
  choice: couvert
  rationale: Le texte copte emploie le champ lexical de ce qui est couvert ou voilé, distinct du grec fragmentaire qui parle de ce qui est enseveli.
theological_decisions:
- issue: Rapport entre les pratiques religieuses demandées et la réponse de Jésus
  choice: Conserver la réponse abrupte sans expliciter son lien avec le jeûne, la prière, l’aumône et l’alimentation.
  alternative: Ajouter une transition interprétative présentant la sincérité comme la règle qui gouverne ces pratiques.
  rationale: Le texte source ne formule pas ce lien. Son caractère abrupt et sa tension doivent rester perceptibles.
- issue: Divergence entre le copte « devant le ciel » et le grec « devant la vérité »
  choice: Retenir « devant le ciel » dans le texte principal.
  alternative: Retenir « devant la vérité ».
  rationale: La traduction suit en priorité le témoin copte fourni et signale la leçon grecque dans une note textuelle.
- issue: Divergence entre le copte « couvert/découvert » et le grec « enseveli/relevé »
  choice: Retenir l’image copte de ce qui est couvert puis découvert.
  alternative: 'Traduire selon le grec : « rien d’enseveli qui ne sera relevé ».'
  rationale: Le copte présente une affirmation de dévoilement, tandis que le grec fragmentaire peut évoquer une remise debout ou une résurrection. Il ne faut pas fondre silencieusement ces deux images.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Les questions sont formulées naturellement sans ajouter de prescriptions absentes du copte. La répétition « Car… En effet… » conserve l’enchaînement explicatif du texte, et la distinction entre le présent (« sont dévoilées ») et le futur (« sera révélé ») est maintenue.
