  source_fidelity: 'Le texte rend fidèlement la structure générale du copte : les petits enfants allaités, la question des disciples sans ajout de « devenir », la série des oppositions et l’unique paire haut/bas. La séquence finale « yeux … œil », etc., est volontairement paradoxale et est correctement conservée. Toutefois, « un seul être » ajoute une qualification ontologique absente du copte, qui dit simplement de faire du masculin et du féminin « un seul / une seule chose ».'
  naturalness: Le français est moderne, clair et conserve à bon escient le rythme répétitif de la parole. « Est-ce que » est recevable en français international moderne. Le remplacement de « un seul être » par « une seule chose » reste quelque peu abrupt, comme l’original, mais il est plus neutre et plus exact.
  terminology: « Royaume », « intérieur/extérieur », « haut/bas », « masculin/féminin » et « image » sont des choix cohérents. Les notes sur la valeur de ⲙⲛⲧⲣⲣⲟ, sur la paire unique ciel/bas, sur la restauration finale et sur ϩⲓⲕⲱⲛ sont pertinentes. Le terme « être » dans « un seul être » interprète indûment l’unité énigmatique et doit être évité.
