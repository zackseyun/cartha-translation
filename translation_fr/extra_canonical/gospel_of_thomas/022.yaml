  to: 'Jésus vit de petits enfants qu’on allaitait[a]. Il dit à ses disciples : « Ces petits enfants qu’on allaite ressemblent à ceux qui entrent dans le Royaume[b]. » Ils lui dirent : « Est-ce que nous entrerons dans le Royaume en étant petits ? » Jésus leur dit : « Quand vous ferez des deux un seul, quand vous ferez l’intérieur comme l’extérieur et l’extérieur comme l’intérieur, et le haut comme le bas[c] ; quand vous ferez du masculin et du féminin une seule chose, afin que le masculin ne soit pas masculin et que le féminin ne soit pas féminin ; quand vous ferez des yeux à la place d’un œil, une main à la place d’une main, un pied à la place d’un pied, et une image à la place d’une image[e], alors vous entrerez dans le Royaume[d]. »'
  rationale: La révision retire uniquement l’ajout interprétatif « être ». « Une seule chose » reproduit plus sobrement l’absence de nom dans l’expression copte et préserve l’énigme du logion, sans imposer une lecture doctrinale ou anthropologique. Les ancres et le contenu des notes sont conservés, car ils correspondent au texte et à l’état du manuscrit.
