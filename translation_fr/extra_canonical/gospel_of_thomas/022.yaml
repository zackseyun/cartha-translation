  yaml_path: translation/extra_canonical/gospel_of_thomas/022.yaml
  text: Jesus saw some little ones being suckled[a]. He said to his disciples, “These little ones who are being suckled are like those who are to enter the Kingdom.” They said to him, “Shall we, being little ones, enter the Kingdom?” Jesus said to them, “When you make the two one; and when you make the inner like the outer and the outer like the inner, and the upper like the lower; and when you make the male and the female into a single one, so that the male is not male and the female not female; and when you make eyes in the place of an eye, and a hand in the place of a hand, and a foot in the place of a foot[h][g][f][e][d][c][b], and an image in the place of an image—then you will enter the Kingdom.”
translation:
  language: fr
  text: 'Jésus vit de petits enfants qu’on allaitait[a]. Il dit à ses disciples : « Ces petits enfants qu’on allaite ressemblent à ceux qui entrent dans le Royaume[b]. » Ils lui dirent : « Est-ce que nous entrerons dans le Royaume en étant petits ? » Jésus leur dit : « Quand vous ferez des deux un seul, quand vous ferez l’intérieur comme l’extérieur et l’extérieur comme l’intérieur, et le haut comme le bas[c] ; quand vous ferez du masculin et du féminin une seule chose, afin que le masculin ne soit pas masculin et que le féminin ne soit pas féminin ; quand vous ferez des yeux à la place d’un œil, une main à la place d’une main, un pied à la place d’un pied, et une image à la place d’une image[e], alors vous entrerez dans le Royaume[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe copte désigne spécifiquement le fait de recevoir du lait, c’est-à-dire d’être allaité. On pourrait aussi traduire : « des nourrissons qui tétaient » ou « de petits enfants au sein » et, dans la phrase suivante, « ces nourrissons » ou « ces tout-petits ».'
    reason: lexical_alternative
  - marker: b
    text: « Royaume » traduit ⲙⲛⲧⲣⲣⲟ, nom abstrait qui peut aussi signifier « royauté » ou « règne ». Ici, le texte en parle comme de ce dans quoi l’on entre.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « le côté d’en haut comme le côté d’en bas ». Les termes peuvent évoquer le ciel et ce qui est en bas, mais le copte ne présente pas une paire supplémentaire « devant/derrière ».
    reason: source_clarification
  - marker: d
    text: À la fin du propos, une partie du mot copte traduit par « Royaume » est endommagée dans le manuscrit et restaurée avec assurance d’après les lettres conservées et le contexte.
    reason: lacuna_or_restoration
  - marker: e
    text: Le copte ϩⲓⲕⲱⲛ est un emprunt au grec εἰκών. « Icône » serait plus formel ; « image » en conserve ici le sens large.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲟⲩⲓ
  choice: petits enfants / petits
  rationale: Le mot signifie fondamentalement « petit ». Le contexte de l’allaitement indique de très jeunes enfants, mais « petits enfants » conserve le terme du texte au lieu de le préciser partout par « nourrissons ».
- source_word: ϫⲓⲉⲣⲱⲧⲉ
  choice: qu’on allaitait / qu’on allaite
  rationale: Le verbe désigne spécifiquement l’allaitement. Cette formulation française garde cette précision et la valeur passive du premier emploi.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Royaume
  rationale: Le nom abstrait peut désigner la royauté ou le règne, mais le texte parle d’y entrer. « Royaume » rend naturellement cette combinaison sans supprimer l’ambivalence signalée en note.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: faire des deux un seul
  rationale: Formulation concise qui conserve l’opposition numérique caractéristique du texte.
- source_word: ⲛϩⲟⲩⲛ / ⲛⲃⲟⲗ
  choice: l’intérieur / l’extérieur
  rationale: Ces substantifs français reproduisent le parallélisme spatial et symbolique sans l’interpréter.
- source_word: ⲡⲥⲁ ⲛⲧⲡⲉ / ⲡⲥⲁ ⲙⲡⲓⲧⲛ
  choice: le haut / le bas
  rationale: Le passage présente une seule paire opposée. « Haut/bas » conserve sa portée spatiale sans imposer la lecture « ciel/terre ».
- source_word: ⲡϩⲟⲟⲩⲧ / ⲥϩⲓⲙⲉ
  choice: le masculin / le féminin
  rationale: Ce choix maintient le parallélisme sexué sans employer « mâle/femelle », peu digne en français pour des personnes, ni réduire nécessairement les termes aux rôles sociaux d’« homme/femme ».
- source_word: ϩⲓⲕⲱⲛ
  choice: image
  rationale: Le mot est un emprunt grec correspondant à « icône », mais « image » est ici le terme français le plus large et le plus transparent.
theological_decisions:
- issue: Sens de l’unification des opposés
  choice: Conserver littéralement la série intérieur/extérieur, haut/bas et masculin/féminin
  alternative: Expliquer cette série comme une doctrine déterminée de restauration, d’androgynie ou d’union mystique
  rationale: Le texte formule des images énigmatiques sans en donner l’interprétation. La traduction ne tranche donc pas entre les lectures théologiques possibles.
- issue: Valeur de ⲙⲛⲧⲣⲣⲟ
  choice: Royaume, avec une note sur « règne/royauté »
  alternative: Règne ou royauté dans le corps du texte
  rationale: Le mouvement d’entrée favorise « Royaume », tandis que la note préserve la valeur abstraite du terme copte.
- issue: Masculin et féminin devenant un seul
  choice: « un seul être », sans développer la nature de cette unité
  alternative: « une seule personne », « un être androgyne » ou « une unité spirituelle »
  rationale: « Être » permet une phrase française naturelle, mais évite d’identifier l’unité à une anthropologie ou à une doctrine précise.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe répétitive de la réponse de Jésus est conservée pour rendre son rythme formulaire. Les images volontairement énigmatiques ne sont pas explicitées dans le corps du texte. « Petits enfants » est plus naturel que « petits » au premier emploi, tandis que la question garde « en étant petits » afin de refléter la construction circonstancielle du copte sans introduire l’idée de « devenir » petits.
