base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: fr
  text: 'Jésus dit : « Celui qui a connu le monde a trouvé le corps[a] ; et celui qui a trouvé le corps[b], le monde n’est pas digne de lui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte emploie ici ⲥⲱⲙⲁ, « corps ». Selon le contexte, ce mot peut aussi évoquer un corps mort, mais il est distinct de ⲡⲧⲱⲙⲁ, « cadavre », employé dans le logion 56.
    reason: lexical_alternative
  - marker: b
    text: Le verbe copte traduit par « trouver » est suivi de la préposition ⲉ ; cet usage dialectal ou orthographique ne modifie pas son sens essentiel.
    reason: dialect_note
  - marker: c
    text: Comparer le logion 56, qui transmet une maxime étroitement parallèle mais emploie le mot « cadavre ». Les deux formulations sont conservées sans harmonisation.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus dit
  rationale: La formule narrative copte introduit une parole rapportée. Le passé simple donne en français une formulation brève, naturelle et digne.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲥⲟⲟⲩⲛ
  choice: celui qui a connu
  rationale: La construction relative au parfait présente l’action comme accomplie. « A connu » préserve cette valeur sans ajouter l’idée plus interprétative de progression contenue dans « est parvenu à connaître ».
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: le monde
  rationale: Ce mot d’emprunt grec peut désigner le cosmos ou le monde humain. « Le monde » conserve cette amplitude en français courant.
- source_word: ϩⲉ ⲉ
  choice: a trouvé
  rationale: Le sens fondamental est « trouver ». La préposition qui suit le verbe relève ici de l’usage dialectal ou orthographique et n’exige pas une autre traduction.
- source_word: ⲡⲥⲱⲙⲁ
  choice: le corps
  rationale: Le terme correspond au grec σῶμα, « corps ». Le traduire par « le corps » respecte aussi l’article défini présent aux deux occurrences et maintient la distinction lexicale avec ⲡⲧⲱⲙⲁ, « cadavre », employé dans le logion 56.
- source_word: ⲇⲉ
  choice: et
  rationale: La particule relie les deux membres de la maxime. « Et » conserve leur parallélisme sans imposer un contraste plus fort que celui du texte.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: le monde n’est pas digne de lui
  rationale: Cette formulation rend directement l’expression copte de dignité et son complément pronominal, tout en préservant la tension paradoxale de la sentence.
theological_decisions:
- issue: Valeur symbolique de « monde » et de « corps »
  choice: Conserver les termes sans expliciter leur rapport théologique
  alternative: Paraphraser le monde comme réalité matérielle et le corps comme cadavre ou enveloppe charnelle
  rationale: Le logion ne précise pas lui-même la portée cosmologique, anthropologique ou ascétique de ces mots. Une explicitation trancherait une ambiguïté réelle du texte.
- issue: Lien avec le logion 56
  choice: Préserver la différence entre « corps » ici et « cadavre » au logion 56
  alternative: Harmoniser les deux sentences en traduisant ici ⲥⲱⲙⲁ par « cadavre »
  rationale: Les deux logia sont proches, mais le manuscrit emploie des mots distincts. La traduction ne doit pas effacer cette différence textuelle.
translation_notes:
  register: Français international moderne, sobre et sentencieux. Le parallélisme et la brièveté de l’original sont conservés. « Celui qui » correspond à la forme masculine générique du texte et permet la reprise naturelle par « lui ».
