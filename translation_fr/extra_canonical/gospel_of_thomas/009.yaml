  revised_text: 'Jésus dit : « Voici : le semeur sortit. Il remplit sa main et lança la semence.[a] Une partie tomba sur le chemin ; les oiseaux vinrent et la ramassèrent.[b] Une autre tomba sur le rocher : elle ne jeta pas de racines vers le bas, dans la terre, et ne fit pas monter d’épis vers le ciel.[c] Une autre tomba parmi les épines ; celles-ci étouffèrent la semence, et le ver la mangea.[d] Une autre encore tomba sur la bonne terre, et celle-ci produisit du bon fruit vers le ciel : elle donna soixante mesures et cent vingt mesures.[e] »'
