base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: fr
  text: 'Jésus dit : « Voici : le semeur sortit. Il remplit sa main et lança la semence.[a] Une partie tomba sur le chemin ; les oiseaux vinrent et la ramassèrent.[b] Une autre tomba sur le rocher : elle ne jeta pas de racines vers le bas, dans la terre, et ne fit pas monter d’épis vers le ciel.[c] Une autre tomba parmi les épines ; celles-ci étouffèrent la semence, et le ver la mangea.[d] Une autre encore tomba sur la bonne terre, et celle-ci produisit du bon fruit vers le ciel : elle donna soixante mesures et cent vingt mesures.[e] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le détail du semeur qui remplit sa main avant de lancer la semence appartient à cette forme de la parabole.
    reason: textual_variant
  - marker: b
    text: Le copte dit que les oiseaux « ramassèrent » la semence, et non qu’ils la dévorèrent.
    reason: textual_variant
  - marker: c
    text: Le texte oppose expressément les racines jetées vers le bas dans la terre aux épis envoyés vers le haut, vers le ciel.
    reason: textual_variant
  - marker: d
    text: La mention du ver qui mange la semence ajoute une cause de destruction absente des parallèles synoptiques.
    reason: textual_variant
  - marker: e
    text: Le mot copte peut désigner une « mesure » ou un « rendement ». La traduction « mesures » conserve cette formulation sans la réduire à la terminologie des versions synoptiques.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲥⲓⲧⲉ
  choice: le semeur
  rationale: Expression substantivée désignant celui qui sème ; « le semeur » est naturel et précis en français.
- source_word: ⲕⲱⲧϥ
  choice: ramassèrent
  rationale: Le verbe signifie ici « rassembler, ramasser » ; ce choix conserve la différence avec le verbe « manger » employé plus loin, sans harmoniser avec les parallèles synoptiques.
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  choice: fit monter d’épis
  rationale: Le composé exprime l’émission ou la production d’épis. « Fit monter » préserve l’opposition verticale avec la racine qui descend dans la terre.
- source_word: ⲱϭⲧ
  choice: étouffèrent
  rationale: Rend le sens de « comprimer, étouffer » et convient au rôle des épines dans l’image.
- source_word: ϥⲛⲧ
  choice: ver
  rationale: Équivalent direct et non spéculatif du nom copte.
- source_word: ⲉⲥⲟⲧⲉ
  choice: mesures
  rationale: Le terme peut désigner une mesure ou un rendement. La traduction formelle « mesures » conserve la formulation particulière du témoin copte.
theological_decisions:
- issue: Harmonisation avec les versions synoptiques de la parabole du semeur
  choice: 'Conserver les traits propres au texte copte de Thomas : la main remplie, les oiseaux qui ramassent, le mouvement vertical des racines et des épis, le ver et les rendements de soixante et cent vingt mesures.'
  alternative: 'Employer les formulations synoptiques : les oiseaux dévorent, la semence produit au soixantuple et au centuple, sans les autres détails propres à Thomas.'
  rationale: Le témoin doit être traduit selon sa formulation propre, sans lui imposer celle des évangiles canoniques.
- issue: Référents grammaticaux dans les différentes scènes
  choice: Employer « la semence » ou le pronom féminin « elle/la » lorsque le français exige un référent explicite, et « celles-ci » pour les épines.
  alternative: Reproduire littéralement les fluctuations de nombre et de genre du copte, au risque d’une forte obscurité en français.
  rationale: Cette explicitation minimale rend le récit intelligible sans ajouter d’interprétation allégorique.
- issue: Sens du rendement final
  choice: « soixante mesures et cent vingt mesures »
  alternative: « soixante fois et cent vingt fois autant » ou « au soixantuple et au cent-vingtuple »
  rationale: Le copte permet une compréhension liée à la mesure ou au rendement. Le choix principal reste proche de la forme du texte, tandis que la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme parabolique et les répétitions du copte, tout en explicitant seulement les référents nécessaires à la compréhension. Les particularités de Thomas ne sont pas harmonisées avec les évangiles synoptiques.
