  source_fidelity: 'Le projet rend bien la structure et les particularités du texte copte : main remplie, oiseaux qui ramassent, racines vers le bas et épis vers le haut, étouffement, ver, et double rendement. Une légère révision améliore la précision de « jeter des racines » et maintient le singulier collectif de ⲕⲁⲣⲡⲟⲥ (« fruit »).'
