revisions:
- from: 'Jésus dit : « Voici : le semeur sortit. Il remplit sa main et lança la semence.[a] Une partie tomba sur le chemin ; les oiseaux vinrent et la ramassèrent.[b] Une autre tomba sur le rocher : elle ne poussa pas de racine vers le bas, dans la terre, et ne fit pas monter d’épis vers le ciel.[c] Une autre tomba parmi les épines ; celles-ci étouffèrent la semence, et le ver la mangea.[d] Une autre encore tomba sur la bonne terre, et celle-ci produisit de bons fruits vers le ciel : elle donna soixante mesures et cent vingt mesures.[e] »'
  to: 'Jésus dit : « Voici : le semeur sortit. Il remplit sa main et lança la semence.[a] Une partie tomba sur le chemin ; les oiseaux vinrent et la ramassèrent.[b] Une autre tomba sur le rocher : elle ne jeta pas de racines vers le bas, dans la terre, et ne fit pas monter d’épis vers le ciel.[c] Une autre tomba parmi les épines ; celles-ci étouffèrent la semence, et le ver la mangea.[d] Une autre encore tomba sur la bonne terre, et celle-ci produisit du bon fruit vers le ciel : elle donna soixante mesures et cent vingt mesures.[e] »'
  rationale: 'La révision est limitée à trois points : elle restitue plus explicitement le geste vertical des racines, rend ⲕⲁⲣⲡⲟⲥ par le singulier collectif français « du bon fruit », et reformule la note sur ⲉⲥⲟⲧⲉ afin de préserver l’ambiguïté lexicale sans imposer une analyse métrique précise. Les ancres a–e demeurent toutes présentes et correspondent aux notes.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:37Z'
review_pass:
