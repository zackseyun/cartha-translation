base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: fr
  text: 'Jésus a dit : « Heureuse[a] est la personne[b] qui a peiné[c] : elle a trouvé la vie[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot peut aussi se traduire par « bénie » ou « fortunée ».
    reason: lexical_alternative
  - marker: b
    text: Le copte désigne ici l’être humain de manière générique ; on pourrait aussi traduire par « l’homme » au sens générique.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui a souffert ». Le verbe peut évoquer le labeur, la peine, la détresse ou la souffrance.
    reason: lexical_alternative
  - marker: d
    text: Le manuscrit porte ⲁⲡⲱⲛϩ, là où l’on attendrait ⲉⲡⲱⲛϩ après « trouver » ; il s’agit vraisemblablement d’une variante orthographique.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: heureuse
  rationale: Ce terme grec emprunté par le copte exprime une béatitude ou une condition enviable. « Heureuse » est naturel en français dans une formule de béatitude, tout en laissant la note signaler les nuances « bénie » et « fortunée ».
- source_word: ⲡⲣⲱⲙⲉ
  choice: la personne
  rationale: Le nom désigne ici un être humain de manière générique. « La personne » conserve le singulier sans réserver l’énoncé aux hommes.
- source_word: ⲛ̄ⲧⲁϩϩⲓⲥⲉ
  choice: qui a peiné
  rationale: La forme manuscrite se comprend comme une relative accomplie à sujet de troisième personne du singulier. Le verbe ϩⲓⲥⲉ couvre le labeur pénible, la peine et la souffrance; « a peiné » garde cette amplitude mieux qu’un terme uniquement physique ou uniquement passif.
- source_word: ⲁϥϩⲉ
  choice: elle a trouvé
  rationale: Le parfait copte présente l’action comme accomplie. Le pronom français s’accorde avec « la personne »; le sujet copte est la troisième personne du singulier, sans pronom indépendant emphatique.
- source_word: ⲡⲱⲛϩ
  choice: la vie
  rationale: Le substantif porte l’article défini copte. « La vie » est idiomatique en français et conserve la portée potentiellement forte de cette découverte sans l’expliciter théologiquement.
theological_decisions:
- issue: Rapport entre la peine et la découverte de la vie
  choice: Conserver deux propositions juxtaposées, reliées par deux-points
  alternative: Introduire un lien causal explicite, par exemple « car elle a trouvé la vie »
  rationale: Le copte énonce successivement la peine et la découverte sans conjonction causale. Les deux-points rendent leur rapport étroit sans décider si la découverte est une conséquence, une récompense ou simplement le constat qui motive la béatitude.
translation_notes:
  register: Style bref, proverbial et digne. La formulation « Heureuse la personne » reste accessible en français international moderne. Le féminin grammatical de « elle » reprend « la personne » et ne transforme pas le référent générique en personnage féminin. Aucun emphatique absent du manuscrit n’a été ajouté.
