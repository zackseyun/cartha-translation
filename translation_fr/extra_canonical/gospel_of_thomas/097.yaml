revisions:
- from: 'Jésus dit : « Le royaume du Père est comparable à une femme qui portait une jarre pleine de farine. Tandis qu’elle marchait sur la route, encore loin de chez elle,[a] l’anse[b] de la jarre se brisa. La farine se répandit derrière elle sur la route. Elle ne le savait pas ; elle ne s’était pas rendu compte du problème.[c] Quand elle arriva chez elle, elle posa la jarre et la trouva vide. »'
  to: 'Jésus dit : « Le royaume du Père est comparable à une femme qui portait une jarre pleine de farine. Alors qu’elle marchait sur la route, tandis qu’elle était encore loin, l’anse[a] de la jarre se brisa. La farine se répandit derrière elle sur la route. Elle ne le savait pas ; elle ne s’était pas aperçue de la difficulté[b]. Lorsqu’elle arriva dans sa maison, elle posa la jarre et la trouva vide. »'
  rationale: La seule correction nécessaire supprime l’explicitation « de chez elle », car aucun complément ne définit dans le copte le point de référence de « loin ». Les notes sont renumérotées afin de correspondre exactement aux seuls appels conservés dans le texte. Le reste de la formulation est maintenu, avec un ajustement léger de la note sur ϩⲓⲥⲉ pour des équivalents français plus directs.
