    issue: Ajout de « de chez elle »
    rationale: Le syntagme copte indiquant qu’elle était « loin » ne précise pas de quel lieu elle était éloignée. La maison n’est mentionnée que plus tard ; l’ajouter au segment précédent restreint inutilement l’ambiguïté du texte source.
