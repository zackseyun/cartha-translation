base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: fr
  text: 'Jésus dit : « Le royaume du Père est comparable à une femme qui portait une jarre pleine de farine. Alors qu’elle marchait sur la route, tandis qu’elle était encore loin, l’anse[a] de la jarre se brisa. La farine se répandit derrière elle sur la route. Elle ne le savait pas ; elle ne s’était pas aperçue de la difficulté[b]. Lorsqu’elle arriva dans sa maison, elle posa la jarre et la trouva vide. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’oreille » de la jarre, c’est-à-dire son anse.'
    reason: alternative_lexicale
  - marker: b
    text: 'Ou : « de la peine », « du problème ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: jarre
  rationale: Désigne une jarre ou une cruche ; « jarre » convient à un récipient assez grand pour contenir de la farine.
- source_word: ⲛⲟⲉⲓⲧ
  choice: farine
  rationale: Le terme désigne la farine ou la mouture ; « farine » est naturel et précis en français courant.
- source_word: ⲙⲁⲁϫⲉ
  choice: anse
  rationale: Littéralement « oreille », le mot peut désigner l’anse d’un récipient ; « anse » est le terme français idiomatique.
- source_word: ⲟⲩⲱϭⲡ
  choice: se brisa
  rationale: Rend directement l’idée de rupture de l’anse.
- source_word: ϣⲟⲩⲟ
  choice: se répandit
  rationale: Dans ce contexte, le verbe décrit la farine qui se vide progressivement de la jarre et se répand sur la route.
- source_word: ϩⲓⲥⲉ
  choice: problème
  rationale: Le mot peut signifier peine, difficulté ou malheur ; ici, il renvoie au problème survenu à la jarre.
- source_word: ⲟⲩⲉ
  choice: encore loin de chez elle
  rationale: Le texte indique qu’elle était loin. Le complément « de chez elle » est tiré de la destination explicitée ensuite et rend la scène intelligible, tout en étant signalé en note.
theological_decisions:
- issue: Traduction de ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: Le royaume du Père
  alternative: Le règne du Père
  rationale: « Royaume » conserve la formulation propre à ce logion et l’image d’une réalité comparable à la scène racontée, sans harmonisation avec « royaume de Dieu » ou « royaume des cieux ».
- issue: Sens de la parabole
  choice: Aucune interprétation ajoutée
  alternative: Expliciter la perte imperceptible du royaume ou une lecture spirituelle particulière
  rationale: Le texte ne fournit aucune explication. La traduction préserve donc l’ouverture et la tension de l’image sans imposer une doctrine.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait installe la comparaison, tandis que le passé simple marque les événements successifs. « Est comparable à » évite la légère maladresse que produirait en français « est comme une femme » tout en conservant le rapport explicite de comparaison.
