base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: fr
  text: 'Jésus dit : « Montre-moi cette pierre que les bâtisseurs ont jetée dehors[a] : c’est la pierre d’angle[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont jetée dehors » ; on peut aussi traduire : « ont rejetée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la pierre de l’angle ».'
    reason: lexical_alternative
  - marker: c
    text: Cette parole fait écho au Psaume 118.22 (117.22 dans la Septante) ; voir aussi Marc 12.10 ; Matthieu 21.42 ; Luc 20.17 ; Actes 4.11 ; 1 Pierre 2.7.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: Montrez-moi
  rationale: La tournure copte signifie littéralement « donnez-moi à voir ». « Montrez-moi » en rend naturellement la valeur impérative en français.
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: cette pierre
  rationale: Le démonstratif ⲡⲁⲓ donne à la pierre une désignation précise et déictique, bien rendue par « cette pierre ».
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: ont jetée au rebut
  rationale: Le verbe évoque concrètement l’action de jeter dehors. « Jeter au rebut » conserve cette image tout en exprimant clairement le rejet en français courant.
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: les bâtisseurs
  rationale: Le participe substantivé désigne ceux qui bâtissent. « Les bâtisseurs » est naturel et garde le lien explicite avec l’activité de bâtir.
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: la pierre d’angle
  rationale: Expression française consacrée correspondant littéralement à « pierre de l’angle », sans préciser davantage sa fonction architecturale.
theological_decisions:
- issue: Fonction exacte de la « pierre d’angle »
  choice: pierre d’angle
  alternative: pierre de faîte / pierre principale
  rationale: Le copte dit littéralement « pierre de l’angle » et ne tranche pas entre diverses identifications architecturales ou symboliques. La traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Montrez-moi » conserve l’interpellation directe ; « jetée au rebut » garde l’image concrète du rejet. La reprise « c’est elle » souligne naturellement en français l’identification emphatique portée par le copte.
