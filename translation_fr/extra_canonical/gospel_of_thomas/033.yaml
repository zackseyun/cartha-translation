base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: fr
  text: 'Jésus dit : « Ce que tu entendras dans ton oreille, proclame-le dans l’autre oreille[a] sur vos toits. Car personne n’allume une lampe pour la mettre sous un récipient[b], ni ne la met dans un endroit caché ; au contraire, on la place sur un support de lampe, afin que ceux qui entrent et ceux qui sortent voient sa lumière.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression copte est difficile : littéralement, « ce que tu entendras dans ton oreille, dans l’autre oreille ». Le fragment grec parallèle est également difficile à interpréter et peut se comprendre comme une référence aux deux oreilles.'
    reason: Préserver la formulation textuellement attestée et son ambiguïté, sans la normaliser.
  - marker: b
    text: Le copte conservé porte littéralement une expression apparentée à « sous l’oreille », qui ne convient pas naturellement dans l’image. Les parallèles de cette sentence évoquent un récipient à mesurer, souvent appelé « boisseau » ; « récipient » est donc une restitution contextuelle prudente.
    reason: Signaler que l’objet cachant la lampe n’est pas une équivalence lexicale sûre du copte transmis.
  - marker: c
    text: Le texte copte dit expressément « ceux qui entrent et ceux qui sortent » ; plusieurs formulations parallèles ne mentionnent que ceux qui entrent.
    reason: Documenter une particularité significative du témoin de Thomas sans harmonisation silencieuse.
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: proclame-le
  rationale: Le verbe signifie annoncer ou proclamer publiquement ; « proclame-le » conserve la force impérative et le contraste entre parole reçue en privé et annonce publique.
- source_word: ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: vos toits
  rationale: Le substantif désigne les toits-terrasses ; « sur vos toits » rend le possessif pluriel du manuscrit sans ajouter « terrasse », absent du texte.
- source_word: ⲙⲁⲁϫⲉ
  choice: oreille
  rationale: Traduction directe. La répétition insolite « d’une oreille — de l’autre oreille » est maintenue plutôt que normalisée.
- source_word: ϩⲏⲃⲥ
  choice: lampe
  rationale: Désigne une lampe, vraisemblablement à huile, sans qu’il soit nécessaire d’expliciter son combustible.
- source_word: ϩⲁⲙⲁⲁϫⲉ
  choice: sous un récipient
  rationale: Le terme copte signifie littéralement quelque chose comme « sous l’oreille » et paraît refléter ici, par transmission, le récipient ou boisseau de la tradition parallèle. Une formulation générique accompagnée d’une note évite une précision matérielle excessive.
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: porte-lampe
  rationale: Emprunt grec désignant le support d’une lampe. « Porte-lampe » est plus exact que « chandelier », qui évoque souvent des bougies.
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: lumière
  rationale: Équivalent naturel et direct, avec le possessif « sa » renvoyant à la lampe.
theological_decisions:
- issue: L’expression énigmatique des deux oreilles
  choice: Conserver « d’une oreille — de l’autre oreille » dans le texte et signaler l’incertitude en note.
  alternative: Lisser en « ce que tu entendras à l’oreille » ou comprendre « dans tes deux oreilles ».
  rationale: Le copte est inhabituel et le témoin grec parallèle est pertinent, mais la traduction ne doit pas supprimer une difficulté réelle du texte transmis.
- issue: Sens de l’image de la lampe
  choice: Laisser l’image sans lui attribuer explicitement une interprétation doctrinale.
  alternative: Identifier la lampe à l’enseignement, à la révélation ou au disciple.
  rationale: Le contexte suggère la publicité de ce qui est entendu, mais le texte ne formule pas lui-même l’identification symbolique.
- issue: Ceux qui entrent et ceux qui sortent
  choice: Traduire les deux groupes tels quels.
  alternative: Normaliser d’après les parallèles canoniques en ne gardant que « ceux qui entrent ».
  rationale: La double expression appartient au texte copte de Thomas et doit être préservée malgré sa singularité.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé dans l’adresse individuelle (« tu »), puis possessif pluriel du manuscrit rendu par « vos toits ». Ponctuation avec tirets pour faire sentir l’étrangeté de la reprise « de l’autre oreille ». « Porte-lampe » privilégie la précision historique sans technicité excessive.
