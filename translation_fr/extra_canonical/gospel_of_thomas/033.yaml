  to: 'Jésus dit : « Ce que tu entendras dans ton oreille, proclame-le dans l’autre oreille[a] sur vos toits. Car personne n’allume une lampe pour la mettre sous un récipient[b], ni ne la met dans un endroit caché ; au contraire, on la place sur un support de lampe, afin que ceux qui entrent et ceux qui sortent voient sa lumière.[c] »'
