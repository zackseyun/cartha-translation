base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
translation:
  language: fr
  text: 'Jésus a dit : « Si un aveugle guide un aveugle, tous deux tombent[a] dans une fosse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme copte présente la chute comme une réalité générale ou habituelle : « ils tombent », plutôt que comme une simple prédiction au futur.'
    reason: Précision grammaticale sur la valeur gnomique de la forme verbale copte.
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: aveugle
  rationale: Le nom copte désigne une personne aveugle sans préciser son sexe. Employé substantivement, « un aveugle » est ici la formulation française la plus naturelle et conserve la répétition frappante de l’original.
- source_word: ⲥⲱⲕ ϩⲏⲧ
  choice: guide
  rationale: L’expression signifie littéralement « tirer devant » et fonctionne comme un idiome signifiant conduire ou guider quelqu’un.
- source_word: ϣⲁⲣⲉⲛⲧⲟⲟⲩϩⲉ
  choice: tous deux tombent
  rationale: La construction exprime une réalité générale ou habituelle; le présent français restitue ce sens gnomique. ⲛⲧⲟⲟⲩ avec ⲡⲥⲛⲁⲩ souligne que les deux subissent le même sort.
- source_word: ⲉⲡⲉⲥⲏⲧ ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: dans une fosse
  rationale: ⲉⲡⲉⲥⲏⲧ indique le mouvement vers le bas et ⲉⲟⲩϩⲓⲉⲓⲧ signifie « dans une fosse ». En français, le verbe « tomber » suivi de « dans une fosse » exprime naturellement ce mouvement sans ajout pesant.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et proverbial. La répétition de « un aveugle » préserve le parallélisme de la formulation copte; « tous deux » maintient son insistance sur le sort commun des deux personnes.
