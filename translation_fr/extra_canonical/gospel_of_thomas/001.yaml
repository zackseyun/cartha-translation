base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: fr
  text: 'Et il dit : « Quiconque trouve l’interprétation[a] de ces paroles[b] ne goûtera pas la mort[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’explication ». « Interprétation » conserve la nuance herméneutique du copte ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ, emprunté au grec ἑρμηνεία.
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit présente une forme plurielle de type lycopolitain, « ces paroles », tandis que le texte copte normalisé porte le singulier, « cette parole ». Le fragment grec POxy 654 appuie également le pluriel.
    reason: dialect_note
  - marker: c
    text: « Goûter la mort » est une expression imagée qui signifie faire l’expérience de la mort. Le texte ne précise pas davantage le sens donné ici à « mort ».
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: Et
  rationale: Conjonction simple qui relie ce logion à ce qui précède et conserve la brièveté du texte copte.
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: il dit
  rationale: Formule narrative ordinaire de parole ; le passé simple convient au registre écrit, sobre et digne.
- source_word: ϫⲉ
  choice: discours direct marqué par les deux-points et les guillemets
  rationale: La particule copte introduit ici la citation ; la ponctuation française en rend naturellement la fonction.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: Quiconque trouvera
  rationale: La construction relative désigne un sujet générique et indéfini ; « quiconque » en conserve la portée sans ajouter de marque de genre.
- source_word: ⲛⲁϩⲉ
  choice: trouvera
  rationale: « Trouver » rend le sens premier du verbe tout en permettant ici l’idée d’une découverte intellectuelle.
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: l’interprétation
  rationale: Ce nom emprunté au grec ἑρμηνεία peut signifier « interprétation » ou « explication » ; « interprétation » préserve sa nuance herméneutique.
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: de ces paroles
  rationale: La forme du manuscrit se comprend comme un pluriel de type lycopolitain, lecture également appuyée par le témoin grec POxy 654 ; « paroles » convient à des énoncés transmis.
- source_word: ⲛⲧⲟϥ
  choice: repris dans « quiconque … ne goûtera »
  rationale: Le pronom indépendant reprend le sujet générique ; le français évite naturellement une reprise pronominale explicite.
- source_word: ϥⲛⲁ
  choice: futur simple
  rationale: L’auxiliaire copte marque le futur, rendu par « trouvera » et « goûtera » dans la construction française.
- source_word: ϫⲓϯ
  choice: goûtera
  rationale: La traduction littérale conserve l’image vive de l’expression idiomatique « goûter la mort » plutôt que de la réduire à « mourir ».
- source_word: ⲁⲛ
  choice: ne … pas
  rationale: La négation française encadre le verbe et rend la négation postverbale copte.
- source_word: ⲛⲡⲙⲟⲩ
  choice: la mort
  rationale: L’article défini est idiomatique en français dans l’expression « goûter la mort ».
theological_decisions:
- issue: Portée de « ne goûtera pas la mort »
  choice: Conserver l’expression sans préciser la nature de la mort
  alternative: Interpréter explicitement comme mort physique, mort spirituelle ou salut eschatologique
  rationale: Le logion ne définit pas ici la mort en question. La traduction maintient donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la concision du copte, le discours direct et l’image traditionnelle de « goûter la mort ». « Quiconque » exprime le sujet générique sans lourdeur ni marquage de genre.
