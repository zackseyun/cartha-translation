base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/021.yaml
  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: fr
  text: 'Marie dit à Jésus : « À qui tes disciples ressemblent-ils ? »


    Il répondit : « Ils ressemblent à de petits enfants installés dans un champ qui ne leur appartient pas. Quand les propriétaires du champ viendront, ils leur diront : “Laissez-nous notre champ.” Alors les enfants se mettront nus devant eux[a] afin de le leur laisser et de leur rendre leur champ.


    « C’est pourquoi je dis : si le maître de maison sait que le voleur vient, il veillera avant son arrivée et ne le laissera pas percer un passage dans la maison de son royaume[b] pour emporter ses biens.


    « Quant à vous, soyez sur vos gardes face au monde. Ceignez-vous les reins avec une grande force, afin que les brigands ne trouvent aucun moyen de parvenir jusqu’à vous. Car ils trouveront la difficulté à laquelle vous vous attendez[c].


    « Qu’il y ait parmi vous une personne avisée. Quand le fruit a mûri, elle est venue rapidement, sa faucille à la main, et l’a moissonné. Que celui qui a des oreilles pour entendre entende. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte signifie littéralement qu’ils « se mettront nus devant eux ». Cette image de la nudité apparaît aussi ailleurs dans l’Évangile selon Thomas, notamment au logion 37, sans que son sens symbolique soit explicité ici.
    reason: Précision lexicale et intertextuelle sans imposer une interprétation.
  - marker: b
    text: Le copte porte bien « la maison de son royaume », formulation inhabituelle qui diffère des parallèles de Matthieu 24.43 et de Luc 12.39, où il est seulement question de la maison.
    reason: Préserver une particularité textuelle du témoin copte.
  - marker: c
    text: Le mot ⲭⲣⲉⲓⲁ, emprunté au grec χρεία, peut signifier « besoin », « nécessité », « affaire », « difficulté » ou parfois « avantage ». Le sens exact de la phrase demeure incertain. Le « ils » reprend vraisemblablement les brigands mentionnés juste avant.
    reason: Signaler l’ambiguïté lexicale réelle tout en rendant le sujet pluriel explicite du copte.
lexical_decisions:
- source_word: ϭⲉⲗⲓⲧ
  choice: installés
  rationale: Le qualitatif de ϭⲟⲓⲗⲉ indique que les enfants demeurent ou se sont établis dans le champ; « installés » est naturel sans suggérer qu’ils en sont propriétaires.
- source_word: ⲕⲁⲕⲁϩⲏⲩ
  choice: se mettront nus
  rationale: Le verbe signifie être ou devenir nu. La tournure conserve l’image concrète, tandis que ⲙ̄ⲡⲟⲩⲙ̄ⲧⲟ ⲉⲃⲟⲗ est correctement rendu par « devant eux ».
- source_word: ϣⲟϫⲧ
  choice: percer un passage
  rationale: Le verbe désigne l’action de creuser ou de pratiquer une ouverture pour entrer; cette formulation convient à l’effraction décrite.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: royaume
  rationale: Terme copte courant pour « royaume », notion récurrente dans Thomas; le choix évite d’en atténuer la portée par « domaine ».
- source_word: ⲭⲣⲉⲓⲁ
  choice: difficulté
  rationale: L’emprunt grec χρεία peut exprimer le besoin, la nécessité, l’affaire ou la difficulté. Le contexte menaçant favorise « difficulté », mais l’incertitude est signalée en note.
- source_word: ⲡⲱϩ
  choice: a mûri
  rationale: Appliqué au fruit, le verbe signifie qu’il est arrivé à maturité.
- source_word: ϩⲁⲥ-
  choice: a moissonné
  rationale: État pronominal de ϩⲱⲥ, « moissonner, récolter »; le pronom « l’ » reprend le fruit.
theological_decisions:
- issue: Rapport avec les parallèles synoptiques du voleur
  choice: la maison de son royaume
  alternative: sa maison
  rationale: La formulation copte comporte explicitement ⲙⲛⲧⲉⲣⲟ, « royaume ». Elle est maintenue sans harmonisation avec Matthieu 24.43 ou Luc 12.39.
- issue: Nudité des enfants
  choice: se mettront nus devant eux
  alternative: se dévêtiront devant eux
  rationale: La traduction garde l’image littérale et sa tension symbolique possible, sans imposer dans le texte une interprétation théologique particulière.
- issue: Sens de χρεία
  choice: difficulté
  alternative: besoin / nécessité / avantage
  rationale: Le contexte permet plusieurs nuances. Le texte principal adopte une lecture plausible et la note préserve l’ambiguïté lexicale.
- issue: Genre de la personne avisée
  choice: une personne avisée… elle
  alternative: un homme avisé… il
  rationale: ⲟⲩⲣⲱⲙⲉ peut désigner un être humain ou une personne, pas nécessairement un homme de sexe masculin. La formulation française évite de préciser ce que le copte laisse ouvert.
translation_notes:
  register: Français international moderne, digne et lisible. Les images concrètes sont conservées, de même que les impératifs et les répétitions structurantes. « Ceignez-vous les reins » maintient la métaphore ancienne dans une forme encore intelligible; « face au monde » rend l’orientation hostile ou préventive sans surinterpréter le monde comme une entité doctrinale.
