base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: fr
  text: 'Jésus dit : « Je vous[a] choisirai, un sur mille et deux sur dix mille ; ils[b] se tiendront debout, étant un seul[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit emploie ici une forme régionale du pronom copte de la deuxième personne du pluriel, sans différence de sens notable : « vous ».'
    reason: dialect_note
  - marker: b
    text: Le texte passe brusquement de la deuxième personne (« je vous choisirai ») à la troisième personne (« ils se tiendront »). Ce changement de personne est conservé.
    reason: grammatical_shift
  - marker: c
    text: 'Littéralement : « étant un seul ». La formule conserve un sujet pluriel tout en le qualifiant d’« un seul » ; elle peut évoquer l’unité sans préciser en quoi elle consiste.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ⲥⲱⲧⲡ / ⲥⲉⲧⲡ-
  choice: choisirai
  rationale: Le verbe signifie « choisir, sélectionner ». Le futur français rend directement la construction copte, sans ajouter la nuance confessionnelle que pourrait suggérer « élire ».
- source_word: ϣⲟ
  choice: mille
  rationale: Numéral copte usuel désignant mille.
- source_word: ⲧⲃⲁ
  choice: dix mille
  rationale: Le terme désigne dix mille, c’est-à-dire une myriade ; « dix mille » est immédiatement compréhensible en français moderne.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: se tiendront debout
  rationale: Cette locution signifie littéralement se tenir sur ses pieds et, par extension, se tenir debout. Elle ne veut pas dire « se tenir devant vous ».
- source_word: ⲉⲩⲟ ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: comme un seul
  rationale: Le statif exprime ici l’état dans lequel ils se tiennent. « Comme un seul » conserve l’image d’unité et reste naturel, sans préciser s’il s’agit d’un seul être, d’une unité spirituelle ou d’une action commune.
theological_decisions:
- issue: Portée de ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: comme un seul
  alternative: unis / ne faisant qu’un / comme un seul être
  rationale: La formule copte insiste sur le fait d’être « un seul », mais n’explicite pas la nature de cette unité. La traduction évite donc d’imposer une interprétation psychologique, communautaire ou métaphysique.
- issue: Passage de la deuxième à la troisième personne
  choice: Je vous choisirai… Ils se tiendront
  alternative: Je vous choisirai… Vous vous tiendrez
  rationale: Le manuscrit passe réellement de « vous » à « ils ». Harmoniser les pronoms supprimerait une tension grammaticale présente dans la source.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure proche du copte tout en évitant les calques difficiles. Le changement de personne et l’ambiguïté de l’unité finale sont volontairement préservés.
