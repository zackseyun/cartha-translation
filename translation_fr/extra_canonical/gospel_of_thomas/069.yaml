base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: fr
  text: 'Jésus a dit : « Heureux ceux qui ont été persécutés dans leur cœur[a] : ce sont eux qui ont véritablement connu le Père. Heureux ceux qui ont faim[b], afin que le ventre de celui qui désire soit rassasié[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dans leur cœur » peut se rapporter soit au cœur des personnes persécutées, soit à celui de leurs persécuteurs ; le copte permet les deux lectures.
    reason: ambiguïté grammaticale
  - marker: b
    text: Le manuscrit emploie ici le pluriel. La forme copte décrit ceux qui sont dans l’état d’avoir faim ; on pourrait aussi traduire « ceux qui sont affamés ».
    reason: forme grammaticale et alternative lexicale
  - marker: c
    text: Littéralement, le texte évoque « le ventre » qui sera rempli ou rassasié. Il ne précise ni ce qui est désiré ni si « celui qui désire » désigne les personnes qui ont faim.
    reason: image lexicale et ambiguïté référentielle
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Heureux
  rationale: Conserve la formule traditionnelle des béatitudes et son registre solennel, sans réduire le sens à une émotion passagère.
- source_word: ⲇⲓⲱⲕⲉ
  choice: persécutés
  rationale: Rend le prêt grec avec sa nuance d’hostilité et convient au contexte d’une béatitude.
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  choice: dans leur cœur
  rationale: Suit de près la formulation copte et préserve l’ambiguïté de l’antécédent du possessif.
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛⲟⲩⲙⲉ
  choice: ont véritablement connu le Père
  rationale: Exprime la connaissance accomplie et rend idiomatiquement ϩⲛⲟⲩⲙⲉ, « en vérité ».
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  choice: ceux qui ont connu la faim
  rationale: Reproduit le pluriel du manuscrit tout en exprimant naturellement en français l’expérience de la faim, sans imposer un état strictement présent.
- source_word: ϩⲓⲛⲁ
  choice: afin que
  rationale: Marque la finalité ou le résultat visé sans trancher plus précisément entre ces nuances.
- source_word: ⲡϩⲏ
  choice: le ventre
  rationale: Préserve l’image corporelle concrète et le registre direct du texte.
- source_word: ⲥⲓⲟ
  choice: soit rassasié
  rationale: En français, « rassasié » s’associe naturellement au ventre et couvre l’idée d’être rempli ou satisfait.
- source_word: ⲟⲩⲱϣ
  choice: désire
  rationale: Maintient la nuance volitive générale du verbe sans préciser indûment l’objet du désir.
- source_word: ⲡⲉⲓⲱⲧ
  choice: le Père
  rationale: La majuscule signale l’emploi comme désignation divine dans le contexte, sans ajouter d’explication doctrinale.
theological_decisions:
- issue: Identité de ceux auxquels renvoie « leur » dans « dans leur cœur »
  choice: Conserver « leur » sans expliciter l’antécédent
  alternative: « au plus profond de leur cœur » en l’appliquant explicitement aux persécutés, ou « dans le cœur de leurs persécuteurs »
  rationale: La construction copte permet de rattacher le possessif aux personnes persécutées ou à leurs persécuteurs; la traduction ne doit pas résoudre silencieusement cette tension.
- issue: Rapport entre la faim, le désir et le rassasiement
  choice: Conserver la formulation énigmatique et les référents distincts du texte
  alternative: Interpréter le désir comme une faim spirituelle ou identifier explicitement celui qui désire à ceux qui ont faim
  rationale: Le texte ne précise ni l’objet du désir ni l’identité exacte de « celui qui désire »; une explicitation introduirait une lecture théologique absente de la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux béatitudes est conservée, de même que l’image concrète du ventre. Les formulations restent volontairement énigmatiques là où le copte l’est.
