revisions:
- from: 'Jésus dit : « Ce ciel passera, et celui qui est au-dessus de lui passera. Les morts ne sont pas vivants, et les vivants ne mourront pas. Aux jours où vous mangiez ce qui est mort, vous le rendiez vivant[a]. Quand vous viendrez à être dans la lumière, que ferez-vous[b] ? Le jour où vous étiez un, vous êtes devenus deux[c]. Mais quand vous deviendrez deux, que ferez-vous[d] ? »'
  to: 'Jésus dit : « Ce ciel passera, et celui qui est au-dessus de lui passera. Les morts ne sont pas vivants, et les vivants ne mourront pas. Aux jours où vous mangiez ce qui est mort, vous le rendiez vivant[a]. Quand vous serez dans la lumière, que ferez-vous[b] ? Le jour où vous ne faisiez qu’un, vous êtes devenus deux[c]. Mais quand vous deviendrez deux, que ferez-vous[d] ? »'
  rationale: 'Révision limitée à des améliorations sûres de français moderne et à une clarification de la note causative. Le pluriel manuscrit « Aux jours » est conservé, de même que toutes les ambiguïtés importantes : le pronom objet des questions, l’opposition morts/vivants, et l’énigme de l’un et du deux.'
