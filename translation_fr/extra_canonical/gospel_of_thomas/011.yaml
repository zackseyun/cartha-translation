review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement les oppositions, les temps prospectifs et l’énigme du logion. Le pluriel « Aux jours » suit bien le manuscrit (ⲛ̄ϩⲟⲟⲩ), malgré la divergence de la normalisation fournie. La traduction ne résout pas indûment les référents ambigus ni le sens symbolique de la lumière, des morts/vivants et de l’un/deux.
  naturalness: L’ensemble est clair et sobre, mais « Quand vous viendrez à être dans la lumière » est inutilement calqué et peu naturel en français moderne. « Vous étiez un » est compréhensible, mais « vous ne faisiez qu’un » rend plus idiomatiquement le prédicat numéral sans expliciter son sens.
  terminology: « Ciel », « morts », « vivants », « lumière » et « passera » sont appropriés et conservent le registre cosmologique et paradoxal. Les notes préservent correctement les ambiguïtés textuelles et syntaxiques.
  issues:
  - severity: low
    issue: Formulation calquée pour l’entrée dans la lumière
    rationale: « Viendrez à être dans la lumière » reproduit de trop près l’aspect ingressif copte et sonne raide en français moderne. « Serez dans la lumière » est idiomatique, sans imposer une interprétation théologique.
  - severity: low
    issue: Rendu peu idiomatique de « être un »
    rationale: « Vous étiez un » est grammaticalement possible mais heurté avec un sujet pluriel. « Vous ne faisiez qu’un » garde l’énigme du nombre et le parallélisme avec « devenus deux ».
  - severity: low
    issue: 'Note a : paraphrase présentée comme littérale'
    rationale: « Vous faisiez de lui le vivant » n’est pas une formulation littérale française fiable et suggère un substantif défini. Il vaut mieux décrire directement la valeur causative de la construction.
