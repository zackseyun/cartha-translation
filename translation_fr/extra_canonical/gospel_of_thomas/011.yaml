base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: fr
  text: 'Jésus dit : « Ce ciel passera, et celui qui est au-dessus de lui passera. Les morts ne sont pas vivants, et les vivants ne mourront pas. Aux jours où vous mangiez ce qui est mort, vous le rendiez vivant[a]. Quand vous serez dans la lumière, que ferez-vous[b] ? Le jour où vous ne faisiez qu’un, vous êtes devenus deux[c]. Mais quand vous deviendrez deux, que ferez-vous[d] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction copte est causative : « vous le rendiez vivant ». Le pronom renvoie vraisemblablement à « ce qui est mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le copte comporte un pronom objet : on pourrait aussi traduire « qu’en ferez-vous ? » ou « que ferez-vous de cela ? ». Son référent demeure incertain.'
    reason: lexical_alternative
  - marker: c
    text: '« Vous ne faisiez qu’un » peut aussi se comprendre « vous êtes devenus un » ou « vous avez fait un ». La suite favorise ici une référence au passé : « vous êtes devenus deux ».'
    reason: alternative_reading
  - marker: d
    text: Dans la dernière question, le manuscrit emploie une forme verbale différente de celle de la question précédente, peut-être une variante graphique ou un verbe signifiant « prendre, faire à ». Le contexte suggère la répétition de « que ferez-vous ? ».
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: ce ciel
  rationale: ⲡⲉ peut désigner le ciel visible ou céleste. « Ce ciel », suivi de « celui qui est au-dessus de lui », conserve l'idée d'une cosmologie à plusieurs niveaux sans la préciser davantage.
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: passera
  rationale: Le verbe, emprunté au grec παρέρχομαι, exprime ici la disparition ou le passage. « Passera » garde la brièveté et l'ambiguïté du texte.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ / ⲛⲉⲧⲟⲛϩ
  choice: les morts / les vivants
  rationale: Ces substantivations françaises rendent naturellement les groupes relatifs coptes et préservent leur parallélisme lapidaire.
- source_word: ⲛ̄ϩⲟⲟⲩ
  choice: aux jours où
  rationale: Le pluriel manuscrit est maintenu, plutôt que nivelé en un singulier, afin de suivre directement le témoin copte.
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: vous le rendiez vivant
  rationale: La construction causative signifie faire devenir vivant. L'imparfait s'accorde avec l'action habituelle ou répétée introduite par « aux jours où ».
- source_word: ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: dans la lumière
  rationale: Traduction directe qui conserve intacte la portée symbolique possible de la lumière.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲧⲛⲁⲁϥ
  choice: que ferez-vous ?
  rationale: Le pronom objet copte peut être pléonastique ou renvoyer à un élément antérieur. La formulation française laisse ce référent indéterminé.
- source_word: ⲉⲧⲉⲧⲛ̄ⲟ ⲛ̄ⲟⲩⲁ
  choice: vous étiez un
  rationale: L'expression peut signifier « être un » ou « devenir un ». Le contexte passé et l'aoriste suivant favorisent ici « étiez un », sans expliquer l'image.
- source_word: ⲁⲧⲉⲧⲛ̄ⲉⲓⲣⲉ ⲙ̄ⲡⲥⲛⲁⲩ
  choice: vous êtes devenus deux
  rationale: Le passé accompli est rendu par le passé composé, naturel en français moderne, tout en conservant l'opposition énigmatique entre un et deux.
theological_decisions:
- issue: Portée de l'opposition entre les morts et les vivants
  choice: Conserver les affirmations littérales et paradoxales sans identifier les groupes.
  alternative: Interpréter « morts » et « vivants » comme des états exclusivement physiques ou spirituels.
  rationale: Le texte ne définit pas ces catégories; une explicitation résoudrait indûment sa tension théologique.
- issue: Sens de l'un et du deux
  choice: Maintenir les nombres sans glose dans le corps du texte.
  alternative: Les expliquer par une anthropologie particulière, par exemple l'unité originelle, la différenciation sexuelle ou la division intérieure.
  rationale: Aucune interprétation unique n'est imposée par la formulation copte; le caractère énigmatique doit rester ouvert.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le rythme bref, les parallélismes et le caractère énigmatique du copte. Le vouvoiement collectif rend le pluriel ⲧⲉⲧⲛ-. Le texte principal suit de préférence le manuscrit diplomatique lorsque la normalisation fournie s'en écarte, notamment pour le pluriel « aux jours ».
