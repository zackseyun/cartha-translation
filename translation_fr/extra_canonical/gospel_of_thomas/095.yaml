base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: fr
  text: 'Jésus dit[a] : « Si vous avez de l’argent, ne le prêtez pas à intérêt[b] ; donnez-le plutôt[c] à celui de qui vous ne le reprendrez pas[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « Jésus dit » sont restitués à l’endroit où le manuscrit est légèrement endommagé.
    reason: lacuna_or_restoration
  - marker: b
    text: Le terme copte ⲙⲏⲥⲉ désigne l’intérêt d’un prêt, traditionnellement appelé aussi « usure » ; dans l’usage ancien, « usure » pouvait désigner tout intérêt, et non seulement un taux excessif.
    reason: cultural_note
  - marker: c
    text: Le passage est partiellement endommagé. Le manuscrit permet de restituer « donnez-le », tandis que le texte normalisé se lit « donnez à lui ». La traduction rend ensemble l’objet donné et son destinataire.
    reason: textual_variant
  - marker: d
    text: 'Littéralement, le pronom objet est au pluriel (« vous ne les reprendrez pas »), probablement parce que l’argent est envisagé comme des pièces. La proposition peut aussi être comprise : « à celui qui ne vous les rendra pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: si
  rationale: La particule introduit ici une condition générale, et non une succession temporelle déterminée.
- source_word: ⲟⲩⲛⲧⲏⲧⲛ ϩⲟⲙⲧ
  choice: vous avez de l’argent
  rationale: La construction existentielle de possession se rend naturellement ainsi en français ; ϩⲟⲙⲧ peut désigner le métal monétaire, une pièce ou l’argent en général.
- source_word: ⲙⲡⲣϯ ⲉⲧⲙⲏⲥⲉ
  choice: ne le prêtez pas à intérêt
  rationale: L’expression idiomatique associe « donner » à ⲙⲏⲥⲉ, « intérêt/usure » ; « prêter à intérêt » exprime clairement l’opération sans imposer le sens moderne d’un taux abusif.
- source_word: ⲁⲗⲗⲁ
  choice: plutôt
  rationale: 'Après l’interdiction, la conjonction marque ici une opposition corrective : non pas prêter à intérêt, mais donner.'
- source_word: ϯ̣ ⲙ̣[ⲙⲟϥ] / ϯ ⲛⲛⲧⲟϥ
  choice: donnez-le … à celui
  rationale: Cette formulation française exprime à la fois l’objet donné, vraisemblablement restitué dans le manuscrit, et le destinataire que la lecture normalisée met en relief.
- source_word: '[ⲉ]ⲧⲛⲁϫⲓⲧⲟⲩ ⲁⲛ ⲛ̄ⲧⲟⲟⲧϥ'
  choice: de qui vous ne le reprendrez pas
  rationale: Le verbe ϫⲓ signifie « prendre/recevoir » et la construction avec ⲛ̄ⲧⲟⲟⲧϥ indique la provenance. « Reprendre » rend naturellement l’idée de récupérer l’argent auprès du bénéficiaire.
theological_decisions:
- issue: Portée de l’opposition entre prêt à intérêt et don
  choice: Conserver l’impératif concret sans préciser s’il s’agit d’une règle universelle ou d’une exhortation sapientielle.
  alternative: Paraphraser comme une interdiction absolue de tout intérêt ou comme un simple conseil de générosité.
  rationale: Le texte oppose directement le prêt à intérêt au don sans expliciter la portée juridique, sociale ou spirituelle de l’enseignement.
translation_notes:
  register: Français international actuel, sobre et digne. Le vouvoiement pluriel conserve l’adresse collective du copte. « Argent » et les pronoms singuliers donnent une phrase naturelle en français, tandis qu’une note signale le pluriel concret du texte source.
