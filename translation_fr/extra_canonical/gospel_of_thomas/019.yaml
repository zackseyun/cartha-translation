base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: fr
  text: 'Jésus dit : « Heureux celui qui est venu à l’existence avant de venir à l’existence.[a] Si vous devenez mes disciples et écoutez mes paroles, ces pierres vous serviront.[b] Car vous avez cinq arbres dans le paradis : ils ne bougent ni en été ni en hiver, et leurs feuilles ne tombent pas. Celui qui les connaîtra ne goûtera pas la mort.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte répète le même verbe copte, qui signifie « devenir » ou « venir à l’existence ». Cette formulation paradoxale est donc conservée sans être expliquée.
    reason: lexical_alternative
  - marker: b
    text: 'La surface du manuscrit peut se lire au pluriel : « mes paroles, ces pierres ». Le texte normalisé de l’édition adopte le singulier : « ma parole, cette pierre vous servira ».'
    reason: textual_variant
  - marker: c
    text: « Goûter la mort » traduit littéralement une expression idiomatique qui signifie faire l’expérience de la mort.
    reason: idiom
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Heureux
  rationale: Le mot grec emprunté au copte introduit une béatitude. « Heureux » est naturel en français biblique moderne tout en conservant la portée solennelle de la formule.
- source_word: ϣⲱⲡⲉ
  choice: venir à l’existence
  rationale: Ce choix conserve le sens de « devenir, venir à l’existence » et répète volontairement la même expression afin de préserver le paradoxe du texte.
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: Si vous devenez
  rationale: La construction peut être conditionnelle ou temporelle; « si » rend ici clairement la condition sans la transformer en certitude.
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: disciples
  rationale: C’est l’équivalent courant du terme grec emprunté et il convient au cadre de l’enseignement de Jésus.
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: écoutez
  rationale: Le verbe exprime une écoute attentive. « Écoutez » évite d’ajouter explicitement l’idée d’obéissance.
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: mes paroles / ces pierres
  rationale: La traduction suit la lecture plurielle de la surface manuscrite aux lignes 20–21. La normalisation éditoriale au singulier est signalée en note.
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: vous serviront
  rationale: Le verbe grec emprunté signifie servir ou exercer un service. Cette formulation est plus naturelle en français actuel que « exerceront un ministère envers vous » sans perdre le sens.
- source_word: ⲕⲓⲙ
  choice: bougent
  rationale: Le sens concret de mouvement est conservé plutôt que d’interpréter le verbe comme « changer ».
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: goûtera la mort
  rationale: La traduction littérale conserve l’idiome ancien et sa force imagée.
theological_decisions:
- issue: Identité ou état de celui qui « est venu à l’existence avant de venir à l’existence »
  choice: Conserver le paradoxe sans explication dans le corps du texte
  alternative: Interpréter la formule comme une préexistence, une naissance antérieure ou une connaissance de soi
  rationale: Le copte formule délibérément un paradoxe avec le même verbe. Préciser son référent imposerait une lecture théologique que le texte ne tranche pas.
- issue: Nature des cinq arbres du paradis
  choice: Conserver l’image sans identifier les arbres
  alternative: Les expliquer comme des réalités spirituelles, des vertus ou des figures cosmologiques
  rationale: Le texte ne donne aucune identification explicite; la traduction ne doit pas importer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste sobre et aphoristique. Le paradoxe initial et les images énigmatiques ne sont pas lissés; le pluriel du manuscrit est retenu, avec la lecture éditoriale singulière en note.
