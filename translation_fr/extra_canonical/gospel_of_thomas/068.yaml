  source_fidelity: 'Le texte français rend fidèlement la structure du copte : béatitude, haine et persécution, puis absence de « lieu » dans l’« endroit » où la persécution a eu lieu. La tournure indéfinie « on » conserve de façon légitime l’ambiguïté de la troisième personne du pluriel copte, qui peut être lue activement ou comme un équivalent fonctionnel du passif. La finale est correctement rendue sans ajouter une idée d’entrée dans le lieu.'
  naturalness: Le français est moderne, fluide et d’un registre sobrement solennel. « Heureux êtes-vous » convient au genre de la béatitude, et « l’on » évite naturellement la collision vocalique après « Et ». La distinction « lieu / endroit » demeure lisible sans alourdir la phrase.
  terminology: « Heureux », « haïr », « persécuter », « lieu » et « endroit » sont des choix appropriés. La traduction ne surinterprète pas la distinction entre ⲧⲟⲡⲟⲥ et ⲙⲁ et n’importe aucun motif christologique provenant des parallèles synoptiques.
