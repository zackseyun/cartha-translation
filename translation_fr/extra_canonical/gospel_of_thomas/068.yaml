base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: fr
  text: 'Jésus dit : « Heureux êtes-vous quand on vous hait et qu’on vous persécute[a] ! Et l’on ne trouvera aucun lieu dans l’endroit où l’on vous a persécutés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte emploie ici la troisième personne du pluriel, qui peut désigner des persécuteurs (« ils vous haïssent et vous persécutent ») ou fonctionner comme une tournure indéfinie proche du passif (« vous êtes haïs et persécutés »).
    reason: ambiguïté grammaticale
  - marker: b
    text: 'Le texte emploie deux mots différents : ⲧⲟⲡⲟⲥ (topos), rendu par « lieu », et ⲙⲁ (ma), rendu par « endroit ». La différence peut être significative, mais le texte n’explique pas lui-même sa portée. La fin signifie littéralement « dans l’endroit où l’on vous a persécutés » ; elle ne contient pas l’idée supplémentaire d’« y entrer ».'
    reason: distinction lexicale et clarification textuelle
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: heureux
  rationale: Emprunt au grec μακάριος, courant dans les béatitudes. « Heureux » est naturel et dignifié en français tout en exprimant une condition favorable déclarée, plutôt qu’un simple sentiment.
- source_word: ⲙⲉⲥⲧⲉ-
  choice: haïr
  rationale: Verbe copte usuel signifiant « haïr ».
- source_word: ⲇⲓⲱⲕⲉ
  choice: persécuter
  rationale: Emprunt au grec διώκω ; dans ce contexte d’hostilité envers des personnes, « persécuter » rend mieux le sens que le plus général « poursuivre ».
- source_word: ϩⲉ ⲉ-
  choice: trouver
  rationale: La construction signifie ici « trouver » ou « tomber sur ».
- source_word: ⲧⲟⲡⲟⲥ
  choice: lieu
  rationale: Emprunt grec τόπος. « Lieu » conserve la formulation abstraite et son éventuelle portée symbolique sans l’imposer.
- source_word: ⲙⲁ
  choice: endroit
  rationale: Terme copte courant pour un lieu ou un emplacement. Le choix d’« endroit » permet de préserver en français la distinction lexicale avec ⲧⲟⲡⲟⲥ.
theological_decisions:
- issue: Valeur du sujet indéfini à la troisième personne du pluriel
  choice: 'Tournure française indéfinie avec « on » : « on vous hait… l’on ne trouvera… »'
  alternative: 'Tournure active personnelle : « ils vous haïssent… ils ne trouveront… » ; ou passive : « vous êtes haïs… aucun lieu ne sera trouvé… »'
  rationale: La troisième personne du pluriel copte peut être personnelle ou servir de tournure indéfinie proche du passif. « On » conserve cette indétermination sans identifier explicitement les persécuteurs comme sujet de la dernière proposition, ce que le texte permet mais n’exige pas.
- issue: Rapport entre ⲧⲟⲡⲟⲥ et ⲙⲁ
  choice: Préserver la différence par « lieu » et « endroit »
  alternative: 'Répéter « lieu » : « aucun lieu dans le lieu »'
  rationale: Les deux mots sources sont distincts. La traduction évite de transformer cette distinction en opposition doctrinale explicite entre un lieu spirituel et un lieu physique, distinction possible mais non démontrable par le seul énoncé.
- issue: Motif de la persécution
  choice: Ne préciser aucun motif
  alternative: Ajouter « à cause de moi » ou une formule christologique issue des parallèles synoptiques
  rationale: Le texte de Thomas ne donne aucun motif christologique à la haine ou à la persécution ; aucun élément ne doit être importé des parallèles.
translation_notes:
  register: Français international moderne, sobre et digne. La forme « Heureux êtes-vous » garde la solennité d’une béatitude tout en restant claire. « L’on » après « Et » évite une rencontre vocalique peu élégante. Les marqueurs [a] et [b] figurent dans le texte principal.
