base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: fr
  text: 'Jésus dit : « Le règne du Père ressemble à un marchand qui avait un chargement de marchandises et qui trouva une perle. Ce marchand était avisé : il vendit son chargement[a] et s’acheta cette seule perle. Vous aussi, cherchez son trésor[b], qui ne s’épuise pas et qui demeure : le lieu où aucune mite n’entre pour le manger et où aucun ver ne le détruit[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il donna le chargement au-dehors ». Dans ce contexte d’achat et de vente, l’expression signifie qu’il le vendit ou s’en défit.'
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit présente ici une difficulté orthographique ; la traduction suit la lecture normalisée « son trésor ».
    reason: lacuna_or_restoration
  - marker: c
    text: Le texte dit « ver », et non « rouille » comme dans certaines formulations parallèles ; l’image est celle d’une destruction organique.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: le règne du Père
  rationale: ⲙⲛⲧⲣⲣⲟ désigne ici l’exercice de la royauté plutôt qu’un territoire; « règne » garde cette nuance dynamique.
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: un marchand / ce marchand
  rationale: L’expression signifie littéralement un homme de commerce; « marchand » est l’équivalent français naturel.
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: chargement de marchandises
  rationale: Le prêt grec φορτίον désigne une charge ou cargaison; l’explicitation « de marchandises » rend clairement le contexte commercial sans imposer le sens technique moderne de « consignation ».
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: perle
  rationale: Équivalent usuel du prêt grec μαργαρίτης.
- source_word: ⲥⲁⲃⲉ
  choice: avisé
  rationale: Le terme exprime la sagesse pratique; « avisé » convient au discernement du marchand.
- source_word: ϯⲡⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: vendit son chargement
  rationale: Littéralement « donna le chargement au-dehors »; dans l’enchaînement commercial avec l’achat, l’expression signifie qu’il s’en défit par une vente.
- source_word: ⲧⲟⲟⲩ ⲛⲁϥ
  choice: s’acheta
  rationale: Le datif renvoie au marchand lui-même; « s’acheta » restitue naturellement qu’il acquiert la perle pour lui.
- source_word: ⲡⲓⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ ⲟⲩⲱⲧ
  choice: cette unique perle
  rationale: ⲟⲩⲱⲧ souligne qu’il s’agit d’une seule perle; le démonstratif français assure la reprise définie.
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: vous aussi
  rationale: Cette forme emphatique-adverbiale signifie « vous aussi / pour votre part »; elle n’est pas traduite une seconde fois comme un réfléchi.
- source_word: ⲡⲉϥⲁϩⲟ
  choice: son trésor
  rationale: La lecture normalisée renvoie à une richesse ou un trésor; « trésor » convient à ce que l’on recherche et qui demeure.
- source_word: ⲙⲉⲣⲉⲛⲧⲟϥⲱϫⲛ
  choice: qui ne s’épuise pas
  rationale: ⲱϫⲛ peut exprimer l’épuisement ou le fait de venir à manquer; « ne s’épuise pas » conserve l’image d’une réserve durable.
- source_word: ⲡϥⲛⲧ
  choice: ver
  rationale: Le manuscrit parle d’un ver et non de la rouille; la traduction maintient cette image de décomposition organique.
theological_decisions:
- issue: Nature de la ⲙⲛⲧⲣⲣⲟ du Père
  choice: le règne du Père
  alternative: le royaume du Père
  rationale: « Règne » préserve le sens abstrait de royauté ou gouvernement sans décider si un domaine spatial est également impliqué.
- issue: Référent de « son trésor »
  choice: maintien du possessif « son » sans explicitation
  alternative: « le trésor » ou identification explicite avec la perle/le Père
  rationale: Le texte copte comporte le possessif mais son antécédent peut susciter une tension interprétative; la traduction ne la résout pas artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parabolique est conservé, avec des phrases nettes et un vocabulaire commercial compréhensible. « Mite » est préféré à « teigne » pour désigner clairement l’insecte qui mange les étoffes; « avisé » rend une sagesse pratique sans tonalité confessionnelle.
