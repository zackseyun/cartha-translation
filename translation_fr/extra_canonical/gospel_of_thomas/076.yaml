revisions:
- from: 'Jésus dit : « Le règne du Père ressemble à un marchand qui avait un chargement de marchandises et qui trouva une perle. Ce marchand était avisé : il vendit son chargement[a] et s’acheta cette unique perle. Vous aussi, cherchez son trésor[b], qui ne s’épuise pas et qui demeure : le lieu où aucune mite n’entre pour manger et où aucun ver ne détruit[c]. »'
  to: 'Jésus dit : « Le règne du Père ressemble à un marchand qui avait un chargement de marchandises et qui trouva une perle. Ce marchand était avisé : il vendit son chargement[a] et s’acheta cette seule perle. Vous aussi, cherchez son trésor[b], qui ne s’épuise pas et qui demeure : le lieu où aucune mite n’entre pour le manger et où aucun ver ne le détruit[c]. »'
  rationale: La révision maintient toutes les options lexicales et théologiques du projet. Elle remplace seulement « unique » par « seule », qui rend plus précisément le numéral copte, et explicite les pronoms objets requis par le français dans l’image de la mite et du ver. Les trois ancres de notes existantes sont conservées et chacune demeure correctement placée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les principaux éléments coptes : le règne du Père, le marchand, le chargement, la perle, la prudence du marchand, la vente implicite dans « donner ... au-dehors », l’achat pour lui-même, et l’exhortation finale. Le possessif ambigu de « son trésor » est justement conservé. Une légère révision est nécessaire pour ne pas transformer « une perle » en une perle intrinsèquement unique et pour rendre grammaticalement explicite en français l’objet des verbes finals.'
  naturalness: 'Le français est moderne, clair et d’un registre approprié. « S’acheta » est naturel dans ce contexte. La séquence finale gagne en clarté avec des pronoms reprenant « trésor » : sans eux, « aucun ver ne détruit » reste transitivement incomplet en français.'
  terminology: '« Le règne du Père », « marchand », « chargement de marchandises », « avisé », « trésor », « mite » et « ver » sont des choix justes et cohérents. « Cette unique perle » risque toutefois de suggérer que la perle était sans égale, alors que ⲟⲩⲱⲧ marque d’abord le nombre : une seule perle.'
  issues:
  - severity: low
    issue: « cette unique perle » peut surinterpréter le numéral.
    rationale: Le copte ⲡⲓⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ ⲟⲩⲱⲧ signifie littéralement « la perle une / la seule perle » et met l’accent sur l’acquisition d’une seule perle. « Unique » peut en français impliquer une qualité exceptionnelle ou l’absence absolue de semblables.
  - severity: low
    issue: La dernière proposition française laisse « détruit » sans complément explicite.
    rationale: Le copte peut laisser l’objet sous-entendu dans la formule relative. En français, « aucun ver ne détruit » est elliptique et moins naturel ; « ne le détruit » reprend sans ajout interprétatif significatif le trésor recherché.
