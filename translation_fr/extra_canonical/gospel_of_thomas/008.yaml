revisions:
- from: 'Et il dit : « L’être humain est semblable à un pêcheur avisé qui jeta son filet dans la mer. Il le remonta de la mer, plein de petits poissons. Parmi eux, le pêcheur avisé trouva un grand et beau poisson. Il rejeta tous les petits poissons dans la mer, puis choisit le grand poisson sans difficulté. Que celui qui a des oreilles pour entendre entende ! »'
  to: 'Et il dit : « L’être humain est semblable à un pêcheur avisé qui jeta son filet dans la mer. Il le tira hors de la mer, rempli de petits poissons. Parmi eux, le pêcheur avisé trouva un gros et beau poisson. Il rejeta tous les petits poissons dans la mer, puis choisit le gros poisson sans difficulté. Que celui qui a des oreilles pour entendre entende ! »'
  rationale: Révision limitée à deux formulations afin de rendre plus explicitement le filet comme objet de l’action et de choisir un terme français plus idiomatique pour la taille du poisson. Le sens, l’ambiguïté symbolique et le registre de la traduction sont préservés.
