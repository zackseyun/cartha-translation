base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: fr
  text: 'Et il dit : « L’être humain est semblable à un pêcheur avisé qui jeta son filet dans la mer. Il le tira hors de la mer, rempli de petits poissons. Parmi eux, le pêcheur avisé trouva un gros et beau poisson. Il rejeta tous les petits poissons dans la mer, puis choisit le gros poisson sans difficulté. Que celui qui a des oreilles pour entendre entende ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: L’être humain
  rationale: Le nom avec article défini a ici une portée générique. « L’être humain » conserve cette valeur inclusive sans réduire le référent à un homme particulier.
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: un pêcheur avisé
  rationale: ⲟⲩⲱϩⲉ désigne un pêcheur, tandis que ⲣⲙⲛϩⲏⲧ, littéralement une personne de cœur ou d’intelligence, exprime la sagesse pratique et le discernement.
- source_word: ⲡⲉϥⲁⲃⲱ
  choice: son filet
  rationale: Le préfixe possessif de troisième personne impose « son », et ⲁⲃⲱ désigne un filet de pêche.
- source_word: ϩⲉ ⲉ-
  choice: trouva
  rationale: La tournure signifie littéralement « tomber sur », mais fonctionne idiomatiquement au sens de « trouver ».
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: beau
  rationale: Le qualificatif signifie que le poisson est bon ou de qualité. Dans ce contexte, « beau » rend naturellement sa valeur favorable sans ajouter explicitement l’idée marchande de valeur.
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: sans difficulté
  rationale: Cette expression composée signifie littéralement « sans peine » ou « sans effort » ; « sans difficulté » convient au geste de sélection décrit.
theological_decisions:
- issue: Relation avec la parabole du filet en Matthieu 13.47-48
  choice: Conserver le pêcheur unique, les nombreux petits poissons et le seul grand poisson
  alternative: Harmoniser avec le tri entre bons et mauvais poissons dans Matthieu
  rationale: Le texte copte ne présente ni plusieurs catégories morales ni une scène de jugement final. La traduction maintient donc sa tension propre et son accent sur le choix d’un seul grand poisson.
- issue: Interprétation symbolique du grand poisson
  choice: Ne pas expliciter son référent
  alternative: Identifier le poisson à la connaissance, au Royaume ou à l’élu solitaire
  rationale: Le logion ne fournit pas lui-même cette identification. La traduction laisse ouverte la portée symbolique de la parabole.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le ton parabolique sans archaïsme excessif. « Avisé » rend la sagesse pratique du pêcheur, et la formule finale conserve la tournure traditionnelle tout en restant claire.
