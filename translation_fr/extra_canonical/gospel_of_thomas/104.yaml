base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: fr
  text: 'Ils dirent à Jésus : « Viens, prions aujourd’hui et jeûnons. » Jésus dit : « Quel péché ai-je donc commis, ou en quoi ai-je été vaincu ? Mais quand l’époux sortira de la chambre nuptiale, alors qu’ils jeûnent et qu’ils prient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: viens
  rationale: Impératif d’invitation direct, qui conserve le ton bref du texte.
- source_word: ϣⲗⲏⲗ
  choice: prier
  rationale: Équivalent courant et précis du verbe copte désignant la prière.
- source_word: ⲛⲡϩⲟⲟⲩ
  choice: aujourd’hui
  rationale: Littéralement « le jour », employé ici dans son sens temporel idiomatique.
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: jeûner
  rationale: Rend directement le verbe emprunté au grec et garde son sens religieux ordinaire.
- source_word: ⲡⲛⲟⲃⲉ
  choice: péché
  rationale: Terme moral explicite correspondant au sens principal du nom copte.
- source_word: ⲟⲩ ⲅⲁⲣ ⲡⲉ
  choice: quel… donc
  rationale: La construction est interrogative; « donc » restitue naturellement la particule explicative ⲅⲁⲣ sans transformer la question en affirmation.
- source_word: ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: commettre
  rationale: Avec « péché », le français idiomatique dit « commettre un péché » plutôt que simplement « faire ».
- source_word: ϫⲣⲟ ⲉ-
  choice: être vaincu
  rationale: Sans infinitif complément, le verbe exprime ici l’idée d’être dominé, défait ou vaincu, plutôt que celle d’être contraint à accomplir une action.
- source_word: ϩⲛ ⲟⲩ
  choice: en quoi
  rationale: Préserve la formulation ouverte et elliptique de la seconde question.
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: l’époux
  rationale: Équivalent français naturel du grec νυμφίος; il maintient l’image nuptiale sans archaïsme inutile.
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: la chambre nuptiale
  rationale: Rend distinctement le lieu nuptial désigné par l’emprunt grec νυμφών.
- source_word: ⲙⲁⲣⲟⲩ-
  choice: qu’ils…
  rationale: Le subjonctif français restitue la valeur jussive de troisième personne du pluriel, et non un simple futur.
theological_decisions:
- issue: Lien entre la sortie de l’époux et le jeûne
  choice: Conserver littéralement « quand l’époux sortira de la chambre nuptiale »
  alternative: Interpréter comme l’enlèvement, le départ ou la mort de Jésus
  rationale: Le texte présente une image nuptiale sans en expliciter le référent; la traduction ne doit pas imposer une identification théologique.
- issue: Sens de la question sur le fait d’être vaincu
  choice: Laisser l’agent ou la puissance victorieuse implicite
  alternative: Ajouter « par le péché » ou « par la tentation »
  rationale: Le copte ne nomme pas ce qui aurait vaincu Jésus; maintenir cette ellipse préserve l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La brièveté des échanges est conservée. « L’époux » est préféré à « le marié », plus quotidien, afin de maintenir la portée symbolique de l’image sans adopter un registre archaïque.
