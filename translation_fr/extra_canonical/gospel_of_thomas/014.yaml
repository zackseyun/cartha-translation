revisions:
- from: 'Jésus leur dit : « Si vous jeûnez, vous vous attirerez un péché[a] ; si vous priez, vous serez condamnés[b] ; et si vous faites l’aumône, vous ferez du mal à votre esprit. Quand vous entrerez dans un pays quelconque et parcourrez les contrées, si l’on vous accueille, mangez ce qu’on vous servira et guérissez les malades qui s’y trouvent[c]. Car ce qui entre dans votre bouche ne vous rendra pas impurs ; mais ce qui sort de votre bouche, voilà ce qui vous rendra impurs. »'
  to: 'Jésus leur dit : « Si vous jeûnez, vous vous attirerez un péché[a] ; si vous priez, vous serez condamnés[b] ; et si vous faites l’aumône, vous ferez du mal à vos esprits. Quand vous entrerez dans un pays quelconque et parcourrez les contrées, si l’on vous accueille, mangez ce qu’on vous servira et guérissez les malades parmi eux[c]. Car ce qui entre dans votre bouche ne vous rendra pas impurs ; mais ce qui sort de votre bouche, voilà ce qui vous rendra impurs. »'
  rationale: 'La révision rétablit deux précisions du texte copte : le pluriel « vos esprits » et le lien des malades avec les personnes qui accueillent les voyageurs. Elle conserve les choix justes du projet pour les autres expressions difficiles et maintient les ancres de notes.'
