    rationale: Le copte ⲛ̄ϩⲏⲧⲟⲩ renvoie aux personnes qui accueillent les voyageurs (« parmi eux »), et non au lieu où elles se trouvent.
  - severity: medium
    issue: « votre esprit » est au singulier.
    rationale: La leçon manuscrite ⲛ̄ⲛⲉⲧⲙⲡⲛⲁ correspond à « vos esprits » ; le pluriel est également retenu dans la piste d’audit anglaise.
