base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: fr
  text: 'Jésus leur dit : « Si vous jeûnez, vous vous attirerez un péché[a] ; si vous priez, vous serez condamnés[b] ; et si vous faites l’aumône, vous ferez du mal à vos esprits. Quand vous entrerez dans un pays quelconque et parcourrez les contrées, si l’on vous accueille, mangez ce qu’on vous servira et guérissez les malades parmi eux[c]. Car ce qui entre dans votre bouche ne vous rendra pas impurs ; mais ce qui sort de votre bouche, voilà ce qui vous rendra impurs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe copte peut signifier « engendrer », « acquérir » ou « se procurer » ; il pourrait aussi se rendre par « vous engendrerez un péché ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils vous condamneront », tournure copte couramment employée avec un sens passif.'
    reason: register_note
  - marker: c
    text: 'Littéralement : « les malades parmi eux » ; le pronom renvoie vraisemblablement aux personnes qui accueillent les voyageurs.'
    reason: source_clarity
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: vous vous attirerez
  rationale: Le verbe peut signifier « engendrer », « acquérir » ou « se procurer ». Avec « un péché », « vous vous attirerez » exprime naturellement en français le fait de faire venir le péché sur soi, tout en maintenant la formulation provocatrice.
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: vous serez condamnés
  rationale: L’actif impersonnel à la troisième personne du pluriel (« ils vous condamneront ») fonctionne ici comme une tournure passive ; le passif français en restitue le sens sans introduire des accusateurs déterminés.
- source_word: ⲕⲱ ϩⲁ-
  choice: ce qu’on vous servira
  rationale: L’expression signifie littéralement « placer devant » ; dans un contexte d’hospitalité et de nourriture, « servir » est l’équivalent français naturel.
- source_word: ϫⲱϩⲙ
  choice: rendre impur
  rationale: Le verbe désigne le fait de souiller ou de rendre impur. Cette formulation conserve à la fois la portée rituelle et morale du terme.
- source_word: ⲭⲱⲣⲁ
  choice: contrées
  rationale: Le manuscrit porte un pluriel désignant des régions, territoires ou contrées. « Contrées » garde la pluralité et convient au contexte de déplacement itinérant.
theological_decisions:
- issue: Renversement des pratiques traditionnelles de piété
  choice: vous vous attirerez un péché / vous ferez du mal à votre esprit
  alternative: vous commettrez un péché / vous nuirez à votre esprit
  rationale: Le texte associe délibérément le jeûne, la prière et l’aumône à des conséquences négatives. La traduction conserve cette tension sans expliquer, atténuer ni conditionner ces déclarations.
- issue: Impureté liée à ce qui entre ou sort de la bouche
  choice: ne vous rendra pas impurs / vous rendra impurs
  alternative: ne vous souillera pas / vous souillera
  rationale: « Rendre impur » est clair en français moderne et conserve l’arrière-plan de pollution rituelle ou morale, sans réduire le propos à l’hygiène ou à une métaphore particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe sentencieuse est conservée, mais les reprises disloquées du copte (« ce qu’ils placeront devant vous, mangez-le ») sont rendues de façon naturelle. Le singulier collectif « votre esprit » suit le texte normalisé et évite d’imposer une anthropologie particulière.
