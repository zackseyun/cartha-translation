  source_fidelity: La traduction restitue bien les conditionnelles, la condamnation exprimée par un pluriel impersonnel copte, l'hospitalité, et le contraste final entre ce qui entre et ce qui sort de la bouche. Toutefois, ⲛ̄ϩⲏⲧⲟⲩ signifie « parmi eux » et non « qui s’y trouvent » ; cette relation doit figurer dans le texte, et non seulement en note. Le manuscrit porte en outre « vos esprits » au pluriel, que confirme l’audit anglais.
  naturalness: Le français est globalement fluide, moderne et d’un registre approprié. « Vous vous attirerez un péché » est naturel tout en gardant la force provocatrice du texte. La formulation « les malades parmi eux » est plus fidèle et reste idiomatique.
  terminology: « Jeûner », « faire l’aumône », « être condamnés », « rendre impurs » et « contrées » conviennent. « Vos esprits » préserve le pluriel attesté sans imposer d’interprétation anthropologique.
