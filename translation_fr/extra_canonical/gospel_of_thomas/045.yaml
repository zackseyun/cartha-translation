base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: fr
  text: 'Jésus dit : « On ne cueille pas de raisins sur des épines, et l’on ne récolte pas non plus de figues sur des chardons[a], car ces plantes ne donnent pas de fruit. Une personne bonne tire une bonne chose de sa réserve[b]. Une personne mauvaise tire le mal de sa mauvaise réserve, qui est dans son cœur[c], et elle dit des choses mauvaises. Car c’est de l’abondance du cœur qu’elle tire le mal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte désigne une plante épineuse appelée littéralement « épine de chameau » ; son identification botanique exacte est incertaine.
    reason: Signaler l’image littérale et l’incertitude lexicale derrière le terme français courant.
  - marker: b
    text: 'Ou : « de son trésor », au sens de ce qui est gardé en réserve.'
    reason: Le terme source peut désigner un dépôt, une réserve ou un trésor.
  - marker: c
    text: Le copte qualifie la réserve de l’homme mauvais comme mauvaise et la situe dans son cœur. La formulation peut refléter une tradition textuelle proche de Luc 6.45.
    reason: Préserver le rattachement syntaxique de l’adjectif et de la relative sans lisser la formulation du témoin.
lexical_decisions:
- source_word: ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: chardons
  rationale: Le composé copte désigne littéralement une plante épineuse dite « épine de chameau ». « Chardons » donne en français courant l’image botanique requise sans prétendre identifier précisément l’espèce.
- source_word: ⲁϩⲟ / ⲉϩⲟ
  choice: réserve
  rationale: Le terme désigne ce qui est entreposé, un dépôt ou un trésor. « Réserve » conserve l’image d’un fonds intérieur d’où l’on tire quelque chose, sans suggérer nécessairement des richesses.
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: le trop-plein du cœur
  rationale: Rend concrètement l’idée de surabondance ou de débordement du cœur et préserve la métaphore du texte.
- source_word: ⲣⲱⲙⲉ
  choice: personne
  rationale: Le nom copte désigne ici l’être humain de manière générique. « Personne » est naturel et inclusif en français moderne.
- source_word: ⲡⲟⲛⲏⲣⲟⲛ
  choice: chose mauvaise / choses mauvaises / le mal
  rationale: Le mot grec emprunté au copte peut être substantivé ou adjectival. La variation française suit ses différents emplois dans la phrase tout en gardant leur unité sémantique.
theological_decisions:
- issue: Rapport entre la réserve mauvaise et le cœur
  choice: « sa réserve mauvaise, celle qui est dans son cœur »
  alternative: « le mal de la mauvaise réserve de son cœur »
  rationale: La formulation retenue suit l’enchaînement syntaxique copte et conserve l’explicitation selon laquelle la réserve se trouve dans le cœur, sans réduire le cœur lui-même à cette réserve.
- issue: Portée morale de l’image du fruit
  choice: Conserver l’opposition entre la personne bonne et la personne mauvaise sans l’expliquer
  alternative: Paraphraser en termes de nature humaine, d’actes ou de salut
  rationale: Le texte établit une correspondance entre l’intérieur et ce qui en sort, mais ne précise pas ici une doctrine de la nature humaine ou du salut. La traduction préserve cette tension.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le tour impersonnel « on » rend naturellement le sujet indéfini copte. La répétition de « tire » et de « mauvaise » est volontaire : elle maintient le parallélisme insistant et la progression du texte source.'
