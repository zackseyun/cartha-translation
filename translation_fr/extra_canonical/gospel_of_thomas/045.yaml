revisions:
- from: 'Jésus dit : « On ne cueille pas de raisins sur des épines, et l’on ne récolte pas non plus de figues sur des chardons[a], car ces plantes ne donnent pas de fruit. Une personne bonne tire une bonne chose de sa réserve[b]. Une personne mauvaise tire une chose mauvaise de sa réserve mauvaise, celle qui est dans son cœur[c], et elle dit des choses mauvaises. Car c’est du trop-plein du cœur qu’elle tire le mal. »'
  to: 'Jésus dit : « On ne cueille pas de raisins sur des épines, et l’on ne récolte pas non plus de figues sur des chardons[a], car ces plantes ne donnent pas de fruit. Une personne bonne tire une bonne chose de sa réserve[b]. Une personne mauvaise tire le mal de sa mauvaise réserve, qui est dans son cœur[c], et elle dit des choses mauvaises. Car c’est de l’abondance du cœur qu’elle tire le mal. »'
  rationale: La correction rétablit le rapport syntaxique attesté par le copte entre la réserve, sa qualification comme mauvaise et sa localisation dans le cœur. Elle conserve l’ambiguïté inhérente à l’expression sans imposer d’interprétation doctrinale. Les notes sont adaptées au nouveau rattachement.
