base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: fr
  text: 'Jésus dit : « Les anges et les prophètes viendront vers vous, et ils vous donneront ce qui vous appartient[a]. Et vous, à votre tour, donnez-leur ce qui est entre vos mains[b], et dites-vous : “Quel jour viendront-ils prendre ce qui est à eux ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses que vous avez ».'
    reason: Signaler la formulation possessive plus concrète du copte et préserver son autre traduction possible.
  - marker: b
    text: Le manuscrit emploie ici une forme pronominale régionale, de type lycopolitain, pour « vous » au pluriel.
    reason: Rendre compte de la particularité dialectale attestée dans cette expression sans alourdir le texte principal.
lexical_decisions:
- source_word: ⲛ̄ⲁⲅⲅⲉⲗⲟⲥ … ⲙⲛ̄ⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: Les anges et les prophètes
  rationale: Les articles pluriels du manuscrit désignent deux groupes au pluriel; la traduction suit ici le témoin manuscrit plutôt que la normalisation fournie, qui obscurcit ce nombre.
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: ce qui vous appartient
  rationale: La construction possessive signifie littéralement « les choses que vous avez ». Cette formulation française rend naturellement la possession et maintient le contraste avec « ce qui est à eux » à la fin.
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: à votre tour
  rationale: L’enclitique souligne la réciprocité de l’action accomplie par les destinataires.
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: ce qui est entre vos mains
  rationale: La locution évoque ce que quelqu’un tient ou a en sa possession. « Entre vos mains » conserve cette image en français courant et soutenu.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ϫⲟⲟⲥ ⲛⲏⲧⲛ̄
  choice: et dites-vous
  rationale: Le complément pronominal « à vous » renvoie aux destinataires eux-mêmes; le français idiomatique emploie donc le verbe pronominal.
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: ce qui est à eux
  rationale: Le possessif indépendant est rendu directement, sans préciser la nature de ce qui leur revient.
theological_decisions:
- issue: Nature de l’échange entre les destinataires, les anges et les prophètes
  choice: Maintenir les expressions possessives réciproques sans identifier les biens échangés
  alternative: Interpréter explicitement l’échange comme un retour de révélations, d’âmes ou de biens à leur origine
  rationale: Le texte oppose ce qui appartient aux destinataires à ce qui appartient aux anges et aux prophètes, mais ne nomme pas les objets concernés. La traduction préserve cette indétermination et la tension du propos.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des possessifs est conservée, car elle structure le contraste du logion. « Entre vos mains » maintient l’image concrète du copte; « dites-vous » exprime sans paraphrase le retour du discours sur les destinataires.
