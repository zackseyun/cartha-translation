base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: fr
  text: 'Jésus dit : « Le royaume du Père est comparable à un homme qui a de la bonne semence. Son ennemi vint pendant la nuit et sema une mauvaise herbe[a] sur la bonne semence. L’homme ne leur permit pas d’arracher la mauvaise herbe. Il leur dit : “De peur que vous ne disiez : ‘Nous allons arracher la mauvaise herbe’, et que vous n’arrachiez le blé avec elle. En effet, le jour de la moisson, les mauvaises herbes apparaîtront ; on les arrachera et on les brûlera[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme copte, emprunté au grec ζιζάνιον, peut désigner plus précisément l’ivraie. Il est d’abord au singulier (« une mauvaise herbe », puis « la mauvaise herbe »), avant de passer au pluriel à la fin du récit.
    reason: Précision lexicale et conservation du changement de nombre dans le texte source.
  - marker: b
    text: 'Littéralement : « ils les arrachent et ils les brûlent » ; le sujet est indéfini, tandis que les pronoms compléments sont au pluriel.'
    reason: La note rend compte de la construction active indéfinie du copte et de ses objets pluriels.
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: le royaume du Père
  rationale: Rend directement le syntagme copte et conserve la désignation théologique sans l’expliciter.
- source_word: ⲟⲩϭⲣⲟϭ ⲉⲛⲁⲛⲟⲩϥ
  choice: de la bonne semence
  rationale: Le nom peut désigner la semence ou la graine ; « semence » convient naturellement au contexte agricole et préserve le singulier collectif.
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: mauvaise herbe / mauvaises herbes
  rationale: Le mot emprunté au grec désigne probablement l’ivraie, mais « mauvaise herbe » est immédiatement compréhensible et permet de reproduire le passage du singulier au pluriel dans le copte.
- source_word: ⲕⲟⲟⲩ ⲉϩⲱⲗⲉ
  choice: ne leur permit pas d’arracher
  rationale: Avec l’infinitif, ⲕⲱ a ici le sens de laisser ou permettre ; le pronom pluriel est conservé.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: apparaîtront
  rationale: Expression signifiant devenir visible ou se manifester ; « apparaîtront » reste sobre et direct.
theological_decisions:
- issue: Identification de ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: mauvaise herbe / mauvaises herbes
  alternative: ivraie
  rationale: « Ivraie » est plus précis sur le plan botanique et traditionnel dans les parallèles synoptiques, mais le texte ne développe pas cette identification ; la formulation retenue reste accessible tout en signalant l’alternative en note.
- issue: Formulation de l’avertissement introduit par ϫⲉⲙⲏⲡⲱⲥ
  choice: 'Prenez garde : … vous pourriez…'
  alternative: De peur que vous n’alliez…
  rationale: Cette tournure française exprime clairement la mise en garde et le risque sans transformer celui-ci en certitude ni ajouter une interprétation théologique.
- issue: Agents des verbes finaux
  choice: on les arrachera et on les brûlera
  alternative: ils les arracheront et les brûleront
  rationale: Le copte emploie des verbes actifs à sujet indéfini avec des objets pluriels. Le pronom français « on » conserve cette indétermination sans identifier les agents.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le récit conserve ses reprises caractéristiques, le passage du singulier au pluriel pour la mauvaise herbe, ainsi que l’indétermination des agents à la fin. La syntaxe de l’avertissement est légèrement restructurée pour être naturelle en français sans résoudre davantage le sens.
