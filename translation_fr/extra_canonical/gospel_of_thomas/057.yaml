revisions:
- from: 'Jésus dit : « Le royaume du Père est comparable à un homme qui avait de la bonne semence. Son ennemi vint pendant la nuit et sema une mauvaise herbe[a] par-dessus la bonne semence. L’homme ne leur permit pas d’arracher la mauvaise herbe. Il leur dit : “Prenez garde : en allant arracher la mauvaise herbe, vous pourriez arracher le blé avec elle. En effet, le jour de la moisson, les mauvaises herbes apparaîtront ; on les arrachera et on les brûlera[b].” »'
  to: 'Jésus dit : « Le royaume du Père est comparable à un homme qui a de la bonne semence. Son ennemi vint pendant la nuit et sema une mauvaise herbe[a] sur la bonne semence. L’homme ne leur permit pas d’arracher la mauvaise herbe. Il leur dit : “De peur que vous ne disiez : ‘Nous allons arracher la mauvaise herbe’, et que vous n’arrachiez le blé avec elle. En effet, le jour de la moisson, les mauvaises herbes apparaîtront ; on les arrachera et on les brûlera[b].” »'
  rationale: La correction rétablit le contenu explicite du discours rapporté après « de peur que », y compris le futur de première personne du pluriel. Elle ajuste aussi « avait » en « a » et « par-dessus » en « sur » pour une correspondance plus immédiate avec le copte, sans modifier le sens ni les choix terminologiques établis.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'La trame narrative, le vocabulaire agricole, le passage du singulier au pluriel pour ⲍⲓⲍⲁⲛⲓⲟⲛ, et l’indétermination des agents finaux sont bien rendus. Toutefois, ϫⲉⲙⲏⲡⲱⲥ ⲛⲧⲉⲛⲧⲱⲧⲛⲃⲱⲕ ϫⲉⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϩⲱⲱⲗⲉ… introduit explicitement ce qu’« ils diraient » (« Nous allons arracher… »). La reformulation actuelle en avertissement général (« Prenez garde : en allant… ») supprime ce discours rapporté et le futur de première personne du pluriel.'
  naturalness: La révision proposée reste idiomatique en français international moderne. « De peur que vous ne disiez… et que vous n’arrachiez… » est une construction soutenue mais naturelle, adaptée au registre proverbial du passage. « Sur la bonne semence » est plus neutre et plus direct que « par-dessus la bonne semence ».
  terminology: « Royaume du Père », « bonne semence », « mauvaise herbe » et « blé » conviennent. La note sur l’« ivraie » préserve utilement la précision possible du grec ζιζάνιον sans imposer une identification botanique. Le pluriel final (« les mauvaises herbes ») reproduit le changement de nombre du copte.
  issues:
  - severity: medium
    issue: Le discours rapporté contenu dans l’avertissement est omis.
    rationale: 'Le copte comporte « de peur que vous n’alliez/dîtes : “nous allons arracher la mauvaise herbe” », suivi du risque d’arracher aussi le blé. « Prenez garde : en allant arracher… » transmet le risque, mais non la formulation explicite ni le futur pluriel du texte source.'
  - severity: low
    issue: Le présent de la relative initiale est remplacé par un imparfait.
    rationale: ⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ exprime « qui a ». Le présent français conserve plus directement l’énoncé source et reste tout à fait naturel dans une comparaison.
