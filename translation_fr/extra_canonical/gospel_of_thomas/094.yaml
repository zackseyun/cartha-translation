base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: fr
  text: 'Jésus a dit[a] : « Celui qui cherche trouvera ; celui qui frappe pour entrer[b], on lui ouvrira[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le manuscrit, le début de la formule « Jésus a dit » est partiellement restitué ; le texte normalisé lit ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: « Frappe pour entrer » traduit le verbe ⲧⲱϩⲙ avec l’indication de mouvement vers l’intérieur ⲉϩⲟⲩⲛ. Le texte ne mentionne pas de porte.
    reason: cultural_note
  - marker: c
    text: 'Littéralement, la tournure peut se comprendre : « ils ouvriront pour lui ». La troisième personne du pluriel a ici un sens indéfini et peut aussi être rendue passivement : « cela lui sera ouvert ». L’objet de l’ouverture n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus a dit
  rationale: ⲡⲉϫⲉ est la formule narrative habituelle pour introduire une parole, suivie ici du nom de Jésus. Le passé composé est naturel en français moderne tout en conservant la brièveté de l’incipit.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: Celui qui cherche trouvera
  rationale: La construction relative présente désigne de façon générale « celui qui cherche », et le futur ⲛⲁϭⲓⲛⲉ est rendu directement par « trouvera ». Cette formulation garde le caractère sentencieux du copte.
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: à celui qui frappe pour entrer
  rationale: ⲧⲱϩⲙ signifie « frapper » et ⲉϩⲟⲩⲛ indique un mouvement vers l’intérieur. « Pour entrer » exprime cette orientation sans ajouter une porte, absente du texte.
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: on ouvrira
  rationale: La troisième personne du pluriel indéfinie peut avoir une valeur impersonnelle ou passive. Le français « on ouvrira » conserve plus directement cette indétermination et n’ajoute aucun objet explicite.
theological_decisions:
- issue: Agent et objet de l’ouverture
  choice: on ouvrira
  alternative: cela lui sera ouvert / ils ouvriront pour lui
  rationale: Le copte emploie une troisième personne du pluriel à valeur indéfinie, sans nommer l’agent ni exprimer clairement l’objet. La traduction évite donc d’identifier une porte, un agent divin ou l’objet ouvert.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme et la concision proverbiale de l’énoncé. « On ouvrira » est idiomatique et préserve l’indétermination grammaticale du copte ; les notes signalent la restitution manuscrite ainsi que les ambiguïtés de direction, d’agent et d’objet.
