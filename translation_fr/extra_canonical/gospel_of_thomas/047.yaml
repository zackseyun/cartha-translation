  to: 'Jésus dit : « Personne ne peut monter deux chevaux ni bander deux arcs. Et un serviteur ne peut servir deux maîtres : sinon, il honorera l’un et outragera l’autre. Personne ne boit du vin vieux pour désirer aussitôt boire du vin nouveau. On ne verse pas non plus du vin nouveau dans de vieilles outres, de peur qu’elles n’éclatent. Et on ne verse pas de vin vieux dans une outre neuve, de peur qu’il ne l’abîme.[a] On ne coud pas une vieille pièce sur un vêtement de fête,[b] car une déchirure se produirait. »'
