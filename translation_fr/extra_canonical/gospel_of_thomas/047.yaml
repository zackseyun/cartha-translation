base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: fr
  text: 'Jésus dit : « Personne ne peut monter deux chevaux ni bander deux arcs. Et un serviteur ne peut servir deux maîtres : sinon, il honorera l’un et outragera l’autre. Personne ne boit du vin vieux pour désirer aussitôt boire du vin nouveau. On ne verse pas non plus du vin nouveau dans de vieilles outres, de peur qu’elles n’éclatent. Et on ne verse pas de vin vieux dans une outre neuve, de peur qu’il ne l’abîme.[a] On ne coud pas une vieille pièce sur un vêtement de fête,[b] car une déchirure se produirait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte distingue le pluriel dans « de peur qu’elles n’éclatent », qui renvoie aux vieilles outres, et le singulier dans « de peur qu’il ne l’abîme », qui renvoie vraisemblablement au vin vieux abîmant l’outre neuve.
    reason: Clarifier les référents grammaticaux du copte et une légère ambiguïté française.
  - marker: b
    text: 'Littéralement : « un vêtement de fête ». Le texte porte une vieille pièce cousue sur ce vêtement, formulation différente de celle des parallèles synoptiques sur une pièce neuve et un vieux vêtement.'
    reason: Préserver l’expression copte et signaler sans harmonisation la différence avec les parallèles.
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉ-
  choice: ne peut
  rationale: La tournure signifie littéralement qu’il n’y a pas de capacité pour faire quelque chose. « Ne peut » est naturel en français et conserve ici l’idée d’impossibilité pratique.
- source_word: ϫⲱⲗⲕ (avec ⲡⲓⲧⲉ)
  choice: bander
  rationale: Avec « arc », le verbe désigne l’action de le tendre; « bander un arc » est l’expression française précise.
- source_word: ⲣⲧⲓⲙⲁ
  choice: honorer
  rationale: Cet emprunt au grec τιμάω exprime le fait d’accorder honneur ou estime.
- source_word: ⲣϩⲩⲃⲣⲓⲍⲉ
  choice: outrager
  rationale: L’emprunt grec ὑβρίζειν est plus fort que « mépriser » et peut signifier traiter avec insolence ou outrage.
- source_word: ⲁⲥⲕⲟⲥ
  choice: outre
  rationale: Emprunt au grec ἀσκός, il désigne un récipient en peau destiné notamment au vin.
- source_word: ⲧⲁⲕⲟ
  choice: abîmer
  rationale: Le verbe peut signifier détruire, gâter ou ruiner. « Abîmer » convient à l’effet du vin vieux sur l’outre neuve sans préciser au-delà du texte le mécanisme exact.
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: vêtement de fête
  rationale: Rend littéralement l’expression « vêtement de fête » au lieu de l’harmoniser avec le « vêtement neuf » des parallèles synoptiques.
- source_word: ⲡⲱϩ
  choice: éclater / déchirure
  rationale: Le champ sémantique couvre le fait de se rompre ou de se déchirer; le français demande des termes différents pour les outres et le vêtement.
theological_decisions:
- issue: Harmonisation avec les paraboles synoptiques
  choice: Conserver le vin vieux versé dans une outre neuve et la vieille pièce cousue sur un vêtement de fête.
  alternative: Remplacer ces formulations par le vin nouveau dans des outres neuves et une pièce neuve sur un vieux vêtement.
  rationale: Les formulations propres au témoin copte doivent être traduites telles quelles; les corriger selon Matthieu, Marc ou Luc effacerait les inversions ou développements attestés dans Thomas.
- issue: Interprétation symbolique des deux maîtres, des vins et des vêtements
  choice: Ne pas identifier explicitement les éléments à des doctrines, alliances ou mondes particuliers.
  alternative: Développer dans le texte une lecture théologique déterminée de l’ancien et du nouveau.
  rationale: Le logion juxtapose des images sans en donner l’interprétation. La traduction préserve cette tension et cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. Les parallélismes sont maintenus, avec une syntaxe assez naturelle pour la lecture publique. « Serviteur », « maîtres », « outres » et « vêtement de fête » conservent la couleur historique sans archaïsme excessif.
