base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: fr
  text: 'Jésus dit : « Aime ton frère comme[d] ton âme[a] ; protège-le[b] comme la pupille de ton œil[c][e]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot ⲯⲩⲭⲏ, emprunté au grec ψυχή, peut aussi signifier « vie » ou « personne elle-même ».
    reason: lexical_alternative
  - marker: b
    text: Le manuscrit porte ⲙ̄ⲙⲟϥ, qui marque « le » comme objet direct, tandis que le texte normalisé a ⲛⲛⲧⲟϥ, « pour lui ». Dans les deux cas, il s’agit de le garder ou de le protéger.
    reason: textual_variant
  - marker: c
    text: « La pupille de ton œil » traduit littéralement le copte ; l’expression traditionnelle « la prunelle de tes yeux » en rendrait l’image de manière plus idiomatique.
    reason: lexical_alternative
  - marker: d
    text: La comparaison est écrite ⲛ̄ⲑⲉ dans le manuscrit et normalisée sous la forme ⲛⲡϩⲉ ; dans cet usage sahidique ou lycopolitain, les deux signifient « comme » ou « de même que ».
    reason: dialect_note
  - marker: e
    text: Comparer le motif biblique de la pupille de l’œil en Deutéronome 32.10 ; Psaume 17.8 ; Proverbes 7.2 dans la Septante.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus dit
  rationale: La formule narrative copte ⲡⲉϫⲉ suivie du nom du sujet appelle une introduction brève. Le présent de narration est naturel en français.
- source_word: ⲙⲉ
  choice: aime
  rationale: Avec une personne pour objet, le verbe exprime ici l’amour plutôt que le désir.
- source_word: ⲥⲟⲛ
  choice: frère
  rationale: Le sens premier est « frère » ; ce choix conserve le langage fraternel du texte sans l’élargir à « prochain ».
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: comme
  rationale: Les deux formes fonctionnent comme particule comparative ; « comme » convient aux deux parallèles du logion.
- source_word: ⲯⲩⲭⲏ
  choice: âme
  rationale: Cet emprunt au grec ψυχή peut désigner l’âme, la vie ou la personne elle-même. « Âme » préserve la formulation distinctive sans exclure les autres nuances, signalées en note.
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: protège-le
  rationale: La construction périphrastique exprime l’action de garder ou de protéger. « Protège-le » est naturel en français avec une personne et convient aussi bien aux deux formes syntaxiques attestées.
- source_word: ⲡⲉⲗⲟⲩ
  choice: pupille
  rationale: Le mot désigne littéralement la pupille de l’œil. Cette traduction évite d’importer une expression idiomatique absente du copte.
- source_word: ⲃⲁⲗ
  choice: œil
  rationale: Il s’agit du terme anatomique courant pour l’œil.
theological_decisions:
- issue: Portée de ⲯⲩⲭⲏ
  choice: âme
  alternative: vie ; personne elle-même
  rationale: Le texte permet plusieurs nuances anthropologiques. Le corps de la traduction retient le correspondant formel traditionnel, tandis que la note maintient explicitement l’ambiguïté lexicale.
- issue: Identité du « frère »
  choice: frère
  alternative: proche ; prochain ; compagnon
  rationale: Le texte ne précise pas s’il s’agit d’un frère biologique ou communautaire. Garder « frère » préserve cette ouverture au lieu de la résoudre.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif reste direct et mémorable. « Protège-le » est plus naturel aujourd’hui que « garde-le » lorsqu’il s’agit d’une personne, tandis que « pupille de ton œil » conserve précisément l’image anatomique du copte.
