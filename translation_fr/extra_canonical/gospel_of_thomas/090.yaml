base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: fr
  text: 'Jésus dit : « Venez à moi, car mon joug est bon[a], ma seigneurie est douce[b], et vous trouverez du repos pour vous-mêmes[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte ⲭⲣⲏⲥⲧⲟⲥ vient du grec χρηστός (« bon, agréable, bienfaisant »), et non de χριστός (« oint, Christ »). Il s’agit donc ici d’une qualité du joug, non d’un titre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « ma seigneurie est douce ». Comparer Matthieu 11.28-30, dont la formulation est différente : Thomas parle de la seigneurie de Jésus plutôt que d’un fardeau léger.'
    reason: cross_reference
  - marker: c
    text: « Repos » traduit l’emprunt grec ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις). Le manuscrit présente une petite irrégularité orthographique autour de la lettre upsilon, mais la lecture du mot est sûre. Thomas dit « pour vous-mêmes », non « pour vos âmes » comme en Matthieu 11.29.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: Venez à moi
  rationale: L’impératif est à la deuxième personne du pluriel, explicitement rendu par « venez » ; ϣⲁⲁⲛⲟⲕ indique le but du mouvement, « à moi ».
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: bon
  rationale: Le mot, emprunté au grec χρηστός, exprime ce qui est bon, agréable ou bienfaisant. « Bon » conserve son sens central sans l’assimiler au titre « Christ » ni imposer la formulation « facile » de Matthieu.
- source_word: ⲛⲁϩⲃ
  choice: joug
  rationale: Équivalent français direct du terme agricole et métaphorique.
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: seigneurie
  rationale: Ce nom abstrait dérivé de « seigneur/maître » désigne la condition ou l’exercice de l’autorité d’un seigneur. « Seigneurie » préserve cette nuance mieux que « domination » ou « pouvoir ».
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: douce
  rationale: Le terme qualifie la seigneurie comme douce, clémente ou non rude. « Douce » est naturel en français et conserve l’image d’une autorité sans dureté.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: vous trouverez
  rationale: Construction au futur avec sujet de deuxième personne du pluriel et verbe « trouver ».
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: repos
  rationale: L’emprunt grec ἀνάπαυσις signifie « repos » ou « répit » ; « repos » est l’équivalent français le plus transparent.
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: pour vous-mêmes
  rationale: Le datif d’avantage avec le pronom pluriel est rendu explicitement afin de préserver la nuance réflexive du texte.
theological_decisions:
- issue: Rapport avec Matthieu 11.28-30
  choice: 'Conserver la formulation propre à Thomas : « ma seigneurie est douce » et « pour vous-mêmes ».'
  alternative: 'Harmoniser avec Matthieu : « mon fardeau est léger » et « du repos pour vos âmes ».'
  rationale: Le texte copte porte bien « ma seigneurie » et ne mentionne ni un fardeau ni les âmes. Une harmonisation effacerait une différence textuelle et théologique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme de la parole. « Seigneurie » est légèrement soutenu mais précis et intelligible dans ce contexte ; il évite d’aplatir ⲙⲛⲧϫⲟⲉⲓⲥ en simple « pouvoir ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
