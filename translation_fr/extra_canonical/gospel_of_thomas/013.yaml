base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: fr
  text: '**Évangile selon Thomas — Parole 13**


    Jésus dit à ses disciples : « Comparez-moi et dites-moi à qui je ressemble. »


    Simon Pierre lui dit : « Tu ressembles à un ange juste. »


    Matthieu lui dit : « Tu ressembles à un être humain : un philosophe, un homme doué d’intelligence.[a] »


    Thomas lui dit : « Maître, ma bouche ne pourra absolument pas dire à qui tu ressembles. »


    Jésus dit : « Je ne suis pas ton maître, car tu as bu et tu t’es enivré à la source bouillonnante[b] que moi-même j’ai mesurée.[c] »


    Puis il le prit, se retira et lui dit trois paroles.


    Lorsque Thomas vint auprès de ses compagnons, ceux-ci lui demandèrent : « Que t’a dit Jésus ? »


    Thomas leur dit : « Si je vous rapporte une seule des paroles qu’il m’a dites, vous ramasserez des pierres et vous les lancerez contre moi ; un feu sortira des pierres et vous consumera.[d] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la formulation associe « un homme », « un philosophe » et « un homme de cœur ou d’esprit ». On pourrait aussi traduire plus librement : « un philosophe plein de sagesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le terme copte est expressif et probablement onomatopéique. On peut aussi comprendre : « la source jaillissante » ou « la source murmurante ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « que moi-même j’ai mesurée ». Le verbe peut, dans cette image de boisson, suggérer une quantité mesurée ou distribuée, mais la formulation reste volontairement étrange.'
    reason: lexical_alternative
  - marker: d
    text: 'Le texte énonce deux actions distinctes : ils ramasseront des pierres, puis les lanceront contre Thomas. Le feu qui en sort ensuite renverse de manière saisissante la scène de lapidation.'
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: Comparez-moi
  rationale: Le verbe ⲧⲟⲛⲧ exprime ici l’établissement d’une comparaison. « Comparez-moi » conserve l’impératif et la concision du copte.
- source_word: ⲉⲓⲛⲉ
  choice: ressembler à
  rationale: Dans la construction avec « à qui », le verbe signifie « être semblable à, ressembler à », et non simplement « être ».
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: un ange juste
  rationale: Dans ce contexte, le terme d’origine grecque désigne vraisemblablement un être céleste. « Juste » garde la portée morale et religieuse de ⲇⲓⲕⲁⲓⲟⲥ.
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: 'un être humain : un philosophe, un homme doué d’intelligence'
  rationale: 'La formulation appositive garde les trois éléments du copte : l’humanité, le philosophe et l’homme de cœur ou d’esprit, idiome exprimant l’intelligence ou le discernement.'
- source_word: ⲡⲥⲁϩ
  choice: Maître / maître
  rationale: « Maître » est naturel en français comme titre adressé à un enseignant et permet de conserver la reprise paradoxale dans la réponse de Jésus.
- source_word: ϩⲟⲗⲱⲥ … ⲁⲛ
  choice: absolument pas
  rationale: L’adverbe renforce la négation. Cette tournure rend clairement l’intensité de l’expression copte.
- source_word: ⲡⲡⲏⲅⲏ ⲉⲧⲉⲣⲉⲃⲣⲃⲣ
  choice: la source bouillonnante
  rationale: ⲃⲣⲃⲣ est un terme expressif et probablement onomatopéique évoquant le mouvement ou le bruit de l’eau.
- source_word: ⲁⲛⲟⲕ ⲛⲧⲁⲉⲓϣⲓⲧⲥ
  choice: que moi-même j’ai mesurée
  rationale: Le pronom indépendant ⲁⲛⲟⲕ porte une emphase rendue par « moi-même ». Le sens premier de ϣⲓ, « mesurer », est maintenu sans expliquer la métaphore.
- source_word: ⲛϣⲟⲙⲧ ⲛϣⲁϫⲉ
  choice: trois paroles
  rationale: ϣⲁϫⲉ peut désigner des mots, des propos ou des paroles. « Trois paroles » conserve la brièveté et laisse indéterminé leur contenu.
- source_word: ⲧⲉⲧⲛⲁϥⲓⲱⲛⲉ ⲛⲧⲉⲧⲛⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: vous ramasserez des pierres et vous les lancerez contre moi
  rationale: 'La traduction distingue les deux actions explicitement exprimées dans le copte : prendre ou ramasser les pierres, puis les lancer contre Thomas.'
theological_decisions:
- issue: La déclaration « Je ne suis pas ton maître »
  choice: Conserver littéralement la négation paradoxale
  alternative: L’expliquer comme une promotion spirituelle de Thomas ou comme un rejet de la fonction enseignante
  rationale: Le texte juxtapose cette négation à l’image de Thomas enivré à la source de Jésus, sans en expliciter la portée théologique. La traduction ne tranche donc pas le paradoxe.
- issue: Les trois paroles secrètes adressées à Thomas
  choice: Ne pas reconstituer ni caractériser leur contenu
  alternative: Les identifier à une révélation doctrinale particulière
  rationale: Le manuscrit ne rapporte pas ces paroles. Leur contenu et la raison précise de la réaction annoncée demeurent volontairement indéterminés.
- issue: Le feu sortant des pierres
  choice: Conserver l’image comme une conséquence annoncée, sans l’allégoriser
  alternative: Interpréter le feu comme jugement divin, illumination ou symbole initiatique
  rationale: Le récit présente une inversion saisissante de la lapidation, mais ne donne pas d’interprétation explicite du feu.
translation_notes:
  register: Français international moderne, digne et accessible. Les dialogues restent sobres et directs. Les images inhabituelles — la bouche incapable de parler, l’ivresse à la source mesurée et le feu sortant des pierres — sont conservées sans harmonisation doctrinale. « Être humain » évite de réduire ⲣⲱⲙⲉ au seul sexe masculin, tandis que « un homme doué d’intelligence » maintient l’idiome anthropologique du second membre.
