base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: fr
  text: 'Simon Pierre leur dit : « Que Marie sorte d’entre nous, car la femme n’est pas digne de la vie[a]. » Jésus dit : « Voici, moi, je la conduirai[b], afin que je la fasse mâle, afin qu’elle devienne, elle aussi, un esprit vivant semblable à vous, les mâles[c]. Car toute femme qui se fera mâle entrera dans le royaume des cieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte emploie le même terme, ⲥϩⲓⲙⲉ, dans « la femme » puis dans « toute femme ». « Femme » est plus naturel pour une personne en français que « femelle » ; « mâle » est néanmoins conservé dans l’opposition avec ϩⲟⲟⲩⲧ.
    reason: lexical_alternative
  - marker: b
    text: Le verbe copte peut signifier « conduire », « mener » ou « tirer ». Le contexte ne précise pas la manière dont Jésus la conduit.
    reason: lexical_alternative
  - marker: c
    text: Le copte oppose ici « femme » (ⲥϩⲓⲙⲉ) à « mâle » (ϩⲟⲟⲩⲧ). « Mâle » conserve la rudesse et l’étrangeté de cette opposition ; « homme » introduirait une nuance d’humanité adulte qui n’est pas nécessairement exprimée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ ϩⲛ/ⲛϩⲏⲧⲛ
  choice: Que Marie sorte de parmi nous
  rationale: Le préfixe volitif ⲙⲁⲣⲉ- appelle une tournure jussive, tandis que ⲉⲓ ⲉⲃⲟⲗ avec l’expression « parmi nous » signifie sortir ou quitter le groupe. La formulation française conserve explicitement le mouvement vers l’extérieur.
- source_word: ⲥϩⲓⲟⲙⲉ / ⲥϩⲓⲙⲉ
  choice: les femmes / toute femme
  rationale: ⲥϩⲓⲙⲉ est le terme courant pour « femme ». « Femelle » maintiendrait plus mécaniquement la polarité avec « mâle », mais appliqué à une personne il prend en français moderne une coloration zoologique ou injurieuse absente du lexème lui-même.
- source_word: ⲙⲡϣⲁ ⲁⲛ ⲛⲡⲱⲛϩ
  choice: ne sont pas dignes de la vie
  rationale: La construction négative exprime directement l’absence de dignité ou de mérite; « la vie » garde ouverte la portée existentielle, spirituelle ou salvifique du terme.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Voici
  rationale: Cette particule déictique attire brusquement l’attention. « Voici » reste naturel et digne tout en évitant l’archaïsme de « voici que » ou « behold ».
- source_word: ⲥⲱⲕ
  choice: conduirai
  rationale: Le verbe peut signifier conduire, mener ou tirer. « Conduire » préserve l’image d’un mouvement guidé sans préciser indûment sa nature.
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: faire mâle / se faire mâle
  rationale: La construction signifie littéralement « faire mâle ». Cette expression volontairement étrange conserve la tension sexuelle et symbolique du texte au lieu de l’expliquer comme une simple transformation morale.
- source_word: ⲟⲩⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: un esprit vivant
  rationale: Le nom emprunté au grec πνεῦμα est ici un nom commun; la minuscule évite d’en faire un titre ou une référence explicite à l’Esprit saint.
- source_word: ⲧⲙⲛⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: le royaume des cieux
  rationale: Le manuscrit porte une expression plurielle correspondant naturellement à la formule française traditionnelle « royaume des cieux », sans réduire celle-ci à un lieu strictement spatial.
theological_decisions:
- issue: Nature de la transformation de Marie en « mâle »
  choice: Conserver littéralement « la faire mâle » sans interprétation ajoutée
  alternative: Paraphraser comme une transformation spirituelle, une intégration au groupe ou un dépassement du sexe
  rationale: Le texte associe explicitement la transformation, l’esprit vivant et l’entrée dans le royaume, mais n’explique pas leur rapport. Une paraphrase résoudrait une ambiguïté théologique et anthropologique que le disant laisse ouverte.
- issue: Portée du mot « vie »
  choice: Traduire simplement par « la vie »
  alternative: Préciser « la vie éternelle » ou « le salut »
  rationale: Le copte ne contient aucun qualificatif équivalent à « éternelle » et ne nomme pas explicitement le salut. La traduction ne doit donc pas imposer cette identification.
translation_notes:
  register: Français international moderne, sobre et digne. Les paroles sont rendues sans atténuer leur caractère choquant ni ajouter une explication doctrinale. « Femme » évite la connotation zoologique de « femelle », tandis que « mâle » maintient l’asymétrie et l’étrangeté réelles de la formulation copte. La répétition emphatique de la première personne est conservée par « Voici, moi, je… ».
