base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: fr
  text: Celui qui ne déteste pas son père et sa mère comme moi[a] ne peut pas devenir mon disciple ; et celui qui n’aime pas son père et sa mère comme moi ne peut pas devenir mon disciple. Car ma mère […][b], mais ma véritable [mère][c] m’a donné la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ma manière » ou « comme moi » (ⲛ̄ⲧⲁϩⲉ).'
    reason: Préciser l’éventail de sens de la comparaison copte.
  - marker: b
    text: Le manuscrit est endommagé ici. On propose parfois de restituer une idée telle que « m’a enfanté pour la mort » ou « m’a donné le mensonge », mais le texte conservé ne permet pas de trancher.
    reason: Signaler une lacune textuelle importante sans adopter une reconstruction conjecturale.
  - marker: c
    text: Le mot « mère » n’est pas entièrement conservé à cet endroit, mais il est assuré par le contexte et les traces du manuscrit. « Véritable » traduit littéralement « de vérité » (ⲙ̄ⲙⲉ).
    reason: Distinguer la restitution matérielle du manuscrit et expliquer l’expression copte.
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  choice: déteste
  rationale: Rend directement le verbe copte courant « haïr, détester », sans atténuer la tension du propos.
- source_word: ⲙⲣ̄ⲣⲉ
  choice: aime
  rationale: Rend le verbe copte « aimer » et conserve le contraste paradoxal avec « déteste ».
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: comme moi
  rationale: L’expression signifie littéralement « à ma manière » ou « comme moi ». La formulation française préserve l’ambiguïté entre l’exemple donné par Jésus et une comparaison plus générale.
- source_word: ϣ … ⲁⲛ
  choice: ne peut pas
  rationale: L’auxiliaire de capacité sous négation exprime l’impossibilité.
- source_word: ⲙ̄ⲙⲉ
  choice: véritable
  rationale: Littéralement « de vérité » ; « véritable » fonctionne naturellement comme qualificatif de « mère ».
- source_word: ⲱⲛϩ
  choice: la vie
  rationale: Équivalent français direct du nom copte « vie ».
theological_decisions:
- issue: Identité de la « véritable mère »
  choice: Ne pas identifier cette mère et conserver l’expression du manuscrit.
  alternative: L’identifier explicitement à l’Esprit saint, à la Sagesse ou à une autre réalité divine.
  rationale: Le texte ne fournit aucune identification explicite ; en ajouter une imposerait une interprétation théologique particulière.
- issue: Contraste entre détester et aimer ses parents
  choice: Conserver les deux verbes dans leur force et leur tension paradoxale.
  alternative: Atténuer « détester » en « aimer moins » ou harmoniser les deux propositions.
  rationale: Le copte oppose explicitement « détester » et « aimer ». La traduction ne doit pas résoudre cette tension.
- issue: Contenu de la lacune après « ma mère »
  choice: Laisser la lacune ouverte.
  alternative: Reconstruire une formule telle que « m’a enfanté pour la mort » ou « m’a donné le mensonge ».
  rationale: Le manuscrit est matériellement lacunaire et les reconstructions proposées restent incertaines.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle du copte est maintenue. « Déteste » est préféré à « hait » pour une lecture courante, tout en gardant la force du terme source. Les crochets signalent soit la lacune, soit une restitution éditoriale.
