base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: fr
  text: 'Jésus a dit : « Heureux est ce lion que l’être humain mangera, de sorte que le lion devienne un être humain. Et maudit est cet être humain que le lion mangera, et le lion deviendra un être humain[a]. »


    [a] Le sens symbolique de cette parole énigmatique demeure ouvert ; la traduction n’en impose aucune interprétation particulière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens symbolique de cette parole énigmatique demeure ouvert ; la traduction n’en impose aucune interprétation particulière.
    reason: ambiguïté interprétative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: heureux
  rationale: Le mot, emprunté au grec μακάριος, reprend la formule traditionnelle des béatitudes. En français biblique moderne, « heureux » est plus naturel que « béni » tout en conservant cette résonance.
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: lion
  rationale: Sens lexical direct ; les deux graphies ne modifient pas le sens.
- source_word: ⲡⲁⲓ
  choice: ce
  rationale: Conserve la valeur démonstrative et l’insistance déictique du copte.
- source_word: ⲡⲣⲱⲙⲉ
  choice: l’être humain / cet être humain
  rationale: Rend le terme générique sans introduire une limitation masculine absente du copte.
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: mangera
  rationale: Le préfixe ⲛⲁ- marque ici le futur ; le pronom objet renvoie dans chaque proposition à l’antécédent de la relative.
- source_word: ϣⲱⲡⲉ ⲛ/ⲣ ⲣⲱⲙⲉ
  choice: devenir humain
  rationale: Préserve la prédication résultative et le parallélisme frappant de la parole.
- source_word: ⲃⲱⲧⲉ
  choice: maudit
  rationale: Exprime le pôle négatif opposé à ⲙⲁⲕⲁⲣⲓⲟⲥ. Le terme copte peut également évoquer ce qui est odieux ou abominable ; « maudit » restitue ici avec concision la force antithétique.
- source_word: ⲛϭⲓ
  choice: non rendu séparément
  rationale: La particule de mise en relief est reflétée par la structure française « cet être humain », sans ajout artificiel.
theological_decisions:
- issue: Interprétation symbolique du lion, de l’être humain et de l’acte de manger
  choice: laisser l’image sans explication doctrinale dans le corps du texte
  alternative: identifier le lion à une réalité précise et expliquer sa transformation
  rationale: La parole est volontairement énigmatique et le texte ne fournit pas lui-même la clé de ses symboles. La note signale cette ouverture sans la résoudre.
- issue: Rapport syntaxique de la première transformation du lion
  choice: « de sorte que le lion devienne humain »
  alternative: « et que le lion devienne humain »
  rationale: Le premier verbe est au conjunctif et se rattache étroitement à l’action précédente, contrairement au second, qui est un futur indépendant. « De sorte que » rend cette conséquence sans effacer la différence de construction.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure antithétique « Heureux est… Mais maudit est… » conserve le caractère sentencieux et le parallélisme du copte. « L’être humain » évite de donner à ⲣⲱⲙⲉ un sens exclusivement masculin. La différence entre le conjunctif de la première transformation et le futur indépendant de la seconde est maintenue.
