  to: 'Une femme[c] lui dit au milieu de la foule : « Heureux le ventre qui t’a porté, et les seins qui t’ont allaité[a] ! » Il lui dit : « Heureux ceux qui ont entendu la parole du Père et qui l’ont gardée dans la vérité[b] ! Car des jours viendront où vous direz : “Heureux le ventre qui n’a pas conçu[e], et les seins qui n’ont pas donné de lait !”[d] »'
