base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: fr
  text: 'Une femme[c] lui dit au milieu de la foule : « Heureux le ventre qui t’a porté, et les seins qui t’ont allaité[a] ! » Il lui dit : « Heureux ceux qui ont entendu la parole du Père et qui l’ont gardée dans la vérité[b] ! Car des jours viendront où vous direz : “Heureux le ventre qui n’a pas conçu[e], et les seins qui n’ont pas donné de lait !”[d] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le copte dit littéralement « tes seins », tournure possessive désignant les seins dont il a reçu le lait ; le français traduit ici selon le sens : « les seins qui t’ont allaité ».'
    reason: dialect_note
  - marker: b
    text: « L’ont gardée dans la vérité » peut aussi se traduire par « l’ont préservée », « l’ont observée » ou « l’ont vraiment gardée ».
    reason: lexical_alternative
  - marker: c
    text: Quelques lettres du manuscrit sont restaurées par l’éditeur, notamment dans les mots traduits par « femme », « ventre », « seins » et « allaité » ; ces restaurations ne changent pas le sens général.
    reason: lacuna_or_restoration
  - marker: d
    text: Comparer Luc 11.27–28, pour la réponse à la bénédiction prononcée par une femme, et Luc 23.29, pour le ventre qui n’a pas enfanté et les seins qui n’ont pas allaité.
    reason: cross_reference
  - marker: e
    text: Le verbe copte désigne ici le fait de devenir enceinte ou de concevoir ; certains rendent plus largement la formule par « qui n’a pas porté d’enfant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ
  choice: une femme
  rationale: L’article indéfini ⲟⲩ- présente une femme non identifiée parmi la foule.
- source_word: ⲙⲏⲏϣⲉ
  choice: foule
  rationale: Rend naturellement le sens de « foule, multitude, assemblée » dans cette scène publique.
- source_word: ⲡϩⲏ
  choice: le ventre
  rationale: Dans le contexte de la maternité, le terme désigne le ventre maternel; « ventre » est naturel en français et évite l’ambiguïté de « sein » avec les seins qui allaitent.
- source_word: ϥⲓ ϩⲁ
  choice: a porté
  rationale: La construction exprime ici le fait de porter ou d’enfanter quelqu’un; « t’a porté » convient au ventre comme sujet sans effacer l’image corporelle.
- source_word: ⲓⲃⲉ
  choice: les seins
  rationale: Le pluriel concret correspond au contexte de l’allaitement.
- source_word: ⲥⲁⲛⲟⲩϣ
  choice: ont allaité
  rationale: Rend le verbe « allaiter, nourrir au sein » dans un français courant.
- source_word: ⲉⲓⲁⲧ
  choice: heureux
  rationale: Formule française traditionnelle et intelligible des béatitudes, qui conserve le ton solennel.
- source_word: ⲥⲱⲧⲙ
  choice: ont entendu
  rationale: Le parfait relatif indique une action accomplie; « ont entendu » en respecte la valeur.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: la parole
  rationale: Le terme emprunté au grec λόγος désigne ici la parole ou le message; « parole » conserve sa résonance sans l’expliciter.
- source_word: ⲡⲉⲓⲱⲧ
  choice: le Père
  rationale: Conserve le titre défini du texte sans ajouter « Dieu ».
- source_word: ϩⲁⲣⲉϩ ⲉⲛⲧⲟϥ
  choice: l’ont gardée
  rationale: Le verbe peut signifier garder, préserver ou observer; « garder la parole » maintient cette amplitude.
- source_word: ϩⲛ ⲟⲩⲙⲉ
  choice: dans la vérité
  rationale: Rend la locution prépositionnelle de façon formelle et préserve la possibilité d’une sphère de vérité plutôt que de la réduire à l’adverbe « vraiment ».
- source_word: ⲙⲡⲥⲱ
  choice: n’a pas conçu
  rationale: La forme négative du verbe ⲱ renvoie au fait de devenir enceinte ou de concevoir, distinct du verbe employé plus haut pour porter.
- source_word: ϯⲉⲣⲱⲧⲉ
  choice: donner de lait
  rationale: Expression directe correspondant à l’absence de lactation ou d’allaitement.
theological_decisions:
- issue: Rapport entre la maternité de Jésus et l’écoute de la parole
  choice: Ajout de « plutôt » pour rendre la réorientation implicite de la réponse
  alternative: 'Enchaîner deux béatitudes sans connecteur : « Heureux ceux… »'
  rationale: La réponse déplace la béatitude de la parenté physique vers ceux qui entendent et gardent la parole. « Plutôt » exprime ce contraste discursif sans nier explicitement la première bénédiction.
- issue: Sens de « garder dans la vérité »
  choice: Conserver « gardée dans la vérité »
  alternative: « l’ont vraiment gardée » ou « l’ont gardée fidèlement »
  rationale: La formulation retenue ne tranche pas entre une manière véritable de garder la parole et le fait de demeurer dans la vérité.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les images corporelles et la structure en béatitudes sont conservées. Le vocabulaire reste accessible, tandis que « la parole du Père » et « dans la vérité » maintiennent la tonalité propre au texte sans harmonisation confessionnelle.
