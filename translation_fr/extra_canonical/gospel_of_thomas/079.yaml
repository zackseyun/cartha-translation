  verdict: revise
  source_fidelity: 'Le texte rend avec précision la structure du copte : la femme, la foule, le ventre qui a porté, les seins associés à l’allaitement, l’écoute de la parole du Père, sa garde « dans la vérité », puis l’annonce de jours futurs et les images inversées du ventre non concevant et des seins sans lait. « Ventre » et « a conçu » respectent utilement la distinction lexicale entre le premier verbe (« porter/mettre au monde ») et ⲱ (« concevoir/devenir enceinte »). En revanche, le copte n’a pas d’équivalent explicite de « plutôt » dans la réponse de Jésus. Ce mot impose un contraste exclusif ou comparatif qui relève d’une harmonisation interprétative avec des parallèles évangéliques plutôt que de la formulation conservée dans Thomas.'
