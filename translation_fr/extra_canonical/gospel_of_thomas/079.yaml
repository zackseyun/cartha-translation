  terminology: « Heureux », « la parole du Père », « gardée dans la vérité », « ventre » et « seins » conviennent au registre et ne surdéterminent pas le sens. Il convient seulement de supprimer « plutôt », afin de ne pas transformer la seconde béatitude en correction explicite de la première.
