base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: fr
  text: 'Jésus dit : « Quand vous ferez advenir cela en vous[a], ceci — ce que vous avez — vous sauvera[b]. Sinon[c], la pauvreté est en vous[d]. Ceci — ce que vous n’avez pas en vous, à l’intérieur[e] — vous tuera[f]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tournure copte signifie plus littéralement « faire venir cela à l’existence en vous ». Son objet demeure implicite ; on peut aussi la rendre par « faire surgir » ou « produire » cela en vous.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se rendre par « délivrer » ou « secourir » ; son opposition à « tuer » favorise ici « sauver ».
    reason: lexical_alternative
  - marker: c
    text: 'La particule copte est comprise ici au sens disjonctif : « sinon » ou « autrement ». On l’interprète parfois comme « plutôt ».'
    reason: alternative_reading
  - marker: d
    text: Le texte porte littéralement « pauvreté ». Ce terme abrupt est conservé plutôt que remplacé par « manque ».
    reason: cultural_note
  - marker: e
    text: L’expression signifie « à l’intérieur » ou « intérieurement » et redouble l’accent mis sur ce qui est en la personne.
    reason: lexical_alternative
  - marker: f
    text: À cet endroit, le manuscrit est partiellement endommagé. La restitution du verbe copte signifiant « tuera » est néanmoins sûre quant au sens.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ
  choice: vous ferez advenir ce qui est
  rationale: La tournure périphrastique exprime le fait de causer la venue à l’existence. « Faire advenir » en conserve la nuance causative sans définir le référent implicite.
- source_word: ϩⲛⲛⲧⲱⲧⲛ
  choice: en vous
  rationale: Dans ce contexte, la préposition et le pronom pluriel désignent l’intériorité. Le français « en vous » est naturel et conserve cette orientation intérieure.
- source_word: ⲡⲁⲓ
  choice: ceci
  rationale: Le démonstratif demeure volontairement abrupt et son référent n’est pas explicité par le traducteur.
- source_word: ⲧⲟⲩϫⲟⲛ
  choice: vous sauvera
  rationale: « Sauver » rend le contraste direct avec le verbe « tuer » et préserve la portée potentiellement sotériologique du terme.
- source_word: ⲡⲏ
  choice: sinon
  rationale: Le mot est compris comme une particule disjonctive introduisant l’autre possibilité. « Sinon » convient au mouvement d’avertissement de la phrase.
- source_word: ⲙⲛⲧⲁⲁⲛⲟⲛ
  choice: la pauvreté
  rationale: Le terme abstrait est rendu littéralement afin de ne pas atténuer l’image étrange par « manque » ou une paraphrase interprétative.
- source_word: ϩⲛⲧⲏⲛⲉ
  choice: à l’intérieur
  rationale: Cette expression renforce explicitement l’intériorité déjà indiquée par « en vous » ; la répétition est donc conservée.
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: vous tuera
  rationale: Le causatif de « mourir » appelle le verbe direct « tuer », qui maintient l’antithèse saisissante avec « sauver ».
theological_decisions:
- issue: Identité de ce qui est « en vous »
  choice: Le référent reste indéterminé.
  alternative: L’identifier à une lumière, à une connaissance, au Royaume ou à une nature spirituelle précise.
  rationale: Le dicton ne nomme pas explicitement cette réalité. La traduction ne doit pas importer une interprétation doctrinale particulière.
- issue: Portée de « sauvera »
  choice: Conserver le verbe sans préciser la nature du salut.
  alternative: Paraphraser par « vous délivrera », « vous sera utile » ou définir un salut spirituel particulier.
  rationale: L’opposition avec « tuera » soutient « sauvera », mais le texte ne fournit pas de système théologique explicite permettant d’en préciser davantage la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les démonstratifs abrupts, la répétition de l’intériorité et l’opposition « sauvera/tuera », sans expliquer ce que représente la réalité intérieure. Le vouvoiement pluriel rend la deuxième personne du pluriel copte.
