base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: fr
  text: 'Jésus a dit : « Heureux est l’homme qui sait par quelle partie[a] les brigands entreront, afin de se lever, de rassembler son royaume[b] et de se ceindre les reins à l’avance, avant qu’ils n’entrent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans quelle partie ». L’expression peut désigner le lieu ou le côté par lequel les brigands entreront ; elle pourrait aussi, selon le contexte, évoquer une partie ou une veille de la nuit. Le copte demeure ambigu.'
    reason: ambiguïté lexicale et contexte culturel
  - marker: b
    text: Le copte dit bien « rassembler son royaume ». Cette formulation inhabituelle est propre à cette version du propos ; elle ne doit pas être remplacée par l’image de la maison présente dans les parallèles synoptiques.
    reason: formulation distinctive et variante textuelle
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Heureux
  rationale: Rend naturellement en français la formule de béatitude issue du grec μακάριος, sans la réduire au simple sentiment de bonheur.
- source_word: ϩⲛ ⲁϣ ⲛⲙⲉⲣⲟⲥ
  choice: à quel moment
  rationale: L’expression signifie littéralement « dans quelle partie ». Ici, elle paraît désigner une portion ou veille de la nuit ; « à quel moment » donne un français intelligible tout en signalant l’incertitude dans une note.
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: brigands
  rationale: Le manuscrit emploie le pluriel, confirmé par le dernier verbe au pluriel. « Brigands » convient au contexte d’une intrusion violente ou d’un vol.
- source_word: ⲧⲱⲟⲩⲛ
  choice: se lever
  rationale: Correspond directement au verbe « se lever » et évite l’harmonisation avec les parallèles synoptiques qui parlent de veiller.
- source_word: ⲥⲱⲟⲩϩ
  choice: rassembler
  rationale: Conserve le sens concret de réunir ou recueillir, malgré le caractère inhabituel de l’expression avec « royaume ».
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: royaume
  rationale: Préserve le terme théologiquement chargé et l’image surprenante propre à Thomas, plutôt que de l’aplanir en « domaine » ou « biens ».
- source_word: ⲙⲟⲩⲣ … ⲉϫⲛ̄ ⲡⲉϥϯⲡⲉ
  choice: se ceindre les reins
  rationale: Rend l’expression idiomatique de préparation à l’action, dans un français biblique encore compréhensible.
- source_word: ϩⲁⲡⲉϩⲏ
  choice: à l’avance
  rationale: Exprime clairement l’idée d’une préparation préalable, renforcée par la proposition finale « avant qu’ils n’entrent ».
theological_decisions:
- issue: Sens de ⲙⲛⲧⲣⲣⲟ dans la scène des brigands
  choice: royaume
  alternative: domaine / propriété / biens
  rationale: Le sens narratif pourrait inviter à comprendre une propriété ou des biens, mais le texte emploie le terme ordinaire de « royaume ». Le conserver maintient la tension entre la scène concrète et la portée théologique du propos.
- issue: Relation avec les parallèles de Matthieu 24.43 et Luc 12.39
  choice: 'Traduire les verbes propres au texte de Thomas : se lever, rassembler, se ceindre'
  alternative: Harmoniser en « rester éveillé » et « empêcher l’effraction »
  rationale: La formulation de Thomas diffère nettement des parallèles synoptiques. La traduction ne doit pas remplacer ses images distinctives par celles des autres évangiles.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les images singulières du copte, notamment « rassembler son royaume ». « Se ceindre les reins » garde l’idiome ancien de préparation immédiate, tandis que la syntaxe environnante reste actuelle.
