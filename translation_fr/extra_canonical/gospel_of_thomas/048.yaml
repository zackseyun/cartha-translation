base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: fr
  text: 'Jésus a dit : « Si deux font la paix entre eux dans cette seule maison[a], ils diront à la montagne : “Déplace-toi d’ici[b]”, et elle se déplacera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « cette seule maison » peut aussi se comprendre comme « cette même maison » ou « une seule maison » ; ⲟⲩⲱⲧ peut signifier « un, seul, unique, même ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le verbe signifie « se déplacer » et ⲉⲃⲟⲗ indique un mouvement vers l’extérieur ou au loin ; on pourrait aussi traduire : « Va-t’en » ou « Éloigne-toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: si
  rationale: Ce marqueur introduit ici une condition prospective ; « si » en conserve la force conditionnelle.
- source_word: ⲥⲛⲁⲩ
  choice: deux
  rationale: Le cardinal est rendu directement, sans préciser l’identité des deux personnes.
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: font la paix
  rationale: La construction avec le nom d’origine grecque signifiant « paix » exprime ici l’établissement mutuel de la paix, plutôt qu’un simple état.
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: entre eux
  rationale: L’expression, littéralement liée à leurs compagnons ou leurs semblables, fonctionne idiomatiquement comme un réciproque.
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: dans cette seule maison
  rationale: Le démonstratif « cette » est conservé, tandis que « seule » maintient la nuance d’unité portée par ⲟⲩⲱⲧ, dont la portée exacte reste ouverte.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϫⲱⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: ils diront à la montagne
  rationale: Le futur et le destinataire explicite sont rendus directement ; le pronom coptique repris dans la construction n’a pas besoin d’être reproduit en français.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: Déplace-toi d’ici
  rationale: « Déplace-toi » rend le verbe de mouvement et « d’ici » exprime la direction d’éloignement indiquée par ⲉⲃⲟⲗ.
- source_word: ⲛⲧⲟϥⲛⲁⲡⲱⲱⲛⲉ
  choice: elle se déplacera
  rationale: Le futur est conservé, ainsi que la reprise du même verbe de mouvement ; le féminin français renvoie grammaticalement à « la montagne ».
theological_decisions:
- issue: Nature des « deux » et de la « maison »
  choice: Ne pas identifier symboliquement les deux personnes ni la maison
  alternative: Interpréter la maison comme le corps, une communauté ou le monde, et les deux comme des réalités spirituelles précises
  rationale: Le texte ne fournit lui-même aucune identification ; la traduction préserve donc l’image et sa tension sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, sobre et oralement fluide. La formulation conserve l’étrangeté de l’image et la répétition du verbe « se déplacer ». « Entre eux » évite d’ajouter un nom absent du copte, et « cette seule maison » garde visible l’ambiguïté de l’unité.
