base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: fr
  text: 'Jésus dit : « Celui qui connaîtra le père et la mère[a], on l’appellera[b] “le fils d’une prostituée”[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la proposition est au futur : « celui qui connaîtra »; elle ne dit pas simplement « celui qui connaît ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ils l’appelleront ». Le français emploie ici « on » pour ce sujet pluriel non précisé. Le verbe peut aussi se traduire par « nommer ».
    reason: lexical_alternative
  - marker: c
    text: 'Le mot copte emprunté au grec signifie « prostituée ». Son p initial fait partie du mot et n’est pas un article défini : il s’agit donc d’« une prostituée », non de « la prostituée ».'
    reason: textual_morphology
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁⲥⲟⲩⲱⲛ
  choice: celui qui connaîtra
  rationale: La construction relative au futur est rendue par un futur français, plutôt que par le présent général « celui qui connaît ».
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ̄ ⲧⲙⲁⲁⲩ
  choice: le père et la mère
  rationale: Les articles définis sont conservés, sans majuscules interprétatives.
- source_word: ⲥⲉⲛⲁⲙⲟⲩⲧⲉ ⲉⲣⲟϥ
  choice: on l’appellera
  rationale: Le copte emploie un sujet de troisième personne du pluriel non précisé. Le pronom indéfini « on » en donne ici l’équivalent français le plus naturel tout en gardant l’action future.
- source_word: ⲡϣⲏⲣⲉ
  choice: le fils
  rationale: Le nom peut aussi désigner un enfant, mais l’article masculin et l’expression de filiation favorisent « fils ».
- source_word: ⲡⲟⲣⲛⲏ
  choice: une prostituée
  rationale: Le p initial appartient à l’emprunt grec et n’est pas l’article défini copte. Le nom est donc indéfini. « Prostituée » est précis sans adopter un terme injurieux ou archaïque.
theological_decisions:
- issue: Identification du « père » et de la « mère »
  choice: minuscules et absence d’explication dans le texte
  alternative: « Père » et « Mère » avec majuscules
  rationale: Le texte ne précise pas s’il s’agit des parents humains, de figures symboliques ou de réalités divines. Les minuscules préservent cette ambiguïté sans imposer une lecture théologique.
- issue: Portée de l’épithète « fils d’une prostituée »
  choice: traduction directe sans interprétation
  alternative: paraphrase explicative telle que « enfant illégitime »
  rationale: La formule est volontairement frappante et son sens contextuel demeure discuté. Une paraphrase résoudrait indûment sa tension.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le futur, les articles de « le père et la mère » et la rudesse de l’épithète, tout en employant le « on » indéfini naturel en français.
