base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: fr
  text: 'Jésus dit : « Le Royaume[a] est semblable à un homme qui avait dans son champ un trésor caché, sans le savoir. Après sa mort, il le laissa à son fils. Le fils n’en savait rien. Il prit ce champ et le vendit. Celui qui l’acheta vint et, tandis qu’il labourait, trouva le trésor[b]. Il se mit à prêter de l’argent à intérêt à qui il voulait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette parabole diffère sensiblement du parallèle de Matthieu 13.44 : ici, le premier propriétaire ignore l’existence du trésor, et c’est l’acheteur suivant qui le découvre puis prête de l’argent à intérêt.'
    reason: cross_reference
  - marker: b
    text: Plusieurs mots de ce logion sont restitués dans des lacunes du manuscrit; ces restitutions sont toutefois usuelles et hautement probables d’après les lettres conservées et le contexte.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: le Royaume
  rationale: Rend le nom abstrait copte désignant la royauté ou le royaume, en conservant la formulation traditionnelle et l’absence de complément explicite dans le texte.
- source_word: ⲁϩⲟ
  choice: trésor
  rationale: Terme français naturel pour un bien précieux caché ou amassé.
- source_word: ϩⲱⲡ
  choice: caché
  rationale: Conserve l’élément explicite du texte selon lequel le trésor se trouve dissimulé.
- source_word: ⲁⲧⲥⲟⲟⲩⲛ
  choice: sans le savoir / n’en savait rien
  rationale: Exprime naturellement l’ignorance du propriétaire puis celle du fils, sans suggérer qu’ils cherchent le trésor.
- source_word: ϥⲓ
  choice: prit
  rationale: Le verbe peut désigner le fait de prendre ou de recevoir; « prit » préserve la sobriété du récit sans préciser davantage le mode de transmission du champ.
- source_word: ⲧⲟⲟⲩ
  choice: acheta
  rationale: Rend directement le verbe copte signifiant acheter.
- source_word: ⲥⲕⲁⲓ
  choice: labourait
  rationale: Dans le contexte d’un champ, « labourait » rend naturellement l’action de creuser ou de travailler la terre et conserve le caractère fortuit de la découverte.
- source_word: ϩⲉ ⲉ-
  choice: trouva
  rationale: Cette construction signifie trouver ou tomber sur quelque chose.
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: prêter de l’argent à intérêt
  rationale: Rend sans l’atténuer l’expression littérale « donner de l’argent à intérêt ».
theological_decisions:
- issue: La mise à intérêt de l’argent
  choice: prêter de l’argent à intérêt
  alternative: investir l’argent
  rationale: Le copte mentionne explicitement l’argent donné à intérêt. La traduction conserve cette tension éthique et théologique au lieu de la neutraliser.
- issue: L’identité du Royaume
  choice: le Royaume
  alternative: le Royaume de Dieu / le Royaume des cieux
  rationale: Le texte copte ne donne aucun complément; l’ajout de « Dieu » ou « des cieux » résoudrait indûment une formulation laissée ouverte.
- issue: L’objet laissé au fils
  choice: il le laissa à son fils
  alternative: il laissa le champ à son fils
  rationale: Le pronom copte renvoie grammaticalement au trésor, mais la suite met en scène la transmission du champ. Le pronom français maintient au plus près la formulation du texte et sa légère tension narrative.
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases brèves reproduisent la progression narrative du copte. « Le Royaume » conserve l’ellipse de la source; « tandis qu’il labourait » marque clairement une découverte fortuite.
