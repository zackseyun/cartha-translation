review_pass:
  verdict: approve
  source_fidelity: 'Le texte français rend fidèlement la séquence copte : trésor caché et ignoré du premier propriétaire, transmission au fils également ignorant, prise et vente du champ, découverte fortuite par l’acheteur pendant son travail du sol, puis commencement du prêt à intérêt. Il conserve à juste titre l’ellipse de « le Royaume » sans ajouter « de Dieu » ou « des cieux ».'
  naturalness: Le français est moderne, fluide et sobre. Les phrases brèves soutiennent efficacement la progression narrative. « Tandis qu’il labourait » exprime bien la valeur circonstancielle et fortuite de ⲉϥⲥⲕⲁⲉⲓ; dans le contexte agricole, « labourer » est une option française naturelle pour le travail de la terre visé.
  terminology: « Trésor », « caché », « acheta », « trouva » et « prêter de l’argent à intérêt » sont exacts et idiomatiques. « À intérêt » restitue sans euphémisation l’expression copte « donner de l’argent/cuivre à intérêt ». La majuscule à « Royaume » relève d’un usage biblique français acceptable et n’ajoute pas de complément absent de la source.
