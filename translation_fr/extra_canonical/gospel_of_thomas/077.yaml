base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: fr
  text: 'Jésus a dit : « Je suis la lumière qui est au-dessus d’eux tous. Je suis le Tout. C’est de moi que le Tout est sorti, et c’est jusqu’à moi que le Tout est parvenu[a]. Fendez un morceau de bois[b] : je suis là. Soulevez la pierre, et vous me trouverez là. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le copte emploie ici deux verbes de même forme : celui qui signifie « parvenir » est immédiatement repris avec le sens de « fendre ». Ce jeu de mots ne peut être reproduit naturellement en français.'
    reason: Jeu de mots dans la langue source.
  - marker: b
    text: Dans le fragment grec P.Oxy. 1, les injonctions concernant la pierre et le bois figurent dans l’ordre inverse et sont rattachées à la fin du logion 30.
    reason: Variante de disposition dans un témoin grec ancien.
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: la lumière
  rationale: Équivalent français direct du substantif copte désignant la lumière; l’article défini est conservé.
- source_word: ⲡⲧⲏⲣϥ
  choice: le Tout
  rationale: Le substantif absolu désigne ici la totalité. « Le Tout » conserve cette formulation conceptuelle et sa répétition, plutôt que de l’aplanir en « tout » ou « toutes choses ».
- source_word: ⲡⲱϩ (première occurrence)
  choice: est parvenu
  rationale: Dans la première occurrence, le verbe signifie atteindre ou parvenir. La tournure « c’est jusqu’à moi que » restitue aussi la mise en relief de la destination.
- source_word: ⲡⲱϩ (deuxième occurrence)
  choice: Fendez
  rationale: Dans la seconde occurrence, la même forme copte signifie fendre. Le français ne peut reproduire naturellement l’homonymie copte; celle-ci est donc signalée en note.
- source_word: ϣⲉ
  choice: un morceau de bois
  rationale: Le mot peut désigner le bois ou une pièce de bois. Cette formulation convient naturellement à l’action de fendre sans préciser indûment qu’il s’agit d’une bûche.
- source_word: ϥⲓ … ⲉϩⲣⲁⲓ
  choice: Soulevez
  rationale: Le verbe accompagné de l’adverbe directionnel signifie lever ou soulever; « Soulevez » est idiomatique devant « la pierre ».
- source_word: ϩⲉ ⲉ-
  choice: vous me trouverez
  rationale: La construction signifie trouver ou tomber sur quelqu’un, et non simplement voir.
theological_decisions:
- issue: Interprétation de ⲡⲧⲏⲣϥ
  choice: le Tout
  alternative: tout; toutes choses; la totalité
  rationale: La traduction maintient l’identification énigmatique de Jésus avec « le Tout » sans l’expliquer par une catégorie doctrinale particulière.
- issue: Portée de « au-dessus d’eux tous »
  choice: au-dessus d’eux tous
  alternative: au-dessus de tous; au-dessus de toutes choses
  rationale: Le pronom pluriel du copte n’a pas d’antécédent explicite dans ce logion. La traduction conserve cette indétermination au lieu de préciser « toutes choses ».
- issue: Présence dans le bois et sous la pierre
  choice: je suis là / vous me trouverez là
  alternative: interprétation symbolique explicitée
  rationale: Les affirmations imagées restent sans commentaire doctrinal dans le texte, conformément à leur caractère ouvert dans la source.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe emphatique « C’est de moi que… et c’est jusqu’à moi que… » rend la mise en relief des compléments dans le copte. Les répétitions de « le Tout » et de « là » sont volontairement conservées. Les deux notes sont appelées dans le texte par [a] et [b].
