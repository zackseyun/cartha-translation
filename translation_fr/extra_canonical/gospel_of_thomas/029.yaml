base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: fr
  text: 'Jésus dit : « Si la chair est venue à l’existence à cause de l’esprit, c’est une merveille. Mais si l’esprit est venu à l’existence à cause du corps, c’est une merveille des merveilles. Pourtant, moi-même, je m’émerveille de voir comment cette grande richesse a fait sa demeure dans cette pauvreté. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit a ici une petite lacune : la dernière lettre du mot copte traduit par « comment » est restituée. Le témoin grec POxy 1 confirme la fin de la pensée avec les mots « cette pauvreté ».'
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: venir à l’existence
  rationale: Exprime ici l’origine ou l’apparition plutôt qu’une naissance physique; cette formulation garde la portée métaphysique et le parallélisme.
- source_word: ⲉⲧⲃⲉ
  choice: à cause de
  rationale: Rend directement la relation causale sans préciser davantage la nature de la dépendance.
- source_word: ⲥⲁⲣⲝ / ⲥⲱⲙⲁ
  choice: chair / corps
  rationale: Préserve la distinction lexicale délibérée entre les deux termes grecs empruntés par le copte.
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: esprit
  rationale: Équivalent français usuel qui convient à l’antithèse entre réalité corporelle et esprit.
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: une merveille / une merveille des merveilles
  rationale: Le second syntagme est un superlatif de type sémitique; le choix conserve aussi la répétition du même lexème.
- source_word: ⲇⲉ
  choice: Mais
  rationale: Rend explicitement la particule adversative de la seconde proposition conditionnelle.
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: moi-même, je m’émerveille
  rationale: Le manuscrit présente le pronom indépendant emphatique suivi de la forme verbale à la première personne, non un redoublement du pronom.
- source_word: ⲡⲱⲥ
  choice: comment
  rationale: Introduit naturellement en français l’interrogative indirecte portant sur le paradoxe final.
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: cette grande richesse
  rationale: Formulation française naturelle qui conserve le démonstratif, l’intensité et l’opposition avec la pauvreté.
- source_word: ⲥⲟⲩⲱϩ
  choice: élire demeure
  rationale: Rend l’idée d’habiter ou de s’établir tout en donnant à la phrase un registre digne et naturel.
- source_word: ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: cette pauvreté
  rationale: Équivalent direct qui maintient le paradoxe entre richesse et pauvreté.
theological_decisions:
- issue: Rapport entre la chair, le corps et l’esprit
  choice: Conserver deux hypothèses causales parallèles sans les harmoniser ni identifier explicitement la pauvreté au corps.
  alternative: Interpréter le corps comme simple réceptacle inférieur de l’esprit et expliciter cette lecture.
  rationale: Le texte formule un paradoxe et laisse implicite le référent exact de « cette pauvreté »; une traduction ne doit pas résoudre cette tension théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et le contraste sont conservés; « moi-même » restitue l’emphase grammaticale réelle du manuscrit. Le marqueur [a] figure dans le texte principal.
