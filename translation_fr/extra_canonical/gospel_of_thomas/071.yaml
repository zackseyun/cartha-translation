  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: fr
  text: 'Jésus dit : « Moi, je démolirai cette maison[a], et personne[c] ne pourra la bâtir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les mots correspondant à « cette maison » sont en partie restitués dans une lacune du manuscrit : ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁϣⲟⲣ[ϣⲣ ⲙⲡⲉⲉ]ⲓ̣ⲏ̣ⲉⲓ. L’édition normalisée lit ⲛⲡⲉⲓⲏⲓ, « cette maison ».'
    reason: lacuna_or_restoration
  - marker: b
    text: Le verbe ϣⲕⲱⲧ signifie « être capable, pouvoir ». L’action « bâtir » est sous-entendue d’après « maison » et le contexte. On traduit parfois « rebâtir », mais l’idée de « de nouveau » n’est pas exprimée explicitement en copte.
    reason: lexical_alternative
  - marker: c
    text: ⲙⲛ̄ⲗⲁⲁⲩ associe la négation à l’indéfini et signifie « personne ». La forme ⲗⲁⲁⲩ est courante en sahidique comme en lycopolitain.
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jésus dit
  rationale: La formule ⲡⲉϫⲉ suivie du nom du locuteur introduit directement une parole; le présent narratif est naturel en français.
- source_word: ⲁⲛⲟⲕ
  choice: Moi, je
  rationale: Le pronom indépendant met le sujet en relief. La dislocation « Moi, je » rend cette insistance de manière idiomatique en français.
- source_word: ϣⲟⲣϣⲣ
  choice: démolirai
  rationale: Le verbe signifie abattre, renverser ou démolir. « Démolir » convient directement à une maison et garde la force concrète de l’énoncé.
- source_word: ⲡⲉⲓⲏⲓ
  choice: cette maison
  rationale: ⲏⲓ désigne une maison ou demeure, et le démonstratif ⲡⲉⲓ- signifie « cette ». Le passage pouvant aussi avoir une portée figurée, le terme concret « maison » est conservé sans interprétation ajoutée.
- source_word: ⲙⲛ̄ⲗⲁⲁⲩ
  choice: personne ne
  rationale: La négation associée à l’indéfini exprime « personne ». La construction française exige ici « personne ne ».
- source_word: ϣⲕⲱⲧ
  choice: ne pourra
  rationale: Le verbe signifie « être capable, pouvoir ». Cette valeur modale est rendue explicitement sans lui attribuer le sens lexical de construire.
- source_word: ⲛⲧⲟϥ
  choice: la
  rationale: Le pronom objet renvoie à la maison. En français, le féminin singulier « la » reprend naturellement « cette maison » dans l’action suppléée par le contexte.
theological_decisions:
- issue: Référent et portée de « cette maison »
  choice: Conserver « cette maison » sans identifier son référent
  alternative: Préciser qu’il s’agit d’un bâtiment, du temple, du corps ou d’une communauté
  rationale: Le texte ne précise ni le référent ni la portée symbolique éventuelle. Une identification explicite résoudrait indûment l’ambiguïté.
- issue: Construire ou reconstruire
  choice: Employer « bâtir »
  alternative: Employer « rebâtir » ou « reconstruire »
  rationale: Le contexte d’une démolition peut suggérer une reconstruction, mais aucun élément correspondant à « de nouveau » n’est explicite dans le copte. « Bâtir » évite d’ajouter cette nuance.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe directe préserve le caractère lapidaire de la sentence. « Moi, je » marque l’insistance du pronom copte indépendant; « démolirai » reste concret sans imposer une interprétation symbolique.
