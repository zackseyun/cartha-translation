base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Vingt-quatre prophètes[c] ont parlé en Israël, et tous ont parlé de toi[a]. » Il leur dit : « Vous avez laissé de côté[b] celui qui est vivant devant vous[d], et vous avez parlé de celui qui est mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription imprimée peut se lire « en ton cœur » (ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ), tandis que le texte normalisé de Dilley porte une expression signifiant « de toi » (ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ). La traduction suit cette dernière lecture.
    reason: textual_variant
  - marker: b
    text: « Laissé de côté » peut aussi se traduire par « omis » ou « négligé ».
    reason: lexical_alternative
  - marker: c
    text: Le nombre de vingt-quatre prophètes peut refléter un décompte traditionnel des autorités prophétiques ou avoir une valeur symbolique. Certains décomptes anciens attribuaient aussi vingt-quatre livres aux Écritures hébraïques, mais le propos ne précise pas le lien éventuel.
    reason: cultural_note
  - marker: d
    text: Comparer le contraste entre le vivant et les morts en Marc 12.27 et dans les passages parallèles. Ici, toutefois, l’accent porte sur le vivant qui se trouve devant les disciples.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: vingt-quatre
  rationale: C’est la forme française courante du nombre composé, sans archaïsme inutile.
- source_word: ϣⲁϫⲉ
  choice: parler
  rationale: Le verbe est répété dans le texte copte; « parler » conserve cette reprise et convient à la proclamation des prophètes.
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ
  choice: de toi
  rationale: La normalisation de Dilley comprend la locution comme désignant la personne prise pour sujet du discours. La lecture manuscrite susceptible d’évoquer le cœur est signalée en note.
- source_word: ⲕⲱ
  choice: laisser de côté
  rationale: Cette expression garde la nuance active de négliger ou d’omettre quelqu’un, tout en restant naturelle en français.
- source_word: ⲡⲉⲧⲟⲛϩ
  choice: celui qui est vivant
  rationale: La relative substantivée est au singulier; cette formulation préserve le contraste marqué avec les morts sans identifier explicitement le personnage.
- source_word: ⲙ̄ⲡⲉⲧⲛ̄ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: là devant vous
  rationale: L’expression signifie littéralement être devant quelqu’un, en sa présence. « Là devant vous » est actuel, clair et souligne la présence immédiate.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: les morts
  rationale: La transcription du manuscrit présente une forme plurielle; « les morts » conserve le contraste collectif avec l’unique vivant.
theological_decisions:
- issue: Identité de « celui qui est vivant »
  choice: Ne pas l’identifier explicitement dans la traduction
  alternative: Ajouter « Jésus » ou « moi »
  rationale: Le contexte peut inviter à cette identification, mais le texte emploie une désignation indirecte; l’expliciter supprimerait une tension intentionnelle.
- issue: Portée de « les morts »
  choice: Conserver la désignation non expliquée « les morts »
  alternative: Préciser qu’il s’agit des prophètes décédés
  rationale: Le contraste suggère les prophètes du passé, mais le texte ne formule pas lui-même cette explication.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste compact et conserve la répétition de « parler ». « Là devant vous » rend l’immédiateté de la présence sans la solennité moins naturelle de « en votre présence ». Les marqueurs de notes sont placés exactement après les éléments qu’ils expliquent.
