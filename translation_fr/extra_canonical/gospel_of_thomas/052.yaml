revisions:
- from: 'Ses disciples lui dirent : « Vingt-quatre prophètes[c] ont parlé en Israël, et tous ont parlé de toi[a]. » Il leur dit : « Vous avez laissé de côté[b] celui qui est vivant, là devant vous[d], et vous avez parlé des morts. »'
  to: 'Ses disciples lui dirent : « Vingt-quatre prophètes[c] ont parlé en Israël, et tous ont parlé de toi[a]. » Il leur dit : « Vous avez laissé de côté[b] celui qui est vivant devant vous[d], et vous avez parlé de celui qui est mort. »'
  rationale: La révision rétablit le singulier du dernier terme conformément au texte copte normalisé, sans interpréter son référent. Elle simplifie également « là devant vous » en « devant vous », formulation française naturelle et fidèle à l’expression copte. Les notes existantes sont conservées ; la note d est légèrement ajustée afin de ne pas attribuer au texte de Thomas un pluriel dans son contraste final.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:41:35Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement le nombre, la répétition de « parler », la référence normalisée à « toi », l’omission du vivant présent et le contraste final. Toutefois, le texte source normalisé porte au singulier ⲡⲉⲧⲉⲣⲉⲙⲟⲩ (« celui qui est mort ») ; « des morts » introduit un pluriel fondé sur la graphie manuscrite plutôt que sur le texte normalisé fourni.
  naturalness: Le français est clair, sobre et naturel. « Devant vous » rend avec concision l’expression de présence immédiate ; l’ajout de « là » n’est pas nécessaire.
  terminology: « Celui qui est vivant » préserve la relative substantivée singulière sans imposer d’identification théologique. « Celui qui est mort » conserve le singulier également présent dans le texte normalisé et maintient l’ambiguïté du référent. Les notes sont pertinentes et leurs ancres sont correctement placées.
  issues:
  - severity: medium
    issue: 'Le dernier référent est mis au pluriel : « des morts ».'
    rationale: Le texte normalisé donne une relative substantivée au singulier, ⲡⲉⲧⲉⲣⲉⲙⲟⲩ. La forme plurielle apparaît dans la transcription manuscrite, mais la traduction doit suivre d’abord la source normalisée fournie. Une note textuelle pourrait signaler la variante si l’on juge nécessaire de l’exploiter ; sans note, le singulier est requis.
  - severity: low
    issue: « Là » dans « là devant vous » est légèrement expansif.
    rationale: L’expression copte signifie « devant vous / en votre présence » ; « devant vous » est plus direct et ne perd pas l’immédiateté.
