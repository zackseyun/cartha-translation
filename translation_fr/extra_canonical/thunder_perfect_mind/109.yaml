  text: And what you see outside you, you see inside you; it is what is visible, and it is your garment.
translation:
  language: fr
  text: '**7.** Et ce que vous voyez à l’extérieur de vous, vous le voyez à l’intérieur de vous : c’est ce qui est visible, et c’est votre vêtement.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait OCR fourni est de faible confiance et ne correspond pas clairement aux mots sur lesquels repose cet alignement; la traduction suit donc le texte de consultation et les données lexicales associées.
    reason: Signaler honnêtement l’incertitude documentaire et le possible défaut d’alignement de la source OCR.
lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: voyez
  rationale: Le verbe sahidique courant de perception visuelle appelle ici le français simple « voir » et maintient la répétition voulue.
- source_word: ⲉⲃⲟⲗ
  choice: à l’extérieur de vous
  rationale: Cette formulation exprime l’extériorité et forme une opposition nette avec « à l’intérieur de vous », sans imposer une lecture purement spatiale ou psychologique.
- source_word: ⲉϩⲟⲩⲛ
  choice: à l’intérieur de vous
  rationale: Le choix conserve le parallélisme antithétique avec ⲉⲃⲟⲗ et reste naturel en français moderne.
- source_word: ⲟⲣⲁⲧⲟⲛ (emprunt au grec ὁρατόν)
  choice: ce qui est visible
  rationale: L’adjectif grec substantivé est rendu par une tournure nominale naturelle qui prolonge le motif de la vision.
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (emprunt au grec ἱμάτιον)
  choice: vêtement
  rationale: « Vêtement » garde la portée métaphorique et le registre digne du passage sans préciser indûment « manteau » ou un type particulier d’habit.
theological_decisions:
- issue: Rapport entre l’extérieur, l’intérieur, le visible et le vêtement
  choice: Conserver les identifications et oppositions sans les expliquer
  alternative: Expliciter une distinction entre réalité intérieure, apparence extérieure et corps
  rationale: Le texte demeure énigmatique et ne définit pas lui-même la portée de ces images; une explicitation introduirait une interprétation théologique ou anthropologique non exigée par la formulation.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « vous voyez » et le parallélisme « à l’extérieur / à l’intérieur » sont maintenus; les deux-points rendent le lien explicatif sans supprimer l’énigme.
