lexical_decisions:
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: … de ce que vous entendez
  rationale: Le groupe conservé contient la forme possessive de deuxième personne du pluriel avec ⲥⲱⲧⲙ (« entendre, écoute »). Comme le début syntaxique manque, la traduction reste fragmentaire et ne précise pas davantage le rapport grammatical.
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: ma défense
  rationale: L’emprunt grec ἀπολογία désigne normalement une défense, une justification ou une réponse. Le préfixe possessif ⲧⲁ- appelle « ma »; rien dans ce fragment ne justifie le sens général « parole ».
- source_word: ⲉⲩϣⲁⲛ-
  choice: s’ils
  rationale: Cette séquence marque une proposition conditionnelle à sujet pluriel (« s’ils… »). Le verbe qui suit est lacunaire et n’est donc pas reconstitué dans le texte.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: l’injustice
  rationale: Le nom verbal exprime ici l’injustice, l’oppression ou la violence. « Injustice » est idiomatique et évite l’interprétation erronée « saisie/compréhension ».
theological_decisions:
- issue: Identité et prédicats de la locutrice dans un passage lacunaire
  choice: Conserver explicitement les lacunes après « Je suis le » et autour des autres fragments
  alternative: Compléter les prédicats à partir d’un passage parallèle ou du texte de consultation
  rationale: La source alignée est fortement fragmentaire et le texte de consultation appartient vraisemblablement à un autre emplacement. Une reconstruction produirait une affirmation théologique non attestée ici.
