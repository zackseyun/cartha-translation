base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
translation:
  language: fr
  text: '**5.** Pourquoi me méprisez-vous parmi ceux qui sont petits[a] ? Je suis l’intellect[b] et mon repos[c]. Vous êtes la connaissance de mon genre[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les jeunes » ou « parmi ceux qui sont dans l’enfance ». Le mot copte est incertain dans cet extrait transmis par OCR.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la pensée »; le copte ⲡⲛⲟⲩⲥ est emprunté au grec νοῦς (« nous », « intellect »).'
    reason: lexical_alternative
  - marker: c
    text: La juxtaposition « Je suis l’intellect et mon repos » est abrupte, mais elle reflète le texte copte disponible.
    reason: textual_uncertainty
  - marker: d
    text: « De mon genre » repose sur la reconstruction probable ⲙⲡⲁⲅⲉⲛⲟⲥ (« de mon genos »), derrière un OCR défectueux. Selon le contexte, γένος peut aussi évoquer l’espèce, la sorte, l’origine ou la lignée.
    reason: alignment_note
lexical_decisions:
- source_word: ⲧⲱⲃⲡ
  choice: méprisez
  rationale: Le verbe exprime ici le mépris ou le rejet. La forme transmise par l’OCR est défectueuse, mais la reconstruction contextuelle soutient une déclaration ou question adressée au pluriel, et non l’impératif « approchez-vous » du texte de consultation.
- source_word: ⲛⲉⲧ…ⲙⲛⲥⲁⲛⲁⲓ
  choice: parmi ceux qui sont petits
  rationale: Cette formulation naturelle conserve l’idée de petitesse sans imposer le sens plus précis d’enfance ou de jeunesse.
- source_word: ⲡⲛⲟⲩⲥ
  choice: l’Intellect
  rationale: Emprunt copte au grec νοῦς, désignant la faculté de pensée ou l’intellect. « Intellect » garde la portée philosophique du terme tout en restant intelligible en français moderne.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: mon Repos
  rationale: Le possessif féminin singulier ⲧⲁ- précède un emprunt au grec ἀνάπαυσις. La majuscule signale ici une réalité personnifiée ou transcendante sans en fixer davantage le statut.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: la connaissance
  rationale: Équivalent direct du nom copte désignant la connaissance; il convient au registre sapientiel du passage.
- source_word: ⲙⲡⲁⲅⲉⲛⲟⲥ (reconstruction probable de l’OCR ⲙⲡⲁⲅⲓⲛⲉ ⲛⲥⲱ)
  choice: de ma lignée
  rationale: La reconstruction « mon genos » est appuyée par le passage parallèle identifié lors de la révision. « Lignée » conserve l’éventail de sens de γένος mieux que « espèce » ou « race » dans ce contexte.
theological_decisions:
- issue: Statut de l’Intellect et du Repos
  choice: Conserver les affirmations juxtaposées sans expliquer leur relation métaphysique.
  alternative: Identifier explicitement ces termes à des émanations, attributs ou personnes distinctes.
  rationale: Le texte formule des déclarations énigmatiques et l’extrait ne permet pas d’en imposer une interprétation doctrinale précise.
- issue: Sens de γένος dans « ma lignée »
  choice: Employer « lignée » sans préciser s’il s’agit d’une origine naturelle, spirituelle ou céleste.
  alternative: Traduire par « race », « espèce » ou « famille spirituelle ».
  rationale: Le terme source peut désigner l’origine, la parenté, la catégorie ou la descendance; le contexte fragmentaire ne tranche pas.
translation_notes:
  register: Français international moderne, sobre et dignifié. Le vouvoiement pluriel rend l’adresse collective. Les majuscules à « Intellect » et « Repos » préservent leur poids conceptuel, sans imposer une doctrine particulière. La formulation conserve les ruptures et ambiguïtés d’un texte copte dont l’OCR et l’alignement sont de confiance moyenne.
