base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: fr
  text: '**2.** Pensez à moi. Je me suis trouvée parmi ceux qui me cherchent[a],


    vous qui veillez en m’attendant — vous-mêmes[b] ;


    et vous qui écoutez, écoutez-moi.


    Vous dont le cœur est troublé, accueillez-moi auprès de vous[c],


    et ne me fuyez pas[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le copte transmis porte littéralement une forme de première personne : « et je me suis trouvée parmi ceux qui me cherchent ». Comme le passage enchaîne les exhortations, certains comprennent ou corrigent plutôt : « et trouvez-moi parmi ceux qui me cherchent ».'
    reason: La forme attestée est grammaticalement difficile dans le contexte; la note préserve à la fois le texte transmis et l’alternative contextuelle.
  - marker: b
    text: « Vous-mêmes » rend un pronom indépendant emphatique qui renforce directement l’adresse.
    reason: Cette insistance peut sembler abrupte en français, mais elle appartient à la rhétorique du copte.
  - marker: c
    text: 'Littéralement : « recevez-moi auprès de vous » ou « prenez-moi avec vous ».'
    reason: La note donne des équivalents plus formels du verbe ϣⲱⲡ et de la préposition, sans revenir à la lecture erronée « soyez forts ».
  - marker: d
    text: 'Ou : « ne vous détournez pas de moi ». Le verbe copte signifie concrètement « courir, fuir ».'
    reason: La traduction principale conserve le sens concret de la fuite; la note indique son sens relationnel possible.
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: Pensez à moi
  rationale: L’impératif ⲙⲉⲉⲩⲉ invite à penser à la locutrice ou à porter son attention sur elle. Cette formulation est directe, naturelle et n’ajoute pas une nuance spécifiquement méditative.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ
  choice: Je me suis trouvée
  rationale: Le texte transmis par l’extrait porte la forme accomplie de première personne ⲁⲓϭⲓⲛⲉ, « j’ai trouvé », avec ⲙⲙⲟⲓ, « moi ». Le réfléchi français conserve cette lecture difficile sans corriger silencieusement le texte en impératif. L’accord féminin correspond à la voix féminine qui se présente dans l’œuvre.
- source_word: ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: ceux qui me cherchent
  rationale: ϣⲓⲛⲉ signifie chercher ou rechercher, et ⲛⲥⲱⲓ marque ici l’objet de cette recherche.
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ ⲉⲣⲟⲓ
  choice: vous qui veillez en m’attendant
  rationale: ⲣⲟⲉⲓⲥ signifie veiller, rester éveillé ou monter la garde, non « connaître ». Avec ⲉⲣⲟⲓ, le contexte permet l’idée de veiller dans l’attente de la locutrice.
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: vous-mêmes
  rationale: Le pronom indépendant renforce l’adresse à la deuxième personne du pluriel; le tiret conserve son relief rhétorique.
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  choice: vous qui écoutez
  rationale: La forme plurielle avec le préfixe agentif ⲣⲉϥ- désigne les auditeurs, plutôt qu’une proposition au futur.
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: écoutez-moi
  rationale: L’impératif reprend le nom d’agent précédent et appelle non seulement à entendre, mais à prêter attention.
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: Vous dont le cœur est troublé
  rationale: ⲧⲟϣⲧ exprime le trouble ou l’effroi, tandis que ϩⲏⲧ désigne le cœur ou l’intériorité.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: accueillez-moi auprès de vous
  rationale: ϣⲟⲡⲧ est compris comme l’impératif de ϣⲱⲡ, « recevoir, prendre », avec le suffixe objet de première personne, suivi de « auprès de vous ». Cette analyse évite l’ancienne méprise « soyez forts ».
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: ne fuyez pas loin de moi
  rationale: La négation impérative ⲙⲡⲣ- gouverne ⲡⲱⲧ, « courir, fuir »; la traduction maintient l’image concrète de la fuite.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: Accord féminin dans « trouvée »
  alternative: Éviter tout accord visible, par exemple au moyen d’une reformulation
  rationale: L’œuvre met en scène une voix féminine et ses déclarations identitaires le confirment. L’accord grammatical rend cette donnée littéraire sans identifier la locutrice à une figure doctrinale précise.
- issue: Forme difficile ⲁⲓϭⲓⲛⲉ
  choice: 'Conserver l’indicatif transmis : « Je me suis trouvée »'
  alternative: 'Corriger ou comprendre comme un impératif : « trouvez-moi »'
  rationale: La suite d’impératifs et le rapprochement avec « ceux qui me cherchent » rendent l’impératif plausible, mais l’extrait copte fourni atteste formellement la première personne accomplie. La traduction principale conserve donc la difficulté et signale l’autre lecture en note.
translation_notes:
  register: Français international actuel, digne et oralement fluide. Les impératifs et les reprises de « vous » maintiennent le caractère oraculaire et l’adresse insistante. La légère étrangeté de « vous-mêmes » et de « je me suis trouvée » est conservée parce qu’elle reflète des traits réels ou des difficultés du texte copte, avec éclaircissement en notes.
