base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
translation:
  language: fr
  text: '**7.** Dans le mariage[a], je suis la sage-femme,

    et je suis celle qui n’enfante pas.

    Je suis le réconfort de mes douleurs d’enfantement.

    Je suis la mariée et la mère.

    Je suis la sœur et la femme[b].

    Je suis la mère de…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte après « dans » est incertain dans cet OCR. « Mariage » suit le contexte textuel probable, mais devra être vérifié sur le fac-similé ou dans une édition critique.
    reason: textual_uncertainty
  - marker: b
    text: Le copte ⲥϩⲓⲙⲉ peut désigner une « femme » ou une « épouse ». En l’absence d’un possessif visible ici, la traduction retient le terme plus ouvert.
    reason: lexical_alternative
  - marker: c
    text: L’extrait fourni s’interrompt après « la mère de ». Les points de suspension signalent cette phrase inachevée; aucun complément n’a été reconstitué.
    reason: source_boundary
lexical_decisions:
- source_word: ϩⲙ ⲡⲓϫⲉⲕⲙ
  choice: Dans le mariage
  rationale: ϩⲙ signifie normalement « dans ». Le second mot est incertain dans l’OCR, mais le contexte transmis et la tradition textuelle soutiennent le champ sémantique du mariage; la note maintient l’incertitude au lieu de la masquer.
- source_word: ⲧⲙⲉⲥⲓⲱ
  choice: la sage-femme
  rationale: Le nom féminin désigne ici celle qui assiste l’accouchement. « Sage-femme » rend naturellement le contraste avec celle qui n’enfante pas.
- source_word: ⲧⲉⲧⲉ ⲙⲁⲥⲙⲓⲥⲉ
  choice: celle qui n’enfante pas
  rationale: La proposition féminine négative est rendue sans ajouter de motif ni de statut matrimonial absent de cette expression.
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: le réconfort
  rationale: Le terme exprime la consolation ou le soulagement; « réconfort » convient au registre poétique et demeure accessible.
- source_word: ⲛⲛⲁⲛⲁⲁⲕⲉ
  choice: de mes douleurs d’enfantement
  rationale: Le possessif de première personne et le contexte obstétrical appellent une expression française claire; « douleurs d’enfantement » garde le lien avec l’acte d’enfanter.
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: la mariée
  rationale: Le substantif féminin désigne la jeune épouse ou la mariée; « mariée » conserve le parallélisme avec le mariage.
- source_word: ⲧⲙⲁⲁⲩ
  choice: la mère
  rationale: Le mot visible signifie sans ambiguïté « mère »; il n’est pas remplacé par « marié » malgré la reconstruction courante de ce passage.
- source_word: ⲧⲥⲱⲛⲉ
  choice: la sœur
  rationale: Équivalent direct du nom féminin « sœur ».
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: la femme
  rationale: Le mot peut signifier « femme » ou « épouse ». Le texte OCR ne fournit pas ici de complément possessif qui imposerait « épouse »; le choix français conserve donc l’ambiguïté.
theological_decisions:
- issue: Suite d’identités féminines paradoxales
  choice: Conserver littéralement « sage-femme / celle qui n’enfante pas », « mariée / mère » et « sœur / femme »
  alternative: 'Harmoniser avec une reconstruction connue: « mariée et marié », « mère de mon père », « sœur de mon mari »'
  rationale: L’extrait copte fourni porte les termes « mère », « sœur » et « femme » dans cet ordre. Une harmonisation résoudrait les tensions et importerait des mots ou des relations qui ne sont pas lisibles dans ce témoin OCR.
