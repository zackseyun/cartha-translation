base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: fr
  text: 'En tout lieu, ils m’ont appelée « la Mort ».


    Je suis celle qu’ils appellent « la Loi », et vous m’avez appelée « l’Anomie »[a].


    Je suis celle que vous avez poursuivie, et je suis celle que vous avez saisie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Absence de loi », « l’Illégalité » ou « l’Iniquité ». Le terme grec ἀνομία, emprunté en copte, peut désigner l’absence ou la violation de la loi; « Anomie » conserve son lien formel avec « Loi ».'
    reason: Préserve l’éventail sémantique de ἀνομία et explique le choix du terme principal sans réduire le sens à un registre exclusivement moral ou juridique.
lexical_decisions:
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: En tout lieu
  rationale: La segmentation naturelle de la suite OCR ϩⲛⲙⲁⲛⲓⲙ est ϩⲛ (« dans ») + ⲙⲁ (« lieu ») + ⲛⲓⲙ (« tout, chaque »). Cette lecture est plus directement fondée sur le copte que « parmi les peuples ».
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ ϫⲉ
  choice: appeler / nommer « … »
  rationale: Cette construction copte introduit le nom ou le titre attribué à la locutrice. « Appeler » et « appeler du nom de » sont rendus naturellement par « appeler » en français.
- source_word: ⲡⲙⲟⲩ
  choice: la Mort
  rationale: L’article défini copte est conservé; la majuscule signale qu’il s’agit ici d’une appellation donnée à la locutrice.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: la Loi
  rationale: Le terme est un emprunt au grec νόμος. « Loi » garde son sens juridique et moral général sans lui imposer un référent confessionnel précis.
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: l’Absence de loi
  rationale: L’expression conserve l’opposition lexicale entre νόμος et ἀνομία, essentielle au paradoxe, tout en restant compréhensible en français moderne. Une note indique des équivalents plus idiomatiques mais moins formellement parallèles.
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: Je suis celle …
  rationale: La construction copulative est grammaticalement féminine et structure l’anaphore du discours; « celle » préserve ces deux traits.
- source_word: ϣⲁⲩⲙⲟⲩⲧⲉ
  choice: ils appellent
  rationale: La forme exprime ici l’usage habituel, à distinguer du parfait à la deuxième personne du pluriel dans la proposition suivante.
- source_word: ⲁⲧⲉⲧⲛⲙⲟⲩⲧⲉ
  choice: vous m’avez appelée
  rationale: Le parfait à la deuxième personne du pluriel est rendu par le passé composé; l’objet féminin est explicité conformément à la syntaxe française.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: poursuivie
  rationale: Littéralement associé au fait de courir après quelqu’un, l’ensemble a le sens idiomatique de « poursuivre ».
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: saisie
  rationale: « Saisir » garde la force physique du verbe sans préciser indûment s’il s’agit d’une arrestation ou d’une prise violente.
theological_decisions:
- issue: Opposition entre νόμος et ἀνομία
  choice: « la Loi » / « l’Absence de loi »
  alternative: « la Loi » / « l’Iniquité » ou « l’Illégalité »
  rationale: La traduction retenue préserve le lien morphologique et la tension paradoxale entre les deux appellations. « Iniquité » introduirait une coloration morale plus interprétative; « illégalité » limiterait trop facilement le sens au droit positif.
translation_notes:
  register: 'Français moderne, digne et rythmé. La répétition « Je suis celle » est volontaire: elle reproduit l’anaphore et la voix féminine du texte. Les titres paradoxaux prennent une majuscule, tandis que les temps verbaux distinguent l’appellation habituelle (« ils appellent ») des actions accomplies (« vous m’avez appelée », « vous avez poursuivie », « vous avez saisie »).'
