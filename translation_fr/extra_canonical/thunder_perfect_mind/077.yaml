base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
translation:
  language: fr
  text: 'Je suis le silence dans une voix[a].


    Je suis la paix, et c’est à cause de moi que la guerre est survenue.


    Je suis étrangère et citoyenne[b].


    Je suis l’essence, et celle qui n’a pas d’essence[c] ; ceux qui sont hors de mon association[d] ne me connaissent pas[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit transmis par l’OCR porte ⲙⲙⲟⲥ ; la traduction suppose la restitution probable ⲥⲙⲙⲟⲥ, « silence ». « Dans une voix » rend directement la préposition copte ; « au cœur d’une voix » serait une formulation plus interprétative.
    reason: Lecture textuelle incertaine et précision de traduction.
  - marker: b
    text: Le mot traduit par « étrangère » peut aussi se rendre par « personne venue d’ailleurs » ou « étrangère au pays » ; il s’oppose ici à « citoyenne ».
    reason: Alternative lexicale.
  - marker: c
    text: « Essence » traduit le grec οὐσία, qui peut également signifier « substance » ou « être ». La segmentation de cette phrase est difficile, mais la lecture « celle qui n’a pas d’essence » est grammaticalement préférable.
    reason: Ambiguïté lexicale et textuelle.
  - marker: d
    text: « Association » traduit le grec συνουσία, terme qui peut désigner la compagnie, la fréquentation, la vie commune ou l’union sexuelle.
    reason: Ambiguïté sémantique authentique.
  - marker: e
    text: 'L’expression copte est comprise avec le préfixe privatif ⲁⲧ- : littéralement, « ils sont sans connaissance de moi ».'
    reason: Clarification grammaticale.
lexical_decisions:
- source_word: '(ⲥ)ⲙⲙⲟⲥ (OCR : ⲙⲙⲟⲥ) ϩⲛ ⲟⲩϣⲱⲥ'
  choice: le silence au cœur d’une voix
  rationale: La restitution probable de l’initiale ⲥ donne « silence ». « Au cœur de » exprime naturellement ϩⲛ tout en conservant le paradoxe entre silence et voix.
- source_word: ϯⲣⲏⲛⲏ / ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: la paix / la guerre
  rationale: Ces emprunts grecs désignent directement la paix et la guerre ; les articles sont naturels en français et maintiennent l’antithèse.
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: c’est à cause de moi que… est survenue
  rationale: Rend explicitement le rapport causal et le sens d’advenir ou de se produire porté par ϣⲱⲡⲉ.
- source_word: ⲟⲩϣⲙⲙⲱ / ⲟⲩⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: étrangère / citoyenne
  rationale: Le couple français reproduit l’opposition sociale du texte. Le féminin suit la voix locutrice, marquée par les formes coptes féminines.
- source_word: ⲟⲩⲥⲓⲁ
  choice: essence
  rationale: Le terme grec ousia peut signifier essence, substance ou existence ; « essence » conserve ici la portée philosophique et le parallélisme.
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: association
  rationale: Dans la lecture syntaxique retenue, le mot désigne une association ou une fréquentation. Ce choix reste assez large pour ne pas imposer la nuance conjugale ou sexuelle possible du grec.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: ne me connaissent pas
  rationale: 'Analyse ⲁⲧ- comme privatif : ils sont sans connaissance de moi, plutôt que comme une construction causative « font connaître ».'
theological_decisions:
- issue: Rapport paradoxal entre paix et guerre
  choice: « c’est à cause de moi que la guerre est survenue »
  alternative: « c’est pour moi que la guerre est survenue »
  rationale: Le sens causal de ⲉⲧⲃⲏⲏⲧ est retenu sans expliquer le paradoxe ni attribuer à la locutrice une responsabilité doctrinalement définie.
- issue: Lecture de la proposition sur l’ousia
  choice: « celle qui n’a pas d’essence »
  alternative: « celle qui est avec la compagne »
  rationale: La segmentation grammaticale la mieux étayée lit une négation de possession autour de ousia. L’ancienne lecture fondée sur synousia est signalée indirectement par la note sur l’état du texte, sans être adoptée.
translation_notes:
  register: Français moderne, international et dignifié, avec une cadence brève et oraculaire. Les reprises de « Je suis » et les antithèses sont conservées. Le féminin grammatical de la voix locutrice est rendu explicitement par « étrangère », « citoyenne » et « celle ».
