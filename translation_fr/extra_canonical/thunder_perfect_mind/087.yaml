translation:
  language: fr
  text: 'Je suis l’écoute accueillie par tous,

    et la parole qu’on ne peut saisir.[a]


    Je suis votre [appel][b] pour parler,

    et grand est le silence de la parole.


    Écoutez-moi dans la colère,[c]

    et de…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture de la séquence correspondant à « qu’on ne peut saisir » est incertaine dans l’OCR; elle peut désigner une parole impossible à saisir ou à appréhender.
    reason: textual_uncertainty
  - marker: b
    text: Le mot copte lu ⲧⲉⲕⲱ est obscur, probablement mal reconnu ou corrompu. « Appel » est une restitution prudente; « voix » ou une autre expression liée à l’écoute demeure possible.
    reason: textual_uncertainty
  - marker: c
    text: Le copte ϭⲱⲛ est ici compris au sens de « colère, courroux », plutôt que comme une « voix forte ».
    reason: lexical_alternative
  - marker: d
    text: L’extrait s’achève sur ⲛⲧⲉ, qui introduit normalement un complément. La phrase continue donc dans la ligne suivante, absente de cet extrait.
    reason: incomplete_source
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: l’écoute / écoutez
  rationale: Le verbe ⲥⲱⲧⲙ signifie couramment « entendre, écouter ». Avec l’article, il est rendu par le nom « l’écoute »; plus loin, sa forme non précédée de l’article se lit naturellement comme un impératif.
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: accueillie par tous
  rationale: ϣⲏⲡ est compris ici comme le statif de « recevoir, accepter », tandis que ⲟⲩⲟⲛ ⲛⲓⲙ désigne « chacun, tous ». Cette lecture correspond mieux aux formes visibles que « première parmi les êtres ».
- source_word: ⲡϣⲁϫⲉ
  choice: la parole
  rationale: ⲡϣⲁϫⲉ peut désigner la parole, le discours ou l’énoncé. « La parole » garde le parallélisme poétique avec « l’écoute ».
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: qu’on ne peut saisir
  rationale: La séquence OCR est difficile, mais elle est compatible avec une tournure négative d’impossibilité exprimant une parole insaisissable. La traduction reste signalée comme incertaine.
- source_word: ⲧⲉⲕⲱ
  choice: votre [appel]
  rationale: La forme transmise par l’OCR est opaque ou corrompue. « Appel » est une restitution thématique prudente, placée entre crochets pour ne pas masquer l’incertitude textuelle.
- source_word: ⲉⲙⲁϣⲁϫⲉ
  choice: pour parler
  rationale: La construction exprime vraisemblablement le but et contient le verbe « parler ».
- source_word: ⲛⲁϣⲉ
  choice: grand est
  rationale: La forme relève de l’idée d’abondance ou de grandeur; elle ne signifie pas « oreilles ».
- source_word: ⲧⲙⲛⲧϩⲁⲗⲏ ⲛϣⲁϫⲉ
  choice: le silence de la parole
  rationale: La construction génitivale associe paradoxalement le silence et la parole; cette tension poétique est conservée.
- source_word: ϩⲛ ⲟⲩϭⲱⲛ
  choice: dans la colère
  rationale: ϭⲱⲛ est compris comme une forme de ϭⲱⲛⲧ, « colère, courroux », et non comme « voix forte ».
- source_word: ⲛⲧⲉ
  choice: de…
  rationale: La préposition génitive ouvre une construction qui se poursuit au-delà de l’extrait fourni; les points de suspension en marquent l’inachèvement.
theological_decisions:
- issue: Paradoxe entre parole et silence
  choice: Conserver littéralement « le silence de la parole »
  alternative: Expliciter le silence comme absence de parole
  rationale: Le texte juxtapose délibérément des réalités opposées; une explicitation supprimerait sa tension poétique et conceptuelle.
