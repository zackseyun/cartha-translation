  register: Français international actuel, poétique et digne. Le parallélisme des déclarations à la première personne et le paradoxe « silence de la parole » sont maintenus. Les crochets sont réservés à une restitution textuelle véritablement incertaine; les ellipses signalent la coupure matérielle de l’extrait.
