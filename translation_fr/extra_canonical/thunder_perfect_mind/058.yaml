translation:
  language: fr
  text: '**13.** Je suis celle sur qui vous avez fixé votre pensée,[a] et vous m’avez rejetée.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous avez placé dans votre cœur à mon sujet »; autres traductions possibles : « vous avez médité sur moi », « vous m’avez considérée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous m’avez chassée ». Avec ⲉⲃⲟⲗ, le verbe ⲧⲱⲡ peut exprimer l’expulsion.'
    reason: lexical_alternative
  - marker: c
    text: L’extrait OCR présente aussi des expressions telles que « hors de la connaissance » et « dans des lieux sous le ciel », peut-être encore « dans un jugement ». Elles ne sont pas intégrées ici, car l’alignement est de confiance moyenne et elles appartiennent probablement aux membres de phrase voisins.
    reason: alignment_note
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ (avec ϣⲟⲡ)
  choice: fixé votre pensée sur
  rationale: Cette tournure exprime une réflexion intérieure délibérée. « Fixer sa pensée sur » reste naturel en français moderne tout en conservant l’idée d’une attention volontaire et soutenue.
- source_word: ϩⲏⲧ
  choice: pensée
  rationale: Le terme désigne le siège intérieur de la pensée et de l’intention. « Pensée » rend ici la nuance cognitive; le sens littéral « cœur » est signalé en note.
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: rejetée
  rationale: Le composé peut évoquer l’action de chasser ou d’expulser. « Rejetée » exprime clairement le contraste avec l’attention intérieure mentionnée auparavant, sans effacer la possibilité plus concrète donnée en note.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: celle / rejetée
  alternative: celui / rejeté, ou formulation sans marque de genre
  rationale: L’ensemble de l’œuvre met en scène une voix féminine et emploie des auto-identifications féminines. Le français exige ici un choix grammatical; le féminin respecte l’identité littéraire de la locutrice sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure antithétique est maintenue. Le féminin grammatical rend explicite le genre de la voix du texte. Les notes préservent l’idiome du « cœur », la force possible d’expulsion et l’incertitude d’alignement de l’extrait OCR.
