lexical_decisions:
- source_word: ⲧⲛ̄ⲥⲁϩⲟⲩ
  choice: vous maudissez
  rationale: ⲧⲛ̄- marque ici la deuxième personne du pluriel et ⲥⲁϩⲟⲩ signifie « maudire ». La forme transmise n’est pas un impératif négatif ; la traduction conserve donc l’énoncé direct sans ajouter « ne… pas ».
- source_word: ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: ma gloire
  rationale: ⲡⲁ- est le possessif « mon/ma » et ϣⲟⲩϣⲟⲩ peut désigner la gloire, la fierté ou le sujet de vantardise. « Ma gloire » convient au registre poétique tout en laissant « fierté » en note.
- source_word: ⲧⲉⲧϣⲟⲟⲡ ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: celle qui existe dans toute peur
  rationale: La copule et le relatif féminins renvoient à la locutrice. ⲫⲟⲃⲟⲥ est le grec phobos, « peur », et ⲧⲏⲣⲟⲩ exprime la totalité ; « toute peur » garde la portée distributive.
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: la force au cœur du tremblement
  rationale: Le premier terme paraît représenter ⲡⲛⲁϣⲧ, « la force », malgré la lecture OCR ⲡⲛⲏϣⲁⲧ. ⲥⲧⲱⲧ signifie « tremblement ». « Au cœur de » rend naturellement la relation sans effacer le paradoxe.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ
  choice: Je suis celle qui…
  rationale: ⲁⲛⲟⲕ ⲧⲉ est une formule d’identité féminine, suivie du début d’une proposition relative féminine. Le segment étant interrompu, les points de suspension signalent la continuation.
theological_decisions:
- issue: Rapport paradoxal de la locutrice à la peur et au tremblement
  choice: Conserver l’identification à « toute peur » et à « la force au cœur du tremblement »
  alternative: Atténuer en parlant d’une force qui surmonte la peur
  rationale: Le texte juxtapose délibérément peur, force et tremblement. Résoudre ce paradoxe introduirait une interprétation théologique absente du segment.
translation_notes:
  register: Français international actuel, sobre et poétique. La répétition de « je suis celle qui » maintient la cadence féminine du texte copte. Aucun interrogatif ni impératif négatif n’a été ajouté au premier vers, car ils ne figurent pas dans l’extrait transmis.
