  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/037.yaml
  text: 'Do not curse my boast[a].

    But I am she who exists in every fear

    and the strength in trembling[d][c][b][a][c][b].

    I am she who...'
translation:
  language: fr
  text: 'Prenez garde à ma faiblesse[a].


    Mais je suis celle qui est présente dans toute peur,


    et la force dans le tremblement[b].


    Je suis celle qui…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez prudents à l’égard de ma faiblesse » ou « de ma fragilité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le manuscrit est ici difficile à lire ; le premier mot est compris comme « la force ». Plus littéralement : « la force dans un tremblement ».'
    reason: textual_uncertainty
  - marker: c
    text: La proposition relative est interrompue dans cet extrait et se poursuit dans le texte source.
