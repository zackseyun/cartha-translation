- source_word: ⲛⲧⲉ ⲡⲁ… (fragment OCR; lecture attendue liée à « père »)
  choice: de mon père
  rationale: La tradition textuelle du vers et son parallélisme favorisent « mon père », malgré un fragment OCR susceptible d’être confondu avec « ma maison ».
- source_word: ⲧϫⲟⲉⲓⲥ ⲙⲡⲁϫⲡⲟ (OCR; lecture reçue correspondant à « sœur de mon mari »)
  choice: la sœur de mon mari
  rationale: La lecture reçue restitue le paradoxe familial « sœur de mon mari ». La séquence OCR pourrait littéralement suggérer « maîtresse de mon seigneur »; cette possibilité est conservée en note plutôt que résolue silencieusement.
- source_word: ⲛⲧⲟϥ ⲇⲉ ⲡⲉ … (lecture attendue ⲡⲁⲣⲏⲣⲉ/ⲡⲁϣⲏⲣⲉ)
