  rationale: « Enfant » rend naturellement le rapport de filiation sans imposer « fils » lorsque le lexème copte peut couvrir les deux nuances. La dislocation « et lui » marque le pronom emphatique.
theological_decisions:
- issue: Nature des paradoxes familiaux
  choice: Conserver littéralement « mère de mon père », « sœur de mon mari » et « mon enfant »
  alternative: Expliquer ou harmoniser les relations comme des métaphores doctrinales
