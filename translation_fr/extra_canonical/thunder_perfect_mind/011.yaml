translation:
  language: fr
  text: 'Je suis les membres de ma mère[a][b].


    Et je suis la femme stérile — ses enfants sont nombreux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « les parties du corps » ou « les membres du corps », ce qui rendrait l’image anatomique plus explicite.
    reason: lexical_alternative
  - marker: b
    text: La lecture du groupe possessif traduit par « de ma mère » est incertaine dans l’extrait OCR et devra être vérifiée sur une transcription critique de meilleure qualité.
    reason: alignment_note
lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: les membres
  rationale: « Membres » conserve l’image collective des parties du corps tout en gardant une résonance plus large que « membres du corps » ou « bras et jambes ».
- source_word: ⲛⲁϣⲉ
  choice: la femme stérile
  rationale: Le terme désigne ici une femme qui n’enfante pas. La formulation française explicite le genre déjà présent dans le contexte et maintient le paradoxe avec ses nombreux enfants.
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: ses enfants
  rationale: Le pluriel avec possesseur féminin est rendu naturellement par « ses enfants » ; « ses fils » serait possible, mais plus étroit.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis
  rationale: Cette formule préserve la répétition des déclarations identitaires à la première personne, qui structure le poème.
- source_word: ⲁⲩⲱ
  choice: Et
  rationale: La coordination simple maintient l’enchaînement paratactique et ne cherche pas à résoudre le paradoxe.
- source_word: (groupe génitival signifiant « de ma mère »)
  choice: de ma mère
  rationale: Le sens possessif retenu par l’alignement est rendu sans emphase ni majuscule théologique, tout en signalant l’incertitude textuelle dans une note.
