base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: fr
  text: 'La honte et l’audace[a].


    Je suis sans honte ; j’ai honte[b].


    Je suis dure, et je tremble[c].


    Je suis la guerre et la paix.


    Prêtez-moi attention.


    Je suis celle qu’on déshonore[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec passé en copte ⲡⲁⲣⲣⲏⲥⲓⲁ peut aussi se traduire par « assurance », « franchise » ou « liberté de parole ».
    reason: lexical_alternative
  - marker: b
    text: La seconde expression est mal reconnue dans l’OCR ; la lecture probable signifie « j’ai honte » et forme l’antithèse attendue avec « sans honte ».
    reason: textual_uncertainty
  - marker: c
    text: 'Le texte OCR est incertain à cet endroit. On peut aussi comprendre : « Je suis forte, et je suis la peur. »'
    reason: textual_and_lexical_alternative
  - marker: d
    text: La dernière forme est incertaine dans l’OCR et l’extrait s’arrête ici. Elle paraît désigner « celle qui est déshonorée » ; la phrase se poursuit dans les éditions complètes du texte.
    reason: alignment_note
lexical_decisions:
- source_word: ⲡϣⲓⲡⲉ
  choice: la honte
  rationale: Le sahidique ϣⲓⲡⲉ désigne ici la honte, comme le confirment le privatif ⲁⲧϣⲓⲡⲉ (« sans honte ») et le verbe correspondant dans l’antithèse suivante ; « silence » résulte d’une confusion lexicale.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: l’audace
  rationale: L’emprunt grec παρρησία évoque la liberté ou la franchise de parole et, par extension, l’assurance. « Audace » rend naturellement son opposition à la honte sans réduire le mot au seul fait de parler.
- source_word: ⲁⲧϣⲓⲡⲉ
  choice: sans honte
  rationale: Le préfixe privatif ⲁⲧ- joint à ϣⲓⲡⲉ signifie littéralement « sans honte ». Cette tournure française conserve le parallélisme avec « j’ai honte ».
- source_word: ϫⲓⲡⲏⲧ (OCR ; probablement ϫⲓϣⲓⲡⲉ)
  choice: j’ai honte
  rationale: La leçon OCR paraît fautive. La restitution ϫⲓϣⲓⲡⲉ, attendue dans ce passage et parfaitement antithétique à ⲁⲧϣⲓⲡⲉ, exprime le fait d’éprouver la honte.
- source_word: ⲛⲁϣⲧⲉ
  choice: dure
  rationale: Le terme signifie « dur, fort ». « Dure » reste proche de la forme adjectivale transmise, sans imposer le substantif abstrait « force ».
- source_word: ⲣⲙⲧⲉ (OCR incertain)
  choice: je tremble
  rationale: La forme OCR est probablement corrompue. Le contexte textuel et l’antithèse avec ⲛⲁϣⲧⲉ soutiennent une notion de tremblement ou de peur ; la formulation verbale est naturelle en français tout en signalant l’incertitude en note.
- source_word: ⲡⲟⲗⲉⲙⲟⲥ / ϯⲣⲏⲛⲏ
  choice: la guerre / la paix
  rationale: Ces emprunts grecs à πόλεμος et εἰρήνη forment une antithèse directe, rendue par leurs équivalents français usuels.
- source_word: ϯ ϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ
  choice: Prêtez-moi attention
  rationale: 'Ce découpage rétablit l’impératif adressé à plusieurs personnes : littéralement, « donnez votre attention à moi ». Il ne faut pas comprendre ϩⲧⲏⲧ comme « en moi » dans cette séquence.'
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis celle
  rationale: La copule féminine ⲧⲉ marque explicitement la voix féminine de la locutrice.
- source_word: ⲧⲣⲁⲉⲓⲏⲟⲩ (OCR)
  choice: qu’on déshonore
  rationale: La graphie OCR semble représenter une forme liée à ⲧⲁⲉⲓⲟ (« honneur »), avec valeur de déshonneur. La formulation passive française convient au titre ou participe féminin attendu, mais la lecture reste incertaine.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: Maintenir le féminin dans « celle » et dans l’adjectif « dure »
  alternative: Employer des formulations entièrement neutres ou masculines
  rationale: La copule féminine ⲧⲉ fournit un indice grammatical explicite. Le féminin relève donc du texte, non d’une interprétation doctrinale de l’identité de la locutrice.
- issue: Paradoxes identitaires
  choice: Conserver les oppositions sans les expliquer ni les harmoniser
  alternative: Les reformuler comme des états successifs ou comme des qualités de personnes différentes
  rationale: La répétition de « Je suis » attribue délibérément les pôles contraires à une même voix ; résoudre cette tension ajouterait une interprétation absente de l’extrait.
translation_notes:
  register: Français international moderne, sobre et poétique. Les phrases brèves et la répétition de « Je suis » préservent la cadence incantatoire. « Prêtez-moi attention » rend l’adresse au pluriel sans archaïsme. Le point-virgule distingue les deux affirmations étroitement opposées.
