translation:
  language: fr
  text: '**6.** Je suis celle[a] que l’on trouve parmi ceux qui ont peur[b],

    et je suis la force[c] dans le tremblement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte ⲁⲛⲟⲕ (« moi, je ») ne marque pas le genre. Le féminin « celle » correspond à la voix féminine établie dans l’ensemble du traité.
    reason: cultural_note
  - marker: b
    text: 'La construction copte désigne probablement des personnes : « ceux qui ont peur ». On traduit aussi parfois de façon abstraite : « dans toutes les peurs ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot rendu par « force » est attendu d’après le parallélisme et d’autres témoins, mais il n’est pas clairement visible dans cet extrait OCR. La restitution reste donc prudente. La forme verbale précédente peut aussi se rendre par « que l’on trouvera ».
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲛ
  choice: parmi / dans
  rationale: La préposition locative signifie « dans » ou « au milieu de ». « Parmi » convient aux personnes dans le premier membre, tandis que « dans » préserve le contraste concis du second.
- source_word: ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: ceux qui ont peur
  rationale: La construction relative désigne vraisemblablement des personnes qui éprouvent la peur, plutôt que l’abstraction « toutes les peurs ».
- source_word: ϯⲛⲁⲕⲣⲣⲱ
  choice: que l’on trouve
  rationale: Bien que la forme comporte une valeur future, les déclarations identitaires répétées du poème ont ici une portée générale. Le présent français rend naturellement cette valeur gnomique sans effacer l’autre possibilité, signalée en note.
- source_word: ⲁⲛⲟⲕ
  choice: Je suis
  rationale: La formulation explicite maintient l’anaphore identitaire et le rythme paradoxal du poème.
- source_word: ⲛⲉⲧⲕⲗⲏϣ
  choice: le tremblement
  rationale: Le substantif abstrait produit le contraste « force dans le tremblement » ; une analyse personnelle, « ceux qui tremblent », demeure possible.
- source_word: ⲟⲩϩⲟⲟⲩ (restitué)
  choice: la force
  rationale: Le terme attendu signifie « force, vigueur, puissance ». « Force » est clair, sobre et maintient le parallélisme, mais sa présence est restituée à partir du contexte et des témoins plutôt que nettement lisible dans cet extrait OCR.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: celle
  alternative: celui / formulation sans marque de genre
  rationale: Le pronom copte ⲁⲛⲟⲕ ne marque pas le genre, mais la voix féminine est établie dans l’ensemble du traité. Le français exige ici un choix grammatical ; « celle » respecte cette continuité sans ajouter une identification doctrinale.
translation_notes:
  register: Français international actuel, digne et poétique. La syntaxe conserve l’anaphore « Je suis » et le paradoxe entre force et tremblement, tout en employant des expressions immédiatement compréhensibles.
