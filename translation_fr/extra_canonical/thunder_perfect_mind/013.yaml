  yaml_path: translation/extra_canonical/thunder_perfect_mind/013.yaml
  text: 'I am the midwife and the mother.[1]

    I am the virgin[2] and the woman.[1]

    I am the mother of my father[3][2], and the virgin of my—[3]'
translation:
  language: fr
  text: '**8.** Je suis la sage-femme et la mère.[a]


    Je suis la vierge[b] et la femme.


    Je suis la mère de mon père et la vierge de mon—[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs éditions traduisent ici par « celle qui n’enfante pas ». Dans cet extrait, le copte porte cependant ⲧⲙⲁⲁⲩ, « la mère »; la traduction suit ce mot malgré l’alignement seulement moyen de l’extrait.
    reason: Note d’alignement et variante éditoriale
  - marker: b
    text: Le mot copte peut aussi se traduire par « jeune fille ». « Vierge » fait ressortir le contraste avec « femme ».
    reason: Alternative lexicale
  - marker: c
    text: L’extrait conservé s’interrompt après ⲙⲡⲁ, « de mon… ». La suite n’est pas conjecturée.
    reason: Lacune textuelle
lexical_decisions:
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: la sage-femme
  rationale: Terme français courant et précis pour la femme qui assiste un accouchement; il préserve le paradoxe obstétrical avec « la mère ».
- source_word: ⲧⲙⲁⲁⲩ
  choice: la mère
  rationale: Sens nominal direct du copte; ce choix privilégie le lexème attesté dans l’extrait plutôt qu’une reformulation issue de certaines traditions éditoriales.
- source_word: ⲧⲥⲱⲛⲉ
  choice: la vierge
  rationale: Rend le sens de vierge ou jeune fille et maintient l’antithèse frappante avec « la femme ».
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: la femme
  rationale: Traduction générique qui conserve la portée large du terme, sans le restreindre à « épouse ».
- source_word: ⲧⲉ … ⲁⲛⲟⲕ
  choice: Je suis la…
  rationale: Rend naturellement en français la construction copte d’identification focalisée et conserve la cadence répétitive du discours.
- source_word: ⲧⲙⲁⲁⲩ ⲛⲧⲉ ⲡⲁⲉⲓⲱⲧ
  choice: la mère de mon père
  rationale: Traduction directe de la construction génitive, qui laisse intact le paradoxe familial.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁ—
  choice: la vierge de mon—
  rationale: Traduit seulement les mots conservés dans l’extrait et signale l’interruption sans proposer de complément conjectural.
theological_decisions:
- issue: Interprétation des affirmations paradoxales à la première personne
  choice: Conserver les identifications littérales sans les harmoniser ni les expliquer dans le corps du texte
  alternative: Les reformuler comme métaphores ou préciser l’identité théologique de la locutrice
  rationale: Le passage juxtapose délibérément des identités en tension; le texte source ne fournit pas ici de clé permettant de trancher leur portée théologique.
translation_notes:
  register: Français international actuel, sobre et digne. La répétition de « Je suis » et les articles définis reproduisent la cadence des identifications coptes. Le tiret final marque visiblement la rupture de l’extrait.
