  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: fr
  text: '**15.** Ainsi, du sein de la honte, accueillez-moi parmi vous dans l’absence de honte ;


    et, de l’absence de honte avec honte, reprenez mes membres parmi vous[a] ;


    et approchez-vous de vous-mêmes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Membres » peut désigner des parties du corps ou des personnes appartenant à un groupe ; le texte ne tranche pas clairement.
    reason: ambiguïté lexicale
  - marker: b
    text: 'Littéralement, l’expression demande aux destinataires de « s’approcher d’eux-mêmes ». On pourrait comprendre : « tournez-vous vers vous-mêmes », mais cette interprétation n’est pas explicitée dans le texte.'
    reason: idiome et ambiguïté syntaxique
lexical_decisions:
- source_word: ϭⲉ
  choice: ainsi
  rationale: La particule assure la continuité du discours et peut ici être rendue naturellement par « ainsi ».
- source_word: ϣⲓⲡⲉ
  choice: honte
  rationale: Le nom désigne ici la honte ou le déshonneur. « Honte » permet de conserver l’antithèse directe avec le privatif ⲙⲛⲧⲁⲧϣⲓⲡⲉ.
- source_word: ϣⲟⲡⲧ
  choice: accueillez-moi
  rationale: La forme se comprend comme l’impératif de ϣⲱⲡ accompagné du pronom objet de première personne, et non comme une description de la locutrice.
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: absence de honte / sans honte
  rationale: La formation privative signifie littéralement l’absence de honte. Les deux formulations françaises évitent d’imposer partout la nuance morale plus étroite d’« impudence » tout en conservant le paradoxe.
- source_word: ϫⲡⲓⲟ
  choice: reprenez
  rationale: L’impératif exprime l’action de réprimander ou de blâmer. « Reprenez » convient au registre exhortatif et demeure naturel en français.
- source_word: ⲙⲉⲗⲟⲥ
  choice: membres
  rationale: L’emprunt grec peut désigner des membres du corps ou, par extension, des personnes appartenant à un ensemble. Le français « membres » préserve la même ambiguïté.
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ-
  choice: approchez-vous de
  rationale: Cet idiome exprime l’approche. La tournure réfléchie inhabituelle de la source est conservée plutôt que normalisée en une interprétation psychologique.
theological_decisions:
- issue: Nature de l’énoncé
  choice: Suite d’impératifs adressés au pluriel
  alternative: 'Déclaration en « Je suis » : « Je suis celle que vous avez méprisée… »'
  rationale: Les formes ϣⲟⲡⲧ et ϫⲡⲓⲟ sont des impératifs, et le dernier membre est une proposition conjonctive. Traduire par une déclaration identitaire introduirait une construction absente de cet extrait.
- issue: Sens de « mes membres »
  choice: Maintenir l’ambiguïté
  alternative: Préciser « les membres de mon corps » ou « ceux qui m’appartiennent »
  rationale: Le terme source permet une lecture corporelle comme une lecture collective. Aucune précision théologique ne doit être ajoutée sans appui contextuel décisif.
- issue: Réflexivité de la dernière injonction
  choice: « approchez-vous de vous-mêmes »
  alternative: « rentrez en vous-mêmes » ou « tournez-vous vers votre être intérieur »
  rationale: Les alternatives donnent une interprétation spirituelle plus précise que le texte. La formulation retenue conserve l’étrangeté et la tension de l’original.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La répétition « honte / absence de honte » et l’étrangeté de la dernière injonction sont maintenues, car elles participent à la rhétorique paradoxale du passage.
