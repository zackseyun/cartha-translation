base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/114.yaml
  text: '… with those who were sent[a];

    I am the one cast out;

    among the dead — but I am the one who exists alone[g][f][e][d][c][b], and the everlasting.'
translation:
  language: fr
  text: '**5.** … avec ceux qu’ils ont envoyés[a] ;


    je suis celle qui a été chassée[b] ;


    parmi les morts — mais je suis celle qui existe seule[c], et l’éternelle[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « avec ceux qui ont été envoyés ». Le copte comporte un sujet pluriel indéfini (« ils »), et le début de la phrase est perdu ou tronqué.'
    reason: ambiguïté grammaticale et lacune textuelle
  - marker: b
    text: 'Ou : « expulsée », « rejetée au-dehors ».'
    reason: alternative lexicale
  - marker: c
    text: 'Ou : « unique » ; le mot peut exprimer aussi bien la solitude que l’unicité.'
    reason: ambiguïté lexicale
  - marker: d
    text: 'Le mot copte est interrompu à la fin de l’extrait et semble se poursuivre en un terme signifiant « éternité » ou « éternel ». On pourrait aussi traduire : « celle qui est éternelle ».'
    reason: texte tronqué
lexical_decisions:
- source_word: ⲙⲛ̄
  choice: avec
  rationale: La préposition comitative introduit ici le groupe auquel la locutrice est associée.
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: ceux qui ont été envoyés
  rationale: ⲧⲛ̄ⲛⲟⲟⲩ signifie « envoyer ». Le passif français naturel conserve le référent indéfini de ⲩ- ; la lecture littérale « ceux qu’ils ont envoyés » reste possible.
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: chassée
  rationale: L’expression signifie faire sortir ou expulser. « Chassée » garde la force et la brièveté de l’énoncé.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: parmi les morts
  rationale: ⲙⲟⲟⲩⲧ est un statif, « être mort », et non le procès « mourir » ; avec un groupe humain pluriel, ϩⲛ se rend naturellement par « parmi ».
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: celle qui existe
  rationale: ϣⲟⲟⲡ exprime l’existence ou la présence. « Existe » maintient ici la portée existentielle de la formule.
- source_word: ⲟⲩⲁⲁⲧ
  choice: seule
  rationale: Le terme exprime l’isolement ou l’unicité. « Seule » conserve la formulation abrupte et s’accorde avec la voix féminine du discours.
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: l’éternelle
  rationale: La forme tronquée paraît se poursuivre en ⲙⲛⲧⲁⲓⲱⲛ, « éternité, caractère éternel ». La substantivation « l’éternelle » préserve le parallélisme nominal.
theological_decisions:
- issue: Tension entre la présence parmi les morts et l’existence solitaire et éternelle
  choice: Conserver le paradoxe sans l’expliquer ni l’harmoniser
  alternative: Interpréter « les morts » au sens figuré ou préciser la nature de l’éternité
  rationale: Le passage juxtapose délibérément des affirmations tendues, conformément au style antithétique de l’œuvre ; le copte ne fournit aucune résolution explicite.
translation_notes:
  register: Français international actuel, sobre et dignifié. Les propositions brèves et le parallélisme reproduisent la cadence oraculaire. Le féminin rend la voix féminine qui parle dans l’ensemble de l’œuvre, sans développer une interprétation doctrinale.
