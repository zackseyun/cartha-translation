translation:
  language: fr
  text: '**5.** … au-dehors, et vous m’avez connue au-dedans.[a] Je suis celle devant qui vous avez eu honte, et vous vous êtes montrés impudents. Je suis celle qui ne célèbre pas de fêtes, et je suis celle dont les fêtes sont nombreuses. Moi, moi, je suis sans dieu, et je suis celle dont le dieu est grand.'
