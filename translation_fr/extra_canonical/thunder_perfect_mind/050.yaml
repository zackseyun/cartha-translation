  source_fidelity: 'Révision nécessaire. Le texte fourni ne correspond pas au couple « haïe / aimée partout » de l’ancienne cartographie, et la traduction doit suivre l’extrait copte. Le début reste fragmentaire. En revanche, la séquence après « vous avez été sans honte » correspond au parallélisme attesté « je suis celle qui ne célèbre pas de fêtes, et je suis celle dont les fêtes sont nombreuses »; la lacune introduite dans le projet efface donc un énoncé que le contexte textuel permet de restituer avec une bonne sécurité. La finale conserve correctement le paradoxe : « je suis sans dieu » puis « celle dont le dieu est grand ».'
  naturalness: Le français proposé est généralement sobre et idiomatique. « Vous avez été sans honte » est intelligible mais moins naturel et moins précis que « vous vous êtes montrés impudents », qui rend le contraste sans transformer le texte en jugement moral fort. « Au-dehors / au-dedans » et la reprise emphatique « Moi, moi » conviennent au rythme du passage.
  terminology: « Sans dieu » rend bien le privatif copte et doit rester en minuscule afin de ne pas identifier le référent. La voix féminine doit être maintenue. La formule finale est mieux rendue par « celle dont le dieu est grand » que par une interprétation théologique de ce dieu. « Fêtes » rend ici le vocabulaire des célébrations/festivals sans imposer un cadre cultuel déterminé.
