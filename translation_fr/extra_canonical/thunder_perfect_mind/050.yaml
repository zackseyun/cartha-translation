    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲁⲧⲉⲧⲛⲥⲟⲟⲩⲛ … ϩⲧⲉϩⲟⲩⲛ
  choice: vous m’avez connue au-dedans
  rationale: Le parfait « vous avez connu » est rendu directement; l’objet féminin « me » est rétabli d’après la syntaxe et le contexte immédiat de l’énonciatrice. « Au-dedans » maintient l’opposition spatiale avec « au-dehors ».
- source_word: ⲧⲉⲛⲧⲁⲧⲉⲧⲛ ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: celle devant qui vous avez eu honte
  rationale: La tournure relative et la préposition exprimant la présence ou la face sont conservées dans un français naturel.
- source_word: ⲁⲧⲉⲧⲛⲣⲁⲧϣⲓ
  choice: vous avez été sans honte
  rationale: Cette formulation garde le contraste lexical avec « avoir honte » et rend la formation privative sans l’atténuer en simple audace.
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: sans dieu
  rationale: Le composé privatif ⲁⲧ- + ⲛⲟⲩⲧⲉ est rendu littéralement. « Impie » ajouterait une condamnation morale qui n’est pas nécessairement exprimée.
- source_word: ⲉⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ (lecture probable de l’OCR ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ)
  choice: celle dont le dieu est grand
  rationale: La lecture probable signifie que son dieu est grand ou puissant. La construction possessive est rendue sans identifier ce dieu ni résoudre le paradoxe avec « sans dieu ».
theological_decisions:
- issue: Paradoxe entre « sans dieu » et « dont le dieu est grand »
  choice: Conserver les deux affirmations côte à côte et écrire « dieu » en minuscule
  alternative: « impie » puis « son Dieu »
  rationale: Le passage juxtapose volontairement des identités en tension. La minuscule évite d’identifier d’office le référent au Dieu d’une tradition déterminée, tandis que « sans dieu » respecte la morphologie privative.
- issue: Genre de la voix qui parle
  choice: Employer les formes féminines « connue » et « celle »
  alternative: Neutraliser par « c’est moi que… »
  rationale: Les formes coptes de l’auto-identification sont féminines dans ce passage; le français doit rendre ce trait grammatical et poétique.
translation_notes:
  register: Français international actuel, sobre et poétique. La répétition « Moi, moi » et les oppositions « au-dehors / au-dedans », « honte / sans honte », « sans dieu / dieu grand » reproduisent la cadence antithétique du texte. Les points de suspension signalent uniquement les limites ou l’incertitude du témoin fourni.
