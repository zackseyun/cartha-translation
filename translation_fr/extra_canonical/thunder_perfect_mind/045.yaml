base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: fr
  text: 'Grecs et barbares,


    je suis celle dont l’image est multiple en Égypte[a],

    et celle qui n’a pas d’image parmi les barbares.


    Je suis celle qu’ils ont haïe en tout lieu[b],

    et celle qu’ils ont aimée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se traduire : « dont l’image est grande » ou « dont les images sont nombreuses ». Le copte exprime l’abondance ou la multiplicité.'
    reason: lexical_alternative
  - marker: b
    text: La forme transmise est incertaine, mais la lecture « haïe » est favorisée par son opposition immédiate à « aimée ». « Méprisée » est également possible. L’expression suivante signifie probablement « en tout lieu », mais pourrait se comprendre « parmi tous » selon la segmentation.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲉⲗⲗⲏⲛ ⲙⲛ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: Grecs et barbares
  rationale: Les deux emprunts grecs forment l’opposition ethnoculturelle traditionnelle. Le pluriel convient à cette adresse ou reprise fragmentaire.
- source_word: ⲧⲛⲁϣⲉ ⲡⲉⲥⲉⲓⲛⲉ
  choice: celle dont l’image est multiple
  rationale: ⲉⲓⲛⲉ signifie ici « image, ressemblance », et ⲛⲁϣⲉ exprime l’abondance ou la multiplicité. « Multiple » conserve l’étrangeté poétique sans confondre ⲉⲓⲛⲉ avec ⲥⲉⲓⲛⲉ, « silence ».
- source_word: ϩⲛ ⲕⲏⲙⲉ
  choice: en Égypte
  rationale: Traduction française courante du nom géographique copte ⲕⲏⲙⲉ.
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ
  choice: celle qui n’a pas d’image
  rationale: La construction comporte le possessif négatif « elle n’a pas » suivi de ⲉⲓⲛⲉ, « image »; elle ne désigne pas la « non-silence ».
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: qu’ils ont haïe
  rationale: La lecture « haïe » rend l’antithèse avec ⲙⲉⲣⲓⲧⲥ, « aimée », tout en respectant la voix féminine du poème.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: en tout lieu
  rationale: L’OCR agglutine vraisemblablement l’expression locative signifiant « dans chaque lieu »; « en tout lieu » en garde le rythme solennel.
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: qu’ils ont aimée
  rationale: Le parfait à sujet pluriel et objet féminin établit le contraste direct entre haine et amour.
theological_decisions:
- issue: Identité de la locutrice
  choice: Maintenir les formes féminines « celle », « haïe » et « aimée »
  alternative: Employer une formulation neutre telle que « c’est moi » sans accords visibles
  rationale: La copule et les suffixes coptes présentent explicitement la voix comme féminine; la traduction ne doit ni l’effacer ni lui attribuer une identité doctrinale plus précise.
- issue: Paradoxe de l’image
  choice: Conserver l’opposition entre une image multiple en Égypte et l’absence d’image parmi les barbares
  alternative: Interpréter l’image comme une idole, une réputation ou une manifestation spirituelle déterminée
  rationale: Le texte ne précise pas la nature de l’« image »; garder le terme ouvert préserve la tension poétique et théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « celle » reproduit l’anaphore identitaire du copte. « Barbares » est conservé comme terme historique opposé à « Grecs », sans ajout d’une nuance morale absente du passage.
