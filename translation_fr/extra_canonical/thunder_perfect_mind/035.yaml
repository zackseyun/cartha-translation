base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: fr
  text: '**13.** Ne méprisez pas ma petitesse ;


    et ma maîtrise de soi envers vous : aimez-la dans ma pauvreté.[a]


    Ne riez pas trop de moi.[b]


    Ne méprisez pas ma faute,[c]


    et ne maudissez pas ma vantardise.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La relation de « vous » à « maîtrise de soi » est ambiguë : on peut aussi comprendre « ma maîtrise de soi à votre sujet », « sur vous » ou, plus littéralement, « de vous ».'
    reason: alignment_note
  - marker: b
    text: L’expression copte marque l’intensité ; on peut aussi traduire « ne vous moquez pas excessivement de moi ».
    reason: lexical_alternative
  - marker: c
    text: Les derniers membres suivent une lecture normalisée du texte copte ; le relevé OCR est difficile à segmenter à cet endroit.
    reason: textual_alignment
  - marker: d
    text: Le terme peut aussi se rendre par « fanfaronnade » ou « jactance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: Ne méprisez pas
  rationale: L’impératif négatif ⲙ̄ⲡⲣ̄ avec ⲙⲉⲥⲧⲉ exprime ici le mépris ou le dédain. « Mépriser » convient au ton de l’appel sans renforcer inutilement en « haïr ».
- source_word: ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: petitesse
  rationale: Le nom abstrait désigne une condition basse ou insignifiante. « Petitesse » conserve cette nuance sans transformer le terme en vertu morale comme pourrait le faire « humilité ».
- source_word: ⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: maîtrise de moi
  rationale: L’emprunt grec ἐγκράτεια désigne la maîtrise de soi ou la retenue. La tournure possessive s’accorde naturellement avec la voix féminine à la première personne.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: aimez-la
  rationale: La séquence est comprise comme une construction exhortative à la deuxième personne du pluriel, avec un pronom objet féminin renvoyant à ⲉⲅⲕⲣⲁⲧⲉⲓⲁ, plutôt que comme « ma maîtrise de moi envers vous ».
- source_word: ⲙⲛ̄ⲧϭⲱⲃ
  choice: faiblesse
  rationale: Le radical ϭⲱⲃ couvre la faiblesse, le dénuement ou la pauvreté. « Faiblesse » rend directement l’état abstrait et maintient le contraste avec la maîtrise de soi.
- source_word: ⲕⲱ ⲧⲏⲛⲉ
  choice: vous moquez pas de moi outre mesure
  rationale: Le contexte appelle l’idée de rire de quelqu’un ou de s’en moquer, tandis que ⲧⲏⲛⲉ intensifie l’action. « Outre mesure » garde cette valeur scalaire.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲛ̄ⲧⲁⲣⲓⲕⲉ
  choice: méprisez pas ma faute
  rationale: La lecture normalisée distingue le verbe grec d’origine καταφρονεῖν, « mépriser », et le syntagme « ma faute ». Elle est préférable à une lecture produite par la segmentation fautive de l’OCR.
- source_word: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: maudissez pas ma vantardise
  rationale: ⲥⲁϩⲟⲩ est ici le verbe « maudire », et ϣⲟⲩϣⲟⲩ désigne la vantardise ou l’orgueil affiché. Cette analyse évite la confusion avec un autre mot copte signifiant « assemblée ».
theological_decisions:
- issue: Rapport paradoxal entre maîtrise de soi et faiblesse
  choice: Conserver les deux affirmations côte à côte sans les harmoniser
  alternative: Interpréter la faiblesse comme pauvreté matérielle ou expliquer la maîtrise de soi comme puissance spirituelle
  rationale: Le passage juxtapose délibérément des qualités ou états en tension. La traduction ne doit pas résoudre cette tension par une interprétation doctrinale.
- issue: Valeur morale de « faute » et de « vantardise »
  choice: Employer les termes directs « faute » et « vantardise »
  alternative: Les atténuer en « imperfection » et « fierté », ou les réinterpréter positivement
  rationale: La voix du poème revendique des prédicats opposés. Les termes moralement difficiles doivent rester visibles plutôt que d’être corrigés théologiquement.
translation_notes:
  register: Français international actuel, sobre et digne. Le vouvoiement pluriel rend l’adresse collective du copte. Le rythme en courtes injonctions préserve la forme oraculaire et les contrastes du poème, sans archaïsmes ni explicitation confessionnelle.
