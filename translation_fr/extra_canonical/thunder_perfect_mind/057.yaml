base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: fr
  text: '**12.** Ceci est à moi[a] :


    Je suis sortie d’une terre,

    et vous êtes issus d’une connaissance ;

    la terre est en vous[b] — vous recevez ceux du dehors, en divers lieux.

    '
  philosophy: optimal-equivalence
  footnotes:
