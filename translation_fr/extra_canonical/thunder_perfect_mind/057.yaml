  terminology: « Terre », « connaissance » et « ceux du dehors » préservent les termes sans les charger d’une interprétation doctrinale. Le féminin de « sortie » est recevable dans le contexte de cette locutrice féminine, bien que la forme copte isolée ne porte pas elle-même de marque de genre.
