lexical_decisions:
- source_word: ⲉⲓⲉⲃⲟⲗ ϩⲛⲟⲩⲕⲁϩ
  choice: Je suis sortie d’une terre
  rationale: ⲉⲓ ⲉⲃⲟⲗ ϩⲛ exprime ici la provenance (« sortir de, venir de »), et ⲕⲁϩ signifie « terre, sol », non « ténèbres ». Le féminin français suit l’identité féminine de la locutrice dans l’œuvre.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ ϩⲛⲟⲩⲉⲡⲓⲥⲧⲏⲙ
  choice: vous êtes issus d’une connaissance
  rationale: La construction parallèle ⲉⲃⲟⲗ ϩⲛ marque plus naturellement l’origine ou la provenance que la manifestation. « Connaissance » rend le nom grec emprunté ἐπιστήμη sans lui imposer un sens technique supplémentaire.
- source_word: ⲕⲁϩ
  choice: terre
  rationale: 'Sens lexical normal de ⲕⲁϩ : « terre, sol ». « Ténèbres » demanderait normalement ⲕⲁⲕⲉ.'
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ
  choice: vous recevez
  rationale: La forme correspond au verbe ϣⲱⲡ, « recevoir, prendre, acquérir », et non à un verbe signifiant « chercher ».
- source_word: ⲛⲉⲃⲟⲗ
  choice: ceux du dehors
  rationale: La forme est comprise comme un groupe nominal pluriel désignant ceux qui sont à l’extérieur, plutôt que comme le simple adverbe « dehors ».
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: en divers lieux
  rationale: ϩⲛ introduit ici un complément locatif et le pluriel indéfini de l’emprunt grec τόπος est rendu en français naturel par « en divers lieux ».
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: Ceci est à moi
  rationale: Le texte OCR et sa segmentation sont incertains. Cette traduction minimale conserve la valeur démonstrative et possessive proposée sans reconstruire un nom absent ou mal reconnu.
theological_decisions:
- issue: Rapport entre la terre, la connaissance et l’intériorité
  choice: Conserver les affirmations juxtaposées sans les expliquer théologiquement
  alternative: Interpréter la terre comme le monde matériel et la connaissance comme une réalité salvatrice
  rationale: L’extrait ne précise pas lui-même la valeur symbolique de ces termes. Une explicitation doctrinale supprimerait l’ambiguïté et la tension du passage.
translation_notes:
  register: Français international actuel, sobre et poétique. Le parallélisme entre « d’une terre » et « d’une connaissance » est maintenu. Le pluriel de « vous » est conservé ; le féminin de « sortie » reflète la locutrice féminine de l’œuvre.
