lexical_decisions:
- source_word: ⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: Recevez mon enseignement
  rationale: La tournure associe l’impératif pluriel de « prendre/recevoir » à « enseignement, instruction ». Cette formulation conserve le contenu didactique tout en restant naturelle en français.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  choice: avec douceur
  rationale: « Douceur » rend clairement la qualité de mansuétude ou de modestie exprimée ici, sans le ton vieilli de « mansuétude ».
- source_word: ⲧⲉⲧϭⲱ ⲉⲃⲟⲗ
  choice: celle qui demeure
  rationale: La leçon manuscrite reconnue derrière l’OCR défectueux exprime l’action de rester ou de demeurer. Le féminin respecte la forme copte et la voix féminine du poème.
- source_word: ϩⲓϫⲙ ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: sur la face de la terre
  rationale: Cette expression garde l’image concrète et la solennité de l’idiome copte, plutôt que de l’aplanir en « à la surface de la terre ».
- source_word: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ
  choice: celle qui est rejetée
  rationale: Le verbe signifie ici jeter ou rejeter au-dehors. Le passif français restitue naturellement la construction et son contraste avec « demeure ».
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: la préparation
  rationale: Le substantif désigne la préparation ou l’action de préparer, et non la peur. Le nom abstrait préserve l’énoncé énigmatique du texte.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: de tout être humain
  rationale: Cette formulation inclusive conserve la portée distributive de « chaque/tout » et le sens général de « personne, être humain ».
theological_decisions:
- issue: Identité et rôle de la locutrice comme « préparation »
  choice: Conserver littéralement « Je suis la préparation de tout être humain »
  alternative: Je suis celle qui prépare tout être humain
  rationale: Le copte présente un substantif défini et laisse ouverte la nature exacte de cette « préparation ». Une reformulation agentive résoudrait indûment l’ambiguïté théologique et poétique.
- issue: Contraste entre présence et exclusion
  choice: demeure / est rejetée
  alternative: subsiste / est chassée
  rationale: Le contraste est maintenu sans préciser si l’exclusion est sociale, cosmique ou spirituelle.
