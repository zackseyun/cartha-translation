  source_fidelity: 'La traduction restitue correctement les trois antithèses et la forme féminine de la locutrice : ⲧⲉⲧϭⲱ ⲉⲃⲟⲗ (« celle qui demeure »), ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ (« celle qui est jetée/rejetée ») et ⲧⲥⲟⲃⲧⲉ (« la préparation »). Toutefois, ⲙⲏϣⲉ signifie normalement « multitude, foule, grand nombre », non « douceur ». L’extrait étant OCR et ayant déjà produit plusieurs lectures fautives, il convient de signaler cette difficulté plutôt que de présenter « douceur » comme assuré. ⲉⲣⲟⲉⲓ est mieux rendu par « de moi » que par le possessif « mon ».'
