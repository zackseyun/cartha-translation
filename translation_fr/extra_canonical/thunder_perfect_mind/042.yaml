    text: 'L’extrait OCR est fortement déformé. La traduction suit les mots reconnaissables du texte du codex : « Grecs », « barbare », « connaissance » et « jugement ». Les lectures « malade », « médecin » et « port » résultent ici de segmentations erronées de l’OCR.'
    reason: textual_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ
  choice: Pourquoi donc
  rationale: Rend la question causale et la valeur discursive de ⲅⲁⲣ sans alourdir le français.
- source_word: ⲛⲉⲓⲉⲗⲗⲏⲛ (lecture rétablie derrière l’OCR ⲡⲉⲓⲛⲗⲏⲛ)
  choice: ô Grecs
  rationale: L’OCR fusionne et déforme vraisemblablement la désignation des Grecs ; l’apostrophe française conserve l’adresse directe reconnue dans le passage.
- source_word: ⲧⲃⲁⲣⲃⲁⲣⲟⲥ (lecture rétablie derrière l’OCR ⲧⲉⲙⲁⲩⲉⲣⲟⲥ)
  choice: une barbare
  rationale: Le terme grec emprunté signifie « barbare » ; le féminin français s’accorde avec la voix féminine de la locutrice.
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: la connaissance
  rationale: Traduction directe du nom copte désignant la connaissance, sans le réduire à la simple possession d’un savoir.
- source_word: ⲡϩⲁⲡ (OCR ⲫⲁⲡ)
  choice: le jugement
  rationale: Le copte ϩⲁⲡ désigne le jugement ou la sentence ; « jugement » préserve ici la déclaration concise et son amplitude possible.
theological_decisions:
- issue: Portée de « la connaissance du Grec et du barbare »
  choice: 'Conserver le génitif ambigu : « la connaissance du Grec et du barbare »'
  alternative: « celle qui connaît le Grec et le barbare » ou « la connaissance que possèdent le Grec et le barbare »
  rationale: La construction peut évoquer soit une connaissance ayant ces groupes pour objet, soit une connaissance qui leur appartient. La formulation retenue ne tranche pas artificiellement.
translation_notes:
  register: Français international actuel, digne et rythmé. L’apostrophe « ô Grecs » garde la solennité poétique du discours ; « une barbare » rend explicitement en français la voix féminine de la locutrice. Le parallélisme et les déclarations brèves sont conservés.
