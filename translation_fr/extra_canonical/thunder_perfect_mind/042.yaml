base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/042.yaml
  text: For why do you hate me[a], O Greeks? Because I am a barbarian? And I am the knowledge of the Greek and the barbarian[d][c][b]. I am the judgment.
translation:
  language: fr
  text: '**7.** Pourquoi donc me haïssez-vous, ô Grecs ? Parce que je suis une barbare ? Et je suis la connaissance du Grec et du barbare. Je suis le jugement.[a]'
  philosophy: optimal-equivalence
  footnotes:
