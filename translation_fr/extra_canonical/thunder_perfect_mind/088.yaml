    text: Les lignes précédentes (« écoutez… recevez un enseignement… ») indiquent que ce bloc se trouve à la limite du prologue; seule la dernière déclaration introduite par « Je suis… » est traduite ici. Le dernier mot, ϩⲓϫⲙ (« sur », « au-dessus de »), se rattache probablement à la ligne suivante.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis
  rationale: Rend directement la prédication emphatique à la première personne. La marque grammaticale féminine portée par ⲧⲉ ne peut être exprimée naturellement dans cette tournure française sans ajout interprétatif.
- source_word: ⲧⲁϣϭⲏⲗ
  choice: la maîtrise de soi
  rationale: Expression française actuelle et claire pour la retenue ou la tempérance; elle convient au contraste paradoxal avec son contraire.
- source_word: ⲉⲕⲟⲗ
  choice: l’absence de maîtrise de soi
  rationale: Maintient explicitement l’antithèse lexicale sans réduire le sens au seul dérèglement sexuel que pourrait suggérer « débauche ».
- source_word: ϩⲓϫⲙ
  choice: '[non traduit dans ce segment]'
  rationale: Cette préposition, « sur » ou « au-dessus de », paraît introduire un complément situé dans la ligne suivante; la traduire isolément créerait une proposition artificiellement inachevée.
