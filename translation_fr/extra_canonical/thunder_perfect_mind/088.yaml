  text: '**4.** Je suis la maîtrise de soi et l’absence de maîtrise de soi.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Maîtrise de soi » peut aussi se traduire par « retenue », « discipline » ou « tempérance ». Son contraire, ⲉⲕⲟⲗ, peut désigner le manque de retenue, l’intempérance ou le dérèglement.
    reason: lexical_alternative
