  source_fidelity: L’extrait copte, bien que manifestement corrompu par l’OCR et d’alignement seulement moyen, soutient la reconstruction nominale « connaissance » / « ignorance » et, dans la seconde assertion, « jugement ». Il ne soutient pas de façon sûre le couple adjectival « sans intelligence / sage » de l’actuelle piste anglaise. Les pluriels « Grecs » et « barbares » correspondent aux groupes introduits par ⲛ-. La préposition ⲉⲣⲟⲥ est mieux rendue par « à son égard » que par un génitif français.
  naturalness: Le français du projet est sobre et convient au registre oraculaire. « L’ignorance de celle-ci » est toutefois moins idiomatique et atténue la valeur relationnelle de ⲉⲣⲟⲥ. « L’ignorance à son égard » est à la fois plus naturel et plus proche de la construction source, tout en maintenant l’antécédent incertain.
  terminology: « Connaissance », « ignorance » et « jugement » sont précis et cohérents. « Barbares » conserve, comme terme historique, l’opposition gréco-romaine sans la moderniser. Aucune interprétation théologique n’est ajoutée.
