  language: fr
  text: 'à celui qui m’a donné l’existence.[a]


    C’est moi qui crierai son nom.


    Regardez donc ses paroles

    et tous les écrits qui ont été menés à leur terme.


    Écoutez donc, vous qui écoutez,

    et vous aussi, vous tous, les anges…[b]'
