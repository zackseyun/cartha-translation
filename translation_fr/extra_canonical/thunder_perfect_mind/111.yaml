lexical_decisions:
- source_word: ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: celui qui m’a donné l’existence
  rationale: Le verbe ⲧⲁⲙⲓⲟ signifie « créer, façonner ». Cette formulation naturelle évite d’imposer en français un genre grammatical à la voix qui dit « me » tout en conservant l’idée de création.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: C’est moi qui
  rationale: La tournure emphatique française rend mieux l’assertion copulative et prépare naturellement le futur qui suit.
- source_word: ⲧⲛⲁⲭⲱ … ⲉⲃⲟⲗ
  choice: crierai
  rationale: Malgré l’OCR incertain, le contexte manuscrit reconstruit une proclamation à voix haute. « Crierai » conserve la force concrète de l’énoncé sans l’interpréter comme un acte liturgique précis.
- source_word: ϣⲁϫⲉ
  choice: paroles
  rationale: Dans ce contexte, le pluriel renvoie aux paroles attribuées à la personne dont le nom vient d’être évoqué; « paroles » convient mieux que l’abstrait « discours ».
- source_word: ⲛⲉⲥϩⲁⲓ (reconstruction derrière l’OCR ⲛⲉⲥⲙⲏ)
  choice: écrits
  rationale: La lecture reconstruite signifie « écrits » et s’accorde avec le verbe d’achèvement; elle évite la fausse lecture « voix » produite par l’OCR.
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: vous qui écoutez
  rationale: Le nom d’emprunt grec désigne des auditeurs. La périphrase est plus courante et plus directe en français moderne que « auditeurs » dans cette apostrophe poétique.
theological_decisions:
- issue: Rapport entre la locutrice et son créateur
  choice: celui qui m’a donné l’existence
  alternative: mon Créateur
  rationale: Le texte parle de « celui qui m’a créée/façonnée » sans fournir ici un titre divin formel ni préciser l’identité de ce créateur. La traduction maintient cette réserve.
- issue: Identité des « anges » à la fin du fragment
  choice: les anges
  alternative: des messagers
  rationale: Le terme d’emprunt peut signifier « anges » ou « messagers ». Dans cette adresse à une catégorie d’auditeurs, « anges » est probable, mais la coupure empêche de préciser leur fonction ou leur statut.
