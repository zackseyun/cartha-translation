lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧϭⲟⲟⲃ
  choice: C’est moi qui suis faible
  rationale: La construction copte est une formule d’identification au féminin. Cette tournure française conserve l’insistance de ⲁⲛⲟⲕ (« moi ») et rend naturellement la proposition relative.
- source_word: ⲉⲉⲓⲟⲩⲧⲁϫⲣⲟ
  choice: je suis forte
  rationale: Dans ce contexte antithétique, le membre exprime la force ou la fermeté de la locutrice. « Je suis forte » répond directement à « je suis faible » sans introduire l’exhortation du texte de consultation, qui n’est pas appuyée par le copte cité.
theological_decisions:
- issue: Identité féminine de la locutrice
  choice: 'Accords féminins : « faible » (épicène) et « forte »'
  alternative: Neutraliser le genre ou reformuler avec un nom abstrait
  rationale: Le copte emploie ⲧⲉ, copule féminine, et la voix de l’œuvre se présente au féminin. Le français doit donc conserver cette donnée grammaticale et littéraire.
- issue: Rapport paradoxal entre faiblesse et force
  choice: Maintenir les deux affirmations coordonnées
  alternative: Les transformer en propositions temporelles ou en impératifs
  rationale: Le texte source formule une identité paradoxale. Le rendre par « quand je suis faible » ou par « ne m’abandonnez pas » résoudrait ou remplacerait indûment cette tension.
translation_notes:
  register: Français moderne, sobre et solennel. La tournure clivée « C’est moi qui… » garde l’emphase de la formule copte, tandis que la coordination brève préserve le paradoxe caractéristique du passage.
