lexical_decisions:
- source_word: ⲭⲓⲥⲃⲱ (probablement pour ϫⲓⲥⲃⲱ)
  choice: recevez l’enseignement
  rationale: La forme transmise par l’OCR paraît fautive. La lecture ϫⲓⲥⲃⲱ signifie « recevoir une instruction, apprendre » ; cette traduction exprime naturellement la construction avec ⲉ-, « auprès de / de ».
- source_word: ⲉⲛⲁⲯⲩⲭⲏ
  choice: de mes âmes
  rationale: ⲛⲁ- marque explicitement le possessif de première personne avec un nom pluriel. Le pluriel surprenant est conservé au lieu d’être normalisé en « mon âme ».
- source_word: ⲥⲟⲟⲩⲛ
  choice: connaissent
  rationale: Le verbe désigne ici la connaissance ou la reconnaissance ; « connaître » convient au refrain d’auto-identification.
- source_word: ⲡⲥⲱⲧⲙ
  choice: l’écoute
  rationale: Le substantif dérivé de « entendre » est rendu par un nom afin de préserver le parallélisme poétique avec « la parole ».
- source_word: ϣⲏⲡ
  choice: accessible
  rationale: Dans ce contexte, le mot peut évoquer ce qui est disponible ou à portée. « Accessible » garde cette idée sans exclure les autres nuances possibles.
- source_word: ⲛϩⲱⲃ ⲛⲓⲙ
  choice: à toute chose
  rationale: L’expression de totalité est conservée avec son caractère très large, sans la limiter arbitrairement à toutes les personnes.
- source_word: ⲡϣⲁϫⲉ
  choice: la parole
  rationale: « Parole » restitue à la fois l’énoncé et l’acte de parler, tout en gardant la cadence de l’auto-identification.
- source_word: ⲙⲁϩⲧⲉ
  choice: saisir
  rationale: '« Saisir » conserve les deux valeurs possibles du verbe : prendre physiquement et comprendre intellectuellement.'
theological_decisions:
- issue: Le pluriel « mes âmes »
  choice: Conserver le pluriel explicite
  alternative: Normaliser en « mon âme » ou « vos âmes »
  rationale: Le pluriel possessif de première personne appartient au texte source et sa difficulté ne doit pas être résolue par une harmonisation théologique.
- issue: Le « Je suis » final sans attribut
  choice: Le maintenir comme une formule inachevée
