review_pass:
  verdict: revise
  source_fidelity: 'La correction du cadre intérieur/extérieur est bien fondée : ⲥⲁϩⲟⲩⲛ et ⲥⲁⲛⲃⲟⲗ désignent l’intérieur et l’extérieur, et ⲡⲉⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟϥ est une relative (« ce que vous voyez »), non un impératif. Toutefois, « une image de ce qui est au-dedans de vous » introduit « ce qui est », absent de la proposition source, là où le copte dit que le référent tronqué a été fait figure/image « en vous ». « Cela se manifeste » affaiblit aussi la valeur descriptive attestée par l’audit (« il est visible/manifeste »).'
  naturalness: Le français est globalement clair et conserve une diction poétique. « Il est visible » et « auditeurs » sont plus directs et plus fidèles que « Cela se manifeste » et « vous qui entendez ».
  terminology: « Image » est un rendu acceptable de ⲧⲩⲡⲟⲥ, sans surinterpréter la figure. « Au-dedans / au-dehors » préserve utilement l’antithèse. L’émendation signalée pour « votre vêtement » doit rester explicitement notée, car la leçon OCR fournie est difficile.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « une image de ce qui est au-dedans de vous »
    rationale: Le texte source place « en vous/à l’intérieur de vous » comme complément de l’action de faire une figure; il ne fournit pas l’expression nominale « ce qui est au-dedans de vous ». La reformulation ajoute une identification qui n’est pas nécessaire.
  - severity: low
    issue: « Cela se manifeste » ne rend pas au plus près la prédication descriptive
    rationale: Selon la lecture retenue dans l’audit source, ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ signifie « il est visible/manifeste ». « Cela se manifeste » suggère davantage un procès de dévoilement.
  - severity: low
    issue: Rendu du vocatif ⲁⲕⲣⲟⲁⲧⲏⲥ
    rationale: « Auditeurs » est un équivalent moderne, naturel et directement nominal du grec ἀκροατής; « vous qui entendez » déplace légèrement le sens vers l’acte d’entendre.
  revised_text: … de vous[a], il en a fait une image en vous. Et ce que vous voyez au-dehors de vous, vous me voyez au-dedans de vous. Il est visible, et c’est votre vêtement[b]. Écoutez-moi, auditeurs.[c]
  revised_footnotes:
