lexical_decisions:
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: faire une image
  rationale: Le verbe formé sur le grec τύπος évoque une figure, une empreinte ou un modèle. « Image » reste naturel en français tout en préservant la relation entre réalité intérieure et apparence extérieure.
- source_word: ⲥⲁϩⲟⲩⲛ / ⲥⲁⲛⲃⲟⲗ
  choice: au-dedans / au-dehors
  rationale: Ces expressions spatiales forment ici une antithèse intérieur/extérieur, plutôt qu’une opposition entre personnes proches et lointaines.
- source_word: ⲡⲉⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟϥ
  choice: ce que vous voyez
  rationale: La construction contient l’article relatif ⲡⲉⲧ- et une forme verbale à la deuxième personne du pluriel; il ne s’agit donc pas d’un impératif « regardez ».
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: se manifeste
  rationale: L’expression signifie devenir visible ou manifeste. Cette lecture évite de la confondre avec le verbe ⲱⲛϩ, « vivre ».
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: vous qui entendez
  rationale: Le mot emprunté au grec ἀκροατής désigne des auditeurs. La tournure choisie conserve le lien rhétorique avec l’impératif « écoutez » sans employer le peu naturel « entendeurs ».
theological_decisions:
- issue: Identité du référent dans la première proposition tronquée
  choice: Conserver une formulation pronominale sans identifier le référent
  alternative: Identifier ce référent à une personne, à l’être intérieur ou à une réalité divine
  rationale: L’extrait commence au milieu d’une phrase et le contexte fourni ne permet pas de déterminer avec assurance l’antécédent. Une identification théologique explicite dépasserait les données du texte.
- issue: Rapport entre l’intérieur, l’extérieur et le vêtement
  choice: Préserver les images juxtaposées sans les expliquer
  alternative: Interpréter le vêtement comme le corps, l’apparence ou une enveloppe spirituelle
  rationale: Le passage maintient une tension poétique entre visibilité extérieure et présence intérieure; il ne définit pas lui-même la portée symbolique du vêtement.
translation_notes:
  register: Français international moderne, poétique et digne. L’antithèse « au-dedans / au-dehors » est rendue avec un parallélisme net. Le début fragmentaire reste explicitement marqué, et l’émendation nécessaire à « votre vêtement » est signalée plutôt que dissimulée.
