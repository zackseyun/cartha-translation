base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
translation:
  language: fr
  text: … de vous[a], il en a fait une image de ce qui est au-dedans de vous. Et ce que vous voyez au-dehors de vous, vous me voyez au-dedans de vous. Cela se manifeste, et c’est votre vêtement[b]. Écoutez-moi, vous qui entendez.[c]
  philosophy: optimal-equivalence
