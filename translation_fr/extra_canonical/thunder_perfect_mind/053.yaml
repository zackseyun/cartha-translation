base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
translation:
  language: fr
  text: '**8.** Je suis celle que vous avez méprisée,


    et je suis celle à laquelle vous avez réfléchi.


    Je suis celle que vous avez saisie,


    et je suis celle à qui vous avez donné la vie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait OCR se poursuit par une proposition incomplète (« ⲟⲩⲁⲛ ⲇⲉ ⲉⲧⲉⲧⲛϣⲁⲛϩⲱⲡ ⲙⲙⲱⲧⲛ »), qui appartient vraisemblablement au bloc suivant ; elle n’est pas traduite ici afin de ne pas en imposer une reconstitution.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis celle
  rationale: L’article prédicatif féminin maintient explicitement la voix féminine de la locutrice, sans l’aplanir en une formule neutre.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: mépriser
  rationale: Cet emprunt au grec καταφρονέω signifie regarder de haut ou mépriser, et non persécuter.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: réfléchir à moi
  rationale: La construction désigne la locutrice comme objet de la pensée. « Réfléchir à » conserve l’indétermination du contexte sans durcir le sens en « comploter contre ».
- source_word: ϩⲱⲡ ⲉⲣⲟⲉⲓ
  choice: saisir
  rationale: Le verbe exprime l’action de prendre ou de s’emparer de quelqu’un; « saisir » préserve sa force sans imposer le sens plus précis d’« arrêter ».
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: donner la vie à
  rationale: L’emploi transitif signifie rendre vivant ou donner la vie. La tournure française choisie est naturelle et conserve le contraste avec « saisir ».
theological_decisions:
- issue: Portée de « donner la vie »
  choice: Traduction littéraire non interprétative de l’emploi transitif
  alternative: maintenir en vie / ranimer
  rationale: Le contexte ne permet pas de déterminer s’il s’agit de création, de réanimation ou de préservation; « donner la vie » garde cette ouverture.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des quatre affirmations est conservé. Le début ⲛ̄ⲧⲟⲟⲧ est compris comme la fin de la proposition précédente (« de moi »), non comme une adresse signifiant « quant à vous ».
