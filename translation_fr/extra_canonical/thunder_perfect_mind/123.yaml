  text: '**7.** Celui qui viendra à l’existence[a]. Je suis le pardon, et celui qui viendra à l’existence[a]. Je suis le pardon, et celui qui viendra à l’existence[a]. Je suis le pardon, et celui qui viendra à l’existence…[b]'
