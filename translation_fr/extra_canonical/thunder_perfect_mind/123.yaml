lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  choice: celui qui viendra à l’existence
  rationale: Le relatif substantivé masculin ⲡⲉⲧ- favorise « celui qui », tandis que le futur de ϣⲱⲡⲉ exprime l’idée de venir à l’existence, devenir ou advenir. Cette formulation respecte la valeur personnelle probable sans effacer l’ambiguïté lexicale.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Je suis
  rationale: La construction équative forme ici une déclaration d’identité directe et répétée; « Je suis » en conserve la force et la cadence.
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: le pardon
  rationale: Le nom est un emprunt au grec συγγνώμη, qui peut désigner le pardon, l’indulgence ou la clémence. « Le pardon » est clair en français et convient à la formule d’identité.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Le coordonnant copte courant relie les unités répétées; « et » maintient simplement leur enchaînement.
theological_decisions:
- issue: Identification de la voix avec ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: Je suis le pardon
  alternative: Je suis l’indulgence / la clémence
  rationale: Le texte formule une identité sans en expliquer la portée théologique. La traduction conserve cette affirmation et signale seulement l’éventail lexical en note, sans l’interpréter selon une doctrine particulière.
