translation:
  language: fr
  text: 'Et quand vous vous cachez[a][b][c],

    c’est moi que l’on verra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot copte ⲥⲙⲓⲛⲉ peut aussi avoir le sens de « devenir petits » ou « vous abaisser »; on pourrait donc traduire : « Et quand vous devenez petits, c’est moi que l’on verra. »'
    reason: lexical_alternative
  - marker: b
    text: L’extrait fourni contient également des expressions telles que « au commencement de la création » et « l’apparence visible d’un petit enfant »; elles appartiennent vraisemblablement aux lignes voisines. Seule la proposition correspondant à ce bloc est traduite ici.
    reason: alignment_note
  - marker: c
    text: 'Si le dernier ⲙⲡⲣⲙⲉⲥⲧⲱⲥ appartient à cette unité, une autre lecture est possible : « Et ne vous cachez pas; c’est moi que l’on verra. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: vous vous cachez
  rationale: Ce choix conserve l’antithèse poétique entre le fait de se cacher et celui d’être vu. Le sens « devenir petits / vous abaisser » demeure toutefois possible et est signalé en note.
- source_word: ⲙⲓⲉ
  choice: que l’on verra
  rationale: Cette formulation française naturelle garde la valeur passive ou résultative de « devenir visible / être vu » et fait ressortir le renversement entre dissimulation et visibilité.
- source_word: ⲁⲩⲱ
  choice: Et
  rationale: La conjonction simple respecte le mouvement cumulatif du poème sans ajouter une opposition absente du mot source.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. La tournure emphatique « c’est moi que » reproduit l’insistance de l’énoncé identitaire, tandis que « l’on verra » reste naturelle et digne. Les incertitudes lexicales et d’alignement sont conservées dans les notes plutôt que résolues silencieusement.
