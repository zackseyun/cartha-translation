translation:
  language: fr
  text: '**11.** Je suis celle qui ne célèbre aucune fête[a],

    et je suis celle dont les fêtes sont nombreuses[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fête » peut aussi se traduire par « festivité » ou, dans un contexte cultuel, par « fête religieuse »; le terme sous-jacent semble être un emprunt au grec ἑορτή.
    reason: lexical_alternative
  - marker: b
    text: La formulation peut aussi signifier « dont les fêtes abondent » ou « dont les fêtes sont en grand nombre »; la lecture de ⲕⲁϩ reste provisoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧ(ⲉⲟⲣⲧⲏ)
  choice: ne célèbre aucune fête
  rationale: Le composé privatif, probablement formé avec l’emprunt grec désignant une fête, exprime l’absence de célébration. Cette formulation française est naturelle tout en conservant le sens cultuel concret et l’opposition paradoxale.
- source_word: ϩⲛ ⲟⲩ ⲕⲁϩ (phrase)
  choice: sont nombreuses
  rationale: La lecture provisoire suggère la multitude ou l’abondance. « Sont nombreuses » maintient clairement le parallélisme antithétique sans trancher au-delà de ce que permet l’extrait OCR.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Conjonction simple qui relie les deux membres paradoxaux.
- source_word: ⲡⲁⲓ … (construction relative)
  choice: Je suis celle qui / dont
  rationale: La tournure conserve la voix féminine, l’anaphore « Je suis » et le parallélisme du poème; « dont » donne un français idiomatique dans le second membre.
