translation:
  language: fr
  text: Car je suis la première et la dernière[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Voir Ésaïe 44.6 et Apocalypse 22.13 pour des formules semblables : « Je suis le premier et je suis le dernier ».'
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ peut aussi se traduire par « la fin ». La traduction « la dernière » est retenue ici pour préserver le parallélisme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: Car
  rationale: La particule introduit la raison de l’exhortation précédente; « Car » conserve clairement ce lien logique et le ton solennel.
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: je suis
  rationale: La construction d’identification est rendue naturellement en français par « je suis »; le féminin des attributs respecte la forme féminine du copulatif et la voix de la locutrice.
- source_word: ⲧϣⲟⲣⲡ
  choice: la première
  rationale: Le terme signifie « première » ou « commencement ». Ici, employé comme titre identitaire et mis en parallèle avec ⲑⲁⲉ, « la première » préserve le balancement de la formule.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: La conjonction coordonne simplement les deux titres opposés.
- source_word: ⲑⲁⲉ
  choice: la dernière
  rationale: Le mot peut désigner ce qui est dernier ou la fin. « La dernière » maintient ici la symétrie avec « la première » sans effacer l’autre sens possible, signalé en note.
theological_decisions:
- issue: Écho possible à des formules bibliques de souveraineté divine
  choice: Conserver littéralement la formule paradoxale « la première et la dernière » et indiquer les parallèles en note
  alternative: Identifier explicitement la locutrice à Dieu dans le corps du texte
  rationale: Le texte présente une formule comparable à Ésaïe 44.6 et Apocalypse 22.13, mais ce seul segment ne justifie pas d’imposer une identification théologique précise.
translation_notes:
  register: Français international actuel, sobre et solennel. Le féminin (« la première », « la dernière ») suit la grammaire copte et la voix féminine de la locutrice. La cadence brève de l’affirmation originale est conservée.
