base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: fr
  text: 'Et moi, je suis celle dont les fêtes sont nombreuses[a].


    Moi, je suis sans Dieu,


    et je suis celle dont Dieu est grand.


    Je suis celle à qui vous avez pensé,


    et vous m’avez méprisée.


    Je suis sans instruction,


    et eux, ils apprennent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte copte transmis par l’extrait OCR est incertain à cet endroit. La lecture adoptée correspond à une restitution courante du passage : « celle dont les fêtes sont nombreuses ».'
    reason: incertitude_textuelle
  - marker: b
    text: L’expression copte signifie littéralement « prendre enseignement ». Le sujet est à la troisième personne du pluriel ; le texte ne précise pas explicitement auprès de qui ils apprennent.
    reason: précision_lexicale
lexical_decisions:
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: sans Dieu
  rationale: Le préfixe privatif ⲁⲧ- associé à ⲛⲟⲩⲧⲉ (« dieu/Dieu ») signifie littéralement « sans Dieu ». Cette formulation conserve le paradoxe avec le vers suivant sans introduire les connotations modernes du mot « athée ».
- source_word: ⲧⲉ ⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ (lecture derrière l’OCR ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ)
  choice: celle dont le Dieu est grand
  rationale: La construction relative exprime « celle dont… », ⲡⲉⲥⲛⲟⲩⲧⲉ étant « son Dieu » et ⲛⲁϣⲉ indiquant la grandeur. Elle forme une antithèse directe avec « sans Dieu ».
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: à qui vous avez pensé
  rationale: En copte, la préposition avec pronom résomptif signifie idiomatiquement « penser à moi ». La relative française évite de reproduire lourdement le pronom résomptif.
- source_word: ϣⲟⲥⲧ
  choice: méprisée
  rationale: Le verbe signifie « mépriser, dédaigner, rejeter ». Le féminin s’accorde avec la voix féminine qui s’identifie comme « celle ».
- source_word: ⲁⲧⲥⲃⲱ
  choice: sans instruction
  rationale: Le composé privatif signifie « non instruite, sans enseignement ». « Sans instruction » conserve le lien lexical avec le fait d’apprendre tout en évitant la nuance péjorative excessive d’« ignorante ».
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: apprennent
  rationale: Littéralement « prendre enseignement », cette expression signifie idiomatiquement « apprendre ». La particule ⲉⲃⲟⲗ n’exige pas ici un équivalent français distinct.
theological_decisions:
- issue: Paradoxe entre l’absence de Dieu et la grandeur de Dieu
  choice: « je suis sans Dieu » / « celle dont le Dieu est grand »
  alternative: « je suis athée » / « celle dont Dieu est grand »
  rationale: La traduction maintient sans l’expliquer la tension théologique voulue entre les deux affirmations et conserve la relation possessive indiquée par le copte.
- issue: Majuscule à « Dieu »
  choice: Dieu
  alternative: dieu
  rationale: Dans ce contexte, la désignation vise une divinité conçue comme Dieu; la majuscule française est naturelle, sans résoudre l’identité de ce Dieu ni imposer une lecture confessionnelle.
translation_notes:
  register: Français international actuel, sobre et rythmé. La répétition de « je suis » et les antithèses sont maintenues. « Eux, ils apprennent » rend explicitement le contraste porté par le pronom pluriel copte sans ajouter « de moi », absent de l’extrait.
