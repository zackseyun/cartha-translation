translation:
  language: fr
  text: '**6.** Je suis la substance et celle qui est sans substance[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte ⲁⲙⲡⲉ peut aussi désigner les « biens », les « ressources » ou les « moyens »; son contraire peut donc se comprendre comme « dépourvue de biens » aussi bien que « sans substance ».
    reason: lexical_alternative
  - marker: b
    text: L’OCR donne ⲉⲧⲁⲙⲁⲧⲉ, probablement pour ⲁⲧⲁⲙⲡⲉ (« sans substance » ou « sans biens »). La présence, dans l’extrait fourni, de mots signifiant notamment « natures », « création » et « âmes » semble provenir de lignes voisines; l’alignement de ce segment reste donc incertain.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲙⲡⲉ (dans ⲛⲁⲙⲡⲉ)
  choice: substance
  rationale: Le terme peut désigner les biens ou les ressources, mais aussi se prêter ici à une lecture plus abstraite. « Substance » maintient cette amplitude et rend nettement l’antithèse paradoxale.
- source_word: 'ⲁⲧⲁⲙⲡⲉ (restitution probable : préfixe privatif ⲁⲧ- + ⲁⲙⲡⲉ)'
  choice: sans substance
  rationale: Cette formulation reproduit directement la construction privative et conserve le paradoxe sans imposer une interprétation uniquement matérielle ou ontologique.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: celle qui est sans substance
  alternative: celui qui est sans substance
  rationale: Le discours met en scène une voix féminine; « celle » rend ce cadre littéraire explicite sans résoudre la portée théologique de l’énoncé.
translation_notes:
  register: 'Français international moderne, sobre et dignifié. La répétition de « substance » est volontaire : elle préserve la symétrie et la tension paradoxale du copte, plutôt que de les expliquer dans le corps du texte.'
