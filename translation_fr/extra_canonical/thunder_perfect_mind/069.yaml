base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: fr
  text: '**6.** Je suis l’intelligence[a],


    et mon repos.


    Je suis la connaissance de ma quête de moi-même,


    et la quête de ceux qui me cherchent,


    et le commandement de ceux qui me sollicitent[b],


    et la voix des voix du lieu des dieux[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’intellect ». Le mot copte transcrit le grec νοῦς, qui peut désigner l’intelligence, l’intellect ou l’esprit comme faculté de connaissance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ceux qui me demandent » ou « de ceux qui m’adressent une demande ».'
    reason: lexical_alternative
  - marker: c
    text: La fin du mot est probablement perdue ou abrégée dans le texte transmis. La lecture « des dieux » restitue vraisemblablement le pluriel grec; on pourrait aussi lire, plus littéralement d’après les lettres conservées, « de Dieu » ou « du dieu ».
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: l’intelligence
  rationale: Emprunt au grec νοῦς, qui désigne l’esprit ou la faculté intellective. « Intelligence » conserve ici la valeur cognitive sans suggérer simplement un esprit immatériel.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: mon repos
  rationale: Le préfixe possessif féminin de première personne ⲧⲁ- impose « mon »; ⲁⲛⲁⲡⲁⲩⲥⲓⲥ, emprunt grec, signifie repos, cessation ou apaisement.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: la connaissance
  rationale: Nom courant formé sur le verbe « connaître »; « connaissance » préserve la formulation abstraite du texte.
- source_word: ⲙⲡⲁϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: de ma quête de moi-même
  rationale: La lecture corrigée reconnaît ϣⲓⲛⲉ, « chercher », suivi de ⲛⲥⲁ- avec suffixe de première personne, « après moi ». « Quête de moi-même » rend naturellement le mouvement réflexif.
- source_word: ⲡϣⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: la quête de ceux qui me cherchent
  rationale: La répétition de ϣⲓⲛⲉ est conservée par « quête / cherchent »; ⲛⲥⲱⲉⲓ signifie ici « après moi », et non « petit ».
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: le commandement
  rationale: ⲟⲩⲁϩⲥⲁϩⲛⲉ est le nom copte usuel pour un ordre ou un commandement; il ne doit pas être décomposé artificiellement comme « union » et « compagnie ».
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: de ceux qui me sollicitent
  rationale: Le verbe d’origine grecque signifie demander ou adresser une requête. « Me sollicitent » rend l’idée d’une demande adressée à la locutrice sans préciser indûment son contenu.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: la voix des voix
  rationale: ⲥⲙⲏ signifie « voix » ou « son », non « nom ». La répétition est maintenue comme dans le texte.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: du lieu des dieux
  rationale: La fin transmise semble abrégée ou endommagée; ⲛⲑⲉⲱ est vraisemblablement une forme tronquée de ⲛⲑⲉⲱⲛ, « des dieux », lecture cohérente avec le contexte pluriel.
theological_decisions:
- issue: Identité de la locutrice avec le νοῦς
  choice: Je suis l’intelligence
  alternative: Je suis l’esprit / l’intellect
  rationale: La traduction conserve l’affirmation d’identité directe sans identifier la locutrice à une figure doctrinale particulière.
- issue: Nombre dans « lieu des dieux »
  choice: des dieux
  alternative: de Dieu / du dieu
  rationale: Le probable rétablissement de la finale grecque plurielle soutient « des dieux », mais l’état du témoin exige de signaler l’incertitude plutôt que de normaliser vers un monothéisme explicite.
translation_notes:
  register: Français international actuel, sobre et poétique. Le parallélisme anaphorique et les répétitions du copte sont conservés. « Quête » rend le substantif de recherche de manière naturelle, tandis que les notes signalent les principales ambiguïtés lexicales et textuelles sans imposer une lecture confessionnelle.
