base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: fr
  text: '**17.** Ceux qui disent la vérité à mon sujet mentent à mon sujet,


    et ceux qui ont menti à mon sujet disent la vérité à mon sujet.


    Que ceux qui me connaissent m’ignorent,


    et que ceux qui n’ont pas eu connaissance de moi apprennent à me connaître.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’extrait OCR fourni s’interrompt au début de la dernière proposition. La suite est restituée d’après la séquence continue attestée pour ce passage : « et que ceux qui n’ont pas eu connaissance de moi apprennent à me connaître ».'
    reason: textual_scope
lexical_decisions:
- source_word: ⲙⲉ ⲉⲣⲟⲓ
  choice: la vérité à mon sujet
  rationale: ⲙⲉ désigne ici la vérité, avec ⲉⲣⲟⲓ au sens de « à mon sujet » ; cette lecture correspond au parallélisme antithétique avec ϫⲓϭⲟⲗ.
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ
  choice: mentent à mon sujet
  rationale: Dans cette construction, ϫⲓϭⲟⲗ exprime le fait de mentir ou de proférer un mensonge. « Mentent à mon sujet » rend directement l’opposition entre vérité et mensonge.
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: ceux qui me connaissent
  rationale: Le verbe ⲥⲟⲟⲩⲛ signifie « connaître, savoir ». Le complément personnel est rendu naturellement en français par « me connaissent ».
- source_word: ⲁⲧϭⲉ
  choice: m’ignorent
  rationale: La forme négative exprime ici l’absence de connaissance. Le subjonctif français après « que » restitue la valeur injonctive du paradoxe plutôt qu’un futur indicatif.
- source_word: ⲛⲉⲧⲉⲙⲡⲟⲩ…
  choice: ceux qui ne me connaissent pas
  rationale: Le parfait négatif copte est rendu idiomatiquement par le présent français dans cette maxime générale, sans imposer une distinction temporelle artificielle.
theological_decisions:
- issue: Tension entre connaissance et ignorance
  choice: 'Conserver les deux injonctions opposées : « m’ignorent » et « apprennent à me connaître »'
  alternative: Interpréter l’ignorance comme une simple prédiction ou expliquer de quel type de connaissance il s’agit
  rationale: Le passage formule délibérément un paradoxe. La traduction ne précise donc ni connaissance salvatrice ni ignorance coupable, notions que le texte ne développe pas ici.
- issue: Genre de la voix qui parle
  choice: Éviter dans ce segment les accords français qui imposeraient explicitement un genre
  alternative: Employer « ceux qui ne m’ont pas connue », avec accord féminin
  rationale: Bien que l’ensemble de l’œuvre présente une voix féminine, les formes coptes de ce segment ne marquent pas grammaticalement le genre de la première personne. La formulation retenue reste naturelle tout en préservant cette donnée.
translation_notes:
  register: Français international moderne, sobre et rythmé. La répétition de « à mon sujet » et le parallélisme sont maintenus afin de préserver la structure paradoxale. « Apprennent à me connaître » est plus idiomatique que la répétition stricte « me connaissent » et conserve la valeur d’entrée dans la connaissance.
