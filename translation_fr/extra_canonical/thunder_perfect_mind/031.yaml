base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/031.yaml
  text: …leave me as I come forth[a]. And you will seek me in riches[c][b]. And do not look at me as I come forth among those who are honored…
translation:
  language: fr
  text: …vous me laissez tandis que je viens au-dehors. Et vous me trouverez dans la richesse. Et ne me regardez pas tandis que je viens au-dehors parmi ceux qui sont honorés[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait copte s’arrête après le début du dernier mot ; « ceux qui sont honorés » repose sur la continuation du mot ⲛⲉⲧⲧⲁ(ⲉⲓⲏⲩ) dans le manuscrit.
    reason: textual_scope
lexical_decisions:
- source_word: ⲉⲧⲛⲕⲁⲁⲧ
  choice: vous me laissez
  rationale: La forme se comprend comme ⲕⲱ, « laisser », avec un objet de première personne du singulier; l’extrait commence au milieu d’une construction, d’où l’ellipse initiale.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: tandis que je me manifeste
  rationale: La construction circonstancielle à la première personne signifie littéralement « tandis que je viens/sors au-dehors ». « Je me manifeste » exprime naturellement en français cette apparition publique, sans en faire à tort un impératif pluriel.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vous me trouverez
  rationale: Le futur de ϭⲓⲛⲉ désigne ici le fait de trouver, et non celui de chercher; ⲙⲙⲟⲉⲓ marque « me » comme objet.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: dans la richesse
  rationale: Le nom abstrait dérivé de ⲣⲙⲁⲟ renvoie à la richesse ou à l’opulence; « richesse » convient au contexte sans transformer le terme en « grandeur ».
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: Ne me regardez pas non plus
  rationale: ⲙⲡⲣ- porte la défense et ⲛⲁⲩ ⲉ- signifie « regarder »; ⲟⲩⲇⲉ relie négativement cette injonction à son contexte antérieur.
- source_word: ⲛⲉⲧⲧⲁ(ⲉⲓⲏⲩ)
  choice: ceux qui sont honorés
  rationale: La fin visible ⲛⲉⲧⲧⲁ est le début, coupé par la limite de l’extrait, de l’expression désignant « ceux qui sont honorés »; la restitution est signalée en note.
theological_decisions:
- issue: Sens de la manifestation de la locutrice
  choice: me manifeste
  alternative: sors / viens au-dehors
  rationale: La traduction garde le mouvement d’apparition de ⲉⲓ … ⲉⲃⲟⲗ sans préciser l’identité de la locutrice ni imposer une interprétation théologique de cette manifestation.
- issue: Contraste entre richesse et honneur
  choice: conserver les deux catégories sans les harmoniser
  alternative: interpréter la richesse ou l’honneur de façon morale ou spirituelle
  rationale: Le passage juxtapose des milieux socialement valorisés; la traduction ne décide pas si ces termes doivent être compris matériellement, symboliquement ou ironiquement.
translation_notes:
  register: Français international actuel, sobre et poétique. Les ellipses indiquent que l’extrait commence et finit au milieu d’une phrase. « Se manifester » évite la lourdeur de « venir au-dehors » tout en préservant l’idée d’une apparition; la répétition est maintenue pour respecter la cadence du texte.
