- from: '**12.** Et ne me rejetez pas parmi ceux qui manquent de toute valeur[a] ; car moi, moi, je suis compatissante, et je suis sans cœur. Ne haïssez pas mon obéissance ; et ma maîtrise de moi, aimez-la dans ma faiblesse.'
  to: '**12.** Mais ne me jetez pas dehors parmi ceux qui manquent d’inutilité[a] ; car moi, moi, je suis compatissante, et je suis sans cœur. Ne haïssez pas mon obéissance ; et ma maîtrise de soi, aimez-la dans ma faiblesse.'
  rationale: La révision rétablit l'orientation lexicale du syntagme relatif sans importer l'image absente du tas de fumier ni l'interprétation inverse « gens sans valeur ». Elle remplace également « maîtrise de moi » par la collocation française standard « maîtrise de soi », tout en préservant la répétition, les impératifs pluriels, le féminin de la voix parlante et les paradoxes du texte.
