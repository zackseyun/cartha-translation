base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: fr
  text: '**12.** Mais ne me jetez pas dehors parmi ceux qui manquent d’inutilité[a] ; car moi, moi, je suis compatissante, et je suis sans cœur. Ne haïssez pas mon obéissance ; et ma maîtrise de soi, aimez-la dans ma faiblesse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom abstrait évoque l’« inutilité » ou l’« absence d’utilité ». La construction « ceux qui manquent d’inutilité » est inhabituelle et son sens précis demeure incertain ; elle est maintenue afin de ne pas transformer le paradoxe du copte en « ceux qui manquent de valeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: ne me rejetez pas
  rationale: Le prohibitif suivi du verbe composé exprime l’action de jeter dehors ou de rejeter. Le complément « me » est fourni par la voix de la locutrice et le contexte immédiat.
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: ceux qui manquent de toute valeur
  rationale: La construction associe « ceux qui manquent » à un nom abstrait apparenté au grec désignant l’inutilité ou l’absence de valeur. La formulation conserve l’étrangeté du paradoxe sans introduire l’image non attestée d’un tas de fumier.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: compatissante
  rationale: L’expression désigne littéralement une personne au cœur tendre. « Compatissante » est naturel en français et maintient l’opposition avec « sans cœur ».
- source_word: ⲟⲩⲁⲧϩⲏⲧ
  choice: sans cœur
  rationale: Traduction proche de la forme copte, qui préserve le contraste abrupt avec « compatissante » au lieu de l’atténuer.
- source_word: ⲙⲉⲥⲧⲉ
  choice: haïssez
  rationale: Le verbe est une forme de ⲙⲟⲥⲧⲉ, « haïr », et non un verbe signifiant « laisser » ou « abandonner ».
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: mon obéissance
  rationale: Le nom abstrait est rattaché à la racine « entendre, écouter, obéir ». « Obéissance » convient ici mieux que les anciennes propositions « humiliation » ou « disgrâce ».
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: ma maîtrise de moi
  rationale: Le terme emprunté au grec ἐγκράτεια désigne la maîtrise de soi ou la retenue. Cette tournure reste claire tout en permettant la reprise pronominale féminine.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: aimez-la
  rationale: La forme est issue du verbe « aimer » et renvoie à la maîtrise de soi ; elle ne signifie pas « vous la trouverez ».
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: ma faiblesse
  rationale: Le nom abstrait dérive de l’adjectif « faible » ; il ne désigne ni un royaume ni une royauté.
theological_decisions:
- issue: Paradoxe entre compassion et absence de cœur
  choice: Maintenir « je suis compatissante, et je suis sans cœur »
  alternative: Harmoniser les deux qualités ou rendre la seconde par « ferme »
  rationale: Le poème construit délibérément une série d’affirmations opposées. Les résoudre supprimerait sa tension rhétorique et théologique.
- issue: Rapport entre maîtrise de soi et faiblesse
  choice: Conserver « aimez-la dans ma faiblesse »
  alternative: Expliquer que la maîtrise de soi se manifeste malgré la faiblesse
  rationale: La préposition et le paradoxe sont laissés ouverts ; le texte ne précise pas si la maîtrise se trouve au sein de la faiblesse, s’y manifeste ou lui est opposée.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le pluriel « vous » reflète les formes coptes. Le féminin de « compatissante » suit la voix féminine qui parle dans l’ensemble de l’œuvre. La répétition « moi, moi » et les paradoxes sont conservés. L’amorce finale tronquée ⲙ̄ⲡⲣ̄, qui ouvre la proposition suivante, n’est pas traduite dans ce segment.
