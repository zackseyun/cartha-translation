base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: fr
  text: 'Ceux qui me renient me confessent[a],

    et ceux qui me confessent me renient.


    Ceux qui disent la vérité à mon sujet mentent à mon sujet,

    et ceux qui mentent à mon sujet disent la vérité à mon sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte anglais de consultation associé à ce segment commence par « Je suis la voix dont le son est multiple… », mais le copte fourni contient les deux paradoxes sur le reniement et la confession, puis sur la vérité et le mensonge. Il semble donc y avoir un décalage d’alignement dans cette partie de la page; la traduction suit le copte.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: renier
  rationale: Ce verbe, emprunté au grec ἀρνεῖσθαι, signifie nier ou désavouer. « Renier » conserve ici la portée personnelle et confessionnelle ainsi que l’antithèse avec « confesser ».
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: confesser
  rationale: L’emprunt au grec ὁμολογεῖν peut signifier reconnaître, déclarer ou confesser. « Confesser » maintient le registre religieux et judiciaire du paradoxe, sans en atténuer la force.
- source_word: ⲛⲉⲧ–
  choice: ceux qui
  rationale: Le déterminant relatif introduit une proposition substantivée. « Ceux qui » en est l’équivalent français naturel et neutre.
- source_word: ⲙ̄ⲙⲟⲉⲓ / ⲉⲣⲟⲓ
  choice: me / à mon sujet
  rationale: Le premier marque l’objet direct de la première personne; le second, dans les expressions « dire vrai » et « mentir », se rend naturellement par « à mon sujet ».
- source_word: ϫⲉ ⲙⲉ ⲉⲣⲟⲓ
  choice: disent la vérité à mon sujet
  rationale: La construction signifie littéralement « disent vrai à mon sujet ». La formulation retenue est idiomatique tout en conservant le sens.
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲓ
  choice: mentent à mon sujet
  rationale: L’expression désigne le fait de dire un mensonge ou de mentir concernant la locutrice; cette traduction préserve le parallélisme avec « disent la vérité ».
theological_decisions:
- issue: Paradoxe entre reniement et confession, vérité et mensonge
  choice: Conserver les deux antithèses sans les expliquer ni les harmoniser
  alternative: Interpréter ces affirmations comme une distinction entre connaissance extérieure et connaissance véritable
  rationale: Le texte formule délibérément des renversements paradoxaux. Toute explicitation doctrinale réduirait une ambiguïté constitutive du discours.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Renier » et « confesser » gardent la vigueur du registre confessionnel; la répétition de « à mon sujet » reproduit le parallélisme insistant du copte. Le dernier couplet repose en partie sur une restitution sûre du passage malgré les corruptions manifestes de l’OCR.
