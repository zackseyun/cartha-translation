base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: fr
  text: '**5.** Soyez vigilants,[a] et, quant à votre écoute, ne soyez pas sourds à mon égard, en quelque lieu que ce soit ou dans quelque autre pensée[b] ; et ne restez pas dans l’ignorance à mon sujet. Car je suis la première, et je suis la dernière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez sur vos gardes » ; « Soyez attentifs ».'
    reason: L’impératif peut exprimer la vigilance, la prudence ou l’attention.
  - marker: b
    text: La délimitation de cette proposition dans les lignes conservées est incertaine ; elle peut être rattachée différemment à l’exhortation qui précède ou à celle qui suit.
    reason: L’extrait est aligné de manière heuristique et la ponctuation n’appartient pas au manuscrit.
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: Soyez vigilants
  rationale: L’impératif appelle à la vigilance ou à l’attention. Cette formulation garde le ton solennel de l’exhortation sans imposer l’image plus précise d’une garde défensive.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: quant à votre écoute
  rationale: Le groupe signifie « votre écoute » plutôt que « vous qui écoutez ». La tournure détachée conserve cette construction quelque peu inhabituelle.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  choice: ne soyez pas sourds
  rationale: Le prohibitif accompagné de la formation privative exprime le fait de ne pas entendre, donc d’être sourd ou insensible à ce qui est dit.
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: en quelque lieu que ce soit
  rationale: Dans ce contexte, l’expression a une valeur distributive ou indéfinie, plus naturelle en français que le calque « selon un lieu ».
- source_word: ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: quelque autre pensée
  rationale: Le substantif désigne une pensée, une idée ou une opinion. « Pensée » préserve le caractère énigmatique du parallélisme avec le lieu.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: ne restez pas dans l’ignorance à mon sujet
  rationale: La formulation rend l’interdiction d’être sans connaissance de la locutrice, sans l’aplatir en un simple « ne m’ignorez pas », qui pourrait suggérer seulement une négligence volontaire.
- source_word: ⲧϣⲟⲣⲡ
  choice: la première
  rationale: Le féminin est requis par la forme copte de la prédication et par la voix féminine du discours. Le terme ouvre la paire paradoxale avec « la dernière ».
- source_word: ⲑⲁⲉ
  choice: la dernière
  rationale: Rendu littéral du second membre de la paire « la première / la dernière », avec maintien du féminin.
theological_decisions:
- issue: Genre de la voix qui dit « je »
  choice: la première… la dernière
  alternative: le premier… le dernier
  rationale: La construction copte emploie la copule féminine ⲧⲉ et les formes déterminées féminines. Le français doit donc marquer le féminin, sans identifier davantage la locutrice.
- issue: Portée de l’image « lieu / pensée »
  choice: maintenir les deux compléments énigmatiques
  alternative: les interpréter comme une omniprésence ou comme des dispositions spirituelles
  rationale: Le texte juxtapose spatialité et pensée sans expliciter leur rapport. La traduction conserve cette tension plutôt que d’en fournir une lecture doctrinale.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le rythme coordonné du copte est maintenu, ainsi que l’étrangeté voulue de « lieu / pensée ». Le féminin de l’auto-identification est explicite.
