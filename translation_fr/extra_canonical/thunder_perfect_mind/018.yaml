base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: fr
  text: '**13.** […] [a] et celui qui se vante m’apporte ces choses. Je suis le silence qu’on ne peut saisir, et la pensée dont le souvenir est grand. Je suis la voix dont les sons sont multiples, et la parole qui est multiple.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de l’extrait est endommagé ou mal reconnu dans le relevé OCR; la traduction commence donc par une lacune.
    reason: textual_uncertainty
  - marker: b
    text: L’extrait copte s’interrompt après l’expression ⲡⲗⲟⲅⲟⲥ ⲉⲧⲉ ⲛⲁϣⲉ («la parole qui est multiple / nombreuse»). La construction paraît inachevée dans l’OCR; la traduction restitue prudemment le parallélisme avec «la voix dont les sons sont multiples».
    reason: incomplete_source_excerpt
lexical_decisions:
- source_word: ⲡⲉⲧϣⲟⲩⲟⲩϣⲟⲩ
  choice: celui qui se vante
  rationale: Le verbe copte exprime ici la vantardise ou la glorification de soi; le participe personnel est conservé.
- source_word: ⲡⲕⲁⲣⲱϥ
  choice: le silence
  rationale: La forme s’analyse comme ⲕⲁ ⲣⲱ⸗, «garder le silence», et non comme un terme de filiation.
- source_word: ⲉⲧⲉⲙⲁⲩⲧⲁϩⲟϥ
  choice: qu’on ne peut saisir
  rationale: ⲧⲁϩⲟ peut signifier atteindre ou appréhender; «saisir» conserve en français cette double nuance sans surinterpréter.
- source_word: ⲧⲉⲡⲓⲛⲟⲓⲁ
  choice: la pensée
  rationale: Emprunt au grec ἐπίνοια; «pensée» est naturel et respecte le sens intellectuel du terme.
- source_word: ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ
  choice: dont le souvenir est grand
  rationale: Rend directement ⲛⲁϣⲉ, «grand», et la construction avec ⲣ-ⲡ-ⲙⲉⲉⲩⲉ, «se souvenir / faire mémoire», tout en préservant l’étrangeté poétique.
- source_word: ⲧⲉⲥⲙⲏ
  choice: la voix
  rationale: ⲥⲙⲏ désigne la voix ou le son; «voix» convient au parallélisme avec son bruit ou sa résonance.
- source_word: ϩⲣⲟⲟⲩ
  choice: les sons
  rationale: Dans cette construction, le terme relève du bruit ou du son, non du sens temporel «jour».
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: la parole
  rationale: Le prêt grec λόγος peut signifier parole, discours ou mot. La minuscule et «parole» évitent d’imposer une identification théologique absente du passage.
theological_decisions:
- issue: Portée théologique de ⲡⲗⲟⲅⲟⲥ
  choice: la parole
  alternative: le Verbe
  rationale: Le texte présente une série d’auto-désignations poétiques, mais ne contraint pas à identifier ce λόγος au «Verbe» d’une tradition doctrinale précise.
translation_notes:
  register: Français international moderne, sobre et poétique. Les répétitions «Je suis» et le parallélisme antithétique sont maintenus. «Qu’on ne peut saisir» est préféré à «incompréhensible» pour préserver l’image d’une réalité impossible à atteindre autant qu’à comprendre.
