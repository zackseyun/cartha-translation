base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/120.yaml
  text: And they will find me in the place that is there, and they will live, and they will not perish. Because of this, do not be disobedient to me.
translation:
  language: fr
  text: '**4.** Et ils me trouveront dans ce lieu-là ; ils vivront et ne périront pas.[a] C’est pourquoi, ne tarde pas à m’écouter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture « ne périront pas » suit la restitution contextuelle de la séquence endommagée ⲛⲥⲉⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ ; l’état matériel du texte laisse subsister une incertitude.
    reason: textual_variant
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: ils me trouveront
  rationale: ⲥⲉⲛⲁ- marque ici le futur à la troisième personne du pluriel, ϭⲓⲛⲉ signifie « trouver » et ⲙⲙⲟⲉⲓ a pour objet « me ». Cette analyse évite de transformer à tort le passage en adresse à des « obéissants ».
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: dans le lieu qui est là
  rationale: Rendu proche de la structure copte, qui conserve la valeur déictique de ⲉⲧⲙⲙⲁⲩ, tout en restant intelligible en français courant.
- source_word: ⲱⲛϩ
  choice: vivront
  rationale: Le verbe signifie fondamentalement « vivre, être en vie » ; le futur français s’accorde avec la série verbale et le sens du contexte.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: ne me désobéis pas
  rationale: La construction négative à la deuxième personne du singulier exprime l’interdiction, tandis que ⲁⲧⲥⲱⲧⲙ désigne le fait de ne pas écouter, donc de désobéir. Le singulier de l’impératif copte est conservé.
theological_decisions:
- issue: Portée de « vivre » et « périr »
  choice: Conserver les verbes sans préciser s’il s’agit de vie et de perdition physiques, spirituelles ou eschatologiques.
  alternative: Expliciter « vivre éternellement » ou « ne pas être perdus ».
  rationale: Le texte source ne fournit pas cette précision ; l’ajouter résoudrait indûment une tension théologique réelle.
translation_notes:
  register: Français moderne, sobre et digne. Le déictique inhabituel « le lieu qui est là » est maintenu parce qu’il reflète directement le copte. L’impératif final reste au singulier, conformément à la forme copte.
