base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: fr
  text: '**14.** Je suis la voix dont les sons sont multiples[a], et la parole aux multiples apparences[b]. Je suis la parole de mon nom. Pourquoi m’aimez-vous, vous qui me haïssez, et haïssez-vous ceux qui m’aiment ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dont le son est multiple ». Le copte peut exprimer l’abondance aussi bien que la diversité.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte porte le mot grec logos. On pourrait aussi traduire : « le Logos aux multiples apparences » ou « la parole dont l’apparence est multiple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: la voix
  rationale: Le copte ⲥⲙⲏ désigne ici clairement la voix; le déterminant féminin et le contexte excluent l’ancienne interprétation « bâton ».
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: dont le son est multiple
  rationale: La construction exprime la multiplicité ou l’abondance du son. « Multiple » conserve l’étrangeté poétique sans transformer l’expression en référence à l’âge ou au jour.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: la parole
  rationale: Le mot grec emprunté λόγος peut signifier parole, discours ou Logos. « La parole » est naturel en français et maintient le parallèle avec « la voix », tandis qu’une note signale la possibilité de « Logos ».
- source_word: ⲉⲧⲉ ⲛⲁϣⲉ ⲡⲉϥⲉⲓⲛⲉ
  choice: dont l’apparence est multiple
  rationale: ⲉⲓⲛⲉ désigne l’apparence ou la forme, et ⲛⲁϣⲉ exprime ici la multiplicité; cette lecture évite l’ancienne analyse erronée en termes de volonté.
- source_word: ⲡϣⲁϫⲉ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: l’énoncé de mon nom
  rationale: ⲡϣⲁϫⲉ peut désigner une parole ou un énoncé. « Énoncé » évite de répéter « parole » et garde la dimension vocale de la formule.
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Pourquoi
  rationale: Locution interrogative courante; elle introduit directement le paradoxe de l’amour et de la haine.
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: haïr / aimer
  rationale: Ces verbes forment une antithèse explicite qu’il faut conserver sans l’atténuer en « rejeter » ou « désirer ».
theological_decisions:
- issue: Rendu de ⲡⲗⲟⲅⲟⲥ
  choice: parole, sans majuscule
  alternative: Logos ou Parole avec majuscule
  rationale: Le passage personnifie la locutrice, mais n’identifie pas explicitement ce terme au Logos d’une doctrine particulière. La minuscule préserve l’ambiguïté et évite d’importer une identification confessionnelle.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes. La répétition de « multiple » reproduit le parallélisme entre la voix et la parole. Le fragment OCR placé avant « Je suis la voix » paraît être le vestige mal reconnu de la ligne précédente et n’est donc pas intégré à cette unité.
