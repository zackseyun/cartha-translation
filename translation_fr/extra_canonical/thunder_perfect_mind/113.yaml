lexical_decisions:
- source_word: ⲧⲱⲧⲛ̄ ϩⲱⲧ ⲧⲏⲩⲧⲛ̄
  choice: Vous aussi, vous-mêmes
  rationale: L’ensemble forme une adresse emphatique à la deuxième personne du pluriel. ϩⲱⲧ est compris comme une graphie de l’enclitique ϩⲱⲱ= (« aussi, également »), plutôt que comme « seuls ».
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: les anges
  rationale: L’emprunt grec ἄγγελος peut désigner des messagers, mais « anges » convient le mieux à cette adresse de portée cosmique.
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: ceux qui ont été envoyés
  rationale: Le verbe ⲧⲛ̄ⲛⲟⲟⲩ signifie « envoyer ». Le pluriel indéfini peut exprimer ici un sens passif, tout en laissant grammaticalement possible « ceux qui ont envoyé ».
- source_word: ⲡⲓⲛⲁ
  choice: le signe
  rationale: « Signe » garde la valeur générale du terme ; « marque » reste possible.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: qui désigne
  rationale: Cette traduction prudente conserve l’idée d’indiquer ou de faire ressortir. La lecture exacte de la forme verbale demeure incertaine dans cet extrait OCR.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: parmi les morts
  rationale: ϩⲛ exprime ici la sphère ou la localisation au sein d’un groupe pluriel.
- source_word: ⲭⲉ
  choice: pourtant
  rationale: Le connecteur est compris comme marquant un tournant adversatif, sans exclure une nuance plus simplement continuative.
- source_word: ⲁⲛⲟⲕ ⲡⲉⲧ
  choice: c’est moi qui…
  rationale: Cette tournure française reproduit l’insistance sur « moi » et permet de laisser la proposition ouverte, comme dans l’extrait tronqué, sans imposer un genre au locuteur.
