base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: fr
  text: 'Ceux qui vivent hors de ma compagnie ne me connaissent pas[a],

    et ceux qui vivent dans ma substance, ce sont eux qui me connaissent.

    Ceux qui sont proches de moi ne m’ont pas connue,

    et ceux qui sont loin de moi, ce sont eux qui m’ont connue.

    Le jour où je suis proche de vous, vous êtes loin de moi ;

    et le jour où je suis loin de vous, je suis proche de vous[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot ⲥⲩⲛⲟⲩⲥⲓⲁ peut désigner le fait d’être ensemble, la fréquentation, la compagnie ou l’association.
    reason: lexical_alternative
  - marker: b
    text: 'L’extrait OCR fourni s’interrompt au début de la dernière proposition. La fin est restituée d’après le parallélisme de la phrase et le texte suivi dans les éditions de ce passage : « le jour où je suis loin de vous, je suis proche de vous ».'
    reason: textual_reconstruction
lexical_decisions:
- source_word: ⲛⲉⲧϣⲟⲟⲡ
  choice: ceux qui vivent
  rationale: Le verbe ϣⲟⲟⲡ signifie « être, exister ». « Vivent » exprime ici naturellement une condition durable sans ajouter l’idée d’une création ou d’une provenance.
- source_word: ϩⲛ ⲧⲁⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: hors de ma compagnie
  rationale: Le nom d’emprunt συνουσία désigne le fait d’être ensemble, la fréquentation ou la compagnie. La préposition et le contexte opposent ceux qui sont hors de cette relation à ceux qui sont « dans » la substance de la locutrice.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: ne me connaissent pas
  rationale: La construction avec ⲣⲁⲧ- et ⲥⲟⲟⲩⲛ exprime l’absence de connaissance. Cette formulation française conserve l’opposition directe avec « me connaissent ».
- source_word: ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ
  choice: ceux qui sont proches de moi
  rationale: Bien que ⲙⲏⲛ puisse signifier « demeurer », le parallélisme explicite avec ceux qui sont éloignés appelle ici le sens relationnel de proximité.
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: ceux qui sont loin de moi
  rationale: La locution marque l’éloignement extérieur. « Loin de moi » préserve clairement le contraste proche/loin.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: Accord féminin dans « connue »
  alternative: Accord masculin ou formulation sans accord
  rationale: L’œuvre présente explicitement une voix féminine et le titre traditionnel l’identifie comme la Pensée parfaite. L’accord grammatical rend ce trait du texte sans lui attribuer une identité confessionnelle supplémentaire.
- issue: Paradoxe de la proximité et de la connaissance
  choice: Maintien littéral des inversions proche/loin et connaître/ne pas connaître
  alternative: Explication ou harmonisation logique
  rationale: Ces tensions sont constitutives du discours en « je » et ne doivent pas être résolues par la traduction.
translation_notes:
  register: Français international actuel, sobre et solennel. Les reprises « ce sont eux » conservent l’insistance du copte, tandis que le balancement des propositions maintient le rythme paradoxal du discours.
