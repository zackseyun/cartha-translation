base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: fr
  text: '**7.** Je suis l’union et la dissolution[a] ;


    je suis la demeure[b],


    et je suis la dissolution.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte peut aussi se rendre par « déliement » ou « action de défaire ». Le même terme est repris dans la dernière ligne.
    reason: lexical_alternative
  - marker: b
    text: Ou « la permanence », « le séjour ». Le mot peut désigner aussi bien le fait de demeurer que le lieu où l’on demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: l’union
  rationale: Le nom copte désigne l’union ou l’action de joindre. « Union » conserve la forme nominale et prépare l’opposition paradoxale avec la dissolution.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: la dissolution
  rationale: La locution ⲕⲱⲗ ⲉⲃⲟⲗ exprime l’action de délier, de défaire ou de dissoudre. « Dissolution » rend naturellement l’antithèse avec « union ».
- source_word: ⲧⲙⲟⲛⲏ
  choice: la demeure
  rationale: L’emprunt grec monē peut désigner le fait de demeurer, un séjour ou une demeure. Le substantif français « demeure » préserve à la fois l’idée de permanence et, secondairement, celle d’un lieu où l’on demeure.
- source_word: ⲡⲕⲱⲗ
  choice: la dissolution
  rationale: Dans ce contexte, le terme renvoie au déliement ou à la dissolution, et reprend sous une forme plus brève l’expression précédente.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Le simple coordonnant respecte la construction paratactique et répétitive du texte copte.
theological_decisions:
- issue: Rapport paradoxal entre union, demeure et dissolution
  choice: Conserver les affirmations juxtaposées sans les harmoniser
  alternative: Interpréter ces termes comme des étapes successives ou des réalités distinctes
  rationale: Le texte identifie la locutrice à des réalités apparemment opposées. Rien dans cet extrait n’autorise à résoudre cette tension par une explication doctrinale.
translation_notes:
  register: Français international actuel, sobre et dignifié. La répétition de « je suis » et la juxtaposition des identités paradoxales sont maintenues. « Demeure » est retenu pour sa simplicité et sa polysémie, explicitée en note.
