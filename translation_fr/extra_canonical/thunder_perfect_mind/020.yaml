base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: fr
  text: Pourquoi[a], vous qui me haïssez, m’aimez-vous et haïssez-vous ceux qui m’aiment ? Vous qui me reniez, reconnaissez-moi[b] ; et vous qui me reconnaissez, reniez-moi[c]. Vous qui dites…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot ⲡⲁⲣⲁⲛ placé avant la question semble appartenir à la ligne précédente ; son sens et son rattachement sont incertains, il n’est donc pas traduit ici.
    reason: alignment_note
  - marker: b
    text: Littéralement, le verbe emprunté au grec peut aussi se traduire par « confessez-moi » ou « professez-moi ».
    reason: lexical_alternative
  - marker: c
    text: « Reniez-moi » peut aussi se rendre par « désavouez-moi » ou « niez-moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Pourquoi
  rationale: L’expression complète signifie « pourquoi ? » et introduit la question paradoxale adressée à ceux qui haïssent la locutrice.
- source_word: ⲙⲟⲥⲧⲉ
  choice: haïr
  rationale: Équivalent français direct du verbe exprimant la haine, sans intensification indue.
- source_word: ⲙⲉ
  choice: aimer
  rationale: Dans ce passage, ⲙⲉ signifie « aimer », et non « connaître » ; ce choix préserve l’antithèse aimer/haïr.
- source_word: ⲁⲣⲛⲁ
  choice: renier
  rationale: « Renier » rend naturellement en français le rejet d’une personne ; « nier » et « désavouer » restent possibles.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: reconnaître
  rationale: « Reconnaître quelqu’un » exprime ici clairement l’aveu ou la profession publique impliqués par le verbe grec emprunté, tout en évitant l’étrangeté moderne de « confesser quelqu’un ».
- source_word: ⲉⲣϩⲟⲙⲟⲗⲟⲅⲉⲓ / ⲉⲣⲁⲣⲛⲁ
  choice: reconnaissez-moi / reniez-moi
  rationale: Les formes en ⲉⲣ- sont rendues comme des impératifs, et non comme des indicatifs.
- source_word: ⲛⲉⲧϫⲉ
  choice: Vous qui dites
  rationale: La relative est comprise comme un vocatif parallèle aux précédents ; la suspension conserve le caractère tronqué de l’extrait.
theological_decisions:
- issue: Rapport paradoxal entre haine, amour, reconnaissance et reniement
  choice: Maintenir les impératifs contradictoires sans les expliquer ni les harmoniser
  alternative: Lire les propositions comme de simples affirmations à la troisième personne
  rationale: La grammaire et la rhétorique du passage interpellent directement plusieurs groupes et leur adressent des commandements paradoxaux.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La répétition des pronoms et l’opposition symétrique des verbes conservent la cadence oraculaire. La seconde occurrence de « pourquoi » est explicitée pour rendre la coordination naturelle en français sans modifier la portée de la question.
