lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ
  choice: ne… pas / ne… aucun
  rationale: La construction marque une défense ou une exhortation négative. Le français emploie ici une formulation impérative directe.
- source_word: ⲥⲱⲧⲙ
  choice: entendre / écouter
  rationale: Le verbe signifie « entendre » ou « écouter ». Il est signalé en note, car l’extrait OCR fourni semble chevaucher une proposition voisine et son rattachement au segment reste incertain.
- source_word: ⲙⲁ
  choice: lieu
  rationale: « Lieu » conserve explicitement le pôle spatial de la formule et convient au registre poétique.
- source_word: ⲟⲩⲙⲉⲩⲉ
  choice: moment
  rationale: Dans la lecture de consultation, le terme est compris temporellement comme « temps », « heure » ou « moment » ; « moment » donne une formule distributive naturelle en français, tandis que « heure » est conservé en note.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Connecteur copte courant. Il n’est pas retenu dans le texte principal, conformément à l’adjudication signalant qu’il appartient vraisemblablement au contexte adjacent, mais la possibilité contextuelle est conservée en note.
- source_word: expression épistémique traduite par « be unknowing of me » dans la couche de consultation
  choice: m’ignorez
  rationale: « Ignorer » exprime de manière concise le fait de ne pas connaître la locutrice, sans transformer l’exhortation en simple manque d’attention. Le contexte gnomique et poétique limite le risque de comprendre seulement « négliger ».
theological_decisions:
- issue: Nature de la connaissance demandée par la locutrice
  choice: Ne m’ignorez
  alternative: Ne restez pas sans me connaître
  rationale: La formulation retenue garde ouverte la portée de cette connaissance — reconnaissance, connaissance ou attention — sans lui imposer un contenu doctrinal particulier.
- issue: Rattachement de la formule d’écoute visible dans l’OCR
  choice: Maintenir dans le texte principal la lecture auditée « en aucun lieu ni à aucun moment » et signaler l’autre segmentation en note
  alternative: Traduire directement « vous qui entendez, écoutez-moi » dans le corps du texte
  rationale: L’alignement de l’extrait OCR est déclaré heuristique et de confiance moyenne, tandis que l’historique d’adjudication indique un chevauchement de lignes distinctes. La note préserve donc l’incertitude sans reconstruire silencieusement le texte.
translation_notes:
  register: 'Français international moderne, sobre et poétique. « En aucun lieu » conserve la dignité du registre, tandis que « à aucun moment » reste immédiatement compréhensible. Le tutoiement ou le vouvoiement n’est pas marqué indépendamment : l’impératif pluriel « ignorez » correspond au destinataire collectif suggéré par le contexte.'
