base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/118.yaml
  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: fr
  text: 'Et des dérèglements,

    et des passions honteuses,

    et des plaisirs passagers[a]

    auxquels ils s’attachent[b]

    jusqu’à retrouver leur lucidité

    et à monter vers leur lieu de repos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit se lit vraisemblablement « pour un temps », malgré la coupure de ligne reproduite par l’OCR; d’où « passagers ».
    reason: segmentation_ocr
  - marker: b
    text: Le verbe peut aussi se rendre par « qu’ils saisissent » ou « qu’ils embrassent ». L’antécédent de « ils » se trouve probablement dans le contexte précédent, non reproduit ici.
    reason: alternative_reading
  - marker: c
    text: La lecture du dernier substantif est incertaine dans cet extrait OCR. On a aussi proposé une idée de « demeure » ou de « tente »; une lecture telle que « vide » est moins assurée dans ce contexte.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ϩⲉⲛⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: des dérèglements
  rationale: Le composé désigne littéralement des états de non-maîtrise ou d’absence de retenue (ⲙⲛⲧ- + négation + ⲁⲙⲁϩⲧⲉ, « maîtriser, tenir »). « Dérèglements » convient ici à l’énumération éthique et respecte le pluriel ϩⲉⲛ.
- source_word: ϩⲉⲛⲡⲁⲑⲟⲥ ⲉⲧϣⲁⲉⲓⲏⲧ
  choice: des passions honteuses
  rationale: Le grec πάθος emprunté au copte désigne ici des passions. La forme ⲉⲧϣⲁⲉⲓⲏⲧ est mieux comprise, dans cette énumération, comme une qualification dépréciative (« honteuses, déshonorantes ») que comme un futur « qui vont venir ».
- source_word: ϩⲉⲛⲏⲇⲟⲛⲏ
  choice: des plaisirs
  rationale: L’emprunt au grec ἡδονή a son sens éthique ordinaire de « plaisirs ».
- source_word: ⲡⲣⲟⲥ ⲡⲉⲟⲩⲉⲓϣ
  choice: passagers
  rationale: 'La coupure de ligne de l’OCR entre ⲡⲉ et ⲟⲩⲉⲓϣ ne doit vraisemblablement pas créer un nouveau substantif : l’ensemble signifie « pour un temps ». « Passagers » exprime naturellement cette durée limitée.'
- source_word: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ
  choice: auxquels ils s’attachent
  rationale: Le verbe décrit le fait de saisir, tenir ou embrasser les plaisirs. « S’attacher à » est idiomatique en français et conserve l’idée d’une adhésion, sans imposer la nuance violente de « saisir ».
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: jusqu’à retrouver leur lucidité
  rationale: Le verbe apparenté au grec νήφω signifie devenir sobre ou lucide. Dans ce contexte moral, « retrouver leur lucidité » est naturel et garde la valeur verbale de la forme copte.
- source_word: ⲛⲥⲉⲡⲱⲧ ⲉϩⲣⲁⲓ
  choice: et à monter
  rationale: ⲡⲱⲧ peut signifier courir, se hâter ou aller; avec ⲉϩⲣⲁⲓ, le mouvement ascendant est central. « Monter » évite en français l’étrange littéralisme « courir vers le haut ».
- source_word: ⲉⲡⲟⲩⲕⲏⲛⲏ
  choice: vers leur lieu de repos
  rationale: Dans le contexte de personnes qui recouvrent leur lucidité puis montent, la lecture traditionnelle « lieu de repos » produit un sens cohérent. L’OCR et l’identification exacte du substantif restent toutefois incertains, ce qui est signalé en note.
theological_decisions:
- issue: Nature de l’énumération morale
  choice: Maintenir une description générale de comportements et d’états humains
  alternative: Lire chaque terme comme une puissance spirituelle personnifiée
  rationale: La grammaire de l’extrait n’exige pas une personnification. La traduction évite donc d’introduire une cosmologie ou une doctrine absente du texte conservé.
- issue: Sujet de l’attachement aux plaisirs
  choice: Employer « ils » sans identifier davantage le groupe
  alternative: Préciser « les hommes » ou interpeller « vous »
  rationale: L’extrait isolé ne permet pas d’établir sûrement l’antécédent. Un pronom pluriel conserve la continuité grammaticale sans ajouter une identification théologique ou anthropologique.
translation_notes:
  register: Français moderne, digne et oralement fluide. La disposition en lignes conserve le rythme de l’énumération. Les répétitions de « et » reflètent la parataxe copte. La traduction corrige deux segmentations probablement produites par l’OCR — notamment ⲡⲣⲟⲥ ⲡⲉ|ⲟⲩⲉⲓϣ, compris comme « pour un temps » — plutôt que de suivre mécaniquement la couche anglaise de consultation à faible confiance.
