review_pass:
  verdict: revise
  source_fidelity: 'Le projet français ne suit pas le texte copte fourni : il remplace « ignorances » par « dérèglements », transforme la relative future « qui viennent/qui vont venir » en « honteuses », réanalyse ⲟⲩⲉⲓϣ (« puissance, force ») comme une expression temporelle, et substitue un lieu de repos au probable « vide ». La révision restitue les éléments lexicaux et verbaux attestés, tout en signalant les ambiguïtés de ⲡⲣⲟⲥ ⲡⲉ, de l’objet du verbe « prendre », et de ⲕⲏⲛⲏ.'
  naturalness: La version révisée conserve le rythme paratactique de l’énumération dans un français moderne. « Ignorances », bien que littéraire, est volontairement maintenu pour refléter le pluriel abstrait du copte. La subordonnée finale rend la forme verbale « devenir lucides » sans la nominaliser artificiellement.
  terminology: « Passions », « plaisirs », « puissance », « lucides » et « vide » correspondent aux choix lexicaux les moins interprétatifs pour πάθος, ἡδονή, ⲉⲓϣ, νήφω et κενή/κένωμα. Aucun sens moral ajouté (« honteuses »), temporel (« passagers ») ou eschatologique (« lieu de repos ») n’est conservé.
  issues:
  - severity: high
    issue: Substitution de sens dans plusieurs termes et propositions
    rationale: « Dérèglements », « passions honteuses », « plaisirs passagers », « s’attachent » et « lieu de repos » ne sont pas justifiés par la séquence copte transmise et modifient substantiellement le passage.
  - severity: high
    issue: Réanalyse non étayée de ⲡⲣⲟⲥ ⲡⲉ ⲟⲩⲉⲓϣ
    rationale: Le projet fusionne ⲡⲉ et ⲟⲩⲉⲓϣ afin d’obtenir « pour un temps », alors que l’audit lexical identifie ⲟⲩⲉⲓϣ comme « puissance/force » et traite ⲡⲣⲟⲥ ⲡⲉ comme une construction ambiguë.
  - severity: medium
    issue: Objet de ⲙⲙⲟ/ⲙⲙⲟⲟⲩ et sujet final incertains
    rationale: La coupure de ligne peut refléter ⲙⲙⲟⲟⲩ (« les »), tandis que l’antécédent de « ils » n’est pas explicité dans cet extrait. La traduction ne doit ni inventer un groupe antérieur ni convertir le verbe en attachement.
  revised_text: 'Et des ignorances,


    et des passions qui vont venir,


    et des plaisirs tournés vers vous[a],


    et une puissance que vous prendrez[b],


    jusqu’à ce qu’ils deviennent lucides


    et courent vers le haut, jusque dans leur vide[c].'
  revised_footnotes:
  - marker: a
    text: La construction ⲡⲣⲟⲥ ⲡⲉ est difficile et son objet n’est pas explicitement exprimé de façon sûre dans l’extrait. « Vers vous » suit l’orientation suggérée par le contexte de l’adresse ; on pourrait aussi comprendre plus neutrement « à son égard ».
    reason: alignment_note
  - marker: b
    text: Le verbe peut signifier « prendre », « recevoir » ou « saisir ». La coupure entre ⲙⲙⲟ et ⲟⲩ pourrait aussi représenter ⲙⲙⲟⲟⲩ, « les » ; l’objet exact demeure donc incertain.
    reason: alternative_reading
  - marker: c
    text: ⲡⲟⲩⲕⲏⲛⲏ est compris comme « leur vide » (ou « leur vacuité »). « Leur pauvreté » est une autre possibilité lexicale. Le texte ne soutient pas ici l’ajout d’un « lieu de repos » ou d’une « demeure ».
    reason: lexical_alternative
  revision_rationale: Une correction complète est nécessaire, car le projet réorganise et interprète fortement le texte au-delà de ce que permet l’extrait. La révision suit la syntaxe sérielle et les formes verbales du copte, conserve les pronoms sans leur attribuer d’antécédent doctrinal, et place en notes les points où l’OCR, la segmentation ou le lexique ne permettent pas une certitude.
