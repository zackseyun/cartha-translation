base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: fr
  text: '**9.** Le silence[a] des anges qui ont été envoyés dans la Parole[b], et des dieux,


    des dieux qui sortent par le conseil[c] ;


    et les esprits[d] des humains qui existent avec moi,


    et les femmes qui existent au-dedans.


    Je suis celle — vous[e]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture de ⲥⲓⲥ est incertaine. Le mot pourrait désigner le silence ou le calme, ou être compris comme l’impératif « taisez-vous ».
    reason: alternative_reading
  - marker: b
    text: « Parole » traduit le mot grec λόγος transmis en copte. On pourrait aussi rendre « Logos ». En raison de l’état et de l’alignement incertains du texte OCR, la construction exacte de la séquence concernant les anges et leur envoi dans la Parole demeure incertaine.
    reason: lexical_and_textual_note
  - marker: c
    text: Ou « le dessein ». Le copte ϣⲟϫⲛⲉ signifie « conseil », « dessein » ou « avis ».
    reason: lexical_alternative
  - marker: d
    text: ⲡⲛⲁ est vraisemblablement l’abréviation de ⲡⲛⲉⲩⲙⲁ, « esprit ».
    reason: source_form_note
  - marker: e
    text: La forme copte indique ici le début de la deuxième personne du pluriel. La proposition s’interrompt dans l’extrait conservé.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲓⲥ
  choice: le silence
  rationale: La forme OCR est incertaine, mais paraît relever du champ du silence ou du calme. Le substantif conserve la structure énumérative sans transformer arbitrairement le mot en ordre.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: des anges
  rationale: Le mot grec emprunté ἄγγελος désigne ici vraisemblablement des êtres célestes ; « messagers » resterait possible hors contexte.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟⲟⲩ
  choice: qui ont été envoyés
  rationale: Lecture contextuelle et morphologique probable d’une forme relative renvoyant aux anges, tout en reconnaissant l’incertitude de l’OCR.
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  choice: dans la Parole
  rationale: ϩⲙ̄ exprime ici la localisation ou la sphère ; la majuscule laisse ouverte la portée technique de λόγος sans imposer « Logos » au lecteur.
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  choice: des dieux
  rationale: La répétition et le parallélisme favorisent le pluriel, bien que ⲛⲟⲩⲧⲉ puisse aussi, selon la syntaxe, désigner Dieu au singulier.
- source_word: ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ
  choice: qui sortent par le conseil
  rationale: ϣⲟϫⲛⲉ signifie « conseil », « dessein » ou « avis » ; « conseil » garde une formulation concise et ne le confond pas avec la voix.
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: les esprits des humains
  rationale: ⲡⲛⲁ représente vraisemblablement l’abréviation de ⲡⲛⲉⲩⲙⲁ, « esprit », et ⲣⲱⲙⲉ est rendu de manière inclusive.
- source_word: ⲛⲉⲧϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: qui existent avec moi
  rationale: La lecture corrigée ⲛⲉⲧϣⲟⲟⲡ forme une relative, « ceux qui existent », plutôt qu’un nom abstrait désignant des êtres.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: les femmes
  rationale: Forme plurielle de « femme » ; elle ne signifie pas « les sages ».
- source_word: ⲛ̄ϩⲏⲧ
  choice: au-dedans
  rationale: L’expression évoque l’intérieur ou le cœur. « Au-dedans » préserve cette indétermination spatiale ou intérieure.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ-
  choice: Je suis celle que vous…
  rationale: ⲁⲛⲟⲕ ⲧⲉ affirme « je suis celle… » ; le début ⲧⲉⲧ- marque ensuite la deuxième personne du pluriel, mais la proposition est tronquée.
theological_decisions:
- issue: Singulier ou pluriel de ⲛⲟⲩⲧⲉ
  choice: des dieux
  alternative: de Dieu
  rationale: Le parallélisme et la répétition de la forme dans cette énumération appuient le pluriel. Une note maintient toutefois ouverte la lecture singulière, théologiquement différente.
- issue: Portée de λόγος
  choice: la Parole
  alternative: le Logos / la parole
  rationale: « Parole » reste accessible tout en laissant percevoir un possible emploi conceptuel ; la traduction n’identifie pas explicitement ce Logos à une doctrine confessionnelle particulière.
- issue: Nature de ⲡⲛⲁ
  choice: les esprits
  alternative: les pensées / les intelligences
  rationale: La graphie abrégée favorise fortement « esprit ». Cette lecture évite de réduire sans preuve le terme à une faculté intellectuelle.
translation_notes:
  register: Français international moderne, soutenu mais direct. Les parallélismes et les ruptures du passage sont conservés. Les formulations obscures ne sont pas harmonisées artificiellement ; les principales incertitudes de l’OCR et de la syntaxe sont signalées en notes.
