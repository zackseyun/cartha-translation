  text: the finding of those who seek me[a], and the command of those who ask me, and the voice of the voices of the place of God, of the angels[d][c][b], which they utter
translation:
  language: fr
  text: 'la découverte de ceux qui me cherchent,

    et le commandement de ceux qui me le demandent,

    et la voix des voix du lieu de la divinisation[a] des anges, qu’ils ont fait entendre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte transcrit ici vraisemblablement le grec θέωσις, qui signifie « divinisation » ou « déification »; la lecture « Dieu » ne correspond pas au terme conservé dans cet extrait.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « qu’ils ont proférée » ou « qu’ils ont émise ». Le référent de « ils » et l’antécédent exact de « que » restent incertains dans cet extrait transmis par OCR.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲡⲅⲓⲛⲉ
  choice: la découverte
  rationale: Le nom désigne le fait de trouver ou ce qui est trouvé. « Découverte » conserve ici la formulation nominale du copte et son lien avec ceux qui cherchent.
- source_word: ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: de ceux qui me cherchent
  rationale: La construction ϣⲓⲛⲉ ⲛⲥⲱ= signifie « chercher après ». Le complément ⲛⲥⲱⲉⲓ impose donc le sens positif « me chercher », non « m’insulter » ou « me maudire ».
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: le commandement
  rationale: Le terme peut désigner un ordre, un commandement ou une instruction. « Commandement » maintient sa force directive sans préciser qui le donne.
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: de ceux qui me le demandent
  rationale: ⲁⲓⲧⲉⲓ, emprunt au grec αἰτεῖν, signifie « demander ». Le pronom « le » rend en français courant l’objet implicite de la demande, sans l’identifier davantage.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: la voix des voix
  rationale: Traduction formelle de la construction superlative ou intensive du texte transmis; l’expression volontairement énigmatique est conservée.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: divinisation
  rationale: Le mot transcrit vraisemblablement le grec θέωσις, « divinisation » ou « déification ». Il ne signifie pas simplement « Dieu ».
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: qu’ils ont fait entendre
  rationale: Le verbe peut exprimer l’action d’émettre, de proférer ou de faire sortir. Avec « voix », « faire entendre » donne un français naturel tout en gardant l’idée d’émission.
theological_decisions:
- issue: Sens de ⲑⲉⲱⲥⲓⲥ
  choice: divinisation
  alternative: lieu de Dieu
  rationale: Le texte OCR porte un terme correspondant à « divinisation », notion distincte de « Dieu ». La traduction ne remplace pas ce terme difficile par une formulation théologiquement plus familière.
- issue: Référent du sujet pluriel dans la proposition finale
  choice: maintenir « ils » sans identifier explicitement son référent
  alternative: les anges ont fait entendre la voix
  rationale: La syntaxe permet de rapprocher le sujet des « anges », mais le rattachement exact demeure incertain. L’explicitation aurait résolu une ambiguïté réelle du texte.
