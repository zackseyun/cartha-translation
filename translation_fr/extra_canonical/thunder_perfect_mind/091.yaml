  yaml_path: translation/extra_canonical/thunder_perfect_mind/091.yaml
  text: 'I am the one beneath the earth[b][a],

    and they ascend to me from the lower part of the earth.'
translation:
  language: fr
  text: '… la face de la terre[a],

    et celle qu’ils jettent hors de la face de la terre[b].

    Je suis la préparation de toute personne qui entre ; je suis le partage de mon nom ; je suis…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait copte commence au milieu d’une proposition. L’ellipse indique que le prédicat ou l’antécédent de ce groupe nominal se trouvait dans le texte précédent non fourni.
