  - marker: b
    text: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ signifie littéralement « celle qu’ils jettent ». Le groupe ⲉⲃⲟⲗ ϩⲓϫⲙ marque un mouvement hors de ou loin de la surface indiquée. Le suffixe de ⲙⲙⲟⲥ est féminin singulier (« elle/la »), et non « moi ».
    reason: source_alignment
  - marker: c
    text: L’extrait fourni s’achève après ⲁⲛⲟⲕ ⲧⲉ (« je suis »), au début d’une nouvelle affirmation; l’ellipse finale ne complète pas ce qui n’est pas transmis.
