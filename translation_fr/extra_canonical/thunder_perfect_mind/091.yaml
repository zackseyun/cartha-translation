lexical_decisions:
- source_word: ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: la surface de la terre
  rationale: ⲡϩⲟ signifie littéralement « face » et, avec ⲙⲡⲕⲁϩ (« de la terre »), désigne naturellement la face ou la surface de la terre. Le sens « sous la terre » ne ressort pas du texte copte fourni.
- source_word: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ
  choice: celle qu’ils rejettent
  rationale: ⲛⲟⲩϫⲉ exprime l’action de jeter ou de rejeter; ⲙⲙⲟⲥ porte un suffixe féminin singulier (« elle »), et non celui de la première personne (« moi »). La construction relative est donc rendue par « celle qu’ils rejettent ».
- source_word: ⲉⲃⲟⲗ ϩⲓϫⲙ
  choice: sur
  rationale: Dans cette construction avec un verbe de rejet, le groupe marque l’expulsion ou la projection sur la surface indiquée. « Sur » donne en français le lieu d’aboutissement sans reproduire lourdement chaque élément de la locution copte.
- source_word: ⲕⲁϩ
  choice: terre
  rationale: Le contexte vise la terre comme étendue ou monde terrestre; « terre » conserve cette portée plus large que « sol » ou « pays ».
