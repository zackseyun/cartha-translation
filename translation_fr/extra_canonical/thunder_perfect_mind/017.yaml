base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: fr
  text: '**12.** Je suis la servante de celui qui m’a préparée. Je suis la souveraine de ma descendance. Mais c’est lui qui m’a engendrée[a] avant le jour de ma naissance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe « m’a engendrée » est restitué dans une lacune du manuscrit; la restitution est soutenue par la mention immédiatement suivante du « jour de ma naissance ».
    reason: textual_restoration
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: la servante
  rationale: Le nom désigne une personne au service d’une autre. Le féminin correspond à la forme copte et à la voix féminine du discours, sans renforcer inutilement le sens en « esclave ».
- source_word: ⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: celui qui m’a préparée
  rationale: Le verbe exprime l’idée de préparer ou de mettre en état. « Préparée » conserve cette valeur sans introduire l’idée différente de commander présente dans l’extrait OCR mal aligné.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: la souveraine
  rationale: Le titre féminin exprime l’autorité ou la maîtrise. « Souveraine » est naturel en français et maintient le parallélisme de l’affirmation identitaire.
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: descendance
  rationale: La formation nominale sur « enfant » peut avoir une portée collective ou abstraite. « Descendance » convient au paradoxe généalogique du passage sans imposer le singulier.
- source_word: '[ϫⲡⲟⲉⲓ]'
  choice: m’a engendrée
  rationale: La restitution contextuelle du verbe de naissance rend explicitement la relation générative qui répond à « ma naissance » dans la proposition suivante.
- source_word: ϩⲁⲧⲉϩⲏ
  choice: avant
  rationale: L’expression temporelle situe l’engendrement antérieurement au jour de la naissance et doit rester littérale pour préserver le paradoxe.
theological_decisions:
- issue: Paradoxe de la souveraine engendrée par sa propre descendance
  choice: Maintenir sans explication harmonisante la succession « ma descendance… lui… m’a engendrée »
  alternative: Identifier le référent masculin ou reformuler pour supprimer le paradoxe
  rationale: Le texte articule volontairement des relations d’autorité et de génération inversées. La traduction ne doit ni déterminer l’identité du référent ni résoudre cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. Les accords féminins rendent la voix grammaticale de la locutrice. Les trois déclarations brèves conservent le rythme solennel et le paradoxe du texte copte corrigé, plutôt que celui de l’extrait OCR mal aligné.
