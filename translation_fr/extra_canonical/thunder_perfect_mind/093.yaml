translation:
  language: fr
  text: '**9.** L’appel de mon nom, c’est moi.


    Je suis le cri, et je suis l’écoute.


    Vous m’entendez dans l’appel que vous m’adressez ; vous m’appelez par un… que vous prononcez.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du syntagme est incertaine dans l’extrait OCR : on lit ϩⲛ ⲟⲩⲡ… puis ⲉⲧⲉⲧⲛⲧⲁⲩⲟ, soit « par/dans un … que vous émettez ou prononcez ». Le nom après l’article indéfini ne peut pas être rétabli avec assurance ; « son », « voix » ou « appel » seraient des restitutions conjecturales.'
    reason: Lacune ou lecture OCR incertaine à la fin de l’extrait ; la traduction conserve explicitement l’indétermination.
lexical_decisions:
- source_word: ⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: L’appel de mon nom
  rationale: Le contexte et la révision critique favorisent l’analyse de ⲡⲱϣⲥ comme une forme liée à ⲱϣ, « appeler, crier », plutôt que le sens générique « son ». « L’appel de mon nom » maintient aussi le lien poétique avec ⲙⲟⲩⲧⲉ, « appeler ».
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: c’est moi
  rationale: Cette tournure française rend avec netteté l’assertion copulative emphatique et respecte le genre féminin indiqué par ⲧⲉ.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: le cri
  rationale: La séquence est comprise d’après ⲁϣⲕⲁⲕ ⲉⲃⲟⲗ, « crier, pousser un cri ». Le substantif français « cri » conserve la formulation nominale et évite l’ancienne lecture erronée « sans souillure ».
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: l’écoute
  rationale: Dans cette construction poétique, le verbe « entendre, écouter » est rendu comme une réalité nominalisée. « L’écoute » est idiomatique en français et préserve la tension entre le cri émis et l’acte d’entendre.
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: Vous m’entendez
  rationale: Rend directement l’adresse à la deuxième personne du pluriel et le sens courant de ⲥⲱⲧⲙ avec ⲉⲣⲟ-.
- source_word: ϩⲛ ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: lorsque vous m’appelez
  rationale: Cette formulation naturelle exprime la circonstance dans laquelle les destinataires entendent la locutrice, sans alourdir le français par « dans votre appel de moi ».
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: dans un… que vous prononcez
  rationale: Le nom suivant l’article indéfini est incomplet ou incertain dans l’extrait OCR. Le verbe ⲧⲁⲩⲟ peut signifier « émettre, proférer, prononcer »; « prononcez » convient au contexte vocal tout en laissant visible la lacune.
theological_decisions:
- issue: Personnification simultanée du cri et de l’écoute
  choice: Je suis le cri, et je suis l’écoute
  alternative: Je suis celle qui crie, et celle qui entend
  rationale: Le choix principal conserve les formes nominales et le paradoxe poétique du texte, sans transformer celles-ci en agents personnels ni résoudre la tension entre émission et réception.
translation_notes:
  register: Français international moderne, poétique et digne. Les phrases brèves reproduisent le parallélisme et l’insistance de la voix féminine. La lacune finale demeure apparente plutôt que d’être comblée par conjecture.
