  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: fr
  text: Et vous me trouverez dans la grandeur[a]. Ne me regardez pas lorsque je parais parmi ceux qui sont honorés[b] ; cherchez-moi dans les lieux les plus humbles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la richesse » ou « dans l’élévation ». Le mot copte désigne littéralement la grandeur, mais son champ de sens peut évoquer le rang social ou la richesse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui sont honorés ». La tournure qui précède peut aussi être rendue par « lorsque je sors parmi eux » ou « lorsque je viens au dehors parmi eux » ; le verbe de mouvement demeure incertain dans cet extrait OCR.'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Littéralement : « les lieux les moindres ». On pourrait aussi traduire « les lieux les plus petits ». La fin de l’extrait fourni par l’OCR est altérée ; « cherchez-moi » repose sur une lecture corrigée du copte. Une présentation traditionnelle de ce passage donne plutôt : « Prêtez attention à ma pauvreté et à ma richesse. »'
    reason: textual_and_traditional_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vous me trouverez
  rationale: Le futur de ϭⲓⲛⲉ exprime normalement l’idée de trouver ou de découvrir; la forme verbale s’adresse à plusieurs personnes.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: dans la grandeur
  rationale: Le nom abstrait formé avec ⲙⲛⲧ- désigne ici la grandeur. « Richesse » reste une possibilité sémantique et contextuelle, mais elle est moins directement indiquée par la forme.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: Ne me regardez pas
  rationale: La construction prohibitive avec ⲛⲁⲩ et ⲉⲣⲟⲉⲓ donne naturellement « ne me regardez pas ».
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: sortir
  rationale: ⲉⲃⲟⲗ marque un mouvement vers l’extérieur. « Sortir » conserve cette image sans préciser plus que le texte la direction relative au locuteur.
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: ceux qui sont honorés
  rationale: La forme se comprend comme un relatif pluriel associé au statif de ⲧⲁⲉⲓⲟ, « honorer »; elle ne signifie donc pas simplement « les grands ».
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: les lieux les moindres
  rationale: Le mot grec emprunté ἐλάχιστος qualifie ici « lieux ». « Les moindres » garde le contraste avec la grandeur tout en évitant de préciser s’il s’agit de lieux petits, humbles ou méprisés.
- source_word: ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ
  choice: cherchez-moi
  rationale: La fin donnée par l’OCR est corrompue; la lecture corrigée ⲛⲧⲉⲧⲛϭⲱϣⲧ ⲛⲥⲱⲉⲓ signifie « cherchez-moi » ou « regardez vers moi ».
theological_decisions:
- issue: Contraste entre la grandeur, les personnes honorées et les lieux les moindres
  choice: Conserver le paradoxe sans l’expliquer
  alternative: Interpréter explicitement la grandeur comme la richesse et les lieux moindres comme la pauvreté
  rationale: Le passage oppose volontairement des catégories de rang et de lieu. Une explicitation en termes de richesse et de pauvreté résoudrait une tension que le texte copte laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et solennel. Le pluriel « vous » reflète l’adresse collective du copte. La répétition de « et » est maintenue dans la dernière proposition afin de respecter la parataxe du texte, malgré une ponctuation française légèrement structurante.
