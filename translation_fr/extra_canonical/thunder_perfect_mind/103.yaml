review_pass:
  verdict: revise
  source_fidelity: 'Le projet a raison de privilégier l’extrait copte visible plutôt que la très brève ligne anglaise, qui relève manifestement d’un mauvais alignement de segment. L’antithèse « au-dedans / au-dehors » et le verbe « façonner » sont bien attestés. En revanche, « a fait de lui-même le modèle de ce qui est au-dedans de vous » inverse et surinterprète le rapport exprimé par ⲛⲧⲁϥⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ ⲙⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ : le texte indique plus naturellement qu’il a fait/façonné son image à partir de l’intérieur des destinataires.'
  naturalness: Le français est globalement lisible et le registre convient. « À l’extérieur » est un peu moins cohérent avec la répétition voulue de « au-dedans / au-dehors » ; cette dernière paire est maintenue. La dernière proposition est simplifiée pour éviter l’ajout de « ce qui est », absent de la formulation copte visible.
  terminology: '« Façonner » rend bien le grec emprunté πλάσσειν. « Image » rend ici plus exactement τύπος que « modèle », car le pronom ⲙⲙⲟϥ renvoie à l’image de lui-même ; « modèle de ce qui est au-dedans » modifiait la direction de la relation. Aucune terminologie juridique (« Justice », « avocate ») ne doit être introduite : elle n’est pas soutenue par l’extrait aligné.'
  issues:
  - severity: high
    issue: Le syntagme « a fait de lui-même le modèle de ce qui est au-dedans de vous » inverse la relation de ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ ⲙ-...
    rationale: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ exprime la production d’une image/de la figure de lui-même, et ⲙⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ indique la provenance ou le cadre intérieur. La version proposée transforme l’intérieur en objet dont il serait le modèle.
  - severity: medium
    issue: Le texte anglais de contrôle ne correspond pas à l’extrait copte fourni.
    rationale: La ligne « I am Justice; I am the advocate » et ses notes juridiques n’ont pas d’appui lexical dans les lignes coptes visibles, lesquelles portent sur intérieur/extérieur, façonner et image. La traduction française doit suivre le copte, avec une note d’alignement.
  - severity: low
    issue: La dernière phrase ajoute une relative inutile.
    rationale: « est ce qui est à l’extérieur » est plus lourd et moins proche de ⲡⲉⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟϥ ⲙⲡⲉⲧⲛⲥⲁⲃⲟⲗ. « Ce que vous voyez est au-dehors de vous » conserve le sens sans cette expansion.
  revised_text: Car ce qui est au-dedans de vous est ce qui est au-dehors de vous ; et celui qui vous façonne au-dehors a façonné son image à partir de ce qui est au-dedans de vous. Et ce que vous voyez est au-dehors de vous.[a]
  revised_footnotes:
  - marker: a
    text: L’extrait copte transmis ne correspond pas clairement au texte de consultation anglais « I am Justice; I am the advocate ». Il porte plutôt sur ce qui est « au-dedans » et « au-dehors », sur quelqu’un qui façonne et sur une « image » (τύπος). La traduction suit donc les mots visibles. Le découpage exact et la relation syntaxique de « son image » avec « ce qui est au-dedans de vous » demeurent quelque peu incertains en raison de l’OCR et de l’alignement approximatif.
    reason: alignment_note
  revision_rationale: 'La révision conserve l’antithèse spatiale et le ton sobre du projet, mais corrige le sens de la proposition avec τύπος : il s’agit d’une image de lui-même façonnée à partir de l’intérieur des destinataires, non de lui-même comme modèle de cet intérieur. Elle ne reprend pas la paire juridique de l’audit anglais non aligné.'
