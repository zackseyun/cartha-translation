translation:
  language: fr
  text: Car ce qui est au-dedans de vous est ce qui est au-dehors de vous ; et celui qui vous façonne de l’extérieur a fait de lui-même le modèle de ce qui est au-dedans de vous. Et ce que vous voyez est ce qui est à l’extérieur de vous.[a]
  philosophy: optimal-equivalence
  footnotes:
