    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲁϩⲟⲩⲛ / ⲥⲁⲃⲟⲗ
  choice: au-dedans / au-dehors
  rationale: Dans cet extrait, les graphies correspondent le plus naturellement au couple spatial copte « intérieur / extérieur », répété en antithèse. Cette lecture suit les mots effectivement visibles plutôt que le découpage conjectural du texte de consultation.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ (πλάσσειν)
  choice: façonner
  rationale: Le verbe d’emprunt grec exprime l’action de former ou de modeler ; « façonner » reste naturel tout en conservant l’image artisanale.
- source_word: ⲣⲧⲩⲡⲟⲥ (τύπος)
  choice: faire de lui-même le modèle
  rationale: τύπος peut désigner un modèle, une forme ou une empreinte. « Modèle » convient au rapport établi entre l’extérieur et l’intérieur, sans préciser indûment s’il s’agit d’une copie ou d’une empreinte.
- source_word: ⲛⲧⲁϥⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: a fait de lui-même le modèle
  rationale: La construction avec ⲙⲙⲟϥ renvoie vraisemblablement au sujet lui-même. La formulation française garde ce réfléchi, même si le référent exact demeure contextuellement délicat.
theological_decisions:
- issue: Identification de la déclaration comme « Je suis la Justice ; je suis l’avocate »
  choice: Ne pas introduire cette déclaration dans le corps du texte
  alternative: « Je suis la Justice ; je suis l’avocate. »
  rationale: Aucun équivalent direct de « je suis », « justice », « juge » ou « avocate » n’est clairement attesté dans l’extrait copte fourni. Le texte visible développe plutôt l’opposition intérieur/extérieur et l’acte de façonner. Importer la paire juridique résoudrait artificiellement un problème d’alignement.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « au-dedans / au-dehors » est maintenue pour reproduire la structure antithétique du copte. Le masculin « celui qui » reflète une construction substantivée sans imposer une identité théologique au référent.
