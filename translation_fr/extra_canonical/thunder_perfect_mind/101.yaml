base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: fr
  text: Libérez-vous. Ou bien, si vous vous libérez de lui, qui pourra vous saisir ? Car votre intérieur est votre extérieur, et celui qui façonne l’extérieur façonne aussi l’intérieur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: Libérez-vous
  rationale: L’expression associe le verbe « laisser, relâcher » à ⲉⲃⲟⲗ, qui marque le mouvement vers l’extérieur. Dans cette construction réfléchie, « Libérez-vous » rend naturellement l’impératif sans reprendre l’ancienne lecture erronée « criez ».
- source_word: ⲛϩⲏⲧϥ
  choice: de lui
  rationale: Le suffixe masculin singulier est conservé sans préciser l’identité de son référent, qui n’est pas établie dans cet extrait.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: saisir
  rationale: « Saisir » exprime directement l’action de prendre ou de tenir sous son emprise et maintient le contraste avec la libération.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ / ⲡⲉⲧⲛⲥⲁⲃⲃⲟⲗ
  choice: votre intérieur / votre extérieur
  rationale: Ces groupes désignent respectivement le dedans et le dehors. La formulation nominale conserve le parallélisme paradoxal du copte au lieu de l’expliquer.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: façonne
  rationale: Le verbe d’origine grecque signifie former ou modeler. « Façonne » convient au registre poétique et préserve l’idée d’une formation active.
theological_decisions:
- issue: Identité du référent masculin dans « de lui »
  choice: Maintenir le pronom sans identification
  alternative: Nommer une puissance, un maître ou un adversaire
  rationale: L’extrait ne permet pas d’identifier sûrement ce référent ; toute précision introduirait une interprétation théologique étrangère au segment.
- issue: Rapport entre l’intérieur et l’extérieur
  choice: Conserver l’identité paradoxale
  alternative: Paraphraser comme une correspondance ou une ressemblance
  rationale: La construction copte pose directement l’intérieur comme l’extérieur. La traduction garde cette tension plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, sobre et poétique. L’impératif est direct ; le parallélisme « intérieur / extérieur » et la question rhétorique sont maintenus. « Aussi » dans la dernière proposition rend explicitement en français la coordination copte sans modifier son sens.
