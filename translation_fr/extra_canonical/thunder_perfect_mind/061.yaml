  text: '**16.** Je suis celle dont vous vous êtes cachés[a], et vous vous montrez à moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « vous vous êtes cachés » n’est pas clairement lisible dans cet extrait OCR. Le voisinage mentionne « mes membres en vous », ce qui laisse penser que du texte adjacent empiète sur ce segment.
    reason: alignment_note
  - marker: b
    text: Le pronom objet visible semble être ⲉⲣⲱⲧⲛ, « à vous », ce qui appuierait la lecture « je me montre à vous ». Le texte principal suit la paire traditionnellement reconnue « vous vous cachez de moi / vous vous montrez à moi », mais la direction demeure incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: vous vous montrez
  rationale: Le verbe signifie « apparaître, devenir visible ». La tournure pronominale conserve en français le contraste paradoxal avec « vous vous êtes cachés », sans réduire le sens à une simple perception passive.
- source_word: ϩⲟⲩⲛ
  choice: à
  rationale: Dans cette construction, le terme contribue à l’orientation de l’apparition. Le français « à » donne naturellement « vous vous montrez à moi », sous réserve de l’incertitude portant sur le pronom objet.
- source_word: ⲉⲣⲱⲧⲛ
  choice: à moi (lecture traditionnelle du passage)
  rationale: L’OCR donne visiblement ⲉⲣⲱⲧⲛ, « à vous », alors que le parallélisme traditionnel du bloc suppose « à moi ». Le texte principal suit ce parallélisme, mais la variante directement attestée est signalée en note.
- source_word: '[motif de la dissimulation; lexème non clairement visible dans l’extrait]'
  choice: vous vous êtes cachés
  rationale: Le verbe correspondant n’est pas nettement présent dans cet extrait OCR, qui paraît contenir du matériau adjacent. La formulation retient la paire paradoxale traditionnellement reconnue « se cacher/se montrer », tout en signalant le problème d’alignement.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: celle
  alternative: celui / la personne
  rationale: L’œuvre met en scène une voix féminine et le français exige ici un choix de genre. « Celle » respecte cette caractérisation grammaticale et littéraire sans ajouter d’interprétation doctrinale.
- issue: Direction de l’apparition
  choice: vous vous montrez à moi
  alternative: je me montre à vous
  rationale: La première formulation conserve la paire traditionnelle « vous vous cachez de moi / vous vous montrez à moi »; toutefois, le pronom lisible dans l’extrait favorise grammaticalement l’autre direction. Cette tension textuelle est conservée dans la note plutôt que résolue silencieusement.
translation_notes:
  register: Français international actuel, sobre et solennel. La phrase brève maintient le parallélisme et le paradoxe de l’énoncé. « Se montrer » est plus naturel ici qu’« apparaître » tout en restant proche de la valeur du verbe copte.
