  text: I am the un-shut and the rich[a]. The exaltation of seeking[b],
translation:
  language: fr
  text: '**5.** Je suis celle qui n’est pas fermée et la riche[a]. L’élévation de la recherche[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme est incertain. Il peut désigner « celle qui n’est pas fermée » ou « celle qui ne se ferme pas » ; une analyse différente permet aussi de comprendre « celle qui n’entend pas ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, un syntagme tel que « l’élévation du chercher ». La phrase se poursuit vraisemblablement dans le segment suivant.
    reason: textual_boundary
lexical_decisions:
- source_word: ⲁⲧⲱⲧⲙ
  choice: celle qui n’est pas fermée
  rationale: Le préfixe privatif ⲁⲧ- associé à ⲱⲧⲙ, « fermer », donne littéralement l’idée de « non fermée ». Cette formulation conserve l’étrangeté du titre substantivé au lieu de la résoudre par une interprétation comme « inaccessible » ou « inattentive ».
- source_word: ⲧⲣⲙⲙⲁⲟ
  choice: la riche
  rationale: ⲣⲙⲙⲁⲟ désigne une personne riche. Le féminin français s’accorde avec la voix féminine qui parle dans l’ensemble de l’œuvre.
- source_word: ⲡϫⲓⲥⲉ
  choice: l’élévation
  rationale: ϫⲓⲥⲉ exprime la hauteur ou l’élévation, et non la honte. « Élévation » convient au syntagme abstrait tout en évitant d’y introduire arbitrairement une valeur morale.
- source_word: ⲛⲍⲏⲧⲉ
  choice: de la quête
  rationale: Le groupe paraît refléter le grec ζητεῖν, « chercher ». « Quête » rend naturellement en français l’acte de chercher et permet de conserver le caractère nominal et fragmentaire de l’expression.
theological_decisions:
- issue: Genre de la voix qui dit « je »
  choice: 'Formes féminines : « celle qui n’est pas fermée », « la riche »'
  alternative: 'Formes masculines ou épicènes : « l’être non fermé », « l’être riche »'
  rationale: La voix autoprésentée dans Le Tonnerre, Intellect parfait est féminine. Le français exige ici un choix de genre que le contexte global permet de faire sans ajouter une identité confessionnelle particulière.
- issue: Lien syntaxique de « l’élévation de la quête »
  choice: Conserver l’expression comme fragment ouvert, avec une virgule finale
  alternative: La rattacher à la déclaration précédente ou compléter implicitement la proposition
  rationale: L’extrait se poursuit au-delà du segment et l’alignement est seulement moyen. La traduction ne doit donc pas fabriquer une proposition complète ni résoudre prématurément son rattachement.
translation_notes:
  register: Français international actuel, digne et lisible. La tournure paradoxale et l’étrangeté du premier titre sont maintenues. La virgule finale signale que le dernier syntagme reste syntaxiquement ouvert dans cet extrait.
