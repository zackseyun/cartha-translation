translation:
  language: fr
  text: 'ceux qui sont avec moi,

    et les femmes qui sont au-dedans.[a]


    C’est moi, celle qui est honorée,

    et celle qu’ils louent,

    et celle qu’ils méprisent avec dédain.


    Je suis…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « au-dedans » ne précise pas ici de qui ou de quoi il s’agit. On peut aussi comprendre : « les femmes qui sont en moi », mais l’extrait laisse le rapport exact ouvert.'
    reason: ambiguïté grammaticale et portée du complément locatif
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: ceux qui sont avec moi
  rationale: Le segment commence au milieu d’une construction. Cette formulation conserve la valeur existentielle de ϣⲟⲟⲡ et le rapport exprimé par « avec moi », sans transformer le fragment en impératif.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: les femmes
  rationale: ϩⲓⲟⲙⲉ est le pluriel de « femme » ; il ne faut pas le confondre avec le mot copte désignant les pauvres.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: qui sont au-dedans
  rationale: La proposition relative décrit les femmes comme étant à l’intérieur. Le français garde l’expression sans préciser un complément que l’extrait ne rend pas explicite.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: C’est moi, celle qui…
  rationale: La tournure française rend la copule et son accord féminin tout en introduisant naturellement la série de désignations paradoxales.
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: celle qui est honorée
  rationale: Il s’agit d’une forme nominalisée féminine signifiant « l’honorée », non d’un nom signifiant « apparence ».
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: celle qu’ils louent
  rationale: La construction relative passive de sens désigne celle vers qui se porte l’action de louer ou bénir. « Louent » prépare l’antithèse avec « méprisent ».
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: celle qu’ils méprisent
  rationale: Le verbe emprunté au grec καταφρονεῖν signifie mépriser ou dédaigner ; le pronom féminin renvoie à la locutrice.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: avec dédain
  rationale: Dans ce contexte, ϣⲱⲥ exprime le mépris ou le dédain et renforce le verbe précédent ; il ne désigne pas ici une voix.
- source_word: ⲁⲛⲟⲕ
  choice: Je suis…
  rationale: Le dernier mot amorce la déclaration suivante. Les points de suspension signalent que l’extrait s’interrompt sans compléter la formule.
theological_decisions:
- issue: Identité féminine de la locutrice
  choice: Maintenir explicitement le féminin dans « celle qui »
  alternative: Employer une formule non genrée comme « je suis l’être honoré »
  rationale: La grammaire copte marque le féminin ; l’effacer atténuerait un trait essentiel de la voix du texte.
- issue: Paradoxe entre honneur, louange et mépris
  choice: Conserver les affirmations côte à côte sans les harmoniser
  alternative: Les répartir entre différents groupes ou moments
  rationale: Le texte attribue directement à la même locutrice ces expériences opposées ; cette tension doit rester ouverte.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme répétitif est conservé pour rendre le rythme proclamatoire du texte. L’ouverture demeure un fragment syntaxique, conformément à l’extrait fourni.
