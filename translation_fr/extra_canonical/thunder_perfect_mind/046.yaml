base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: fr
  text: 'et celle qui n’a pas d’image parmi les barbares.


    Je suis celle qu’on a haïe en tout lieu,

    et celle qu’on a aimée en tout lieu.


    Je suis celle qu’on appelle « la Mort »,

    et je suis celle qu’on appelle « la Loi ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec passé en copte et traduit par « Loi » peut aussi signifier « coutume » ou « norme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: celle qui n’a pas d’image parmi les barbares
  rationale: Suit la construction négative du copte et la lecture corrigée du passage, sans réintroduire la question sur les Grecs provenant d’un mauvais alignement.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis celle
  rationale: Conserve l’anaphore solennelle et tient compte du référent féminin indiqué par la copule copte.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: qu’on a haïe / qu’on a aimée
  rationale: Préserve directement l’antithèse structurante entre haine et amour, avec l’accord féminin en français.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: en tout lieu
  rationale: 'ⲙⲁ signifie « lieu » et ⲛⲓⲙ, après un nom, exprime normalement la totalité distributive : « chaque/tout lieu », plutôt que « beaucoup de lieux ».'
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: qu’on appelle
  rationale: Rend naturellement en français la formule copte signifiant appeler ou nommer quelqu’un.
- source_word: ⲡⲙⲟⲩ
  choice: la Mort
  rationale: Le nom défini fonctionne ici comme une désignation attribuée à la locutrice; la majuscule en marque la portée titulaire.
- source_word: ϣⲁⲩⲙⲟⲩⲧⲉ
  choice: qu’on appelle
  rationale: Le préfixe ϣⲁ- a ici une valeur aoristique ou habituelle, rendue par le présent général, et non par un futur.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: la Loi
  rationale: Le terme grec emprunté νόμος désigne couramment la loi; la traduction garde cependant en note la possibilité sémantique de « coutume » ou « norme ».
theological_decisions:
- issue: Portée de « la Loi » comme auto-désignation
  choice: Conserver « la Loi » sans préciser de quelle loi il s’agit
  alternative: Identifier explicitement la Loi mosaïque, une loi divine ou un principe cosmique
  rationale: Le texte ne fournit pas ici de détermination suffisante; une identification confessionnelle ou doctrinale résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « Je suis celle » et le parallélisme des propositions sont conservés pour restituer la cadence de la proclamation. « En tout lieu » est légèrement soutenu mais clair, et correspond à la tournure distributive du copte.
