translation:
  language: fr
  text: '**14.** Fermez-leur la bouche ![a] Jugez-les avant qu’ils ne vous saisissent, car le juge de l’injustice est parmi vous. Si vous êtes libérés lors de la venue de celui qui vous libérera,[b] ou si vous vous libérez…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début est mal reconnu dans l’extrait OCR. La lecture du manuscrit donne vraisemblablement l’ordre de leur fermer la bouche, et non la déclaration « Je suis celle qui crie ».
    reason: textual_ocr_correction
  - marker: b
    text: Le copte joue sur plusieurs formes de ⲕⲁ ⲉⲃⲟⲗ, qui signifie ici « relâcher, libérer » ; la formulation exacte autour de « la venue » est partiellement incertaine.
    reason: lexical_and_textual_note
  - marker: c
    text: La phrase se poursuit au-delà de l’extrait fourni ; les points de suspension signalent cette coupure matérielle et non une conclusion certaine.
    reason: excerpt_boundary
lexical_decisions:
- source_word: 'ⲭⲣⲱ … ⲣⲱⲟⲩ (OCR : ⲭⲣⲟⲉⲓ ⲧⲉⲣⲟⲟⲩ)'
  choice: Fermez-leur la bouche
  rationale: Le fac-similé OCR semble avoir fusionné ou mal reconnu les mots. La lecture contextuelle « fermer leur bouche » rend l’impératif et évite de confondre ⲭⲣⲱ avec un verbe signifiant « crier ».
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: Jugez-les
  rationale: Le composé gréco-copte exprime ici l’action de juger ou de rendre un jugement sur eux.
- source_word: ⲉⲙⲡⲁⲧⲟⲩⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: avant qu’ils ne vous saisissent
  rationale: La construction ⲉⲙⲡⲁⲧⲟⲩ marque l’antériorité (« avant qu’ils… »), et ⲧⲁϩⲉ ⲉ- signifie atteindre, prendre ou saisir.
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: le juge de l’injustice
  rationale: Cette traduction conserve le génitif et la formulation paradoxale du texte, sans préciser si le juge commet, représente ou juge l’injustice.
- source_word: ⲕⲁ … ⲉⲃⲟⲗ
  choice: libérer
  rationale: Dans cette séquence, la construction signifie relâcher ou libérer. « Chasser » ou « jeter dehors » ne convient pas au réseau syntaxique où les formes passive et active se répondent.
- source_word: ϩⲙ ⲡϫⲓⲛⲓ
  choice: lors de la venue
  rationale: Le nom verbal désigne ici la venue ou l’arrivée, non la face ou la surface.
theological_decisions:
- issue: Identité du « juge de l’injustice »
  choice: Conserver « le juge de l’injustice » sans explicitation
  alternative: « le juge injuste » ou « celui qui juge l’injustice »
  rationale: Le rapport génitif demeure ambigu dans le copte. Le rendre par un adjectif ou par un complément objectif trancherait indûment la tension du passage.
- issue: Agent de la libération
  choice: « celui qui vous libérera »
  alternative: Identifier cet agent à une figure salvatrice précise
  rationale: Le texte annonce un libérateur sans le nommer ; la traduction ne lui attribue donc aucune identité doctrinale.
translation_notes:
  register: 'Français international actuel, digne et direct. Les impératifs gardent la vigueur polémique du copte. La répétition de « libérer » est volontaire : elle reproduit le jeu verbal du texte au lieu de le lisser.'
