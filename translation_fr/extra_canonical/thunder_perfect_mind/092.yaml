base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: fr
  text: 'Je suis la préparation de toute personne[a],


    mon intelligence, au-dedans[b].


    Je suis l’articulation de mon nom[c].


    Je suis le cri qui sort,


    et je suis celle qui entend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte ⲥⲟⲃⲧⲉ signifie « préparation » ou « équipement »; il ne désigne pas normalement l’« intelligence ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la suite se lit approximativement : « mon intelligence au-dedans ». Sa relation exacte avec la proposition précédente demeure elliptique.'
    reason: source_ambiguity
  - marker: c
    text: Le mot ⲡⲱϣⲥ peut exprimer la division, la séparation ou la distinction. Dans le contexte d’un nom, on peut comprendre son « articulation » ou sa « prononciation »; littéralement, « la division de mon nom » reste possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: la préparation
  rationale: Le substantif renvoie d’abord à la préparation ou à l’équipement. « Préparation » conserve cette valeur concrète et abstraite sans lui substituer le sens cognitif non attesté d’« intelligence ».
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: de toute personne
  rationale: ⲣⲱⲙⲉ désigne l’être humain ou la personne, et ⲛⲓⲙ signifie « tout, chaque ». Cette formulation est exacte et naturelle en français actuel.
- source_word: ⲡⲁⲛⲟⲩⲥ
  choice: mon intelligence
  rationale: Le préfixe possessif ⲡⲁ- impose « mon »; le nom d’emprunt grec νοῦς peut désigner l’intelligence, l’esprit ou la pensée. « Intelligence » maintient ici la faculté intérieure sans connotation spiritualiste excessive.
- source_word: ⲉϩⲟⲩⲛ
  choice: au-dedans
  rationale: L’adverbe marque le mouvement ou la situation vers l’intérieur. Le détachement poétique respecte la syntaxe elliptique de l’extrait.
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: l’articulation de mon nom
  rationale: ⲡⲱϣⲥ évoque la division, la distinction ou la séparation; appliqué à un nom, « articulation » rend plausiblement sa segmentation ou sa prononciation sans transformer le mot en « connaissance ».
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: le cri qui s’élève au-dehors
  rationale: ϣⲕⲁⲕ exprime le fait de crier, tandis que ⲉⲃⲟⲗ indique le déploiement vers l’extérieur. La formulation française conserve la force vocale et le mouvement.
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: celle qui entend
  rationale: Le verbe ⲥⲱⲧⲙ signifie directement « entendre, écouter ». « Celle » suit le genre grammatical féminin par lequel la voix se désigne dans ⲁⲛⲟⲕ ⲧⲉ.
theological_decisions:
- issue: Identité de la voix qui parle
  choice: celle qui entend
  alternative: qui entend / la personne qui entend
  rationale: Le texte emploie la forme copulative féminine ⲧⲉ. Le féminin est donc conservé sans identifier la voix à une figure théologique particulière.
- issue: Rapport entre la préparation et l’intelligence intérieure
  choice: 'Maintien de l’ellipse : « mon intelligence, au-dedans »'
  alternative: « la préparation intérieure de l’intelligence de toute personne »
  rationale: La construction de l’extrait est difficile et peut être comprise comme une apposition ou une proposition elliptique. La traduction ne fusionne pas les éléments en une affirmation anthropologique plus précise que le copte.
translation_notes:
  register: Français international moderne, poétique et digne. Les reprises de « Je suis » et le parallélisme sont conservés. Les termes techniques ou confessionnels sont évités; les ellipses et les incertitudes lexicales réelles du copte sont signalées plutôt que résolues silencieusement.
