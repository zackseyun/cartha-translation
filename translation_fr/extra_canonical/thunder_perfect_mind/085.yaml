base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: fr
  text: 'Vision et maîtrise de soi


    du cœur, présentes en moi[a] —

    je suis l’écoute accessible à tous[b]

    et la parole qu’on ne peut saisir[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte copte rattache « présentes en moi » à « vision et maîtrise de soi », et non au « cœur ». Certains ont toutefois compris l’ouverture comme « une lampe du cœur ».
    reason: grammar_and_lexical_alternative
  - marker: b
    text: Le terme traduit par « accessible » peut aussi évoquer ce qui est disponible ou vient à quelqu’un, plutôt qu’une chose que l’on atteint par ses propres efforts.
    reason: lexical_alternative
  - marker: c
    text: Ou « qu’on ne peut comprendre »; le verbe peut évoquer aussi bien le fait de saisir que celui de comprendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: vision
  rationale: Emprunt au grec ὅρασις, qui désigne la vision ou la vue; « vision » garde ici la portée abstraite et intérieure liée au cœur.
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: maîtrise de soi
  rationale: Emprunt au grec ἐγκράτεια; « maîtrise de soi » est naturel en français moderne et évite les connotations plus étroites de « tempérance ».
- source_word: ⲙⲫⲏⲧ
  choice: du cœur
  rationale: Le préfixe ⲙ- est compris comme génitif; la nuance intérieure est ensuite exprimée par ⲛϩⲏⲧ.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: présentes en moi
  rationale: Le préfixe relatif féminin ⲉⲥ- rattache la proposition aux deux noms féminins « vision » et « maîtrise de soi », non au nom masculin « cœur ». Le pluriel français rend ce rattachement aux deux qualités.
- source_word: ⲡⲥⲱⲧⲙ
  choice: l’écoute
  rationale: Le substantif signifie l’acte d’entendre ou d’écouter. « Écoute » préserve le lien concret et paradoxal avec « parole » tout en restant idiomatique.
- source_word: ⲉⲧϣⲏⲡ
  choice: accessible
  rationale: Le contexte permet une nuance de disponibilité ou de possibilité d’accès; « accessible » évite de présenter cette écoute comme un accomplissement humain.
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: à tous
  rationale: Rend directement l’expression universelle sans alourdir le vers.
- source_word: ⲡϣⲁϫⲉ
  choice: la parole
  rationale: Peut désigner parole, discours ou énoncé; « parole » forme en français une paire naturelle avec « écoute » sans imposer l’idée d’un mot isolé.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: qu’on ne peut saisir
  rationale: « Saisir » conserve le double sens physique et intellectuel qui nourrit le paradoxe du poème.
theological_decisions:
- issue: Rattachement de « présentes en moi »
  choice: à « vision et maîtrise de soi »
  alternative: au « cœur »
  rationale: L’accord féminin singulier du relatif copte peut reprendre chacun des deux substantifs féminins coordonnés, tandis que « cœur » est masculin; la traduction française emploie donc le pluriel pour reprendre l’ensemble coordonné.
- issue: Portée de l’impossibilité finale
  choice: « saisir », avec ambiguïté physique et cognitive
  alternative: « comprendre » seulement
  rationale: Le texte poétique juxtapose écoute et parole dans une tension paradoxale; réduire le verbe à la seule compréhension intellectuelle dissiperait une ambiguïté significative.
translation_notes:
  register: Vers libres, sobres et dignes. Le vocabulaire est moderne et courant, mais conserve l’abstraction et les paradoxes de l’original. « Écoute » a été préféré à « audition » pour éviter un registre technique, et « parole » à « discours » pour maintenir la densité poétique.
