lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: La grandeur, en parties, vient de la petitesse
  rationale: Rend ⲙⲛⲧⲛⲟϭ et ⲙⲛⲧⲕⲟⲩⲉⲓ par les abstraits antithétiques « grandeur » et « petitesse »; ⲉⲃⲟⲗ ϩⲛ exprime ici la provenance. « En parties » conserve sans la lisser la formulation difficile ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: Car ils connaissent
  rationale: Analyse ⲉϣⲁⲩ- comme préfixe habituel à la troisième personne du pluriel, suivi de ⲥⲟⲩⲱⲛ, plutôt que de détacher ϣⲁⲩ comme un verbe signifiant « vieillir ».
- source_word: ⲉⲧⲃⲉ ⲟⲩ ⲧⲉⲧⲛⲥⲁϩⲟⲩ ⲙⲙⲟⲉⲓ ⲁⲩⲱ ⲧⲉⲧⲛⲧⲁⲉⲓⲟ ⲙⲙⲟⲉⲓ
  choice: Pourquoi me maudissez-vous tout en m’honorant ?
  rationale: Suit la correction probable de l’OCR ⲉⲧⲕⲉ ⲟⲩ en ⲉⲧⲃⲉ ⲟⲩ, « pourquoi ». Les verbes signifient respectivement « maudire » et « honorer ». « Tout en » exprime leur simultanéité paradoxale sans supprimer la tension.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ ⲁⲩⲱ ⲁⲧⲉⲧⲛⲛⲁ
  choice: Vous avez blessé, et vous avez eu compassion
  rationale: Reconnaît dans ⲁ- le marqueur de l’accompli. « Blesser » et « avoir compassion » maintiennent l’opposition, sans ajouter un complément absent du texte transmis.
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ ⲛⲛϣⲟⲣⲡ
  choice: Ne rejetez pas les choses premières
  rationale: Rend l’impératif négatif et comprend ⲛⲛϣⲟⲣⲡ comme « les choses premières ». Le verbe transmis est incertain; « rejeter » conserve l’idée générale d’expulsion sans imposer l’image plus précise de verser.
theological_decisions:
- issue: Paradoxe entre malédiction et honneur, blessure et compassion
  choice: Conserver les oppositions sans les harmoniser
  alternative: Expliquer que des groupes différents accomplissent les actions opposées, ou attribuer à chaque action un objet distinct
  rationale: Le passage ne fournit pas ces distinctions. Sa voix poétique juxtapose délibérément les contraires.
- issue: Sens de « les choses premières »
  choice: Garder une expression ouverte
  alternative: Traduire par « les origines », « les commencements » ou une catégorie cosmologique déterminée
  rationale: Le pluriel substantivé peut évoquer ce qui est premier sans définir précisément une doctrine des origines.
translation_notes:
  register: Français international moderne, sobre et poétique. Le vouvoiement pluriel reflète la deuxième personne du pluriel copte. La ponctuation et « tout en » rendent lisible le paradoxe sans en résoudre la portée. Les formulations inhabituelles « en parties » et « choses premières » sont maintenues parce que le texte source reste sémantiquement ouvert.
