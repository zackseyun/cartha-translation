  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
translation:
  language: fr
  text: 'La grandeur, en parties, vient de la petitesse[a].


    Car ils connaissent la petitesse à partir de la grandeur.


    Pourquoi me maudissez-vous et m’honorez-vous ?


    Vous avez blessé, et vous avez eu compassion.


    Ne rejetez pas les choses premières[b].'
