    issue: Impératif français peu naturel
    rationale: « Saisissez-vous vous-mêmes » est lourd et ambigu en français contemporain. Il risque d’être compris au sens physique plutôt que comme une injonction à se prendre ou se tenir soi-même.
  - severity: medium
    issue: Rendu de τύπος imprécis dans la proposition finale
    rationale: « En a fait une empreinte » présente l’objet comme une empreinte matérielle, alors que ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ exprime plus naturellement l’idée d’en faire un type, une figure ou un modèle. « Modèle » conserve mieux cette valeur sans imposer une lecture doctrinale.
