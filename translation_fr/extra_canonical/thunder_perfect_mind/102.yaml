base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/102.yaml
  text: 'Take hold of yourselves[a];

    for your inside is your outside[c][b],

    and the one who fashions your outside

    is the one who shaped it.'
translation:
  language: fr
  text: '**18.** Prenez-vous en main[a] ;


    car votre intérieur est votre extérieur,


    et celui qui façonne votre extérieur


    est celui qui en a fait un modèle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Saisissez-vous vous-mêmes » ou « Tenez-vous vous-mêmes ». Le verbe ⲁⲙⲁϩⲧⲉ signifie « saisir, tenir fermement » ; l’expression peut évoquer la prise ou la maîtrise de soi.'
    reason: lexical_alternative
  - marker: b
    text: L’expression ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ contient le mot grec τύπος, qui peut signifier « modèle », « empreinte », « marque » ou « figure ». Le pronom copte est au masculin singulier, mais son référent précis demeure incertain dans cet extrait.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: Saisissez-vous vous-mêmes
  rationale: ⲁⲙⲁϩⲧⲉ est compris comme un impératif, « saisir, prendre fermement », avec le pronom de deuxième personne du pluriel. La formulation française conserve la force réflexive de l’expression.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: votre intérieur
  rationale: ⲥⲁϩⲟⲩⲛ désigne l’intérieur ou ce qui est au-dedans. La répétition apparente de ⲡⲉⲧⲛ dans l’OCR est traitée comme une dittographie.
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: votre extérieur
  rationale: ⲥⲁⲃⲟⲗ signifie « dehors, extérieur ». Le parallélisme intérieur/extérieur est central et doit rester explicite.
- source_word: ⲡⲉⲧⲣⲡⲗⲁⲥⲥⲉ
  choice: celui qui façonne
  rationale: Le verbe emprunté au grec πλάσσω évoque l’action de former ou modeler. « Façonner » est naturel en français et conserve l’image artisanale.
- source_word: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: en a fait une empreinte
  rationale: Le grec τύπος peut désigner une marque, une empreinte, une forme ou un modèle. « Empreinte » maintient ici le champ lexical du façonnage sans imposer une lecture typologique.
theological_decisions:
- issue: Relation entre l’intérieur et l’extérieur
  choice: 'Conserver l’identité paradoxale : « votre intérieur est votre extérieur »'
  alternative: Expliciter une harmonie ou une opposition entre l’être intérieur et l’apparence extérieure
  rationale: La proposition nominale affirme directement cette identité paradoxale. L’expliciter résoudrait une tension que le texte laisse intacte.
- issue: Référent du pronom masculin singulier dans ⲙⲙⲟϥ
  choice: Employer « en » pour ne pas fixer excessivement le référent
  alternative: « a fait de lui un modèle » ou « lui a donné sa forme »
  rationale: Le pronom copte est masculin singulier, mais son antécédent exact demeure difficile dans cet extrait. La formulation française maintient le lien avec l’extérieur façonné tout en évitant d’ajouter un référent humain certain.
translation_notes:
  register: Français international moderne, sobre et solennel. Le rythme en courtes lignes et le parallélisme « intérieur / extérieur » sont conservés. La formulation évite le vocabulaire technique de la typologie tout en signalant en note la richesse de τύπος.
