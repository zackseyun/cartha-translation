translation:
  language: fr
  text: '**Le Tonnerre, intellect parfait**


    J’ai été envoyée depuis la Puissance[a],


    et je suis venue[b] vers ceux qui méditent sur moi,


    et je me suis trouvée[c] parmi ceux qui me cherchent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La Puissance » rend vraisemblablement le grec δύναμις employé en copte. Ni l’article ni le mot correspondant ne sont visibles dans cet extrait OCR ; ils sont restitués d’après les témoins édités.
    reason: La provenance « depuis la Puissance » dépend ici d’une restitution éditoriale, non des caractères lisibles dans l’extrait fourni.
  - marker: b
    text: 'L’OCR donne ⲛⲧⲁⲓⲥⲱⲧⲙ, « j’ai entendu », tandis que les éditions lisent généralement une forme du verbe « venir ». Si la lecture de l’OCR était confirmée, la proposition se comprendrait plutôt : « et j’ai entendu ceux qui pensent à moi » ; une analyse passive (« j’ai été entendue par ceux qui pensent à moi ») a aussi été proposée.'
    reason: La leçon visible dans l’OCR et la leçon éditoriale usuelle impliquent des verbes différents.
  - marker: c
    text: La construction ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ peut se comprendre « je me suis trouvée », « j’ai été trouvée » ou, selon l’analyse, « ils m’ont trouvée ». La formulation réflexive conserve cette indétermination sans introduire d’agent.
    reason: La syntaxe de « trouver » avec le pronom de première personne admet plusieurs analyses.
lexical_decisions:
- source_word: ⲧⲃⲣⲟⲛⲧⲏ
  choice: Le Tonnerre
  rationale: Emprunt au grec βροντή, « tonnerre ». L’article français est requis dans ce titre et suit le genre du nom français.
- source_word: ⲛⲟⲩⲥ
  choice: l’Intellect
  rationale: Le grec νοῦς désigne ici l’intellect ou l’esprit comme faculté de connaissance. « Intellect » conserve mieux que « esprit » la précision et l’étrangeté du titre.
- source_word: ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: parfait
  rationale: L’emprunt grec τέλειος peut signifier « parfait », « accompli » ou « complet ». « Parfait » convient à l’épithète tout en restant traditionnel et direct.
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: J’ai été envoyée
  rationale: La formulation exprime un envoi vers l’extérieur. Le féminin suit la voix révélatrice féminine de l’ensemble de l’œuvre, sans identifier davantage celle qui parle.
- source_word: (lecture éditoriale) ⲛⲧⲉ ⲧⲇⲩⲛⲁⲙⲓⲥ
  choice: depuis la Puissance
  rationale: « Puissance » rend le grec δύναμις et la majuscule signale son emploi possible comme désignation titulaire. « Depuis » exprime la provenance sans préciser indûment la nature de cette Puissance.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: méditent sur moi
  rationale: ⲙⲉⲉⲩⲉ désigne ici une pensée soutenue ou réfléchie ; « méditer sur » garde la tonalité contemplative.
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (lecture éditoriale courante)
  choice: je suis venue
  rationale: La traduction suit la lecture courante ⲉⲓ, « venir », qui correspond au parallélisme du passage. La leçon visible dans l’OCR est explicitement conservée en note comme variante possible.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ
  choice: je me suis trouvée
  rationale: Cette tournure française garde la forme réflexive du copte et laisse ouvertes les nuances « je me suis trouvée » et « j’ai été trouvée », sans imposer un agent extérieur.
- source_word: ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: ceux qui me cherchent
  rationale: Rendu direct du participe substantivé et de la construction exprimant la recherche de la locutrice.
theological_decisions:
- issue: Statut de « la Puissance »
  choice: 'Majuscule et article définis : « la Puissance »'
  alternative: « une puissance » ou « la force »
  rationale: La formulation traditionnelle peut fonctionner comme un titre ou une réalité personnifiée, mais le texte n’en précise pas ici l’identité. La traduction conserve donc cette ouverture sans l’assimiler à une figure doctrinale déterminée.
- issue: Genre de la voix qui parle
  choice: 'Accords au féminin : « envoyée », « venue », « trouvée »'
  alternative: Reformulation sans accord de genre
  rationale: L’œuvre présente globalement sa voix révélatrice comme féminine, et le copte ne marque pas le genre dans ces formes verbales. Le français exige ici un accord ; le féminin respecte le cadre littéraire sans définir ontologiquement la locutrice.
- issue: Voix du verbe « trouver »
  choice: 'Forme réflexive : « je me suis trouvée »'
  alternative: 'Forme passive : « j’ai été trouvée »'
  rationale: La construction copte permet plusieurs analyses. La forme réflexive reproduit au plus près « je trouvai moi » et préserve la tension entre découverte de soi et découverte par autrui.
translation_notes:
  register: Français international actuel, sobre et poétique. Le parallélisme en trois membres est conservé. « Intellect » maintient la portée technique de νοῦς, tandis que les verbes restent simples et accessibles. Les accords féminins rendent la voix littéraire de l’œuvre ; les notes signalent les endroits où l’extrait copte ou son OCR ne permet pas une certitude absolue.
