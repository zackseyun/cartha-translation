base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
translation:
  language: fr
  text: '**1.** Car elle est sage, et elle est une petite[a].


    Ne détourne pas non plus les grandes choses,


    partie par partie,


    de la petitesse[b] —


    car elles connaissent la petitesse[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « elle est une petite ». Le mot peut aussi évoquer une personne humble, insignifiante, simple ou enfantine; « ignorante » est possible selon le contexte, mais ne doit pas être imposé ici.
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe peut également se rendre plus littéralement : « Ne détourne pas les grandes choses, par parties, de la petitesse. » Le rapport exact entre « grandes choses », « parties » et « petitesse » demeure dense.'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Le verbe est à la troisième personne du pluriel : « elles connaissent ». Son antécédent précis n’est pas entièrement assuré dans ce bref extrait; il peut renvoyer aux « grandes choses ».'
    reason: referent_ambiguity
lexical_decisions:
- source_word: ϫⲉ
  choice: Car
  rationale: La particule introduit ici naturellement une explication ou une justification.
- source_word: ⲥⲥⲁⲃⲉ(ⲕ)
  choice: elle est sage
  rationale: Le préfixe féminin singulier ⲥ- est rendu comme sujet, plutôt que de lire à tort un impératif.
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  choice: elle est petite
  rationale: La copule féminine ⲧⲉ confirme une proposition à la troisième personne; ⲕⲟⲩⲉⲓ désigne littéralement ce qui est petit, sans imposer ici le sens interprétatif de « folle ».
- source_word: ⲙⲡⲣⲧⲥⲧⲟ … ⲉⲃⲟⲗ ϩⲛ
  choice: Ne détourne pas … de
  rationale: La construction négative impérative et le groupe directionnel expriment l’idée de détourner ou d’éloigner quelque chose de quelque chose.
- source_word: ϩⲉⲛⲙⲛⲧⲛⲟϭ
  choice: de grandes choses
  rationale: La formation abstraite/plurielle peut désigner des grandeurs ou de grandes choses; cette seconde formulation est plus naturelle en français dans la présente syntaxe.
- source_word: ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: partie par partie
  rationale: Le nom emprunté au grec μέρος signifie « partie »; la tournure distributive française conserve l’idée de fragmentation.
- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: la petitesse
  rationale: Le préfixe abstrait ⲙⲛⲧ- joint à ⲕⲟⲩⲉⲓ donne littéralement « petitesse », en contraste avec les grandes choses.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: elles connaissent
  rationale: La forme est comprise comme un aoriste/circonstanciel à la troisième personne du pluriel, et non comme une proposition limitative « jusqu’à ce qu’elles connaissent ».
- source_word: ⲅⲁⲣ
  choice: car
  rationale: La particule grecque empruntée marque l’explication ou la cause.
theological_decisions:
- issue: Paradoxe entre sagesse et petitesse
  choice: Conserver les deux affirmations au féminin sans expliquer leur relation
  alternative: Transformer « petite » en « folle » ou « ignorante » afin de créer une antithèse explicite
  rationale: Le texte affirme simultanément les deux qualités; traduire ⲕⲟⲩⲉⲓ par une notion intellectuelle résoudrait un paradoxe que le texte laisse ouvert.
- issue: Référent du pluriel final
  choice: Employer « elles » sans préciser davantage l’antécédent
  alternative: Expliciter « les grandes choses connaissent la petitesse » ou employer un sujet indéfini
  rationale: La forme copte est plurielle, mais l’extrait ne permet pas d’identifier son référent avec une entière certitude.
translation_notes:
  register: Français international moderne, sobre et poétique. Le féminin de la voix ou figure évoquée est maintenu. La mise en lignes fait ressortir le contraste entre grandeur et petitesse sans ajouter d’interprétation doctrinale.
