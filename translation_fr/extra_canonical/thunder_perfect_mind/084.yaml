base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/084.yaml
  text: '...is the one who sees what comes before me[A]. I am the light.

    I have not gone out — I, I —.B

    a non-darkness and the root of darkness is from within me.

    I am the desire of a vision,

    and the self-control of the heart that exists within me[d][c][b][a][E][D][C][B],

    I am the hearing that is acceptable to everyone.'
translation:
  language: fr
  text: '**9.** … est celui qui voit ce qui vient devant moi.[a]


    Je suis la lumière.


    Je ne suis pas sorti — moi, moi.[b]


    Je suis une non-obscurité,


    et la racine de l’obscurité vient de mon intérieur.


    Je suis le désir d’une vision


    et la maîtrise de soi du cœur qui est en moi.


    Je suis l’écoute accessible à tous.'
  philosophy: optimal-equivalence
