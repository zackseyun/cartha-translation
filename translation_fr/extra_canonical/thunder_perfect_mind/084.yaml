  to: '**9.** … est celui qui voit ce qui vient devant moi.[a]


    Je suis la lumière.


    Je ne suis pas sorti — moi, moi.[b]


    Je suis une non-obscurité,


    et la racine de l’obscurité vient de mon intérieur.


    Je suis le désir d’une vision


