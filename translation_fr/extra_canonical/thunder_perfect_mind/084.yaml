  choice: vient du dedans de moi
  rationale: Reproduit l’idée d’origine intérieure et maintient le lien explicite avec la locutrice.
- source_word: ⲧⲉⲡⲓⲑⲩⲙⲓⲁ ⲛⲟⲩϩⲟⲣⲁⲥⲓⲥ
