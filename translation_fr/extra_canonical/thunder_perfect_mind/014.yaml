translation:
  language: fr
  text: 'Je suis la sœur et l’épouse[a].


    Je suis la mère de mon père


    et la sœur de mon mari,


    et lui est mon enfant[b].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte ⲥϩⲓⲙⲉ peut aussi signifier « femme ». « Épouse » est retenu ici en raison du contexte conjugal, sans exclure ce sens plus large.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ma progéniture » ou « ce que j’ai engendré ». La lecture retenue suit le contexte de parenté et la tradition textuelle courante. En raison de l’incertitude de l’OCR, certains pourraient lire un autre mot, auquel cas la phrase serait : « et lui est mon Seigneur ».'
    reason: lexical_and_textual_note
  - marker: c
    text: 'L’extrait se poursuit par une proposition incomplète : « Je suis la servante de mon… » (ⲁⲛⲟⲕ ⲧⲉ ⲧϩⲙϩⲁⲗ ⲛⲧⲉ ⲡⲁ—). Elle n’est pas intégrée au texte, car son complément manque.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲱⲛⲉ
  choice: sœur
  rationale: En sahidique, ⲥⲱⲛⲉ désigne normalement une « sœur ». Ce sens convient aux deux occurrences et préserve les paradoxes de parenté du poème. La traduction « fille » donnée dans la couche anglaise ne correspond pas au mot copte visible.
- source_word: ⲥϩⲓⲙⲉ
  choice: épouse
  rationale: Le mot peut désigner une « femme » ou, dans un contexte conjugal, une « épouse ». Ici, son parallélisme avec « sœur », puis les mentions de « mon mari » et de la descendance, favorisent « épouse », tandis qu’une note conserve le sens plus large.
- source_word: ⲙⲁⲁⲩ
  choice: mère
  rationale: Terme de parenté non ambigu, traduit directement afin de conserver le paradoxe « mère de mon père ».
- source_word: ⲉⲓⲱⲧ
  choice: père
  rationale: Terme usuel pour « père » ; la traduction littérale maintient la tension généalogique.
- source_word: ϩⲁⲓ (ⲡⲁϩⲁⲓ)
  choice: mari
  rationale: Avec le possessif, le mot désigne naturellement « mon mari » plutôt que simplement « mon homme ».
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: et lui est mon enfant
  rationale: ⲡⲁϫⲡⲟ renvoie à ce qui est engendré, à la progéniture. « Mon enfant » est idiomatique en français et conserve le paradoxe de filiation ; « lui » rend le pronom copte expressément repris.
- source_word: ϩⲙϩⲁⲗ
  choice: esclave (non intégré au texte principal)
  rationale: Le mot désigne un serviteur ou un esclave, ici au féminin avec l’article. La proposition est laissée hors du texte principal parce que son complément est tronqué dans l’extrait fourni.
theological_decisions:
- issue: Paradoxes de parenté
  choice: Les conserver sans les expliquer ni les harmoniser
  alternative: Interpréter les relations comme des titres symboliques précis
  rationale: Le texte juxtapose volontairement sœur, épouse, mère, père, mari et enfant. L’extrait ne fournit pas de clé autorisant une interprétation doctrinale unique.
translation_notes:
  register: Français international actuel, sobre et poétique. La disposition en vers et la répétition de « Je suis » reproduisent la structure déclarative. « Et lui est mon enfant » garde une légère solennité ainsi que l’insistance du pronom copte, sans rendre la phrase obscure.
