base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: fr
  text: 'Je suis celle à qui vous avez pensé,


    et vous vous êtes moqués de moi.



    Je suis sans instruction,


    et ils apprennent de moi.



    Je suis celle que vous avez méprisée,


    et vous pensez à moi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait fourni se termine ensuite au début d’une nouvelle déclaration (« Je suis… »), qui n’est pas assez complète pour être traduite ici.
    reason: textual_scope
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ / ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: penser à moi
  rationale: La construction désigne la personne vers laquelle se porte la pensée. « Penser à » est idiomatique en français et permet de reprendre le même verbe dans les deux occurrences.
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: vous vous êtes moqués de moi
  rationale: Le verbe ϣⲱⲥ signifie ici « se moquer de, tourner en dérision »; la forme est une proposition principale au parfait avec sujet à la deuxième personne du pluriel et objet à la première personne du singulier.
- source_word: ⲁⲧⲥⲃⲱ
  choice: sans instruction
  rationale: Le composé privatif signifie « dépourvue d’instruction, ignorante ». « Sans instruction » conserve le paradoxe sans la connotation fortement dépréciative que peut avoir « ignorante ».
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: on apprend de moi
  rationale: L’expression signifie littéralement recevoir ou acquérir l’instruction « de ma main », donc « apprendre de moi ». Le pronom indéfini « on » rend naturellement le sujet non précisé.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: mépriser
  rationale: Cet emprunt au grec καταφρονέω exprime le mépris ou le dédain. « Mépriser » distingue ce verbe de ϣⲱⲥ, rendu plus haut par « se moquer de ».
theological_decisions:
- issue: Genre de la voix qui parle
  choice: « celle » et accord féminin implicite dans « sans instruction »
  alternative: Formulation épicène ou masculine
  rationale: La seconde déclaration emploie explicitement la forme féminine ⲧⲉ avec la relative. Le français doit donc rendre visible la voix féminine sans lui attribuer une identité théologique non exprimée par le texte.
- issue: Paradoxe entre absence d’instruction et rôle d’enseignante
  choice: « Je suis sans instruction, et pourtant on apprend de moi »
  alternative: « Je suis ignorante, et ils sont instruits par moi »
  rationale: Le tour retenu maintient la tension voulue entre les deux propositions. « Pourtant » explicite leur rapport paradoxal sans expliquer ni résoudre ce paradoxe.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « Je suis » et de « vous pensez à moi » conserve la cadence des déclarations copulatives. Le tutoiement collectif possible en copte est rendu par « vous », forme naturelle et non marquée en français.
