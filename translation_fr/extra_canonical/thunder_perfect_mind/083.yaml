  yaml_path: translation/extra_canonical/thunder_perfect_mind/083.yaml
  text: 'I am the division and the stripping[a].

    I am the dwelling[c].

    And I am the robbery; I am

    the one who sees what comes

    down to me.

    I am the flight of the release[d][b][a][d][c][b].

    I am I.'
translation:
  language: fr
  text: '**8.** Je suis la division et la libération[a].


    Je suis la demeure[b].


    Et je suis le larcin[c] ; je suis


    celui qui voit ce qui descend


    vers moi.


    Je suis la fuite de la libération[d].


    Je suis moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes sont difficiles. ⲡⲡⲱⲧⲣ peut désigner une division ou une séparation ; ⲡⲕⲱⲗⲉⲃⲟⲗ est compris comme « libération », « remise » ou « abandon ».
    reason: lexical_alternative
  - marker: b
    text: Le mot copte est emprunté au grec μονή, « demeure, séjour ».
    reason: cultural_note
  - marker: c
    text: Le terme désigne l’action de voler ou de dérober ; on pourrait aussi traduire « le vol » ou « la rapine ».
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « la fuite de la libération/remise ». Le rapport entre les deux noms reste ouvert ; « remise » ou « abandon » sont également possibles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Je suis
  rationale: La construction copulative sahidique est reprise à l’identique afin de conserver la cadence insistante du discours.
- source_word: ⲡⲡⲱⲧⲣ
  choice: la division
  rationale: Le substantif est rendu selon sa valeur de séparation ou division, sans adopter la lecture spatiale « l’intérieur », qui demeure incertaine.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: le dépouillement
  rationale: La forme composée est comprise à partir de ⲕⲱⲗ avec ⲉⲃⲟⲗ, dans le sens d’enlever ou de dépouiller, plutôt que comme un terme signifiant « l’extérieur ».
- source_word: ⲧⲙⲟⲛⲏ
  choice: la demeure
  rationale: Emprunt au grec μονή, qui désigne une demeure ou un lieu où l’on reste ; « demeure » convient au registre poétique et reste concret.
- source_word: ⲡⲕⲱⲗ
  choice: le larcin
  rationale: Le mot renvoie à l’action de voler ou de dérober. « Larcin » évite en français une confusion indue avec le vol aérien ou la fuite.
- source_word: ⲡⲉⲧⲛⲁⲩ
  choice: celui qui voit
  rationale: La forme relative est traduite verbalement, de manière directe.
- source_word: ⲉⲧⲛⲏⲟⲩ
  choice: ce qui descend
  rationale: ⲛⲏⲟⲩ est compris comme une forme qualitative de « venir » ; avec ⲉϩⲣⲁⲓ, le mouvement est orienté vers le bas.
- source_word: ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: vers moi
  rationale: L’expression indique un mouvement descendant qui atteint la locutrice ; le verbe français porte déjà l’idée de descente.
- source_word: ⲫⲱⲧ
  choice: la fuite
  rationale: Il s’agit du mot copte signifiant « fuite » ou « action de fuir », et non de l’emprunt grec ⲫⲱⲥ, « lumière ».
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: de la délivrance
  rationale: La séquence est analysée comme le génitif ⲙ- suivi du substantif verbal ⲡⲕⲱ ⲉⲃⲟⲗ, « libération, remise, abandon », et non comme un parfait négatif.
- source_word: ⲁⲛⲟⲕ ⲁⲛⲟⲕ
  choice: Je suis moi
  rationale: La formulation volontairement abrupte conserve le redoublement final et sa force énigmatique.
theological_decisions:
- issue: Rapport paradoxal entre fuite et délivrance
  choice: la fuite de la délivrance
  alternative: la fuite qu’est la délivrance / la fuite loin de la délivrance
  rationale: Le génitif copte ne précise pas le rapport logique entre les deux noms. La traduction garde cette ambiguïté au lieu de choisir une interprétation théologique.
translation_notes:
  register: Français international moderne, poétique et digne. Les reprises de « Je suis » et les brèves unités syntaxiques préservent le rythme oraculaire. La traduction suit les corrections lexicales fondées sur le copte, tout en signalant les lectures réellement incertaines.
