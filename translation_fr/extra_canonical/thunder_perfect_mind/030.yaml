  text: Do not leave me cast out[c][b][a], and you will find me in riches.
translation:
  language: fr
  text: '**8.** Ne me laisse pas être jetée dehors, et vous me trouverez dans la richesse.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte passe d’une adresse au singulier (« ne me laisse pas ») à une adresse au pluriel (« vous me trouverez »). La traduction conserve ce changement. Les mots suivants dans l’OCR, « et ne regarde pas… », semblent ouvrir la proposition suivante.
    reason: textual_and_grammar_note
lexical_decisions:
- source_word: ⲙⲡⲣⲕⲁⲁⲧ
  choice: Ne me laisse pas
  rationale: L’impératif négatif copte s’adresse ici à une seule personne. Le français conserve cette adresse au singulier plutôt que d’harmoniser avec le pluriel de la proposition suivante.
- source_word: ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ
  choice: rejetée au-dehors
  rationale: La tournure exprime le fait d’être jetée ou laissée dehors. « Rejetée au-dehors » garde à la fois l’image spatiale et la nuance d’exclusion; le féminin correspond à la voix féminine qui parle dans l’œuvre.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vous me trouverez
  rationale: Le préfixe ⲧⲉⲧⲛ- marque la deuxième personne du pluriel au futur. Le passage du singulier au pluriel est donc maintenu.
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: dans la richesse
  rationale: ⲙⲛⲧⲣⲙⲁⲟ désigne l’état de richesse ou l’opulence. Le singulier abstrait français rend cette valeur plus directement que « parmi les riches », qui ferait des personnes le référent.
theological_decisions:
- issue: Identité de la locutrice et accord grammatical
  choice: rejetée
  alternative: rejeté / laissée dehors
  rationale: Le discours met en scène une voix féminine; l’accord féminin est naturel en français, sans ajouter d’identification doctrinale à cette voix.
- issue: Ancienne lecture « Je suis la guerre et la paix »
  choice: Traduire l’extrait copte effectivement aligné comme une exhortation
  alternative: Je suis la guerre et la paix
  rationale: La formule antithétique appartient à un passage antérieur. Les mots lisibles ici portent l’impératif « ne me laisse pas… » puis « vous me trouverez… »; répéter l’antithèse serait une erreur d’alignement.
translation_notes:
  register: Français international actuel, sobre et digne. La formulation reste proche de l’image copte tout en étant intelligible. Le texte principal n’intègre ni la fin de la proposition précédente, corrompue dans l’OCR, ni le début manifeste de la proposition suivante.
