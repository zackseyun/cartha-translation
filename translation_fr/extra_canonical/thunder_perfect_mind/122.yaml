  yaml_path: translation/extra_canonical/thunder_perfect_mind/122.yaml
  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: fr
  text: '**6.** Ne soyez pas sans me connaître dans un autre lieu ou à un autre moment.[a] Ne soyez pas sans me connaître. Ne soyez pas sans me connaître dans un autre lieu ou à un autre moment.


    Car je suis celui qui est advenu et celui qui adviendra.[b]


    Je suis l’Indulgence,[c] et celui qui adviendra.


    Je suis l’Indulgence, et celui qui adviendra.


    Je suis l’Indulgence, et…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la défense signifie « ne soyez pas sans connaissance de moi ». On peut aussi traduire : « ne soyez pas ignorants à mon sujet » ou « ne me méconnaissez pas ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe rendu par « advenir » peut aussi signifier « arriver », « devenir » ou « venir à l’existence ».
    reason: lexical_alternative
  - marker: c
    text: Le terme peut également se traduire par « compréhension », « pardon », « clémence » ou « consentement ».
    reason: lexical_alternative
  - marker: d
    text: L’extrait copte s’interrompt sur « et » ; la phrase se poursuit au-delà de ce segment. Les répétitions sont présentes dans l’extrait fourni.
    reason: textual_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: ne m’ignorez pas
  rationale: ⲙⲡⲣ- marque la défense, tandis que ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ signifie littéralement « être sans connaissance », donc « ignorer ». Il ne s’agit pas ici d’un causatif signifiant « faire connaître ».
- source_word: ⲕⲉⲙⲁ
  choice: un autre lieu
  rationale: Composé de ⲕⲉ, « autre », et ⲙⲁ, « lieu ».
- source_word: ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: un autre temps
  rationale: ⲟⲩⲟⲉⲓϣ désigne ici le temps ou le moment, et non une foule.
- source_word: ϣⲱⲡⲉ
  choice: advenir
  rationale: Le verbe peut signifier « arriver », « devenir » ou « venir à l’existence ». « Advenir » conserve à la fois la valeur événementielle et la possible portée ontologique de la formule.
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: l’Indulgence
  rationale: Emprunt au grec συγγνώμη, dont le champ sémantique comprend compréhension, indulgence, pardon et consentement. « Indulgence » convient à un titre personnifié sans réduire le mot à un sens seulement intellectuel ou juridique.
theological_decisions:
- issue: Identité de la locutrice et genre de « celui »
  choice: Conserver « celui qui est advenu / celui qui adviendra »
  alternative: « ce qui est advenu / ce qui adviendra » ou une formulation féminine
  rationale: Le copte emploie les formes masculines ⲡⲉⲛⲧⲁϥ et ⲡⲉⲧⲛⲁ. La traduction maintient ce signal grammatical malgré la voix féminine qui domine l’ensemble de l’œuvre, sans harmonisation théologique.
- issue: Portée de la formule « je suis l’Indulgence »
  choice: La laisser comme titre personnifié énigmatique
  alternative: Expliciter par « je suis celle qui pardonne » ou « je suis la Compréhension »
  rationale: Le texte formule une identification directe et paradoxale. L’expliciter imposerait une interprétation absente de la source.
translation_notes:
  register: Français international moderne, sobre et digne. Les répétitions incantatoires sont conservées. La traduction suit directement le copte fourni plutôt que le texte de consultation anglais, lequel ne correspond pas à ces lignes. « Advenir » et le titre « l’Indulgence » maintiennent l’étrangeté poétique et l’ambiguïté du passage sans les banaliser.
