  source_fidelity: Le draft suit correctement le copte plutôt que le texte anglais de consultation, dont le décalage est explicitement signalé dans l’audit. ⲣⲁⲧⲥⲟⲟⲩⲛ exprime l’état d’être sans connaissance de la locutrice, et ⲟⲩⲟⲉⲓϣ désigne ici un temps/moment. Les répétitions, les relatives masculines ⲡⲉⲛⲧⲁϥ / ⲡⲉⲧⲛⲁ et l’interruption finale sur ⲁⲩⲱ sont préservées.
  naturalness: « Ne m’ignorez pas » est possible, mais en français contemporain il évoque couramment le fait d’écarter volontairement quelqu’un plutôt que l’absence de connaissance. « Ne soyez pas sans me connaître » rend plus directement la valeur copte tout en restant compréhensible. « Dans un autre lieu ou à un autre moment » est également plus idiomatique que « en un autre lieu ou en un autre temps ».
  terminology: '« Indulgence » constitue un rendu défendable de ⲥⲩⲛⲅⲛⲱⲙⲏ et conserve le caractère de titre personnifié. « Advenu » rend sobrement ϣⲱⲡⲉ sans trancher entre événement, devenir et venue à l’existence. Le masculin de « celui » doit être maintenu : il reflète les relatives masculines du copte sans imposer une harmonisation interprétative.'
