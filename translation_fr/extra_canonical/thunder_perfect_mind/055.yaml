translation:
  language: fr
  text: '**10.** Je suis celle devant qui vous avez eu honte[a], et vous avez agi sans honte envers moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture « vous avez eu honte » repose sur l’antithèse du passage ; la segmentation de l’extrait copte transmis par l’OCR est incertaine.
    reason: textual_uncertainty
  - marker: b
    text: 'Ou : « vous avez été sans honte envers moi » ; « avec impudence » est également possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲁⲓ (lecture établie; OCR incertain)
  choice: Je suis celle
  rationale: Conserve la formule récurrente d’auto-identification et le féminin grammatical de la voix qui parle, attesté par le contexte textuel, sans le neutraliser par « la personne ».
- source_word: ϩⲱⲱⲧ / ⲉ ⲧⲟⲟⲧϥ (séquence OCR incertaine)
  choice: devant qui
  rationale: Rend naturellement en français l’idée de se trouver devant quelqu’un ou en sa présence, tout en gardant la force directe de l’adresse.
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ (analyse incertaine dans l’OCR)
  choice: vous avez eu honte
  rationale: La lecture contextuelle produit l’antithèse cohérente entre avoir honte et être sans honte; la formulation française ne masque pas l’incertitude, signalée dans la note.
- source_word: ⲙⲛⲧⲁⲧ…
  choice: sans honte
  rationale: Reproduit la construction privative et maintient le parallélisme lexical avec « honte », plutôt que d’introduire un jugement plus appuyé comme « avec effronterie ».
- source_word: ⲙⲙⲟⲉⲓ
  choice: envers moi
  rationale: Exprime l’orientation relationnelle à l’égard de la locutrice sans imposer le sens plus hostile de « contre moi ».
theological_decisions:
- issue: Genre grammatical et identité de la voix qui parle
  choice: celle
  alternative: la personne / celui ou celle
  rationale: Le féminin appartient à la présentation textuelle de la locutrice et doit rester visible; le conserver n’ajoute aucune identification doctrinale à cette figure.
translation_notes:
  register: 'Français international moderne, sobre et rythmé. « Je suis celle » préserve la cadence des déclarations « Je suis » ainsi que la voix féminine. La répétition de « honte » est volontaire: elle maintient l’antithèse concise et paradoxale du copte.'
