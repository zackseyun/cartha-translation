theological_decisions:
- issue: Sens de « ma crainte »
  choice: Conserver la formulation possessive ambiguë « ma crainte »
  alternative: « la crainte que j’inspire » ou « la peur que j’éprouve »
  rationale: Le texte ne tranche pas explicitement entre un génitif subjectif et objectif; préciser l’un des deux résoudrait indûment la tension.
