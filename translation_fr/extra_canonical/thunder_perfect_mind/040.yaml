lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Pourquoi
  rationale: Locution interrogative causale naturelle en français, convenant à la question rhétorique.
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: haïssez-vous
