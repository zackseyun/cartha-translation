translation:
  language: fr
  text: '**15.** Je suis parmi vous, vous qui vous [...] de [...][a]. Qui vous libérera[b] ? Ou, s’il vous en libère[c], qui pourra [...] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit est lacunaire : l’action accomplie par les destinataires et ce dont ils sortent ne peuvent pas être restitués avec certitude.'
    reason: textual_gap
  - marker: b
    text: L’expression copte peut aussi se traduire par « qui vous relâchera ? » ou « qui vous laissera partir ? ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « s’il vous libère hors de cela ». Le référent de « cela » se trouvait probablement dans la partie aujourd’hui perdue.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: Je suis parmi vous
  rationale: ϣⲟⲟⲡ exprime ici l’existence ou la présence, et ⲛⲧⲏⲏⲧⲉ signifie « parmi vous » ; cette traduction suit directement la syntaxe copte.
- source_word: ⲧⲏⲛⲉ
  choice: vous / vous-mêmes
  rationale: Il s’agit du pronom objet de deuxième personne du pluriel, non d’un terme désignant le pain. Dans la première proposition fragmentaire, « vous-mêmes » rend la valeur réfléchie suggérée par le contexte ; ensuite, « vous » convient avec « libérer ».
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: vous libérera
  rationale: La construction ⲕⲁ ... ⲉⲃⲟⲗ signifie relâcher, laisser aller ou libérer quelqu’un. « Libérer » est naturel en français et conserve la portée ouverte de l’expression.
- source_word: ⲛϩⲏⲧϥ
  choice: en
  rationale: Le pronom suffixé masculin singulier renvoie à une réalité mentionnée dans la lacune précédente. Le pronom français « en » exprime idiomatiquement « hors de cela », sans identifier à tort le référent perdu.
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ[...]
  choice: qui pourra [...] ?
  rationale: ⲛⲓⲙ introduit « qui ? » et ⲡⲉⲧⲛⲁϣ[...] commence une construction future exprimant vraisemblablement la capacité ; la lacune interdit de restituer le verbe complémentaire.
theological_decisions:
- issue: Nature de la libération évoquée
  choice: Ne pas préciser s’il s’agit d’une délivrance spirituelle, sociale, physique ou autre
  alternative: Expliciter une délivrance spirituelle ou salvifique
  rationale: Le passage conservé emploie un verbe général et son contexte immédiat est lacunaire. Une précision doctrinale dépasserait les données du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde visibles les lacunes du manuscrit et évite les anciennes lectures erronées liées au pain et au moulin. Le parallélisme interrogatif du copte est conservé.
