base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: fr
  text: '**10.** Mon père, et la sœur de mon mari — et lui, il est ma descendance[a]. Je suis la servante[b] de mon mari, et je suis la maîtresse[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma progéniture » ou « mon rejeton ». Le copte désigne ce qui est issu d’elle, non celui qui l’a engendrée.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esclave ». Le mot copte peut désigner une personne servante ou asservie ; « servante » convient mieux au registre français du passage tout en maintenant le contraste.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le féminin de « seigneur » ou de « maître ». « Maîtresse » exprime ici l’autorité ; le mot peut avoir d’autres connotations en français moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: mon père
  rationale: Possessif de première personne avec ⲉⲓⲱⲧ (« père »). Le syntagme est conservé tel quel, même si l’extrait commence au milieu d’une construction.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: la sœur de mon mari
  rationale: ⲥⲱⲛⲉ désigne une sœur, et ⲙⲡⲁϩⲁⲓ marque ici la relation avec « mon mari ».
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: et lui, il est ma descendance
  rationale: ⲛⲧⲟϥ est un pronom masculin emphatique; ⲡⲁϫⲡⲟ signifie « ma progéniture/ma descendance », non « celui qui m’a engendrée ». La dislocation « lui, il » rend l’insistance du copte.
- source_word: ⲧϩⲙϩⲁⲗ
  choice: la servante
  rationale: ϩⲙϩⲁⲗ signifie « serviteur, esclave »; l’article féminin appelle « servante ». Ce choix maintient l’antithèse avec ⲧϫⲟⲉⲓⲥ.
- source_word: ⲛⲧⲉ ⲡⲁϩⲁⲓ
  choice: de mon mari
  rationale: Le groupe génitival exprime ici l’appartenance ou le service envers le mari.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: la Dame
  rationale: Forme féminine de « seigneur/maître ». « Dame » conserve le titre et évite les connotations modernes possibles de « maîtresse ».
theological_decisions:
- issue: Paradoxe entre sujétion et autorité
  choice: « la servante » et « la Dame »
  alternative: « l’esclave » et « la maîtresse »
  rationale: La traduction conserve l’opposition explicite du copte sans l’expliquer ni l’harmoniser théologiquement.
- issue: Relation paradoxale avec le mari
  choice: « il est ma descendance »
  alternative: « il est celui qui m’a engendrée »
  rationale: Le sens nominal de ϫⲡⲟ dans cette construction est celui de progéniture ou descendance; la lecture inverse supprimerait le paradoxe attesté par le texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe fragmentaire du début est conservée parce que l’extrait copte fourni commence manifestement au milieu d’une séquence. Le tiret signale le changement vers la proposition emphatique sans reconstruire des mots absents. Les répétitions de « mon mari » et de « je suis » préservent la cadence incantatoire de l’original.
