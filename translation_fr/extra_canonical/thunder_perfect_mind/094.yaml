  text: You hear me in your calling of me[a], in a [...] that you utter. You did not hear[e][d][c][b]. I am the defense.
translation:
  language: fr
  text: Vous m’entendez dans le fait que vous m’appelez[a], dans un […] que vous prononcez[b]. Vous n’avez pas entendu. Je suis la défense[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression copte peut aussi se comprendre comme « dans votre invocation de moi ». Le texte décrit l’action d’appeler la locutrice, et non un ordre de l’écouter.
    reason: lexical_alternative
  - marker: b
    text: Après « dans un », le mot est perdu ou illisible. Il désignait probablement quelque chose que les destinataires prononcent ou profèrent ; la traduction laisse donc la lacune ouverte.
    reason: textual_lacuna
  - marker: c
    text: Le terme copte ⲧⲁⲡⲟⲗⲟⲅⲓⲁ, emprunté au grec ἀπολογία, peut aussi signifier « réponse justificative » ou « plaidoyer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: Vous m’entendez
  rationale: La forme est un présent, non un impératif. « Entendre » rend ici le sens perceptif de ⲥⲱⲧⲙ sans transformer l’énoncé en exhortation.
- source_word: ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: quand vous m’appelez
  rationale: Le passage évoque l’action des destinataires qui appellent ou invoquent la locutrice. Cette formulation française est naturelle et conserve la direction marquée par ⲉⲣⲟⲓ.
- source_word: ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: que vous prononcez
  rationale: Il s’agit d’une relative se rapportant vraisemblablement au mot lacunaire précédent. ⲧⲁⲩⲟ peut exprimer le fait d’énoncer, proférer ou prononcer.
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: Vous n’avez pas entendu
  rationale: La construction est un parfait négatif, et non une condition. Le passé composé convient au français moderne tout en gardant la rupture paradoxale avec la phrase précédente.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Je suis
  rationale: La formule copulative d’identification doit conserver la cadence caractéristique des déclarations en « Je suis ».
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: la défense
  rationale: Cet emprunt au grec ἀπολογία peut désigner une défense, une réponse justificative ou un plaidoyer. « La défense » préserve au mieux sa nuance apologétique et éventuellement judiciaire.
theological_decisions:
- issue: Tension entre « vous m’entendez » et « vous n’avez pas entendu »
  choice: Maintenir les deux affirmations sans les harmoniser
  alternative: 'Interpréter la seconde comme une condition : « si vous n’avez pas écouté »'
  rationale: Les formes grammaticales soutiennent respectivement un présent affirmatif et un parfait négatif. Le paradoxe appartient au texte et ne doit pas être résolu théologiquement.
translation_notes:
  register: Français international moderne, sobre et dignifié. La répétition d’« entendre » conserve le paradoxe du copte; la lacune est signalée sans conjecture. Le rendu privilégie la syntaxe attestée par le fragment plutôt que le texte de consultation, qui semble appartenir à un autre emplacement ou être mal aligné.
