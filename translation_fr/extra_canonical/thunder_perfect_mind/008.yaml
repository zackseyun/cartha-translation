translation:
  language: fr
  text: '**3.** Je suis la prostituée et la sainte[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot ⲡⲟⲣⲛⲏ (pornē) désigne une femme qui vend des services sexuels. On pourrait aussi traduire par « putain », terme plus insultant et plus cru, qui accentuerait le choc du contraste.
    reason: lexical_alternative
  - marker: b
    text: 'Le mot ⲥⲉⲙⲛⲏ (semnē) signifie littéralement « vénérable » ou « auguste » et peut avoir ici le sens de « sainte ». Autres traductions possibles : « la vénérable », « l’auguste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: Je suis
  rationale: Cette construction copulative à la première personne exprime une identification. « Je suis » préserve la formule répétée qui structure le discours.
- source_word: ⲡⲟⲣⲛⲏ
  choice: la prostituée
  rationale: Cet emprunt au grec désigne une femme qui vend des services sexuels. « Prostituée » rend clairement le sens en français actuel sans ajouter la vulgarité plus forte de « putain ».
- source_word: ⲥⲉⲙⲛⲏ
  choice: la sainte
  rationale: Le terme signifie « vénérable, auguste, sacrée » et est employé ici comme un nom féminin. « La sainte » maintient le parallélisme avec « la prostituée » et la forte opposition voulue.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Conjonction de coordination simple, qui juxtapose directement les deux identités paradoxales.
theological_decisions:
- issue: L’union de deux identités apparemment incompatibles
  choice: Conserver sans explication la juxtaposition « la prostituée et la sainte »
  alternative: Atténuer ou interpréter l’opposition au moyen d’une paraphrase
  rationale: Le texte formule délibérément une auto-identification paradoxale. La traduction ne doit ni harmoniser les termes ni attribuer au propos une interprétation doctrinale particulière.
translation_notes:
  register: Formulation brève, solennelle et directe. Le français reste accessible tout en conservant le parallélisme nominal et la tension saisissante de l’original.
