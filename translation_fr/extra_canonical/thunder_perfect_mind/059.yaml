lexical_decisions:
- source_word: ⲉⲧϩⲁⲉⲓⲏⲟⲩ
  choice: celle qui n’a pas été instruite
  rationale: Cette formulation rend la construction relative qui qualifie la locutrice comme non instruite. Elle conserve le féminin de la voix qui parle et le paradoxe du propos, sans réduire celui-ci au manque de scolarité que pourrait suggérer « sans instruction ».
- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
  choice: vous apprendrez
  rationale: ⲛⲧⲉⲧⲛ- marque ici la deuxième personne du pluriel avec une valeur future ou intentive. Le futur français préserve cette nuance plus directement que le présent gnomique, tout en gardant le contraste avec la locutrice non instruite.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: de moi
  rationale: Avec le verbe dans ce contexte, cette locution exprime la source de l’apprentissage. « De moi » est la tournure française la plus directe et naturelle.
