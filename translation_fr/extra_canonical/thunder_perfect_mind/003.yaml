base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: fr
  text: '**3.** Et vous qui écoutez, écoutez-moi.


    Vous qui m’attendez[a], accueillez-moi auprès de vous.


    Ne me chassez pas de devant vous[b],


    et ne laissez pas votre voix me haïr, ni votre ouïe[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe copte peut signifier « attendre » ou « s’attendre à », mais aussi « désirer ardemment ». On pourrait donc traduire : « Vous qui aspirez à moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne me jetez pas hors de votre face ». « De devant vous » conserve ici l’idée de présence tout en pouvant évoquer le regard.'
    reason: literal_rendering
  - marker: c
    text: 'La formulation est abrupte : le verbe « haïr » porte d’abord sur « votre voix », puis « votre ouïe » lui est coordonnée sans répétition du verbe. Cette tension est conservée.'
    reason: ambiguity
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ … ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: vous qui écoutez, écoutez-moi
  rationale: Le participe nominal pluriel désigne les auditeurs, tandis que l’impératif appelle à une écoute active. La répétition du radical est conservée en français.
- source_word: ⲧⲟϣⲧ
  choice: m’attendez
  rationale: Le verbe exprime d’abord l’attente ou l’expectative, tout en pouvant comporter une nuance de désir; cette polysémie est signalée en note.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: accueillez-moi auprès de vous
  rationale: Cette formulation rend l’idée de recevoir ou prendre la locutrice avec soi sans l’aplatir en simple hospitalité domestique.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: ne me rejetez pas loin de votre regard
  rationale: La leçon manuscrite corrigée signifie littéralement ne pas jeter la locutrice hors de la face des destinataires. « Regard » exprime ici la présence et la vue de façon naturelle.
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: ne laissez pas votre voix me haïr
  rationale: Le causatif négatif est rendu sans remplacer l’image saisissante d’une voix qui hait par une paraphrase interprétative.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: votre ouïe
  rationale: « Ouïe » préserve le parallélisme entre la voix et la faculté d’entendre, ainsi que l’étrangeté voulue de la proposition.
theological_decisions:
- issue: Personnification de la voix et de l’ouïe
  choice: Conserver « votre voix me haïr, ni votre ouïe »
  alternative: Paraphraser par « ne rendez odieuses ni votre parole ni votre écoute à mon égard »
  rationale: Le passage attribue aux facultés humaines une action personnelle et demeure syntaxiquement tendu. La traduction ne résout pas cette tension par une interprétation doctrinale ou psychologique.
translation_notes:
  register: Français international moderne, digne et oral. Le rythme bref ainsi que les répétitions de l’adresse sont maintenus. La traduction suit la leçon manuscrite vérifiée signalée dans la révision critique plutôt que les formes fautives de l’extrait OCR, notamment pour « ne me rejetez pas loin de votre regard » et « votre voix me haïr ».
