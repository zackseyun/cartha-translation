base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/007.yaml
  text: 'Do not be ignorant of me.

    For I am the first and the last;

    I am the honored and the scorned[a];

    I am the whore and the holy one[d];

    I am the wife[b] and the virgin[c][e].'
translation:
  language: fr
  text: 'Ne soyez pas dans l’ignorance à mon sujet.


    Car je suis la première et la dernière ;


    je suis celle qu’on honore et celle qu’on méprise[a] ;


    je suis la prostituée et la sainte[b] ;


    je suis la femme et la vierge[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte OCR porte ϣⲏϣ, qui signifie normalement « grand » ou « nombreux » et ne forme pas une opposition nette avec « honorée ». Beaucoup d’éditeurs lisent ou corrigent ici une forme signifiant « méprisée ». La traduction suit cette antithèse probable, mais la lecture demeure incertaine.
    reason: textual_uncertainty
  - marker: b
    text: Le copte ⲥⲉⲙⲛⲏ peut évoquer ce qui est saint, pur, chaste ou digne de respect. Ici, « la sainte » préserve la résonance religieuse et le contraste avec « la prostituée ».
    reason: lexical_alternative
  - marker: c
    text: Le copte ⲥϩⲓⲙⲉ signifie d’abord « femme », mais peut aussi, selon le contexte, désigner une « épouse ». ⲡⲁⲣ est une abréviation du grec παρθένος, « vierge ».
    reason: lexical_and_scribal_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: Ne restez pas dans l’ignorance à mon sujet
  rationale: Rend l’impératif négatif et la portée cognitive du verbe dans un français naturel, sans l’affaiblir en simple « ne m’ignorez pas ».
- source_word: ⲁⲛⲟⲕ … ⲧϣⲟⲣⲡ ⲁⲩⲱ ⲑⲁⲉ
  choice: je suis la première et la dernière
  rationale: Conserve la répétition oraculaire de « je suis », l’antithèse directe et le genre féminin de la voix.
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: celle qu’on honore
  rationale: Exprime la valeur passive et substantivée de l’épithète tout en maintenant le parallélisme avec « celle qu’on méprise ».
- source_word: ⲧⲉⲧϣⲏϣ (OCR)
  choice: celle qu’on méprise
  rationale: Suit l’antithèse vraisemblablement visée par le passage, mais une note signale que la leçon OCR donnée ne soutient pas clairement ce sens.
- source_word: ⲡⲟⲣⲛⲏ
  choice: la prostituée
  rationale: Équivalent français direct du mot grec emprunté, suffisamment abrupt pour préserver le paradoxe sans recourir à une injure plus marquée que le terme source.
- source_word: ⲥⲉⲙⲛⲏ
  choice: la sainte
  rationale: Préserve ici la résonance de sainteté ou de pureté et forme une opposition concise avec « la prostituée » ; la gamme sémantique est indiquée en note.
- source_word: ⲥϩⲓⲙⲉ
  choice: la femme
  rationale: Le français « femme » conserve heureusement l’ambivalence du copte entre femme au sens général et épouse, sans trancher artificiellement.
- source_word: ⲡⲁⲣ
  choice: la vierge
  rationale: Développe l’abréviation nag-hammadienne usuelle du grec παρθένος et maintient l’antithèse avec « femme ».
theological_decisions:
- issue: Nature des identités paradoxales énoncées par la locutrice
  choice: Les conserver comme affirmations juxtaposées, sans explication doctrinale
  alternative: Les harmoniser comme métaphores, états successifs ou catégories théologiques précises
  rationale: Le texte présente délibérément des identités en tension ; la traduction ne doit ni résoudre ces paradoxes ni leur imposer une lecture confessionnelle.
- issue: Portée de ⲥⲉⲙⲛⲏ
  choice: « la sainte », avec une note sur « pure/chaste »
  alternative: « la chaste » ou « la respectable »
  rationale: « Sainte » conserve la résonance religieuse possible et l’opposition forte du passage, tandis que la note maintient l’ouverture lexicale.
translation_notes:
  register: Français international moderne, sobre et rythmé. La reprise de « je suis » et les couples antithétiques sont conservés. Le féminin grammatical de la voix est explicite. « Prostituée » maintient la force du paradoxe dans un registre publiable ; « femme » préserve mieux que « épouse » l’ambiguïté du copte.
