  naturalness: Le français est moderne, clair et conserve efficacement le rythme anaphorique. « Ne soyez pas dans l’ignorance à mon sujet » est à la fois plus proche de l’impératif source et naturel dans ce registre solennel. Les autres couples gardent une formulation sobre et parallèle.
  terminology: « Prostituée », « sainte », « femme » et « vierge » sont recevables. « Femme » traduit le sens de base de ⲥϩⲓⲙⲉ, mais ne conserve pas à lui seul en français moderne la possibilité « épouse » ; la note doit donc présenter celle-ci comme une possibilité du copte, non comme une ambiguïté effectivement reproduite en français.
