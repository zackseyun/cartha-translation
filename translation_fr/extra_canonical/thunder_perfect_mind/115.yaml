  rationale: « Selon la loi » rend clairement la norme en fonction de laquelle le jugement s’exerce. La lecture ⲛⲟⲙⲟⲥ demeure toutefois une correction conjecturale de l’OCR.
theological_decisions:
- issue: Rapport paradoxal entre solitude et unité
  choice: seul et dans l’unité
  alternative: solitaire et comme unité
  rationale: La traduction conserve la juxtaposition paradoxale sans expliquer si l’unité est un état, une communauté ou une affirmation métaphysique.
- issue: Sens de ϣⲟⲟⲡ
  choice: est présent
  alternative: existe
  rationale: « Est présent » maintient la tension entre existence et manifestation, sans imposer une lecture ontologique particulière.
