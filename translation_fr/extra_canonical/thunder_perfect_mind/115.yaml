- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: parmi ceux qui sont morts
  rationale: Le relatif pluriel désigne des personnes mortes, et « parmi » rend naturellement la préposition ϩⲛ dans ce contexte.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: celui qui est présent
  rationale: « Être présent » préserve la nuance de présence ou de manifestation de ϣⲟⲟⲡ, plutôt que de la ramener à la seule existence.
- source_word: ⲟⲩⲁⲁⲧ
  choice: seul
  rationale: Le terme exprime l’isolement ou l’unicité. « Seul » est simple, fort et naturel dans le parallélisme.
- source_word: 'ⲙⲛⲧⲟⲩⲁⲁⲧ (OCR : ⲙⲛⲧⲁⲓ)'
  choice: dans l’unité
  rationale: La reconstruction proposée forme le nom abstrait « unité ». La tournure conserve le paradoxe entre « seul » et « dans l’unité ».
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: Celui qui me jugera
  rationale: Le futur est rendu explicitement, et la relative substantivée maintient le ton judiciaire du texte.
- source_word: 'ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ (OCR : ϩⲁ ⲡⲓ ⲛⲉⲗⲟⲥ)'
