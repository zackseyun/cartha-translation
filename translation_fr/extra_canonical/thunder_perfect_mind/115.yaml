  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
translation:
  language: fr
  text: '**6.** Je suis le nom[a] que l’on crie[b] parmi ceux qui sont morts ; et je suis celui qui est présent, seul et dans l’unité[c]. Celui qui me jugera selon la loi[d] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’OCR porte ⲡⲓⲛⲁ, mais la lecture ⲡⲓⲣⲁⲛ, « le nom », est vraisemblable ; elle suppose qu’un ⲣ a été omis ou mal reconnu.
    reason: alignment_note
  - marker: b
    text: L’expression avec ⲉⲃⲟⲗ peut aussi se comprendre comme « proclamé au-dehors » ou « rejeté ». « Que l’on crie » conserve sa possible force vocale sans exclure entièrement l’idée d’expulsion.
    reason: lexical_alternative
  - marker: c
    text: Le texte OCR ⲙⲛⲧⲁⲓ paraît défectueux. La traduction suit la reconstruction ⲙⲛⲧⲟⲩⲁⲁⲧ, « unité » ou « état d’être un ».
    reason: alignment_note
  - marker: d
    text: L’OCR lit ⲛⲉⲗⲟⲥ. « Loi » repose sur la correction conjecturale ⲛⲟⲙⲟⲥ, emprunt au grec νόμος ; si cette correction est erronée, le sens judiciaire de la phrase doit être réévalué.
    reason: alignment_note
