  text: and the one they despise in scorn[a]. I am peace[c][b], and because of me war has come to be.
translation:
  language: fr
  text: et celle qu’ils méprisent avec dédain.[a] Je suis la paix, et c’est à cause de moi que la guerre a surgi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait copte conservé commence par la fin d’un mot, puis par « et »; cette phrase se poursuit donc depuis le passage précédent.
    reason: textual_scope
  - marker: b
    text: Le verbe peut aussi se traduire par « est survenue » ou « est venue à l’existence ».
    reason: lexical_alternative
