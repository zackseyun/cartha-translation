  choice: celle qu’ils méprisent
  rationale: La construction relative féminine désigne « celle que » l’on méprise; elle maintient l’auto-identification féminine de la voix.
- source_word: ϩⲛ ⲟⲩϣⲱϣ
  choice: avec dédain
  rationale: Rend naturellement la manière méprisante exprimée par le syntagme, sans la répétition lourde « méprisent avec mépris ».
- source_word: ⲁⲛⲟⲕ ⲧⲉ ϯⲣⲏⲛⲏ
  choice: Je suis la paix
  rationale: Conserve la formule répétée d’auto-identification et le contraste explicite entre la paix et la guerre.
- source_word: ⲉⲧⲃⲏⲏⲧ
  choice: à cause de moi
  rationale: Préserve le lien causal direct, essentiel au paradoxe du passage.
- source_word: ϣⲱⲡⲉ
  choice: a surgi
  rationale: Exprime l’apparition ou la venue à l’existence de la guerre dans un français actuel, tout en laissant ouverte la nuance entre « survenir » et « venir à l’existence ».
theological_decisions:
- issue: Rapport paradoxal entre la paix personnifiée et la guerre
  choice: 'Maintenir la causalité explicite : « c’est à cause de moi »'
  alternative: Atténuer en « autour de moi » ou « à mon sujet »
  rationale: Le copte exprime directement la cause; l’étrangeté théologique ou rhétorique ne doit pas être résolue par une paraphrase.
