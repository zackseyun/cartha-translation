  source_fidelity: 'La structure finale est bien rendue : ⲧⲉⲧϣⲟⲟⲡ est correctement conservé par « celle qui existe », et ⲧⲏⲣⲟⲩ par « toutes les peurs ». Le premier nom demeure incertain en raison de l’OCR et appelle une note. En revanche, « issue de ma recherche » introduit une relation de provenance absente du génitif copte, qui exprime plus sobrement « de ma recherche ». « Selon » rend επίσης plus directement κατά que « conforme à ».'
