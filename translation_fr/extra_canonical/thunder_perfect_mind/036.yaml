base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/036.yaml
  text: It is the utterance according to prudence of my seeking[a], and it is the knowledge of my searching[d][c][b]. But I am she who exists in all fears and in courage.
translation:
  language: fr
  text: '**1.** C’est la parole[a] selon la prudence de ma quête, et c’est la connaissance de ma recherche. Mais moi, je suis celle qui existe dans toutes les peurs et dans le courage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier mot copte est incertain dans l’extrait OCR. « Parole » est une traduction provisoire ; « énoncé » ou « proclamation » sont également possibles.
    reason: incertitude_textuelle
  - marker: b
    text: Le mot traduit par « courage » peut aussi évoquer la vaillance, l’audace ou, littéralement, la virilité. Ici, « courage » préserve l’opposition avec « toutes les peurs » sans imposer une nuance masculine.
    reason: alternative_lexicale
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: parole
  rationale: Le mot initial transmis par l’OCR est incertain. « Parole » reste une désignation générale et prudente d’un propos ou d’un énoncé, tout en convenant au registre poétique du texte.
- source_word: ⲧⲁⲣⲕⲁⲧⲁ ⲫⲣⲟⲛⲓ
  choice: conforme à la prudence
  rationale: Le groupe paraît intégrer le grec κατά et un terme apparenté à φρόνησις. « Conforme à la prudence » conserve la relation exprimée par κατά et le registre intellectuel du nom abstrait.
- source_word: ⲣⲓⲧⲉ
  choice: quête
  rationale: Le terme désigne l’action de chercher. « Quête » garde sa valeur nominale et produit en français une formulation plus naturelle que « mon chercher ».
- source_word: ⲥⲁϩⲟⲩ
  choice: connaissance
  rationale: « Connaissance » rend directement la qualité ou le contenu cognitif exprimé par le nom copte.
- source_word: ϣⲟⲩϣⲟⲩ
  choice: recherche
  rationale: Le nom verbal évoque l’action de chercher ou d’examiner. « Recherche » maintient le parallélisme avec « quête » sans les confondre entièrement.
- source_word: ϣⲟⲟⲡ
  choice: existe dans
  rationale: Le verbe peut signifier être, exister ou être présent. Avec la préposition, « existe dans » exprime clairement la présence au sein des réalités opposées.
- source_word: ⲫⲟⲃⲟⲥ
  choice: peurs
  rationale: Le mot emprunté au grec φόβος signifie « peur »; le pluriel français correspond ici au quantificateur « toutes ».
- source_word: ⲧⲏⲣⲟⲩ
  choice: toutes
  rationale: La forme signifie « toutes » dans ce contexte et qualifie les peurs; elle ne doit pas être comprise comme un possessif signifiant « leurs ».
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: courage
  rationale: Le terme peut évoquer la virilité, la vaillance ou l’audace. « Courage » restitue l’opposition avec les peurs sans introduire inutilement une nuance genrée.
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: celle qui existe
  rationale: La construction relative féminine est rendue explicitement afin de préserver l’auto-identification féminine de la voix qui parle.
theological_decisions:
- issue: Présence de la locutrice dans des réalités contraires
  choice: « dans toutes les peurs et dans le courage »
  alternative: Ramener la phrase à une présence seulement courageuse face à la peur
  rationale: Le texte juxtapose les peurs et le courage sans résoudre leur tension. La traduction conserve donc l’affirmation paradoxale d’une présence dans les deux.
translation_notes:
  register: Français international actuel, poétique et digne. La répétition de « c’est » et le pivot « Mais moi » conservent la structure déclarative du copte. « Celle qui existe » maintient le féminin grammatical et rhétorique, tandis que la formulation garde intacte l’antithèse entre les peurs et le courage.
