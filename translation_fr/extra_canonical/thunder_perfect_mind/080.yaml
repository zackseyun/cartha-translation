translation:
  language: fr
  text: 'Je suis la paix,

    et la guerre est venue à cause de moi[a] ;

    je suis étrangère[b] et citoyenne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la guerre a surgi à cause de moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une étrangère ». Le terme peut aussi signifier « inconnue », mais « étrangère » fait mieux ressortir le contraste avec « citoyenne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ (emprunt au grec εἰρήνη)
  choice: paix
  rationale: Rend directement le terme et maintient toute la force de son opposition paradoxale à « guerre ».
- source_word: ⲡⲟⲗⲉⲙⲟⲥ (emprunt au grec πόλεμος)
  choice: guerre
  rationale: Préserve l’antithèse nette avec « paix » ; « conflit » l’atténuerait.
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  choice: à cause de moi
  rationale: Expression causale naturelle et directe, sans suggérer que la guerre serait menée « pour » la locutrice.
- source_word: ⲝⲉⲛⲟⲥ (emprunt au grec ξένος)
  choice: étrangère
  rationale: Fait ressortir le contraste civique avec « citoyenne » tout en accordant le terme avec la voix féminine du poème.
- source_word: ⲡⲟⲗⲓⲧⲏⲥ (emprunt au grec πολίτης)
  choice: citoyenne
  rationale: Terme civique usuel qui forme l’opposition la plus précise avec « étrangère ».
- source_word: ⲉⲓ (forme perfective de « venir »)
  choice: est venue
  rationale: Rend simplement l’événement accompli ; « a surgi » reste possible et accentuerait davantage le déclenchement de la guerre.
theological_decisions:
- issue: Rapport causal entre la paix personnifiée et la venue de la guerre
  choice: Conserver « à cause de moi » sans explication
  alternative: Interpréter la guerre comme menée « pour moi » ou « en mon nom »
  rationale: Le texte formule un paradoxe causal sans en préciser le mécanisme ; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: 'Français international moderne, sobre et poétique. Le féminin explicite convient à la voix féminine de l’œuvre. L’extrait OCR fourni paraît désaligné : il contient notamment des emprunts grecs correspondant à « châtiment », « natures », « création » et « âmes », non aux mots attendus dans ce segment ; le texte principal repose donc sur les données lexicales source auditées et le texte de consultation, avec prudence.'
