base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
translation:
  language: fr
  text: 'Et moi, je suis celle que vous avez saisie.


    Je suis celle que vous avez dispersée, puis recueillie[a].


    Je suis celle dont vous avez eu honte,


    et envers qui vous avez agi sans honte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte oppose la dispersion « au-dehors » au rassemblement « au-dedans » ; la traduction française exprime ce contraste par « dispersée, puis recueillie ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et vous n’avez éprouvé aucune honte envers moi ». Le copte établit un contraste direct avec l’affirmation précédente.'
    reason: ambiguity_note
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: que vous avez saisie
  rationale: Le verbe signifie ici « saisir, s’emparer de ». Le pronom de première personne est rendu naturellement par le relatif français, sans répéter « moi ».
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: que vous avez envoyée au-dehors
  rationale: La séquence signifie littéralement « vous l’avez envoyée dehors ». Cette lecture suit les formes visibles du copte plutôt que la consultation anglaise « scattered », qui paraît moins directement soutenue par le texte.
- source_word: ⲥⲱⲟⲩϩ … ⲉϩⲟⲩⲛ
  choice: puis recueillie au-dedans
  rationale: Le verbe exprime l’action de rassembler ou recueillir, tandis que l’orientation vers l’intérieur répond à ⲉⲃⲟⲗ, « au-dehors ». « Recueillie » reste idiomatique tout en conservant l’opposition spatiale.
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: celle dont vous avez eu honte
  rationale: L’expression copte associe « avoir honte » à un pronom féminin renvoyant à la locutrice. « Avoir honte de quelqu’un » est la formulation française naturelle.
- source_word: ⲣⲁⲧϣⲓⲡⲉ
  choice: été sans honte
  rationale: La construction privative signifie « être dépourvu de honte, agir sans honte ». La traduction conserve le contraste lexical direct avec la ligne précédente.
theological_decisions:
- issue: Tension entre honte et absence de honte
  choice: Conserver le paradoxe sans préciser s’il s’agit d’impudence, de familiarité ou de non-déshonneur
  alternative: « vous avez agi sans vergogne envers moi »
  rationale: Le poème juxtapose volontairement des affirmations opposées. « Sans honte » préserve cette tension et évite une interprétation morale plus étroite.
translation_notes:
  register: Français international actuel, sobre et poétique. La répétition de « Je suis celle » et le parallélisme antithétique sont conservés. Le féminin est maintenu, puisqu’il est explicite dans les formes coptes.
