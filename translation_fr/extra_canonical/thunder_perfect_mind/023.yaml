base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
translation:
  language: fr
  text: '**1.** Ceux qui mentent à mon sujet disent la vérité à mon sujet.[a]


    Que ceux qui me connaissent soient ignorants de moi,[b]


    et que ceux qui ne m’ont pas connue me connaissent.


    Car je suis la connaissance et l’ignorance.


    Je suis —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début est très corrompu dans l’extrait OCR. La traduction suit la lecture reconstituée du manuscrit : « Ceux qui mentent à mon sujet disent la vérité à mon sujet. »'
    reason: Signaler que la formulation repose sur la récupération du texte manuscrit sous une reconnaissance optique défectueuse.
  - marker: b
    text: 'L’OCR donne ici une forme ressemblant à « ils connaîtront », mais le texte du manuscrit se lit : « qu’ils soient ignorants de moi »; cette lecture préserve l’antithèse avec la phrase suivante.'
    reason: Documenter une correction textuelle substantielle qui détermine le paradoxe du passage.
lexical_decisions:
- source_word: ⲛⲉⲧϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ ϫⲱ ⲛⲧⲙⲉ ⲉⲣⲟⲉⲓ (reconstitution du texte sous l’OCR corrompu)
  choice: Ceux qui mentent à mon sujet disent la vérité à mon sujet
  rationale: La reconstitution rend l’antithèse mensonge/vérité propre à ce passage. « À mon sujet » traduit naturellement en français la relation exprimée avec la locutrice sans atténuer le paradoxe.
- source_word: ⲥⲟⲟⲩⲛ
  choice: connaître
  rationale: Le verbe sahidique désigne ici la connaissance de la locutrice, et non la simple compréhension d’une proposition. « Connaître » permet aussi de conserver la répétition structurante.
- source_word: ⲙⲁⲣⲟⲩⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ (reconstitution du texte sous l’OCR corrompu)
  choice: qu’ils soient ignorants de moi
  rationale: Le jussif suivi de la forme privative appelle une injonction paradoxale. Cette formulation maintient le contraste direct avec « qu’ils me connaissent ».
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: la connaissance
  rationale: Le substantif abstrait défini s’oppose formellement à « l’ignorance »; le nom français conserve cette symétrie.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: l’ignorance
  rationale: La construction nominale privative signifie littéralement la non-connaissance. « Ignorance » est naturel, concis et préserve le paradoxe.
- source_word: ⲁⲛⲟⲕ ⲅⲁⲣ ⲡⲉ
  choice: Car je suis
  rationale: « Car » garde la valeur explicative de ⲅⲁⲣ et « je suis » maintient la cadence déclarative récurrente de l’œuvre.
theological_decisions:
- issue: Identification simultanée de la locutrice à la connaissance et à l’ignorance
  choice: 'Conserver sans explication dans le corps du texte : « je suis la connaissance et l’ignorance »'
  alternative: Interpréter « ignorance » comme ignorance attribuée par autrui ou comme connaissance cachée
  rationale: Le texte formule délibérément une identité paradoxale. Toute explicitation doctrinale résoudrait une tension que la source laisse ouverte.
- issue: Injonction adressée à ceux qui connaissent la locutrice
  choice: « Que ceux qui me connaissent soient ignorants de moi »
  alternative: « Ceux qui me connaissent me connaîtront »
  rationale: La leçon reconstituée comporte un jussif et une forme privative; elle produit une antithèse intentionnelle avec la proposition suivante et ne doit pas être harmonisée.
translation_notes:
  register: Français international actuel, sobre et dignifié. La répétition de « connaître » et les oppositions abruptes sont conservées comme traits rhétoriques essentiels. L’accord féminin dans « connue » reflète la locutrice féminine de l’œuvre sans ajouter de titre interprétatif. Le tiret final maintient l’énoncé interrompu du segment source.
