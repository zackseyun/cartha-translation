base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: fr
  text: 'Je suis l’écoute qui est à la portée de tous[a] ;


    je suis la parole qu’on ne peut saisir ;


    le nom du son et le son du nom ;


    je suis le signe de ceci et la manifestation[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot copte peut aussi être compris comme « grande » ; dans ce contexte, beaucoup le prennent au sens d’« accessible » ou « à portée ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « la révélation » ou « le dévoilement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: l’écoute
  rationale: Le nom dérivé de « entendre » désigne ici l’écoute ou l’audition. « L’écoute » conserve le motif auditif dans un français naturel, sans introduire l’idée morale d’obéissance.
- source_word: ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: qui est à la portée de tous
  rationale: Cette formulation exprime l’accessibilité et la portée universelle du syntagme, tout en gardant le contraste paradoxal avec la parole insaisissable.
- source_word: ⲡϣⲁϫⲉ
  choice: la parole
  rationale: « Parole » convient à une expression proférée et préserve le parallélisme avec l’écoute, sans imposer une lecture christologique.
- source_word: ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: qu’on ne peut saisir
  rationale: La suite se lit comme une relative comportant la négation à la troisième personne du pluriel et le verbe « saisir », et non comme le déictique « là » suivi d’un nom signifiant « souvenir ».
- source_word: ⲣⲁⲛ
  choice: nom
  rationale: Équivalent direct qui forme avec « son » une construction en miroir.
- source_word: ⲥⲙⲏ
  choice: son
  rationale: « Son » maintient le caractère acoustique et abstrait du chiasme ; « voix » reste possible selon le contexte.
- source_word: ⲥⲏⲙⲉⲓⲟⲛ
  choice: signe
  rationale: Le mot est un emprunt au grec σημεῖον. La coupure de ligne ne permet pas de traiter sa finale comme l’adverbe « aussi ».
- source_word: ⲙⲡⲁⲓ
  choice: de ceci
  rationale: Le démonstratif est conservé sans préciser un référent que l’extrait ne permet pas d’identifier avec certitude.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: la manifestation
  rationale: Le syntagme exprime l’action ou le fait de rendre manifeste, de révéler ; il ne désigne pas la lumière.
theological_decisions:
- issue: Portée de « la parole »
  choice: Conserver « parole » sans majuscule
  alternative: « Parole » avec majuscule ou « Verbe »
  rationale: Le texte présente une auto-identification poétique, mais rien dans ce seul syntagme n’impose une identification technique au Logos.
- issue: Agent de l’impossibilité de saisir
  choice: Employer le pronom indéfini « on »
  alternative: « qu’ils ne peuvent saisir »
  rationale: Le copte porte une troisième personne du pluriel à valeur générale. « On » restitue naturellement cette généralité sans identifier un groupe particulier.
translation_notes:
  register: Français moderne, sobre et poétique. Les reprises de « je suis » et le chiasme « le nom du son et le son du nom » sont conservés. La ponctuation maintient le mouvement d’une seule série d’auto-identifications.
