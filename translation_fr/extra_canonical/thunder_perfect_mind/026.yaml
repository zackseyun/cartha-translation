base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
translation:
  language: fr
  text: '**4.** Vous qui me connaissez, ignorez-moi[a] ;


    et vous qui ne m’avez pas connue, connaissez-moi[b],


    car je suis la connaissance et l’ignorance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « ignorez » est un emprunt copte au grec ἀγνοεῖν. On pourrait aussi rendre l’expression par « cessez de me connaître », mais cette formulation introduirait une nuance absente du texte et affaiblirait l’antithèse directe.
    reason: lexical_alternative
  - marker: b
    text: Les lignes de l’OCR fourni semblent contenir des expressions relatives à une voix qui sort sur la terre et appartiennent probablement à un passage voisin. La présente traduction suit l’emplacement habituel de la strophe sur la connaissance et l’ignorance dans *Le Tonnerre, intellect parfait*.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (verbe)
  choice: connaître
  rationale: Le verbe copte courant désigne le fait de connaître. « Connaître » conserve clairement l’antithèse avec « ignorer » et convient à une personne comme complément.
- source_word: ⲁⲅⲛⲟⲉⲓ (verbe, emprunt au grec ἀγνοεῖν)
  choice: ignorer
  rationale: L’impératif « ignorez-moi » restitue directement la force verbale et préserve le paradoxe tranchant avec « vous qui me connaissez ».
- source_word: ⲅⲛⲱⲥⲓⲥ (nom, emprunt au grec γνῶσις)
  choice: connaissance
  rationale: Équivalent français usuel qui maintient le parallélisme conceptuel avec « ignorance », sans imposer une interprétation doctrinale particulière.
- source_word: ⲁⲅⲛⲱⲥⲓⲁ (nom, emprunt grec)
  choice: ignorance
  rationale: « Ignorance » rend l’opposé conventionnel de la connaissance et conserve toute la vigueur du paradoxe. « Non-savoir » serait possible, mais plus interprétatif.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: « ne m’avez pas connue »
  alternative: « ne me connaissez pas » ou « ne m’avez pas connu »
  rationale: Le féminin rend visible en français la présentation féminine de la voix dans l’œuvre. Il ne précise toutefois ni ne résout la nature théologique de cette voix.
translation_notes:
  register: Français international actuel, sobre et poétique. Le vouvoiement collectif conserve l’adresse au pluriel. La ponctuation et la répétition de « connaître » maintiennent la structure antithétique du texte.
