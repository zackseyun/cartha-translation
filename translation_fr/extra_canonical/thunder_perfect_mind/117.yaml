base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/117.yaml
  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: fr
  text: '**1.** Celui qui me jugera selon la Loi[a], jugez-le, vous qui vivez dans de nombreux péchés, dans le dérèglement, dans de vaines passions et dans des plaisirs passagers !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le manuscrit est difficile à lire à cet endroit. La traduction retient « selon la Loi », lecture qui correspond au contexte précédent. Une autre correction proposée donne : « à la fin ».'
    reason: textual_alternative
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: jugera / jugez
  rationale: L’emprunt grec κρίνω a ici son sens judiciaire. La répétition française rend le futur de la proposition relative puis l’impératif qui semble se trouver derrière le passage corrompu de l’OCR.
- source_word: 'ⲛⲟⲙⲟⲥ (OCR : ⲛⲉⲗⲟⲥ)'
  choice: la Loi
  rationale: La lecture « Loi » explique mieux les traces et rejoint le contexte immédiatement précédent. La majuscule indique la loi prise comme norme de jugement, sans préciser davantage son identité.
- source_word: ϣⲟⲟⲡ ϩⲛ
  choice: vivez dans
  rationale: Littéralement « être, se trouver dans ». « Vivre dans » est naturel en français pour décrire durablement la condition morale visée.
- source_word: ⲛⲟⲃⲉ ⲉⲛⲁϣⲱⲟⲩ
  choice: de nombreux péchés
  rationale: ⲉⲛⲁϣⲱⲟⲩ exprime la multitude ou l’abondance et qualifie les péchés.
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: le dérèglement
  rationale: Le composé désigne l’absence de maîtrise ou de retenue. « Dérèglement » est idiomatique et couvre ici l’incontinence morale plutôt que l’ignorance.
- source_word: ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ (OCR incertain)
  choice: de vaines passions
  rationale: La restitution ⲉⲧϣⲟⲩⲉⲓⲧ signifie « vides, vaines ». « Passions » conserve le terme éthique issu du grec πάθος.
- source_word: 'ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ (OCR fragmentaire : ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥ ⲡⲉ)'
  choice: des plaisirs passagers
  rationale: ἡδονή signifie « plaisir »; la restitution de πρόσκαιρος donne le sens de « temporaire, passager » et correspond à la suite attendue de la phrase.
theological_decisions:
- issue: Objet et norme du jugement
  choice: « selon la Loi »
  alternative: « à la fin »
  rationale: Le texte OCR est défectueux, mais la restitution ⲛⲟⲙⲟⲥ (« loi ») est soutenue par le contexte antérieur et évite de créer ici une référence eschatologique reposant sur la correction plus conjecturale ⲧⲉⲗⲟⲥ (« fin »).
- issue: Passage du futur à l’impératif
  choice: « Celui qui me jugera… jugez-le »
  alternative: « Celui qui me jugera… jugera ceux qui… »
  rationale: La restitution de l’impératif préserve l’apostrophe polémique et le changement dramatique de construction, au lieu de lisser le texte en une déclaration continue.
translation_notes:
  register: Français moderne, digne et direct. L’apostrophe et le point d’exclamation conservent la vigueur polémique du passage. Le singulier collectif « le dérèglement » évite l’artificialité de « intempérances », tandis que « passions » maintient le vocabulaire éthique du texte.
