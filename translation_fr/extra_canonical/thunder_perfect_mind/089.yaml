translation:
  language: fr
  text: '**5.** Écoutez-moi[a] dans la colère, et laissez-vous instruire par moi dans la douceur.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « Écoutez » précède le début de l’extrait OCR fourni; il est restitué d’après le contexte immédiat du passage.
    reason: textual_reconstruction
  - marker: b
    text: La forme OCR du dernier mot est incertaine; la restitution généralement reconnue donne le sens de « douceur », « bienveillance » ou « amabilité ».
    reason: ocr_uncertainty
lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ ϩⲛ ⲟⲩϭⲱⲛ
  choice: moi dans la colère
  rationale: Le groupe prépositionnel signifie littéralement « moi/d’après moi dans la colère ». Le verbe régissant « moi » se trouve avant le début de l’extrait OCR; « Écoutez-moi » suit la reconstruction contextuelle établie sans préciser à qui appartient la colère.
- source_word: ⲛⲧⲉⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: et laissez-vous instruire par moi
  rationale: ⲧⲛϫⲓ ⲥⲃⲱ exprime le fait de recevoir un enseignement ou une instruction. Cette tournure française conserve le rôle de la locutrice comme source de l’enseignement et reste naturelle.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ (OCR; probablement pour ⲟⲩⲙⲛⲧⲣⲙⲣⲁϣ)
  choice: dans la douceur
  rationale: La leçon OCR paraît fautive ou tronquée; la restitution contextuelle reconnue désigne la douceur ou la bienveillance. « Douceur » maintient l’antithèse concise avec « colère ».
theological_decisions:
- issue: Rapport entre la colère et la douceur
  choice: Conserver les deux compléments sans en attribuer explicitement les dispositions à la locutrice ou aux auditeurs
  alternative: « Écoutez-moi lorsque je suis en colère, et apprenez de moi lorsque je suis douce »
  rationale: La construction copte avec ϩⲛ permet une certaine ambiguïté. Une explicitation du sujet psychologique résoudrait indûment la tension du texte.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif pluriel « Écoutez » convient à l’adresse collective; « laissez-vous instruire » rend l’idée de recevoir un enseignement sans alourdir la phrase.
