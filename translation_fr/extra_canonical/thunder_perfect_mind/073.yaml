base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: fr
  text: '**10.** Et dans l’esprit de tout homme qui existe avec moi, et les femmes qui sont en moi, je suis celle qui est honorée et celle qu’ils louent.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celle qui est honorée et celle qu’ils bénissent ». Le verbe copte ⲥⲙⲟⲩ peut signifier « louer » ou « bénir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: dans l’esprit de tout homme
  rationale: ⲡⲛⲁ désigne ici l’esprit plutôt que le vent ou le souffle. Le nom ⲣⲱⲙⲉ est rendu par « homme » parce qu’il est mis en parallèle avec « les femmes » dans la proposition suivante.
- source_word: ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ
  choice: tout homme qui existe
  rationale: Malgré la segmentation incertaine de l’OCR, la lecture grammaticale la plus probable est ⲣⲱⲙⲉ ⲛⲓⲙ, « tout homme », suivi de la relative ⲉⲧϣⲟⲟⲡ, « qui existe / qui est ».
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: existe avec moi
  rationale: ϣⲟⲟⲡ peut exprimer l’existence ou la présence; « existe avec moi » conserve ici la portée existentielle sans rendre la phrase artificielle.
- source_word: ⲛⲓϩⲓⲟⲙⲉ ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: les femmes qui sont en moi
  rationale: ⲛ̄ϩⲏⲧ est ici la préposition « en » munie du suffixe de première personne, et non le nom « cœur ».
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: celle qui est honorée
  rationale: La forme relève de ⲧⲁⲉⲓⲟ, « honorer », et désigne la locutrice comme celle qui reçoit l’honneur.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: celle qu’ils louent
  rationale: ⲥⲙⲟⲩ est un verbe signifiant « louer » ou « bénir »; le préfixe ⲟⲩ- est compris comme le sujet pluriel « ils », ce qui donne littéralement « celle qu’ils louent ».
theological_decisions:
- issue: Portée de ⲥⲙⲟⲩ
  choice: louent
  alternative: bénissent
  rationale: Les deux sens sont possibles. « Louer » convient au parallélisme avec « honorée » sans imposer une bénédiction cultuelle plus précise.
- issue: Identité féminine de la locutrice
  choice: celle qui est honorée… celle qu’ils louent
  alternative: l’être honoré… l’être loué
  rationale: Les formes copulaires et relatives sont féminines en copte; le français les conserve afin de respecter la voix féminine du discours.
translation_notes:
  register: Français international actuel, digne et lisible. La répétition de « celle » et la structure paradoxale sont conservées. L’ouverture par « Et » respecte le caractère continu et fragmentaire de l’extrait.
