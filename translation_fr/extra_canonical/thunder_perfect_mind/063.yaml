lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: paraîtrez
  rationale: La locution signifie « devenir visible, se manifester ». « Paraître » conserve la simplicité de l’opposition avec « se cacher » et convient à la construction éventuelle suivie du futur.
- source_word: ϯⲛⲁϩⲱⲡ
  choice: je me cacherai
  rationale: La forme est au futur et exprime ici l’action de se cacher; le tour pronominal français rend naturellement le sujet à la première personne.
- source_word: ⲇⲉ
  choice: Mais
  rationale: La particule relie cette proposition à la précédente tout en marquant l’antithèse entre se cacher et paraître; « Mais » rend clairement ce contraste.
- source_word: ⲉⲣⲱⲧⲛ
  choice: de vous
  rationale: Le complément de deuxième personne du pluriel est conservé directement dans « me cacher de vous ».
theological_decisions:
- issue: Paradoxe entre manifestation et retrait
  choice: Maintenir sans l’expliquer l’opposition « vous paraîtrez / je me cacherai »
  alternative: Interpréter la parole comme une doctrine précise de révélation ou de jugement
  rationale: Le texte formule une antithèse poétique et énigmatique; la traduction ne doit pas lui imposer une résolution doctrinale.
translation_notes:
  register: 'Français moderne, sobre et poétique. Le futur après « chaque fois que » rend la construction copte éventuelle. Le vouvoiement pluriel respecte la forme source. Le fragment OCR fourni paraît désaligné avec ce segment; le texte est établi d’après la ligne copte identifiée dans la révision critique : ⲉⲧⲉⲧⲛϣⲁⲛⲟⲩⲱⲛϩ ⲇⲉ ⲉⲃⲟⲗ ϯⲛⲁϩⲱⲡ ⲉⲣⲱⲧⲛ.'
