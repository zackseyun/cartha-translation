  text: '**18.** Mais chaque fois que vous apparaîtrez[a], je me cacherai de vous.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous manifesterez ».'
    reason: lexical_alternative
