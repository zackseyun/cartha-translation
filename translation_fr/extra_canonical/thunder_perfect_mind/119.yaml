lexical_decisions:
- source_word: ⲁⲩⲱ ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: Et ils me trouveront
  rationale: Le futur ⲥⲉⲛⲁϭⲓⲛⲉ, suivi de l’objet pronominal ⲙⲙⲟⲉⲓ (« moi »), exprime directement « ils me trouveront ».
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: en ce lieu-là
  rationale: L’expression désigne le lieu mentionné ou visé dans le contexte précédent; « ce lieu-là » conserve la valeur déictique de ⲉⲧⲙⲙⲁⲩ.
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: ils vivront
  rationale: La forme conjonctive poursuit la série verbale au futur; ⲱⲛϩ signifie « vivre ».
- source_word: ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ (reconstruction probable de l’OCR ⲛⲥⲉⲧⲙⲥⲱⲧ)
  choice: ne mourront plus
  rationale: La lecture contextualisée « ne pas mourir de nouveau » explique vraisemblablement l’OCR corrompu et produit en français naturel « ne mourront plus ».
theological_decisions:
- issue: Portée de la promesse de vie
  choice: Conserver l’énoncé sans préciser s’il s’agit de vie physique, spirituelle ou eschatologique.
  alternative: Expliciter « ils auront la vie éternelle ».
  rationale: Le copte dit simplement qu’ils vivront et ne mourront plus; toute précision doctrinale dépasserait le texte.
