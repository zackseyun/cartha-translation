  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
translation:
  language: fr
  text: '**9.** Je suis celle dont vous vous cachez,

    et vous me révélez.

    Mais chaque fois que vous vous cachez,

    moi-même, je me révélerai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La délimitation de cet extrait repose sur un OCR et un alignement de faible confiance; les mots qui suivent dans le témoin semblent appartenir aux lignes adjacentes.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: se cacher
  rationale: Le verbe signifie ici « cacher / se cacher » et forme une opposition avec ⲟⲩⲟⲛϩ, « révéler / se manifester ». Le complément ⲉⲣⲟⲉⲓ désigne la locutrice comme celle dont les destinataires se cachent.
- source_word: ⲟⲩⲟⲛϩ / ⲟⲩⲟⲛϩⲧ
  choice: révéler / se révéler
  rationale: Ces formes expriment la révélation ou la manifestation. Répéter « révéler » en français préserve le jeu antithétique entre l’action des destinataires (« vous me révélez ») et celle de la locutrice (« je me révélerai »).
- source_word: ⲁⲛⲟⲕ ϩⲱⲱⲧ
  choice: moi-même
  rationale: La tournure emphatique insiste sur la locutrice; « moi-même » conserve cette mise en relief sans alourdir la phrase.
- source_word: ⲉⲧⲉⲧⲛϣⲁⲛ
  choice: chaque fois que
  rationale: La construction à ϣⲁⲛ a ici une valeur temporelle éventuelle ou répétitive; « chaque fois que » rend naturellement cette nuance.
theological_decisions:
- issue: Nature de la révélation de la locutrice
  choice: Conserver la réciprocité paradoxale sans l’expliquer
  alternative: Interpréter la révélation comme une apparition physique, une illumination intérieure ou une action salvifique
  rationale: Le passage affirme seulement que la locutrice est révélée puis se révélera elle-même. Le français maintient cette tension sans lui imposer une lecture doctrinale.
translation_notes:
  register: 'Français moderne, sobre et dignifié. La répétition de « vous vous cachez » et de « révéler » est volontaire: elle reproduit le parallélisme et l’antithèse du copte. « Celle dont vous vous cachez » est plus idiomatique en français international que « celle de qui vous vous cachez ».'
