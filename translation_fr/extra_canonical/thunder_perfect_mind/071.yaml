base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: fr
  text: '**8.** Je suis le décret de ceux qui me demandent,


    et la voix des voix dans le lieu de la divinisation[a]

    des anges qu’ils ont envoyés dans la Parole[b],

    et des dieux des dieux, par le moyen du dessein[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture « divinisation » suppose que la suite ⲑⲉⲱⲥⲓⲥ transcrit le grec *theōsis*. La transcription OCR et la syntaxe de toute la phrase restent incertaines.
    reason: textual_uncertainty
  - marker: b
    text: Le mot ⲗⲟⲅⲟⲥ peut aussi être rendu par « parole » ou conservé sous la forme « Logos ».
    reason: lexical_alternative
  - marker: c
    text: Le terme ϣⲟϫⲛⲉ peut aussi signifier « conseil » ou « décision ». Le sujet de « ils ont envoyés » n’est pas exprimé clairement dans l’extrait.
    reason: lexical_and_grammatical_uncertainty
lexical_decisions:
- source_word: ⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: décret
  rationale: Le composé bien attesté signifie « commandement, ordre, décret » ; il ne faut pas le découper en termes supposés signifier « unité » et « vêtement ».
- source_word: ⲁⲓⲧⲉⲓ
  choice: demander
  rationale: Le verbe exprime ici le fait de demander ou de solliciter ; « demander » est direct et naturel.
- source_word: ⲥⲙⲏ
  choice: voix
  rationale: Le sens ordinaire est « voix » et la répétition « voix des voix » conserve la texture sonore du passage.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: divinisation
  rationale: La suite OCR semble représenter l’emprunt grec θέωσις, « divinisation » ; la leçon demeure toutefois incertaine.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  choice: anges
  rationale: L’emprunt grec désigne vraisemblablement ici des êtres célestes ; « anges » convient au registre du texte.
- source_word: ⲧⲁⲟⲩⲟ
  choice: envoyer
  rationale: Le verbe signifie « faire sortir, envoyer, émettre » ; « envoyer » convient avec « anges » et évite l’interprétation non fondée « crier ».
- source_word: ⲗⲟⲅⲟⲥ
  choice: Parole
  rationale: « Parole » restitue le sens de λόγος tout en laissant percevoir ici une possible portée technique ou personnifiée, signalée par la majuscule.
- source_word: ⲛⲟⲩⲧⲉ
  choice: dieux
  rationale: La morphologie est plurielle ; garder « dieux » préserve l’étrangeté et la tension mythologique du texte.
- source_word: ϣⲟϫⲛⲉ
  choice: dessein
  rationale: Le terme signifie normalement « conseil, dessein, décision », et non « cri » ; « dessein » s’accorde avec la construction instrumentale « par le moyen de ».
theological_decisions:
- issue: Portée de ⲗⲟⲅⲟⲥ
  choice: Parole
  alternative: parole / Logos
  rationale: La traduction ne tranche pas explicitement entre une parole ordinaire et une réalité technique ou personnifiée ; la note conserve les possibilités.
- issue: Formule « dieux des dieux »
  choice: Maintien littéral au pluriel
  alternative: êtres divins suprêmes
