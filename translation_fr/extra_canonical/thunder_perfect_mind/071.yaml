    reason: lexical_alternative
  - marker: c
    text: ⲡϣⲟϫⲛⲉ peut aussi désigner un « conseil » ou une « décision ». Le copte porte un sujet pluriel (« ils ») dans le groupe verbal antérieur, mais son antécédent et la répartition exacte du verbe entre « anges » et « dieux » sont incertains.
    reason: lexical_and_grammatical_uncertainty
  revision_rationale: La révision conserve les mots et répétitions discernables du copte, notamment « voix des voix » et la double occurrence de « dieux », tout en évitant de présenter comme certaine une syntaxe compromise par l’OCR. Elle retire la construction non étayée « dieux des dieux », emploie une ponctuation qui rend visible la difficulté de l’enchaînement, et supprime la majuscule doctrinalement chargée à « parole ».
