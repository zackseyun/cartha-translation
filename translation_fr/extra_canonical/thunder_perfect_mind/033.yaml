base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: fr
  text: '**11.** Regardez-moi lorsque je parais parmi ceux qui sont honorés ;


    et vous me trouverez dans les lieux les plus modestes.[a]


    Ne me rejetez pas non plus parmi les démunis, dans ce qui est sans valeur ;[b]


    car moi, moi, je suis compatissante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’OCR de cette ligne est fortement altéré. La lecture manuscrite reconstituée donne « vous me trouverez » ; « les lieux les plus modestes » peut aussi se rendre par « les lieux les moindres » ou « les plus bas ».
    reason: textual_variant
  - marker: b
    text: 'Le mot rendu par « ce qui est sans valeur » est formé sur un emprunt grec évoquant l’inutilité ou l’absence de valeur. On pourrait aussi traduire : « dans l’inutilité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: ceux qui sont honorés
  rationale: Le participe passif exprime les personnes auxquelles on rend honneur ; cette formulation conserve le contraste avec les lieux les plus modestes.
- source_word: ⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: les lieux les plus modestes
  rationale: Les emprunts grecs désignent littéralement les lieux les moindres ou les plus petits. « Modestes » restitue naturellement l’idée de faible rang sans imposer un sens uniquement spatial ou social.
- source_word: ⲛ̄ⲧⲉⲧⲛϭⲓⲛⲉ ⲙ̄ⲙⲟⲓ (texte reconstitué derrière l’OCR ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ)
  choice: vous me trouverez
  rationale: La séquence transmise par l’OCR est manifestement corrompue ; la lecture manuscrite reconnue donne le verbe « trouver » avec un objet à la première personne.
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: ne me rejetez pas
  rationale: ⲛⲟⲩϫⲉ avec le suffixe objet de première personne et ⲉⲃⲟⲗ signifie ici « jeter/rejeter dehors », et non « s’élever ».
- source_word: ⲛⲉⲧϣⲁⲁⲧ
  choice: ceux qui sont démunis
  rationale: La forme renvoie au manque ou au dénuement ; « démunis » garde cette portée sans la transformer en action de fouler aux pieds.
- source_word: ⲙ̄ⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: indignité
  rationale: Ce nom formé sur un emprunt grec de la famille ἀχρήστ- évoque l’inutilité, l’absence de valeur ou l’indignité. « Indignité » convient au registre poétique, tandis que la note signale l’éventail lexical.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: compatissante
  rationale: Le terme copte courant signifie « compatissant, miséricordieux ». Le féminin s’accorde avec la voix féminine qui parle dans l’ensemble du poème.
theological_decisions:
- issue: Rapport paradoxal entre honneur, petitesse, indignité et compassion
  choice: Maintenir les oppositions sans expliquer l’identité de la locutrice
  alternative: Interpréter ces affirmations selon une christologie, une sotériologie ou une figure de Sagesse déterminée
  rationale: Le passage juxtapose délibérément des positions sociales et morales opposées. Le texte ne précise pas ici une identification doctrinale, qu’il ne faut donc pas importer.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme des quatre membres et la répétition emphatique « moi, moi » sont conservés. « Compatissante » maintient la voix féminine du poème ; la ponctuation laisse subsister la relation syntaxique difficile entre le dénuement et l’indignité.
