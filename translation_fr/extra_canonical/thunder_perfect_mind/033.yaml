  to: '**11.** Regardez-moi lorsque je parais parmi ceux qui sont honorés ;


    et vous me trouverez dans les lieux les plus modestes.[a]


    Ne me rejetez pas non plus parmi les démunis, dans ce qui est sans valeur ;[b]


    car moi, moi, je suis compatissante.'
  rationale: La révision remplace le faux ami interprétatif « indignité » par une expression qui conserve le champ sémantique de l’inutilité / absence de valeur et maintient l’ambiguïté de la construction. Elle affine également l’ouverture pour refléter plus explicitement l’apparition de la locutrice, conformément à la piste anglaise auditéе, sans faire de l’OCR lacunaire une base pour une interprétation supplémentaire.
