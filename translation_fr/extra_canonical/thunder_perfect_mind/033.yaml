  - severity: low
    issue: Formulation initiale « Regardez-moi, moi qui parais »
    rationale: Cette formulation est possible, mais « Regardez-moi lorsque je parais » rend plus clairement la relation exprimée par l’anglais audité (« as I come forth ») sans alourdir le mouvement poétique.
