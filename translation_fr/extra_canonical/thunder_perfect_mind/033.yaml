review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit utilement les corrections apportées à la piste d’audit anglaise : « trouver », « rejeter », « démunis » et « compatissante » rendent les sens retenus contre les fausses segmentations initiales de l’OCR. Toutefois, « indignité » déplace ϩⲛ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ vers une notion morale ou sociale que le nom issu de ἀχρήστ- n’impose pas ; « inutilité » / « absence de valeur » est plus fidèle. La première proposition peut aussi exprimer plus directement le rapport entre le regard demandé et l’apparition de la locutrice.'
  naturalness: Le français est globalement poétique et contemporain. « Parmi ceux qui sont démunis, dans l’indignité » est cependant syntaxiquement heurté et sémantiquement imprécis. « Parmi les démunis, dans ce qui est sans valeur » conserve la construction et l’ambiguïté du copte tout en restant lisible.
  terminology: « Compatissante », au féminin, convient à la voix féminine du poème et au sens retenu de ⲟⲩϣⲁⲛϩⲧⲏⲥ. « Honorés » et « démunis » sont appropriés. Le terme grec emprunté ἀχρήστ- doit être rendu sans introduire l’idée d’« indignité ».
