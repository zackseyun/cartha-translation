translation_notes:
  register: Français international moderne, digne et direct. « Ne vous attachez pas à » rend idiomatiquement l’idée de placer son amour sur quelque chose, sans transformer l’énoncé en simple opposition entre haine et amour. Le pluriel de politesse ou collectif conserve l’adresse du passage.
