translation:
  language: fr
  text: '**3.** Ne détestez pas mon obéissance[a][c], et n’aimez pas ma maîtrise de soi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma soumission ». Le copte ϭⲟⲟⲃ peut désigner l’obéissance ou le fait d’être soumis.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma chasteté ». ⲥⲧⲱⲧ exprime souvent la retenue ou la maîtrise de soi, parfois plus précisément la retenue sexuelle.
    reason: lexical_alternative
  - marker: c
    text: L’extrait OCR de ce bloc contient aussi ⲫⲟⲃⲟⲥ (« crainte ») et ⲧⲟⲡⲟⲥ (« lieu »), qui peuvent appartenir aux lignes voisines plutôt qu’à cette paire. Les formes prohibitives sont restituées d’après le schéma récurrent de cette section.
    reason: alignment_note
lexical_decisions:
- source_word: ϭⲟⲟⲃ
  choice: obéissance
  rationale: Le terme copte peut exprimer le fait d’être soumis ou obéissant. « Obéissance » convient naturellement dans la construction possessive, sans exclure la nuance de soumission.
- source_word: ⲥⲧⲱⲧ
  choice: maîtrise de soi
  rationale: Dans un contexte éthique, le terme peut désigner la retenue ou l’enkrateia. « Maîtrise de soi » en conserve le sens large, tandis que « chasteté » serait plus étroit.
- source_word: ⲫⲟⲃⲟⲥ
  choice: crainte
  rationale: Cet emprunt au grec phobos figure dans l’extrait OCR, mais paraît appartenir au contexte voisin et n’est donc pas intégré au corps de cette unité.
- source_word: ⲧⲟⲡⲟⲥ
  choice: lieu
  rationale: Cet emprunt au grec topos apparaît aussi dans l’extrait OCR, vraisemblablement dans une ligne adjacente; il n’est pas rendu dans le texte principal.
