base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: fr
  text: '**12.** Je suis celle qui est honorée et celle qu’on bénit, et celle qu’on méprise avec dédain. Je suis la Paix, et c’est à cause de moi qu’il y a la Guerre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de la phrase est textuellement délicate. Une autre analyse possible serait : « Je suis la Paix et je suis la Guerre. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: celle qui est honorée
  rationale: Forme qualitative de ⲧⲁⲉⲓⲟ, « être honoré » ; le féminin correspond à la voix féminine et à la construction copte.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: celle qu’on bénit
  rationale: ⲥⲙⲟⲩ signifie ici « bénir » ; la fin ⲣⲟⲥ conservée par l’OCR appartient vraisemblablement à ⲉⲣⲟⲥ, et non à une reconstruction de « la Première ».
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: celle qu’on méprise
  rationale: L’emprunt grec καταφρονεῖν exprime le mépris, et ⲙⲙⲟⲥ marque la locutrice comme objet.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: avec dédain
  rationale: La locution précise la manière dont elle est méprisée ; « avec dédain » rend naturellement cette nuance tout en conservant le parallélisme.
- source_word: ϯⲣⲏⲛⲏ
  choice: la Paix
  rationale: Emprunt au grec εἰρήνη ; la majuscule et l’article conservent la portée titulaire de l’auto-identification.
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: c’est à cause de moi qu’il y a la Guerre
  rationale: Lecture causale cohérente avec la formule paradoxale du traité ; l’expression française explicite idiomatiquement l’existence de la Guerre sans supprimer l’ambiguïté signalée en note.
theological_decisions:
- issue: Rapport paradoxal entre la Paix et la Guerre
  choice: « Je suis la Paix, et c’est à cause de moi qu’il y a la Guerre »
  alternative: « Je suis la Paix et je suis la Guerre »
  rationale: La lecture causale est la plus probable ici et correspond au parallèle textuel, mais l’état de la forme copte permet de signaler l’autre analyse sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin est maintenu pour la voix de la locutrice. Le parallélisme antithétique du copte est conservé, sans répéter par erreur la dernière proposition comme dans la couche anglaise fournie.
