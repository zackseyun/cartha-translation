base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/024.yaml
  text: 'Know me, let them know me.

    For I am knowledge and ignorance.

    I am shame and boldness.

    I am shameless; I am ashamed.

    I am strength, and'
translation:
  language: fr
  text: 'Que les sages soient sages.


    Car je suis la connaissance et l’ignorance.


    Je suis la honte et l’audace[a].


    Je suis sans honte ; je suis pudique[b].


    Je suis la force, et'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec transcrit en copte, parrêsia, peut désigner la franchise, la liberté de parole ou l’audace confiante, notamment en public.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « pudique » est distinct de celui rendu par « honte » ; il peut aussi évoquer la réserve, la modestie ou la timidité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩⲥⲟⲩⲱⲛⲧ
  choice: Connaissez-moi ; qu’ils me connaissent
  rationale: Le -ⲧ suffixé à ⲥⲟⲩⲱⲛ représente ici l’objet de première personne, « moi » ; ⲙⲁⲣⲟⲩ introduit ensuite un jussif à la troisième personne du pluriel. Cette lecture suit directement les formes coptes et conserve leur reprise rhétorique.
- source_word: ⲡⲥⲟⲟⲩⲛ / ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: la connaissance / l’ignorance
  rationale: Ces deux substantifs abstraits forment une opposition explicite ; les équivalents français en gardent la concision et le paradoxe.
- source_word: ⲡϣⲓⲡⲉ
  choice: la honte
  rationale: « Honte » rend le sens courant du terme sans préciser s’il s’agit d’un sentiment intérieur ou d’une condition sociale.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: l’assurance
  rationale: L’emprunt au grec παρρησία évoque une parole franche, libre et hardie. « Assurance » s’oppose naturellement à « honte » tout en laissant la note signaler la dimension publique de la parole.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: sans honte
  rationale: La construction privative signifie littéralement « sans honte ». Cette formulation conserve son lien lexical avec ⲡϣⲓⲡⲉ dans la phrase précédente.
- source_word: ϫⲓⲡⲏⲧ
  choice: pudique
  rationale: Ce terme distinct de ϣⲓⲡⲉ exprime la pudeur, la réserve ou la timidité. « Pudique » maintient le parallélisme adjectival et le contraste avec « sans honte ».
- source_word: ⲛⲁϣⲧⲉ ⲁⲩⲱ
  choice: la force, et
  rationale: ⲛⲁϣⲧⲉ désigne ici la force ou la fermeté, non la peur. Le ⲁⲩⲱ final, « et », est conservé puisque la proposition continue dans le segment suivant.
theological_decisions:
- issue: Identité paradoxale de la locutrice
  choice: Conserver sans harmonisation les couples « connaissance et ignorance », « honte et assurance », « sans honte » et « pudique ».
  alternative: Interpréter chaque second terme comme une explication, une correction ou un état successif.
  rationale: Le texte se construit sur des affirmations antithétiques délibérées. Les résoudre effacerait sa tension théologique et rhétorique.
translation_notes:
  register: Français international moderne, sobre et dignifié. Les phrases brèves et les reprises de « Je suis » préservent la cadence proclamatoire. Le féminin de « pudique » correspond à la voix féminine mise en scène dans l’œuvre, tandis que les autres formulations restent grammaticalement non marquées. La conjonction finale est volontairement laissée en suspens, conformément à la délimitation du segment.
