translation:
  language: fr
  text: '**4.** Je suis l’épouse et la vierge[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot ⲥϩⲓⲙⲉ peut signifier « femme » ou « épouse ». En contraste avec ⲡⲁⲣⲑⲉⲛⲟⲥ (« vierge »), « épouse » accentue le paradoxe ; « femme » reste une traduction possible, plus neutre.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ est un emprunt au grec, le plus souvent traduit par « vierge » ; « jeune fille » serait une autre possibilité dans un registre poétique.
    reason: lexical_alternative
  - marker: c
    text: Dans l’OCR, le mot ⲡⲁⲣⲑⲉⲛⲟⲥ est coupé par un saut de ligne (ⲡⲁⲣ | ⲑⲉⲛⲟⲥ), ce qui réduit la certitude de l’alignement aux limites de ce segment.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Je suis
  rationale: Conserve la cadence copulative récurrente à la première personne, essentielle à la voix du poème, sans atténuer la répétition de « Je suis ».
- source_word: ⲧⲉⲥϩⲓⲙⲉ
  choice: l’épouse
  rationale: ⲥϩⲓⲙⲉ peut désigner une « femme » ou une « épouse ». Ici, « épouse » fait ressortir l’antithèse avec ⲡⲁⲣⲑⲉⲛⲟⲥ, tout en laissant l’autre sens signalé en note.
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Conjonction de coordination courante qui préserve le parallélisme serré des deux termes.
- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: la vierge
  rationale: Cet emprunt au grec signifie le plus souvent « vierge » ; ce choix conserve directement la tension paradoxale avec « épouse ».
theological_decisions:
- issue: Tension entre l’état d’épouse et la virginité
  choice: Maintenir littéralement « l’épouse et la vierge »
  alternative: Reformuler ou expliquer la relation entre les deux identités
  rationale: Le texte juxtapose délibérément les deux désignations sans résoudre leur tension. La traduction ne doit ni harmoniser le paradoxe ni lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure brève et solennelle « Je suis… » ainsi que l’article défini devant les deux identités sont conservés afin de rendre le parallélisme et le paradoxe du copte.
