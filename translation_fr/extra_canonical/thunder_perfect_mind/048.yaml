base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: fr
  text: 'Et vous m’avez appelée « Sans-loi ».[a]


    Je suis celle que vous avez poursuivie ;


    je suis celle dont vous vous êtes emparés ;


    je suis celle que vous avez dispersée,


    et vous m’avez connue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Sans-loi » rend le grec anomia, emprunté en copte : « absence de loi », « violation de la loi » ou « iniquité » sont aussi possibles. Ce titre conserve l’accusation sans lui donner d’emblée une portée théologique plus précise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: appeler
  rationale: Le verbe signifie couramment « appeler, nommer ». Le complément « m’ » est explicité en français d’après la construction et la série d’énoncés à la première personne.
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: Absence-de-loi
  rationale: Ce calque du grec anomia conserve la force paradoxale du titre accusateur sans lui substituer d’emblée les notions plus interprétatives d’« iniquité » ou de « péché ».
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: poursuivie
  rationale: La construction exprime le fait de courir après une personne. Le pronom féminin résomptif renvoie naturellement à « celle », sans qu’il soit nécessaire de corriger le texte en « après moi ».
- source_word: ⲙⲁϩⲧⲉ
  choice: vous êtes emparés
  rationale: Le verbe désigne l’action de saisir ou de prendre possession. Cette tournure garde sa force tout en restant naturelle en français.
- source_word: ϫⲟⲟⲩ ⲉⲃⲟⲗ
  choice: dispersée
  rationale: Le groupe verbal signifie ici « envoyer au-dehors, disperser », et non « crier » ou « proclamer », qui relèverait d’un autre verbe copte proche graphiquement.
- source_word: ⲥⲟⲟⲩⲛ
  choice: connu
  rationale: Le texte transmis dans l’extrait porte le verbe « connaître » à l’accompli affirmatif. La formulation demeure suspendue puisque l’extrait s’arrête immédiatement après ce mot.
theological_decisions:
- issue: Valeur du titre ⲁⲛⲟⲙⲓⲁ
  choice: Absence-de-loi
  alternative: Iniquité
  rationale: « Iniquité » introduirait une qualification morale et théologique plus précise que le mot grec emprunté ne l’exige ; le calque maintient l’ambiguïté provocatrice de l’autodésignation.
- issue: Dernier verbe de l’extrait
  choice: et vous avez connu…
  alternative: et vous avez rassemblée…
  rationale: La traduction suit les lettres fournies, ⲥⲟⲟⲩⲛ, plutôt que de corriger silencieusement le texte en ⲥⲱⲟⲩϩ (« rassembler »), même si cette correction produirait une antithèse élégante avec « dispersée ».
translation_notes:
  register: Français international actuel, sobre et solennel. La répétition de « je suis celle » conserve l’anaphore du texte copte. Les accords féminins rendent explicitement la voix féminine. Les points de suspension signalent uniquement que la proposition finale est inachevée dans l’extrait fourni.
