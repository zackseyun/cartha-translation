  terminology: « loi » et « péchés » conviennent. « Selon la loi » rend prudemment ϩⲁ ⲡⲓⲛⲟⲙⲟⲥ sans surdéterminer son rapport syntaxique. Aucun terme théologique additionnel ne doit être introduit.
