- source_word: 'ⲛⲟⲙⲟⲥ (OCR : ⲛⲉⲗⲟⲥ)'
  choice: loi
  rationale: La lecture proposée comme correction de l’OCR correspond au grec νόμος, emprunt courant en copte ; elle demeure toutefois incertaine.
- source_word: ⲉⲛⲉⲧ ϣⲟⲟⲡ ϩⲛ ϩⲉⲛⲛⲟⲃⲉ ⲉⲛⲁϣⲱ
