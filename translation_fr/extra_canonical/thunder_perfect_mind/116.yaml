- source_word: ϣⲟⲟⲡ ⲟⲩⲁⲁⲧ
  choice: Sois seul
  rationale: ϣⲟⲟⲡ peut servir d’impératif (« sois »), et ⲟⲩⲁⲁⲧ signifie normalement « seul, solitaire ». Le sens « obéissant » proposé par la couche anglaise n’est pas suffisamment établi par cet extrait.
