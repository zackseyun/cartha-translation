translation:
  language: fr
  text: '**5.** C’est pourquoi, ne manquez pas de m’écouter,

    et ne manquez pas de me connaître

    en un autre lieu ou à un autre moment.

    Ne manquez pas de me connaître ; ne…[a]'
  philosophy: optimal-equivalence
