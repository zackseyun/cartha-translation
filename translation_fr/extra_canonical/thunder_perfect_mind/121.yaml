review_pass:
  verdict: revise
  source_fidelity: 'La version proposée inverse la valeur de la construction négative ⲙⲡⲣ ⲣⲁⲧ- : elle ne signifie pas « ne manquez pas de m’écouter / me connaître », mais une interdiction de faire en sorte que la locutrice soit entendue ou connue. En outre, l’OCR visible porte ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ (« dans un autre lieu ou à un autre temps »), non le ⲕⲣⲓⲙⲁ (« jugement ») conjecturé dans la piste anglaise. La fin est effectivement lacunaire, après une nouvelle occurrence de ⲙⲡⲣ ⲣⲁⲧ-.'
  naturalness: « Ne faites pas en sorte que l’on m’entende / me connaisse » est un français moderne et clair, tout en exprimant le causatif prohibitif sans l’ambiguïté de « ne me faites pas entendre ». « Un autre temps » convient au registre élevé et parallèle de l’énoncé.
  terminology: Aucun terme théologique spécialisé n’est en jeu. « Connaître » rend directement ⲥⲟⲟⲩⲛ. La traduction conserve la distinction visible entre lieu (ⲙⲁ) et temps/moment (ⲟⲩⲟⲉⲓϣ), plutôt que d’adopter la restitution incertaine « jugement ou puissance » de l’audit anglais.
  issues:
  - severity: high
    issue: Inversion du sens des deux injonctions causatives négatives
    rationale: « Ne manquez pas de m’écouter / de me connaître » demande aux destinataires d’écouter et de connaître la locutrice, alors que ⲙⲡⲣ ⲣⲁⲧ ⲥⲱⲧⲙ ⲛⲥⲱⲓ et ⲙⲡⲣ ⲣⲁⲧ ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ interdisent de faire qu’elle soit entendue ou connue.
  - severity: medium
    issue: Rendre explicitement la fin visible mais inachevée
    rationale: Après « dans un autre lieu ou à un autre temps », l’OCR reprend ⲙⲡⲣ ⲣⲁⲧ ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ ⲙⲡⲣ ⲣⲁⲧ-. Il faut conserver cette reprise et signaler l’interruption, sans compléter le texte par conjecture.
  - severity: low
    issue: Divergence avec l’audit anglais sur ⲕⲉⲙⲁ
    rationale: L’anglais suppose une perte OCR permettant de lire ⲕⲣⲓⲙⲁ. L’extrait transmis lit cependant ⲕⲉⲙⲁ, suivi de ⲕⲉⲟⲩⲟⲉⲓϣ ; la lecture « autre lieu ou autre temps » doit donc être retenue pour ce segment, avec la réserve liée à la faible confiance d’alignement.
