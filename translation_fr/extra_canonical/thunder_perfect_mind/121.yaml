lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲡⲁⲓ
  choice: C’est pourquoi
  rationale: La locution introduit ici une conséquence ou un motif. « C’est pourquoi » restitue naturellement ce lien sans préciser davantage sa portée.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: ne manquez pas de m’écouter
  rationale: La négation injonctive ⲙⲡⲣ suivie de la construction avec ⲣⲁⲧ- exprime le fait de ne pas rester sans écouter. Cette formulation française conserve l’exhortation active et évite le contresens passif « ne me laissez pas être entendue ».
- source_word: ⲁⲩⲱ
  choice: et
  rationale: Connecteur coordonnant simple, sans valeur adversative nécessaire.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: ne manquez pas de me connaître
  rationale: La construction est parallèle à l’exhortation précédente et porte sur ⲥⲟⲟⲩⲛ, « connaître ». « Ne manquez pas de » rend l’idée de ne pas rester privé de cette connaissance.
- source_word: ⲛⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: en un autre lieu ou à un autre moment
  rationale: ⲕⲉⲙⲁ se décompose naturellement en ⲕⲉ- (« autre ») et ⲙⲁ (« lieu »), tandis que ⲟⲩⲟⲉⲓϣ désigne ici un temps ou un moment. Cette lecture suit directement le copte visible et ne suppose ni un emprunt grec signifiant « jugement » ni le sens « puissance ».
theological_decisions:
- issue: Portée de l’appel à écouter et à connaître la locutrice
  choice: Conserver deux exhortations directes parallèles
  alternative: 'Transformer les verbes en passifs : « ne me laissez pas être entendue/connue »'
  rationale: La morphologie et le parallélisme soutiennent une injonction adressée aux auditeurs afin qu’ils écoutent et connaissent la locutrice. La traduction ne précise pas davantage la nature théologique de cette connaissance.
translation_notes:
  register: Français international moderne, digne et oral. Le vouvoiement pluriel ou de politesse est retenu comme forme française non familière de l’exhortation, le copte ne marquant pas ici explicitement le nombre. La mise en lignes conserve le parallélisme rhétorique. La lecture proposée corrige les analyses manifestement incompatibles avec les mots visibles ⲕⲉⲙⲁ (« autre lieu ») et ⲕⲉⲟⲩⲟⲉⲓϣ (« autre moment/temps »).
