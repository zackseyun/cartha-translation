  text: And you embrace me[a]. You despised me, and you saw me[e][d][c][b]. Do not scatter the first things [...] Do not ponder [...] your limbs [...]
translation:
  language: fr
  text: '**3.** Et vous m’honorez.[a]

    Vous m’avez méprisée, et vous m’avez vue.

    Ne dispersez pas les choses premières […] [b]

    Ne méditez pas […]

    vos membres […] au-dedans […] [c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le copte ⲧⲁⲉⲓⲟ signifie « honorer ». Le rendu « embrasser », présent dans une ancienne consultation, reposait sur un passage mal aligné.
    reason: correction_textuelle
  - marker: b
    text: Le manuscrit devient lacunaire après « les choses premières ». Cette expression peut aussi se comprendre comme « les commencements » ou « ce qui vient en premier ».
    reason: lacune_et_ambiguite_lexicale
  - marker: c
    text: Les dernières lignes sont très endommagées. « Membres » et « au-dedans » sont lisibles, mais leur relation syntaxique ne peut pas être rétablie avec certitude.
    reason: etat_du_manuscrit
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: honorer
  rationale: Le verbe copte signifie ici « honorer » ou « accorder de l’honneur ». Le rendu « embrasser » provenait du texte de consultation mal aligné et n’est pas retenu.
- source_word: ϣⲱϥ
  choice: mépriser
  rationale: Dans ⲁⲧⲉⲧⲛϣⲱϥ, ⲁ- est la marque de l’accompli et ⲧⲉⲧⲛ- le sujet de deuxième personne du pluriel ; il ne s’agit donc pas du préfixe privatif donnant « sans honte ».
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: disperser
  rationale: Avec l’impératif négatif ⲙⲡⲣ-, l’expression commande de ne pas répandre ou disperser, et non de ne pas craindre.
- source_word: ⲛϣⲟⲣⲡ
  choice: les choses premières
  rationale: 'Ce rendu littéral conserve l’indétermination du substantif pluriel : il peut s’agir de réalités premières, de commencements ou de ce qui vient en premier.'
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: méditer
  rationale: Cet emprunt au grec μελετάω peut signifier méditer, réfléchir à ou s’exercer ; « méditer » convient à l’impératif négatif tout en laissant son complément dans la lacune.
- source_word: ⲗⲁⲁⲧⲉ
  choice: membres
  rationale: « Membres » conserve le sens corporel sans reconstruire abusivement la relation syntaxique, endommagée dans l’extrait.
- source_word: ⲁⲧⲏⲛ
  choice: au-dedans
  rationale: Le terme exprime l’intériorité ; le contexte lacunaire ne permet pas d’identifier sûrement ce qui se trouve au-dedans de quoi.
theological_decisions:
- issue: Genre de la voix qui parle
  choice: Accord féminin dans « méprisée » et « vue »
  alternative: Accord masculin ou tournure sans accord visible
  rationale: La voix de Tonnerre est présentée comme féminine dans l’ensemble de l’œuvre. L’accord français rend cette donnée littéraire sans ajouter une identité doctrinale.
- issue: Nature des « choses premières »
  choice: Maintenir une expression générale et indéterminée
  alternative: Préciser « les commencements », « les premiers principes » ou une réalité cosmologique déterminée
  rationale: Le fragment ne permet pas de trancher entre une portée temporelle, ordinale ou cosmologique ; une explicitation doctrinale résoudrait indûment l’ambiguïté.
