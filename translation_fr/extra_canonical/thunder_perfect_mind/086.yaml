lexical_decisions:
- source_word: ⲙⲫⲏⲧ
  choice: du cœur
  rationale: La leçon OCR semble représenter une lecture défectueuse de ⲙ̄ⲡϩⲏⲧ, « du cœur ». Le fragment continue vraisemblablement la phrase précédente; on n’ajoute donc pas « Je suis » au début.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  choice: qui est en moi
  rationale: ⲥϣⲟⲟⲡ exprime l’existence ou la présence; dans ce contexte, ⲛϩⲏⲧ porte le sens intérieur « en moi ».
- source_word: ⲡⲥⲱⲧⲙ
  choice: l’écoute
  rationale: Le substantif verbal peut désigner l’action d’entendre ou d’écouter. « L’écoute » conserve le parallélisme abstrait avec « la parole » dans un français naturel.
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: accessible à tous
  rationale: La proposition décrit ce qui est à la portée de chacun. « Accessible à tous » rend clairement la valeur distributive de ⲟⲩⲟⲛ ⲛⲓⲙ.
- source_word: ⲡϣⲁϫⲉ
  choice: la parole
  rationale: Le terme signifie « parole, discours, énoncé ». « Parole » convient au registre solennel et forme un contraste naturel avec « écoute ».
- source_word: ⲙⲁⲧϣⲉ ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: qu’on ne peut saisir
  rationale: La suite transmise par l’OCR est fortement corrompue. La reconstruction textuelle sous-jacente soutient l’idée d’une parole impossible à atteindre ou à saisir; la traduction ne suit pas littéralement les formes OCR incohérentes.
- source_word: ⲧⲉⲕⲱ
  choice: l’appel
  rationale: Dans ce contexte vocal, « appel » exprime une voix qui interpelle. Le terme peut aussi évoquer un cri.
