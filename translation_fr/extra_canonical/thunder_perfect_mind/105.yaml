  source_fidelity: 'La structure retenue suit de façon plausible les corrections de l’audit anglais : ⲧⲉⲧⲛⲣⲥⲱⲧⲉ est rendu par « vous êtes vaincus », ϫⲓ-ⲥⲃⲱ par l’idée d’apprendre, et ⲁⲛⲟⲕ ⲡⲉ demeure volontairement inachevé. La séquence immédiatement après « Vous me regardez » reste toutefois textuellement incertaine dans l’extrait OCR ; la note doit donc être ancrée sur cette séquence, non sur le verbe « regardez ».'
