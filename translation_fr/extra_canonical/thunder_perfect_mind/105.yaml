base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/105.yaml
  text: 'You look on me[a], cast out from yourselves,

    and you are defeated.

    Listen to me, you hearers,

    and learn my words,

    you who know me[g][f][e][d][c][b].

    I am...'
translation:
  language: fr
  text: '**3.** Vous me regardez[a], vous qui m’avez rejetée loin de vous,

    et vous êtes vaincus.

    Écoutez-moi, vous qui entendez,

    et laissez mes paroles vous instruire,

    vous qui me connaissez.

    Je suis…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture de la proposition qui suit est incertaine, car l’OCR et la segmentation du manuscrit sont difficiles. On a aussi proposé des sens tels que « vous qui prospérez au grand jour ».
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  choice: Vous me regardez
  rationale: La construction signifie directement « voir/regarder quelqu’un ». « Regardez » conserve l’adresse vive sans l’archaïsme de « contemplez ».
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: vous qui m’avez rejetée loin de vous
  rationale: La lecture retenue suit la révision source-grounded, mais l’OCR et la segmentation de cette séquence restent incertains. Le féminin « rejetée » correspond à la voix féminine du poème.
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  choice: vous êtes vaincus
  rationale: La suite doit être lue comme ⲣ-ⲥⲱⲧⲉ, « être vaincu/échouer », et non comme un verbe signifiant « crier ».
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: Écoutez-moi, vous qui entendez
  rationale: L’impératif « écoutez-moi » rend l’appel, tandis que « vous qui entendez » traduit le vocatif formé avec le nom grec ἀκροατής sans employer le substantif administratif « auditeurs ».
- source_word: ⲛⲧⲉⲧⲛⲭⲓⲥⲃⲱ ⲉⲛⲁⲯⲩⲭⲏ
  choice: laissez mes paroles vous instruire
  rationale: La révision identifie derrière l’OCR ⲭⲓⲥⲃⲱ la locution ϫⲓ-ⲥⲃⲱ, « recevoir un enseignement/apprendre », et derrière ⲯⲩⲭⲏ une lecture fautive de ϣⲁϫⲉ, « paroles ». La formulation française exprime naturellement l’idée d’apprendre des paroles de la locutrice.
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: vous qui me connaissez
  rationale: Le groupe est traité comme un vocatif parallèle à « vous qui entendez ».
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Je suis…
  rationale: La formule ouvre la proposition suivante; les points de suspension signalent que l’extrait s’interrompt sans ajouter « celle qui est ».
theological_decisions:
- issue: Genre de la voix qui parle
  choice: Accord féminin dans « rejetée »
  alternative: Formulation sans accord de genre
  rationale: Le titre et l’ensemble du poème présentent grammaticalement et littérairement une voix féminine; cet accord n’ajoute aucune identification doctrinale.
- issue: Portée de « Je suis »
  choice: Laisser la formule ouverte
  alternative: « Je suis celle qui est » ou « Je suis l’unique »
  rationale: Le segment appartient au début de la phrase suivante. Le compléter ici résoudrait artificiellement une coupure du texte et introduirait une affirmation théologique absente de l’extrait.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes brèves conservent le parallélisme des vocatifs et la cadence oraculaire. Le texte évite les archaïsmes ainsi que toute explicitation confessionnelle.
