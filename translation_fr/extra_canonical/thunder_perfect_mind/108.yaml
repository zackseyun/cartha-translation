lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: le nom
  rationale: Le substantif copte signifie clairement « nom » et forme ici un parallélisme inversé avec ⲧⲥⲙⲏ.
- source_word: ⲧⲥⲙⲏ
  choice: la voix
  rationale: Dans cette construction, ⲥⲙⲏ correspond à « voix » ou « son »; « voix » conserve le caractère personnel et poétique du discours.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: le signe
  rationale: Emprunt au grec σημεῖον, rendu directement par « signe ».
- source_word: ⲙⲡⲁⲓ
  choice: de la lettre
  rationale: L’OCR donne littéralement une forme pouvant se lire « de ceci », mais le texte établi et le parallélisme transmis soutiennent une lecture renvoyant à l’écrit ou à la lettre; l’incertitude est signalée en note.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: la manifestation
  rationale: L’expression désigne l’action de rendre visible, de révéler ou de manifester. « Manifestation » garde la formulation nominale et l’ambiguïté du passage.
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: la division
  rationale: Le terme grec emprunté αἵρεσις peut évoquer choix, parti, secte ou division. « Division » convient au contexte sans introduire prématurément le sens doctrinal moderne d’« hérésie ».
- source_word: ⲁⲕⲣⲟⲁⲧ
  choice: non intégré au corps du texte
  rationale: Cette forme grecque peut représenter une injonction comme « Écoutez ! », mais elle se trouve dans une zone OCR mal alignée au bord de page; sa possible présence est donc signalée seulement en note.
theological_decisions:
- issue: Sens de ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: division
  alternative: hérésie / secte / choix
  rationale: « Division » préserve la portée large du grec αἵρεσις et évite d’imposer au texte une catégorie confessionnelle plus tardive.
