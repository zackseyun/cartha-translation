  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
translation:
  language: fr
  text: '**6.** Portez votre regard sur la terre[a] : vous me trouverez parmi ceux qui viennent[b]. Et ne regardez pas le tas de fumier fait d’excréments[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début transmis par l’OCR, ⲛⲁⲉⲃⲟⲗ, semble représenter ⲛⲁⲩ ⲉⲃⲟⲗ : « regardez au-dehors » ou « portez votre regard » sur la terre.'
    reason: textual_note
  - marker: b
    text: ⲉⲧⲛⲏⲟⲩ signifie ici « ceux qui viennent » ou « ceux qui sont en train de venir ». La lecture « ceux qui voient » demanderait une autre forme du verbe.
    reason: lexical_alternative
  - marker: c
    text: Le copte associe un emprunt grec désignant un tas de fumier à un mot copte signifiant « excréments » ou « ordure » ; la formulation « fait d’excréments » conserve cette répétition qui renforce l’image d’abjection. Le texte de consultation (« Je suis sans honte ; j’ai honte ») ne correspond pas à cet extrait, sans doute à cause de l’alignement heuristique des lignes.
    reason: cultural_and_alignment_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ ϩⲓ ⲡⲕⲁϩ
  choice: Portez votre regard sur la terre
  rationale: L’OCR ⲛⲁⲉⲃⲟⲗ représente vraisemblablement ⲛⲁⲩ ⲉⲃⲟⲗ, « regarder au-dehors / porter son regard », suivi de ϩⲓ ⲡⲕⲁϩ, « sur la terre ». La tournure française exprime naturellement l’impératif sans introduire un sujet à la première personne absent du copte.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vous me trouverez
  rationale: Le futur à la deuxième personne du pluriel suivi du pronom objet de première personne se rend directement ainsi.
- source_word: ϩⲛ ⲛⲉⲧⲛⲏⲟⲩ
  choice: parmi ceux qui viennent
  rationale: ϩⲛ prend ici le sens distributif de « parmi ». ⲛⲏⲟⲩ est une forme du verbe « venir », et non du verbe « voir » ; le relatif désigne donc « ceux qui viennent ».
- source_word: ⲙⲡⲣⲛⲁⲩ
  choice: ne regardez pas
  rationale: ⲙⲡⲣ- marque l’impératif négatif et ⲛⲁⲩ signifie « voir, regarder ». Aucun pronom « me » n’apparaît dans cette proposition.
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  choice: le tas de fumier d’excréments
  rationale: Le premier nom, emprunté au grec κοπρία, évoque un tas de fumier, tandis que ⲕⲱⲕ désigne les excréments ou l’ordure. La formulation conserve la redondance délibérément dégradante du copte.
theological_decisions:
- issue: Identité de « ceux qui viennent »
  choice: Maintenir l’expression sans identifier ce groupe
  alternative: Interpréter le groupe comme des voyants, des initiés ou une communauté particulière
  rationale: Le passage ne précise ni l’identité ni le statut religieux de ces personnes ; une identification doctrinale résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif pluriel conserve l’adresse collective. La ponctuation met en relief la promesse centrale, tandis que la dernière phrase garde la rudesse et la répétition de l’image source.
