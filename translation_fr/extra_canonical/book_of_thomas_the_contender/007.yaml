  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: fr
  text: '« Heureux êtes-vous, vous qui savez d’avance ce qui peut vous faire trébucher et qui fuyez les choses étrangères.


    Heureux êtes-vous, vous qui êtes insultés et méprisés à cause de l’amour que leur Seigneur leur témoigne.[a]


    Heureux êtes-vous, vous qui pleurez et qui êtes persécutés par ceux qui sont sans espérance, car vous serez libérés de toute captivité.


    « Veillez et priez afin de ne pas demeurer dans la chair, mais de sortir plutôt de l’amère captivité de cette vie. Quand vous prierez, vous trouverez le repos, car vous aurez abandonné la souffrance et la honte. En effet, lorsque vous vous détacherez des souffrances et des désirs du corps, vous recevrez le repos qui vient du Bon, et vous régnerez avec le Roi, lui et vous unis l’un à l’autre, dès maintenant et pour toujours. Amen. »


    Le Livre de Thomas


    Le Combattant


    Écrit aux personnes parvenues à la maturité


    Souvenez-vous aussi de moi, mes frères,


    dans vos prières :


    Paix aux saints


    et à ceux qui appartiennent à l’Esprit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms passent de « vous » à « leur ». Cette irrégularité du témoin a été conservée; le sens exact de « leur Seigneur » demeure incertain.
    reason: Signaler une difficulté grammaticale réelle sans corriger silencieusement le texte ni identifier arbitrairement les référents.
  - marker: b
    text: 'On pourrait aussi traduire : « à ceux de l’esprit ». Une vérification directe du texte copte est encore nécessaire.'
    reason: Préserver l’incertitude quant à la valeur de l’expression et au référent de « esprit/Esprit ».
lexical_decisions:
- source_word: “Blessed” (Coptic source review pending)
  choice: « Heureux êtes-vous »
  rationale: Formule solennelle et intelligible qui conserve la forme directe des béatitudes sans introduire l’idée plus étroite de bonheur émotionnel.
- source_word: “what can trip you up”
  choice: « ce qui peut vous faire trébucher »
  rationale: Conserve l’image de l’obstacle ou du piège, sans préciser indûment s’il s’agit d’une faute morale, d’une tentation ou d’une erreur.
- source_word: “strange things”
  choice: « les choses étrangères »
  rationale: 'Rendu volontairement peu interprétatif : « étrangères » préserve l’étrangeté sémantique du témoin, là où « mauvaises » ou « étrangères à Dieu » ajouterait une explication absente.'
- source_word: “existing/living in the flesh”
  choice: « demeurer dans la chair »
  rationale: Maintient le vocabulaire anthropologique marqué du passage et sa tension théologique, plutôt que de le banaliser en « vivre selon des désirs mauvais ».
- source_word: “depart from bodily sufferings and appetites”
  choice: « vous vous détacherez des souffrances et des désirs du corps »
  rationale: « Se détacher » exprime une rupture existentielle sans imposer nécessairement l’idée de mort physique; « désirs » est plus naturel que « appétits » dans ce contexte.
- source_word: “the Good One”
  choice: « le Bon »
  rationale: Conserve le titre substantivé et son possible référent divin sans le remplacer explicitement par « Dieu ».
- source_word: “The Contender”
  choice: « Le Combattant »
  rationale: Rend un titre personnel évoquant celui qui lutte; « adversaire » risquerait de suggérer une hostilité, et « athlète » serait plus spécialisé.
- source_word: “the Mature”
  choice: « les personnes parvenues à la maturité »
  rationale: Évite le français peu naturel « les matures » tout en conservant la possible portée spirituelle de la maturité.
- source_word: “those of the spirit”
  choice: « ceux qui appartiennent à l’Esprit »
  rationale: Formulation française naturelle qui garde ouverte la valeur de l’expression, tout en signalant son sens d’appartenance ou d’orientation.
theological_decisions:
- issue: Portée de « dans la chair »
  choice: Maintien de l’expression « demeurer dans la chair »
  alternative: « vivre selon la chair » ou « mener une existence corporelle »
  rationale: Le passage peut viser la condition corporelle elle-même ou une manière charnelle de vivre. La traduction choisie ne résout pas cette tension en faveur d’une lecture morale ou dualiste déterminée.
- issue: Identité du « Bon » et du « Roi »
  choice: Conserver les deux titres distincts
  alternative: Les expliciter par « Dieu » et « le Christ »
  rationale: Le témoin fourni ne permet pas d’identifier avec certitude chaque titre; l’explicitation importerait une conclusion théologique.
- issue: Union avec le Roi
  choice: « lui et vous unis l’un à l’autre »
  alternative: « vous ne ferez plus qu’un avec lui »
  rationale: La formulation retenue préserve la réciprocité de l’union sans affirmer une fusion ontologique.
- issue: « ceux qui appartiennent à l’Esprit »
  choice: Majuscule à « Esprit » avec note d’ambiguïté
  alternative: « ceux de l’esprit »
  rationale: Le contexte de bénédiction finale favorise un référent spirituel ou divin, mais le statut précis de l’expression reste incertain en l’absence de révision directe du copte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive des béatitudes et le ton exhortatif sont conservés. Le brouillon repose sur le témoin anglais public fourni; la consultation directe du copte du Codex de Nag Hammadi II,7 reste à effectuer. Les éléments éditoriaux étrangers à l’œuvre (FAQ, coordonnées et mention commerciale) ont été omis.
