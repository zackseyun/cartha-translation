review_pass:
  verdict: revise
  source_fidelity: 'Le contrôle est nécessairement provisoire : le texte copte n’est pas fourni et la base disponible est le témoin anglais public. Le brouillon suit fidèlement l’enchaînement et les ambiguïtés essentielles du témoin, notamment l’alternance déroutante entre « vous » et « leur » dans la deuxième béatitude. Toutefois, « ceux qui appartiennent à l’Esprit » interprète et explicite indûment « those of the spirit ».'
  naturalness: Le français est globalement naturel, solennel et accessible. « Ceux de l’esprit » est plus proche de la formule brève et elliptique du témoin; une note peut en préserver l’incertitude sans introduire une relation d’appartenance.
  terminology: « chair », « le Bon », « le Roi », « souffrances » et « désirs du corps » maintiennent utilement le vocabulaire anthropologique et théologique sans identification confessionnelle. La minuscule à « esprit » évite de transformer une expression ambiguë en désignation certaine de l’Esprit divin.
  issues:
  - severity: medium
    issue: « ceux qui appartiennent à l’Esprit » pour « those of the spirit »
    rationale: La formulation ajoute l’idée d’appartenance et la majuscule impose un référent divin. Le témoin anglais demeure elliptique et ne justifie ni l’une ni l’autre précision.
