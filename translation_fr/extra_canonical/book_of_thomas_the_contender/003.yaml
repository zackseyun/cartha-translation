translation:
  language: fr
  text: 'Thomas dit au Seigneur : « Je t’en prie donc, réponds à mes questions avant ton ascension. Lorsque je t’aurai entendu parler des réalités cachées, je pourrai alors en discuter ouvertement. Car il est clair pour moi qu’il est difficile de mettre la vérité en pratique devant les autres. »


    Le Sauveur répondit : « Si les réalités visibles vous sont cachées, comment pouvez-vous entendre parler des réalités invisibles ? S’il vous est difficile d’accomplir les œuvres de vérité qui sont visibles en ce monde, comment accomplirez-vous donc celles qui se rapportent à la hauteur invisible et à la Plénitude[a] ? Et comment serez-vous appelés “ouvriers” ? À cet égard, vous êtes encore des disciples et vous n’avez pas encore atteint le sommet de la perfection. »


    Thomas répondit au Sauveur : « Explique-nous ce que sont ces réalités invisibles dont tu parles, [et qui pourtant] nous sont cachées. »


    Le Sauveur dit : « [Tous] les corps […] les animaux sont engendrés […] cela se manifeste comme […] de même, ceux qui sont en haut […] les réalités visibles, mais [elles sont] visibles [ ] dans leur propre racine, et leur fruit les nourrit.[b] Cependant, ces corps visibles subsistent en mangeant des animaux qui leur ressemblent, si bien que les corps changent. Ce qui change dépérira et périra ; dès lors, cela perd tout espoir de vivre, car c’est un corps animal. Ainsi, de même que les corps des animaux périssent, de même ces formes corporelles périront. Elles proviennent de l’union sexuelle, tout comme celles des animaux, n’est-ce pas ? Si elles proviennent, elles aussi, de l’union sexuelle, comment engendreraient-elles quelque chose de différent des animaux ? Par conséquent, vous resterez des enfants jusqu’à ce que vous parveniez à maturité. »


    Thomas répondit : « Je te le dis donc, Seigneur : ceux qui parlent des réalités invisibles et difficiles à interpréter ressemblent à des gens qui, la nuit, tirent des flèches sur une cible. Ils tirent certes leurs flèches comme tous les autres archers, puisqu’ils visent la cible, mais celle-ci ne peut être vue. Cependant, lorsque la lumière paraîtra et voilera les ténèbres, l’œuvre de chacun apparaîtra alors. Ô Seigneur, notre lumière, éclaire-nous ! »


    Jésus dit : « La nature de la lumière est lumière. »


    Thomas dit : « Seigneur, pourquoi cette lumière visible, qui brille pour les êtres humains, se lève-t-elle et se couche-t-elle ? »


    Le Sauveur répondit : « Ô bienheureux Thomas, cette lumière visible brille pour vous, non afin que vous demeuriez ici, mais afin que vous puissiez partir. Et lorsque tous les élus auront abandonné la condition animale, cette lumière remontera vers son essence et elle accueillera [la lumière], car elle est une bonne servante.[c] »'
