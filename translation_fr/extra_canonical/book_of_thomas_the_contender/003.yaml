lexical_decisions:
- source_word: concealed things / invisible things
  choice: réalités cachées / réalités invisibles
  rationale: « Réalités » rend naturellement le caractère substantivé de « things » sans réduire le propos à de simples objets matériels.
- source_word: do the truth / works of truth
  choice: mettre la vérité en pratique / accomplir les œuvres de vérité
  rationale: La première tournure évite un calque obscur, tandis que la seconde conserve la formulation technique du témoin.
- source_word: Fullness
  choice: Plénitude
  rationale: Conserve le terme cosmologique spécialisé sans lui imposer une explication doctrinale dans le corps du texte.
- source_word: workers
  choice: ouvriers
  rationale: Maintient la métaphore de personnes qui accomplissent une œuvre, ainsi que son lien verbal avec les « œuvres de vérité ».
- source_word: animal body / animal state
  choice: corps animal / condition animale
  rationale: Préserve la répétition conceptuelle tout en distinguant naturellement le corps concret de l’état ou de la condition abandonnée.
- source_word: intercourse
  choice: union sexuelle
  rationale: Expression moderne, digne et explicite, appropriée au contraste établi avec la génération animale.
- source_word: essence
  choice: essence
  rationale: Conserve l’abstraction métaphysique du témoin sans la paraphraser comme un lieu ou une origine matérielle.
theological_decisions:
- issue: Sens cosmologique de « Plénitude »
  choice: Conserver « Plénitude » avec une majuscule et une note minimale
  alternative: Paraphraser par « totalité divine » ou employer le terme technique « Plérôme »
  rationale: La traduction retenue préserve le lexème du témoin sans identifier explicitement la notion à un système doctrinal particulier.
- issue: Opposition entre le corporel animal et l’invisible
  choice: Conserver le contraste et ses formulations abruptes
  alternative: L’atténuer ou l’harmoniser avec une anthropologie confessionnelle ultérieure
  rationale: Le passage présente une tension théologique propre au document ; elle ne doit pas être résolue silencieusement.
- issue: Référents pronominaux dans la dernière phrase
  choice: Maintenir « cette lumière », « son essence » et le complément restauré « [la lumière] »
  alternative: Identifier explicitement chaque lumière à une réalité divine ou cosmique déterminée
  rationale: Le témoin est ambigu et peut même refléter une difficulté textuelle ; une identification précise irait au-delà des données fournies.
