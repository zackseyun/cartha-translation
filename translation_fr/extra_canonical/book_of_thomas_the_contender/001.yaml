  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: fr
  text: '[] Les paroles secrètes que le Sauveur adressa à Judas Thomas et que moi — oui, moi, Mathaias — j’ai mises par écrit tandis que je marchais et les écoutais parler ensemble.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: secret sayings
  choice: paroles secrètes
  rationale: Rend directement le témoignage anglais disponible, dans un registre digne et naturel, sans préciser davantage la nature de ces paroles.
- source_word: Savior
  choice: Sauveur
  rationale: Équivalent traditionnel et transparent du titre transmis par le témoin.
- source_word: Judas Thomas
  choice: Judas Thomas
  rationale: Conserve les deux éléments du nom tels qu’ils figurent dans le témoin, sans harmonisation.
- source_word: Mathaias
  choice: Mathaias
  rationale: Conserve la forme propre au témoin fourni plutôt que de la normaliser en Matthias ou Matthieu.
- source_word: wrote down
  choice: j’ai mises par écrit
  rationale: Expression française naturelle qui souligne la consignation des paroles.
- source_word: while I was walking
  choice: tandis que je marchais
  rationale: Préserve la circonstance temporelle explicite sans ajouter de destination ni de contexte.
- source_word: listening to them speak with one another
  choice: les écoutais parler ensemble
  rationale: Conserve l’idée d’un échange entre le Sauveur et Judas Thomas en français fluide.
theological_decisions:
- issue: Désignation de Jésus
  choice: le Sauveur
  alternative: Jésus / le Seigneur
  rationale: Le témoin porte le titre « Savior »; le remplacer par un nom ou un autre titre introduirait une interprétation absente du texte fourni.
- issue: Caractère secret des paroles
  choice: paroles secrètes
  alternative: paroles cachées / enseignements secrets
  rationale: La formulation choisie préserve la qualification du témoin sans transformer les « paroles » en un genre doctrinal plus précis.
- issue: Identité de Judas Thomas
  choice: Judas Thomas
  alternative: Judas, appelé Thomas / Judas le Jumeau
  rationale: Aucune expansion étymologique ou identification supplémentaire n’est ajoutée en l’absence d’un examen direct du copte.
translation_notes:
  register: Français international moderne, sobre et littéraire. Traduction provisoire fondée sur le témoin anglais public fourni; l’examen direct du texte copte du codex de Nag Hammadi II,7 reste à effectuer. Les crochets initiaux « [] » sont conservés comme dans le témoin, probablement pour signaler une lacune ou un élément éditorial non précisé.
