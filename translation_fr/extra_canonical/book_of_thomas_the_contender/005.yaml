translation:
  language: fr
  text: 'Thomas répondit : « Que pouvons-nous dire après cela ? Que pouvons-nous dire aux aveugles ? Quel enseignement devons-nous transmettre à ces malheureux mortels qui disent : “Nous sommes venus ici pour [faire] le bien et non pour maudire”, et qui pourtant [disent] : “Si nous n’avions pas été engendrés dans la chair, nous n’aurions jamais connu [le péché]” ? »[a]


    Le Sauveur dit : « En vérité, pour ce qui est de [ceux-là], ne les considérez pas comme des êtres humains, mais comme [des] animaux. En effet, de même que les animaux se dévorent les uns les autres, ces gens-là se dévorent eux aussi les uns les autres. C’est tout le contraire : par leur amour, ce feu doux, ils ont perdu [le Royaume] ; ils sont devenus esclaves de la mort et se précipitent pour accomplir des œuvres de corruption. Ils s’adonnent aux désirs de leurs ancêtres. Ils seront précipités dans l’abîme pour subir le tourment du mal amer qui appartient à leur nature. Ils seront fouettés, ce qui les fera courir à reculons vers un lieu qu’ils ne peuvent voir, et ils [seront séparés] de leurs membres. Ils ne le supporteront pas avec courage, mais [dans] le désespoir. Et ils se réjouissent parce que […] folie et déraison […] [Ils] poursuivent cette déraison sans reconnaître [leur folie, croyant] qu’ils [sont] sages. [Ils…] leur corps […] […] Leur esprit est tourné vers lui-même, car
    leur pensée est absorbée par leurs actes ; mais le feu les brûlera. »


    Thomas répondit : « Seigneur, que fera celui qui est précipité parmi eux ? Je suis très inquiet à leur sujet, car beaucoup les attaquent. »[b]


    Le Sauveur répondit : « Et toi, qu’en penses-tu ? »


    Judas, appelé Thomas, dit : « Seigneur, il est juste que tu parles et que j’écoute. »


    Le Sauveur répondit : « Prête attention à ce que je vais te dire et crois ce qui est vrai. Ce qui sème et ce qui est semé disparaîtront dans le feu, dans le feu et dans l’eau, et ils se couvriront de tombes obscures. Après un long temps, ils manifesteront le fruit d’arbres mauvais : ils seront réprouvés et tués dans la gueule des animaux et dans la bouche des humains, poussés par les pluies, les vents, l’air et la lumière qui brille d’en haut. »[c]


    Thomas répondit : « Sans aucun doute, tu nous as convaincus, Seigneur. Nous le savons dans notre cœur ; il est clair qu’il [en est ainsi] et que ta parole suffit. Pourtant, les paroles que tu nous adresses paraissent ridicules et odieuses au monde, parce qu’elles sont mal interprétées. Comment donc pouvons-nous aller les proclamer, puisque nous ne sommes [pas] respectés [dans] le monde ? »


    Le Sauveur répondit : « En vérité, je vous le dis : quiconque entend [votre] parole et la rejette, s’en moque ou rit de ces choses — en vérité, je vous le dis — sera livré au souverain d’en haut, qui règne en roi sur toute puissance. Celui-ci le fera tournoyer, puis le précipitera du ciel dans l’abîme, et il sera enfermé dans un lieu étroit et obscur. De plus, il ne pourra ni se retourner ni bouger, à cause de la profondeur immense du Tartare[d] et de la [pesante amertume] de l’Hadès[e], qui ne fléchit pas. […] eux à cela […] ils ne pardonneront pas […] vous pourchasser. Ils livreront […] à […] l’ange Tartarouchos[f] […] le feu les poursuivant. […] […] des fouets de feu qui projettent une pluie d’étincelles au visage de celui qui est pourchassé.


    S’il court vers l’ouest, il rencontrera le feu.


    S’il court vers le sud, il le rencontrera là aussi.


    S’il se tourne vers le nord, le péril du feu bouillonnant se dressera de nouveau devant lui.


    Il ne trouvera pas non plus de chemin vers l’est pour s’y enfuir et être sauvé.


    Parce qu’il ne l’a pas trouvé au temps où il demeurait dans le corps, il ne le trouvera pas au jour du jugement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les crochets indiquent des mots restitués ou incertains dans le témoin utilisé ; les points de suspension entre crochets signalent des lacunes du manuscrit.
    reason: Avertir le lecteur que certains éléments ne sont pas pleinement conservés et distinguer traduction et reconstruction.
  - marker: b
    text: La formulation « celui qui est précipité parmi eux » et les pronoms qui suivent sont obscurs dans le témoin ; leur référent demeure incertain.
    reason: Préserver une difficulté textuelle réelle sans proposer artificiellement un antécédent certain.
  - marker: c
    text: Les images de ce passage et leurs rapports syntaxiques sont difficiles à déterminer ; la traduction suit au plus près le témoin anglais fourni.
    reason: Signaler une obscurité importante dans un passage dont la vérification directe sur le copte reste à faire.
  - marker: d
    text: Le Tartare est ici le nom d’un abîme ou lieu de châtiment ; le terme est conservé distinct de l’Hadès.
    reason: Éviter de fondre deux termes anciens différents dans le seul mot « enfer ».
  - marker: e
    text: L’Hadès désigne le monde ou séjour des morts dans le vocabulaire grec transmis par le texte.
    reason: Donner au lecteur le sens général du terme sans imposer une équivalence confessionnelle.
  - marker: f
    text: Tartarouchos est un nom ou titre rare associé au Tartare, probablement celui d’un ange qui y exerce une fonction ; le contexte est lacunaire.
    reason: Éclairer le terme translittéré tout en gardant l’incertitude créée par l’état du manuscrit.
lexical_decisions:
- source_word: Savior
  choice: le Sauveur
  rationale: Titre traditionnel, clair et digne, correspondant directement au témoin fourni.
- source_word: deeds of decay
  choice: œuvres de corruption
  rationale: « Corruption » conserve à la fois l’idée de décomposition et celle de déchéance morale, sans réduire l’expression à un seul sens.
- source_word: sweet fire
  choice: ce feu doux
  rationale: Maintient l’image paradoxale du témoin plutôt que de l’expliquer ou de l’harmoniser.
- source_word: Tartaros
  choice: le Tartare
  rationale: Forme française établie du nom du lieu infernal gréco-romain, distincte de l’Hadès.
- source_word: Hades
  choice: l’Hadès
  rationale: Translittération française qui préserve le référent ancien sans l’assimiler automatiquement à « l’enfer ».
- source_word: Tartarouchos
  choice: Tartarouchos
  rationale: Conserve le nom ou titre rare sous forme translittérée, vu l’incertitude du passage endommagé.
- source_word: day of judgment
  choice: jour du jugement
  rationale: Expression naturelle et formellement proche, sans ajout doctrinal.
theological_decisions:
- issue: Rapport entre l’amour et le « feu doux »
  choice: « par leur amour, ce feu doux »
  alternative: « par amour du feu doux »
  rationale: La syntaxe du témoin permet plusieurs rapports entre les termes. La formulation retenue préserve l’apposition possible et donc l’ambiguïté théologique.
- issue: Nature du mal qui leur appartient
  choice: « le mal amer qui appartient à leur nature »
  alternative: « l’amère perversité de leur nature »
  rationale: Évite d’affirmer plus nettement que le mal constitue leur essence, tout en conservant le lien explicite avec leur nature dans le témoin.
- issue: « Ce qui sème et ce qui est semé »
  choice: conservation de la paire littérale
  alternative: interprétation comme semeur et semence, corps et descendance, ou principe générateur
  rationale: Le passage est théologiquement et métaphoriquement obscur ; aucune identification doctrinale n’est imposée.
- issue: Référent de « il ne l’a pas trouvé »
  choice: pronom non explicité
  alternative: « il n’a pas trouvé le chemin du salut »
  rationale: Le référent n’est pas exprimé dans le témoin ; l’expliciter résoudrait indûment l’ambiguïté.
- issue: Le souverain d’en haut
  choice: « le souverain d’en haut »
  alternative: identification à Dieu, à un ange ou à une puissance hostile
  rationale: La traduction conserve le titre sans identifier doctrinalement la figure.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les répétitions, les images abruptes, les tensions théologiques et les changements de pronom présents dans le témoin ont été conservés autant que possible. Cette version demeure provisoire : elle repose sur le témoin anglais public fourni, car la révision directe du copte du Codex II,7 de Nag Hammadi est encore en attente.'
