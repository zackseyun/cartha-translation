base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: fr
  text: 'Le Sauveur dit : « Frère Thomas, écoute-moi tant qu’il te reste du temps en ce monde, et je te révélerai les choses sur lesquelles tu t’es interrogé intérieurement.


    « Puisqu’il a été dit que tu es mon jumeau et mon véritable ami, examine-toi toi-même et découvre qui tu es, de quelle manière tu existes et comment tu seras à l’avenir. Puisque tu seras appelé “mon frère”, il ne convient pas que tu restes dans l’ignorance de toi-même. Pourtant, je sais que tu t’es compris toi-même, car tu as déjà compris que je suis la véritable connaissance. Ainsi, même si tu ne comprends pas, du fait que tu es en accord avec moi[a], tu es déjà parvenu à la connaissance et tu seras appelé “celui qui se connaît lui-même”. En effet, celui qui ne se connaît pas lui-même ne sait rien ; mais celui qui se connaît lui-même a, par là même, déjà acquis une connaissance profonde de toutes choses. Par conséquent, mon frère Thomas, tu as contemplé ce qui est caché aux êtres humains, à savoir ce sur quoi ils trébuchent dans l’ignorance d’eux-mêmes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte ici un appel de note (« 1 »), mais le contenu de cette note n’a pas été fourni. La formulation « tu es en accord avec moi » demeure provisoire dans l’attente d’un examen direct du copte.
    reason: Signaler à la fois l’appel de note non documenté et l’incertitude due à l’absence de vérification dans la langue source.
lexical_decisions:
- source_word: Savior
  choice: Sauveur
  rationale: Titre traditionnel, clair et direct, correspondant au témoin fourni.
- source_word: heed me
  choice: écoute-moi
  rationale: Expression naturelle en français moderne qui conserve l’idée d’une écoute attentive.
- source_word: study yourself
  choice: examine-toi toi-même
  rationale: Rend l’appel à l’examen personnel sans introduire un vocabulaire psychologique moderne.
- source_word: the mode in which you are
  choice: de quelle manière tu existes
  rationale: Conserve la formulation ontologique inhabituelle tout en la rendant intelligible en français.
- source_word: true knowledge
  choice: la véritable connaissance
  rationale: Préserve l’identification forte du Sauveur avec la connaissance, sans la paraphraser.
- source_word: self-knowledge
  choice: se connaître soi-même
  rationale: Formulation française naturelle qui maintient le thème central de la connaissance de soi.
- source_word: what is veiled to humans
  choice: ce qui est caché aux êtres humains
  rationale: Rend le sens du témoin avec un langage inclusif et courant, sans surinterpréter l’image.
theological_decisions:
- issue: Identification du Sauveur à la « véritable connaissance »
  choice: « je suis la véritable connaissance »
  alternative: « je possède la véritable connaissance »
  rationale: Le témoin formule une identification directe ; la traduction conserve cette affirmation théologiquement marquée au lieu de l’atténuer.
- issue: Tension entre incompréhension et connaissance déjà atteinte
  choice: Conserver « même si tu ne comprends pas » puis « tu es déjà parvenu à la connaissance »
  alternative: Harmoniser en parlant d’une compréhension partielle
  rationale: La tension du passage est authentique dans le témoin et ne doit pas être résolue silencieusement.
- issue: Portée de la connaissance de soi
  choice: « une connaissance profonde de toutes choses »
  alternative: « une compréhension générale de soi et du monde »
  rationale: La formulation absolue du témoin est maintenue sans réduction rationalisante.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition autour de « se connaître soi-même » est volontaire, car elle structure l’argument. Les parenthèses explicatives du témoin ont été intégrées avec prudence dans une syntaxe française naturelle. Projet provisoire fondé sur un témoin anglais du domaine public ; révision directe du copte encore nécessaire.
