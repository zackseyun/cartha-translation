review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit globalement le témoin anglais fourni et conserve les lacunes entre crochets. Quelques formulations s’en écartent toutefois sans nécessité : « n’arrivera pas » affaiblit « will not come to pass » en « n’arrivera jamais » ; « [a] » transforme une lacune non marquée en appel de note ; « la terre morte » ajoute un qualificatif absent de la formulation parenthétique transmise. La séquence finale demeure justement fragmentaire.'
  naturalness: 'Le français est généralement naturel et soutenu. Des améliorations ponctuelles rendent le texte plus direct et idiomatique : « oubliés » plutôt que « dans l’oubli », « toute entière » pour le monde, « asservir les ennemis », et une syntaxe moins lourde dans l’allégorie de la vigne. « Il est impossible à éteindre » est correct, mais « il ne s’éteint pas » rend plus naturellement le prédicat sans le surinterpréter.'
  terminology: « Impies », « chair », « espérance », « enseignement » et « puissances de votre corps » conviennent. « Brûlure » est maintenu pour scorching. Les crochets sont conservés strictement comme signaux de restauration et de lacune ; aucune reconstruction n’est introduite.
  issues:
  - severity: medium
    issue: Appel de note « [a] » ajouté dans le corps du texte
    rationale: Le témoin porte « [] », une lacune manuscrite sans lettre ni contenu. Le rendre par « [a] » confond le signe textuel de lacune avec le repère de la note et modifie le balisage du passage.
  - severity: low
    issue: « n’arrivera pas » pour « will not come to pass »
    rationale: Le français est possible, mais « ne se réalisera pas » restitue mieux l’idée d’un événement espéré qui ne s’accomplira pas.
  - severity: low
    issue: « terre morte » à la conclusion de l’allégorie
    rationale: 'Le témoin dit « as (dead) as the soil » : les parenthèses signalent un élément textuellement particulier. « Semblables au sol » avec « (mortes) » préserve mieux ce signal sans qualifier le sol de « mort ».'
  - severity: low
    issue: Le repère b est placé après « tuez » alors que la lacune source est « [] » après ce mot
    rationale: Un appel de note alphabétique dans le texte ne doit pas remplacer le signe de lacune. La lacune doit rester visible comme « [] » ; la note peut être omise, puisqu’elle ne fournit aucune information supplémentaire indispensable.
