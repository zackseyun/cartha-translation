translation:
  language: fr
  text: 'Le Sauveur poursuivit : « Malheur à vous, impies, qui êtes sans espérance et attendez ce qui n’arrivera pas ! Malheur à vous qui placez votre espérance dans la chair, dans cette prison vouée à disparaître ! Jusqu’à quand resterez-vous dans l’oubli ? Jusqu’à quand supposerez-vous que les réalités impérissables périront elles aussi ? Votre espérance est attachée au monde, et votre dieu, c’est cette vie ! Vous vous détruisez vous-mêmes !


    Malheur à vous à cause du feu qui vous brûle intérieurement, car il est impossible à éteindre ! Malheur à vous à cause de la roue qui tourne dans vos esprits ! Malheur à vous qui êtes sous l’emprise de la brûlure qui demeure en vous : elle consumera visiblement votre chair, déchirera invisiblement vos âmes et vous préparera à rejoindre vos amis ! Malheur à vous, prisonniers, car vous êtes enchaînés dans des cavernes !


    « Vous vous moquez, vous ricanez d’un rire insensé ! Vous n’avez pas conscience de votre condamnation, vous ne réfléchissez pas à votre état, et [vous] n’avez pas compris que vous vivez dans les ténèbres et [la mort] ! Au contraire, vous êtes ivres de feu et [remplis] d’amertume. Votre esprit est devenu fou à cause de la [brûlure qui est en] vous, et le venin ainsi que les attaques de vos ennemis vous sont doux ! Pour vous, l’obscurité s’est levée comme la lumière, parce que vous avez livré votre liberté en échange de l’esclavage ! Vous avez noirci vos cœurs, abandonné vos pensées à la folie et rempli vos pensées de la fumée ardente qui est en vous ! Votre lumière [a été obscurcie] dans la nuée [de…], et les vêtements qui vous couvrent, vous […]. Et [vous] avez été capturés par une [espérance] vide. Et qui avez-[vous] cru ? Ne [comprenez-vous pas que] vous [tous] vivez parmi ceux qui […] vous comme si [vous…].


    [a] Vous vous êtes plongés dans l’eau des ténèbres ! Vous avez agi selon vos propres désirs ! Malheur à vous qui vivez dans l’erreur et négligez la lumière du soleil, qui juge le monde et pose sur lui son regard, lui qui encerclera toutes choses afin de réduire les ennemis en esclavage. Vous ne percevez pas non plus la lune, qui, de nuit comme de jour, pose son regard d’en haut et contemple les cadavres produits par vos massacres ! Malheur à vous qui aimez la proximité des femmes et les rapports impurs avec elles ! Malheur à vous qui êtes sous l’emprise des puissances de votre corps, car elles vous tourmenteront ! Malheur à vous qui êtes sous l’emprise des forces des démons mauvais ! Malheur à vous qui attirez vos membres par le feu !


    « Qui fera tomber sur vous une fraîche rosée pour éteindre la nuée de feu qui vous enveloppe avec la brûlure qui est en vous ? Qui fera briller le soleil sur vous pour dissiper les ténèbres qui sont en vous et cacher les ténèbres et l’eau impure ? Le soleil et la lune, avec l’air, le vent, la terre et l’eau, vous donneront un parfum agréable. Car si le soleil ne brille pas sur ces corps, ils se flétrissent et périssent, exactement comme les mauvaises herbes et l’herbe. Si le soleil brille sur eux, ils prennent le dessus et étouffent la vigne. Mais si la vigne prend le dessus, couvre de son ombre toutes les mauvaises herbes et les autres buissons qui poussent auprès d’elle, puis [s’étend] et grandit, elle recevra à elle seule la terre où elle pousse et dominera tout lieu qu’elle aura couvert de son ombre. Quand elle parviendra à maturité, elle dominera toute la terre et produira en abondance pour son maître. Elle lui plaira d’autant plus qu’il aura évité la lourde tâche d’arracher ces
    plantes. La vigne elle-même les aura éliminées en les étouffant ; elles seront mortes et devenues semblables à la terre morte. »


    Jésus poursuivit : « Malheur à vous, parce que vous n’avez pas accueilli l’enseignement, et ceux qui […] travailleront à proclamer […]. Et [vous] courez vers […] fera descendre [ceux-ci] […] de jour, vous les tuez [b] afin qu’ils puissent se relever de la mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit présente une lacune au début de cette phrase ; aucun mot manquant n’est reconstitué ici.
    reason: Signaler que l’absence indiquée dans le témoin correspond à un texte perdu et non à une ponctuation ordinaire.
  - marker: b
    text: Une lacune du manuscrit interrompt ici la phrase ; le lien exact entre « vous les tuez » et « afin qu’ils puissent se relever de la mort » demeure incertain.
    reason: Préserver l’incertitude textuelle et syntaxique du passage final sans proposer une reconstruction conjecturale.
lexical_decisions:
- source_word: godless
  choice: impies
  rationale: Terme français courant et digne qui conserve l’idée d’absence de piété sans ajouter une identité doctrinale particulière.
- source_word: flesh
  choice: chair
  rationale: Conserve le vocabulaire anthropologique et la tension du passage plutôt que de réduire le sens au seul « corps ».
- source_word: imperishable things
  choice: réalités impérissables
  rationale: « Réalités » fournit un support idiomatique en français tout en préservant la portée indéterminée de l’expression.
- source_word: scorching
  choice: brûlure
  rationale: Rend l’action et l’état intérieur évoqués par le témoin, sans préciser arbitrairement s’il s’agit d’un feu matériel ou métaphorique.
- source_word: gloom
  choice: ténèbres / obscurité
  rationale: Variation française selon le contexte pour éviter la lourdeur, tout en maintenant l’image de noirceur opposée à la lumière.
- source_word: bodily powers
  choice: puissances de votre corps
  rationale: Préserve le langage de puissances ou forces corporelles, potentiellement technique, sans l’interpréter comme de simples pulsions.
- source_word: teaching
  choice: enseignement
  rationale: Choix neutre et naturel qui ne transforme pas le passage en référence à une doctrine ecclésiale déterminée.
- source_word: rise from death
  choice: se relever de la mort
  rationale: Rend littéralement l’image de relèvement sans imposer une formulation dogmatique plus précise.
theological_decisions:
- issue: Rapport entre la chair, le corps et la prison périssable
  choice: Conserver « chair » et « prison » dans leur formulation forte
  alternative: Paraphraser comme une simple critique des désirs corporels
  rationale: Le passage présente une anthropologie tendue et peut-être technique ; la traduction ne doit ni l’atténuer ni l’harmoniser avec une théologie ultérieure.
- issue: Personnification cosmique du soleil et de la lune
  choice: Maintenir leurs actions de juger, regarder et contempler
  alternative: Les traiter explicitement comme de simples métaphores
  rationale: Le témoin laisse ouverte la fonction cosmologique de ces figures ; aucune explication doctrinale n’est ajoutée.
- issue: Rapports avec les femmes
  choice: Traduire directement la condamnation formulée par le texte
  alternative: Généraliser en condamnation universelle de toute sexualité
  rationale: La portée exacte du propos appartient à ce document et ne doit pas être étendue ou justifiée par la traduction.
- issue: Dernière proposition sur le relèvement d’entre les morts
  choice: Préserver la syntaxe paradoxale et fragmentaire
  alternative: Reconstruire un rapport causal ou martyrial explicite
  rationale: Les lacunes empêchent de déterminer sûrement qui tue qui et dans quel but ; la tension doit demeurer visible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les anaphores en « Malheur à vous » et les images abruptes ont été conservées. Les crochets et points de suspension signalent les restaurations ou lacunes transmises par le témoin anglais. Cette version reste provisoire, car elle repose sur le témoin anglais public fourni ; une vérification directe du copte du Codex II,7 est encore nécessaire.
