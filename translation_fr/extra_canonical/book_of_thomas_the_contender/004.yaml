review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire à partir du témoin anglais fourni (la vérification directe du copte reste en attente). La traduction conserve globalement les oppositions visibles/invisibles, la maturité et les lacunes, mais quelques détails du témoin ont été déplacés ou explicités : « in sight » ne signifie pas nécessairement « au grand jour », « (evil) » doit rester une qualification incertaine, les crochets vides doivent être préservés, et « digested » ne doit pas être affaibli en « dévorent ».'
  naturalness: Le français est globalement fluide, moderne et d’un registre sapientiel approprié. Les retouches proposées améliorent surtout la fidélité formelle tout en gardant une syntaxe lisible dans les passages fragmentaires et paradoxaux.
  terminology: « amour de la lumière », « désir », « maturité », « insensé », « réalités visibles », « enveloppe charnelle » et « reposé sur elle » sont des choix recevables. « Esprit (mauvais) » conserve la parenthèse de l’audit anglais, sans transformer une restauration incertaine en affirmation.
  issues:
  - severity: medium
    issue: Les crochets vides du témoin ont été remplacés par des points de suspension.
    rationale: Le témoin distingue [] de [. . .]. Cette distinction éditoriale doit être maintenue dans les deux occurrences afin de ne pas modifier l’état textuel transmis.
  - severity: medium
    issue: « in secret and in sight » est rendu par « en secret et au grand jour ».
    rationale: « Au grand jour » ajoute une nuance d’exposition publique/diurne. « En secret et au vu de tous » restitue plus directement l’opposition transmise.
  - severity: medium
    issue: « any (evil) spirit » est traduit « tout esprit mauvais ».
    rationale: 'La parenthèse du témoin indique que « evil » est incertain ou éditorialement qualifié. Le français doit conserver cette réserve : « tout esprit (mauvais) ».'
  - severity: medium
    issue: « are digested » est rendu par « dévorent ».
    rationale: Être dévoré n’est pas identique à être digéré. Même si l’image est rude, « digèrent » préserve la formulation du témoin.
  - severity: low
    issue: « bodies » est rendu au singulier par « le corps ».
    rationale: Le pluriel « les corps et la moelle des êtres humains » suit plus exactement le témoin sans nuire au français.
