lexical_decisions:
- source_word: love of the light
  choice: amour de la lumière
  rationale: 'Conserve le génitif ambigu : il peut s’agir de l’amour éprouvé pour la lumière ou d’un amour qui lui appartient.'
- source_word: lust
  choice: désir
  rationale: « Désir » reste naturel et assez large pour couvrir la convoitise ardente ou sexuelle suggérée par le contexte, sans ajouter une qualification absente.
- source_word: mature
  choice: parvenu à maturité / personnes parvenues à maturité
  rationale: Rend la notion d’accomplissement ou de perfection spirituelle sans adopter le terme potentiellement confessionnel « parfaits ».
- source_word: Ignoramus
  choice: Ignorant
  rationale: Conserve la fonction de surnom dépréciatif tout en restant immédiatement compréhensible en français.
- source_word: fool
  choice: insensé
  rationale: Terme sapientiel français courant qui s’oppose naturellement au sage et ne réduit pas le propos à une déficience intellectuelle.
- source_word: visible things
  choice: réalités visibles
  rationale: Évite la répétition lourde de « choses visibles » et préserve l’opposition conceptuelle entre visible et invisible.
- source_word: fleshly vessel
  choice: enveloppe charnelle
  rationale: Expression française naturelle qui maintient l’image du corps comme contenant, sans préciser davantage son statut anthropologique.
- source_word: reposed on it
  choice: s’est reposé sur elle
  rationale: Maintient l’image inhabituelle d’un repos fondé sur la vérité plutôt que de la paraphraser comme simple confiance.
theological_decisions:
- issue: Portée de la condamnation du désir
  choice: Conserver « désir » et les images corporelles du passage
  alternative: Expliciter une condamnation générale de la sexualité
  rationale: Le texte associe le feu à des gestes entre hommes et femmes, mais ses lacunes ne permettent pas de définir avec certitude toute la portée de son ascétisme.
- issue: Maturité et sagesse
  choice: Employer le vocabulaire de la maturité
  alternative: Traduire par « perfection » et « parfaits »
  rationale: La formulation retenue préserve l’idée de progression spirituelle sans importer une doctrine particulière de la perfection.
- issue: Destin post mortem et monde visible
  choice: Préserver les paradoxes et les enchaînements obscurs
  alternative: Harmoniser le passage selon un système cosmologique gnostique déterminé
  rationale: Le témoin est textuellement difficile et ne justifie pas l’imposition d’une reconstruction doctrinale précise.
- issue: « ancien amour pour la foi »
  choice: Traduire littéralement la formulation reçue
  alternative: Corriger « foi » en « chair », « feu » ou « monde visible »
  rationale: La leçon transmise est surprenante, mais faute de vérification directe du copte, une correction conjecturale serait prématurée.
