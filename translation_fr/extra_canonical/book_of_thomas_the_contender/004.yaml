translation:
  language: fr
  text: 'Puis le Sauveur poursuivit :


    « Ô amour insondable de la lumière ! Ô amertume du feu qui brûle dans le corps et la moelle des êtres humains, qui s’embrase en eux nuit et jour, consume leurs membres, [enivre] leur intelligence et rend leur âme folle ! […] en eux, chez les hommes comme chez les femmes […] la nuit, et ils font des mouvements […] en secret et au grand jour, car les hommes [font des mouvements […] sur les femmes], et les femmes sur [les hommes].[a] [C’est pourquoi il est] […] dit : “Tous ceux qui cherchent la vérité en puisant à la vraie sagesse se feront pousser des ailes pour s’envoler : ils échapperont au désir qui consume l’esprit humain et se feront pousser des ailes pour échapper à tout esprit mauvais qu’ils aperçoivent.” »


    Thomas répondit :


    « Seigneur, c’est précisément à ce sujet que je t’interroge, car j’ai compris que, comme tu le dis, tu es notre bienfaiteur. »


    Le Sauveur répondit encore :


    « Voilà pourquoi nous devons te parler, car cet enseignement est destiné aux personnes parvenues à maturité. Si tu veux maintenant parvenir à maturité, tu accompliras ces choses. Sinon, ton nom sera “Ignorant”, car l’être intelligent ne peut vivre avec l’insensé : celui qui est intelligent est parvenu à maturité dans toute sagesse. En effet, le sage sera nourri par la vérité et “sera comme un arbre qui pousse au bord du cours d’eau sinueux” (Psaume 1.3). Mais pour l’insensé, le bien et le mal se valent. Bien que certains aient des ailes, ils courent néanmoins vers les réalités visibles, éloignées de la vérité. C’est que le feu qui les guide leur donne une illusion de vérité ; il les éclaire d’une beauté [périssable], les enferme dans une douce obscurité et les ensorcelle par des plaisirs parfumés.


    « Il les aveuglera par un désir impossible à éteindre, consumera leur âme et deviendra pour eux comme un pieu enfoncé dans leur cœur, qu’ils ne pourront jamais arracher. Il les mène où il veut, comme fait un mors dans la bouche. Par l’amertume de la captivité — le désir des réalités visibles, qui, sous l’effet d’une impulsion, dégénèrent, changent et dévient —, il les a liés de ses chaînes et a entravé chacun de leurs membres. Ils sont sans cesse entraînés vers le bas. Lorsqu’ils sont tués, tous les animaux du domaine périssable les dévorent. »


    Thomas répondit :


    « C’est clair, comme il a été dit : [“Nombreux sont […] ceux qui ne connaissent pas] […] l’âme.” »


    Et [le Sauveur] répondit :


    « [Heureux] le sage qui [a cherché la vérité et], après l’avoir trouvée, […] s’est reposé sur elle pour toujours, sans craindre ceux qui cherchaient à le troubler. »


    Thomas répondit :


    « Est-il bon pour nous, Seigneur, de nous reposer parmi ce qui nous appartient ? »


    Le Sauveur dit :


    « Oui, cela est utile et bon pour vous, car les réalités visibles parmi les êtres humains disparaîtront. En effet, leur enveloppe charnelle disparaîtra et, lorsqu’elle sera réduite à rien, elle en viendra à exister parmi les réalités visibles, parmi les choses que l’on peut voir.[b] Alors, le feu qu’ils voient les fera souffrir à cause de leur ancien amour pour la foi. Ils seront rassemblés de nouveau avec ce qui est visible. En outre, ceux qui sont capables de voir parmi les réalités invisibles, mais ne possèdent pas le plus grand amour, périront, absorbés par les soucis de cette vie et par l’ardeur du feu. Encore un peu de temps, et ce qui est visible disparaîtra. Alors surgiront des ombres sans forme ; parmi les tombeaux, elles s’attarderont pour toujours auprès des cadavres, dans la souffrance, tandis que leur âme se décomposera. »


    [a] Les crochets et les points de suspension signalent les lacunes du manuscrit ou des restitutions proposées ; la syntaxe de ce passage est fortement fragmentaire.


    [b] Le raisonnement de cette phrase paraît paradoxal et son texte est incertain : la traduction conserve l’enchaînement transmis sans chercher à le résoudre.'
