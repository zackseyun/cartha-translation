base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: fr
  text: Car je vis tous les anges du châtiment qui séjournaient là[b] et préparaient tous les instruments de Satan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La transcription guèze fournie s’interrompt après «et préparaient». La suite «tous les instruments de Satan» est rétablie d’après la forme complète signalée dans les éditions critiques : ኵሎ ንዋየ ሰይጣን.'
    reason: textual_variant
  - marker: b
    text: Ou «demeuraient là». Le verbe guèze évoque le fait de rester ou de séjourner dans un lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Conserve la valeur explicative du connecteur par rapport à ce qui précède, dans un français naturel et soutenu.
- source_word: ርኢክዎሙ
  choice: je vis
  rationale: Rend directement le compte rendu visionnaire à la première personne; le pronom objet est explicité par le groupe nominal qui suit.
- source_word: ኵሎሙ
  choice: tous
  rationale: Préserve la portée exhaustive du terme appliqué aux anges.
- source_word: መላእክተ መቅሠፍት
  choice: les anges du châtiment
  rationale: Exprime le rapport de ces anges au jugement punitif, sans préciser au-delà du génitif éthiopien s'ils infligent ou administrent ce châtiment.
- source_word: እንዘ የኃድሩ
  choice: qui séjournaient là
  rationale: Rend l'idée de rester ou de demeurer en un lieu, avec une formulation française naturelle qui n'implique pas nécessairement une résidence permanente.
- source_word: ወያስተዴ
  choice: et préparaient
  rationale: Reproduit l'idée générale de mise en état ou de préparation tout en respectant l'incertitude de la transcription fournie.
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: tous les instruments de Satan
  rationale: Suit la forme complète signalée par les données de révision critique; «instruments» conserve un sens assez large pour des objets ou moyens destinés au jugement.
theological_decisions:
- issue: Le complément de «préparaient» manque dans la ligne guèze transcrite fournie.
  choice: Inclure «tous les instruments de Satan» dans le texte principal, avec une note de transparence textuelle.
  alternative: S'arrêter à «et préparaient», sans complément.
  rationale: La transcription affichée paraît tronquée, tandis que les données de révision attestent dans le texte complet ኵሎ ንዋየ ሰይጣን. La restitution est donc retenue, mais son statut est clairement signalé.
- issue: Nature du rapport exprimé par «de Satan».
  choice: Conserver la formulation génitive «instruments de Satan».
  alternative: Expliciter «instruments appartenant à Satan» ou «instruments destinés au jugement de Satan».
  rationale: Le génitif peut exprimer plusieurs rapports. La traduction française préserve cette ambiguïté et évite de trancher une question théologique que la formulation source ne résout pas à elle seule.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait traduit naturellement les actions en cours observées dans la vision. «Châtiment» maintient la tonalité judiciaire et apocalyptique sans archaïsme excessif.
