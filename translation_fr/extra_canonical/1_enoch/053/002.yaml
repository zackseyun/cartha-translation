base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: fr
  text: Leurs mains commettent des actes iniques[a], et les pécheurs dévorent tous ceux qui favorisent leurs actes iniques. Les pécheurs seront détruits loin de la présence du Seigneur des esprits; ils seront déracinés de la surface de sa terre[b] et ne subsisteront plus jamais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien de cette première phrase est difficile. Une autre analyse comprend une image de chaînes : « Mes chaînes seront pour leurs mains afin qu’elles en fassent des entraves; et tous ceux qui les désirent — les pécheurs — les mangeront. »'
    reason: lexical_alternative
  - marker: b
    text: La forme transcrite dans cette édition semble fautive; la lecture probable signifie « ils seront déracinés ». On pourrait aussi rendre le sens général par « ils seront bannis » ou « retranchés ».
    reason: textual_variant
  - marker: c
    text: 'Littéralement, selon la lecture négative probable : « et ils ne demeureront pas pour les siècles des siècles ». La présence de la négation est toutefois incertaine dans le témoin transcrit; une autre traduction est : « ils périront pour toujours et à jamais ».'
    reason: textual_variant
lexical_decisions:
- source_word: ጌጋየ … ይገብሩ
  choice: commettent des actes iniques
  rationale: Le passage est difficile, mais le nom peut désigner la faute ou l’iniquité, et le verbe signifie « faire, commettre ». Cette formulation française conserve la valeur morale sans introduire l’image incertaine de chaînes.
- source_word: እደዊሆሙ
  choice: leurs mains
  rationale: Traduction directe du nom désignant les mains, avec son suffixe possessif pluriel; l’image concrète de la responsabilité humaine est maintenue.
- source_word: ዘይጻምዉ ለጌጋይ
  choice: tous ceux qui favorisent leurs actes iniques
  rationale: La syntaxe et la lecture du groupe sont incertaines. « Favorisent » suit la compréhension contextuelle retenue par la couche de consultation tout en signalant en note l’autre analyse possible.
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Désignation morale habituelle dans les scènes de jugement d’Hénoch.
- source_word: ይበልዑ
  choice: dévorent
  rationale: Le verbe signifie littéralement « manger ». « Dévorent » conserve la violence et l’étrangeté de l’image apocalyptique.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  choice: loin de la présence du Seigneur des esprits
  rationale: Rend naturellement en français la formule d’expulsion hors de la présence divine, tout en conservant le titre caractéristique « Seigneur des esprits ».
- source_word: ይትነቀሉ (lecture probable derrière ይትቀወሙ)
  choice: seront déracinés
  rationale: La lecture probable du témoin derrière la transcription fautive est le verbe « déraciner ». Cette image convient aussi à l’expulsion de la terre.
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  choice: et ne subsisteront plus jamais
  rationale: Cette traduction respecte la négation transmise avec incertitude et exprime la permanence de l’exclusion sans définir la nature métaphysique du jugement.
theological_decisions:
- issue: Nature du jugement final
  choice: Une exclusion définitive exprimée par « ne subsisteront plus jamais »
  alternative: « périront pour toujours et à jamais »
  rationale: Le texte affirme clairement le caractère irréversible du jugement, mais sa formulation et la négation sont incertaines. La traduction évite donc de trancher entre disparition, destruction et exclusion permanente.
- issue: Sens de la première moitié du verset
  choice: Des actes iniques commis et favorisés
  alternative: Des chaînes destinées aux mains, que les pécheurs désirent puis mangent
  rationale: La première lecture donne une suite syntaxique plus cohérente avec les formes transmises et la consultation auditée, mais l’autre analyse lexicale est assez ancienne et significative pour être conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée pour la clarté, tandis que les notes conservent les difficultés textuelles et l’imagerie alternative. Le titre « Seigneur des esprits » est maintenu de façon uniforme et sans interprétation confessionnelle.
