base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: fr
  text: Là, mes yeux virent une vallée dont les bouches étaient ouvertes et profondes[a]. Tous ceux qui habitent sur la terre ferme, sur la mer et dans les îles lui apporteront des dons, des offrandes et des présents[b] ; pourtant, cette profonde vallée ne se remplira pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction guèze décrivant les « bouches » de la vallée est difficile. On pourrait aussi comprendre : « une vallée ouverte et profonde quant à ses bouches ».'
    reason: textual_variant
  - marker: b
    text: Les trois mots traduits par « dons, offrandes et présents » ont ici des sens voisins et peuvent désigner un tribut apporté de toutes les régions du monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Là
  rationale: Adverbe locatif qui introduit la scène visionnaire et conserve sa valeur déictique.
- source_word: ርእያ አዕይንትየ
  choice: mes yeux virent
  rationale: Conserve l’expression oculaire explicite et son caractère visionnaire, plutôt que de la réduire à « je vis ».
- source_word: ቈላ
  choice: vallée
  rationale: Terme large et fidèle pour ce lieu encaissé de la topographie apocalyptique ; « ravin » ou « gorge » seraient plus interprétatifs.
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: dont les bouches étaient ouvertes et profondes
  rationale: Préserve l’image littérale des « bouches » et la coordination des adjectifs « ouvertes » et « profondes », malgré une construction guèze difficile.
- source_word: የኃድሩ
  choice: qui habitent
  rationale: Rend naturellement le verbe d’habitation dans un registre actuel et digne.
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: sur la terre ferme, sur la mer et dans les îles
  rationale: Maintient la triade géographique et le contraste entre la terre ferme et la mer ; les prépositions sont adaptées au français naturel.
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: des dons, des offrandes et des présents
  rationale: Conserve l’accumulation de trois noms proches sans les fondre en un terme unique.
- source_word: ይመጽኡ ሎቱ
  choice: lui apporteront
  rationale: Le verbe signifie littéralement « venir », mais la présence des objets énumérés donne contextuellement le sens de les apporter à la vallée.
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: pourtant, cette profonde vallée ne se remplira pas
  rationale: Conserve le futur simple et l’image inquiétante d’une vallée qui demeure impossible à combler.
theological_decisions:
- issue: Nature de ce que les habitants apportent à la vallée
  choice: Des biens concrets — dons, offrandes et présents — sont apportés à la vallée elle-même.
  alternative: Les habitants viennent simplement vers elle, ou les objets représentent métaphoriquement des actes d’hommage.
  rationale: Le guèze énumère trois substantifs concrets avant le verbe de mouvement. Cette lecture préserve l’image apocalyptique sans l’allégoriser ni préciser indûment la fonction exacte des biens.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « virent » maintient le ton narratif visionnaire ; l’image inhabituelle des « bouches » est conservée afin de ne pas effacer l’ambiguïté du texte source.
