base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: fr
  text: Et l’assemblée[a] des élus et des saints[b] sera semée, et tous les élus se tiendront devant lui en ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « communauté réunie ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner la communauté consacrée, mais, dans la littérature apocalyptique, elle peut aussi évoquer des êtres célestes saints.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ወይዘራእ
  choice: sera semée
  rationale: Le verbe est compris comme le passif de « semer ». Cette traduction conserve la métaphore végétale caractéristique d’Hénoch au lieu de la remplacer par l’idée d’apparition.
- source_word: ማኅበረ
  choice: l’assemblée
  rationale: Ce terme désigne un groupe réuni. « Assemblée » est naturel en français actuel et garde le sens collectif du mot guèze.
- source_word: ኅሩያን
  choice: les élus
  rationale: « Élus » rend directement ce terme important du vocabulaire hénochique, sans préciser le mécanisme ni la portée théologique de leur élection.
- source_word: ቅዱሳን
  choice: les êtres saints
  rationale: Cette formulation substantivée reste ouverte quant à l’identité humaine ou céleste des personnes ainsi désignées et évite le sens ecclésiastique plus étroit que pourrait suggérer « les saints ».
- source_word: ወይቀውሙ
  choice: se tiendront
  rationale: Rend le sens de se tenir debout ou de prendre place, adapté à la scène solennelle de comparution.
- source_word: በቅድሜሁ
  choice: devant lui
  rationale: Expression concise et naturelle de la présence devant la figure mentionnée dans le contexte.
- source_word: ኵሎሙ
  choice: tous
  rationale: Conserve explicitement l’universalité exprimée dans le texte.
- source_word: በይእቲ ዕለት
  choice: en ce jour-là
  rationale: Formule française naturelle qui préserve la portée apocalyptique du repère temporel.
theological_decisions:
- issue: Identité des ቅዱሳን
  choice: « êtres saints », sans limiter le référent
  alternative: « saints » pour les justes humains, ou « êtres saints » au sens d’êtres célestes
  rationale: L’association avec les élus favorise l’idée d’une communauté juste, mais le langage apocalyptique peut aussi désigner des êtres célestes. La traduction conserve cette ouverture.
- issue: Métaphore de l’assemblée semée
  choice: Conserver littéralement « sera semée »
  alternative: Expliciter par « sera implantée » ou remplacer par « apparaîtra »
  rationale: Le passif de « semer » est soutenu par la forme guèze et rejoint l’imagerie hénochique de la plantation juste. L’étrangeté poétique ne doit pas être supprimée.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le parallélisme du texte ainsi que l’image volontairement inhabituelle de l’assemblée « semée ». « En ce jour-là » maintient le ton apocalyptique sans archaïsme excessif.
