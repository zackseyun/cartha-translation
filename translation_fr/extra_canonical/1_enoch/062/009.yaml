base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: fr
  text: Tous les rois, les puissants, les personnages haut placés et ceux qui dominent la terre ferme[a] tomberont devant lui, face contre terre. Ils se prosterneront[b] et placeront leur espérance en ce Fils de l’homme ; ils lui adresseront leur requête et lui demanderont miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la terre sèche ». L’expression désigne ici le domaine terrestre sur lequel s’exerce leur pouvoir.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi signifier « rendre hommage » ou, dans un sens plus fort, « adorer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: tomberont
  rationale: Le verbe exprime la chute ou l’abaissement corporel. La précision « face contre terre » fait clairement ressortir ici la prosternation.
- source_word: ነገሥት
  choice: rois
  rationale: Le sens ordinaire est « rois » ; ce choix conserve le caractère politique concret de la scène.
- source_word: መዛዝእት
  choice: les puissants
  rationale: Le terme désigne des personnes détenant puissance ou autorité. « Les puissants » est naturel et suffisamment large.
- source_word: ልዑላን
  choice: les personnages haut placés
  rationale: L’expression désigne ceux qui occupent un rang élevé. Ce rendu moderne préserve l’idée de statut sans suggérer nécessairement la noblesse héréditaire.
- source_word: እለ ይመልከዋ ለየብስ
  choice: ceux qui dominent la terre ferme
  rationale: Le rendu conserve l’image concrète de la terre sèche ou ferme tout en exprimant l’exercice d’une domination terrestre.
- source_word: በቅድሜሁ በገጾሙ
  choice: devant lui, face contre terre
  rationale: Cette formulation française naturelle restitue à la fois la position devant lui et la posture physique de complète humiliation.
- source_word: ይሰግዱ
  choice: ils se prosterneront
  rationale: Le verbe peut exprimer la prosternation, l’hommage ou l’adoration. « Se prosterner » conserve le geste et laisse ouverte sa portée théologique.
- source_word: ይሴፈዉ
  choice: placeront leur espérance en
  rationale: Ce choix rend le mouvement de confiance dirigé vers le Fils de l’homme et convient au registre solennel du passage.
- source_word: ለዝኩ ወልደ እጓለ እመሕያው
  choice: ce Fils de l’homme
  rationale: Le démonstratif est maintenu, et la majuscule signale l’emploi local de l’expression comme titre apocalyptique reconnu dans les Paraboles.
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  choice: ils lui adresseront leur requête et lui demanderont miséricorde
  rationale: Les deux actes de demande restent perceptibles, tandis que la variation légère évite en français une répétition pesante et conserve la supplication solennelle.
theological_decisions:
- issue: La prosternation devant le Fils de l’homme doit-elle être explicitement qualifiée d’adoration ?
  choice: ils se prosterneront
  alternative: ils l’adoreront ; ils lui rendront hommage
  rationale: Le verbe guèze couvre un éventail allant de l’hommage à l’adoration. Le choix retenu préserve cette tension au lieu d’imposer une interprétation doctrinale.
- issue: Statut de l’expression désignant le Fils de l’homme
  choice: ce Fils de l’homme
  alternative: ce fils d’homme ; ce fils de la descendance des vivants
  rationale: Dans ce contexte énochien, l’expression fonctionne comme un titre apocalyptique. Le démonstratif et la valeur titulaire sont conservés sans importer une formulation christologique absente du verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe a été divisée en deux phrases pour la lisibilité, sans effacer l’enchaînement des gestes de soumission. Les images corporelles et le titre apocalyptique sont conservés.
