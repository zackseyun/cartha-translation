base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: fr
  text: En ce jour-là, tous les rois, les puissants, les grands et ceux qui possèdent la terre[a] se lèveront. Ils le verront et reconnaîtront qu’il siège sur le trône de sa gloire. La justice sera jugée devant lui[b], et aucune parole mensongère ne sera prononcée devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui tiennent la terre » ou « ceux qui dominent le pays / le monde ». Le verbe guèze peut exprimer le fait de tenir, de posséder ou d’exercer son autorité.
    reason: lexical_alternative
  - marker: b
    text: La proposition « La justice sera jugée devant lui » est difficile sur les plans textuel et syntaxique dans l’éthiopien. La traduction conserve la valeur judiciaire des mots au lieu de les remplacer par une tournure plus familière.
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  choice: se lèveront
  rationale: Le verbe exprime l’action de se lever ou de se tenir debout. « Se lèveront » conserve l’image corporelle et judiciaire sans y introduire explicitement l’idée de résurrection.
- source_word: በይእቲ ዕለት
  choice: En ce jour-là
  rationale: Formule temporelle apocalyptique naturelle en français, qui garde la résonance prophétique de l’expression.
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  choice: tous les rois, les puissants, les grands
  rationale: Cette série désigne plusieurs catégories de l’élite politique et sociale. « Les puissants » et « les grands » gardent la progression rhétorique sans fusionner les termes.
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: et ceux qui possèdent la terre
  rationale: Le verbe peut signifier tenir, posséder ou exercer son emprise. Cette formulation française reste naturelle tout en laissant ouverte la nuance de possession ou de domination.
- source_word: ወይሬእይዎ ወያአምርዎ
  choice: Ils le verront et reconnaîtront
  rationale: Le couple verbal associe perception et connaissance. « Reconnaîtront » suggère qu’ils discerneront et admettront qui il est, sans développer davantage le sens.
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: qu’il siège sur le trône de sa gloire
  rationale: « Siéger » rend naturellement l’image de l’intronisation et du tribunal, tandis que « le trône de sa gloire » suit de près la construction guèze.
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: La justice sera jugée devant lui
  rationale: La proposition est difficile, mais le nom signifie bien « justice » et le verbe paraît avoir une valeur judiciaire. La traduction conserve cette formulation tendue au lieu de la normaliser.
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: aucune parole mensongère ne sera prononcée devant lui
  rationale: La phrase exclut toute parole fausse ou trompeuse en sa présence. « Parole mensongère » garde le caractère solennel et judiciaire de l’énoncé.
theological_decisions:
- issue: Identité de la figure assise sur le trône
  choice: Conserver le pronom « il » sans donner de titre à la figure.
  alternative: Identifier explicitement cette figure au Fils de l’homme ou au Seigneur des Esprits à partir du contexte plus large.
  rationale: Le verset guèze emploie ici un pronom et ne répète aucun titre. La traduction préserve donc l’ambiguïté locale.
- issue: Portée de l’expression « ceux qui possèdent la terre »
  choice: Garder une expression large pouvant évoquer possession, contrôle ou domination.
  alternative: Préciser « les propriétaires fonciers » ou « ceux qui gouvernent le monde ».
  rationale: Le verbe guèze admet plusieurs nuances, et le contexte apocalyptique ne permet pas de réduire sûrement l’expression à une seule catégorie.
- issue: Sens de la proposition sur la justice
  choice: Conserver la formulation « La justice sera jugée devant lui ».
  alternative: Reformuler par « un juste jugement sera rendu devant lui » ou « la justice sera établie devant lui ».
  rationale: Ces reformulations rendraient la phrase plus familière, mais elles résoudraient une difficulté textuelle et syntaxique que le guèze laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme apocalyptique est conservé sans archaïsmes marqués. « Les grands » désigne ici des personnages de haut rang, et la répétition « justice sera jugée » est volontaire afin de préserver la difficulté du texte source.
