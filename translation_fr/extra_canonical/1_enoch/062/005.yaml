base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: fr
  text: Une moitié d’entre eux regardera l’autre moitié[a] ; ils seront terrifiés, leur visage s’abaissera, et la douleur les saisira lorsqu’ils verront ce Fils de l’homme[b] assis sur le trône de sa gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chacun regardera l’autre ». Le texte évoque littéralement une moitié d’entre eux regardant l’autre moitié.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « ce Fils de l’homme » est conservée ici comme titre apocalyptique propre aux Paraboles, sans lui imposer une formulation doctrinale ultérieure.
    reason: cross_reference
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: une moitié d’entre eux ... l’autre moitié
  rationale: La répétition du nom muni du suffixe pronominal évoque le plus naturellement deux moitiés ou deux groupes. Cette formulation conserve l’image concrète d’une assemblée divisée qui se regarde.
- source_word: ይሬእዩ
  choice: regardera / verront
  rationale: 'Le verbe courant de la vision reçoit une traduction adaptée à chacun de ses deux emplois : « regardera » avec l’autre moitié comme objet, puis « verront » devant la figure visionnaire.'
- source_word: ይደነግጹ
  choice: seront terrifiés
  rationale: Le contexte de jugement eschatologique appelle un terme plus intense que « alarmés » ou « troublés ».
- source_word: ይቴሕቱ ገጾሙ
  choice: leur visage s’abaissera
  rationale: Cette expression conserve le mouvement visible d’abaissement associé à la honte ou à l’effroi, tout en étant plus naturelle en français que le calque « leur visage tombera ».
- source_word: ይእኅዞሙ ሕማም
  choice: la douleur les saisira
  rationale: La construction présente la douleur ou la souffrance comme ce qui s’empare d’eux. « Douleur » garde une portée à la fois physique et affective sans préciser davantage.
- source_word: ወልደ ብእሲ
  choice: Fils de l’homme
  rationale: Dans les Paraboles, l’expression désigne une figure eschatologique distincte et fonctionne comme un titre. La majuscule rend cette force locale sans développer une interprétation doctrinale ultérieure.
- source_word: ይነብር
  choice: assis
  rationale: Le verbe peut signifier demeurer, rester ou siéger ; avec le trône, le sens d’être assis s’impose, tandis que le nom « trône » porte déjà l’idée d’intronisation.
- source_word: መንበረ ስብሐቲሁ
  choice: le trône de sa gloire
  rationale: Cette traduction préserve la construction génitivale et la formule apocalyptique ; « gloire » correspond directement au nom source sans le restreindre à la seule majesté.
theological_decisions:
- issue: Valeur titulaire ou générique de ወልደ ብእሲ
  choice: « ce Fils de l’homme », comme titre de la figure eschatologique du passage
  alternative: « ce fils d’homme » ou « cet être humain »
  rationale: Dans le contexte des Paraboles, l’expression identifie de façon répétée un agent eschatologique particulier. Le démonstratif « ce » conserve la présentation déictique de la vision, sans harmonisation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur simple maintient la tonalité visionnaire. « Leur visage » au singulier distributif est idiomatique en français ; « s’abaissera » préserve l’image de honte ou d’effroi sans employer le calque peu naturel « tombera ».
