base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: fr
  text: Et le Seigneur des esprits le fit asseoir sur le trône de sa gloire, et l’esprit de justice fut répandu sur lui[a]. La parole de sa bouche met à mort tous les pécheurs, et tous les rebelles sont anéantis devant sa face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte emploie ici un pronom masculin singulier (« lui »), sans nommer de nouveau son référent dans ce verset.
    reason: ambiguïté du référent
  - marker: b
    text: 'Littéralement, « de devant sa face » : expression de jugement évoquant leur disparition ou leur destruction en sa présence.'
    reason: idiome culturel
lexical_decisions:
- source_word: አንበረ
  choice: le fit asseoir
  rationale: La forme causative et transitive signifie « faire asseoir, installer ». Le pronom objet reprend naturellement la figure évoquée dans le contexte précédent, sans la nommer dans la traduction.
- source_word: እግዚእ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette formulation conserve le titre apocalyptique établi dans les Paraboles d’Hénoch et reste naturelle en français.
- source_word: መንበረ ስብሐቲሁ
  choice: le trône de sa gloire
  rationale: Le génitif est conservé afin de respecter l’image solennelle du texte plutôt que de la réduire à « son trône glorieux ».
- source_word: መንፈሰ ጽድቅ
  choice: l’esprit de justice
  rationale: Dans ce contexte de jugement, « justice » exprime naturellement en français la rectitude à la fois morale et judiciaire du terme guèze.
- source_word: ተክዕወ ዲቤሁ
  choice: fut répandu sur lui
  rationale: Le verbe véhicule l’image forte d’un esprit versé ou répandu; la traduction évite de l’aplatir en « reposa » ou « lui fut accordé ».
- source_word: ነገረ አፉሁ
  choice: la parole de sa bouche
  rationale: La traduction maintient l’image concrète et solennelle d’une parole qui procède de la bouche et accomplit le jugement.
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: met à mort tous les pécheurs
  rationale: L’imparfait guèze est rendu par un présent à valeur caractéristique ou prospective, tandis que « met à mort » conserve la force létale et judiciaire du verbe.
- source_word: ዐማፂያን
  choice: ceux qui se révoltent
  rationale: Le terme désigne des rebelles ou transgresseurs. Cette expression préserve l’idée d’opposition active sans la limiter à une rébellion politique.
- source_word: እምገጹ ይትሐጐሉ
  choice: disparaissent de devant sa face
  rationale: Le présent respecte l’aspect imperfectif; « de devant sa face » conserve l’expression spatiale et judiciaire du texte, tandis que « disparaissent » rend la perte ou destruction sans surdéterminer son mécanisme.
theological_decisions:
- issue: Référent du pronom dans « fut répandu sur lui »
  choice: Conserver le pronom masculin « lui » sans remplacer son référent par un titre interprétatif.
  alternative: « sur le trône » ou « sur l’Élu / le Fils de l’homme »
  rationale: Le guèze porte un pronom masculin singulier, mais la traduction ne doit pas résoudre par ajout explicite une identification qui dépend du contexte.
- issue: Action judiciaire de la parole
  choice: « La parole de sa bouche met à mort »
  alternative: « Il prononce une parole et les pécheurs meurent » ou « le souffle de sa bouche détruit »
  rationale: Cette formulation préserve l’efficacité propre de la parole dans la scène de jugement sans importer une formulation tirée d’une autre tradition textuelle.
- issue: Valeur des deux verbes imperfectifs finaux
  choice: 'Les rendre au présent : « met à mort » et « disparaissent ».'
  alternative: Les rendre au futur ou au passé.
  rationale: Le présent français peut exprimer l’effet caractéristique ou visionnaire de la parole tout en conservant le contraste avec les parfaits précédents; un futur demeure contextuellement possible.
translation_notes:
  register: Français international moderne, solennel mais lisible. La coordination ample du guèze est partiellement conservée, avec une nouvelle phrase avant l’énoncé judiciaire pour améliorer la clarté. Les images du trône, de l’esprit répandu et de la face sont maintenues.
