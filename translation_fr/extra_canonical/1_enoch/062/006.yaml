base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: fr
  text: Les rois, les puissants et tous ceux qui possèdent la terre[a] béniront, loueront et exalteront celui qui règne sur tout ce qui est caché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui tiennent la terre ». Le verbe guèze peut signifier tenir ou posséder ; dans ce contexte, il désigne probablement ceux qui exercent le pouvoir terrestre.
    reason: lexical_alternative
  - marker: b
    text: L’expression « celui qui règne sur tout ce qui est caché » reste descriptive, car ce verset ne donne aucun titre explicite à cette figure.
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: le béniront
  rationale: L’imparfait précédé de la conjonction poursuit la séquence visionnaire à valeur future. « Bénir » conserve la force religieuse du verbe.
- source_word: ይሴብሕዎ
  choice: le loueront
  rationale: Le verbe exprime la louange ou l’acclamation ; « louer » est naturel et transparent en français contemporain.
- source_word: የልዕልዎ
  choice: l’exalteront
  rationale: Le verbe signifie élever ou exalter. « Exalter » maintient le registre royal et apocalyptique sans paraphrase.
- source_word: ነገሥት
  choice: les rois
  rationale: Le sens ordinaire est « rois » ; ce choix préserve le caractère politique concret de la scène.
- source_word: መዛዝእት
  choice: les puissants
  rationale: Dans ce contexte de jugement, le terme désigne vraisemblablement les personnages qui détiennent une grande puissance aux côtés des rois.
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: tous ceux qui possèdent la terre
  rationale: Le verbe peut signifier tenir ou posséder. Cette formulation convient au contexte de pouvoir terrestre sans imposer la nuance plus forte de saisie violente.
- source_word: ለዘይመልክ
  choice: lui qui règne
  rationale: La construction relative caractérise une figure singulière par son autorité royale. « Régner » rend cette nuance plus directement que le terme général « gouverner ».
- source_word: ኵሎ ዘኅቡእ
  choice: tout ce qui est caché
  rationale: L’expression est large et ne doit pas être réduite aux seuls « secrets » ; elle conserve ainsi sa portée cosmique et révélatrice.
theological_decisions:
- issue: Identité de la figure singulière qui règne sur tout ce qui est caché
  choice: La rendre de manière descriptive sans préciser son identité dans le texte principal.
  alternative: L’identifier au Seigneur des Esprits, au Fils de l’homme ou à l’Élu, ou encore à Dieu comme souverain des réalités cachées.
  rationale: Le guèze emploie ici une proposition relative et non un titre explicite. La formulation descriptive préserve l’ambiguïté théologique du verset sans harmonisation contextuelle excessive.
translation_notes:
  register: Français moderne, international et digne. La coordination initiale est resserrée naturellement, tandis que la triple série « béniront, loueront et exalteront » conserve le rythme solennel du guèze. Les pronoms objets rendent explicite en français que les trois verbes ont la même figure pour complément.
