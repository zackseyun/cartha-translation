  naturalness: « La douleur viendra sur eux » et « l’ouverture de l’utérus » sont naturels en français international moderne. « Sein maternel » désigne d’abord le sein (la poitrine) en français courant et risque donc de brouiller l’anatomie visée. « Elle souffre en accouchant » rend idiomatiquement la pression/détresse sans jargon ni archaïsme.
  terminology: « En travail », « douleur », « utérus » et « accoucher » maintiennent le registre concret de l’image. Aucune interprétation théologique n’est ajoutée.
