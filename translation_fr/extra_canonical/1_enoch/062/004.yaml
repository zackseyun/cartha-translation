base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: fr
  text: Et la douleur viendra sur eux comme sur une femme en travail[a], lorsque son enfant arrive à l’ouverture de l’utérus et qu’elle souffre en accouchant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme sur une femme qui est en travail ».'
    reason: lexical_alternative
  - marker: b
    text: Le témoin source place entre crochets une clause supplémentaire décrivant la détresse de la femme pendant l’accouchement ; ces crochets signalent une incertitude textuelle.
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: douleur
  rationale: Le terme désigne une douleur ou une souffrance concrète. « Douleur » maintient ici la force physique de l’image de l’accouchement tout en convenant à l’angoisse apocalyptique.
- source_word: ማሕምም
  choice: en travail
  rationale: L’expression décrit une femme saisie par les douleurs de l’accouchement. « En travail » est idiomatique en français moderne et préserve précisément l’image.
- source_word: የዓፅብ / ተዐፅብ
  choice: est dans la détresse
  rationale: Le verbe évoque la pression, la difficulté ou la détresse. Cette formulation naturelle conserve l’intensité sans imposer une précision physiologique absente du texte.
- source_word: ወሊድ
  choice: enfanter
  rationale: Le nom relève du champ de l’accouchement. La tournure verbale « pour enfanter » est naturelle et garde l’action concrète de la naissance.
- source_word: በአፈ ማሕፀን
  choice: à l’ouverture du sein maternel
  rationale: Littéralement « à la bouche du sein/de la matrice ». « Ouverture du sein maternel » conserve le détail anatomique de l’image dans un français digne et compréhensible.
theological_decisions:
- issue: Faut-il généraliser l’image de l’accouchement en une terreur abstraite ?
  choice: Conserver la comparaison concrète avec les douleurs et la détresse de l’accouchement.
  alternative: 'Rendre seulement l’idée générale : « l’angoisse les saisira comme une femme en travail », sans le détail anatomique.'
  rationale: Le verset développe une comparaison suivie, jusqu’à l’arrivée de l’enfant à l’ouverture du sein maternel. Maintenir cette image respecte la rhétorique apocalyptique et évite une paraphrase abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète de l’accouchement et son intensité, tout en évitant l’archaïsme « être en gésine ». Les marqueurs de notes figurent tous dans le texte principal.
