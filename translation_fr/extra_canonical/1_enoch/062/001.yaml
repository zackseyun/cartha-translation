base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: fr
  text: 'Ainsi le Seigneur donna cet ordre aux rois, aux puissants, aux grands et à ceux qui habitent la terre. Il dit : « Ouvrez les yeux et levez vos cornes[a], si vous êtes capables de reconnaître l’Élu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « cornes » représentent probablement la force, le rang ou une puissance orgueilleuse. L’image du texte est conservée plutôt que remplacée par un terme abstrait.
    reason: cultural_note
  - marker: b
    text: Ou « le Choisi ». Le terme guèze constitue ici un titre formel dans les Paraboles, et non un simple adjectif descriptif.
    reason: lexical_alternative
lexical_decisions:
- source_word: አዘዘ
  choice: donna cet ordre
  rationale: Cette formulation exprime une directive forte tout en introduisant naturellement ses destinataires en français.
- source_word: እግዚእ
  choice: le Seigneur
  rationale: Ce titre divin rend la souveraineté de celui qui s’adresse aux dirigeants terrestres.
- source_word: ነገሥት
  choice: les rois
  rationale: Le terme désigne précisément des rois et conserve la portée politique concrète de la scène.
- source_word: ዐዚዛን
  choice: les puissants
  rationale: Ce substantif courant désigne clairement les détenteurs de puissance sans préciser indûment leur fonction.
- source_word: ልዑላን
  choice: les grands
  rationale: Le mot renvoie à des personnes de rang élevé. « Les grands » est naturel en français et conserve cette valeur sociale sans les identifier nécessairement à la noblesse.
- source_word: እለ የሐድርዋ ለምድር
  choice: ceux qui habitent la terre
  rationale: La tournure préserve la construction relative et l’expression apocalyptique visant les habitants de la terre.
- source_word: ክሥቱ አዕይንቲክሙ
  choice: Ouvrez les yeux
  rationale: Cet impératif naturel en français garde l’appel à voir ou percevoir ce qui est révélé.
- source_word: አንሥኡ አቅርንቲክሙ
  choice: levez vos cornes
  rationale: La traduction conserve l’image apocalyptique concrète plutôt que de la remplacer par une interprétation abstraite.
- source_word: ትክሉ
  choice: si vous êtes capables
  rationale: La proposition conditionnelle met à l’épreuve leur capacité, avec une tonalité plus solennelle que « si vous pouvez ».
- source_word: አእምሮቶ
  choice: de reconnaître
  rationale: Dans ce contexte de révélation, il s’agit vraisemblablement d’identifier la figure présentée, non simplement d’en avoir connaissance.
- source_word: ሐሩይ
  choice: l’Élu
  rationale: La majuscule et l’article signalent qu’il s’agit d’un titre formel récurrent, et non d’un simple adjectif descriptif.
theological_decisions:
- issue: Traduction du titre ሐሩይ dans les Paraboles
  choice: l’Élu
  alternative: le Choisi
  rationale: « L’Élu » est un titre français clair et établi qui préserve la force messianique et apocalyptique du terme sans ajouter d’identification doctrinale.
- issue: Interprétation de l’expression « lever ses cornes »
  choice: conserver l’image littérale « levez vos cornes »
  alternative: déployez votre puissance
  rationale: Le texte ne précise pas lui-même une seule valeur métaphorique. Garder les cornes préserve l’ambiguïté entre force, rang et puissance orgueilleuse.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux phrases évite une coordination lourde tout en rendant explicitement le verbe « il dit » du texte source. Les images apocalyptiques et la valeur titulaire de « l’Élu » sont conservées.
