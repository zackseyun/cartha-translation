base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: fr
  text: Car, dès le commencement, le Fils de l’homme était caché, et le Très-Haut le gardait en présence de sa puissance[a], puis il l’a révélé aux élus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant sa puissance » ou « devant sa force ». L’expression guèze est difficile ; la traduction conserve son image plutôt que de l’aplanir.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la valeur logique du connecteur guèze.
- source_word: እምቅድሙ
  choice: dès le commencement
  rationale: L’expression fonctionne ici comme un adverbe temporel. Cette traduction suit l’analyse révisée et évite de la confondre avec une formule spatiale signifiant « devant lui ».
- source_word: ኅቡእ ኮነ
  choice: était caché
  rationale: Rend naturellement l’état de dissimulation antérieur à la révélation, sans préciser davantage sa nature.
- source_word: ወልደ እጓለ እመሕያው
  choice: le Fils de l’homme
  rationale: Dans les Paraboles, la formule sert de désignation reconnaissable à la figure apocalyptique. La majuscule signale cet emploi comme titre sans ajouter d’identification doctrinale ultérieure.
- source_word: ዐቀቦ
  choice: le gardait
  rationale: Le verbe peut exprimer l’idée de garder, préserver ou mettre en réserve. « Gardait » conserve cette latitude en français courant.
- source_word: ልዑል
  choice: le Très-Haut
  rationale: Équivalent français usuel et digne de ce titre divin dans la littérature biblique et apocalyptique.
- source_word: በቅድመ ኃይሉ
  choice: en présence de sa puissance
  rationale: La formule guèze est difficile. Cette traduction conserve à la fois son image spatiale et le substantif concret « puissance », sans la réduire à un simple adverbe.
- source_word: ከሠቶ
  choice: il l’a révélé
  rationale: Rend le contraste direct avec le fait d’être caché et préserve le motif apocalyptique du dévoilement.
- source_word: ለኅሩያን
  choice: aux élus
  rationale: Désigne collectivement ceux qui ont été choisis. « Aux élus » est ici concis, intelligible et naturel dans un registre biblique moderne.
theological_decisions:
- issue: Valeur titulaire de ወልደ እጓለ እመሕያው
  choice: le Fils de l’homme
  alternative: le fils de l’homme ; le fils de la descendance des vivants
  rationale: Le contexte des Paraboles indique une désignation apocalyptique particulière. La traduction reconnaît cet emploi sans imposer une identification christologique extérieure au passage.
- issue: Portée du motif de dissimulation antérieure
  choice: dès le commencement… était caché… le gardait… l’a révélé
  alternative: était caché de toute éternité ; avait été réservé par le Très-Haut
  rationale: Le texte présente une dissimulation suivie d’une révélation, mais ne définit pas explicitement le statut métaphysique de cette existence. La formulation conserve cette tension sans amplification.
- issue: Sens de እምቅድሙ
  choice: dès le commencement
  alternative: auparavant ; devant lui
  rationale: La lecture temporelle convient à la forme et au contexte, tandis que « devant lui » confondrait cette expression avec les constructions spatiales attestées ailleurs dans le chapitre.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve la progression du texte — dissimulation, garde, révélation — et le vocabulaire apocalyptique demeure perceptible sans archaïsmes inutiles.
