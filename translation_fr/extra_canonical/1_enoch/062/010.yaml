base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: fr
  text: Et le Seigneur des esprits les chassera, afin qu’ils se hâtent et sortent de devant sa face[a]. Leurs visages seront remplis de honte, et les ténèbres s’ajouteront à leurs visages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa présence ». Le guèze dit plus littéralement « de devant sa face ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, les ténèbres « seront ajoutées » à leurs visages, image d’une obscurité qui vient intensifier leur honte.
    reason: translation_clarity
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: les chassera
  rationale: Le verbe exprime une impulsion coercitive. « Les chassera » rend naturellement le mouvement forcé dans cette scène de jugement sans le réduire à la seule peur.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette formulation conserve le titre apocalyptique récurrent de 1 Hénoch.
- source_word: ከመ ይፍጥኑ
  choice: afin qu’ils se hâtent
  rationale: La tournure garde la valeur finale de la proposition et l’idée d’une hâte imposée.
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: et sortent de devant sa face
  rationale: Cette traduction préserve l’image explicite du « visage » et l’expression de cour du guèze, plutôt que de l’aplanir en « loin de sa présence ».
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: leur visage sera rempli de honte
  rationale: Le singulier collectif français est naturel et maintient l’image visible de la honte publique inscrite sur leurs visages.
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: les ténèbres s’ajouteront sur leur visage
  rationale: Le verbe signifie l’ajout ou l’accroissement. La formulation conserve cette accumulation sans introduire l’idée différente de recouvrir ni la métaphore excessive d’un entassement.
theological_decisions:
- issue: Expression anthropomorphique de la présence divine
  choice: de devant sa face
  alternative: loin de sa présence
  rationale: Le texte guèze mentionne expressément la face. L’image apocalyptique est donc conservée au lieu d’être remplacée dans le corps du texte par une formulation abstraite.
- issue: Nature cumulative des ténèbres judiciaires
  choice: les ténèbres s’ajouteront sur leur visage
  alternative: les ténèbres couvriront leur visage
  rationale: Le choix suit le sens lexical d’ajout ou d’accroissement et évite de résoudre l’image en notion de recouvrement.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre des propositions et les images du visage, de la honte et des ténèbres sont conservés. « Se hâter » maintient une légère solennité adaptée au registre apocalyptique, tandis que les notes explicitent les expressions moins courantes sans les effacer du texte.
