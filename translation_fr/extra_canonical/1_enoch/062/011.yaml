translation:
  language: fr
  text: Et il les livrera aux anges pour leur châtiment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il les livrera aux anges avec un châtiment. » La construction guèze avec « châtiment » peut exprimer la finalité ou le résultat (« pour leur châtiment »), mais aussi avoir un sens plus instrumental (« avec un châtiment »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: Et il les livrera
  rationale: Le verbe exprime ici la remise de personnes au pouvoir ou à la garde d’autres; « livrera » conserve la portée judiciaire et apocalyptique, tandis que le préfixe conjonctif est rendu par « Et ».
- source_word: ለመላእክት
  choice: aux anges
  rationale: La préposition marque le destinataire de la remise. « Aux anges » est direct et n’ajoute aucune précision sur leur catégorie.
- source_word: በመቅሠፍት
  choice: pour qu’ils soient punis
  rationale: Le nom désigne le châtiment ou la correction. Cette formulation française naturelle rend la finalité ou le résultat probable sans préciser indûment la forme du châtiment.
theological_decisions:
- issue: Identité et rôle des anges
  choice: Les anges restent sans qualification et reçoivent les personnes destinées au châtiment.
  alternative: Les désigner explicitement comme des « anges chargés du châtiment ».
  rationale: Le guèze dit seulement « les anges »; la traduction ne transforme donc pas leur fonction contextuelle en catégorie angélique explicite.
- issue: Rapport syntaxique de በመቅሠፍት au verbe
  choice: 'Une valeur de finalité ou de résultat est retenue dans le texte principal : « pour qu’ils soient punis ».'
  alternative: 'Une valeur plus instrumentale : « avec un châtiment ».'
  rationale: La construction permet une nuance de finalité/résultat ou une lecture plus instrumentale; l’ambiguïté est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et digne. Le texte suit strictement le segment guèze fourni, dont le niveau de confiance est moyen; il n’intègre pas la continuation parfois attribuée à ce verset, puisqu’elle ne figure pas dans la source originale transmise ici.
