base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: fr
  text: Après cela, je vis de grands bovins noirs. Et voici que tous changèrent leurs étables, leurs pâturages et leurs veaux[a], puis ils commencèrent à vivre les uns avec les autres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition est difficile sur les plans textuel et sémantique. Le guèze semble placer sous un même verbe les lieux où vivent et paissent les bovins ainsi que leurs petits. On pourrait aussi comprendre, plus largement : « leurs demeures, leurs lieux de pâture et leurs petits ».'
    reason: textual_variant
  - marker: b
    text: 'Autres traductions possibles : « ils vécurent ensemble » ou « ils habitèrent les uns avec les autres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: bovins
  rationale: Le terme collectif conserve l’image proprement bovine de la vision sans préciser indûment le sexe des animaux, contrairement à « taureaux » ou « bœufs ».
- source_word: ዐቢያነ
  choice: grands
  rationale: L’adjectif exprime la taille ou l’aspect imposant des animaux; « grands » est concret et naturel dans ce récit visionnaire.
- source_word: ጸሊማነ
  choice: noirs
  rationale: Le mot désigne ici une coloration noire. Ce choix maintient le contraste chromatique structurant de la vision animale, sans remplacer l’image par son interprétation.
- source_word: ወለጡ
  choice: changèrent
  rationale: Le verbe indique un changement ou une modification, mais la relation exacte avec la série d’objets qui suit demeure difficile. « Changèrent » préserve cette indétermination mieux qu’un verbe plus précis comme « échangèrent » ou « quittèrent ».
- source_word: ምዕያኖሙ
  choice: leurs étables
  rationale: Dans le cadre de l’imagerie bovine, le mot peut désigner les lieux où les animaux sont logés. « Étables » conserve cette image, tout en laissant en note la possibilité plus générale de « demeures » ou d’« enclos ».
- source_word: ምርጓዮሙ
  choice: leurs pâturages
  rationale: Le substantif renvoie vraisemblablement aux lieux où paissent ou se nourrissent les animaux; « pâturages » est précis et naturel en français.
- source_word: አጥዐጥሆሙ
  choice: leurs veaux
  rationale: Dans cette scène bovine, le terme désignant les petits ou la descendance peut naturellement être rendu par « veaux », sans effacer la difficulté syntaxique de l’énumération.
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: ils commencèrent à vivre les uns avec les autres
  rationale: Cette formulation rend la valeur inchoative de la séquence verbale et l’idée de vie commune ou de cohabitation réciproque.
theological_decisions:
- issue: Faut-il identifier dans la traduction les êtres humains symbolisés par les bovins ?
  choice: Conserver littéralement l’imagerie animale dans le texte principal.
  alternative: Traduire de manière interprétative en nommant ou en suggérant directement les groupes humains représentés.
  rationale: La vision communique au moyen d’un symbolisme animal et chromatique. Le traduire en référents humains résoudrait une question d’interprétation que le texte lui-même laisse sous forme d’image apocalyptique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe légèrement insolite de « changèrent leurs étables, leurs pâturages et leurs veaux » est maintenue afin de ne pas résoudre artificiellement une difficulté réelle du texte source; la note en expose les principales possibilités. L’imagerie apocalyptique bovine et le contraste précis de couleur sont conservés.
