base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: fr
  text: 'De nouveau, je vis dans la vision et je levai les yeux vers le ciel. Et voici : je vis de nombreuses étoiles[a]. Elles descendirent et furent précipitées du ciel vers cette première étoile[b]. Parmi ces veaux, elles devinrent des taureaux[c] et pâturèrent avec eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « étoiles » peuvent représenter des êtres célestes, mais le texte conserve l’image sans les identifier explicitement.
    reason: lexical_alternative
  - marker: b
    text: « Cette première étoile » renvoie vraisemblablement à l’étoile déjà mentionnée plus tôt dans la vision.
    reason: cross_reference
  - marker: c
    text: Le terme rendu par « taureaux » peut aussi désigner plus largement des bovins ou du bétail; « taureaux » convient ici à la scène symbolique. Le verbe final signifie « paître, pâturer »; une lecture ancienne, « ils furent vus parmi eux », repose sur la confusion de deux racines proches en guèze.
    reason: textual_clarification
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: Puis je vis encore dans la vision
  rationale: Conserve la reprise narrative et le cadre visionnaire explicite, dans un français naturel et digne.
- source_word: ነጸርክዎ፡ ለሰማይ
  choice: je levai les yeux vers le ciel
  rationale: Exprime le regard dirigé vers le ciel sans donner au verbe une nuance interprétative excessive.
- source_word: ነዋ
  choice: Et voici
  rationale: Maintient la force déictique et la vivacité du récit apocalyptique.
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: de nombreuses étoiles
  rationale: Rend directement le pluriel et l'idée de multitude, tout en conservant l'image symbolique du texte.
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: Elles descendirent et furent précipitées du ciel
  rationale: Distingue le mouvement de descente de la forme passive plus énergique qui indique qu'elles sont jetées ou précipitées.
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: auprès de cette première étoile
  rationale: Le démonstratif et l'ordinal renvoient vraisemblablement à une étoile déjà mentionnée; « auprès de » restitue la relation spatiale sans sur-préciser la direction.
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: Au milieu de ces veaux
  rationale: ጣዕዋ désigne ici des veaux ou de jeunes bovins; « veaux » préserve concrètement le code animalier.
- source_word: አልህምት፡ ኮኑ
  choice: elles devinrent des taureaux
  rationale: Le terme désigne des bovins; dans ce contexte, « taureaux » marque la transformation en bovins mâles sans introduire l'ancienne lecture erronée « chevaux ».
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: et pâturèrent avec eux
  rationale: Le verbe relève de la racine associée au pâturage et non de celle signifiant « voir »; la tournure conserve l'accord pronominal du texte sans expliciter davantage la scène.
theological_decisions:
- issue: Identité symbolique des étoiles
  choice: Conserver « étoiles » dans le texte principal.
  alternative: Les identifier explicitement comme des anges ou des êtres célestes.
  rationale: Le texte donne l'image des étoiles. Même si celles-ci peuvent représenter des êtres célestes dans l'apocalypse, la traduction ne doit pas résoudre le symbole à la place du lecteur.
- issue: Force de la descente hors du ciel
  choice: « furent précipitées du ciel »
  alternative: « tombèrent du ciel »
  rationale: La forme passive indique qu'elles subissent l'action; « précipitées » conserve cette force sans préciser qui agit.
- issue: Sexe des bovins issus de la transformation
  choice: « taureaux »
  alternative: « bovins » ou « bétail »
  rationale: Le contexte zoomorphique favorise des bovins mâles, mais cette identification reste signalée en note puisque le terme peut être rendu plus largement par « bovins ».
translation_notes:
  register: Français international moderne, narratif et digne. La cadence visionnaire est conservée par « Puis », « dans la vision » et « Et voici », tandis que le vocabulaire animalier reste concret. Les pronoms féminins reprennent grammaticalement « étoiles », même après leur transformation symbolique en taureaux.
