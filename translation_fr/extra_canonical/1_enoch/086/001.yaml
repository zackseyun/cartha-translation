base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: fr
  text: De nouveau, je regardai de mes yeux pendant que je dormais, et je vis le ciel au-dessus. Et voici qu’une étoile[a] tomba du ciel ; elle se releva, mangea et brouta au milieu de ces bovins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Apocalypse des animaux, les étoiles représentent souvent des êtres célestes ; le verset dit toutefois simplement « une étoile ».
    reason: cross_reference
  - marker: b
    text: 'Le texte porte littéralement deux actions : « mangea et brouta ». Le terme traduit par « bovins » ne signifie pas spécifiquement « veaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: De nouveau
  rationale: Marque une nouvelle étape du récit de vision tout en conservant sa cadence répétitive.
- source_word: ርኢኩ በአዕይንትየ
  choice: je regardai de mes propres yeux
  rationale: Conserve l’insistance explicite sur les yeux et distingue ce premier verbe du second verbe de vision.
- source_word: እንዘ እነውም
  choice: pendant que je dormais
  rationale: Exprime clairement que la vision survient durant le sommeil, sans transformer cette indication en interprétation.
- source_word: ሰማየ መልዕልተ
  choice: le ciel au-dessus de moi
  rationale: Rend naturellement l’orientation vers le ciel situé en haut ; « de moi » explicite en français le point de vue implicite du visionnaire.
- source_word: ነዋ
  choice: Et voici
  rationale: Conserve la particule qui attire solennellement l’attention sur un nouvel élément frappant de la vision.
- source_word: ኮከብ አሐዱ
  choice: une étoile
  rationale: Le français indique déjà l’unité par l’article indéfini. « Une seule étoile » ajouterait une insistance qui n’est pas nécessaire ici.
- source_word: ወድቀ እምሰማይ
  choice: tomba du ciel
  rationale: Préserve le mouvement descendant vif et potentiellement inquiétant du texte.
- source_word: ወይትሌዐል
  choice: elle se releva
  rationale: Dans la séquence qui suit la chute, cette formulation rend naturellement l’idée que l’étoile se lève ou se remet debout, sans préciser davantage la nature de l’action.
- source_word: ወይበልዕ ወይትረዐይ
  choice: mangea et brouta
  rationale: Maintient les deux actions distinctes et l’imagerie animale surprenante de la vision.
- source_word: ማእከለ እልከቱ አልህምት
  choice: au milieu de ces bovins
  rationale: አልህምት désigne des bovins ou du bétail, et non spécifiquement des veaux. « Bovins » conserve cette précision zoologique et s’accorde avec le caractère allégorique du passage.
theological_decisions:
- issue: Faut-il interpréter l’« étoile » comme un être angélique dans le corps du texte ?
  choice: Conserver l’image d’une étoile sans l’expliciter.
  alternative: un ange ; une étoile angélique
  rationale: Dans la littérature hénochique, les étoiles peuvent représenter des êtres célestes, mais le verset présente explicitement une étoile dans une vision. La traduction préserve le symbole et laisse son interprétation au contexte.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple soutient le registre visionnaire sans archaïsme lexical. La répétition des actes de vision et l’étrangeté de l’étoile qui se comporte comme un animal sont volontairement conservées.
