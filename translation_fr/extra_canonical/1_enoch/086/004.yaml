base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: fr
  text: 'Je les observai et je vis : voici, ils firent tous sortir leurs organes génitaux[a], comme des chevaux, et ils commencèrent à monter les vaches. Celles-ci conçurent toutes et mirent au monde des éléphants, des chameaux et des ânes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze est sexuellement explicite et indique vraisemblablement que les mâles faisaient sortir ou exhibaient leurs organes génitaux. Cette formulation en donne un rendu sobre mais clair.
    reason: lexical_alternative
  - marker: b
    text: Dans cette vision symbolique, cette liste désigne la progéniture issue du croisement décrit. L’image appartient au langage allégorique de l’Apocalypse des animaux et ne constitue pas une description zoologique ordinaire.
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ
  choice: Je les observai
  rationale: Le verbe introduit l’observation du visionnaire. « Observai » convient au registre visionnaire et évite de répéter immédiatement « vis ».
- source_word: ወርኢኩ ወነዋ
  choice: 'et je vis : voici'
  rationale: Conserve la double formule de vision et son effet rhétorique, sans réduire « voici » à une simple ponctuation.
- source_word: አውፁኡ ንፍረታቲሆሙ
  choice: ils firent tous sortir leur sexe
  rationale: La tournure causative et directionnelle est maintenue. « Leur sexe » est explicite sans être clinique et se lit naturellement en français.
- source_word: ከመ አፍራስ
  choice: comme des chevaux
  rationale: Préserve littéralement la comparaison animale, essentielle à l’imagerie du songe.
- source_word: ወአሐዙ ይዐረጉ
  choice: et ils commencèrent à monter
  rationale: Dans ce contexte sexuel et animal, « monter » rend naturellement le sens littéral de monter sur, sans transformer l’image en explication.
- source_word: ዲበ አንስት አልህምት
  choice: les vaches
  rationale: አልህምት désigne ici les bovins femelles, non les éléphantes. « Les vaches » est exact, courant et cohérent avec l’allégorie animale.
- source_word: ወጸንሳ ኵሎነ
  choice: Celles-ci conçurent toutes
  rationale: Le français explicite par « celles-ci » que le sujet est constitué des vaches, tout en conservant le verbe concis et soutenu « conçurent ».
- source_word: ወወለዳ
  choice: et mirent au monde
  rationale: Expression française naturelle et digne pour l’action d’enfanter, également applicable à des figures animales.
- source_word: ነጌያተ ወአገማሰ ወአእዳገ
  choice: des éléphants, des chameaux et des ânes
  rationale: Rend directement les trois espèces nommées comme progéniture dans la vision.
theological_decisions:
- issue: Degré d’explicitation de l’imagerie sexuelle dans la vision animale
  choice: Conserver l’exposition anatomique et l’action de monter les vaches
  alternative: Employer une formule générale telle que « ils s’accouplèrent avec les vaches »
  rationale: Le texte décrit une reproduction transgressive au moyen d’images animales frappantes. Une paraphrase générale atténuerait la force et l’étrangeté voulues de la vision.
- issue: Identification des femelles montées
  choice: les vaches
  alternative: les éléphantes
  rationale: Le terme guèze አልህምት renvoie aux bovins ou aux vaches, tandis que les éléphants sont désignés plus loin par ነጌያተ. Cette distinction doit être maintenue sans imposer une interprétation doctrinale de l’allégorie.
translation_notes:
  register: 'Français international moderne, clair et digne. Le rythme visionnaire est conservé par « je vis : voici ». Le vocabulaire sexuel reste explicite mais non vulgaire, et l’étrangeté de l’allégorie n’est ni atténuée ni expliquée dans le corps du texte.'
