base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/006.yaml
  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: fr
  text: Et ils recommencèrent à dévorer ces bovins. Et voici, tous les enfants de la terre commencèrent [à trembler et à fuir].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze fourni s’interrompt après « commencèrent ». Les mots « à trembler et à fuir » sont restitués d’après la suite connue du verset et sont donc placés entre crochets.
    reason: textual_truncation
lexical_decisions:
- source_word: አሐዙ እንከ
  choice: ils recommencèrent
  rationale: Dans cette formule narrative, አሐዙ introduit l’action qui débute, tandis que እንከ marque ici sa reprise ou sa continuation.
- source_word: ይብልዕዎሙ
  choice: à dévorer
  rationale: Le contexte violent de l’Apocalypse des animaux appelle « dévorer » plutôt que le plus neutre « manger »; le suffixe objet est rendu avec le groupe nominal suivant.
- source_word: እልኩ አልህምት
  choice: ces bovins
  rationale: አልህምት désigne du bétail ou des bovins, et non des éléphants; « bovins » conserve l’image animale sans préciser indûment le sexe des bêtes.
- source_word: ነዋ
  choice: Et voici
  rationale: ነዋ est ici l’interjection déictique « voici », qui attire l’attention sur la scène suivante.
- source_word: ኵሎሙ ውሉደ ምድር
  choice: tous les enfants de la terre
  rationale: La traduction littérale préserve l’expression apocalyptique au lieu de l’aplanir en « habitants de la terre ».
- source_word: አሐዙ
  choice: commencèrent
  rationale: Le dernier mot conservé dans le témoin fourni ouvre une nouvelle construction verbale dont la suite manque dans l’extrait transmis.
theological_decisions:
- issue: Maintien concret du symbolisme animal
  choice: ces bovins
  alternative: les peuples ou les puissants qu’ils symbolisent
  rationale: La vision s’exprime au moyen d’animaux; la traduction ne décode pas leur référent symbolique dans le corps du texte.
- issue: Expression apocalyptique « enfants de la terre »
  choice: tous les enfants de la terre
  alternative: tous les habitants de la terre
  rationale: La formulation littérale garde la portée et l’ambiguïté de l’image sans imposer une interprétation anthropologique précise.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe visionnaire répétitive (« Et… Et voici… ») est maintenue, de même que l’expression apocalyptique « enfants de la terre ». Les crochets signalent explicitement la restitution rendue nécessaire par la troncation du texte source fourni.
