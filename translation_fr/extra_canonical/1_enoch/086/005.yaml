base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: fr
  text: Tout le bétail eut peur d’eux et fut terrifié devant eux[a]. Puis ceux-ci se mirent à mordre avec leurs dents, à dévorer et à donner des coups de cornes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut terrifié par eux ». Le guèze dit littéralement « de/devant eux »; l’expression peut évoquer l’effroi ressenti en leur présence, ou les présenter comme la cause de cet effroi.
    reason: translation_alternative
  - marker: b
    text: Le sujet de « ceux-ci se mirent » n’est pas nommé dans le guèze. Le démonstratif renvoie aux êtres désignés par « eux », probablement les animaux apparus au verset précédent, sans en donner une interprétation symbolique.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ኵሎሙ አልህምት
  choice: Tous les bovins
  rationale: Le syntagme désigne l’ensemble des animaux bovins. « Bovins » maintient explicitement l’imagerie animale sans préciser indûment leur sexe ni les réduire à un simple troupeau.
- source_word: ፈርህዎሙ ወደንገፁ
  choice: eurent peur d’eux et furent terrifiés
  rationale: Les deux verbes de peur sont conservés afin de rendre leur accumulation et l’intensification exprimée par le second.
- source_word: እምኔሆሙ
  choice: devant eux
  rationale: Rend le sens spatial ou relationnel de « de/devant eux » sans le réduire à une causalité explicite; en français idiomatique, « terrifiés par eux » demeure une autre possibilité.
- source_word: አሐዙ እንዘ ይኔክሱ
  choice: se mirent à mordre
  rationale: Le premier verbe fonctionne comme un auxiliaire inchoatif; « se mirent à » exprime naturellement le commencement de l’action.
- source_word: በስኒሆሙ
  choice: de leurs dents
  rationale: Conserve le moyen concret de l’attaque et l’imagerie animale explicite.
- source_word: ይውሕጡ
  choice: à dévorer
  rationale: Le verbe évoque l’action d’engloutir ou de consommer; « dévorer » convient à la violence de la scène.
- source_word: ይወግኡ በአቅርንቲሆሙ
  choice: à frapper de leurs cornes
  rationale: Le verbe peut signifier frapper, percer ou blesser. La mention des cornes précise le mode d’attaque, tandis que « frapper » évite d’imposer un résultat plus précis que le texte.
theological_decisions:
- issue: Faut-il remplacer les animaux symboliques par les groupes humains qu’ils représentent?
  choice: Conserver dans le texte principal les bovins, les dents et les cornes.
  alternative: Nommer directement les groupes humains supposés être symbolisés.
  rationale: Le passage appartient à une vision allégorique qui s’exprime délibérément par des animaux. Traduire les référents supposés effacerait l’image apocalyptique et imposerait une interprétation.
- issue: Identification du sujet implicite de « se mirent »
  choice: Conserver le pronom pluriel « ils » et signaler l’ambiguïté en note.
  alternative: Écrire « ceux-ci » ou nommer les animaux du verset précédent afin d’imposer un changement de sujet.
  rationale: La forme verbale guèze indique un sujet pluriel sans le nommer. Le contexte peut orienter vers les animaux monstrueux du verset précédent, mais la syntaxe du verset pris isolément permet au lecteur de rattacher le sujet aux bovins; la traduction ne tranche donc pas silencieusement.
translation_notes:
  register: Français international actuel, sobre et narratif. La répétition des verbes de peur et les détails corporels sont maintenus pour préserver la vigueur et l’étrangeté de la vision. « Bovins » est choisi plutôt que « bétail » afin de garder une désignation animale explicite et dénombrable.
