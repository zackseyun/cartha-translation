base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/027.yaml
  text: And I saw those sheep while they were burning[a], and their bones were burning.
translation:
  language: fr
  text: Et je vis ces brebis qui brûlaient[a], et leurs os brûlaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’éthiopien répète le verbe « brûler » à propos des brebis puis de leurs os, ce qui accentue l’intensité de la vision. Cette répétition est conservée en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢክዎሙ
  choice: je vis
  rationale: Le verbe de perception à la première personne appartient au récit de vision. « Je vis » est direct, digne et naturel, sans archaïsme.
- source_word: እልኩ አባግዕ
  choice: ces brebis
  rationale: « Brebis » maintient l’image animale structurante de l’Apocalypse des animaux, tandis que « ces » rend la valeur démonstrative.
- source_word: እንዘ ይውዕዩ
  choice: pendant qu’elles brûlaient
  rationale: La construction exprime une action simultanée et en cours au moment de la vision, sans préciser si les brebis brûlent d’elles-mêmes ou sont brûlées.
- source_word: አዕፅምቲሆሙ
  choice: leurs os
  rationale: Ce terme anatomique concret conserve la dureté de l’image du jugement.
- source_word: ይውዕዩ
  choice: brûlaient
  rationale: La répétition du même verbe est préservée afin de restituer l’intensification présente dans le texte éthiopien.
theological_decisions:
- issue: Faut-il atténuer l’image du jugement en parlant seulement de destruction ?
  choice: Conserver explicitement l’image des brebis et de leurs os qui brûlent.
  alternative: « étaient détruites » ou « étaient consumées »
  rationale: Le texte décrit précisément le feu et répète le verbe jusque pour les os. Une formulation générique aplanirait la force de cette scène apocalyptique.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition, légèrement lourde en français courant, est intentionnellement maintenue parce qu’elle reproduit un effet marqué du texte source.
