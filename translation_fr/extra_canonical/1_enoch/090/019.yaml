base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: fr
  text: Et je vis jusqu’au moment où une grande épée fut donnée aux brebis. Alors les brebis sortirent contre toutes les bêtes sauvages pour les tuer, et toutes les bêtes ainsi que les oiseaux du ciel s’enfuirent devant les brebis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኢኩ
  choice: je regardai
  rationale: Rend la formule visionnaire à la première personne; « regardai » s’accorde naturellement avec la progression introduite par « jusqu’à ce que ».
- source_word: እስከ ተውህበ
  choice: jusqu’à ce que … soit donnée
  rationale: Conserve la progression temporelle de la vision et la voix passive du texte guèze.
- source_word: ለአባግዕ
  choice: aux brebis
  rationale: Rend le datif sans expliciter l’identité symbolique des brebis.
- source_word: ሰይፍ ዐቢይ
  choice: une grande épée
  rationale: Préserve l’image élevée et son ambiguïté entre grandeur matérielle et puissance symbolique.
- source_word: ወወፅኡ አባግዕ
  choice: Alors les brebis sortirent
  rationale: Exprime le passage à l’action; « alors » rend naturellement l’enchaînement narratif sans ajouter d’interprétation.
- source_word: ዲበ ኵሉ አራዊተ ገዳም
  choice: contre toutes les bêtes sauvages
  rationale: « Contre » convient au contexte d’affrontement, tandis que « bêtes sauvages » rend naturellement l’expression guèze sans remplacer les figures animales par leurs référents supposés.
- source_word: ከመ ይቅትልዎሙ
  choice: pour les tuer
  rationale: Rend directement la finalité et maintient sans atténuation la violence de la scène.
- source_word: አዕዋፈ ሰማይ
  choice: les oiseaux du ciel
  rationale: Conserve la formulation imagée et le registre biblique naturel en français.
- source_word: ነፍጹ እምቅድመ ገጾሙ
  choice: s’enfuirent devant elles
  rationale: Rend idiomatiquement en français la tournure sémitique littérale « de devant leur face », le pronom renvoyant aux brebis.
theological_decisions:
- issue: Faut-il décoder les animaux dans le corps du texte?
  choice: Conserver littéralement « brebis », « bêtes » et « oiseaux » comme figures de la vision
  alternative: Traduire de manière interprétative par Israël, les nations hostiles et leurs alliés
  rationale: L’apocalypse animale communique par une imagerie symbolique suivie. La traduction doit préserver les termes de la vision et ne pas imposer l’identification de leurs référents.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression visionnaire et l’imagerie apocalyptique, tout en remplaçant l’idiome littéral « de devant leur face » par le français naturel « devant elles ».
