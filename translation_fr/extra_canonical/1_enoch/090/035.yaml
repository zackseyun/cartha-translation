  to: Et les yeux de tous s’ouvrirent, ils virent bien, et il n’y eut parmi eux personne qui ne voyait pas.
  rationale: 'La révision remplace « clairement » par « bien », rendu adverbial plus directement fondé pour ሠናየ dans ce contexte de restauration de la vue. Elle allège aussi la dernière proposition sans modifier sa force : il n’existait parmi eux aucune personne qui ne voyait pas. « Et » évite d’ajouter la nuance temporelle plus marquée de « Alors ».'
