base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: fr
  text: Et les yeux de tous s’ouvrirent, ils virent bien, et il n’y eut parmi eux personne qui ne voyait pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕይን
  choice: les yeux
  rationale: Le terme concret préserve l’image corporelle et visionnaire propre à l’Apocalypse des animaux.
- source_word: ተከሥታ
  choice: s’ouvrirent
  rationale: Cette tournure française rend naturellement l’ouverture passive des yeux sans remplacer l’image par une interprétation abstraite.
- source_word: ሠናየ
  choice: clairement
  rationale: L’accusatif peut avoir une valeur adverbiale (« bien »). Dans le contexte du rétablissement de la vue, « clairement » exprime une bonne perception visuelle sans introduire comme objet « ce qui est bon ».
- source_word: ዘኢይሬኢ አልቦ
  choice: il n’y en eut aucun … qui ne voyait pas
  rationale: La formulation conserve l’insistance de la construction négative sans l’interpréter explicitement comme la disparition de la cécité.
- source_word: በማእከሎሙ
  choice: parmi eux
  rationale: Expression française naturelle correspondant au sens distributif de la locution guèze.
theological_decisions:
- issue: Nature de la vue restaurée dans la vision
  choice: Conserver l’image d’un rétablissement de la perception au sein du récit visionnaire.
  alternative: Expliciter une illumination spirituelle ou la suppression métaphorique de l’aveuglement.
  rationale: Le texte symbolique parle de l’ouverture des yeux; la traduction maintient cette image et laisse au lecteur le soin d’en discerner la portée théologique.
- issue: Interprétation de ሠናየ
  choice: 'Le comprendre adverbialement: « clairement ».'
  alternative: 'Le comprendre substantivement: « ce qui était bon » ou « de bonnes choses ».'
  rationale: L’emploi adverbial convient mieux au contraste contextuel entre l’aveuglement antérieur et la vue désormais restaurée, tout en reconnaissant que la forme peut recevoir une autre analyse.
translation_notes:
  register: Français international moderne, courant et digne. La coordination simple et la double négation reproduisent le mouvement emphatique du guèze. Aucun vocabulaire confessionnel ni développement allégorique n’est ajouté.
