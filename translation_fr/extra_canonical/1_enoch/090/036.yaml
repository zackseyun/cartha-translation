base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/036.yaml
  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: fr
  text: Et je vis que cette maison devint grande, vaste et extrêmement pleine[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Apocalypse des animaux, la « maison » peut symboliser le sanctuaire ou le temple; toutefois, le texte guèze dit simplement « maison ».
    reason: cross_reference
  - marker: b
    text: Le texte ne précise pas de quoi la maison est pleine; dans le contexte immédiat, il peut s’agir des brebis. L’expression guèze signifie littéralement qu’elle devint « extrêmement pleine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Rend la formule visionnaire à la première personne et conserve la cadence narrative sans recourir à un archaïsme.
- source_word: ከመ ኮነ
  choice: que … devint
  rationale: La construction indique ici un changement d’état plutôt qu’une simple situation statique.
- source_word: ውእቱ ቤት
  choice: cette maison
  rationale: « Cette » représente le démonstratif, tandis que « maison » traduit le terme sans lui imposer d’emblée le sens plus précis de « temple ».
- source_word: ዐቢየ
  choice: grande
  rationale: Le mot peut évoquer aussi bien les dimensions que l’importance; « grande » préserve cette amplitude.
- source_word: ወርኂበ
  choice: vaste
  rationale: Exprime l’idée d’ampleur ou d’espace et forme en français un parallélisme naturel avec « grande ».
- source_word: ወምሉአ
  choice: et … pleine
  rationale: Le terme est conservé comme adjectif attribut coordonné aux adjectifs précédents; aucun complément absent du texte source n’est ajouté.
- source_word: ፈድፋደ
  choice: extrêmement
  rationale: Le terme fonctionne ici comme un adverbe intensif modifiant « pleine », et non comme un nom signifiant « abondance ».
theological_decisions:
- issue: Faut-il préciser que ቤት désigne le temple ou le sanctuaire dans le contexte de l’Apocalypse des animaux?
  choice: maison
  alternative: temple; sanctuaire
  rationale: Même si le contexte symbolique peut évoquer le sanctuaire restauré, le guèze emploie le mot général « maison ». Le texte principal conserve donc cette formulation et la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, sobre et visionnaire. La tournure légèrement inhabituelle « extrêmement pleine » est maintenue afin de respecter l’enchaînement des adjectifs attributs et de ne pas introduire un complément que le texte source ne donne pas.
