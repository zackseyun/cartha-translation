base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: fr
  text: 'Et je regardai jusqu’à ce que toutes leurs espèces soient transformées : elles devinrent toutes des bovins blancs. Le premier d’entre eux devint un bœuf sauvage[a], puis ce bœuf sauvage devint une grande bête qui avait sur la tête de grandes cornes noires.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze conservé porte ici deux fois un mot qui signifie normalement « parole », « chose » ou « affaire », et la première occurrence est signalée comme corrompue. « Bœuf sauvage » restitue le sens animalier probablement voulu dans ce contexte; le texte pourrait aussi avoir désigné un agneau.
    reason: textual_variant
lexical_decisions:
- source_word: ተወለጠ
  choice: soient transformées
  rationale: Dans cette scène de métamorphose visionnaire, le verbe désigne naturellement un changement de forme ou d’état.
- source_word: ኵሉ አዝማዲሆሙ
  choice: toutes leurs espèces
  rationale: Le terme renvoie ici aux différentes catégories de créatures dans le symbolisme animalier; « espèces » garde cette valeur collective et zoologique.
- source_word: አልህምተ ጻዕዳ
  choice: des bovins blancs
  rationale: « Bovins » préserve l’image collective sans préciser indûment le sexe ou l’âge des animaux.
- source_word: ቀዳማዊ … ማእከሎሙ
  choice: le premier d’entre eux
  rationale: Cette formulation française exprime directement la primauté du personnage au sein du groupe.
- source_word: †ነገር … ነገር
  choice: un bœuf sauvage … ce bœuf sauvage
  rationale: Le guèze transmis signifie normalement « parole », « chose » ou « affaire », mais il est signalé comme corrompu et rompt le code zoomorphique du passage. « Bœuf sauvage » rend la restitution probable de l’animal visé, tout en signalant la difficulté en note.
- source_word: አርዌ ዐቢየ
  choice: une grande bête
  rationale: Le choix conserve le registre élevé et la puissance de l’image apocalyptique sans identifier plus précisément l’animal.
- source_word: አቅርንት ጸሊም ዐቢይ ዲበ ርእሱ
  choice: sur la tête de grandes cornes noires
  rationale: Cette proposition, attestée dans la suite du texte de l’édition mais absente de l’extrait OCR tronqué, complète naturellement la phrase et l’image visionnaire.
theological_decisions:
- issue: Traitement du double ነገር dans une scène entièrement zoomorphique
  choice: Adopter « bœuf sauvage » dans le texte et documenter la leçon guèze en note
  alternative: Traduire littéralement « parole » ou « chose »
  rationale: La leçon guèze est marquée d’un obèle comme corrompue et produit une rupture incohérente dans la transformation des animaux. La restitution animale est très probable, mais demeure explicitement signalée afin de ne pas dissimuler l’état du témoin.
translation_notes:
  register: Français international moderne, clair et digne. « Je regardai jusqu’à ce que » conserve la progression visionnaire; « bovins » évite de masculiniser tout le groupe, tandis que « bœuf sauvage » rend la restitution conjecturale sans employer un terme zoologique trop technique.
