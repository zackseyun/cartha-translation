base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: fr
  text: 'Et voici : des agneaux naquirent de ces brebis blanches[a], et ils commencèrent à ouvrir les yeux, à voir et à crier vers les brebis.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ces mêmes brebis blanches »; le démonstratif renvoie au groupe déjà présent dans la vision.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression concernant les yeux peut aussi se rendre : « leurs yeux commencèrent à s’ouvrir »; la série verbale demeure syntaxiquement liée à « commencèrent ».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ነዋ
  choice: voici
  rationale: Cette particule déictique introduit naturellement une nouvelle scène de la vision; « voici » conserve le ton apocalyptique sans archaïsme excessif.
- source_word: መንስኣት
  choice: agneaux
  rationale: Le contexte prolonge l’imagerie animale; « agneaux » garde cette image concrète plutôt que de la réduire à « petits » ou « descendants ».
- source_word: ተወልዱ
  choice: naquirent
  rationale: Le verbe exprime simplement la naissance et convient au déroulement narratif.
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: de ces brebis blanches
  rationale: Le groupe conserve le démonstratif, l’espèce animale et la couleur, tous importants dans la vision. En français narratif, « ces » peut reprendre un groupe déjà mentionné.
- source_word: አኃዙ
  choice: ils commencèrent
  rationale: Le verbe marque le commencement et régit naturellement en français la série d’infinitifs qui suit.
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: à ouvrir les yeux
  rationale: Cette formulation conserve l’image de l’accès à la vue et s’intègre à la construction inchoative; la possibilité d’une expression plus passive est signalée en note.
- source_word: ወይርእዩ
  choice: à voir
  rationale: L’infinitif coordonné maintient la dépendance syntaxique envers « commencèrent ».
- source_word: ወይጸርኁ
  choice: à crier
  rationale: Le verbe désigne un cri ou un appel; « crier » préserve son intensité sans préciser indûment qu’il s’agit d’un bêlement.
- source_word: ኀበ አባግዕ
  choice: vers les brebis
  rationale: La préposition indique ici le mouvement ou l’orientation du cri; « vers » garde cette nuance directionnelle.
theological_decisions:
- issue: Maintien de l’imagerie animale dans une apocalypse symbolique
  choice: agneaux … brebis blanches … brebis
  alternative: petits … êtres blancs … troupeau
  rationale: La traduction conserve les figures animales explicites sans les remplacer par une interprétation de leurs référents historiques ou théologiques.
- issue: Portée du verbe inchoatif sur la série verbale
  choice: ils commencèrent à ouvrir les yeux, à voir et à crier
  alternative: leurs yeux commencèrent à s’ouvrir, puis ils virent et crièrent
  rationale: Les formes verbales coordonnées peuvent être comprises comme dépendant toutes de « ils commencèrent »; ce choix préserve leur parallélisme et évite de transformer la séquence en trois actions pleinement successives.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici » maintient le relief visionnaire; le passé simple convient au récit littéraire. La phrase garde la répétition des animaux et le parallélisme des actions sans expliciter leur portée symbolique.
