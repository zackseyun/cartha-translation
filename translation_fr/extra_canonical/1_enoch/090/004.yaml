base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: fr
  text: Et je regardai jusqu’à ce que ces moutons soient dévorés par les chiens, les aigles et les milans[a]. Ils ne leur laissèrent absolument aucune chair, ni peau ni tendon, jusqu’à ce que seuls leurs os restent debout ; même leurs os tombèrent à terre, et les moutons devinrent peu nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « milans » peut désigner plus largement une sorte de faucon ou un autre oiseau de proie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተበልዑ
  choice: soient dévorés
  rationale: Le passif et la violence de l’attaque par des prédateurs appellent « dévorés », plus expressif que le simple « mangés ».
- source_word: አክልብት
  choice: chiens
  rationale: Le terme animal ordinaire convient au récit symbolique sans en imposer une interprétation.
- source_word: አንስርት
  choice: aigles
  rationale: C’est l’équivalent traditionnel et le plus directement soutenu, malgré le possible chevauchement ancien entre différentes catégories de grands rapaces.
- source_word: ሆባይ
  choice: milans
  rationale: Le mot désigne vraisemblablement un rapace distinct des aigles, mais l’identification exacte de l’espèce demeure incertaine.
- source_word: ኢኃደጉ ሎሙ ሥጋ ግሙራ
  choice: Ils ne leur laissèrent absolument aucune chair
  rationale: ግሙራ renforce ici la négation et exprime l’absence totale de chair, plutôt qu’une catégorie de « chair entière ».
- source_word: ማእሰ
  choice: peau
  rationale: « Peau » est naturel et immédiat dans cette image de dépouillement complet des moutons.
- source_word: ሥርወ
  choice: tendon
  rationale: « Tendon » est clair en français moderne et conserve la progression chair, peau, tendon.
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: seuls leurs os restent debout
  rationale: Cette formulation garde l’image saisissante et inhabituelle des os dressés, au lieu de l’aplanir en un simple « il ne resta que leurs os ».
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: même leurs os tombèrent à terre
  rationale: '« Même » rend la mise en relief culminante des os : après être seuls restés debout, eux aussi finissent par tomber.'
- source_word: ወንእሱ አባግዕ
  choice: et les moutons devinrent peu nombreux
  rationale: La formulation proche de la source exprime directement leur forte diminution numérique.
theological_decisions:
- issue: Imagerie animale symbolique racontée littéralement
  choice: Conserver dans le texte les animaux de la vision sans les décoder.
  alternative: Remplacer les animaux par les peuples, chefs ou armées qu’ils pourraient représenter.
  rationale: L’Apocalypse des animaux construit son sens au moyen d’une imagerie zoomorphe continue ; la traduction doit préserver cette imagerie et ne pas introduire une interprétation historique ou confessionnelle dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition et la brutalité croissante de la vision, ainsi que l’image volontairement saisissante des os qui restent debout avant de tomber.
