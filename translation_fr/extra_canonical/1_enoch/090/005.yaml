base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: fr
  text: Et je vis jusqu’au temps où vingt-trois bergers étaient en fonction ; ils accomplirent, chacun en son temps, cinquante-huit périodes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « cinquante-huit temps » ; il peut s’agir de périodes comptées ou de durées assignées, dont la nature exacte n’est pas précisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je regardai
  rationale: Formule de vision narrative ; « regardai » s’accorde naturellement avec la durée introduite par « jusqu’au temps où ».
- source_word: እስከ ዘመን
  choice: jusqu’au temps où
  rationale: Rend la limite temporelle tout en donnant une syntaxe française naturelle.
- source_word: ይሬዐዩ
  choice: faisaient paître les troupeaux
  rationale: Le radical avec ዐ renvoie à l’action de paître ou de mener comme berger, et non au verbe « voir » ; le contexte de l’Apocalypse des animaux confirme ce sens.
- source_word: ፳ወ፫
  choice: vingt-trois bergers
  rationale: Le nombre est explicite ; le nom « bergers », sous-entendu par le contexte et par l’activité verbale, est ajouté pour rendre le français intelligible.
- source_word: ወፈጸሙ
  choice: ils achevèrent
  rationale: Exprime l’idée de mener à son terme une série ou un mandat.
- source_word: በበጊዜሆሙ
  choice: chacun en son temps
  rationale: Préserve clairement la valeur distributive de la répétition en guèze.
- source_word: ፶ወ፰ጊዜያተ
  choice: cinquante-huit périodes
  rationale: Dans ce décompte symbolique, « périodes » est plus naturel que le calque français ambigu « fois », sans préciser indûment leur durée ou leur référent historique.
theological_decisions:
- issue: Nature des unités numérotées dans la chronologie de l’Apocalypse des animaux
  choice: cinquante-huit périodes
  alternative: cinquante-huit temps / cinquante-huit mandats de bergers
  rationale: Le texte compte des unités temporelles symboliques sans en identifier explicitement la durée ni le référent historique ; la traduction conserve cette indétermination.
- issue: Identification des vingt-trois sujets
  choice: bergers
  alternative: laisser le sujet uniquement implicite
  rationale: Le contexte immédiat de la section porte sur les bergers, et le verbe signifie faire paître ; expliciter le sujet en français clarifie la phrase sans imposer une identification historique ou doctrinale.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple maintient le ton narratif visionnaire. « Faire paître les troupeaux » évite l’inélégant « berger » employé comme verbe, tandis que « chacun en son temps » restitue la distribution temporelle.
