base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: fr
  text: Après cela[a], les trois qui étaient vêtus de blanc et qui m’avaient pris par la main — ceux qui m’avaient auparavant fait monter — ainsi que la main de ce bélier qui me tenait[b], me firent monter et me placèrent au milieu de ces brebis[c], avant que le jugement n’ait lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien signifie ici « après cela » ou « ensuite ».
    reason: textual_variant
  - marker: b
    text: La transcription présente une difficulté à cet endroit. La lecture « bélier », retenue ici, correspond à la figure symbolique du contexte; une lecture fondée sur le texte transcrit donnerait plus littéralement « la main de celui-là ».
    reason: textual_variant
  - marker: c
    text: Les brebis appartiennent au langage symbolique de l’Apocalypse des animaux, où des groupes humains sont représentés sous la forme d’animaux.
    reason: cultural_note
lexical_decisions:
- source_word: ወእምኔሁ
  choice: Après cela
  rationale: L’expression a ici une valeur temporelle. Cette traduction évite l’ancienne lecture « parmi eux » et assure naturellement la continuité du récit.
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: les trois qui étaient vêtus de blanc
  rationale: Le texte désigne trois figures sans préciser explicitement s’il s’agit d’hommes ou d’anges; la formulation française conserve cette indétermination et l’image du vêtement blanc.
- source_word: አኃዙኒ በእዴየ
  choice: m’avaient pris par la main
  rationale: Cette tournure française naturelle exprime la prise et la conduite sans suggérer inutilement la violence.
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: ceux qui m’avaient déjà fait monter
  rationale: ቀደሙ est compris au sens temporel de « précédemment, déjà », tandis que le causatif አዕረጉኒ indique qu’ils l’ont fait monter.
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: la main de ce bélier qui me tenait
  rationale: La leçon rétablie ዴቤላ désigne le bélier, figure symbolique importante de l’Apocalypse des animaux. La syntaxe concrète de « la main » est conservée malgré son association imagée avec un animal.
- source_word: አዕረጉኒ ወአንበሩኒ
  choice: me firent monter et me placèrent
  rationale: Les deux verbes principaux expriment respectivement la montée causée et l’installation. « Placèrent » reste ouvert quant au fait de faire asseoir ou simplement de déposer.
- source_word: ማእከሎሙ ለዝኩ አባግዕት
  choice: au milieu de ces brebis
  rationale: La traduction maintient sans l’expliciter l’imagerie animale propre à cette vision.
- source_word: እንበለ ትኩን ኵነኔ
  choice: avant que le jugement ait lieu
  rationale: La proposition indique que le placement précède la scène judiciaire; cette formulation française rend clairement cette relation temporelle.
theological_decisions:
- issue: Identité des trois figures vêtues de blanc
  choice: Les désigner simplement comme « les trois »
  alternative: « les trois anges » ou « les trois hommes »
  rationale: Le passage fourni ne nomme pas explicitement leur nature. Les identifier davantage résoudrait indûment une ambiguïté du texte.
- issue: Identification de la figure qui tient Hénoch
  choice: « ce bélier »
  alternative: « celui-là »
  rationale: La correction de la leçon transcrite en ዴቤላ restitue une figure animale cohérente avec le contexte de l’Apocalypse des animaux; elle ne doit donc pas être neutralisée en simple démonstratif.
- issue: Valeur temporelle de la proposition finale
  choice: « avant que le jugement ait lieu »
  alternative: « jusqu’à ce que vienne le jugement »
  rationale: La construction est comprise comme situant l’action avant le jugement. La traduction n’ajoute aucune définition doctrinale de ce jugement.
translation_notes:
  register: Français international moderne, narratif et digne. Les reprises syntaxiques et la personnification animale ont été conservées autant que possible, tout en employant une ponctuation qui rend la longue phrase intelligible.
