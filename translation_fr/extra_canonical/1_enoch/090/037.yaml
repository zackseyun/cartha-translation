base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: fr
  text: Et je vis qu’un taureau blanc[a] naquit et que ses cornes étaient grandes. Toutes les bêtes sauvages et tous les oiseaux du ciel le craignaient et le suppliaient[b] en tout temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le taureau blanc est une figure symbolique de l’Apocalypse des animaux ; le texte ne précise pas ici son identité.
    reason: cultural_note
  - marker: b
    text: 'Ou : « l’imploraient » ; le verbe peut désigner une supplication ou une requête pressante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: naquit
  rationale: Le verbe exprime la naissance. L’intransitif français « naquit » restitue naturellement ce sens sans ajouter d’interprétation.
- source_word: ላህም
  choice: taureau
  rationale: Le terme désigne ici un bovin mâle; « taureau » convient à l’image animale et à la mention de ses cornes.
- source_word: ጻዕዳ
  choice: blanc
  rationale: La couleur est rendue littéralement afin de préserver le symbolisme chromatique de la vision.
- source_word: አቅርንቲሁ
  choice: ses cornes
  rationale: Cette formulation conserve l’image concrète des cornes et reprend naturellement « taureau » en français.
- source_word: ዐበይት
  choice: étaient grandes
  rationale: « Grandes » préserve d’abord l’idée de dimension ou de grandeur, sans préciser indûment une puissance militaire.
- source_word: አራዊተ ገዳም
  choice: les bêtes sauvages
  rationale: L’expression désigne les animaux non domestiques; cette traduction est plus naturelle en français moderne que le calque « bêtes des champs ».
- source_word: አዕዋፈ ሰማይ
  choice: les oiseaux du ciel
  rationale: La formulation conserve l’expression imagée et le registre élevé du texte.
- source_word: ይፈርህዎ
  choice: le craignaient
  rationale: Le verbe exprime directement la crainte éprouvée envers le taureau.
- source_word: ያስተበቍዕዎ
  choice: le suppliaient
  rationale: Le verbe a le sens fort d’implorer, de supplier ou d’adresser une requête pressante; « suppliaient » en conserve la force.
- source_word: በኵሉ ጊዜ
  choice: en tout temps
  rationale: Cette expression garde la portée continue et globale de la locution source dans un français digne et intelligible.
theological_decisions:
- issue: Faut-il identifier explicitement le taureau blanc?
  choice: Conserver le symbole animal sans en préciser l’identité dans le corps du texte.
  alternative: Présenter explicitement le taureau comme un dirigeant humain ou une figure messianique.
  rationale: L’Apocalypse des animaux transmet son message au moyen de figures symboliques. Identifier celle-ci dans la traduction trancherait une question d’interprétation que le verset lui-même laisse ouverte.
- issue: Force de l’attitude des animaux envers le taureau
  choice: Traduire le verbe par « le suppliaient ».
  alternative: Employer la formulation atténuée « recherchaient sa faveur ».
  rationale: Le verbe guèze indique une supplication ou une demande pressante. La traduction conserve cette posture de déférence sans décider si elle constitue formellement un acte cultuel.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe visionnaire (« Et je vis que… ») et les images concrètes sont conservées, tandis que « bêtes sauvages » évite un calque peu naturel. Les pronoms masculins sont imposés par le genre grammatical de « taureau » et ne constituent pas une identification supplémentaire du symbole.
