base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: fr
  text: Et je regardai jusqu’à ce qu’un trône soit dressé dans le pays agréable[a]. Le Seigneur des brebis s’y assit[b] ; il prit tous les livres scellés et ouvrit ces livres devant le Seigneur des brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze traduit par « pays agréable » est incertain dans ce témoin ; il peut désigner un pays particulièrement favorisé plutôt que la terre en général.
    reason: lexical_alternative
  - marker: b
    text: 'Le verset nomme deux fois « le Seigneur des brebis » : il est à la fois celui qui siège sur le trône et celui devant qui les livres sont ouverts. La traduction conserve cette répétition au lieu de la simplifier.'
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  choice: trône
  rationale: Dans cette scène apocalyptique de jugement, le terme désigne un siège royal et judiciaire ; « trône » en conserve pleinement l’image.
- source_word: ተሐንጸ
  choice: soit dressé
  rationale: La forme passive présente le trône comme mis en place ou érigé. « Soit dressé » convient à la vision sans préciser indûment qu’il aurait été matériellement construit.
- source_word: ሐዋዝ
  choice: le pays agréable
  rationale: Le mot guèze est difficile dans ce témoin. « Pays agréable » maintient à la fois le sens territorial concret et l’idée possible d’une terre privilégiée ou belle, sans le réduire à la terre entière.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Ce titre récurrent de l’Apocalypse des animaux est rendu de manière constante ; « Seigneur » préserve l’autorité et le registre apocalyptique élevé.
- source_word: መጻሕፍተ ኅትማተ
  choice: les livres scellés
  rationale: L’expression désigne des livres marqués d’un sceau, vraisemblablement des registres célestes. « Livres scellés » suit directement le guèze sans imposer le support plus précis de rouleaux.
- source_word: ፈትሖን
  choice: ouvrit
  rationale: Le verbe signifie ordinairement « ouvrir ». Le choix garde le sceau dans le groupe nominal précédent plutôt que de rendre ici « desceller ».
theological_decisions:
- issue: Identité de la figure assise sur le trône et de celle devant qui les livres sont ouverts
  choice: 'Conserver la formulation transmise : le Seigneur des brebis s’assied sur le trône et les livres sont ouverts devant le Seigneur des brebis.'
  alternative: Modifier l’une des occurrences afin qu’une autre figure céleste siège sur le trône ou reçoive les livres.
  rationale: La répétition peut paraître inhabituelle, mais le témoin guèze reste intelligible. La traduction ne l’harmonise pas silencieusement et préserve la possibilité que le texte souligne le Seigneur des brebis comme juge intronisé et destinataire des registres.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe visionnaire « je regardai jusqu’à ce que » est conservée, tandis que le vocabulaire reste accessible. La répétition finale du titre est maintenue conformément au témoin guèze.
