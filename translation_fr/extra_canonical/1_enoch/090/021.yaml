base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: fr
  text: Le Seigneur des brebis appela les sept premiers hommes blancs et leur ordonna de les amener devant lui, en commençant par la première étoile qui avait précédé les étoiles[b] dont les parties intimes étaient comme celles des chevaux[c] — cette première étoile qui était sortie devant elles[a]. Et ils les amenèrent devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition rendue par « cette première étoile qui était sortie devant elles » est textuellement difficile dans ce témoin éthiopien. Elle semble reprendre l’identité de l’étoile qui ouvrait la marche plutôt qu’introduire un autre personnage.
    reason: textual_variant
  - marker: b
    text: Dans cette vision, les « étoiles » représentent symboliquement des êtres célestes; l’image est conservée dans la traduction.
    reason: cross_reference
  - marker: c
    text: La comparaison avec les chevaux constitue une image sexuelle volontairement honteuse, qui évoque vraisemblablement la faute des êtres célestes rebelles.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: le Seigneur des brebis
  rationale: Conserve le titre élevé et le symbolisme animalier de la vision; « Seigneur » exprime à la fois l’autorité et la dignité du personnage divin.
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: les sept premiers hommes blancs
  rationale: Le mot ሰብአ désigne explicitement des hommes. Cette formulation respecte aussi le code symbolique de l’Apocalypse des animaux, où les êtres célestes apparaissent sous forme humaine.
- source_word: ያምጽኡ ቅድሜሁ
  choice: les amener devant lui
  rationale: Rend naturellement la présentation de prisonniers ou d’accusés dans cette scène de jugement, tout en conservant la répétition finale du texte.
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: en commençant par la première étoile qui avait précédé les étoiles
  rationale: L’emploi de እም est compris ici comme indiquant le point de départ d’une séquence. « Précédé » garde la nuance d’antériorité ou de position dirigeante sans la préciser davantage.
- source_word: ከዋክብት
  choice: étoiles
  rationale: Maintient l’image apocalyptique du texte au lieu de la remplacer directement par son interprétation, « êtres célestes » ou « anges ».
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: dont les parties intimes étaient comme celles des chevaux
  rationale: Conserve l’image sexuelle délibérément honteuse et bestiale, dans un français actuel qui reste digne et immédiatement compréhensible.
- source_word: '[ወሰነኩበ፡ ቀዳማዊ፡ ዘወፅአ፡ ቅድመ፡]'
  choice: cette première étoile qui était sortie devant elles
  rationale: Traite la proposition entre crochets comme une reprise appositive de la première étoile. « Étoile » suit la correction probable du témoin transcrit, tandis que la note signale la difficulté textuelle.
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: Et ils les amenèrent devant lui
  rationale: Préserve la reprise procédurale et le pluriel du texte dans la scène de jugement.
theological_decisions:
- issue: Faut-il interpréter les « étoiles » comme des anges dans le corps du texte?
  choice: Conserver « étoiles » dans le texte principal.
  alternative: Traduire par « anges » ou « êtres célestes ».
  rationale: La vision communique au moyen d’un symbolisme soutenu. Le remplacer par son interprétation effacerait une dimension littéraire et laisserait moins de place à l’ambiguïté propre au récit.
- issue: Comment rendre les sept êtres blancs?
  choice: « les sept premiers hommes blancs »
  alternative: « les sept premiers êtres blancs » ou « les sept premiers blancs »
  rationale: Le substantif guèze ሰብአ, « hommes », est présent dans le texte; le conserver évite d’altérer le contraste symbolique entre les figures humaines célestes et les figures animales terrestres.
- issue: Quel degré d’explicitation donner à la description sexuelle?
  choice: « les parties intimes »
  alternative: « les organes sexuels » ou une périphrase plus vague.
  rationale: Cette expression transmet le contenu sexuel et honteux sans neutraliser l’image ni adopter un registre médical inutilement abrupt.
- issue: La dernière mention du premier personnage introduit-elle un autre être?
  choice: La présenter comme une reprise de « la première étoile ».
  alternative: La comprendre comme l’introduction d’un personnage distinct.
  rationale: La syntaxe et la répétition favorisent l’apposition, mais l’état difficile du témoin ne permet pas de supprimer toute incertitude; celle-ci est donc signalée en note.
translation_notes:
  register: Français international moderne, narratif et solennel sans archaïsmes. La formulation conserve les répétitions judiciaires, le symbolisme des étoiles et la crudité maîtrisée de l’image sexuelle. Le pronom cataphorique « les » dans « de les amener » renvoie aux étoiles identifiées dans la suite, reproduisant sans l’aplanir la progression syntaxique du passage.
