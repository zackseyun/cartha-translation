base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: fr
  text: Je regardai jusqu’à ce que vienne cet homme, celui qui avait mis par écrit les noms des bergers. Il les fit monter devant le Seigneur des brebis. Puis il le secourut et le sauva, et il montra à ce bélier toute la descente de celui qui lui était venu en aide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière proposition est difficile dans le texte guèze transmis. «La descente» peut désigner la venue ou l’intervention de celui qui secourt; on a aussi compris le mot au sens de «chute».
    reason: textual_variant
lexical_decisions:
- source_word: ብእሲ
  choice: homme
  rationale: Le terme désigne normalement un homme. Même si le contexte suggère un personnage céleste, la traduction conserve l’image concrète du texte sans préciser davantage son identité.
- source_word: ዘጸሐፈ አስማቲሆሙ ለኖሎት
  choice: celui qui avait mis par écrit les noms des bergers
  rationale: Le plus-que-parfait exprime l’action antérieure qui identifie cet homme; «mis par écrit» garde la nuance documentaire et judiciaire.
- source_word: ያዐርግ ቅድሜሁ ለእግዚአ አባግዕ
  choice: Il les fit monter devant le Seigneur des brebis
  rationale: «Fit monter» conserve le mouvement exprimé par le verbe, tandis que «devant» rend la présentation au juge divin. «Seigneur des brebis» maintient le titre récurrent de la vision.
- source_word: ረዳኦ ወአድኃኖ
  choice: il le secourut et le sauva
  rationale: 'Les deux verbes restent distincts: le premier exprime l’aide apportée, le second la délivrance. Le pronom est conservé, le bélier étant nommé dans la proposition suivante.'
- source_word: ለዝኩ ይቤላ
  choice: à ce bélier
  rationale: ይቤላ désigne ici le bélier déjà présent dans la vision. Cette expression précise le bénéficiaire de l’action de montrer.
- source_word: ኵሎ መራደ ለረዳኢቱ
  choice: toute la descente de celui qui lui était venu en aide
  rationale: «Descente» rend le substantif መራደ sans le transformer en un vague «tout». La périphrase «celui qui lui était venu en aide» rend naturellement le substantif «son aide/secoureur» tout en gardant l’ambiguïté de la relation.
theological_decisions:
- issue: Identité de «cet homme»
  choice: cet homme
  alternative: cet ange; le scribe céleste
  rationale: Le guèze dit «homme». Le contexte peut suggérer un agent céleste, mais le texte local ne l’appelle pas explicitement ange.
- issue: Titre divin እግዚአ አባግዕ
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: «Seigneur» conserve la dignité et la portée divine de ce titre récurrent, sans quitter l’allégorie du troupeau.
- issue: Sens de la dernière proposition
  choice: toute la descente de celui qui lui était venu en aide
  alternative: tout ce qui concernait l’intervention de celui qui lui était venu en aide; toute la chute de son secoureur
  rationale: Le syntagme transmis est difficile. La traduction principale reste proche du sens spatial de መራደ et ne décide pas si cette «descente» désigne une venue secourable, une intervention ou une chute.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases ont été légèrement segmentées pour la clarté, sans atténuer la répétition visionnaire ni résoudre l’ambiguïté du dernier syntagme.
