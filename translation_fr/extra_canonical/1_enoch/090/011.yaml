base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: fr
  text: Alors, tous ces aigles, vautours, corbeaux et milans[a] continuèrent, jusqu’à présent, à emporter les brebis, à fondre sur elles et à les dévorer. Mais les brebis restaient silencieuses, tandis que les béliers se lamentaient et criaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms désignent plusieurs sortes d’oiseaux de proie ou charognards. Leur identification précise demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: አንስርት
  choice: aigles
  rationale: Le terme désigne un grand rapace et précède ici un autre nom rendu par « vautours » ; « aigles » maintient la distinction concrète entre les oiseaux de la vision.
- source_word: አውስት
  choice: vautours
  rationale: Ce nom est compris comme celui d’un oiseau charognard distinct du précédent, ce qui préserve l’énumération imagée des oiseaux hostiles.
- source_word: ቋዓት
  choice: corbeaux
  rationale: La révision lexicale la plus récente identifie ce terme aux corbeaux et respecte ainsi l’ordre des noms dans le texte guèze.
- source_word: ሆባይ
  choice: milans
  rationale: La révision lexicale la plus récente identifie ce terme aux milans ; ce choix conserve un rapace distinct des corbeaux qui précèdent.
- source_word: ይመስጥዎሙ
  choice: continuèrent […] d’emporter
  rationale: Le verbe exprime une prise violente ou un enlèvement ; la construction imperfective, jointe à « jusqu’à maintenant », indique une action prolongée.
- source_word: ይሰርሩ ዲቤሆሙ
  choice: de fondre sur elles
  rationale: Le verbe évoque le vol ou la descente rapide ; avec « sur elles » et des oiseaux pour sujet, « fondre sur » rend naturellement l’attaque aérienne.
- source_word: ይበልዕዎሙ
  choice: de les dévorer
  rationale: « Dévorer » restitue la violence prédatrice du verbe mieux que le plus neutre « manger ».
- source_word: ያረምሙ
  choice: restaient silencieuses
  rationale: Le verbe indique le silence ou le mutisme ; l’imparfait français exprime ici l’état continu des brebis.
- source_word: ይቤላት የአወይዉ ወይጸርኁ
  choice: les béliers se lamentaient et criaient
  rationale: ይቤላት est pris comme le nom pluriel « béliers », sujet des deux verbes de détresse ; cette analyse évite d’attribuer à tort les cris aux brebis silencieuses.
theological_decisions:
- issue: Identification du sujet des lamentations et des cris
  choice: 'Les béliers sont le sujet explicite : « les béliers se lamentaient et criaient »'
  alternative: Attribuer les lamentations et les cris aux brebis, ce qui créerait une tension avec leur silence
  rationale: Le guèze contient le substantif pluriel désignant les béliers. La distinction entre les brebis silencieuses et les béliers qui crient doit donc être conservée sans introduire une contradiction absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition des infinitifs coordonnés garde le mouvement cumulatif de l’attaque, tandis que « fondre sur » restitue clairement l’image d’oiseaux plongeant sur les brebis.
