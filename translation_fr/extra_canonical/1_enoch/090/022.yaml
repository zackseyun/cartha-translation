    rationale: Bien que défendable littéralement après « cet homme », ce groupe est marqué en français contemporain par une possible lecture ethnique étrangère à la scène apocalyptique. Le texte a déjà identifié le scribe comme « homme » ; « l’un de ces sept êtres blancs » traduit naturellement le groupe visionnaire qualifié de blanc sans en imposer une interprétation.
  - severity: low
    issue: « après les avoir prises »
    rationale: Le tour est compréhensible, mais « les ayant prises » reflète plus directement la construction participiale du guèze et maintient plus étroitement l’enchaînement narratif.
