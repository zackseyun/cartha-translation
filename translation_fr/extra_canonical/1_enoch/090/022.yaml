base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: fr
  text: 'Et il dit à cet homme qui écrivait devant lui, qui était l’un de ces sept êtres blancs, et il lui dit : « Prends ces soixante-dix bergers auxquels j’avais confié les brebis ; eux, les ayant prises, en ont tué beaucoup plus que je ne le leur avais ordonné. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ
  choice: homme
  rationale: Le nom désigne normalement un être humain de sexe masculin et maintient ici la représentation anthropomorphique du scribe céleste.
- source_word: ዘይጽሕፍ
  choice: qui écrivait
  rationale: L’imperfectif relatif décrit une action en cours dans le cadre narratif.
- source_word: በቅድሜሁ
  choice: devant lui
  rationale: Cette formulation conserve le sens spatial et la scène de cour céleste.
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: l’un de ces sept hommes blancs
  rationale: Le français reprend l’antécédent « homme » afin d’éviter le tour peu naturel « l’un de ces sept blancs », tout en conservant la couleur symbolique sans l’interpréter.
- source_word: ንሥኦሙ
  choice: Prends
  rationale: L’impératif exprime l’action de prendre ou d’emmener, sans préciser davantage le mode de mise sous garde.
- source_word: ፸ኖሎት
  choice: soixante-dix bergers
  rationale: « Bergers » maintient la métaphore pastorale structurante de la vision apocalyptique.
- source_word: መጠውክዎሙ
  choice: j’avais confié
  rationale: Le verbe indique une remise à la charge d’autrui. « Confier » rend naturellement cette responsabilité déléguée.
- source_word: አባግዐተ
  choice: les brebis
  rationale: « Brebis » préserve l’image récurrente et l’identité symbolique du peuple dans la vision animale.
- source_word: ነሢኦሙ ቀተሉ
  choice: après les avoir prises, en ont tué
  rationale: Le tour restitue la succession du participe et du verbe fini. Les pronoms renvoient naturellement aux brebis dans le contexte immédiat.
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: beaucoup plus que je ne le leur avais ordonné
  rationale: Cette formulation exprime un dépassement quantitatif coupable de la mission reçue, plutôt qu’une absence totale d’autorisation.
theological_decisions:
- issue: Identité des « soixante-dix bergers »
  choice: Conserver le titre symbolique « soixante-dix bergers » sans l’expliquer dans le texte.
  alternative: soixante-dix anges ; soixante-dix dirigeants
  rationale: La vision emploie délibérément une imagerie animale et pastorale. Une identification explicite aplanirait son langage apocalyptique.
- issue: Portée de l’ordre concernant la mise à mort
  choice: Indiquer que les bergers ont dépassé la quantité qui leur avait été ordonnée.
  alternative: Ils ont tué sans en avoir reçu l’ordre ; ils ont tué plus que ce qui avait été décrété pour eux.
  rationale: Le guèze indique le plus naturellement un excès par rapport à un ordre réel. La traduction conserve ainsi la tension entre jugement délégué et abus commis par ses agents.
- issue: Reprise du verbe de parole
  choice: Conserver « et il lui dit » après l’incise descriptive.
  alternative: Omettre la reprise et ne garder qu’un seul verbe introducteur.
  rationale: Le texte source répète explicitement le cadre de parole après la proposition qui identifie le scribe. Cette répétition narrative ne doit pas être silencieusement lissée.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition sémitique du verbe de parole est volontairement maintenue. « Hommes blancs » conserve l’imagerie visuelle du texte sans transformer ces figures en « anges » dans le corps du verset.
