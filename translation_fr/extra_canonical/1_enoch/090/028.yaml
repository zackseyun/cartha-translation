base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: fr
  text: Je me tins debout à regarder jusqu’à ce que cette ancienne maison soit repliée[a]. Ils firent sortir toutes les colonnes, tandis que toutes les plantes[b] et les poutres de cette maison étaient repliées avec elle. Puis ils l’emportèrent et la déposèrent en un lieu, au sud du pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi se comprendre comme « enveloppée », « enroulée » ou « démontée ». L’image est celle d’une structure rassemblée et emportée, non simplement détruite.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les plantes » ou « ce qui est planté ». Le terme a parfois été compris ici comme désignant les ornements de la maison.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « à la droite du pays ». Dans l’ancienne manière de s’orienter en regardant vers l’est, la droite désigne le sud.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ፡ አርእይ
  choice: Je restai là à regarder
  rationale: Cette tournure française exprime naturellement la posture maintenue et l’observation continue propres au récit de vision.
- source_word: ተጠወም / ተጠውሙ
  choice: soit repliée / étaient repliées
  rationale: Le verbe répété évoque la maison et ses éléments rassemblés, pliés ou enveloppés; « repliée » conserve cette image apocalyptique inhabituelle sans la réduire à une simple destruction.
- source_word: ቤት፡ ብሉይ
  choice: ancienne maison
  rationale: « Ancienne » peut désigner ce qui est vieux ou antérieur et préserve le contraste contextuel avec la maison nouvelle, sans introduire explicitement le mot « temple ».
- source_word: አውፅእዎሙ፡ ለኵሎሙ፡ አዕማድ
  choice: Ils firent sortir toutes les colonnes
  rationale: Le causatif signifie faire sortir ou enlever. « Colonnes » est un terme architectural clair; l’absence de possessif dans la source est respectée.
- source_word: ኵሉ፡ አትክልት
  choice: toutes les plantations
  rationale: Le sens ordinaire renvoie aux plantes ou à ce qui est planté. « Plantations » maintient cette image concrète malgré son caractère surprenant dans la description de la maison.
- source_word: ሤስ
  choice: les poutres
  rationale: Le mot semble désigner des éléments structurels en bois; « poutres » convient à la série architecturale avec les colonnes.
- source_word: ምስሌሁ
  choice: avec elle
  rationale: La formule indique que ces éléments sont repliés en même temps que la maison.
- source_word: ወአውፅእዎ፡ ወወደይዎ
  choice: Puis ils l’emportèrent et la déposèrent
  rationale: La succession des verbes décrit l’enlèvement matériel de la maison, puis son dépôt dans un autre lieu.
- source_word: በ፪መካን
  choice: en un lieu
  rationale: Le numéral associé à « lieu » indique un emplacement unique, sans qu’il soit nécessaire de surcharger la formulation française.
- source_word: በየማነ፡ ምድር
  choice: au sud du pays
  rationale: Littéralement « à la droite du pays/de la terre »; dans l’orientation ancienne tournée vers l’est, la droite correspond au sud. La traduction idiomatique est donnée dans le texte et le sens littéral en note.
theological_decisions:
- issue: Faut-il expliciter la portée cultuelle de « l’ancienne maison » en traduisant par « temple » ?
  choice: ancienne maison
  alternative: ancien temple
  rationale: La vision emploie une image architecturale symbolique, mais le mot source signifie « maison ». Garder ce terme laisse apparaître la résonance avec le temple par le contexte sans imposer une interprétation dans ce verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe distingue les colonnes, objets de « firent sortir », des plantations et des poutres, sujets de « étaient repliées ». Les images volontairement étranges de la vision sont conservées et éclairées par des notes.
