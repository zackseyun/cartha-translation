base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: fr
  text: Ils poussèrent des cris vers eux, mais ceux-ci ne prêtèrent pas attention à leurs paroles. Au contraire, ils étaient extrêmement sourds, et leurs yeux étaient extrêmement aveuglés.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien répète l’intensif « extrêmement » pour la surdité et pour l’aveuglement des yeux, ce qui souligne leur insensibilité extrême.
    reason: lexical_alternative
  - marker: b
    text: Dans cette vision, la surdité et les yeux aveuglés ont probablement aussi une portée morale et spirituelle; la traduction conserve toutefois les images sensorielles concrètes du texte éthiopien.
    reason: cultural_note
lexical_decisions:
- source_word: አስርኅዎሙ
  choice: ils poussèrent des cris vers eux
  rationale: La forme porte un sujet pluriel et un suffixe objet pluriel. Cette traduction rend le cri intense dirigé vers les autres sans introduire à tort un locuteur à la première personne.
- source_word: ኢያጽምኡ ነገሮሙ
  choice: ils ne prêtèrent pas attention à leurs paroles
  rationale: Le verbe d’audition nié peut exprimer le fait de ne pas écouter ou de ne pas tenir compte. « Ne prêtèrent pas attention » conserve l’idée d’un refus répréhensible sans aller jusqu’à la paraphrase « désobéir »; le suffixe de ነገሮሙ est bien à la troisième personne du pluriel.
- source_word: ፈድፋደ
  choice: extrêmement
  rationale: L’adverbe intensif est répété dans la source. Sa répétition est maintenue pour reproduire l’insistance de la vision.
- source_word: ተጸመሙ
  choice: étaient sourds
  rationale: Cette formulation naturelle conserve l’image sensorielle concrète sans décider explicitement s’il s’agit d’une incapacité physique ou morale.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: leurs yeux étaient aveuglés
  rationale: Le passif fort associé aux yeux évoque la perte ou l’obscurcissement de la vue. « Aveuglés » préserve la vigueur de l’image et sa possible portée morale ou judiciaire.
- source_word: ተወንየሉ
  choice: Au contraire
  rationale: 'Ce connecteur rend la progression adversative après le refus d’écouter : leur insensibilité est ensuite décrite comme une surdité et un aveuglement extrêmes.'
theological_decisions:
- issue: Incapacité sensorielle ou insensibilité morale et spirituelle
  choice: Le texte principal conserve les images concrètes de la surdité et des yeux aveuglés.
  alternative: Expliciter qu’ils étaient spirituellement endurcis ou qu’ils refusaient d’obéir.
  rationale: Dans la vision, le langage corporel peut porter une valeur morale et spirituelle. La traduction laisse subsister cette portée possible sans remplacer l’image par son interprétation.
- issue: Agent implicite de l’aveuglement
  choice: Employer le passif « étaient aveuglés » sans nommer d’agent.
  alternative: Dire qu’ils s’aveuglèrent eux-mêmes ou que Dieu les aveugla.
  rationale: La forme source ne justifie pas que la traduction précise l’agent; le passif préserve donc la tension entre état, conséquence morale et jugement.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition inhabituelle d’« extrêmement » est volontaire afin de préserver l’insistance de l’éthiopien. Les pronoms pluriels sont rendus conformément à la morphologie guèze et au contexte immédiat.
