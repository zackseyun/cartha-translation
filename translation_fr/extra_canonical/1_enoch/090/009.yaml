base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: fr
  text: Et je regardai jusqu’à ce que des cornes poussent à ces agneaux[a], et les corbeaux firent tomber leurs cornes. Puis je regardai jusqu’à ce qu’une grande corne pousse sur l’un de ces moutons, et leurs yeux furent ouverts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien parle littéralement de « cornes » sur les agneaux. Dans cette vision symbolique, les cornes représentent vraisemblablement la force ou le pouvoir.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leurs yeux furent ouverts » ; l’image peut évoquer une perception ou une conscience restaurée, sans que le texte l’explique davantage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅርንት
  choice: cornes
  rationale: Conserve le symbole apocalyptique de la force ou du pouvoir, sans lui substituer une précision zoologique étrangère au texte.
- source_word: መኃስእ
  choice: agneaux
  rationale: Le terme désigne ici les jeunes des moutons dans le code animalier du récit; ce choix respecte aussi le contexte immédiat du chapitre.
- source_word: ቋንት
  choice: corbeaux
  rationale: Équivalent français naturel du corvidé hostile représenté dans la vision.
- source_word: ያወድቅዎሙ
  choice: firent tomber
  rationale: Rend directement la valeur causative du verbe sans préciser indûment le moyen de l’action.
- source_word: በቈለ
  choice: pousse
  rationale: Préserve l’image organique d’une corne qui germe ou surgit.
- source_word: ፩ቀርን ዓቢይ
  choice: une grande corne
  rationale: Rend explicitement l’unicité et la grandeur de la corne dans un français naturel.
- source_word: አባግዕ
  choice: moutons
  rationale: Conserve la catégorie animale du texte et l’image d’un individu appartenant au troupeau.
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: leurs yeux s’ouvrirent
  rationale: Expression française directe qui maintient la portée visionnaire sans expliciter ce que cette ouverture signifie.
theological_decisions:
- issue: Identité de la grande corne
  choice: Maintenir l’image sans identifier le personnage historique
  alternative: Nommer Judas Maccabée ou un autre dirigeant
  rationale: Le verset présente un symbole, non son interprétation explicite; la traduction ne doit pas résoudre cette identification.
- issue: Sens de l’ouverture des yeux
  choice: Traduire littéralement « leurs yeux s’ouvrirent »
  alternative: Ils retrouvèrent la vue ou prirent conscience
  rationale: La formulation conserve l’ambiguïté entre perception, discernement et restauration sans importer une explication théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme répétitif de la vision (« je regardai jusqu’à ce que ») et son symbolisme animalier sont conservés.
