base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: fr
  text: Et je regardai jusqu’à ce que le Seigneur des brebis vienne auprès d’elles. Il prit dans sa main le bâton de colère[a] et frappa la terre. Alors la terre s’ouvrit[b], et toutes les bêtes ainsi que tous les oiseaux du ciel tombèrent d’entre ces brebis[c], s’enfoncèrent dans la terre, et celle-ci les recouvrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le bâton de colère ». Le texte guèze ne dit pas « de sa colère ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la terre fut fendue ». La proposition guèze est difficile, mais la suite indique que le sol s’ouvre pour que les bêtes et les oiseaux y descendent.
    reason: lexical_alternative
  - marker: c
    text: Les « bêtes » et les « oiseaux du ciel » appartiennent au symbolisme de l’Apocalypse des animaux et représentent ici des puissances hostiles, non pas seulement des animaux ordinaires.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: « Seigneur » conserve le poids du titre et la souveraineté exprimée par እግዚአ, tandis que « des brebis » maintient l’imagerie propre à l’allégorie animale.
- source_word: በትር መዓተ
  choice: le bâton de colère
  rationale: በትር désigne un bâton ou une verge; « bâton » s’accorde naturellement avec l’image pastorale. መዓተ signifie colère ou courroux et ne porte ici aucun suffixe possessif équivalant à « sa ».
- source_word: ዘበጣ ለምድር
  choice: frappa la terre
  rationale: Le verbe exprime un coup porté; « frappa » est direct, actuel et conserve la force de l’acte de jugement.
- source_word: ተሰጠተ ምድር
  choice: la terre s’ouvrit
  rationale: La forme et le sens précis sont difficiles, mais la suite — les êtres s’enfoncent dans la terre, qui les recouvre — indique une ouverture ou une fente. La tournure pronominale française rend naturellement le changement subi par la terre sans préciser un agent.
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: tombèrent du milieu de ces brebis
  rationale: Cette formulation conserve à la fois le mouvement de chute et la séparation d’avec les brebis présente dans እምዝኩ አባግዕ.
- source_word: ተሰጥሙ በምድር
  choice: s’enfoncèrent dans la terre
  rationale: Ce choix restitue la descente dans la terre et s’enchaîne avec la proposition suivante, sans trancher entre engloutissement passif et chute dans une ouverture.
- source_word: ከደነት ዲቤሆሙ
  choice: celle-ci les recouvrit
  rationale: Le verbe féminin singulier renvoie naturellement à la terre; « recouvrit » restitue sobrement l’image d’ensevelissement.
theological_decisions:
- issue: Titre divin dans l’allégorie animale
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: « Seigneur » garde la portée théologique et la souveraineté du personnage tout en restant dans le cadre de la vision, sans ajouter d’identification christologique explicite.
- issue: Instrument du jugement
  choice: le bâton de colère
  alternative: la verge de colère
  rationale: « Bâton » entretient l’imagerie pastorale; l’absence de possessif dans le guèze interdit d’ajouter silencieusement « sa colère ». La formule conserve néanmoins la dimension judiciaire de la scène.
- issue: Portée symbolique des bêtes et des oiseaux
  choice: maintien des figures animales dans le texte, avec explication en note
  alternative: remplacer les figures par « puissances hostiles »
  rationale: Le texte doit préserver l’allégorie apocalyptique plutôt que l’interpréter directement; la note aide le lecteur sans effacer l’image.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe légèrement solennelle adaptée à une vision apocalyptique, sans archaïsmes comme « courroux » ou « verge » dans le corps du texte. Les répétitions et les images animales essentielles sont conservées.
