base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: fr
  text: Et je vis jusqu’à ce que le Seigneur des brebis apporte une maison nouvelle, plus grande et plus élevée que la première, et qu’il l’établisse à la place de la première, qui avait été repliée[a]. Tous ses piliers étaient neufs, et ses ornements étaient neufs et plus grands que ceux de la première maison, l’ancienne, qu’il avait enlevée[b]. Toutes les brebis étaient à l’intérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roulée » ou « enveloppée ». Le verbe guèze est difficile et peut décrire l’ancienne maison comme ayant été repliée avant son remplacement.
    reason: lexical_alternative
  - marker: b
    text: La « maison » symbolise probablement le sanctuaire restauré ou eschatologique, mais la traduction conserve l’image propre à la vision.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: « Seigneur » conserve le registre élevé et l’image récurrente de l’Apocalypse des animaux, où Dieu règne sur le troupeau.
- source_word: ቤት ኀዲስ
  choice: une maison nouvelle
  rationale: Le nom désigne d’abord une maison. Garder cette image évite de l’interpréter directement comme un temple.
- source_word: ዓቢይ ... ልዑል
  choice: plus grande et plus élevée
  rationale: Cette formulation française exprime à la fois la grandeur et la hauteur, sans donner artificiellement à l’édifice une qualité morale.
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: qu’il l’établisse à la place de la première
  rationale: Le verbe peut signifier placer, dresser ou établir; le contexte décrit le remplacement de la première maison au même endroit.
- source_word: እንተ ትጠብለለት
  choice: qui avait été repliée
  rationale: Le verbe difficile évoque quelque chose que l’on replie, roule ou enveloppe. La traduction conserve cette image concrète plutôt que de préciser « détruite ».
- source_word: አዕማዲ
  choice: piliers
  rationale: Terme architectural courant, bien adapté à l’image de la maison.
- source_word: ስና
  choice: ornements
  rationale: Le mot semble désigner les éléments d’ornementation de la maison sans permettre d’en préciser davantage la nature.
- source_word: ብሊት
  choice: l’ancienne
  rationale: L’adjectif oppose nettement la maison retirée à la maison nouvelle.
- source_word: አውፅአ
  choice: avait enlevée
  rationale: Dans ce contexte de remplacement, le verbe indique que l’ancienne maison a été retirée.
- source_word: ማእከላ
  choice: à l’intérieur
  rationale: Cette expression française naturelle maintient l’idée que toutes les brebis se trouvent dans la nouvelle maison.
theological_decisions:
- issue: Faut-il traduire ቤት par « maison » ou l’interpréter comme « temple » ?
  choice: maison
  alternative: temple ou sanctuaire
  rationale: Même si la maison représente probablement le sanctuaire restauré ou eschatologique, le récit visionnaire emploie l’image d’une maison. La conserver respecte la texture symbolique du passage.
- issue: Comment décrire le sort de la première maison dans እንተ ትጠብለለት ?
  choice: qui avait été repliée
  alternative: qui avait été roulée, enveloppée, retirée ou démolie
  rationale: Le guèze présente une image concrète mais difficile. « Repliée » préserve cette étrangeté et n’impose pas l’interprétation plus explicite de la démolition.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe visionnaire « je regardai jusqu’à ce que » est conservée, tout comme l’image apocalyptique de la maison et des brebis; les formulations volontairement étranges du guèze ne sont pas normalisées en explications théologiques.
