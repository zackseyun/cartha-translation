base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: fr
  text: Et je vis jusqu’à ce que viennent les bergers, les aigles, les vautours et les milans. Ils crièrent aux corbeaux de briser la corne de ce bélier. Ils l’attaquèrent et combattirent contre lui ; lui aussi combattit contre eux et cria pour que son secours vienne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour que celui qui lui viendrait en aide vienne ». Le terme peut désigner le secours lui-même ou une personne qui vient en aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: les bergers
  rationale: Le terme désigne des bergers et conserve ici l’image technique des gardiens dans l’Apocalypse des animaux.
- source_word: አንስርት
  choice: les aigles
  rationale: Cette désignation usuelle préserve une catégorie distincte parmi les oiseaux de proie de la vision.
- source_word: አውስት
  choice: les vautours
  rationale: Le mot appartient à la liste des oiseaux de proie ; « vautours » le distingue naturellement des aigles et des milans.
- source_word: ሀባይ
  choice: les milans
  rationale: L’identification précise de l’espèce reste délicate, mais « milans » est une désignation traditionnelle et plausible dans cette série d’oiseaux de proie.
- source_word: ቋዓት
  choice: les corbeaux
  rationale: Dans la syntaxe du passage, les corbeaux sont ceux auxquels les oiseaux donnent l’ordre de briser la corne.
- source_word: ይቀትቅጥዎ
  choice: briser
  rationale: Le verbe exprime une rupture violente ; « briser » rend mieux cette force que le plus neutre « casser ».
- source_word: ቀርኖ
  choice: la corne
  rationale: Le singulier concret maintient le symbole central de la scène sans l’interpréter.
- source_word: ይቤላ
  choice: ce bélier
  rationale: Le référent est le mâle cornu attaqué dans la vision ; « bélier » est naturel en français et cohérent avec le contexte animalier.
- source_word: ረዳኢቱ
  choice: son secours
  rationale: Le nom issu de la racine « aider » peut désigner le secours ou celui qui porte secours. Le texte principal retient le sens abstrait, tandis que la note conserve la lecture personnelle.
theological_decisions:
- issue: Identité historique des figures qui attaquent dans l’Apocalypse des animaux
  choice: Conserver littéralement les bergers et les différentes espèces d’oiseaux.
  alternative: Remplacer les animaux par des peuples, des chefs ou des puissances historiques supposés.
  rationale: Le texte présente ces acteurs sous forme symbolique ; les identifier dans la traduction résoudrait indûment l’imagerie apocalyptique.
- issue: Nature du secours attendu par le bélier
  choice: « son secours » dans le texte principal
  alternative: « celui qui devait l’aider » ou « son aide » au sens personnel
  rationale: Le terme éthiopien permet une compréhension abstraite ou personnelle. La traduction et la note maintiennent cette ambiguïté sans préciser l’identité du secours.
translation_notes:
  register: Français international moderne, narratif et digne. Les espèces animales et la répétition du combat sont conservées afin de respecter le caractère visionnaire du passage. La tournure « jusqu’à ce que viennent » garde le mouvement duratif de la vision tout en restant naturelle.
