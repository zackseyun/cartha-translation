base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: fr
  text: Je regardai jusqu’à ce que le Seigneur des brebis vienne vers eux dans sa colère. Tous ceux qui le virent s’enfuirent, et ils tombèrent tous dans l’ombre[a], loin de sa face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans l’ombre »; l’image peut évoquer un lieu obscur de chute, mais le texte ne le précise pas davantage.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant sa face »; l’expression peut aussi se rendre par « loin de sa présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: Je regardai
  rationale: Dans le récit visionnaire, le verbe introduit une observation qui se poursuit jusqu’à l’événement suivant. « Je regardai » garde ce mouvement narratif mieux que le simple « je vis ».
- source_word: እስከ መጽአ
  choice: jusqu’à ce que … vienne
  rationale: Cette tournure marque la poursuite de la vision jusqu’à l’arrivée décisive du Seigneur des brebis.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Ce titre désigne, dans l’Apocalypse des animaux, le souverain du troupeau. « Seigneur » préserve sa portée théologique sans introduire une identification postérieure.
- source_word: በመዓት
  choice: dans sa colère
  rationale: L’expression indique la manière dont il vient et conserve la force judiciaire de la scène. Le possessif rend la tournure naturelle en français.
- source_word: እለ ርእይዎ ኵሎሙ
  choice: Tous ceux qui le virent
  rationale: Cette formulation rend clairement la construction relative collective et maintient l’idée de totalité.
- source_word: ነፍጹ
  choice: s’enfuirent
  rationale: Le verbe évoque une fuite soudaine devant l’apparition du juge; « s’enfuirent » en restitue l’urgence dans un registre digne.
- source_word: ወወድቁ ኵሎሙ
  choice: et ils tombèrent tous
  rationale: La répétition de « tous » est conservée afin de respecter l’insistance du texte sur le caractère total du jugement.
- source_word: ውስተ ጽላሎት
  choice: dans l’ombre
  rationale: Le guèze désigne littéralement l’ombre. Cette image inquiétante est conservée sans la préciser abusivement comme les ténèbres, le séjour des morts ou un lieu déterminé.
- source_word: እምቅድመ ገጹ
  choice: loin de sa face
  rationale: La préposition composée a une valeur ablative, littéralement « de devant sa face ». « Loin de sa face » conserve à la fois l’éloignement et l’image concrète de la face, dans un français naturel.
theological_decisions:
- issue: Identité du « Seigneur des brebis »
  choice: Un titre divin désignant Dieu comme souverain et juge du troupeau dans l’Apocalypse des animaux.
  alternative: Un simple « maître des brebis » à l’intérieur de l’allégorie.
  rationale: Le cadre allégorique plus large présente ce personnage comme le souverain transcendant qui intervient pour juger. « Seigneur » maintient cette portée sans importer une lecture christologique ultérieure.
- issue: Sens de la chute « dans l’ombre »
  choice: Conserver l’image indéterminée de l’ombre.
  alternative: Interpréter explicitement l’ombre comme les ténèbres, la perdition ou le séjour des morts.
  rationale: Le contexte donne à l’image une tonalité funeste, mais le terme guèze ne permet pas à lui seul d’identifier un lieu ou une doctrine plus précis.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit. La syntaxe reste fluide tout en conservant les répétitions de totalité, l’image des brebis, celle de l’ombre et celle de la face.
