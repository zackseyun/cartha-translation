base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: fr
  text: Et je vis jusqu’au moment où cet homme, qui écrivait un livre selon la parole du Seigneur, ouvrit le livre de destruction causée par ces douze bergers, et il montra devant le Seigneur des brebis qu’ils en avaient détruit bien plus que n’en avaient détruit leurs prédécesseurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « beaucoup plus que ceux qui étaient avant eux », c’est-à-dire les bergers qui les avaient précédés.'
    reason: La note conserve la formulation comparative du guèze et explicite seulement le référent implicite de « ceux d’avant ».
lexical_decisions:
- source_word: ወርኢክዎ፡ … እስከ
  choice: Et je regardai jusqu’au moment où
  rationale: Cette formulation française naturelle conserve la structure de la formule visionnaire répétée, littéralement « et je vis jusqu’à ».
- source_word: ብእሲ
  choice: cet homme
  rationale: Le terme désigne un homme ou un être humain. Le texte ne l’identifie pas explicitement comme un ange.
- source_word: ዘይጽሕፍ፡ መጽሐፈ
  choice: qui écrivait un livre
  rationale: L’imparfait rend l’action en cours et maintient l’image concrète de la consignation dans un livre.
- source_word: በቃለ፡ እግዚአ
  choice: selon la parole du Seigneur
  rationale: « Selon » exprime l’autorité directrice de la parole sans transformer explicitement celle-ci en ordre.
- source_word: ፈትሖ፡ ለውእቱ፡ መጽሐፈ
  choice: ouvrit le livre
  rationale: Le verbe signifie directement « ouvrir » ; « desceller » ajouterait une image absente du texte.
- source_word: መጽሐፈ፡ ሐጕል፡ ዘአሕጐሉ፡ እልኩ፡ ፲ወ፪የአቱ፡ ይኃርያን
  choice: le livre de la destruction causée par ces douze bergers
  rationale: La tournure rend intelligible le lien syntaxiquement difficile entre le livre, la destruction et l’action des douze bergers, sans suggérer qu’ils auraient détruit le livre lui-même.
- source_word: አርአዩ
  choice: Il montra
  rationale: Le sujet singulier renvoie naturellement à l’homme qui écrivait, et le verbe garde la force démonstrative de la scène de jugement.
- source_word: ፈድፋደ፡ እምቅድሜሆሙ
  choice: beaucoup plus que leurs prédécesseurs
  rationale: La comparaison signifie littéralement « beaucoup plus que ceux qui étaient avant eux » et renvoie aux groupes antérieurs de bergers, sans interpoler une limite prescrite.
- source_word: ቅድመ፡ እግዚአ፡ አባግዕ
  choice: devant le Seigneur des brebis
  rationale: Le titre propre au symbolisme animalier de la vision est conservé au lieu d’être remplacé par un titre divin générique.
theological_decisions:
- issue: Identité de l’homme qui écrit le livre
  choice: cet homme
  alternative: cet ange ; cet ange-scribe
  rationale: Le guèze dit « homme ». Une identification angélique est plausible dans le contexte, mais elle ne doit pas être introduite dans le texte.
- issue: Objet de la comparaison finale
  choice: les douze bergers ont détruit davantage que leurs prédécesseurs
  alternative: ils ont dépassé la limite qui leur avait été assignée
  rationale: Le syntagme guèze signifie littéralement « que ceux qui étaient avant eux ». La lecture relative à une limite assignée dépend davantage du contexte interprétatif que des mots de cette proposition.
- issue: Titre divin dans l’allégorie animale
  choice: Seigneur des brebis
  alternative: Dieu ; le Seigneur
  rationale: Conserver le titre maintient le monde symbolique propre à l’Apocalypse des animaux sans explicitation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au récit visionnaire écrit ; les formulations techniques ou confessionnelles ont été évitées. La syntaxe a été légèrement dépliée en deux phrases pour rendre clairement la scène sans résoudre les ambiguïtés d’identité.
