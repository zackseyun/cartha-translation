base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: fr
  text: Et tous ceux qui avaient péri et avaient été dispersés[a], ainsi que toutes les bêtes sauvages et tous les oiseaux du ciel, furent rassemblés dans cette maison[b]. Le Seigneur des brebis éprouva une très grande joie, parce qu’ils étaient tous devenus bons et étaient entrés dans sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier verbe peut aussi signifier « avaient été perdus » ou « avaient été détruits ». Il est distinct du verbe suivant, qui désigne la dispersion.
    reason: lexical_alternative
  - marker: b
    text: « Cette maison », puis « sa maison », appartient à l’image de la demeure restaurée dans la vision; il ne s’agit pas simplement d’une maison ordinaire.
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: avaient péri
  rationale: Le verbe peut exprimer le fait de périr, d’être détruit ou d’être perdu. « Avaient péri » conserve ici la distinction avec le verbe suivant de dispersion et laisse perceptible la forte portée restauratrice de la scène.
- source_word: ተዘርዘሩ
  choice: avaient été dispersés
  rationale: Le passif français rend l’état antérieur de ceux qui avaient été disséminés, sans confondre ce verbe avec ተሐጕሉ.
- source_word: አራዊተ ገዳም
  choice: bêtes sauvages
  rationale: Cette expression désigne naturellement les animaux sauvages ou du désert; « bêtes sauvages » est clair en français moderne sans imposer un terrain précis.
- source_word: አዕዋፈ ሰማይ
  choice: oiseaux du ciel
  rationale: Rendu proche de la formule guèze, naturel et digne en français biblique contemporain.
- source_word: ተጋብኡ
  choice: se rassemblèrent
  rationale: Le moyen pronominal français garde l’agent implicite et s’accorde naturellement avec la réunion de tous les groupes dans la maison.
- source_word: በውእቱ ቤት
  choice: dans cette maison
  rationale: Avec un verbe de rassemblement, « dans » exprime ici l’aboutissement du mouvement et correspond à l’entrée explicitement mentionnée ensuite.
- source_word: እግዚኦሙ ለአባግዕ
  choice: le Seigneur des brebis
  rationale: Conserve le titre symbolique récurrent de l’Apocalypse des animaux et son registre théologique élevé.
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: éprouva une très grande joie
  rationale: Cette formulation française naturelle maintient l’intensité de la construction apparentée « se réjouir / joie » sans lourdeur excessive.
- source_word: ኄራነ
  choice: bons
  rationale: Le terme exprime largement une condition bonne ou transformée; « bons » évite de préciser indûment « justes » ou « droits ».
- source_word: ገብኡ ውስተ ቤቱ
  choice: étaient entrés dans sa maison
  rationale: Rend le mouvement d’entrée accompli et rattache naturellement la maison au Seigneur des brebis.
theological_decisions:
- issue: Sens de ተሐጕሉ et portée restauratrice de la scène
  choice: « avaient péri »
  alternative: « avaient été égarés » ou « avaient été dispersés »
  rationale: Le champ lexical de la racine permet l’idée de périr ou d’être perdu. Le contexte de restauration peut évoquer le retour de ceux qui avaient péri, tandis que la traduction distincte du verbe suivant évite d’effacer une tension narrative et théologique réelle.
- issue: Référent du « Seigneur des brebis »
  choice: Maintien du titre symbolique divin « le Seigneur des brebis »
  alternative: « leur maître »
  rationale: Dans la vision, l’expression fonctionne comme une désignation symbolique de Dieu. La conserver respecte l’imagerie apocalyptique sans l’expliciter dans le corps du texte.
- issue: Nature de la transformation exprimée par ኄራነ
  choice: « devenus bons »
  alternative: « devenus justes » ou « droits »
  rationale: « Bons » préserve l’étendue sémantique du mot et ne transforme pas la scène en affirmation doctrinale plus technique que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’ampleur énumérative du récit visionnaire. Le vocabulaire symbolique — « Seigneur des brebis », « cette maison » — est maintenu sans interprétation confessionnelle ajoutée.
