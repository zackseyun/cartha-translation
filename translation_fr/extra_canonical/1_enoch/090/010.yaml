base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: fr
  text: 'Il les regarda, [et leurs yeux s’ouvrirent][a]. Il cria aux moutons et leur dit : « Regardez-le ! » Alors ils coururent tous vers lui.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots entre crochets sont textuellement incertains dans le témoin éthiopien fourni.
    reason: textual_variant
  - marker: b
    text: Le pronom singulier renvoie à la figure animale de la vision ; il ne tranche pas la question de l’identité symbolique de cette figure.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ወርእየ፡ ቦሙ
  choice: Il les regarda
  rationale: 'Le verbe est compris comme une forme à la troisième personne du singulier, et ቦሙ comme son complément pluriel : « il les regarda ». Cette analyse évite d’introduire ici la formule visionnaire « je vis ».'
- source_word: ወተፈትሐ፡ አዕይንቲሆሙ
  choice: '[et leurs yeux s’ouvrirent]'
  rationale: La tournure pronominale est naturelle en français et rend le passif éthiopien sans l’alourdir. Les crochets de la source sont conservés pour signaler l’instabilité textuelle.
- source_word: ወጸርኀ፡ ሎሙ፡ ለአባግዕ
  choice: Il cria aux moutons
  rationale: « Cria » garde la force du verbe vocal, tandis que « aux moutons » maintient explicitement l’imagerie animale.
- source_word: ወይቤላት፡ ርእይዎ
  choice: 'et leur dit : « Regardez-le ! »'
  rationale: La séquence est rendue comme une introduction de parole suivie d’un impératif pluriel doté d’un objet singulier. « Regardez-le ! » conserve cet objet, que le simple « Regardez ! » laisserait disparaître.
- source_word: ወሮጹ፡ ኵሎሙ፡ ኀቤሁ
  choice: Alors ils coururent tous vers lui
  rationale: Le verbe exprime la course, ኵሎሙ la totalité du groupe et ኀቤሁ le mouvement vers une figure singulière. « Alors » assure un enchaînement naturel sans modifier la relation temporelle.
theological_decisions:
- issue: Personnalisation de la figure singulière dans la vision animale
  choice: Employer « le » et « lui »
  alternative: Employer une formulation dépersonnalisée équivalant à « cela »
  rationale: Le français exige ici un genre grammatical, et les suffixes singuliers de la source renvoient à la figure regardée puis rejointe. « Lui » convient à une figure animale de genre masculin sans identifier son référent symbolique ni imposer une interprétation doctrinale.
translation_notes:
  register: Français international actuel, digne et direct. Le passé simple maintient le ton narratif visionnaire. « Moutons » est préféré à « troupeau » afin de préserver les acteurs animaux du texte.
