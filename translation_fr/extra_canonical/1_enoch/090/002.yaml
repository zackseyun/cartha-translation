base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: fr
  text: 'Après cela, je vis dans ma vision tous les oiseaux du ciel arriver : des aigles, des vautours, des milans et des corbeaux[a]. Les aigles conduisaient tous les oiseaux. Alors ils commencèrent à dévorer ces brebis[b], à leur arracher les yeux à coups de bec et à dévorer leur chair.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’identification précise de certains oiseaux reste incertaine : les termes guèzes désignent des rapaces et des corvidés ; on pourrait notamment traduire « milans » par « faucons », et « corbeaux » par « corneilles ».'
    reason: lexical_alternative
  - marker: b
    text: 'La séquence verbale peut aussi se comprendre : « ils les saisirent et les dévorèrent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: je vis dans ma vision
  rationale: Conserve le récit visionnaire à la première personne ainsi que le possessif explicite, dans un français naturel et digne.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: tous les oiseaux du ciel
  rationale: « Du ciel » restitue l’expression élevée sans paraître archaïque en français moderne.
- source_word: አንስርት
  choice: aigles
  rationale: Le terme désigne couramment les aigles dans l’usage biblique éthiopien, tout en pouvant couvrir plus largement de grands rapaces.
- source_word: አውስት
  choice: vautours
  rationale: Ce choix convient au catalogue d’oiseaux prédateurs et à l’image violente de la scène.
- source_word: ሆባይ
  choice: milans
  rationale: Le mot semble désigner un rapace de moindre taille ; « milans » évite de préciser excessivement l’espèce.
- source_word: ቋዓት
  choice: corbeaux
  rationale: « Corbeaux » convient au corvidé évoqué et maintient la tonalité sombre de la vision.
- source_word: ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: Les aigles conduisaient tous les oiseaux
  rationale: Le second አንስርት est compris comme le sujet explicite du verbe, non comme un cinquième élément de la liste. « Conduisaient » conserve l’idée de direction.
- source_word: አኃዙ ይብልዕዎሙ
  choice: ils commencèrent à dévorer
  rationale: Rend naturellement la valeur inchoative probable de la construction tout en conservant sa violence.
- source_word: ዝኩ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif renvoie aux brebis déjà présentes dans le déroulement de la vision ; « ces » est le renvoi narratif le plus naturel en français.
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: à leur arracher les yeux à coups de bec
  rationale: Cette formulation explicite naturellement en français l’action propre aux oiseaux sans remplacer l’image par une violence humaine générique.
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: à dévorer leur chair
  rationale: Préserve la répétition du motif de dévoration et le caractère viscéral de l’allégorie.
theological_decisions:
- issue: Symbolisme de l’Apocalypse des animaux
  choice: Conserver littéralement les images des oiseaux et des brebis.
  alternative: Identifier dans le texte les peuples, puissances ou dirigeants que ces animaux pourraient représenter.
  rationale: Le passage est allégorique, mais la traduction doit transmettre les images de la vision sans imposer une identification historique ou doctrinale.
- issue: Référent du sujet de l’attaque
  choice: Employer « ils », dont l’antécédent immédiat est l’ensemble des oiseaux conduits par les aigles.
  alternative: Répéter « les oiseaux » ou limiter explicitement l’action aux aigles.
  rationale: Le texte passe des aigles qui conduisent à l’action du groupe ; le pronom préserve cette continuité sans préciser davantage que la source.
translation_notes:
  register: Français international moderne, clair et digne, avec un léger relief apocalyptique. L’imparfait décrit la conduite exercée par les aigles, tandis que le passé simple marque le déclenchement de l’attaque. Les images animales sont conservées sans interprétation historique intégrée.
