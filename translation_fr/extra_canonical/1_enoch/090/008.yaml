base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: fr
  text: Je vis dans la vision que des corbeaux fondirent sur[a] ces agneaux[b]. Ils saisirent l’un de ces agneaux, mirent les moutons en pièces et les dévorèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire le verbe par « se précipitèrent sur » ou « vinrent sur » ; « fondirent sur » rend explicitement le mouvement d’oiseaux dans cette scène.
    reason: lexical_alternative
  - marker: b
    text: Le guèze emploie ici et ensuite des termes différents, mais susceptibles de désigner des membres du même troupeau ; la traduction conserve « agneaux » ici et « moutons » ensuite pour refléter ce changement de vocabulaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: Je vis dans la vision
  rationale: Conserve la formule de récit visionnaire à la première personne et inscrit la scène dans la vision en cours.
- source_word: ቋዓተ
  choice: des corbeaux
  rationale: Préserve l’espèce d’oiseau et l’image prédatrice concrète du texte apocalyptique.
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: fondirent sur
  rationale: Expression française naturelle pour le mouvement hostile d’oiseaux venant d’en haut, sans réduire l’action à une simple arrivée.
- source_word: እልክቱ፡ መዓስእ
  choice: ces agneaux
  rationale: Rend le premier terme du troupeau par « agneaux » afin de maintenir la nuance avec « brebis » dans la suite.
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: Ils saisirent l’un de ces agneaux
  rationale: Reproduit la sélection violente d’un individu au sein du groupe.
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: mirent les brebis en pièces
  rationale: Préserve la force du verbe intensif ainsi que le passage lexical des agneaux aux brebis.
- source_word: ወበልዕዎሙ
  choice: et les dévorèrent
  rationale: « Dévorer » maintient la violence de la scène de prédation dans un registre soutenu mais courant.
theological_decisions:
- issue: Interprétation des animaux dans l’Apocalypse des animaux
  choice: 'Conserver l’imagerie littérale : corbeaux, agneaux et brebis'
  alternative: Remplacer les animaux par les peuples ou dirigeants qu’ils pourraient symboliser
  rationale: La traduction doit préserver la forme concrète de la vision et ne pas intégrer son interprétation symbolique au corps du texte.
- issue: Variation entre les membres du troupeau
  choice: Maintenir « agneaux » puis « brebis »
  alternative: Uniformiser partout par « brebis » ou « moutons »
  rationale: La variation lexicale du guèze peut être significative, même si les référents se recouvrent; il convient donc de ne pas la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit visionnaire écrit. La syntaxe reste directe, et l’image apocalyptique demeure concrète sans ajout interprétatif.
