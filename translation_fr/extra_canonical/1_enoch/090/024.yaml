base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: fr
  text: Et le jugement eut lieu d’abord contre les étoiles[a]. Elles furent jugées et reconnues comme pécheresses, puis elles allèrent au lieu du jugement. On les jeta dans un abîme rempli de feu et de flammes, et rempli de colonnes de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « le jugement eut lieu devant les étoiles ». Ici, les étoiles représentent des êtres célestes; le contexte de la vision favorise toutefois l’idée qu’elles furent jugées en premier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵነኔ
  choice: jugement
  rationale: Conserve le cadre judiciaire et eschatologique ainsi que la répétition du terme dans le verset, sans anticiper le verdict par « condamnation ».
- source_word: ቅድመ እምከዋክብት
  choice: d’abord contre les étoiles
  rationale: Dans la séquence narrative, ቅድመ est compris adverbialement (« d’abord »), tandis que les étoiles sont les premières à subir le jugement. « Contre » exprime naturellement en français qu’elles en sont l’objet.
- source_word: ተኰነኑ
  choice: furent jugées
  rationale: Maintient le vocabulaire du procès; la proposition suivante énonce séparément leur condition morale.
- source_word: ኃጥኣነ
  choice: reconnues comme pécheresses
  rationale: « Pécheresses » préserve la portée morale et religieuse du terme; « reconnues comme » rend le constat exprimé dans la séquence judiciaire.
- source_word: ሖሩ መካነ ኵነኔ
  choice: allèrent au lieu du jugement
  rationale: Préserve le déplacement concret de la vision et la répétition du vocabulaire judiciaire.
- source_word: ወደይዎሙ
  choice: On les jeta
  rationale: Rend l’action violente sans imposer une identité aux agents, que le français exprime naturellement par le pronom indéfini.
- source_word: ውስተ ዕሙቅ
  choice: dans un abîme
  rationale: Évoque fidèlement une profondeur punitive dans cette vision apocalyptique sans employer un terme doctrinal ultérieur.
- source_word: ምሉእ እሳት ወይላህብ
  choice: rempli de feu et de flammes
  rationale: Expression française naturelle qui conserve l’accumulation des images ardentes.
- source_word: አዕማደ እሳት
  choice: colonnes de feu
  rationale: « Colonnes » rend les structures verticales de la scène visionnaire avec clarté et dignité.
theological_decisions:
- issue: Rendre le langage judiciaire comme procédure ou comme condamnation déjà prononcée
  choice: Conserver « jugement » et « furent jugées », puis énoncer séparément qu’elles furent reconnues comme pécheresses.
  alternative: Employer « condamnation » et « furent condamnées ».
  rationale: Le guèze répète la racine judiciaire avant d’indiquer séparément leur état de pécheresses. La traduction garde cette progression sans confondre procédure et verdict.
- issue: Identifier le lieu punitif par un terme doctrinal ou conserver l’imagerie visionnaire
  choice: « dans un abîme rempli de feu et de flammes, et rempli de colonnes de feu »
  alternative: « en enfer » ou « dans le feu de l’enfer »
  rationale: Le texte décrit une scène apocalyptique concrète; il ne faut pas la remplacer par une désignation doctrinale plus tardive.
- issue: Compréhension de ቅድመ dans la séquence des jugements
  choice: 'Lecture temporelle: les étoiles sont jugées en premier.'
  alternative: 'Lecture spatiale ou judiciaire: le jugement a lieu devant ou en présence des étoiles.'
  rationale: Le contexte immédiat de l’Apocalypse des animaux favorise l’ordre successif des groupes jugés, mais la formulation guèze permet de signaler l’autre compréhension en note.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « jugement » et de « rempli » est volontairement conservée pour refléter l’insistance du texte source; « étoiles » reste au féminin dans les reprises pronominales, conformément au français.
