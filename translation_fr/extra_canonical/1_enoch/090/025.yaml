base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: fr
  text: Et ces bergers[a] furent jugés et reconnus comme pécheurs[b], puis ils furent jetés dans cet abîme de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme du mot est altérée dans la transcription disponible, mais le guèze sous-jacent se lit vraisemblablement « bergers »; il s’agit des bergers mentionnés dans le contexte.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « devinrent pécheurs ». Dans ce contexte judiciaire, l’expression peut signifier qu’ils furent déclarés ou reconnus comme tels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: Et ces
  rationale: Le syntagme est démonstratif (« et ceux-là / et ces »), et non une formule de vision signifiant « et je vis ».
- source_word: 'ኖላዊያን (forme transcrite avec corruption OCR : ሮ*ኖላዊያን)'
  choice: bergers
  rationale: Le terme désigne les bergers, ici les bergers angéliques déjà jugés dans le contexte, et non des éléphants. La traduction conserve l’image symbolique du texte.
- source_word: ተኰነኑ
  choice: furent jugés
  rationale: Le passif judiciaire est rendu sans anticiper indûment sur la condamnation ou la sentence.
- source_word: ወኮኑ ኃጥኣነ
  choice: et reconnus comme pécheurs
  rationale: Littéralement, l’expression peut se rendre par « devinrent pécheurs ». Dans cette scène judiciaire, elle fonctionne vraisemblablement comme une constatation ou déclaration de leur état; « reconnus comme pécheurs » préserve à la fois le cadre juridique et le vocabulaire moral.
- source_word: ወተወድዩ እሙንቱ
  choice: puis ils furent jetés
  rationale: Le passif exprime une expulsion forcée. « Ils » reprend explicitement le groupe jugé; « puis » rend naturellement la progression du jugement à l’exécution de la peine.
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: dans cet abîme de feu
  rationale: Cette formulation garde l’image de l’abîme et du feu sans ajouter l’adjectif redondant « profond » ni remplacer l’image par une interprétation telle que « enfer ».
theological_decisions:
- issue: Identification du groupe symbolique jugé
  choice: Conserver « ces bergers » dans le texte principal
  alternative: Remplacer l’image par le référent historique ou angélique interprété
  rationale: L’Apocalypse des animaux s’exprime au moyen d’une imagerie symbolique suivie. La traduction doit préserver cette image plutôt que lui substituer silencieusement son interprétation.
- issue: Valeur morale ou judiciaire de ወኮኑ ኃጥኣነ
  choice: « reconnus comme pécheurs »
  alternative: « devinrent pécheurs » ou « furent reconnus coupables »
  rationale: Le mot « pécheurs » conserve la portée morale et religieuse de l’éthiopien, tandis que « reconnus comme » fait entendre sa fonction judiciaire dans le contexte. La note maintient ouverte la lecture plus littérale.
translation_notes:
  register: Français international actuel, clair et digne. Le rythme narratif reste sobre, l’imagerie apocalyptique est conservée et le vocabulaire judiciaire n’efface pas la qualification morale de « pécheurs ».
