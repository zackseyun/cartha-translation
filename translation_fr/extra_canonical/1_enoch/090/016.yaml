base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: fr
  text: Tous les aigles, les vautours, les corbeaux et les milans se rassemblèrent et vinrent avec eux, ainsi que tous les moutons sauvages. Ils vinrent tous ensemble et s’entraidèrent afin de briser la corne de ce bélier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት፡ ወዓውስት፡ ወቋዓት፡ ወሀባይ
  choice: les aigles, les vautours, les corbeaux et les milans
  rationale: Rend la série de quatre oiseaux de proie ou charognards par leurs équivalents français usuels, conformément au sens lexical du guèze et au contexte de la vision animale.
- source_word: አባግዕ፡ ገዳም
  choice: les moutons sauvages
  rationale: Littéralement « les moutons du désert/de la campagne sauvage » ; « moutons sauvages » exprime clairement leur caractère non domestique dans ce contexte.
- source_word: ይቀትቅጥዎ
  choice: briser
  rationale: Le verbe exprime l’action de mettre en pièces, fracasser ou broyer ; « briser » convient naturellement à une corne sans atténuer la violence de l’image.
- source_word: ተራድኡ
  choice: s’entraidèrent
  rationale: 'Préserve la valeur réciproque du verbe : les groupes réunis se prêtent mutuellement assistance.'
theological_decisions:
- issue: Identification symbolique des animaux et de la corne
  choice: Conserver strictement les figures animales sans les interpréter dans le corps du texte
  alternative: Remplacer ou expliquer les figures par les peuples ou personnages historiques qu’elles pourraient symboliser
  rationale: Le verset appartient à une vision allégorique, mais le texte ne livre pas ici même l’identification de chaque symbole ; la traduction doit préserver cette tension interprétative.
translation_notes:
  register: Français moderne, international et digne. La répétition de « vinrent » est conservée parce qu’elle structure la progression du texte source, tandis que la syntaxe est légèrement fluidifiée pour rester naturelle.
