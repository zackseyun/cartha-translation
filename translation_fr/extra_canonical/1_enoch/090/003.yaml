base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: fr
  text: Les brebis criaient parce que leur chair était dévorée par les oiseaux[a], et je regardai et me lamentai dans mon sommeil contre ce berger qui faisait paître les brebis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte dit « oiseaux », sans préciser « oiseaux de proie », bien que la dévoration implique ici un comportement prédateur.
    reason: lexical_alternative
  - marker: b
    text: Le verbe rendu par « me lamentai » peut aussi évoquer des cris de douleur. La préposition traduite par « contre » peut marquer que le berger est l’objet ou la cible du cri, sans préciser davantage la nature de cette protestation.
    reason: textual_ambiguity
lexical_decisions:
- source_word: አባግዕ
  choice: les brebis
  rationale: Le nom pluriel désigne explicitement des moutons. « Brebis » conserve l’imagerie animale de la vision sans la remplacer par son référent historique supposé.
- source_word: ጸርኁ
  choice: poussèrent des cris
  rationale: Le verbe exprime un cri audible de détresse. Cette tournure française est naturelle et ne réduit pas le sens à de simples paroles.
- source_word: ይትበልዑ ሥጋሆሙ
  choice: dévoraient leur chair
  rationale: L’imparfait rend l’action en cours dans le récit visionnaire; « dévoraient » en communique la violence et « chair » conserve le caractère concret de ሥጋ.
- source_word: እምነ አዕዋፍ
  choice: les oiseaux
  rationale: Dans la construction passive guèze, la locution indique les agents de la dévoration. Le texte dit simplement « oiseaux », sans ajouter « de proie ».
- source_word: ነጸርኩ
  choice: je regardai
  rationale: Ce verbe courant d’observation visionnaire est rendu directement, dans un registre narratif digne et accessible.
- source_word: አውየውኩ
  choice: me lamentai
  rationale: Le verbe décrit une manifestation de douleur qui peut être entendue comme une lamentation ou un cri. « Me lamentai » distingue la réaction du voyant des cris déjà poussés par les brebis.
- source_word: በንዋምየ
  choice: dans mon sommeil
  rationale: La formulation conserve la référence concrète au sommeil plutôt que de la remplacer par « dans mon rêve », même si le contexte est celui d’une vision onirique.
- source_word: ዲበ ውእቱ ኖላዊ
  choice: au sujet de ce berger
  rationale: ዲበ a ici une relation difficile à préciser exactement (« sur », « au sujet de », éventuellement « contre »). La formulation retenue préserve le lien avec le berger sans imposer que la lamentation lui soit hostile.
- source_word: ዘይርዕዮሙ ለአባግዕ
  choice: qui faisait paître les brebis
  rationale: La proposition relative décrit l’activité du berger. « Faisait paître » est idiomatique en français et maintient concrètement l’image pastorale.
theological_decisions:
- issue: Faut-il remplacer les animaux de la vision par leurs référents historiques supposés ?
  choice: Conserver dans le texte les brebis, les oiseaux et le berger.
  alternative: Traduire directement les symboles par des êtres humains, des ennemis et un dirigeant.
  rationale: Le passage présente une vision symbolique. Une traduction doit préserver cette imagerie et réserver son identification historique à un commentaire.
- issue: La lamentation du voyant est-elle dirigée contre le berger ?
  choice: Employer la formulation relationnelle neutre « au sujet de ce berger ».
  alternative: Traduire « contre ce berger », ce qui ferait du berger la cible explicite du cri.
  rationale: La préposition ዲበ permet une nuance plus large que l’hostilité. Le contexte peut suggérer un reproche, mais le texte ne doit pas résoudre sans indication l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, narratif et solennel sans archaïsmes. La répétition de « brebis » est maintenue pour préserver la cohérence de l’imagerie animale. Le passé simple marque le premier plan narratif, tandis que l’imparfait décrit les actions en cours.
