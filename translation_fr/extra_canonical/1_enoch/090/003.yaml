  terminology: '« Brebis », « chair », « oiseaux », « berger » et « faisait paître » sont appropriés et préservent l’imagerie pastorale sans interprétation historique. La note b doit être corrigée : elle ne doit pas transformer « contre ce berger » en une option éloignée alors que la relation est portée par le texte.'
