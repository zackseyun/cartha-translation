  to: Et je vis, en ce temps-là, qu’un abîme profond semblable[a] s’ouvrit au milieu de la terre, plein de feu. On amena ces brebis aveuglées[b] ; toutes furent jugées et reconnues comme pécheresses[c], puis jetées dans cet abîme profond de feu, où elles brûlèrent. Cet abîme se trouva du côté droit de cette maison-là.
