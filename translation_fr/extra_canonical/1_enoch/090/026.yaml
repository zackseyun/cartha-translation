base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: fr
  text: Et je vis, en ce temps-là, qu’un abîme profond semblable[a] s’ouvrit au milieu de la terre, plein de feu. On amena ces brebis aveuglées[b] ; toutes furent jugées et reconnues comme pécheresses[c], puis jetées dans cet abîme profond de feu, où elles brûlèrent. Cet abîme se trouva du côté droit de cette maison-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fosse profonde ». Le terme guèze désigne une grande profondeur ; « abîme » conserve ici la tonalité apocalyptique.
    reason: lexical_alternative
  - marker: b
    text: 'Les « brebis aveuglées » appartiennent au langage symbolique de la vision : elles représentent des êtres humains et non des animaux au sens littéral.'
    reason: cultural_note
  - marker: c
    text: Littéralement, la construction peut se rendre par « furent jugées et devinrent pécheresses ». Dans ce contexte judiciaire, elle peut signifier que le jugement les reconnut coupables.
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: s’ouvrit
  rationale: Le passif guèze exprime l’ouverture de l’abîme. Le passif français « fut ouvert » serait possible, mais « s’ouvrit » restitue naturellement la scène sans préciser l’agent.
- source_word: ማዕምቅ
  choice: profond abîme
  rationale: « Abîme » conserve la force apocalyptique du terme, tandis que « profond » en rend l’intensification.
- source_word: ምሉዕ እሳተ
  choice: plein de feu
  rationale: Traduction concrète et directe, qui conserve le collectif singulier « feu ».
- source_word: አምጽእዎሙ
  choice: On y amena
  rationale: Le verbe signifie faire venir ou amener. Le pronom indéfini maintient les agents implicites comme dans la source, et « y » rend explicite en français la destination immédiatement mentionnée.
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: ces brebis aveuglées
  rationale: « Aveuglées » garde la nuance possible d’un état produit antérieurement dans le récit symbolique, sans réduire l’expression à une déficience physique.
- source_word: ተኰነኑ
  choice: furent jugées
  rationale: Le verbe est judiciaire. « Jugées » n’anticipe pas à lui seul le verdict, exprimé par la proposition suivante.
- source_word: ወኮኑ ኃጥኣነ
  choice: reconnues comme pécheresses
  rationale: Dans cette séquence judiciaire, cette formulation rend la constatation de leur culpabilité sans suggérer que le jugement les aurait rendues pécheresses.
- source_word: ተወድዩ
  choice: jetées
  rationale: Le participe passif conserve le mouvement imposé et la tonalité du châtiment.
- source_word: ውዕዩ
  choice: elles brûlèrent
  rationale: La formulation active et brève suit la force de la proposition guèze sans ajouter l’idée d’une destruction complète.
- source_word: ዝንቱ ... ዝኩ
  choice: Cet abîme ... cette maison
  rationale: Le français ne distingue pas naturellement ici le démonstratif proche du démonstratif éloigné. La répétition de « cet/cette » reste naturelle, tandis que le contexte distingue clairement les deux référents.
- source_word: በየማኑ ለዝኩ ቤት
  choice: à droite de cette maison
  rationale: La relation spatiale demeure concrète et « maison » conserve le référent propre à la vision.
theological_decisions:
- issue: Nature de l’aveuglement des brebis dans l’allégorie
  choice: brebis aveuglées
  alternative: brebis aveugles
  rationale: Le participe peut signaler un état subi dans le déroulement de la vision. La traduction retenue conserve cette possibilité sans en imposer une interprétation doctrinale.
- issue: Rapport entre le jugement et le statut de pécheurs
  choice: furent jugées et reconnues comme pécheresses
  alternative: furent jugées et devinrent pécheresses
  rationale: La valeur déclarative convient au contexte judiciaire et évite de faire du jugement la cause de leur péché. Les deux étapes de la formule guèze restent néanmoins distinctes.
- issue: Portée symbolique des brebis
  choice: conservation de l’image sans identification ajoutée dans le verset
  alternative: remplacer les brebis par une désignation explicite des personnes représentées
  rationale: Le texte appartient à la vision animale et doit préserver son langage symbolique ainsi que son ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste narrative et solennelle sans archaïsmes. Les images apocalyptiques, les agents implicites et la succession judiciaire de la source sont conservés.
