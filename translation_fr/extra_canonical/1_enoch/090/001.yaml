  source_fidelity: 'La traduction rend correctement la structure temporelle, les trente-sept bergers, l’achèvement de périodes successives, la comparaison avec les précédents et la passation à d’autres bergers. Toutefois, « le troupeau » est ajouté au premier emploi de « faisaient paître » : l’objet n’est pas exprimé à cet endroit dans le texte guèze. Il convient de ne pas le préciser, afin de conserver la formulation elliptique de la vision.'
  naturalness: Le français est globalement soutenu et clair. « Reçurent entre leurs mains » n’est toutefois pas idiomatique en français moderne. « Reçurent en main » exprime naturellement la prise en charge tout en conservant l’image de la remise dans les mains, explicitée par la note.
