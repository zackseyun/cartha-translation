base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: fr
  text: Et je vis jusqu’au temps où trente-sept bergers faisaient paître de cette manière. Tous arrivèrent au terme de leur période, chacun en son temps, comme les précédents. Puis d’autres les reçurent en main[a], afin de les faire paître, chacun en son temps[b], chaque berger en son temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze de cette passation est très condensée. Elle indique qu’après l’achèvement de la période d’un groupe, d’autres reçoivent à leur tour ce qui leur est confié ; le référent exact du pronom « les » reste implicite.
    reason: textual_variant
  - marker: b
    text: La répétition du mot « temps » souligne que chaque berger exerce sa charge pendant une période distincte et limitée.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Conserve la formule habituelle du récit visionnaire, sans ajouter une nuance d’observation absente du verbe.
- source_word: እስከ ዘመን ዘከመዝ
  choice: jusqu’au temps où … de cette manière
  rationale: Rend à la fois la progression temporelle et la valeur démonstrative de ከመዝ (« ainsi », « de cette manière »), qui renvoie à la façon de faire paître décrite auparavant.
- source_word: ይርዕዩ
  choice: faisaient paître le troupeau
  rationale: Maintient l’image pastorale de l’allégorie animale. « Le troupeau » explicite en français l’objet sous-entendu par le contexte.
- source_word: ፴ወ፯ ኖላዊያን
  choice: trente-sept bergers
  rationale: Le nombre est écrit en toutes lettres pour la fluidité littéraire, et « bergers » préserve l’image symbolique sans l’interpréter.
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: Tous arrivèrent au terme de leur période, chacun en son temps
  rationale: Exprime naturellement l’achèvement successif des laps de temps attribués à chacun, sans faire du caractère « assigné » une certitude lexicale dans cette première proposition.
- source_word: ከመ ቀዳማዊያን
  choice: comme les précédents
  rationale: Renvoie simplement aux bergers mentionnés auparavant; cette formulation est naturelle et garde le rapport comparatif.
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: Puis d’autres les reçurent entre leurs mains
  rationale: Préserve l’image concrète de la remise « entre leurs mains » ainsi que le pronom du texte, dont le référent demeure implicite dans cette formulation comprimée.
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: pour les faire paître durant les périodes qui leur étaient assignées
  rationale: Rend la proposition de but, maintient la métaphore pastorale et explicite le caractère successif des périodes indiqué par le contexte.
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: chaque berger en son temps
  rationale: Conserve la formule distributive et répétitive qui souligne la succession des charges.
theological_decisions:
- issue: Nature des « bergers »
  choice: Conserver « bergers » sans explication interprétative dans le corps du texte
  alternative: anges, dirigeants ou surveillants
  rationale: Dans l’Apocalypse des animaux, ces bergers sont des figures symboliques investies d’une fonction de surveillance ou de jugement; le verset maintient toutefois l’image allégorique et ne désigne pas explicitement ce qu’ils représentent.
- issue: Caractère déterminé des périodes
  choice: Parler de périodes assignées tout en conservant la répétition « chacun en son temps »
  alternative: Traduire simplement par des moments indéfinis
  rationale: La répétition de ጊዜ avec une formulation distributive présente des périodes successives propres à chaque berger. La traduction exprime cette structure sans préciser par qui elles ont été fixées.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « temps » et l’image des bergers ont été conservées en raison de leur rôle structurel dans la vision. Les pronoms de la clause de passation n’ont pas été remplacés par une identification théologique explicite.
