revisions:
- from: Et je vis jusqu’au temps où trente-sept bergers faisaient paître le troupeau de cette manière. Tous arrivèrent au terme de leur période, chacun en son temps, comme les précédents. Puis d’autres les reçurent entre leurs mains[a] pour les faire paître durant les périodes qui leur étaient assignées[b], chaque berger en son temps.
  to: Et je vis jusqu’au temps où trente-sept bergers faisaient paître de cette manière. Tous arrivèrent au terme de leur période, chacun en son temps, comme les précédents. Puis d’autres les reçurent en main[a], afin de les faire paître, chacun en son temps[b], chaque berger en son temps.
  rationale: La révision retire l’objet ajouté « le troupeau », conserve l’ellipse du texte source et remplace le calque « entre leurs mains » par l’expression française idiomatique « en main ». Elle garde sans interprétation doctrinale les bergers et l’ambiguïté du pronom « les », signalée en note. La répétition source de « temps » est maintenue sans ajouter dans le texte que les périodes seraient « assignées ».
