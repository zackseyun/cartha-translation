base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: fr
  text: Et ces corbeaux combattaient et luttaient contre lui[a]. Ils voulaient lui enlever sa corne[b], mais ils ne réussirent pas à l’emporter sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec lui »; le contexte décrit toutefois un affrontement hostile.'
    reason: lexical_alternative
  - marker: b
    text: La « corne » est conservée comme image symbolique de la vision, sans être interprétée ici comme la force ou la puissance.
    reason: cultural_note
lexical_decisions:
- source_word: እልኩ
  choice: ces corbeaux
  rationale: Dans l’Apocalypse des animaux, l’espèce garde une fonction symbolique; « corbeaux » préserve cette image concrète plutôt que de généraliser en « oiseaux ».
- source_word: ቋዓት፡ ይትጋደሉ፡ ወይትባአሱ
  choice: combattaient et luttaient
  rationale: Les deux verbes de conflit sont maintenus afin de conserver l’intensification répétitive du récit visionnaire, dans un français naturel.
- source_word: ምስሌሁ
  choice: contre lui
  rationale: La préposition signifie littéralement « avec lui », mais les verbes de combat imposent ici une relation hostile; « contre lui » est la formulation française non ambiguë dans ce contexte.
- source_word: ፈቀዱ
  choice: voulaient
  rationale: Rend directement la volonté ou l’intention sans la renforcer en certitude d’action.
- source_word: ያእትቱ
  choice: lui enlever
  rationale: Le causatif exprime ici l’idée d’enlever ou de retirer. Le pronom « lui » produit une construction française naturelle avec « sa corne ».
- source_word: ቀርኖ
  choice: sa corne
  rationale: La corne est conservée littéralement comme élément de l’imagerie apocalyptique, sans l’interpréter comme puissance, force ou autorité.
- source_word: አእህሉዎ
  choice: ils ne réussirent pas à l’emporter sur lui
  rationale: Exprime l’échec des corbeaux à accomplir leur dessein tout en gardant la nuance de leur incapacité à vaincre leur adversaire.
theological_decisions:
- issue: Faut-il interpréter symboliquement la corne dans le corps du texte?
  choice: Conserver « sa corne » au sens littéral
  alternative: sa force; sa puissance; son autorité
  rationale: La vision communique au moyen d’une imagerie animale et symbolique continue. Expliciter le symbole dans la traduction dépasserait le libellé du témoin guèze et réduirait sa polysémie.
translation_notes:
  register: Français international moderne, clair et digne. La coordination « combattaient et luttaient » conserve la répétition intensive du guèze. Le passé descriptif suivi du passé simple respecte la progression narrative sans lourdeur.
