base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: fr
  text: Je vis tous les moutons qui étaient restés. Toutes les bêtes qui étaient sur la terre et tous les oiseaux du ciel se prosternaient devant ces moutons, leur adressaient des supplications et leur obéissaient en toute chose[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les entendaient en toute parole ». Ici, « entendre » a vraisemblablement le sens d’écouter avec déférence ou d’obéir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: Je vis
  rationale: Le verbe introduit le témoignage visionnaire à la première personne. « Je vis » est naturel, digne et fidèle à la narration apocalyptique.
- source_word: ኵሎሙ አባግዕ እለ ተርፉ
  choice: tous les moutons qui étaient restés
  rationale: Cette formulation conserve l’idée du reste après le jugement sans préciser indûment la nature de leur survie.
- source_word: ኵሉ እንስሳ ዘዲበ ምድር
  choice: toutes les bêtes qui étaient sur la terre
  rationale: « Bêtes » convient au registre animalier symbolique de la vision, tandis que « sur la terre » rend directement la relation spatiale.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: tous les oiseaux du ciel
  rationale: Expression biblique naturelle en français moderne, qui préserve le ton visionnaire.
- source_word: ይወድቁ ወይሰግዱ
  choice: se prosternaient devant
  rationale: Les deux verbes décrivent ensemble l’abaissement corporel. « Se prosternaient » restitue cette image sans imposer la notion plus forte d’adoration cultuelle.
- source_word: ለእልኩ አባግዕ
  choice: devant ces moutons
  rationale: Le démonstratif renvoie aux moutons restants déjà mentionnés; « devant » exprime naturellement la posture de soumission.
- source_word: ያስተበቍዕዎሙ
  choice: leur adressaient leurs supplications
  rationale: Le verbe exprime une requête insistante dans une attitude de dépendance. Cette tournure garde un registre digne sans être archaïque.
- source_word: ይሰምዕዎሙ በኵሉ ቃል
  choice: leur obéissaient en toute parole
  rationale: Le verbe signifie littéralement « entendre », mais peut désigner le fait d’écouter avec soumission. « En toute parole » maintient la formulation concrète et quelque peu inhabituelle du guèze.
theological_decisions:
- issue: Nature de la prosternation des bêtes et des oiseaux devant les moutons
  choice: Soumission exprimée par « se prosternaient », les supplications et l’obéissance
  alternative: Traduire le geste comme une adoration explicite
  rationale: La scène présente une soumission complète aux moutons exaltés, mais le texte ne contraint pas à employer le vocabulaire cultuel de l’adoration. La traduction préserve ainsi la tension de l’image sans lui imposer une catégorie théologique ultérieure.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase a été scindée afin de rendre visible la syntaxe du guèze : les moutons sont l’objet de « je vis », tandis que les bêtes et les oiseaux sont les sujets des verbes de prosternation, de supplication et d’obéissance.'
