base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: fr
  text: 'Et voici[a] : je vis tous les prisonniers, et ils se tinrent tous devant lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient liés » ou « les captifs ». Le terme guèze souligne qu’ils sont maintenus sous contrainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወናሁ
  choice: Et voici
  rationale: Conserve la formule déictique propre au récit visionnaire et son registre apocalyptique, plutôt que de la réduire à une simple liaison narrative.
- source_word: ኵሎሙ
  choice: tous
  rationale: Maintient l’insistance totalisante du terme, répété deux fois dans le verset.
- source_word: እሱራነ
  choice: les prisonniers
  rationale: Désigne des personnes liées ou détenues. « Prisonniers » est naturel en français et exprime leur état de détention sans préciser leur identité allégorique.
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend directement la formule de compte rendu visionnaire à la première personne; le passé simple convient au registre narratif soutenu du passage.
- source_word: ወቆሙ
  choice: et ils se tinrent
  rationale: Le verbe peut signifier se tenir debout, se tenir ou se lever. Dans cette scène judiciaire, « se tinrent » exprime naturellement leur comparution devant une autorité.
- source_word: ቅድሜሁ
  choice: devant lui
  rationale: Traduction directe qui préserve la posture de comparution, sans expliciter l’identité du référent masculin.
theological_decisions:
- issue: Identité et caractérisation du groupe détenu
  choice: Traduire እሱራነ par « les prisonniers » sans préciser dans le texte principal s’il s’agit d’étoiles, de bergers ou d’êtres angéliques fautifs.
  alternative: « ceux qui étaient liés » ou « les captifs »
  rationale: Le guèze les désigne ici par leur état de détention; leur identité allégorique relève du contexte plus large. La traduction conserve donc l’image immédiate et l’ambiguïté du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » conserve la solennité visionnaire; le passé simple maintient un registre littéraire accessible. La répétition de « tous » reproduit l’emphase de l’original.
