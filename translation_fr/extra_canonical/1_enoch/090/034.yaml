revisions:
- from: Et je regardai jusqu’à ce qu’ils déposent cette épée qui avait été donnée aux brebis. Ils l’apportèrent dans la maison et la scellèrent devant le Seigneur[a]. Toutes les brebis furent convoquées dans cette maison[b], mais elle ne pouvait pas les contenir[c].
  to: Et je vis jusqu’à ce qu’ils déposent cette épée qui avait été donnée aux brebis. Ils l’apportèrent dans la maison et la scellèrent devant le Seigneur[a]. Toutes les brebis furent convoquées dans cette maison[b], et elle ne les contenait pas[c].
  rationale: La révision supprime les deux explicitations interprétatives inutiles (« mais » et « pouvait »), restitue le verbe final de manière directe et emploie « je vis », plus approprié à la formule visionnaire. Les notes restent correctement ancrées et ne forcent aucune interprétation symbolique ou doctrinale.
