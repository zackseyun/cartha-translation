base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: fr
  text: Et je vis jusqu’à ce qu’ils déposent cette épée qui avait été donnée aux brebis. Ils l’apportèrent dans la maison et la scellèrent devant le Seigneur[a]. Toutes les brebis furent convoquées dans cette maison[b], et elle ne les contenait pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face du Seigneur », expression qui signifie « en présence du Seigneur ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le symbolisme de la vision, la « maison » peut évoquer le temple ou la demeure future du peuple de Dieu, mais le texte dit simplement « maison ».
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « elle ne les contenait pas ». Le sujet sous-entendu renvoie vraisemblablement à la maison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: ils déposent
  rationale: Le verbe exprime littéralement l’action de faire coucher ou de poser. Pour une épée, « déposer » rend naturellement la mise à l’écart de l’arme sans préciser davantage le geste.
- source_word: ሰይፍ
  choice: épée
  rationale: Rend directement l’arme concrète et conserve l’image apocalyptique.
- source_word: ተውህበ ለአባግዕ
  choice: avait été donnée aux brebis
  rationale: Le passif et l’antériorité par rapport au dépôt de l’épée sont clairement exprimés; « brebis » préserve la symbolique animale du récit.
- source_word: አግብእዎ ውስተ ቤት
  choice: Ils l’apportèrent dans la maison
  rationale: Le pronom reprend naturellement l’épée. « Apporter » convient à un objet sans ajouter l’idée non exprimée d’un retour.
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: la scellèrent devant le Seigneur
  rationale: « Sceller » conserve l’idée de fermeture ou de dépôt sécurisé. « Devant le Seigneur » rend en français courant l’idiome littéral « devant la face du Seigneur ».
- source_word: ተጸውዑ
  choice: furent convoquées
  rationale: Le passif est conservé, ainsi que la tonalité formelle du rassemblement.
- source_word: ወኢያገምሮሙ
  choice: mais elle ne pouvait pas les contenir
  rationale: Le verbe signifie directement « contenir ». Le féminin « elle » renvoie sans ambiguïté à la maison; « mais » explicite naturellement le contraste porté par la coordination.
theological_decisions:
- issue: Titre ለእግዚእ dans la scène visionnaire
  choice: le Seigneur
  alternative: le Maître
  rationale: « Le Seigneur » est le titre français usuel qui convient à la solennité de la scène sans introduire d’identification christologique particulière.
- issue: Interprétation symbolique de la maison
  choice: la maison
  alternative: le temple / la demeure eschatologique
  rationale: Le texte guèze dit simplement « maison ». La traduction conserve donc l’image sans imposer dans le corps du texte une interprétation symbolique discutée.
translation_notes:
  register: Français international moderne, digne et lisible. Les images concrètes de l’épée, des brebis et de la maison sont maintenues. La syntaxe a été légèrement segmentée pour la clarté, sans résoudre la portée symbolique de la maison.
