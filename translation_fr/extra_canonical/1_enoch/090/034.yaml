    rationale: Le guèze ወኢያገምሮሙ exprime directement « et elle ne les contenait pas » / « et elle ne les contenait point ». « Ne pouvait pas » interprète l’énoncé comme une incapacité et s’éloigne de la formulation verbale directe, sans nécessité.
  - severity: low
    issue: Contraste explicité par « mais »
    rationale: La conjonction source est simplement coordinative (« et »). Le contraste est contextuellement compréhensible, mais « et » préserve plus exactement l’enchaînement et l’ambiguïté rhétorique du texte.
  - severity: low
    issue: « Je regardai » plutôt que « je vis »
    rationale: La formule ወርኢኩ est plus directement rendue par « je vis » dans ce cadre visionnaire. « Je regardai » reste possible, mais « je vis » est plus fidèle et idiomatique ici.
