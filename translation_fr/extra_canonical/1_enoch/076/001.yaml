base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: fr
  text: Aux extrémités de la terre, je vis douze portes[a]. Elles étaient toutes ouvertes pour tous les vents[b], d’où les vents sortent et soufflent sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvertures ». Le terme guèze peut désigner des portes ou des ouvertures aménagées dans la structure du monde.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte transmis présente ici une difficulté de lecture. La traduction suit la compréhension : « et toutes ces portes étaient ouvertes pour tous les vents », plutôt que : « douze portes, ouvertes tout autour, pour tous les vents ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: አጽናፈ፡ ምድር
  choice: aux extrémités de la terre
  rationale: Cette expression désigne les limites extérieures du monde. « Aux extrémités de la terre » conserve la géographie cosmique de la vision dans un français naturel et digne.
- source_word: ርኢኩ
  choice: je vis
  rationale: Le passé simple convient au registre narratif français et rend directement la formule visionnaire à la première personne.
- source_word: ፲፪ኆኃተ
  choice: douze portes
  rationale: Le nom désigne des portes ou ouvertures structurées. « Portes » est clair en français et maintient l’imagerie architecturale sans imposer le sens moderne particulier de « portails ».
- source_word: ወእልኩ፡ ኃዋላው፡ ርኅዋተ
  choice: elles étaient toutes ouvertes
  rationale: En tenant compte de la correction textuelle signalée, la proposition reprend les douze portes et affirme qu’elles étaient toutes ouvertes, plutôt que de situer leur ouverture « tout autour ».
- source_word: ለኵሎሙ፡ ነፋሳት
  choice: pour tous les vents
  rationale: Dans ce contexte de cosmologie météorologique, ነፋሳት désigne les vents. La répétition de « tous » reflète l’étendue exprimée par le texte.
- source_word: እለ፡ እምኔሆሙ፡ ይወፅኡ፡ ነፋሳት
  choice: c’est par elles que les vents sortent
  rationale: La tournure française identifie clairement les portes comme les voies par lesquelles les vents émergent, tout en conservant le nom explicite « vents ».
- source_word: ወይነፍሱ፡ ዲበ፡ ምድር
  choice: et soufflent sur la terre
  rationale: Le verbe décrit ici l’action physique des vents. « Soufflent sur la terre » est idiomatique et fidèle au sens météorologique.
theological_decisions:
- issue: Faut-il rendre ነፋሳት par « vents » ou par « esprits » ?
  choice: vents
  alternative: esprits
  rationale: Bien que le champ sémantique puisse couvrir le vent, le souffle ou l’esprit, le contexte immédiat décrit les sorties cosmiques des vents et leur action sur la terre. « Vents » préserve donc le sens local sans importer une lecture spirituelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le ton visionnaire; la syntaxe a été légèrement segmentée pour rester claire à la lecture tout en préservant l’enchaînement du guèze.
