base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: fr
  text: Les trois premiers sont orientés vers l’est, trois vers le nord, trois, après ceux-ci, à gauche[a], vers le sud, et trois vers l’ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « après ceux-ci, à gauche » sont placés entre crochets dans le témoin éthiopien fourni, ce qui signale une incertitude textuelle. De plus, dans l’ancienne convention où l’on s’oriente en faisant face à l’est, la gauche correspond normalement au nord, et non au sud; la traduction conserve néanmoins les deux indications telles qu’elles figurent dans le texte.
    reason: textual_variant
lexical_decisions:
- source_word: ቀዳማያት
  choice: les trois premiers
  rationale: Le terme signifie ici « premiers » et qualifie explicitement le premier groupe de trois; il ne doit pas être absorbé dans la désignation de l’est.
- source_word: መንገለ
  choice: vers
  rationale: Répété devant les points cardinaux, ce terme exprime l’orientation ou la direction. « Vers » restitue naturellement cette fonction en français.
- source_word: ጽባሕ
  choice: l’est
  rationale: Le mot est lié au matin ou au lever du soleil, mais désigne ici la direction orientale.
- source_word: መስዕ
  choice: le nord
  rationale: Dans ce passage, le terme désigne le nord. Cette valeur est conservée sans l’intervertir avec le sud pour harmoniser la phrase.
- source_word: በድኅረ እሉ
  choice: après ceux-ci
  rationale: La locution poursuit l’énumération en situant ce groupe après les groupes déjà mentionnés.
- source_word: በፀጋም
  choice: à gauche
  rationale: Le texte emploie explicitement une indication relative de côté; elle est maintenue même si sa juxtaposition avec « sud » crée une difficulté d’orientation.
- source_word: አዜብ
  choice: le sud
  rationale: Le terme désigne ici le sud. La traduction préserve cette direction telle qu’elle apparaît dans le témoin fourni.
- source_word: ዓረብ
  choice: l’ouest
  rationale: Associé au soir ou au coucher du soleil, le mot fonctionne ici comme désignation de la direction occidentale.
theological_decisions:
- issue: Préserver ou harmoniser la tension entre « à gauche » et « vers le sud »
  choice: Conserver ensemble « à gauche » et « vers le sud »
  alternative: Supprimer « à gauche » ou remplacer « sud » par « nord » afin d’obtenir une orientation cohérente lorsqu’on fait face à l’est
  rationale: Le témoin fourni présente ces deux éléments ensemble. La traduction ne corrige pas silencieusement cette difficulté textuelle et spatiale, mais la signale en note.
translation_notes:
  register: Français international moderne, sobre et formel. La répétition de « trois » conserve le rythme de l’énumération. Les virgules maintiennent la formulation du témoin sans ajouter de tirets interprétatifs.
