base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: fr
  text: Par la deuxième porte, celle du milieu, sort l’abondance[a] ; d’elle viennent la pluie, les fruits, la paix et la rosée. Par la troisième porte, qui est orientée vers le sud, sortent le gel et la sécheresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze peut évoquer l’ampleur ou l’abondance. Une graphie très proche signifie « famine », mais cette dernière lecture s’accorde difficilement avec les bienfaits énumérés ensuite.
    reason: textual_variant
  - marker: b
    text: Ou « aridité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: porte
  rationale: Dans le Livre astronomique, le terme désigne les portes célestes par lesquelles sortent les phénomènes naturels. « Porte » conserve cette représentation cosmologique.
- source_word: ማእከላዊት
  choice: celle du milieu
  rationale: Cette formulation française naturelle indique la porte centrale dans une série, sans transformer l’adjectif en nom propre.
- source_word: ርኅብ
  choice: abondance
  rationale: Dans la transcription fournie, le mot évoque l’ampleur ou l’abondance et se distingue du terme très proche signifiant « famine ». « Abondance » s’accorde en outre avec la pluie, les fruits, la paix et la rosée qui suivent.
- source_word: ዝናም
  choice: pluie
  rationale: Équivalent météorologique direct et courant.
- source_word: ፍሬ
  choice: fruits
  rationale: Le pluriel français convient naturellement à la production agricole tout en conservant l’image concrète du texte.
- source_word: ሠላም
  choice: paix
  rationale: « Paix » est le sens principal du terme et préserve sa portée, même si le contexte peut aussi suggérer le bien-être ou la prospérité.
- source_word: ጤለ
  choice: rosée
  rationale: Équivalent précis dans cette liste de bienfaits liés à l’eau et à la fertilité.
- source_word: መንገለ መስዕ
  choice: orientée vers le sud
  rationale: La tournure rend naturellement l’orientation spatiale de la porte selon la lecture retenue de መስዕ.
- source_word: ቍር
  choice: gel
  rationale: Dans ce contexte climatique, « gel » désigne clairement le phénomène météorologique, sans imposer l’image plus étroite du givre.
- source_word: የብስ
  choice: sécheresse
  rationale: Le terme désigne l’état de ce qui est sec. « Sécheresse » est idiomatique et reste moins interprétatif que « sécheresse prolongée » ou « disette ».
theological_decisions:
- issue: Maintien de l’image cosmologique des portes
  choice: Conserver « porte » et répéter le verbe « sortir »
  alternative: Employer « ouverture » et reformuler par « apporte » ou « produit »
  rationale: Le passage décrit un cosmos structuré où les phénomènes sortent par des portes célestes. Garder cette image évite de réduire la vision apocalyptique à une simple description météorologique.
- issue: Sens de ሠላም dans une liste de bienfaits agricoles
  choice: paix
  alternative: bien-être ou prospérité
  rationale: Le contexte permet une nuance de bien-être, mais « paix » conserve l’étendue sémantique et la tension du terme sans l’expliquer à la place du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme et les répétitions du texte guèze, tout en employant une ponctuation naturelle en français.
