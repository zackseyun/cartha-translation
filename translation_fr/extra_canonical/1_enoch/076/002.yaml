base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: fr
  text: Trois d’entre elles sont ouvertes sur la face du ciel[a], trois à l’ouest, trois à la droite du ciel[b] et trois à la gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sur le devant du ciel»; dans ce système d’orientation cosmique, l’expression peut désigner l’est.
    reason: lexical_alternative
  - marker: b
    text: La droite et la gauche du ciel peuvent correspondre respectivement au sud et au nord, selon l’orientation présupposée par le texte.
    reason: cultural_note
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: Trois d’entre elles
  rationale: Le numéral accompagné de l’élément partitif et du pronom renvoie aux portes mentionnées auparavant; le féminin français reprend naturellement «portes».
- source_word: ርኅዋት
  choice: sont ouvertes
  rationale: Le terme décrit ces portes comme étant ouvertes, plutôt que de les désigner comme des «ouvertures» abstraites.
- source_word: በገጸ ሰማይ
  choice: sur la face du ciel
  rationale: La traduction conserve l’image cosmique corporelle de «face» tout en employant une préposition naturelle en français; «sur le devant du ciel» demeure une possibilité spatiale.
- source_word: በምዕራብ
  choice: à l’ouest
  rationale: Rendu directionnel direct, clair et idiomatique en français moderne.
- source_word: በየማነ ሰማይ
  choice: à la droite du ciel
  rationale: Le rendu littéral maintient la représentation corporelle et spatiale du ciel sans imposer l’interprétation «sud».
- source_word: በፀጋም
  choice: à la gauche
  rationale: Ce choix fait pendant à «à la droite du ciel» et préserve l’image du texte; le complément «du ciel» reste sous-entendu comme en guèze.
theological_decisions:
- issue: Faut-il remplacer les indications corporelles de l’espace cosmique par les points cardinaux?
  choice: Conserver «la droite» et «la gauche» du ciel dans le texte principal.
  alternative: Traduire respectivement par «le sud» et «le nord».
  rationale: Le guèze présente une cosmologie spatiale au moyen de termes corporels. Leur conservation respecte l’image et laisse ouverte la question de leur correspondance exacte avec les points cardinaux.
- issue: Sens spatial de «face du ciel»
  choice: Conserver l’expression imagée «face du ciel».
  alternative: Traduire par «devant du ciel» ou interpréter comme «à l’est».
  rationale: «Face» correspond directement au terme source et préserve l’ambiguïté entre image cosmique et orientation directionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive de l’énumération est conservée, ainsi que les images spatiales propres à la cosmologie apocalyptique.
