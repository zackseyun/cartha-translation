base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: fr
  text: Après ces vents, ils sortent en direction du sud par deux ouvertures ; par la première ouverture, qui s’incline vers l’est, sort un vent de mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un vent mortel ». « Un vent de mort » traduit plus littéralement l’expression guèze et en conserve la tonalité cosmique et menaçante.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: Après ces vents
  rationale: Cette expression marque la succession dans la description ordonnée des vents et maintient le lien avec ce qui précède.
- source_word: መንገለ አዜብ
  choice: en direction du sud
  rationale: መንገለ désigne ici une direction ou un côté. Cette formulation française est naturelle tout en conservant le repère cosmologique.
- source_word: በ፪ኆኅት
  choice: par deux ouvertures
  rationale: ኆኅት peut désigner une ouverture, une fenêtre ou un portail. « Ouvertures » évite de préciser indûment la forme de ces issues cosmiques.
- source_word: ቀዳሚት ኆኅት
  choice: la première ouverture
  rationale: L’adjectif ordinal féminin s’accorde directement avec ኆኅት.
- source_word: እምኔሆን እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: qui s’incline vers l’est
  rationale: Le relatif féminin singulier se rapporte à la première ouverture. Le partitif እምኔሆን est rendu implicitement par « la première » en français afin d’éviter une lourdeur sans modifier le sens.
- source_word: ነፋስ ሞት
  choice: un vent de mort
  rationale: La construction nominale est conservée afin de préserver la force sombre et cosmique de l’image apocalyptique.
theological_decisions:
- issue: Faut-il rendre ነፋስ ሞት par une tournure adjectivale plus idiomatique ?
  choice: un vent de mort
  alternative: un vent mortel
  rationale: La formulation nominale préserve la classification cosmique des vents et la tension saisissante de l’image, sans la réduire à une simple indication météorologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression spatiale du texte guèze, tout en adoptant une syntaxe française fluide. « Ouvertures » est préféré à « portes » pour ne pas surdéterminer ኆኅት.
