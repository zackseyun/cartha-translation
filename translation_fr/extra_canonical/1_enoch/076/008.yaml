base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: fr
  text: Et par l’ouverture centrale, qui se trouve à côté d’elle[a], sortent un parfum agréable[b], la rosée, la pluie, la paix[c] et la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « elle » renvoie vraisemblablement à l’ouverture mentionnée juste auparavant.
    reason: clarification_pronominale
  - marker: b
    text: 'Littéralement : « une bonne odeur » ; on peut aussi traduire « une odeur agréable ».'
    reason: lexical_alternative
  - marker: c
    text: « Paix » peut aussi désigner le bien-être ou l’intégrité, et non seulement l’absence de conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: ouverture
  rationale: Le mot désigne une ouverture ou une aperture. « Ouverture » convient à l’imagerie cosmique sans préciser indûment s’il s’agit d’une fenêtre ou d’une porte.
- source_word: እንተ ኃቤሃ ማእከላዊት
  choice: centrale, qui se trouve à côté d’elle
  rationale: Le féminin ማእከላዊት qualifie « ouverture », tandis que le suffixe féminin de ኃቤሃ renvoie vraisemblablement à l’ouverture mentionnée auparavant. Cette formulation préserve les deux relations.
- source_word: ይወፅእ እምኔሃ
  choice: sortent
  rationale: Le verbe exprime l’idée de sortir ou de provenir. En français, le pluriel s’accorde naturellement avec les différents éléments énumérés.
- source_word: መዐዛ ሠናይ
  choice: un parfum agréable
  rationale: L’expression associe un nom signifiant « odeur, parfum » à l’adjectif « bon, agréable ». « Parfum agréable » rend naturellement sa valeur positive.
- source_word: ጤለ
  choice: la rosée
  rationale: Dans cette énumération météorologique, « rosée » est le sens le plus probable.
- source_word: ዝናም
  choice: la pluie
  rationale: Il s’agit du terme courant pour la pluie.
- source_word: ሰላም
  choice: la paix
  rationale: « Paix » conserve la portée large et théologique du terme, qui peut aussi évoquer le bien-être et l’intégrité.
- source_word: ሕይወት
  choice: la vie
  rationale: La traduction directe « vie » garde la force culminante du dernier élément de l’énumération.
theological_decisions:
- issue: Faut-il limiter ሰላም à la prospérité matérielle dans cette liste de bienfaits météorologiques ?
  choice: la paix
  alternative: le bien-être ; la prospérité
  rationale: Le terme peut englober le bien-être et l’intégrité, mais « paix » préserve mieux sa portée sans le réduire à la seule prospérité agricole.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition des articles dans l’énumération rend la phrase claire, tandis que « sortent » conserve l’image de réalités provenant de l’ouverture cosmique.
