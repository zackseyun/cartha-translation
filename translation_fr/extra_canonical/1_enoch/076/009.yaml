  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: fr
  text: Par la troisième ouverture, du côté de l’ouest, sortent la rosée et la pluie, le givre[a] et la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pour « givre », certains comprennent « sauterelles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት
  choice: troisième
  rationale: Numéral ordinal déterminant l’ouverture.
- source_word: ኆኅት
  choice: ouverture
  rationale: Dans le Livre astronomique, le terme désigne une ouverture céleste; ce choix conserve l’image sans préciser indûment une architecture.
- source_word: መንገለ ምዕራብ
  choice: du côté de l’ouest
  rationale: Rend naturellement l’orientation spatiale indiquée par le guèze.
- source_word: ይወፅእ እምኔሃ
  choice: sortent
  rationale: Le verbe introduit une série de phénomènes issus de l’ouverture; l’accord pluriel est naturel en français.
- source_word: ጤለ
  choice: rosée
  rationale: Sens concret de légère humidité, cohérent avec l’emploi du mot dans les versets voisins.
- source_word: ዝናም
  choice: pluie
  rationale: Équivalent français direct du terme courant pour la pluie.
- source_word: አናጽዕ
  choice: givre
  rationale: Suit l’analyse retenue dans la couche anglaise révisée, où le terme désigne ici une forme de gel; l’identification avec les sauterelles demeure une variante lexicale notable.
- source_word: ደምሳሴ
  choice: destruction
  rationale: Le substantif issu de la racine exprimant l’action de détruire désigne la destruction ou la dévastation, et non la neige.
theological_decisions:
- issue: Nature de la série issue de l’ouverture occidentale
  choice: Conserver côte à côte des bienfaits météorologiques et la « destruction »
  alternative: Uniformiser toute la liste en phénomènes météorologiques
  rationale: Le texte source associe des éléments naturels à un terme de calamité; cette tension apocalyptique ne doit pas être effacée.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve l’image concrète d’éléments sortant d’une ouverture céleste et évite de transformer « destruction » en phénomène météorologique.
