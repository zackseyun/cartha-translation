base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: fr
  text: Et le premier vent, appelé le vent d’est, sort de ces portes par la première porte, qui est orientée vers l’est et inclinée vers le sud ; d’elle sortent la dévastation, la sécheresse, la mort[a] et la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions rendent ici le terme par « chaleur » ou « chaleur brûlante » afin d’harmoniser la liste avec des phénomènes climatiques ; le texte guèze transmis porte toutefois « mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: sort
  rationale: Rend simplement le mouvement du vent hors d’une porte et conserve la formule répétée du passage.
- source_word: ቀዳማይ ነፋስ
  choice: le premier vent
  rationale: Préserve l’ordre explicite de cette présentation structurée des vents.
- source_word: እምእልክቱ ኃዋሳው
  choice: de ces portes
  rationale: Maintient le pluriel et l’image cosmographique des portes, avec la valeur démonstrative du syntagme.
- source_word: ዘስሙ ጽባሓይ
  choice: son nom est le vent d’est
  rationale: Conserve la formule de dénomination tout en explicitant naturellement en français qu’il s’agit du vent oriental.
- source_word: በቀዳሚት ኆኅት
  choice: par la première porte
  rationale: « Porte » convient à l’image du contexte et « par » exprime naturellement le passage au travers de celle-ci.
- source_word: እንተ መንገለ ጽባሕ
  choice: celle qui est orientée vers l’est
  rationale: Rend la direction exprimée par መንገለ sans introduire l’idée moins exacte d’un « chemin de l’est ».
- source_word: ታጸንኑ ለአዜብ
  choice: se tournant vers le sud
  rationale: Expression française naturelle qui garde le mouvement ou l’inclinaison directionnelle du syntagme difficile.
- source_word: ድምሳሴ
  choice: la dévastation
  rationale: Restitue la gravité du terme dans cette liste apocalyptique de calamités.
- source_word: ናብስት
  choice: la sécheresse
  rationale: Dans le contexte des effets nuisibles des vents, « sécheresse » donne le sens concret attendu.
- source_word: ሞት
  choice: la mort
  rationale: Le texte transmis porte clairement le mot guèze signifiant « mort » ; il ne faut pas le remplacer par une calamité météorologique supposée.
- source_word: ሐጕል
  choice: la destruction
  rationale: Terme suffisamment large pour préserver la portée funeste du dernier élément malgré sa nuance exacte incertaine.
theological_decisions:
- issue: Nature de la liste des effets du vent
  choice: Conserver la série de calamités, y compris la mort, dans son registre cosmologique et apocalyptique
  alternative: Ramener la liste à de simples phénomènes météorologiques en traduisant notamment « chaleur »
  rationale: Le texte présente les vents comme des éléments de l’ordre cosmique capables d’apporter des désastres. Le mot transmis ሞት signifie « mort » et la tension entre phénomènes naturels et conséquences mortelles doit rester visible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été légèrement segmentée pour en faciliter la lecture, tout en conservant l’enchaînement des portes, des directions et des calamités. Le marqueur [a] figure immédiatement après « mort », le mot concerné.
