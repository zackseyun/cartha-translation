base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: fr
  text: Après ceux-ci viennent les vents du sud — dont le nom est « Mer » et qui sortent de la septième ouverture, celle qui est tournée vers l’est — ; de celle-ci sort la rosée.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Le numéral peut aussi être compris comme « sept » : « des sept ouvertures ». Toutefois, le pronom final est féminin singulier (« d’elle »), ce qui favorise la référence à une seule ouverture.'
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: Après ceux-ci
  rationale: Rend la succession dans l’exposé ordonné, tout en conservant le référent implicite du démonstratif.
- source_word: ነፋሳት
  choice: les vents
  rationale: Dans ce contexte météorologique et cosmographique, le terme désigne naturellement les vents plutôt que des esprits.
- source_word: ዘመንገለ መስዕ
  choice: du sud
  rationale: Exprime l’origine ou le secteur auquel appartiennent ces vents.
- source_word: ዘስሙ ባሕር
  choice: dont le nom est « Mer »
  rationale: Conserve littéralement la formule de dénomination cosmologique sans l’interpréter comme un composé tel que « vent marin ».
- source_word: ወዘወፅአ
  choice: et qui sortent
  rationale: Rend la proposition relative liée aux vents; l’accord pluriel français assure une syntaxe naturelle malgré l’instabilité du passage transmis.
- source_word: እም፯ኆኅት
  choice: de la septième ouverture
  rationale: Le signe numéral ፯ peut se lire ici comme ordinal selon la syntaxe transmise et la consultation anglaise; cette lecture reste signalée comme textuellement délicate.
- source_word: እንተ መንገለ ምሥራቅ
  choice: celle qui est tournée vers l’est
  rationale: Localise l’ouverture par son orientation sans préciser davantage le modèle spatial.
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: et la rosée en sort
  rationale: Respecte le verbe au masculin singulier avec « rosée » pour sujet et le suffixe féminin singulier renvoyant à l’ouverture; aucun « comme » n’est ajouté.
theological_decisions:
- issue: Formule cosmologique désignant le vent du sud
  choice: Conserver littéralement « dont le nom est “Mer” »
  alternative: Traduire « le vent marin » ou omettre la formule comme ajout secondaire
  rationale: La traduction maintient l’imagerie et la nomenclature apocalyptiques anciennes sans les normaliser ni trancher silencieusement la difficulté textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La construction avec incise conserve l’étrangeté du texte cosmologique tout en restant lisible. Les guillemets autour de « Mer » indiquent qu’il s’agit d’un nom propre ou d’une désignation, non de la mer au sens ordinaire.
