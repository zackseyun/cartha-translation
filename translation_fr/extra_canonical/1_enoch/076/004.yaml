base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: fr
  text: C’est par quatre d’entre elles[b] que sortent des vents de bénédiction et de paix, et de ces huit sortent des vents de châtiment[a]. Lorsqu’ils sont envoyés, ils dévastent toute la terre, l’eau qui est sur elle, tous ceux qui y habitent et tout ce qui se trouve dans l’eau et sur la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vents de fléau » ou « des vents d’affliction ». Le mot guèze évoque une atteinte destructrice ayant valeur de châtiment.
    reason: lexical_alternative
  - marker: b
    text: La transcription fournie porte littéralement « par trois d’entre elles », mais le chiffre est probablement une confusion entre les chiffres guèzes ፫ (trois) et ፬ (quatre). La répartition détaillée du chapitre suppose quatre ouvertures de bénédiction et huit de châtiment.
    reason: textual_variant
lexical_decisions:
- source_word: በ፬እምኔሆሙ (lecture corrigée du በ፫እምኔሆሙ transcrit)
  choice: Par quatre d’entre elles
  rationale: La structure du chapitre exige quatre ouvertures bénéfiques et huit destructrices, soit douze au total. « Par » rend la valeur instrumentale ou traversante de በ, distincte du simple point d’origine exprimé ensuite par እም.
- source_word: ይወፅኡ
  choice: sortent
  rationale: Verbe naturel en français pour le mouvement des vents hors des ouvertures, sans alourdir par « prennent leur essor » ou « émanent ».
- source_word: ነፋሳት
  choice: vents
  rationale: Le contexte cosmologique et météorologique des ouvertures célestes favorise « vents » plutôt que « esprits ».
- source_word: በረከት ወሰላም
  choice: bénédiction et paix
  rationale: Cette formulation conserve les deux notions positives du guèze et la dignité religieuse du passage.
- source_word: እምእልኩ ሰማንቱ
  choice: de ces huit-là
  rationale: Le démonstratif renvoie au groupe de huit déjà déterminé dans la description; « -là » rend ce renvoi explicite sans ajouter de nom absent du texte.
- source_word: መቅሠፍት
  choice: châtiment
  rationale: Le terme désigne une atteinte punitive et destructrice. « Châtiment » exprime clairement cette dimension, tandis que « fléau » pourrait être compris comme une calamité impersonnelle.
- source_word: ሶበ ይትፈነዉ
  choice: Lorsqu’ils sont envoyés
  rationale: Le passif et l’idée de mise en mouvement sont conservés, sans préciser l’agent que le texte ne nomme pas.
- source_word: ይደመስስዋ
  choice: ils dévastent
  rationale: « Dévastent » restitue directement la force destructrice du verbe et s’intègre naturellement à la série de compléments.
- source_word: ለኵላ ምድር ወማይ ዘዲቤሃ
  choice: toute la terre, ainsi que l’eau qui est sur elle
  rationale: La formulation maintient l’association inhabituelle entre la terre et l’eau située sur elle, sans normaliser silencieusement la cosmologie du texte.
- source_word: ኵሉ እለ የኃድሩ ዲቤሃ
  choice: tous ceux qui y habitent
  rationale: Expression française courante et digne qui conserve la totalité des habitants visés.
- source_word: ኵሉ ዘሀሎ ውስተ ማይ ወዲበ የብስ
  choice: tout ce qui se trouve dans l’eau et sur la terre ferme
  rationale: Le contraste entre eau et sol sec est préservé, ainsi que la portée universelle de la destruction.
theological_decisions:
- issue: Faut-il traduire ነፋሳት par « vents » ou par « esprits » ?
  choice: vents
  alternative: esprits
  rationale: Les forces décrites sortent d’ouvertures organisées selon les directions du cosmos; le sens météorologique est donc premier. « Esprits » personnaliserait indûment l’image.
- issue: Comment rendre la dimension punitive de መቅሠፍት ?
  choice: vents de châtiment
  alternative: vents de fléau / vents d’affliction
  rationale: « Châtiment » garde l’idée d’une destruction punitive sans introduire une doctrine particulière sur son agent ou sa finalité.
- issue: Faut-il corriger le chiffre trois transmis par la transcription fournie ?
  choice: quatre
  alternative: trois
  rationale: 'La correction paléographique ፬ au lieu de ፫ est soutenue par la structure explicite du chapitre: quatre ouvertures produisent les vents bénéfiques et huit les vents destructeurs. La variante transcrite demeure signalée en note afin de ne pas masquer l’état de la source fournie.'
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement élevée, mais demeure naturelle. L’étrange image de « l’eau qui est sur [la terre] » est conservée pour respecter la cosmologie du texte. Le marqueur [a] est placé après « châtiment » et [b] après la proposition cosmologique concernée.
