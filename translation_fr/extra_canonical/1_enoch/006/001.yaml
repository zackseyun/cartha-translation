base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: fr
  text: Et il arriva[a] que, lorsque les enfants des hommes se furent multipliés en ces jours-là, il leur naquit des filles belles et gracieuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les fils des hommes ». L’expression guèze est une désignation conventionnelle des êtres humains et prépare le contraste avec les Veilleurs dans les versets suivants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ
  choice: Et il arriva
  rationale: Formule narrative élevée qui ouvre un nouvel épisode, tout en restant naturelle et intelligible en français moderne.
- source_word: እምዘ በዝኁ
  choice: lorsque ... se furent multipliés
  rationale: Rend la circonstance temporelle ainsi que l’accroissement numérique antérieur à la naissance des filles.
- source_word: ውሉደ ሰብእ
  choice: les enfants des humains
  rationale: Conserve l’expression anthropologique et son contraste avec les Veilleurs, sans imposer un sens exclusivement masculin.
- source_word: በእማንቱ መዋዕል
  choice: en ces jours-là
  rationale: Formule temporelle caractéristique du récit apocalyptique, naturelle dans un registre français digne.
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: il leur naquit des filles
  rationale: Reproduit avec concision la construction de naissance et maintient « filles », important pour la suite du récit.
- source_word: ሠናያት
  choice: belles
  rationale: Exprime directement la beauté physique dans un français actuel.
- source_word: ወላሕያት
  choice: gracieuses
  rationale: Préserve le second adjectif et l’effet cumulatif sans répéter simplement l’idée de beauté.
theological_decisions:
- issue: Expression anthropologique mise en contraste avec les êtres célestes
  choice: les enfants des humains
  alternative: les fils des hommes
  rationale: Le contexte oppose la descendance humaine aux Veilleurs. Cette traduction maintient le contraste et la portée collective de l’expression sans la restreindre aux hommes de sexe masculin.
translation_notes:
  register: Français international moderne, digne et narratif. La tournure « Et il arriva » conserve la solennité apocalyptique; « en ces jours-là » maintient la formule temporelle traditionnelle. Le double qualificatif du texte source est préservé.
