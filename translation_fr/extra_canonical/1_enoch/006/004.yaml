  to: 'Tous lui répondirent : « Jurons tous un serment et lions-nous tous par une malédiction mutuelle[a], afin de ne pas revenir sur ce projet[b], mais d’accomplir cet acte. »'
  rationale: La révision remplace une construction française ambiguë par « se lier par une malédiction mutuelle », qui rend le pacte collectif et réciproque sans ajouter d’interprétation doctrinale. Elle améliore l’attaque narrative, replace l’ancre de note sur l’expression qu’elle explique et neutralise une affirmation textuelle insuffisamment établie dans la note b.
