base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: fr
  text: 'Tous lui répondirent : « Jurons tous un serment et lions-nous tous par une malédiction mutuelle[a], afin de ne pas revenir sur ce projet[b], mais d’accomplir cet acte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le guèze associe « jurer un serment » et « se lier par une malédiction » : cette formule redoublée souligne la solennité de leur pacte mutuel.'
    reason: lexical_alternative
  - marker: b
    text: La fin du texte répète les termes (« ce projet… cet acte/action »). La traduction conserve le passage de la décision à son exécution.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥኡ
  choice: répondirent
  rationale: Verbe narratif introduisant la réponse collective ; « répondirent » conserve le ton formel du récit.
- source_word: መሐላ፡ ንምሐል
  choice: Jurons tous un serment
  rationale: La répétition du nom et du verbe est maintenue pour rendre la formule emphatique du guèze, malgré son caractère marqué en français.
- source_word: ናውግዝ፡ ኵልነ፡ በበይናቲነ
  choice: lions-nous tous les uns les autres par une malédiction
  rationale: Cette formulation exprime un engagement réciproque garanti par une imprécation, plutôt qu’une simple injure ou malédiction prononcée contre autrui.
- source_word: ከመ፡ ኢንምጠ
  choice: afin de ne pas revenir sur
  rationale: « Revenir sur » rend naturellement en français l’idée d’un retrait volontaire après un engagement, sans l’aplatir en simple échec.
- source_word: ለዛቲ፡ ምክር
  choice: ce projet
  rationale: Le terme peut désigner un conseil, un dessein ou un projet ; ici, « projet » renvoie clairement à la décision collective envisagée.
- source_word: ንግብራ፡ ለዛቲ፡ [ምክር፡] ግብር
  choice: accomplir cet acte
  rationale: La traduction conserve le passage du projet à son exécution et le poids solennel de l’acte, tout en évitant de reproduire lourdement la répétition textuelle incertaine.
theological_decisions:
- issue: Nature du serment mutuel des Veilleurs
  choice: Un pacte contraignant renforcé par une malédiction réciproque
  alternative: Une simple promesse ou une malédiction générale dépourvue de valeur d’engagement
  rationale: L’association du serment et de la malédiction présente une conspiration solennelle par laquelle chacun s’oblige envers les autres ; cette portée judiciaire et morale doit rester explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure marquée « jurer un serment » est volontairement conservée afin de refléter l’emphase de l’original ; « revenir sur ce projet » exprime naturellement le fait de se retirer d’un engagement déjà pris.
