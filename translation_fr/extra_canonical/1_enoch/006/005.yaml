translation:
  language: fr
  text: Alors ils jurèrent tous ensemble et se lièrent mutuellement par une malédiction à ce sujet[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’engagèrent mutuellement sous peine de malédiction à ce sujet ».'
    reason: La tournure peut désigner le fait de se lier réciproquement par une malédiction ou de s’engager sous peine de malédiction.
lexical_decisions:
- source_word: አሜሃ
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: መሐሉ
  choice: ils jurèrent
  rationale: Le verbe signifie « jurer, prêter serment » dans ce contexte, et non simplement « parler ».
- source_word: ኵሎሙ፡ ኅቡረ
  choice: tous ensemble
  rationale: Conserve l'insistance du texte sur l'unanimité et l'action collective.
- source_word: ወአውገዙ
  choice: et se lièrent … par une malédiction
  rationale: Rend la force d'un engagement assorti d'une malédiction, plutôt qu'une simple promesse.
- source_word: በበይናቲሆሙ
  choice: les uns les autres
  rationale: Exprime explicitement la réciprocité de leur engagement.
- source_word: ቦቱ
  choice: à ce sujet
  rationale: Renvoie au projet évoqué dans le contexte immédiat sans préciser davantage l'objet du pronom.
theological_decisions:
- issue: Nature de l'engagement collectif
  choice: se lièrent les uns les autres par une malédiction
  alternative: s'engagèrent mutuellement sous peine de malédiction
  rationale: La formulation retenue préserve à la fois la réciprocité et la force imprécatoire du pacte, sans réduire le second verbe à un simple synonyme de « jurer ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des idées de serment et de lien sous malédiction est maintenue parce qu'elle correspond à deux verbes distincts dans le texte guèze.
