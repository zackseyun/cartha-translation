base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: fr
  text: 'Et Semyaza, qui était leur chef[a], leur dit : « Je crains que vous ne consentiez pas à accomplir cet acte et que je sois seul à devoir répondre[b] d’un grand péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze traduit par « chef » signifie plus littéralement « leur ange » ou « leur messager » ; dans ce contexte, il présente Semyaza comme celui qui dirige le groupe.
    reason: lexical_alternative
  - marker: b
    text: « Devoir répondre » peut aussi se traduire par « payer la peine » ou « être tenu pour responsable » ; le terme exprime une responsabilité morale assortie d’une possible sanction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Le nom propre est translittéré directement d’après le témoin guèze.
- source_word: መልአኮሙ
  choice: leur chef
  rationale: Le mot est apparenté à « ange » ou « messager », mais désigne ici la fonction de Semyaza à la tête du groupe; « chef » reste naturel tout en signalant cette nuance en note.
- source_word: እፈርህ
  choice: Je crains
  rationale: Rend directement la première personne du verbe de crainte et conserve l’hésitation de Semyaza.
- source_word: ኢትፍቅዱ
  choice: vous ne consentiez pas
  rationale: Le verbe porte sur le consentement ou la volonté, non sur la simple capacité; la tournure après « je crains que » est idiomatique en français.
- source_word: ይትገበር ዝንቱ ግብር
  choice: à accomplir cet acte
  rationale: « Accomplir » exprime la mise à exécution, tandis que « acte » conserve la portée large et solennelle de ግብር.
- source_word: ባሕቲትየ
  choice: moi seul
  rationale: Conserve l’insistance sur la responsabilité solitaire de Semyaza.
- source_word: ፈዳዪ
  choice: avoir à répondre de
  rationale: Cette formulation française exprime la responsabilité juridico-morale et laisse ouverte la nuance possible de subir la peine.
- source_word: ለኃጢአት ዐባይ
  choice: d’un grand péché
  rationale: Rendu transparent qui préserve la gravité morale de l’expression guèze.
theological_decisions:
- issue: Fonction de Semyaza par rapport aux autres Veilleurs
  choice: leur chef
  alternative: leur ange / leur messager
  rationale: Dans le contexte, Semyaza dirige le groupe. La traduction fonctionnelle évite de suggérer qu’il serait l’ange personnel des autres, tandis que la note préserve le sens littéral possible.
- issue: Nature de la conséquence redoutée
  choice: avoir à répondre d’un grand péché
  alternative: payer la peine d’un grand péché / être tenu pour responsable d’un grand péché
  rationale: Le texte possède une force à la fois morale et juridique. La formulation choisie n’impose ni une simple culpabilité abstraite ni une peine précisément définie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité du discours sans calque inutile; la reprise « moi seul, je » marque naturellement l’emphase du guèze.
