base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/006.yaml
  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
translation:
  language: fr
  text: Ils étaient deux cents en tout, et ils descendirent sur Ardis[a], qui est le sommet du mont Hermon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme et la vocalisation exactes du nom de lieu « Ardis » sont incertaines; le texte guèze le présente comme le sommet du mont Hermon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: en tout
  rationale: Avec le nombre « deux cents », cette tournure exprime naturellement en français la totalité du groupe sans alourdir la phrase.
- source_word: ክልኤ ምእት
  choice: deux cents
  rationale: Traduction directe de l’expression numérique.
- source_word: ወወረዱ
  choice: ils descendirent
  rationale: Le verbe marque explicitement un mouvement vers le bas; « descendirent » conserve cette dimension verticale et convient au registre narratif.
- source_word: ውስተ
  choice: sur
  rationale: Dans ce contexte topographique, où Ardis est identifié au sommet d’une montagne, « sur » rend l’arrivée en un lieu élevé plus naturellement que « dans ».
- source_word: አርዲስ
  choice: Ardis
  rationale: Le nom de lieu est translittéré plutôt que traduit; sa vocalisation exacte demeure incertaine.
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: qui est le sommet du mont Hermon
  rationale: La proposition relative identifie Ardis au point culminant du mont Hermon; « sommet » est précis, digne et courant.
theological_decisions:
- issue: Le mouvement descendant des Veilleurs
  choice: ils descendirent
  alternative: ils vinrent en bas
  rationale: « Ils descendirent » préserve clairement le mouvement vertical et l’imagerie cosmique du récit sans ajouter d’interprétation doctrinale.
