base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: fr
  text: 'Les anges, les fils du ciel, les virent[a] et les désirèrent. Ils se dirent entre eux : « Allons, choisissons-nous des femmes parmi les enfants des hommes[b] et engendrons des enfants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « les » renvoie aux femmes mentionnées au verset précédent ; le guèze ne répète pas ici le mot « femmes ».
    reason: cross_reference
  - marker: b
    text: Littéralement « parmi les enfants des hommes » ; on pourrait aussi traduire « parmi les humains ». Cette expression élevée souligne le contraste avec les « fils du ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: les virent
  rationale: Le verbe exprime simplement le fait de voir, et le pronom objet féminin pluriel renvoie aux femmes du verset précédent sans les nommer de nouveau.
- source_word: መላእክት ውሉደ ሰማያት
  choice: les anges, les fils du ciel
  rationale: Les deux désignations explicites sont conservées en apposition, sans les fusionner ni en supprimer une.
- source_word: ወፈተውዎን
  choice: les désirèrent
  rationale: Le verbe marque un désir fort. « Désirèrent » laisse le contexte indiquer sa portée sexuelle sans renforcer le texte par « convoitèrent ».
- source_word: በበይናቲሆሙ
  choice: se dirent entre eux
  rationale: Formulation française naturelle pour une parole échangée au sein du groupe.
- source_word: ንዑ
  choice: Allons
  rationale: En français moderne, « Allons » rend naturellement l'exhortation qui introduit la décision commune.
- source_word: ንሕረይ ለነ አንስተ
  choice: choisissons-nous des femmes
  rationale: Le verbe signifie choisir ou sélectionner; dans ce contexte d'union et de descendance, « femmes » convient sans imposer prématurément le statut juridique d'épouses.
- source_word: እምውሉደ ሰብእ
  choice: parmi les enfants des hommes
  rationale: La tournure élevée est maintenue afin de préserver le contraste entre les fils du ciel et la descendance humaine.
- source_word: ወንለድ ለነ ውሉደ
  choice: engendrons-nous des enfants
  rationale: « Engendrer » correspond précisément à la procréation exprimée et conserve le réfléchi d'intérêt « pour nous » sous une forme française concise.
theological_decisions:
- issue: Identification des êtres comme anges et fils du ciel
  choice: Conserver « les anges, les fils du ciel » en apposition.
  alternative: Réduire à « les anges », à « les fils du ciel », ou fusionner en « les anges célestes ».
  rationale: Le guèze donne expressément les deux appellations; leur maintien préserve la manière dont le récit identifie ces êtres sans résoudre ou aplanir son anthropologie surnaturelle.
- issue: Force sexuelle du verbe de désir
  choice: Employer « les désirèrent ».
  alternative: Employer « les convoitèrent » ou « tombèrent amoureux d'elles ».
  rationale: Le contexte implique une union sexuelle, mais le verbe lui-même exprime le désir sans exiger soit une condamnation lexicale plus explicite, soit une coloration romantique.
- issue: Statut des femmes choisies
  choice: Employer « des femmes ».
  alternative: Employer « des épouses ».
  rationale: Le contexte peut orienter vers une prise pour épouses, mais le nom peut désigner des femmes. La formulation retenue évite de préciser davantage que le texte tout en laissant la suite exprimer le projet d'union et de descendance.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe française identifie clairement les anges comme sujets des verbes. Le parallélisme « les fils du ciel / les enfants des hommes » est volontairement conservé; « engendrons » maintient la solennité apocalyptique sans archaïsme excessif.
