base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: fr
  text: À tous égards, elle surpassait tout par sa splendeur, sa gloire et sa grandeur[a], au point que je suis incapable de vous décrire sa splendeur et sa grandeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « elle débordait de splendeur, de gloire et de grandeur ». Le verbe peut évoquer une abondance extraordinaire, mais le sens de supériorité, « surpasser », convient mieux ici.'
    reason: lexical_alternative
  - marker: b
    text: Le possessif « sa » renvoie probablement à la structure céleste décrite dans la vision, sans exclure que sa splendeur se confonde avec celle de la présence divine.
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ፡ ይፈደፍድ
  choice: À tous égards, elle surpassait tout
  rationale: በኵሉ exprime l’étendue (« à tous égards »), tandis que la forme verbale intensive ይፈደፍድ indique ici la supériorité ou le dépassement. Cette formulation suit le sens attesté par le parallèle grec plutôt que l’ancienne lecture « tout autour débordait ».
- source_word: በስብሐት
  choice: en splendeur
  rationale: Dans cette vision céleste, le terme désigne une magnificence éclatante plutôt qu’une louange prononcée. « Splendeur » le distingue de ክብር.
- source_word: በክብር
  choice: en gloire
  rationale: « Gloire » rend la dignité manifeste et le poids majestueux du terme, tout en maintenant la série de trois substantifs.
- source_word: በዕበይ
  choice: en grandeur
  rationale: Le mot exprime la grandeur ou l’élévation. Sa répétition à la fin du verset est conservée.
- source_word: እስከ፡ ኢይክል
  choice: au point que je suis incapable
  rationale: La construction marque le degré et son résultat. Le sujet à la première personne est confirmé par l’analyse contextuelle et le parallèle grec.
- source_word: ዜንዎተክሙ
  choice: de vous décrire
  rationale: Dans cette forme et ce contexte, le passage signifie qu’Énoch ne peut exposer ou raconter la vision à ses destinataires, non que leurs yeux ne peuvent la regarder.
- source_word: በእንተ፡ ስብሐቲሁ፡ ወበእንተ፡ ዕበዩ
  choice: sa splendeur et sa grandeur
  rationale: Le possessif garde le référent implicite du guèze et reproduit les deux qualités nommées dans la proposition finale sans ajouter un sujet explicite.
theological_decisions:
- issue: Référent du suffixe de troisième personne dans « sa splendeur et sa grandeur »
  choice: Maintenir le possessif « sa » sans expliciter le référent
  alternative: Nommer soit la demeure céleste, soit la présence divine
  rationale: Le guèze ne répète pas le référent. Dans le contexte, il peut s’agir de la structure visionnaire, tandis que sa splendeur peut se confondre avec celle de la présence divine. L’indétermination est donc préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « splendeur » et « grandeur » est maintenue pour refléter le texte source. Le féminin « elle » suppose le référent contextuel « la demeure » ou « la maison » décrit dans les versets voisins, tandis que la note préserve l’ambiguïté de la splendeur visionnaire.
