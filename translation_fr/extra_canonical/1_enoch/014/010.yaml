base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: fr
  text: J’entrai dans la langue de feu[a] et je m’approchai d’une grande maison bâtie de grêlons. Le toit de cette maison ressemblait à une mosaïque de grêlons[b], et son sol était de grêle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la langue du feu »; l’expression évoque une forme de flamme sans remplacer l’image propre au texte.'
    reason: literal_rendering
  - marker: b
    text: Le mot traduit par « toit » est difficile dans ce témoin; il pourrait désigner une autre partie ou surface de la maison. La « mosaïque » évoque un assemblage de dalles ou de pierres, non nécessairement une mosaïque de verre au sens moderne.
    reason: textual_variant
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: la langue de feu
  rationale: Conserve l’image concrète et étrange du guèze ልሳን, « langue », sans la banaliser en « flamme ».
- source_word: ቤት ዓቢይ
  choice: une grande maison
  rationale: Rend directement le sens large de ቤት et évite de préciser sans nécessité « temple », « palais » ou « salle ».
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: bâtie de grêlons
  rationale: Expression française naturelle qui maintient l’image saisissante d’une construction faite de pierres de grêle.
- source_word: አረፍተ ውእቱ ቤት
  choice: le toit de cette maison
  rationale: Suit l’analyse révisée du terme comme désignant la couverture supérieure de la maison, tout en signalant en note l’incertitude du témoin.
- source_word: ከመ ጸፍጸፈ ሳሌዳት በእእባን ዘእምበረድ
  choice: ressemblait à une mosaïque de grêlons
  rationale: « Mosaïque » transmet de façon accessible l’idée d’un assemblage ornemental ou tessellé, sans introduire le mot contradictoire « sol » dans la description du toit.
- source_word: ምድረ በረድ
  choice: son sol était de grêle
  rationale: Dans une maison, ምድር désigne naturellement le sol; « de grêle » conserve la matérialité insolite de la vision.
theological_decisions:
- issue: Normalisation de l’architecture visionnaire en langage cultuel
  choice: Conserver « grande maison » ainsi que les images de feu, de grêlons et de grêle.
  alternative: Employer « temple » ou « palais » et reformuler les matériaux comme de la glace ou du cristal.
  rationale: Le verset décrit la vision sans nommer explicitement un temple ou un palais. La traduction ne doit ni harmoniser l’image avec une architecture religieuse familière ni atténuer son étrangeté apocalyptique.
- issue: Identification de l’élément architectural difficile
  choice: Traduire « le toit », avec une note signalant l’incertitude textuelle.
  alternative: « les murs », « la paroi », « l’intérieur » ou « le plafond ».
  rationale: La donnée fournie privilégie finalement la couverture supérieure, mais la forme transmise demeure assez difficile pour que les autres possibilités ne soient pas dissimulées.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit visionnaire écrit; la syntaxe reste fluide, tandis que les images concrètes et délibérément étranges du texte sont préservées.
