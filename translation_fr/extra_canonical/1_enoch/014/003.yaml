base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: fr
  text: De même qu’il a créé les humains et leur a donné de comprendre la parole de connaissance[a], de même il m’a créé et m’a donné de réprimander les Veilleurs[b], fils du ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole de compréhension ». L’expression éthiopienne associe « parole » à « connaissance » ou « intelligence ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les vigilants » ou « ceux qui restent éveillés »; « les Veilleurs » est le nom traditionnel de ces êtres célestes dans 1 Hénoch.
    reason: lexical_alternative
  - marker: c
    text: 'La transcription éthiopienne de cette proposition est difficile et paraît altérée. Elle est ici comprise comme disant que Dieu a créé le narrateur et lui a confié la mission de réprimander les Veilleurs; une autre analyse donne: « il m’a donné une réprimande pour les Veilleurs ».'
    reason: textual_variant
lexical_decisions:
- source_word: ሰብእ
  choice: les humains
  rationale: Le nom collectif désigne ici l’humanité; « les humains » est naturel, inclusif et précis en français moderne.
- source_word: ይለብዉ ቃለ አእምሮ
  choice: de comprendre la parole de connaissance
  rationale: La construction exprime ce qui est donné aux humains; « parole de connaissance » conserve l’expression concrète formée avec ቃል (« parole »), sans réduire አእምሮ à une simple faculté abstraite.
- source_word: ወለቲኒ
  choice: il m’a créé
  rationale: Dans le contexte syntaxique, la forme transmise est comprise comme une lecture altérée de « et moi / à moi », qui introduit la mission personnelle d’Hénoch. La note [c] signale l’incertitude du texte transcrit.
- source_word: እዝልፎሙ
  choice: de réprimander
  rationale: 'La forme se comprend le mieux comme un verbe à la première personne avec suffixe pluriel: « que je les réprimande ». Cette analyse rend compte de la commission donnée au narrateur, plutôt que d’y voir le nom « réprimande ».'
- source_word: ትጉሃን
  choice: les Veilleurs
  rationale: Le mot évoque littéralement ceux qui restent éveillés ou vigilants et désigne, dans ce récit, le groupe angélique traditionnellement appelé « les Veilleurs ».
- source_word: ውሉደ ሰማይ
  choice: fils du ciel
  rationale: La traduction formelle maintient l’image de filiation et l’origine céleste de ces êtres.
theological_decisions:
- issue: Identification de ትጉሃን ውሉደ ሰማይ
  choice: les Veilleurs, fils du ciel
  alternative: les vigilants, fils du ciel
  rationale: Le contexte du livre identifie ces êtres au groupe angélique des Veilleurs. Le terme technique français est retenu dans le texte, tandis que son sens lexical est indiqué en note.
- issue: Nature du don fait au narrateur
  choice: une mission de réprimander les Veilleurs
  alternative: une réprimande destinée aux Veilleurs
  rationale: L’analyse verbale de እዝልፎሙ et la présence probable d’une référence à la première personne soutiennent une commission confiée à Hénoch. L’état difficile de la transcription est toutefois explicitement signalé afin de ne pas masquer l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « De même que… de même… » reproduit la structure comparative du passage. Le terme technique « Veilleurs » est conservé, mais expliqué sans imposer une interprétation confessionnelle.
