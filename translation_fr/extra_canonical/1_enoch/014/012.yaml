translation:
  language: fr
  text: Un feu brûlait tout autour des murs, et, au-dessous[a], un feu flamboyait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze fourni se lit littéralement « au-dessous » (ou « sous lui »), lecture difficile dans le contexte. Certains éditeurs proposent « ses portes », lecture appuyée par le témoin grec : « et les portes brûlaient de feu ».'
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: feu
  rationale: Le nom courant désignant le feu est conservé dans ses deux occurrences afin de préserver la répétition et l’imagerie de la vision.
- source_word: ዘይነድድ
  choice: brûlait
  rationale: La forme verbale relative décrit un feu en train de brûler; l’imparfait convient à la description continue de la vision.
- source_word: በአውደ
  choice: tout autour
  rationale: Cette expression rend clairement l’idée d’un feu qui entoure les murs.
- source_word: አረፍት
  choice: les murs
  rationale: Le terme est compris comme le pluriel de « mur », conformément à son emploi dans le contexte architectural du chapitre.
- source_word: ጥሕቱ
  choice: sous eux
  rationale: Le texte guèze transmis dans la source fournie exprime une position inférieure; le pronom renvoie naturellement aux murs mentionnés juste avant.
- source_word: ይውዒ
  choice: flamboyait
  rationale: Le verbe évoque un feu actif et ardent; « flamboyait » restitue cette force tout en restant naturel en français.
theological_decisions:
- issue: Faut-il remplacer la lecture « sous eux » par « ses portes » à partir d’une émendation textuelle et du témoin grec ?
  choice: Conserver « sous eux » dans le texte principal.
  alternative: « et ses portes brûlaient de feu »
  rationale: La source guèze fournie porte ወጥሕቱ, « et sous lui/eux ». La leçon « ses portes » suppose une correction de ce texte; elle est donc signalée en note plutôt qu’introduite silencieusement dans le corps du verset.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition de « feu » est volontaire: elle reproduit celle du guèze et maintient l’intensité de l’image apocalyptique.'
