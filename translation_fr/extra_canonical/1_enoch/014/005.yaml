base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: fr
  text: Désormais, vous ne monterez pas au ciel pour toute l’éternité[a] ; et sur la terre, il a été déclaré[b] que vous serez liés durant tous les jours de l’éternité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’éthiopien emploie ici deux formules de durée qui se recoupent : l’une après l’interdiction de monter au ciel, l’autre après la condamnation à être liés. La traduction conserve les deux au lieu de les fondre en un seul « pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: La formule passive « il a été déclaré » ne précise pas qui prononce la déclaration ; le contexte laisse entendre qu’il s’agit d’un décret céleste.
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: Désormais
  rationale: Marque clairement l’entrée dans un nouvel état judiciaire, dans un français actuel et solennel.
- source_word: ኢትዓርጉ
  choice: vous ne monterez plus
  rationale: Le futur négatif rend la force déclarative de la sentence ; « plus » exprime naturellement en français l’interdiction valable à partir de maintenant.
- source_word: ውስተ ሰማይ
  choice: au ciel
  rationale: Dans ce contexte apocalyptique, « ciel » désigne le domaine céleste, en contraste avec la terre, plutôt que le ciel atmosphérique.
- source_word: እስከ ኵሉ ዓለም
  choice: pour toute l’éternité
  rationale: Cette formule de durée exprime la portée totale de la sentence tout en restant idiomatique en français.
- source_word: ወውስተ ምድር ተነግረ
  choice: et sur la terre, il a été déclaré
  rationale: La tournure passive et impersonnelle conserve l’autorité implicite de la proclamation sans identifier un locuteur que le texte ne nomme pas.
- source_word: ይእስርክሙ
  choice: vous serez liés
  rationale: Conserve l’image concrète des liens, caractéristique du jugement des Veilleurs, sans l’interpréter plus généralement comme un emprisonnement.
- source_word: በኵሉ መዋዕለ ዓለም
  choice: durant tous les jours de l’éternité
  rationale: Rend distinctement la seconde formule temporelle et préserve la répétition solennelle du texte.
theological_decisions:
- issue: Conserver l’image apocalyptique concrète du châtiment ou la généraliser
  choice: vous serez liés
  alternative: vous serez emprisonnés
  rationale: Le texte évoque précisément le fait d’être lié. Garder cette image respecte le symbolisme judiciaire propre au récit sans introduire une explication interprétative.
- issue: Identifier ou non l’autorité qui prononce la sentence
  choice: il a été déclaré
  alternative: Dieu a déclaré
  rationale: Le passif du texte laisse l’agent implicite. La traduction préserve cette indétermination, même si le contexte suggère un décret céleste.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur garde le ton solennel d’une sentence judiciaire ; la répétition des deux formules d’éternité est volontairement maintenue.
