base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: fr
  text: Son plafond était comme la course des étoiles et des éclairs[a] ; parmi eux se trouvaient des chérubins de feu, et leur ciel était de l’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « course » peut aussi évoquer le parcours ou le mouvement ; on pourrait traduire « le parcours des étoiles et des éclairs » կամ « le mouvement des étoiles et des éclairs ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « leur ciel était de l’eau » est difficile. Elle peut désigner le ciel associé aux chérubins de feu ou la région supérieure de la structure contemplée dans la vision.
    reason: alternative_reading
lexical_decisions:
- source_word: ጠፈሩ
  choice: son plafond
  rationale: Dans le contexte architectural immédiat de la demeure visionnaire, « plafond » désigne naturellement sa couverture supérieure, sans introduire prématurément le sens cosmique de « firmament ».
- source_word: ሩጸተ
  choice: la trajectoire
  rationale: Le terme exprime la course ou le mouvement. Avec les étoiles, « trajectoire » est naturel en français et garde l’idée de leur parcours visible.
- source_word: ከዋክብት
  choice: des étoiles
  rationale: Équivalent français courant et direct du nom des corps célestes.
- source_word: መበርቅት
  choice: les éclairs
  rationale: Le pluriel français rend sobrement les manifestations lumineuses répétées de la vision.
- source_word: ማእከሎሙ
  choice: au milieu d’eux
  rationale: Cette formulation conserve le pronom pluriel du guèze et la relation spatiale, même si son antécédent demeure légèrement ambigu.
- source_word: ኪሩቤን
  choice: des chérubins
  rationale: Forme traditionnelle et immédiatement reconnaissable en français pour ces êtres célestes.
- source_word: ዘእሳት
  choice: de feu
  rationale: Cette construction rend directement la relation génitivale et préserve l’image sans décider s’ils sont faits de feu ou simplement caractérisés par lui.
- source_word: ሰማዮሙ
  choice: leur ciel
  rationale: Le possessif du texte source est maintenu malgré l’étrangeté de l’expression. « Ciel » convient ici à la fois à l’espace céleste et à l’imagerie de la structure visionnaire.
- source_word: ማይ
  choice: de l’eau
  rationale: Le nom collectif singulier est rendu naturellement en français, sans expliciter l’éventuelle allusion aux eaux célestes.
theological_decisions:
- issue: Faut-il conserver littéralement le possessif et l’image étrange de ሰማዮሙ፡ ማይ ?
  choice: leur ciel était de l’eau
  alternative: le ciel au-dessus d’eux était de l’eau ; leur ciel était comme de l’eau
  rationale: Le guèze présente un possessif et n’exprime pas explicitement une comparaison. La traduction conserve donc l’image apocalyptique inhabituelle au lieu de la normaliser ou de l’expliquer.
- issue: Nature des chérubins décrits par ዘእሳት
  choice: des chérubins de feu
  alternative: des chérubins ardents ; des chérubins faits de feu
  rationale: « De feu » préserve la tension entre matière, apparence et qualité sans imposer une interprétation ontologique.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le rythme cumulatif de la vision et ses images insolites. « Trajectoire » privilégie une expression naturelle tout en gardant l’idée de mouvement ; pour assurer une répétition verbale avec 1 Hénoch 14:8, le même choix devra y être employé si le même syntagme guèze y figure.
