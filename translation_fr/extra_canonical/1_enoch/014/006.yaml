base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: fr
  text: Et avant cela, vous aurez vu la destruction de vos fils bien-aimés, et vous n’en tirerez aucune joie[a] ; ils tomberont devant vous, par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien est difficile et semble porter littéralement « vous n’aurez pas leurs biens » ou « leurs possessions ». Le grec conservé soutient plutôt le sens : « vous n’en tirerez aucune joie ni aucun bénéfice ».'
    reason: textual_variant
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: auparavant
  rationale: Rend naturellement la relation temporelle avec ce qui précède, sans alourdir le français par « avant cela ».
- source_word: ርኢክሙ
  choice: vous aurez vu
  rationale: Le parfait peut recevoir ici une valeur prophétique; le futur antérieur conserve la séquence temporelle sans exclure une lecture plus simple au futur.
- source_word: ሐጕለ
  choice: la destruction
  rationale: Terme fort mais non excessivement précis, adapté au contexte de mort violente.
- source_word: ውሉድክሙ ፍቁራን
  choice: vos fils bien-aimés
  rationale: Dans le contexte, il s’agit des descendants masculins des Veilleurs; « fils » préserve cette référence et l’accord masculin du texte.
- source_word: አልብክሙ ጥራያኒሆሙ
  choice: vous ne pourrez pas les garder pour vous
  rationale: La leçon éthiopienne est marquée comme difficile ou corrompue. Cette formulation suit la révision auditée, exprime la privation des fils eux-mêmes et évite de présenter comme certaine la lecture littérale « leurs biens ».
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: ils tomberont sous vos yeux par l’épée
  rationale: « Sous vos yeux » rend idiomatiquement ቅድሜክሙ dans ce contexte de spectacle imposé; « par l’épée » conserve l’instrument et l’imagerie judiciaire.
theological_decisions:
- issue: Référent de « vos fils bien-aimés »
  choice: Les descendants des Veilleurs issus de leurs unions interdites
  alternative: Des fils ou descendants humains au sens général
  rationale: Le contexte immédiat est une sentence adressée aux Veilleurs au sujet de leur progéniture; cette lecture respecte la logique narrative sans ajouter de catégorie doctrinale ultérieure.
- issue: Sens de la proposition textuellement difficile après « fils bien-aimés »
  choice: Les Veilleurs ne pourront pas conserver leurs fils pour eux-mêmes
  alternative: Ils ne tireront d’eux aucune jouissance; ou ils ne posséderont pas leurs biens
  rationale: L’éthiopien transmis est difficile, tandis que la tradition grecque soutient une idée de jouissance ou de bénéfice. Le texte principal retient une formulation relationnelle proche de la révision auditée; la note expose les principales données sans résoudre abusivement la tension.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation met en relief le contraste entre l’impossibilité de garder les fils et leur mort sous les yeux de leurs pères.
