base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: fr
  text: 'Et voici : une autre maison, plus grande que celle-là, et chaque porte était ouverte devant moi[a] ; elle était bâtie de langues de feu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les portes étaient ouvertes devant moi ».'
    reason: La tournure guèze peut être comprise de manière distributive (« chaque porte ») ou collective (« toutes les portes »).
  - marker: b
    text: L’expression « langues de feu » conserve l’image concrète du texte ; d’autres traductions disent « flammes de feu ».
    reason: Signale une autre formulation possible sans effacer l’image littérale.
lexical_decisions:
- source_word: ናሁ
  choice: voici
  rationale: Conserve la force déictique et saisissante du récit visionnaire, dans un français biblique actuel et intelligible.
- source_word: ካልእ ቤት
  choice: une autre maison
  rationale: Rend directement l’expression guèze sans préciser s’il s’agit d’un palais ou d’un temple.
- source_word: ዘየዓቢ እምዝክቱ
  choice: plus grande que celle-là
  rationale: Le démonstratif éloigné renvoie à la maison précédemment décrite ; « grande » peut évoquer à la fois les dimensions et la majesté.
- source_word: ኵሉ ኆኅተ
  choice: chaque porte
  rationale: Préserve la formulation distributive du guèze tout en restant naturelle en français.
- source_word: ርኁት በቅድሜየ
  choice: était ouverte devant moi
  rationale: Exprime l’état d’ouverture et maintient la perspective spatiale du visionnaire.
- source_word: ሕኑጽ
  choice: était bâtie
  rationale: Verbe architectural simple et digne, accordé à l’image de la maison.
- source_word: በልሳናተ እሳት
  choice: de langues de feu
  rationale: Conserve l’image concrète et insolite du texte au lieu de la réduire à de simples flammes.
theological_decisions:
- issue: Nature de l’édifice visionnaire
  choice: maison
  alternative: palais ou temple
  rationale: Le guèze dit « maison ». Même si le contexte peut évoquer un palais ou un temple céleste, la traduction ne tranche pas cette identification.
- issue: Nature des éléments de feu
  choice: langues de feu
  alternative: flammes de feu
  rationale: La formulation retenue préserve l’image apocalyptique concrète et sa possible ambiguïté architecturale, sans l’expliquer ni la normaliser.
translation_notes:
  register: Français international moderne, sobre et digne. « Et voici » maintient le caractère visionnaire ; « maison » évite d’imposer une identification cultuelle ; la syntaxe reste claire tout en conservant les images inhabituelles du guèze.
