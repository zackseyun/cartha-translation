base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: fr
  text: J’entrai et m’approchai d’un mur construit de pierres de grêle[a]. Une langue de feu l’entourait et se mit à m’effrayer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pierres de grêle » ; on pourrait aussi comprendre « grêlons ». La formulation littérale préserve l’étrangeté de la vision.
    reason: lexical_alternative
  - marker: b
    text: La fin du verset est difficile dans ce témoin. Le sens paraît être que la langue de feu se mit à effrayer Hénoch.
    reason: textual_variant
lexical_decisions:
- source_word: ወቦእኩ
  choice: J’entrai
  rationale: Le verbe exprime l’entrée. Le passé simple convient au récit visionnaire et reste naturel dans une narration française digne.
- source_word: እስከ፡ እቀርብ
  choice: et m’avançai jusqu’à
  rationale: La tournure marque un déplacement poursuivi jusqu’à proximité du mur. Cette formulation rend le mouvement plus naturellement qu’un calque avec « jusqu’à ce que ».
- source_word: ጥቅም
  choice: un mur
  rationale: Dans ce contexte architectural, « mur » est soutenu par les témoins parallèles grec et araméen et convient mieux que le terme plus vague « structure ».
- source_word: ዘሕንጽት
  choice: construit de
  rationale: Le participe qualifie le mur par le matériau dont il est bâti. « Construit de » préserve cette relation de manière concise.
- source_word: በእእባነ፡ በረድ
  choice: de pierres de grêle
  rationale: La traduction littérale conserve l’étrangeté concrète de la vision. « Grêlons » serait plus fluide, mais effacerait l’image explicite des pierres.
- source_word: ልሳነ፡ እሳት
  choice: Une langue de feu
  rationale: Le nom est au singulier, de même que dans le témoin grec. Le singulier est également important pour la continuité avec le verset suivant.
- source_word: የዓውዳ
  choice: l’entourait
  rationale: Le verbe décrit l’encerclement du mur. L’imparfait présente naturellement la scène qui se déploie devant Hénoch.
- source_word: ወጠነ፡ ያፍርሀኒ
  choice: elle commença à m’effrayer
  rationale: La séquence est comprise comme l’expression d’un commencement suivi du causatif de la peur. Le pronom « elle » renvoie naturellement à la langue de feu, tout en laissant la difficulté textuelle signalée en note.
theological_decisions:
- issue: Préservation de l’imagerie architecturale et apocalyptique
  choice: un mur construit de pierres de grêle… une langue de feu
  alternative: une structure faite de grêlons… des flammes
  rationale: Le choix retenu conserve les images singulières et concrètes du texte sans les normaliser en architecture ou en phénomènes ordinaires.
- issue: Référent de la peur dans la proposition finale
  choice: elle commença à m’effrayer
  alternative: cela commença à m’effrayer
  rationale: Le féminin singulier reprend naturellement « une langue de feu » et respecte la forme singulière de l’image. Une note reconnaît toutefois la difficulté du texte transmis.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre visionnaire sans archaïsme lexical; les images inhabituelles du guèze sont conservées plutôt que lissées.
