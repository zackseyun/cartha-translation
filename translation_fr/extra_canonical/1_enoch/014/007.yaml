base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: fr
  text: Et votre requête en leur faveur ne sera pas accordée[a], pas plus qu’en votre propre faveur. Et vous-mêmes, tandis que vous pleurerez et supplierez, vous ne direz pas un seul mot tiré du livre que j’ai écrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre prière […] ne se réalisera pas ». Le guèze dit littéralement « ne sera pas » ; dans le contexte d’une requête, cela signifie probablement qu’elle ne sera pas accordée.
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition est difficile. Elle peut signifier que les Veilleurs ne pourront ni présenter, ni réciter, ni invoquer devant Dieu la requête écrite par Hénoch.
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  choice: votre requête
  rationale: Le nom désigne une demande ou une supplication. « Requête » conserve le cadre formel d’une intercession tout en restant naturel en français moderne.
- source_word: በእንቲአሆሙ
  choice: en leur faveur
  rationale: La locution marque ici la représentation ou l’intercession en faveur d’autrui.
- source_word: ኢይከውን
  choice: ne sera pas accordée
  rationale: Le sens littéral est « ne sera pas », mais, avec « requête », le français idiomatique demande « ne sera pas accordée ». La note conserve l’alternative plus littérale.
- source_word: በእንቲአክሙ
  choice: en votre propre faveur
  rationale: Cette expression est parallèle à « en leur faveur » et complète la déclaration concernant le refus de la requête pour les deux groupes.
- source_word: አንትሙሂ
  choice: vous-mêmes
  rationale: Cette forme emphatique met les destinataires en relief.
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: tandis que vous pleurerez et supplierez
  rationale: « Tandis que » préserve la valeur circonstancielle de እንዘ; les futurs s’accordent naturellement avec la prédiction exprimée par le verbe principal.
- source_word: ኢትተናገሩ
  choice: vous ne prononcerez pas
  rationale: « Prononcer » convient naturellement à l’objet « un seul mot » et conserve la négation d’un acte de parole.
- source_word: ኢምንተ ቃለ
  choice: un seul mot
  rationale: Cette formulation rend clairement l’intensification de la négation.
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: du livre que j’ai écrit
  rationale: « Livre » est ici le rendu naturel de መጽሐፍ, et la proposition relative demeure explicite.
theological_decisions:
- issue: 'Sens précis de la dernière proposition : interdiction, incapacité ou inutilité de réciter l’intercession écrite d’Hénoch'
  choice: La traduction nie directement qu’ils prononceront un seul mot du livre.
  alternative: « Vous ne serez pas autorisés à prononcer un seul mot du livre » ou « le livre ne vous apportera aucune réponse ».
  rationale: Le guèze nie directement leur prise de parole sans préciser s’il s’agit d’une interdiction, d’une incapacité ou de l’inutilité de leur démarche. La traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation fait ressortir le parallélisme entre « en leur faveur » et « en votre propre faveur », tandis que « tandis que » maintient la relation circonstancielle du guèze.
