base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: fr
  text: Son sol était de feu. Au-dessus, il y avait des éclairs et la course des étoiles[a], et son plafond[b] était un feu brûlant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La course des étoiles » peut aussi se traduire par « le chemin des étoiles » ou « la trajectoire des étoiles » ; l’expression peut évoquer leur mouvement ordonné dans les cieux.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « plafond » peut aussi désigner un « toit » ou, peut-être, une « voûte » ; le contexte mêle imagerie architecturale et cosmique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድሩሰ
  choice: son sol
  rationale: Le nom désigne littéralement la terre ou le sol. Dans cette vision d’un édifice céleste, « sol » exprime naturellement la surface intérieure sans préciser qu’il s’agit d’un dallage.
- source_word: ዘእሳት
  choice: de feu
  rationale: La construction génitive est rendue directement afin de conserver la force sobre de l’image apocalyptique.
- source_word: መልዕልቴሁ
  choice: au-dessus
  rationale: Cette formulation française fluide conserve le repère spatial sans imposer un référent plus précis que le texte source.
- source_word: መበርቅት
  choice: des éclairs
  rationale: Le pluriel rend la multiplicité de la vision et appartient au français courant tout en gardant un registre digne.
- source_word: ምርዋፀ
  choice: la course
  rationale: Le terme peut désigner une voie, une piste ou un mouvement réglé. « Course » convient particulièrement au déplacement ordonné des étoiles tout en laissant subsister l’image d’un parcours.
- source_word: ከዋክብት
  choice: des étoiles
  rationale: Traduction usuelle du pluriel « étoiles », intégrée naturellement au complément « la course des étoiles ».
- source_word: ጠፈሩኒ
  choice: son plafond
  rationale: Le mot évoque une couverture supérieure ou un toit. Dans la description intérieure de l’édifice, « plafond » est le choix le plus naturel, sans exclure par note les nuances de toit ou de voûte.
- source_word: እሳት ዘይነድድ
  choice: un feu brûlant
  rationale: Cette expression reproduit la construction littérale « un feu qui brûle » et sa répétition saisissante, tout en restant idiomatique en français.
theological_decisions:
- issue: Imagerie architecturale ou cosmique de la demeure céleste
  choice: Employer les termes architecturaux « sol » et « plafond », tout en conservant les phénomènes cosmiques que sont les éclairs et la course des étoiles.
  alternative: Traduire de manière plus cosmique par « voûte » ou « firmament », ou plus concrète par « toit ».
  rationale: Le passage associe l’intérieur d’un édifice céleste à des réalités cosmiques. Maintenir cette tension respecte le caractère apocalyptique de la vision sans la réduire à un bâtiment matériel ni à une description purement cosmologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe brève conserve l’enchaînement des images. « Un feu brûlant » maintient volontairement la répétition du texte guèze plutôt que de l’atténuer par une paraphrase.
