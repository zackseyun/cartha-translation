base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: fr
  text: Voici le livre des paroles de justice et de la réprimande des Veilleurs[a], qui existent depuis toujours[b], comme le Saint et le Grand l’a ordonné dans cette vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Vigilants »; le terme guèze désigne littéralement ceux qui restent éveillés ou qui veillent.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi signifier « depuis les temps anciens »; elle peut évoquer une origine primordiale plutôt qu’une éternité absolue.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ
  choice: livre
  rationale: Le terme désigne directement un livre ou un document écrit et convient à la fonction de titre du verset.
- source_word: ቃለ
  choice: paroles
  rationale: Bien que le nom soit formellement au singulier, il peut avoir un sens collectif; « paroles » introduit naturellement le contenu de l’ouvrage.
- source_word: ጽድቅ
  choice: justice
  rationale: « Justice » rend en français moderne la portée morale et théologique du terme sans lourdeur.
- source_word: ዘለፋ
  choice: réprimande
  rationale: Le mot exprime le blâme ou la dénonciation; « réprimande » conserve le ton solennel et admoniteur.
- source_word: ትጉሃን
  choice: les Vigilants
  rationale: Le terme désigne littéralement ceux qui restent éveillés ou vigilants et, dans ce contexte apocalyptique, fonctionne comme le nom d’une catégorie d’êtres célestes.
- source_word: እለ እምዓለም
  choice: qui sont depuis toujours
  rationale: Cette formulation française naturelle conserve l’idée d’une existence remontant à un passé indéfini sans trancher entre ancienneté primordiale et éternité absolue.
- source_word: አዘዘ
  choice: a ordonné
  rationale: Le verbe exprime un commandement direct et souligne l’autorité du locuteur divin.
- source_word: ቅዱስ ወዓቢይ
  choice: le Saint et le Grand
  rationale: Les deux adjectifs forment ensemble un titre divin; cette traduction reste proche du guèze et demeure idiomatique en français.
- source_word: በይእቲ ራእይ
  choice: dans cette vision
  rationale: La préposition peut être locative ou instrumentale; « dans » est ici la solution la moins interprétative.
theological_decisions:
- issue: Identité des ትጉሃን
  choice: les Vigilants, compris comme les êtres célestes appelés traditionnellement les Veilleurs
  alternative: les vigilants; ceux qui veillent; les Veilleurs
  rationale: Le contexte du Livre des Veilleurs indique une catégorie d’êtres célestes. « Vigilants » reflète directement le sens du terme guèze, tandis que la note signale l’appellation traditionnelle.
- issue: Portée de እለ እምዓለም
  choice: qui sont depuis toujours
  alternative: qui sont de toute éternité; qui existent depuis les temps anciens
  rationale: La formulation retenue préserve l’ambiguïté entre une origine très ancienne et une éternité absolue, sans définir plus précisément la nature de ces êtres.
- issue: Rapport de la réprimande aux Vigilants
  choice: réprimande concernant les Vigilants
  alternative: réprimande des Vigilants; réprimande adressée aux Vigilants
  rationale: « Concernant » indique le thème ou l’objet de la réprimande sans imposer davantage que ne le permet la construction génitive du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve la forme de superscription du texte et évite d’attribuer explicitement une éternité absolue aux Vigilants.
