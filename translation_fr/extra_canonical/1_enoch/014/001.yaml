  terminology: « Justice », « réprimande », « les Veilleurs » et « le Saint et le Grand » rendent convenablement les termes clés sans surinterprétation doctrinale. La note conserve l’alternative plus littérale « les Vigilants » et explique le sens lexical du guèze.
