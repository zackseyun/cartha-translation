base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: fr
  text: 'J’entrai dans cette maison : elle était chaude comme le feu et froide comme la glace, et il n’y avait en elle aucun agrément de la vie[a]. La peur m’enveloppa, et le tremblement me saisit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze traduite par « aucun agrément de la vie » est difficile. Elle peut signifier qu’il n’y avait dans la maison aucune douceur vivifiante, ou, plus largement, rien du réconfort propre à la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ
  choice: J’entrai
  rationale: Le verbe à la première personne exprime directement l’entrée. Le passé simple convient au registre narratif digne et reste naturel dans un texte littéraire français.
- source_word: ውእቱ ቤት
  choice: cette maison
  rationale: Le démonstratif renvoie à l’édifice visionnaire décrit auparavant. « Cette maison » conserve cette valeur déictique sans substituer un terme plus interprétatif comme « bâtiment ».
- source_word: ምውቅ
  choice: chaude
  rationale: L’adjectif exprime la chaleur; la comparaison « comme le feu » en donne déjà l’intensité.
- source_word: ቈሪር
  choice: froide
  rationale: Ce choix rend clairement le contraste paradoxal avec la chaleur et s’accorde naturellement avec « maison ».
- source_word: በረድ
  choice: glace
  rationale: Le terme peut aussi évoquer la grêle ou le gel, mais « glace » rend le mieux ici la polarité entre le feu et le froid.
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: et il n’y avait en elle aucun agrément de la vie
  rationale: La tournure difficile semble nier toute qualité agréable ou bienfaisante liée à la vie. « Agrément de la vie » en préserve l’étrangeté sans réduire le sens à une simple absence d’êtres vivants.
- source_word: ፍርሃት ከደነኒ
  choice: La peur m’enveloppa
  rationale: Le verbe suggère l’action de couvrir ou d’envelopper. Cette formulation conserve l’image concrète.
- source_word: ወረዓድ አኃዘኒ
  choice: et le tremblement me saisit
  rationale: Le nom désigne le tremblement et le verbe l’action de saisir; le français maintient ainsi la force corporelle de la réaction.
theological_decisions:
- issue: Sens de la réalité absente à l’intérieur de la maison
  choice: il n’y avait en elle aucun agrément de la vie
  alternative: il n’y avait en elle rien de vivant; il n’y avait en elle aucun plaisir de la vie
  rationale: Le texte paraît nier un agrément ou un bienfait vivifiant plutôt que simplement la vie biologique. La formulation retenue maintient l’ambiguïté et la tension de la vision sans les résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre visionnaire; le vocabulaire reste accessible. Le parallélisme entre chaleur et froid ainsi que les images physiques de la peur et du tremblement sont conservés.
