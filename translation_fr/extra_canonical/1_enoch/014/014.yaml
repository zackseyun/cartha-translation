base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/014.yaml
  text: And as I shook and trembled[a], I fell on my face and saw in the vision.
translation:
  language: fr
  text: Tandis que j’étais bouleversé et que je tremblais[a], je tombai face contre terre et je vis dans la vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’étais agité et saisi de tremblements ». Les deux verbes, de sens proche, expriment ensemble un trouble ou une frayeur intense.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: እንዘ
  choice: Tandis que
  rationale: Introduit une circonstance simultanée et conserve le lien temporel entre le bouleversement, le tremblement et la chute.
- source_word: እትሀወክ
  choice: j’étais bouleversé
  rationale: Rend l’agitation intérieure ou le trouble sans la confondre avec le tremblement corporel exprimé par le verbe suivant.
- source_word: እርዕድ
  choice: je tremblais
  rationale: Conserve la réaction physique intense et l’effet cumulatif des deux verbes rapprochés.
- source_word: ወድቁ
  choice: je tombai
  rationale: Garde le verbe de mouvement dans son sens simple; la posture est précisée par l’expression suivante.
- source_word: በገጽየ
  choice: face contre terre
  rationale: Expression française naturelle qui restitue littéralement la chute sur le visage et évoque la prosternation sans l’imposer comme interprétation volontaire.
- source_word: እሬኢ
  choice: je vis
  rationale: Rend directement le verbe courant de perception visionnaire, sans archaïsme.
- source_word: በራእይ
  choice: dans la vision
  rationale: Préserve le nom technique de la vision ainsi que la formulation quelque peu abrupte de la source, sans ajouter d’objet au verbe « voir ».
theological_decisions:
- issue: Rendre les deux verbes décrivant la réaction d’Hénoch comme une émotion générale ou comme deux aspects distincts de sa réaction
  choice: « j’étais bouleversé et je tremblais »
  alternative: « j’étais troublé et saisi de peur »
  rationale: La formulation retenue maintient à la fois l’agitation intérieure et sa manifestation corporelle, au lieu de réduire les deux verbes à une peur abstraite.
- issue: Interpréter la chute sur le visage comme une prosternation volontaire
  choice: « je tombai face contre terre »
  alternative: « je me prosternai »
  rationale: Le texte exprime d’abord une chute; la traduction conserve cette ambiguïté et n’attribue pas explicitement au geste une intention cultuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit littéraire. La répétition « je vis dans la vision », inhabituelle mais intelligible, conserve la structure du guèze et évite d’ajouter un objet absent du texte.
