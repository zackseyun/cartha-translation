base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: fr
  text: J’ai vu dans mon sommeil ce que je dis maintenant avec une langue de chair et avec mon souffle[a], que le Grand a donné aux humains comme bouche[b], afin qu’ils parlent par lui et comprennent dans leur cœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec mon esprit ». Le terme guèze peut désigner le souffle ou l’esprit ; la mention de la langue, de la bouche et de la parole favorise ici « souffle ».
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe du texte guèze transmis est difficile, mais elle comporte bien le mot « bouche ». On peut aussi comprendre plus simplement : « que le Grand a donné aux humains ».'
    reason: textual_syntax_note
  - marker: c
    text: Dans cette manière ancienne de parler, le « cœur » est notamment le siège de la compréhension et du discernement, et non seulement des émotions.
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ በንዋምየ
  choice: J’ai vu dans mon sommeil
  rationale: Rend directement la vision reçue pendant le sommeil sans préciser davantage s’il s’agit d’un rêve au sens strict.
- source_word: ይእዜ እነግር
  choice: ce que je dis maintenant
  rationale: Conserve le passage de la vision passée à sa proclamation présente et s’accorde avec le vocabulaire de la parole dans la suite.
- source_word: በልሳን ዘሥጋ
  choice: avec une langue de chair
  rationale: Maintient l’image anthropologique concrète et la tonalité apocalyptique de l’expression guèze.
- source_word: ወበመንፈስየ
  choice: et avec mon souffle
  rationale: መንፈስ peut désigner le souffle ou l’esprit. Le contexte immédiat de la langue, de la bouche et de la parole favorise « souffle », tout en conservant « esprit » en note.
- source_word: ዓቢይ
  choice: le Grand
  rationale: Préserve l’épithète divine substantivée et élevée sans la remplacer par le terme plus général « Dieu ».
- source_word: አፈ ለሰብእ
  choice: aux humains comme bouche
  rationale: 'Réintroduit explicitement አፈ, « bouche », absent de certaines traductions, et comprend l’expression comme le second complément de « donner » : donné comme bouche aux humains.'
- source_word: ይትናገሩ ቦቱ
  choice: afin qu’ils parlent par lui
  rationale: Rend la proposition de but et le moyen singulier auquel renvoie le pronom guèze.
- source_word: ወይለብዉ በልብ
  choice: et comprennent dans leur cœur
  rationale: Conserve l’anthropologie ancienne dans laquelle le cœur est le siège de l’intelligence et du discernement, et non seulement des émotions.
theological_decisions:
- issue: Sens de መንፈስ dans l’énoncé sur les facultés humaines
  choice: souffle
  alternative: esprit
  rationale: Le champ sémantique permet les deux lectures. « Souffle » convient mieux à la langue, à la bouche et à l’acte de parler dans le contexte immédiat, tandis qu’une note maintient l’ambiguïté anthropologique et théologique.
- issue: Rendu de l’épithète ዓቢይ
  choice: le Grand
  alternative: Dieu
  rationale: L’épithète propre au registre hénochique est conservée, sans explicitation théologique étrangère au libellé du verset.
- issue: Rapport syntaxique de « que le Grand a donné aux humains comme bouche »
  choice: la relative se rattache au souffle, présenté comme une bouche donnée aux humains
  alternative: « que le Grand a donné aux humains », sans rattachement explicite de « bouche »
  rationale: Le texte guèze transmis contient bien አፈ, « bouche », mais sa construction est difficile. La traduction maintient ce mot et la tension de la syntaxe reçue plutôt que de corriger silencieusement le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les images concrètes « langue de chair », « souffle », « bouche » et « cœur », ainsi que l’épithète apocalyptique « le Grand ». « Humains » rend le collectif ሰብእ sans restriction de genre. La difficulté syntaxique du texte transmis est signalée plutôt que lissée silencieusement.
