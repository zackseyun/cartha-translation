base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: fr
  text: Je regardai et vis à l’intérieur un trône élevé. Son aspect était semblable au cristal[a], et ses roues, au soleil resplendissant[b] ; et la voix des chérubins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « cristal » peut aussi désigner la glace, le givre ou une matière cristalline éclatante ; l’image évoque une transparence éblouissante.
    reason: lexical_alternative
  - marker: b
    text: Le terme guèze peut aussi signifier « cercle », « pourtour » ou « circonférence » ; les témoins grec et araméen appuient ici la traduction « roues ».
    reason: textual_and_lexical_evidence
  - marker: c
    text: 'L’expression finale est elliptique en guèze : littéralement, « et la voix des chérubins ». Elle ajoute vraisemblablement un élément sonore à la vision, sans former une proposition complète.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ነጸርኩ፡ ወርኢኩ
  choice: Je regardai et vis
  rationale: Les deux verbes de vision sont conservés afin de respecter le redoublement solennel du récit apocalyptique.
- source_word: ውስቴቱ
  choice: à l’intérieur
  rationale: Cette formulation française naturelle exprime la situation spatiale à l’intérieur de l’édifice évoqué dans le contexte.
- source_word: መንበረ፡ ልዑለ
  choice: un trône élevé
  rationale: « Trône » rend le siège royal, tandis qu’« élevé » garde à la fois l’idée de hauteur visible et celle de majesté sans transformer le qualificatif en titre théologique.
- source_word: ራእዩ
  choice: son aspect
  rationale: Le terme désigne ici l’apparence visible du trône ou de l’élément immédiatement décrit.
- source_word: አስሐትያ
  choice: cristal
  rationale: « Cristal » restitue bien l’image lumineuse et translucide, tout en laissant en note les sens possibles de glace ou de givre.
- source_word: ክበቡ
  choice: ses roues
  rationale: Bien que le mot guèze puisse évoquer un cercle ou une circonférence, les témoins grec et araméen ainsi que le contexte du trône visionnaire appuient ici le sens de « roues ».
- source_word: ፀሐይ፡ ዘያበርህ
  choice: le soleil resplendissant
  rationale: Cette expression concise conserve la proposition qui présente le soleil comme brillant ou donnant de la lumière.
- source_word: ቃለ፡ ኪሩቤን
  choice: la voix des chérubins
  rationale: « Voix » rend le sens premier de ቃል, tandis que « chérubins » est la forme française conventionnelle du nom de ces êtres célestes.
theological_decisions:
- issue: Portée du qualificatif appliqué au trône
  choice: un trône élevé
  alternative: un trône exalté
  rationale: « Élevé » maintient la hauteur et la grandeur de la vision sans imposer au qualificatif une valeur doctrinale plus précise.
- issue: Interprétation de l’élément circulaire du trône
  choice: ses roues
  alternative: son pourtour / sa circonférence
  rationale: Le contexte visionnaire et les témoins anciens soutiennent l’image des roues, sans qu’il soit nécessaire d’expliciter davantage la théologie du char-trône.
- issue: Syntaxe de la mention finale des chérubins
  choice: 'conserver la phrase nominale abrupte : « et la voix des chérubins »'
  alternative: développer en une proposition telle que « et j’entendis la voix des chérubins »
  rationale: Le guèze ne fournit pas de verbe explicite dans cette dernière expression. La traduction préserve donc son caractère elliptique plutôt que de préciser ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit visionnaire écrit. La ponctuation distingue les images successives tout en préservant l’ellipse volontaire de la dernière expression.
