lexical_decisions:
- source_word: እምታሕተ
  choice: de dessous
  rationale: La préposition exprime à la fois la provenance et la position inférieure. « De dessous » conserve nettement cette image spatiale.
- source_word: መንበሩ
  choice: le trône
  rationale: Dans cette vision céleste, መንበር désigne naturellement un trône. Le suffixe peut ici reprendre de façon définie le trône déjà mentionné, sans nécessairement marquer la possession.
- source_word: ይወፅእ
  choice: sortait
  rationale: Le verbe signifie « sortir ». L’imparfait convient au déroulement descriptif de la vision et permet de conserver la proposition sans objet exprimé.
theological_decisions:
- issue: Valeur du suffixe dans መንበሩ
  choice: le trône
  alternative: son trône
  rationale: Le suffixe masculin singulier peut fonctionner comme reprise définie d’un nom déjà mentionné. Le rendu principal évite d’identifier prématurément un possesseur, tandis que la variante signale l’autre analyse grammaticale possible.
- issue: Élément qui sort de dessous le trône
  choice: Ne pas l’expliciter dans le texte principal
  alternative: Ajouter l’image précisée par la ligne suivante
  rationale: La brève proposition guèze ne nomme pas elle-même ce qui sort. Maintenir cette suspension respecte la forme du texte et laisse le contexte suivant apporter la précision.
translation_notes:
  register: Français moderne, sobre et digne. La construction volontairement suspendue reproduit le caractère incomplet de la proposition source sans ajouter d’objet absent du guèze.
