base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: fr
  text: 'Et une vision me montra ceci[a] : Voici, dans la vision, les nuages m’appelaient, et la brume m’appelait ; la course des étoiles[b] et les éclairs me poussaient et me pressaient d’avancer ; et, dans la vision, les vents[c] me faisaient voler, m’emportaient et m’élevaient jusque dans le ciel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et voici ce que la vision me montra ». La construction introductive peut être formulée de plusieurs manières en français tout en conservant le sens de « ainsi, ceci ».
    reason: Variante de formulation de l’introduction.
  - marker: b
    text: L’expression traduite par « la course des étoiles » peut aussi évoquer « l’élan des étoiles » ou « les trajectoires des étoiles ».
    reason: Ambiguïté lexicale concernant le mouvement des étoiles.
  - marker: c
    text: Le mot rendu par « vents » peut également signifier « esprits », mais le contexte atmosphérique favorise ici « vents ».
    reason: Ambiguïté lexicale de ነፋሳት.
lexical_decisions:
- source_word: ራእይ
  choice: vision
  rationale: Terme naturel et consacré dans un contexte apocalyptique ; sa répétition maintient l’encadrement visionnaire du verset.
- source_word: አስተአርአየኒ
  choice: me montra
  rationale: Rend directement la forme causative du verbe « voir », sans remplacer l’image visuelle par une interprétation plus abstraite comme « révéla ».
- source_word: ደመናት
  choice: les nuages
  rationale: Correspond au sens courant du pluriel sans ajouter l’idée de tempête, que le texte n’explicite pas.
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: m’appelaient / m’appelait
  rationale: Préserve la répétition du verbe et l’idée d’un appel actif, sans en faire nécessairement une convocation formelle.
- source_word: ጊሜ
  choice: la brume
  rationale: Le singulier français respecte le nombre du terme source et convient au parallélisme avec les nuages.
- source_word: ሩጸተ ከዋክብት
  choice: la course des étoiles
  rationale: Conserve l’image dynamique de leur mouvement. D’autres nuances possibles sont signalées en note.
- source_word: መበርቅት
  choice: les éclairs
  rationale: Formulation française naturelle pour le phénomène atmosphérique pluriel.
- source_word: ይንጐዑኒ
  choice: me poussaient
  rationale: Exprime la propulsion énergique sans préciser davantage la nature de la force.
- source_word: ወተያድህቁኒ
  choice: me pressaient d’avancer
  rationale: Renforce le verbe précédent tout en conservant l’idée d’un mouvement imposé vers l’avant.
- source_word: ነፋሳት
  choice: les vents
  rationale: Dans la série formée par les nuages, la brume, les étoiles et les éclairs, le sens météorologique est le plus immédiat ; l’autre sens possible est conservé en note.
- source_word: ያበርሩኒ
  choice: me faisaient voler
  rationale: Préserve explicitement l’idée de vol plutôt que de la réduire à un simple transport.
- source_word: ያንጉጹኒ
  choice: m’emportaient
  rationale: Rend le déplacement puissant et subi dans un français fluide.
- source_word: አነሥኡኒ፡ ላዕለ፡ ውስተ፡ ሰማይ
  choice: m’élevaient jusque dans le ciel
  rationale: Exprime à la fois le mouvement ascendant et l’entrée dans le ciel, sans la lourdeur de « vers le haut dans le ciel ».
theological_decisions:
- issue: Faut-il traduire ነፋሳት par « vents » ou par « esprits » ?
  choice: vents
  alternative: esprits
  rationale: Le contexte immédiat accumule des réalités atmosphériques et cosmiques. « Vents » respecte donc au mieux l’image locale, tandis qu’une note préserve l’ambiguïté lexicale sans imposer une angélologie au passage.
translation_notes:
  register: Français international moderne, digne et narratif. La longue progression du texte source est conservée par des points-virgules, tandis que les répétitions de « dans la vision » et « m’appelait » maintiennent son rythme visionnaire. Tous les marqueurs de note figurent dans le texte principal.
