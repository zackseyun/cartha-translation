base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: fr
  text: 'J’ai mis par écrit votre requête et, dans ma vision, voici ce qui m’a été montré : votre requête ne vous sera pas accordée durant tous les jours de l’éternité[a] ; la sentence prononcée contre vous est définitive[b], et votre requête ne vous sera pas accordée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze signifie littéralement « durant tous les jours de l’âge » ou « de l’éternité » ; c’est une formule emphatique exprimant une durée sans fin.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la clause peut se comprendre ainsi : « le jugement a été mené à son terme contre vous ». Le texte guèze fourni paraît comporter ici une erreur de transcription ; la lecture « jugement » est appuyée par la tradition textuelle et par le contexte.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  choice: votre requête
  rationale: « Requête » exprime une demande adressée à une autorité et conserve la tonalité formelle et judiciaire du recours des Veilleurs.
- source_word: ጻሐፍኩ
  choice: j’ai mis par écrit
  rationale: Cette formulation naturelle rend explicitement l’acte de consigner la requête, sans ajouter de contenu.
- source_word: በራእየየ
  choice: dans ma vision
  rationale: Le terme désigne ici une perception révélatrice ; « vision » convient au registre apocalyptique.
- source_word: ያስተርኢ
  choice: m’a été montré
  rationale: La tournure passive préserve la formule de révélation sans imposer un sujet qui n’est pas explicité.
- source_word: እስመ
  choice: '[introduit par les deux-points]'
  rationale: La ponctuation française après « voici ce qui m’a été montré » introduit naturellement le contenu de la vision exprimé par la conjonction guèze.
- source_word: ኢትከውነክሙ
  choice: ne vous sera pas accordée
  rationale: Dans ce contexte, la formule littérale « ne sera pas pour vous » signifie que la requête sera refusée ; « accordée » restitue clairement cette valeur sans recourir à l’expression confessionnellement chargée « exaucée ».
- source_word: መዋዕለ ዓለም
  choice: durant tous les jours de l’éternité
  rationale: Cette traduction conserve l’image emphatique des « jours » et la solennité de la formule de durée illimitée.
- source_word: ፍጽምት
  choice: définitive
  rationale: Le mot exprime l’achèvement ou la finalité. Avec « sentence », « définitive » produit un français naturel tout en indiquant qu’une décision judiciaire irrévocable a été arrêtée.
- source_word: ላዕሌክሙ
  choice: contre vous
  rationale: Dans un contexte de jugement, « contre vous » rend naturellement la portée adverse de la préposition « sur/au-dessus de vous ».
- source_word: ወኢይከውነ ክሙ
  choice: et votre requête ne vous sera pas accordée
  rationale: La reprise explicite de « votre requête » clarifie le référent en français et maintient l’insistance de la seconde formule de refus.
theological_decisions:
- issue: Nature du refus opposé à la requête des Veilleurs
  choice: 'Un refus judiciaire : « votre requête ne vous sera pas accordée »'
  alternative: « votre prière ne sera pas exaucée » ou, plus littéralement, « elle ne sera pas pour vous »
  rationale: Le contexte est celui d’un recours rejeté par une autorité. « Accordée » garde la force juridique sans importer une formule dévotionnelle postérieure.
- issue: Interprétation de la clause contenant ፍጽምት
  choice: Une sentence devenue définitive contre les Veilleurs
  alternative: « le jugement a été accompli contre vous » ou « la décision contre vous a été menée à son terme »
  rationale: Le texte transmis présente une difficulté probable d’OCR autour du mot précédant ፍጽምት. Les témoins comparatifs et le contexte soutiennent l’idée d’un jugement ou d’une sentence arrivée à son terme. La formulation retenue est naturelle et conserve cette finalité judiciaire sans développer une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme solennel et répétitif de l’annonce apocalyptique. « Requête » et « sentence » maintiennent la tonalité judiciaire ; les formulations plus confessionnelles comme « prière exaucée » sont évitées.
