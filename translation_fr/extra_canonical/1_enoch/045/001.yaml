base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: fr
  text: Et voici la deuxième parabole, au sujet de ceux qui renient le nom de la demeure des saints et du Seigneur des esprits[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze après « renient le nom » est difficile. Elle peut signifier « le nom de la demeure des saints et du Seigneur des esprits », mais d’autres analyses sont possibles.
    reason: textual_variant
  - marker: b
    text: Ici, « saints » peut désigner des êtres saints célestes, les justes, ou englober délibérément les deux dans ce contexte apocalyptique.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une autre parabole ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  choice: Et voici
  rationale: Rend naturellement la conjonction et la valeur démonstrative/copulative qui introduisent une nouvelle section.
- source_word: ካልእ ምሳሌ
  choice: la deuxième parabole
  rationale: Dans la série explicitement structurée des paraboles, ካልእ a ici une valeur ordinale; « parabole » est le terme français courant et digne.
- source_word: ዲበ
  choice: au sujet de
  rationale: La préposition introduit ici le thème de la parabole et non une relation spatiale.
- source_word: እለ ይክሕዱ
  choice: ceux qui renient
  rationale: « Renier » exprime une répudiation forte sans préciser indûment si elle est verbale, pratique ou religieuse.
- source_word: ስሞ
  choice: le nom
  rationale: Conserve le substantif concret du guèze sans le paraphraser par « autorité » ou « majesté ».
- source_word: ለማኅደረ ቅዱሳን
  choice: de la demeure des saints
  rationale: « Demeure » maintient l'image spatiale de ማኅደር; le rapport syntaxique avec « le nom » demeure volontairement proche de la formulation difficile du guèze.
- source_word: ቅዱሳን
  choice: les saints
  rationale: En français biblique moderne, « les saints » peut désigner les êtres saints célestes ou la communauté consacrée; une note préserve cette ambiguïté.
- source_word: ወእግዚአ መናፍስት
  choice: et du Seigneur des esprits
  rationale: Traduit directement le titre divin récurrent des Paraboles, sans translittération.
theological_decisions:
- issue: Référent de « saints »
  choice: Le référent reste indéterminé.
  alternative: « les êtres saints » pour les êtres célestes, ou « les justes » pour la communauté fidèle
  rationale: Le contexte immédiat ne permet pas de trancher entre les êtres célestes, les fidèles consacrés ou un chevauchement voulu.
- issue: Portée de « renient le nom de la demeure des saints et du Seigneur des esprits »
  choice: Construction génitivale conservée avec un lissage minimal.
  alternative: « renient le nom par lequel les saints demeurent »; « renient la demeure des saints et du Seigneur des esprits »; « renient le nom du Seigneur des esprits dans la demeure des saints »
  rationale: La syntaxe guèze est difficile et aucune attestation grecque ou araméenne ne permet ici de la résoudre avec certitude; la note signale donc l'incertitude.
- issue: Valeur de ካልእ
  choice: « deuxième »
  alternative: « une autre »
  rationale: La place de cette unité entre la première et la troisième parabole favorise nettement la valeur ordinale, tout en reconnaissant la valeur lexicale possible « autre ».
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Et voici » marque naturellement l'ouverture d'une nouvelle unité. « Seigneur des esprits » conserve le titre caractéristique de l'œuvre. Les notes rendent explicites les deux ambiguïtés réelles sans alourdir le verset.
