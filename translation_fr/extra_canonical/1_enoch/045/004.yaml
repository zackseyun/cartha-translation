base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: fr
  text: En ce jour-là, je ferai demeurer mon Élu[a] au milieu d’eux[b], et je transformerai le ciel et j’en ferai une bénédiction et une lumière pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui que j’ai choisi ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans leur milieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: En ce jour-là
  rationale: Formule temporelle apocalyptique naturelle en français moderne, qui conserve le registre prophétique.
- source_word: አነብር
  choice: je ferai demeurer
  rationale: Le causatif exprime le fait d’établir quelqu’un dans un lieu ou de l’y faire habiter; cette formulation garde cette nuance sans la réduire à une simple présence.
- source_word: ማእከሎሙ
  choice: au milieu d’eux
  rationale: Rendu direct du sens spatial «dans leur milieu», idiomatique et digne en français.
- source_word: ለኅሩየ፡ ዚአየ
  choice: mon Élu
  rationale: Traduit le titre local sans le translittérer ni l’harmoniser avec une titulature christologique ultérieure. La majuscule signale son emploi comme titre individuel dans les Paraboles.
- source_word: ወእዌልጦ
  choice: puis je transformerai
  rationale: Le verbe exprime un changement réel; «transformer» préserve la force de l’image de renouvellement cosmique. «Puis» rend naturellement la coordination sans effacer la succession des actes.
- source_word: ለሰማይ
  choice: le ciel
  rationale: Dans ce contexte apocalyptique, il s’agit du domaine cosmique plutôt que du seul ciel visible.
- source_word: ወእገብራ
  choice: et j’en ferai
  rationale: Le pronom «en» reprend clairement «le ciel» et rend la construction française naturelle.
- source_word: በረከተ፡ ወብርሃነ
  choice: une bénédiction et une lumière
  rationale: Conserve les deux substantifs et l’imagerie concrète de bienfait et de rayonnement, sans les convertir en simples adjectifs.
- source_word: ለዓለም
  choice: pour toujours
  rationale: Rend la valeur adverbiale de durée de la locution guèze, plutôt que de la transformer en adjectif qualifiant seulement les deux noms.
theological_decisions:
- issue: Identité et traduction de ኅሩየ ዚአየ
  choice: mon Élu
  alternative: celui que j’ai choisi
  rationale: «Mon Élu» conserve la forme titulaire concise du passage tout en évitant d’ajouter une identification doctrinale absente du guèze.
- issue: Portée du renouvellement cosmique
  choice: je transformerai le ciel et j’en ferai une bénédiction et une lumière pour toujours
  alternative: je changerai le ciel, et il sera béni et lumineux pour toujours
  rationale: Le choix retenu garde le ciel comme objet explicite de la transformation et conserve les substantifs «bénédiction» et «lumière», sans réduire l’image cosmique à des qualités morales.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe demeure proche du guèze tout en évitant une tournure artificielle. Les deux notes signalent les principales possibilités lexicales sans surcharger le verset.
