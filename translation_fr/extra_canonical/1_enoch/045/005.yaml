base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: fr
  text: Et je transformerai la terre ferme et j’en ferai une bénédiction[a]. J’y établirai ceux que j’ai choisis, mais ceux qui commettent le péché et la transgression n’y iront pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je la rendrai bénie ». La formulation éthiopienne peut exprimer le fait de faire de la terre ferme une bénédiction ou de la rendre bénie.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « n’y iront pas » ou « n’y marcheront pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እዌልጦ
  choice: je transformerai
  rationale: Le verbe exprime un changement d’état marqué; « transformer » convient au renouvellement eschatologique sans en préciser indûment la nature.
- source_word: ለየብስ
  choice: la terre ferme
  rationale: የብስ désigne la terre sèche ou ferme, par opposition aux eaux; dans le contexte, cette expression conserve la portée terrestre et cosmique plutôt que d’évoquer seulement un sol aride localisé.
- source_word: እገብራ በበረከት
  choice: j’en ferai une bénédiction
  rationale: 'La tournure préserve la valeur résultative de la construction: la terre devient une bénédiction, plutôt que d’être simplement qualifiée de bénie.'
- source_word: ሕሩያነ ዚአየ
  choice: ceux que j’ai choisis
  rationale: Cette formulation française naturelle garde l’idée de personnes choisies par le locuteur divin sans importer le vocabulaire doctrinal plus chargé d’« élus ».
- source_word: አነብሮሙ ውስቴታ
  choice: J’y établirai
  rationale: Le causatif indique que le locuteur fait habiter ou installe activement les personnes choisies; « établir » restitue cette action de façon concise et naturelle.
- source_word: ኃጢአተ ወጌጋየ
  choice: le péché et la transgression
  rationale: Le doublet moral est conservé au lieu d’être réduit à une notion générique unique.
- source_word: ኢይከይዱ ውስቴታ
  choice: n’y entreront pas
  rationale: Le verbe signifie littéralement aller ou marcher. Dans ce contraste avec l’établissement des personnes choisies, « entrer » exprime naturellement l’exclusion du territoire, tandis qu’une note signale la formulation plus littérale.
theological_decisions:
- issue: Identité de ceux qui sont choisis
  choice: « ceux que j’ai choisis » sans identification doctrinale supplémentaire
  alternative: « mes élus » ou « mes saints »
  rationale: Le texte désigne les personnes choisies par Dieu, mais ne justifie pas ici de les assimiler explicitement à une communauté ecclésiale ou à une autre catégorie théologique ultérieure.
- issue: Portée de la promesse concernant la terre
  choice: Image concrète de la terre ferme transformée en bénédiction
  alternative: Interprétation purement métaphorique, ou traduction par « désert »
  rationale: La terre ferme forme vraisemblablement le pendant terrestre du ciel mentionné dans le contexte. La traduction préserve cette image cosmique sans trancher toutes ses implications symboliques.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux phrases clarifie l’opposition. « Terre ferme » garde l’écho biblique et la portée cosmique; « ceux que j’ai choisis » évite la charge confessionnelle possible d’« élus ».
