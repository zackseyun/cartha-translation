- from: Ils ne monteront pas au ciel et n’arriveront pas sur la terre[a]. Tel sera le sort des pécheurs qui ont renié le nom du Seigneur des esprits et qui sont ainsi gardés pour le jour de l’affliction et de la détresse[b].
  to: Ils ne monteront pas au ciel et n’atteindront pas la terre[a]. Tel sera le sort des pécheurs qui ont renié le nom du Seigneur des esprits et qui sont ainsi gardés pour le jour de l’affliction et de la détresse[b].
  rationale: La seule révision remplace une tournure française maladroite par « n’atteindront pas la terre ». Elle respecte la syntaxe directionnelle et les verbes dont les pécheurs sont les sujets, sans adopter l’ancienne interprétation fautive qui faisait du ciel et de la terre les sujets. Les notes sont conservées, avec adaptation de la citation littérale à la formulation révisée.
