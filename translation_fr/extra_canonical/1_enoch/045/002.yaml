base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: fr
  text: Ils ne monteront pas au ciel et n’atteindront pas la terre[a]. Tel sera le sort des pécheurs qui ont renié le nom du Seigneur des esprits et qui sont ainsi gardés pour le jour de l’affliction et de la détresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation est difficile : le texte dit littéralement qu’ils ne monteront pas au ciel et n’atteindront pas la terre. Elle peut évoquer l’absence de tout refuge dans l’univers.'
    reason: textual_difficulty
  - marker: b
    text: 'Ou : « le jour de l’oppression et de l’angoisse ». Les deux termes associés renforcent l’idée du jugement à venir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  choice: monteront
  rationale: Le verbe exprime un mouvement ascendant. Avec ሰማየ, accusatif de direction, « monteront au ciel » respecte directement la syntaxe guèze.
- source_word: ይበጽሑ
  choice: arriveront
  rationale: Le verbe signifie couramment « arriver, atteindre ». « Arriveront sur la terre » conserve l’image difficile du texte sans lui substituer une explication.
- source_word: ክፍለ
  choice: sort
  rationale: Dans ce contexte de jugement, le terme désigne la part attribuée à quelqu’un. « Sort » est naturel en français et garde l’idée d’une destinée assignée.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Équivalent direct et courant de la catégorie morale employée dans le texte.
- source_word: ክሕዱ
  choice: ont renié
  rationale: « Renier » exprime la répudiation du nom divin avec plus de précision que le simple fait de nier son existence.
- source_word: ስሞ ለእግዚአ መናፍስት
  choice: le nom du Seigneur des esprits
  rationale: Cette formulation préserve le poids biblique du « nom » ainsi que le titre caractéristique du livre d’Hénoch.
- source_word: ይትዐቀቡ
  choice: sont gardés
  rationale: Le passif indique qu’ils sont maintenus ou réservés en vue du jugement, tout en laissant l’agent implicite comme dans la source.
- source_word: ስራሕ ወምንዳቤ
  choice: affliction et détresse
  rationale: Les deux termes forment une expression redoublée de souffrance eschatologique. « Affliction et détresse » demeure solennel et compréhensible sans réduire la formule à la seule idée de châtiment.
theological_decisions:
- issue: Interprétation de la proposition concernant le ciel et la terre
  choice: 'Les pécheurs sont les sujets des deux verbes : ils ne monteront pas au ciel et n’arriveront pas sur la terre.'
  alternative: Le ciel ne les recevra pas et la terre ne les atteindra pas.
  rationale: Les formes ሰማየ et ምድረ indiquent la direction, tandis que les verbes sont au pluriel. La traduction suit donc la grammaire guèze, tout en signalant que l’image obtenue demeure difficile à interpréter.
- issue: Nature du jour annoncé
  choice: jour de l’affliction et de la détresse
  alternative: jour de l’oppression et de l’angoisse
  rationale: La traduction conserve une formule générale de jugement et de souffrance sans préciser indûment qui exerce l’oppression ni systématiser la nature du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du guèze, particulièrement dans l’ouverture volontairement énigmatique. Le titre « Seigneur des esprits » est conservé de manière uniforme, sans ajout d’article devant « esprits ».
