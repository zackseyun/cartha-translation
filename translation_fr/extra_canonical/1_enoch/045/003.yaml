  to: En ce jour-là, mon Élu siégera sur le trône de gloire. Il choisira leurs œuvres, et leurs lieux de repos seront innombrables[a]. Leurs âmes s’affermiront au-dedans d’eux lorsqu’ils verront mes élus[b] et ceux qui ont trouvé refuge dans mon nom glorieux[c].
  rationale: La révision remplace l’interprétation « examinera » par « choisira », plus proche du verbe guèze et de l’audit anglais, tout en conservant en note les analyses concurrentes de la syntaxe. Elle améliore légèrement l’idiome français pour l’affermissement intérieur et le refuge dans le nom, sans modifier l’ambiguïté transmise ni résoudre l’identité de l’Élu.
