base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: fr
  text: En ce jour-là, mon Élu siégera sur le trône de gloire. Il choisira leurs œuvres, et leurs lieux de repos seront innombrables[a]. Leurs âmes s’affermiront au-dedans d’eux lorsqu’ils verront mes élus[b] et ceux qui ont trouvé refuge dans mon nom glorieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase est difficile. Le verbe traduit par « choisira » peut aussi évoquer le tri ou l’examen. Une autre analyse est : « il choisira leurs œuvres et leurs lieux de repos, sans nombre ». « Lieux de repos » peut également se rendre par « demeures » ou « stations ».'
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: Le texte passe de « mon Élu » au singulier à « mes élus » au pluriel. Il peut s’agir d’une distinction entre la figure intronisée et la communauté qui lui est associée, mais le passage demeure difficile.
    reason: textual_difficulty
  - marker: c
    text: Littéralement, l’expression évoque ceux qui ont fui vers le nom glorieux pour y trouver refuge; certaines traductions rendent plutôt « ceux qui ont invoqué mon nom glorieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: En ce jour-là
  rationale: Formule temporelle apocalyptique naturelle en français moderne, qui conserve le registre prophétique.
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: siégera sur le trône de gloire
  rationale: Dans le contexte d’un trône, le verbe évoque le fait de prendre place ou de siéger; « trône de gloire » maintient la construction du guèze.
- source_word: ኅሩየየ
  choice: mon Élu
  rationale: Le singulier et le suffixe possessif sont conservés. La majuscule signale l’emploi comme titre sans identifier explicitement cette figure au Messie ou au Fils de l’homme.
- source_word: የኀሪ ምግባሪሆሙ
  choice: Il examinera leurs œuvres
  rationale: Le verbe peut exprimer le choix, le tri ou l’examen. « Examinera » donne un sens français intelligible dans ce contexte d’évaluation, tandis que la note préserve l’incertitude lexicale.
- source_word: ምዕራፎሙ ኍልቈ አልቦ
  choice: leurs lieux de repos seront innombrables
  rationale: Cette segmentation comprend « sans nombre » comme prédicat des lieux de repos. Elle est syntaxiquement possible et évite l’expression obscure « choisir des lieux de repos sans nombre », tout en signalant l’autre analyse en note.
- source_word: ነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: Leurs âmes s’affermiront en eux
  rationale: Le pluriel est idiomatique en français pour le nom muni d’un suffixe pluriel; le verbe garde l’idée de force et de fermeté intérieures.
- source_word: ለኅሩያነ ዚአየ
  choice: mes élus
  rationale: Le pluriel du texte est maintenu, sans l’harmoniser avec le titre singulier « mon Élu ».
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: ceux qui se sont réfugiés en mon nom glorieux
  rationale: Le verbe ሰከየ renvoie à la fuite ou au refuge. Cette traduction conserve l’image spécifique du nom divin comme refuge, plutôt que de la remplacer par l’idée plus générale d’invocation.
theological_decisions:
- issue: Identité de « mon Élu »
  choice: Conserver le titre « mon Élu » sans explicitation christologique.
  alternative: « le Messie » ou « le Fils de l’homme »
  rationale: Le verset emploie ici le titre d’Élu; une identification plus précise résoudrait une question que le texte local laisse ouverte.
- issue: Passage du singulier « mon Élu » au pluriel « mes élus »
  choice: Maintenir la différence de nombre et la signaler en note.
  alternative: Harmoniser les deux expressions au singulier ou au pluriel.
  rationale: Le texte guèze transmis présente cette alternance; elle peut distinguer la figure intronisée de la communauté élue et ne doit pas être supprimée silencieusement.
- issue: Image liée au nom glorieux
  choice: Traduire le verbe par « se réfugier » plutôt que par « invoquer ».
  alternative: « ceux qui ont invoqué mon nom glorieux »
  rationale: Le sens lexical de fuite ou de refuge est préférable et conserve une image théologique propre au passage sans l’harmoniser avec une formule biblique plus courante.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme apocalyptique est conservé sans archaïsmes. Les titres restent proches du texte guèze, et les difficultés lexicales ou syntaxiques sont exposées en notes plutôt que résolues par harmonisation.
