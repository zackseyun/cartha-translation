    issue: « Il examinera leurs œuvres » atténue le sens premier de የኀሪ.
    rationale: Le verbe est lié au champ lexical du choix et l’audit anglais retient « will choose ». « Examinera » est une interprétation possible dans un cadre de jugement, mais elle ne devrait pas remplacer sans réserve le sens plus direct dans le texte principal.
  - severity: low
    issue: « s’affermiront en eux » est légèrement raide en français contemporain.
    rationale: « au-dedans d’eux » conserve l’image intérieure du guèze tout en donnant une formulation plus fluide.
