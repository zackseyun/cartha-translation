base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: fr
  text: Et je vis l’un de ces quatre qui étaient sortis les premiers. Il saisit cette première étoile qui était tombée du ciel, lui lia les mains et les pieds[a], puis la jeta dans l’abîme[b]. Cet abîme était étroit, profond, effrayant et obscur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mains et les pieds attribués à l’« étoile » montrent que, dans la vision, ce symbole figure un être céleste personnel soumis au jugement.
    reason: cultural_note
  - marker: b
    text: Ou « dans la profondeur ». Le terme guèze désigne une profondeur; « abîme » conserve ici l’image apocalyptique d’un lieu de détention.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Formule narrative visionnaire claire et digne, correspondant directement au verbe de perception.
- source_word: አሐደ፡ እምእልኩ፡ ፬እለ
  choice: l’un de ces quatre
  rationale: Conserve à la fois la sélection au sein du groupe et la valeur anaphorique du démonstratif.
- source_word: ወፅኡ፡ እምቅዳሚ
  choice: qui étaient sortis les premiers
  rationale: Rend እምቅዳሚ adverbialement, sans ajouter de complément absent, et maintient l’écho avec « première étoile ».
- source_word: አሐዘ
  choice: saisit
  rationale: Exprime naturellement une prise ferme dans cette scène d’arrestation et d’enchaînement.
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: cette première étoile
  rationale: Préserve le symbole explicite de l’étoile ainsi que le démonstratif et l’ordinal.
- source_word: ዘወድቀ፡ እምሰማየ
  choice: qui était tombée du ciel
  rationale: Le plus-que-parfait situe correctement la chute avant la saisie et conserve l’image verticale.
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: lui lia les mains et les pieds
  rationale: Le pronom personnel français permet une formulation naturelle tout en laissant les membres corporels signaler le caractère personnel du référent symbolisé.
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: puis la jeta dans l’abîme
  rationale: « Jeta » convient à l’action punitive; « puis » rend naturellement l’enchaînement narratif sans affaiblir la coordination.
- source_word: ማዕምቅ
  choice: abîme
  rationale: Rend la profondeur et la fonction apocalyptique de lieu de confinement mieux que le terme plus général « profondeur ».
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: étroit, profond, effrayant et obscur
  rationale: Suite adjectivale naturelle en français qui conserve les quatre qualités cumulatives; « effrayant » exprime la terreur suscitée sans surinterpréter.
theological_decisions:
- issue: Faut-il identifier explicitement l’étoile déchue comme un ange dans le texte principal?
  choice: Conserver « étoile » et laisser les mains et les pieds révéler le caractère personnel du symbole.
  alternative: Traduire directement par « ange » ou employer partout un pronom masculin.
  rationale: Le guèze nomme explicitement une étoile. La traduction préserve donc l’image visionnaire et sa tension théologique au lieu de la remplacer par son interprétation.
- issue: Valeur de እምቅዳሚ après la sortie des quatre
  choice: 'Comprendre l’expression adverbialement: « les premiers ».'
  alternative: « devant eux » ou « avant eux ».
  rationale: Le texte ne fournit aucun pronom correspondant à « eux »; la lecture adverbiale évite cet ajout et conserve l’écho lexical avec ቀዳማይ, « première ».
translation_notes:
  register: Français international moderne, accessible et digne. La syntaxe reste proche de la progression du guèze, mais la coordination est légèrement allégée pour être naturelle en français. Les démonstratifs maintiennent les renvois au contexte antérieur, et le symbole de l’étoile n’est pas explicité dans le corps du texte.
