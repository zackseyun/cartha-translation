  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: fr
  text: L’un d’eux tira une épée et la donna à ces éléphants, chameaux et ânes ; alors, ils commencèrent à se frapper les uns les autres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation éthiopienne de la fin du verset est difficile. Le sens paraît être qu’après avoir reçu l’épée, ces animaux se livrèrent à une violence mutuelle ; « commencèrent à se frapper les uns les autres » est une traduction prudente.
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ
  choice: tira
  rationale: Avec « épée » comme complément, le verbe désigne naturellement l’action de tirer l’arme, sans expliciter davantage le geste.
- source_word: ሰይፈ
  choice: une épée
  rationale: Le terme concret courant convient à l’objet de cette vision symbolique et en préserve l’image.
- source_word: ወወሀቦሙ
  choice: et la donna
  rationale: Cette formulation simple rend directement le transfert de l’épée et conserve le rythme narratif.
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: à ces éléphants, à ces chameaux et à ces ânes
  rationale: Les noms d’animaux sont maintenus littéralement comme éléments de la vision, dans un français moderne et courant.
- source_word: አንዘ እንዘ ይትደአ
  choice: alors, ils commencèrent à se frapper les uns les autres
  rationale: La formulation rend prudemment le début d’une violence réciproque, tout en préservant le caractère physique du verbe et la difficulté de l’éthiopien.
theological_decisions:
- issue: Nature de l’imagerie animale
  choice: Conserver dans le texte les animaux littéraux comme figures de la vision, sans identifier leurs référents historiques.
  alternative: Remplacer ou gloser directement les animaux par des nations ou des armées.
  rationale: L’Apocalypse des animaux exprime son message par une imagerie symbolique ; la traduction doit préserver cette imagerie plutôt que la réduire à une interprétation.
- issue: Sens de la proposition finale
  choice: Rendre prudemment une violence mutuelle qui commence après la remise de l’épée.
  alternative: Traduire de façon plus générale par « ils se combattirent » ou attribuer explicitement chaque coup à l’épée.
  rationale: La formulation éthiopienne est difficile ; il faut préserver son indétermination sans ajouter que tous emploient nécessairement l’épée.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit visionnaire écrit. « Ânes » évite tout archaïsme, tandis que la syntaxe conserve la succession sobre des actions et l’ambiguïté du texte source.
