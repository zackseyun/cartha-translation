  yaml_path: translation/extra_canonical/1_enoch/075/005.yaml
  text: and for the winds[a], and for the spirit of dew[c][b], when the openings are opened in heaven at the ends.
translation:
  language: fr
  text: et pour les vents[a], et pour l’esprit de la rosée[b], lorsque les ouvertures s’ouvrent dans le ciel, aux extrémités.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot peut parfois signifier « esprits », mais il désigne ici vraisemblablement les vents cosmiques.
    reason: lexical_alternative
  - marker: b
    text: Expression difficile; on pourrait aussi traduire « le souffle de la rosée » ou comprendre un vent porteur de rosée.
    reason: lexical_alternative
  - marker: c
    text: La proposition allant de « lorsque » à « extrémités » est textuellement incertaine dans le témoin source. « Ouvertures » peut aussi se traduire par « fenêtres » ou « évents » du ciel.
    reason: textual_variant
lexical_decisions:
- source_word: ነፋሳት
  choice: vents
  rationale: Dans le Livre astronomique, le terme désigne ici les vents comme phénomènes cosmiques, plutôt que des esprits abstraits.
- source_word: መንፈሰ ጠል
  choice: esprit de la rosée
  rationale: Cette expression inhabituelle reproduit l’image guèze sans la réduire à une simple désignation météorologique; « souffle de la rosée » reste possible.
- source_word: ሶበ
  choice: lorsque
  rationale: Conjonction temporelle naturelle qui introduit la circonstance décrite.
- source_word: ይትረኃዉ
  choice: s’ouvrent
  rationale: Le verbe a ici une valeur passive ou réfléchie; le français idiomatique « s’ouvrent » évite d’introduire un agent absent du texte.
- source_word: ርኅወተ
  choice: les ouvertures
  rationale: Terme général qui conserve l’image d’ouvertures célestes sans préciser indûment « fenêtres », « évents » ou « portes ».
- source_word: በሰማይ
  choice: dans le ciel
  rationale: Le substantif source est au singulier; « dans le ciel » respecte ce nombre et convient au cadre cosmologique.
- source_word: አጽናፈ
  choice: aux extrémités
  rationale: Le terme évoque les limites ou les confins du ciel; « extrémités » conserve cette géographie cosmique sans imposer l’idée plus précise d’horizons.
theological_decisions:
- issue: Faut-il démystifier l’expression relative à la rosée en langage météorologique ordinaire?
  choice: Conserver « l’esprit de la rosée » dans le texte principal.
  alternative: « le souffle de la rosée », « le vent porteur de rosée » ou simplement « la rosée »
  rationale: Le passage énumère des agents et mécanismes cosmiques. Garder cette formulation insolite préserve l’imagerie apocalyptique ainsi que l’ambiguïté du terme መንፈሰ.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination fragmentaire initiale est conservée parce que ce verset poursuit une énumération. Le singulier « ciel » et l’absence de possessif devant « ouvertures » suivent précisément le guèze.
