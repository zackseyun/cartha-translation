base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: fr
  text: 'Car, en ce qui concerne les signes, les temps fixés[a], les années et les jours, Uriel — l’ange que le Seigneur de gloire a établi pour toujours sur tous les luminaires du ciel, dans le ciel et dans le monde[b] — m’a montré comment ils exercent leur domination sur la face du ciel[c], sont visibles depuis la terre et deviennent les guides du jour et de la nuit : le soleil, la lune, les étoiles et toutes les puissances qui servent[d], lesquelles accomplissent leur ronde dans tous les chars du ciel[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les saisons ». Le terme peut désigner des divisions déterminées du temps dans un cadre calendérique.
    reason: lexical_alternative
  - marker: b
    text: 'La construction peut aussi se comprendre ainsi : « l’ange que le Seigneur de gloire a établi pour toujours sur tous les luminaires » ; le rattachement de « dans le ciel et dans le monde » demeure difficile.'
    reason: textual_ambiguity
  - marker: c
    text: « La face du ciel » est une image littérale désignant l’étendue visible du ciel.
    reason: cultural_note
  - marker: d
    text: L’expression est incertaine ; elle peut désigner des puissances célestes au service de l’ordre cosmique ou les fonctions ordonnées associées aux astres.
    reason: lexical_alternative
  - marker: e
    text: Les « chars du ciel » peuvent évoquer les parcours ordonnés des corps célestes ; la traduction conserve l’image du texte.
    reason: cultural_note
lexical_decisions:
- source_word: ትእምርት
  choice: signes
  rationale: Dans ce contexte astronomique, le terme désigne des indicateurs célestes observables sans impliquer nécessairement des présages funestes.
- source_word: አዝማን
  choice: temps fixés
  rationale: Le pluriel évoque des divisions déterminées du temps cosmique; ce choix conserve mieux la nuance calendérique que le seul mot « saisons ».
- source_word: መዋዕል
  choice: jours
  rationale: La série des unités temporelles favorise le sens concret de « jours ».
- source_word: አርአየኒ
  choice: m’a montré
  rationale: Rend directement le verbe de vision sans ajouter la nuance interprétative de « révéler ».
- source_word: እግዚአ ስብሐት
  choice: le Seigneur de gloire
  rationale: Conserve la forme et le registre élevé du titre divin.
- source_word: ለዓለም
  choice: pour toujours
  rationale: Le complément temporel explicite qualifie l’établissement d’Uriel et ne doit pas être omis.
- source_word: ብርሃናት ሰማይ
  choice: les luminaires du ciel
  rationale: « Luminaires » garde le sens cosmique et quasi technique des corps célestes ordonnés.
- source_word: ይምልኩ
  choice: exercent leur domination
  rationale: Le verbe exprime une autorité réelle; cette formulation préserve la personnification cosmique du texte.
- source_word: ገጸ ሰማይ
  choice: la face du ciel
  rationale: Traduction littérale de l’image désignant l’étendue céleste visible.
- source_word: መራሕያነ
  choice: guides
  rationale: Le terme présente les luminaires comme ceux qui dirigent ou règlent le jour et la nuit.
- source_word: ቅንየታት
  choice: puissances qui servent
  rationale: Le mot est difficile; cette formulation conserve à la fois une possible référence à des êtres célestes et leur fonction de service.
- source_word: የአውዱ
  choice: accomplissent leur ronde
  rationale: Rend le mouvement circulaire ou processionnel indiqué par le verbe.
- source_word: ሰረገላት ሰማይ
  choice: chars du ciel
  rationale: Maintient l’image apocalyptique concrète au lieu de la remplacer par « orbites » ou « trajectoires ».
theological_decisions:
- issue: Caractère personnel et souverain de l’activité des luminaires
  choice: Conserver « exercent leur domination » et « guides »
  alternative: Employer un langage astronomique impersonnel, comme « parcourent le ciel et marquent le jour et la nuit »
  rationale: Le guèze emploie un vocabulaire de gouvernement. Le neutraliser imposerait une cosmologie moderne étrangère au passage.
- issue: Sens des « puissances qui servent »
  choice: Préserver une expression ouverte pouvant désigner des puissances célestes ou des fonctions ordonnées
  alternative: Réduire l’expression à des mécanismes astronomiques, ou l’identifier avec certitude à des anges
  rationale: Le terme source est incertain; la traduction ne doit trancher ni en faveur d’une lecture purement mécanique ni en faveur d’une identification angélique précise.
- issue: Image des chars célestes
  choice: Garder « chars du ciel » dans le texte
  alternative: Interpréter directement par « orbites » ou « trajectoires célestes »
  rationale: L’image appartient à la représentation apocalyptique du passage et doit demeurer visible, même si elle peut évoquer les parcours ordonnés des astres.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe ample et l’imagerie cosmique sont conservées, tandis que les incertitudes lexicales et syntaxiques sont signalées sans être résolues dans un sens confessionnel.
