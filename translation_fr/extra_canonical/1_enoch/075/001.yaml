revisions:
- from: Les dirigeants des chefs de milliers[a], préposés à toute la création et à toutes les étoiles, ainsi que ces quatre qui viennent s’ajouter[b], ne s’écartent pas de leur tâche selon le calcul de l’année. Et ceux-ci accomplissent leur service[c] pendant les quatre jours qui ne sont pas comptés dans le calcul de l’année[d].
  to: Les dirigeants des chefs de milliers[a], qui ont autorité sur toute la création et sur toutes les étoiles, ainsi que ces quatre qui sont ajoutés[b], ne s’écartent pas de leur tâche selon le calcul de l’année. Et ceux-ci accomplissent leur service[c] lors des quatre jours qui ne sont pas comptés dans le calcul de l’année[d].
  rationale: La révision resserre la correspondance avec les formes passives et la relation de surintendance du guèze, tout en conservant les ambiguïtés syntaxiques et référentielles du passage. Les ancres et les quatre notes sont maintenues, avec une correction de la note b afin qu’elle n’ajoute pas un référent absent du texte source.
