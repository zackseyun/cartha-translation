base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: fr
  text: Les dirigeants des chefs de milliers[a], qui ont autorité sur toute la création et sur toutes les étoiles, ainsi que ces quatre qui sont ajoutés[b], ne s’écartent pas de leur tâche selon le calcul de l’année. Et ceux-ci accomplissent leur service[c] lors des quatre jours qui ne sont pas comptés dans le calcul de l’année[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Leurs dirigeants, les chefs de milliers ». Littéralement, l’expression associe des « dirigeants » aux « chefs de milliers ».'
    reason: syntactic_alternative
  - marker: b
    text: 'Ou : « ces quatre qui sont joints ». Le verbe peut exprimer l’ajout ou le rattachement au système ordonné de l’année.'
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe guèze est difficile : il peut aussi suggérer qu’ils se relaient ou changent de fonction.'
    reason: lexical_alternative
  - marker: d
    text: Ces « quatre jours » sont les jours calendériques supplémentaires liés aux tournants de l’année dans le système de 364 jours exposé par le Livre astronomique. Le passage peut toutefois associer ces jours à des responsables célestes.
    reason: cultural_note
lexical_decisions:
- source_word: መራሕያኒሆሙ ለአርእስተ አእላፍ
  choice: Les dirigeants des chefs de milliers
  rationale: Cette traduction conserve la relation syntaxique littérale entre les « dirigeants » et les « chefs de milliers », tout en signalant en note l’autre découpage possible.
- source_word: ዲበ ኵሉ ፍጥረት ወዲበ ኵሉ ከዋክብት
  choice: préposés à toute la création et à toutes les étoiles
  rationale: « Préposés à » exprime naturellement en français l’autorité ou la responsabilité cosmique indiquée par la préposition guèze, sans préciser indûment la nature de cette fonction.
- source_word: ምስለ እሉ ፬ እለ ይትዌሰኩ
  choice: ainsi que ces quatre qui viennent s’ajouter
  rationale: Le relatif እለ est explicitement rendu et rattache l’ajout aux « quatre ». La tournure pronominale évite de décider s’il s’agit directement de jours, d’agents célestes ou des deux.
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: ne s’écartent pas de leur tâche
  rationale: La formulation garde l’image de non-séparation et rend ምግባር par le terme fonctionnel et courant « tâche ».
- source_word: በከመ ሐሳበ ዓመት
  choice: selon le calcul de l’année
  rationale: « Calcul » restitue le sens technique et calendérique de ሐሳብ dans un français moderne et clair.
- source_word: ይትቀየዩ
  choice: accomplissent leur service
  rationale: Le verbe est difficile et peut évoquer le changement ou l’alternance. Le choix contextuel exprime l’exercice d’une fonction sans imposer un mécanisme précis; l’incertitude est indiquée en note.
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ
  choice: les quatre jours qui ne sont pas comptés
  rationale: Traduction directe de l’énoncé calendérique, immédiatement compréhensible en français.
theological_decisions:
- issue: Nature des « quatre »
  choice: Le texte principal maintient la désignation ouverte « ces quatre », puis reprend explicitement les « quatre jours » dans la proposition finale.
  alternative: Identifier d’emblée les quatre soit aux jours intercalaires, soit à leurs responsables célestes.
  rationale: Le guèze nomme d’abord simplement « ces quatre », tandis que la fin du verset parle de quatre jours. Dans le cadre apocalyptique du livre, jours calendériques et agents célestes peuvent être étroitement associés; la traduction ne tranche donc pas ce que le texte laisse ouvert.
- issue: Antécédent de « ceux-ci »
  choice: Conserver un démonstratif pluriel dont le référent reste dépendant de la syntaxe du passage.
  alternative: Remplacer le démonstratif par « ces quatre » ou par « les dirigeants » afin d’imposer un référent.
  rationale: La formulation source ne permet pas d’identifier le référent avec une certitude suffisante; « ceux-ci » préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve la hiérarchie cosmique et le vocabulaire calendérique du texte guèze, tout en fractionnant légèrement la syntaxe pour rester lisible. Les ambiguïtés concernant les « quatre », le verbe ይትቀየዩ et la structure de l’expression initiale sont maintenues ou documentées.
