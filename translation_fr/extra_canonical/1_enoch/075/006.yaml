base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: fr
  text: Quand s’ouvrent les douze autres portes du ciel[a], aux extrémités de la terre[b], d’où sortent le soleil, la lune et les étoiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvertures du ciel » ; le terme désigne des passages dans la structure céleste.
    reason: lexical_alternative
  - marker: b
    text: L’expression « extrémités de la terre » relève de la représentation cosmologique ancienne du passage.
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Quand
  rationale: La conjonction introduit ici une proposition temporelle; « quand » respecte mieux la syntaxe que « alors ».
- source_word: ይትረኃዉ
  choice: s’ouvrent
  rationale: La forme verbale exprime l’ouverture des portes. Le passif « sont ouvertes » serait aussi possible, mais le pronominal français est plus naturel sans introduire d’agent.
- source_word: ፲ሥሩ ወካልእ
  choice: les douze autres
  rationale: La traduction retient le nombre douze et rend ካልእ par « autres », signalant un ensemble supplémentaire dans la description.
- source_word: ኃዋላወ
  choice: portes
  rationale: Dans cette représentation cosmologique, le terme désigne des ouvertures par lesquelles passent les corps célestes. « Portes » conserve l’image architecturale et évite la répétition « ouvertures… s’ouvrent ».
- source_word: በሰማይ
  choice: du ciel
  rationale: Le génitif français « portes du ciel » est plus idiomatique que « portes dans le ciel » tout en conservant la localisation cosmique.
- source_word: ዲበ አጽናፈ ምድር
  choice: aux extrémités de la terre
  rationale: Cette formulation conserve l’image cosmologique ancienne des confins ou bords de la terre.
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: celles d’où sortent
  rationale: Le relatif reprend explicitement « portes » et préserve le mouvement concret de sortie.
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: le soleil, la lune et les étoiles
  rationale: Énumération naturelle en français, avec les articles requis par l’usage.
theological_decisions:
- issue: Représentation cosmologique des portes célestes
  choice: Conserver les images concrètes des « portes du ciel » et des « extrémités de la terre »
  alternative: Les interpréter comme des horizons, des directions ou des secteurs astronomiques
  rationale: Le passage décrit une architecture cosmique ancienne. La traduction n’en modernise pas silencieusement la représentation.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la proposition temporelle et la tension syntaxique du texte, tout en rendant explicite en français l’antécédent du relatif par « celles ».
