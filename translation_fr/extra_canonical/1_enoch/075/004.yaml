base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: fr
  text: De même, Uriel me montra douze ouvertures dans le circuit des chars du soleil, dans le ciel. C’est par elles que sortent les rayons du soleil[a] et que la chaleur se répand sur la terre, lorsqu’elles s’ouvrent, aux temps qui leur sont fixés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze est difficile et signifie littéralement quelque chose comme les « pieds » du soleil ; dans ce contexte, il désigne probablement ses rayons.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ወ፪ኆኃውተ (lecture restaurée derrière ፲ሥሩ ወካልእ)
  choice: douze ouvertures
  rationale: La transcription paraît gravement altérée; la lecture restaurée correspond au système des douze ouvertures décrit dans ce contexte astronomique.
- source_word: ኃዋላወ / በአውደ (lecture restaurée derrière በአበበ)
  choice: dans le circuit
  rationale: « Circuit » conserve l’organisation circulaire et concrète du mécanisme céleste sans la réduire à de simples mouvements abstraits.
- source_word: ሰረገላት ፀሐይ
  choice: les chars du soleil
  rationale: Cette formulation maintient l’image cosmologique explicite des véhicules célestes et le registre apocalyptique.
- source_word: እገሪሃ ለፀሐይ
  choice: les rayons du soleil
  rationale: Le terme difficile peut littéralement évoquer les « pieds » du soleil; dans ce contexte d’émission solaire, « rayons » rend naturellement l’image probable tout en signalant l’incertitude en note.
- source_word: ሞቅ
  choice: la chaleur
  rationale: « Chaleur » exprime clairement l’effet saisonnier produit sur la terre.
- source_word: ሶበ ይትረኃዉ
  choice: lorsqu’elles s’ouvrent
  rationale: Le français actif pronominal est naturel et conserve l’ouverture concrète des voies célestes sans préciser un agent absent du texte.
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: aux saisons qui leur sont assignées
  rationale: Cette traduction préserve l’idée d’un ordre temporel fixé sans expliciter qui l’a établi.
theological_decisions:
- issue: Nature du mécanisme céleste
  choice: Conserver les images concrètes des ouvertures, du circuit et des chars solaires.
  alternative: Reformuler le passage comme une simple description abstraite de la lumière solaire et des saisons.
  rationale: Le passage présente le cosmos au moyen d’une imagerie apocalyptique structurée; la traduction ne doit ni la moderniser ni la réduire à une explication météorologique.
- issue: Agent qui assigne les saisons
  choice: Employer le passif « qui leur sont assignées » sans nommer l’agent.
  alternative: Préciser que Dieu a fixé ces saisons.
  rationale: L’ordre divin peut être implicite dans le contexte, mais l’agent n’est pas exprimé ici; le laisser implicite évite une explicitation théologique indue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement divisée pour faciliter la lecture, tandis que les images cosmologiques concrètes et l’ambiguïté du terme rendu par « rayons » ont été conservées.
