base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: fr
  text: 'Et à cause d’eux, les humains se trompent à leur sujet[a], car ces luminaires changent leurs stations dans le monde selon la justice[b] : un dans la première porte, deux dans la troisième porte du ciel, deux dans la quatrième porte et deux dans la sixième porte[c]. Ainsi, l’ordonnancement précis du monde s’accomplit en trois cent soixante-quatre stations du monde[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les humains s’égarent à cause d’eux ». La construction peut exprimer à la fois la cause de l’erreur et ce sur quoi elle porte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « changent correctement leurs stations dans le monde ». Le mot traduit par « justice » peut désigner ici la juste régularité de l’ordre cosmique.'
    reason: theological_tension
  - marker: c
    text: La transcription guèze porte « un » pour la première porte, puis « deux » pour les troisième, quatrième et sixième portes. Certaines traductions antérieures ont « un » dans chaque porte.
    reason: textual_numeric_detail
  - marker: d
    text: La fin du verset est difficile. Les 364 stations renvoient vraisemblablement aux 364 positions ou jours du calendrier décrit dans cette partie de 1 Hénoch.
    reason: alternative_reading
lexical_decisions:
- source_word: ወበእንቲአሆሙ
  choice: Et à cause d’eux
  rationale: La locution prépositionnelle reçoit ici son sens causal naturel, tout en conservant comme antécédent les luminaires évoqués dans le contexte.
- source_word: ይጌግዩ ሰብእ ቦሙ
  choice: les humains se trompent à leur sujet
  rationale: Le verbe exprime l’erreur ou l’égarement; avec ቦሙ, il s’agit vraisemblablement d’une erreur concernant les luminaires plutôt que d’un déplacement parmi eux.
- source_word: እሙንቱ ብርሃናት
  choice: ces luminaires
  rationale: « Luminaires » désigne clairement et dignement les corps célestes dans ce passage astronomique.
- source_word: በጽድቅ
  choice: selon la justice
  rationale: Cette traduction maintient le vocabulaire moral et théologique de la justice tout en laissant entendre la régularité correcte de l’ordre cosmique.
- source_word: ይትቀየዩ መንበረ ዓለም
  choice: changent de station dans le monde
  rationale: Le verbe indique le changement ou l’alternance, et መንበር désigne un siège, une place ou une station. La formulation française exprime le déplacement ordonné sans introduire l’idée non explicite de « rendre service ».
- source_word: ኆኅት
  choice: porte
  rationale: Le mot désigne les ouvertures célestes empruntées par les luminaires. « Porte » est naturel en français et conserve l’imagerie apocalyptique.
- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: l’ordonnancement précis du monde s’accomplit
  rationale: ጥንቃቄ évoque le soin, l’exactitude ou la précision; dans ce contexte, il qualifie l’agencement réglé du monde.
- source_word: ፻፷ወ፬
  choice: trois cent soixante-quatre
  rationale: Le nombre appartient au schéma calendaire de 364 unités caractéristique de cette section, malgré les signes incertains de la transcription autour du nombre.
theological_decisions:
- issue: Portée cosmologique et morale de በጽድቅ
  choice: selon la justice
  alternative: correctement; selon l’ordre juste
  rationale: Le texte décrit une régularité astronomique au moyen du vocabulaire de la justice. La traduction conserve cette tension plutôt que de réduire le terme à une simple précision mécanique.
- issue: Interprétation des 364 stations
  choice: stations du monde
  alternative: jours de l’année; positions ordonnées
  rationale: Le texte répète le langage des stations ou sièges du monde. Le contexte suggère le calendrier hénochien de 364 jours, mais la traduction principale ne remplace pas l’image du texte par cette interprétation.
- issue: Nombres associés aux portes
  choice: un dans la première porte, deux dans chacune des troisième, quatrième et sixième portes
  alternative: un dans chacune de ces portes
  rationale: La transcription guèze présente explicitement le chiffre un avant la première porte et le chiffre deux avant les troisième, quatrième et sixième. Cette donnée du témoin source est retenue malgré la formulation différente de la couche anglaise consultative.
translation_notes:
  register: Français international moderne, clair et soutenu. « Luminaires », « stations » et « selon la justice » conservent le registre cosmologique et théologique du texte; les notes signalent les ambiguïtés syntaxiques, numériques et calendaires sans les résoudre silencieusement.
