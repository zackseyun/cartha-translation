base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: fr
  text: 'De là, je suis allé vers le sud, jusqu’aux extrémités de la terre. Là, j’ai vu trois portes du ciel ouvertes, d’où sortent le vent du sud, la rosée, la pluie et le vent. De là, je suis allé vers le levant, jusqu’aux extrémités du ciel. Là, j’ai vu trois portes du ciel ouvertes du côté du levant, et au-dessus d’elles, de petites portes. Par chacune de ces petites portes passent les étoiles du ciel, puis elles vont vers l’ouest, en suivant le chemin qui leur a été indiqué.


    Quand j’ai vu cela, j’ai béni le Seigneur de gloire. En tout temps, je bénis celui qui a fait des merveilles grandes et glorieuses, afin de montrer la grandeur de son œuvre à ses anges et aux âmes humaines, pour qu’ils célèbrent son œuvre et toutes ses actions, qu’ils voient l’œuvre de sa puissance, qu’ils le louent pour la grande œuvre de ses mains et qu’ils le bénissent pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዜብ
  choice: le sud / le vent du sud
  rationale: Le terme désigne le sud et, selon le contexte, le vent venant du sud. La première occurrence indique la direction du voyage; la seconde, parmi les phénomènes qui sortent des portes, est rendue par « le vent du sud ».
- source_word: ጽባሕ
  choice: le levant
  rationale: Le mot renvoie au matin et, par extension, à l’est, lieu du lever du soleil. « Le levant » conserve cette image tout en indiquant clairement la direction.
- source_word: ኀዋኅወ፡ ሰማይ
  choice: portes du ciel
  rationale: Le substantif désigne des ouvertures ou portes. Dans cette représentation cosmologique, « portes du ciel » est naturel et fidèle.
- source_word: በአጽናፈ
  choice: jusqu’aux extrémités
  rationale: Le terme évoque les limites, confins ou extrémités. Cette formulation conserve la distinction du texte entre les extrémités de la terre et celles du ciel.
- source_word: ነፍሳተ፡ ሰብእ
  choice: âmes humaines
  rationale: Rend directement l’expression « âmes des humains » dans un français courant, sans réduire ici « âme » à la simple idée de personne.
- source_word: እግዚአ፡ ስብሐት
  choice: Seigneur de gloire
  rationale: La construction exprime un titre génitif. Cette traduction littéraire et intelligible préserve le titre divin sans ajout confessionnel.
theological_decisions:
- issue: Destinataires de la révélation de la grandeur de l’œuvre divine
  choice: « à ses anges et aux âmes humaines »
  alternative: « à ses anges et aux êtres humains »
  rationale: Le texte nomme explicitement les anges et les âmes des humains. La traduction garde cette anthropologie sans l’expliquer ni la normaliser.
- issue: Objet final de la louange
  choice: « qu’ils le louent pour la grande œuvre de ses mains »
  alternative: « qu’ils louent la grande œuvre de ses mains »
  rationale: Le suffixe verbal renvoie à Dieu comme objet de la louange, tandis que l’œuvre de ses mains en fournit le motif. Cette construction rend les deux éléments sans effacer leur relation.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes (« De là », « Là, j’ai vu », « portes du ciel ») sont conservées. « Levant » maintient l’image cosmique du lever du soleil; le reste de la syntaxe est légèrement fluidifié pour rester accessible. Aucun élément des anciennes notes anglaises sur un témoin prétendument fragmentaire n’est repris, puisque le texte guèze fourni est complet.
