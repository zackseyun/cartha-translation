base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: fr
  text: 'De là, je suis allé vers le sud, jusqu’aux extrémités de la terre. Là, j’ai vu trois portes du ciel ouvertes[a] : de là sortent le vent du sud, la rosée, la pluie et le vent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression représente le ciel comme pourvu d’ouvertures par lesquelles sortent les phénomènes météorologiques.
    reason: cultural_note
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Formule narrative simple qui marque le déplacement depuis le lieu précédent.
- source_word: መንገለ አዜብ
  choice: vers le sud
  rationale: Rend naturellement l’orientation indiquée par le syntagme guèze.
- source_word: በአጽናፈ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: Conserve la portée cosmographique et apocalyptique de l’expression.
- source_word: ሠለስተ ኆዋኅወ ሰማይ ርኁዋተ
  choice: trois portes du ciel ouvertes
  rationale: « Portes » préserve l’image architecturale d’ouvertures célestes tout en restant idiomatique en français; « ouvertes » traduit explicitement ርኁዋተ.
- source_word: ወይወፅእ እምህየ
  choice: de là sortent
  rationale: Le présent descriptif convient à des phénomènes qui sortent habituellement de ces ouvertures.
- source_word: አዜብ
  choice: le vent du sud
  rationale: Dans cette énumération météorologique, le sens de vent venant du sud convient mieux que la simple direction.
- source_word: ጠል
  choice: la rosée
  rationale: Le terme désigne précisément la rosée et celle-ci constitue ici un élément météorologique distinct.
- source_word: ዝናም
  choice: la pluie
  rationale: Équivalent français direct du terme météorologique.
- source_word: ነፋስ
  choice: le vent
  rationale: Le contexte météorologique impose ici le sens physique de vent plutôt que celui d’esprit.
theological_decisions:
- issue: Imagerie de l’architecture cosmique
  choice: portes du ciel
  alternative: ouvertures du ciel; fenêtres du ciel
  rationale: Cette formulation conserve la représentation visionnaire d’un ciel doté d’issues par lesquelles arrivent les phénomènes météorologiques, sans rationaliser l’image ni imposer une formule canonique particulière.
