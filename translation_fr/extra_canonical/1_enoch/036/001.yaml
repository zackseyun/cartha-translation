  register: Français international actuel, sobre et digne. La syntaxe reste proche de la progression du guèze, tandis que les répétitions et l’énumération sont rendues naturellement. Le point-virgule implicite de la source est exprimé par deux phrases et un deux-points pour clarifier le lien entre les portes et ce qui en sort.
