base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: fr
  text: Après cela, il me montra les anges du châtiment, qui se tiennent prêts[a] à venir déchaîner toute la puissance des eaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme guèze est difficile; on pourrait aussi traduire : « qui sont préparés » ou « qui sont prêts ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe peut signifier « ouvrir », « délier » ou « libérer »; ici, il s’agit vraisemblablement de laisser se déployer toute la force des eaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: Après cela
  rationale: Formule temporelle naturelle en français, qui conserve l’enchaînement de la vision.
- source_word: አርአየኒ
  choice: il me montra
  rationale: Rend directement la valeur visuelle et causative du verbe sans l’expliciter excessivement.
- source_word: መላእክተ መቅሠፍት
  choice: les anges du châtiment
  rationale: Conserve la construction génitive et la tonalité judiciaire et apocalyptique; « châtiment » est ici plus idiomatique que « punition » pour désigner leur fonction.
- source_word: እለ ይልዋን
  choice: qui se tiennent prêts
  rationale: Exprime l’état de préparation tout en laissant en note l’incertitude liée à la forme guèze difficile.
- source_word: ከመ ይምጽኡ
  choice: à venir
  rationale: Rend simplement la valeur de but liée à l’expression de disponibilité.
- source_word: ወይፍትሑ
  choice: déchaîner
  rationale: Le verbe peut signifier ouvrir, délier ou libérer; avec « puissance des eaux », « déchaîner » forme une collocation française naturelle et restitue l’image d’une force retenue puis libérée.
- source_word: ኵሎ ኀይለ ማይ
  choice: toute la puissance des eaux
  rationale: Préserve l’image cosmique concrète et la totalité de la force aqueuse destinée à être libérée.
theological_decisions:
- issue: Nature des agents du châtiment
  choice: des êtres angéliques chargés d’exécuter un jugement cosmique
  alternative: des messagers humains, ou des anges exerçant seulement une correction disciplinaire
  rationale: Le contexte apocalyptique présente régulièrement des anges comme agents du jugement; leur action sur la puissance des eaux favorise nettement une lecture surnaturelle et punitive.
- issue: Rapport entre les anges et les eaux
  choice: les anges libèrent la force jusque-là contenue des eaux
  alternative: ils ouvrent matériellement les eaux ou leur puissance
  rationale: Le texte conserve une tension métaphorique entre « ouvrir » et « libérer »; « déchaîner » rend le sens contextuel sans préciser un mécanisme absent de la source.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement du récit visionnaire. « Se tiennent prêts » est naturel sans effacer l’incertitude textuelle, et « déchaîner » évite l’expression peu idiomatique « ouvrir la puissance » tout en préservant l’imagerie apocalyptique.
