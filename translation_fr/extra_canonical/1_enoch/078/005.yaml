base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: fr
  text: Ils se couchent, entrent par les portails de l’ouest[a], accomplissent leur circuit par le nord[b], puis sortent par les portails de l’est sur la face du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’image répétée des portails reflète la représentation du Livre astronomique : le ciel possède des ouvertures fixes par lesquelles passent les luminaires.'
    reason: cultural_note
  - marker: b
    text: L’expression traduite par « accomplissent leur circuit par le nord » est concise en guèze ; elle peut aussi évoquer un mouvement autour du côté nord ou le long de celui-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርቡ
  choice: se couchent
  rationale: Dans ce contexte astronomique, le verbe désigne le coucher des luminaires; cette tournure conserve son sens technique naturel en français.
- source_word: ይበውኡ
  choice: entrent
  rationale: Ce verbe de mouvement répond directement à « sortent » et convient à l’image d’un passage par des ouvertures célestes.
- source_word: ኆዋኅወ
  choice: portails
  rationale: « Portails » maintient l’image architecturale d’ouvertures fixes du ciel sans les réduire à de simples portes ordinaires.
- source_word: ምዕራብ
  choice: de l’ouest
  rationale: Le complément est idiomatique en français et conserve précisément l’orientation spatiale.
- source_word: የአውዱ
  choice: accomplissent leur circuit
  rationale: Le verbe exprime un mouvement circulaire ou un contournement; « circuit » convient au mouvement ordonné des luminaires.
- source_word: እንተ መስዕ
  choice: par le nord
  rationale: Cette formulation concise indique l’itinéraire ou le côté suivi tout en préservant la concision quelque peu ambiguë du guèze.
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: par les portails de l’est
  rationale: La formulation maintient le parallélisme avec les portails de l’ouest et indique le lieu de leur sortie.
- source_word: ይወፅኡ
  choice: sortent
  rationale: Le terme constitue le pendant naturel d’« entrent » et préserve l’image du passage par les portails.
- source_word: ዲበ ገጸ ሰማይ
  choice: sur la face du ciel
  rationale: La traduction garde l’expression cosmique concrète du texte plutôt que de l’aplanir en « dans le ciel ».
