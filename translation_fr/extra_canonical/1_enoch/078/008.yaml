base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: fr
  text: Et au cours de sa décroissance[a], le premier jour, sa lumière diminue jusqu’à quatorze parts ; le deuxième, elle diminue jusqu’à treize parts de lumière ; le troisième, elle diminue jusqu’à douze ; le quatrième, elle diminue jusqu’à onze parts ; le cinquième, elle diminue jusqu’à dix parts ; le sixième, elle diminue jusqu’à neuf parts ; le septième, elle diminue jusqu’à huit parts ; le huitième, elle diminue jusqu’à sept ; le neuvième, elle diminue jusqu’à six ; le dixième, elle diminue jusqu’à cinq ; le onzième, elle diminue jusqu’à quatre ; le douzième, elle diminue jusqu’à trois ; le treizième, elle diminue jusqu’à deux ; et le quatorzième, elle diminue jusqu’à la moitié d’un septième de toute sa lumière[b]. Le quinzième jour, le reste de toute sa lumière est consumé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa diminution ». Il s’agit de la décroissance de la lumière de la lune.'
    reason: lexical_alternative
  - marker: b
    text: L’expression guèze « la moitié d’un septième » est mathématiquement inhabituelle ; elle est conservée ici sans être simplifiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕጸጸ
  choice: décroissance
  rationale: Le nom désigne la diminution de la lumière lunaire. « Décroissance » est naturel dans un contexte astronomique et introduit clairement la phase décrite.
- source_word: የኀጽጽ
  choice: diminue jusqu’à
  rationale: Le verbe répété exprime une diminution, tandis que les nombres indiquent le niveau restant. « Jusqu’à » évite le contresens mathématique de « diminue de » et la répétition conserve le caractère formulaire de la source.
- source_word: እደ / ክፍለ
  choice: parts
  rationale: Les deux termes désignent ici des divisions mesurées de la lumière. « Parts » reste intelligible sans imposer une technicité absente du texte.
- source_word: ብርሃኑ / ብርሃን
  choice: sa lumière / lumière
  rationale: « Lumière » rend directement la réalité visible et mesurable évoquée dans le passage.
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: la moitié d’un septième
  rationale: Cette formulation conserve l’expression fractionnaire inhabituelle du guèze au lieu de la corriger ou de l’arrondir.
- source_word: ይትዌዳእ
  choice: est consumé
  rationale: Le verbe issu de ወደአ signifie ici être achevé, épuisé ou consumé. Dans la séquence de décroissance lunaire, il indique l’extinction du reste de lumière.
- source_word: ዘተረፈ፡ እምኵሉ
  choice: ce qui reste du tout
  rationale: La formulation conserve l’idée précise du reliquat de l’ensemble après les diminutions successives.
theological_decisions:
- issue: Nature de la séquence numérique
  choice: La rendre comme une description astronomique ordonnée de la décroissance de la lumière lunaire.
  alternative: Interpréter les nombres symboliquement ou résumer la séquence en une diminution générale.
  rationale: La répétition et la progression numérique relèvent du sens explicite du Livre astronomique ; elles doivent être conservées sans allégorisation.
- issue: Valeur des nombres successifs
  choice: Les comprendre comme les quantités de lumière restantes, atteintes au terme de chaque diminution.
  alternative: Les comprendre comme les quantités soustraites chaque jour.
  rationale: La construction et la progression de quatorze à deux exigent une diminution jusqu’à un niveau restant ; une traduction par « de » fausserait la logique mathématique.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « elle diminue jusqu’à » est volontaire : elle reflète la structure formulaire et mesurée du guèze. Les nombres sont écrits en toutes lettres pour maintenir le registre littéraire.'
