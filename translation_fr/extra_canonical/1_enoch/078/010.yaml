base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: fr
  text: 'Uriel me montra une autre loi[a] : lorsque la lumière est transférée dans la lune, et d’où elle est transférée depuis le soleil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un autre ordre » ou « une autre règle ». Le terme guèze peut désigner une disposition fixe de l’ordre cosmique.
    reason: lexical_alternative
  - marker: b
    text: 'La formulation guèze est condensée. On pourrait aussi rendre plus explicitement : « lorsque la lumière est transférée dans la lune, et du lieu ou du côté d’où elle est transférée depuis le soleil ». « D’où » peut évoquer le lieu, le côté ou la direction de provenance, sans que la nuance soit certaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: ካልእት
  choice: une autre
  rationale: L’adjectif introduit un nouvel élément dans la suite des règles astronomiques.
- source_word: ሥርዓተ
  choice: loi
  rationale: Dans ce contexte, le terme désigne une règle ou un ordre cosmique établi; « loi » en conserve la solennité, tandis que « ordre » reste possible.
- source_word: አርአየኒ
  choice: me montra
  rationale: Rendu direct du verbe de perception causée, naturel dans le récit visionnaire sans ajouter l’idée plus marquée de révélation.
- source_word: ይትወደይ
  choice: passe / lui vient
  rationale: La forme décrit le mouvement ou le transfert de la lumière. La variation française évite une répétition pesante tout en gardant l’idée d’un passage depuis le soleil vers la lune.
- source_word: ብርሃን
  choice: la lumière
  rationale: Le sens premier est la lumière d’un astre; l’article défini est idiomatique en français dans cette description du phénomène.
- source_word: ውስተ ወርኅ
  choice: dans la lune
  rationale: La préposition exprime ici le mouvement vers l’intérieur ou vers le domaine de la lune; « passe dans la lune » restitue cette orientation.
- source_word: እምኀበ
  choice: d’où
  rationale: Conserve la valeur spatiale de provenance sans imposer « de quel côté », nuance possible mais non certaine.
- source_word: እምፀሐይ
  choice: depuis le soleil
  rationale: Identifie explicitement le soleil comme origine du transfert de lumière.
theological_decisions:
- issue: Nature de la lumière de la lune
  choice: Le texte présente la lumière lunaire comme provenant du soleil et passant dans la lune.
  alternative: Le texte pourrait seulement décrire une relation spatiale ou une règle astronomique sans préciser le mécanisme de cette provenance.
  rationale: La répétition du verbe de mouvement, avec « dans la lune » et « depuis le soleil », favorise nettement l’idée d’une lumière dérivée, sans qu’il faille transformer cette cosmologie apocalyptique en exposé scientifique moderne.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure explicative du texte tout en allégeant en français la répétition passive du verbe. Les notes préservent les ambiguïtés de ሥርዓት et de እምኀበ.
