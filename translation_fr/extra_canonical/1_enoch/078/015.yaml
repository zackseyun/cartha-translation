lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: trois mois
  rationale: Le numéral cardinal suivi de « mois » forme le complément du verbe singulier ; le pluriel est naturel en français.
- source_word: ይገብር
  choice: il fait
  rationale: Le verbe est à la troisième personne du masculin singulier. La traduction conserve cette forme et laisse son référent être fourni par le contexte astronomique.
- source_word: ፴መዋዕለ
  choice: de trente jours
  rationale: L’expression désigne trente jours ; avec « trois mois », la tournure française « trois mois de trente jours » exprime clairement la durée de chacun.
- source_word: በአዝማነ፡ ዚአሁ
  choice: en son temps
  rationale: Le terme peut désigner un temps ou une saison déterminée. « En son temps » reste proche du guèze sans préciser excessivement la nature de ce moment.
- source_word: ሶበ
  choice: lorsque
  rationale: Conjonction temporelle introduisant la proposition finale.
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: se produit sa diminution
  rationale: Dans ce contexte lunaire et calendaire, la forme peut évoquer une diminution ou un déficit. La traduction garde cette image tout en signalant en note l’incertitude d’un passage difficile.
theological_decisions:
- issue: Référent du verbe singulier
  choice: Conserver « il » sans ajouter « la lune »
  alternative: « La lune fait »
  rationale: Le sujet grammatical est implicite dans ce fragment et dépend du contexte précédent. L’expliciter dans le corps du texte supprimerait une ambiguïté réelle.
- issue: Sens de la proposition finale
  choice: La rendre comme une diminution
  alternative: « lorsque son décompte est achevé »
  rationale: Le contexte astronomique permet de comprendre une décroissance ou un déficit, mais la forme est difficile. La note conserve l’interprétation technique liée au calcul calendaire sans l’imposer comme certaine.
