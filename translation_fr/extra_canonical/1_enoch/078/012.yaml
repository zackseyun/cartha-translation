base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: fr
  text: Le premier jour, elle est appelée « nouvelle lune »[a], parce que ce jour-là, la lumière se lève sur elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut aussi évoquer « celle qui se lève » ou « la lune croissante ». Il désigne ici la nouvelle lune, au commencement de sa phase croissante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la lumière apparaît sur elle ». L’expression guèze représente la clarté qui se lève sur la lune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: Le premier jour
  rationale: Cette expression temporelle situe la désignation au premier jour de la séquence lunaire; « le premier jour » est idiomatique et précis en français.
- source_word: ሠርቀ
  choice: nouvelle lune
  rationale: Dans ce contexte astronomique et calendaire, le terme désigne la nouvelle lune, tout en conservant l’idée étymologique de lever ou d’apparition signalée en note.
- source_word: ትሠመይ
  choice: elle est appelée
  rationale: La forme verbale féminine renvoie à la lune. Le féminin est naturel en français et préserve la formulation de désignation du texte source.
- source_word: እስመ
  choice: parce que
  rationale: La conjonction introduit la raison de la désignation donnée dans la première proposition.
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: la lumière se lève sur elle
  rationale: Cette traduction conserve l’image verticale du texte guèze, où la lumière se lève ou apparaît sur la lune, sans la réduire à une simple explication scientifique.
theological_decisions:
- issue: Référence féminine à l’astre
  choice: Employer le pronom féminin « elle » pour la lune
  alternative: Répéter « la lune » sans pronom ou neutraliser la personnification
  rationale: Les formes guèzes sont féminines et le français traite également « lune » comme un nom féminin. Ce choix maintient la texture imagée du passage sans lui attribuer une portée doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le féminin naturel de « lune » ainsi que l’image du lever de la lumière. Les guillemets marquent « nouvelle lune » comme le nom attribué à l’astre dans cette séquence.
