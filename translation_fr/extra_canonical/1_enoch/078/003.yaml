base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: fr
  text: Ce sont les deux grands luminaires. Leurs disques sont comme le disque du ciel[a], et la mesure de leurs disques est égale pour les deux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs circuits sont comme le circuit du ciel ». Le mot guèze peut désigner un cercle, une circonférence, un disque ou un parcours circulaire.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est difficile. Plus littéralement : « et la mesure de leurs cercles (ou disques), pour les deux, est la même ». Le dernier mot semble exprimer l’égalité ou l’identité de mesure.'
    reason: textual_difficulty
lexical_decisions:
- source_word: ብርሃናት
  choice: luminaires
  rationale: Dans le Livre astronomique, le terme désigne les corps célestes qui donnent de la lumière. « Luminaires » conserve ce registre cosmologique mieux que le simple « lumières ».
- source_word: ዐበይት
  choice: grands
  rationale: L’adjectif décrit naturellement l’importance ou la grandeur des deux corps célestes sans introduire l’idée de puissance que pourrait suggérer « puissants ».
- source_word: ክበቦሙ
  choice: leurs disques
  rationale: Le nom peut désigner un cercle, une circonférence, un disque ou un circuit. Ici, la comparaison de leur mesure favorise « disques », tout en laissant l’autre lecture en note.
- source_word: ከመ፡ ክበበ፡ ሰማይ
  choice: comme le disque du ciel
  rationale: ከመ exprime ici la comparaison. La répétition de ክበብ est rendue par « disque » afin de préserver l’image circulaire.
- source_word: ወእምጣነ
  choice: et la mesure
  rationale: « Mesure » rend directement l’idée d’étendue mesurée et conserve le caractère descriptif du texte.
- source_word: ለክልኤሆሙ፡ ዕሩይ
  choice: est la même pour tous les deux
  rationale: La conclusion semble exprimer l’égalité ou l’identité de mesure entre les deux luminaires. Cette formulation reste naturelle en français sans gommer la difficulté signalée en note.
