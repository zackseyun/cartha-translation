base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: fr
  text: Quand la lune se lève, elle apparaît dans le ciel comme la moitié d’une septième part[a] ; [toute la lumière est en elle,][b] et elle complète sa lumière à quatorze parts[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la moitié d’une septième part ». Il s’agit du système schématique de mesure de la lumière lunaire employé dans cette section.'
    reason: cultural_note
  - marker: b
    text: La proposition placée entre crochets est elle-même entre crochets dans le texte guèze édité ; sa syntaxe est difficile, mais elle semble signifier que toute la lumière se trouve dans la lune.
    reason: textual_variant
  - marker: c
    text: Les « quatorze parts » appartiennent au mode de calcul de la lumière lunaire propre au Livre astronomique ; ce n’est pas une description scientifique moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ይትነሣእ
  choice: se lève
  rationale: Expression française naturelle pour le mouvement apparent d’un astre, fidèle au sens d’élévation ou d’apparition.
- source_word: ወርኅ
  choice: la lune
  rationale: Dans ce contexte consacré aux luminaires, le terme désigne la lune et non le mois.
- source_word: ያስተርኢ በሰማይ
  choice: apparaît dans le ciel
  rationale: Rend directement le caractère visuel et descriptif de l’expression guèze.
- source_word: መንፈቀ ሳብዕተ እደ
  choice: la moitié d’une septième part
  rationale: Préserve le calcul fractionnaire technique du passage sans le convertir en terminologie scientifique moderne.
- source_word: ብርሃን
  choice: lumière
  rationale: Terme simple et concret convenant à l’éclairement visible de la lune.
- source_word: ከመ ዐሡር ወረቡዕ
  choice: jusqu’à quatorze parts
  rationale: Le nombre quatorze est explicite ; « parts » reprend l’unité implicite du système de mesure exposé dans le contexte.
- source_word: ይፈጽም ብርሃኖ
  choice: elle complète sa lumière
  rationale: Conserve la valeur d’achèvement du verbe ainsi que la lune comme sujet grammatical, sans paraphraser par « devient pleine ».
theological_decisions:
- issue: Faut-il remplacer le calcul numérique par une description ordinaire des phases lunaires ?
  choice: Conserver « la moitié d’une septième part » et « quatorze parts ».
  alternative: Parler d’une lune partiellement éclairée puis de la pleine lune.
  rationale: Le passage présente un système cosmologique schématique de mesure de la lumière. Le rendre par le vocabulaire courant des phases lunaires effacerait cette représentation propre au texte.
- issue: Relation entre la proposition entre crochets et la proposition finale
  choice: Les traduire comme deux propositions distinctes.
  alternative: Les fusionner en une seule affirmation sur l’achèvement de toute la lumière.
  rationale: Le témoin distingue l’affirmation textuellement difficile selon laquelle toute la lumière est en elle et l’action par laquelle la lune complète sa lumière. Les fusionner ferait disparaître cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le vocabulaire numérique inhabituel et la proposition textuellement incertaine au lieu de les normaliser. Les crochets du témoin sont conservés dans le corps du texte.
