base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: fr
  text: 'Cela s’accomplit avec exactitude : le jour, le soleil descend à l’ouest, et, de l’est, la lune monte pendant la nuit et éclaire toute la nuit, jusqu’à ce que le soleil se lève devant elle[b] ; et la lune apparaît devant le soleil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « devant le soleil » peut indiquer une position apparente ou une antériorité ; le texte ne permet pas de trancher avec certitude.
    reason: lexical_alternative
  - marker: b
    text: La forme du verbe traduit par « se lève » est textuellement difficile. Dans ce contexte, elle semble désigner l’apparition ou le lever du soleil.
    reason: textual_variant
lexical_decisions:
- source_word: ይትፌጸም
  choice: cela s’accomplit
  rationale: Le passif-réfléchi exprime l’achèvement ou l’accomplissement. « Cela s’accomplit » convient au déroulement ordonné décrit ici sans lui donner nécessairement une portée prophétique.
- source_word: ጥንቀቀ
  choice: avec exactitude
  rationale: Le terme évoque la précision et le soin ; dans le contexte astronomique et calendaire, « avec exactitude » rend bien l’idée de régularité mesurée.
- source_word: በዕለት
  choice: le jour
  rationale: Sans démonstratif, l’expression s’oppose directement à « pendant la nuit » et signifie ici « le jour », non « ce jour-là ».
- source_word: ይወርድ
  choice: descend
  rationale: Rend directement l’image du mouvement descendant du soleil, sans remplacer le verbe par l’expression astronomique plus interprétative « se couche ».
- source_word: ዐረብ
  choice: à l’ouest
  rationale: Le sens directionnel est requis par le parallèle avec l’est.
- source_word: ምሥራቅ
  choice: de l’est
  rationale: Désigne la région orientale, lieu du lever des astres.
- source_word: የዐርግ
  choice: monte
  rationale: Le verbe signifie monter ou s’élever. Son sujet différé est vraisemblablement « la lune » ; « monte » préserve mieux l’image verticale que « se lève ».
- source_word: ያበርህ
  choice: éclaire
  rationale: Le causatif exprime le fait de donner de la lumière ou de rendre lumineux. « Éclaire » est naturel et précis en français.
- source_word: በኵሉ ሌሊት
  choice: toute la nuit
  rationale: Expression française naturelle qui conserve l’étendue complète indiquée par le guèze.
- source_word: ይሠርቅ
  choice: se lève
  rationale: La forme est difficile, mais avec « le soleil » comme sujet, le contexte indique son apparition ou son lever. La difficulté textuelle est signalée en note.
- source_word: በቅድሜሁ
  choice: devant elle
  rationale: Conserve l’ambiguïté spatiale ou séquentielle de « devant », le pronom renvoyant naturellement à la lune.
- source_word: ይትረአይ
  choice: apparaît
  rationale: Le verbe de visibilité peut se rendre littéralement par « est vue » ; « apparaît » est plus naturel en français tout en gardant le sens.
- source_word: በቅድመ ፀሐይ
  choice: devant le soleil
  rationale: Traduction transparente qui ne tranche pas entre priorité temporelle et position apparente.
theological_decisions:
- issue: Faut-il normaliser la description selon une formulation astronomique attendue ?
  choice: Conserver l’enchaînement inhabituel, notamment le soleil « devant » la lune et la lune « devant » le soleil.
  alternative: Paraphraser le verset comme une simple succession du coucher du soleil, du clair de lune et du lever du soleil.
  rationale: Le texte guèze présente une description technique mais difficile. La traduction maintient sa tension et son ambiguïté au lieu de reconstruire silencieusement un modèle astronomique plus conventionnel.
- issue: Sujet du verbe የዐርግ (« monte »)
  choice: Comprendre « la lune », sujet différé après la chaîne verbale.
  alternative: Comprendre « le soleil », ce qui donnerait qu’il monte de l’est pendant la nuit.
  rationale: La syntaxe guèze permet que le sujet soit placé après plusieurs verbes, et cette analyse correspond à la structure de la proposition tout en évitant de déplacer arbitrairement « la lune ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste légèrement solennelle pour refléter le caractère technique du Livre des luminaires. « Descend », « monte » et « devant » conservent les images et ambiguïtés spatiales du guèze sans harmonisation excessive.
