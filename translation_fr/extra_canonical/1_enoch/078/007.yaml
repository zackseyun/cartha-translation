base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: fr
  text: Et quinze parts de lumière s’ajoutent en elle jusqu’au quinzième jour[a] ; sa lumière atteint alors sa plénitude comme signe de l’année. Elle compte quinze parts[b], et la lune se forme à raison d’une moitié de septième part[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à dix et cinq » ; « jour » est sous-entendu d’après le contexte.'
    reason: clarification
  - marker: b
    text: Les « quinze parts » désignent vraisemblablement la mesure complète de la lumière lunaire dans le système de calcul employé ici.
    reason: cultural_note
  - marker: c
    text: La fin de la phrase est difficile. Elle semble décrire l’accroissement de la lumière par demi-septième de part, c’est-à-dire par quatorzième ; on pourrait aussi comprendre le mot traduit par « lune » au sens de « mois ».
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት
  choice: quinze parts
  rationale: Le nombre signifie « quinze ». « Parts » est explicité d’après le décompte technique de la lumière lunaire dans le contexte immédiat.
- source_word: ብርሃን
  choice: lumière
  rationale: Le terme désigne ici la lumière visible de la lune, plutôt que l’astre lui-même.
- source_word: ይትወደደ
  choice: s’ajoutent
  rationale: Cette formulation rend l’accroissement progressif et quantifié de la lumière lunaire.
- source_word: ውስቴታ
  choice: en elle
  rationale: Le pronom renvoie à la lune évoquée dans le passage ; le français garde cette référence sans la répéter.
- source_word: እስከ ዐሡር ወኃሙስ
  choice: jusqu’au quinzième jour
  rationale: L’expression dit littéralement « jusqu’à dix et cinq ». Le mot « jour » est explicité en raison du déroulement temporel de la phase croissante.
- source_word: ይትፈጸም ብርሃነ ዚአሁ
  choice: sa lumière atteint alors sa plénitude
  rationale: Le verbe exprime l’achèvement ; « atteint sa plénitude » convient naturellement à la lumière de la pleine lune.
- source_word: ለትእምርተ ዓመት
  choice: comme signe de l’année
  rationale: La formule conserve la fonction calendaire de la lune sans lui attribuer une valeur d’augure.
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: elle compte quinze parts
  rationale: La syntaxe transmise est difficile, mais elle paraît reprendre la mesure totale de quinze parts de lumière. « Compte » exprime le total sans surinterpréter le mécanisme.
- source_word: ወርኅ
  choice: la lune
  rationale: Bien que le mot puisse aussi signifier « mois », le contexte des phases et de leur accroissement favorise ici l’astre comme sujet.
- source_word: በመንፈቀ ሳብዕ እደ
  choice: à raison d’une moitié de septième part
  rationale: La préposition est comprise comme indiquant la mesure ou l’incrément, et « moitié » comme lié à « septième part », soit une demi-septième part.
theological_decisions:
- issue: Fonction de la lumière lunaire achevée
  choice: comme signe de l’année
  alternative: comme présage pour l’année
  rationale: Le cadre est astronomique et calendaire. « Signe » préserve la portée cosmologique du texte sans introduire une interprétation divinatoire.
- issue: Référent de ወርኅ
  choice: la lune
  alternative: le mois
  rationale: La phrase décrit la progression quantifiée de la lumière ; « lune » rend mieux le sujet des phases, tout en laissant le contexte calendaire intact.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire technique du décompte lunaire, tout en explicitant seulement ce que le contexte immédiat permet d’établir.
