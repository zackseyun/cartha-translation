base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/009.yaml
  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
translation:
  language: fr
  text: Dans certains mois, le mois compte vingt-neuf jours et, une fois, vingt-huit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset est incertaine dans le témoin transcrit. « Vingt-huit » repose sur la correction probable d’une lecture fautive qui donne littéralement « cinq semaines ».
    reason: textual_variant
lexical_decisions:
- source_word: አውራኅ
  choice: mois
  rationale: Le terme est compris comme le pluriel de « mois » dans cette description du calendrier lunaire, plutôt que comme « jours » ou « parcours ».
- source_word: እሙራን
  choice: certains
  rationale: Le mot qualifie ici les mois comme déterminés ou particuliers; il ne désigne pas les luminaires.
- source_word: ይከውን
  choice: compte
  rationale: Le verbe copulatif est rendu idiomatiquement par « compte » lorsqu’il indique le nombre de jours d’un mois.
- source_word: ፳ወ፱መዋዕል
  choice: vingt-neuf jours
  rationale: Le nombre et l’unité sont explicitement exprimés dans le témoin.
- source_word: ለወርኅ
  choice: le mois
  rationale: Dans ce contexte de décompte calendaire, la construction signifie que le mois comprend le nombre de jours indiqué.
- source_word: ወቦ፡ አመ
  choice: et une fois
  rationale: Cette formulation conserve la brièveté et une certaine ambiguïté de la proposition temporelle éthiopienne.
- source_word: ፳ወ፰
  choice: vingt-huit
  rationale: La leçon « vingt-huit » suit la correction probable d’une mauvaise reconnaissance du témoin transcrit, où la séquence apparaît comme « cinq semaines ».
