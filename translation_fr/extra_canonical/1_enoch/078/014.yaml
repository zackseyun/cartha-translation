  - severity: medium
    issue: Référent ambigu de « elle décroît »
    rationale: Le féminin peut renvoyer soit à « la lumière », soit à « la lune ». L’explicitation de « la lune » reflète le mouvement lunaire décrit par le contexte sans ajouter d’explication cosmologique.
  - severity: low
    issue: Une unique note finale couvre deux expressions éloignées
    rationale: Des marqueurs distincts rendent les alternatives lexicales immédiatement identifiables et améliorent l’ancrage des notes.
