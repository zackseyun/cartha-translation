  source_fidelity: La corrélation guèze እምኀበ … እምህየ (« d’où … de là ») est bien reconnue, ainsi que l’image de la lune privée de lumière. Toutefois, « lumière pour la lune » affaiblit la direction marquée par ለ (« à la lune »), et le pronom « elle » rend incertain en français le référent du verbe de décroissance. Le texte décrit la lune dans son cycle; l’expliciter évite de faire décroître la lumière elle-même.
  naturalness: « D’où vient la lumière à la lune » est plus idiomatique et précis que « De l’endroit d’où vient la lumière pour la lune ». « La lune décroît » est une formulation française claire dans ce contexte astronomique. « Toute lumière ait disparu » rend naturellement l’achèvement total exprimé par le texte.
  terminology: « Lune », « lumière » et « disque » sont appropriés au registre cosmologique et ne modernisent pas le mécanisme. Les notes lexicales sont séparées et placées sur les expressions qu’elles éclairent.
