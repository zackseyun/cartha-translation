base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: fr
  text: D’où vient la lumière à la lune, de là la lune décroît à son tour jusqu’à ce que toute lumière ait disparu; les jours du mois[a] passent, et son disque[b] demeure vide, sans lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Les jours du mois » peut aussi se comprendre comme « les jours de la lune ».
    reason: lexical_alternative
  - marker: b
    text: « Son disque » peut également se traduire par « son cercle » ou « son orbe »; l’image est celle de la forme ronde visible de la lune, demeurée sans lumière.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ … እምህየ
  choice: De l’endroit d’où … de là
  rationale: Rend la corrélation relative-démonstrative du guèze et indique que la décroissance commence du même endroit que l’arrivée de la lumière.
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: vient la lumière pour la lune
  rationale: Conserve le mouvement de la lumière vers la lune sans introduire une explication scientifique moderne de son mécanisme.
- source_word: ካዕበ የሐፅፅ
  choice: aussi elle décroît
  rationale: « Décroît » est naturel pour la lune et décrit clairement la phase descendante; « aussi » marque le mouvement correspondant sans suggérer nécessairement une répétition temporelle.
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: jusqu’à ce que toute la lumière disparaisse
  rationale: Exprime l’achèvement de la diminution de façon naturelle en français, sans donner à « lumière » un sens figuré.
- source_word: መዋዕለ ወርኅ
  choice: les jours du mois
  rationale: Retient ici le sens temporel de ወርኅ, tout en reconnaissant que le mot peut également désigner la lune.
- source_word: ክበቡ ባክ ዘእንበለ ብርሃን
  choice: son disque reste vide, sans lumière
  rationale: « Disque » rend la forme ronde visible de la lune; « vide, sans lumière » préserve l’image appuyée du texte.
theological_decisions:
- issue: Nature de la description de la lumière lunaire
  choice: Présenter le passage comme une description cosmique de la lumière qui vient à la lune puis décroît.
  alternative: Interpréter la lumière comme une force symbolique ou angélique, ou reformuler le verset en termes scientifiques de lumière solaire réfléchie.
  rationale: Le texte décrit le cycle observé dans le registre cosmologique du Livre astronomique. La traduction ne doit ni allégoriser la lumière ni moderniser le mécanisme.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la corrélation spatiale du guèze ainsi que l’image cosmologique, sans explication scientifique ajoutée. Le marqueur [a] figure dans le texte principal.
