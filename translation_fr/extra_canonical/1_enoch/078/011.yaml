base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: fr
  text: Pendant tout le temps où la lune décroît, elle transfère sa lumière[a] devant le soleil, jusqu’à quatorze jours — [sa lumière est achevée][b] — ; et lorsqu’elle s’éteint, toute sa lumière s’achève dans le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « elle place » ou « elle transfère sa lumière devant le soleil ». L’expression « devant le soleil » peut aussi signifier « en présence du soleil » ou décrire sa relation avec la course du soleil.
    reason: lexical_alternative
  - marker: b
    text: 'Les mots entre crochets sont textuellement incertains dans la source utilisée. Leur sujet est « sa lumière », et non « quatorze jours » ; on peut aussi traduire : « [sa lumière arrive à son terme] ».'
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡ ዘተነሡር፡ ወርኅ፡
  choice: Pendant tout le temps où la lune décroît
  rationale: La tournure désigne toute la période du déclin lunaire. « Décroît » est naturel en français astronomique tout en conservant l’idée d’un processus continu.
- source_word: ብርሃነ፡ ዚአሃ፡
  choice: sa lumière
  rationale: Le syntagme désigne la lumière propre à la lune; le possessif féminin convient naturellement au genre grammatical de « lune » en français.
- source_word: ትወዲ፡
  choice: elle transfère
  rationale: Le verbe peut exprimer l’action de placer, porter ou transférer. « Transfère » conserve le modèle cosmologique concret du passage de la lumière et évite de lui substituer un second verbe signifiant simplement « décroître ».
- source_word: በቅድመ፡ ፀሐይ፡
  choice: devant le soleil
  rationale: Traduction littérale qui préserve l’ambiguïté spatiale ou relationnelle de l’expression, sans la réduire à une explication astronomique moderne.
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: jusqu’au quatorzième jour
  rationale: Le nombre indique le terme de la période. Cette formulation évite de faire grammaticalement des « quatorze jours » le sujet du verbe suivant.
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[sa lumière arrive à son terme]'
  rationale: Le passage entre crochets a explicitement « sa lumière » pour sujet. « Arrive à son terme » rend le verbe d’accomplissement ou d’achèvement sans suggérer que la lumière atteint sa pleine intensité.
- source_word: ወሶበ፡ ይውዒ፡
  choice: et lorsqu’elle s’éteint
  rationale: La formulation conserve l’image concrète de l’extinction de l’astre, caractéristique du registre cosmologique du passage.
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡ ውስተ፡ ሰማይ።
  choice: toute sa lumière s’achève dans le ciel
  rationale: « S’achève » garde le vocabulaire d’accomplissement du guèze tout en exprimant ici la disparition finale de la lumière; « ciel » convient au cadre astronomique visible.
theological_decisions:
- issue: Faut-il moderniser la description du déclin lunaire ou conserver le modèle cosmologique concret du texte ?
  choice: elle transfère sa lumière devant le soleil
  alternative: sa lumière diminue devant le soleil
  rationale: Le choix retenu suit le sens de placement ou de transfert attribué au verbe et préserve la représentation cosmique ancienne. La variante plus idiomatique résoudrait le passage selon le phénomène moderne de décroissance lunaire et risquerait d’effacer son imagerie propre.
- issue: Sens de l’achèvement de la lumière
  choice: sa lumière arrive à son terme / s’achève
  alternative: sa lumière est complète
  rationale: Dans le contexte de la lune qui décroît puis s’éteint, l’achèvement paraît désigner la fin de la lumière plutôt que sa plénitude. La traduction conserve néanmoins le même champ lexical d’accomplissement dans les deux propositions.
translation_notes:
  register: Français moderne, digne et accessible, avec maintien du caractère schématique et concret du Livre astronomique. Les crochets de la source sont conservés, et les formulations inhabituelles ne sont lissées que dans la mesure nécessaire à l’intelligibilité.
