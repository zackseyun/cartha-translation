base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: fr
  text: Dans le disque du soleil se trouvent sept portions de lumière qui s’ajoutent à lui en plus de la lumière de la lune[a] ; elles s’ajoutent selon une mesure jusqu’à ce que soit achevée la septième portion du soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe guèze est difficile. Le passage semble indiquer que la lumière du soleil dépasse celle de la lune de sept portions mesurées. La dernière proposition peut aussi se comprendre ainsi : « jusqu’à ce que la septième portion du soleil soit dépassée ».'
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ ፀሐይ
  choice: dans le disque du soleil
  rationale: Dans ce contexte, ክበብ désigne vraisemblablement le corps circulaire du luminaire plutôt que sa trajectoire. « Disque » conserve l’image cosmologique ancienne sans introduire la notion moderne d’orbite.
- source_word: ሰብዓቱ ክፍለ ብርሃን
  choice: sept portions de lumière
  rationale: Cette formulation garde le caractère quantitatif et schématique de l’exposé ; ክፍል signifie une part, une portion ou une division.
- source_word: ዘይትዌሰክ ቦቱ
  choice: qui s’ajoutent à lui
  rationale: Le sens passif d’ajout convient au développement de la luminosité décrit ici, et le pronom renvoie au soleil.
- source_word: እምወርኅ
  choice: au-delà de la lune
  rationale: La préposition peut exprimer la provenance ou la comparaison. « Au-delà de la lune » conserve prudemment la valeur comparative sans rendre la relation plus précise que le guèze.
- source_word: መስፈርት
  choice: selon une mesure
  rationale: Le terme désigne une mesure ou une norme et souligne le caractère réglé de l’accroissement.
- source_word: ትትወደይ
  choice: elles s’ajoutent
  rationale: Le contexte favorise un sens d’accroissement. La répétition respecte le style schématique du passage.
- source_word: እስከ የሐልፍ
  choice: jusqu’à ce que soit achevée
  rationale: Le verbe peut évoquer le fait de passer ou de dépasser ; dans ce contexte de progression mesurée, « soit achevée » exprime l’atteinte du terme tout en signalant en note l’incertitude syntaxique.
- source_word: ሳብዕ ክፍለ ፀሐይ
  choice: la septième portion du soleil
  rationale: ሳብዕ est l’ordinal « septième », en correspondance avec les sept portions mentionnées au début du verset.
theological_decisions:
- issue: Nature de l’affirmation cosmologique
  choice: Conserver la description ancienne et schématique de la lumière des luminaires et de sa mesure.
  alternative: Lire le passage comme un pur symbole ou le reformuler au moyen de l’astronomie moderne.
  rationale: Le Livre astronomique expose les phénomènes célestes dans le cadre d’une cosmologie apocalyptique ordonnée. La traduction ne doit ni allégoriser cette représentation ni la moderniser.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire quantitatif de la cosmologie ancienne est conservé ; l’unique note rend compte de l’ambiguïté réelle sans alourdir le texte.
