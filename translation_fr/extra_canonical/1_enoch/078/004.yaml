  rationale: La révision se limite à lever en français une ambiguïté spatiale involontaire dans l’expression comparative. Elle ne modifie ni le caractère ancien et schématique de la cosmologie, ni l’ambiguïté syntaxique de la clause finale, laquelle demeure explicitement signalée en note.
