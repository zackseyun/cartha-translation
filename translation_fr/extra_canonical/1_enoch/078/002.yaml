base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: fr
  text: 'Et la lune a quatre noms : le premier est Asonya[a], le deuxième est Abla, le troisième est Benase[b], et le quatrième est Erae.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze ወርኅ peut signifier « lune » ou « mois ». Ici, « lune » est retenu parce que le verset attribue quatre noms à l’astre.
    reason: lexical_alternative
  - marker: b
    text: Ces quatre noms sont des translittérations des formes guèzes. Leurs éventuelles formes plus anciennes demeurent incertaines.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኅ
  choice: la lune
  rationale: Le terme guèze peut désigner la lune ou le mois. Ici, les quatre noms sont attribués à l’astre; « la lune » convient donc mieux au contexte immédiat.
- source_word: አርባዕተ አስማተ ቦቱ
  choice: a quatre noms
  rationale: Cette formulation française naturelle rend la construction possessive, littéralement « quatre noms sont à elle ».
- source_word: ፩ ስሙ … ወካልእ … ወሣልስ … ወራብዕ
  choice: le premier est… le deuxième… le troisième… et le quatrième
  rationale: Cette énumération claire conserve l’ordre et la concision de la source.
- source_word: አሶንያ / አብላ / ብናሴ / ኤራእ
  choice: Asonya / Abla / Benasé / Éraé
  rationale: Les noms propres sont translittérés plutôt que traduits; les accents de Benasé et Éraé guident une lecture française sans prétendre lever toute incertitude sur leurs formes anciennes.
theological_decisions:
- issue: 'Sens de ወርኅ : « lune » ou « mois »'
  choice: lune
  alternative: mois
  rationale: Dans le Livre des luminaires, le fait d’attribuer quatre noms au référent indique ici l’astre lui-même, bien que le mot guèze puisse aussi désigner le mois.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve le style de catalogue du texte source; les noms sont francisés seulement par des accents destinés à faciliter la lecture.
