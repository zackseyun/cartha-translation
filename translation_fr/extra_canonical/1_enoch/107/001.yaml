base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: fr
  text: 'J’ai vu qu’il était écrit sur eux que, de génération en génération, on transgressera, jusqu’à ce que surgisse une génération de justice. Alors l’iniquité sera détruite, le péché disparaîtra de la terre[a], et tout bien viendra sur elle.


    Et maintenant, mon fils, va faire savoir à ton fils Lamek que cet enfant qui est né est vraiment son fils et que ce n’est pas un mensonge.


    Lorsque Mathusalem eut entendu les paroles de son père Hénoch — car celui-ci lui avait tout révélé en secret —, il revint, vit l’enfant et lui donna le nom de Noé, car celui-ci réconfortera la terre après toute dévastation[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe éthiopien peut évoquer quelque chose qui est entièrement enlevé, littéralement « léché » de la surface de la terre.
    reason: lexical
  - marker: b
    text: 'L’expression peut aussi se traduire : « il fera se réjouir la terre après toute dévastation ». Elle explique ici le nom de Noé par sa mission future.'
    reason: wordplay
lexical_decisions:
- source_word: ትውልድ፡ እምትውልድ፡ ትኤብስ
  choice: de génération en génération, les humains commettraient le mal
  rationale: La tournure éthiopienne fait de « génération » un sujet collectif et décrit une faute répétée. « Les humains » explicite naturellement ce collectif en français sans limiter la portée à une seule génération.
- source_word: ትውለደ፡ ጽድቅ
  choice: une génération juste
  rationale: Littéralement « une génération de justice ». La formulation adjectivale est naturelle en français et conserve le contraste moral avec l’iniquité et le péché.
- source_word: ትትለሐስ
  choice: sera effacé
  rationale: Le verbe évoque littéralement l’action de lécher ou d’enlever entièrement. « Effacé » exprime ici la disparition complète du péché sans produire une image involontairement étrange en français.
- source_word: አይድዖ
  choice: faire savoir
  rationale: 'Impératif causatif : Hénok ordonne à Mathusalem d’informer Lamek. « Faire savoir » restitue directement cette valeur.'
- source_word: አማን፡ ወኢኮነ፡ ሐሰተ
  choice: 'est bien son fils : il n’y a là aucune tromperie'
  rationale: Le texte oppose ce qui est vrai ou authentique à ce qui est faux. Cette formulation française conserve l’assurance donnée à Lamek sans préciser au-delà du texte la nature exacte de son soupçon.
- source_word: ያስተፌሥሓ
  choice: réconfortera
  rationale: Le causatif signifie faire se réjouir, réjouir ou réconforter. « Réconfortera » convient au contexte de la terre après la destruction et fait entendre la fonction explicative du nom de Noé.
theological_decisions:
- issue: Succession des générations et génération juste
  choice: Une humanité fautive de génération en génération jusqu’à l’apparition d’une génération juste
  alternative: Chaque génération transgressera jusqu’à ce que se lève la génération de justice
  rationale: Le rendu retenu préserve la progression eschatologique sans identifier la « génération juste » à un groupe doctrinal particulier.
- issue: Authenticité de la filiation de l’enfant
  choice: L’enfant est bien le fils de Lamek et il n’y a aucune tromperie
  alternative: L’enfant est véritablement de lui et non mensonger
  rationale: Le texte rassure explicitement Lamek au sujet de l’enfant. La traduction maintient l’ambiguïté sur les raisons du doute, exposées dans le contexte précédent, sans leur ajouter d’explication théologique.
- issue: Fonction future de Noé
  choice: Il réconfortera la terre après toute la destruction
  alternative: Il fera se réjouir la terre de toute destruction
  rationale: Le choix conserve la dimension de soulagement et de restauration associée à Noé, tout en évitant de prétendre que le texte décrit précisément par quel moyen il accomplira cela.
translation_notes:
  register: 'Français international actuel, digne et narratif. Les noms propres suivent des formes françaises courantes pour la littérature biblique et hénochique : Lamek, Mathusalem, Hénok et Noé. Le pronom initial « leur » est conservé afin de ne pas résoudre dans ce verset seul son antécédent contextuel. Les temps français distinguent la vision prophétique, l’ordre direct et la reprise du récit.'
