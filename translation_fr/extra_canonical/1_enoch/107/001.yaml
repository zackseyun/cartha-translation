  - severity: medium
    issue: Conditionnel et atténuation de ትኤብስ
    rationale: « les humains commettraient le mal » remplace « transgresser » par une expression plus vague et rend les futurs de l'oracle au conditionnel. Le français doit conserver la formulation prophétique.
  - severity: low
    issue: Graphie « Hénok »
    rationale: « Hénoch » est la graphie française courante et internationalement reconnaissable pour ce personnage.
