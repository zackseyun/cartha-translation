  text: And from there I went on a journey..[a][b].
translation:
  language: fr
  text: De là, je me rendis vers l’est, au milieu des montagnes du désert. Je vis un désert solitaire, plein d’arbres de cette espèce.[a] De l’eau y jaillissait, et au-dessus de lui apparaissaient des cours d’eau abondants[b] qui coulaient vers le nord, vers l’ouest.[c] De tous côtés montaient de l’eau et de la rosée.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des arbres de cette semence ». Le mot peut aussi signifier « sorte » ou « espèce ».'
    reason: lexical_ambiguity
  - marker: b
    text: Le rapport exact, dans la syntaxe éthiopienne, entre l’eau qui jaillit et les cours d’eau qui apparaissent est difficile à déterminer.
    reason: source_ambiguity
  - marker: c
    text: 'Littéralement, le texte donne successivement : « vers le nord, vers l’ouest ».'
    reason: directional_ambiguity
  - marker: d
    text: Le texte éthiopien porte bien « de l’eau et de la rosée » qui montent. Cette image inhabituelle est conservée.
    reason: source_tension
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: vers l’est
  rationale: መንገለ est ici une préposition directionnelle, précisée par ጽባሕ, « l’est »; le syntagme complet ne désigne donc pas un voyage indéterminé.
- source_word: ማእከላ ለደብረ መድበራ
  choice: au cœur des montagnes du désert
  rationale: Cette formulation française naturelle rend l’entrée au milieu d’une région montagneuse désertique sans réduire ደብር à un sommet isolé.
- source_word: ገዳመ ባሕቲቶ
  choice: une étendue sauvage et solitaire
  rationale: ገዳም désigne un lieu inculte ou désert, tandis que ባሕቲቶ en souligne l’isolement. « Étendue sauvage » évite la répétition de « désert » tout en conservant l’image.
- source_word: ዕፀወ እምነ ዝንቱ ዘርዕ
  choice: des arbres de cette espèce
  rationale: ዘርዕ peut évoquer la semence, la sorte ou l’espèce. Dans ce contexte botanique, « de cette espèce » donne un sens intelligible tout en maintenant la référence démonstrative du texte.
- source_word: አስራብ
  choice: un cours d’eau
  rationale: Le terme évoque un écoulement ou un chenal. « Cours d’eau » convient au contexte de l’eau jaillissante sans imposer la taille précise d’un fleuve ou d’un torrent.
- source_word: መንገለ መስዕ መንገለ ዐረብ
  choice: vers le nord-ouest
  rationale: Les deux indications successives orientent l’écoulement vers le nord et vers l’ouest; « nord-ouest » exprime naturellement cette direction composée.
- source_word: ማይ ወጠል
  choice: de l’eau et de la rosée
  rationale: La traduction garde les deux noms explicites du texte éthiopien, sans remplacer « eau » par « nuages » pour lisser l’image.
