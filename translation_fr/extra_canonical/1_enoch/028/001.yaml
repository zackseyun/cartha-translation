  register: Français international moderne, narratif et digne. Les temps du passé structurent la vision; les phénomènes duratifs sont rendus à l’imparfait. La syntaxe très compacte du guèze est légèrement déployée pour rester lisible, mais ses images inhabituelles et ses ambiguïtés réelles sont signalées plutôt que supprimées.
