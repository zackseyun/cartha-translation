base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: fr
  text: Espérez[a], vous qui êtes justes, car les pécheurs seront rapidement détruits loin de vous[b], et vous aurez autorité sur eux[c], selon votre désir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Prenez courage ». L’impératif s’adresse directement aux justes et les appelle à l’espérance.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de devant vous » : les pécheurs sont représentés comme étant ôtés de la présence des justes.'
    reason: lexical_alternative
  - marker: c
    text: 'Cette autorité sur les pécheurs exprime un renversement apocalyptique : ceux qui sont maintenant jugés passent sous l’autorité des justes.'
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Espérez
  rationale: Impératif pluriel du verbe « espérer » ou « mettre sa confiance ». « Espérez » conserve la force directe de l’exhortation.
- source_word: ጻድቃን
  choice: vous qui êtes justes
  rationale: Le nom pluriel fonctionne comme un vocatif. Cette formulation rend clairement l’adresse directe en français naturel.
- source_word: ፍጡነ
  choice: rapidement
  rationale: L’adverbe qualifie la destruction des pécheurs et exprime la rapidité du jugement plutôt que nécessairement sa proximité chronologique.
- source_word: ይትሀጐሉ
  choice: seront détruits
  rationale: La forme verbale passive ou médio-passive évoque la ruine ou la destruction dans ce contexte de jugement apocalyptique.
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Le substantif pluriel désigne le groupe placé en opposition aux justes.
- source_word: እምቅድሜክሙ
  choice: loin de vous
  rationale: 'Littéralement « de devant vous » : la traduction française exprime l’éloignement hors de leur présence, tandis que la note conserve l’image spatiale exacte.'
- source_word: ሥልጣን
  choice: autorité
  rationale: Le terme désigne un pouvoir de domination ou de gouvernement, et non une simple puissance physique.
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: vous aurez autorité sur eux
  rationale: La construction attribue aux justes la possession ou l’exercice futur de l’autorité sur les pécheurs.
- source_word: በከመ ፈቀድክሙ
  choice: selon votre désir
  rationale: La formulation préserve l’idée d’une correspondance avec le désir ou la volonté des justes sans en préciser davantage la portée.
theological_decisions:
- issue: Nature de la relation future des justes avec les pécheurs
  choice: Le verset promet aux justes une véritable autorité sur les pécheurs jugés.
  alternative: Comprendre cette autorité comme une simple victoire morale ou une réhabilitation publique.
  rationale: Le nom explicite ሥልጣን, joint à « sur eux », indique davantage qu’une consolation intérieure. La traduction maintient ce renversement apocalyptique sans définir la forme exacte que prendra cette autorité.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve l’exhortation directe et le contraste apocalyptique, tout en plaçant les marqueurs de note immédiatement après les expressions concernées.
