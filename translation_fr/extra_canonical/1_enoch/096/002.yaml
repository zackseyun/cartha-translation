revisions:
- from: Et au jour du châtiment des pécheurs, vos enfants s’élèveront et prendront leur essor comme des aigles. Votre abri[a] sera plus haut que celui des vautours. Vous monterez et entrerez pour toujours dans les crevasses de la terre et dans les fissures du rocher, comme des damans[b] fuyant les êtres sans loi. Alors les sirènes[c] gémiront sur vous et pleureront.
  to: Et, au jour de la détresse des pécheurs, vos enfants s’élèveront et seront élevés comme des aigles. Votre abri[a] sera élevé au-dessus des vautours. Vous monterez et entrerez pour toujours dans les crevasses de la terre et dans les fissures du rocher, comme des damans[b] fuyant les sans-loi. Et les sirènes[c] gémiront sur vous et pleureront.
  rationale: La révision conserve le sens et les incertitudes du guèze, tout en évitant de transformer la détresse des pécheurs en une peine définie. Elle restitue plus littéralement le double mouvement d’élévation, exprime par « fuyant » le mouvement loin des sans-loi, et améliore légèrement l’idiomaticité française. Les trois appels de note restent liés aux éléments qui nécessitent une précision textuelle, culturelle ou lexicale.
  reviewer_model: gpt-5.6-terra
