  - severity: low
    issue: « Prendront leur essor » interprète plus librement le second verbe d’élévation.
    rationale: La formulation ajoute une nuance de vol; « seront élevés » maintient le parallélisme verbal et l’image des aigles qui suit.
  - severity: low
    issue: « Êtres sans loi » est peu naturel et « Alors » est ajouté.
    rationale: « Les sans-loi » est idiomatique; la coordination source ne requiert pas l’adverbe temporel.
