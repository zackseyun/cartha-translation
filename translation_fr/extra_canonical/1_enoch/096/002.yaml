base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: fr
  text: Et, au jour de la détresse des pécheurs, vos enfants s’élèveront et seront élevés comme des aigles. Votre abri[a] sera élevé au-dessus des vautours. Vous monterez et entrerez pour toujours dans les crevasses de la terre et dans les fissures du rocher, comme des damans[b] fuyant les sans-loi. Et les sirènes[c] gémiront sur vous et pleureront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot éthiopien est difficile; il peut désigner un lieu ombragé, un refuge ou, dans le prolongement de l’image des aigles, un nid.
    reason: textual_variant
  - marker: b
    text: Les damans sont de petits mammifères vivant parmi les rochers; ils étaient autrefois appelés « conies » ou « blaireaux des rochers ».
    reason: cultural_note
  - marker: c
    text: Le terme est un emprunt au grec désignant des créatures associées aux lamentations et aux lieux désolés dans l’imaginaire antique; il ne renvoie pas nécessairement aux êtres marins séducteurs de la tradition européenne tardive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንዳቤሆሙ
  choice: le châtiment des pécheurs
  rationale: Dans ce contexte judiciaire, le nom désigne l’épreuve punitive qui atteint les pécheurs. « Châtiment » rend cette portée sans préciser indûment la forme de la peine.
- source_word: ይትሌዐሉ / ይትነሥኡ
  choice: s’élèveront et prendront leur essor
  rationale: Deux expressions distinctes conservent le parallélisme emphatique et s’accordent naturellement avec la comparaison aux aigles.
- source_word: አንስርት
  choice: aigles
  rationale: C’est le sens usuel ici et il préserve l’image d’élévation majestueuse.
- source_word: እጐለ ዚአክሙ
  choice: vos enfants
  rationale: La formule renvoie à la descendance des destinataires; « enfants » est naturel et accessible en français moderne.
- source_word: ምጽላልክሙ
  choice: votre abri
  rationale: Le terme difficile semble désigner un lieu ombragé ou protecteur. « Abri » préserve cette idée sans imposer le sens plus précis de « nid ».
- source_word: ንደብታተ ምድር
  choice: les crevasses de la terre
  rationale: La formule évoque des lieux fendus ou encaissés servant de refuge.
- source_word: ንቅዓታተ ኰኵሕ
  choice: les fissures du rocher
  rationale: Cette traduction conserve précisément l’image d’ouvertures dans la roche.
- source_word: ጊሔ
  choice: damans
  rationale: Le terme désigne vraisemblablement les petits mammifères rupestres traditionnellement appelés « conies » ou « blaireaux des rochers »; « damans » est l’appellation zoologique française actuelle.
- source_word: እምቅድመ ዓማፅያን
  choice: fuyant les êtres sans loi
  rationale: La préposition composée signifie « de devant, loin de la présence de » et, dans cette scène de refuge, implique la fuite. « Êtres sans loi » garde la portée morale du substantif sans la réduire à la seule violence.
- source_word: ጼደናት
  choice: les sirènes
  rationale: Il s’agit d’un emprunt au grec désignant des créatures lamentatrices des lieux désolés, et non des « femmes justes ».
theological_decisions:
- issue: Identité des destinataires et contraste avec les pécheurs
  choice: Les pluriels de deuxième personne sont compris comme s’adressant à la communauté juste, dont les enfants seront élevés tandis que les pécheurs seront châtiés.
  alternative: Les destinataires pourraient rester plus indéterminés en raison des difficultés textuelles du milieu du verset.
  rationale: Le contexte immédiat oppose les pécheurs aux destinataires consolés. Cette lecture maintient le contraste littéraire sans lui superposer une catégorie doctrinale ultérieure.
- issue: Valeur judiciaire de ምንዳቤሆሙ
  choice: châtiment
  alternative: détresse, affliction ou épreuve
  rationale: Le contexte de jugement favorise une souffrance punitive, mais le terme ne décrit pas précisément la nature de la sanction.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme apocalyptique et les images animales sont conservés. « Prendront leur essor » rend le second verbe d’élévation sans lourdeur; « fuyant » explicite la valeur directionnelle de እምቅድመ dans ce contexte de refuge.
