  naturalness: Le français est globalement clair et de registre approprié. « Êtres sans loi » est cependant peu idiomatique; « les sans-loi » est plus naturel. « Alors » introduit une succession temporelle non explicitée par le simple coordonnant source; « et » est préférable.
  terminology: « Damans » est exact et actuel; la note culturelle est utile. « Sirènes » est justifié pour ጼደናት, emprunt grec, à condition que la note précise le cadre imagé antique sans l’identifier aux représentations européennes tardives. « Abri » respecte l’incertitude du terme difficile et sa note est correctement ancrée.
