base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: fr
  text: Mais vous, ne craignez pas, vous qui avez souffert[a], car il y aura pour vous une guérison. Une lumière éclatante brillera pour vous, et vous entendrez du ciel une voix de repos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous qui êtes dans la détresse ». L’expression guèze peut désigner plus largement ceux qui éprouvent douleur ou affliction.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une voix/parole de repos ». L’expression reste proche du guèze plutôt que d’être paraphrasée par « paix » ou « consolation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: ne craignez pas
  rationale: Impératif négatif au pluriel adressé directement aux destinataires. Cette formulation concise conserve le registre solennel du passage.
- source_word: እለ ሐመምክሙ
  choice: vous qui avez souffert
  rationale: L’expression désigne ceux qui ont été éprouvés par la douleur ou la détresse, sans limiter celle-ci à une souffrance physique.
- source_word: ፈውስ
  choice: une guérison
  rationale: Le nom peut évoquer aussi bien la guérison que le rétablissement au sens large; « guérison » préserve cette portée concrète et restauratrice.
- source_word: ይከውነክሙ
  choice: il y aura pour vous
  rationale: Le verbe a le sens général d’être, de devenir ou d’advenir. La tournure française demeure proche de cette valeur sans préciser indûment la manière dont la guérison arrive.
- source_word: ብርሃነ ብሩህ
  choice: une lumière éclatante
  rationale: L’association du nom « lumière » et d’un qualificatif de luminosité intensifie l’image; « lumière éclatante » la restitue naturellement.
- source_word: ያበርህ ለክሙ
  choice: brillera pour vous
  rationale: La formulation conserve l’image lumineuse ainsi que le complément indiquant que cette lumière est destinée aux affligés.
- source_word: ቃለ ዕረፍት
  choice: une voix de repos
  rationale: Littéralement, l’expression peut signifier « voix/parole de repos ». « Voix de repos » maintient à la fois l’image auditive et la promesse de soulagement, sans la remplacer par « paix » ou « consolation ».
- source_word: እምሰማይ
  choice: du ciel
  rationale: Cette expression indique l’origine céleste de la voix; le singulier est naturel en français dans ce contexte révélatoire.
theological_decisions:
- issue: Faut-il rendre ቃለ ዕረፍት par un terme théologique plus interprétatif?
  choice: une voix de repos
  alternative: une voix de paix; une parole de consolation
  rationale: Le guèze renvoie d’abord à la voix ou à la parole, puis au repos. Conserver ces éléments préserve la promesse propre au texte sans l’harmoniser avec une terminologie religieuse plus familière.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme consolateur et le parallélisme des promesses sont conservés; les expressions inhabituelles porteuses d’une ambiguïté réelle sont maintenues et éclairées en note.
