base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: fr
  text: 'En ces jours-là, l’ange Uriel me répondit et me dit : « Regarde, je t’ai tout montré, Hénoch, et je t’ai tout révélé, afin que tu voies ce soleil, cette lune, ceux qui guident les étoiles du ciel et tous ceux qui les font tourner : leurs œuvres, leurs temps et leurs couchers[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « leurs entrées » : dans la représentation astronomique du livre, il s’agit de l’entrée des astres dans les portails occidentaux, c’est-à-dire de leurs couchers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: me répondit
  rationale: Le verbe a le sens de répondre ou réagir. La traduction conserve cette articulation du discours, même si aucune question préalable n’apparaît dans ce verset.
- source_word: ነዋ
  choice: Regarde
  rationale: Cette particule attire l’attention. « Regarde » est immédiat et naturel en français moderne, tout en gardant la force de l’injonction visionnaire.
- source_word: አርአይኩከ
  choice: je t’ai tout montré
  rationale: Le causatif du verbe de vision exprime le fait de faire voir. Le passé composé souligne une présentation achevée dont Hénoch peut maintenant tirer connaissance.
- source_word: ከሠትኩ ለከ
  choice: je t’ai tout révélé
  rationale: Le verbe évoque la manifestation ou le dévoilement. « Révélé » convient au registre apocalyptique sans ajouter de précision doctrinale.
- source_word: ትርአዮ
  choice: afin que tu voies
  rationale: La forme exprime ici le but ou le résultat. Cette tournure restitue clairement le lien avec la révélation précédente.
- source_word: ይመርኅዎሙ
  choice: guident
  rationale: Le verbe signifie conduire ou guider. Ce choix préserve l’action personnelle attribuée aux agents associés aux étoiles.
- source_word: ከዋክብተ ሰማይ
  choice: les étoiles du ciel
  rationale: Traduction directe du groupe génitival, naturelle dans le registre biblique français.
- source_word: ይመይጥዎሙ
  choice: les font tourner
  rationale: La formulation exprime la mise en mouvement ou la rotation sans imposer une description astronomique moderne.
- source_word: ግብሮሙ
  choice: leurs œuvres
  rationale: Le mot peut désigner les œuvres, les actions ou les fonctions. « Œuvres » conserve sa portée large et la cadence de l’énumération.
- source_word: አዝማኖሙ
  choice: leurs temps
  rationale: Le terme désigne des temps ou des périodes. La traduction littérale évite d’ajouter explicitement l’idée d’une nomination ou d’un décret.
- source_word: ሙባኢሆሙ
  choice: leurs couchers
  rationale: Le nom dérive du verbe « entrer ». Dans le cadre astronomique de 1 Hénoch, il désigne l’entrée des astres dans les portails occidentaux, donc leurs couchers, et non leurs levers.
theological_decisions:
- issue: Identité des agents liés aux corps célestes
  choice: Conserver les expressions personnelles « ceux qui guident » et « ceux qui les font tourner ».
  alternative: Remplacer ces agents par des lois, des forces ou de simples mouvements astronomiques.
  rationale: Le guèze emploie des constructions relatives personnelles. Les maintenir respecte la représentation apocalyptique du texte sans définir davantage la nature de ces agents.
- issue: Référent des possessifs dans l’énumération finale
  choice: Conserver le simple possessif « leurs » sans expliciter son référent.
  alternative: Préciser qu’il s’agit soit des activités des agents, soit des cycles des astres.
  rationale: La syntaxe permet une certaine tension entre les agents personnels et les corps célestes qu’ils dirigent. Une explicitation supprimerait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « me répondit et me dit » est volontairement conservée parce qu’elle appartient à la texture narrative de la source. « Hénoch » suit l’orthographe française usuelle.
