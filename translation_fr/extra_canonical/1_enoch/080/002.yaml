revisions:
- from: Et aux jours des pécheurs, les années seront raccourcies, et leur semence tardera sur leurs terres et dans leurs champs[a] ; toutes les œuvres qui sont sur la terre changeront et ne paraîtront pas en leurs temps[b]. La pluie sera retenue, et le ciel se retiendra.
  to: Et, aux jours des pécheurs, les années seront raccourcies ; leur semence sera tardive sur leurs terres et dans leurs champs[a]. Toutes les œuvres qui sont sur la terre changeront et ne paraîtront pas en leurs temps[b] ; la pluie sera retenue, et le ciel la retiendra.
  rationale: La révision améliore deux tournures françaises sans modifier la portée du passage. Le pronom « la » reprend explicitement la pluie déjà mentionnée et rend naturelle l'action de retenue attribuée au ciel, tout en respectant l'objet seulement implicite dans la dernière proposition guèze. Les ancres et le jeu complet de notes sont conservés.
