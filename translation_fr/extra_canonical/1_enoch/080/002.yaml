base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: fr
  text: Et, aux jours des pécheurs, les années seront raccourcies ; leur semence sera tardive sur leurs terres et dans leurs champs[a]. Toutes les œuvres qui sont sur la terre changeront et ne paraîtront pas en leurs temps[b] ; la pluie sera retenue, et le ciel la retiendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Leur semence » peut désigner leur descendance ou, dans ce contexte agricole, ce qui est semé et sa production.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression décrit un dérèglement de l’ordre naturel : les réalités terrestres ne se manifestent plus aux moments ou aux saisons qui leur sont assignés.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: aux jours des pécheurs
  rationale: Conserve la formule temporelle apocalyptique et le registre moral du texte guèze.
- source_word: ክረማት፡ የኀጽሩ
  choice: les années seront raccourcies
  rationale: Rend le cycle annuel et la forme passive, en préservant l’image d’un temps écourté.
- source_word: ዘርአ፡ ዚአሆሙ
  choice: leur semence
  rationale: « Semence » maintient l’ambiguïté entre la descendance et ce qui est semé, tout en convenant au contexte agricole.
- source_word: ዳኃራዊ
  choice: tardera
  rationale: Exprime naturellement en français le retard annoncé sans préciser sa nature.
- source_word: ምድረሙ፡ ወበወፍሮሙ
  choice: sur leurs terres et dans leurs champs
  rationale: Distingue le territoire ou sol des espaces cultivés et conserve le parallélisme agricole.
- source_word: ወኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: toutes les œuvres qui sont sur la terre
  rationale: La formulation large évite de limiter ግብር aux seules actions humaines et permet de reprendre naturellement le pluriel des temps.
- source_word: ይትመየጥ፡ ወኢያስተርኢ፡ ለአዝማኖሙ
  choice: changeront et ne paraîtront pas en leurs temps
  rationale: Préserve le changement, l’idée d’apparition et le pluriel explicite « leurs temps », qui évoque les moments ou saisons assignés.
- source_word: ወዝናም፡ ይትከላእ
  choice: La pluie sera retenue
  rationale: Rend directement l’idée d’une pluie empêchée ou maintenue en arrière, sans nommer l’agent.
- source_word: ወሰማይ፡ ታቀውም
  choice: et le ciel se retiendra
  rationale: Conserve la personnification et l’absence de complément exprimé dans le texte source.
theological_decisions:
- issue: Sens de « leur semence » dans un contexte de dérèglement agricole
  choice: leur semence
  alternative: leur descendance ; leurs semailles ou leur production
  rationale: Le contexte des terres, des champs et de la pluie favorise une nuance agricole, mais le terme peut aussi désigner la descendance. La traduction conserve cette tension.
- issue: Agent de la rétention de la pluie
  choice: 'forme passive sans agent : « La pluie sera retenue »'
  alternative: Dieu retiendra la pluie
  rationale: Le texte ne nomme pas explicitement l’agent ; l’expliciter introduirait une interprétation théologique absente de la formulation source.
- issue: Action finale du ciel
  choice: « le ciel se retiendra » sans complément ajouté
  alternative: le ciel retiendra sa pluie
  rationale: La proposition guèze laisse l’action sans objet explicite. La traduction garde cette concision et cette légère indétermination.
translation_notes:
  register: Français moderne international, soutenu mais accessible. Le futur prophétique et les répétitions structurantes sont conservés. « En leurs temps », légèrement marqué, maintient le pluriel du guèze et la notion de moments assignés.
