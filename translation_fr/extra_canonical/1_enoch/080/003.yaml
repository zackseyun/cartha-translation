base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: fr
  text: Et en ces temps-là, le fruit de la terre arrivera tard[a] et ne poussera pas en sa saison ; le fruit des arbres sera retenu en sa propre saison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera en retard ». Le guèze souligne que le fruit paraît après le moment attendu.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « sera entravé au temps qui lui est propre ». Le texte insiste sur le fait que le fruit est empêché de paraître au moment fixé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝማን
  choice: temps
  rationale: Le pluriel désigne une période au sens large. « Temps » conserve la portée apocalyptique sans la réduire à des jours précis ni aux seules saisons agricoles.
- source_word: ፍሬ፡ ምድር
  choice: le fruit de la terre
  rationale: Cette formulation concrète et naturelle conserve l’image agricole du texte plutôt que de lui substituer le vocabulaire plus économique du rendement ou de la production.
- source_word: ደሓራዊ፡ ይከውን
  choice: sera tardif
  rationale: Le tour guèze exprime le fait d’être en retard ou de venir après le moment attendu. « Sera tardif » respecte sa forme prédicative et le dérèglement du calendrier agricole.
- source_word: ወኢይበቍል
  choice: et ne germera pas
  rationale: Le verbe évoque la germination ou la pousse. « Germer » convient au fruit de la terre tout en conservant l’image d’une croissance qui ne se produit pas au moment attendu.
- source_word: በዘመኑ
  choice: en sa saison
  rationale: Le suffixe singulier renvoie au collectif singulier « fruit de la terre ». « Saison » rend la dimension à la fois temporelle et agricole.
- source_word: ፍሬ፡ ዕፅ
  choice: le fruit des arbres
  rationale: Dans ce contexte agricole, ዕፅ désigne le plus naturellement les arbres, même si le mot peut aussi avoir un sens plus large de bois ou de plante.
- source_word: ይትከላእ
  choice: sera retenu
  rationale: Le passif exprime ce qui est tenu en arrière, empêché ou entravé. « Retenu » préserve cette image sans préciser une cause que le texte ne nomme pas.
- source_word: በዘመኑ፡ ዚአሁ
  choice: en sa propre saison
  rationale: Le pronom emphatique singulier souligne le moment qui appartient en propre au fruit. « Sa propre saison » conserve cette insistance explicite du guèze.
theological_decisions:
- issue: Nature du signe de jugement
  choice: Décrire littéralement le dérèglement agricole et saisonnier.
  alternative: Interpréter les récoltes comme une simple métaphore du déclin moral ou comme une mauvaise récolte ordinaire.
  rationale: Dans le contexte apocalyptique du Livre astronomique, le défaut de fécondité et le bouleversement des temps font partie du dérèglement de l’ordre créé. La traduction conserve donc les images concrètes sans expliciter davantage leur cause théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe coordonnée et les répétitions de « fruit » et de « saison » sont maintenues afin de conserver le parallélisme agricole du texte. « Sera retenu » garde volontairement une légère étrangeté, conforme à l’image passive et ambiguë de la source.
