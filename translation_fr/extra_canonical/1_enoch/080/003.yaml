  source_fidelity: Le parallélisme agricole, le retard par rapport au temps fixé, l’absence de pousse à la saison attendue et l’idée passive d’un fruit « retenu » sont bien rendus. Toutefois, « sera tardif » qualifie normalement une variété ou une maturation naturellement tardive; il rend moins nettement le fait que le fruit arrive en retard. « Arrivera tard » exprime plus directement le dérèglement temporel de ደሓራዊ ይከውን.
  naturalness: Le français est sobre et lisible. « Ne poussera pas » est plus naturel que « ne germera pas » avec le collectif « le fruit de la terre », tout en conservant l’image agricole du verbe source. « Sa propre saison » conserve l’insistance finale sans introduire d’interprétation.
  terminology: « Fruit de la terre », « saison » et « fruit des arbres » respectent le registre agricole et le parallélisme. « Sera retenu » demeure une traduction volontairement non causalement spécifiée de la forme passive « sera empêché/tenu en arrière ».
