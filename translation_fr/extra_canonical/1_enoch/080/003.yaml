  rationale: La révision remplace l’adjectif français « tardif » par une expression d’événement (« arrivera tard »), plus fidèle au retard annoncé, et « germera » par « poussera », plus idiomatique avec « fruit de la terre ». Elle conserve le passif ambigu, la répétition de « saison » et l’emphase de « sa propre saison ».
