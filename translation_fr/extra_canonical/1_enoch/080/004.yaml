  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: fr
  text: Et la lune[a] changera son ordre, et elle n’apparaîtra pas en sa saison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze ወርኅ peut signifier « lune » ou « mois » ; le contexte des luminaires favorise ici « lune ».
    reason: lexical_alternative
  - marker: b
    text: Ou « elle ne sera pas vue en son temps ». L’expression peut mettre l’accent sur sa visibilité au moment habituel, sans désigner nécessairement une date technique du calendrier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኅ
  choice: la lune
  rationale: Le terme peut désigner la « lune » ou le « mois » ; le contexte des luminaires et la mention de son apparition favorisent ici « la lune ».
- source_word: ይዌልጥ
  choice: changera
  rationale: Le verbe exprime un changement ou une altération. « Changera » reste direct et n’ajoute aucune explication sur la cause de cette irrégularité.
- source_word: ሥርዓቶ
  choice: son ordre
  rationale: Le mot désigne un ordre, un agencement ou une règle établie. « Son ordre » conserve la portée cosmique du terme sans le réduire à la seule trajectoire ou aux seules phases de la lune.
- source_word: ወኢይትረአይ
  choice: et elle n’apparaîtra pas
  rationale: La forme porte sur ce qui se montre ou peut être vu. Pour un astre, « n’apparaîtra pas » rend naturellement cette idée tout en laissant ouverte la nuance passive « ne sera pas vue ».
- source_word: በዘመኑ ዚአሁ
  choice: en sa saison
  rationale: L’expression signifie littéralement « en son propre temps » ou « en sa saison ». Ce choix respecte la répétition du texte et évite d’ajouter explicitement l’idée d’un temps « fixé ».
theological_decisions:
- issue: Irrégularité astronomique neutre ou perturbation de l’ordre cosmique établi
  choice: La lune « changera son ordre » et n’apparaîtra pas « en sa saison ».
  alternative: La lune changera seulement de phase, ou le mois changera dans son calcul.
  rationale: 'La formulation préserve la tension du texte : elle évoque une rupture de la régularité cosmique sans expliciter son origine divine ni réduire le propos à une précision technique de calendrier.'
translation_notes:
  register: Français international moderne, sobre et prophétique. La structure coordonnée du guèze est conservée. « En sa saison » maintient la répétition et l’ambiguïté temporelle de la source, tandis que les notes signalent les principales possibilités lexicales sans surcharger le verset.
