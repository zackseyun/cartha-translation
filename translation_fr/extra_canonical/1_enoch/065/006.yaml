base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: fr
  text: Et un ordre sortit de devant le Seigneur contre ceux qui habitent sur la terre ferme[a], pour que leur fin vienne, car ils connaissaient toutes les choses cachées des anges, toute la violence des satans[b], et toute leur puissance cachée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « depuis la présence du Seigneur ». Il s’agit d’une formule révérencielle indiquant que l’ordre émane de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte porte ici un pluriel : « les satans », et non le nom propre singulier « Satan ». Le mot peut aussi signifier « adversaires ».'
    reason: lexical_alternative
  - marker: c
    text: Les derniers mots sont difficiles dans ce témoin éthiopien. Ils peuvent se comprendre comme « toute leur puissance cachée » ou « toutes leurs puissances cachées » ; une référence aux arts occultes a également été proposée, mais elle n’est pas certaine.
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: ordre
  rationale: Le nom désigne une directive émanant d’une autorité. « Ordre » est naturel en français tout en conservant sa force.
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: sortit de devant le Seigneur
  rationale: Cette formulation conserve l’expression sémitisante et l’image d’un ordre émanant de la présence divine.
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: contre ceux qui habitent sur la terre ferme
  rationale: « Terre ferme » rend la valeur littérale de የብስ et maintient, dans le contexte du déluge, le contraste avec les eaux; « contre » exprime la portée hostile de l’ordre.
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: afin que leur fin arrive
  rationale: La formulation garde la finalité du jugement et l’ambivalence de ሕልቀት entre fin et destruction, sans préciser indûment le mode de leur disparition.
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: toutes les choses cachées des anges
  rationale: Traduction proche du guèze, qui évite de transformer les réalités cachées en « mystères » au sens technique.
- source_word: ግፍዐ ሰይጣናት
  choice: la violence des satans
  rationale: ግፍዐ peut désigner la violence, l’oppression ou l’injustice; le pluriel « satans » reproduit le pluriel du texte au lieu de l’harmoniser avec le nom propre singulier.
- source_word: ኃይሎሙ ኅቡአ ኅቡኣት
  choice: leur puissance cachée
  rationale: Le segment final est difficile, notamment en raison de la répétition de formes liées à ce qui est caché. Cette traduction prudente restitue l’association entre puissance et caractère secret sans introduire explicitement des sorciers absents du texte assuré.
theological_decisions:
- issue: Pluriel de ሰይጣናት
  choice: satans
  alternative: Satan; adversaires; démons
  rationale: Le guèze porte un pluriel. Le maintenir préserve la texture démonologique propre au passage sans l’aligner sur la figure ultérieure de Satan au singulier.
- issue: Portée de « ceux qui habitent sur la terre ferme »
  choice: conserver l’image terrestre liée au jugement du déluge
  alternative: les habitants de la terre; une catégorie particulière de pécheurs
  rationale: Dans le cadre noachique, la terre ferme évoque les humains exposés au déluge. La traduction maintient cette image sans définir davantage la catégorie visée.
- issue: Interprétation de la finale difficile
  choice: toute leur puissance cachée
  alternative: toutes leurs puissances cachées; les puissances de ceux qui pratiquent la sorcellerie
  rationale: Le témoin fourni n’établit pas clairement une référence à des praticiens de la sorcellerie. La lecture retenue demeure proche des mots attestés et signale l’incertitude en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe légèrement solennelle (« sortit de devant le Seigneur ») conserve le registre apocalyptique et la tournure de la source, tandis que le reste de la phrase demeure naturel. Les ambiguïtés du pluriel « satans » et de la finale textuellement difficile sont maintenues et expliquées en notes.
