base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: fr
  text: 'Alors mon grand-père Hénok vint se tenir près de moi et me dit : « Pourquoi as-tu poussé vers moi un cri amer, en pleurant ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሐው*የ
  choice: mon grand-père
  rationale: La forme transcrite est vraisemblablement une lecture OCR fautive de እምሔውየ, « mon grand-père ». Cette lecture est étayée par le contexte proche et évite de construire à tort une expression signifiant « depuis ma demeure ».
- source_word: መጽአ
  choice: vint
  rationale: Verbe narratif courant de mouvement; « vint » rend directement l’arrivée vers le locuteur.
- source_word: ቆመ ኀቤየ
  choice: se tenir près de moi
  rationale: L’expression associe l’action de se tenir debout à une indication de proximité. La tournure française est naturelle sans préciser davantage la position.
- source_word: በምንት
  choice: pourquoi
  rationale: Interrogatif causal demandant la raison de l’action.
- source_word: ጸራሕከ ኀቤየ
  choice: as-tu poussé vers moi
  rationale: Le verbe désigne un cri ou un appel à haute voix, et ኀቤየ indique son orientation vers le locuteur.
- source_word: ጽራኀ መሪረ
  choice: un cri amer
  rationale: Rend de façon compacte l’expression de détresse intense, sans atténuer l’adjectif « amer ».
- source_word: ብካየ
  choice: en pleurant
  rationale: Le nom verbal exprime les pleurs; la tournure circonstancielle s’intègre naturellement à la question française.
theological_decisions:
- issue: Lien familial entre Hénok et le narrateur
  choice: mon grand-père Hénok
  alternative: Hénok vint de ma demeure
  rationale: La révision textuelle identifie dans la forme OCR incertaine le mot guèze signifiant « mon grand-père ». La traduction conserve explicitement ce lien familial sans ajouter dans ce verset le nom du narrateur.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, tandis que « cri amer » conserve l’intensité et la concision de l’expression guèze.
