base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: fr
  text: Après ce temps-là, un grand bouleversement se produisit sur la terre[a] ; une voix se fit entendre du ciel[b], et je tombai face contre terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « bouleversement » peut aussi signifier « tumulte », « confusion » ou « secousse ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « voix » peut également désigner une « parole » ou un « son ».
    reason: lexical_alternative
  - marker: c
    text: La forme verbale transmise paraît être au pluriel (« ils tombèrent »), tandis que le suffixe de « mon visage » est à la première personne. La traduction « je tombai face contre terre » suit le sens qui s’accorde le mieux avec le récit immédiat à la première personne.
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: Après ce temps-là
  rationale: Conserve la succession temporelle ainsi que la valeur démonstrative de ውእቱ, dans un français courant et compréhensible.
- source_word: ሀውክ ዐቢይ
  choice: un grand bouleversement
  rationale: ሀውክ désigne un trouble, un tumulte ou un désordre. « Bouleversement » garde la force apocalyptique du passage sans préciser indûment qu’il s’agit d’un séisme.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Rend naturellement la relation spatiale et maintient la portée cosmique de ምድር plutôt que de la réduire à un territoire particulier.
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: une voix se fit entendre du ciel
  rationale: ቃል peut désigner une parole, une voix ou un son. Dans ce contexte de révélation, « voix » exprime le mieux une communication céleste, tandis que la tournure conserve le passif de l’éthiopien.
- source_word: ወወደቁ በገጽየ
  choice: et je tombai face contre terre
  rationale: Le verbe transmis paraît être au pluriel, mais le suffixe de première personne dans « mon visage » et le contexte narratif à la première personne appuient le sens où Hénoch se prosterne. La difficulté textuelle est explicitement signalée en note.
theological_decisions:
- issue: Nature du bouleversement désigné par ሀውክ
  choice: Un bouleversement de portée apocalyptique, sans phénomène précis imposé
  alternative: Une confusion, un tumulte ou un tremblement déterminé
  rationale: Le contexte associe les événements terrestres au jugement céleste. « Bouleversement » préserve cette ampleur sans transformer le terme en référence certaine à un séisme.
- issue: Identité et contenu de la voix céleste
  choice: Ne pas les préciser
  alternative: Identifier explicitement la voix comme celle de Dieu ou en faire une parole articulée
  rationale: Le texte dit seulement qu’une voix ou un son fut entendu du ciel ; préciser son locuteur ou son contenu dépasserait les données du verset.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif du passage. Le point-virgule distingue le bouleversement terrestre de la voix céleste sans rompre leur enchaînement.
