base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: fr
  text: 'Il leva ses pieds et s’en alla jusqu’aux extrémités de la terre. Il cria à son aïeul Hénoch, et Noé dit d’une voix amère : « Écoute-moi, écoute-moi, écoute-moi ! », trois fois.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: Il leva les pieds
  rationale: Conserve l’image corporelle concrète du guèze, plutôt que de la réduire à un simple « il partit ».
- source_word: እምህየ
  choice: de là
  rationale: Expression française naturelle marquant le point de départ dans le récit.
- source_word: ሖረ
  choice: alla
  rationale: Rend simplement le verbe courant de déplacement sans préciser indûment la manière du voyage.
- source_word: እስከ፡ አጽናፈ፡ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: Préserve l’expression cosmique et apocalyptique tout en restant idiomatique en français moderne.
- source_word: ጸርኀ፡ ለአምኄው፡ ሄኖክ
  choice: Il cria vers son aïeul Hénoch
  rationale: ጸርኀ exprime un appel à haute voix. አምኄው désigne ici son grand-père ou, plus largement, son ancêtre; « aïeul » conserve cette latitude et convient à la relation généalogique entre Noé et Hénoch.
- source_word: ወይቤ፡ ኖኅ
  choice: et Noé dit
  rationale: 'Suit l’ordre verbal guèze verbe-sujet : Noé est explicitement le sujet de « dit », non un vocatif appartenant au discours direct.'
- source_word: በቃል፡ መሪር
  choice: d’une voix amère
  rationale: Conserve la métaphore et l’intensité affective de l’expression source sans l’interpréter seulement comme de la tristesse.
- source_word: ስምዐኒ
  choice: Écoute-moi
  rationale: Impératif français direct et naturel, propre à transmettre l’urgence de l’appel répété.
- source_word: ሥልሰ
  choice: trois fois
  rationale: Rend explicitement le nombre de répétitions dans une formulation moderne et claire.
theological_decisions:
- issue: Relation généalogique exprimée par ለአምኄው devant Hénoch
  choice: son aïeul Hénoch
  alternative: son grand-père Hénoch
  rationale: Le terme peut désigner un grand-père ou un ancêtre. Puisque Hénoch est l’ancêtre de Noé à plus d’une génération, « aïeul » préserve la portée lexicale sans introduire la lecture erronée « son fils » ni imposer une précision généalogique absente du terme.
- issue: Identification du locuteur dans ወይቤ፡ ኖኅ
  choice: et Noé dit
  alternative: 'et il dit : « Noé… »'
  rationale: La construction relève de l’ordre verbe-sujet normal du guèze. La traduction identifie donc Noé comme sujet sans fabriquer une ambiguïté syntaxique ou théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le mouvement concret et la solennité apocalyptique du texte. « Aïeul » est légèrement soutenu mais transparent en contexte et permet de conserver l’étendue sémantique du terme généalogique.
