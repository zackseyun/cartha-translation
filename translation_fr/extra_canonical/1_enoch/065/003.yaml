base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: fr
  text: 'Et je lui dis : « Dis-moi : qu’est-ce donc qui se produit sur la terre ? Car la terre a ainsi souffert[a] et a été ébranlée[b] ; peut-être périrai-je avec elle[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a ainsi peiné » ou « a ainsi été en travail ». Le verbe guèze est difficile ici et peut évoquer une détresse intense, voire les douleurs de l’enfantement.
    reason: lexical_alternative
  - marker: b
    text: Ou « a tremblé » ou « a été secouée ».
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition peut aussi exprimer plus explicitement la crainte : « car je crains de périr avec elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግረኒ
  choice: Dis-moi
  rationale: L’impératif suivi du suffixe objet de première personne appelle une demande directe et naturelle en français.
- source_word: ምንት ውእቱ ዘይትገበር
  choice: qu’est-ce donc qui se produit
  rationale: La formulation garde la valeur déictique et présente de l’expression, tandis que « donc » rend naturellement l’insistance interrogative en français.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Locution française courante et digne, correspondant simplement à l’expression locative guèze.
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: Car la terre a ainsi souffert
  rationale: Le verbe est difficile dans ce contexte. « A souffert » conserve l’idée générale de détresse subie par la terre sans imposer dans le texte principal une image obstétricale plus précise.
- source_word: ወአንቀልቅለት
  choice: et a été ébranlée
  rationale: Cette formulation exprime un mouvement violent ou une agitation profonde et convient à l’imagerie cosmique du passage.
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: peut-être périrai-je avec elle
  rationale: « Peut-être » rend la valeur d’appréhension possible de ዮጊ sans créer une relation de but trompeuse avec l’ébranlement de la terre ; « elle » reprend clairement « la terre ».
theological_decisions:
- issue: Nature de la détresse de la terre
  choice: Le texte décrit la terre elle-même comme souffrante et ébranlée dans un bouleversement cosmique.
  alternative: Comprendre uniquement une corruption morale commise sur la terre, ou seulement un séisme naturel.
  rationale: Les deux verbes appliqués à la terre forment une personnification apocalyptique. La traduction maintient cette image sans la réduire à une seule interprétation.
- issue: Valeur de ዮጊ dans la dernière proposition
  choice: peut-être
  alternative: de peur que / peut-être bien que je ne périsse
  rationale: Cette option préserve l’incertitude et la crainte du locuteur sans suggérer que la terre aurait été ébranlée afin d’empêcher sa mort.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation distingue nettement la question, l’observation du bouleversement terrestre et l’appréhension personnelle. L’imagerie apocalyptique et l’ambiguïté du verbe décrivant la souffrance de la terre sont conservées.
