base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/001.yaml
  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: fr
  text: En ces jours-là, Noé vit que la terre s’était affaissée[a] et que sa destruction était proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze traduit par « s’était affaissée » est difficile. Il peut aussi évoquer une terre qui s’est enfoncée, qui s’est effondrée ou qui a été violemment ébranlée.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique traditionnelle, rendue dans un français actuel tout en conservant le registre élevé et répétitif du récit visionnaire.
- source_word: ርእየ
  choice: vit
  rationale: Rend directement le verbe courant de perception visuelle, sans l’archaïsme de « contempla » ni l’expansion de « porta son regard ».
- source_word: ኖኅ
  choice: Noé
  rationale: Forme française usuelle du nom biblique.
- source_word: ምድረ
  choice: la terre
  rationale: Le contexte apocalyptique et la catastrophe imminente favorisent une portée globale plutôt que le sens local de « sol » ou de « pays ».
- source_word: ከመ፡ አጽነነት
  choice: que la terre s’était affaissée
  rationale: La forme guèze est lexicalement difficile, mais semble évoquer une déstabilisation physique ou un effondrement. « S’était affaissée » conserve cette image sans préciser indûment le mécanisme.
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: et que sa destruction était proche
  rationale: « Proche » rend clairement la proximité exprimée par ቅሩብ, tandis que « sa destruction » rattache la ruine imminente à la terre qui vient d’être nommée.
theological_decisions:
- issue: Faut-il comprendre l’état de la terre comme une corruption morale ou comme une déstabilisation physique ?
  choice: 'Déstabilisation physique : « la terre s’était affaissée »'
  alternative: « la terre était corrompue » ou « la terre avait été ébranlée »
  rationale: Le texte présente une condition que Noé voit et emploie une image compatible avec un cataclysme imminent. La traduction préserve cette imagerie apocalyptique sans la réduire à une affirmation abstraite de corruption morale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « En ces jours-là » conserve la cadence apocalyptique; le passé simple « vit » convient au récit littéraire sans être archaïque. L’ambiguïté du verbe décrivant l’état de la terre est explicitement préservée en note.
