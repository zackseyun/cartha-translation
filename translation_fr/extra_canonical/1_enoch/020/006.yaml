base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: fr
  text: Saraqaël[a], l’un des saints anges, préposé aux esprits des êtres humains qui pèchent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom est aussi transcrit « Sariel » dans certaines traditions textuelles.
    reason: textual_variant
lexical_decisions:
- source_word: ሰራቃኤል
  choice: Saraqaël
  rationale: Le nom propre est translittéré au plus près de la forme éthiopienne; le tréma aide le lecteur francophone à distinguer les deux voyelles finales.
- source_word: ፩እምነ፡ መላእክት፡ ቅዱሳን
  choice: l’un des saints anges
  rationale: L’expression partitive est rendue directement, tandis que « saints anges » conserve le registre apocalyptique traditionnel dans un français naturel.
- source_word: ዘዲበ
  choice: préposé à
  rationale: Cette formulation exprime l’autorité ou la responsabilité de Saraqaël sans préciser indûment la nature exacte de sa fonction.
- source_word: መናፍስት
  choice: les esprits
  rationale: Le pluriel explicite est conservé et désigne la catégorie placée sous l’autorité de Saraqaël.
- source_word: '[እስለ፡ እመሕያው፡]'
  choice: des êtres humains
  rationale: Le premier mot paraît être une corruption de transcription pour la locution guèze usuelle signifiant « enfants des hommes »; en français moderne, « êtres humains » en restitue naturellement le sens collectif.
- source_word: ዘመናፍስት፡ ያኃጥኡ
  choice: qui pèchent
  rationale: Le participe relatif exprime l’action pécheresse; aucune seconde expression « en esprit » n’est ajoutée, car elle n’est pas suffisamment étayée par le texte retenu.
theological_decisions:
- issue: Identité des esprits placés sous l’autorité de Saraqaël
  choice: les esprits des êtres humains qui pèchent
  alternative: les esprits de ceux qui pèchent dans leur esprit
  rationale: La syntaxe et la locution éthiopienne restaurable appuient l’idée d’esprits humains associés à des personnes qui pèchent. La traduction ne précise ni leur état ni la nature de la surveillance exercée.
translation_notes:
  register: Français international moderne, digne et accessible. « Préposé à » conserve l’idée d’autorité sans la rendre excessivement administrative; « êtres humains » évite l’ambiguïté contemporaine de « hommes » tout en rendant l’expression sémitique « enfants des hommes ».
