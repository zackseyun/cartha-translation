base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: fr
  text: Mikaël, l’un des saints anges, chargé de veiller au bien de l’humanité et de veiller sur le peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La transcription guèze fournie semble comporter ici une erreur de lecture : un mot signifiant « il est établi » ou « il est chargé » a vraisemblablement été lu comme « commandement ». Le grec correspondant appuie le sens adopté. On pourrait aussi traduire plus littéralement : « préposé aux bonnes choses des humains et au peuple ».'
    reason: source_textual_issue_and_alternative_reading
lexical_decisions:
- source_word: ሚካኤል
  choice: Mikaël
  rationale: Translittération française usuelle de la forme éthiopienne du nom, tout en conservant sa proximité avec celle-ci.
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: l’un des saints anges
  rationale: La formule indique l’appartenance de Mikaël au groupe des anges saints; cette tournure est naturelle et fidèle en français.
- source_word: ተሰይመ / ἐτάχθη
  choice: chargé de veiller
  rationale: Le texte corrigé exprime une désignation ou une affectation à un domaine de responsabilité. « Chargé de veiller » rend cette fonction avec naturel sans suggérer une souveraineté indépendante.
- source_word: ሠናይቱ ለሰብእ / τῶν ἀγαθῶν τῶν ἀνθρώπων
  choice: au bien de l’humanité
  rationale: Le syntagme désigne vraisemblablement ce qui est bon ou bénéfique pour les êtres humains. Le singulier collectif français « le bien de l’humanité » préserve cette portée générale.
- source_word: ዲበ ሕዝብ / ἐπὶ τῷ λαῷ
  choice: sur le peuple
  rationale: La préposition marque ici le domaine confié à la surveillance de Mikaël. « Le peuple » conserve le caractère défini mais non précisé du texte.
theological_decisions:
- issue: Nature du domaine confié à Mikaël
  choice: Il veille au bien de l’humanité et sur le peuple.
  alternative: Il est préposé aux bonnes choses des humains et au peuple; ou il est préposé aux bons parmi les humains.
  rationale: Le témoignage grec et la correction du texte guèze soutiennent une responsabilité concernant le bien des humains ainsi que le peuple. La traduction ne précise ni l’identité du peuple ni la nature exacte de ce « bien », afin de ne pas résoudre une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. « Mikaël » convient au contexte ancien; « humanité » évite le masculin générique. La formulation conserve la distinction entre « le bien de l’humanité » et « le peuple » sans identifier davantage ce dernier.
