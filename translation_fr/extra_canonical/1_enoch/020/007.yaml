base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: fr
  text: Gabriel, l’un des saints anges, qui est préposé au Paradis, aux serpents[a] et aux chérubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze traduit par « serpents » est difficile à interpréter dans la tradition manuscrite. Le sens traditionnel de ce verset semble néanmoins désigner des serpents ou des êtres serpentins.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገብርኤል
  choice: Gabriel
  rationale: La forme française traditionnelle du nom propre est naturelle et reconnaissable, tout en correspondant au nom guèze.
- source_word: ፩እምነ
  choice: l’un des
  rationale: Cette expression marque simplement l’appartenance à un groupe.
- source_word: መላእክት ቅዱሳን
  choice: saints anges
  rationale: Cette formulation conserve la désignation apocalyptique traditionnelle sans transformer les anges en une autre catégorie d’êtres.
- source_word: ዘዲበ
  choice: qui est préposé à
  rationale: La construction indique une autorité ou une responsabilité confiée; « préposé à » l’exprime dans un registre digne et concis.
- source_word: ገነት
  choice: le Paradis
  rationale: Dans cette liste de domaines angéliques, le mot désigne vraisemblablement le séjour paradisiaque plutôt qu’un jardin ordinaire.
- source_word: አክይስት
  choice: les serpents
  rationale: Le terme transmis est lexicalement difficile, mais son interprétation traditionnelle dans ce verset renvoie à des serpents ou à des êtres serpentins; « serpents » préserve mieux le registre que « couleuvres » ou « animaux rampants ».
- source_word: ኪሩቤን
  choice: les chérubins
  rationale: Il s’agit de la désignation française traditionnelle de ces êtres célestes, au pluriel.
theological_decisions:
- issue: Faut-il comprendre ገነት comme un jardin générique ou comme un lieu cosmique et théologique?
  choice: le Paradis
  alternative: le jardin; l’Éden
  rationale: Le contexte d’une liste d’anges chargés de domaines célestes favorise le séjour paradisiaque. « Paradis » conserve cette portée sans ajouter de précision doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. « Préposé à » conserve l’idée d’une charge angélique; la répétition implicite de la préposition devant les trois domaines est rendue naturellement en français.
