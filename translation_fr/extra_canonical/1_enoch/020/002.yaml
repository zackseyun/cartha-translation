base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/002.yaml
  text: Uriel[a], one of the holy angels[b], who is over the world and over Tartarus.
translation:
  language: fr
  text: Uriel, l’un des saints anges, qui est préposé au monde et au Tartare[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset est difficile dans le témoin disponible. Elle peut désigner le « Tartare », lieu de détention des êtres célestes rebelles, ou, plus généralement, « l’abîme ». Des lectures comme « la terreur » ou « le tremblement » ont aussi été envisagées.
    reason: textual_variant
lexical_decisions:
- source_word: ኡርኤል
  choice: Uriel
  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: ፩እመላእክት፡ ቅዱሳን
  choice: l’un des saints anges
  rationale: Le numéral avec la préposition exprime l’appartenance à un groupe. « Saints anges » conserve la désignation traditionnelle des êtres célestes dans cette liste apocalyptique.
- source_word: እሰመ
  choice: qui est préposé à
  rationale: Cette tournure exprime de façon concise la sphère confiée à Uriel tout en maintenant la proposition relative caractéristique de la liste.
- source_word: ዘዓለም
  choice: le monde
  rationale: Dans le contexte des domaines cosmiques attribués aux anges, « le monde » est plus probable que les sens temporels possibles, tels que « l’âge » ou « l’éternité ».
- source_word: ወዘተረዓድ
  choice: et au Tartare
  rationale: Malgré l’état difficile du témoin, un lieu infernal concret correspond le mieux à la structure de cette liste de juridictions angéliques. L’incertitude est signalée en note.
theological_decisions:
- issue: Le second domaine d’Uriel désigne-t-il le Tartare, l’abîme ou une notion abstraite comme la terreur ou le tremblement ?
  choice: le Tartare
  alternative: l’abîme ; la terreur ou le tremblement
  rationale: Un domaine cosmique concret s’accorde avec les fonctions attribuées aux anges dans le contexte et préserve l’univers apocalyptique du texte. La lecture demeure toutefois incertaine et n’est donc pas présentée sans réserve.
translation_notes:
  register: Français international moderne, sobre et digne. La proposition relative maintient la structure formulaire de la liste. « Préposé à » exprime une responsabilité assignée sans développer davantage la nature de cette autorité.
