base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/001.yaml
  text: And these are the names of the holy angels who keep watch[a].
translation:
  language: fr
  text: Voici les noms des saints anges qui veillent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « veillent » peut aussi signifier « restent vigilants » ou « montent la garde ». Dans le contexte plus large de 1 Hénoch, ce vocabulaire fait écho aux êtres célestes appelés les Veilleurs, mais le verset présente ici l’idée sous la forme d’une description des anges.
    reason: alternative lexicale et possible écho terminologique
lexical_decisions:
- source_word: ወዝንቱ
  choice: Voici
  rationale: La conjonction suivie du démonstratif introduit ici une liste. « Voici » constitue en français une formule naturelle et digne de présentation, tandis que le pluriel est porté par « les noms ».
- source_word: አስማቲሆሙ
  choice: les noms
  rationale: La forme signifie littéralement « leurs noms ». Dans une formule introduisant une liste, « les noms » est plus idiomatique en français, et l’identité de ceux à qui ils appartiennent est précisée par la suite.
- source_word: ለእለ
  choice: des … qui
  rationale: Le marqueur relatif rattache les noms au groupe décrit ensuite. La tournure française « les noms des … qui » rend clairement cette relation.
- source_word: ይተግሁ
  choice: veillent
  rationale: Le verbe exprime l’état d’éveil, la vigilance ou l’action de monter la garde. « Veillent » conserve cette amplitude sans en faire nécessairement un titre technique.
- source_word: ቅዱሳን
  choice: saints
  rationale: « Saints » est le correspondant français usuel dans ce registre religieux et qualifie les anges comme appartenant au domaine consacré.
- source_word: መላእክት
  choice: anges
  rationale: Dans ce contexte apocalyptique, il s’agit manifestement d’êtres célestes ; « anges » convient donc mieux que le terme générique « messagers ».
theological_decisions:
- issue: Faut-il rendre le verbe décrivant les anges par le titre technique « Veilleurs » ?
  choice: qui veillent
  alternative: les Veilleurs
  rationale: Le guèze emploie ici une description verbale exprimant la vigilance. « Qui veillent » préserve ce sens et son éventuel écho aux Veilleurs sans transformer explicitement la description en titre technique.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « Voici les noms » introduit clairement la liste qui suit ; « qui veillent » maintient l’ambiguïté entre une activité de vigilance et un possible écho au titre des Veilleurs.
