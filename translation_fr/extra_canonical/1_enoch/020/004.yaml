lexical_decisions:
- source_word: ራጉኤል
  choice: Ragouël
  rationale: Translittération française conventionnelle du nom angélique, plutôt qu’une traduction de celui-ci.
- source_word: ፩እምነ
  choice: l’un des
  rationale: Rend naturellement en français la relation partitive d’appartenance à un groupe.
- source_word: መላእክት ቅዱሳን
  choice: saints anges
  rationale: Formulation française consacrée qui conserve directement la qualification de sainteté.
- source_word: ዘይትቤቀሎ
  choice: qui exerce la vengeance
  rationale: Conserve la force judiciaire et rétributive du verbe sans la réduire au sens plus général de « punir ».
- source_word: ለዓለም
  choice: contre le monde
  rationale: « Monde » convient à la portée cosmique du passage; « contre » explicite ici la cible de l’action punitive tout en signalant en note l’autre formulation possible.
- source_word: ለብርሃናት
  choice: contre les luminaires
  rationale: « Luminaires » désigne avec dignité les lumières célestes et maintient l’imagerie cosmique du texte apocalyptique.
theological_decisions:
- issue: Étendue de la fonction punitive de Ragouël
  choice: Ragouël exerce la vengeance contre le monde et contre les luminaires.
  alternative: Ragouël venge le monde et les luminaires, ou exerce plus généralement une autorité sur leur ordre.
  rationale: La syntaxe présente le monde et les luminaires comme deux termes coordonnés régis par le même verbe. La formulation principale conserve donc la dureté judiciaire du catalogue angélique, tandis que la note maintient l’ambiguïté possible de la construction.
translation_notes:
  register: Français international moderne, sobre et digne. La construction répétée « contre le monde et contre les luminaires » clarifie les deux objets coordonnés sans atténuer l’étrangeté voulue de l’image apocalyptique.
