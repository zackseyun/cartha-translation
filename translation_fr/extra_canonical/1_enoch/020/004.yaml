translation:
  language: fr
  text: Ragouël, l’un des saints anges, qui tire vengeance[a] du monde et des luminaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui exerce sa vengeance contre le monde et les luminaires ». Le verbe sous-jacent exprime une action judiciaire et rétributive.'
