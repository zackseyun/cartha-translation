  text: Raphael[a], one of the holy angels, who is over the spirits of men.
translation:
  language: fr
  text: Raphaël, l’un des saints anges, qui a autorité sur les esprits des humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « les esprits de l’humanité ». Le terme guèze désigne ici collectivement les êtres humains, et non nécessairement les hommes de sexe masculin.'
    reason: alternative lexicale et clarification de la portée collective
lexical_decisions:
- source_word: ሩፋኤል
  choice: Raphaël
  rationale: Forme française traditionnelle du nom propre, sans traduire son étymologie.
- source_word: ፩እምነ
  choice: l’un des
  rationale: Rend naturellement en français le numéral accompagné de la préposition partitive, qui marque l’appartenance à un groupe.
- source_word: ቅዱሳን፡ መላእክት
  choice: saints anges
  rationale: Expression française directe et digne pour désigner des êtres célestes consacrés.
- source_word: ዘ
  choice: qui
  rationale: Pronom relatif personnel introduisant la fonction attribuée à Raphaël.
- source_word: መናፍስተ
  choice: esprits
  rationale: Équivalent le plus direct dans ce contexte cosmologique; « âmes » préciserait indûment le sens.
- source_word: ሰብእ
  choice: humains
  rationale: Le terme a ici une portée collective et désigne l’humanité, sans restriction nécessaire aux personnes de sexe masculin.
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: qui a autorité sur les esprits des humains
  rationale: « A autorité sur » exprime clairement la charge ou la sphère de responsabilité tout en conservant la formulation hiérarchique et concise du catalogue.
theological_decisions:
- issue: Étendue de la charge de Raphaël
  choice: Raphaël a autorité sur les esprits des humains.
  alternative: Raphaël est préposé aux âmes des morts, ou à la guérison et à la vie intérieure de l’humanité.
  rationale: Le guèze mentionne seulement les « esprits des humains » et ne précise ni qu’il s’agit des morts ni qu’une fonction de guérison est en vue. La traduction n’importe donc pas d’interprétations issues du nom de Raphaël ou d’autres traditions.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure conserve le style bref d’une liste angélique; « humains » évite l’ambiguïté genrée de « hommes » sans élargir le référent au-delà du texte source.
