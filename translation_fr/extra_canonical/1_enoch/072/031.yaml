base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: fr
  text: Ce jour-là, le soleil sort de cette porte et se couche à l’ouest. Puis il entre à l’est[a] et se lève par la troisième porte pendant trente et un matins[b], et se couche à l’ouest du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe signifie littéralement « entrer ». Dans la succession cyclique décrite ici, il peut aussi être compris comme un retour vers l’est.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « trente et un matins ». Le texte compte la période par les levers successifs du soleil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: sort
  rationale: Ce verbe concret exprime la sortie du soleil par une porte céleste et conserve naturellement l’image cosmique.
- source_word: ኆኅት
  choice: porte
  rationale: Dans le Livre astronomique, le terme désigne les ouvertures fixes du ciel empruntées par les luminaires; « porte » préserve cette architecture cosmique.
- source_word: የዓርብ
  choice: se couche
  rationale: Dans ce contexte solaire, le verbe désigne idiomatiquement le coucher du soleil.
- source_word: ይገብእ
  choice: rentre
  rationale: Le sens premier peut être « entrer », tandis que le contexte cyclique permet aussi de comprendre « retourner ». « Rentre » conserve l’idée d’entrée tout en suggérant le retour vers l’est.
- source_word: በምስራቅ
  choice: à l’est
  rationale: Cette formulation respecte la valeur locative ou directionnelle possible sans préciser davantage que le texte.
- source_word: ይሠርቅ
  choice: se lève
  rationale: Dans un contexte astronomique, il s’agit du lever du soleil; c’est l’équivalent français courant et précis.
- source_word: በሣልስት ኆኅት
  choice: par la troisième porte
  rationale: « Par » rend le passage du soleil au moyen de cette ouverture céleste sans alourdir la phrase.
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: pendant trente et un matins
  rationale: Le texte compte littéralement des « matins »; conserver ce mot respecte son mode d’énumération par levers successifs.
- source_word: ምዕራብ ሰማይ
  choice: l’ouest du ciel
  rationale: Cette expression garde la représentation concrète d’un ciel structuré plutôt que de la moderniser en « horizon ».
theological_decisions:
- issue: Architecture cosmique du ciel
  choice: Conserver « porte » et « l’ouest du ciel » comme images astronomiques concrètes
  alternative: Employer des termes modernisés tels que « horizon » ou « partie occidentale du ciel »
  rationale: Le passage décrit un cosmos structuré comportant des portes célestes. La traduction préserve cette représentation sans l’harmoniser avec une cosmologie moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la succession des mouvements décrits en guèze, tout en évitant une coordination excessivement lourde. Les images cosmologiques propres au passage sont conservées.
