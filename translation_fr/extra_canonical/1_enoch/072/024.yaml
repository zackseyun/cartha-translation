- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ፡
  choice: onze parts
  rationale: Le syntagme signifie littéralement « dix et une parts ». « Parts » préserve le caractère schématique et technique de la division.
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: et le jour, de sept parts
  rationale: La tournure elliptique reproduit le parallélisme de l’éthiopien tout en restant claire et idiomatique en français.
