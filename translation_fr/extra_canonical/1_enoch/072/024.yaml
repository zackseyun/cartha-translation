  text: And on that day the night becomes eleven parts[b][a], and the day seven parts.
translation:
  language: fr
  text: Ce jour-là, la nuit passe à onze parts[a], et le jour à sept parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La nuit et le jour sont ici mesurés en « parts » numérotées, selon le calendrier schématique du Livre astronomique ; il ne s’agit pas d’heures ordinaires.
