base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: fr
  text: Le soleil achève ses parcours[a], puis il suit de nouveau ces parcours. Il entre par cette porte pendant trente matins[b] et, à l’ouest, il se couche en face d’elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses têtes »; dans ce contexte, le terme semble désigner les parcours, étapes ou positions assignés au soleil.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « trente matins »; l’expression correspond vraisemblablement à trente jours durant lesquels le soleil paraît par la même porte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈጸመ
  choice: achève
  rationale: Le parfait est rendu par un présent de description générale, en accord avec les verbes qui suivent et avec le mouvement cyclique exposé dans le passage.
- source_word: አርእስቲሁ
  choice: ses parcours
  rationale: La forme est plurielle et désigne ici les tracés ou étapes assignés au soleil. « Parcours » est naturel en français et garde l’idée de mouvements répétés.
- source_word: ዳግመ የሐውር
  choice: puis il suit de nouveau
  rationale: Cette formulation exprime clairement la répétition du déplacement solaire sans alourdir la phrase.
- source_word: ይበውእ በውእቱ ኆኅት
  choice: il entre par cette porte
  rationale: Conserve l’image cosmologique concrète des portes célestes propre au Livre des luminaires.
- source_word: ሠላሳ ጸባሐ
  choice: pendant trente matins
  rationale: « Matins » traduit littéralement le terme source et évoque les apparitions quotidiennes du soleil, sans le réduire silencieusement à « jours ».
- source_word: በምዕራብኒ
  choice: à l’ouest
  rationale: Rend simplement et naturellement l’indication du lieu où le soleil se couche.
- source_word: በመንጸሩ የዓርብ
  choice: il se couche en face d’elle
  rationale: Suit la lecture corrigée de l’édition, « en face d’elle », plutôt que l’OCR fautif በምንዳቤሁ. « Se couche » est le terme astronomique français naturel pour le soleil.
theological_decisions:
- issue: Imagerie cosmologique du déplacement du soleil à travers des portes
  choice: Conserver les portes et les parcours comme images concrètes
  alternative: Reformuler selon une description astronomique moderne et abstraite
  rationale: Le texte présente une cosmologie visionnaire structurée. La traduction en préserve les images sans les harmoniser avec une conception scientifique moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression du guèze tout en évitant une coordination trop lourde. Le référent féminin « elle » renvoie sans ambiguïté à « la porte ».
