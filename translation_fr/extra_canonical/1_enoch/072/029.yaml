base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: fr
  text: Le soleil revient et entre par la deuxième porte, qui est à l’est ; il revient sur cette trajectoire principale durant trente matins[a], se levant et se couchant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition « il revient sur cette trajectoire principale durant trente matins » est difficile dans le texte éthiopien. On peut aussi comprendre : « il revient par cette porte pendant trente matins ».'
    reason: textual_variant
lexical_decisions:
- source_word: ገብአ
  choice: revient
  rationale: 'Le verbe signifie ici « revenir » : dans la séquence astronomique, le soleil retourne vers les portes orientales.'
- source_word: ቦአ ውስተ
  choice: entre par
  rationale: La construction exprime l’entrée dans une porte ; en français, « entrer par une porte » conserve naturellement l’image cosmologique.
- source_word: ካልእ ኆኅት
  choice: la deuxième porte
  rationale: Dans l’énumération successive des portes, ካልእ a une valeur ordinale, confirmée par la mention ultérieure de la troisième porte.
- source_word: እንተ በምሥራቅ
  choice: celle qui est à l’est
  rationale: La relative localise précisément la deuxième porte, dans un français naturel et fidèle.
- source_word: ይገብእ ዲበ ዝኩ አርእስቲሁ
  choice: il revient à ce parcours principal
  rationale: La traduction conserve le second verbe de retour, le démonstratif et la notion de parcours principal portée par አርእስቲሁ, tout en évitant le calque peu naturel « sur sa tête ».
- source_word: ሠላሳ ጸባሐ
  choice: pendant trente matins
  rationale: L’expression indique la durée calendaire durant laquelle le soleil suit ce parcours.
- source_word: ይሠርቅ ወየዓርብ
  choice: se levant et se couchant
  rationale: Cette paire rend directement les mouvements opposés du lever et du coucher du soleil et préserve leur rythme.
