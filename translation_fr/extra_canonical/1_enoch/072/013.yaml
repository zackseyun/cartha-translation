  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: fr
  text: Il entre à l’aube et sort par la sixième[a] ; il sort et se couche dans la sixième porte pendant trente-deux matins[b], en raison de son signe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze dit littéralement « la sixième » ; « porte » ou « ouverture » est sous-entendu d’après la série décrite dans ce chapitre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « trente-deux matins » : le texte compte la période par matins plutôt que de dire simplement « jours ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « au sujet de son signe ». Certains comprennent plutôt : « selon son signe ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይገብእ ጽባሐ
  choice: il entre à l’aube
  rationale: Le verbe exprime l’entrée, et ጽባሐ situe l’action au matin ou à l’aube. Cette formulation conserve le mouvement concret et la valeur temporelle.
- source_word: ይወፅእ
  choice: sort
  rationale: La répétition du verbe dans le texte guèze est maintenue, malgré son caractère condensé, afin de ne pas supprimer une étape du mouvement décrit.
- source_word: ውስተ ሳድስት
  choice: par la sixième
  rationale: Le texte porte littéralement une construction proche de « dans/vers la sixième », mais le nom « porte » est sous-entendu par la séquence astronomique. « Par » rend naturellement en français le passage associé à cette ouverture tout en laissant l’ellipse visible grâce à la note.
- source_word: የዓርብ
  choice: se couche
  rationale: Dans ce contexte solaire, le verbe de descente désigne naturellement le coucher de l’astre.
- source_word: በሳድስት ኆኅት
  choice: dans la sixième porte
  rationale: La préposition በ est distinguée de ውስተ, et ኆኅት est rendu par « porte », conformément à l’architecture cosmique concrète du chapitre.
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: pendant trente-deux matins
  rationale: Le texte compte explicitement des « matins » plutôt que des jours ; le français conserve cette unité sans la normaliser.
- source_word: በእንተ ትእምርተ ዚአሃ
  choice: en raison de son signe
  rationale: በእንተ exprime principalement le motif, la cause ou le sujet. « En raison de » préserve cette force mieux que « selon », tandis que « son signe » rend la relation pronominale avec naturel.
theological_decisions:
- issue: Imagerie astronomique des ouvertures célestes
  choice: Conserver l’image concrète de la « porte ».
  alternative: Naturaliser par « secteur », « position » ou « station ».
  rationale: Le passage décrit une architecture cosmique révélée. La traduction ne la remplace pas par un modèle astronomique moderne.
- issue: Valeur de la formule finale
  choice: « en raison de son signe »
  alternative: « selon son signe »
  rationale: La préposition guèze favorise une relation causale ou explicative. La formulation retenue préserve cette difficulté sans transformer le « signe » en simple règle de conformité.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition technique de « sort » est conservée parce qu’elle correspond aux deux occurrences du verbe guèze. La ponctuation clarifie les mouvements successifs sans lisser l’étrangeté du schéma astronomique.
