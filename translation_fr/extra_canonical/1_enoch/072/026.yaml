  rationale: Suit l’interprétation numérique transmise dans les données de consultation et conserve le complément « du jour », tout en signalant en note l’état difficile du texte éthiopien.
- source_word: ፲ወ፪ተ፡ ወ፪እቲ
  choice: douze parts, plus deux parts
  rationale: Conserve séparément les deux nombres et leur relation additive au lieu de les fondre en un total conjectural.
- source_word: ክፍለ፡ ጥንቅቀ
  choice: parts exactement
  rationale: ክፍለ désigne des parts ou divisions, tandis que ጥንቅቀ a ici une valeur adverbiale de précision.
- source_word: ወማዓልት፡ ስድስተ፡ ክፍለ
  choice: et le jour, six parts
  rationale: Préserve la brièveté elliptique de la proposition numérique tout en restant intelligible en français.
theological_decisions:
- issue: Faut-il harmoniser les nombres astronomiques avec le contexte du chapitre ?
  choice: Conserver la suite numérique difficile telle qu’elle est transmise, avec une note.
  alternative: Corriger ou réorganiser les nombres d’après le schéma astronomique attendu.
  rationale: La difficulté est textuelle plutôt que doctrinale; une harmonisation silencieuse masquerait l’incertitude réelle du témoin.
- issue: Sens du verbe ትነሡኅ
  choice: diminue
  alternative: augmente
  rationale: La valeur lexicale de diminution est privilégiée sur la couche anglaise révisée, qui porte « increases » sans appui clair dans la forme guèze fournie.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire technique « parts » est maintenu pour le système de mesure du Livre astronomique; l’ellipse finale reproduit la concision du guèze.
