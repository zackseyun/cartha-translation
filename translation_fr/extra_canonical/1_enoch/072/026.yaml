base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: fr
  text: Ce jour-là, la nuit diminue et atteint neuf parts[a] du jour ; la nuit atteint douze parts et deux parts, exactement[b], et le jour atteint six parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation numérique de ce verset est difficile dans le témoin éthiopien. Elle semble décrire schématiquement la durée du jour et de la nuit en parts, mais sa syntaxe et ses nombres sont irréguliers ; certains proposent de les harmoniser avec le contexte.
    reason: textual_variant
  - marker: b
    text: Le texte énonce séparément « douze parts » et « deux parts », avec un terme de précision rendu par « exactement ». Sa formulation numérique est difficile ; aucune totalisation conjecturale n’a été introduite.
    reason: textual_variant
lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: Ce jour-là
  rationale: Rend naturellement la formule temporelle avec sa valeur démonstrative.
- source_word: ትነሡኅ፡ ሌሊት
  choice: la nuit diminue
