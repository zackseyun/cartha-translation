base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: fr
  text: Et durant ces jours-là, le jour s’allonge de jour en jour[a], et la nuit raccourcit de nuit en nuit, jusqu’à trente matins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze répète littéralement « jour » et « nuit » dans une construction comparative (« jour à partir de jour », « nuit à partir de nuit »). Dans ce contexte, chaque jour successif devient plus long et chaque nuit successive plus courte.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à trente aurores ». Le mot signifie littéralement « matin » ou « aurore » et désigne probablement une étape comptée dans le cycle des luminaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: durant ces jours-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve le registre narratif élevé et la référence à la période décrite.
- source_word: ትነኍኅ
  choice: s’allonge
  rationale: Le verbe exprime l’accroissement de la durée du jour; « s’allonge » est idiomatique et précis dans un contexte astronomique.
- source_word: ዕለት እምዕለት
  choice: de jour en jour
  rationale: La tournure rend naturellement la progression comparative d’un jour au suivant, sans réduire l’expression à une simple répétition temporelle.
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: la nuit raccourcit de nuit en nuit
  rationale: Cette formulation garde le parallélisme avec la proposition précédente et exprime la diminution successive de la durée nocturne.
- source_word: እስከ ሠላሳ ጽባሕ
  choice: jusqu’à trente matins
  rationale: « Matins » conserve le sens concret de ጽባሕ et l’expression de dénombrement propre au schéma astronomique; « aurores » demeure possible.
theological_decisions:
- issue: Faut-il reproduire littéralement la construction comparative répétant « jour » et « nuit », ou employer une tournure française progressive?
  choice: Employer « de jour en jour » et « de nuit en nuit », avec une note signalant la forme littérale.
  alternative: « le jour s’allonge par rapport au jour, et la nuit raccourcit par rapport à la nuit »
  rationale: Le contexte décrit une variation mesurée et successive de la durée du jour et de la nuit. La tournure retenue restitue ce mouvement comparatif en français intelligible, tandis que la note préserve l’étrangeté et l’ambiguïté formelles de l’original.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme astronomique est conservé; la construction guèze inhabituelle est rendue naturellement dans le texte et explicitée en note.
