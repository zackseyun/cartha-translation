base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: fr
  text: Le soleil sort de cette cinquième porte et se couche dans la cinquième porte, à l’ouest. Puis il se lève dans la quatrième porte, selon ses signes, pendant trente et un matins[a], et se couche à l’ouest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « selon ses signes » est difficile. Elle peut désigner les signes, repères ou indications assignés au soleil durant cette période de trente et un matins.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte guèze dit simplement ici : « et se couche à l’ouest ». Certains traducteurs ajoutent « dans cette porte », mais le témoin fourni ne répète pas explicitement le mot « porte ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: sort
  rationale: Le verbe exprime le fait d’aller au-dehors ou d’émerger. « Sort » conserve le mouvement concret du soleil dans l’architecture cosmique du passage.
- source_word: ኆኅት
  choice: porte
  rationale: Dans le Livre astronomique, ce terme désigne les ouvertures célestes empruntées par les luminaires. « Porte » maintient l’imagerie cosmique et apocalyptique.
- source_word: የዓርብ / ያዓርብ
  choice: se couche
  rationale: Dans ce contexte astronomique, le verbe décrit le coucher du soleil plutôt qu’une simple entrée.
- source_word: ምዕራብ
  choice: l’ouest
  rationale: Le nom désigne la direction ou région occidentale; « l’ouest » est l’équivalent français naturel.
- source_word: ይሠርቅ
  choice: se lève
  rationale: Dans le contexte de la course solaire, le verbe désigne clairement le lever du soleil.
- source_word: በራብዕት ኆኅት
  choice: dans la quatrième porte
  rationale: La même construction prépositionnelle avec በ est employée auparavant pour la cinquième porte. Une traduction identique préserve le parallélisme spatial et formulaire.
- source_word: በእንተ ትእምርታቲሃ
  choice: selon ses signes
  rationale: Cette formulation rend l’idée que le mouvement s’effectue en conformité avec les signes ou indications associés au soleil, sans introduire une finalité absente du texte.
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: pendant trente et un matins
  rationale: Le texte dit explicitement « matins ». Le conserver respecte le cadre d’observation du cycle des luminaires.
theological_decisions:
- issue: Architecture cosmique des portes célestes
  choice: Conserver littéralement le terme « porte »
  alternative: ouverture ou fenêtre
  rationale: Le passage décrit un cosmos structuré au moyen d’une imagerie visionnaire. « Porte » préserve cette représentation sans la ramener à une description astronomique moderne.
- issue: Rapport entre le mouvement solaire et ses signes
  choice: « selon ses signes »
  alternative: « à cause de ses signes »
  rationale: « Selon » exprime la conformité à des indications établies tout en préservant la relative opacité de la formule guèze; « à cause de » imposerait plus nettement un rapport causal.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases ont été légèrement segmentées pour faciliter la lecture, tout en conservant la répétition formulaire, les « portes » de l’imagerie cosmique et l’expression ambiguë « selon ses signes ».
