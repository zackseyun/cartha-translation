base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: fr
  text: 'Et voici la première loi[a] des luminaires : le soleil, une lumière, se lève par les portes du ciel à l’est[b] et se couche par les portes occidentales du ciel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ordonnance » ou « règle ». Le terme désigne ici l’ordre fixe qui régit les luminaires.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression renvoie à la direction de l’aube.
    reason: lexical_alternative
  - marker: c
    text: La transcription fournie comporte vraisemblablement une erreur à propos du lever du soleil. La lecture corrigée de l’édition produit le parallélisme « son lever… et son coucher ».
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: loi
  rationale: Dans le Livre astronomique, le mot désigne l’ordre fixe qui régit les corps célestes, plutôt qu’un commandement ponctuel adressé à quelqu’un.
- source_word: ቀዳማዊ
  choice: première
  rationale: Le terme introduit le premier élément d’une série d’ordonnances astronomiques.
- source_word: ብርሃናት
  choice: luminaires
  rationale: Ce terme français conserve le registre cosmique et désigne naturellement les corps célestes lumineux.
- source_word: ፀሐይ
  choice: le soleil
  rationale: Désignation directe du corps céleste dont le mouvement est décrit.
- source_word: ብርሃን
  choice: une lumière
  rationale: La traduction maintient la valeur nominale et l’apposition au soleil, sans ajouter d’explication.
- source_word: መዋፅኢሁ (lecture corrigée de l’édition, contre መባእ dans la transcription fournie)
  choice: se lève
  rationale: La lecture corrigée signifie le lever ou la sortie du soleil et rétablit le parallélisme avec son coucher à l’ouest.
- source_word: ኃዋኅወ
  choice: portes
  rationale: « Portes » rend clairement les ouvertures célestes par lesquelles passe le soleil et conserve l’imagerie apocalyptique.
- source_word: መንገለ ጽባሕ
  choice: à l’est
  rationale: L’expression évoque littéralement la direction de l’aube; « à l’est » en exprime naturellement le sens directionnel.
- source_word: ወምዕራቢሁ
  choice: et se couche
  rationale: Le mot désigne ici le coucher du soleil et forme le pendant nominal ou conceptuel de son lever.
- source_word: ዘምዕራብ
  choice: occidentales
  rationale: L’adjectif exprime avec naturel que ces portes sont celles de l’ouest.
theological_decisions:
- issue: Nature de l’ordre cosmique
  choice: « loi »
  alternative: « ordonnance », « règle » ou « commandement »
  rationale: Le passage décrit une organisation stable de la création, non un impératif moral. « Loi » préserve cette idée sans introduire de doctrine particulière.
- issue: Mouvement du soleil dans la cosmologie du passage
  choice: Lever à l’est et coucher à l’ouest
  alternative: Entrée à l’est et sortie à l’ouest selon la transcription fautive fournie
  rationale: 'La lecture vérifiée de l’édition Charles rétablit la syntaxe nominale et l’ordre astronomique attendu : le soleil sort ou se lève à l’est et se couche à l’ouest.'
translation_notes:
  register: Français international moderne, clair et soutenu. « Luminaires » et « portes du ciel » conservent le registre cosmique et apocalyptique; les verbes « se lève » et « se couche » rendent naturellement en français la construction nominale du lever et du coucher.
