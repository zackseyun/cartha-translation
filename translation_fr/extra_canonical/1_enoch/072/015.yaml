  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: fr
  text: Le soleil se lève, alors que le jour raccourcit et que la nuit s’allonge. Puis le soleil retourne à l’est, entre dans la sixième porte[b], en sort et se couche pendant trente matins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « pendant trente matins » est textuellement difficile. Elle désigne vraisemblablement une période de trente jours durant laquelle le soleil emprunte cette porte.
    reason: textual_variant
  - marker: b
    text: Les portes font partie de la représentation du cosmos propre au Livre astronomique; le texte les présente comme des éléments concrets du monde contemplé dans la vision.
    reason: cultural_note
lexical_decisions:
- source_word: ይትነሣእ ፀሐይ
  choice: Le soleil se lève
  rationale: Le verbe désigne ici le lever ou l’ascension du soleil. « Se lève » est l’expression française naturelle dans ce contexte astronomique.
- source_word: ትሕጽር ዕለት
  choice: le jour raccourcit
  rationale: Cette formulation rend directement la diminution saisonnière de la durée du jour.
- source_word: ትኑኅ ሌሊት
  choice: la nuit s’allonge
  rationale: Le choix maintient le parallélisme antithétique avec « le jour raccourcit ».
- source_word: ይገብእ ፀሐይ በጽባሕ
  choice: le soleil retourne à l’est
  rationale: ይገብእ exprime ici le retour, tandis que በጽባሕ a un sens spatial, « vers le lieu du matin », donc l’est, dans la cosmologie du passage.
- source_word: ይበውእ ውስተ ሳድስት ኆኅት
  choice: entre par la sixième porte
  rationale: Le verbe indique l’entrée et la « porte » appartient au système concret des portes célestes décrit dans le Livre astronomique.
- source_word: ይሠርቅ እምኔሃ
  choice: il se lève de cette porte
  rationale: Le verbe décrit l’apparition ou le lever du soleil depuis la porte. La répétition de « se lève » conserve la cohérence du mouvement solaire.
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: pendant trente matins, il … se couche
  rationale: La formulation conserve l’unité littérale « matins » tout en indiquant en français qu’il s’agit d’une période durant laquelle le mouvement se répète.
theological_decisions:
- issue: Statut des portes célestes dans la vision
  choice: Conserver l’image concrète de la « sixième porte »
  alternative: Interpréter les portes comme une simple métaphore des saisons
  rationale: Le texte présente les portes comme des éléments du monde cosmique décrit par la vision. La traduction ne doit ni rationaliser cette représentation ni imposer une lecture doctrinale extérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre le raccourcissement du jour et l’allongement de la nuit est maintenu. La syntaxe a été légèrement réorganisée autour de « pendant trente matins » afin d’exprimer naturellement en français la répétition du lever et du coucher, sans effacer la difficulté textuelle.
