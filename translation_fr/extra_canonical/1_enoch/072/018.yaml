  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/018.yaml
  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
translation:
  language: fr
  text: 'Ce jour-là, le jour diminue de deux parts[a] : le jour compte alors dix parts, et la nuit, huit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le Livre astronomique mesure régulièrement la durée du jour et de la nuit en « parts ». Ce verset décrit la diminution saisonnière du jour : le jour compte dix parts et la nuit huit.'
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: Ce jour-là
  rationale: Formule temporelle naturelle en français, qui conserve la valeur démonstrative et désigne une étape précise du cycle des luminaires.
- source_word: ተሐፅፅ
  choice: diminue
  rationale: Le verbe exprime une réduction; « diminue » convient au décroissement saisonnier de la durée du jour et maintient la cohérence de la formule astronomique.
- source_word: ተክልኤተ ክፍል
  choice: de deux parts
  rationale: Dans ce contexte, le syntagme indique l'ampleur de la diminution, non une division en deux.
- source_word: ወትከውን ዕለት ዓሠርተ ክፍለ
  choice: le jour compte alors dix parts
  rationale: Le guèze fait explicitement du jour le sujet. « Compte alors » exprime naturellement en français l'état résultant sans obscurcir le système de mesure.
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: et la nuit, huit
  rationale: La construction elliptique française restitue le parallélisme du texte; le mot « parts » reste clairement sous-entendu.
