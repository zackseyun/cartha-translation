base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: fr
  text: 'Ce jour-là, le jour devient plus long que la nuit d’un neuvième[a] : le jour compte exactement dix parts[b], et la nuit, exactement huit parts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien comporte ici un mot incertain, transmis entre crochets. La lecture « d’un neuvième » correspond au calcul qui suit : le jour compte dix parts et la nuit huit, sur un total de dix-huit.'
    reason: textual_variant
  - marker: b
    text: Les « parts » sont les divisions conventionnelles employées dans ce chapitre pour comparer la durée du jour et celle de la nuit au cours de l’année.
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: Ce jour-là
  rationale: Formule temporelle naturelle en français, qui conserve la valeur démonstrative du guèze.
- source_word: ትነኍኅ፡ እምሌሊት፡
  choice: le jour devient plus long que la nuit
  rationale: Rend clairement l’allongement comparatif du jour dans ce contexte astronomique.
- source_word: ታስዕተ፡ እደ፡
  choice: d’un neuvième
  rationale: 'Le sens fractionnaire s’accorde au système de dix-huit parts : l’écart entre dix parts de jour et huit parts de nuit est de deux parts, soit un neuvième du total.'
- source_word: ጥንቁቀ፡
  choice: exactement
  rationale: Conserve l’idée de précision du relevé numérique; le terme est rendu aux deux occurrences.
- source_word: ዓሠርተ፡ ክፍለ፡
  choice: dix parts
  rationale: « Parts » convient au découpage technique de la durée du jour et de la nuit dans ce chapitre.
- source_word: ስመንተ፡ ክፈለ፡
  choice: huit parts
  rationale: Le même terme technique est traduit de façon uniforme.
- source_word: '[ካዕበተ፡]'
  choice: non traduit dans le corps du texte
  rationale: Ce mot entre crochets est textuellement incertain et n’est pas nécessaire au sens assuré de la phrase; l’incertitude est signalée en note.
theological_decisions:
- issue: Nature des nombres employés dans le verset
  choice: Les comprendre comme des divisions astronomiques techniques de la durée du jour et de la nuit.
  alternative: Les interpréter comme des nombres symboliques apocalyptiques.
  rationale: Le contexte du chapitre décrit de manière suivie la course du soleil et les variations mesurées du jour et de la nuit; la traduction ne leur impose donc pas une portée numérologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le caractère technique du passage sans alourdir la phrase; les deux occurrences de l’adverbe de précision sont représentées par « exactement ».
