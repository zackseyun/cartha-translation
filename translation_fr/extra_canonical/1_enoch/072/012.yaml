  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
translation:
  language: fr
  text: À ce moment-là, le jour s’allonge de deux parties[a], et le jour devient de onze parties; la nuit se raccourcit et devient de sept parties.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « deux » est signalé comme incertain dans ce témoin éthiopien. Le contexte indique néanmoins que le jour s’allonge pour atteindre onze parties, tandis que la nuit est ramenée à sept parties.
    reason: textual_variant
lexical_decisions:
- source_word: ወእሜሃ
  choice: À ce moment-là
  rationale: Rend naturellement la transition temporelle sans la préciser excessivement.
- source_word: ይነኍኅ
  choice: s’allonge
  rationale: Le verbe exprime ici un allongement, confirmé par le passage du jour à onze parts et par le raccourcissement corrélatif de la nuit.
- source_word: ዕለት
  choice: le jour
  rationale: Désigne la période diurne mesurée, en contraste direct avec la nuit.
- source_word: †ክልኤ†
  choice: de deux parts
  rationale: Le nombre est marqué comme textuellement incertain dans le témoin; l’unité «parts» est implicite et se déduit du système de mesure du verset.
- source_word: ክፍለ
  choice: parts
  rationale: Terme bref et cohérent pour les divisions techniques du jour et de la nuit dans ce chapitre.
- source_word: ወትከውን
  choice: et atteint
  rationale: Exprime idiomatiquement le résultat chiffré de l’évolution tout en conservant la progression du texte.
- source_word: ዓሠርተ ወአሐደ
  choice: onze
  rationale: Rend le nombre guèze «dix et un» selon l’usage français courant.
- source_word: ወተሐጽር ሌሊት
  choice: tandis que la nuit raccourcit
  rationale: Conserve le contraste explicite entre l’allongement du jour et le raccourcissement de la nuit.
- source_word: ሰብዓተ ክፍለ
  choice: sept parts
  rationale: Préserve la mesure technique et le total complémentaire aux onze parts du jour.
