base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: fr
  text: Et d’abord paraît une grande lumière, dont le nom est le soleil. Son disque[a] est comme le disque du ciel, et le soleil est entièrement rempli d’un feu qui éclaire et chauffe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son orbe » ou « son cercle » ; le terme guèze peut désigner une forme ronde ou un circuit.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui éclaire et brûle » ; le second verbe peut exprimer l’action de chauffer ou de brûler.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳማዊ
  choice: d’abord
  rationale: L’adverbe français garde la séquence indiquée par l’ordinal tout en laissant « une grande lumière » comme sujet du verbe, conformément à la syntaxe probable.
- source_word: ይወፅእ
  choice: paraît
  rationale: Dans cette description astronomique, « paraît » exprime naturellement la venue visible de l’astre; « sort » ou « surgit » seraient également possibles.
- source_word: ብርሃን ዓቢይ
  choice: une grande lumière
  rationale: Rend directement l’expression guèze et conserve l’imagerie cosmique sans introduire le terme plus technique « luminaire ».
- source_word: ዘስሙ ፀሐይ
  choice: dont le nom est le soleil
  rationale: Préserve la formule de dénomination du texte plutôt que de la réduire à « appelé soleil ».
- source_word: ክበቡ
  choice: son disque
  rationale: Dans le contexte du soleil visible, « disque » rend concrètement la forme ronde désignée par le terme, tout en laissant les autres sens possibles en note.
- source_word: ከመ ክበበ ሰማይ
  choice: comme le cercle du ciel
  rationale: « Cercle » convient mieux que la répétition française « disque du ciel » et conserve l’image cosmique du texte.
- source_word: ኵሉ ምሉእ
  choice: entièrement rempli
  rationale: La formulation restitue l’insistance sur la totalité sans lourdeur excessive.
- source_word: እሳት
  choice: feu
  rationale: Conserve l’image élémentaire et apocalyptique sans l’atténuer en « chaleur » ou « flamme ».
- source_word: ዘያበርህ ወያውዒ
  choice: qui éclaire et chauffe
  rationale: Rend naturellement les deux actions attribuées au feu. Une traduction plus littérale peut comprendre le second verbe comme « brûle ».
theological_decisions:
- issue: Nature de la description du soleil
  choice: Présenter le soleil comme une grande lumière au nom explicitement donné, sans lui attribuer un statut divin.
  alternative: Accentuer la personnification du soleil à partir de la formule de dénomination.
  rationale: Le langage visionnaire et cosmique peut personnifier l’astre, mais le verset n’exige pas qu’on en fasse une divinité. La traduction conserve l’imagerie sans la rationaliser ni la mythologiser davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour une lecture naturelle, tout en conservant l’enchaînement descriptif. « Paraît » convient au mouvement apparent de l’astre; « cercle du ciel » préserve l’étrangeté de l’image sans produire la formulation peu idiomatique « disque du ciel ».
