base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: fr
  text: 'Le livre des parcours des luminaires du ciel : comment ils sont[a], selon leurs compagnies[b], selon leur autorité et leurs temps fixés, selon leurs noms, leurs origines[c] et leurs voies. Uriel, l’ange saint qui était avec moi et qui les guide, me montra tout cela, ainsi que le récit complet qui les concerne. Il me montra ce qu’il en est de chaque année du monde, et ainsi pour toujours, jusqu’à ce qu’une œuvre nouvelle[d] soit accomplie, une œuvre qui subsistera pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comment ils se meuvent ». Dans ce contexte, l’expression peut décrire soit leur état et leur organisation, soit leur mouvement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon leurs peuples » ou « selon leurs assemblées » ; cette image désigne ici les groupements de luminaires.'
    reason: lexical_alternative
  - marker: c
    text: Le mot signifie aussi « naissances » et peut, dans un contexte astronomique, évoquer leurs levers ou leurs points d’apparition.
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « une création nouvelle ». Le texte ne précise pas s’il s’agit d’une nouvelle création ou d’un renouvellement durable de l’ordre du monde.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  choice: Le livre des parcours des luminaires du ciel
  rationale: « Livre » marque le titre de cette section; « parcours » exprime les mouvements réguliers des astres sans introduire le concept moderne d’orbite; « luminaires » conserve le registre cosmologique élevé.
- source_word: ሀለዉ
  choice: ils se meuvent
  rationale: Dans ce contexte astronomique, le verbe décrit vraisemblablement la manière dont évoluent les luminaires. La note maintient possible le sens plus statique « ils sont ».
- source_word: በበሕዝቢሆሙ
  choice: chacun selon sa compagnie
  rationale: Le nom signifie littéralement « peuple » ou « assemblée ». « Compagnie » conserve la métaphore collective appliquée aux corps célestes, contrairement à un terme purement taxonomique comme « classe ».
- source_word: ሥልጣኖሙ
  choice: leur autorité
  rationale: Le terme désigne le pouvoir ou l’autorité assignée aux luminaires. « Autorité » est idiomatique en français tout en gardant la personnification du texte.
- source_word: ዘመኖሙ
  choice: leurs temps fixés
  rationale: Le mot peut désigner des temps, périodes ou saisons. « Temps fixés » met en valeur l’organisation calendaire sans limiter le sens aux quatre saisons.
- source_word: ሙላዳቲሆሙ
  choice: leurs origines
  rationale: Le sens premier est « naissances » ou « origines »; dans ce cadre astronomique, il peut aussi évoquer les levers des astres. « Origines » préserve cette ouverture.
- source_word: አውራኂሆሙ
  choice: leurs voies
  rationale: Le terme désigne des chemins ou des voies. « Voies » convient aux trajectoires célestes et évite l’anachronisme « orbites ».
- source_word: ኵሎ መጽሐፎሙ
  choice: le récit complet qui les concerne
  rationale: Le substantif est singulier, littéralement « tout leur livre ». Cette formulation française respecte le singulier et exprime naturellement l’idée d’un relevé complet relatif aux luminaires.
- source_word: ግብር ኃዲስ
  choice: une œuvre nouvelle
  rationale: Traduction proche du lexique guèze, qui laisse ouverte la question de savoir s’il s’agit d’une nouvelle création ou d’un nouvel ordre cosmique.
theological_decisions:
- issue: Portée eschatologique de ግብር ኃዲስ
  choice: une œuvre nouvelle
  alternative: une création nouvelle
  rationale: « Œuvre nouvelle » conserve le terme source et son indétermination. Traduire directement par « création nouvelle » préciserait plus que le guèze la nature de l’acte futur.
- issue: Durée du nouvel acte
  choice: une œuvre qui subsistera pour toujours
  alternative: une œuvre qui demeurera jusque dans l’éternité
  rationale: La formulation affirme la permanence de l’œuvre sans expliquer son rapport exact aux cycles cosmiques précédemment décrits.
translation_notes:
  register: Français international moderne, digne et lisible. La longue phrase du guèze est répartie en plusieurs phrases pour en clarifier la structure, tout en conservant l’enchaînement du catalogue astronomique. Les termes « luminaires », « autorité » et « œuvre nouvelle » maintiennent le registre apocalyptique sans ajouter de terminologie confessionnelle.
