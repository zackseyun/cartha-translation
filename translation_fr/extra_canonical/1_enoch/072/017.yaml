  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: fr
  text: Et le soleil sort de l’ouest par cette sixième porte, se dirige vers l’est et se lève par la cinquième porte pendant trente matins[a] ; puis il se couche de nouveau à l’ouest par la cinquième porte occidentale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « trente matins ». L’expression peut servir à compter des jours, mais la formulation du texte guèze est conservée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ
  choice: Et le soleil sort
  rationale: Le verbe exprime l’action de sortir ou d’émerger. « sort » convient au mouvement du soleil à travers les portes célestes sans ajouter de nuance absente du texte.
- source_word: እምነ፡ ምዕራብ
  choice: de l’ouest
  rationale: La préposition signifie simplement « de, depuis ». La traduction n’ajoute pas « de là », qui n’a pas de correspondant dans le texte guèze.
- source_word: እምይእቲ፡ ሳድስት፡ ኆኅት
  choice: par cette sixième porte
  rationale: « porte » conserve l’image cosmologique technique du chapitre. En français, « par » exprime naturellement le passage associé à la sortie, tandis que « cette » rend la valeur démonstrative.
- source_word: ወየሐውር፡ ምሥራቀ
  choice: se dirige vers l’est
  rationale: Cette formulation rend le mouvement vers l’est dans un français actuel, sans préciser davantage la nature de ce déplacement.
- source_word: ወይሠርቅ
  choice: se lève
  rationale: Dans ce contexte solaire, le verbe désigne naturellement le lever du soleil.
- source_word: በኃምስት፡ ኆኅት
  choice: par la cinquième porte
  rationale: La préposition guèze admet une valeur locative ou instrumentale. « par » est naturel pour le mouvement du soleil à travers une porte et maintient l’image du texte.
- source_word: ሠላሳ፡ ጽባሐ
  choice: pendant trente matins
  rationale: Le texte dit littéralement « trente matins ». Cette expression est conservée plutôt que normalisée en « trente jours ».
- source_word: ወየዓርብ፡ ... ካዕበ
  choice: puis il se couche de nouveau
  rationale: Dans le parallélisme avec le lever du soleil, le verbe désigne son coucher ; ካዕበ marque la répétition ou le retour de l’action.
- source_word: ኃምስተ፡ ኆኅተ፡ እንተ፡ ምዕራብ
  choice: par la cinquième porte occidentale
  rationale: La formulation garde explicitement la symétrie entre les portes orientales et occidentales du schéma cosmologique.
theological_decisions:
- issue: Image cosmologique des portes célestes
  choice: Conserver le terme concret « porte » pour décrire le mouvement du soleil.
  alternative: Remplacer l’image par « ouverture », « horizon » ou une description astronomique modernisée.
  rationale: Le passage présente une cosmologie visionnaire structurée par des portes. Maintenir cette image respecte le texte sans tenter de l’harmoniser avec une conception astronomique moderne.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le caractère séquentiel de la description astronomique et son vocabulaire imagé, tout en évitant les archaïsmes. Le point-virgule distingue le mouvement vers le lever du retour au coucher.
