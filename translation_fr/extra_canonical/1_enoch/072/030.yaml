base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: fr
  text: 'Ce jour-là, la nuit raccourcit[a] : elle compte dix parts[b], et le jour, huit parts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Livre astronomique divise schématiquement le jour et la nuit en « parts » numérotées afin de décrire les variations saisonnières; il ne s’agit pas d’heures au sens moderne.
    reason: cultural_note
  - marker: b
    text: 'Le texte guèze transcrit porte « douze parts ». La traduction retient « dix parts », correction suggérée par le système constant de dix-huit parts et par la progression astronomique du passage : dix parts de nuit et huit parts de jour.'
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Ce jour-là
  rationale: Rend naturellement en français la locution temporelle démonstrative guèze, tout en conservant sa valeur déictique.
- source_word: ተኃጽጸ፡ ሌሊት፡ እምኑኃ
  choice: la nuit diminue en longueur
  rationale: Le verbe exprime une réduction, et እምኑኃ renvoie à la longueur ou à l'étendue de la nuit. Cette formulation convient au contexte astronomique sans suggérer des heures modernes.
- source_word: ትከውን፡ ሌሊት፡ ፲ወ፪ተ፡ ክፍለ
  choice: elle compte dix parts
  rationale: '« Compter » exprime naturellement la mesure résultante. Bien que la transcription fournie porte littéralement le nombre douze, la leçon « dix » est retenue comme correction textuelle contextuelle : avec les huit parts du jour, elle maintient le total schématique de dix-huit parts et correspond à la progression du passage.'
- source_word: ማዓልት፡ ፰ክፍለ
  choice: et le jour, huit parts
  rationale: La construction elliptique conserve le parallélisme compact de l'énumération guèze; la copule « compte » reste sous-entendue en français.
