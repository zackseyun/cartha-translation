base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/014.yaml
  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: fr
  text: Ce jour-là, le jour devient plus long que la nuit et atteint le double de la nuit ; le jour compte douze parts, tandis que la nuit raccourcit et n’en compte plus que six.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verset emploie le système schématique du chapitre, qui répartit le jour et la nuit en « parts ». Le jour compte ici douze parts et la nuit six : il est donc deux fois aussi long qu’elle.'
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Ce jour-là
  rationale: Rend naturellement la formule temporelle qui introduit une nouvelle étape du cycle astronomique.
- source_word: ትነውኅ፡ ዕለት፡ እምሌሊት
  choice: le jour devient plus long que la nuit
  rationale: Conserve le sens comparatif et le mouvement d’allongement exprimé par le verbe.
- source_word: ዕፅበተ፡ ሌሊት (lecture corrigée de ፱ዕበተ፡ ሌሊት)
  choice: atteint le double de la nuit
  rationale: La lecture corrigée signifie « double » ; elle concorde avec les douze parts du jour et les six parts de la nuit. « Atteint » exprime idiomatiquement le rapport de durée sans faire du jour lui-même « deux nuits ».
- source_word: ክፍለ፡ ፲ወ፪
  choice: compte douze parts
  rationale: « Part » garde le vocabulaire schématique de division du temps employé dans le chapitre ; « compte » donne une formulation française claire.
- source_word: ትኃጽር፡ ሌሊት
  choice: la nuit raccourcit
  rationale: Rend directement le processus inverse de l’allongement du jour.
- source_word: ስድስተ፡ ክፍል
  choice: n’en compte plus que six
  rationale: Conserve le nombre et l’unité implicite tout en évitant une répétition lourde ; le pronom « en » renvoie sans ambiguïté aux parts.
theological_decisions:
- issue: Faut-il moderniser le verset en une simple indication de durée ?
  choice: Conserver le système ancien des « parts » et le rapport du double
  alternative: 'Paraphraser : « le jour dure deux fois plus longtemps que la nuit »'
  rationale: Le langage répétitif et proportionnel appartient au cadre astronomique schématique du Livre des luminaires. Le maintenir évite d’effacer la forme conceptuelle du texte.
- issue: Lecture du groupe transcrit ፱ዕበተ
  choice: Retenir la lecture corrigée ዕፅበተ, « double »
  alternative: Traduire la transcription telle quelle par « neuf parts de la nuit »
  rationale: La confusion graphique entre ፅ et le chiffre ፱ explique la transcription fautive ; le rapport douze à six donné dans le même verset confirme « double ».
translation_notes:
  register: Français international moderne, clair et digne. La répétition de l’original est légèrement allégée, mais son calcul proportionnel et son vocabulaire technique sont préservés. Le point-virgule rend lisible la succession des deux mesures.
