base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: fr
  text: Et dans cette quatrième porte, par laquelle le soleil sort durant le premier mois, il y a douze fenêtres ouvertes[a], d’où sort une flamme lorsqu’elles sont ouvertes au moment qui leur est fixé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Livre astronomique représente le ciel comme pourvu de portes et de fenêtres par lesquelles les luminaires et la chaleur ardente sortent à des temps déterminés.
    reason: cultural_note
lexical_decisions:
- source_word: ኆኅት ራብዕት
  choice: quatrième porte
  rationale: « Porte » conserve l’image architecturale récurrente du Livre astronomique, où les luminaires passent par des portes célestes.
- source_word: ይወፅእ ፀሐይ
  choice: le soleil sort
  rationale: 'Cette formulation naturelle en français garde le mouvement concret exprimé par le verbe guèze : sortir, aller au-dehors.'
- source_word: በወርኅ ቀዳማዊ
  choice: au premier mois
  rationale: Rend directement l’indication temporelle et convient au contexte calendaire.
- source_word: ባቲ ፲፪ መስኮተ መላክወ ርኅዋተ
  choice: il y a douze fenêtres ouvertes
  rationale: La forme transcrite መላክወ paraît être une erreur d’OCR pour መሳክወ, « fenêtres »; avec ርኅዋተ, l’expression décrit des fenêtres ouvertes. Cette lecture évite d’introduire à tort une domination du vent ou des anges.
- source_word: ዘእምኔሆን ይወፅእ ላህብ
  choice: d’où sort une flamme
  rationale: Le relatif indique la provenance (« desquelles »), et ላህብ désigne une flamme ou un embrasement; la traduction conserve l’image physique.
- source_word: ሶበ ይትረሐዉ እምዘመነ ዚአሆሙ
  choice: quand elles sont ouvertes aux temps qui leur sont assignés
  rationale: Le passif est conservé sans préciser l’agent, tandis que la mention des temps assignés souligne l’ordre réglé du cosmos.
theological_decisions:
- issue: Faut-il comprendre la forme OCR መላክወ comme une allusion aux anges ou à une domination du vent ?
  choice: La traiter comme une corruption de መሳክወ et traduire simplement « fenêtres ouvertes ».
  alternative: « de la domination du vent » ou « des anges des vents »
  rationale: La correction paléographique et le contexte immédiat soutiennent nettement le sens « fenêtres ouvertes ». Une lecture angélique ajouterait ici une notion que le texte rétabli n’exprime pas.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du texte guèze tout en étant naturelle; l’agent de l’ouverture n’est pas précisé, conformément au passif de la source.
