base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: fr
  text: Lorsque le soleil se lève, il sort du ciel par cette quatrième porte pendant trente matins[a] ; et il descend en droite ligne[b] par la quatrième porte située à l’ouest du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant trente jours ». Le guèze dit littéralement « trente matins », unité de temps employée dans cette séquence astronomique.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « directement » ou « avec exactitude ». Elle décrit vraisemblablement la régularité ou la précision de la trajectoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: se lève
  rationale: Avec le soleil pour sujet, le verbe désigne ici son lever plutôt qu’un simple rayonnement.
- source_word: እምሰማየ ይወፅእ
  choice: il sort du ciel
  rationale: Cette formulation conserve la préposition « de, hors de » et le mouvement concret de sortie associé aux portes célestes.
- source_word: ኆኅት
  choice: porte
  rationale: Le livre astronomique décrit de manière suivie les ouvertures célestes comme des portes ; ce terme maintient cette architecture cosmique.
- source_word: ራብዕት
  choice: quatrième
  rationale: L’ordinal est rendu littéralement afin de préserver la séquence des portes solaires.
- source_word: ሠላሳ ጽባሐ
  choice: pendant trente matins
  rationale: Le guèze dit littéralement « trente matins ». Le contexte indique une durée de trente jours, mais la formulation concrète du texte est conservée.
- source_word: ምዕራበ ሰማይ
  choice: à l’ouest du ciel
  rationale: Traduction directe et naturelle de l’expression cosmologique spatiale.
- source_word: ርቱዐ
  choice: en droite ligne
  rationale: Ce rendu exprime la rectitude ou la précision spatiale sans introduire le sens temporel d’« immédiatement ».
- source_word: ይወርድ
  choice: il descend
  rationale: Le verbe signifie littéralement « descendre ». Ce choix préserve le mouvement cosmologique au lieu de le remplacer par l’expression courante « se coucher ».
theological_decisions:
- issue: L’image cosmologique des portes célestes
  choice: Conserver les portes célestes ainsi que les mouvements de sortie et de descente.
  alternative: Réduire le passage à une description phénoménologique ordinaire du lever et du coucher du soleil.
  rationale: Le Livre astronomique présente une cosmologie visionnaire structurée. La traduction ne doit pas effacer cette imagerie.
- issue: Valeur spatiale de ርቱዐ
  choice: « en droite ligne », avec une note signalant la nuance de précision.
  alternative: « exactement » ou « directement ».
  rationale: Le mot peut exprimer la rectitude, la conformité ou l’exactitude. Le texte principal privilégie ici la dimension spatiale tout en laissant la nuance ouverte en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement réorganisée pour être naturelle en français, sans atténuer l’imagerie cosmologique ni remplacer les verbes de mouvement par les termes usuels du lever et du coucher du soleil.
