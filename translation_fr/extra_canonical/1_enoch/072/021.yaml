base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: fr
  text: Et le soleil sort par cette porte, se couche à l’ouest, retourne à l’est, puis sort par la troisième porte pendant trente matins[a] et se couche à l’ouest, à la troisième porte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trente matins »; cette manière de compter correspond aux trente jours durant lesquels le soleil emprunte cette porte.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ወይወፅእ
  choice: et … sort
  rationale: Le verbe exprime le mouvement de sortir ou d’émerger. « Sort » est naturel en français et conserve la répétition concrète du mouvement solaire.
- source_word: ፀሐይ
  choice: le soleil
  rationale: Référent astronomique direct, sans ajout de personnification.
- source_word: እምይእቲ ኆኅት
  choice: par cette porte
  rationale: ኆኅት désigne ici une porte ou ouverture de passage, distincte de la fenêtre dans l’architecture cosmologique du Livre astronomique. Avec un verbe de sortie, le français idiomatique emploie « par ».
- source_word: ያዓርብ በምዕራብ
  choice: se couche à l’ouest
  rationale: Dans le contexte de la course du soleil, « se couche » rend naturellement le sens astronomique du verbe, tandis que « à l’ouest » conserve l’indication spatiale.
- source_word: ወይገብእ በጽባሕ
  choice: retourne à l’est
  rationale: Le verbe peut signifier entrer ou retourner. Ici, le mouvement cyclique après le coucher favorise « retourne ». ጽባሕ peut désigner le matin ou, par extension spatiale, l’est; son parallélisme avec ምዕራብ, « l’ouest », favorise nettement « à l’est ».
- source_word: በሣልስት ኆኅት
  choice: par la troisième porte / à la troisième porte
  rationale: 'La préposition est rendue selon le verbe régissant : « par » pour la sortie et « à » pour le coucher. « Porte » préserve l’architecture cosmologique précise du passage.'
- source_word: ሠላሳ ጸባሐ
  choice: pendant trente matins
  rationale: Le texte compte littéralement « trente matins ». Cette formulation est conservée plutôt que normalisée en « trente jours ».
theological_decisions:
- issue: Terme cosmologique ኆኅት dans le Livre astronomique
  choice: porte
  alternative: fenêtre
  rationale: Le passage décrit des ouvertures fixes empruntées par le soleil. « Porte » correspond au terme guèze et maintient la distinction cosmologique avec les fenêtres, désignées ailleurs par un autre mot.
- issue: Sens de ጽባሕ dans la paire spatiale avec l’ouest
  choice: l’est
  alternative: le matin
  rationale: Bien que le mot puisse signifier « matin », son opposition structurée à « l’ouest » dans la description du trajet solaire indique ici le lieu du matin, c’est-à-dire l’est. L’autre sens demeure visible dans l’expression distincte « trente matins ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe suit clairement la succession des mouvements du soleil. « Porte » préserve l’imagerie cosmologique propre au texte; « pendant trente matins » garde la formulation concrète du guèze tout en restant intelligible.
