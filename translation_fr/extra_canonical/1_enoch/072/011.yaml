base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: fr
  text: Le soleil sort de cette quatrième porte et se couche par la quatrième porte. Puis il retourne à la cinquième porte, celle de l’est, pendant trente matins[a] ; ensuite, il en sort et se couche par la cinquième porte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « trente matins ». Cette manière de compter le temps est caractéristique de cette section ; certaines traductions lissent l’expression en « trente jours ».
    reason: lexical_alternative
  - marker: b
    text: Le texte répète ici « la cinquième porte ». Sa formulation concise peut résumer la poursuite du parcours du soleil après les trente matins, sans nécessairement décrire en détail un déplacement supplémentaire distinct.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ
  choice: Le soleil sort
  rationale: Le verbe exprime littéralement la sortie. Dans ce contexte, il décrit l’apparition du soleil à une porte, sans remplacer l’image cosmologique par le seul verbe « se lever ».
- source_word: እምዘክቱ፡ ራብዕ፡ ኆኅት
  choice: de cette quatrième porte
  rationale: Le démonstratif renvoie à la porte déjà évoquée. « Porte » conserve l’image technique et cosmologique du passage.
- source_word: ወየዓርብ፡ በራብዕት
  choice: et se couche par la quatrième porte
  rationale: Dans le parcours quotidien du soleil, le verbe désigne son coucher. La préposition peut décrire la porte où ou par laquelle il se couche ; « par » rend naturellement le mouvement associé aux portes.
- source_word: ወይገብእ
  choice: Puis il retourne
  rationale: Le verbe ገብአ signifie revenir ou retourner, et non simplement entrer. Ici, il décrit le retour du soleil vers la porte orientale après son coucher.
- source_word: ውስተ፡ ኃምስ፡ ኆኅት፡ እንተ፡ ጽባሕ
  choice: à la cinquième porte, celle de l’est
  rationale: L’expression qualifie explicitement la cinquième porte comme orientale. « Celle de l’est » préserve ce repère directionnel sans alourdir la phrase.
- source_word: ሠላሳ፡ ጽባሐ
  choice: pendant trente matins
  rationale: Le texte compte cette période en « matins », formulation caractéristique de cette section qu’il convient de conserver plutôt que de l’aplanir en « jours ».
- source_word: ወይወፅእ፡ እምኔሃ
  choice: ensuite, il en sort
  rationale: Le pronom féminin renvoie à la porte. « En sort » est idiomatique en français et conserve le mouvement répété.
- source_word: ወየዓርብ፡ ውስተ፡ ኃምስት፡ ኆኅት
  choice: et se couche par la cinquième porte
  rationale: La répétition de la cinquième porte appartient à la formulation concise du texte et doit être conservée.
theological_decisions:
- issue: Faut-il moderniser ou démythologiser la cosmologie du passage ?
  choice: Conserver les portes ainsi que les mouvements de sortie, de retour et de coucher du soleil.
  alternative: Paraphraser les portes comme des secteurs, positions ou phases astronomiques.
  rationale: Le passage présente son propre schéma cosmologique et apocalyptique. Une traduction ne doit ni le convertir en astronomie moderne ni atténuer son imagerie.
- issue: Comment comprendre la dernière mention de la cinquième porte ?
  choice: Maintenir la répétition sans préciser davantage le rapport chronologique.
  alternative: L’expliquer dans le corps du texte comme un nouveau déplacement distinct après les trente matins.
  rationale: La syntaxe est brève et peut résumer la poursuite du parcours solaire plutôt que détailler un mouvement supplémentaire ; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire concret de la cosmologie (« porte », « sort », « retourne », « se couche ») est conservé. La coordination du guèze est légèrement structurée par « Puis » et « ensuite » afin d’assurer une lecture naturelle sans résoudre les ambiguïtés du déroulement.
