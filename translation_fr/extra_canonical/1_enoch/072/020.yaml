base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: fr
  text: Ce jour-là, le jour devient égal à la nuit [et il devient égal][a] ; la nuit est de neuf parties, et le jour également de neuf parties[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le membre de phrase « et il devient égal » est placé entre crochets dans le témoin source : il pourrait s’agir d’un ajout textuel ou d’une leçon incertaine. Il est conservé ici de manière transparente.'
    reason: textual_variant
  - marker: b
    text: Les « parties » sont des divisions schématiques employées dans les descriptions calendaires du Livre des luminaires, et non des heures au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Ce jour-là
  rationale: Expression temporelle démonstrative naturelle en français, qui conserve le cadre d’une observation calendaire précise.
- source_word: ይትዓረይ፡ መዓልት፡ ምስለ፡ ሌሊት
  choice: le jour devient égal à la nuit
  rationale: Le verbe exprime l’accès à l’égalité ou la mise en équilibre. « Devient égal à » rend directement la comparaison astronomique sans la transformer en interprétation symbolique.
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[et il devient égal]'
  rationale: Le membre de phrase est entre crochets dans le témoin source et reste donc entre crochets dans la traduction. La répétition, même peu élégante, est conservée afin de ne pas masquer l’incertitude textuelle.
- source_word: ተስዓተ፡ ክፍለ
  choice: neuf parts
  rationale: « Parts » conserve le vocabulaire technique des divisions schématiques du jour et de la nuit dans le Livre des luminaires.
- source_word: ወትከውን፡ ሌሊት ... ወመዓልትኒ
  choice: la nuit devient ... et le jour également
  rationale: « Devient » maintient la valeur ordinaire de ኮነ ainsi que la formulation technique récurrente du chapitre; « également » rend la correspondance marquée pour le jour.
theological_decisions:
- issue: Nature de l’égalité entre le jour et la nuit
  choice: Description calendaire d’une égalité schématique entre la durée du jour et celle de la nuit
  alternative: Image figurée d’une harmonie cosmique
  rationale: Le contexte immédiat du Livre des luminaires est astronomique et calendaire. La traduction conserve donc ce registre sans spiritualiser l’égalité décrite.
translation_notes:
  register: Français international moderne, sobre et technique. La répétition du mot « égal » et la tournure inhabituelle « devient neuf parts » sont maintenues pour refléter la formulation et la cohérence terminologique du texte guèze, tandis que la ponctuation clarifie les deux propositions parallèles.
