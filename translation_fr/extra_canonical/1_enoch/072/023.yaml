base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: fr
  text: Le soleil sort par cette troisième porte et se couche par la troisième porte, à l’ouest. Il retourne à l’est et sort par la deuxième porte, à l’est, pendant trente matins[a] ; de même, il se couche par la deuxième porte, à l’ouest du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « trente matins ». L’expression indique vraisemblablement une période de trente jours dans la course du soleil, mais le texte principal conserve la formulation de la source.
    reason: Précision lexicale sur une expression temporelle concrète.
lexical_decisions:
- source_word: ይወፅእ
  choice: sort
  rationale: Le verbe exprime le fait de sortir ou de se présenter au-dehors. « Sort » convient naturellement au mouvement répété du soleil à travers les portes célestes.
- source_word: ፀሐይ
  choice: le soleil
  rationale: Référent astronomique direct, sans ajout de personnification.
- source_word: ሣልስት ኆኅት
  choice: troisième porte
  rationale: « Porte » conserve l’image cosmologique concrète et le rang ordinal du système décrit.
- source_word: ያዓርብ
  choice: se couche
  rationale: Dans le contexte de la course quotidienne du soleil, cette expression française rend naturellement son mouvement vers le soir et l’ouest.
- source_word: በዐረብ
  choice: à l’ouest
  rationale: La locution a ici une valeur spatiale, en parallèle avec l’est.
- source_word: ይገብእ
  choice: retourne
  rationale: Le verbe peut signifier « entrer », mais la séquence décrit le retour cyclique du soleil vers l’est après son coucher.
- source_word: ካልእ ኆኅት
  choice: deuxième porte
  rationale: Dans la série ordonnée des portes solaires, le terme désigne la deuxième porte plutôt qu’une porte quelconque.
- source_word: ሠላሳ ጸባሐ
  choice: trente matins
  rationale: La traduction maintient le comptage concret du texte, sans le normaliser en « trente jours ».
- source_word: በምዕረበ ሰማይ
  choice: à l’ouest du ciel
  rationale: Cette formulation conserve l’orientation spatiale et le cadre cosmologique céleste du passage.
theological_decisions:
- issue: Image cosmologique des portes solaires
  choice: Conserver les portes célestes et les déplacements directionnels tels qu’ils sont décrits
  alternative: Parler simplement des points de lever et de coucher du soleil à l’horizon
  rationale: Le passage présente une cosmologie céleste structurée. La traduction n’aplatit pas cette image apocalyptique en terminologie astronomique moderne.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « porte » et les indications d’est et d’ouest sont maintenues, car elles structurent la description. « Par » rend idiomatiquement le passage du soleil à travers les portes sans effacer l’image concrète.
