base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: fr
  text: Et ce jour-là, la nuit diminue d’un neuvième de sa durée[a], c’est-à-dire d’une part, et la nuit est alors de onze parts[b], tandis que le jour en compte sept.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien est difficile à cet endroit, notamment dans l’expression numérique. Le sens retenu est que la nuit perd un neuvième de sa durée, cette fraction correspondant à une part dans le système de division employé ici.
    reason: textual_variant
  - marker: b
    text: La formulation numérique éthiopienne peut se comprendre littéralement comme « douze moins une part », soit onze parts.
    reason: translation_clarity
lexical_decisions:
- source_word: ኀፀፀት
  choice: diminue
  rationale: Le verbe exprime une diminution ou un raccourcissement; « diminue » convient naturellement à la durée mesurée de la nuit.
- source_word: ሌሊት
  choice: la nuit
  rationale: Équivalent direct du temps nocturne mesuré dans ce schéma astronomique.
- source_word: እምኑኃ
  choice: de sa durée
  rationale: La forme se comprend comme « de sa longueur/durée », avec le suffixe féminin renvoyant à la nuit, et non comme le nombre neuf.
- source_word: ታስዕተ እደ
  choice: d’un neuvième
  rationale: La locution indique la fraction retranchée à la durée de la nuit; le contexte précise qu’elle correspond ici à une part.
- source_word: ክፍለ አሐደ
  choice: une part
  rationale: « Part » conserve le système technique de divisions numériques employé dans le Livre astronomique.
- source_word: ወኮነት
  choice: et ... devient longue de
  rationale: Le verbe marque l’état résultant; l’ajout idiomatique « longue de » rend clairement en français la mesure de la nuit.
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: onze parts
  rationale: Dans la formule astronomique, la séquence numérique désigne le résultat de onze parts, soit douze moins une.
- source_word: መዓልት
  choice: le jour
  rationale: Désigne la période diurne, en parallèle avec la nuit.
- source_word: ሰብዓተ ክፍለ
  choice: sept parts
  rationale: Maintient la division numérique technique du jour.
theological_decisions:
- issue: Rendu du système de division astronomique
  choice: Conserver le terme technique « parts »
  alternative: Employer « heures » ou expliciter en proportions de jour et de nuit
  rationale: Le passage décrit une cosmologie schématique qui répartit le jour et la nuit en parts. « Parts » préserve cet idiome ancien sans lui imposer le système moderne des heures.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le vocabulaire technique des « parts », tout en ajoutant « longue de » et « en compte » pour rendre la relation de mesure naturelle en français.
