base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: fr
  text: Les chars par lesquels il monte sont poussés par le vent[a]. Le soleil descend du ciel et revient par le nord afin de gagner l’est ; il est conduit de manière à entrer par la porte et à briller sur la face du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze est difficile ; elle peut aussi évoquer plus littéralement « le vent de l’ascension » ou « le vent qui monte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰረገላት
  choice: les chars
  rationale: Le pluriel désigne des véhicules ou chars. « Chars » conserve l’imagerie cosmique concrète du passage.
- source_word: የዓርግ ነፋስ ይነፍኅ
  choice: sont poussés par le vent
  rationale: La construction est difficile, mais le contexte décrit le mouvement ascendant du soleil au moyen des chars. Cette formulation française reste intelligible tout en signalant en note la possibilité plus littérale d’un « vent de l’ascension ».
- source_word: የዓርብ ፀሐይ
  choice: le soleil descend
  rationale: Le verbe exprime la descente ou le coucher. « Descend » préserve ici le mouvement spatial décrit par la cosmologie du texte.
- source_word: እምሰማይ
  choice: du ciel
  rationale: En français, « ciel » convient à la fois à l’étendue visible et à la sphère céleste, sans imposer une distinction absente du terme guèze.
- source_word: ወይገብእ እንተ መስዕ
  choice: et revient par le nord
  rationale: Dans la succession des déplacements solaires, le verbe est compris au sens de retour, et la mention du nord indique l’itinéraire emprunté.
- source_word: ከመ ይሑር ምሥራቀ
  choice: afin de gagner l’est
  rationale: La proposition marque le but du déplacement. « Gagner l’est » est naturel en français et conserve l’orientation spatiale.
- source_word: ወይትመራኅ
  choice: il est conduit
  rationale: Le passif présente la course du soleil comme dirigée ou ordonnée, sans préciser l’agent.
- source_word: ኆኅተ
  choice: la porte
  rationale: La forme est un singulier à l’accusatif. « Porte » préserve le vocabulaire architectural caractéristique de la cosmologie du Livre astronomique.
- source_word: ያበርህ በገጸ ሰማይ
  choice: briller sur la face du ciel
  rationale: Cette traduction conserve l’image sémitique de la « face du ciel » ainsi que la valeur ordinaire de la préposition.
theological_decisions:
- issue: La course du soleil est exprimée au passif
  choice: Conserver « il est conduit » sans nommer l’agent
  alternative: « il suit sa route » ou « Dieu le conduit »
  rationale: Le texte indique une direction imposée, mais ne nomme pas explicitement celui qui conduit le soleil. La traduction préserve cette retenue et n’ajoute aucune identification doctrinale.
- issue: Sens cosmologique de ሰማይ
  choice: Employer « ciel » dans les deux occurrences
  alternative: Alterner entre « ciel » et « firmament »
  rationale: Le français « ciel » couvre naturellement les dimensions visible et céleste du terme source. « Firmament » introduirait une précision cosmologique qui n’est pas lexicalement nécessaire ici.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase a été divisée en deux pour faciliter la lecture, tout en maintenant la succession des mouvements. L’image des chars, la porte céleste au singulier et la « face du ciel » sont conservées.
