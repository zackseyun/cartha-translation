base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: fr
  text: Ce jour-là, la nuit dépasse le jour, et elle s’allonge de nuit en nuit, tandis que le jour raccourcit de jour en jour, jusqu’à trente matins[a]. La nuit atteint alors exactement[b] dix parts, et le jour, huit parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « jusqu’à trente matins ». Il peut s’agir d’un compte de trente matins successifs, possiblement trente jours dans le cycle saisonnier.
    reason: cultural_note
  - marker: b
    text: Ou « pleinement ». Le terme guèze qualifie les dix parts comme une mesure exacte ou complète.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: Ce jour-là
  rationale: Rend naturellement la formule temporelle qui situe cette étape dans la séquence astronomique.
- source_word: ትነሡኅ ሌሊት እምዕለት
  choice: la nuit dépasse le jour
  rationale: Le contexte indique ici une comparaison de durée; « dépasse » exprime clairement que la nuit devient plus longue que le jour.
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: elle s’allonge de nuit en nuit
  rationale: La répétition du nom avec እም exprime une progression successive. « S’allonge » convient au contexte de la durée nocturne.
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: le jour raccourcit de jour en jour
  rationale: Préserve le parallélisme et la progression exprimée par la construction répétée.
- source_word: እስከ ሠላሳ ጸባሕ
  choice: jusqu’à trente matins
  rationale: Conserve le décompte concret en « matins » ou « aurores » au lieu de le normaliser en jours.
- source_word: ጥንቁቀ
  choice: exactement
  rationale: Le terme qualifie vraisemblablement la mesure comme exacte ou complète; « exactement » restitue la précision technique tout en signalant l’incertitude en note.
- source_word: ዐሠርተ ክፍለ / ስመንተ ክፍለ
  choice: dix parts / huit parts
  rationale: « Parts » maintient le système de mesure schématique du texte sans le convertir abusivement en heures modernes.
theological_decisions:
- issue: Mesure astronomique du jour et de la nuit
  choice: Conserver les « parts » employées par le texte.
  alternative: Convertir les mesures en heures ou résumer en disant seulement que les nuits s’allongent et les jours raccourcissent.
  rationale: Le passage présente un schéma cosmologique et mathématique propre au Livre astronomique. Garder ses unités respecte cette représentation sans lui imposer un système horaire moderne.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme de la progression nocturne et diurne est conservé, ainsi que le vocabulaire technique des « parts ». Les formulations trop littérales qui obscurciraient l’idiome progressif ont été évitées.
