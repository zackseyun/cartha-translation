base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: fr
  text: Ainsi, au premier mois, il sort par la grande porte, qui est la quatrième des six portes tournées vers le lever du soleil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « des six portes tournées vers le lever du soleil » est placée entre crochets dans le témoin fourni. Il peut s’agir d’une précision ajoutée ou d’un passage dont le texte est incertain; elle correspond néanmoins à la description répétée des six portes orientales dans ce chapitre.
    reason: textual_variant
lexical_decisions:
- source_word: ከመዝ
  choice: Ainsi
  rationale: Rend le connecteur de manière et de progression avec naturel, sans alourdir la phrase.
- source_word: ይወፅእ
  choice: il sort
  rationale: Conserve l’image concrète du mouvement hors d’une ouverture; le pronom renvoie au soleil dans le contexte immédiat.
- source_word: በወርኅ ቀዳማዊ
  choice: au premier mois
  rationale: Expression temporelle française naturelle, fidèle au sens ordinal du texte.
- source_word: በኆኅት ዓቢይ
  choice: par la grande porte
  rationale: « Porte » maintient le vocabulaire cosmologique récurrent; « par » exprime le passage à travers cette ouverture.
- source_word: እንተ ይእቲ ራብዕት
  choice: qui est la quatrième
  rationale: Identifie clairement cette porte au sein de la série numérotée.
- source_word: እልኩ ኃዋኅወ ፮
  choice: des six portes
  rationale: La relation partitive avec « quatrième » est la lecture syntaxique la plus cohérente.
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: tournées vers le lever du soleil
  rationale: « Lever du soleil » rend ምሥራቀ ፀሐይ comme phénomène du soleil levant; « tournées vers » restitue la valeur directionnelle de መንገለ.
theological_decisions:
- issue: Image cosmologique du soleil passant par des portes
  choice: Maintenir la représentation concrète du soleil qui sort par une porte numérotée.
  alternative: Moderniser en parlant du soleil qui se lève dans une région donnée du ciel.
  rationale: Le passage présente délibérément les luminaires au moyen de portes célestes; traduire cette image sans la rationaliser respecte la cosmologie propre au texte.
- issue: Statut incertain de la proposition finale
  choice: La conserver dans le texte avec un appel de note.
  alternative: L’omettre du corps du verset ou la reléguer entièrement en note.
  rationale: La proposition est présente dans le témoin fourni, bien qu’elle soit mise entre crochets; son maintien signale le contenu transmis tandis que la note préserve l’incertitude textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image apocalyptique des portes célestes et évite de la remplacer par une explication astronomique moderne.
