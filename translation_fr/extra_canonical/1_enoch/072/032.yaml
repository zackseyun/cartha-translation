base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: fr
  text: Ce jour-là, la nuit diminue et compte neuf parts[a], et le jour compte neuf parts. La nuit devient égale au jour, et l’année devient exacte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « neuf parts » répétées correspondent à la division schématique du jour et de la nuit en portions numérotées dans le système astronomique du livre.
    reason: cultural_note
  - marker: b
    text: 'On pourrait aussi traduire : « l’année atteint sa juste mesure », « l’année est achevée avec exactitude » ou « l’année devient complète ». Le terme guèze peut évoquer l’exactitude, le juste ajustement ou l’achèvement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français qui conserve la valeur démonstrative et situe un moment précis du cycle solaire.
- source_word: ትኃፅፅ፡ ሌሊት
  choice: la nuit diminue
  rationale: Le verbe indique une diminution mesurable; cette formulation sobre convient au contexte astronomique.
- source_word: ትስዓተ፡ ክፍለ
  choice: neuf parts
  rationale: Le livre divise schématiquement le jour et la nuit en parts numérotées. « Parts » est clair et maintient cette terminologie de mesure.
- source_word: ይትዓረይ፡ ሌሊት፡ ምስለ፡ ማዓልት
  choice: La nuit devient égale au jour
  rationale: La tournure exprime l’égalisation de la nuit et du jour à ce point du cycle, sans réduire le procès au simple constat abstrait d’une égalité.
- source_word: ዓመት፡ ጥንቅቀ
  choice: l’année atteint sa juste mesure
  rationale: Cette expression française naturelle rend, dans le contexte calendaire, l’idée d’exactitude, d’ajustement ou d’achèvement, tout en signalant les autres possibilités dans une note.
theological_decisions:
- issue: Portée de l’énoncé calendaire lors de l’égalité entre la nuit et le jour
  choice: Présenter la phrase comme une observation astronomique et calendaire fondée sur des proportions mesurées.
  alternative: Y voir une affirmation symbolique ou théologique sur la perfection cosmique.
  rationale: Le contexte immédiat du Livre des luminaires est technique et calendaire. Rien dans la phrase n’impose une interprétation symbolique ou liturgique.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire demeure concret et mesuré, conformément au caractère astronomique du passage. « Compte neuf parts » évite le calque peu naturel « devient neuf parts », tandis que « atteint sa juste mesure » restitue idiomatiquement la précision calendaire sans effacer l’ambiguïté lexicale, conservée en note.
