base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: fr
  text: Ce jour-là, le soleil sort de cette deuxième porte et se couche à l’ouest, à la deuxième porte. Il entre à l’est par la première porte pendant trente et un matins[a], puis se couche à la première porte, à l’ouest du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « trente et un matins » ; dans ce système décrivant le parcours des luminaires, il s’agit d’un décompte de jours.
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: sort
  rationale: Le verbe concret décrit l’apparition du soleil hors d’une porte céleste; « sort » conserve simplement cette image.
- source_word: ኆኅት
  choice: porte
  rationale: Dans le Livre astronomique, le terme désigne les ouvertures fixes du ciel empruntées par les luminaires; « porte » préserve cette représentation cosmologique.
- source_word: ያዓርብ
  choice: se couche
  rationale: Appliqué au soleil dans un contexte occidental, le verbe exprime naturellement son coucher.
- source_word: ይገብእ
  choice: revient
  rationale: Le verbe peut signifier entrer, mais la séquence cyclique indique ici le retour du soleil à l’est; « revient » rend ce mouvement sans ajouter de participe absent du texte.
- source_word: በአሐቲ ኆኅት
  choice: à la première porte
  rationale: Dans cette séquence numérotée de portes, le féminin « une » a une valeur ordinale et désigne précisément la première porte.
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: pendant trente et un matins
  rationale: ጸባሐ signifie littéralement « matin »; le contexte en fait un décompte calendaire, mais conserver « matins » respecte l’image et la formulation de la source.
- source_word: ምዕራበ ሰማይ
  choice: l’ouest du ciel
  rationale: La formule désigne la partie occidentale du ciel dans l’architecture cosmologique du passage; « ciel » est naturel en français tout en gardant cette perspective.
