base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: fr
  text: Je vis six portails[a] d’où se lève le soleil, et six portails où se couche le soleil ; la lune se lève et se couche dans ces portails. Les guides des étoiles, avec ceux qu’ils guident, sont six à l’est et six à l’ouest. Tous se suivent, dans un ordre exact, et de nombreuses fenêtres se trouvent à droite et à gauche de ces portails[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze emploie ici un terme pour les six grandes ouvertures cosmiques (« portails »), puis, à la fin du verset, une autre expression difficile qui peut désigner des ouvertures secondaires ou des fenêtres situées à côté d’elles.
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition est difficile. Elle semble décrire les portails disposés en succession régulière, avec de nombreuses ouvertures latérales à leur droite et à leur gauche.
    reason: textual_difficulty
lexical_decisions:
- source_word: ወርኢኩ
  choice: Je vis
  rationale: Conserve le témoignage visionnaire à la première personne dans un français biblique actuel et digne.
- source_word: ኃዋኅወ
  choice: portails
  rationale: Désigne ici les grandes ouvertures cosmiques de l’horizon par lesquelles passent les luminaires ; « portails » préserve mieux cette image que le simple terme architectural « portes ».
- source_word: እለ ኀበ ይወፅእ ፀሐይ
  choice: d’où se lève le soleil
  rationale: Rend naturellement en français le mouvement de sortie du soleil sans perdre l’image de son émergence.
- source_word: የዓርብ ፀሐይ … ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: où se couche le soleil ; la lune se lève et se couche dans ces portails
  rationale: Respecte la syntaxe qui attribue d’abord le coucher au soleil, puis le lever et le coucher à la lune, au lieu de faire du soleil et de la lune un sujet composé.
- source_word: መራኄሆሙ ለከዋክብት
  choice: les guides des étoiles
  rationale: Conserve l’idée de figures directrices associées aux étoiles sans préciser qu’il s’agit d’anges, précision absente de l’expression source.
- source_word: ምስለ እለ ይመርኅዎሙ
  choice: avec ceux qu’ils guident
  rationale: Préserve la relation entre les guides et ceux qui sont conduits tout en évitant de déterminer davantage leur nature.
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: six à l’est et six à l’ouest
  rationale: Exprime clairement et sobrement la répartition cosmique orientale et occidentale.
- source_word: ኵሎሙ ፩፩እምድኅረ ካልኡ ርቱዕ
  choice: Tous se suivent, dans un ordre exact
  rationale: Restitue à la fois la succession de l’un après l’autre et la régularité ou rectitude de cet ordre.
- source_word: መላክወ ብዙኃት
  choice: de nombreuses fenêtres
  rationale: Le membre de phrase est difficile, mais il semble désigner des ouvertures secondaires disposées près des portails principaux ; « fenêtres » maintient la distinction lexicale entre les deux sortes d’ouvertures.
theological_decisions:
- issue: Faut-il identifier explicitement les guides des étoiles comme des anges ?
  choice: les guides des étoiles
  alternative: les anges qui guident les étoiles
  rationale: Le contexte peut suggérer une administration angélique du cosmos, mais le guèze n’emploie pas ici explicitement le nom « anges ». La traduction conserve donc cette implication possible sans l’imposer.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit visionnaire écrit. Le vocabulaire cosmologique demeure concret, et les ambiguïtés concernant la nature des guides et les ouvertures secondaires ne sont pas résolues au-delà du texte source.
