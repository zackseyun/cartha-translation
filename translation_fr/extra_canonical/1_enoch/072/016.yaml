base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: fr
  text: Et lorsque trente matins sont achevés[a], le jour diminue exactement d’une part, puis il compte onze parts, et la nuit, sept[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trente matins ». Dans cette section, l’expression désigne un intervalle compté du calendrier solaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Le chapitre mesure à plusieurs reprises le jour et la nuit en « parts » : le jour en compte ici onze, et la nuit sept.'
    reason: cultural_note
lexical_decisions:
- source_word: ተፈጸመ
  choice: sont achevés
  rationale: Le verbe exprime l’achèvement d’une période comptée. « Sont achevés » garde ce sens tout en restant naturel en français.
- source_word: ሠላሳ ጽባሕ
  choice: trente matins
  rationale: Le guèze dit concrètement « matins ». Dans ce calendrier solaire, l’expression sert à compter un intervalle, mais il convient de conserver l’image du texte source.
- source_word: ተሐፅፅ ማዓልት
  choice: le jour diminue
  rationale: La formule décrit la diminution quantitative de la durée du jour dans le schéma astronomique. « Diminue » conserve le caractère technique du passage.
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: exactement d’une part
  rationale: Cette formulation rend à la fois l’unité de diminution et l’adverbe ጥንቁቀ, qui souligne la précision de la mesure.
- source_word: ወትከውን
  choice: puis il compte
  rationale: Le verbe indique l’état qui résulte de la diminution. En français, « puis il compte onze parts » exprime naturellement cette transition sans donner à entendre que le jour se transforme littéralement en parts.
- source_word: ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: il compte onze parts
  rationale: Le sujet reste « le jour », et sa nouvelle mesure est de onze parts. Cette tournure restitue clairement la syntaxe et le système de comptage.
- source_word: ወሌሊት ስብዓተ
  choice: et la nuit, sept
  rationale: Le mot « parts » est sous-entendu dans le second membre, comme dans la formulation concise du texte source.
