base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: fr
  text: Et les cœurs des saints seront remplis de joie, car le nombre des justes s’est approché[a], la prière des justes a été entendue, et le sang des justes a été réclamé devant le Seigneur des Esprits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le décompte des justes s’est approché »; le terme peut désigner un nombre ou un compte, avec une possible nuance de décompte judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut signifier « réclamé » ou « demandé en compte »; dans le contexte du sang versé, il implique que Dieu en demande compte et conduit à sa vindication.
    reason: lexical_clarification
lexical_decisions:
- source_word: ልቦሙ
  choice: le cœur des saints
  rationale: Le guèze exprime littéralement « leur cœur ». En français, le singulier collectif conserve l’image biblique et s’accorde naturellement avec le groupe nommé ensuite.
- source_word: ቅዱሳን
  choice: les saints
  rationale: Ce terme désigne la communauté consacrée à Dieu. « Les saints » est ici le correspondant français biblique le plus direct, sans désigner une catégorie canonisée ultérieurement.
- source_word: ትመልእ ፍሥሐ
  choice: sera rempli de joie
  rationale: Cette formulation rend directement l’idée d’un remplissement de joie, dans un registre digne et naturel.
- source_word: ቀርበ
  choice: s’est approché
  rationale: Le parfait indique que ce qui était attendu est désormais proche; « s’est approché » préserve cette imminence apocalyptique.
- source_word: ኍልቈ ለጻድቅ
  choice: le nombre des justes
  rationale: ኍልቈ désigne d’abord un nombre ou un compte. La traduction garde le sens concret sans expliciter l’idée possible d’un total fixé d’avance.
- source_word: ጻድቅ / ጻድቃን
  choice: les justes
  rationale: « Les justes » est l’équivalent biblique français courant et permet de conserver ce terme clé de manière cohérente.
- source_word: ጸሎቶሙ ተሰምዐ
  choice: la prière des justes a été entendue
  rationale: Le singulier collectif « la prière » reflète la forme guèze et reste naturel en français.
- source_word: ደሙ ለጻድቅ
  choice: le sang des justes
  rationale: Le contexte collectif favorise « des justes » plutôt qu’un juste individuel; l’image du sang versé est conservée.
- source_word: ተፈቅደ
  choice: a été vengé
  rationale: Dans cet emploi appliqué au sang versé, le verbe évoque le sang réclamé en vue d’une reddition de comptes. « A été vengé » rend idiomatiquement la portée judiciaire du passage, tandis qu’une note conserve la formulation plus littérale possible.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des Esprits
  rationale: Il s’agit d’un titre divin caractéristique de 1 Hénoch; les majuscules signalent sa fonction titulaire.
theological_decisions:
- issue: Sens du « nombre des justes » qui s’approche
  choice: Conserver l’image d’un nombre devenu proche, sans expliquer dans le texte qu’il s’agit d’un total fixé.
  alternative: « Le compte des justes s’est approché » ou « le temps des justes s’est approché ».
  rationale: Le substantif signifie naturellement « nombre, compte », mais sa portée apocalyptique exacte demeure ouverte. La note signale la nuance judiciaire possible sans trancher.
- issue: Portée judiciaire de ተፈቅደ appliqué au sang des justes
  choice: « Le sang des justes a été vengé ».
  alternative: « Le sang des justes a été réclamé » ou « il a été demandé compte du sang des justes ».
  rationale: Le contexte du sang innocent et l’emploi lexical évoquent une réclamation judiciaire et la vengeance qui en résulte. La traduction principale est naturelle en français, tandis que la note préserve le lien avec l’idée plus littérale de sang « réclamé ».
translation_notes:
  register: Français international moderne, sobre et biblique. Le futur et les passifs préservent la solennité apocalyptique; le vocabulaire reste accessible sans atténuer les images du texte.
