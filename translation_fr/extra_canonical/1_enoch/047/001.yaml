base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: fr
  text: En ces jours-là, la prière des justes et le sang du juste[a] s’élevèrent[b] de la terre devant le Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « le sang du juste », le terme guèze étant au singulier. Celui-ci peut toutefois avoir un sens représentatif ou collectif, en parallèle avec « la prière des justes »; on pourrait alors comprendre « le sang des justes ».
    reason: lexical_alternative
  - marker: b
    text: En guèze, le verbe au parfait est au féminin singulier et s’accorde avec « la prière »; il n’est pas répété devant « le sang ». Le français emploie ici le pluriel avec le sujet composé.
    reason: grammar
lexical_decisions:
- source_word: በውእቱ መዋዕል
  choice: En ces jours-là
  rationale: Cette formule française naturelle conserve le marqueur temporel apocalyptique récurrent et le démonstratif du guèze.
- source_word: ዐርገት
  choice: s’élevèrent
  rationale: Le parfait guèze indique une action accomplie, non un futur. Le pluriel français est requis par le sujet composé « la prière… et le sang… ».
- source_word: ጸሎተ ጻድቃን
  choice: la prière des justes
  rationale: « Prière » rend le terme sans en restreindre le sens à une supplication particulière; « les justes » conserve la valeur collective du pluriel.
- source_word: ደሙ ጻድቅ
  choice: le sang du juste
  rationale: Le nom qualifiant le sang est formellement au singulier. La traduction maintient cette donnée au lieu de décider silencieusement qu’il s’agit nécessairement d’un pluriel collectif.
- source_word: እምነ ምድር
  choice: de la terre
  rationale: « Terre » convient à la portée cosmique de la vision et rend le mouvement depuis son point de départ.
- source_word: ቅድመ
  choice: devant
  rationale: Rendu concis et idiomatique de la position en présence d’une autorité divine.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette traduction transparente conserve le titre divin caractéristique du livre sans ajouter l’article « les », absent de la construction source.
theological_decisions:
- issue: Le singulier ጻድቅ après « sang » désigne-t-il un juste individuel ou les justes collectivement?
  choice: Conserver dans le texte « le sang du juste ».
  alternative: « le sang des justes » ou « leur sang »
  rationale: Le guèze présente ici une forme singulière, tandis que le parallélisme avec « la prière des justes » permet une lecture représentative ou collective. Le texte principal préserve la forme source et la note expose l’autre lecture sans identifier arbitrairement un individu.
- issue: Le temps du verbe doit-il être passé ou futur dans le cadre visionnaire?
  choice: Passé composé narratif rendu par le passé simple français « s’élevèrent ».
  alternative: « s’élèveront »
  rationale: ዐርገት est un parfait. Le contexte apocalyptique ne justifie pas à lui seul de le convertir en futur.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le passé simple convient au registre narratif et visionnaire. La syntaxe française regroupe les deux éléments du sujet afin d’éviter une ellipse artificielle, tout en signalant en note la construction condensée du guèze.
