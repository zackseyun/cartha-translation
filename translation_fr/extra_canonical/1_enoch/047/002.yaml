base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: fr
  text: En ces jours-là, les êtres saints qui habitent dans les hauteurs des cieux s’uniront d’une seule voix[a]. Ils supplieront, prieront, loueront, rendront grâce et béniront le nom du Seigneur des esprits à cause du sang des justes qui a été versé, afin que la prière des justes ne reste pas sans effet devant le Seigneur des esprits[b], afin que le jugement soit rendu en leur faveur[c], et afin que leur patience ne se prolonge pas éternellement[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les saints ». Le terme peut désigner des êtres saints en général. Puisqu’ils habitent dans les hauteurs des cieux, il peut s’agir d’anges, de justes vivant au ciel, ou des deux.
    reason: lexical_alternative
  - marker: b
    text: Le verbe éthiopien transmis ici est incertain. Dans ce contexte, le sens probable est que la prière des justes ne doit pas rester vaine, inefficace ou sans réponse devant le Seigneur des esprits.
    reason: textual_variant
  - marker: c
    text: Ou « que justice leur soit rendue ». Le nom peut désigner soit un jugement ou une sentence, soit l’exercice de la justice en faveur des justes.
    reason: lexical_alternative
  - marker: d
    text: Littéralement, le texte parle de leur « patience » ou de leur « endurance ». Dans ce contexte, il s’agit vraisemblablement de la patience qu’ils doivent exercer dans l’attente de l’intervention de Dieu.
    reason: translation_clarity
lexical_decisions:
- source_word: የኃብሩ
  choice: s’uniront
  rationale: Le verbe exprime l’action de se joindre ou de se rassembler. Avec « d’une seule voix », « s’uniront » rend à la fois l’action collective et l’unanimité.
- source_word: ቅዱሳን
  choice: les êtres saints
  rationale: Cette formulation conserve la désignation apocalyptique sans identifier de manière indue ces êtres aux anges ou aux justes humains glorifiés.
- source_word: በመልዕልተ ሰማያት
  choice: dans les hauteurs des cieux
  rationale: La traduction garde l’image spatiale d’un domaine céleste élevé sans imposer une cosmologie trop précise.
- source_word: በ፩ቃል
  choice: d’une seule voix
  rationale: Littéralement « par une seule parole/voix » ; le contexte d’une supplication commune favorise l’expression française idiomatique « d’une seule voix ».
- source_word: ያስተበቍዑ
  choice: supplieront
  rationale: Le verbe désigne une requête pressante. « Supplieront » en préserve l’intensité tout en restant distinct du verbe suivant, « prieront ».
- source_word: ይጼልዩ፡ ይሴብሑ፡ የአኵቱ፡ ይባርኩ
  choice: prieront, loueront, rendront grâce et béniront
  rationale: La série verbale est maintenue afin de conserver son rythme liturgique et les nuances entre prière, louange, reconnaissance et bénédiction.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette traduction sobre conserve le titre divin caractéristique des Paraboles d’Hénoch.
- source_word: ኢትጸራዕ
  choice: ne reste pas sans effet
  rationale: La forme transmise est difficile. Dans ce contexte de demande de justice, cette formulation exprime prudemment l’idée que la prière ne doit pas demeurer inefficace ou sans réponse.
- source_word: ኵነኔ
  choice: le jugement
  rationale: Le substantif a une portée judiciaire et peut désigner le jugement, la sentence ou la justice mise en œuvre. « Le jugement » conserve l’imagerie judiciaire apocalyptique.
- source_word: ትዕግሥት
  choice: leur attente
  rationale: Le nom peut évoquer la patience, l’endurance ou l’attente. Ici, l’idée que cette situation ne doit pas durer éternellement se rend naturellement par « leur attente ».
theological_decisions:
- issue: Identité des ቅዱሳን dans la scène céleste
  choice: les êtres saints
  alternative: les saints ; les anges
  rationale: Puisqu’ils habitent dans les hauteurs des cieux, le contexte les situe dans le monde céleste, mais ne permet pas de décider avec certitude s’il s’agit d’anges, de justes célestes ou des deux.
- issue: Portée de la demande relative à la prière des justes
  choice: ne reste pas sans effet
  alternative: ne soit pas réduite au silence ; ne cesse pas ; ne soit pas rejetée
  rationale: Le témoin éthiopien est difficile à cet endroit. La traduction retient le sens contextuel probable sans prétendre résoudre l’incertitude lexicale.
- issue: Sens judiciaire de ኵነኔ
  choice: que le jugement soit rendu en leur faveur
  alternative: que justice leur soit rendue ; qu’une sentence soit exécutée pour eux
  rationale: La formulation préserve à la fois l’acte judiciaire divin et sa fonction de réhabilitation des justes.
- issue: Rapport syntaxique des propositions introduites par ከመ
  choice: trois propositions parallèles de but ou de contenu introduites en français par « afin que… que… et que… »
  alternative: 'comprendre la première proposition comme une cause : « parce que la prière… »'
  rationale: Les formes subjonctives du guèze soutiennent une série de demandes ou de buts parallèles plutôt qu’un rapport causal.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence liturgique de la succession des verbes est conservée. Le titre « Seigneur des esprits » et l’imagerie céleste et judiciaire gardent la tonalité apocalyptique du passage, tandis que les notes signalent les ambiguïtés réelles du texte guèze.
