base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: fr
  text: En ces jours-là, je vis le Chef des jours[a], tandis qu’il siégeait sur le trône de sa gloire. Les livres des vivants[b] furent ouverts devant lui, et toute son armée, qui se trouve dans les hauteurs des cieux, ainsi que sa cour[c], se tenaient devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le Chef des jours ». Le titre guèze n’est pas remplacé ici par la formulation plus familière « l’Ancien des jours ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les livres de vie ». Le guèze porte une expression au pluriel, plus littéralement « les livres des vivants ».
    reason: lexical_alternative
  - marker: c
    text: Le mot peut désigner le cercle qui l’entoure, son assemblée ou son conseil, c’est-à-dire la cour céleste réunie autour du trône.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et la répétition concrète de « jours ».
- source_word: ለርእሰ መዋዕል
  choice: le Chef des jours
  rationale: Rend les éléments du titre guèze de façon intelligible en français, sans l’harmoniser avec le titre traditionnel « l’Ancien des jours ».
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: tandis qu’il siégeait sur le trône de sa gloire
  rationale: Le verbe a pour sujet le Chef des jours et exprime le fait de s’asseoir ou de siéger; « le trône de sa gloire » conserve la construction nominale du texte.
- source_word: መጻሕፍተ ሕያዋን
  choice: les livres des vivants
  rationale: Préserve à la fois le pluriel « livres » et le génitif concret « des vivants », au lieu d’harmoniser avec « le livre de vie ».
- source_word: በቅድሜሁ ተከሥቱ
  choice: furent ouverts devant lui
  rationale: Dans la scène judiciaire, l’ouverture de livres célestes est le sens contextuel naturel du verbe.
- source_word: ኵሉ ኃይሉ
  choice: toute son armée
  rationale: Le contexte de cour céleste favorise le sens collectif de troupe ou d’armée plutôt que celui, abstrait, de puissance.
- source_word: ዘመልዕልተ ሰማያት
  choice: qui se trouve dans les hauteurs des cieux
  rationale: Maintient l’image spatiale élevée et le pluriel « cieux ».
- source_word: አውደ ዚአሁ
  choice: sa cour
  rationale: Dans une vision du trône, « cour » désigne naturellement l’assemblée qui entoure le souverain et garde une part de l’image spatiale du cercle.
- source_word: ይቀውሙ በቅድሜሁ
  choice: se tenaient devant lui
  rationale: Exprime la posture solennelle de l’armée et de la cour célestes en présence du personnage intronisé.
theological_decisions:
- issue: Titre divin ርእሰ መዋዕል
  choice: le Chef des jours
  alternative: l’Ancien des jours
  rationale: Le choix suit le titre propre au témoin guèze et évite de le remplacer silencieusement par la formulation familière de Daniel.
- issue: Expression መጻሕፍተ ሕያዋን
  choice: les livres des vivants
  alternative: les livres de vie
  rationale: Le pluriel et la référence aux vivants sont conservés afin de ne pas importer une formule canonique plus familière.
- issue: Identité de አውደ ዚአሁ
  choice: sa cour
  alternative: son conseil
  rationale: « Cour » convient à l’assemblée céleste entourant le trône sans préciser qu’elle exerce nécessairement une fonction délibérative.
