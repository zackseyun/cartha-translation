base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: fr
  text: 'Et j’ai demandé à l’ange qui m’accompagnait, celui qui m’avait montré ce qui était caché[a] : « Que sont ces choses[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses cachées » ou « les secrets ». Le terme guèze désigne des réalités dissimulées jusqu’à leur dévoilement dans la vision.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, si le référent désigne des êtres : « Qui sont ceux-ci ? »'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ተስእልክዎ
  choice: j’ai demandé à
  rationale: Le verbe issu de ሰአለ exprime l’action de demander ou d’interroger. « J’ai demandé à » est naturel en français et introduit clairement la question directe.
- source_word: መልአክ
  choice: l’ange
  rationale: Dans ce contexte visionnaire, il s’agit du guide céleste d’Hénoch ; « ange » rend donc mieux le sens contextuel que le terme générique « messager ».
- source_word: ዘየሐውር ምስሌየ
  choice: qui m’accompagnait
  rationale: Cette tournure française fluide conserve l’idée que l’ange allait avec Hénoch au cours de la vision, sans imposer le sens plus précis de « marcher ».
- source_word: ዘአርአየኒ
  choice: celui qui m’avait montré
  rationale: Le verbe signifie « montrer » ou « faire voir ». Le plus-que-parfait situe naturellement cette révélation avant la question posée, tandis que « celui qui » évite l’enchaînement lourd de deux relatives identiques.
- source_word: ኅቡእ
  choice: ce qui était caché
  rationale: Cette formulation garde le motif apocalyptique de réalités dissimulées puis dévoilées, tout en préservant l’indétermination du référent.
- source_word: ምንት እሙንቱ እሉ
  choice: Que sont ces choses ?
  rationale: La question renvoie le plus naturellement aux réalités ou phénomènes vus dans la vision. « Ces choses » explicite en français le démonstratif pluriel sans identifier davantage leur nature.
theological_decisions:
- issue: Désignation des réalités dissimulées dans le cadre de la révélation apocalyptique
  choice: ce qui était caché
  alternative: les choses cachées / les secrets
  rationale: « Ce qui était caché » maintient le thème du dévoilement de réalités célestes sans transformer le terme en vocabulaire technique du secret.
- issue: Nature personnelle ou non personnelle des réalités désignées
  choice: Que sont ces choses ?
  alternative: Qui sont ceux-ci ?
  rationale: Le contexte immédiat favorise des objets ou des phénomènes visionnaires, mais la forme interrogative peut aussi, selon son référent, s’appliquer à des êtres ; cette possibilité est conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure visionnaire du guèze tout en distinguant clairement l’ange accompagnateur, ce qu’il révèle et la question d’Hénoch.
