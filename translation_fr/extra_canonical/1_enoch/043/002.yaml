base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: fr
  text: 'Et je vis les balances de justice[a] : comment elles sont pesées selon leurs lumières, la largeur de leurs emplacements et le jour de leur apparition ; leur révolution produit l’éclair, et leur révolution est réglée selon le nombre des anges[b] ; elles restent fidèles les unes aux autres[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du verset est difficile : les « balances de justice », leur pesée et leurs lumières appartiennent à une image céleste dont le rapport exact n’est pas explicité.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « leur révolution [est] selon le nombre des anges ». Le texte ne dit pas explicitement que les anges les comptent.'
    reason: lexical_alternative
  - marker: c
    text: Le dernier membre peut décrire la fidélité réciproque des entités célestes ou la constance harmonieuse de leur ordre.
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ፡ ጽድቅ
  choice: les balances de justice
  rationale: Le substantif መዳልወ désigne ici des balances, et ጽድቅ est conservé comme complément abstrait. Cette traduction suit la lecture corrigée du guèze sans identifier ces balances aux luminaires.
- source_word: ይደለው
  choice: elles sont pesées
  rationale: Le verbe exprime l’action de peser. Le passif français maintient la formulation visionnaire et l’ambiguïté de l’image.
- source_word: በብርሃናቲሆሙ
  choice: selon leurs lumières
  rationale: La préposition est rendue par « selon » et le pluriel concret de « lumière » est conservé, sans préciser s’il s’agit d’éclat, de luminaires ou d’une mesure lumineuse.
- source_word: ሰረኃበ፡ መካናቲሆሙ
  choice: la largeur de leurs emplacements
  rationale: La lecture corrigée comprend le premier terme comme « largeur ». « Emplacements » convient aux positions assignées dans l’ordre céleste.
- source_word: ዕለተ፡ ክነቶሙ
  choice: le jour de leur apparition
  rationale: Le singulier « jour » est respecté et ክነቶሙ est compris comme leur manifestation ou apparition, plutôt que comme une saison.
- source_word: ሚጠቶሙ
  choice: leur révolution
  rationale: Le mot évoque un mouvement de rotation ou un parcours cyclique. « Révolution » convient au contexte astronomique et distingue ce terme de celui de l’apparition.
- source_word: መብረቅ፡ ይወልድ
  choice: produit l’éclair
  rationale: Le verbe signifie littéralement « enfanter ». « Produit » rend naturellement l’image causative en français, tandis que « l’éclair » conserve le phénomène céleste.
- source_word: በኍልቈ፡ መላእክት
  choice: selon le nombre des anges
  rationale: La construction prépositionnelle indique une conformité à un nombre ou décompte, sans verbe explicite de comptage. « Anges » est approprié au cadre céleste d’Hénoch.
- source_word: ሃይማኖቶሙ፡ የዓቅቡ፡ በበይናቲሆሙ
  choice: elles restent fidèles les unes aux autres
  rationale: La formule exprime une fidélité réciproque ou une constance mutuelle. Cette formulation française garde la portée relationnelle et cosmique sans lui imposer un sens doctrinal.
theological_decisions:
- issue: Nature des balances de justice et relation avec les lumières
  choice: L’image est traduite littéralement sans identifier les balances à des anges, à des astres ou aux justes.
  alternative: Comprendre les objets comme des « luminaires de justice » répartis dans le ciel.
  rationale: La lecture lexicale corrigée soutient « balances », mais le rapport entre celles-ci, leur pesée et leurs lumières reste énigmatique. La traduction préserve cette tension apocalyptique.
- issue: Sujet de la fidélité réciproque
  choice: Le féminin pluriel « elles » renvoie grammaticalement aux balances, tout en laissant le réseau d’entités célestes déterminer le sens dans le contexte.
  alternative: Faire des anges ou des corps célestes le sujet explicite de la fidélité.
  rationale: Le guèze ne justifie pas de remplacer ouvertement le sujet par les anges. La formulation retenue évite de résoudre une ambiguïté réelle.
- issue: Rapport entre la révolution et le nombre des anges
  choice: « est réglée selon » exprime la conformité de la révolution au nombre des anges.
  alternative: « est comptée par les anges » ou « correspond au décompte angélique ».
  rationale: Le texte donne une expression prépositionnelle, non un verbe disant que les anges comptent. Le choix évite d’ajouter une action absente de la source.
translation_notes:
  register: Français international moderne, digne et visionnaire. La syntaxe conserve l’accumulation propre au texte apocalyptique, avec une ponctuation qui en facilite la lecture. Les termes techniques restent accessibles et les ambiguïtés du guèze sont signalées plutôt que résolues.
