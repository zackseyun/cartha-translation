base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: fr
  text: Et je vis d’autres éclairs et les étoiles du ciel. Je vis comment il les appelle tous, chacun par son nom, et ils l’entendent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ils l’entendent » ; dans ce contexte, l’expression peut aussi impliquer qu’ils l’écoutent et lui obéissent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis / Je vis
  rationale: Formule visionnaire à la première personne. La répétition est conservée pour respecter la cadence du texte, sans recourir à l’archaïque « je contemplai ».
- source_word: ካልአ መባርቅተ
  choice: d’autres éclairs
  rationale: ካልአ est compris comme l’adjectif qui qualifie le pluriel መባርቅተ, plutôt que comme le substantif « autre chose ». « Éclairs » rend naturellement le phénomène céleste au pluriel.
- source_word: ወከዋክብተ ሰማይ
  choice: et les étoiles du ciel
  rationale: Expression céleste traditionnelle, claire en français moderne et adaptée au registre apocalyptique.
- source_word: ከመ ይጼውዖሙ
  choice: comment il les appelle
  rationale: Après le verbe de vision, « comment » exprime ce qu’Hénoch observe. Le présent préserve l’aspect vivant de la scène et le pronom « il » maintient le sujet implicite du texte source.
- source_word: ለኵሎሙ በበአስማቲሆሙ
  choice: tous, chacun par son nom
  rationale: « Tous » rend la totalité, tandis que « chacun par son nom » restitue explicitement la valeur distributive de la préposition redoublée በበ-.
- source_word: ወይሰምዕዎ
  choice: et ils l’entendent
  rationale: Le sens fondamental du verbe est « entendre ». Le contexte peut suggérer une réponse obéissante, mais cette implication n’est pas imposée dans le texte principal.
theological_decisions:
- issue: Les astres sont-ils simplement interpellés, ou présentés comme des êtres célestes qui répondent à l’autorité divine ?
  choice: 'Conserver la formulation personnelle : « il les appelle… et ils l’entendent »'
  alternative: « il les convoque… et ils lui obéissent »
  rationale: La personnification apocalyptique est maintenue sans réduire la scène à une simple métaphore astronomique ni en tirer une angélologie plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « je vis » conserve la cadence visionnaire. La ponctuation en deux phrases allège la syntaxe sans modifier les rapports entre les propositions.
