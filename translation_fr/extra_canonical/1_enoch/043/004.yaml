base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: fr
  text: 'Et il me dit : « Le Seigneur des esprits t’a montré leur signification symbolique[a] : ce sont les noms des saints qui habitent sur la terre ferme[b] et qui mettent leur confiance dans le nom du Seigneur des esprits[c], pour les siècles des siècles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, selon cette lecture : « leur image », « leur ressemblance » ou « leur parabole ». La forme éthiopienne est difficile et peut aussi être comprise comme la préposition « avec » ou « au sujet de », selon son analyse.'
    reason: alternative_reading
  - marker: b
    text: Ou « sur la terre sèche ». L’expression peut souligner le contraste entre les habitants de la terre et les êtres célestes de la vision.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui croient au nom du Seigneur des esprits ». Le verbe éthiopien peut exprimer la croyance ou la confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስለ ዘዚአሆሙ
  choice: ce qu’ils représentent
  rationale: Dans ce contexte visionnaire, ምስለ est compris comme une forme liée à l’idée d’image, de ressemblance ou de représentation, suivie de « leur ». La formulation française exprime naturellement que les astres vus représentent les saints, tout en signalant en note la formulation plus littérale et l’incertitude lexicale.
- source_word: እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Titre divin caractéristique de 1 Hénoch. L’article devant « esprits » convient au français moderne tout en conservant le titre apocalyptique.
- source_word: አርአየከ
  choice: t’a montré
  rationale: Rend directement l’accompli causatif « il t’a fait voir / il t’a montré » dans un français naturel.
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: ce sont les noms des saints
  rationale: 'Le suffixe anticipatif de « leurs noms », repris par le groupe introduit par ለ-, exprime ici naturellement la possession : « les noms des saints ».'
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: qui habitent sur la terre ferme
  rationale: « Terre ferme » conserve l’image concrète de የብስ, la terre sèche, plutôt que de la réduire au terme général « terre ».
- source_word: ወየአምኑ በስሙ
  choice: et qui mettent leur confiance dans le nom
  rationale: Le verbe peut exprimer aussi bien la croyance que la confiance. « Mettre sa confiance dans » restitue clairement la portée relationnelle de l’expression sans imposer une formule confessionnelle tardive.
- source_word: ለዓለመ ዓለም
  choice: pour les siècles des siècles
  rationale: Formule française digne et traditionnelle qui garde l’intensification de l’expression éthiopienne de durée perpétuelle.
theological_decisions:
- issue: Identité des « saints » qui habitent sur la terre ferme
  choice: Des fidèles humains vivant sur terre
  alternative: Des êtres célestes, ou une référence volontairement double aux saints terrestres et célestes
  rationale: Les précisions « qui habitent sur la terre ferme » et « qui mettent leur confiance dans le nom » orientent vers des humains fidèles. Le texte les désigne toutefois simplement comme « saints », sans ajouter d’explication doctrinale.
- issue: Rapport entre les objets célestes de la vision et les noms des saints
  choice: La vision les présente comme représentant les saints ou leurs noms
  alternative: Le Seigneur aurait seulement révélé leurs noms, sans relation symbolique explicitée
  rationale: La lecture de ምስለ comme nom lié à l’image ou à la ressemblance rend compte de la logique de la vision et de la construction « leur représentation ». La note conserve la formulation plus littérale plutôt que de masquer la difficulté.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase garde le ton d’un récit de révélation et le titre hénochique « Seigneur des esprits ». Les notes préservent les ambiguïtés lexicales réelles sans alourdir le texte principal.
