base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: fr
  text: Sur cette montagne, je vis une autre montagne, et à l’intérieur de celle-ci se trouvaient des arbres. Ces arbres étaient pleins[a] et robustes, comme des amandiers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pleins ». Le texte ne précise pas s’ils étaient chargés de fruits, fournis en feuillage ou simplement luxuriants.
    reason: lexical_ambiguity
  - marker: b
    text: Le terme guèze peut désigner l’amande ou l’amandier; la comparaison exacte demeure légèrement incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ፡ ውእቱ፡ ደብር
  choice: Sur cette montagne
  rationale: Rend directement la relation spatiale et le démonstratif, dans un français narratif naturel.
- source_word: ደብረ፡ ካልአ
  choice: une autre montagne
  rationale: Préserve la succession topographique du récit visionnaire sans réduire ደብር à une simple colline.
- source_word: ወውስቴቱ
  choice: et à l’intérieur de celle-ci
  rationale: Le suffixe renvoie à la seconde montagne. La formulation conserve l’image inhabituelle du texte sans la remplacer par « sur ses pentes ».
- source_word: ዕፀወ / ዕፀው
  choice: arbres
  rationale: Le terme désigne ici concrètement des arbres ou une végétation ligneuse; la répétition française clarifie le référent de እልኩ, « ces/ceux-là ».
- source_word: ወእልኩ፡ ዕፀው
  choice: Ces arbres
  rationale: እልኩ est compris comme un démonstratif pluriel renvoyant aux arbres, et non comme un verbe de perception olfactive.
- source_word: ምሉኣን
  choice: pleins
  rationale: Conserve le sens premier de plénitude sans préciser arbitrairement si les arbres sont chargés de fruits, couverts de feuillage ou luxuriants.
- source_word: ዘከመ፡ ከርካዕ
  choice: comme des amandiers
  rationale: La comparaison botanique est rendue par « amandiers », sens retenu pour ከርካዕ dans cette lecture du texte.
- source_word: ጽኑዕተ
  choice: robustes
  rationale: Exprime la solidité et la vigueur physique des arbres dans un français idiomatique.
