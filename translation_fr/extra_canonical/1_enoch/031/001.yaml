base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: fr
  text: Je vis d’autres montagnes, dans lesquelles il y avait des arbres, et il en sortait comme du nectar[a], dont le nom était séréra[b] et galbanum[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « nectar » peut désigner ici une substance douce ou aromatique, peut-être une gomme ou une résine; son identification exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: « Séréra » transcrit le nom guèze d’une substance aromatique dont l’identification botanique est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Le galbanum est une résine aromatique employée dans les traditions anciennes liées aux parfums et à l’encens; le terme guèze peut aussi être transcrit « kelbené ».
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: Je vis
  rationale: Formule narrative simple et habituelle des récits de vision; le passé simple convient au registre littéraire et digne du passage.
- source_word: ካልአነ አደባረ
  choice: d’autres montagnes
  rationale: Les formes guèzes sont plurielles, ce que confirme également le suffixe pluriel de ውስቴቶሙ (« en elles »).
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: dans lesquelles il y avait des arbres
  rationale: Rend explicitement le pluriel du relatif et situe les arbres dans l’espace montagneux sans préciser davantage leur disposition.
- source_word: ወይወፅእ እምኔሁ
  choice: et il en sortait
  rationale: Le pronom français « en » conserve l’image d’une substance qui sort de ce qui précède, sans trancher artificiellement entre les montagnes et leurs arbres; il évite aussi de forcer l’accord du suffixe guèze singulier avec les montagnes plurielles.
- source_word: ከመ ኔቄጥር
  choice: comme du nectar
  rationale: Conserve la comparaison introduite par ከመ et la probable désignation d’une substance douce ou aromatique, sans en faire une identification botanique certaine.
- source_word: ዘስሙ ሰረራ ወከልበኔ
  choice: dont le nom était séréra et galbanum
  rationale: « Séréra » est translittéré en raison de son identification incertaine; « galbanum » est le nom français traditionnel et bien établi de la résine aromatique correspondant vraisemblablement à ከልበኔ.
theological_decisions:
- issue: Faut-il remplacer l’image concrète de l’écoulement par une simple odeur ou un parfum?
  choice: Conserver une substance qui « sortait » des montagnes ou des arbres et qui était « comme du nectar ».
  alternative: « Il s’en dégageait un parfum » ou « ils produisaient une senteur ».
  rationale: Le texte décrit une réalité concrète dans un paysage visionnaire. La réduire à une odeur abstraite atténuerait l’imagerie apocalyptique et dépasserait les indications du guèze.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif visionnaire. La tournure « il en sortait » préserve l’ambiguïté référentielle du texte source au lieu de décider si la substance provenait précisément des montagnes ou des arbres.
