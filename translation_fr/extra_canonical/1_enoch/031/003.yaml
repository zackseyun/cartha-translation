  text: Lorsqu’ils écrasent ce fruit[a], il surpasse tous les parfums[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La leçon du premier verbe est incertaine. Une autre lecture possible est : « lorsqu’ils prennent ce fruit » ou « lorsqu’ils le soulèvent ».'
    reason: textual_variant
  - marker: b
    text: Le terme rendu par « parfums » peut aussi désigner des senteurs ou des substances aromatiques. Dans le contexte des arbres aromatiques, la comparaison peut concerner plus précisément l’odeur du fruit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተይነሥእዎ / lecture corrigée proposée ይሔስዎ
  choice: ils broient
  rationale: La transcription fournie paraît corrompue et porte un signe critique. La correction proposée dans le témoin éditorial renvoie à l’action de frotter ou de broyer le fruit, ce qui convient au contexte des arbres aromatiques. « Broient » exprime naturellement l’action qui libère le parfum, sans effacer l’incertitude signalée en note.
- source_word: ፍሬ
  choice: fruit
  rationale: Équivalent courant du nom guèze dans ce contexte botanique et visionnaire.
- source_word: ይኄይስ
  choice: il est supérieur
  rationale: Le verbe exprime une comparaison de supériorité et sa forme appelle ici un présent. Cette formulation conserve l’évaluation générale sans la réduire explicitement à la seule odeur.
- source_word: እምኵሉ አፈው
  choice: à tous les parfums
  rationale: La construction avec እም marque la comparaison; le nom final, au pluriel, désigne vraisemblablement des parfums, senteurs ou substances aromatiques. « Tous les parfums » est naturel en français et respecte ce pluriel.
