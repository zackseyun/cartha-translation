base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: fr
  text: Et après cela, je vis des milliers de milliers et des dizaines de milliers de dizaines de milliers, dont on ne pouvait établir ni le nombre[a] ni le compte[b], qui se tenaient devant le Seigneur des Esprits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze transcrit *ኍልቈ est signalé comme incertain dans la source disponible; il semble toutefois désigner le « nombre ». Le terme parallèle rendu par « compte » confirme l’idée d’une multitude indénombrable.
    reason: textual_variant
  - marker: b
    text: 'Littéralement, la tournure peut se rendre : « il n’y avait pour eux ni nombre ni compte ». Comparer Daniel 7.10, qui décrit une multitude innombrable se tenant devant le tribunal divin.'
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: On peut aussi écrire « le Seigneur des esprits ». Le guèze n’a pas d’article défini; la majuscule retenue présente l’expression comme le titre divin récurrent des Paraboles d’Hénoch.
    reason: title_and_grammatical_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ እምድኅረዝ
  choice: Et après cela, je vis
  rationale: Le parfait à la première personne de ርእየ, précédé de la conjonction, est rendu par « je vis »; « Et » conserve l’enchaînement paratactique du récit visionnaire, et እምድኅረዝ signifie idiomatiquement « après cela ».
- source_word: አእላፈ፡ አእላፍ
  choice: des milliers de milliers
  rationale: La répétition du nom de nombre exprime une multitude immense. La formulation littérale préserve le rythme solennel et le parallèle avec le membre suivant.
- source_word: ትእልፊተ፡ ትእልፊት
  choice: des dizaines de milliers de dizaines de milliers
  rationale: Le terme désigne dix mille. Cette traduction maintient la valeur numérique du guèze plutôt que de recourir à « myriades », tout en reproduisant la construction redoublée.
- source_word: '*ኍልቈ፡ ወኃሳበ፡ አልቦሙ'
  choice: sans nombre ni compte
  rationale: ኃሳብ renvoie au compte ou au dénombrement, et አልቦሙ est une négation existentielle avec suffixe pluriel. Le premier mot, marqué comme incertain dans la transcription, paraît correspondre au « nombre »; la tournure française exprime les deux termes sans développer une conjecture.
- source_word: እለ፡ ይቀውሙ
  choice: qui se tenaient
  rationale: Le relatif pluriel introduit ceux de la multitude qui sont debout. L’imparfait français décrit naturellement la scène contemplée, sans transformer la posture en action ponctuelle.
- source_word: ቅድመ
  choice: devant
  rationale: Le terme situe la multitude en présence du souverain céleste; « devant » conserve à la fois la valeur spatiale et la tonalité de cour.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des Esprits
  rationale: Cette expression récurrente des Paraboles fonctionne comme un titre divin. La majuscule à « Esprits » en signale le caractère titulaire, tout en maintenant le lexique du texte.
theological_decisions:
- issue: Référent du titre እግዚአ፡ መናፍስት
  choice: « le Seigneur des Esprits », compris comme titre du Dieu devant qui se tient la cour céleste
  alternative: « le seigneur des esprits », comme désignation générique ou comme titre d’un être angélique
  rationale: Dans les Paraboles d’Hénoch, la formule répétée désigne le Très-Haut. La traduction conserve le titre propre au livre sans lui substituer une désignation théologique ultérieure.
- issue: Détermination de « Esprits »
  choice: Majuscule dans le titre « Seigneur des Esprits »
  alternative: « Seigneur des esprits » avec nom commun en minuscule
  rationale: Le guèze ne possède pas d’article défini correspondant exactement au français. La majuscule marque ici la stabilité du titre sans prétendre lever entièrement la question de la détermination grammaticale.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition inhabituelle des grands nombres est volontairement conservée afin de rendre le parallélisme apocalyptique du guèze. « Qui se tenaient » offre une lecture fluide du relatif pluriel et de la posture de la cour céleste.
