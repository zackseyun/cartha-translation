base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/003.yaml
  text: And I heard the voices of those four beings as they gave praise before the Lord of glory[a][b][c].
translation:
  language: fr
  text: Et j’entendis les voix de ces quatre figures[a], tandis qu’elles célébraient devant le Seigneur de gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ces quatre faces ». L’expression renvoie aux quatre figures célestes de la vision.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « le Seigneur de splendeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕኩ
  choice: Et j’entendis
  rationale: Rend directement le verbe de perception au passé et conserve le style du récit visionnaire.
- source_word: ቃሎሙ
  choice: les voix
  rationale: Le nom peut désigner la voix, le son ou les paroles ; « voix » convient au contexte d’une louange audible sans préciser indûment son contenu.
- source_word: እልኩ ገጽ አርባዕቱ
  choice: ces quatre figures
  rationale: ገጽ signifie littéralement « face », mais désigne ici, par reprise anaphorique, les quatre personnages célestes de la vision. « Figures » reste naturel en français tout en conservant leur caractère visionnaire ; le sens littéral est signalé en note.
- source_word: እንዘ ይሴብሑ
  choice: tandis qu’elles célébraient
  rationale: La construction exprime une action simultanée. « Célébraient » rend ici l’acte de louer dans un registre digne et courant.
- source_word: ቅድመ
  choice: devant
  rationale: Préposition naturelle pour exprimer la présence devant le souverain céleste.
- source_word: እግዚአ ስብሐት
  choice: le Seigneur de gloire
  rationale: Rend naturellement ce titre divin et maintient le registre apocalyptique ; « splendeur » demeure une possibilité lexicale.
theological_decisions:
- issue: Faut-il rendre ገጽ littéralement par « faces » ou contextuellement comme une désignation des quatre êtres célestes ?
  choice: ces quatre figures
  alternative: ces quatre faces ; ces quatre êtres ; ces quatre présences
  rationale: « Faces » préserverait la forme lexicale et le lien avec 40:2, mais risquerait d’évoquer en français des visages désincarnés. « Figures » indique des personnages célestes vus dans la vision sans les identifier plus précisément comme des anges ni effacer entièrement l’imagerie ; la note conserve la lecture littérale.
- issue: Valeur du titre እግዚአ ስብሐት
  choice: le Seigneur de gloire
  alternative: le Seigneur de splendeur
  rationale: « Gloire » correspond au vocabulaire biblique français usuel, tandis que « splendeur » reste possible et est signalé en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le ton narratif visionnaire. « Figures » évite l’étrangeté trompeuse de « faces » dans le corps du texte, tandis que la note préserve l’image et l’ambiguïté de l’original.
