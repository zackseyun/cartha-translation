base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: fr
  text: Et, aux quatre côtés du Seigneur des esprits, je vis quatre autres visages[a], différents de ceux qui ne dorment pas. J’appris leurs noms, car l’ange qui était venu avec moi me les fit connaître et me montra toutes les choses cachées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre autres apparences ». Le guèze emploie littéralement le mot « visages » et maintient ainsi l’image concrète de la vision.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire par « toutes les choses secrètes » : dans les visions apocalyptiques, l’expression désigne des mystères célestes révélés au voyant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ
  choice: aux quatre côtés
  rationale: ክነፍ peut désigner une aile, mais aussi un bord, une extrémité ou un côté. Ici, la description spatiale autour du Seigneur des esprits favorise « côtés » et évite de lui attribuer explicitement des ailes.
- source_word: ለእግዚአ መናፍስት
  choice: du Seigneur des esprits
  rationale: Ce titre divin récurrent dans 1 Hénoch est traduit de manière transparente, sans préciser si les esprits visés constituent un groupe particulier ou l’ensemble des esprits.
- source_word: አርባዕተ ገጸ ካልአ
  choice: quatre autres visages
  rationale: ገጽ signifie normalement « visage ». Ce choix conserve l’image visible et concrète du texte, même si les noms mentionnés ensuite montrent qu’il s’agit d’êtres personnels.
- source_word: እምነ እለ ኢይነውሙ
  choice: différents de ceux qui ne dorment pas
  rationale: La proposition relative qualifie « ceux » et distingue les quatre visages des êtres vigilants évoqués auparavant.
- source_word: አእመርኩ
  choice: J’appris
  rationale: Le verbe exprime ici l’accès à une connaissance communiquée par l’ange dans la suite du récit.
- source_word: ዘአይድዐኒ አስማቲሆሙ
  choice: me les fit connaître
  rationale: 'La reprise pronominale naturelle en français conserve le sens causatif : l’ange rend leurs noms connus au voyant.'
- source_word: ኅቡኣተ
  choice: les choses cachées
  rationale: Cette formulation garde le sens concret du terme et son emploi apocalyptique pour des réalités célestes jusque-là dissimulées.
theological_decisions:
- issue: Traduction du titre divin እግዚአ መናፍስት
  choice: Seigneur des esprits
  alternative: Seigneur des Esprits
  rationale: La minuscule à « esprits » traite le complément comme un nom commun et préserve l’ambiguïté du texte quant à l’identité ou à l’étendue des esprits concernés.
- issue: Identification des quatre « visages »
  choice: Maintenir « visages » sans expliciter leur nature
  alternative: quatre autres présences ou êtres
  rationale: Le texte les présente comme des réalités personnelles ayant des noms, mais son vocabulaire demeure visuel. La traduction ne tranche donc pas davantage leur nature ou leur rang céleste.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La phrase conserve la répétition visionnaire et la tension entre l’image de « visages » et le caractère personnel des êtres nommés.
