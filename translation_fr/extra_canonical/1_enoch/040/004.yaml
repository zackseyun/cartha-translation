  text: The voice of the first blesses the Lord of Spirits forever and ever[a][b].
translation:
  language: fr
  text: La voix du premier bénit le Seigneur des esprits pour toujours et à jamais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’âge des âges » ; expression désignant une durée sans fin.'
    reason: idiome_source
lexical_decisions:
- source_word: ቃለ
  choice: la voix de
  rationale: La forme construite signifie ici « voix de ». Dans cette scène visionnaire et liturgique, « voix » rend naturellement la parole entendue sans effacer le lien grammatical avec celui qui parle.
- source_word: ቀዳማዊ
  choice: du premier
  rationale: L’adjectif ordinal substantivé désigne le premier parmi les quatre êtres présents évoqués dans le contexte. Cette formulation respecte mieux la construction guèze que « la première voix ».
- source_word: ይባርኮ
  choice: bénit
  rationale: Le présent convient au compte rendu visionnaire et ne précise pas excessivement l’aspect verbal.
- source_word: ለእግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette expression conserve le titre divin caractéristique du livre, dans un français naturel et solennel.
- source_word: ለዓለመ ዓለም
  choice: pour toujours et à jamais
  rationale: Cette tournure française rend l’intensification répétitive de l’expression guèze désignant une durée sans fin.
theological_decisions:
- issue: Rendu du titre divin ለእግዚአ መናፍስት
  choice: le Seigneur des esprits
  alternative: le Maître des esprits
  rationale: « Seigneur » préserve le poids théologique et la fonction de titre de l’expression, sans lui imposer une interprétation confessionnelle particulière.
- issue: Identification du premier locuteur
  choice: du premier
  alternative: la première voix
  rationale: Le texte rattache grammaticalement la voix au premier des êtres présents plutôt que de simplement numéroter les voix. La traduction conserve ce lien tout en laissant au contexte l’identification précise de cet être.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du guèze tout en étant naturelle ; le titre divin et le caractère liturgique de la scène sont préservés.
