base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: fr
  text: Observez comment les arbres se couvrent de feuilles vertes et portent du fruit. Soyez attentifs à toutes ces choses et sachez que Celui qui vit éternellement les a toutes faites.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme verbale éthiopienne traduite par « les a toutes faites » est difficile dans le texte transmis et pourrait, prise isolément, se lire « vous avez fait ». Le contexte et l’ancien témoignage grec soutiennent toutefois le sens retenu.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « celui qui vit pour toujours ». Une autre analyse, moins probable, comprendrait la fin de la phrase comme une référence aux « vivants pour toujours ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: Observez comment
  rationale: Le verbe est un impératif pluriel et እፎ signifie ici « comment ». Dans ce contexte d’examen de la création, « Observez comment » rend naturellement l’invitation à considérer les arbres.
- source_word: ዕፀው
  choice: les arbres
  rationale: Désigne les arbres ou plantes ligneuses; « les arbres » convient au référent concret et générique.
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: se couvrent de feuilles vertes
  rationale: L’expression décrit les arbres revêtus ou couverts de feuillage vert. La tournure pronominale conserve l’image tout en restant naturelle en français.
- source_word: ወይፈሪዩ
  choice: et portent du fruit
  rationale: Rendu français idiomatique du verbe décrivant la production de fruit par les arbres.
- source_word: ወለበዉ በእንተ ኵሉ
  choice: Soyez attentifs à toutes ces choses
  rationale: L’impératif pluriel appelle les destinataires à considérer l’ensemble des phénomènes observés. Cette formulation évite de faire des arbres le sujet du verbe.
- source_word: ወአእምሩ በከመ
  choice: et sachez que
  rationale: L’impératif pluriel introduit ce que les lecteurs doivent reconnaître ou savoir.
- source_word: ዘሕያው ለዓለም
  choice: Celui qui vit éternellement
  rationale: La construction désigne très probablement Dieu comme celui qui vit à jamais. La périphrase conserve la forme du texte sans ajouter un titre confessionnel.
- source_word: ገበርክሙ ለአሉንቱ ኵሎሙ
  choice: les a toutes faites
  rationale: Le texte transmis présente une difficulté morphologique, mais le contexte et l’ancien témoignage parallèle soutiennent l’idée que Celui qui vit éternellement a fait toutes ces choses. Le pronom féminin pluriel reprend naturellement « ces choses ».
theological_decisions:
- issue: Référent de ዘሕያው ለዓለም
  choice: Celui qui vit éternellement
  alternative: les vivants pour toujours
  rationale: La syntaxe et le contexte favorisent nettement un sujet singulier divin, auteur de la création. L’autre analyse a existé dans la transmission moderne, mais elle s’accorde moins bien avec les impératifs et la structure de la phrase; elle est néanmoins signalée en note.
- issue: Forme difficile ገበርክሙ et agent de la création
  choice: Celui qui vit éternellement les a toutes faites
  alternative: vous avez fait toutes ces choses
  rationale: La forme éthiopienne transmise peut sembler porter une terminaison de deuxième personne du pluriel, mais cette lecture produit ici une incohérence. Le contexte et le témoignage parallèle indiquent une corruption textuelle et soutiennent un verbe ayant « Celui qui vit éternellement » pour sujet.
translation_notes:
  register: 'Français international moderne, clair et digne. Les impératifs au pluriel s’adressent directement aux lecteurs. La répétition sémantique des deux appels à comprendre et à savoir est conservée sous une forme française fluide : « Soyez attentifs… et sachez… ».'
