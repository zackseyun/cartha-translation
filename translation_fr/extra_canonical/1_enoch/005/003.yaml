lexical_decisions:
- source_word: ርእዩ
  choice: Voyez
  rationale: Impératif pluriel qui conserve l’appel direct à observer la création.
- source_word: እፎ
  choice: comment
  rationale: Introduit ici, de manière exclamative, ce qui doit être observé.
- source_word: አብሕርት
  choice: les mers
  rationale: Pluriel de ባሕር, « mer » ; ce sens correspond au catalogue des réalités naturelles.
- source_word: ወአፍላግ
  choice: et les fleuves
  rationale: Le pluriel de ፈልግ désigne des cours d’eau ou des fleuves ; « fleuves » forme un couple naturel avec « mers ».
- source_word: ኅቡረ
  choice: ensemble
  rationale: Rend le sens adverbial d’une action concertée ou conjointe.
- source_word: ይፌጽሙ
  choice: accomplissent
  rationale: Exprime l’idée de mener à son terme ou de remplir l’activité qui leur revient, dans un français naturel.
- source_word: ግብሮሙ
  choice: leur œuvre
  rationale: Désigne l’activité propre aux mers et aux fleuves ; « œuvre » garde ici un registre digne sans moraliser le terme.
