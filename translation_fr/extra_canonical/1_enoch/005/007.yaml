base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: fr
  text: Et pour ceux qui ont été choisis, il y aura lumière, joie et paix, et ils hériteront de la terre[a]. Mais pour vous, les méchants, il y aura une malédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot guèze peut désigner aussi bien la terre que le pays; le contexte apocalyptique favorise ici « la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: ceux qui ont été choisis
  rationale: Le pluriel désigne les personnes choisies. Cette formulation est naturelle en français moderne et évite la coloration doctrinale plus marquée que pourrait avoir « les élus ».
- source_word: ብርሃን
  choice: lumière
  rationale: C’est le sens premier du terme et il conserve pleinement l’image de la formule de bénédiction.
- source_word: ፍሥሐ
  choice: joie
  rationale: Rendu direct, clair et digne dans la série « lumière, joie et paix ».
- source_word: ሰላም
  choice: paix
  rationale: Le mot peut évoquer aussi le bien-être ou la plénitude, mais « paix » est ici le rendu le plus transparent.
- source_word: ይወርስዋ ለምድር
  choice: ils hériteront de la terre
  rationale: Le verbe exprime l’héritage ou la prise de possession, tandis que ምድር peut désigner la terre ou un pays. Le contexte apocalyptique favorise la portée globale de « la terre ».
- source_word: ረሲዓን
  choice: les méchants
  rationale: Cette désignation morale et judiciaire maintient le contraste avec ceux qui ont été choisis sans substituer la notion distincte de pécheurs.
- source_word: ርገመት
  choice: une malédiction
  rationale: Le substantif désigne une malédiction; cette formulation convient naturellement à l’annonce du jugement.
theological_decisions:
- issue: Portée de ምድር
  choice: la terre
  alternative: le pays
  rationale: Le terme peut avoir les deux sens, mais la rhétorique cosmique et judiciaire du contexte favorise « la terre ». L’autre possibilité est conservée en note.
- issue: Désignation exprimée par ሕሩያን
  choice: ceux qui ont été choisis
  alternative: les élus
  rationale: Le choix retenu exprime clairement la sélection dont ce groupe fait l’objet tout en évitant d’importer les connotations de systèmes doctrinaux ultérieurs.
- issue: Structure du contraste
  choice: Et pour ceux qui ont été choisis… Mais pour vous…
  alternative: Mais pour ceux qui ont été choisis… Mais pour vous…
  rationale: Le premier membre commence par la conjonction simple ወ, tandis que la nuance adversative est explicitement portée par -ሰ dans le second membre. La traduction distingue donc « Et » de « Mais ».
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve le parallélisme de l’original, ainsi que l’opposition entre la destinée de ceux qui ont été choisis et celle des méchants.
