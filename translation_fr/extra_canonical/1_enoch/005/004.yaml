base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: fr
  text: Mais vous, vous n’avez pas persévéré et vous n’avez pas obéi au commandement du Seigneur. Au contraire, vous vous êtes détournés et, de vos bouches impures, vous avez proféré contre sa grandeur[a] des paroles arrogantes et dures. Vous qui avez le cœur endurci, vous n’aurez pas de paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa majesté ». Le terme désigne ici la grandeur exaltée de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ici, la « paix » peut comprendre non seulement le calme intérieur, mais aussi le bien-être, la sécurité et une issue favorable.
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: vous n’avez pas persévéré
  rationale: Le verbe exprime l’endurance ferme et continue. « Persévéré » rend cette dimension morale plus naturellement en français que « enduré » employé sans complément.
- source_word: ትእዛዘ እግዚእ
  choice: au commandement du Seigneur
  rationale: Le singulier du guèze est conservé. La tournure « obéir au commandement » exprime idiomatiquement le fait de faire ce qui est commandé, sans élargir le texte aux « commandements » en général.
- source_word: ተዓደውክሙ
  choice: vous vous êtes détournés
  rationale: Le verbe évoque ici une déviation ou une défection morale. Cette traduction préserve cette image sans imposer le vocabulaire juridique de la transgression.
- source_word: ሐመይክሙ
  choice: vous avez proféré
  rationale: Dans cette construction, le verbe introduit une parole hostile ou dénigrante. « Proféré » garde la vigueur de l’accusation, tandis que les adjectifs qui suivent précisent la nature des paroles.
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: des paroles arrogantes et dures
  rationale: Dans ce contexte de discours dirigé contre Dieu, ዓበይተ désigne des paroles hautaines; ድሩካተ les qualifie de dures ou offensantes. La formulation française reste concise et forte.
- source_word: ርኵሳት
  choice: impures
  rationale: « Impures » conserve les résonances morales et cultuelles du terme dans une dénonciation apocalyptique.
- source_word: ዕበዩ ዚአሁ
  choice: sa grandeur
  rationale: Traduction directe de l’expression désignant le statut exalté de Dieu, sans introduire un terme théologique plus spécialisé.
- source_word: ይቡሳነ ልብ
  choice: vous qui avez le cœur endurci
  rationale: Cette formule conserve l’image biblique de l’insensibilité et de l’obstination morales, tout en produisant une apostrophe naturelle en français.
- source_word: ኢትከውኑክሙ ሰላም
  choice: vous n’aurez pas de paix
  rationale: La formulation garde le terme traditionnel « paix » et sa portée ouverte, qui peut inclure la sécurité, le bien-être et une issue favorable.
theological_decisions:
- issue: Portée de la négation finale de la paix
  choice: vous n’aurez pas de paix
  alternative: il n’y aura pour vous aucun bien-être
  rationale: Dans une sentence de jugement apocalyptique, la paix ne se réduit probablement pas au calme intérieur. Conserver « paix » maintient volontairement sa portée biblique plus large sans la définir trop étroitement.
- issue: Sens de la parole dirigée contre la grandeur divine
  choice: vous avez proféré […] des paroles arrogantes et dures
  alternative: vous avez calomnié sa grandeur par des paroles arrogantes et dures
  rationale: Le contexte comporte une parole hostile, mais la syntaxe et les adjectifs permettent de garder une formulation qui n’impose pas plus précisément la notion de calomnie. La tension lexicale est préservée sans affaiblir la dénonciation.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme prophétique est maintenu par le contraste « Au contraire » et par l’apostrophe finale. Les répétitions lourdes et les calques syntaxiques du guèze sont évités sans effacer les images bibliques.
