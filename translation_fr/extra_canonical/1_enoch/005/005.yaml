base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: fr
  text: Et à cause de cela, vous maudirez vos jours et vous abrégerez les années de votre vie ; les années de votre ruine se multiplieront[a] sous une malédiction éternelle, et il n’y aura pour vous aucune miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « les années de votre ruine se multiplieront » est difficile. On peut aussi comprendre : « les années de votre destruction augmenteront » ou « les années de votre perte se multiplieront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእንተዝ
  choice: Et à cause de cela
  rationale: Conserve explicitement le lien causal avec l’accusation qui précède, dans un français naturel.
- source_word: መዋዕሊክሙ ትረግሙ
  choice: vous maudirez vos jours
  rationale: 'Le verbe est rendu comme un actif à la deuxième personne du pluriel : les destinataires maudissent leurs propres jours dans leur détresse.'
- source_word: ዓመታት ሕይወትክሙ ትኃጕሉ
  choice: vous abrégerez les années de votre vie
  rationale: Respecte la deuxième personne du pluriel active de ትኃጕሉ, confirmée par le témoin grec ἀπολεῖτε, tout en exprimant naturellement en français la perte ou la réduction des années de vie.
- source_word: ዓመታት ኀጕልክሙ
  choice: les années de votre ruine
  rationale: Le substantif, apparenté au verbe précédent, désigne la ruine, la perte ou la destruction. « Ruine » préserve l’ambiguïté sans imposer une annihilation physique.
- source_word: ይበዝኅ
  choice: se multiplieront
  rationale: Rend l’idée de devenir nombreux ou d’augmenter et conserve l’image paradoxale d’une ruine prolongée.
- source_word: በርገመት ዘለዓለም
  choice: sous une malédiction éternelle
  rationale: « Sous » exprime naturellement la condition imposée par la malédiction ; « éternelle » maintient la force apocalyptique de ዘለዓለም.
- source_word: ወኢይከውነክሙ ሣህል
  choice: et il n’y aura pour vous aucune miséricorde
  rationale: Reproduit la tournure existentielle négative et sa solennité, sans l’adoucir en simple absence de compassion humaine.
theological_decisions:
- issue: Les destinataires maudissent-ils leurs propres jours, ou sont-ils maudits par d’autres ?
  choice: Ils maudissent eux-mêmes leurs jours dans leur détresse sous le jugement.
  alternative: Leurs jours sont maudits, ou d’autres les maudissent.
  rationale: La forme verbale guèze se lit le plus naturellement comme un actif à la deuxième personne du pluriel.
- issue: Portée de ዘለዓለም dans la formule de malédiction
  choice: malédiction éternelle
  alternative: malédiction perpétuelle ou pour un âge
  rationale: Dans ce contexte apocalyptique de jugement, « éternelle » conserve le poids et la finalité de l’expression sans ajouter de formulation doctrinale ultérieure.
- issue: Agent et sens de l’abrègement des années de vie
  choice: vous abrégerez les années de votre vie
  alternative: les années de votre vie disparaîtront / périront
  rationale: La forme verbale est active à la deuxième personne du pluriel. La traduction maintient cette grammaire sans préciser davantage le mécanisme de cette perte.
translation_notes:
  register: Français international moderne, digne et solennel. Le parallélisme du jugement est conservé, de même que la difficulté de l’expression relative aux « années de votre ruine ». Le point-virgule marque le passage de l’action des destinataires à la conséquence durable.
