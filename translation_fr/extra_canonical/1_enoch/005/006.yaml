base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: fr
  text: En ces jours-là, vos noms seront livrés à une malédiction éternelle parmi tous les justes[a], et les pécheurs vous maudiront ; vous serez associés aux pécheurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut signifier que vos noms deviendront une formule employée pour prononcer des malédictions, signe public de honte et de jugement. On peut aussi traduire : « pour tous les justes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous serez comptés parmi les pécheurs » ; littéralement, l’expression évoque une association avec eux.'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique naturelle en français, qui conserve le pluriel et le registre prophétique.
- source_word: ትሁቡ፡ ስመ፡ ዚአክሙ
  choice: vos noms seront livrés
  rationale: Le verbe est compris comme un futur passif, conformément à la forme guèze ; « livrés » exprime ici l'affectation des noms à une destinée de honte sans transformer le passif en actif.
- source_word: በርገመት፡ ዘለዓለም
  choice: à une malédiction éternelle
  rationale: Rend la destination ou le résultat associé aux noms tout en gardant la force judiciaire et apocalyptique de l'expression.
- source_word: ለኵሉ፡ ጻድቃን
  choice: parmi tous les justes
  rationale: « Parmi » donne en français un sens intelligible au domaine dans lequel ces noms servent de formule de malédiction, tout en reconnaissant que la préposition guèze peut aussi se rendre par « pour » ou « à ».
- source_word: ወኪያክሙ፡ ይረግሙ፡ ኃጥኣን
  choice: et les pécheurs vous maudiront
  rationale: 'Le pronom indépendant ኪያክሙ est pris comme complément d''objet direct pluriel : les pécheurs maudissent les destinataires.'
- source_word: ተኅቡረ፡ ምስለ፡ ኃጥኣን
  choice: vous serez associés aux pécheurs
  rationale: Formulation française naturelle qui conserve l'idée d'association ou de regroupement sans préciser indûment s'il s'agit d'une compagnie, d'un classement judiciaire ou d'un destin commun.
theological_decisions:
- issue: Fonction des noms dans la formule de malédiction
  choice: Les noms des condamnés deviennent une formule ou un exemple de malédiction parmi les justes.
  alternative: Les noms sont simplement voués à la malédiction prononcée directement par les justes.
  rationale: La mention explicite des « noms » favorise l'image d'un nom devenu symbole public de honte et de jugement, mais la note maintient la portée idiomatique sans l'imposer dans le corps du texte.
- issue: Rapport final avec les pécheurs
  choice: Les destinataires seront associés aux pécheurs, sans préciser la nature exacte de cette association.
  alternative: Ils seront comptés parmi les pécheurs ou partageront explicitement leur sort.
  rationale: Le contexte de jugement peut suggérer un destin commun, mais l'expression source reste assez large ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme prophétique est conservé, tandis que les formulations inutilement lourdes comme « il y aura pour vous une réunion avec » sont remplacées par une tournure naturelle. Les ambiguïtés portant sur la préposition devant « tous les justes » et sur la nature de l'association finale sont signalées en notes.
