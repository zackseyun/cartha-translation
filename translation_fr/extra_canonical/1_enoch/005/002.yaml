- from: Ses œuvres sont devant lui pour chaque année à venir[a], et toutes ses œuvres se soumettent à lui sans changer ; tout s’accomplit selon l’ordre établi par Dieu[b].
  to: Ses œuvres sont devant lui pour chaque année à venir[a], et toutes ses œuvres lui sont soumises et ne changent pas ; mais, comme Dieu l’a ordonné[b], ainsi tout s’accomplit.
  rationale: La révision conserve les choix lexicaux fondamentaux, tout en rétablissant dans la dernière proposition la formulation comparative et verbale du texte source. Elle améliore aussi la clarté syntaxique de la relation des œuvres à Dieu et de leur immutabilité.
