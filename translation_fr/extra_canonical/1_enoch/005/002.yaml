base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: fr
  text: Ses œuvres sont devant lui pour chaque année à venir[a], et toutes ses œuvres lui sont soumises et ne changent pas ; mais, comme Dieu l’a ordonné[b], ainsi tout s’accomplit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour chacune des années qui viendront ». L’expression guèze désigne le cours continu des années futures.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme Dieu l’a établi » ou « comme Dieu l’a fixé ». Le verbe évoque ce que Dieu a ordonné, établi ou prescrit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: ses œuvres
  rationale: Le nom désigne les œuvres, actes ou actions. « Œuvres » convient au contexte de l’ordre cosmique et permet de conserver la répétition du terme.
- source_word: ቅድሜሁ
  choice: devant lui
  rationale: Cette formulation garde l’image spatiale et relationnelle de la création placée en présence de Dieu, dans un registre digne et naturel.
- source_word: ለለ ዓመት ዘይከውን
  choice: pour chaque année à venir[a]
  rationale: La phrase évoque la succession continue des années futures. Cette traduction est plus naturelle en français moderne qu’une formulation littérale comme « chaque année qui sera ».
- source_word: ይትቀነይ ሎቱ
  choice: se soumettent à lui
  rationale: Le verbe exprime ici le service, l’obéissance ou la conformité à un ordre. « Se soumettent à lui » rend clairement la relation personnelle et ordonnée sans imposer l’image plus étroite d’un service cultuel.
- source_word: ኢይትመየጥ
  choice: sans changer
  rationale: L’expression indique la stabilité et l’absence de variation dans l’ordre créé. La tournure française rattache naturellement cette idée au verbe précédent.
- source_word: ሠርዐ አምላክ
  choice: l’ordre établi par Dieu[b]
  rationale: Le verbe peut signifier ordonner, fixer ou établir. La formulation nominale exprime l’ordonnance divine qui régit le cosmos tout en restant idiomatique.
- source_word: ይትገበር ኵሉ
  choice: tout s’accomplit
  rationale: Cette expression passive résume la réalisation de ce que Dieu a ordonné. « S’accomplit » est naturel, digne et moins mécanique que « est fait ».
theological_decisions:
- issue: Référent des suffixes de la troisième personne dans « ses œuvres » et « lui »
  choice: 'Les suffixes renvoient à Dieu : le verset parle des œuvres de Dieu dans la création.'
  alternative: Ils pourraient théoriquement renvoyer à un autre antécédent du contexte immédiat, comme le ciel ou un élément créé.
  rationale: La mention explicite de Dieu dans la dernière proposition et le thème de l’ordre annuel stable favorisent fortement Dieu comme référent, sans qu’il soit nécessaire d’ajouter son nom avant le texte source.
- issue: Nature de la relation exprimée par ይትቀነይ ሎቱ
  choice: « se soumettent à lui », au sens de conformité des œuvres créées à l’autorité divine.
  alternative: « le servent », « sont ordonnées pour lui » ou « lui obéissent ».
  rationale: Le choix conserve la dimension d’obéissance et d’ordre sans réduire le verbe au service religieux ni expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du guèze, mais la dernière proposition est réorganisée pour éviter une tournure lourde. La répétition de « ses œuvres » est conservée, tandis que « sans changer » rend de façon fluide leur stabilité.
