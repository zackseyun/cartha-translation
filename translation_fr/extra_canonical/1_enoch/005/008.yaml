base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: fr
  text: Alors, la sagesse sera donnée à ceux qui ont été choisis[a]. Tous ceux-là vivront et ne pécheront plus, ni par impiété ni par orgueil. Au contraire, ceux qui possèdent la sagesse seront humbles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux élus ».
    reason: Alternative lexicale pour ሕሩያን.
  - marker: b
    text: 'La dernière proposition peut aussi se comprendre ainsi : « mais ils seront humbles, parce que la sagesse leur appartient ».'
    reason: La relation syntaxique entre la possession de la sagesse et l'humilité peut être lue comme une identification ou comme une cause.
lexical_decisions:
- source_word: እሜሃ
  choice: Alors
  rationale: Marque naturellement la succession temporelle dans le contexte apocalyptique, sans préciser davantage que le texte.
- source_word: ይትወሀቦሙ ለሕሩያን ጥበብ
  choice: la sagesse sera donnée à ceux qui ont été choisis
  rationale: Le passif présente la sagesse comme un don reçu. « Ceux qui ont été choisis » est clair en français moderne et évite les connotations doctrinales parfois attachées à « les élus ».
- source_word: ኵሎሙ እሉንቱ የሐይዉ
  choice: Tous ceux-là vivront
  rationale: Conserve la valeur démonstrative et l'affirmation simple de la vie, sans expliciter la nature de celle-ci.
- source_word: ወኢይደግሙ አብሶ
  choice: et ne pécheront plus
  rationale: Rend idiomatiquement la négation et l'idée de répétition ou de reprise du péché.
- source_word: እበረሲዕ ወእበኅዕቢት
  choice: ni par impiété ni par orgueil
  rationale: Préserve les dimensions religieuse et morale des deux termes ainsi que leur coordination.
- source_word: አላ ይገንዩ
  choice: Au contraire, … seront humbles
  rationale: Exprime nettement le contraste avec l'impiété et l'orgueil, dans un registre naturel et digne.
- source_word: ዘቦሙ ጥበበ
  choice: ceux qui possèdent la sagesse
  rationale: Rend la construction relative comme une désignation de ceux qui ont la sagesse, tout en maintenant le lien entre sagesse et humilité.
theological_decisions:
- issue: Désignation ሕሩያን
  choice: ceux qui ont été choisis
  alternative: les élus
  rationale: La formulation retenue garde le sens d'un groupe choisi dans le cadre apocalyptique sans importer inutilement une terminologie systématique postérieure.
- issue: Portée de l'affirmation concernant le péché
  choice: ne pécheront plus, ni par impiété ni par orgueil
  alternative: ne commettront plus les péchés particuliers d'impiété et d'orgueil
  rationale: La traduction conserve l'affirmation générale suivie des vices nommés, sans réduire ni développer sa portée théologique.
- issue: Rapport entre sagesse et humilité dans la dernière proposition
  choice: ceux qui possèdent la sagesse seront humbles
  alternative: ils seront humbles, parce que la sagesse leur appartient
  rationale: La syntaxe peut identifier les personnes humbles comme celles qui possèdent la sagesse, tandis qu'une lecture causale reste possible; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation répartit les propositions pour faciliter la lecture, sans effacer leur progression. « Impiété » est conservé pour sa précision religieuse; les formulations plus confessionnelles sont évitées.
