base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/009.yaml
  text: And they shall not again sin[c][b][a], and they shall not be condemned all the days of their life.
translation:
  language: fr
  text: Ils ne pécheront plus[a] et ne seront pas condamnés tout au long de leur vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne pécheront pas de nouveau ». Le guèze exprime l’idée de répétition ou de continuation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይደግሙ አብሶ
  choice: ils ne pécheront plus
  rationale: Le verbe négatif exprime la répétition ou la continuation, tandis que አብሶ renvoie au péché. « Ne… plus » rend naturellement en français l’idée qu’ils ne recommenceront pas à pécher et maintient la répétition de la même formule en 1 Hénoch 5:8-9.
- source_word: ኢይትኴነኑ
  choice: ne seront pas condamnés
  rationale: La tournure passive possède ici une valeur judiciaire. « Condamnés » en conserve la force mieux que le terme plus général « punis ».
- source_word: ኵሎ መዋዕለ ሕይወቶሙ
  choice: tous les jours de leur vie
  rationale: Cette expression temporelle de style sémitique se transpose directement et naturellement en français, avec « vie » au singulier malgré le possesseur pluriel.
theological_decisions:
- issue: La relation entre la transformation morale annoncée et le verdict judiciaire
  choice: Le premier membre promet qu’ils ne pécheront plus; le second affirme qu’ils ne seront pas condamnés.
  alternative: Comprendre le premier membre comme « ils ne feront plus le mal » et le second comme « ils ne seront pas punis ».
  rationale: Le texte distingue la conduite liée au péché du jugement de condamnation. La traduction préserve cette tension éthique et judiciaire sans réduire l’un des membres à l’autre.
translation_notes:
  register: Français international moderne, simple et digne. Le futur convient au caractère de promesse; « tous les jours de leur vie » conserve l’idiome de la source tout en restant naturel en français.
