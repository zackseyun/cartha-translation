base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: fr
  text: Et la septième montagne se trouvait au milieu de celles-ci[a] ; elle les dépassait toutes en hauteur, ressemblant à un siège de trône[b]. Des arbres parfumés l’entouraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien transmis est difficile dans la phrase relative à la hauteur et à la ressemblance. Un témoin grec en préserve clairement le sens : la septième montagne dépassait les autres en hauteur.'
    reason: textual_variant
  - marker: b
    text: Littéralement « siège de trône » ; cette expression conserve les deux termes du texte au lieu de les simplifier en « trône ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕ ደብር
  choice: la septième montagne
  rationale: L’adjectif ordinal introduit la dernière montagne de la série; « montagne » convient au paysage élevé de la vision.
- source_word: ማእከሎሙ ለእሎንቱ
  choice: au milieu de celles-ci
  rationale: Cette formulation conserve le démonstratif et situe précisément la septième montagne par rapport aux précédentes.
- source_word: ኖኆሙ ዘይትማሰሉ [ኵሎሙ]
  choice: Elle les dépassait toutes en hauteur
  rationale: Le texte éthiopien transmis est difficile, mais la leçon grecque parallèle atteste clairement l’idée qu’elle dominait les autres par sa hauteur; « toutes » rend le mot entre crochets sans masquer son statut textuel.
- source_word: መንበረ አትራኖስ
  choice: siège d’un trône
  rationale: La traduction maintient la double expression du guèze — « siège » puis « trône » — au lieu de la réduire au seul mot « trône ».
- source_word: የአውድዎ
  choice: l’entouraient
  rationale: Le verbe exprime l’action d’être disposé tout autour de la montagne.
- source_word: ዕጸወ መዓዛ
  choice: arbres odorants
  rationale: Cette expression française naturelle conserve l’accent sensoriel du syntagme « arbres de parfum ».
