  yaml_path: translation/extra_canonical/1_enoch/024/004.yaml
  text: And among them was a tree whose fragrance I had never smelled[a][b].
translation:
  language: fr
  text: Et parmi eux se trouvait un arbre dont je n’avais jamais senti le parfum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription éthiopienne paraît fautive à la fin de la phrase. La lecture probable signifie « que je n’avais jamais senti », conformément au témoin grec; il n’est pas question de myrrhe.
    reason: textual_variant
lexical_decisions:
- source_word: ወሀሎ
  choice: se trouvait
  rationale: Le verbe exprime ici l’existence ou la présence; « se trouvait » convient naturellement à la description de la vision.
- source_word: እምውስቴቶሙ
  choice: parmi eux
  rationale: La locution situe l’arbre au milieu du groupe d’arbres décrit auparavant.
- source_word: ዕፅ
  choice: un arbre
  rationale: Dans ce cadre végétal et visionnaire, le sens concret « arbre » est le plus approprié.
- source_word: ዘአልቦ ገሙራ
  choice: jamais
  rationale: Avec la négation, ገሙራ a ici une valeur adverbiale (« du tout », « jamais »), et ne désigne pas un parfum.
- source_word: አመ
  choice: dans la tournure « je n’avais jamais senti »
  rationale: Dans cet idiome, le mot contribue à la valeur temporelle de la proposition plutôt qu’à une comparaison.
- source_word: ጼወኒ
  choice: j’avais senti
  rationale: La leçon transcrite paraît être une erreur de lecture pour ጼኖኩ, « j’ai senti ». Cette correction est appuyée par le témoin grec et donne une phrase cohérente.
theological_decisions:
- issue: Qualité distinctive de l’arbre
  choice: Le narrateur affirme n’avoir jamais auparavant senti son parfum.
  alternative: Comparer le parfum de l’arbre à la myrrhe.
  rationale: La lecture « myrrhe » repose sur une mauvaise analyse de la transcription. La correction probable ጼኖኩ (« j’ai senti »), confirmée par le grec ὃ οὐδέποτε ὤσφρανμαι, soutient clairement l’idée d’une odeur jamais sentie auparavant.
translation_notes:
  register: Français international moderne, naturel et digne. « Parfum » rend explicite l’objet implicite du verbe « sentir » et indique une odeur agréable dans ce contexte botanique.
