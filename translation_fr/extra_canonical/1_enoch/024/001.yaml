base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: fr
  text: Puis, de là, je me rendis dans un autre lieu de la terre, et il me montra[a] une montagne de feu qui flamboyait jour et nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « il me montra » n’est pas nommé dans le texte guèze; le contexte suggère qu’il s’agit du guide angélique d’Hénoch.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: de là
  rationale: Marque la poursuite spatiale du voyage visionnaire dans une formulation française claire et actuelle.
- source_word: ሖርኩ
  choice: je me rendis
  rationale: Exprime simplement le déplacement à la première personne tout en convenant au registre narratif soutenu du récit.
- source_word: ካልአ መካነ ምድር
  choice: un autre lieu de la terre
  rationale: Conserve la construction concrète et la portée cosmico-géographique de l’expression guèze, sans la réduire à une simple région.
- source_word: አርአየኒ
  choice: il me montra
  rationale: Rend directement le verbe de vision; le sujet masculin reste non identifié dans ce verset, comme en guèze.
- source_word: ደብረ እሳት
  choice: une montagne de feu
  rationale: Préserve l’image apocalyptique frappante et la construction nominale de la source.
- source_word: ዘያንበለብል
  choice: qui flamboyait
  rationale: La proposition relative et l’imparfait rendent l’action ardente et continue décrite par la forme guèze.
- source_word: መዐልተ ወሌሊተ
  choice: jour et nuit
  rationale: Reproduit avec concision la paire temporelle qui exprime la continuité.
theological_decisions:
- issue: Sujet implicite de « il me montra »
  choice: Conserver « il » sans identifier explicitement le sujet.
  alternative: « l’ange me montra » ou « mon guide me montra »
  rationale: Le contexte peut désigner le guide angélique, mais le verset lui-même ne le nomme pas; l’indétermination de la source est donc maintenue.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif littéraire; « flamboyait » garde la vivacité et la durée de la vision sans ajouter d’interprétation.
