    issue: Le début « Je me dirigeai de ce côté » ne rend pas le possessif de መንገሌሁ.
    rationale: Le syntagme signifie littéralement « mon chemin / ma route »; il s’agit de la progression du voyant, pas d’une direction déictique.
  - severity: medium
    issue: « Entre elles s’étendaient » ajoute une relation spatiale non explicitement exprimée.
    rationale: La syntaxe guèze de la description des ravins est reconnue comme difficile; il convient de ne pas préciser qu’ils se situent entre les montagnes ou les groupes.
  - severity: low
    issue: « Précieuses » pour les pierres peut suggérer une valeur gemmologique absente du texte.
    rationale: Le même adjectif qualifie les montagnes et leurs pierres dans un registre de splendeur; « magnifiques » conserve cette valeur sans spécialisation excessive.
