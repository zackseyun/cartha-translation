base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: fr
  text: Je poursuivis mon chemin et vis sept montagnes majestueuses, toutes différentes les unes des autres. Leurs pierres étaient magnifiques et belles ; toutes avaient une apparence majestueuse et splendide, et leur visage était beau[a]. Trois se trouvaient du côté de l’est, disposées l’une au-dessus de l’autre, et trois du côté du nord, disposées l’une au-dessus de l’autre, avec des ravins profonds et sinueux, sans qu’aucun ne s’approche d’un autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et leur visage était beau ». Le texte décrit les montagnes au moyen d’une image presque personnifiée.'
    reason: cultural_note
  - marker: b
    text: La construction guèze de la dernière description est difficile. Elle semble indiquer que les ravins, profonds et sinueux, ne se rapprochaient pas les uns des autres.
    reason: textual_variant
lexical_decisions:
- source_word: ሖርኩ መንገሌሁ
  choice: Je me dirigeai de ce côté
  rationale: Le verbe exprime le déplacement du voyant, et መንገሌሁ indique ici une direction (« vers ce côté-là / vers cela »). Cette formulation française maintient la progression de la vision sans confondre le suffixe avec « mon chemin ».
- source_word: ሰብዐተ አድባረ ክቡራነ
  choice: sept montagnes majestueuses
  rationale: አድባር désigne des montagnes, tandis que ክቡር peut évoquer la dignité, la magnificence ou la gloire. « Majestueuses » convient naturellement au paysage tout en gardant le registre élevé.
- source_word: ወኵሉ ፩እምነ ፩እንዘ ይትዌለጥ
  choice: toutes différentes les unes des autres
  rationale: La proposition souligne la distinction entre les sept montagnes. Le pluriel français est plus naturel que la reprise distributive littérale tout en conservant le sens.
- source_word: እእባኒ ክቡራነ ወሠናያነ
  choice: Leurs pierres étaient précieuses et belles
  rationale: Pour des pierres, ክቡር peut naturellement signifier « précieux » plutôt que répéter « majestueux » ; ሠናይ exprime leur beauté.
- source_word: ወኵሉ ክቡር ወስቡሕ ራእዮሙ
  choice: toutes avaient une apparence majestueuse et splendide
  rationale: La formulation rend l’intensification visuelle de la proposition et rapporte « majestueuse » et « splendide » à l’apparence des montagnes.
- source_word: ወሠናይ ገጾሙ
  choice: leur visage était beau
  rationale: Traduction volontairement concrète de l’image du « visage » des montagnes, afin de ne pas effacer la personnification du texte.
- source_word: ጽኑዓን ፩ዲበ ፩
  choice: disposées l’une au-dessus de l’autre
  rationale: L’expression décrit une disposition étagée ou verticale. « Disposées » évite de suggérer qu’elles auraient été artificiellement empilées, tout en conservant leur relation spatiale.
- source_word: ቈላት ዕሙቅ ወጠዋያት
  choice: des ravins profonds et sinueux
  rationale: ቈላት désigne ici des dépressions ou ravins ; les deux qualificatifs indiquent leur profondeur et leur caractère tortueux. Le texte ne mentionne pas un ravin supplémentaire au singulier.
- source_word: አሐቲ ለአሐቲ ኢይትቃረባ
  choice: dont aucun ne s’approchait d’un autre
  rationale: La proposition distributive porte vraisemblablement sur les ravins et indique qu’ils ne se rejoignent pas ou ne se rapprochent pas les uns des autres. La formulation garde l’étrangeté spatiale de l’original.
