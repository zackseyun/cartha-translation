revisions:
- from: Je me dirigeai de ce côté et je vis sept montagnes majestueuses, toutes différentes les unes des autres. Leurs pierres étaient précieuses et belles ; toutes avaient une apparence majestueuse et splendide, et leur visage était beau[a]. Trois se trouvaient du côté de l’est, disposées l’une au-dessus de l’autre, et trois du côté du nord, disposées l’une au-dessus de l’autre. Entre elles s’étendaient des ravins profonds et sinueux, dont aucun ne s’approchait d’un autre[b].
  to: Je poursuivis mon chemin et vis sept montagnes majestueuses, toutes différentes les unes des autres. Leurs pierres étaient magnifiques et belles ; toutes avaient une apparence majestueuse et splendide, et leur visage était beau[a]. Trois se trouvaient du côté de l’est, disposées l’une au-dessus de l’autre, et trois du côté du nord, disposées l’une au-dessus de l’autre, avec des ravins profonds et sinueux, sans qu’aucun ne s’approche d’un autre[b].
  rationale: La révision restitue le sens de « mon chemin », retire l’ajout interprétatif « entre elles », et atténue la connotation trop spécifique de « précieuses ». Elle conserve le registre visionnaire, les répétitions descriptives, la personnification des montagnes et l’ambiguïté syntaxique signalée en note.
