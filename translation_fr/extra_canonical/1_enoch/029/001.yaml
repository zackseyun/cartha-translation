base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
translation:
  language: fr
  text: De là, je me rendis dans un autre lieu, loin de la région désertique[a], et je m’approchai du côté est de cette montagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin du désert » ou « loin de la région sauvage ».
    reason: lexical_alternative
  - marker: b
    text: L’expression guèze désigne littéralement la direction du matin ou du lever du soleil, c’est-à-dire l’est.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየኒ
  choice: De là
  rationale: Rend avec naturel la transition narrative et le mouvement depuis le lieu précédent.
- source_word: ሖርኩ
  choice: je me rendis
  rationale: Exprime un déplacement simple dans un registre narratif digne, sans ajouter l’idée d’un long voyage.
- source_word: ውስተ መካን ካልእ
  choice: dans un autre lieu
  rationale: Conserve le sens spatial général sans préciser indûment la nature du lieu.
- source_word: እምነ መደባራ
  choice: loin de la région désertique
  rationale: Le mouvement d’éloignement est explicité, tandis que « région désertique » couvre un espace sauvage, aride ou inhabité sans imposer un désert de sable.
- source_word: ወመንገለ ጽባሕ
  choice: du côté est
  rationale: Le syntagme désigne littéralement la direction du matin ou du lever du soleil, donc l’est.
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: je m’approchai du côté est de cette montagne
  rationale: 'Suit l’analyse syntaxique où ለ relie « est » à « cette montagne » : l’objet de l’approche est son côté oriental, et non simplement la montagne située à l’est.'
