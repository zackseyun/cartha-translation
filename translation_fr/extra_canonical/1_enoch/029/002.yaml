  text: And there I saw trees of incense[a], with the fragrance of frankincense and myrrh, and trees also[c][b],
translation:
  language: fr
  text: Et là, je vis des arbres de jugement[a], dégageant un parfum très abondant[b] d’encens et de myrrhe, ainsi que d’autres arbres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transmis porte littéralement « arbres de jugement ». Certains comprennent toutefois ici « arbres à encens », en supposant une ancienne confusion dans la transmission du texte.
    reason: textual_variant
  - marker: b
    text: 'Le mot a une valeur intensive : on peut aussi comprendre « un parfum extrêmement fort » ou « un parfum très abondant ».'
    reason: alternative_reading
  - marker: c
    text: La fin du verset est abrupte et difficile dans ce témoin; elle reprend « arbres » sans préciser davantage leur relation avec ce qui précède. « D’autres arbres » rend cette reprise additive sans ajouter de détail.
    reason: textual_difficulty
lexical_decisions:
- source_word: ወበህየ
  choice: Et là
  rationale: Conserve la transition narrative et la valeur locative de la formule visionnaire.
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend directement la première personne du récit de vision dans un registre digne et courant.
- source_word: ዕፀወ
  choice: des arbres
  rationale: Le nom pluriel désigne ici concrètement des arbres dans le paysage visionnaire.
- source_word: ተኵነኔ
  choice: de jugement
  rationale: Le mot guèze transmis correspond à « jugement ». Même si une corruption ancienne vers un terme aromatique est possible dans la tradition, la traduction principale suit le témoin fourni et signale la difficulté.
- source_word: ተፈድፋደ
  choice: très abondante
  rationale: Le terme a une force intensive, vraisemblablement liée ici à l’odeur ou au parfum qui suit.
- source_word: መዓዛ
  choice: odeur
  rationale: Désigne une odeur ou un parfum; « odeur » permet une construction naturelle avec l’intensif, sans ajouter une appréciation absente.
- source_word: ስኂን
  choice: encens
  rationale: Nom d’une substance aromatique, ici l’encens ou oliban.
- source_word: ወከርቤ
  choice: et de myrrhe
  rationale: Le waw coordonne le nom de la myrrhe à celui de l’encens.
- source_word: ወዕፀወሂ
  choice: ainsi que les arbres
  rationale: Rend littéralement la reprise additive finale, tout en conservant son caractère abrupt et difficile.
theological_decisions:
- issue: Faut-il interpréter les arbres comme des « arbres à encens » plutôt que comme des « arbres de jugement » ?
  choice: arbres de jugement
  alternative: arbres à encens
  rationale: La leçon guèze donnée porte le terme « jugement ». La lecture « encens » peut refléter une correction fondée sur l’histoire de la transmission, mais elle ne doit pas remplacer silencieusement le texte du témoin. Une note préserve les deux possibilités sans leur ajouter de symbolisme cultuel.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe légèrement abrupte de la fin est maintenue parce que le témoin guèze est lui-même difficile, plutôt que complétée par conjecture.
