base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: fr
  text: Et il me montra toutes leurs règles, pour chaque jour et pour chaque période[a], ainsi que pour chaque année, pour sa sortie et son commandement, chaque mois et chaque sabbat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Après « période », la transcription éthiopienne comporte une séquence difficile avec le mot « autorité ». Les chiffres qui l’entourent paraissent être des numéros de ligne introduits dans le texte ; elle ne permet donc pas d’établir une mention de « trois cent soixante-cinq » avec suffisamment de certitude.
    reason: textual_variant
  - marker: b
    text: Le mot rendu par « sabbat » peut aussi désigner la « semaine » dans une énumération calendaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: il me montra
  rationale: Rend naturellement la présentation d’une vision sans transformer le verbe en formule technique de révélation.
- source_word: ኵሎ ሥርዓቶሙ
  choice: toutes leurs règles
  rationale: Dans ce contexte astronomique, ሥርዓት désigne les dispositions fixes qui régissent les phénomènes célestes. « Règles » est clair et conserve cette idée d’ordre prescrit.
- source_word: በኵሉ ዕለት
  choice: pour chaque jour
  rationale: Exprime la portée temporelle récurrente et respecte la structure énumérative.
- source_word: በኵሉ ዘመን
  choice: pour chaque période
  rationale: ዘመን peut désigner un temps, une saison ou une période déterminée. « Période » préserve cette amplitude sans imposer les saisons climatiques.
- source_word: ዘበ…ሥልጣን
  choice: non traduit dans le corps du verset
  rationale: Les chiffres ፴ et ፭ visibles dans la transcription sont vraisemblablement des numéros de ligne introduits dans le texte, et la construction restante est trop incertaine pour produire une proposition française fiable. Une note signale cette difficulté plutôt que d’inventer une référence à 365.
- source_word: በኵሉ ዓመት
  choice: pour chaque année
  rationale: Rend directement l’expression temporelle tout en maintenant le parallélisme de l’énumération.
- source_word: በሙጻኡ
  choice: pour sa sortie
  rationale: Le suffixe est au singulier. « Sortie » garde ouverte la possibilité d’un lever, d’une apparition ou d’un mouvement astronomique plus technique.
- source_word: በትእዛዙ
  choice: pour l’ordre qui lui est donné
  rationale: Le suffixe singulier est conservé. Cette formulation rend le sens d’ordre ou de commandement tout en évitant l’ambiguïté française de « son commandement », qui pourrait suggérer qu’il commande lui-même.
- source_word: በኵሉ ወርኅ
  choice: chaque mois
  rationale: Formulation calend­aire naturelle en français moderne.
- source_word: ኵሉ ሰንበት
  choice: chaque sabbat
  rationale: Conserve le terme littéral et sa portée cultuelle, tout en signalant en note que « semaine » demeure possible dans ce contexte calend­aire.
theological_decisions:
- issue: Interprétation de ሰንበት
  choice: sabbat
  alternative: semaine
  rationale: Le sens littéral et cultuel est retenu parce que le contexte ne contraint pas à le généraliser en simple unité hebdomadaire. L’autre possibilité est indiquée en note.
- issue: Interprétation de la séquence comportant ሥልጣን et des chiffres parasites
  choice: ne pas intégrer une mention de 365 dans le texte
  alternative: « sous l’autorité des trois cent soixante-cinq » ou « qui a autorité »
  rationale: Les nombres paraissent être des numéros de ligne incorporés à la transcription. Une référence à 365 serait particulièrement fragile et en tension avec le calendrier de 364 jours du Livre astronomique. La syntaxe résiduelle ne permet pas non plus d’établir sûrement « qui a autorité ».
translation_notes:
  register: Français international actuel, digne et lisible. L’énumération répétitive de l’éthiopien est conservée sans lourdeur excessive. Les suffixes singuliers de « sa sortie » et de « l’ordre qui lui est donné » sont respectés; leur référent demeure volontairement implicite, comme dans la source.
