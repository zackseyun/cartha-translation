base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: fr
  text: Et la lune décroît[a], ce qui se produit en passant par la sixième porte ; car, à cette sixième porte, sa lumière atteint sa pleine mesure, et c’est à partir d’elle que commence la décroissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Et la lune accomplit sa décroissance, laquelle se produit en passant par la sixième porte. » Le guèze décrit ici le processus de manière formelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la tête de la diminution », expression qui désigne le début de la décroissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐጸጸ
  choice: décroît
  rationale: Le verbe simple exprime la diminution de la lune. « Décroît » est naturel en français dans un contexte lunaire et respecte mieux la forme verbale du guèze qu’une tournure nominale comme « accomplit sa décroissance ».
- source_word: ወርኅ
  choice: la lune
  rationale: Terme courant désignant la lune dans les descriptions astronomiques de cette section.
- source_word: ዘይትገበር
  choice: ce qui se produit
  rationale: Cette tournure rend le sens passif ou réfléchi de l’action qui a lieu, sans la raideur de « est effectué ».
- source_word: በሳድስት ኆኅት
  choice: en passant par la sixième porte
  rationale: La préposition associée à la porte présente celle-ci comme le passage emprunté par l’astre. Cette formulation conserve l’image cosmologique tout en restant idiomatique en français.
- source_word: ይትፌጸም
  choice: atteint sa pleine mesure
  rationale: Le verbe indique l’achèvement ou l’arrivée à la mesure complète. La formulation garde l’idée d’accomplissement de la lumière sans imposer une explication astronomique moderne.
- source_word: ብርሃኑ ዚአሁ
  choice: sa lumière
  rationale: Rendu direct de l’expression qui désigne la lumière de la lune.
- source_word: እምኔሁ
  choice: à partir d’elle
  rationale: Le pronom renvoie le plus naturellement à la sixième porte, dernier nom singulier mentionné, tout en conservant la reprise pronominale du texte.
- source_word: ርእሰ ታሕጻጼት
  choice: commence la décroissance
  rationale: L’expression signifie littéralement « tête de la diminution » ; en français, elle désigne idiomatiquement le commencement de la décroissance.
theological_decisions:
- issue: Langage cosmologique procédural ou paraphrase astronomique moderne
  choice: Conserver le mouvement par la sixième porte et l’achèvement mesuré de la lumière.
  alternative: Réduire le verset à une description moderne des phases lunaires.
  rationale: Le passage décrit les mouvements célestes au moyen de portes et de processus ordonnés. Garder ces images respecte la cosmologie apocalyptique du texte sans chercher à l’harmoniser avec un modèle astronomique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve l’image des portes célestes et le caractère ordonné du processus, tout en évitant des formulations inutilement techniques ou archaïques.
