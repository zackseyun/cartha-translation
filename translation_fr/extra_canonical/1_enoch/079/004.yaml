  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: fr
  text: 'Et la diminution qui s’opère dans la première porte, en son temps, jusqu’à ce que s’achèvent cent soixante-dix-sept jours — selon le compte des semaines : vingt-cinq semaines et deux jours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕጻጼት
  choice: diminution
  rationale: Le terme désigne ici la décroissance ou la diminution du phénomène céleste; « diminution » conserve le caractère technique du passage sans imposer « décours ».
- source_word: ይትገበር
  choice: s’opère
  rationale: Le passif ge’ez signifie littéralement « est faite »; « s’opère » est naturel en français tout en gardant l’idée d’un processus accompli.
- source_word: ቡኖኅት፡ ቀዳሚት
  choice: dans la première porte
  rationale: Le contexte astronomique d’Hénoch emploie les « portes » comme repères du parcours des luminaires; l’ordinal féminin qualifie la première porte.
- source_word: በዘመኑ፡ ዚአሁ
  choice: en son temps
  rationale: Rend le possessif et la valeur temporelle sans préciser davantage à quoi renvoie le pronom, conformément à l’ambiguïté de la source.
- source_word: በ፶፬ሥርዓተ፡ ሰንበት
  choice: selon le compte des semaines
  rationale: Le syntagme renvoie à une computation ou organisation en semaines; la lecture numérique interne est textuellement difficile, mais le total explicité est vingt-cinq semaines et deux jours.
