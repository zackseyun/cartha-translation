base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: fr
  text: Et maintenant, mon fils, je t’ai tout montré, et l’ordre de toutes les étoiles du ciel a été mené à son terme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été accompli ». Le guèze peut évoquer soit l’achèvement de l’exposé concernant l’ordre céleste, soit l’accomplissement de cet ordre lui-même.
    reason: ambiguïté lexicale et contextuelle
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marqueur de transition qui introduit naturellement une conclusion, tout en conservant la coordination du guèze.
- source_word: ወልድየ
  choice: mon fils
  rationale: Reproduit l’adresse filiale directe propre au cadre d’enseignement et de révélation.
- source_word: ኵሎ
  choice: tout
  rationale: Complément de « je t’ai montré » exprimant la totalité de manière idiomatique en français.
- source_word: አርአይኩከ
  choice: je t’ai tout montré
  rationale: Le passé composé convient à ce bilan d’une révélation qui vient d’être donnée.
- source_word: ተፈጸመት
  choice: a été mené à son terme
  rationale: Conserve la forme passive et la valeur d’achèvement sans suggérer nécessairement la disparition des étoiles.
- source_word: ሥርዓተ
  choice: l’ordre
  rationale: Désigne ici l’organisation réglée des corps célestes; « ordre » est naturel, digne et suffisamment ouvert en français.
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: de toutes les étoiles du ciel
  rationale: Rend exactement la totalité appliquée aux étoiles, sans ajouter un second équivalent de ኵሉ.
theological_decisions:
- issue: L’achèvement concerne-t-il l’ordre céleste lui-même ou l’exposé révélé de cet ordre ?
  choice: 'Conserver la formulation passive : « l’ordre de toutes les étoiles du ciel a été mené à son terme »'
  alternative: « l’exposé de l’ordre de toutes les étoiles du ciel est achevé »
  rationale: Le contexte d’instruction favorise la clôture de l’exposé, mais le guèze attribue grammaticalement l’achèvement à l’ordre. La traduction maintient cette tension au lieu d’expliciter une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le caractère conclusif du verset et l’ambiguïté du passif guèze, sans archaïsme ni précision doctrinale ajoutée.
