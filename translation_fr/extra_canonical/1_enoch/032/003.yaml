  to: Et j’entrai dans le jardin de la justice. Je vis, au-delà de ces arbres[a], de nombreux arbres imposants qui poussaient là. Leur parfum était agréable ; ils étaient grands, d’une très grande beauté et splendides. Je vis aussi l’arbre de la sagesse, dont ceux qui en mangent connaissent une grande sagesse[b].
