base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: fr
  text: Et j’entrai dans le jardin de la justice. Je vis, au-delà de ces arbres[a], de nombreux arbres imposants qui poussaient là. Leur parfum était agréable ; ils étaient grands, d’une très grande beauté et splendides. Je vis aussi l’arbre de la sagesse, dont ceux qui en mangent connaissent une grande sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tournure spatiale du texte éthiopien est difficile ; elle peut aussi se comprendre comme « parmi ces arbres » ou « à côté de ces arbres ».
    reason: textual_variant
  - marker: b
    text: Le texte dit que manger de cet arbre conduit à connaître « une grande sagesse ». Cette formulation évoque le jardin primordial sans reprendre exactement l’expression de la Genèse.
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: le jardin de la justice
  rationale: « Jardin » garde l’image concrète et édénique de ገነት. Dans ce syntagme, « justice » rend naturellement ጽድቅ en français moderne tout en laissant ouverte sa portée morale plus large.
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: au-delà de ces arbres
  rationale: La construction spatiale du témoin éthiopien est difficile. « Au-delà de » suit le mouvement de la vision sans masquer l’incertitude, signalée en note.
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ በህየ
  choice: de nombreux arbres imposants qui poussaient là
  rationale: La formulation conserve à la fois l’idée de nombre, de grandeur et de croissance, dans un français fluide.
- source_word: ጼናሆሙ ሠናይ
  choice: Leur parfum était agréable
  rationale: Cette tournure française naturelle restitue directement la qualité plaisante de leur odeur.
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: ils étaient grands, d’une très grande beauté et splendides
  rationale: Les trois aspects du texte — grandeur, beauté abondante et splendeur — restent distincts, notamment ወስቡሓን, qui ne doit pas être absorbé dans la seule beauté.
- source_word: ዕፀ ጥበብ
  choice: l’arbre de la sagesse
  rationale: Le syntagme est rendu littéralement afin de conserver son évocation du jardin primordial sans l’assimiler à une expression précise de la Genèse.
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: dont ceux qui mangent connaissent une grande sagesse
  rationale: La traduction maintient l’objet explicite « grande sagesse » et rend le résultat de l’acte de manger sans remplacer la formule par « deviennent sages ».
theological_decisions:
- issue: Rapport entre l’arbre de la sagesse et l’imagerie de l’Éden
  choice: Employer « l’arbre de la sagesse » sans harmonisation avec la formule de Genèse 2–3.
  alternative: « l’arbre de la connaissance » ou « l’arbre de la connaissance du bien et du mal »
  rationale: Le guèze nomme ici la sagesse, non la connaissance du bien et du mal. La formulation locale doit être préservée malgré l’écho manifeste au jardin primordial.
- issue: Valeur de ጽድቅ dans le nom du jardin
  choice: « le jardin de la justice »
  alternative: « le jardin de la droiture » ou « le paradis de la justice »
  rationale: « Justice » est digne et idiomatique en français, sans imposer une interprétation confessionnelle; la note n’est pas nécessaire puisque les autres possibilités ne changent pas substantiellement la scène.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour éviter une longue coordination peu naturelle, tout en conservant l’accumulation descriptive et la tension allusive du texte.
