base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: fr
  text: Il ressemblait à un caroubier, et son fruit était comme de très belles grappes de raisin[a] ; le parfum de cet arbre se répandait au loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le fruit est comparé à celui de la vigne ; « grappes de raisin » rend cette image naturellement en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመስል
  choice: il ressemblait
  rationale: Le verbe exprime une ressemblance visuelle; cette formulation française conserve clairement la valeur comparative.
- source_word: ሐመረ ጽራእ
  choice: au caroubier
  rationale: L’expression désigne le caroubier (Ceratonia siliqua), identification également appuyée par le fragment grec conservé.
- source_word: ፍሬሁ
  choice: son fruit
  rationale: Traduction concrète et directe du fruit de l’arbre.
- source_word: ከመ እስካለ ወይን
  choice: comme des grappes de raisin
  rationale: Le texte compare le fruit à celui de la vigne; « grappes de raisin » restitue naturellement l’image en français.
- source_word: ሠናይ ጥቀ
  choice: très belles
  rationale: ጥቀ a ici une valeur intensive (« très ») et ሠናይ qualifie favorablement les grappes; l’accord au féminin suit « grappes ».
- source_word: ወጼናሁ ለውእቱ ዕፅ
  choice: le parfum de cet arbre se répandait
  rationale: La tournure rend l’émanation de l’odeur depuis l’arbre dans un français naturel.
- source_word: የሐውር ነዋኃ
  choice: au loin
  rationale: Expression française concise qui conserve l’idée d’une diffusion sur une grande distance.
