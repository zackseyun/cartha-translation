base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: fr
  text: De là, je passai au-dessus des sommets de ces montagnes, loin vers l’est, puis je traversai la mer Érythrée[a]. Je m’en éloignai beaucoup[b] et passai au-dessus de l’ange Zoutéel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer Rouge ». Dans l’Antiquité, le nom « mer Érythrée » pouvait désigner une étendue plus vaste que l’actuelle mer Rouge.
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien de cette proposition est difficile ; le sens paraît être que le voyage se poursuit en s’éloignant de la mer.
    reason: textual_variant
  - marker: c
    text: Le nom de cet ange reçoit diverses vocalisations selon les éditions et les traductions, notamment « Zoutaël » ou « Zoutiel ».
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ ርእሶሙ ለእልኩ አድባር
  choice: au-dessus des sommets de ces montagnes
  rationale: « Sommets » rend naturellement l’expression littérale « têtes » appliquée aux montagnes. « Au-dessus » conserve le mouvement spatial élevé de la vision sans préciser davantage la trajectoire.
- source_word: እንዘ ርሑቅ ውእቱ ለጽባሕ
  choice: loin vers l’est
  rationale: ጽባሕ désigne ici la région du levant plutôt que le matin. Cette formulation préserve à la fois la distance et l’orientation.
- source_word: ባሕረ ኤርትራ
  choice: la mer Érythrée
  rationale: Le nom géographique ancien est conservé, car son étendue pouvait être plus vaste que celle de l’actuelle mer Rouge.
- source_word: ወእምኔሁ ርሑቀ ተከንኩ
  choice: Je m’en éloignai beaucoup
  rationale: Le passage est difficile, mais il semble décrire la poursuite du voyage à une grande distance de la mer. La formulation française reste sobre et marque clairement l’éloignement.
- source_word: መልአክ ዙጥኤል
  choice: l’ange Zoutéel
  rationale: Le nom propre est translittéré plutôt que traduit. « Zoutéel » représente de façon lisible en français la graphie éthiopienne, tout en signalant les vocalisations concurrentes en note.
theological_decisions:
- issue: Identification de la mer nommée
  choice: mer Érythrée
  alternative: mer Rouge
  rationale: Le maintien du nom ancien évite de réduire sans nécessité la géographie du monde visionnaire à une identification moderne plus étroite.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit. Les répétitions spatiales du texte source sont préservées, ainsi que l’étrangeté de l’expression « au-dessus de l’ange ».
