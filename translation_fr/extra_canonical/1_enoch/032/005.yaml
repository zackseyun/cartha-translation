lexical_decisions:
- source_word: ወእቤ
  choice: Et je dis
  rationale: La conjonction ወ marque ici la simple continuité narrative, et እቤ est une forme à la première personne du singulier du verbe « dire ».
- source_word: ሠናይዝ
  choice: Ceci est beau
  rationale: ሠናይ exprime ce qui est bon, beau ou agréable, tandis que ዝ peut être compris comme le démonstratif « ceci ». La formulation française restitue naturellement cette brève appréciation sans l'expliciter davantage.
theological_decisions:
- issue: Valeur de l'adjectif ሠናይ dans cette parole elliptique
  choice: beau
  alternative: bon
  rationale: Dans le contexte d'une vision, « beau » rend vraisemblablement une appréciation visuelle. « Bon » demeure lexicalement possible, sans qu'il faille imposer ici une valeur morale.
- issue: Interprétation de ዝ dans la forme transmise ሠናይዝ
  choice: Le rendre par le démonstratif « ceci »
  alternative: 'Comprendre la parole de manière elliptique : « C''est beau »'
  rationale: La forme transmise permet de reconnaître le démonstratif ዝ. Le rendre explicitement préserve un élément présent dans le témoin guèze, malgré la brièveté et la confiance moyenne de la source.
translation_notes:
  register: Français international moderne, sobre et digne. « Ceci est beau » conserve le démonstratif du texte source et le caractère lapidaire de la réplique.
