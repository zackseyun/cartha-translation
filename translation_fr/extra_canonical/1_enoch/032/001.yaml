base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: fr
  text: Après cela, en direction du sud, tandis que je regardais par-dessus les montagnes, je vis sept montagnes couvertes de nard précieux[a], d’arbres odorants, de cannelle et de poivre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « nard précieux » est incertaine; elle désigne probablement une plante aromatique ou une épice de grande valeur. On pourrait aussi traduire plus largement par « aromates précieux ».
    reason: lexical_alternative
  - marker: b
    text: Le guèze énumère ici des aromates de luxe. Cette accumulation souligne l’abondance et le caractère exotique du paysage visionnaire, sans nécessairement constituer un inventaire botanique au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: Après cela
  rationale: Formule de transition temporelle renvoyant aux scènes précédentes; le singulier collectif est naturel en français sans effacer ce renvoi.
- source_word: አፈው ለመስዕ
  choice: en direction du sud
  rationale: Dans la lecture syntaxique retenue par l’édition et la dernière révision auditée, l’expression indique le déplacement vers le sud; le terme አፈው demeure textuellement difficile dans cette séquence et n’est pas développé en un nom ajouté.
- source_word: እንዘ እኔጽር
  choice: tandis que je regardais
  rationale: Rend la construction circonstancielle durative et l’attention visuelle du voyant.
- source_word: መልዕልተ አድባር
  choice: par-dessus les montagnes
  rationale: Conserve explicitement la relation spatiale de hauteur ou de dépassement, importante pour la géographie de la vision.
- source_word: ፯አድባረ
  choice: sept montagnes
  rationale: Préserve le nombre explicite et l’ampleur du paysage visionnaire.
- source_word: ምሉኣነ
  choice: couvertes de
  rationale: Expression française naturelle pour des montagnes abondamment garnies de végétaux; «remplies de» serait plus formel mais moins idiomatique ici.
- source_word: ሰንብላተ ቅድዋተ
  choice: nard précieux
  rationale: Garde une désignation botanique concrète tout en signalant la grande valeur de cet aromate; l’identification exacte reste incertaine.
- source_word: ዕፀ መዓዛ
  choice: arbres odorants
  rationale: Rend littéralement et naturellement l’image d’arbres ou de bois caractérisés par leur parfum.
- source_word: ቀናንሞን
  choice: cannelle
  rationale: Équivalent français courant de cet emprunt désignant l’aromate.
- source_word: ፐፐሬ
  choice: poivre
  rationale: Équivalent français direct de cet emprunt désignant l’épice.
