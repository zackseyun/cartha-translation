base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: fr
  text: Malheur à ceux qui bâtissent leurs maisons par le péché, car elles seront arrachées de toutes leurs fondations ; [et ils tomberont par l’épée][a]. Quant à ceux qui amassent de l’or et de l’argent, ils périront bientôt dans le jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et ils tomberont par l’épée » sont transmis entre crochets dans le texte source édité, ce qui signale une incertitude textuelle.
    reason: Préserver visiblement le statut critique du segment transmis entre crochets.
  - marker: b
    text: Le groupe traduit par « dans le jugement » peut aussi être rattaché à « amassent de l’or et de l’argent ». Le texte ne permet pas de trancher avec certitude ce rattachement.
    reason: Conserver l’ambiguïté syntaxique sans imposer un sens lexical alternatif insuffisamment assuré.
lexical_decisions:
- source_word: በኃጢአት (ba-ḫaṭiʾat)
  choice: par le péché
  rationale: La préposition peut exprimer le moyen ou la manière. « Par le péché » conserve l’idée que le péché est le moyen par lequel ces maisons sont édifiées, sans réduire le sens à une simple localisation morale.
- source_word: ይትነሠቱ (yitnässətu)
  choice: seront arrachées
  rationale: Le verbe passif évoque ici l’enlèvement ou l’arrachement. L’accord avec « maisons » donne un français naturel tout en maintenant l’image des fondations.
- source_word: ያጠርይዎ (yaṭäryəwo)
  choice: amassent
  rationale: Dans le contexte de l’or et de l’argent, « amasser » rend naturellement l’idée d’acquérir ou d’accumuler des richesses.
- source_word: በጽነኔ (ba-ṣənnane)
  choice: sous le jugement
  rationale: Le terme est rendu comme une circonstance judiciaire affectant leur perte. La formulation française laisse entendre qu’ils périssent sous l’effet du jugement, conformément à la lecture retenue dans la couche de consultation.
- source_word: ይትሐጐሉ (yitḥaggolu)
  choice: ils périront
  rationale: « Périr » exprime directement la destruction ou la disparition annoncée sans préciser un mode que le texte ne fournit pas.
theological_decisions:
- issue: Référent de « seront arrachées »
  choice: Les maisons seront arrachées de leurs fondations.
  alternative: Les bâtisseurs seront arrachés à toutes leurs fondations.
  rationale: Le pluriel verbal permet une certaine souplesse, mais « leurs maisons » constitue l’antécédent le plus immédiat et l’image de maisons arrachées de leurs fondations est cohérente.
- issue: Rattachement de « sous le jugement »
  choice: Le syntagme qualifie leur perte.
  alternative: Il pourrait qualifier la manière dont ils amassent l’or et l’argent, éventuellement avec une nuance d’oppression ou d’injustice selon l’analyse lexicale.
  rationale: L’ordre des mots autorise une hésitation. Le texte principal suit la lecture « périr sous le jugement », tandis qu’une note conserve l’autre possibilité sans trancher artificiellement.
translation_notes:
  register: Français international moderne, sobre et solennel. « Malheur à ceux » conserve la forme prophétique traditionnelle tout en restant immédiatement compréhensible. Les crochets du passage sur l’épée sont maintenus et explicités par une note.
