base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: fr
  text: Et ordonnez-leur dans la pensée de vos cœurs[a], et ne laissez pas mes paroles s’effacer de vos cœurs. Car je sais que les pécheurs tenteront les humains pour qu’ils pratiquent une sagesse mauvaise ; aucune place ne sera trouvée pour elle[b], et aucune tentation ne diminuera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon l’intention de vos cœurs ». Le guèze associe ici la pensée ou l’intention au cœur, siège de la résolution intérieure. Le premier impératif peut aussi être rendu par « prescrivez-leur » ou « commandez-leur ».
    reason: lexical_alternative
  - marker: b
    text: La proposition est difficile. La « place » peut être un endroit au sens propre, une place au sens figuré ou une occasion offerte à cette sagesse mauvaise.
    reason: alternative_reading
  - marker: c
    text: 'La dernière proposition est incertaine. On peut aussi comprendre : « aucune épreuve ne la réduira », « aucune affliction ne l’écourtera » ou « aucune détresse ne l’enlèvera ».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ትእዛዙ
  choice: donnez-leur cet ordre
  rationale: Le verbe impératif exprime l’idée d’ordonner ou de prescrire. La formulation française explicite sobrement le destinataire implicite tout en conservant la force parénétique.
- source_word: በሐሊና ልብክሙ
  choice: dans la pensée de vos cœurs
  rationale: ሐሊና peut désigner la pensée, l’intention ou la disposition intérieure. La traduction conserve l’association sémitique de la pensée et du cœur sans la réduire à une simple émotion.
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: ne laissez pas mes paroles s’effacer de vos cœurs
  rationale: Le verbe évoque l’effacement ou la suppression. « S’effacer » restitue naturellement en français l’image de paroles qui disparaîtraient de la mémoire et de la résolution intérieures.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: les pécheurs tenteront les humains
  rationale: La forme causative renvoie ici à l’action de tenter, séduire ou mettre à l’épreuve, et non à celle d’instruire. « Humains » rend le terme générique sans restriction de sexe.
- source_word: ይግበሩ ጥበበ እኩየ
  choice: pour qu’ils pratiquent une sagesse mauvaise
  rationale: 'Le maintien de « sagesse » préserve l’inversion morale volontaire du texte: une compétence ou sagesse mise au service du mal.'
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: aucun lieu ne lui sera trouvé
  rationale: Cette traduction formellement proche conserve l’ambiguïté de መካን, qui peut désigner un lieu concret, une place figurée ou une occasion.
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: aucune tentation ne diminuera
  rationale: መከራ peut signifier tentation, épreuve ou affliction. « Tentation » maintient le lien lexical avec le verbe précédent, tandis que « diminuera » évite de préciser abusivement le complément ou le résultat d’un dernier verbe difficile.
theological_decisions:
- issue: La nature de la « sagesse mauvaise »
  choice: Conserver l’expression paradoxale « sagesse mauvaise »
  alternative: ruse mauvaise; conduite méchante
  rationale: Le texte ne parle pas seulement du mal en général, mais d’une forme corrompue de sagesse ou de savoir-faire. Garder le mot « sagesse » préserve cette tension sapientielle.
- issue: Le lien entre la tentation exercée par les pécheurs et la dernière proposition
  choice: Employer « tenter » puis « tentation »
  alternative: séduire puis épreuve; inciter puis affliction
  rationale: Le parallélisme lexical apparent mérite d’être visible en français, sans toutefois prétendre résoudre la syntaxe incertaine de la dernière proposition.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme d’exhortation est conservé, de même que les images du cœur et de l’effacement. Les formulations difficiles de la fin restent volontairement ouvertes et sont signalées en notes plutôt que normalisées.
