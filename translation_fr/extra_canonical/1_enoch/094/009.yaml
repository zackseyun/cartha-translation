base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: fr
  text: Vous avez commis des outrages et des violences[a], et vous vous êtes préparés pour le jour de l’effusion de sang[b], pour le jour des ténèbres et pour le jour du grand jugement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Outrages » peut aussi se traduire par « insultes », « reproches » ou « opprobre ». La construction guèze signifie ici « vous avez commis des outrages et des violences », plutôt que « vous l’avez préparée pour l’outrage et la violence ».
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: Ou « le jour où le sang sera versé », ou encore « le jour du carnage ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « jugement » peut aussi désigner la sentence ou la condamnation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: Vous avez commis l’outrage et la violence
  rationale: Le suffixe objet féminin singulier de ገበርክምዋ peut être compris comme proleptique, annonçant les compléments marqués par ለ. Le verbe signifie ici « faire, commettre » plutôt que « préparer ». « Outrage » garde la portée d’insulte ou d’opprobre de ጽርፈት, tandis que « violence » rend la force de ዓመፃ dans ce contexte de sang versé.
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: et vous vous êtes préparés
  rationale: La tournure exprime le fait d’être devenus prêts. La formulation pronominale française conserve la responsabilité active des personnes interpellées sans surinterpréter le mode exact de cette préparation.
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: pour le jour de l’effusion du sang
  rationale: Cette traduction suit la construction nominale du guèze et exprime explicitement le sang versé. Elle conserve le registre solennel et apocalyptique.
- source_word: ወለዕለተ፡ ጽልመት
  choice: pour le jour des ténèbres
  rationale: « Ténèbres » restitue naturellement en français biblique actuel l’image apocalyptique de ጽልመት, sans la réduire à une simple journée sombre.
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: pour le jour du grand jugement
  rationale: ኵነኔ peut désigner le jugement, la sentence ou la condamnation. « Grand jugement » préserve la formule eschatologique tout en laissant ouverte la distinction entre l’acte de juger et son verdict.
theological_decisions:
- issue: Portée historique ou eschatologique des trois « jours »
  choice: Conserver la série explicite des jours culminant dans le « grand jugement ».
  alternative: Comprendre ces expressions comme une description générale de calamités et de châtiments historiques.
  rationale: La répétition de « jour », associée au sang versé, aux ténèbres et au grand jugement, relève du langage apocalyptique. La traduction garde cette tension sans préciser davantage la chronologie ou la nature de l’accomplissement.
- issue: Sens de ኵነኔ
  choice: jugement
  alternative: condamnation ou sentence
  rationale: « Jugement » couvre à la fois le procès judiciaire et son issue possible, alors que « condamnation » imposerait d’emblée un verdict défavorable. L’alternative est signalée en note.
translation_notes:
  register: Français international moderne, solennel mais immédiatement intelligible. La répétition de « pour le jour » reproduit le rythme apocalyptique de la source. « Effusion du sang » est retenu plutôt que « effusion de sang » pour rester proche de la construction guèze, tandis que les notes préservent les principales possibilités lexicales et grammaticales.
