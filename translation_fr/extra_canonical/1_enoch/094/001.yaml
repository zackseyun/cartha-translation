base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: fr
  text: 'Et maintenant, je vous le dis, mes enfants : aimez la justice et marchez dans la justice, car les sentiers de la justice sont dignes et agréés[a] ; mais les sentiers de l’iniquité[b] seront promptement détruits et disparaîtront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze est difficile. Elle peut aussi se traduire par « sont convenables et acceptables » ou « sont appropriés et accueillis favorablement ».
    reason: lexical_alternative
  - marker: b
    text: Le mot peut aussi désigner l’injustice ou, selon le contexte, la violence. Ici, il s’oppose directement à la justice et désigne largement la conduite mauvaise.
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: je vous le dis
  rationale: Rend directement la formule de parole tout en conservant le ton personnel de l’exhortation.
- source_word: ደቂቅየ
  choice: mes enfants
  rationale: Préserve l’adresse familiale et didactique sans limiter explicitement le groupe aux seuls fils.
- source_word: አፍቅርዋ ለጽድቅ
  choice: aimez la justice
  rationale: « Justice » exprime ici la qualité morale globale de ጽድቅ et correspond à l’usage biblique français courant.
- source_word: ወባቲ ሖሩ
  choice: marchez dans ses voies
  rationale: Le pronom renvoie à la justice. Cette formulation française conserve l’image éthique de la marche tout en la rendant naturelle.
- source_word: ፍኖዋተ ጽድቅ
  choice: les sentiers de la justice
  rationale: « Sentiers » maintient l’image concrète des chemins moraux et le parallélisme avec les sentiers de l’iniquité.
- source_word: ይደሉ ወይትወከፍ
  choice: sont convenables et agréés
  rationale: 'Conserve les deux prédicats évaluatifs : le premier évoque ce qui convient ou est digne, le second ce qui est reçu ou approuvé.'
- source_word: ፍኖዋተ ዓመፃ
  choice: les sentiers de l’iniquité
  rationale: Dans ce contraste direct avec ጽድቅ, « iniquité » rend le mal moral ou l’injustice sans confondre ce terme avec celui qui désigne plus précisément la violence en 1 Hénoch 94:2.
- source_word: ፍጡነ
  choice: bientôt
  rationale: Exprime la rapidité et l’imminence annoncées par l’adverbe, dans un français naturel.
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: seront détruits et disparaîtront
  rationale: Préserve les deux verbes, qui associent la ruine à la disparition complète.
theological_decisions:
- issue: Sens de ጽድቅ dans une exhortation sapientielle et apocalyptique
  choice: justice
  alternative: droiture
  rationale: « Justice » est le terme biblique français le plus courant et couvre ici une orientation morale globale ; « droiture » reste possible, mais accentuerait davantage le caractère personnel.
- issue: Sens de ዓመፃ dans l’antithèse morale
  choice: iniquité
  alternative: injustice, violence
  rationale: Le parallélisme avec « justice » favorise le sens général de mal moral ou d’injustice. « Violence » est possible dans certains contextes, mais risquerait ici de réduire la portée du contraste et de confondre ce mot avec le terme distinct employé au verset suivant.
- issue: Valeur du double prédicat appliqué aux sentiers de la justice
  choice: convenables et agréés
  alternative: dignes et acceptables
  rationale: La formulation retenue garde deux qualifications distinctes sans préciser qui agrée ces sentiers, ambiguïté que le texte source ne résout pas.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse paternelle et l’image biblique de la marche sont conservées. « Marchez dans ses voies » évite le tour peu naturel « marchez en elle » tout en explicitant seulement l’image déjà développée par les « sentiers » dans la suite du verset.
