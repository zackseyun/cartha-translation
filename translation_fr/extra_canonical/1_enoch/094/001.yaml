  naturalness: Le français est globalement clair, moderne et de registre approprié. « Marchez dans la justice » est à la fois naturel dans un registre scripturaire sobre et plus proche de l’image et de la référence pronominale du guèze. « Sont convenables et agréés » demeure compréhensible, mais « dignes et agréés » est plus idiomatique dans cette évaluation morale tout en gardant les deux prédicats.
  terminology: « Justice » pour ጽድቅ et « iniquité » pour ዓመፃ constituent un contraste français cohérent et respectent la distinction contextuelle d’avec la violence. Aucun nom propre ni terme théologique ne requiert de modification supplémentaire.
