revisions:
- from: Mais recherchez[a] et choisissez pour vous-mêmes la justice et une vie bonne[b] ; marchez sur les sentiers de la paix[c], afin que vous viviez et prospériez.
  to: Mais recherchez[a] et choisissez la droiture, et menez une vie bonne[b] ; marchez sur les sentiers de paix[c]. Ainsi, vous vivrez et prospérerez.
  rationale: La révision conserve la lecture corrigée « Mais recherchez » plutôt que l’ancienne interprétation « Aimez ». Elle remplace « justice » par « droiture » afin de rendre plus directement la rectitude morale en jeu, améliore l’idiome français du segment relatif à la bonne vie tout en gardant la réserve textuelle, et exprime la conclusion comme conséquence sans trancher indûment entre finalité et résultat.
