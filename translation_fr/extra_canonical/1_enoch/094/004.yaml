base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: fr
  text: Mais recherchez[a] et choisissez la droiture, et menez une vie bonne[b] ; marchez sur les sentiers de paix[c]. Ainsi, vous vivrez et prospérerez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désirez ».
    reason: lexical_alternative
  - marker: b
    text: La formulation éthiopienne transmise autour de « menez une vie bonne » est difficile ; elle peut désigner une vie caractérisée par le bien ou la droiture.
    reason: textual_variant
  - marker: c
    text: Ou « dans les voies de la paix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: እላ
  choice: Mais
  rationale: 'Le contexte et la révision textuelle indiquent vraisemblablement une forme fautive ou une graphie issue de l’OCR pour አላ, marquant ici l’opposition : « mais ».'
- source_word: ፍቅዱ
  choice: recherchez
  rationale: Impératif pluriel de ፈቀደ, exprimant l’idée de rechercher ou de désirer ; « recherchez » convient au caractère exhortatif et évite la confusion avec le verbe « aimer ».
- source_word: ወኀረዩ
  choice: et choisissez
  rationale: Rend directement l’appel à un choix moral délibéré.
- source_word: ለክሙ
  choice: pour vous-mêmes
  rationale: Fait ressortir la valeur bénéficiaire et réflexive de l’expression.
- source_word: ጽድቀ
  choice: la justice
  rationale: Terme biblique français courant qui couvre ici la conduite juste et droite, sans le limiter à la justice judiciaire.
- source_word: ወሕይወተ ኄራተ
  choice: et une vie bonne
  rationale: Rend le groupe comme désignant une vie caractérisée par le bien, tout en signalant en note la difficulté du témoin transcrit.
- source_word: ወሖሩ
  choice: marchez
  rationale: Conserve la métaphore biblique de la marche pour désigner la conduite.
- source_word: በፍኖዋተ ሰላም
  choice: sur les sentiers de la paix
  rationale: Préserve le pluriel et l’image sapientielle des chemins de paix.
- source_word: ወተሐደዉ
  choice: afin que vous viviez
  rationale: Le lien final ou consécutif est exprimé naturellement en français par « afin que ».
- source_word: ወትደለዉ
  choice: et prospériez
  rationale: Exprime l’issue favorable promise par l’exhortation sans la réduire à la richesse matérielle.
theological_decisions:
- issue: Rendre ጽድቀ par « justice » ou par « droiture »
  choice: justice
  alternative: droiture
  rationale: « Justice » maintient le vocabulaire éthique et religieux traditionnel tout en pouvant englober la rectitude personnelle ; le contexte ne permet pas de le réduire à un sens strictement judiciaire.
- issue: Rapport entre l’exhortation et la vie prospère finale
  choice: finalité ou conséquence exprimée par « afin que »
  alternative: 'simple coordination : « et vous vivrez et prospérerez »'
  rationale: La syntaxe peut être lue comme une suite coordonnée, mais le mouvement sapientiel du verset favorise une relation de finalité ou de conséquence, sans transformer cette prospérité en garantie exclusivement matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique de la marche et l’image des sentiers sont conservées ; la syntaxe reste exhortative sans devenir archaïque.
