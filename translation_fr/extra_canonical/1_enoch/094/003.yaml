base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: fr
  text: 'Et maintenant, je vous le dis, à vous les justes : ne marchez pas sur les chemins du mal ni sur les chemins de la mort, et ne vous approchez pas d’eux[a], de peur que vous ne périssiez[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « eux » peut renvoyer aux chemins du mal et de la mort, ou aux personnes qui les suivent.
    reason: referential_ambiguity
  - marker: b
    text: 'Autres traductions possibles : « de peur que vous ne soyez détruits » ou « emportés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque une transition temporelle vers une nouvelle exhortation, dans un français naturel tout en conservant l’enchaînement du texte.
- source_word: እብል ለክሙ ለጻድቃን
  choice: je vous le dis, à vous les justes
  rationale: Conserve le verbe de parole direct et rend explicite l’adresse aux justes sans transformer cette désignation éthique en paraphrase.
- source_word: ኢትሖሩ
  choice: ne marchez pas
  rationale: Avec les chemins, « marcher » maintient l’image traditionnelle d’une conduite ou d’un parcours moral.
- source_word: በፍኖዋተ እኩይ
  choice: sur les chemins du mal
  rationale: Le pluriel concret « chemins » préserve la métaphore sapientielle; « du mal » garde ici le sens moral abstrait sans le personnifier.
- source_word: ወኢበፍኖዋተ ሞት
  choice: ni sur les chemins de la mort
  rationale: Reproduit le parallélisme du texte et conserve le terme fort et direct « mort ».
- source_word: ወኢትቅረቡ ኀቤሆሙ
  choice: et ne vous approchez pas d’eux
  rationale: Rend littéralement le mouvement d’approche et conserve l’ambiguïté du pronom pluriel quant à son référent.
- source_word: ከመ ኢትትሐጐሉ
  choice: de peur que vous ne périssiez
  rationale: Exprime naturellement en français la finalité ou conséquence redoutée, sans préciser indûment si la perte est physique, morale ou judiciaire.
theological_decisions:
- issue: Référent du pronom pluriel dans l’interdiction de s’approcher
  choice: Conserver le pronom « eux » sans identifier explicitement son référent.
  alternative: Comprendre le pronom comme désignant soit les chemins eux-mêmes, soit les personnes qui les suivent.
  rationale: Le texte guèze permet une certaine tension référentielle. Une explicitation dans le corps du verset trancherait une ambiguïté réelle et pourrait réduire la portée à la fois morale et sociale de l’avertissement.
- issue: Nature de la perte finale
  choice: « périssiez »
  alternative: « soyez détruits » ou « soyez emportés »
  rationale: « Périr » exprime sobrement la gravité du jugement sans imposer une description particulière de la destruction.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative, le parallélisme entre le mal et la mort, ainsi que la métaphore des chemins sont conservés. Le tour « à vous les justes » clarifie l’adresse tout en restant proche de l’ordre de la source.
