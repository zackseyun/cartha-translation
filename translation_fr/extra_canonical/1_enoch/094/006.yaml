base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: fr
  text: Malheur à ceux qui bâtissent l’injustice et l’oppression, et qui posent le fondement de la tromperie[a] ! Car ils seront promptement renversés[b], et ils n’auront pas de paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze est quelque peu incertaine. Elle semble toutefois prolonger l’image de la construction en l’associant à la tromperie ou à la fraude.
    reason: lexical_alternative
  - marker: b
    text: Ou « arrachés » ou « abattus ». Dans ce contexte, « renversés » fait écho à l’image de ce qu’ils ont bâti.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Malheur à
  rationale: Introduit une dénonciation prophétique et annonce le jugement ; « Malheur à » est à la fois naturel en français et suffisamment solennel.
- source_word: የሐንጽዋ
  choice: bâtissent
  rationale: Conserve l’image architecturale qui structure le verset et prépare l’idée du renversement.
- source_word: ለዓመፃ
  choice: l’injustice
  rationale: Exprime la faute morale et judiciaire sans la limiter à un seul type de méfait.
- source_word: ወለግፍዕ
  choice: et l’oppression
  rationale: Rend l’idée d’un abus coercitif exercé contre autrui et forme un couple naturel avec « injustice ».
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: et qui posent le fondement de la tromperie
  rationale: Maintient le substantif abstrait « tromperie » ainsi que l’image de fondation, malgré une certaine incertitude dans la formulation guèze.
- source_word: ፍጡነ
  choice: promptement
  rationale: Marque la rapidité du jugement dans un registre digne, sans être archaïque.
- source_word: ይትነሠቱ
  choice: ils seront renversés
  rationale: Dans le contexte architectural, « renversés » évoque l’effondrement de ce qui a été bâti tout en conservant le sens passif de jugement.
- source_word: ወአልቦሙ ሰላመ
  choice: et ils n’auront pas de paix
  rationale: Restitue directement la formule finale de jugement et sa force catégorique.
theological_decisions:
- issue: Faut-il rendre les actes mauvais en termes purement abstraits ou conserver la métaphore architecturale ?
  choice: Conserver les images de construction, de fondation et de renversement.
  alternative: 'Paraphraser : « ceux qui pratiquent l’injustice, l’oppression et la tromperie seront bientôt détruits ».'
  rationale: Le texte guèze associe les maux à une construction, puis décrit le jugement comme son renversement. Garder cette tension imagée évite d’aplanir la rhétorique apocalyptique.
- issue: Portée de l’absence de paix
  choice: La présenter comme le sort annoncé aux mêmes personnes, sans explicitation doctrinale supplémentaire.
  alternative: Interpréter « paix » comme salut éternel, sécurité politique ou seul repos intérieur.
  rationale: Le texte ne précise pas la dimension de cette « paix » ; la traduction conserve donc sa portée ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation sépare l’annonce de malheur de sa motivation, tandis que le vocabulaire architectural est maintenu d’un bout à l’autre.
