base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: fr
  text: Et à certains hommes d’une génération[a], les sentiers de la violence et de la mort seront révélés ; ils s’en tiendront éloignés et ne les suivront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « à des hommes sages issus d’une génération ». Le sens de እሙራን est discuté ; la tournure peut désigner « certains hommes », tandis qu’une lecture traditionnelle y voit des hommes sages ou instruits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙራን ሰብእ
  choice: certains hommes
  rationale: Le participe pluriel እሙራን peut désigner des personnes connues ou déterminées et, avec ሰብእ, former l’expression « certains hommes ». Ce choix suit l’analyse morphologique signalée dans la révision la plus étayée et évite d’introduire « sages », normalement exprimé par un autre lexème.
- source_word: እምትውልድ
  choice: d’une génération
  rationale: La préposition እም et le nom singulier « génération » indiquent ici l’origine ou l’appartenance, sans marquer explicitement la répétition « de génération en génération ».
- source_word: ይትከሠት
  choice: seront révélés
  rationale: La forme exprime la manifestation ou la mise au jour. « Seront révélés » convient au registre apocalyptique tout en conservant la valeur passive.
- source_word: ፍኖዋተ
  choice: les sentiers
  rationale: Le pluriel concret désigne des chemins ou sentiers et porte ici une image morale. « Sentiers » conserve cette métaphore.
- source_word: ግፍዕ
  choice: violence
  rationale: Le terme évoque la violence, l’oppression ou l’injustice violente. « Violence » maintient la force concise de l’expression.
- source_word: ሞት
  choice: mort
  rationale: Le sens direct est « mort » ; aucune explicitation telle que « destruction » n’est nécessaire.
- source_word: ይርኅቁ እምኔሆሙ
  choice: ils s’en tiendront éloignés
  rationale: Cette formulation française naturelle rend l’éloignement à l’égard des sentiers mentionnés et sa portée morale.
- source_word: ኢይትለውዎሙ
  choice: ils ne les suivront pas
  rationale: Le verbe signifie suivre ou aller à la suite de. Le pronom reprend les sentiers et préserve l’image du chemin moral.
theological_decisions:
- issue: Image concrète des chemins ou paraphrase morale abstraite
  choice: Conserver « les sentiers de la violence et de la mort »
  alternative: Paraphraser par « une conduite violente qui mène à la mort »
  rationale: Le guèze emploie un nom concret pluriel. Garder cette image respecte la diction sapientielle et apocalyptique sans préciser un rapport causal que le texte n’énonce pas.
- issue: Identité des destinataires
  choice: « certains hommes »
  alternative: « des hommes sages »
  rationale: La forme እሙራን est lexicalement discutée dans les données fournies. Son analyse comme participe passif signifiant « connus, déterminés » avec ሰብእ soutient « certains hommes » ; une note conserve l’autre compréhension sans trancher silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde le parallélisme du texte guèze et l’image morale des sentiers, tout en évitant une formulation trop littérale ou archaïque.
