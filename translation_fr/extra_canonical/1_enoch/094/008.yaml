base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: fr
  text: 'Malheur à vous, les riches, car vous avez mis votre confiance dans vos richesses, et vous vous séparerez de vos richesses[a], parce que vous ne vous êtes pas souvenus du Très-Haut aux jours de votre richesse.


    [a] Ou « vous quitterez vos richesses ». L’expression peut évoquer la perte des richesses ou le fait de les laisser derrière soi lors du jugement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous quitterez vos richesses ». L’expression peut évoquer la perte des richesses ou le fait de les laisser derrière soi lors du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Malheur
  rationale: Conserve la force de la formule prophétique de dénonciation et de jugement.
- source_word: አብዕልት
  choice: les riches
  rationale: Formulation française naturelle pour le vocatif pluriel désignant les personnes riches.
- source_word: ብዕልክሙ
  choice: vos richesses / votre richesse
  rationale: Le terme désigne la richesse; la répétition est largement maintenue, avec le singulier collectif dans la formule temporelle pour une expression française digne et naturelle.
- source_word: ተወከልክሙ
  choice: vous avez mis votre confiance
  rationale: Rend clairement l’idée de confiance ou d’appui placé dans la richesse.
- source_word: ትወፅኡ
  choice: vous vous séparerez
  rationale: Avec እምነ, exprime un départ hors de la richesse sans préciser s’il s’agit de mort, de dépossession ou d’un autre jugement.
- source_word: ለልዑል
  choice: le Très-Haut
  rationale: Titre divin traditionnel et immédiatement compréhensible en français.
- source_word: ኢተዘከርክምዎ
  choice: vous ne vous êtes pas souvenus
  rationale: Conserve le sens direct de « se souvenir » et l’accusation d’oubli du Très-Haut.
- source_word: በመዋዕለ፡ ብዕልክሙ
  choice: aux jours de votre richesse
  rationale: Préserve l’image temporelle et la cadence solennelle de la formulation guèze.
theological_decisions:
- issue: Sens de « sortir de vos richesses »
  choice: Conserver l’image d’une séparation d’avec les richesses.
  alternative: Interpréter explicitement comme la mort, la confiscation des biens ou l’exil.
  rationale: Le guèze demeure concis et ambigu; la traduction ne précise donc pas le mode exact du jugement.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « richesses/richesse » maintient le mouvement rhétorique du texte source; la tournure « aux jours de » conserve sa tonalité sapientielle et apocalyptique.
