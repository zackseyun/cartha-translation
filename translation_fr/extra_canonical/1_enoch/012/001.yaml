  text: Before these things[b][a], Enoch was hidden.
translation:
  language: fr
  text: 'Avant toute chose, Hénoch fut caché. Aucun des humains ne savait où il avait été caché, où il se trouvait ni ce qui lui était arrivé. De son temps, toutes ses œuvres étaient auprès des saints et des Veilleurs. Moi, Hénoch, je bénissais le grand Seigneur et le Roi du monde. Voici que les Veilleurs m’appelèrent, moi, Hénoch, le scribe, et me dirent : « Hénoch, scribe de justice, va annoncer aux Veilleurs du ciel qu’ils ont abandonné le très haut ciel et la demeure sainte éternelle, qu’ils se sont souillés avec des femmes, qu’ils ont agi comme le font les humains, qu’ils ont pris des femmes pour eux-mêmes et qu’ils ont commis une grande corruption sur la terre. Ils n’auront sur la terre ni paix ni pardon pour leur péché. Puisqu’ils se réjouissent de leurs enfants, ils verront le meurtre de leurs bien-aimés ; ils se lamenteront sur la destruction de leurs enfants et supplieront à jamais, mais ils n’obtiendront ni miséricorde ni paix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተከብተ
  choice: fut caché
  rationale: Dans ce contexte, la forme décrit la mise à l’écart ou la dissimulation d’Hénoch. La traduction passive conserve directement le sens narratif sans préciser qui l’a caché.
- source_word: ውሉደ፡ ሰብእ
  choice: les humains
  rationale: L’expression signifie littéralement « les enfants des hommes ». « Les humains » en restitue ici la portée collective dans un français naturel et inclusif.
- source_word: ትጉሃን
  choice: Vigilants
  rationale: Le terme désigne les êtres célestes traditionnellement appelés « Veilleurs ». « Vigilants » garde l’idée étymologique d’attention éveillée tout en distinguant ce groupe dans le récit.
- source_word: ጸሓፌ፡ ጽድቅ
  choice: scribe de justice
  rationale: La construction nominale est conservée au plus près. Elle peut qualifier Hénoch comme scribe lié à la justice, sans préciser davantage la relation.
- source_word: ምቅዋመ፡ ቅዱሰ፡ ዘለዓለም
  choice: le sanctuaire éternel
  rationale: L’expression désigne littéralement un lieu ou séjour saint éternel. « Sanctuaire éternel » rend de façon concise sa qualité sacrée sans l’identifier à une institution terrestre.
- source_word: ኀድገተ፡ ኀጢአት
  choice: pardon de leur péché
  rationale: Le syntagme exprime la remise ou l’abandon du péché. « Pardon » est le terme français courant et théologiquement non surchargé dans cette annonce de jugement.
- source_word: ቀትለ፡ ፍቁራኒሆሙ
  choice: la mort de ceux qu’ils aiment
  rationale: Le premier nom peut évoquer le meurtre ou la mise à mort. « La mort » laisse ouverte la manière exacte dont les êtres aimés périront, tandis que « ceux qu’ils aiment » conserve le rapport affectif.
theological_decisions:
- issue: Nature des « saints » et des « Vigilants »
  choice: Conserver deux désignations distinctes sans expliquer leur rapport.
  alternative: Identifier explicitement les deux groupes comme des anges ou les fondre en un seul groupe.
  rationale: Le texte les coordonne mais ne définit pas ici précisément leur identité ni leur relation. La traduction préserve cette distinction et cette réserve.
- issue: Portée du titre « scribe de justice »
  choice: Maintenir la construction nominale ouverte.
  alternative: Traduire « scribe juste » ou « scribe de la vérité ».
  rationale: Le génitif peut indiquer le domaine, la qualité ou la mission du scribe. « Scribe de justice » conserve cette tension sans imposer une interprétation doctrinale.
- issue: Absence de paix et de pardon
  choice: Présenter ces paroles comme l’oracle adressé aux Vigilants rebelles.
  alternative: Généraliser l’énoncé en doctrine absolue sur tout péché ou toute repentance.
  rationale: La portée immédiate du jugement concerne les Vigilants décrits dans le passage. La traduction n’étend pas silencieusement cette sentence à d’autres sujets.
- issue: Durée de leur supplication
  choice: Traduire ለዓለም par « pour toujours ».
  alternative: Traduire « jusqu’à l’âge » ou « à jamais ».
  rationale: « Pour toujours » est naturel et rend la durée indéfinie ou perpétuelle de l’expression, sans élaborer un système eschatologique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée pour la lisibilité, notamment dans la longue accusation adressée aux Vigilants, tout en conservant la progression du guèze, les répétitions théologiquement significatives de « paix » et la distinction entre saints, Vigilants et humains.
