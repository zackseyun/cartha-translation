revisions:
- from: 'Avant tout cela, Hénoch fut caché. Aucun des humains ne savait où il avait été caché, où il se trouvait ni ce qui lui était arrivé. Durant sa vie, toute son activité se déroulait auprès des saints et des Vigilants. Moi, Hénoch, je bénissais le Seigneur majestueux et le Roi du monde. Alors les Vigilants m’appelèrent, moi, Hénoch, le scribe, et me dirent : « Hénoch, scribe de justice, va faire savoir ceci aux Vigilants du ciel qui ont abandonné le ciel très élevé et le sanctuaire éternel, qui se sont souillés avec des femmes, ont agi comme le font les humains, ont pris des femmes pour eux-mêmes et ont répandu une immense corruption sur la terre : ils ne connaîtront sur la terre ni paix ni pardon de leur péché. Puisqu’ils trouvent leur joie dans leurs enfants, ils verront la mort de ceux qu’ils aiment ; ils se lamenteront sur la destruction de leurs enfants et supplieront pour toujours, mais ils n’obtiendront ni miséricorde ni paix. »'
  to: 'Avant toute chose, Hénoch fut caché. Aucun des humains ne savait où il avait été caché, où il se trouvait ni ce qui lui était arrivé. De son temps, toutes ses œuvres étaient auprès des saints et des Veilleurs. Moi, Hénoch, je bénissais le grand Seigneur et le Roi du monde. Voici que les Veilleurs m’appelèrent, moi, Hénoch, le scribe, et me dirent : « Hénoch, scribe de justice, va annoncer aux Veilleurs du ciel qu’ils ont abandonné le très haut ciel et la demeure sainte éternelle, qu’ils se sont souillés avec des femmes, qu’ils ont agi comme le font les humains, qu’ils ont pris des femmes pour eux-mêmes et qu’ils ont commis une grande corruption sur la terre. Ils n’auront sur la terre ni paix ni pardon pour leur péché. Puisqu’ils se réjouissent de leurs enfants, ils verront le meurtre de leurs bien-aimés ; ils se lamenteront sur la destruction de leurs enfants et supplieront à jamais, mais ils n’obtiendront ni miséricorde ni paix. »'
  rationale: La révision conserve l’étendue intégrale du témoin guèze et la progression de l’oracle, tout en rétablissant « grand » et « meurtre » là où le projet atténuait le texte. Elle adopte « Veilleurs », terme français usuel, et « demeure sainte éternelle », qui maintient l’ambiguïté du lieu céleste sans interprétation cultuelle excessive. Aucun appel de note n’est présent dans le texte et aucune note n’est nécessaire.
