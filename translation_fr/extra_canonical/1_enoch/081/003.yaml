base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: fr
  text: En ce temps-là, je bénis le grand Seigneur, le Roi de gloire pour toujours, parce qu’il avait fait toutes les œuvres du monde. Je louai le Seigneur pour sa patience[a], et je le bénis au sujet des enfants d’Adam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour sa longanimité » ou « pour sa patience pleine de retenue »; le terme guèze peut désigner une endurance qui se retient d’agir, et non une simple attente passive.
    reason: lexical_alternative
  - marker: b
    text: L’expression littérale « enfants d’Adam » désigne les êtres humains tout en conservant leur lien explicite avec Adam. La préposition peut aussi se comprendre comme « à cause des » ou « en faveur des ».
    reason: cultural_note
lexical_decisions:
- source_word: እምሶቤሃ
  choice: En ce temps-là
  rationale: Cette expression conserve la valeur de transition temporelle et le registre narratif-apocalyptique du guèze.
- source_word: ባረክዎ / ባረኩ
  choice: je bénis / je le bénis
  rationale: Le verbe de bénédiction reste distinct de celui qui signifie « louer » dans la proposition suivante.
- source_word: እግዚአ ዐቢይ
  choice: le grand Seigneur
  rationale: Rendu direct du titre et de son qualificatif, sans renforcer « grand » en « puissant ».
- source_word: ንጉሠ ስብሐት
  choice: le Roi de gloire
  rationale: La construction nominale est conservée comme titre doxologique plutôt que transformée en « roi glorieux ».
- source_word: ለዓለም
  choice: pour toujours
  rationale: Expression française naturelle de la durée sans fin dans ce contexte de louange.
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: parce qu’il avait fait toutes les œuvres du monde
  rationale: La formulation maintient le vocabulaire concret des « œuvres » et celui du « monde », au lieu de les réduire à « tout » ou d’introduire « univers ». Le plus-que-parfait situe l’acte créateur avant la bénédiction racontée.
- source_word: ሰባሕኩ
  choice: je louai
  rationale: Ce choix distingue le verbe de louange des deux emplois du verbe « bénir ».
- source_word: ትዕግሥቱ
  choice: sa patience
  rationale: Terme français courant et digne; une note signale la nuance possible de retenue durable ou de longanimité.
- source_word: ዲበ ውሉደ አዳም
  choice: au sujet des enfants d’Adam
  rationale: « Au sujet de » respecte la souplesse de la préposition sans imposer une valeur causale ou bénéficiaire; « enfants d’Adam » conserve la référence généalogique explicite.
theological_decisions:
- issue: Portée de ውሉደ አዳም
  choice: les enfants d’Adam
  alternative: les êtres humains / l’humanité
  rationale: La traduction maintient le lien explicite avec Adam et la dimension de filiation humaine, sans rendre l’expression exclusivement masculine ni la remplacer par une abstraction.
- issue: Rapport entre la bénédiction et les enfants d’Adam
  choice: au sujet des enfants d’Adam
  alternative: à cause des enfants d’Adam / en faveur des enfants d’Adam
  rationale: La préposition guèze permet plusieurs nuances. La formulation retenue préserve cette relative indétermination sans attribuer au passage une causalité ou une valeur bénéficiaire plus précise qu’il ne l’exprime.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le passé simple convient à la narration littéraire. La répétition de « bénir » et le contraste avec « louer » sont volontairement conservés, de même que la formule inhabituelle « toutes les œuvres du monde ».
