lexical_decisions:
- source_word: ዓመተ፡ አሐደ፡
  choice: Pendant un an
  rationale: Expression temporelle directe, rendue dans un français naturel.
- source_word: ነኅድገከ፡
  choice: nous te laisserons
  rationale: La forme verbale est à la première personne du pluriel et signifie ici « laisser » ou « permettre de rester ».
- source_word: በኀበ፡ ወልድከ፡
  choice: auprès de ton fils
  rationale: La préposition exprime la proximité ou l’association; « auprès de » convient au registre et évite de suggérer une prise en charge absente du texte.
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: jusqu’à ce qu’un nouvel ordre soit donné
  rationale: La suite indique une limite temporelle liée à un ordre ultérieur. La tournure française explicite minimalement la relation syntaxique sans identifier celui qui donne l’ordre.
- source_word: ከመ፡
  choice: afin que…
  rationale: La conjonction introduit normalement un but ou une proposition consécutive. Le témoin fourni étant tronqué après ce mot, les points de suspension préservent l’inachèvement.
theological_decisions:
- issue: Nature de la directive faisant autorité
  choice: ordre
  alternative: commandement; instruction
  rationale: « Ordre » conserve la force d’une directive céleste dans ce contexte apocalyptique, sans lui donner une coloration doctrinale ou juridique plus précise que le texte.
- issue: Sujet pluriel du verbe
  choice: nous te laisserons
  alternative: je te laisserai
  rationale: La première personne du pluriel est grammaticalement attestée dans la forme guèze et correspond aux locuteurs pluriels du contexte; la réduire au singulier effacerait cette donnée.
translation_notes:
  register: Français international moderne, clair et digne. Le futur pluriel et la proposition finale inachevée sont conservés. L’ajout minimal « soit donné » rend la construction temporelle intelligible et est signalé en note.
