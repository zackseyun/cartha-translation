base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: fr
  text: 'Et il me dit : « Regarde, Hénoch, les tablettes du ciel[a], lis ce qui y est écrit et comprends tout, une chose après l’autre.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « tablettes du ciel » désignent ici des documents célestes écrits, image caractéristique de la littérature apocalyptique.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « comprends toutes choses, une par une » ; la répétition souligne que chaque élément doit être considéré séparément.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጽር
  choice: Regarde
  rationale: Impératif direct et naturel du verbe de vision; « Voici » serait plus archaïsant et moins précisément verbal.
- source_word: ዘፀፍፀፈ ሰማይ
  choice: les tablettes du ciel
  rationale: Conserve l’image concrète de documents célestes écrits, sans l’aplanir en « livres » ou « registres ».
- source_word: አንብብ
  choice: lis
  rationale: Impératif simple; rien dans le contexte n’impose l’idée de lire à haute voix.
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: ce qui y est écrit
  rationale: Formulation française naturelle dont le pronom renvoie clairement aux tablettes.
- source_word: እእምር
  choice: comprends
  rationale: Exprime ici la saisie du contenu après sa lecture, plutôt que la seule acquisition d’une connaissance.
- source_word: ኵሎ አሐደ አሐደ
  choice: tout, chaque chose l’une après l’autre
  rationale: Préserve à la fois la totalité exprimée par ኵሎ et la force distributive de la répétition አሐደ አሐደ.
theological_decisions:
- issue: Image apocalyptique des écrits célestes
  choice: les tablettes du ciel
  alternative: les tablettes célestes; les livres du ciel
  rationale: Le texte présente concrètement des tablettes portant une inscription. Cette traduction maintient l’image apocalyptique sans la réduire à une métaphore abstraite ni lui substituer des « livres ».
- issue: Portée distributive de la compréhension
  choice: tout, chaque chose l’une après l’autre
  alternative: chaque chose individuellement; tout, un élément après l’autre
  rationale: La répétition éthiopienne marque une lecture ou compréhension particularisée; la traduction conserve cette nuance sans préciser davantage que le texte le rapport entre les éléments.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe singulière. La ponctuation rend la série d’impératifs sans archaïsme; « tablettes du ciel » conserve volontairement l’étrangeté concrète de l’image.
