base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: fr
  text: 'À partir de là, je dis : « Heureux l’homme qui meurt juste et bon, au sujet duquel aucun livre d’injustice n’a été écrit et pour qui aucun jour de jugement ne sera trouvé ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኔሁ
  choice: à ce sujet
  rationale: Rend naturellement la reprise pronominale « de cela / à partir de cela » sans reproduire la duplication fautive de la couche anglaise.
- source_word: ብፁዕ
  choice: Heureux
  rationale: Formule de béatitude usuelle et digne en français.
- source_word: ብእሲ
  choice: l’homme
  rationale: Désigne ici une personne de manière générique dans la formule sapientielle.
- source_word: ዘይመውት፡ ጻድቅ፡ ወኄር
  choice: qui meurt juste et bon
  rationale: 'Conserve la portée prédicative probable des adjectifs : l’homme meurt dans l’état d’un juste et d’un homme bon, plutôt que de les déplacer sans nécessité avant le nom.'
- source_word: መጽሐፈ፡ ዐመፃ
  choice: livre d’injustice
  rationale: Traduction formelle de l’expression, comprise comme un registre des actes injustes sans en préciser davantage la nature.
- source_word: ኢተጽሕፈ፡ ዲቤሁ
  choice: n’a été écrit contre lui
  rationale: « Contre lui » exprime la fonction accusatrice du registre et convient mieux au contexte judiciaire que le simple « sur lui ».
- source_word: ዕለተ፡ ኵነኔ
  choice: jour de jugement
  rationale: Conserve l’expression judiciaire sans ajouter de qualification eschatologique absente du texte.
theological_decisions:
- issue: Lien entre la justice de l’homme et l’absence de jugement
  choice: Maintenir les deux propositions telles quelles, sans expliciter un mécanisme de salut ou de mérite.
  alternative: Expliquer que l’absence de condamnation découle nécessairement des œuvres de l’homme.
  rationale: Le verset énonce une béatitude et une absence de dossier accusateur, mais ne développe pas ici leur relation théologique.
- issue: Valeur de ኵነኔ
  choice: jugement
  alternative: condamnation
  rationale: « Jugement » préserve l’amplitude judiciaire du terme et évite de décider que l’issue est nécessairement une condamnation, même si ce sens reste contextuellement possible.
translation_notes:
  register: Français international moderne, solennel mais accessible. La phrase conserve le parallélisme judiciaire de l’original et corrige la répétition manifestement accidentelle de la consultation anglaise.
