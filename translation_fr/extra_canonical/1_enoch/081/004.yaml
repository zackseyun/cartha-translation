    rationale: Le texte source porte « écrit sur lui » (ou « à son sujet »), et non explicitement « contre lui ». La tournure actuelle accentue indûment la fonction accusatrice du livre.
  - severity: low
    issue: « Et à ce sujet » pour እምኔሁ
    rationale: La locution est plus naturellement comprise comme une transition de provenance ou de suite (« de là / à partir de là ») que comme le thème d’un propos (« à ce sujet »).
