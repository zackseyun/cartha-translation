base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: fr
  text: 'Et ces sept êtres saints me firent approcher et me déposèrent sur la terre, devant la porte de ma maison[a]. Ils me dirent : « Fais tout connaître à Mathusalem, ton fils, et montre à tous tes enfants qu’aucune chair n’est juste devant le Seigneur[b], car c’est lui qui les a créés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant l’entrée de ma maison ». Le terme guèze peut désigner une porte ou l’espace d’entrée.
    reason: lexical_alternative
  - marker: b
    text: L’expression concrète « aucune chair » désigne les êtres mortels, ou l’humanité dans sa condition corporelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: me firent approcher
  rationale: Le causatif exprime l’idée de faire venir ou approcher. Cette formulation conserve cette nuance directionnelle sans simplement rendre le verbe par « m’amenèrent ».
- source_word: ፯ ቅዱሳን
  choice: sept êtres saints
  rationale: Dans ce contexte apocalyptique, il s’agit d’êtres célestes. « Êtres saints » conserve leur caractère sans évoquer principalement les saints du vocabulaire ecclésiastique postérieur.
- source_word: አንበሩኒ
  choice: me déposèrent
  rationale: Le verbe signifie faire asseoir ou placer. « Me déposèrent » convient au retour sur terre et reste naturel en français.
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: devant la porte de ma maison
  rationale: Cette traduction garde la préposition spatiale et le terme concret désignant la porte ou l’entrée.
- source_word: አይድዕ ኵሎ
  choice: Fais tout connaître
  rationale: 'L’impératif est causatif : il commande de faire connaître, et non simplement de savoir ou de raconter.'
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: montre à tous tes enfants
  rationale: Le verbe signifie « montrer » ou « faire voir », et le nom pluriel peut désigner largement la descendance plutôt que les seuls fils de sexe masculin.
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: qu’aucune chair n’est juste
  rationale: La construction porte une négation universelle. La traduction maintient à la fois cette portée et l’image concrète de la chair.
- source_word: ዘሥጋ
  choice: chair
  rationale: Le terme concret appartient au langage biblique et apocalyptique. Le conserver évite de réduire d’emblée son sens à « personne » ou « humanité ».
- source_word: በቅድመ እግዚአ
  choice: devant le Seigneur
  rationale: C’est la traduction directe et idiomatique de la relation spatiale ou judiciaire exprimée par le texte.
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: car c’est lui qui les a créés
  rationale: La tournure clivée rend l’insistance du pronom sujet, tandis que le pluriel « les » préserve la référence grammaticale du texte source.
theological_decisions:
- issue: Portée de l’affirmation sur la chair et la justice
  choice: Une déclaration universelle selon laquelle aucune chair n’est juste devant le Seigneur
  alternative: Une affirmation limitée à l’impureté rituelle, à la mortalité, ou une formulation explicitement centrée sur la justification au sens paulinien ultérieur
  rationale: Le guèze affirme littéralement qu’aucune chair « n’est juste » devant le Seigneur. La traduction conserve cette tension anthropologique et théologique sans l’enfermer dans une doctrine postérieure.
- issue: Référence du pronom pluriel dans « il les a créés »
  choice: Conserver le pronom pluriel sans expliciter davantage son antécédent
  alternative: Remplacer le pronom par « tous les êtres de chair » ou « tous tes enfants »
  rationale: Le texte source emploie un pluriel dont la référence peut être comprise à partir de la chair envisagée collectivement ou des êtres humains mentionnés. L’expliciter supprimerait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du guèze, tout en évitant des calques peu naturels. « Êtres saints » préserve le contexte céleste, et « aucune chair » maintient l’idiome biblique ainsi que sa tension théologique.
