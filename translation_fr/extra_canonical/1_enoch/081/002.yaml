base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: fr
  text: Et je regardai les tablettes du ciel, et je lus tout ce qui était écrit, et je compris tout. Puis je lus le livre de toutes les actions des humains et de tous les enfants de chair[a] sur la terre, jusqu’aux générations de l’éternité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Enfants de chair » est une expression sémitisante désignant les êtres humains dans leur condition terrestre et mortelle.
    reason: cultural_note
  - marker: b
    text: 'On pourrait aussi traduire : « jusqu’aux générations éternelles » ou « pour les générations, à jamais ». L’expression a une portée ample et n’indique pas une chronologie précise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: je regardai
  rationale: Rend directement le verbe de vision sans lui ajouter l’intensité que pourrait suggérer « contemplai ».
- source_word: በፀፍፀፈ ሰማይ
  choice: les tablettes du ciel
  rationale: Conserve l’image concrète des archives célestes propre au langage apocalyptique; la préposition française est naturellement régie par « regarder ».
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: je lus tout ce qui était écrit
  rationale: Préserve à la fois la totalité exprimée par ኵሎ et le caractère passif de ce qui est écrit.
- source_word: አእመርኩ ኵሎ
  choice: je compris tout
  rationale: Distingue clairement la compréhension de la simple lecture et garde la portée totalisante de l’expression.
- source_word: አንበብክዋ ለመጽሐፈ
  choice: je lus le livre
  rationale: Formulation française naturelle qui conserve la reprise du verbe « lire » et explicite son objet.
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: de toutes les actions des humains
  rationale: « Actions » rend largement les actes et la conduite; « humains » exprime ici la portée universelle sans restriction masculine indue.
- source_word: ውሉደ ሥጋ
  choice: enfants de chair
  rationale: Traduction volontairement concrète qui maintient la texture anthropologique et apocalyptique de l’expression sémitisante.
- source_word: ዘዲበ ምድር
  choice: sur la terre
  rationale: Respecte la proposition relative sans verbe explicite en guèze et évite d’introduire un présent ou un futur absent de la forme source.
- source_word: እስከ ትውልደ ዓለም
  choice: jusqu’aux générations de l’éternité
  rationale: Conserve l’expression ample et élevée du texte, sans la réduire au simple adverbe « toujours ».
theological_decisions:
- issue: Portée anthropologique de ውሉደ ሥጋ
  choice: enfants de chair
  alternative: tous les mortels
  rationale: La formulation littérale maintient le contraste implicite entre la condition terrestre et charnelle des humains et les archives célestes, sans imposer une interprétation doctrinale.
- issue: Temporalité de ዘዲበ ምድር
  choice: sur la terre
  alternative: qui sont sur la terre / qui seront sur la terre
  rationale: Le guèze ne comporte pas ici de verbe temporel explicite. La traduction laisse donc le contexte déterminer la portée présente ou future.
- issue: Portée de እስከ ትውልደ ዓለም
  choice: jusqu’aux générations de l’éternité
  alternative: pour toutes les générations à venir / jusqu’aux générations éternelles
  rationale: La traduction garde l’ouverture temporelle et la tension de l’idiome apocalyptique au lieu de préciser artificiellement sa chronologie.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le registre narratif visionnaire sans archaïsme excessif. La coordination répétée du guèze est partiellement conservée, mais la ponctuation évite une phrase française trop lourde. Les images concrètes « tablettes du ciel » et « enfants de chair » sont maintenues.
