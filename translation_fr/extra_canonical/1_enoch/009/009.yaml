lexical_decisions:
- source_word: አንስት
  choice: les femmes
  rationale: Le nom pluriel désigne des femmes. L’article défini, avec la particule topicalisante -ሰ, maintient le renvoi aux femmes déjà évoquées dans le contexte, sans préciser qu’elles seraient des épouses.
- source_word: ወለዳ
  choice: ont enfanté
  rationale: Rend directement l’idée de mettre au monde, avec une valeur accomplie adaptée au constat formulé.
- source_word: ረዓይተ
  choice: des géants
  rationale: Dans le contexte des Veilleurs, le terme désigne leur progéniture gigantesque; ce rendu conserve le sens traditionnel et contextuel sans développer la formulation.
- source_word: በዘ
  choice: par là
  rationale: Expression française concise qui préserve le lien de moyen ou de conséquence sans le rendre plus explicite que le guèze.
- source_word: መልአት
  choice: a été remplie
  rationale: Conserve l’image concrète du remplissage et la valeur résultative de la forme verbale.
- source_word: ኵላ ምድር
  choice: toute la terre
  rationale: Rendu naturel de la totalité visée; le contexte apocalyptique favorise « terre » plutôt que « pays ».
- source_word: ደመ
  choice: de sang
  rationale: Traduction littérale qui garde l’image saisissante du sang au lieu de l’interpréter comme « effusion de sang ».
theological_decisions:
- issue: Degré d’explicitation du rapport causal ou consécutif
  choice: et par là toute la terre a été remplie de sang
  alternative: et c’est pourquoi toute la terre a été remplie de sang
  rationale: « Par là » conserve la brièveté et une certaine latitude entre moyen et conséquence, sans développer l’accusation au-delà du témoin guèze.
- issue: Identification des géants
  choice: Maintenir « géants » dans le texte et expliquer sobrement le contexte en note
  alternative: leur progéniture monstrueuse
  rationale: Le rendu traditionnel convient au contexte, tandis que la note indique le lien avec les unions des Veilleurs sans incorporer une explication doctrinale dans le verset.
translation_notes:
  register: Français moderne, digne et direct. « Enfanter » garde une tonalité littéraire accessible; « par là » préserve la formulation compacte et l’ambiguïté du rapport logique.
