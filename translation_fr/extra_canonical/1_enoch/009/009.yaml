  text: and the women have borne giants[b][a], and by this the whole earth has been filled with blood.
translation:
  language: fr
  text: et les femmes ont enfanté des géants[a], et ainsi toute la terre a été remplie de sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, il s’agit vraisemblablement de la progéniture géante issue des unions illicites des Veilleurs ; le guèze énonce ici le résultat de façon concise.
