base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: fr
  text: Et Semyaza[a], à qui tu as donné l’autorité de gouverner ceux qui sont avec lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom est aussi transcrit « Semjaza » ou « Shemyaza ».
    reason: transliteration_alternative
  - marker: b
    text: 'Ou : « ceux qui sont réunis avec lui ». L’expression peut désigner ses compagnons ou ses associés rassemblés autour de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Le nom propre est translittéré plutôt que traduit; cette forme reste proche de la graphie guèze et de l’usage critique fourni.
- source_word: ዘአንተ ወሀብኮ
  choice: à qui tu as donné
  rationale: La construction relative et la deuxième personne masculine singulière indiquent que Dieu, auquel les anges s’adressent, est le sujet du don; Semyaza en est le bénéficiaire.
- source_word: ስልጣነ
  choice: l’autorité
  rationale: « Autorité » exprime une compétence déléguée et convient mieux que « puissance » ou « domination », qui pourraient suggérer une souveraineté intrinsèque.
- source_word: ይኵንን
  choice: de gouverner
  rationale: Le verbe de gouvernement est rendu explicitement, plutôt que d’être absorbé dans une simple préposition comme « sur ».
- source_word: እለ ምስሌሁ ኅቡረ
  choice: ceux qui sont avec lui
  rationale: Cette formulation française naturelle conserve l’idée d’association collective sans préciser au-delà du texte la nature exacte du groupe.
theological_decisions:
- issue: Nature de l’autorité de Semyaza
  choice: Une autorité que Dieu lui a donnée pour gouverner ses associés
  alternative: Une puissance ou une domination appartenant en propre à Semyaza
  rationale: La syntaxe présente cette autorité comme reçue, donc déléguée; la traduction évite de transformer cette fonction en souveraineté intrinsèque.
- issue: Identité des personnes placées sous son autorité
  choice: « ceux qui sont avec lui »
  alternative: « les Veilleurs réunis sous son commandement »
  rationale: Le contexte peut désigner les Veilleurs associés à Semyaza, mais le verset lui-même emploie une expression plus générale; la traduction préserve cette latitude.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La phrase demeure un fragment coordonné par « Et », comme dans la source et le passage environnant.
