base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/002.yaml
  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
translation:
  language: fr
  text: 'Et ils se dirent entre eux : « La voix de leurs cris est montée, et la terre a crié jusqu’aux portes du ciel. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La transcription porte ዐረቀ, mais la forme semble représenter ዐርገ, « est montée ». La suite se lit littéralement comme une seconde proposition : « et la terre a crié jusqu’aux portes du ciel ».'
    reason: textual_and_grammatical_note
lexical_decisions:
- source_word: ወይቤሉ
  choice: Et ils se dirent
  rationale: Le verbe narratif introduit ici le discours direct. Le pronom réfléchi français, avec le complément réciproque qui suit, rend naturellement l’échange au sein du groupe.
- source_word: በበይናቲሆሙ
  choice: entre eux
  rationale: Cette expression réciproque convient à plusieurs interlocuteurs et donne un français courant.
- source_word: ቃለ ጽራኃቲሆሙ
  choice: La voix de leurs cris
  rationale: ቃል désigne la voix ou le son, tandis que la forme suffixée ጽራኃቲሆሙ renvoie à leurs cris. Le pluriel « cris » conserve la dimension collective sans atténuer la détresse.
- source_word: ዐረቀ
  choice: est montée
  rationale: La forme transcrite paraît représenter ዐርገ, « monter ». Le parfait est rendu par le passé composé et le mouvement ascendant est maintenu explicitement.
- source_word: ጸርሐት ምድር
  choice: la terre a crié
  rationale: ጸርሐት est analysé comme un verbe au parfait, troisième personne du féminin singulier, dont ምድር, nom féminin signifiant « terre », est le sujet. Cette lecture conserve la personnification de la terre.
- source_word: እስከ አንቀጸ ሰማይ
  choice: jusqu’aux portes du ciel
  rationale: « Jusqu’à » exprime l’extension du cri jusqu’à sa limite, et « les portes du ciel » préserve l’image cosmologique concrète.
theological_decisions:
- issue: Le texte évoque-t-il seulement les cris des victimes, ou également le cri de la terre ?
  choice: 'Deux propositions parallèles sont conservées : les cris des victimes montent et la terre elle-même crie.'
  alternative: Comprendre « le cri de la terre » comme une apposition décrivant uniquement les cris humains.
  rationale: La morphologie de ጸርሐት favorise nettement une forme verbale féminine accordée avec ምድር. La traduction garde donc la personnification et le parallèle entre la détresse humaine et celle de la terre, sans les fondre en une seule voix.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste claire pour un lectorat général tout en conservant le parallélisme, le mouvement ascendant et la personnification apocalyptique de la terre.
