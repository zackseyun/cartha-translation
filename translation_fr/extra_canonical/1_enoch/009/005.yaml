base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: fr
  text: C’est toi qui as fait toutes choses, et l’autorité sur toutes choses est avec toi. Toutes choses sont à découvert et manifestes devant toi ; tu vois toutes choses, et rien ne peut se cacher de toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገበርከ
  choice: as fait
  rationale: Le verbe signifie « faire » ou « accomplir ». Avec « toutes choses » comme complément, « as fait » exprime l’œuvre divine universelle sans préciser un mode de création que le guèze n’énonce pas.
- source_word: ስልጣነ
  choice: l’autorité
  rationale: Le nom désigne le pouvoir de gouverner, la domination ou l’autorité. « Autorité » conserve à la fois l’idée de souveraineté et celle de pouvoir légitime.
- source_word: ምስሌከ
  choice: est avec toi
  rationale: La formulation reproduit le sens littéral « avec toi », qui peut ici évoquer aussi bien la possession que la présence, sans réduire l’expression à « t’appartient ».
- source_word: ክሡት
  choice: à découvert
  rationale: Le terme décrit ce qui est découvert ou exposé. Cette expression garde l’image concrète d’une exposition totale devant Dieu.
- source_word: ግሁድ
  choice: manifeste
  rationale: Associé au terme précédent, le mot renforce l’idée que rien n’est caché. « Manifeste » préserve ce parallélisme sans fusionner les deux expressions.
- source_word: ትሬኢ
  choice: tu vois
  rationale: Traduction directe et naturelle du verbe de perception visuelle, maintenant l’expression concrète de la connaissance divine.
- source_word: ዘይትከሀል
  choice: peut
  rationale: Le mot exprime la capacité ou la possibilité. « Peut » rend naturellement cette nuance en français moderne.
- source_word: ይትኀባእ
  choice: se cacher
  rationale: La forme comporte une nuance réfléchie ou médio-passive. « Se cacher » conserve l’idée que rien ne peut échapper au regard divin.
theological_decisions:
- issue: Faut-il expliciter le verset au moyen des catégories doctrinales d’omnipotence et d’omniscience ?
  choice: Conserver les images concrètes de l’action créatrice, de l’autorité, de l’exposition et de la vue.
  alternative: Tu es tout-puissant et omniscient ; tout t’est connu.
  rationale: Le verset implique la souveraineté et la connaissance universelles de Dieu, mais les exprime par des formulations concrètes. La traduction les maintient sans leur substituer une synthèse doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « C’est toi qui » restitue l’emphase initiale ; « est avec toi » conserve volontairement la formulation du guèze malgré une légère étrangeté en français.
