base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: fr
  text: 'Ils dirent au Seigneur des rois[b] : « Car tu es le Seigneur des seigneurs, le Dieu des dieux et le Roi des rois ; le trône de ta gloire subsiste de génération en génération, pour l’éternité, et ton nom est saint et glorieux pour toute l’éternité, et béni[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins ou certaines lectures ajoutent après « béni » : « et honoré » ou « et glorieux ».'
    reason: textual_variant
  - marker: b
    text: 'L’éthiopien présente ici une construction resserrée, littéralement proche de « à leur Seigneur, celui des rois » ; on peut aussi comprendre : « à leur Seigneur, le Roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: au Seigneur des rois
  rationale: La construction à suffixe anticipatif se comprend le plus naturellement comme « au Seigneur des rois ». Une note signale la syntaxe éthiopienne resserrée et l’autre analyse possible.
- source_word: እስመ
  choice: Car
  rationale: La conjonction introduit la raison ou l’acclamation explicative qui suit; elle ne doit pas être omise.
- source_word: እግዚኦሙ ለአጋእዝት
  choice: le Seigneur des seigneurs
  rationale: Cette formule superlative conserve le premier élément de la triple titulature divine et son parallélisme.
- source_word: አምላኮሙ ለአማልክት
  choice: le Dieu des dieux
  rationale: La traduction formelle maintient la structure de supériorité et le parallélisme rhétorique.
- source_word: ንጉሦሙ ለነገሥት
  choice: le Roi des rois
  rationale: Cette formulation traditionnelle et transparente achève la triple acclamation sans la réduire à une paraphrase.
- source_word: መንበረ ስብሐቲከ
  choice: le trône de ta gloire
  rationale: Le complément nominal préserve l’image concrète du trône et distingue celle-ci d’un simple « trône glorieux ».
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: à travers toutes les générations de l’éternité
  rationale: Dans cette doxologie, ዓለም a une valeur temporelle (« âge, éternité »), confirmée par la tradition grecque, plutôt que spatiale (« monde »).
- source_word: ስምከ ቅዱስ ወስቡሕ ውስተ ኵሉ ዓለም ወቡሩክ
  choice: ton nom est saint et glorieux pour toute l’éternité, et béni
  rationale: La traduction respecte l’ordre des prédicats et la portée temporelle de ዓለም. « Glorieux » rend ici ስቡሕ dans son registre doxologique, sans déplacer « béni ».
theological_decisions:
- issue: Maintien de la triple titulature divine
  choice: Conserver « Seigneur des seigneurs, Dieu des dieux et Roi des rois »
  alternative: Résumer par « souverain suprême » ou « Dieu au-dessus de tous »
  rationale: La répétition solennelle exprime la suprématie divine et constitue un trait rhétorique essentiel de l’acclamation céleste.
- issue: Valeur de ዓለም dans les deux expressions temporelles
  choice: Traduire par « éternité »
  alternative: Traduire par « monde »
  rationale: Le contexte doxologique et l’attestation grecque orientent vers αἰών, « âge/éternité », sans transformer la déclaration en affirmation spatiale.
- issue: Mot final incertain [ወከቡድ]
  choice: Ne pas l’intégrer au texte principal et le signaler en note
  alternative: Ajouter « et honoré » ou « et glorieux » après « béni »
  rationale: Les crochets de l’édition indiquent une lecture textuellement incertaine; la note rend la variante visible sans la présenter comme assurée.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tutoiement conserve l’adresse directe traditionnelle à Dieu. La syntaxe doxologique et les répétitions titulaires sont maintenues; le verbe « demeure » est ajouté en français pour rendre naturelle la proposition nominale éthiopienne.
