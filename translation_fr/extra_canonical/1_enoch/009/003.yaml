base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: fr
  text: 'Et maintenant, c’est à vous, êtres saints du ciel, que les âmes des humains adressent leur requête en disant : « Portez notre cause devant le Très-Haut. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Faites-nous justice devant le Très-Haut » ou « Présentez notre affaire au Très-Haut ». Le terme guèze relève du langage judiciaire et peut désigner à la fois la cause soumise au juge et la justice recherchée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque simplement la transition temporelle et rhétorique du discours, sans surcharger la particule finale.
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: c’est à vous, êtres saints du ciel
  rationale: Conserve l’adresse aux êtres célestes et évite que « saints » soit spontanément compris comme une désignation de fidèles humains canonisés.
- source_word: ይስእዩ ... እንዘ ይብሉ
  choice: adressent leur requête en disant
  rationale: Rend l’acte de supplication dans un français actuel tout en maintenant la tonalité formelle et judiciaire du contexte.
- source_word: ነፍሳተ ሰብእ
  choice: les âmes des humains
  rationale: Préserve le vocabulaire anthropologique du texte tout en employant une formulation moderne et inclusive au sens générique.
- source_word: አብኡ ለነ ፍትሐ
  choice: Portez notre cause
  rationale: « Cause » exprime une affaire soumise au jugement plutôt qu’un verdict déjà prononcé; le verbe conserve l’idée de la présenter à la cour divine.
- source_word: ኀበ ልዑል
  choice: devant le Très-Haut
  rationale: Dans ce cadre judiciaire, « devant » exprime à la fois la direction et la présentation de la cause en présence de Dieu.
theological_decisions:
- issue: Identité des « êtres saints du ciel »
  choice: Des êtres célestes saints, vraisemblablement angéliques, auxquels les âmes s’adressent
  alternative: Des saints humains se trouvant au ciel
  rationale: Le contexte immédiat évoque la cour céleste et des intermédiaires célestes. La traduction reste toutefois descriptive et n’ajoute pas explicitement le mot « anges ».
- issue: Sens de ፍትሐ dans la requête
  choice: Une cause judiciaire portée devant le Très-Haut
  alternative: La justice, la justification ou le jugement
  rationale: Le terme peut viser à la fois l’affaire soumise au juge et la justice recherchée. « Cause » maintient le cadre juridique sans laisser entendre qu’un verdict a déjà été rendu; la note conserve les autres nuances.
translation_notes:
  register: Français international moderne, digne et lisible. La construction clivée « c’est à vous… que » rend clairement le destinataire malgré l’ordre marqué de la source. Les guillemets français signalent la parole directe.
