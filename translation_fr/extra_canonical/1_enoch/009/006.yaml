  naturalness: La phrase est globalement claire et digne. Toutefois, « enseigner toute injustice » est peu idiomatique en français moderne ; « enseigner toutes les formes d’injustice » rend plus naturellement la portée distributive de « toute » sans restreindre le sens. La reformulation de la relative rend également la progression plus fluide.
  terminology: « Azazel », « les cieux », « révéler » et « choses cachées » conviennent au registre apocalyptique. « Toutes les formes d’injustice » garde la portée morale large de ዓመፃ sans lui imposer une lecture confessionnelle particulière.
