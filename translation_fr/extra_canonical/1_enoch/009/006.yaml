base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: fr
  text: 'Tu vois ce qu’a fait Azazel : il a enseigné toutes les formes d’injustice sur la terre et révélé les choses cachées du monde[a], qui s’accomplissent dans les cieux et dont les humains ont eu connaissance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses cachées de l’âge » ou « les secrets de l’éternité » ; le terme guèze peut avoir ces différents sens.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est difficile dans le témoin guèze. Elle peut aussi se comprendre littéralement : « que les humains ont connues » ou « que les humains ont apprises ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ርኢከ
  choice: Tu vois
  rationale: La deuxième personne introduit directement l’appel adressé à l’être céleste. Le présent conserve l’immédiateté de l’accusation, tout en laissant possible la nuance accomplie du contexte.
- source_word: ዘገብረ
  choice: ce qu’a fait
  rationale: Le passé composé exprime un acte accompli dont les effets demeurent au moment de la plainte.
- source_word: አዛዝኤል
  choice: Azazel
  rationale: Le nom propre est translittéré sous sa forme française courante.
- source_word: ዘመሀረ
  choice: il a enseigné
  rationale: Le verbe désigne la transmission active d’un savoir; « enseigné » garde la portée accusatrice du passage.
- source_word: ኵሎ ዓመፃ
  choice: toute injustice
  rationale: Cette formulation rend une faute morale générale sans la limiter à la violence physique ni à l’injustice sociale.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Formulation naturelle en français moderne pour désigner la sphère terrestre corrompue par cet enseignement.
- source_word: ወአግሀደ
  choice: et révélé
  rationale: Le verbe indique la divulgation de réalités jusque-là cachées; « révélé » convient au registre apocalyptique sans rendre cette divulgation légitime.
- source_word: ኅቡኣተ ዓለም
  choice: les choses cachées du monde
  rationale: ዓለም peut désigner le monde, l’âge ou l’éternité. « Du monde » reste proche du sens contextuel sans imposer une valeur technique.
- source_word: እለ ይትገበሩ በሰማያት
  choice: celles qui s’accomplissent dans les cieux
  rationale: La tournure rend le passif ou l’impersonnel du guèze et conserve le pluriel cosmologique « les cieux ».
- source_word: አመረ ሰብእ
  choice: dont les humains ont eu connaissance
  rationale: La clause difficile indique, dans le témoin guèze transmis, que les humains ont connu ou appris ces réalités. Cette traduction n’ajoute pas l’idée absente d’un effort pour les rechercher.
theological_decisions:
- issue: Portée morale de ዓመፃ
  choice: toute injustice
  alternative: toute iniquité; toute rébellion; toute violence
  rationale: « Toute injustice » garde l’étendue morale de l’accusation sans réduire celle-ci à une seule catégorie de faute et sans introduire un vocabulaire confessionnel marqué.
- issue: Nature des réalités cachées
  choice: les choses cachées du monde, celles qui s’accomplissent dans les cieux
  alternative: les secrets de l’éternité; les mystères de l’âge; les choses cachées qui ont été faites dans le ciel
  rationale: La formulation maintient la tension entre « monde » et « cieux » dans le texte, sans préciser indûment la nature de ces réalités ni les assimiler à une doctrine ultérieure.
- issue: Connaissance acquise par les humains
  choice: dont les humains ont eu connaissance
  alternative: que les humains ont apprises; que les humains cherchaient à apprendre
  rationale: Le témoin guèze soutient ici l’idée de connaître ou d’apprendre, mais non celle d’un effort soutenu pour rechercher ce savoir. La traduction suit donc le texte fourni tout en signalant sa difficulté.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement correspond à l’adresse directe au destinataire céleste. La phrase conserve le ton solennel de l’accusation sans archaïsmes; « les cieux » maintient le registre cosmologique du texte apocalyptique.
