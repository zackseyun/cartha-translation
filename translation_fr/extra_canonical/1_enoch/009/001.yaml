base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: fr
  text: Alors Michel, Uriel, Raphaël et Gabriel regardèrent depuis le ciel et virent beaucoup de sang se répandre sur la terre[a], ainsi que toute l’iniquité qui se commettait sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « être versé ». Le verbe guèze est difficile; certains l’ont rapproché de l’image du sang qui crie. Le texte retient l’image plus immédiate du sang qui se répand sur la terre.'
    reason: lexical_alternative
  - marker: b
    text: La répétition de « sur la terre » est conservée, car elle souligne que la terre est le théâtre du sang versé et de l’iniquité.
    reason: literary_emphasis
lexical_decisions:
- source_word: እሜሃ
  choice: Alors
  rationale: Marque naturellement en français la succession temporelle et l’ouverture d’une nouvelle scène.
- source_word: ሐወጹ … እምሰማይ
  choice: regardèrent du haut du ciel
  rationale: Rend le regard dirigé depuis le ciel vers la terre sans employer une tournure française pesante.
- source_word: ወርእዩ
  choice: Ils virent
  rationale: Verbe narratif simple et direct, séparé en une nouvelle phrase pour assurer une lecture naturelle.
- source_word: ብዙሐ ደመ
  choice: beaucoup de sang
  rationale: Conserve l’image concrète et saisissante du sang, plutôt que de la remplacer par le nom abstrait « carnage ».
- source_word: ዘይትከዓው
  choice: se répandre
  rationale: Convient au sang répandu sur la terre et maintient l’aspect en cours de la forme verbale; « être versé » reste possible.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Traduction directe de la locution, répétée afin de préserver l’insistance du texte.
- source_word: ኵሎ ዓመፃ
  choice: toute l’iniquité
  rationale: Exprime largement la transgression, l’injustice et le mal moral sans réduire le terme à la seule violence physique.
- source_word: ዘይትገበር
  choice: qui se commettait
  rationale: Le verbe « commettre » s’emploie naturellement avec « iniquité » et traduit la forme relative passive à valeur durative.
theological_decisions:
- issue: Forme française des noms angéliques
  choice: Michel, Ouriel, Raphaël et Gabriel
  alternative: Mikaël, Uriel, Rafael et Gabriel
  rationale: Les formes françaises établies sont naturelles et immédiatement reconnaissables, tout en correspondant clairement aux noms guèzes.
- issue: Image concrète du sang
  choice: beaucoup de sang se répandre
  alternative: un grand carnage; le sang crier
  rationale: Le texte décrit concrètement le sang sur la terre. Cette traduction préserve cette image apocalyptique sans la transformer en résumé abstrait ni retenir comme certaine l’interprétation minoritaire du sang qui crie.
- issue: Portée de ዓመፃ
  choice: iniquité
  alternative: violence; injustice; transgression
  rationale: « Iniquité » conserve la portée morale et transgressive générale du terme, alors que « violence » pourrait le limiter au mal physique déjà évoqué par le sang.
translation_notes:
  register: Français international moderne, clair et digne. La division en deux phrases allège la longue coordination du texte source sans modifier la succession des actions. « Iniquité » relève d’un registre légèrement élevé, adapté au récit apocalyptique, tout en restant compréhensible.
