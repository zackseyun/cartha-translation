base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: fr
  text: Ils allèrent vers les filles des hommes sur la terre et couchèrent avec elles, avec ces femmes. Ils se souillèrent et leur révélèrent tout péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖሩ
  choice: Ils allèrent vers
  rationale: Le verbe exprime d’abord un mouvement d’approche; le rapport sexuel est explicité par la proposition suivante, ce qui évite de surcharger ce premier verbe.
- source_word: አዋልደ ሰብእ
  choice: les filles des hommes
  rationale: Cette expression traditionnelle conserve le contraste narratif entre les êtres célestes et les femmes humaines. En français biblique courant, «des hommes» peut garder ici sa valeur collective.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Rendu spatial direct et naturel, qui maintient le contraste cosmique entre ciel et terre.
- source_word: ወስከቡ ምስሌሆን
  choice: et couchèrent avec elles
  rationale: «Coucher avec» exprime clairement l’union sexuelle dans un registre moderne mais digne.
- source_word: ምስለ እልኩ አንስት
  choice: avec ces femmes
  rationale: La reprise appositionnelle et démonstrative du texte guèze est conservée sans introduire l’idée de mariage que pourrait suggérer «épouses».
- source_word: ወረኵሱ
  choice: Ils se souillèrent
  rationale: Le réfléchi préserve à la fois la portée morale et la résonance d’impureté du verbe.
- source_word: ወአግሀዱ ሎን
  choice: et leur révélèrent
  rationale: Le verbe désigne une manifestation ou une divulgation. «Révélèrent» convient au contexte de savoir interdit sans réduire l’acte à un enseignement formel.
- source_word: ኵሎ ኃጢአተ
  choice: toute sorte de péché
  rationale: Cette tournure française naturelle rend la portée collective et englobante de l’expression sans suggérer qu’un seul péché abstrait aurait été révélé.
theological_decisions:
- issue: Nature de la corruption apportée par les Veilleurs
  choice: Le verset présente à la fois l’union sexuelle illicite et la divulgation de ce qui relève du péché.
  alternative: Limiter la dernière proposition à des pratiques magiques ou techniques précises, ou considérer que la corruption évoquée est exclusivement sexuelle.
  rationale: Le texte guèze mentionne distinctement le fait de coucher avec les femmes, de se souiller et de leur révéler toute sorte de péché. La traduction conserve cette accusation générale sans préciser davantage le contenu du savoir divulgué.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été divisée en deux phrases pour éviter une coordination pesante, tout en conservant l’ordre des actes et la reprise emphatique «avec ces femmes».
