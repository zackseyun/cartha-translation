base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: fr
  text: 'À ce moment-là, moi, Hénoch, je lui répondis : « Je désire tout connaître, mais surtout ce qui concerne cet arbre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሣእክዎ
  choice: je lui répondis
  rationale: Le verbe signifie « répondre » et porte un suffixe objet masculin singulier, rendu par « lui ».
- source_word: እንዘ፡ እብል
  choice: 'je lui répondis :'
  rationale: La construction introduit les paroles d’Hénoch. En français, les deux verbes successifs « répondis en disant » seraient lourds ; les deux-points rendent naturellement l’introduction du discours direct.
- source_word: በእንተ፡ ኵሉ፡ እፈቅድ፡ ኣእምር
  choice: Je désire tout connaître
  rationale: Cette formulation conserve l’étendue générale de ኵሉ et le sens de volonté associé à la connaissance.
- source_word: ወፈድፋደሰ፡ በእንተዝ፡ ዕፅ
  choice: mais surtout ce qui concerne cet arbre
  rationale: Le tour marque une intensification ou une priorité portant sur cet arbre, en contraste avec le désir de tout connaître.
- source_word: ዕፅ
  choice: arbre
  rationale: Dans cette description visionnaire, « arbre » est le sens contextuel naturel.
theological_decisions:
- issue: Nature et portée de la demande de connaissance d’Hénoch
  choice: Je désire tout connaître, mais surtout ce qui concerne cet arbre.
  alternative: Je désire connaître toutes choses, et plus encore cet arbre.
  rationale: Le choix maintient à la fois la demande générale de connaissance et l’intérêt accru pour l’arbre, sans réduire la démarche à une simple curiosité ni préciser indûment la nature de la révélation recherchée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit littéraire. La redondance sémitique « répondit en disant » est allégée sans perte de sens.
