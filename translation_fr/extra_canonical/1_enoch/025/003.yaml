base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: fr
  text: 'Et il me répondit : « Cette haute montagne que tu as vue, dont le sommet ressemble au trône du Seigneur[a], est son trône. C’est là que demeurera le Saint et le Grand, le Seigneur de gloire, le Roi éternel[b], lorsqu’il descendra visiter la terre avec bonté[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont le sommet est comme le trône du Seigneur ». La formulation guèze peut aussi mettre en rapport plus largement la montagne avec l’image du trône.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « le Roi pour toujours ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « inspecter la terre en vue du bien » ou « visiter la terre dans la bonté ». L’expression désigne une visitation divine bienfaisante, et non un simple déplacement vers la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: répondit
  rationale: Verbe narratif courant de réponse, qui conserve le caractère dialogué de la vision.
- source_word: ደብር … ነዋኅ
  choice: haute montagne
  rationale: Rend naturellement l’élévation de la montagne dans ce paysage visionnaire.
- source_word: ዘርእሱ ይመስል መንበረ ለእግዚአ
  choice: dont le sommet ressemble au trône du Seigneur
  rationale: Préserve la comparaison et comprend « tête » au sens topographique de « sommet ».
- source_word: መንበሩ ውእቱ
  choice: est son trône
  rationale: Conserve l’identification explicite ainsi que la répétition intentionnelle du mot « trône ».
- source_word: ኀበ ይነብር
  choice: C’est là que demeurera
  rationale: Le verbe exprime le fait d’habiter ou de demeurer; le futur convient à la proposition temporelle ultérieure sur la descente.
- source_word: ቅዱስ ወዐቢይ
  choice: le Saint et le Grand
  rationale: Traite les adjectifs comme un titre substantivé, distinct mais apposé aux titres divins qui suivent.
- source_word: እግዚአ ስብሐት
  choice: le Seigneur de gloire
  rationale: Préserve le titre divin et sa résonance biblique sans le réduire à la seule idée de majesté.
- source_word: ንጉሥ ዘለዓለም
  choice: le Roi éternel
  rationale: Expression française concise qui conserve à la fois la royauté et la durée sans fin.
- source_word: የኀውጻ ለምድር በሠናይ
  choice: visiter la terre avec bonté
  rationale: Rend la visitation divine comme bienfaisante tout en laissant en note les nuances possibles de la construction.
theological_decisions:
- issue: Identification de la montagne au trône divin
  choice: La montagne est explicitement appelée « son trône », tout en étant présentée comme le lieu où Dieu demeurera lors de sa descente.
  alternative: Comprendre seulement le sommet comme le trône, ou réduire la montagne à un simple lieu d’intronisation.
  rationale: Le guèze répète explicitement « trône » et dit « il est son trône ». La traduction conserve aussi la tension entre cette identification et la demeure future liée à la descente.
- issue: Rapport entre les titres divins
  choice: « le Saint et le Grand » est rendu comme un titre substantivé, en apposition à « le Seigneur de gloire, le Roi éternel ».
  alternative: « le saint et grand Seigneur de gloire »
  rationale: Cette formulation respecte mieux la succession des titres en guèze sans imposer une structure adjectivale unique.
- issue: Nature de la visitation de la terre
  choice: « visiter la terre avec bonté »
  alternative: « inspecter la terre en vue du bien » ou « visiter la terre dans la bonté »
  rationale: Le texte associe la descente à une visitation bénéfique, mais la construction exacte reste assez ouverte pour justifier une note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans archaïsmes; les titres divins portent des majuscules. La répétition de « trône » est maintenue parce qu’elle appartient au texte source.
