base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: fr
  text: 'Et il me dit : « Hénoch, pourquoi poses-tu des questions au sujet du parfum[a] de cet arbre et cherches-tu à savoir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’odeur ». Le terme guèze peut désigner une odeur ou un parfum ; « parfum » convient au ton élevé et au cadre merveilleux de la scène.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቤለኒ
  choice: il me dit
  rationale: Cette formule narrative courante conserve la simplicité et la franchise du discours direct.
- source_word: ሄኖክ
  choice: Hénoch
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: ምንተ ትስእል
  choice: pourquoi poses-tu des questions
  rationale: Bien que ምንተ signifie littéralement « quoi », l’ensemble a ici une valeur idiomatique interrogative portant sur le motif de la demande.
- source_word: በእንተ መዓዛሁ
  choice: au sujet du parfum
  rationale: መዓዛ désigne une odeur ou un parfum ; « parfum » convient au caractère merveilleux et positif de la scène, sans exclure l’alternative plus neutre signalée en note.
- source_word: ለዝ ዕፅ
  choice: de cet arbre
  rationale: Dans ce contexte visionnaire, ዕፅ désigne naturellement l’arbre particulier observé, plutôt que son bois ou une plante indéterminée.
- source_word: ወትጠየቅ
  choice: et cherches-tu
  rationale: Un second verbe distinct est maintenu afin de préserver le parallélisme répétitif du guèze, tout en produisant une phrase française naturelle.
- source_word: ከመ ታእምር
  choice: à savoir
  rationale: Cette tournure exprime succinctement le but de la recherche et conserve l’accent épistémique du texte.
theological_decisions:
- issue: Ton de la réponse adressée à Hénoch
  choice: Une question modérée qui sonde la démarche d’Hénoch
  alternative: Une réprimande sévère contre une curiosité déplacée, ou une simple demande de précision
  rationale: La répétition des verbes liés à l’interrogation et la proposition de but invitent à comprendre que le locuteur met en lumière le désir de savoir d’Hénoch, sans que le texte impose l’idée d’une condamnation.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement convient au dialogue direct ancien. La répétition sémantique des deux verbes d’interrogation est conservée sans alourdir inutilement la phrase.
