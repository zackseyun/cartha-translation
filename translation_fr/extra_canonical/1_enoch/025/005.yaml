translation:
  language: fr
  text: De son fruit, la vie sera donnée aux élus[a], et il sera planté en direction du nord, sur…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux choisis ». Le terme désigne ici le groupe choisi dans le cadre de la vision, sans en préciser davantage l’identité.
    reason: contested_term
  - marker: b
    text: Le texte fourni s’interrompt après une préposition qui signifie « sur » ou « au-dessus de »; son complément n’a pas été conservé dans cet extrait.
    reason: textual_variant
lexical_decisions:
- source_word: ፍሬ
  choice: fruit
  rationale: Conserve l’image concrète du fruit de l’arbre dans cette vision.
- source_word: ይትወሀብ
  choice: sera donnée
  rationale: Rend la forme passive à valeur future et le caractère solennel de la promesse.
- source_word: ኅሩያን
  choice: les élus
  rationale: Désignation apocalyptique concise et naturelle en français; elle préserve l’idée de choix sans préciser davantage l’identité du groupe.
- source_word: ሐይወት
  choice: la vie
  rationale: Rend directement le nom sans développer en « vie éternelle » ce que ce témoin ne dit pas explicitement.
- source_word: መንገለ መስዕ
  choice: en direction du nord
  rationale: Préserve la nuance directionnelle de መንገለ et le sens de መስዕ.
- source_word: ይተከል
  choice: il sera planté
  rationale: Conserve explicitement l’image arboricole et la valeur passive future.
- source_word: ዲበ
  choice: sur…
  rationale: Le mot est une préposition signifiant « sur, au-dessus de »; l’extrait s’interrompt avant son complément, d’où les points de suspension.
theological_decisions:
- issue: Identité de ኅሩያን
  choice: les élus, comme désignation apocalyptique du groupe choisi
  alternative: les choisis; les justes
  rationale: La traduction maintient la catégorie propre au texte sans lui imposer une définition doctrinale ultérieure.
- issue: Nature de la vie promise
  choice: la vie
  alternative: la vie éternelle; la guérison ou la restauration
  rationale: Le contexte peut évoquer une vie eschatologique, mais le témoin guèze dit simplement « vie »; l’ambiguïté est donc conservée.
- issue: Complément manquant après ዲበ
  choice: laisser la proposition ouverte par « sur… »
  alternative: compléter « sur un lieu saint » d’après d’autres témoins ou rendre « au-dessus »
  rationale: Le fragment fourni s’arrête sur une préposition. Il ne faut ni transformer celle-ci en adverbe ni importer silencieusement un complément absent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du guèze tout en étant naturelle; les points de suspension signalent honnêtement la troncation de l’extrait.
