base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: fr
  text: Quant à cet arbre odorant, aucun être de chair[a] n’a le droit d’y toucher jusqu’au grand jugement, lorsqu’il exercera sa vengeance contre tous et mènera tout à son accomplissement pour toujours[b]. Cet arbre sera donné aux justes et aux humbles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucune chair n’a autorité ». Ici, « chair » désigne les humains mortels, non la chair comme substance.'
    reason: lexical_alternative
  - marker: b
    text: La construction de cette proposition est difficile. Les deux verbes ont un sujet singulier non exprimé ; « tous » ou « tout » peut aussi se rattacher différemment aux idées de vengeance et d’accomplissement.
    reason: textual_difficulty
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: arbre odorant
  rationale: L’expression désigne un arbre caractérisé par son parfum. « Arbre odorant » conserve l’image concrète dans un français naturel et digne.
- source_word: ዘሥጋ
  choice: être de chair
  rationale: Le guèze dit littéralement « de chair », expression qui désigne ici les humains mortels. « Être de chair » garde cette anthropologie apocalyptique sans faire de la chair une simple substance.
- source_word: ሥልጣነ … ይግሥሦ
  choice: n’a le droit d’y toucher
  rationale: Le premier terme exprime l’autorité ou le droit, tandis que le verbe indique le contact. Cette formulation française rend l’accès interdit sans préciser indûment qu’il s’agirait de manger du fruit.
- source_word: ኵነኔ
  choice: jugement
  rationale: Dans ce contexte apocalyptique, le terme renvoie au grand jugement eschatologique; « jugement » reste suffisamment large pour ne pas le réduire à la condamnation seule.
- source_word: ይትቤቀል
  choice: il exercera sa vengeance
  rationale: La forme verbale porte l’idée de vengeance ou de rétribution et comporte un sujet singulier implicite. Le pronom « il » en conserve la force grammaticale sans nommer explicitement ce sujet.
- source_word: ኵሎ
  choice: tous
  rationale: Dans le contexte du jugement, « tous » rend naturellement la portée universelle du terme, tout en laissant la note signaler que la construction de la proposition demeure incertaine.
- source_word: ይፌጽም
  choice: mènera tout à son accomplissement
  rationale: Le verbe signifie achever, accomplir ou mener à son terme. Cette traduction préserve l’idée d’achèvement sans préciser davantage ce qui est accompli.
- source_word: ለዓለም
  choice: pour toujours
  rationale: Formulation française courante qui exprime ici la durée perpétuelle.
- source_word: ጻድቃን
  choice: les justes
  rationale: « Les justes » est le terme français traditionnel et actuel pour ce groupe défini par sa droiture dans la littérature apocalyptique.
- source_word: ትሑታን
  choice: les humbles
  rationale: Le mot exprime l’humilité ou l’abaissement. « Les humbles » est clair et évite d’importer une formulation confessionnelle plus marquée.
- source_word: ዝኩ … ይትወሀብ
  choice: Cet arbre sera donné
  rationale: Le démonstratif renvoie à l’arbre, et le verbe est passif. La répétition explicite de « cet arbre » lève en français une ambiguïté grammaticale sans transformer le démonstratif en adverbe temporel.
theological_decisions:
- issue: Sens de « chair » dans l’interdiction d’accès
  choice: L’expression désigne les humains mortels, auxquels il est interdit de toucher l’arbre avant le jugement.
  alternative: La chair en tant que substance, ou toute créature corporelle, n’aurait aucun pouvoir sur l’arbre.
  rationale: Dans ce contexte, « chair » fonctionne comme une désignation de la condition mortelle. La traduction conserve néanmoins le mot-image au lieu de le remplacer simplement par « personne ».
- issue: Sujet de la vengeance et de l’accomplissement
  choice: Conserver un sujet masculin singulier implicite au moyen de « il », sans l’identifier dans le texte principal.
  alternative: Employer une tournure impersonnelle ou passive, ou nommer explicitement Dieu comme sujet.
  rationale: Les formes verbales permettent de reconnaître un sujet singulier non exprimé. Le nommer « Dieu » irait au-delà de la proposition, tandis qu’un passif effacerait sa force active.
- issue: Destination eschatologique de l’arbre
  choice: L’arbre lui-même sera donné aux justes et aux humbles.
  alternative: Comprendre le don comme portant sur son fruit ou sur une bénédiction associée à l’arbre.
  rationale: Le démonstratif masculin renvoie le plus directement à l’arbre mentionné; il ne faut pas ajouter ici le fruit, qui n’est pas nommé dans ce verset.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La syntaxe a été divisée en trois phrases pour rester lisible, tout en maintenant l’imagerie apocalyptique, le sujet implicite de la vengeance et l’incertitude de la proposition centrale.
