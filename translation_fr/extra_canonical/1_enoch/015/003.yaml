base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: fr
  text: Pourquoi avez-vous abandonné le ciel élevé[a], saint et éternel, couché avec des femmes, vous vous êtes souillés avec les filles des hommes, avez pris des épouses pour vous, agi comme les enfants de la terre[b] et engendré des fils géants ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les qualificatifs « élevé, saint et éternel » se rapportent au ciel ; leur accumulation souligne le contraste avec la terre.
    reason: clarification_syntaxique
  - marker: b
    text: L’expression « enfants de la terre » désigne ici les humains mortels, par contraste avec les Veilleurs célestes ; elle ne signifie pas simplement « les gens ».
    reason: cultural_note
lexical_decisions:
- source_word: ኃደግሙ
  choice: abandonné
  rationale: Le verbe exprime un départ volontaire et répréhensible; « abandonné » conserve la force du reproche.
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: le ciel élevé, saint et éternel
  rationale: Cette formulation conserve l'accumulation des qualificatifs appliqués au ciel tout en restant naturelle en français.
- source_word: ሰከብክሙ
  choice: couché avec
  rationale: Expression française directe sans être crue, adaptée au registre solennel de l'accusation.
- source_word: እዋለደ ሰብእ
  choice: les filles des hommes
  rationale: La formulation maintient le contraste entre les femmes humaines et les êtres célestes, sans explicitation doctrinale ajoutée.
- source_word: ረኩስክሙ
  choice: vous êtes-vous souillés
  rationale: « Se souiller » rend explicitement la portée morale et liée à l'impureté du verbe guèze.
- source_word: አንስተ
  choice: des femmes
  rationale: Dans « prendre des femmes pour vous », le contexte évoque des épouses, mais le choix conserve le terme concret et la continuité lexicale avec la première occurrence.
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: agi comme les enfants de la terre
  rationale: Cette expression préserve l'image apocalyptique et le contraste entre les Veilleurs célestes et les humains mortels.
- source_word: ውሉደ ረዓይተ
  choice: des fils géants
  rationale: La traduction conserve l'image concrète d'une descendance masculine gigantesque sans la remplacer par une interprétation abstraite comme « violente ».
theological_decisions:
- issue: Statut moral de l'union des Veilleurs avec les femmes
  choice: Présenter l'acte comme une souillure volontaire
  alternative: Décrire plus neutralement une union ou un mélange avec des femmes
  rationale: Le guèze emploie explicitement un verbe de souillure; il faut donc préserver le jugement moral et la notion d'impureté du texte.
- issue: Nature des enfants engendrés
  choice: « fils géants »
  alternative: « fils qui étaient des géants » ou « descendance violente »
  rationale: Le syntagme permet une formulation concrète liée au gigantisme; « descendance violente » trancherait de façon trop interprétative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue question accusatrice et l'accumulation verbale sont conservées afin de rendre la solennité du reproche. Les marqueurs de notes sont placés sur « élevé » pour éclairer la série adjectivale et sur « enfants de la terre » pour expliquer l'opposition cosmologique.
