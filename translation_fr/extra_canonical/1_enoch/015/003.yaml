  source_fidelity: 'Le sens de la chaîne verbale guèze est bien conservé : abandon du ciel, union avec des femmes, souillure, prise d’épouses, conduite semblable à celle des humains terrestres et génération de fils géants. « Épouses » rend plus exactement l’expression « prendre des femmes pour soi », qui relève ici de l’idiome matrimonial. « Fils géants » est une restitution recevable de l’expression finale, sans imposer une interprétation plus abstraite.'
  naturalness: 'La phrase proposée présente une rupture syntaxique : « avez-vous abandonné..., couché..., vous êtes-vous souillés... ». Une coordination régulière des verbes, avec maintien de l’interrogation accusatrice, rend le français moderne plus naturel et plus lisible.'
  terminology: « Se souiller » préserve adéquatement la charge d’impureté du texte. « Filles des hommes » et « enfants de la terre » maintiennent les contrastes anthropologiques et cosmologiques du passage. « Épouses » est préférable à la seconde occurrence de « femmes », afin de refléter l’idiome de prise d’épouse sans effacer le contraste lexical du texte.
