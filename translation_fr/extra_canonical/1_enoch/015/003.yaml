  to: Pourquoi avez-vous abandonné le ciel élevé[a], saint et éternel, couché avec des femmes, vous vous êtes souillés avec les filles des hommes, avez pris des épouses pour vous, agi comme les enfants de la terre[b] et engendré des fils géants ?
