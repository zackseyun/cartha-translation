revisions:
- from: C’est pourquoi je leur ai donné des femmes, afin qu’ils sèment en elles[a] et que, par elles, des enfants leur naissent, de sorte qu’ainsi aucune œuvre sur la terre ne leur fasse défaut[b].
  to: C’est pourquoi je leur ai donné des femmes, afin qu’ils sèment leur semence en elles[a] et que des enfants naissent d’elles, afin que, de cette manière, aucune œuvre sur la terre ne leur fasse défaut[b].
  rationale: La révision conserve le mouvement du guèze — don des femmes, semence, naissance, puis clause finale de but — tout en corrigeant une ellipse qui est malaisée en français. Elle n’explicite pas davantage le sens disputé de « œuvre » et maintient une note prudente sur la dernière proposition.
