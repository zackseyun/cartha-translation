base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: fr
  text: C’est pourquoi je leur ai donné des femmes, afin qu’ils sèment leur semence en elles[a] et que des enfants naissent d’elles, afin que, de cette manière, aucune œuvre sur la terre ne leur fasse défaut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « qu’ils sèment sur elles ». Le guèze conserve ici une métaphore procréatrice tirée des semailles.
    reason: lexical_alternative
  - marker: b
    text: La proposition finale est difficile. Elle paraît indiquer que la procréation devait empêcher que l’activité sur la terre ne vienne à manquer.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français l’explication causale liée au contraste du contexte précédent.
- source_word: ወሀብክዎሙ አንስቲያ
  choice: je leur ai donné des femmes
  rationale: « Femmes » conserve la portée générale du nom sans préciser indûment « épouses ».
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: afin qu’ils sèment en elles
  rationale: Conserve la métaphore agricole et procréatrice du guèze; « en elles » est naturel dans ce contexte tout en reflétant la préposition littéralement plus proche de « sur elles ».
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: et que, par elles, des enfants leur naissent
  rationale: Rend le rapport maternel/procréateur sans réduire ውሉደ à des fils mâles; la formulation garde aussi la relation « par elles ».
- source_word: ከመ ከማሁ
  choice: de sorte qu’ainsi
  rationale: Préserve le double marquage de conséquence et de manière, malgré une légère lourdeur voulue.
- source_word: ኢይትኀጐ ግብር
  choice: aucune œuvre … ne leur fasse défaut
  rationale: « Œuvre » maintient la largeur sémantique de ግብር (œuvre, acte, activité) et la syntaxe difficile du passage sans l’expliquer dans le corps du texte.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Expression cosmologique claire et usuelle dans ce contexte.
theological_decisions:
- issue: Finalité du don des femmes aux êtres terrestres
  choice: Présenter la procréation comme appartenant à l’ordre établi pour la vie terrestre.
  alternative: Limiter l’énoncé au mariage, ou y voir une concession punitive consécutive à la faute des Veilleurs.
  rationale: Le verset relie explicitement les femmes, la semence, la naissance et la continuité de l’œuvre terrestre; il ne faut ni restreindre le propos au statut matrimonial ni lui ajouter une valeur punitive absente de la formulation locale.
- issue: Sens de la proposition finale
  choice: Conserver l’expression générale et quelque peu obscure « aucune œuvre sur la terre ne leur fasse défaut ».
  alternative: Expliciter qu’il s’agit de la perpétuation de la vie et des activités humaines par la reproduction.
  rationale: Le guèze permet une compréhension large de ግብር; une explicitation dans le texte trancherait une ambiguïté réelle. La note signale le sens contextuel probable.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore des semailles est maintenue dans le texte, tandis que la tournure finale reste volontairement proche et ambiguë; les notes éclairent ces deux difficultés sans imposer une interprétation confessionnelle.
