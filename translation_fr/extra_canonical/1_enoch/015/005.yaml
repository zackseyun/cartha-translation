    issue: La formule « afin qu’ils sèment en elles » est elliptiquement peu naturelle en français.
    rationale: Le verbe « semer » appelle normalement un complément. « Leur semence » explicite seulement l’image procréatrice inhérente au verbe dans ce contexte et permet de préserver la métaphore.
  - severity: low
    issue: La note b parle d’un « ordre établi », notion qui n’est pas formulée dans la proposition finale elle-même.
    rationale: Même si le contexte peut soutenir cette lecture, la note doit signaler la difficulté sans présenter une interprétation contextuelle comme contenu explicite du verset.
