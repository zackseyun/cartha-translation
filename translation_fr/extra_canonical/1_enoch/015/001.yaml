base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: fr
  text: 'Il me répondit et me dit, et j’entendis[a] : « N’aie pas peur, Hénoch, homme juste et scribe de justice. Approche-toi ici et écoute ma parole. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien transmis semble répéter le verbe « entendre » (« et j’entendis, j’entendis »). La traduction condense cette répétition pour rendre la phrase lisible, sans ajouter le mot « voix », qui ne figure pas dans le texte.
    reason: Variante ou difficulté textuelle et lexicale.
lexical_decisions:
- source_word: አውሥአኒ
  choice: Il me répondit
  rationale: Le verbe exprime naturellement une réponse et conserve le cadre dialogué.
- source_word: ወይቤለኒ
  choice: et me dit
  rationale: La formule de parole est maintenue avec le verbe précédent afin de respecter le style répétitif du récit.
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: et j’entendis
  rationale: Le texte transmis semble répéter un verbe d’audition. La traduction française condense cette répétition difficile tout en n’ajoutant ni « voix » ni autre complément absent du guèze.
- source_word: አትፍራህ
  choice: N’aie pas peur
  rationale: Formulation française actuelle, naturelle et digne pour une défense directe.
- source_word: ብእሲ፡ ጻድቅ
  choice: homme juste
  rationale: Rend directement la désignation morale d’Hénoch dans un français courant.
- source_word: ጻሓፊ፡ ጽድቅ
  choice: scribe de justice
  rationale: « Scribe » préserve la fonction d’écrivain dépositaire d’une révélation; « justice » maintient le lien lexical avec l’adjectif « juste ».
- source_word: ቅረብ፡ ዝየ
  choice: Approche-toi ici
  rationale: Conserve à la fois l’idée de proximité et l’adverbe déictique.
- source_word: ወስማዕ፡ ቃልየ
  choice: et écoute ma parole
  rationale: « Écoute » convient naturellement à l’impératif français, tandis que le singulier « parole » respecte celui du texte source.
theological_decisions:
- issue: Double désignation morale et littéraire d’Hénoch
  choice: homme juste et scribe de justice
  alternative: homme droit et écrivain de droiture
  rationale: La traduction conserve conjointement la qualification morale d’Hénoch et sa fonction de scribe, sans réduire l’une à l’autre ni introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « répondit et me dit » est volontairement conservée comme trait narratif ancien; le reste est formulé de manière naturelle sans explicitation absente du source.
