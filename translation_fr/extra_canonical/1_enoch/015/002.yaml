base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: fr
  text: 'Va dire aux Veilleurs du ciel, qui t’ont envoyé présenter une requête en leur faveur : « C’est vous qui devriez présenter des requêtes en faveur des êtres humains[a], et non les êtres humains en votre faveur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne ici l’humanité dans son ensemble, et non uniquement les hommes de sexe masculin.
    reason: cultural_note
lexical_decisions:
- source_word: ሑር
  choice: Va
  rationale: Impératif de mouvement adressé à Hénoch ; « Va » est direct et naturel.
- source_word: በሎሙ
  choice: leur dire
  rationale: Rend le verbe de parole avec son destinataire pluriel et s’intègre naturellement à l’impératif précédent.
- source_word: ለትጉሃነ ሰማይ
  choice: aux Veilleurs du ciel
  rationale: « Veilleurs » conserve le titre technique de ces êtres célestes dans cette section apocalyptique ; la majuscule signale son emploi comme désignation de groupe.
- source_word: እለ ፈነዉከ
  choice: qui t’ont envoyé
  rationale: La relative identifie les Veilleurs comme ceux qui ont chargé Hénoch de cette démarche.
- source_word: ትስአል በእንቲአሆሙ
  choice: présenter une requête en leur faveur
  rationale: Le verbe signifie demander ou solliciter ; dans ce contexte de recours formel, « présenter une requête » exprime la démarche sans imposer un vocabulaire sacerdotal.
- source_word: አንትሙ መፍትው ትስአሉ
  choice: C’est vous qui devriez présenter des requêtes
  rationale: La tournure emphatique conserve à la fois le pronom explicite et l’idée de convenance ou d’obligation, qui porte la réprimande.
- source_word: በእንተ ሰብእ
  choice: en faveur des êtres humains
  rationale: Le nom désigne ici collectivement l’humanité ; « êtres humains » est inclusif, précis et actuel.
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: et non les êtres humains en votre faveur
  rationale: 'La répétition préserve l’inversion frappante du texte : les êtres célestes ne devraient pas solliciter pour eux-mêmes la médiation humaine.'
theological_decisions:
- issue: Désignation des êtres angéliques
  choice: Veilleurs du ciel
  alternative: anges du ciel ; veilleurs célestes
  rationale: Le titre propre à ce récit doit rester visible ; le remplacer par « anges » effacerait une catégorie littéraire et théologique importante.
- issue: Portée de la réprimande relative à la requête
  choice: C’est vous qui devriez présenter des requêtes en faveur des êtres humains, et non les êtres humains en votre faveur
  alternative: Vous devriez intercéder pour les humains, et non les humains pour vous
  rationale: Cette formulation conserve le renversement de l’ordre attendu sans élaborer une doctrine générale de l’intercession ni importer le terme théologiquement plus chargé « intercéder ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe emphatique « C’est vous qui » fait ressortir la réprimande. « Présenter une requête » maintient le cadre formel tout en conservant la portée générale du verbe guèze de demande.
