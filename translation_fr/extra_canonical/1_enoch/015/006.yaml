base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: fr
  text: Mais vous, autrefois, étiez des êtres spirituels[a], vivant une vie éternelle qui ne meurt pas au cours de toutes les générations du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esprits » ; littéralement, le terme peut aussi se comprendre comme « des spirituels ».
    reason: lexical_alternative
  - marker: b
    text: 'Le mot traduit par « monde » peut aussi signifier « âge » ou « éternité » ; on pourrait donc comprendre : « pour toutes les générations, à jamais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳሚ
  choice: autrefois
  rationale: Exprime le contraste temporel entre l’état premier des Veilleurs et leur corruption ultérieure, sans préciser indûment une séquence cosmologique.
- source_word: ኮንክሙ
  choice: vous étiez
  rationale: Le sens copulatif convient à la description de leur état antérieur; la reprise de « vous » est naturelle en français après la dislocation contrastive « Mais vous, autrefois ».
- source_word: መንፈሳውያነ
  choice: des êtres spirituels
  rationale: Rend la désignation de ceux qui sont caractérisés par l’esprit tout en évitant de la réduire à un terme technique plus précis que le guèze.
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: vivant une vie éternelle
  rationale: Préserve la construction apparentée « vivant une vie » et le substantif explicite « vie », malgré son caractère légèrement marqué en français.
- source_word: ዘኢይመውት
  choice: qui ne meurt pas
  rationale: Conserve la relative et le verbe concret « mourir », au lieu d’aplanir l’expression en « immortelle ».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: à travers toutes les générations du monde
  rationale: Rend la durée couvrant la totalité des générations et conserve le sens « monde » de ዓለም, tout en signalant en note l’autre valeur possible, « âge/éternité ».
theological_decisions:
- issue: Faut-il désigner l’état originel des Veilleurs par « esprits » ou par une expression descriptive plus large ?
  choice: des êtres spirituels
  alternative: des esprits
  rationale: L’expression descriptive maintient le contraste ontologique du passage sans imposer une précision doctrinale postérieure au libellé guèze.
- issue: Comment comprendre ዓለም dans la formule finale ?
  choice: le monde
  alternative: l’éternité / l’âge
  rationale: « Monde » préserve un sens lexical direct et l’image des générations du monde; la note maintient l’ambiguïté sémantique susceptible de donner le sens « pour toutes les générations, à jamais ».
translation_notes:
  register: Français international moderne, digne et lisible. La répétition « vous… vous étiez » marque naturellement le contraste. La tournure volontairement soutenue « vivant une vie éternelle qui ne meurt pas » conserve la construction et l’intensification du texte source plutôt que de les réduire à « étant immortels ».
