  source_fidelity: 'Le texte français rend avec fidélité la séquence géézienne : état initial saint et spirituel, vie éternelle, souillure liée aux femmes, génération par le « sang de la chair », désir du sang des humains, puis production d’êtres de chair et de sang soumis à la mort. Il conserve la répétition structurante de « sang » dans les deux occurrences assurées. Pour le premier membre, où l’édition signale une leçon altérée, il ne transforme pas une correction conjecturale en texte certain ; la note expose explicitement la possibilité de « sang des femmes ».'
