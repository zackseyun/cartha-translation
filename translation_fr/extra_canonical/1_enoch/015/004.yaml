  terminology: « Saints », « êtres spirituels », « souillés », « chair et sang » et « périssent » maintiennent un registre cohérent et ne surinterprètent pas le passage. « Humains » rend convenablement le collectif ሰብእ. L’explicitation « des êtres » est justifiée par la relative plurielle finale et ne définit pas doctrinalement leur statut.
