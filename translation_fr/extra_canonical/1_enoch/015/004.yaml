base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: fr
  text: Mais vous, vous étiez saints, êtres spirituels, vivant d’une vie éternelle. Pourtant, vous vous êtes souillés avec des femmes[a] ; par le sang de la chair, vous avez engendré des enfants ; vous avez désiré le sang des humains, et vous avez produit, comme eux, des êtres de chair et de sang, qui meurent et périssent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze est altéré à cet endroit. Une correction proposée permettrait de traduire : « vous vous êtes souillés avec le sang des femmes ».'
    reason: textual_variant
  - marker: b
    text: Le dernier verbe peut aussi se traduire par « sont détruits » ; dans tous les cas, la formule souligne la mortalité et la ruine des êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን፡ መንፈሳውያን
  choice: saints, êtres spirituels
  rationale: « Saints » conserve le prédicat qui décrit leur état premier, tandis que « êtres spirituels » indique naturellement en français qu’il s’agit de personnes et non d’une qualité abstraite.
- source_word: ሕያዋነ፡ ሕይወት፡ ዘለዓለም
  choice: vivant d’une vie éternelle
  rationale: Cette formulation garde la répétition rhétorique de « vivre/vie » et prépare le contraste avec les êtres humains qui meurent.
- source_word: †በደቡ፡† አንስት፡ ረኩስክሙ
  choice: vous vous êtes souillés avec des femmes[a]
  rationale: Le verbe exprime la souillure. Le mot qui précède « femmes » est signalé comme corrompu dans l’édition ; le texte principal retient la lecture contextuellement claire sans imposer la conjecture « sang ».
- source_word: በደመ፡ ሥጋ፡ አውለድክሙ
  choice: par le sang de la chair, vous avez engendré des enfants
  rationale: La formulation maintient l’image inhabituelle du sang et de la chair. « Des enfants » explicite en français l’objet naturellement sous-entendu par le verbe « engendrer ».
- source_word: በደመ፡ ሰብእ፡ ፈተውክሙ
  choice: vous avez désiré le sang des humains
  rationale: « Désiré » conserve la force du verbe sans préciser indûment la nature du désir ; « humains » rend le terme collectif sans restriction masculine inutile.
- source_word: ወገበርክሙ፡ ከመ፡ እሙንቱ፡ ይገብሩ፡ ሥጋ፡ ወደመ
  choice: vous avez produit, comme eux, des êtres de chair et de sang
  rationale: Cette construction rattache bien « chair et sang » au verbe répété « faire/produire », conformément à la syntaxe, tout en donnant une phrase française intelligible. « Des êtres » est une explicitation minimale de ce qui est produit.
- source_word: እለ፡ እሙንቱ፡ ይመውቱ፡ ወይትሐጐሉ
  choice: qui meurent et périssent
  rationale: La clausule définit ces êtres par leur mortalité. « Périssent » conserve la tonalité solennelle et la possible idée de ruine.
theological_decisions:
- issue: Contraste entre l’existence spirituelle des Veilleurs et la condition corporelle et mortelle des humains
  choice: Conserver explicitement « êtres spirituels », « vie éternelle », puis les images répétées du sang et de la chair.
  alternative: Résumer le contraste par les termes interprétatifs « immortels » et « mortels ».
  rationale: Le passage fonde son accusation sur le franchissement d’une limite entre deux modes d’existence. Les images concrètes du texte doivent donc rester visibles sans être remplacées par une systématisation doctrinale.
- issue: Interprétation de la production de « chair et sang »
  choice: La présenter comme la production d’êtres corporels et mortels, sans définir davantage leur identité ou leur statut.
  alternative: Identifier explicitement ces êtres aux géants ou développer une doctrine précise de leur nature.
  rationale: Le verset évoque ici leur génération et leur mortalité, mais ne les nomme pas ; une identification plus précise importerait du contexte ou une interprétation dans la traduction.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « vous » et le vocabulaire concret de la chair et du sang conservent le rythme accusateur du passage. Les tournures légèrement marquées « vivant d’une vie éternelle » et « sang de la chair » sont maintenues parce qu’elles reflètent la rhétorique de la source.
