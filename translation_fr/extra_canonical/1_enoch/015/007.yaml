base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: fr
  text: Et c’est pourquoi je ne vous ai pas assigné d’épouses, car la demeure des êtres spirituels du ciel[a] est au ciel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les esprits du ciel » ou « les êtres spirituels célestes ». L’expression guèze peut se comprendre de plusieurs manières très proches.
    reason: lexical_alternative
  - marker: b
    text: 'La répétition du mot « ciel » est intentionnelle : ces êtres appartiennent au ciel, et c’est là que se trouve leur demeure.'
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: Et c’est pourquoi
  rationale: Rend naturellement la valeur causale de l’expression en français, tout en reliant le verset à l’explication précédente.
- source_word: ኢረሰይኩ
  choice: je ne vous ai pas destiné
  rationale: Le verbe exprime ici l’idée d’attribuer ou d’assigner, plutôt que celle de fabriquer; « destiner » convient à l’attribution d’épouses sans alourdir la phrase.
- source_word: ለክሙ
  choice: vous
  rationale: Le pronom complément avec « destiner » restitue naturellement le datif guèze.
- source_word: አንስቲያ
  choice: d’épouses
  rationale: Dans ce contexte d’unions assignées, « épouses » est plus précis que « femmes », tout en reconnaissant que ce dernier sens lexical reste possible.
- source_word: እስመ
  choice: car
  rationale: Introduit clairement et dignement le motif explicatif.
- source_word: መንፈሳውያነ ሰማይ
  choice: les êtres spirituels du ciel
  rationale: Préserve la forme substantivée et la relation au ciel sans réduire d’office l’expression à « esprits » ni lui imposer une terminologie angélologique ultérieure.
- source_word: ውስተ ሰማይ
  choice: au ciel
  rationale: Locatif français naturel qui conserve la répétition intentionnelle du mot « ciel ».
- source_word: መሓድሪሆሙ
  choice: la demeure ... est
  rationale: « Demeure » restitue le lieu d’habitation dans un registre actuel et digne.
theological_decisions:
- issue: Interprétation de መንፈሳውያነ ሰማይ
  choice: les êtres spirituels du ciel
  alternative: les esprits du ciel / les êtres spirituels célestes
  rationale: La formulation choisie conserve le caractère substantivé de l’expression ainsi que son ambiguïté relative, sans la rabattre sur une catégorie doctrinale plus précise que le texte.
- issue: Portée de አንስቲያ
  choice: épouses
  alternative: femmes
  rationale: Le passage traite de partenaires conjugales qui n’ont pas été assignées à ces êtres; « épouses » rend mieux ce sens contextuel sans nier le sens plus large possible du terme.
translation_notes:
  register: Français international moderne, clair et digne. La construction conserve le lien causal, la répétition de « ciel » et l’ambiguïté de la désignation des êtres spirituels.
