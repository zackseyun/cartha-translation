base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: fr
  text: Et maintenant, les géants[a], qui sont nés des esprits et de la chair, seront appelés esprits mauvais sur la terre, et c’est dans la terre que sera leur demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme désigne ici, d’après le contexte, la descendance géante des Veilleurs et des femmes ; au niveau lexical, une traduction plus générale comme « descendants » reste possible.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte guèze répète « terre », mais avec deux prépositions différentes : les esprits mauvais sont appelés « sur la terre », tandis que leur demeure est dite être « dans la terre ».'
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: les géants
  rationale: Dans le contexte immédiat, le terme désigne la descendance hybride des Veilleurs et des femmes. « Les géants » garde la force apocalyptique du passage, tout en signalant en note que le lexème peut être compris plus généralement.
- source_word: ተወልዱ
  choice: sont nés
  rationale: Cette expression passive de naissance est rendue directement et naturellement en français.
- source_word: እመናፍስት ወሥጋ
  choice: des esprits et de la chair
  rationale: La traduction conserve la juxtaposition frappante entre les esprits et la chair, sans préciser davantage la nature de cette origine mixte.
- source_word: መንፈሳት እኩያን
  choice: esprits mauvais
  rationale: « Mauvais » traduit directement l'idée de mal ou de méchanceté sans introduire la catégorie distincte d'« esprits impurs ».
- source_word: ይሰመዩ
  choice: seront appelés
  rationale: La formule passive de dénomination est conservée, conformément au caractère classificatoire de l'énoncé.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Cette expression indique le lieu ou le domaine où ces êtres seront appelés esprits mauvais.
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: et sur la terre sera leur demeure
  rationale: L'ordre légèrement solennel et la répétition de « terre » sont maintenus afin de préserver l'accent du guèze sur leur appartenance au domaine terrestre.
theological_decisions:
- issue: Identité des êtres appelés « esprits mauvais »
  choice: Le texte vise les géants, issus des esprits et de la chair, qui seront désignés comme esprits mauvais sur la terre.
  alternative: Le terme initial pourrait être rendu plus généralement par « descendants » ou « êtres engendrés ».
  rationale: Le contexte de 1 Hénoch 15 identifie ces êtres à la descendance des Veilleurs et des femmes. La traduction explicite ce référent contextuel sans développer une démonologie étrangère au verset.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe finale légèrement marquée conserve la solennité et l'insistance du texte source; aucune terminologie confessionnelle particulière n'est ajoutée.
