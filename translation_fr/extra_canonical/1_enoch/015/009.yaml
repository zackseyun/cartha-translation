base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: fr
  text: Et des esprits mauvais sortirent de leur chair[a], car ils furent créés d’en haut ; et leur commencement et leur fondement premier venaient des saints Veilleurs[b]. Ils seront des esprits mauvais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sortirent de leur corps ». Le guèze dit littéralement « de leur chair », ce qui maintient l’image corporelle.'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut se traduire plus littéralement par « les saints, les veilleurs ». Dans ce contexte, elle désigne les Veilleurs angéliques.
    reason: lexical_alternative
  - marker: c
    text: 'La formule finale est abrupte. Elle peut être comprise comme une désignation : « Ils seront appelés “esprits mauvais” », plutôt que comme une simple description.'
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሳት፡ እኩያን
  choice: des esprits mauvais
  rationale: Le nom absolu suivi de l’adjectif signifie « esprits mauvais » ou « âmes mauvaises », et non « âmes des méchants ». « Esprits » convient au contexte des êtres désincarnés et anticipe la désignation finale.
- source_word: ወጽኡ፡ እምሥጋሆሙ
  choice: sortirent de leur chair
  rationale: Traduction directe qui conserve l’image corporelle explicite de la « chair », sans la généraliser en « corps ».
- source_word: እመልዕልት፡ ተፈጥሩ
  choice: ils avaient été créés d’en haut
  rationale: Le plus-que-parfait rend naturellement en français l’antériorité de leur création par rapport à leur sortie de la chair. « D’en haut » maintient l’image cosmologique sans préciser excessivement leur statut.
- source_word: እምቅዱሳን፡ ትጉሃን
  choice: des saints Veilleurs
  rationale: Dans le contexte hénochien, l’expression désigne les Veilleurs angéliques. La majuscule signale ce titre technique tout en conservant « saints ».
- source_word: ቀዳሚቶሙ፡ ወቀዳሚ፡ መሰረት
  choice: leur commencement et leur fondement premier
  rationale: Cette formulation préserve la répétition insistante du vocabulaire de l’origine et le registre apocalyptique du texte.
- source_word: መንፈሰ፡ እኩየ
  choice: « esprits mauvais »
  rationale: La forme transmise peut paraître singulière ou collective, mais le référent pluriel appelle le pluriel français. Dans la syntaxe difficile du témoin, la formule finale est comprise comme une désignation.
theological_decisions:
- issue: Identité des êtres qui sortent de la chair
  choice: Les esprits mauvais issus des descendants des Veilleurs et des femmes
  alternative: Les âmes de méchants humains en général
  rationale: La grammaire de ነፍሳት እኩያን favorise un nom qualifié, « esprits/âmes mauvais », plutôt qu’un construit signifiant « âmes des méchants » ; le contexte immédiat concerne les géants issus des Veilleurs.
- issue: Portée de « d’en haut »
  choice: Une composante céleste de leur origine
  alternative: Une affirmation de leur pleine nature angélique ou de leur valeur morale
  rationale: La traduction conserve l’origine cosmologique mixte présentée par le passage sans transformer ces êtres en anges à part entière ni donner à leur origine céleste une valeur approbatrice.
- issue: Fonction de la formule finale
  choice: 'Une formule de désignation : « Ils seront appelés “esprits mauvais” »'
  alternative: 'Une simple proposition descriptive : « Ils seront des esprits mauvais »'
  rationale: La syntaxe transmise est abrupte et peut être comprise comme une désignation. La note conserve explicitement l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et lisible. La traduction demeure proche de l’ordre et des images du guèze, tout en rendant la relation temporelle naturellement. Le vocabulaire technique hénochien « Veilleurs » est conservé ; les ambiguïtés réelles de la formule finale sont signalées en note.
