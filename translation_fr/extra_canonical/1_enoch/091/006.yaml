base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: fr
  text: Et l’iniquité reviendra de nouveau[a] et atteindra son comble sur la terre[b] ; toutes les œuvres d’iniquité, de violence et de péché retrouveront leur emprise[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se répétera » ou « reviendra ». Le texte insiste sur le retour de l’iniquité, plutôt que d’affirmer explicitement qu’elle augmentera.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « sera achevée » ou « sera menée à son terme » : l’iniquité parvient ici à sa pleine mesure.'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression évoque littéralement le fait de saisir ou de tenir de nouveau : les œuvres mauvaises retrouvent leur emprise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: se reproduira encore
  rationale: Le verbe exprime la répétition ou le retour, et ካዕበ renforce explicitement l’idée de récurrence. Cette formulation conserve cette insistance sans introduire l’idée moins directement attestée d’une simple augmentation.
- source_word: ዓመፃ
  choice: révolte
  rationale: Le terme peut désigner la rébellion, la perversité ou le mépris de l’ordre. « Révolte » le distingue de ግፍዕ (« violence ») et de አበሳ (« péché »), tout en convenant au contexte apocalyptique.
- source_word: ትትፈጸም
  choice: atteindra son comble
  rationale: La forme passive renvoie à ce qui est achevé, accompli ou mené à son terme. En français, cette expression restitue naturellement le sens inquiétant d’un mal qui parvient à sa pleine mesure.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Cette traduction naturelle garde la portée générale, voire cosmique, de l’expression.
- source_word: ኵሉ ግብረ
  choice: toute œuvre de
  rationale: La formulation conserve le caractère distributif de ኵሉ et la référence aux manifestations concrètes du mal.
- source_word: ግፍዕ
  choice: violence
  rationale: Le mot peut également évoquer l’oppression et l’injustice. « Violence » maintient sa force et le distingue des deux autres termes de l’énumération.
- source_word: አበሳ
  choice: péché
  rationale: « Péché » est ici l’équivalent moral et religieux le plus clair, sans exclure les nuances de faute ou de culpabilité.
- source_word: ትትአኀዝ … ካዕበተ
  choice: reprendra le dessus
  rationale: Le verbe porte l’image de saisir, tenir ou prendre possession, tandis que l’adverbe final indique un retour. Cette expression française traduit idiomatiquement la domination renouvelée des œuvres mauvaises.
theological_decisions:
- issue: Rapport entre les trois termes désignant le mal
  choice: 'Conserver une triade distincte : « révolte, violence et péché »'
  alternative: « perversité, oppression et faute »
  rationale: Le guèze coordonne trois termes différents. Les maintenir distincts préserve l’accumulation rhétorique et évite de réduire toutes leurs nuances à une notion générale de méchanceté.
- issue: Sens de l’achèvement de la révolte
  choice: Comprendre qu’elle atteint son comble
  alternative: « sera accomplie » ou « sera menée à son terme »
  rationale: Le texte dit que le phénomène est achevé sur la terre, sans préciser qui l’achève ni formuler une doctrine particulière sur son agent. La traduction conserve donc cette tension et ce caractère impersonnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique et la structure cumulative du guèze sont conservés. Le point-virgule rend les deux mouvements de la phrase sans alourdir la coordination.
