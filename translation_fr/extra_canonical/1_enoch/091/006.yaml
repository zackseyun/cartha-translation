revisions:
- from: Et la révolte se reproduira encore[a] et atteindra son comble sur la terre[b] ; toute œuvre de révolte, de violence et de péché reprendra le dessus[c].
  to: Et l’iniquité reviendra de nouveau[a] et atteindra son comble sur la terre[b] ; toutes les œuvres d’iniquité, de violence et de péché retrouveront leur emprise[c].
  rationale: La révision emploie « iniquité » pour un terme source plus large que la seule révolte et conserve ainsi la distinction avec « violence » et « péché ». Elle rend l’insistance de l’ouverture dans un français plus idiomatique et restaure, dans la dernière proposition, l’image d’une emprise renouvelée. Le pluriel de « toutes les œuvres » rend naturellement en français la portée collective et distributive de « chaque/toute œuvre », sans modifier le sens.
