  - severity: low
    issue: « Se reproduira encore »
    rationale: La formule est compréhensible, mais elle est légèrement redondante en français. « Reviendra de nouveau » préserve l’insistance itérative du verbe et de l’adverbe source avec une diction plus naturelle.
  - severity: medium
    issue: « Reprendra le dessus » pour ትትአኀዝ
    rationale: L’expression française signifie surtout redevenir supérieur ou dominant. Le verbe guèze conserve l’image d’une prise ou d’une emprise renouvelée; « retrouveront leur emprise » la restitue plus fidèlement.
