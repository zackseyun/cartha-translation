base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: fr
  text: Et maintenant, mon fils Mathusalem, appelle auprès de moi tous tes frères et rassemble auprès de moi tous les enfants de ta mère ; car une parole m’appelle, et un esprit est répandu sur moi[a], afin que je vous montre tout ce qui vous arrivera jusqu’à l’éternité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « l’Esprit est répandu sur moi », si « esprit » désigne ici, de manière plus personnelle, l’Esprit divin.'
    reason: ambiguïté théologique et de capitalisation
  - marker: b
    text: L’expression finale peut aussi se rendre par « pour toujours », « jusque dans l’éternité » ou « pour les âges à venir ».
    reason: alternative lexicale
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Transition discursive directe et naturelle, qui conserve l’immédiateté du guèze.
- source_word: ወልድየ ማቱሳላ
  choice: mon fils Mathusalem
  rationale: « Mon fils » garde l’adresse familiale et patriarcale ; « Mathusalem » est la forme française traditionnelle du nom.
- source_word: ጸውዕ ሊተ
  choice: appelle auprès de moi
  rationale: L’impératif demande à Mathusalem de faire venir les personnes auprès d’Hénoch. Cette tournure reste proche du texte sans être artificielle.
- source_word: ኵሎ አኃዊከ
  choice: tous tes frères
  rationale: Le terme désigne concrètement les frères et ne doit pas être généralisé en « parents » ou « proches ».
- source_word: አስተጋብእ ሊተ
  choice: rassemble auprès de moi
  rationale: Le verbe exprime le rassemblement dans la présence du locuteur, avec plus de force que le simple appel.
- source_word: ኵሎ ደቂቀ እምከ
  choice: tous les enfants de ta mère
  rationale: ደቂቅ désigne ici les enfants ou la descendance. « Enfants » évite de restreindre sans nécessité le groupe aux seuls fils.
- source_word: እስመ ቃል ይጼውዐኒ
  choice: car une parole m’appelle
  rationale: Le nom est laissé indéfini comme dans le texte. « Parole » conserve l’ambiguïté entre parole prononcée, message et appel révélateur.
- source_word: መንፈስ ትክዕወት ላዕሌየ
  choice: un esprit est répandu sur moi
  rationale: ትክዕወት est compris comme une forme verbale féminine signifiant « a été répandue », accordée avec መንፈስ. La traduction ne lui attribue donc pas à tort le sens nominal de « droiture ».
- source_word: ከመ አርእክሙ
  choice: afin que je vous montre
  rationale: La tournure exprime le but ; « montrer » reste simple tout en gardant, dans le contexte, sa portée révélatrice.
- source_word: ኵሎ ዘይበጽሐክሙ
  choice: tout ce qui vous arrivera
  rationale: Le verbe évoque ce qui atteint ou survient à quelqu’un. « Arrivera » est naturel en français et conserve le sens prophétique.
- source_word: እስከ ለዓለም
  choice: jusque dans l’éternité
  rationale: Cette formulation maintient l’ampleur et l’indétermination de l’expression temporelle sans la réduire à une génération particulière.
theological_decisions:
- issue: Faut-il identifier መንፈስ comme l’Esprit divin personnel ?
  choice: un esprit est répandu sur moi
  alternative: l’Esprit est répandu sur moi
  rationale: Le guèze n’impose ni la majuscule ni une identification explicite avec l’Esprit divin. Le texte principal conserve donc l’indétermination, tandis que la note signale la lecture plus personnifiée.
- issue: ትክዕወት exprime-t-il la droiture ou l’action de répandre ?
  choice: est répandu
  alternative: un esprit de droiture est sur moi
  rationale: L’analyse morphologique la plus solide y reconnaît une forme verbale de « répandre », et non un nom signifiant « droiture ». La lecture alternative est donc mentionnée comme ancienne possibilité de traduction, mais n’est pas retenue.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le ton solennel d’un discours patriarcal et prophétique sans archaïsmes inutiles. Les répétitions de « auprès de moi » reflètent le parallélisme du texte source.
