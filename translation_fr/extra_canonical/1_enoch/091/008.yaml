base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/008.yaml
  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: fr
  text: En ces jours-là, la violence sera retranchée jusque dans ses racines[a], et l’iniquité, avec la tromperie, sera retranchée de dessous le ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera coupée à la racine ». Le verbe peut aussi signifier « sera supprimée » ou « prendra fin ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme rendu par « tromperie » est incertain dans ce témoin ; on peut aussi comprendre « perfidie », « ruse » ou, selon le découpage du texte, une autre forme de transgression.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: L’ensemble forme l’expression temporelle naturelle « en ces jours-là »; il ne faut pas rattacher « jours » au verbe suivant.
- source_word: ትትገዘም
  choice: sera retranchée
  rationale: Le verbe exprime l’action de couper, retrancher ou supprimer; le passif futur conserve la force du jugement annoncé.
- source_word: ግፍዕ
  choice: la violence
  rationale: Le terme désigne ici la violence ou l’oppression; « violence » convient au contexte de l’éradication du mal.
- source_word: እምነ፡ ሥረዊሃ
  choice: jusqu’à ses racines
  rationale: Cette tournure préserve l’image d’une suppression radicale, atteignant les racines mêmes de la violence.
- source_word: ወዓመፃ
  choice: et l’iniquité
  rationale: Le nom désigne l’iniquité, la révolte ou la transgression et doit rester distinct de ግፍዕ, « violence ».
- source_word: ምስለ፡ ጕሕሉት
  choice: avec la tromperie
  rationale: ምስለ marque l’accompagnement; le dernier nom paraît relever du champ de la tromperie ou de la perfidie, mais sa lecture demeure incertaine.
- source_word: እምታሕተ፡ ሰማይ
  choice: de dessous le ciel
  rationale: L’expression cosmique désigne ce qui se trouve sous le ciel et conserve la portée universelle de l’annonce.
theological_decisions:
- issue: Portée de la disparition du mal
  choice: La formulation conserve une élimination du mal à l’échelle du monde sous le ciel.
  alternative: Une simple réforme locale ou sociale.
  rationale: « De dessous le ciel » et l’image des racines donnent à l’annonce une portée cosmique et radicale sans préciser davantage son mécanisme.
- issue: Verbe sous-entendu dans le second membre
  choice: Employer « disparaîtra » pour rendre en français l’ellipse après « et l’iniquité ».
  alternative: Répéter « sera retranchée » ou laisser une phrase nominale elliptique.
  rationale: Le guèze ne fournit pas un second verbe explicite. Le français exige ici un relais verbal naturel; « disparaîtra » est typographiquement distinct et évite de prétendre qu’un second verbe figure dans la source.
translation_notes:
  register: 'Français international moderne, clair et digne, avec maintien de l’imagerie apocalyptique. La syntaxe suit l’analyse corrigée: l’expression initiale signifie « En ces jours-là », et « violence » est le sujet de « sera retranchée ». Le second membre conserve « iniquité » comme terme distinct et signale l’ellipse verbale sans ajouter silencieusement un verbe à la source.'
