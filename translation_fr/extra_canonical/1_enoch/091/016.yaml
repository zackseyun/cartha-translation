base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: fr
  text: Et le premier ciel s’en ira et passera, et un ciel nouveau apparaîtra, et toutes les puissances des cieux[a] brilleront d’une lumière septuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’armée des cieux ». Le terme guèze peut désigner des puissances, des forces ou des armées, et peut englober aussi bien les astres que les êtres célestes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « septuple ». L’expression peut aussi se comprendre comme « sept fois plus [intensément] » ; le texte ne précise pas explicitement le terme de comparaison.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: le premier ciel
  rationale: ቀዳማይ désigne ce qui est premier ou antérieur dans une succession. « Le premier ciel » maintient le contraste concret avec « un ciel nouveau » sans décider s’il s’agit d’un remplacement absolu ou d’une transformation.
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: s’en ira et passera
  rationale: Les deux verbes expriment respectivement le fait de sortir ou de s’en aller, puis celui de passer. Leur coordination est conservée afin de rendre l’insistance du texte sans introduire l’idée plus forte d’anéantissement.
- source_word: ሰማይ፡ ሐዲስ፡
  choice: un ciel nouveau
  rationale: ሐዲስ signifie « nouveau, neuf ». L’indéfini français convient à l’apparition d’un ciel nouveau et évite de traduire par « renouvelé », qui résoudrait indûment la question de la continuité cosmique.
- source_word: ይትረአይ፡
  choice: apparaîtra
  rationale: La forme signifie « sera vu, deviendra visible, apparaîtra ». « Apparaîtra » est naturel en français et conserve la tonalité visionnaire.
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: toutes les puissances des cieux
  rationale: ኃይል peut désigner la puissance, la force ou une armée. « Puissances des cieux » préserve l’ambiguïté entre forces, astres et êtres célestes.
- source_word: ያበርህ፡
  choice: brilleront
  rationale: Le verbe exprime l’action de briller ou de donner de la lumière. « Brilleront » rend directement l’image cosmique.
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: sept fois plus, pour toujours
  rationale: ሰብዓተ indique clairement sept ou une intensification septuple. La forme suivante est difficile dans le témoin transmis; la formulation française conserve à la fois l’intensification et la durée retenues par la tradition éditoriale, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Remplacement ou renouvellement du cosmos
  choice: 'Conserver la succession visionnaire: le premier ciel s’en va et un ciel nouveau apparaît.'
  alternative: Préciser soit la destruction et le remplacement absolus du cosmos, soit le renouvellement du même cosmos.
  rationale: Le guèze oppose le premier ciel au ciel nouveau, mais ne formule pas une cosmologie systématique. La traduction ne tranche donc pas entre remplacement et transformation.
- issue: Identité des « puissances des cieux »
  choice: Employer une expression pouvant viser des forces, des astres ou des êtres célestes.
  alternative: Traduire exclusivement par « armée céleste », « anges » ou « astres ».
  rationale: Le terme ኃይል possède une étendue sémantique que le contexte apocalyptique ne permet pas de réduire avec certitude.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique et le parallélisme sont maintenus. « S’en ira et passera » garde les deux verbes du guèze; « puissances des cieux » préserve l’ambiguïté apocalyptique.
