- from: Et le premier ciel s’en ira et passera, et un ciel nouveau apparaîtra, et toutes les puissances des cieux[a] brilleront sept fois plus, pour toujours[b].
  to: Et le premier ciel s’en ira et passera, et un ciel nouveau apparaîtra, et toutes les puissances des cieux[a] brilleront d’une lumière septuple[b].
  rationale: La révision retire l’ajout non attesté « pour toujours » et rend l’expression finale par une tournure française naturelle qui conserve l’intensification septuple sans en préciser arbitrairement la mesure. Les images cosmiques, l’ambiguïté des « puissances des cieux » et l’absence de décision doctrinale sur le rapport entre l’ancien et le nouveau ciel sont préservées.
