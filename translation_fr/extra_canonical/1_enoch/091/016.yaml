  source_fidelity: 'La formule finale guèze exprime l’intensification septuple de l’éclat (« septuple », ou « sept fois plus »). Rien dans les mots fournis ne justifie l’ajout de « pour toujours ». Le reste rend fidèlement la succession : départ et passage du premier ciel, apparition d’un ciel nouveau, puis éclat des puissances célestes.'
  naturalness: « S’en ira et passera » est compréhensible et conserve le double mouvement verbal. Pour la clausule, « brilleront d’une lumière septuple » est plus idiomatique et plus précis que « brilleront sept fois plus, pour toujours », dont le comparatif est elliptique et dont l’ajout final n’est pas fondé.
  terminology: « Les puissances des cieux » préserve bien l’ambiguïté de ኃይለ entre forces, armée/hostie céleste, astres et êtres célestes. « Ciel nouveau » évite à juste titre d’imposer l’idée de renouvellement.
