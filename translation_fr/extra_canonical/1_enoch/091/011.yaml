base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: fr
  text: Et de là seront retranchées les racines de l’oppression[a], et les pécheurs seront livrés à l’épée. Ils seront retranchés d’entre les blasphémateurs en tout lieu[b], et ceux qui projettent la violence et ceux qui commettent le blasphème seront livrés au massacre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot rendu par « racines » peut être confondu, selon la vocalisation ou l’analyse, avec une forme liée au nombre dix; d’où une ancienne traduction possible : « dix semaines d’oppression ».'
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe guèze de cette proposition est difficile, et le référent de « ils » n’est pas explicite. Autre ponctuation possible : « Parmi les blasphémateurs seront retranchés, en tout lieu, ceux qui projettent la violence et ceux qui commettent le blasphème; ils seront voués au massacre. »'
    reason: textual_variant
  - marker: c
    text: Littéralement, le dernier terme peut évoquer une lame, l’abattage ou le massacre; « seront livrés au massacre » évite de l’identifier sans nécessité à l’épée mentionnée dans la proposition précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሥራወ ዓመፃ
  choice: les racines de l’oppression
  rationale: Dans cette forme et ce contexte, አሥራወ est compris comme le pluriel construit « racines de », plutôt que comme « dix ». « Oppression » conserve à la fois la faute morale et sa dimension sociale et violente.
- source_word: ይትገዘሙ
  choice: seront retranchées / seront retranchés
  rationale: Le passif exprime l’action de couper ou d’éliminer. « Retrancher » garde la vigueur de l’image judiciaire sans préciser davantage le résultat.
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Terme moral et religieux courant dans les scènes de jugement hénochiques.
- source_word: ይትሐጐሉ በሰይፍ
  choice: seront livrés à l’épée
  rationale: Cette formulation conserve la nuance judiciaire d’une remise au jugement ainsi que l’image explicite de l’épée.
- source_word: ጽሩፋን / ጽርፈት
  choice: les blasphémateurs / le blasphème
  rationale: Des mots français de la même famille préservent le lien lexical entre les deux termes guèzes apparentés.
- source_word: በኵሉ መካን
  choice: en tout lieu
  rationale: Rendu formel et naturel de la portée universelle de la formule locative.
- source_word: ይሔልይዋ ለግፍዕ
  choice: projettent la violence
  rationale: Le verbe indique une pensée intentionnelle ou un dessein; « projeter » fait ressortir la préméditation.
- source_word: ይገብርዋ ለጽርፈት
  choice: commettent le blasphème
  rationale: Expression française naturelle qui conserve la gravité religieuse du terme source.
- source_word: ይትሐጐሉ በመጥባሕት
  choice: périront par l’épée
  rationale: Le dernier syntagme évoque la mise à mort par une lame ou l’abattage. « Périront par l’épée » restitue clairement l’issue tout en restant idiomatique.
theological_decisions:
- issue: Portée morale de ዓመፃ
  choice: oppression
  alternative: injustice ou violence
  rationale: « Oppression » réunit l’idée de faute, de violence et de domination sociale dans cet oracle de jugement, sans réduire le mot à une seule de ces dimensions.
- issue: Nuance du premier ይትሐጐሉ
  choice: seront livrés à l’épée
  alternative: seront tués par l’épée
  rationale: La formulation retenue maintient la tension entre le fait d’être livré au jugement et son issue mortelle, au lieu de les confondre.
- issue: Référent du sujet implicite après la première mention de l’épée
  choice: maintien du pronom « ils »
  alternative: identifier explicitement les pécheurs ou rattacher les groupes suivants au verbe « retrancher »
  rationale: La suite guèze est syntaxiquement difficile. Le pronom conserve l’indétermination du témoin reçu plutôt que d’imposer un antécédent.
translation_notes:
  register: Français international moderne, digne et lisible, avec un registre apocalyptique soutenu. La répétition de « retrancher » et le lien entre « blasphémateurs » et « blasphème » sont volontairement conservés. La syntaxe obscure du témoin guèze est signalée sans être artificiellement harmonisée.
