base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/002.yaml
  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: fr
  text: Après cela[a], Mathusalem alla appeler tous ses frères auprès de lui et rassembla sa parenté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Là-dessus » ou « À partir de ce moment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: Après cela
  rationale: La forme prépositionnelle signifie littéralement « de là / à partir de cela », mais sert ici de transition temporelle dans le récit. « Après cela » rend naturellement cette succession.
- source_word: ሖረ
  choice: alla
  rationale: Verbe courant de déplacement; « alla » conserve simplement le mouvement exprimé par le guèze.
- source_word: ማቱሳላ
  choice: Mathusalem
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable du nom.
- source_word: ጸውዖሙ
  choice: appeler
  rationale: Le verbe peut signifier appeler ou convoquer. « Appeler » préserve sa portée générale sans suggérer une convocation officielle.
- source_word: ለኵሎሙ አኃዊሁ
  choice: tous ses frères
  rationale: Rend directement l'expression familiale explicite du texte, sans l'élargir à une communauté spirituelle.
- source_word: ኀቤሁ
  choice: auprès de lui
  rationale: Exprime le mouvement vers Mathusalem et la présence auprès de lui avec un français naturel.
- source_word: አስተጋብኦሙ
  choice: il rassembla
  rationale: La forme verbale exprime le fait de réunir des personnes; « rassembla » convient au déroulement narratif.
- source_word: አዝማዲ ዚአሁ
  choice: les membres de sa parenté
  rationale: Cette formulation rend clairement le groupe des personnes unies à lui par les liens familiaux, dans un registre actuel et digne, sans ajouter l'idée de les rassembler « auprès de lui ».
theological_decisions:
- issue: Portée du vocabulaire de parenté
  choice: Les termes « frères » et « parenté » désignent ici les relations familiales de Mathusalem.
  alternative: Comprendre « frères » comme des membres du clan, des compagnons ou une communauté spirituelle.
  rationale: Le contexte narratif et testamentaire ainsi que les termes guèzes favorisent le sens familial concret; rien dans le verset n'impose une lecture métaphorique ou sectaire.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition des liens familiaux du texte source est conservée, tandis que « les membres de sa parenté » évite le caractère vieilli de « sa parenté » employé seul. La seconde proposition n'ajoute pas « auprès de lui », car le guèze ne répète pas cette indication.
