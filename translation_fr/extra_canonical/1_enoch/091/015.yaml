  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: fr
  text: 'Après cela[a], dans la dixième semaine, dans sa septième partie, aura lieu le jugement éternel [et il sera exécuté par les Veilleurs du ciel éternel][b] : un grand jugement sera exécuté au milieu des anges.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transmis ici parle de la dixième semaine. Une ancienne traduction de ce verset donnait à cet endroit le contenu relatif à la septième semaine, connu ailleurs dans l’Apocalypse des semaines.
    reason: textual_variant
  - marker: b
    text: La proposition entre crochets est elle-même placée entre crochets dans le texte source fourni, ce qui signale une incertitude quant à son appartenance au texte.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: Après cela
  rationale: Formule de transition temporelle naturelle en français, correspondant directement à « et après cela » sans alourdir l’enchaînement.
- source_word: በሰንበት ዓሥርት ፯እደ
  choice: dans la dixième semaine, dans sa septième partie
  rationale: Le texte transmis mentionne explicitement la dixième semaine et la septième partie; « semaine » convient au cadre symbolique de l’Apocalypse des semaines.
- source_word: ኵነኔ እንተ ለዓለም
  choice: le jugement éternel
  rationale: ኵነኔ désigne ici le jugement, tandis que እንተ ለዓለም en indique le caractère durable ou éternel.
- source_word: ትጉሃነ
  choice: les Veilleurs
  rationale: Terme énochien désignant une catégorie d’êtres célestes; la majuscule signale son emploi comme appellation de groupe.
- source_word: ዐቢይ ዘይትቤቀል
  choice: un grand jugement sera exercé
  rationale: Le passif évite d’ajouter l’idée interprétative de vengeance tout en exprimant qu’un grand jugement est appliqué ou mis à exécution.
- source_word: እማእከሎሙ ለመላእክት
  choice: au milieu des anges
  rationale: Rend directement la localisation transmise, sans décider si les anges sont seulement le cadre ou aussi l’objet du jugement.
theological_decisions:
- issue: Rôle des Veilleurs dans l’exécution du jugement
  choice: Conserver la proposition entre crochets telle qu’elle figure dans le texte source fourni
  alternative: L’intégrer sans crochets ou l’omettre comme addition textuelle
  rationale: Les crochets préservent l’incertitude textuelle sans effacer une proposition présente dans le témoin fourni.
- issue: Rapport des anges au grand jugement
  choice: « au milieu des anges »
  alternative: « contre les anges » ou « parmi les anges »
  rationale: La formulation spatiale conserve l’ambiguïté du guèze et n’affirme pas explicitement que tous les anges sont l’objet du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure apocalyptique est conservée, ainsi que les crochets du texte source et l’ambiguïté de la dernière proposition.
