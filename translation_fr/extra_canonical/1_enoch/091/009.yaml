base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: fr
  text: Toutes les idoles seront rejetées avec les nations[a], et les temples seront brûlés par le feu[b] ; ils seront chassés de toute la terre et jetés dans le jugement du feu[c] ; ils périront dans la colère et dans un puissant jugement, pour toujours[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription disponible semble ici défectueuse. La lecture critique sous-jacente porte « toutes les idoles seront rejetées avec les nations ». Selon l’analyse syntaxique, « avec les nations » peut se rattacher aux idoles ou au procès de jugement.
    reason: textual_variant
  - marker: b
    text: La transcription fournie présente ici un mot altéré. La lecture critique retenue peut désigner des « temples » ou des « sanctuaires » ; « tours » a aussi été proposé.
    reason: textual_variant
  - marker: c
    text: L’expression peut aussi se traduire par « au jugement du feu » ou « dans un jugement de feu ».
    reason: lexical_alternative
  - marker: d
    text: « Pour toujours » exprime la finalité durable du jugement eschatologique, sans définir à lui seul un système doctrinal plus précis.
    reason: cultural_note
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ (lecture critique sous-jacente, altérée dans la transcription fournie)
  choice: les idoles […] seront rejetées
  rationale: La lecture rétablie correspond au texte critique de Charles et au contexte de suppression du culte idolâtre. « Rejetées » conserve l’idée d’abandon ou de mise à l’écart sans préciser un procédé matériel.
- source_word: ምስለ፡ አሕዛብ
  choice: des nations
  rationale: Littéralement, la préposition peut signifier « avec ». Dans cette construction et selon la ponctuation traditionnelle, elle peut rattacher les idoles aux nations. Une note conserve l’autre analyse possible.
- source_word: 'ማኅፈድ (lecture critique; transcription fournie : ማኅፈሪ)'
  choice: les temples
  rationale: La lecture critique désigne ici les sanctuaires associés aux idoles. « Temples » convient mieux au parallélisme que « tours », tout en signalant la difficulté textuelle en note.
- source_word: በእሳት፡ ትነድድ
  choice: seront consumés par le feu
  rationale: Rend naturellement l’image de destruction par le feu et la valeur passive imposée par le sujet dans le contexte.
- source_word: ወይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: On les fera disparaître de toute la terre
  rationale: Le verbe exprime une élimination ou expulsion complète. Le tour impersonnel évite d’identifier un agent que le verset ne nomme pas.
- source_word: በኵነኔ፡ እሳት
  choice: dans le jugement du feu
  rationale: Conserve la construction nominale et judiciaire du guèze au lieu de la réduire à « jugement ardent ».
- source_word: በመዓት
  choice: sous la colère
  rationale: Maintient le registre élevé de la scène de jugement sans ajouter explicitement un possesseur absent de l’expression.
- source_word: በኵነኔ፡ ኃያል
  choice: dans un jugement terrible
  rationale: ኃያል évoque ici la puissance et la sévérité du jugement. « Terrible » est idiomatique en français moderne et garde sa force redoutable.
- source_word: እንተ፡ ለዓለም
  choice: pour toujours
  rationale: Expression française courante qui préserve la portée durable et finale de la formule eschatologique.
theological_decisions:
- issue: Identité de ceux qui sont jetés dans le jugement
  choice: ces nations
  alternative: les idoles et les temples, ou un référent collectif laissé implicite
  rationale: Le pluriel personnel du passage s’applique plus naturellement aux nations qu’aux objets cultuels, mais le changement de référent n’est pas entièrement explicite; l’ajout démonstratif clarifie seulement l’enchaînement minimal.
- issue: Nature et durée du jugement final
  choice: jugement du feu […] pour toujours
  alternative: imagerie hyperbolique de destruction ou durée eschatologique non définie philosophiquement
  rationale: La traduction garde les formulations fortes du texte sans les convertir en une doctrine plus détaillée sur le mode de l’existence ou de la souffrance après le jugement.
translation_notes:
  register: Français international moderne, digne et lisible. La cadence cumulative du texte apocalyptique est conservée, avec des propositions coordonnées et un vocabulaire judiciaire soutenu mais courant. Les difficultés provenant manifestement de la transcription/OCR sont signalées plutôt que reproduites silencieusement.
