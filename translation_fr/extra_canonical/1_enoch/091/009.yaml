revisions:
- from: Toutes les idoles des nations seront rejetées[a], et les temples seront consumés par le feu[b]. On les fera disparaître de toute la terre; ces nations seront jetées dans le jugement du feu[c] et périront sous la colère, dans un jugement terrible, pour toujours[d].
  to: Toutes les idoles seront rejetées avec les nations[a], et les temples seront brûlés par le feu[b] ; ils seront chassés de toute la terre et jetés dans le jugement du feu[c] ; ils périront dans la colère et dans un puissant jugement, pour toujours[d].
  rationale: La révision conserve les corrections textuelles critiques nécessaires signalées dans l’historique, mais rétablit la relation explicite « avec les nations » et ne transforme pas le pluriel non spécifié en « ces nations ». Elle emploie une série passive plus proche du guèze et préserve l’ambiguïté référentielle sans imposer d’interprétation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:11:54Z'
