base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: fr
  text: 'Ne vous approchez pas de la droiture avec un cœur partagé, et ne vous associez pas à ceux qui ont le cœur partagé[a]. Mais marchez dans la justice, mes enfants : elle vous conduira sur un bon chemin, et la justice sera votre compagne[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « et ne vous associez pas à ceux qui ont le cœur partagé » figure entre crochets dans le témoin éthiopien fourni; elle pourrait représenter une variante textuelle ou un développement secondaire.
    reason: textual_variant
  - marker: b
    text: 'Ou : « la justice vous sera associée ». Le terme éthiopien évoque l’association, la participation ou la compagnie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትቅረቡ
  choice: ne vous approchez pas
  rationale: L’impératif négatif exprime l’interdiction de s’approcher; cette formulation conserve l’image spatiale et morale du texte.
- source_word: ርትዕ
  choice: la droiture
  rationale: Le terme désigne ici la rectitude morale. « Droiture » le distingue du ጽድቅ répété ensuite tout en conservant sa portée éthique.
- source_word: በክልኤ ልብ
  choice: avec un cœur partagé
  rationale: Cette expression française naturelle maintient l’image concrète du cœur et rend l’idée de loyauté divisée sans la réduire à un terme psychologique.
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: ne vous associez pas à ceux qui ont le cœur partagé
  rationale: « S’associer à » rend clairement la relation sociale visée par le verbe, tandis que la répétition de « cœur partagé » préserve le parallélisme.
- source_word: ሑሩ
  choice: marchez
  rationale: Dans cette exhortation morale, « marcher » conserve la métaphore de la conduite et prépare naturellement celle du chemin.
- source_word: በጽድቅ
  choice: dans la justice
  rationale: Le nom garde sa valeur de domaine éthique et permet de reprendre « la justice » comme sujet dans la proposition finale.
- source_word: ደቂቅየ
  choice: mes enfants
  rationale: Cette adresse familiale et pédagogique est naturelle, digne et inclusive en français moderne.
- source_word: ትመርሐክሙ
  choice: elle vous conduira
  rationale: Le pronom féminin renvoie naturellement en français à « la justice », qui joue le rôle de guide.
- source_word: በፍኖት ኄርት
  choice: sur un bon chemin
  rationale: La construction est singulière et signifie simplement « sur un bon chemin »; le ወጽድቅ suivant appartient à la proposition suivante.
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: et la justice sera votre compagne
  rationale: « Compagne » exprime naturellement l’association ou le partenariat indiqué par ሱታፌ et prolonge la personnification implicite de la justice.
theological_decisions:
- issue: Expression de la loyauté intérieure divisée
  choice: un cœur partagé / le cœur partagé
  alternative: un cœur double / être irrésolu
  rationale: « Cœur partagé » conserve l’anthropologie morale de la source tout en étant immédiatement compréhensible en français contemporain; cette formulation ne tranche pas au-delà de l’idée de duplicité ou de loyauté divisée.
- issue: Statut de la proposition placée entre crochets dans le témoin fourni
  choice: proposition conservée dans le texte avec une note
  alternative: omettre la proposition comme développement secondaire
  rationale: La proposition appartient au témoin transmis et forme un parallélisme cohérent, mais son statut entre crochets doit être signalé plutôt que dissimulé.
- issue: Rapport entre la justice, le chemin et l’accompagnement
  choice: la justice conduit puis devient la compagne
  alternative: éviter la personnification en reformulant de manière abstraite
  rationale: La formulation maintient l’enchaînement et la tension poétique du texte sans expliquer si la justice est seulement une qualité morale ou une réalité personnifiée.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve les métaphores du cœur, de la marche, du chemin et de la justice comme guide et compagne, tout en évitant les tournures archaïques.
