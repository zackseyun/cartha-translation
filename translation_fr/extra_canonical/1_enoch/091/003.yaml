base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: fr
  text: 'Il leur parla à tous, à tous les enfants de la justice, et dit : « Écoutez, enfants d’Hénoch, toutes les paroles de votre père, et prêtez l’oreille aux paroles droites de ma bouche[a] ; car je vous le fais savoir et vous le dis[b], bien-aimés : aimez la justice et marchez en elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction guèze est difficile. On peut aussi comprendre : « écoutez comme il convient la parole de ma bouche », ou une formulation semblable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car je vous fais entendre et vous annonce ces choses » ; le premier verbe peut exprimer l’action de faire entendre, de témoigner ou de proclamer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: enfants de la justice
  rationale: Conserve l’expression identitaire et familiale propre au style hénochien, plutôt que de l’aplanir en « enfants justes ».
- source_word: ደቂቀ ሄኖክ
  choice: enfants d’Hénoch
  rationale: Rend directement le pluriel filial et emploie la forme française traditionnelle et intelligible du nom.
- source_word: ኵሎ ነገረ አቡክሙ
  choice: toutes les paroles de votre père
  rationale: Le pluriel français exprime naturellement la totalité du discours paternel tout en gardant le registre solennel.
- source_word: አጽምኡ
  choice: prêtez l’oreille
  rationale: Marque le second impératif d’écoute sans le confondre avec « écoutez » et demeure naturel dans un registre biblique moderne.
- source_word: ርርትዐ ቃለ አፉየ
  choice: aux paroles droites de ma bouche
  rationale: Suit l’analyse selon laquelle le terme de rectitude qualifie les paroles, tout en signalant en note la construction difficile et l’autre analyse possible.
- source_word: አሰምዕ...ወእነግረክሙ
  choice: je vous exhorte et vous parle
  rationale: Le causatif de « entendre » peut porter ici la force d’une proclamation ou exhortation solennelle; le doublet conserve l’insistance du texte sans surcharger le français.
- source_word: ፍቁራን
  choice: bien-aimés
  rationale: Vocatif affectueux, digne et courant dans le français biblique moderne.
- source_word: ርትዕ
  choice: justice
  rationale: Terme éthique structurant du passage; « justice » est naturel en français et peut désigner ici la rectitude vécue, non seulement la justice judiciaire.
- source_word: ባቲ ሑሩ
  choice: marchez en elle
  rationale: Préserve la métaphore éthique de la marche et son renvoi explicite à la justice.
theological_decisions:
- issue: Rendre ጽድቅ/ርትዕ par « justice » ou « droiture »
  choice: justice
  alternative: droiture
  rationale: « Justice » maintient un terme biblique central et une qualité éthique globale; le contexte ne permet pas de la réduire à une notion strictement judiciaire. « Droiture » reste possible, mais ferait perdre la répétition lexicale traditionnelle.
- issue: Force de አሰምዕ dans l’adresse solennelle
  choice: je vous exhorte
  alternative: je vous fais entendre / je vous parle
  rationale: La forme causative peut exprimer le fait de faire entendre, d’attester ou d’exhorter. « Exhorte » convient au contexte parénétique, mais l’ambiguïté est conservée dans une note.
translation_notes:
  register: Français international moderne, digne et légèrement solennel. Les répétitions et la métaphore de la marche sont conservées; les archaïsmes tels que « oyez » ou « icelle » sont évités.
