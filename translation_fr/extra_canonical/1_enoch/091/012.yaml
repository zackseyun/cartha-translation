base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: fr
  text: Après cela viendra une autre semaine[a], la huitième, celle de la justice. Une épée lui sera donnée afin qu’un jugement juste soit exécuté contre les oppresseurs, et les pécheurs seront livrés aux mains des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une huitième semaine ». Dans cette vision, les semaines représentent des périodes symboliques de l’histoire, non des semaines ordinaires du calendrier.'
    reason: lexical_alternative
  - marker: b
    text: Être livré « aux mains » de quelqu’un signifie être remis à son pouvoir ou sous son autorité.
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት
  choice: une autre
  rationale: Le terme marque la succession dans la série des semaines symboliques. « Une autre » est naturel en français et n’évoque pas à tort une simple deuxième semaine.
- source_word: ሳምንት ሰንበት
  choice: semaine, la huitième
  rationale: L’expression désigne la huitième période symbolique de l’apocalypse des semaines. La formulation française conserve à la fois l’image de la semaine et son rang.
- source_word: እንተ ጽድቅ
  choice: celle de la justice
  rationale: La construction caractérise cette semaine par ጽድቅ. « Justice » rend ici naturellement l’ordre moral juste qui définit cette période, tout en permettant de reprendre la même racine dans « jugement juste ».
- source_word: ይትወሀብ ላቲ ሰይፍ
  choice: Une épée lui sera donnée
  rationale: Le pronom féminin renvoie à la semaine. La traduction conserve sans l’interpréter l’image explicite de l’épée et laisse ouverte sa portée littérale ou symbolique.
- source_word: ከመ ይትገበር ኵነኔ ጽድቅ
  choice: afin qu’un jugement juste soit exécuté
  rationale: La proposition exprime le but. « Jugement juste » conserve les dimensions judiciaire et morale; le passif « soit exécuté » correspond au caractère accompli ou mis en œuvre du jugement.
- source_word: እምእለ ይገፍዑ
  choice: contre les oppresseurs
  rationale: Le verbe désigne ceux qui commettent violence ou injustice. Dans ce contexte judiciaire, « les oppresseurs » est clair et idiomatique.
- source_word: ይትሜጠዉ ኃጥኣን በእደዊሆሙ ለጻድቃን
  choice: les pécheurs seront livrés aux mains des justes
  rationale: La construction indique que les pécheurs passent sous le pouvoir des justes. L’expression française conserve l’image concrète et l’idiome biblique sans préciser davantage la nature de ce pouvoir.
theological_decisions:
- issue: Rendu de ጽድቅ dans la caractérisation de la semaine et du jugement
  choice: Employer « justice » puis « juste »
  alternative: « droiture » et « jugement conforme à la justice »
  rationale: La même racine relie l’ordre moral de la période au jugement qui s’y accomplit. En français moderne, « justice » et « juste » maintiennent clairement ce lien sans réduire le terme à la seule justice civique.
- issue: Nature de l’image de l’épée
  choice: Conserver « Une épée lui sera donnée »
  alternative: « Le pouvoir de juger lui sera donné »
  rationale: Le guèze mentionne explicitement l’épée. Il convient de préserver cette image apocalyptique et son ambiguïté plutôt que de la remplacer par une interprétation.
- issue: Pouvoir confié aux justes sur les pécheurs
  choice: Conserver l’idiome « livrés aux mains des justes »
  alternative: « livrés au pouvoir des justes »
  rationale: La formulation concrète du texte source est maintenue sans définir si ce transfert de pouvoir relève du combat, du jugement ou d’une autre forme d’autorité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste compacte pour préserver le rythme apocalyptique. Les images de l’épée et des mains sont conservées, tandis que les notes éclairent seulement la portée symbolique et idiomatique sans imposer une interprétation confessionnelle.
