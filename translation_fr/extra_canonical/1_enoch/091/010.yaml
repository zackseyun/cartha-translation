base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: fr
  text: Et le juste[a] se lèvera de son sommeil[b] ; la sagesse se lèvera et leur sera donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le singulier « le juste » peut désigner une figure individuelle précise ou une personne représentant la communauté des justes ; le texte ne tranche pas.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de son sommeil ». Une traduction antérieure proposait « du milieu d’eux », mais la forme guèze transmise renvoie au sommeil avec un suffixe masculin singulier.'
    reason: textual_clarification
lexical_decisions:
- source_word: ይትነሣእ
  choice: se lèvera
  rationale: Le verbe exprime le fait de se lever ou de surgir. Le futur « se lèvera » convient au registre apocalyptique et, avec « de son sommeil », rend naturellement l’idée d’un réveil sans ajouter celle d’une résurrection.
- source_word: ጻድቅ
  choice: le juste
  rationale: Le terme est au singulier. « Le juste » en conserve la force individualisante tout en laissant ouverte la possibilité d’une figure particulière ou représentative.
- source_word: እምነዋሙ
  choice: de son sommeil
  rationale: La forme s’analyse comme la préposition « de », le nom « sommeil » et un suffixe masculin singulier. Elle renvoie donc naturellement au sommeil du « juste » qui précède.
- source_word: ጥበብ
  choice: la sagesse
  rationale: Dans ce contexte moral et révélatoire, « sagesse » est le sens le plus direct et le plus large.
- source_word: ይትወሀብ ሎሙ
  choice: leur sera donnée
  rationale: Le passif suivi d’un bénéficiaire pluriel indique simplement que la sagesse sera donnée à plusieurs personnes. Cette formulation française reste directe et n’explicite pas l’identité du donateur.
theological_decisions:
- issue: Valeur individuelle ou représentative de ጻድቅ
  choice: 'Maintien du singulier : « le juste »'
  alternative: « les justes » ou « un juste »
  rationale: La forme guèze est singulière. La traduction ne collectivise pas le terme et ne décide pas non plus si ce juste est une figure précise, messianique ou représentative.
- issue: Rapport entre le juste singulier et les bénéficiaires pluriels
  choice: Conserver « son sommeil » puis « leur sera donnée »
  alternative: Harmoniser les deux expressions au pluriel
  rationale: Le texte passe d’un juste singulier à des bénéficiaires pluriels. Cette tension grammaticale et interprétative est conservée au lieu d’être aplanie.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « se lèvera » reproduit le parallélisme du texte, tandis que le point-virgule clarifie les deux propositions sans les dissocier.
