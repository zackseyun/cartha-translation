base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: fr
  text: Car je sais que la violence persistera sur la terre et qu’un grand fléau[a] s’abattra sur la terre. Toute iniquité atteindra son comble[b], puis sera extirpée jusque dans ses racines, et toute construction[c] disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande calamité », « une grande peste » ou « un grand châtiment » ; le terme guèze désigne largement une atteinte ou une affliction à caractère punitif.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut signifier que l’iniquité arrive à son comble avant le jugement, non qu’elle est approuvée ou rendue parfaite.
    reason: alternative_reading
  - marker: c
    text: Ou « tout bâtiment » ; le terme peut désigner concrètement un édifice ou, plus largement, toute chose construite.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Conserve la valeur explicative du connecteur et convient au ton solennel du passage.
- source_word: አእምር
  choice: je sais
  rationale: Rend naturellement l’affirmation présente de connaissance et sa certitude prophétique.
- source_word: ይጸንዕ ሀላዌ ግፍዕ
  choice: la violence persistera
  rationale: Le verbe exprime la fermeté ou la durée; « persistera » indique la continuité du mal sans suggérer son approbation.
- source_word: በዲበ ምድር
  choice: sur la terre
  rationale: Formulation locative naturelle et digne en français moderne.
- source_word: ትትፈጸም መቅሠፍት ዐቢይ
  choice: un grand fléau s’accomplira
  rationale: Préserve le passif et l’idée d’un événement punitif mené à son terme, sans réduire le fléau à une maladie.
- source_word: ኵላ ዓመፃ
  choice: toute révolte
  rationale: Le terme désigne une conduite rebelle et fautive; « révolte » conserve cette dimension tout en restant idiomatique.
- source_word: ትትፈጸም
  choice: atteindra son plein développement
  rationale: Avec la révolte comme sujet, cette expression laisse entendre que le mal arrive à son comble avant son élimination, plutôt qu’il serait approuvé.
- source_word: ትትገዘም እምሥረዊሃ
  choice: sera retranchée jusqu’à ses racines
  rationale: Conserve l’image d’une suppression radicale et définitive, depuis les racines.
- source_word: ኵሉ ሕንጻ
  choice: toute construction
  rationale: Garde la portée relativement large du nom, qui peut désigner un bâtiment ou ce qui a été édifié.
- source_word: የኃልፍ
  choice: disparaîtra
  rationale: Exprime clairement la cessation ou la disparition dans un contexte de jugement, sans imposer un sens strictement matériel.
theological_decisions:
- issue: La violence persiste et la révolte arrive à son terme avant d’être supprimée.
  choice: 'La traduction maintient la séquence : persistance, plein développement, puis retranchement radical.'
  alternative: Comprendre le passage comme annonçant uniquement la destruction immédiate du mal.
  rationale: La succession des verbes guèzes présente une tension apocalyptique entre la maturation du mal et son jugement; la formulation française ne la résout pas artificiellement.
- issue: Portée du grand fléau
  choice: Employer « fléau » sans préciser explicitement son agent ni sa forme.
  alternative: Traduire par « peste », « châtiment » ou « grande affliction ».
  rationale: Le mot source peut évoquer une calamité ou une frappe punitive; « fléau » préserve cette amplitude sans ajouter une précision doctrinale.
translation_notes:
  register: Français international moderne, solennel mais accessible. La coordination et le rythme gardent la progression apocalyptique du texte. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
