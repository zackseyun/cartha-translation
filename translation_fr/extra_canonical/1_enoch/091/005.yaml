  rationale: La révision remplace « révolte » par « iniquité » afin de conserver la portée morale générale de ዓመፃ, améliore l’expression de l’extirpation « depuis les racines », et emploie une formulation plus idiomatique pour le fléau. Les ambiguïtés lexicales concernant le fléau et la construction demeurent explicitement signalées en notes; les ancres a, b et c sont toutes placées immédiatement après les expressions concernées.
