    issue: « Toute révolte » est trop étroit pour ኵላ ዓመፃ.
    rationale: Le terme désigne plus largement l’injustice, la transgression ou l’iniquité; « révolte » peut orienter vers une insurrection politique et ne correspond pas aussi bien à la portée morale générale du contexte.
  - severity: low
    issue: « Sera retranchée jusqu’à ses racines » rend imparfaitement la relation « depuis/à partir de ses racines ».
    rationale: La formulation française suggère surtout une limite atteinte, tandis que l’image source exprime l’éradication à la racine. « Sera extirpée jusque dans ses racines » est plus idiomatique et plus exact.
  - severity: low
    issue: « Un grand fléau s’accomplira » est légèrement peu idiomatique.
    rationale: Un fléau est plus naturellement présenté comme s’abattant; cette formulation ne précise ni l’agent ni la nature du fléau et préserve donc l’amplitude du terme guèze.
