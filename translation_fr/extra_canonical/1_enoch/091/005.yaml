  source_fidelity: 'La progression du guèze est bien rendue : persistance de la violence, accomplissement d’un grand fléau, arrivée de toute injustice à son terme, extirpation radicale, puis disparition de toute construction. Toutefois, « toute révolte » resserre indûment ዓመፃ sur l’idée de soulèvement; « toute iniquité » rend plus justement le mal moral et rebelle visé. « Jusqu’à ses racines » est aussi moins précis que l’idée d’une élimination depuis/avec les racines.'
  naturalness: Le texte est globalement clair et de registre approprié. « Un grand fléau s’accomplira » reste possible dans un style prophétique, mais « s’abattra » est plus naturel en français moderne pour un fléau tout en conservant son caractère calamiteux. « Sera extirpée jusque dans ses racines » restitue naturellement l’image d’une suppression totale.
  terminology: « Violence », « fléau », « iniquité » et « construction » sont cohérents avec le registre apocalyptique sans imposer d’interprétation confessionnelle. « Iniquité » évite la coloration politique potentielle de « révolte ». Les notes conservent les alternatives importantes et leurs ancres correspondent aux expressions annotées.
  issues:
