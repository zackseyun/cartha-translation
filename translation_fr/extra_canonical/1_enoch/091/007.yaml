    issue: 'Formulation française ambiguë : « le Seigneur saint sortira dans sa colère et son châtiment »'
    rationale: Le français « dans son châtiment » peut faire comprendre que le Seigneur est lui-même dans un état de châtiment. Le syntagme source exprime plutôt une venue caractérisée ou accompagnée de colère et de châtiment.
  - severity: low
    issue: Ancrage de la note b
    rationale: La note porte sur la valeur de « lorsque » / « si » au début de la protase ; son appel devrait donc suivre « lorsque ».
