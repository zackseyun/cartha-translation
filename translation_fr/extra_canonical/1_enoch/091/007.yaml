revisions:
- from: Et lorsque le péché, la transgression, le blasphème et la violence se multiplieront dans tous les actes, et que le mépris de la loi, les mauvaises actions et l’impureté se multiplieront, un grand châtiment[a] viendra du ciel sur eux tous. Alors le Seigneur saint sortira dans sa colère et son châtiment pour exercer le jugement sur la terre.[b]
  to: Et lorsque[b] le péché, la transgression, le blasphème et la violence se multiplieront dans tous les actes, et que le mépris de la loi, les mauvaises actions et l’impureté se multiplieront, un grand châtiment[a] viendra du ciel sur eux tous. Alors le Seigneur saint s’avancera avec colère et châtiment pour exercer le jugement sur la terre.
  rationale: La révision conserve les choix lexicaux et la structure de la traduction, mais remplace une construction française potentiellement équivoque par « s’avancera avec colère et châtiment », qui rend naturellement la venue judiciaire du Seigneur. L’appel de note relatif à l’ambiguïté de ወእመኒ est déplacé auprès de « lorsque ».
