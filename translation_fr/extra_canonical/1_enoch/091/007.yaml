base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: fr
  text: Et lorsque[b] le péché, la transgression, le blasphème et la violence se multiplieront dans tous les actes, et que le mépris de la loi, les mauvaises actions et l’impureté se multiplieront, un grand châtiment[a] viendra du ciel sur eux tous. Alors le Seigneur saint s’avancera avec colère et châtiment pour exercer le jugement sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand fléau » ou « une grande calamité punitive » ; le terme guèze peut désigner une affliction infligée comme sanction aussi bien qu’un châtiment.
    reason: lexical_alternative
  - marker: b
    text: 'Le début du verset peut aussi se traduire : « Et si le péché, la transgression, le blasphème et la violence se multiplient dans tous les actes… »'
    reason: source_ambiguity
lexical_decisions:
- source_word: ወእመኒ
  choice: Et lorsque
  rationale: Conserve la subordination temporelle qui introduit la montée du mal comme préalable au jugement, sans réduire arbitrairement le terme à une condition hypothétique.
- source_word: ትልህቅ / ትለህቅ
  choice: se multiplieront
  rationale: Rend naturellement l’escalade répétée des maux tout en gardant la force apocalyptique du passage.
- source_word: ኃጢአት
  choice: péché
  rationale: Terme moral et religieux courant qui correspond directement à la faute visée.
- source_word: ዓመፃ
  choice: transgression
  rationale: Préserve l’idée de violation ou de révolte et le distingue des autres termes de la liste.
- source_word: ጽርፈት
  choice: blasphème
  rationale: Conserve la portée probablement impie de la parole outrageante dans ce catalogue de vices.
- source_word: ግፍዕ
  choice: violence
  rationale: Exprime de façon concise l’injustice brutale ou oppressive.
- source_word: በኵሉ ተግባር
  choice: dans tous les actes
  rationale: Préserve la valeur distributive de la corruption qui envahit l’ensemble de l’agir.
- source_word: ዕልወት
  choice: mépris de la loi
  rationale: Expression française claire qui maintient l’idée de rejet de l’ordre juste sans imposer le sens plus précis d’apostasie.
- source_word: አበሳ
  choice: mauvaises actions
  rationale: Rend une faute morale générale tout en la distinguant du péché et de la transgression déjà nommés.
- source_word: ርኵስ
  choice: impureté
  rationale: Préserve les possibles dimensions morale et rituelle dans un français actuel et digne.
- source_word: መቅሠፍት ዐቢይ
  choice: un grand châtiment
  rationale: Le contexte de colère et de jugement favorise le sens punitif, tout en laissant en note les nuances de fléau ou de calamité.
- source_word: ይከውን እምሰማይ
  choice: viendra du ciel
  rationale: Formulation française naturelle qui conserve l’origine céleste du châtiment.
- source_word: እግዚእ ቅዱስ
  choice: le Seigneur saint
  rationale: Rend le titre divin de façon compacte sans l’assimiler à une formule canonique ultérieure déterminée.
- source_word: በመዓት ወበመቅሠፍት
  choice: dans sa colère et son châtiment
  rationale: Conserve les deux éléments et leur parallélisme instrumental ou circonstanciel, sans effacer la répétition de la notion punitive.
- source_word: ይግበር ኵነኔ ዲበ ምድር
  choice: pour exercer le jugement sur la terre
  rationale: Restitue directement le but judiciaire de la venue divine.
theological_decisions:
- issue: Valeur de ወእመኒ au début du verset
  choice: lorsque
  alternative: si
  rationale: La structure protase-apodose et le contexte apocalyptique favorisent une relation temporelle annoncée, mais la valeur conditionnelle demeure linguistiquement possible et est signalée en note.
- issue: Sens de መቅሠፍት
  choice: châtiment
  alternative: fléau ou calamité punitive
  rationale: Le jugement explicite à la fin du verset rend prioritaire le sens de sanction divine, sans exclure une manifestation concrète sous forme de fléau.
- issue: Titre divin እግዚእ ቅዱስ
  choice: le Seigneur saint
  alternative: le Seigneur, le Saint
  rationale: La traduction choisie préserve l’unité compacte du titre et ses deux composantes sans importer une formulation doctrinale fixe.
- issue: Rapport entre colère et châtiment lors de la sortie du Seigneur
  choice: dans sa colère et son châtiment
  alternative: avec colère et châtiment
  rationale: La formulation garde la tension du texte, où la venue divine est accompagnée ou caractérisée par la colère et l’action punitive, sans préciser davantage leur rapport.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération et le mouvement apocalyptique sont conservés. « Alors » explicite naturellement en français l’ouverture de l’apodose, tandis que les notes maintiennent les ambiguïtés lexicales et syntaxiques réelles.
