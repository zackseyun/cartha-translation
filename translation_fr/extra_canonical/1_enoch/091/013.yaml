base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: fr
  text: À son achèvement[a], des maisons seront choisies à cause de leur justice[b], et la maison du grand Roi[c] sera bâtie dans la gloire pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L'expression peut aussi se traduire par « à sa fin »; elle renvoie vraisemblablement à l'achèvement de la période décrite dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le guèze transmis est difficile. On peut aussi comprendre : « des maisons seront choisies dans la justice pour eux ». Une correction conjecturale du verbe, fondée sur une possible confusion de copie ou de lecture, donnerait : « ils acquerront des maisons à cause de leur justice ».'
    reason: textual_and_syntactic_uncertainty
  - marker: c
    text: Dans ce contexte eschatologique, « le grand Roi » désigne probablement Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: À son achèvement
  rationale: La préposition በ- et le nom dérivé de la racine « achever, finir » forment une indication temporelle. « À son achèvement » conserve le renvoi à la période apocalyptique évoquée par le contexte sans ajouter « consommation », plus interprétatif.
- source_word: ይመረዩ
  choice: seront choisies
  rationale: Le texte transmis dans la source fournie présente une forme à valeur passive liée au choix. Malgré une proposition de correction conjecturale en « ils acquerront », le projet traduit ici le texte guèze effectivement fourni et signale l'incertitude en note.
- source_word: አብያተ
  choice: des maisons
  rationale: Le pluriel signifie littéralement « maisons » et peut aussi évoquer des demeures ou des maisonnées. Le terme concret maintient le parallèle architectural avec la maison du grand Roi.
- source_word: እምጽድቅ ዚአሆሙ
  choice: à cause de leur justice
  rationale: Cette lecture rattache le pronom possessif à « justice » et comprend እም comme exprimant ici le motif ou le fondement. La syntaxe reste incertaine; une autre segmentation est donnée en note.
- source_word: ወይትሐነጽ
  choice: et ... sera bâtie
  rationale: Le verbe désigne l'action de bâtir ou construire; « sera bâtie » garde sa forme passive et le registre solennel.
- source_word: ቤት ንጉሥ ዐቢይ
  choice: la maison du grand Roi
  rationale: « Maison » préserve à la fois les résonances royales et cultuelles possibles. La majuscule à « Roi » indique le référent divin probable dans ce cadre eschatologique, sans le remplacer par « Dieu ».
- source_word: በስብሐት
  choice: dans la gloire
  rationale: Le nom peut désigner gloire ou splendeur. « Dans la gloire » conserve la préposition et la tonalité élevée.
- source_word: እስከ ለዓለም
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée perpétuelle; « pour toujours » est naturel en français moderne.
theological_decisions:
- issue: Identité du « grand Roi »
  choice: Titre royal probablement divin, rendu « grand Roi » avec une majuscule
  alternative: Un roi terrestre de l'âge idéal, ou un titre royal générique sans majuscule
  rationale: Le cadre eschatologique rend vraisemblable une référence à Dieu. Le titre est néanmoins traduit sans explicitation doctrinale, et la note maintient la prudence.
- issue: Sens de la sélection des maisons
  choice: Conserver l'image concrète de maisons choisies
  alternative: « Ils acquerront des maisons » sur la base d'une correction conjecturale du verbe, ou « des maisons seront choisies dans la justice pour eux » selon une autre analyse syntaxique
  rationale: Le texte guèze fourni porte explicitement « maisons » et un verbe lu comme passif. Conserver cette formulation respecte le témoin présenté et son parallèle avec la maison du Roi, tout en documentant les incertitudes textuelles et syntaxiques.
translation_notes:
  register: Français international moderne, clair et digne. La construction conserve l'imagerie architecturale et le parallélisme du verset. Les ambiguïtés du texte guèze et la correction conjecturale proposée sont exposées en note plutôt que résolues silencieusement.
