base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: fr
  text: Après cela, pendant la neuvième semaine[a], le juste jugement sera révélé au monde entier. Toutes les œuvres des méchants disparaîtront de toute la terre, le monde sera inscrit pour la destruction[b], et tous les humains regarderont vers le chemin de la droiture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « semaine » représente une époque de l’histoire sacrée, et non une période littérale de sept jours.
    reason: cultural_note
  - marker: b
    text: L’expression évoque peut-être la mise par écrit d’un décret vouant le monde à la destruction. Le texte guèze est difficile; pris isolément, il pourrait aussi se comprendre comme « il sera écrit pour la destruction de l’âge » ou « pour une destruction éternelle ».
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: pendant la neuvième semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période symbolique de l’histoire sacrée, et non un sabbat ou une semaine littérale.
- source_word: ኵነኔ ጽድቅ
  choice: le juste jugement
  rationale: Cette formulation française naturelle conserve à la fois la dimension judiciaire et le caractère juste du jugement.
- source_word: ትትከሠት
  choice: sera révélé
  rationale: Le passif exprime la manifestation publique du jugement dans un cadre apocalyptique.
- source_word: ለኵሉ ዓለም
  choice: au monde entier
  rationale: Ici, ዓለም désigne naturellement le monde comme destinataire ou sphère de cette révélation.
- source_word: ተግባረ ረሲዓን
  choice: les œuvres des méchants
  rationale: « Œuvres » garde le caractère concret des actes, tandis que « méchants » rend la qualification morale des personnes.
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: disparaîtront de toute la terre
  rationale: Le verbe signifie littéralement sortir ou s’en aller; « disparaîtront de » exprime ici leur retrait sans préciser indûment le moyen.
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: le monde sera inscrit pour la destruction
  rationale: L’appui de l’araméen de 4Q212 permet d’identifier « le monde » comme sujet du passif. « Inscrit » préserve l’image d’une mise par écrit ou d’un décret, sans la réduire à une simple condamnation.
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: regarderont vers le chemin de la droiture
  rationale: Le verbe évoque le regard ou l’attention orientée, sans imposer l’idée d’obéissance; le singulier « chemin » respecte la morphologie guèze et l’attestation araméenne.
theological_decisions:
- issue: Sens de la clause difficile ይጽሐፍ ለሐጕለ ዓለም
  choice: le monde sera inscrit pour la destruction
  alternative: il sera écrit pour la destruction de l’âge / il sera consigné pour la ruine du monde
  rationale: Le guèze est syntaxiquement difficile, mais l’araméen de 4Q212 soutient « le monde » comme sujet. La traduction conserve néanmoins l’image énigmatique de l’inscription et explique son possible sens décrétal en note, sans déterminer la nature exacte de la destruction.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme apocalyptique, distingue « juste jugement » de « droiture » et maintient l’étrangeté intentionnelle de l’image du monde inscrit pour la destruction.
