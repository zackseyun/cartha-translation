base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: fr
  text: Et ce veau noir frappa le veau rouge et le poursuivit jusqu’à terre[a][b]. Après cela, je ne pus plus voir ce veau rouge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frappa » peut aussi se traduire par « blessa » ou, compte tenu de l’image bovine, « encorna ».
    reason: lexical_alternative
  - marker: b
    text: L’expression rendue par « jusqu’à terre » peut aussi se comprendre comme « vers le sol », « sur la terre » ou « dans la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ጐድአ
  choice: frappa
  rationale: Le verbe exprime un coup ou une blessure. « Frappa » conserve la violence de l’action sans préciser indûment qu’il s’agissait d’un coup de corne.
- source_word: ጸሊም
  choice: noir
  rationale: C’est le terme de couleur courant et naturel dans cette vision animale.
- source_word: ጣዕዋ
  choice: veau
  rationale: Le terme désigne ici un jeune bovin sans marque féminine explicite. « Veau » évite d’introduire le sexe féminin qu’impliquerait « génisse ».
- source_word: ለቀይሕ
  choice: le veau rouge
  rationale: L’adjectif substantivé désigne l’animal rouge; répéter « veau » rend le référent clair en français tout en respectant le contexte immédiat.
- source_word: ተለዎ
  choice: le poursuivit
  rationale: Après le coup, le contexte est hostile; « poursuivit » rend mieux cette action que le terme neutre « suivit ».
- source_word: ውስተ ምድር
  choice: jusqu’à terre
  rationale: La préposition associée à « terre/sol » exprime un mouvement dont le point d’aboutissement reste quelque peu ambigu. « Jusqu’à terre » préserve l’image sans affirmer que l’animal s’enfonce sous terre.
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: Après cela, je ne vis plus
  rationale: Cette formulation française naturelle conserve à la fois le repère temporel et la cessation de la vision.
theological_decisions:
- issue: Maintien de l’imagerie animale symbolique
  choice: Conserver les « veaux » noir et rouge dans le texte principal
  alternative: Identifier directement les animaux à Caïn et Abel
  rationale: Le récit se présente comme une vision symbolique. La traduction doit en préserver la forme sans substituer une interprétation à l’image.
- issue: Sexe des jeunes bovins
  choice: Employer le terme non féminisé « veau »
  alternative: Employer « génisse »
  rationale: Le mot guèze de ce verset n’est pas accompagné d’un marqueur féminin. « Génisse » imposerait donc une précision absente du texte.
translation_notes:
  register: Français international moderne, simple et digne. La coordination initiale et la répétition de « veau rouge » conservent le rythme visionnaire et la clarté des référents. Les notes signalent les deux ambiguïtés lexicales principales sans surcharger le texte.
