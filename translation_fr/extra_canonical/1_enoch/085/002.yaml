base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: fr
  text: 'Hénoch éleva la voix et dit à son fils Mathusalem : « C’est à toi que je parle, mon fils. Écoute mes paroles et prête l’oreille à la vision du rêve de ton père[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la vision d’un rêve ». L’expression guèze associe le langage de la vision à celui du rêve.
    reason: lexical_alternative
lexical_decisions:
- source_word: አንሥአ
  choice: éleva la voix
  rationale: Le verbe signifie littéralement « lever, élever ». Dans cette formule introduisant une parole solennelle, « éleva la voix » rend naturellement en français le verbe employé sans aplatir le registre.
- source_word: ወይቤ
  choice: dit
  rationale: Verbe narratif courant et transparent pour introduire le discours direct.
- source_word: ለወልዱ ማቱሳላ
  choice: à son fils Mathusalem
  rationale: Rend explicitement le destinataire et suit la forme française traditionnelle et largement reconnue du nom.
- source_word: ለከ እብለከ
  choice: C’est à toi que je parle
  rationale: La construction emphatique place le destinataire au premier plan ; la tournure clivée française conserve cette insistance tout en restant naturelle.
- source_word: ወልድየ
  choice: mon fils
  rationale: Conserve le vocatif familial, à la fois affectueux et chargé d’autorité, sans archaïsme ajouté.
- source_word: ስማዕ ነገርየ
  choice: Écoute mes paroles
  rationale: « Écoute » exprime ici l’attention demandée plus naturellement que le littéral « entends », tandis que « mes paroles » convient à l’introduction d’une révélation.
- source_word: አጽንን እዝነከ
  choice: tends l’oreille
  rationale: Préserve l’image corporelle de l’oreille orientée avec attention, dans une expression française actuelle et digne.
- source_word: ለርእየ ሕልመ
  choice: à la vision du rêve
  rationale: Conserve conjointement le vocabulaire de la vision et celui du rêve, sans réduire l’expérience à un simple rêve ni imposer une interprétation plus précise que le texte.
- source_word: አቡከ
  choice: de ton père
  rationale: Conserve la relation génitive et l’auto-désignation indirecte d’Hénoch comme père de Mathusalem.
theological_decisions:
- issue: Rapport entre la vision et le rêve dans ርእየ ሕልመ
  choice: la vision du rêve
  alternative: la vision d’un rêve ; le rêve-vision
  rationale: Le texte associe le langage de la vision à celui du rêve. La formulation retenue garde les deux éléments ainsi que leur tension, sans ramener le passage à un rêve ordinaire ni créer un terme technique absent de la source.
translation_notes:
  register: Français international moderne, clair et digne. Le discours garde une cadence solennelle sans employer de formes vieillies. Le marqueur [a] est placé sur l’expression qu’il explique.
