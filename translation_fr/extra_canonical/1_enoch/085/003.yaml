base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: fr
  text: 'Avant que je prenne ta mère Edna, je vis, dans une vision, sur ma couche : voici, un taureau sortit de terre, et ce taureau était blanc. Après lui sortit une génisse, et avec elle sortirent deux taureaux[a] : l’un était noir et l’autre rouge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’imagerie animale est symbolique dans les Visions des songes. La traduction conserve les figures propres à la vision sans les identifier dans le texte principal.
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: Avant que je prenne ta mère Edna
  rationale: Rend explicitement la proposition temporelle omise dans une ancienne version. « Prendre » conserve la formulation relationnelle du texte sans préciser davantage sa portée matrimoniale.
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: je vis, dans une vision sur ma couche
  rationale: Conserve à la fois le verbe de perception, le terme apocalyptique « vision » et le cadre de la couche ou du sommeil, sans remplacer la vision par une simple perception visuelle.
- source_word: ላህም
  choice: taureau
  rationale: Le bovin est présenté comme mâle et s’oppose à la génisse qui apparaît ensuite. « Taureau » préserve cette distinction dans l’imagerie animale.
- source_word: ወፅአ፡ እምድር
  choice: sortit de terre
  rationale: Expression française naturelle qui garde le mouvement d’émergence depuis la terre.
- source_word: ጸዓዳ
  choice: blanc
  rationale: Rendu direct du terme de couleur, important pour les contrastes symboliques du récit.
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: une génisse
  rationale: La séquence désigne un seul jeune bovin femelle. « Génisse » est précis, courant et cohérent avec l’imagerie.
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: avec elle sortirent deux jeunes taureaux
  rationale: Préserve le lien syntaxique avec la génisse et le nombre deux. « Jeunes taureaux » rend le terme apparenté désignant ici des bovins mâles sans les confondre avec le premier taureau.
- source_word: ጸሊመ
  choice: noir
  rationale: Rendu simple et exact du contraste chromatique.
- source_word: ቀይሐ
  choice: rouge
  rationale: Rendu transparent du terme de couleur, sans atténuer le contraste symbolique.
theological_decisions:
- issue: Symbolisme animal dans les Visions des songes
  choice: Conserver dans le texte principal les animaux et leurs couleurs tels qu’ils apparaissent dans la vision.
  alternative: Remplacer les figures animales par les personnages humains qu’elles peuvent symboliser.
  rationale: Le passage communique au moyen d’une imagerie apocalyptique soutenue. Identifier les figures dans la traduction elle-même supprimerait la tension symbolique et introduirait une interprétation.
translation_notes:
  register: Français international moderne, digne et narratif. Le présentatif « ceci » remplace un calque lourd de « voici » après la proposition de vision. « Sur ma couche » garde la coloration ancienne et visionnaire du cadre tout en restant intelligible. Le marqueur [a] est placé immédiatement après le groupe animal concerné.
