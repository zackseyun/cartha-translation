base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/001.yaml
  text: And after this I saw another dream[a], and I will show you the whole dream[b], my son.
translation:
  language: fr
  text: Après cela, je vis un autre rêve, et je te montrerai le rêve tout entier[a], mon fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque rêve ». L’expression guèze peut désigner l’intégralité de ce rêve précis ou, selon une lecture distributive, chacun des rêves de la série.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Après cela
  rationale: Formule de transition temporelle naturelle en français moderne, qui conserve la cadence du récit visionnaire.
- source_word: ካልአ ሕለመ
  choice: un autre rêve
  rationale: Le terme ካልአ distingue ce rêve du précédent; « un autre rêve » est ici plus naturel que « un second rêve ».
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend directement le compte rendu visionnaire à la première personne tout en maintenant un registre narratif digne.
- source_word: ኵሎ ሕልመ
  choice: le rêve tout entier
  rationale: Le syntagme renvoie vraisemblablement au rêve singulier qui vient d’être introduit et en souligne l’intégralité.
- source_word: አርእየከ
  choice: je te montrerai
  rationale: Conserve la valeur causative et visuelle du verbe, plutôt que de l’aplatir en « raconter ».
- source_word: ወልድየ
  choice: mon fils
  rationale: Préserve l’adresse filiale directe et intime.
theological_decisions:
- issue: Portée de ኵሎ ሕልመ
  choice: le rêve tout entier
  alternative: chaque rêve
  rationale: Le singulier ሕልመ et son antécédent immédiat, « un autre rêve », favorisent une lecture collective portant sur l’intégralité de ce rêve précis. La note conserve néanmoins la possibilité d’une lecture distributive.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la narration littéraire sans archaïsme marqué; le tutoiement correspond à l’adresse d’un père à son fils.
