  text: And that black heifer grew up[b][a], and she came
translation:
  language: fr
  text: Et cette génisse noire[a] grandit, puis elle vint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeune vache noire ». Le terme désigne un jeune bovin; le verbe qui suit est au féminin.
