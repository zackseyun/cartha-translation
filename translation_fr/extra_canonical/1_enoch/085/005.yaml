lexical_decisions:
- source_word: ወዝኩ
  choice: Et cette
  rationale: Le groupe est démonstratif (« et cette/celle-là »), non une formule de perception telle que « je vis ».
- source_word: ጸሊም
  choice: noire
  rationale: L’adjectif exprime directement la couleur noire et conserve le symbolisme visuel du récit.
- source_word: ጣዕዋ
  choice: génisse
  rationale: Le terme désigne un jeune bovin. « Génisse » rend naturellement le genre féminin indiqué ensuite par la forme verbale, sans réduire l’image à un bovin mâle.
- source_word: ላህቀ
  choice: grandit
  rationale: Il s’agit d’un verbe exprimant la croissance ou le fait de devenir grand.
- source_word: ወመጽአት
  choice: puis elle vint
  rationale: La forme verbale signifie « et elle vint ». « Puis » restitue naturellement en français la succession narrative portée par la coordination guèze, tandis que « elle » en conserve explicitement le féminin.
theological_decisions:
- issue: Imagerie animale symbolique de l’Apocalypse des animaux
  choice: Conserver l’image concrète de la génisse noire.
  alternative: Remplacer l’animal par le peuple ou le personnage historique qu’il pourrait symboliser.
  rationale: La traduction doit préserver l’image énigmatique de la vision sans imposer dans le texte une identification interprétative.
translation_notes:
  register: Français moderne, sobre et digne. La brièveté ainsi que l’enchaînement rapide de la vision sont conservés; « puis » évite une répétition pesante de « et » sans ajouter d’interprétation.
