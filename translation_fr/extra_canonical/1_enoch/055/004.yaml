translation:
  language: fr
  text: Ô rois et puissants, vous qui demeurez[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin éthiopien fourni paraît incomplet ou elliptique. Le verbe peut aussi se traduire par « campez », « logez » ou « restez »; le contexte plus large pourrait supposer un lieu qui n’est pas exprimé ici.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « Ô rois et puissants, vous qui campez [là]. »'
    reason: previous_rendering
lexical_decisions:
- source_word: ነገሥት
  choice: rois
  rationale: Pluriel courant signifiant « rois » ou « dirigeants ». Sans article et avec le verbe à la deuxième personne du pluriel, le mot est compris ici comme un vocatif.
- source_word: ኃያላን
  choice: puissants
  rationale: Dans ce contexte de jugement apocalyptique, le terme désigne des personnes de pouvoir plutôt que des hommes simplement forts physiquement.
- source_word: እለ
  choice: vous qui
  rationale: Le marqueur relatif introduit la proposition verbale; « vous qui » rend naturellement en français l’adresse directe confirmée par la deuxième personne du pluriel.
- source_word: ትኃድሩ
  choice: demeurez
  rationale: Cette forme est à la deuxième personne du pluriel. Le verbe peut évoquer le fait de demeurer, loger ou camper; « demeurez » reste le choix français le moins spécifique sans complément de lieu explicite.
theological_decisions:
- issue: Témoin incomplet ou formulation elliptique
  choice: Traduire seulement la proposition conservée et signaler l’absence possible d’un complément de lieu.
  alternative: Ô rois et puissants, vous qui campez [là]
  rationale: Le texte guèze fourni ne constitue apparemment pas une phrase complète. La traduction n’ajoute donc ni lieu ni déclaration de jugement absents du témoin.
- issue: Adresse directe ou description à la troisième personne
  choice: 'Adresse directe: « Ô rois et puissants, vous qui demeurez »'
  alternative: Les rois et les puissants qui demeurent
  rationale: La forme verbale ትኃድሩ est une deuxième personne du pluriel; le vocatif préserve cette donnée grammaticale et évite de transformer l’adresse en description.
translation_notes:
  register: Français international moderne, digne et accessible. « Ô » marque clairement le vocatif solennel sans alourdir la phrase. La formulation demeure volontairement inachevée afin de refléter l’état du témoin.
