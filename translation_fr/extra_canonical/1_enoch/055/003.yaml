  source_fidelity: 'Le texte rend avec justesse la double action du passage : la remise des personnes aux anges, puis l’établissement direct du châtiment et de la colère divins sur elles. « Quand j’ai voulu … je ferai » conserve volontairement la tension temporelle du guèze, sans la résoudre par une harmonisation interprétative. « Dieu, le Seigneur des esprits » distingue correctement እግዚአብሔር de እግዚአ መናፈስት.'
  naturalness: Le français est moderne, clair et d’un registre apocalyptique sobre. « Les livrer entre les mains des anges » est une formulation française naturelle qui conserve l’image judiciaire de la main, même si le guèze emploie formellement le singulier. « Je ferai demeurer sur eux » est soutenu mais lisible et exprime bien la permanence du jugement.
  terminology: « Détresse et souffrance », « châtiment », « colère » et « Seigneur des esprits » sont des choix exacts, cohérents et non confessionnellement surinterprétés. Le titre divin est traduit de façon transparente et la distinction lexicale entre « Dieu » et « Seigneur » est respectée.
