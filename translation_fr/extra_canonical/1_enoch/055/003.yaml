base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: fr
  text: Quand j’ai voulu les livrer entre les mains des anges, au jour de la détresse et de la souffrance[a], je ferai demeurer sur eux mon châtiment et ma colère, dit Dieu, le Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze est difficile à cet endroit, notamment dans l’enchaînement entre « j’ai voulu les livrer » et « je ferai demeurer ». Le sens paraît passer de la remise aux anges à l’établissement du jugement divin sur eux.
    reason: textual_variant
lexical_decisions:
- source_word: ፈቀድኩ
  choice: j’ai voulu
  rationale: Le verbe exprime la volonté ou l’intention sans imposer l’idée plus formelle d’un décret.
- source_word: አጽንዖሙ በእደ መላእክት
  choice: les livrer entre les mains des anges
  rationale: Cette formulation rend le transfert sous l’autorité des anges et conserve en français l’image judiciaire de la main.
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: au jour de la détresse et de la souffrance
  rationale: Les deux noms désignent une épreuve sévère; cette paire reste naturelle en français tout en maintenant le registre apocalyptique.
- source_word: መቅሠፍተየ
  choice: mon châtiment
  rationale: Le terme peut désigner un coup, un fléau ou une affliction punitive; « châtiment » préserve ici sa portée judiciaire sans préciser indûment sa forme.
- source_word: መዐትየ
  choice: ma colère
  rationale: « Colère » exprime clairement la colère divine dans un français moderne et digne, sans archaïsme inutile.
- source_word: አኃድር ዲቤሆሙ
  choice: je ferai demeurer sur eux
  rationale: Le causatif évoque le fait de faire s’établir ou demeurer quelque chose sur eux; l’image d’un jugement persistant est ainsi conservée.
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: Dieu, le Seigneur des esprits
  rationale: 'Les deux expressions guèzes sont distinguées: la première est le terme usuel pour Dieu, la seconde le titre « Seigneur des esprits ».'
theological_decisions:
- issue: Médiation des anges dans l’action judiciaire divine
  choice: Dieu livre les condamnés entre les mains des anges, puis fait demeurer sur eux son propre châtiment et sa colère.
  alternative: Les anges constitueraient eux-mêmes le châtiment, ou la détresse serait indépendante de la colère divine.
  rationale: La syntaxe distingue la médiation des anges de l’action attribuée directement à Dieu; la traduction maintient ces deux niveaux d’action sans les confondre.
- issue: Relation syntaxique entre la proposition temporelle et l’annonce du jugement
  choice: 'Conserver l’enchaînement difficile: « Quand j’ai voulu… je ferai… »'
  alternative: « Lorsque je déciderai de les livrer… je ferai… » ou « Après les avoir livrés… »
  rationale: Le texte source présente une tension de temps et une transition incertaine. La normaliser effacerait une ambiguïté réelle; une note la signale donc explicitement.
translation_notes:
  register: Français international moderne, digne et lisible. Le registre apocalyptique est maintenu sans archaïsmes marqués. L’expression imagée « entre les mains » et le titre « Seigneur des esprits » sont conservés pour leur portée biblique et judiciaire.
