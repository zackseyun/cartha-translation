base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: fr
  text: 'Après cela, la Tête des jours se repentit[a] et dit : « C’est en vain que j’ai détruit tous ceux qui habitent sur la terre ferme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revint sur sa décision » ou « regretta ». Le verbe guèze peut désigner un revirement ou un regret ; avec un sujet divin, sa nuance n’est pas nécessairement aussi morale que le français « se repentir » peut le suggérer.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Après cela
  rationale: Cette formule temporelle marque naturellement la succession du récit apocalyptique.
- source_word: ነሥሐ
  choice: se repentit
  rationale: Le verbe guèze peut exprimer le repentir, le regret ou un changement de décision. La traduction littérale conserve ici l’expression anthropopathique frappante du texte.
- source_word: ርእሰ መዋዕል
  choice: la Tête des jours
  rationale: Ce calque transparent des deux éléments guèzes conserve le titre apocalyptique particulier sans l’assimiler à un autre titre biblique.
- source_word: ሕኵፖልክዎሙ
  choice: j’ai détruit
  rationale: Cette formulation rend directement l’action destructrice et son objet pluriel, sans ajouter de précision interprétative.
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: tous ceux qui habitent
  rationale: La traduction maintient à la fois la totalité explicitement exprimée et l’idée d’une habitation continue.
- source_word: ውስተ የብስ
  choice: sur la terre ferme
  rationale: Le nom guèze désigne plus précisément la terre sèche ou ferme que la terre au sens général, ce qui peut évoquer le contexte du déluge.
theological_decisions:
- issue: Faut-il atténuer le verbe ነሥሐ lorsqu’il a pour sujet la Tête des jours ?
  choice: se repentit
  alternative: revint sur sa décision ; regretta
  rationale: Le texte source emploie une expression anthropopathique théologiquement tendue. Le corps du texte conserve cette tension, tandis que la note signale les nuances moins moralement marquées que le verbe peut aussi porter.
translation_notes:
  register: Français international actuel, sobre et digne. Le titre inhabituel « la Tête des jours » est volontairement conservé, et la syntaxe de la parole directe reste naturelle pour un lectorat moderne.
