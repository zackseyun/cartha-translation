base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: fr
  text: Il jura par son grand nom que, désormais, il ne ferait plus ainsi à tous ceux qui habitent la terre ferme. « Je placerai un signe dans les cieux[a], et il constituera entre eux et moi un gage de fidélité[b] pour toujours, aussi longtemps que les jours du ciel seront au-dessus de la terre. » Et cela est conforme à mon ordre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce « signe dans les cieux » évoque probablement la tradition du signe donné après le déluge, mais le verset ne précise pas de quel signe il s’agit.
    reason: cross_reference
  - marker: b
    text: Le nom traduit par « gage de fidélité » peut aussi signifier plus largement « fidélité », « foi » ou « confiance » ; dans ce contexte, il peut prendre une portée proche de celle d’un engagement d’alliance.
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « Cela est sur mon ordre » ou « Tel est mon décret ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ
  choice: il jura
  rationale: Le verbe désigne l’action de prêter serment. « Il jura » est direct, naturel et conserve la solennité de la déclaration.
- source_word: በስሙ፡ ዐቢይ
  choice: par son grand nom
  rationale: Cette formulation rend littéralement la formule de serment et en préserve la portée révérencielle.
- source_word: እምይእዜ
  choice: désormais
  rationale: Ce terme français actuel exprime clairement le point de départ temporel et sa prolongation dans l’avenir.
- source_word: ኢይገብር፡ ከመዝ
  choice: il n’agirait plus ainsi
  rationale: La formulation préserve le caractère anaphorique et n’explicite pas une action que le verset lui-même ne nomme pas.
- source_word: ለኵሎሙ፡ እለ፡ ይነብሩ፡ ዲበ፡ የብስ
  choice: envers tous ceux qui habitent la terre ferme
  rationale: « Terre ferme » conserve le sens précis de የብስ, la terre sèche, et son écho possible au contexte du déluge.
- source_word: ትእምርተ
  choice: un signe
  rationale: « Signe » est le terme français le plus naturel pour un indicateur visible porteur de sens, sans en préciser abusivement la nature.
- source_word: እወዲ፡ በሰማያት
  choice: je placerai dans les cieux
  rationale: Le futur s’accorde au contexte déclaratif; « dans les cieux » conserve le pluriel formel de la source.
- source_word: ማእከሌየ፡ ወማእከሌሆሙ
  choice: entre eux et moi
  rationale: Cette tournure française idiomatique rend fidèlement la relation établie entre les deux parties.
- source_word: ሃይማኖተ
  choice: un gage de fidélité
  rationale: Le nom peut exprimer la foi, la confiance ou la fidélité. Dans ce contexte de serment et de signe, « gage de fidélité » traduit sa portée relationnelle sans introduire explicitement le mot « alliance ».
- source_word: እስከ፡ ለዓለም፡ መጠነ፡ መዋዕለ፡ ሰማይ፡ ዲበ፡ ምድር
  choice: pour toujours, aussi longtemps que les jours du ciel seront au-dessus de la terre
  rationale: La traduction maintient la formule poétique de durée au lieu de la réduire à un simple adverbe.
- source_word: ዝ፡ በትእዛዝየ፡ ውእቱ
  choice: cela se fera sur mon ordre
  rationale: Cette formulation française naturelle exprime l’autorité du commandement divin tout en gardant la valeur démonstrative de « cela ».
theological_decisions:
- issue: Faut-il employer explicitement le vocabulaire de l’alliance pour le signe céleste ?
  choice: « un gage de fidélité entre eux et moi »
  alternative: « une alliance entre eux et moi »
  rationale: Le guèze emploie ሃይማኖተ, associé à la foi, à la confiance ou à la fidélité, plutôt qu’un terme d’alliance sans équivoque. La traduction conserve donc la résonance d’alliance sans l’imposer.
- issue: Faut-il identifier le signe céleste comme l’arc-en-ciel ?
  choice: Le signe reste anonyme dans le texte principal.
  alternative: « l’arc-en-ciel dans les cieux »
  rationale: Le contexte évoque vraisemblablement la tradition du signe donné après le déluge, mais le témoin guèze dit seulement « un signe ». Le nommer irait au-delà de ce verset.
- issue: Référence de la formule finale
  choice: La note [c] porte sur « sur mon ordre ».
  alternative: Rattacher l’incertitude à la formule de durée précédente.
  rationale: L’ambiguïté lexicale signalée concerne በትእዛዝየ, qui peut être rendu par « sur mon ordre », « selon mon ordonnance » ou « par mon décret ».
translation_notes:
  register: Français international moderne, digne et accessible. Le passage du récit à la parole directe (« il jura… Je placerai »), présent dans la source, est conservé. « Terre ferme » maintient l’image de la terre sèche; « les jours du ciel » préserve la formule apocalyptique inhabituelle. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal et correspondent précisément aux notes.
