base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: fr
  text: Il sera un bâton pour les justes, afin qu’ils puissent s’appuyer sur lui sans tomber. Il sera la lumière des nations[a] et l’espérance de ceux dont le cœur souffre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « une lumière pour les nations ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression évoque « ceux qui souffrent ou sont malades dans leur cœur » ; elle désigne ici une détresse intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: bâton
  rationale: Le nom désigne couramment un bâton ou une verge. Le contexte précise que les justes s’appuient sur lui pour ne pas tomber ; « bâton » conserve donc l’image concrète du soutien sans introduire la nuance royale de « sceptre ».
- source_word: ለጻድቃን
  choice: pour les justes
  rationale: « Les justes » rend naturellement ce terme collectif dans un contexte apocalyptique.
- source_word: ይትመረጐዙ
  choice: puissent s’appuyer sur lui
  rationale: Cette formulation française garde l’image physique et métaphorique du soutien, confirmée par la proposition « sans tomber ».
- source_word: ወኢይደቁ
  choice: sans tomber
  rationale: La tournure exprime clairement le résultat recherché tout en prolongeant l’image du bâton ; elle rend naturellement la coordination négative en français.
- source_word: ብርሃነ አሕዛብ
  choice: la lumière des nations
  rationale: Cette traduction suit directement la construction génitivale. « Nations » convient mieux que « païens » à la portée collective et cosmique du passage.
- source_word: ተስፋ
  choice: l’espérance
  rationale: « Espérance » restitue la force eschatologique et consolatrice du terme dans un registre biblique moderne et accessible.
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: de ceux dont le cœur souffre
  rationale: Le verbe peut évoquer la souffrance ou la maladie. Cette formulation préserve le langage du cœur et l’idée d’une détresse intérieure sans la réduire à une pathologie physique.
theological_decisions:
- issue: Référent du pronom répété ውእቱ
  choice: Employer « il » en renvoyant à la figure singulière de l’Élu / du Fils de l’homme dans le contexte immédiat.
  alternative: Répéter « celui-ci » ou laisser le sujet plus implicite.
  rationale: Le guèze emploie une forme démonstrative ou pronominale, mais le français exige ici un renvoi personnel fluide. « Il » respecte le contexte immédiat sans ajouter de formulation doctrinale postérieure.
- issue: Valeur de ይከውን et ellipse verbale dans la proposition médiane
  choice: Traduire par « sera » et le reprendre dans la proposition sur la lumière.
  alternative: Traduire par « deviendra » ou conserver une proposition nominale elliptique.
  rationale: « Sera » convient aux désignations eschatologiques et évite de suggérer un changement d’identité non exigé par le texte. La répétition donne une phrase française claire sans modifier la relation entre les affirmations.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde les trois affirmations parallèles et l’image concrète du bâton. Les notes ne signalent que les ambiguïtés lexicales réelles du guèze.
