base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: fr
  text: Et je les livrerai entre les mains de ceux que j’ai choisis[a] ; comme la paille dans le feu, ainsi ils brûleront devant les saints[b] ; comme le plomb dans l’eau, ils s’enfonceront devant les justes, et l’on ne trouvera aucune trace d’eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre les mains de mes choisis » ; cette expression peut signifier qu’ils seront livrés à leur pouvoir lors du jugement.'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « paille » peut aussi désigner du chaume.
    reason: lexical_alternative
  - marker: c
    text: Autrement dit, il ne restera d’eux aucun signe ni vestige.
    reason: lexical_clarification
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለ*ኅሩያን፡ ዚአየ
  choice: entre les mains de ceux que j’ai choisis
  rationale: La formulation conserve l’image concrète des « mains » et analyse correctement ዚአየ comme le possessif « mes ». « Ceux que j’ai choisis » exprime naturellement en français le groupe désigné sans introduire le vocabulaire doctrinal plus marqué d’« élus ».
- source_word: እወድዮሙ
  choice: je les livrerai
  rationale: La forme est comprise comme un imparfait à la première personne du singulier avec un objet pluriel. « Livrer » convient au contexte judiciaire et à la construction avec « entre les mains ».
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት፡ ከመዝ፡ ይውዕዩ
  choice: comme la paille dans le feu, ainsi ils brûleront
  rationale: La corrélation « comme… ainsi » rend ከመ…ከመዝ et le futur français traduit la valeur prospective de l’imparfait éthiopien dans ce contexte eschatologique.
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: devant les saints
  rationale: « Devant » rend naturellement l’idiome littéral « de devant la face de » tout en conservant l’idée de présence. « Les saints » maintient la désignation collective sans déterminer s’il s’agit d’êtres célestes ou humains.
- source_word: ዐረር፡ ውስተ፡ ማይ
  choice: le plomb dans l’eau
  rationale: Le métal précis est conservé afin de préserver l’image de lourdeur et d’enfoncement rapide.
- source_word: ይሠጠሙ
  choice: ils s’enfonceront
  rationale: Le verbe exprime l’action de sombrer ou d’être submergé. « S’enfoncer » est idiomatique avec le plomb dans l’eau et ne suggère pas nécessairement une noyade humaine.
- source_word: ጻድቃን
  choice: les justes
  rationale: « Les justes » est une désignation collective claire et traditionnelle en français biblique, tout en restant compréhensible aujourd’hui.
- source_word: ወኢይትረከብ፡ ሎሙ፡ አሰር
  choice: et l’on ne trouvera plus aucune trace d’eux
  rationale: Cette tournure française exprime naturellement l’absence complète de vestige. « Plus » explicite le résultat final de la disparition sans ajouter l’idée distincte d’un reste survivant.
theological_decisions:
- issue: Portée judiciaire de l’expression « entre les mains »
  choice: 'Conserver l’image concrète : « entre les mains de ceux que j’ai choisis »'
  alternative: « au pouvoir de ceux que j’ai choisis »
  rationale: Le contexte suggère une remise au pouvoir des choisis pour le jugement, mais le texte emploie l’image des mains. La traduction ne transforme donc pas cette implication en interprétation explicite.
- issue: Identité des « saints » et des « justes »
  choice: Maintenir les deux désignations distinctes sans les identifier
  alternative: Les présenter comme un seul groupe, ou identifier les saints aux anges et les justes aux humains
  rationale: Le parallélisme rapproche les deux groupes, mais le verset ne précise ni leur identité exacte ni leur relation. La traduction préserve cette tension.
- issue: Temps des actes de jugement
  choice: 'Employer le futur : « livrerai », « brûleront », « s’enfonceront », « trouvera »'
  alternative: Employer le passé comme compte rendu d’une vision déjà observée
  rationale: Les formes verbales sont des imparfaits éthiopiens et le contexte décrit un jugement eschatologique à venir. Le futur évite en outre l’ancienne lecture erronée de ዚአየ comme « j’ai vu ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. Le rythme parallèle des deux comparaisons est conservé. Les termes collectifs restent sobres et n’imposent aucune identification confessionnelle.
