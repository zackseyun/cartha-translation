base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: fr
  text: En ces jours-là, les rois de la terre et les puissants qui possèdent la terre ferme auront le visage abattu[a], à cause des œuvres de leurs mains[b] ; car, au jour de leur détresse et de leur affliction, ils ne se sauveront pas eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze transmis est comprimé et probablement altéré à cet endroit. On peut aussi traduire : « leurs visages seront abaissés ». Le sens général est que les rois et les puissants auront le visage abattu ou seront humiliés.'
    reason: textual_and_syntactic_uncertainty
  - marker: b
    text: L’expression « œuvres de leurs mains » désigne largement leurs actes ; elle peut aussi faire écho à une puissance qu’ils ont eux-mêmes édifiée, voire aux idoles, sans l’affirmer explicitement.
    reason: cultural_note
lexical_decisions:
- source_word: በዝንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique courante, rendue naturellement en français.
- source_word: ክኑ፡ ትሑታነ፡ ገጽ
  choice: auront le visage abattu
  rationale: Le texte transmis semble refléter une forme corrompue ou abrégée de « ils deviendront » suivie du prédicat « abattus de visage ». Cette formulation française conserve l’image du visage sans faire des « humbles » un groupe distinct.
- source_word: ነገሥተ፡ ምድር
  choice: les rois de la terre
  rationale: Expression apocalyptique désignant les souverains terrestres, avec une portée plus large que « pays ».
- source_word: ጽኑዓን
  choice: les puissants
  rationale: Désigne ici des personnes investies de force et de pouvoir, parallèlement aux rois.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: qui possèdent la terre ferme
  rationale: Le verbe exprime l’idée de tenir ou posséder, tandis que የብስ désigne littéralement la terre sèche ou ferme.
- source_word: በእንተ፡ ምግባረ፡ እደዊሆሙ
  choice: à cause des œuvres de leurs mains
  rationale: Conserve l’idiome biblique relatif aux actes humains et ses possibles résonances, sans le réduire explicitement à l’idolâtrie.
- source_word: በዕለተ፡ ጻዕቆሙ፡ ወጻሕቦሙ
  choice: au jour de leur détresse et de leur affliction
  rationale: Préserve le doublet intensif qui décrit leur souffrance au moment du jugement.
- source_word: ኢይድኅኑ፡ ርእሶሙ
  choice: ils ne pourront pas se sauver eux-mêmes
  rationale: Rend clairement la construction réflexive et l’incapacité effective exprimée dans le contexte.
theological_decisions:
- issue: Rapport entre l’expression concernant le visage et les rois et puissants
  choice: 'L’expression décrit l’état futur des rois et des puissants : ils auront le visage abattu.'
  alternative: « les humbles de visage » constituerait un groupe distinct, ou « les visages des rois… seront humiliés ».
  rationale: La syntaxe la plus probable, compte tenu de la restitution de ክኑ comme forme altérée de ይከውኑ, fait des rois et des puissants le sujet et de « visage abattu » le prédicat. La note maintient toutefois l’incertitude du témoin transmis.
- issue: Portée des « œuvres de leurs mains »
  choice: Maintenir l’expression générale.
  alternative: Préciser qu’il s’agit de leurs idoles ou de leur pouvoir fabriqué par eux-mêmes.
  rationale: L’expression peut évoquer l’idolâtrie ou une puissance humaine auto-construite, mais le guèze ne commande pas cette restriction.
translation_notes:
  register: Français international moderne, digne et lisible. L’image concrète du visage et celle de la terre ferme sont conservées, tandis que la syntaxe est rendue naturellement. Les notes sont limitées aux ambiguïtés textuelles et sémantiques substantielles.
