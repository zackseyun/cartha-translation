base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: fr
  text: Tous ceux qui habitent sur la terre ferme[a] tomberont et se prosterneront devant lui ; ils le loueront, le béniront et chanteront au Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ». Le guèze dit plus littéralement « sur la terre ferme » ou « sur le sol sec ».
    reason: Alternative lexicale signalant la formulation concrète du texte source.
lexical_decisions:
- source_word: ይወድቁ
  choice: tomberont
  rationale: Conserve le geste physique de chute exprimant la soumission ou la révérence, sans le confondre avec le verbe suivant.
- source_word: ይሰግዱ
  choice: se prosterneront
  rationale: Rend explicitement le geste corporel de révérence et complète naturellement « tomberont ».
- source_word: ቅድሜሁ
  choice: devant lui
  rationale: Traduction spatiale directe, naturelle dans la scène visionnaire, qui maintient le pronom masculin singulier.
- source_word: ኵሎሙ
  choice: Tous
  rationale: Préserve la portée universelle de l’énoncé.
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: ceux qui habitent sur la terre ferme
  rationale: « Terre ferme » conserve le sens concret de የብስ, plutôt que de généraliser immédiatement en « terre » ou « monde ».
- source_word: ይሴብሕዎ
  choice: ils le loueront
  rationale: Le suffixe objet masculin singulier est conservé explicitement avec « le ».
- source_word: ይባርክዎ
  choice: le béniront
  rationale: Maintient à la fois le langage de bénédiction et le suffixe objet masculin singulier.
- source_word: ይዜምሩ
  choice: chanteront pour
  rationale: Rend l’action de chanter et la préposition introduisant le destinataire, sans ajouter un objet pronominal absent de cette forme verbale.
- source_word: ለእግዚአ መናፈስት
  choice: pour le Seigneur des esprits
  rationale: Conserve le titre divin récurrent et traduit la préposition ለ par une tournure française naturelle avec « chanter ».
theological_decisions:
- issue: Référent des pronoms masculins avant le titre divin final
  choice: Conserver « lui / le » pour la figure exaltée du contexte immédiat, puis nommer distinctement « le Seigneur des esprits » comme destinataire du chant.
  alternative: Comprendre tous les pronoms et le titre final comme désignant sans distinction une seule et même figure.
  rationale: Le guèze juxtapose des suffixes masculins singuliers et le titre explicite « Seigneur des esprits ». La traduction préserve cette tension sans fusionner ni séparer davantage les référents.
translation_notes:
  register: Français moderne, international et digne. Le futur conserve la portée visionnaire. « Se prosterneront » évite l’ambiguïté de « s’inclineront » tout en maintenant le geste corporel ; la ponctuation distingue les deux mouvements de la scène sans résoudre leur tension référentielle.
