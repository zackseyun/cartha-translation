  naturalness: Le français est soutenu, clair et naturel. Le passé simple convient au récit visionnaire. La substitution de « y burent » par « en burent » améliore à la fois la précision et l’idiomaticité. « Les justes, les saints et les choisis » conserve une triade fluide ; « saints » est ici recevable au sens descriptif de « saints/êtres saints », sans imposer une lecture ecclésiale.
  terminology: « Source », « justice », « sagesse », « justes » et « choisis » sont cohérents et appropriés. « Inépuisable » rend bien l’idée d’une abondance non mesurable ou non épuisable. La note sur le passage difficile doit également reconnaître que la forme verbale exprime l’action d’entourer, et non seulement une localisation statique.
