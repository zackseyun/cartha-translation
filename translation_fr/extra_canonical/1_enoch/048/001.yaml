base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: fr
  text: En ce lieu, je vis la source de la justice, qui était inépuisable[a], et de nombreuses sources de sagesse l’entouraient[b]. Tous ceux qui avaient soif en burent et furent remplis de sagesse, et leur demeure était avec les justes, les saints[c] et les choisis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi évoquer une source « sans mesure » ou « qu’on ne peut épuiser ».
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien est difficile à cet endroit et présente une répétition de formes liées à l’idée d’entourer ; le sens probable est que de nombreuses sources de sagesse entouraient la source de la justice.
    reason: textual_variant
  - marker: c
    text: Ou « les êtres saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: lieu
  rationale: Terme locatif courant ; « lieu » convient au cadre visionnaire sans préciser davantage sa nature.
- source_word: ነቅዐ / አንቅዕተ
  choice: source / sources
  rationale: Ces termes désignent des points d’où jaillit l’eau. « Source » maintient l’image cohérente entre le singulier et le pluriel et permet naturellement l’idée de boire.
- source_word: ጽድቅ
  choice: justice
  rationale: « Justice » est l’équivalent français naturel de ce terme moral et eschatologique ; le contexte conserve aussi sa dimension de rectitude.
- source_word: ዘኢይትኄለቍ
  choice: inépuisable
  rationale: Dans le contexte d’une source, ce choix exprime l’abondance qui ne peut être épuisée ou mesurée, plutôt qu’une simple absence de défaillance.
- source_word: አውዳ፡ የአውዳ
  choice: l’entouraient
  rationale: Le passage difficile comporte à la fois une idée de position alentour et une forme verbale active ; cette formulation française restitue le mouvement syntaxique sans alourdir la phrase.
- source_word: ጥበብ
  choice: sagesse
  rationale: Équivalent standard qui préserve l’union, propre à la vision, entre l’imagerie de l’eau et le don sapientiel.
- source_word: ጽሙኣን
  choice: ceux qui avaient soif
  rationale: Formulation française naturelle qui conserve l’image concrète sans l’interpréter explicitement comme une métaphore.
- source_word: ይሰትዩ / ይትመልኡ
  choice: burent / furent remplis
  rationale: Les passés simples inscrivent les actions dans le récit de la vision, tandis que le passif « furent remplis » conserve la sagesse comme contenu reçu.
- source_word: ማኅደሪሆሙ
  choice: leur demeure
  rationale: Exprime un lieu de résidence stable et garde la portée communautaire et eschatologique de la scène.
- source_word: ጻድቃን / ቅዱሳን / ኅሩያን
  choice: les justes, les saints et les choisis
  rationale: Cette triade française distingue les trois désignations parallèles. « Choisis » évite d’imposer au dernier terme la charge doctrinale que peut prendre « élus ».
theological_decisions:
- issue: Interprétation de l’eau comme métaphore spirituelle
  choice: Conserver littéralement la source, la soif, l’action de boire et le fait d’être rempli
  alternative: Expliciter dans le texte qu’il s’agit d’accéder à la justice et à la sagesse
  rationale: La vision associe elle-même l’eau, la justice et la sagesse. L’explicitation réduirait la richesse de l’image apocalyptique.
- issue: Désignation de la triade finale
  choice: les justes, les saints et les choisis
  alternative: les justes, les êtres saints et les élus
  rationale: La traduction maintient trois groupes ou titres en parallèle sans déterminer s’ils désignent des catégories entièrement distinctes ni importer une doctrine particulière de l’élection.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le passé simple convient au récit visionnaire. Les images concrètes et la triade finale sont conservées sans paraphrase doctrinale.
