base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/010.yaml
  text: And on the day of their affliction[b][a], rest shall come upon the earth.
translation:
  language: fr
  text: Et au jour de leur détresse[a], le repos sera sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur affliction » ou « leur épreuve ». Le terme guèze évoque une situation pénible ou une pression; cette brève proposition ne permet pas d’en préciser davantage la nuance.
    reason: lexical_alternative
  - marker: b
    text: Ou « le repos viendra sur la terre ». Le verbe signifie littéralement « être » ou « devenir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: au jour de
  rationale: Rend directement la locution temporelle et conserve le repère apocalyptique solennel.
- source_word: ጻሕበ
  choice: détresse
  rationale: Exprime l’épreuve et la pression sans faire de « tribulation » un terme eschatologique technique.
- source_word: ዚአሆሙ
  choice: leur
  rationale: Rend naturellement en français la forme pronominale génitivale qui renvoie au groupe mentionné dans le contexte.
- source_word: ዕረፍት
  choice: repos
  rationale: Conserve le sens fondamental de cessation ou de repos, sans préciser s’il s’agit du soulagement des justes, de la paix ou d’un apaisement plus général.
- source_word: ትከውን
  choice: sera
  rationale: Reproduit sobrement la valeur future du verbe d’existence ou de devenir, sans lui imposer une nuance de mouvement absente du texte.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Rend la préposition et le nom dans leur portée terrestre générale, naturelle dans ce contexte apocalyptique.
theological_decisions:
- issue: Portée et valeur du « repos »
  choice: Un repos sera sur la terre, sans bénéficiaires explicitement désignés
  alternative: Un soulagement réservé aux justes, la cessation qui suit le jugement, ou la paix dans le pays
  rationale: La proposition est brève et ne précise ni les bénéficiaires ni la nature exacte du repos. La traduction maintient cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe légèrement solennelle « au jour de » et « le repos sera sur la terre » conserve la concision ainsi que la tonalité apocalyptique de l’original.
