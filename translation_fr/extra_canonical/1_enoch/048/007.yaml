base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: fr
  text: Et la sagesse du Seigneur des esprits l’a révélé aux saints et aux justes[a], car ils ont gardé la part des justes[b], puisqu’ils ont haï et méprisé ce monde d’injustice, et qu’ils ont haï toutes ses œuvres et ses voies au nom du Seigneur des esprits. Car c’est par son nom qu’ils sont sauvés[c], et c’est par sa volonté que leur vie est venue à l’existence[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux êtres saints ». Le terme guèze désigne collectivement ceux qui sont consacrés.
    reason: lexical_alternative
  - marker: b
    text: La « part des justes » peut désigner leur portion, leur lot ou leur héritage.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils seront sauvés » ou « ils trouvent la délivrance ». La forme peut exprimer une vérité présente ou générale sans exclure une portée future.
    reason: temporal_ambiguity
  - marker: d
    text: Ou « et par sa volonté leur vie a été établie »; on peut aussi comprendre « par son bon plaisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: l’a révélé
  rationale: Le verbe actif signifie « révéler, dévoiler ». Le pronom objet renvoie naturellement au personnage évoqué dans le contexte précédent, sans le nommer davantage.
- source_word: ቅዱሳን
  choice: les saints
  rationale: Désigne collectivement des personnes consacrées. En français biblique actuel, « les saints » est naturel et n’implique pas ici une canonisation ultérieure.
- source_word: ጻድቃን
  choice: les justes
  rationale: « Les justes » est l’expression française biblique courante pour cette catégorie morale et apocalyptique.
- source_word: ጥበቡ ለእግዚአ መናፍስት
  choice: la sagesse du Seigneur des esprits
  rationale: Le groupe nominal est le sujet du verbe actif et doit être conservé intégralement.
- source_word: ዐቀቡ
  choice: ont gardé
  rationale: Rend simplement l’idée de conserver ou préserver, sans expliciter à tort la nature exacte de la part.
- source_word: ክፍሎሙ ለጻድቃን
  choice: la part des justes
  rationale: « Part » maintient l’ambiguïté entre portion, lot et héritage, tandis que le complément « des justes » suit la formulation de la source.
- source_word: ዘዓመፃ
  choice: d’injustice
  rationale: Caractérise le monde par le mal moral et forme en français un contraste naturel avec « les justes ».
- source_word: ምግባሮ ወፍናዊሁ
  choice: ses œuvres et ses voies
  rationale: Préserve le parallélisme et l’image éthique des conduites et des chemins.
- source_word: በስሙ
  choice: au nom de / par son nom
  rationale: La première occurrence exprime leur opposition menée au nom du Seigneur; la seconde présente son nom comme fondement ou moyen de salut.
- source_word: ይድኅኑ
  choice: ils sont sauvés
  rationale: Le présent permet une lecture générale sans exclure l’accomplissement eschatologique.
- source_word: በፈቃዱ
  choice: par sa volonté
  rationale: Rend directement la volonté ou le dessein divin sans ajouter explicitement une nuance de bienveillance qui demeure possible mais non nécessaire.
- source_word: ኮነ ሕይወቶሙ
  choice: leur vie a pris naissance
  rationale: Rend l’idée que leur vie est venue à l’existence ou a été établie, tout en conservant la dépendance envers la volonté divine.
theological_decisions:
- issue: Référent du pronom objet dans « l’a révélé »
  choice: Conserver le pronom masculin « l’ »
  alternative: Expliciter « le Fils de l’homme » d’après le contexte
  rationale: Le verset emploie un objet pronominal. L’expliciter résoudrait une référence que le texte présent laisse contextuelle.
- issue: Temporalité du salut
  choice: « ils sont sauvés »
  alternative: « ils seront sauvés » ou « ils trouvent la délivrance »
  rationale: Le présent peut exprimer une vérité générale et ne ferme pas la portée eschatologique du passage.
- issue: Sens de la part des justes
  choice: « la part des justes »
  alternative: « leur lot parmi les justes » ou « l’héritage des justes »
  rationale: La formulation choisie conserve la tension entre part attribuée, lot et héritage sans imposer une interprétation précise.
- issue: Portée de la volonté divine dans la dernière proposition
  choice: « par sa volonté que leur vie a pris naissance »
  alternative: « par son bon plaisir leur vie a été établie »
  rationale: La traduction principale reste proche des termes de la source; la note signale l’autre nuance possible sans développer une doctrine particulière.
translation_notes:
  register: Français international moderne, digne et lisible, avec une légère coloration biblique dans « Seigneur des esprits », « les justes », « œuvres » et « voies ». Les ambiguïtés portant sur le pronom révélé, la part des justes, la temporalité du salut et la dernière proposition sont préservées plutôt que résolues.
