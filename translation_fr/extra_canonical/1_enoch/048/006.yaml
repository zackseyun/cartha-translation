base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: fr
  text: C’est pourquoi il fut choisi et tenu caché devant lui, avant que le monde soit créé, et pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression finale peut aussi se traduire plus littéralement par « jusqu’à l’éternité » ou « jusqu’à l’âge »; ici, elle exprime une durée sans fin.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: C’est pourquoi
  rationale: Rend la valeur explicative ou causale de l’expression dans un français naturel et soutenu.
- source_word: ኮነ
  choice: il fut
  rationale: Avec les prédicats qui suivent, le verbe fonctionne ici comme copule; le passé simple convient au registre narratif et solennel.
- source_word: ኅሩየ
  choice: choisi
  rationale: Terme clair et non technique qui exprime la mise à part par décision divine sans importer une terminologie doctrinale ultérieure.
- source_word: ወኅቡአ
  choice: et tenu caché
  rationale: Exprime un état durable de dissimulation ou de réserve plus naturellement que le simple « caché » dans cette construction.
- source_word: በቅድሜሁ
  choice: devant lui
  rationale: Conserve l’image spatiale et relationnelle du guèze ainsi que l’implicite du référent, vraisemblablement Dieu.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: avant que le monde soit créé
  rationale: Marque clairement l’antériorité par rapport à la création, tout en rendant ዓለም par son sens contextuel le plus direct.
- source_word: ወእስከ ለዓለም
  choice: et pour toujours
  rationale: Formulation française idiomatique qui rend la durée indéfinie ou éternelle de l’expression.
theological_decisions:
- issue: Faut-il employer une formulation christologique explicite de préexistence ?
  choice: 'Conserver les termes apocalyptiques locaux : « choisi et tenu caché devant lui, avant que le monde soit créé »'
  alternative: Traduire de manière interprétative par « préexistant auprès de Dieu » ou « prédestiné de toute éternité »
  rationale: Le texte affirme une élection et une dissimulation antérieures à la création, mais il ne formule pas explicitement les catégories doctrinales proposées par ces traductions interprétatives.
- issue: Identification du référent de « lui »
  choice: Maintenir le pronom « lui »
  alternative: Expliciter « devant Dieu » ou « en présence de Dieu »
  rationale: Le contexte indique probablement Dieu, mais le guèze conserve un pronom; la traduction préserve cet implicite et l’image relationnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Devant lui » garde la formulation relationnelle du guèze sans la surinterpréter; la virgule évite que le lecteur rattache « avant que le monde soit créé » uniquement à « lui ».
