base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: fr
  text: Et avant que le soleil et les signes soient créés, avant que les étoiles du ciel soient faites, son nom fut appelé[a] devant le Seigneur des esprits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son nom fut nommé ». Le verbe peut exprimer l’action d’appeler ou de nommer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en présence du Seigneur des esprits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: avant que
  rationale: Dans ces deux propositions suivies de verbes, la locution exprime clairement l’antériorité. La répétition française conserve les deux étapes de la phrase guèze.
- source_word: ትትፈጠር
  choice: soient créés
  rationale: Le passif de création convient au cadre cosmologique. Selon la structure syntaxique du texte, le soleil et les signes forment ensemble le sujet de cette première proposition.
- source_word: ፀሐይ ወታእምር
  choice: le soleil et les signes
  rationale: La conjonction guèze relie « le soleil » et « les signes » avant la limite de proposition marquée par le second « avant »; elle ne rattache donc pas les signes aux étoiles de la proposition suivante.
- source_word: ታእምር
  choice: signes
  rationale: Le mot peut désigner des signes, marques ou présages. « Signes » préserve sa portée céleste et apocalyptique sans en préciser indûment la fonction.
- source_word: ይትገበሩ
  choice: soient faites
  rationale: Le passif maintient le parallélisme avec « soient créés » tout en respectant la différence entre les deux verbes guèzes.
- source_word: ከዋክብተ ሰማይ
  choice: les étoiles du ciel
  rationale: Expression française naturelle et solennelle qui reproduit la relation génitivale du guèze.
- source_word: ስሙ
  choice: son nom
  rationale: Le suffixe est masculin singulier. Le pronom reste implicite quant à son référent, comme dans le texte source.
- source_word: ተጸውዐ
  choice: fut prononcé
  rationale: Le verbe peut exprimer l’action d’appeler ou de nommer. En français, « son nom fut appelé » serait peu naturel; « fut prononcé » conserve l’idée que le nom est énoncé sans imposer exclusivement soit une nomination, soit une invocation.
- source_word: በቅድመ
  choice: devant
  rationale: 'La préposition a ici une valeur spatiale et solennelle: « devant », c’est-à-dire « en présence de ». Elle se distingue ainsi clairement des deux emplois temporels d’« avant ».'
- source_word: እግዚአ መናፈስት
  choice: le Seigneur des esprits
  rationale: Ce titre récurrent des Paraboles est rendu littéralement et dans un registre digne.
theological_decisions:
- issue: Identité du référent masculin dans « son nom »
  choice: Conserver le possessif « son » sans ajouter de titre explicatif.
  alternative: Identifier expressément le personnage comme l’Élu ou le Fils de l’homme.
  rationale: Le contexte proche oriente vers la figure exaltée évoquée dans les versets environnants, mais ce verset n’emploie lui-même qu’un suffixe masculin. Ne pas expliciter le titre préserve l’implicite et la tension du texte.
- issue: Portée de l’antériorité affirmée
  choice: Rendre strictement l’antériorité du nom prononcé par rapport à la création des réalités célestes.
  alternative: Qualifier explicitement cette antériorité de préexistence personnelle ou d’existence éternelle.
  rationale: Le verset affirme que le nom est prononcé avant la création du soleil, des signes et des étoiles; il ne formule pas directement une doctrine plus développée sur le mode d’existence du personnage.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve le parallélisme des deux propositions temporelles et évite de rattacher « les signes » aux « étoiles », contrairement à une lecture syntaxiquement moins probable. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
