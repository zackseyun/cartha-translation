  - severity: low
    issue: La note a propose « invoquer »
    rationale: Même si le champ lexical peut parfois être discuté, « invoquer » surinterprète ici une action cultuelle. Une note doit limiter les alternatives à « appelé » et « nommé ».
  revised_text: Et avant que le soleil et les signes soient créés, avant que les étoiles du ciel soient faites, son nom fut appelé[a] devant le Seigneur des esprits[b].
