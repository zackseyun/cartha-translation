base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: fr
  text: À cette heure-là, ce Fils d’homme fut nommé[a] en présence du Seigneur des esprits, et son nom était devant la Tête des jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut appelé ». Le verbe passif peut exprimer une appellation ou l’attribution d’un nom ; « fut nommé » est retenu parce que la proposition suivante reprend « son nom ».
    reason: lexical_alternative
  - marker: b
    text: « Tête des jours » traduit littéralement un titre divin propre aux Paraboles. Cette formulation conserve l’image du texte plutôt que de la remplacer par un titre traditionnel plus fluide.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: À cette heure-là
  rationale: Conserve le repère temporel apocalyptique et la précision solennelle de « l’heure », dans un français actuel.
- source_word: ተጸውዐ
  choice: fut nommé
  rationale: Le passif peut exprimer l’attribution d’un nom ou une désignation. « Fut nommé » convient à la reprise immédiate de « son nom », sans réduire entièrement l’ambiguïté lexicale.
- source_word: ወልደ ሰብእ ዝኩ
  choice: ce Fils d’homme
  rationale: Le démonstratif désigne une figure précise déjà en vue. La majuscule rend l’emploi quasi titulaire dans les Paraboles sans imposer une harmonisation doctrinale ultérieure.
- source_word: በኀበ እግዚአ መናፈስት
  choice: en présence du Seigneur des esprits
  rationale: Rend la proximité devant le souverain céleste tout en gardant le cadre de cour apocalyptique.
- source_word: ስሙ
  choice: son nom
  rationale: Préserve la répétition thématique explicite du nom.
- source_word: መቅድመ
  choice: était devant
  rationale: Cette formulation compacte conserve l’ouverture entre présence spatiale, antériorité et possible préexistence, au lieu de trancher.
- source_word: ርእሰ መዋዕል
  choice: la Tête des jours
  rationale: Traduction formelle du titre divin distinctif, qui en maintient l’image au lieu de la remplacer par un équivalent traditionnel interprétatif.
theological_decisions:
- issue: Valeur générique ou titulaire de ወልደ ሰብእ
  choice: ce Fils d’homme
  alternative: cet homme / ce fils d’homme
  rationale: Dans les Paraboles, l’expression désigne ici une figure eschatologique précise et exaltée. La formulation retenue rend cette fonction locale sans importer davantage de christologie ultérieure que ne l’autorise le texte.
- issue: Portée de « son nom était devant la Tête des jours »
  choice: était devant la Tête des jours
  alternative: avait été nommé devant la Tête des jours / existait déjà devant la Tête des jours
  rationale: Le guèze est bref et peut évoquer la présence céleste, l’antériorité ou la préexistence. La traduction garde cette tension au lieu de l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le registre narratif solennel ; les expressions distinctives « Seigneur des esprits » et « Tête des jours » sont conservées. Les marqueurs de notes suivent l’élément précis qu’ils expliquent.
