base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: fr
  text: Et voici, il vient avec des myriades d’êtres saints[a] pour exercer le jugement contre eux, détruire les méchants et reprendre toute chair[b] pour tout ce que les pécheurs et les impies ont fait et dit contre lui.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des dizaines de milliers d’êtres saints ». L’expression guèze évoque une foule immense et peut reprendre une formule numérique traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: « Toute chair » est une expression traditionnelle qui désigne ici l’ensemble de l’humanité.
    reason: cultural_note
  - marker: c
    text: Ce verset trouve un écho en Jude 14-15, mais il est traduit ici d’après le témoin guèze, sans être harmonisé avec la formulation du Nouveau Testament.
    reason: cross_reference
lexical_decisions:
- source_word: ወናሁ
  choice: Et voici
  rationale: Conserve la force déictique et visionnaire de la formule apocalyptique dans un français biblique encore naturel.
- source_word: መጽአ
  choice: il vient
  rationale: Le présent garde l'immédiateté du discours prophétique sans imposer un futur ou un accompli.
- source_word: በትእልፊተ ቅዱሳን
  choice: avec des myriades de saints
  rationale: « Myriades » maintient la coloration numérique et apocalyptique; « saints » désigne ici des êtres saints sans préciser s'il s'agit d'anges ou d'humains.
- source_word: ይግበር ፍትሐ ላዕሌሆሙ
  choice: pour exercer le jugement contre eux
  rationale: Rend l'action judiciaire concrète et la valeur adversative possible de la préposition.
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: détruire les méchants
  rationale: Préserve la force punitive du verbe plutôt que de l'atténuer en simple condamnation verbale.
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: reprendre toute chair
  rationale: « Reprendre » conserve la réprimande publique ou judiciaire, tandis que « toute chair » maintient l'idiome concret de la source.
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: tout ce que ... ont fait et dit
  rationale: Suit l'analyse révisée du second verbe comme parole et conserve le parallélisme des deux actes.
- source_word: ኃጥኣን ወረሲዓን
  choice: les pécheurs et les impies
  rationale: Maintient deux désignations morales distinctes et leur effet d'insistance.
- source_word: ላዕሌሁ
  choice: contre lui
  rationale: Le pronom masculin singulier renvoie le plus naturellement à celui qui vient, sans ajouter un titre absent du texte.
theological_decisions:
- issue: Identité de celui qui vient
  choice: Conserver le simple pronom « il »
  alternative: « le Seigneur vient » ou « Dieu vient »
  rationale: La forme guèze porte un sujet implicite à la troisième personne; le contexte peut suggérer une théophanie, mais la traduction n'ajoute pas de titre.
- issue: Identité des « saints »
  choice: Ne pas préciser leur identité dans le texte
  alternative: « anges » ou « fidèles consacrés »
  rationale: Le contexte apocalyptique évoque probablement une suite céleste, mais la désignation source ne tranche pas explicitement entre ces interprétations.
- issue: Portée de « toute chair »
  choice: Conserver l'expression concrète
  alternative: « toute l'humanité »
  rationale: L'idiome vise l'ensemble des humains, mais sa forme traditionnelle participe au registre et ne doit pas être aplatie dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme apocalyptique est préservé sans archaïsmes inutiles. Les expressions « myriades », « saints » et « toute chair » gardent la texture de la source, avec des notes pour les lecteurs contemporains.
