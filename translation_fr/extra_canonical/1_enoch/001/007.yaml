base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: fr
  text: Et la terre se fendra[a], et tout ce qui est dans la terre sera détruit, et le jugement viendra sur tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sera déchirée » ou « s’ouvrira en deux ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « jugement » peut aussi signifier « justice » ou « droiture » ; ici, il semble désigner un acte de jugement qui atteint tous.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: se fendra
  rationale: Le verbe exprime ici l’action de déchirer, fendre ou ouvrir en deux; la forme rendue au futur passif/moyen décrit la terre qui se fend. Cette lecture correspond aussi au témoin grec σχισθήσεται et préserve l’image apocalyptique précise.
- source_word: ምድር
  choice: la terre
  rationale: Le contexte de jugement universel favorise « terre » plutôt que « pays ».
- source_word: ኵሉ ዘውስተ ምድር
  choice: tout ce qui est dans la terre
  rationale: La formulation conserve le sens littéral inhabituel de la préposition guèze, sans l’harmoniser silencieusement avec « sur la terre ».
- source_word: ይትሐጐል
  choice: sera détruit
  rationale: Le verbe désigne la perte, la ruine ou la destruction; « sera détruit » est clair et convient à la séquence de jugement.
- source_word: ፍትሕ
  choice: le jugement
  rationale: Bien que le terme puisse aussi signifier « justice » ou « droiture », la construction indiquant qu’il vient sur tous favorise ici un acte de jugement.
- source_word: ላዕለ ኵሉ
  choice: sur tous
  rationale: Cette traduction garde la valeur naturelle de la préposition et la portée universelle de la proposition.
theological_decisions:
- issue: Faut-il comprendre ፍትሕ comme une qualité morale ou comme un acte eschatologique?
  choice: le jugement
  alternative: la justice; la droiture
  rationale: Le cadre verbal « viendra sur tous » favorise un événement judiciaire, mais la note préserve le chevauchement lexical avec la justice et la droiture.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. La tournure inhabituelle « dans la terre » est maintenue afin de ne pas effacer la formulation du témoin guèze.
