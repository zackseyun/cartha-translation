lexical_decisions:
- source_word: ኅሩያን
  choice: les élus
  rationale: Le terme désigne ceux qui ont été choisis; « les élus » est naturel, digne et conserve sa portée théologique sans la préciser davantage.
- source_word: እቤ
  choice: je pris la parole
  rationale: Le verbe signifie littéralement « je dis ». Dans cet enchaînement introductif, « je pris la parole » évite une répétition pesante avec « prononçai » tout en gardant l'acte de parole.
- source_word: አውሣእኩ
  choice: prononçai
  rationale: Le verbe exprime ici le fait d'énoncer ou de faire entendre la parabole; « prononçai » convient au registre prophétique.
- source_word: ምስለ
  choice: une parabole
  rationale: Le substantif peut désigner une comparaison, une image ou une parabole; « parabole » préserve ici le genre sapientiel et prophétique traditionnel.
- source_word: ቅዱስ ወዐቢይ
  choice: Le Saint, le Grand
  rationale: Cette formulation conserve les deux adjectifs substantivés et leur tension appositionnelle, sans transformer arbitrairement le second en simple intensif.
- source_word: ይወፅእ
  choice: sortira
  rationale: Le futur français rend naturellement l'action annoncée dans cette parole prophétique.
- source_word: እማኅደሩ
  choice: de sa demeure
  rationale: Le mot désigne le lieu où il demeure; « demeure » garde le registre élevé sans imposer « sanctuaire » ou « habitation céleste ».
theological_decisions:
- issue: Identité du « Saint, le Grand »
  choice: Maintenir le titre sans ajouter d'identification explicite
  alternative: Ajouter « Dieu » ou « le Seigneur »
  rationale: Le texte source emploie des épithètes mais ne donne pas ici de nom; l'ajout résoudrait une implicitation que la traduction doit préserver.
- issue: Portée de « les élus »
  choice: Conserver la désignation collective non expliquée
  alternative: Préciser une communauté historique ou doctrinale particulière
  rationale: Le verset ne définit pas ce groupe; aucune appartenance confessionnelle ou interprétation ultérieure ne doit être importée.
