base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: fr
  text: Parole de bénédiction d’Hénok[a], par laquelle il bénit ceux qui sont choisis et les justes, qui seront présents au jour de la détresse[b], afin d’éliminer tous les méchants et les impies[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Hénok » reproduit de près la forme guèze du nom ; la forme française biblique habituelle est « Hénoch ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au jour de l’affliction » ; le terme peut désigner une détresse ou une épreuve sévère.
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi traduire : « pour l’élimination de tous les méchants et des impies ». Le texte distingue les méchants des impies.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: Paroles de bénédiction
  rationale: Cette formule d’ouverture sert de titre. Le pluriel « Paroles » est naturel en français pour désigner le contenu d’une bénédiction, tandis que « bénédiction » conserve le sens religieux du substantif.
- source_word: ዘሄኖክ
  choice: d’Hénok
  rationale: « Hénok » suit de près la forme guèze tout en employant une graphie lisible en français; une note signale la forme française biblique plus habituelle.
- source_word: በከመ ፡ ባረከ
  choice: par lesquelles il bénit
  rationale: La tournure reprend les paroles de bénédiction comme contenu ou moyen de l’acte de bénir et conserve la relation interne de la proposition source.
- source_word: ኅሩያነ
  choice: ceux qui ont été choisis
  rationale: Cette formulation rend la catégorie des personnes choisies sans recourir à « élus », terme susceptible de porter un poids doctrinal supplémentaire.
- source_word: ወጻድቃነ
  choice: et les justes
  rationale: « Les justes » est la désignation morale et religieuse courante en français biblique moderne et demeure distincte du groupe précédent.
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: qui seront présents
  rationale: La construction désigne ceux qui se trouveront là au moment futur évoqué; « seront présents » exprime clairement cette valeur situationnelle.
- source_word: በዕለተ ፡ ምንዳቤ
  choice: au jour de la détresse
  rationale: « Détresse » exprime une épreuve grave sans transformer la formule en terme eschatologique technique ni substituer explicitement le jugement au sens lexical.
- source_word: ለአሰስሎ
  choice: lorsque ... seront éliminés
  rationale: Le terme exprime l’enlèvement ou la suppression. Une proposition temporelle liée au jour rend en français la relation de manière naturelle, tout en maintenant l’événement d’élimination; la nuance possible de but est signalée en note.
- source_word: ኵሎ ፡ እኩያነ ፡ ወረሲዓነ
  choice: tous les méchants et les impies
  rationale: Le rendu conserve la totalité ainsi que les deux désignations coordonnées, l’une axée sur la méchanceté et l’autre sur l’impiété.
theological_decisions:
- issue: Désignation des destinataires de la bénédiction
  choice: ceux qui ont été choisis et les justes
  alternative: les élus et les justes; les justes choisis
  rationale: Le guèze coordonne deux termes. Les garder distincts préserve les catégories du texte sans les fusionner ni imposer à « élus » un sens doctrinal ultérieur.
- issue: Sens eschatologique de በዕለተ ምንዳቤ
  choice: au jour de la détresse
  alternative: au jour de l’affliction; au jour de la tribulation; au jour du jugement
  rationale: Le nom évoque directement la détresse. Le jugement ressort du contexte de l’élimination des méchants, mais ne doit pas remplacer le sens lexical de l’expression.
- issue: Relation de ለአሰስሎ avec le jour annoncé
  choice: lorsque tous les méchants et les impies seront éliminés
  alternative: pour l’élimination de tous les méchants et de tous les impies
  rationale: Le contexte autorise une lecture associant l’élimination au jour de détresse, tandis que la forme préfixée peut avoir une valeur finale. La traduction principale privilégie une syntaxe française claire et la note conserve explicitement l’autre relation possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour de titre reste légèrement solennel. Les termes « choisis », « justes », « méchants » et « impies » conservent les distinctions religieuses et morales du guèze sans ajout confessionnel.
