base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: fr
  text: Et le Dieu de l’éternité[a] s’avancera de là sur le mont Sinaï[b] ; il apparaîtra avec son armée[c], et il apparaîtra du ciel dans la force de sa puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « le Dieu du monde » ou « le Dieu de l’âge » ; ici, ዓለም est compris au sens d’« éternité ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être rendu par « ira », « marchera » ou « foulera ». Le texte exprime un déplacement depuis « là » vers ou sur le mont Sinaï, sans énoncer explicitement une descente.
    reason: lexical_alternative
  - marker: c
    text: Le terme éthiopien désigne un camp, une troupe ou une armée. Le rendu « armée » évoque la troupe qui accompagne l’apparition divine, sans en préciser l’identité. Des témoins grecs emploient également l’image d’un camp ou d’une troupe.
    reason: textual_and_lexical_clarification
lexical_decisions:
- source_word: ወእምላከ ዓለም
  choice: Et le Dieu de l’éternité
  rationale: Le syntagme associe la conjonction à « Dieu » et à ዓለም, qui peut désigner l’éternité, l’âge ou le monde. Dans ce titre théophanique, « Dieu de l’éternité » conserve la construction et l’accent temporel sans introduire un nom divin absent du texte.
- source_word: እምህየ
  choice: de là
  rationale: L’expression indique le point de départ et renvoie vraisemblablement à la demeure mentionnée dans le contexte précédent.
- source_word: ይከይድ
  choice: descendra
  rationale: Le verbe exprime un déplacement intentionnel et peut se rendre par « aller », « marcher » ou « fouler ». Avec « de là », « sur le mont Sinaï » et « du ciel », « descendra » donne en français un mouvement cohérent sans ajouter l’idée plus précise de piétinement.
- source_word: ዲበ ሲና ደብር
  choice: sur le mont Sinaï
  rationale: Rend naturellement la préposition de position ou de direction, suivie du nom propre et de « montagne ».
- source_word: ወያስተርኢ
  choice: il apparaîtra / se manifestera
  rationale: La forme verbale signifie faire voir, être vu ou apparaître. La variation française évite une répétition pesante tout en conservant les deux occurrences du verbe source.
- source_word: በትዕይንቱ
  choice: avec son armée
  rationale: La révision lexicale identifie ትዕይንት comme « camp, troupe, armée », lecture également soutenue par le grec παρεμβολή. « Armée » exprime ici la troupe céleste accompagnant l’apparition divine.
- source_word: በኃይለ ጽንዑ
  choice: dans toute la force de sa puissance
  rationale: Les deux termes forment une expression intensive de force et de puissance. « Toute » explicite en français cette intensification sans modifier son contenu fondamental.
- source_word: እምሰማይ
  choice: du ciel
  rationale: Traduction directe de la provenance céleste.
theological_decisions:
- issue: Titre divin አምላክ ዓለም
  choice: Dieu de l’éternité
  alternative: Dieu du monde / Dieu de l’âge
  rationale: Le contexte d’apparition divine favorise un titre soulignant la permanence de Dieu, mais la note préserve la polysémie réelle de ዓለም.
- issue: Nature de l’accompagnement divin
  choice: son armée
  alternative: son camp / sa troupe
  rationale: Cette lecture maintient l’imagerie d’une suite céleste sans préciser l’identité de ses membres ni importer une doctrine angélologique particulière.
- issue: Double emploi du verbe d’apparition
  choice: apparaîtra / se manifestera
  alternative: apparaîtra / apparaîtra
  rationale: 'Les deux propositions restent distinctes : la première associe Dieu à son armée, la seconde à sa puissance venant du ciel. La variation est stylistique et ne transforme pas la seconde en terme technique.'
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le parallélisme théophanique et les deux verbes d’apparition, tout en évitant une répétition maladroite. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
