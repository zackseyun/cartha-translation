base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: fr
  text: 'Hénoch répondit et dit : « Un homme juste[a], dont les yeux avaient été ouverts par Dieu, vit une vision sainte dans les cieux[b], que les anges m’ont montrée. J’ai tout entendu d’eux et j’ai compris ce que j’ai vu — non pour cette génération, mais pour une génération lointaine qui viendra[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase passe ensuite de la troisième personne (« vit ») à la première (« m’ont montrée »). Cette alternance, présente dans le texte éthiopien, est conservée.
    reason: textual_feature
  - marker: b
    text: Littéralement « dans les cieux » ; le pluriel appartient au langage cosmologique courant des écrits sémitiques et apocalyptiques.
    reason: cultural_note
  - marker: c
    text: 'Ou : « pour une génération éloignée qui doit venir ». La formule désigne une génération future envisagée comme distante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ ወይቤ
  choice: répondit et dit
  rationale: Conserve la formule narrative sémitique, même sans question explicite dans le contexte immédiat.
- source_word: ብእሲ ጻድቅ
  choice: un homme juste
  rationale: « Juste » exprime naturellement en français la valeur morale et théologique du terme.
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: dont les yeux avaient été ouverts par Dieu
  rationale: Rend l’ouverture divine de la perception visionnaire tout en gardant la subordination de la proposition.
- source_word: ራእየ ቅዱሰ
  choice: une vision sainte
  rationale: L’adjectif qualifie le plus naturellement la vision, sans introduire l’idée plus précise d’une vision du Saint.
- source_word: ዘበሰማያት
  choice: dans les cieux
  rationale: Préserve le pluriel cosmologique du texte éthiopien et son registre apocalyptique.
- source_word: ዘአርአዩኒ መላእክት
  choice: que les anges m’ont montrée
  rationale: Respecte le passage délibéré de la troisième personne (« vit ») à la première personne (« m’ont »).
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: J’ai tout entendu de leur bouche
  rationale: Conserve la totalité exprimée par ኵሎ et l’origine angélique de ce qui est entendu; « de leur bouche » est un français idiomatique pour « d’eux » dans ce contexte oral.
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: j’ai compris ce que je voyais
  rationale: Distingue la compréhension de la simple perception et conserve le présent relatif suggéré par la forme verbale.
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: non pour cette génération, mais pour une génération lointaine qui viendra
  rationale: Maintient le contraste, la notion de génération et l’éloignement temporel sans réduire le sens à une simple référence au futur.
theological_decisions:
- issue: « Vision sainte » ou « vision du Saint »
  choice: une vision sainte
  alternative: une vision du Saint
  rationale: La syntaxe fait plus naturellement de « saint » un qualificatif de « vision »; l’autre lecture ajouterait une identification théologique non imposée par le texte.
- issue: Alternance entre troisième et première personnes
  choice: « un homme juste… vit… que les anges m’ont montrée »
  alternative: « moi, un homme juste… j’ai vu… »
  rationale: L’alternance grammaticale est présente dans la source et peut être rhétoriquement significative; elle ne doit pas être harmonisée silencieusement.
- issue: Destinataire temporel de la révélation
  choice: une génération lointaine qui viendra
  alternative: les générations lointaines à venir
  rationale: Le singulier est conservé tout en maintenant l’image de distance temporelle et l’orientation future de la révélation.
translation_notes:
  register: Français international moderne, digne et lisible. La formule « répondit et dit » garde la couleur sémitique du discours; la ponctuation clarifie la longue période sans effacer son caractère oraculaire.
