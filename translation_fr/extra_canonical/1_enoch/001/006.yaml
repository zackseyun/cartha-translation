  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: fr
  text: Et les hautes montagnes trembleront[a], et les hautes collines seront abaissées[b] ; les montagnes et les collines fondront comme de la cire devant la flamme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : seront ébranlées ; frémiront.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : seront rendues basses ; seront humiliées.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : en présence de la flamme ; devant le feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: trembleront
  rationale: Le verbe est ici vraisemblablement intransitif et a un sujet pluriel. « Trembleront » conserve ce mouvement ainsi que la force de la scène théophanique.
- source_word: አድባር (ʾadbar)
  choice: montagnes
  rationale: Ce nom désigne couramment des hauteurs montagneuses ; « montagnes » convient au parallélisme avec les collines.
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: hautes
  rationale: Les deux formes, masculine et féminine, qualifient respectivement les montagnes et les collines. La répétition de « hautes » reproduit le parallélisme du texte sans introduire la notion métaphorique d’orgueil.
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: seront abaissées
  rationale: La forme passive exprime l’abaissement des collines et contraste directement avec leur hauteur initiale.
- source_word: አውግር (ʾawgr)
  choice: collines
  rationale: « Collines » est le sens topographique naturel et forme un parallèle clair avec « montagnes ».
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: fondront
  rationale: Le verbe signifie fondre ou se liquéfier ; « fondront » rend directement et vivement l’image physique.
- source_word: መዓረ (mäʿärä)
  choice: cire
  rationale: Le terme désigne la cire ; il n’est pas nécessaire de préciser « cire d’abeille ».
- source_word: ግራ (gǝra)
  choice: devant
  rationale: « Devant » exprime avec concision le sens spatial ou présentiel de la préposition dans cette comparaison.
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: devant la flamme
  rationale: Le nom désigne une flamme ou un feu ardent. « La flamme » reste concret et proche du lexique source, tandis que la préposition française s’intègre naturellement à la comparaison.
