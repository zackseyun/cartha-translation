base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: fr
  text: Et il accordera la paix aux justes[a], il gardera ceux qu’il a choisis, et sa faveur reposera sur eux. Ils appartiendront tous à Dieu, ils prospéreront[b] et seront bénis, et la lumière de Dieu brillera sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les premiers mots du témoin éthiopien sont textuellement difficiles; le sens général concerne néanmoins l’action favorable de Dieu envers les justes.
    reason: textual_variant
  - marker: b
    text: Ou « réussiront » ou « s’épanouiront ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላመ ይገብር
  choice: il accordera la paix
  rationale: Cette formulation française exprime l’établissement de la paix en faveur des justes et respecte le complément introduit par ለ, sans suggérer une réconciliation après une hostilité.
- source_word: የዓቅቦሙ
  choice: il gardera
  rationale: « Garder » conserve le sens de protection et le registre élevé du passage sans préciser excessivement la nature de cette protection.
- source_word: ሕሩያን
  choice: ceux qu’il a choisis
  rationale: Cette tournure transparente préserve la désignation distincte des justes et évite la charge doctrinale que peut porter « les élus ».
- source_word: ሣህል
  choice: sa faveur
  rationale: « Faveur » rend la bienveillance divine sans réduire le terme à la seule compassion ni lui imposer un sens technique de grâce salvatrice. Le possessif explicite naturellement en français que cette faveur vient de Dieu.
- source_word: ዘአምላክ
  choice: appartiendront tous à Dieu
  rationale: Cette expression rend naturellement le rapport d’appartenance indiqué par la construction génitivale, sans ajouter « peuple » ni transformer l’énoncé en qualité morale.
- source_word: ይሴርሑ
  choice: prospéreront
  rationale: Le verbe évoque vraisemblablement le bien-être ou l’épanouissement; « prospérer » conserve cette issue positive, avec une note signalant une portée possible plus générale.
- source_word: ይትባረኩ
  choice: seront bénis
  rationale: Le passif français correspond directement à la forme source et maintient la tonalité solennelle de la bénédiction.
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: la lumière de Dieu brillera sur eux
  rationale: Cette formulation préserve l’image apocalyptique de l’illumination divine ainsi que l’orientation de la lumière vers les bénéficiaires.
theological_decisions:
- issue: Désignations du groupe fidèle
  choice: Maintenir « les justes » et « ceux qu’il a choisis » comme deux désignations parallèles distinctes
  alternative: Les fondre en une seule désignation ou traduire ሕሩያን par « les élus »
  rationale: Le texte emploie successivement deux titres; les conserver évite d’aplatir sa texture théologique et d’importer les connotations doctrinales ultérieures de « élus ».
- issue: Sens de ዘአምላክ
  choice: « Ils appartiendront tous à Dieu »
  alternative: « Ils seront pieux » ou « ils seront tous le peuple de Dieu »
  rationale: La construction exprime plus naturellement l’appartenance que la qualité morale; ajouter « peuple » expliciterait davantage que le texte.
- issue: Rapport entre Dieu, la paix et les justes
  choice: « Il accordera la paix aux justes »
  alternative: « Il fera la paix avec les justes » ou, plus littéralement, « il fera la paix pour les justes »
  rationale: Le complément en ለ indique que la paix est établie pour les justes. La formulation retenue évite de laisser entendre une réconciliation consécutive à une hostilité entre Dieu et eux.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement segmentée pour la clarté, tout en gardant le parallélisme et la tonalité solennelle du passage.
