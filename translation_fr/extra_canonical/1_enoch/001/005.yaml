base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
translation:
  language: fr
  text: Tous auront peur, et les Veilleurs[a] trembleront ; la peur et un grand tremblement s’empareront d’eux jusqu’aux extrémités de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les vigilants ». Le terme éthiopien évoque ceux qui restent éveillés ou vigilants et sert, dans 1 Hénoch, de désignation pour les êtres angéliques appelés les Veilleurs.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « jusqu’aux extrémités de la terre » indique une portée universelle : le monde entier, jusque dans ses régions les plus lointaines.'
    reason: cultural_note
lexical_decisions:
- source_word: ይፈርሁ
  choice: seront saisis de crainte
  rationale: L’imparfait pluriel exprime ici, dans ce contexte théophanique et prophétique, l’entrée dans un état de peur ; cette tournure française est naturelle et évite l’ambiguïté transitive de « craindront ».
- source_word: ኵሉ
  choice: tous
  rationale: Quantificateur universel employé substantivement ; « tous » convient naturellement en français.
- source_word: ይደለቀለቁ
  choice: trembleront
  rationale: La forme redoublée a une valeur intensive ; « trembleront » rend clairement la réaction suscitée par la manifestation divine.
- source_word: ትጉሃን
  choice: les vigilants
  rationale: Le terme est lié à l’idée d’éveil et de vigilance et peut désigner techniquement les Veilleurs dans 1 Hénoch. La traduction descriptive « les vigilants » conserve ce lien sans imposer entièrement le titre interprétatif.
- source_word: ይነሥኦሙ
  choice: s’empareront d’eux
  rationale: Le verbe avec suffixe objet signifie littéralement prendre ou saisir ; appliqué à des émotions, « s’emparer de » est idiomatique en français.
- source_word: ፍርሃት
  choice: la peur
  rationale: Nom courant désignant la peur, ici sujet du verbe « s’emparer ».
- source_word: ወረዓድ ዓቢይ
  choice: et un grand tremblement
  rationale: Le substantif issu de la racine sémitique rʿd évoque le tremblement, et ዓቢይ l’intensifie directement.
- source_word: እስከ አጽናፈ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: « Jusqu’à » marque l’étendue, tandis que l’expression traditionnelle « extrémités de la terre » conserve l’image et la portée universelle de la formule sémitique.
theological_decisions:
- issue: Identification de ትጉሃን
  choice: Traduire par « les vigilants » et signaler en note la possibilité du titre « les Veilleurs ».
  alternative: Employer directement « les Veilleurs », comme désignation technique d’êtres angéliques.
  rationale: L’étymologie et l’usage hénochien favorisent fortement le rapport avec les Veilleurs, mais la forme descriptive permet de préserver la valeur lexicale de vigilance et de ne pas résoudre silencieusement le statut du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et l’intensification du texte éthiopien, tout en rendant idiomatiquement la peur qui saisit les êtres concernés.
