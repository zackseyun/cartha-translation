  naturalness: « Les vigilants » employé comme substantif est peu naturel en français moderne et ne communique pas clairement la désignation hénochienne. « Les Veilleurs » est à la fois idiomatique dans ce contexte et accessible avec une note. Le reste de la phrase est fluide et conserve le parallélisme.
  terminology: « Veilleurs » rend la terminologie établie de 1 Hénoch sans imposer une doctrine sur leur nature ou leur rôle. « Peur », « grand tremblement » et « extrémités de la terre » sont appropriés.
