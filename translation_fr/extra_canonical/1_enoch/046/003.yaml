base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: fr
  text: 'Et il me répondit et me dit : « Celui-ci est le Fils de l’homme, à qui appartient la justice, et la justice demeure avec lui. Il révélera tous les trésors de ce qui est caché[a], car le Seigneur des esprits l’a choisi, lui dont le lot a prévalu[b] devant le Seigneur des esprits, pour toujours, dans la droiture. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les dépôts des choses cachées ». L’image est celle de réalités dissimulées et gardées en réserve, non pas seulement de « secrets » abstraits.
    reason: lexical_alternative
  - marker: b
    text: La proposition finale est difficile en guèze. « Son lot a prévalu » peut aussi se comprendre comme « sa part a triomphé » ou, moins probablement, comme une allusion au lot de ceux qui lui sont associés.
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: le Fils de l’homme
  rationale: Dans cette scène visionnaire, l’expression désigne une figure déterminée et fonctionne comme un titre, sans qu’il soit nécessaire d’y importer des développements doctrinaux ultérieurs.
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: à qui appartient la justice
  rationale: La tournure exprime la possession ou l’association plutôt qu’une simple qualité adjectivale.
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: et la justice demeure avec lui
  rationale: Le verbe évoque le fait d’habiter ou de rester auprès de quelqu’un; la formulation conserve aussi la personnification de la justice.
- source_word: መዛግብተ ዘኅቡእ
  choice: les trésors de ce qui est caché
  rationale: Le terme désigne des trésors ou dépôts où sont gardées des réalités cachées; cette image apocalyptique est maintenue plutôt que réduite à de simples « secrets ».
- source_word: ይከሥት
  choice: il révélera
  rationale: Le futur convient au rôle annoncé de cette figure et le verbe exprime clairement la manifestation de réalités cachées.
- source_word: እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Il s’agit d’un titre divin récurrent dans 1 Hénoch; cette traduction en conserve la forme distinctive.
- source_word: ኀረዮ ኃርየ
  choice: l’a choisi
  rationale: La répétition de formes apparentées intensifie le choix, mais une duplication littérale serait lourde et peu naturelle en français.
- source_word: ወዘክፍሉ ሞአ
  choice: lui dont le lot a prévalu
  rationale: « Dont » rend le relatif ዘ et maintient la description continue du Fils de l’homme. « Lot » conserve l’image d’une part attribuée, tandis que « a prévalu » reflète le sens victorieux du verbe.
- source_word: በርቱዕ ለዓለም
  choice: pour toujours, dans la droiture
  rationale: La traduction conserve à la fois la durée perpétuelle et la qualité morale de la formule difficile, sans répéter une troisième fois « justice ».
theological_decisions:
- issue: Valeur titulaire ou générique de ወልደ ሰብእ
  choice: « le Fils de l’homme », avec majuscule au titre
  alternative: « un fils d’homme » ou « l’être humain »
  rationale: Le contexte présente une figure visionnaire déterminée dotée de fonctions propres. La traduction signale cette fonction titulaire tout en évitant une harmonisation explicite avec des textes chrétiens ultérieurs.
- issue: Répétition des affirmations concernant la justice
  choice: Maintenir « à qui appartient la justice » et « la justice demeure avec lui »
  alternative: Fondre les deux propositions en « le juste »
  rationale: La répétition renforce délibérément le lien de cette figure avec la justice; la conserver respecte la force poétique et théologique du texte.
- issue: Sens de la proposition finale relative au lot
  choice: « lui dont le lot a prévalu »
  alternative: « sa part a triomphé », « le lot des siens a prévalu » ou « sa part est préservée »
  rationale: Le guèze est difficile et ne permet pas de trancher avec pleine certitude. Le texte principal reste proche de la grammaire apparente, tandis que la note expose les principales possibilités.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition initiale « répondit et me dit » ainsi que celle de « justice » sont conservées parce qu’elles appartiennent à la structure du texte source. Les termes « trésors », « lot » et « droiture » maintiennent l’imagerie et l’étrangeté mesurée du langage apocalyptique.
