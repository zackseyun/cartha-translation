base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: fr
  text: Là, je vis quelqu’un qui avait une tête de jours[a] ; sa tête était comme de la laine blanche. Avec lui se trouvait un autre, dont le visage était comme l’apparence d’un homme, et son visage était plein de grâce[b], comme celui d’un des saints anges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Ancien des jours ». Le guèze dit plus littéralement « tête de jours » ; cette image est conservée dans le texte.
    reason: lexical_alternative
  - marker: b
    text: L’expression « plein de grâce » traduit directement le guèze ; elle ne doit pas être comprise comme un emprunt à une formulation plus tardive du Nouveau Testament.
    reason: cross_reference
lexical_decisions:
- source_word: በህየ፡ ርኢኩ
  choice: Là, je vis
  rationale: Rend directement le déictique locatif et le compte rendu visionnaire dans un français actuel et digne.
- source_word: ዘሎቱ፡ ርእሰ፡ መዋዕል
  choice: quelqu’un qui avait une tête de jours
  rationale: Conserve l’étrange tournure guèze « tête de jours » sans l’harmoniser silencieusement avec le titre traditionnel de Daniel.
- source_word: ወርእሱ፡ ከመ፡ ፀምር፡ ጻዕዳ
  choice: sa tête était comme de la laine blanche
  rationale: Le texte nomme la tête plutôt que les cheveux et emploie explicitement une comparaison.
- source_word: ወምስሌሁ፡ ካልእ
  choice: Avec lui se trouvait un autre
  rationale: Expression française naturelle qui introduit clairement une seconde figure sans l’identifier davantage.
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: dont le visage était comme l’apparence d’un homme
  rationale: Préserve le comparatif explicite ከመ et le parallélisme des trois comparaisons du verset, malgré l’étrangeté voulue de la formulation.
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: et son visage était plein de grâce
  rationale: Rend directement ጸጋ par « grâce », sans attribuer à l’expression une origine néotestamentaire.
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: comme celui d’un des saints anges
  rationale: Rend la valeur partitive du numéral et rattache naturellement la comparaison au visage en français.
theological_decisions:
- issue: Rendu de ርእሰ መዋዕል
  choice: tête de jours
  alternative: l’Ancien des jours
  rationale: La traduction principale reste au plus près de l’idiome guèze et ne transforme pas automatiquement la formule en titre traditionnel ; l’alternative est signalée en note.
- issue: Identification de la seconde figure
  choice: un autre, dont le visage était comme l’apparence d’un homme
  alternative: le Fils de l’homme
  rationale: Le verset présente ici la figure par une description et non par ce titre ; l’identifier dans le corps du texte résoudrait prématurément une tension théologique.
translation_notes:
  register: Français international moderne, lisible et solennel. La syntaxe conserve les répétitions et les comparaisons du guèze lorsque celles-ci structurent la vision. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
