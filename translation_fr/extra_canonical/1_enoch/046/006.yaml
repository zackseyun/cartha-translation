base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: fr
  text: Il abattra le visage des puissants et les remplira de honte. Les ténèbres deviendront leur demeure, et les vers[a] seront leur lit. Ils n’auront aucun espoir de se relever de leur lit[b], parce qu’ils n’exaltent pas le nom du Seigneur des Esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lecture du mot éthiopien rendu par « vers » est quelque peu incertaine dans ce témoin ; ce sens correspond toutefois à l’image de corruption associée à ce lit semblable à une tombe.
    reason: textual_variant
  - marker: b
    text: « Se relever de leur lit » peut simplement signifier se lever, mais, dans ce contexte de jugement, l’expression peut aussi évoquer l’absence de relèvement ou de restauration après la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን
  choice: le visage des puissants
  rationale: « Visage » conserve l’image concrète de l’humiliation. « Les puissants » rend naturellement en français le substantif adjectival désignant les forts, sans préciser qu’il s’agit de rois ou de dirigeants.
- source_word: ይገፈትእ
  choice: il abattra
  rationale: La forme verbale est active, à la troisième personne du masculin singulier, et poursuit l’action du sujet masculin du contexte. « Abattre » exprime à la fois le coup porté et la chute judiciaire.
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: les remplira de honte
  rationale: Cette formulation respecte le sujet actif et traite « honte » comme le complément de ce dont il les remplit.
- source_word: ጽልመት
  choice: les ténèbres
  rationale: Ce terme direct et courant préserve l’imagerie apocalyptique du jugement.
- source_word: መንደሪሆሙ
  choice: leur demeure
  rationale: « Demeure » rend le lieu où ils habiteront dans un registre digne et naturel.
- source_word: ዕፀያት
  choice: les vers
  rationale: Dans l’image d’un lit évoquant la tombe et la corruption, « vers » convient au contexte, tout en signalant en note l’incertitude de la forme transmise.
- source_word: ምስካቦሙ
  choice: leur lit
  rationale: Le mot désigne un lit ou une couche. « Lit » maintient l’image abrupte sans l’interpréter explicitement comme une tombe.
- source_word: ኢይሴፈዉ
  choice: ils n’auront aucun espoir
  rationale: Cette tournure idiomatique exprime clairement l’absence totale d’espoir ou d’attente.
- source_word: ይትነሥኡ
  choice: se relever
  rationale: « Se relever » conserve l’ambiguïté entre le fait de se lever d’un lit et une possible évocation d’un relèvement après la mort.
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: ils n’exaltent pas le nom
  rationale: « Exalter » garde le sens de rendre grand ou d’élever et maintient le registre cultuel du passage.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des Esprits
  rationale: Cette traduction littérale préserve le titre divin récurrent et distinctif de 1 Hénoch.
theological_decisions:
- issue: Le verbe ይትነሥኡ désigne-t-il une résurrection ou simplement le fait de se lever ?
  choice: se relever de leur lit
  alternative: être relevés de leur lit ; se lever de leur couche
  rationale: L’association des ténèbres, des vers et du lit suggère la mort et le jugement, mais le verbe n’impose pas à lui seul une lecture explicitement résurrectionnelle. La traduction maintient cette tension.
- issue: Identité des ጽኑዓን
  choice: les puissants
  alternative: les forts ; les dirigeants puissants
  rationale: Le terme désigne ceux qui sont forts ou puissants, sans les identifier expressément comme des rois ou des gouvernants dans ce verset. La formulation retenue reste donc générale.
- issue: Sujet des deux premiers verbes
  choice: un sujet masculin singulier exprimé par « il »
  alternative: 'une tournure passive : « le visage des puissants sera abattu »'
  rationale: Les formes verbales guèzes sont actives à la troisième personne du masculin singulier. Le français doit conserver ce sujet actif plutôt que transformer la phrase en passif.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe active du guèze est conservée. Les images concrètes du visage, des ténèbres, des vers et du lit restent intactes, sans expliciter davantage que le texte la nature des puissants ni le sens résurrectionnel possible de « se relever ».
