base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: fr
  text: 'Et j’interrogeai l’un des anges qui allait avec moi et qui me montrait toutes les choses cachées[a], au sujet de ce Fils de l’homme : qui il était, d’où il venait et pourquoi il allait avec la Tête des jours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les secrets ». Le terme guèze désigne ici des choses cachées, notamment des réalités célestes dévoilées dans la vision.
    reason: lexical_alternative
  - marker: b
    text: « Tête des jours » traduit directement l’expression guèze. La traduction traditionnelle « Ancien des jours » est influencée par la formulation du livre de Daniel.
    reason: cross_reference
lexical_decisions:
- source_word: ተስእልክዎ
  choice: j’interrogeai
  rationale: Le verbe introduit la demande adressée par Hénoch à l’ange. « J’interrogeai » convient au registre narratif et permet naturellement le complément « au sujet de ».
- source_word: ፩እመላእክት
  choice: l’un des anges
  rationale: 'La construction est partitive : il s’agit d’un ange parmi les anges, sans ajout de « saint ».'
- source_word: ዘየሐውር ምስሌየ
  choice: qui marchait avec moi
  rationale: Le participe décrit un déplacement continu aux côtés d’Hénoch. « Marchait avec moi » conserve l’image de mouvement plutôt que de la réduire à « m’accompagnait ».
- source_word: ኵሎ ኅቡኣተ
  choice: toutes les réalités cachées
  rationale: L’expression désigne les choses célestes dissimulées puis montrées dans la vision. « Réalités cachées » est naturel en français tout en laissant « secrets » comme possibilité.
- source_word: ዘያርእየኒ
  choice: qui me montrait
  rationale: Le verbe a une portée visuelle et révélatrice ; « montrait » préserve directement le cadre visionnaire.
- source_word: ወልደ ሰብእ
  choice: ce Fils de l’homme
  rationale: Le démonstratif désigne une figure visionnaire déterminée. La majuscule signale ici une désignation littéraire marquée, sans imposer une identification doctrinale ultérieure.
- source_word: እምአይቴ ይከውን
  choice: d’où il venait
  rationale: La question porte sur l’origine ou la provenance de la figure. Cette formulation est idiomatique en français et garde ce sens.
- source_word: ርእሰ መዋዕል
  choice: la Tête des jours
  rationale: Traduction transparente de l’expression éthiopienne, qui évite de l’harmoniser silencieusement avec le titre traditionnel de Daniel, « l’Ancien des jours ».
- source_word: ምስለ ... የሐውር
  choice: marchait avec
  rationale: La répétition du verbe de mouvement est conservée afin de maintenir le parallèle verbal et l’image saisissante du texte.
theological_decisions:
- issue: Faut-il rendre ወልደ ሰብእ comme un titre ou comme une expression humaine générique ?
  choice: « ce Fils de l’homme »
  alternative: « ce fils d’homme » ou « cet être humain »
  rationale: Dans cette scène, le démonstratif renvoie à une figure visionnaire distincte. La majuscule marque sa fonction littéraire dans le passage sans importer à elle seule une conclusion christologique.
- issue: Faut-il harmoniser ርእሰ መዋዕል avec le traditionnel « Ancien des jours » de Daniel ?
  choice: « la Tête des jours »
  alternative: « l’Ancien des jours » ou « la Tête des Jours »
  rationale: L’éthiopien dit littéralement « Tête des jours ». Le texte principal conserve cette formulation propre à la source, tandis que la tournure traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend les actions en cours dans la vision ; le passé simple porte l’action principale. La répétition de « marchait » conserve le parallélisme de la source. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
