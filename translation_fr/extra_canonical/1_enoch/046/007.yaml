  text: And these are those who judge the stars of heaven[a][b].
translation:
  language: fr
  text: Et ce sont eux qui jugent les étoiles du ciel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi se comprendre au sens de « gouverner » ou « régir ». Comme cette section n’est pour l’essentiel conservée qu’en guèze, sa nuance exacte doit être considérée avec une certaine prudence.
    reason: lexical_alternative
  - marker: b
    text: Dans la littérature apocalyptique, les « étoiles » peuvent être des corps célestes ou symboliser des êtres célestes; ici, le texte ne permet pas de trancher.
    reason: cultural_note
lexical_decisions:
- source_word: እሙንቱ
  choice: ce sont eux
  rationale: Le pronom démonstratif pluriel a une force déictique. « Ce sont eux » donne en français une identification naturelle tout en préparant la proposition relative.
- source_word: ኮኑ
  choice: sont
  rationale: Dans cette proposition d’identification, le présent convient à la description visionnaire plutôt qu’à l’expression d’un changement d’état passé.
- source_word: እለ
  choice: qui
  rationale: Le marqueur relatif introduit le groupe qui identifie les personnages; après « ce sont eux », le français naturel demande simplement « qui ».
- source_word: ይኴንኑ
  choice: jugent
  rationale: « Juger » conserve le sens lexical principal et l’imagerie judiciaire, sans réduire le verbe à la seule idée de gouvernement ni lui imposer le sens plus étroit de condamnation.
- source_word: ከዋክብተ ሰማይ
  choice: les étoiles du ciel
  rationale: Cette traduction directe du syntagme construit préserve l’image cosmique et le registre apocalyptique dans un français actuel et digne.
theological_decisions:
- issue: Faut-il atténuer le jugement en simple gouvernement cosmique ?
  choice: jugent les étoiles du ciel
  alternative: gouvernent les étoiles du ciel / règnent sur les étoiles du ciel
  rationale: Le verbe guèze est bien rendu en premier lieu par « juger ». Garder ce langage judiciaire préserve la tension théologique du passage, d’autant que les étoiles peuvent désigner des corps célestes ou symboliser des êtres célestes.
- issue: Faut-il identifier explicitement les étoiles à des êtres célestes ?
  choice: étoiles
  alternative: êtres célestes
  rationale: Le texte dit « étoiles » et n’impose pas à lui seul une lecture exclusivement littérale ou symbolique; la traduction conserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « ce sont eux qui » conserve la force d’identification du guèze sans lourdeur; « étoiles du ciel » maintient le registre cosmique et apocalyptique.
