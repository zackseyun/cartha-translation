base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: fr
  text: Et ce Fils de l’homme que tu as vu fera lever les rois et les puissants de leurs couches[a], et les hommes forts de leurs trônes ; il déliera les reins[b] des hommes forts et brisera les dents des pécheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs lits ». L’image évoque des dirigeants contraints de quitter leur lieu de repos, d’aisance ou de sécurité.
    reason: lexical_alternative
  - marker: b
    text: Le texte guèze est difficile à cet endroit. « Délier les reins » reprend probablement l’image biblique d’un puissant privé de sa force ou rendu impuissant ; une leçon voisine pourrait aussi évoquer le fait de dénouer sa ceinture.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: Fils de l’homme
  rationale: L’expression est conservée sous sa forme sémitique et comprise ici comme désignant la figure particulière déjà montrée dans la vision, sans lui imposer davantage de contenu théologique ultérieur.
- source_word: ዘርኢከ
  choice: que tu as vu
  rationale: Cette formulation naturelle en français garde le lien direct avec la vision antérieure d’Hénoch.
- source_word: ያነሥኦሙ
  choice: fera lever
  rationale: Le causatif exprime littéralement l’action de faire se lever. Le complément « de leurs couches » indique ici une éviction ou un arrachement, non une élévation honorifique.
- source_word: እምስካበቲሆሙ
  choice: de leurs couches
  rationale: Le nom désigne des lits ou des couches. « Couches » conserve l’image concrète du repos et de l’aisance des dirigeants.
- source_word: ኃያላን / ጽኑዓን
  choice: les puissants / les hommes forts
  rationale: Deux termes voisins sont distingués en français afin de ne pas effacer la variation du texte, tandis que la répétition de ጽኑዓን est rendue par « hommes forts » dans ses deux occurrences.
- source_word: መናብርቲሆሙ
  choice: leurs trônes
  rationale: Dans ce contexte royal et judiciaire, « trônes » exprime naturellement les sièges du pouvoir.
- source_word: ይፈትሕ
  choice: déliera
  rationale: Le verbe signifie délier, dénouer ou relâcher. La traduction maintient l’image corporelle difficile au lieu de la remplacer par une paraphrase abstraite.
- source_word: ኃማተ
  choice: les reins
  rationale: La leçon transmise est difficile. « Reins » suit l’interprétation contextuelle et l’idiome biblique d’une force défaite, tout en signalant l’incertitude textuelle en note.
- source_word: ይደቅቅ
  choice: brisera
  rationale: « Brisera » rend avec force et naturel l’action violente de réduire en morceaux ou d’écraser.
- source_word: አስናነ ኃጥኣን
  choice: les dents des pécheurs
  rationale: L’image concrète des dents, symbole de capacité prédatrice, est conservée sans explicitation dans le corps du texte.
theological_decisions:
- issue: 'Valeur de ወልደ ሰብእ : titre individualisé ou désignation humaine générique'
  choice: « Fils de l’homme », avec majuscule, pour la figure particulière de la vision
  alternative: « un fils d’homme » ou « l’être humain »
  rationale: Dans le contexte des Paraboles, cette figure est individualisée et exerce une fonction eschatologique. La traduction conserve néanmoins la formulation sémitique sans l’identifier explicitement à une figure d’écrits postérieurs.
- issue: Sens de l’action exercée contre les dirigeants
  choice: 'Conserver les images concrètes : « fera lever… de leurs couches », « déliera les reins »'
  alternative: Paraphraser par « déposera », « renversera » ou « humiliera »
  rationale: Les images apocalyptiques transmettent le jugement tout en gardant les ambiguïtés lexicales du texte. Une paraphrase abstraite résoudrait indûment ces tensions.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné et les images corporelles du jugement apocalyptique sont conservés. « Fera lever… de » reste volontairement concret ; le contexte empêche de le comprendre comme une exaltation.
