base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: fr
  text: Et il renversera les rois de leurs trônes et de leurs royaumes, parce qu’ils ne l’exaltent pas, ne le louent pas et ne reconnaissent pas d’où leur a été donnée la royauté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de qui ils ont reçu la royauté ». L’expression peut désigner la source de façon générale (« d’où ») ou, dans ce contexte, renvoyer plus personnellement à celui qui leur a donné la royauté. Le terme traduit par « royauté » peut aussi signifier « autorité royale » ou « royaume ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: il renversera
  rationale: Le verbe exprime une destitution énergique ou un renversement. « Renversera » conserve la force du tableau apocalyptique.
- source_word: ነገሥት
  choice: les rois
  rationale: Le terme désigne précisément des rois, en accord avec les trônes et les royaumes mentionnés ensuite.
- source_word: እመናብርቲሆሙ ወእመንገሥቲሆሙ
  choice: les chassant de leurs trônes et de leurs royaumes
  rationale: La tournure française explicite naturellement l’éloignement hors des trônes et des royaumes tout en préservant les deux images du texte guèze.
- source_word: ኢያሌዕልዎ
  choice: ils ne l’exaltent pas
  rationale: « Exalter » garde le sens fort d’élever ou de tenir pour souverainement élevé, sans le réduire au simple fait d’honorer.
- source_word: ኢይሴብሕዎ
  choice: ils ne le louent pas
  rationale: « Louer » rend clairement le sens de célébrer ou glorifier et se distingue bien d’« exalter ».
- source_word: ኢይገንዩ
  choice: ils ne reconnaissent pas
  rationale: Dans ce contexte, le verbe évoque la reconnaissance, avec une nuance possible de soumission ou de confession. « Reconnaissent » rend le sens contextuel sans ajouter explicitement une attitude absente de la formulation.
- source_word: እምአይቴ
  choice: d’où
  rationale: L’expression désigne la provenance ou la source. « D’où » préserve cette formulation générale sans imposer un référent personnel.
- source_word: ተውህበት ሎሙ መንግሥት
  choice: leur a été donnée l’autorité royale
  rationale: Le passif est conservé. Ici, መንግሥት peut désigner la royauté ou le pouvoir de régner plutôt qu’un territoire; « autorité royale » rend ce sens clairement en français.
theological_decisions:
- issue: Référent du pronom « l’ »
  choice: Maintenir le pronom sans nommer son référent.
  alternative: Identifier explicitement le Très-Haut, le Seigneur ou l’Élu.
  rationale: Le verset ne donne pas lui-même de titre. Le contexte suggère un référent divin, mais le nommer ici résoudrait une tension que le texte laisse implicite.
- issue: Source de l’autorité des rois
  choice: Conserver le passif « leur a été donnée » et la question générale de la provenance avec « d’où ».
  alternative: Écrire « par qui leur a été donnée » et rendre explicite un donateur personnel.
  rationale: La logique du passage suggère un donateur divin, mais l’expression guèze peut être rendue plus généralement comme indiquant la source. La traduction garde cette ambiguïté, signalée en note.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le rythme ternaire « ne l’exaltent pas, ne le louent pas et ne reconnaissent pas ». « Autorité royale » évite de suggérer que les rois auraient reçu collectivement un seul territoire, tout en maintenant l’idée d’une royauté reçue.
