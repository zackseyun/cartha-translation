base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: fr
  text: 'Azazel apprit aux hommes à fabriquer des épées, des couteaux, des boucliers et des cuirasses. Il leur montra ce qui était derrière eux et leurs ouvrages[a] : les bracelets, les ornements, le maquillage des yeux, l’embellissement des paupières, toutes sortes de pierres de grand prix[b] et toutes les teintures colorantes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « ce qui était derrière eux » correspond à une leçon guèze difficile et signalée comme incertaine (†ዘእምድኅሬሆሙ†). Le texte est peut-être altéré; certains comprennent plutôt les métaux employés ou ce qui résultait de ces techniques.
    reason: textual_variant
  - marker: b
    text: Les termes cosmétiques de cette liste évoquent notamment le maquillage appliqué autour des yeux et d’autres pratiques concrètes de parure.
    reason: cultural_note
lexical_decisions:
- source_word: መሀሮሙ ለሰብእ
  choice: apprit aux hommes
  rationale: Rend directement le verbe d’enseignement et conserve le référent humain masculin probable dans ce contexte artisanal et guerrier, sans l’élargir explicitement à toute l’humanité.
- source_word: ገቢረ አሰይፍት
  choice: à fabriquer des épées
  rationale: Exprime le travail de fabrication, et non la simple possession des armes.
- source_word: መጣብኅት፡ ወወልታ፡ ወድርዐ አንግድዓ
  choice: des couteaux, des boucliers et des cuirasses
  rationale: Termes français modernes, clairs et dignes pour les instruments tranchants et l’équipement défensif énumérés.
- source_word: ወአርአዮሙ
  choice: Il leur montra
  rationale: Préserve l’idée de divulgation d’un savoir sans ajouter dans le verset un jugement moral explicite.
- source_word: ዘእምድኅሬሆሙ፡ ወምግባሮሙ
  choice: ce qui était derrière eux et leurs ouvrages
  rationale: Traduction volontairement proche d’une leçon guèze difficile et peut-être altérée; elle en conserve l’obscurité au lieu d’imposer la conjecture contextuelle « leurs métaux et leur travail ».
- source_word: እውቃፋተ፡ ወስርጐ
  choice: les bracelets, les ornements
  rationale: Désigne naturellement des objets de parure tout en maintenant la distinction entre l’objet particulier et la catégorie générale.
- source_word: ተጽሕሎተ፡ ወአስንዮተ፡ ቀርንብ
  choice: le maquillage des yeux, l’embellissement des paupières
  rationale: Restitue des pratiques cosmétiques concrètes dans un français actuel, plutôt qu’une notion abstraite de beauté.
- source_word: ወእብነ፡ እምኵሉ፡ እብን
  choice: toutes sortes de pierres de grand prix
  rationale: Conserve l’idée de valeur exprimée par la tradition textuelle fournie, sans réduire l’expression au seul terme conventionnel « pierres précieuses ».
theological_decisions:
- issue: Présenter l’enseignement d’Azazel comme un artisanat neutre ou comme un savoir corrupteur interdit
  choice: Conserver les verbes sobres « apprit » et « montra », en laissant l’énumération et le contexte narratif porter la connotation négative.
  alternative: Ajouter des précisions interprétatives telles que « pour faire la guerre » ou « pour séduire ».
  rationale: Le verset ne qualifie pas explicitement ces techniques, même si le récit des Veilleurs les présente comme des révélations illicites. La traduction n’ajoute donc pas un jugement absent de la formulation immédiate.
- issue: Interprétation de la proposition textuellement obscure après la liste des armes
  choice: Maintenir une traduction littérale et signaler l’incertitude en note.
  alternative: Adopter la correction contextuelle « leurs métaux et leur travail » ou reformuler « ce qui en résultait ».
  rationale: Le témoin fourni porte une expression obélisée dont le sens demeure incertain. Une conjecture silencieuse résoudrait indûment une difficulté réelle du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La parataxe du guèze est légèrement allégée par deux phrases; l’énumération reste nette. La formulation obscure est préservée dans le texte et expliquée sans être résolue dans la note.
