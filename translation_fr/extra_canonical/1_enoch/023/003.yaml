base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/003.yaml
  text: And I asked[a], saying[b], “What is this that has no rest?”
translation:
  language: fr
  text: 'Et je demandai : « Qu’est-ce que ceci[a], qui n’a aucun repos[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui-ci » ; le démonstratif guèze renvoie au phénomène qu’Hénoch vient de voir.
    reason: lexical_alternative
  - marker: b
    text: « N’a aucun repos » peut aussi se traduire par « est sans répit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልኩ
  choice: je demandai
  rationale: Le parfait à la première personne du singulier exprime une demande directe. Le passé simple convient au registre narratif digne du récit visionnaire.
- source_word: እንዘ እብል
  choice: ':'
  rationale: Cette construction guèze introduit les paroles rapportées. En français actuel, les deux-points rendent naturellement sa fonction quotative sans le calque pesant « en disant ».
- source_word: ዝንቱ
  choice: ceci
  rationale: Le démonstratif désigne le phénomène qu’Hénoch vient d’observer. « Ceci » conserve sa force déictique sans préciser indûment s’il s’agit d’une chose ou d’un être.
- source_word: ምንት ውእቱ
  choice: Qu’est-ce que
  rationale: L’interrogatif suivi de la copule demande l’identité ou la nature du phénomène. Cette tournure est directe et naturelle en français moderne.
- source_word: ዘአልቦ ዕረፍተ
  choice: qui n’a aucun repos
  rationale: La relative associe une négation d’existence ou de possession au nom signifiant « repos ». Cette formulation préserve l’image d’une activité incessante sans l’interpréter davantage.
theological_decisions:
- issue: Faut-il rendre ዕረፍተ par « repos » ou par un terme plus interprétatif comme « paix » ou « cessation » ?
  choice: repos
  alternative: répit ; cessation
  rationale: Le mot désigne ici d’abord le repos ou l’absence d’activité. « Repos » maintient l’image et sa tension sans lui imposer une signification théologique plus précise.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif littéraire ; les deux-points remplacent naturellement la formule quotative guèze. Les notes conservent l’ambiguïté du démonstratif et la nuance possible de l’absence de repos.
