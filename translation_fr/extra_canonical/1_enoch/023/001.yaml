  text: And from there I went to another place[a], toward the west[b], to the ends of the earth.
translation:
  language: fr
  text: De là, je me rendis dans un autre lieu, vers l’ouest, jusqu’aux extrémités de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Expression déictique et ablative qui relie naturellement ce déplacement au lieu décrit auparavant.
- source_word: ሖርኩ
  choice: je me rendis
  rationale: Rend simplement le verbe de mouvement à la première personne tout en conservant le registre digne du récit visionnaire.
- source_word: ካልአ መካነ
  choice: dans un autre lieu
  rationale: Désigne un emplacement distinct du précédent sans imposer l’idée plus précise d’une région ou d’un deuxième lieu dans une série.
- source_word: መንገለ ዓረብ
  choice: vers l’ouest
  rationale: መንገለ exprime la direction, et ዓረብ désigne ici l’ouest, associé au couchant. Cette lecture corrige l’ancienne confusion avec l’est.
- source_word: እስከ አጽናፈ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: Préserve l’image géographique et cosmique du texte apocalyptique ainsi que la forme plurielle de l’expression.
theological_decisions:
- issue: Géographie cosmique du voyage visionnaire
  choice: jusqu’aux extrémités de la terre
  alternative: jusqu’à la lointaine frontière du pays
  rationale: La formulation conserve l’ampleur cosmique de la vision sans la réduire à un déplacement local ni expliquer artificiellement sa cosmologie.
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple convient à la narration écrite, tandis que « se rendre » exprime naturellement le déplacement sans ajouter l’idée d’un long voyage. Aucune note n’est nécessaire : le guèze ዓረብ indique ici l’ouest, et la variante « est » provient d’une traduction antérieure erronée plutôt que d’une ambiguïté réelle du texte source.'
