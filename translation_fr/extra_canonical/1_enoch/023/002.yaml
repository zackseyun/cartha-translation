base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: fr
  text: Et je vis un feu qui brûlait et courait[a] ; il ne se reposait ni ne s’arrêtait dans sa course, de jour comme de nuit[b], mais il continuait ainsi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « courait ». Le verbe peut évoquer un feu qui se déplace rapidement ou qui s’écoule ; traduire « se répandait » ou « coulait » donnerait un français plus courant, mais atténuerait son lien avec « sa course » dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: L’expression « sa course » peut aussi se comprendre comme « son élan », « son parcours » ou « son écoulement » ; elle souligne le mouvement ininterrompu du feu.
    reason: lexical_alternative
  - marker: c
    text: 'La formule finale est difficile et très concise. On pourrait aussi traduire : « mais il en était ainsi » ou « mais toujours de même ».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Conserve la formule de témoignage visionnaire à la première personne dans un français simple et digne.
- source_word: እሳተ
  choice: un feu
  rationale: Introduit naturellement l’objet de la vision, qui n’a pas encore été identifié.
- source_word: ዘይነድድ
  choice: qui brûlait
  rationale: Garde la valeur verbale active de la proposition relative et l’aspect continu suggéré par le contexte.
- source_word: ዘይረውፅ
  choice: et courait
  rationale: Le verbe exprime le fait de courir ou de se mouvoir rapidement. Ce choix préserve aussi son lien lexical avec እምሩፀቱ, « sa course », sans le remplacer par l’idée distincte de flamboyer.
- source_word: እንዘ ኢያዓርፍ
  choice: il ne se reposait pas
  rationale: Rend directement l’absence continue de repos, sans réduire l’image au simple fait que le feu ne s’éteignait pas.
- source_word: ወኢይነትግ
  choice: et n’interrompait pas
  rationale: Dans son parallélisme avec l’absence de repos et devant « sa course », le verbe indique ici que le mouvement ne cessait pas. Cette formulation française évite l’expression moins naturelle « ne cessait pas de sa course ».
- source_word: እምሩፀቱ
  choice: sa course
  rationale: Le nom désigne vraisemblablement le mouvement, l’élan ou le parcours du feu et fait écho au verbe précédent « courait ».
- source_word: መዐልተ ወሌሊተ
  choice: de jour comme de nuit
  rationale: Expression française naturelle d’une action ininterrompue pendant le jour et la nuit.
- source_word: አላ ከማሁሙ
  choice: mais continuait ainsi
  rationale: Exprime la persistance dans le même état tout en signalant en note que la syntaxe concise de la formule finale permet une traduction plus littérale.
