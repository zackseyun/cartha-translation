base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: fr
  text: 'En ce temps-là, Ragouël, l’un des saints anges qui était avec moi, me répondit et me dit : « Cette course de feu que tu as vue vers l’ouest, c’est le feu qui entraîne tous les luminaires du ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሥአኒ
  choice: me répondit
  rationale: Le verbe exprime une réponse dans le cadre du dialogue visionnaire; la formulation française évite la répétition peu naturelle de « répondit et me dit ».
- source_word: ቅዱሳን መላእክት
  choice: saints anges
  rationale: Rend directement la désignation apocalyptique traditionnelle tout en conservant un registre digne et clair.
- source_word: ዝንቱ ዘርኢከ ሩጸተ … እሳት
  choice: Cette course de feu que tu as vue
  rationale: ዘርኢከ signifie « que tu as vue » et ሩጸተ désigne une course ou un mouvement rapide; le feu est le phénomène cosmique décrit. Cette lecture corrige l’ancienne analyse erronée en « esprit qui égare ».
- source_word: መንገለ ዐረብ
  choice: vers l’ouest
  rationale: La locution indique la direction de l’ouest, associée au couchant dans la géographie cosmique de la vision.
- source_word: ይሰድድ
  choice: entraîne
  rationale: Le verbe décrit la mise en mouvement énergique des corps célestes. « Entraîne » est naturel en français et convient mieux ici que « chasse », qui pourrait suggérer leur expulsion.
- source_word: ብርሃናተ ሰማይ
  choice: les luminaires du ciel
  rationale: « Luminaires » désigne clairement les corps lumineux célestes et préserve le registre cosmologique du passage.
theological_decisions:
- issue: Nature de la « course de feu »
  choice: La présenter comme un phénomène cosmique de feu qui met en mouvement les luminaires
  alternative: Y voir un esprit, un vent ou une puissance personnelle qui égare
  rationale: La morphologie de ዘርኢከ (« que tu as vue ») et de ሩጸተ (« course ») ne soutient pas la lecture « esprit qui égare ». La traduction ne personnifie donc pas davantage la force que ne le fait le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’insistance explicative de la proposition « c’est le feu qui… », tandis que « m’accompagnait » rend naturellement la présence de l’ange auprès du voyant.
