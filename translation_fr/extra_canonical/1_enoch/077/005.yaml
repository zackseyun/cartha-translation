base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: fr
  text: Je vis sept fleuves sur la terre, plus grands que tous les autres fleuves ; l’un d’eux vient de l’ouest et déverse ses eaux dans la Grande Mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la grande mer ». L’expression peut être comprise comme une désignation géographique — « la Grande Mer » — ou comme une simple description.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: sept fleuves
  rationale: Le chiffre ፯ (« sept ») appartient explicitement au texte, et le pluriel አፍላገ désigne ici des fleuves ou cours d’eau. « Fleuves » convient au cadre géographique et à leur débouché maritime.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Traduction locative directe, naturelle en français moderne.
- source_word: ርኢኩ
  choice: Je vis
  rationale: Rend simplement le verbe de vision à la première personne tout en conservant la dignité narrative.
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: plus grands que tous les autres fleuves
  rationale: La construction comparative exprime une grandeur supérieure. « Les autres » explicite naturellement en français que la comparaison porte sur le reste des fleuves, sans changer le sens.
- source_word: አሐዱ እምኔሆሙ
  choice: l’un d’eux
  rationale: Rend directement l’expression partitive.
- source_word: ይመጽእ እምዓረብ
  choice: vient de l’ouest
  rationale: Exprime clairement l’origine ou la direction du fleuve, sans ajouter de précision absente du texte.
- source_word: ውስተ ባሕር ዐቢይ
  choice: dans la Grande Mer
  rationale: La formulation peut fonctionner comme une désignation géographique, probablement celle de la Méditerranée. La majuscule conserve cette possibilité.
- source_word: ይከዑ ማዮ
  choice: déverse ses eaux
  rationale: Expression française naturelle qui conserve l’image concrète des eaux versées dans la mer.
theological_decisions:
- issue: Désignation géographique ou description générique pour ባሕር ዐቢይ
  choice: la Grande Mer
  alternative: la grande mer
  rationale: Dans la géographie juive ancienne, « Grande Mer » peut désigner la Méditerranée. Le texte guèze demeure toutefois formellement compatible avec une description générique ; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton visionnaire du récit sans archaïsme marqué. Le point-virgule articule la vision générale et la description du premier fleuve.
