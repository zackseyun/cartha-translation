base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: fr
  text: Le vent venant de l’ouest porte le nom de Hegulā, car c’est là que toutes les lumières du ciel diminuent et descendent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « tous les luminaires du ciel décroissent et se couchent ». La descente évoque probablement leur coucher à l’ouest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋስ
  choice: vent
  rationale: Dans le Livre astronomique, le terme désigne un vent directionnel, et non un esprit.
- source_word: እምዕራብ
  choice: venant de l’ouest
  rationale: La préposition እም indique la provenance; cette formulation la rend clairement en français naturel.
- source_word: ስሙ
  choice: porte le nom de
  rationale: Cette tournure française naturelle conserve la formule de dénomination du texte source.
- source_word: ኀጕላ
  choice: Hegulā
  rationale: Il s’agit du nom propre du vent d’ouest; il est donc translittéré plutôt que traduit.
- source_word: በህየ
  choice: c’est là
  rationale: L’adverbe renvoie à la région occidentale qui vient d’être mentionnée.
- source_word: የሐፅፁ
  choice: diminuent
  rationale: Le verbe ሐፀፀ exprime la diminution ou le déclin. « Diminuent » préserve ce sens sans imposer l’idée d’effacement ou d’extinction.
- source_word: ኵሉ ብርሃናት ሰማይ
  choice: toutes les lumières du ciel
  rationale: Cette expression reste proche de l’image cosmologique du guèze tout en étant immédiatement compréhensible.
- source_word: ወይወርዱ
  choice: et descendent
  rationale: Le verbe exprime fondamentalement un mouvement vers le bas; « descendent » conserve cette image sans la réduire au terme astronomique « se couchent ».
theological_decisions:
- issue: Employer un vocabulaire astronomique technique ou conserver l’image cosmologique apocalyptique
  choice: toutes les lumières du ciel diminuent et descendent
  alternative: tous les luminaires célestes décroissent et se couchent
  rationale: Le contexte évoque vraisemblablement le déclin et le coucher des astres à l’ouest, mais le texte guèze garde une formulation concrète. La traduction conserve cette tension et évite de préciser davantage que la source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la formule cosmologique du texte, tandis que la note signale l’interprétation astronomique probable sans l’introduire directement dans le verset.
