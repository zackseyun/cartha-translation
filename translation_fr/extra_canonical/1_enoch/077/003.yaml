base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: fr
  text: 'Et le quatrième vent, appelé Mesʿ[a], est divisé en trois parties : l’une d’elles est une demeure pour les humains ; une autre se trouve dans les mers d’eau[b], les vallées[c], les régions désertiques[d], les cours d’eau, les ténèbres et la brume[e] ; la troisième se trouve dans le jardin de justice[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Mesʿ » est translittéré de l’éthiopien guèze. Son sens est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les mers d’eau ». Cette tournure peut simplement désigner les mers, mais l’expression complète reflète le texte guèze.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les ravins » ; le relief exact visé par le terme est incertain.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « le désert », « les terres arides ».'
    reason: lexical_alternative
  - marker: e
    text: Le terme peut aussi désigner le brouillard, la nuée ou une vapeur atmosphérique comparable.
    reason: lexical_alternative
  - marker: f
    text: L’expression peut évoquer l’Éden ou le paradis, mais le texte dit simplement « le jardin de justice ».
    reason: cross_reference
lexical_decisions:
- source_word: ራብዕ ነፋስ
  choice: le quatrième vent
  rationale: L’ordinal introduit le quatrième vent d’une série cosmologique ; « vent » convient ici mieux que « esprit » ou « souffle ».
- source_word: ዘስሙ መስዕ
  choice: appelé Mesʿ
  rationale: Le texte éthiopien donne explicitement un nom propre. Celui-ci est translittéré plutôt que remplacé dans le texte principal par une identification interprétative comme « le Nord ».
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: se divise en trois parties
  rationale: Cette formulation française naturelle conserve la répartition tripartite exprimée par le passif éthiopien.
- source_word: አሐዱ እምኔሆሙ ማኅደር ለሰብእ
  choice: l’une d’elles est une demeure pour les humains
  rationale: « Demeure » rend le lieu d’habitation, tandis que « les humains » exprime la valeur collective de ሰብእ sans restriction masculine inutile.
- source_word: አብሕርት ማይ
  choice: les mers d’eau
  rationale: Le pléonasme apparent est maintenu parce que l’éthiopien nomme expressément l’eau après les mers.
- source_word: ቀላያት
  choice: les vallées
  rationale: Le terme peut désigner des dépressions ou terrains encaissés ; « vallées » reste clair sans préciser excessivement le relief.
- source_word: ፆም
  choice: les régions désertiques
  rationale: Cette expression rend un espace désolé ou désert et évite l’ambiguïté moderne de « désert », qui pourrait suggérer uniquement une étendue de sable.
- source_word: አፍላግ
  choice: les fleuves
  rationale: Terme courant pour des cours d’eau importants ou des chenaux ; « fleuves » convient au registre cosmologique du passage.
- source_word: ጽልመት
  choice: les ténèbres
  rationale: Le pluriel français idiomatique conserve la portée cosmique et imagée du terme.
- source_word: ጊሜ
  choice: la brume
  rationale: Le mot désigne vraisemblablement un phénomène atmosphérique vaporeux, mais sa nuance précise reste incertaine.
- source_word: ገነት ጽድቅ
  choice: le jardin de justice
  rationale: Rendu littéral qui préserve l’expression éthiopienne sans l’identifier d’office à l’Éden ou au paradis.
theological_decisions:
- issue: Identification de Mesʿ
  choice: Conserver « Mesʿ » comme nom dans le texte principal.
  alternative: Traduire ou identifier le nom par « le Nord ».
  rationale: Le texte source présente መስዕ comme un nom. Son identification au Nord peut être signalée, mais ne doit pas remplacer silencieusement la forme transmise.
- issue: Référence du « jardin de justice »
  choice: Conserver l’expression littérale sans préciser son identité.
  alternative: Écrire « l’Éden » ou « le paradis ».
  rationale: Le passage peut évoquer un lieu édénique ou paradisiaque, mais l’éthiopien ne tranche pas explicitement entre ces identifications.
- issue: Rapport spatial de la deuxième partie du vent aux domaines énumérés
  choice: « se trouve au-dessus de »
  alternative: « se trouve dans » ou « règne sur ».
  rationale: La préposition éthiopienne permet une relation spatiale ou de domaine. « Au-dessus de » préserve l’image cosmologique sans introduire explicitement une domination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la structure tripartite du guèze tout en évitant les lourdeurs inutiles. Les termes cosmologiques et les ambiguïtés lexicales importantes sont conservés ou signalés en note.
