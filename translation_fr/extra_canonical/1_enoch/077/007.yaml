base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: fr
  text: 'Quant aux quatre restants, ils sortent du côté nord jusqu’à leur mer[a] : deux jusqu’à la mer Érythrée[b][d], et deux jusqu’à la Grande Mer[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « vers leur mer ». La préposition guèze peut exprimer aussi bien la limite atteinte que la destination.'
    reason: lexical_alternative
  - marker: b
    text: La « mer Érythrée » est une ancienne désignation géographique dont l’étendue pouvait dépasser ce que l’on appelle aujourd’hui la mer Rouge.
    reason: cultural_note
  - marker: c
    text: La « Grande Mer » est une désignation antique traditionnelle, qui renvoie généralement à la Méditerranée.
    reason: cultural_note
  - marker: d
    text: Le témoin guèze présente autour de « deux… et deux » une répétition entre parenthèses qui peut signaler une perturbation de copie ou une division emphatique. La traduction en restitue le sens apparent.
    reason: textual_variant
lexical_decisions:
- source_word: እለ ተርፉ
  choice: les quatre autres
  rationale: Avec le numéral qui suit, cette formulation naturelle désigne le groupe restant tout en conservant le décompte du passage.
- source_word: አርባዕቱ
  choice: quatre
  rationale: Le nombre explicite est maintenu, car il structure la description cosmographique.
- source_word: ይወፅኡ
  choice: ils sortent
  rationale: Le verbe exprime directement un mouvement vers l’extérieur et préserve l’imagerie directionnelle.
- source_word: በገቦ መስዕ
  choice: du côté nord
  rationale: Cette expression rend l’orientation spatiale sans imposer un vocabulaire astronomique technique incertain.
- source_word: እስከ ባሕረ ዚአሆሙ
  choice: jusqu’à leur propre mer
  rationale: « Jusqu’à » conserve la valeur d’étendue ou de limite de እስከ, tandis que « leur propre mer » maintient l’étrange relation possessive du texte.
- source_word: ባሕረ ኤርትራ
  choice: la mer Érythrée
  rationale: « Érythrée » est en français le nom historique usuel correspondant à cette désignation géographique ancienne, sans la réduire d’emblée à la seule mer Rouge moderne.
- source_word: ባሕር ዓቢይ
  choice: la Grande Mer
  rationale: La désignation antique est conservée dans le texte plutôt que remplacée par « Méditerranée ».
theological_decisions:
- issue: Langage cosmographique du Livre astronomique
  choice: Conserver les noms schématiques des mers et l’orientation du mouvement
  alternative: Remplacer les désignations antiques par des équivalents géographiques modernes ou généraliser en parlant d’océans
  rationale: Cette formulation respecte la représentation cosmographique propre au passage et évite de la conformer silencieusement à la géographie moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du guèze, tandis que les notes préservent l’ambiguïté prépositionnelle, la portée des noms géographiques anciens et l’incertitude textuelle.
