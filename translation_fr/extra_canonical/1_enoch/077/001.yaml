base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: fr
  text: Ils appellent le premier vent « celui du levant »[a], parce qu’il est le premier ; et ils appellent le deuxième « le sud », parce que le Très-Haut y descend et que, là tout particulièrement, Celui qui est béni pour toujours descend.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression rend littéralement un terme lié à l’aurore ou au matin, employé ici pour désigner l’est.
    reason: lexical_alternative
  - marker: b
    text: 'La seconde moitié du verset est difficile. On peut aussi comprendre la fin ainsi : « et il y descend tout particulièrement, béni pour toujours ».'
    reason: textual_variant
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: ils appellent
  rationale: Le verbe désigne l’action de nommer. La tournure active conserve le style descriptif et impersonnel de l’exposé.
- source_word: ለነፋስ
  choice: le vent
  rationale: Le sens premier est « vent ». Même si les vents représentent ici des directions cosmiques, conserver « vent » préserve l’image du texte.
- source_word: ቀዳማዊ
  choice: le premier
  rationale: L’ordinal est direct et sa répétition dans l’explication est maintenue.
- source_word: ለጽባሓዊ
  choice: celui du levant
  rationale: Le terme est lié au matin ou à l’aurore et prend ici un sens directionnel. « Celui du levant » garde à la fois sa forme adjectivale substantivée et son imagerie, tout en restant naturel en français.
- source_word: እስመ
  choice: parce que
  rationale: Conjonction causale introduisant l’explication du nom.
- source_word: ውእቱ
  choice: il est
  rationale: Le pronom copule soutient l’affirmation explicative « il est le premier ».
- source_word: ለካልእ
  choice: le deuxième
  rationale: Dans cette énumération, le terme a une valeur ordinale plutôt que le simple sens de « l’autre ».
- source_word: አዜብ
  choice: le sud
  rationale: Le mot désigne la direction ou région méridionale. « Le sud » est l’équivalent français le plus clair, tandis que la mention du vent conserve le cadre cosmologique.
- source_word: ልዑል
  choice: le Très-Haut
  rationale: Titre divin traditionnel et naturel en français, qui maintient le registre élevé sans ajouter de précision confessionnelle.
- source_word: ህየ
  choice: y / là
  rationale: Adverbe locatif renvoyant à la région du sud. Sa répétition est rendue par deux formes françaises naturelles.
- source_word: ይወርድ
  choice: descend
  rationale: Le verbe exprime littéralement un mouvement de descente. Ce choix préserve l’imagerie verticale et théophanique du passage.
- source_word: ወፈድፋደ
  choice: tout particulièrement
  rationale: La forme difficile semble renforcer la seconde proposition. Cette expression restitue l’intensification sans imposer une nuance trop précise.
- source_word: ቡሩክ፡ ለዓለም
  choice: Celui qui est béni pour toujours
  rationale: La séquence peut fonctionner comme un titre divin substantivé, sujet du second « descend », en parallèle avec « le Très-Haut ».
theological_decisions:
- issue: Faut-il conserver la descente du Très-Haut comme mouvement théophanique littéral ou l’expliquer comme l’envoi d’une bénédiction ou de chaleur ?
  choice: le Très-Haut y descend
  alternative: le Très-Haut y fait descendre [la bénédiction ou la chaleur]
  rationale: Le guèze associe explicitement le titre divin au verbe « descendre ». L’image apocalyptique doit être conservée plutôt que rationalisée par une paraphrase météorologique.
- issue: Fonction de ቡሩክ፡ ለዓለም dans la dernière proposition
  choice: Celui qui est béni pour toujours descend
  alternative: il descend, béni pour toujours
  rationale: La construction se prête à une lecture substantivée où le titre constitue le sujet explicite du second verbe, en parallèle avec « le Très-Haut ». La note signale néanmoins l’autre analyse grammaticale possible.
translation_notes:
  register: Français moderne, international et digne. La syntaxe garde le parallélisme et la répétition du guèze, tout en évitant une formulation archaïque. Les guillemets clarifient que « celui du levant » et « le sud » sont les noms donnés aux vents.
