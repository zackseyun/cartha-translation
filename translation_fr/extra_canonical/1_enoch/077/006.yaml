base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: fr
  text: Tous deux viennent du nord jusqu’à la mer et déversent leurs eaux dans la mer Érythrée, à l’est.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « mer Érythrée » est un nom géographique ancien dont l’étendue pouvait être plus large que celle de l’actuelle mer Rouge.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: Tous deux
  rationale: La répétition exprime nettement la dualité. « Tous deux » la rend en français naturel sans alourdir la phrase.
- source_word: ይመጽኡ፡
  choice: viennent
  rationale: Le verbe courant de mouvement convient à la description du parcours des deux cours d’eau.
- source_word: እመስዕ፡
  choice: du nord
  rationale: Dans ce contexte cosmographique, መስዕ désigne le nord. Cette lecture correspond au système des points cardinaux du chapitre et évite la confusion avec « midi/sud » ou « ouest ».
- source_word: እስከ፡ ባሕር፡
  choice: jusqu’à la mer
  rationale: እስከ marque ici la limite atteinte ou la destination; « jusqu’à » en conserve la valeur spatiale.
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: et déversent leurs eaux
  rationale: Le verbe évoque l’action de verser ou de répandre. « Déversent » est naturel pour des cours d’eau et garde la vigueur de l’image.
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: dans la mer Érythrée, à l’est
  rationale: Le texte nomme explicitement la mer Érythrée et lui associe l’indication orientale. Le nom ancien est conservé plutôt que remplacé par une identification géographique moderne.
