base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: fr
  text: Je vis sept hautes montagnes, plus élevées que toutes les montagnes qui sont sur la terre. D’elles sort le givre, et les jours, les saisons et les années passent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jours, les temps et les années passent ». Le terme traduit par « saisons » peut aussi désigner des temps ou des périodes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: sept hautes montagnes
  rationale: Le numéral et le nom sont directs. « Hautes » rend la racine exprimant ici la hauteur, confirmée par la comparaison qui suit.
- source_word: ርኢኩ
  choice: Je vis
  rationale: Formule visionnaire simple à la première personne, sans ajouter la conjonction « et », absente du texte guèze.
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: plus élevées que toutes les montagnes qui sont sur la terre
  rationale: La formulation explicite la comparaison de hauteur tout en gardant la portée terrestre générale du passage.
- source_word: ወእምኔሆሙ ይወፅእ
  choice: D’elles sort
  rationale: Le verbe décrit ce qui émerge ou sort d’une provenance; cette tournure conserve l’image physique avec un français naturel.
- source_word: አሰሐትያ
  choice: le givre
  rationale: Dans ce contexte météorologique, le terme désigne vraisemblablement le givre ou la gelée blanche. « Givre » conserve l’image d’un dépôt glacé et reste courant.
- source_word: ወየኀልፍ
  choice: passent
  rationale: Avec les termes temporels qui suivent, le verbe exprime l’écoulement du temps, sans idée de destruction.
- source_word: መዋዕለ ወዘመን ወዓመት
  choice: les jours, les temps fixés et les années
  rationale: « Temps fixés » garde la largeur sémantique de ዘመን tout en faisant entendre, dans ce contexte calendaire, des périodes déterminées; « saisons » demeure possible.
theological_decisions:
- issue: Fonction cosmologique des sept montagnes
  choice: Conserver côte à côte la géographie visionnaire, la sortie du givre et l’écoulement des cycles temporels, sans préciser leur mécanisme.
  alternative: Interpréter les montagnes soit comme de simples montagnes terrestres, soit comme des régions célestes gouvernant le temps.
  rationale: Le texte associe ces éléments sans expliquer leur rapport. La traduction préserve cette tension et n’impose ni lecture strictement littérale ni lecture symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit visionnaire écrit. La ponctuation scinde la longue coordination guèze sans modifier ses rapports. Le marqueur [a] porte sur la dernière proposition et figure bien dans le texte principal.
