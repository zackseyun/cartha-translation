  naturalness: La syntaxe est naturelle et le registre convient. « De grandes et dures paroles » est une formulation française compréhensible, volontairement proche de l’idiome hénochique, et la note en explicite la portée.
  terminology: « Colère », « justice », « supplier » et « paix » sont appropriés. Le maintien de « grandes et dures » préserve le vocabulaire technique/idiomatique du passage sans le réduire à une interprétation telle que « orgueilleuses » ou « insolentes ».
