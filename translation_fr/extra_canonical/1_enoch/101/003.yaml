base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: fr
  text: Et s’il envoie sa colère contre vous à cause de toutes vos actions, ne le supplierez-vous pas ? Car vous prononcez contre sa justice de grandes et dures paroles[a], et vous n’avez pas de paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de grandes et dures paroles ». Cette expression hénochique désigne des propos démesurés et offensants.'
    reason: idiome_source
lexical_decisions:
- source_word: ፈነወ
  choice: déchaîne
  rationale: Le verbe signifie envoyer ou laisser partir. Avec la colère comme objet, « déchaîne » rend naturellement l’idée d’une colère dirigée contre les destinataires, sans expliciter davantage le sujet pronominal.
- source_word: መዐቶ
  choice: sa colère
  rationale: « Colère » est le terme français courant et digne qui conserve ici la portée judiciaire du contexte apocalyptique.
- source_word: በኵሉ ምግባሪክሙ
  choice: à cause de toutes vos actions
  rationale: La préposition introduit le motif du jugement et « actions » rend clairement l’ensemble de la conduite des destinataires.
- source_word: አኮ አንትሙ እለ ታስተበቍዕዎ
  choice: ne le supplierez-vous pas ?
  rationale: አኮ est compris comme introduisant une question rhétorique attendant une réponse affirmative. La tournure française conserve cette force sans l’expression lourde « ne serez-vous pas ceux qui… ».
- source_word: ጽድቅ ዚአሁ
  choice: sa justice
  rationale: Dans ce contexte de colère et de jugement, « justice » exprime naturellement la rectitude morale et judiciaire de Dieu. Le terme ne se limite pas à une décision de tribunal.
- source_word: ዐቢይተ ወጽኑዓተ
  choice: grandioses et dures
  rationale: Cette traduction reste proche des adjectifs « grandes » et « dures ». « Grandioses » signale le caractère démesuré des paroles sans substituer directement l’interprétation « orgueilleuses ».
- source_word: አልብክሙ ሰላመ
  choice: vous n’avez pas de paix
  rationale: La formulation conserve la brièveté et la force de la sentence prophétique.
theological_decisions:
- issue: Valeur de አኮ dans la proposition sur la supplication
  choice: 'question rhétorique : « ne le supplierez-vous pas ? »'
  alternative: 'déclaration négative : « vous ne pouvez pas le supplier »'
  rationale: Dans la séquence interrogative, አኮ peut marquer une question attendant l’assentiment. Cette lecture exprime que, lorsque la colère viendra, les pécheurs supplieront celui qui juge, plutôt que d’affirmer leur incapacité à le faire.
- issue: Traduction de ጽድቅ dans un contexte judiciaire
  choice: sa justice
  alternative: sa droiture
  rationale: Le contexte de colère envoyée à cause des actions met en avant la dimension judiciaire. « Justice » garde néanmoins en français une portée morale assez large et n’impose pas une doctrine particulière.
- issue: Identification de celui qui envoie la colère
  choice: 'sujet pronominal implicite : « il » dans « s’il déchaîne »'
  alternative: « si Dieu déchaîne » ou « si le Seigneur déchaîne »
  rationale: Le texte source emploie un sujet pronominal. Ne pas ajouter de nom divin préserve la forme du témoin, tandis que le contexte permet d’identifier le référent.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, ainsi que la formule prophétique finale. « Grandioses et dures » maintient l’étrangeté signifiante de l’idiome hénochique, explicitée en note.
