base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: fr
  text: N’avez-vous pas vu les capitaines des navires, ballottés par les vagues, tandis que leurs navires sont secoués par les vents et qu’ils sont dans la détresse ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: N’avez-vous pas vu
  rationale: La forme négative interrogative introduit une question rhétorique adressée directement aux lecteurs.
- source_word: ለተነገሥተ፡ አሕማር
  choice: les capitaines des navires
  rationale: Dans ce contexte maritime, l’expression désigne les chefs ou commandants des navires, plutôt que des « rois des navires ».
- source_word: እፎ፡ ይትሀወኩ
  choice: ballottés
  rationale: Le verbe exprime une agitation violente; « ballottés » rend naturellement le mouvement subi en mer.
- source_word: እምገደ
  choice: par les vagues
  rationale: Le texte transmis paraît refléter une forme altérée ou fautive correspondant à « par les vagues », lecture cohérente avec l’image maritime et l’adjudication philologique fournie.
- source_word: ወያንቀለቅሉ
  choice: sont secoués
  rationale: Le verbe évoque le fait d’être ébranlé ou violemment agité.
- source_word: እምነፋሳት
  choice: par les vents
  rationale: Le pluriel renvoie ici aux vents comme agents qui secouent les navires.
- source_word: አሕማሮሙ
  choice: leurs navires
  rationale: Il s’agit du pluriel de « navire » muni du suffixe possessif de troisième personne du pluriel, et non du mot désignant les âmes.
- source_word: ወይትመነደቡ
  choice: et qu’ils sont dans la détresse
  rationale: La finale décrit l’affliction ou la profonde inquiétude des capitaines sans amplifier le sens jusqu’à la terreur absolue.
theological_decisions:
- issue: Danger maritime littéral ou image de l’instabilité des puissants
  choice: Conserver dans le texte l’image concrète de capitaines affrontant les vagues et les vents.
  alternative: Expliciter une métaphore du jugement et de l’effondrement de la sécurité des puissants.
  rationale: Le guèze présente directement une scène maritime. Sa portée morale ou symbolique peut rester implicite afin de ne pas résoudre artificiellement la tension apocalyptique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la question rhétorique et distingue les capitaines, ballottés, de leurs navires, secoués par les vents. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
