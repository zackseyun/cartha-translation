base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: fr
  text: S’il ferme les fenêtres du ciel[a] et retient la pluie et la rosée pour qu’elles ne descendent pas sur la terre à cause de vous, que ferez-vous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les fenêtres du ciel » appartient à l’imagerie cosmologique ancienne qui représente la pluie comme venant par des ouvertures célestes. L’image est conservée plutôt que remplacée par une formulation météorologique moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ዐፀወ
  choice: ferme
  rationale: Le verbe exprime l’action de fermer. « Ferme » convient naturellement aux « fenêtres du ciel » et conserve l’image concrète du texte.
- source_word: መስኮተ ሰማይ
  choice: les fenêtres du ciel
  rationale: Cette formulation préserve l’image cosmologique ancienne d’ouvertures célestes par lesquelles vient la pluie, ainsi que sa résonance biblique.
- source_word: ከለአ ዝናመ
  choice: retient la pluie
  rationale: Le verbe indique que la pluie est empêchée ou retenue. « Retient » exprime sobrement cette maîtrise sans ajouter d’explication.
- source_word: ወጠለ
  choice: et la rosée
  rationale: La rosée est associée à la pluie comme autre source d’humidité indispensable à la terre; les deux éléments sont conservés.
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: pour qu’elles ne descendent pas sur la terre
  rationale: Le français reprend le mouvement de descente présent dans le guèze. Le pluriel féminin renvoie naturellement à « la pluie et la rosée », même si la forme verbale source est au singulier.
- source_word: በእንቲአክሙ
  choice: à cause de vous
  rationale: Dans ce contexte de jugement, la locution exprime la cause imputée aux destinataires, sans développer davantage cette relation.
- source_word: ሚሀለወክሙ ትግበሩ
  choice: que ferez-vous ?
  rationale: La question rhétorique met les destinataires face à leur impuissance. Cette formulation française est directe et fidèle, sans ajouter un « alors » absent du texte.
theological_decisions:
- issue: Identité de celui qui ferme le ciel
  choice: Maintenir le sujet pronominal singulier « il ».
  alternative: Expliciter « Dieu » ou « le Seigneur ».
  rationale: Le guèze emploie un sujet singulier sans le nommer dans ce verset. Le pronom préserve cette syntaxe et n’introduit aucun titre divin absent du témoin, même si le contexte suggère une action divine.
- issue: Portée de « à cause de vous »
  choice: Conserver la locution à sa place vers la fin de la proposition conditionnelle.
  alternative: La déplacer près de « retient » pour rendre explicite que la sécheresse est un jugement provoqué par les destinataires.
  rationale: La position retenue suit de près l’ordre du texte et conserve une légère souplesse d’attachement, tout en laissant clairement entendre que la privation d’eau survient à cause des destinataires.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image ancienne, la condition initiale sans ajouter « et », ainsi que la question rhétorique finale. Le vocabulaire reste concret et évite d’expliciter l’identité du sujet au-delà du texte source.
