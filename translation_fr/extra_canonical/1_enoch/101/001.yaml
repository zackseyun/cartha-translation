base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: fr
  text: Observez le ciel[a], fils du ciel, ainsi que toute œuvre du Très-Haut ; craignez-le et ne faites pas le mal devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Considérez attentivement le ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቅዋ
  choice: Observez
  rationale: Dans ce contexte, l’impératif appelle à regarder attentivement ou à considérer, plutôt qu’à poser une question. « Observez » conserve la force exhortative et convient au parallélisme du passage.
- source_word: ለሰማይ
  choice: le ciel
  rationale: « Le ciel » préserve le registre cosmique et apocalyptique ; ici, il fonctionne comme objet de l’observation.
- source_word: ውሉደ ሰማይ
  choice: fils du ciel
  rationale: Cette traduction littérale maintient l’expression élevée et son référent volontairement indéterminé, sans décider s’il s’agit d’humains ou d’êtres célestes.
- source_word: ወኵሎ ግብር ለልዑል
  choice: ainsi que toute œuvre du Très-Haut
  rationale: La conjonction coordonne « le ciel » et « toute œuvre » comme objets de l’exhortation. « Œuvre » garde l’étendue du terme, et « le Très-Haut » rend naturellement le titre divin.
- source_word: ወፍርሁ እምኔሁ
  choice: craignez-le
  rationale: La formulation conserve à la fois les nuances de crainte et de révérence propres au registre biblique.
- source_word: ወኢትግበሩ እኩየ በቅድሜሁ
  choice: et ne faites pas le mal devant lui
  rationale: Cette traduction garde l’interdiction morale ainsi que l’expression spatiale et relationnelle évoquant la présence et le regard divins.
theological_decisions:
- issue: Identité des « fils du ciel »
  choice: Conserver littéralement « fils du ciel »
  alternative: « enfants du ciel » ou « êtres célestes »
  rationale: Le texte ne précise pas sans ambiguïté l’identité des destinataires. La traduction ne doit pas trancher entre une désignation métaphorique d’humains et celle d’êtres célestes.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme exhortatif est conservé, de même que le titre divin traditionnel « le Très-Haut » et l’ambiguïté de « fils du ciel ».
