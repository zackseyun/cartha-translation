base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: fr
  text: 'Et c’est pourquoi ils ont peur[a] : tous leurs biens précieux s’en vont avec eux en mer, et ils ne pensent à rien de bon dans leur cœur[b], car la mer les engloutira et ils y sombreront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire les verbes de cette phrase au futur : « ils auront peur… tous leurs biens précieux s’en iront avec eux en mer » ; l’imparfait éthiopien peut recevoir une valeur présente ou future selon le contexte.'
    reason: temporal_ambiguity
  - marker: b
    text: 'Autre compréhension possible : « et ils ne songent pas, en leur cœur, à leurs biens ». Le terme traduit par « bon » peut désigner le bien en général ou reprendre les biens précieux mentionnés juste avant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈርሁ
  choice: ils ont peur
  rationale: L’imparfait éthiopien poursuit ici la description générale, au présent, des marins confrontés au danger; « avoir peur » est naturel en français moderne.
- source_word: ኵሉ፡ ንዋዮሙ፡ ሠናይ
  choice: tous leurs biens précieux
  rationale: ንዋይ désigne les biens ou les possessions, et ሠናይ les qualifie ici comme bons, beaux ou précieux.
- source_word: ይወፅእ፡ ውስተ፡ ባሕር፡ ምስሌሆሙ
  choice: partent avec eux sur la mer
  rationale: Le verbe signifie littéralement « sortir, partir ». Cette formulation conserve le mouvement et l’accompagnement sans introduire un passif absent du texte.
- source_word: ወሠናየ፡ ኢይሐልዩ፡ በልቦሙ
  choice: et ils n’ont aucune bonne pensée dans leur cœur
  rationale: La proposition décrit naturellement l’absence de pensée favorable ou d’espoir au milieu de la terreur. La note conserve l’autre possibilité, où ሠናየ renvoie aux biens déjà mentionnés.
- source_word: ባሕር፡ ይውኅጦሙ
  choice: la mer les engloutira
  rationale: « Engloutir » garde l’image concrète et vigoureuse de la mer qui avale les marins.
- source_word: ወይትኀጐሉ፡ ውስቴታ
  choice: et ils y sombreront
  rationale: Dans ce contexte maritime, « sombrer » exprime de façon concise leur perte dans la mer tout en conservant le complément locatif.
theological_decisions:
- issue: Sens de la proposition concernant ce qu’ils pensent dans leur cœur
  choice: Elle décrit leur incapacité à avoir une pensée favorable ou porteuse d’espoir face au danger.
  alternative: 'Elle peut renvoyer à leurs biens précieux : ils ne pensent pas à leurs biens dans leur cœur.'
  rationale: Le mot ሠናየ peut désigner ce qui est bon ou reprendre les « biens précieux » de la proposition précédente. Le texte principal suit le sens psychologique adapté à la scène, tandis que la note préserve l’ambiguïté sans transformer la phrase en reproche moral.
- issue: Valeur temporelle des imparfaits éthiopiens
  choice: Présent descriptif pour la peur et le départ des biens, puis futur français dans la proposition causale annonçant l’issue redoutée.
  alternative: Tout rendre au futur comme une prédiction.
  rationale: Le contexte décrit de manière générale l’expérience des marins dans la tempête. Le futur final exprime naturellement, en français, le péril qu’ils envisagent comme imminent.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image maritime et la progression de la peur vers l’engloutissement, sans imposer une lecture moralisatrice à la proposition ambiguë.
