base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: fr
  text: N’est-ce pas lui qui a fait le ciel et la terre, et tout ce qui s’y trouve[a] ? Qui a donné l’enseignement et la sagesse à tous ceux qui se déplacent sur la terre et à ceux qui sont en mer[b] ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui est en eux ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner les navigateurs ou, plus largement, ceux qui sont associés à la mer ; le guèze est concis.
    reason: lexical_alternative
  - marker: c
    text: 'Certains rendent le début de la seconde question par : « Et qui a donné » ; le texte guèze commence directement par « Qui ».'
    reason: previous_rendering
lexical_decisions:
- source_word: አኮኑ
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique appelant une réponse affirmative, dans un français naturel.
- source_word: ገብረ
  choice: a fait
  rationale: Rend le verbe général « faire » sans lui imposer le sens plus technique de « créer ».
- source_word: ሰማየ ወምድረ
  choice: le ciel et la terre
  rationale: Suit le singulier du guèze et conserve la formule englobant l’ordre créé.
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: avec tout ce qui s’y trouve
  rationale: Exprime naturellement la totalité de ce qui est en eux; « y » renvoie collectivement au ciel et à la terre.
- source_word: ወሀበ
  choice: a donné
  rationale: Le passé composé s’accorde naturellement avec « a fait » et exprime l’action accomplie.
- source_word: ትምህርተ
  choice: enseignement
  rationale: Conserve l’idée d’un savoir ou d’une instruction transmis.
- source_word: ወጥበበ
  choice: et sagesse
  rationale: Rend le second nom coordonné sans réduire son ampleur à une simple habileté.
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: à tous ceux qui se déplacent sur la terre
  rationale: Préserve l’idée générale de mouvement sans limiter explicitement les référents aux humains ni les assimiler à de simples habitants.
- source_word: ወለእለ ባሕር
  choice: et à ceux qui sont en mer
  rationale: Maintient le contraste entre terre et mer dans une formulation française naturelle, tout en laissant ouverte l’identité précise des référents.
theological_decisions:
- issue: Choix entre le verbe général « faire » et le terme doctrinalement plus précis « créer »
  choice: a fait
  alternative: a créé
  rationale: Le verbe guèze a un sens large. « A fait » respecte la formulation source sans introduire une précision technique absente du lexème.
- issue: Portée des bénéficiaires de l’enseignement et de la sagesse
  choice: tous ceux qui se déplacent sur la terre et ceux qui sont en mer
  alternative: tous les êtres vivants sur terre et dans la mer
  rationale: Le texte reste large et ne dit pas explicitement s’il vise seulement les humains, tous les êtres vivants ou les navigateurs; la traduction préserve cette tension.
- issue: Lien syntaxique entre les deux questions
  choice: Qui a donné
  alternative: Et qui a donné
  rationale: Le guèze introduit directement l’interrogatif መኑ, sans conjonction; l’absence de « Et » conserve la brusque reprise rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions rhétoriques sont conservées. « Ceux qui se déplacent » maintient la portée large du texte, tandis que « en mer » reste idiomatique sans trancher entre navigateurs et êtres marins.
