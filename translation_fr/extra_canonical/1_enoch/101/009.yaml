lexical_decisions:
- source_word: አኮኑ
  choice: ne… pas ?
  rationale: Introduit une question rhétorique appelant une réponse affirmative; la tournure française « ne… pas ? » en préserve la force.
- source_word: ውእቶሙ
  choice: ces
  rationale: Rend la valeur démonstrative du terme devant le groupe nominal.
- source_word: ተነገሥተ አሕማር
  choice: rois des navires
  rationale: Suit de près la forme transmise, littéralement comprise comme « rois des navires », et conserve la répétition de cette expression dans le contexte; le sens fonctionnel probable est signalé en note.
- source_word: ይፈርህዋ ለባሕር
  choice: craignent la mer
  rationale: Rend directement le verbe de crainte et son objet, tout en permettant de répéter le même verbe dans les deux membres.
- source_word: ወኃጥኣን
  choice: tandis que les pécheurs
  rationale: Exprime naturellement en français la valeur contrastive de la conjonction dans cette question admonitrice.
- source_word: ለልዑል
  choice: le Très-Haut
  rationale: Titre divin biblique courant, clair et digne, correspondant au sens de « le plus élevé ».
- source_word: ኢይፈርህዎ
  choice: ne craignent pas
  rationale: La répétition de « craindre » reproduit le parallélisme rhétorique exact avec la crainte de la mer.
theological_decisions:
- issue: Interprétation de ልዑል comme titre divin
  choice: le Très-Haut
  alternative: l'Exalté
  rationale: Dans ce contexte, le mot désigne Dieu par un titre; « le Très-Haut » est l'équivalent français biblique le plus naturel sans ajouter de précision doctrinale.
- issue: Contraste entre la crainte de la mer et celle de Dieu
  choice: répéter le verbe « craindre »
  alternative: employer « redouter » pour la mer et « révérer » pour Dieu
  rationale: Le guèze emploie le même verbe dans les deux membres; conserver cette répétition préserve la tension voulue sans distinguer artificiellement deux sortes de crainte.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction reste proche de la formulation guèze dans le texte et place en note l’interprétation fonctionnelle probable de l’expression difficile.
