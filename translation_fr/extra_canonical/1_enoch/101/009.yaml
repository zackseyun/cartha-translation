  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
translation:
  language: fr
  text: Ces rois de la mer ne craignent-ils pas la mer[a], tandis que les pécheurs ne craignent pas le Très-Haut ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze « rois de la mer » est textuellement difficile. Elle désigne probablement les marins ou ceux qui naviguent sur la mer.
