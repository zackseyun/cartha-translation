base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: fr
  text: À sa réprimande, elle prendra peur et se desséchera[a] ; tous ses poissons mourront, ainsi que tout ce qui se trouve en elle. Mais vous, pécheurs qui êtes sur la terre, vous ne le craignez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « elle » désigne vraisemblablement la mer ou les eaux mentionnées au verset précédent.
    reason: cross_reference
  - marker: b
    text: 'Le guèze distingue ici la mer au féminin de Dieu au masculin : la mer prend peur à sa réprimande, mais les pécheurs ne le craignent pas.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: በተግሣጹ
  choice: À sa réprimande
  rationale: Le suffixe -u est masculin singulier et renvoie à Dieu, tandis que les formes féminines qui suivent renvoient à la mer. « À » restitue naturellement la valeur circonstancielle de በ ; « réprimande » conserve la force judiciaire du terme.
- source_word: ትፈርህ
  choice: elle prendra peur
  rationale: Le féminin singulier renvoie à la mer du contexte précédent. Cette formulation préserve la personnification et la valeur prospective sans renforcer le verbe en « trembler ».
- source_word: ትየብስ
  choice: se desséchera
  rationale: Le verbe exprime le fait de devenir sec ; ce choix convient à une étendue d’eau et maintient l’image de jugement.
- source_word: ዓሣቲሃ
  choice: ses poissons
  rationale: Le suffixe féminin est explicitement conservé et renvoie à la mer.
- source_word: ይመውት
  choice: mourront
  rationale: Rendu direct et concret, adapté aux conséquences annoncées.
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: tout ce qui se trouve en elle
  rationale: La formule rend clairement l’ensemble du contenu de la mer sans ajouter l’idée d’y habiter.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Terme moral et apocalyptique standard, conservé sans atténuation.
- source_word: እለ ዲበ ምድር
  choice: qui êtes sur la terre
  rationale: Traduction directe de la relation locative, sans ajouter « habitez ».
- source_word: ኢትፈርህዎ
  choice: vous ne le craignez pas
  rationale: Le suffixe objet -wo est masculin singulier et renvoie à Dieu, par contraste avec les formes féminines relatives à la mer.
theological_decisions:
- issue: Distinction entre le référent masculin et la mer au féminin
  choice: « sa » et « le » renvoient à Dieu ; « elle » et « ses » renvoient à la mer.
  alternative: Faire renvoyer tous les pronoms à la mer.
  rationale: 'La morphologie guèze distingue le suffixe masculin de በተግሣጹ et celui de ኢትፈርህዎ des verbes et suffixes féminins décrivant la mer. Cette distinction fonde le contraste : la création craint Dieu, mais les pécheurs ne le craignent pas.'
- issue: Personnification de la mer
  choice: Conserver « elle prendra peur ».
  alternative: Dépersonnaliser par une tournure telle que « elle sera bouleversée ».
  rationale: Le texte attribue explicitement la peur à la mer ; l’image apocalyptique ne doit pas être aplatie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le contraste rhétorique et la personnification apocalyptique tout en distinguant clairement les référents masculin et féminin.
