base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: fr
  text: Toute la mer[a], toutes ses eaux et tous ses mouvements[b] ne sont-ils pas l’œuvre du Très-Haut ? Il en a mesuré toutes les œuvres et en a lié les rivages avec du sable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « chaque mer ». Le singulier et les pronoms qui suivent favorisent ici « toute la mer ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme peut désigner plus précisément les agitations, la houle ou les vagues de la mer.
    reason: lexical_alternative
  - marker: c
    text: 'La finale est difficile dans la transmission du texte. Une transcription porte : « a lié ses fondements avec du sable » ; la lecture retenue comprend plutôt les rivages, ou la limite, de la mer, fixés par le sable.'
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: ne sont-ils pas
  rationale: La particule introduit une question rhétorique qui appelle l’assentiment. La tournure française conserve cette force interrogative.
- source_word: ኵሉ፡ ባሕር
  choice: toute la mer
  rationale: Le nom est singulier et les suffixes féminins singuliers qui suivent renvoient à la mer prise comme un tout. Cette lecture préserve la cohérence grammaticale du passage.
- source_word: ማያቲሃ
  choice: toutes ses eaux
  rationale: Le pluriel guèze est rendu par le pluriel français naturel « eaux », avec le possessif renvoyant à la mer.
- source_word: ሑሳታ
  choice: tous ses mouvements
  rationale: Le terme désigne les mouvements ou agitations de la mer. « Mouvements » conserve sa portée générale sans imposer le sens plus précis de « vagues » ou « houle ».
- source_word: ግብረ፡ ልዑል
  choice: l’œuvre du Très-Haut
  rationale: « Œuvre » exprime ici ce qui est produit par Dieu, tandis que « Très-Haut » rend le titre divin reconnu sans ajout confessionnel.
- source_word: ዐቀመ
  choice: a mesuré
  rationale: Le verbe évoque la mesure ou la détermination de l’étendue et maintient l’image cosmologique d’une création ordonnée.
- source_word: አሰረ
  choice: a lié
  rationale: Le verbe signifie lier ou attacher. « A lié » conserve l’image concrète du texte plutôt que de l’expliquer par « a délimité ».
- source_word: እብንታሃ
  choice: ses fondements
  rationale: D’après la forme transmise dans la source fournie, le nom semble désigner des fondements ou des bases et porte un suffixe féminin singulier renvoyant à la mer. La difficulté textuelle est signalée en note.
- source_word: ቡኖባ
  choice: avec du sable
  rationale: Le mot est compris comme désignant le sable, avec une valeur instrumentale naturelle dans cette image de fixation de la mer.
theological_decisions:
- issue: Titre divin ልዑል
  choice: le Très-Haut
  alternative: l’Exalté
  rationale: « Le Très-Haut » est un titre divin français naturel qui garde la solennité et la portée du titre juif ancien sans l’harmoniser avec une formulation confessionnelle ultérieure.
- issue: Rapport entre Dieu et l’ordre de la mer
  choice: conserver les images de mesure et de lien
  alternative: expliciter par « fixer les limites de la mer »
  rationale: Le texte présente Dieu comme auteur et ordonnateur de la mer au moyen d’images concrètes. La traduction ne transforme pas ces images en interprétation abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, de même que les images concrètes de la cosmologie ancienne. Le pronom « en » évite une répétition lourde tout en gardant la mer comme référent de « ses œuvres » et de « ses fondements ».
