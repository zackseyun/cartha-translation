  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: fr
  text: En ces jours-là, un changement surviendra pour ceux qui sont saints et ceux qui sont choisis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un retournement » ou « un renversement se produira ». Le texte annonce un changement de situation sans en préciser ici toute la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique habituelle et l’image concrète des « jours ».
- source_word: ሚጠት
  choice: un changement
  rationale: Le nom dérive de l’idée de tourner ou de changer et signifie ici « changement », « retournement » ou « renversement », non « miséricorde ».
- source_word: ትከውን
  choice: surviendra
  rationale: Rend naturellement le verbe « être/devenir » dans ce contexte, où un changement doit se produire, sans préciser indûment sa nature.
- source_word: ለቅዱሳን
  choice: pour ceux qui sont saints
  rationale: Exprime clairement la qualité de personnes consacrées ou saintes, tout en évitant les associations ecclésiastiques possibles du substantif « saints ».
- source_word: ወለኅሩያን
  choice: et ceux qui sont choisis
  rationale: Préserve une désignation caractéristique de 1 Hénoch dans un français moderne, sans surcharger le texte des connotations doctrinales possibles du terme « élus ».
theological_decisions:
- issue: Sens de ሚጠት dans le cadre du jugement et de la délivrance
  choice: un changement
  alternative: la miséricorde / la compassion
  rationale: Le lexème indique un changement ou un retournement. Traduire par « miséricorde » confondrait ce mot avec un autre terme guèze et résoudrait à tort la nature du retournement annoncé.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le caractère apocalyptique de l’énoncé et son ambiguïté quant à la nature exacte du changement.
