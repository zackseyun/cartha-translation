base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: fr
  text: Après cela, toutes les choses cachées des lumières[b] et des éclairs me furent montrées[a] ; ils brillent pour la bénédiction et l’abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte transmis présente une forme qui pourrait se lire « tu me montreras ». Le contexte et la tradition textuelle conduisent plutôt à reconnaître une forme passive : « me furent montrées » ou « m’apparurent ».'
    reason: textual_variant
  - marker: b
    text: Ici, les « lumières » peuvent désigner plus précisément les luminaires célestes. Le pronom « ils » peut renvoyer collectivement aux lumières et aux éclairs, sans que le texte précise davantage le sujet du verbe.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Après cela
  rationale: Formule de transition temporelle naturelle en français, qui conserve l’enchaînement de la vision.
- source_word: ትርእየ ሊተ
  choice: me furent montrées
  rationale: Le contexte textuel et la révision critique indiquent vraisemblablement ተርእየ, forme passive (« furent montrées/apparurent »), plutôt qu’un actif à la deuxième personne.
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: toutes les réalités cachées
  rationale: Rend le sens concret de ce qui est caché tout en restant naturel et digne en français ; « tous leurs secrets » demeure possible.
- source_word: ለብርሃናት
  choice: des lumières
  rationale: Traduction large et littérale, sans réduire explicitement le terme aux astres ou luminaires célestes.
- source_word: ወለመባርቅት
  choice: et des éclairs
  rationale: Le pluriel français conserve l’image cosmique vive du pluriel guèze.
- source_word: ወለበረከት
  choice: pour apporter bénédiction
  rationale: La préposition est comprise comme exprimant ici la finalité du jaillissement ; « apporter » explicite sobrement cette relation en français.
- source_word: ወለጽጋብ
  choice: et abondance
  rationale: « Abondance » rend l’idée de profusion sans connotation économique moderne indue.
- source_word: ይበርቁ
  choice: ceux-ci jaillissent
  rationale: Le verbe évoque un éclat soudain. Le démonstratif rattache prudemment l’action aux éclairs, antécédent pluriel le plus proche, sans effacer l’ambiguïté signalée en note.
theological_decisions:
- issue: Les choses révélées constituent-elles des « secrets » apocalyptiques au sens technique ?
  choice: réalités cachées
  alternative: secrets
  rationale: Le guèze désigne littéralement des choses cachées ; la formulation retenue préserve ce sens plus large sans imposer une catégorie apocalyptique technique.
- issue: Quel est le sujet de « jaillissent » ?
  choice: les éclairs, comme antécédent immédiat
  alternative: les lumières et les éclairs, ou l’ensemble des phénomènes évoqués
  rationale: La syntaxe permet une référence collective, mais l’antécédent pluriel le plus proche est « éclairs ». Une note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure visionnaire est conservée, avec un point-virgule pour marquer le passage de la révélation à la fonction bénéfique des phénomènes célestes.
