base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: fr
  text: En ces jours-là, mes yeux virent les secrets des éclairs et des lumières[a], ainsi que leurs jugements[b] ; ils resplendissent pour la bénédiction et pour la malédiction, comme le veut le Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les réalités cachées » ou « les choses cachées » des éclairs et des lumières.
    reason: lexical_alternative
  - marker: b
    text: Le texte imprimé lu par Charles porte « leurs jugements » (ወኵነኔሆሙ). La transcription fournie semble contenir une erreur d’OCR, qui a conduit à une lecture possible comme « leur ordre », « leur parcours » ou « leur agencement ».
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique récurrente dans un français naturel et solennel.
- source_word: ርእያ አዕይንትየ
  choice: mes yeux virent
  rationale: Maintient la mention explicite des yeux et l’immédiateté de la vision.
- source_word: ኅቡኣተ
  choice: les secrets
  rationale: Le terme désigne littéralement des réalités secrètes ou cachées; « secrets » évite de lui attribuer indûment le sens plus précis de « réserves » ou « trésors ».
- source_word: መባርቅት ወብርሃናት
  choice: des éclairs et des lumières
  rationale: Rend distinctement les phénomènes lumineux sans réduire les « lumières » à des astres déterminés.
- source_word: አክኒሆሙ
  choice: leur ordre
  rationale: Dans la transcription fournie, le mot semble évoquer l’agencement réglé ou le cours des phénomènes; « ordre » conserve cette portée sans imposer une trajectoire strictement spatiale.
- source_word: ወይበርቁ
  choice: ils lancent leurs éclats
  rationale: Expression française vive qui convient aux éclairs comme aux lumières et restitue l’idée de fulguration.
- source_word: ለበረከት ወለመረገም
  choice: pour la bénédiction et pour la malédiction
  rationale: Préserve la polarité explicite entre faveur et jugement.
- source_word: በከመ ፈቀደ
  choice: selon la volonté
  rationale: Exprime naturellement la conformité de leur activité au vouloir divin.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Conserve le titre divin caractéristique de 1 Hénoch, sans majuscule interprétative à « esprits ».
theological_decisions:
- issue: Fonction des phénomènes célestes dans la bénédiction et la malédiction
  choice: Leur fulguration sert à la bénédiction comme à la malédiction, conformément à la volonté du Seigneur des esprits.
  alternative: La bénédiction et la malédiction pourraient seulement décrire les effets de ces phénomènes, sans indiquer qu’ils exécutent une mission.
  rationale: La proposition finale rattache explicitement leur activité à la volonté divine; la traduction conserve ce lien sans préciser davantage le mode de cette action.
- issue: Sens du terme transmis comme አክኒሆሙ
  choice: leur ordre
  alternative: leurs parcours; leurs jugements, si l’on retient la correction ወኵነኔሆሙ proposée d’après le texte imprimé
  rationale: La transcription source fournie soutient un sens lié à l’agencement ou au cours. Une correction signalée dans l’histoire éditoriale conduirait à « jugements », mais elle n’est pas introduite silencieusement dans le texte principal.
translation_notes:
  register: Français international actuel, digne et visionnaire. La syntaxe reste accessible tout en conservant la formule « mes yeux virent » et le titre « Seigneur des esprits ». Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
