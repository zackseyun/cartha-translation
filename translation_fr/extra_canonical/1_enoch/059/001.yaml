  rationale: La révision adopte la leçon du texte imprimé, « leurs jugements », tout en documentant en note la divergence de la transcription. Elle remplace aussi une expression française moins naturelle par « ils resplendissent », sans modifier l’ambiguïté quant au mode d’action des phénomènes. « Comme le veut » rend la volonté divine de manière présente et naturelle, sans imposer une nuance temporelle absente du contexte.
