  terminology: « Les secrets », « éclairs », « lumières », « bénédiction », « malédiction » et « le Seigneur des esprits » sont appropriés. « Leurs jugements » reflète le texte imprimé attesté et garde le champ judiciaire compatible avec bénédiction et malédiction, sans explicitation doctrinale.
