base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: fr
  text: Là, je vis les chambres cachées du tonnerre et comment, lorsqu’il éclate au plus haut du ciel, son bruit se fait entendre. Il me montra aussi les demeures de la terre ferme[a] et le bruit du tonnerre[b], que ce soit pour la paix et la bénédiction ou pour la malédiction, selon la parole du Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « les demeures de la terre ferme » est difficile sur les plans textuel et lexical ; elle peut désigner plus généralement les régions habitées de la terre.
    reason: lexical_alternative
  - marker: b
    text: Un membre de phrase placé entre crochets dans le témoin répète « et le bruit du tonnerre ». Cette répétition peut être originale ou résulter d’un ajout de copiste ; son contenu est représenté ici.
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ ነጐድጓድ
  choice: les chambres cachées du tonnerre
  rationale: Le pluriel ኅቡኣተ peut désigner des réalités ou des lieux cachés. Dans ce contexte cosmologique, « chambres cachées » exprime naturellement des réservoirs dissimulés du tonnerre sans réduire l’expression à des secrets abstraits.
- source_word: ይደቅቅ
  choice: il éclate
  rationale: Le verbe évoque le fait de frapper, briser ou retentir avec violence. Appliqué au tonnerre, « éclate » restitue cette force en français courant.
- source_word: መልዕልተ ሰማይ
  choice: au plus haut du ciel
  rationale: Cette chaîne construite désigne la hauteur ou la partie supérieure du ciel. « Au plus haut du ciel » conserve cette représentation cosmologique sans introduire une idée de provenance absente du texte.
- source_word: ተመመንደርት የብስ
  choice: les demeures de la terre ferme
  rationale: L’expression, difficile sur les plans lexical et textuel, paraît associer des lieux habités ou demeures à la terre sèche. La traduction conserve cette image concrète plutôt que de la normaliser en « régions habitées de la terre ».
- source_word: ለሰላም ወለበረከት ወእመ ለረገም
  choice: qu’il apporte paix et bénédiction ou malédiction
  rationale: Cette formulation française relie le bruit du tonnerre à ses effets possibles tout en maintenant l’alternative bénéfique ou punitive exprimée par le texte.
- source_word: በቃለ እግዚአ መናፍስት
  choice: selon la parole du Seigneur des esprits
  rationale: « Selon la parole » préserve l’idée que l’effet du tonnerre dépend de la parole ou du décret divin. « Seigneur des esprits » rend de façon cohérente le titre récurrent dans 1 Hénoch.
theological_decisions:
- issue: Fonction bénéfique ou punitive du tonnerre
  choice: Le bruit du tonnerre peut apporter paix et bénédiction ou malédiction selon la parole divine.
  alternative: Le tonnerre ne ferait qu’annoncer ces différents résultats, ou des sons distincts correspondraient à chacun d’eux.
  rationale: La syntaxe lie le bruit du tonnerre aux résultats placés sous la parole du Seigneur des esprits, mais ne précise pas exactement le mécanisme. La traduction conserve cette tension.
- issue: Titre እግዚአ መናፍስት
  choice: Seigneur des esprits
  alternative: Seigneur des Esprits
  rationale: La minuscule à « esprits » suit l’usage français courant pour un nom commun dans un titre, tout en préservant la force du titre propre à 1 Hénoch.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été divisée en deux pour alléger la syntaxe tout en conservant la progression visionnaire. Les images cosmologiques concrètes et l’ambiguïté sur l’action du tonnerre ont été maintenues.
