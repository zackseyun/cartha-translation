base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: fr
  text: Depuis les jours du massacre, de la destruction et de la mort des géants[a], les esprits qui sont sortis des âmes de leur chair[b] détruiront sans être jugés[c] ; ainsi détruiront-ils jusqu’au jour où le grand jugement arrivera à son accomplissement, quand la grande ère parviendra à son terme[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset est textuellement difficile dans le témoin disponible. Il situe l’activité de ces esprits à partir du massacre, de la destruction et de la mort des géants.
    reason: textual_variant
  - marker: b
    text: « Les esprits qui sont sortis des âmes de leur chair » traduit très littéralement une expression difficile. Dans le contexte, elle désigne probablement les esprits associés aux descendants des Veilleurs après leur mort corporelle.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sans jugement ». On peut aussi comprendre : « sans subir de condamnation ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « quand le grand ordre du monde parviendra à son accomplissement ». Le terme guèze peut désigner une ère, le monde ou un ordre du monde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ ቀትል ወሙስና ወሞተ ረዓይትኒ
  choice: Depuis les jours du massacre, de la destruction et de la mort des géants
  rationale: « Depuis les jours » exprime le point de départ temporel. La série « massacre, destruction et mort » conserve la cadence du guèze, et ረዓይት est compris comme « géants » dans ce contexte.
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: les esprits qui sont sortis des âmes de leur chair
  rationale: La formulation inhabituelle et concrète du témoin est conservée plutôt que ramenée à « esprits désincarnés » ou à « esprits sortis de leurs corps », qui résoudraient la difficulté.
- source_word: ዘያማስን
  choice: détruiront
  rationale: Le verbe décrit l’activité dévastatrice des esprits et fait écho au champ lexical du massacre et de la destruction. Le futur convient à la portée consécutive et eschatologique du passage.
- source_word: ዘእንበለ ኵነኔ
  choice: sans être jugés
  rationale: Cette tournure française naturelle rend l’absence de jugement ou de condamnation pendant la période évoquée, sans préciser davantage le mécanisme judiciaire.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: jusqu’au jour où le grand jugement arrivera à son accomplissement
  rationale: La traduction maintient le substantif d’accomplissement et la solennité apocalyptique de l’expression.
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: quand la grande ère parviendra à son terme
  rationale: « Ère » exprime ici une période ou un ordre du monde destiné à s’achever, tout en évitant l’ambiguïté française de « grand âge », qui évoque couramment la vieillesse.
theological_decisions:
- issue: Identité des esprits
  choice: Le texte parle des esprits issus des âmes de la chair des géants, sans les définir davantage dans le corps du verset.
  alternative: Les identifier explicitement comme les esprits désincarnés des géants, descendants des Veilleurs.
  rationale: Le contexte favorise cette identification, mais le témoin guèze présente une formulation difficile. La traduction conserve donc son image sans imposer une définition doctrinale plus précise.
- issue: Portée de « sans jugement »
  choice: Les esprits poursuivent leur œuvre destructrice sans être jugés jusqu’au grand jugement.
  alternative: Comprendre qu’ils détruisent sans discernement, ou qu’ils agissent sans prononcer eux-mêmes de jugement.
  rationale: Le contexte judiciaire et la mention du grand jugement favorisent l’idée d’une activité qui se poursuit avant leur jugement final, mais la note signale la forme plus littérale.
- issue: Sens eschatologique de ዓለም
  choice: Une grande ère parvient à son terme.
  alternative: Le grand monde ou le grand ordre du monde atteint son accomplissement.
  rationale: Le mot peut désigner le monde, l’âge ou l’éternité. « Ère » préserve ici l’idée d’une période eschatologique qui s’achève sans affirmer l’anéantissement de la création.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde une cadence apocalyptique sans archaïsmes inutiles. Les formulations difficiles du guèze sont conservées dans le texte et expliquées en notes plutôt que discrètement harmonisées.
