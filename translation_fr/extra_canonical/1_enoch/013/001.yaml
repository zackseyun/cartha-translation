base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: fr
  text: 'Hénoch s’en alla et dit à Azazel : « Tu n’auras pas de paix. Un jugement sévère a été prononcé contre toi : tu seras lié. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃሊፎ
  choice: alla
  rationale: Le verbe marque le déplacement d’Hénoch avant sa prise de parole. « Alla » restitue naturellement la succession narrative sans préciser une direction absente du texte.
- source_word: ይቤሎ
  choice: dire à
  rationale: Verbe courant de parole, rendu simplement sans ajouter la force d’une proclamation.
- source_word: አዛዝኤል
  choice: Azazel
  rationale: Le nom propre est translittéré selon sa forme française usuelle.
- source_word: ኢይከውከ ሰላም
  choice: Tu n’auras pas de paix
  rationale: Cette formule solennelle refuse à Azazel la paix et le bien-être, dans le cadre d’un oracle de jugement.
- source_word: ዓቢይ
  choice: lourde
  rationale: Avec « condamnation », « lourde » exprime naturellement l’intensité de ዓቢይ en français, sans réduire celle-ci à la taille.
- source_word: ኵነኔ
  choice: condamnation
  rationale: Le terme est juridique et désigne ici une décision défavorable assortie d’une peine. « Condamnation » convient mieux en français courant que « sentence », tout en laissant « jugement » comme autre possibilité.
- source_word: ወጽአ ላዕሌከ
  choice: a été prononcée contre toi
  rationale: L’expression décrit une décision émise et dirigée contre Azazel. La formulation française conserve la valeur juridique, même si elle rend moins littéralement l’image de ce qui « sort ».
- source_word: ይእስርከ
  choice: tu seras enchaîné
  rationale: Le verbe annonce la mise aux liens ou l’emprisonnement d’Azazel. Le futur passif français est clair et conserve l’image punitive.
theological_decisions:
- issue: Portée de la formule refusant la paix
  choice: « Tu n’auras pas de paix »
  alternative: « Il n’y aura pas de paix pour toi »
  rationale: Il s’agit d’une déclaration judiciaire et apocalyptique, non d’une simple formule de salutation. La traduction garde cette solennité sans importer une formulation confessionnelle particulière.
- issue: Nuance juridique de ኵነኔ
  choice: « condamnation »
  alternative: « jugement » ou « sentence »
  rationale: Le contexte immédiat est pénal puisque la décision entraîne l’enchaînement d’Azazel. « Condamnation » rend clairement cette conséquence, tandis que « jugement » demeure une lecture plus large possible.
- issue: Forme de la peine finale
  choice: « tu seras enchaîné »
  alternative: « pour t’enchaîner »
  rationale: La forme finie donne en français une annonce nette du châtiment et correspond à l’analyse retenue dans le texte anglais audité. L’infinitif final reste grammaticalement envisageable selon l’analyse syntaxique.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement convient à l’adresse solennelle d’Hénoch à Azazel. « Hénoch » suit la forme française traditionnelle du nom; la ponctuation sépare clairement le verdict de la peine annoncée.
