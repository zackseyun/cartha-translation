base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/003.yaml
  text: Then I went and spoke to them all together[a], and they all feared, and fear and trembling seized them.
translation:
  language: fr
  text: Alors j’allai parler à tous ceux qui étaient réunis[a] ; ils eurent tous peur, et la peur et le tremblement les saisirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression indique qu’Hénoch s’adressa au groupe entier alors qu’il était réuni.
    reason: clarification syntaxique de ኅቡረ
lexical_decisions:
- source_word: እሜሃ
  choice: Alors
  rationale: Marque naturellement la succession narrative sans préciser davantage le moment.
- source_word: ሐዊርየ
  choice: j’allai
  rationale: Rend directement le verbe de déplacement à la première personne dans un registre narratif digne.
- source_word: ነገርክዎሙ
  choice: leur parler
  rationale: Exprime l’acte de s’adresser à eux sans imposer un contenu verbal absent de ce verset.
- source_word: ለኵሎሙ ኅቡረ
  choice: à tous, réunis
  rationale: Conserve à la fois la totalité du groupe et l’idée qu’ils sont rassemblés, tout en évitant l’ambiguïté française de « parler tous ensemble ».
- source_word: ወእሙንቱ ኵሎሙ ፈርሁ
  choice: ils eurent tous peur
  rationale: Préserve la répétition de la totalité et présente la peur comme leur réaction immédiate.
- source_word: ፍርሃት
  choice: la peur
  rationale: Maintient le lien lexical avec « eurent peur » et la répétition insistante de la source.
- source_word: ነሥአሙ
  choice: les saisirent
  rationale: Restitue l’image forte d’émotions qui s’emparent d’eux.
- source_word: ወረዓድ
  choice: et le tremblement
  rationale: Conserve la manifestation corporelle de l’effroi et le parallélisme nominal.
theological_decisions:
- issue: Nature de la réaction des Veilleurs
  choice: Conserver l’accumulation « eurent peur » puis « la peur et le tremblement les saisirent »
  alternative: « Ils furent saisis d’une grande terreur »
  rationale: Le guèze juxtapose un verbe de peur et deux noms coordonnés. La formulation retenue garde cette intensification apocalyptique sans la réduire à une seule expression.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « tous » et de la racine sémantique de la peur est volontairement conservée. Le point-virgule clarifie la succession entre la parole d’Hénoch et leur réaction.
