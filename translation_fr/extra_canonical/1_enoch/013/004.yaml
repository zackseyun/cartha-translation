base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/004.yaml
  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: fr
  text: Ils me demandèrent d’écrire pour eux un mémorial de supplication[a], afin que le pardon leur soit accordé et que je le fasse monter[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une requête mémorielle » ou « une prière de remémoration ». L’expression guèze associe les idées de mémorial ou de remémoration et de supplication.
    reason: lexical_alternative
  - marker: b
    text: La proposition demeure inachevée dans le verset transmis ici et se poursuit dans la phrase suivante, où la requête est de nouveau mentionnée.
    reason: textual_variant
lexical_decisions:
- source_word: ተስእሉኒ
  choice: Ils me demandèrent
  rationale: Le verbe exprime une demande adressée à Énoch. Le passé simple convient au registre narratif digne sans rendre la supplication excessivement solennelle.
- source_word: እጽሐፍ
  choice: d’écrire
  rationale: Après le verbe de demande, l’infinitif français restitue naturellement la valeur subjonctive du guèze.
- source_word: ተዝካረ ስእለት
  choice: une requête en mémoire
  rationale: Cette formulation conserve les deux composantes de l’expression, la mémoire ou commémoration et la supplication, sans préciser indûment sa fonction cultuelle ou judiciaire.
- source_word: ይኩኖሙ ኅድገተ
  choice: afin que le pardon leur soit accordé
  rationale: ኅድገት peut désigner la remise, la libération ou le pardon. Dans ce contexte de condamnation, « pardon » est naturel, tandis que la tournure passive rend l’existence ou l’octroi souhaité sans nommer celui qui pardonne.
- source_word: አዕርግ
  choice: que je la fasse monter
  rationale: La forme causative signifie faire monter ou présenter en haut, plutôt que monter soi-même. Le pronom reprend naturellement la requête en français.
theological_decisions:
- issue: Nature du document demandé par les Veilleurs
  choice: une requête en mémoire
  alternative: une prière commémorative ; une requête écrite destinée à être rappelée
  rationale: Le texte associe explicitement mémoire et supplication. La traduction retenue préserve cette association sans imposer une liturgie précise ni développer explicitement la scène d’un tribunal céleste.
- issue: Sens de ኅድገት dans la demande des Veilleurs
  choice: le pardon
  alternative: la remise ; la libération
  rationale: « Pardon » correspond clairement au contexte, tout en laissant intacte la tension du récit quant à la possibilité réelle que leur demande soit accueillie.
- issue: Mouvement exprimé par አዕርግ
  choice: faire monter la requête
  alternative: monter
  rationale: La morphologie causative indique qu’Énoch doit faire monter ou présenter la requête, non simplement monter lui-même.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la narration littéraire. Les points de suspension signalent l’inachèvement syntaxique du verset sans compléter artificiellement la proposition.
