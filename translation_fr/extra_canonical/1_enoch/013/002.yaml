base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: fr
  text: Et aucune miséricorde ni aucune requête ne vous sera accordée[a], à cause de la violence que vous avez enseignée, et à cause de toutes les œuvres de blasphème, de violence et de péché que vous avez montrées aux êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription fournie porte ሣሕት, qui pourrait être comprise comme « requête » ou « prière ». Il s’agit vraisemblablement d’une erreur de lecture pour ሣህል, « miséricorde » ou « clémence ».
    reason: textual_variant
  - marker: b
    text: Ou « que vous avez révélées aux êtres humains ». Le verbe guèze peut désigner le fait de montrer quelque chose ou de le faire connaître ; dans ce contexte, il peut évoquer la divulgation d’un savoir interdit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣህል / transcription ሣሕት
  choice: miséricorde
  rationale: 'La transcription fournie semble conserver une erreur de lecture : le mot attendu est ሣህል, « miséricorde, clémence, soulagement ». Cette correction, appuyée par la révision critique signalée, évite d’y voir à tort un premier synonyme de « requête ».'
- source_word: ስእለት
  choice: requête
  rationale: Le terme désigne une demande instante ou une supplication. « Requête » conserve ici le ton formel et judiciaire tout en restant naturel en français moderne.
- source_word: ኢይከውከ
  choice: ne vous sera accordée
  rationale: Le verbe « être/devenir », avec sa valeur dative dans ce contexte, exprime ce qui sera obtenu ou accordé aux Veilleurs.
- source_word: ዘመሀርከ
  choice: que vous avez enseignée
  rationale: Le verbe exprime directement l’enseignement ou la transmission d’un savoir; l’accord au féminin renvoie à « violence ».
- source_word: ግፍዐ / ወግፍዕ
  choice: violence
  rationale: « Violence » rend la force morale et sociale du terme dans cette sentence de condamnation et maintient le même choix pour ses deux occurrences.
- source_word: ምግባረ
  choice: œuvres
  rationale: « Œuvres » préserve le caractère concret et le registre solennel de l’énumération accusatrice.
- source_word: ጽርፈት
  choice: blasphème
  rationale: Le mot peut évoquer l’outrage, l’insolence ou l’impiété. « Blasphème » convient au cadre religieux et judiciaire, sans exclure cette gamme de sens.
- source_word: ወሓጢአት
  choice: et de péché
  rationale: « Péché » est le terme français le plus direct et conserve la progression cumulative des accusations.
- source_word: ዘአርአይከ
  choice: que vous avez montrées
  rationale: Le verbe signifie faire voir ou faire connaître. « Montrées » reste proche de sa formulation tout en laissant ouverte l’idée d’une divulgation de connaissances interdites.
- source_word: ለሰብእ
  choice: aux humains
  rationale: Le référent est l’humanité en général; cette formulation inclusive est claire et naturelle en français contemporain.
theological_decisions:
- issue: Nature de la faute des Veilleurs dans la proposition finale
  choice: Le texte les accuse d’avoir transmis aux humains la violence et des œuvres mauvaises, au moyen des verbes « enseigner » et « montrer ».
  alternative: La dernière proposition peut décrire plus largement des actes qu’ils ont donnés à voir aux humains, tandis que « révéler » soulignerait davantage la divulgation d’un savoir secret.
  rationale: Le contexte immédiat porte sur l’enseignement interdit transmis à l’humanité, mais le verbe « montrer » demeure assez large. Le texte principal garde cette amplitude, et la note signale explicitement l’autre nuance possible.
- issue: Premier élément refusé aux Veilleurs
  choice: miséricorde
  alternative: pétition ou prière, si l’on suivait telle quelle la transcription ሣሕት
  rationale: La correction textuelle en ሣህል rend mieux le sens attendu de « miséricorde, clémence » et évite de transformer le début du verset en simple doublet synonymique. La difficulté du témoin transcrit est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « aucune… ni aucune… » rend sans ambiguïté le double refus, tandis que l’énumération « blasphème, violence et péché » conserve le rythme solennel de l’accusation.
