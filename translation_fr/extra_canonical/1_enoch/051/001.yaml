  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: fr
  text: 'En ces jours-là, la terre rendra ce qui est dans son sein, le Shéol[a] rendra ce qu’il a reçu, et la Perdition[b] rendra ce qu’elle doit. De parmi eux, il choisira les justes et les saints, car le jour où ils seront sauvés approche.


    En ces jours-là, l’Élu siégera sur son trône, et il fera sortir de sa bouche toutes les pensées de sagesse, car le Seigneur des esprits les lui a accordées et l’a glorifié.


    En ces jours-là, les montagnes bondiront comme des béliers, et les collines sauteront comme des agneaux rassasiés de lait. Tous les anges seront au ciel, et leurs visages resplendiront de joie, car, en ces jours-là, l’Élu se sera levé. La terre se réjouira, les justes y habiteront, et les élus y marcheront, iront et viendront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Shéol est, dans l’usage juif ancien, le séjour des morts ; le terme ne désigne pas nécessairement ce que des traditions plus tardives appellent l’enfer.
    reason: cultural_note
  - marker: b
    text: Ou « la Destruction ». Le terme désigne ici un domaine personnifié, parallèle à la terre et au Shéol, qui rend ce qu’il doit.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et sa répétition structurante.
- source_word: ታገብእ / ያገብእ
  choice: rendra
  rationale: Le verbe répété décrit des dépositaires qui restituent ce qu’ils détenaient ; « rendre » maintient ce parallélisme.
- source_word: ማሕፀንታ
  choice: ce qui lui avait été confié
  rationale: Dans ce parallélisme de restitution, le nom désigne au mieux un dépôt confié à la terre, plutôt qu’une image explicite de mise au monde.
- source_word: ሲኦል
  choice: le Shéol
  rationale: La translittération conserve la notion juive ancienne du séjour des morts sans la réduire à la tombe ni l’assimiler à l’enfer tardif.
- source_word: ሀጕል
  choice: le lieu de perdition
  rationale: Le terme désigne ici un domaine personnifié de destruction ou de perdition, parallèle à la terre et au Shéol.
- source_word: ኅሩይ
  choice: l’Élu
  rationale: Ce titre singulier désigne la figure eschatologique centrale du passage ; la majuscule signale son emploi titulaire sans préciser davantage son identité.
- source_word: ኅሊናተ ጥበብ
  choice: les pensées de sagesse
  rationale: Rend le champ de la pensée, du dessein ou du conseil sans importer la leçon interprétative « secrets ».
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Reproduit le titre divin caractéristique de cette section de 1 Hénoch.
- source_word: ያንሶስዉ
  choice: s’y déplaceront
  rationale: Complète le verbe précédent « marcheront » en conservant l’idée d’aller et venir librement.
theological_decisions:
- issue: Nature du Shéol dans la scène de restitution des morts
  choice: Conserver « Shéol » comme séjour des morts
  alternative: « tombe », « monde souterrain » ou « enfer »
  rationale: Le texte distingue la terre, le Shéol et le lieu de perdition. La translittération préserve cette cosmologie et évite d’y introduire une conception ultérieure de l’enfer.
- issue: Identité de l’Élu
  choice: Employer le titre « l’Élu » sans identification doctrinale ajoutée
  alternative: Identifier explicitement cette figure au Messie ou à une autre personne
  rationale: Le passage attribue à cette figure un trône, la sagesse et un rôle eschatologique, mais ne résout pas ici explicitement son identité.
- issue: Possesseur du trône
  choice: « son trône »
  alternative: « mon trône »
  rationale: Le texte guèze fourni porte le suffixe de troisième personne ; la traduction n’importe donc pas la variante traditionnelle « mon trône ».
- issue: Valeur de ማሕፀንታ
  choice: « ce qui lui avait été confié »
  alternative: « son sein » ou « ce que contenait son sein »
  rationale: Le parallélisme avec ce que le Shéol a reçu et ce que la perdition doit favorise l’image d’un dépôt à restituer. La traduction évite ainsi d’imposer une métaphore d’enfantement.
translation_notes:
  register: Français international actuel, digne et lisible. Les répétitions apocalyptiques de « En ces jours-là » sont maintenues. La coordination a été légèrement réorganisée dans la phrase sur les anges afin de rendre clairement en français que ce sont leurs visages qui resplendissent, sans ajouter de contenu.
