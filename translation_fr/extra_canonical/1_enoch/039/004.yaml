base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: fr
  text: 'Et là, j’ai vu une autre vision : les demeures des saints et les lieux de repos des justes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « lieux de repos » peut désigner plus littéralement des lits, des couches ou des endroits où l’on se couche.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: là
  rationale: Adverbe locatif qui situe la scène visionnaire ; « là » est naturel et direct en français.
- source_word: ርኢኩ
  choice: j’ai vu
  rationale: Formulation simple et habituelle du récit visionnaire à la première personne.
- source_word: ራእየ ካልአ
  choice: une autre vision
  rationale: Rend une nouvelle révélation visionnaire sans imposer la précision numérique de « deuxième ».
- source_word: ማኅደሪሆሙ
  choice: les demeures
  rationale: Le terme désigne des lieux d’habitation ; « demeures » convient au registre visionnaire tout en restant compréhensible.
- source_word: ለቅዱሳን
  choice: des saints
  rationale: Rend littéralement la qualité de ceux qui sont consacrés ou saints, sans préciser s’il s’agit d’êtres célestes ou d’humains sanctifiés.
- source_word: ወምስካባቲሆሙ
  choice: et les lieux de repos
  rationale: Le mot relève du champ lexical de l’endroit où l’on se couche, du lit ou du repos ; la formulation conserve l’image sans la rendre trop concrète.
- source_word: ለጻድቃን
  choice: des justes
  rationale: « Justes » est le terme français courant et traditionnel pour ceux qui se conforment à la justice dans un contexte éthique et apocalyptique.
theological_decisions:
- issue: 'Identité des ቅዱሳን : êtres célestes, fidèles défunts ou peuple consacré de Dieu.'
  choice: saints
  alternative: êtres saints
  rationale: « Saints » demeure ouvert quant à leur identité dans ce contexte et évite d’ajouter « anges » ou une autre précision absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. La coordination concise de l’original est conservée, ainsi que l’ambiguïté sur l’identité des « saints ».
