base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: fr
  text: Là, j’ai désiré demeurer[a], et mon esprit a aspiré à cette demeure. Là, ma part était déjà là[b], car c’est ainsi qu’elle a été établie pour moi devant le Seigneur des esprits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habiter ».
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « Là, ma part était auparavant ». Le guèze emploie simplement le verbe « être/devenir »; la formulation peut aussi se comprendre comme « là se trouvait déjà ma part ».'
    reason: source_ambiguity
  - marker: c
    text: « Seigneur des esprits » est un titre divin caractéristique des Paraboles d’Hénoch; il est conservé selon l’usage propre de l’œuvre.
    reason: cross_reference
lexical_decisions:
- source_word: ህየ
  choice: Là
  rationale: Adverbe locatif qui renvoie au lieu contemplé dans la vision, sans le préciser davantage.
- source_word: ፈቀድኩ አኅድር
  choice: j’ai désiré demeurer
  rationale: Exprime le désir d’une résidence durable; « demeurer » conserve un registre digne et naturel.
- source_word: ወፈተወት መንፈስየ
  choice: et mon esprit a aspiré
  rationale: Rend l’élan intérieur et affectif du voyant sans réduire le verbe à une simple décision.
- source_word: ለውእቱ ማኅደር
  choice: à cette demeure
  rationale: « Demeure » traduit concrètement le lieu d’habitation tout en évitant une répétition lourde avec « demeurer ».
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: Là, ma part était déjà réservée
  rationale: « Ma part » garde l’idée de lot ou de portion. « Réservée » exprime naturellement en français la destination préalable, mais la note signale que ኮነ signifie plus littéralement « était » ou « devint ».
- source_word: እስመ ከመዝ ጸንዐ በእንቲአየ
  choice: car elle avait ainsi été établie pour moi
  rationale: Le féminin renvoie à « ma part »; « établie » restitue l’idée de fermeté et de détermination.
- source_word: በቅድመ እግዚአ መናፍስት
  choice: devant le Seigneur des esprits
  rationale: Le second ቅድመ se lit naturellement comme une préposition de présence. Le titre récurrent est conservé sans harmonisation doctrinale.
theological_decisions:
- issue: Nature de la « part » d’Hénoch
  choice: Une part ou place céleste préalablement destinée au voyant
  alternative: Une simple constatation selon laquelle ce lieu était ou devint sa part, sans idée explicite d’attribution
  rationale: Le contexte de demeure et d’établissement soutient l’idée d’une destination préalable, mais la formulation et la note préservent la sobriété du verbe « être/devenir ».
- issue: Titre divin « Seigneur des esprits »
  choice: Conserver le titre propre aux Paraboles
  alternative: L’harmoniser avec une formule théologique ultérieure ou traduire « Maître des esprits »
  rationale: La traduction respecte l’idiome interne de l’œuvre et n’y importe aucune formulation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence visionnaire est maintenue par la reprise de « Là ». La traduction évite l’archaïsme excessif et documente l’ambiguïté de ኮነ plutôt que de la résoudre silencieusement.
