base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: fr
  text: Et là, mes yeux virent l’Élu de la justice et de la foi[a]. La justice sera en ses jours[b], et les justes et les élus seront innombrables[c] devant lui, pour les siècles des siècles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fidélité ». Le terme guèze peut désigner la foi, la fidélité ou la constance dans cette formule condensée.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe signifie simplement « sera »; on pourrait aussi traduire : « la justice prévaudra en ses jours ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il n’y a pas de nombre pour eux devant lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: là
  rationale: Dans la tournure « en ce lieu », le français naturel emploie volontiers « là »; le cadre spatial de la vision demeure explicite sans lourdeur.
- source_word: ኀሩየ
  choice: l’Élu
  rationale: Le terme substantivé fonctionne comme un titre dans les Paraboles. « L’Élu » est digne et naturel en français, sans identifier davantage le personnage.
- source_word: ለጽድቅ
  choice: de la justice
  rationale: Le rapport génitival caractérise l’Élu; la formulation conserve la construction condensée de la source.
- source_word: ወዘሃይማኖት
  choice: et de la foi
  rationale: Le nom guèze peut exprimer la foi ou la fidélité. « Foi » garde une correspondance lexicale directe, tandis que l’autre sens figure en note.
- source_word: ይከውን
  choice: sera présente
  rationale: Le verbe signifie fondamentalement « être/devenir ». L’ajout minimal de « présente » rend la proposition idiomatique en français sans introduire l’idée plus forte de « prévaloir ».
- source_word: በመዋዕሊሁ
  choice: en ses jours
  rationale: Expression temporelle concise qui préserve la structure et le registre solennel de la source.
- source_word: ኄራያን
  choice: les élus
  rationale: Ce pluriel maintient la continuité lexicale avec le titre singulier « l’Élu ».
- source_word: ኈልቈ አልቦሙ
  choice: seront innombrables
  rationale: L’idiome signifie littéralement qu’il n’y aura pas de nombre pour eux. « Innombrables » en communique clairement le sens.
- source_word: ቅድሜሁ
  choice: devant lui
  rationale: La traduction directe conserve la nuance de présence et le cadre solennel de la vision.
- source_word: ለዓለመ ዓለም
  choice: pour les siècles des siècles
  rationale: Formule française consacrée, solennelle et proche de l’expression sémitique de durée perpétuelle.
theological_decisions:
- issue: Valeur titulaire ou simplement descriptive de ኀሩየ
  choice: « l’Élu », avec majuscule titulaire
  alternative: « un élu » ou « celui qui est choisi »
  rationale: Dans le contexte littéraire des Paraboles, le mot désigne un personnage déterminé et exalté. La majuscule signale cette fonction sans lui imposer une identification doctrinale ultérieure.
- issue: Sens de ሃይማኖት dans le titre condensé
  choice: « foi » dans le texte, avec « fidélité » en note
  alternative: « fidélité » ou « constance »
  rationale: Le champ sémantique permet plusieurs nuances. La note conserve l’ambiguïté théologique au lieu de trancher silencieusement.
- issue: Force de ይከውን dans la proposition sur les jours de l’Élu
  choice: « sera présente »
  alternative: « sera » ou « prévaudra »
  rationale: La leçon simple du verbe « être » doit être respectée. « Sera présente » produit un français clair tout en évitant la nuance supplémentaire de victoire contenue dans « prévaudra ».
translation_notes:
  register: Français international moderne, clair et digne, avec une cadence visionnaire sobre. Les termes « justice », « foi », « Élu » et « élus » maintiennent les répétitions et les liens lexicaux de la source. Les trois marqueurs [a], [b] et [c] figurent tous dans le texte principal.
