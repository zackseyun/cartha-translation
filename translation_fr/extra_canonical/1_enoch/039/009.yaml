base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: fr
  text: En ces jours-là, j’ai loué et exalté le nom du Seigneur des esprits, par la bénédiction et par la louange, car il m’a affermi dans la bénédiction et dans la louange[a], selon la volonté du Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il m’a fortifié par la bénédiction et par la louange » ou « il m’a établi dans la bénédiction et dans la louange ». Le verbe signifie rendre ferme, affermir ou établir, et la préposition peut indiquer ici la sphère ou le moyen.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: በውእቱን መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique récurrente et son registre élevé.
- source_word: ሰባሕኩ ወአልዐልኩ ስሞ
  choice: j’ai loué et exalté le nom
  rationale: Rend distinctement les deux verbes et préserve l’expression biblique concrète concernant le nom divin.
- source_word: ለእግዚአ መናፍስት
  choice: du Seigneur des esprits
  rationale: Maintient le titre divin caractéristique de 1 Hénoch; la minuscule à « esprits » suit l’usage naturel du français tout en conservant la valeur de titre.
- source_word: በረከተ ወስብሐተ
  choice: par la bénédiction et par la louange
  rationale: Le redoublement de la préposition est conservé pour rendre le rythme solennel; « par » exprime ici la manière de louer et d’exalter.
- source_word: አጽንዐኒ
  choice: il m’a affermi
  rationale: Le causatif exprime l’action de rendre ferme ou stable. « Affermi » conserve cette nuance sans imposer exclusivement l’idée d’installation institutionnelle.
- source_word: በበረከት ወስብሐት
  choice: dans la bénédiction et dans la louange
  rationale: Après « affermi », « dans » exprime naturellement la sphère ou l’état, tout en laissant ouverte la possibilité instrumentale signalée en note.
- source_word: በከመ ፈቃዱ
  choice: selon la volonté
  rationale: Rend directement la conformité à la volonté divine sans ajouter une nuance doctrinale étrangère.
theological_decisions:
- issue: Sens des expressions répétées « bénédiction et louange »
  choice: La première désigne la manière de l’acte de louange, et la seconde la sphère dans laquelle Hénoch est affermi.
  alternative: 'Les deux occurrences peuvent être comprises instrumentalement: « par/avec la bénédiction et la louange ».'
  rationale: La répétition liturgique est préservée sans transformer la bénédiction en avantage matériel; la note maintient l’ambiguïté de la préposition guèze.
- issue: Valeur de አጽንዐኒ
  choice: il m’a affermi
  alternative: il m’a établi; il m’a fortifié
  rationale: « Affermi » couvre l’idée causative de rendre ferme et permet de percevoir le lien lexical avec le contexte, sans trancher excessivement entre établissement et renforcement.
- issue: Titre divin እግዚአ መናፍስት
  choice: Seigneur des esprits
  alternative: Seigneur des Esprits
  rationale: Le titre propre à 1 Hénoch est conservé littéralement; le choix typographique ne détermine pas l’identité ou la nature des esprits.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition du guèze sont maintenus autant que le permet un français naturel.
