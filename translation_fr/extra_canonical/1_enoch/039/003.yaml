base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/003.yaml
  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
translation:
  language: fr
  text: En ces jours-là, un tourbillon de vents m’emporta loin de la face de la terre et me déposa à l’extrémité des cieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la limite des cieux ». L’expression guèze désigne la frontière extérieure ou le point le plus éloigné dans l’univers de la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: jours
  rationale: Dans la formule temporelle በውእቱ መዋዕል, « en ces jours-là » conserve la tournure narrative apocalyptique et reste naturelle en français.
- source_word: መሠጠኒ
  choice: m’emporta
  rationale: Le verbe exprime ici un déplacement subi sous l’action d’une puissance extérieure, sans imposer exclusivement l’idée d’une montée verticale.
- source_word: ዐውሎ ነፋሳት
  choice: un tourbillon de vents
  rationale: Cette expression garde l’intensité et le redoublement imagé du guèze plutôt que de les réduire à un simple « vent ».
- source_word: እምገጸ ሰምድር
  choice: loin de la face de la terre
  rationale: « Face de la terre » préserve l’image sémitique de la surface terrestre; « loin de » rend naturellement en français le mouvement d’éloignement marqué par la préposition source.
- source_word: አንበረኒ
  choice: me déposa
  rationale: Dans ce récit de transport visionnaire, le verbe indique que le narrateur est placé à destination; « me déposa » est précis, vivant et idiomatique.
- source_word: ጽንፈ ሰማያት
  choice: l’extrémité des cieux
  rationale: Le nom désigne une limite ou une extrémité. Ce choix conserve la géographie cosmique de la vision ainsi que le pluriel de « cieux ».
theological_decisions:
- issue: Géographie cosmique du transport visionnaire
  choice: à l’extrémité des cieux
  alternative: au bout des cieux; à la limite des cieux
  rationale: La formulation maintient la représentation spatiale apocalyptique sans la transformer en une vague expérience céleste ni préciser indûment la nature de cette frontière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la formule apocalyptique « en ces jours-là », l’image marquée du « tourbillon de vents » et la géographie cosmique du texte source.
