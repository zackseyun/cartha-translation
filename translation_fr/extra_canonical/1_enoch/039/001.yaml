base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: fr
  text: Et il arrivera, en ces jours-là, que des enfants choisis et saints[a] descendront du ciel d’en haut[b], et leur descendance ne fera qu’un avec les enfants des hommes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « des enfants choisis et saints ». On a aussi compris cette expression comme « les élus et les saints », ou comme « les enfants des élus et des saints » ; la forme guèze favorise toutefois ici la première analyse.
    reason: textual_grammar
  - marker: b
    text: Cette origine céleste ne suffit pas, à elle seule, à déterminer précisément l’identité de ces êtres.
    reason: cultural_note
  - marker: c
    text: Littéralement, « leur semence sera une avec les enfants des hommes ». Le texte évoque une union ou un mélange sans en préciser ici la nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በዝኩ፡ መዋዕል
  choice: Et il arrivera, en ces jours-là
  rationale: Conserve la formule apocalyptique introductive et son rythme solennel, tout en employant un français actuel et naturel.
- source_word: ይወርዱ
  choice: descendront
  rationale: Préserve explicitement le mouvement vertical depuis le ciel.
- source_word: ደቂቅ፡ ኅሩያን፡ ወቅዱሳን
  choice: des enfants choisis et saints
  rationale: ደቂቅ est à l’état absolu, et les deux termes pluriels qui suivent peuvent naturellement être compris comme ses qualificatifs. Cette lecture suit de près la syntaxe guèze sans transformer d’emblée les qualificatifs en titres substantivés.
- source_word: እምልዑል፡ ሰማይ
  choice: du ciel d’en haut
  rationale: Rend l’origine céleste élevée en conservant le singulier, sans introduire une cosmologie plus précise que celle du texte.
- source_word: ዘርኦሙ
  choice: leur descendance
  rationale: Exprime le sens généalogique de « semence » dans un français moderne sans imposer une nuance biologique explicite.
- source_word: አሐደ፡ ይከውን
  choice: ne fera qu’un
  rationale: Rend de manière idiomatique l’idée de devenir ou d’être un, sans préciser la nature de cette union.
- source_word: ምስለ፡ ውሉደ፡ ሰብእ
  choice: avec les enfants des hommes
  rationale: Conserve l’expression anthropologique et le contraste avec l’origine céleste, plutôt que de l’aplatir en « avec les humains ».
theological_decisions:
- issue: Identité des « enfants choisis et saints »
  choice: La traduction traite « choisis » et « saints » comme des qualificatifs de « enfants », conformément à la forme absolue de ደቂቅ.
  alternative: « les élus et les saints » ou « les enfants des élus et des saints »
  rationale: La syntaxe disponible favorise l’accord attributif, mais l’état textuel et l’histoire des traductions justifient de signaler les autres analyses sans identifier ces êtres comme des anges ou comme des humains justes.
- issue: Nature de l’union avec les enfants des hommes
  choice: « ne fera qu’un avec »
  alternative: « se mêlera à », « s’unira à » ou une formulation explicitement sexuelle
  rationale: Le guèze affirme une unité ou une union, mais n’en indique pas ici le mécanisme. La traduction préserve donc la tension sans importer explicitement le récit des Veilleurs.
translation_notes:
  register: Français international moderne, digne et légèrement solennel. La formule « en ces jours-là » maintient la cadence apocalyptique ; les formulations confessionnelles ou les identifications doctrinales non explicites ont été évitées.
