base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: fr
  text: Là, mes yeux virent leurs demeures avec les anges de justice, et leurs lieux de repos[a] avec les saints[b] ; ils demandaient, suppliaient et priaient en faveur des enfants des hommes. La justice coulait devant eux comme de l’eau, et la miséricorde, comme la rosée sur la terre. Ainsi en est-il parmi eux pour toujours et à jamais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs lits » ou « leurs couches ». Le terme guèze évoque un endroit où l’on se couche ou se repose ; « lieux de repos » évite de préciser inutilement le mobilier de la scène céleste.
    reason: lexical_alternative
  - marker: b
    text: « Les saints » peut désigner des êtres célestes saints, les justes appartenant à l’assemblée céleste, ou les deux ; le guèze ne permet pas de trancher.
    reason: alternative_reading
  - marker: c
    text: 'On peut aussi comprendre : « Ainsi en sera-t-il parmi eux pour toujours et à jamais. » Le texte principal décrit un état présent, mais le contexte peut autoriser une nuance future.'
    reason: alternative_reading
lexical_decisions:
- source_word: በህየ
  choice: Là
  rationale: Déictique locatif qui introduit la scène visionnaire ; « Là » est direct, naturel et fidèle.
- source_word: ርእያ አዕይንትየ
  choice: mes yeux virent
  rationale: Le verbe à la troisième personne a pour sujet explicite « mes yeux ». Cette tournure préserve la syntaxe emphatique du guèze au lieu de la transformer en complément instrumental (« je vis de mes yeux »).
- source_word: ማኅደሮሙ
  choice: leurs demeures
  rationale: Le nom désigne des lieux où l’on demeure. « Demeures » convient au cadre céleste tout en restant clair et digne.
- source_word: መላእክተ ጽድቅ
  choice: anges de justice
  rationale: La construction génitive est conservée. En français biblique actuel, « justice » peut exprimer ici tout à la fois la rectitude morale et l’ordre juste, sans réduire l’expression au seul sens judiciaire.
- source_word: ምስካቢሆሙ
  choice: leurs lieux de repos
  rationale: Le terme évoque l’action de se coucher ou de reposer. Cette formulation garde l’idée de repos sans imposer l’image concrète de lits ou de couches.
- source_word: ቅዱሳን
  choice: les saints
  rationale: Le substantif pluriel désigne les « saints » ou « êtres saints ». La formulation brève conserve l’indétermination du référent, explicitée en note.
- source_word: ይስእሉ ወያስተበቍዑ ወይጼልዩ
  choice: ils demandaient, suppliaient et priaient
  rationale: Les trois verbes sont rendus distinctement afin de préserver l’accumulation rhétorique et l’intensité de l’intercession.
- source_word: በእንተ ውሉደ ሰብእ
  choice: en faveur des enfants des hommes
  rationale: Cette traduction garde l’expression anthropologique traditionnelle et le registre élevé du passage, sans la réduire à une simple désignation générique.
- source_word: ጽድቅ ከመ ማይ ይውሕዝ ቅድሜሆሙ
  choice: La justice coulait devant eux comme de l’eau
  rationale: La formulation préserve l’image concrète de l’eau qui coule et reprend « justice », déjà employé dans « anges de justice ».
- source_word: ምሕረት ከመ ጠል ውስተ ምድር
  choice: la miséricorde, comme la rosée sur la terre
  rationale: « Miséricorde » rend la bonté compatissante du terme et conserve l’image douce et vivifiante de la rosée.
- source_word: ከመዝ ውእቱ ማእከሎሙ ለዓለመ ዓለም
  choice: Ainsi en est-il parmi eux pour toujours et à jamais
  rationale: La phrase résume l’état durable de la communauté céleste. « Pour toujours et à jamais » restitue l’insistance de l’expression guèze.
theological_decisions:
- issue: Identité de ceux qui intercèdent et de la communauté céleste
  choice: Le texte laisse le pronom « ils » sans identification doctrinale plus précise et conserve le terme « les saints ».
  alternative: Identifier explicitement les intercesseurs soit aux anges seuls, soit aux justes humains décédés.
  rationale: La syntaxe associe les demeures aux anges de justice et les lieux de repos aux saints, mais l’antécédent exact du sujet des trois verbes d’intercession n’est pas entièrement explicite. La traduction ne projette donc pas sur le texte une angélologie ou une doctrine ultérieure des saints.
- issue: Valeur de ጽድቅ
  choice: justice
  alternative: droiture
  rationale: « Justice » fonctionne naturellement dans « anges de justice » et dans l’image de la justice qui coule comme de l’eau, tout en gardant la portée morale et cosmique du terme. « Droiture » est possible, mais moins naturelle dans la seconde image.
- issue: Valeur temporelle de la conclusion
  choice: 'Présent : « Ainsi en est-il »'
  alternative: 'Futur : « Ainsi en sera-t-il »'
  rationale: La forme peut résumer l’état contemplé dans la vision, tandis que le contexte permet aussi une nuance prospective. Le texte principal retient le présent et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne, avec une légère élévation adaptée au récit visionnaire. La ponctuation divise la longue chaîne guèze en unités lisibles sans effacer ses parallélismes. Les formulations « mes yeux virent », « enfants des hommes » et « pour toujours et à jamais » conservent la solennité du passage sans archaïsmes lourds.
