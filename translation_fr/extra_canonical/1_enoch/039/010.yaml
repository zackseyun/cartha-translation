  yaml_path: translation/extra_canonical/1_enoch/039/010.yaml
  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: fr
  text: Et mes yeux le virent en ce lieu[a], et ils le bénirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « virent là, en ce lieu ». Le complément de « virent » est compris dans le contexte plutôt qu’exprimé dans cette courte proposition.'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « bénirent » n’est pas nommé ici ; il peut s’agir des êtres célestes présents en ce lieu.
    reason: source_ambiguity
lexical_decisions:
- source_word: ርእዩ፡ አዕይንትየ
  choice: mes yeux le virent
  rationale: Le verbe « voir » est au pluriel et s’accorde avec « mes yeux ». Le pronom « le » rend en français naturel l’objet masculin compris dans le contexte, sans identifier davantage son référent.
- source_word: በውእቱ፡ መካን
  choice: en ce lieu
  rationale: Cette formulation conserve la localisation démonstrative du texte guèze dans un français simple et digne.
- source_word: ወባረክዎ
  choice: et ils le bénirent
  rationale: La forme verbale exprime une bénédiction adressée à un référent masculin et se lit le plus naturellement avec un sujet pluriel. Le sujet n’étant pas nommé dans cette courte proposition, « ils » en maintient l’indétermination.
theological_decisions:
- issue: Sujet non exprimé du dernier verbe
  choice: ils le bénirent
  alternative: je le bénis
  rationale: La forme transmise favorise un sujet pluriel, mais la proposition ne précise pas qui bénit. La traduction ne l’identifie donc pas explicitement aux êtres célestes et ne transforme pas non plus l’action en un acte d’Hénoch.
- issue: Objet de « virent »
  choice: le virent
  alternative: virent là, en ce lieu
  rationale: Le français demande ici plus naturellement un complément. Le pronom masculin reprend le référent du contexte, tout en laissant son identité ouverte.
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple convient au récit visionnaire. Les pronoms conservent l’ambiguïté des référents sans introduire une identification doctrinale.
