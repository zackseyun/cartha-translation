base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: fr
  text: Et je vis la demeure sous les ailes[a] du Seigneur des esprits. Tous les justes et les élus[b] resplendissaient devant lui comme la lumière du feu. Leur bouche était remplie de bénédiction, et leurs lèvres louaient le nom du Seigneur des esprits. La justice ne disparaît pas devant lui[c], et la droiture ne disparaît pas devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image « sous les ailes » est conservée littéralement afin de préserver son symbolisme visionnaire de protection et de proximité.
    reason: cultural_note
  - marker: b
    text: 'Ou : « ceux qui ont été choisis » au lieu de « les élus ».'
    reason: lexical_alternative
  - marker: c
    text: Le verbe répété dans les deux dernières propositions peut aussi se traduire par « ne périt pas », « ne passe pas » ou « ne prend pas fin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅደረ
  choice: la demeure
  rationale: Le nom désigne un lieu d’habitation. « La demeure » est concret, naturel et digne en français moderne.
- source_word: መትሕተ አክናፈ
  choice: sous les ailes
  rationale: La formulation spatiale et l’image visionnaire des ailes sont conservées sans les réduire à une simple idée de protection.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Ce titre récurrent de 1 Hénoch est rendu littéralement et uniformément, sans ajouter d’article défini devant « esprits » que le français n’exige pas ici.
- source_word: ጻድቃን ወኄሩያን
  choice: les justes et les élus
  rationale: Les deux groupes nominaux parallèles sont maintenus. « Élus » exprime le fait d’être choisi et convient au registre apocalyptique, tout en signalant en note l’alternative moins chargée.
- source_word: ይትሰሐዩ
  choice: resplendissaient
  rationale: Le verbe exprime le rayonnement. « Resplendissaient » s’accorde naturellement avec la comparaison lumineuse et garde la force visionnaire.
- source_word: ከመ ብርሃነ እሳት
  choice: comme la lumière du feu
  rationale: Cette traduction conserve la comparaison inhabituelle et la distinction entre lumière et feu.
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: leur bouche était remplie de bénédiction
  rationale: Le singulier distributif français préserve le parallélisme corporel et rend በረከተ par « bénédiction », plutôt que par l’interprétation plus générale « louange ».
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: leurs lèvres louaient
  rationale: « Lèvres » conserve le parallélisme poétique avec « bouche » ; « louaient » rend directement l’action exprimée.
- source_word: ጽድቅ
  choice: la justice
  rationale: « Justice » est l’équivalent abstrait français le plus naturel ici et reste distinct de la « droiture » de la proposition parallèle.
- source_word: ወርትዕ
  choice: la droiture
  rationale: Le terme évoque ce qui est droit ou intègre. « Droiture » conserve sa portée morale et le parallélisme avec « justice ».
- source_word: ኢየኃልቅ
  choice: ne disparaît pas
  rationale: Le verbe répété exprime l’absence de fin, de disparition ou d’anéantissement. « Ne disparaît pas » est idiomatique tout en laissant la nuance exacte ouverte dans la note.
theological_decisions:
- issue: Interprétation de ኄሩያን dans le langage apocalyptique du passage
  choice: les élus
  alternative: ceux qui ont été choisis / les choisis
  rationale: « Les élus » rend clairement une catégorie nominale parallèle aux « justes ». La note conserve une formulation alternative qui évite de fixer le terme dans un système doctrinal ultérieur.
- issue: Portée des deux propositions finales sur la justice et la droiture
  choice: La justice ne disparaît pas devant lui, et la droiture ne disparaît pas devant lui
  alternative: La justice ne prend pas fin devant lui, et la droiture ne prend pas fin devant lui
  rationale: La répétition du même verbe est conservée, de même que l’affirmation de permanence en présence de Dieu. « Ne disparaît pas » n’impose pas une explication métaphysique plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant les parallélismes, les répétitions et les images concrètes du guèze.
