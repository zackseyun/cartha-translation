base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: fr
  text: En ces jours-là, Hénoch reçut des livres de zèle et de colère, ainsi que des livres de tumulte et de confusion[a]. « Il n’y aura pas de miséricorde pour eux », dit le Seigneur des Esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze est difficile à cet endroit. Les mots traduits par « tumulte et confusion » peuvent aussi désigner, plus généralement, l’agitation, la clameur ou le désordre.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: jours
  rationale: Conserve la formule temporelle apocalyptique naturelle « en ces jours-là », sans préciser davantage.
- source_word: ነሥአ
  choice: reçut
  rationale: Dans ce contexte, Hénoch est le destinataire de livres révélés; « reçut » est plus juste que le sens plus littéral « prit ».
- source_word: መጻሕፍተ
  choice: livres
  rationale: Rend directement le pluriel « livres/écrits » sans introduire la précision matérielle de « rouleaux ».
- source_word: ቅንአት
  choice: zèle
  rationale: Le terme peut signifier zèle ou jalousie; dans ce contexte de jugement, « zèle » préserve l’idée d’ardeur sans la réduire à l’envie humaine.
- source_word: መዐት
  choice: colère
  rationale: Terme français fort et actuel qui convient au registre judiciaire apocalyptique; « courroux » serait plus archaïque.
- source_word: ጐጕአ
  choice: tumulte
  rationale: La forme du témoin est difficile, mais elle semble relever du champ du trouble, du cri ou de l’agitation; « tumulte » garde cette largeur de sens.
- source_word: ሀውክ
  choice: confusion
  rationale: Exprime le désordre et le bouleversement tout en restant assez large face à l’incertitude du texte guèze.
- source_word: ምሕረት
  choice: miséricorde
  rationale: Rendu consacré et digne de la miséricorde divine, maintenant le contraste avec le zèle et la colère.
- source_word: ኢይከውን ላዕሌሆሙ
  choice: il n’y aura pas de miséricorde pour eux
  rationale: Formulation française naturelle qui conserve sans l’alourdir la déclaration solennelle de jugement.
- source_word: እግዚአ መናፈስት
  choice: Seigneur des Esprits
  rationale: Conserve sous une forme élevée le titre divin récurrent des Paraboles.
theological_decisions:
- issue: Nature des « livres » énumérés
  choice: Deux groupes de livres sont caractérisés respectivement par le zèle et la colère, puis par le tumulte et la confusion.
  alternative: On peut comprendre l’ensemble comme une description composée d’une seule collection d’écrits, et les termes médians difficiles peuvent évoquer plus généralement le cri ou le désordre.
  rationale: La répétition de መጻሕፍተ favorise la distinction de deux groupes, mais la traduction n’explicite pas leur contenu au-delà des termes du texte.
- issue: Référent de « eux »
  choice: Le pronom désigne les personnes soumises au jugement dans le contexte environnant.
  alternative: Une lecture grammaticalement plus lâche pourrait le rattacher aux éléments immédiatement précédents.
  rationale: La miséricorde refusée constitue naturellement une sentence visant des personnes; la traduction laisse néanmoins le pronom tel quel plutôt que d’ajouter son référent.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit, tandis que la parole de jugement est mise au discours direct pour clarifier l’attribution sans modifier son contenu. La majuscule à « Esprits » signale le titre divin récurrent.
