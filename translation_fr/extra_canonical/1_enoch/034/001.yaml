base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: fr
  text: De là, je suis allé vers le nord, jusqu’aux extrémités de la terre, et là j’ai vu une grande merveille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription éthiopienne fournie porte ምሕረ, vraisemblablement par erreur de lecture pour መንክረ, « merveille » ou « prodige ».
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Expression déictique simple qui relie ce déplacement au lieu précédent de la vision.
- source_word: ሖርኩ
  choice: je suis allé
  rationale: Rend naturellement le verbe de mouvement à la première personne sans ajouter de coloration littéraire.
- source_word: መንገለ መስዕ
  choice: vers le nord
  rationale: መስዕ désigne le nord; la construction exprime ici la direction du déplacement.
- source_word: በአጽናፈ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: Conserve l’image cosmographique du texte apocalyptique dans un français clair et digne.
- source_word: ርኢኩ
  choice: j’ai vu
  rationale: Formulation courante et directe du compte rendu visionnaire.
- source_word: ምሕረ ዐቢየ
  choice: une grande merveille
  rationale: La transcription ምሕረ est vraisemblablement une erreur de lecture pour መንክረ, « merveille, prodige »; cette restitution correspond au texte critique et au contexte.
theological_decisions:
- issue: Nature de ce qu’Hénoch voit
  choice: une grande merveille
  alternative: un grand prodige
  rationale: Le texte décrit l’objet comme remarquable sans préciser sa nature ni lui attribuer une signification doctrinale particulière.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple, et l’imagerie cosmographique est conservée sans archaïsme.
