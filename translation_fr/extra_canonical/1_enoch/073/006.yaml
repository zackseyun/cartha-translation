base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: fr
  text: Ce jour-là, elle prend un septième de la moitié de sa lumière[a], et sa lumière devient un septième et demi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze rendue par « un septième » contient littéralement le mot « main », employé ici comme unité de mesure.
    reason: lexical_alternative
  - marker: b
    text: La formulation numérique guèze est difficile. Le texte est compris ici comme « un septième et demi », c’est-à-dire une unité et demie de septièmes; la construction exacte demeure incertaine.
    reason: textual_variant
lexical_decisions:
- source_word: በዕለተ
  choice: ce jour-là
  rationale: Rend naturellement l’expression temporelle concrète dans le cadre du calendrier astronomique.
- source_word: ትነሥእ
  choice: elle reçoit
  rationale: Le verbe unique exprime ici l’acquisition ou la réception d’une quantité de lumière; cette traduction évite de le rendre deux fois par «se lève» puis «prend».
- source_word: ሳብዐተ እደ
  choice: un septième
  rationale: Dans ce contexte de mesure astronomique, l’expression idiomatique désigne une septième part, et non sept parts distinctes.
- source_word: መንፈቀ ብርሃኑ
  choice: la moitié de sa lumière
  rationale: Conserve explicitement la fraction et la répétition du terme «lumière».
- source_word: ይከውን
  choice: devient
  rationale: Marque simplement l’état résultant sans ajouter d’explication au mécanisme décrit.
- source_word: ሳብዐተ እደ አሐተ ወመንፈቃ
  choice: une part et demie sur sept
  rationale: Exprime intelligiblement la lecture fractionnaire probable, soit une unité et demie de septièmes, tout en signalant en note la difficulté de la formulation guèze.
theological_decisions:
- issue: Genre du luminaire
  choice: Employer «elle» conformément au genre français de «lune» dans le contexte immédiat
  alternative: Employer une tournure impersonnelle ou répéter «le luminaire»
  rationale: Le français exige un accord grammatical; «elle» renvoie naturellement à la lune sans transformer la description astronomique en affirmation doctrinale sur sa personnification.
- issue: Interprétation des quantités de lumière
  choice: Conserver le calcul fractionnaire dans le texte principal
  alternative: Rendre littéralement «sept mains, une et demie»
  rationale: Le contexte astronomique indique des unités mesurées; la note préserve toutefois la forme idiomatique et l’incertitude de l’expression source.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de la description astronomique du texte source, tandis que les fractions sont formulées de manière compréhensible. Les deux notes rendent visibles l’idiome de mesure et l’incertitude numérique.
