base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: fr
  text: Chaque mois, sa sortie et son entrée varient[a], et ses jours sont comme ceux du soleil ; lorsque sa lumière est dans toute sa clarté[b], elle équivaut au septième de la lumière du soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots traduits par « sortie » et « entrée » peuvent désigner le parcours cyclique de l’astre. Dans ce contexte astronomique, on pourrait aussi comprendre « lever » et « coucher », mais le guèze ne l’impose pas explicitement.
    reason: lexical_alternative
  - marker: b
    text: L’expression décrit ici la lumière de la lune lorsqu’elle est claire et pleinement manifestée, c’est-à-dire à sa pleine luminosité.
    reason: cultural_note
lexical_decisions:
- source_word: ሙፃኢሁ፡ ወምብዋኢሁ
  choice: sa sortie et son entrée
  rationale: 'Les deux noms forment un couple désignant le mouvement cyclique de l’astre : le premier évoque le fait de sortir, le second celui d’entrer. « Lever » et « coucher » seraient possibles dans ce contexte astronomique, mais préciseraient davantage que le guèze.'
- source_word: ይትዌለጥ
  choice: varient
  rationale: Le verbe exprime un changement ou une différenciation. « Varient » convient au caractère cyclique et mensuel de l’observation.
- source_word: መዋዕሊሁ፡ ከመ፡ መዋዕለ፡ ፀሐይ
  choice: ses jours sont comme ceux du soleil
  rationale: Cette formulation conserve la comparaison introduite par ከመ sans la transformer en affirmation plus précise sur la durée ou l’égalité des cycles.
- source_word: ይፄሪ፡ ከዊነ፡ ብርሃኑ
  choice: lorsque sa lumière est dans toute sa clarté
  rationale: Dans cet emploi lunaire, ይፄሪ indique une lumière claire, brillante ou pleinement manifestée. La formulation française rend naturellement l’idée de pleine luminosité sans confondre le verbe avec un obscurcissement.
- source_word: ሳብዓደ፡ እደ፡ እምብርሃነ፡ ፀሐይ
  choice: elle équivaut au septième de la lumière du soleil
  rationale: La locution exprime une fraction d’un septième par rapport à la lumière solaire. « Équivaut au septième » rend clairement cette comparaison quantitative.
