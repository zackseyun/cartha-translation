base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: fr
  text: Et sa moitié éloignée est une septième partie[a], et tout son disque est vide, sans lumière[b], à l’exception d’un septième de celui-ci — un quatorzième de sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cette construction, le terme qui exprime la partie signifie littéralement « main » ou « part ». Il sert ici à former une fraction dans le système de mesure de l’astre.
    reason: lexical_alternative
  - marker: b
    text: Le verset décrit les portions éclairées et obscures de la lune selon le système schématique du Livre astronomique, et non selon les catégories de l’astronomie moderne.
    reason: cultural_note
lexical_decisions:
- source_word: መንፈቀ ርኁቅ
  choice: sa moitié éloignée
  rationale: መንፈቀ désigne une moitié ou portion divisée, et ርኁቅ signifie « éloigné ». La formulation conserve le langage spatial du texte sans préciser davantage le référent.
- source_word: ሳብዐተ እደ አሐደ
  choice: un septième
  rationale: Dans ce contexte de mesure lunaire, la construction avec l’ordinal et እድ (« main », puis « part ») exprime une fraction. « Un septième » rend le rapport mathématique plutôt que le contresens « sept parts ».
- source_word: ኵሉ ክበበ ዚአሁ
  choice: tout son disque
  rationale: ክበብ désigne un cercle ou une forme ronde ; « disque » est naturel dans ce contexte astronomique tout en restant proche de l’image source.
- source_word: ባክ ዘአልቦ ብርሃነ
  choice: est vide, sans lumière
  rationale: La formulation garde les deux éléments de privation présents dans l’éthiopien et décrit visuellement la portion non éclairée.
- source_word: ዘእንበለ ሳብዐተ እዴሁ
  choice: à l’exception d’un septième de celui-ci
  rationale: ዘእንበለ introduit l’exception et la construction numérique indique ici une fraction du disque.
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  choice: un quatorzième de sa lumière
  rationale: La syntaxe fractionnaire donne « un quatorzième ». Le mot « lumière » maintient la correspondance avec ብርሃን et la logique des quatorze unités lumineuses du passage.
theological_decisions:
- issue: Nature de la description de l’astre
  choice: Conserver une mesure astronomique technique et apocalyptique en septièmes et quatorzièmes.
  alternative: Paraphraser le verset comme une simple description moderne d’une phase de la lune.
  rationale: Le Livre astronomique décrit les cycles célestes selon son propre système de portions mesurées. Une normalisation scientifique moderne effacerait sa cosmologie et résoudrait abusivement une formulation difficile.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe répétitive et les fractions du texte astronomique sont préservées ; le tiret met en apposition la mesure lumineuse finale sans en expliquer davantage le rapport.
