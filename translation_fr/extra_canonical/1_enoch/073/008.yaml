  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: fr
  text: Et ce jour-là, elle se lève avec exactement sept parts[a], et elle sort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept portions ». Il s’agit vraisemblablement des portions de lumière visible de la lune.
    reason: Précision lexicale et contextualisation d’une expression elliptique.
lexical_decisions:
- source_word: ይሠርቅ
  choice: elle se lève
  rationale: Le verbe désigne ici le lever d’un astre. Le pronom féminin renvoie naturellement en français à la lune, sujet du contexte.
- source_word: በይእቲ ዕለት
  choice: ce jour-là
  rationale: 'La préposition, le démonstratif et le nom forment un complément temporel : « ce jour-là ».'
- source_word: ሳብዐተ እደ
  choice: sept parts
  rationale: Le syntagme indique sept portions ou parts, vraisemblablement de la lumière visible de la lune. La traduction n’ajoute pas « de lumière », qui n’est pas exprimé dans ce verset.
- source_word: ጥንቁቀ
  choice: exactement
  rationale: L’adverbe exprime la précision ou l’exactitude du nombre indiqué.
- source_word: ይወፅእ
  choice: elle sort
  rationale: Le verbe courant de sortie est conservé, malgré la proximité sémantique avec le lever, afin de respecter le mouvement décrit par le texte.
theological_decisions:
- issue: Référent des verbes au masculin singulier en guèze
  choice: Employer « elle », en référence à la lune, nom féminin en français.
  alternative: Employer un sujet impersonnel ou répéter « la lune ».
  rationale: Le genre grammatical français exige ici le féminin lorsque le référent contextuel est la lune. Cela conserve le sujet céleste concret sans imposer une personnification doctrinale.
- issue: Nature des « sept parts »
  choice: Ne pas préciser dans le corps du texte qu’il s’agit de parts de lumière.
  alternative: Traduire « sept parts de lumière ».
  rationale: Le contexte astronomique suggère des portions de lumière lunaire, mais le complément « de lumière » n’est pas explicite dans la formulation guèze transmise.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de deux verbes de mouvement proches (« se lève » et « sort ») est maintenue parce qu’elle appartient à la formulation schématique du passage astronomique.
