base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: fr
  text: Elle se couche avec le soleil[a] ; et quand le soleil se lève, la lune se lève avec lui et reçoit une demi-part de lumière[b]. Cette nuit-là, au commencement de son matin, avant le jour[c], la lune se couche avec le soleil et est obscure durant cette nuit — sept parts et demie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze devient difficile dans la seconde moitié du verset, notamment autour de « au commencement de son matin, avant le jour ». La traduction conserve donc assez littéralement la succession temporelle au lieu de la transformer en explication astronomique moderne.
    reason: textual_variant
  - marker: b
    text: Le chapitre mesure à plusieurs reprises la lumière de la lune en « parts ». L’expression « une demi-part de lumière » appartient probablement au même système de fractions d’illumination.
    reason: cultural_note
  - marker: c
    text: 'La syntaxe peut aussi être ponctuée ainsi : « avant le jour, la lune se couche ». Le texte guèze ne justifie pas avec certitude l’ajout « de la lune » après « le jour ».'
    reason: previous_rendering
lexical_decisions:
- source_word: የዓርብ
  choice: se couche
  rationale: Dans ce contexte astronomique, le verbe désigne le coucher d’un astre ; « se couche » est l’expression française naturelle et précise.
- source_word: ይሠርቅ
  choice: se lève
  rationale: Le verbe est appliqué successivement au soleil et à la lune, par opposition au coucher ; « se lève » conserve cet usage astronomique.
- source_word: ምስሌሁ
  choice: avec lui
  rationale: Le pronom renvoie au soleil, nom masculin en français ; cette reprise est naturelle sans personnifier davantage l’astre.
- source_word: ይነሥእ
  choice: reçoit
  rationale: Dans la description de la lumière acquise par la lune, « reçoit » rend le mouvement d’acquisition sans expliquer le mécanisme selon l’astronomie moderne.
- source_word: መንፈቀ እደ ብርሃን
  choice: une demi-part de lumière
  rationale: La formulation conserve à la fois l’idée de moitié et celle d’une unité mesurée, en cohérence avec le système de « parts » employé dans le chapitre.
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: au commencement de son matin
  rationale: Littéralement proche de « à la tête de son matin ». Cette formulation lisible garde le possessif et l’expression temporelle inhabituelle du texte.
- source_word: በቅድመ ዕለቱ
  choice: avant le jour
  rationale: La traduction demeure proche de la construction temporelle guèze et n’ajoute pas « de la lune », dont le rattachement syntaxique reste incertain.
- source_word: ይጸልም
  choice: reste obscure
  rationale: Le verbe exprime l’état d’obscurité. « Reste obscure » convient à la durée indiquée par « durant cette nuit » sans transformer le passage en explication scientifique.
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: sept parts et demie
  rationale: Cette expression française conserve explicitement les unités comptées et leur fraction dans le système de mesure de la lumière lunaire.
theological_decisions:
- issue: Préserver la cosmologie visionnaire et préscientifique du Livre des luminaires
  choice: Maintenir le langage concret du lever, du coucher et des parts mesurées de lumière
  alternative: Paraphraser le passage en termes de phases lunaires, de conjonction ou d’éclipse
  rationale: Le texte présente l’ordre céleste dans son propre cadre cosmologique. Une reformulation moderne résoudrait artificiellement ses images et ses tensions.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné du guèze est légèrement allégé, mais la séquence et les répétitions astronomiques sont conservées. « Demi-part » est volontairement inhabituel afin de préserver le système de mesure propre au chapitre.
