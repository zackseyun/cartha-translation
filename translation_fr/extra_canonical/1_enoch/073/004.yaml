base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: fr
  text: Et c’est ainsi qu’elle se lève[a]. Sa partie antérieure[b], tournée vers l’est, sort le trentième matin ; ce jour-là, elle devient visible. Elle constituera pour vous le commencement du mois[c], le trentième jour[d], avec le soleil, dans la porte[e] d’où sort le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe est compris diversement ; il peut aussi être rendu par « elle est cachée » ou « elle disparaît ».
    reason: source_ambiguity
  - marker: b
    text: 'Littéralement : « sa tête » ; l’expression peut désigner sa partie initiale ou celle qui se présente en premier.'
    reason: literal_rendering
  - marker: c
    text: 'Littéralement : « la tête du mois », expression désignant son commencement.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « trente jour(s) » ; dans ce contexte calendaire, l’expression est comprise comme « le trentième jour ».'
    reason: source_ambiguity
  - marker: e
    text: La « porte » appartient à la représentation récurrente, dans le Livre astronomique, de luminaires sortant par des ouvertures ordonnées du ciel.
    reason: cultural_note
lexical_decisions:
- source_word: ይሠርቅ
  choice: elle se lève
  rationale: Dans ce passage astronomique, le verbe décrit naturellement le lever ou l’apparition de la lune. « Se lève » conserve le mouvement concret du texte et s’accorde avec la sortie des luminaires par les portes célestes.
- source_word: ርእሱ
  choice: sa partie avant
  rationale: Le mot signifie littéralement « sa tête ». Ici, il désigne vraisemblablement la partie qui se présente en premier, orientée vers l’est. « Sa partie avant » reste concret tout en étant plus intelligible en français que « sa tête ».
- source_word: ዘመንገለ ጽባሕ
  choice: orientée vers l’est
  rationale: L’expression indique la direction du matin ou du levant. « Vers l’est » exprime clairement cette orientation liée au lever du soleil.
- source_word: በሠላሳ ጽባሕ
  choice: au trentième matin
  rationale: 'La construction marque le moment de l’apparition dans le cycle : le trentième matin.'
- source_word: ያስተርኢ
  choice: elle devient visible
  rationale: La forme verbale exprime le fait de rendre visible ou de se montrer. Dans le contexte des phases lunaires, « devient visible » transmet naturellement le résultat observé.
- source_word: ርእሰ ወርኅ
  choice: le commencement du mois
  rationale: Littéralement « la tête du mois », idiome concret désignant son commencement. La traduction idiomatique évite une expression obscure en français, tandis qu’une note conserve l’image source.
- source_word: ሠላሳ ዕለት
  choice: le trentième jour
  rationale: Bien que la forme soit littéralement « trente jour(s) », le contexte calendaire et le parallèle avec « au trentième matin » favorisent une date ordinale.
- source_word: ምስለ ፀሐይ
  choice: avec le soleil
  rationale: La préposition marque l’association ou la concomitance entre la lune et le soleil.
- source_word: በኆኅት
  choice: dans la porte
  rationale: Le choix maintient l’image cosmologique récurrente des luminaires qui sortent par des portes célestes.
- source_word: እንተ ይወፅእ ፀሐይ
  choice: d’où sort le soleil
  rationale: La proposition relative identifie la porte par laquelle le soleil effectue sa sortie. Cette formulation française reste simple et concrète.
theological_decisions:
- issue: Faut-il moderniser la cosmologie du passage ?
  choice: Conserver la « porte » et la sortie du soleil.
  alternative: Parler de l’horizon oriental ou du point du lever du soleil.
  rationale: Le passage expose son système cosmologique dans une imagerie propre. Le remplacer par un vocabulaire astronomique moderne effacerait une dimension importante du texte.
- issue: Comment rendre l’expression calendaire « tête du mois » ?
  choice: Employer « commencement du mois » dans le texte et signaler le sens littéral en note.
  alternative: Conserver « tête du mois » dans le corps du texte.
  rationale: Cette solution transmet le sens calendaire à un lectorat moderne sans dissimuler l’image concrète de l’original.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement segmentée pour faciliter la lecture, tandis que l’imagerie cosmologique et la répétition de la sortie du soleil ont été conservées.
