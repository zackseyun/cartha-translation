base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: fr
  text: Son circuit est comme le circuit du ciel, et ses chars, par lesquels il sort, sont poussés par le vent[a] ; la lumière lui est donnée selon une mesure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe guèze de cette proposition est difficile. On peut aussi comprendre : « ses chars, sur lesquels il monte, sont emportés par le vent », ou : « ses chars avancent là où souffle le vent ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « par mesure » ou « selon la mesure ». L’expression peut évoquer une lumière accordée de façon proportionnée, réglée ou ordonnée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: son circuit
  rationale: Le nom évoque ce qui décrit un cercle, qu’il s’agisse d’une étendue circulaire ou d’un parcours. « Circuit » conserve cette double nuance sans introduire la notion astronomique moderne d’orbite.
- source_word: ከመ ክበበ ሰማይ
  choice: comme le circuit du ciel
  rationale: Cette formulation rend la comparaison explicite et maintient le registre cosmique du passage.
- source_word: ሰረገላተ ዚአሁ
  choice: ses chars
  rationale: « Chars » préserve l’image apocalyptique de véhicules célestes et le pluriel du texte.
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: par lesquels il sort, sont poussés par le vent
  rationale: La formulation conserve la mention de la sortie du luminaire, absente de certaines traductions, tout en donnant un sens naturel à l’action du vent. La syntaxe guèze demeure difficile, ce que signale la note.
- source_word: በመስፈርት
  choice: selon une mesure déterminée
  rationale: Le terme désigne une mesure, une règle ou une proportion. « Selon une mesure déterminée » exprime l’idée d’une distribution ordonnée sans préciser indûment sa nature.
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: la lumière lui est donnée
  rationale: 'Le passif du texte est conservé : la lumière est présentée comme reçue ou attribuée, et non comme produite intrinsèquement.'
theological_decisions:
- issue: Faut-il moderniser le mouvement du luminaire en termes astronomiques ?
  choice: Conserver « circuit » et « chars ».
  alternative: Employer « orbite », « trajectoire » ou « véhicules ».
  rationale: Le texte décrit le cosmos au moyen d’images visionnaires. Les conserver respecte son genre et évite d’y importer des catégories scientifiques modernes.
- issue: La lumière est-elle inhérente au luminaire ou lui est-elle attribuée ?
  choice: 'Conserver le passif : « la lumière lui est donnée ».'
  alternative: Traduire librement par « il brille » ou « il produit de la lumière ».
  rationale: Le guèze présente explicitement la lumière comme donnée au luminaire. La traduction ne doit ni supprimer ni développer la portée théologique possible de ce passif.
translation_notes:
  register: Français international moderne, clair et soutenu. La formulation conserve les images cosmiques traditionnelles sans archaïsme excessif. Le point-virgule distingue les deux affirmations tout en maintenant leur unité.
