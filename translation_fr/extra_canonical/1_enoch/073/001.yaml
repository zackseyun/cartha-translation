base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/001.yaml
  text: And after this law I saw another law for the lesser light[b][a], whose name is the moon.
translation:
  language: fr
  text: Après cette loi, je vis une autre loi[a] pour le petit luminaire, appelé la lune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ordonnance », « ordre » ou « commandement » pour les deux occurrences de « loi » ; le terme guèze peut désigner une disposition prescrite aussi bien qu’une directive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወድኅሬሁ
  choice: Après cette
  rationale: Rend la transition temporelle vers une nouvelle disposition cosmique, en conservant le lien avec ce qui précède.
- source_word: ትእዛዝ
  choice: loi
  rationale: Dans le Livre astronomique, le terme désigne ici une disposition prescrite qui régit régulièrement les luminaires. « Loi » convient mieux à cet ordre cosmique durable qu’un simple commandement ponctuel; la répétition du terme est conservée.
- source_word: ርኢኩ
  choice: je vis
  rationale: Formulation naturelle et digne du témoignage visionnaire à la première personne.
- source_word: ካልአ
  choice: une autre
  rationale: Signale une disposition supplémentaire correspondant à celle qui vient d’être décrite.
- source_word: ለብርሃን ንኡስ
  choice: pour la lumière moindre
  rationale: Conserve l’image de la lune comme lumière de rang ou de grandeur moindre, sans remplacer l’expression du texte par un terme astronomique moderne.
- source_word: ዘስሙ
  choice: dont le nom est
  rationale: Reproduit clairement la construction relative qui introduit l’identification de la lumière.
- source_word: ወርኅ
  choice: la lune
  rationale: Équivalent français courant et exact du terme guèze.
theological_decisions:
- issue: Sens de ትእዛዝ dans l’ordre cosmique
  choice: loi
  alternative: commandement, ordonnance ou ordre
  rationale: « Loi » exprime une disposition normative et régulière gouvernant le luminaire. La note maintient l’éventail lexical du guèze sans trancher davantage que ne le permet le contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « loi » reflète celle du guèze; « lumière moindre » préserve l’imagerie cosmique et sa tension avec une formulation française plus idiomatique comme « petit luminaire ».
