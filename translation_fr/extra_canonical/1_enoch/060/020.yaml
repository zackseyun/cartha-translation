base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: fr
  text: L’esprit de la rosée[a] a sa demeure aux extrémités du ciel et il est lié aux réserves de la pluie. Son cours[b] est en hiver et en été. Ses nuages et les nuages de la brume[c] sont réunis, et l’un donne à l’autre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle de la rosée » ou « le vent de la rosée ». Le terme guèze peut avoir ces différents sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « son circuit » ou « son trajet » ; le terme peut désigner un mouvement ou une voie, et sa nuance exacte est incertaine ici.
    reason: lexical_alternative
  - marker: c
    text: Le mot rendu par « brume » peut aussi désigner le brouillard ou la brume sèche.
    reason: lexical_alternative
  - marker: d
    text: 'La dernière proposition peut exprimer un échange réciproque : « chacun donne à l’autre ».'
    reason: ambiguity
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: l’esprit de la rosée
  rationale: « Esprit » conserve la personnification cosmologique et le registre apocalyptique du terme መንፈስ, qui peut aussi signifier « souffle » ou « vent »; « rosée » rend directement ጠል.
- source_word: ማኅደሩ
  choice: a sa demeure
  rationale: Le mot désigne ici une demeure ou une habitation. Ce choix respecte la différence avec መዛግብተ, « réserves », employé ensuite pour la pluie.
- source_word: በአጽናፈ ሰማይ
  choice: aux extrémités du ciel
  rationale: La formule préserve la représentation cosmologique ancienne des confins du ciel dans un français clair et digne.
- source_word: ድኁግ ውእቱ ምስለ መዛግብተ ዝናም
  choice: il est lié aux réserves de la pluie
  rationale: Le passage exprime une association ou une liaison avec les lieux où la pluie est conservée. « Réserves » rend l’image sans confondre ce terme avec celui traduit par « demeure ».
- source_word: ምሕዋረ ዚአሃ
  choice: son parcours
  rationale: Le substantif peut désigner un mouvement, un trajet ou un circuit. « Parcours » reste naturel tout en évitant de préciser indûment la forme du mouvement.
- source_word: በክረምት ወበሐጋይ
  choice: en hiver comme en été
  rationale: Cette formulation rend la paire saisonnière traditionnelle sans lui imposer une interprétation climatique régionale telle que « saison des pluies » et « saison sèche ».
- source_word: ደመና ጊሜ
  choice: les nuages de la brume
  rationale: La répétition de « nuages » est conservée, et « brume » offre un équivalent atmosphérique plausible de ጊሜ, dont la nuance exacte demeure incertaine.
- source_word: ኅቡር ውእቱ
  choice: sont réunis
  rationale: Le mot exprime l’union ou la mise en commun des formations atmosphériques.
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: l’un donne à l’autre
  rationale: La traduction suit de près la construction guèze tout en conservant son indétermination quant au caractère réciproque ou successif de ce don.
theological_decisions:
- issue: Faut-il comprendre መንፈሰ comme une force météorologique impersonnelle ou comme un « esprit » cosmique personnifié ?
  choice: l’esprit de la rosée
  alternative: le vent de la rosée / le souffle de la rosée
  rationale: Dans ce catalogue apocalyptique des réalités célestes, « esprit » maintient la personnification et la tension du texte sans lui attribuer un sens doctrinal ultérieur.
translation_notes:
  register: Français international actuel, clair et soutenu. La formulation conserve l’imagerie cosmologique et la personnification apocalyptique, ainsi que la distinction lexicale entre la « demeure » de l’esprit de la rosée et les « réserves » de la pluie.
