  terminology: « Demeure » distingue à juste titre ማኅደር des መዛግብተ de la pluie. « Réserves » est acceptable, mais « magasins » ou « trésors » seraient plus concrets ; aucune correction n’est indispensable sur ce point. « Brume » conserve correctement l’incertitude de ጊሜ. Les ancres de notes correspondent aux expressions pertinentes.
  issues:
