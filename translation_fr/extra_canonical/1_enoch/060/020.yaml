  source_fidelity: 'La traduction rend fidèlement les principaux éléments du guèze : « esprit de la rosée », sa demeure aux extrémités du ciel, son lien avec les réserves de la pluie, son parcours saisonnier et l’union des formations nuageuses. Toutefois, la formulation « en hiver comme en été » introduit une nuance comparative (« aussi bien... que ») absente de la simple coordination source « en hiver et en été ».'
