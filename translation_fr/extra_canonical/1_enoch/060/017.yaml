base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: fr
  text: L’esprit du givre est son propre ange, et l’esprit de la grêle est un bon ange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ
  choice: l’esprit de
  rationale: La répétition de መንፈሰ introduit des forces météorologiques personnifiées. « L’esprit de » conserve cette imagerie apocalyptique.
- source_word: አስሐትያ
  choice: givre
  rationale: Le terme désigne ici le givre ou la gelée blanche, et non un nom propre angélique. « Givre » est naturel et précis en français moderne.
- source_word: መልአክ፡ ዚአሁ፡ ውእቱ
  choice: est son propre ange
  rationale: La formule signifie littéralement qu’il est « l’ange de lui/de cela ». « Son propre ange » exprime l’identité entre l’esprit du givre et l’ange qui lui est associé, sans inventer un nom propre.
- source_word: በረድ
  choice: grêle
  rationale: Le sens météorologique ordinaire convient à cette liste de phénomènes cosmiques personnifiés.
- source_word: መልአክ፡ ኄር፡ ውእቱ
  choice: est un bon ange
  rationale: ኄር est l’adjectif « bon » et non un nom propre. La syntaxe attributive est rendue directement en français.
theological_decisions:
- issue: Rapport entre l’esprit du givre et son ange
  choice: L’esprit du givre est présenté comme étant lui-même son propre ange.
  alternative: Comprendre qu’un ange distinct est attribué à l’esprit du givre ou qu’il porte un nom propre.
  rationale: La construction éthiopienne identifie l’esprit à « son ange »; elle ne fournit pas le nom d’un ange distinct. La traduction conserve cette formulation inhabituelle et l’univers apocalyptique du passage.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle de l’éthiopien est maintenue, ainsi que la personnification des phénomènes météorologiques.
