base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: fr
  text: Car, lorsque l’éclair jaillit, le tonnerre fait entendre sa voix, et l’esprit[a] se repose au temps qui lui est fixé et répartit également entre eux[b] ; car le trésor de leurs temps est fait de sable, et tous deux sont retenus par une bride et ramenés en arrière par la puissance de l’esprit[a] ; de même, ils sont poussés en avant suivant les nombreuses régions de la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent », aux deux endroits ; le mot guèze peut désigner le vent, le souffle ou l’esprit.
    reason: lexical_alternative
  - marker: b
    text: 'La proposition est difficile ; on pourrait aussi traduire plus prudemment : « et répartit entre eux ».'
    reason: alternative_reading
  - marker: c
    text: La formulation finale du témoin éthiopien est obscure ; « contrées » ou « quartiers de la terre » sont également possibles.
    reason: textual_difficulty
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: l’éclair jaillit
  rationale: Rend vivement la construction verbale et nominale exprimant l’apparition soudaine de l’éclair.
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: le tonnerre fait entendre sa voix
  rationale: Conserve la personnification concrète du texte guèze tout en restant idiomatique en français.
- source_word: መንፈስ
  choice: l’esprit
  rationale: Le terme peut signifier esprit, vent ou souffle. « Esprit » préserve sa portée cosmologique et son agentivité, tandis que « vent » est signalé en note.
- source_word: በጊዜሃ ያዐርፍ
  choice: se repose au temps qui lui est fixé
  rationale: Exprime à la fois le repos et l’ordonnancement temporel du phénomène sans rendre l’idée plus précise que le texte.
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: répartit également entre eux
  rationale: Préserve la notion de partage et la valeur probable d’égalité, tout en signalant l’incertitude de cette proposition.
- source_word: መዝገበ ጊዜያቲሆሙ ዘኆጻ ውእቱ
  choice: le trésor de leurs temps est fait de sable
  rationale: Conserve l’image apocalyptique concrète du trésor et rend ዘኆጻ selon son sens « de sable », plutôt que l’ancienne lecture « fixé ».
- source_word: ፪፪እምኔሆሙ በአጓም ይትነኃዙ
  choice: tous deux sont retenus par une bride
  rationale: Rend la référence aux deux entités ainsi que l’image explicite de leur maîtrise au moyen d’une bride.
- source_word: ወይትመየጡ በኃይለ መንፈስ
  choice: ramenés en arrière par la puissance de l’esprit
  rationale: Reproduit le mouvement de retour et l’agent causal sans effacer l’ambiguïté d’« esprit/vent ».
- source_word: ወይትነጸኡ
  choice: ils sont poussés en avant
  rationale: Suit le verbe signifiant pousser ou faire avancer, plutôt que la confusion antérieure avec un verbe de purification.
- source_word: ብዙኃ አድዋስ ምድር
  choice: les nombreuses régions de la terre
  rationale: « Régions » restitue le sens géographique de አድዋስ plus exactement que « demeures ».
theological_decisions:
- issue: Faut-il rendre መንፈስ par « esprit » ou par « vent » ?
  choice: esprit
  alternative: vent ; souffle
  rationale: Le cadre météorologique favorise « vent », mais l’agentivité et la puissance attribuées au terme permettent « esprit ». Le texte principal retient cette portée plus large et la note maintient l’autre lecture.
- issue: Sujet de « répartit »
  choice: l’esprit, repris implicitement par le verbe au singulier
  alternative: 'un sujet personnel indéterminé : « il répartit »'
  rationale: La continuité syntaxique favorise l’esprit comme sujet, sans introduire un agent divin absent du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La personnification du tonnerre et les images concrètes du trésor, du sable et de la bride sont conservées. Les ambiguïtés lexicales et syntaxiques réelles sont indiquées sans imposer une interprétation confessionnelle.
