base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: fr
  text: La cinq-centième année, au septième mois, le quatorzième jour du mois, du vivant d’Hénok, je vis dans cette parabole que le ciel des cieux[a] fut ébranlé d’un grand ébranlement[c] ; l’armée du Très-Haut[b] et les anges — des milliers de milliers et dix mille fois dix mille — furent agités d’un grand tumulte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ciel le plus élevé ». Le guèze dit littéralement « le ciel des cieux », expression superlative désignant le domaine céleste le plus élevé.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « la puissance du Très-Haut » ; la mention immédiate des anges en nombres immenses favorise toutefois ici le sens collectif d’une armée céleste.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « fut violemment ébranlé ». La traduction principale conserve la répétition expressive du guèze : littéralement, « fut ébranlé d’un grand ébranlement ».'
    reason: previous_rendering
lexical_decisions:
- source_word: በዓመት ፭ምእት
  choice: La cinq-centième année
  rationale: Rend la date par un ordinal français naturel tout en conservant l’ouverture chronologique solennelle.
- source_word: በወርኅ ሳብዕ
  choice: au septième mois
  rationale: Traduction directe et idiomatique de l’indication mensuelle.
- source_word: አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: le quatorzième jour du mois
  rationale: L’expression numérique « dix et quatre » désigne précisément le quatorzième jour.
- source_word: በሕይወተ ሄኖክ
  choice: du vivant d’Hénok
  rationale: Formulation française actuelle qui conserve la référence explicite à la vie d’Hénok.
- source_word: በውእቱ አምሳል
  choice: dans cette parabole
  rationale: Le nom appartient au vocabulaire caractéristique des Paraboles d’Hénok ; « parabole » préserve ce lien littéraire sans le réduire au terme plus général « vision ».
- source_word: ርኢኩ
  choice: je vis
  rationale: Formule visionnaire simple, rendue dans un registre narratif digne.
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: fut ébranlé d’un grand ébranlement
  rationale: Conserve le complément interne, l’adjectif « grand » et la répétition rhétorique du guèze, malgré une légère étrangeté voulue en français.
- source_word: ሰማየ ሰማያት
  choice: le ciel des cieux
  rationale: Préserve littéralement l’expression superlative et cosmique du texte plutôt que de l’aplanir en « le ciel le plus élevé ».
- source_word: ኀይሉ ልዑል
  choice: l’armée du Très-Haut
  rationale: Dans le contexte immédiat des anges innombrables, ኀይል se comprend naturellement comme une troupe ou armée céleste, tout en laissant l’autre lecture en note.
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: les anges — des milliers de milliers et dix mille fois dix mille —
  rationale: Maintient la formule numérique cumulative et répétitive qui exprime une multitude immense.
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: furent agités d’un grand tumulte
  rationale: Rend ensemble le mouvement et le nom apparenté de perturbation, ainsi que l’intensification par « grand ».
theological_decisions:
- issue: 'Le sens de ኀይሉ ልዑል : puissance abstraite ou troupe céleste appartenant au Très-Haut'
  choice: l’armée du Très-Haut
  alternative: la puissance du Très-Haut
  rationale: La mention immédiate des anges en nombres immenses favorise le sens collectif de troupe céleste, mais l’ambiguïté lexicale réelle est signalée en note.
- issue: Le degré de littéralité de ሰማየ ሰማያት
  choice: le ciel des cieux
  alternative: le ciel le plus élevé
  rationale: La formulation littérale conserve l’image cosmique et la valeur superlative de l’expression sans imposer une cosmologie plus précise que le texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes excessifs. Le passé simple convient au récit visionnaire. Les répétitions inhabituelles du guèze sont conservées lorsqu’elles portent la force rhétorique du passage ; les tirets rendent lisible l’énumération des anges sans en modifier le rapport syntaxique.
