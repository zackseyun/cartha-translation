base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: fr
  text: Et les trésors des esprits[a], et comment les esprits se répartissent, et comment ils sont mesurés, et les portes des esprits sont dénombrées, chacune selon la puissance de l’esprit, et leurs puissances pour la lumière de la lune, et selon la puissance de la justice, et les divisions des étoiles selon leurs noms — chaque part sera attribuée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « esprits » peut aussi signifier « vents » ou « souffles ». Plusieurs expressions de ce verset sont difficiles ; « mesurés » peut notamment être compris comme « pesés » ou « ordonnés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: réserves
  rationale: Le terme désigne ce qui est entreposé ou les lieux où cela est gardé. « Réserves » conserve l’image cosmique tout en restant naturel en français.
- source_word: መንፈሳት
  choice: esprits
  rationale: Le mot peut désigner les esprits, les vents ou les souffles. « Esprits » préserve l’ambiguïté apocalyptique sans réduire le passage à la météorologie.
- source_word: ወአፎ
  choice: et comment
  rationale: አፎ est ici l’adverbe interrogatif « comment », répété pour introduire une série de propositions indirectes; il ne signifie pas « nuages ».
- source_word: ይትካፈሉ
  choice: se répartissent
  rationale: La forme exprime une division ou distribution ordonnée. « Se répartissent » rend naturellement cette valeur en français.
- source_word: ይደሉ
  choice: sont mesurés
  rationale: Le verbe est difficile, mais paraît évoquer une mesure ou une attribution réglée. « Mesurés » évite de préciser sans certitude l’image d’une pesée.
- source_word: ይኄለቁ
  choice: sont dénombrées
  rationale: Le verbe relève du compte ou du calcul; « dénombrées » convient aux portes et au registre cosmique.
- source_word: አናቅፅ
  choice: portes
  rationale: Pluriel d’un terme désignant des portes ou portails, notion cosmologique caractéristique d’Hénoch; « portes » est clair et exact.
- source_word: በበኀይለ መንፈስ
  choice: chacune selon la puissance de l’esprit
  rationale: Le redoublement በበ a une valeur distributive, rendue par « chacune selon ». « Esprit » conserve aussi l’ambiguïté possible avec « vent ».
- source_word: ለብርሃነ ወርኅ
  choice: pour la lumière de la lune
  rationale: Rendu direct de la construction, avec maintien de l’imagerie cosmique.
- source_word: ኀይለ ጽድቅ
  choice: la puissance de la justice
  rationale: Dans ce contexte d’ordre cosmique, « justice » exprime clairement la rectitude régulatrice, sans exclure la dimension morale de la « droiture ».
- source_word: ክፍላተ ከዋክብት
  choice: les divisions des étoiles
  rationale: Le groupe nominal désigne les répartitions ou classes ordonnées des étoiles; « divisions » maintient le motif répété du partage.
- source_word: በበ ስሞሙ
  choice: selon leurs noms
  rationale: La formule indique un classement distributif en fonction des noms.
- source_word: ኵሉ ክፍለ ይትከፈል
  choice: chaque division est répartie
  rationale: La formulation conserve la répétition lexicale du texte et l’idée d’une attribution ordonnée.
theological_decisions:
- issue: Faut-il rendre መንፈሳት par « esprits » ou par « vents » ?
  choice: esprits
  alternative: vents ou souffles
  rationale: Le contexte cosmologique permet les deux champs de sens. « Esprits » maintient la tension entre puissances célestes et forces atmosphériques plutôt que de la résoudre.
- issue: Faut-il rendre ጽድቅ par « justice » ou « droiture » ?
  choice: justice
  alternative: droiture
  rationale: Le passage évoque un principe d’ordre cosmique. « Justice » est naturel en français et garde la portée théologique du terme sans lui imposer un sens uniquement judiciaire.
translation_notes:
  register: Français international moderne, digne et lisible. La longue coordination du guèze est conservée pour refléter l’énumération visionnaire, mais avec une ponctuation qui en facilite la lecture. La répétition de « et » ainsi que celle du vocabulaire de la division sont volontairement maintenues.
