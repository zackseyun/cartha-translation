base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: fr
  text: 'Et Michel me dit : « Pourquoi une vision comme celle-ci te trouble-t-elle ? Jusqu’à aujourd’hui, le jour de sa miséricorde a duré, et il a été miséricordieux et lent à la colère envers ceux qui habitent sur la terre ferme.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « sur le sec ». Dans le contexte, l’expression peut souligner le contraste entre la terre ferme et la mer.
    reason: cultural_note
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: Et Michel me dit
  rationale: Rend simplement la formule narrative et translittère le nom propre selon l’usage français.
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: Pourquoi cette vision te trouble-t-elle ainsi ?
  rationale: Analyse ርእየ comme la forme accusative du nom « vision », et non comme un verbe. La formulation française restitue une question sur le trouble causé par une vision de cette sorte.
- source_word: እስከ፡ ዮም
  choice: Jusqu’à aujourd’hui
  rationale: Conserve explicitement la limite temporelle et le ton apocalyptique du passage.
- source_word: ሀለወት፡ ዕለተ፡ ምሕረቱ
  choice: le jour de sa miséricorde s’est prolongé
  rationale: Préserve l’image littérale du « jour » comme période déterminée, ainsi que le possessif du guèze, tout en exprimant sa durée continue en français naturel.
- source_word: ወሀሎ፡ መሓሪ
  choice: et il s’est montré miséricordieux
  rationale: Exprime l’exercice durable de la miséricorde pendant la période évoquée, sans réduire le membre de phrase à une qualité abstraite.
- source_word: ወርኁቀ፡ መዓት
  choice: et lent à la colère
  rationale: Le sens littéral est « éloigné de la colère ». L’expression française choisie est idiomatique et conserve l’idée de retenue avant le jugement.
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: envers ceux qui habitent sur la terre ferme
  rationale: « Terre ferme » rend la valeur concrète de የብስ et maintient le contraste contextuel avec la mer.
theological_decisions:
- issue: Référent du possessif dans « sa miséricorde »
  choice: Maintenir le possessif masculin implicite, renvoyant à Dieu dans le contexte.
  alternative: Employer l’expression impersonnelle « le jour de la miséricorde ».
  rationale: Le guèze comporte un possessif. Le conserver respecte le texte sans ajouter dans le verset le nom de Dieu, qui reste implicite.
- issue: Rapport entre miséricorde présente et colère à venir
  choice: Conserver ensemble « miséricordieux » et « lent à la colère ».
  alternative: Paraphraser en affirmant que Dieu diffère le jugement.
  rationale: La traduction maintient la tension du texte entre miséricorde et colère sans expliciter davantage la nature ou le moment du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La question initiale suit l’analyse grammaticale révisée de ርእየ comme nom (« vision »). Le vocabulaire apocalyptique est préservé sans archaïsmes inutiles.
