base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: fr
  text: 'Et il me dit : « Toi, fils d’homme[a], c’est ici que tu désires comprendre ce qui est caché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être humain » ou « mortel ». Ici, « fils d’homme » est une manière de s’adresser au voyant ; l’expression ne désigne pas nécessairement la figure exaltée appelée ailleurs « le Fils de l’homme » dans les Paraboles.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire la fin de la phrase par « connaître la chose cachée » ou « apprendre ce qui est dissimulé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Et il me dit
  rationale: Formule narrative guèze courante introduisant un discours direct ; « dit » est naturel et digne en français moderne.
- source_word: አንተ
  choice: Toi
  rationale: Le pronom indépendant est explicitement exprimé et produit une mise en relief ; « Toi » conserve cette insistance avant l’apostrophe.
- source_word: ወልደ ሰብእ
  choice: fils d’homme
  rationale: Cette expression sémitisante désigne ici l’être humain auquel on s’adresse. La traduction littérale préserve le registre apocalyptique et le lien lexical avec les autres emplois sans en faire automatiquement un titre.
- source_word: በዝየ
  choice: ici
  rationale: Conserve simplement la valeur déictique, probablement liée au lieu ou au cadre immédiat de la vision.
- source_word: ትፈቅድ
  choice: tu désires
  rationale: Le verbe exprime la volonté ou le désir. « Désires » convient au registre élevé sans réduire le sens à une simple permission.
- source_word: ታእምር
  choice: comprendre
  rationale: Dans ce contexte de révélation, le verbe évoque la saisie cognitive de ce qui est dévoilé ; « comprendre » rend cette nuance plus directement que « connaître ».
- source_word: ዘኅቡእ
  choice: ce qui est caché
  rationale: La construction relative désigne une réalité dissimulée sans employer un terme technique comme « mystère ».
theological_decisions:
- issue: Portée de l’expression ወልደ ሰብእ dans les Paraboles
  choice: fils d’homme
  alternative: être humain ; mortel
  rationale: Ici, l’expression sert d’apostrophe adressée au voyant et ne désigne pas nécessairement la figure exaltée appelée ailleurs « le Fils de l’homme ». La formulation traditionnelle maintient l’idiome et la tension du texte, tandis que la note empêche d’imposer une identification théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « Toi… tu » conserve l’insistance du pronom guèze tout en restant idiomatique en français. Le léger relief de « ici » est maintenu afin de ne pas effacer la valeur déictique du texte source.
