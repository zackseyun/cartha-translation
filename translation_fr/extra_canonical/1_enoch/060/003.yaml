base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: fr
  text: Quant à moi, un grand tremblement me saisit, et la peur s’empara de moi ; mes reins furent brisés, mes rognons se délièrent, et je tombai face contre terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: un grand tremblement
  rationale: Rend l’intensité et la dimension physique de la réaction visionnaire sans l’interpréter simplement comme de la terreur.
- source_word: ነሥአኒ
  choice: me saisit
  rationale: Avec le tremblement pour sujet, le verbe exprime naturellement l’idée d’être saisi ou envahi.
- source_word: ፍርሃት አሐዘኒ
  choice: la peur s’empara de moi
  rationale: Conserve l’image concrète d’une peur qui prend possession du locuteur.
- source_word: ሐቌየ ተቀጽዐ
  choice: mes reins furent brisés
  rationale: Le verbe passif indique l’action de briser ou fracasser; « reins » désigne ici la région lombaire, siège symbolique de la force physique.
- source_word: ኵልያትየ ተፈትሑ
  choice: mes rognons se relâchèrent
  rationale: « Rognons » conserve la référence anatomique distincte aux kidneys, tandis que « se relâchèrent » rend le sens de déliement ou de relâchement du verbe.
- source_word: ወወደቁ በገጽየ
  choice: et je tombai face contre terre
  rationale: Dans la suite à la première personne, l’expression décrit vraisemblablement la chute ou la prosternation d’Hénoch sur son visage.
theological_decisions:
- issue: Faut-il moderniser l’image anthropologique des rognons en la remplaçant par « cœur » ou « entrailles » ?
  choice: Conserver « rognons » dans le texte principal et expliquer l’image en note.
  alternative: mes entrailles se dénouèrent / mon cœur fondit
  rationale: Le terme guèze désigne concrètement les rognons. Préserver cette image corporelle ancienne évite d’introduire une interprétation théologique ou psychologique absente du texte.
- issue: Sens de ሐቌየ dans la description de l’effondrement corporel
  choice: « reins », au sens de région lombaire
  alternative: hanches
  rationale: « Reins » maintient l’idiome corporel ancien et le parallélisme avec les rognons, mais une note prévient la confusion anatomique courante en français.
translation_notes:
  register: Français international actuel, digne et lisible. Le rythme paratactique du guèze est conservé, tandis que la ponctuation française clarifie la succession des réactions. « Rognons », plus anatomique que « reins », permet de distinguer ኵልያትየ du terme précédent désignant la région lombaire.
