  naturalness: Le français révisé reste moderne et lisible. « Mon esprit entra » demeure volontairement inhabituel, car il reproduit une difficulté réelle du guèze; la note en explicite la portée sans imposer une solution.
  terminology: « Êtres saints » évite l’association spontanée de « saints » avec des humains canonisés et rend la désignation céleste générale sans ajouter « anges » au texte. « Michel », « ange », « puissance » et l’imagerie cosmique sont appropriés au registre apocalyptique.
