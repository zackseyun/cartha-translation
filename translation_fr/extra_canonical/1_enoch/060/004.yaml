  rationale: La révision conserve la formulation difficile de መንፈስየ ገብአት au lieu de la résoudre comme un retour à la conscience. Elle rend aussi plus directement le mouvement de l’ange et évite d’attribuer explicitement le tumulte à la puissance. Les notes maintiennent les lectures possibles sans trancher une question textuelle et lexicale disputée.
