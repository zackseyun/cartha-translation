base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: fr
  text: Michel envoya un autre ange d’entre les êtres saints, et celui-ci me souleva. Lorsqu’il m’eut soulevé, mon esprit entra[a], car je ne pouvais supporter la vue de cette puissance, du tumulte et de l’ébranlement du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze, littéralement « mon esprit entra », est difficile. Elle peut évoquer le retour de l’esprit ou l’entrée dans un nouvel état visionnaire.
    reason: clarification_lexicale
  - marker: b
    text: 'Ou : « la vue de cette puissance, de son agitation et du tremblement du ciel ». Le rapport exact entre « puissance », « tumulte » et « ciel » est exprimé de façon condensée en guèze.'
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: envoya
  rationale: Le verbe désigne naturellement l’action d’envoyer ou de dépêcher; « envoya » est direct et convient au récit.
- source_word: ካልአ መልአከ
  choice: un autre ange
  rationale: L’expression désigne un ange supplémentaire, distinct de Michel; cette formulation est naturelle en français.
- source_word: እምቅዱሳን
  choice: d’entre les saints
  rationale: La préposition marque l’origine au sein d’un groupe. Dans ce contexte céleste, « les saints » désigne les êtres saints de la cour céleste, sans ajouter explicitement « anges » au texte.
- source_word: አንሥአኒ
  choice: me releva
  rationale: Le verbe exprime le fait de soulever ou relever. Le contexte d’un effondrement favorise « releva », tout en conservant le mouvement ascendant.
- source_word: መንፈስየ ገብአት
  choice: mon esprit me revint
  rationale: ገብአ exprime le retour ou le fait de revenir; dans le contexte d’un relèvement après défaillance, la tournure française « mon esprit me revint » rend naturellement la reprise de conscience sans identifier l’esprit à l’Esprit divin.
- source_word: ኢክህልኩ ተዓግሦ
  choice: je ne pouvais supporter
  rationale: La combinaison exprime l’incapacité à endurer ce qui est vu; « supporter » est idiomatique et garde l’intensité de l’expérience.
- source_word: ራእየ ዝኩ ኃይል
  choice: la vue de cette puissance
  rationale: ራእየ renvoie à ce qui est vu et ኃይል à la puissance ou à la force; la traduction demeure proche sans préciser indûment le référent.
- source_word: ሀውከ
  choice: tumulte
  rationale: Le terme évoque agitation, trouble ou bouleversement. « Tumulte » préserve la portée cosmique sans le confondre avec l’ébranlement mentionné ensuite.
- source_word: አንቀልቅለ ሰማይ
  choice: l’ébranlement du ciel
  rationale: Cette expression restitue l’image d’un ciel secoué ou tremblant dans un registre apocalyptique naturel en français.
theological_decisions:
- issue: Identité des « saints »
  choice: êtres saints célestes, vraisemblablement des membres de l’armée angélique
  alternative: saints humains ou assemblée céleste mixte
  rationale: Michel envoie « un autre ange » pris parmi eux; le contexte immédiat favorise donc des êtres célestes, mais le texte principal conserve le terme général.
- issue: Sens du retour de l’esprit
  choice: « mon esprit me revint », compris comme un rétablissement après la défaillance
  alternative: « mon esprit entra en moi » ou « je revins à moi »
  rationale: Le verbe ገብአ signifie revenir ou retourner. La formulation choisie respecte le lexème et l’anthropologie du texte, tandis que « je revins à moi » serait plus interprétatif.
- issue: Relation entre puissance, tumulte et ciel
  choice: trois éléments coordonnés dans une formulation française fluide
  alternative: le tumulte appartient à la puissance, ou « puissance » qualifie l’ensemble de la manifestation
  rationale: La syntaxe guèze est condensée et permet plusieurs articulations; la traduction évite de fixer plus précisément le rapport entre ces éléments.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit garde son imagerie apocalyptique; « saints » conserve la désignation céleste générale, tandis que « me releva » et « mon esprit me revint » rendent naturellement la scène de rétablissement.
