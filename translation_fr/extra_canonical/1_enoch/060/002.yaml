base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: fr
  text: Et le Chef des jours était assis sur le trône de sa gloire[a], tandis que les anges et les justes se tenaient debout autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Ancien des Jours ». Le titre guèze est rendu ici de manière plus littérale par « le Chef des jours », afin de préserver la formulation propre à ce passage sans lui substituer d’emblée l’expression familière du livre de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: la Tête des Jours
  rationale: Traduction formellement proche de l’expression guèze, qui en conserve l’image et le titre particulier sans l’assimiler d’emblée à la formulation familière de Daniel.
- source_word: መንበረ ስብሐቲሁ
  choice: le trône de sa gloire
  rationale: Cette formulation restitue directement la construction du guèze et maintient le registre élevé ainsi que l’image concrète de l’intronisation.
- source_word: ይነብር
  choice: était assise
  rationale: Dans cette scène de cour céleste, le verbe décrit la posture de la figure intronisée; l’imparfait rend l’arrière-plan descriptif et la durée de la vision.
- source_word: መላእክት
  choice: les anges
  rationale: Dans le cadre d’une cour céleste apocalyptique, « anges » est le sens contextuel le plus naturel.
- source_word: ጻድቃን
  choice: les justes
  rationale: Le terme désigne des personnes caractérisées par leur justice; « les justes » est idiomatique en français biblique moderne et conserve cette identité morale et théologique.
- source_word: አውዶ
  choice: autour d’elle
  rationale: L’adverbe exprime la position environnante. Le pronom féminin reprend grammaticalement « la Tête des Jours » en français, sans rien affirmer sur le genre de la figure désignée.
- source_word: ይቆውሙ
  choice: se tenaient debout
  rationale: La locution décrit clairement la posture des assistants célestes et son imparfait correspond à la valeur descriptive de « était assise ».
theological_decisions:
- issue: Rendu du titre divin ርእሰ መዋዕል par rapport à la tradition de Daniel
  choice: la Tête des Jours
  alternative: l’Ancien des Jours
  rationale: Le rendu littéral préserve la forme propre du titre dans ce passage et évite une harmonisation implicite avec la formulation traditionnelle de Daniel; l’équivalent traditionnel est signalé en note.
- issue: Genre grammatical du pronom reprenant le titre
  choice: autour d’elle
  alternative: autour de lui
  rationale: Le français exige l’accord grammatical avec le nom noyau féminin « Tête ». Ce choix est syntaxique et ne constitue pas une affirmation théologique sur le genre de la figure divine.
translation_notes:
  register: Français international moderne, digne et lisible, avec un registre apocalyptique élevé. Les imparfaits installent la scène visionnaire. « Les justes » est préféré à « les hommes droits » pour sa concision et son ancrage dans l’usage biblique français.
