  source_fidelity: Révision nécessaire. Le guèze et les décisions lexicales du dossier indiquent « le second » en plus de la désignation masculine; le projet omet ce premier élément. La relative négative justifie bien « invisible ». La finale identifie Adam comme « le premier des humains » plutôt que de laisser entendre qu’Hénoch pourrait être le premier humain enlevé.
  naturalness: « Il occupe de sa poitrine » est volontairement étrange mais reste compréhensible; l’incise « de sa poitrine » améliore légèrement la lisibilité française sans neutraliser l’image corporelle. La ponctuation révisée rend explicite la reprise d’Adam dans la dernière apposition.
  terminology: « Béhémoth », « désert invisible », « les élus et les justes », « le jardin » et « le Seigneur des esprits » sont appropriés. « Dundayin » suit plus directement la translittération fournie par l’audit anglais et évite de franciser sans nécessité un toponyme peu attesté.
