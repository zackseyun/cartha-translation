base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: fr
  text: Et le second, le mâle, s’appelait Béhémoth[a] ; il occupe, de sa poitrine, un désert invisible appelé Dundayin, à l’est du jardin[b], où demeurent les élus et les justes, là où mon arrière-grand-père[c] fut enlevé, le septième à compter d’Adam — Adam, le premier des humains que le Seigneur des esprits a fait[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désignant ce désert signifie littéralement qu’il « n’est pas vu ». Elle peut évoquer un lieu invisible ou caché ; certains y voient plutôt un lieu inaccessible ou désolé.
    reason: textual_variant
  - marker: b
    text: Le texte dit littéralement « le jardin » ; il ne donne pas ici le nom d’Éden.
    reason: lexical_alternative
  - marker: c
    text: Le terme de parenté peut aussi se comprendre plus largement comme « mon ancêtre » ou « mon aïeul ». La désignation généalogique renvoie à Hénoch, le septième à compter d’Adam.
    reason: lexical_alternative
  - marker: d
    text: 'La dernière apposition reprend Adam : il est présenté comme « le premier des humains » que le Seigneur des esprits a fait.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ባዕታይ፡ ስሙ፡ ብሔሞት
  choice: Quant au mâle, son nom était Béhémoth
  rationale: Le terme désigne ici le mâle, par contraste avec la créature femelle mentionnée dans le contexte. Le nom propre est translittéré sous sa forme française usuelle.
- source_word: ዘይአኅዝ፡ በእንግዓሁ
  choice: Il occupe de sa poitrine
  rationale: Le verbe exprime l’occupation ou la prise d’un lieu. La mention concrète et étrange de la poitrine est conservée plutôt que généralisée en « corps ».
- source_word: በበድው፡ ዘኢያስተርኢ
  choice: un désert invisible
  rationale: La proposition négative signifie littéralement que ce désert n’est pas vu ou visible. « Invisible » préserve ce trait de la géographie visionnaire sans l’aplatir en simple désolation.
- source_word: ዱንዳይን
  choice: Doundayin
  rationale: Il s’agit d’un nom de lieu, translittéré selon une graphie lisible en français.
- source_word: በምሥራቀ፡ ገነት
  choice: à l’est du jardin
  rationale: « Jardin » traduit le terme sans introduire explicitement le nom d’Éden, absent du texte guèze.
- source_word: ኅሩያን፡ ወጻድቃን
  choice: les élus et les justes
  rationale: Ces équivalents français courants conservent les deux catégories apocalyptiques distinctes.
- source_word: ተመጠወ
  choice: fut enlevé
  rationale: Le passif exprime le retrait ou le transfert d’Hénoch. « Fut enlevé » rend ce mouvement sans imposer un terme doctrinal technique.
- source_word: እምኄውየ
  choice: mon arrière-grand-père
  rationale: Le terme de parenté peut être compris plus largement, mais la généalogie du passage identifie Hénoch, arrière-grand-père de Noé.
- source_word: ሳብዕ፡ እምአዳም
  choice: le septième à compter d’Adam
  rationale: Cette formulation française exprime clairement la position généalogique traditionnelle d’Hénoch.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des esprits
  rationale: Traduction formelle du titre divin récurrent dans cette partie de 1 Hénoch.
theological_decisions:
- issue: Identité de la personne appelée « mon arrière-grand-père »
  choice: La personne enlevée est Hénoch, le septième à compter d’Adam, présenté comme l’ancêtre du locuteur.
  alternative: Rendre le terme de parenté plus largement par « mon ancêtre » ou « mon aïeul ».
  rationale: La généalogie permet l’expression précise « arrière-grand-père », tout en signalant en note que le terme guèze peut être plus large.
- issue: Sens de la description du désert
  choice: Le texte principal porte « un désert invisible ».
  alternative: « un désert qu’on ne voit pas », « une étendue inaccessible » ou « un désert désolé ».
  rationale: Le guèze exprime directement la non-visibilité. L’idée de désolation appartient déjà au substantif désignant le désert et ne doit pas remplacer la proposition relative.
- issue: Référence de « le premier des humains »
  choice: La formulation et la ponctuation laissent possible son rattachement à Adam.
  alternative: Y voir une qualification d’Hénoch, éventuellement comme premier humain enlevé.
  rationale: La chaîne appositionnelle guèze est syntaxiquement tendue. Une note conserve les deux rattachements possibles au lieu de résoudre silencieusement la difficulté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve l’étrangeté de la vision, notamment l’image de la poitrine de Béhémoth, tandis que les notes signalent les ambiguïtés lexicales et syntaxiques sans les résoudre de manière confessionnelle.
