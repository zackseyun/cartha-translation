revisions:
- from: Quant au mâle, son nom était Béhémoth. Il occupe de sa poitrine un désert invisible appelé Doundayin[a], à l’est du jardin[b], là où habitent les élus et les justes, là où fut enlevé mon arrière-grand-père[c], le septième à compter d’Adam, le premier des humains qu’a faits le Seigneur des esprits[d].
  to: Et le second, le mâle, s’appelait Béhémoth[a] ; il occupe, de sa poitrine, un désert invisible appelé Dundayin, à l’est du jardin[b], où demeurent les élus et les justes, là où mon arrière-grand-père[c] fut enlevé, le septième à compter d’Adam — Adam, le premier des humains que le Seigneur des esprits a fait[d].
