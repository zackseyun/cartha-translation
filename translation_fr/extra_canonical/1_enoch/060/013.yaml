base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: fr
  text: Et le tonnerre, selon leurs lieux d’impact[a], et toute division qui est divisée par l’éclair[b], afin qu’il jaillisse — et leur retenue, afin qu’ils entendent promptement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze désigne littéralement des lieux de chute ou d’impact; dans ce contexte, elle peut évoquer les endroits où tombent ou frappent les phénomènes de l’orage.
    reason: lexical_alternative
  - marker: b
    text: « Toute division qui est divisée » reproduit la répétition du texte source. Le sens précis de cette répartition des phénomènes de l’orage demeure incertain.
    reason: source_ambiguity
  - marker: c
    text: 'Littéralement : « afin qu’ils entendent rapidement ». Dans un idiome sémitique, entendre peut aussi suggérer une réponse ou une obéissance immédiate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: le tonnerre
  rationale: Le nom désigne le tonnerre ou le grondement du tonnerre; le français « tonnerre » conserve simplement l’image météorologique.
- source_word: በበመዳቃቲሆሙ
  choice: selon les lieux où il frappe
  rationale: መዳቃ désigne concrètement un lieu de chute ou d’impact. Dans ce contexte, « les lieux où il frappe » restitue cette image sans l’aplatir en « stations ».
- source_word: ለኵሉ ክፍለ ዘይትከፈል
  choice: toute division que l’éclair divise
  rationale: La répétition étymologique de « division/divise » reflète l’expression difficile et répétitive du guèze, tout en reliant naturellement le passif à l’éclair dans la phrase française.
- source_word: በመብረቅ
  choice: par l’éclair
  rationale: 'La préposition a ici une valeur instrumentale probable: la division est opérée ou marquée par l’éclair.'
- source_word: ከመ ይበርቅ
  choice: afin qu’il jaillisse
  rationale: Le verbe, apparenté au vocabulaire de l’éclair et de la brillance, évoque un éclat soudain; « jaillisse » garde cette dynamique sans ajouter un sujet explicatif.
- source_word: ትዕግሥቶሙ
  choice: leur retenue
  rationale: Le substantif peut exprimer patience, endurance, attente ou maîtrise. « Retenue » convient à l’idée possible de forces contenues, sans lever l’obscurité du passage.
- source_word: ፍጡነ ይስምዑ
  choice: ils entendent promptement
  rationale: Le sens premier est « entendre rapidement ». « Entendre » préserve aussi l’ambivalence sémitique possible entre perception auditive et réponse obéissante.
theological_decisions:
- issue: Faut-il interpréter la dernière proposition comme l’obéissance des puissances cosmiques à un ordre divin?
  choice: Conserver la formulation concrète et ambiguë « afin qu’ils entendent promptement »
  alternative: « afin qu’ils obéissent aussitôt »
  rationale: Le verbe signifie d’abord entendre ou écouter, même s’il peut impliquer l’obéissance. La traduction ne doit pas expliciter une lecture théologique que le texte ne formule pas sans ambiguïté.
- issue: Faut-il paraphraser l’ensemble comme une description du fonctionnement ordonné de l’orage?
  choice: Maintenir la succession difficile du tonnerre, des lieux d’impact, des divisions, de l’éclair et de la retenue
  alternative: Paraphraser comme « tous les phénomènes de l’orage accomplissent avec ordre leur fonction »
  rationale: Une paraphrase rendrait le verset plus clair, mais effacerait sa texture et ses incertitudes propres au témoin guèze.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe conserve volontairement le caractère fragmentaire et difficile du guèze. Les termes courants « tonnerre » et « éclair » évitent l’archaïsme, tandis que « promptement » soutient le registre littéraire sans obscurcir le sens.
