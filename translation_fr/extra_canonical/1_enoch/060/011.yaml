base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: fr
  text: Un autre ange, qui m’accompagnait et me montrait ce qui est caché[a], me dit ce qui est premier et ce qui est dernier[b] dans le ciel, dans les hauteurs, sous la terre, dans les profondeurs[c], aux extrémités du ciel et aux fondements du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription guèze conservée ici paraît altérée. La lecture restaurée donne « ce qui est caché ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « le premier et le dernier ». Dans ce contexte, l’expression est comprise de manière descriptive plutôt que comme un titre.'
    reason: lexical_alternative
  - marker: c
    text: La transcription paraît également altérée autour de « sous la terre ». La traduction suit la lecture restaurée « sous la terre, dans les profondeurs » ; « l’abîme » serait une formulation plus précise que le texte ne l’exige.
    reason: textual_variant
lexical_decisions:
- source_word: ወይቤለኒ
  choice: me dit
  rationale: La formule narrative signifie littéralement « me dit ». En français, elle peut introduire directement le contenu communiqué sans alourdir la phrase.
- source_word: መልአክ ካልእ
  choice: un autre ange
  rationale: ካልእ désigne ici un ange supplémentaire, sans imposer le sens ordinal « un deuxième ange ».
- source_word: ዘምስሌየ የሐውር
  choice: qui m’accompagnait
  rationale: Cette formulation française naturelle conserve l’idée que l’ange allait avec le voyant, sans donner une importance excessive à la manière de marcher.
- source_word: ወዘኅቡእ ያርእየኒ (lecture restaurée)
  choice: et me montrait ce qui est caché
  rationale: 'La transcription fournie paraît corrompue à cet endroit. La lecture restaurée exprime la fonction révélatrice de l’ange et rend le sens attendu : il fait voir les réalités cachées.'
- source_word: ቀዳሜ ወድኃሬ
  choice: ce qui est premier et ce qui est dernier
  rationale: La tournure décrit les extrêmes ou la totalité de ce qui est révélé. Elle évite de transformer sans fondement contextuel ces mots en titre théologique.
- source_word: በሰማየ
  choice: dans le ciel
  rationale: La préposition est comprise au sens locatif, et le singulier correspond à la forme guèze ainsi qu’au contexte immédiat.
- source_word: በውስተ ላዕሉ
  choice: dans les hauteurs
  rationale: Le pluriel idiomatique français préserve le registre cosmique et élevé de l’expression.
- source_word: ወበታሕተ ምድር በመዓምቅ (lecture restaurée)
  choice: sous la terre, dans les profondeurs
  rationale: La lecture restaurée inclut « terre » après « sous ». « Dans les profondeurs » garde le sens spatial sans préciser indûment « l’abîme ».
- source_word: በአጽናፈ ሰማይ
  choice: aux extrémités du ciel
  rationale: አጽናፍ désigne les limites ou les bords. « Extrémités » conserve clairement l’image cosmique.
- source_word: በመሠረተ ሰማይ
  choice: aux fondements du ciel
  rationale: La traduction directe maintient l’image architecturale propre à la cosmologie apocalyptique.
theological_decisions:
- issue: Faut-il comprendre ቀዳሜ ወድኃሬ comme un titre, « le Premier et le Dernier » ?
  choice: ce qui est premier et ce qui est dernier
  alternative: le premier et le dernier
  rationale: Dans cette phrase, l’expression appartient à une énumération des réalités et limites cosmiques révélées à Hénoch. La lecture descriptive respecte le contexte sans importer une désignation divine venue d’autres passages.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation solennelle des régions cosmiques, tout en employant des formulations idiomatiques comme « m’accompagnait » et « dans les hauteurs ». Les ambiguïtés lexicales et les difficultés de transcription sont signalées plutôt que résolues silencieusement.
