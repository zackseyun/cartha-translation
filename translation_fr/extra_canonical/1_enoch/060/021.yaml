base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: fr
  text: Quand l’esprit de la pluie est mis en mouvement hors de sa réserve, les anges viennent, ouvrent la réserve et en font sortir l’esprit de la pluie. Quand il est dispersé sur toute la terre sèche[a], il se mêle à l’eau qui se trouve sur la terre sèche ; et quand il se mêle, en tout temps, à l’eau qui se trouve sur la terre sèche…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « semé ». Le verbe peut aussi se traduire par « répandu » ; il présente ici la pluie comme quelque chose que l’on disperse sur le sol.'
    reason: lexical_alternative
  - marker: b
    text: Le texte guèze répète l’idée que l’esprit de la pluie se mêle à l’eau sur la terre sèche. La construction finale est difficile et paraît rester en suspens ; elle peut évoquer soit ce mélange continuel, soit la présence durable de la pluie une fois unie aux eaux de surface.
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሱ ለዝናም
  choice: l’esprit de la pluie
  rationale: መንፈስ peut désigner l’esprit, le vent ou le souffle. « L’esprit de la pluie » conserve ici la personnification propre à la cosmologie apocalyptique sans la réduire à un phénomène météorologique ordinaire.
- source_word: ይትኃወስ
  choice: est mis en mouvement
  rationale: Le verbe exprime un mouvement ou une mise en action. Cette formulation française rend le sens sans imposer l’idée plus précise d’une agitation violente.
- source_word: መዝገበ
  choice: entrepôt
  rationale: Le mot désigne un lieu où quelque chose est conservé en réserve. « Entrepôt » garde l’image concrète des réserves célestes et reste immédiatement compréhensible.
- source_word: ይመጽኡ መላእክት
  choice: les anges viennent
  rationale: La formulation maintient explicitement l’action personnelle des anges dans l’administration des phénomènes naturels.
- source_word: ያርኅዉ መዝገበ
  choice: ouvrent l’entrepôt
  rationale: Le verbe signifie naturellement « ouvrir » ; « déverrouiller » ajouterait un détail absent du texte.
- source_word: ያወጽእዎ
  choice: l’en font sortir
  rationale: La tournure rend la valeur causative du verbe et son pronom objet, tout en gardant comme référent immédiat l’esprit de la pluie.
- source_word: ይዘራእ
  choice: est dispersé
  rationale: Issu d’une racine liée à l’action de semer, le verbe évoque la dispersion. « Est dispersé » convient à la pluie tout en préservant davantage cette image que « est versé ».
- source_word: የብስ
  choice: terre sèche
  rationale: Le terme désigne la terre ferme ou sèche par opposition à l’eau. Cette traduction conserve nettement ce contraste.
- source_word: ይትኃበር ምስለ ማይ
  choice: il se mêle à l’eau
  rationale: Le verbe exprime l’union ou l’association. « Se mêle » est naturel en français pour la pluie qui rejoint les eaux présentes au sol, sans préciser davantage le mécanisme.
- source_word: በኵሉ ጊዜ
  choice: en tout temps
  rationale: Cette expression temporelle indique une continuité ou une régularité. La traduction conserve sa portée générale et son registre soutenu.
theological_decisions:
- issue: Faut-il dépersonnaliser l’action de la pluie en langage météorologique moderne ?
  choice: Conserver « l’esprit de la pluie » ainsi que l’intervention des anges et de l’entrepôt céleste.
  alternative: Traduire simplement par « quand la pluie sort de sa réserve » ou « quand l’averse se déclenche ».
  rationale: Le passage présente une cosmologie apocalyptique où les phénomènes naturels sont administrés par des puissances célestes. La traduction doit préserver cette représentation plutôt que la remplacer par une description météorologique moderne.
- issue: Référent des pronoms masculins singuliers dans la suite du verset
  choice: Employer « il » en gardant comme référent grammatical « l’esprit de la pluie ».
  alternative: Passer à « elle » et faire de « la pluie » le référent explicite.
  rationale: Le texte guèze poursuit au masculin singulier après መንፈስ, nom masculin. Le maintien de « il » respecte cette continuité, même si l’action décrite concerne concrètement la pluie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression du guèze, mais les enchaînements sont rendus naturellement. La répétition finale est conservée parce qu’elle appartient au texte transmis, avec une note signalant sa difficulté.
