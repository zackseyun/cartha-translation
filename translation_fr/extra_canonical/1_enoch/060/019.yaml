base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: fr
  text: L’esprit de la brume ne se joint pas à eux dans leurs réserves, mais sa propre réserve est à part ; car son parcours y est glorieux, dans la lumière comme dans les ténèbres, en hiver comme en été, et sa réserve est un ange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est difficile. Le guèze dit littéralement : « sa réserve est un ange ». Il peut s’agir d’une identification entre la réserve et un être angélique, ou d’une manière condensée d’exprimer le rôle assigné à un ange.'
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሰ ጊሜ
  choice: l’esprit de la brume
  rationale: መንፈስ désigne l’esprit, le souffle ou le vent, tandis que ጊሜ signifie ici « brume » ou « brouillard ». « Esprit » maintient la personnification cosmique du passage.
- source_word: ኢይትኃበር ምስሌሆሙ ውስተ መዛግብቲሆሙ
  choice: ne se joint pas à eux dans leurs réserves
  rationale: La formulation conserve à la fois l’idée d’association niée et le complément locatif explicite « dans leurs réserves ».
- source_word: መዛግብቲሆሙ / መዝገበ
  choice: leurs réserves / réserve
  rationale: Le terme évoque les dépôts ou réservoirs où sont gardées les réalités cosmiques. « Réserve » est naturel en français et convient mieux ici que « trésor ».
- source_word: መዝገበ ቦቱ ባሕቲቱ
  choice: il a sa propre réserve, à part
  rationale: Cette tournure française exprime clairement la possession et l’insistance de ባሕቲቱ sur la séparation, sans reproduire une syntaxe artificielle.
- source_word: ምሕዋረ ዚአሁ ስብሐት ቦ
  choice: son parcours y est glorieux
  rationale: « Parcours » rend le mouvement ou le cours ordonné, tandis que « y » conserve la valeur locative de ቦ et « glorieux » la notion de splendeur.
- source_word: በብርሃን ወበጽልመት ወበክረምት ወበሐጋይ
  choice: dans la lumière comme dans les ténèbres, en hiver comme en été
  rationale: La structure corrélative restitue les deux paires de conditions. La dernière forme transcrite ንጋይ est comprise comme une erreur de témoin pour ሐጋይ, « été », terme qui forme la paire habituelle avec « hiver ».
- source_word: መዝገበ ዚአሃ መልአክ ውእቱ
  choice: sa réserve est un ange
  rationale: La traduction garde l’identification directe et surprenante du guèze au lieu de l’expliquer comme « gardée par un ange », ce que le texte ne dit pas explicitement.
theological_decisions:
- issue: Faut-il réduire « l’esprit de la brume » à un phénomène météorologique impersonnel ?
  choice: Conserver « l’esprit de la brume » comme réalité cosmique personnifiée
  alternative: le vent de la brume / la force de la brume
  rationale: Le contexte apocalyptique présente les phénomènes cosmiques avec leurs réserves et leur administration angélique. La personnification doit donc rester perceptible.
- issue: Comment comprendre l’identification finale de la réserve à un ange ?
  choice: Maintenir dans le texte « sa réserve est un ange »
  alternative: sa réserve est confiée à un ange / un ange veille sur sa réserve
  rationale: La syntaxe du guèze présente une identification directe, même si elle est difficile. Une paraphrase explicative supprimerait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation articule la longue phrase apocalyptique sans en effacer les parallélismes. « Réserve » est employé de façon cohérente pour l’image cosmologique du dépôt ou réservoir.
