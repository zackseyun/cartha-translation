base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: fr
  text: L’esprit de la mer est mâle et fort[a] ; selon la force de la mer, il la retient au moyen d’une rêne[b], et ainsi elle est chassée au-dehors et dispersée sur toutes les montagnes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent de la mer ». Le mot guèze traduit par « esprit » peut aussi désigner le vent ou le souffle ; le contexte personnifié favorise « esprit ».
    reason: lexical_alternative
  - marker: b
    text: L’image semble présenter la force de la mer comme retenue par une rêne, puis envoyée au-dehors et dispersée sur les montagnes, peut-être sous forme de brume, d’embruns ou de nuages d’orage. Le mécanisme exact reste incertain dans le seul témoin guèze.
    reason: cultural_note
lexical_decisions:
- source_word: መንፈሰ፡ ባሕር
  choice: l’esprit de la mer
  rationale: መንፈስ peut désigner l’esprit, le vent ou le souffle. « Esprit » préserve ici la personnification de cette puissance cosmique sans réduire le passage à une simple description météorologique.
- source_word: ተባዕታይ
  choice: mâle
  rationale: Le terme indique explicitement le sexe masculin. « Mâle » conserve cette personnification inhabituelle sans l’atténuer en simple genre grammatical.
- source_word: ዕኑፅ
  choice: fort
  rationale: L’adjectif exprime la force ou la robustesse ; « fort » convient au contexte et évite de préciser indûment « farouche » ou « puissant ».
- source_word: ኃይለ፡ ጽንዐታ
  choice: à la mesure de la puissance de celle-ci
  rationale: Le suffixe féminin de ጽንዐታ renvoie vraisemblablement à la mer, tandis que l’esprit est masculin. Cette formulation française rend explicite ce contraste référentiel tout en conservant l’idée d’une force intense.
- source_word: በአንቍ፡ ይገብእ
  choice: il la retient par une rêne
  rationale: L’image est celle d’une force maîtrisée comme un animal au moyen d’une rêne ou d’une bride. Le verbe masculin a pour sujet l’esprit, et le pronom féminin renvoie à la mer.
- source_word: ትትነጻእ
  choice: elle est poussée au-dehors
  rationale: La forme féminine exprime un mouvement vers l’extérieur, possiblement passif ou réfléchi. Cette traduction conserve l’idée d’expulsion sans imposer un mécanisme précis.
- source_word: ትዘራእ
  choice: dispersée
  rationale: Le verbe signifie littéralement « semée », mais prend ici naturellement le sens d’une diffusion ou d’une dispersion de la mer ou de ses effets.
- source_word: በአሉ፡ አድባረ፡ ምድር
  choice: parmi toutes les montagnes de la terre
  rationale: La formulation conserve la portée cosmique du passage et l’ambiguïté spatiale de la préposition sans la remplacer par une localisation trop précise.
theological_decisions:
- issue: Personnification des forces cosmiques
  choice: Conserver l’esprit de la mer comme être mâle et puissant qui maîtrise la mer
  alternative: Traduire de manière impersonnelle par « vent marin » et supprimer la distinction de genre
  rationale: Le guèze distingue explicitement l’esprit masculin de la mer reprise au féminin. Garder cette personnification respecte la texture visionnaire et la tension cosmologique du texte.
- issue: Référent de la force
  choice: Rapporter « sa puissance » à la mer au moyen de « celle-ci »
  alternative: 'Rapporter la puissance à l’esprit : « à la mesure de sa propre puissance »'
  rationale: Le suffixe féminin de ጽንዐታ et les verbes féminins qui suivent soutiennent la mer comme référent, tandis que ይገብእ demeure masculin et se rapporte à l’esprit.
- issue: Nature de la dispersion
  choice: Ne pas identifier précisément ce qui se répand sur les montagnes
  alternative: Préciser qu’il s’agit de brume, d’embruns ou de nuages d’orage
  rationale: Le témoin guèze seul ne permet pas de trancher entre ces phénomènes ; la traduction conserve donc l’indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe distingue nettement l’esprit masculin (« il ») de la mer féminine (« celle-ci », « la », « elle »). Le point-virgule maintient le mouvement solennel de la vision sans produire une phrase excessivement archaïque.
