base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: fr
  text: 'Et ce jour-là, les deux monstres furent séparés : un monstre femelle nommé Léviathan, pour qu’elle demeure dans l’abîme de la mer[a], au-dessus des sources des eaux.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les profondeurs de la mer » ; le terme guèze désigne une profondeur ou une région abyssale.
    reason: lexical_alternative
  - marker: b
    text: Cette expression conserve l’ancienne représentation cosmologique des « sources des eaux » ; elle ne constitue pas une description géographique moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: furent séparés
  rationale: Le parfait guèze à la troisième personne du pluriel décrit une séparation accomplie; le passé simple convient au récit solennel et évite d’introduire un futur absent du texte.
- source_word: በይእቲ ዕለት
  choice: ce jour-là
  rationale: Formule temporelle apocalyptique rendue dans un français naturel et digne.
- source_word: ክልኤቱ ዐናብርት
  choice: les deux monstres
  rationale: « Monstres » conserve le caractère extraordinaire et cosmique de ces êtres sans les réduire à des animaux ordinaires.
- source_word: ዐንበሪ አንስትያዊት
  choice: un monstre femelle
  rationale: La formulation explicite à la fois le substantif et le sexe de l’un des deux êtres; elle conserve l’étrangeté du registre mythique.
- source_word: ዘስማ ሌዋያታን
  choice: nommé Léviathan
  rationale: La forme française traditionnelle « Léviathan » rend le nom immédiatement identifiable; « nommé » exprime naturellement la proposition relative sans lui attribuer un temps verbal absent du guèze.
- source_word: ከመ ትኅድር
  choice: destiné à demeurer
  rationale: Cette tournure exprime la valeur finale ou l’habitation assignée à la créature, tout en gardant un registre soutenu mais accessible.
- source_word: በልጕተ ባሕር
  choice: dans l’abîme de la mer
  rationale: « Abîme » préserve la force apocalyptique et la représentation cosmologique d’une région marine profonde.
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: au-dessus des sources des eaux
  rationale: La traduction garde la relation spatiale et l’image cosmologique ancienne des origines ou jaillissements des eaux.
theological_decisions:
- issue: Désignation des êtres dans la cosmologie apocalyptique
  choice: les deux monstres
  alternative: les deux bêtes / les deux créatures
  rationale: Le choix maintient leur étrangeté et leur dimension primordiale sans ajouter d’interprétation doctrinale.
- issue: Temps de la séparation
  choice: furent séparés
  alternative: seront séparés
  rationale: Le parfait guèze indique ici une action passée; le futur transformerait la chronologie du passage.
- issue: Forme française du nom transmis en guèze
  choice: Léviathan
  alternative: Lewyatan / Léwayatan
  rationale: La forme française établie est une translittération traditionnelle transparente pour le lectorat francophone; elle n’ajoute aucune interprétation au personnage.
translation_notes:
  register: Français international moderne, solennel mais lisible. Le passé simple marque le récit d’une action accomplie. L’imagerie cosmologique et sa tension spatiale sont conservées sans modernisation explicative.
