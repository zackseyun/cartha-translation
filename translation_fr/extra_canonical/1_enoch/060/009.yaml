base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: fr
  text: 'Et je demandai à un autre ange de me montrer la puissance de ces monstres-là[a] : comment, en un seul jour, ils furent séparés et jetés, l’un dans les profondeurs de la mer, l’autre sur la terre sèche, dans le désert[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contexte environnant identifie plus précisément ces deux créatures cosmiques, mais ce verset les appelle seulement « ces monstres-là ».
    reason: cross_reference
  - marker: b
    text: 'L’expression finale est difficile. Le guèze oppose apparemment la mer à une région terrestre aride ; littéralement, on pourrait comprendre : « sur la terre sèche, dans le désert ».'
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: j’ai demandé à
  rationale: Le verbe introduit la requête adressée à l’ange. Cette tournure est directe et naturelle en français moderne.
- source_word: ካልእ መልአክ
  choice: un autre ange
  rationale: Rend simplement le passage à un autre guide angélique, sans imposer l’idée plus précise d’un « deuxième » ange.
- source_word: ያርእየኒ
  choice: de me montrer
  rationale: Après « demander à », l’infinitif exprime naturellement en français le contenu de la requête.
- source_word: ኃይሎሙ
  choice: la puissance de ces monstres
  rationale: Le terme désigne d’abord la puissance ou la force. La construction française explicite le possesseur là où le guèze emploie un suffixe pronominal.
- source_word: እሉክ ዐናብርት
  choice: ces monstres
  rationale: « Monstres » conserve la dimension cosmique et inquiétante de ces créatures. En français narratif, « ces » renvoie naturellement aux êtres déjà évoqués, sans nécessiter le plus lourd « ces monstres-là ».
- source_word: ተሌለዩ
  choice: ils furent séparés
  rationale: 'Le passif est conservé : les créatures subissent cette séparation plutôt qu’elles ne se séparent elles-mêmes.'
- source_word: በአሐቲ ዕለት
  choice: en un seul jour
  rationale: Cette formulation préserve la valeur temporelle et souligne l’unité du jour sans préciser davantage la chronologie.
- source_word: ተወድዩ
  choice: jetés
  rationale: Le pluriel porte sur les deux créatures et suggère une mise en place forcée. La coordination avec « furent séparés » permet un français fluide.
- source_word: በልጕተ ባሕር
  choice: dans les profondeurs de la mer
  rationale: Rend l’idée de la partie profonde de la mer sans introduire le terme cosmologique plus technique d’« abîme ».
- source_word: በየብስ በድው
  choice: sur la terre sèche, dans le désert
  rationale: Conserve les deux éléments du guèze — la terre ferme et la région désertique — ainsi que leur contraste avec la mer.
theological_decisions:
- issue: Identification des deux créatures
  choice: Les désigner dans le texte comme « ces monstres » sans les nommer.
  alternative: Les identifier explicitement à Léviathan et Béhémoth d’après le contexte environnant.
  rationale: Le verset donné emploie une désignation générique. Ne pas ajouter les noms préserve la formulation locale du texte et évite une harmonisation implicite avec les versets voisins.
- issue: Portée du verbe « furent jetés »
  choice: Faire porter le pluriel sur les deux monstres.
  alternative: Comprendre qu’un seul monstre fut jeté, puis compléter implicitement le sort de l’autre.
  rationale: 'La forme guèze est plurielle et gouverne les deux destinations parallèles : l’une marine, l’autre terrestre.'
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le ton narratif élevé du récit visionnaire. Les parallélismes et les passifs du guèze sont préservés sans raideur excessive.
