    rationale: Le guèze exprime plus sobrement l’état d’être seul ou à part. « est à part » est plus proche et plus naturel ici.
  revised_text: L’esprit de la grêle sortit par la force de sa puissance, et son esprit est à part[a] ; ce qui s’en élève est comme de la fumée, et son nom est Givre[b].
