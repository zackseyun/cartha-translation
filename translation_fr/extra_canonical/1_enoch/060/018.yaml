base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: fr
  text: L’esprit de la grêle sortit par la force de sa puissance, et son esprit est à part[a] ; ce qui s’en élève est comme de la fumée, et son nom est Givre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le membre de phrase est difficile. On peut aussi traduire : « et l’esprit qui est en elle est seul » ou « est séparé ».'
    reason: lexical_alternative
  - marker: b
    text: 'La clause finale peut aussi être comprise comme donnant à ce qui s’élève le nom de « Rosée ». Le pronom peut également être rendu de façon personnelle : « et son nom à lui est Givre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈሰ
  choice: esprit
  rationale: Le terme désigne ici une puissance ou une entité cosmique personnifiée. « Esprit » conserve le registre apocalyptique sans réduire l’image à un simple phénomène météorologique.
- source_word: ሐመዳ
  choice: grêle
  rationale: Dans cette énumération de phénomènes atmosphériques, « grêle » rend le mieux le phénomène distinct et potentiellement destructeur désigné par le terme.
- source_word: ሐደገ
  choice: sortit
  rationale: Le verbe exprime un mouvement de sortie. « Sortit » garde cette image concrète sans préciser indûment s’il s’agit d’un départ ou d’une manifestation.
- source_word: በእንተ ኃይለ ዚአሁ
  choice: par la force de sa puissance
  rationale: Cette formulation conserve l’idée d’une cause ou d’une action efficace ainsi que le redoublement emphatique du vocabulaire de la force.
- source_word: ቦቱ ባሕቲቱ
  choice: qui est en elle se tient à part
  rationale: Le pronom renvoie naturellement à la grêle, tandis que ባሕቲቱ exprime le fait d’être seul, séparé ou à part. La tournure française évite la nuance analytique moderne de « distinct ».
- source_word: ዘየዐርግ እምኔሁ
  choice: ce qui s’en élève
  rationale: La proposition relative décrit quelque chose qui monte ou émane du phénomène précédent, sans imposer un référent plus précis.
- source_word: ከመ ጢስ
  choice: comme de la fumée
  rationale: La comparaison visuelle avec la fumée est conservée directement, plutôt que d’être atténuée en « vapeur ».
- source_word: ስሙ ደይክ
  choice: son nom est Gelée
  rationale: La formule donne un nom au phénomène qui vient d’être décrit. La majuscule maintient la personnification cosmique du passage.
theological_decisions:
- issue: Faut-il ramener les « esprits » météorologiques à de simples processus naturels ?
  choice: Conserver le mot « esprit » et le nom personnifié « Gelée »
  alternative: Traduire par « vent », « courant » ou par une description météorologique non personnifiée
  rationale: Le passage présente les réalités atmosphériques comme des puissances ordonnées et personnifiées. La traduction garde cette vision apocalyptique sans en faire une affirmation doctrinale étrangère au texte.
- issue: La séparation de l’esprit intérieur doit-elle être interprétée métaphysiquement ?
  choice: Rendre simplement l’idée qu’il « se tient à part »
  alternative: Dire qu’il est « distinct » ou qu’il « existe par lui-même »
  rationale: Le guèze exprime la solitude ou la séparation, mais ne précise pas la nature métaphysique de cette relation. La traduction préserve cette réserve.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe demeure proche du mouvement du guèze, tout en évitant les archaïsmes. Les images cosmologiques et leur personnification sont conservées, et les ambiguïtés de ባሕቲቱ ainsi que du pronom final sont signalées sans être résolues artificiellement.
