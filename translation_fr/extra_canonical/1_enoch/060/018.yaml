  - severity: low
    issue: La note b ne mentionne pas l’alternative lexicale « Rosée »
    rationale: La piste d’audit anglaise signale que la clause finale peut, selon l’analyse, nommer l’exhalaison « Rosée ». Cette ambiguïté doit être préservée en note.
  - severity: low
