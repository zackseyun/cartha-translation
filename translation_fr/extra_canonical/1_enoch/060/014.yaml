base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: fr
  text: Car des lieux de repos ont été donnés au tonnerre, en attendant le son de sa voix[a] ; le tonnerre et l’éclair ne se séparent pas et, bien qu’ils ne soient pas un[b], tous deux avancent par l’esprit[c] et ne se séparent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec longanimité » ou « dans la patience ». L’expression est difficile dans ce contexte ; elle peut évoquer l’attente ordonnée du retentissement du tonnerre.
    reason: lexical_alternative
  - marker: b
    text: La proposition traduite par « bien qu’ils ne soient pas un » est textuellement difficile dans ce témoin. Elle semble indiquer que le tonnerre et l’éclair demeurent distincts tout en avançant ensemble sans se séparer.
    reason: textual_variant
  - marker: c
    text: Le terme guèze traduit par « esprit » peut aussi signifier « souffle » ou « vent ». Il peut être question d’une action divine ou d’une force qui fait avancer ensemble le tonnerre et l’éclair.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit l’explication qui rattache ce verset à ce qui précède, sans préciser davantage la nature du lien causal.
- source_word: ለነጐድጓድ ምዕረፋተ
  choice: des lieux de repos ont été donnés au tonnerre
  rationale: Le pluriel de ምዕረፋተ est conservé. « Lieux de repos » rend concrètement l’image cosmologique de lieux assignés au tonnerre.
- source_word: በትዕግሥት
  choice: avec patience
  rationale: Rendu volontairement proche du texte, car le rapport syntaxique et la nuance exacte de l’expression restent obscurs dans ce contexte.
- source_word: ለቃለ ዚአሁ
  choice: pour le son de sa voix
  rationale: Conserve à la fois la dimension sonore de ቃል et la personnification expressive du tonnerre.
- source_word: ወኢይትሌለዩ
  choice: ne se séparent pas
  rationale: La même formulation est reprise aux deux occurrences afin de préserver la répétition rhétorique du texte.
- source_word: እነጐድጓድ ወእመብረቅ
  choice: le tonnerre et l’éclair
  rationale: Rend directement les deux phénomènes coordonnés et présentés comme des agents.
- source_word: ወእም፪ኒ
  choice: bien qu’ils ne soient pas un
  rationale: Le témoin est difficile, mais cette traduction maintient le contraste apparent entre la distinction des deux phénomènes et leur inséparabilité.
- source_word: በመንፈስ
  choice: par l’esprit
  rationale: La minuscule et la note préservent l’ouverture sémantique entre esprit, souffle et vent, sans exclure une action divine.
- source_word: ክልኤሆሙ የሐውሩ
  choice: tous deux avancent
  rationale: « Tous deux » maintient la dualité explicite, tandis qu’« avancent » rend le mouvement conjoint sans ajouter une destination.
theological_decisions:
- issue: Sens de በመንፈስ dans cette description cosmologique
  choice: par l’esprit
  alternative: par l’Esprit ; par un souffle ; par le vent
  rationale: Le terme peut désigner l’esprit, le souffle ou le vent. La traduction principale conserve « esprit » sans imposer par la majuscule une identification certaine à l’Esprit divin ; la note maintient explicitement les autres possibilités.
- issue: Rapport entre l’unité et la distinction du tonnerre et de l’éclair
  choice: bien qu’ils ne soient pas un
  alternative: bien qu’ils soient deux ; et ils ne sont pas un
  rationale: La leçon est textuellement difficile. Le choix retenu préserve la tension entre leur distinction et leur mouvement inséparable, sans en tirer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement inhabituelle de la première proposition est maintenue pour respecter l’obscurité réelle du texte source ; la ponctuation clarifie néanmoins les deux grandes unités du verset.
