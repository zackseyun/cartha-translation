base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: fr
  text: Quand viendront le jour, la puissance, le châtiment et le jugement que le Seigneur des esprits a préparés pour ceux qui ne se prosternent pas devant le Seigneur de justice, pour ceux qui renient le Seigneur de justice et pour ceux qui prononcent son nom en vain, ce jour-là a été préparé pour les élus comme un serment, et pour les pécheurs comme une enquête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Serment » peut aussi, selon le contexte, être compris comme une alliance jurée; « enquête » peut aussi se traduire par « examen » ou « investigation ».
    reason: Signale les amplitudes possibles de መሐላ et ሐተታ sans privilégier dans le texte principal une interprétation relationnelle ou procédurale plus précise.
lexical_decisions:
- source_word: እግዚአ፡ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Rend directement le titre éthiopien traditionnel, sans en préciser artificiellement le référent.
- source_word: እግዚ፡ ጽድቅ
  choice: le Seigneur de justice
  rationale: La construction éthiopienne associe « Seigneur » et « justice »; cette traduction conserve le titre et évite les substitutions interprétatives « loi juste » ou « juste jugement ».
- source_word: ይነሥኡ፡ ስሞ፡ በከ
  choice: prononcent son nom en vain
  rationale: Expression française naturelle qui conserve l’idée de prendre ou porter le nom dans la vanité, sans ajouter explicitement la notion de serment.
- source_word: መሐላ
  choice: alliance
  rationale: Le terme peut désigner un serment ou une alliance jurée; « alliance » convient au contraste eschatologique avec le sort des pécheurs tout en restant traditionnel.
- source_word: ሐተታ
  choice: interrogatoire
  rationale: Exprime une enquête ou un examen judiciaire; le contexte de jugement lui donne une portée sévère sans recourir au terme historiquement chargé « inquisition ».
theological_decisions:
- issue: Identité de « እግዚ፡ ጽድቅ »
  choice: Seigneur de justice
  alternative: loi juste / juste jugement
  rationale: Le texte transmis contient le substantif « Seigneur »; il est préférable de préserver ce titre et sa possible tension théologique plutôt que de le remplacer par deux objets abstraits différents.
- issue: Portée de መሐላ pour les élus
  choice: comme une alliance
  alternative: comme un serment
  rationale: Les deux valeurs sont possibles. « Alliance » rend la dimension relationnelle et solennelle, tandis que la note signale explicitement l’autre sens lexical.
- issue: Nature du sort réservé aux pécheurs
  choice: comme un interrogatoire
  alternative: comme une enquête / un examen
  rationale: Le terme est compris dans un cadre judiciaire, sans préciser au-delà du texte l’issue ou la forme exacte de cet examen.
translation_notes:
  register: Français international moderne, solennel mais lisible. La longue période et l’accumulation « le jour, la puissance, le châtiment et le jugement » sont conservées afin de respecter la rhétorique du texte source. Le futur antérieur « aura été préparé » marque que la préparation précède la venue du jour.
