base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: fr
  text: 'Et je demandai à l’ange de paix qui allait avec moi : « Vers qui vont ceux-ci qui tiennent les instruments de châtiment[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fouets » ; le terme guèze peut désigner le châtiment lui-même ou les instruments qui servent à l’infliger.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: je demandai à
  rationale: Le verbe introduit directement la question adressée à l’ange ; cette tournure est naturelle et digne en français narratif.
- source_word: መልአክ ሰላም
  choice: l’ange de paix
  rationale: La construction génitive est conservée, sans la réduire à l’adjectif « paisible ».
- source_word: ዘየሐውር ምስሌየ
  choice: qui allait avec moi
  rationale: L’imparfait rend le mouvement d’accompagnement au sein de la vision sans transformer la proposition en simple titre fonctionnel.
- source_word: እንዘ እብል
  choice: '[rendu par les deux-points]'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles et évitent le calque pesant « en disant ».
- source_word: ለመኑ የሐውሩ
  choice: vers qui vont-ils
  rationale: La préposition et le verbe de mouvement indiquent la destination ou la cible ; il ne s’agit pas de demander l’identité des personnages.
- source_word: እሉ እለ
  choice: ceux-ci qui
  rationale: Le démonstratif proximal est maintenu afin de désigner les êtres présents dans la vision.
- source_word: ይአኅዙ
  choice: tiennent
  rationale: Ce verbe neutre indique qu’ils ont les objets en main, sans préciser s’ils les portent simplement ou s’apprêtent à les employer.
- source_word: መቅሠፍተ
  choice: instruments de châtiment
  rationale: Puisque ces objets sont « tenus », le sens concret et instrumental est probable ; cette expression évite de préciser indûment qu’il s’agit nécessairement de fouets.
theological_decisions:
- issue: Sens abstrait ou concret de መቅሠፍተ
  choice: 'sens concret : « instruments de châtiment »'
  alternative: « châtiments » ou, plus précisément, « fouets »
  rationale: La syntaxe favorise des objets que les personnages peuvent tenir. Le terme source restant assez large, la traduction ne réduit pas l’image apocalyptique à une arme particulière.
- issue: Objet de la question d’Hénoch
  choice: 'destination ou cible : « Vers qui vont-ils ? »'
  alternative: 'identité : « Qui sont-ils ? »'
  rationale: La présence explicite du verbe « aller » et la valeur prépositionnelle de ለመኑ exigent une question portant sur la direction ou le destinataire, non sur l’identité.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit littéraire, tandis que l’imparfait marque l’accompagnement en cours. La structure de la question conserve le démonstratif proximal et l’ambiguïté relative à la cible ou à la destination.
