revisions:
- from: Et la ville de mes justes deviendra un obstacle pour leurs chevaux[a]. Ils provoqueront un massacre entre eux, et leur main droite sera forte contre eux. Un homme ne reconnaîtra plus son frère[b], ni un fils son père ou sa mère, jusqu’à ce que soit atteint le nombre des cadavres résultant de leur mort[c]. Leur châtiment ne sera pas vain.
  to: Et la ville de mes justes deviendra un obstacle pour leurs chevaux[a]. Ils provoqueront un massacre entre eux, et leur main droite sera forte contre eux. Un homme ne reconnaîtra pas son frère, et un fils ne reconnaîtra ni son père ni sa mère, jusqu’à ce que le nombre des cadavres résultant de leur mort soit complet[c]. Leur châtiment ne sera pas vain.
  rationale: La révision retire l’ajout interprétatif « plus », explicite en français le verbe sous-entendu dans la seconde relation familiale, et rend « le nombre ... soit complet » pour refléter l’achèvement exprimé dans le texte sans résoudre l’expression textuellement difficile concernant les cadavres et leur mort. La note b, bien qu’elle ne soit pas appelée dans le texte révisé, est conservée dans le jeu de notes fourni ; son ancre doit être placée après « son frère » si le système exige que toute note soit appelée.
