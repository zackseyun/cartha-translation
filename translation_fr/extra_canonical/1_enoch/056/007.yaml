review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la ville des justes fait obstacle aux chevaux, un massacre interne est suscité, la main droite agit avec force contre eux, les liens familiaux se désagrègent et le châtiment n’est pas vain. La formulation finale doit toutefois exprimer plus directement l’idée que le décompte des cadavres est « complet », sans interpréter davantage le rapport difficile entre cadavres et mort.'
  naturalness: Le français est globalement naturel et conserve un registre apocalyptique approprié. « Ne reconnaîtra plus » introduit cependant une nuance temporelle (« plus ») absente du texte, et la coordination « Un homme ... ni un fils ... » est moins nette en français. Une légère révision améliore la lisibilité sans lisser l’obscurité textuelle.
  terminology: « Justes », « obstacle », « main droite », « cadavres » et « châtiment » sont appropriés au registre et respectent les images du guèze. « Massacre entre eux » rend convenablement la réciprocité de la violence. Les notes conservent à juste titre les alternatives lexicales et la difficulté de la clause sur les cadavres.
  issues:
  - severity: low
    issue: Ajout de « plus » dans « ne reconnaîtra plus son frère ».
    rationale: Le guèze exprime la non-reconnaissance, sans marque explicite de cessation temporelle. En français, « plus » suggère qu’une reconnaissance antérieure est spécialement en cause ; il convient de ne pas ajouter cette nuance.
  - severity: low
    issue: La clause sur le nombre des cadavres est formulée comme « jusqu’à ce que soit atteint le nombre ».
    rationale: Cette tournure peut laisser entendre qu’un nombre externe est atteint. Le texte source, malgré sa difficulté, affirme plus directement l’achèvement ou la complétude du nombre. « jusqu’à ce que le nombre ... soit complet » est plus proche et reste transparent.
  revised_text: Et la ville de mes justes deviendra un obstacle pour leurs chevaux[a]. Ils provoqueront un massacre entre eux, et leur main droite sera forte contre eux. Un homme ne reconnaîtra pas son frère, et un fils ne reconnaîtra ni son père ni sa mère, jusqu’à ce que le nombre des cadavres résultant de leur mort soit complet[c]. Leur châtiment ne sera pas vain.
  revised_footnotes:
