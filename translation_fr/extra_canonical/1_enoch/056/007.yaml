base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: fr
  text: Et la ville de mes justes deviendra un obstacle pour leurs chevaux[a]. Ils provoqueront un massacre entre eux, et leur main droite sera forte contre eux. Un homme ne reconnaîtra pas son frère, et un fils ne reconnaîtra ni son père ni sa mère, jusqu’à ce que le nombre des cadavres résultant de leur mort soit complet[c]. Leur châtiment ne sera pas vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une entrave » ou « un piège » pour leurs chevaux ; le terme guèze évoque ce qui bloque ou prend au piège.
    reason: lexical_alternative
  - marker: c
    text: La proposition concernant « le nombre des cadavres résultant de leur mort » est difficile dans le texte éthiopien ; elle est rendue ici sans en gommer l’étrangeté.
    reason: textual_variant
lexical_decisions:
- source_word: ሀገረ፡ ጻድቃነ፡ ዚአየ
  choice: la ville de mes justes
  rationale: « Ville » conserve l’image concrète du lieu habité, tandis que « mes justes » rend la force possessive du texte guèze.
- source_word: ማዕቀፈ
  choice: un obstacle
  rationale: Le terme désigne ce qui arrête, entrave ou prend au piège. « Obstacle » reste naturel en français sans préciser indûment le mécanisme.
- source_word: አፍራሲሆሙ
  choice: leurs chevaux
  rationale: Traduction directe qui conserve l’imagerie militaire, contrairement à « cavalerie », plus interprétatif.
- source_word: ወያነሥኡ፡ በበ፡ ቢይናቲሆሙ፡ ቀትለ
  choice: Ils provoqueront un massacre entre eux
  rationale: Le verbe transitif régit « massacre » comme objet; la tournure réciproque exprime une violence interne.
- source_word: ወትጸንዕ፡ የማኖሙ፡ ዲቤሆሙ
  choice: leur main droite sera forte contre eux
  rationale: La formulation préserve l’idiome martial de la main droite comme symbole de puissance, sans le paraphraser par « vaincre ».
- source_word: ወኢያእምር፡ ብእሲ፡ ለአኁሁ
  choice: Un homme ne reconnaîtra plus son frère
  rationale: « Reconnaître » convient au contexte d’effondrement des liens familiaux; « plus » exprime naturellement en français la rupture à venir sans modifier le fond.
- source_word: ወኢወልድ፡ ለአቡሁ፡ ወለእሙ
  choice: ni un fils son père ou sa mère
  rationale: Le verbe « reconnaîtra » est sous-entendu par coordination, comme dans la syntaxe resserrée du texte source.
- source_word: እስከ፡ ይከውን፡ ኍልቈ፡ አብድነት፡ እሞቶሙ
  choice: jusqu’à ce que soit atteint le nombre des cadavres résultant de leur mort
  rationale: Cette formulation conserve de manière transparente l’étrange association du nombre, des cadavres et de leur mort, sans résoudre une expression textuellement difficile.
- source_word: ወመቅሰፍቶሙ፡ ኢትኩን፡ በከ
  choice: Leur châtiment ne sera pas vain
  rationale: « Châtiment » rend le jugement ou fléau subi, et « ne sera pas vain » préserve l’affirmation finale de son efficacité.
theological_decisions:
- issue: Force possessive dans « la ville de mes justes »
  choice: 'Conserver la première personne : « mes justes »'
  alternative: « la ville des justes »
  rationale: Le témoin guèze fourni porte une force possessive. La conserver maintient le motif de l’appartenance et de la protection divines sans explicitation doctrinale.
- issue: Nature du conflit
  choice: Violence réciproque au sein des forces concernées
  alternative: Massacre causé uniquement par une armée extérieure
  rationale: L’expression réciproque « entre eux » et la désintégration des liens familiaux qui suit favorisent une scène de violence intestine; le texte ne doit pas être aplani en simple désordre.
- issue: Expression du décompte des morts
  choice: Maintenir la difficulté de la formulation
  alternative: Paraphraser par « jusqu’à ce que tous soient morts »
  rationale: Le texte associe explicitement nombre, cadavres et mort. Une paraphrase plus fluide effacerait une ambiguïté réelle du témoin.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme apocalyptique et certaines aspérités significatives du guèze, tout en évitant les archaïsmes. « Justes », « main droite » et « châtiment » maintiennent le registre biblique sans ajouter de terminologie confessionnelle.
