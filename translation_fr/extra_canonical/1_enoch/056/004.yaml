base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: fr
  text: Et en ces jours-là, cette vallée sera remplie des élus et de ceux qui leur sont chers[a]. Les jours de leur vie prendront fin et, dès lors, les jours de leur égarement[b] ne seront plus comptés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « leurs bien-aimés » ou « ceux qui leur sont associés » ; l’identité exacte de ces personnes reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur errance » ou « leur erreur ».
    reason: lexical_alternative
  - marker: c
    text: Le dernier verbe peut aussi être compris au sens de « recensés » ou « pris en compte » ; la formulation guèze est difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: en ces jours-là
  rationale: Formule temporelle apocalyptique naturelle en français, qui conserve le pluriel du guèze.
- source_word: ውእቱ ቈላ
  choice: cette vallée
  rationale: ቈላ désigne ici une vallée et maintient la continuité topographique avec le contexte immédiat.
- source_word: ሕሩያን
  choice: les choisis
  rationale: Rend la désignation collective et solennelle sans recourir au terme plus traditionnel et potentiellement doctrinal « élus ».
- source_word: ፍቁራነ ዚአሆሙ
  choice: ceux qui leur sont chers
  rationale: Exprime naturellement la relation indiquée par le possessif tout en laissant ouverte l'identité précise de ces personnes.
- source_word: ይትዌዳእ
  choice: prendront fin
  rationale: Le verbe, issu de ወድአ, exprime l'achèvement; il doit rester distinct du verbe final relatif au décompte.
- source_word: ዕለተ ሕይወቶሙ
  choice: les jours de leur vie
  rationale: Traduction proche de la forme source, qui préserve le parallélisme avec la proposition suivante.
- source_word: ዕለተ ስሕተቶሙ
  choice: les jours de leur égarement
  rationale: « Égarement » conserve les dimensions de déviation, d'erreur et d'errance sans préciser indûment « péché ».
- source_word: እምይእዜ ኢትትኌለቍ
  choice: dès lors ... ne seront plus comptés
  rationale: Rend la cessation à partir de ce moment et le sens de dénombrement ou de mise en compte, tout en signalant en note l'incertitude du dernier verbe.
theological_decisions:
- issue: Désignation de ሕሩያን dans les Paraboles
  choice: les choisis
  alternative: les élus
  rationale: « Les choisis » garde la force d'une appellation collective tout en évitant de charger le passage d'une terminologie confessionnelle ultérieure.
- issue: Portée morale de ስሕተት
  choice: égarement
  alternative: erreur / errance
  rationale: Le terme peut évoquer à la fois l'erreur et le fait de s'écarter du bon chemin; la traduction ne tranche pas en faveur d'une qualification doctrinale plus précise.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe distingue nettement les deux propositions et leurs deux verbes: la vie prend fin, tandis que les jours d''égarement cessent d''être comptés. Les marqueurs de notes figurent tous dans le texte.'
