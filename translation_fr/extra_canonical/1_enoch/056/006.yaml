base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: fr
  text: Ils monteront et fouleront le pays de ceux qu’il a choisis[a], et, devant eux, le pays de ceux qu’il a choisis deviendra un terrain piétiné, une piste battue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils monteront et avanceront à travers le pays de ceux qu’il a choisis. » Les verbes peuvent décrire une avancée militaire aussi bien qu’une action littérale de fouler le sol.'
    reason: lexical_alternative
  - marker: b
    text: 'Le guèze est difficile. Les deux expressions finales semblent intensifier la même image : le pays devient un terrain foulé, comme une piste ou un chemin battu.'
    reason: textual_variant
lexical_decisions:
- source_word: የዓርግዋ
  choice: ils monteront
  rationale: Le verbe exprime un mouvement ascendant; « monter » conserve ce sens concret tout en pouvant évoquer, dans ce contexte militaire, une avancée contre le pays.
- source_word: ይከይድዋ
  choice: fouleront
  rationale: La racine renvoie au fait d’aller, de marcher ou de fouler. « Fouleront » maintient le lien avec l’image hostile du lieu piétiné dans la proposition suivante.
- source_word: ምድረ
  choice: le pays
  rationale: Le terme désigne ici le territoire des choisis plutôt que la terre entière. « Pays » est naturel en français et convient à l’avancée militaire décrite.
- source_word: ኅሩያነ
  choice: ceux qu’il a choisis
  rationale: Cette formulation moderne et transparente conserve la désignation énochique sans introduire le vocabulaire confessionnel que pourrait suggérer « élus ».
- source_word: ዚአሁ
  choice: qu’il a choisis
  rationale: La tournure française exprime la relation marquée par le possessif guèze tout en conservant le pronom « il » et sans identifier son référent.
- source_word: በቅድሜሆሙ
  choice: devant eux
  rationale: La formulation garde la dimension spatiale et présente le pays comme exposé à l’avancée des assaillants.
- source_word: ምካይደ
  choice: un lieu piétiné
  rationale: Le nom semble apparenté au verbe précédent relatif à la marche ou au foulage. Cette traduction préserve l’écho lexical et l’image de dévastation.
- source_word: አሰረ
  choice: un chemin battu
  rationale: Le nom désigne vraisemblablement une piste ou un chemin. « Chemin battu » renforce concrètement l’image créée par les passages répétés.
theological_decisions:
- issue: Référent du pronom dans « ceux qu’il a choisis »
  choice: Conserver « il » sans identifier explicitement son référent.
  alternative: « les choisis de Dieu » ou « ceux que le Seigneur a choisis »
  rationale: Le guèze ne fournit qu’un pronom possessif. Nommer Dieu ou le Seigneur dans le texte principal préciserait ce que ce verset laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « le pays de ceux qu’il a choisis » est maintenue pour respecter l’insistance de la source. « Fouleront », « lieu piétiné » et « chemin battu » conservent le réseau d’images lié à la marche hostile.
