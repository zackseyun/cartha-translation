base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: fr
  text: En ces jours-là, le Shéol ouvrira sa bouche, et ils s’y enfonceront. La destruction les poursuivra, et le Shéol engloutira les pécheurs, loin de la présence de ceux qui ont été choisis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant la face de ceux qui ont été choisis »; l’expression signifie qu’ils sont retirés de leur présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Cette formule temporelle récurrente conserve le registre visionnaire et apocalyptique du texte.
- source_word: ትፈትሕ፡ ሲኦል፡ አፉሃ
  choice: le Shéol ouvrira sa bouche
  rationale: La voix active et l’image concrète préservent la personnification du monde des morts. « Shéol » évite les connotations doctrinales plus tardives de « enfer ».
- source_word: ወይስጠሙ፡ ውስቴታ
  choice: et ils s’y enfonceront
  rationale: Le verbe évoque un mouvement de descente ou d’enfoncement dans le Shéol ouvert, sans anticiper le verbe distinct « engloutir » de la proposition suivante.
- source_word: ወትትሎሙ፡ ኀጕሎን
  choice: La destruction les poursuivra
  rationale: Cette traduction rend explicitement le verbe « suivre/poursuivre » présent dans le guèze, avec « la destruction » pour sujet. « Poursuivra » exprime naturellement en français la menace active de l’image.
- source_word: ሲኦል፡ ይውሕጦሙ
  choice: le Shéol engloutira
  rationale: « Engloutir » restitue avec force l’image du Shéol personnifié qui dévore ses victimes.
- source_word: ለኃጥኣን
  choice: les pécheurs
  rationale: Le substantif désigne directement des pécheurs; cette traduction évite de le paraphraser par « méchants ».
- source_word: እምቅድመ፡ ገጸ፡ ኅሩያን
  choice: loin de la présence de ceux qui ont été choisis
  rationale: Cette formulation française naturelle rend l’idiome littéral « de devant la face » comme un éloignement de leur présence. « Ceux qui ont été choisis » reste proche du sens local sans charger le terme d’un vocabulaire doctrinal ultérieur.
theological_decisions:
- issue: Sens de ሲኦል
  choice: Shéol
  alternative: enfer; séjour des morts; tombe
  rationale: Le passage représente un domaine cosmique personnifié qui ouvre sa bouche et engloutit. La translittération « Shéol » conserve cette conception ancienne sans l’identifier automatiquement à l’enfer de formulations doctrinales postérieures.
- issue: Désignation de ኅሩያን
  choice: ceux qui ont été choisis
  alternative: les élus; les choisis
  rationale: La périphrase est claire en français moderne et conserve l’idée de choix tout en évitant d’imposer au terme le poids d’usages théologiques ultérieurs.
translation_notes:
  register: Français international moderne, digne et imagé. La personnification du Shéol et la progression des actions sont conservées. La ponctuation distingue clairement l’enfoncement, la poursuite par la destruction et l’engloutissement final.
