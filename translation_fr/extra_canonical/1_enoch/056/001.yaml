base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/001.yaml
  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: fr
  text: Et là, je vis les troupes des anges du châtiment qui allaient çà et là, tenant des fouets et des chaînes, en fer et en bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « troupes » peut aussi désigner des rangs ou des armées. Les mots traduits par « fouets » et « chaînes » désignent des instruments de châtiment dont le sens précis est discuté; « fer et bronze » peut qualifier les deux instruments ou, selon l’analyse syntaxique, plus particulièrement les chaînes.
    reason: Préserver les incertitudes lexicales et la portée syntaxique des désignations métalliques sans supprimer le collectif angélique.
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: Et là, je vis
  rationale: Rend directement la formule de témoignage visionnaire et l’indication de lieu dans un français naturel et digne.
- source_word: ትዕይንታተ
  choice: en vision
  rationale: Dans ce contexte, le terme est compris comme marquant la perception visionnaire. Cette lecture reste toutefois philologiquement incertaine, car une analyse comme « groupes/armées » a aussi été proposée.
- source_word: መላእክት፡ መቅሠፍት
  choice: les anges du châtiment
  rationale: La construction désigne des anges chargés d’exécuter un jugement punitif, sans les assimiler à des démons.
- source_word: እንዘ፡ የሐውሩ
  choice: qui allaient çà et là
  rationale: Exprime le mouvement continu des anges dans la scène sans préciser indûment leur destination.
- source_word: ወይአሕዙ
  choice: tenant
  rationale: Le participe français restitue naturellement l’action simultanée et continue.
- source_word: መቅሠፍተ
  choice: des fouets
  rationale: Le mot désigne ici vraisemblablement un instrument servant à frapper ou à punir; « fouets » conserve l’image concrète tout en signalant son incertitude en note.
- source_word: ወመማግረ
  choice: et des chaînes
  rationale: Le second objet est compris comme des chaînes ou des entraves, conformément à l’ordre des objets dans le guèze.
- source_word: ሐጺን፡ ውብርት
  choice: de fer et de bronze
  rationale: Conserve les deux matières métalliques dans leur ordre; la syntaxe permet de les rattacher aux chaînes, tout en laissant en note l’incertitude concernant leur portée exacte.
theological_decisions:
- issue: Nature des figures angéliques
  choice: des anges chargés du châtiment judiciaire
  alternative: des anges destructeurs ou des anges de l’affliction
  rationale: « Anges du châtiment » préserve la fonction judiciaire propre à la scène apocalyptique sans importer de catégorie démonologique postérieure.
- issue: Portée de ትዕይንታተ
  choice: marque de perception visionnaire
  alternative: groupes, rangs ou armées d’anges
  rationale: L’analyse fournie est disputée. Le texte principal retient « en vision », mais la note préserve explicitement l’autre possibilité au lieu de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et soutenu. « Châtiment » garde la force judiciaire et apocalyptique; « allaient çà et là » rend le mouvement de manière naturelle. La note regroupe les incertitudes philologiques sans alourdir le verset.
