base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: fr
  text: En ces jours-là, les anges reviendront et tourneront la tête vers l’est, vers les peuples de Parthie et de Médie. Ils soulèveront les rois[a], et un esprit de trouble[b] viendra sur eux ; il les délogera de leurs trônes. Alors ils sortiront comme des lions hors de leurs repaires et comme des loups affamés au milieu de leur pâturage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon du texte à cet endroit est difficile. « Les rois » est probable, puisque la suite parle de leurs trônes.
    reason: textual_variant
  - marker: b
    text: Ou « un esprit de confusion ». L’expression guèze peut désigner une puissance ou un état de désordre, sans préciser s’il s’agit d’un être spirituel personnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበአማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et le pluriel du guèze dans un français biblique naturel.
- source_word: ይገብኡ መላእክት
  choice: les anges reviendront
  rationale: Le verbe fourni est la forme simple de ገብአ, « revenir », et non la forme réfléchie signifiant « se rassembler » attestée comme variante dans certains témoins.
- source_word: ወይወድዩ አርእስቲሆሙ
  choice: et tourneront la tête
  rationale: Rend l’image corporelle des « têtes » tout en employant une expression française naturelle.
- source_word: ለምሥራቅ
  choice: vers l’est
  rationale: Préserve l’orientation géographique concrète.
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: vers le peuple de la Parthie et de la Médie
  rationale: Maintient le nom collectif « peuple » ainsi que les deux désignations géographiques.
- source_word: የሐውክዎሙ
  choice: Ils soulèveront
  rationale: Le radical exprime l’agitation et le bouleversement ; « soulever » convient au contexte où des souverains sont poussés à l’action.
- source_word: ለዝንቱ
  choice: les rois
  rationale: La leçon transmise ici est difficile, mais le contexte immédiat des trônes indique très probablement des rois ou dirigeants ; l’incertitude est signalée en note.
- source_word: መንፈሰ ሀውክ
  choice: un esprit de trouble
  rationale: Reproduit le vocabulaire de l’esprit et du désordre sans décider s’il s’agit d’un être personnel ou d’une force de confusion.
- source_word: የሀውክዎሙ እመንበረሆሙ
  choice: il les délogera de leurs trônes
  rationale: Exprime le bouleversement causé par l’esprit ainsi que le mouvement hors des sièges royaux.
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: comme des lions hors de leurs repaires
  rationale: Conserve l’image prédatrice et rend idiomatiquement le lieu où les lions se couchent.
- source_word: ከመ አዝእብት ርኁባን
  choice: comme des loups affamés
  rationale: Traduction directe et accessible du substantif et de son qualificatif.
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: au milieu de leur pâturage
  rationale: Préserve l’image du lieu de pâture sans introduire explicitement des troupeaux absents de la formulation retenue.
theological_decisions:
- issue: Nature de መንፈሰ ሀውክ
  choice: un esprit de trouble
  alternative: un esprit de confusion ; un souffle de désordre
  rationale: L’article indéfini et la minuscule préservent l’ambiguïté entre un agent spirituel et une puissance ou condition de désordre, sans imposer une lecture démonologique ou purement abstraite.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des images apocalyptiques. « En ces jours-là » et « trônes » conservent la tonalité biblique sans archaïsme marqué.
