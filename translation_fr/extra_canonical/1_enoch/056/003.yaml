base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: fr
  text: 'Il me dit : « Vers leurs élus et leurs bien-aimés[a], pour qu’ils soient jetés dans la faille de l’abîme de la vallée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’identité de « leurs élus » et de « leurs bien-aimés » n’est pas précisée dans ce verset. « Leurs élus » désigne ici les personnes qu’ils ont choisies, sans que le référent de « ils » soit explicité. La phrase répond vraisemblablement à la question du verset précédent : « Vers qui vont-ils ? »'
    reason: ambiguïté du référent et lien contextuel
  - marker: b
    text: 'Ou : « dans la crevasse de l’abîme de la vallée ». L’expression guèze accumule des termes topographiques évoquant une ouverture profonde ; leur agencement exact reste difficile à rendre naturellement.'
    reason: variante lexicale
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Il me dit
  rationale: Formule narrative courante introduisant l’explication donnée au visionnaire ; le passé simple convient au registre narratif français.
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: Vers ceux qu’ils ont choisis
  rationale: La préposition ለ est comprise dans son sens directionnel, en réponse à la question du verset précédent. ዚአሆሙ est possessif (« leurs »), et non démonstratif. La tournure verbale évite la coloration doctrinale que pourrait prendre « leurs élus ».
- source_word: ወለፍቁራኒሆሙ
  choice: et ceux qu’ils aiment
  rationale: Rend le lien d’affection et le possessif sans préciser s’il s’agit de proches, d’alliés ou de favoris.
- source_word: ከመ፡ ይትወደዩ
  choice: afin qu’ils soient précipités
  rationale: Conserve la construction finale et passive ainsi que la violence du mouvement vers le lieu de jugement.
- source_word: ውስተ፡ ንቅዐተ
  choice: dans la faille
  rationale: Le terme désigne une fente, une crevasse ou une ouverture ; « faille » maintient le caractère topographique de la vision.
- source_word: ማዕምቅ
  choice: de l’abîme
  rationale: Préserve l’image d’une profondeur immense et sa résonance apocalyptique.
- source_word: ዘቈላ
  choice: de la vallée
  rationale: Rend directement le nom topographique et conserve la chaîne génitive du texte guèze.
theological_decisions:
- issue: Identité de « ceux qu’ils ont choisis » et de « ceux qu’ils aiment »
  choice: Ne pas identifier davantage ces groupes et conserver le possessif pluriel.
  alternative: Les présenter explicitement comme des proches ou des alliés des puissants voués au jugement.
  rationale: Le référent exact n’est pas exprimé dans ce seul verset. Une explicitation résoudrait indûment l’ambiguïté du passage.
- issue: Antécédent du sujet de « soient précipités »
  choice: Conserver le pronom pluriel sans nommer explicitement les personnes visées.
  alternative: Répéter « ceux qu’ils ont choisis et ceux qu’ils aiment » comme sujets du châtiment.
  rationale: La syntaxe permet naturellement ce rattachement, mais le texte n’ajoute aucun nom explicatif ; le pronom français maintient cette concision.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours direct conserve la forme brève d’une réponse liée au verset précédent. « Ceux qu’ils ont choisis » est préféré à « leurs élus » afin d’éviter une connotation doctrinale étrangère au contexte, tandis que « faille de l’abîme de la vallée » maintient volontairement l’imagerie dense et inquiétante du guèze.
