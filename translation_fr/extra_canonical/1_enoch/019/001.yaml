base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: fr
  text: 'Et Uriel me dit : « Ici se tiendront les anges qui se sont unis à des femmes ; leurs esprits[a], ayant pris de nombreuses formes[b], ont souillé les humains et les égarent, de sorte qu’ils offrent des sacrifices aux démons comme à des dieux, jusqu’au jour du grand jugement. Ce jour-là, ils seront jugés jusqu’à ce qu’ils parviennent à leur terme[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « leurs esprits » traduit littéralement le guèze. Elle peut désigner les esprits de ces êtres déchus ou des esprits associés à leur descendance ; le texte ne précise pas le rapport exact.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « étant devenus de nombreuses apparitions ». L’expression guèze est difficile et peut évoquer diverses manifestations par lesquelles ces esprits corrompent les humains.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « jusqu’à ce qu’ils soient achevés » ou « jusqu’à ce que leur terme soit pleinement atteint ». La clause souligne l’accomplissement total du jugement, mais sa nuance exacte demeure incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: se sont unis
  rationale: Le verbe exprime l’association ou l’union. La forme pronominale conserve la valeur réfléchie sans expliciter davantage la nature de l’union avec les femmes.
- source_word: ይቀውሙ
  choice: se tiendront
  rationale: Ce futur garde la force solennelle et spatiale de la scène visionnaire, où les anges demeurent au lieu indiqué.
- source_word: መናፍስቲሆሙ
  choice: leurs esprits
  rationale: Traduction littérale du nom pluriel avec son possessif, qui préserve l’incertitude sur l’identité exacte de ces esprits.
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: ayant pris de nombreuses formes
  rationale: La locution difficile associe l’idée de devenir à celle d’apparence ou de vision. Cette formulation française exprime des manifestations variées sans imposer une interprétation plus précise.
- source_word: አርኰስዎሙ
  choice: ont souillé
  rationale: Le parfait est rendu comme une action accomplie. « Souiller » conserve les nuances morales et cultuelles du verbe.
- source_word: ለሰብእ
  choice: les humains
  rationale: Le terme désigne collectivement les êtres humains; cette formulation moderne évite un sens exclusivement masculin.
- source_word: ወያስሕትዎሙ
  choice: et les égarent
  rationale: Le présent restitue l’imperfectif qui suit le parfait et présente l’égarement comme une action en cours.
- source_word: ከመ ይሡዑ
  choice: afin qu’ils offrent des sacrifices
  rationale: La tournure exprime le résultat visé de l’égarement, tandis que le verbe désigne plus précisément le sacrifice que le culte en général.
- source_word: ለአጋንንት ከመ አማልክት
  choice: aux démons comme à des dieux
  rationale: La formulation conserve à la fois les destinataires du sacrifice et la comparaison cultuelle, sans présenter ces démons comme étant réellement des dieux.
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: le jour du grand jugement
  rationale: Cette traduction suit de près l’ordre et la solennité de la formule apocalyptique guèze.
- source_word: በዛ ይትኴነኑ
  choice: Là, ils seront jugés
  rationale: « Là » rend l’adverbe démonstratif, qui peut renvoyer au jour ou au cadre alors évoqué; le passif judiciaire reste non amplifié.
- source_word: እስከ ይትፈጸሙ
  choice: jusqu’à ce que leur fin soit accomplie
  rationale: La formulation exprime l’achèvement complet annoncé par le verbe sans définir dogmatiquement la nature de cette fin.
theological_decisions:
- issue: Identité des agents désignés par « leurs esprits »
  choice: Conserver littéralement « leurs esprits ».
  alternative: « les esprits issus d’eux » ou « les esprits de leur descendance »
  rationale: Le guèze ne précise pas s’il s’agit des esprits des anges déchus, d’esprits liés à leur descendance ou de leurs manifestations. La traduction ne tranche donc pas cette question ontologique.
- issue: Portée de la clause finale
  choice: « jusqu’à ce que leur fin soit accomplie »
  alternative: « jusqu’à ce qu’ils soient anéantis » ou « jusqu’à ce que leur condamnation soit complète »
  rationale: Le texte souligne l’achèvement, mais ne définit pas explicitement le mode ni la durée du châtiment final. La formulation retenue préserve cette tension.
- issue: Statut des démons comparés à des dieux
  choice: « aux démons comme à des dieux »
  alternative: « aux démons qui sont des dieux »
  rationale: La particule comparative décrit les honneurs sacrificiels rendus aux démons; elle ne les identifie pas ontologiquement à des dieux.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme visionnaire est conservé par des phrases solennelles mais non archaïques. L’alternance entre le parfait (« ont souillé ») et l’action en cours (« les égarent ») reflète la succession des formes verbales guèzes. Les ambiguïtés concernant les esprits et la fin du jugement sont maintenues dans le texte et explicitées sobrement en notes.
