  to: 'Et Uriel me dit : « Ici se tiendront les anges qui se sont unis à des femmes ; leurs esprits[a], ayant pris de nombreuses formes[b], ont souillé les humains et les égarent, de sorte qu’ils offrent des sacrifices aux démons comme à des dieux, jusqu’au jour du grand jugement. Ce jour-là, ils seront jugés jusqu’à ce qu’ils parviennent à leur terme[c]. »'
