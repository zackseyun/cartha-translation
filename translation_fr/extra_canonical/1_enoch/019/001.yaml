  source_fidelity: 'Le projet rend fidèlement la structure principale du guèze : les anges unis à des femmes, leurs esprits aux manifestations multiples, la souillure déjà accomplie, l’égarement en cours, les sacrifices offerts aux démons comme à des dieux, puis le jugement. Le présent « les égarent » respecte utilement l’imperfectif après « ont souillé ». La reprise « Là » est toutefois moins précise en français que le démonstratif rattaché au « jour du grand jugement » ; « ce jour-là » rend plus clairement ce lien.'
