review_pass:
  verdict: revise
  source_fidelity: 'La séquence ለስሑታን፡ መላእክት forme le complément de « femmes » : il s’agit des femmes/épouses des anges qui se sont égarés, non d’une apposition au possessif. Dans ce contexte de 1 Hénoch 19, ሰላማዊያት est le terme traditionnellement compris comme « sirènes »; le rendre « êtres paisibles » suit une étymologie apparente, mais manque le référent lexical et narratif du passage.'
  naturalness: « Et les femmes des anges qui se sont égarés deviendront des sirènes » est naturel, sobre et conforme au registre apocalyptique. Les tirets de la version proposée créent en français une apposition artificielle et obscurcissent le lien syntaxique.
  terminology: « Anges », « se sont égarés » et « deviendront » conviennent. « Femmes » préserve l’ambiguïté possible avec « épouses »; une note peut signaler cette dernière option. « Sirènes » est le terme français établi pour les êtres visés, sans imposer une identification angélique.
  issues:
  - severity: high
    issue: Analyse syntaxique principale erronée ou insuffisamment justifiée
    rationale: 'La construction « les anges qui se sont égarés » dépend de « femmes » : « les femmes des anges qui se sont égarés ». La présentation comme apposition à « leurs femmes » ne reproduit pas clairement cette relation et la note principale relativise indûment l’analyse la mieux soutenue.'
  - severity: high
    issue: « des êtres paisibles » ne rend pas adéquatement le terme final dans son contexte
    rationale: Dans la tradition textuelle de 1 Hénoch 19:2, le pluriel final désigne des « sirènes ». Une paraphrase par « êtres paisibles » efface le référent mythologique et produit un sens contextuellement invraisemblable.
  - severity: medium
    issue: Les notes b et c conservent ou favorisent des lectures qui ne doivent pas gouverner le texte
    rationale: La note b présente l’apposition comme lecture principale, et la note c explique « paisibles » plutôt que le sens lexical contextuel de « sirènes ». Elles doivent être remplacées pour ne pas fausser la lecture.
  revised_text: Et les femmes[a] des anges qui se sont égarés deviendront des sirènes[b].
  revised_footnotes:
  - marker: a
    text: Ou « les épouses ». Le terme guèze peut désigner des femmes en général ou des épouses.
    reason: lexical_alternative
  - marker: b
    text: Le terme guèze est traditionnellement compris ici comme désignant des sirènes. Sa forme peut paraître liée au mot « paix », mais le contexte et la tradition de traduction soutiennent ce sens.
    reason: lexical_contextual_rendering
  revision_rationale: La révision rétablit le génitif « des anges qui se sont égarés » et rend le dernier terme selon son sens contextuel traditionnel dans ce passage. Elle maintient, par une note brève, l’ambiguïté lexicale entre « femmes » et « épouses », sans transformer une difficulté étymologique en un sens principal qui décontextualise le verset.
