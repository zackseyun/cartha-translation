base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: fr
  text: Et leurs femmes[a] — les anges qui se sont égarés[b] — deviendront comme des êtres paisibles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les femmes des anges qui se sont égarés ». Le terme guèze peut désigner des femmes en général ou des épouses, et la construction syntaxique est difficile.
    reason: lexical_alternative
  - marker: b
    text: La formulation peut être comprise comme une apposition qui précise à qui renvoie « leurs »; une autre analyse rattache directement « les anges qui se sont égarés » à « femmes ».
    reason: alternative_reading
  - marker: c
    text: Littéralement, « comme des paisibles ». L’expression peut désigner des êtres caractérisés par la paix ou indiquer qu’elles accéderont à un état de paix.
    reason: alternative_reading
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: Et leurs femmes
  rationale: Le nom peut désigner des femmes ou, selon la relation exprimée par le suffixe pronominal, leurs épouses. Dans ce contexte, « leurs femmes » garde en français une certaine souplesse tout en suivant la construction appositive retenue.
- source_word: ለስሑታን፡ መላእክት
  choice: les anges qui se sont égarés
  rationale: La séquence est comprise comme une apposition précisant l’antécédent du possessif dans « leurs femmes ». « Se sont égarés » conserve l’idée d’écart ou d’égarement sans la réduire au terme général « pécheurs ».
- source_word: ተከመ
  choice: comme
  rationale: La particule marque une comparaison et non une identité de nature.
- source_word: ሰላማዊያት
  choice: des êtres paisibles
  rationale: L’adjectif pluriel dérivé de « paix » est rendu substantivement. « Des êtres paisibles » demeure naturel en français tout en préservant l’imprécision du référent.
- source_word: ይከውና
  choice: deviendront
  rationale: Le verbe exprime le fait de devenir ou d’advenir; le futur convient à la transformation annoncée.
theological_decisions:
- issue: Nature de la transformation des femmes
  choice: Elles deviendront semblables à des êtres paisibles, sans être identifiées à des anges.
  alternative: Elles deviendront des anges, ou entreront dans un état de paix.
  rationale: La particule comparative impose une ressemblance plutôt qu’une identité ontologique; le texte ne précise toutefois pas pleinement la nature de cette ressemblance.
- issue: Rapport syntaxique de « les anges qui se sont égarés »
  choice: Apposition explicitant ceux auxquels renvoie « leurs »
  alternative: 'Génitif: « les femmes des anges qui se sont égarés »; ou lecture faisant des anges le terme de la comparaison.'
  rationale: La source transmise est syntaxiquement difficile et les révisions antérieures divergent. Le texte principal suit la dernière analyse appositive, tandis qu’une note conserve l’autre construction plausible.
translation_notes:
  register: Français international moderne, digne et lisible. Les tirets signalent l’apposition sans effacer l’ambiguïté syntaxique du guèze; les notes exposent les principales lectures concurrentes.
