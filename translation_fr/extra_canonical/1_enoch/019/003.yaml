base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: fr
  text: Et moi, Hénoch, seul, j’ai vu la vision des confins de toutes choses[a] ; aucun être humain ne verra comme j’ai vu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les extrémités de toutes choses ». L’expression guèze peut désigner les limites les plus lointaines et avoir une portée à la fois spatiale et cosmique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucun être humain ne voit comme j’ai vu ». La forme verbale guèze peut être comprise au présent ou au futur.'
    reason: temporal_ambiguity
lexical_decisions:
- source_word: አርአያ
  choice: vision
  rationale: Dans ce contexte apocalyptique, le mot désigne une réalité révélée à la vue, et non une simple apparence. « Vision » conserve cette portée prophétique.
- source_word: ባሕቲትየ
  choice: j’ai été le seul
  rationale: Cette formulation française naturelle souligne qu’Hénoch est l’unique bénéficiaire de cette expérience visuelle.
- source_word: አጽናፈ ኵሉ
  choice: les confins de toutes choses
  rationale: አጽናፍ évoque les extrémités, les limites ou les confins. « Les confins de toutes choses » préserve l’ampleur cosmique de l’expression sans la réduire aux limites physiques de la terre ni à la fin temporelle de l’univers.
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: aucun être humain ne verra
  rationale: La tournure exprime qu’aucun autre humain n’aura une vision comparable. « Être humain » rend ሰብእ sans introduire une restriction masculine absente du propos.
- source_word: ከመ አነ ርኢኩ
  choice: ce que j’ai vu
  rationale: Cette formulation idiomatique en français conserve le témoignage personnel et accompli d’Hénoch, tout en évitant le tour peu naturel « comme moi j’ai vu ».
- source_word: ሄኖክ
  choice: Hénoch
  rationale: « Hénoch » est la forme française traditionnelle et immédiatement reconnaissable du nom, plutôt qu’une translittération directe telle que « Henok ».
theological_decisions:
- issue: Portée de la révélation unique reçue par Hénoch
  choice: Hénoch affirme avoir été seul à contempler une vision cosmique atteignant « les confins de toutes choses ».
  alternative: Il aurait vu soit les extrémités géographiques de la terre, soit l’achèvement temporel de toutes choses.
  rationale: Le guèze demeure large et imagé. La traduction conserve cette tension spatiale et cosmique sans imposer une lecture exclusivement géographique ou temporelle.
- issue: Valeur temporelle de ይሬኢ
  choice: ne verra
  alternative: ne voit
  rationale: L’imparfait éthiopien peut porter une valeur présente ou future. Le futur s’accorde avec l’affirmation d’une expérience destinée à rester sans équivalent, mais l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation présente « les confins de toutes choses » comme le contenu ou l’explicitation de la vision. Le nom « Hénoch » suit l’usage français établi.
