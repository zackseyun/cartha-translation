base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: fr
  text: Et ainsi, une séparation a été établie pour les âmes de ceux qui se plaignent[a], qui font connaître leur destruction[b] lorsqu’ils ont été tués aux jours des pécheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussent des cris », « se lamentent » ou « portent accusation ». Le verbe guèze peut exprimer la lamentation, la plainte ou la protestation.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi désigner leur ruine ou, plus précisément, leur fin violente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተፈልጠ
  choice: une séparation a été établie
  rationale: Le passif exprime une mise à part ou une division. Dans le contexte des lieux distincts réservés aux morts, cette formulation conserve à la fois la dimension spatiale et judiciaire.
- source_word: ለነፍሰ
  choice: pour les âmes
  rationale: La préposition a ici une valeur d’attribution; le pluriel est indiqué par les relatives qui suivent.
- source_word: እለ፡ ይስክዩ
  choice: ceux qui portent plainte
  rationale: Le verbe peut évoquer la lamentation, le cri de protestation ou l’accusation. « Portent plainte » maintient le lien entre souffrance et appel à la justice sans imposer un cadre juridique trop précis.
- source_word: እለ፡ ያርእዩ
  choice: qui font connaître
  rationale: Le verbe signifie montrer ou faire connaître. Cette traduction est naturelle en français et préserve l’idée de révélation ou de manifestation.
- source_word: በእንተ፡ ሕጉለት
  choice: leur destruction
  rationale: Le nom peut désigner la destruction, la ruine ou une fin violente. Le terme général « destruction » reste proche du guèze, tandis qu’une note signale la nuance possible.
- source_word: አመ፡ ተቀትሉ
  choice: lorsqu’ils ont été tués
  rationale: Le passif désigne clairement la mise à mort. « Tués » est direct, digne et naturel en français moderne, sans ajouter explicitement la qualification juridique de meurtre.
- source_word: በመዋዕለ፡ ኃጥኣን
  choice: aux jours des pécheurs
  rationale: La tournure temporelle caractérise l’époque par les pécheurs. La formulation conserve la diction apocalyptique et le contraste moral du texte.
theological_decisions:
- issue: Les âmes crient-elles seulement leur douleur ou portent-elles une accusation en raison du sang versé injustement ?
  choice: Le texte principal dit « portent plainte », ce qui laisse entendre à la fois la lamentation et la protestation adressée en vue de la justice.
  alternative: « poussent des cris », « se lamentent » ou « accusent »
  rationale: Le contexte du chapitre, notamment le cri d’Abel, donne au verbe une possible portée judiciaire. La traduction choisie préserve cette tension sans réduire le sens à une simple lamentation ni à une accusation formelle.
translation_notes:
  register: Français moderne international, naturel et digne. La syntaxe conserve le parallélisme des deux propositions relatives ainsi que le ton judiciaire et apocalyptique du passage, sans employer l’archaïsme « mis à mort » ni surinterpréter la culpabilité des meurtriers.
