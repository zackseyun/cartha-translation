base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: fr
  text: 'Il me répondit et me dit : « Ces trois lieux ont été faits afin que les esprits des morts soient séparés. Et ainsi, une part a été séparée pour les esprits des justes : il y a là une source d’eau, avec de la lumière au-dessus d’elle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze est concise : la lumière peut être comprise comme se trouvant au-dessus de la source ou, plus largement, au-dessus de la part réservée aux justes.'
    reason: alternative_reading
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: ces trois lieux ont été faits
  rationale: Le texte porte explicitement le nombre « trois » et une forme passive de « faire ». Le contexte immédiat étant celui des cavités destinées aux morts, « lieux » explicite sobrement le référent sans transformer le verbe en « divisions ont été aménagées ».
- source_word: ይትፈለጠ / ተፈልጠ
  choice: soient séparés / un lieu a été séparé
  rationale: La répétition de la même racine est conservée par le verbe « séparer » dans les deux propositions. L’ajout de « un lieu » fournit en français un sujet intelligible au second passif tout en maintenant le caractère spatial du contexte.
- source_word: መንፈሶሙ
  choice: les esprits
  rationale: « Esprits » correspond directement au terme guèze répété et respecte l’anthropologie propre à cette vision sans la remplacer par « âmes ».
- source_word: ምዉታን
  choice: les morts
  rationale: Rendu collectif direct, naturel et non interprétatif.
- source_word: ጻድቃን
  choice: les justes
  rationale: « Les justes » est une formulation française naturelle et traditionnelle pour ceux qui sont reconnus comme droits, sans ajouter une théorie de leur justification.
- source_word: ነቅዐ ማይ
  choice: une source d’eau
  rationale: Le syntagme désigne un point d’où jaillit ou provient l’eau. « Source d’eau » conserve l’image concrète avec un français courant.
- source_word: በላዕሌሁ ብርሃን
  choice: avec de la lumière au-dessus d’elle
  rationale: Cette formulation garde la brièveté et l’image spatiale du guèze. Le pronom renvoie grammaticalement à la source, tandis qu’une note signale l’ambiguïté possible de la portée.
theological_decisions:
- issue: Désignation de ce qui subsiste des morts
  choice: les esprits des morts
  alternative: les âmes des morts
  rationale: Le choix suit le terme source et préserve le langage anthropologique de l’œuvre sans l’harmoniser avec une terminologie confessionnelle ultérieure.
- issue: Nature de ce qui est séparé pour les justes
  choice: un lieu distinct destiné aux esprits des justes
  alternative: les justes constituent eux-mêmes la troisième division
  rationale: Le contexte des cavités rend naturelle une lecture spatiale, mais la traduction évite de développer davantage la topographie que ne le fait ce verset.
- issue: Portée de la lumière
  choice: la lumière est décrite comme étant au-dessus de la source
  alternative: la lumière est au-dessus de l’ensemble du lieu réservé aux justes
  rationale: L’antécédent immédiat favorise la source, mais la syntaxe guèze demeure concise; l’autre portée est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition du verbe « séparer » reproduit la structure du guèze. « Ces trois lieux » s’appuie sur le contexte des cavités; la dernière image reste volontairement peu développée.
