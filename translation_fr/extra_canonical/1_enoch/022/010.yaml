base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: fr
  text: 'C’est ainsi qu’a été créé ce qui est destiné aux pécheurs[a][b][c] : lorsqu’ils meurent et sont ensevelis dans la terre, et que le jugement ne les a pas atteints de leur vivant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « c’est ainsi » renvoie vraisemblablement aux lieux séparés décrits juste avant pour les morts : le cas présent correspond à cette disposition.'
    reason: cross_reference
  - marker: b
    text: Littéralement, « cela fut créé ». Le verbe peut aussi se comprendre au sens de « fut aménagé » ou « fut établi » ; le nom de ce qui fut créé n’est pas répété dans ce verset.
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi ponctuer ainsi : « C’est ainsi qu’a été créé ce qui est destiné aux pécheurs lorsqu’ils meurent et sont ensevelis dans la terre, et que le jugement ne les a pas atteints de leur vivant. »'
    reason: previous_rendering
lexical_decisions:
- source_word: በከመ፡ ከማሁ
  choice: Et c’est ainsi que
  rationale: La paire de particules établit une correspondance avec la disposition décrite juste avant. Cette formulation conserve à la fois le lien logique et le renvoi au contexte.
- source_word: ተፈጥረ
  choice: cela fut créé
  rationale: Le parfait passif exprime une disposition déjà établie. « Fut créé » rend directement le verbe, tandis que « cela » reprend sans le préciser le lieu ou l’aménagement évoqué dans le contexte.
- source_word: ለኃጥኣን
  choice: pour les pécheurs
  rationale: Le datif désigne ceux auxquels cette disposition est destinée ou s’applique. « Pécheurs » est direct et convient au contexte judiciaire.
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: quand ils meurent et sont ensevelis
  rationale: La proposition temporelle et le passif sont conservés. « Ensevelis » exprime naturellement l’inhumation dans un registre digne.
- source_word: ውስተ፡ ምድር
  choice: dans la terre
  rationale: Dans ce contexte funéraire, « dans la terre » préserve l’image concrète du retour au sol sans donner à ምድር un sens géographique.
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: et que le jugement ne les a pas atteints
  rationale: Cette formulation française naturelle garde l’idée que le jugement n’est pas survenu contre eux, sans transformer explicitement « jugement » en « condamnation ».
- source_word: በሕይወቶሙ
  choice: durant leur vie
  rationale: L’expression marque le contraste entre leur existence terrestre et leur état après la mort.
theological_decisions:
- issue: Nature de la disposition posthume destinée aux pécheurs
  choice: Le verset évoque une disposition créée pour les pécheurs qui n’ont pas subi le jugement durant leur vie, sans définir plus précisément leur sort final.
  alternative: On pourrait expliciter « ce lieu fut créé » ou comprendre la phrase comme une simple description de leur mort et de leur ensevelissement.
  rationale: Le sujet de « fut créé » demeure implicite en guèze et dépend du contexte précédent. La traduction conserve ce renvoi sans imposer une doctrine particulière concernant les compartiments des morts, l’anéantissement ou l’acquittement final.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points clarifie que la proposition temporelle caractérise les pécheurs concernés, tout en laissant subsister la dépendance contextuelle du sujet implicite.
