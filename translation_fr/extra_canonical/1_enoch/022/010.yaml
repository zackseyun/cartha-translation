  rationale: La révision améliore la lisibilité du français en remplaçant le démonstratif isolé « cela » par une expression neutre qui renvoie explicitement, sans le définir, à l’élément sous-entendu par le contexte. Elle conserve la structure temporelle, le passif d’« ensevelis », la portée judiciaire de « jugement » et l’ambiguïté contextuelle du sujet créé. L’ancre de la note de ponctuation est déplacée à l’endroit auquel elle se rapporte.
