base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: fr
  text: 'Il me répondit et me dit[a] : « Voici l’esprit qui est sorti d’Abel, que son frère Qayin a tué. Il porte une accusation contre lui jusqu’à ce que sa descendance soit détruite de la face de la terre[b] et que sa descendance soit effacée du milieu de la descendance humaine. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte reçu comporte à la fois « il me répondit » et, entre crochets dans cette édition, « et me dit ». La traduction conserve les deux éléments.
    reason: textual_variant
  - marker: b
    text: Littéralement, l’expression est proche de « de devant la face de la terre » ; « de la face de la terre » en conserve l’image sous une forme française plus naturelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ
  choice: Il me répondit et me dit
  rationale: La formulation conserve les deux verbes et leur complément à la première personne, tout en restant intelligible en français. Le second membre est signalé comme textuellement incertain par une note.
- source_word: መንፈስ
  choice: esprit
  rationale: Dans cette vision du séjour des morts, le mot désigne l’esprit personnel d’Abel plutôt que le vent ou le souffle au sens physique.
- source_word: ዘወጽአ እምአቤል
  choice: qui est sorti d’Abel
  rationale: Cette formulation garde l’image concrète d’un esprit provenant d’Abel sans l’expliquer ni l’atténuer.
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: que son frère Qayin a tué
  rationale: L’ordre français identifie clairement Qayin comme le frère meurtrier. La forme « Qayin » translittère le nom attesté dans la tradition source.
- source_word: ይሰኪ ኪያሁ
  choice: Il porte accusation contre lui
  rationale: La tournure exprime une action accusatrice continue et sa portée judiciaire, plus nettement que le simple fait d’exposer un grief.
- source_word: ይትኀጐል ዘርኡ / ይማስን ዘርኡ
  choice: sa descendance soit détruite / sa descendance soit effacée
  rationale: La répétition de « descendance » reproduit celle du terme généalogique ዘር et conserve la progression des deux formules de jugement.
- source_word: እምቅድመ ገጸ ለምድር
  choice: de la face de la terre
  rationale: Cette expression française, solennelle mais compréhensible, garde l’image sémitique sans la rendre excessivement littérale.
- source_word: እምዘርአ ሰብእ
  choice: du milieu de la descendance humaine
  rationale: « Du milieu de » marque l’exclusion d’entre les lignées humaines, tandis que « descendance » maintient le vocabulaire généalogique répété.
theological_decisions:
- issue: La nature de la présence posthume d’Abel
  choice: esprit
  alternative: âme, voix, ombre
  rationale: Le guèze emploie explicitement መንፈስ. « Esprit » préserve l’anthropologie et le réalisme visionnaire du passage sans les réduire à une simple voix figurée.
- issue: La portée du jugement contre la lignée de Qayin
  choice: sa descendance soit détruite… sa descendance soit effacée
  alternative: ses descendants meurent ; sa postérité disparaît
  rationale: La répétition du vocabulaire de la descendance et les deux verbes successifs donnent au jugement une dimension collective et généalogique qu’il convient de ne pas aplanir.
- issue: La fonction de l’esprit d’Abel
  choice: Il porte accusation contre lui
  alternative: Il l’accuse ; il se plaint de lui
  rationale: Le choix maintient la tonalité judiciaire du cri posthume sans préciser davantage qui prononce finalement le jugement.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la cadence visionnaire et judiciaire du passage. « Descendance » est préféré à « semence », trop opaque aujourd’hui dans ce sens, mais sa répétition préserve le motif généalogique du guèze.
