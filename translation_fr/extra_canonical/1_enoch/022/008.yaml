base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/008.yaml
  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: fr
  text: 'Alors, je posai une question à son sujet et au sujet du jugement de tous : « Pourquoi ont-ils été séparés les uns des autres ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Alors
  rationale: Cette formule temporelle fait progresser naturellement le récit visionnaire; « Alors » est courant, digne et moins lourd que « En ce temps-là ».
- source_word: ተስእልኩ
  choice: je l’interrogeai
  rationale: Le verbe exprime l’action de demander ou de s’enquérir. Le pronom « l’ » explicite naturellement en français l’interlocuteur implicite, sans le confondre avec le sujet de l’enquête.
- source_word: በእንቲአሁ
  choice: à son sujet
  rationale: Le suffixe guèze est masculin singulier et renvoie vraisemblablement à l’esprit d’Abel mentionné juste avant; le singulier est donc conservé.
- source_word: በእንተ፡ ኵነኔ፡ ኵሉ
  choice: au sujet du jugement de tous
  rationale: « Jugement » garde le sens judiciaire large de ኵነኔ sans le réduire à une condamnation ou à un châtiment; « de tous » maintient la portée générale de ኵሉ.
- source_word: በእንተ፡ ምንት
  choice: Pourquoi
  rationale: Dans cette question, l’interrogatif demande la raison de la séparation. « Pourquoi » est direct et naturel en français moderne.
- source_word: ተፈልጡ
  choice: ont-ils été séparés
  rationale: Le passif préserve l’idée que les groupes ou lieux ont fait l’objet d’une séparation, sans préciser un agent absent du texte.
- source_word: ፩እምነ፡ ፩
  choice: les uns des autres
  rationale: C’est l’expression réciproque idiomatique en français pour une séparation mutuelle entre plusieurs entités.
theological_decisions:
- issue: Portée de « jugement de tous »
  choice: le jugement de tous
  alternative: le châtiment de tous / la sentence de tous
  rationale: Le nom guèze a une portée judiciaire qui peut inclure le châtiment sans s’y limiter. Le terme large « jugement » préserve la tension entre décision, classement et éventuelle condamnation.
- issue: Référent du suffixe singulier dans በእንቲአሁ
  choice: à son sujet
  alternative: à leur sujet
  rationale: La forme transmise porte un suffixe masculin singulier, cohérent avec l’esprit d’Abel au verset précédent. La traduction ne transforme donc pas ce référent en pluriel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation distingue l’interlocuteur implicite (« je l’interrogeai ») du sujet singulier de la question (« à son sujet »), puis de la portée collective du jugement et de la séparation.
