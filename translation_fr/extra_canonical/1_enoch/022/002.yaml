base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: fr
  text: 'Il y avait en lui quatre cavités[a], profondes, larges et très lisses. Trois d’entre elles étaient obscures, tandis qu’une était lumineuse, et de l’eau jaillissait au milieu[b]. Je dis alors : « Comme ces cavités sont lisses[c], profondes et sombres à regarder ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien est difficile en plusieurs endroits de ce verset, notamment dans la description des cavités comme « lisses ». Il peut s’agir de parois abruptes ou d’aspect poli.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi comprendre qu’une source ou un cours d’eau se trouvait au milieu de la cavité lumineuse.
    reason: alternative_reading
  - marker: c
    text: 'Le texte de cette exclamation est incertain. Autre traduction possible : « Comme ces cavités sont profondes et très lisses ! »'
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: አርባዕቱ፡ መካናት
  choice: quatre cavités
  rationale: መካናት désigne littéralement des lieux ou emplacements. Dans l’intérieur rocheux décrit par la vision, « cavités » exprime naturellement des espaces creux sans les définir comme des chambres aménagées.
- source_word: ዕሙቀ
  choice: profondes
  rationale: Le terme indique ici une profondeur physique et qualifie les cavités.
- source_word: ርኂበ
  choice: larges
  rationale: Cet adjectif constitue un trait descriptif distinct, entre « profondes » et « lisses » ; il ne faut donc pas l’absorber dans l’intensification de « lisses ».
- source_word: ልሙጸ / ልሙጽ
  choice: lisses
  rationale: Le mot peut évoquer une surface lisse, polie ou glissante. « Lisses » conserve l’image concrète tout en évitant de préciser abusivement sa cause ou son effet.
- source_word: ጥቀ
  choice: très
  rationale: L’adverbe renforce ici l’adjectif « lisses ».
- source_word: ጸልማት
  choice: obscures / sombres
  rationale: Ces termes français rendent le contraste visuel avec la cavité lumineuse ; la variation évite une répétition pesante sans modifier le sens.
- source_word: ብርህት
  choice: lumineuse
  rationale: Le mot caractérise la cavité par la lumière et s’oppose directement aux trois cavités obscures.
- source_word: ነቅዐ፡ ማይ
  choice: de l’eau jaillissait
  rationale: L’expression présente l’eau comme sortant ou surgissant, plutôt que comme une eau simplement présente et immobile.
- source_word: በማእከላ
  choice: en son milieu
  rationale: Cette formulation préserve le référent grammatical sans décider au-delà du texte s’il s’agit précisément du milieu de la cavité lumineuse ou de l’ensemble décrit.
- source_word: ለነጽሮ
  choice: à regarder
  rationale: L’infinitif exprime l’aspect que les cavités offrent à la vue du visionnaire.
theological_decisions:
- issue: Formule de parole du visionnaire après la description
  choice: Je dis
  alternative: Je vis, ou une exclamation sans formule introductive
  rationale: La tradition textuelle consultée présente la réaction à la première personne comme une parole. La conserver maintient la forme rhétorique du récit visionnaire sans réduire la phrase à une simple description.
- issue: Référent du milieu où l’eau jaillit
  choice: Conserver le pronom ambigu « son »
  alternative: Préciser « au milieu de la cavité lumineuse »
  rationale: Le contexte favorise la cavité lumineuse, mais la formulation transmise ne justifie pas de supprimer entièrement l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, narratif et digne. « Cavités » reste concret et accessible ; « en son milieu » conserve une légère élévation adaptée au récit apocalyptique. La coordination et l’exclamation reproduisent le mouvement descriptif de la vision sans lisser les difficultés du texte éthiopien.
