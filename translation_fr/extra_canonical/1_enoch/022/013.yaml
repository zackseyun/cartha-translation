  naturalness: Le français est moderne, fluide et d’un registre convenant à un texte apocalyptique. « Cela a été destiné aux âmes » est une formulation un peu soutenue, mais elle demeure naturelle dans ce contexte et évite d’ajouter explicitement « lieu » ou « demeure », que le verset isolé ne répète pas.
  terminology: « Justes », « pécheurs », « transgression » et « impies » sont cohérents avec le registre moral et judiciaire d’Hénoch. « Impies » est un bon équivalent français de አባሲያን et reste distinct de « pécheurs ».
