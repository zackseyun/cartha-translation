base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
translation:
  language: fr
  text: Et ainsi, cela a été destiné aux âmes des humains qui ne sont pas justes, mais pécheurs, entièrement livrés à la transgression ; ils seront avec les impies, comme eux.[a] Quant à leurs âmes…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin de la proposition est difficile. Elle peut signifier qu’ils seront avec les impies, qu’ils seront comme eux, ou associer les deux idées.
    reason: alternative_reading
lexical_decisions:
- source_word: ተፈጥረ
  choice: a été destiné
  rationale: Dans le contexte des lieux réservés aux morts, le verbe désigne vraisemblablement ce qui a été établi ou assigné pour ces âmes. « Destiné » exprime cette fonction tout en évitant de suggérer que les âmes elles-mêmes ont été créées à cet instant.
- source_word: ለነፍሶሙ ለሰብእ
  choice: aux âmes des humains
  rationale: La construction avec ለ indique les bénéficiaires ou destinataires. « Des humains » rend naturellement le terme générique ሰብእ en français moderne.
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  choice: qui ne sont pas justes, mais pécheurs
  rationale: Cette formulation conserve directement l'opposition morale caractéristique entre les justes et les pécheurs.
- source_word: ፍጹማነ እበሳ
  choice: entièrement livrés à la transgression
  rationale: Le premier terme intensifie le second. Cette expression française garde la force de l'idée sans recourir au tour peu naturel « parfaits dans le péché ».
- source_word: አባሲያን
  choice: les impies
  rationale: Le mot paraît désigner ceux qui se caractérisent par l'impiété ou la transgression. « Impies » maintient le registre judiciaire et apocalyptique tout en restant distinct de « pécheurs ».
- source_word: ይከውኑ ከማሆሙ
  choice: ils seront avec les impies, comme eux
  rationale: 'La formulation conserve les deux possibilités suggérées par le texte comprimé : l''association avec les impies et la ressemblance avec eux, sans imposer un châtiment plus précis.'
- source_word: ወነፍሶሙሰ
  choice: Quant à leurs âmes…
  rationale: L'enclitique -ሰ a ici une valeur topicalisante ou adversative. La phrase introduit donc un nouveau thème qui se poursuit dans le verset suivant.
theological_decisions:
- issue: Le verbe décrit-il la création ou l'assignation d'un sort posthume ?
  choice: L'assignation d'un lieu ou d'un sort aux âmes des pécheurs
  alternative: La création des âmes elles-mêmes
  rationale: Le contexte immédiat porte sur des cavités réservées aux morts et sur leurs sorts différenciés. « A été destiné » respecte ce contexte sans transformer l'énoncé en affirmation ontologique sur la création des âmes.
- issue: Sens précis de la proposition finale concernant les impies
  choice: Maintenir l'ambiguïté entre être avec eux et être comme eux
  alternative: Préciser qu'ils périront, seront punis ou deviendront semblables aux impies
  rationale: Le guèze est condensé et ne permet pas de trancher avec assurance. La traduction ne doit pas importer une doctrine particulière du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. L'inachèvement final est conservé parce que la construction se poursuit dans le verset suivant. Le marqueur [a] figure dans le texte principal.
