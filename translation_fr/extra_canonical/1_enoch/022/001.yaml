base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: fr
  text: 'De là, je me rendis dans un autre lieu, et il me montra, à l’ouest, une grande et haute montagne[a], ainsi qu’un rocher dur[b].


    [a] Le guèze attribue à la montagne deux qualités distinctes : elle est à la fois grande et haute.


    [b] On peut aussi traduire la dernière expression par « un rocher solide » ou « un rocher ferme ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le guèze attribue à la montagne deux qualités distinctes : elle est à la fois grande et haute.'
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire la dernière expression par « un rocher solide » ou « un rocher ferme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Rend naturellement la transition spatiale depuis le lieu de la vision précédente.
- source_word: ሖርኩ
  choice: je me rendis
  rationale: Exprime simplement le déplacement à la première personne dans un registre narratif digne et actuel.
- source_word: ካልአ መካነ
  choice: dans un autre lieu
  rationale: Indique un lieu différent de celui de la scène précédente sans imposer l’idée stricte d’un « deuxième » lieu.
- source_word: አርአየኒ
  choice: il me montra
  rationale: Conserve le sujet masculin implicite sans l’identifier comme un ange, puisque le verset ne le nomme pas.
- source_word: በምዕራብ
  choice: à l’ouest
  rationale: Formulation française concise correspondant à l’indication géographique.
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: une grande et haute montagne
  rationale: Préserve les deux qualités, grandeur et hauteur, dans une tournure française claire.
- source_word: ኵኵሐ ጽኑዐ
  choice: un rocher dur
  rationale: Maintient l’image physique de la dureté, tout en signalant en note les sens possibles de solidité et de fermeté.
theological_decisions:
- issue: Identification du sujet qui montre la vision
  choice: Conserver le simple pronom dans « il me montra ».
  alternative: « l’ange me montra » ou « mon guide me montra »
  rationale: Le verbe guèze indique seulement un sujet masculin à la troisième personne. Même si le contexte peut suggérer un guide angélique, le nommer ici ajouterait une précision absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions descriptives du guèze sont conservées sans archaïsme marqué; « ainsi que » évite une coordination française pesante tout en maintenant la distinction entre la montagne et le rocher.
