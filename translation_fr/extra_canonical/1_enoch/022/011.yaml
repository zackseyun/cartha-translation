base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: fr
  text: Ici, leurs âmes sont mises à part dans cette grande affliction jusqu’au grand jour du jugement, du châtiment et de l’affliction réservés à ceux qui sont maudits pour toujours[a], ainsi que de la vengeance contre leurs âmes. Là, il les liera pour toujours.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « ceux qui maudissent pour toujours ». Le sens passif, « ceux qui sont maudits », convient mieux au contexte du jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Une proposition placée entre crochets dans le témoin ajoute : « et cela [était] dès avant le monde ». Le texte est incertain et n’est pas retenu dans la traduction principale.'
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈለጠ
  choice: sont mises à part
  rationale: Le passif exprime la séparation ou l’assignation à un lieu ou à un état distinct; « mises à part » conserve à la fois la nuance spatiale et judiciaire.
- source_word: ነፍሳቲሆሙ
  choice: leurs âmes
  rationale: Dans ce contexte où les morts attendent le jugement, « âmes » désigne naturellement les personnes désincarnées.
- source_word: ዐቢይ ጻዕር
  choice: cette grande affliction
  rationale: Le terme peut désigner la douleur, la détresse ou le tourment. « Affliction » préserve la réalité de la souffrance sans préciser excessivement sa nature.
- source_word: ኵነኔ
  choice: jugement
  rationale: Ce terme judiciaire, associé ici au châtiment, est rendu de la manière la plus large et transparente par « jugement ».
- source_word: መቅሠፍት
  choice: châtiment
  rationale: Bien que le mot puisse évoquer un coup ou un fléau, le contexte judiciaire et apocalyptique appelle ici « châtiment ».
- source_word: ይረግሙ
  choice: sont maudits
  rationale: La forme peut être comprise activement ou passivement. Le passif convient mieux à l’énumération des conséquences judiciaires, mais l’ambiguïté est signalée en note.
- source_word: በቀል ለነፍሶሙ
  choice: la vengeance exercée contre leurs âmes
  rationale: Il s’agit grammaticalement d’un groupe nominal coordonné aux éléments précédents, non d’une nouvelle proposition verbale. « Exercée contre » rend idiomatiquement la relation sans ajouter un sujet absent.
- source_word: ይእስሮሙ
  choice: il les enchaînera
  rationale: Le verbe concret évoque le fait de lier ou d’emprisonner. « Enchaînera » préserve la vigueur de l’image apocalyptique.
- source_word: እስከ ለዓለም
  choice: pour toujours
  rationale: Cette formule exprime une durée continue et solennelle; « pour toujours » est naturel en français moderne.
theological_decisions:
- issue: Les âmes sont-elles seulement séparées ou subissent-elles déjà une souffrance avant le jugement final ?
  choice: « mises à part dans cette grande affliction […] jusqu’au grand jour du jugement »
  alternative: Comprendre soit une détention neutre dans l’attente du jugement, soit un tourment préjudiciaire pleinement punitif.
  rationale: Le guèze associe explicitement séparation et affliction. La traduction maintient cette tension sans définir davantage la nature ou le degré de la souffrance présente.
- issue: Sens actif ou passif de ይረግሙ
  choice: « ceux qui sont maudits pour toujours »
  alternative: « ceux qui maudissent pour toujours »
  rationale: Le passif s’accorde mieux avec le contexte du jugement subi, mais la morphologie ou la tradition textuelle permet une compréhension active, conservée en note.
- issue: Identité du sujet de « il les enchaînera »
  choice: Maintien du pronom indéfini contextuel « il »
  alternative: Expliciter « Dieu » ou employer le passif « ils seront enchaînés »
  rationale: Le verbe indique un agent singulier sans le nommer dans ce verset. Le pronom respecte cette réserve et évite une explicitation théologique ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la longue énumération judiciaire du guèze tout en la clarifiant par « réservés à » et « ainsi que ». « Enchaînera » garde l’image concrète du texte source.
