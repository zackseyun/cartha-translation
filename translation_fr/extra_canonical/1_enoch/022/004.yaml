base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: fr
  text: Et ces lieux ont été faits[a] pour qu’ils y demeurent jusqu’au jour de leur jugement et jusqu’au terme qui leur est fixé[b] — et ce terme est grand[c] —, jusqu’au temps du grand jugement sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme éthiopienne rendue par « ont été faits » est textuellement incertaine. Le sens général de la proposition est que ces lieux leur sont destinés pour qu’ils y demeurent jusqu’au jugement.
    reason: textual_variant
  - marker: b
    text: Le terme traduit par « terme qui leur est fixé » peut aussi signifier « âge », « durée de vie » ou « période ». Il paraît désigner ici le temps qui leur est assigné avant le jugement final.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et ce terme est grand ». L’adjectif peut ici évoquer une longue durée, mais aussi la grandeur ou l’importance de cette période.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: መካናት
  choice: lieux
  rationale: Le terme désigne des lieux ou des demeures. « Lieux » reste sobre et convient à la topographie visionnaire du passage.
- source_word: †ገብሩ†
  choice: ont été aménagés
  rationale: La forme signalée est textuellement incertaine, mais elle semble exprimer que ces lieux ont été faits ou préparés pour leurs occupants. « Ont été aménagés » rend cette idée sans préciser un agent absent du texte.
- source_word: ይነብርዎሙ
  choice: qu’ils y demeurent
  rationale: Le verbe exprime l’action d’habiter ou de rester durablement. « Demeurer » conserve ce double relief dans un registre digne et naturel.
- source_word: እስከ ዕለተ ኵነኔሆሙ
  choice: jusqu’au jour de leur jugement
  rationale: « Jugement » préserve la portée judiciaire du terme sans la réduire d’avance à la condamnation.
- source_word: አመ ዕድሜሆሙ
  choice: jusqu’au terme qui leur est fixé
  rationale: ዕድሜ peut désigner l’âge, la durée de vie ou une période déterminée. Dans ce contexte eschatologique, « terme qui leur est fixé » exprime naturellement une échéance assignée.
- source_word: ዘየዓቢ
  choice: ce terme sera long
  rationale: L’adjectif signifie littéralement « grand », mais appliqué à une période il peut exprimer une longue durée. La note conserve l’autre lecture possible.
- source_word: እስከ አመ ኵነኔ ዐቢይ በላዕሌሆሙ
  choice: jusqu’au temps du grand jugement qui les frappera
  rationale: « Au temps du » restitue አመ, tandis que « qui les frappera » rend idiomatiquement l’idée du jugement dirigé contre eux, exprimée par « sur eux ».
theological_decisions:
- issue: Faut-il rendre ኵነኔ par « jugement » ou par « condamnation » ?
  choice: jugement
  alternative: condamnation
  rationale: Le contexte est judiciaire et eschatologique, mais le lexème ne contraint pas ici à annoncer expressément le verdict. « Jugement » préserve donc la tension du texte.
- issue: Comment comprendre la grandeur du terme fixé ?
  choice: une longue durée
  alternative: un terme grand ou considérable
  rationale: Dans son rapport à une période, l’adjectif se comprend naturellement comme une indication de durée. Une note signale toutefois que le texte dit littéralement « grand » et peut laisser ouverte une nuance de grandeur ou d’importance.
translation_notes:
  register: Français international moderne, clair et solennel. La formulation conserve la répétition temporelle et le mouvement culminant du texte apocalyptique, tout en explicitant seulement ce qu’exige une syntaxe française naturelle.
