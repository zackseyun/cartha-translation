  terminology: « Lieux », « demeurent », « jugement » et « terme qui leur est fixé » sont appropriés. « Grand » doit être maintenu dans le texte afin de ne pas trancher entre durée et grandeur/importance; la note peut expliciter la possible nuance temporelle.
