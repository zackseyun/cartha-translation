  naturalness: Le français est globalement naturel et de registre narratif soutenu. « Ont été créés » restitue plus exactement le verbe de création que « ont été aménagés ». « Afin d’y rassembler » rend avec plus de fluidité la finalité du dernier membre sans attribuer trop explicitement l’action aux lieux eux-mêmes.
  terminology: « Saints anges », « esprits » et « âmes des morts » sont appropriés. L’apposition conserve prudemment le double vocabulaire anthropologique sans lui imposer de distinction doctrinale. « Êtres humains » est un équivalent moderne recevable de l’expression idiomatique « enfants des hommes », explicitée en note.
