base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: fr
  text: 'À ce moment-là, Raphaël, l’un des saints anges qui était avec moi, me répondit : « Ces beaux lieux[a] ont été créés afin que les esprits — les âmes des morts[b] — y soient rassemblés. C’est dans ce but qu’ils ont été créés ici : afin d’y rassembler toutes les âmes des êtres humains[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transmis porte « beaux lieux » ou « bons lieux ». Le grec conservé lit « lieux creux », leçon qui correspond aux cavités décrites dans le contexte.
    reason: textual_variant
  - marker: b
    text: Le texte emploie à la fois « esprits » et « âmes » ; « les âmes des morts » précise probablement ici de quels esprits il s’agit.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « toutes les âmes des enfants des hommes ».'
    reason: literal_rendering
lexical_decisions:
- source_word: አውሥአ … ወይቤለኒ
  choice: me répondit
  rationale: Le verbe introduit une réponse dans un dialogue. En français, « me répondit » restitue naturellement l’ensemble « répondit et me dit » sans lourdeur.
- source_word: ቅዱሳን መላእክት
  choice: saints anges
  rationale: Expression apocalyptique consacrée, qui conserve la portée théologique de la sainteté.
- source_word: ዝመካናት ሰናያት
  choice: ces lieux creux
  rationale: Le guèze transmis signifie littéralement « ces beaux/bons lieux », mais « creux » suit la leçon grecque κοῖλοι, cohérente avec les cavités du contexte. L’écart textuel est signalé en note.
- source_word: ይትጋብኡ ዲቤሆን
  choice: y soient rassemblés
  rationale: Rend le mouvement passif vers les lieux désignés, dans un français idiomatique.
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: les esprits — les âmes des morts —
  rationale: Conserve les deux termes anthropologiques du guèze et les présente en apposition, sans imposer une distinction ontologique entre eux.
- source_word: ሎቱ ዝንቱ ተፈጥሩ ዝየ
  choice: C’est dans ce but qu’ils ont été créés ici
  rationale: Restitue la finalité explicite et le verbe de création, tout en gardant l’indication locale « ici ».
- source_word: ያስተጋብኡ
  choice: pour recueillir
  rationale: Le causatif exprime l’action de réunir ou de faire venir ensemble; « recueillir » convient à des lieux destinés à recevoir les morts.
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: toutes les âmes des êtres humains
  rationale: Rend clairement la portée collective de l’expression ancienne « enfants des hommes » dans un français moderne.
theological_decisions:
- issue: Rapport entre les « esprits » et les « âmes des morts »
  choice: Conserver les deux expressions en apposition
  alternative: Les distinguer comme deux catégories, ou n’en garder qu’une
  rationale: La syntaxe permet de comprendre « les âmes des morts » comme une précision de « les esprits ». La ponctuation préserve cette lecture probable sans effacer le double vocabulaire du texte.
- issue: Leçon « creux » ou « beaux/bons »
  choice: Retenir « lieux creux » dans le texte avec une note sur la forme guèze
  alternative: Traduire strictement le guèze transmis par « beaux lieux » ou « bons lieux »
  rationale: Le témoin guèze porte ሰናያት, « beaux/bons », tandis que le grec conservé lit κοῖλοι, « creux ». Le contexte immédiat de cavités destinées aux morts soutient fortement « creux », mais l’ambiguïté de la transmission doit rester visible.
- issue: Portée de « enfants des hommes »
  choice: Traduire par « êtres humains »
  alternative: Conserver « enfants des hommes »
  rationale: « Êtres humains » communique naturellement la portée universelle en français actuel sans introduire une restriction de genre; la tournure ancienne est indiquée en note.
translation_notes:
  register: Français international moderne, digne et narratif. La formulation évite l’archaïsme de « enfants des hommes » dans le corps du texte, tout en le conservant en note. Les tirets marquent clairement l’apposition anthropologique sans résoudre davantage le rapport entre « esprits » et « âmes ».
