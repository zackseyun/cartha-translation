base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/005.yaml
  text: And I saw the spirits of the children of men who were dead[b][a], and their voice reached to heaven and cried out.
translation:
  language: fr
  text: Je vis les esprits des êtres humains qui étaient morts, et leur voix monta jusqu’au ciel et cria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porta plainte », « adressa une requête » ou « accusa ». Le dernier verbe est difficile et peut désigner un appel demandant justice plutôt qu’un simple cri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: Je vis
  rationale: Rend simplement le verbe visionnaire à la première personne, dans un registre narratif digne et naturel.
- source_word: መናፍስተ
  choice: les esprits
  rationale: Conserve le terme anthropologique du texte sans l’interpréter comme « âmes ».
- source_word: ውሉደ ሰብእ
  choice: des êtres humains
  rationale: Exprime naturellement en français moderne la désignation collective littérale « enfants des hommes », sans évoquer par inadvertance le titre « Fils de l’homme ».
- source_word: እንዘ ሙታን ውእቶሙ
  choice: qui étaient morts
  rationale: Préserve explicitement l’état de mort tout en donnant une relative française fluide.
- source_word: ቃሎሙ
  choice: leur voix
  rationale: Maintient le sens premier de « voix » plutôt que d’anticiper dans ce nom la nuance de plainte.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: monta jusqu’au ciel
  rationale: Rend l’arrivée de la voix au ciel et explicite naturellement le mouvement ascendant impliqué par l’image.
- source_word: ወይስኪ
  choice: cria
  rationale: Choix relativement neutre qui garde l’intensité de l’appel; la nuance possible de plainte, requête ou accusation est signalée en note.
theological_decisions:
- issue: Nature de la parole des morts qui monte vers le ciel
  choice: Le texte présente les morts comme des esprits dont la voix atteint le ciel dans un cri.
  alternative: Comprendre ce cri plus précisément comme une plainte, une requête ou une accusation.
  rationale: La traduction conserve la scène apocalyptique et judiciaire sans transformer l’expression en affirmation doctrinale plus développée sur l’état intermédiaire ni trancher la valeur exacte du dernier verbe.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « êtres humains » privilégie l’intelligibilité actuelle, tandis que « les esprits » et « jusqu’au ciel » conservent le relief apocalyptique. Le marqueur [a] figure immédiatement après le mot concerné.
