base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: fr
  text: 'Alors, j’interrogeai Raphaël, l’ange qui était avec moi, et je lui dis : « À qui appartient cet esprit dont la voix se fait ainsi entendre et qui accuse[a] ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « implore » ou « présente une requête ». Le verbe peut évoquer une plainte ou un appel pressant, mais le contexte lui donne ici une portée accusatrice.
    reason: lexical_alternative
  - marker: b
    text: Le verset suivant identifie cet esprit comme celui d’Abel, qui porte plainte contre Caïn.
    reason: cross_reference
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: Alors
  rationale: Cette formule temporelle introduit naturellement la question dans un récit français moderne, sans alourdir la phrase.
- source_word: ተስእልክዎ
  choice: j’interrogeai
  rationale: Le verbe introduit une demande adressée à l’ange interprète. « Interroger » convient au registre narratif soutenu et évite la répétition de « demander… dire ».
- source_word: ለሩፋኤል፡ መልአክ
  choice: Raphaël, l’ange
  rationale: Le nom propre est translittéré sous sa forme française usuelle et le titre est conservé en apposition, conformément à l’ordre du guèze.
- source_word: እንዘ፡ ሀሎ፡ ምስሌየ
  choice: qui était avec moi
  rationale: Rend clairement et naturellement la construction qui présente Raphaël comme le guide alors présent auprès d’Hénoch.
- source_word: ዝመንፈስ
  choice: cet esprit
  rationale: « Esprit » est le sens direct du terme dans cette scène concernant les morts et ne lui impose pas une anthropologie plus précise.
- source_word: ዘመኑ፡ ውእቱ
  choice: À qui appartient cet esprit
  rationale: Formulation française naturelle de la question d’identité ou d’appartenance exprimée par la construction génitivale.
- source_word: ዘከመዝ፡ ቃሉ፡ ይበጽሕ
  choice: dont la voix s’élève ainsi
  rationale: « Voix » convient mieux que « parole » puisqu’un cri est entendu. « S’élève » rend idiomatiquement l’idée d’une voix qui parvient jusqu’à l’auditeur.
- source_word: ወይሰኪ
  choice: et accuse
  rationale: Le verbe possède ici une valeur judiciaire de plainte ou d’accusation, cohérente avec le cri d’Abel contre Caïn et avec sa répétition dans le contexte.
theological_decisions:
- issue: Faut-il traduire መንፈስ par « esprit » ou par « âme » dans cette scène du séjour des morts ?
  choice: esprit
  alternative: âme
  rationale: « Esprit » suit le sens lexical immédiat et préserve l’indétermination anthropologique du texte au lieu de préciser la nature du mort selon un système ultérieur.
- issue: Quelle valeur donner au dernier verbe décrivant le cri ?
  choice: accuse
  alternative: implore / présente une requête
  rationale: Le contexte d’Abel criant contre Caïn et la répétition du même verbe dans les versets voisins favorisent la nuance judiciaire. Une note conserve néanmoins l’autre possibilité lexicale sans effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif littéraire du passage sans archaïsme marqué. La formulation conserve le caractère judiciaire du cri tout en signalant en note l’ambiguïté du dernier verbe.
