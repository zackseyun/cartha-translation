  text: And on the great day of judgment he shall be sent away into the fire[a][b].
translation:
  language: fr
  text: Et au grand jour du jugement, il sera envoyé dans le feu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En guèze, le sujet est au singulier (« il sera envoyé ») et renvoie au personnage dont il est question dans le contexte immédiat.
    reason: cross_reference
  - marker: b
    text: « Grand jour du jugement » est ici une formule apocalyptique. Le mot traduit par « jugement » peut aussi, dans un sens judiciaire plus étroit, désigner la « sentence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለት
  choice: au … jour
  rationale: Avec ዕለት, la préposition situe naturellement l’action dans le temps. « Au … jour » convient à la formule apocalyptique française.
- source_word: ዓባይ
  choice: grand
  rationale: L’adjectif qualifie et intensifie le jour du jugement sans ajouter d’interprétation.
- source_word: ኵነኔ
  choice: jugement
  rationale: Le nom peut désigner le jugement ou, plus étroitement, la sentence. Ici, « jugement » conserve la portée ample de la scène apocalyptique.
- source_word: ይትፈኖ
  choice: il sera envoyé
  rationale: La forme passive à sujet singulier exprime l’action d’envoyer ou de livrer à une destination. « Sera envoyé » respecte cette valeur sans introduire l’image plus précise de quelqu’un qui serait jeté.
- source_word: ውስተ
  choice: dans
  rationale: Après un verbe de mouvement, la préposition indique l’entrée dans une destination. En français, « envoyé dans le feu » exprime naturellement ce mouvement.
- source_word: ዋዕይ
  choice: le feu
  rationale: Le terme désigne concrètement le feu; cette image apocalyptique doit être conservée plutôt que remplacée par une abstraction comme « châtiment ».
theological_decisions:
- issue: Conserver l’image concrète du lieu de jugement ou l’abstraire en châtiment
  choice: dans le feu
  alternative: dans le châtiment
  rationale: Le guèze emploie le nom concret « feu ». La traduction préserve donc l’image apocalyptique et n’en réduit pas la portée à une formulation doctrinale abstraite.
- issue: Portée de ኵነኔ dans la formule temporelle
  choice: jour du jugement
  alternative: jour de la sentence
  rationale: « Jugement » peut englober à la fois l’acte judiciaire et son verdict, ce qui préserve l’amplitude sémantique du terme dans ce contexte.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche du guèze tout en étant naturelle; les images et les ambiguïtés pertinentes sont conservées.
