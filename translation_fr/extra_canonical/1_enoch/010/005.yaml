base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: fr
  text: Entasse sur lui des pierres rugueuses et tranchantes[a], et couvre-le de ténèbres. Là, il restera pour toujours[b]. Couvre son visage afin qu’il ne voie pas la lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux qualificatifs se rapportent aux mêmes pierres et renforcent leur caractère hostile ; on pourrait aussi traduire « des pierres raboteuses et acérées ».
    reason: lexical_alternative
  - marker: b
    text: Le visage couvert et l’impossibilité de voir la lumière développent l’image concrète d’un enfermement total.
    reason: cultural_note
lexical_decisions:
- source_word: ደይ
  choice: Entasse
  rationale: L’impératif décrit l’amoncellement de pierres sur le condamné; « entasse » rend naturellement cette action punitive.
- source_word: እብነ ጠያያተ ወበሊሓተ
  choice: des pierres rugueuses et tranchantes
  rationale: Un seul nom est qualifié par deux termes coordonnés. « Rugueuses et tranchantes » conserve leur caractère dur et blessant sans suggérer deux catégories distinctes.
- source_word: ክድኖ
  choice: couvre-le / Couvre-lui le visage
  rationale: La répétition du verbe est maintenue. La seconde construction est adaptée à l’usage idiomatique français avec « visage ».
- source_word: ጽልመተ
  choice: ténèbres
  rationale: « Ténèbres » garde la force de l’image apocalyptique tout en restant une expression française courante et digne.
- source_word: ይኅድር ለዓለም
  choice: il restera pour toujours
  rationale: Dans ce contexte d’enfermement, « restera » convient mieux que « habitera » et préserve la durée indéfinie exprimée par le texte.
- source_word: ለገጹ
  choice: le visage
  rationale: La lecture concrète « son visage » s’accorde avec la proposition suivante, qui précise qu’il ne doit pas voir la lumière.
- source_word: ከመ ኢይርአይ ብርሃነ
  choice: afin qu’il ne voie pas la lumière
  rationale: Cette formulation conserve la valeur finale de la proposition et l’image directe de la privation de lumière.
theological_decisions:
- issue: Nature des images de châtiment
  choice: Conserver l’amoncellement matériel de pierres, les ténèbres, le visage couvert et la privation de lumière comme images concrètes d’un enfermement total.
  alternative: Paraphraser comme une souffrance métaphorique ou un emprisonnement général.
  rationale: Le guèze enchaîne des ordres concrets. Les rendre littéralement préserve la sévérité et la tension de l’imagerie apocalyptique sans lui imposer une interprétation doctrinale.
- issue: Durée exprimée par ለዓለም
  choice: pour toujours
  alternative: pour une époque / durant un âge
  rationale: Dans cette formule guèze et ce contexte, « pour toujours » transmet le sens temporel attendu, sans ajouter de précision sur la nature métaphysique du châtiment.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe directe correspondant à la succession des impératifs du guèze; maintien de la répétition de « couvrir » et de l’imagerie apocalyptique concrète.
