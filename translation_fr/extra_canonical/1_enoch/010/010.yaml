base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: fr
  text: Et ce qu’ils te demandent ne sera pas accordé à leurs pères en leur faveur[a] ; car ils espèrent vivre éternellement, et chacun d’eux vivra cinq cents ans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze est condensée : le pronom rendu par « en leur faveur » peut renvoyer aux pères ou aux demandeurs.'
    reason: ambiguity_note
  - marker: b
    text: 'Littéralement : « cinq cents hivers », expression qui désigne ici cinq cents ans.'
    reason: cultural_note
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: ce qu’ils te demandent
  rationale: Le relatif introduit l’objet de la demande, et le suffixe de deuxième personne désigne celui à qui elle est adressée.
- source_word: ኢይከውኑ ለአበዊሆሙ
  choice: ne sera pas accordé à leurs pères
  rationale: Avec la préposition ለ, le verbe « être/devenir » exprime ici ce qui échoit ou est accordé à quelqu’un ; le singulier français reprend collectivement « ce qu’ils demandent ».
- source_word: በእንቲአሆሙ
  choice: en leur faveur
  rationale: La locution signifie « pour eux, en leur faveur » ; le pronom demeure syntaxiquement comprimé dans le guèze.
- source_word: ይሴፈዉ
  choice: ils espèrent
  rationale: Le verbe signifie espérer ou s’attendre à, et non être retranché.
- source_word: ይኅየዉ ሕይወተ ዘለዓለም
  choice: vivre d’une vie éternelle
  rationale: Cette formulation conserve l’expression littérale « vivre une vie éternelle » sans la transformer en formule doctrinale figée.
- source_word: አሐዱ አሐዱ እምኔሆሙ
  choice: chacun d’eux
  rationale: La répétition de « un » possède une valeur distributive.
- source_word: ኃምስተ ምእተ ክረምተ
  choice: cinq cents ans
  rationale: Le texte dit littéralement « cinq cents hivers », idiome servant à compter les années.
theological_decisions:
- issue: Rapport entre l’espérance d’une vie éternelle et la durée de cinq cents ans
  choice: Conserver le contraste entre leur espérance et la durée effectivement annoncée
  alternative: Coordonner simplement les deux propositions par « et », ce qui pourrait les faire paraître compatibles ou cumulatives
  rationale: Le texte affirme qu’ils espèrent vivre éternellement, puis annonce que chacun vivra cinq cents ans. « Alors que » rend perceptible cette tension sans préciser davantage son explication théologique.
- issue: Référent des pronoms dans la demande faite en faveur d’un autre groupe
  choice: Garder la formulation pronominale comprimée « à leurs pères en leur faveur »
  alternative: Identifier explicitement les demandeurs comme les descendants ou les Veilleurs
  rationale: Le verset isolé ne nomme pas directement les groupes concernés ; les expliciter importerait le contexte interprétatif dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur simple rend l’annonce, tandis que « espèrent » préserve exactement la valeur du verbe guèze. La ponctuation et « alors que » mettent en lumière, sans la résoudre, la tension entre l’espérance d’une vie éternelle et la limite de cinq cents ans.
