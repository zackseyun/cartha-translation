base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: fr
  text: En ces jours-là, on les conduira dans l’abîme de feu[a], dans le tourment et dans la maison de détention[b] ; ils seront enfermés pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression signifie littéralement un lieu inférieur ou profond de feu ; on pourrait aussi traduire « la profondeur de feu » ou « l’abîme ardent ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « maison d’enfermement » ; l’expression conserve l’image concrète d’un lieu où l’on est détenu.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: jours
  rationale: Dans la formule apocalyptique በውእቱ መዋዕል, « en ces jours-là » rend naturellement l’expression temporelle consacrée.
- source_word: ይወስድዎሙ
  choice: on les conduira
  rationale: Le verbe exprime l’action de prendre ou de mener. Le sujet pluriel n’étant pas identifié dans le verset, le pronom indéfini français évite de préciser les agents.
- source_word: መትሕተ እሳት
  choice: l’abîme de feu
  rationale: L’expression évoque littéralement un lieu inférieur ou profond associé au feu. « Abîme de feu » conserve cette image apocalyptique sans introduire le terme doctrinal « enfer ».
- source_word: በጻዕር
  choice: dans le tourment
  rationale: Le nom désigne la détresse ou une souffrance pénible ; « tourment » convient au contexte punitif.
- source_word: ቤት ሞቅሕ
  choice: la maison de détention
  rationale: Traduction concrète de « maison d’enfermement/de détention », qui préserve l’image du texte tout en restant intelligible en français moderne.
- source_word: ይትዓፀዉ
  choice: ils y seront enfermés
  rationale: Le verbe exprime le fait d’être clos ou détenu. L’ajout de « y » relie naturellement l’enfermement au lieu qui vient d’être mentionné.
- source_word: ለዓለም
  choice: pour toujours
  rationale: Dans cette scène de jugement, l’expression indique une durée indéfiniment prolongée et se rend idiomatiquement par « pour toujours ».
theological_decisions:
- issue: Désignation du lieu de feu
  choice: l’abîme de feu
  alternative: l’enfer
  rationale: Le guèze emploie une image spatiale, non un terme doctrinal technique. La traduction conserve donc l’image sans importer une terminologie théologique postérieure.
- issue: Durée de l’enfermement
  choice: pour toujours
  alternative: pour l’âge
  rationale: Dans ce contexte punitif, ለዓለም exprime le plus naturellement une durée permanente. La traduction maintient la force du jugement tout en signalant l’alternative littérale en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme de la scène de jugement ainsi que son imagerie concrète, sans employer le terme théologique plus déterminé « enfer ».
