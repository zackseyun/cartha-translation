base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: fr
  text: Et lorsque tous leurs fils se seront entretués, et qu’ils auront vu la destruction de ceux qui leur sont chers, lie-les pour soixante-dix générations sous les collines de la terre[a], jusqu’au jour de leur jugement et de leur achèvement[b], jusqu’à ce que s’accomplisse le jugement pour toute l’éternité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous les montagnes de la terre ». Le terme guèze peut désigner des collines ou des montagnes.
    reason: lexical_alternative
  - marker: b
    text: « Leur achèvement » peut aussi se comprendre comme « leur fin » ou « leur accomplissement final ».
    reason: lexical_alternative
  - marker: c
    text: La formule finale insiste fortement sur l’éternité; elle signifie littéralement quelque chose comme « le jugement de l’âge d’éternité » ou « des âges éternels ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: se seront entretués
  rationale: La forme réciproque, dans le contexte de la destruction mutuelle des géants, évoque un affrontement mortel plutôt qu’une simple querelle.
- source_word: ሐጕሎሙ ለፍቁራኒሆሙ
  choice: la destruction de ceux qui leur sont chers
  rationale: Cette formulation conserve à la fois l’idée de ruine ou de destruction et la dimension affective du texte, dans un français naturel.
- source_word: እሰሮሙ
  choice: lie-les
  rationale: L’impératif concret préserve l’image physique de l’enchaînement propre au récit des Veilleurs.
- source_word: ለ፸ ትውልድ
  choice: pour soixante-dix générations
  rationale: Traduction directe de la période apocalyptique indiquée par le texte.
- source_word: በመትሕተ አውግርተ ምድር
  choice: sous les collines de la terre
  rationale: Rend directement le lieu souterrain de leur détention; le nom peut aussi désigner des montagnes.
- source_word: ዕለተ ኵነኔሆሙ
  choice: le jour de leur jugement
  rationale: « Jugement » conserve la portée judiciaire sans réduire le terme à la seule condamnation.
- source_word: ተፍጻሜቶሙ
  choice: leur achèvement
  rationale: Le mot peut désigner une fin ou un accomplissement. « Achèvement » maintient cette amplitude sans préciser indûment la nature de l’issue finale.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: le jugement pour toute l’éternité
  rationale: Cette formulation française lisible conserve la force de la formule emphatique d’éternité.
theological_decisions:
- issue: Les fils se combattent-ils seulement, ou se tuent-ils mutuellement?
  choice: Ils se seront entretués.
  alternative: Ils se seront combattus ou détruits les uns les autres.
  rationale: Le contexte immédiat décrit la destruction violente et réciproque de la descendance des Veilleurs; « s’entretuer » en exprime clairement la gravité.
- issue: Sens de « leur achèvement »
  choice: Conserver un terme ouvert pouvant évoquer leur fin ou l’accomplissement du jugement.
  alternative: Traduire explicitement par « leur fin » ou « leur châtiment final ».
  rationale: Le terme source n’impose pas de trancher entre fin, accomplissement et issue judiciaire; la traduction préserve cette tension eschatologique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe solennelle du jugement apocalyptique est conservée, tandis que « ceux qui leur sont chers » évite une tournure artificielle. Les ambiguïtés de « collines/montagnes » et d’« achèvement/fin » sont signalées sans être résolues dans le corps du texte.
