base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: fr
  text: 'Puis le Seigneur dit à Gabriel : « Marche contre les bâtards[a], les réprouvés et les enfants de la fornication. Détruis les enfants de la fornication et les enfants des Veilleurs d’entre les humains[b]. Envoie-les les uns contre les autres[c], et qu’ils périssent au combat[d], car une longue vie ne leur sera pas accordée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants illégitimes ». Le terme guèze est une désignation dure et stigmatisante de descendants issus d’une union illicite.
    reason: lexical_alternative
  - marker: b
    text: La leçon traduite par « les enfants des Veilleurs » est difficile dans le témoin disponible. Le contexte des Veilleurs appuie ce sens, mais une incertitude textuelle demeure.
    reason: textual_variant
  - marker: c
    text: Le témoin présente ici entre crochets un verbe supplémentaire pouvant être rendu par « envoie-les ». Malgré l’incertitude sur la suite verbale exacte, l’affrontement réciproque est clair.
    reason: textual_variant
  - marker: d
    text: On pourrait aussi traduire « qu’ils soient détruits au combat ». Le contexte implique une destruction mutuelle, mais le verbe guèze lui-même est passif ou intransitif.
    reason: grammar
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  choice: Puis le Seigneur dit à Gabriel
  rationale: Rend naturellement en français l’ordre des constituants tout en identifiant እግዚእ comme le Seigneur, auteur du commandement judiciaire.
- source_word: ሑር፡ ዲቤሆሙ፡
  choice: Marche contre
  rationale: Dans ce contexte de jugement, le mouvement est hostile. « Marche contre » conserve cette force mieux qu’un simple « va vers ».
- source_word: ለመንዝራን፡
  choice: les bâtards
  rationale: Le terme désigne durement les descendants d’une union illicite. Le choix français préserve cette violence rhétorique, tandis qu’une note signale une formulation moins offensante.
- source_word: ወለማኑናን፡
  choice: les réprouvés
  rationale: Le mot, difficile à préciser, qualifie ici des êtres voués au rejet et au jugement. « Réprouvés » conserve cette valeur sans élargir le propos à l’humanité en général.
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  choice: et les enfants de la débauche
  rationale: Cette expression garde ensemble l’idée de transgression sexuelle et celle de descendance. « Débauche » est ici plus naturel en français courant que « fornication », tout en restant fortement réprobateur.
- source_word: ወአኅጕሎሙ፡
  choice: Fais disparaître
  rationale: Le verbe exprime l’anéantissement. Cette tournure française est ferme et claire sans atténuer la sentence.
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  choice: les enfants des Veilleurs du milieu des humains
  rationale: « Veilleurs » est le terme consacré par le contexte immédiat de 1 Hénoch. La formulation conserve l’association de leur descendance avec le monde humain, tout en signalant l’incertitude textuelle en note.
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  choice: Dresse-les les uns contre les autres
  rationale: La tournure exprime clairement l’affrontement réciproque commandé par le texte. Une note rend compte de l’élément verbal transmis entre crochets.
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  choice: et qu’ils périssent au combat
  rationale: 'Le verbe guèze est passif ou intransitif : « périssent » respecte mieux sa voix grammaticale qu’une formulation active telle que « qu’ils s’entre-tuent », même si le contexte implique une destruction mutuelle.'
- source_word: እስመ፡ ኑሐ፡ መዋዕል፡ አልቦሙ።
  choice: car une longue vie ne leur sera pas accordée
  rationale: Cette formulation naturelle et solennelle conserve l’idée littérale d’une « longueur de jours » refusée à ceux qui sont jugés.
theological_decisions:
- issue: Identité des êtres visés par le jugement
  choice: Le commandement vise la descendance issue des unions illicites liées aux Veilleurs.
  alternative: Comprendre la sentence comme visant soit uniquement les géants, soit les pécheurs humains en général.
  rationale: L’enchaînement des désignations généalogiques et la mention explicite des Veilleurs rattachent le jugement à leur descendance, sans autoriser à l’étendre à toute l’humanité.
- issue: Force du langage généalogique condamnant les êtres visés
  choice: Conserver dans le texte principal le terme dur « bâtards ».
  alternative: Employer seulement une expression adoucie comme « enfants illégitimes ».
  rationale: Le passage est un oracle de jugement apocalyptique dont la violence verbale appartient au sens. La note fournit néanmoins une solution moins stigmatisante.
- issue: Nature de leur destruction au combat
  choice: Employer la forme intransitive « qu’ils périssent », tout en laissant le contexte indiquer leur affrontement mutuel.
  alternative: Expliciter « qu’ils s’entre-tuent » ou « qu’ils se détruisent mutuellement ».
  rationale: La solution retenue respecte la voix du verbe guèze et évite de transformer une implication contextuelle en précision grammaticale explicite.
translation_notes:
  register: Français international moderne, digne et lisible. Le style conserve la solennité d’un ordre divin de jugement et la dureté du vocabulaire source, sans archaïsmes inutiles. « Veilleurs » est maintenu comme terme propre au récit de 1 Hénoch.
