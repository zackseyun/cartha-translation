base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/003.yaml
  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
translation:
  language: fr
  text: Et maintenant, instruis-le afin qu’il s’enfuie et que sa descendance subsiste[a] pour toutes les générations, à jamais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa semence restera »; on peut aussi traduire « sa descendance survivra ». Le texte guèze transmis dans cette édition semble comporter ici une erreur de transcription; la lecture corrigée est appuyée par la grammaire et par le grec « demeurera ».
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « pour toutes les générations de l’éternité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮ
  choice: fais-lui savoir
  rationale: Cette formulation naturelle conserve l’idée de communiquer une instruction urgente sans préciser davantage qu’il s’agit d’un avertissement.
- source_word: ይጐይዝ
  choice: qu’il doit s’enfuir
  rationale: Le contexte du jugement imminent appelle un départ pour échapper au danger; « s’enfuir » en exprime clairement l’urgence.
- source_word: ይተርፍ (lecture corrigée probable du texte transmis ይገበር)
  choice: subsistera
  rationale: La révision philologique signale une probable erreur de transcription et identifie un verbe intransitif signifiant « rester » ou « survivre », en accord avec le nominatif ዘርኡ et avec le grec μενεῖ. « Subsistera » préserve à la fois la survie et la continuité de la lignée.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Le mot signifie littéralement « sa semence », mais fonctionne ici comme terme de lignée. « Sa descendance » est clair en français moderne et convient au statut grammatical de sujet.
- source_word: ለኵሎሙ ትውልድ ለዓለም
  choice: pour toutes les générations, à jamais
  rationale: Cette formulation conserve le double renforcement temporel du guèze tout en restant naturelle et solennelle en français.
theological_decisions:
- issue: Survie physique ou permanence durable de la lignée sous la préservation divine
  choice: La descendance subsistera à travers le jugement et au fil des générations.
  alternative: Il préservera sa descendance.
  rationale: Le nominatif « sa descendance » et la lecture verbale corrigée favorisent une proposition intransitive. La traduction exprime la continuité concrète de la lignée sans déterminer si cette permanence doit être comprise uniquement sur le plan biologique ou aussi dans un sens théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. « Fais-lui savoir » évite une raideur excessive; « subsistera » maintient le registre apocalyptique et la nuance de survie durable. Les marqueurs [a] et [b] figurent dans le texte principal.
