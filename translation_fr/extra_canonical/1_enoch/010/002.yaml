base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: fr
  text: 'Va auprès de Noé[a] et dis-lui en mon nom : « Cache-toi ! » Puis révèle-lui la fin qui vient, car toute la terre sera détruite. Les eaux du déluge vont venir sur toute la terre et détruiront tout ce qui s’y trouve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’édition source, les mots correspondant à « Va auprès de Noé et » sont placés entre parenthèses.
    reason: textual_variant
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወ
  choice: Va auprès de Noé et
  rationale: L’impératif initial et sa destination sont rendus explicitement. « Auprès de » exprime naturellement le mouvement vers une personne en français.
- source_word: በሎ፡ በስመ፡ ዚአየ
  choice: dis-lui en mon nom
  rationale: La formulation conserve à la fois l’acte de parole et l’autorité déléguée exprimée par « en mon nom ».
- source_word: ኅባእ፡ ርእሰከ
  choice: Cache-toi !
  rationale: L’impératif réfléchi appelle Noé à se dissimuler ou à se mettre à l’abri. « Cache-toi » est direct, naturel et urgent.
- source_word: ወአግህድ፡ ሎቱ
  choice: Puis révèle-lui
  rationale: Cet impératif reste adressé au messager, et le pronom renvoie à Noé. « Puis » clarifie l’enchaînement sans faire de Noé le sujet de « révéler ».
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: la fin qui vient
  rationale: Cette traduction garde l’image d’une fin en train de venir et évite d’en faire explicitement la consommation eschatologique finale.
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: toute la terre sera détruite
  rationale: Le passif destructif et la portée universelle de l’énoncé sont conservés.
- source_word: ማየ፡ አይኅ
  choice: les eaux du déluge
  rationale: Cette expression française naturelle préserve la mention explicite des eaux ainsi que celle du déluge.
- source_word: ይመጽእ፡ ሀሎ፡ ዲበ፡ ኵሉ፡ ምድር
  choice: vont venir sur toute la terre
  rationale: La tournure périphrastique française exprime l’imminence indiquée par la construction guèze.
- source_word: ወያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: et détruiront tout ce qui s’y trouve
  rationale: Le pluriel s’accorde naturellement avec « les eaux » et conserve la portée globale de ce qui se trouve dans la terre.
theological_decisions:
- issue: Portée de « la fin »
  choice: Comprendre l’expression dans son contexte immédiat comme la destruction imminente liée au déluge.
  alternative: La consommation finale de l’histoire.
  rationale: Le contexte associe directement cette fin à la destruction de la terre par le déluge. La traduction conserve toutefois le terme général « fin » sans imposer une définition théologique plus étroite.
- issue: Sujet de l’ordre « révèle-lui »
  choice: L’ordre est adressé au messager, qui doit révéler à Noé ce qui vient.
  alternative: Faire entrer « révèle-lui » dans les paroles dites à Noé, ce qui ferait de Noé le sujet de l’ordre.
  rationale: La morphologie impérative et le pronom « à lui » soutiennent la continuité des instructions données au messager; la ponctuation évite un référent incohérent.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation distingue nettement la brève parole adressée à Noé des instructions données au messager. « Les eaux du déluge » conserve l’image redoublée du guèze tout en restant idiomatique.
