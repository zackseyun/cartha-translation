base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: fr
  text: Et détruis ces esprits des bâtards[a] et les enfants des Veilleurs, car ils ont opprimé l’humanité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la descendance illégitime ». Le terme guèze est très dur et semble désigner la descendance issue de l’union illicite des Veilleurs.
    reason: lexical_alternative
  - marker: b
    text: Ou « ont fait violence à l’humanité ». Le verbe peut exprimer une violence plus forte que la seule oppression.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: détruis
  rationale: L’impératif exprime ici un jugement sévère; « détruis » en conserve la force sans préciser le moyen.
- source_word: መናፍስተ
  choice: esprits
  rationale: Dans ce contexte apocalyptique, le terme désigne des êtres spirituels plutôt que des « âmes » au sens général.
- source_word: ተውኔት
  choice: bâtards
  rationale: Le mot désigne une descendance illégitime ou issue d’un mélange illicite. Le terme français, volontairement dur, conserve la force polémique du passage; une formulation explicative moins brutale figure en note.
- source_word: ውሉዶሙ
  choice: les enfants
  rationale: Ce terme de filiation est rendu simplement et naturellement, sans restreindre le sens à des fils mâles.
- source_word: ትጉሃን
  choice: les Veilleurs
  rationale: « Veilleurs » est la désignation apocalyptique consacrée de ces êtres angéliques et maintient le lien littéraire avec le Livre des Veilleurs.
- source_word: ገፍዕዎሙ
  choice: ont opprimé
  rationale: Le verbe évoque l’oppression, les mauvais traitements ou la violence; « ont opprimé » en restitue la gravité mieux qu’un simple « ont fait du tort ».
- source_word: ሰብእ
  choice: l’humanité
  rationale: Le nom est collectif et englobe les êtres humains sans connotation exclusivement masculine.
theological_decisions:
- issue: 'Identité des êtres jugés: esprits distincts des enfants des Veilleurs ou double désignation d’un même groupe'
  choice: 'Conserver les deux éléments coordonnés: « ces esprits des bâtards et les enfants des Veilleurs »'
  alternative: 'Comprendre le second groupe comme une apposition: « les esprits des bâtards, c’est-à-dire des enfants des Veilleurs »'
  rationale: La syntaxe transmise permet une certaine tension entre les « esprits » et les « enfants des Veilleurs ». La traduction ne les fusionne pas dans une explication doctrinale et n’explicite pas davantage leur état post mortem.
translation_notes:
  register: Français international moderne, digne et direct. « Bâtards » conserve intentionnellement la dureté polémique du terme source, tandis que la note offre une formulation explicative. La coordination légèrement tendue du guèze est maintenue plutôt que résolue.
