base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
translation:
  language: fr
  text: 'Alors le Très-Haut, le Grand et le Saint, parla et envoya Ouriel[a] au fils de Lamek[b], et lui dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme du nom est incertaine dans la transcription éthiopienne disponible ; le contexte immédiat, où un ange reçoit cette mission, appuie fortement la lecture « Ouriel ».
    reason: textual_variant
  - marker: b
    text: Ce verset désigne seulement le destinataire comme « le fils de Lamek » ; le contexte permet de l’identifier à Noé.
    reason: cross_reference
lexical_decisions:
- source_word: አሜሃ
  choice: Alors
  rationale: Marque naturellement la progression du récit sans préciser davantage la nuance temporelle.
- source_word: ልዑል
  choice: le Très-Haut
  rationale: Titre divin traditionnel et immédiatement compréhensible, qui conserve l'idée d'élévation suprême.
- source_word: ዓቢይ፡ ወቅዱስ
  choice: le Grand et le Saint
  rationale: Conserve l'accumulation solennelle des épithètes divines et leur valeur substantivale.
- source_word: ተናገረ፡ ወፈነወ
  choice: parla, puis envoya
  rationale: Rend les deux actions distinctes et explicite sobrement leur succession en français naturel.
- source_word: አሰርየ፡ ልዩር
  choice: Ouriel
  rationale: Le texte transmis semble altéré à cet endroit, mais le contexte immédiat soutient fortement le nom de l'ange Ouriel; la forme française usuelle est retenue.
- source_word: ኀበ፡ ወልደ፡ ላሜክ
  choice: auprès du fils de Lamek
  rationale: « Auprès de » convient au déplacement d'un messager vers une personne; la désignation filiale du texte est préservée sans ajouter le nom de Noé.
- source_word: ወይቤሎ
  choice: et lui dit
  rationale: Représente explicitement le suffixe pronominal et introduit naturellement le discours à venir.
theological_decisions:
- issue: Accumulation des épithètes divines
  choice: le Très-Haut, le Grand et le Saint
  alternative: le Très-Haut, grand et saint
  rationale: La substantivation et les majuscules françaises maintiennent la force titulaire des trois désignations sans les fondre en une seule.
- issue: Identification du fils de Lamek
  choice: Ne pas nommer Noé dans le corps du verset
  alternative: le fils de Lamek, Noé
  rationale: Le verset ne donne que la filiation; l'identification avec Noé relève du contexte et doit rester en note afin de ne pas expliciter silencieusement le texte.
translation_notes:
  register: Français moderne, digne et narratif. Les titres divins conservent leur solennité; la syntaxe reste claire pour un lectorat général. Les marqueurs de notes sont placés sur les éléments auxquels ils se rapportent.
