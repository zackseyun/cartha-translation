base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: fr
  text: Et toute la terre a été corrompue par l’enseignement des pratiques d’Azazel[a] ; et inscris à sa charge tout péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’instruction relative aux actes d’Azazel ». L’expression guèze associe l’idée d’enseignement à celle d’actes ou de pratiques concrètes.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « écris contre lui tout péché ». La formule évoque l’enregistrement officiel de la culpabilité dans le cadre du jugement.'
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: a été corrompue
  rationale: Le verbe exprime l’altération ou la corruption. Cette formulation conserve ici sa portée morale et universelle.
- source_word: ኵላ ምድር
  choice: toute la terre
  rationale: Dans ce contexte apocalyptique, l’expression désigne vraisemblablement la terre entière plutôt qu’un territoire particulier.
- source_word: በትምህርተ ግብሩ ለአዛዝኤል
  choice: par l’enseignement des pratiques d’Azazel
  rationale: La traduction maintient les deux composantes de l’expression guèze, l’enseignement et les actes ou pratiques, tout en restant intelligible en français moderne.
- source_word: ወላዕሌሁ ጸሐፍ
  choice: et inscris à sa charge
  rationale: ላዕሌሁ porte ici le sens de « sur lui » ou « contre lui », et ጸሐፍ commande d’écrire ou d’enregistrer. « Inscris à sa charge » restitue naturellement la force judiciaire de l’expression sans réduire l’acte à une simple attribution abstraite.
- source_word: ኵሎ ኃጢአተ
  choice: tout péché
  rationale: Cette expression concise conserve la portée globale de l’accusation, sans préciser au-delà du texte s’il s’agit de chaque péché pris séparément ou de la totalité du péché.
theological_decisions:
- issue: La dernière proposition ordonne-t-elle d’enregistrer tout péché contre Azazel, ou seulement d’écrire à son sujet ?
  choice: « inscris à sa charge tout péché »
  alternative: « écris contre lui tout péché » ou « consigne tout péché à son sujet »
  rationale: Le contexte est celui d’un jugement et ላዕሌሁ signifie plus naturellement « contre lui » que « à lui ». La formulation retenue exprime l’imputation judiciaire tout en signalant en note la possibilité d’une traduction plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture par « Et » ainsi que la coordination de la dernière proposition reproduisent la continuité du texte. Le registre judiciaire de « à sa charge » rend la valeur de la préposition sans donner l’impression qu’un écrit doit être adressé à Azazel.
