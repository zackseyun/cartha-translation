base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: fr
  text: Détruis toute violence de la face de la terre, et toute œuvre mauvaise prendra fin; la plante de la justice et de la droiture[a] apparaîtra, et elle deviendra une bénédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plantation de la justice et de la droiture ». Le nom guèze peut désigner ce qui est planté ou l’acte et le résultat de planter.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: Détruis
  rationale: Impératif actif à la deuxième personne du masculin singulier, en continuité avec l’ordre adressé à l’ange; cette valeur est également confirmée par le grec ἀπόλεσον.
- source_word: ኵሎ ግፍዓ
  choice: toute violence
  rationale: Le terme désigne la violence, l’oppression ou le tort; « violence » conserve ici sa portée sociale et morale.
- source_word: እምገጸ ምድር
  choice: de la face de la terre
  rationale: La formulation garde l’image sémitique littérale et le registre apocalyptique élevé.
- source_word: ኵሉ ምግባረ እኩይ
  choice: toute œuvre mauvaise
  rationale: Cette expression collective rend la totalité des actes mauvais sans restreindre le sens à un type précis de faute.
- source_word: ይኅልቅ
  choice: prenne fin
  rationale: Le verbe peut signifier périr, s’achever ou disparaître; avec « œuvre mauvaise », « prendre fin » exprime naturellement la cessation.
- source_word: ያስተርኢ
  choice: apparaîtra
  rationale: Le verbe indique qu’une chose devient visible ou se manifeste; « apparaîtra » préserve simplement cette émergence.
- source_word: ተክለ
  choice: la plante
  rationale: Le nom peut désigner une plante ou la plantation; « plante » maintient l’image agricole concrète, tandis que l’autre possibilité est signalée en note.
- source_word: ጽድቅ ወርትዕ
  choice: de la justice et de la droiture
  rationale: « Justice » traduit naturellement ጽድቅ dans ce contexte moral, et « droiture » conserve l’idée de rectitude portée par ርትዕ.
- source_word: ይከውን ለበረከት
  choice: elle deviendra une bénédiction
  rationale: La construction exprime un résultat ou une destination; cette formulation française conserve le sens de devenir une source ou une réalité de bénédiction.
theological_decisions:
- issue: Sens de l’image agricole « plante de la justice et de la droiture »
  choice: Conserver une image apocalyptique concrète de croissance ou d’établissement juste.
  alternative: « la plantation de la justice et de la droiture » ou une paraphrase telle que « la justice fleurira »
  rationale: Le guèze emploie un nom agricole. Garder « plante » respecte la texture visionnaire et évite de réduire l’image à une abstraction, tout en signalant l’ambiguïté lexicale en note.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif initial est conservé, de même que l’expression élevée « face de la terre » et l’image agricole du texte source.
