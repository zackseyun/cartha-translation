base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: fr
  text: 'Puis le Seigneur dit encore à Raphaël : « Lie Azazel par les mains et les pieds, jette-le dans les ténèbres, puis fends le désert[b] qui se trouve à Doudaël[a] et jette-le là. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Doudaël est conservé comme nom de lieu. Le verset le présente comme un endroit désertique précis associé à la détention d’Azazel.
    reason: cultural_note
  - marker: b
    text: L’ordre traduit par « fends le désert » est textuellement difficile. Certains comprennent qu’il faut ouvrir ou préparer dans le désert un lieu semblable à une fosse ; la traduction reste aussi concrète que possible sans ajouter ce que le témoin guèze ne dit pas explicitement.
    reason: textual_variant
lexical_decisions:
- source_word: ካዕበ
  choice: encore
  rationale: Le terme marque la reprise de la parole dans la suite du récit. « Encore » conserve cette répétition sans alourdir la formule française.
- source_word: እግዚእ
  choice: le Seigneur
  rationale: Dans cette formule de parole, le mot fonctionne comme titre divin. « Le Seigneur » garde un registre digne et courant.
- source_word: እሰሮ
  choice: lie
  rationale: L’impératif exprime une entrave concrète. « Lie » préserve l’image physique, contrairement à un terme plus général comme « emprisonne ».
- source_word: በእዴሁ ወእግሩ
  choice: par les mains et les pieds
  rationale: Le guèze nomme explicitement ces parties du corps. Cette formulation française conserve le caractère concret de l’ordre.
- source_word: ወድዮ
  choice: jette-le
  rationale: L’impératif répété évoque un déplacement forcé. « Jette-le » rend directement cette vigueur et permet de conserver la répétition du texte source.
- source_word: ውስተ ጽልመት
  choice: dans les ténèbres
  rationale: La formule désigne ici un lieu ou un état obscur associé au châtiment. « Les ténèbres » convient au registre apocalyptique sans spiritualiser l’image.
- source_word: አብቅዋ ለገዳም
  choice: fends le désert
  rationale: Le verbe semble ordonner d’ouvrir ou de fendre, avec le désert comme objet explicite. Cette traduction conserve l’image abrupte du témoin guèze sans ajouter une fosse qui n’y est pas nommée.
- source_word: እንተ ሀለወት በዱዳኤል
  choice: qui se trouve à Doudaël
  rationale: La proposition relative situe le désert. Doudaël est conservé comme nom de lieu, sous une forme adaptée à l’orthographe française.
- source_word: ህየ
  choice: là
  rationale: L’adverbe locatif renvoie au lieu qui vient d’être indiqué. « Là » est direct et naturel.
theological_decisions:
- issue: Nature du châtiment d’Azazel
  choice: Une entrave et un bannissement concrets dans un lieu désertique et ténébreux
  alternative: Un emprisonnement général ou une relégation purement symbolique dans des ténèbres spirituelles
  rationale: 'Le verset accumule des images physiques : mains, pieds, ténèbres, désert et action répétée de jeter. La traduction conserve ce caractère corporel et spatial sans imposer une interprétation exclusivement littérale ou symbolique.'
- issue: Nature exacte du lieu ouvert dans le désert
  choice: Maintenir l’ordre difficile « fends le désert »
  alternative: Expliciter une fosse ou un cachot creusé dans le désert
  rationale: Le témoin guèze nomme le désert mais ne désigne pas explicitement une fosse. La traduction garde donc la difficulté et l’image du texte au lieu d’ajouter un élément interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe impérative et la répétition de « jette-le » préservent la force du passage apocalyptique. Les formes françaises usuelles Raphaël et Doudaël sont employées, tandis qu’Azazel est conservé.
