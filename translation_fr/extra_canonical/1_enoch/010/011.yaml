revisions:
- from: 'Et le Seigneur dit à Michel : « Va, lie Shemihazah[a] et les autres qui sont avec lui, ceux qui se sont unis à des femmes et se sont ainsi souillés avec elles par leur impureté. »'
  to: 'Et le Seigneur dit à Michel : « Va, lie Shemihazah[a] et les autres qui étaient avec lui, qui se sont unis à des femmes afin de se souiller avec elles dans leur impureté. »'
  rationale: La révision rétablit plus précisément la relation finale ou consécutive de la proposition de souillure et rend la dernière expression sans imposer l’idée additionnelle d’un moyen causal. Elle simplifie aussi la chaîne de relatives pour un français moderne plus fluide, sans modifier les référents ni le registre.
  reviewer_model: gpt-5.6-terra
