base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: fr
  text: 'Et le Seigneur dit à Michel : « Va, lie Shemihazah[a] et les autres qui étaient avec lui, qui se sont unis à des femmes afin de se souiller avec elles dans leur impureté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le commandement rendu par « lie » est difficile à lire dans la transcription du texte, mais le contexte du chapitre et les autres témoins soutiennent ce sens.
    reason: textual_variant
lexical_decisions:
- source_word: ለሚካኤል
  choice: à Michel
  rationale: « Michel » est la forme française usuelle du nom, naturelle et immédiatement reconnaissable, tout en correspondant au nom guèze.
- source_word: ይቤ እግዚእ
  choice: le Seigneur dit
  rationale: Le sujet explicite እግዚእ est conservé, avec l’ordre des mots naturel en français.
- source_word: ሑር †አይድዕ†
  choice: Va, lie
  rationale: Le premier impératif signifie « va ». Le commandement suivant est textuellement difficile dans la transcription, mais le contexte du jugement et les témoins plus larges soutiennent le sens « lie ».
- source_word: ለስምያዛ
  choice: Shemihazah
  rationale: Translittération savante reconnaissable du nom du chef des Veilleurs, maintenue plutôt qu’une francisation incertaine.
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: et les autres qui sont avec lui
  rationale: Rend directement le groupe de ses compagnons sans préciser indûment leur rang ou leur fonction.
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: ceux qui se sont unis à des femmes
  rationale: Expression française claire qui conserve l’idée d’une union volontaire sans devenir inutilement explicite.
- source_word: ከመ ይማስኑ
  choice: et se sont ainsi souillés
  rationale: « Ainsi » laisse ouverte la nuance de but ou de conséquence portée par ከመ, tandis que « se sont souillés » préserve la voix réfléchie et le registre d’impureté.
- source_word: ምስሌሆን በርኵሶ ዚአሆን
  choice: avec elles par leur impureté
  rationale: Conserve la référence aux femmes (« avec elles ») et l’impureté qui leur est attribuée dans la formulation guèze, sans ajouter l’intensif « toute » absent du texte.
theological_decisions:
- issue: Nature de la souillure liée à l’union avec les femmes
  choice: Employer le vocabulaire de la souillure et de l’impureté sans définir davantage la catégorie du péché.
  alternative: Préciser « corruption sexuelle », « impureté rituelle » ou « méchanceté générale ».
  rationale: Le guèze associe explicitement l’union à la souillure et à l’impureté, mais ne tranche pas ici entre les catégories doctrinales ultérieures. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe légèrement solennelle adaptée au récit apocalyptique, avec les répétitions du texte source allégées seulement lorsque le français l’exige. Le marqueur [a] figure dans le texte principal.
