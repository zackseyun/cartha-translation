base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: fr
  text: Et lorsqu’il brûlera et périra[a], dès lors ils seront liés tous ensemble avec eux jusqu’à l’achèvement des générations de générations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier verbe est graphiquement signalé comme incertain dans le témoin transcrit. Il est compris ici au sens de « brûler »; le verbe suivant signifie « périr ».
    reason: textual_variant
  - marker: b
    text: « Générations de générations » traduit littéralement l’expression redoublée, qui évoque une longue succession d’âges.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: Et lorsqu’il
  rationale: Introduit une proposition temporelle dans la continuité du jugement décrit.
- source_word: ይውዒ
  choice: brûlera
  rationale: Le verbe est compris à partir de ውዕየ, « brûler », conformément à la lecture philologique révisée; le futur français convient après « lorsque ».
- source_word: ወይማስን
  choice: et périra
  rationale: Le verbe est compris à partir de ማስነ, « périr, être détruit », et non comme une mention de fils ou de descendants.
- source_word: እምይእዜ
  choice: dès lors
  rationale: Rend la valeur temporelle « à partir de maintenant / dès ce moment-là » de manière naturelle dans le contexte futur.
- source_word: ምስሌሆሙ
  choice: avec eux
  rationale: Conserve l’association au même châtiment sans préciser des référents que ce verset ne nomme pas explicitement.
- source_word: ኅቡረ
  choice: tous ensemble
  rationale: Exprime nettement le caractère collectif de la mise aux liens.
- source_word: ይትአሰሩ
  choice: ils seront liés
  rationale: Rend le passif de contrainte sans renforcer le texte par « emprisonnés » ou « enchaînés ».
- source_word: እስከ
  choice: jusqu’à
  rationale: Marque le terme assigné à la durée de la contrainte.
- source_word: ተፍጻሜተ
  choice: l’achèvement
  rationale: Préserve l’idée d’une arrivée au terme sans imposer le vocabulaire théologique plus chargé de « consommation ».
- source_word: ትውልደ፡ ትውልድ
  choice: des générations de générations
  rationale: Maintient l’idiome redoublé et sa solennité apocalyptique au lieu de l’aplatir en « toutes les générations ».
theological_decisions:
- issue: Durée et portée du châtiment
  choice: Une mise aux liens collective qui dure jusqu’à l’achèvement d’une succession de générations.
  alternative: Un emprisonnement éternel, ou seulement jusqu’au jugement final.
  rationale: Le guèze associe explicitement « jusqu’à l’achèvement » à l’expression redoublée « générations de générations »; la traduction conserve cette tension temporelle sans la résoudre selon une catégorie doctrinale ultérieure.
- issue: Référents des pronoms
  choice: Conserver « il », « ils » et « eux » sans identification ajoutée.
  alternative: Nommer dans le verset les êtres jugés ou leurs compagnons.
  rationale: Le fragment fourni emploie des pronoms dont les antécédents dépendent du contexte; les expliciter dans le corps du texte introduirait une interprétation absente de la formulation transmise.
translation_notes:
  register: Français moderne, digne et lisible. « Dès lors » convient mieux que « désormais » à la perspective temporelle introduite par « lorsqu’il ». L’étrangeté solennelle de « générations de générations » est volontairement conservée.
