base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: fr
  text: Guéris la terre que les anges ont corrompue, et fais connaître la restauration de la terre[a], afin qu’ils guérissent la terre et que tous les enfants des hommes ne périssent pas à cause de tous les secrets que les Veilleurs ont révélés[b] et enseignés à leurs fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression est difficile. Le guèze peut se comprendre plus littéralement comme « la vie de la terre » ou « le retour à la vie de la terre ».
    reason: textual_variant
  - marker: b
    text: Le guèze porte littéralement « tués ». Cette leçon semble refléter une corruption ancienne du texte grec, où un mot signifiant « frappé » ou « tué » a vraisemblablement remplacé un mot signifiant « montré » ou « révélé ».
    reason: textual_variant
lexical_decisions:
- source_word: አሕይዋ
  choice: Guéris
  rationale: Dans cet ordre concernant la terre endommagée, « guérir » exprime naturellement l’idée causative de rendre à la vie, tout en conservant l’image de réparation cosmique.
- source_word: አማሰኑ
  choice: ont corrompue
  rationale: Ce choix rend le dommage à la fois moral et cosmique causé par les anges, sans le limiter à une souillure rituelle.
- source_word: ሕይወታ ለምድር
  choice: la restauration de la terre
  rationale: Le nom est littéralement lié à la « vie »; « restauration » convient au contexte et laisse ouverte la nuance de retour à la vie, signalée en note.
- source_word: አይድዕ
  choice: fais connaître
  rationale: Rend la valeur causative du verbe et l’ordre de communiquer le remède ou la restauration.
- source_word: ይሕይዋ ለምድር
  choice: qu’ils guérissent la terre
  rationale: Suit le texte guèze, qui répète explicitement « la terre », sans importer la variante grecque « le fléau ».
- source_word: ኢይትሐጐሉ
  choice: ne périssent pas
  rationale: Formulation claire et digne adaptée au registre de jugement apocalyptique.
- source_word: በምሥጢር ኵሉ
  choice: à cause de tous les secrets
  rationale: « Secrets » conserve le vocabulaire apocalyptique sans réduire ces connaissances illicites à la seule magie.
- source_word: ትጉሃን
  choice: les Veilleurs
  rationale: Titre traditionnel et contextuellement précis des êtres angéliques de ce récit.
- source_word: መሀሩ ለውሉዶሙ
  choice: enseignés à leurs fils
  rationale: Rend directement le langage familial masculin du témoin guèze.
theological_decisions:
- issue: Nature de la restauration de la terre
  choice: Le verset décrit la guérison ou la restauration effective de la terre corrompue.
  alternative: Comprendre la phrase comme une simple réforme morale de l’humanité ou traduire littéralement « la vie de la terre ».
  rationale: La répétition de « la terre » comme objet direct et le vocabulaire de corruption et de guérison soutiennent une portée cosmique, sans exclure les conséquences humaines.
- issue: Identité de ceux qui ont révélé les secrets
  choice: Les secrets sont ceux que les Veilleurs ont révélés et enseignés.
  alternative: Y voir plus généralement des connaissances cachées circulant parmi les humains.
  rationale: La dernière proposition attribue directement aux Veilleurs la révélation et l’enseignement de ces secrets.
- issue: Lecture du verbe ዘቀተሉ
  choice: Traduire le sens contextuellement attendu « révélés » et signaler la leçon littérale en note.
  alternative: Traduire littéralement « tués », au prix d’une phrase incohérente dans ce contexte.
  rationale: Le guèze porte littéralement « tués », probablement issu d’une corruption de la transmission grecque; la note maintient la transparence textuelle sans rendre le corps du texte inintelligible.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la terre » est conservée parce qu’elle appartient au témoin guèze. Le pronom pluriel « ils » demeure volontairement non explicité afin de ne pas résoudre une difficulté syntaxique du texte source.
