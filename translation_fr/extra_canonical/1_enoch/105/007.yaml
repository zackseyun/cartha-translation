base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: fr
  text: 'Et puisque vous, pécheurs, dites : « Vous ne faites aucune recherche[a], et ils ne consignent pas tous nos péchés », ils consignent tous vos péchés chaque jour[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi se traduire par « vous n’enquêtez pas » ou « vous ne cherchez pas ». Le texte ne précise pas ici ce qui fait l’objet de cette recherche.
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « ils consignent » n’est pas identifié dans le texte; il renvoie aux agents chargés de mettre les péchés par écrit, sans préciser davantage leur identité.
    reason: ambiguity
lexical_decisions:
- source_word: ወእስመ
  choice: Et puisque
  rationale: Introduit la raison de la déclaration qui suit tout en conservant le lien syntaxique avec le contexte précédent.
- source_word: ትብሉ፡ አንትሙ፡ ኃጥኣን
  choice: vous, pécheurs, dites
  rationale: Le verbe et le pronom sont à la deuxième personne du pluriel; « pécheurs » est pris en apposition au sujet, conformément à la syntaxe explicite du guèze.
- source_word: ኢትኅሥሡ
  choice: Vous ne faites aucune recherche
  rationale: La forme est une deuxième personne du pluriel active. Cette formulation française conserve l’absence d’objet exprimé et la valeur possible de recherche ou d’enquête.
- source_word: ኢይጽሐፉ፡ ኵሎ፡ ኃጢአትነ
  choice: ils ne consignent pas tous nos péchés
  rationale: La troisième personne du pluriel reste indéfinie dans le texte; « consigner » rend clairement l’idée d’inscrire dans un registre sans imposer l’identité des agents.
- source_word: ይጽሐፉ፡ ሀለዉ
  choice: ils consignent
  rationale: L’imparfait accompagné de l’auxiliaire ሀለዉ exprime une action en cours; le présent français convient au constat actuel et habituel.
- source_word: በኵሉ፡ ዕለት
  choice: chaque jour
  rationale: Rend naturellement la portée distributive de l’expression et l’enregistrement continuel des péchés.
theological_decisions:
- issue: Nature et agents de la consignation des péchés
  choice: Conserver l’image concrète d’une consignation continue, avec un sujet pluriel non identifié.
  alternative: Employer un passif (« vos péchés sont consignés ») ou préciser que Dieu ou les anges les consignent.
  rationale: Le texte emploie une troisième personne du pluriel sans nommer ses référents. La traduction préserve donc l’imagerie judiciaire et apocalyptique ainsi que l’indétermination des agents, sans ajouter une précision doctrinale absente du verset.
- issue: Sens de l’affirmation des pécheurs
  choice: 'Comprendre la première proposition citée comme une accusation adressée à des interlocuteurs au pluriel : « Vous ne faites aucune recherche ».'
  alternative: 'Lire un passif à la première personne : « Nous ne faisons l’objet d’aucune recherche ».'
  rationale: La morphologie transmise soutient une deuxième personne du pluriel active. L’objet non exprimé demeure implicite, ce qui évite de résoudre artificiellement la formulation difficile.
translation_notes:
  register: Français international moderne, sobre et digne. « Consigner » maintient l’image d’un registre judiciaire tout en restant intelligible. La répétition entre la parole des pécheurs et sa réfutation est conservée, de même que les changements de personnes grammaticales du texte guèze.
