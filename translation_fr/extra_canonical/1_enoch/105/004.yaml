base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/004.yaml
  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: fr
  text: Espérez et n’abandonnez pas votre espérance, car vous connaîtrez une grande joie, comme les anges du ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La comparaison peut porter sur la joie des anges, sur leur état bienheureux ou sur leur récompense céleste; le texte ne le précise pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስፈዉ
  choice: Espérez
  rationale: Impératif du verbe « espérer » ou « mettre sa confiance ». « Espérez » garde l’exhortation directe sans ajouter de complément absent du texte.
- source_word: ወኢትኅድጉ
  choice: et n’abandonnez pas
  rationale: L’impératif négatif exprime l’idée de délaisser ou d’abandonner. Cette formulation conserve sa force tout en restant naturelle en français moderne.
- source_word: ተስፋክሙ
  choice: votre espérance
  rationale: Le nom est l’objet direct de l’interdiction. Sa reprise après « Espérez » respecte la répétition rhétorique de la source.
- source_word: እስመ
  choice: car
  rationale: La conjonction introduit le motif de l’exhortation. « Car » convient au registre digne du passage.
- source_word: ትከዉኑ ለክሙ
  choice: vous connaîtrez
  rationale: La construction verbale avec le pronom datif indique qu’une réalité sera accordée aux destinataires. « Vous connaîtrez » produit une tournure française naturelle avec « une grande joie », sans changer l’idée de bénéfice promis.
- source_word: ፍሥሓ ዐቢይ
  choice: une grande joie
  rationale: Traduction directe du substantif et de son adjectif, naturelle en français et conforme au ton de promesse.
- source_word: ከመ መላእክተ ሰማይ
  choice: comme les anges du ciel
  rationale: La comparaison explicite est conservée sans préciser indûment si elle porte sur la joie, l’état bienheureux ou la récompense.
theological_decisions:
- issue: Portée de la comparaison avec les anges
  choice: La grande joie promise est mise en rapport avec les anges du ciel, sans affirmer une transformation des justes en anges.
  alternative: Comprendre que les justes se réjouiront avec les anges, ou qu’ils deviendront semblables aux anges.
  rationale: Le guèze emploie une comparaison simple. Il ne dit explicitement ni que les destinataires deviendront des anges ni qu’ils se joindront à eux; la traduction maintient donc cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Espérez… votre espérance » est volontairement conservée. La tournure « vous connaîtrez une grande joie » évite en français un rattachement maladroit de « comme les anges du ciel » tout en maintenant l’ambiguïté réelle de la comparaison.
