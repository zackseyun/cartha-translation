base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: fr
  text: Espérez, car autrefois vous avez été couverts de honte par le mal et par l’affliction[a] ; mais maintenant, vous brillerez comme la lumière du ciel, vous brillerez et serez vus, et les portes du ciel s’ouvriront pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « à cause de la méchanceté et de la souffrance ». Le guèze associe étroitement la honte au mal et à l’affliction, sans préciser s’il s’agit d’une cause, d’un moyen ou des circonstances.'
    reason: lexical_alternative
  - marker: b
    text: L’image des « portes du ciel » évoque l’ouverture du domaine céleste en faveur des justes. Le texte ne précise ni ce qui passe par ces portes ni si les justes eux-mêmes doivent les franchir.
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Espérez
  rationale: L’impératif pluriel est rendu par une exhortation directe et concise, sans ajouter d’objet absent du texte.
- source_word: ቀዳሚ
  choice: autrefois
  rationale: Marque clairement le contraste temporel entre la honte passée et la manifestation à venir.
- source_word: ኃሠርክሙ
  choice: vous avez été couverts de honte
  rationale: Conserve la valeur passive ainsi que la dimension publique de la honte, sans la réduire à une simple souffrance intérieure.
- source_word: በእኩይ ወበምራኅ
  choice: par le mal et par l’affliction
  rationale: La formulation compacte maintient l’ambiguïté de la préposition, qui peut exprimer la cause, le moyen ou les circonstances, et ne précise pas si le mal désigne des personnes, des actes ou une situation.
- source_word: ትበርሁ
  choice: vous brillerez
  rationale: Le futur convient au contraste avec « autrefois » et à la promesse de réhabilitation. La répétition du verbe est conservée.
- source_word: ብርሃነ ሰማይ
  choice: la lumière du ciel
  rationale: Rend directement la construction génitive et préserve l’image cosmique concrète.
- source_word: ትትረአዩ
  choice: serez vus
  rationale: 'Préserve le sens passif probable et l’enchaînement : briller, puis devenir visible aux autres.'
- source_word: ኆኅተ ሰማይ
  choice: les portes du ciel
  rationale: ኆኅት désigne une porte, une entrée ou un portail. « Portes » est naturel en français et respecte le cadre cosmologique hénochique sans importer l’image distincte des « fenêtres du ciel ».
- source_word: ይትረኀዉ ለክሙ
  choice: s’ouvriront pour vous
  rationale: La tournure française exprime naturellement l’ouverture accordée aux destinataires tout en laissant l’agent implicite, comme dans le texte source.
theological_decisions:
- issue: Portée de l’ouverture des portes du ciel
  choice: Conserver l’image d’une ouverture du ciel en faveur des destinataires, sans préciser ce qui en sort ni s’ils y entrent.
  alternative: Interpréter l’image comme l’effusion de bénédictions célestes ou comme l’entrée personnelle des justes au ciel.
  rationale: Le guèze dit seulement que les portes du ciel s’ouvriront pour eux. Toute précision sur une effusion ou une ascension dépasserait le texte.
- issue: Nature du mal et de l’affliction ayant causé la honte
  choice: Maintenir des termes généraux et la relation prépositionnelle ambiguë.
  alternative: Identifier le mal à la méchanceté personnelle des persécuteurs ou à la faute des destinataires.
  rationale: Le verset ne détermine ni l’origine morale précise du mal ni la responsabilité des personnes auxquelles il s’adresse.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « vous brillerez » est volontaire afin de conserver l’insistance poétique du guèze. « Portes du ciel » privilégie la précision lexicale et le cadre cosmologique de 1 Hénoch.
