base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/001.yaml
  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: fr
  text: La gloire du Grand[a], et vos noms seront écrits devant la gloire du Grand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le guèze commence par un groupe nominal elliptique : « La gloire du Grand, et… » Cette tournure abrupte est conservée plutôt que complétée par conjecture.'
    reason: textual_ambiguity
  - marker: b
    text: Le guèze répète « la gloire du Grand ». Cette répétition, vraisemblablement délibérée, renforce la solennité de la promesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስብሐቲሁ
  choice: la gloire
  rationale: Le nom peut désigner la gloire, la louange ou la splendeur. « Gloire » convient ici à la majesté céleste devant laquelle les noms sont écrits et préserve le registre apocalyptique.
- source_word: ለዐቢይ
  choice: du Grand
  rationale: 'La construction guèze exprime ici un génitif : littéralement « sa gloire, celle du Grand ». Employé substantivement, « le Grand » fonctionne comme un titre divin révérenciel.'
- source_word: ወእስማቲከሙ
  choice: et vos noms
  rationale: Le nom et le suffixe de deuxième personne sont au pluriel ; la traduction conserve l’adresse collective.
- source_word: ይጸሐፍ
  choice: seront écrits
  rationale: Le verbe signifie « écrire ». Le futur rend naturellement la valeur de promesse ou d’assurance dans ce contexte.
- source_word: በቅድመ
  choice: devant
  rationale: La préposition indique ce qui est devant quelqu’un ou en sa présence. « Devant » reste concis tout en conservant la solennité de l’image.
theological_decisions:
- issue: Sens de ስብሐቲሁ dans la formule répétée
  choice: gloire
  alternative: louange ; splendeur
  rationale: Le fait que les noms soient écrits devant cette réalité évoque la présence majestueuse du Grand plutôt qu’un simple acte de louange. « Gloire » maintient l’imagerie apocalyptique sans en préciser excessivement la nature.
- issue: Analyse de la première occurrence de ስብሐቲሁ፡ ለዐቢይ
  choice: la gloire du Grand
  alternative: Sa gloire est grande
  rationale: La particule ለ et le pronom anticipatif de ስብሐቲሁ forment une construction génitive. La même expression reparaît à la fin du verset, ce qui appuie une traduction identique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’ouverture syntaxiquement abrupte ainsi que la répétition du texte guèze. « Le Grand » est retenu comme titre solennel et plus proche de l’expression source que « le Très-Grand » ou « le Grand Être ».
