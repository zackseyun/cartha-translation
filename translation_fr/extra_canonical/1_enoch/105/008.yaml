base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: fr
  text: Et maintenant, je vous montre que[b] la lumière et les ténèbres, le jour et la nuit[a], voient tous vos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La lumière et les ténèbres, le jour et la nuit, sont ici dépeints comme des témoins qui voient chaque péché. L’image peut aussi évoquer ce qui se fait ouvertement ou en secret, à toute heure.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « je vous montre ceci, car… »'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: Et maintenant
  rationale: Marque naturellement la transition temporelle et discursive.
- source_word: አነ አርእየክሙ
  choice: je vous montre
  rationale: Conserve la valeur visuelle et causative du verbe, particulièrement adaptée au registre apocalyptique.
- source_word: እስመ
  choice: que
  rationale: Après un verbe signifiant « montrer », le terme introduit naturellement en guèze la proposition qui en constitue le contenu.
- source_word: ብርሃን ወጽልመት
  choice: la lumière et les ténèbres
  rationale: Rend directement l’opposition cosmique sans la réduire à une expression abstraite.
- source_word: ዕለት ወሌሊት
  choice: le jour et la nuit
  rationale: Préserve le second couple exprimant la totalité et la continuité.
- source_word: ይሬእዩ
  choice: voient
  rationale: Le présent rend la portée générale du verbe et maintient la personnification des réalités cosmiques.
- source_word: ኵሎ ኃጢአትክሙ
  choice: tous vos péchés
  rationale: Conserve le pluriel concret ainsi que la portée totalisante de ኵሎ.
theological_decisions:
- issue: Les éléments cosmiques sont-ils de simples indications de circonstances ou des témoins actifs des fautes humaines ?
  choice: La lumière, les ténèbres, le jour et la nuit sont grammaticalement présentés comme voyant tous les péchés des destinataires.
  alternative: Ces couples pourraient évoquer, de manière idiomatique, ce qui est commis ouvertement ou en secret, à toute heure.
  rationale: Les noms coordonnés constituent le sujet le plus naturel de « voient ». La traduction conserve donc l’image apocalyptique de la création témoin, tandis que la note signale sa portée possible.
- issue: Fonction de እስመ après « je vous montre »
  choice: 'Complétive : « que »'
  alternative: 'Causale ou explicative : « car »'
  rationale: Après ce verbe de perception ou de déclaration, እስመ fonctionne très probablement comme une conjonction introduisant le contenu montré, sans que l’autre analyse soit impossible.
