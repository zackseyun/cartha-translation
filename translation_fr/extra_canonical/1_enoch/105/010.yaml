base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: fr
  text: 'Et maintenant, je connais ce mystère : beaucoup de pécheurs altéreront la parole de justice et la pervertiront[a] ; ils prononceront des paroles mauvaises et mentiront ; ils concevront de grandes fabrications[b] et écriront des livres au sujet de leurs propres paroles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe traduit par « la pervertiront » est difficile. On peut aussi comprendre : « s’en détourneront » ou « s’égareront ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « de grandes inventions » ou « de grandes compositions ». Le terme désigne ce qui est formé ou produit ; le contexte de mensonge lui donne ici une nuance défavorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: je connais
  rationale: Le présent simple convient à la déclaration introduite par « maintenant » et rend directement l’idée de savoir ou de connaître.
- source_word: ምሥጢር
  choice: mystère
  rationale: Dans ce contexte apocalyptique, « mystère » désigne une réalité cachée désormais révélée.
- source_word: ነገረ ርትዕ
  choice: la parole de justice
  rationale: Cette formulation conserve le caractère compact du syntagme et laisse ouverte la relation entre la parole, la vérité et la justice.
- source_word: ይመይጡ
  choice: altéreront
  rationale: La forme est comprise comme un imparfait actif pluriel dont « beaucoup de pécheurs » est le sujet et « la parole de justice » l’objet.
- source_word: የዐልዉ
  choice: la pervertiront
  rationale: Dans la séquence syntaxique, le verbe est rendu comme une seconde action exercée sur la parole de justice. La lecture du terme demeure toutefois difficile.
- source_word: ነገራተ እኩያተ
  choice: des paroles mauvaises
  rationale: Le contexte immédiat de parole, de mensonge et d’écriture favorise « paroles » plutôt que le terme plus général « choses ».
- source_word: ይሐስዉ
  choice: mentiront
  rationale: Traduction directe et naturelle de l’accusation.
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: ils façonneront de grandes inventions
  rationale: « Façonner » maintient l’écho de la racine liée à la formation ou à la production, tandis qu’« inventions » exprime ici des productions imaginées sans imposer toute la force interprétative de « mensonges fabriqués ».
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: ils écriront des livres à partir de leurs propres paroles
  rationale: Cette traduction rattache les livres au contenu mensonger produit par les pécheurs et évite de condamner l’écriture de livres en elle-même.
theological_decisions:
- issue: La nature de l’atteinte portée à la parole de justice
  choice: Les pécheurs altèrent et pervertissent la parole de justice.
  alternative: La parole de justice sera négligée, puis beaucoup de pécheurs s’égareront.
  rationale: La syntaxe la mieux établie fait de « beaucoup de pécheurs » le sujet du verbe actif « altérer ». La difficulté du verbe suivant est signalée en note plutôt que résolue dogmatiquement.
- issue: La portée de la condamnation des livres
  choice: Sont visés les livres issus des propres paroles mauvaises et mensongères des pécheurs.
  alternative: Le verset condamnerait toute composition de livres.
  rationale: Le dernier membre reste lié à la série d’actions précédentes ; il ne justifie donc pas une condamnation générale de l’activité littéraire.
translation_notes:
  register: Français international actuel, digne et lisible. La ponctuation clarifie la longue coordination du guèze sans effacer son effet d’accumulation. « Parole de justice » conserve la formulation théologique ouverte du texte source.
