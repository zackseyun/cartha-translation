  rationale: 'La révision restitue l’élément « pour vous » omis, améliore la formulation française de l’enquête passive et conserve les ambiguïtés essentielles : le sujet masculin non nommé de « fera voir », l’interprétation d’« anges » et la relation entre les auxiliaires et les auteurs du pillage. Les notes existantes restent correctement ancrées et suffisantes.'
