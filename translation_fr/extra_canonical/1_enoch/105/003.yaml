  - severity: medium
    issue: « Il sera demandé compte de toute votre détresse aux anges » surinterprète le passif de recherche/enquête et est syntaxiquement ambigu.
    rationale: La source dit que toute la détresse sera recherchée/enquêtée « auprès de / de la part des » anges et des complices. « Faire l’objet d’une enquête auprès de » maintient le caractère judiciaire et la relation syntaxique sans imposer plus précisément la culpabilité ou la procédure.
  - severity: low
    issue: « Quant à votre cri, criez » est une répétition peu naturelle en français.
    rationale: La répétition source peut être préservée par l’impératif « Criez », tandis que « pour vous-mêmes » restitue l’élément pronominal de manière idiomatique.
  revised_text: Criez pour vous-mêmes, et il vous le fera voir[a] ; car toute votre détresse fera l’objet d’une enquête auprès des anges[b] et auprès de tous ceux qui ont aidé ceux qui vous ont dépouillés[c].
