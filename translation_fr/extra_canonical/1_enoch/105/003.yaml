review_pass:
  verdict: revise
  source_fidelity: 'La correction lexicale récente est bien intégrée dans la dernière proposition : አርደእዎሙ signifie « ont aidé » et የሀይዱክሙ « vous ont dépouillés / pillés ». « Anges » demeure un rendu défendable de መላእክት dans ce contexte apocalyptique, avec une note qui signale ses autres emplois possibles. En revanche, le français omet la valeur de ዚአክሙ (« pour vous / en votre faveur »), et « il sera demandé compte de toute votre détresse aux anges » transforme de façon un peu trop affirmative la recherche/enquête passive exprimée par ይትኃሠሥ.'
  naturalness: « Quant à votre cri, criez » est pesant et peu idiomatique en français actuel. « Criez pour vous-mêmes » est plus naturel tout en conservant l'impératif et la référence aux destinataires. « Toute votre détresse fera l’objet d’une enquête auprès de… » exprime plus clairement et plus naturellement la tournure judiciaire passive sans affirmer indûment une formule technique de reddition de comptes.
  terminology: « Anges », « détresse », « aidé » et « dépouillés » conviennent. Le sujet implicite de l’action de montrer ne doit pas être identifié ; « il vous le fera voir » le conserve sans ajout doctrinal.
