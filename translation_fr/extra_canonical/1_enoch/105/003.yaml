base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: fr
  text: Criez pour vous-mêmes, et il vous le fera voir[a] ; car toute votre détresse fera l’objet d’une enquête auprès des anges[b] et auprès de tous ceux qui ont aidé ceux qui vous ont dépouillés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le passage est difficile. On pourrait aussi traduire : « et il vous le révélera » ou « et cela vous apparaîtra ».'
    reason: Incertitude syntaxique et variante lexicale dans la proposition de manifestation.
  - marker: b
    text: Le mot peut aussi désigner des messagers et, dans certains contextes, des chefs ou des autorités.
    reason: Préserver l’étendue lexicale de መላእክት sans effacer le sens apocalyptique retenu dans le texte.
  - marker: c
    text: 'Littéralement : « tous ceux qui ont aidé ceux qui vous ont pillés ».'
    reason: Signaler la relation syntaxique entre les complices et les auteurs du pillage, ainsi que l’équivalent plus littéral du dernier verbe.
lexical_decisions:
- source_word: ወጽራኅ … ጽርኁ
  choice: Quant à votre cri, criez
  rationale: La répétition du radical exprimant le cri est conservée, ainsi que la force de l’impératif, sans ajouter l’idée de prière ou de jugement.
- source_word: ወያስተርኢ ለክሙ
  choice: et il vous le fera voir
  rationale: Le causatif du verbe « voir » exprime le fait de montrer ou de rendre manifeste. Le pronom « le » reprend le contenu du cri sans préciser davantage un passage difficile.
- source_word: ይትኃሠሥ ኵሉ ምንዳቤክሙ
  choice: il sera demandé compte de toute votre détresse
  rationale: Le verbe passif évoque une recherche ou une enquête. Cette formulation française garde la tonalité judiciaire et s’accorde avec les compléments introduits par « de/auprès de », sans réduire la détresse à la seule persécution.
- source_word: መላእክት
  choice: anges
  rationale: Dans le cadre cosmologique et judiciaire de 1 Hénoch, le sens habituel de « anges » est préférable à « messagers » ou « dirigeants », tout en laissant l’alternative lexicale en note.
- source_word: እለ አርደእዎሙ
  choice: ceux qui ont aidé
  rationale: Le verbe appartient à la racine « aider, assister » ; il décrit ici les complices des auteurs du pillage, et non ceux qui oppriment.
- source_word: ለእለ የሀይዱክሙ
  choice: ceux qui vous ont dépouillés
  rationale: Le verbe signifie voler, piller ou arracher. « Dépouiller » rend naturellement l’action exercée contre les destinataires.
theological_decisions:
- issue: L’identité des መላእክት dans la scène de reddition de comptes
  choice: les anges
  alternative: les messagers, les dirigeants ou les autorités
  rationale: « Anges » respecte l’usage dominant du terme et l’univers apocalyptique de 1 Hénoch. L’étrangeté de voir des anges concernés par l’enquête n’est pas supprimée par une harmonisation avec un cadre uniquement terrestre.
- issue: Le rapport entre les auxiliaires et les pillards dans la proposition finale
  choice: ceux qui ont aidé ceux qui vous ont dépouillés
  alternative: tous ceux qui vous ont dépouillés avec l’aide d’autrui
  rationale: La construction conserve deux groupes reliés par l’idée d’assistance, conformément aux valeurs lexicales corrigées des deux verbes, sans transformer « aider » en « opprimer » ni « dépouiller » en « égarer ».
- issue: Le sujet non exprimé de l’action de montrer
  choice: il vous le fera voir
  alternative: cela vous apparaîtra
  rationale: Le masculin singulier implicite est conservé sans être identifié. Cette solution évite de nommer Dieu lorsque le texte ne le fait pas, tout en maintenant la forme causative.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition « cri, criez » reproduit volontairement l’insistance du texte. « Il sera demandé compte » donne une formulation française naturelle à la recherche judiciaire exprimée au passif, tout en maintenant l’étrangeté théologique de la responsabilité éventuelle des anges.
