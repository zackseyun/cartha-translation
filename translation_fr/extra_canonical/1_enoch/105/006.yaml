base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: fr
  text: Et maintenant, vous qui êtes justes, n’ayez pas peur quand vous voyez les pécheurs devenir puissants et réussir dans leur conduite. Ne devenez pas leurs compagnons, mais tenez-vous loin de leur oppression[a], car vous serez les compagnons des êtres bons du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur violence » ou « de leur injustice ».
    reason: Le terme guèze peut désigner l’oppression, la violence ou l’injustice.
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: n’ayez pas peur
  rationale: Impératif négatif adressé aux justes; cette formulation est directe et naturelle en français moderne.
- source_word: ጻድቃን
  choice: vous qui êtes justes
  rationale: Conserve l’adresse nominale au groupe des justes tout en évitant la tournure moins naturelle « justes » employée seule en apostrophe.
- source_word: ይጸንዑ
  choice: devenir puissants
  rationale: Le verbe exprime l’affermissement ou l’accroissement de la force; ici, il décrit la puissance apparente des pécheurs.
- source_word: ይደልዉ፡ ፍኖቶሙ
  choice: réussir dans leur conduite
  rationale: Rend à la fois l’idée de succès et l’image de la « voie » comme manière de vivre, sans suggérer que cette conduite est moralement bonne.
- source_word: ሱቱፋነ
  choice: compagnons
  rationale: Le même terme est repris dans les deux propositions; « compagnons » préserve le parallélisme entre l’association refusée avec les pécheurs et l’association promise avec les êtres célestes.
- source_word: ግፍዐ
  choice: oppression
  rationale: Le mot peut désigner la violence, l’injustice ou l’oppression. « Oppression » souligne ici le tort exercé sur autrui tout en laissant l’alternative en note.
- source_word: ኄራነ፡ ሰማይ
  choice: les êtres bons du ciel
  rationale: ኄራነ est le pluriel construit de « bon » et signifie « les bons de ». Cette traduction conserve l’identité collective sans la réduire aux anges ni la confondre avec l’armée céleste.
theological_decisions:
- issue: Identité du groupe céleste dans la promesse finale
  choice: les êtres bons du ciel
  alternative: les bons du ciel
  rationale: Le texte désigne collectivement ceux qui sont bons dans le ciel sans préciser qu’il s’agit exclusivement des anges. « Êtres » donne une formulation française naturelle tout en maintenant cette indétermination.
- issue: Nature du succès apparent des pécheurs
  choice: réussir dans leur conduite
  alternative: prospérer dans leurs voies
  rationale: Le passage constate leur réussite visible sans approuver moralement leur conduite. La traduction maintient la tension entre prospérité présente et opposition éthique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme autour de « compagnons » est conservé, ainsi que le contraste entre les pécheurs et les êtres bons du ciel.
