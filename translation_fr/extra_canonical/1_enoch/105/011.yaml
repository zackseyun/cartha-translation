base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: fr
  text: Et lorsqu’ils écriront fidèlement toutes les paroles dans leurs langues[a], et qu’ils ne changeront ni ne retrancheront rien de mes paroles, mais écriront tout fidèlement — toutes les choses antérieures[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur/dans leurs langues »; le contexte de l’écriture permet aussi de comprendre « dans leurs langues » au sens des langues de différentes communautés.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est condensée en guèze. On peut aussi comprendre : « tout ce qui avait été écrit auparavant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: Et lorsqu’
  rationale: Introduit une proposition temporelle tout en conservant le lien avec le contexte précédent.
- source_word: ኵሎ፡ ነገራተ፡
  choice: toutes les paroles
  rationale: Le nom désigne ici des paroles mises par écrit; aucun suffixe de première personne n’apparaît dans cette première occurrence.
- source_word: ይጽሐፉ፡
  choice: ils écriront
  rationale: Le verbe est actif et partage son sujet avec les verbes suivants; le futur français convient au cadre prospectif de la proposition temporelle.
- source_word: በርትዕ፡
  choice: fidèlement
  rationale: Exprime à la fois la justesse et l’intégrité de la transmission écrite.
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: dans leurs langues
  rationale: Littéralement « sur/dans leurs langues »; dans ce contexte de transmission écrite, l’expression désigne naturellement les langues employées.
- source_word: ወኢይዌልጡ፡
  choice: sans rien changer
  rationale: Rend clairement l’interdiction de modifier ou d’altérer le texte.
- source_word: ወኢየሐጽጹ፡
  choice: ni rien retrancher
  rationale: Conserve l’image de la soustraction tout en restant idiomatique en français.
- source_word: እምነገራቲየ፡
  choice: de mes paroles
  rationale: Préserve explicitement le suffixe de première personne, absent de la première occurrence.
- source_word: አላ፡
  choice: mais
  rationale: Marque le contraste entre modification ou retranchement et transcription fidèle.
- source_word: ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: en écrivant tout fidèlement
  rationale: Maintient la répétition insistante de l’ordre de tout consigner avec exactitude.
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: toutes les choses antérieures
  rationale: Reproduit la formulation comprimée du guèze sans ajouter explicitement l’idée de choses déjà écrites.
theological_decisions:
- issue: Nature de la fidélité exigée
  choice: Une transmission écrite fidèle dans différentes langues, sans modification ni retranchement.
  alternative: Une exhortation générale à la véracité morale, ou une proclamation orale « sur leurs langues ».
  rationale: La répétition du verbe « écrire » et les interdictions de changer et de retrancher orientent nettement vers la fidélité textuelle, tout en laissant la note signaler le sens littéral de « langues ».
- issue: Sens de la clausule finale
  choice: « toutes les choses antérieures »
  alternative: « tout ce qui avait été écrit auparavant »
  rationale: Le guèze est elliptique et ne répète pas explicitement « écrit » dans cette clausule; la traduction principale évite donc de préciser au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe active du guèze est conservée; « fidèlement » rend la rectitude et l’exactitude sans réduire le terme à une simple précision technique. Le tiret maintient le caractère suspendu et elliptique de la clausule finale.
