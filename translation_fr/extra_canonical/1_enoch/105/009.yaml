base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: fr
  text: Ne vous égarez pas dans vos cœurs et ne mentez pas. N’altérez pas la parole de droiture[a] et ne déclarez pas fausse la parole du Saint et Grand[b]. Ne tenez pas vos idoles pour quoi que ce soit[c], car toute votre fausseté et toute votre impureté ne sont pas au service de la justice, mais d’un grand péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Ne déformez pas la parole de justice » ou « Ne pervertissez pas ce qui est droit ».'
    reason: lexical_alternative
  - marker: b
    text: Le titre peut être rendu par « le Grand Saint » ou « le Saint et Grand [Être] ». Le mot rendu par « parole » peut également signifier « affaire » ou « chose ».
    reason: textual_ambiguity
  - marker: c
    text: 'Littéralement, le verbe signifie « compter », « estimer » ou « considérer » ; le sens peut être : « n’accordez aucune valeur à vos idoles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትርሥዑ፡ በልብክሙ
  choice: Ne vous égarez pas dans votre cœur
  rationale: Le verbe exprime l’idée de s’égarer ou de mal agir. « Ne vous égarez pas » conserve cette latitude sans préciser indûment « péchez » ou « soyez mauvais ». Le singulier collectif « votre cœur » est naturel en français tout en gardant l’image anthropologique du texte.
- source_word: ወኢተሐስዉ
  choice: et ne mentez pas
  rationale: Formulation française directe et courante pour l’interdiction simple de proférer le mensonge.
- source_word: ወአትሚጥዋ፡ ለነገረ፡ ርትዕ
  choice: N’altérez pas la parole de droiture
  rationale: Le verbe peut évoquer l’altération, la déformation ou la perversion. « Altérer » reste proche du sens premier sans en accentuer la gravité. « Parole » convient au contexte de mensonge et de déclaration, tandis que « droiture » distingue ርትዕ du terme ጽድቅ employé ensuite.
- source_word: ወኢታሐስውዋ፡ ለነገረ፡ ቅዱስ፡ ዐቢይ
  choice: et ne déclarez pas fausse la grande parole sainte
  rationale: La forme verbale causative/factitive signifie ici déclarer faux ou traiter de mensonge, et non simplement mentir au sujet de quelque chose. Les deux adjectifs sont conservés comme qualifications de « parole », lecture syntaxiquement immédiate du guèze.
- source_word: ወኢትሕስብዋ፡ ለጣዖትክሙ
  choice: Ne tenez pas vos idoles pour quelque chose
  rationale: 'Le verbe relève du calcul et de l’estimation : tenir pour, compter ou considérer. Cette tournure française rend l’idée qu’il ne faut reconnaître aux idoles aucune valeur ou consistance, sans importer explicitement les notions de confiance ou de culte.'
- source_word: እስመ፡ አኮነት፡ ኵሉ፡ ሐሰትክሙ፡ ወኵሉ፡ ርኩስነክሙ፡ ለጽድቅ፡ አላ፡ ለኃጢአት፡ ዐቢይ
  choice: car toute votre fausseté et toute votre impureté ne sont pas au service de la justice, mais d’un grand péché
  rationale: 'La construction oppose l’orientation ou l’appartenance morale de la fausseté et de l’impureté : elles ne sont pas « pour » la justice, mais « pour » un grand péché. « Au service de » exprime ce rapport en français naturel sans transformer explicitement la phrase en conséquence (« conduisent à »).'
theological_decisions:
- issue: Identification de ቅዱስ ዐቢይ comme qualification de la parole ou comme titre personnel
  choice: la grande parole sainte
  alternative: la parole du Grand Saint
  rationale: Le texte place « sainte » et « grande » après « parole » sans marque génitive explicite. La traduction les traite donc d’abord comme des adjectifs de la parole. Une lecture comme titre divin reste possible et est signalée en note plutôt qu’imposée dans le texte.
- issue: Portée de la condamnation des idoles dans la proposition avec ትሕስብዋ
  choice: Ne tenez pas vos idoles pour quelque chose
  alternative: Ne mettez pas votre confiance dans vos idoles
  rationale: Le verbe signifie compter, estimer ou considérer. La traduction garde cette valeur cognitive et l’idée de l’inanité des idoles, sans ajouter la notion théologique plus précise de confiance, qui n’est pas exprimée directement.
- issue: Rapport de la fausseté et de l’impureté à la justice et au péché
  choice: ne sont pas au service de la justice, mais d’un grand péché
  alternative: ne conduisent pas à la justice, mais à un grand péché
  rationale: La formulation retenue préserve la relation peu spécifiée marquée par la préposition du texte, tandis que l’alternative en ferait explicitement une trajectoire ou un résultat.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs restent directs. Le passage est segmenté en trois phrases pour éviter une accumulation lourde de coordinations, sans modifier la progression des interdictions. Les termes « droiture », « justice », « fausseté » et « impureté » maintiennent les distinctions lexicales et le registre moral du texte.
