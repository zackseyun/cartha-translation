    issue: « de vous viendra un jugement éternel » donne au jugement une provenance issue des destinataires.
    rationale: La construction française signifie que les destinataires produisent ou font venir le jugement. Or l’enchaînement des propositions est consolateur et la préposition guèze እምኔክሙ signifie d’abord « de vous »; dans ce contexte, elle marque le retrait ou l’éloignement du jugement. Il faut éviter tant l’inversion punitive « sur vous » que l’idée française d’une origine causale.
