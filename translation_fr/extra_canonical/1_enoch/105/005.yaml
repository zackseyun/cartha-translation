revisions:
- from: Qu’aurez-vous à faire ? Vous n’aurez pas à vous cacher au jour du grand jugement, et vous ne serez pas trouvés parmi les pécheurs[a] ; de vous viendra un jugement éternel[b], pour toutes les générations du monde[c].
  to: Qu’aurez-vous à faire ? Vous n’aurez pas à vous cacher au jour du grand jugement, et vous ne serez pas trouvés parmi les pécheurs[a] ; un jugement éternel sera loin de vous pour toutes les générations du monde[b].
  rationale: La révision corrige uniquement la relation du jugement aux destinataires et regroupe les deux notes lexicales finales sous un ancrage stable. Elle maintient la négation et l’ambiguïté réelle de la formulation guèze, sans adopter une émendation ni imposer une lecture punitive contraire au contexte de consolation.
