review_pass:
  verdict: revise
  source_fidelity: La première partie rend fidèlement la question rhétorique, la négation et la valeur réfléchie/passive de ትትኀብኡ. La leçon négative de « ne serez pas trouvés comme des pécheurs » doit être conservée, bien qu’elle soit syntaxiquement difficile. En revanche, « de vous viendra un jugement éternel » attribue en français l’origine du jugement aux destinataires. Dans le contexte immédiat de consolation des justes et avec እምኔክሙ (« de/loin de vous »), cette formulation n’est pas défendable comme sens contextuel. « Sera loin de vous » exprime la séparation impliquée sans transformer la préposition en « sur vous ».
  naturalness: Le français est globalement clair, solennel et moderne. « Qu’aurez-vous à faire ? » convient à la concision rhétorique du texte. « Un jugement éternel sera loin de vous » est plus naturel et cohérent que « de vous viendra un jugement éternel ».
  terminology: « Grand jugement », « pécheurs » et « jugement éternel » sont des équivalents sobres et appropriés. « Parmi les pécheurs » rend le sens judiciaire de façon idiomatique, tout en exigeant une note qui signale le comparatif littéral « comme des pécheurs ».
  issues:
