base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: fr
  text: Qu’aurez-vous à faire ? Vous n’aurez pas à vous cacher au jour du grand jugement, et vous ne serez pas trouvés parmi les pécheurs[a] ; un jugement éternel sera loin de vous pour toutes les générations du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous ne serez pas trouvés comme des pécheurs ». La construction est difficile. Certains comprennent plutôt : « vous serez trouvés pécheurs », mais le texte guèze transmis comporte bien la négation.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « un jugement éternel sera de vous ». La préposition peut exprimer la provenance ou, dans ce contexte, la séparation : « sera loin de vous ». « Pour toutes les générations du monde » peut aussi se comprendre : « à travers les générations de l’éternité » ou « de l’âge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: Qu’aurez-vous à faire ?
  rationale: La construction interrogative, existentielle et verbale est concise. Cette formulation française conserve la question rhétorique sans en expliciter abusivement la portée.
- source_word: አኮ፡ ትትኀብኡ
  choice: Vous n’aurez pas à vous cacher
  rationale: La forme verbale peut avoir une valeur réfléchie ou passive. Dans le contexte d’une parole adressée aux justes, le réfléchi exprime naturellement qu’ils n’auront pas besoin de chercher refuge.
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: au jour du grand jugement
  rationale: Formule temporelle apocalyptique rendue dans un français solennel et courant.
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: et vous ne serez pas trouvés parmi les pécheurs
  rationale: Le verbe signifie « être trouvé » et ከመ peut marquer la comparaison ou l’appartenance en qualité de. « Parmi les pécheurs » donne ici un sens judiciaire intelligible sans supprimer la difficulté du texte, signalée en note.
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: un jugement éternel
  rationale: Littéralement, « un jugement qui est pour toujours ». « Éternel » conserve la notion de durée sans substituer « condamnation », terme plus interprétatif.
- source_word: ትከዉን፡ እምኔክሙ
  choice: de vous viendra
  rationale: La préposition እምኔክሙ signifie formellement « de vous ». Cette traduction maintient ce mouvement d’origine plutôt que de le renverser en « sur vous », tout en signalant l’ambiguïté contextuelle en note.
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: pour toutes les générations du monde
  rationale: La formulation garde visibles à la fois la succession des générations et la portée cosmique ou temporelle de ዓለም.
theological_decisions:
- issue: Portée de la question initiale
  choice: Une question rhétorique conservée sous la forme « Qu’aurez-vous à faire ? »
  alternative: « Que devrez-vous faire ? » ou « Quel recours aurez-vous ? »
  rationale: Le guèze est bref et ne précise pas explicitement s’il s’agit d’une obligation ou d’un recours. La traduction retenue préserve cette ouverture.
- issue: Identité des destinataires et valeur de la proposition sur les pécheurs
  choice: 'Maintenir la négation transmise : « vous ne serez pas trouvés parmi les pécheurs »'
  alternative: 'Émender ou comprendre : « vous serez trouvés pécheurs »'
  rationale: Le témoin guèze porte une négation. Bien que la syntaxe ait été jugée difficile, le contexte de consolation des justes permet de la conserver sans correction conjecturale.
- issue: Relation entre le jugement éternel et les destinataires
  choice: « de vous viendra un jugement éternel »
  alternative: « le jugement éternel sera loin de vous » ou « le jugement éternel sera sur vous »
  rationale: La préposition exprime d’abord la provenance. Traduire « sur vous » introduirait une relation adverse non marquée par cette préposition et créerait une tension avec les deux propositions rassurantes précédentes. « Loin de vous » est contextuellement possible, mais ajoute explicitement une idée de distance. Le texte principal conserve donc la formulation de provenance, avec une note exposant les lectures.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme garde la solennité apocalyptique sans archaïsmes. Les formulations ambiguës du guèze sont conservées dans le texte ou explicitées en notes plutôt que résolues par une lecture doctrinale.
