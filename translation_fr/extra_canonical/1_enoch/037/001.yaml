base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: fr
  text: 'La deuxième[a] vision qu’il vit : la vision de sagesse que vit Hénoch, fils de Yéred, fils de Mahalalel, fils de Kaïnan, fils d’Énosh, fils de Seth, fils d’Adam[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Une autre vision qu’il vit ». Le mot guèze peut signifier « autre » ou « deuxième » ; « deuxième » est retenu ici parce que la suscription semble marquer une succession.'
    reason: lexical_alternative
  - marker: b
    text: La répétition de « fils de » reproduit la chaîne généalogique telle que la présente la suscription.
    reason: cultural_note
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: vision
  rationale: Le nom désigne ici une révélation reçue sous forme de vision. Sa répétition est conservée afin de respecter la formulation appositive et insistante du guèze.
- source_word: ዘርእየ
  choice: qu’il vit / que vit Hénoch
  rationale: La construction relative est rendue directement. La répétition du verbe, présente dans le texte source, demeure visible en français.
- source_word: ካልእ
  choice: deuxième
  rationale: Dans cette suscription, le mot peut marquer la succession des visions. Comme il peut aussi signifier « autre », cette possibilité est signalée en note.
- source_word: ጥበብ
  choice: sagesse
  rationale: Ce sens courant du terme conserve la caractérisation particulière de la révélation sans la réduire à une vision générique.
- source_word: ወልደ
  choice: fils de
  rationale: La formule généalogique explicite est répétée comme dans le texte source, plutôt que généralisée en « descendant de ».
- source_word: ሄኖክ
  choice: Hénoch
  rationale: Forme française traditionnelle du nom dans le titre et la réception de l’ouvrage.
- source_word: ያሬድ
  choice: Yéred
  rationale: Forme biblique française reconnaissable et proche du nom guèze.
- source_word: መላልኤል
  choice: Mahalalel
  rationale: Forme biblique française courante permettant d’identifier clairement le personnage.
- source_word: ቃይናን
  choice: Kaïnan
  rationale: Cette transcription reste proche de la forme guèze et évite de la normaliser silencieusement selon une autre tradition textuelle.
- source_word: ሄኖስ
  choice: Énosh
  rationale: Forme française reconnaissable correspondant au nom sémitique transmis ici.
theological_decisions:
- issue: Structure répétitive de la suscription
  choice: Conserver les deux mentions de « vision » et les deux formes du verbe « voir ».
  alternative: Fusionner les deux groupes en « La deuxième vision de sagesse que vit Hénoch ».
  rationale: Le guèze présente deux groupes distincts et apposés. Les fusionner rendrait le français plus lisse, mais effacerait une répétition réelle du texte source.
- issue: Valeur de ካልእ
  choice: Traduire par « deuxième » dans le texte et signaler « autre » en note.
  alternative: Une autre
  rationale: Le contexte de suscription permet une valeur séquentielle, mais le lexème garde une ambiguïté authentique qui ne doit pas être dissimulée.
- issue: Présentation de la généalogie
  choice: Maintenir toute la chaîne généalogique jusqu’à Adam et répéter « fils de ».
  alternative: Abréger la généalogie ou employer « descendant de ».
  rationale: La généalogie situe explicitement Hénoch dans l’histoire des origines; son ampleur et sa forme font partie du contenu de la suscription.
translation_notes:
  register: Français international actuel, sobre et digne. La ponctuation par deux-points rend lisible l’apposition sans supprimer la répétition caractéristique du texte source. Les noms propres suivent des formes françaises reconnaissables tout en maintenant Kaïnan, proche du témoin guèze.
