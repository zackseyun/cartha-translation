  source_fidelity: Le sens de እስከ ይእዜ, de la passive « ne m’avait pas été donné », du titre divin et de la valeur de provenance de እምቅድመ est conservé. « Ce que j’ai reçu » est une interprétation contextuellement défendable de ዘነሣእኩ, en relation avec « être donné », sans introduire d’objet absent du guèze.
