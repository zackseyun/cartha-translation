base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/004.yaml
  text: Until now[a], it had not been given to me before the Lord of Spirits[b], what I have received.
translation:
  language: fr
  text: Jusqu’à présent, ce que j’ai reçu ne m’avait pas encore été donné d’auprès du Seigneur des esprits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « de devant le Seigneur des esprits ». Le dernier verbe peut aussi signifier « prendre » ou « soulever » ; dans ce contexte, il est compris comme « recevoir », sans que le texte précise ce qui a été reçu.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስከ፡ ይእዜ
  choice: Jusqu’à présent
  rationale: Cette expression temporelle indique que le don n’avait pas eu lieu avant le moment évoqué.
- source_word: ኢተውህበኒ
  choice: ne m’avait pas été donné
  rationale: La forme passive avec suffixe de première personne est rendue naturellement en français; le plus-que-parfait exprime l’état antérieur sans créer la contradiction que produirait ici un passé composé.
- source_word: እምቅድመ
  choice: de devant
  rationale: Cette formulation conserve à la fois l’idée de provenance et la nuance de présence attachées à l’expression guèze, malgré son caractère volontairement élevé en français.
- source_word: እግዚአ፡ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Ce titre divin récurrent est traduit littéralement et sans ajout d’article devant « esprits », conformément à l’usage français naturel.
- source_word: ዘነሣእኩ
  choice: ce que j’ai reçu
  rationale: Le verbe ነሣእ peut signifier prendre ou recevoir; associé ici à « être donné », « reçu » forme une paire sémantique naturelle tout en laissant l’objet non précisé.
theological_decisions:
- issue: Sens du dernier verbe et nature de son objet
  choice: « ce que j’ai reçu » sans préciser l’objet
  alternative: « ce que j’ai pris en charge », « ce que j’ai prononcé » ou « la parabole que j’ai entreprise »
  rationale: Le texte guèze ne nomme pas explicitement l’objet. La traduction retient le sens contextuellement naturel de réception sans introduire « parabole », « discours » ou une autre précision interprétative.
- issue: Valeur de እምቅድመ devant le titre divin
  choice: 'provenance depuis la présence du Seigneur: « de devant le Seigneur »'
  alternative: 'simple position: « devant le Seigneur »'
  rationale: La préposition እም marque normalement la provenance. La conserver évite d’effacer la nuance selon laquelle le don vient de la présence ou de l’autorité divine.
translation_notes:
  register: Français moderne, digne et lisible. « De devant » est plus soutenu et moins courant, mais il préserve une nuance du guèze que « devant » seul ferait disparaître.
