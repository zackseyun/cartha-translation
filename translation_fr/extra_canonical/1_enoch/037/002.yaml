base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: fr
  text: 'Et voici le commencement de la parole de sagesse que j’ai élevée afin de la proclamer[a] à ceux qui habitent sur la terre ferme[b] : Écoutez, vous les premiers, et voyez, vous les derniers[c], les saintes paroles que je prononce devant le Seigneur des esprits[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que j’ai élevée pour parler [et dire] ». Le second verbe est entre crochets dans l’édition du texte guèze.'
    reason: textual_and_lexical_note
  - marker: b
    text: 'Ou : « sur la terre sèche ». Dans ce contexte, l’expression peut désigner plus largement ceux qui vivent sur la terre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les premiers » et « les derniers » ; le contraste désigne probablement des générations antérieures et postérieures, non des rangs de valeur.'
    reason: cultural_note
  - marker: d
    text: 'Ou : « en présence du Seigneur des esprits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝ፡ ርእሱ፡
  choice: Et voici le commencement
  rationale: ርእስ signifie littéralement « tête », mais désigne ici le début ou l’ouverture du discours. La tournure française garde la fonction introductive du démonstratif.
- source_word: ነገረ፡ ጥበብ፡
  choice: la parole de sagesse
  rationale: ነገር peut désigner une parole, une affaire ou un discours. « Parole de sagesse » conserve la formulation élevée et relativement formelle de la source.
- source_word: ዘአንሣእኩ፡ እትናገር፡ [እብል፡]
  choice: que j’ai élevée pour la faire entendre
  rationale: « Élevée » conserve l’image du verbe አንሥአ, tandis que « pour la faire entendre » rend en français courant la visée proclamatoire des verbes de parole, dont l’un est transmis entre crochets dans l’édition.
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ፡
  choice: à ceux qui habitent sur la terre ferme
  rationale: La traduction maintient l’image concrète de የብስ, la terre sèche ou ferme, sans la généraliser silencieusement en « monde ».
- source_word: ስምዑ፡ ቀደምት፡ ወርእዩ፡ ደኃርያን፡
  choice: Écoutez, vous qui êtes venus les premiers, et voyez, vous qui viendrez après
  rationale: Cette formulation conserve les deux impératifs ainsi que l’opposition temporelle entre les premiers et ceux d’après, tout en évitant que « les premiers » et « les derniers » soient compris comme des rangs de valeur.
- source_word: ነገረ፡ ቅዱሰ፡ እለ፡ እትናገር፡
  choice: les saintes paroles que je prononce
  rationale: ቅዱሰ est ici un adjectif accordé avec ነገረ, et le relatif pluriel እለ indique que ነገረ fonctionne au pluriel. La traduction évite donc l’ancienne analyse « la parole du Saint ».
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት።
  choice: devant le Seigneur des esprits
  rationale: « Devant » rend directement ቅድመ, et « Seigneur des esprits » conserve de manière cohérente le titre divin caractéristique du livre.
theological_decisions:
- issue: Analyse de « saintes paroles »
  choice: Comprendre ቅዱሰ comme un adjectif qualifiant les paroles
  alternative: Comprendre l’expression comme « la parole du Saint »
  rationale: La morphologie de ቅዱሰ et le relatif pluriel እለ soutiennent l’analyse adjectivale et plurielle. La traduction ne transforme donc pas « saint » en titre divin.
- issue: Portée des habitants de la terre ferme
  choice: Conserver l’image concrète des habitants de la terre ferme
  alternative: Expliciter directement « tous les habitants de la terre » ou « du monde »
  rationale: Le contexte peut viser largement l’humanité, mais le texte emploie une image géographique concrète qu’il convient de préserver.
- issue: Identité des premiers et de ceux qui viendront après
  choice: Laisser ouverte l’adresse à des groupes ou générations de différentes époques
  alternative: Identifier précisément deux générations historiques ou deux catégories eschatologiques
  rationale: Le contraste temporel est clair, mais le verset ne précise pas davantage l’identité des destinataires. La traduction évite une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international actuel, solennel sans archaïsmes. La syntaxe conserve le parallélisme de l’appel prophétique, tandis que les formulations potentiellement obscures sont éclairées en notes plutôt que remplacées par une interprétation.
