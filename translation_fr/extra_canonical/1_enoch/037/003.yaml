base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: fr
  text: Il vaut mieux parler aux premiers[a] ; mais nous ne priverons pas non plus les derniers du commencement de la sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « à ceux qui sont premiers ». Il peut s’agir de ceux d’autrefois ou du premier des deux groupes évoqués ; leur identité n’est pas précisée.
    reason: ambiguity
  - marker: b
    text: Littéralement, « la tête de la sagesse » ; l’expression peut aussi signifier « le principe » ou « la partie principale de la sagesse ».
    reason: translation_note
lexical_decisions:
- source_word: እሉ፡ ቀዳሚ
  choice: aux premiers
  rationale: Le démonstratif et l’adjectif renvoient vraisemblablement aux personnes d’autrefois ou mentionnées en premier. La formulation concise conserve l’opposition avec « les derniers » sans préciser abusivement leur identité.
- source_word: ይኄይስ
  choice: Il vaut mieux
  rationale: Cette forme du verbe ኀየሰ exprime ce qui est meilleur ou préférable ; elle ne désigne pas une parabole.
- source_word: ብሂል
  choice: parler
  rationale: L’infinitif signifie « dire, parler ». Il dépend naturellement de « Il vaut mieux ».
- source_word: ወደኃርያንሂ
  choice: mais … non plus les derniers
  rationale: Le terme désigne ceux qui sont après, les derniers ou les générations ultérieures. « Non plus » rend la particule additive, tandis que « mais » explicite en français le contraste entre les deux groupes.
- source_word: ኢንከልእ
  choice: nous ne priverons pas
  rationale: La forme verbale à la première personne du pluriel vient de ከልአ, « retenir, refuser, priver ». Cette tournure française exprime naturellement le fait de ne pas refuser quelque chose à quelqu’un.
- source_word: ርእሳ
  choice: du commencement
  rationale: Le sens premier est « tête » ; dans ce contexte, le mot peut désigner le début, le principe ou la partie principale. « Commencement » reste proche du sens transmis sans transformer le terme en explication doctrinale.
- source_word: ለጥበብ
  choice: de la sagesse
  rationale: Le complément est rendu par un génitif naturel en français et conserve la portée sapientielle du terme.
theological_decisions:
- issue: Identité des « premiers » et des « derniers »
  choice: Conserver les désignations relationnelles « les premiers » et « les derniers »
  alternative: « ceux d’autrefois » et « ceux qui viendront après eux »
  rationale: Le texte oppose deux groupes sans les identifier explicitement. La traduction évite de décider s’il s’agit d’ancêtres, de contemporains ou de générations futures.
- issue: Sens de « tête de la sagesse »
  choice: « commencement de la sagesse »
  alternative: « principe de la sagesse » ou « partie essentielle de la sagesse »
  rationale: L’expression demeure difficile. « Commencement » conserve la métaphore de la tête comme point initial sans imposer qu’il s’agisse de la source absolue ou de l’essence de la sagesse.
translation_notes:
  register: Français international actuel, sobre et digne. La structure antithétique du guèze est conservée, tout en employant « priver quelqu’un de » pour rendre naturellement le verbe « retenir/refuser ». Les notes signalent les deux ambiguïtés réelles sans réintroduire l’ancienne lecture fautive qui comprenait « parabole » et « autre commencement ».
