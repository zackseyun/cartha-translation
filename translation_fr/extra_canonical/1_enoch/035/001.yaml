base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: fr
  text: De là, je me dirigeai vers l’ouest, jusqu’aux extrémités de la terre. Là, je vis trois ouvertures du ciel, ouvertes[a], semblables à celles que j’avais vues à l’est, correspondant aux ouvertures et à leurs issues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trois portes du ciel ouvertes » ou « trois portails du ciel ouverts »; le terme guèze désigne des ouvertures dans la structure céleste.
    reason: lexical_alternative
  - marker: b
    text: La correspondance peut concerner la disposition ou la mesure des ouvertures et de leurs issues.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ
  choice: De là, je me dirigeai
  rationale: Rend naturellement la formule de transition narrative et le mouvement orienté, sans ajouter l’idée d’un long voyage.
- source_word: መንገለ፡ ዐረብ
  choice: vers l’ouest
  rationale: ዐረብ désigne ici l’ouest, associé au coucher du soleil; cette lecture correspond aussi à la succession des points cardinaux dans les chapitres 33 à 36.
- source_word: በአጽናፈ፡ ምድር
  choice: jusqu’aux extrémités de la terre
  rationale: Conserve la géographie cosmique et le registre visionnaire du texte.
- source_word: ሠለስተ፡ ኆዋኅወ፡ ሰማይ
  choice: trois ouvertures du ciel
  rationale: « Ouvertures » préserve la portée générale de ኆዋኅወ et évite de préciser indûment s’il s’agit de portes, de portails ou de fenêtres.
- source_word: ርኁዋተ
  choice: grandes ouvertes
  rationale: Rend clairement l’état d’ouverture indiqué par l’adjectif et produit une expression française idiomatique.
- source_word: በከመ፡ ርኢኩ፡ በምሥራቅ
  choice: semblables à celles que j’avais vues à l’est
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la vision orientale, tandis que « celles » reprend les ouvertures.
- source_word: በአምጣነ፡ ኆዋኅው
  choice: correspondant aux ouvertures
  rationale: 'Préserve la répétition lexicale du terme désignant les ouvertures et laisse ouverte la nature exacte de la correspondance: disposition, proportion ou mesure.'
- source_word: ወበአምጣነ፡ ሞፃእቱ
  choice: et à leurs issues
  rationale: « Issues » restitue le sens de sorties ou de lieux de sortie dans l’architecture cosmique, sans supposer explicitement ce qui en sort.
theological_decisions:
- issue: Géographie cosmique et architecture céleste
  choice: Conserver littéralement « extrémités de la terre » et « ouvertures du ciel »
  alternative: Moderniser en « très loin vers l’ouest » et « ouvertures dans le ciel »
  rationale: Le passage décrit une topographie visionnaire structurée. La traduction conserve cette représentation sans la rationaliser selon une cosmologie moderne.
- issue: Nature de la correspondance entre les ouvertures
  choice: Employer « correspondant » sans préciser s’il s’agit de mesure ou de disposition
  alternative: Traduire par « de mêmes dimensions » ou « disposées de la même façon »
  rationale: Le syntagme en በአምጣነ permet plusieurs nuances; une formulation non spécifiée préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit. La formulation conserve l’imagerie cosmique tout en restant accessible; les variantes lexicales importantes sont signalées en notes.
