base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: fr
  text: Que votre esprit ne s’attriste pas à cause des temps, car le Saint et le Grand a fixé des jours pour tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toute chose » ou « pour chacun ». La formule guèze est générale et peut désigner soit l’ensemble des choses, soit toutes les personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  choice: Que … ne s’attriste pas
  rationale: Rend naturellement en français l’impératif négatif du verbe exprimant la tristesse, tout en gardant l’accent sur l’état intérieur.
- source_word: መንፈስክሙ
  choice: votre esprit
  rationale: Conserve le sens de souffle, esprit ou disposition intérieure et le registre élevé du texte.
- source_word: በአዝማን
  choice: à cause des temps
  rationale: La préposition est comprise ici comme causale; « les temps » maintient la portée historique et apocalyptique de la formule.
- source_word: መዋዕለ
  choice: des jours
  rationale: Traduction concrète et formellement proche du nom guèze, même si le contexte peut évoquer des périodes déterminées.
- source_word: ወሀበ
  choice: a fixé
  rationale: Le verbe signifie fondamentalement « donner », mais avec « jours » il exprime naturellement l’idée d’une attribution ou détermination temporelle.
- source_word: ቅዱስ ወዐቢይ
  choice: le Saint et le Grand
  rationale: Préserve les deux épithètes divines comme un titre révérenciel, dans une formulation française concise et digne.
- source_word: ለኵሉ
  choice: pour tous
  rationale: Reproduit sans ajout explicatif le caractère général et ambigu de la formule guèze, qui peut viser toutes les personnes ou, plus largement, toute chose.
theological_decisions:
- issue: Portée de l’établissement divin exprimé par ለኵሉ
  choice: pour tous
  alternative: pour toute chose / pour chacun
  rationale: La source ne précise pas le référent. Le texte principal conserve donc cette indétermination au lieu de restreindre la formule aux personnes ou de l’étendre explicitement à toutes choses.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, tandis que les titres divins et le vocabulaire temporel conservent la tonalité apocalyptique. L’ambiguïté finale de la source est maintenue dans le texte et explicitée en note.
