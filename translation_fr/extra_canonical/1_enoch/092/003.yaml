base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: fr
  text: Et le juste se lèvera de son sommeil[a] ; il se lèvera et marchera sur le chemin de la justice. Tout son chemin et sa conduite seront marqués par la bonté et par une bienveillance éternelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « sommeil » peut être compris au sens propre ou comme l’image d’un réveil à une vie renouvelée ; le verset ne tranche pas.
    reason: lexical_alternative
  - marker: b
    text: Ou « une miséricorde éternelle », « une douceur éternelle » ou « une faveur éternelle » ; le terme guèze couvre plusieurs nuances de clémence et de bienveillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነሣእ
  choice: se lèvera
  rationale: Le verbe exprime le fait de se lever ou d’être relevé. La forme pronominale française reste naturelle et n’impose pas une lecture explicitement passive ou résurrectionnelle.
- source_word: ጻድቅ
  choice: le juste
  rationale: Le singulier est conservé sans introduire une identification messianique ou collective absente du verset.
- source_word: እምንዋም
  choice: de son sommeil
  rationale: L’expression indique le point de départ, le sommeil. Le possessif est naturel en français et ne tranche pas entre sommeil littéral et image d’une vie renouvelée.
- source_word: የኃልፍ
  choice: marchera
  rationale: Dans l’image du chemin de la justice, « marchera » rend naturellement le mouvement tout en préservant la portée éthique de la métaphore.
- source_word: በፍኖተ ጽድቅ
  choice: sur le chemin de la justice
  rationale: Cette formulation française claire conserve l’image de la voie et la notion de justice, sans surinterprétation.
- source_word: ኵሉ ፍኖቱ
  choice: tout son chemin
  rationale: Le singulier et la totalité exprimée dans la source sont maintenus, malgré une légère étrangeté voulue en français.
- source_word: ምሕዋሩ
  choice: sa conduite
  rationale: Le terme peut évoquer le parcours, la manière d’avancer ou la conduite. « Sa conduite » convient au contexte moral tout en restant distinct de « chemin ».
- source_word: በኂሩት
  choice: marqués par la bonté
  rationale: « Bonté » conserve l’étendue morale du terme. La tournure « marqués par » produit un français naturel pour décrire l’ensemble du chemin et de la conduite.
- source_word: በሣህል ዘለዓለም
  choice: par une bienveillance éternelle
  rationale: « Bienveillance » garde les nuances de faveur, douceur, clémence et bonté gracieuse sans réduire le terme à la seule miséricorde ; « éternelle » rend directement la durée sans fin.
theological_decisions:
- issue: Le lever hors du sommeil désigne-t-il explicitement la résurrection des morts ou un réveil figuré ?
  choice: 'Le texte principal conserve l’image : « se lèvera de son sommeil ».'
  alternative: Comprendre l’expression comme une résurrection corporelle ou comme un réveil moral et spirituel.
  rationale: Le guèze associe sommeil et relèvement, mais ne mentionne explicitement ni la mort ni une formule développée de résurrection. La traduction préserve donc cette tension.
- issue: La répétition du verbe « se lever »
  choice: 'La répétition est conservée : « se lèvera… ; il se lèvera ».'
  alternative: Fusionner les deux occurrences pour alléger le français.
  rationale: La répétition appartient à la rhétorique du texte source et doit rester perceptible, même si elle est inhabituelle en français.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la reprise asyndétique de « se lèvera ». Le choix « bienveillance » est plus idiomatique que « caractère gracieux » et moins doctrinalement déterminé que « miséricorde ».
