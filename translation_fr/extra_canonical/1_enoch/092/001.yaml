base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: fr
  text: Le livre écrit par Hénoch — [Hénoch écrivit en effet chaque signe de sagesse, lui qui est célébré parmi tous les humains et juge de toute la terre][a] — pour tous mes enfants qui habiteront sur la terre ferme[b], et pour les générations à venir[c] qui pratiqueront la justice et la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage entre crochets paraît textuellement instable dans le témoin éthiopien utilisé. Il est conservé ici dans une traduction prudente plutôt que supprimé.
    reason: textual_variant
  - marker: b
    text: Littéralement « sur le sec » ou « sur la terre sèche »; on traduit parfois plus simplement par « sur la terre » ou « dans le monde ».
    reason: lexical_alternative
  - marker: c
    text: 'La leçon transcrite est difficile. Elle est ici comprise, conformément à une correction proposée, comme désignant les générations ultérieures. Si l’on conserve et analyse autrement la forme transcrite, on pourrait comprendre : « pour une génération future, les élus, qui pratiqueront la justice et la paix ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: Le livre écrit par Hénoch
  rationale: La tournure relative passive introduit l’ouvrage comme un intitulé. « Livre » convient au registre de suscription, et « Hénoch » est la forme française usuelle du nom.
- source_word: ዘኵሉ፡ ትእምርተ፡ ጥበብ
  choice: chaque signe de sagesse
  rationale: La formulation garde le caractère concret et élevé de « signe » tout en rendant la portée distributive de ኵሉ. Elle évite de réduire l’expression à un simple enseignement.
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: célébré parmi tous les humains
  rationale: « Célébré » exprime naturellement l’idée de louange ou d’honneur. « Tous les humains » conserve la portée collective sans masculin générique marqué; « parmi » suit prudemment la lecture retenue par la couche de consultation.
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: juge de toute la terre
  rationale: Le substantif désigne ici une autorité exerçant jugement ou gouvernement. « Juge » suit directement la valeur nominale du texte transmis sans transformer la proposition en verbe de règne.
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: pour tous mes enfants
  rationale: Le possessif est explicite. « Enfants » préserve l’adresse familiale et inclusive.
- source_word: የኃድሩ፡ ዲበ፡ የብስ
  choice: qui habiteront sur la terre ferme
  rationale: La proposition relative se rattache naturellement à « mes enfants ». « Terre ferme » conserve l’image concrète de la terre sèche, contrairement à un lissage en « monde ».
- source_word: ለትውልድ፡ ይኃርያን
  choice: pour les générations à venir
  rationale: La révision textuelle fournie comprend le second terme comme une forme corrompue ou mal transcrite signifiant « ultérieures, futures ». La traduction suit cette lecture tout en signalant en note l’autre analyse possible du texte transcrit.
- source_word: ርተዐ፡ ወሰላመ
  choice: la justice et la paix
  rationale: « Justice » et « paix » rendent deux termes éthiques majeurs dans un français courant et digne. « Droiture » reste possible, mais « justice » conserve mieux la portée morale et relationnelle.
theological_decisions:
- issue: Faut-il comprendre ይኃርያን comme « à venir » ou comme « les élus » ?
  choice: les générations à venir
  alternative: une génération future, les élus, qui pratiqueront la justice et la paix
  rationale: Les révisions signalent probablement une erreur de transcription pour un terme signifiant « ultérieurs/futurs ». La traduction principale adopte cette correction, mais la note conserve l’analyse traditionnelle de la forme effectivement transcrite afin de ne pas effacer une incertitude ayant une portée théologique.
- issue: Portée éthique de ርተዐ
  choice: justice
  alternative: droiture
  rationale: « Justice » garde la densité éthique du terme sans lui imposer une définition doctrinale plus précise que le contexte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La phrase conserve la forme de suscription et les crochets du témoin, tout en clarifiant par « lui qui » que les qualificatifs de la proposition entre crochets se rapportent à Hénoch. Les incertitudes textuelles et syntaxiques importantes sont reportées en notes plutôt que résolues silencieusement.
