base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: fr
  text: Ne vous affligez pas si votre âme est descendue au Shéol dans la tristesse[a] et si, durant votre vie, votre chair n’a pas connu un sort à la mesure de votre bonté[b]. Mais attendez le jour du jugement des pécheurs et le jour de la malédiction et du châtiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Shéol » désigne le séjour des morts dans la pensée juive ancienne; il ne correspond pas nécessairement à la conception chrétienne plus tardive de l’enfer.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « votre chair n’a pas reçu selon votre bonté ». Le verbe « recevoir » n’a pas d’objet exprimé en guèze; la phrase semble évoquer ce que les justes n’ont pas obtenu durant leur vie malgré leur bonté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: Ne vous affligez pas
  rationale: Rend naturellement en français moderne l’impératif négatif adressé au groupe, tout en conservant sa force émotionnelle.
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: si votre âme descend au Shéol
  rationale: Le verbe exprime explicitement une descente. « Shéol » conserve l’imagerie juive du séjour des morts sans l’assimiler à l’enfer au sens chrétien postérieur.
- source_word: በሐዘን
  choice: dans la tristesse
  rationale: Conserve la coloration affective de la descente et fait écho à l’exhortation initiale.
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ በከመ ኂሩትክሙ
  choice: si, durant votre vie, votre chair n’est pas traitée à la mesure de votre bonté
  rationale: Le verbe « recevoir/obtenir » n’a pas d’objet exprimé en guèze. Cette formulation française reste naturelle et suggère l’absence de juste rétribution sans préciser indûment ce qui n’a pas été reçu. « Chair » préserve le terme concret et théologiquement chargé du texte.
- source_word: አላ ጽንሑ
  choice: Mais attendez
  rationale: Le contraste oriente les destinataires de leur privation présente vers la justification future; « attendez » convient aux compléments temporels qui suivent tout en impliquant la persévérance.
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: le jour du jugement des pécheurs
  rationale: Préserve la formule judiciaire et apocalyptique ainsi que la référence explicite aux pécheurs.
- source_word: መርገም ወመቅሠፍት
  choice: la malédiction et du châtiment
  rationale: Rend les deux termes de manière compacte, sans imposer une forme particulière au châtiment annoncé.
theological_decisions:
- issue: Sens de ሲኦል
  choice: Shéol
  alternative: le séjour des morts; le monde souterrain; l’enfer
  rationale: La translittération préserve la cosmologie apocalyptique juive du texte et évite d’importer les connotations doctrinales plus tardives du mot « enfer ».
- issue: Sens de la proposition où la chair ne reçoit pas
  choice: la personne juste n’a pas été traitée dans sa vie corporelle à la mesure de sa bonté
  alternative: la chair n’a pas reçu de récompense dans cette vie; le corps n’a pas retrouvé la vie
  rationale: Le contexte oppose la souffrance présente au futur jugement des pécheurs. Comme l’objet du verbe « recevoir » demeure implicite, la traduction évoque l’absence de juste rétribution sans introduire explicitement le mot « récompense ».
- issue: Rapport entre jugement, malédiction et châtiment
  choice: maintenir la succession des expressions sans préciser leur chronologie ni leur identité exacte
  alternative: fusionner les expressions en un seul événement explicitement défini
  rationale: Le texte juxtapose des formules apocalyptiques sans expliquer si elles désignent un même moment sous plusieurs aspects; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’imagerie apocalyptique et le mot « chair », tandis que la tournure « n’est pas traitée à la mesure de » évite en français l’incomplétude d’un verbe « recevoir » sans complément. Le présent « descend » suit la forme conditionnelle du texte source et n’explicite pas davantage le moment de la mort.
