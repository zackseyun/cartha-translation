  text: And when you die[a], the sinners will say concerning you[b],
translation:
  language: fr
  text: 'Et quand vous mourrez, les pécheurs diront à votre sujet[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur vous » ; on pourrait aussi comprendre « contre vous » dans ce contexte hostile.
