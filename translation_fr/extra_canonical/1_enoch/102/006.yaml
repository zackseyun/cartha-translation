lexical_decisions:
- source_word: ወሶበ
  choice: Et quand
  rationale: La conjonction temporelle préfixée par « et » introduit la circonstance qui suit, sans marquer une forte opposition.
- source_word: ትመውቱ
  choice: vous mourrez
  rationale: Le verbe est à la deuxième personne du pluriel et appartient à la racine courante signifiant « mourir ». En français, la proposition introduite par « quand » appelle naturellement le futur pour cet événement à venir.
- source_word: ይብሉ
  choice: diront
  rationale: Le verbe signifie couramment « dire » et sert ici de formule introductive aux paroles qui suivent.
- source_word: ላዕሌክሙ
  choice: à votre sujet
  rationale: La préposition a littéralement le sens de « sur, au-dessus de », mais elle peut introduire le sujet d'un propos. Cette traduction conserve ici la fonction quotative sans imposer le sens hostile « contre vous ».
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Terme moral apocalyptique courant désignant la catégorie des pécheurs, en contraste avec les justes dans le contexte.
theological_decisions:
- issue: Portée des paroles prononcées par les pécheurs
  choice: les pécheurs diront à votre sujet
  alternative: les pécheurs parleront contre vous
  rationale: La préposition guèze permet une nuance plus littérale de parole « sur » quelqu'un, mais le verbe introduit vraisemblablement ici un discours direct poursuivi au verset suivant. « À votre sujet » préserve cette fonction et l'ambiguïté quant au caractère hostile des paroles, sans neutraliser le contexte d'opposition.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur « mourrez » est idiomatique après « quand ». Les deux-points signalent que le verbe « diront » introduit les paroles qui suivent.
