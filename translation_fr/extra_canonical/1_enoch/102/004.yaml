base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/004.yaml
  text: Do not fear[a], you souls of the righteous, and hope, you who have died in righteousness.
translation:
  language: fr
  text: N’ayez pas peur[a], vous, âmes des justes, et espérez, vous qui êtes morts dans la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprits des justes ». Le terme guèze peut désigner l’âme, la vie, la personne ou l’esprit selon le contexte.
    reason: Alternative lexicale
lexical_decisions:
- source_word: አትፍርሁ
  choice: N’ayez pas peur
  rationale: Impératif négatif au pluriel. Cette formulation moderne conserve la force directe de l’exhortation sans archaïsme.
- source_word: አንትሙ
  choice: vous
  rationale: Le pronom explicite de deuxième personne du pluriel est conservé dans l’adresse « vous, âmes des justes ».
- source_word: ነፍሰ ጻድቃን
  choice: âmes des justes
  rationale: ነፍስ peut désigner l’âme, la vie, la personne ou l’esprit. Dans cette adresse post mortem, « âmes » exprime naturellement l’identité persistante des justes sans imposer une distinction technique entre âme et esprit.
- source_word: ወተስፈዉ
  choice: et gardez espoir
  rationale: L’exhortation à espérer est rendue dans un français naturel et digne; « gardez » convient au contexte d’encouragement adressé aux morts justes.
- source_word: እለ ሞትክሙ
  choice: vous qui êtes morts
  rationale: La construction relative et la deuxième personne du pluriel sont conservées sous la forme d’une adresse directe.
- source_word: በጽድቅ
  choice: dans la justice
  rationale: La locution prépositionnelle et la forme nominale sont maintenues, plutôt que réduites à l’adverbe « justement ».
theological_decisions:
- issue: Terme anthropologique désignant les justes après leur mort
  choice: âmes des justes
  alternative: esprits des justes
  rationale: « Âmes » préserve la représentation d’une identité qui subsiste après la mort, tout en évitant de fixer une distinction anthropologique que le guèze n’explicite pas.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse plurielle et le parallélisme exhortatif sont conservés; aucune formulation confessionnelle particulière n’est introduite.
