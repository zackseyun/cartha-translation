base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: fr
  text: En ces jours-là, si un feu redoutable descend sur vous, où fuirez-vous et où serez-vous délivrés ? Et lorsqu’il élèvera la voix contre vous[a], ne serez-vous pas ébranlés et saisis de peur[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsqu’il lancera (ou fera retentir) sa voix contre vous ». Le sujet masculin singulier n’est pas nommé dans ce verset.'
    reason: ambiguity_note
  - marker: b
    text: 'La question est rhétorique : elle implique qu’ils seront bel et bien ébranlés et saisis de peur.'
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique récurrente, rendue dans un français naturel et digne.
- source_word: ዕፁብ እሳት
  choice: un feu redoutable
  rationale: ዕፁብ peut exprimer l’extraordinaire, l’étonnant ou le terrible ; dans ce contexte de jugement, « redoutable » conserve à la fois l’effroi et la puissance impressionnante du feu.
- source_word: ወረደ ዴቤክሙ
  choice: descend sur vous
  rationale: Conserve le mouvement venant d’en haut et rend naturellement la préposition avec le pronom de deuxième personne du pluriel.
- source_word: በአይቴ ትነፍፁ
  choice: où fuirez-vous
  rationale: Rend directement l’interrogatif de lieu et le verbe de fuite, tout en maintenant la force rhétorique.
- source_word: በአይቴ ትድኅኑ
  choice: où serez-vous délivrés
  rationale: Le passif « serez-vous délivrés » préserve le champ sémantique du secours et de la délivrance sans préciser indûment l’agent.
- source_word: ይወዲ ቃሎ
  choice: il élèvera la voix
  rationale: La construction active et le suffixe possessif de ቃሎ soutiennent « sa voix » ; l’expression française « élever la voix » rend naturellement l’idée de faire retentir ou lancer sa voix.
- source_word: አኮ ትትመሀከዉ
  choice: ne serez-vous pas ébranlés
  rationale: La question négative appelle une réponse affirmative et le verbe évoque le bouleversement ou la consternation.
- source_word: ወትፈርሁ
  choice: et saisis de peur
  rationale: Formulation française idiomatique qui coordonne l’effroi à l’ébranlement sans affaiblir l’intensité de l’avertissement.
theological_decisions:
- issue: Identité du sujet masculin singulier qui élève la voix
  choice: Maintenir le pronom « il » sans nommer explicitement Dieu ou le juge
  alternative: « Dieu élèvera la voix » ou « sa voix s’élèvera »
  rationale: La forme verbale indique un sujet masculin singulier, mais le verset isolé ne le nomme pas explicitement. Le pronom préserve cette donnée sans ajouter une identification doctrinale.
- issue: Portée judiciaire de la voix dirigée contre les destinataires
  choice: « la voix contre vous »
  alternative: « sa sentence contre vous »
  rationale: Le contexte suggère une déclaration de jugement, mais le texte dit littéralement « sa voix » ou « sa parole ». Garder « voix » préserve l’image et évite de transformer l’implication judiciaire en explicitation.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme interrogatif et la tonalité apocalyptique sont conservés. « Redoutable » maintient l’ambivalence de ዕፁብ entre caractère extraordinaire et terrifiant.
