base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: fr
  text: Tous les luminaires[a] seront ébranlés par une grande frayeur, et la terre entière sera ébranlée, tremblera et sera saisie de terreur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les lumières ». Le terme guèze peut désigner les réalités lumineuses en général; ici, il s'agit probablement des astres.
    reason: lexical_alternative
  - marker: b
    text: La transcription électronique fournie semble ici corrompue. La lecture probable du texte imprimé signifie « être terrifié » ou « être alarmé »; si l'on retient la transcription telle quelle, le sens du dernier verbe demeure incertain.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: tous les luminaires
  rationale: Le nom désigne des lumières ou des corps lumineux. Dans cette scène de bouleversement cosmique, « luminaires » indique vraisemblablement les astres tout en conservant une certaine ampleur référentielle.
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: seront ébranlés / sera ébranlée
  rationale: La répétition du même verbe relie le bouleversement des luminaires à celui de la terre; la répétition française préserve ce parallélisme.
- source_word: በፍርሀት ዐቢይ
  choice: par une grande frayeur
  rationale: La préposition peut exprimer la cause ou l'accompagnement. « Par une grande frayeur » conserve le lien entre l'ébranlement et la peur sans l'expliciter davantage.
- source_word: ኵላ ምድር
  choice: la terre entière
  rationale: Le cadre cosmique favorise « terre » plutôt que « pays », et l'adjectif « entière » exprime la portée universelle.
- source_word: ትርዕድ
  choice: tremblera
  rationale: Un verbe distinct après « sera ébranlée » maintient l'intensification du mouvement et le parallélisme verbal.
- source_word: ወትኜጕድ (transcription fournie; probablement ወትደነግፅ dans le témoin imprimé)
  choice: et sera saisie de terreur
  rationale: La forme vraisemblablement attestée dans l'édition imprimée relève du verbe « être terrifié, alarmé ». Cette lecture maintient la personnification de la terre et répond à la grande frayeur des luminaires; l'incertitude de la transcription est signalée en note.
theological_decisions:
- issue: Les « luminaires » sont-ils des corps célestes ou des êtres angéliques ?
  choice: Corps célestes, avec une formulation qui conserve l'image générale des lumières célestes
  alternative: Des êtres angéliques conçus comme des « êtres resplendissants »
  rationale: L'association immédiate avec la terre entière et le motif du bouleversement cosmique favorisent les astres. Le texte ne doit toutefois pas être précisé en « soleil, lune et étoiles », qu'il ne nomme pas.
- issue: Le dernier verbe décrit-il un séisme ou la terre personnifiée dans la terreur ?
  choice: La terre est saisie de terreur
  alternative: La terre est secouée ou chancelle physiquement
  rationale: La lecture corrigée du témoin imprimé semble correspondre à un verbe de peur. Elle crée en outre un écho cohérent avec la « grande frayeur » de la première proposition, sans éliminer le tremblement physique déjà exprimé.
translation_notes:
  register: Français international moderne, solennel mais courant. Le futur simple convient au discours prophétique. La répétition d'« ébranlé » est volontaire afin de reproduire le parallélisme cosmique, tandis que « saisie de terreur » rend naturellement la personnification finale.
