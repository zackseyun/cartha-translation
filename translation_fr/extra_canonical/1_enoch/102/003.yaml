base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: fr
  text: Tous les anges exécuteront l’ordre qui leur est donné[a] et chercheront à se cacher loin de la Grande Gloire[b]. Les fils de la terre[c] trembleront et seront jetés dans la confusion. Mais vous, pécheurs, vous êtes maudits pour toujours, et il n’y aura pas de paix pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur ordre ». Le nom est au singulier dans le guèze; il peut s’agir de l’ordre confié collectivement aux anges ou de l’ordre assigné à chacun.'
    reason: ambiguïté grammaticale et distributive
  - marker: b
    text: 'Littéralement : « de devant la Grande Gloire ». Cette tournure de type sémitique désigne le fait de se retirer hors d’une présence.'
    reason: expression idiomatique et référent théologique
  - marker: c
    text: 'Ou : « les habitants de la terre ». L’expression littérale « les fils de la terre » peut désigner largement les êtres humains soumis au jugement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: መላእክት
  choice: anges
  rationale: Dans ce contexte apocalyptique, il s’agit d’êtres célestes plutôt que de messagers humains.
- source_word: ይፌጽሙ ትእዛዞሙ
  choice: exécuteront l’ordre qui leur est donné
  rationale: Le verbe exprime l’accomplissement effectif d’un ordre. Le nom est morphologiquement singulier avec un suffixe possessif pluriel; cette formulation française garde le singulier tout en indiquant naturellement que l’ordre incombe aux anges.
- source_word: ይፈቅዱ ከመ ይትኀብኡ
  choice: chercheront à se dérober
  rationale: Le premier verbe peut signifier vouloir ou désirer; suivi du verbe « se cacher », il exprime ici une tentative. « Se dérober » rend le mouvement de retrait devant une présence écrasante.
- source_word: እምቅድመ ዐቢይ ስብሐት
  choice: à la présence de la Grande Gloire
  rationale: L’expression sémitique signifie littéralement « de devant ». En français, « se dérober à la présence » en transmet naturellement le sens, tandis que les majuscules préservent la valeur probable de titre divin.
- source_word: ደቂቀ ምድር
  choice: les fils de la terre
  rationale: La traduction littérale conserve l’image filiale caractéristique du langage apocalyptique, sans la réduire d’emblée à « les habitants de la terre ».
- source_word: ይርዕዱ ወይትሀወኩ
  choice: trembleront et seront jetés dans la confusion
  rationale: Les deux verbes décrivent respectivement la frayeur physique et le bouleversement ou la désorientation qui l’accompagne.
- source_word: ርጉማን ለዓለም
  choice: maudits pour toujours
  rationale: Cette formule directe conserve la solennité et la durée illimitée du jugement.
theological_decisions:
- issue: Référent de « la Grande Gloire »
  choice: Maintenir une désignation révérencielle probablement divine, avec des majuscules
  alternative: Traduire descriptivement par « la grande gloire » ou expliciter « Dieu »
  rationale: Dans 1 Hénoch, l’expression peut servir de titre ou de circonlocution pour la présence divine. Le texte ne nomme toutefois pas explicitement Dieu; la traduction garde donc la formulation propre au passage sans en résoudre entièrement le référent.
- issue: Portée de « fils de la terre »
  choice: Conserver l’expression imagée
  alternative: Expliciter « habitants de la terre » ou « êtres humains »
  rationale: L’expression peut désigner largement l’humanité terrestre sous le jugement, mais son image apocalyptique mérite d’être préservée dans le texte, avec une note explicative.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe évite les calques opaques tout en conservant les images apocalyptiques (« Grande Gloire », « fils de la terre ») et la tension du jugement.
