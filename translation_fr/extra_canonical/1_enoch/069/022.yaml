base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: fr
  text: 'Et de même[a] : le ciel, les esprits des vents, tous les esprits et leurs parcours[b], issus de tous les rassemblements d’esprits[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze présente ici une énumération sans verbe, dont la construction demeure difficile. Il ne dit pas explicitement que le ciel « reçut » quoi que ce soit.
    reason: textual_variant
  - marker: b
    text: Le terme traduit par « parcours » peut aussi signifier « voies », « courses » ou « mouvements ».
    reason: lexical_alternative
  - marker: c
    text: Ou « compagnies d’esprits » ou « assemblées d’esprits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማይ
  choice: le ciel
  rationale: Le singulier désigne naturellement ici le domaine céleste ou cosmique. « Le ciel » garde le registre visionnaire sans imposer le pluriel « les cieux ».
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: les esprits des vents
  rationale: La construction est comprise comme un génitif anticipé, non comme l’expression d’une réception. « Esprits » rend le premier terme lié au souffle, tandis que « vents » convient au second dans cette énumération cosmique.
- source_word: መንፈሳት
  choice: esprits
  rationale: Ce terme distinct appartient au champ du souffle et de l’esprit. « Esprits » préserve ici la portée cosmologique et apocalyptique sans préciser indûment la nature de ces êtres ou forces.
- source_word: ወፍናዋቲሆሙ
  choice: et leurs parcours
  rationale: Le mot obscur semble désigner des voies, des courses ou des mouvements. « Parcours » exprime un mouvement ordonné tout en évitant une précision cosmologique excessive.
- source_word: እምኵሉ ኅብራት
  choice: depuis tous les rassemblements
  rationale: La préposition indique la provenance, et le substantif peut désigner des groupements, compagnies ou assemblées. « Rassemblements » conserve cette indétermination.
theological_decisions:
- issue: Rapport entre les « esprits des vents » et « tous les esprits »
  choice: Conserver les deux expressions sans les identifier ni les différencier davantage
  alternative: Rendre le premier groupe par « souffles des vents » ou « vents des vents »
  rationale: Le vocabulaire du souffle, du vent et de l’esprit se chevauche en guèze. La traduction maintient la tension lexicale du texte et n’impose aucune classification doctrinale des êtres ou forces évoqués.
- issue: Présence supposée d’un acte par lequel le ciel recevrait les esprits
  choice: Présenter le verset comme une énumération sans verbe
  alternative: Ajouter « le ciel reçut leurs esprits »
  rationale: Le texte guèze ne contient aucun verbe signifiant « recevoir ». Les deux-points rendent l’énumération intelligible en français sans introduire une action absente de la source.
translation_notes:
  register: Français international moderne, digne et lisible. Les deux-points signalent naturellement une liste verbale elliptique. Le vocabulaire conserve le caractère cosmologique et énigmatique du passage sans ajouter de verbe ni résoudre ses ambiguïtés.
