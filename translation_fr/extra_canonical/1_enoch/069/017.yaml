base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: fr
  text: Et la terre fut établie sur les eaux, et des lieux cachés des montagnes sortent de belles eaux[a], depuis la création du monde et pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze transmis est généralement compris comme « belles » ou « excellentes ». Une autre analyse le rapproche de « vivantes »; le sens précis de l’adjectif demeure incertain.
    reason: lexical_alternative
  - marker: b
    text: La formule indique une durée qui va de la création du monde jusque dans un avenir sans fin.
    reason: alternative_reading
lexical_decisions:
- source_word: ተሳረረት
  choice: fut établie
  rationale: Le verbe signifie ici « fut fondée/établie ». « Fut établie » conserve l’image cosmologique sans suggérer à tort une déchirure.
- source_word: ዲበ ማይ
  choice: sur les eaux
  rationale: Rendu direct et naturel de la préposition et du nom, qui préserve l’image de la terre établie sur les eaux.
- source_word: ኅቡኣተ አድባር
  choice: des lieux cachés des montagnes
  rationale: La formulation désigne les régions ou retraites dissimulées des montagnes; elle maintient le caractère mystérieux de l’image.
- source_word: ኅሑያን ማያት
  choice: des eaux vives
  rationale: Le texte transmis porte une expression rendue littéralement par « eaux vives ». Cette formulation peut évoquer des eaux fraîches, courantes ou vivifiantes sans imposer une seule nuance.
- source_word: ይመፅኡ
  choice: sortent
  rationale: La forme imperfective exprime une action présente ou continue, en accord avec la portée temporelle de la fin du verset.
- source_word: እምፍጥረተ ዓለም
  choice: depuis la création du monde
  rationale: « Depuis » exprime naturellement en français le point de départ temporel indiqué par la préposition.
- source_word: ወእስከ ለዓለም
  choice: et pour toujours
  rationale: Cette formule étend indéfiniment la durée tout en gardant une langue française actuelle et solennelle.
theological_decisions:
- issue: Imagerie cosmologique de la terre et des eaux
  choice: Conserver concrètement l’image de la terre établie sur les eaux.
  alternative: Interpréter l’image comme une simple description géographique ou comme une métaphore.
  rationale: Le texte présente une cosmologie visionnaire; l’expliciter ou la rationaliser dépasserait le témoignage guèze.
- issue: Sens de « eaux vives »
  choice: Maintenir l’expression imagée sans en fixer la portée.
  alternative: Traduire par « eaux fraîches », « eaux courantes » ou « eaux vivifiantes ».
  rationale: La traduction littérale préserve la pluralité des évocations possibles et évite une précision interprétative injustifiée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et l’imagerie cosmologique du guèze sans archaïsmes inutiles.
