base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: fr
  text: 'Le troisième s’appelait Gadreel ; c’est lui qui montra aux enfants des hommes tous les coups de la mort[a], qui égara Ève, et qui montra aux fils des hommes les armes de mort[b] : le bouclier, la cuirasse[c] et l’épée pour tuer, ainsi que toutes les armes de mort aux enfants des hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « toutes les atteintes mortelles » ou « tous les coups mortels ». Le texte dit littéralement « les coups de la mort » et peut désigner plus largement des coups ou blessures qui donnent la mort.'
    reason: lexical_alternative
  - marker: b
    text: Le passage relatif aux « armes de mort » est textuellement difficile dans ce témoin guèze. La traduction conserve à la fois la liste précise et la formule récapitulative qui la suit, sans supprimer la répétition. « Instruments de mort » est également possible.
    reason: textual_variant
  - marker: c
    text: Ou « l’armure » ; le terme désigne une protection portée sur le corps, sans en préciser ici la forme exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: Le troisième avait pour nom Gadreel
  rationale: Rend naturellement la formule de nomination tout en conservant l’ordinal et la translittération du nom propre guèze.
- source_word: ዘአርአየ
  choice: qui montra
  rationale: Le verbe signifie montrer ou révéler. « Montra » préserve la répétition du même verbe dans le verset sans préciser indûment qu’il s’agissait d’un enseignement formel.
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: tous les coups de la mort
  rationale: Cette formulation conserve le substantif « mort » et son écho délibéré avec les occurrences répétées de « armes de mort ».
- source_word: ለውሉደ፡ ሰብእ / ለደቂቀ፡ ሰብእ
  choice: aux enfants des hommes / aux fils des hommes
  rationale: Les deux expressions collectives presque synonymes sont distinguées en français afin de refléter la variation lexicale du guèze, sans leur attribuer une différence de sens certaine.
- source_word: አስሐታ፡ ለሔዋን
  choice: égara Ève
  rationale: Rend l’action de conduire dans l’erreur sans ajouter une formulation doctrinale étrangère au texte.
- source_word: ንዋየ፡ ሞት
  choice: les armes de mort
  rationale: Le terme peut désigner des objets ou instruments ; le contexte immédiatement militaire justifie « armes », tandis que la note signale la portée lexicale plus large.
- source_word: ወለታ፡ ወድርዐ፡ ወሰይፈ፡ ለቀተል
  choice: le bouclier, la cuirasse et l’épée pour tuer
  rationale: Rend distinctement les pièces d’équipement militaire et conserve la valeur de but explicite liée à l’épée.
theological_decisions:
- issue: Attribution de l’égarement d’Ève à Gadreel
  choice: et qui égara Ève
  alternative: et qui trompa Ève
  rationale: Le guèze attribue directement cet acte à Gadreel. La traduction maintient cette affirmation et la tension qu’elle peut créer avec d’autres traditions, sans harmonisation.
- issue: Rapport entre les « coups de la mort » et les « armes de mort »
  choice: Conserver les deux expressions distinctes et la répétition finale
  alternative: Uniformiser toutes les occurrences en « armes mortelles »
  rationale: Le texte distingue ዝብጠተ, « coups », de ንዋየ, « objets/instruments », tout en répétant le substantif « mort ». L’uniformisation effacerait cette structure.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde le mouvement répétitif et cumulatif du guèze, tandis que la ponctuation clarifie la liste. Les expressions « coups de la mort » et « armes de mort » sont volontairement conservées pour maintenir l’insistance du texte sur la mort.
