base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: fr
  text: Et le quatrième — son nom était Penemue — celui-ci montra aux enfants des hommes l’amer et le doux[a], et il leur montra tous les secrets de leur sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amertume et la douceur ». Le contraste peut être compris au sens propre ou comme une image désignant un savoir aux aspects opposés, voire moralement chargés; la formulation guèze demeure concise.
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ
  choice: le quatrième
  rationale: L’ordinal introduit le quatrième personnage d’une liste; l’article défini convient à la syntaxe française.
- source_word: ስሙ
  choice: son nom était
  rationale: Cette formule de désignation est rendue au passé pour s’accorder avec le récit.
- source_word: ፔኔሙኤ
  choice: Penemue
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: ዝንቱ
  choice: celui-ci
  rationale: Le démonstratif reprend avec une légère insistance le personnage qui vient d’être nommé.
- source_word: አርአየ / ወአርአዮሙ
  choice: montra / il leur montra
  rationale: Le sens premier est « montrer, faire connaître ». La répétition du même verbe préserve la cadence du texte sans préciser abusivement qu’il s’agirait d’un enseignement formel.
- source_word: ለውሉደ ሰብእ
  choice: aux enfants des hommes
  rationale: Cette expression anthropologique traditionnelle conserve le registre élevé et la couleur apocalyptique de l’original.
- source_word: መሪረ ወመዓርፂረ
  choice: l’amer et le doux
  rationale: Les deux adjectifs substantivés forment un contraste. Cette traduction en conserve la forme plutôt que de les transformer en noms abstraits.
- source_word: ኵሎ ኅቡኣተ
  choice: tous les secrets
  rationale: « Secrets » exprime naturellement en français les choses cachées et garde la nuance de savoir dissimulé.
- source_word: ጥበቦሙ
  choice: de leur sagesse
  rationale: Le suffixe possessif est conservé, et « sagesse » rend le sens principal tout en laissant ouverte la possibilité d’un savoir ou d’un savoir-faire.
theological_decisions:
- issue: Sens du couple መሪረ et መዓርፂረ
  choice: l’amer et le doux
  alternative: l’amertume et la douceur; le mal et le bien
  rationale: Le guèze présente d’abord un contraste lexical entre ce qui est amer et ce qui est doux. Le texte peut avoir une portée figurée ou morale, mais il ne l’explicite pas; la traduction conserve donc cette tension sans paraphraser par « le mal et le bien ».
- issue: Rapport exprimé par ኅቡኣተ ጥበቦሙ
  choice: les secrets de leur sagesse
  alternative: les choses cachées de la sagesse; tous les secrets de la sagesse
  rationale: Le possessif « leur » reste visible et rattache grammaticalement cette sagesse au groupe humain mentionné, sans déterminer davantage la nature de ce savoir.
translation_notes:
  register: Français international actuel, clair et digne. La construction légèrement solennelle « aux enfants des hommes » et la reprise « celui-ci » conservent la tonalité apocalyptique et la structure emphatique du guèze.
