base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: fr
  text: Voici le secret[a] de Kasbéel, le chef du serment[b] qu’il montra aux êtres saints[c] lorsqu’il demeurait dans la gloire d’en haut, et son nom est Biqa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze est difficile dans ce contexte. La traduction « secret » suit son emploi contextuel; certaines interprétations ont proposé « nombre » ou « compte », mais ces rendus ne conviennent pas naturellement à la phrase.
    reason: lexical_alternative
  - marker: b
    text: Ou « la tête du serment ». Dans ce contexte, le « serment » peut aussi désigner une adjuration solennelle liée à un nom révélé.
    reason: lexical_alternative
  - marker: c
    text: Dans ce cadre visionnaire, les « êtres saints » sont probablement des êtres célestes, sans que le texte les désigne ici plus précisément.
    reason: cultural_note
  - marker: d
    text: Le possessif peut renvoyer au serment ou à la réalité révélée; il pourrait aussi, quoique moins probablement, renvoyer à Kasbéel.
    reason: alternative_reading
lexical_decisions:
- source_word: ጐልቁ
  choice: le nombre
  rationale: Le mot vient de la racine exprimant l’action de compter et désigne un nombre ou un compte. Cette valeur directement attestée est retenue plutôt que « secret » ou « troisième nom », qui ne correspondent pas au sens lexical de base.
- source_word: ካስብኤል
  choice: Kasbéel
  rationale: Le nom propre est translittéré, avec un accent facilitant sa lecture naturelle en français.
- source_word: ርእሰ ማሐላ
  choice: le chef du serment
  rationale: ርእሰ signifie littéralement « tête » et peut exprimer la primauté; « chef » rend cette fonction avec naturel. ማሐላ est conservé dans son sens ordinaire de « serment ».
- source_word: ዘአርአዩ
  choice: qu’il montra
  rationale: La forme causative exprime le fait de faire voir ou de montrer. La traduction reste proche du témoin sans expliciter davantage l’idée possible de révélation.
- source_word: ለቅዱሳን
  choice: aux êtres saints
  rationale: Cette formulation conserve l’expression apocalyptique tout en évitant que « les saints » soit spontanément limité à des croyants humains.
- source_word: ሶበ ኆደሩ
  choice: lorsqu’il demeurait
  rationale: La proposition indique la circonstance temporelle; « demeurait » convient au registre élevé sans préciser indûment s’il était assis ou simplement présent.
- source_word: በልዑል በስብሐት
  choice: là-haut dans la gloire
  rationale: La traduction rend à la fois l’élévation et la gloire dans un français fluide.
- source_word: ወስሙ ቢቃ
  choice: et son nom est Biqa
  rationale: Le suffixe possessif est rendu littéralement. En français, « son » laisse subsister l’ambiguïté du référent au lieu de l’identifier de manière conjecturale.
theological_decisions:
- issue: Identité des « êtres saints »
  choice: Laisser l’expression ouverte, avec une note indiquant le cadre céleste probable
  alternative: Traduire par « anges » ou par « saints » au sens de croyants humains
  rationale: Le contexte visionnaire favorise des êtres célestes, mais le texte ne les appelle pas explicitement « anges »; la traduction préserve donc l’expression et sa tension.
- issue: Nature du serment
  choice: Conserver « serment »
  alternative: « adjuration », « formule d’adjuration » ou « nom mystique »
  rationale: Le mot guèze atteste directement le serment. Une formulation plus ésotérique ajouterait au texte une interprétation que le témoin ne formule pas.
- issue: Référent du possessif final
  choice: Conserver l’ambiguïté avec « son nom »
  alternative: « le nom du serment est Biqa » ou « le nom de Kasbéel est Biqa »
  rationale: La syntaxe permet de rattacher le suffixe au serment ou à la réalité révélée, mais Kasbéel reste aussi un antécédent grammatical possible. Le texte principal ne tranche pas.
translation_notes:
  register: Français international actuel, digne et lisible. La structure reste proche du guèze, tandis que « êtres saints » et « là-haut dans la gloire » évitent respectivement une connotation ecclésiastique trop précise et une tournure artificielle. Les noms propres suivent une translittération française cohérente.
