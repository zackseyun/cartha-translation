base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: fr
  text: Et voici les chefs de leurs anges[a], ainsi que leurs noms, les commandants de leurs centaines, les commandants de leurs cinquantaines[b] et les commandants de leurs dizaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif « leurs », répété dans le texte guèze, renvoie à un groupe déterminé par le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte présente une hiérarchie organisée par unités numériques : centaines, cinquantaines et dizaines. Il s’agit vraisemblablement de groupes ordonnés plutôt que de simples totaux.'
    reason: cultural_note
lexical_decisions:
- source_word: እሉ
  choice: voici
  rationale: Le déictique pluriel introduit une liste d’identification; la tournure « voici » est naturelle en français tout en gardant cette fonction présentative.
- source_word: አርእስተ
  choice: chefs
  rationale: Le terme signifie littéralement « têtes » et désigne ici ceux qui occupent le premier rang; « chefs » exprime clairement cette autorité personnelle.
- source_word: መላእክቲሆሙ
  choice: leurs anges
  rationale: Dans 1 Hénoch, le mot désigne normalement des êtres angéliques. Le possessif est conservé malgré son référent contextuel.
- source_word: አስማቲሆሙ
  choice: leurs noms
  rationale: Le pluriel muni d’un suffixe possessif annonce les noms de la liste qui suit.
- source_word: መኰንነ
  choice: commandants
  rationale: Dans cette série numérique et hiérarchique, « commandants » rend mieux une fonction d’autorité structurée que « dirigeants » ou « chefs ».
- source_word: ምእት
  choice: centaines
  rationale: Le nombre est compris comme la désignation distributive d’unités de cent dans une organisation hiérarchique.
- source_word: ኀምሳ
  choice: cinquantaines
  rationale: « Cinquantaines » désigne des groupes de cinquante et maintient le parallélisme avec les centaines et les dizaines.
- source_word: ዐሠርተ
  choice: dizaines
  rationale: Le terme est rendu comme désignation d’unités de dix afin de préserver la gradation numérique.
- source_word: ዚአሆሙ
  choice: de leurs
  rationale: La relation possessive répétée dans le guèze est conservée dans chacune des trois expressions hiérarchiques.
theological_decisions:
- issue: Faut-il rendre la suite des rangs dans un langage explicitement militaire ?
  choice: les commandants de leurs centaines… cinquantaines… dizaines
  alternative: leurs chefs de centaines… cinquantaines… dizaines
  rationale: « Commandants » fait ressortir l’organisation formelle de ces rangs angéliques sans introduire de terminologie ecclésiastique ultérieure. La construction conserve en outre l’ambiguïté du rapport possessif.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « les commandants de leurs… » reflète la formule hiérarchique du guèze; la dernière coordination omet naturellement la virgule en français.
