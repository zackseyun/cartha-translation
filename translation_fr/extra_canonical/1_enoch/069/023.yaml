base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: fr
  text: Et là sont gardés le grondement du tonnerre et la lumière de l’éclair ; et là sont gardés les réserves de grêle, les réserves de givre[a], les réserves de brume[b], et les réserves de pluie et de rosée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gelée blanche » ; le terme peut aussi être compris comme désignant la glace.
    reason: lexical_alternative
  - marker: b
    text: Ou « brouillard » ou « nuée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: là
  rationale: Adverbe locatif répété dans la source ; « là » est naturel et conserve l’insistance spatiale de la vision.
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: sont gardés
  rationale: Le passif peut évoquer la conservation, la garde ou le stockage ; « sont gardés » reste assez large sans préciser indûment le mécanisme.
- source_word: ቃሉ ለነጐድጓድ
  choice: le grondement du tonnerre
  rationale: ቃል peut signifier voix ou son. Dans ce contexte météorologique, « grondement » rend naturellement la manifestation audible du tonnerre tout en gardant sa force évocatrice.
- source_word: ብርሃኑ ለመብረቅ
  choice: la lumière de l’éclair
  rationale: Traduction concrète de « lumière/éclat » qui maintient le parallélisme avec la manifestation audible du tonnerre.
- source_word: መዛግብተ
  choice: les réserves
  rationale: Le terme désigne des dépôts ou magasins célestes. « Réserves » conserve l’image cosmique tout en étant plus naturel en français actuel que « entrepôts » dans cette énumération.
- source_word: በረድ
  choice: grêle
  rationale: Terme météorologique direct et non ambigu.
- source_word: አስሐትያ
  choice: givre
  rationale: Le sens « givre/gelée blanche » est mieux étayé que « brume » ; une note conserve les nuances possibles.
- source_word: ጊሜ
  choice: brume
  rationale: Le terme peut désigner la brume, le brouillard ou la nuée ; « brume » convient à la suite des phénomènes atmosphériques sans introduire une précision excessive.
- source_word: ዝናም
  choice: pluie
  rationale: Équivalent français standard.
- source_word: ጠል
  choice: rosée
  rationale: Équivalent français standard, conservé comme dernier élément de la liste.
theological_decisions:
- issue: Faut-il moderniser l’image des réserves célestes en décrivant simplement la production des phénomènes météorologiques ?
  choice: Conserver l’image concrète des réserves célestes et des forces naturelles qui y sont gardées.
  alternative: Paraphraser en disant que le tonnerre, l’éclair, la grêle, le givre, la brume, la pluie et la rosée y sont produits.
  rationale: Le passage relève d’une vision apocalyptique. Aplatir cette représentation en langage météorologique moderne effacerait son univers imagé sans nécessité textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « et là sont gardés » ainsi que celle de « réserves » préserve le rythme énumératif et l’imagerie apocalyptique de la source. Tous les marqueurs de notes figurent dans le texte.
