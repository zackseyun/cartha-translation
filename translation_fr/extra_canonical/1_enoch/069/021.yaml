base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: fr
  text: Et par ce serment, les étoiles achèvent leur course[a] ; on les appelle par leur nom[b], et elles lui répondent d’âge en âge, pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte décrit le mouvement ordonné des étoiles ; « course » peut aussi se rendre par « circuit » ou « parcours ».
    reason: lexical_alternative
  - marker: b
    text: La proposition guèze est syntaxiquement condensée. Littéralement, elle évoque l’appel de « leurs noms » ; elle peut aussi se comprendre comme « leurs noms sont appelés ». L’agent de l’appel n’est pas clairement exprimé.
    reason: textual_variant
  - marker: c
    text: Littéralement, la formule finale évoque une continuité « depuis un âge et jusqu’à un âge » ; elle signifie que cela se poursuit à travers les âges.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: serment
  rationale: Dans la formule በውእቱ፡ ማሐላ, le nom désigne un serment. Cette traduction maintient en outre le lien thématique avec les versets précédents du chapitre.
- source_word: ከዋክብት
  choice: les étoiles
  rationale: Le sens ordinaire et concret est « étoiles » ; « corps célestes » affaiblirait inutilement l’image apocalyptique.
- source_word: ይፌጽሙ፡ ምሕዋሪሆሙ
  choice: achèvent leur course
  rationale: Le verbe exprime l’accomplissement ou l’achèvement, et le nom évoque le déplacement ordonné des étoiles. « Course » est naturel en français tout en conservant l’image cosmique.
- source_word: አስማቲሆሙ፡ ይጼውዑ
  choice: leurs noms sont appelés
  rationale: La proposition guèze est très comprimée. Cette formulation suit la lecture impersonnelle ou passive sans ajouter explicitement un agent absent de la proposition.
- source_word: ያወሥእዎ
  choice: elles lui répondent
  rationale: Le suffixe objet masculin singulier -ዎ est rendu par « lui ». Le sujet se comprend naturellement comme les étoiles, mais l’identité de celui à qui elles répondent demeure implicite dans ce verset.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም
  choice: d’âge en âge, pour toujours
  rationale: Cette formule exprime une continuité durable à travers les âges. La tournure française garde sa solennité et sa répétition sans imposer une précision métaphysique excessive.
theological_decisions:
- issue: Les étoiles sont-elles de simples objets astronomiques ou des êtres célestes personnifiés ?
  choice: 'Conserver leur réponse personnelle : « elles lui répondent ».'
  alternative: Réduire le passage à une description impersonnelle du mouvement des astres, ou identifier explicitement les étoiles à des anges.
  rationale: Le langage apocalyptique présente les étoiles comme participant personnellement à un ordre céleste. Le texte permet une personnification ou une association avec des êtres célestes, sans trancher entre ces possibilités.
- issue: Identité du référent masculin dans « elles lui répondent »
  choice: Conserver le pronom « lui » sans nommer son référent.
  alternative: Écrire « elles répondent au Seigneur » ou omettre le complément.
  rationale: Le suffixe guèze indique un objet masculin singulier, mais le verset isolé ne le nomme pas. Le traduire tout en laissant son référent implicite respecte à la fois la morphologie et l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme solennel est conservé sans archaïsmes. Les pronoms féminins reprennent naturellement « les étoiles », tandis que les notes signalent la compression syntaxique et les lectures possibles.
