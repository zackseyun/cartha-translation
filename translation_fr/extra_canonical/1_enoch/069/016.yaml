base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: fr
  text: Et voici les choses cachées de ce serment[a]… et il[b] est affermi par son serment, et le ciel fut suspendu avant que le monde ne soit créé, et par lui pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de ce verset est textuellement difficile dans le témoin éthiopien. Les points de suspension reproduisent une lacune ou un passage de transmission incertaine après « ce serment ».
    reason: textual_variant
  - marker: b
    text: L’antécédent de « il » n’est pas conservé clairement dans ce passage lacunaire.
    reason: textual_variant
  - marker: c
    text: Littéralement, « et par lui pour toujours ». Dans le contexte, « lui » renvoie probablement au serment qui soutient le ciel, mais le texte transmis ne nomme pas de nouveau son référent.
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ
  choice: voici
  rationale: Cette tournure française rend naturellement le démonstratif pluriel suivi de la copule, tout en conservant sa fonction de présentation.
- source_word: ኅቡኣቲሁ
  choice: les choses cachées
  rationale: Le terme vient de la racine exprimant l’action de cacher. Cette traduction garde le caractère concret et apocalyptique des réalités dissimulées, sans les réduire à des connaissances abstraites.
- source_word: ለዝ ማሐላ
  choice: de ce serment
  rationale: 'Le rapport génitival est ici le sens le plus naturel : les choses cachées se rapportent au serment mentionné.'
- source_word: ፅኑዕ
  choice: est affermi
  rationale: Le choix exprime la stabilité acquise ou établie et conserve la force solennelle du langage du serment.
- source_word: በመሐላሁ
  choice: par son serment
  rationale: 'La préposition a ici une valeur instrumentale : le serment est le moyen par lequel quelque chose est affermi.'
- source_word: ሰማይ
  choice: le ciel
  rationale: Dans ce contexte cosmologique et apocalyptique, « le ciel » convient mieux que le sens plus ordinaire de « firmament visible ».
- source_word: ተሰቅለ
  choice: fut suspendu
  rationale: Cette traduction maintient l’image cosmologique vive d’un ciel accroché ou suspendu, au lieu de l’aplanir en « fut établi ».
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: avant que le monde soit créé
  rationale: La proposition marque l’antériorité temporelle. « Monde » est ici le sens contextuel le plus naturel de ዓለም, bien que « âge » soit lexicalement possible.
- source_word: ወእስከ ለዓለም
  choice: et … pour toujours
  rationale: L’expression désigne une durée perpétuelle ; « pour toujours » est idiomatique en français moderne tout en préservant cette force temporelle.
- source_word: ቦቱ
  choice: par lui
  rationale: La forme associe la préposition በ, qui peut exprimer le moyen, à un pronom masculin singulier. « Par lui » respecte cette valeur instrumentale et ne transforme pas la préposition en « sur ».
theological_decisions:
- issue: Nature des « choses cachées » liées au serment
  choice: Des réalités ou puissances cosmiques dissimulées, associées au serment
  alternative: Les paroles secrètes du serment ou les mystères qu’il contient
  rationale: Le contexte immédiat porte sur des puissances nommées, les structures cosmiques et l’efficacité du serment. « Choses cachées » conserve cette concrétude apocalyptique sans préciser davantage que le texte.
- issue: Image cosmologique du ciel
  choice: Le ciel « fut suspendu »
  alternative: Le ciel fut établi ou fixé
  rationale: Le verbe guèze évoque naturellement la suspension. Conserver cette image respecte le registre visionnaire sans l’assimiler à une formulation doctrinale plus ordinaire.
- issue: Référent final de « par lui »
  choice: Maintenir le pronom dans le texte et signaler son référent probable sans l’imposer
  alternative: Remplacer explicitement le pronom par « par le serment »
  rationale: Le contexte instrumental favorise fortement le serment comme référent, mais la formulation transmise emploie un pronom. Le conserver évite de supprimer une ambiguïté réelle du témoin.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe demeure légèrement solennelle afin de préserver le registre apocalyptique. Les images de réalités cachées et du ciel suspendu sont conservées, tandis que les lacunes et les ambiguïtés pronominales sont signalées plutôt que résolues silencieusement.
