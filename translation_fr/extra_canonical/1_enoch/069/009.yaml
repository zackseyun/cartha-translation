  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: fr
  text: Il enseigna aux humains l’écriture avec de l’encre et du papier[a] ; à cause de cela, beaucoup se sont égarés d’éternité en éternité[b], jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot désigne un support d’écriture ; on peut aussi traduire « parchemin » ou « feuille ». Le texte éthiopien fourni présente ici des erreurs de transcription, et la traduction suit la lecture rétablie « avec de l’encre et un support d’écriture ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « d’âge en âge ». Le même terme peut signifier « âge » ou « éternité » ; sa répétition conserve ici la cadence apocalyptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮሙ (lecture corrigée de l’OCR አበወዎሙ)
  choice: Il enseigna aux humains
  rationale: La lecture corrigée signifie « il leur enseigna ». « Aux humains » restitue la valeur collective de ሰብእ et le sujet renvoie à l’ange nommé dans le contexte précédent.
- source_word: ጽሕፈት / መጽሐፍ (notion d’écriture dans la lecture rétablie)
  choice: l’écriture
  rationale: Le contexte dénonce la transmission de l’art ou de la technique d’écrire, plutôt qu’un livre particulier.
- source_word: በቀለም
  choice: avec de l’encre
  rationale: ቀለም désigne l’encre ; la préposition instrumentale est naturellement rendue par « avec ».
- source_word: ወበክርታስ
  choice: et du papier
  rationale: ክርታስ, emprunt apparenté au grec χάρτης, désigne un support d’écriture, papier ou feuille. « Papier » reste clair tout en faisant l’objet d’une note.
- source_word: ብዙኃን እለ ይስሕቱ
  choice: beaucoup se sont égarés
  rationale: Le verbe exprime l’égarement moral ou intellectuel. Le passé composé convient à une action dont les effets se prolongent « jusqu’à ce jour ».
- source_word: እምዓለም ወእስከ ለዓለም
  choice: d’éternité en éternité
  rationale: Cette formulation conserve la répétition de ዓለም et la cadence apocalyptique sans réduire l’expression à un simple « toujours ».
- source_word: ወእስከ ዛቲ ዕለት
  choice: jusqu’à ce jour
  rationale: Expression temporelle française naturelle et proche de la formulation source.
theological_decisions:
- issue: Nature du savoir transmis aux humains
  choice: La technique de l’écriture au moyen de l’encre et d’un support écrit
  alternative: Des écrits ou tablettes de « bitterness and deceit » selon le texte OCR corrompu
  rationale: Les formes transmises dans l’extrait sont manifestement altérées par l’OCR. La lecture corrigée መሀሮሙ… በቀለም ወበክርታስ, cohérente avec le verset suivant, vise l’enseignement matériel de l’écriture. La note maintient toutefois une prudence sur la nature exacte du support.
- issue: Portée temporelle de l’égarement
  choice: d’éternité en éternité
  alternative: d’âge en âge
  rationale: Le terme ዓለም peut désigner l’âge ou l’éternité. Le texte principal conserve le registre élevé et la répétition, tandis que la note signale l’autre possibilité sans trancher la tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple ouvre la déclaration dans un registre narratif soutenu, tandis que le passé composé souligne un égarement qui se prolonge jusqu’au présent. La ponctuation garde l’unité causale du verset.
