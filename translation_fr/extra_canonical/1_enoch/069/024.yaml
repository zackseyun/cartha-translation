base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: fr
  text: Tous ceux-là croiront et rendront grâce devant le Seigneur des Esprits. Ils le béniront de toute leur force, et leur nourriture sera tout entière action de grâce[a]. Ils rendront grâce, béniront et exalteront le nom du Seigneur des Esprits pour les siècles des siècles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la tournure peut aussi se rendre : « leur nourriture sera dans toute action de grâce ». Le texte présente de manière condensée l’action de grâce comme leur nourriture ou comme le cadre de leur subsistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ያአምኑ
  choice: croiront
  rationale: Le verbe exprime le fait de croire ou de se fier à quelqu’un. « Croiront » en conserve le sens direct sans ajouter une formulation doctrinale ultérieure.
- source_word: የአኵቱ / ወየአኵቱ
  choice: rendront grâce
  rationale: La proximité du nom አኰቴት favorise ici le sens de reconnaissance et d’action de grâce plutôt que le simple fait de louer.
- source_word: በቅድመ
  choice: devant
  rationale: Ce terme rend naturellement l’idée spatiale et cultuelle de se tenir en présence du Seigneur.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Seigneur des Esprits
  rationale: Cette expression est un titre divin récurrent dans les Paraboles d’Hénoch. La majuscule à « Esprits » en souligne la valeur titulaire.
- source_word: ይሴብሑ
  choice: béniront
  rationale: « Béniront » maintient la distinction entre les verbes successifs d’action de grâce, de bénédiction et d’exaltation.
- source_word: በኵሉ ኃይሎሙ
  choice: de toute leur force
  rationale: Cette tournure française naturelle exprime la totalité de leur capacité ou de leur vigueur.
- source_word: ሲሳዮሙ
  choice: leur nourriture
  rationale: Le nom désigne ici la nourriture ou la subsistance, et non la richesse. Ce choix préserve l’image selon laquelle l’action de grâce constitue leur nourriture.
- source_word: በኵሉ አኰቴት
  choice: toute action de grâce
  rationale: La construction guèze est condensée. Avec la copule féminine ይእቲ, elle forme vraisemblablement le prédicat de la proposition nominale portant sur « leur nourriture ».
- source_word: ያሌዕሉ
  choice: exalteront
  rationale: Le verbe signifie élever ou exalter et convient au registre solennel de la louange apocalyptique.
- source_word: ለዓለመ ዓለም
  choice: pour les siècles des siècles
  rationale: Cette formule française traditionnelle et intelligible conserve la cadence liturgique ainsi que l’idée de durée éternelle.
theological_decisions:
- issue: Faut-il rendre ያአምኑ par une expression chrétienne explicitement doctrinale ?
  choice: croiront
  alternative: mettront leur confiance / auront foi
  rationale: Le texte décrit la réponse eschatologique des adorateurs. « Croiront » conserve le sens simple du verbe sans préciser indûment la nature doctrinale de cette foi.
- issue: Comment rendre le titre divin እግዚአ መንፈሳት ?
  choice: Seigneur des Esprits
  alternative: Seigneur des esprits
  rationale: Dans les Paraboles, l’expression fonctionne comme un titre divin récurrent. La traduction retenue en préserve la force titulaire et apocalyptique.
- issue: Quel rapport établir entre « nourriture » et « action de grâce » ?
  choice: leur nourriture sera toute action de grâce
  alternative: leur nourriture sera dans toute action de grâce / leur nourriture s’accompagnera de toute action de grâce
  rationale: La copule féminine soutient une proposition nominale autonome et fait de l’action de grâce le prédicat de « nourriture ». La formulation conserve cette image forte sans la réduire à une simple circonstance du repas.
translation_notes:
  register: Français moderne, digne et accessible, avec une cadence liturgique adaptée au contexte apocalyptique. Les répétitions des verbes de louange sont conservées. Le titre « Seigneur des Esprits » et la formule « pour les siècles des siècles » maintiennent le registre solennel du passage.
