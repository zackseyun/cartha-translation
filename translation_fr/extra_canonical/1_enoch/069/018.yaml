base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: fr
  text: Et par ce serment, la mer fut créée ; pour le temps de la colère[a], il établit pour elle le sable comme fondement[b], et elle ne le franchit pas depuis la création du monde et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze est difficile ; elle peut aussi se comprendre comme « pour un temps de jugement » ou, plus généralement, « en un temps de colère ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le texte parle du sable comme du « fondement » de la mer. Dans le contexte, le sable fonctionne aussi comme la frontière qu’elle ne franchit pas.
    reason: lexical_and_contextual_clarification
lexical_decisions:
- source_word: ማሐላ
  choice: serment
  rationale: Dans cette série cosmologique, le terme désigne le serment par lequel les éléments sont établis; « malédiction » conviendrait moins au rôle créateur décrit ici.
- source_word: ተፈጥረት
  choice: fut créée
  rationale: Le passif conserve directement le langage de création du guèze et son registre cosmologique.
- source_word: ባሕር
  choice: la mer
  rationale: L’article défini convient à l’élément cosmique particulier dont il est question.
- source_word: መሠረታ
  choice: fondement
  rationale: Le sens premier est « fondement » ou « base »; le contexte du sable et du non-franchissement lui donne aussi une valeur de limite, rendue explicitement dans la suite.
- source_word: ለጊዜ መዓት
  choice: au temps de la colère
  rationale: Cette traduction préserve le sens temporel et la résonance apocalyptique de መዓት, sans exclure la nuance possible de jugement.
- source_word: አንበረ ላቲ ኆፃ
  choice: il lui fixa le sable comme limite
  rationale: Le verbe exprime l’action de poser ou fixer, et le sable constitue ici ce que la mer ne franchit pas. « Comme limite » rend naturellement en français la fonction indiquée par le contexte.
- source_word: ወኢትኅልፍ
  choice: et elle ne la franchit pas
  rationale: Le féminin renvoie à la mer et le pronom à la limite; « franchir » conserve l’image d’une frontière imposée.
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: depuis la création du monde et pour toujours
  rationale: La formulation exprime une durée continue allant de la création jusque dans l’éternité, dans un français actuel et digne.
theological_decisions:
- issue: Le sable est-il seulement un rivage naturel ou une frontière cosmique imposée dans un contexte de colère ou de jugement ?
  choice: Conserver à la fois le « fondement », le sable posé comme limite et le « temps de la colère ».
  alternative: Paraphraser simplement par « il fixa les limites de la mer » ou omettre la mention obscure de la colère.
  rationale: Le guèze associe une image physique concrète à une expression temporelle et apocalyptique difficile. La traduction maintient cette tension au lieu de la réduire à une description naturelle ordinaire.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve le caractère cosmologique et apocalyptique du passage tout en explicitant sobrement la fonction limitative du sable. Les pronoms féminins rendent clairement les référents français « mer » et « limite ».
