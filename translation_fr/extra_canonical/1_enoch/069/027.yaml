base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/027.yaml
  text: And he sat upon the throne of his glory[a].
translation:
  language: fr
  text: Et il siégea sur le trône de sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi avoir le sens plus général de « fut », « était » ou « demeura » ; il est rendu ici par « siégea » en raison du trône et de la scène d’intronisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ
  choice: siégea
  rationale: Le verbe peut exprimer le fait d’être, de demeurer ou, selon le contexte, d’être assis. Avec « sur » et « trône », « siégea » rend naturellement la posture royale et judiciaire sans réduire le sens à une simple localisation.
- source_word: ዲበ
  choice: sur
  rationale: Cette préposition spatiale signifie ici « sur ». Ce choix est naturel en français moderne dans l’expression « siéger sur un trône ».
- source_word: መንበረ
  choice: trône
  rationale: Le nom peut désigner un siège, mais le contexte visionnaire d’intronisation appelle « trône », qui conserve l’imagerie royale et judiciaire.
- source_word: ስብሐቲሁ
  choice: sa gloire
  rationale: Le terme désigne la gloire, la splendeur ou la majesté, avec un suffixe possessif masculin. « Sa gloire » est direct et conserve l’expression source « le trône de sa gloire ».
theological_decisions:
- issue: Faut-il rendre la proposition comme une simple présence sur le trône ou comme l’action d’y siéger ?
  choice: Et il siégea sur le trône de sa gloire.
  alternative: Et il était sur le trône de sa gloire ; Et il demeura sur le trône de sa gloire.
  rationale: La construction avec « sur » et « trône » soutient naturellement l’idée d’être assis ou de siéger. « Siégea » préserve l’image apocalyptique d’intronisation tout en signalant en note l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, naturel et digne. « Siégea » conserve le registre royal et judiciaire de la vision sans employer une tournure archaïsante.
