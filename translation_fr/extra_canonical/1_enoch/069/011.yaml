base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: fr
  text: Car les êtres humains n’ont été créés que pour être semblables aux anges, afin de demeurer purs et justes ; et la mort, qui détruit tout, ne les aurait pas touchés. Mais par cette connaissance, ils vont à leur perte[a], et par cette puissance, elle me dévore[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition est difficile. On pourrait aussi traduire : « par cette compréhension, ils périssent ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression finale est vive et personnelle : littéralement, cette puissance « me dévore ».'
    reason: lexical_alternative
  - marker: c
    text: Pour cette partie des Paraboles, aucun témoin grec ou araméen permettant de contrôler efficacement le guèze n’est disponible ici ; les formulations incertaines sont donc rendues avec retenue.
    reason: textual_variant
lexical_decisions:
- source_word: ኢተፈጥረ ሰብእ ዘእንበለ
  choice: les êtres humains n’ont été créés que
  rationale: La construction négative restrictive est rendue naturellement en français par « ne… que ». Le collectif ሰብእ est exprimé au pluriel afin de s’accorder avec les formes pronominales plurielles qui suivent.
- source_word: ከመ መላእክት
  choice: pour être semblables aux anges
  rationale: « Semblables aux anges » conserve la comparaison sans identifier les humains aux anges.
- source_word: ይንበሩ ንጹሓነ ወጻድቃነ
  choice: afin de demeurer purs et justes
  rationale: « Demeurer » indique la continuité d’un état ; « purs et justes » garde le registre moral et religieux du texte.
- source_word: ሞት ዘኵሉ ያማሥን
  choice: la mort, qui détruit tout
  rationale: Cette formulation préserve la personnification de la mort et la portée universelle de la proposition relative.
- source_word: እመ ኢገሰሶሙ
  choice: ne les aurait pas touchés
  rationale: Le conditionnel passé rend la valeur contrefactuelle apparente du contexte et « toucher » conserve l’image concrète du verbe.
- source_word: በዝ አእምሮቶሙ ይትሐጐሉ
  choice: par cette connaissance, ils vont à leur perte
  rationale: « Connaissance » conserve le sens large et ambigu de አእምሮት. « Vont à leur perte » exprime naturellement en français la ruine ou la perdition, sans préciser indûment si le verbe est passif ou réfléchi.
- source_word: በዝንቱ ኃይል
  choice: par cette puissance
  rationale: « Puissance » garde l’ampleur et l’ambiguïté du terme, ainsi que son registre apocalyptique.
- source_word: ይበልዓኒ
  choice: elle me dévore
  rationale: Le verbe source est vif et concret ; « dévore » en conserve mieux l’image que le plus abstrait « consume ».
theological_decisions:
- issue: La condition voulue pour l’humanité
  choice: Les humains ont été créés pour être semblables aux anges en demeurant purs et justes.
  alternative: Les humains auraient été créés comme des anges, ou le propos ne viserait qu’une catégorie particulière de justes.
  rationale: La tournure comparative favorise une ressemblance plutôt qu’une identité et ne limite pas explicitement l’affirmation à un groupe particulier.
- issue: Le rôle de la connaissance dans la perte des humains
  choice: 'Le lien causal est maintenu : « par cette connaissance, ils vont à leur perte ».'
  alternative: « Par cette compréhension, ils périssent » ou une interprétation précisant de quelle connaissance il s’agit.
  rationale: Le témoin guèze permet plusieurs nuances et le référent de « cette connaissance » reste incertain ; la traduction ne doit pas résoudre cette tension.
- issue: Le sujet de la dernière proposition
  choice: Le pronom « elle » renvoie grammaticalement à « cette puissance ».
  alternative: Comprendre que la connaissance, ou une réalité sous-entendue, dévore le locuteur.
  rationale: Le nom immédiatement antérieur est « puissance », mais le passage est difficile et ne bénéficie pas ici d’un contrôle grec ou araméen efficace ; une note signale donc la prudence requise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement solennel du texte, tout en évitant un calque maladroit. Les termes « purs », « justes », « connaissance » et « puissance » maintiennent le registre religieux et apocalyptique sans ajout confessionnel.
