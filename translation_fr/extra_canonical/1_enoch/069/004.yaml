base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: fr
  text: Le premier s’appelait Yeqon[a]. C’est lui qui égara tous les enfants des anges[b], les fit descendre sur la terre ferme[c] et les égara au moyen des filles des humains[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeqon transcrit ici la forme guèze; on rencontre aussi les graphies Yequn ou Yeqoun.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les enfants des anges ». Certains comprennent cette expression plus largement comme désignant les anges ou l’armée angélique.
    reason: lexical_alternative
  - marker: c
    text: « Sur la terre ferme » peut aussi se traduire par « sur la terre » ou « sur le sol »; le guèze désigne concrètement le domaine terrestre.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement « par/au moyen des filles des humains »: la préposition indique ici le moyen par lequel Yeqon les égara.'
    reason: ambiguity
lexical_decisions:
- source_word: ወስሙ፡ ለቀዳማዊ፡ ይቁን
  choice: Le premier s’appelait Yeqon
  rationale: Cette formulation française naturelle conserve la formule de nomination et l’ordre de la liste, sans surcharger la phrase d’un calque maladroit.
- source_word: ዝውእቱ
  choice: C’est lui qui
  rationale: Rend l’identification emphatique du démonstratif accompagné de la copule dans un français actuel et digne.
- source_word: ዘአስሐተ / ወአስሐቶሙ
  choice: égara / les égara
  rationale: Le même verbe est repris afin de refléter la répétition de la même racine guèze et sa force rhétorique.
- source_word: ኵሎሙ፡ ደቂቀ፡ መላእክት
  choice: tous les enfants des anges
  rationale: « Enfants » rend la valeur large de ደቂቀ sans réduire d’emblée l’expression à des fils masculins; la tournure familiale inhabituelle est maintenue.
- source_word: ወአውረዶሙ
  choice: les fit descendre
  rationale: Rend directement le causatif de la descente sans préciser indûment s’il s’agit de contrainte physique ou d’influence.
- source_word: ዲበ፡ የብስ
  choice: sur la terre ferme
  rationale: Conserve l’image concrète de la terre sèche et le mouvement depuis le domaine céleste vers le monde terrestre.
- source_word: በአዋልደ፡ ሰብእ
  choice: au moyen des filles des humains
  rationale: Explicite la valeur instrumentale de በ et évite de faire des filles des humains les agentes grammaticales de l’égarement.
theological_decisions:
- issue: Identité des « enfants des anges »
  choice: Maintenir l’expression familiale littérale dans le texte principal.
  alternative: les anges; l’armée angélique
  rationale: Le guèze présente une expression inhabituelle qu’il ne convient pas d’aplanir ni d’harmoniser; une note signale l’interprétation collective possible.
- issue: Valeur des deux verbes d’égarement
  choice: Employer « égara » dans les deux propositions.
  alternative: trompa… séduisit; détourna… égara
  rationale: La répétition préserve la structure rhétorique du texte et n’introduit pas deux nuances différentes sans appui suffisant.
- issue: Rôle des filles des humains
  choice: 'Comprendre በ comme indiquant le moyen: « au moyen des ».'
  alternative: par les filles des humains; à cause des filles des humains
  rationale: Yeqon demeure le sujet actif du verbe; cette formulation évite l’ambiguïté française selon laquelle les femmes auraient elles-mêmes accompli l’action.
translation_notes:
  register: Français international moderne, clair et digne. La segmentation en deux phrases allège la formule de catalogue. « Humains » rend le collectif ሰብእ de façon inclusive et naturelle, tandis que « filles » conserve le contraste sexué explicite du passage.
