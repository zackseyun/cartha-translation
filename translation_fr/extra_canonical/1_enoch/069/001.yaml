base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: fr
  text: Et après ce jugement[a], ils les terrifieront et les opprimeront[d], parce qu’ils ont montré cela[c] à ceux qui habitent sur la terre ferme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « après cette sentence » ou « après cette condamnation ». Le mot désigne une décision ou une action judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la terre sèche »; l’expression peut préserver un contraste cosmologique avec la mer ou les eaux, plutôt que désigner simplement le monde ou l’humanité.
    reason: lexical_alternative
  - marker: c
    text: Le référent de « cela » n’est pas précisé dans ce verset; il renvoie vraisemblablement à ce qui a été révélé précédemment.
    reason: alternative_reading
  - marker: d
    text: Les personnes désignées par « ils » et « les » ne sont pas nommées dans ce verset et doivent être comprises à partir du contexte précédent.
    reason: referent_ambiguity
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: après ce jugement
  rationale: 'Le démonstratif se rattache à « jugement » : la proposition situe donc l’action après ce jugement, au lieu de faire du jugement le sujet des verbes suivants.'
- source_word: ያደነገፅዎሙ
  choice: ils les terrifieront
  rationale: Le verbe exprime le fait de provoquer une vive peur ou un profond effroi; la morphologie indique un sujet pluriel et un objet pluriel.
- source_word: ያምዕፅዎሙ
  choice: ils les opprimeront
  rationale: Le verbe désigne ici l’oppression, la violence ou l’action injuste. « Opprimeront » rend ce sens sans le transformer en expulsion.
- source_word: እስመ
  choice: parce que
  rationale: Ce connecteur introduit explicitement la cause de l’action annoncée.
- source_word: ዘንተ አርአዩ
  choice: ils ont montré cela
  rationale: La formulation reste proche de l’idée de rendre visible ou de montrer, tout en conservant le référent implicite de « cela ».
- source_word: ለእለ የኀድሩ
  choice: à ceux qui habitent
  rationale: Cette tournure participiale désigne les habitants et conserve le registre élevé du passage apocalyptique.
- source_word: ዲበ የብስ
  choice: sur la terre ferme
  rationale: L’expression désigne littéralement la terre sèche ou ferme, possiblement par contraste avec les eaux; cette image est plus précise que le simple mot « terre ».
theological_decisions:
- issue: Valeur de ኵነኔ dans le cadre apocalyptique
  choice: ce jugement
  alternative: cette condamnation; cette sentence
  rationale: « Jugement » conserve l’image judiciaire et eschatologique sans préciser indûment s’il s’agit de l’acte de juger, du verdict ou de la condamnation.
- issue: Identification des sujets et des objets des verbes
  choice: maintenir les pronoms « ils » et « les » sans identifier leurs référents
  alternative: nommer les groupes auxquels renvoie le contexte précédent
  rationale: Le verset lui-même ne nomme pas ces groupes. Les expliciter ici résoudrait une ambiguïté que le texte source laisse dépendre du contexte.
translation_notes:
  register: Français international actuel, clair et digne. La coordination initiale conserve l’enchaînement visionnaire. Les pronoms et le démonstratif restent volontairement non explicités afin de préserver les ambiguïtés du guèze.
