base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: fr
  text: Et par ce serment, les profondeurs ont été affermies[a] ; elles demeurent et ne bougent pas de leur place[b], d’éternité en éternité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont été fortifiées » ou « établies fermement ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme rendu par « place » peut aussi se traduire par « station », avec l’idée d’une place assignée dans l’ordre cosmique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: serment
  rationale: Le nom désigne ici le serment contraignant évoqué dans le contexte immédiat ; « serment » conserve sa force juridique et apocalyptique.
- source_word: ቀላይ
  choice: les profondeurs
  rationale: Le terme désigne la profondeur ou l’abîme. Le pluriel français s’accorde naturellement avec les verbes et le pronom pluriels qui suivent dans le texte guèze.
- source_word: ፀንዐት
  choice: ont été affermies
  rationale: Le verbe exprime le fait de devenir ferme, d’être fortifié ou établi. « Ont été affermies » garde la nuance résultative et l’accord initial au féminin singulier du guèze, compris collectivement, sans alourdir le français.
- source_word: ወቆሙ
  choice: elles se tiennent en place
  rationale: Le verbe signifie littéralement « elles se tiennent » ou « elles se sont tenues ». L’ajout idiomatique « en place » rend la stabilité cosmique, tandis que l’imperfectif suivant invite à présenter cet état comme durable.
- source_word: ወኢይትሐወሱ
  choice: et ne quittent pas
  rationale: 'La forme négative décrit une réalité continue : elles ne bougent pas, ne sont pas déplacées. « Ne quittent pas leur position » exprime clairement la fixité spatiale sans la limiter à un événement passé.'
- source_word: እመካኖሙ
  choice: leur position
  rationale: Le mot peut désigner leur lieu ou leur station assignée. « Position » convient à l’image d’un ordre cosmique fixe ; l’autre possibilité est signalée en note.
- source_word: እምዓለም ወእስከ ለዓለም
  choice: d’éternité en éternité
  rationale: Cette formulation suit de près la construction source « depuis l’éternité et jusqu’à l’éternité » tout en restant digne et intelligible en français.
theological_decisions:
- issue: Identification du sujet affermi par le serment
  choice: Le sujet est « les profondeurs », réalités cosmiques fixées par le serment.
  alternative: Comprendre que le serment lui-même est ferme, ou formuler impersonnellement que la stabilité vient du serment.
  rationale: ቀላይ fournit le sujet nominal, et les verbes ainsi que le pronom pluriels qui suivent renvoient à ces profondeurs. Cette lecture conserve l’imagerie cosmique au lieu de l’abstraire.
- issue: Valeur temporelle de la séquence verbale
  choice: Un affermissement accompli suivi d’un état durable au présent.
  alternative: 'Rendre toute la séquence au passé : « furent affermies, se tinrent fermes et ne furent pas déplacées ».'
  rationale: Le parfait ፀንዐት présente l’établissement comme acquis, tandis que la forme négative imperfective ኢይትሐወሱ décrit la permanence actuelle de l’ordre cosmique.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La phrase conserve l’imagerie cosmique et la progression du texte : affermissement initial, stabilité présente, permanence éternelle.'
