  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: fr
  text: Car les êtres humains ne sont pas nés pour affermir leur foi par la plume et l’encre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « par le calame et par l’eau de fiel ». L’expression peut évoquer des instruments d’écriture, d’où « la plume et l’encre », mais son sens précis demeure incertain.
    reason: cultural_note
  - marker: b
    text: 'Ou : « affermir leur bonne foi », « leur fidélité » ou « leur engagement ». Le mot traduit par « foi » peut aussi exprimer la confiance ou la loyauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit une explication ou une raison et conserve naturellement le lien avec ce qui précède.
- source_word: ኢተወልዱ ሰብእ
  choice: les êtres humains ne sont pas nés
  rationale: Rend directement le passif négatif et comprend ሰብእ au sens collectif de l’humanité, sans le limiter aux hommes de sexe masculin.
- source_word: በዘ ከመዝ
  choice: pour
  rationale: Exprime ici la finalité de façon idiomatique en français, sans alourdir la phrase par « dans ce but ».
- source_word: በቀለም ወበማየ ሐመት
  choice: avec la plume et l’encre
  rationale: Dans ce contexte d’écriture, ቀለም peut désigner le calame ou la plume, tandis que l’expression littérale « eau de fiel » désigne vraisemblablement l’encre au fiel. Cette traduction restitue l’instrument concret et l’idiome, tandis qu’une note conserve la forme littérale incertaine.
- source_word: ያጽንዑ
  choice: affermir
  rationale: Le verbe signifie rendre ferme, fort ou stable. « Affermir » convient au complément « foi » et garde la force du verbe sans préciser abusivement le mécanisme envisagé.
- source_word: ሃይማኖቶሙ
  choice: leur foi
  rationale: Le nom peut évoquer la foi, la confiance, la fidélité ou la bonne foi. « Leur foi » reste lexicalement direct, tandis qu’une note signale l’autre lecture possible dans un contexte d’engagement écrit.
theological_decisions:
- issue: Sens religieux ou relationnel de ሃይማኖቶሙ
  choice: leur foi
  alternative: leur bonne foi ; leur engagement ; leur fidélité
  rationale: Le terme a une portée religieuse possible, mais le contexte de l’écriture peut aussi orienter vers la confiance ou la bonne foi. Le texte principal conserve « foi » sans transformer le verset en énoncé doctrinal; la note maintient l’ambiguïté.
- issue: Interprétation de la plume et de l’encre
  choice: Conserver les objets d’écriture sans expliciter la nature de la critique
  alternative: Paraphraser comme une critique des contrats, des serments écrits ou des enseignements trompeurs
  rationale: Le verset ne précise pas à lui seul ce que l’écriture confirme ni pourquoi elle est rejetée. Une paraphrase doctrinale ou juridique trancherait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. « Les êtres humains » rend explicitement le sens collectif de ሰብእ. « Ne sont pas nés pour » préserve l’image de la naissance tout en restant naturel. Les notes rendent visibles l’idiome matériel et l’ambiguïté de « foi ».
