  terminology: « Asbe’el », « égara », « souillèrent » et « filles des humains » conviennent. « Saints fils des anges » est volontairement proche d’une syntaxe difficile ; la note fournit l’autre analyse possible. La note doit parler de témoin grec ou de Qumrân, plutôt que d’« araméen » en général, conformément à l’état des contrôles textuels signalé dans l’audit.
