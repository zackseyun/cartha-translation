base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: fr
  text: Et le deuxième, dont le nom était Asbe’el, celui-ci enseigna un mauvais conseil aux saints fils des anges[a] et les égara, si bien qu’ils souillèrent leur corps[b] avec les filles des humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « aux fils des saints anges ». La syntaxe du guèze est difficile, et aucun témoin grec ou de Qumrân ne permet ici de vérifier la formulation.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « leur chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: le deuxième
  rationale: Dans cette liste numérotée, le contexte immédiat impose le sens ordinal « deuxième », plutôt que le sens plus général « un autre ».
- source_word: ስሙ አስብኤል
  choice: dont le nom était Asbe’el
  rationale: Formulation française naturelle qui conserve la formule de désignation et translittère le nom propre.
- source_word: ዝንቱ አመርሙ
  choice: enseigna
  rationale: Le verbe exprime ici la transmission d’un enseignement corrupteur; le démonstratif est rendu implicitement par la reprise du sujet afin d’éviter une lourdeur en français.
- source_word: ምክረ እኩየ
  choice: un conseil mauvais
  rationale: Conserve la notion concrète de conseil corrupteur sans la réduire à un simple projet.
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: aux saints fils des anges
  rationale: Rendu au plus près des éléments lexicaux et de leur ordre apparent, tout en signalant en note l’incertitude syntaxique du guèze.
- source_word: አስሐቶሙ
  choice: les égara
  rationale: Exprime à la fois la tromperie et la déviation morale.
- source_word: ከመ ያማስኑ
  choice: si bien qu’ils souillèrent
  rationale: Rend naturellement la relation de conséquence, tout en laissant ouverte la nuance possible de but.
- source_word: ሥጋሆሙ
  choice: leur corps
  rationale: Le singulier collectif est naturel en français et rend clairement la dimension corporelle; le sens littéral « leur chair » est conservé en note.
- source_word: በአዋልደ ሰብእ
  choice: avec les filles des humains
  rationale: « Avec » traduit naturellement l’union impliquée; « des humains » rend le génitif sans employer « hommes » dans un sens potentiellement ambigu.
theological_decisions:
- issue: Interprétation de ለደቂቀ መላእክት ቅዱሳን
  choice: aux saints fils des anges
  alternative: aux fils des saints anges; aux saints fils de Dieu
  rationale: La syntaxe est difficile et aucun témoin grec ou araméen ne permet ici de la contrôler. Le texte principal conserve donc les composantes explicites du guèze sans substituer une formule théologique plus familière.
- issue: Valeur de ከመ dans la proposition finale
  choice: si bien qu’ils souillèrent
  alternative: afin qu’ils souillent
  rationale: Le contexte permet une nuance de résultat ou de but. Le français retient le résultat, plus fluide ici, sans modifier la responsabilité des êtres égarés.
- issue: Rendu de ሥጋ
  choice: corps
  alternative: chair
  rationale: « Corps » communique clairement la souillure corporelle dans ce contexte; « chair », plus littéral et potentiellement chargé théologiquement, est indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère solennel de l’énumération, évite les archaïsmes et documente les deux principales incertitudes du texte.
