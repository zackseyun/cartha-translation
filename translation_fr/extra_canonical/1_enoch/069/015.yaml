base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: fr
  text: 'Et voici la puissance de ce serment : il est puissant et ferme ; il plaça ce serment, Akaé, dans la main de Mikaël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main de Mikaël » ; cette expression peut indiquer qu’une chose est confiée à quelqu’un ou placée sous son autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  choice: la puissance
  rationale: Le nom désigne la force ou la puissance. « Puissance » exprime ici l’efficacité solennelle du serment sans la réduire à une force physique.
- source_word: ማሐላ
  choice: serment
  rationale: Le terme répété renvoie au serment évoqué dans le contexte. « Serment » est direct et n’ajoute pas l’idée plus précise d’une malédiction.
- source_word: ኃያል
  choice: puissant
  rationale: Employé comme attribut du serment, l’adjectif en souligne la force agissante et convient au registre élevé du passage.
- source_word: ፅኑዕ
  choice: ferme
  rationale: L’adjectif évoque ce qui est solidement établi et inébranlable. « Ferme » conserve cette nuance de stabilité.
- source_word: አንበሮ
  choice: il remit
  rationale: Le verbe signifie littéralement placer ou déposer. Avec l’expression « entre les mains de », « remit » rend naturellement en français l’acte de confier tout en conservant l’image concrète.
- source_word: አካእ
  choice: Akaé
  rationale: Le nom propre explicitement présent dans le texte identifie le serment; il est translittéré sous une forme lisible en français.
- source_word: በእዴሁ ለሚካኤል
  choice: entre les mains de Mikaël
  rationale: L’expression de la main est conservée sous sa forme idiomatique française et suggère que le serment est confié à Mikaël ou placé sous son autorité.
theological_decisions:
- issue: Faut-il traduire concrètement ou interpréter l’expression de la main ?
  choice: entre les mains de Mikaël
  alternative: sous l’autorité de Mikaël
  rationale: Le guèze conserve une image concrète qui évoque vraisemblablement la remise ou l’autorité. La traduction française garde cette image sans imposer une seule interprétation.
- issue: Fonction de « Akaé » dans la phrase
  choice: apposition au groupe « ce serment »
  alternative: intégrer le nom comme « le serment Akaé »
  rationale: Le texte place le nom près du serment. L’apposition préserve cette identification tout en laissant subsister la légère tension syntaxique du texte source.
translation_notes:
  register: Français moderne, international et digne. La ponctuation en deux phrases évite une période lourde. Les noms sont translittérés « Akaé » et « Mikaël » selon une graphie naturelle en français; l’image de la main est maintenue dans une tournure idiomatique.
