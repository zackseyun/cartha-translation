base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: fr
  text: 'Le cinquième avait pour nom Kasdeya. C’est lui qui montra aux enfants des hommes tous les coups funestes des esprits et des démons[a], les coups portés à l’embryon dans le sein maternel, pour qu’il tombe[b], le coup porté à l’âme[c] — la morsure du serpent —, et le coup qui survient à midi : le fils du serpent, nommé Taba’et[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze traduit par « coups » peut aussi désigner des frappes, des atteintes ou des afflictions. Il est répété plusieurs fois dans ce verset.
    reason: lexical_alternative
  - marker: b
    text: L’expression est difficile. Elle semble décrire une atteinte portée à l’embryon dans le sein maternel et entraînant une fausse couche ; littéralement, le texte dit qu’il « tombe ».
    reason: textual_difficulty
  - marker: c
    text: Les mots traduits par « le coup porté à l’âme » sont incertains dans ce témoin ; le singulier suit la lecture probable du texte conservé.
    reason: textual_variant
  - marker: d
    text: La syntaxe finale est condensée. « Le fils du serpent, nommé Taba’et » peut identifier le coup qui survient à midi, désigner l’être qui le cause, ou constituer une précision sur le serpent.
    reason: alternative_reading
lexical_decisions:
- source_word: ኃምስ ስሙ ካስድያእ
  choice: Le cinquième avait pour nom Kasdeya
  rationale: La formule française conserve l’ordinal et la formule de nomination, tout en translittérant le nom propre au plus près du guèze.
- source_word: ዘአርአዩ
  choice: montra
  rationale: Le verbe signifie faire voir ou faire connaître. « Montra » en garde la force concrète sans préciser indûment qu’il s’agissait d’un enseignement formel.
- source_word: ለውሉደ ሰብእ
  choice: aux enfants des humains
  rationale: Cette formulation conserve l’expression apocalyptique littérale tout en employant un français moderne et générique.
- source_word: ኵሎ ዝብጠታተ እኩየ
  choice: tous les coups funestes
  rationale: Le nom répété évoque des coups, des atteintes ou des frappes. « Coups » maintient cette image et sa répétition; « funestes » exprime leur caractère mauvais et nuisible.
- source_word: ዘነፍሳት ወዘአጋንንት
  choice: des esprits et des démons
  rationale: La traduction maintient la distinction entre les deux catégories d’agents spirituels sans les confondre.
- source_word: ዝብጠታተ ባእባአ ማሕፀን
  choice: les coups portés à l’embryon dans le sein maternel
  rationale: Cette formulation comprend la chaîne nominale comme désignant l’embryon atteint dans le sein, et évite le faux sens selon lequel l’embryon donnerait lui-même les coups.
- source_word: ከመ ይደቅ
  choice: pour qu’il tombe
  rationale: Le rendu conserve l’image concrète de la chute dans une clause dont le contexte indique vraisemblablement une fausse couche.
- source_word: '[ዝብጠተ ነፍስ]'
  choice: le coup porté à l’âme
  rationale: Le singulier du texte est respecté. « Âme » préserve la dimension spirituelle du terme, tandis qu’une note signale l’incertitude textuelle.
- source_word: ንስክተ አርዌ
  choice: la morsure du serpent
  rationale: « Morsure » est le sens concret le plus naturel pour l’attaque d’un serpent.
- source_word: ዘይከውን በቀትር
  choice: qui survient à midi
  rationale: Le repère temporel est conservé littéralement, sans neutraliser sa possible portée menaçante.
- source_word: ወልዳ ለአርዌ ዘስሙ ተባዕት
  choice: le fils du serpent, nommé Taba’et
  rationale: La formulation suit la syntaxe condensée du témoin et translittère le nom propre, sans trancher entièrement le rapport de cette désignation avec le coup de midi.
theological_decisions:
- issue: Nature des atteintes révélées par Kasdeya
  choice: Une série d’atteintes funestes associées aux esprits, aux démons, à la grossesse, à l’âme, au serpent et à midi
  alternative: Des armes ou blessures purement physiques; ou une liste explicite de formules magiques
  rationale: Le vocabulaire répété des coups, joint aux esprits, aux démons, à l’âme et au serpent, favorise des atteintes occultes ou démoniaques, mais la traduction évite d’ajouter le mot « magie », absent de la formulation.
- issue: Rapport entre le coup de midi et « le fils du serpent »
  choice: La ponctuation présente « le fils du serpent, nommé Taba’et » comme une possible identification ou précision du coup de midi
  alternative: Il pourrait s’agir d’un être distinct, ou d’une glose identifiant le serpent lui-même
  rationale: La syntaxe est fortement comprimée et ne permet pas de résoudre avec certitude le rapport d’apposition. Les deux-points gardent le lien étroit tout en laissant subsister l’ambiguïté, explicitée en note.
- issue: Sens de la chute de l’embryon
  choice: Une atteinte entraînant vraisemblablement une fausse couche
  alternative: Une chute ou expulsion décrite sans précision obstétricale
  rationale: Le contexte du sein maternel rend probable la fausse couche, mais le texte principal conserve l’image littérale « tombe » et réserve l’explication à la note.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « coup » reproduit un trait structurant du guèze. Les images apocalyptiques et démonologiques sont conservées sans être rationalisées, et les difficultés textuelles ou syntaxiques sont signalées plutôt que résolues silencieusement.
