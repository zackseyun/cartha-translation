base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: fr
  text: Celui-ci demanda à Mikaël de lui montrer le nom caché[a], afin qu’ils le mentionnent dans le serment[b] et qu’ils tremblent devant ce nom et ce serment — ceux qui avaient révélé aux êtres humains tout ce qui est caché[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le nom secret ». L’adjectif guèze signifie « caché » ou « dissimulé » et n’impose pas ici un sens mystique technique.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se traduire par « se le rappeler ». Dans ce contexte, la mention du nom au cours du serment peut impliquer son invocation solennelle.
    reason: lexical_alternative
  - marker: c
    text: 'La proposition finale semble identifier ceux qui doivent mentionner le nom et trembler : ceux qui ont dévoilé aux êtres humains les réalités cachées. La syntaxe reste néanmoins condensée.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዝንቱ
  choice: Celui-ci
  rationale: Conserve la valeur déictique marquée du démonstratif, qui renvoie au personnage angélique mentionné auparavant.
- source_word: ይቤሎ፡ ለሚካኤል፡ ያርእዮ
  choice: demanda à Mikaël de lui montrer
  rationale: Le jussif à la troisième personne ያርእዮ, avec suffixe objet, dépend de la formule de parole et exprime ici une demande ou un ordre indirect, non un impératif en discours direct. « Demanda » donne en français une construction naturelle sans trancher vers un ordre explicite.
- source_word: ሚካኤል
  choice: Mikaël
  rationale: Translittère directement la forme guèze plutôt que d’employer la forme française traditionnelle « Michel ».
- source_word: ስመ፡ ኅቡአ
  choice: le nom caché
  rationale: « Caché » rend le sens de ce qui est dissimulé sans imposer au texte une notion mystique technique de « nom secret ».
- source_word: ከመ፡ ይዝክርዎ፡ በመሐላ
  choice: afin qu’ils le mentionnent dans le serment
  rationale: Le verbe peut évoquer le souvenir ou la mention. En contexte de serment, « mentionnent » reste idiomatique et peut inclure l’idée d’une invocation solennelle sans l’imposer.
- source_word: መሐላ
  choice: serment
  rationale: Rend le sens principal du terme; la crainte associée au serment dans ce contexte ne justifie pas de traduire par « malédiction ».
- source_word: ከመ፡ ይርዓዱ፡ እምውእቱ፡ ስም፡ ወማሐላ
  choice: et qu’ils tremblent devant ce nom et ce serment
  rationale: « Trembler devant » conserve la réaction physique et la crainte suscitée par le nom et le serment.
- source_word: እለ፡ አርአዩ፡ ለውሉደ፡ ሰብእ፡ ኵሎ፡ ዘበኅቡእ
  choice: ceux qui avaient révélé aux êtres humains tout ce qui est caché
  rationale: La proposition relative désigne vraisemblablement les auteurs de révélations interdites. « Êtres humains » rend naturellement l’expression littérale « enfants des hommes » en français moderne.
theological_decisions:
- issue: Référent du sujet pluriel de « mentionnent » et « tremblent »
  choice: La proposition finale en apposition identifie ce groupe à ceux qui ont révélé les choses cachées aux êtres humains.
  alternative: Le pluriel pourrait viser plus généralement ceux qui entendent ou emploient le serment; la syntaxe condensée pourrait aussi comporter un changement de sujet.
  rationale: Le relatif final fournit l’antécédent le plus naturel dans le contexte des êtres célestes coupables d’avoir transmis des connaissances cachées. Le tiret conserve toutefois la structure tardive et quelque peu tendue du guèze au lieu de la réorganiser entièrement.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation maintient la reprise déictique « Celui-ci », la translittération « Mikaël » et la tension syntaxique du sujet retardé, tout en évitant un vocabulaire ésotérique ou confessionnel ajouté.
