base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: fr
  text: Par ce serment, le soleil et la lune accomplissent leur parcours[a], et ils ne s’écartent jamais de l’ordre qui leur est donné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leurs circuits » : le terme désigne le mouvement régulier des astres.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « ils ne transgressent pas leur commandement pour toujours ». Avec la négation, l’expression temporelle finale signifie naturellement « jamais », mais elle peut évoquer plus largement une durée sans limite ou remontant aux temps anciens.'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ፡ ማሐላ
  choice: Par ce serment
  rationale: La préposition በ marque ici naturellement le moyen ou l’instrument, tandis que ማሐላ désigne un serment solennel. « Par ce serment » conserve la force juridique et cosmique de l’expression.
- source_word: ፀሐይ፡ ወወርኅ
  choice: le soleil et la lune
  rationale: Les deux astres sont présentés comme des acteurs du maintien de l’ordre cosmique. Les articles définis sont naturels en français.
- source_word: ይፌጽሙ
  choice: accomplissent
  rationale: Le verbe exprime l’idée de mener à son terme ou d’exécuter pleinement. « Accomplissent » convient au mouvement régulier qui leur est assigné et garde un registre digne.
- source_word: ምሕዋሮሙ
  choice: leur parcours
  rationale: Le nom désigne ici le mouvement ou trajet régulier des astres. Le singulier collectif français « leur parcours » est fluide tout en permettant en note l’image plus cyclique des « circuits ».
- source_word: ወኢየሐልፉ፡ እምትእዛዞሙ
  choice: et ils ne s’écartent … de l’ordre qui leur est donné
  rationale: Avec la préposition እም, le verbe ሐለፈ peut exprimer le fait de s’écarter ou de dépasser une limite. « L’ordre qui leur est donné » rend explicite en français qu’il s’agit de la prescription imposée aux astres, et non d’un ordre qu’ils donneraient eux-mêmes.
- source_word: እምዓለም
  choice: jamais
  rationale: 'Dans une proposition négative, cette expression temporelle fonctionne idiomatiquement comme un absolu : « jamais ». Cette traduction évite le calque obscur « depuis l’éternité », tout en signalant en note l’étendue temporelle de la formule.'
theological_decisions:
- issue: Conserver ou neutraliser la représentation des astres comme soumis à un ordre garanti par un serment
  choice: Conserver « serment » et l’idée que les astres ne s’écartent pas de l’ordre reçu
  alternative: Employer un langage purement astronomique, par exemple « suivent leurs cycles sans dévier »
  rationale: Le texte guèze associe explicitement le serment, le mouvement des astres et leur conformité à un commandement. La traduction maintient cette tension juridique et cosmique sans préciser l’auteur du commandement au-delà de ce que dit le verset.
- issue: Valeur temporelle de እምዓለም sous négation
  choice: Traduire idiomatiquement par « jamais »
  alternative: « pour toujours » ou « depuis toujours »
  rationale: Sous la négation, « jamais » exprime le plus naturellement l’absolu temporel en français. La note préserve néanmoins la possibilité d’entendre la formule comme une référence générale à une durée sans limite ou remontant aux temps anciens.
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve le registre juridico-apocalyptique du serment et de l’ordre cosmique, tout en évitant un calque temporel peu naturel.
