base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: fr
  text: Et sur eux, ce serment s’est affermi[a] ; par lui, ils sont gardés, et leurs chemins sont gardés[b] ; leurs parcours ne disparaissent pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est devenu ferme » ou « a prévalu ».
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien est difficile à cet endroit. La répétition du verbe passif peut signifier à la fois qu’ils sont gardés par le serment et que leurs chemins le sont aussi.
    reason: textual_variant
  - marker: c
    text: Ou « leurs cycles ne cessent pas » ou « leurs circuits ne périssent pas ». Le terme peut évoquer de façon générale des parcours ordonnés ou, plus précisément, des mouvements cosmiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲቤሆሙ
  choice: sur eux
  rationale: La préposition exprime ici l’idée de « sur » ou « au-dessus de », ce qui laisse entendre l’autorité contraignante du serment sans réduire le sens à une simple présence « parmi eux ».
- source_word: ጸንዐ
  choice: s’est affermi
  rationale: Le verbe indique que le serment est devenu ferme ou solidement établi. Cette formulation française est naturelle et conserve l’aspect dynamique.
- source_word: ዝማሐላ
  choice: ce serment
  rationale: Le démonstratif ዝ est rendu explicitement par « ce », tandis que le nom désigne directement un serment.
- source_word: ይትዓቀቡ
  choice: ils sont gardés
  rationale: La forme imperfective passive ou réfléchie décrit une action continue. « Sont gardés » préserve l’ambiguïté entre protection, maintien et contrainte.
- source_word: ቦቱ
  choice: par lui
  rationale: 'Le pronom renvoie au serment et reçoit une valeur instrumentale : c’est par ce serment qu’ils sont gardés.'
- source_word: ፍናዊሆሙ
  choice: leurs chemins
  rationale: Le terme désigne des voies ou chemins. « Chemins » reste concret et peut aussi évoquer des trajectoires ordonnées.
- source_word: ምሕዋራቲሆሙ
  choice: leurs parcours
  rationale: Le terme peut désigner des parcours, des cycles ou des circuits. « Parcours » maintient le sens d’un mouvement ordonné sans imposer une interprétation exclusivement astronomique.
- source_word: ኢይማስን
  choice: ne disparaissent pas
  rationale: Le verbe négatif peut exprimer le fait de ne pas périr, ne pas échouer ou ne pas disparaître. Cette formulation convient aux parcours ou cycles et demeure assez large.
theological_decisions:
- issue: Le serment relève-t-il de l’obéissance morale, d’un lien juridique ou de l’ordre cosmique ?
  choice: La traduction conserve conjointement l’autorité du serment, la garde de ceux qui lui sont soumis et la stabilité de leurs chemins ou parcours.
  alternative: Comprendre le verset exclusivement comme la soumission d’êtres angéliques, ou exclusivement comme la stabilité des cycles cosmiques.
  rationale: Le vocabulaire du serment suggère une force contraignante, tandis que les chemins et parcours évoquent un mouvement ordonné, peut-être cosmique. Le texte français ne tranche pas entre ces dimensions.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le parallélisme du guèze et son ambiguïté entre protection, contrainte et stabilité cosmique.
