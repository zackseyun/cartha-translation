base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: fr
  text: 'Et voici les noms de ces anges, et voici leurs noms : le premier d’entre eux était Semyaza, le deuxième Artaqifa, le troisième Armen, le quatrième Kokabel, le cinquième Turiel, le sixième Rumyal, le septième Daniyal, le huitième Neqael, le neuvième Baraqel, le dixième Azazel, le onzième Armaros, le douzième Batariel, le treizième Basasael, le quatorzième Hananel, le quinzième Turiel, le seizième Simipesiel, le dix-septième Yeterel, le dix-huitième Tumael, le dix-neuvième Turiel, le vingtième Teremael et le vingt et unième Te’azazel.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de cette liste sont difficiles à établir, car cette partie de 1 Hénoch est essentiellement conservée en guèze et les formes transmises sont parfois incertaines. La traduction reste proche des formes éthiopiennes visibles plutôt que de les harmoniser avec des graphies plus familières.
    reason: textual_variant
  - marker: b
    text: Le nom rendu par « Turiel » apparaît trois fois dans le texte éthiopien, avec de légères variations orthographiques. Cette répétition est conservée.
    reason: textual_variant
  - marker: c
    text: D’autres éditions et traductions donnent parfois des formes différentes pour certains de ces noms; ces écarts reflètent généralement l’incertitude de leur lecture ou de leur translittération.
    reason: alternative_reading
lexical_decisions:
- source_word: ወነዋ
  choice: Et voici
  rationale: Conserve la particule présentative du guèze et sa fonction d’introduction solennelle, sans la réduire à une simple coordination.
- source_word: አስማቲሆሙ፡ ለእሉክ፡ መላእክት
  choice: les noms de ces anges
  rationale: La construction précise à qui appartiennent les noms; « ces anges » rend naturellement le démonstratif dans ce contexte rétrospectif.
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: et voici leurs noms
  rationale: Maintient la seconde proposition introductive et la répétition du texte source plutôt que de les fondre avec la première.
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: le premier d’entre eux
  rationale: Rend explicitement l’ordinal et la valeur partitive de ዚአሆሙ.
- source_word: ወካልእ / ሠሣልስ / ወራብዕ …
  choice: le deuxième / le troisième / le quatrième…
  rationale: Préserve tous les ordinaux de cette liste formelle au lieu de les condenser.
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Translittération proche de la vocalisation éthiopienne, sans harmonisation avec une forme traditionnelle ultérieure.
- source_word: ኮከብኤል
  choice: Kokabel
  rationale: Le nom propre est translittéré plutôt que traduit, même s’il semble contenir l’élément signifiant « étoile ».
- source_word: ጡሩኤል / ጡርኤል
  choice: Turiel
  rationale: Une même translittération lisible est retenue pour les formes orthographiques très proches; les trois occurrences sont néanmoins conservées.
- source_word: ሩምያል
  choice: Rumyal
  rationale: Suit directement la forme guèze au lieu de la normaliser en un nom angélique plus familier.
theological_decisions:
- issue: Normalisation des noms angéliques selon d’autres traditions hénochiennes ou postérieures
  choice: Conserver des translittérations proches du témoin guèze
  alternative: Employer des formes harmonisées telles que Daniel, Ramiel ou Kokabiel
  rationale: Dans cette section principalement transmise en guèze, l’harmonisation masquerait l’état réel et parfois incertain du témoin.
- issue: Répétition du nom Turiel dans la liste
  choice: Conserver les trois occurrences transmises
  alternative: Corriger ou remplacer les doublons présumés
  rationale: Faute d’un appui textuel suffisant pour une émendation, la répétition ne doit pas être silencieusement supprimée.
- issue: Double formule d’introduction
  choice: 'Rendre les deux propositions : « Et voici les noms… et voici leurs noms »'
  alternative: Les fusionner en une seule formule plus fluide
  rationale: Le guèze présente deux propositions distinctes; leur répétition participe au style formel du passage et doit être préservée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition introductive et tous les ordinaux sont maintenus en raison de leur présence explicite dans le guèze. Les noms propres sont translittérés sobrement, sans francisation ni harmonisation confessionnelle.
