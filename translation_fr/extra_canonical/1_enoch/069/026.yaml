base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: fr
  text: Et il y eut parmi eux une grande joie, et ils bénirent, louèrent et exaltèrent, parce que le nom de ce Fils de l’homme[a] leur avait été révélé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre guèze traduit par « Fils de l’homme » est difficile à rendre littéralement. On pourrait aussi traduire « fils de l’humanité » ou, moins probablement, « fils des vivants »; dans les Paraboles, il fonctionne toutefois comme le titre reconnu d’une figure exaltée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: il y eut parmi eux
  rationale: La tournure introduit un état qui se produit pour eux ou au milieu d’eux. Cette formulation française est naturelle et conserve la valeur résultative du guèze.
- source_word: ፍሥሐ፡ ዓቢይ
  choice: une grande joie
  rationale: L’expression désigne une joie intense et célébrative; « une grande joie » est claire, digne et concise.
- source_word: ባረኩ፡ ወሰብሑ፡ ወአልዐሉ
  choice: bénirent, louèrent et exaltèrent
  rationale: Les trois verbes sont maintenus séparément et dans leur ordre afin de préserver la cadence cumulative et liturgique du texte.
- source_word: በእንተ፡ ዘተከሥተ፡ ሎሙ
  choice: parce que … leur avait été révélé
  rationale: La proposition exprime la cause de leur joie et de leur louange. Le plus-que-parfait rend naturellement en français l’antériorité de la révélation.
- source_word: ስሙ
  choice: le nom
  rationale: Le nom est déterminé par le contexte et par le complément qui suit; ce choix conserve l’accent porté sur l’identité ou l’autorité révélée.
- source_word: ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: de ce Fils de l’homme
  rationale: Dans les Paraboles, l’expression fonctionne comme un titre reconnu. « Fils de l’homme » conserve l’idiome apocalyptique traditionnel, tandis que « ce » rend la valeur démonstrative de ውእቱ.
theological_decisions:
- issue: Traduction de l’expression titulaire ወልደ እጓለ እመሕያው
  choice: ce Fils de l’homme
  alternative: ce fils de l’humanité; ce fils des vivants
  rationale: La forme guèze est difficile sur le plan littéral, mais elle fonctionne ici comme le titre énochien d’une figure exaltée. La traduction retenue respecte cet usage local sans développer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La répétition des trois verbes est conservée pour restituer la solennité liturgique du passage; la formulation ne précise pas l’objet des verbes lorsque le guèze le laisse implicite.
