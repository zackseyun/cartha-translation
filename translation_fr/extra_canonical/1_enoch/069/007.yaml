base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: fr
  text: Et de sa main, ils sortirent[b] contre ceux qui habitent sur la terre ferme[a], depuis ce jour-là et pour les siècles des siècles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ceux qui vivent sur la terre ». Littéralement : « ceux qui habitent sur la terre sèche ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe guèze est au singulier : « il sortit » ; il renvoie vraisemblablement aux « armes de mort » mentionnées au verset précédent.'
    reason: source_grammar
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: de sa main
  rationale: Conserve l’image concrète de la main comme origine ou moyen d’action, sans l’expliciter en « pouvoir ».
- source_word: ወፅአ
  choice: ils sortirent
  rationale: Le verbe guèze est morphologiquement au singulier, mais son antécédent contextuel est le collectif pluriel « les armes de mort » du verset précédent. Le pluriel français maintient clairement ce lien anaphorique.
- source_word: ዲቤሆሙ
  choice: contre ceux
  rationale: Dans ce contexte hostile ou judiciaire, « contre » exprime une action dirigée, plutôt qu’une simple position au-dessus d’eux.
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: ceux qui habitent sur la terre ferme
  rationale: « Habitent » rend l’idée de demeure, et « terre ferme » conserve l’image concrète de la terre sèche tout en restant naturelle en français.
- source_word: እምይእቲ ዕለት
  choice: depuis ce jour-là
  rationale: Expression temporelle naturelle indiquant le point de départ d’une action durable.
- source_word: እስከ ለዓለመ ዓለም
  choice: pour les siècles des siècles
  rationale: Reproduit la formule emphatique fondée sur la répétition de « siècle/âge » et son registre apocalyptique.
theological_decisions:
- issue: Faut-il généraliser የብስ en « terre » ou conserver l’image de la terre sèche ?
  choice: terre ferme
  alternative: terre
  rationale: Le texte guèze emploie une désignation concrète susceptible de porter une nuance cosmologique. « Terre ferme » préserve cette image sans imposer une interprétation doctrinale.
- issue: Accord du verbe ወፅአ et identification de son sujet
  choice: ils sortirent
  alternative: il sortit
  rationale: Bien que le verbe guèze soit au masculin singulier, le contexte le rattache aux « armes de mort » du verset précédent; le pluriel français rend cette continuité intelligible tout en signalant la forme littérale en note.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’imagerie spatiale et la cadence apocalyptique, tout en évitant l’archaïsme. Les marqueurs de notes suivent l’élément qu’ils éclairent.
