base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: fr
  text: Et là, mes yeux virent les réserves cachées des éclairs et du tonnerre[a], les réserves cachées des vents — comment leurs bouches sont divisées[b] afin qu’ils soufflent sur la terre —, ainsi que les réserves cachées des nuages et de la rosée. Là, en ce lieu, je vis d’où ils viennent, et de là la poussière de la terre se rassasie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépôts secrets ». Le terme guèze peut désigner des réalités ou des lieux cachés et tenus en réserve.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « comment leurs bouches sont divisées » : image anthropomorphique des ouvertures ou des issues par lesquelles soufflent les vents.'
    reason: clarification
  - marker: c
    text: 'Littéralement, la dernière proposition présente vraisemblablement « la poussière de la terre » comme sujet d’un verbe signifiant « se rassasier » ou « être remplie ». Selon une autre analyse, on pourrait comprendre : « de là, ils arrosent la poussière de la terre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: réserves cachées
  rationale: Dans cette vision cosmique, le terme évoque des réalités ou lieux tenus en réserve. « Réserves cachées » conserve cette image sans imposer l’idée plus précise de salles ou de magasins.
- source_word: መብረቅት / ነጐድጓድ
  choice: éclairs / tonnerre
  rationale: Ces noms désignent ici des phénomènes météorologiques. Le pluriel « éclairs » et le collectif singulier « tonnerre » sont naturels en français.
- source_word: ነፋሳት
  choice: vents
  rationale: Le contexte météorologique et la proposition « afin qu’ils soufflent sur la terre » favorisent nettement « vents » plutôt que « esprits ».
- source_word: አፎ ይትከፈሉ
  choice: leurs bouches sont divisées
  rationale: Cette formulation préserve l’image anthropomorphique et la voix passive du texte, même si « ouvertures sont réparties » serait plus explicite fonctionnellement.
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: afin qu’ils soufflent sur la terre
  rationale: La tournure rend naturellement la valeur finale de la proposition et le sens météorologique du verbe.
- source_word: ደመናት / ጠል
  choice: nuages / rosée
  rationale: Termes météorologiques directs, rendus sans amplification.
- source_word: እምኀበ ይመጽእ
  choice: d’où ils viennent
  rationale: Le pluriel peut reprendre l’ensemble des phénomènes précédemment mentionnés. « Viennent » reste proche du verbe sans ajouter l’idée de jaillissement.
- source_word: ይፀግቡ ጸበለ ምድር
  choice: la poussière de la terre se rassasie
  rationale: La morphologie du verbe favorise un sens intransitif, « être rassasié, être rempli ». Cette traduction, quoique imagée en français, conserve la poussière comme sujet et évite de transformer silencieusement le verbe en causatif.
theological_decisions:
- issue: 'Sens de ነፋሳት : « vents » ou « esprits »'
  choice: vents
  alternative: esprits
  rationale: L’énumération des éclairs, du tonnerre, des nuages et de la rosée, ainsi que l’action de souffler sur la terre, établit un contexte météorologique. La traduction ne spiritualise donc pas le terme.
- issue: Agent et voix dans la dernière proposition
  choice: la poussière de la terre se rassasie
  alternative: ils arrosent la poussière de la terre
  rationale: Le texte permet une image où le sol reçoit l’humidité jusqu’à satiété, tandis qu’une traduction active ferait des phénomènes le sujet d’un verbe causatif que la forme transmise n’exprime vraisemblablement pas. La tension est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe ample et l’image des « bouches » maintiennent le caractère visionnaire et cosmique du passage; les tirets structurent l’incise sans simplifier l’enchaînement original.
