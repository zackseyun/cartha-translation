base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: fr
  text: Là, je vis les dépôts de la foudre. C’est de là que sont répartis le vent provenant du dépôt de la grêle et le vent provenant du dépôt de la brume[a]. Celui du nuage et son nuage[b] demeurent au-dessus de la terre dès avant le monde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze traduit par « brume » est incertain dans ce témoin ; il peut aussi désigner le givre, la gelée blanche, la rosée ou un phénomène météorologique voisin.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la tournure est proche de « celui du nuage et son nuage ». Le texte guèze est difficile ; « celui » semble renvoyer au dépôt, mais le rapport exact entre les deux expressions reste incertain.
    reason: textual_difficulty
  - marker: c
    text: Ou « dès avant l’âge ». Le terme peut désigner le monde ou un âge ; la formulation exprime en tout cas une antériorité primordiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ / መዝገበ
  choice: dépôts / dépôt
  rationale: Le terme désigne des lieux où sont gardées des réserves. « Dépôts » conserve l’image concrète des réserves météorologiques célestes sans la connotation financière possible de « trésors ».
- source_word: ፀዳዋነ
  choice: foudre
  rationale: Dans cette énumération de phénomènes météorologiques, le mot désigne naturellement la foudre ou ses éclairs. Le singulier collectif est idiomatique en français.
- source_word: ይትከፈሉ
  choice: sont répartis
  rationale: La forme exprime une distribution ordonnée. Le pluriel français s’accorde avec les deux sujets coordonnés et conserve la valeur passive.
- source_word: ነፋስ … ወነፋስ
  choice: le vent … et le vent
  rationale: Le texte répète explicitement le nom au singulier. La traduction maintient cette répétition au lieu de la réduire au pluriel « les vents ».
- source_word: በረድ
  choice: grêle
  rationale: Il s’agit du terme météorologique courant pour la grêle.
- source_word: ጊሜ
  choice: brume
  rationale: Le référent météorologique exact est incertain. « Brume » convient au voisinage du vocabulaire des nuages, tandis que les autres possibilités sont signalées en note.
- source_word: ዘደመና / ወደመና ዚአሁ
  choice: Celui du nuage et son nuage
  rationale: « Celui » rend le pronom relatif ou démonstratif ዘ et renvoie vraisemblablement au dépôt mentionné auparavant. La répétition opaque autour du nuage est conservée plutôt que lissée.
- source_word: የኀድር
  choice: demeurent
  rationale: Le verbe évoque le fait de rester, séjourner ou subsister. « Demeurent » convient au registre cosmologique et à la durée exprimée.
- source_word: እምቅድመ ዓለም
  choice: depuis avant le monde
  rationale: Cette formulation garde la force temporelle primordiale de l’expression sans décider si ዓለም désigne précisément le monde créé ou un âge.
theological_decisions:
- issue: Portée de la formule temporelle primordiale dans ce tableau cosmologique
  choice: depuis avant le monde
  alternative: depuis avant l’âge
  rationale: La traduction préserve l’ambiguïté cosmologique du texte et n’impose aucune conclusion doctrinale ultérieure sur l’éternité ou le mode de création.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les répétitions et l’étrangeté syntaxique significatives du témoin guèze, tout en divisant la longue chaîne coordonnée en trois phrases pour assurer la clarté.
