base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: fr
  text: Là, je vis les demeures des pécheurs et les demeures des saints[a] ; là aussi, je vis tous les pécheurs chassés de là — ceux qui renient le nom du Seigneur des Esprits — et traînés. Ils ne pouvaient tenir debout[b] à cause du châtiment qui sort du Seigneur des Esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut désigner des personnes consacrées, des êtres célestes, ou les uns et les autres ; le texte ne précise pas ici de qui il s’agit.
    reason: alternative_reading
  - marker: b
    text: L’expression peut aussi signifier qu’ils ne pouvaient subsister ou demeurer sous le châtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: les demeures
  rationale: Le nom désigne des lieux d’habitation. Sa répétition pour les deux groupes est conservée afin de maintenir le parallélisme spatial de la vision.
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Désignation morale courante qui conserve le contraste apocalyptique avec les saints.
- source_word: ቅዱሳን
  choice: les saints
  rationale: Formulation française naturelle et suffisamment large pour désigner des humains sanctifiés, des êtres célestes, ou les deux, sans préciser ici le référent.
- source_word: ይሰደዱ
  choice: chassés de cet endroit
  rationale: Le verbe passif exprime un éloignement forcé; « chassés » restitue clairement la force expulsive et judiciaire.
- source_word: ይክሕድዎ ለስመ
  choice: renient le nom de
  rationale: La traduction maintient la mention explicite du « nom » et la force de répudiation du verbe.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Ce titre divin caractéristique de 1 Hénoch est rendu de façon transparente et constante.
- source_word: ይስሐቡ
  choice: traînés au loin
  rationale: Le verbe évoque l’action de tirer ou de traîner; cette formulation préserve la violence de la scène punitive.
- source_word: ቀዊመ አልቦሙ
  choice: ils ne pouvaient tenir debout
  rationale: Cette expression restitue le sens concret d’une incapacité à rester debout ou à résister, sans introduire l’acception juridique moderne d’« avoir qualité ».
- source_word: መቅሠፍት
  choice: châtiment
  rationale: Dans cette scène de jugement, « châtiment » exprime la dimension punitive sans déterminer la forme précise du fléau ou de l’affliction.
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: qui sort du Seigneur des esprits
  rationale: La formulation conserve l’image dynamique d’un châtiment qui émane de sa source divine.
theological_decisions:
- issue: Identité des « saints »
  choice: Conserver le terme général « les saints » sans identifier davantage leur nature.
  alternative: « les êtres saints », « les anges » ou « les justes consacrés »
  rationale: Le guèze ne tranche pas explicitement entre des personnes sanctifiées et des êtres célestes; la traduction préserve cette ambiguïté.
- issue: Portée de « renient le nom du Seigneur des esprits »
  choice: Maintenir la référence explicite au nom divin.
  alternative: « rejettent le Seigneur des esprits » ou « ne croient pas au Seigneur des esprits »
  rationale: Le texte mentionne expressément le « nom », porteur d’autorité et d’identité; le supprimer affaiblirait la formulation de la source.
- issue: Sens de l’incapacité à tenir
  choice: Rendre l’image physique par « ils ne pouvaient tenir debout ».
  alternative: « ils ne pouvaient subsister » ou « il n’y avait pas de place où ils puissent se tenir »
  rationale: La formulation source permet une nuance de station, de résistance ou de subsistance. Le texte principal retient l’image la plus directe, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « demeures » reproduit le parallélisme de la source. « Saints » est employé au sens large, sans connotation ecclésiale plus précise imposée au passage. Le titre « Seigneur des esprits » est conservé comme titre distinctif.
