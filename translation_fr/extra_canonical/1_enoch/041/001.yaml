base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: fr
  text: Après cela, je vis toutes les choses cachées des cieux[a], comment le royaume est réparti[b] et comment les actes des êtres humains sont pesés dans la balance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les secrets des cieux ». Le terme guèze peut désigner ce qui est caché à la vue ou à la connaissance ordinaires.
    reason: lexical_alternative
  - marker: b
    text: La proposition « comment le royaume est réparti » est difficile. Elle peut évoquer la division, l’attribution ou l’organisation du domaine céleste.
    reason: alternative_reading
  - marker: c
    text: Le texte emploie concrètement l’image de la balance, qui suggère ici l’évaluation ou le jugement des actes humains.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Après cela
  rationale: Formule de transition temporelle qui conserve l’enchaînement de la vision dans un français naturel.
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend directement le verbe de perception à la première personne sans archaïsme.
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: toutes les réalités cachées des cieux
  rationale: « Réalités cachées » garde le pluriel concret et l’idée de choses soustraites à la vue ou à la connaissance, tandis que « des cieux » reflète la construction génitivale.
- source_word: መንግሥተ
  choice: le royaume
  rationale: Préserve la portée royale et cosmique du nom sans préciser indûment s’il s’agit du règne, du domaine ou de son organisation.
- source_word: እፎ
  choice: comment
  rationale: Introduit naturellement en français le contenu des deux propositions vues par Hénoch.
- source_word: ትትካፈል
  choice: est réparti
  rationale: Exprime la division ou l’attribution sans suggérer nécessairement une rupture conflictuelle; l’ambiguïté de la proposition est signalée en note.
- source_word: ትገበረ ሰብእ
  choice: les actes des êtres humains
  rationale: Rend ce que font les humains plutôt qu’une humanité abstraite et s’accorde avec l’image suivante de la pesée.
- source_word: በመዳልው
  choice: dans la balance
  rationale: Conserve l’image concrète de l’instrument de pesée et sa possible portée judiciaire.
- source_word: ይደለው
  choice: sont pesés
  rationale: Le contexte de la balance favorise le sens de peser, tout en laissant l’évaluation ou le jugement implicites.
theological_decisions:
- issue: Sens de la proposition concernant le royaume
  choice: Le royaume est présenté comme réparti.
  alternative: Le royaume est divisé, distribué ou ordonné en différentes parties.
  rationale: Le guèze est bref et difficile. « Réparti » conserve l’idée d’une division ou d’une attribution sans imposer une cosmologie précise ni résoudre la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le ton narratif visionnaire. La formulation reste proche du guèze et les notes préservent les ambiguïtés lexicales et cosmologiques.
