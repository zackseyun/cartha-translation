base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: fr
  text: 'Et je vis les dépôts du soleil et de la lune[a] : d’où ils sortent, où ils entrent, leur retour glorieux, et comment l’un est plus honoré que l’autre[b]. Leur parcours est béni : ils ne dépassent pas leur parcours, ils n’y ajoutent rien et n’en retranchent rien. Ils restent fidèles l’un à l’autre par serment[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les trésors » ou « les réserves ». Il s’agit de lieux célestes d’où le soleil et la lune sortent et où ils rentrent.
    reason: lexical_alternative
  - marker: b
    text: La formulation est difficile. Le texte compare l’honneur des deux luminaires sans préciser ici lequel est supérieur ni s’il est question de splendeur, de rang ou d’apparence.
    reason: alternative_reading
  - marker: c
    text: La fidélité exprimée par serment présente l’ordre des luminaires en termes solennels et relationnels, et non comme une simple régularité mécanique.
    reason: cultural_note
lexical_decisions:
- source_word: መዛግብተ
  choice: réserves
  rationale: Le terme désigne des dépôts, magasins ou trésors. « Réserves » conserve l’image concrète de lieux célestes d’où sortent les luminaires et où ils rentrent, sans connotation financière trop marquée.
- source_word: እምአይቴ ይወፅኡ / ወአይቴ ይገብኡ
  choice: d’où ils sortent / où ils entrent
  rationale: Cette formulation respecte la préposition እም (« de, depuis ») et les verbes ordinaires de mouvement, sans les réduire aux notions astronomiques de lever et de coucher.
- source_word: ግብኦቶሙ ስቡሕ
  choice: leur retour glorieux
  rationale: « Retour » exprime naturellement la rentrée cyclique suggérée par le contexte, tandis que « glorieux » maintient le registre élevé de ስቡሕ.
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  choice: comment l’un est plus honoré que l’autre
  rationale: « Comment » rend la particule interrogative አፎ et rattache la proposition à la vision. La formulation conserve la comparaison d’honneur sans préciser de manière conjecturale s’il s’agit de splendeur, de rang ou d’apparence.
- source_word: ምሕዋሮሙ
  choice: leur parcours
  rationale: « Parcours » rend le mouvement ou circuit assigné aux luminaires sans employer le terme scientifique moderne « orbite ».
- source_word: ብፁዕ
  choice: béni
  rationale: Le mot porte une valeur religieuse explicite. « Béni » préserve cette dimension au lieu de réduire l’idée à celle d’un parcours régulier.
- source_word: ኢየኃልፉ ምሕዋረ
  choice: ils ne dépassent pas leur parcours
  rationale: La formulation exprime le fait de ne pas franchir les limites du trajet assigné, tout en restant proche de la structure du texte.
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: ils n’y ajoutent rien et n’en retranchent rien
  rationale: Les deux verbes opposés indiquent qu’ils n’augmentent ni ne diminuent leur parcours. Cette tournure française conserve le parallélisme.
- source_word: ሃይማኖተ የዐቅቡ ፪ምስለ ካልኡ
  choice: ils restent fidèles l’un à l’autre
  rationale: Dans ce contexte, ሃይማኖት exprime la fidélité plutôt qu’une croyance doctrinale. « Restent fidèles » est naturel et conserve la portée relationnelle et covenantale.
- source_word: በመሐላ
  choice: en vertu d’un serment
  rationale: Cette expression rend la force instrumentale du serment et son caractère solennel, sans suggérer seulement qu’un serment est prononcé au même moment.
theological_decisions:
- issue: Description astronomique ou langage théologique et covenantal
  choice: Conserver « béni », « fidèles » et « serment ».
  alternative: Neutraliser par « régulier », « respectent leur accord » ou une description purement mécanique.
  rationale: Le guèze emploie un vocabulaire chargé de sens religieux et moral. La traduction maintient donc l’image apocalyptique d’une création fidèle à un ordre solennel sans expliquer davantage la nature de cet ordre.
- issue: Nature de la supériorité d’un luminaire sur l’autre
  choice: Dire seulement que « l’un est plus honoré que l’autre ».
  alternative: Identifier explicitement le soleil comme supérieur à la lune ou parler de splendeur visuelle.
  rationale: Le texte formule une comparaison mais ne nomme pas ici le luminaire supérieur et ne précise pas sans ambiguïté la nature de son honneur. La traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme visionnaire est conservé par la reprise de « parcours » et par les propositions parallèles. Les pronoms masculins pluriels suivent les noms français « soleil » et « lune » pris ensemble. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
