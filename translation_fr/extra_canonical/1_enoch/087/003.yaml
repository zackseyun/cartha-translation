base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: fr
  text: Et ces trois-là, qui étaient sortis ensuite, me saisirent par la main et m’élevèrent d’entre ceux qui sont nés de la terre[a]. Ils me firent monter sur un lieu élevé et me montrèrent, au-dessus de la terre, une haute tour[b] ; toutes les collines s’abaissèrent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la descendance de la terre ». On peut aussi comprendre : « d’entre les êtres nés de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme guèze est difficile ; il peut désigner plus généralement une haute construction.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « toutes les montagnes furent abaissées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫ እለ ወጽኡ ድኅረ
  choice: ces trois-là, qui étaient sortis ensuite
  rationale: Le démonstratif reprend les trois figures déjà présentes, tandis que እለ introduit une relative et ድኅረ marque ici la postériorité.
- source_word: አሐዙኒ በእዴየ
  choice: me saisirent par la main
  rationale: Le verbe exprime une prise effective, et le nom « main » est au singulier dans le texte guèze.
- source_word: አንሥኡኒ እምትውልደ ምድር
  choice: m’élevèrent d’entre ceux qui sont nés de la terre
  rationale: Cette formulation française conserve l’image de naissance ou d’origine contenue dans ትውልድ, sans la réduire à une simple indication spatiale.
- source_word: አልዐሉኒ ዲበ መካን ነዋኅ
  choice: me firent monter jusqu’à un lieu élevé
  rationale: La traduction maintient le mouvement ascendant et rend naturellement la hauteur du lieu.
- source_word: ማኅፈደ ነዋኅ
  choice: une haute tour
  rationale: Le substantif difficile semble désigner une construction élevée ; « tour » convient au contexte tout en nécessitant une note signalant l’incertitude.
- source_word: ሕፁፀ ኵሉ አውግር
  choice: toutes les collines s’abaissèrent
  rationale: Le contexte décrit un abaissement topographique ; « collines » rend prudemment le relief désigné par አውግር.
theological_decisions:
- issue: Séparation d’Hénoch d’avec la « descendance de la terre »
  choice: 'Conserver l’image de l’origine terrestre : « d’entre ceux qui sont nés de la terre »'
  alternative: « de la terre » ou « d’entre les habitants de la terre »
  rationale: Le texte associe explicitement naissance ou génération et terre. La traduction garde cette tension anthropologique et visionnaire au lieu de la résoudre en une simple localisation.
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements ont été légèrement répartis en deux phrases pour la lisibilité, sans effacer la succession visionnaire. « Ces trois-là » conserve la reprise anaphorique ; « ensuite » évite de faire de ces figures les dernières de manière absolue.
