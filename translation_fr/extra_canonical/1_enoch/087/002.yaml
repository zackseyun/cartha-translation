base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: fr
  text: 'Et de nouveau, je levai les yeux vers le ciel et je vis dans une vision : voici que des êtres à la ressemblance d’hommes blancs[a] sortirent du ciel. Quatre sortirent de ce lieu, et trois avec eux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la formulation insiste sur la ressemblance : « comme à la ressemblance d’hommes blancs ». Le texte décrit leur apparence sans les désigner explicitement comme des anges.'
    reason: lexical_alternative
  - marker: b
    text: 'La conclusion est abrupte en guèze : « quatre sortirent de ce lieu, et trois avec eux ». Elle semble évoquer sept êtres au total, mais le texte ne donne pas lui-même ce total.'
    reason: textual_variant
lexical_decisions:
- source_word: አንሣእኩ አዕይንትየ
  choice: je levai les yeux
  rationale: Conserve l’expression concrète et la formule visionnaire du guèze, tout en étant naturelle en français.
- source_word: ካዕበ
  choice: de nouveau
  rationale: Marque explicitement la reprise de l’attention visionnaire.
- source_word: ውስተ ሰማየ
  choice: vers le ciel
  rationale: Exprime la direction du regard sans suggérer qu’il pénètre littéralement dans le ciel.
- source_word: ወርኢኩ በራእይ
  choice: et je vis dans une vision
  rationale: Maintient l’encadrement visionnaire explicite; l’indéfini rend naturellement la forme non déterminée du guèze.
- source_word: ወነዋ
  choice: voici que
  rationale: Préserve l’interjection qui donne à la scène son immédiateté, dans un registre français digne et actuel.
- source_word: ወፁኡ እምሰማይ
  choice: sortirent du ciel
  rationale: Rend le verbe pluriel de mouvement et l’origine céleste sans ajouter l’idée d’une identité angélique.
- source_word: ከመ እምሳለ ሰብእ ጸዓዳ
  choice: des êtres à la ressemblance d’hommes blancs
  rationale: « À la ressemblance de » conserve la distance comparative propre à la formulation apocalyptique; « êtres » évite d’identifier directement ces figures célestes à des hommes ou à des anges.
- source_word: ፬ ወፁኡ እምውእቱ መካን
  choice: Quatre sortirent de ce lieu
  rationale: Conserve le nombre, la répétition du mouvement et la désignation spatiale précise du texte.
- source_word: ፫ ምስሌሆሙ
  choice: et trois étaient avec eux
  rationale: Reproduit la brièveté de la proposition finale sans expliciter davantage le rapport entre les deux groupes.
theological_decisions:
- issue: Identité des figures célestes de forme humaine
  choice: Les décrire comme « des êtres à la ressemblance d’hommes blancs » sans les appeler anges.
  alternative: « des anges sous forme humaine » ou simplement « des hommes blancs »
  rationale: Le verset précise leur origine céleste et leur apparence, mais ne nomme pas leur catégorie. La traduction conserve cette réserve et la tension symbolique du texte.
- issue: Rapport numérique entre les quatre et les trois
  choice: 'Conserver la formulation abrupte : « Quatre… et trois… »'
  alternative: Expliciter qu’il s’agit de sept êtres au total.
  rationale: Le total de sept est vraisemblable, mais le texte ne le formule pas directement; l’expliciter dans le corps du verset résoudrait une syntaxe que la source laisse concise.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du rythme visionnaire. « Voici que » conserve la solennité apocalyptique sans archaïsme excessif. La répétition de « sortirent » et la construction numérique finale sont volontairement préservées.
