base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: fr
  text: 'De nouveau, je les vis : ils se mirent à s’encorner les uns les autres[a] et à se dévorer les uns les autres[b], et la terre se mit à crier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à se frapper les uns les autres ». Dans cette vision symbolique mettant en scène des animaux, le verbe désigne une attaque violente ; « s’encorner » en conserve l’image sans exclure le sens plus général.
    reason: lexical_alternative
  - marker: b
    text: Ou « à engloutir les uns les autres ». Le verbe peut exprimer aussi bien l’action d’engloutir que celle de dévorer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ፡ ርኢክዎሙ
  choice: De nouveau, je les vis
  rationale: Rend naturellement la reprise du récit visionnaire et le verbe courant « voir », sans archaïsme.
- source_word: ወአኃዙ፡ እንዘ፡ ይወግኡ (lecture corrigée du texte transmis ወአንዘ፡ እንዘ፡ ይወግኡ)
  choice: ils se mirent à s’encorner
  rationale: La lecture corrigée አኃዙ suivie de እንዘ et de l’imparfait exprime le commencement de l’action. « S’encorner » conserve l’image réciproque d’un combat d’animaux à cornes.
- source_word: ፪ለካልኡ
  choice: les uns les autres
  rationale: Expression française naturelle de la réciprocité collective.
- source_word: ወይውሑጦ፡ ፪ለካልኡ
  choice: et à s’entre-dévorer
  rationale: Conserve à la fois la réciprocité et la violence de l’image animale; le verbe source peut aussi évoquer l’action d’engloutir.
- source_word: ወምድር፡ አኃዘት፡ ትጽራኅ (lecture corrigée du texte transmis አንዘት)
  choice: et la terre se mit à crier
  rationale: La lecture corrigée አኃዘት marque l’entrée dans l’action; la terre demeure le sujet personnifié du cri.
theological_decisions:
- issue: Personnification de la terre face à la violence
  choice: « la terre se mit à crier »
  alternative: « un cri s’éleva de la terre » ou « le pays fut en tumulte »
  rationale: Le guèze fait de la terre elle-même le sujet actif. Cette image cosmique et apocalyptique ne doit pas être atténuée.
- issue: Rapport temporel entre les violences et le cri de la terre
  choice: Deux propositions coordonnées marquant le commencement des actions
  alternative: Subordonner les violences avec « pendant qu’ils… »
  rationale: La correction paléographique/OCR proposée, አኃዙ et አኃዘት, soutient deux constructions inchoatives parallèles plutôt qu’une subordination temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la répétition inchoative (« se mirent », « se mit »), la violence réciproque et la personnification apocalyptique de la terre. Les formes imprimées ወአንዘ et አንዘት sont traitées comme des erreurs de transcription/OCR pour ወአኃዙ et አኃዘት, conformément à la construction grammaticale parallèle signalée dans la révision critique.
