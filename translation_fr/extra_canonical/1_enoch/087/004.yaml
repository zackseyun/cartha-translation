base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: fr
  text: 'Et ils me dirent : « Reste ici jusqu’à ce que tu voies tout ce qui arrivera à ces éléphants, à ces chameaux et à ces ânes, ainsi qu’aux étoiles, au bétail et à eux tous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule finale « et à eux tous » récapitule collectivement tous les êtres qui viennent d’être énumérés.
    reason: clarification
lexical_decisions:
- source_word: ይቤሉኒ
  choice: ils me dirent
  rationale: Formule narrative courante; le suffixe de complément « me » est explicitement rendu.
- source_word: ንበር ዝየ
  choice: Reste ici
  rationale: L’impératif exprime le fait de demeurer sur place; « Reste ici » est naturel, digne et précis en français moderne.
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: jusqu’à ce que tu voies tout ce qui arrivera
  rationale: La formulation conserve à la fois la durée de l’instruction et l’orientation future de la vision.
- source_word: ዲበ
  choice: à / aux
  rationale: Dans la tournure française « arriver à », cette préposition rend naturellement l’idée de ce qui surviendra aux figures énumérées, sans préciser qu’il s’agit nécessairement d’un jugement.
- source_word: እልኩ ነጌያት
  choice: ces éléphants
  rationale: Le démonstratif maintient le renvoi aux animaux déjà présents dans la vision.
- source_word: አግማል
  choice: chameaux
  rationale: Désignation animale directe, conservée littéralement dans l’imagerie de l’Apocalypse des animaux.
- source_word: አእዱግ
  choice: ânes
  rationale: Équivalent français moderne et direct du nom animal.
- source_word: ከዋክብት
  choice: étoiles
  rationale: L’image cosmique est maintenue sans l’interpréter comme désignant des anges ou d’autres puissances.
- source_word: አልህምታት
  choice: bétail
  rationale: Le terme désigne ici des bovins ou du bétail, et non des brebis; ce choix respecte la distinction zoologique importante dans l’allégorie animale.
- source_word: ወኵሎሙ
  choice: et à eux tous
  rationale: La reprise finale rassemble avec insistance tous les êtres énumérés, sans lisser cette redondance du texte source.
theological_decisions:
- issue: Faut-il rendre explicitement punitive la chose qui doit survenir ?
  choice: tout ce qui arrivera à
  alternative: tout le jugement qui s’abattra sur
  rationale: Le guèze n’identifie pas explicitement l’événement comme un jugement. La traduction conserve donc l’indétermination et la tension du texte visionnaire.
- issue: Faut-il décoder les symboles animaux et cosmiques dans le corps du texte ?
  choice: conserver littéralement éléphants, chameaux, ânes, étoiles et bétail
  alternative: les remplacer par les peuples, anges ou groupes historiques qu’ils pourraient représenter
  rationale: Le verset présente les symboles eux-mêmes; les interpréter dans le texte principal réduirait indûment l’ambiguïté de la vision.
translation_notes:
  register: Français international moderne, courant et digne. La répétition des compléments est légèrement structurée pour rester lisible, tandis que la récapitulation emphatique finale du guèze est conservée.
