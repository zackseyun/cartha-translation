base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: fr
  text: Et en ces jours-là, ces eaux seront pour les rois, les puissants et les personnages haut placés, ainsi que pour ceux qui habitent sur la terre ferme, pour la guérison du corps et le châtiment de l’esprit. Leur esprit sera rempli de plaisir[a], afin que leurs corps soient jugés, car ils ont renié le Seigneur des Esprits; ils voient leur jugement chaque jour, et pourtant ils ne croient pas en son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « leur esprit sera rempli de plaisir » est difficile dans son contexte de jugement. Le guèze semble néanmoins employer ici un terme positif pouvant aussi évoquer le délice ou la douceur.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: en ces jours-là
  rationale: Conserve la formule temporelle apocalyptique récurrente dans un français biblique naturel.
- source_word: ማያት
  choice: ces eaux
  rationale: Maintient le pluriel et le lien avec les eaux déjà évoquées dans le contexte.
- source_word: ለነገሥት ወለዐዚዛን ወለልዑላን
  choice: aux rois, aux puissants et aux personnages haut placés
  rationale: Préserve les trois groupes sociaux distincts tout en évitant le calque peu naturel « les élevés ».
- source_word: ወለእለ የኃድሩ ዲበ የብስ
  choice: ainsi qu’à ceux qui habitent sur la terre ferme
  rationale: Rend concrètement la terre sèche, en contraste avec les eaux, sans généraliser en « terre » ou « monde ».
- source_word: ለፈውሰ ሥጋ
  choice: pour la guérison du corps
  rationale: Exprime le sens physique de la guérison; « corps » convient mieux ici que « chair », qui pourrait introduire une nuance morale étrangère au passage.
- source_word: ወለአዝነ መንፈስ
  choice: pour le châtiment de l’esprit
  rationale: Retient la force punitive du terme dans ce contexte de jugement eschatologique, sans l’adoucir en simple correction pédagogique.
- source_word: ወትውኔተ ይመልእ መንፈሶሙ
  choice: leur esprit sera rempli de plaisir
  rationale: Conserve le sens positif apparent du guèze malgré sa difficulté dans un contexte de châtiment; l’incertitude est signalée en note.
- source_word: ከመ ይትኰነኑ ሥጋሆሙ
  choice: afin que leurs corps soient jugés
  rationale: Reproduit la valeur finale et passive sans renforcer « jugés » en « condamnés ».
- source_word: እስመ ክሕድዎ ለእግዚአ መንፈሳት
  choice: car ils ont renié le Seigneur des esprits
  rationale: « Renié » rend la vigueur du refus, et le titre divin établi est traduit sans paraphrase.
- source_word: ወይሬእዩ ኵነኔሆሙ እንተ ኵሉ ዕለት
  choice: Ils voient leur jugement chaque jour
  rationale: Préserve le sens judiciaire et la valeur temporelle simple de l’expression.
theological_decisions:
- issue: Les eaux sont-elles bénéfiques, punitives, ou les deux à la fois ?
  choice: Conserver côte à côte la guérison du corps, le châtiment de l’esprit et le jugement des corps.
  alternative: Transformer la guérison en image ironique de destruction, ou rendre tout le passage exclusivement punitif.
  rationale: Le texte guèze juxtapose ces notions. La traduction préserve cette tension au lieu de l’expliquer selon un système théologique.
- issue: Sens de la proposition difficile sur le plaisir
  choice: Rendre le terme apparent par « plaisir » et signaler la difficulté textuelle.
  alternative: Employer « délice », « douceur », « jouissance », ou conjecturer un sens négatif.
  rationale: Un sens positif paraît lexicalement plausible, même s’il s’accorde mal avec le contexte. Une note est préférable à une correction conjecturale silencieuse.
- issue: Portée du jugement
  choice: Employer « jugés » plutôt que « condamnés ».
  alternative: Traduire par « condamnés ».
  rationale: Le contexte est défavorable, mais le verbe de jugement ne doit pas être lexicalement renforcé au point de supprimer toute distinction entre jugement et condamnation.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase source est divisée avant la déclaration finale pour améliorer la lisibilité sans modifier l’enchaînement logique. Les termes « corps » et « esprit » restent distincts, conformément au texte.
