base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: fr
  text: Et j’affermirai ta descendance devant moi pour toujours et à jamais, et je rendrai féconds ceux qui demeurent avec toi. Ta descendance ne sera pas stérile à la surface du sol aride[a][b] ; elle sera bénie et se multipliera sur le sol aride, au nom du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze transmis, marqué d’un signe indiquant une difficulté, paraît dire littéralement : « elle ne conseillera pas » ou « elle ne délibérera pas ». La traduction suit une légère correction proposée du mot, qui donne : « elle ne sera pas stérile », sens qui correspond à la bénédiction et à la multiplication mentionnées ensuite.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « à la face du sec ». L’expression peut aussi désigner plus généralement la terre ferme ou la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አጸንዖ
  choice: j’affermirai
  rationale: Le verbe signifie rendre ferme, consolider ou établir. « Affermir » conserve cette image tout en exprimant naturellement la permanence promise à la descendance.
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Le nom collectif signifie littéralement « ta semence ». « Descendance » garde le sens de lignée et permet de reprendre naturellement le référent au singulier.
- source_word: በቅድሜየ
  choice: devant moi
  rationale: Traduction directe qui préserve à la fois le rapport de présence et le registre solennel.
- source_word: ለዓለመ ዓለም
  choice: pour toujours et à jamais
  rationale: Cette formule redoublée exprime une durée sans fin ; la formulation française en conserve l’insistance.
- source_word: አዘርኦሙ
  choice: je rendrai féconds
  rationale: Le causatif appartient au champ de la semence et de la fécondité. Dans ce contexte de descendance, de bénédiction et de multiplication, « rendre féconds » exprime mieux le mouvement positif que « disperser ».
- source_word: እለ ያኃድሩ ምስሌከ
  choice: ceux qui demeurent avec toi
  rationale: La proposition désigne ceux qui habitent ou restent avec le destinataire. « Demeurent » convient au registre élevé sans être archaïque.
- source_word: †ኢይመክር
  choice: ne sera pas stérile
  rationale: La forme transmise paraît signifier littéralement « ne conseillera pas », mais elle est signalée comme corrompue par l’obèle. L’émendation très proche ኢይመክን, « ne sera pas stérile », s’accorde avec les verbes singuliers et avec la bénédiction et la multiplication qui suivent ; l’incertitude est explicitée en note.
- source_word: ገጸ የብስ
  choice: à la surface du sol aride
  rationale: L’expression signifie littéralement « face du sec/sol sec ». La traduction garde l’image concrète plutôt que de la réduire silencieusement à « terre ».
- source_word: ይትባረክ
  choice: elle sera bénie
  rationale: Le verbe masculin singulier renvoie vraisemblablement au nom collectif « descendance ». Le passif convient à l’enchaînement avec la multiplication.
- source_word: ይትባዛሕ
  choice: elle se multipliera
  rationale: Le verbe exprime l’accroissement numérique. Le singulier reprend la descendance collective plutôt que le groupe pluriel mentionné entre-temps.
- source_word: በስሙ ለእግዚአ
  choice: au nom du Seigneur
  rationale: Formule française naturelle qui conserve le lien entre la bénédiction ou la multiplication et le nom divin, sans préciser indûment s’il s’agit de moyen, d’autorité ou de sphère.
theological_decisions:
- issue: Faut-il expliciter une alliance dans la promesse concernant la descendance ?
  choice: Conserver « j’affermirai ta descendance devant moi » sans ajouter le mot « alliance ».
  alternative: « Je confirmerai mon alliance avec ta descendance » ou « je préserverai tes descendants ».
  rationale: Le texte porte une forte idée de promesse durable, mais ne nomme pas explicitement une alliance. La traduction conserve sa portée théologique sans ajouter une catégorie absente.
- issue: Comment traduire la proposition corrompue marquée d’un obèle ?
  choice: Adopter dans le texte « ne sera pas stérile », avec une note signalant l’émendation.
  alternative: 'Traduire le texte transmis : « elle ne prendra pas conseil » ou « ils ne délibéreront pas ».'
  rationale: Le sens littéral du texte transmis est difficilement intelligible dans le contexte. Une émendation minime donne un contraste cohérent avec « bénie » et « se multipliera », mais la note maintient visible l’incertitude textuelle.
- issue: À quoi renvoient les verbes singuliers de la dernière proposition ?
  choice: 'Les rapporter à la descendance collective : « elle sera bénie et se multipliera ».'
  alternative: Les rapporter au pluriel à « ceux qui demeurent avec toi ».
  rationale: Les formes verbales sont au masculin singulier et s’accordent plus naturellement avec ዘርእከ, nom collectif singulier. Le français emploie le féminin selon le genre grammatical de « descendance ».
translation_notes:
  register: Français international moderne, solennel mais accessible. Le futur et la répétition « pour toujours et à jamais » maintiennent le caractère de proclamation. Le nom collectif « descendance » permet de respecter le singulier des verbes finaux ; sa reprise au début de la deuxième phrase évite une ambiguïté référentielle excessive.
