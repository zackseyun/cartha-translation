base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: fr
  text: Car le jugement viendra sur eux, parce qu’ils mettent leur confiance dans les plaisirs de leur chair[a] et renient l’Esprit du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « plaisirs » est incertain dans cette partie conservée seulement en guèze. Il peut aussi évoquer la jouissance, le dérèglement ou, peut-être, la tromperie liée à leur chair.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: car / parce que
  rationale: Les deux occurrences introduisent une relation causale. « Car » rattache l’annonce au contexte précédent, tandis que « parce que » introduit explicitement le motif du jugement.
- source_word: ትመጽእ
  choice: viendra
  rationale: Le futur convient à l’annonce apocalyptique d’un jugement à venir.
- source_word: ኵነኔ
  choice: jugement
  rationale: Ce terme conserve la portée judiciaire et eschatologique générale sans la réduire à la condamnation ou à la sentence.
- source_word: ዲቤሆሙ
  choice: sur eux
  rationale: Cette formulation rend naturellement la préposition dans une annonce solennelle de jugement.
- source_word: የአምኑ
  choice: mettent leur confiance
  rationale: Le verbe peut signifier croire ou se fier à quelque chose. Cette expression française fait ressortir l’idée d’une confiance mal placée.
- source_word: በተውኔተ
  choice: dans les plaisirs de
  rationale: Le substantif est incertain. Dans son association immédiate avec « leur chair », le sens de plaisirs charnels paraît plausible, mais d’autres nuances restent possibles et sont signalées en note.
- source_word: ሥጋሆሙ
  choice: leur chair
  rationale: « Chair » préserve le terme anthropologique concret ainsi que sa portée morale dans ce contexte.
- source_word: ወመንፈሰ
  choice: et l’Esprit
  rationale: Le nom peut désigner l’esprit ou le souffle. Le génitif qui suit le rattache ici au Seigneur.
- source_word: እግዚአ
  choice: du Seigneur
  rationale: Il s’agit du titre divin usuel, rendu par son équivalent français établi.
- source_word: ይክሕዱ
  choice: renient
  rationale: « Renier » exprime clairement la répudiation personnelle ou théologique, sans l’affaiblir en simple refus.
theological_decisions:
- issue: Sens de « l’Esprit du Seigneur »
  choice: Référence à l’Esprit appartenant au Seigneur, que ces personnes renient par contraste avec leur confiance dans la chair.
  alternative: Leur propre esprit donné par Dieu, ou la voie spirituelle qui appartient au Seigneur.
  rationale: La construction au génitif désigne le plus naturellement l’Esprit du Seigneur. La majuscule l’indique en français, sans développer ni imposer une formulation doctrinale chrétienne ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la répétition causale du guèze, le vocabulaire concret de la « chair » et la tension entre la chair et l’Esprit, sans explicitation confessionnelle.
