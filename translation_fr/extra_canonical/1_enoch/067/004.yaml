base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: fr
  text: Et ils enfermeront ces anges qui avaient manifesté l’iniquité dans cette vallée embrasée que mon grand-père Hénoch m’avait montrée auparavant, à l’ouest[a], près des montagnes d’or, d’argent, de fer, de métal tendre[b] et de plomb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers l’ouest ». Le mot peut aussi signifier « au soir », mais les indications de lieu environnantes favorisent ici un sens géographique.
    reason: lexical_alternative
  - marker: b
    text: L’identité de ce métal est incertaine dans ce témoin; il pourrait s’agir de l’étain, de l’électrum ou d’un autre métal travaillé ou tendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: ils enfermeront
  rationale: La forme verbale est un inaccompli à valeur future et le verbe exprime l’action de fermer ou d’enfermer. Cette traduction conserve donc le jugement futur et l’idée de détention.
- source_word: እሙንቱ መላእክት
  choice: ces anges
  rationale: Dans ce contexte apocalyptique, il s’agit clairement d’êtres angéliques soumis au jugement.
- source_word: እለ አርአይዋ ለዓመፃ
  choice: qui avaient manifesté l’iniquité
  rationale: Le verbe signifie montrer ou rendre manifeste. « Manifesté » évite de préciser sans preuve qu’ils l’auraient enseignée, tandis qu’« iniquité » garde la portée morale et judiciaire du terme.
- source_word: ቈላ እንተ ትነድድ
  choice: vallée embrasée
  rationale: Cette expression française naturelle préserve l’image topographique d’une vallée en feu.
- source_word: እንተ አርአየኒ ቀዳሚ እምሔውየ ሄኖክ
  choice: que mon grand-père Hénoch m’avait montrée auparavant
  rationale: Hénoch est explicitement le grand-père du locuteur et le sujet du verbe actif « montrer ». « Auparavant » marque le renvoi à une vision antérieure.
- source_word: በዓረብ
  choice: à l’ouest
  rationale: Les indications géographiques qui suivent favorisent le sens spatial, bien qu’un sens directionnel ou temporel demeure possible.
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: les montagnes d’or, d’argent, de fer
  rationale: Le pluriel construit énumère des montagnes associées à divers métaux; « montagnes » convient à l’ampleur de la vision.
- source_word: ነጠብጣብ
  choice: métal tendre
  rationale: L’identification précise du métal est incertaine dans ce témoin. Une désignation générique évite une fausse précision, et les principales possibilités sont signalées en note.
- source_word: ናእስ
  choice: plomb
  rationale: Ce terme est couramment compris comme désignant le plomb dans les listes de métaux.
theological_decisions:
- issue: Nature de la faute des anges
  choice: les anges avaient manifesté l’iniquité
  alternative: les anges avaient commis ou enseigné l’iniquité
  rationale: Le guèze met l’accent sur l’action de montrer ou de rendre manifeste. La traduction ne réduit donc pas cette formulation à la simple commission du mal et n’introduit pas non plus explicitement l’idée d’un enseignement.
- issue: Temporalité du jugement
  choice: ils enfermeront
  alternative: ils enfermèrent / ils ont enfermé
  rationale: L’inaccompli du verbe et le contexte de jugement à venir appuient une lecture future, malgré une tradition de traduction au passé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible tout en conservant l’imagerie apocalyptique, la référence narrative à Hénoch comme grand-père du locuteur et les incertitudes lexicales réelles.
