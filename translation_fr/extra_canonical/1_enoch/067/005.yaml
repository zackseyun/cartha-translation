  text: And I saw that valley in which there was a great convulsion and a convulsion of waters[a].
translation:
  language: fr
  text: Et je vis cette vallée, où il y avait un grand bouleversement et un bouleversement des eaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande convulsion et une convulsion des eaux ». Le terme guèze répété souligne probablement une violente perturbation dans la vallée, mais sa nuance exacte peut aller du tumulte à la convulsion.
    reason: Alternative lexicale préservant l’incertitude sémantique de ሀውከ et la répétition présente dans le texte source.
lexical_decisions:
- source_word: ወርኢክዋ
  choice: Et je vis
  rationale: Conserve la conjonction narrative et la formule de vision, dans un français simple et digne.
- source_word: ለይእቲ ቈላ
  choice: cette vallée
  rationale: ቈላ désigne un lieu bas ou une dépression; « vallée » est ici le terme français le plus naturel sans préciser indûment « ravin ».
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: où se produisait une grande convulsion
  rationale: La tournure relative situe le phénomène dans la vallée. « Convulsion » garde la force physique et apocalyptique de ሀውከ, tandis que « grande » rend ዓቢይ.
- source_word: ወሀውከ ማያት
  choice: une convulsion des eaux
  rationale: La répétition de « convulsion » reproduit l'insistance du texte source, et le pluriel « eaux » rend ማያት.
theological_decisions:
- issue: Nature du bouleversement dans la vallée
  choice: Une perturbation physique et cosmique exprimée par « convulsion »
  alternative: « bouleversement », « tumulte » ou « agitation »
  rationale: Le contexte apocalyptique favorise une image concrète et violente, sans ajouter explicitement l'idée d'un tremblement de terre. La note maintient toutefois ouverte la nuance exacte du terme guèze.
translation_notes:
  register: Français international moderne, naturel et soutenu. La répétition, légèrement marquée en français, est volontaire afin de conserver l'effet rhétorique du guèze.
