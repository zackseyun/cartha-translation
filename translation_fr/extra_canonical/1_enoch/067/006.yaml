base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: fr
  text: Quand tout cela arriva, une odeur de soufre[a] naquit de ce torrent de feu et de leur agitation en ce lieu[c], puis se joignit à ces eaux[b] ; et la vallée des anges qui ont égaré brûle sous cette terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire par « odeur de soufre ardent ». Le terme anglais traditionnel « brimstone » correspond ici au français moderne « soufre ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se mêla à ces eaux ».'
    reason: alternative_reading
  - marker: c
    text: 'La construction guèze est difficile. On peut aussi comprendre : « Quand tout cela arriva à cause de ce torrent de feu et de leur agitation, une odeur de soufre naquit en ce lieu ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: torrent de feu
  rationale: Cette expression garde l’image d’un écoulement de feu tout en restant naturelle en français ; « ruissellement de feu » ou « feu dégouttant » seraient plus littéraux mais moins fluides.
- source_word: ሀውኮሙ
  choice: leur agitation
  rationale: Le terme évoque un trouble ou un bouleversement. « Agitation » reste assez large pour ne pas imposer l’image plus physique de « convulsion ».
- source_word: ጼና ተይ
  choice: odeur de soufre
  rationale: Cette formulation rend clairement la dimension olfactive et la substance évoquée, dans un français moderne.
- source_word: ተወልደ
  choice: naquit
  rationale: Le sens premier est « naître ». Employé avec une odeur, « naquit » conserve l’image de l’apparition tout en demeurant intelligible.
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: se joignit à ces eaux
  rationale: Cette traduction conserve l’idée générale de jonction sans décider si le texte décrit un mélange matériel complet.
- source_word: ቈላ
  choice: vallée
  rationale: « Vallée » exprime simplement la dépression topographique décrite dans la vision.
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: des anges qui ont égaré
  rationale: Le verbe relatif actif présente les anges comme les auteurs de l’égarement, sans préciser dans le texte français un objet que la source ne nomme pas ici.
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: brûle sous cette terre
  rationale: La formulation exprime une combustion continue sous le terrain local, sans élargir nécessairement le sens à la terre entière.
theological_decisions:
- issue: Rôle des anges dans l’égarement
  choice: les anges qui ont égaré
  alternative: les anges qui se sont égarés
  rationale: La forme verbale active désigne plus naturellement les anges comme agents de l’égarement. La traduction n’harmonise pas ce passage avec une démonologie ultérieure.
