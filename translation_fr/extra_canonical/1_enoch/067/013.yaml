base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: fr
  text: Car ces eaux de jugement sont pour la guérison de la chair des rois et pour les désirs de leur chair[b][a] ; c’est pourquoi ils ne voient pas et ne croient pas que ces eaux se transformeront et deviendront un feu qui brûlera pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « l’eau du jugement » si le mot guèze est compris collectivement ; le pluriel est retenu ici pour préserver l’image de la scène.
    reason: lexical_alternative
  - marker: b
    text: Le texte guèze fourni dans l’extrait est tronqué après « Car ces eaux de jugement ». La suite est rétablie d’après le texte du verset qui se poursuit à la page suivante de l’édition.
    reason: source_truncation
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit l’explication qui rattache cette affirmation au contexte précédent, avec une force causale naturelle en français.
- source_word: እሉ
  choice: ces
  rationale: Démonstratif pluriel renvoyant aux eaux immédiatement présentes dans la vision.
- source_word: ማየ
  choice: eaux
  rationale: Le pluriel conserve l’image apocalyptique concrète et correspond à la reprise ultérieure traditionnelle de ces eaux.
- source_word: ኵነኔ
  choice: jugement
  rationale: Ce terme garde la portée judiciaire générale, sans la restreindre à la condamnation ou au châtiment.
- source_word: ለፈውሰ ሥጋሆሙ ለነገሥት
  choice: servent à guérir la chair des rois
  rationale: Rend la destination ou la fonction des eaux tout en conservant le terme concret « chair ».
- source_word: ወለፍትወተ ሥጋሆሙ
  choice: et à satisfaire les désirs de leur chair
  rationale: « Désirs » exprime naturellement l’appétit charnel sans imposer le sens exclusivement sexuel que pourrait suggérer « convoitise ».
- source_word: ኢይሬእዩ ወኢያአምኑ
  choice: ils ne voient pas et ne croient pas
  rationale: Conserve le parallélisme des deux verbes et leur tension entre perception et foi.
- source_word: ይትዌለጥ ወይከውን እሳተ
  choice: se transformeront et deviendront un feu
  rationale: Préserve les deux étapes verbales plutôt que de les fondre en une seule.
theological_decisions:
- issue: Portée du terme judiciaire final
  choice: jugement
  alternative: condamnation / châtiment
  rationale: « Jugement » préserve l’étendue de l’action judiciaire divine et n’anticipe pas une interprétation plus étroite de son résultat punitif.
- issue: Fonction apparemment curative des eaux de jugement
  choice: servent à guérir la chair des rois
  alternative: sont destinées à la guérison de la chair des rois
  rationale: 'La formulation conserve sans l’aplanir la tension du passage : ce qui paraît guérir les rois deviendra un feu perpétuel.'
- issue: Sens de ፍትወት appliqué à la chair
  choice: désirs de leur chair
  alternative: convoitise de leur chair
  rationale: « Désirs » maintient l’ambiguïté entre plaisir, appétit et convoitise charnelle, sans imposer une lecture sexuelle.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe explicative et le vocabulaire apocalyptique sont conservés sans archaïsmes inutiles. Les marqueurs [b][a] sont placés après l’expression concernée, conformément aux notes.
