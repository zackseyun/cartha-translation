base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: fr
  text: Et par ses vallées coulent des fleuves de feu[a], là où seront jugés ces anges qui ont égaré ceux qui habitent sur la terre ferme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des cours d’eau de feu ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui habitent sur la terre sèche ». L’expression peut désigner simplement les habitants humains de la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: እነተ፡ ቈላት፡ ዚአሃ
  choice: par ses vallées
  rationale: Dans le contexte immédiat, ቈላት est le pluriel de « vallée » et ዚአሃ renvoie par « ses » à la terre mentionnée auparavant. « Par » rend naturellement le passage à travers ces vallées.
- source_word: አፍላገ፡ እሳት
  choice: des fleuves de feu
  rationale: Le syntagme désigne littéralement des cours d’eau de feu; « fleuves de feu » conserve avec force l’image apocalyptique.
- source_word: ይመጽኡ
  choice: coulent
  rationale: L’imparfait guèze peut décrire la scène au présent. Avec des fleuves, « coulent » exprime naturellement leur mouvement sans adopter le passé.
- source_word: ኀበ
  choice: là où
  rationale: La locution introduit le lieu du jugement; « là où » conserve clairement cette valeur locative.
- source_word: ይትኴነኑ
  choice: seront jugés
  rationale: Le passif judiciaire est maintenu sans le réduire à « seront condamnés », même si le contexte peut impliquer une condamnation.
- source_word: እልኩቱ፡ መላእክት
  choice: ces anges
  rationale: Dans ce contexte apocalyptique, መላእክት désigne des anges; le démonstratif est conservé.
- source_word: አስሐትዎሙ
  choice: ont égaré
  rationale: La forme causative indique que les anges ont fait dévier d’autres êtres; « ont égaré » est idiomatique et garde la portée morale.
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: ceux qui habitent sur la terre ferme
  rationale: Cette formulation conserve l’image concrète de la terre sèche ou ferme plutôt que de la généraliser simplement en « terre ».
theological_decisions:
- issue: Identité des anges jugés
  choice: Le texte les présente uniquement comme les anges qui ont égaré les habitants de la terre ferme.
  alternative: Les identifier explicitement aux Veilleurs de la tradition de Genèse 6.
  rationale: Le verset ne donne pas lui-même cette identification précise; la traduction préserve donc sa formulation locale et son ouverture.
- issue: Portée du jugement
  choice: « seront jugés »
  alternative: « seront condamnés »
  rationale: Le verbe exprime clairement un jugement, mais traduire par « condamnés » trancherait explicitement une issue que le terme ne formule pas à lui seul.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’image guèze tout en étant naturelle; le présent descriptif « coulent » convient à la scène visionnaire.
