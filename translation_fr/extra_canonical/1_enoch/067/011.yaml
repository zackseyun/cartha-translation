base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: fr
  text: Et les eaux elles-mêmes changeront en ces jours-là, car, lorsque ces anges seront jugés dans ces eaux, ces sources d’eau changeront[a] ; et lorsque les anges monteront[b], l’eau des sources changera et se refroidira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « sources » peut aussi signifier littéralement « yeux ». L’expression qui suit, « fontaines d’eau », favorise ici le sens de sources. Le texte ne nomme pas explicitement leur chaleur, même si le refroidissement mentionné à la fin du verset laisse entendre qu’elles étaient chaudes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « lorsque les anges monteront ». Le texte éthiopien ne précise clairement ni leur point de départ ni leur destination.
    reason: alternative_reading
lexical_decisions:
- source_word: ኪያሁ ማያት
  choice: ces eaux elles-mêmes
  rationale: L’élément emphatique ኪያሁ met les eaux en relief comme sujet de leur propre changement. La forme plurielle de ማያት est conservée.
- source_word: ተውላጠ / ይትዌለጡ / ይትዌለጥ
  choice: changeront / changera
  rationale: Ces verbes appartiennent au champ du changement d’état. Le français simple « changer » préserve leur récurrence sans suggérer nécessairement une transformation totale ni un agent extérieur.
- source_word: ይትኴነኑ
  choice: seront jugés
  rationale: Le verbe est judiciaire. « Seront jugés » n’anticipe ni le verdict ni la forme précise du châtiment.
- source_word: ዐያኖሙ እልኩ አንቅዐተ ማያት
  choice: leurs sources — ces fontaines d’eau —
  rationale: ዐያኖሙ peut désigner littéralement leurs « yeux » ou, dans ce contexte, leurs « sources ». L’apposition አንቅዐተ ማያት, « fontaines/sources d’eau », appuie le sens hydrologique. Le tiret rend visible l’apposition au lieu de remplacer le nom par une chaleur seulement déduite de la fin du verset.
- source_word: የዐርጉ
  choice: monteront
  rationale: Le verbe exprime un mouvement vers le haut. « Monteront » reste concret sans préciser d’où les anges montent ni quelle relation exacte ce mouvement entretient avec les eaux.
- source_word: ይቈርሩ
  choice: se refroidira
  rationale: Le verbe indique que l’eau devient froide. « Se refroidira » est idiomatique en français et conserve le changement d’état final.
theological_decisions:
- issue: Nature du jugement des anges
  choice: les anges seront jugés
  alternative: les anges seront condamnés ou punis
  rationale: Le contexte est punitif, mais le verbe éthiopien formule explicitement un jugement. La traduction ne précise donc pas davantage le verdict.
- issue: Rapport entre le jugement des anges et le changement des eaux
  choice: les événements sont reliés dans la même séquence, sans mécanisme explicité
  alternative: les eaux sont l’instrument précis du châtiment ou ne réagissent que symboliquement
  rationale: Le texte associe le jugement dans les eaux, le mouvement des anges et le refroidissement des sources, mais n’explique pas exactement le lien causal.
- issue: Sens de la montée des anges
  choice: un mouvement ascendant laissé indéterminé
  alternative: les anges sortent précisément des sources ou montent vers le ciel
  rationale: Le verbe indique la montée, tandis que son point de départ et sa destination demeurent incertains.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « changer » conserve le motif verbal du texte source. « Fontaines d’eau » est maintenu dans l’apposition pour rendre l’image concrète et la structure éthiopienne, tandis que « sources » convient au fil naturel de la phrase.
