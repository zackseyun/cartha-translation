base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: fr
  text: Et de même que la brûlure de leurs corps est très intense, ainsi un changement les atteint dans l’esprit, pour les siècles des siècles[a], car, devant le Seigneur des esprits, personne ne prononce une parole vaine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze est difficile. On pourrait aussi traduire plus littéralement : « ainsi, il y a pour eux un changement d’esprit pour les siècles des siècles ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: brûlure
  rationale: Rend la chaleur ardente ou l’action de brûler par une image concrète, adaptée à cette scène de jugement.
- source_word: ሥጋሆሙ
  choice: leur corps
  rationale: Le terme signifie littéralement « leur chair »; « leur corps » désigne clairement ici leur réalité corporelle en français moderne.
- source_word: ተውላጠ
  choice: un changement se produit en eux
  rationale: Préserve l’idée d’une altération subie sans préciser indûment qu’il s’agit d’une transformation totale.
- source_word: ለመንፈስ
  choice: quant à l’esprit
  rationale: La préposition peut indiquer le domaine ou le rapport dans lequel survient le changement; cette formulation maintient le contraste avec le corps tout en laissant subsister la difficulté syntaxique.
- source_word: ለዓለመ ዓለም
  choice: pour les siècles des siècles
  rationale: Formule solennelle qui reproduit l’idiome emphatique exprimant une durée sans fin.
- source_word: እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Conserve le titre divin caractéristique de 1 Hénoch sans transformer « esprits » en nom propre.
- source_word: ዘይነግር ነገረ በከ
  choice: personne ne prononce une parole vaine
  rationale: በከ signifie ici « vain, vide »; la construction désigne donc une parole vaine plutôt qu’une parole prononcée contre quelqu’un.
theological_decisions:
- issue: Nature et destinataire du changement
  choice: La traduction dit qu’un changement se produit « en eux quant à l’esprit » sans définir davantage sa nature.
  alternative: « il y a pour eux un changement d’esprit »
  rationale: Le guèze est syntaxiquement difficile. La formulation choisie conserve le rapport entre le changement et l’esprit sans imposer une interprétation précise de ce changement.
- issue: Portée de la parole vaine devant le Seigneur des esprits
  choice: La proposition est rendue de façon générale, sans introduire une accusation contre un groupe déterminé.
  alternative: « personne ne peut prononcer une parole contre eux »
  rationale: Le mot በከ signifie « vain » plutôt que « contre eux »; il n’y a donc pas lieu d’ajouter un référent pluriel ni une scène judiciaire absente de cette expression.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la relation comparative « de même que… ainsi… » et la difficulté du lien entre le changement et l’esprit, sans reprendre les anciennes notes fondées sur une lecture erronée de በከ.
