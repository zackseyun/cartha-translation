base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: fr
  text: 'En ces jours-là, la parole du Seigneur me parvint, et il me dit : « Noé, ta part est montée jusqu’à moi[a] : une part exempte de reproche[b], une part d’amour et de droiture. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton lot est monté jusqu’à moi ». Le guèze conserve l’image d’un mouvement ascendant jusque dans la présence divine.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « irréprochable » ou « sans blâme ». Comme les Paraboles ne sont ici effectivement conservées qu’en guèze, cette nuance doit être considérée avec prudence.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Cette formule temporelle récurrente conserve le registre apocalyptique du texte tout en restant naturelle en français moderne.
- source_word: ቃለ፡ እግዚአብሔር
  choice: la parole du Seigneur
  rationale: Cette formulation rend l’expression prophétique de révélation sans réduire « parole » à un simple propos.
- source_word: ኮነ፡ … ኀቤየ
  choice: me parvint
  rationale: Le tour français exprime naturellement le fait que la parole divine advient au destinataire, sans calquer lourdement la syntaxe guèze.
- source_word: ክፍልከ
  choice: ta part
  rationale: « Part » préserve l’éventail de sens entre lot attribué, héritage et condition reconnue, sans trancher entre ces nuances.
- source_word: ዐርገ፡ ኀቤየ
  choice: est montée devant moi
  rationale: Cette traduction maintient l’image explicite d’un mouvement ascendant jusque dans la présence divine.
- source_word: ዘአልቦቱ፡ ሒስ
  choice: exempte de reproche
  rationale: L’expression garde une nuance judiciaire ou réputationnelle et évite de transformer l’éloge en affirmation explicite de perfection morale absolue.
- source_word: ፍቅር
  choice: amour
  rationale: Le substantif courant conserve la structure nominale qui caractérise la part de Noé.
- source_word: ወርትዕ
  choice: droiture
  rationale: « Droiture » exprime ici la rectitude éthique sans imposer une terminologie doctrinale plus étroite.
theological_decisions:
- issue: Sens de la « part » de Noé dans un contexte de révélation et de jugement
  choice: ta part est montée devant moi
  alternative: ton lot est monté jusqu’à moi
  rationale: Le texte peut évoquer l’héritage attribué à Noé, la place qui lui revient ou sa condition reconnue devant Dieu. « Part » et l’image de la montée préservent cette indétermination.
- issue: Portée de l’absence de reproche
  choice: une part exempte de reproche
  alternative: une part irréprochable
  rationale: La traduction affirme fortement l’approbation de Noé, mais ne résout pas la formule en une doctrine de perfection morale absolue.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme des trois caractérisations de la part de Noé ainsi que l’imagerie verticale du texte source.
