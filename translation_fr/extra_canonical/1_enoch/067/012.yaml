base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: fr
  text: 'Et j’entendis Michel répondre et dire : « Ce jugement par lequel les anges sont jugés est un témoignage[a] contre les rois et les puissants, ceux qui possèdent la terre ferme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un témoin contre les rois et les puissants ». Le nom guèze peut désigner soit un témoignage, soit un témoin dans un contexte judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la terre sèche ». L’expression peut désigner le territoire habité soumis à l’autorité humaine, plutôt que la terre entière au sens cosmique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: Et j’entendis Michel
  rationale: Le parfait à la première personne avec suffixe objet, suivi du nom introduit par la préposition, désigne Michel comme celui que le narrateur entend. Le passé simple convient au registre narratif soutenu.
- source_word: ያውሥእ፡ ወይብል
  choice: répondre et dire
  rationale: La formulation conserve les deux verbes de parole du guèze et leur cadence solennelle, sans les fondre en un seul.
- source_word: ኵነኔ
  choice: jugement
  rationale: Le terme appartient au registre judiciaire et peut désigner l’acte de juger ainsi que son issue, sans imposer le sens plus étroit de « condamnation ».
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: par lequel les anges sont jugés
  rationale: Cette traduction maintient la construction relative et le passif, tout en évitant de préciser indûment que les anges sont nécessairement « condamnés ».
- source_word: ሰማዕተ
  choice: un témoignage
  rationale: Le nom peut désigner un témoignage ou un témoin dans un cadre judiciaire. « Témoignage » s’accorde naturellement avec le jugement qui sert de preuve contre les dirigeants.
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: contre les rois et les puissants
  rationale: Dans ce contexte judiciaire, « contre » exprime la portée accusatrice des groupes introduits par la préposition. « Les puissants » garde la force sociale et politique de l’expression apocalyptique.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: ceux qui possèdent la terre ferme
  rationale: Le verbe exprime le fait de tenir ou de posséder. « Terre ferme » préserve le contraste concret avec les eaux, sans élargir automatiquement le sens à tout le cosmos.
theological_decisions:
- issue: Portée de la proposition relative sur le jugement
  choice: Le jugement par lequel les anges sont jugés sert de témoignage contre les dirigeants terrestres.
  alternative: Les anges eux-mêmes seraient les témoins concernant les rois et les puissants.
  rationale: La syntaxe rattache le plus naturellement « témoignage » au jugement déjà mentionné, tandis que les groupes suivants indiquent ceux contre lesquels il porte. La note conserve néanmoins l’ambiguïté lexicale entre témoignage et témoin.
- issue: Étendue de « la terre ferme »
  choice: Conserver l’image de la terre ferme possédée par les souverains humains.
  alternative: Traduire plus largement par « la terre » ou « le monde ».
  rationale: Le terme guèze désigne littéralement la terre sèche par opposition aux eaux. La formulation retenue évite d’imposer une portée cosmique que le mot seul n’exige pas.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu. Le passé simple porte la narration apocalyptique, tandis que la répétition « répondre et dire » conserve la solennité de la formule source. Les marqueurs de notes sont placés exactement sur les expressions qu’ils explicitent.
