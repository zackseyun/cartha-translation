base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: fr
  text: Et maintenant, les anges construisent un ouvrage en bois[a]. Quand ils l’auront achevé, je poserai mes mains sur lui[b] et je le garderai. De lui sortira la semence de vie[c], et une transformation se produira, afin que la terre desséchée ne reste pas stérile[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze désigne du bois, des pièces de bois ou un ouvrage en bois. Dans le contexte, il s’agit probablement de l’arche de Noé, mais celle-ci n’est pas nommée explicitement.
    reason: lexical_alternative
  - marker: b
    text: 'La construction guèze est difficile. Une autre analyse possible serait : « les anges poseront mes mains sur lui et le garderont ».'
    reason: textual_variant
  - marker: c
    text: « Semence de vie » traduit littéralement le guèze. L’expression peut évoquer une descendance porteuse de vie, une puissance génératrice ou le renouvellement de la fécondité.
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « afin que la terre aride ne demeure pas dénudée ». Les derniers mots peuvent exprimer la stérilité, le vide ou le dénuement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: construisent
  rationale: L’imparfait éthiopien exprime ici une action en cours ou imminente dans le récit visionnaire. « Construisent » rend naturellement cette immédiateté et convient à un ouvrage en bois.
- source_word: መላእክት
  choice: les anges
  rationale: Dans le cadre apocalyptique de 1 Hénoch, il s’agit d’êtres célestes plutôt que de simples messagers humains.
- source_word: ዕፀወ
  choice: un ouvrage en bois
  rationale: Le terme appartient au champ lexical du bois ou des pièces de bois. Le contexte et les pronoms singuliers qui suivent indiquent vraisemblablement un ouvrage unique, sans que le substantif désigne explicitement sa forme.
- source_word: እወዲ እዴየ ዲቤሃ
  choice: je poserai mes mains sur lui
  rationale: La formulation conserve le pluriel « mes mains » présent dans le guèze ainsi que l’action à la première personne. La clause demeure syntaxiquement difficile, ce qui est signalé en note.
- source_word: እዐቅባ
  choice: je le garderai
  rationale: Le verbe exprime l’idée de garder, protéger ou veiller sur. « Garder » reste direct et laisse ouvertes ces nuances.
- source_word: ዘርአ ሕይወት
  choice: la semence de vie
  rationale: La traduction littérale préserve l’image ouverte d’une semence porteuse de vie, d’une descendance ou d’une puissance génératrice.
- source_word: ተወላጥ ይባእ
  choice: une transformation se produira
  rationale: L’expression difficile annonce un changement à venir. Cette formulation française est naturelle sans préciser abusivement la nature de ce changement.
- source_word: የብስ ዕራቆ
  choice: la terre desséchée ne reste pas stérile
  rationale: Les termes évoquent à la fois la sécheresse et l’absence de fécondité. Ce rendu maintient le lien avec la « semence de vie ».
theological_decisions:
- issue: Renouveau agricole littéral ou image visionnaire de vie nouvelle
  choice: Conserver les images concrètes de l’ouvrage en bois, de la semence de vie et de la terre stérile sans leur imposer une explication unique.
  alternative: Interpréter tout le verset soit comme une description agricole littérale, soit comme une annonce explicite de résurrection ou de nouvelle création.
  rationale: Le guèze présente une imagerie visionnaire susceptible de plusieurs niveaux de lecture et ne tranche pas explicitement entre eux.
- issue: Identification de l’ouvrage avec l’arche de Noé
  choice: Employer « un ouvrage en bois » sans insérer le mot « arche » dans le texte.
  alternative: Traduire directement par « une arche » en s’appuyant sur le contexte de Noé.
  rationale: Le contexte rend l’identification à l’arche probable, mais le mot source désigne le bois ou un ouvrage de bois et ne nomme pas explicitement l’arche.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe est fluide, tandis que les notes préservent les difficultés du guèze et les principales possibilités lexicales sans surinterpréter l’image.
