base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: fr
  text: Observez tous les arbres et voyez comme ils paraissent desséchés et comme toutes leurs feuilles ont été arrachées, à l’exception de quatorze arbres qui ne perdent pas leurs feuilles, mais demeurent depuis l’ancien jusqu’à ce que vienne le nouveau[a], pendant deux et trois hivers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « depuis l’ancien jusqu’à ce que vienne le nouveau » est elliptique. Elle désigne probablement le passage de l’ancienne saison ou année à la nouvelle.
    reason: cultural_note
  - marker: b
    text: L’expression « pendant deux et trois hivers » est difficile. Elle peut signifier « pendant deux ou trois hivers » ou évoquer plusieurs saisons hivernales avant le renouvellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ፡ ወርእዩ
  choice: Observez et voyez
  rationale: Les deux impératifs pluriels sont conservés. Dans ce contexte, ጠይቁ invite à observer ou considérer, plutôt qu’à poser une question.
- source_word: ኵሎ፡ ዕፀወ
  choice: tous les arbres
  rationale: Rend naturellement le pluriel collectif et maintient l’objet concret de l’observation.
- source_word: እፎ፡ ያስተርእዩ፡ ከመ፡ ይቡስ
  choice: comme ils paraissent desséchés
  rationale: እፎ exprime ici la manière (« comme », « comment »), tandis que la construction suivante décrit l’apparence visible de dessèchement.
- source_word: ወኵሉ፡ አቍጽሊሆሙ፡ ንጉፍ
  choice: toutes leurs feuilles leur ont été arrachées
  rationale: La formulation garde l’image forte d’un feuillage enlevé ou arraché, plutôt que de réduire le sens à la simple chute saisonnière.
- source_word: ዘእንበለ፡ ፲ወ፬ ዕፀወ
  choice: à l’exception de quatorze arbres
  rationale: Rend explicitement et sans emphase excessive la construction exceptive.
- source_word: ዘኢይትነገፉ፡ እላ፡ ይጸንሑ
  choice: qui ne perdent pas leurs feuilles, mais les gardent
  rationale: Le contraste avec les feuilles arrachées est rendu en français courant. Le complément « les » explicite naturellement ce qui demeure sans modifier l’image.
- source_word: እምብሉይ፡ እስከ፡ ይመጽእ፡ ኃዲስ
  choice: depuis l’ancien jusqu’à ce que vienne le nouveau
  rationale: La formulation elliptique « l’ancien / le nouveau » est maintenue dans le texte, sans imposer qu’il s’agisse précisément d’une année ou d’une saison.
- source_word: እምክልኤ፡ ወእም፡ ፫ ክረምት
  choice: pendant deux et trois hivers
  rationale: Cette traduction proche de la forme difficile du guèze préserve l’étrangeté et l’indétermination du nombre, expliquées en note.
theological_decisions:
- issue: Interprétation symbolique des arbres et des saisons
  choice: Conserver une description botanique et saisonnière directe
  alternative: Identifier dans la traduction les arbres à des groupes humains ou à des ordres cosmiques
  rationale: Le verset invite à observer la création, mais son vocabulaire décrit directement des arbres, leurs feuilles et les hivers. Une interprétation allégorique dans le corps du texte dépasserait les données linguistiques.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des impératifs ainsi que les ellipses « l’ancien / le nouveau » et « deux et trois hivers » sont conservées afin de respecter la texture et l’ambiguïté du texte source.
