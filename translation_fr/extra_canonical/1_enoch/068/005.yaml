  text: Because of this[b][a], everything hidden forever shall come upon them.
translation:
  language: fr
  text: À cause de cela, tout ce qui est caché pour toujours[a] viendra sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui est caché pour l’âge », « tout ce qui est caché depuis les temps anciens », ou encore « tout ce qui est caché viendra sur eux pour toujours ». Le dernier terme peut exprimer l’éternité, un âge ou une durée ancienne, et son rattachement syntaxique demeure incertain.
    reason: Ambiguïté lexicale et syntaxique de ለዓለመ.
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: À cause de cela
  rationale: Rend explicitement la valeur causale de la locution et conserve son lien avec le contexte précédent.
- source_word: ይመጽእ
  choice: viendra
  rationale: Le futur français exprime naturellement la conséquence à venir dans ce contexte de jugement apocalyptique.
- source_word: ላዕሌሆሙ
  choice: sur eux
  rationale: Préserve l’image d’un événement ou d’un jugement qui vient sur les personnes concernées, sans renforcer le sens en « contre eux ».
- source_word: ኵሉ ዘኅቡእ
  choice: tout ce qui est caché
  rationale: Cette formulation française rend la totalité indéfinie et la construction relative sans préciser indûment la nature de ce qui est caché.
- source_word: ለዓለመ
  choice: pour toujours
  rationale: Conserve ici l’attachement probable à « caché », tout en signalant en note l’ambiguïté de portée et les sens possibles d’éternité, d’âge ou d’ancienneté.
theological_decisions:
- issue: Ce qui est caché est-il révélé, ou vient-il sur eux comme jugement ?
  choice: « tout ce qui est caché […] viendra sur eux »
  alternative: « tout ce qui était caché sera révélé contre eux »
  rationale: Le guèze dit expressément que cela « viendra sur eux » et non simplement que cela sera révélé. La formulation conserve donc la force menaçante et judiciaire sans identifier ce qui est caché.
- issue: Portée de ለዓለመ
  choice: « caché pour toujours »
  alternative: « viendra sur eux pour toujours »
  rationale: La syntaxe très condensée permet une hésitation sur le rattachement final. Le texte principal suit la lecture où le terme qualifie la durée de la dissimulation, tandis que la note préserve l’autre possibilité sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple maintient la tonalité prophétique sans archaïsme. La formulation demeure volontairement générale afin de ne pas préciser si les réalités cachées sont des actes, des secrets ou des jugements réservés.
