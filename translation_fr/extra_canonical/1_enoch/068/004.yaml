base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: fr
  text: 'Et il arriva que, lorsqu’il se tint devant le Seigneur des esprits, Michel dit ceci à Raphaël : « Il ne prendra pas leur parti sous le regard du Seigneur[a], car le Seigneur des esprits est en colère contre eux, parce qu’ils agissent comme s’ils étaient le Seigneur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La personne désignée par « Il » n’est pas nommée dans ce verset. L’expression peut signifier qu’il ne les soutiendra pas ou ne prendra pas leur défense devant Dieu.
    reason: ambiguïté du référent et portée idiomatique
  - marker: b
    text: 'Autre traduction possible : « parce qu’ils agissent en maîtres » ou « comme des seigneurs ». Le guèze est concis et peut leur reprocher de s’arroger une autorité qui ne leur appartient pas.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: Et il arriva que, lorsque
  rationale: Conserve la transition narrative et le cadre temporel de la formule guèze, dans un français digne sans archaïsme excessif.
- source_word: ቆመ፡
  choice: il se tint
  rationale: Rend directement l’idée de se tenir debout ou de prendre place, avec une nuance appropriée à une scène de comparution.
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: devant le Seigneur des esprits
  rationale: Préserve le titre divin propre à 1 Hénoch et la dimension spatiale ou judiciaire de « devant ».
- source_word: ወከመ'ዝ፡ ይቤሎ፡
  choice: Michel dit ceci à Raphaël
  rationale: Rend naturellement la transition vers le discours tout en conservant la valeur démonstrative de « ceci/ainsi ».
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: Il ne prendra pas leur parti sous le regard du Seigneur
  rationale: « Prendre leur parti » exprime naturellement l’idiome kona la- et sa portée de soutien, sans identifier l’antécédent du pronom singulier. « Sous le regard du Seigneur » conserve l’image de l’œil divin dans un français idiomatique.
- source_word: ተምዕዖሙ፡
  choice: est en colère contre eux
  rationale: Exprime clairement la colère divine et maintient la tonalité judiciaire sans emphase française artificielle.
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: ils agissent comme s’ils étaient le Seigneur
  rationale: Conserve l’accusation grave d’usurpation de l’autorité divine, tout en laissant en note l’autre analyse possible du syntagme.
theological_decisions:
- issue: Référent du pronom singulier dans la parole de Michel
  choice: Conserver « Il » sans nommer son référent.
  alternative: « Je » ou une explicitation telle que « Il n’intercédera pas pour eux ».
  rationale: Le guèze transmis porte une troisième personne du singulier dont l’antécédent n’est pas explicite dans ce verset. La traduction préserve cette ambiguïté et n’ajoute ni identité ni fonction d’intercesseur.
- issue: Portée de l’accusation visant les condamnés
  choice: « ils agissent comme s’ils étaient le Seigneur »
  alternative: « ils agissent en maîtres » ou « comme des seigneurs »
  rationale: La formulation retenue préserve la possibilité d’une prétention à la prérogative divine, sans dissimuler l’autre compréhension grammaticale possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le titre récurrent « Seigneur des esprits » est conservé. Les ambiguïtés relatives au pronom singulier et à l’accusation finale sont maintenues plutôt que résolues doctrinalement.
