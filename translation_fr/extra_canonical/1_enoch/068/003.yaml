base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: fr
  text: 'Et Mikaël répondit de nouveau et dit à Roufaël : « Quel est celui dont le cœur ne s’attendrit pas à ce sujet[a], et dont les reins[b] ne sont pas troublés par cette parole sévère et par la sentence prononcée contre eux à cause de ceux qui les ont fait sortir ainsi[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « ce sujet » n’est pas clairement déterminé dans le texte éthiopien.
    reason: referential_ambiguity
  - marker: b
    text: 'Littéralement : « les reins ». Dans l’imagerie ancienne, ils représentent l’être intérieur, notamment le siège des émotions ou de la conscience.'
    reason: lexical_alternative
  - marker: c
    text: La fin du verset est textuellement difficile dans le témoin éthiopien, notamment autour d’un mot transmis entre crochets. On pourrait aussi comprendre la préposition au sens de « parmi eux » ou « de leur part ».
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ ካዕበ
  choice: répondit de nouveau
  rationale: ካዕበ marque la répétition (« de nouveau », « une seconde fois »). La formule française reste naturelle tout en conservant la structure narrative.
- source_word: ሚካኤል ለሩፋኤል
  choice: à Roufaël
  rationale: Les noms sont translittérés d’après les formes éthiopiennes, Mikaël et Roufaël, plutôt que normalisés selon leurs formes françaises bibliques habituelles.
- source_word: ዘኢይረክሕ ልቡ
  choice: dont le cœur ne s’attendrit pas
  rationale: Le verbe évoque le fait de devenir tendre ou d’être ému. « S’attendrit » préserve l’image concrète du cœur sans la réduire à une réaction psychologique abstraite.
- source_word: ዲቤሃ
  choice: à ce sujet
  rationale: Le référent du pronom demeure incertain. Cette formulation française conserve une référence volontairement ouverte.
- source_word: ኢይትሀወክ ኵልያቲሁ
  choice: dont les reins ne sont pas troublés
  rationale: ኵልያት désigne littéralement les reins, image sémitique du siège intérieur des émotions ou de la conscience. Le terme corporel est conservé, avec une note explicative.
- source_word: ቃለ ጽነኒ
  choice: cette parole sévère
  rationale: L’expression désigne une parole dure ou sévère. Cette traduction garde le ton solennel tout en restant idiomatique en français actuel.
- source_word: ፅእት ዲቤሆሙ
  choice: la sentence prononcée contre eux
  rationale: L’expression évoque une décision qui est sortie ou a été émise à leur encontre. « Sentence prononcée » rend naturellement la portée judiciaire.
- source_word: '[እምኔሆሙ] ዘአውፅእዎሙ ከመ''ዝ'
  choice: à cause de ceux qui les ont fait sortir ainsi
  rationale: La proposition relative « ceux qui les ont fait sortir ainsi » est maintenue. La préposition est comprise causalement, mais l’incertitude du passage et du mot entre crochets est signalée en note.
theological_decisions:
- issue: Image anthropologique du cœur et des reins
  choice: Conserver les termes corporels « cœur » et « reins »
  alternative: Remplacer « reins » par « être intérieur » ou reformuler l’ensemble en langage psychologique abstrait
  rationale: Le texte emploie une représentation ancienne et incarnée de la vie morale et affective. La conserver évite d’aplanir l’imagerie sémitique et sa tension théologique.
- issue: Portée de la sentence et causalité de la proposition finale
  choice: Rendre la proposition finale selon une lecture causale, tout en signalant son incertitude textuelle
  alternative: « parmi eux ainsi » ou « de leur part ainsi »
  rationale: Le contexte permet une valeur causale de la préposition, mais le témoin éthiopien est difficile à cet endroit. La note empêche de présenter cette lecture comme absolument certaine.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe solennelle de la question est conservée, de même que les images corporelles anciennes. Les formulations trop archaïques (« entrailles », « oracle de rigueur ») ont été évitées, tandis que les ambiguïtés référentielles et textuelles sont indiquées sans être résolues silencieusement.
