base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: fr
  text: Après cela, mon grand-père Hénok me donna, dans un livre, le signe de toutes les choses cachées[a], ainsi que les paraboles[b] qui lui avaient été données ; et ils me les exposeront dans le récit du Livre de la Parabole[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset présente une syntaxe difficile dans le témoin guèze. La traduction reste proche de la formulation conservée sans en éliminer toutes les ambiguïtés.
    reason: textual_variant
  - marker: b
    text: Le mot traduit par « paraboles » peut aussi se rendre par « similitudes ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « dans le récit du livre de la Parabole » ; le singulier suit ici la forme du témoin, bien que cette partie de l’ouvrage soit souvent appelée le Livre des Paraboles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: le signe
  rationale: Le nom peut désigner un signe, une marque ou un indice. « Le signe » conserve la portée révélatrice du terme sans lui imposer le sens non attesté d’« explication ».
- source_word: ኵሎሙ ኅቡኣት
  choice: toutes les choses cachées
  rationale: Cette formulation transparente rend les réalités dissimulées qui sont dévoilées, sans introduire le terme théologiquement plus chargé de « mystères ».
- source_word: በመጽሐፍ
  choice: dans un livre
  rationale: La préposition situe naturellement le contenu dans un écrit. L’indéfini convient ici à la première mention du livre en français.
- source_word: እምሔውየ ሄኖክ
  choice: mon grand-père Hénok
  rationale: እምሔውየ est un nom muni du suffixe possessif de première personne et signifie « mon grand-père » ou « mon ancêtre » ; il constitue avec Hénok le sujet explicite du verbe.
- source_word: ምሳሌያተ
  choice: les paraboles
  rationale: « Paraboles » est naturel et accessible en français, tout en laissant en note l’autre traduction possible, « similitudes ».
- source_word: ተውህበ ሎቱ
  choice: qui lui avaient été données
  rationale: La forme passive indique que Hénok les a reçues ; le plus-que-parfait exprime naturellement l’antériorité dans le récit.
- source_word: ይመርሙ ሊተ
  choice: ils me les exposeront
  rationale: Le verbe et son sujet pluriel sont difficiles. « Exposer » garde l’idée de présenter ou de développer le contenu sans trancher en faveur d’une interprétation technique.
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: le récit du Livre de la Parabole
  rationale: ነገር peut signifier parole, affaire ou récit. « Récit » convient au contexte littéraire, tandis que le singulier « Parabole » respecte la forme immédiate du témoin.
theological_decisions:
- issue: Faut-il rendre le contenu dissimulé par « choses cachées » ou par un terme théologique plus marqué ?
  choice: choses cachées
  alternative: mystères
  rationale: Le passage relève bien d’une révélation apocalyptique, mais le guèze n’exige pas le terme technique « mystères ». La traduction retenue préserve la tension sans importer une association doctrinale ultérieure.
- issue: La nature du « signe » donné à Noé
  choice: signe
  alternative: explication
  rationale: Le terme source appartient au champ du signe, de la marque ou de l’indice. Traduire par « explication » résoudrait indûment la manière dont le livre communique les réalités cachées.
translation_notes:
  register: Français international moderne, digne et lisible. Le nom Hénok suit une translittération française reconnaissable. La phrase conserve le sujet pluriel indéterminé de la dernière proposition et les difficultés réelles du texte, tout en adoptant une syntaxe française naturelle.
