revisions:
- from: 'Et ce jour-là, Michel répondit[a] à Raphaël : « La puissance de l’esprit me saisit et provoque en moi la colère à cause de la rigueur du jugement relatif aux secrets cachés. Qui peut supporter la terrible sentence qui a été exécutée[b] et devant laquelle ils se dissolvent ? »'
  to: 'Et ce jour-là, Michel répondit[a] à Raphaël : « La puissance de l’esprit me saisit et me provoque à la colère à cause de la rigueur du jugement au sujet des réalités cachées. Qui peut supporter le terrible jugement qui a été exécuté[b] et devant lequel ils se dissolvent ? »'
  rationale: La révision corrige l’intrusion anglaise « terrible sentence », emploie « jugement » dans un sens judiciaire plus large et naturel, et remplace « secrets cachés » par « réalités cachées ». Elle maintient l’ambiguïté textuelle dans la note, l’indétermination théologique de « l’esprit », la force causative de la colère et l’image finale de dissolution.
