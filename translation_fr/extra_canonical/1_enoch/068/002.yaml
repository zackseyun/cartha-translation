base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: fr
  text: 'Et ce jour-là, Michel répondit[a] à Raphaël : « La puissance de l’esprit me saisit et me provoque à la colère à cause de la rigueur du jugement au sujet des réalités cachées. Qui peut supporter le terrible jugement qui a été exécuté[b] et devant lequel ils se dissolvent ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze de cette phrase est difficile. Le passage traduit par « à cause de la rigueur du jugement au sujet des réalités cachées » pourrait désigner plus littéralement une chose terrible « pour l’oreille » au sujet de réalités cachées.
    reason: textual_variant
  - marker: b
    text: 'Ou : « la chose terrible qui a été faite ». Les mots peuvent renvoyer soit au jugement lui-même, soit à sa révélation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: répondit
  rationale: Le verbe narratif peut désigner une réponse ou une prise de parole en réaction; « répondit » conserve le cadre dialogué.
- source_word: ኀይሉ ለመንፈስ
  choice: la puissance de l’esprit
  rationale: Cette expression garde l’idée d’une force spirituelle agissante sans identifier explicitement l’esprit à l’Esprit saint.
- source_word: ይመሥጠኒ
  choice: me saisit
  rationale: Le verbe exprime une prise puissante; « me saisit » en préserve la vigueur et reste naturel en français.
- source_word: ያምዕዐኒ
  choice: provoque en moi la colère
  rationale: La forme causative renvoie à la colère ou à l’indignation; cette formulation rend le contenu émotionnel précis du verbe.
- source_word: ዕፁቡ
  choice: la rigueur / la terrible sentence
  rationale: Le terme désigne quelque chose de dur, terrible ou accablant. Selon la syntaxe, « rigueur » convient à la première occurrence et « terrible sentence » à la question rhétorique.
- source_word: እንተ ኅቡኣት
  choice: les secrets cachés
  rationale: Cette expression française conserve à la fois l’idée de réalités secrètes et celle de leur dissimulation, malgré une légère redondance voulue.
- source_word: ተዐግሦተ
  choice: supporter
  rationale: Le verbe indique la capacité d’endurer une réalité accablante; « supporter » est direct et idiomatique.
- source_word: ተገብረት
  choice: a été exécutée
  rationale: Le passif accompli indique que la sentence a été mise à exécution; la formulation conserve la nuance judiciaire probable.
- source_word: ይትመሰዉ
  choice: ils se dissolvent
  rationale: Le verbe évoque une disparition comparable à une fonte ou à une dissolution; « se dissolvent » conserve cette image apocalyptique.
theological_decisions:
- issue: Identification de መንፈስ
  choice: l’esprit
  alternative: l’Esprit
  rationale: Le texte décrit une puissance spirituelle qui agit sur Michel, mais ne l’identifie pas sans ambiguïté à l’Esprit divin; la minuscule évite de trancher doctrinalement.
- issue: Référent de ዕፁቡ et syntaxe de la proposition difficile
  choice: la rigueur du jugement relatif aux secrets cachés
  alternative: une chose terrible à entendre au sujet des réalités cachées
  rationale: Le texte guèze transmis est difficile et semble répéter une expression liée à l’oreille. La traduction principale suit la cohérence judiciaire du contexte tout en signalant dans la note l’autre analyse possible.
- issue: Nature de ce qui a été fait
  choice: la terrible sentence qui a été exécutée
  alternative: la chose terrible qui a été faite
  rationale: Le contexte favorise une sentence ou un jugement, mais le guèze peut désigner plus largement une chose terrible accomplie; l’alternative est donc conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les noms Michel et Raphaël suivent leur forme française traditionnelle. La structure rhétorique et l’image apocalyptique sont conservées, tandis que les incertitudes du texte guèze sont présentées en notes plutôt que résolues silencieusement.
