    issue: Présence de l’anglais « terrible sentence » dans la traduction française.
    rationale: Cette expression n’est pas du français et constitue une erreur de langue manifeste dans le texte publié.
  - severity: low
    issue: « Secrets cachés » est lourd et redondant en français moderne.
    rationale: Le guèze désigne des réalités cachées, mais « réalités cachées » conserve ce sens sans le pléonasme français de « secrets cachés ».
  - severity: low
    issue: « Sentence » est moins adéquat que « jugement » dans le texte principal.
    rationale: Le terme français « jugement » couvre mieux l’acte ou la réalité judiciaire redoutable, tout en laissant ouverte l’alternative signalée par la note.
