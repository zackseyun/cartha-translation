base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: fr
  text: Son corps était blanc comme la neige et rouge comme une rose en fleur[a]. Les cheveux de sa tête étaient comme de la laine blanche, et ses boucles étaient belles. Ses yeux étaient beaux[b] ; lorsqu’il ouvrit les yeux, il illumina toute la maison comme le soleil, et toute la maison devint extrêmement lumineuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression guèze établit une comparaison florale pour la couleur rouge ; on pourrait aussi traduire : « rouge comme une fleur de rose ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien est difficile à cet endroit. La lecture « ses yeux étaient beaux » suit la traduction retenue dans cette édition ; une analyse légèrement différente du membre de phrase est possible.
    reason: textual_difficulty
lexical_decisions:
- source_word: ሥጋሁ
  choice: son corps
  rationale: Le contexte décrit l’apparence physique visible de l’enfant dans son ensemble ; « corps » convient mieux ici que « chair ».
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: blanc comme neige
  rationale: Cette formulation française naturelle conserve exactement l’image de la blancheur de la neige.
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: rouge comme une rose en fleur
  rationale: La comparaison florale exprime une vive couleur rouge. « Une rose en fleur » préserve l’image sans imposer un détail botanique incertain.
- source_word: ጸጕረ ርእሱ
  choice: les cheveux de sa tête
  rationale: La formulation conserve l’expression complète et solennelle du guèze, tout en restant claire en français.
- source_word: ከመ ፀምር ጻዕዳ
  choice: comme de la laine blanche
  rationale: 'L’ordre français naturel maintient les deux éléments explicites de la comparaison : la laine et sa blancheur.'
- source_word: ተወድምድማሁ ሠናይ
  choice: ses boucles étaient belles
  rationale: Le substantif renvoie aux boucles ou mèches de cheveux, et l’adjectif masculin singulier en guèze s’accorde avec ce terme plutôt qu’avec le pluriel « yeux » qui suit.
- source_word: ከሠተ አዕይንቲሁ
  choice: lorsqu’il les ouvrait
  rationale: Dans ce contexte, le verbe signifie naturellement ouvrir les yeux ; le pronom évite une répétition pesante après « Quant à ses yeux ».
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: il illuminait toute la maison comme le soleil
  rationale: La tournure causative et l’image solaire concrète sont toutes deux conservées.
- source_word: ወፈድፋደ በርሀ ኵሉ ቤት
  choice: et la maison tout entière devenait extraordinairement lumineuse
  rationale: « Extraordinairement » rend l’intensification, tandis que « devenait lumineuse » exprime l’effet produit sur toute la maison.
theological_decisions:
- issue: Conserver ou atténuer la luminosité physique extraordinaire de l’enfant
  choice: 'Conserver les images concrètes : blancheur de neige, rougeur florale et lumière solaire remplissant la maison.'
  alternative: Réduire ces traits à une beauté ou à une gloire générale.
  rationale: Le caractère saisissant et merveilleux de la scène appartient au langage apocalyptique du passage ; l’atténuer en modifierait la portée.
- issue: Rapport grammatical entre « belles », les boucles et les yeux
  choice: Rattacher « belles » aux boucles, puis introduire les yeux comme thème de la proposition suivante.
  alternative: Traduire « ses yeux étaient beaux » ou « splendides ».
  rationale: L’accord grammatical du guèze favorise les boucles, tandis que « ses yeux » peut être repris par « lorsqu’il ouvrait ses yeux ». La note signale néanmoins la difficulté du texte sans résoudre silencieusement toute ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement descriptif du guèze, mais les répétitions sont légèrement aménagées pour la fluidité. Le passé imparfait exprime ici la description et l’effet habituel ou caractéristique de l’ouverture des yeux ; le texte source ne force pas une distinction temporelle plus précise.
