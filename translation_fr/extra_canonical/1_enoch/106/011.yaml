base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/011.yaml
  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: fr
  text: Et il se redressa dans les mains de la sage-femme[a], ouvrit la bouche et bénit le Seigneur du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « sage-femme » désigne littéralement une femme qui accouche ou fait accoucher ; dans cette scène de naissance, il renvoie le plus naturellement à celle qui reçoit l’enfant.
    reason: Alternative lexicale et ambiguïté du référent.
lexical_decisions:
- source_word: ተንሥአ
  choice: se redressa
  rationale: Le verbe exprime l’action de se lever ou de se dresser. Pour un nouveau-né tenu dans des mains, « se redressa » restitue naturellement le geste saisissant sans suggérer qu’il se tenait déjà debout.
- source_word: ውስተ እዴሃ
  choice: dans les mains de
  rationale: La préposition et le nom au pluriel signifient littéralement « dans ses mains » ; la tournure française avec le complément explicité est naturelle dans ce contexte.
- source_word: መውላዲት
  choice: sage-femme
  rationale: Le terme désigne littéralement une femme liée à l’accouchement ou à l’enfantement. Dans cette scène, il renvoie le plus naturellement à celle qui reçoit et tient le nouveau-né.
- source_word: ፈትሐ አፉሁ
  choice: ouvrit la bouche
  rationale: La formulation concrète de la source est conservée, car elle souligne le caractère extraordinaire de l’action du nouveau-né plutôt que de la réduire à « parla ».
- source_word: ባረኮ
  choice: bénit
  rationale: Le verbe signifie couramment « bénir ». Ce choix garde le registre biblique et la direction de l’acte vers Dieu, sans l’aplatir en simple louange.
- source_word: እግዚአ ሰማይ
  choice: le Seigneur du ciel
  rationale: « Seigneur » rend dignement le titre de souveraineté divine, et le singulier « du ciel » correspond directement à l’expression guèze tout en étant idiomatique en français.
theological_decisions:
- issue: Rendu du titre divin
  choice: le Seigneur du ciel
  alternative: le Maître du ciel ; le Seigneur des cieux
  rationale: Le titre est traduit plutôt que translittéré. « Seigneur » est le rendu biblique français usuel d’un titre divin de souveraineté, tandis que « du ciel » préserve le singulier de la source sans imposer une cosmologie particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination narrative et les expressions concrètes de la source sont maintenues, avec une syntaxe fluide. « Se redressa » évite l’étrangeté excessive de « se leva » pour un nouveau-né tenu dans les mains, tout en préservant le caractère prodigieux du récit.
