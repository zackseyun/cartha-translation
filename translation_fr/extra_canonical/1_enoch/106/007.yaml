base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: fr
  text: 'Et maintenant, mon père, me voici : je te prie et je te supplie d’aller auprès de Henok, notre père, et d’entendre de lui la vérité, car sa demeure est avec les anges.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque la transition temporelle et l’urgence de l’appel dans un français naturel.
- source_word: ሀለውኩ
  choice: me voici
  rationale: Rend explicitement la présence actuelle exprimée par le verbe, sans la réduire à une simple formule auxiliaire.
- source_word: አስተበቍዐከ ወእስእል
  choice: je te prie et je te supplie
  rationale: Conserve le redoublement rhétorique de deux verbes de demande pressante et leur intensité croissante.
- source_word: ከመ ትሖር ኀበ
  choice: d’aller auprès de
  rationale: Exprime naturellement en français le contenu de la demande et le déplacement vers Henok.
- source_word: ሄኖክ አቡነ
  choice: Henok, notre père
  rationale: Transcrit ሄኖክ par « Henok » et maintient le titre familial et honorifique « notre père ».
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: d’entendre de lui la vérité
  rationale: Préserve le verbe concret « entendre », l’origine de l’information et l’ordre du syntagme guèze, tout en restant intelligible.
- source_word: እስመ
  choice: car
  rationale: Introduit avec clarté la raison pour laquelle Henok doit être consulté.
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: sa demeure est avec les anges
  rationale: Maintient la construction nominale et l’image apocalyptique d’une demeure établie auprès des anges.
theological_decisions:
- issue: La relation de Henok aux anges
  choice: sa demeure est avec les anges
  alternative: il demeure avec les anges
  rationale: La formulation nominale du guèze met l’accent sur la demeure de Henok. La conserver évite d’aplatir ou de préciser indûment la nature de sa résidence céleste.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « me voici » rend la présence immédiate du locuteur; « je te prie et je te supplie » conserve l’insistance sans archaïsme excessif. Aucun appel de note n’est nécessaire.
