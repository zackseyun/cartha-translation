base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: fr
  text: Alors son père Lamek prit peur et courut vers moi. Il ne croyait pas que l’enfant venait de lui, mais que son apparence ressemblait à celle des anges du ciel.[a] Et voici, je suis venu auprès de toi pour que tu me fasses connaître ce qui est juste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la construction peut se rendre: « mais que son apparence était de celle des anges du ciel ». Le texte souligne la ressemblance; il n’affirme pas explicitement que l’enfant descendait des anges.'
    reason: ambiguïté syntaxique et théologique
  - marker: b
    text: Ou « la justice », « la droiture » ou, selon le contexte, « la vérité ».
    reason: alternative lexicale
lexical_decisions:
- source_word: ፈርሀ
  choice: prit peur
  rationale: Rend naturellement en français moderne le verbe de crainte tout en conservant son effet narratif.
- source_word: ጐየ
  choice: courut
  rationale: Le verbe exprime un déplacement précipité; « courut » préserve l’urgence sans imposer nécessairement l’idée d’une fuite loin de l’enfant.
- source_word: አአምነ (probablement ኢአምነ)
  choice: ne croyait pas
  rationale: 'La leçon attendue dans le contexte comporte vraisemblablement la négation; elle donne le sens cohérent: Lamek ne croit pas être le père de l’enfant.'
- source_word: እምኔሁ
  choice: venait de lui
  rationale: Exprime l’origine et, dans ce contexte, la filiation, sans ajouter une formulation biologique plus explicite que le texte.
- source_word: አምሳሉ
  choice: son apparence
  rationale: Conserve le nom muni du suffixe (« son image/sa ressemblance ») plutôt que de le transformer en simple préposition comparative.
- source_word: እመላእክተ ሰማይ
  choice: à celle des anges du ciel
  rationale: Rend la comparaison d’origine ou de catégorie attachée à l’apparence, sans affirmer une paternité angélique.
- source_word: ናሁ
  choice: voici
  rationale: Marqueur discursif traditionnel mais encore intelligible, adapté au registre apocalyptique.
- source_word: ታይድዐኒ
  choice: tu me fasses connaître
  rationale: Préserve la valeur causative de « faire savoir/connaître ».
- source_word: ጽድቀ
  choice: ce qui est juste
  rationale: Conserve la portée morale ou juridique du terme tout en restant naturel dans une demande d’éclaircissement.
theological_decisions:
- issue: Le texte affirme-t-il une paternité angélique ou seulement une ressemblance avec les anges?
  choice: La traduction parle de l’apparence de l’enfant, qui ressemble à celle des anges du ciel.
  alternative: « mais qu’il venait des anges du ciel » ou « mais qu’il était l’un des anges du ciel »
  rationale: Le guèze emploie le vocabulaire de l’image ou de la ressemblance, et non une affirmation explicite de descendance angélique. La traduction préserve donc la tension sans transformer l’inquiétude de Lamek en déclaration doctrinale.
- issue: Sens de ጽድቀ dans la requête finale
  choice: « ce qui est juste »
  alternative: « la vérité » ou « la justice »
  rationale: Le substantif peut évoquer la justice, la droiture ou ce qui est exact. Le choix principal maintient cette amplitude; la note signale les autres lectures contextuellement possibles.
- issue: Présence de la négation devant « croire »
  choice: « Il ne croyait pas que l’enfant venait de lui »
  alternative: « il croyait que l’enfant ne venait pas de lui »
  rationale: La tradition textuelle et le contexte soutiennent une négation probablement altérée dans la transcription fournie. Les deux formulations aboutissent à une idée proche, mais la première suit la leçon guèze corrigée proposée par la révision critique.
translation_notes:
  register: Français international moderne, narratif et digne. « Lamek » suit la forme française usuelle. « Et voici » conserve la couleur apocalyptique; les tournures restent accessibles et évitent d’expliciter au-delà du témoin guèze.
