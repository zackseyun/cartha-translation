base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: fr
  text: Et alors, il se leva des mains de la sage-femme[a], ouvrit la bouche et parla au Seigneur de justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ses mains » ; le texte désigne la femme comme celle qui assiste à l’accouchement, d’où « la sage-femme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au Seigneur de droiture ». Le terme guèze peut exprimer aussi bien la rectitude morale que la justice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: Et à ce moment-là
  rationale: Rend le connecteur temporel et narratif dans un français actuel tout en conservant le ton élevé du récit.
- source_word: ተንሥአ
  choice: il se releva
  rationale: Exprime le mouvement de se lever sans préciser indûment que le nouveau-né se serait tenu debout.
- source_word: እምእዴሃ፡ ለመውለዲት
  choice: d’entre les mains de la sage-femme
  rationale: Le texte dit littéralement « de ses mains » et désigne cette femme comme l’assistante de l’accouchement; « sage-femme » explicite naturellement le référent.
- source_word: ወከሠተ፡ አፉሁ
  choice: ouvrit la bouche
  rationale: Conserve la formule concrète d’introduction à la parole et la succession active des verbes.
- source_word: ተወተናገረ
  choice: et parla
  rationale: Traduction directe et sobre du verbe de parole.
- source_word: ለእግዚአ፡ ጽድቅ
  choice: au Seigneur de justice
  rationale: « Seigneur » convient au titre religieux; « justice » conserve en français la portée à la fois morale et judiciaire de ጽድቅ, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Sens de ጽድቅ dans le titre divin
  choice: justice
  alternative: droiture
  rationale: Le français « justice » est naturel dans un titre divin et peut couvrir l’ordre moral comme l’exercice du jugement. « Droiture » reste possible et préserve plus explicitement la qualité morale; la note maintient cette amplitude sans trancher silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination reste fluide sans archaïsmes; l’image étonnante du nouveau-né qui se relève et parle est conservée sans explication ajoutée.
