base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: fr
  text: Et il me semble qu’il ne vient pas de moi, mais des anges ; et je crains qu’un prodige[a] ne se produise de son vivant sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une merveille » ou « un phénomène extraordinaire ». Le terme guèze désigne quelque chose d’exceptionnel, éventuellement troublant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመስለኒ
  choice: il me semble
  rationale: Conserve la perception subjective exprimée au présent dans le discours direct, sans transformer le soupçon de Lamek en certitude.
- source_word: አኮኑ፡ እምኔየ
  choice: il ne vient pas de moi
  rationale: Exprime naturellement en français l’origine et le soupçon de paternité, tout en respectant la valeur présente de la proposition.
- source_word: እመላእክት
  choice: des anges
  rationale: Maintient explicitement le contraste saisissant entre une origine humaine et une origine angélique.
- source_word: እፈረሀ
  choice: je crains
  rationale: Le présent convient à la forme imperfective et à la panique actuelle de Lamek dans son discours direct.
- source_word: ኢይትገበር
  choice: ne s’accomplisse
  rationale: Le subjonctif après « je crains que » rend idiomatiquement en français l’éventualité redoutée, tandis que le verbe pronominal conserve la nuance passive ou impersonnelle.
- source_word: መንክር
  choice: un prodige
  rationale: Désigne un événement extraordinaire et potentiellement inquiétant dans un registre apocalyptique digne, sans le réduire à quelque chose de simplement étrange.
- source_word: በመዋዕሊሁ
  choice: de son vivant
  rationale: Rend clairement l’idée temporelle de « durant ses jours » en français moderne et naturel.
- source_word: ዲበ፡ ምድር
  choice: sur la terre
  rationale: Préserve la portée terrestre, voire cosmique, de l’expression dans ce contexte apocalyptique.
theological_decisions:
- issue: Nature de l’origine de l’enfant dans la crainte de Lamek
  choice: Présenter l’origine angélique comme le soupçon actuel et inquiet de Lamek, non comme un fait confirmé par le narrateur.
  alternative: Affirmer comme une réalité que l’enfant a été engendré par des anges, ou réduire la phrase à une réaction hyperbolique devant son apparence.
  rationale: La formule « il me semble » marque explicitement une perception subjective. La traduction conserve ainsi la tension théologique du récit sans valider ni neutraliser l’inférence de Lamek.
- issue: Degré de certitude concernant le prodige
  choice: Employer le subjonctif après « je crains que », qui présente l’événement comme redouté sans en garantir la réalisation.
  alternative: « un prodige s’accomplira », qui ferait de l’événement une prédiction plus catégorique.
  rationale: La construction française rend naturellement la crainte et respecte l’ouverture modale du contexte sans imposer une certitude absente.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent maintient l’immédiateté du discours direct de Lamek. « De son vivant » évite l’expression moins courante « en ses jours », tandis que « sur la terre » conserve le registre apocalyptique.
