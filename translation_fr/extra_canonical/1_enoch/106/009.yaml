base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: fr
  text: 'Il me répondit : « C’est à cause d’une grande détresse[a] que je suis venu auprès de toi, et c’est à cause d’une vision extraordinaire que je me suis approché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une grande anxiété » ou « d’une situation pressante ». Le terme guèze évoque la détresse ou l’urgence, non la justice.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je suis venu près de toi ». Le verbe signifie « s’approcher » et fait ici écho au verbe « venir » employé plus tôt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ ወይቤ
  choice: Il me répondit
  rationale: Le premier verbe signifie « répondre » et porte le suffixe objet « me ». En français, « Il me répondit » exprime naturellement la formule sémitique littérale « il me répondit et dit » sans lourdeur inutile.
- source_word: በእንተ
  choice: à cause de
  rationale: La préposition peut signifier « au sujet de » ou « à cause de ». Ici, elle introduit dans les deux propositions le motif de la venue du locuteur.
- source_word: ጻህቅ ዐቢይ
  choice: une grande détresse
  rationale: ጻህቅ renvoie ici à la détresse, à l’anxiété ou à l’urgence, et non à la justice, qui relève d’une autre racine guèze. ዐቢይ signifie « grand ».
- source_word: መጻእኩ ኀቤከ
  choice: je suis venu auprès de toi
  rationale: Le verbe exprime la venue, et ኀቤከ indique le mouvement ou la relation vers « toi ». Le passé composé convient à une venue dont le motif est maintenant expliqué.
- source_word: ራእይ ዐፁብ
  choice: une vision extraordinaire
  rationale: ራእይ désigne une vision, notamment dans un contexte apocalyptique. ዐፁብ marque ce qui suscite l’étonnement ou l’émerveillement ; « extraordinaire » reste naturel sans préciser si la vision est admirable ou terrifiante.
- source_word: ቀረብኩ
  choice: je me suis approché
  rationale: Le verbe signifie « s’approcher » ou « venir près ». La traduction conserve la distinction avec le premier verbe de venue, malgré leur proximité de sens.
theological_decisions:
- issue: Sens de ጻህቅ dans le motif de la venue
  choice: détresse
  alternative: justice, justice morale ou un grand juste
  rationale: La forme attestée ጻህቅ appartient au champ de la détresse, de l’anxiété ou de l’urgence et ne doit pas être confondue avec ጽድቅ, « justice ». La traduction évite ainsi d’introduire dans le verset une référence morale ou messianique que le mot source ne porte pas.
- issue: Valeur de ዐፁብ appliqué à la vision
  choice: extraordinaire
  alternative: merveilleuse, étonnante ou prodigieuse
  rationale: « Extraordinaire » préserve le caractère hors du commun de la vision sans décider si l’émotion suscitée est positive ou effrayante.
translation_notes:
  register: Français international moderne, clair et digne. La formule guèze « il me répondit et dit » est rendue idiomatiquement par « Il me répondit ». Le parallélisme des deux motifs introduits par « à cause de » et la différence entre « venir » et « s’approcher » sont conservés.
