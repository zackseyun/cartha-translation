revisions:
- from: 'Et maintenant, mon père, écoute-moi : un fils est né à mon fils Lamek, mais son apparence et sa constitution ne ressemblent pas à celles d’un être humain. Sa couleur est plus blanche que la neige et plus rouge qu’une fleur écarlate[a], et les cheveux de sa tête sont plus blancs que la laine blanche. Ses yeux sont comme les rayons du soleil[b] ; il a ouvert les yeux et a illuminé toute la maison.'
  to: 'Et maintenant, mon père, écoute-moi : un fils est né à mon fils Lamek, et son apparence et sa forme ne sont pas celles d’un être humain. Sa couleur est plus blanche que la neige et plus rouge qu’une rose[a], et ses cheveux sont plus blancs que la laine blanche. Ses yeux sont comme les rayons du soleil[b] ; il a ouvert les yeux et a illuminé toute la maison.'
  rationale: La révision remplace « constitution » par « forme », qui reste proche du vocabulaire de formation sans en tirer une conclusion ontologique. Elle restitue « rose » comme le rendu traditionnel du terme floral, avec une note qui préserve l’incertitude lexicale. Les autres ajustements améliorent l’idiomaticité française tout en conservant la coordination narrative du guèze.
