base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: fr
  text: 'Et maintenant, mon père, écoute-moi : un fils est né à mon fils Lamek, et son apparence et sa forme ne sont pas celles d’un être humain. Sa couleur est plus blanche que la neige et plus rouge qu’une rose[a], et ses cheveux sont plus blancs que la laine blanche. Ses yeux sont comme les rayons du soleil[b] ; il a ouvert les yeux et a illuminé toute la maison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze désigne traditionnellement une rose ou sa fleur, mais l’identification botanique précise reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’expression rendue par « les rayons du soleil » est difficile en guèze ; elle évoque clairement un éclat solaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምዐኒ
  choice: écoute-moi
  rationale: L’impératif avec suffixe de première personne exprime un appel direct et pressant ; « écoute-moi » est naturel en français actuel.
- source_word: ተወልደ
  choice: est né
  rationale: Le parfait passif annonce une naissance accomplie ; le passé composé convient au récit rapporté.
- source_word: ዘአምሳሉ ወፍጥረቱ
  choice: son apparence et sa constitution
  rationale: Le premier terme relève de la ressemblance ou de l’aspect visible, tandis que le second désigne la formation ou la constitution. Cette paire évite aussi bien l’abstraction métaphysique que la lourdeur de « forme de sa création ».
- source_word: ኢኮነ ከመ ፍጥረተ ሰብእ
  choice: ne ressemblent pas à celles d’un être humain
  rationale: La comparaison porte sur l’apparence et la constitution du nouveau-né. Le français garde l’étrangeté de l’affirmation sans conclure qu’il ne serait pas humain.
- source_word: ኅብሩ
  choice: sa couleur
  rationale: Le contexte décrit la coloration visible au moyen de comparaisons avec la neige et une fleur ; « couleur » reste le rendu le plus direct.
- source_word: ይጸዐዳ እምአስኃትያ
  choice: plus blanche que la neige
  rationale: La construction comparative et l’image concrète sont conservées.
- source_word: ይቀይሕ እምጽጌ ረዳ
  choice: plus rouge qu’une fleur écarlate
  rationale: Le verbe exprime la rougeur et le groupe nominal désigne une fleur rouge, mais son espèce exacte est incertaine ; le rendu préserve l’image sans imposer la rose.
- source_word: እምፀምር ጸዐዳ
  choice: plus blancs que la laine blanche
  rationale: La répétition de la blancheur intensifie la comparaison et est volontairement maintenue.
- source_word: ከመ እግረን ለፀሐይ
  choice: comme les rayons du soleil
  rationale: L’expression guèze est difficile, mais elle évoque clairement l’éclat solaire des yeux. « Rayons » conserve cette image sans précision excessive.
- source_word: ከሠተ አዕይንቲሁ ወአበርሀ ኵሎ ቤተ
  choice: il a ouvert les yeux et a illuminé toute la maison
  rationale: La succession des deux actions reliées par la conjonction est conservée, sans transformer le lien en proposition temporelle.
theological_decisions:
- issue: Degré d’altérité du nouveau-né par rapport à l’humanité ordinaire
  choice: son apparence et sa constitution ne ressemblent pas à celles d’un être humain
  alternative: il n’est pas semblable aux enfants des hommes
  rationale: Le texte décrit une différence saisissante d’aspect et de formation, mais ne tranche pas explicitement une question ontologique. La formulation maintient cette tension sans affirmer que l’enfant serait non humain.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit la progression paratactique du guèze tout en évitant les calques lourds. « Lamek » suit la forme française usuelle du nom biblique. Les deux notes signalent les seules incertitudes lexicales importantes.
