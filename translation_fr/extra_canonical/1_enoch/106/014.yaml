base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: fr
  text: Ils commettront le péché[a] et transgresseront l’ordonnance. Ils s’uniront à des femmes[b], pécheront avec elles, prendront parmi elles des épouses et engendreront des enfants.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « feront le péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se joindront à des femmes ». Le verbe désigne l’union ou l’association sans nommer explicitement un acte sexuel.'
    reason: lexical_alternative
  - marker: c
    text: 'La transcription fournie porte à la fin une répétition obscure, « d’elles et d’elles », mais la vérification de l’édition imprimée de Charles donne : « et ils engendreront des enfants ».'
    reason: textual_variant
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: ils commettront le péché
  rationale: L’expression guèze associe le verbe « faire » à « péché » et forme ainsi l’idiome « commettre le péché ».
- source_word: የኀልፉ፡ ሥርዐተ
  choice: transgresseront l’ordonnance
  rationale: Dans ce contexte moral et normatif, le verbe exprime la violation d’un ordre établi; « ordonnance » évite de préciser indûment qu’il s’agit de la Loi mosaïque.
- source_word: ተደመሩ
  choice: s’uniront
  rationale: Le verbe désigne le fait de se joindre ou de s’associer. « S’uniront » reste naturel en français tout en conservant une portée plus large qu’un verbe sexuel explicite.
- source_word: አንስት
  choice: des femmes
  rationale: Le terme collectif signifie ici « femmes »; le rendre d’emblée par « épouses » ajouterait une précision matrimoniale absente de cette première proposition.
- source_word: አውሰቡ
  choice: prendront … des épouses
  rationale: Le verbe signifie épouser ou prendre femme. Cette lecture corrige l’ancienne analyse erronée selon laquelle il aurait exprimé une séparation.
- source_word: ወይወልዱ፡ ውሉደ
  choice: engendreront des enfants
  rationale: La lecture corrigée de l’édition Charles signifie qu’ils auront ou engendreront des enfants; « engendreront » convient au registre généalogique et apocalyptique.
theological_decisions:
- issue: Nature de l’union avec les femmes
  choice: Traduire par « s’uniront à des femmes » sans expliciter davantage l’acte sexuel.
  alternative: « auront des rapports avec des femmes » ou « épouseront des femmes »
  rationale: Le contexte présente cette union comme pécheresse, mais le premier verbe est un verbe général de jonction. La traduction ne doit pas préciser plus que le témoin guèze.
- issue: Sens de la proposition finale
  choice: Adopter la lecture corrigée « prendront parmi elles des épouses et engendreront des enfants ».
  alternative: Conserver la lecture OCR « seront séparés d’elles et d’elles »
  rationale: La révision fondée sur le texte imprimé de Charles identifie አውሰቡ comme un verbe matrimonial et reconnaît dans la fin du verset ወይወልዱ፡ ውሉደ, « ils engendreront des enfants ». L’ancienne formulation provenait d’une mauvaise reconnaissance du texte.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée du guèze est légèrement allégée pour produire une phrase naturelle, sans effacer la progression des actes. « Ordonnance » maintient le registre normatif sans imposer une identification confessionnelle de la règle transgressée.
