base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: fr
  text: Après quelque temps[a], mon fils Mathusalem prit une épouse pour son fils Lamek. Elle devint enceinte de lui et mit au monde un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « après des jours » ; l’expression peut aussi se comprendre : « après quelques jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: Après quelque temps
  rationale: Cette tournure française naturelle rend l’expression temporelle sans imposer un nombre précis de jours; la possibilité plus littérale est signalée en note.
- source_word: ነሥአ
  choice: prit
  rationale: Dans ce contexte matrimonial, le verbe exprime naturellement le fait de prendre ou de procurer une épouse; Mathusalem demeure le sujet grammatical.
- source_word: ብእሲተ
  choice: une femme
  rationale: Le contexte indique qu’il s’agit d’une épouse, mais «une femme» préserve le terme concret du texte tout en restant idiomatique dans la construction «prit une femme pour».
- source_word: ወፀንሰት
  choice: Elle devint enceinte
  rationale: Formulation moderne, claire et digne, correspondant directement à l’entrée en grossesse.
- source_word: እምኔሁ
  choice: de lui
  rationale: Le pronom renvoie le plus naturellement à Lamek et indique qu’il est le père, sans explicitation ajoutée.
- source_word: ወወለደት ወልደ
  choice: et mit au monde un fils
  rationale: Expression narrative courante en français moderne, fidèle au sens compact de l’énoncé guèze.
theological_decisions:
- issue: Agent de l’arrangement matrimonial dans la proposition initiale
  choice: Mathusalem prit une femme pour son fils Lamek
  alternative: Lamek, fils de Mathusalem, prit une femme; ou Mathusalem reçut une femme pour Lamek
  rationale: La syntaxe guèze désigne le plus naturellement Mathusalem comme sujet et Lamek comme bénéficiaire de l’action. Cette lecture conserve l’idée d’un arrangement familial sans faire appel à une tradition interprétative ultérieure.
translation_notes:
  register: Français international moderne, narratif et digne. «Mathusalem» suit la forme française consacrée; «Lamek» reflète directement le nom transmis ici. La phrase est divisée en deux pour assurer une lecture naturelle sans modifier les rapports syntaxiques.
