base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: fr
  text: 'Quand Mathusalem entendit les paroles de son fils, il vint vers moi aux extrémités de la terre, car il avait appris que j’étais là. Il cria, j’entendis sa voix et je vins à lui. Je lui dis : « Me voici, mon fils. Pourquoi es-tu venu vers moi ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est difficile dans le texte guèze transmis. Traduite littéralement, elle donnerait : « car tu es venu vers moi ». Dans ce contexte, elle semble plutôt exprimer une question : « Pourquoi es-tu venu vers moi ? »'
    reason: textual_variant
lexical_decisions:
- source_word: ሰምዐ
  choice: entendit / j’entendis
  rationale: Le verbe auditif courant convient aux deux occurrences et conserve clairement la succession narrative.
- source_word: ነገረ ወልዱ
  choice: les paroles de son fils
  rationale: ነገር peut désigner une parole, une affaire ou un message. « Les paroles » reste concret, naturel et proche de la formulation guèze.
- source_word: ኀቤየ
  choice: vers moi
  rationale: Cette formulation rend le mouvement en direction du narrateur dans un français naturel.
- source_word: ውስተ አጽናፈ ምድር
  choice: aux extrémités de la terre
  rationale: Ce choix préserve la portée géographique et apocalyptique de l’expression sans la réduire à la simple idée d’un lieu éloigné.
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: car il avait appris que j’étais là
  rationale: Le plus-que-parfait explicite l’antériorité de l’information qui motive le voyage. « Avait appris » évite en français la répétition immédiate de « entendit » tout en conservant le sens de réception d’une nouvelle.
- source_word: ጸርኀ
  choice: il cria
  rationale: Le verbe garde la vigueur d’un appel lancé à haute voix sans ajouter une nuance absente du texte.
- source_word: ቃሎ
  choice: sa voix
  rationale: Dans le contexte d’un cri entendu, « voix » est le sens contextuel le plus naturel.
- source_word: ናሁ ሀለውኩ
  choice: Me voici
  rationale: Formule française actuelle et digne qui rend idiomatiquement l’annonce de présence « voici, je suis là ».
- source_word: ወልድየ
  choice: mon fils
  rationale: L’adresse filiale explicite est conservée.
- source_word: እስመ መጻእከ ኀቤየ
  choice: Pourquoi es-tu venu vers moi ?
  rationale: Le guèze transmis est difficile si እስመ est rendu littéralement par « car/parce que ». Le contexte favorise une question portant sur le motif de la venue, mais l’incertitude textuelle est signalée en note.
theological_decisions:
- issue: Formule de localisation cosmique
  choice: aux extrémités de la terre
  alternative: dans une région lointaine / aux confins du pays
  rationale: La traduction conserve l’imagerie spatiale apocalyptique du texte au lieu de la banaliser en simple éloignement.
- issue: Interprétation de la dernière proposition
  choice: question sur le motif de la venue
  alternative: 'affirmation littérale : « car tu es venu vers moi »'
  rationale: La question correspond le mieux à l’échange narratif, tout en laissant visible dans la note la difficulté réelle du texte transmis plutôt que de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, fluide et digne. Le récit reste sobre; « Me voici » conserve une tonalité élevée sans archaïsme marqué. L’ambiguïté de la clause finale est préservée au moyen d’une note signalée dans le texte.
