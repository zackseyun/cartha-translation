  terminology: 'Les noms et termes sont cohérents : « Mathusalem », « paroles », « voix », « mon fils » et « extrémités de la terre » conviennent au contexte. « Il avait appris » est une modulation française naturelle de « il avait entendu » dans le sens de recevoir une information, sans altérer le sens.'
