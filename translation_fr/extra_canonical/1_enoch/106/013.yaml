base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: fr
  text: 'Et moi, Hénoch, je lui répondis : « Le Seigneur fera une chose nouvelle sur la terre[a]. Cela, je l’ai déjà vu dans une vision et je te l’ai fait connaître, car, dans la génération de mon père Jared, ils ont transgressé la parole de mon Seigneur, venue des hauteurs du ciel[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « renouvellera » ou « fera du nouveau sur la terre » ; le verbe et son complément guèzes expriment tous deux l’idée de nouveauté.'
    reason: lexical_alternative
  - marker: b
    text: La syntaxe guèze est difficile. « Des hauteurs du ciel » peut se rattacher à « parole » (« la parole venue des hauteurs du ciel ») ou à « mon Seigneur » (« mon Seigneur qui est dans les hauteurs du ciel »).
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: je lui répondis
  rationale: La formule sémitique littérale « je répondis et lui dis » est rendue naturellement en français par « je lui répondis », sans perte de la fonction narrative.
- source_word: ይኄድስ … ኀዳሳተ
  choice: fera une chose nouvelle
  rationale: Le verbe et son complément appartiennent tous deux au champ lexical de la nouveauté. Cette formulation conserve l’idée d’un acte divin nouveau sans préciser indûment s’il s’agit d’une création ou d’un renouvellement.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Équivalent français naturel de la locution spatiale guèze.
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: je l’ai déjà vu dans une vision
  rationale: « Déjà » exprime l’antériorité indiquée par ወዳእኩ, tandis que « dans une vision » préserve explicitement le mode de révélation.
- source_word: ወአይዳዕኩከ
  choice: je te l’ai fait connaître
  rationale: Le causatif du verbe « connaître » est rendu directement et conserve le registre révélatoire.
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: dans la génération de mon père Jared
  rationale: La traduction maintient le cadre généalogique et rattache clairement « mon père » à Jared.
- source_word: አኅለፉ
  choice: ils ont transgressé
  rationale: Le verbe évoque le fait de passer au-delà d’une limite; avec « parole », « transgresser » exprime adéquatement la violation sans la préciser davantage.
- source_word: ነገረ ለእግዚእየ
  choice: la parole de mon Seigneur
  rationale: Le suffixe de première personne est conservé. « Parole » maintient la largeur sémantique du terme, qui pourrait aussi désigner un ordre ou une affaire.
- source_word: እመልዕልተ ሰማይ
  choice: venue des hauteurs du ciel
  rationale: Cette traduction rattache explicitement la locution spatiale à « parole » dans le texte principal, tout en signalant en note l’autre rattachement syntaxique possible. « Hauteurs du ciel » préserve l’imagerie verticale sans suggérer un lieu au-dessus du ciel.
theological_decisions:
- issue: Nature de l’acte nouveau du Seigneur
  choice: « Le Seigneur fera une chose nouvelle sur la terre »
  alternative: « Le Seigneur renouvellera la terre » ou « fera du nouveau sur la terre »
  rationale: Le guèze associe un verbe et un nom de la même famille lexicale, celle de la nouveauté. La traduction retenue évoque un acte divin décisif sans imposer l’idée d’une rénovation cosmique totale.
- issue: Nature de la faute commise à l’époque de Jared
  choice: « ils ont transgressé la parole de mon Seigneur »
  alternative: « ils ont transgressé l’ordre de mon Seigneur »
  rationale: Le contexte peut évoquer la rébellion des Veilleurs, mais le verset reste général. La traduction ne nomme donc pas plus précisément les auteurs ni la teneur de leur faute.
- issue: Rattachement de la locution « des hauteurs du ciel »
  choice: Elle qualifie la provenance de la parole
  alternative: 'Elle peut qualifier le Seigneur : « mon Seigneur, depuis les hauteurs du ciel »'
  rationale: La syntaxe guèze permet difficilement de trancher. Le texte principal adopte une lecture intelligible, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le doublet sémitique « répondis et dis » est allégé pour une lecture naturelle; les termes « vision », « génération », « transgressé » et « parole » conservent le registre apocalyptique et scripturaire. Les marqueurs [a] et [b] figurent dans le texte principal.
