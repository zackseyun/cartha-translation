base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: fr
  text: Alors Lamek, son père, eut peur de lui[a] ; il s’enfuit et alla trouver son père, Mathusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « lui » désigne très probablement le nouveau-né mentionné dans le contexte précédent.
    reason: cross_reference
lexical_decisions:
- source_word: ፈረሀ
  choice: eut peur
  rationale: Le verbe exprime la peur. Le passé simple « eut peur » rend naturellement la réaction immédiate dans un récit au passé.
- source_word: እምኔሁ
  choice: de lui
  rationale: La forme prépositionnelle désigne ici le référent qui inspire la peur, sans expliciter davantage son identité dans le texte principal.
- source_word: ጐየ
  choice: s’enfuit
  rationale: Le verbe évoque un départ rapide motivé par la peur ; « s’enfuit » conserve cette force narrative.
- source_word: መጽአ ኀበ
  choice: alla trouver
  rationale: Dans ce mouvement vers Mathusalem, « alla trouver » est idiomatique en français et exprime à la fois le déplacement et l’arrivée auprès de lui.
- source_word: አቡሁ
  choice: son père
  rationale: La première occurrence est conservée en apposition à Lamek, et la seconde désigne la relation de Lamek avec Mathusalem.
- source_word: ላሜክ
  choice: Lamek
  rationale: Forme française moderne et transparente du nom guèze.
- source_word: ማቱሳላ
  choice: Mathusalem
  rationale: Forme traditionnelle et immédiatement reconnaissable en français.
theological_decisions:
- issue: Référent du pronom dans la peur de Lamek
  choice: Maintenir le pronom « lui » dans le texte, avec une note indiquant que le nouveau-né est son référent le plus naturel.
  alternative: Remplacer « lui » par « l’enfant » dans le texte principal.
  rationale: Le guèze emploie un pronom. Le contexte antérieur désigne très probablement le nouveau-né, mais le traduire explicitement par « l’enfant » résoudrait ce que la formulation source laisse implicite.
translation_notes:
  register: Français international moderne, narratif et digne. L’apposition « Lamek, son père » préserve l’insistance du texte source sur le fait que le père même de l’enfant prit peur. Le point-virgule clarifie la succession des actions sans alourdir la phrase.
