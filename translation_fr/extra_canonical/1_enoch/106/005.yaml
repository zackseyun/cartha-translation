base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: fr
  text: 'Et il lui dit : « J’ai engendré un fils étrange[a] : il ne ressemble pas à un être humain, mais plutôt aux enfants des anges du ciel[b]. Sa nature est différente, et il ne nous ressemble pas. Ses yeux sont comme les rayons du soleil[c], et son visage est glorieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fils hors du commun ». Le terme guèze souligne que l’enfant diffère nettement de la normale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les enfants des anges du ciel ». La formulation familiale frappante est conservée plutôt que réduite à « angélique ».
    reason: lexical_alternative
  - marker: c
    text: La comparaison évoque la lumière émise par le soleil; on pourrait aussi traduire « comme les faisceaux du soleil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: j’ai engendré
  rationale: Le verbe à la première personne exprime ici l’acte d’engendrer. Dans la bouche de Lamek, « j’ai engendré » conserve la revendication paternelle et le registre élevé.
- source_word: ውሉጠ
  choice: étrange
  rationale: Le terme souligne que l’enfant est hors du commun ou autre. « Étrange » garde l’inquiétude du locuteur sans décider si cette différence est admirable ou monstrueuse.
- source_word: አኮኑ ከመ ሰብእ
  choice: il ne ressemble pas à un être humain
  rationale: La comparaison oppose l’enfant à l’humanité ordinaire. « Être humain » évite de restreindre inutilement le sens aux personnes de sexe masculin.
- source_word: ወይመ ስል
  choice: mais plutôt
  rationale: Cette expression introduit une comparaison corrective et fortement contrastive; « mais plutôt » rend naturellement ce mouvement en français.
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: les enfants des anges du ciel
  rationale: La formulation filiale explicite est maintenue au lieu d’être réduite à « des anges » ou « des êtres angéliques ».
- source_word: ፍጥረቱ ካልእት
  choice: sa nature est différente
  rationale: Le nom peut évoquer la création, la forme ou la constitution d’un être. « Nature » reste clair tout en conservant la portée ontologique possible du propos.
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: ses yeux sont comme les rayons du soleil
  rationale: La comparaison porte sur la lumière émise par le soleil. « Rayons du soleil » préserve l’image vive et demeure naturel en français.
- source_word: ገጹ ስቡሕ
  choice: son visage est glorieux
  rationale: L’adjectif peut exprimer la gloire, l’honneur ou la splendeur. « Glorieux » maintient le ton élevé et ne tranche pas entre éclat visible et dignité.
theological_decisions:
- issue: Faut-il atténuer « les enfants des anges du ciel » en une simple apparence angélique ?
  choice: Conserver dans le texte l’expression familiale « les enfants des anges du ciel ».
  alternative: « aux anges du ciel » ou « à des êtres angéliques »
  rationale: Le guèze emploie explicitement une expression filiale, dans un contexte où l’origine anormale de l’enfant suscite l’inquiétude. L’atténuer supprimerait une tension narrative et théologique réelle.
- issue: Faut-il rendre ሰብእ par « homme » ou par une expression générique ?
  choice: « être humain »
  alternative: « homme »
  rationale: Le contraste concerne l’humanité ordinaire en général, et non spécifiquement les êtres humains de sexe masculin.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est légèrement resserrée pour éviter une succession lourde de coordinations, sans supprimer les répétitions significatives sur la différence de l’enfant. Les images apocalyptiques et l’ambiguïté concernant son origine sont maintenues.
