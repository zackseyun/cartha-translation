base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: fr
  text: En lui demeure l’esprit de sagesse[a], l’esprit qui donne l’intelligence[b], l’esprit d’instruction et de puissance, et l’esprit de ceux qui dorment dans la justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi se traduire par « habite » ou « séjourne »; il exprime ici une présence durable.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esprit d’intelligence ». L’expression peut désigner soit un esprit caractérisé par l’intelligence, soit un esprit qui la communique.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ceux qui dorment dans la justice ». Il s’agit probablement des justes morts, mais on peut aussi comprendre « ceux qui reposent dans la justice ».
    reason: alternative_reading
lexical_decisions:
- source_word: የኃድር
  choice: demeure
  rationale: L’imparfait exprime ici un état présent ou continu. « Demeure » rend l’idée d’habiter durablement sans transformer le verbe en passé accompli.
- source_word: ቦቱ
  choice: en lui
  rationale: La préposition indique ici l’intériorité ou la présence en quelqu’un, plutôt que « sur lui ».
- source_word: መንፈሰ
  choice: esprit
  rationale: Dans cette série de qualités ou de dons, « esprit » conserve le sens religieux et charismatique du terme.
- source_word: ጥበብ
  choice: sagesse
  rationale: Le mot désigne ici la sagesse morale et intellectuelle; « sagesse » est le terme français naturel et consacré.
- source_word: ዘያሌቡ
  choice: qui donne l’intelligence
  rationale: La tournure semble décrire l’effet produit par l’esprit plutôt qu’une simple qualité abstraite; cette formulation préserve la force verbale.
- source_word: ትምህርት
  choice: instruction
  rationale: « Instruction » couvre l’idée d’enseignement transmis tout en restant compact dans l’énumération.
- source_word: ኃይል
  choice: puissance
  rationale: « Puissance » convient au registre élevé du passage et rend une capacité agissante, sans archaïsme.
- source_word: እለ ኖሙ በጽድቅ
  choice: ceux qui dorment dans la justice
  rationale: La traduction littérale conserve l’image apocalyptique du sommeil, probablement appliquée aux justes morts, sans expliciter ce que le texte laisse implicite.
theological_decisions:
- issue: Sens de la dernière expression relative à l’esprit
  choice: « l’esprit de ceux qui dorment dans la justice »
  alternative: « l’esprit de ceux qui reposent dans la justice » ou « l’esprit des justes morts »
  rationale: Le sommeil évoque probablement la mort des justes dans ce contexte apocalyptique. Garder l’image du sommeil préserve toutefois l’ambiguïté et évite d’imposer une explicitation doctrinale.
- issue: Lieu où demeure l’esprit
  choice: « en lui demeure »
  alternative: « sur lui repose »
  rationale: Le texte éthiopien comporte une préposition signifiant « en lui » et un verbe à valeur présente ou continue. La traduction suit cette syntaxe plutôt que la formule prophétique familière « sur lui repose ».
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « l’esprit » conserve le rythme solennel de l’énumération. « Puissance » a été préféré à « force » pour le registre, tandis que les notes maintiennent les ambiguïtés lexicales et apocalyptiques du texte source.
