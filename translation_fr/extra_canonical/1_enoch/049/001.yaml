  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: fr
  text: Car la sagesse a été répandue comme de l’eau[a], et la gloire ne prendra pas fin devant lui[b], pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’est répandue comme de l’eau ».'
    reason: alternative aspectuelle et lexicale
  - marker: b
