    reason: ambiguïté du référent
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit l’explication ou le fondement de ce qui précède, dans un français naturel et digne.
- source_word: ጥበብ
  choice: la sagesse
  rationale: Sens courant du terme, adapté au registre sapientiel et révélatoire sans ajout interprétatif.
- source_word: ክዕወ
  choice: a été répandue
  rationale: Rend l’accompli guèze et conserve l’image d’une effusion abondante; évite de le transformer en futur.
- source_word: ከመ፡ ማይ
  choice: comme de l’eau
  rationale: Reproduit directement la comparaison du texte source.
- source_word: ወስብሐት
  choice: et la gloire
  rationale: « Gloire » convient au registre céleste et préserve la gamme de sens liée à la splendeur et à la louange.
- source_word: ኢትኃልቅ
  choice: ne prendra pas fin
  rationale: Exprime clairement l’idée de ne pas cesser ou s’épuiser, tout en marquant la différence aspectuelle avec l’accompli précédent.
- source_word: ቅድሜሁ
  choice: devant lui
  rationale: Traduction formelle qui conserve la relation spatiale et ne précise pas l’antécédent du pronom.
- source_word: ለዓለመ፡ ዓለም
  choice: pour toujours et à jamais
  rationale: Formule française idiomatique et solennelle qui rend l’expression intensive de durée perpétuelle.
theological_decisions:
- issue: Référent de « lui » dans « devant lui »
  choice: Conserver le pronom masculin sans identifier son référent.
  alternative: « devant le Seigneur des Esprits » ou « devant l’Élu / le Fils de l’homme »
  rationale: Le verset guèze ne donne ici qu’un pronom. Le contexte plus large peut suggérer une figure précédemment mentionnée, mais préciser laquelle résoudrait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de l’eau, la distinction entre l’accompli de la première proposition et la non-cessation exprimée dans la seconde, ainsi que l’ambiguïté du pronom.
