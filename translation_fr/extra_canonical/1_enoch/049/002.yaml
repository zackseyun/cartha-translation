base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: fr
  text: Car il est puissant dans toutes les réalités cachées de la justice[a], et l’iniquité passera comme une ombre et ne subsistera pas[b] ; car l’Élu[c] se tient[d] devant le Seigneur des esprits, sa gloire est à tout jamais, et sa puissance de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secrets de la justice ». L’expression guèze peut désigner des réalités cachées ou des secrets qui appartiennent à la justice.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, l’expression nie à l’iniquité le fait de tenir ou de demeurer ; autre traduction possible : « n’aura aucune permanence ».'
    reason: lexical_alternative
  - marker: c
    text: « L’Élu » est un titre récurrent dans les Paraboles de 1 Hénoch pour la figure exaltée associée au jugement et à la réhabilitation des justes.
    reason: cross_reference
  - marker: d
    text: Ou « s’est tenu ». La forme guèze peut présenter une posture établie dont l’effet se poursuit au présent.
    reason: aspectual_alternative
lexical_decisions:
- source_word: ኃያል
  choice: puissant
  rationale: Exprime la force ou la puissance. « Puissant » convient au registre apocalyptique sans aller au-delà du guèze.
- source_word: ኅቡአተ ጽድቅ
  choice: secrets de la justice
  rationale: Le pluriel désigne des réalités cachées ou secrètes appartenant à la justice. « Secrets » donne un français naturel tout en conservant l’idée de dissimulation.
- source_word: ዓመፃ
  choice: iniquité
  rationale: Le terme couvre la transgression, l’injustice et parfois la violence. « Iniquité » maintient ici l’opposition générale avec la justice sans la réduire à la seule violence physique.
- source_word: ጽላሎት የኃልፍ
  choice: passera comme une ombre
  rationale: Conserve l’image concrète et la valeur prospective du contexte de jugement.
- source_word: ምቅዋመ አልቦ
  choice: ne subsistera pas
  rationale: L’expression nie littéralement le fait de tenir ou de demeurer. « Ne subsistera pas » rend naturellement l’absence de durée ou de permanence.
- source_word: ኅሩይ
  choice: l’Élu
  rationale: Dans les Paraboles, le mot fonctionne comme le titre récurrent d’une figure exaltée. « L’Élu » est clair, sobre et traditionnel en français biblique.
- source_word: ቆመ
  choice: se tient
  rationale: Avec un verbe de posture, la forme parfaite peut exprimer un état présent continu. « Se tient » rend cette valeur stative sans suggérer une action passée achevée.
- source_word: እግዚአ መናፍስት
  choice: Seigneur des esprits
  rationale: Conserve le titre divin caractéristique de 1 Hénoch et sa formulation naturelle en français.
- source_word: ስብሐቲሁ
  choice: sa gloire
  rationale: « Gloire » correspond au registre biblique et apocalyptique de la formule d’éternité.
- source_word: ለዓለመ ዓለም
  choice: à tout jamais
  rationale: Formule française idiomatique exprimant la durée perpétuelle.
- source_word: ለትውልደ ትውልድ
  choice: de génération en génération
  rationale: Reproduit fidèlement la formule distributive du texte source.
theological_decisions:
- issue: 'Valeur de ኅሩይ : titre ou simple adjectif descriptif'
  choice: Titre « l’Élu », avec majuscule
  alternative: « celui qui a été choisi » ou « l’élu » au sens descriptif
  rationale: Le terme désigne de façon récurrente une figure exaltée dans les Paraboles. La majuscule signale cette fonction titulaire sans identifier explicitement la figure selon une doctrine postérieure.
- issue: Aspect de ቆመ devant le Seigneur des esprits
  choice: « se tient »
  alternative: « s’est tenu » ou « s’est présenté »
  rationale: Le parfait d’un verbe de posture peut décrire un état présent. Le présent français préserve la présence continue de l’Élu devant le Seigneur des esprits.
- issue: Étendue sémantique de ዓመፃ
  choice: « iniquité »
  alternative: « violence », « injustice » ou « transgression de la loi »
  rationale: Le passage oppose largement la justice à son contraire. « Iniquité » préserve cette tension morale sans limiter le mot à une forme particulière de mal.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le parallélisme apocalyptique, les titres propres au livre et les formules de durée, tout en évitant les tournures inutilement archaïques.
