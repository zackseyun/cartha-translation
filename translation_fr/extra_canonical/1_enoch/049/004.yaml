base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: fr
  text: Et il jugera les choses cachées, et personne ne pourra prononcer devant lui une parole vaine[a], car il est l’Élu devant le Seigneur des esprits, comme il l’a voulu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole mensongère ». La formulation guèze de ce témoin est difficile et peut évoquer une parole vide, vaine ou fausse.
    reason: textual_variant
  - marker: b
    text: Le pronom renvoie probablement au Seigneur des esprits, mais le texte peut grammaticalement paraître ambigu.
    reason: ambiguity
lexical_decisions:
- source_word: ይኴንን
  choice: il jugera
  rationale: Le verbe exprime ici l’action de juger ou de rendre une décision. Le futur convient au contexte eschatologique et à la suite de la proposition.
- source_word: ዘኅቡአተ
  choice: les choses cachées
  rationale: Cette expression désigne ce qui est caché ou dissimulé. La traduction conserve la portée apocalyptique sans préciser indûment s’il s’agit de secrets, d’actes ou de réalités invisibles.
- source_word: ወነገረ፡ በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: et personne ne pourra prononcer devant lui une parole vaine
  rationale: La tournure du témoin est difficile, mais elle nie qu’une parole vide, vaine ou mensongère puisse être dite devant l’Élu. « Parole vaine » maintient l’image littérale et laisse ouverte sa nuance morale.
- source_word: ኅሩይ
  choice: l’Élu
  rationale: Dans les Paraboles, le terme fonctionne comme le titre récurrent d’une figure eschatologique. La majuscule marque cette fonction titulaire sans imposer une identification doctrinale ultérieure.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette formulation rend directement le titre divin caractéristique de 1 Hénoch et reste naturelle en français.
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: comme il l’a voulu
  rationale: La formulation française conserve la brièveté du guèze ainsi que l’ambiguïté grammaticale du pronom, dont le référent le plus proche est le Seigneur des esprits.
theological_decisions:
- issue: Statut et capitalisation de ኅሩይ
  choice: l’Élu
  alternative: celui qui a été choisi
  rationale: Le mot est employé comme un titre dans ce contexte apocalyptique. « L’Élu » le signale sans l’assimiler explicitement à une figure définie par une tradition postérieure.
- issue: Référent de « il » dans la proposition finale
  choice: 'conserver le pronom : « comme il l’a voulu »'
  alternative: 'expliciter : « comme le Seigneur des esprits l’a voulu »'
  rationale: Le Seigneur des esprits est probablement le référent, mais le texte source emploie un pronom. Le conserver évite de résoudre silencieusement une légère ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du guèze tout en évitant une tournure artificielle. « L’Élu » et « le Seigneur des esprits » sont traités comme des titres propres au cadre apocalyptique de 1 Hénoch.
