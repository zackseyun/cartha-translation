base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: fr
  text: Après cela, pendant la sixième semaine, tous ceux qui s’y trouveront seront aveugles[a], et leurs cœurs oublieront la sagesse. Pendant cette semaine, un homme montera[b]. À son terme, la maison du royaume[c] sera brûlée par le feu, et, pendant cette semaine, toute la lignée de la racine choisie[d] sera dispersée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront obscurcis ». L’image évoque vraisemblablement un aveuglement moral ou spirituel.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’élèvera » ou « surgira ». Le verbe peut désigner une montée ou une élévation ; le texte ne précise ni la nature de cette montée ni l’identité de l’homme.
    reason: lexical_alternative
  - marker: c
    text: La « maison du royaume » peut désigner plus largement la dynastie ou l’ordre royal, et pas seulement un bâtiment.
    reason: lexical_alternative
  - marker: d
    text: L’expression associe l’idée d’une lignée à l’image végétale d’une « racine choisie » ; elle peut évoquer une lignée élue ou un reste élu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: la sixième semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période symbolique. « Semaine » est clair en français tout en conservant cette périodisation apocalyptique.
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: tous ceux qui s’y trouveront seront aveugles
  rationale: La formulation décrit l’état des personnes appartenant à cette période. « Aveugles » conserve l’image, probablement morale ou spirituelle, sans l’expliciter dans le corps du texte.
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: leurs cœurs oublieront la sagesse
  rationale: Cette traduction directe préserve à la fois le langage du cœur et l’écho à la tradition de sagesse.
- source_word: ባቲ የዓርግ ብእሲ
  choice: pendant cette semaine, un homme montera
  rationale: « Montera » garde le sens concret d’élévation tout en laissant ouverte la possibilité d’une ascension, d’une montée en puissance ou d’une apparition éminente.
- source_word: ቤተ መንግሥት
  choice: la maison du royaume
  rationale: La traduction reste proche du guèze et ne tranche pas entre un édifice, une dynastie et l’institution royale.
- source_word: ይውዒ ... በእሳት
  choice: sera brûlée par le feu
  rationale: Formulation naturelle et vigoureuse qui conserve explicitement l’image du jugement par le feu.
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: toute la lignée issue de la racine choisie
  rationale: « Lignée » rend l’élément généalogique, tandis que « racine choisie » maintient l’image végétale et le langage de l’élection. « Issue de » relie naturellement les deux images en français.
theological_decisions:
- issue: Identité de l’homme qui monte
  choice: La figure demeure simplement « un homme » et le verbe est rendu par « montera ».
  alternative: L’identifier à un chef historique, à un prêtre ou à une figure messianique et exaltée.
  rationale: Le texte guèze ne le nomme pas et ce verset ne permet pas de fixer son identité ni la nature exacte de sa montée.
- issue: Sens de « maison du royaume »
  choice: Conserver l’expression « maison du royaume ».
  alternative: Préciser « dynastie royale », « palais » ou « temple lié au royaume ».
  rationale: L’expression peut viser un bâtiment, une lignée ou l’ordre royal dans son ensemble; une formulation plus précise supprimerait cette ambiguïté.
- issue: Portée de « racine choisie »
  choice: Conserver le langage de l’élection et la métaphore de la racine sans leur attribuer un référent ultérieur déterminé.
  alternative: Y voir explicitement le reste élu, une branche choisie ou une figure messianique.
  rationale: Le verset associe lignée et racine, mais n’identifie pas cette image à un individu précis.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition lourde de « en elle » a été rendue par des repères temporels explicites (« pendant cette semaine », « à son terme »), sans changer le référent. Les images d’aveuglement, de montée, de maison royale et de racine choisie restent volontairement ouvertes.
