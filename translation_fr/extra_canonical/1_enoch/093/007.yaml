base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: fr
  text: Après cela, à l’achèvement de la cinquième semaine[a], la maison de gloire et de royauté[b] sera bâtie pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Apocalypse des semaines, une « semaine » représente une période symbolique de la vision historique d’Hénoch, et non nécessairement une période littérale de sept jours.
    reason: cultural_note
  - marker: b
    text: 'Autre lecture possible : « la maison de gloire et le royaume seront bâtis pour toujours », si « royaume » est compris comme un second élément coordonné plutôt que comme une caractéristique de la maison.'
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረዝ
  choice: après cela
  rationale: Cette formule de transition temporelle marque clairement le passage à l’étape suivante de la vision.
- source_word: ኃምስ ሰንበት
  choice: la cinquième semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période organisée selon un schéma de semaines, plutôt qu’un jour de sabbat littéral.
- source_word: በተፍጻሜታ
  choice: à son terme
  rationale: Le suffixe renvoie à la cinquième semaine. Cette formulation exprime son arrivée à l’achèvement sans alourdir la phrase.
- source_word: ቤተ ስብሐት
  choice: la maison de gloire
  rationale: « Maison » conserve l’image concrète, probablement sanctuariale, tandis que « gloire » rend ici le sens sacré et exalté de ስብሐት.
- source_word: መንግሥት
  choice: royauté
  rationale: Le mot peut désigner le royaume ou la royauté. « Royauté » s’accorde naturellement avec « gloire » comme qualité ou réalité associée à la maison, sans imposer l’idée d’un territoire.
- source_word: ይትሐነጽ
  choice: sera bâtie
  rationale: Le sens passif concret de construction convient au substantif « maison » et maintient l’imagerie architecturale.
- source_word: እስከ ለዓለም
  choice: pour toujours
  rationale: Cette expression française actuelle et digne rend l’idée de permanence perpétuelle.
theological_decisions:
- issue: La relation syntaxique entre « maison », « gloire » et « royauté »
  choice: Une seule maison qualifiée par la gloire et la royauté
  alternative: « la maison de gloire et le royaume seront bâtis pour toujours »
  rationale: La construction se lit le plus naturellement comme une seule maison liée aux deux noms suivants, mais une coordination de la maison et du royaume demeure possible et est signalée en note afin de préserver l’ambiguïté.
- issue: La nature de la « maison »
  choice: Conserver l’image non explicitée de la maison
  alternative: Préciser qu’il s’agit du Temple ou d’un sanctuaire eschatologique
  rationale: Le texte dit « maison » sans nommer explicitement le Temple. La traduction évite donc de résoudre l’image apocalyptique par une explicitation doctrinale.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe reste proche du guèze tout en évitant une tournure artificielle; « au cours de » rend naturellement la localisation dans la cinquième semaine.
