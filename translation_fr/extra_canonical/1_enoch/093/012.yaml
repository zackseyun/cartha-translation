base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: fr
  text: Et qui peut contempler le ciel ? Qui peut comprendre les œuvres du ciel ? Qui peut voir une âme — ou, sinon[a], un esprit — et en parler ? Ou encore monter et voir toutes leurs extrémités[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation « voir une âme — ou, sinon, un esprit » est difficile sur les plans syntaxique et sémantique. Elle conserve l’alternative du texte guèze sans décider si « esprit » corrige, précise ou constitue simplement une autre possibilité par rapport à « âme ». « Esprit » pourrait aussi être rendu par « souffle ».
    reason: textual_variant
  - marker: b
    text: L’expression finale est incertaine. Elle peut désigner « toutes leurs extrémités » ou « toutes leurs limites » ; plus littéralement, le dernier mot peut aussi évoquer leurs « ailes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት ውእቱ ዘይክል
  choice: qui peut
  rationale: Formulation française naturelle d’une question rhétorique portant sur la capacité humaine.
- source_word: ነጽሮተ ሰማይ
  choice: contempler le ciel
  rationale: ነጽሮተ est ici l’infinitif construit du verbe « regarder, contempler », et non un nom signifiant « réserves ».
- source_word: አእምሮ ግብረ ሰማይ
  choice: comprendre les œuvres du ciel
  rationale: Conserve le sens cognitif du verbe et l’expression cosmique « œuvres du ciel ».
- source_word: ከመ ይርአይ ነፍሰ
  choice: voir une âme
  rationale: Maintient la formulation abrupte et difficile du guèze sans la paraphraser.
- source_word: ወእመ አኮ መንፈሰ
  choice: ou plutôt un esprit
  rationale: Rend l’alternative ou la correction portée par l’expression difficile, tout en signalant en note que la syntaxe reste incertaine.
- source_word: ወይክል ነጊረ
  choice: et en parler
  rationale: Français courant pour l’idée de pouvoir rapporter ou déclarer ce qui a été perçu.
- source_word: ወእመ አኮ ዐሪገ
  choice: ou encore monter
  rationale: Traite እመ አኮ comme l’idiome « ou bien / ou encore » et préserve le motif de l’ascension.
- source_word: ኵሎ አክናፊሆሙ
  choice: toutes leurs extrémités
  rationale: « Extrémités » donne un sens contextuellement plausible tout en évitant de dissimuler la difficulté du terme, qui peut littéralement évoquer des ailes.
theological_decisions:
- issue: Rapport entre ነፍሰ et መንፈሰ
  choice: Les rendre distinctement par « âme » et « esprit ».
  alternative: « vie » et « souffle », ou fusionner les deux termes comme quasi-synonymes.
  rationale: Le texte juxtapose deux termes apparentés sans expliquer leur rapport ; la traduction préserve cette tension anthropologique au lieu d’imposer un système doctrinal.
translation_notes:
  register: Français international moderne, digne et direct. Les questions rhétoriques sont resserrées pour rester naturelles ; les difficultés concernant « âme / esprit » et l’expression finale sont conservées et documentées.
