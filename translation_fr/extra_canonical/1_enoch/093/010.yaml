base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: fr
  text: Et à son achèvement, les justes choisis seront sélectionnés parmi la plante éternelle de justice[b] ; il leur sera donné l’enseignement septuple[a] concernant toute sa création.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sept enseignements » ou « les sept sortes d’enseignement ». La tournure guèze est difficile, et le nombre peut désigner un ensemble complet d’enseignement en sept parties.
    reason: lexical_alternative
  - marker: b
    text: L’expression « plante éternelle de justice » conserve l’image agricole du texte ; on pourrait aussi traduire « plantation éternelle de justice ».
    reason: cultural_note
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: à son achèvement
  rationale: La locution marque le terme de la période précédente sans préciser davantage l’antécédent du possessif.
- source_word: ይትኃረዩ
  choice: seront sélectionnés
  rationale: Le passif exprime le fait d’être choisis ou distingués. « Sélectionnés » évite de répéter « choisis », qui traduit déjà ኅሩያን.
- source_word: ኅሩያን ጻድቃን
  choice: les justes choisis
  rationale: Les deux qualificatifs sont conservés. Cet ordre est naturel en français tout en maintenant ensemble les notions de justice et d’élection.
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: parmi la plante éternelle de justice
  rationale: « Plante » préserve l’image agricole concrète. Dans ce contexte de sélection au sein d’un ensemble, « parmi » rend naturellement la provenance exprimée par እም.
- source_word: ይትወሀብ ሎሙ
  choice: à eux sera donnée
  rationale: Le passif et le datif du guèze sont maintenus dans une formulation française solennelle et claire.
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: l’instruction septuple
  rationale: La construction est difficile ; cette traduction comprend le nombre comme qualifiant un corps complet d’instruction, sans masquer les autres analyses possibles.
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: concernant toute sa création
  rationale: La préposition est comprise comme indiquant le domaine de l’instruction, et « création » rend le sens collectif de ፍጥረት.
theological_decisions:
- issue: Rapport entre élection et justice
  choice: les justes choisis
  alternative: les élus justes
  rationale: Les deux notions restent distinctes mais associées, sans introduire le vocabulaire spécialisé de débats doctrinaux ultérieurs.
- issue: Image agricole désignant l’origine du groupe
  choice: la plante éternelle de justice
  alternative: la plantation éternelle de justice
  rationale: Le choix conserve l’image apocalyptique de croissance plutôt que de la remplacer par une abstraction comme « communauté » ou « fondement ».
- issue: Référent du possessif final
  choice: sa création
  alternative: la création qui lui appartient
  rationale: Le possessif du texte est conservé sans expliciter son référent, préservant ainsi l’ambiguïté grammaticale disponible.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le mouvement solennel du verset, tandis que le point-virgule évite une relative lourde. Les images et ambiguïtés significatives du guèze sont maintenues.
