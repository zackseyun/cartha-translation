base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: fr
  text: Après moi, pendant la deuxième semaine[a], un grand mal surgira, et la tromperie y germera. En elle surviendra la première fin, et en elle un homme sera sauvé[b]. Après qu’elle aura été achevée, l’injustice s’accroîtra[d], et une loi sera établie pour les pécheurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « deuxième semaine » appartient à la structure symbolique de l’Apocalypse des semaines; il ne s’agit pas nécessairement d’une période littérale de sept jours.
    reason: cultural_note
  - marker: b
    text: Le texte dit au singulier « un homme ». Beaucoup y voient une allusion à Noé, mais le verset ne le nomme pas.
    reason: cross_reference
  - marker: c
    text: Ou « une ordonnance sera édictée pour les pécheurs ». Le guèze peut désigner une loi établie pour eux, à leur sujet, voire contre eux.
    reason: lexical_alternative
  - marker: d
    text: L’expression guèze transmise ici est difficile. On peut aussi comprendre que la violence ou la rébellion augmentera.
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: ይቀውም
  choice: surgira
  rationale: Le verbe signifie couramment « se tenir » ou « surgir ». Ici, « surgira » exprime naturellement l’apparition d’une réalité nouvelle dans la succession des périodes.
- source_word: እምድኅሬየ
  choice: après moi
  rationale: Le sens temporel convient à l’enchaînement historique de l’Apocalypse des semaines.
- source_word: በካልእት ሰንበት
  choice: pendant la deuxième semaine
  rationale: « Pendant » rend clairement le cadre temporel; la semaine est ici une période symbolique.
- source_word: ዐቢይ እኩይ
  choice: un grand mal
  rationale: Cette formulation conserve la vigueur du langage moral et apocalyptique sans préciser indûment la nature du mal.
- source_word: ትሕሱት
  choice: la tromperie
  rationale: Le terme recouvre la fausseté et la duperie; « tromperie » convient au contexte de corruption morale.
- source_word: በቀለት
  choice: germera
  rationale: Le verbe évoque la germination ou la croissance végétale; « germera » préserve cette image organique.
- source_word: ቀዳሚት ፍጻሜ
  choice: la première fin
  rationale: Cette traduction formelle maintient le caractère schématique du jalon apocalyptique et n’en impose pas une interprétation particulière.
- source_word: ይድኅን ብእሲ
  choice: un homme sera sauvé
  rationale: Le singulier est conservé. « Sauvé » exprime la délivrance sans identifier le personnage ni importer une formulation doctrinale ultérieure.
- source_word: ተፈጸመ
  choice: sera achevée
  rationale: Le féminin renvoie clairement à la semaine et conserve la succession temporelle du texte.
- source_word: ትእህቱ ዓመፃ
  choice: l’injustice s’accroîtra
  rationale: La transmission de cette expression est difficile; ce rendu garde le sens général d’une augmentation du désordre moral sans le réduire à la seule violence ou rébellion.
- source_word: ሥርዐት
  choice: une loi
  rationale: Le nom peut désigner un ordre, une règle ou une ordonnance. « Loi » préserve ici la formulation frappante et normative.
- source_word: ይትገበር ለኃጥኣን
  choice: sera établie pour les pécheurs
  rationale: La tournure passive est respectée. « Pour » conserve l’ambiguïté de la relation aux pécheurs, qui pourrait aussi être comprise comme « à leur sujet » ou « contre eux ».
theological_decisions:
- issue: Identité de l’homme sauvé
  choice: Conserver « un homme sera sauvé » sans le nommer.
  alternative: Identifier explicitement cet homme à Noé, ou comprendre le singulier comme désignant collectivement l’humanité.
  rationale: Le contexte peut évoquer Noé, mais le verset ne le nomme pas. Le maintien du singulier respecte la réserve du texte.
- issue: Portée de la loi établie pour les pécheurs
  choice: Traduire littéralement qu’une loi sera établie « pour les pécheurs ».
  alternative: « Une ordonnance sera édictée contre les pécheurs » ou « un jugement sera fixé pour les pécheurs ».
  rationale: Le guèze permet plusieurs nuances. Le texte principal ne transforme donc pas cette loi en jugement punitif explicite; l’ambiguïté est signalée en note.
- issue: Nature de la « première fin »
  choice: Maintenir l’expression « la première fin » sans l’expliciter.
  alternative: « Le premier accomplissement » ou une identification historique précise.
  rationale: L’expression appartient au schéma apocalyptique et son référent ne doit pas être fixé au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « en elle » conserve le rythme et la structure du guèze, tandis que « y germera » rend naturellement la métaphore végétale. Les formulations apocalyptiques « première fin » et « un homme sera sauvé » restent volontairement non interprétées.
