revisions:
- from: 'Hénoch dit : « Au sujet des enfants de la justice, des choisis du monde[a] et de la plante de la droiture, je vous parlerai et je vous ferai connaître, mes enfants — moi, Hénoch —, ce qui m’a été montré à partir d’une vision du ciel, ce que j’ai appris de la parole des saints anges et ce que j’ai compris d’après les tablettes du ciel[b]. »'
  to: 'Hénoch dit : « Au sujet des enfants de la justice, des choisis du monde[a] et de la plante de la droiture, je vous parlerai de ces choses et je vous les ferai connaître, mes enfants — moi, Hénoch — : ce qui m’a été montré par le moyen d’une vision du ciel, ce que j’ai appris de la parole des saints anges et ce que j’ai compris d’après les tablettes du ciel[b]. »'
