base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: fr
  text: 'Hénoch dit : « Au sujet des enfants de la justice, des choisis du monde[a] et de la plante de la droiture, je vous parlerai de ces choses et je vous les ferai connaître, mes enfants — moi, Hénoch — : ce qui m’a été montré par le moyen d’une vision du ciel, ce que j’ai appris de la parole des saints anges et ce que j’ai compris d’après les tablettes du ciel[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des choisis de l’âge » : ዓለም peut désigner le monde, mais aussi un âge ou l’ordre du monde.'
    reason: lexical_alternative
  - marker: b
    text: L’expression évoque les registres célestes fréquents dans 1 Hénoch ; elle peut aussi se comprendre plus généralement comme les écrits ou les livres du ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: enfants de la justice
  rationale: Conserve la métaphore familiale et le complément abstrait sans réduire l’expression à « les justes ».
- source_word: ኅሩያነ፡ ዓለም
  choice: choisis du monde
  rationale: Rend directement l’expression guèze dans un français courant; la possibilité que ዓለም désigne l’âge ou l’ordre du monde est signalée en note.
- source_word: ተክለ፡ ርትዕ
  choice: plante de la droiture
  rationale: Préserve l’image végétale propre au langage apocalyptique ainsi que la nuance de rectitude de ርትዕ.
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: je vous parlerai et je vous ferai connaître
  rationale: Maintient les deux actes, parole et communication d’une connaissance, sans alourdir la phrase française par un objet redondant.
- source_word: ደቂቅየ
  choice: mes enfants
  rationale: Forme naturelle et inclusive en français moderne, tout en conservant l’adresse familiale.
- source_word: በዘ፡ አስተርአየኒ፡ እምራእየ፡ ሰማይ
  choice: ce qui m’a été montré à partir d’une vision du ciel
  rationale: Respecte la valeur de provenance de እም et conserve l’expression « vision du ciel » sans la transformer silencieusement en simple localisation.
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት፡ አእመርኩ
  choice: ce que j’ai appris de la parole des saints anges
  rationale: Le singulier « parole » correspond au singulier construit ቃለ; « appris » exprime ici l’acquisition de connaissance transmise par les anges.
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ፡ ለበውኩ
  choice: ce que j’ai compris d’après les tablettes du ciel
  rationale: Conserve l’image concrète des archives célestes et distingue la compréhension de la simple audition.
theological_decisions:
- issue: Rapport entre les trois désignations des justes
  choice: Conserver trois expressions parallèles sans préciser si elles désignent un seul groupe ou plusieurs groupes.
  alternative: Les fondre en une désignation générale telle que « les justes » ou les présenter comme trois catégories distinctes.
  rationale: Le texte juxtapose « enfants de la justice », « choisis du monde » et « plante de la droiture » sans définir leur rapport exact.
- issue: Sens de ኅሩያነ፡ ዓለም
  choice: choisis du monde
  alternative: choisis de l’âge
  rationale: ዓለም peut évoquer le monde, l’âge ou l’ordre du monde. Le texte principal retient le sens direct le plus accessible et la note préserve l’autre lecture.
- issue: Médiation de la révélation
  choice: 'Maintenir les trois sources ou voies de connaissance : vision du ciel, parole des saints anges et tablettes du ciel.'
  alternative: Les harmoniser en une seule expérience révélatrice ou expliquer leur relation doctrinale.
  rationale: Le parallélisme du guèze laisse subsister la relation exacte entre ces formes de révélation.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions structurantes et les images apocalyptiques sont conservées; « choisis » est préféré à « élus » afin d’éviter une coloration doctrinale inutile. Tous les appels de note figurent dans le texte.
