base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: fr
  text: Après cela, au cours de la septième semaine[a], se lèvera une génération égarée, dont les œuvres seront nombreuses, et toutes ses œuvres ne seront qu’égarement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au septième sabbat ». Dans cette vision, le mot désigne la septième période symbolique, conçue comme une semaine de l’histoire, et non un seul jour.'
    reason: cultural_note
  - marker: b
    text: Le terme peut aussi se traduire par « erreur », « perversion », « rébellion » ou, dans un sens religieux plus marqué, « apostasie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: la septième semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période symbolique de l’histoire, et non un seul jour de sabbat.
- source_word: ትትነሣእ
  choice: se lèvera
  rationale: Le verbe exprime l’apparition ou le surgissement; « se lèvera » convient à la succession historique de la vision.
- source_word: ትውልድ
  choice: génération
  rationale: Le terme désigne ici une génération ou une cohorte historique caractérisée moralement.
- source_word: ዕሉት
  choice: égarée
  rationale: Le mot évoque l’écart, l’erreur ou la défection. « Égarée » conserve cette amplitude sans imposer à lui seul le sens plus précis d’une apostasie formelle.
- source_word: ብዙኅ
  choice: nombreuses
  rationale: L’adjectif indique la multiplicité des œuvres et se rend naturellement ainsi en français.
- source_word: ምግባራቲሃ
  choice: ses œuvres
  rationale: « Œuvres » garde le poids moral du terme et permet de reproduire sa répétition dans le texte source.
- source_word: ዕልወት
  choice: égarement
  rationale: Le nom abstrait correspond à l’adjectif ዕሉት et peut aussi évoquer la déviation, la rébellion ou l’apostasie.
theological_decisions:
- issue: Caractère moral ou religieux de la génération et de ses œuvres
  choice: génération égarée ... égarement
  alternative: génération apostate ... apostasie
  rationale: Les termes apparentés signalent une déviation pouvant comporter une forte dimension religieuse, mais leur champ sémantique inclut aussi l’erreur, la perversion et la rébellion. Le choix principal préserve cette ambiguïté, tandis que la note indique la traduction théologiquement plus marquée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « œuvres » et le lien entre « égarée » et « égarement » reproduisent la structure lexicale du guèze; « ne seront qu’égarement » exprime naturellement la portée prédicative de la dernière proposition.
