base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: fr
  text: Car qui, parmi tous les enfants des hommes, est capable d’entendre la voix du Saint[a] sans être ébranlé ? Et qui est capable de saisir sa pensée[b] ? Et qui est capable de contempler toutes les œuvres du ciel[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom guèze traduit par « voix » peut aussi signifier « parole » ou « discours » : « entendre la parole du Saint ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression associe le verbe « penser » au nom « pensée ». Le pronom de « sa pensée » peut être compris comme renvoyant au Saint (« saisir la pensée du Saint ») ou à l’être humain interrogé (« concevoir dans son esprit »).
    reason: textual_ambiguity
  - marker: c
    text: Les « œuvres du ciel » peuvent désigner largement ses opérations, ses structures ou ses phénomènes ordonnés, et pas seulement les objets visibles dans le ciel.
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit l’énoncé comme fondement explicatif tout en conservant la force rhétorique du passage.
- source_word: ውሉደ ሰብእ
  choice: les enfants des hommes
  rationale: Conserve l’expression sémitique désignant l’humanité et le registre élevé du texte, sans lui donner la valeur d’un titre ultérieur.
- source_word: ዘይክል
  choice: est capable de
  rationale: Reproduit clairement la structure répétée qui interroge les limites des capacités humaines.
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: entendre la voix du Saint
  rationale: ቃል peut désigner la voix, la parole ou l’énoncé ; après « entendre », « voix » est naturel. « le Saint » rend ቅዱስ comme titre divin dans ce contexte.
- source_word: ወኢይትሀወክ
  choice: sans être ébranlé
  rationale: Exprime le bouleversement intérieur provoqué par la voix divine sans le réduire à une émotion précise.
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: saisir sa pensée
  rationale: 'Rend l’idée de concevoir ou comprendre une pensée tout en maintenant dans le texte français l’ambiguïté du suffixe masculin : il peut renvoyer au Saint ou, selon l’analyse syntaxique, à l’être humain évoqué par « qui ».'
- source_word: ነጽሮተ
  choice: contempler
  rationale: Convient au registre visionnaire et exprime une observation soutenue sans archaïsme.
- source_word: ምግባረ ሰማይ
  choice: les œuvres du ciel
  rationale: Préserve la portée large de ምግባር, qui peut évoquer les œuvres, les opérations ou l’ordre du ciel, sans choisir une interprétation cosmologique trop étroite.
theological_decisions:
- issue: Valeur de ለቅዱስ comme titre divin
  choice: le Saint
  alternative: le saint
  rationale: Le contexte présente un locuteur transcendant dont la voix ébranle les humains. La majuscule signale un titre divin sans importer une identification christologique ultérieure.
- issue: Référent du suffixe dans ኅሊናሁ
  choice: Conserver l’ambiguïté par « sa pensée »
  alternative: « la pensée du Saint » ou « sa propre pensée »
  rationale: La forme porte un suffixe masculin singulier, mais son référent peut être discuté. Le français permet de préserver cette tension plutôt que d’imposer silencieusement soit la pensée du Saint, soit l’intelligence propre de l’être humain.
translation_notes:
  register: Français international actuel, digne et légèrement élevé. La triple question et la répétition de « qui est capable » sont maintenues. « Enfants des hommes » conserve l’idiome ancien sans devenir obscur ; « contempler » soutient le registre visionnaire.
