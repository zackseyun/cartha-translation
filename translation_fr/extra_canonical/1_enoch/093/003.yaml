base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: fr
  text: 'Et maintenant, Hénoch se mit à parler d’après les livres[a] et dit : « Je suis né, le septième, durant la première semaine[b], alors que le jugement et la justice subsistaient encore[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « d’après les livres » présente probablement Hénoch comme tirant son discours de documents écrits, qu’il les lise ou qu’il les récite.
    reason: cultural_note
  - marker: b
    text: La « première semaine » est la première période symbolique de l’histoire dans l’Apocalypse des semaines; il ne s’agit pas nécessairement d’une semaine littérale de sept jours.
    reason: cross_reference
  - marker: c
    text: 'La forme transcrite avant « justice » est difficile. Une correction textuelle vraisemblable donne « jugement »; selon la forme transmise, on pourrait comprendre un terme comme « droiture ». La proposition entière a aussi parfois été comprise ainsi : « jusqu’au temps où le jugement et la justice subsisteront ».'
    reason: textual_variant
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: Et maintenant, Hénoch se mit à parler
  rationale: Rend naturellement le changement de scène marqué par እንከ et la construction inchoative « commencer/se mettre à parler ».
- source_word: እመጻሕፍት
  choice: d’après les livres
  rationale: La préposition indique vraisemblablement la source écrite de son discours. « D’après » est idiomatique en français tout en laissant ouverte la manière précise dont Hénoch utilise ces livres.
- source_word: ሳብዕ፡ ተወለድኩ
  choice: Je suis né, le septième
  rationale: Conserve l’ordinal qui situe Hénoch dans une suite générationnelle, sans ajouter explicitement « génération » ou « patriarche ».
- source_word: በቀዳሚት፡ ሰንበት
  choice: durant la première semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période historique symbolique plutôt qu’un seul jour de sabbat.
- source_word: እስከ፡ አመ
  choice: alors que
  rationale: Dans ce récit rétrospectif, l’expression introduit une situation concomitante qui durait encore, plutôt qu’un terme futur.
- source_word: ጽጌነ / lecture corrigée ኵነኔ
  choice: jugement
  rationale: La forme transcrite paraît être une erreur de reconnaissance pour ኵነኔ, « jugement », lecture signalée par la révision critique et cohérente avec le binôme éthique final.
- source_word: ጽድቅ
  choice: justice
  rationale: « Justice » est ici un équivalent français naturel du terme éthique ጽድቅ et forme avec « jugement » un binôme intelligible sans confondre les deux notions.
- source_word: ትዓገሠ
  choice: subsistaient encore
  rationale: Le contexte historique appelle une valeur durative passée. « Subsistaient encore » exprime la continuité de ces réalités durant la première période.
theological_decisions:
- issue: Sens de la « première semaine »
  choice: Une période symbolique de l’histoire, appelée « première semaine »
  alternative: Un sabbat littéral ou une semaine ordinaire de sept jours
  rationale: Le passage appartient à la périodisation en semaines de l’Apocalypse des semaines. La traduction conserve l’image sans l’expliciter dans le corps du texte.
- issue: Lecture du premier nom du binôme final
  choice: « le jugement et la justice »
  alternative: « la droiture et la justice » ou « la justice et la droiture » d’après la forme OCR transmise
  rationale: La révision textuelle fournie identifie ጽጌነ comme une mauvaise reconnaissance de ኵነኔ, « jugement ». Le texte principal suit cette correction, tandis qu’une note documente l’incertitude du témoin transcrit.
- issue: Valeur temporelle de la proposition finale
  choice: 'État continu dans le passé : « alors que… subsistaient encore »'
  alternative: 'Orientation future : « jusqu’au temps où… subsisteront »'
  rationale: Hénoch décrit rétrospectivement sa naissance pendant la première semaine; la valeur durative passée convient donc mieux au contexte, sans effacer l’autre analyse possible de la forme transmise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité narrative sans archaïsmes. Les virgules autour de « le septième » préservent l’ambiguïté concise de l’ordinal, et les notes signalent les principales difficultés textuelles et temporelles.
