base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: fr
  text: Après cela, durant la quatrième semaine, à son achèvement, des visions des saints et des justes[a] seront vues, et une loi pour les générations successives[b], ainsi qu’un enclos[c], seront établis pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des fidèles humains, des êtres célestes, ou garder une portée apocalyptique plus large.
    reason: ambiguïté du référent
  - marker: b
    text: Ou «un ordre» ou «une ordonnance de génération en génération».
    reason: alternative lexicale
  - marker: c
    text: Le mot guèze est difficile; il peut évoquer un jardin, une plantation ou un lieu délimité et préparé pour eux.
    reason: alternative lexicale
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Après cela
  rationale: Formule temporelle naturelle qui maintient la succession des périodes apocalyptiques.
- source_word: ራብዕት ሰንበት
  choice: la quatrième semaine
  rationale: Dans l’Apocalypse des semaines, le terme désigne une période symbolique numérotée, non un jour de sabbat.
- source_word: በተፍጻሜታ
  choice: à son achèvement
  rationale: Le suffixe renvoie à la quatrième semaine; la formulation conserve le jalon solennel du texte.
- source_word: ራእያተ ቅዱሳን ወጻድቃን
  choice: des visions des saints et des justes
  rationale: La forme construite de «visions» introduit les saints et les justes comme complément. «Saints» est ici descriptif, sans identification ecclésiale imposée.
- source_word: ይትረአይ
  choice: seront vues
  rationale: Le passif reste proche de la forme guèze et ne tranche pas entre des visions accordées à quelqu’un et des visions rendues manifestes.
- source_word: ሥርዐት
  choice: une loi
  rationale: Dans le parallèle historique et littéraire de ce passage, le mot renvoie vraisemblablement à une norme durable; la note conserve néanmoins le sens plus large d’«ordre» ou d’«ordonnance».
- source_word: ለትውልደ ትውልድ
  choice: pour les générations successives
  rationale: Cette expression française rend clairement la continuité de génération en génération.
- source_word: ዐጸድ
  choice: un enclos
  rationale: Le nom difficile évoque probablement un lieu délimité, planté ou préparé. «Enclos» garde l’image concrète sans la préciser excessivement.
- source_word: ይትገበር ሎሙ
  choice: seront établis pour eux
  rationale: Le seul verbe guèze porte sur les deux noms coordonnés. Le pluriel français respecte cette coordination, tandis qu’«établir» convient à la loi comme à l’enclos.
theological_decisions:
- issue: Identité des «saints et des justes»
  choice: La traduction maintient une désignation générale, sans préciser s’il s’agit d’êtres humains, d’êtres célestes ou des deux.
  alternative: «les êtres saints et les justes», compris explicitement comme un groupe humain fidèle
  rationale: Le contexte historique favorise un référent humain, mais le langage apocalyptique permet une portée plus large; la note préserve cette tension.
- issue: Portée de ሥርዐት
  choice: «loi», avec l’alternative «ordre» ou «ordonnance» signalée en note
  alternative: «ordre» dans un sens général d’organisation normative
  rationale: Le cadre de la quatrième semaine et le parallèle interne appuient «loi», mais le terme guèze possède une gamme sémantique plus étendue qu’il convient de ne pas masquer.
- issue: Rapport entre les visions et les saints et les justes
  choice: Les saints et les justes sont le complément de «visions».
  alternative: «des visions saintes et justes»
  rationale: La forme construite ራእያተ soutient la lecture «visions de…»; l’autre analyse est grammaticalement moins probable et n’est pas retenue dans le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la progression apocalyptique et le passif de l’original. Les notes signalent les ambiguïtés réelles sans imposer une lecture confessionnelle.
