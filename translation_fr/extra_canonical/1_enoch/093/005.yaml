base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: fr
  text: Après cela[a], pendant la troisième semaine, à son terme, un homme sera choisi comme plante d’un jugement juste[b][c] ; et après lui surgira la plante de la justice pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « troisième semaine » appartient à la suite symbolique de l’Apocalypse des semaines ; il ne s’agit pas d’une semaine ordinaire de sept jours.
    reason: cultural_note
  - marker: b
    text: Le texte ne précise pas l’identité de cet « homme ». Diverses interprétations l’ont associé à un ancêtre ou à un dirigeant juste important, mais le verset lui-même ne le nomme pas.
    reason: alternative_reading
  - marker: c
    text: L’image répétée de la « plante » peut évoquer une lignée juste, une croissance ou une communauté durable ; la traduction conserve toutefois la métaphore végétale et son ambiguïté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: la troisième semaine
  rationale: Dans le contexte de l’Apocalypse des semaines, le terme désigne une période symbolique de sept unités, et non un sabbat ou une semaine ordinaire.
- source_word: በተፍጻሜታ
  choice: à son terme
  rationale: Le suffixe renvoie à la troisième semaine et marque l’achèvement de cette période symbolique.
- source_word: ይትኃረይ
  choice: sera choisi
  rationale: Cette formulation conserve le sens passif de sélection sans introduire l’idée plus précise d’une nomination à une fonction.
- source_word: ብእሲ
  choice: un homme
  rationale: Le nom désigne ici une figure humaine singulière, que le texte ne nomme pas.
- source_word: ለተክለ
  choice: comme plante
  rationale: La construction est difficile, mais l’image végétale est explicite. « Plante » la préserve sans la réduire à un rejeton, une lignée ou une communauté.
- source_word: ኵነኔ ጽድቅ
  choice: d’un jugement juste
  rationale: Cette expression française naturelle conserve à la fois la dimension judiciaire et la qualité morale de la formule guèze.
- source_word: ይወፅእ
  choice: surgira
  rationale: Le verbe exprime une venue ou une sortie. « Surgira » convient à l’apparition annoncée et s’accorde avec l’image végétale sans ajouter explicitement « germera ».
- source_word: ለተክለ ጽድቅ
  choice: la plante de la justice
  rationale: Le génitif et la métaphore végétale sont maintenus, sans décider s’il s’agit d’une personne, d’une descendance ou d’une communauté.
- source_word: ለዓለመ ዓለም
  choice: pour toujours et à jamais
  rationale: La formule redoublée rend l’expression emphatique de perpétuité dans un français biblique clair et actuel.
theological_decisions:
- issue: Identité de l’homme choisi à la fin de la troisième semaine
  choice: Le désigner simplement comme « un homme » et signaler qu’il n’est pas nommé.
  alternative: L’identifier à Hénoch, Noé, Abraham ou à un chef juste représentatif.
  rationale: Le verset ne donne aucun nom ; la traduction conserve donc cette indétermination au lieu d’imposer une identification traditionnelle.
- issue: Portée de l’image de la plante
  choice: Conserver « plante » dans les deux propositions.
  alternative: Traduire de manière interprétative par « lignée », « descendance », « rejeton » ou « communauté ».
  rationale: Le guèze emploie explicitement une image végétale dont le référent demeure ouvert ; l’expliciter dans le texte résoudrait prématurément le symbole apocalyptique.
- issue: Relation entre l’homme choisi et le jugement juste
  choice: Rendre la construction difficile par « comme plante d’un jugement juste ».
  alternative: « pour établir un jugement juste », « comme le rejeton du juste jugement » ou « pour être une plante de justice et de jugement ».
  rationale: La formulation retenue reste proche de la syntaxe et des deux substantifs du texte, tout en évitant d’attribuer à l’homme une fonction que le guèze n’explicite pas.
translation_notes:
  register: Français international moderne, digne et lisible, avec une légère élévation adaptée au discours apocalyptique. La ponctuation distingue les deux annonces tout en conservant leur parallélisme. Tous les marqueurs de notes figurent dans le texte principal.
