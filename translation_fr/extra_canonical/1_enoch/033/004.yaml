base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: fr
  text: Il me montra tout et le mit par écrit pour moi. Puis il consigna aussi pour moi leurs noms, leurs ordres[a] et leurs groupes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs lois », « leurs prescriptions » ou « leurs commandements ». Le terme guèze peut désigner des directives faisant autorité aussi bien que des règles prescrites.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs assemblées » ou « leurs compagnies ». Il peut s’agir ici d’ensembles organisés dans la scène céleste de la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: tout
  rationale: Le terme a une portée globale et sert d’objet à ce qui est montré. « Tout » est naturel et conserve cette valeur totalisante.
- source_word: አርአየኒ
  choice: il me montra
  rationale: Cette formulation garde le caractère visuel et concret de la scène, sans ajouter l’interprétation impliquée par « révéla ».
- source_word: ጸሐፈ ሊተ
  choice: le mit par écrit pour moi / consigna pour moi
  rationale: La locution exprime une mise par écrit au bénéfice du narrateur. La variation française évite une répétition pesante tout en conservant l’acte documentaire répété.
- source_word: ወዓዲ
  choice: puis… aussi
  rationale: Cette tournure marque naturellement en français l’ajout d’un nouvel acte d’écriture; le sens peut aussi être rendu par « de nouveau ».
- source_word: አስማቲሆሙ
  choice: leurs noms
  rationale: Traduction directe du nom pluriel accompagné du suffixe possessif.
- source_word: ትእዛዞሙ
  choice: leurs ordres
  rationale: Le mot peut désigner des commandements, des instructions ou des prescriptions. « Ordres » préserve l’idée d’autorité tout en pouvant évoquer les dispositions régissant ces réalités cosmiques.
- source_word: ማኅበራቲሆሙ
  choice: leurs groupes
  rationale: Le terme désigne des rassemblements ou des ensembles organisés. « Groupes » reste clair et n’ajoute ni imagerie militaire ni hiérarchie céleste non explicitement exprimée.
theological_decisions:
- issue: La nature exacte des réalités désignées par les suffixes possessifs et leur organisation
  choice: Employer « groupes » sans identifier explicitement des rangs angéliques ou des armées célestes.
  alternative: « compagnies », « assemblées » ou « cohortes »
  rationale: Le contexte visionnaire peut évoquer des ensembles célestes ordonnés, mais le verset ne les qualifie pas explicitement d’anges ni d’armées. La traduction conserve donc cette ouverture.
- issue: Le sens cosmologique ou directif de ትእዛዞሙ
  choice: Traduire par « leurs ordres » et signaler les autres possibilités en note.
  alternative: « leurs lois », « leurs prescriptions » ou « leurs commandements »
  rationale: « Lois » ferait ressortir la régularité cosmique du contexte, tandis que « commandements » insisterait sur des directives formulées. « Ordres » maintient la tension entre disposition prescrite et commandement autoritatif.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme de l’écriture répétée est conservé, avec une légère variation lexicale naturelle. Les notes maintiennent l’ambiguïté entre commandement et réglementation cosmique, ainsi qu’entre groupes génériques et divisions célestes organisées.
