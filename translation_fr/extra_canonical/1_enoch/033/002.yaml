base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: fr
  text: Et à l’est de ces bêtes, je vis les extrémités de la terre[a], là où repose le ciel[b], ainsi que les portes ouvertes du ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les confins de la terre ». L’expression désigne les limites extrêmes du monde.
    reason: lexical_alternative
  - marker: b
    text: L’image relève d’une cosmologie ancienne dans laquelle le ciel repose aux limites du monde.
    reason: cultural_note
  - marker: c
    text: Ou « les ouvertures du ciel », voire « les fenêtres du ciel ». Le terme peut désigner diverses ouvertures dans l’architecture céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: à l’est de ces bêtes
  rationale: Cette lecture conserve la direction cardinale et le nom explicite « bêtes », conformément à l’analyse révisée de l’éthiopien, plutôt que de généraliser par « au-delà ».
- source_word: አጽናፈ ምድር
  choice: les extrémités de la terre
  rationale: « Extrémités » exprime naturellement les confins du monde dans cette géographie apocalyptique tout en conservant l’image concrète du texte.
- source_word: በኀበ ሰማይ የዐርፍ
  choice: là où repose le ciel
  rationale: Cette formulation française actuelle préserve l’image cosmologique ancienne d’un ciel reposant aux confins de la terre, sans la moderniser.
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: les portes ouvertes du ciel
  rationale: « Portes » convient à l’architecture céleste de la vision; « ouvertes » rend directement leur état, sans imposer la lecture plus précise de « fenêtres ».
theological_decisions:
- issue: Image cosmologique ancienne du ciel reposant aux extrémités de la terre
  choice: 'Conserver l’image concrète : « là où repose le ciel »'
  alternative: « là où le ciel rejoint la terre » ou « à l’horizon »
  rationale: Le passage décrit une cosmographie visionnaire. La traduction ne doit ni transformer cette image en métaphore moderne ni l’harmoniser avec une cosmologie contemporaine.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme visionnaire et la cosmographie concrète sont conservés. « Ciel » est employé au singulier comme dans la source; aucune interprétation confessionnelle n’est ajoutée.
