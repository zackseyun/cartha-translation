base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: fr
  text: De là, je suis allé jusqu’aux extrémités de la terre. J’y ai vu de grandes bêtes, qui différaient les unes des autres. Les oiseaux aussi différaient par leur apparence[a] et leur forme[b], et leurs voix aussi différaient les unes des autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs faces ». Ici, le mot désigne plus largement leur aspect visible.'
    reason: lexical_alternative
  - marker: b
    text: Le terme rendu par « forme » est incertain dans ce témoin; il semble désigner la forme ou la constitution physique.
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Expression déictique naturelle qui marque la poursuite du déplacement visionnaire.
- source_word: ሖርኩ
  choice: je suis allé
  rationale: Rend simplement le verbe de mouvement à la première personne, sans ajouter l’idée d’un voyage prolongé.
- source_word: አጽናፈ ምድር
  choice: les extrémités de la terre
  rationale: Conserve l’image de la géographie cosmique apocalyptique tout en restant idiomatique en français.
- source_word: አራዊተ ዐበይተ
  choice: de grandes bêtes
  rationale: Évoque de grands animaux sauvages et maintient le registre élevé du récit visionnaire.
- source_word: ይትዌለጥ
  choice: différaient
  rationale: Exprime la distinction mutuelle et permet de conserver la répétition significative du verbe.
- source_word: ፩እምካልኡ
  choice: les unes des autres
  rationale: Formulation réciproque naturelle en français, accordée avec les noms féminins employés.
- source_word: አዕዋፍሂ
  choice: Les oiseaux aussi
  rationale: Préserve la valeur additive de l’enclitique et étend aux oiseaux l’observation précédente.
- source_word: ገጾሙ
  choice: leur apparence
  rationale: Le sens littéral est « leurs faces », mais « apparence » rend mieux ici le trait visible distinguant les oiseaux.
- source_word: ስኖሙ
  choice: leur forme
  rationale: Rendu sobre d’un terme dont la lecture ou la nuance est incertaine; évite d’expliciter sans nécessité « la forme de leur corps ».
- source_word: ቃሎሙሂ
  choice: leurs voix aussi
  rationale: Conserve à la fois le sens de « voix » et la valeur additive, importante dans la structure répétitive de la phrase.
theological_decisions:
- issue: Portée cosmographique de አጽናፈ ምድር
  choice: les extrémités de la terre
  alternative: les confins de la terre
  rationale: Le choix préserve la représentation cosmique du texte sans la réduire à de simples régions lointaines.
- issue: Sens de ገጾሙ appliqué aux oiseaux
  choice: leur apparence
  alternative: leurs faces
  rationale: « Apparence » est naturel dans cette énumération de caractéristiques visibles et sonores, tandis que le sens littéral est signalé en note.
- issue: Répétition de ይትዌለጥ et valeur additive de -ሂ
  choice: répéter « différaient » et « aussi » dans la proposition sur les voix
  alternative: coordonner simplement « leur apparence, leur forme et leurs voix » sous un seul verbe
  rationale: La répétition maintient l’insistance et la structure du guèze, sans résoudre ni aplatir la formulation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression visionnaire et la répétition du texte guèze, tout en évitant les archaïsmes et les explicitations excessives.
