  terminology: « Étoiles du ciel », « portes », « sorties », « ordre », « activité », « temps » et « mois » rendent les termes cosmologiques sans ajout doctrinal ni technicisation indue. Uriel est correctement nommé et « le saint ange qui était avec moi » est naturel et fidèle.
