base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: fr
  text: Je vis comment les étoiles du ciel sortent, et je comptai les portes par lesquelles elles sortent[a]. Je consignai toutes leurs sorties, une par une, selon leur nombre et leurs noms, leur ordre et leur activité, leurs temps et leurs mois, comme me l’avait montré Uriel, le saint ange qui était avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze de cette première phrase est difficile dans le témoin transcrit. Une autre lecture possible est : « Je vis les portes d’où sortent les étoiles du ciel. »'
    reason: textual_variant
lexical_decisions:
- source_word: አፎ
  choice: comment
  rationale: Dans cette construction, አፎ est compris comme un adverbe interrogatif ou modal, « comment », plutôt que comme le nom « bouche ». Cette lecture rend naturellement la proposition « je vis comment les étoiles… sortent ».
- source_word: ይወጽኡ / ይወፅኡ
  choice: sortent
  rationale: Le même verbe de sortie est rendu de la même manière dans les deux propositions afin de conserver la répétition concrète du texte.
- source_word: ከዋክብተ ሰማይ
  choice: les étoiles du ciel
  rationale: Traduction directe, naturelle et conforme au registre cosmologique du passage.
- source_word: ኍለቁ
  choice: je comptai
  rationale: Le mot est lu ici comme une forme verbale signifiant « compter », en relation avec les portes mentionnées ensuite. Cette analyse rend la suite syntaxiquement cohérente, tout en reconnaissant la difficulté de la transcription.
- source_word: ኀዋኅወ
  choice: les portes
  rationale: Le terme désigne des portes ou portails dans la représentation architecturale du cosmos propre à 1 Hénoch. « Portes » est clair et concret en français.
- source_word: ጸሐፍኩ ኵሎ ሙፃኣቲሆሙ
  choice: Je consignai toutes leurs sorties
  rationale: « Consigner » exprime l’enregistrement méthodique, tandis que « sorties » conserve le sens concret du substantif formé sur le verbe « sortir ».
- source_word: ለለ፩፩
  choice: une par une
  rationale: Cette expression distributive indique un relevé individuel et ordonné.
- source_word: በኍልቆሙ ወእስማቲሆሙ
  choice: selon leur nombre et leurs noms
  rationale: La formulation garde les deux critères d’inventaire, le nombre et les noms, sans préciser au-delà du texte leur référent exact.
- source_word: በደርጎሙ ወምገባሮሙ
  choice: leur ordre et leur activité
  rationale: « Ordre » préserve les nuances possibles de rang, disposition ou succession; « activité » désigne de façon neutre leur fonctionnement.
- source_word: ወጊዜሆሙ ወአውራኂሆሙ
  choice: leurs temps et leurs mois
  rationale: La traduction littérale maintient la distinction entre les temps associés aux étoiles et leurs mois, sans ajouter l’idée interprétative de temps « fixés ».
- source_word: ኡርኤል መልአክ ዘምስሌየ ቅዱስ
  choice: Uriel, le saint ange qui était avec moi
  rationale: La place de « saint » est ajustée à l’usage français tout en conservant les éléments et la relation exprimés par le guèze.
theological_decisions:
- issue: Représentation cosmique de la sortie des étoiles
  choice: Conserver les « portes » concrètes par lesquelles les étoiles sortent.
  alternative: Moderniser en parlant simplement du lever des étoiles ou de l’horizon.
  rationale: La vision décrit un cosmos structuré par des ouvertures architecturales. La traduction ne doit pas remplacer cette imagerie apocalyptique par une description astronomique moderne.
- issue: Interprétation de l’ouverture textuellement difficile
  choice: Lire « je vis comment… et je comptai les portes… ».
  alternative: Lire « je vis les portes d’où les étoiles sortent » ou « je vis les bouches d’où elles sortent ».
  rationale: La syntaxe et les valeurs lexicales de አፎ, ኍለቁ et ኀዋኅወ favorisent ici la lecture modale suivie du comptage des portes; la note signale toutefois l’incertitude de ce témoin transcrit.
translation_notes:
  register: Français international actuel, digne et lisible. La répétition de « sortent » et les éléments concrets de la cosmologie visionnaire sont volontairement conservés. « Consignai » soutient le registre d’un relevé ordonné sans devenir archaïque.
