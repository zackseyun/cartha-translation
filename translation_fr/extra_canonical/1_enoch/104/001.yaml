base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: fr
  text: 'Je vous le jure : au ciel, les anges se souviennent de vous en bien devant la gloire du Grand[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien transcrit s’interrompt après « devant ». Le complément « la gloire du Grand » est rétabli d’après l’attestation textuelle parallèle ; le sens clairement visible jusque-là est : « Je vous le jure : au ciel, les anges se souviennent de vous en bien devant… »'
    reason: textual_variant
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: Je vous le jure
  rationale: La formule signifie clairement « je vous le jure » et s’adresse directement au groupe.
- source_word: በሰማይ፡
  choice: dans le ciel
  rationale: Rend directement le complément de lieu éthiopien sans lui substituer une expression reconstruite.
- source_word: ይዜከሩ፡ መላእክት፡
  choice: les anges se souviennent
  rationale: Le verbe exprime le souvenir et son sujet explicite est « les anges » ; le présent français convient à l’énoncé.
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: de vous pour votre bien
  rationale: Cette formulation conserve à la fois la référence aux destinataires et la valeur favorable de « pour le bien », sans développer artificiellement une scène judiciaire.
- source_word: በ*ቅድመ፡
  choice: devant
  rationale: Le dernier mot visible introduit « devant », mais la transcription fournie s’interrompt ensuite ; le complément est rétabli d’après l’attestation textuelle connue et signalé en note.
theological_decisions:
- issue: Nature du souvenir céleste
  choice: Les anges se souviennent favorablement des destinataires devant la gloire du Grand.
  alternative: Le souvenir serait un registre judiciaire écrit ou l’assurance qu’une plainte a été entendue.
  rationale: Le texte fourni nomme explicitement les anges et emploie le vocabulaire du souvenir. La traduction préserve la portée favorable et céleste sans convertir ce souvenir en inscription écrite ni en plainte entendue.
- issue: Titre divin « le Grand »
  choice: la gloire du Grand
  alternative: la gloire du Très-Grand ou la gloire du Grand [Dieu]
  rationale: « Le Grand » conserve sobrement le titre et son caractère théologique sans ajouter le nom « Dieu » absent de la formule reconstruite.
translation_notes:
  register: Français international moderne, digne et direct. « Je vous le jure » restitue la force solennelle de la formule ; les deux-points évitent une subordination lourde. La note distingue nettement le texte éthiopien visible du complément textuellement rétabli.
