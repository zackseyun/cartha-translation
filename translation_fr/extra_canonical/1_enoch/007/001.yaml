base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
translation:
  language: fr
  text: Et tous les autres qui étaient avec eux prirent des femmes pour eux-mêmes[a] ; chacun en choisit une pour lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prirent des épouses ». Le nom guèze peut désigner des femmes en général, mais, dans cette construction, il a souvent le sens d’« épouses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ባዕዳን
  choice: les autres
  rationale: Dans ce contexte, le terme désigne les autres membres du groupe déjà évoqué, plutôt que des étrangers.
- source_word: ኵሉ
  choice: tous
  rationale: Le mot souligne que l’ensemble des autres membres du groupe agit de même.
- source_word: ምስሌሆሙ
  choice: qui étaient avec eux
  rationale: Cette formulation française naturelle exprime l’accompagnement et rattache les autres au groupe précédemment mentionné.
- source_word: ነሥኡ ሎሙ አንስተ
  choice: prirent des femmes pour eux-mêmes
  rationale: Le nom peut désigner des femmes ou, dans cette construction, des épouses. « Femmes » conserve ici l’ambiguïté lexicale du guèze, tandis que « pour eux-mêmes » rend la valeur réflexive.
- source_word: ኃረዩ
  choice: choisit
  rationale: Le verbe exprime simplement un choix délibéré.
- source_word: ለለ ርእሱ አሐተ
  choice: chacun en choisit une pour lui-même
  rationale: La formulation maintient la portée distributive, le singulier numérique et la valeur réflexive de l’expression.
theological_decisions:
- issue: Faut-il rendre አንስተ par « femmes » ou par « épouses » ?
  choice: femmes
  alternative: épouses
  rationale: Le substantif guèze peut désigner les femmes en général, même si la construction évoque couramment le fait de les prendre pour épouses. Le texte principal conserve l’ambiguïté, et la note signale le sens conjugal possible sans légitimer les unions racontées.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du guèze tout en étant naturelle ; la répétition de « pour eux-mêmes / pour lui-même » est conservée afin de rendre les deux marques réflexives du texte source.
