base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: fr
  text: Et toutes les armées des cieux pousseront des cris[a], ainsi que tous les saints d’en haut et l’armée du Seigneur — les Kerouben, les Serafen et les Ofannin[b] —, tous les anges de puissance, tous les anges des principautés[c], l’Élu, et les autres puissances qui sont sur la terre ferme et au-dessus des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appelleront à grands cris » ; le verbe guèze désigne un cri ou un appel vocal.
    reason: lexical_alternative
  - marker: b
    text: Les Ofannin constituent un ordre céleste. Le nom est parfois expliqué par « roues », en lien avec les visions du trône divin.
    reason: lexical_alternative
  - marker: c
    text: Ou « anges des dominations » ; le terme évoque des autorités ou des rangs gouvernants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይጼውዑ
  choice: pousseront des cris
  rationale: Le verbe guèze désigne un appel ou cri vocal. Cette formulation le distingue de l’expression « élever la voix », employée au verset suivant.
- source_word: ኵሉ ኃይለ ሰማያት
  choice: toutes les armées des cieux
  rationale: Dans ce catalogue céleste, ኃይል évoque des troupes ou armées plutôt qu’une puissance abstraite; le pluriel « cieux » suit le texte.
- source_word: ቅዱሳን በመልዕልተ
  choice: tous les saints êtres d’en haut
  rationale: La périphrase indique clairement qu’il s’agit d’êtres célestes et évite que « les saints » soit spontanément compris comme désignant des humains canonisés.
- source_word: ኃይለ እግዚአብሔር
  choice: l’armée du Seigneur
  rationale: Le contexte de groupes célestes favorise le sens collectif d’armée plutôt que celui d’attribut abstrait.
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: Kerouben / Serafen / Ofannin
  rationale: Ces translittérations francisées conservent les formes propres au témoin guèze sans les remplacer par les formes hébraïsantes traditionnelles.
- source_word: መላእክተ ኃይል
  choice: anges de puissance
  rationale: La formulation nominale conserve l’allure de titre d’une classe angélique.
- source_word: መላእክተ አጋእዝት
  choice: anges des principautés
  rationale: Le terme désigne des autorités ou rangs gouvernants; « principautés » maintient cette idée de hiérarchie.
- source_word: ኅሩይ
  choice: l’Élu
  rationale: Dans les Paraboles d’Hénoch, le mot fonctionne comme titre récurrent de la figure eschatologique; la majuscule signale cet emploi titulaire.
- source_word: ካእአ ኃይል
  choice: les autres puissances
  rationale: La traduction conserve la portée large et énigmatique de ce groupe supplémentaire.
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: qui sont sur la terre ferme et au-dessus des eaux
  rationale: የብስ désigne précisément la terre sèche par opposition à l’eau; le pluriel « eaux » convient au registre cosmique français.
theological_decisions:
- issue: Statut de ኅሩይ dans l’énumération
  choice: l’Élu, comme titre singulier
  alternative: un élu, comme simple qualificatif
  rationale: L’usage récurrent du terme dans les Paraboles justifie le titre, sans identifier davantage cette figure ni résoudre les tensions christologiques ultérieures.
- issue: Désignation des ordres célestes
  choice: translittérer Kerouben, Serafen et Ofannin
  alternative: employer Chérubins, Séraphins et Roues/Ophanim
  rationale: La translittération garde l’étrangeté du témoin guèze et évite de rabattre le texte sur une angélologie confessionnelle ou sur une glose interprétative.
- issue: Portée du verbe initial sur la longue énumération
  choice: faire de tous les groupes énumérés le sujet du cri
  alternative: rattacher explicitement le verbe au seul premier groupe
  rationale: La coordination guèze permet naturellement de comprendre toute la série comme un sujet composé, tout en évitant de répéter un verbe absent du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération est structurée par des tirets et des virgules sans supprimer son caractère solennel. Les noms des ordres célestes sont translittérés selon le témoin guèze et adaptés sobrement à la lecture française.
