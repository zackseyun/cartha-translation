base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: fr
  text: Et tous ceux qui étaient dans les hauteurs du ciel[a] reçurent un ordre, de la puissance, une voix et une lumière semblable au feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « dans la hauteur du ciel ». On peut aussi traduire : « tous ceux qui étaient au plus haut du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien est difficile à cet endroit. Le mot rendu par « lumière » peut aussi désigner l’éclat ou le rayonnement.
    reason: textual_variant
lexical_decisions:
- source_word: ወነሥኡ
  choice: reçurent
  rationale: Le verbe signifie couramment « prendre » ou « recevoir ». Avec ትእዛዘ (« ordre »), « reçurent » exprime naturellement l’acceptation de ce qui est donné.
- source_word: ትእዛዘ
  choice: un ordre
  rationale: Le nom désigne ici une directive investie d’autorité. « Ordre » conserve cette force sans ajouter une nuance doctrinale.
- source_word: እለ በ‘መልዕልተ ሰማይ ኵሎሙ
  choice: tous ceux qui étaient dans les hauteurs du ciel
  rationale: Cette formulation désigne largement les êtres situés dans la région céleste élevée, sans les identifier à un ordre angélique précis. Le pluriel français « les hauteurs » rend l’image spatiale de façon naturelle.
- source_word: ኃይለ
  choice: de la puissance
  rationale: Le nom exprime la force ou la puissance. « Puissance » convient au registre visionnaire et fonctionne ici comme l’un des objets coordonnés du verbe « reçurent ».
- source_word: ቃለ
  choice: une voix
  rationale: Le terme peut désigner une voix, un son, une parole ou un énoncé. « Voix » préserve l’imagerie sensorielle sans préciser indûment le contenu de cette voix.
- source_word: ብርሃነ
  choice: une lumière
  rationale: Le nom signifie « lumière », avec les nuances possibles d’éclat ou de rayonnement. « Lumière » est le choix le plus direct; les autres nuances sont signalées en note.
- source_word: ከመ እሳት
  choice: semblable au feu
  rationale: Cette traduction conserve directement la comparaison. En français, « au feu » exprime naturellement l’image sans imposer l’idée d’un feu particulier.
theological_decisions:
- issue: Identité de ceux qui se trouvent dans les hauteurs du ciel
  choice: Référence générale à des êtres célestes
  alternative: Un ordre angélique précis ou l’ensemble des armées célestes
  rationale: Le verset ne nomme aucune catégorie particulière. La traduction garde donc le référent ouvert et n’importe pas une hiérarchie angélique élaborée ailleurs.
- issue: Rapport syntaxique entre l’ordre, la puissance, la voix et la lumière
  choice: Les quatre éléments sont reçus par les êtres célestes
  alternative: Faire de « la puissance et la voix de la lumière » le sujet d’une seconde proposition, « étaient semblables au feu »
  rationale: Les noms sont coordonnés et se présentent comme les compléments du verbe « reçurent ». Cette analyse respecte la syntaxe du témoin tout en signalant en note la difficulté locale touchant le dernier terme.
translation_notes:
  register: Français international actuel, digne et lisible. La coordination répétée conserve le rythme énumératif de l’éthiopien. Aucun groupe céleste précis n’est nommé, et l’ambiguïté lexicale de ብርሃነ est maintenue en note.
