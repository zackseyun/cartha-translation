base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: fr
  text: Et à lui appartient la première parole[a] ; ils béniront, exalteront et loueront avec sagesse[b], et ils seront sages dans leur discours et dans l’esprit de vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commencement de la parole ». Le terme guèze traduit par « parole » peut aussi désigner la voix ou le discours, mais il fait ici partie de l’expression « première parole » ou « commencement de la parole ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, on peut aussi comprendre : « dans la sagesse ».'
    reason: formal_alternative
  - marker: c
    text: Ou « dans le souffle de vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለዉእቱ፡ መቅድመ፡ ቃለ
  choice: Et à lui appartient la première parole
  rationale: ወለዉእቱ signifie « et à lui ». መቅድመ ቃለ forme ici une expression construite, « le commencement de la parole » ou « la première parole », et non une locution signifiant « devant lui, avec la voix ». « Appartient » est ajouté en français pour rendre naturellement la relation possessive exprimée par « à lui ».
- source_word: ይባርኩ፡ ወያሌዕሉ፡ ወይሴብሑ
  choice: ils béniront, exalteront et loueront
  rationale: Cette série conserve les trois verbes doxologiques et leur parallélisme. Le futur français rend naturellement les formes verbales du guèze sans imposer une nuance impérative.
- source_word: በጥበብ
  choice: avec sagesse
  rationale: La préposition በ peut ici être rendue par « avec » ou « dans ». « Avec sagesse » est idiomatique en français tout en maintenant le substantif et son lien lexical avec le verbe suivant.
- source_word: ይጠብቡ
  choice: ils seront sages
  rationale: Le choix garde le lien explicite avec ጥበብ, « sagesse », plutôt que de réduire le verbe à une simple manière d’agir.
- source_word: በነገር
  choice: dans leur discours
  rationale: ነገር peut désigner une parole, un discours, une affaire ou une chose. Dans ce contexte, « discours » exprime le domaine de la parole et le distingue de ቃለ au début du verset. Le possessif « leur » est une explicitation idiomatique du sujet en français.
- source_word: በመንፈሰ፡ ሕይወት
  choice: dans l’esprit de vie
  rationale: መንፈስ peut signifier « esprit », « souffle » ou « haleine ». « Esprit de vie » préserve le registre religieux et apocalyptique, tandis qu’une note maintient visible la lecture concrète possible.
theological_decisions:
- issue: 'Sens de መንፈሰ ሕይወት : « esprit de vie » ou « souffle de vie »'
  choice: l’esprit de vie
  alternative: le souffle de vie
  rationale: Le contexte céleste et doxologique favorise « esprit », mais le lexème guèze couvre aussi le souffle vital. La traduction principale conserve la portée théologique sans exclure l’image concrète, signalée en note.
- issue: Nature de la « première parole » attribuée au personnage
  choice: Ne pas préciser s’il s’agit d’une prééminence, d’une priorité temporelle ou du droit de prendre la parole
  alternative: Expliciter comme « il prend la parole le premier » ou « le commencement de la parole lui appartient »
  rationale: Le texte exprime une relation entre « lui » et la « première parole », mais n’en définit pas exactement la portée. La formulation française conserve cette tension au lieu de lui imposer une interprétation doctrinale ou narrative.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme ternaire de la louange est conservé. Les formulations techniques ou confessionnelles sont évitées, et les ambiguïtés réelles du guèze sont indiquées sans alourdir le corps du verset.
