base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: fr
  text: Tous ceux qui ne dorment pas dans les hauteurs du ciel[b] le béniront, de même que tous les saints qui sont dans le ciel, tous les élus qui demeurent dans le jardin de la vie, et tout esprit de lumière capable de bénir, de glorifier, d’exalter et de sanctifier ton nom béni[a] ; et toute chair louera et bénira ton nom abondamment et avec puissance[c], pour les siècles des siècles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte passe ici de « le béniront » à « ton nom » dans la suite du verset. Ce changement de personne est présent dans le guèze.
    reason: textual_note
  - marker: b
    text: Ceux « qui ne dorment pas » sont vraisemblablement des êtres célestes toujours éveillés et constamment en service, plutôt que de simples humains vigilants.
    reason: cultural_note
  - marker: c
    text: 'La tournure guèze est difficile. Plus littéralement : « louera et bénira ton nom sans mesure et avec puissance » ; ces expressions qualifient les verbes.'
    reason: textual_variant
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: le béniront / bénira ton nom
  rationale: Le verbe répété appartient au vocabulaire liturgique de la bénédiction. La traduction conserve aussi le passage délibéré de la troisième personne (« le ») à la deuxième personne (« ton »).
- source_word: እለ ኢይነውሙ
  choice: ceux qui ne dorment pas
  rationale: Cette formulation garde l’image apocalyptique d’êtres célestes constamment éveillés sans renforcer le texte en disant « qui ne dorment jamais ».
- source_word: በመልዕልተ ሰማይ
  choice: dans les hauteurs du ciel
  rationale: La traduction préserve l’image spatiale sans imposer un étage cosmologique précis comme « le plus haut ciel ».
- source_word: ቅዱሳን
  choice: les saints
  rationale: Le terme français conserve la catégorie ouverte du texte sans décider s’il s’agit uniquement d’anges, d’humains glorifiés ou d’un groupe céleste plus large.
- source_word: ኅሩያን
  choice: les élus
  rationale: « Les élus » rend directement ce terme important du vocabulaire hénochique sans l’assimiler à une définition doctrinale ultérieure.
- source_word: ገነት ሕይወት
  choice: le jardin de la vie
  rationale: Cette expression garde l’image du jardin présente en guèze et évite les associations plus tardives que pourrait introduire « paradis ».
- source_word: መንፈሰ ብርሃን
  choice: esprit de lumière
  rationale: La traduction littérale conserve l’imagerie cosmique du passage sans préciser indûment l’identité de ces esprits.
- source_word: ዘትክል
  choice: capable de
  rationale: L’expression indique ici la capacité ou l’aptitude et s’intègre naturellement à la série d’infinitifs en français.
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: bénir, glorifier, exalter et sanctifier
  rationale: Les quatre verbes distincts sont maintenus afin de préserver la cadence doxologique et les nuances du texte.
- source_word: ለስምከ ቡሩክ
  choice: ton nom béni
  rationale: La construction qualifie le plus naturellement le nom et produit en français une formule doxologique concise.
- source_word: ኵሉ ሥጋ
  choice: toute chair
  rationale: Cette expression biblique et apocalyptique forte est conservée plutôt que généralisée en « toute créature ».
- source_word: ፈድፋደ እምኃይል
  choice: avec une puissance sans mesure
  rationale: La formulation française rattache les deux éléments adverbiaux aux verbes qui suivent et exprime à la fois l’intensité extrême et la puissance, tout en reconnaissant la difficulté de la tournure guèze.
- source_word: ትሴብሕ
  choice: louera
  rationale: « Louer » distingue ce verbe du verbe antérieur rendu par « glorifier » et convient à la conclusion doxologique.
theological_decisions:
- issue: Identité des « saints » et des « élus »
  choice: Conserver les deux désignations sans préciser la nature de leurs membres.
  alternative: Identifier les « saints » aux seuls anges et les « élus » aux seuls humains sauvés.
  rationale: La vision énumère plusieurs groupes célestes, mais ne fixe pas ici une distinction ontologique rigide entre eux.
- issue: Changement de personne grammaticale
  choice: Traduire d’abord « le béniront », puis « ton nom ».
  alternative: 'Harmoniser tout le verset à la deuxième personne : « te béniront » et « ton nom ».'
  rationale: Le suffixe objet de ይባርክዎ est masculin singulier à la troisième personne. Le passage ultérieur à la deuxième personne est donc préservé plutôt que corrigé.
- issue: Image de ገነት ሕይወት
  choice: le jardin de la vie
  alternative: le paradis de la vie
  rationale: L’image du jardin est directement portée par le guèze et ne requiert pas le vocabulaire traditionnel plus chargé de « paradis ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe ample et l’enchaînement des groupes sont conservés pour maintenir le caractère liturgique de la doxologie. Le point-virgule rend lisible la longue énumération sans la transformer en phrases indépendantes.
