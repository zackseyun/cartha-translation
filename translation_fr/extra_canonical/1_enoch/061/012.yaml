  terminology: « Les saints », « les élus », « le jardin de la vie », « esprit de lumière », « toute chair » et « ton nom béni » sont des choix fidèles et de registre approprié. « Louer » rend utilement le dernier verbe, distinct du précédent « glorifier ».
