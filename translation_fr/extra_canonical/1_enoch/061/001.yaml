base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: fr
  text: En ces jours-là, je vis que de longues cordes[a] furent données à ces anges[b]. Ils prirent des ailes pour eux-mêmes, s’envolèrent et allèrent vers le nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze rendue par « de longues cordes » peut aussi désigner de longues cordes ou, plus précisément, des cordes à mesurer.
    reason: Alternative lexicale.
  - marker: b
    text: Le groupe rendu par « ces anges » peut aussi être compris comme « les autres anges », selon le sens donné au démonstratif.
    reason: Lecture alternative du démonstratif.
lexical_decisions:
- source_word: ወርኢኩ
  choice: je vis
  rationale: Rend directement la formule visionnaire à la première personne dans un français naturel et digne.
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et son registre élevé.
- source_word: ተውህበ
  choice: furent données
  rationale: Préserve la forme passive et s’accorde avec le complément pluriel « de longues cordes ».
- source_word: ለአልእቱ መላእክት
  choice: à ces anges
  rationale: « Anges » convient au contexte apocalyptique; le démonstratif est rendu sans imposer l’idée d’un autre groupe.
- source_word: አሕባል ነዋኃን
  choice: de longues cordes
  rationale: Conserve l’image concrète et l’idée de longueur sans introduire dans le texte la fonction possible de cordes à mesurer.
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: Ils se munirent d’ailes
  rationale: Expression française naturelle qui préserve la nuance d’acquisition pour eux-mêmes.
- source_word: ወሰረሩ
  choice: s’envolèrent
  rationale: Rend clairement le mouvement de vol lié à la prise d’ailes.
- source_word: ወሖሩ ሰመንገለ መስዕ
  choice: partirent en direction du nord
  rationale: Exprime le mouvement orienté vers le nord sans en faire nécessairement la destination finale.
theological_decisions:
- issue: Identité des anges
  choice: « ces anges » sans identification supplémentaire
  alternative: « les autres anges » ou une catégorie particulière d’anges chargés du jugement
  rationale: Le verset ne précise pas davantage leur identité; la formulation retenue évite d’importer une interprétation extérieure.
translation_notes:
  register: Français international moderne, clair et digne. La coordination sémitique est légèrement allégée pour une lecture naturelle, tout en conservant la succession des actions et l’ambiguïté concernant les anges et les cordes.
