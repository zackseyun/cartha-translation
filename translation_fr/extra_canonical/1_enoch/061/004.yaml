base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: fr
  text: Les élus commenceront à demeurer avec les élus, et ce sont là les mesures[b] qui seront données pour la foi[a] ; ils affermiront la justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la fidélité » ou « pour la constance ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « mesures » peut aussi désigner des parts mesurées, des lots attribués ou des normes ; la nuance exacte est incertaine.
    reason: lexical_alternative
  - marker: c
    text: 'Le sujet de « ils affermiront » peut aussi être compris comme « les mesures » : « et elles affermiront la justice ».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: commenceront à demeurer
  rationale: Le premier verbe, de la racine waṭana, exprime le commencement et gouverne naturellement le second, « demeurer ». Cette analyse rend les deux verbes sans les confondre en un simple redoublement.
- source_word: ኅሩያን
  choice: les élus
  rationale: Désignation apocalyptique claire et idiomatique en français, sans ajout doctrinal.
- source_word: እሉ
  choice: telles
  rationale: Le démonstratif signifie « ceux-ci/ces » ; devant « mesures », « telles sont » donne une phrase française naturelle tout en gardant la valeur démonstrative.
- source_word: እምጣናት
  choice: les mesures
  rationale: Conserve l’image concrète et l’incertitude entre quantités mesurées, parts attribuées et normes.
- source_word: ይትወሀቡ
  choice: seront données
  rationale: Rend directement la forme passive et le registre révélatoire du texte.
- source_word: ለሃይማኖት
  choice: pour la foi
  rationale: Traduction directe d’un terme qui peut également désigner la fidélité ou la constance ; ces possibilités sont signalées en note.
- source_word: ያፀንዕዋ
  choice: elles affermiront
  rationale: Le verbe signifie rendre ferme ou solide. Le sujet grammatical le plus immédiat est « les mesures », nom féminin pluriel en français.
- source_word: ለጽድቅ
  choice: la justice
  rationale: « Justice » est naturel en français biblique moderne et peut porter ici une valeur morale large ; « droiture » reste possible.
theological_decisions:
- issue: Sens de ሃይማኖት dans le contexte apocalyptique
  choice: la foi
  alternative: la fidélité ou la constance
  rationale: Le terme est polysémique. Le texte principal retient le sens direct sans exclure une fidélité persévérante, conservée en note.
- issue: Rapport entre les deux verbes initiaux
  choice: commenceront à demeurer
  alternative: demeureront ; commenceront et demeureront
  rationale: L’analyse de ይዌጥኑ comme « commencer » suivie de የሐድሩ « demeurer » donne une construction cohérente. Une compréhension coordonnée demeure assez proche pour être signalée.
- issue: Sujet de « affermiront »
  choice: les mesures
  alternative: les élus
  rationale: La troisième personne du pluriel peut reprendre grammaticalement l’un ou l’autre groupe. L’antécédent immédiat favorise « les mesures », mais l’ambiguïté réelle est explicitée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure conserve le relief apocalyptique, évite l’archaïsme et rend explicitement le verbe initial « commencer », malgré les couches anglaises divergentes.
