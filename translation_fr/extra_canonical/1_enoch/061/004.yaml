revisions:
- from: Les élus commenceront à demeurer avec les élus, et telles sont les mesures qui seront données pour la foi[a][b] ; elles affermiront la justice.[c]
  to: Les élus commenceront à demeurer avec les élus, et ce sont là les mesures[b] qui seront données pour la foi[a] ; ils affermiront la justice[c].
  rationale: La révision corrige les ancrages des notes, remplace une tournure française peu idiomatique par « ce sont là », et évite que le genre grammatical français de « elles » ne transforme une ambiguïté de sujet en choix définitif. Elle maintient « commenceront à demeurer », qui rend les deux verbes initiaux selon l'analyse lexicale fournie, ainsi que les termes théologiquement non surinterprétés du projet.
