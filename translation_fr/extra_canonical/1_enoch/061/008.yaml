base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: fr
  text: Et le Seigneur des esprits fit asseoir l’Élu[a] sur le trône de gloire. Il jugera toutes les œuvres des saints[b] dans les hauteurs du ciel, et il pèsera leurs actes dans la balance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Choisi ». Le terme guèze désigne ici une figure particulière et fonctionne comme un titre.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner la communauté sainte, des êtres célestes saints, ou éventuellement englober les deux; le texte ne tranche pas.
    reason: alternative_reading
  - marker: c
    text: L’image est celle d’une pesée sur une balance, symbole d’évaluation judiciaire.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Rend naturellement le titre divin récurrent de 1 Hénoch, tout en conservant son registre apocalyptique élevé.
- source_word: መንበረ ስብሐት
  choice: le trône de gloire
  rationale: Préserve l’image concrète de l’intronisation et correspond à l’expression biblique française usuelle.
- source_word: አንበረ
  choice: fit asseoir
  rationale: Exprime explicitement la valeur causative du verbe guèze, mieux que le simple « plaça ».
- source_word: ለኅሩይ
  choice: l’Élu
  rationale: Titre français naturel et établi pour une figure déterminée; la majuscule en marque la valeur titulaire.
- source_word: ይኴንን
  choice: il jugera
  rationale: Conserve la valeur future et la force judiciaire de la scène.
- source_word: ኵሎ ግብሮሙ
  choice: toutes les œuvres
  rationale: « Œuvres » maintient le vocabulaire judiciaire et permet de distinguer ce premier substantif du terme rendu ensuite par « actes ».
- source_word: ለቅዱሳን
  choice: des saints
  rationale: En français biblique moderne, « les saints » demeure une désignation naturelle des êtres saints sans imposer ici qu’il s’agisse exclusivement d’humains ou d’anges.
- source_word: በመልዕልተ ሰማይ
  choice: dans les hauteurs du ciel
  rationale: Rend l’image spatiale élevée de manière plus idiomatique que « dans la hauteur du ciel ».
- source_word: በመዳልው
  choice: dans la balance
  rationale: Préserve l’image judiciaire concrète de la pesée.
- source_word: ይደሉ ምግባሮሙ
  choice: il pèsera leurs actes
  rationale: Respecte l’imparfait actif guèze à la troisième personne du masculin singulier et distingue « actes » des « œuvres » de la proposition précédente.
theological_decisions:
- issue: Identité de ለቅዱሳን
  choice: Conserver « les saints » sans préciser davantage leur identité.
  alternative: « les êtres saints », « les justes » ou « les anges saints »
  rationale: Le contexte n’oblige pas à choisir entre la communauté sainte, des êtres célestes, ou une référence susceptible d’englober les deux.
- issue: Titre ለኅሩይ
  choice: Employer le titre défini « l’Élu ».
  alternative: « le Choisi » ou « un élu »
  rationale: L’intronisation et la fonction judiciaire indiquent une figure particulière déjà caractérisée, et non un individu indéfini.
- issue: Sujet de la pesée finale
  choice: 'Maintenir le sujet masculin singulier explicite : « il pèsera ».'
  alternative: « leurs actes seront pesés »
  rationale: La forme verbale guèze est active, à la troisième personne du masculin singulier. La traduction ne précise toutefois pas davantage que le texte l’antécédent exact du pronom.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe est légèrement solennelle sans archaïsmes. « Dans les hauteurs du ciel » conserve l’élévation spatiale, tandis que « œuvres » puis « actes » reflète la variation lexicale du guèze.
