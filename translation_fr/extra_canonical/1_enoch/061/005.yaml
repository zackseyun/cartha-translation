  source_fidelity: 'Le projet rend correctement le sujet explicite « ces mesures », l’énumération des personnes perdues, le titre « le Seigneur des esprits » et la double négation finale. Toutefois, « Ainsi, ils pourront revenir » affaiblit et modifie la relation de but exprimée par ከመ : le texte vise plutôt « afin qu’ils reviennent ». La formulation « dans la profondeur de la terre » est également trop calquée et peu naturelle en français moderne.'
  naturalness: Le registre est globalement digne et accessible. « Au plus profond de la terre » est plus idiomatique sans perdre l’imagerie. L’ajout de « ainsi que » rend la syntaxe française plus claire en rattachant l’énumération à « tout ce qui est caché », sans transformer les personnes énumérées en une explication ponctuelle introduite par deux-points.
  terminology: « L’Élu » conserve avec justesse la valeur titulaire de ኅሩይ sans identification doctrinale ajoutée. « Seigneur des esprits » est fidèle au titre traditionnel du passage. « Être soutenus » demeure une solution prudente pour le verbe difficile, avec une note qui conserve les principales possibilités.
  issues:
