base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: fr
  text: Ces mesures révéleront tout ce qui est caché au plus profond de la terre, ainsi que ceux qui ont péri dans le désert, ceux qui ont été dévorés par les bêtes sauvages et ceux qui ont été dévorés par les poissons de la mer, afin qu’ils reviennent et soient soutenus[a] au jour de l’Élu[b] ; car personne ne périra devant le Seigneur des esprits, et personne ne peut périr[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe guèze est difficile dans ce contexte. On peut aussi comprendre « être affermis » ou, peut-être, « être rassemblés ».
    reason: lexical_alternative
  - marker: b
    text: « L’Élu » est, dans les Paraboles, un titre de la figure eschatologique associée au jugement et à la réhabilitation.
    reason: cross_reference
  - marker: c
    text: La dernière proposition est très condensée en guèze. Elle peut souligner que nul ne saurait finalement périr devant le Seigneur des esprits.
    reason: textual_difficulty
lexical_decisions:
- source_word: እሉ፡ እምጣን
  choice: ces mesures
  rationale: Le nom እምጣን est explicitement présent et reprend les « mesures » du contexte précédent ; le démonstratif conserve ce lien.
- source_word: ይከሥቱ
  choice: révéleront
  rationale: Le futur convient à la séquence visionnaire et exprime la manifestation de réalités jusque-là cachées.
- source_word: ኵሎ፡ ኅቡኣተ
  choice: tout ce qui est caché
  rationale: Cette formulation française préserve l’ambiguïté entre des choses cachées et des personnes cachées, ensuite précisées par l’énumération des morts.
- source_word: ለዕመቀ፡ ምድር
  choice: dans la profondeur de la terre
  rationale: Le singulier suit de près la construction guèze et maintient l’image de ce qui demeure dissimulé au sein de la terre.
- source_word: ተኃጕሉ፡ እምበድው
  choice: ont péri dans le désert
  rationale: « Périr » convient à la mort dans un lieu inhabité ; « désert » est naturel en français et ne précise pas indûment la nature du terrain.
- source_word: እምአራዊት
  choice: par les bêtes sauvages
  rationale: Le choix rend clairement les animaux non domestiques et conserve la gravité de l’énumération.
- source_word: እምዓሣ፡ ባሕር
  choice: par les poissons de la mer
  rationale: La traduction littérale maintient le parallélisme des morts dont les restes paraissent irrécupérables.
- source_word: ከመ፡ ይግብኡ
  choice: ainsi, ils pourront revenir
  rationale: La proposition exprime le but ou le résultat. « Revenir » laisse apparaître l’idée de restauration sans expliciter davantage le mode de ce retour.
- source_word: ይትመረጐዙ
  choice: être soutenus
  rationale: Le verbe est difficile. « Être soutenus » conserve l’idée probable d’un appui reçu sans imposer le sens plus interprétatif de rassemblement.
- source_word: በዕለተ፡ ኅሩይ
  choice: au jour de l’Élu
  rationale: « L’Élu » est un titre français clair et digne qui conserve la valeur singulière et titulaire de ኅሩይ.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette traduction formelle préserve le titre divin caractéristique du passage.
- source_word: አልቦቱ፡ ዘይትኃጐል … ወአልቦ፡ ዘይክል፡ ተኃጕሎተ
  choice: personne ne périra … et personne ne peut périr
  rationale: La répétition de « périr » reflète la reprise lexicale et l’insistance de la double négation guèze.
theological_decisions:
- issue: Portée du retour des morts dispersés
  choice: Le texte évoque le retour de personnes mortes et devenues humainement irrécupérables.
  alternative: Les mesures ne feraient que mettre au jour leurs restes en vue du jugement.
  rationale: L’énumération de ceux qui ont péri sur terre ou en mer, suivie de « revenir » et de l’affirmation que personne ne périt devant le Seigneur des esprits, favorise une image de restauration eschatologique, sans qu’il soit nécessaire d’en préciser le mécanisme.
- issue: Identité de ኅሩይ
  choice: Conserver le titre « l’Élu » sans identifier davantage son porteur.
  alternative: Employer un titre explicitement christologique ou traduire simplement par « celui qui a été choisi ».
  rationale: Dans les Paraboles, le terme fonctionne comme un titre eschatologique. La traduction maintient sa portée locale sans importer une identification confessionnelle.
- issue: Portée de la négation finale
  choice: Conserver l’énoncé absolu et tendu selon lequel personne ne peut périr.
  alternative: Limiter explicitement l’affirmation aux justes, ou paraphraser comme l’impossibilité de demeurer caché au jugement.
  rationale: Le guèze formule une double négation forte sans restriction exprimée. La traduction ne résout donc pas la tension théologique en ajoutant un groupe de personnes ou une explication absente.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence cumulative de l’énumération est conservée, tandis qu’un deux-points rend explicite son rapport avec « tout ce qui est caché ». Les titres « l’Élu » et « le Seigneur des esprits » gardent leur valeur apocalyptique sans archaïsme excessif.
