    issue: La relation introduite par « Ainsi, ils pourront revenir » n’est pas fidèlement rendue.
    rationale: ከመ introduit ici une finalité ou un résultat visé. « Pourront » introduit une nuance de capacité qui n’est pas exprimée. « Afin qu’ils reviennent et soient soutenus » conserve mieux la construction et l’ambiguïté du retour.
  - severity: low
