revisions:
- from: 'Ces mesures révéleront tout ce qui est caché dans la profondeur de la terre : ceux qui ont péri dans le désert, ceux qui ont été dévorés par les bêtes sauvages et ceux qui ont été dévorés par les poissons de la mer. Ainsi, ils pourront revenir et être soutenus[a] au jour de l’Élu[b] ; car personne ne périra devant le Seigneur des esprits, et personne ne peut périr[c].'
  to: Ces mesures révéleront tout ce qui est caché au plus profond de la terre, ainsi que ceux qui ont péri dans le désert, ceux qui ont été dévorés par les bêtes sauvages et ceux qui ont été dévorés par les poissons de la mer, afin qu’ils reviennent et soient soutenus[a] au jour de l’Élu[b] ; car personne ne périra devant le Seigneur des esprits, et personne ne peut périr[c].
  rationale: La révision maintient le contenu et les termes clés du projet, mais restitue plus exactement la finalité de la proposition guèze, améliore l’idiome français et clarifie la coordination de l’énumération. Les trois appels de note restent placés sur les éléments auxquels ils se rapportent, et les notes conservent les ambiguïtés textuelles et lexicales sans les résoudre doctrinalement.
