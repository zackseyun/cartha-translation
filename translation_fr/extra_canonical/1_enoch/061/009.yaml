base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: fr
  text: 'Et lorsqu’il lèvera son visage pour juger leurs voies cachées[a] par la parole du nom du Seigneur des esprits[b], ainsi que leurs traces selon la voie de justice du Seigneur des esprits, alors tous parleront d’une seule voix : ils béniront, loueront, exalteront et sanctifieront le nom du Seigneur des esprits.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs chemins cachés ». Il s’agit de leur conduite, dissimulée aux regards mais exposée au jugement.
    reason: lexical_alternative
  - marker: b
    text: L’expression guèze « par la parole du nom du Seigneur des esprits » est difficile. Elle peut évoquer la parole, la déclaration ou le commandement investi de l’autorité du nom divin.
    reason: alternative_reading
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: il lèvera le visage
  rationale: Conserve l’image corporelle et solennelle du texte guèze plutôt que de la réduire à « il paraîtra » ou « il regardera ».
- source_word: ይኰንን
  choice: pour juger
  rationale: Le contexte donne au verbe une portée judiciaire, sans imposer le sens plus étroit de « condamner ».
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: leurs voies cachées
  rationale: « Voies » maintient la métaphore morale du parcours de vie, tandis que « cachées » exprime ce qui échappe aux regards mais non au jugement.
- source_word: በነገረ ስሙ
  choice: par la parole du nom
  rationale: La formulation volontairement transparente respecte une construction guèze difficile, sans la réduire à « commandement » ou à « autorité ».
- source_word: አሰረ ዚአሆሙ
  choice: leurs traces
  rationale: La séquence est comprise comme un groupe nominal, « leurs traces / leurs pas », parallèle à « leurs voies cachées », et non comme le verbe « il les établit ».
- source_word: በፍኖተ ጽድቅ
  choice: selon la voie de justice
  rationale: « Selon » rend ici la norme ou le critère du jugement. « Justice » convient au double champ moral et judiciaire de ጽድቅ.
- source_word: በ፩ቃል
  choice: d’une seule voix
  rationale: Expression française naturelle qui transmet l’acclamation unanime littéralement exprimée par « une parole/voix ».
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: ils béniront, loueront, exalteront et sanctifieront
  rationale: La série de quatre verbes est conservée intégralement afin de respecter le rythme liturgique du passage.
- source_word: እግዚአ መናፍስት
  choice: Seigneur des esprits
  rationale: Rend de manière cohérente le titre divin caractéristique des Paraboles d’Hénoch.
theological_decisions:
- issue: Référent du sujet singulier de « il lèvera »
  choice: Maintenir le pronom « il » sans identifier son référent.
  alternative: Identifier explicitement le Seigneur des esprits, l’Élu ou le Fils de l’homme.
  rationale: Le verset présente une action au singulier sans répéter explicitement le sujet; la traduction préserve cette ambiguïté contextuelle.
- issue: Portée de « la parole du nom du Seigneur des esprits »
  choice: Conserver une formulation transparente liée à l’autorité du nom divin.
  alternative: Traduire par « le commandement prononcé au nom du Seigneur des esprits » ou par une déclaration révélatrice concernant son nom.
  rationale: La syntaxe guèze est difficile et ne permet pas de choisir avec certitude entre parole, déclaration et commandement.
- issue: Analyse de አሰረ ዚአሆሙ
  choice: Le comprendre comme le groupe nominal « leurs traces », second objet du verbe « juger ».
  alternative: 'Le comprendre verbalement : « il les établit sur la voie de justice ».'
  rationale: La morphologie soutient l’analyse du nom ʾasar, « trace, pas », suivi du possessif, ce qui forme un parallélisme avec « leurs voies cachées » et évite une correction interprétative du texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase longue et la quadruple formule de louange sont maintenues pour préserver le mouvement solennel et liturgique du texte. Les marqueurs [a] et [b] figurent dans le corps du verset.
