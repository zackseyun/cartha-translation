base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: fr
  text: 'L’ange qui m’accompagnait me dit : « Ce sont les mesures des justes et les cordes des justes. Elles viendront aux justes, afin qu’ils[b] s’appuient[a] sur le nom du Seigneur des Esprits pour toujours et à jamais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi signifier « trouver un soutien », « être affermis » ou « mettre leur confiance ».
    reason: lexical_alternative
  - marker: b
    text: Le sujet de « s’appuient » n’est pas répété en guèze; il désigne vraisemblablement les justes.
    reason: source_ambiguity
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: qui m’accompagnait
  rationale: La proposition relative décrit l’ange qui allait ou marchait avec Hénoch. « Qui m’accompagnait » restitue naturellement la formule du guide angélique sans imposer un déplacement ponctuel.
- source_word: እምጣነ ጻድቃን
  choice: les mesures des justes
  rationale: እምጣነ est compris comme le pluriel à l’état construit de « mesure », et non comme la préposition « de, depuis » suivie d’un nom. Ce sens correspond aux instruments de mesure évoqués dans le contexte immédiat.
- source_word: ማእሰረ ጻድቃን
  choice: les cordes des justes
  rationale: Le nom désigne des cordes, liens ou bandes. « Cordes » maintient le lien concret avec les cordes servant à mesurer dans les versets précédents.
- source_word: ይመጽኡ ለጻድቃን
  choice: Elles viendront aux justes
  rationale: La forme verbale est imperfective et peut exprimer le présent ou l’avenir. L’avenir convient au déroulement de la vision; le datif est rendu sans ajouter l’idée non exprimée d’une provenance.
- source_word: ከመ ይትመረጐዙ
  choice: afin qu’ils puissent s’appuyer
  rationale: La forme verbale évoque le fait de prendre appui, de trouver un soutien ou d’être affermi. « S’appuyer » conserve l’image et la dépendance envers le nom divin sans réduire le sens au seul acte intellectuel de croire.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: le nom du Seigneur des Esprits
  rationale: Cette formulation conserve le titre divin caractéristique des Paraboles d’Hénoch et permet sa traduction uniforme.
- source_word: ለዓለመ ዓለም
  choice: pour toujours et à jamais
  rationale: Cette expression française solennelle rend l’idiome de perpétuité renforcée.
theological_decisions:
- issue: Sujet implicite de la proposition finale
  choice: Le pronom « ils » renvoie aux justes, qui s’appuient sur le nom divin.
  alternative: Le sujet grammatical non exprimé pourrait être rapproché des mesures et des cordes mentionnées juste auparavant.
  rationale: Le sens le plus cohérent est que les objets viennent aux justes afin que ceux-ci trouvent leur appui dans le nom du Seigneur. Une note signale toutefois que le guèze ne répète pas explicitement le sujet.
- issue: Nuance de l’appui sur le nom divin
  choice: Conserver l’image de « s’appuyer sur ».
  alternative: Traduire par « mettre leur confiance dans » ou « être affermis par ».
  rationale: Le verbe permet plusieurs nuances liées au soutien, à l’affermissement et à la confiance. Le choix retenu garde cette tension sémantique au lieu de la transformer en formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Le futur suit la progression visionnaire; « mesures » et « cordes » préservent l’imagerie concrète du contexte. La majuscule à « Esprits » marque le titre divin sans ajouter d’interprétation confessionnelle.
