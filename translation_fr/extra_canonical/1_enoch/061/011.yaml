base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: fr
  text: 'En ce jour-là, ils élèveront une seule voix, et ils béniront, loueront et exalteront dans l’esprit de foi[a][b], dans l’esprit de sagesse, dans l’esprit de patience, dans l’esprit de miséricorde, dans l’esprit de justice et de paix, et dans l’esprit de bonté[c]. Tous diront d’une seule voix : « Il[d] est béni, et que le nom du Seigneur des Esprits soit béni pour les siècles des siècles ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fidélité » : le terme guèze peut désigner la foi aussi bien que la fidélité.'
    reason: lexical_alternative
  - marker: b
    text: L’expression répétée « esprit de… » est conservée telle quelle. Elle peut désigner une disposition dans laquelle la louange est offerte, des qualités accordées par Dieu ou des réalités célestes davantage personnifiées.
    reason: alternative_reading
  - marker: c
    text: Ou « bienveillance » ou « bonté généreuse » ; le terme guèze a un sens assez large.
    reason: lexical_alternative
  - marker: d
    text: Le texte dit littéralement « béni », sans sujet exprimé. Le pronom « il » renvoie probablement au Seigneur des Esprits.
    reason: clarification
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ / በአሐዱ ቃል
  choice: ils élèveront une seule voix / d’une seule voix
  rationale: Avec « voix/parole » comme complément, le verbe exprime naturellement l’action d’élever la voix. La répétition souligne l’unanimité de l’acclamation.
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: ils béniront, loueront et exalteront
  rationale: Les trois verbes sont conservés afin de respecter l’accumulation solennelle du texte.
- source_word: በመንፈሰ ሃይማኖት
  choice: dans l’esprit de foi
  rationale: La construction prépositionnelle répétée est rendue de manière transparente. « Foi » convient au contexte, sans exclure le sens de fidélité.
- source_word: በመንፈሰ ትዕግሥት
  choice: dans l’esprit de patience
  rationale: « Patience » est clair en français moderne et peut englober ici l’endurance persévérante.
- source_word: በመንፈሰ ምሕረት
  choice: dans l’esprit de miséricorde
  rationale: « Miséricorde » conserve le registre moral et religieux du terme guèze.
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: dans l’esprit de justice et de paix
  rationale: « Justice » rend naturellement ጽድቅ en français dans une liste de vertus, et la coordination avec la paix est maintenue sous une seule occurrence d’« esprit ».
- source_word: መንፈሰ ኂሩት
  choice: dans l’esprit de bonté
  rationale: Le terme désigne largement la bonté, la bienveillance ou la qualité de ce qui est bon. « Bonté » évite de le restreindre à la seule générosité.
- source_word: ቡሩክ ወይትባረክ
  choice: Il est béni, et que … soit béni
  rationale: Cette formulation distingue le participe déclaratif ቡሩክ du jussif ይትባረክ, au lieu de fondre les deux formes dans une même tournure.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: le nom du Seigneur des Esprits
  rationale: « Seigneur des Esprits » conserve le titre caractéristique de cette section de 1 Hénoch.
- source_word: ለዓለም ወእስከ ለዓለም
  choice: pour les siècles des siècles
  rationale: Cette formule doxologique française garde la solennité et le redoublement temporel de l’expression guèze.
theological_decisions:
- issue: Sens des expressions répétées « esprit de… »
  choice: Conserver littéralement la série « dans l’esprit de… » sans définir la nature de ces esprits.
  alternative: Les comprendre explicitement comme des dispositions intérieures, des dons célestes ou des esprits personnifiés.
  rationale: La construction peut décrire la manière de louer, des qualités accordées aux adorateurs ou des réalités davantage personnifiées. La traduction laisse subsister cette tension.
- issue: Référent de la première déclaration de bénédiction
  choice: Employer le pronom masculin « il », compris probablement comme renvoyant au Seigneur des Esprits.
  alternative: Lire une exclamation sans sujet exprimé, ou rattacher la première bénédiction au nom mentionné ensuite.
  rationale: Le masculin singulier de ቡሩክ et la mention qui suit favorisent un renvoi au Seigneur, mais le sujet n’est pas exprimé dans cette première proposition; une note signale donc l’explicitation.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes inutiles. La répétition liturgique des expressions « dans l’esprit de… » et « d’une seule voix » est volontairement préservée. La formule finale distingue la déclaration (« Il est béni ») du souhait de bénédiction (« que… soit béni »).
