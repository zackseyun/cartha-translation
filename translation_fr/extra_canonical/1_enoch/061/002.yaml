base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: fr
  text: 'J’ai demandé à l’ange : « Pourquoi ont-ils pris ces cordes et sont-ils partis ? » Il m’a répondu : « Ils sont partis pour mesurer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተስአልክዎ
  choice: J’ai demandé
  rationale: Le parfait à la première personne introduit directement la question d’Hénoch. Le passé composé convient au récit moderne en français.
- source_word: መላእክ
  choice: l’ange
  rationale: Le singulier désigne l’interlocuteur céleste déjà présent dans la vision; « ange » est naturel dans ce contexte apocalyptique.
- source_word: እንዘ እብሎ
  choice: ':'
  rationale: Cette construction introduit les paroles prononcées. En français actuel, les deux-points rendent naturellement cette fonction sans calquer lourdement « en disant ».
- source_word: ነሡ
  choice: ont-ils pris
  rationale: Il s’agit du parfait pluriel de ነሥአ, « prendre », et non d’un verbe signifiant « se lever ».
- source_word: እሎንቱ አኅበለ
  choice: ces cordes
  rationale: Le groupe désigne les cordes mentionnées au verset précédent; le démonstratif français « ces » assure ce renvoi contextuel.
- source_word: ሖሩ
  choice: sont-ils partis / Ils sont partis
  rationale: Le verbe de mouvement signifie ici « aller, partir ». Sa répétition dans la réponse est conservée.
- source_word: ከመ ይመጥኑ
  choice: pour mesurer
  rationale: 'Le verbe est actif et exprime le but: ils partent afin d’effectuer une mesure. L’objet de la mesure demeure implicite comme en guèze.'
theological_decisions:
- issue: Objet et portée de l’action de mesurer
  choice: Ils sont partis pour mesurer.
  alternative: Ils sont partis afin qu’ils mesurent.
  rationale: Le texte présente une action active de mesure, sans en préciser ici l’objet ni en expliciter la portée judiciaire ou distributive. La traduction conserve cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure sémitisante « en disant » est remplacée par une ponctuation française naturelle, tandis que la répétition de « partir » et l’objet implicite de « mesurer » sont préservés.
