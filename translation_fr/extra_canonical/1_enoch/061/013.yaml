base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: fr
  text: Car la miséricorde du Seigneur des esprits est abondante, et il est lent à la colère[c] ; toutes ses œuvres et toute la mesure de ce qu’il a fait[a], il les a révélées aux justes et aux choisis, au nom du Seigneur des esprits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « et toute mesure de ce qu’il a accompli ou créé ». L’expression guèze est difficile et peut désigner l’étendue ordonnée ou la mesure fixée des œuvres de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « au nom du Seigneur des esprits » peut indiquer la sphère, l’autorité ou l’invocation sous laquelle cette révélation est faite.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « et sa colère est lointaine ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: sa miséricorde est abondante
  rationale: Cette formulation naturelle en français conserve l’idée de plénitude quantitative et la portée théologique de la clémence divine.
- source_word: ለእግዚአ መናፍስት
  choice: du Seigneur des esprits
  rationale: Rend directement le titre divin récurrent de 1 Hénoch, sans ajouter l’article devant « esprits », conformément à l’usage français de ce titre.
- source_word: ወርሑቅ መዓት
  choice: et il est lent à la colère
  rationale: Rend l’idiome biblique exprimant la patience divine, tout en signalant en note la lecture plus littérale possible.
- source_word: ወኵሉ ግብሩ
  choice: toutes ses œuvres
  rationale: « Œuvres » couvre largement l’activité et la création divines, sans limiter le sens à des actes de nature morale.
- source_word: ወኵሉ እምጣነ ገብረ
  choice: toute la mesure de ce qu’il a fait
  rationale: Conserve la formulation énigmatique du guèze et ses possibles nuances de mesure, d’étendue ou d’ordre, au lieu de la résoudre par une paraphrase conjecturale.
- source_word: ከሠተ
  choice: il les a révélées
  rationale: Le verbe « révéler » convient au contexte visionnaire et apocalyptique de réalités jusque-là cachées.
- source_word: ለጻድቃን
  choice: aux justes
  rationale: Terme français courant et digne pour désigner ceux qui sont caractérisés par la justice.
- source_word: ወለኅሩያን
  choice: et aux choisis
  rationale: « Choisis » préserve le motif de la sélection tout en évitant les connotations doctrinales plus marquées que peut prendre « élus ».
- source_word: በስሙ
  choice: au nom de
  rationale: Rendu idiomatique direct qui laisse ouvertes les nuances d’autorité, de sphère ou d’invocation.
theological_decisions:
- issue: Sens de la proposition concernant la colère
  choice: Le Seigneur est « lent à la colère », selon l’idiome biblique décrivant sa patience.
  alternative: « Sa colère est lointaine », lecture plus littérale pouvant évoquer l’éloignement ou le délai du jugement.
  rationale: Le contexte associe l’abondance de la miséricorde à la patience divine. La traduction idiomatique est claire en français, tandis que la note préserve la tension avec la forme littérale du guèze.
- issue: Sens de « toute la mesure de ce qu’il a fait »
  choice: Maintenir la formulation relativement littérale comme référence possible à l’étendue, à l’ordre ou à la structure mesurée des œuvres divines.
  alternative: « Tout ce qu’il a fixé » ou « le nombre entier de ses créatures ».
  rationale: Le guèze est difficile et ne permet pas de trancher avec assurance. Une traduction transparente accompagnée d’une note évite une précision artificielle.
- issue: Portée de « au nom du Seigneur des esprits »
  choice: Conserver la formule sans préciser si elle indique l’autorité, la sphère ou l’invocation.
  alternative: Expliciter par « sous l’autorité du Seigneur des esprits » ou « par le nom du Seigneur des esprits ».
  rationale: La préposition guèze autorise plusieurs nuances, qu’il convient de ne pas réduire dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle de la seconde proposition conserve la mise en relief des réalités révélées, tandis que les notes rendent visibles les principales ambiguïtés du guèze.
