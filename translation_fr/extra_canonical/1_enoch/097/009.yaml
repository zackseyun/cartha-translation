base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
translation:
  language: fr
  text: Et maintenant, faisons ce que nous avons projeté[a], car nous avons amassé de l’argent et rempli nos entrepôts comme s’il s’agissait d’eau[b], et nombreux sont les travailleurs agricoles de nos domaines[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce à quoi nous avons pensé » ou « ce que nous avons conçu ». Le verbe guèze peut exprimer aussi bien la pensée que le projet.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme de l’eau »; cette comparaison exprime probablement une très grande abondance.
    reason: cultural_note
  - marker: c
    text: Littéralement, la fin du verset peut se rendre par « les cultivateurs de nos maisons ». « Travailleurs agricoles » peut aussi se traduire par « laboureurs » ou « cultivateurs », et « maisons » peut ici désigner les maisonnées ou les domaines.
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: faisons
  rationale: Le cohortatif à la première personne du pluriel convient à l’exhortation que les riches s’adressent à eux-mêmes.
- source_word: ዘኀለይነ
  choice: ce que nous avons projeté
  rationale: Le verbe peut désigner la pensée ou le dessein; « projeté » rend ici l’intention délibérée sans surinterpréter.
- source_word: ብሩረ
  choice: de l’argent
  rationale: Le mot désigne littéralement l’argent-métal; en français, « de l’argent » conserve ce sens tout en évoquant naturellement la richesse.
- source_word: አስተጋባእነ
  choice: nous avons amassé
  rationale: Le verbe exprime l’action de rassembler; « amassé » convient au contexte d’accumulation de richesses.
- source_word: መዛግብቲነ
  choice: nos entrepôts
  rationale: Le nom pluriel désigne des lieux où l’on conserve des biens ou des trésors; « entrepôts » s’accorde avec l’image concrète de lieux remplis.
- source_word: ከመ ማይ
  choice: comme d’eau
  rationale: Cette formulation maintient la comparaison littérale et insolite avec l’eau, probablement image d’abondance.
- source_word: ሐራስተ
  choice: travailleurs agricoles
  rationale: Le terme désigne des cultivateurs, laboureurs ou ouvriers agricoles; ce choix moderne préserve l’étendue possible du sens.
- source_word: አብያቲነ
  choice: nos domaines
  rationale: Littéralement « nos maisons », mais, associé à des travailleurs agricoles, le mot renvoie vraisemblablement aux propriétés ou exploitations des riches; l’incertitude est signalée en note.
theological_decisions:
- issue: Ton des riches dans le contexte de la déclaration de malheur
  choice: Une exhortation satisfaite et présomptueuse formulée au discours direct
  alternative: Une simple déclaration d’intention, dépourvue de coloration morale
  rationale: Le contexte de condamnation présente la parole comme l’expression de l’assurance arrogante des riches; la forme « faisons » garde cette force sans ajouter de jugement explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le mouvement cumulatif de la vantardise. La comparaison inhabituelle avec l’eau est conservée, tandis qu’une note préserve l’incertitude de la dernière proposition.
