base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: fr
  text: Ayez confiance[a], vous qui êtes justes, car les pécheurs deviendront un objet de mépris et périront au jour de l’iniquité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Croyez » ou « Prenez courage »; l’objet de cette confiance n’est pas précisé.
    reason: ambiguïté lexicale et théologique
lexical_decisions:
- source_word: ተአመኑ
  choice: Ayez confiance
  rationale: L’impératif pluriel exprime la confiance ou la foi sans en préciser l’objet. « Ayez confiance » garde cette ouverture et convient à une exhortation adressée aux justes.
- source_word: ጻድቃን
  choice: vous qui êtes justes
  rationale: Cette formulation française naturelle conserve la valeur d’apostrophe directe du pluriel.
- source_word: ለጽእለት
  choice: un objet de mépris
  rationale: Le terme indique le mépris, l’opprobre ou la honte comme sort réservé aux pécheurs. Cette traduction préserve l’idée de jugement public.
- source_word: ይከውኑ
  choice: deviendront
  rationale: Le verbe exprime ici le fait de devenir ou d’en venir à un certain état.
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Terme moral et religieux usuel, qui maintient le contraste apocalyptique avec les justes.
- source_word: ወይትሐጕሉ
  choice: et périront
  rationale: Le verbe relève de la racine ሐጕለ, « périr, être détruit »; le contexte immédiat confirme le sens de perdition plutôt que celui de remise ou de livraison au jugement.
- source_word: በዕለተ ዓመፃ
  choice: au jour de l’iniquité
  rationale: ዓመፃ désigne ici l’iniquité, la rébellion ou l’injustice. « Iniquité » conserve la portée morale et apocalyptique de l’expression.
theological_decisions:
- issue: L’impératif initial désigne-t-il une confiance intérieure ou explicitement la foi religieuse ?
  choice: Ayez confiance
  alternative: Croyez
  rationale: Le texte ne nomme pas l’objet de la confiance. La traduction choisie garde à la fois la possibilité de la foi et celle de l’assurance, sans expliciter ce que le guèze laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « vous qui êtes justes » évite la raideur de « ô justes », tandis que « au jour de l’iniquité » maintient le registre solennel et apocalyptique.
