base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: fr
  text: 'Et vous deviendrez comme eux, contre qui cette parole[a] témoignera : « Vous êtes devenus les compagnons des pécheurs[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ou « cette affaire ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « les associés des pécheurs » ou « associés aux pécheurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: vous deviendrez
  rationale: Le futur pluriel du verbe « être/devenir » indique ici l’entrée dans un nouvel état; « deviendrez » conserve la progression exprimée par l’avertissement.
- source_word: ከማሆሙ
  choice: comme ceux
  rationale: L’expression comparative signifie « comme eux ». En français, « comme ceux » permet de rattacher naturellement le pronom au groupe défini par la proposition suivante.
- source_word: ሰማዕተ ይከውን ዴቤሆሙ
  choice: servira de témoignage contre
  rationale: ሰማዕተ est compris comme « témoignage/témoin », et non comme une forme passive du verbe « entendre ». La tournure française maintient la portée judiciaire de la phrase.
- source_word: ዝንቱ ነገር
  choice: cette parole
  rationale: ነገር peut désigner une parole, une déclaration, une affaire ou une chose. « Parole » convient au contexte d’un témoignage formulé, sans exclure les autres nuances signalées en note.
- source_word: ሱቱፋነ
  choice: compagnons
  rationale: Le terme exprime la participation ou l’association. « Compagnons » rend cette proximité sociale et morale sans lui imposer un sens doctrinal technique.
- source_word: ኮንክሙ
  choice: vous êtes devenus
  rationale: La forme accomplie décrit un état résultant et reprend le motif initial du devenir.
- source_word: ለኃጥኣን
  choice: des pécheurs
  rationale: Avec « compagnons », le complément français « des pécheurs » exprime naturellement l’association; « associés aux pécheurs » reste également possible.
theological_decisions:
- issue: Nature de l’avertissement
  choice: 'Un avertissement moral et judiciaire : les destinataires finiront par ressembler aux personnes condamnées, leur association avec les pécheurs étant attestée contre elles.'
  alternative: Une simple affirmation selon laquelle les destinataires sont déjà eux-mêmes des pécheurs, sans accent sur leur association avec eux.
  rationale: Le texte articule le fait de « devenir comme » les personnes visées et l’accusation d’être devenus compagnons des pécheurs. La traduction garde ensemble la transformation morale et la portée testimoniale, sans développer une doctrine au-delà du verset.
translation_notes:
  register: Français international moderne, clair et digne. La construction « comme ceux contre qui » résout seulement ce qui est nécessaire à l’intelligibilité française, tandis que « servira de témoignage » préserve explicitement la force judiciaire du guèze.
