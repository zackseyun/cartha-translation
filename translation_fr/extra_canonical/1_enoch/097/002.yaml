base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: fr
  text: 'Sachez-le : le Très-Haut se souvient de votre destruction[a], et les anges du ciel se réjouissent de votre destruction.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre ruine » ou « votre perte », ici et à la fin du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙረ፡ ይከውን፡ ለክሙ
  choice: Sachez-le
  rationale: Cette expression idiomatique signifie « que cela vous soit connu » ou « soyez-en certains ». « Sachez-le » en restitue naturellement la force déclarative et solennelle, sans faire de ይከውን l'annonce séparée d'un événement imminent.
- source_word: እስመ
  choice: ':'
  rationale: Après l'idiome introductif, la conjonction introduit le contenu de ce qui doit être su. En français, les deux-points donnent une formulation naturelle tout en évitant l'ambiguïté causale de « car ».
- source_word: ልዑል
  choice: le Très-Haut
  rationale: Titre divin traditionnel et naturel en français, qui conserve le registre élevé du texte apocalyptique.
- source_word: ይዜከር
  choice: se souvient
  rationale: Le présent exprime ici avec force la certitude du jugement divin; la forme peut aussi recevoir une nuance future selon le contexte.
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  choice: votre destruction
  rationale: Le nom désigne la ruine, la perte ou la destruction. « Destruction » conserve la gravité du contexte et permet de reproduire la répétition du texte source.
- source_word: ይትፌሥሑ
  choice: se réjouissent
  rationale: Rend directement le verbe de joie sans atténuer la dureté de l'image apocalyptique.
- source_word: መላእክተ ሰማይ
  choice: les anges du ciel
  rationale: Conserve la construction génitivale et constitue une expression française claire et digne.
theological_decisions:
- issue: Les êtres célestes se réjouissent-ils directement de la destruction des destinataires ?
  choice: Conserver le sens explicite selon lequel les anges du ciel se réjouissent de leur destruction.
  alternative: Reformuler leur joie comme une approbation de la justice divine plutôt que comme une joie suscitée par la destruction elle-même.
  rationale: Le verbe de joie et son complément sont explicites. Il faut préserver la tension théologique et la sévérité de la rhétorique apocalyptique au lieu de les adoucir.
- issue: Valeur temporelle de ይዜከር et ይትፌሥሑ
  choice: 'Employer le présent : « se souvient » et « se réjouissent ».'
  alternative: 'Employer le futur : « se souviendra » et « se réjouiront ».'
  rationale: Les formes peuvent être comprises dans une perspective présente ou future. Le présent français rend la certitude vive de l'énoncé sans exclure sa portée judiciaire.
translation_notes:
  register: Français international moderne, direct et solennel. La tournure idiomatique initiale est rendue naturellement par « Sachez-le », et la répétition volontaire de « votre destruction » est conservée.
