base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: fr
  text: En ces jours-là, les prières des saints[a] parviendront jusqu’au Seigneur, et les jours de votre jugement viendront sur vous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme signifie littéralement « saints » ou « êtres saints »; il peut désigner les justes fidèles, sans exclure entièrement un sens céleste.
    reason: lexical_alternative
  - marker: b
    text: La fin du verset est difficile dans ce témoin. Elle semble annoncer aux méchants des jours de jugement, de règlement de comptes ou de châtiment.
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique ainsi que le motif répété des « jours », dans un français naturel.
- source_word: ትበጽኅ ጸሎቶሙ
  choice: les prières … parviendront
  rationale: Le verbe exprime l’arrivée à destination; « parvenir » garde l’image des prières qui atteignent leur destinataire.
- source_word: ለቅዱሳን
  choice: des saints
  rationale: En français biblique courant, « saints » désigne naturellement ceux qui appartiennent à Dieu, sans trancher entièrement entre les fidèles terrestres et d’autres êtres saints; une note signale le sens littéral.
- source_word: ኀበ እግዚእ
  choice: jusqu’au Seigneur
  rationale: Rend la direction vers le Seigneur et s’accorde idiomatiquement avec « parvenir », tout en préservant l’image d’une supplication qui monte vers lui.
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: les jours de votre jugement viendront sur vous
  rationale: La leçon est difficile, mais le contexte annonce un règlement de comptes défavorable. « Jugement » conserve la portée judiciaire sans préciser indûment destruction ou châtiment, tandis que « viendront sur vous » exprime l’arrivée menaçante.
theological_decisions:
- issue: Identité de ቅዱሳን
  choice: Conserver une désignation ouverte, « les saints », probablement les justes fidèles dont les prières sont entendues
  alternative: Les anges, ou une catégorie englobant à la fois des êtres saints célestes et terrestres
  rationale: Le contexte oppose vraisemblablement les pécheurs oppresseurs aux justes qui souffrent, mais le terme éthiopien ne permet pas d’exclure absolument une référence céleste.
- issue: Nature de ce qui vient sur les destinataires
  choice: « votre jugement »
  alternative: « votre châtiment » ou « votre destruction »
  rationale: Le contexte soutient l’idée d’un règlement de comptes adverse, mais l’état textuel ne justifie pas de préciser davantage sa forme.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence apocalyptique est conservée par la répétition de « jours ». « Saints » demeure compréhensible dans le registre biblique, tandis que la note maintient l’ambiguïté du terme source.
