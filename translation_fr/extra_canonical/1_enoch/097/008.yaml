base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: fr
  text: 'Malheur à vous qui acquérez de l’argent et de l’or sans justice[a] et qui dites : « Nous nous sommes enrichis de richesses, nous avons des biens et nous avons acquis tout ce que nous désirions. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans droiture »; l’expression peut qualifier soit la manière d’acquérir ces richesses, soit, plus généralement, le caractère moral de ce gain.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Malheur à vous
  rationale: Conserve la force de la formule prophétique de dénonciation et de jugement.
- source_word: ታጠርዩ / አጥረይነ
  choice: acquérez / avons acquis
  rationale: Rend les deux occurrences du même verbe par le même lexème français afin de préserver la répétition rhétorique.
- source_word: ብሩረ ወወርቀ
  choice: de l’argent et de l’or
  rationale: Traduction matérielle directe des deux métaux précieux; « argent » est ici clairement distingué comme métal par son association avec l’or.
- source_word: ዘአኮ በጽድቅ
  choice: sans justice
  rationale: Expression française naturelle qui conserve la catégorie morale de ጽድቅ et qualifie la manière dont les richesses sont acquises.
- source_word: ብዕልነ ብዕለ
  choice: nous nous sommes enrichis de richesses
  rationale: Préserve la répétition appuyée du champ lexical de la richesse et le caractère vantard de la déclaration, malgré sa lourdeur volontaire.
- source_word: ወኮነ ለነ ንዋይ
  choice: nous avons des biens
  rationale: Restitue la proposition distincte indiquant que des biens ou des possessions leur appartiennent.
- source_word: ኵሎ ዘፈቀድነ
  choice: tout ce que nous désirions
  rationale: Conserve la totalité revendiquée et la nuance de désir ou de volonté.
theological_decisions:
- issue: Sens de በጽድቅ dans la dénonciation de l’acquisition des richesses
  choice: justice
  alternative: droiture
  rationale: Dans ce contexte, le terme porte directement sur l’équité morale des moyens d’acquisition. « Sans justice » reste ouvert quant à savoir si l’expression décrit précisément la manière d’acquérir ou, plus largement, le caractère moral du gain; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « enrichis de richesses » est conservée pour refléter l’insistance du texte source; la série de trois affirmations distinctes est intégralement rendue.
