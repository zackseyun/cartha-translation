base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: fr
  text: 'Malheur à vous, pécheurs, qui êtes au milieu de la mer et sur la terre ferme[a] : votre souvenir est mauvais à votre égard[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’association de la mer et de la terre ferme englobe probablement tous les lieux où les humains se trouvent ou se déplacent.
    reason: cultural_note
  - marker: b
    text: 'La proposition finale est difficile. Elle peut aussi signifier : « votre mémoire est mauvaise », « le souvenir de vous est mauvais » ou « un mauvais souvenir s’attache à vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Formule française naturelle qui conserve la force de la proclamation prophétique de jugement.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Rendu direct et courant de la catégorie morale visée.
- source_word: ማእከለ፡ ባሕር
  choice: au milieu de la mer
  rationale: Conserve l’image spatiale explicite du guèze sans la généraliser en « en mer ».
- source_word: ወዲበ፡ የብስ
  choice: et sur la terre ferme
  rationale: Préserve le contraste marqué entre la mer et le sol sec.
- source_word: ዝክርሙ
  choice: le souvenir de vous
  rationale: Expression française qui laisse ouverte la nuance entre souvenir, réputation et mention mémorielle.
- source_word: እኩይ፡ ዴቤክሙ
  choice: témoigne contre vous pour votre mal
  rationale: La fin est difficile. Cette formulation rend sa portée défavorable et quasi judiciaire tout en évitant l’expression peu naturelle « votre souvenir est mauvais contre vous ».
theological_decisions:
- issue: Sens de la proposition finale relative au souvenir
  choice: le souvenir de vous témoigne contre vous pour votre mal
  alternative: votre souvenir est mauvais contre vous ; le souvenir de vous est mauvais ; un mauvais souvenir s’attache à vous
  rationale: Le texte guèze transmis est lexicalement et syntaxiquement difficile. La traduction retient la portée accusatrice probable dans ce contexte de jugement, tandis que la note conserve les autres possibilités au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Malheur à vous » maintient le registre prophétique. Les marqueurs de notes suivent immédiatement les expressions qu’ils éclairent.
