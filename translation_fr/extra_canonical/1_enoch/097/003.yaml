base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: fr
  text: Que ferez-vous, pécheurs, et où fuirez-vous ce jour-là, jour de jugement[a], quand vous entendrez la voix de la prière des justes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jour de détresse » ou « jour de châtiment ». Le terme guèze peut évoquer l’épreuve, la peine ou le jugement.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « voix » peut aussi signifier « son » ou « parole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: Que ferez-vous
  rationale: L’interrogatif suivi de l’imparfait pluriel prend ici une valeur future naturelle dans le contexte d’un jugement imminent.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Le vocatif direct maintient l’interpellation prophétique explicite du texte.
- source_word: አይቴ፡ ትጐይዩ
  choice: où fuirez-vous
  rationale: Le verbe exprime un déplacement précipité ; « fuir » convient au contexte d’une tentative d’échapper au jugement.
- source_word: በይእቲ፡ ዕለት
  choice: en ce jour
  rationale: Cette tournure française naturelle conserve le registre apocalyptique de l’expression temporelle.
- source_word: እንተ፡ ጽነፄ
  choice: de jugement
  rationale: Dans ce contexte, le terme désigne une épreuve punitive ou une décision judiciaire ; « jugement » rend sa portée judiciaire et eschatologique sans préciser excessivement la peine.
- source_word: ሶበ፡ ትሰምዑ
  choice: quand vous entendrez
  rationale: Le futur français exprime clairement la succession attendue des événements.
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: la voix de la prière des justes
  rationale: ቃል peut désigner la voix, le son ou la parole. Avec « prière », « voix » conserve le caractère vocal de l’appel des justes tout en restant intelligible en français.
theological_decisions:
- issue: Rôle de la prière des justes dans la scène de jugement
  choice: Les pécheurs entendent la prière des justes au moment du renversement judiciaire.
  alternative: Ils entendent directement le cri des justes, ou bien leur accusation et leur témoignage.
  rationale: Le guèze nomme explicitement la « prière ». La traduction la maintient sans l’identifier à une formule intertextuelle ou doctrinale ultérieure.
- issue: Portée de ጽነፄ
  choice: jour de jugement
  alternative: jour de détresse, de châtiment ou de condamnation
  rationale: Le contexte soutient une portée judiciaire et punitive, mais les autres nuances lexicales sont signalées afin de ne pas effacer l’ambiguïté du terme.
translation_notes:
  register: Français international moderne, direct et digne. Le futur et l’adresse « pécheurs » préservent la force de l’interpellation prophétique ; les notes rendent visibles les principales ambiguïtés lexicales du guèze.
