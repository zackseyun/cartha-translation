base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: fr
  text: Et toutes les paroles de votre iniquité[a] seront lues devant le Grand Saint, vos visages seront humiliés, et toute œuvre fondée sur l’iniquité sera rejetée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes les affaires de votre iniquité » : le mot peut désigner des paroles, des faits ou des affaires.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition peut aussi se traduire : « toute œuvre établie dans l’iniquité sera écartée ». Le participe qui qualifie l’œuvre semble évoquer ce qui est établi, affermi ou fondé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: seront lues
  rationale: Le passif à valeur future convient à la scène de jugement et conserve l’image d’un contenu lu publiquement.
- source_word: ኵሉ ነገረ
  choice: toutes les paroles
  rationale: ነገር peut désigner une parole, une affaire ou une chose. Avec le verbe « lire », « paroles » rend naturellement l’image d’accusations ou d’un dossier rendu public, tout en signalant en note l’acception plus large.
- source_word: ዓመፃክሙ
  choice: votre révolte
  rationale: Le terme évoque une conduite mauvaise, injuste et rebelle. « Révolte » conserve ici sa force morale et sa dimension d’opposition, sans la limiter à la violence physique.
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: devant le Grand Saint
  rationale: La séquence guèze est conservée sans ajouter de conjonction. Les majuscules marquent un titre divin dans ce contexte de jugement apocalyptique.
- source_word: ይትኀፈር ገጽክሙ
  choice: vos visages seront couverts de honte
  rationale: La formulation française exprime naturellement la honte visible portée par le visage, sans introduire l’idée que les personnes elles-mêmes seraient seulement embarrassées.
- source_word: ይገደፍ
  choice: sera rejetée
  rationale: Dans ce contexte judiciaire, le verbe exprime le rejet ou la mise à l’écart; « rejetée » garde cette force sans préciser indûment le sort final de l’œuvre.
- source_word: ተግባረ
  choice: œuvre
  rationale: « Œuvre » convient au registre biblique moderne et désigne ici le produit concret d’une conduite morale.
- source_word: ዘጸንዐ በዓመፃ
  choice: fondée sur la révolte
  rationale: Le verbe suggère ce qui est affermi, établi ou fondé. Cette traduction conserve cette nuance plus forte que le simple « commise dans la révolte ».
theological_decisions:
- issue: Traduction du titre divin ዐቢይ ቅዱስ
  choice: le Grand Saint
  alternative: le Grand et Saint
  rationale: Le syntagme fonctionne comme un titre divin. « Le Grand Saint » suit l’ordre du guèze et évite d’ajouter une conjonction absente du texte cité.
- issue: Portée de ዓመፃ
  choice: révolte
  alternative: iniquité
  rationale: « Révolte » maintient la tension entre injustice, méchanceté et opposition rebelle, tandis qu’« iniquité » serait plus traditionnel mais moins transparent pour certains lecteurs modernes.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe coordonnée et le futur passif conservent le rythme solennel de la scène judiciaire. Les termes « Grand Saint », « révolte » et « œuvre » maintiennent la couleur apocalyptique sans recourir à un vocabulaire confessionnel particulier.
