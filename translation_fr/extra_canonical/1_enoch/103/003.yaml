base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: fr
  text: Car tout bien, toute joie et toute gloire ont été préparés et inscrits pour les esprits de ceux qui sont morts dans la justice[a]. Beaucoup de bien vous sera donné, fruit de votre labeur[b], et votre part dépassera de beaucoup celle des vivants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la droiture ». « Inscrits » peut évoquer un registre céleste où est gardée la récompense destinée aux justes morts.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « le fruit de votre labeur » : l’image présente l’effort comme produisant une récolte future.'
    reason: lexical_alternative
  - marker: c
    text: Ou « votre part surpassera la part des vivants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Conserve la valeur explicative ou causale du connecteur, sans la renforcer au-delà du texte.
- source_word: ኵሉ ሠናይ
  choice: tout bien
  rationale: Expression large qui garde le caractère global du guèze sans introduire l'idée plus interprétative de « bénédiction ».
- source_word: ፍሥሓ
  choice: joie
  rationale: Équivalent français naturel et digne, adapté à la série « bien, joie et gloire ».
- source_word: ክብር
  choice: gloire
  rationale: Préserve dans ce contexte apocalyptique les nuances de dignité et de splendeur.
- source_word: ተደለወ
  choice: ont été préparés
  rationale: Rend directement le passif et l'idée de biens tenus prêts à l'avance.
- source_word: ተጽሕፈ
  choice: consignés
  rationale: Conserve l'image d'une mise par écrit ou d'un enregistrement sans préciser explicitement qu'il s'agit de livres célestes.
- source_word: ለመንፈሳቲሆሙ
  choice: pour les esprits
  rationale: Traduit le terme anthropologique au plus près, sans lui substituer « âmes », qui pourrait ajouter une nuance doctrinale.
- source_word: ለእለ ሞቱ በጽድቅ
  choice: de ceux qui sont morts dans la justice
  rationale: Maintient la construction nominale et la sphère morale exprimée par « justice ».
- source_word: ይትወሀብ ለክሙ
  choice: vous sera donné
  rationale: Rend simplement le futur passif de la promesse.
- source_word: ተክለ ጻማክሙ
  choice: comme fruit de votre labeur
  rationale: Préserve l'image agricole du fruit produit par l'effort et évite de réduire l'expression à l'abstrait « récompense ».
- source_word: ክፍልክሙ
  choice: votre part
  rationale: Équivalent courant et digne pour une part attribuée; il s'accorde naturellement avec la comparaison qui suit.
- source_word: ፈድፋደ እምክፍለ ሕያዋን
  choice: dépassera de beaucoup celle des vivants
  rationale: Exprime clairement l'intensité et la comparaison, tout en évitant le tour peu naturel « abondera au-delà » en français.
theological_decisions:
- issue: Terme anthropologique désignant les morts
  choice: esprits
  alternative: âmes
  rationale: Le guèze soutient directement « esprits »; « âmes » risquerait d'importer une anthropologie ultérieure que le verset n'impose pas.
- issue: Nature de ce qui est écrit
  choice: consignés
  alternative: inscrits dans les livres célestes
  rationale: Le contexte peut évoquer un registre céleste, mais le texte dit seulement que ces biens ont été écrits ou consignés; la traduction n'explicite donc pas davantage.
- issue: Rapport entre le bien donné et le fruit du labeur
  choice: comme fruit de votre labeur
  alternative: le fruit de votre labeur, en apposition
  rationale: « Comme » rend le fruit du labeur comme caractérisation du bien promis tout en conservant la métaphore, sans le réduire simplement à une récompense abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme ternaire du début est conservé; le vocabulaire reste accessible, avec une légère élévation biblique dans « gloire », « justice » et « labeur ». Tous les marqueurs de notes figurent dans le texte principal.
