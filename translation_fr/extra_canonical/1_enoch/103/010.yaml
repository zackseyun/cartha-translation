base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: fr
  text: Et nous avons été anéantis[a], et il n’y avait personne pour nous venir en aide, même par une parole[b] ; et nous n’avons rien trouvé[c]. Nous avons été tourmentés et anéantis, et nous n’avions aucun espoir de voir la vie d’un jour à l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réduits à la ruine » ou « perdus ». Le même verbe est répété plus loin dans le verset.'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut signifier que personne ne leur venait en aide, même par une prise de parole, une supplication ou un plaidoyer.
    reason: cultural_note
  - marker: c
    text: 'Cette proposition est difficile. On pourrait aussi traduire : « nous n’avons rien obtenu » ou « nous n’avons trouvé aucun soulagement ».'
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: nous avons été anéantis
  rationale: Le verbe répété exprime une ruine ou une destruction profonde. « Anéantis » en conserve la force et permet de maintenir la répétition du texte source.
- source_word: አልቦ ዘይረድአነ
  choice: il n’y avait personne pour nous venir en aide
  rationale: La tournure nie ici la présence d’une personne capable d’aider. « Venir en aide » est naturel en français et respecte la valeur du verbe.
- source_word: በነገር
  choice: même par une parole
  rationale: Le nom peut désigner une parole, une affaire ou une chose. Dans ce contexte, « même par une parole » conserve l’image d’une aide verbale minimale sans imposer l’interprétation plus large « en aucune affaire ».
- source_word: ወኢበምንትኒ ኢረከብነ
  choice: et nous n’avons rien trouvé
  rationale: La construction est difficile. Cette formulation sobre garde l’indétermination de l’objet plutôt que d’ajouter « secours » ou « soulagement ».
- source_word: ተጸዐርነ
  choice: nous avons été tourmentés
  rationale: Le verbe couvre l’affliction, l’oppression ou le tourment. « Tourmentés » rend l’intensité de la lamentation tout en restant idiomatique.
- source_word: ኢተስፈውነ
  choice: nous n’espérions plus
  rationale: La négation porte sur l’espérance. L’ajout idiomatique de « plus » exprime l’absence d’espoir dans cette situation prolongée, sans changer l’objet de l’espérance.
- source_word: ከመ ንርአይ ሕይወተ ዕለት እምዕለት
  choice: voir la vie d’un jour à l’autre
  rationale: La traduction conserve l’image de « voir la vie » et rend l’expression temporelle par une locution française naturelle évoquant la survie quotidienne.
theological_decisions:
- issue: Maintien de la répétition du vocabulaire de ruine dans la lamentation
  choice: Répéter « anéantis » aux deux endroits
  alternative: Varier ou condenser en « affligés » ou « réduits à la misère »
  rationale: La répétition intensifie délibérément la détresse. La conserver évite d’aplanir la rhétorique apocalyptique et ne transforme pas le passage en simple description générale de la souffrance.
- issue: Portée de l’absence d’aide exprimée par በነገር
  choice: « même par une parole »
  alternative: « en aucune affaire » ou « de quelque manière que ce soit »
  rationale: Le terme demeure polysémique. La traduction retient son sens concret de « parole », tandis qu’une note signale sa portée probable d’intervention verbale ou de plaidoyer, sans résoudre excessivement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation maintient les deux mouvements de la lamentation. Les répétitions et l’image « voir la vie » sont conservées, tandis que les principales incertitudes lexicales et syntaxiques sont signalées en notes.
