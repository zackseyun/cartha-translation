base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: fr
  text: Nous espérions devenir la tête, mais nous sommes devenus la queue. Nous avons peiné sans parvenir à maîtriser le fruit de notre travail[a]. Nous sommes devenus de la nourriture[b] pour les pécheurs et les sans-loi, et ils ont lourdement fait peser leur joug sur nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le membre de phrase est difficile en guèze. On peut aussi traduire : « Nous avons peiné en travaillant, mais nous n’avons pas eu la maîtrise de notre travail », ou comprendre le dernier terme au sens de « nos biens » ou « notre richesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la nourriture » ; au sens figuré : « une proie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንሴፎ
  choice: nous espérions
  rationale: Exprime l’attente collective dans le contexte d’une lamentation; « espérions » est naturel et conserve l’idée d’une aspiration déçue.
- source_word: ንኩን ርእሰ … ወኮነ ዘነበ
  choice: devenir la tête … nous sommes devenus la queue
  rationale: Conserve l’antithèse concrète et proverbiale du guèze au lieu de l’expliciter par « chefs » et « derniers ».
- source_word: ጻመውነ እንዘ ንትጌበር
  choice: nous avons peiné
  rationale: Rend naturellement l’idée de labeur pénible. La construction avec እንዘ renforce ou accompagne l’activité de travailler; une répétition littérale serait lourde en français.
- source_word: ወኢሠለጥነ ዲበ ዳማነ
  choice: sans parvenir à maîtriser le fruit de notre travail
  rationale: ሠለጠ exprime le pouvoir ou la maîtrise; dans ce contexte, ዳማነ est compris comme le travail ou son produit. « Fruit de notre travail » rend intelligible la privation subie sans réduire l’expression à la richesse en général.
- source_word: መብልዕተ
  choice: une nourriture
  rationale: Conserve la métaphore concrète du texte, tandis que « proie » en explicite le sens.
- source_word: ለኃጥኣን ወለዓማፅያን
  choice: pour les pécheurs et les rebelles
  rationale: « Pécheurs » garde la portée morale du premier terme; « rebelles » exprime la transgression volontaire du second sans employer le peu naturel « sans-loi ».
- source_word: አክበዱ ላዕሌነ አርዑተ ዚአሆሙ
  choice: ils ont lourdement fait peser leur joug sur nous
  rationale: Préserve l’image du joug et la force du verbe signifiant rendre lourd ou accablant, dans un français courant et digne.
theological_decisions:
- issue: Conserver ou interpréter socialement l’opposition entre la tête et la queue
  choice: Conserver l’image concrète « la tête … la queue »
  alternative: « les chefs … les derniers » ou « les dirigeants … les subordonnés »
  rationale: L’image porte elle-même l’idée de renversement et d’humiliation; l’expliciter socialement réduirait sa force proverbiale et pourrait imposer une interprétation.
- issue: Rendre l’image finale de l’oppression
  choice: Conserver le « joug »
  alternative: « ils nous ont durement opprimés »
  rationale: Le joug est une image significative de domination et d’asservissement; le remplacer par une abstraction affaiblirait la rhétorique du passage.
- issue: Compréhension de ዳማነ dans la proposition sur la maîtrise
  choice: « le fruit de notre travail »
  alternative: « notre travail », « nos biens » ou « notre richesse »
  rationale: Le contexte immédiat du labeur favorise le travail ou son produit. La formulation retenue rend le lien contextuel tout en signalant en note l’incertitude lexicale et syntaxique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les images de la tête et de la queue, de la nourriture et du joug sont conservées. La ponctuation clarifie les étapes de la lamentation, tandis qu’une note maintient l’incertitude du membre central.
