base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: fr
  text: Et maintenant, ils sont morts dans la prospérité et la richesse, sans avoir connu la détresse ni le massacre durant leur vie[a]. Ils sont morts dans l’honneur[b], et aucun jugement n’a été exécuté contre eux durant leur vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils n’ont vu ni détresse ni massacre ». La forme transmise ici semble comporter une erreur de transcription; le contexte et la syntaxe appuient la lecture négative.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « dans la gloire » ou « dans la splendeur ». Ici, le mot paraît désigner une mort entourée d’estime et d’honneur.'
    reason: lexical_alternative
  - marker: c
    text: L’expression « durant leur vie » limite l’affirmation à leur existence terrestre; elle ne dit pas qu’ils échapperont à tout jugement ultérieur.
    reason: alternative_reading
lexical_decisions:
- source_word: ሠናይ
  choice: prospérité
  rationale: Avec « richesse » et « honneur », le terme désigne ici une situation favorable ou le bien-être plutôt que la bonté morale.
- source_word: ብዕል
  choice: richesse
  rationale: Le mot évoque l’aisance matérielle; « richesse » est clair et naturel en français moderne.
- source_word: ምንዳቤ
  choice: détresse
  rationale: Le terme dénote l’affliction ou une situation pénible; « détresse » conserve sa force sans préciser indûment sa nature.
- source_word: ቀትለ
  choice: massacre
  rationale: Le substantif renvoie à une mise à mort violente; « massacre » maintient la tonalité forte et apocalyptique.
- source_word: ኢርእዩ (lecture corrigée de l’OCR አርአዩ)
  choice: sans avoir connu
  rationale: La lecture négative exigée par la syntaxe et le contexte signifie qu’ils n’ont pas vu ou subi la détresse et le massacre; l’expression française rend naturellement cette expérience absente.
- source_word: ስብሐት
  choice: honneur
  rationale: Dans ce contexte, il s’agit de l’estime ou de la condition honorable qui accompagne leur mort, non nécessairement de gloire divine.
- source_word: ኵነኔ
  choice: jugement
  rationale: Le terme conserve le sens judiciaire général sans le réduire à la sentence ou au châtiment.
- source_word: ኢትገብረ ሎሙ
  choice: aucun jugement n’a été exécuté contre eux
  rationale: Cette formulation exprime que le jugement n’a pas été mis à exécution à leur encontre pendant leur existence terrestre.
theological_decisions:
- issue: Le verset affirme-t-il que les impies échappent à tout jugement, ou seulement au jugement durant leur vie terrestre ?
  choice: La négation est limitée explicitement à leur vie terrestre.
  alternative: Comprendre qu’aucun jugement ne les atteindra jamais.
  rationale: La répétition de « durant leur vie » borne l’observation à leur expérience présente. La traduction ne nie donc pas un jugement ultérieur, tout en laissant subsister la tension créée par leur prospérité apparente.
- issue: Lecture de la proposition concernant la détresse et le massacre
  choice: Ils n’ont connu ni détresse ni massacre.
  alternative: Ils sont morts dans la détresse et ont vu le massacre.
  rationale: La lecture négative corrige vraisemblablement une erreur de transcription dans le texte fourni. Les deux substantifs sont des objets directs, sans la préposition employée devant « prospérité » et « richesse », et le contexte décrit leur apparente exemption du malheur.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « durant leur vie » est conservée parce qu’elle structure l’argument et limite explicitement la portée de l’absence de jugement. « Sans avoir connu » privilégie un français naturel tout en reflétant l’idée sémitique de ne pas avoir « vu » ces calamités.
