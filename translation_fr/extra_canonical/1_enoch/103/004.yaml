base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: fr
  text: Et vos esprits vivront[a], vous dont la mort fut dans la justice ; ils se réjouiront et seront dans la joie. Leurs esprits ne périront pas, et leur souvenir sera devant la face du Grand[b], à travers toutes les générations de l’éternité[c]. Et maintenant, ne craignez pas leur humiliation[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le guèze porte un singulier : « votre esprit vivra ». La construction peut aussi s’adresser directement aux justes décédés : « votre esprit vivra, vous dont la mort fut dans la justice ».'
    reason: ambiguïté grammaticale et variante de nombre
  - marker: b
    text: 'Littéralement : « devant la face du Grand », formule exprimant la présence, notamment dans le langage de la cour céleste.'
    reason: note idiomatique et culturelle
  - marker: c
    text: 'On pourrait aussi traduire : « à travers toutes les générations de l’âge ». Ici, le mot rendu par « éternité » a une valeur temporelle.'
    reason: variante lexicale
  - marker: d
    text: 'Ou : « leur opprobre » ou « leur honte ». Le nom peut désigner l’humiliation ou le déshonneur public.'
    reason: variante lexicale
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: votre esprit vivra
  rationale: Le nom « esprit » est morphologiquement au singulier avec un suffixe de deuxième personne du pluriel. Cette traduction conserve ce nombre grammatical et évite d’imposer « âme », terme plus chargé doctrinalement.
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: vous qui êtes morts dans la justice
  rationale: La formulation française exprime naturellement l’adresse aux justes décédés tout en maintenant le substantif « justice », plutôt que de le réduire à une simple manière de mourir.
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: ils se réjouiront et seront dans l’allégresse
  rationale: Les deux verbes de joie restent distincts afin de préserver le parallélisme emphatique du texte.
- source_word: ወኢይትሐጐሉ መንፈሳቲሆሙ
  choice: leurs esprits ne périront pas
  rationale: « Périr » rend avec concision la négation de la destruction et conserve la portée eschatologique de l’énoncé.
- source_word: ወእቲዝካሮሙ
  choice: et leur souvenir sera
  rationale: « Souvenir » évoque ici la mémoire durable des justes plutôt qu’un acte psychologique ponctuel.
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: devant la face du Grand
  rationale: La locution concrète de présence est conservée, ainsi que l’épithète divine « le Grand », sans remplacer celle-ci par le nom « Dieu ».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: pour toutes les générations de l’éternité
  rationale: Dans cette formule apocalyptique, ዓለም a une valeur temporelle correspondant à l’âge ou à l’éternité ; la traduction exprime la permanence du souvenir.
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: ne craignez pas leur humiliation
  rationale: « Humiliation » rend le déshonneur subi publiquement, tout en laissant en note les nuances possibles de honte et d’opprobre.
theological_decisions:
- issue: Terme anthropologique désignant l’existence après la mort
  choice: esprit
  alternative: âme ; souffle
  rationale: « Esprit » correspond au champ sémantique de መንፈስ et préserve le langage propre au passage sans définir plus précisément la condition post mortem.
- issue: Nombre et construction de « votre esprit »
  choice: singulier grammatical conservé dans le texte
  alternative: « vos esprits vivront » ou « l’esprit de ceux d’entre vous qui sont morts »
  rationale: La construction éthiopienne associe un nom singulier à des destinataires pluriels et permet plusieurs analyses. Le texte principal reste proche de sa forme, tandis que la note signale l’autre lecture naturelle.
- issue: Titre divin ለዐቢይ
  choice: le Grand
  alternative: le Dieu grand ; Dieu
  rationale: Le texte emploie une épithète et non le nom explicite de Dieu. La conserver respecte le registre apocalyptique sans ajouter une identification absente de la formulation.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme des deux verbes de joie, le changement de la deuxième à la troisième personne et l’image « devant la face » sont maintenus afin de respecter la texture apocalyptique et les tensions grammaticales du passage.
