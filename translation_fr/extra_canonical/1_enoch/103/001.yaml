  source_fidelity: Le guèze transmet ici une formule de serment solennelle, répétée, et non une déclaration de connaissance ni la révélation d’un « mystère ». « Je vous le jure » rend donc correctement እምሕል dans ce contexte, malgré l’analyse divergente de la piste d’audit anglaise. La structure « par la gloire… ; par sa grandeur… » est préservée, ainsi que les titres majestueux sans expliciter leur référent.
  naturalness: Le français est moderne, solennel et fluide. « À vous les justes » est une apostrophe naturelle dans ce registre, et la répétition de « je vous le jure » restitue utilement le parallélisme emphatique du texte.
  terminology: « Les justes », « le Grand », « gloire », « souveraineté » et « grandeur » sont cohérents avec le registre enochique et ne surinterprètent pas le titre divin implicite. « Digne d’honneur » rend naturellement l’idée d’honoré/vénérable. La note sur le champ de መንግሥት est bien ancrée et ne force pas une option.
