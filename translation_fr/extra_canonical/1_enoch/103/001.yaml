base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: fr
  text: Et maintenant, je vous le jure, à vous les justes, par la gloire du Grand, digne d’honneur et puissant dans sa souveraineté[a] ; par sa grandeur, je vous le jure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son règne » ou « dans sa domination » ; le terme peut désigner la royauté, le règne ou le pouvoir souverain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et le marqueur temporel.
- source_word: እምሕል
  choice: je vous le jure
  rationale: Le verbe relève ici du serment. Sa répétition et les compléments introduits par « par » forment une déclaration solennelle ; la traduction ne lui ajoute donc pas la notion de « mystère », absente du texte guèze.
- source_word: ለክሙ
  choice: je vous / à vous
  rationale: Le suffixe de deuxième personne du pluriel désigne les destinataires du serment. La variation française évite une tournure artificielle tout en conservant ses deux occurrences.
- source_word: ጻድቃን
  choice: les justes
  rationale: Rend naturellement en français le substantif pluriel qui désigne le groupe des personnes justes.
- source_word: በስብሐቱ
  choice: par la gloire
  rationale: 'Dans la formule de serment, la préposition a une valeur instrumentale : le locuteur jure par la gloire du personnage désigné.'
- source_word: ለዐቢይ
  choice: du Grand
  rationale: Conserve l’épithète majestueuse sous forme de titre sans expliciter le référent par « Dieu ».
- source_word: ወለክቡር
  choice: digne d’honneur
  rationale: Exprime l’honneur et la dignité tout en distinguant ce terme de « gloire » dans la proposition précédente.
- source_word: ወዕዙዘ መንግሥት
  choice: puissant dans sa souveraineté
  rationale: 'Traite l’expression comme une qualification du même personnage : il est puissant quant à sa royauté ou à son pouvoir souverain, plutôt que de faire du « royaume » une entité indépendante.'
- source_word: ወበዕበዩ
  choice: par sa grandeur
  rationale: Poursuit la formule de serment et rattache clairement le suffixe possessif au Grand.
theological_decisions:
- issue: Référent du titre « le Grand »
  choice: Maintenir le titre « le Grand » sans ajouter « Dieu »
  alternative: Expliciter « Dieu » ou « le Seigneur »
  rationale: Le contexte indique vraisemblablement un référent divin, mais le guèze emploie une épithète. La traduction préserve cette formulation sans en imposer une identification plus explicite.
- issue: Nature de la déclaration du locuteur
  choice: Une formule de serment répétée
  alternative: Une déclaration de connaissance ou de révélation d’un mystère
  rationale: Le verbe guèze et la construction « par la gloire… par sa grandeur » indiquent un serment. La notion de mystère ne doit pas être importée dans le texte.
translation_notes:
  register: Registre solennel et actuel. La répétition de « je vous le jure » est volontairement conservée, de même que le titre majestueux « le Grand ». La ponctuation française clarifie la formule sans supprimer son parallélisme.
