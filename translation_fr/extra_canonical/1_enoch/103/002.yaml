base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: fr
  text: Car je connais le mystère, j’ai lu les tablettes du ciel[b], j’ai vu l’écrit saint[a], et j’ai trouvé ce qui y était écrit et compris ce qui les concernait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’écriture sainte » ou « l’écrit saint ». Le guèze emploie ici un nom et un adjectif au singulier, et non l’expression « l’écrit des saints ».
    reason: lexical_alternative
  - marker: b
    text: Les « tablettes du ciel » représentent, dans le langage apocalyptique, des archives ou des décrets célestes; l’image n’exige pas nécessairement qu’on les conçoive comme des objets matériels.
    reason: cultural_note
lexical_decisions:
- source_word: ምሥጢረ
  choice: le mystère
  rationale: Le terme désigne une réalité cachée ou un secret révélé. « Mystère » conserve ici le registre apocalyptique sans préciser indûment son contenu.
- source_word: አንበብኩ
  choice: j’ai lu
  rationale: Le passé composé exprime naturellement en français actuel l’action accomplie dont le locuteur tire sa connaissance présente.
- source_word: ፀፍፀፈ ሰማይ
  choice: les tablettes du ciel
  rationale: Cette traduction garde l’image concrète de registres célestes inscrits, courante dans la littérature apocalyptique, plutôt que de la remplacer par le terme plus général « livres ».
- source_word: ጽሕፈተ ቅድስተ
  choice: l’écrit saint
  rationale: 'Les deux mots sont au féminin singulier et forment un groupe nom-adjectif : « l’écrit saint » ou « l’écriture sainte ». Le singulier est donc conservé. « Écrit » évite que le lecteur comprenne nécessairement une désignation technique du canon biblique.'
- source_word: ውስቴቶሙ
  choice: y
  rationale: 'Le pronom locatif renvoie naturellement aux tablettes du ciel : « ce qui y était écrit ».'
- source_word: አኩዐ
  choice: compris
  rationale: Dans cette suite consacrée à la lecture d’écrits célestes, le verbe exprime le fait de saisir ou de comprendre ce qui a été découvert.
- source_word: በእንቲአሆሙ
  choice: ce qui les concernait
  rationale: Cette formulation rend le sens « à leur sujet » tout en maintenant le pronom masculin pluriel du texte source et sans en imposer l’antécédent.
theological_decisions:
- issue: Nature de « l’écrit saint »
  choice: Traduire au singulier par « l’écrit saint » sans identifier cet écrit à un corpus canonique particulier.
  alternative: « l’Écriture sainte » ou « les écrits des saints »
  rationale: La morphologie guèze indique un nom et un adjectif féminins singuliers, non un complément pluriel signifiant « des saints ». Le choix retenu respecte cette donnée tout en évitant d’importer une conception canonique ultérieure.
- issue: Référent du pronom final pluriel
  choice: Conserver le pronom sous la forme « les concernait » sans expliciter son référent.
  alternative: Nommer les tablettes, les écrits, les saints ou d’autres personnes évoquées par le contexte.
  rationale: Le texte présente un pronom masculin pluriel dont le référent immédiat n’est pas entièrement transparent. L’expliciter résoudrait une ambiguïté réelle du texte.
translation_notes:
  register: Français international actuel, digne et lisible. La coordination répétée respecte la progression solennelle du texte. « L’écrit saint » conserve le singulier grammatical tout en évitant l’association automatique de « l’Écriture sainte » avec un canon biblique déterminé. Le dernier pronom reste volontairement non explicité afin de préserver l’ambiguïté de la source.
