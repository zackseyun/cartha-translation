base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: fr
  text: Sachez qu’on fera descendre vos âmes[a] au Shéol[b], qu’elles seront malheureuses, et que leur détresse sera grande.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos esprits ». Le terme guèze peut avoir les deux sens.
    reason: lexical_alternative
  - marker: b
    text: Le Shéol est le séjour des morts dans la pensée juive ancienne.
    reason: cultural_note
  - marker: c
    text: La forme verbale peut aussi se traduire par « il fera descendre » ou « ils feront descendre ».
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: Sachez que
  rationale: Le suffixe objet anticipe ici la proposition qui suit; une traduction littérale telle que « connaissez-les, car » serait obscure en français. « Sachez que » rend naturellement cette construction.
- source_word: ለሲኦል
  choice: au Shéol
  rationale: Le nom traditionnel est conservé afin de préserver l’arrière-plan juif et apocalyptique du séjour des morts, sans le réduire à la tombe.
- source_word: ያወርዶዎሙ
  choice: on fera descendre
  rationale: Le verbe exprime clairement un mouvement vers le bas. La forme verbale peut être comprise avec un sujet indéterminé ou singulier; « on » préserve cette indétermination sans introduire un agent absent du contexte fourni.
- source_word: ለመናፍስቲክሙ
  choice: vos âmes
  rationale: Le terme peut désigner les âmes ou les esprits. Dans le contexte d’une descente au Shéol, « âmes » est naturel, tandis que l’autre possibilité est signalée en note.
- source_word: እኩያተ፡ ይከውና
  choice: elles seront malheureuses
  rationale: Le féminin pluriel du verbe s’accorde avec « âmes » et l’adjectif décrit leur condition mauvaise ou misérable; cette analyse respecte mieux la syntaxe que de faire de l’expression une qualification de la rétribution.
- source_word: ምንዳቤሆሙ
  choice: leur détresse
  rationale: Le nom désigne la détresse, l’affliction ou la tribulation. « Détresse » est clair et idiomatique en français moderne.
- source_word: ዐቢየ
  choice: grande
  rationale: L’adjectif qualifie la détresse et conserve la conclusion emphatique du verset.
theological_decisions:
- issue: Rendu de ሲኦል
  choice: Shéol
  alternative: le séjour des morts / la tombe
  rationale: « Shéol » conserve la texture conceptuelle du judaïsme ancien et évite d’identifier trop précisément ce lieu à la tombe ou à une conception ultérieure de l’enfer.
- issue: Rendu anthropologique de መናፍስት
  choice: âmes
  alternative: esprits
  rationale: Les deux sens sont possibles. « Âmes » convient au contexte post mortem, mais l’ambiguïté lexicale est préservée en note.
- issue: Analyse de ወእኩያተ፡ ይከውና፡ ምንዳቤሆሙ፡ ዐቢየ
  choice: qu’elles seront malheureuses, et que leur détresse sera grande
  alternative: et leur rétribution sera mauvaise et grande
  rationale: L’accord féminin pluriel de ይከውና avec « âmes » et le sens attesté de ምንዳቤ comme détresse ou affliction favorisent deux prédications parallèles plutôt qu’une « rétribution » mauvaise.
- issue: Agent de la descente au Shéol
  choice: on fera descendre
  alternative: il fera descendre / ils feront descendre
  rationale: La forme et la tradition de traduction permettent une hésitation sur l’agent. Le français indéfini « on » évite de trancher sans appui contextuel suffisant; les autres lectures sont consignées en note.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le rythme solennel de l’avertissement tout en évitant le calque syntaxique. « Malheureuses » exprime ici une condition misérable, non un simple manque de bonheur.
