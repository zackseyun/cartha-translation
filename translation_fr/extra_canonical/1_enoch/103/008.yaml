base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: fr
  text: Et dans les ténèbres, dans un piège et dans un feu ardent, votre esprit entrera, et dans le grand jugement[a]. Le grand jugement sera pour toutes les générations de l’éternité[b]. Malheur à vous, car vous n’avez pas de paix !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition peut aussi se rendre par « vers le grand jugement » ; elle marque ici une direction plutôt qu’un but.
    reason: alternative_reading
  - marker: b
    text: L’expression « toutes les générations de l’éternité » est inhabituelle. Elle souligne vraisemblablement la portée durable du jugement, plutôt qu’une sentence momentanée.
    reason: cultural_note
lexical_decisions:
- source_word: በጽልመት
  choice: dans les ténèbres
  rationale: Dans la série régie par le verbe « entrer », la préposition guèze prend une valeur directionnelle que le français exprime naturellement par « entrer dans ».
- source_word: በመርበብት
  choice: dans un piège
  rationale: Le substantif est singulier et évoque un dispositif destiné à capturer. « Piège » restitue clairement cette image sans imposer la forme concrète plus précise d’un filet.
- source_word: በላህብ ዘይነድድ
  choice: dans un feu ardent
  rationale: L’expression associe le feu ou la flamme à un verbe signifiant « brûler ». « Feu ardent » garde l’intensité de l’image dans un français digne et naturel.
- source_word: ኀበ ኵነኔ ዐባይ
  choice: jusque dans le grand jugement
  rationale: ኀበ a ici une force directionnelle. « Jusque dans » préserve cette orientation tout en distinguant ce complément de la série précédente et en évitant une lecture de but comme « pour le jugement ».
- source_word: ትበውእ መንፈስክሙ
  choice: votre esprit entrera
  rationale: 'Le nom et le verbe sont au singulier, tandis que le suffixe possessif renvoie à plusieurs destinataires : littéralement, « votre esprit ».'
- source_word: ኵነኔ ዐባይ
  choice: le grand jugement
  rationale: « Jugement » conserve l’étendue du terme judiciaire, qui peut comprendre comparution, verdict et sanction, sans le réduire à la seule condamnation.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: pour toutes les générations de l’éternité
  rationale: Cette formulation maintient l’expression apocalyptique inhabituelle et sa portée durable, au lieu de la simplifier en « pour toujours ».
- source_word: ኴሌ ለክሙ
  choice: Malheur à vous
  rationale: C’est la formule française consacrée et intelligible de dénonciation prophétique.
- source_word: እስመ አልብክሙ ሰላመ
  choice: car vous n’avez pas de paix
  rationale: La proposition donne directement la raison du malheur et conserve la notion de paix sans la paraphraser.
theological_decisions:
- issue: Sens de « votre esprit » dans le contexte du jugement
  choice: Conserver le singulier collectif ou distributif « votre esprit » conformément à la morphologie du guèze.
  alternative: « vos esprits » ou « vous-mêmes »
  rationale: Le texte nomme précisément l’esprit sans exposer une anthropologie complète. La traduction ne tranche donc pas les questions relatives à l’âme, au corps ou à l’état intermédiaire.
- issue: Portée de ኵነኔ
  choice: Traduire par « jugement ».
  alternative: « condamnation » ou « sentence »
  rationale: Même si le contexte est punitif, « jugement » préserve toute la portée judiciaire du terme et évite de substituer une conclusion doctrinale plus étroite.
- issue: Rapport entre l’entrée et le grand jugement
  choice: Conserver une relation directionnelle avec « jusque dans le grand jugement ».
  alternative: « pour le grand jugement »
  rationale: La préposition ኀበ indique d’abord une direction ou une destination. Cette traduction laisse subsister l’image spatiale et apocalyptique sans transformer explicitement le jugement en simple but.
translation_notes:
  register: Français international moderne, solennel et accessible. La répétition de « dans » conserve le rythme cumulatif de l’énoncé guèze. Le singulier « votre esprit » suit la morphologie de la source malgré l’adresse à plusieurs personnes.
