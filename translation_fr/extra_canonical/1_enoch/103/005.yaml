base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: fr
  text: 'Malheur à vous, pécheurs morts, lorsque vous mourez dans la richesse de vos péchés[a], et que ceux qui vous ressemblent disent à votre sujet : « Heureux sont ces pécheurs : ils ont vu tous leurs jours[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin transcrit porte une leçon difficile, mais il s’agit probablement de « dans la richesse de vos péchés ». Une autre lecture possible est : « dans vos péchés ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « ils ont vécu jusqu’au bout de leurs jours »; ils sont ainsi déclarés heureux parce qu’ils semblaient avoir bénéficié d’une vie pleinement accomplie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Conserve la force prophétique et judiciaire de la formule, dans un français biblique actuel et naturel.
- source_word: ምውታን፡ ኃጥኣን
  choice: pécheurs morts
  rationale: Rend explicitement les deux termes guèzes et maintient la répétition rhétorique avec « lorsque vous mourez ».
- source_word: ሶበ፡ ትመውቱ
  choice: lorsque vous mourez
  rationale: Exprime directement la valeur temporelle de la proposition sans atténuer son caractère saisissant.
- source_word: በብዕሲ፡ ኃጢአትክሙ
  choice: dans la richesse de vos péchés
  rationale: Suit la correction probable በብዕለ, « dans la richesse de », reconnue derrière la lecture OCR difficile, et préserve le lien entre péché, richesse et prospérité dans le contexte.
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: disent à votre sujet
  rationale: Rend naturellement en français la parole prononcée au sujet des pécheurs morts.
- source_word: እለ፡ ከማክሙ
  choice: ceux qui vous ressemblent
  rationale: Préserve la comparaison morale ou catégorielle sans la préciser davantage.
- source_word: ብፁዓን፡ እሙንቱ፡ ኃጥኣን
  choice: Heureux sont ces pécheurs
  rationale: « Heureux » restitue ici la formule de béatitude de façon idiomatique tout en laissant percevoir son ironie dans la bouche de personnes semblables aux pécheurs.
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: ils ont vu tous leurs jours
  rationale: Conserve l’image et l’ambiguïté de l’idiome guèze, susceptible d’évoquer une vie menée jusqu’à son plein terme.
theological_decisions:
- issue: Le jugement porté par les semblables des pécheurs morts
  choice: 'Maintenir la béatitude ironique : « Heureux sont ces pécheurs »'
  alternative: Paraphraser comme une simple appréciation de leur longue vie ou de leur prospérité
  rationale: Le contraste entre le « malheur » divin et l’évaluation humaine erronée doit rester perceptible sans être expliqué dans le corps du texte.
- issue: La relation entre richesse et péché
  choice: « dans la richesse de vos péchés »
  alternative: « dans vos péchés »
  rationale: La correction textuelle probable soutient une mention explicite de la richesse, cohérente avec la critique de la prospérité des pécheurs dans le contexte; la note signale néanmoins l’état difficile du témoin transcrit.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition délibérément étrange « pécheurs morts, lorsque vous mourez » est conservée en raison de sa présence explicite dans le guèze. Les guillemets français et une ponctuation claire distinguent la parole ironique des semblables des pécheurs.
