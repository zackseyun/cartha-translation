  - severity: low
    issue: Portée de « toute » légèrement élargie
    rationale: « Toutes sortes de souffrances » peut évoquer diverses catégories de souffrances, tandis que le texte porte littéralement sur « toute souffrance / tout malheur ». « Toute souffrance » conserve mieux la portée totalisante.
