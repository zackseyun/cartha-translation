base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: fr
  text: 'Vous, les justes et les bons qui êtes en vie, ne dites pas[a] : « Aux jours de notre détresse, nous avons peiné durement ; nous avons connu toute souffrance, rencontré beaucoup de malheurs, subi l’oppression et été réduits à un petit nombre[c] ; notre esprit s’est amoindri[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ne dites pas à propos des justes et des bons qui sont en vie : » La construction guèze permet difficilement de trancher entre une adresse directe et des paroles dites à leur sujet.'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « notre esprit est devenu petit », image qui peut évoquer le découragement, l’affaiblissement ou la perte de courage.'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « nous avons été diminués ». L’expression peut désigner une réduction du nombre ou, plus largement, un amoindrissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: Ne dites pas, vous les justes et les bons
  rationale: Le tour négatif pluriel introduit une interdiction. La relation exacte du suffixe et de la préposition avec « les justes et les bons » reste discutée ; le texte principal suit l’adresse directe, naturelle en français, et la lecture « à propos des » est signalée en note.
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: qui êtes en vie
  rationale: Rend naturellement l’expression prépositionnelle « dans la vie » sans lui attribuer d’emblée un sens spirituel ou eschatologique.
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: Aux jours de notre détresse, nous avons peiné durement
  rationale: Le passage est textuellement difficile, mais exprime clairement une période de détresse accompagnée d’un labeur éprouvant. Cette formulation conserve les deux idées sans prétendre lever toute incertitude.
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: nous avons connu toutes sortes de souffrances
  rationale: Le verbe « voir » peut idiomatiquement signifier « connaître, faire l’expérience de ». Le pluriel français évite l’expression peu naturelle « voir toute souffrance » tout en gardant l’ampleur de la plainte.
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: rencontré beaucoup de malheurs
  rationale: Le groupe associe de nombreuses choses mauvaises à un verbe signifiant trouver ou rencontrer. « Malheurs » convient ici aux épreuves subies sans transformer le propos en jugement moral abstrait.
- source_word: ወተወጻዕነ
  choice: subi l’oppression
  rationale: Le verbe passif exprime l’oppression, l’injustice ou la violence subie ; cette traduction préserve l’idée d’un tort infligé par autrui.
- source_word: ወውኅድነ
  choice: été réduits à un petit nombre
  rationale: La formulation concrète indique vraisemblablement une diminution numérique. Elle est plus claire en français que le calque « rendus peu nombreux ».
- source_word: ወንእስት፡ መንፈስነ
  choice: notre esprit s’est amoindri
  rationale: Conserve la métaphore d’un esprit devenu petit ou diminué, sans la réduire exclusivement au découragement, à la faiblesse ou à la perte de courage.
theological_decisions:
- issue: Sens de « qui sont dans la vie »
  choice: Les justes et les bons qui sont actuellement en vie
  alternative: Ceux qui appartiennent à la vraie vie ou à la vie du monde à venir
  rationale: La plainte porte sur les souffrances présentes des justes. « Qui êtes en vie » rend ce sens local probable tout en évitant une interprétation doctrinale ajoutée.
- issue: Nature de l’amoindrissement de l’esprit
  choice: Maintien d’une image générale d’amoindrissement intérieur
  alternative: Découragement, faiblesse spirituelle ou perte de courage
  rationale: Le texte ne précise pas quel aspect intérieur est visé ; la traduction préserve donc l’ouverture de la métaphore.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la lamentation est maintenu par une succession de verbes, tandis que les calques guèzes peu naturels sont explicités en notes. Les ambiguïtés syntaxiques et psychologiques réelles ne sont pas résolues de manière confessionnelle.
