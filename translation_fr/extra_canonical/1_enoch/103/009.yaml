  verdict: revise
  source_fidelity: 'La traduction rend avec justesse la plainte cumulative : détresse et labeur, expérience de toute souffrance, nombreux maux, oppression, réduction à un petit nombre, puis amoindrissement de l’esprit. « Subi l’oppression » restitue bien le passif de ወተወጻዕነ et ne l’affaiblit pas en une diminution générale. La relation syntaxique entre l’interdiction et « les justes et les bons » demeure ambiguë ; la note la préserve adéquatement.'
  naturalness: Le registre est globalement naturel, digne et accessible. Toutefois, « Ne dites pas, vous les justes et les bons » est une apostrophe peu idiomatique en français moderne. Le déplacement de l’apostrophe en tête de phrase rend l’adresse directe claire et fluide. « Toutes sortes de souffrances » élargit légèrement « toute souffrance » ; la formulation révisée conserve mieux l’ampleur totalisante du texte sans devenir un calque lourd.
  terminology: « Justes », « bons », « détresse », « oppression », « réduits à un petit nombre » et « esprit s’est amoindri » sont appropriés. « Esprit » maintient volontairement l’ouverture de መንፈስ et la note explique l’image sans en imposer une interprétation psychologique ou doctrinale.
