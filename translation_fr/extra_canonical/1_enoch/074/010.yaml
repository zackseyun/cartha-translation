base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: fr
  text: Et cinq jours sont ajoutés[a], et, pour le soleil, le compte atteint trente jours. Tous les jours qui lui reviennent pour l’une de ces cinq années, une fois le compte achevé[c], s’élèvent à trois cent soixante-quatre jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien transmis est difficile et porte littéralement une expression qui peut se lire « cinq années ». Le contexte calendaire et le total de 364 jours indiquent toutefois qu’il est question ici de cinq jours supplémentaires.
    reason: textual_variant
  - marker: b
    text: Voir le système calendaire plus large du Livre astronomique, où l’année compte 364 jours plutôt que de suivre un calcul lunaire.
    reason: cross_reference
  - marker: c
    text: 'Autre traduction possible de cette phrase difficile : « et tous les jours assignés à l’année s’élèvent à trois cent soixante-quatre jours, lorsque ces cinq jours sont ajoutés pour la compléter ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ይትዌሰክ፡ ኃምስቱ፡ ዓመት
  choice: cinq jours sont ajoutés
  rationale: Le texte transmis porte littéralement une expression pouvant se lire « cinq années », mais le contexte calendaire et le total annuel de 364 jours indiquent ici des jours supplémentaires. La note signale cette difficulté textuelle.
- source_word: ለፀሐይ
  choice: pour le soleil
  rationale: Cette formulation conserve le cadre astronomique et le rapport explicite au parcours du soleil.
- source_word: ሠላሳ፡ መዋዕለ
  choice: trente jours
  rationale: Expression calendaire directe et naturelle en français.
- source_word: ኵሎሙ፡ መዋዕለ፡ ይበጽሕዎ፡ ለዓመት
  choice: tous les jours qui lui reviennent pour […] année […] s’élèvent à
  rationale: Le verbe exprime l’idée d’atteindre un total. « S’élèvent à » rend clairement sa valeur numérique, tandis que « lui reviennent » préserve le lien pronominal du texte.
- source_word: ፭እምእሉኩ፡ ፭ዓመት፡ ተመሊኦሙ
  choice: pour l’une de ces cinq années, une fois le compte achevé
  rationale: Cette lecture suit la correction contextuelle du premier chiffre en « une » et conserve la référence à un cycle de cinq années. « Une fois le compte achevé » rend le participe sans rattachement syntaxique excessivement assuré.
- source_word: ፻፷ወ፰ወረቡዐ፡ መዋዕለ
  choice: trois cent soixante-quatre jours
  rationale: Le total de 364 jours est explicite et central dans le calendrier schématique du Livre astronomique.
theological_decisions:
- issue: Nature des cinq éléments ajoutés
  choice: Comprendre qu’il s’agit de cinq jours supplémentaires.
  alternative: Traduire littéralement la forme transmise par « cinq années sont ajoutées ».
  rationale: Le contexte et le total annuel de 364 jours favorisent nettement « jours », mais l’état difficile du texte est signalé en note plutôt que dissimulé.
- issue: Rapport entre l’année et le cycle de cinq ans
  choice: Conserver « l’une de ces cinq années » dans le texte principal.
  alternative: Reformuler tout le passage comme une simple description des cinq jours complémentaires d’une seule année.
  rationale: La proposition transmise semble évoquer un cycle de cinq ans. La traduction conserve cette tension au lieu d’uniformiser entièrement le verset selon le seul schéma annuel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste accessible sans employer le terme technique « épagomènes ». Les difficultés numériques et syntaxiques du texte éthiopien sont préservées dans les notes, tandis que le texte principal présente la lecture contextuellement la plus cohérente.
