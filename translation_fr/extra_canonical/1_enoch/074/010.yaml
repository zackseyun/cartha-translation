review_pass:
  verdict: revise
  source_fidelity: Le texte principal transforme « cinq années » (ዓመት) en « cinq jours », bien que la note reconnaisse cette lecture transmise. Le contexte de 364 jours rend la leçon difficile, mais ne permet pas de supprimer de façon certaine cette ambiguïté du texte éthiopien. La formulation doit conserver « années » dans le corps du texte et présenter « jours » comme une solution contextuelle en note.
  naturalness: Le français est globalement clair, mais « une fois le compte achevé » introduit un « compte » qui n’est pas exprimé et rend l’antécédent imprécis. « Pour le soleil, le compte atteint trente jours » est recevable comme rendu prudent d’une construction difficile, tout en restant manifestement étrange comme le texte source.
  terminology: « Soleil », « année » et « jours » sont appropriés. Le terme technique « épagomènes » n’est pas nécessaire. La note doit distinguer clairement la leçon littérale « années » de la restitution contextuelle « jours ».
  issues:
  - severity: high
    issue: Le texte traduit « cinq jours » là où le texte éthiopien transmis porte « cinq années ».
    rationale: Même si cette leçon est difficile dans le contexte calendaire, elle doit être conservée dans le texte principal ou signalée par une traduction explicitement conjecturale. La note actuelle ne suffit pas à compenser une substitution non marquée.
  - severity: medium
    issue: « Une fois le compte achevé » ajoute un référent absent et atténue la difficulté syntaxique du texte.
    rationale: Le participe final doit être rendu sans introduire un « compte » non exprimé; son rattachement reste incertain dans la leçon transmise.
  - severity: low
    issue: La note c propose une lecture avec « ces cinq jours » sans préciser qu’il s’agit d’une restitution contextuelle.
    rationale: Cette formulation peut être maintenue comme solution de sens, à condition de ne pas la présenter comme une simple autre traduction équivalente de la leçon transmise.
  revised_text: Et cinq années sont ajoutées[a], et, pour le soleil, le compte atteint trente jours. Tous les jours qui lui reviennent pour l’une de ces cinq années, une fois achevée[c], s’élèvent à trois cent soixante-quatre jours[b].
  revised_footnotes:
  - marker: a
    text: Le texte éthiopien transmis porte littéralement « cinq années ». Cette leçon est difficile dans le contexte calendaire; plusieurs interprètent donc l’expression comme une corruption ou une forme fautive pour « cinq jours supplémentaires ».
    reason: textual_variant
  - marker: b
    text: Voir le système calendaire plus large du Livre astronomique, où l’année compte 364 jours plutôt que de suivre un calcul lunaire.
    reason: cross_reference
  - marker: c
    text: 'La syntaxe éthiopienne de cette portion est difficile. En suivant le contexte, on peut comprendre : « ... tous les jours assignés à l’année s’élèvent à trois cent soixante-quatre jours, lorsque cinq jours supplémentaires la complètent. »'
    reason: alternative_rendering
  revision_rationale: La révision rétablit la leçon explicitement transmise, « cinq années », dans le texte principal, sans nier que le contexte puisse soutenir une restitution « cinq jours ». Elle évite aussi l’ajout interprétatif de « compte achevé » et conserve l’irrégularité du passage dans une note explicative, conformément à la nécessité de préserver une ambiguïté textuelle réelle.
