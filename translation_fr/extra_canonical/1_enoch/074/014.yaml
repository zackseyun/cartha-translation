base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: fr
  text: Quant à la lune seule[c], le nombre de ses jours atteint mille soixante-deux jours sur trois ans[b], et sur cinq ans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière expression, « et sur cinq ans », paraît incomplète dans le témoin guèze fourni; un nombre ou une suite de mots manque peut-être à la fin de la ligne.
    reason: textual_variant
  - marker: b
    text: Ce verset appartient à un calcul calendérique du Livre astronomique. « Le nombre de ses jours atteint » signifie que le total s’élève à cette quantité.
    reason: cultural_note
  - marker: c
    text: 'On pourrait aussi traduire le début : « Pour le mois pris isolément ». Le mot guèze peut désigner soit la lune, soit le mois; le total de 1 062 jours en trois ans favorise ici « la lune ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ለወርኅ
  choice: quant à la lune
  rationale: ወርኅ peut désigner le mois ou la lune. Ici, le total de 1 062 jours sur trois ans correspond à 354 × 3 et indique un calcul propre à la lune; « quant à » rend naturellement la relation introduite par ለ.
- source_word: ለባሕቲቱ
  choice: seule
  rationale: Le terme signifie « seule » ou « à elle seule » et distingue ici le calcul lunaire considéré isolément.
- source_word: ይበጽሕ
  choice: atteint
  rationale: Dans un énoncé numérique, le verbe exprime l'idée d'atteindre un total ou de s'élever à une quantité.
- source_word: መዋዕሊሁ
  choice: le nombre de ses jours
  rationale: Le substantif pluriel avec suffixe signifie littéralement « ses jours »; l'ajout de « le nombre de » explicite sans altérer le sens qu'il s'agit d'un total calendérique.
- source_word: ለ፫ዓም
  choice: sur trois ans
  rationale: En français, « sur trois ans » exprime clairement la période au cours de laquelle le total est calculé.
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: mille soixante-deux jours
  rationale: La suite numérique vaut littéralement 1 000 + 60 + 2, suivie du nom « jours ».
- source_word: ወለ፭ ዓም
  choice: et sur cinq ans
  rationale: La conjonction et la préposition introduisent une seconde période. Le témoin fourni ne conserve toutefois aucun total correspondant après cette expression.
theological_decisions:
- issue: Énoncé astronomique dont la proposition finale paraît incomplète ou corrompue
  choice: Traduire sans complément conjectural la formule conservée « et sur cinq ans », tout en signalant la lacune probable.
  alternative: Compléter le total des cinq ans d'après une autre édition ou lisser la phrase en une règle calendérique générale.
  rationale: Le témoin guèze fourni se termine après « et sur cinq ans ». Une traduction transparente respecte mieux l'état du texte qu'une restitution non attestée dans la source donnée.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le caractère technique du calcul tout en rendant explicite la notion de total. Les marqueurs de notes sont placés immédiatement après les éléments concernés.
