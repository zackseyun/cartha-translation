lexical_decisions:
- source_word: ከመዝ
  choice: Ainsi
  rationale: Rend la reprise conclusive ou récapitulative qui introduit l’observation visionnaire, dans un français naturel et digne.
- source_word: ርኢኩ
  choice: j’ai vu
  rationale: Traduction directe du verbe de perception à la première personne, adaptée au récit visionnaire.
- source_word: ምግባሮሙ
  choice: leur fonctionnement
  rationale: Dans le contexte astronomique, le terme désigne l’activité ou l’opération des luminaires plutôt que des actes moraux.
- source_word: በከመ
  choice: comment
  rationale: Introduit naturellement en français le contenu de ce que le voyant a observé.
- source_word: ይሠርቅ
  choice: se lève
  rationale: La forme avec ሠ correspond au verbe employé pour le lever d’un luminaire, et non au verbe signifiant « voler » ou « se dérober ».
- source_word: አውራኅ
  choice: la lune
  rationale: Le mot est morphologiquement pluriel et peut désigner des lunes ou des mois; dans cette description d’un cycle répété, le français emploie naturellement le singulier générique « la lune ».
- source_word: የዓርብ
  choice: se couche
  rationale: Expression française idiomatique pour le mouvement vespéral du soleil.
- source_word: ፀሐይ
  choice: le soleil
  rationale: Rendu direct du luminaire nommé.
- source_word: በእማንቱ መዋዕል
  choice: en ces jours-là
  rationale: Conserve la référence temporelle démonstrative et le ton apocalyptique, sans archaïsme excessif.
