base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: fr
  text: En quinze parties, il complète toute sa lumière à l’est[a], et en quinze parties, il complète toute son obscurité à l’ouest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nombre du texte transcrit par OCR semble corrompu. Dans ce contexte lunaire et dans les deux propositions parallèles, on restitue vraisemblablement « quinze ». Le mot rendu par « parties », littéralement « mains », désigne ici des portions ou divisions.
    reason: textual_variant
lexical_decisions:
- source_word: በ፭*፷፯ እደ
  choice: en quinze parts
  rationale: Le texte transmis par OCR est manifestement corrompu dans le nombre. Le contexte du cycle lunaire et la révision critique indiquent ፲፭, « quinze », tandis que እደ désigne ici des parts ou portions (littéralement des « mains »), non des jours.
- source_word: ይፌጽም
  choice: il complète
  rationale: La forme est rendue activement et conserve le caractère schématique de la description astronomique.
- source_word: ኵሎ ብርሃኖ
  choice: toute sa lumière
  rationale: Cette formulation exprime à la fois la totalité et le possessif, tout en gardant l’image concrète de la lumière de l’astre.
- source_word: በሠርቅ
  choice: à l’est
  rationale: Le sens locatif convient au cadre astronomique et se lit naturellement en français.
- source_word: ኵሎ ጽልመተ
  choice: toute son obscurité
  rationale: « Obscurité » préserve le parallélisme avec « lumière » sans transformer le substantif en processus interprétatif d’assombrissement.
- source_word: በምዕራብ
  choice: à l’ouest
  rationale: Ce rendu locatif maintient la symétrie entre l’est et l’ouest.
theological_decisions:
- issue: Faut-il expliciter le phénomène astronomique décrit par la formule répétée ?
  choice: Conserver la formulation littérale « il complète » pour la lumière comme pour l’obscurité.
  alternative: « atteint sa pleine lumière… devient entièrement obscur » ou « achève son parcours de lumière… d’obscurité »
  rationale: Une formulation plus explicative préciserait un phénomène que le témoin guèze laisse sous une forme mesurée et imagée. Le parallélisme et la tension du texte sont donc conservés.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme formel entre lumière/obscurité et est/ouest est maintenu. « Parts » est retenu comme terme simple de fractionnement, avec une note pour signaler la difficulté textuelle et l’image littérale.
