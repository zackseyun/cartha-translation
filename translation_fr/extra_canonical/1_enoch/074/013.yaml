base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: fr
  text: Pour trois ans, il y a mille quatre-vingt-douze jours[a], et pour cinq ans, mille huit cent vingt jours et huit ; ainsi, pour huit ans, il y a deux mille neuf cent douze jours, et dix et deux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ligne éthiopienne de ce témoin établi à partir d’un texte transcrit par OCR présente des difficultés numériques. Le verset semble additionner les jours correspondant à des périodes de trois, cinq et huit ans, mais sa formulation finale pourrait conserver un nombre scindé ou placé dans un ordre inhabituel. Une traduction normalisée donnerait : « Pour trois ans, 1 092 jours ; pour cinq ans, 1 828 jours ; ainsi, pour huit ans, 2 912 jours. »'
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: pour trois ans
  rationale: La préposition ለ devant une durée introduit ici le total correspondant à cette période dans un calcul astronomique.
- source_word: መዋዕለ
  choice: jours
  rationale: Terme courant désignant les jours, employé ici comme unité de calcul calendaire.
- source_word: ፲፻ወ፺ወክልኤ
  choice: mille quatre-vingt-douze
  rationale: 'La suite numérique se lit par addition : 1 000 + 90 + 2 = 1 092.'
- source_word: ወለ፭ዓመት
  choice: et pour cinq ans
  rationale: Cette expression poursuit le même schéma de calcul que la première proposition.
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: mille huit cent vingt jours et huit
  rationale: Le témoin transcrit place « jours » avant le dernier huit. La traduction conserve cette structure additive inhabituelle au lieu de la normaliser silencieusement en « mille huit cent vingt-huit jours ».
- source_word: ከመ፡ ይኩን
  choice: ainsi, … il y a
  rationale: Dans ce contexte, l’expression introduit le résultat du calcul précédent plutôt qu’un but.
- source_word: ለ፰ዓመት
  choice: pour huit ans
  rationale: Même construction temporelle et calculatoire que « pour trois ans » et « pour cinq ans ».
- source_word: ፪ወ፱፻፲፪
  choice: deux mille neuf cent douze
  rationale: 'La suite se lit par addition : 2 000 + 900 + 12 = 2 912.'
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: et dix et deux jours
  rationale: Cette formulation reproduit l’expression additive explicite du texte transmis. Malgré sa difficulté numérique, elle est maintenue afin de rendre le témoin contrôlable.
theological_decisions:
- issue: Calcul calendaire dans une ligne éthiopienne difficile transmise par OCR
  choice: Conserver la suite des totaux pour trois, cinq et huit ans, y compris l’ordre inhabituel des derniers nombres.
  alternative: Normaliser en « 1 092 jours ; 1 828 jours ; ainsi 2 912 jours » et supprimer la formule finale.
  rationale: Il ne s’agit pas d’un enjeu doctrinal, mais de transparence textuelle. Puisque la précision numérique est essentielle dans le Livre astronomique et que le témoin disponible est difficile, la traduction signale la difficulté au lieu de la résoudre par conjecture.
