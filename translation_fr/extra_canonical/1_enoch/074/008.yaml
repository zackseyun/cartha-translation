  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
translation:
  language: fr
  text: De nouveau, le soleil entre pendant sept jours par la quatrième porte[a], celle d’où il sort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la quatrième porte »; la préposition guèze peut indiquer le lieu ou le passage associé à cette porte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: De nouveau
  rationale: Marque la reprise d’une étape dans la séquence cyclique décrite.
- source_word: ይገብእ
  choice: il revient
  rationale: Le verbe ገብአ exprime ici le retour, sens adapté au mouvement cyclique du soleil; le pronom reprend implicitement celui-ci.
- source_word: ሰቡዐ መዋዕለ
  choice: pendant sept jours
  rationale: Rend clairement la durée calendérique exprimée par le syntagme.
- source_word: በራብዕት ኆኅት
  choice: à la quatrième porte
  rationale: La préposition በ peut désigner le lieu ou le moyen; « à » préserve ici l’idée du retour à la porte sans imposer un passage à travers elle.
- source_word: እንተ እምኔሃ
  choice: celle d’où
  rationale: Rattache sans ambiguïté l’expression relative à la porte qui vient d’être mentionnée.
- source_word: ይወፅእ ፀሐይ
  choice: sort le soleil
  rationale: Restitue directement l’image concrète du soleil qui sort de la porte.
