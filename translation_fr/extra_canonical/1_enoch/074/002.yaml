  naturalness: La phrase actuelle est lourdement redondante et son ajout « ainsi que leurs positions » désorganise la syntaxe. Une ponctuation par deux-points permet de conserver l’énumération et la répétition voulue sans créer d’ambiguïté.
  terminology: « Uriel », « l’ange saint », « positions », « mois » et « l’aspect de leurs lumières » conviennent au contexte astronomique et au registre français moderne. Le pluriel « lumières » reproduit le pluriel source mieux que le singulier du projet.
