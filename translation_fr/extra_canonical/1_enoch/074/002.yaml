base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: fr
  text: 'Tout ce qu’Uriel, l’ange saint qui les dirige tous, m’a montré, je l’ai consigné : leurs positions, comme il me les avait montrées ; j’ai aussi consigné leurs mois tels qu’ils sont, ainsi que l’aspect de leurs lumières jusqu’à l’accomplissement de quinze jours.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe condensée du guèze peut aussi se ponctuer ainsi : « … l’aspect de leurs lumières, jusqu’à ce que quinze jours soient accomplis. » La relation exacte entre cet aspect et la période de quinze jours demeure implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኵሎዘ
  choice: tout cela
  rationale: Cette expression récapitule l’ensemble de ce qui est montré; « tout cela » est naturel en français et conserve cette portée globale.
- source_word: አርአየኒ
  choice: me l’a montré
  rationale: Le verbe signifie faire voir ou montrer; ce choix garde le caractère visuel de la scène sans ajouter l’idée plus théologique de révélation.
- source_word: መልአክ ቅዱስ
  choice: l’ange saint
  rationale: Rendu direct et usuel du titre céleste.
- source_word: መራሒሆሙ ለኵሎሙ
  choice: qui les dirige tous
  rationale: Le terme désigne celui qui conduit ou dirige; la formulation conserve aussi le complément « tous » présent dans le guèze.
- source_word: ምንባሪሆሙ
  choice: leurs positions
  rationale: Dans ce contexte astronomique, le mot désigne les emplacements ou stations ordonnés des luminaires; « positions » est clair et non domestique.
- source_word: አውራኂሆሙ
  choice: leurs mois
  rationale: Le mot est le pluriel de « mois » en guèze. Le rendre par « chemins » ou « trajectoires » confondrait ce lexème avec un terme de parcours.
- source_word: በከመ ሀለዉ
  choice: tels qu’ils sont
  rationale: La locution indique la conformité à leur état ou à leur ordre effectif.
- source_word: ርእየ ብርሃኖሙ
  choice: l’aspect de leur lumière
  rationale: ርእየ est ici compris comme la forme construite du nom « aspect, apparition, vue », et non comme un verbe à la première personne « je vis ».
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: jusqu’à l’accomplissement de quinze jours
  rationale: La tournure exprime l’achèvement d’une période de quinze jours tout en laissant ouverte la relation syntaxique exacte avec « l’aspect de leur lumière ».
theological_decisions:
- issue: Référent des pronoms pluriels
  choice: Conserver les pronoms sans expliciter leur référent
  alternative: Ajouter « les luminaires » ou « les corps célestes »
  rationale: Le contexte astronomique indique vraisemblablement les luminaires, mais le verset les désigne seulement par des pronoms. Ne pas les développer préserve la formulation et son éventuelle tension avec les êtres angéliques qui leur sont associés.
- issue: Valeur grammaticale de ርእየ
  choice: Le nom « l’aspect »
  alternative: Le verbe « je vis »
  rationale: La morphologie soutient ici une forme nominale construite. Ce choix évite d’introduire un acte d’observation à la première personne qui n’est pas explicitement exprimé par cette forme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « leurs positions » est maintenue parce qu’elle structure le texte source. « Mois » suit directement le lexème guèze malgré la consultation anglaise qui proposait « paths ».
