base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: fr
  text: Pendant sept jours, il sort et décrit un circuit, puis il revient par la porte d’où sort le soleil. Il achève toute sa lumière et s’éloigne du soleil[a], puis il entre pendant huit jours par la sixième porte d’où sort le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet des verbes n’est pas exprimé dans ce verset. Le contexte indique probablement la lune, mais le texte ne la nomme pas ici. L’expression « il achève toute sa lumière » peut décrire l’astre atteignant la pleine mesure de son éclat avant de s’éloigner du soleil.
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: il sort
  rationale: Le verbe exprime le mouvement vers l’extérieur. « Il sort » conserve la formule astronomique répétée sans préciser davantage le sujet implicite.
- source_word: ሰብዓተ መዋዕለ
  choice: pendant sept jours
  rationale: L’expression indique une durée; cette formulation est naturelle et précise en français.
- source_word: የአውድ
  choice: décrit un circuit
  rationale: Le verbe évoque un mouvement circulaire ou un tour. Cette expression convient au contexte astronomique sans imposer une représentation plus précise.
- source_word: ይገብእ ካዕበ
  choice: il revient
  rationale: Dans la séquence sortie–circuit–retour, le sens contextuel est celui d’un retour. Le français « revient » rend déjà l’idée portée par « de nouveau ».
- source_word: በኆኅት
  choice: par la porte
  rationale: ኆኅት désigne une porte ou un portail, terme adapté à l’architecture cosmologique du passage et distinct du mot usuel pour « fenêtre ».
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: Il achève toute sa lumière
  rationale: La formulation conserve le caractère technique et quelque peu énigmatique de l’expression, qui semble décrire l’accomplissement de la pleine mesure de lumière.
- source_word: ወይፀንን እምፀሐይ
  choice: et s’éloigne du soleil
  rationale: Le verbe exprime une séparation ou un retrait. « S’éloigne » restitue le mouvement relationnel sans élaborer un modèle cosmologique.
- source_word: ስሙነ መዋዕለ
  choice: pendant huit jours
  rationale: Comme la première expression temporelle, celle-ci marque une durée.
- source_word: በሳድስት ኆኅት
  choice: par la sixième porte
  rationale: Le nombre ordinal et le terme désignant le portail sont rendus littéralement et de manière cohérente avec leur première occurrence.
theological_decisions:
- issue: Identité du sujet en mouvement
  choice: Employer le pronom masculin « il » sans ajouter explicitement « la lune ».
  alternative: Répéter ou suppléer « la lune » comme sujet.
  rationale: Le contexte désigne vraisemblablement l’astre lunaire, mais la phrase guèze enchaîne des verbes à la troisième personne sans répéter le nom. Le pronom préserve cette implicitation. Le masculin grammatical français évite en outre de transformer tacitement le pronom en « elle », qui identifierait nécessairement le sujet à « la lune ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la séquence astronomique du guèze, tout en évitant les lourdeurs. « Porte » est retenu plutôt que « fenêtre » pour ኆኅት. Le point médian de la longue chaîne verbale améliore la lisibilité sans modifier les rapports logiques du texte.
