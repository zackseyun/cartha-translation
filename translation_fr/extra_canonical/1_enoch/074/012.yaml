base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: fr
  text: Le soleil et les étoiles font venir toutes les années avec exactitude[a] ; conformément à leurs positions — pour toujours —, ils ne devancent ni ne retardent d’un seul jour, mais ils font tourner l’année[c] dans la justice[d], avec exactitude, en trois cent soixante-quatre jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec précision » ; le terme guèze souligne le soin et l’exactitude du calcul des luminaires.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le verbe signifie « changer » ou « faire passer ». Dans ce contexte, on peut aussi comprendre « font tourner l’année » ; certaines traductions rendent l’idée par « achèvent l’année ».
    reason: source_ambiguity
  - marker: d
    text: On pourrait comprendre « correctement » ou « comme il convient », mais « dans la justice » conserve la portée morale et théologique du terme guèze.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያመጽእሙ፡ ለዓመታት
  choice: font venir toutes les années
  rationale: Le causatif exprime l’idée de faire venir ou d’introduire les années. Cette formulation conserve l’image calendaire concrète sans la réduire à « marquent ».
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: avec exactitude
  rationale: Le terme évoque le soin et la précision. Dans ce contexte astronomique, « avec exactitude » rend naturellement sa valeur adverbiale aux deux occurrences.
- source_word: ከመ፡ ምንባሪሆሙ፡ ለዓለም
  choice: conformément à leurs positions, pour toujours
  rationale: Le rendu conserve le nom « leurs positions » et comprend ከመ au sens de « conformément à ». « Pour toujours » traduit séparément la portée temporelle de ለዓለም.
- source_word: ኢይበድሩ፡ ወኢይጐንዱ፡ አሐተ፡ ዕለተ
  choice: ils ne prennent ni avance ni retard d’un seul jour
  rationale: La paire négative décrit une absence de décalage en avant ou en arrière par rapport à l’ordre fixé. La tournure française est claire et symétrique.
- source_word: ይዌልጡ፡ ዓመተ
  choice: ils font passer l’année
  rationale: Le verbe ወለጠ signifie fondamentalement changer, faire passer ou faire tourner. « Font passer l’année » garde cette valeur de transition tout en exprimant naturellement le déroulement du cycle annuel, sans imposer le sens lexicalement plus éloigné de « compléter ».
- source_word: በጽድቅ
  choice: dans la justice
  rationale: Le mot porte une dimension morale et théologique qui dépasse la seule correction technique. Le rendu littéral maintient le lien entre ordre cosmique et justice.
- source_word: ፫፻ወ፷ወረቡዕ፡ መዋዕለ
  choice: trois cent soixante-quatre jours
  rationale: Le nombre est central dans le calendrier schématique du Livre astronomique et doit être exprimé sans ambiguïté.
theological_decisions:
- issue: Faut-il réduire በጽድቅ à une indication purement technique de régularité calendaire ?
  choice: dans la justice
  alternative: correctement / comme il convient
  rationale: Le texte emploie le terme fort de « justice ». Le conserver respecte la présentation théologiquement chargée de l’ordre cosmique, plutôt que de la ramener à une simple exactitude scientifique.
- issue: Faut-il interpréter ይዌልጡ comme l’achèvement de l’année ?
  choice: ils font passer l’année
  alternative: ils achèvent l’année / ils font tourner l’année
  rationale: La racine signifie changer ou faire passer. Le choix principal préserve cette valeur tout en restant idiomatique ; la note signale l’interprétation cyclique et l’autre traduction traditionnelle possible sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure cosmologique du texte et répète « avec exactitude » comme le guèze, tout en employant une ponctuation qui clarifie les propositions. Les ambiguïtés lexicales importantes sont signalées sans imposer une lecture confessionnelle.
