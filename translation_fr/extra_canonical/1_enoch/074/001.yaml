base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/001.yaml
  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: fr
  text: 'Et je vis pour elle un autre parcours et une ordonnance : selon cette ordonnance, elle accomplit le parcours des mois.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe de la fin du verset est difficile. On peut aussi traduire : « elle accomplit son parcours, le parcours des mois ». Le mot guèze désigne les « mois » ou, selon le contexte, les « lunes », et non les « vents ».'
    reason: ambiguïté syntaxique et précision lexicale
lexical_decisions:
- source_word: ካልአ
  choice: un autre
  rationale: Introduit un parcours supplémentaire dans la série des ordonnances cosmiques révélées.
- source_word: ምሕዋረ
  choice: parcours
  rationale: Désigne ici un mouvement réglé ou un circuit cosmique; « parcours » reste naturel sans imposer une terminologie astronomique moderne.
- source_word: ትእዛዘ
  choice: ordonnance
  rationale: Le contexte évoque une règle faisant autorité et gouvernant le mouvement cosmique, plutôt qu’un ordre verbal ponctuel.
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend simplement la formule de compte rendu visionnaire.
- source_word: ሎቱ
  choice: pour elle
  rationale: Le pronom renvoie vraisemblablement à la lune, sujet du contexte immédiat; le féminin français rend cet antécédent naturel tout en maintenant la relation exprimée par le guèze.
- source_word: በውእቱ ትእዛዝ
  choice: selon cette ordonnance
  rationale: Exprime la norme directrice conformément à laquelle le mouvement s’effectue; « selon » est plus idiomatique en français que « par » dans ce contexte.
- source_word: ይገብር
  choice: elle accomplit
  rationale: Conserve la valeur active d’exécuter ou d’effectuer le parcours.
- source_word: ምሕዋሮ ዘአውራኅ
  choice: le parcours de ses mois
  rationale: አውራኅ signifie « mois » (éventuellement « lunes »), non « vents ». Le possessif français rattache naturellement les cycles mensuels à l’astre, mais la construction demeure difficile.
theological_decisions:
- issue: Nature de l’ordonnance cosmique
  choice: Une règle établie gouverne le mouvement de l’astre.
  alternative: Un commandement directement adressé à l’astre.
  rationale: Dans ce contexte astronomique, le terme décrit surtout l’organisation fixe du cosmos; « ordonnance » conserve néanmoins l’idée d’une autorité qui institue cet ordre.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « ordonnance » et de « parcours » reflète celle du texte source; le féminin suppose le renvoi contextuel à la lune.
