base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/005.yaml
  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: fr
  text: Pendant deux mois, on se couche avec le soleil par ces deux portes centrales, à savoir la troisième et la quatrième porte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet du verbe n’est pas exprimé dans cette phrase. Le contexte indique probablement la lune. La formulation « ces deux portes centrales, à savoir la troisième et la quatrième porte » conserve la désignation quelque peu redondante du texte éthiopien.
    reason: source_ambiguity
lexical_decisions:
- source_word: በክልኤ፡ ወርኅ
  choice: Pendant deux mois
  rationale: ክልኤ est le cardinal « deux », non l’ordinal « deuxième » ; በ introduit ici une durée.
- source_word: የዓርብ
  choice: elle se couche
  rationale: Forme verbale à l’inaccompli, troisième personne du singulier, du verbe « se coucher, décliner », dans un contexte astronomique. Le féminin reprend naturellement en français l’astre évoqué par le contexte immédiat.
- source_word: ምስለ፡ ፀሐይ
  choice: avec le soleil
  rationale: ምስለ signifie « avec » et marque ici la concomitance du mouvement de l’astre avec celui du soleil.
- source_word: በእሉ፡ ክልኤ፡ ኆዋኅው
  choice: par ces deux portes
  rationale: Le pluriel ኆዋኅው désigne des portes ou portails ; « par » convient au passage de l’astre à travers ces ouvertures célestes.
- source_word: እለ፡ ማእከል
  choice: centrales
  rationale: ማእከል exprime la position médiane ou centrale.
- source_word: በሣልስት፡ ወበራብዕት፡ ኆኅት
  choice: par la troisième et par la quatrième porte
  rationale: Les ordinaux identifient deux portes numérotées ; la répétition de « par » clarifie le mouvement sans résoudre la légère redondance du texte.
theological_decisions:
- issue: Nature des ouvertures célestes
  choice: portes
  alternative: portails ou ouvertures
  rationale: Le texte emploie une image architecturale concrète pour décrire le parcours céleste. « Portes » conserve cette représentation apocalyptique sans la rationaliser.
- issue: Référent du verbe féminin en français
  choice: elle
  alternative: il
  rationale: Le sujet n’est pas nommé dans ce verset isolé. « Elle » suppose un astre grammaticalement féminin, probablement la lune d’après le contexte du chapitre, mais la note maintient l’ellipse de la source.
translation_notes:
  register: Français moderne, sobre et digne. La répétition « par… par… » préserve la structure spatiale du texte, tandis que « portes » rend plus exactement ኆኅት que « fenêtres ».
