base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: fr
  text: Lorsque le soleil sort de la quatrième porte, il en sort pendant sept jours, jusqu’à ce qu’il sorte de la cinquième[a]. Puis, pendant sept jours, il revient par la quatrième porte[b], achève toute sa lumière[c], se retire et entre par la première porte pendant huit jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze ne répète pas explicitement « porte » après « la cinquième » ; le contexte indique qu’il s’agit de la cinquième porte.
    reason: lexical_alternative
  - marker: b
    text: La préposition guèze peut aussi être comprise ici comme « à la quatrième porte » ; « par » souligne le passage du soleil par cette porte.
    reason: textual_ambiguity
  - marker: c
    text: « Achève toute sa lumière » traduit de près l’expression guèze ; celle-ci semble désigner le moment où le soleil atteint, dans cette phase du cycle, la pleine mesure de sa lumière.
    reason: cultural_note
lexical_decisions:
- source_word: ፀሐይ
  choice: le soleil
  rationale: Désigne sans ambiguïté le luminaire solaire dans le contexte astronomique; l’article défini est naturel en français.
- source_word: ይወፅእ
  choice: sort
  rationale: Conserve la formule de mouvement répétée dans le guèze et l’image du soleil franchissant les portes cosmiques.
- source_word: እምራብዕት ኆኅት
  choice: de la quatrième porte
  rationale: እም exprime la provenance et ኆኅት une porte ou ouverture; cette traduction maintient l’architecture cosmique concrète du passage.
- source_word: ሰቡዐ መዋዕለ
  choice: pendant sept jours
  rationale: Exprime naturellement en français la durée indiquée dans la séquence des déplacements solaires.
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: jusqu’à ce qu’il sorte de la cinquième
  rationale: Le texte transmis ne répète pas le nom « porte » après l’ordinal; l’ellipse est intelligible en français et reste proche du guèze.
- source_word: ካዕበ
  choice: puis
  rationale: Marque naturellement la nouvelle étape et le mouvement de retour, sans alourdir la phrase française.
- source_word: ይገብእ
  choice: revient
  rationale: Dans cette séquence cyclique, le verbe indique un retour vers un passage antérieur.
- source_word: በኆኅት ራብዕ
  choice: par la quatrième porte
  rationale: La préposition በ peut désigner le lieu ou la voie de passage; « par » exprime ici le transit à travers la porte sans imposer la simple destination.
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: achève toute sa lumière
  rationale: Rend de près l’expression guèze, volontairement schématique, sans la paraphraser comme une explication astronomique moderne.
- source_word: ይደንን
  choice: se retire
  rationale: Convient à la succession des mouvements après l’achèvement de la lumière et avant l’entrée par une autre porte.
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: entre par la première porte
  rationale: Fait pendant à « sort » et conserve l’image d’un passage par une porte cosmique.
- source_word: ስሙነ መዋዕለ
  choice: pendant huit jours
  rationale: Indique clairement la durée de la dernière étape décrite.
theological_decisions:
- issue: Imagerie astronomique des portes cosmiques
  choice: Maintenir le langage concret des « portes » par lesquelles se déplace le soleil.
  alternative: Parler de « portails », de points de l’horizon ou de stations astronomiques.
  rationale: Le Livre des luminaires décrit un cosmos structuré où les astres passent par des ouvertures. Garder cette image respecte la cosmologie apocalyptique du texte sans la convertir en terminologie astronomique moderne.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe répétitive du texte astronomique est en partie conservée pour rendre son caractère séquentiel, tandis que « puis » assure une transition naturelle. Le vocabulaire concret des portes et des mouvements n’est pas modernisé.
