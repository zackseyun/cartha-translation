base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: fr
  text: L’excédent du soleil et des étoiles atteint six jours[a] ; sur cinq ans, à raison de six jours chaque année, il atteint trente jours, et la lune compte trente jours de moins que le soleil et les étoiles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le calcul est formulé de manière très condensée : l’excédent est de six jours par année, soit trente jours au bout de cinq ans.'
    reason: cultural_note
  - marker: b
    text: Le terme guèze traduit par « lune » peut aussi signifier « mois » dans un contexte calendaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: l’excédent
  rationale: Le nom vient de la racine « atteindre, parvenir, arriver à son terme ». Dans ce calcul astronomique, il désigne le total supplémentaire atteint par le compte du soleil et des étoiles ; « excédent » exprime naturellement cette valeur contextuelle.
- source_word: በበስሱ
  choice: à raison de six jours chaque année
  rationale: La répétition distributive du nombre indique six pour chacune des cinq années. Cette formulation française rend explicite la distribution nécessaire au calcul de trente jours sans modifier celui-ci.
- source_word: የሐፀፁ
  choice: compte … de moins
  rationale: Le verbe signifie ici « être inférieur, manquer, rester en deçà ». « Compte trente jours de moins » restitue clairement la comparaison calendaire, plutôt que l’idée erronée d’une soustraction subie.
- source_word: ወርኅ
  choice: la lune
  rationale: Le terme peut désigner la lune ou le mois. Le parallèle explicite avec le soleil et les étoiles favorise ici « la lune », tout en conservant l’autre possibilité dans une note.
theological_decisions:
- issue: Formulation astronomique et arithmétique condensée
  choice: Présenter les six jours comme un excédent annuel qui totalise trente jours sur cinq ans, tout en gardant la comparaison directe entre la lune, le soleil et les étoiles
  alternative: Conserver mot à mot la succession « six jours… par six… trente jours », au risque de rendre le calcul difficilement intelligible
  rationale: La syntaxe guèze associe les cinq années à une distribution de six jours chacune. La traduction clarifie cette relation arithmétique sans convertir le passage en une explication moderne des calendriers solaire et lunaire.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le caractère technique du passage, mais explicite sobrement la valeur distributive de « six » afin que le calcul soit compréhensible.
