base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/004.yaml
  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: fr
  text: Et, durant certains mois, il change ses couchers[a] ; durant certains mois, il parcourt sa course, un à un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pluriel « couchers » peut désigner les différents lieux ou points où l’astre se couche selon les mois.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un, un » ; la répétition a probablement un sens distributif : « un à un » ou « l’un après l’autre ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: mois
  rationale: Il s’agit ici du pluriel de « mois », comme le confirme l’expression በአውራኅ፡ እመራት፡ ; le sens anciennement proposé « chemins » repose sur une mauvaise analyse lexicale.
- source_word: እመራት
  choice: certains
  rationale: L’adjectif désigne des mois déterminés ou particuliers. « Certains mois » est naturel en français et maintient cette indétermination relative.
- source_word: ይዌልጥ
  choice: il change
  rationale: Le verbe exprime un changement ou une modification, et non une descente vers l’ouest.
- source_word: ምዕራባተ
  choice: ses couchers
  rationale: Dans le contexte astronomique, le pluriel désigne les couchers, c’est-à-dire les différents points ou modalités de coucher de l’astre. Le possessif, implicite dans le contexte, rend la relation clairement en français.
- source_word: የሐውር
  choice: il parcourt
  rationale: Le verbe indique le déplacement ou la marche ; avec « sa course », « parcourt » donne une expression française naturelle sans perdre l’idée de mouvement réglé.
- source_word: ምሕዋሪሁ
  choice: sa course
  rationale: Le suffixe possessif est rendu par « sa » ; dans ce passage astronomique, « course » désigne le trajet régulier de l’astre.
- source_word: አሐዱ፡ አሐዱ
  choice: l’un après l’autre
  rationale: La répétition a vraisemblablement une valeur distributive. « L’un après l’autre » conserve l’idée de succession tout en restant idiomatique en français.
