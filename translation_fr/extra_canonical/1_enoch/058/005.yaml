  text: And after this it will be said to the holy ones in heaven[c][b][a],
translation:
  language: fr
  text: Et après cela, il sera dit aux saints au ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux saints au ciel ». « Saints » peut désigner des êtres célestes ou des justes qui sont au ciel; la proposition ne le précise pas. Le complément « au ciel » peut également se rattacher à « il sera dit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Et après cela
  rationale: L’expression temporelle relie cette parole à l’étape suivante de la vision; cette formulation reste proche du guèze et naturelle en français.
- source_word: ይትበሀል
  choice: il sera dit
  rationale: La forme passive impersonnelle du verbe « dire » est conservée sans introduire un locuteur absent du texte source.
- source_word: ለቅዱሳን
  choice: aux saints
  rationale: Le terme désigne littéralement ceux qui sont saints. En français biblique courant, « les saints » est concis et ne tranche pas à lui seul entre êtres célestes et justes sanctifiés.
- source_word: በሰማይ
  choice: qui sont au ciel
  rationale: Le singulier du témoin est rendu par « au ciel ». L’ajout relatif, implicitement permis par la construction, rattache naturellement le complément aux saints plutôt qu’à l’acte de dire, tout en signalant en note l’ambiguïté possible.
theological_decisions:
- issue: Identité des « saints »
  choice: Le terme général « saints » est maintenu sans préciser s’il s’agit d’êtres célestes ou de justes se trouvant au ciel.
  alternative: « êtres saints », « anges » ou « justes »
  rationale: La courte proposition ne permet pas d’identifier avec certitude le groupe; la traduction préserve donc l’ouverture théologique du texte.
- issue: Rattachement de « au ciel »
  choice: Le complément est rattaché aux saints dans le texte courant.
  alternative: « Et après cela, il sera dit au ciel aux saints » ou rattachement de « au ciel » à l’acte de dire
  rationale: L’ordre guèze permet formellement une hésitation, mais le rattachement aux saints donne le français le plus naturel et correspond au sens contextuel probable; l’autre possibilité est conservée en note.
translation_notes:
  register: Français moderne, sobre et digne. La tournure passive impersonnelle respecte l’absence de locuteur nommé. « Saints » est retenu dans son sens lexical biblique, sans précision confessionnelle.
