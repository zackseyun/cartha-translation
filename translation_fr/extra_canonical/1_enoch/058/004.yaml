base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: fr
  text: Ils chercheront la lumière et trouveront la justice auprès du Seigneur des esprits.[a] Paix aux justes au nom du Seigneur de l’éternité.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « obtiendront la justice »; le verbe guèze peut exprimer le fait de trouver ou d’obtenir.
    reason: lexical_alternative
  - marker: b
    text: Le titre peut aussi se traduire par « le Seigneur de l’âge », « le Seigneur du monde » ou « le Seigneur éternel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃሥሡ
  choice: ils chercheront
  rationale: Le pluriel verbal exprime la recherche; le futur convient à la séquence visionnaire et eschatologique.
- source_word: ለብርሃን
  choice: la lumière
  rationale: La marque d’objet introduit ce qui est recherché; « lumière » conserve l’image apocalyptique.
- source_word: ይረክቡ
  choice: trouveront
  rationale: Le verbe peut signifier trouver ou obtenir. « Trouveront » forme en français un parallèle naturel avec « chercheront » sans effacer l’autre nuance, signalée en note.
- source_word: ጽድቀ
  choice: la justice
  rationale: « Justice » est ici naturel et compréhensible, tout en gardant la portée morale et relationnelle du terme guèze.
- source_word: በኀበ
  choice: auprès de
  rationale: Cette formulation conserve l’idée de proximité ou de présence sans décider si la justice vient du Seigneur ou se trouve en sa présence.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Rend directement le titre divin caractéristique de 1 Hénoch et en préserve la portée cosmique.
- source_word: ሰላም ለጻድቃን
  choice: Paix aux justes
  rationale: Formule française concise et digne qui conserve la valeur de bénédiction ou de proclamation.
- source_word: በስመ
  choice: au nom de
  rationale: Équivalent français idiomatique de la formule source, sans paraphrase interprétative.
- source_word: እግዚአ ዓለም
  choice: le Seigneur de l’éternité
  rationale: ዓለም peut désigner l’âge, le monde ou l’éternité. Ici, « de l’éternité » exprime naturellement la portée durable du titre, tandis que les autres possibilités sont conservées en note.
theological_decisions:
- issue: Sens de በኀበ dans le rapport entre la justice et le Seigneur
  choice: auprès du Seigneur des esprits
  alternative: de la part du Seigneur des esprits / en présence du Seigneur des esprits
  rationale: « Auprès de » maintient l’ambiguïté entre provenance et présence, sans imposer une interprétation théologique.
- issue: Rendu du titre divin final እግዚአ ዓለም
  choice: le Seigneur de l’éternité
  alternative: le Seigneur de l’âge / le Seigneur du monde / le Seigneur éternel
  rationale: Le champ sémantique du terme comprend le temps durable et le monde. Le choix principal est naturel en français et évite que « l’âge » suggère à tort une souveraineté limitée à une seule époque; la note préserve les autres lectures.
