base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: fr
  text: Les justes seront dans la lumière du soleil, et les élus dans la lumière de la vie éternelle. Les jours de leur vie n’auront pas de fin, et les saints auront des jours sans nombre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les saints n’auront pas de nombre de jours »; cette tournure exprime une durée impossible à compter.'
    reason: Précision sur l’idiome guèze et conservation de sa formulation littérale.
lexical_decisions:
- source_word: ጻድቃን
  choice: les justes
  rationale: Terme français courant dans le registre biblique pour désigner ceux qui se caractérisent par la justice, sans réduire le mot à une simple notion juridique.
- source_word: በብርሃነ ፀሐይ
  choice: dans la lumière du soleil
  rationale: Rend littéralement l’image cosmique et visionnaire tout en restant naturel en français.
- source_word: ኅሩያን
  choice: les élus
  rationale: Équivalent français établi pour ceux qui ont été choisis; il conserve ici la valeur de désignation collective du terme guèze.
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: dans la lumière de la vie éternelle
  rationale: Préserve l’image d’une lumière associée à la vie éternelle, sans la réduire à la seule idée d’immortalité.
- source_word: ማኅለቆተ አልቦቱ መዋዕለ ሕይወቶሙ
  choice: Les jours de leur vie n’auront pas de fin
  rationale: Expression française claire qui maintient à la fois la négation absolue de toute fin et l’image répétée des jours.
- source_word: ቅዱሳን
  choice: les saints
  rationale: Équivalent collectif naturel de « ceux qui sont saints »; dans ce contexte, le mot désigne les êtres consacrés ou saints sans préciser davantage leur identité.
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: auront des jours sans nombre
  rationale: Rend l’idiome guèze par une formulation française intelligible qui exprime une durée impossible à compter, sans suggérer à tort une absence de jours.
theological_decisions:
- issue: Désignation du groupe exprimé par ኅሩያን
  choice: les élus
  alternative: ceux qui ont été choisis
  rationale: « Les élus » est concis, naturel dans un texte biblique français et conserve l’idée de choix sans préciser l’auteur de ce choix au-delà de ce que dit le verset.
- issue: Sens de la dernière proposition sur les jours des saints
  choice: les saints auront des jours sans nombre
  alternative: les saints n’auront pas de nombre de jours
  rationale: La formulation retenue communique l’idée idiomatique d’une durée incalculable et évite que la tournure littérale soit comprise comme signifiant qu’ils n’auront aucun jour.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « les justes », « les élus » et « les saints », ainsi que la répétition de l’image des jours, ont été conservés.
