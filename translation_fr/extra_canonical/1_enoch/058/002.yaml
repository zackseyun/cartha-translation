lexical_decisions:
- source_word: ብፁዓን
  choice: Heureux
  rationale: Formule naturelle des béatitudes en français biblique moderne; elle exprime un état de faveur plutôt qu’un simple sentiment de bonheur.
- source_word: አንትሙ
  choice: êtes-vous
  rationale: Rend explicitement la deuxième personne du pluriel dans la formule directe « Heureux êtes-vous ».
- source_word: ጻድቃን
  choice: justes
  rationale: Terme français biblique courant pour désigner ceux qui vivent selon la justice, en contraste avec les méchants.
- source_word: ወኅሩያን
  choice: choisis
  rationale: Conserve la valeur substantivée et collective du pluriel sans introduire les connotations doctrinales plus marquées de « élus ».
- source_word: እስመ
  choice: car
  rationale: Introduit avec concision le motif de la béatitude.
- source_word: ስቡሕ
  choice: glorieuse
  rationale: Rend l’idée de gloire ou de splendeur et convient comme qualification prédicative de la part attribuée.
- source_word: ክፍልክሙ
  choice: votre part
  rationale: Exprime une portion attribuée, éventuellement comparable à un héritage, dans un français naturel et digne.
theological_decisions:
- issue: Désignation du groupe par ወኅሩያን
  choice: choisis
  alternative: élus
  rationale: « Choisis » garde la portée eschatologique de la sélection divine tout en évitant de préciser le terme selon une construction doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et légèrement biblique. La formulation concise conserve l’adresse directe et le parallélisme des désignations. Aucun appel de note n’est nécessaire, puisque « votre part » rend naturellement le terme guèze sans effacer son idée de portion attribuée.
