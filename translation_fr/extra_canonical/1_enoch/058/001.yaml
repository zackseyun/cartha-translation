base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/001.yaml
  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: fr
  text: Et je commençai à prononcer la troisième parabole au sujet des justes et des élus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la troisième similitude ». Le terme guèze peut désigner une parabole ou un discours fondé sur une similitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ እበል
  choice: je commençai à prononcer
  rationale: La construction associe un verbe pouvant prendre un sens inchoatif (« commencer ») à « dire/parler ». « Prononcer » introduit naturellement un discours solennel et développé.
- source_word: ሣልሰ ምሳሌ
  choice: la troisième parabole
  rationale: ምሳሌ peut désigner une parabole, une similitude ou un discours figuré. « Parabole » est clair en français moderne et conserve le titre littéraire traditionnel, tandis que la note signale l’autre possibilité.
- source_word: በእንተ ጻድቃን
  choice: au sujet des justes
  rationale: በእንተ marque ici le thème (« au sujet de »), et ጻድቃን désigne le groupe des « justes », terme clé qu’il convient de conserver.
- source_word: ወበእንተ ኅሩያን
  choice: et des élus
  rationale: ኅሩያን désigne ceux qui ont été choisis. « Élus » est concis, naturel dans le registre biblique français et maintient cette désignation collective sans l’expliciter davantage.
theological_decisions:
- issue: Désignation collective ኅሩያን
  choice: les élus
  alternative: ceux qui ont été choisis
  rationale: « Les élus » préserve la catégorie apocalyptique récurrente et le parallélisme avec « les justes ». Le contexte local ne justifie pas d’en préciser le mécanisme ou la portée doctrinale.
- issue: Désignation littéraire ምሳሌ
  choice: parabole
  alternative: similitude
  rationale: « Parabole » est le terme français moderne le plus accessible, mais « similitude » demeure une possibilité lexicale authentique, conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient à l’ouverture narrative solennelle; « prononcer » évite la tournure moins naturelle « commencer à dire » devant le nom du discours.
