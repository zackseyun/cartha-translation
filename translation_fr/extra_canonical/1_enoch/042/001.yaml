lexical_decisions:
- source_word: ጥበብ
  choice: la Sagesse
  rationale: 'La majuscule et le genre féminin préservent la personnification : la Sagesse agit comme une figure qui cherche un lieu où demeurer.'
- source_word: መካነ ኢረከበት
  choice: ne trouva aucun lieu
  rationale: Cette formulation française naturelle rend le sens négatif du verbe et son complément spatial sans alourdir la phrase.
- source_word: ኀበ ተኃድር
  choice: où demeurer
  rationale: « Demeurer » conserve l’image de l’habitation et le registre digne de la proposition source.
- source_word: ወሀለወ
  choice: et … était
  rationale: « Et » respecte la valeur première, copulative et paratactique, de ወ sans imposer un contraste explicite absent de la forme source.
- source_word: ማኅደራ
  choice: sa demeure
  rationale: Le nom d’habitation reprend naturellement le verbe « demeurer » et maintient la personnification.
- source_word: ውስተ ሰማያት
  choice: dans les cieux
  rationale: Le pluriel rend directement la forme guèze et conserve la portée cosmique du langage apocalyptique.
theological_decisions:
- issue: Faut-il préserver la Sagesse comme figure personnifiée ou la réduire à une qualité abstraite ?
  choice: 'Préserver la personnification : « La Sagesse ne trouva aucun lieu où demeurer »'
  alternative: « Il n’y avait aucun lieu où la sagesse puisse demeurer »
  rationale: Le texte présente la Sagesse comme sujet agissant et lui attribue une demeure ; neutraliser cette construction affaiblirait une image importante de la tradition sapientielle.
- issue: Valeur de la conjonction ወ
  choice: « et »
  alternative: « mais »
  rationale: La conjonction est d’abord copulative. « Et » préserve la parataxe et laisse au lecteur le soin de percevoir une éventuelle nuance de contraste ou de conséquence.
