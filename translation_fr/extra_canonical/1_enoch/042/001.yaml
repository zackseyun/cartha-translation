translation:
  language: fr
  text: La Sagesse ne trouva aucun lieu où demeurer, et sa demeure était dans les cieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’éthiopien emploie le pluriel « cieux », manière courante de désigner le domaine céleste dans les écrits apocalyptiques.
