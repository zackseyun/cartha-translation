base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: fr
  text: Après cela, il arriva que mon esprit fut emporté[a] et monta dans les cieux. Je vis les fils des saints anges[b] marcher sur une flamme de feu. Leurs vêtements étaient blancs, ainsi que [leurs manteaux][c], et leurs visages étaient lumineux comme la neige[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut élevé » ou « fut enlevé ». Le texte décrit un transport visionnaire sans en préciser davantage la nature.
    reason: lexical_alternative
  - marker: b
    text: L’expression « les fils des saints anges » est inhabituelle. Elle peut désigner plus largement des êtres angéliques associés aux saints anges ; la formulation du guèze est ici conservée.
    reason: lexical_alternative
  - marker: c
    text: Les mots « leurs manteaux » correspondent à un groupe placé entre crochets dans l’édition source. Leur statut textuel est incertain et ils pourraient être une glose ancienne ; ils sont donc maintenus entre crochets dans la traduction.
    reason: textual_variant
  - marker: d
    text: Dans ce contexte, « comme la neige » évoque à la fois une blancheur éclatante et la luminosité.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Après cela
  rationale: Transition narrative naturelle qui conserve la succession des visions.
- source_word: ትትከበት መንፈስየ
  choice: mon esprit fut emporté
  rationale: Le passif convient au transport visionnaire ; « emporté » reste distinct de la montée exprimée ensuite.
- source_word: ተዐርገ ውስተ ሰማያት
  choice: monta dans les cieux
  rationale: Conserve le pluriel cosmologique et rend directement le mouvement ascendant.
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  choice: les fils des saints anges
  rationale: Maintient l’expression familiale inhabituelle du guèze sans la normaliser en « les saints anges ».
- source_word: ዲበ ላህበ እሳት
  choice: sur une flamme de feu
  rationale: Préserve la construction singulière et l’image concrète du texte.
- source_word: አልባሶሙ ጻዓዳ
  choice: Leurs vêtements étaient blancs
  rationale: « Vêtements » est général et fidèle, sans préciser indûment qu’il s’agit de robes.
- source_word: '[ወዐጸፎሙ]'
  choice: et leurs manteaux
  rationale: Le terme bracketé est rendu comme un groupe nominal elliptique afin de refléter sa présence et sa position difficiles dans l’édition, plutôt que de l’omettre silencieusement.
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  choice: leurs visages étaient lumineux comme la neige
  rationale: Rend explicitement la luminosité et l’image de blancheur, dans un français grammatical et naturel.
theological_decisions:
- issue: Identité des « fils des saints anges »
  choice: Conserver littéralement l’expression familiale.
  alternative: les saints anges
  rationale: Le texte guèze présente une formulation inhabituelle mais intelligible ; la simplifier résoudrait indûment une ambiguïté concernant l’identité de ces êtres.
- issue: Nature du transport de l’esprit
  choice: 'Employer un passif de transport visionnaire : « fut emporté ».'
  alternative: fut élevé
  rationale: Ce choix ne détermine pas davantage si l’expérience est corporelle ou uniquement spirituelle et laisse à la proposition suivante le mouvement propre de montée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement solennelle pour le récit visionnaire. L’ellipse autour de « leurs manteaux » est volontairement conservée et expliquée, afin de ne pas effacer l’incertitude textuelle.
