base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: fr
  text: Autour de lui se tenaient les séraphins, les chérubins et les ophanim[a] ; ce sont ceux qui ne dorment pas et qui veillent sur le trône de sa gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « ophanim » désigne ici un ordre céleste ; il est apparenté au mot qui signifie « roues ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውዶ
  choice: Autour de lui se tenaient
  rationale: Le suffixe pronominal de troisième personne du masculin singulier est rendu par « lui », en référence à l’élément masculin du contexte précédent. La tournure française exprime naturellement la position des êtres autour de celui-ci sans transformer leur présence en action d’encercler.
- source_word: ሱራፌን
  choice: les séraphins
  rationale: Le nom traditionnel de cet ordre céleste préserve le registre apocalyptique et la distinction entre les catégories énumérées.
- source_word: ወኪሩቤን
  choice: les chérubins
  rationale: La forme française consacrée conserve l’identité de cet ordre céleste et le parallélisme de l’énumération.
- source_word: ወአፋኒን
  choice: les ophanim
  rationale: La translittération maintient ici un nom de catégorie céleste parallèle à « séraphins » et « chérubins », plutôt que de le réduire au sens étymologique de « roues ».
- source_word: ወእሉ እሙንቱ እለ
  choice: ce sont ceux qui
  rationale: Cette formulation rend l’identification emphatique des êtres précédemment nommés tout en restant naturelle en français moderne.
- source_word: ኢይነውሙ
  choice: ne dorment pas
  rationale: Traduction directe de la négation du verbe dormir, sans renforcer arbitrairement le sens par « jamais ».
- source_word: ወየዐቅቡ
  choice: et qui veillent sur
  rationale: « Veiller sur » exprime à la fois la vigilance continue et la garde associées au verbe dans cette scène du trône.
- source_word: መንበረ ስብሐተ ዚአሁ
  choice: le trône de sa gloire
  rationale: La construction nominal est conservée afin de préserver le relief solennel de l’expression guèze plutôt que de la lisser en « son trône glorieux ».
theological_decisions:
- issue: Désignation des êtres célestes dans une vision apocalyptique du trône
  choice: Conserver les noms de classes « séraphins », « chérubins » et « ophanim »
  alternative: Traduire አፋኒን par « roues », ou généraliser l’ensemble en « êtres célestes »
  rationale: Le texte énumère des catégories célestes distinctes. Les noms traditionnels préservent cette diversité cosmologique et la tension entre désignation d’un ordre céleste et imagerie des « roues », laquelle est signalée en note.
- issue: Référent du suffixe dans ወአውዶ
  choice: « Autour de lui »
  alternative: « Tout autour » sans complément exprimé
  rationale: Le suffixe masculin singulier est explicitement représenté. Le français « lui » laisse le référent dépendre du contexte précédent, sans l’identifier davantage dans ce verset isolé.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre syntaxique a été légèrement naturalisé, tandis que les noms traditionnels des êtres célestes et l’expression « trône de sa gloire » maintiennent le registre apocalyptique. Le point-virgule distingue l’énumération de l’explication qui suit.
