base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: fr
  text: Et ce Chef des jours[a] vint avec Michel, Raphaël, Gabriel et Phanuel[b], ainsi qu’avec des milliers et des dizaines de milliers d’anges, sans nombre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « Tête des jours ». Le titre est souvent rendu, selon la formulation traditionnelle de Daniel, par « Ancien des jours ».
    reason: lexical_alternative
  - marker: b
    text: Les noms correspondent aux formes guèzes Mikael, Rufael, Gabr’el et Fanuel.
    reason: cultural_note
  - marker: c
    text: Littéralement « qui n’ont pas de nombre ».
    reason: literal_rendering
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: Chef des jours
  rationale: Le syntagme guèze signifie littéralement « tête/chef des jours ». « Chef des jours » conserve ce titre particulier et sa portée souveraine tout en étant plus intelligible en français que « Tête des jours »; il évite aussi d’importer directement la formulation traditionnelle « Ancien des jours ».
- source_word: መጽአ
  choice: vint
  rationale: Le verbe de mouvement courant est rendu simplement, conformément à la progression du récit visionnaire.
- source_word: ምስለ
  choice: avec / ainsi qu’avec
  rationale: La préposition indique l’accompagnement. La reprise « ainsi qu’avec » clarifie que les anges accompagnent eux aussi le Chef des jours.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Michel, Raphaël, Gabriel et Phanuel
  rationale: Les formes françaises usuelles rendent les noms immédiatement reconnaissables; « Phanuel » conserve la forme traditionnelle française correspondant au témoin éthiopien.
- source_word: አእላፍ ወትእልፊተ
  choice: des milliers et des dizaines de milliers
  rationale: Les deux expressions numériques sont conservées concrètement, sans les fondre en une formule comme « des myriades ».
- source_word: መላእክት
  choice: anges
  rationale: Dans cette scène céleste, « anges » est le sens contextuel naturel plutôt que le terme plus général « messagers ».
- source_word: እለ አልቦሙ ኍልቈ
  choice: sans nombre
  rationale: Cette formule française concise conserve l’image littérale de l’absence de nombre et l’effet apocalyptique de l’original.
theological_decisions:
- issue: Traduction du titre divin ርእሰ መዋዕል
  choice: Chef des jours
  alternative: Ancien des jours
  rationale: Le choix suit le texte guèze local sans l’harmoniser silencieusement avec la formulation familière du livre de Daniel. La note signale néanmoins l’équivalent traditionnel.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme accumulatif de la vision est conservé, de même que la répétition des grandeurs numériques. Le titre inhabituel reste volontairement distinct de la formule daniélique traditionnelle.
