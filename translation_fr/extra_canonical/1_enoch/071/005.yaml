base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: fr
  text: Et mon esprit fut caché[a] dans le ciel des cieux, et je vis là, au milieu de cette lumière, quelque chose de construit[c] avec des pierres de grêle[b] ; au milieu de ces pierres se trouvaient des langues de feu vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe éthiopien est difficile dans la forme transmise. Il peut évoquer le fait d’être caché ou soustrait aux regards ; certains comprennent plutôt qu’Hénoch fut enlevé au ciel.
    reason: textual_variant
  - marker: b
    text: Littéralement « des pierres de grêle » ; on pourrait aussi comprendre « des grêlons » ou « des pierres de glace ».
    reason: lexical_alternative
  - marker: c
    text: La syntaxe éthiopienne de cette expression est difficile. La traduction rend prudemment une chose ou une construction présente au milieu de la lumière, sans déterminer plus précisément ce qu’elle était.
    reason: textual_variant
lexical_decisions:
- source_word: ከበቶ፡ መንፈስየ
  choice: mon esprit fut caché
  rationale: Le texte transmis semble refléter le verbe sémitique « cacher » dans une forme passive, malgré une difficulté de transcription. « Fut caché » conserve l’idiome énokien sans le réduire à une simple ascension ni lui donner le sens moins naturel de « fut couvert ».
- source_word: ውስተ፡ ሰማየ፡ ሰማያት
  choice: dans le ciel des cieux
  rationale: Cette tournure garde l’expression superlative de forme sémitique et s’accorde avec le verbe « cacher », sans l’aplanir en « ciel le plus élevé ».
- source_word: ርኢኩ፡ በህየ
  choice: Là… je vis
  rationale: Formulation française directe et naturelle qui conserve l’indication de lieu du récit visionnaire.
- source_word: ማእከለ፡ ዝኩ፡ ብርሃን
  choice: au milieu de cette lumière
  rationale: La traduction maintient le démonstratif et situe la vision dans la lumière sans préciser davantage la nature de celle-ci.
- source_word: ከመ፡ ቦቱ፡ ዘይትነደቅ
  choice: quelque chose de construit
  rationale: La syntaxe est difficile. Cette formulation prudente évoque une construction sans identifier avec certitude un palais, une maison ou un autre édifice.
- source_word: እምእብነ፡ አስሐትያ
  choice: avec des pierres de grêle
  rationale: Ce choix préserve l’image apocalyptique concrète et étrange. « Avec » exprime naturellement en français le matériau de la construction.
- source_word: ልሳናተ፡ እሳት፡ ሕያው
  choice: des langues de feu vivant
  rationale: « Langues » conserve l’image littérale des flammes, et « feu vivant » maintient la qualité animée de la scène.
theological_decisions:
- issue: Nature de l’élévation d’Hénoch
  choice: mon esprit fut caché dans le ciel des cieux
  alternative: mon esprit fut enlevé dans le ciel des cieux
  rationale: Le texte nomme explicitement l’esprit d’Hénoch et emploie vraisemblablement l’idiome de l’occultation. La traduction ne décide pas si l’expérience était corporelle, intérieure ou strictement visionnaire.
translation_notes:
  register: Français international moderne, digne et lisible. La structure des phrases a été légèrement aérée pour plus de clarté, tout en conservant les répétitions et l’imagerie singulière du texte éthiopien.
