base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: fr
  text: Et mon esprit vit l’enceinte qui entourait cette maison de feu[a], ainsi que des fleuves remplis de feu vivant[c], venant de ses quatre extrémités[b] ; ils entouraient cette maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte répète ici des mots de la même famille : littéralement, une enceinte ou un pourtour « qui entourait » la maison. Il ne précise pas qu’il s’agissait d’un mur.'
    reason: lexical_alternative
  - marker: b
    text: Le mot peut aussi désigner les quatre limites, côtés ou régions ; « quatre coins » est possible, mais plus précis que le guèze.
    reason: alternative_reading
  - marker: c
    text: « Feu vivant » traduit littéralement une expression inhabituelle, qui peut évoquer un feu animé, actif ou d’une vitalité intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈስየ
  choice: mon esprit
  rationale: Dans ce contexte visionnaire, መንፈስ désigne naturellement l’esprit du voyant. Le texte fait explicitement de son esprit le sujet de la perception.
- source_word: አውዶ / ዘየአውዶ
  choice: l’enceinte qui entourait
  rationale: Cette formulation conserve la répétition de la racine exprimant l’idée d’entourer, sans ajouter la notion plus précise de mur, absente du texte guèze.
- source_word: ቤተ እሳት
  choice: maison de feu
  rationale: Le complément « de feu » rend directement la construction du texte et maintient l’image apocalyptique dans sa forme saisissante.
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: partant de ses quatre extrémités
  rationale: አጽናፍ peut désigner des extrémités, des limites ou des régions. « Extrémités » préserve cette latitude mieux que « coins », tandis que « partant de » donne en français un lien naturel avec les fleuves.
- source_word: አፍላገ
  choice: des fleuves
  rationale: Le pluriel évoque d’importants cours d’eau et convient à l’ampleur de la vision.
- source_word: ምሉኣነ እሳተ ሕያው
  choice: remplis de feu vivant
  rationale: La traduction littérale garde l’expression inhabituelle et ne la réduit pas à la simple idée d’un feu ardent.
- source_word: የአውድዎ
  choice: ils entouraient
  rationale: La reprise du verbe « entourer » maintient le motif insistant de l’encerclement présent dans le verset.
theological_decisions:
- issue: Nature de la perception visionnaire
  choice: Et mon esprit vit
  alternative: Et je vis en esprit
  rationale: Le guèze présente explicitement l’esprit du voyant comme sujet du verbe « voir ». La traduction conserve cette tournure sans ramener la vision à une perception ordinaire.
- issue: Nature du « feu vivant »
  choice: feu vivant
  alternative: feu ardent
  rationale: Le texte laisse ouverte la portée de cette expression étrange — feu animé, actif ou doté d’une vitalité particulière. La traduction ne tranche pas cette tension imagée.
translation_notes:
  register: Français international actuel, clair et soutenu. La syntaxe fait des fleuves un second objet de « vit », conformément à leur forme grammaticale dans le guèze, plutôt qu’une proposition indépendante avec un verbe « être » sous-entendu. Le point-virgule clarifie ensuite la reprise du sujet pluriel « ils ».
