  terminology: « Mikaël », « chefs des anges » et « miséricorde » conviennent. « Justice » est un rendu défendable de ጽድቅ; la note « droiture » préserve utilement une autre valeur possible. La note a doit éviter la tournure française non idiomatique « l’un des têtes ».
