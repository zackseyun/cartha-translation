  source_fidelity: 'La progression verbale du guèze est bien rendue dans l’ensemble : Mikaël prend la main droite d’Énoch, le relève, le fait sortir et lui montre les réalités cachées. Toutefois, « me conduisit vers » ne rend pas explicitement le causatif « fit sortir / amena dehors » (አውፅአኒ). Une légère révision permet de conserver ce mouvement sans alourdir le français.'
