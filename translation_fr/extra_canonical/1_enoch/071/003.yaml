base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: fr
  text: Et l’ange Mikaël, l’un des chefs des anges[a], me prit par la main droite, me releva, me fit sortir et m’amena auprès de toutes les choses cachées[b]. Il me montra toutes les choses cachées de la miséricorde, et il me montra toutes les choses cachées de la justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un de ceux qui sont à la tête des anges »; on pourrait aussi traduire : « l’un des archanges ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous les secrets ». Le guèze répète dans ce verset un terme désignant ce qui est caché ou dissimulé.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de la droiture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ ሚካኤል
  choice: l’ange Mikaël
  rationale: መልአከ désigne ici clairement un être céleste; la forme française Mikaël translittère le nom tout en restant naturelle.
- source_word: ፩እምአርእስተ መላእክት
  choice: l’un des chefs des anges
  rationale: Cette expression rend directement l’idée de tête ou de chef parmi les anges, sans imposer le terme plus technique « archange ».
- source_word: አኃዘኒ እዴየ ዘየማን
  choice: me saisit la main droite
  rationale: Le verbe exprime l’action de prendre ou tenir; « saisir » conserve le caractère concret de la scène sans suggérer nécessairement la violence.
- source_word: አንሥአኒ
  choice: me releva
  rationale: Le verbe signifie lever ou élever. « Me releva » convient naturellement à la suite des gestes dans cette vision.
- source_word: አውፅአኒ
  choice: me conduisit vers
  rationale: Le causatif indique qu’il fait sortir ou mène Énoch. Avec la destination introduite par ኀበ, cette formulation est idiomatique en français.
- source_word: ኀበ ኵሉ ኅቡአት
  choice: vers toutes les choses cachées
  rationale: ኅቡአት désigne ce qui est caché ou dissimulé. La répétition de « choses cachées » est maintenue dans tout le verset.
- source_word: ኅቡአተ ምሕረት
  choice: les choses cachées de la miséricorde
  rationale: Le syntagme associe explicitement les réalités cachées à la miséricorde; la formulation conserve cette relation sans ajouter l’idée de trésors.
- source_word: ኅቡአተ ጽድቅ
  choice: les choses cachées de la justice
  rationale: ጽድቅ couvre la justice et la droiture. « Justice » est naturel dans ce parallélisme avec la miséricorde, tandis que l’autre valeur est signalée en note.
theological_decisions:
- issue: Désignation du rang de Mikaël
  choice: l’un des chefs des anges
  alternative: l’un des archanges
  rationale: Le guèze parle plus littéralement des chefs ou têtes des anges; la traduction évite de transformer cette expression en titre technique.
- issue: Valeur de ጽድቅ
  choice: justice
  alternative: droiture
  rationale: Les deux valeurs appartiennent au champ sémantique du terme. Dans le couple « miséricorde et justice », « justice » est idiomatique, mais la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme ainsi que la répétition insistante de « choses cachées » sont conservés; la ponctuation en deux phrases allège une longue chaîne de coordinations sans modifier sa progression.
