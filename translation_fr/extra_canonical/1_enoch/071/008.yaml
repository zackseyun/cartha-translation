base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: fr
  text: Et je vis des anges innombrables[a], des milliers de milliers et dix mille fois dix mille, qui entouraient cette maison. Mikael, Rufael, Gabr’el et Fanu’el[b], ainsi que les saints anges qui sont au-dessus des cieux, entraient dans cette maison et en sortaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formule de très grand nombre est une manière apocalyptique traditionnelle de représenter une multitude céleste impossible à compter ; la traduction conserve de près la formulation guèze.
    reason: cultural_note
  - marker: b
    text: 'Les noms suivent ici les formes guèzes : Mikael, Rufael, Gabr’el et Fanu’el. Les formes françaises plus habituelles sont Michel, Raphaël, Gabriel et Phanuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Formule narrative visionnaire simple et digne, fidèle au parfait guèze sans archaïsme français.
- source_word: መላእክተ
  choice: des anges
  rationale: Dans cette scène céleste, le terme désigne sans ambiguïté des êtres célestes plutôt que de simples messagers humains.
- source_word: እለ ኢይትኌለቍ
  choice: innombrables
  rationale: Rend directement l'impossibilité de les compter et s'intègre naturellement à l'énumération qui suit.
- source_word: አእላፈ አእላፍ
  choice: des milliers de milliers
  rationale: Conserve la répétition et la force cumulative de la formule apocalyptique.
- source_word: ወትእልፊተ ትእልፊት
  choice: et dix mille fois dix mille
  rationale: Reproduit de façon transparente l'immense nombre exprimé en guèze, sans lui substituer une formule canonique plus familière.
- source_word: የአውድዎ ለውእቱ ቤት
  choice: qui entouraient cette maison
  rationale: Préserve l'image spatiale d'une multitude disposée autour de la maison.
- source_word: ቤት
  choice: maison
  rationale: Le mot source signifie simplement « maison »; ce choix évite de préciser indûment « palais » ou « temple ».
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Mikael, Rufael, Gabriel et Fanuel
  rationale: Les noms suivent de près les formes guèzes tout en employant une graphie lisible en français; les consonnes laryngales de la translittération savante ne sont pas imposées au corps du texte.
- source_word: መላእክተ ቅዱሳን
  choice: les saints anges
  rationale: Expression française naturelle qui conserve la qualification de sainteté appliquée aux anges.
- source_word: እለ መልዕልተ ሰማያት
  choice: qui sont au-dessus des cieux
  rationale: Maintient l'image cosmologique spatiale sans en faire un système technique de niveaux célestes.
- source_word: ይበውኡ ወይወፅኡ
  choice: entraient dans cette maison et en sortaient
  rationale: L'imparfait décrit naturellement l'action continue ou répétée observée dans la vision; l'ordre entrer-sortir suit le guèze.
theological_decisions:
- issue: Normalisation de la formule exprimant la multitude céleste
  choice: des milliers de milliers et dix mille fois dix mille
  alternative: des myriades de myriades; des milliers et des dizaines de milliers
  rationale: Le texte conserve ainsi sa propre formulation apocalyptique sans importer une tournure consacrée de Daniel ou de l'Apocalypse.
- issue: Interprétation de ቤት dans la scène céleste
  choice: maison
  alternative: palais; temple; demeure
  rationale: Même si le contexte évoque la demeure divine ou une cour céleste, le terme guèze ne tranche pas entre ces interprétations; « maison » préserve cette ouverture.
- issue: Rapport syntaxique de « au-dessus des cieux »
  choice: L'expression qualifie les saints anges
  alternative: L'expression qualifierait la maison d'où les anges entrent et sortent
  rationale: L'ordre et la structure relative du guèze rattachent naturellement cette expression aux saints anges; la ponctuation française rend ce rapport explicite sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La cadence accumulative de la vision est conservée, mais la longue phrase source est divisée en deux pour rester aisément compréhensible. Les termes interprétativement chargés comme « temple » ou « palais » sont évités.
