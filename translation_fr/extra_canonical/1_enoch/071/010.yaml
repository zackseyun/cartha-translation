base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: fr
  text: Avec eux se trouvait la Tête des jours[a]. Sa tête était comme de la laine blanche et pure, et son vêtement ne peut être décrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Ancien des jours ». Ce titre traditionnel fait ressortir l’écho probable à Daniel, mais le guèze dit plus littéralement « la Tête des jours ».
    reason: lexical_alternative
  - marker: b
    text: La dernière expression peut aussi signifier « ne peut être expliqué ou interprété ». Ici, elle indique que le vêtement échappe aux mots.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: Avec eux
  rationale: La préposition guèze ምስለ signifie d’abord « avec » et exprime ici la présence en compagnie de ceux qui viennent d’être mentionnés.
- source_word: ርእሰ መዋዕል
  choice: la Tête des jours
  rationale: Cette traduction directe conserve la forme particulière du titre guèze sans l’harmoniser d’emblée avec le titre traditionnel de Daniel 7.
- source_word: ፀምር
  choice: laine
  rationale: 'Après ከመ (« comme »), le terme désigne naturellement l’objet de la comparaison : la laine, plutôt que les cheveux eux-mêmes.'
- source_word: ጻዕዳ ወንጹሕ
  choice: blanche et pure
  rationale: Les deux adjectifs sont conservés afin de rendre conjointement la blancheur visible et l’idée de pureté.
- source_word: ልብሱ
  choice: son vêtement
  rationale: « Vêtement » garde le sens général du nom sans préciser indûment qu’il s’agit d’une robe.
- source_word: ዘኢይትረጐም
  choice: ne pouvait être décrit
  rationale: Dans cette vision, le verbe lié à l’explication ou à l’interprétation exprime le plus naturellement l’impossibilité de rendre le vêtement par des mots; l’imparfait s’accorde avec le récit au passé.
theological_decisions:
- issue: Faut-il rendre ርእሰ መዋዕል par le titre traditionnel « l’Ancien des jours » ?
  choice: la Tête des jours
  alternative: l’Ancien des jours
  rationale: Le texte principal suit la formulation du témoin guèze et laisse percevoir l’écho possible à Daniel sans substituer à cette formulation son équivalent traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation répartit les propositions pour éviter une coordination lourde. Le titre inhabituel est maintenu dans le texte, tandis que son équivalent traditionnel figure en note.
