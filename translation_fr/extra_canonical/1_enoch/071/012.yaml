translation:
  language: fr
  text: Et ces bénédictions qui sortirent de ma bouche furent agréées devant ce Chef des Jours[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trouvèrent grâce devant ce Chef des Jours » ; le terme guèze peut exprimer l’idée d’être agréable ou favorablement accueilli.'
    reason: lexical_alternative
  - marker: b
    text: « Chef des Jours » traduit ici littéralement le titre guèze ; il n’est pas remplacé par la formule plus familière « Ancien des jours », afin de ne pas harmoniser silencieusement ce passage avec Daniel.
    reason: cross_reference
lexical_decisions:
- source_word: በረከት
  choice: bénédictions
  rationale: Le nom désigne une bénédiction; le pluriel est imposé ici par le démonstratif, le relatif et les verbes au pluriel dans le guèze.
- source_word: ወፅኣ እምነ አፉየ
  choice: étaient sorties de ma bouche
  rationale: Cette formulation conserve l’image concrète d’une parole qui sort de la bouche, sans la réduire à « que j’avais prononcées ».
- source_word: ሥሙረተ
  choice: furent agréées
  rationale: Le terme exprime l’idée d’être favorablement accueilli ou de trouver agrément; « furent agréées » garde cette portée sans préciser indûment une émotion.
- source_word: ቅድመ
  choice: devant
  rationale: « Devant » rend naturellement la relation de présence dans ce cadre céleste et solennel.
- source_word: ዝኩ ርእሰ መዋዕል
  choice: ce Chef des Jours
  rationale: Le démonstratif est conservé, et le titre est rendu selon sa formulation guèze propre plutôt que d’être harmonisé avec « l’Ancien des jours » de Daniel.
theological_decisions:
- issue: Traduction du titre divin ርእሰ መዋዕል
  choice: Chef des Jours
  alternative: Ancien des jours
  rationale: « Chef des Jours » traduit le titre propre à ce passage et préserve sa différence avec la formule traditionnelle de Daniel, sans harmonisation silencieuse.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel grammatical est explicitement conservé. L’expression « Chef des Jours » reste volontairement distincte du titre traditionnel de Daniel.
