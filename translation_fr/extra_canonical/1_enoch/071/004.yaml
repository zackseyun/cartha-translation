base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: fr
  text: Et il me montra toutes les réalités cachées des extrémités du ciel, ainsi que tous les entrepôts des étoiles et des luminaires[a], d’où ils sortent tous devant les saints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des étoiles et des lumières ». Le guèze distingue les étoiles d’une catégorie plus large de lumières célestes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « devant la face des saints », expression qui signifie « en présence des saints ». Dans ce contexte, les « saints » peuvent être des êtres célestes, sans que le texte les désigne explicitement comme des anges.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: አርአየኒ
  choice: il me montra
  rationale: Le causatif exprime le fait de faire voir ou de montrer; cette formulation est naturelle en français tout en conservant la narration visionnaire.
- source_word: ኵሎ ኅቡኣተ
  choice: toutes les réalités cachées
  rationale: Cette expression désigne tout ce qui est caché. « Réalités » évite le tour moins naturel « choses cachées » sans réduire le sens à des secrets ésotériques.
- source_word: አጽናፈ ሰማይ
  choice: aux extrémités du ciel
  rationale: Ce choix conserve l’image cosmique et spatiale de l’expression guèze. La relation exacte peut aussi se comprendre comme « des extrémités du ciel », mais le contexte de dévoilement de lieux célestes favorise ici la valeur locale.
- source_word: መዛግብተ
  choice: entrepôts
  rationale: Le terme évoque des réserves ou trésoreries célestes d’où sortent les phénomènes cosmiques. « Entrepôts » rend cette image concrète dans un français actuel.
- source_word: ከዋክብት ወብርሃናት
  choice: les étoiles et les luminaires
  rationale: Le guèze distingue les étoiles d’une catégorie plus large de lumières célestes. « Luminaires » préserve cette distinction avec un registre cosmique digne.
- source_word: ኵሎሙ
  choice: ils ... tous
  rationale: Le pronom universel renvoie aux étoiles et aux luminaires et souligne qu’ils sortent tous de ces entrepôts.
- source_word: እምኀበ ወፅኡ
  choice: d’où ils sortent
  rationale: La construction indique le lieu d’origine du mouvement; « sortir » est direct et conserve l’imagerie cosmique.
- source_word: ለገጸ ቅዱሳን
  choice: devant les saints
  rationale: Littéralement « devant la face des saints », expression sémitisante qui signifie « en présence des saints ». Le texte principal adopte un français naturel sans préciser leur identité.
theological_decisions:
- issue: Identité des « saints »
  choice: les saints
  alternative: les êtres saints / les anges
  rationale: Dans ce cadre céleste, il peut s’agir d’êtres célestes, mais le texte ne les identifie pas explicitement comme des anges. Le terme général conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible, avec maintien de l’imagerie apocalyptique. La syntaxe reste légèrement élevée sans reproduire inutilement les sémitismes. Tous les marqueurs de notes figurent dans le texte.
