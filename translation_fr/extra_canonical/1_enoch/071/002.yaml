base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: fr
  text: Je vis deux fleuves de feu, et la lumière de ce feu brillait comme une hyacinthe[a]. Alors je tombai face contre terre devant le Seigneur des esprits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’« hyacinthe » désigne ici vraisemblablement une pierre précieuse; son identification exacte demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ አፍላገ እሳት
  choice: deux fleuves de feu
  rationale: Le numéral et l’image apocalyptique sont rendus directement; « fleuves » conserve mieux l’ampleur de la vision que « ruisseaux ».
- source_word: ብርሃነ ዝኩ እሳት
  choice: la lumière de ce feu
  rationale: Cette formulation conserve le démonstratif et la construction condensée du guèze, tout en restant naturelle en français.
- source_word: ያክንት
  choice: une hyacinthe
  rationale: Le terme désigne vraisemblablement la pierre précieuse appelée hyacinthe; l’incertitude sur son identification exacte est signalée en note.
- source_word: ያበርህ
  choice: brillait
  rationale: Le verbe exprime l’action de luire ou de répandre de la lumière; « brillait » est direct et idiomatique.
- source_word: ወወደቁ በገጽየ
  choice: Alors je tombai face contre terre
  rationale: La tournure garde la posture physique de prosternation sans la remplacer par une interprétation abstraite.
- source_word: እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  rationale: Ce titre divin récurrent est traduit de manière formelle et cohérente, avec le pluriel défini naturel en français.
theological_decisions:
- issue: Traduction du titre divin እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  alternative: le Seigneur des Esprits
  rationale: Le sens du titre est préservé sans imposer une majuscule doctrinale à « esprits »; la formulation demeure solennelle et reconnaissable.
- issue: Nature de la comparaison avec ያክንት
  choice: brillait comme une hyacinthe
  alternative: brillait comme une pierre précieuse
  rationale: Le terme traditionnel est conservé plutôt que généralisé, tandis que la note reconnaît l’incertitude minéralogique ancienne.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe narrative claire. Le passé simple convient au registre littéraire du récit visionnaire. La répétition de « feu » et l’image concrète de la chute face contre terre sont conservées.
