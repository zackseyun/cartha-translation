base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: fr
  text: Et de cette maison sortirent Mikaël, Roufaël, Gabr’el et Fanouël[a], ainsi que beaucoup de saints anges, sans nombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms sont translittérés d’après leurs formes guèzes plutôt que remplacés par les formes françaises traditionnelles Michel, Raphaël, Gabriel et Phanuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወፅኡ
  choice: Et … sortirent
  rationale: Le verbe exprime la sortie. L’inversion après le complément initial donne en français une narration naturelle tout en conservant le sujet pluriel énuméré ensuite.
- source_word: እምኔ ውእቱ ቤት
  choice: de cette maison
  rationale: እምኔ marque la provenance, ቤት signifie « maison », et ውእቱ renvoie à une demeure déterminée déjà mentionnée. « De cette maison » restitue ce repérage contextuel.
- source_word: ሚካኤል
  choice: Mikaël
  rationale: Translittération française lisible de la forme guèze, plutôt que substitution automatique par la forme biblique française « Michel ».
- source_word: ሩፋኤል
  choice: Roufaël
  rationale: La graphie française rend la forme guèze Rufael et évite de la remplacer par le nom traditionnel « Raphaël ».
- source_word: ገብርኤል
  choice: Gabr’el
  rationale: La forme conserve la structure consonantique gabr- du guèze; l’apostrophe signale sobrement la coupure vocalique.
- source_word: ፋኑኤል
  choice: Fanouël
  rationale: Translittération adaptée aux conventions de lecture françaises de la forme guèze, sans recourir à la graphie grecquisante « Phanouël ».
- source_word: ወብዙኃን ቅዱሳን መላእክት
  choice: ainsi qu’une multitude de saints anges
  rationale: Le texte dit littéralement « et beaucoup de saints anges ». « Une multitude de saints anges », coordonné par « ainsi que », rend naturellement l’abondance en français et prépare l’expression finale d’innombrabilité.
- source_word: እለ አልቦሙ ኍልቈ
  choice: innombrable
  rationale: La proposition relative signifie littéralement qu’ils n’ont pas de nombre. « Innombrable » exprime fidèlement et sans lourdeur qu’on ne peut les compter.
theological_decisions:
- issue: Sens de ቅዱሳን appliqué aux anges
  choice: saints anges
  alternative: anges saints / saints, qui étaient des anges
  rationale: Dans ce syntagme, ቅዱሳን qualifie directement መላእክት. « Saints anges » conserve le registre religieux et désigne clairement des êtres célestes, sans faire de « saints » une catégorie ecclésiale humaine.
translation_notes:
  register: Français international moderne, digne et fluide. L’inversion « de cette maison sortirent » maintient le mouvement narratif; « une multitude innombrable » conserve l’ampleur apocalyptique sans archaïsme excessif.
