base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: fr
  text: Je tombai la face contre terre, toute ma chair fondit, et mon esprit fut transformé[a]. Je criai d’une voix forte…[b], dans un esprit de puissance[c], et je le bénis, le louai et l’exaltai[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon esprit changea ». Le sens exact du verbe guèze est incertain.
    reason: lexical_alternative
  - marker: b
    text: Le texte transmis paraît présenter ici une lacune ou une corruption; les points de suspension signalent cette difficulté.
    reason: textual_variant
  - marker: c
    text: Ou « par un esprit de puissance » ou « avec un esprit puissant ». L’expression peut décrire l’état intérieur d’Hénoch ou la puissance qui agit en lui ou par lui.
    reason: lexical_alternative
  - marker: d
    text: Littéralement, les trois verbes n’ont pas d’objet exprimé. Le pronom « le », qui renvoie à Dieu, est suppléé pour que la phrase soit naturelle en français.
    reason: supplied_object
lexical_decisions:
- source_word: ወወደቁ፡ በገጽየ
  choice: Je tombai la face contre terre
  rationale: Cette formulation française naturelle conserve à la fois la chute soudaine et la posture concrète, sans décider s’il s’agit d’une prosternation volontaire ou d’un effondrement.
- source_word: ኵሉ፡ ሥጋየ፡ ተመስወ
  choice: toute ma chair fondit
  rationale: « Chair » préserve la force anthropologique du guèze, tandis que « fondit » maintient l’image saisissante de dissolution provoquée par la vision.
- source_word: ወመንፈስየ፡ ተወለጠ
  choice: et mon esprit fut transformé
  rationale: Le passif rend un changement intérieur important sans en préciser abusivement la nature; une note signale l’incertitude du verbe.
- source_word: ወጸራኅኩ፡ በቃል፡ ዓቢይ
  choice: Je criai d’une voix forte
  rationale: « Voix forte » exprime naturellement en français le volume de la voix tout en gardant le registre élevé.
- source_word: በመንፈሰ፡ ኃይል
  choice: dans un esprit de puissance
  rationale: La formulation volontairement peu interprétative préserve l’ambiguïté entre l’état intérieur d’Hénoch et une puissance qui agit sur lui ou par lui.
- source_word: ወባረኩ፡ ወሰብሕኩ፡ ወአልዓልኩ
  choice: et je le bénis, le louai et l’exaltai
  rationale: Les trois verbes français conservent le parallélisme cultuel. Le pronom objet, requis par l’usage français naturel, est explicité comme suppléé dans une note.
theological_decisions:
- issue: Portée anthropologique de « chair » dans l’effondrement visionnaire
  choice: toute ma chair fondit
  alternative: tout mon corps défaillit
  rationale: Le texte dit littéralement « chair »; conserver ce terme maintient la texture corporelle et théologique de la scène sans la réduire à une simple réaction physique.
- issue: Sens du changement subi par l’esprit
  choice: mon esprit fut transformé
  alternative: mon esprit changea / mon esprit me quitta
  rationale: « Fut transformé » rend un bouleversement intérieur tout en évitant de conclure à la mort ou au départ de l’esprit. L’incertitude lexicale demeure indiquée.
- issue: Nature de « l’esprit de puissance »
  choice: dans un esprit de puissance
  alternative: par un esprit de puissance / avec un esprit puissant
  rationale: Le texte peut désigner l’état intérieur d’Hénoch, la manière dont il crie ou l’agent qui lui donne cette puissance. La traduction ne tranche pas.
- issue: Objet des verbes de bénédiction, de louange et d’exaltation
  choice: le pronom « le », renvoyant à Dieu, est suppléé
  alternative: laisser les verbes sans objet explicite
  rationale: Le guèze n’exprime pas ici l’objet, mais ces verbes exigent normalement un complément dans cette construction française. Le pronom rend la phrase idiomatique sans introduire de titre divin absent du verset, et la note rend l’ajout transparent.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste sobre, tandis que « chair », « esprit de puissance » et les trois verbes cultuels préservent le relief apocalyptique. Les points de suspension appartiennent au traitement critique du texte et non à un effet stylistique.
