base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: fr
  text: 'De nouveau, observez les jours d’été : comment le soleil vient sur eux dès leur commencement[a]. Vous cherchez alors abri et ombre[b] à cause de la chaleur du soleil ; la terre brûle sous une chaleur ardente, et vous ne pouvez marcher ni sur la terre ni sur un rocher à cause de cette chaleur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure éthiopienne est difficile. Elle peut aussi se comprendre ainsi : « comment le soleil est sur eux dès leur commencement » ou désigner plus précisément la force du soleil au début de l’été.'
    reason: textual_variant
  - marker: b
    text: L’expression « abri et ombre » conserve les deux termes parallèles du texte éthiopien.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: De nouveau
  rationale: Marque la reprise d’un nouvel exemple parallèle dans l’exhortation à observer la création.
- source_word: ጠየቁ
  choice: observez
  rationale: L’impératif pluriel peut évoquer l’examen ou l’enquête ; dans ce contexte d’observation des phénomènes naturels, « observez » est naturel et concorde avec le sens contextuel, sans affaiblir l’appel à examiner.
- source_word: መዋዕለ ሐጋይ
  choice: les jours d’été
  rationale: Conserve l’expression temporelle concrète plutôt que de la réduire à « l’été ».
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: dès leur commencement, le soleil les domine
  rationale: Rend le soleil situé ou agissant au-dessus des jours d’été dès leur début, tout en signalant en note l’incertitude d’une construction éthiopienne difficile.
- source_word: ተኀሥሡ ምጽላለ ወጽላሎተ
  choice: Vous cherchez alors abri et ombre
  rationale: Conserve l’action de chercher une protection ainsi que le doublet « abri et ombre ».
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: à cause de la chaleur du soleil
  rationale: Traduction directe et claire de la cause de cette recherche de protection.
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: la terre est brûlante sous l’ardeur de la chaleur
  rationale: Préserve l’intensité et le caractère redoublé de l’expression source, tout en restant intelligible en français.
- source_word: ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ
  choice: vous ne pouvez fouler ni la terre ni le rocher
  rationale: Restitue la proposition finale récupérée dans le texte source complet et son parallélisme négatif.
theological_decisions:
- issue: Les phénomènes naturels comme témoignage théologique
  choice: Maintenir une description concrète de la chaleur estivale et de ses effets.
  alternative: Transformer explicitement l’image en leçon sur le jugement divin.
  rationale: Le verset décrit l’ordre observable de la création ; sa portée théologique ressort du contexte plus large et ne doit pas être ajoutée dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et l’imagerie physique sont conservés ; les répétitions significatives de l’éthiopien ne sont pas inutilement nivelées.
