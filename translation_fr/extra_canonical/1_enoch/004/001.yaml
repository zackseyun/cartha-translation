revisions:
- from: 'De nouveau, observez les jours d’été : dès leur commencement, le soleil les domine[a]. Vous cherchez alors abri et ombre[b] à cause de la chaleur du soleil ; la terre est brûlante sous l’ardeur de la chaleur, et vous ne pouvez fouler ni la terre ni le rocher à cause de cette chaleur.'
  to: 'De nouveau, observez les jours d’été : comment le soleil vient sur eux dès leur commencement[a]. Vous cherchez alors abri et ombre[b] à cause de la chaleur du soleil ; la terre brûle sous une chaleur ardente, et vous ne pouvez marcher ni sur la terre ni sur un rocher à cause de cette chaleur.'
  rationale: La révision retire l’interprétation excessive de « domine » tout en maintenant une phrase française lisible et la note qui signale la difficulté du gééz. Elle améliore aussi l’idiomaticité de la description de la chaleur et de la clause finale, sans supprimer le doublet ni la répétition causale du texte source.
