base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: fr
  text: Je vis vers l’est[a] une autre montagne, plus haute que celle-ci[b]. Entre elles se trouvait un ravin profond, mais peu large, où de l’eau coulait en direction de la montagne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se rendre par « du côté de l’aurore ». Elle désigne ici l’est, sans indiquer précisément le nord-est.
    reason: lexical_alternative
  - marker: b
    text: Le terme comparatif peut aussi signifier « plus grande », « plus longue » ou « plus étendue » que la première montagne.
    reason: lexical_alternative
  - marker: c
    text: La dernière proposition est difficile. Le guèze dit le plus directement que de l’eau se trouvait dans le ravin et allait « en direction de la montagne ».
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: vers l’est
  rationale: ጽባሕ évoque le matin, l’aurore et, par extension directionnelle, l’est. « Vers l’est » reste fidèle sans préciser indûment le nord-est.
- source_word: ካልአ ደብረ
  choice: une autre montagne
  rationale: ካልአ désigne un autre ou un second élément; cette formulation convient naturellement à la progression de la vision.
- source_word: ዘይነውኅ እምዝ
  choice: plus haute que celle-ci
  rationale: Le verbe peut exprimer la longueur, l’étendue ou la grandeur. Appliqué à une montagne comparée à la précédente, « plus haute » est le sens topographique le plus probable, sans masquer les autres possibilités dans la note.
- source_word: ማእከሎሙ
  choice: entre elles
  rationale: Le suffixe pluriel renvoie aux deux montagnes et situe le ravin dans l’espace qui les sépare.
- source_word: ቈላ ዕሙቀ
  choice: un ravin profond
  rationale: L’expression désigne une dépression profonde; « ravin » restitue de façon concrète le relief abrupt de cette scène visionnaire.
- source_word: አልቦ ርሐበ
  choice: mais peu large
  rationale: Le sens littéral est « sans largeur ». « Peu large » conserve cette formulation négative tout en restant idiomatique en français.
- source_word: ቦቱኒ ማይ
  choice: où de l’eau
  rationale: La construction situe l’eau dans le ravin; la relative française rattache clairement ce lieu au mouvement exprimé ensuite.
- source_word: የሐውር መንገለ ደብር
  choice: coulait en direction de la montagne
  rationale: Le verbe signifie aller ou se déplacer; avec l’eau pour sujet, « coulait » est naturel. La direction vers la montagne est conservée malgré la difficulté de la relation topographique.
theological_decisions:
- issue: Conserver le caractère concret de la topographie visionnaire
  choice: Maintenir la montagne, le ravin et l’eau comme éléments concrets du paysage de la vision
  alternative: Interpréter ou généraliser ces éléments comme des symboles dans le corps du texte
  rationale: Le texte présente sa vision au moyen d’un paysage concret. La traduction ne doit ni imposer une interprétation symbolique ni atténuer l’imagerie apocalyptique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple garde le ton narratif de la vision; l’imparfait décrit le paysage et le mouvement continu de l’eau. Les notes préservent les ambiguïtés lexicales et topographiques réelles sans alourdir le verset.
