lexical_decisions:
- source_word: መንገለ
  choice: à
  rationale: Dans cette construction topographique, le terme fonctionne comme une préposition directionnelle, « du côté de » ou « à », plutôt que comme le nom « chemin ».
- source_word: ዐረቡ
  choice: l’ouest
  rationale: Le mot désigne l’ouest, direction cardinale explicitement conservée dans la description de la vision.
- source_word: ለዝ
  choice: de celui-ci
  rationale: 'La préposition jointe au démonstratif exprime ici la relation spatiale : « à l’ouest de celui-ci ».'
- source_word: ካልእ
  choice: un autre
  rationale: Le terme signifie « autre » et s’emploie substantivement. La traduction ne fournit pas dans le corps du verset le nom sous-entendu par le contexte.
theological_decisions:
- issue: Référent elliptique dans la description visionnaire
  choice: Conserver la formulation substantivée « un autre » sans ajouter de nom.
  alternative: une autre montagne
  rationale: Le fragment guèze ne répète pas explicitement le substantif. Même si le contexte peut faire penser à une montagne, l’ajouter dans le texte lèverait une ellipse présente dans le témoin.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure locative naturelle « à l’ouest de » rend la syntaxe directionnelle, tandis que « il y en avait un autre » préserve l’ellipse sans produire une phrase française trop abrupte.
