base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: fr
  text: De là, je suis allé au milieu de la terre[a], et j’ai vu un lieu béni, ombragé, où se trouvaient des arbres dont les branches demeuraient et poussaient à partir d’un arbre qui avait été abattu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au centre de la terre »; selon le contexte, ምድር peut aussi désigner le pays ou le sol.
    reason: lexical_alternative
  - marker: b
    text: La description botanique du texte éthiopien est difficile. La fin semble évoquer des branches ou des pousses vivantes provenant d’un arbre abattu, mais leur rapport exact avec l’arbre ou les arbres précédemment mentionnés demeure incertain.
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: au milieu de la terre
  rationale: Cette formulation conserve la portée cosmique et géographique de la vision, sans réduire ምድር à un territoire local.
- source_word: መካነ ቡሩከ
  choice: un lieu béni
  rationale: Rendu concis qui garde la valeur adjectivale de ቡሩከ sans identifier explicitement le lieu au paradis ou à l’Éden.
- source_word: ጥሉለ
  choice: ombragé
  rationale: Le mot, transmis entre crochets dans l’édition, semble caractériser le lieu par son ombre; « ombragé » est concret et naturel en français.
- source_word: ዕፀወ / አዕፁቀ
  choice: des arbres dont les branches
  rationale: Le texte distingue vraisemblablement les arbres et leurs branches. Cette formulation conserve les deux éléments botaniques tout en rendant naturellement le lien entre eux.
- source_word: ዘይነብር ወይሠርፅ
  choice: demeuraient et poussaient
  rationale: « Demeuraient » exprime la persistance, tandis que « poussaient » rend l’idée de croissance ou de rejet; le parallélisme préserve l’image d’une vie continue.
- source_word: እምዕፅ ዘተመተረ
  choice: à partir d’un arbre qui avait été abattu
  rationale: Cette traduction garde l’image de nouvelles pousses issues d’un arbre préalablement coupé, tout en laissant une note signaler l’incertitude syntaxique.
theological_decisions:
- issue: Description d’un paysage ordinaire ou géographie sacrée symbolique
  choice: Conserver la géographie visionnaire concrète sans nommer le lieu.
  alternative: Identifier explicitement le lieu au paradis ou à l’Éden, ou le réduire à une simple région fertile.
  rationale: Le verset évoque un espace béni au milieu de la terre, mais ne le nomme pas. La traduction préserve donc la portée sacrée possible sans imposer une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le caractère visionnaire du passage et ses détails botaniques, tout en signalant en note les incertitudes réelles du texte éthiopien.
