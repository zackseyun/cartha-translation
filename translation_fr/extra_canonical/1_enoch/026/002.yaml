  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
translation:
  language: fr
  text: Là, je vis une montagne sainte et, sous la montagne, de l’eau venant de l’est[a], dont le cours se dirigeait vers le nord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze dit littéralement « de l’eau depuis l’est »; la suite précise que son cours se dirige vers le nord.
    reason: La formulation littérale peut sembler inhabituelle; la note conserve l’expression directionnelle du texte source et indique comment la suite l’éclaire.
lexical_decisions:
- source_word: ደብረ ቅዱሰ
  choice: montagne sainte
  rationale: « Montagne » convient à la topographie visionnaire, et « sainte » conserve la portée religieuse de ቅዱሰ sans l’affaiblir.
- source_word: መትሕተ ደብር
  choice: sous la montagne
  rationale: Expression spatiale directe, naturelle en français et proche du guèze.
- source_word: ማይ
  choice: de l’eau
  rationale: Le nom signifie simplement « eau »; le mouvement est précisé ensuite, sans qu’il soit nécessaire d’introduire « rivière » ou « ruisseau ».
- source_word: እመንገለ ጽባሕ
  choice: venait de l’est
  rationale: La formule indique une provenance depuis l’est, littéralement la direction du levant; cette tournure est claire et concise.
- source_word: ውሕዘቱ
  choice: son cours
  rationale: Le terme désigne l’écoulement ou le parcours de l’eau. « Son cours » restitue naturellement cette idée sans préciser indûment la nature du courant.
- source_word: መንገለ ሰሜን
  choice: se dirigeait vers le nord
  rationale: La locution marque une orientation vers le nord; le verbe français explicite naturellement le mouvement impliqué par « son cours ».
theological_decisions:
- issue: Rendre ቅዱሰ par un terme explicitement théologique
  choice: montagne sainte
  alternative: montagne sacrée
  rationale: Dans cette géographie visionnaire, la sainteté appartient au sens théologique de la scène. « Sainte » en préserve mieux la force que « sacrée », sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La seconde phrase rend explicites les relations verbales nécessaires à un français naturel, tout en conservant la distinction entre la provenance orientale de l’eau et l’orientation septentrionale de son cours.
