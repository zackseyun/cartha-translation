base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: fr
  text: Ils oublieront et seront saisis de peur, parce qu’ils ont accompli toutes leurs œuvres dans le mensonge et se sont prosternés devant une pierre[a] ; ils périront en un instant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une pierre » ; il s’agit vraisemblablement d’un objet de culte idolâtre.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « ils périront soudainement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይረሰዑ
  choice: ils oublieront
  rationale: Le verbe se lit le plus naturellement comme un futur actif pluriel. La traduction conserve toutefois l’objet non exprimé, sans préciser ce qu’ils oublieront.
- source_word: ይፈርሁ
  choice: seront saisis de peur
  rationale: Cette formulation française naturelle exprime la peur sans lui donner une intensité extrême.
- source_word: ኵሎ፡ ገብሮሙ
  choice: toutes leurs œuvres
  rationale: Le syntagme désigne l’ensemble de leurs actes et maintient le registre solennel du jugement.
- source_word: በሐሰት
  choice: dans le mensonge
  rationale: La tournure conserve la dimension morale de ሐሰት plutôt que de réduire le sens à une simple erreur factuelle.
- source_word: ወሰገዱ፡ ለአብን
  choice: et se sont prosternés devant une pierre
  rationale: 'Le verbe indique un geste d’adoration ou de prosternation, et l’objet guèze est concrètement au singulier : « une pierre ».'
- source_word: ይትሐጐሉ
  choice: ils périront
  rationale: Le verbe exprime la ruine ou la destruction. « Périr » restitue clairement ce résultat sans préciser le mode de disparition.
- source_word: በምዕር
  choice: en un instant
  rationale: La valeur adverbiale temporelle « en un instant, soudainement » convient au contexte et corrige l’ancienne interprétation « dans la honte ».
theological_decisions:
- issue: Image idolâtre au singulier
  choice: se sont prosternés devant une pierre
  alternative: ont adoré une idole de pierre
  rationale: Le texte nomme littéralement une pierre au singulier. La traduction garde cette image concrète sans expliciter davantage la nature de l’objet cultuel.
- issue: Expression finale du jugement
  choice: ils périront en un instant
  alternative: ils seront détruits soudainement
  rationale: Cette traduction associe la ruine annoncée à sa soudaineté, conformément au sens lexical probable, sans importer l’idée de honte issue d’une analyse antérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme judiciaire est conservé, de même que l’image concrète et singulière de la pierre. Les deux notes sont appelées dans le texte principal.
