translation:
  language: fr
  text: 'Malheur à vous qui répandez le mal contre vos prochains[a] : car vous serez tués par vos prochains[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La préposition peut aussi être comprise au sens associatif ou instrumental : « avec vos compagnons » ou « par l’intermédiaire de vos compagnons ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte reprend un terme apparenté à celui qui est rendu plus haut par « prochains » ; il peut aussi évoquer des compagnons.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: La formule française conserve la force de la dénonciation prophétique et apocalyptique.
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: qui répandez le mal
  rationale: « Répandre » maintient l’image d’un mal que l’on étend ou propage, sans la réduire à une affirmation morale générale.
- source_word: በቢጽክሙ
  choice: contre vos prochains
  rationale: Le nom désigne des proches, prochains ou compagnons. Dans ce contexte, la tournure est comprise comme désignant les personnes visées par le mal; la note conserve la possibilité d’une valeur associative ou instrumentale de la préposition.
- source_word: እስመ
  choice: c’est en effet
  rationale: Cette formulation rend le lien causal introduisant le motif du malheur annoncé.
- source_word: በቢጸል
  choice: par des prochains
  rationale: Le texte fourni paraît employer un terme apparenté à celui de la première proposition. La traduction maintient donc l’écho lexical tout en évitant d’ajouter un possessif qui n’est pas clairement exprimé ici.
- source_word: ትትቀተሉ
  choice: vous serez tués
  rationale: Le futur passif convient à l’annonce de jugement et reste naturel en français moderne.
theological_decisions:
- issue: Nature de la rétribution annoncée
  choice: Le mal dirigé contre les prochains se retourne contre ses auteurs, qui seront tués par des prochains.
  alternative: Les auteurs répandent le mal avec ou par l’intermédiaire de leurs compagnons, puis sont tués par des compagnons.
  rationale: La répétition apparente du terme relatif au prochain ou au compagnon suggère une rétribution en retour. La traduction la rend visible, tandis que la note préserve l’incertitude syntaxique de la première occurrence.
- issue: Lecture proposée « dans le Shéol »
  choice: Ne pas introduire « dans le Shéol » dans le texte principal.
  alternative: « car dans le Shéol vous serez tués » si በቢጸል résulte d’une mauvaise transcription de በሲኦል.
  rationale: Le témoin transcrit fourni porte በቢጸል, et non በሲኦል. Malgré l’hypothèse d’une erreur de transcription signalée lors d’une révision, les données présentes ne suffisent pas à remplacer silencieusement la leçon fournie.
translation_notes:
  register: Français international moderne, digne et direct. « Prochains » conserve la portée relationnelle du terme et permet de faire entendre sa reprise dans les deux propositions. La formulation évite le tour plus archaïque « vous serez mis à mort ».
