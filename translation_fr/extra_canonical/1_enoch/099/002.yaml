base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: fr
  text: Malheur à ceux qui déforment la parole de justice et l’ordonnance qui demeure à jamais, et qui se considèrent comme n’étant pas pécheurs[a] ! Sur la terre, ils seront piétinés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom traduit par « pécheurs » est incertain dans le texte éthiopien transmis, où il est signalé comme une lecture douteuse. Le sens général paraît néanmoins être qu’ils se tiennent eux-mêmes pour exempts de péché.
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: Malheur à
  rationale: Rend la formule prophétique de dénonciation et conserve sa portée judiciaire et apocalyptique.
- source_word: ይዌልጥዎሙ
  choice: déforment
  rationale: Exprime l’altération de ce qui est droit sans employer le français plus ambigu ou vieilli « pervertissent ».
- source_word: ለነገረ ርትዕ
  choice: la parole de justice
  rationale: Préserve l’ambivalence de ነገር entre parole, message et affaire, tout en gardant la formulation solennelle du texte.
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: l’ordonnance qui demeure à jamais
  rationale: « Ordonnance » maintient la dimension normative de ሥርዐት, tandis que la proposition relative traduit explicitement l’idée de permanence.
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: et qui se considèrent comme n’étant pas pécheurs
  rationale: Le tour réflexif signifie ici qu’ils se tiennent eux-mêmes pour non pécheurs; cette traduction évite l’ancienne interprétation erronée faisant intervenir un mouvement de la tête.
- source_word: ዲበ ምድር ሀለዉ ይትከየዱ
  choice: Sur la terre, ils seront piétinés
  rationale: Conserve l’image concrète du châtiment et rattache naturellement le complément de lieu à la proposition finale.
theological_decisions:
- issue: Portée de la formule de malheur
  choice: Une dénonciation judiciaire de ceux qui altèrent la justice et l’ordre durable
  alternative: Une simple lamentation morale
  rationale: Le contexte des malheurs et l’annonce finale du châtiment imposent une portée judiciaire sans ajouter de précision doctrinale.
- issue: Sens du tour réflexif relatif à l’absence de péché
  choice: Ils se considèrent eux-mêmes comme non pécheurs
  alternative: Ils n’étaient réellement pas pécheurs sur la terre
  rationale: L’idiome réflexif ረስየ ርእሶ soutient le sens « se considérer comme ». Cette lecture maintient l’accusation d’autojustification sans transformer leur prétention en constat du narrateur.
- issue: Lien de « sur la terre »
  choice: Le rattacher au châtiment final
  alternative: Le rattacher à « pécheurs »
  rationale: La ponctuation retenue donne une syntaxe cohérente et correspond à la révision philologique fournie, tout en évitant l’étrange affirmation selon laquelle ces personnes n’auraient pas été pécheresses sur terre.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve la solennité de l’oracle de malheur et son image concrète de jugement, sans archaïsmes inutiles.
