base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
translation:
  language: fr
  text: 'Et de nouveau, je vous le jure, pécheurs : le péché a été préparé pour le jour du sang qui ne cesse pas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le châtiment — ou le jugement — a été préparé pour le jour de l’effusion de sang ». Le texte guèze porte « péché », mais ce mot peut désigner ici, de manière condensée, la conséquence du péché.'
    reason: Alternative lexicale et interprétative dans une phrase syntaxiquement condensée.
lexical_decisions:
- source_word: ወካዕበ
  choice: Et de nouveau
  rationale: Rend le connecteur et l’adverbe itératif, tout en maintenant la cadence répétitive de l’oracle.
- source_word: እኔ፡ እምሕል፡ ለክሙ
  choice: je vous le jure
  rationale: Exprime l’assertion solennelle et renforcée du verbe, plus forte qu’une simple déclaration.
- source_word: ለኃጥኣን
  choice: pécheurs
  rationale: Conserve l’adresse directe à la catégorie des pécheurs, mise en apostrophe après la déclaration.
- source_word: ለዕለተ፡ ደም
  choice: pour le jour du sang
  rationale: Suit de près l’expression guèze littérale et évite de préciser indûment s’il s’agit de sang versé, de violence ou de culpabilité liée au sang.
- source_word: ዘአየሀድአ
  choice: qui ne cesse pas
  rationale: Préserve la forme relative et l’ambiguïté de son rattachement immédiat au sang, plutôt que de la condenser en un adjectif interprétatif.
- source_word: ተደለወት
  choice: a été préparé
  rationale: Rend le parfait passif et l’idée de quelque chose disposé à l’avance, sans expliciter l’agent.
- source_word: ኃጢአት
  choice: le péché
  rationale: Retient le sens lexical direct du nom guèze, tout en signalant en note son possible emploi métonymique pour la conséquence judiciaire du péché.
theological_decisions:
- issue: Faut-il comprendre ኃጢአት comme le péché lui-même ou comme sa conséquence judiciaire ?
  choice: « le péché » dans le texte principal
  alternative: « le châtiment » ou « le jugement pour le péché »
  rationale: Le guèze porte directement « péché ». Le conserver maintient la tension du texte, qui peut personnifier le péché ou employer ce mot de manière condensée pour sa conséquence.
translation_notes:
  register: Français international moderne, solennel et accessible. La formulation suit étroitement le guèze et conserve l’expression inhabituelle « le jour du sang qui ne cesse pas » ainsi que l’ambiguïté théologique de « péché ».
