  revised_text: En ces jours-là, vous les justes, préparez-vous à faire monter vos prières comme un mémorial, et déposez-les en témoignage devant les anges, afin qu’ils présentent le péché des pécheurs devant le Très-Haut comme un mémorial.
  revised_footnotes: []
