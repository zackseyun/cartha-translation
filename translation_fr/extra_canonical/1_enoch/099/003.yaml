base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: fr
  text: En ces jours-là, vous les justes, préparez-vous à faire monter vos prières comme un mémorial, et déposez-les en témoignage devant les anges, afin qu’ils présentent le péché des pécheurs devant le Très-Haut comme un mémorial.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et l’image des « jours ».
- source_word: ተደለዉ፡ ጻድቃን
  choice: vous les justes, préparez-vous
  rationale: Rend l’impératif à la deuxième personne du pluriel et le vocatif, conformément à la révision grammaticale du guèze.
- source_word: ከመ፡ ትንሥኡ፡ ጸሎታቲከሙ
  choice: à faire monter vos prières
  rationale: Le verbe actif à la deuxième personne du pluriel fait des justes les agents; « faire monter » garde l’image ascendante de la prière.
- source_word: በተዝካር
  choice: comme un mémorial
  rationale: Préserve la valeur commémorative et judiciaire d’une requête portée au souvenir dans la cour céleste.
- source_word: ሰማዕተ
  choice: en témoignage
  rationale: Ici, le terme désigne naturellement un témoignage; les anges sont explicitement nommés ensuite par መላእክት.
- source_word: በቅድመ፡ መላእክት
  choice: devant les anges
  rationale: Traduit explicitement la locution et le nom guèze des anges, omis dans une ancienne analyse.
- source_word: ያንብ...ሙ
  choice: qu’ils présentent
  rationale: Le témoin transcrit est endommagé, mais le contexte appelle l’action des anges qui placent ou portent l’affaire devant le Très-Haut; « présentent » est naturel sans effacer la scène judiciaire.
- source_word: ለኃጢአተ፡ ኃጥኣን
  choice: le péché des pécheurs
  rationale: Suit le singulier apparent « péché » et conserve la répétition rhétorique caractéristique.
- source_word: በቅድመ፡ ልዑል
  choice: devant le Très-Haut
  rationale: Rend sobrement le titre divin et la situation de comparution dans la cour céleste.
theological_decisions:
- issue: Fonction des prières dans la cour céleste
  choice: Les prières des justes deviennent un témoignage mémorial, et les anges présentent le péché des pécheurs devant le Très-Haut.
  alternative: Les prières seraient seulement gardées en mémoire par Dieu, sans portée judiciaire explicite.
  rationale: La répétition de « mémorial », ainsi que « témoignage » et la présentation devant le Très-Haut, soutiennent une scène judiciaire sans préciser davantage le mécanisme du jugement.
- issue: Rôle des anges
  choice: Les anges sont les destinataires célestes du témoignage puis les agents qui présentent le péché devant le Très-Haut.
  alternative: Le terme précédant « devant les anges » désignerait lui-même des êtres angéliques.
  rationale: Le texte contient explicitement መላእክት, « anges », tandis que ሰማዕተ se comprend ici comme « témoignage »; cette lecture respecte la syntaxe révisée.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde l’adresse solennelle aux justes et l’imagerie judiciaire apocalyptique. Aucun marqueur de note n’est requis, puisque les incertitudes pertinentes sont rendues prudemment dans le corps du texte et consignées dans les décisions lexicales.
