base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: fr
  text: En ces jours-là, les femmes enceintes mettront au monde leurs enfants et les abandonneront ; leur progéniture leur échappera. Pendant qu’elles allaiteront, elles abandonneront leurs enfants et ne reviendront pas auprès d’eux ; elles n’auront aucune compassion pour ceux qu’elles aiment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première suite de verbes éthiopiens est difficile. Elle est traditionnellement comprise comme la mise au monde ou le port des enfants, suivi de leur abandon ; on pourrait aussi rendre certains termes par « feront sortir » ou « emporteront » selon l’analyse retenue.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique courante, rendue dans un français naturel tout en conservant le registre prophétique.
- source_word: እለ፡ ይጼንሱ
  choice: les femmes enceintes
  rationale: L’expression désigne celles qui conçoivent ou portent un enfant. Le français explicite naturellement le référent féminin sans limiter la phrase au seul moment de la conception.
- source_word: ይወፅኡ፡ ወይመሥጡ፡ ደቂቆሙ
  choice: sortiront pour rejeter leurs enfants
  rationale: La séquence éthiopienne est difficile. « Sortiront » préserve le sens ordinaire du premier verbe, tandis que « rejeter » exprime l’action violente dirigée contre les enfants sans imposer un procédé précis.
- source_word: ይገድፍዎሙ
  choice: elles les abandonneront
  rationale: Le verbe exprime le fait de laisser, délaisser ou rejeter. « Abandonner » convient au contexte familial et évite une tournure artificielle en français.
- source_word: ይደህፁ፡ ውሉዶሙ
  choice: leur progéniture glissera hors d’elles
  rationale: La formulation conserve l’image corporelle de glissement ou de chute et la référence collective à la descendance, sans la réduire explicitement à une mort provoquée.
- source_word: እንዘ፡ ይጠብዉ
  choice: Pendant qu’elles allaiteront
  rationale: Le verbe ጠበወ renvoie au fait de téter ou d’allaiter, et non au fait de regarder. Le contexte indique ici l’activité des mères qui nourrissent leurs enfants.
- source_word: ኢይገብኡ፡ ኀቤሆሙ
  choice: ne reviendront pas auprès d’eux
  rationale: Cette traduction rend le mouvement de retour et sa dimension relationnelle après l’abandon.
- source_word: ኢይምሕርዎሙ፡ ለፍቁራኒሆሙ
  choice: elles n’auront aucune compassion pour ceux qu’elles aiment
  rationale: « Compassion » rend l’absence de pitié, et « ceux qu’elles aiment » transmet en français actuel la force affective du substantif désignant les êtres aimés.
theological_decisions:
- issue: Portée de la scène de violence
  choice: Présenter l’effondrement de la compassion familiale dans un contexte de jugement apocalyptique.
  alternative: Généraliser le passage en une simple description de violence sociale ou préciser qu’il s’agit exclusivement d’un avortement volontaire.
  rationale: Les mentions répétées de grossesse, d’enfants, d’allaitement, de retour et d’êtres aimés centrent le tableau sur la rupture des liens familiaux. Le texte ne permet toutefois pas de préciser avec certitude le mécanisme ni le degré d’intention de chaque action.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme prophétique est conservé, ainsi que la violence de l’image, mais la difficulté de la première proposition est signalée plutôt que résolue silencieusement.
