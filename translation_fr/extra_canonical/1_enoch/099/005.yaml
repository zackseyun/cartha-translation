revisions:
- from: En ces jours-là, les femmes enceintes sortiront pour rejeter leurs enfants[a] ; elles les abandonneront, et leur progéniture glissera hors d’elles. Pendant qu’elles allaiteront, elles abandonneront leurs enfants et ne reviendront pas auprès d’eux ; elles n’auront aucune compassion pour ceux qu’elles aiment.
  to: En ces jours-là, les femmes enceintes mettront au monde leurs enfants et les abandonneront ; leur progéniture leur échappera. Pendant qu’elles allaiteront, elles abandonneront leurs enfants et ne reviendront pas auprès d’eux ; elles n’auront aucune compassion pour ceux qu’elles aiment[a].
  rationale: La révision corrige la première proposition afin de rendre la naissance/le port des enfants suivi de l’abandon, sans prétendre résoudre entièrement une séquence éthiopienne difficile. Elle remplace l’image corporelle trop précise de « glissera hors d’elles » par « leur échappera », qui garde l’ambiguïté et la force du texte. L’allaitement, l’abandon répété, le non-retour et l’absence de compassion sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:12:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'La proposition initiale du brouillon (« sortiront pour rejeter leurs enfants ») ne rend pas de façon sûre la succession verbale et laisse disparaître l’idée de mise au monde/port des enfants que retient la tradition textuelle représentée par Charles. La seconde proposition (« leur progéniture glissera hors d’elles ») surinterprète la préposition par une image corporelle : le texte exprime plus prudemment que leur descendance « leur échappera ». « Pendant qu’elles allaiteront » rend correctement እንዘ ይጠብዉ, qui concerne l’allaitement et non le regard.'
  naturalness: Le français est globalement clair et de registre approprié, mais « sortiront pour rejeter » est syntaxiquement et sémantiquement peu naturel dans ce contexte, et « glissera hors d’elles » est inutilement anatomique. La révision conserve la sobriété prophétique tout en donnant un français moderne fluide.
  terminology: « En ces jours-là », « abandonneront », « allaiteront » et « n’auront aucune compassion » conviennent. « Ceux qu’elles aiment » restitue naturellement « leurs êtres aimés / leurs bien-aimés » sans archaïsme. « Progéniture » conserve la portée collective de ውሉዶሙ.
  issues:
  - severity: high
    issue: La première séquence verbale est rendue par « sortiront pour rejeter leurs enfants ».
    rationale: Cette formulation associe « sortir » directement à « rejeter » et ne restitue pas adéquatement la séquence traditionnellement comprise comme la mise au monde/le port des enfants, suivie de leur abandon. Elle crée aussi une construction française peu cohérente.
  - severity: medium
    issue: « Leur progéniture glissera hors d’elles » sur-spécifie l’image.
    rationale: Le texte dit que leur descendance leur échappera (« d’elles / loin d’elles ») ; « hors d’elles » impose une lecture physiologique que la formulation source ne requiert pas à elle seule.
  revised_text: En ces jours-là, les femmes enceintes mettront au monde leurs enfants et les abandonneront ; leur progéniture leur échappera. Pendant qu’elles allaiteront, elles abandonneront leurs enfants et ne reviendront pas auprès d’eux ; elles n’auront aucune compassion pour ceux qu’elles aiment[a].
