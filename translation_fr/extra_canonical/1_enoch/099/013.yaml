lexical_decisions:
- source_word: እሌ
  choice: Malheur
  rationale: Dans cette formule récurrente du contexte, le terme fonctionne comme une interjection de malédiction (« malheur »), et non comme un démonstratif.
- source_word: ለክሙ
  choice: à vous
  rationale: La préposition avec le pronom suffixe de deuxième personne du pluriel se rend naturellement par « à vous » après « Malheur ».
- source_word: እለ
  choice: non rendu dans le corps du texte
  rationale: La forme amorce vraisemblablement une proposition relative (« qui… »), mais le témoin fourni s'interrompt ici; ajouter « qui » produirait une amorce française sans contenu attesté. Cette donnée est signalée en note.
theological_decisions:
- issue: Traitement d’un témoin éthiopien manifestement tronqué
  choice: Traduire seulement l’énoncé complet soutenu par les mots conservés et signaler la coupure
  alternative: Reconstruire la suite du verset d’après des traductions ou des éditions secondaires
  rationale: La primauté du texte source fourni interdit d’importer une suite non attestée. Les points de suspension et les notes rendent visible l’incomplétude sans la résoudre artificiellement.
translation_notes:
  register: Formulation française actuelle, brève et solennelle. « Malheur à vous » conserve la formule prophétique récurrente; les points de suspension marquent la coupure du témoin plutôt qu’une hésitation stylistique.
