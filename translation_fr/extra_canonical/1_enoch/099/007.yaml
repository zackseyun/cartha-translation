base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: fr
  text: Et ceux qui se prosternent devant la pierre[a], ceux qui fabriquent une image d’or, d’argent, de bois et d’argile, et ceux qui se prosternent devant des esprits mauvais[b], des démons et toute idole, sans comprendre, ne trouveront auprès d’eux absolument aucun secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « devant la pierre »; le singulier désigne probablement ici, de façon générale, des objets de culte en pierre.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire plus littéralement par « âmes mauvaises » ou « âmes des méchants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሰግዱ
  choice: se prosternent
  rationale: Conserve le geste physique de révérence ainsi que sa portée cultuelle, sans réduire le verbe au seul sens abstrait d’« adorer ».
- source_word: ለአብን
  choice: devant la pierre
  rationale: Rend directement le nom de matière au singulier, probablement employé collectivement pour les objets cultuels en pierre.
- source_word: ይገብሩ ምስለ
  choice: fabriquent une image
  rationale: Le nom ምስል désigne ici une image; son singulier est conservé plutôt que de suppléer un pluriel selon les différents matériaux énumérés.
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: d’or, d’argent, de bois et d’argile
  rationale: Présente naturellement en français les matières dont l’image est faite, tout en maintenant l’accumulation du texte.
- source_word: ነፍሳት እኩያት
  choice: esprits mauvais
  rationale: Dans ce contexte d’idolâtrie et en parallèle avec les démons, « esprits » convient au référent surnaturel; une note préserve le sens plus littéral possible de « âmes mauvaises ».
- source_word: አጋንንት
  choice: démons
  rationale: Équivalent français courant et précis pour des êtres surnaturels malfaisants dans un registre apocalyptique.
- source_word: ጣዖት
  choice: idole
  rationale: Terme direct et traditionnel pour un objet de culte, sans archaïsme inutile.
- source_word: ኢበተምሃር
  choice: sans comprendre
  rationale: Exprime l’absence de compréhension ou de discernement sans imposer le sens plus étroit d’un défaut d’instruction.
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: ne trouveront auprès d’eux absolument aucun secours
  rationale: « Trouveront » correspond au verbe source; « absolument aucun » restitue la négation totale renforcée, tandis que « auprès d’eux » garde l’ironie de l’aide attendue des objets ou êtres adorés.
theological_decisions:
- issue: La pierre désigne-t-elle explicitement une idole de pierre?
  choice: la pierre
  alternative: une idole de pierre
  rationale: Le texte donne directement le nom de matière. La traduction évite d’ajouter « idole » à cet endroit, même si le contexte cultuel rend cette référence probable.
- issue: Nature des « esprits mauvais »
  choice: esprits mauvais
  alternative: âmes mauvaises / âmes des méchants
  rationale: Le parallèle avec les démons et les idoles favorise une lecture surnaturelle, mais la note conserve l’ambiguïté lexicale du nom ge’ez.
- issue: Nombre de l’image fabriquée
  choice: une image
  alternative: des images
  rationale: Le singulier grammatical de ምስል est retenu malgré la succession de matières, afin de ne pas remplacer la forme source par une pluralisation interprétative.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination cumulative du ge’ez est maintenue sans reproduire toutes ses répétitions au prix d’une lourdeur artificielle. « Se prosterner » conserve à la fois le geste et sa valeur cultuelle.
