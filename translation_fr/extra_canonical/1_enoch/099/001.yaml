base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: fr
  text: Malheur à vous qui commettez le mal et qui louez et honorez la parole mensongère[a] ! Vous périrez[b], et vous n’aurez pas une vie bonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le propos mensonger » ou « l’affaire mensongère ». Le nom guèze est au singulier et peut désigner une parole, un propos ou une affaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous serez détruits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Formule naturelle de dénonciation prophétique en français, qui conserve la force judiciaire et apocalyptique de l’interjection.
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: qui commettez le mal
  rationale: Rend l’action habituelle ou effective exprimée par le verbe, dans un français courant et digne, sans préciser indûment la nature exacte du mal.
- source_word: ወበነገረ፡ ሐሰት
  choice: la parole mensongère
  rationale: Respecte le singulier construit de ነገረ tout en exprimant idiomatiquement l’idée de parole caractérisée par le mensonge; le sens plus large de « propos » ou « affaire mensongère » reste signalé en note.
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: louez et honorez
  rationale: Préserve le parallélisme de deux verbes exprimant l’approbation et la valorisation publiques.
- source_word: ተሐጕልክሙ
  choice: Vous périrez
  rationale: Rend directement la menace de ruine ou de destruction, avec une tournure française naturelle et sans expliciter l’agent.
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: et vous n’aurez pas une vie bonne
  rationale: Conserve la négation de possession ainsi que l’expression littérale « vie bonne », sans la réduire à la prospérité terrestre ni l’identifier explicitement à la vie éternelle.
theological_decisions:
- issue: Portée de la « vie bonne » refusée aux impies
  choice: Conserver l’expression ouverte « une vie bonne »
  alternative: Traduire par « une vie heureuse », « le bonheur » ou « la vie éternelle »
  rationale: Dans ce contexte moral et apocalyptique, l’expression peut évoquer une existence bénie et le bien-être accordé par Dieu, éventuellement dans une perspective eschatologique. La traduction ne tranche pas entre prospérité présente, plénitude de vie et destinée future.
- issue: Nature du jugement exprimé par ተሐጕልክሙ
  choice: « Vous périrez »
  alternative: « Vous serez détruits »
  rationale: Le verbe annonce la ruine des destinataires. « Périrez » maintient la force du jugement sans ajouter un agent explicite ni définir précisément le mode de destruction.
translation_notes:
  register: Français international moderne, clair et digne. La formule « Malheur à vous » conserve le ton prophétique; le parallélisme de la phrase et l’ambiguïté de « vie bonne » sont maintenus.
