base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: fr
  text: Et en ces jours-là, heureux tous ceux qui accueillent la parole de sagesse[a], la comprennent et la mettent en pratique, qui suivent la voie du Très-Haut, marchent dans la voie de sa justice et ne font pas le mal avec ceux qui le font[b]. Car ils seront sauvés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message de sagesse ». Le terme guèze peut signifier « parole », « propos », « affaire » ou « message ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se livrent pas à l’impiété avec ceux qui s’y livrent ». Selon la nuance retenue, le verbe a aussi été compris comme « devenir corrompu », « s’égarer » ou « périr ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: heureux
  rationale: Dans une béatitude, « heureux » est naturel en français biblique moderne et exprime la faveur accordée, au-delà d’un simple état émotionnel.
- source_word: ይትሜጠዉ
  choice: accueillent
  rationale: Le verbe signifie recevoir ou accepter ; « accueillir » rend l’idée d’une réception favorable qui conduit à l’obéissance.
- source_word: ነገረ ጥበብ
  choice: la parole de sagesse
  rationale: ነገር peut désigner une parole, un propos, une affaire ou un message. « Parole de sagesse » conserve l’expression singulière et son registre élevé.
- source_word: ያእምርዎን
  choice: la comprennent
  rationale: La progression réception-compréhension-pratique indique ici une compréhension concrète, et non une simple connaissance.
- source_word: ይገብርዎን
  choice: la mettent en pratique
  rationale: Cette formulation française rend clairement l’action d’accomplir la parole de sagesse et conserve le pronom objet du guèze.
- source_word: ለፍኖተ ልዑል
  choice: suivent la voie du Très-Haut
  rationale: Le préfixe ለ introduit ici « la voie » comme complément du verbe ; « suivre la voie » exprime naturellement en français l’observance pratique visée.
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: marchent sur la voie de sa justice
  rationale: « Marcher sur la voie » conserve l’image éthique du texte, tandis que « sa justice » maintient le lien explicite avec le Très-Haut.
- source_word: ኢይረሰዑ ... እለ ይረሰዑ
  choice: ne commettent pas le mal avec ceux qui le commettent
  rationale: La racine ረሰዐ désigne l’action mauvaise ou impie. La répétition française préserve la construction du texte et son contraste moral avec la justice.
- source_word: ይድኅኑ
  choice: ils seront sauvés
  rationale: Le verbe exprime le salut ou la délivrance ; le futur passif convient au cadre eschatologique sans préciser indûment la nature de ce salut.
theological_decisions:
- issue: Portée de ብፁዓን dans la béatitude
  choice: heureux
  alternative: bénis
  rationale: « Heureux » correspond à la forme traditionnelle et intelligible d’une béatitude française, tout en laissant au contexte eschatologique le soin d’exprimer la faveur divine.
- issue: Sens du verbe répété ይረሰዑ en contraste avec la justice et le salut
  choice: commettre le mal
  alternative: agir avec impiété ; devenir corrompu ; s’égarer ; périr
  rationale: Le sens actif et moral de la racine convient au contraste avec la marche dans la justice. Une note signale les nuances possibles sans transformer d’emblée l’acte mauvais en son éventuelle conséquence judiciaire.
- issue: Nature du salut final
  choice: seront sauvés
  alternative: seront délivrés ; échapperont
  rationale: La traduction garde la force théologique et eschatologique du verbe, sans définir le mécanisme ni l’étendue du salut.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme cumulatif de la béatitude est conservé, avec des relatives coordonnées. « Très-Haut », « justice » et « sauvés » maintiennent le registre religieux sans ajout confessionnel.
