base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: fr
  text: Ils perdront la raison à cause de la folie de leur cœur, et leurs yeux s’obscurciront[a] par la peur de leur cœur et par les visions de leurs rêves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront obscurcis ». L’image peut évoquer une vue troublée par la terreur ou, au sens figuré, une perte de discernement.
    reason: lexical_alternative
  - marker: b
    text: L’expression « visions de leurs rêves » conserve à la fois le langage de la vision et celui du rêve présent dans le guèze.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: ils perdront la raison
  rationale: Le verbe, forme passive ou réfléchie de ረሰዐ (« oublier »), exprime ici la perte de sens ou de raison. Cette traduction suit la révision lexicale fondée sur le guèze et forme un parallèle naturel avec « la folie de leur cœur ».
- source_word: እበደ
  choice: folie
  rationale: Le nom désigne la déraison ou le dérèglement. « Folie » conserve la force du contexte de jugement sans limiter le sens à une simple erreur.
- source_word: ልቦሙ
  choice: leur cœur
  rationale: Dans cet usage sémitique, le cœur englobe la pensée, la volonté et l’émotion. Le terme concret est donc conservé.
- source_word: ይጼለሉ
  choice: s’obscurciront
  rationale: Le verbe évoque un assombrissement ou une diminution de la perception, sans imposer l’idée d’une cécité littérale.
- source_word: አዕይንቲሆሙ
  choice: leurs yeux
  rationale: La formulation conserve l’image corporelle précise du texte au lieu de l’abstraire en « vue ».
- source_word: በፍርሃተ ልቦሙ
  choice: sous l’effet de la peur qui saisira leur cœur
  rationale: La préposition peut exprimer la cause ou le moyen. Cette formulation française naturelle préserve la causalité ainsi que la répétition du mot « cœur ».
- source_word: በርእየ ሕልሞሙ
  choice: des visions de leurs rêves
  rationale: La traduction maintient à la fois le vocabulaire de la vision et celui du rêve, sans réduire l’expression à « leurs rêves ».
theological_decisions:
- issue: Nature de l’affliction décrite
  choice: Le verset présente une perte de raison, une peur intérieure et une perception obscurcie comme des conséquences liées au jugement, sans préciser l’origine des rêves.
  alternative: Comprendre les visions comme des révélations punitives directement envoyées par Dieu, ou comme le seul produit d’une conscience coupable.
  rationale: Le guèze décrit les effets de l’affliction, mais n’en définit pas explicitement le mécanisme. La traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les images du cœur, des yeux et des visions oniriques. Aucun mécanisme théologique précis n’est ajouté au texte.
