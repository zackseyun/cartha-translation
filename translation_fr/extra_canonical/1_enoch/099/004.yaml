base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/004.yaml
  text: In those days nations shall be thrown into confusion, and the clans of the nations shall rise up on the day of destruction.
translation:
  language: fr
  text: En ces jours-là, les nations seront plongées dans la confusion, et les clans des nations[a] se lèveront au jour de la destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les groupes de parenté » ou « les tribus des nations ». Le terme guèze peut désigner des groupes de parenté ou des peuples apparentés.
    reason: lexical_alternative
  - marker: b
    text: Ou « au jour du massacre » ou « de la ruine », selon la force attribuée au dernier terme.
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Cette formule temporelle conserve le pluriel et le registre prophétique de l’expression guèze.
- source_word: ይትሀወኩ
  choice: seront plongées dans la confusion
  rationale: Le verbe évoque le trouble et le désordre; cette formulation française garde sa valeur passive et l’intensité du bouleversement.
- source_word: አሕዛብ
  choice: les nations
  rationale: Dans cet oracle de jugement, « nations » rend naturellement le collectif sans introduire l’opposition théologique que pourrait suggérer « païens ».
- source_word: ወይትነሥኡ
  choice: et … se soulèveront
  rationale: Le verbe exprime l’action de se lever. « Se soulèveront » préserve le mouvement actif et menaçant sans préciser s’il s’agit d’une révolte, d’un rassemblement ou d’une mobilisation.
- source_word: አዝማደ፡ አሕዛብ
  choice: les clans des nations
  rationale: አዝማድ désigne des groupes de parenté ou des collectivités apparentées; « clans » est concis et convient au cadre collectif du passage.
- source_word: በዕለት፡ እንተ፡ ሐጕል
  choice: au jour de la destruction
  rationale: L’expression désigne un jour culminant de catastrophe ou de jugement. « Destruction » conserve une portée assez large, sans réduire nécessairement l’événement à une tuerie.
theological_decisions:
- issue: Portée de አሕዛብ dans un oracle apocalyptique de jugement
  choice: les nations, au sens collectif
  alternative: les peuples; les païens
  rationale: Le contexte présente un bouleversement touchant des collectivités, sans formuler explicitement une opposition entre Juifs et non-Juifs.
- issue: Nature du soulèvement des groupes apparentés
  choice: se soulèveront
  alternative: se révolteront; se lèveront pour combattre; se rassembleront
  rationale: Le guèze indique qu’ils se lèvent, mais ne détermine pas précisément la forme militaire ou politique de l’action.
- issue: Portée de ሐጕል
  choice: destruction
  alternative: massacre; ruine
  rationale: Le terme peut désigner une catastrophe destructrice et peut être compris plus fortement comme un massacre; le texte principal garde la portée générale et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne, avec une tonalité prophétique. Le futur simple rend l’annonce apocalyptique; les ambiguïtés lexicales importantes sont conservées dans les notes.
