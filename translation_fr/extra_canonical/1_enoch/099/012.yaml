base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: fr
  text: 'Malheur à vous qui faites de la mesure un instrument de péché et de tromperie[a], et qui répandez l’amertume sur la terre[b] : par cela, ils seront détruits[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression est difficile. Elle peut décrire des mesures commerciales frauduleuses; plus littéralement : « qui faites la mesure de péché et de tromperie ».'
    reason: lexical_alternative
  - marker: b
    text: 'La leçon corrigée du texte signifie « causer de l’amertume ». On pourrait aussi traduire : « qui causez de l’amertume sur la terre ».'
    reason: textual_and_lexical_alternative
  - marker: c
    text: Littéralement, le texte passe ici de « vous » à « ils ». « Par cela » peut aussi se comprendre comme « à cause de cela ».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Cette formule conserve la force de la dénonciation prophétique tout en étant naturelle dans un registre biblique français actuel.
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: qui faites de la mesure un instrument de péché et de tromperie
  rationale: La formulation garde les notions concrètes de mesure, de péché et de fausseté, tout en exprimant naturellement en français l’idée probable d’une mesure commerciale rendue frauduleuse. « Instrument » est explicatif et ne prétend pas lever entièrement la difficulté syntaxique.
- source_word: ታምርሩ፡ ዲበ፡ ምድር
  choice: qui répandez l’amertume sur la terre
  rationale: La leçon corrigée ታምርሩ vient du champ lexical de l’amertume. « Répandez » rend idiomatiquement l’action causative à l’échelle de la terre sans retenir le non-mot issu de l’OCR.
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: par cela, ils seront détruits
  rationale: Le pronom ge’ez demeure référentiellement ambigu. La traduction conserve l’instrumentalité ou la causalité de ቦቱ et le changement apparent de personne du verbe au pluriel.
theological_decisions:
- issue: Sens moral ou commercial de la « mesure »
  choice: faites de la mesure un instrument de péché et de tromperie
  alternative: pratiquez la mesure du péché et de la tromperie
  rationale: Le contexte lexical permet de comprendre une mesure falsifiée, probablement dans les échanges commerciaux. La traduction rend cette portée sans supprimer les termes concrets du texte ni transformer le verset en maxime morale générique.
- issue: Agent ou cause de la destruction finale
  choice: par cela, ils seront détruits
  alternative: à cause de cela, ils périront
  rationale: Le texte relie grammaticalement la destruction au mal qui précède, sans nommer explicitement Dieu comme agent. La formulation préserve donc cette tension plutôt que d’ajouter une référence au jugement divin.
- issue: Référent du pluriel « ils »
  choice: maintien de « ils »
  alternative: vous serez détruits
  rationale: Le texte transmis présente apparemment un passage de la deuxième personne à la troisième personne. Il ne faut pas harmoniser silencieusement cette difficulté textuelle ou syntaxique.
translation_notes:
  register: Français international moderne, digne et prophétique. « Malheur à vous » maintient le ton apocalyptique; la syntaxe reste claire tout en signalant les difficultés du texte ge’ez et les corrections nécessaires des erreurs d’OCR.
