base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: fr
  text: Après cela, je vis une autre multitude de chars[a], avec des hommes qui les montaient. Ils arrivaient portés par les vents, de l’est et de l’ouest, jusqu’au sud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une autre formation de chars ».'
    reason: Le nom collectif éthiopien peut évoquer une multitude, une troupe ou une formation; la note préserve cette latitude lexicale.
lexical_decisions:
- source_word: ትዕይንተ፡ ሠረገላት
  choice: multitude de chars
  rationale: Le syntagme désigne ici un ensemble ou une troupe de chars. « Multitude » rend naturellement l’idée collective sans transformer la scène en une simple vision.
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: avec des hommes qui les montaient
  rationale: La tournure exprime que des hommes se trouvent sur ou dans les chars comme cavaliers; « monter un char » est idiomatique en français et ne précise pas indûment s’ils étaient assis à l’intérieur.
- source_word: ይመጽኡ፡ ዲበ፡ ነፋሳት
  choice: ils arrivaient portés par les vents
  rationale: Le sens littéral est qu’ils viennent « sur les vents ». « Portés par » conserve cette image surnaturelle tout en restant naturel en français.
- source_word: እምስራቅ፡ ወእምዕራብ፡ እስከ፡ መንፈቀ፡ ዕለት
  choice: de l’est et de l’ouest, jusqu’au sud
  rationale: « Le milieu du jour » est une désignation directionnelle traditionnelle du sud; la traduction explicite le point cardinal visé.
