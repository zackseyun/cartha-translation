  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: fr
  text: Et tous tomberont et adoreront le Seigneur des esprits. Et c’est la fin de la deuxième parabole.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la fin d’une autre parabole » ou « de l’autre parabole », si ካልእ n’est pas compris au sens ordinal de « deuxième ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: tomberont
  rationale: Le verbe exprime le fait de tomber; associé au verbe suivant, il décrit clairement un geste corporel de révérence sans transformer les deux verbes en un seul.
- source_word: ኵሎሙ
  choice: tous
  rationale: Le français naturel exprime ici la totalité et reprend suffisamment le groupe évoqué dans le contexte précédent, sans l’alourdissement de « tous ceux-là ».
- source_word: ይሰግዱ
  choice: se prosterneront devant
  rationale: Le verbe désigne un geste d’hommage ou d’adoration. « Se prosterner devant » conserve l’image corporelle et la force révérencielle, tout en évitant de trancher plus que le guèze entre prosternation et adoration cultuelle.
- source_word: ለእግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette expression est un titre divin caractéristique de 1 Hénoch. La formulation française en conserve la forme et la diction propre au livre.
- source_word: ዝንቱ ውእቱ
  choice: Ainsi s’achève
  rationale: Dans cette formule de clôture, cette tournure française restitue naturellement l’identification de la fin signalée par le texte, sans lourdeur littérale.
- source_word: ተፍጻሜተ
  choice: s’achève
  rationale: Le terme marque l’achèvement ou la conclusion d’une section; la formulation verbale est idiomatique en français dans un colophon.
- source_word: ካልእ ምሳሌ
  choice: la deuxième parabole
  rationale: Dans ce contexte structurel, ካልእ se comprend vraisemblablement dans un sens ordinal, « deuxième ». Son sens possible « autre » est néanmoins conservé en note.
theological_decisions:
- issue: Traduction du titre divin ለእግዚአ መናፍስት
  choice: le Seigneur des esprits
  alternative: le Seigneur des Esprits
  rationale: La minuscule à « esprits » maintient le génitif du titre sans suggérer que « Esprits » serait un autre nom propre. Le titre hénochique demeure pleinement reconnaissable.
- issue: Valeur de ካልእ dans la formule finale
  choice: la deuxième parabole
  alternative: une autre parabole / l’autre parabole
  rationale: La fonction de clôture dans le Livre des paraboles favorise le sens séquentiel, mais le lexème peut aussi signifier « autre »; cette ambiguïté réelle est signalée en note.
translation_notes:
  register: Français moderne, international et digne. La coordination des deux verbes est conservée, tandis que « se prosterner devant » rend la révérence de manière concrète sans imposer exclusivement le vocabulaire cultuel d’« adorer ». Le marqueur [a] est placé après la proposition qu’il précise.
