base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/002.yaml
  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: fr
  text: On entendit le fracas de leurs chars[a]. Quand ce tumulte se produisit, les saints venus du ciel s’en aperçurent[b]. Le pilier de la terre fut ébranlé jusque dans ses fondations[c], et ce bruit fut entendu d’une extrémité du ciel à l’autre en un jour[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’expression associe deux termes désignant le son ou le bruit; on pourrait aussi traduire : « le bruit de leurs chars ».'
    reason: lexical_alternative
  - marker: b
    text: Les « saints venus du ciel » désignent vraisemblablement des êtres célestes dans ce contexte, sans que le terme les nomme explicitement comme des anges.
    reason: cultural_note
  - marker: c
    text: 'Ou : « fut déplacé de son assise ». Le mot traduit par « fondations » peut aussi désigner la place, le siège ou la base.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « depuis les extrémités du ciel jusqu’à ses extrémités », c’est-à-dire sur toute l’étendue du ciel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተሰምዐ / ተሰምዓ
  choice: on entendit / cela s’entendit
  rationale: La tournure française conserve la perception auditive et le style de compte rendu visionnaire, tout en évitant un passif lourd.
- source_word: ቃለ ድምፀ ሰረገላቲሆሙ
  choice: le fracas de leurs chars
  rationale: Les deux termes auditifs forment une expression intensive. « Fracas » restitue naturellement en français le bruit puissant des chars sans leur attribuer une voix.
- source_word: ዝሀውክ
  choice: ce tumulte
  rationale: Le terme évoque agitation, trouble ou commotion. « Tumulte » convient au bouleversement cosmique tout en laissant ouverte sa nuance exacte.
- source_word: ቅዱሳን
  choice: les êtres saints
  rationale: Cette formulation préserve le titre et évite les connotations ecclésiales possibles de « saints » employé seul; le contexte céleste suggère des êtres célestes sans imposer explicitement « anges ».
- source_word: አእመሩ
  choice: s’en aperçurent
  rationale: Le verbe indique qu’ils perçoivent ou prennent connaissance de l’événement; cette expression est naturelle en français dans le contexte.
- source_word: ዐምደ ምድር
  choice: les piliers de la terre
  rationale: L’image de l’architecture cosmique est conservée sans rationalisation.
- source_word: ተሐውሰ እመንበሩ
  choice: furent ébranlés jusque dans leurs fondations
  rationale: « Ébranlés » exprime le bouleversement, tandis que « fondations » rend dans ce contexte la notion de place, siège ou base. « Jusque dans » évite de suggérer sans nécessité un arrachement complet.
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
  choice: d’une extrémité du ciel à l’autre
  rationale: Cette tournure idiomatique française transmet l’étendue totale indiquée par la répétition du mot « extrémité » en guèze.
- source_word: በአሐቲ ዕለት
  choice: en un seul jour
  rationale: Rendu temporel direct qui souligne l’unité de la journée.
theological_decisions:
- issue: Identité des « êtres saints »
  choice: Conserver « les êtres saints » en précisant seulement leur localisation dans le ciel
  alternative: Traduire explicitement par « les anges » ou comprendre des saints humains
  rationale: Le contexte favorise des êtres célestes, mais le substantif source ne les nomme pas explicitement comme des anges. La traduction maintient cette tension.
- issue: Architecture cosmique des piliers de la terre
  choice: Conserver littéralement l’image des « piliers de la terre »
  alternative: Paraphraser comme un tremblement général de la terre
  rationale: L’imagerie cosmologique appartient au texte et ne doit pas être modernisée ni démythologisée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme apocalyptique est préservé par des phrases coordonnées, tandis que les formulations trop littérales ou redondantes sont éclaircies sans effacer les images cosmologiques ni les ambiguïtés du guèze.
