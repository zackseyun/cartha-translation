base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: fr
  text: Et maintenant, sachez que vous êtes prêts pour le jour de la destruction[a]. N’espérez pas vivre, pécheurs ; au contraire, vous partirez et mourrez, car vous ne connaissez aucune rançon[b], puisque vous avez été préparés pour cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour du massacre ». Le terme guèze peut désigner une ruine destructrice dans un contexte de jugement et peut aussi prendre le sens plus précis de massacre.
    reason: lexical_alternative
  - marker: b
    text: Ici, la « rançon » désigne vraisemblablement un prix ou un moyen de libération face au jugement qui vient ; l’idée est qu’il ne reste aucune possibilité d’y échapper.
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque une transition temporelle solennelle et naturelle dans un oracle de jugement.
- source_word: አእምሩ
  choice: sachez
  rationale: Impératif pluriel direct, appelant les destinataires à reconnaître la réalité annoncée.
- source_word: ድልዋን
  choice: prêts
  rationale: Exprime l’état de ceux qui sont disposés ou destinés à affronter l’événement, sans préciser davantage l’agent de cette préparation.
- source_word: ለዕለተ ሐጕል
  choice: pour le jour de la destruction
  rationale: « Destruction » conserve la portée générale et apocalyptique du jugement, tandis que « massacre » reste une possibilité plus précise signalée en note.
- source_word: ወኢትስፈዉ
  choice: N’espérez pas
  rationale: 'Rend l’impératif négatif avec sa force rhétorique : tout faux espoir de survie est refusé.'
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: vivre, pécheurs
  rationale: Le verbe est à la deuxième personne du pluriel ; « pécheurs » est donc compris comme un vocatif désignant les personnes interpellées, et non comme le sujet d’un verbe à la troisième personne.
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: au contraire, vous partirez et mourrez
  rationale: Conserve la succession du départ et de la mort ainsi que le ton solennel de l’avertissement.
- source_word: ቤዛ
  choice: rançon
  rationale: Préserve la métaphore concrète d’un prix ou moyen de libération sans la transformer en une formulation doctrinale plus tardive.
- source_word: ኢታእምሩ ቤዛ
  choice: vous ne connaissez aucune rançon
  rationale: Suit de près l’expression difficile du texte tout en laissant entendre qu’aucun moyen de se soustraire au jugement n’est connu.
- source_word: ተደለውክሙ
  choice: vous avez été préparés pour cela
  rationale: Conserve la valeur passive et reprend l’idée initiale sans nommer l’agent ; « cela » renvoie au jour de destruction et à son jugement.
theological_decisions:
- issue: Sens de « rançon » dans l’oracle de jugement
  choice: Conserver « rançon » comme image d’un moyen ou prix de libération.
  alternative: délivrance ; prix de rachat
  rationale: Le texte nie aux pécheurs toute issue face au jugement annoncé. « Rançon » maintient la tension théologique et l’image juridique sans les réduire à une doctrine ultérieure.
- issue: Destinataires de l’annonce de mort
  choice: Lire « pécheurs » comme un vocatif adressé aux personnes désignées par le verbe à la deuxième personne du pluriel.
  alternative: Lire « les pécheurs » comme un sujet à la troisième personne.
  rationale: La forme verbale guèze ትሕየዉ est à la deuxième personne du pluriel ; la traduction doit donc dire que les destinataires eux-mêmes ne vivront pas.
translation_notes:
  register: Français international actuel, digne et direct. Le vocatif « pécheurs » rend explicitement la deuxième personne du pluriel du guèze. La variation entre « êtes prêts » et « avez été préparés » reflète les deux formulations apparentées mais distinctes du texte source. Les deux marqueurs de note [a] et [b] figurent dans le corps du texte.
