base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: fr
  text: Ne pensez pas en vous-mêmes et ne dites pas dans votre cœur que vous ne savez ni ne voyez que chaque péché est écrit dans le ciel, chaque jour, devant le Très-Haut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression traduite par « chaque jour » peut aussi évoquer une présence continuelle : le registre demeure jour après jour devant le Très-Haut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ
  choice: ne vous imaginez pas
  rationale: Rend l’interdiction d’une supposition intérieure trompeuse, sans la réduire à une simple ressemblance extérieure.
- source_word: በመንፈስክሙ
  choice: en votre esprit
  rationale: Conserve le terme anthropologique « esprit » et son parallélisme avec « cœur ».
- source_word: ኢትበሉ በልብክሙ
  choice: ne dites pas dans votre cœur
  rationale: Préserve l’idiome biblique du discours intérieur tout en restant intelligible en français moderne.
- source_word: ኢታእምሩ ወኢትሬእዩ
  choice: vous ne savez ni ne voyez
  rationale: Respecte la deuxième personne du pluriel explicite en guèze et coordonne naturellement les deux négations en français.
- source_word: ኵሉ ኃጢአት
  choice: tout péché
  rationale: 'Exprime la portée distributive du singulier collectif : aucun péché n’échappe au registre.'
- source_word: በሰማይ ይጸሐፍ
  choice: est consigné dans le ciel
  rationale: « Consigné » garde l’image concrète d’une inscription dans un registre céleste avec une formulation française naturelle.
- source_word: ሀሎ በኵሉ ዕለት
  choice: chaque jour
  rationale: Rend sobrement la continuité quotidienne, tandis que la note conserve la nuance possible d’une présence permanente.
- source_word: በቅድሜሁ ለልዑል
  choice: devant le Très-Haut
  rationale: Conserve le titre divin et l’image judiciaire d’un registre placé en sa présence.
theological_decisions:
- issue: Registre céleste des péchés
  choice: Maintenir l’image concrète selon laquelle tout péché est consigné dans le ciel devant le Très-Haut.
  alternative: Paraphraser comme une simple affirmation que Dieu connaît tous les péchés.
  rationale: Le verbe « écrire » et le lieu « dans le ciel » soutiennent explicitement l’imagerie apocalyptique du registre; il ne faut pas l’aplanir en une affirmation générale de l’omniscience divine.
- issue: Personne grammaticale du déni
  choice: 'Traduire à la deuxième personne : « vous ne savez ni ne voyez ».'
  alternative: 'Introduire un discours direct à la première personne : « Nous ne savons pas et nous ne voyons pas ».'
  rationale: Les formes verbales guèzes sont à la deuxième personne du pluriel; la traduction conserve cette donnée sans transformer le passage en citation directe.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « esprit / cœur » ainsi que l’imagerie apocalyptique du registre céleste sont conservés; la syntaxe évite toutefois une lourde répétition de la négation.
