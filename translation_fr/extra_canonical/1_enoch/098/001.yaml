base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: fr
  text: Et maintenant, je vous le jure, à vous qui êtes sages comme à vous qui êtes insensés, que vous verrez beaucoup de choses sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque naturellement en français une nouvelle étape du discours tout en conservant la conjonction et la valeur temporelle.
- source_word: እኔ
  choice: je
  rationale: Le pronom de première personne est nécessaire en français et demeure mis en relief par la formule « je vous le jure ».
- source_word: እምሕል
  choice: je vous le jure
  rationale: Le verbe መሐለ désigne l'action de jurer ou de prêter serment, et non une simple déclaration. La tournure avec « le » est idiomatique en français moderne.
- source_word: ለክሙ
  choice: à vous
  rationale: Le complément destinataire est rendu explicitement et repris dans l'adresse aux deux catégories d'auditeurs.
- source_word: ለጠቢባን
  choice: à vous qui êtes sages
  rationale: Cette formulation garde la substantivation du qualificatif tout en évitant le tour potentiellement figé « aux sages ».
- source_word: ወለአብዳን
  choice: comme à vous qui êtes insensés
  rationale: « Insensés » maintient le contraste moral et intellectuel avec les sages sans réduire le terme à une simple déficience d'intelligence; « comme à » exprime clairement que le serment s'adresse aux deux groupes.
- source_word: ብዙኅ
  choice: beaucoup de choses
  rationale: L'adjectif employé substantivement exprime une pluralité ou une abondance indéterminée; cette tournure est plus naturelle ici que « beaucoup » isolé.
- source_word: ትሬእዩ
  choice: vous verrez
  rationale: Le futur simple rend directement l'annonce adressée aux auditeurs.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Conserve la portée spatiale large et cosmique sans la restreindre à un pays particulier.
theological_decisions:
- issue: Portée de l'adresse aux sages et aux insensés
  choice: Le serment est explicitement adressé aux deux catégories, sans en préciser davantage l'identité.
  alternative: Y voir deux groupes particuliers au sein d'Israël, ou une adresse ironique visant surtout les méchants.
  rationale: Le verset établit seulement un contraste général. La traduction préserve cette amplitude et laisse le contexte ultérieur préciser les destinataires.
- issue: Relation syntaxique entre le serment et ce qui sera vu
  choice: La proposition « vous verrez… » donne le contenu solennel du serment après deux-points.
  alternative: Introduire une cause par « car vous verrez… » ou une complétive par « que vous verrez… ».
  rationale: Le guèze permet une relation discursive qui n'est pas entièrement explicitée. Les deux-points rendent naturellement le contenu de l'assermentation sans imposer une causalité; ils évitent aussi la lourdeur française de « je vous jure… que » avec l'adresse intercalée.
translation_notes:
  register: Français moderne, digne et accessible. La formule solennelle du serment est conservée, ainsi que le contraste équilibré entre les sages et les insensés. Le deux-points maintient une légère ouverture syntaxique tout en assurant une lecture fluide.
