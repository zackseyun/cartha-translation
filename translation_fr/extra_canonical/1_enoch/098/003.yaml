base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: fr
  text: C’est pourquoi ils n’ont ni instruction ni sagesse[a] ; à cause de cela, ils périront avec leurs biens, avec toute leur gloire et tout leur honneur. Dans la honte, dans le massacre et dans une grande misère[b], leurs esprits seront jetés dans la fournaise de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enseignement ». Le couple « instruction et sagesse » forme probablement une unité relevant du langage sapientiel plutôt que deux notions nettement séparées.
    reason: lexical_alternative
  - marker: b
    text: L’expression guèze est difficile ; elle peut aussi se traduire par « un grand dénuement » ou « une profonde détresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: instruction
  rationale: Le terme désigne un enseignement reçu ou une formation morale. « Instruction » convient au contexte sapientiel sans suggérer nécessairement un cadre scolaire.
- source_word: ጥበብ
  choice: sagesse
  rationale: Dans ce contexte moral et apocalyptique, le mot évoque la sagesse pratique et éthique plutôt qu’un savoir-faire technique.
- source_word: ይትሐጐሉ
  choice: ils périront
  rationale: Ce choix conserve la force de l’annonce de jugement sans préciser indûment le mode de destruction.
- source_word: ኅቡረ ምስለ
  choice: avec
  rationale: En français, « périr avec leurs biens » exprime naturellement le sort commun indiqué par la construction guèze.
- source_word: ንዋያቲሆሙ
  choice: leurs biens
  rationale: « Biens » couvre largement les possessions matérielles et s’intègre avec naturel dans un registre soutenu mais accessible.
- source_word: ስብሐቶሙ
  choice: leur gloire
  rationale: « Gloire » préserve le registre élevé et l’ironie du prestige terrestre qui disparaît lors du jugement.
- source_word: ክብሮሙ
  choice: leur honneur
  rationale: Le terme renvoie à l’honneur ou au rang social et reste distinct de « gloire » dans le parallélisme.
- source_word: በጽእለት
  choice: dans la honte
  rationale: Cette formulation conserve la dimension publique et morale de l’abaissement subi.
- source_word: በቅትል
  choice: le massacre
  rationale: Le substantif abrupt maintient l’accumulation des réalités de jugement et évoque une mort violente sans en préciser l’agent.
- source_word: በንዴት ዐቢይ
  choice: une profonde misère
  rationale: La nuance exacte est incertaine et peut inclure dénuement, misère ou détresse. « Profonde misère » demeure naturelle en français tout en gardant une portée assez large.
- source_word: ትትወደይ መንፈሶሙ
  choice: leurs esprits seront jetés
  rationale: La formulation passive exprime une assignation forcée au jugement et respecte l’objet explicite, « leurs esprits ».
- source_word: እቶነ እሳት
  choice: la fournaise de feu
  rationale: Cette traduction formelle conserve l’image vive et la construction guèze sans la réduire à la seule expression « fournaise ardente ».
theological_decisions:
- issue: Le jugement final désigne-t-il l’anéantissement ou une assignation punitive après la mort ?
  choice: leurs esprits seront jetés dans la fournaise de feu
  alternative: ils seront eux-mêmes détruits dans le feu
  rationale: Le texte donne explicitement « leurs esprits » comme sujet patient du verbe. La traduction maintient donc l’image apocalyptique du jugement sans décider de sa durée ni la réduire à la mort physique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation conserve la relation de cause à effet entre leur absence présente d’instruction et de sagesse et leur perte future. L’accumulation « honte, massacre et profonde misère » reproduit le rythme solennel du jugement sans lourdeur excessive.
