base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: fr
  text: Dès maintenant, sachez que toute la violence[a] que vous exercez est consignée chaque jour[b], jusqu’au jour de votre jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « oppression » : le terme guèze peut désigner une injustice violente et oppressive, et pas seulement la violence physique.'
    reason: lexical_alternative
  - marker: b
    text: Cette formulation évoque le thème apocalyptique des actes consignés en vue du jour du jugement.
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: Dès maintenant
  rationale: Rend naturellement le repère temporel prospectif et l’urgence de l’avertissement.
- source_word: ታእምሩ
  choice: sachez
  rationale: Impératif pluriel direct, qui conserve la vigueur de l’interpellation.
- source_word: ግፍዕክሙ
  choice: toute la violence que vous exercez
  rationale: Le terme désigne une injustice violente ou oppressive. « Violence » en garde la gravité, tandis que « exercez » reprend naturellement en français le verbe de même racine.
- source_word: ይጸሐፍ
  choice: est consignée
  rationale: Le passif imparfait présente une mise par écrit continue; « consignée » préserve l’image d’un registre sans l’expliciter excessivement.
- source_word: በኵሉ ዕለት
  choice: chaque jour
  rationale: Équivalent français idiomatique de l’expression temporelle.
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: jusqu’au jour de votre jugement
  rationale: Préserve la formule eschatologique et l’ambiguïté entre l’acte de juger et une éventuelle condamnation.
theological_decisions:
- issue: Registre des actes en vue du jugement
  choice: La traduction conserve l’image d’actes continuellement consignés jusqu’au jugement final.
  alternative: Comprendre la formulation comme une simple métaphore du souvenir des actes, ou comme un registre humain.
  rationale: Le passif et la mention du jour du jugement s’accordent avec le motif apocalyptique d’un registre céleste, mais le texte principal n’ajoute pas explicitement « dans le ciel ».
- issue: Jugement ou condamnation
  choice: jugement
  alternative: condamnation
  rationale: « Jugement » désigne le processus ou la sentence sans préciser d’avance son issue davantage que ne le fait l’expression source.
translation_notes:
  register: Français international moderne, direct et digne. La formulation garde l’interpellation au pluriel, l’aspect continu de la consignation et la tension judiciaire du texte sans ajouter de précision confessionnelle.
