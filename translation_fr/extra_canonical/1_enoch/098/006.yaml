base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: fr
  text: 'Je vous le jure[a], pécheurs, par le Grand Saint : toutes vos mauvaises actions sont dévoilées dans les cieux, et aucun de vos actes de violence n’est couvert ni caché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous ai juré ». Le verbe peut désigner un serment déjà prononcé ou, dans ce contexte, l’acte solennel de jurer.'
    reason: ambiguïté_aspectuelle
lexical_decisions:
- source_word: መሐልኩ፡ ለክሙ
  choice: Je vous le jure
  rationale: Le parfait éthiopien du verbe « jurer », accompagné du complément « à vous », exprime ici une déclaration solennelle. Le présent performatif est plus naturel en français que « j’ai juré » tout en conservant la force de l’énoncé.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Désignation directe des personnes coupables dans un contexte de jugement.
- source_word: በቅዱስ፡ ዐቢይ
  choice: par le Grand Saint
  rationale: La préposition introduit celui par qui le serment est prononcé. Cette formulation conserve l’ordre du guèze et traite l’expression comme un titre divin sans l’assimiler à une formule doctrinale ultérieure.
- source_word: ኵሉ፡ ግብርክሙ፡ እኩይ
  choice: toutes vos mauvaises actions
  rationale: Rend concrètement l’ensemble des œuvres ou actes moralement mauvais, dans un français courant et digne.
- source_word: ክሡት፡ ውእቱ፡ በሰማያት
  choice: sont dévoilées dans les cieux
  rationale: Le prédicat indique ce qui est découvert ou exposé. « Les cieux » respecte le pluriel du texte et son cadre apocalyptique.
- source_word: ግብረ፡ ግፍዕ
  choice: actes de violence
  rationale: ግፍዕ peut désigner la violence, l’oppression ou l’injustice. « Actes de violence » garde ici la dimension concrète du mal dénoncé.
- source_word: ወአልብክሙ፡ ክዱነ፡ ወእኁቡአ
  choice: et aucun … n’est couvert ni caché
  rationale: La construction négative signifie qu’il n’existe chez eux aucun acte de cette sorte qui soit couvert ou dissimulé. Elle prolonge le contraste avec les actions déjà dévoilées.
theological_decisions:
- issue: Titre divin dans la formule de serment
  choice: par le Grand Saint
  alternative: par le Saint, le Grand
  rationale: « Le Grand Saint » conserve les deux éléments du titre et la solennité apocalyptique, sans importer une désignation confessionnelle plus tardive.
- issue: Dévoilement céleste et absence de dissimulation
  choice: les mauvaises actions sont dévoilées dans les cieux, et aucun acte de violence n’est couvert ni caché
  alternative: les actes de violence sont inscrits et consignés
  rationale: Le guèze attesté comporte une négation existentielle et deux termes relatifs au fait de couvrir ou cacher. La traduction préserve donc l’opposition entre dévoilement et dissimulation, plutôt que d’introduire l’image distincte d’un registre céleste.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le rythme judiciaire du verset est conservé, ainsi que le pluriel « les cieux ». La répétition sémantique « couvert ni caché » reflète le parallélisme du texte source.
