base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a servant, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: fr
  text: 'Je vous le jure, pécheurs : de même qu’une montagne n’est pas devenue esclave et qu’une colline ne devient pas la servante d’une femme[a], de même le péché n’a pas été envoyé sur la terre. Ce sont plutôt les êtres humains qui l’ont créé d’eux-mêmes[b], et ceux qui le commettent tomberont sous une grande malédiction.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La comparaison qui ouvre le verset est difficile dans le texte guèze. Elle semble affirmer que, tout comme une montagne ou une colline ne devient pas esclave ou servante, le péché n’est pas une réalité imposée à la création.
    reason: textual_variant
  - marker: b
    text: L’expression guèze correspond ici à « d’eux-mêmes » ou « de leur propre initiative » ; sa forme littérale emploie le mot « tête » comme pronom réfléchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: Je vous le jure
  rationale: Le verbe exprime une affirmation solennelle sous forme de serment. Cette tournure en conserve la force tout en restant naturelle en français moderne.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Ce terme garde la portée morale et religieuse de l’interpellation dans ce discours de jugement.
- source_word: ደብር
  choice: montagne
  rationale: Le terme concret préserve l’image topographique du texte.
- source_word: ገብረ
  choice: n’est pas devenue esclave
  rationale: Dans cette proposition difficile, le verbe semble décrire l’entrée dans une condition servile. « Esclave » en conserve la force sans l’atténuer en simple service.
- source_word: እማገር ለብእሲት
  choice: la servante d’une femme
  rationale: Cette formulation maintient le parallèle féminin et l’image de dépendance, malgré l’obscurité syntaxique du passage.
- source_word: ኃጢአትኒ ኢተፈነወት ዲበ ምድር
  choice: le péché n’a pas été envoyé sur la terre
  rationale: 'Le passif du texte est conservé : le péché n’est pas présenté comme une réalité envoyée de l’extérieur.'
- source_word: አላ ሰብእ እምርእሶሙ ፈጠርዋ
  choice: Ce sont plutôt les êtres humains qui l’ont créé d’eux-mêmes
  rationale: Avec son suffixe pronominal, ርእስ fonctionne ici comme un réfléchi. « D’eux-mêmes » rend l’idiome sans introduire artificiellement la métaphore française « de leur propre tête ».
- source_word: ለመርገም ዐቢይ ይከውኑ
  choice: tomberont sous une grande malédiction
  rationale: Cette expression française naturelle conserve la destination judiciaire annoncée à ceux qui pratiquent le péché.
theological_decisions:
- issue: Origine du péché dans ce verset
  choice: Le péché n’est pas présenté comme envoyé sur la terre ; les êtres humains sont dits l’avoir eux-mêmes créé.
  alternative: La phrase pourrait seulement nier que le péché soit une composante naturelle ou imposée de la création, sans traiter directement de sa causalité divine.
  rationale: L’opposition explicite entre « n’a pas été envoyé » et « les êtres humains… l’ont créé » met en avant la responsabilité humaine. La traduction préserve cette affirmation sans en tirer une doctrine générale de l’origine du mal.
translation_notes:
  register: Français international moderne, digne et accessible. La comparaison servile, inhabituelle et textuellement difficile, est conservée plutôt que paraphrasée. « Êtres humains » rend ሰብእ de manière générique et évite que « hommes » soit compris comme exclusivement masculin.
