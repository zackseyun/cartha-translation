base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: fr
  text: Malheur à vous, insensés ! Car vous périrez dans votre folie, vous négligez les sages[a], et le bien ne vous atteindra pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous oubliez les sages » ; le verbe peut aussi signifier que l’on ne tient pas compte d’eux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le bonheur ne vous trouvera pas » ; le terme traduit par « bien » peut aussi évoquer le bien-être ou la prospérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Rend la formule de dénonciation prophétique avec sa force de jugement.
- source_word: አብዳን
  choice: insensés
  rationale: Exprime une folie morale et spirituelle dans un registre digne, sans recourir à une insulte familière.
- source_word: ትትሐጐሉ
  choice: vous périrez
  rationale: Le verbe vient de ሐጕለ, « périr, être perdu » ; le contexte et la forme verbale soutiennent ici un futur.
- source_word: በአቢድክሙ
  choice: dans votre folie
  rationale: Le substantif se rapporte à la folie, non à la richesse ; cette lecture évite d’importer le thème du verset précédent.
- source_word: ለጠበብን
  choice: les sages
  rationale: La forme désigne vraisemblablement des personnes sages, reprises comme objet par le suffixe pluriel du verbe suivant.
- source_word: ትረሰዕዎሙ
  choice: vous négligez
  rationale: Le verbe signifie fondamentalement « oublier » et peut, dans ce contexte moral, exprimer le fait de ne pas tenir compte des sages. « Négliger » est naturel en français tout en préservant cette idée, contrairement à « opprimer », qui est trop fort.
- source_word: ሠናይት
  choice: le bien
  rationale: Conserve la portée large du terme, qui peut évoquer ce qui est bon, le bonheur ou la prospérité.
- source_word: ኢይረክበክሙ
  choice: ne vous atteindra pas
  rationale: Le verbe signifie « trouver, atteindre, parvenir à » ; avec « le bien » comme sujet, cette formulation reste naturelle et proche de l’image source.
theological_decisions:
- issue: Objet de la dénonciation
  choice: Le verset condamne la folie qui mène à la perte ainsi que le mépris pratique des sages.
  alternative: Comprendre le verset comme une condamnation de la confiance dans les richesses et de l’oppression des sages.
  rationale: Les formes éthiopiennes de ce verset renvoient à « périr » et à la « folie », non à la confiance ou à la richesse. Le sens « opprimer » n’est pas retenu pour ትረሰዕዎሙ, dont le sens mieux attesté est « oublier, négliger ».
- issue: Portée du bien refusé
  choice: Maintenir le terme général « le bien ».
  alternative: Préciser « la prospérité », « le bonheur » ou « la bénédiction ».
  rationale: Le mot guèze est assez large ; le préciser imposerait une interprétation théologique ou matérielle que le texte ne tranche pas.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation sépare clairement les trois éléments de la dénonciation. « Insensés » préserve la portée morale du langage sapientiel ; « négligez » évite à la fois le littéralisme peu naturel de « oubliez » et la surtraduction « opprimez ».
