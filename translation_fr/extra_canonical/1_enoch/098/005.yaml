base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: fr
  text: Et la stérilité n’a pas été donnée à une femme[a] ; au contraire[c], c’est à cause de l’œuvre de ses mains[b] qu’elle meurt sans enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la privation d’enfants n’a pas été attribuée à une femme ». Le guèze oppose la stérilité au fait de mourir sans enfants.
    reason: lexical_alternative
  - marker: b
    text: « L’œuvre de ses mains » est une expression qui désigne ses actes ou sa conduite.
    reason: cultural_note
  - marker: c
    text: 'Ou : « à une femme ; mais, à cause de l’œuvre de ses mains, elle mourra sans enfants ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ምክነት
  choice: la stérilité
  rationale: Le nom désigne l’infertilité ou l’absence d’enfants. « Stérilité » conserve ici le sens concret et permet de distinguer cette condition du fait de mourir sans enfants.
- source_word: ለብእሲት
  choice: à une femme
  rationale: La construction avec ለ se rend naturellement par « à ». L’indéfini convient au caractère général de l’énoncé et n’introduit pas une femme particulière.
- source_word: ኢተውህበት
  choice: n’a pas été donnée
  rationale: Cette forme passive du verbe « donner » est traduite directement, sans préciser qui donne ni transformer le don en destin imposé.
- source_word: አላ
  choice: au contraire
  rationale: Le connecteur marque une opposition forte entre la stérilité niée et la mort sans enfants présentée ensuite.
- source_word: በእንተ
  choice: c’est à cause de
  rationale: La locution exprime la cause. La construction clivée française met en relief ce rapport causal sans ajouter de contenu.
- source_word: ግብረ እዴሃ
  choice: l’œuvre de ses mains
  rationale: La traduction conserve l’image concrète, qui fonctionne comme un idiome désignant ses actes, sans en préciser la nature.
- source_word: ትመውት
  choice: elle meurt
  rationale: Le présent français rend bien la portée générale ou gnomique possible de l’imparfait guèze, tout en laissant ouverte une nuance prospective.
- source_word: ዘእንበለ ውሉድ
  choice: sans enfants
  rationale: La locution reproduit simplement l’idée d’être dépourvue d’enfants ou de descendance et s’intègre naturellement après « meurt ».
theological_decisions:
- issue: Nature du jugement subi par la femme
  choice: Le texte oppose la stérilité, qui ne lui a pas été donnée, au fait qu’elle meurt sans enfants à cause de ses propres actes.
  alternative: On peut comprendre plus généralement que l’absence d’enfants n’est pas le sort qui lui a été attribué, mais que la mort l’est devenue à cause de ses actes.
  rationale: La négation suivie de አላ et de la proposition causale établit une opposition et relie la mort à ses actes. La traduction n’identifie ni l’agent du « don » ni la nature précise de ces actes.
- issue: Valeur temporelle de ትመውት
  choice: 'Présent gnomique : « elle meurt ».'
  alternative: 'Valeur future ou judiciaire : « elle mourra ».'
  rationale: Le contexte est susceptible d’énoncer un principe général, mais la morphologie peut aussi porter une lecture prospective. Le texte principal retient le présent naturel en français et la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du guèze tout en étant naturelle. « Au contraire » explicite l’opposition forte ; les notes préservent les variantes lexicales et temporelles réelles.
