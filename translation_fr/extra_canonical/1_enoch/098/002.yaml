  naturalness: La phrase actuelle laisse « la compagnie plus qu’une vierge » sans verbe explicite après « vous aimez vous parer », ce qui crée une coordination elliptique maladroite et peut faire hésiter sur la portée de « aimez ». La répétition de « vous aimez » rend les deux comparaisons immédiatement intelligibles en français moderne.
  terminology: « Royauté », « autorité », « pourpre » et « splendeur » conviennent au registre et au catalogue de statut et de luxe. « Pourpre » est justement éclairé comme étoffe ou teinture prestigieuse, sans transformer la note en certitude excessive.
