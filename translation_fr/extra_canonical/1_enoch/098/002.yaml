base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: fr
  text: Car vous, les hommes, vous aimez vous parer plus que les femmes[a], et vous aimez la compagnie plus qu’une vierge ; dans la royauté, la grandeur et l’autorité, dans l’argent, l’or et la pourpre[b], ainsi que dans la splendeur et la nourriture, tout cela sera répandu comme de l’eau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression établit une comparaison : ces hommes recherchent la parure pour eux-mêmes davantage que les femmes.'
    reason: clarification grammaticale et correction d’une ancienne analyse du guèze
  - marker: b
    text: La « pourpre » désigne probablement une étoffe teinte coûteuse, symbole de luxe et de rang élevé.
    reason: note culturelle
  - marker: c
    text: L’image finale peut évoquer soit la dissipation de ces biens comme de l’eau, soit leur prodigalité sans retenue.
    reason: lecture alternative
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: vous aimez vous parer
  rationale: Le groupe exprime l’amour de la beauté ou de la parure portée sur soi. Cette formulation française naturelle conserve l’idée d’ornement personnel sans reprendre l’ancienne analyse « préparer ».
- source_word: አንትሙ፡ ዕደው
  choice: vous, les hommes
  rationale: ዕደው désigne ici les hommes, auxquels s’adresse directement le reproche.
- source_word: ፈድፋደ፡ እምአንስት
  choice: plus que les femmes
  rationale: 'La construction ፈድፋደ እም- a une valeur comparative : « davantage que / plus que », et non « excès provenant de ».'
- source_word: ኅብረ
  choice: la compagnie
  rationale: Le mot peut désigner l’association ou la compagnie. Cette valeur, retenue dans la couche de consultation, est préservée sans préciser la nature de la relation.
- source_word: መንንግሥት
  choice: royauté
  rationale: Rend le statut ou pouvoir royal tout en maintenant le premier élément du catalogue de grandeur sociale et matérielle.
- source_word: ሥልጣን
  choice: autorité
  rationale: Terme courant et digne pour le pouvoir de gouverner ou de commander.
- source_word: ሜላት
  choice: pourpre
  rationale: Dans ce catalogue de luxe, le terme renvoie vraisemblablement à la pourpre ou à des étoffes teintes de cette couleur prestigieuse.
- source_word: ክብር
  choice: splendeur
  rationale: Dans l’énumération de signes visibles de richesse et de prestige, « splendeur » convient mieux que le sens relationnel d’« honneur ».
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: tout cela sera répandu comme de l’eau
  rationale: Conserve l’image finale et sa forme passive, tout en donnant à la phrase française un référent collectif explicite.
theological_decisions:
- issue: Portée du reproche concernant la parure et la compagnie
  choice: Le texte dénonce conjointement la recherche masculine de parure, la compagnie recherchée et un ensemble plus large de prestige et de luxe.
  alternative: Comprendre le verset comme visant surtout l’immoralité sexuelle, ou seulement l’ostentation matérielle.
  rationale: La comparaison avec les femmes et la vierge est suivie d’un catalogue de royauté, pouvoir, métaux précieux, pourpre, splendeur et nourriture. La traduction maintient cette tension sans réduire le reproche à une seule catégorie de faute.
- issue: Référent et portée de l’image « répandu comme de l’eau »
  choice: « tout cela » reprend collectivement les biens et formes de prestige énumérés.
  alternative: Comprendre que les personnes elles-mêmes répandent ces richesses avec prodigalité.
  rationale: La forme passive favorise l’idée que les éléments du catalogue seront répandus ou dissipés, mais la syntaxe et l’image restent assez ouvertes pour justifier une note.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « vous, les hommes, vous » marque l’adresse emphatique du guèze. L’énumération est légèrement structurée pour rester lisible, sans effacer son effet d’accumulation.
