base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: fr
  text: Après cela, il arriva que son nom fut élevé, de son vivant, devant ce Fils de l’homme et devant le Seigneur des esprits[a], loin de ceux qui habitent sur la terre ferme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « son nom fut élevé ». L’expression peut désigner Hénoch lui-même, admis de son vivant auprès du Fils de l’homme et du Seigneur des esprits.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la terre ». Le guèze emploie plus concrètement l’expression « sur le sol sec » ou « sur la terre ferme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: fut élevé
  rationale: Le verbe exprime une élévation ou un mouvement vers le haut. « Fut élevé » conserve l’image spatiale sans trancher entre enlèvement et exaltation.
- source_word: ስሙ፡
  choice: son nom
  rationale: La traduction maintient l’expression littérale, dans laquelle le nom peut représenter étroitement la personne ou son identité, sans la réduire à la seule renommée.
- source_word: ሕያው፡
  choice: de son vivant
  rationale: Cette formulation française naturelle rend la valeur temporelle du terme et indique que l’événement survient alors qu’Hénoch est encore en vie.
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: auprès de ce Fils de l’homme
  rationale: « Auprès de » exprime l’accès à la présence de cette figure tout en laissant subsister la nuance de mouvement. Le démonstratif et la valeur titulaire de l’expression sont conservés.
- source_word: እግዚአ፡ መናፍስት፡
  choice: le Seigneur des esprits
  rationale: Cette traduction garde le titre solennel et récurrent de 1 Hénoch sans préciser indûment de quels esprits il s’agit.
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: loin de ceux qui habitent sur la terre ferme
  rationale: « Terre ferme » préserve l’image concrète du sol sec et le contraste entre l’élévation d’Hénoch et les habitants du monde terrestre.
theological_decisions:
- issue: Faut-il interpréter directement « son nom fut élevé » comme l’enlèvement d’Hénoch ?
  choice: Conserver « son nom fut élevé » dans le texte principal.
  alternative: « il fut enlevé vivant » ou « sa renommée fut exaltée »
  rationale: Le guèze met explicitement le « nom » au premier plan. Cette formulation peut associer le nom à la personne elle-même, mais le texte ne doit pas être rendu plus univoque qu’il ne l’est.
- issue: Valeur de ወልደ እጓለ እመሕያው
  choice: « ce Fils de l’homme »
  alternative: « ce fils d’homme » ou « cet être humain »
  rationale: Dans les Paraboles, l’expression possède une forte portée titulaire et apocalyptique. La majuscule signale cette fonction locale sans imposer une identification doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe conserve l’étrangeté signifiante de « son nom fut élevé », tandis que « de son vivant » clarifie naturellement la valeur temporelle de ሕያው.
