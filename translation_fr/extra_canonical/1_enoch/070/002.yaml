base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: fr
  text: Après cela, son nom fut élevé, de son vivant, auprès de ce Fils de l’homme et auprès du Seigneur des esprits, loin de ceux qui habitent sur la terre ferme. Il fut élevé sur les chars de l’esprit[a], et son nom disparut du milieu d’eux[b]. À partir de ce jour, je ne fus plus compté parmi eux[c]. Il me plaça entre les deux vents, entre le nord et l’ouest, là où les anges prirent des cordes afin de mesurer pour moi un lieu destiné aux élus et aux justes. Là, je vis les premiers pères et les justes qui, depuis toujours[d], demeurent en ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « L’esprit » peut aussi se comprendre comme « le vent » ; le texte évoque littéralement des « chars de l’esprit » ou des « chars du vent ».
    reason: ambiguïté_lexicale
  - marker: b
    text: 'Littéralement : « et son nom sortit du milieu d’eux ». Le sens paraît être qu’il cessa d’être présent ou connu parmi les habitants de la terre.'
    reason: traduction_contextuelle
  - marker: c
    text: 'Autre traduction possible : « je ne fus plus entraîné parmi eux » ou « je ne fus plus associé à eux ».'
    reason: ambiguïté_lexicale
  - marker: d
    text: 'Ou : « depuis le commencement ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ተለዐለ፡ ስሙ፡ ሕያው፡
  choice: son nom fut élevé, de son vivant
  rationale: Le texte associe littéralement « son nom », le verbe « être élevé » et « vivant ». La formulation française conserve l’idée inhabituelle que son nom est élevé pendant sa vie, sans la réduire soit à un déplacement corporel, soit à une simple exaltation honorifique.
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ ዕጓለ፡ እመሕያው፡
  choice: auprès de ce Fils de l’homme
  rationale: « Auprès de » rend le mouvement vers la présence de la figure désignée, tandis que « ce Fils de l’homme » préserve la désignation démonstrative et apocalyptique du guèze.
- source_word: እምእለ፡ የኀድሩ፡ ዲበ፡ የብስ፡
  choice: loin de ceux qui habitent sur la terre ferme
  rationale: La préposition marque ici l’éloignement ou la séparation d’avec les habitants de la terre. « Terre ferme » rend የብስ, par opposition possible aux eaux, sans introduire le terme plus général de « monde ».
- source_word: በሠረገላተ፡ መንፈስ፡
  choice: sur les chars de l’esprit
  rationale: 'Le pluriel « chars » reflète ሠረገላተ. Le singulier « de l’esprit » maintient la construction source et son ambiguïté : il peut évoquer le domaine spirituel, un vent ou un esprit agent.'
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ፡
  choice: et son nom disparut du milieu d’eux
  rationale: Le verbe signifie fondamentalement « sortir ». Dans ce contexte, « disparut du milieu d’eux » exprime qu’il ne se trouve plus parmi eux, tout en signalant en note la formulation plus littérale.
- source_word: ኢተስሕብኩ፡ በማእከሎሙ፡
  choice: je ne fus plus compté parmi eux
  rationale: Dans ce contexte, le verbe passif peut décrire le fait d’être entraîné, associé ou compté avec un groupe. La suite à la première personne et la séparation d’avec les habitants terrestres favorisent le sens idiomatique « compté parmi ».
- source_word: ክልኤቱ፡ መናፍስት፡
  choice: les deux vents
  rationale: Bien que መናፍስት puisse signifier « esprits », les précisions géographiques « entre le nord et l’ouest » favorisent ici « vents », sens bien attesté du mot dans les descriptions cosmologiques.
- source_word: ከመ፡ ይስፍሩ፡ ሊተ፡ መካነ፡
  choice: afin de mesurer pour moi un lieu
  rationale: Le but exprimé par ከመ est conservé, de même que l’image concrète des cordes servant à délimiter un emplacement.
- source_word: እምዓለም፡
  choice: depuis toujours
  rationale: L’expression peut désigner l’ancienneté indéfinie, « depuis le commencement » ou « depuis toujours ». Cette dernière formulation est naturelle et conserve la portée temporelle forte sans imposer une conception métaphysique précise de l’éternité.
theological_decisions:
- issue: Nature de l’élévation d’Hénoch
  choice: Conserver conjointement l’élévation de son nom et son transport sur des chars de l’esprit
  alternative: Comprendre tout le passage comme une exaltation honorifique, ou uniquement comme un déplacement corporel
  rationale: Le texte juxtapose une élévation du « nom », le fait d’être vivant et un transport en chars. La traduction garde cette tension entre reconnaissance céleste, vision et translation, sans choisir un mécanisme doctrinal.
- issue: Identité du « Fils de l’homme » et rapport avec le Seigneur des esprits
  choice: Maintenir les deux titres tels qu’ils sont coordonnés
  alternative: Les fusionner explicitement en une seule personne ou les distinguer comme deux êtres séparés
  rationale: La coordination source ne tranche pas à elle seule leur relation exacte. La traduction ne doit ni identifier ni séparer davantage les figures que ne le fait le texte.
- issue: Sens de « esprit » dans les chars et de « vents » dans la localisation
  choice: Rendre le premier par « esprit » et le second par « vents » selon chaque contexte
  alternative: Employer uniformément « esprits » ou uniformément « vents »
  rationale: Le même champ lexical peut porter les deux sens. Les chars gardent une qualité spirituelle ambiguë, tandis que le nord et l’ouest indiquent clairement des directions associées aux vents.
- issue: Séjour des pères et des justes « depuis toujours »
  choice: Préserver l’expression temporelle forte sans l’expliquer
  alternative: La reformuler comme une affirmation doctrinale explicite de préexistence éternelle
  rationale: Le texte affirme leur présence depuis une époque indéfiniment ancienne, mais ne précise pas la nature de cette existence. La traduction laisse ouverte la tension.
translation_notes:
  register: Français international moderne, narratif et solennel sans archaïsmes. Les répétitions apocalyptiques (« il fut élevé », « entre… entre… », « parmi eux ») sont conservées quand elles structurent le passage. La formulation reste accessible tout en maintenant les images cosmologiques et les changements de personne présents dans le témoin guèze.
