base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: fr
  text: Ne craignez pas les pécheurs[a], vous qui êtes justes, car le Seigneur les livrera de nouveau entre vos mains[b], afin que vous exerciez contre eux le jugement selon votre volonté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « N’ayez pas peur à cause des pécheurs. » La préposition guèze እም peut marquer l’origine ou la cause.'
    reason: lexical_alternative
  - marker: b
    text: '« Entre vos mains » signifie ici : sous votre pouvoir ou votre autorité.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « comme vous le voudrez » ou « selon votre désir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: Ne craignez pas
  rationale: Impératif négatif au pluriel; cette formulation conserve la force directe de l’exhortation.
- source_word: ጻድቃን
  choice: vous qui êtes justes
  rationale: Rend l’adresse plurielle substantivée dans un français naturel, tout en maintenant l’identité distincte du groupe.
- source_word: እምኃጥኣን
  choice: les pécheurs
  rationale: Avec le verbe de crainte, le français idiomatique construit directement le complément; une note conserve la valeur possible de la préposition እም.
- source_word: ካዕበ
  choice: de nouveau
  rationale: Exprime la répétition ou le renouvellement de l’action et convient au mouvement de renversement du contexte.
- source_word: ያገብኦሙ
  choice: les livrera
  rationale: Dans la construction avec «entre vos mains», le verbe indique une remise au pouvoir d’autrui.
- source_word: ውስተ እዴክሙ
  choice: entre vos mains
  rationale: Conserve l’image idiomatique d’un transfert sous l’autorité ou au pouvoir des destinataires.
- source_word: ከመ ትግበሩ
  choice: afin que vous exécutiez
  rationale: Rend explicitement la proposition de but; avec «jugement», «exécuter» est idiomatique et garde l’action attribuée aux justes.
- source_word: ኵነኔ
  choice: le jugement
  rationale: Préserve le registre judiciaire et laisse ouvertes les nuances de verdict, de condamnation et de mise à exécution.
- source_word: በከመ ፈቀድክሙ
  choice: selon votre volonté
  rationale: Reproduit sobrement l’idée d’une action conforme au vouloir des justes sans la tonalité potentiellement hédoniste de «selon votre plaisir» en français actuel.
theological_decisions:
- issue: Les justes participent-ils activement au jugement des pécheurs, ou assistent-ils seulement à leur réhabilitation?
  choice: Les justes sont présentés comme des agents qui exécutent le jugement après que le Seigneur a livré les pécheurs entre leurs mains.
  alternative: Ils ne feraient qu’assister au jugement divin, ou recevraient une autorité sans exercer eux-mêmes le jugement.
  rationale: La proposition de but et l’expression «entre vos mains» indiquent ensemble une participation active. La traduction conserve ce motif de renversement apocalyptique sans l’atténuer en simple réhabilitation.
translation_notes:
  register: Français international actuel, digne et direct. L’adresse «vous qui êtes justes» évite le caractère parfois abstrait de «les justes» et conserve le vocatif pluriel. Les images judiciaires et le renversement apocalyptique sont maintenus sans harmonisation doctrinale.
