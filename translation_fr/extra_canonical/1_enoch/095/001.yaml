base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: fr
  text: 'Qui m’accordera ceci : que mes yeux deviennent un nuage d’eau[a], afin que je pleure sur vous[b], que je répande mes larmes comme un nuage d’eau et que je trouve du repos loin du chagrin de mon cœur ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « un nuage chargé de pluie ». L’image guèze, répétée dans le verset, assimile les yeux à un nuage d’où ruissellent les larmes.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « vous » est au pluriel. Dans le contexte, il renvoie vraisemblablement aux pécheurs ou aux méchants auxquels s’adressent les paroles de malheur.
    reason: cross_reference
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: Qui m’accordera ceci
  rationale: L’interrogation exprime un souhait douloureux. « M’accordera » rend le verbe « donner » avec sa désinence de première personne, tandis que « ceci » introduit naturellement en français la proposition qui suit.
- source_word: ለአዕይንትየ፡ ከመ፡ ይኩና፡ ደመና፡ ማይ
  choice: que mes yeux deviennent un nuage d’eau
  rationale: La formulation conserve l’image poétique inhabituelle du guèze au lieu de la réduire à des yeux remplis de larmes.
- source_word: እብኪ፡ ዲቤክሙ
  choice: que je pleure sur vous
  rationale: « Sur vous » garde la relation assez ouverte entre lamentation à propos des destinataires, compassion pour eux et plainte dirigée vers eux.
- source_word: እክዐው፡ አንብዐየ
  choice: que je répande mes larmes
  rationale: Cette tournure exprime l’écoulement abondant et volontaire suggéré par le verbe, tout en restant naturelle en français.
- source_word: ከመ፡ ደመና፡ ማይ
  choice: comme un nuage d’eau
  rationale: La répétition exacte de l’image est maintenue pour préserver sa force rhétorique.
- source_word: ወአዕርፍ፡ እምሐዘነ፡ ልብየ
  choice: et que je trouve du repos loin du chagrin de mon cœur
  rationale: « Trouver du repos » conserve la métaphore concrète du repos; « loin du chagrin » rend la séparation ou le soulagement exprimé par la préposition.
theological_decisions:
- issue: Faut-il expliciter l’identité morale des destinataires ?
  choice: Conserver le simple pronom pluriel « vous »
  alternative: Préciser « vous, pécheurs » ou « vous, méchants »
  rationale: Le verset emploie seulement un pronom pluriel. Le contexte peut désigner les pécheurs ou les méchants, mais l’ajouter au texte lèverait une implicitation de la source.
- issue: Faut-il lisser la métaphore du nuage d’eau ?
  choice: Conserver « nuage d’eau » dans le texte principal
  alternative: Employer « nuage de pluie » ou paraphraser par « des yeux remplis de larmes »
  rationale: L’image répétée est poétique et volontairement saisissante. La conserver respecte la tension et la texture du texte sans imposer une interprétation.
translation_notes:
  register: 'Français international moderne, soutenu sans archaïsme. La ponctuation après « ceci » rend lisible la construction proleptique du guèze. La chaîne de subjonctifs maintient l’unité du souhait : pleurer, répandre les larmes et trouver du repos.'
