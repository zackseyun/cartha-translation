base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: fr
  text: Malheur à vous qui prononcez des malédictions irrévocables[a] ! La guérison est loin de vous à cause de vos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des malédictions qui ne peuvent être déliées ». On pourrait aussi traduire « des anathèmes »; le texte évoque des paroles contraignantes qu’il n’est pas possible d’annuler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Formule prophétique de dénonciation, rendue de façon naturelle et solennelle en français.
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: qui prononcez des malédictions
  rationale: Le verbe ታወግዙ et son objet apparenté ግዘታተ renvoient ici à l’action de maudire ou de lancer des anathèmes, et non à la pesée de l’argent. « Malédictions » est plus courant que « anathèmes » tout en conservant la portée du texte.
- source_word: ከመ፡ እ ይትፈትሑ
  choice: irrévocables
  rationale: 'La séquence est comprise, conformément à la correction textuelle signalée, comme la négation suivie du passif de « délier » : ces malédictions ne peuvent être déliées ou annulées. « Irrévocables » exprime cela avec concision en français moderne.'
- source_word: ወፈውስ
  choice: La guérison
  rationale: Le terme désigne la guérison ou le remède et peut garder ici une résonance à la fois concrète et restauratrice.
- source_word: ርኁቅ፡ እምኔክሙ
  choice: est loin de vous
  rationale: Conserve directement la métaphore spatiale du texte source.
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: à cause de vos péchés
  rationale: Rend clairement le rapport causal et le pluriel collectif du texte.
theological_decisions:
- issue: Nature des paroles prononcées
  choice: malédictions
  alternative: anathèmes ou serments contraignants
  rationale: « Malédictions » est naturel et accessible, tandis que la note signale la valeur plus technique possible d’« anathèmes » sans imposer une pratique institutionnelle précise.
- issue: Sens de l’impossibilité de délier
  choice: irrévocables
  alternative: qui ne peuvent être déliées
  rationale: Le choix principal restitue l’effet sémantique en français idiomatique. La formulation littérale est conservée en note afin de rendre visible l’image et l’ambiguïté du verbe.
- issue: Portée de la guérison
  choice: Ne pas préciser s’il s’agit d’une guérison physique, morale ou spirituelle
  alternative: interpréter explicitement comme pardon ou restauration spirituelle
  rationale: Le mot source reste assez large; la traduction préserve donc cette tension sans l’assimiler à une doctrine particulière du pardon.
translation_notes:
  register: Français international moderne, digne et accessible. Le point d’exclamation marque la formule de malheur; la seconde proposition devient une phrase distincte pour éviter une coordination lourde. Le seul appel de note [a] figure bien dans le texte principal.
