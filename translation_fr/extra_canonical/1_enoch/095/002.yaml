base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/002.yaml
  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: fr
  text: Qui vous a permis de vous livrer à la haine et au mal ? Et la condamnation vous atteindra, pécheurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኑ
  choice: Qui
  rationale: Conserve l’ouverture interrogative et la force directe du reproche.
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: vous a permis de pratiquer
  rationale: Le verbe « donner » suivi de ከመ peut exprimer ici l’autorisation. Cette formulation est naturelle en français et convient à la question rhétorique.
- source_word: ጽልአ
  choice: la haine
  rationale: Équivalent direct qui préserve la portée morale forte du nom.
- source_word: ወእኩየ
  choice: et le mal
  rationale: Rend le terme moral général sans en restreindre le sens à un acte précis.
- source_word: ይረከበክሙ
  choice: vous atteindra
  rationale: Le verbe peut signifier trouver, rejoindre ou atteindre. Dans ce contexte judiciaire, « atteindra » exprime clairement l’arrivée inéluctable de la condamnation.
- source_word: ለኃጥኣን
  choice: pécheurs
  rationale: 'Le préfixe ለ marque ici vraisemblablement l’accusatif en apposition au suffixe objet « vous » : « vous, pécheurs », et non un datif « pour les pécheurs ».'
- source_word: ኵነኔ
  choice: la condamnation
  rationale: Le contexte de dénonciation appelle une sentence défavorable plutôt qu’un jugement neutre.
theological_decisions:
- issue: Portée judiciaire de ኵነኔ
  choice: la condamnation
  alternative: le jugement ; la sentence
  rationale: Le contexte vise des auteurs du mal et annonce une décision punitive ; « condamnation » conserve cette force sans ajouter de contenu doctrinal.
- issue: Construction de ለኃጥኣን avec l’objet de deuxième personne
  choice: vous atteindra, pécheurs
  alternative: atteindra les pécheurs ; sera pour les pécheurs
  rationale: L’analyse grammaticale la plus solide comprend ለ comme marque accusative et « pécheurs » comme apposition explicitant le pronom objet pluriel.
translation_notes:
  register: Français international moderne, direct et digne. « Pratiquer la haine et le mal » garde le caractère habituel ou actif de ትግበሩ, tandis que la virgule avant « pécheurs » rend clairement l’apposition.
