translation:
  language: fr
  text: Malheur à vous qui rendez le mal à votre prochain[a], car vous recevrez en retour selon vos actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le même radical verbal guèze est employé dans les deux propositions : ceux qui « rendent » le mal le « recevront en retour ».'
