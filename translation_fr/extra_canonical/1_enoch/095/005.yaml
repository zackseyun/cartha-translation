lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Formule française naturelle de dénonciation prophétique, qui conserve la force judiciaire de l’interjection et de son complément.
- source_word: እለ
  choice: qui
  rationale: Introduit directement le groupe auquel s’adresse l’oracle.
- source_word: ትፈድዩ
  choice: rendez
  rationale: Le verbe exprime l’idée de rendre ou de rétribuer; ce choix permet de conserver en français l’écho avec la forme correspondante de la seconde proposition.
- source_word: እኩየ
  choice: le mal
  rationale: Terme moral large qui ne réduit pas le sens à un dommage physique particulier.
- source_word: ለቢጽክሙ
  choice: à votre prochain
  rationale: Rend la relation interpersonnelle exprimée par le terme guèze dans un français biblique courant et intelligible.
- source_word: እስመ
  choice: car
  rationale: Introduit avec concision le motif de la déclaration de malheur.
- source_word: ትትፈድዩ
  choice: vous serez payés en retour
  rationale: Préserve la formulation passive et l’idée de rétribution, sans nommer l’agent laissé implicite dans le texte source.
- source_word: በከመ
  choice: selon
  rationale: Exprime la norme ou la mesure proportionnelle de la rétribution.
- source_word: ምግባሪክሙ
  choice: vos actes
  rationale: Désigne concrètement les actions et convient au contexte de jugement sans ajouter de nuance doctrinale étrangère.
theological_decisions:
- issue: Nature et agent de la rétribution
  choice: 'Conserver un passif dont l’agent n’est pas nommé: « vous serez payés en retour ».'
  alternative: Expliciter que Dieu rendra à chacun selon ses actes, ou présenter la conséquence comme un simple retour impersonnel du mal.
  rationale: Le contexte suggère un jugement, mais la forme source n’identifie pas explicitement l’agent. Le passif maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Malheur à vous » maintient le registre prophétique; « payés en retour » conserve autant que possible le jeu de réciprocité du texte source sans expliciter l’agent du jugement.
