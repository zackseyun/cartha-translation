base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: fr
  text: Et j’élevai mes mains dans la justice, et je bénis le Saint et le Grand. Je parlai avec le souffle de ma bouche[a] et avec la langue de chair que Dieu a faite pour les enfants de la chair des hommes[b], afin qu’ils parlent avec elle. Et il leur donna souffle, langue et bouche, afin qu’ils parlent par leur moyen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’esprit de ma bouche ». Le terme guèze peut signifier « souffle », « esprit » ou « vent »; ici, « souffle » s’accorde le mieux avec l’énumération des moyens de la parole.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression est volontairement corporelle : littéralement, « les enfants de la chair des hommes ». Elle souligne la condition charnelle et créée des humains plutôt que de les désigner par un terme générique plus fluide.'
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: j’élevai mes mains
  rationale: Le verbe désigne ici le geste concret d’élever les mains dans la prière; le pluriel du nom est conservé.
- source_word: በጽድቅ
  choice: dans la justice
  rationale: La tournure prépositionnelle garde la solennité et l’ambiguïté du rapport entre la justice et le geste de prière.
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: je bénis le Saint et le Grand
  rationale: Les deux adjectifs sont compris comme des titres coordonnés désignant Dieu, sans ajout doctrinal.
- source_word: ነገርኩ በመንፈስ አፉየ
  choice: je parlai avec le souffle de ma bouche
  rationale: Dans cette énumération des moyens corporels de la parole, « souffle » convient mieux que « Esprit », tout en laissant « esprit » en note comme possibilité lexicale.
- source_word: በልስነ ሥጋ
  choice: avec la langue de chair
  rationale: Cette formulation concrète conserve l’insistance du texte sur la corporéité humaine.
- source_word: ውሉደ ሥጋ ሰብእ
  choice: les enfants de la chair des hommes
  rationale: La redondance corporelle du guèze est volontairement préservée plutôt que réduite à « les êtres humains ».
- source_word: ከመ ይትናገሩ ባቲ
  choice: afin qu’ils parlent avec elle
  rationale: Le pronom féminin singulier renvoie naturellement à la langue.
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: il leur donna souffle, langue et bouche
  rationale: La série des facultés et organes de la parole est rendue sans articles afin de conserver son rythme resserré.
- source_word: ከመ ይትናገሩ ቦቱ
  choice: afin qu’ils parlent par leur moyen
  rationale: La formulation française exprime l’instrumentalité et renvoie collectivement aux trois dons précédents.
theological_decisions:
- issue: Valeur de መንፈስ dans le contexte
  choice: souffle
  alternative: esprit, ou Esprit
  rationale: Le contexte immédiat porte sur la capacité humaine créée de parler au moyen du souffle, de la langue et de la bouche. La majuscule introduirait une affirmation pneumatologique que le passage n’exige pas.
- issue: Maintien de l’anthropologie corporelle du verset
  choice: conserver « langue de chair » et « enfants de la chair des hommes »
  alternative: lisser en « langue humaine » et « êtres humains »
  rationale: Le guèze insiste sur la chair et sur la condition créée de l’être humain; lisser ces expressions affaiblirait cette tension rhétorique.
- issue: Identification des épithètes divines
  choice: « le Saint et le Grand » comme double titre d’un même référent
  alternative: « le Saint et le Grand Être » ou « le Saint et le Très-Grand »
  rationale: La traduction garde les deux épithètes et leur sobriété, sans ajouter un substantif absent ni intensifier le degré de l’adjectif.
translation_notes:
  register: Français moderne, digne et légèrement solennel. Les formulations inhabituelles « dans la justice », « langue de chair » et « enfants de la chair des hommes » sont maintenues parce qu’elles reflètent la densité et l’imagerie du texte source; la ponctuation en phrases distinctes évite toutefois une période française excessivement lourde.
