base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: fr
  text: Béni sois-tu, Seigneur, grand Roi, puissant dans ta grandeur, Seigneur de toute la création du ciel[a], Roi des rois et Dieu du monde entier. Ta souveraineté[b], ton règne et ta grandeur subsistent pour toujours et à jamais, et ton autorité s’étend à toutes les générations des générations[c]. Tous les cieux sont ton trône pour toujours, et la terre entière est l’escabeau de tes pieds pour toujours et à jamais[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute la création du ciel » ; on peut aussi comprendre : « toute la création céleste » ou « toute créature du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme du témoin guèze est difficile ; on peut aussi traduire par « royauté », « domination », « majesté » ou « gloire ».
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « pour toutes les générations des générations », formule qui insiste sur la continuité du pouvoir divin au fil des générations.'
    reason: lexical_alternative
  - marker: d
    text: Comparer Ésaïe 66.1 pour l’image cosmique des cieux comme trône et de la terre comme escabeau.
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ፡ አንተ
  choice: Béni sois-tu
  rationale: Formule de bénédiction adressée directement à Dieu. Cette tournure française conserve le ton doxologique et solennel sans archaïsme excessif.
- source_word: ንጉሥ፡ ዐቢይ፡ ወኃያል፡ በዕበየ፡ ዚአከ
  choice: grand Roi, puissant dans ta grandeur
  rationale: Conserve distinctement le titre royal, l’attribut de puissance et la répétition emphatique de la grandeur.
- source_word: ኵሉ፡ ፍጥረት፡ ሰማይ
  choice: toute la création du ciel
  rationale: Suit de près la séquence guèze et laisse ouverte la portée exacte de « du ciel », plutôt que de la réduire d’emblée aux seuls êtres célestes.
- source_word: ንጉሠ፡ ነገሥት
  choice: Roi des rois
  rationale: Équivalent français établi du superlatif royal sémitique.
- source_word: አምላከ፡ ኵሉ፡ ዓለም
  choice: Dieu du monde entier
  rationale: Dans ce contexte de royauté cosmique, ዓለም désigne le plus naturellement le monde dans sa totalité.
- source_word: መላኵትከ
  choice: ta souveraineté
  rationale: Le témoin est textuellement difficile. « Souveraineté » convient au contexte royal tout en évitant de faire double emploi avec « règne » et « grandeur ».
- source_word: መንግሥትከ
  choice: ton règne
  rationale: Rend ici l’exercice ou la réalité durable du pouvoir royal; « royaume » demeure possible.
- source_word: ይነብር
  choice: subsistent
  rationale: Exprime la permanence de la souveraineté, du règne et de la grandeur de façon naturelle en français.
- source_word: ስልጣንከ
  choice: ton autorité
  rationale: Traduit explicitement le nom présent dans le guèze, sans l’absorber dans la proposition précédente.
- source_word: መካይደ፡ እገሪከ
  choice: l’escabeau de tes pieds
  rationale: Préserve l’image royale concrète du trône et de l’escabeau.
- source_word: ለዓለም፡ ወለዓለመ፡ ዓለም
  choice: pour toujours et à jamais
  rationale: Équivalent français idiomatique de la formule emphatique d’éternité.
theological_decisions:
- issue: Royauté cosmique et image du trône et de l’escabeau
  choice: Maintien direct de l’imagerie royale et cosmique
  alternative: Transformer l’image en affirmation générale de la souveraineté divine
  rationale: Le verset présente concrètement les cieux comme trône et la terre comme escabeau; cette tension poétique ne doit pas être aplatie en langage abstrait.
- issue: Rapport entre souveraineté, règne, grandeur et autorité
  choice: Maintien des quatre notions distinctes
  alternative: Fusionner certains termes pour alléger la répétition
  rationale: L’accumulation appartient à la doxologie et souligne plusieurs dimensions du pouvoir divin; elle doit être conservée malgré leur proximité sémantique.
translation_notes:
  register: Français international moderne, digne et accessible, avec une cadence de prière. Les répétitions structurantes et l’imagerie apocalyptique ont été conservées; les formulations les plus obscures sont éclairées en notes sans résoudre abusivement leur ambiguïté.
