base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: fr
  text: Car c’est toi qui as fait, et c’est toi qui règnes sur tout. Aucune œuvre n’est trop difficile pour toi, et pas même une seule sagesse ne passe au-delà du trône de ta demeure[a] ni ne se détourne de devant toi. Tu connais tout, tu vois et tu entends, et rien ne t’est caché, car tu vois tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition sur « une seule sagesse » est difficile en guèze. Elle pourrait désigner une pensée sage, un dessein ou une affaire relevant de la sagesse; la traduction conserve la formulation inhabituelle du texte.
    reason: lexical_alternative
  - marker: b
    text: La dernière proposition, « car tu vois tout », répète le thème de la connaissance totale de Dieu; elle est explicitement conservée dans certains témoins.
    reason: textual_variant
lexical_decisions:
- source_word: አንተ ገበርከ
  choice: c’est toi qui as tout fait
  rationale: Le verbe signifie « faire » ou « accomplir » et n’a pas d’objet exprimé dans cette première proposition. « Tout » explicite en français la portée universelle suggérée par le contexte et par la proposition suivante, tout en évitant de réduire le verbe à un terme technique de création.
- source_word: ለኵሉ አንተ ትመልክ
  choice: c’est toi qui règnes sur tout
  rationale: Le verbe exprime l’exercice de la royauté. « Régner sur » conserve cette image royale et ለኵሉ donne explicitement la portée universelle.
- source_word: ኢይጸንዐከ ግብር
  choice: Aucune œuvre n’est trop difficile pour toi
  rationale: Avec le suffixe personnel, le verbe exprime idiomatiquement ce qui est trop difficile pour quelqu’un. « Œuvre » rend ግብር sans limiter le propos à une action humaine.
- source_word: ወአሐቲ ጥበብ
  choice: pas même une seule sagesse
  rationale: Cette formulation volontairement inhabituelle garde le substantif « sagesse » et l’indétermination du guèze plutôt que de l’interpréter d’emblée comme un dessein, une pensée ou une question.
- source_word: ኢትሐልፍ እምንባራተ ምንባሪከ
  choice: ne passe au-delà du trône de ta demeure
  rationale: La traduction préserve à la fois le mouvement de dépassement et le redoublement des images de siège royal et de demeure.
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: ni ne se détourne de devant ta face
  rationale: La tournure conserve l’image personnelle et spatiale de la face divine, au lieu de l’aplanir en simple « présence ».
- source_word: ኵሎ ታአምር ወትሬኢ ወትሰምዕ
  choice: Tu connais tout, tu vois et tu entends
  rationale: La coordination directe reproduit l’accumulation des facultés de connaissance, de vision et d’audition.
- source_word: ዘይትኀባእ እምኔከ
  choice: rien ne t’est caché
  rationale: Formulation française directe qui maintient l’idée que rien ne peut échapper à Dieu.
theological_decisions:
- issue: Souveraineté et connaissance divines
  choice: Conserver les affirmations universelles selon lesquelles Dieu règne sur tout, connaît tout et voit tout.
  alternative: Atténuer ces expressions en les traitant comme de simples hyperboles de louange.
  rationale: La répétition de termes totalisants structure le verset et soutient une affirmation forte de la souveraineté et de la connaissance divines.
- issue: Sens de la « sagesse » qui ne dépasse pas le trône
  choice: Maintenir la formulation énigmatique « une seule sagesse » et l’imagerie du trône.
  alternative: Interpréter explicitement la sagesse comme un projet, une pensée sage ou une affaire.
  rationale: Le guèze est difficile et ne permet pas de déterminer avec assurance le référent de « sagesse »; une traduction transparente préserve cette ambiguïté au lieu de la résoudre doctrinalement.
- issue: Objet non exprimé de ገበርከ
  choice: Rendre la portée contextuelle par « tu as tout fait » et signaler l’explicitation en note.
  alternative: Traduire sans objet par « c’est toi qui as fait » ou fournir un pronom dépendant du verset précédent.
  rationale: Le français exige ici un complément plus nettement qu’en guèze. La portée universelle de la proposition immédiatement suivante motive « tout », mais la note rend visible que ce complément n’est pas exprimé dans la première proposition.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions de « c’est toi » et de « tout » conservent le rythme de la prière. L’expression biblique « devant ta face » est maintenue pour préserver l’imagerie du texte, tandis que les difficultés lexicales et textuelles sont signalées en notes.
