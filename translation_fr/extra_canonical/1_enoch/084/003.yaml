revisions:
- from: Car c’est toi qui as tout fait[a], et c’est toi qui règnes sur tout. Aucune œuvre n’est trop difficile pour toi, et pas même une seule sagesse ne passe au-delà du trône de ta demeure[b] ni ne se détourne de devant ta face. Tu connais tout, tu vois et tu entends, et rien ne t’est caché, car tu vois tout[c].
  to: Car c’est toi qui as fait, et c’est toi qui règnes sur tout. Aucune œuvre n’est trop difficile pour toi, et pas même une seule sagesse ne passe au-delà du trône de ta demeure[a] ni ne se détourne de devant toi. Tu connais tout, tu vois et tu entends, et rien ne t’est caché, car tu vois tout[b].
  rationale: La révision retire l’objet « tout » ajouté au premier verbe afin de respecter la syntaxe du guèze, où l’universalité est explicitement attachée à la royauté divine dans la proposition suivante. Elle remplace également « de devant ta face » par « de devant toi », expression française plus naturelle qui maintient l’imagerie spatiale de l’original. Les autres formulations, y compris l’énigmatique « une seule sagesse », sont conservées.
