    issue: Objet ajouté à « as fait »
    rationale: Le texte guèze porte « c’est toi qui as fait », sans objet exprimé; « tout » appartient explicitement à la proposition suivante (« tu règnes sur tout »). La note ne suffit pas à justifier une explicitation évitable dans le texte.
  - severity: low
    issue: Formulation « de devant ta face »
    rationale: Elle est très calquée et peu idiomatique en français moderne. « De devant toi » conserve la relation spatiale et personnelle sans interpréter « face » comme « présence ».
