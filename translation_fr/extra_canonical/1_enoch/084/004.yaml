base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: fr
  text: Et maintenant, les anges de tes cieux ont transgressé[a], et ta colère repose sur la chair des humains[b] jusqu’au grand jour du jugement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription disponible semble ici altérée. La lecture corrigée signifie « ont péché » ou « ont transgressé », plutôt que « implorent ».
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « la chair de l’être humain ». L’expression désigne ici collectivement les humains dans leur condition mortelle.'
    reason: lexical_alternative
  - marker: c
    text: Les derniers mots sont également altérés dans la transcription disponible ; la lecture corrigée donne « jugement ».
    reason: textual_variant
lexical_decisions:
- source_word: መላእክተ፡ ሰማያቲከ
  choice: les anges de tes cieux
  rationale: « Anges » désigne ici les êtres célestes, et le pluriel « tes cieux » conserve la forme et le suffixe possessif du guèze.
- source_word: ይጌግዩ (lecture corrigée de la transcription ይጼብቡ)
  choice: ont transgressé
  rationale: La lecture corrigée exprime le péché ou la faute des anges. « Ont transgressé » convient au contexte narratif et judiciaire sans préciser davantage la nature de leur faute.
- source_word: ዲበ፡ ሥጋ፡ ሰብእ
  choice: sur la chair des humains
  rationale: Cette formulation conserve l’image concrète de la « chair » tout en rendant clairement la portée collective de « l’être humain » en français moderne.
- source_word: ትከውን፡ መዐትከ
  choice: ta colère repose
  rationale: L’indicatif décrit ici la colère divine déjà dirigée contre l’humanité. « Repose sur » rend naturellement la relation exprimée par « sur », sans transformer la phrase en souhait.
- source_word: እስከ፡ ዕለት፡ ዐባይ
  choice: jusqu’au grand jour
  rationale: La formule temporelle et apocalyptique est conservée de manière concise.
- source_word: ኵነኔ (lecture corrigée de la transcription ጽጌ)
  choice: du jugement
  rationale: La lecture corrigée désigne le jugement et donne la formule naturelle « le grand jour du jugement ».
theological_decisions:
- issue: Portée de « la chair de l’être humain »
  choice: Comprendre l’expression collectivement comme désignant l’humanité mortelle, tout en conservant l’image de la chair.
  alternative: La comprendre comme visant un individu précis ou toute chair au sens cosmique le plus large.
  rationale: Dans cette prière apocalyptique liée au jugement, le singulier guèze a naturellement une valeur collective. La traduction évite toutefois de remplacer l’image théologique de la chair par le terme abstrait « humanité ».
- issue: Valeur verbale de la colère divine
  choice: 'Rendre l’énoncé à l’indicatif : « ta colère repose ».'
  alternative: 'Le rendre comme une demande : « que ta colère soit » ou « que ta colère vienne ».'
  rationale: La lecture textuelle corrigée et le contexte présentent la faute des anges et la colère divine comme des réalités affirmées, non comme une requête adressée à Dieu.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe reste proche du guèze, mais « la chair des humains » évite que « la chair de l’homme » soit comprise comme exclusivement masculine. Les notes signalent les deux corruptions reconnues de la transcription sans laisser croire que la leçon fautive commande le sens.
