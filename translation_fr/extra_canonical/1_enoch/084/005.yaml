base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/005.yaml
  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: fr
  text: Et maintenant, ô Dieu, Seigneur et grand Roi, je te supplie et te demande d’affermir ma prière en ma faveur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Rend directement la transition temporelle et connective du guèze.
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ
  choice: ô Dieu, Seigneur et grand Roi
  rationale: Conserve les trois titres et leur coordination, avec une apostrophe française naturelle et solennelle.
- source_word: አስተበቍዕ፡ ወእስእል
  choice: je te supplie et te demande
  rationale: Préserve les deux verbes de requête plutôt que de les fondre en une seule expression.
- source_word: ታቅም፡ ሊተ፡ ስእለተየ
  choice: d’affermir ma prière en ma faveur
  rationale: Le causatif du verbe « se tenir » peut exprimer l’idée d’établir ou d’affermir. « En ma faveur » représente explicitement ሊተ, « pour moi », sans transformer d’emblée la demande en « exaucer ».
theological_decisions:
- issue: Nature de l’action demandée à Dieu sur la prière
  choice: affermir ma prière
  alternative: exaucer ma prière
  rationale: « Exaucer » serait idiomatique, mais préciserait le résultat au-delà de la formulation source, qui emploie un causatif lié à l’idée de faire tenir ou d’établir. La traduction retenue conserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. L’invocation garde sa solennité sans employer de tournures archaïques; la répétition « je te supplie et te demande » reproduit volontairement le parallélisme du texte source.
