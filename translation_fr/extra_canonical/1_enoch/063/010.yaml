base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: fr
  text: 'Maintenant, ils leur diront : « Notre âme s’est rassasiée de biens acquis par l’injustice[a], mais cela ne nous empêche pas de descendre du milieu de ces biens dans le fardeau du Shéol[b][c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze est difficile sur les plans textuel et lexical. Elle peut désigner plus largement des richesses obtenues par la faute ou l’injustice.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, on pourrait aussi traduire : « vers le poids » ou « vers la pesanteur du Shéol ». L’image évoque une descente accablante vers le séjour des morts.'
    reason: lexical_alternative
  - marker: c
    text: Le terme « Shéol » est conservé pour désigner le séjour des morts dans la pensée juive ancienne ; le traduire par « enfer » risquerait d’introduire une conception plus tardive.
    reason: cultural_note
lexical_decisions:
- source_word: ይእዜ
  choice: Maintenant
  rationale: Marque le tournant dramatique et temporel de la confession sans archaïsme.
- source_word: ይብልዎሙ
  choice: ils leur diront
  rationale: L’imparfait éthiopien convient ici au futur prophétique, et le suffixe objet pluriel -ዎሙ est rendu par « leur ».
- source_word: ትጸግብ ነፍስነ
  choice: Notre âme s’est rassasiée
  rationale: Conserve l’image d’une âme repue et l’aspect d’un état désormais atteint.
- source_word: እምጥየየ ዐመፃ
  choice: de biens acquis par l’injustice
  rationale: Expression française naturelle qui maintient à la fois le sens matériel des biens et leur caractère moralement condamnable, sans préciser indûment le mode d’acquisition.
- source_word: ወኢትከልእ
  choice: mais cela ne nous empêche pas
  rationale: Rend directement l’idée d’une incapacité à empêcher ou détourner le jugement; « cela » reprend globalement les biens évoqués sans résoudre excessivement une référence difficile.
- source_word: ወረደተነ
  choice: de descendre
  rationale: La forme verbale préserve le mouvement concret vers le monde inférieur.
- source_word: እምልባ
  choice: du milieu de ces biens
  rationale: Rend explicitement l’idée spatiale de provenance « du milieu/de l’intérieur », tout en reliant prudemment le pronom au contexte immédiat.
- source_word: ለክበደ ሲኦል
  choice: jusque sous le poids du Shéol
  rationale: « Sous le poids » est plus idiomatique en français que « dans le poids », tout en conservant l’image inhabituelle et oppressante de la lourdeur.
- source_word: ሲኦል
  choice: Shéol
  rationale: La translittération conserve la conception ancienne du séjour des morts et évite de l’assimiler automatiquement à l’enfer au sens chrétien ultérieur.
theological_decisions:
- issue: Désignation du monde inférieur
  choice: Shéol
  alternative: le séjour des morts; la tombe; l’enfer
  rationale: « Shéol » respecte le cadre apocalyptique juif du passage sans réduire le terme à la sépulture ni y importer une conception doctrinale postérieure de l’enfer.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve le mouvement de descente et l’image singulière du poids, tandis que les notes signalent les principales difficultés lexicales sans les résoudre de manière confessionnelle.
