base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: fr
  text: Et au jour de notre détresse et de notre affliction, il ne nous sauvera pas, et nous ne trouverons aucun repos pour croire[a], car notre Seigneur est fidèle dans toutes ses œuvres, dans ses jugements et dans sa justice ; et ses jugements ne font preuve d’aucun favoritisme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction guèze est difficile. On pourrait aussi comprendre : « aucun repos où placer notre confiance », « aucun répit pour espérer », ou encore : « nous ne trouverons pas de repos, et nous ne croirons pas ».'
    reason: alternative_reading
  - marker: b
    text: Littéralement, la dernière proposition dit que ses jugements ne « relèvent pas le visage », expression qui désigne l’absence de favoritisme ou de partialité.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: au jour de
  rationale: Conserve la formulation temporelle et la tonalité apocalyptique du passage.
- source_word: ስራሕነ ወምንዳቤነ
  choice: notre détresse et notre affliction
  rationale: Rend les deux termes de souffrance sans réduire le premier au seul sens de travail ou de labeur.
- source_word: ኢያድኅነነ
  choice: il ne nous sauvera pas
  rationale: Rend directement le verbe de délivrance dans son contexte de jugement.
- source_word: ኢንረክብ ዕረፍተ ንእመን
  choice: nous ne trouverons aucun repos pour croire
  rationale: Maintient dans le texte la relation syntaxique difficile entre le repos et l’acte de croire, au lieu de choisir silencieusement une interprétation plus fluide.
- source_word: መሃይምን
  choice: fidèle
  rationale: Exprime la fiabilité du Seigneur dans ses actes et ses jugements.
- source_word: ምግባሩ ወኵነኔሁ ወጽድቁ
  choice: ses œuvres, ses jugements et sa justice
  rationale: Conserve les trois éléments de l’énumération, notamment ጽድቁ, qui ne doit pas être omis.
- source_word: ወገጹ ኵነኔሁ ኢይነሥኡ
  choice: ses jugements ne font preuve d’aucun favoritisme
  rationale: Rend en français courant l’idiome judiciaire qui signifie littéralement que les jugements ne « relèvent pas le visage ».
theological_decisions:
- issue: Sens de ኢንረክብ ዕረፍተ ንእመን
  choice: nous ne trouverons aucun repos pour croire
  alternative: nous ne trouverons aucun repos où placer notre confiance ; nous ne trouverons aucun répit pour espérer ; nous ne trouverons pas de repos, et nous ne croirons pas
  rationale: Le guèze est syntaxiquement difficile et ne permet pas de trancher avec assurance. Une formulation proche de la structure source, accompagnée d’une note, préserve cette incertitude.
- issue: Portée de la formule finale sur le jugement
  choice: ses jugements ne font preuve d’aucun favoritisme
  alternative: ses jugements ne relèvent aucun visage ; ses jugements ne favorisent personne
  rationale: La traduction idiomatique communique clairement l’impartialité judiciaire, tandis que la note conserve l’image littérale du visage.
- issue: Statut de ጽድቁ dans l’énumération
  choice: sa justice comme troisième élément de la liste
  alternative: rattacher « sa justice » à la proposition finale
  rationale: 'La coordination du texte soutient une série de trois éléments : œuvres, jugements et justice. Cette lecture évite l’omission d’un terme théologiquement significatif.'
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe inhabituelle de « repos pour croire » est volontairement conservée en raison de l’incertitude du guèze et expliquée en note. Le vocabulaire judiciaire reste clair sans introduire d’interprétation confessionnelle.
