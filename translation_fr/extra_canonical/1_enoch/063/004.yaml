base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: fr
  text: Maintenant, nous savons que nous devons[a] louer et bénir le Seigneur des rois[b] et celui qui règne sur tous les rois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « louons et bénissons ». Les formes verbales guèzes peuvent avoir ici une valeur exhortative ou subjonctive.
    reason: lexical_alternative
  - marker: b
    text: Le titre traduit littéralement le guèze par « Seigneur des rois », plutôt que de le condenser dans la formule traditionnelle « Roi des rois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: Maintenant
  rationale: Cet adverbe temporel marque la prise de conscience présente des locuteurs et conserve le tournant rhétorique du verset.
- source_word: አእመርነ
  choice: nous savons
  rationale: La forme à la première personne du pluriel exprime une compréhension désormais acquise. « Nous savons » est naturel en français tout en laissant entendre cette prise de conscience.
- source_word: ከመ
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que les locuteurs reconnaissent.
- source_word: ንሰብሖ ወንባርኮ
  choice: nous devons louer et bénir
  rationale: Après ከመ, ces formes à la première personne du pluriel peuvent avoir une valeur volitive ou subjonctive. « Nous devons » exprime ce que les locuteurs reconnaissent maintenant comme juste et nécessaire, sans en faire un simple futur.
- source_word: ለእግዚኦሙ ለነገሥት
  choice: le Seigneur des rois
  rationale: Cette traduction directe conserve le titre de souveraineté attesté par le guèze, sans le remplacer par la formule traditionnelle condensée « Roi des rois ».
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: celui qui règne sur tous les rois
  rationale: La proposition relative et le verbe au présent soulignent une royauté continue et universelle sur l'ensemble des rois visés.
theological_decisions:
- issue: Rendu du titre royal sans importer une formule traditionnelle ultérieure
  choice: le Seigneur des rois, celui qui règne sur tous les rois
  alternative: le Roi des rois
  rationale: Le texte guèze nomme explicitement le « Seigneur des rois », puis précise qu'il règne sur tous les rois. La formulation retenue préserve ces deux éléments au lieu de les réduire à un titre traditionnel unique.
- issue: Valeur des formes verbales à la première personne du pluriel
  choice: nous devons louer et bénir
  alternative: louons et bénissons ; nous louerons et bénirons
  rationale: Dans ce contexte de jugement et de prise de conscience, les locuteurs reconnaissent ce qu'ils auraient dû faire ou ce qu'il convient de faire. « Nous devons » conserve cette obligation reconnue, tandis que la note signale la lecture exhortative possible.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « rois » est maintenue afin de préserver la structure en deux temps de l'acclamation et son lien explicite avec les rois terrestres.
