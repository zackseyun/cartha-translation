base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: fr
  text: 'Ils béniront et loueront le Seigneur des esprits, et ils diront : « Béni est le Seigneur des esprits, et le Seigneur des rois, et le Seigneur des puissants, et le Seigneur des riches[a], et le Seigneur de la gloire, et le Seigneur de la sagesse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut aussi désigner plus largement les possédants, les notables ou les grands personnages.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይባርክዎ፡ ወይሴብሕዎ
  choice: Ils béniront et loueront
  rationale: Les formes verbales de la séquence visionnaire se rendent naturellement au futur. « Béniront » et « loueront » conservent le parallélisme sans alourdir le français.
- source_word: እግዚአ፡ መንፈሳት / እግዚአ፡ መናፍስት
  choice: le Seigneur des esprits
  rationale: Ce titre divin caractéristique de 1 Hénoch doit rester stable. « Seigneur » convient au registre, et « des esprits » préserve la portée cosmique de l’expression.
- source_word: ቡሩክ፡ ውእቱ
  choice: Béni est
  rationale: La formule est comprise comme une déclaration d’acclamation plutôt que comme un souhait. L’ordre marqué « Béni est » garde la solennité de la proclamation.
- source_word: እግዚኦሙ፡ ለነገሥት
  choice: le Seigneur des rois
  rationale: Cette formulation conserve le rapport de souveraineté et la structure répétitive de l’original.
- source_word: ዐዚዛን
  choice: les puissants
  rationale: Dans ce contexte de jugement, le mot désigne les personnes qui détiennent de la puissance; « les puissants » est clair et conserve sa portée sociale et politique.
- source_word: ብዑላን
  choice: les riches
  rationale: Le terme peut désigner ceux qui possèdent des biens et, plus largement, des personnages importants. « Les riches » demeure la lecture contextuelle la plus transparente, tandis que l’ambiguïté est signalée en note.
- source_word: እግዚአ፡ ስብሐት
  choice: le Seigneur de la gloire
  rationale: Bien que le nom puisse aussi évoquer la louange ou la splendeur, « gloire » correspond au registre apocalyptique et maintient la série des titres abstraits.
- source_word: እግዚአ፡ ጥበብ
  choice: le Seigneur de la sagesse
  rationale: « Sagesse » rend le sens large du nom sans le réduire à la seule compréhension intellectuelle.
theological_decisions:
- issue: Traduction du titre divin récurrent እግዚአ መንፈሳት
  choice: le Seigneur des esprits
  alternative: le Maître des esprits
  rationale: « Seigneur des esprits » maintient le titre hénochien distinctif et évite d’en atténuer la portée cosmique.
- issue: Valeur de ቡሩክ ውእቱ
  choice: Béni est
  alternative: Béni soit
  rationale: La scène présente une acclamation déclarative. « Béni soit » pourrait faire entendre une prière ou un souhait que la syntaxe n’impose pas.
- issue: Maintien des conjonctions répétées
  choice: répéter « et le Seigneur »
  alternative: présenter une énumération française sans répétition de « et »
  rationale: La répétition de ወ devant chaque titre donne à l’acclamation son rythme solennel. Elle est donc conservée malgré son caractère marqué en français.
translation_notes:
  register: Français international moderne, digne et intelligible. La répétition volontaire de « et le Seigneur » reproduit le rythme solennel et polysyndétique du guèze; elle ne doit pas être lissée en simple liste.
