base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: fr
  text: Et ta puissance resplendit dans tout ce qui est caché, de génération en génération, et ta gloire demeure pour toujours et à jamais. Profondes sont toutes tes choses cachées[a], et elles sont innombrables ; ta justice[b] est incalculable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes tes choses cachées » ; on pourrait aussi traduire : « tous tes secrets » ou « tous tes mystères ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ta droiture » ; le terme peut désigner aussi bien la rectitude que la justice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይበርህ
  choice: resplendit
  rationale: Le verbe est compris comme une forme de በርሀ, « briller, resplendir », plutôt que comme une bénédiction. « Resplendit » convient au registre doxologique et évite la confusion avec ባረከ, « bénir ».
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: ta puissance resplendit dans tout ce qui est caché
  rationale: La syntaxe rattache ኃይልክ, « ta puissance », au verbe, tandis que በኵሉ ኅቡእ signifie « dans tout ce qui est caché ». Elle ne désigne donc pas nécessairement une « puissance cachée ».
- source_word: ለትውልደ ትውልድ
  choice: de génération en génération
  rationale: Formule française naturelle qui conserve l’idée de continuité à travers les générations.
- source_word: ስብሐቲከ
  choice: ta gloire
  rationale: Dans cette acclamation, le terme désigne naturellement la gloire ou la splendeur divine.
- source_word: ለዓለመ ዓለም
  choice: pour toujours et à jamais
  rationale: Rend l’insistance de la formule éthiopienne de perpétuité dans un français élevé mais courant.
- source_word: ዕሙቅ ውእቱ
  choice: Profondes sont
  rationale: Conserve l’antéposition poétique et l’idée de profondeur insondable.
- source_word: ኵሉ ኅቡኣት ዚአከ
  choice: toutes tes réalités cachées
  rationale: « Réalités cachées » rend le pluriel substantivé sans imposer les notions plus interprétatives de « secrets » ou de « mystères ».
- source_word: ኍልቈ አልቦሙ
  choice: elles sont innombrables
  rationale: Expression française directe de l’absence de nombre ou de dénombrement.
- source_word: ጽድቅ ዚአከ
  choice: ta justice
  rationale: « Justice » est ici un équivalent français naturel de ጽድቅ pour une qualité divine, sans exclure la nuance plus large de rectitude.
- source_word: ኃሳበ አልቦ
  choice: est incalculable
  rationale: Préserve l’image du calcul impossible avec une formulation française concise.
theological_decisions:
- issue: Rapport entre la puissance divine et ce qui est caché
  choice: ta puissance resplendit dans tout ce qui est caché
  alternative: ta puissance cachée resplendit
  rationale: La segmentation grammaticale la mieux étayée fait de « dans tout ce qui est caché » un complément du verbe. Cette lecture préserve aussi le paradoxe du rayonnement divin au sein du caché.
- issue: Interprétation des choses cachées
  choice: toutes tes réalités cachées
  alternative: tous tes secrets / tous tes mystères
  rationale: Le texte parle littéralement de choses cachées. La traduction retenue conserve cette indétermination sans importer une terminologie mystique plus précise.
- issue: Portée de ጽድቅ
  choice: ta justice
  alternative: ta justice parfaite / ta droiture
  rationale: « Justice » garde ouverte la portée morale et judiciaire du terme. Une note signale la nuance possible de droiture sans la résoudre dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et poétique. L’inversion « Profondes sont » conserve le relief doxologique de la source ; le reste privilégie une syntaxe claire. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
