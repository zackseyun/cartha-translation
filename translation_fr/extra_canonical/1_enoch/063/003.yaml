  naturalness: Le français est fluide, digne et adapté à une acclamation poétique. L’inversion « Profondes sont » est naturelle dans ce registre. « Toutes tes choses cachées », bien que légèrement littéral, reste clair et est préférable ici à « réalités cachées », qui sonne plus conceptuel et moins directement fidèle.
