base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: fr
  text: En ces jours-là, les puissants et les rois qui possèdent la terre ferme[a] supplieront les anges du châtiment, entre les mains desquels ils ont été livrés[b], de leur accorder un peu de répit[c], afin qu’ils puissent tomber à terre et se prosterner devant le Seigneur des Esprits, et confesser leurs péchés devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui tiennent la terre » ou « qui dominent le pays ». Le guèze emploie l’expression concrète « la terre ferme », qui évoque probablement leur domination terrestre.
    reason: lexical_alternative
  - marker: b
    text: Le membre de phrase traduit par « entre les mains desquels ils ont été livrés » est difficile dans le témoin éthiopien. Il semble indiquer que ces anges ont la garde des dirigeants condamnés.
    reason: textual_variant
  - marker: c
    text: « Un peu de répit » désigne un soulagement bref et limité, non une délivrance du jugement.
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique au pluriel dans un français biblique naturel.
- source_word: ዓዚዛን
  choice: les puissants
  rationale: Rend la force sociopolitique du terme sans préciser indûment leur rang; le mot complète « les rois ».
- source_word: ነገሥት
  choice: les rois
  rationale: Équivalent direct du titre royal.
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: qui possèdent la terre ferme
  rationale: Préserve l’image concrète de la terre sèche/ferme et le verbe de possession, tout en laissant entendre la domination territoriale.
- source_word: እመላእክት መቅሠፍት
  choice: les anges du châtiment
  rationale: Reproduit clairement la construction génitive et convient au cadre judiciaire sans privilégier l’expérience du tourment.
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: entre les mains desquels ils ont été livrés
  rationale: Exprime prudemment la garde exercée par les anges sur les dirigeants condamnés; la formulation française reste formelle tout en signalant en note la difficulté du témoin éthiopien.
- source_word: ከመ የሀቦሙ ዕረፍተ ንስቲተ
  choice: de leur accorder un peu de répit
  rationale: « Répit » exprime un soulagement temporaire, tandis que « un peu » en marque le caractère limité.
- source_word: ከመ ይደቁ ወይስግዱ
  choice: afin qu’ils puissent tomber à terre et se prosterner
  rationale: Conserve les deux verbes et la dimension physique de leur soumission, sans fondre le second dans une interprétation exclusivement cultuelle.
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des Esprits
  rationale: Maintient le titre divin caractéristique de 1 Hénoch sous une forme française digne et cohérente.
- source_word: ወይትአመኑ ኃጢአቶሙ
  choice: et confesser leurs péchés
  rationale: Dans ce contexte pénitentiel et judiciaire, « confesser » traduit l’aveu public des fautes sans affirmer que celui-ci est agréé.
theological_decisions:
- issue: La demande des dirigeants exprime-t-elle une repentance authentique ou seulement une soumission désespérée sous le jugement?
  choice: Le verset rapporte leur demande de bref répit, leur prosternation projetée et la confession de leurs péchés, sans affirmer que leur repentance est sincère ou acceptée.
  alternative: Comprendre soit une repentance véritable, soit un aveu purement contraint.
  rationale: Le texte décrit leurs paroles et leurs gestes, mais ne tranche ni leur disposition intérieure ni la réponse divine; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible, avec maintien du registre apocalyptique. La syntaxe suit le mouvement de la phrase guèze sans devenir artificielle; les ambiguïtés textuelles et théologiques sont conservées et documentées.
