base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: fr
  text: Maintenant, nous désirons un peu de repos, mais nous ne le trouvons pas ; nous sommes chassés, sans pouvoir le saisir[a]. La lumière a disparu de devant nous, et les ténèbres seront notre demeure[b] pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « sans pouvoir nous en emparer ». Le pronom renvoie probablement au repos devenu inaccessible.
    reason: lexical_alternative
  - marker: b
    text: Ou « notre habitation ». Le mot guèze est difficile ; le sens paraît être que les ténèbres deviennent leur lot permanent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: Maintenant
  rationale: Marqueur temporel qui introduit la prise de conscience présente des locuteurs.
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: nous désirons un peu de repos
  rationale: 'Suit la morphologie du guèze : ንስቲተ signifie « un peu », ዕረፍተ « repos », et ንትሜነይ est le verbe « nous désirons ». Cette analyse corrige l’ancienne lecture « nous cherchons du repos pour nous-mêmes ».'
- source_word: ወኢንረክብ
  choice: mais nous ne le trouvons pas
  rationale: Le verbe peut exprimer le fait de trouver ou d’obtenir ; le pronom reprend naturellement le repos désiré.
- source_word: ንሰደድ
  choice: nous sommes chassés
  rationale: Le passif exprime l’expulsion subie dans le contexte du jugement.
- source_word: ወኢንእኅዝ
  choice: sans pouvoir le saisir
  rationale: Conserve l’image vive de saisir ou de s’emparer de ce qui reste hors d’atteinte, sans préciser abusivement l’antécédent.
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: La lumière s’est retirée de devant nous
  rationale: « S’est retirée » rend la perte de la lumière dans un français naturel, tandis que « de devant nous » préserve l’image spatiale du texte.
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: et les ténèbres seront notre demeure
  rationale: La forme difficile ምኅባሪነ est comprise comme désignant une demeure ou habitation ; la formulation maintient l’image sans la réduire à un simple état émotionnel.
- source_word: ለዓለመ፡ ዓለም
  choice: pour toujours et à jamais
  rationale: Formule française solennelle qui rend l’expression guèze d’une durée sans fin.
theological_decisions:
- issue: Nature de la lumière perdue et des ténèbres à venir
  choice: Conserver l’imagerie apocalyptique du jugement sans la limiter à une expérience intérieure ni à une obscurité seulement physique.
  alternative: Interpréter la lumière et les ténèbres comme un désespoir purement psychologique, ou comme des phénomènes exclusivement matériels.
  rationale: Le contexte de jugement donne probablement aux images une portée morale et eschatologique ; la traduction préserve cette tension sans l’expliquer dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le rythme de la lamentation et l’opposition entre lumière et ténèbres. Tous les marqueurs de notes figurent dans le texte.
