base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: fr
  text: Après cela, leurs visages se rempliront de ténèbres et de honte devant ce Fils de l’homme[a]. Ils seront chassés de devant lui, et une épée demeurera au milieu d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de l’homme » est ici la désignation établie de la figure apocalyptique dans les Paraboles d’Hénoch; cette traduction ne présuppose pas son identification à partir d’un usage ultérieur du Nouveau Testament.
    reason: cross_reference
  - marker: b
    text: 'Le texte guèze transmis dans l’entrée fournie répète ici « devant lui », mais cette répétition est probablement une erreur de transcription ou de reconnaissance du texte. Les éditions anciennes et critiques donnent simplement : « une épée demeurera au milieu d’eux ».'
    reason: textual_variant
lexical_decisions:
- source_word: ይመልእ ገጾሙ
  choice: leur visage se remplira
  rationale: Le singulier collectif « leur visage » suit de près le guèze et conserve l’image concrète, tandis que la tournure pronominale exprime naturellement en français le résultat décrit.
- source_word: ጽልመተ ወኃፍረተ
  choice: de ténèbres et de honte
  rationale: Ces termes directs préservent l’imagerie du jugement sans préciser indûment si les ténèbres sont physiques, affectives ou symboliques.
- source_word: በቅድመ
  choice: devant
  rationale: « Devant » maintient la dimension spatiale et judiciaire de la comparution en présence du juge.
- source_word: ዝኩ ወልደ እጓለ እመሕያው
  choice: ce Fils de l’homme
  rationale: Dans les Paraboles, l’expression désigne une figure apocalyptique déjà identifiable; la majuscule signale cet emploi comme désignation sans lui ajouter une interprétation doctrinale ultérieure.
- source_word: ይሰደዱ
  choice: ils seront chassés
  rationale: Le passif exprime clairement l’expulsion judiciaire tout en restant idiomatique en français actuel.
- source_word: ወእምቅድመ ገጹ
  choice: de devant lui
  rationale: Cette formulation naturelle conserve le mouvement d’éloignement hors de sa présence; « lui » évite la lourdeur de « son visage » en français.
- source_word: ሰይፍ
  choice: une épée
  rationale: L’indéfini convient à la forme sans article et n’identifie pas arbitrairement une épée déjà connue.
- source_word: የኃድር
  choice: demeurera
  rationale: Le verbe indique une présence continue et menaçante plutôt qu’un coup instantané.
- source_word: ማእከሎሙ
  choice: au milieu d’eux
  rationale: La traduction garde la disposition spatiale et laisse ouverte la relation exacte entre l’épée et les condamnés.
theological_decisions:
- issue: L’expression « Fils de l’homme » est-elle un titre ou une désignation humaine générique?
  choice: ce Fils de l’homme
  alternative: ce fils d’homme / cet être humain
  rationale: Le contexte des Paraboles présente une figure eschatologique distincte. La formulation retenue respecte cet emploi local sans l’assimiler explicitement à une doctrine chrétienne postérieure.
- issue: La présence de l’épée décrit-elle une exécution immédiate ou un instrument durable de jugement?
  choice: une épée demeurera au milieu d’eux
  alternative: une épée les frappera
  rationale: Le verbe source exprime la permanence ou le séjour, non l’action de frapper; la traduction conserve donc la tension de cette image sans explicitation.
translation_notes:
  register: Français international moderne, sobre et digne. Les phrases ont été légèrement segmentées pour la lisibilité. L’image concrète du visage, les ténèbres, la honte et la présence durable de l’épée sont conservées sans interprétation ajoutée.
