base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/012.yaml
  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
translation:
  language: fr
  text: 'Ainsi parla le Seigneur des esprits[a] : « Voici l’ordonnance et le jugement[b] pour les puissants[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’éthiopien porte littéralement une formule du type « ainsi il dit/parla ». Le sujet est « le Seigneur des esprits ».
    reason: textual_clarity
  - marker: b
    text: Les suffixes de « l’ordonnance » et du « jugement » peuvent avoir une fonction définie, comme ici ; une traduction par « son ordonnance et son jugement » est également possible sur le plan formel.
    reason: grammatical_alternative
  - marker: c
    text: 'Ou : « contre les puissants », selon la valeur donnée à la préposition dans ce contexte de jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: Ainsi parla
  rationale: La locution introductive est rendue comme une formule déclarative complète. ይቤ signifie normalement « il dit » ou « il parla », tandis que ከመዝ apporte ici l’idée de « ainsi ».
- source_word: እግዚአ መናፈስት
  choice: le Seigneur des esprits
  rationale: Ce titre divin caractéristique de 1 Hénoch est conservé de façon transparente et cohérente, sans lui substituer une formule théologique ultérieure.
- source_word: ዝውእቱ
  choice: Voici
  rationale: Le démonstratif à valeur copulative désigne directement ce qui vient d’être annoncé. « Voici » donne en français une déclaration naturelle et solennelle.
- source_word: ሥርዓቱ
  choice: l’ordonnance
  rationale: Le terme désigne un ordre établi, une prescription ou une ordonnance. « Ordonnance » maintient sa portée formelle et juridique dans ce contexte apocalyptique.
- source_word: ወኵነኔሁ
  choice: et le jugement
  rationale: Le second terme est juridique. « Jugement » en préserve l’étendue sans le réduire à la seule sentence ni expliciter une condamnation que le mot lui-même ne rend pas nécessaire.
- source_word: ለዐዚዛን
  choice: pour les puissants
  rationale: Le substantif désigne ceux qui détiennent la puissance. La préposition ለ est rendue littéralement par « pour », tout en signalant que le contexte permet aussi « contre ».
theological_decisions:
- issue: Rendu du titre divin propre au cadre apocalyptique hénochique
  choice: le Seigneur des esprits
  alternative: le Seigneur des Esprits
  rationale: La minuscule à « esprits » traite le complément comme un nom commun, tandis que le titre lui-même reste reconnaissable. Cette formulation préserve le langage propre à 1 Hénoch sans importer une terminologie confessionnelle.
- issue: Orientation du jugement envers les puissants
  choice: pour les puissants
  alternative: contre les puissants
  rationale: La préposition éthiopienne peut marquer le destinataire ou la direction. Le texte principal conserve la formulation la moins interprétative, et la note indique la valeur adversative que favorise le contexte judiciaire.
translation_notes:
  register: Français international moderne, sobre et solennel. La formule « Ainsi parla » garde la tonalité déclarative du texte sans archaïsme excessif. « Voici » évite une construction française pesante tout en conservant la force démonstrative de l’éthiopien.
