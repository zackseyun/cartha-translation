base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: fr
  text: Et nous nous retirons de devant sa face[a] à cause de nos actes, et tous nos péchés sont comptés selon la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa présence ». Le guèze dit littéralement « de devant sa face », image concrète de la comparution devant le juge divin.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « tous nos péchés sont pris en compte avec justice ». La tournure guèze est judiciaire, mais sa nuance exacte demeure incertaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: Et nous partons
  rationale: Le verbe exprime le fait de passer, de s’en aller ou de disparaître. « Nous partons » reste naturel en français et, avec le complément spatial, évite de préciser indûment qu’il s’agit de la mort ou d’une destruction physique.
- source_word: እምገጹ
  choice: de devant sa face
  rationale: L’expression signifie littéralement « de devant sa face ». Cette formulation conserve l’image concrète de la comparution devant le juge divin, tout en demeurant intelligible en français.
- source_word: በእንተ ምግባሪነ
  choice: à cause de nos actes
  rationale: La préposition marque ici la cause. « Actes » rend naturellement le terme désignant les actions ou les œuvres, sans lui donner une coloration confessionnelle particulière.
- source_word: ወኵሉ ኃጢአትነ
  choice: et tous nos péchés
  rationale: Cette traduction directe conserve la portée totale de « tous ».
- source_word: በጽድቅ
  choice: selon la justice
  rationale: Le nom désigne la justice ou la droiture. « Selon la justice » préserve l’idée d’une norme juste sans réduire la construction à un simple adverbe.
- source_word: ትኈለቍ
  choice: sont comptés
  rationale: Le verbe relève du champ du compte et de la prise en considération. « Sont comptés » maintient l’image judiciaire et comptable sans introduire celle, moins certaine, d’une pesée.
theological_decisions:
- issue: Conservation de l’expression anthropomorphique désignant la présence divine
  choice: de devant sa face
  alternative: loin de sa présence
  rationale: La formulation concrète du guèze intensifie la scène de jugement. La conserver évite d’aplanir l’imagerie apocalyptique, tandis qu’une note fournit l’équivalent idiomatique.
- issue: Sens exact du compte des péchés « dans/selon la justice »
  choice: tous nos péchés sont comptés selon la justice
  alternative: tous nos péchés sont pris en compte avec justice
  rationale: Le texte a une tonalité judiciaire, mais ne précise pas entièrement si la justice est la norme du compte ou la manière juste de l’effectuer. La traduction retient le sens de norme tout en signalant l’autre possibilité.
translation_notes:
  register: Français international moderne, solennel et accessible. La structure parallèle et l’image de la face sont conservées; les formulations susceptibles de trancher entre départ, mort et destruction ont été évitées.
