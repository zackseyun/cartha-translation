base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: fr
  text: Car, devant lui, nous n’avons pas cru et nous n’avons pas loué le nom du Seigneur des Esprits, [et nous n’avons pas loué notre Seigneur][a] ; notre espérance était dans le sceptre de notre royaume[b] et dans notre gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition entre crochets est incertaine dans le témoin fourni et pourrait être une variante ou un ajout secondaire.
    reason: textual_variant
  - marker: b
    text: Le mot traduit par « sceptre » peut aussi désigner un « bâton » ou une « verge » ; le sens royal convient ici au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit la raison de la lamentation et conserve la valeur explicative de la conjonction.
- source_word: በቅድሜሁ
  choice: devant lui
  rationale: Expression relationnelle et spatiale naturelle en français, appropriée à la scène de jugement.
- source_word: ኢአመነ (lecture critique sous-jacente à la transcription fautive አአመነ)
  choice: nous n’avons pas cru
  rationale: La négation rétablie par la lecture critique correspond au contexte de la confession des rois condamnés.
- source_word: ወኢሰባሕነ ለስሙ (lecture critique sous-jacente)
  choice: et nous n’avons pas loué le nom
  rationale: Rend directement le verbe de louange et maintient comme objet explicite « le nom ».
- source_word: እግዚአ መናፈስት
  choice: le Seigneur des esprits
  rationale: Conserve le titre apocalyptique caractéristique de 1 Hénoch dans une formulation française naturelle.
- source_word: ወኢሰባሕናሁ ለእግዚእነ (clause critique correspondant à la clause transcrite entre crochets)
  choice: '[et nous n’avons pas loué notre Seigneur]'
  rationale: La clause est maintenue entre crochets afin de signaler son incertitude textuelle, tout en rendant la négation exigée par la lecture critique.
- source_word: ወተስፋነ ኮነ ዲበ
  choice: nous mettions notre espérance dans
  rationale: L’imparfait exprime naturellement l’état durable de confiance antérieur au jugement.
- source_word: በትረ መንግሥትነ
  choice: le sceptre de notre royaume
  rationale: « Sceptre » conserve l’image concrète du pouvoir royal ; « bâton » ou « verge » restent lexicalement possibles.
- source_word: ስብሐቲነ
  choice: notre gloire
  rationale: Conserve l’idée de prestige et d’exaltation propres aux souverains dans ce contexte.
theological_decisions:
- issue: La négation des verbes de foi et de louange
  choice: nous n’avons pas cru… nous n’avons pas loué
  alternative: nous avons cru… nous avons loué
  rationale: Bien que la transcription fournie ait perdu le préfixe négatif à cause d’une erreur de lecture, la lecture critique et le contexte de la confession exigent la négation. Il ne s’agit donc pas d’interpréter une foi prétendument ironique, mais de restituer le texte.
- issue: L’objet de l’espérance des rois
  choice: le sceptre de notre royaume et notre gloire
  alternative: le bâton de notre domination et notre splendeur
  rationale: La formulation retenue préserve l’image royale concrète et le contraste théologique entre la confiance dans le pouvoir terrestre et le jugement divin, sans l’abstraire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase guèze, tandis que l’imparfait « mettions » rend naturellement la confiance durable des locuteurs. Les crochets et les appels de notes figurent explicitement dans le texte.
