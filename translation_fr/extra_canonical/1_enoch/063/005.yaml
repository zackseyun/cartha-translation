base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: fr
  text: 'Et ils dirent : « Qui nous a donné du repos[a], pour que nous le louions, lui rendions grâce et croyions[b] devant ta gloire ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du répit ». Le nom peut désigner le repos ou un temps de soulagement ; dans ce contexte, les condamnés déplorent de n’avoir aucun répit sous le jugement.
    reason: lexical_alternative
  - marker: b
    text: Le verbe signifie le plus directement « croire » ; dans cette section difficile, transmise uniquement en guèze, « reconnaître » a aussi été proposé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤሉ
  choice: Et ils dirent
  rationale: Rend directement la forme narrative au pluriel et maintient le lien avec le contexte.
- source_word: መኑ
  choice: Qui
  rationale: Pronom interrogatif naturel en français, introduisant ici une question qui prend la force d’une plainte.
- source_word: ወሀበነ
  choice: nous a donné
  rationale: Le verbe signifie « donner »; le passé composé convient à la question portant sur un don supposément accordé.
- source_word: ዕረፍተ
  choice: du repos
  rationale: Le nom peut désigner le repos ou un répit. « Repos » conserve l’image forte, tandis que l’autre possibilité est signalée en note.
- source_word: ከመ
  choice: pour que
  rationale: Exprime naturellement en français la valeur de but ou de conséquence du terme guèze.
- source_word: ንሰብሖ
  choice: nous le louions
  rationale: Le verbe exprime la louange et porte ici un suffixe objet masculin singulier, rendu par « le ».
- source_word: ወናአኵቶ
  choice: lui rendions grâce
  rationale: Le verbe signifie remercier ou rendre grâce et porte également un suffixe objet masculin singulier; cette tournure est naturelle et digne en français.
- source_word: ወንእመን
  choice: et ayons foi
  rationale: La forme simple du verbe renvoie ici le plus directement à l’acte de croire. « Avoir foi » permet un emploi absolu naturel sans ajouter un complément absent du texte.
- source_word: ቅድመ
  choice: devant
  rationale: Conserve le sens spatial et solennel de présence, approprié à la scène de jugement.
- source_word: ስብሐቲከ
  choice: ta gloire
  rationale: « Gloire » rend le champ sémantique de splendeur et de majesté divine sans réduire l’image apocalyptique.
theological_decisions:
- issue: Portée de la question prononcée sous le jugement
  choice: 'Conserver la forme interrogative comme une plainte rhétorique : les locuteurs ne trouvent aucun repos leur permettant de louer, de rendre grâce et de croire devant la gloire divine.'
  alternative: Comprendre la phrase comme une simple demande d’information sur celui qui leur aurait accordé du loisir pour adorer.
  rationale: Le contexte des puissants condamnés donne à la question une force désespérée, mais la traduction n’explicite pas cette interprétation dans le corps du verset.
- issue: Sens de ወንእመን
  choice: ayons foi
  alternative: reconnaissions ou confessions
  rationale: La forme verbale simple soutient le sens « croire », notamment par contraste avec la forme dérivée employée ailleurs pour « confesser ». Une note conserve toutefois l’incertitude propre à cette section transmise uniquement en guèze.
translation_notes:
  register: Français international moderne, courant mais solennel. La triple séquence verbale est conservée. Les pronoms « le » et « lui » rendent les suffixes objets masculins présents sur les deux premiers verbes, sans fournir artificiellement un objet au troisième.
