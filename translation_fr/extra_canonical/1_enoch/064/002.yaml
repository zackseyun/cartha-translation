base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: fr
  text: 'Et j’entendis la voix de l’ange qui disait : « Ce sont les anges qui sont descendus sur la terre, qui ont révélé aux humains[a] ce qui était caché[b] et qui ont égaré les humains, de sorte que ceux-ci ont commis le péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux enfants des hommes », expression hénochique désignant l’humanité.'
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « les choses cachées ». Le texte parle du dévoilement de ce qui était dissimulé, sans préciser ici de quels secrets il s’agit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማዕኩ
  choice: j’entendis
  rationale: Le parfait à la première personne introduit simplement la perception auditive d’Hénoch dans le récit visionnaire.
- source_word: ቃሎ ለመልአክ
  choice: la voix de l’ange
  rationale: Avec le verbe « entendre », « voix » rend naturellement ቃል dans cette scène, tout en identifiant l’ange comme locuteur.
- source_word: እንዘ ይብል
  choice: qui disait
  rationale: Cette tournure introduit le discours direct; la relative est fluide et digne en français moderne.
- source_word: እሉ ውእቶሙ
  choice: Ce sont
  rationale: Rend directement la formule démonstrative d’identification.
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: les anges qui sont descendus sur la terre
  rationale: Conserve l’image apocalyptique de la descente et rend précisément ዲበ par « sur ».
- source_word: ወዘበኅቡእ ከሠቱ
  choice: qui ont révélé ... ce qui était caché
  rationale: Préserve le contraste entre ce qui était dissimulé et son dévoilement, sans préciser indûment la nature du contenu.
- source_word: ለውሉደ ሰብእ
  choice: aux humains
  rationale: Rend clairement la référence collective à l’humanité en français actuel; une note conserve l’expression sémitique littérale.
- source_word: ወአስሐትዎሙ
  choice: qui les ont égarés
  rationale: Exprime l’action de faire dévier ou tomber dans l’erreur, avec sa portée morale dans le contexte.
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: de sorte qu’ils ont commis le péché
  rationale: « De sorte que » maintient la nuance possible de résultat sans exclure entièrement une visée; « commettre le péché » rend idiomatiquement l’acte moral au singulier.
theological_decisions:
- issue: Identité des anges coupables
  choice: les anges qui sont descendus sur la terre
  alternative: les Veilleurs; les anges déchus
  rationale: Le guèze dit ici simplement « anges ». Le titre « Veilleurs » et la qualification « déchus », bien que liés au contexte hénochique, ne sont pas introduits dans ce verset.
- issue: Nature du contenu révélé
  choice: ce qui était caché
  alternative: les choses cachées; des connaissances secrètes; les mystères
  rationale: Le texte ne précise pas ici la teneur de ce qui a été dévoilé. La traduction conserve cette indétermination.
- issue: Rapport exprimé par ከመ
  choice: de sorte qu’ils ont commis le péché
  alternative: afin qu’ils commettent le péché
  rationale: La construction peut porter une nuance de but ou de résultat. Le contexte décrit l’aboutissement de l’égarement; la formulation retenue évite toutefois de développer une doctrine de l’intention angélique au-delà du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif est conservé sans archaïsmes; les répétitions guèzes de « enfants des hommes » sont allégées dans le corps du texte, tandis que leur forme littérale est signalée en note.
