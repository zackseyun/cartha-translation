base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/001.yaml
  text: And I saw other hidden faces in that place[a].
translation:
  language: fr
  text: Et je vis en ce lieu d’autres visages cachés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « figures » ; le mot guèze signifie littéralement « visages » et peut évoquer des personnes apparaissant dans la vision.
    reason: Signaler la portée possible du terme sans remplacer par une interprétation l’image concrète du texte source.
lexical_decisions:
- source_word: ካልአ
  choice: d’autres
  rationale: L’adjectif signale des entités supplémentaires par rapport à celles déjà vues et s’accorde naturellement avec le pluriel « visages ».
- source_word: ገጻተ
  choice: visages
  rationale: Le sens concret de base est « visages ». Ce choix conserve l’image saisissante de la vision sans interpréter prématurément le terme comme désignant des personnes ou des êtres.
- source_word: ርኢኩ
  choice: je vis
  rationale: Cette forme exprime simplement la perception du narrateur dans le récit visionnaire. Le passé simple convient au registre narratif français, sans archaïsme excessif.
- source_word: በውእቱ መካን
  choice: en ce lieu
  rationale: L’expression renvoie au lieu de la vision déjà évoqué. « En ce lieu » est naturel, concis et digne.
- source_word: ኅቡኣተ
  choice: cachés
  rationale: L’adjectif évoque ce qui est dissimulé ou tenu hors de vue. « Cachés » préserve la tonalité mystérieuse du passage sans ajouter d’explication.
theological_decisions:
- issue: Faut-il rendre ገጻተ concrètement par « visages » ou l’interpréter comme « personnes » ou « êtres » ?
  choice: visages
  alternative: personnes ou êtres
  rationale: Dans ce bref énoncé visionnaire, rien n’impose d’abandonner l’image concrète du texte. Une traduction interprétative atténuerait l’étrangeté propre à la vision et résoudrait une ambiguïté que la source laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple maintient le registre narratif littéraire courant des textes anciens. La formulation conserve volontairement l’étrangeté de l’expression « visages cachés ».
