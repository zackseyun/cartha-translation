base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: fr
  text: Les pécheurs pousseront des cris et les verront, tandis que ceux-ci resplendiront[a] ; eux-mêmes iront vers le lieu où les jours et les temps ont été consignés pour eux[b]. Vision des choses cachées d’Hénoch.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme éthiopien est difficile ; il est rendu ici par « resplendiront ». On peut aussi le comprendre comme « erreront », « seront agités » ou « seront dans le tumulte ».
    reason: lexical_alternative
  - marker: b
    text: L’expression évoque le motif apocalyptique de jours et de temps fixés et inscrits à l’avance, notamment en vue du jugement.
    reason: cultural_note
  - marker: c
    text: Cette dernière formule paraît être une rubrique ou un colophon autonome, plutôt qu’un complément de la phrase précédente.
    reason: textual_note
lexical_decisions:
- source_word: ወይጸርኁ
  choice: Alors les pécheurs pousseront des cris
  rationale: Le verbe exprime un cri puissant pouvant aussi être une lamentation. « Pousseront des cris » conserve sa force sans préciser indûment la nature de ces cris.
- source_word: ወይሬእይዎሙ
  choice: et les verront
  rationale: Rend directement le verbe « voir » et son suffixe objet pluriel.
- source_word: እንዘ ይትወሐውሑ
  choice: tandis qu’ils resplendiront
  rationale: Dans le contexte immédiat, le sujet naturel est le groupe vu par les pécheurs. La tradition de traduction comprend ici une manifestation lumineuse, mais la forme éthiopienne est difficile ; l’incertitude est signalée en note.
- source_word: ወየሐውሩ እሙንቱሂ በኀበ
  choice: eux-mêmes iront vers le lieu où
  rationale: « Eux-mêmes » garde l’emphase du pronom avec particule ; « vers le lieu où » exprime naturellement en français la direction marquée par በኀበ.
- source_word: ተጽሕፉ ሎሙ መዋዕለ ወእዝማን
  choice: les jours et les temps ont été consignés pour eux
  rationale: Le passif et le datif évoquent des périodes inscrites à l’avance. « Consignés » préserve l’image apocalyptique d’un registre céleste.
- source_word: ራእየ ኅቡኣት ዘሄኖክ
  choice: Vision des réalités cachées d’Hénoch
  rationale: La construction est un groupe nominal autonome, sans préposition signifiant « dans » ni verbe relatif « vit ». « Réalités cachées » rend le contenu mystérieux de la vision dans un registre digne et naturel.
theological_decisions:
- issue: Statut de la formule finale
  choice: 'La présenter comme une rubrique ou colophon autonome : « Vision des réalités cachées d’Hénoch. »'
  alternative: L’intégrer à la proposition précédente, comme si les pécheurs allaient quelque part « dans la vision » ou comme « la vision qu’Hénoch vit ».
  rationale: Le guèze donne un groupe nominal sans préposition « dans » et sans verbe « voir ». La lecture autonome respecte donc mieux la syntaxe, tout en signalant en note sa possible fonction éditoriale.
- issue: Sens des jours et des temps écrits pour les pécheurs
  choice: Conserver l’image d’une inscription préalable sans expliciter qu’il s’agit nécessairement des temps du jugement.
  alternative: Traduire « les jours et les temps de leur jugement fixés d’avance ».
  rationale: Le motif apocalyptique suggère des temps arrêtés et consignés, mais le texte ne nomme pas ici explicitement le jugement ; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, courant mais digne. Le futur et les images apocalyptiques sont conservés. La ponctuation distingue nettement la formule finale, conformément à sa syntaxe nominale.
