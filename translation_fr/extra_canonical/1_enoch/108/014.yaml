  yaml_path: translation/extra_canonical/1_enoch/108/014.yaml
  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: fr
  text: Et maintenant, ils verront ceux qui sont nés dans les ténèbres être jetés dans les ténèbres[a], tandis que les justes resplendissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront jetés dans les ténèbres ».'
    reason: La construction peut se rendre soit comme ce qu’ils verront arriver, soit comme un futur passif coordonné dans la scène.
  - marker: b
    text: 'Ou : « deviennent lumineux » ou « sont rendus lumineux ».'
    reason: Le verbe peut exprimer le fait de briller ou de devenir lumineux; le contexte futur gouverne la proposition introduite par « tandis que ».
lexical_decisions:
- source_word: ወይሬ
  choice: Et maintenant
  rationale: ወ (« et ») suivi de ይሬ (« maintenant ») introduit la scène présente dans la progression du discours. Cette lecture évite de confondre l’expression avec un verbe signifiant « je vis ».
- source_word: እይዎሙ ለእለ ተወልዱ በጽልመት
  choice: ils verront ceux qui sont nés dans les ténèbres
  rationale: Le verbe à l’imperfectif reçoit ici une valeur future. La relative désigne un groupe caractérisé par sa naissance « dans les ténèbres ».
- source_word: ይትወደዩ በጽልመት
  choice: être jetés dans les ténèbres
  rationale: 'ይትወደዩ est compris comme le passif de ወደየ, « mettre, jeter », et non comme un verbe d’amour. Avec ce mouvement, በ exprime naturellement la direction ou l’entrée dans un état : « dans les ténèbres ».'
- source_word: እንዘ ይትወሐውሑ
  choice: tandis que … resplendissent
  rationale: እንዘ introduit une proposition circonstancielle simultanée. L’imperfectif décrit l’éclat des justes dans le cadre futur établi par le verbe principal; le présent français peut avoir cette valeur concomitante.
- source_word: ጻድቃን
  choice: les justes
  rationale: « Les justes » est une désignation française naturelle et traditionnelle des personnes déclarées ou reconnues justes, sans ajouter de précision doctrinale.
theological_decisions:
- issue: Valeur morale et destin de ceux qui sont « nés dans les ténèbres »
  choice: Le texte dit qu’ils sont jetés dans les ténèbres.
  alternative: « aimés dans les ténèbres »
  rationale: La forme guèze relève du verbe ወደየ, « mettre, jeter », et non d’un verbe signifiant « aimer ». La traduction conserve ainsi l’image de jugement portée par le texte sans lui ajouter de cause ou de mécanisme théologique.
- issue: Nature de l’éclat des justes
  choice: « resplendissent »
  alternative: « sont rendus lumineux » ou « deviennent lumineux »
  rationale: La forme verbale peut évoquer l’entrée dans un état lumineux ou sa manifestation. Le rendu principal privilégie une expression française vive sans préciser si cet éclat est intrinsèque ou conféré.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « dans les ténèbres » est conservée pour reproduire le contraste rhétorique du guèze. L’infinitif « être jetés » explicite naturellement en français le complément perceptif de « verront ».
