base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: fr
  text: 'Et j’interrogeai les deux anges saints qui étaient avec moi, et je lui dis[a] : « Qu’est-ce que cette chose glorieuse[b] ? Car ce n’est pas le ciel, mais seulement une flamme de feu ardente[c], avec le son des pleurs, des cris, des lamentations et une douleur accablante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze porte « je lui dis » au singulier, bien que la phrase précédente mentionne « les deux anges saints ». Hénoch s’adresse peut-être à l’un d’eux comme porte-parole, mais il peut aussi s’agir d’une irrégularité du texte.
    reason: textual_variant
  - marker: b
    text: 'On pourrait aussi traduire : « ce lieu glorieux » ou « cette splendeur ». Le référent n’étant pas encore expressément identifié dans ce verset, la traduction garde une formulation large.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une flamme de feu qui brûle ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ተስእልክዎ
  choice: j’interrogeai
  rationale: Le verbe introduit la question adressée aux guides angéliques. « Interroger » est naturel en français narratif et marque clairement la demande d’explication.
- source_word: ፪አመላእክት ቅዱሳን
  choice: les deux anges saints
  rationale: Le nombre deux est explicite, et « saints » conserve le qualificatif apocalyptique sans l’affaiblir.
- source_word: እለ ምስሌየ
  choice: qui étaient avec moi
  rationale: Cette formulation simple et idiomatique présente les anges comme les accompagnateurs d’Hénoch.
- source_word: እቤሎ
  choice: je lui dis
  rationale: La forme guèze est au singulier malgré la mention précédente de deux anges; le texte principal conserve cette discordance significative.
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: Qu’est-ce que cette chose glorieuse ?
  rationale: « Chose » garde le référent indéterminé, tandis que « glorieuse » préserve le champ sémantique de la gloire et de la splendeur.
- source_word: አኮኑ ሰማየ
  choice: ce n’est pas le ciel
  rationale: Le singulier « le ciel » exprime naturellement en français le contraste entre la vision et le ciel proprement dit.
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  choice: seulement une flamme de feu ardente
  rationale: La formulation conserve l’image cumulative de la flamme de feu et la notion explicite de combustion, tout en restant fluide en français.
- source_word: ቃለ ብካይ
  choice: le bruit des pleurs
  rationale: Dans cette accumulation de phénomènes audibles, « bruit » rend naturellement l’idée de voix ou de son.
- source_word: ጽራሕ
  choice: des cris
  rationale: « Cris » conserve la force de l’appel poussé à haute voix sans préciser indûment qu’il s’agit de hurlements.
- source_word: አውያት
  choice: des lamentations
  rationale: Ce terme soutenu convient au registre solennel et distingue cet élément des pleurs et des cris.
- source_word: ሕማም ኀያል
  choice: une douleur accablante
  rationale: Cette expression rend l’intensité extrême de la souffrance dans un français actuel et digne.
theological_decisions:
- issue: Faut-il résumer la scène par une notion générale de tourment ou de châtiment ?
  choice: Conserver les images concrètes du feu, des pleurs, des cris, des lamentations et de la douleur
  alternative: Employer une formulation générale telle que « un lieu de tourment » ou « un châtiment terrible »
  rationale: Le texte donne une accumulation sensorielle sans nommer ni systématiser ici la nature du lieu. La traduction préserve donc l’imagerie apocalyptique et la tension du passage.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le registre narratif littéraire; le discours direct demeure clair. Les répétitions sensorielles propres au style apocalyptique sont conservées plutôt que résumées.
