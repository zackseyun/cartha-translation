revisions:
- from: J’ai parlé dans les livres de toutes les bénédictions qui leur sont destinées, et je les ai consignées pour leurs chefs[a], car on a constaté que ceux-ci aiment le ciel plus que leur vie en ce monde[b]. Et tandis qu’ils sont opprimés par des gens mauvais, ils entendent de leur part injures et outrages et subissent la honte, tout en me bénissant[c].
  to: J’ai parlé dans les livres de toutes leurs bénédictions, et je les ai établis comme leurs chefs[a], car ceux-ci se sont révélés aimer le ciel plus que leur vie en ce monde[b]. Et tandis qu’ils sont opprimés par des méchants, ils entendent de leur part injures et outrages et subissent l’humiliation, tout en me bénissant[c].
  rationale: La révision corrige principalement la proposition difficile après « dans les livres ». Elle évite de présenter les « bénédictions » comme l’objet grammatical certain d’un verbe dont le suffixe est masculin pluriel et dont la relation avec « têtes » est incertaine. La note expose cette difficulté. Le reste conserve les choix source-fidèles du projet, notamment la honte subie et le surprenant « me » final.
