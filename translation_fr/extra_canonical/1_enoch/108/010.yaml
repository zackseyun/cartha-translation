  naturalness: Le français est fluide dans l’ensemble. « Établis comme leurs chefs » est plus naturel et intelligible que « consignées pour leurs chefs ». « Des méchants » est plus idiomatique et tout aussi inclusif que « des gens mauvais » dans ce registre.
  terminology: « Bénédictions », « ciel », « injures et outrages », et « me bénissant » conservent le registre et les termes importants. Le pronom de première personne final doit rester tel quel, avec une note signalant la difficulté textuelle sans la résoudre.
