base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: fr
  text: J’ai parlé dans les livres de toutes leurs bénédictions, et je les ai établis comme leurs chefs[a], car ceux-ci se sont révélés aimer le ciel plus que leur vie en ce monde[b]. Et tandis qu’ils sont opprimés par des méchants, ils entendent de leur part injures et outrages et subissent l’humiliation, tout en me bénissant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « je les ai faits/établis pour leurs têtes ». « Têtes » peut désigner des chefs ou des dirigeants; la construction entière est difficile et le référent de « les » n’est pas entièrement certain.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « plus que leur souffle dans le monde »; ici, le « souffle » désigne la vie.
    reason: lexical_alternative
  - marker: c
    text: Le texte porte bien « tout en me bénissant ». Cette première personne est conservée, bien que la formulation soit inhabituelle et que certains soupçonnent un texte difficile ou altéré.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ፡ በረከቶሙ
  choice: toutes les bénédictions qui leur sont destinées
  rationale: Le pluriel በረከቶሙ désigne leurs bénédictions. La formulation française explicite sobrement qu’elles leur reviennent, sans réduire le terme à l’abstrait « bonheur ».
- source_word: ነገርኩ፡ በመጻሕፍት
  choice: J’ai parlé dans les livres
  rationale: Conserve la première personne et le pluriel « livres », ainsi que l’autoréférence littéraire du passage.
- source_word: ዐሰዮሙ፡ ለአርእስቲሆሙ
  choice: je les ai consignées pour leurs chefs
  rationale: La phrase est difficile. Le verbe peut évoquer le fait de placer, disposer ou consigner, tandis que አርእስት signifie littéralement « têtes » et peut désigner des chefs. Le féminin pluriel « les » reprend naturellement les bénédictions en français.
- source_word: ተረክቡ
  choice: on a constaté
  rationale: Rend le passif « ont été trouvés/reconnus » par une tournure française naturelle, sans transformer le constat en jugement divin explicite.
- source_word: ያፈቅርዎ፡ ለሰማይ
  choice: aiment le ciel
  rationale: Conserve l’objet concret « le ciel » et l’orientation apocalyptique du texte.
- source_word: እምእስትንፋሶሙ፡ ዘበዓለም
  choice: plus que leur vie en ce monde
  rationale: እስትንፋስ signifie littéralement « souffle », mais désigne ici la vie. « En ce monde » restitue le contraste avec le ciel.
- source_word: ይትከየዱ
  choice: sont opprimés
  rationale: Exprime clairement le traitement subi par les justes. Une traduction imagée telle que « foulés aux pieds » demeure possible, mais paraît moins certaine et moins naturelle ici.
- source_word: እምእኩያን፡ ሰብእ
  choice: par des gens mauvais
  rationale: Restitue la qualification morale sans employer le masculin générique marqué « hommes ».
- source_word: ትዕይርተ፡ ወጽርፈተ
  choice: injures et outrages
  rationale: Préserve le doublet de paroles hostiles avec un registre digne et actuel, sans introduire la notion cultuelle plus précise de blasphème.
- source_word: ኀሥሡ
  choice: subissent la honte
  rationale: Suit l’identification contextuelle du verbe comme une forme liée à ኀስረ, « être couvert de honte, être déshonoré », plutôt que l’ancienne analyse « endurer ».
- source_word: እንዘ፡ ይባርኩኒ
  choice: tout en me bénissant
  rationale: Conserve sans correction silencieuse l’objet de première personne, malgré son caractère inattendu dans le contexte.
theological_decisions:
- issue: Référent du pronom de première personne dans « tout en me bénissant »
  choice: Conserver « me », dont le référent grammatical immédiat est le locuteur du récit.
  alternative: Comprendre que la bénédiction s’adresse à Dieu, ou supposer une lecture textuelle altérée.
  rationale: Le texte guèze porte un objet de première personne. Le remplacer par « Dieu » résoudrait une tension théologique et textuelle que la traduction doit plutôt rendre visible.
- issue: Identité de ceux qui aiment le ciel
  choice: Rendre le démonstratif par « ceux-ci », renvoyant aux bénéficiaires des bénédictions.
  alternative: Identifier plus explicitement le groupe comme « les justes ».
  rationale: Le verset ne donne pas ici ce substantif; l’ajouter rendrait le sens plus explicite que la formulation source.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la longue progression du verset tout en la divisant en deux phrases. Les difficultés du guèze sont signalées sans imposer une solution confessionnelle.
