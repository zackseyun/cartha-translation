base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: fr
  text: 'Là, je vis comme un nuage invisible[a] : à cause de sa profondeur, je ne pouvais pas porter mon regard sur lui. Je vis aussi une flamme de feu qui brûlait avec splendeur, et des choses semblables à des montagnes resplendissantes tournaient et allaient çà et là[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte présente une image paradoxale : le voyant aperçoit quelque chose de comparable à un nuage, tout en le qualifiant d’« invisible ». La suite de la phrase est textuellement difficile et pourrait aussi évoquer un regard porté vers le haut, au-delà de son étendue ou de sa forme visible.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « étaient secouées d’un côté et de l’autre ». Le guèze décrit un mouvement répété dans des directions alternées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: Là, je vis
  rationale: Rend directement le récit visionnaire à la première personne et l’adverbe de lieu, dans un français digne et naturel.
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: comme un nuage invisible
  rationale: ከመ exprime la comparaison, tandis que la proposition relative signifie littéralement « qui n’est pas vu ». La formulation conserve le paradoxe visionnaire sans affirmer qu’il s’agit réellement d’un nuage.
- source_word: እምዕሙቁ
  choice: à cause de sa profondeur
  rationale: Le terme renvoie à la profondeur ou à un lieu profond; le possessif est fourni par le contexte.
- source_word: አክሀልኩ ላዕለ ነጽሮ
  choice: je ne pouvais pas porter mon regard sur lui
  rationale: Le passage est textuellement difficile. Cette formulation suit la lecture négative attestée par la couche anglaise tout en évitant de préciser excessivement le rapport spatial incertain.
- source_word: ላህበ እሳት
  choice: une flamme de feu
  rationale: Conserve l’expression sémitique emphatique plutôt que de la réduire au simple mot « feu ».
- source_word: እንዘ ይነድድ ስቡሕ
  choice: qui brûlait avec splendeur
  rationale: Rend l’aspect progressif et le champ sémantique de la gloire, de l’éclat et de la magnificence sans imposer la seule idée de luminosité.
- source_word: ከመ አድባር ስቡሓን
  choice: des choses semblables à des montagnes resplendissantes
  rationale: Le comparatif est préservé et un référent indéfini est fourni pour recevoir naturellement les verbes pluriels en français.
- source_word: ይትከበቡ … ወይትሀወኩ ለፌ ወለፌ
  choice: tournaient et allaient çà et là
  rationale: Les deux verbes sont traités comme pluriels. « Tournaient » exprime le mouvement circulaire, et « allaient çà et là » le mouvement répété dans des directions alternées.
theological_decisions:
- issue: Le paradoxe d’un objet vu qui est décrit comme invisible
  choice: comme un nuage invisible
  alternative: comme un nuage qu’on ne pouvait voir
  rationale: L’image apocalyptique demeure paradoxale; la traduction ne cherche pas à la rationaliser.
- issue: Le référent des verbes pluriels à la fin du verset
  choice: des choses semblables à des montagnes resplendissantes tournaient et allaient çà et là
  alternative: la flamme était entourée comme de montagnes resplendissantes et s’agitait çà et là
  rationale: Les formes verbales sont à la troisième personne du pluriel et s’accordent plus naturellement avec des entités comparées à des montagnes qu’avec la flamme singulière.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe reste fluide tout en conservant le caractère étrange et visionnaire du passage. Les difficultés du témoin et les ambiguïtés réelles sont signalées en notes plutôt que résolues silencieusement.
