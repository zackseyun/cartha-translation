base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: fr
  text: Car il existe à leur sujet, là-haut dans le ciel, des écrits et des registres[a], afin que les anges les lisent et sachent ce qui arrivera aux pécheurs, aux esprits humbles[b], à ceux qui ont fait souffrir leur corps et ont reçu de Dieu leur rétribution[c], ainsi qu’à ceux que des hommes mauvais ont couverts de mépris[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « écrits et registres » est difficile. Le second terme pourrait être compris autrement; le sens de documents célestes est retenu parce que la suite dit que les anges les lisent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les esprits humbles »; on pourrait aussi comprendre « les âmes humbles », mais non, grammaticalement, « les humbles en esprit ».
    reason: grammar_and_lexical_alternative
  - marker: c
    text: Ou « leur récompense ». Le mot désigne ce qui est rendu en retour; dans ce contexte, il paraît s’agir d’une rétribution favorable accordée par Dieu.
    reason: semantic_ambiguity
  - marker: d
    text: Ou « ceux qui ont été outragés » ou « méprisés par des hommes mauvais ». Le sens exact du verbe est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit la raison ou l’explication de ce qui précède, avec un lien discursif naturel en français.
- source_word: ጽሑፋን ወእኩያን
  choice: des écrits et des registres
  rationale: Le premier terme désigne des documents écrits; le second est difficile, mais le contexte de leur lecture par les anges favorise le sens de registres célestes.
- source_word: ላዕለ በሰማይ
  choice: là-haut dans le ciel
  rationale: Rend les deux éléments locatifs sans lourdeur et conserve le registre apocalyptique.
- source_word: ከመ ይንብብዎሙ መላእክት
  choice: afin que les anges les lisent
  rationale: Exprime clairement la proposition de but et le pronom objet pluriel.
- source_word: ዘሀሎ ይብጽሖሙ
  choice: ce qui arrivera
  rationale: Rend naturellement l’idée de ce qui doit atteindre ou échoir aux groupes mentionnés.
- source_word: ለመናፍስት ትኁታን
  choice: aux esprits humbles
  rationale: Respecte la construction guèze, où le nom pluriel « esprits » est directement qualifié par l’adjectif pluriel « humbles », plutôt que de la transformer en disposition intérieure.
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: ceux qui ont fait souffrir leur corps
  rationale: Conserve la force du verbe et l’ambiguïté entre souffrance corporelle volontaire, privation et rude traitement du corps.
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: ont reçu de Dieu leur rétribution
  rationale: Préserve la nuance de paiement ou de rétribution sans imposer dans le corps du texte le terme plus explicitement positif « récompense ».
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: ceux que des hommes mauvais ont couverts de mépris
  rationale: Rend le sens contextuel de honte, mépris ou opprobre subi de la part d’hommes mauvais, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Nature des objets célestes écrits
  choice: Des écrits et des registres célestes lus par les anges
  alternative: Le second nom pourrait évoquer des choses mauvaises ou des actes mauvais consignés par écrit.
  rationale: La proposition suivante dit explicitement que les anges les lisent; l’image de documents célestes convient donc le mieux au contexte judiciaire et apocalyptique.
- issue: Sens de « መናፍስት ትኁታን »
  choice: Les esprits humbles
  alternative: Les humbles en esprit; les âmes humbles
  rationale: La syntaxe source présente un nom pluriel qualifié par un adjectif pluriel. Cette formulation préserve aussi la possible portée eschatologique de « esprits ».
- issue: Valeur de la rétribution divine
  choice: Employer le terme relativement neutre « rétribution »
  alternative: Récompense ou juste retour favorable accordé par Dieu
  rationale: Le contexte suggère une vindication positive, mais le lexème peut désigner plus largement ce qui est rendu en retour; la traduction conserve cette tension.
- issue: Souffrance corporelle
  choice: Ne pas préciser qu’il s’agit d’une pratique ascétique
  alternative: Ceux qui ont mortifié ou discipliné leur corps
  rationale: Le texte parle de faire souffrir le corps, sans permettre d’identifier avec certitude une doctrine ou une pratique ascétique déterminée.
translation_notes:
  register: Français international moderne, digne et lisible. La longue phrase et l’imagerie des registres célestes sont conservées, mais la syntaxe est légèrement ordonnée pour rester naturelle. « Esprits humbles » suit la grammaire guèze malgré son caractère moins idiomatique, afin de ne pas réduire le groupe à une simple qualité morale intérieure.
