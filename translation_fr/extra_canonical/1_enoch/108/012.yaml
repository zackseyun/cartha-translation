revisions:
- from: Et je ferai sortir dans une éclatante lumière ceux qui ont aimé mon saint nom[a], et j’installerai chacun sur le trône de sa gloire[b].
  to: Et je ferai sortir à la lumière éclatante ceux qui ont aimé mon saint nom, et je ferai asseoir chacun sur le trône de sa gloire[a].
  rationale: La révision supprime une note alternative grammaticalement non fondée sur la fonction de ለ- et conserve l’ambiguïté réelle du possessif final. « Je ferai asseoir » précise l’action causative associée au trône sans ajouter d’interprétation doctrinale.
