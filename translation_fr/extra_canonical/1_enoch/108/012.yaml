base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: fr
  text: Et je ferai sortir à la lumière éclatante ceux qui ont aimé mon saint nom, et je ferai asseoir chacun sur le trône de sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur le trône de sa gloire ». Le possessif peut se rapporter distributivement à « chacun » ; le contexte permet aussi de l’entendre par rapport à une figure exaltée. Autre rendu possible : « sur le trône glorieux ».'
    reason: referent_ambiguity
lexical_decisions:
- source_word: እወፅኦሙ
  choice: je ferai sortir
  rationale: Le causatif exprime l’action de faire sortir ou de mener au-dehors. Le pronom objet anticipé est repris par « ceux qui ont aimé… ».
- source_word: በብሩህ ብርሃን
  choice: dans une éclatante lumière
  rationale: La combinaison de l’adjectif et du nom apparentés intensifie l’image lumineuse. « Dans » conserve la valeur possible de la préposition sans imposer exclusivement une direction.
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: ceux qui ont aimé mon saint nom
  rationale: Le préfixe ለ- peut ici introduire l’objet explicatif correspondant au suffixe objet du verbe; cette lecture identifie donc les personnes que le locuteur fait sortir.
- source_word: አነብር
  choice: j’installerai
  rationale: Dans le contexte du trône, le verbe causatif signifie placer ou faire asseoir. « Installerai » rend naturellement l’établissement de chacun sur un trône.
- source_word: አሐደ አሐደ
  choice: chacun
  rationale: 'La répétition a une valeur distributive: chaque personne est considérée individuellement.'
- source_word: መንበረ ክብር ዚአሁ
  choice: le trône de sa gloire
  rationale: « Trône » convient à l’imagerie d’exaltation. La construction génitive et le pronom masculin singulier sont conservés plutôt que reformulés en simple adjectif.
theological_decisions:
- issue: Référent du possessif dans « sa gloire »
  choice: 'Le possessif renvoie naturellement à « chacun »: chaque fidèle reçoit le trône associé à sa propre gloire.'
  alternative: Le possessif peut être compris comme renvoyant à Dieu ou à une autre figure exaltée du contexte; on pourrait aussi rendre plus généralement « le trône glorieux ».
  rationale: La proximité de አሐደ አሐደ (« chacun ») et l’accord à la troisième personne du singulier favorisent le renvoi distributif, sans que l’ambiguïté du contexte apocalyptique disparaisse entièrement.
- issue: Fonction de ለ- devant « ceux qui ont aimé »
  choice: La proposition désigne directement ceux que le locuteur fait sortir.
  alternative: 'La construction peut être comprise comme indiquant les bénéficiaires ou destinataires: « pour ceux qui ont aimé mon saint nom ».'
  rationale: Le suffixe objet pluriel anticipé sur le verbe, repris par le groupe relatif introduit par ለ-, soutient fortement l’analyse comme objet explicité.
translation_notes:
  register: Français international actuel, digne et lisible. La formulation conserve l’image apocalyptique de la lumière et du trône, ainsi que les ambiguïtés grammaticales réelles, signalées en notes.
