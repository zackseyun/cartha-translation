base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: fr
  text: ceux qui, depuis qu’ils existent, n’ont pas désiré la nourriture qui est sur la terre, mais ont considéré leurs âmes comme un souffle qui passe[a], et s’y sont tenus. Le Seigneur les a beaucoup éprouvés, et leurs esprits ont été trouvés purs, afin qu’ils bénissent son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un esprit qui passe » ou « comme un vent qui passe » ; le mot guèze peut désigner l’esprit, le vent ou le souffle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢፈተዉ
  choice: n’ont pas désiré
  rationale: Le verbe exprime le désir ou l’attrait intérieur, et non un simple refus.
- source_word: መብልዕተ ዘውስተ ምድር
  choice: la nourriture qui est sur la terre
  rationale: Cette formulation conserve l’image spatiale concrète sans généraliser en « plaisirs mondains ».
- source_word: ረሰዩ ነፍሳቶሙ ከመ መንፈስ እንተ ተሐልፍ
  choice: ont considéré leur âme comme un souffle qui passe
  rationale: ረሰዩ avec ከመ signifie ici « considérer comme » plutôt que « abandonner ». « Âme » garde la correspondance avec ነፍስ, tandis que « souffle » exprime naturellement la fragilité et le caractère passager.
- source_word: ዐቀቡ
  choice: s’y sont tenus
  rationale: Le verbe peut signifier garder, observer ou préserver. La tournure française renvoie à la disposition ou discipline précédente sans en préciser excessivement l’objet.
- source_word: ብዙኃ አመከሮሙ እግዚእ
  choice: Le Seigneur les a beaucoup éprouvés
  rationale: Le contexte d’examen suivi d’un constat de pureté favorise « éprouver »; « beaucoup » conserve la force adverbiale du texte.
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: leur esprit a été trouvé pur
  rationale: Le singulier collectif est naturel en français et préserve le résultat de l’épreuve exprimé par la tournure passive.
- source_word: ከመ ይባርክዎ ለስሙ
  choice: afin qu’ils bénissent son nom
  rationale: Cette formulation conserve la nuance de finalité ou de résultat et l’expression biblique « bénir son nom ».
theological_decisions:
- issue: Portée du renoncement à la nourriture terrestre
  choice: Conserver la mention concrète de la nourriture et la manière de considérer l’âme, sans introduire de vocabulaire monastique ou de martyre.
  alternative: Comprendre le passage comme le rejet général des plaisirs du monde, ou comme un jeûne allant jusqu’à la mort.
  rationale: Le guèze mentionne explicitement la nourriture terrestre et une existence tenue pour passagère, mais ne définit aucune institution ascétique ni mise à mort.
- issue: Sens de መንፈስ dans la comparaison
  choice: souffle
  alternative: esprit ou vent
  rationale: Dans la comparaison, l’idée dominante est celle de ce qui passe. « Souffle » rend la brièveté et la fragilité tout en signalant en note la polysémie du terme.
- issue: Rapport entre ነፍስ et መንፈስ
  choice: Traduire respectivement par « âme » et « esprit ».
  alternative: Traduire ነፍስ par « vie » afin de marquer plus nettement l’existence terrestre.
  rationale: « Âme » maintient la correspondance lexicale et la tension du texte, sans imposer une anthropologie systématique; la distinction avec « esprit » reste visible.
translation_notes:
  register: Français international moderne, digne et accessible. La longue coordination du guèze est légèrement segmentée pour la lisibilité, sans modifier l’ordre des idées. Aucun vocabulaire ascétique technique n’est ajouté.
