  source_fidelity: 'Le sens fondamental est bien rendu : absence de désir pour la nourriture terrestre, considération de la nefesh comme transitoire, épreuve par le Seigneur et constat de pureté. Toutefois, le guèze emploie explicitement les pluriels « leurs âmes » puis « leurs esprits » ; les conserver rend mieux la distinction et l’accord avec le groupe visé.'
