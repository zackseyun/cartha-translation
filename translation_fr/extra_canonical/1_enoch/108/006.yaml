base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: fr
  text: 'Et il me dit : « Voici le lieu que tu vois. C’est ici que seront jetés les esprits des pécheurs, des blasphémateurs, de ceux qui font le mal et de ceux qui déforment tout ce que le Seigneur a déclaré par la bouche des prophètes — tout ce qui doit s’accomplir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትወደዩ
  choice: seront jetés
  rationale: Rend naturellement la forme passive exprimant le fait d’être précipité ou jeté dans ce lieu.
- source_word: ጽኁፋን
  choice: blasphémateurs
  rationale: Dans cette énumération de coupables, le terme est compris selon la tradition textuelle comme désignant ceux qui blasphèment; « blasphémateurs » reste clair et dignifié en français.
- source_word: ይመይጡ
  choice: déforment
  rationale: Exprime l’idée d’altérer ou de détourner les paroles prophétiques sans préciser indûment la manière dont elles sont falsifiées.
- source_word: ዘነገረ፡ እግዚእ፡ በኣፈ፡ ነቢያት
  choice: ce que le Seigneur a déclaré par la bouche des prophètes
  rationale: Conserve l’image sémitique et le rôle des prophètes comme porte-parole du Seigneur.
- source_word: ኵሉ፡ ይትገበር
  choice: tout ce qui doit s’accomplir
  rationale: Reproduit la portée globale et la forme passive, tout en rendant idiomatiquement l’idée de réalisation en contexte prophétique.
theological_decisions:
- issue: Portée du dernier membre de phrase
  choice: « tout ce qui doit s’accomplir » est rattaché aux déclarations prophétiques
  alternative: « tout sera accompli » comme affirmation indépendante
  rationale: La syntaxe transmise permet une certaine tension; la formulation retenue suit le lien relatif visible dans le texte sans ajouter une interprétation doctrinale.
- issue: Nature de l’altération des paroles prophétiques
  choice: « déforment »
  alternative: « pervertissent », « tordent » ou « changent »
  rationale: « Déforment » préserve l’accusation d’altération tout en évitant de spécifier s’il s’agit d’exégèse, de transmission textuelle ou de désobéissance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure énumérative et l’expression « par la bouche des prophètes » sont conservées pour respecter la solennité et la texture de la source.
