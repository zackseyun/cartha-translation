base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: fr
  text: Ils se réjouiront pendant des temps sans nombre[a], car le jugement de Dieu est juste[b] ; en effet, il donnera la foi aux fidèles[c], dans la demeure des chemins de droiture[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « durant des âges innombrables ». Le guèze parle de temps ou de périodes qu’on ne peut compter.
    reason: lexical_alternative
  - marker: b
    text: 'La transcription fournie porte ici la forme difficile አነኒሁ. Elle semble résulter d’une erreur de lecture pour ኵነኔሁ, « son jugement », d’où « le jugement de Dieu est juste ». Si l’on suit strictement la transcription, on pourrait comprendre : « la justice appartient à Dieu ».'
    reason: textual_variant
  - marker: c
    text: Ou « il donnera la fidélité aux fidèles », voire « la constance aux fidèles ». Le mot peut exprimer la foi aussi bien que la fidélité persévérante.
    reason: lexical_alternative
  - marker: d
    text: L’expression conserve l’image concrète d’une demeure où se trouvent les chemins de la droiture.
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: ils resplendiront
  rationale: Le verbe décrit ici l’éclat futur des justes dans un cadre eschatologique. « Resplendiront » rend naturellement cette image en français, sans la réduire à la seule joie.
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: pendant des temps sans nombre
  rationale: La formule associe des temps ou périodes à l’impossibilité de les compter. Cette traduction conserve l’expression temporelle et son caractère indéfini.
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: le jugement de Dieu est juste
  rationale: 'La leçon rétablie ኵነኔሁ, « son jugement », donne une proposition cohérente : le jugement qui appartient à Dieu est juste. Elle explique vraisemblablement la forme aberrante አነኒሁ de la transcription fournie.'
- source_word: ለመሃይምናን
  choice: aux fidèles
  rationale: Le terme désigne les croyants ou les fidèles et appartient à la même famille lexicale que ሃይማኖተ. Il ne signifie pas « aux sages ».
- source_word: ሃይማኖተ
  choice: la fidélité
  rationale: Le nom peut désigner la foi, la fidélité ou la constance. « Fidélité » convient au contexte de persévérance et permet de conserver en français l’écho avec « fidèles », tandis que « foi » reste indiqué en note.
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: dans la demeure des chemins de droiture
  rationale: Cette formulation maintient l’image concrète d’une demeure caractérisée par des chemins droits, plutôt que de la remplacer par une abstraction.
theological_decisions:
- issue: Nature du don accordé aux fidèles
  choice: Dieu leur donne la fidélité
  alternative: Dieu leur donne la foi ou la constance
  rationale: Le terme guèze couvre à la fois la foi et la fidélité. Le contexte peut évoquer la persévérance morale, mais la dimension de foi ne doit pas être exclue ; elle est donc conservée en note.
- issue: Fondement divin de la destinée des justes
  choice: le jugement de Dieu est juste
  alternative: la justice appartient à Dieu
  rationale: La première lecture repose sur la correction très probable d’une erreur de transcription ou d’OCR et produit la construction guèze attendue. La seconde reflète la transcription fournie telle quelle, mais celle-ci comporte une forme difficile et vraisemblablement corrompue.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme conserve le ton eschatologique du passage ainsi que ses images concrètes. Les répétitions causales sont rendues par « car » puis « en effet » pour éviter une lourdeur excessive sans effacer le lien logique.
