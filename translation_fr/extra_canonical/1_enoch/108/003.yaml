  - severity: low
    issue: Ajout implicite dans « au milieu d’un feu ardent »
    rationale: Le texte indique qu’ils seront « dans un feu brûlant », sans préciser qu’ils en seront au milieu. La formulation plus simple maintient l’image sans ajout.
