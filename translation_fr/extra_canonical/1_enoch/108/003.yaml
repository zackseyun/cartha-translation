revisions:
- from: Mais vous, attendez que le péché ait disparu. Car leurs noms seront effacés du livre de vie et des livres des êtres saints, et leur descendance disparaîtra pour toujours. Leurs esprits seront mis à mort ; ils crieront et se lamenteront dans un lieu désert et invisible[a], au milieu d’un feu ardent. Car là, il n’y a pas de terre[b].
  to: Mais vous, attendez jusqu’à ce que le péché disparaisse. Car leurs noms seront effacés du livre de vie et des livres des êtres saints, et leur descendance sera détruite à jamais. Leurs esprits seront mis à mort ; ils crieront et se lamenteront dans un lieu désert et invisible[a], et dans un feu ardent. Car là, il n’y a pas de terre[b].
  rationale: La révision corrige l’atténuation du verbe de destruction appliqué à la descendance et retire l’ajout spatial implicite de « au milieu ». Elle conserve l’ambiguïté du lieu « invisible », la pluralité des livres et la tension des images de mise à mort et de lamentation dans le feu.
