review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’impératif « attendez », l’effacement des noms des registres célestes, les « esprits », le lieu désert et invisible, ainsi que l’étrange affirmation finale qu’il n’y a pas de terre. Toutefois, « leur descendance disparaîtra » atténue le verbe de destruction du texte source. « Au milieu d’un feu ardent » ajoute aussi une précision spatiale absente du texte, qui dit simplement qu’ils seront dans un feu brûlant.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Dans un feu ardent » est plus direct et plus fidèle que « au milieu d’un feu ardent ».
  terminology: « Livre de vie », « livres des êtres saints », « esprits » et « feu ardent » conservent les termes et les ambiguïtés apocalyptiques sans les harmoniser doctrinalement. « Êtres saints » est un choix recevable pour ne pas imposer le sens ecclésiastique de « saints ».
