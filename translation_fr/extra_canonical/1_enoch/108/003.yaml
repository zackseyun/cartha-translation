base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: fr
  text: Mais vous, attendez jusqu’à ce que le péché disparaisse. Car leurs noms seront effacés du livre de vie et des livres des êtres saints, et leur descendance sera détruite à jamais. Leurs esprits seront mis à mort ; ils crieront et se lamenteront dans un lieu désert et invisible[a], et dans un feu ardent. Car là, il n’y a pas de terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze peut aussi se rendre par « qui n’est pas visible » ou « qui n’apparaît pas ».
    reason: lexical_alternative
  - marker: b
    text: La formule inhabituelle « il n’y a pas de terre » appartient vraisemblablement à la description visionnaire du lieu de châtiment ; elle est conservée littéralement.
    reason: cultural_note
lexical_decisions:
- source_word: ጽንሑ
  choice: attendez
  rationale: Impératif pluriel de ጸንሐ, « attendre ». Ce choix conserve l’exhortation et la répétition du verbe employé au verset précédent, sans le confondre avec le verbe signifiant « être ferme ».
- source_word: ተሐልፍ ኃጢአት
  choice: que le péché ait disparu
  rationale: Le verbe exprime le passage ou la disparition. La formulation évoque la fin du péché dans l’attente apocalyptique, et non simplement le pardon de fautes individuelles.
- source_word: ይደመስስ
  choice: seront effacés
  rationale: Avec « leurs noms » pour objet et des livres célestes pour contexte, « effacés » restitue naturellement l’image d’une inscription supprimée.
- source_word: እመጽሐፈ ሕይወት
  choice: du livre de vie
  rationale: Traduction directe et intelligible de l’image apocalyptique d’un registre céleste.
- source_word: እመጻሕፍተ ቅዱሳን
  choice: des livres des êtres saints
  rationale: Le pluriel « livres » est conservé. « Êtres saints » évite de limiter le syntagme aux saints au sens ecclésiastique et laisse ouverte l’identité des figures désignées.
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: leur descendance disparaîtra pour toujours
  rationale: « Descendance » rend clairement l’idée de lignée ; « disparaîtra pour toujours » conserve la portée définitive du jugement.
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: Leurs esprits seront mis à mort
  rationale: Le substantif signifie « esprits » et n’est pas normalisé en « âmes ». La voix passive et la violence de l’image judiciaire sont préservées.
- source_word: ይጸርኁ ወየአውይዉ
  choice: ils crieront et se lamenteront
  rationale: Cette paire verbale exprime un cri de détresse et une lamentation, avec force mais sans dramatisation ajoutée.
- source_word: በመካነ ባድው
  choice: dans un lieu désert
  rationale: La formule désigne un endroit vide ou désolé ; « lieu désert » est naturel en français et garde la force de l’image.
- source_word: ዘኢያስተርኢ
  choice: invisible
  rationale: La forme verbale signifie « ne pas apparaître, ne pas être visible ». « Invisible » rend ce sens sans introduire l’idée distincte de quelque chose qui ne pourrait pas être montré.
- source_word: በእሳተ ነዱ
  choice: au milieu d’un feu ardent
  rationale: La formulation conserve l’intensification de l’image du feu tout en restant idiomatique en français.
- source_word: ኢሀሎ ህየ ምድር
  choice: là, il n’y a pas de terre
  rationale: Cette traduction littérale préserve l’étrangeté et la dimension cosmique de la vision, sans réduire « terre » à « sol » ou « terrain ».
theological_decisions:
- issue: Nature des livres célestes dont les noms sont effacés
  choice: Le texte distingue le « livre de vie » des « livres des êtres saints » et conserve l’image de plusieurs registres célestes.
  alternative: Comprendre les seconds comme des livres appartenant aux êtres saints, ou plus généralement comme des écrits sacrés.
  rationale: Le contexte associe inscription, effacement et jugement. La traduction maintient la pluralité et l’ambiguïté du complément sans fusionner les livres en un seul registre.
- issue: Nature du châtiment subi par les esprits
  choice: Conserver ensemble les images de mise à mort, de cris, de lamentation, de désolation et de feu.
  alternative: Y voir soit une image de destruction totale, soit une description développée d’un châtiment conscient après la mort.
  rationale: Le verset juxtapose des images en tension. La traduction ne les harmonise pas avec un système doctrinal postérieur et ne tranche pas leur rapport littéral ou symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure solennelle sans archaïsmes. Les images apocalyptiques inhabituelles et les ambiguïtés concernant les livres célestes et le châtiment des esprits sont conservées plutôt qu’expliquées dans le corps du texte.
