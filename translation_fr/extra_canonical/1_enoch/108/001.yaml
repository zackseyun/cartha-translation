base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: fr
  text: Autre livre qu’Hénoch a écrit pour son fils Mathusalem et pour ceux qui viendront après lui et observeront la règle[a] dans les derniers jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre », « la prescription » ou « la voie prescrite ». Le terme guèze peut désigner une norme ou une manière d’agir établie que l’on doit observer.
    reason: Signaler l’étendue sémantique de ሥርዐተ sans trancher une ambiguïté réelle du texte source.
lexical_decisions:
- source_word: ካልእ፡ መጽሐፍ
  choice: Autre livre
  rationale: Cette formulation brève conserve le caractère de titre ou de suscription et présente cet écrit comme distinct de ce qui précède, sans imposer une numérotation précise.
- source_word: ዘጸሐፈ፡ ሄኖክ
  choice: qu’Hénoch a écrit
  rationale: La proposition relative suit de près le sens du guèze tout en restant naturelle en français moderne.
- source_word: ለወልዱ፡ ማቱሳላ
  choice: pour son fils Mathusalem
  rationale: La préposition « pour » exprime naturellement le destinataire ou le bénéficiaire de l’écrit.
- source_word: ለእለ፡ ይመጽኡ፡ እምድኅሬሁ
  choice: pour ceux qui viendront après lui
  rationale: Le futur préserve l’orientation vers les générations postérieures, tandis que « après lui » maintient la référence personnelle du texte.
- source_word: የዓቅቡ
  choice: observeront
  rationale: Dans le contexte d’une norme établie, « observer » rend clairement l’idée de garder et respecter, sans suggérer seulement une protection matérielle.
- source_word: ሥርዐተ
  choice: la règle
  rationale: Le terme peut désigner un ordre, une règle, une prescription ou une manière établie. « La règle » exprime ici une norme à observer sans la réduire à un décret juridique particulier.
- source_word: በደኃሪ፡ መዋዕል
  choice: dans les derniers jours
  rationale: Cette formule française conserve la portée temporelle et apocalyptique de l’expression sans y introduire un système eschatologique ultérieur.
theological_decisions:
- issue: Portée eschatologique de በደኃሪ መዋዕል
  choice: dans les derniers jours
  alternative: dans les temps à venir ; à la fin des jours
  rationale: Le contexte apocalyptique favorise une expression chargée d’une résonance eschatologique. « Dans les derniers jours » conserve cette tension tout en laissant ouverte la délimitation exacte de la période.
- issue: Nature de la norme désignée par ሥርዐተ
  choice: la règle
  alternative: l’ordre ; la prescription ; la voie prescrite
  rationale: Le texte évoque une norme établie à observer, mais ne précise pas s’il s’agit d’une ordonnance particulière, d’un ordre général ou d’un mode de conduite. Le choix principal et la note préservent cette latitude.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forme de suscription du verset. Le futur coordonné (« viendront… observeront ») rend explicite le parallélisme verbal du guèze, et la note est placée après le mot qu’elle explique.
