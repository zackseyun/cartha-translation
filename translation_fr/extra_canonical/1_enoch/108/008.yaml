base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/008.yaml
  text: those who love God[a], and did not love gold or silver or any of the good things that are in the world[b], but gave their bodies to affliction.
translation:
  language: fr
  text: ceux qui aiment Dieu, qui n’ont aimé ni l’or, ni l’argent, ni aucun des biens qui sont dans le monde[a], mais qui ont livré leur corps à la souffrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze de cette expression est textuellement difficile dans le témoin disponible; elle semble désigner de manière générale les biens désirables du monde.
    reason: textual_variant
  - marker: b
    text: Le mot guèze ሥጋ peut se traduire par « chair » ou par « corps ». Ici, « corps » souligne le caractère concret de la souffrance endurée.
    reason: lexical_alternative
lexical_decisions:
- source_word: እለ
  choice: ceux qui
  rationale: Le relatif pluriel introduit le groupe décrit; « ceux qui » reproduit naturellement cette construction en français.
- source_word: ያፈቅርዎ ለአምላክ
  choice: aiment Dieu
  rationale: Le verbe exprime l’amour ou l’attachement envers Dieu. Le présent convient à la caractérisation générale de ces personnes.
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: n’ont aimé ni l’or, ni l’argent
  rationale: La reprise du verbe « aimer » maintient le contraste lexical entre l’amour de Dieu et l’attachement aux richesses. Le passé composé reflète la forme accomplie du verbe dans cette proposition.
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: ni aucun des biens qui sont dans le monde
  rationale: Cette formulation rend le sens distributif probable et l’idée générale des choses désirables du monde, sans trancher excessivement une leçon textuellement difficile.
- source_word: አላ
  choice: mais
  rationale: La conjonction marque une opposition forte entre l’attachement aux biens du monde et l’acceptation de la souffrance.
- source_word: ወሀቡ ሥጋሆሙ
  choice: ont livré leur corps
  rationale: Le verbe signifie « donner » ou « livrer », et ሥጋ peut désigner la chair ou le corps. « Leur corps », au singulier distributif naturel en français, souligne la dimension physique de leur engagement.
- source_word: ለጻዕር
  choice: à la souffrance
  rationale: Le nom peut évoquer la peine, l’épreuve, la détresse ou la souffrance. « Souffrance » reste assez large et convient au contexte d’endurance corporelle.
theological_decisions:
- issue: Le passage décrit-il un renoncement volontaire aux biens matériels ou simplement une situation de pauvreté?
  choice: Un refus délibéré de s’attacher aux biens du monde, lié à l’amour de Dieu
  alternative: Une simple description de personnes dépourvues de richesses
  rationale: La répétition du verbe « aimer » oppose directement l’amour de Dieu à celui de l’or, de l’argent et des biens du monde. La dernière proposition évoque en outre une acceptation active de la souffrance, sans préciser si elle relève de l’ascèse, de la persécution ou d’une autre forme d’épreuve.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le contraste rhétorique fondé sur le verbe « aimer » ainsi que l’alternance entre le présent caractérisant l’amour de Dieu et le passé composé décrivant le refus des richesses et le don de soi.
