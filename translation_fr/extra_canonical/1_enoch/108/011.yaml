base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: fr
  text: Et maintenant, j’appellerai les esprits des bons, issus de la génération de lumière, et je transformerai[b] ceux qui sont nés dans les ténèbres, ceux qui, dans leur chair, n’ont pas reçu l’honneur que leur foi[a] méritait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur fidélité ». Le terme guèze peut désigner la foi aussi bien qu’une fidélité constante.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « je transformerai » est difficile. Il pourrait évoquer plus précisément le fait de faire briller ou d’illuminer.
    reason: textual_variant
lexical_decisions:
- source_word: እጼውዕ
  choice: j’appellerai
  rationale: Le verbe exprime l’action d’appeler ou de convoquer. « J’appellerai » garde ici un ton solennel sans les connotations administratives de « je convoquerai » ni les connotations rituelles de « j’invoquerai ».
- source_word: መናፍስቲሆሙ ለኄራን
  choice: les esprits des bons
  rationale: 'Le suffixe pronominal anticipatif suivi de la construction en la- marque le génitif défini : il s’agit des « esprits des bons », et non de « leurs esprits — les bons ». « Esprits » préserve l’ambiguïté anthropologique du texte.'
- source_word: እምትውልድ እንተ ብርሃን
  choice: issus de la génération de lumière
  rationale: Cette formulation naturelle en français conserve l’image apocalyptique d’une appartenance à une génération ou lignée caractérisée par la lumière.
- source_word: እዊልጥ
  choice: je transformerai
  rationale: La forme est difficile. « Transformer » rend l’idée contextuelle d’un changement opéré sur ceux qui sont nés dans les ténèbres, sans imposer dans le texte principal l’image plus précise d’une illumination.
- source_word: ተወልዱ በጽልመት
  choice: sont nés dans les ténèbres
  rationale: Traduction directe qui maintient le contraste symbolique avec la génération de lumière.
- source_word: በሥጋሆሙ
  choice: dans leur chair
  rationale: La traduction littérale préserve le cadre incarné et mortel de leur expérience, sans réduire « chair » à la seule notion de corps.
- source_word: ኢተፈደዩ ክብር
  choice: n’ont pas reçu l’honneur
  rationale: La tournure française rend clairement l’absence de rétribution honorifique. Elle évite la formulation peu naturelle « n’ont pas été payés en honneur » tout en conservant la notion de récompense due.
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: que méritait leur foi
  rationale: La proposition exprime ce qui convenait ou était dû en raison de leur ሃይማኖት. « Foi » reste le choix principal, tandis que « fidélité » est signalé en note.
theological_decisions:
- issue: Sens de ሃይማኖት dans ce contexte éthique et apocalyptique
  choice: foi
  alternative: fidélité
  rationale: Le terme peut désigner la foi aussi bien qu’une fidélité persévérante. Le texte principal retient « foi » sans exclure la lecture éthique, conservée dans la note.
- issue: Rapport entre les bons et ceux qui sont nés dans les ténèbres
  choice: La syntaxe les présente dans un même mouvement de convocation et de transformation, sans préciser définitivement leur identité réciproque.
  alternative: Ceux qui sont nés dans les ténèbres pourraient constituer un second groupe distinct des bons.
  rationale: La coordination favorise une lecture de renversement et de réhabilitation, mais la traduction ne doit pas transformer cette proximité syntaxique en identification doctrinale explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur est maintenu pour les deux verbes afin de respecter leur parallélisme et le cadre eschatologique. La ponctuation évite de reproduire l’ancienne analyse appositive fautive. Les notes sont placées immédiatement après les expressions concernées.
