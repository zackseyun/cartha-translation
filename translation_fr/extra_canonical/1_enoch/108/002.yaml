base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: fr
  text: Vous qui avez fait le bien, attendez ces jours-là[a], jusqu’à ce que ceux qui font le mal soient amenés à leur fin[b] et que la puissance des pécheurs prenne fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tenez bon jusqu’à ces jours-là »; le verbe peut exprimer l’attente, la persévérance ou l’endurance.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « soient achevés ». Il s’agit de la fin de ceux qui font le mal, et non simplement de la fin de leurs mauvaises actions.
    reason: clarification
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: Vous qui avez fait le bien
  rationale: La proposition relative et le verbe à l’accompli désignent les personnes caractérisées par leurs bonnes actions. Cette formulation conserve aussi l’opposition avec « ceux qui font le mal ».
- source_word: ትጸንሑ
  choice: attendez
  rationale: Le verbe peut exprimer l’attente, la permanence ou l’endurance. Avec la mention des jours et la proposition introduite par « jusqu’à », « attendez » rend naturellement l’orientation vers l’accomplissement futur, tandis qu’une note préserve la nuance de persévérance.
- source_word: ለእሉ መዋዕል
  choice: ces jours-là
  rationale: መዋዕል désigne des jours ou des temps. Le démonstratif distal est rendu par « ces jours-là »; la relation temporelle est portée en français par « attendez » et par la proposition suivante en « jusqu’à ».
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: jusqu’à ce que ceux qui font le mal soient amenés à leur fin
  rationale: La forme passive exprime le fait d’être achevé ou conduit à son terme. « Soient amenés à leur fin » évite de suggérer qu’ils cessent simplement de commettre le mal et maintient le jugement visant les malfaiteurs eux-mêmes.
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: et que la puissance des pécheurs prenne fin
  rationale: ኃይል signifie puissance, force ou pouvoir, et መአብሳን désigne les pécheurs. La répétition de « fin » reflète la reprise du même verbe d’accomplissement dans le texte source.
theological_decisions:
- issue: Sens de መአብሳን
  choice: pécheurs
  alternative: méchants
  rationale: « Pécheurs » conserve la portée morale et religieuse du substantif, sans le confondre avec l’expression verbale précédente, « ceux qui font le mal ».
- issue: Nature de la fin de ceux qui font le mal
  choice: soient amenés à leur fin
  alternative: disparaissent / soient anéantis
  rationale: La traduction retenue garde l’idée passive d’une fin imposée sans préciser davantage si le texte désigne l’anéantissement, la destruction ou la cessation de leur domination.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme entre la fin des malfaiteurs et celle de leur puissance est conservé, ainsi que l’ambiguïté mesurée du verbe exprimant l’achèvement.
