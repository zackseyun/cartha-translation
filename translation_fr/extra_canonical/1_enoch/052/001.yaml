base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: fr
  text: Et après ces jours-là, dans ce lieu où j’avais vu toutes les visions de ce qui est caché[a], car j’avais été enlevé par un tourbillon[b][c], et il m’avait transporté vers l’ouest —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les visions cachées ». Le guèze peut désigner soit des visions portant sur ce qui est caché, soit des visions elles-mêmes cachées.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par un tourbillon de vent », expression intensive évoquant un vent violent qui l’emporte.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « j’avais été enlevé par un tourbillon de vent, qui m’avait emporté vers l’ouest ».'
    reason: previous_rendering
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: après ces jours-là
  rationale: Cette formule conserve la succession temporelle et la valeur déictique de እማንቱ, tout en restant naturelle en français moderne.
- source_word: በውእቱ መካን
  choice: dans ce lieu
  rationale: መካን désigne concrètement un lieu; cette formulation maintient le cadre spatial de la vision.
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: j’avais vu toutes les visions de ce qui est caché
  rationale: Le plus-que-parfait convient à l’antériorité dans ce passage de transition. « De ce qui est caché » préserve le sens apocalyptique de réalités dissimulées sans exclure l’analyse grammaticale « visions cachées ».
- source_word: ተመሠጥኩ
  choice: j’avais été saisi et emporté
  rationale: Le doublet français exprime le caractère soudain et contraignant du déplacement, que le simple « pris » rendrait trop faiblement.
- source_word: በአውሎጋኒ ነፋስ
  choice: par un tourbillon
  rationale: « Tourbillon » rend naturellement l’image météorologique intensive; la répétition littérale avec « vent » est signalée en note.
- source_word: ወወሰደኒ ዓረበ
  choice: et il m’avait transporté vers l’ouest
  rationale: La valeur directionnelle de ዓረበ est conservée, tandis que « transporté » exprime le mouvement imprimé par le tourbillon.
theological_decisions:
- issue: Nature du transport visionnaire
  choice: j’avais été saisi et emporté par un tourbillon
  alternative: j’avais été pris par l’esprit du vent
  rationale: Le texte met au premier plan un déplacement puissant porté par le vent. La traduction conserve l’imagerie visionnaire sans décider si l’expérience est corporelle, extatique ou seulement figurée.
- issue: Rapport syntaxique avec le contexte suivant
  choice: conserver la proposition explicative introduite par « car » et laisser la phrase ouverte par des tirets
  alternative: transformer le transport en action narrative principale et clore la phrase
  rationale: እስመ introduit explicitement une explication de la présence d’Hénoch en ce lieu; la construction demeure suspendue jusqu’à l’action du verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe volontairement suspendue et les tirets conservent le caractère de transition du verset vers le suivant. Le doublet « saisi et emporté » restitue la force du verbe sans employer « ravi », terme susceptible de suggérer prématurément une interprétation théologique précise.
