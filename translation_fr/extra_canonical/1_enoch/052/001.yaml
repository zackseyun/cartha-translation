    issue: Doublet « saisi et emporté »
    rationale: Le verbe ተመሠጥኩ correspond à la saisie ou à l’enlèvement; l’action de porter est ensuite exprimée par ወወሰደኒ. Ajouter « emporté » au premier verbe brouille cette distinction et fait redondance avec « il m’avait transporté ».
  - severity: low
    issue: Note c présente une paraphrase alternative trop libre
    rationale: « Vent de tempête » peut être une possibilité contextuelle, mais ne reflète pas aussi clairement l’expression littérale et son lien avec la proposition suivante. Une variante portant sur l’ensemble de la proposition respecte mieux la syntaxe attestée.
