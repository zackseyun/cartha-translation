base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: fr
  text: 'Et cet ange de paix me répondit : « Attends un peu[a], et tout ce qui est caché, que le Seigneur des Esprits a enfermé[b], te sera révélé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reste un peu » ou « Patiente un peu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a tenu enfermé » ou « a gardé caché ». Le verbe suggère que ces réalités demeurent closes sous l’autorité du Seigneur des Esprits jusqu’à leur révélation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ እንዘ ይብለኒ
  choice: me répondit
  rationale: Le verbe principal exprime une réponse, tandis que la construction avec እንዘ ይብለኒ introduit idiomatiquement les paroles adressées au voyant. En français, « me répondit » suivi du discours direct rend naturellement l’ensemble sans reproduire la redondance sémitique.
- source_word: መልአከ ሰላም
  choice: ange de paix
  rationale: Conserve le titre génitival propre au vocabulaire hénochique, sans le réduire à « ange paisible ».
- source_word: ጽናሕ ንስቲተ
  choice: Attends un peu
  rationale: L’impératif peut signifier rester, patienter ou attendre; avec ንስቲተ, « Attends un peu » exprime clairement la courte attente demandée.
- source_word: ይትከሠት
  choice: te sera révélé
  rationale: Le futur passif appartient au registre de la révélation apocalyptique et indique que ce qui est caché deviendra manifeste au voyant.
- source_word: ኵሉ ዘኅቡእ
  choice: tout ce qui est caché
  rationale: Formulation française naturelle qui préserve la portée exhaustive et indéfinie de l’expression guèze.
- source_word: ዘከለለ
  choice: a enfermé
  rationale: Le verbe évoque ce qui est clos ou tenu à l’intérieur. « A enfermé » conserve cette image plus précisément que des interprétations comme « a réservé ».
- source_word: እግዚአ መናፈስት
  choice: le Seigneur des Esprits
  rationale: Maintient le titre divin distinctif et récurrent des Paraboles d’Hénoch dans une forme française littérale et reconnaissable.
theological_decisions:
- issue: Titre divin እግዚአ መናፈስት
  choice: le Seigneur des Esprits
  alternative: le Seigneur des esprits
  rationale: La majuscule à « Esprits » signale qu’il s’agit d’un titre divin formulaire dans cette section, tout en laissant ouverte l’identité précise des esprits concernés.
- issue: Rapport entre le secret et l’action divine
  choice: tout ce qui est caché, tout ce que le Seigneur des Esprits a enfermé
  alternative: tout ce que le Seigneur des Esprits a gardé caché
  rationale: La traduction conserve à la fois la notion de réalité cachée et l’image d’un enfermement sous l’autorité divine, sans préciser pourquoi ni jusqu’à quand elle est tenue close.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct évite une lourde répétition de type « répondit en me disant ». Le futur passif et le titre « Seigneur des Esprits » maintiennent le registre apocalyptique. Tous les marqueurs de notes figurent dans le texte.
