base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: fr
  text: Et ces montagnes que tes yeux ont vues — la montagne de fer, la montagne de cuivre, la montagne d’argent, la montagne d’or, la montagne de métal tendre[a] et la montagne de plomb — toutes seront devant l’Élu[b] comme de la cire devant le feu et comme de l’eau qui descend d’en haut sur ces montagnes. Elles perdront toute force devant ses pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de ce cinquième métal est incertaine dans le texte éthiopien; on a notamment proposé l’étain ou un autre métal tendre.
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui a été choisi ». Dans les Paraboles, cette expression est employée comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: አድባር
  choice: montagnes
  rationale: Le pluriel désigne les grandes masses montagneuses de la vision et conserve l’ampleur apocalyptique de la scène.
- source_word: ኃጺን
  choice: fer
  rationale: Nom usuel et direct du métal dans cette série.
- source_word: ጸሪቅ
  choice: cuivre
  rationale: Le terme peut désigner le cuivre ou un alliage cuivreux; « cuivre » est ici le choix le plus large et le moins interprétatif.
- source_word: ብሩር
  choice: argent
  rationale: Équivalent français courant du métal précieux.
- source_word: ወርቅ
  choice: or
  rationale: Équivalent français courant du métal précieux.
- source_word: ነጠብጣብ
  choice: métal tendre
  rationale: L’identification exacte du métal est incertaine; cette formulation transparente évite d’imposer « étain » tout en conservant le contraste de la liste.
- source_word: ዐረር
  choice: plomb
  rationale: Identification la mieux étayée dans cette énumération de métaux.
- source_word: ለኅሩይ
  choice: l’Élu
  rationale: L’expression fonctionne comme un titre majeur dans les Paraboles; la majuscule signale cet emploi titulaire sans l’harmoniser avec une terminologie doctrinale ultérieure.
- source_word: መዓረ፡ ግራ፡
  choice: cire
  rationale: Rend naturellement l’image d’une matière qui fond et cède devant le feu.
- source_word: ዘይወርድ፡ እምላዕሉ
  choice: qui descend d’en haut
  rationale: Conserve explicitement le mouvement descendant de l’eau dans une formulation française naturelle.
- source_word: ድኩማነ
  choice: perdront toute force
  rationale: Exprime la perte de force et l’incapacité de résister sans imposer l’idée plus précise d’un effondrement matériel.
theological_decisions:
- issue: Traduction du titre ለኅሩይ dans les Paraboles
  choice: l’Élu
  alternative: celui qui a été choisi
  rationale: « L’Élu » est un titre français naturel et reconnaissable qui préserve la fonction locale de l’expression sans importer une identification théologique absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La longue énumération et les deux comparaisons sont conservées, mais la dernière proposition est formulée idiomatiquement. Le tutoiement correspond au singulier de l’adresse éthiopienne.
