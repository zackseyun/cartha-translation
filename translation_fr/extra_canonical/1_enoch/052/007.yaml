base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: fr
  text: Et en ces jours-là, ils ne seront sauvés ni par l’or ni par l’argent[a], et ils ne pourront pas fuir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ils n’échapperont ni grâce à l’or ni grâce à l’argent ». Le verbe guèze signifie ici être sauf, être sauvé ou échapper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን
  choice: Et
  rationale: La formule introductive « et il arrivera/sera » est intégrée naturellement à la proposition temporelle, sans alourdir le français.
- source_word: በእማንቱ፡ መዋዕል
  choice: en ces jours-là
  rationale: Expression prophétique et apocalyptique courante, naturelle en français et fidèle à la référence à des jours déterminés.
- source_word: ኢይድኅኑ
  choice: ils ne seront sauvés
  rationale: 'Le verbe est au thème simple et possède ici une valeur intransitive ou passive : être sauf, échapper, être sauvé. Cette traduction évite le réfléchi « se sauver », qui suggérerait à tort un sens causatif.'
- source_word: እበወርቅ፡ ወእበብሩር
  choice: ni par l’or ni par l’argent
  rationale: Les prépositions indiquent le moyen; sous la négation, la corrélation française « ni… ni… » rend naturellement la coordination guèze.
- source_word: ወኢይክሉ፡ ጐይየ
  choice: et ils ne pourront pas fuir
  rationale: Rend directement l’incapacité future et conserve l’image concrète de la fuite plutôt que de la remplacer par l’idée plus générale d’échapper.
theological_decisions:
- issue: Nature de la délivrance qui échoue
  choice: Le texte affirme que les personnes visées ne seront pas préservées du jugement au moyen de leurs richesses.
  alternative: « ils ne pourront assurer leur propre salut » ou « ils ne pourront se racheter »
  rationale: Le contexte concerne l’impuissance de l’or et de l’argent devant le jugement. « Être sauvés » respecte la forme verbale sans introduire une doctrine ultérieure du salut ni l’idée non exprimée d’une rançon.
translation_notes:
  register: Français moderne, international et digne, avec une cadence prophétique simple. La répétition de la négation est formulée idiomatiquement sans effacer le parallélisme du texte.
