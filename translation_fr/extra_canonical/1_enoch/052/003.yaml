base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: fr
  text: 'Je demandai à l’ange qui m’accompagnait : « Que sont ces choses que j’ai vues en secret[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu caché », « secrètement » ou « cachées ». L’expression guèze évoque ce qui est caché, mais il n’est pas certain qu’elle décrive le lieu, la manière de voir ou la nature dissimulée des choses vues.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: Je demandai
  rationale: Le verbe signifie demander ou interroger. Le passé simple convient au récit visionnaire écrit dans un registre digne et reste naturel en français littéraire courant.
- source_word: መልአክ
  choice: l’ange
  rationale: Dans ce contexte apocalyptique, il s’agit d’un être céleste accompagnant et interprétant la vision, plutôt que d’un simple messager humain.
- source_word: ዘምስሌየ የሐውር
  choice: qui marchait avec moi
  rationale: La proposition relative désigne l’ange accompagnateur. L’imparfait exprime l’accompagnement en cours, et « marchait avec moi » conserve l’image de déplacement du verbe guèze.
- source_word: እንዘ እብል
  choice: ': « … »'
  rationale: La tournure introduit les paroles prononcées. En français moderne, les deux-points et le discours direct rendent naturellement la fonction de « disant » sans calque pesant.
- source_word: ምንት ውእቱ … እሙንቱ እሉ እለ
  choice: Que sont ces choses
  rationale: Malgré une apparence partiellement singulière, l’ensemble démonstratif et relatif renvoie à plusieurs réalités vues. La formulation française garde cette pluralité sans reproduire l’accumulation guèze.
- source_word: በኅቡእ
  choice: dans le secret
  rationale: L’expression indique la dissimulation ou le caractère caché, mais son rattachement exact demeure incertain. « Dans le secret » préserve cette ambiguïté mieux que « secrètement » ou « dans un lieu caché ».
- source_word: ርኢኩ
  choice: j’ai vues
  rationale: Le passé composé souligne la pertinence immédiate de la vision pour la question posée. L’accord au féminin pluriel suit l’antécédent français « choses ».
theological_decisions:
- issue: Portée de በኅቡእ dans la vision apocalyptique
  choice: dans le secret
  alternative: secrètement ; dans un lieu caché ; cachées
  rationale: Le texte peut décrire le lieu de la vision, la manière de voir ou le caractère dissimulé des réalités contemplées. La traduction ne tranche pas silencieusement entre ces lectures et signale l’incertitude en note.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple soutient le registre visionnaire sans archaïsme marqué. La ponctuation française remplace naturellement le participe introducteur du discours.
