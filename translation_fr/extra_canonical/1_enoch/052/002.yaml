base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: fr
  text: 'Là, mes yeux virent toutes les choses cachées du ciel qui doivent venir[a] : une montagne de fer, une montagne de cuivre, une montagne d’argent, une montagne d’or, une montagne de métal tendre[b] et une montagne de plomb.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition rendue par « qui doivent venir » est difficile. Elle peut aussi se comprendre de manière plus statique : « qui étaient là » ou « qui existent dans le ciel ».'
    reason: alternative_reading
  - marker: b
    text: Le terme désignant le cinquième métal est incertain. Il pourrait s’agir d’un métal tendre ou d’un alliage; certains l’identifient plus précisément à l’étain ou à l’électrum.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Là
  rationale: Adverbe de lieu qui introduit la scène visionnaire; « Là » en conserve simplement la valeur spatiale.
- source_word: ርእዩ አዕይንትየ
  choice: mes yeux virent
  rationale: Le guèze mentionne explicitement les yeux du voyant. Cette formulation maintient l’image vive et le registre visionnaire.
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: toutes les choses cachées du ciel
  rationale: « Choses cachées » rend le sens de réalités dissimulées sans imposer la connotation technique que pourrait prendre « mystères ».
- source_word: ዘይኩን ሀሎ
  choice: qui doivent venir
  rationale: Dans ce contexte apocalyptique, la formulation peut avoir une orientation future et modale. La note conserve toutefois les lectures plus statiques possibles.
- source_word: ደብረ
  choice: une montagne de
  rationale: La répétition de « montagne » est conservée pour respecter le rythme solennel de l’énumération, tout en employant les coordinations naturelles du français.
- source_word: ኃጺን
  choice: fer
  rationale: Équivalent usuel du métal désigné.
- source_word: ጸሪቅ
  choice: cuivre
  rationale: Le terme peut aussi désigner le bronze ou un autre alliage cuivreux; « cuivre » retient le nom du matériau de base sans précision excessive.
- source_word: ብሩር
  choice: argent
  rationale: Équivalent usuel du métal désigné.
- source_word: ወርቅ
  choice: or
  rationale: Équivalent usuel du métal désigné.
- source_word: ነጠብጣብ
  choice: métal tendre
  rationale: L’identification exacte est incertaine. Une désignation non spécifique préserve cette incertitude, tandis que les identifications proposées sont signalées en note.
- source_word: ዐረር
  choice: plomb
  rationale: Équivalent usuel, cohérent avec la série de métaux.
theological_decisions:
- issue: La formule concernant les choses cachées du ciel désigne-t-elle des réalités futures ou des réalités présentes dans le ciel?
  choice: 'Lecture orientée vers l’avenir : « qui doivent venir »'
  alternative: « qui étaient là » ou « qui existent dans le ciel »
  rationale: Le contexte de révélation apocalyptique favorise une orientation future, mais le guèze demeure difficile. La note rend donc visible l’autre possibilité au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’évocation directe de la vision et la répétition de « montagne », caractéristique de l’énumération, sans archaïsmes inutiles.
