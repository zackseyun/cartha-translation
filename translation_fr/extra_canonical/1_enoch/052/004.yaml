base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: fr
  text: 'Et il me dit : « Toutes ces choses que tu as vues relèveront de la domination de son Oint[a], afin qu’il commande et exerce sa puissance sur la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son Messie ». Le terme guèze signifie littéralement « son Oint » et comporte un suffixe possessif masculin singulier.
    reason: lexical_alternative
  - marker: b
    text: « Exerce sa puissance » peut aussi se comprendre comme « soit puissant » ou « l’emporte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Et il me dit
  rationale: Conserve la formule narrative et révélatoire directe du guèze dans un français naturel et digne.
- source_word: እሉ ኵሎሙ ዘርኢከ
  choice: Toutes ces choses que tu as vues
  rationale: Le démonstratif renvoie aux réalités de la vision; « toutes ces choses » en maintient la portée déictique et totalisante.
- source_word: ለስልጣነ
  choice: de la domination de
  rationale: Le nom désigne l’autorité souveraine ou le domaine d’exercice du pouvoir. « Domination » convient au contexte apocalyptique tout en conservant l’abstraction du guèze.
- source_word: መሲሑ
  choice: son Oint
  rationale: Le suffixe masculin singulier -u est rendu par « son », et le titre est traduit plutôt que translittéré.
- source_word: እሙንቱ ይከውኑ
  choice: relèveront de
  rationale: Cette tournure exprime naturellement l’appartenance ou la soumission à une autorité sans imposer l’idée de propriété matérielle.
- source_word: ከመ ይእዝዝ
  choice: afin qu’il commande
  rationale: Rend la valeur finale de ከመ et le sens d’ordonner ou de commander du verbe.
- source_word: ወይትኃየል
  choice: et exerce sa puissance
  rationale: Exprime l’idée de force effective ou de puissance en action, dans un français plus idiomatique que « soit puissant ».
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Traduction directe et naturelle de la relation spatiale, qui peut aussi porter la nuance d’une autorité exercée à l’échelle terrestre.
theological_decisions:
- issue: Valeur possessive de መሲሑ
  choice: son Oint
  alternative: le Messie / l’Oint
  rationale: Le suffixe possessif du guèze doit être conservé. « Son Oint » maintient le lien théologique implicite sans identifier explicitement le référent du possessif.
- issue: Relation des choses vues au pouvoir de l’Oint
  choice: relèveront de la domination de son Oint
  alternative: appartiendront à l’autorité de son Oint / seront pour la domination de son Oint
  rationale: La formulation préserve l’idée de subordination ou d’affectation au règne de l’Oint sans réduire la relation à une propriété matérielle.
- issue: Portée de ይትኃየል
  choice: exerce sa puissance
  alternative: soit puissant / l’emporte
  rationale: Le verbe peut évoquer un état de puissance, son exercice ou la victoire. Le texte principal retient une puissance effective, tandis que la note conserve l’éventail sémantique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond à l’adresse directe du discours visionnaire. « Oint » est conservé comme titre traduit; la majuscule signale son emploi titulaire sans ajouter d’identification confessionnelle.
