base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: fr
  text: Dans les derniers jours, cela deviendra pour eux un spectacle[a] de juste jugement, en présence des justes, pour toujours[b]. Ici, tous les jours, les sages[c] béniront le Seigneur de gloire, le Roi éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « spectacle » peut aussi signifier « signe », « apparition » ou « exemple »; il évoque ici une manifestation visible du jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Les mots traduits par « pour toujours » sont placés entre crochets dans le témoin fourni : leur présence et leur rattachement exact sont donc incertains.'
    reason: textual_variant
  - marker: c
    text: Le terme peut aussi être rendu par « les instruits » ou « les personnes avisées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በዳኃሪ መዋዕል
  choice: Dans les derniers jours
  rationale: Cette expression situe la scène dans un avenir à portée eschatologique. La formulation française conserve le registre apocalyptique sans préciser davantage le moment.
- source_word: አርአያ
  choice: le spectacle
  rationale: Le nom peut désigner ce qui est montré ou vu, mais aussi un signe, une figure ou un exemple. « Spectacle » garde ici la dimension publique et visible du jugement.
- source_word: ኵነኔ ዘበ ጽድቅ
  choice: d’un jugement juste
  rationale: La construction associe étroitement le jugement à la justice. Cette formulation est naturelle en français et ne surcharge pas l’expression d’une interprétation doctrinale.
- source_word: በቅድመ ጻድቃን
  choice: en présence des justes
  rationale: La préposition exprime ici la présence publique devant les justes; « en présence de » rend clairement cette dimension.
- source_word: ለዓለም
  choice: pour toujours
  rationale: C’est le sens idiomatique probable, mais le mot est placé entre crochets dans le témoin fourni; l’incertitude textuelle est donc signalée en note.
- source_word: ኵሎ መዋዕለ ዝየ
  choice: Ici, tous les jours
  rationale: ዝየ est pris dans son sens spatial, « ici ». La formulation française préserve ce repère plutôt que d’introduire la notion non exprimée de « cet âge ».
- source_word: ምሑራን
  choice: ceux qui ont reçu miséricorde
  rationale: La graphie du témoin avec ሐ soutient un rapport avec la miséricorde plutôt qu’avec l’enseignement ou la sagesse. La tournure passive conserve toutefois la possibilité que le terme désigne les bénéficiaires de la miséricorde, et non simplement les personnes miséricordieuses.
- source_word: ለእግዚአ ስብሐት
  choice: le Seigneur de gloire
  rationale: Le titre relie directement la seigneurie à la gloire; cette traduction reste proche de la forme guèze et garde son élévation.
- source_word: ንጉሥ ዘለዓለም
  choice: le Roi éternel
  rationale: Cette expression française naturelle conserve l’affirmation de la royauté et de l’éternité divines.
theological_decisions:
- issue: Rendre les titres divins sans les harmoniser avec une formule canonique ultérieure
  choice: le Seigneur de gloire, le Roi éternel
  alternative: le Seigneur glorieux, le Roi pour toujours
  rationale: Les deux titres sont maintenus distinctement et en apposition, conformément au passage, sans importer une formulation confessionnelle plus développée.
- issue: Identifier les personnes qui bénissent Dieu
  choice: ceux qui ont reçu miséricorde
  alternative: les sages
  rationale: La graphie exacte ምሑራን du témoin fourni favorise la famille lexicale de la miséricorde. La traduction ne remplace donc pas cette donnée par la lecture « les sages », associée à une autre graphie, tout en signalant la difficulté en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le mouvement solennel du texte apocalyptique. « Ici, tous les jours » maintient le repère spatial du guèze malgré une légère étrangeté voulue, et les notes rendent visibles les principales incertitudes textuelles et lexicales.
