    issue: « paroles terribles » pour ዕፁብተ
    rationale: En français actuel, « terribles » évoque d’abord ce qui inspire la peur ou est très grave ; le contexte décrit plutôt une parole dure, choquante ou insolente concernant la gloire du Seigneur. « Paroles choquantes » est plus fidèle sans imposer la catégorie technique de blasphème.
  - severity: low
    issue: « qui se tenait avec moi »
    rationale: Cette formulation peut suggérer une position physique précise qui n’est pas requise par « qui était avec moi ». La seconde est plus naturelle en français international moderne.
