base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: fr
  text: 'À ce moment-là, Uriel, l’un des saints anges qui était avec moi, me répondit et me dit : « Cette vallée maudite est destinée à ceux qui sont maudits à jamais. Ici seront rassemblés tous ceux qui prononcent de leur bouche des paroles inconvenantes[a] contre le Seigneur et qui profèrent des paroles choquantes[b] au sujet de sa gloire. C’est ici qu’on les rassemblera, et c’est ici qu’aura lieu leur jugement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des paroles déplacées » ou « des paroles qui ne conviennent pas ». L’expression guèze désigne des propos qui ne sont ni convenables ni justes.
    reason: lexical_alternative
  - marker: b
    text: Le terme peut qualifier des paroles choquantes, dures ou insolentes au sujet de la gloire du Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: me répondit
  rationale: Le verbe exprime normalement une réponse. Cette formulation conserve le cadre dialogué de la vision.
- source_word: ቅዱሳን መላእክት
  choice: saints anges
  rationale: Expression apocalyptique traditionnelle, claire et naturelle en français biblique moderne.
- source_word: ዛቈላ
  choice: vallée
  rationale: Équivalent topographique général qui convient à la géographie visionnaire sans préciser indûment « ravin » ou « gorge ».
- source_word: ርጉምት
  choice: maudite
  rationale: Le mot présente la vallée comme placée sous la malédiction, dans un registre judiciaire solennel.
- source_word: ለርጉማን እስከ ለዓለም
  choice: destinée à ceux qui sont maudits à jamais
  rationale: Cette formulation française explicite naturellement le rapport entre la vallée et ses occupants tout en conservant la portée durable de la malédiction.
- source_word: ይትጋብኡ
  choice: seront rassemblés
  rationale: Le passif convient au rassemblement eschatologique des coupables en vue du jugement.
- source_word: በአፉሆሙ
  choice: de leur bouche
  rationale: Conserve l’image corporelle explicite du texte source tout en restant idiomatique en français.
- source_word: ላዕለ እግዚአብሔር
  choice: contre le Seigneur
  rationale: Dans ce contexte de paroles hostiles, la préposition a une valeur adversative plutôt que simplement thématique.
- source_word: ቃለ ዘኢይደሉ
  choice: des paroles inconvenantes
  rationale: Rend l’idée de paroles qui ne conviennent pas ou ne sont pas justes, sans réduire l’offense à une catégorie technique précise.
- source_word: ስብሐቲ ዚአሁ
  choice: sa gloire
  rationale: « Gloire » est ici l’équivalent biblique le plus transparent et peut englober majesté, splendeur ou louange.
- source_word: ይትናገሩ ዕፁብተ
  choice: profèrent des paroles terribles
  rationale: « Terribles » garde la force de propos choquants, graves ou insolents; la note signale l’étendue sémantique sans la résoudre abusivement.
- source_word: ያስተጋብእዎሙ
  choice: on les rassemblera
  rationale: La tournure impersonnelle française conserve la valeur causative et active du verbe sans identifier un agent que le texte ne nomme pas clairement.
- source_word: ዝየ ምኵናኒሆሙ
  choice: c’est ici qu’aura lieu leur jugement
  rationale: Rend à la fois l’insistance locative de « ici » et la réalité judiciaire, sans faire nécessairement de la vallée elle-même la condamnation.
theological_decisions:
- issue: Nature de l’offense commise par la parole
  choice: Des paroles inconvenantes contre le Seigneur et terribles au sujet de sa gloire
  alternative: Un blasphème au sens technique
  rationale: Le guèze décrit des propos déplacés, graves ou insolents, mais ne les réduit pas explicitement à une catégorie doctrinale ou juridique ultérieure.
- issue: Sens de la dernière proposition relative au jugement
  choice: La vallée est le lieu où leur jugement aura lieu
  alternative: La vallée constitue elle-même leur condamnation
  rationale: La répétition de « ici » souligne fortement le lieu, tandis que le substantif conserve son sens judiciaire. La traduction maintient ces deux aspects sans les confondre.
- issue: Agent du rassemblement final
  choice: Agent laissé indéterminé par la tournure « on les rassemblera »
  alternative: Dieu ou les anges les rassembleront
  rationale: La forme causative indique que les condamnés sont activement réunis, mais le contexte immédiat ne justifie pas de nommer explicitement l’agent.
translation_notes:
  register: Français international moderne, digne et lisible. Le léger parallélisme (« Ici… C’est ici… ») conserve l’insistance spatiale du texte. Les marqueurs [a] et [b] sont placés sur les expressions qu’ils expliquent, plutôt que sur des noms ou propositions sans rapport.
