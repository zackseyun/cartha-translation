revisions:
- from: Aux jours de leur jugement, ils le béniront pour la miséricorde, selon la part qu’il leur a accordée.[a]
  to: Aux jours de leur jugement, ils le béniront à cause de la miséricorde, selon ce qu’il leur a attribué.[a]
  rationale: La révision conserve la morphologie décisive (« ils le béniront »), l’ambiguïté de « jugement » et le terme « miséricorde ». Elle supprime seulement l’explicitation non nécessaire de l’objet final, que le texte source laisse ouvert et que la note explique.
