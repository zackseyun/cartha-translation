base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: fr
  text: Aux jours de leur jugement, ils le béniront à cause de la miséricorde, selon ce qu’il leur a attribué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon qu’il leur a partagé (ou attribué) ». Le complément de ce verbe n’est pas exprimé ; il peut désigner une part, une mesure de miséricorde ou une bénédiction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕለ
  choice: jours
  rationale: Le pluriel temporel désigne naturellement des « jours » et maintient le repère apocalyptique concret.
- source_word: ኵነኔሆሙ
  choice: leur jugement
  rationale: Le nom évoque une décision ou une procédure judiciaire. « Jugement » préserve cette portée sans la réduire à la condamnation ou au châtiment.
- source_word: ይባርክዎ
  choice: ils le béniront
  rationale: 'La forme porte un sujet à la troisième personne du pluriel et un complément masculin singulier : « ils le béniront », et non « il les bénira ».'
- source_word: በምሕረት
  choice: pour la miséricorde
  rationale: Dans le rapport avec « bénir », la préposition est comprise comme indiquant le motif de la louange. Le nom « miséricorde » conserve le poids théologique du terme sans ajouter de possessif absent du guèze.
- source_word: በከመ
  choice: selon
  rationale: La conjonction introduit une correspondance de mesure ou de manière ; « selon » l’exprime naturellement en français.
- source_word: ከፈሎሙ
  choice: la part qu’il leur a accordée
  rationale: Le verbe signifie partager, répartir ou attribuer. Cette formulation rend l’idée d’une part attribuée tout en signalant en note que l’objet demeure implicite dans le texte source.
theological_decisions:
- issue: Le jugement désigne-t-il nécessairement une condamnation punitive ?
  choice: leur jugement
  alternative: leur condamnation / leur châtiment
  rationale: La bénédiction et la miséricorde qui suivent orientent ici le jugement vers une issue favorable pour ce groupe. Le terme général conserve néanmoins l’image judiciaire sans trancher au-delà du guèze.
- issue: Qui bénit qui ?
  choice: ils le béniront
  alternative: il les bénira avec miséricorde
  rationale: La morphologie de ይባርክዎ indique un sujet pluriel et un objet masculin singulier. Cette lecture respecte la forme verbale et évite de transformer la miséricorde en moyen d’une bénédiction divine.
translation_notes:
  register: Français international moderne, sobre et digne. « Aux jours de » conserve la coloration apocalyptique du texte ; « selon la part » rend intelligible la construction distributive sans effacer l’ellipse du guèze, explicitée en note.
