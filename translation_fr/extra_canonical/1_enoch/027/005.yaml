base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/005.yaml
  text: At that time I blessed the Lord of glory[b][a], and I spoke and sang praise as is fitting for his majesty.
translation:
  language: fr
  text: En ce temps-là, je bénis le Seigneur de gloire ; je proclamai sa gloire[a] et chantai ses louanges, comme il convient à sa majesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La transcription guèze fournie porte ici une forme difficile, ወተሎቱ. La leçon ወስብሐቲሁ, « sa gloire », signalée pour le texte de Charles et corroborée par le grec, donne : « je proclamai sa gloire ». Selon la transcription telle quelle, on pourrait comprendre : « je parlai de lui » ou « je parlai ».'
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: En ce temps-là
  rationale: Expression temporelle courante qui conserve la transition narrative tout en restant naturelle en français moderne.
- source_word: ባረክዎ
  choice: je bénis
  rationale: Le verbe signifie ordinairement « bénir ». Ce choix maintient sa force propre sans le confondre avec le chant de louange qui suit.
- source_word: ለእግዚአ፡ ስብሐት
  choice: le Seigneur de gloire
  rationale: 'Titre divin compact et solennel : እግዚአ désigne le Seigneur ou maître, et ስብሐት la gloire, la splendeur ou la louange.'
- source_word: ወስብሐቲሁ ነገርኩ (lecture corrigée proposée pour ወተሎቱ፡ ነገርኩ)
  choice: je proclamai sa gloire
  rationale: La transcription fournie paraît corrompue à cet endroit. La lecture guèze signalée pour l’édition de Charles, corroborée par le grec τὴν δόξαν αὐτοῦ, donne « sa gloire » comme objet du verbe « déclarer/proclamer ».
- source_word: ዘመርኩ
  choice: chantai ses louanges
  rationale: Le verbe signifie chanter ou psalmodier. Dans ce contexte doxologique, « chanter ses louanges » exprime naturellement la portée du verbe en français.
- source_word: በከመ፡ ይደሉ
  choice: comme il convient
  rationale: Cette tournure exprime ce qui est convenable ou digne ; la formulation choisie est claire et soutenue sans archaïsme.
- source_word: ለዕበዩ
  choice: à sa majesté
  rationale: Le nom évoque la grandeur ou la majesté. « Majesté » convient au registre doxologique et évite de répéter « gloire ».
theological_decisions:
- issue: Traduction du titre divin እግዚአ
  choice: Seigneur
  alternative: Maître
  rationale: Dans une bénédiction adressée à Dieu, « Seigneur » est le titre français le plus naturel et le mieux établi, tandis que « Maître » serait ici moins adapté au registre cultuel.
- issue: Objet du verbe ነገርኩ dans une transcription apparemment fautive
  choice: je proclamai sa gloire
  alternative: je parlai de lui / je parlai
  rationale: La leçon corrigée ወስብሐቲሁ est appuyée par le texte guèze standard signalé et par le témoin grec. La traduction retient cette lecture sans dissimuler l’état problématique de la transcription fournie.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit littéraire bref. Le parallélisme doxologique est conservé, et la difficulté textuelle est explicitement signalée plutôt que résolue silencieusement.
