base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: fr
  text: 'À ce moment-là, je dis : « Pourquoi cette terre bénie, tout entière couverte d’arbres[a], et cette vallée maudite en leur milieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La séquence guèze qui décrit la végétation est difficile; elle peut aussi se comprendre : « entièrement remplie d’arbres et de végétation ».'
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: À ce moment-là
  rationale: Rend naturellement la formule temporelle narrative tout en conservant le registre solennel de la vision.
- source_word: እቤ
  choice: je dis
  rationale: Reste proche de la formule guèze introduisant la parole d’Hénoch; la forme interrogative de la citation suffit à signaler qu’il pose une question.
- source_word: በእንተ፡ ምንት
  choice: Pourquoi
  rationale: Exprime clairement et sans lourdeur la demande de cause ou de raison.
- source_word: ዛቲ፡ ምድር፡ ቡርክት
  choice: cette terre est-elle bénie
  rationale: « Terre » convient au paysage local de la vision, et « bénie » préserve la qualification religieuse opposée à « maudite ».
- source_word: ወኵለንታሃ፡ ምልእት፡ ዕፀወ፡ ወዛ፡ ቈላ
  choice: toute couverte d’arbres
  rationale: Restitue l’idée d’une terre entièrement remplie de végétation arborée dans un français idiomatique, sans préciser outre mesure une séquence textuellement difficile.
- source_word: ርጉምት
  choice: maudite
  rationale: Conserve le contraste moral et sacré avec « bénie » ainsi que la tonalité judiciaire du passage.
- source_word: ማእከሎሙ
  choice: au milieu d’eux
  rationale: Préserve le pluriel du suffixe guèze et l’ambiguïté de son référent, plutôt que de l’identifier silencieusement à la terre environnante.
theological_decisions:
- issue: Contraste axiologique entre la terre environnante et la vallée
  choice: bénie / maudite
  alternative: fertile / stérile
  rationale: Le texte présente un contraste religieux et judiciaire, pas seulement agricole; ces termes maintiennent donc la tension apocalyptique.
- issue: Relation syntaxique entre la terre bénie et la vallée maudite
  choice: tandis que
  alternative: et
  rationale: « Tandis que » rend en français naturel le contraste implicite entre les deux éléments sans expliquer la raison de leur opposition.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe de la question a été rendue idiomatique, tout en conservant le contraste « bénie / maudite » et l’ambiguïté du pluriel dans « au milieu d’eux ».
