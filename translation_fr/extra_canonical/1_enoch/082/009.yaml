base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: fr
  text: Et voici l’ordre des étoiles, celles qui se couchent à leurs emplacements[a], en leurs temps, lors de leurs fêtes[b] et au cours de leurs mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à leurs stations » : le guèze peut désigner les positions assignées aux étoiles dans leur parcours ordonné.'
    reason: lexical_alternative
  - marker: b
    text: L’expression renvoie aux dates des fêtes dans le calendrier ; elle ne signifie pas que les étoiles célèbrent elles-mêmes ces fêtes.
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  choice: ordre
  rationale: Dans le Livre astronomique, le terme désigne l’organisation régulière ou prescrite des mouvements célestes. « Ordre » en conserve à la fois la structure et la régularité.
- source_word: ከዋክብት
  choice: étoiles
  rationale: Le terme guèze désigne concrètement les étoiles ; une expression plus générale comme « corps célestes » en élargirait inutilement le sens.
- source_word: የዐርቡ
  choice: se couchent
  rationale: Dans ce contexte astronomique, le verbe évoque l’entrée ou la descente des étoiles à l’horizon ; « se coucher » est l’expression française naturelle.
- source_word: በመካናቲሆሙ
  choice: à leurs emplacements
  rationale: Le pluriel muni du suffixe possessif renvoie aux lieux ou positions assignés aux étoiles. « Emplacements » exprime cette localisation dans un ordre établi.
- source_word: በአዝማኒሆሙ
  choice: en leurs temps
  rationale: Le mot désigne des temps ou périodes, possiblement fixés. La formulation reste proche du texte sans expliciter ce qui demeure implicite.
- source_word: በበዓላቲሆሙ
  choice: lors de leurs fêtes
  rationale: Le substantif désigne habituellement des fêtes ou solennités. La tournure française situe les étoiles dans le calendrier des fêtes sans suggérer qu’elles les célèbrent elles-mêmes.
- source_word: በአውራኂሆሙ
  choice: au cours de leurs mois
  rationale: Le terme signifie « mois ». Cette traduction simple préserve le référent calendaire sans ajouter l’idée de mois lunaires, absente du verset.
theological_decisions:
- issue: Faut-il neutraliser le vocabulaire calendaire cultuel ?
  choice: Conserver « fêtes » avec « temps » et « mois »
  alternative: Uniformiser par des termes génériques tels que « saisons » ou « périodes »
  rationale: Le passage associe l’ordre céleste au calcul du temps sacré. Garder « fêtes » préserve cette dimension cultuelle et calendaire sans la développer au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée du guèze est légèrement assouplie en français, tandis que la succession des repères — emplacements, temps, fêtes et mois — est conservée.
