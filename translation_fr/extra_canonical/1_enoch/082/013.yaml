base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: fr
  text: 'Voici les noms des chefs qui divisent les quatre parties de l’année[a] et qui sont désignés : Milkiel, Helemmelek, Meleyal[b] et Narel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les quatre divisions de l’année » ; l’expression guèze signifie littéralement « les quatre parties de l’année ».
    reason: lexical_alternative
  - marker: b
    text: Dans le témoin disponible, les formes des deuxième et troisième noms sont difficiles. Elles sont ici translittérées prudemment, sans être remplacées par des graphies reconstruites plus familières.
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: les noms
  rationale: Le possessif guèze est naturellement intégré à la formule française « Voici les noms de… ».
- source_word: መራሕያያን
  choice: chefs
  rationale: Le terme désigne ceux qui conduisent ou dirigent. « Chefs » exprime ici leur autorité sans préciser abusivement leur rang ou leur nature.
- source_word: ይፈልጡ
  choice: divisent
  rationale: Le verbe signifie séparer ou partager et convient directement aux divisions calendaires de l’année.
- source_word: ፬መክፈልተ ዓመት
  choice: les quatre parties de l’année
  rationale: Traduction proche du guèze, qui conserve la formulation concrète et évite l’interprétation plus spécifique « trimestres ».
- source_word: ሥሩዓን
  choice: établis
  rationale: Le terme évoque des êtres disposés, assignés ou institués dans une fonction. « Établis » convient au cadre cosmique et reste moins administratif que « nommés ».
- source_word: ሚልኪኤል
  choice: Milkiel
  rationale: Translittération prudente de la forme guèze, sans reconstruction d’un nom sémitique normalisé.
- source_word: ህልእምሜሌክ
  choice: Helemmelek
  rationale: Translittération conservatrice du témoin fourni, dont la forme est incertaine.
- source_word: ሜሌአየል
  choice: Meleyal
  rationale: Translittération lisible et proche de la forme guèze, malgré l’incertitude touchant la séquence vocalique médiane.
- source_word: ናሬል
  choice: Narel
  rationale: Translittération simple de la forme guèze.
theological_decisions:
- issue: Nature des personnages nommés
  choice: des chefs chargés des divisions calendaires
  alternative: des marqueurs astronomiques personnifiés ou des chefs angéliques des saisons
  rationale: « Chefs » préserve la représentation de responsables cosmiques propre au contexte sans imposer une angélologie plus précise que le verset.
translation_notes:
  register: Français moderne, international et digne. La tournure présentative « Voici les noms » est naturelle ; « chefs établis » garde le caractère solennel et cosmique du passage sans surinterprétation.
