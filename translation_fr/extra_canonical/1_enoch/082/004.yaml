base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: fr
  text: Heureux sont tous les justes qui marchent sur le chemin de la justice et qui n’ont pas de péché comme les pécheurs, tout au long du décompte de tous leurs jours, tandis que le soleil poursuit sa course dans le ciel, entrant et sortant par les portes pendant trente jours, avec les chefs des milliers de l’ordre des étoiles[b], ainsi qu’avec les quatre qui s’ajoutent[a]. Ceux-ci divisent les quatre parties de l’année, les conduisent et entrent avec eux pendant quatre jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transcrit porte ici un chiffre qui semble signifier « dix », mais cette lecture s’accorde mal avec les quatre parties de l’année et les quatre jours mentionnés ensuite. Le sens traditionnel « les quatre qui s’ajoutent » est donc retenu.
    reason: textual_variant
  - marker: b
    text: 'La construction guèze est difficile. On pourrait aussi comprendre : « les chefs des milliers appartenant à l’ordre des étoiles ». La traduction conserve le langage numérique et hiérarchique du texte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: Heureux
  rationale: Conserve la forme d’une béatitude dans un français biblique actuel et naturel; « bienheureux » serait plus marqué et moins courant.
- source_word: ጻድቃን
  choice: les justes
  rationale: Rend le terme éthique et théologique traditionnel sans introduire une nuance confessionnelle particulière.
- source_word: የሐውሩ / የኀውር
  choice: marchent / poursuit sa course
  rationale: « Marchent » préserve la métaphore morale appliquée aux justes; pour le soleil, « poursuit sa course » garde l’écho du mouvement tout en restant idiomatique.
- source_word: በፍኖተ ጽድቅ
  choice: sur le chemin de la justice
  rationale: Expression française naturelle qui maintient l’image source du cheminement moral.
- source_word: አልቦሙ ኃጢአት ከመ ኃጥኣን
  choice: n’ont pas de péché comme les pécheurs
  rationale: Maintient à la fois l’affirmation forte du texte et la comparaison explicite, sans trancher la portée exacte de l’absence de péché.
- source_word: በኍልቈ ኵሉ መዋዕሊሆሙ
  choice: durant le compte total de tous leurs jours
  rationale: Préserve le vocabulaire de dénombrement propre au cadre calendérique de cette section, malgré une tournure volontairement plus technique.
- source_word: ለዘ የኀውር ፀሐይ በሰማይ
  choice: tandis que le soleil poursuit sa course dans le ciel
  rationale: Relie clairement l’exhortation éthique au calendrier cosmique et conserve l’idée d’un mouvement ordonné.
- source_word: በአናቅጽ ይበውእ ወይወጽእ
  choice: entrant et sortant par les portes
  rationale: Conserve l’image cosmologique des portes empruntées par le soleil.
- source_word: አርእስተ ፲፻ዘሥርዓቶሙ ለከዋክብት
  choice: les chefs des milliers de l’ordre des étoiles
  rationale: Maintient l’imagerie hiérarchique, le nombre pluriel « milliers » et le singulier « ordre », sans lisser une construction guèze difficile.
- source_word: ምስለ ፲ እለ ይትዌሰኩ
  choice: avec les quatre qui s’ajoutent
  rationale: Le texte transmis affiche un chiffre problématique, mais le contexte immédiat des quatre divisions et des quatre jours favorise la lecture traditionnelle de quatre unités intercalaires; l’incertitude est signalée en note.
theological_decisions:
- issue: Le texte affirme-t-il l’absence absolue de tout péché chez les justes ?
  choice: Conserver l’énoncé fort « n’ont pas de péché comme les pécheurs ».
  alternative: Comprendre qu’ils ne vivent pas dans le péché à la manière des pécheurs, ou y voir une affirmation de perfection complète.
  rationale: Le guèze formule une absence de péché tout en ajoutant une comparaison avec les pécheurs. La traduction préserve cette tension sans l’expliquer selon un système doctrinal ultérieur.
- issue: Identité des unités ajoutées au calendrier
  choice: Comprendre quatre unités intercalaires qui marquent les quatre parties de l’année, sans ajouter « jours » à leur première mention.
  alternative: Lire littéralement le chiffre dix du témoin transcrit, ou comprendre des responsables stellaires supplémentaires.
  rationale: Le contexte calendérique et la mention finale de quatre jours soutiennent la lecture « quatre », mais l’état du texte exige que l’incertitude demeure visible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase et son vocabulaire de dénombrement sont en partie conservés afin de refléter le style technique du Livre astronomique. Une nouvelle phrase avant « Ceux-ci » allège la syntaxe française, tout en laissant subsister l’ambiguïté des pronoms du texte source.
