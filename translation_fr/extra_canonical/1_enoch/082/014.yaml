base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: fr
  text: Les noms de ceux qui les dirigent sont Adnarel, Iyasusael et Elomeel. Ces trois suivent les chefs des ordres, et il en est un qui suit les trois chefs des ordres[a]. Ceux-ci suivent tous les chefs des stations fixes, qui divisent l’année en quatre parties[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription fournie porte ici « deux » et, un peu plus loin, « soixante-dix » ; l’édition imprimée de Charles (1906) lit toutefois « un » et « trois ». La traduction suit cette leçon corrigée.
    reason: textual_variant
  - marker: b
    text: 'La syntaxe des propositions centrales est difficile : le texte répète l’idée de « suivre » et mentionne plusieurs groupes de chefs. La traduction en conserve l’enchaînement sans imposer une hiérarchie entièrement résolue.'
    reason: textual_variant
  - marker: c
    text: 'Autre traduction possible : « qui distinguent les quatre divisions de l’année ». Il s’agit du partage calendaire de l’année dans le Livre astronomique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመርሃዎሙ
  choice: les dirigent
  rationale: Le verbe exprime l’action de conduire ou de guider. « Dirigent » convient au contexte d’un mouvement céleste ordonné sans réduire le rôle à un simple enseignement.
- source_word: ይተልዉ
  choice: viennent après
  rationale: Cette formulation naturelle conserve l’idée répétée de succession dans une procession ou une hiérarchie ordonnée.
- source_word: መራሕያነ
  choice: chefs
  rationale: Le terme désigne ceux qui conduisent. « Chefs » garde ici la nuance hiérarchique et administrative.
- source_word: ሥርዓታት
  choice: ordres
  rationale: Dans le Livre astronomique, le mot évoque des arrangements structurés ou des systèmes ordonnés. « Ordres » préserve cette portée cosmique sans précision excessive.
- source_word: ምቅዋማት
  choice: stations fixes
  rationale: Le substantif évoque des lieux où l’on se tient ou des positions établies; « stations fixes » restitue cette image dans le contexte astronomique.
- source_word: ይፈልጡ
  choice: divisent
  rationale: Le verbe peut signifier séparer, distinguer ou répartir. Avec l’année pour objet, « divisent » exprime clairement le partage calendaire.
- source_word: አርባዕተ ክፍለ ለዓመት
  choice: l’année en quatre parties
  rationale: Cette expression transparente rend le sens littéral sans imposer le terme moderne « trimestres ».
theological_decisions:
- issue: Nature des êtres nommés
  choice: Les noms sont translittérés comme des noms propres de responsables célestes.
  alternative: Traduire les noms comme des épithètes descriptives ou corriger leurs formes par conjecture.
  rationale: Le passage présente ces formes comme des noms personnels dans une organisation cosmique; les translittérer évite d’importer une interprétation doctrinale.
- issue: Référents des propositions relatives
  choice: La traduction conserve « Ceux-ci » et « qui » sans résoudre entièrement la chaîne des antécédents.
  alternative: Réorganiser les groupes en une hiérarchie explicite et attribuer chaque proposition à un groupe précis.
  rationale: La syntaxe guèze est difficile et enchaîne plusieurs groupes de chefs avec le même verbe de succession. Une résolution ferme dépasserait les données du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes du guèze sont maintenues autant que le permet un français naturel; les noms propres sont translittérés et l’ambiguïté syntaxique du passage n’est pas artificiellement éliminée.
