base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: fr
  text: 'Voici les noms de ceux qui les dirigent : ceux qui veillent et entrent à leurs temps, ceux qui les dirigent dans leurs stations, leurs ordres, leurs temps, leurs mois, leurs autorités et leurs positions.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: les dirigent
  rationale: Le verbe exprime l’action de conduire ou diriger; cette formulation naturelle conserve l’idée de gouvernement des corps célestes.
- source_word: የዐቅቡ
  choice: veillent
  rationale: Rend le sens de garder, surveiller ou observer sans préciser indûment l’objet de cette vigilance.
- source_word: ይበውኡ
  choice: entrent
  rationale: Traduction directe du mouvement d’entrée; l’image spatiale du texte est conservée plutôt que paraphrasée.
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: aux temps qui leur sont assignés
  rationale: Le possessif signifie littéralement « leurs temps »; « assignés » explicite sobrement qu’il s’agit des périodes propres à chacun dans l’ordre céleste.
- source_word: በመካናቲሆሙ
  choice: selon leurs postes
  rationale: Le terme désigne des lieux ou emplacements; « postes » convient ici à des positions fonctionnelles dans un ordre organisé.
- source_word: በሥርዓታቲሆሙ
  choice: leurs ordres
  rationale: Conserve la notion d’arrangements, de rangs ou d’ordonnances sans réduire le terme à une seule interprétation.
- source_word: በስልጣናቲሆሙ
  choice: leurs autorités
  rationale: Équivalent formel du terme indiquant puissance, autorité ou domaine de gouvernement; l’ambiguïté reste perceptible.
- source_word: በምቅዋማቲሆሙ
  choice: leurs positions
  rationale: Rend les places où ils se tiennent ou leurs stations, tout en évitant de répéter « postes ».
theological_decisions:
- issue: Nature des êtres qui dirigent les cycles célestes
  choice: Maintenir les pronoms et le vocabulaire fonctionnel sans identifier davantage ces êtres.
  alternative: Les qualifier explicitement d’anges ou de chefs angéliques.
  rationale: Le verset fourni ne les nomme pas explicitement; une identification doctrinale dépasserait les données immédiates du texte.
- issue: Sens des « autorités »
  choice: Conserver « autorités » au pluriel.
  alternative: Traduire par « domaines », « pouvoirs » ou « périodes de domination ».
  rationale: Le terme peut évoquer pouvoir, juridiction ou autorité; la traduction retenue préserve cette tension sémantique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération et ses parallélismes sont conservés afin de refléter la structure administrative et cosmologique du guèze.
