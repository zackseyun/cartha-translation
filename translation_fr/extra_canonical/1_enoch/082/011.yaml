base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: fr
  text: 'Leurs quatre chefs entrent les premiers : ce sont eux qui divisent les quatre parties de l’année[a] ; après eux, les douze chefs des ordres, qui divisent les mois ; puis les trois cent soixante-quatre chefs de milliers[b], qui distinguent les jours[c], ainsi que les quatre qui leur sont adjoints : les chefs qui distinguent les quatre divisions des années[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les quatre divisions de l’année », voire « les quatre trimestres ». Le guèze dit littéralement « les quatre parties de l’année ».
    reason: lexical_alternative
  - marker: b
    text: Le nombre trois cent soixante-quatre correspond au calendrier schématique de 364 jours exposé dans le Livre des luminaires. L’expression « chefs de milliers » est textuellement difficile.
    reason: cultural_note
  - marker: c
    text: Ou « qui délimitent les jours » ou « qui déterminent les jours ».
    reason: lexical_alternative
  - marker: d
    text: 'La syntaxe de la fin du verset est incertaine. On pourrait aussi comprendre : « ceux qui distinguent les chefs des quatre divisions de l’année ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: መራሕያኒሆሙ / መራሕያን
  choice: leurs chefs / les chefs
  rationale: Le terme désigne ceux qui conduisent ou dirigent. « Chefs » convient à la hiérarchie cosmique et administrative du passage, sans préciser qu’il s’agit d’anges.
- source_word: ይበውኡ ቀዳሚ
  choice: entrent les premiers
  rationale: Rend directement le mouvement d’entrée et l’ordre de succession exprimés par le guèze.
- source_word: ይሌልዩ
  choice: divisent
  rationale: Dans ce contexte calendaire, le verbe décrit la répartition de l’année et des mois en unités distinctes.
- source_word: ፬ ክፍለ ዓመት
  choice: les quatre parties de l’année
  rationale: Traduction proche de la formulation guèze, qui évite d’imposer dans le texte le terme interprétatif « trimestres ».
- source_word: ዘሥርዓታት
  choice: des ordres
  rationale: Conserve l’idée d’un agencement réglé ou d’une succession prescrite, sans la réduire à de simples parcours astronomiques.
- source_word: ፲፻ወ፷፬ አርእስት ፲፻
  choice: les trois cent soixante-quatre chefs de milliers
  rationale: « Chefs » rend ici la métaphore littérale des « têtes » dans une construction hiérarchique; « de milliers » est conservé d’après la lecture transmise du texte.
- source_word: ይፈልጥዎሙ ለመዋዕል
  choice: distinguent les jours
  rationale: Le verbe peut exprimer l’action de reconnaître, démarquer ou déterminer. « Distinguent » préserve cette amplitude dans le cadre calendaire.
- source_word: ይትዌሰኩ ምስሌሆሙ
  choice: qui leur sont adjoints
  rationale: Exprime naturellement en français l’ajout d’un groupe supplémentaire aux responsables déjà mentionnés.
- source_word: ፬ መክፈልተ ዓመታት
  choice: les quatre divisions des années
  rationale: Conserve le pluriel du guèze et le vocabulaire de la partition calendaire, malgré la possibilité idiomatique du singulier en français.
theological_decisions:
- issue: Nature des figures célestes mentionnées
  choice: Les désigner comme des « chefs » sans les identifier explicitement à des anges.
  alternative: Les appeler directement des anges, ou les réduire à de simples repères calendaires abstraits.
  rationale: Le verset leur attribue des fonctions hiérarchiques liées à l’année, aux mois et aux jours, mais ne définit pas explicitement leur nature. La traduction maintient cette indétermination.
- issue: Syntaxe de la dernière proposition
  choice: Comprendre les quatre êtres ajoutés comme « les chefs qui distinguent les quatre divisions des années ».
  alternative: Comprendre qu’ils « distinguent les chefs des quatre divisions de l’année ».
  rationale: La syntaxe guèze est difficile et la tradition textuelle présente des irrégularités. La lecture retenue maintient le parallélisme avec les chefs mentionnés au début et suit la lecture contextuellement la plus cohérente, tandis que l’autre analyse est signalée en note.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La cadence énumérative et la hiérarchie du texte apocalyptique sont conservées. Les termes « chefs », « ordres », « parties » et « divisions » maintiennent le caractère concret et administratif de la cosmologie sans ajouter d’identification confessionnelle.
