base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: fr
  text: Le deuxième chef après lui est Helemmelek[a] ; ils l’appellent « Soleil »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom guèze Helemmelek est translittéré ; sa vocalisation exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le guèze emploie un verbe actif au pluriel (« ils l’appellent ») et mentionne explicitement « son nom » ; la traduction française rend la formule de manière idiomatique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: le deuxième
  rationale: Dans cette énumération ordonnée, le terme a une valeur ordinale plutôt que le sens indéfini d’« un autre ».
- source_word: መራሒ
  choice: chef
  rationale: Le mot désigne celui qui conduit ou gouverne une course céleste ; « chef » conserve ici l’idée d’autorité sans préciser excessivement le rang.
- source_word: ዘድኅሬሁ
  choice: qui vient après lui
  rationale: Cette formulation française naturelle exprime la succession indiquée par le syntagme relatif.
- source_word: ሄልእምሜሌክ
  choice: Helemmelek
  rationale: Le nom propre est translittéré plutôt que traduit. Cette graphie suit la forme harmonisée du projet, même si la vocalisation exacte du guèze demeure incertaine.
- source_word: ዘይጼውዕዎ ስሞ
  choice: ils lui donnent le nom de
  rationale: La formulation garde le sujet pluriel actif du verbe et rend explicitement la mention du nom, tout en évitant une tournure française artificielle comme « ils appellent son nom ».
- source_word: ፀሐየ
  choice: Soleil
  rationale: La majuscule convient au nom de l’astre en français et souligne qu’il s’agit ici d’une désignation dans l’ordre cosmique, sans imposer une personnification théologique.
theological_decisions:
- issue: Faut-il comprendre la désignation finale comme un simple nom commun ou comme le nom de l’astre ?
  choice: « Soleil »
  alternative: « soleil »
  rationale: Le passage catalogue les chefs et les luminaires d’un ordre cosmique structuré. La majuscule française signale le nom de l’astre sans lui attribuer une nature divine ni importer une doctrine ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. « Qui vient après lui » clarifie la succession ; « ils lui donnent le nom de » conserve l’action du sujet pluriel et la formule de dénomination dans une syntaxe française naturelle.
