base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: fr
  text: Et maintenant, mon fils Mathusalem, je te dis toutes ces choses et je les mets par écrit pour toi. Je te les ai toutes révélées et je t’ai donné les livres qui les concernent. Garde, mon fils, le livre de la main de ton père[a], afin que tu le transmettes aux générations du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le livre de la main de ton père »; l’expression peut désigner le livre reçu directement de la main du père.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « à toutes les générations pour toujours » ou « aux générations de l’éternité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Rend naturellement la formule de transition du discours tout en conservant son caractère direct et exhortatif.
- source_word: ወልድየ፡ ማቱሳላ
  choice: mon fils Mathusalem
  rationale: Conserve l’adresse paternelle et emploie la forme française traditionnelle et reconnaissable du nom.
- source_word: ኵሎሙ፡ እሉንተ
  choice: toutes ces choses
  rationale: Exprime la totalité des réalités exposées auparavant sans en préciser indûment la nature.
- source_word: ለከ፡ እነግር፡ ወእጽሕፍ፡ ለከ
  choice: je te dis toutes ces choses et je les mets par écrit pour toi
  rationale: Distingue clairement la communication orale de sa consignation écrite, dans un français courant.
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: Je te les ai toutes révélées
  rationale: Le verbe exprime le dévoilement ou la mise au jour; « révélées » convient au cadre apocalyptique sans ajout doctrinal.
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: je t’ai donné les livres qui les concernent
  rationale: Rend de façon idiomatique la tournure guèze compacte et le possessif, compris comme les livres correspondant à toutes ces choses.
- source_word: ዕቀብ
  choice: Garde
  rationale: Conserve la brièveté de l’impératif et permet à la fois les sens de garder et de préserver.
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: le livre écrit de la main de ton père
  rationale: Reproduit l’image de la « main du père » dans une expression française intelligible, tout en laissant ouverte la nuance de provenance ou d’autographie.
- source_word: ወከመ፡ ትሀብ
  choice: afin que tu le transmettes
  rationale: La construction avec ከመ et le subjonctif introduit un but. « Transmettes » explicite naturellement la remise du livre aux générations suivantes.
- source_word: ለትውልደ፡ ዓለም
  choice: aux générations du monde
  rationale: Préserve le langage littéral du monde ou de l’âge sans réduire l’expression au seul sens temporel de « pour toujours ».
theological_decisions:
- issue: Portée de ለትውልደ፡ ዓለም
  choice: aux générations du monde
  alternative: à toutes les générations pour toujours; aux générations de l’éternité
  rationale: L’expression peut viser les générations appartenant au monde ou les générations qui se succèdent durablement. Le texte principal conserve cette tension, et la note signale les lectures temporelles possibles.
- issue: Nature du « livre de la main de ton père »
  choice: le livre écrit de la main de ton père
  alternative: le livre reçu de la main de ton père; le livre de la main de ton père
  rationale: La formule peut évoquer l’écriture par le père ou la transmission directe venant de lui. La traduction garde l’image de la main, tandis que la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition paternelle (« mon fils ») et le mouvement de l’oral vers l’écrit sont conservés. Les ambiguïtés relatives à la main du père et à la durée ou à la portée des générations sont signalées sans être tranchées.
