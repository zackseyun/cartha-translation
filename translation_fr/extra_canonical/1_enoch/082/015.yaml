base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: fr
  text: Au début de l’année, Melkiyal se lève le premier et exerce son autorité; il est appelé Tam’ade’eni et « le Soleil »[a]. Tous les jours où s’étend son autorité, pendant qu’il gouverne, sont au nombre de quatre-vingt-onze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition de dénomination est difficile. Tam’ade’eni, probablement un nom ou un terme technique, est translittéré sans traduction conjecturale. Le texte paraît aussi donner à Melkiyal la désignation « le Soleil ».
    reason: textual_variant
  - marker: b
    text: Le texte personnifie cette première période de l’année comme un temps placé sous l’autorité de Melkiyal; elle compte quatre-vingt-onze jours.
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ፡ ዓመት
  choice: Au début de l’année
  rationale: Le syntagme a ici un sens temporel et introduit la première période du cycle annuel.
- source_word: ቀዳማዊ፡ ይሠርቅ
  choice: se lève le premier
  rationale: L’ordinal est compris adverbialement avec le verbe de lever, conformément à la syntaxe retenue lors de la révision du texte.
- source_word: ወይመልክ
  choice: et exerce son autorité
  rationale: Cette formulation conserve l’idée d’un gouvernement cosmique sans donner au verbe une coloration monarchique excessive.
- source_word: ምልኪያል
  choice: Melkiyal
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: ዘይሠመይ፡ ስሞ
  choice: Son nom est appelé
  rationale: La tournure garde la formule explicite de dénomination du guèze, malgré son caractère moins idiomatique en français.
- source_word: ተመአደኒ
  choice: Tam’ade’eni
  rationale: Ce terme obscur, vraisemblablement un nom propre ou une désignation technique, est translittéré afin d’éviter une traduction conjecturale.
- source_word: ወፀሐይ
  choice: et « le Soleil »
  rationale: Le syntagme est maintenu dans la proposition de dénomination, en accord avec sa syntaxe et le parallèle du chapitre, plutôt que rattaché au décompte des jours.
- source_word: ኵሎሙ፡ መዋዕለ፡ ዘበስልጣኑ፡ ዚአሁ
  choice: Tous les jours où s’étend son autorité
  rationale: La formulation française exprime naturellement l’ensemble des jours relevant de son domaine d’autorité.
- source_word: እለ፡ ይመልክ
  choice: pendant qu’il gouverne
  rationale: La relative précise la durée de l’exercice de l’autorité tout en conservant la répétition conceptuelle du texte.
- source_word: ፺ወ፩ዕለት
  choice: au nombre de quatre-vingt-onze
  rationale: Le nombre total de jours est rendu explicitement et selon l’usage français international.
theological_decisions:
- issue: Personnification de l’ordre calendaire
  choice: Conserver le vocabulaire d’autorité et de gouvernement appliqué à Melkiyal.
  alternative: Réduire Melkiyal à un simple repère de calendrier ou dire qu’il « marque » la saison.
  rationale: Le passage présente l’ordre cosmique sous la forme d’une autorité exercée par un être nommé. Cette image apocalyptique doit être préservée sans développer une angélologie étrangère au verset.
- issue: Rapport entre Tam’ade’eni et « le Soleil »
  choice: Traiter les deux expressions comme des noms ou désignations associés à Melkiyal.
  alternative: Faire du soleil le sujet du décompte des quatre-vingt-onze jours.
  rationale: La continuité de la proposition de dénomination et le parallèle interne favorisent ce rattachement; l’autre ponctuation produirait en outre une construction incohérente.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement dépliée en deux phrases pour rester intelligible, tout en conservant la formule de dénomination, le caractère technique du passage et sa personnification de l’ordre cosmique.
