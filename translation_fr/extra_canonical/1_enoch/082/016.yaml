revisions:
- from: 'Et voici les signes des jours qui apparaissent sur la terre au temps de sa domination[a] : la sueur, la chaleur et le calme[b] ; tous les arbres portent du fruit, des feuilles poussent sur tous les arbres, vient la moisson du blé, puis la floraison de la rose[c] et de toutes les fleurs qui poussent dans les champs[d] ; mais les arbres d’hiver se dessèchent.'
  to: 'Et voici les signes des jours qui se manifestent[a] sur la terre au temps de sa domination[b] : la sueur, la chaleur et le calme[c] ; tous les arbres portent du fruit, des feuilles poussent sur tous les arbres, ainsi que la moisson du blé, la floraison de la rose[d] et toute fleur qui pousse dans les champs[e] ; mais les arbres d’hiver se dessèchent.'
  rationale: 'La révision déplace la relative afin que les signes, plutôt que les jours, soient ce qui se manifeste sur la terre. Elle sépare la note sur ce verbe de celle portant sur le possessif implicite. Elle rétablit également l’énumération botanique : la floraison de la rose est un élément distinct de toute fleur qui pousse dans les champs. Aucun référent cosmologique ni aucune identification botanique non assurée n’est imposé.'
