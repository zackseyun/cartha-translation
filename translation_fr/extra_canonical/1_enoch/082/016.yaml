base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: fr
  text: 'Et voici les signes des jours qui se manifestent[a] sur la terre au temps de sa domination[b] : la sueur, la chaleur et le calme[c] ; tous les arbres portent du fruit, des feuilles poussent sur tous les arbres, ainsi que la moisson du blé, la floraison de la rose[d] et toute fleur qui pousse dans les champs[e] ; mais les arbres d’hiver se dessèchent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe a le sens de « montrer » ou « manifester » ; on pourrait aussi traduire : « Voici les signes des jours qui sont montrés sur la terre ».'
    reason: alternative lexicale et syntaxique
  - marker: b
    text: Le possessif renvoie vraisemblablement au luminaire dont il est question dans le contexte, sans que celui-ci soit nommé dans ce verset.
    reason: référent implicite
  - marker: c
    text: Le dernier terme est incertain ; il peut désigner une condition climatique douce, agréable ou paisible.
    reason: alternative lexicale
  - marker: d
    text: L’identification comme « rose » est traditionnelle ; il pourrait s’agir plus généralement d’une plante à fleurs.
    reason: identification botanique incertaine
  - marker: e
    text: Le mot traduit par « champs » peut aussi désigner la campagne ouverte ou une région sauvage.
    reason: alternative lexicale
lexical_decisions:
- source_word: ትእምርተ
  choice: signes
  rationale: Le nom désigne des indices observables. « Signes » convient au contexte astronomique et calendaire.
- source_word: መዋዕለ
  choice: jours
  rationale: Le sens littéral est « jours », même si le contexte évoque des périodes saisonnières.
- source_word: ያስተርእዩ
  choice: apparaissent
  rationale: Le verbe relève du champ de la manifestation ou de ce qui est montré ; « apparaissent » donne un français naturel tout en conservant le caractère observable des phénomènes.
- source_word: ስልጣኑ
  choice: sa domination
  rationale: Le nom exprime l’autorité ou l’exercice du pouvoir. « Domination » maintient le registre cosmologique sans préciser le référent du possessif.
- source_word: ሀፍ
  choice: sueur
  rationale: Le terme peut désigner concrètement la sueur, signe visible de la saison chaude. Cette traduction le distingue de ሞቅ et évite de réduire les deux mots à des quasi-synonymes.
- source_word: ሞቅ
  choice: chaleur
  rationale: Le terme désigne la chaleur ou une condition chaude ; « chaleur » s’accorde avec la série de signes saisonniers.
- source_word: ዛሕን
  choice: calme
  rationale: Le sens précis est incertain ; « calme » traduit avec retenue une condition climatique douce ou paisible.
- source_word: ዕፀው
  choice: arbres
  rationale: Dans cette description de la végétation, « arbres » est l’équivalent français courant et concret.
- source_word: ይፈርዩ
  choice: portent du fruit
  rationale: L’expression française rend directement la production de fruits.
- source_word: ቈጽል ይወጽእ
  choice: des feuilles poussent
  rationale: La formulation idiomatique exprime l’apparition du feuillage sans alourdir le français.
- source_word: ማእረረ ስርናይ
  choice: la moisson du blé
  rationale: La locution renvoie à la récolte ou au produit mûr du blé ; « moisson » convient à ce tableau agricole.
- source_word: ጽጌ ረዳ
  choice: la floraison de la rose
  rationale: « Rose » suit l’identification traditionnelle du végétal, tandis que « floraison » rend le phénomène botanique sans imposer une espèce avec une certitude absolue.
- source_word: ገዳም
  choice: champs
  rationale: Le mot peut désigner un espace ouvert, sauvage ou non cultivé ; dans cette scène végétale, « champs » est naturel, mais l’ambiguïté est signalée.
- source_word: ዕፀወ ክረምት
  choice: les arbres d’hiver
  rationale: La traduction conserve la construction littérale et sa possible portée saisonnière sans identifier plus précisément les végétaux.
theological_decisions:
- issue: Référent de « sa » dans « au temps de sa domination »
  choice: Conserver le possessif sans nommer son référent.
  alternative: « au temps de la domination du luminaire » ou « du soleil »
  rationale: Le contexte environnant peut indiquer le luminaire concerné, mais le verset lui-même ne le nomme pas explicitement. La traduction préserve donc cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le rythme cumulatif du guèze, avec une ponctuation qui en facilite la lecture. « Sueur » maintient l’image concrète et distingue les deux premiers signes de chaleur ; les incertitudes portant sur le climat, la plante et le lieu sont explicitées en notes.
