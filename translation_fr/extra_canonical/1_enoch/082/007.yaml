    rationale: La relative ዘአዘዘ ሎቱ ... ለሐይለ ሰማይ indique que le Seigneur a donné un ordre/mandat à Uriel concernant l’armée du ciel. La formulation du projet affirme plus précisément une autorité sur elle.
