base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: fr
  text: Et le récit est vrai[a], et le calcul établi est exact, car Uriel m’a montré les luminaires, les mois[b], les temps fixés[c], les années[d] et les jours, et Uriel a soufflé sur moi, lui à qui le Seigneur de toute la création du monde a donné un ordre au sujet de l’armée du ciel[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la chose est vraie » ou « l’exposé est véridique ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte calendérique, le terme est compris comme « mois ». Il peut aussi être rapproché de « chemins » ou « parcours ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les fêtes ». Le mot peut désigner les célébrations aussi bien que les dates fixées du calendrier.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou, selon une autre compréhension du terme : « les saisons ». La forme transmise a été diversement interprétée dans cette série calendérique.'
    reason: textual_variant
  - marker: e
    text: « L’armée du ciel » désigne ici l’ensemble céleste organisé, notamment les corps lumineux dont traite cette section.
    reason: cultural_note
lexical_decisions:
- source_word: አማን ነገሩ
  choice: le récit est vrai
  rationale: አማን est ici pris dans son sens adjectival ou prédicatif de « vrai », tandis que ነገር désigne le récit, l’exposé ou la matière présentée.
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: le calcul est exact
  rationale: Le groupe exprime un calcul soigneusement déterminé ou précis. En français, « calcul exact » rend naturellement la technicité du passage sans surcharger le texte; la nuance de fixation portée par ዘልኩዕ est également reflétée par la suite calendérique.
- source_word: ብርሃናት
  choice: luminaires
  rationale: Le mot désigne les lumières célestes envisagées comme des corps ordonnés; « luminaires » conserve le registre astronomique élevé.
- source_word: አውራኅ
  choice: mois
  rationale: Dans cette liste explicitement calendérique, la lecture « mois » est préférable à « chemins/parcours » et correspond à la valeur du terme liée au cycle lunaire; l’ambiguïté est signalée en note.
- source_word: በዓላት
  choice: temps fixés
  rationale: Le terme peut désigner des fêtes, mais le contexte du calendrier favorise la notion plus large de dates ou temps établis.
- source_word: ክረማት
  choice: saisons
  rationale: Le terme désigne proprement des saisons ou périodes saisonnières, parfois notamment les saisons pluvieuses; « saisons » évite de le confondre avec les années.
- source_word: መዋዕል
  choice: jours
  rationale: Dans la succession des unités calendériques, « jours » est le sens direct et contextuellement approprié.
- source_word: ነፍሐ ዲቤየ
  choice: il a soufflé sur moi
  rationale: La traduction conserve l’image concrète et surprenante du souffle, sans la réduire par interprétation à « il m’a instruit » ou « il m’a inspiré ».
- source_word: ዘአዘዘ ሎቱ ... ለሐይለ ሰማይ
  choice: à qui ... a donné autorité sur l’armée du ciel
  rationale: La tournure française exprime le mandat confié à Uriel concernant l’armée céleste; « donné autorité » rend ici idiomatiquement l’idée de commandement reçu.
theological_decisions:
- issue: Titre divin እግዚእ
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » convient au titre de souveraineté divine et au registre élevé, sans introduire de particularité confessionnelle.
- issue: Nature du geste ነፍሐ ዲቤየ
  choice: il a soufflé sur moi
  alternative: il m’a inspiré / il m’a instruit
  rationale: Le geste visionnaire concret est conservé afin de ne pas imposer une interprétation théologique ou psychologique absente de la formulation source.
- issue: Portée du mandat d’Uriel
  choice: a donné autorité sur l’armée du ciel
  alternative: a donné un ordre concernant l’armée du ciel
  rationale: La première formulation est naturelle en français et exprime la charge reçue; l’alternative, plus formelle, demeure possible si አዘዘ est compris comme un ordre ponctuel.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’accumulation solennelle du guèze tout en clarifiant sa syntaxe. Les termes techniques « luminaires », « temps fixés » et « armée du ciel » maintiennent la tonalité cosmologique et apocalyptique.
