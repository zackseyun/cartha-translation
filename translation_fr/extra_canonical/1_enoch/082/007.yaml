revisions:
- from: Et le récit est vrai[a], et le calcul est exact, car Uriel m’a montré les luminaires, les mois[b], les temps fixés[c], les saisons[d] et les jours, et il a soufflé sur moi — Uriel, à qui le Seigneur de toute la création du monde a donné autorité sur l’armée du ciel[e].
  to: Et le récit est vrai[a], et le calcul établi est exact, car Uriel m’a montré les luminaires, les mois[b], les temps fixés[c], les années[d] et les jours, et Uriel a soufflé sur moi, lui à qui le Seigneur de toute la création du monde a donné un ordre au sujet de l’armée du ciel[e].
  rationale: La révision restitue la qualification du calcul, adopte « années » comme lecture principale tout en préservant en note l’alternative « saisons », et rend le mandat confié à Uriel sans en préciser indûment la nature comme une autorité sur l’armée céleste. Elle améliore aussi l’enchaînement français autour d’Uriel sans modifier le sens.
