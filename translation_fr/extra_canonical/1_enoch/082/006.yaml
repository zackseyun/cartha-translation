base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: fr
  text: 'Car ils font partie du calcul de l’année[a], et ils sont véritablement fixés pour toujours : un à la première porte, un à la troisième porte, un à la quatrième porte et un à la sixième porte[b] ; et l’année est achevée en trois cent soixante-quatre jours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les quatre « un » qui suivent désignent les quatre jours supplémentaires répartis entre les quatre parties de l’année dans le calendrier hénochique de 364 jours.
    reason: cultural_note
  - marker: b
    text: Dans le texte transmis ici, le mot « porte » n’est pas répété après « quatrième » ni après « sixième » ; la structure de l’énumération indique qu’il reste sous-entendu.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Conserve la valeur explicative du connecteur et son lien avec l’énoncé précédent.
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: ils entrent dans le calcul de l’année
  rationale: Dans ce contexte calendaire, ሐሳብ désigne un calcul ou un compte ; la tournure française exprime l’inclusion de ces jours dans le décompte annuel plutôt qu’une simple existence.
- source_word: ወአማን፡ ልኩዓን፡ እሙንቱ፡ ለዓለም
  choice: et sont véritablement fixés pour toujours
  rationale: « véritablement » maintient l’insistance de አማን, tandis que « fixés » rend l’idée d’un ordre établi et mesuré sans introduire la nuance potentiellement confessionnelle d’« ordonnés ».
- source_word: አሐቲ
  choice: un
  rationale: Le masculin reprend les jours sous-entendus et la répétition distributive est conservée dans chacune des quatre propositions.
- source_word: በቀዳሚት፡ ኆኅት / በሣልስት፡ ኆኅት
  choice: à la première porte / à la troisième porte
  rationale: « à » indique naturellement l’emplacement dans une énumération, sans imposer l’idée d’un mouvement à travers les portes.
- source_word: በራብዕት / በሳድስት
  choice: à la quatrième porte / à la sixième porte
  rationale: Le nom « porte », exprimé dans les membres précédents, est rétabli en français pour rendre explicite l’ellipse évidente de la série.
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: ainsi, l’année s’achève
  rationale: Rend directement l’accomplissement du cycle annuel ; « ainsi » fait ressortir le résultat du décompte sans ajouter une causalité étrangère au contexte.
- source_word: ፫፻ወ፷ወረቡዕ
  choice: trois cent soixante-quatre jours
  rationale: Restitue exactement le total de 364 jours donné par le texte guèze.
theological_decisions:
- issue: Portée de l’affirmation sur l’ordre des luminaires
  choice: Présenter les jours comme intégrés à un ordre calendaire véritablement fixé pour toujours.
  alternative: Lire le verset comme une simple observation astronomique provisoire.
  rationale: Les termes emphatiques rendus par « véritablement » et « pour toujours » présentent cet agencement comme un ordre cosmique stable, sans préciser au-delà du texte la nature doctrinale de cette stabilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le caractère technique et répétitif de l’énumération calendaire, tout en restant naturelle. Les nombres sont écrits en toutes lettres conformément au registre littéraire.
