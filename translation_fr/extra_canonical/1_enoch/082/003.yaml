base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: fr
  text: Ceux qui comprennent ne dormiront pas, mais ils auront soif d’entendre[a] afin d’apprendre cette sagesse. Elle leur sera plus agréable que de bons aliments ne le sont à ceux qui en mangent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « ils auront soif avec leurs oreilles » : l’image exprime un vif désir d’écouter et d’apprendre.'
    reason: lexical_alternative
  - marker: b
    text: La comparaison met en parallèle le plaisir que la sagesse procure à ceux qui comprennent et celui que de bons aliments procurent à ceux qui les mangent.
    reason: translation_clarity
lexical_decisions:
- source_word: ኢይነውሙ
  choice: ne dormiront pas
  rationale: Le verbe désigne normalement le fait de dormir. L’image concrète de l’éveil attentif est conservée plutôt que remplacée par une paraphrase.
- source_word: እለ ይሌብዉ
  choice: ceux qui comprennent
  rationale: Cette formulation française courante garde l’accent cognitif du syntagme, qui désigne les personnes intelligentes ou capables de discernement.
- source_word: ይጸምኡ በእዝናሆሙ
  choice: ils auront soif d’entendre
  rationale: Le verbe exprime la soif et, associé aux oreilles, forme une image d’écoute avide. La traduction conserve cette métaphore tout en évitant le calque peu naturel « avoir soif avec leurs oreilles ».
- source_word: ከመ ይትመሀርዋ
  choice: afin d’apprendre
  rationale: La construction indique le but de cette écoute attentive. Le pronom objet est naturellement implicite en français devant « cette sagesse ».
- source_word: ለዛ ጥበብ
  choice: cette sagesse
  rationale: Le démonstratif renvoie à l’enseignement qui vient d’être exposé dans le Livre des luminaires.
- source_word: ትደልዎሙ
  choice: elle leur sera plus agréable
  rationale: Le verbe signifie être convenable, agréable ou plaisant. « Agréable » respecte mieux sa valeur lexicale que « douce » ou « savoureuse », même si le contexte évoque la nourriture.
- source_word: እመበልዕት ሠናያት
  choice: que de bons aliments
  rationale: Le syntagme désigne de bonnes choses à manger. « Bons aliments » maintient l’image concrète sans donner au texte une nuance gastronomique absente de la source.
- source_word: ለእለ ይበልዑ
  choice: ne le sont à ceux qui en mangent
  rationale: 'La formulation rend le parallélisme : la sagesse est agréable aux personnes qui comprennent comme les bons aliments le sont à ceux qui les mangent. Le pronom « en » renvoie aux aliments, non à la sagesse.'
theological_decisions:
- issue: Portée métaphorique du sommeil et de la soif des oreilles
  choice: Conserver les deux images corporelles comme expressions d’une réception éveillée et avide de la sagesse révélée.
  alternative: 'Paraphraser : « les personnes avisées resteront vigilantes et écouteront attentivement ».'
  rationale: La conservation des images respecte la texture sapientielle et apocalyptique du passage sans transformer l’exhortation en maxime générale.
- issue: Comparaison entre sagesse et nourriture
  choice: Présenter la sagesse comme plus agréable aux personnes qui comprennent que les bons aliments ne le sont à ceux qui mangent.
  alternative: Dire que la sagesse est « plus douce » ou que les sages la mangent symboliquement.
  rationale: La syntaxe établit un parallèle entre deux groupes et deux sources de plaisir. Cette traduction évite d’identifier sans nécessité l’acte d’apprendre à un acte de manger la sagesse.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur solennel et les métaphores du sommeil, de la soif et de la nourriture sont maintenus. La ponctuation en deux phrases allège une période longue sans modifier le rapport logique.
