base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: fr
  text: 'Et il détient l’autorité, de nuit comme de jour, dans le ciel, afin qu’ils éclairent les êtres humains : le soleil, la lune, les étoiles et toutes les puissances du ciel[a], qui reviennent selon leurs parcours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les autorités du ciel ». L’expression peut désigner les forces ordonnées du monde céleste ou des autorités célestes personnifiées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስልጣነ፡ ቦቱ
  choice: il a autorité
  rationale: ቦቱ porte un suffixe masculin singulier et signifie littéralement « en lui » ; dans ce contexte, la tournure exprime la possession et renvoie vraisemblablement à l’autorité d’Uriel mentionnée au verset précédent.
- source_word: በሌሊት፡ ወበመዓልት
  choice: de nuit comme de jour
  rationale: Cette formulation française naturelle conserve les deux indications temporelles et leur portée continue.
- source_word: ውስተ፡ ሰማይ
  choice: dans le ciel
  rationale: « Ciel » convient au cadre cosmique du Livre astronomique et reste plus naturel ici que « dans les cieux ».
- source_word: ከመ፡ ያርኡ፡ ብርሃነ
  choice: afin qu’ils éclairent
  rationale: La construction marque le but ; le pluriel trouve son référent dans l’énumération des luminaires et puissances célestes qui suit.
- source_word: ዲበ፡ ሰብእ
  choice: les humains
  rationale: Rend la référence collective à l’humanité dans un français moderne, clair et inclusif.
- source_word: ፀሐየ፡ ወወርኀ፡ ወከዋክብተ
  choice: le soleil, la lune, les étoiles
  rationale: Traduction directe et idiomatique de l’énumération des luminaires.
- source_word: ኵሎሙ፡ ስልጣናት፡ ሰማይ
  choice: toutes les puissances du ciel
  rationale: « Puissances » maintient l’ambiguïté entre forces célestes et autorités éventuellement personnifiées, sans imposer une lecture angélique.
- source_word: እለ፡ ይትመየጡ፡ በዓስቢሆሙ
  choice: qui reviennent selon leurs parcours
  rationale: Le verbe exprime le retour ou le retournement, tandis que le dernier terme évoque les parcours ou cycles ordonnés. Cette formulation préserve le mouvement récurrent sans imposer une cosmologie orbitale moderne.
theological_decisions:
- issue: Référent singulier de l’autorité
  choice: « il a autorité », avec un renvoi implicite à Uriel dans le contexte précédent
  alternative: « ils ont autorité » ou « l’autorité sur eux »
  rationale: Le suffixe masculin singulier de ቦቱ favorise grammaticalement un sujet singulier possesseur. Le français conserve ce renvoi sans ajouter le nom d’Uriel au texte du verset.
- issue: Nature des « puissances du ciel »
  choice: Maintenir le terme « puissances » sans préciser si elles sont personnelles ou impersonnelles
  alternative: « autorités du ciel », qui pourrait suggérer plus fortement des êtres célestes personnels
  rationale: Le passage porte sur l’ordre céleste et ses mouvements, mais le terme peut aussi recevoir une portée personnelle. La traduction ne tranche pas ce qui demeure ambigu.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la longue structure cosmique du guèze tout en clarifiant les rapports syntaxiques par les deux-points. Le singulier « il » suit la morphologie de ቦቱ, tandis que le pluriel « ils » anticipe l’énumération des luminaires.
