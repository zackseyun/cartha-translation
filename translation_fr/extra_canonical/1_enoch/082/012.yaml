base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: fr
  text: 'Et ceux-ci sont les chefs de mille : entre un guide et l’autre[a], six sont ajoutés après la position fixe[b] ; et leurs guides font une distinction[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze de ce verset est difficile sur les plans textuel et syntaxique. Il semble décrire des divisions techniques du système des luminaires.
    reason: textual_variant
  - marker: b
    text: Ou « après la station » ou « après l’emplacement » ; le terme désigne ce qui se tient ou occupe une place déterminée.
    reason: lexical_alternative
  - marker: c
    text: Ou « leurs guides les séparent », « leurs chefs les distinguent » ou « leurs guides les discernent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙንቱ
  choice: ceux-ci
  rationale: Démonstratif pluriel qui introduit les éléments dont il est question dans l’explication immédiate.
- source_word: አርእስት፡ ፲፻
  choice: chefs de mille
  rationale: Littéralement « têtes de mille » ; l’expression correspond vraisemblablement à un titre administratif ou hiérarchique. « Chefs de mille » conserve ce caractère technique sans ajouter d’article absent du guèze.
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: entre un guide et l’autre
  rationale: La construction répétée avec ማእከለ exprime ici l’intervalle entre l’un et l’autre, plutôt qu’une succession formulée séparément.
- source_word: ይትዌሰኩ፡ ፮
  choice: six sont ajoutés
  rationale: Le verbe exprime une addition ; le référent exact de « six » demeure implicite dans ce passage technique.
- source_word: በድኅረ፡ ምቅዋም
  choice: après la position fixe
  rationale: ምቅዋም peut désigner l’action de se tenir, un emplacement ou une station. « Position fixe » convient au cadre astronomique tout en gardant l’image d’un emplacement déterminé.
- source_word: መራሕያኒሆሙ
  choice: leurs guides
  rationale: Le terme appartient au vocabulaire de la conduite et du guidage ; ce choix reste cohérent avec መራኂ dans la proposition précédente.
- source_word: ይፈልጡ
  choice: établissent la distinction
  rationale: Le verbe peut signifier séparer, distinguer ou discerner. Cette formulation préserve la nuance technique sans préciser abusivement ce qui est distingué.
theological_decisions:
- issue: Expliciter ou non une théorie calendaire derrière les six unités ajoutées
  choice: Conserver la formulation technique et partiellement obscure du témoin guèze.
  alternative: Identifier explicitement les six comme des jours intercalaires ou comme des divisions précises de l’année.
  rationale: Le contexte astronomique rend une interprétation calendaire plausible, mais le verset ne nomme pas lui-même le référent de « six ». Une explicitation dans le texte résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, digne et lisible, avec maintien volontaire de l’opacité technique du passage. « Chefs de mille » garde la coloration hiérarchique du syntagme, tandis que « guides » rend le vocabulaire distinct de la conduite. Tous les marqueurs de notes figurent dans le texte principal.
