base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: fr
  text: 'Et voici les noms des chefs qui sont sous leur autorité : Berkaël, Zelbesaël, et un autre qui est ajouté, le chef de mille[a], dont le nom est Hélyaseph. Et les jours où celui-ci exerce son autorité arrivent à leur terme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze est abrupte : elle peut désigner un autre responsable ajouté à la liste, portant le rang de « chef de mille ».'
    reason: textual_variant
  - marker: b
    text: 'Plus littéralement : « Et les jours de l’autorité de celui-ci sont accomplis. » Le terme peut aussi signifier « domination » ou « pouvoir délégué ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: les noms
  rationale: Le possessif est rendu naturellement par la construction présentative française « voici les noms des chefs ».
- source_word: መራሕያነ
  choice: chefs
  rationale: Le terme désigne ceux qui conduisent ou dirigent. « Chefs » convient à la hiérarchie décrite sans leur attribuer explicitement une nature angélique.
- source_word: እለ መትሕቴሆሙ
  choice: qui sont sous leur autorité
  rationale: Cette formulation française exprime clairement la subordination hiérarchique plutôt qu'une simple position spatiale.
- source_word: ብርክኤል
  choice: Berkaël
  rationale: Translittération conservatrice du nom propre, avec tréma pour marquer la distinction vocalique en français.
- source_word: ዜልብስኤል
  choice: Zelbesaël
  rationale: Translittération prudente du nom propre guèze, sans prétendre résoudre entièrement sa vocalisation.
- source_word: ዘይትዌሰክ
  choice: qui est ajouté
  rationale: Rend directement le sens passif d'un personnage supplémentaire joint à la liste.
- source_word: ርእሰ ፲፻
  choice: le chef de mille
  rationale: La locution signifie littéralement « tête de mille ». « Chef de mille » conserve le titre hiérarchique tout en restant naturel en français et sans imposer un grade militaire précis.
- source_word: ስሙ ሂሉያሴፍ
  choice: dont le nom est Hélyaseph
  rationale: Cette formulation conserve explicitement ስሙ, « son nom », et relie sans ambiguïté le nom au personnage ajouté.
- source_word: ተፈጸመ መዋዕለ ስልጣኑ ለዝ
  choice: les jours où celui-ci exerce son autorité arrivent à leur terme
  rationale: La tournure garde l'idée de jours, d'autorité et d'achèvement, tout en exprimant naturellement en français la récurrence calendérique suggérée par le contexte.
theological_decisions:
- issue: Nature des titres hiérarchiques dans l'ordre des luminaires
  choice: Employer un vocabulaire hiérarchique général (« chefs », « chef de mille »).
  alternative: Identifier explicitement ces personnages comme des chefs angéliques ou seulement comme des agents astronomiques.
  rationale: Le verset établit une hiérarchie, mais ne définit pas explicitement ici la nature de ses membres. La traduction préserve cette indétermination.
- issue: Valeur temporelle de l'achèvement des jours d'autorité
  choice: Employer le présent récurrent « arrivent à leur terme ».
  alternative: 'Employer un passé historique : « sont arrivés à leur terme » ou « furent accomplis ».'
  rationale: Dans le cadre cyclique du calendrier astronomique, le parfait guèze peut décrire l'achèvement régulier d'une période plutôt qu'un événement historique unique.
translation_notes:
  register: Français international moderne, digne et lisible. Les noms sont translittérés avec des formes adaptées à la lecture française. La légère étrangeté du rang « chef de mille » est conservée, car elle appartient à la structure hiérarchique du texte source.
