base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: fr
  text: À cause d’eux, les humains s’égarent et ne les prennent pas en compte dans le calcul du monde entier[a] ; car ils se trompent à leur sujet[b] et ne les connaissent pas avec précision[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze au milieu du verset est difficile. « Dans le calcul du monde entier » peut aussi se comprendre comme « dans la pensée du monde entier », mais le contexte astronomique et calendaire favorise ici l’idée de calcul.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car ils les égarent ». La forme guèze peut recevoir une valeur causative ; la traduction principale conserve le sens contextuel d’une erreur à leur sujet.'
    reason: textual_alternative
  - marker: c
    text: Le dernier terme peut également signifier « avec soin » ou « exactement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: À cause d’eux
  rationale: La locution prépositionnelle exprime naturellement la cause ou l’occasion, tout en laissant le référent du pronom indéterminé.
- source_word: ይጌግዩ
  choice: s’égarent
  rationale: Ce verbe exprime l’erreur ou l’égarement et conserve à la fois la nuance cognitive et l’image d’un écart par rapport à la bonne voie.
- source_word: ኢየኀስብዎሙ
  choice: ne les prennent pas en compte
  rationale: Dans ce contexte calendaire, le verbe relève du compte ou du calcul. Cette formulation française est naturelle et évite la répétition lourde de « calculer… dans le calcul ».
- source_word: ተበሐሳቤ
  choice: dans le calcul
  rationale: Dans le Livre astronomique, le terme se rapporte vraisemblablement au calcul calendaire, plutôt qu’à la simple pensée.
- source_word: ኵሉ ዓለም
  choice: du monde entier
  rationale: La traduction conserve la portée collective et universelle de l’expression guèze dans un français naturel.
- source_word: ይጌግይዎሙ
  choice: ils se trompent à leur sujet
  rationale: La syntaxe et la vocalisation transmises sont difficiles. Cette traduction suit le sens contextuel d’une erreur les concernant sans imposer une causalité incertaine.
- source_word: ኢያእምርዎሙ
  choice: ne les connaissent pas
  rationale: Le verbe courant de connaissance reste volontairement large et n’impose ni « reconnaître » ni « comprendre ».
- source_word: ጥንቁቀ
  choice: avec précision
  rationale: L’expression rend la nuance de soin, d’exactitude ou de précision adaptée à un contexte de calcul calendaire.
theological_decisions:
- issue: Référent des pronoms pluriels répétés
  choice: Maintenir les pronoms « eux/les/leur » sans préciser le référent.
  alternative: Expliciter « les luminaires », « leurs temps fixés » ou « les ordonnances célestes ».
  rationale: Le contexte évoque probablement les luminaires ou leurs temps et cycles prescrits, mais le verset guèze ne précise pas lui-même le référent. La traduction conserve donc cette ambiguïté réelle.
- issue: Valeur de ይጌግይዎሙ dans la seconde proposition
  choice: « ils se trompent à leur sujet »
  alternative: « ils les égarent »
  rationale: La forme peut suggérer une valeur causative, mais le sens contextuel et la tradition de traduction permettent aussi une erreur concernant ces réalités. Une note signale l’autre analyse sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « Les humains » rend le collectif sans le limiter aux hommes de sexe masculin. La ponctuation conserve les deux membres explicatifs du texte, et les notes préservent les difficultés lexicales et syntaxiques réelles.
