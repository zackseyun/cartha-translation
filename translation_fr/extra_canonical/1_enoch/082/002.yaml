base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: fr
  text: Je t’ai donné la sagesse[a], ainsi qu’à tes enfants et à tes futurs enfants, afin qu’ils transmettent à leurs enfants, de génération en génération, cette sagesse qui dépasse leur intelligence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et à tes futurs enfants » figurent entre crochets dans le témoin éthiopien fourni ; ils peuvent désigner plus largement les descendants futurs.
    reason: textual_variant
  - marker: b
    text: 'Autre compréhension possible : « cette sagesse dans leur esprit ». L’expression guèze peut aussi se rendre très littéralement par « cette sagesse sur leur pensée » ou « sur leur intelligence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: la sagesse
  rationale: Le nom désigne la sagesse ou l’intelligence; « sagesse » convient au contexte d’un enseignement révélé destiné à être transmis.
- source_word: ወሀብኩ
  choice: J’ai donné
  rationale: Le parfait est rendu par un passé composé, naturel en français et exprimant la portée actuelle du don.
- source_word: ወለውሉድከ
  choice: à tes enfants
  rationale: Le terme désigne largement les enfants ou la descendance; « enfants » préserve ici la formulation familiale directe.
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: et à ceux qui seront tes enfants
  rationale: Cette traduction reste proche de la proposition guèze tout en laissant entendre les descendants futurs; les crochets du témoin sont signalés en note.
- source_word: ከመ፡ የሀቡ፡
  choice: afin qu’ils transmettent
  rationale: La construction exprime le but. « Transmettre » rend naturellement le fait de donner cet enseignement à la génération suivante.
- source_word: ለትውልዳት
  choice: de génération en génération
  rationale: Cette expression française idiomatique rend la succession continue des générations.
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: qui dépasse leur intelligence
  rationale: ዲበ peut signifier « au-dessus de » et, avec le terme désignant la pensée ou l’intelligence, peut exprimer ce qui dépasse leur faculté de comprendre. Une lecture plus littérale demeure possible et est indiquée en note.
theological_decisions:
- issue: Nature de la sagesse transmise
  choice: Conserver le terme général « sagesse » comme un don reçu et transmis aux descendants.
  alternative: Préciser qu’il s’agit exclusivement d’un enseignement astronomique ou calendaire.
  rationale: Le contexte du Livre des Luminaires éclaire probablement le contenu de cette sagesse, mais le verset emploie un terme général; la traduction n’en restreint donc pas artificiellement la portée.
- issue: Rapport entre la sagesse et l’intelligence humaine
  choice: « cette sagesse qui dépasse leur intelligence »
  alternative: « cette sagesse dans leur esprit » ou, plus littéralement, « sur leur pensée »
  rationale: Le sens spatial de ዲበ autorise l’idée de supériorité ou de dépassement, mais la syntaxe reste difficile; la note conserve l’autre possibilité sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ouverture emphatique sur « la sagesse », omet toute conjonction initiale absente du guèze et rend la transmission intergénérationnelle avec une formulation française naturelle.
