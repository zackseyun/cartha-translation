base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: fr
  text: Désormais, ceux qui possèdent la terre ne seront ni puissants ni haut placés. Ils ne pourront pas non plus regarder le visage des saints[a], car le Seigneur des Esprits a fait paraître sa lumière sur le visage des saints, des justes et des élus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Regarder le visage de » peut exprimer ici une rencontre directe ou l’accès à la présence de quelqu’un. L’image concrète du texte guèze est conservée.
    reason: cultural_note
  - marker: b
    text: La phrase peut évoquer la lumière du Seigneur brillant sur le visage des saints, des justes et des élus, signe visible de leur réhabilitation. Le texte n’indique pas explicitement si ces trois termes désignent un seul groupe ou plusieurs.
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ፡ ወእልዑላነ
  choice: puissants ni haut placés
  rationale: 'Les deux termes désignent respectivement la puissance et l’élévation de rang. Avec le verbe « être », leurs formes indiquent ici un attribut nié : ceux qui dominent la terre perdront leur puissance et leur position élevée. « Haut placés » exprime naturellement le statut social en français sans suggérer une élévation spirituelle.'
- source_word: እለ፡ ይእኅዝዋ፡ ለምድር
  choice: ceux qui possèdent la terre
  rationale: Le verbe peut signifier saisir, tenir ou posséder. Dans ce contexte, « possèdent » traduit une domination durable sans imposer l’idée plus forte d’une conquête violente.
- source_word: ገጸ፡ ቅዱሳን
  choice: le visage des saints
  rationale: La formulation concrète et sémitisante est conservée plutôt que réduite à « la présence des saints » ; elle peut évoquer une rencontre directe ou l’accès aux saints.
- source_word: እግዚአ፡ መናፍስት
  choice: le Seigneur des Esprits
  rationale: Il s’agit d’un titre divin caractéristique de 1 Hénoch. La majuscule à « Esprits » marque sa fonction titulaire sans préciser indûment l’identité de ces esprits.
- source_word: አርአየ፡ ብርሃኖ
  choice: a fait paraître sa lumière
  rationale: La tournure causative décrit la manifestation visible de la lumière. « A fait paraître » conserve cette image mieux que le terme plus abstrait « a révélé ».
- source_word: በገጸ፡ ቅዱሳን፡ ጻድቃን፡ ወኅሩያን
  choice: sur le visage des saints, des justes et des élus
  rationale: Le concret « sur le visage » est maintenu, de même que les trois désignations distinctes de la communauté honorée. La répétition des articles rend l’énumération claire en français tout en laissant ouverte la question de savoir s’il s’agit de trois groupes ou de trois qualifications d’un même groupe.
theological_decisions:
- issue: Sort réservé à ceux qui possèdent la terre
  choice: Ils perdent leur puissance et leur rang élevé.
  alternative: Ils cessent entièrement d’exister.
  rationale: La construction du verbe « être » avec « puissants » et « élevés » comme attributs favorise une perte de statut, et non une affirmation d’anéantissement. La traduction conserve le renversement apocalyptique sans aller au-delà de la syntaxe.
- issue: Manifestation de la lumière divine
  choice: La lumière du Seigneur paraît sur le visage des saints, des justes et des élus.
  alternative: La lumière paraît devant eux ou émane de leur visage.
  rationale: La préposition et l’image du visage soutiennent le plus directement une manifestation sur leur visage. La formulation reste imagée et n’explicite pas cette lumière comme une doctrine particulière de glorification.
- issue: Rapport entre « saints », « justes » et « élus »
  choice: Conserver les trois termes dans une même énumération sans trancher s’ils désignent un seul groupe sous trois aspects ou plusieurs groupes.
  alternative: Fusionner les termes en une seule désignation, ou les répartir explicitement en trois groupes.
  rationale: Le texte juxtapose les trois qualificatifs sans expliquer leur relation exacte ; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Désormais » restitue sobrement l’ouverture temporelle ; deux phrases évitent une période trop lourde. La syntaxe du début suit l’analyse du guèze selon laquelle « puissants » et « haut placés » sont les attributs de « ceux qui possèdent la terre », malgré l’ordre initial des mots. Les images du visage et de la lumière sont volontairement préservées.
