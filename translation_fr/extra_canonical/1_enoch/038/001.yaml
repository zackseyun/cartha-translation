base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: fr
  text: La première parabole. Quand l’assemblée des justes apparaîtra, les pécheurs seront jugés pour leurs péchés et chassés de la face de la terre[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la face du sol sec ». L’expression peut désigner idiomatiquement la surface de la terre ou du pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምሳሌ፡ ቀዳማ
  choice: La première parabole
  rationale: Le syntagme sert de titre au premier discours visionnaire de cette section. « Parabole » est courant, transparent et suffisamment digne en français moderne.
- source_word: ሶበ
  choice: Quand
  rationale: La conjonction ouvre une proposition temporelle qui se poursuit au verset suivant; la virgule finale conserve cette construction inachevée.
- source_word: ያስተርኢ
  choice: apparaîtra
  rationale: Le verbe exprime ici le fait de devenir visible ou de paraître, sans imposer le vocabulaire plus spécifique de la révélation. Le futur convient naturellement à la scène annoncée en français.
- source_word: ማኅበረ፡ ጻድቃን
  choice: l’assemblée des justes
  rationale: « Assemblée » garde le sens collectif du terme et reste naturel dans un registre solennel mais accessible.
- source_word: ወይትኴነኑ፡ ኃጥኣን
  choice: que les pécheurs seront jugés
  rationale: « Jugés » conserve la portée judiciaire du verbe sans préciser indûment « condamnés ». L’article défini est idiomatique en français pour désigner cette catégorie dans la scène.
- source_word: በኃጢአቶሙ
  choice: pour leurs péchés
  rationale: La préposition indique naturellement le motif ou le fondement du jugement.
- source_word: ወእምገጸ፡ የብስ
  choice: de la face de la terre
  rationale: Cette formulation conserve l’image de la « face » tout en rendant የብስ par le français idiomatique « terre »; le sens plus concret de « sol sec » est signalé en note.
- source_word: ይትሀወዙ
  choice: seront chassés
  rationale: Le passif et le caractère punitif de l’expulsion sont ainsi maintenus plus nettement qu’avec « partiront » ou « seront éloignés ».
theological_decisions:
- issue: Le verbe judiciaire désigne-t-il simplement un jugement ou explicitement une condamnation ?
  choice: seront jugés
  alternative: seront condamnés
  rationale: Le contexte implique une issue punitive, mais le verbe lui-même n’oblige pas à expliciter la condamnation; « jugés » préserve donc la tension du texte.
translation_notes:
  register: 'Français international moderne, clair et solennel. Le point après le titre distingue l’intitulé de la proposition temporelle. La virgule finale est volontaire : la phrase commencée par « Quand » trouve sa suite au verset suivant.'
