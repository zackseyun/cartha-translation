base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: fr
  text: Et lorsque la justice apparaîtra sur les visages des justes et des choisis, dont les œuvres sont suspendues au Seigneur des esprits[a], et que la lumière apparaîtra aux justes et aux choisis qui habitent sur la terre ferme[b], où sera donc la demeure des pécheurs, et où sera le lieu de repos de ceux qui ont renié le Seigneur des esprits ? Il aurait mieux valu pour eux ne pas être nés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dont les œuvres sont suspendues au Seigneur des esprits » est difficile. Elle peut signifier que leurs œuvres dépendent de lui ou qu’elles sont maintenues devant lui.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sur la terre sèche » ; l’expression désigne probablement la terre habitée, par contraste avec les eaux.
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: apparaîtra
  rationale: Le verbe ast-stem signifie ici « apparaître » ou « être vu ». Le futur convient au cadre eschatologique et la répétition française conserve celle du guèze.
- source_word: ጽድቅ
  choice: justice
  rationale: « Justice » rend naturellement le nom abstrait en français biblique moderne, avec l'idée conjointe de rectitude et de manifestation vindicatrice.
- source_word: በገጾሙ
  choice: sur le visage
  rationale: Cette formulation conserve l'image concrète d'une justice visible sur le visage des justes; le singulier collectif est naturel en français.
- source_word: ጻድቃን
  choice: les justes
  rationale: Terme français biblique courant et transparent, lié directement à « justice ».
- source_word: ኅሩያን
  choice: les choisis
  rationale: « Les choisis » reste compréhensible et évite les connotations doctrinales plus marquées de « les élus ».
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: dont les œuvres sont suspendues au Seigneur des esprits
  rationale: La traduction garde la métaphore inhabituelle du texte plutôt que de la réduire à « dépendent de » ou de l'interpréter comme une pesée.
- source_word: ብርሃን
  choice: la lumière
  rationale: Équivalent simple qui conserve la force symbolique sans amplifier le terme.
- source_word: የኃድሩ ዲበ የብስ
  choice: qui habitent sur la terre ferme
  rationale: « Terre ferme » restitue l'opposition cosmologique implicite avec les eaux tout en restant plus idiomatique que « sol sec ».
- source_word: መኃደሪ
  choice: demeure
  rationale: Le mot garde la valeur locative de la question de jugement.
- source_word: ምዕራፎሙ
  choice: lieu de repos
  rationale: Cette expression conserve à la fois les notions de lieu et de repos, en parallèle avec « demeure ».
- source_word: ክሕድዎ
  choice: ont renié
  rationale: « Renier » exprime le rejet personnel et religieux d'un Seigneur reconnu, sans ajouter une doctrine particulière.
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: Il aurait mieux valu pour eux ne pas être nés
  rationale: Formule française claire et forte qui restitue le jugement contrefactuel du guèze.
theological_decisions:
- issue: Sens de la formule difficile concernant les œuvres des justes et des choisis
  choice: « dont les œuvres sont suspendues au Seigneur des esprits »
  alternative: « dont les œuvres dépendent du Seigneur des esprits » ou « dont les œuvres sont soutenues devant le Seigneur des esprits »
  rationale: Le texte guèze présente une image difficile et ne permet pas de trancher sûrement entre dépendance, suspension et maintien. Le texte principal préserve donc la métaphore, et la note expose les interprétations possibles.
- issue: Référent de « terre ferme »
  choice: Conserver l'image concrète de la terre ferme
  alternative: « la terre » ou « le monde habité »
  rationale: La formulation peut désigner le monde habité par contraste avec les eaux cosmiques. La traduction évite néanmoins d'aplanir cette imagerie apocalyptique.
- issue: Valeur grammaticale de la seconde occurrence de ያስተርኢ
  choice: « la lumière apparaîtra »
  alternative: « il fera apparaître la lumière »
  rationale: La forme de « lumière » et la valeur du verbe soutiennent son rôle de sujet; la traduction évite donc d'introduire un agent non exprimé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe longue conserve le mouvement visionnaire du texte, tandis que la ponctuation clarifie les deux questions. Les titres et termes collectifs restent sobres, sans vocabulaire confessionnel spécialisé.
