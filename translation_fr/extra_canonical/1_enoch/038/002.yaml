revisions:
- from: Et lorsque la justice apparaîtra sur le visage des justes, les choisis, dont les œuvres sont suspendues au Seigneur des esprits[a], et que la lumière apparaîtra aux justes et aux choisis qui habitent sur la terre ferme[b], où sera alors la demeure des pécheurs, et où sera le lieu de repos de ceux qui ont renié le Seigneur des esprits ? Il aurait mieux valu pour eux ne pas être nés.
  to: Et lorsque la justice apparaîtra sur les visages des justes et des choisis, dont les œuvres sont suspendues au Seigneur des esprits[a], et que la lumière apparaîtra aux justes et aux choisis qui habitent sur la terre ferme[b], où sera donc la demeure des pécheurs, et où sera le lieu de repos de ceux qui ont renié le Seigneur des esprits ? Il aurait mieux valu pour eux ne pas être nés.
  rationale: La révision ne modifie pas le sens du passage. Elle corrige la relation grammaticale entre les deux désignations collectives, restitue le pluriel concret du source et rend la note sur « terre ferme » plus exacte et lisible. L’ambiguïté de la métaphore concernant les œuvres demeure dans le texte et est signalée en note.
