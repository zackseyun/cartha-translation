  terminology: « Justice », « justes », « choisis », « Seigneur des esprits », « pécheurs », « demeure » et « lieu de repos » conviennent. « Les choisis » évite à juste titre d’imposer les connotations ultérieures de « élus ». La métaphore des œuvres est conservée sans résolution doctrinale.
  issues:
  - severity: medium
    issue: Coordination insuffisamment explicite entre « les justes » et « les choisis ».
    rationale: Le texte source et la piste anglaise distinguent les justes et les choisis. Dans « des justes, les choisis », le second groupe paraît être une apposition ou une sous-catégorie du premier. « Des justes et des choisis » préserve la relation sans la réinterpréter.
  - severity: low
    issue: Singulier collectif « sur le visage ».
    rationale: Le guèze porte un pluriel (« leurs visages »). Le pluriel français conserve l’image concrète et n’alourdit pas le texte.
  - severity: low
    issue: La note b dit « sur le sec », formulation moins directement transparente que le texte source.
    rationale: « Sur la terre sèche » exprime plus clairement le sens littéral de ዲበ የብስ tout en laissant intacte l’explication cosmologique.
