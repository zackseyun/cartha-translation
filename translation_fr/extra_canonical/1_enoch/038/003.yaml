base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: fr
  text: Quand ce qui est caché chez les justes sera révélé[a], les pécheurs seront jugés, et les méchants seront chassés de la présence des justes et des choisis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les secrets des justes ». Le guèze désigne ce qui est caché, sans préciser s'il s'agit de leurs actes, de leur véritable statut ou des motifs de leur réhabilitation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de la face des justes et des choisis » : formule exprimant l''exclusion hors de leur présence dans une scène de jugement.'
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Quand
  rationale: Introduit une proposition temporelle et conserve la construction protase-apodose du guèze.
- source_word: ይትከሠት
  choice: sera révélé
  rationale: Le passif convient à la forme verbale et au contexte apocalyptique d'une réalité cachée rendue manifeste.
- source_word: ኅቡኣቲሆሙ፡ ለጻድቃን
  choice: ce qui était caché chez les justes
  rationale: Cette formulation française naturelle conserve l'indétermination du pluriel substantivé sans le réduire à des « secrets » ni l'identifier à des personnes cachées.
- source_word: ይትኴነኑ
  choice: seront jugés
  rationale: Rend le passif judiciaire sans renforcer indûment le sens en « seront condamnés ».
- source_word: ኃጥኣን
  choice: les pécheurs
  rationale: Terme direct et courant pour cette catégorie morale dans le langage du jugement.
- source_word: ይትሀወዙ
  choice: seront chassés
  rationale: Exprime une éviction forcée plutôt qu'un simple départ.
- source_word: ረስዓን
  choice: les méchants
  rationale: Préserve clairement l'opposition morale avec les justes dans un français accessible.
- source_word: እምገጸ
  choice: loin de la présence de
  rationale: Rend idiomatiquement la formule littérale « de la face de » tout en maintenant l'image d'une exclusion hors de la présence du groupe réhabilité.
- source_word: ወኅሩያን
  choice: et des choisis
  rationale: « Choisis » demeure accessible et conserve la catégorie de ceux que Dieu a choisis, sans recourir au terme plus spécialisé « élus ».
theological_decisions:
- issue: Nature de la réalité cachée liée aux justes
  choice: ce qui était caché chez les justes
  alternative: les secrets des justes ; ceux qui étaient cachés parmi les justes
  rationale: Le guèze n'impose ni des secrets privés, ni des personnes cachées. La formulation retenue préserve l'ambiguïté entre actes, statut véritable et motifs de réhabilitation.
- issue: Portée de la formule finale d'exclusion
  choice: chassés loin de la présence des justes et des choisis
  alternative: chassés loin de la face des justes et des choisis
  rationale: Le texte décrit une éviction hors de la présence de la communauté réhabilitée. La traduction conserve cette force judiciaire et spatiale sans introduire la seule idée de honte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe temporelle introduite par « Quand » est conservée. « Présence » évite un calque peu naturel de « face » dans le corps du texte, tandis que la note en signale la forme littérale.
