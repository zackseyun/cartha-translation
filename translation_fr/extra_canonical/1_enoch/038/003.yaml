  source_fidelity: 'La structure temporelle « Quand …, les pécheurs seront jugés » rend correctement ሶበ et maintient la relation protase-apodose. Les passifs judiciaires et d’expulsion, ainsi que les catégories « justes », « pécheurs », « méchants » et « choisis », sont fidèles. Toutefois, « ce qui était caché » introduit une antériorité que l’adjectif guèze « caché » n’exprime pas nécessairement : il convient de conserver le présent d’état (« est caché »).'
  naturalness: Le français est globalement naturel, sobre et adapté à un registre scripturaire moderne. « De la présence » est légèrement plus direct et idiomatique que « loin de la présence », tout en conservant l’idée d’exclusion.
  terminology: « Justes », « pécheurs », « méchants » et « choisis » sont cohérents et non confessionnellement surinterprétés. « Ce qui est caché chez les justes » préserve raisonnablement l’ambiguïté relationnelle du guèze, sans réduire le sens à des secrets privés.
  issues:
