base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
translation:
  language: fr
  text: 'Alors, une parole tomba dans ma bouche à cause de cela[a] ; j’élevai un cri et je dis : « La terre est détruite[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venant de cela » ou « là-dessus » ; l’expression peut indiquer la provenance, la cause ou la succession par rapport à la vision précédente.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se traduire par « a péri ». Il ne s’agit pas du verbe signifiant « être englouti » employé au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: à cause de cela
  rationale: La préposition avec suffixe peut exprimer la provenance, la cause ou la succession. Dans ce récit de vision, la valeur causale ou consécutive convient bien, sans exclure les autres nuances signalées en note.
- source_word: ወድቀ ነገር ውስተ አፉየ
  choice: une parole tomba dans ma bouche
  rationale: La formulation imagée est conservée plutôt que réduite à « je parlai » ; elle suggère qu’une parole s’impose au visionnaire.
- source_word: አንሣእኩ እጽራሕ
  choice: j’élevai un cri
  rationale: Cette tournure française naturelle garde à la fois l’idée d’élévation portée par le verbe et la force émotionnelle du cri.
- source_word: ተሐጕለት
  choice: est détruite
  rationale: Le verbe signifie ici être détruit ou périr. Cette traduction respecte le changement lexical par rapport au verbe « engloutir » employé dans le verset précédent.
- source_word: ምድር
  choice: la terre
  rationale: Dans cette vision apocalyptique, « la terre » conserve la portée cosmique possible du terme, contrairement au sens plus étroit de « pays ».
theological_decisions:
- issue: Portée de ምድር dans une vision apocalyptique du déluge
  choice: la terre
  alternative: le pays
  rationale: Le cadre visionnaire autorise une portée cosmique. « La terre » préserve cette ampleur sans imposer au texte une précision géographique absente.
- issue: Nature de la parole du visionnaire
  choice: conserver l’idiome « une parole tomba dans ma bouche »
  alternative: « je pris la parole » ou « je parlai »
  rationale: L’idiome laisse ouverte la question de savoir si l’énoncé est spontané, subi ou inspiré, au lieu de trancher théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. L’image inhabituelle de la parole qui « tombe » dans la bouche est volontairement préservée. Le passé simple convient au registre narratif du passage, tandis que le présent de la déclaration rend son caractère immédiat.
