base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: fr
  text: Quand je sortis en bas[a] et que je vis le ciel[b], le soleil se levant à l’est, la lune se couchant à l’ouest, quelques étoiles, la terre entière et toutes choses telles qu’il les avait connues au commencement, alors je bénis le Seigneur du jugement et je l’exaltai, parce qu’il avait fait sortir le soleil des fenêtres de l’est. Celui-ci monta, se leva sur la face du ciel, se mit en route et suivit le chemin qu’il lui avait montré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le bas » ou « au-dessous » ; le cadre du songe ne permet pas de préciser davantage le repère spatial.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe guèze comporte un suffixe objet masculin singulier qui anticipe vraisemblablement « le ciel » dans la suite de la phrase. Pris isolément, le segment pourrait se traduire : « et je le vis ».'
    reason: textual_syntax
lexical_decisions:
- source_word: ሶበ
  choice: quand
  rationale: Conjonction temporelle ouvrant la proposition circonstancielle; le waw précédent assure déjà l’enchaînement narratif.
- source_word: ወፃእኩ
  choice: je sortis
  rationale: Le parfait à la première personne désigne le mouvement hors d’un lieu; le passé simple convient au registre narratif soutenu.
- source_word: ታሕተ
  choice: au-dessous
  rationale: Conserve la valeur spatiale, sans préciser abusivement le lieu ou la direction dans le cadre du songe.
- source_word: ወርኢክዎ
  choice: et que je vis le ciel
  rationale: Le suffixe masculin singulier est compris comme un pronom objet anticipant « le ciel » dans la suite attestée du verset; la syntaxe française exprime directement cet objet.
- source_word: Lord of judgment
  choice: Seigneur du jugement
  rationale: Maintient le titre judiciaire sans le transformer en formulation confessionnelle plus spécialisée.
- source_word: windows of the east
  choice: fenêtres de l’est
  rationale: Préserve l’image cosmologique concrète et répétée de la tradition hénochique.
theological_decisions:
- issue: Identité du suffixe objet dans ወርኢክዎ
  choice: Le rattacher par anticipation à « le ciel »
  alternative: Traduire isolément « et je le vis », avec un référent non identifié
  rationale: Dans le texte continu de Charles, « le ciel » suit le verbe et fournit son référent; la lecture « je le vis » résulte du découpage tronqué de l’extrait plutôt que de la phrase complète.
- issue: Référent de « il » dans les actions créatrices et directrices
  choice: Conserver le pronom « il » sans ajouter « Dieu »
  alternative: Expliciter le référent par « Dieu » ou « le Seigneur »
  rationale: Le verset associe naturellement ces actions au Seigneur du jugement, mais le texte emploie un pronom; l’explicitation imposerait une résolution absente de la forme source consultée.
- issue: Personnification grammaticale du soleil
  choice: Employer « Celui-ci » puis « lui »
  alternative: Répéter « le soleil » ou employer seulement « il »
  rationale: Cette formulation garde clairement le soleil comme sujet et bénéficiaire du chemin montré, sans lui attribuer une identité personnelle supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le récit visionnaire sans archaïsmes lexicaux. Les images cosmologiques (« fenêtres de l’est », « face du ciel ») sont conservées plutôt que paraphrasées.
