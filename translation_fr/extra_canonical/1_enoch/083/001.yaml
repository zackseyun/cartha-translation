base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: fr
  text: Et maintenant, mon fils Mathusalem, je te montrerai[a] toutes les visions que j’ai vues, et je te les raconterai en ta présence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte emploie deux verbes de communication : d’abord « montrer », puis « raconter ». Cette association souligne à la fois la présentation des visions et leur narration orale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Marque une transition dans le discours et introduit naturellement une nouvelle déclaration.
- source_word: አርእየከ፡
  choice: je te montrerai
  rationale: Le verbe causatif, muni du suffixe de deuxième personne du masculin singulier, exprime l’action de faire voir ou de montrer ; le futur convient ici à l’annonce de ce qui va être communiqué.
- source_word: ወልድየ፡ ማቱሳላ፡
  choice: mon fils Mathusalem
  rationale: Conserve l’adresse filiale et emploie la forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: ኵሎ፡ ራእያትየ፡
  choice: toutes les visions
  rationale: « Visions » garde le sens de perceptions visionnaires et le registre apocalyptique du substantif.
- source_word: እለ፡ ርኢኩ፡
  choice: que j’ai vues
  rationale: La proposition relative qualifie les visions et rend l’action accomplie de voir sans l’élargir au sens plus général de révélation.
- source_word: በቅድሜከ፡
  choice: devant toi
  rationale: Rend au plus près l’expression spatiale ou présentielle du guèze sans trancher en faveur d’une simple communication « à toi ».
- source_word: እነግር።
  choice: je les raconterai
  rationale: Le verbe désigne l’action de dire ou de narrer ; « raconterai » convient à l’introduction d’une suite de visions tout en restant distinct de « montrerai ».
theological_decisions:
- issue: Rapport entre « montrer » et « raconter »
  choice: 'Maintenir les deux verbes distincts : « je te montrerai […] ; je les raconterai »'
  alternative: Réunir les deux actions sous un seul verbe, par exemple « je te ferai connaître »
  rationale: Le guèze emploie deux verbes de communication. Les conserver respecte la tension entre présentation visionnaire et narration verbale, sans réduire l’une à l’autre.
translation_notes:
  register: Français international moderne, clair et digne. La construction « les visions que j’ai vues » conserve volontairement la répétition du texte source. « Devant toi » préserve son expression présentielle et son ambiguïté possible, malgré une tournure moins courante en français actuel.
