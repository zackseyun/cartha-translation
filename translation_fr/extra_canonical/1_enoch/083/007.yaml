base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: fr
  text: 'Je lui racontai toute la vision que j’avais eue. Il me dit : « Ce que tu as vu est terrible, mon fils, et la vision de ton rêve est puissante : elle porte sur les secrets de tout le péché de la terre[a]. Celle-ci est sur le point de sombrer dans l’abîme[b] et de périr dans une grande destruction[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction éthiopienne est difficile. Elle peut se comprendre comme « les secrets de tout le péché de la terre » ou « tous les péchés cachés de la terre »; certains l’interprètent aussi comme « elle a caché tout le péché de la terre ». Le texte ne précise pas clairement si la vision révèle, dissimule ou concerne ces secrets.
    reason: lexical_alternative
  - marker: b
    text: Le terme rendu par « abîme » peut aussi désigner les profondeurs ou la mer.
    reason: lexical_alternative
  - marker: c
    text: 'L’expression éthiopienne répète le radical de « périr / détruire » pour renforcer l’idée : littéralement, quelque chose comme « périr d’une grande destruction » ou « être détruite d’une grande destruction ».'
    reason: translation_clarity
lexical_decisions:
- source_word: ነገርክዎ
  choice: Je lui racontai
  rationale: Le verbe désigne ici le récit fait à un interlocuteur. « Raconter » convient naturellement à la relation complète d’une vision.
- source_word: ራእየ ዘርኢኩ
  choice: toute la vision que j’avais eue
  rationale: En contexte apocalyptique, ራእይ désigne une vision. Le français idiomatique « avoir une vision » évite la répétition pesante de « voir », tout en conservant le sens.
- source_word: ጽኑዐ ርኢከ
  choice: Ce que tu as vu est terrible
  rationale: ጽኑዕ peut exprimer ce qui est dur, grave ou redoutable. « Terrible » restitue ici la force funeste de la scène annoncée sans transformer l’adjectif en jugement moral.
- source_word: ኃያለ ርእየ ሕልምከ
  choice: la vision de ton rêve est puissante
  rationale: La formulation conserve à la fois les notions de vision et de rêve ainsi que la force écrasante indiquée par ኃያል.
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: toutes les réalités cachées du péché de la terre
  rationale: La séquence est comprimée et difficile. ኅቡኣት renvoie à ce qui est caché ou secret; « réalités cachées » reste proche de ce sens sans affirmer explicitement que la vision les révèle ou les dissimule.
- source_word: ትሰጠም ሀለወት
  choice: est sur le point de sombrer
  rationale: La construction exprime une action imminente, tandis que le verbe évoque l’enfoncement ou la submersion.
- source_word: ቀላይት
  choice: l’abîme
  rationale: Le terme peut désigner les profondeurs ou la mer. « Abîme » conserve la portée cosmique et judiciaire du contexte apocalyptique.
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: être anéantie dans une immense destruction
  rationale: Il s’agit d’une construction intensive à radical répété exprimant la destruction ou la disparition. Cette traduction corrige l’ancienne interprétation erronée qui y voyait l’obscurité.
theological_decisions:
- issue: Référent du sujet féminin dans les dernières propositions
  choice: « Celle-ci » renvoie naturellement à « la terre », tout en laissant subsister la compression syntaxique du passage.
  alternative: Comprendre le sujet comme la vision, le rêve ou le péché précédemment évoqué.
  rationale: Les formes féminines et l’antécédent ምድር, « terre », favorisent ce rattachement. Le pronom « celle-ci », plutôt qu’une répétition explicative, évite toutefois de surinterpréter une syntaxe resserrée.
- issue: Rapport entre la vision et les choses cachées
  choice: « elle concerne »
  alternative: « elle révèle » ou « elle cache »
  rationale: Le texte éthiopien juxtapose des éléments dont le rapport syntaxique est incertain. « Concerne » indique le thème de la vision sans décider si celle-ci révèle ou dissimule le péché caché.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste solennel sans archaïsmes. La traduction privilégie une équivalence optimale et signale en note les incertitudes lexicales et syntaxiques réelles.
