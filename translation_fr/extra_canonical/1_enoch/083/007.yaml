  to: 'Je lui racontai toute la vision que j’avais eue. Il me dit : « Ce que tu as vu est terrible, mon fils, et la vision de ton rêve est puissante : elle porte sur les secrets de tout le péché de la terre[a]. Celle-ci est sur le point de sombrer dans l’abîme[b] et de périr dans une grande destruction[c]. »'
