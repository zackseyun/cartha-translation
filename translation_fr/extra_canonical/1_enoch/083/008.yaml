base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: fr
  text: 'Et maintenant, mon fils, lève-toi et adresse ta supplication au Seigneur de gloire, puisque tu es fidèle, afin qu’un reste subsiste[a] sur la terre et qu’il ne détruise pas toute la terre.


    [a] Le guèze associe deux mots de même racine exprimant ce qui reste ou est épargné. « Qu’un reste subsiste » conserve cette insistance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze associe deux mots de même racine exprimant ce qui reste ou est épargné. « Qu’un reste subsiste » conserve cette insistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: lève-toi
  rationale: L’impératif exprime l’action de se lever. « Lève-toi » est naturel en français moderne tout en convenant au ton solennel de l’exhortation.
- source_word: አስተብቍዖ
  choice: adresse ta supplication
  rationale: Le verbe désigne une demande instante. Cette formulation garde le caractère formel et intercesseur de la requête sans l’aplatir en un simple « prie ».
- source_word: ለእግዚአ ስብሐት
  choice: au Seigneur de gloire
  rationale: La construction signifie littéralement « au Seigneur de gloire ». Le maintien du génitif préserve le titre divin élevé du langage apocalyptique.
- source_word: መሃይምን
  choice: fidèle
  rationale: Le terme peut évoquer la foi aussi bien que la fiabilité ou la constance. « Fidèle » maintient cette amplitude dans un contexte où l’aptitude à intercéder est en jeu.
- source_word: ይትረፍ ትራፍ
  choice: qu’un reste subsiste
  rationale: L’expression associe deux mots apparentés et insiste sur ce qui demeure après le jugement. La formulation française conserve à la fois l’idée du reste et la répétition sémantique.
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: et qu’il ne détruise pas toute la terre
  rationale: Le verbe exprime la destruction ou l’anéantissement. « Détruise » est clair, digne et suffisamment fort; « toute la terre » maintient la portée totale de l’expression.
theological_decisions:
- issue: Le terme መሃይምን met-il surtout l’accent sur la foi intérieure ou sur la fiabilité religieuse?
  choice: fidèle
  alternative: croyant; digne de confiance
  rationale: « Fidèle » laisse ouvertes les nuances de foi, de constance et de fiabilité, sans réduire le motif de l’intercession à une adhésion intellectuelle ni lui imposer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le titre formel « Seigneur de gloire » est conservé, tandis que la syntaxe demeure naturelle. La répétition de « terre » est maintenue parce qu’elle reflète la structure et la portée universelle du texte source.
