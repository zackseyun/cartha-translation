base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: fr
  text: Mon fils, du ciel tout cela viendra sur la terre[a][b], et sur la terre il y aura une grande destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Tout cela » peut aussi se comprendre plus généralement comme « tout » ou « toutes ces choses »; la forme guèze est quelque peu difficile dans ce témoin.
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, « terre » pourrait se traduire par « pays »; le cadre apocalyptique favorise ici le sens cosmique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወልድየ
  choice: Mon fils
  rationale: Le suffixe marque la possession à la première personne. Dans le contexte, l’expression fonctionne comme une adresse directe; « fils » reste plus précis que « enfant ».
- source_word: እምሰማይ
  choice: du ciel
  rationale: Rend simplement la valeur ablative et conserve l’image verticale propre à la vision apocalyptique.
- source_word: ይሄሉ
  choice: viendra
  rationale: Cette forme du verbe « être, exister » n’est pas un verbe de parole. Avec « du ciel » et « sur la terre », « viendra » exprime naturellement en français l’idée que tout cela sera ou surviendra depuis le ciel sur la terre.
- source_word: ኵሉዝ
  choice: tout cela
  rationale: Rend la totalité assortie d’une nuance déictique, tout en renvoyant naturellement au contenu de la vision. La forme du témoin demeure quelque peu difficile.
- source_word: ዲበ
  choice: sur
  rationale: Préposition naturelle en français dans ses deux occurrences avec « terre »; elle conserve le rapport spatial sans archaïsme inutile.
- source_word: ምድር
  choice: la terre
  rationale: Le cadre apocalyptique favorise le sens cosmique de « terre » plutôt que le sens local de « pays ».
- source_word: ይከውን
  choice: il y aura
  rationale: La tournure existentielle convient au groupe nominal qui suit et donne un français moderne et clair.
- source_word: ሐጕል
  choice: destruction
  rationale: Le mot désigne la ruine ou la dévastation. « Destruction » préserve l’ampleur générale du jugement sans la réduire à un contexte militaire.
- source_word: ዐቢይ
  choice: grande
  rationale: Adjectif d’intensité courant, rendu ici par le terme français le plus transparent pour indiquer l’ampleur de la destruction.
theological_decisions:
- issue: Identité de « mon fils »
  choice: Conserver littéralement l’adresse familiale « Mon fils » sans en faire un titre messianique.
  alternative: « Mon enfant » ou l’identification à une figure symbolique de la vision.
  rationale: Le verset ne permet pas d’établir l’identité du destinataire. La traduction laisse donc ouverte l’interprétation au lieu d’introduire une catégorie théologique ultérieure.
- issue: Analyse de ይሄሉ
  choice: Le comprendre comme une forme de « être, exister » et traduire contextuellement « viendra ».
  alternative: L’ancienne lecture « dira », qui ferait de « mon fils » le sujet et introduirait une citation.
  rationale: La forme ne relève pas d’un verbe de parole; la lecture alternative inventerait donc un discours direct absent du texte et méconnaîtrait vraisemblablement le vocatif.
translation_notes:
  register: Français international moderne, clair et digne. Le vocatif « Mon fils » est conservé; « viendra sur la terre » restitue naturellement le mouvement depuis le ciel sans reprendre la lecture erronée fondée sur un verbe de parole.
