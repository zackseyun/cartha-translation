base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: fr
  text: J’étais couché dans la maison de mon grand-père Mahalalel, et je vis dans une vision que le ciel s’effondrait, était emporté et tombait sur la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme guèze transmise au milieu de la phrase est incertaine. Elle semble désigner l’effondrement ou le renversement violent du ciel, ensuite emporté, plutôt que sa purification.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: J’étais couché
  rationale: La construction périphrastique, formée d’un participe et de l’auxiliaire « être », décrit un état continu à l’arrière-plan du récit plutôt que l’action ponctuelle de se coucher.
- source_word: በቤት፡ መላሕእል፡ እምሑውየ
  choice: dans la maison de mon grand-père Mahalalel
  rationale: Le locatif concret est conservé. Dans la généalogie d’Hénoch, Mahalalel est son grand-père; cette désignation naturelle en français convient donc au contexte.
- source_word: ርኢኩ፡ በራእይ
  choice: je vis dans une vision
  rationale: Cette formulation conserve le verbe de perception et l’expression explicite du mode visionnaire, malgré une légère répétition naturelle au registre apocalyptique.
- source_word: ሰማይ
  choice: le ciel
  rationale: En français, « le ciel » désigne naturellement la réalité cosmique visée ici et garde l’ampleur apocalyptique du passage.
- source_word: ይትነጻጻ
  choice: s’effondrait
  rationale: Le texte transmis paraît refléter une forme altérée ou mal transcrite d’un verbe signifiant être renversé ou s’effondrer; le contexte de la chute du ciel appuie ce sens plutôt que celui de purification.
- source_word: ወይትሀየድ
  choice: était emporté
  rationale: Le verbe exprime vraisemblablement le fait d’être arraché ou emporté. Le passif français préserve cette violence sans préciser indûment l’agent.
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: et tombait sur la terre
  rationale: L’imparfait s’accorde avec la scène en cours introduite par la vision; « sur la terre » garde l’échelle cosmique de l’image.
theological_decisions:
- issue: Référent cosmique de ሰማይ
  choice: le ciel, compris comme la réalité cosmique
  alternative: le firmament ou le ciel visible
  rationale: La vision décrit un bouleversement cosmique. Le français courant « le ciel » maintient cette portée sans imposer une cosmologie technique.
- issue: Sens de ይትነጻጻ
  choice: s’effondrait
  alternative: était purifié ou nettoyé
  rationale: La graphie de la source transcrite est incertaine, mais la correction philologique signalée et la suite « était emporté et tombait » favorisent nettement l’image d’un effondrement. L’incertitude textuelle est néanmoins indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits rendent l’état initial et le déroulement de la scène visionnaire; le passé simple « je vis » marque l’événement de perception. La répétition « vis dans une vision » est conservée afin de rester proche de la formulation guèze.
