base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: fr
  text: Et lorsqu’il tomba sur la terre, je vis la terre être engloutie dans un grand abîme[a] ; des montagnes étaient suspendues sur d’autres montagnes[b], des collines s’enfonçaient sur d’autres collines, et de hauts arbres étaient coupés de leur tronc[c], jetés à terre, puis engloutis dans l’abîme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « une grande profondeur » ou « un grand gouffre ». Le terme guèze désigne une profondeur immense ; « abîme » en préserve ici la force apocalyptique.
    reason: lexical_alternative
  - marker: b
    text: L’étrange image de montagnes suspendues sur d’autres montagnes est conservée telle quelle, plutôt que ramenée à un simple entassement.
    reason: cultural_note
  - marker: c
    text: Le texte décrit les arbres comme coupés ou tranchés de leur partie inférieure, que l’on peut rendre par « tronc » ou « souche » ; il ne dit pas explicitement qu’ils sont déracinés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቅ
  choice: il tomba
  rationale: Le sujet renvoie à l’élément de la vision mentionné dans le contexte précédent. Le passé simple rend clairement l’événement ponctuel du récit de rêve.
- source_word: ትትወሐጥ
  choice: se faire engloutir
  rationale: Cette formulation conserve la valeur passive et l’image saisissante d’une terre absorbée par une profondeur immense.
- source_word: ቀላይ ዐቢይ
  choice: un grand abîme
  rationale: « Abîme » préserve la portée cosmique et apocalyptique du terme, tandis que « grand » correspond explicitement à l’adjectif guèze.
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: des montagnes étaient suspendues au-dessus d’autres montagnes
  rationale: Le verbe évoque la suspension. La formulation conserve l’étrangeté voulue de l’image visionnaire sans la réduire à un simple entassement.
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: des collines s’enfonçaient sur d’autres collines
  rationale: « S’enfonçaient » exprime le mouvement de descente ou de submersion, tandis que « sur » maintient la relation spatiale insolite du texte.
- source_word: ዕፀወ ነዋኃት
  choice: de hauts arbres
  rationale: L’adjectif désigne la hauteur ; « de hauts arbres » est idiomatique en français moderne et garde le caractère visuel de la scène.
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: étaient coupés de leur tronc
  rationale: Le verbe signifie couper ou trancher, et non déraciner. « De leur tronc » rend avec retenue la séparation d’avec la partie inférieure ou la souche, sans introduire la notion de racines.
- source_word: ይትገደፉ
  choice: jetés à terre
  rationale: Le participe exprime une action violente de jeter ou d’abattre ; « à terre » explicite naturellement en français la direction impliquée dans la scène.
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: engloutis dans l’abîme
  rationale: La reprise d’« abîme » assure la cohérence lexicale et imagée du verset ; « engloutis » convient au mouvement de submersion.
theological_decisions:
- issue: Nature des images de catastrophe cosmique
  choice: Présenter directement l’effondrement de la création tel qu’il apparaît dans la vision
  alternative: Interpréter les montagnes, les collines et les arbres comme des symboles politiques, ou résumer la scène comme un séisme ou un déluge
  rationale: Le texte donne des images cosmiques concrètes et déstabilisantes. La traduction les conserve sans imposer une interprétation symbolique ou naturalisante.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme de la longue vision est maintenu par des propositions coordonnées, et les images apocalyptiques inhabituelles ne sont pas aplanies.
