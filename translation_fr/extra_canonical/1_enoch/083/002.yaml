base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: fr
  text: 'J’ai vu deux visions avant de me marier, et l’une ne ressemblait pas à l’autre : la première, lorsque j’apprenais le livre[a] ; la seconde, une vision puissante[b], avant d’épouser ta mère. À leur sujet[c], j’ai adressé une supplication au Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque l’on m’enseignait le livre ». Le verbe guèze peut évoquer aussi bien le fait d’apprendre que celui de recevoir un enseignement.
    reason: lexical_alternative
  - marker: b
    text: Ou « une vision forte » ou « une vision sévère ». Le terme souligne la force ou l’intensité de la vision.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « à cause d’elles » : les visions auraient alors été la raison de sa supplication.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ ራእየ
  choice: deux visions
  rationale: Rend directement les deux expériences visionnaires et conserve le registre apocalyptique.
- source_word: ርኢኩ
  choice: j’ai vu
  rationale: Formulation française simple et naturelle pour le compte rendu visionnaire.
- source_word: እንበለ፡ እንሣእ፡ ብእሲተ
  choice: avant de prendre femme
  rationale: Conserve l’idiome matrimonial de la source sans le réduire au seul verbe « se marier ».
- source_word: ወአሐዱሂ፡ እምኔሆሙ፡ ኢይትማሰል፡ ምስለ፡ ካልኡ
  choice: elles ne se ressemblaient pas
  rationale: Exprime clairement la différence entre les deux visions dans un français idiomatique.
- source_word: አመ፡ እትሜሀር፡ መጽሐፈ
  choice: pendant que j’apprenais le Livre
  rationale: Le verbe peut évoquer l’apprentissage ou l’enseignement reçu; « apprenais » garde cette ouverture relative, tandis que la majuscule signale le livre déterminé sans en préciser l’identité.
- source_word: እንበለ፡ እንሥእ፡ ለእምከ
  choice: avant que je prenne ta mère
  rationale: Préserve l’idiome matrimonial ainsi que l’adresse familiale directe.
- source_word: ራእየ፡ ጽኑዐ
  choice: une vision saisissante
  rationale: ጽኑዐ exprime la force, la fermeté ou l’intensité. « Saisissante » communique la puissance de l’expérience sans imposer l’idée de terreur.
- source_word: ወበእንቲአሆሙ፡ አስተብቋዕክዎ፡ ለእግዚእ
  choice: et, à leur sujet, j’ai adressé une supplication au Seigneur
  rationale: La préposition peut indiquer le sujet ou la cause des supplications; la formulation retenue conserve le premier sens tout en rendant la prière instante et solennelle.
theological_decisions:
- issue: Sens de ለእግዚእ dans le contexte de la prière
  choice: au Seigneur
  alternative: au Maître
  rationale: Bien que le terme puisse désigner un maître, le contexte présente Dieu comme destinataire de la supplication. « Seigneur » garde ce poids théologique sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue les deux visions tout en laissant la phrase « J’ai vu une vision saisissante » résumer ou préciser la seconde, conformément à la syntaxe quelque peu heurtée de la source. Les ambiguïtés relatives à l’apprentissage, à l’intensité de la vision et au rapport entre les visions et la supplication sont conservées en notes.
