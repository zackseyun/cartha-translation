base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: fr
  text: 'Alors Malyal, mon grand-père, me releva tandis que j’étais couché près de lui et me dit : « Pourquoi cries-tu ainsi, mon fils, et pourquoi te lamentes-tu ainsi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእያል
  choice: Malyal
  rationale: La forme du nom propre attestée dans le témoin guèze est conservée plutôt que normalisée silencieusement en « Mahalalel ».
- source_word: እምሔውየ
  choice: mon grand-père
  rationale: Le mot est compris comme un nom de parenté muni du suffixe possessif de première personne, et non comme une expression locative signifiant « de l’endroit où j’étais ».
- source_word: አንሥአኒ
  choice: me releva
  rationale: Le verbe exprime l’action de lever ou de relever quelqu’un; « me releva » convient naturellement à une personne couchée.
- source_word: እንዘ እነ እስክብ
  choice: tandis que j’étais couché
  rationale: La construction marque l’état simultané d’être étendu, sans imposer l’idée de sommeil.
- source_word: ኀቤሁ
  choice: près de lui
  rationale: La préposition indique la proximité; cette formulation reste naturelle sans préciser davantage la position.
- source_word: ትጸርኅ
  choice: cries-tu
  rationale: Le verbe désigne un cri poussé à haute voix; le français garde son intensité tout en restant distinct du verbe suivant.
- source_word: ወልድየ
  choice: mon fils
  rationale: Cette adresse familiale directe correspond au sens littéral et au contexte patriarcal.
- source_word: ትአወዩ
  choice: te lamentes-tu
  rationale: Le second verbe évoque la plainte ou la lamentation et demeure ainsi distinct du premier cri.
theological_decisions:
- issue: Identification de መላእያል
  choice: Conserver « Malyal » dans le texte
  alternative: Normaliser en « Mahalalel »
  rationale: Le témoin guèze donne cette forme du nom. La conserver respecte la source immédiate sans transformer une identification probable en certitude textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme entre « cries-tu » et « te lamentes-tu », ainsi que la répétition de « ainsi ». Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
