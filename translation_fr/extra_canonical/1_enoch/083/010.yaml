base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: fr
  text: Après cela, je me levai, je priai, je suppliai et je demandai, et je mis ma prière par écrit pour les générations du monde[a] ; je te montrerai tout[b], mon fils Mathusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toutes les générations futures » ou « pour les générations à jamais » ; l’expression guèze peut désigner les générations qui se succèdent au-delà de l’époque présente.
    reason: lexical_alternative
  - marker: b
    text: 'La forme transmise est difficile : prise telle quelle, elle peut se lire « il t’a tout montré ». Les éditions critiques la corrigent vraisemblablement en une forme de première personne : « je te montrerai tout ».'
    reason: textual_grammatical_uncertainty
lexical_decisions:
- source_word: እምኔሁ
  choice: Après cela
  rationale: Marque naturellement la transition temporelle après la vision, tout en restant proche du guèze.
- source_word: ተንሣእኩ
  choice: je me levai
  rationale: Conserve la réaction corporelle et le registre narratif soutenu sans archaïsme excessif.
- source_word: ጸለይኩ ወአስተብቋዕኩ ወሰአልኩ
  choice: je priai, je suppliai et je demandai
  rationale: Maintient l’accumulation de trois actes distincts de prière et de requête au lieu de les fondre en une seule expression.
- source_word: ጸሎትየ ጸሐፍኩ
  choice: Je mis ma prière par écrit
  rationale: Expression française naturelle qui rend explicitement l’acte de consigner la prière.
- source_word: ለትውልደ ዓለም
  choice: pour les générations du monde
  rationale: Rendu transparent de la formulation guèze; la note conserve les nuances possibles de durée et de postérité.
- source_word: ኵሎ
  choice: tout
  rationale: Rend de manière idiomatique la totalité de ce qui est montré.
- source_word: አርአየከ
  choice: je t’ai tout montré
  rationale: Suit la compréhension à la première personne adoptée par la couche de consultation et s’accorde avec la suite de verbes au passé; la forme transmise étant difficile, l’incertitude est signalée en note.
- source_word: ወልድየ ማቱሳላ
  choice: mon fils Mathusalem
  rationale: Forme française courante du nom biblique et ordre naturel de l’apostrophe.
theological_decisions:
- issue: Portée de ለትውልደ ዓለም
  choice: pour les générations du monde
  alternative: pour toutes les générations futures; pour les générations à jamais
  rationale: Le terme ዓለም peut évoquer le monde, l’âge ou une durée indéfinie. Le texte principal reste proche du témoin sans imposer une portée eschatologique précise.
- issue: Temps et personne de አርአየከ
  choice: je t’ai tout montré
  alternative: je te montrerai tout; il t’a tout montré
  rationale: Le contexte et la tradition de traduction favorisent une parole d’Hénoch à Mathusalem à la première personne. Toutefois, la forme transmise peut soulever une difficulté grammaticale ou textuelle; la note préserve cette incertitude au lieu de la dissimuler.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration littéraire; la répétition des verbes de prière est volontairement conservée. Les ambiguïtés de la formule sur les générations et de la dernière forme verbale sont signalées sans trancher silencieusement.
