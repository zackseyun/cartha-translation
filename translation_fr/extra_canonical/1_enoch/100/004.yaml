revisions:
- from: En ces jours-là, les anges descendront dans les lieux cachés[b] et rassembleront en un seul lieu tous ceux qui ont aidé le péché[a]. Alors, en ce jour de jugement, le Très-Haut se lèvera pour exercer un grand jugement au milieu des pécheurs.
  to: En ces jours-là, les anges descendront dans les lieux cachés[b] et rassembleront en un seul lieu tous ceux qui ont favorisé le péché[a] ; et le Très-Haut se lèvera en ce jour de jugement pour exercer un grand jugement au milieu des pécheurs.
  rationale: La révision remplace le calque français peu naturel « aidé le péché » par « favorisé le péché », qui préserve l’idée d’une participation active à la promotion du péché sans introduire des personnes que le texte ne nomme pas. Elle maintient explicitement en note l’incertitude entre la leçon manuscrite attestée et la forme problématique de la transcription fournie. Le reste de la formulation est conservé, avec une coordination plus fidèle au source.
