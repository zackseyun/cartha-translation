  verdict: revise
  source_fidelity: 'La structure du verset est bien rendue : descente des anges, rassemblement en un lieu, intervention du Très-Haut au jour du jugement et grand jugement parmi les pécheurs. La relative concernant le péché demeure textuellement difficile. La traduction doit suivre la leçon manuscrite attestée qui exprime l’aide apportée au péché, tout en signalant l’alternative que paraît suggérer la forme transcrite dans le texte de référence.'
  naturalness: « Aider le péché » est possible comme calque explicatif, mais demeure peu naturel en français moderne et risque d’être obscur. « Favoriser le péché » est idiomatique, conserve l’idée d’une action qui soutient ou propage le péché, et n’ajoute pas explicitement l’objet « les autres ». La suppression de « Alors » évite d’ajouter une articulation temporelle plus forte que la simple coordination du source.
  terminology: « Le Très-Haut », « jour de jugement », « grand jugement » et « pécheurs » sont fidèles, naturels et de registre approprié. « Lieux cachés » convient bien à ምኅባእት; la note conserve les possibilités lexicales voisines.
  issues:
