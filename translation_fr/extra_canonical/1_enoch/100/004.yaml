base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: fr
  text: En ces jours-là, les anges descendront dans les lieux cachés[b] et rassembleront en un seul lieu tous ceux qui ont favorisé le péché[a] ; et le Très-Haut se lèvera en ce jour de jugement pour exercer un grand jugement au milieu des pécheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La clause est difficile. Une leçon manuscrite attestée peut se comprendre : « tous ceux qui ont aidé le péché ». La forme transcrite dans le texte de référence pourrait aussi évoquer « ceux qui ont fait descendre le péché » ou « ceux par qui le péché est descendu ».'
    reason: textual_and_lexical_alternative
  - marker: b
    text: Ou « les lieux secrets » ou « les endroits dissimulés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Conserve la formule temporelle apocalyptique et l’image répétée des « jours ».
- source_word: መላእክት
  choice: les anges
  rationale: Dans cette scène de jugement apocalyptique, il s’agit naturellement d’êtres célestes plutôt que de messagers humains.
- source_word: ይወርዱ
  choice: descendront
  rationale: Préserve le mouvement vertical associé à la venue des anges.
- source_word: ውስተ ምኅባእት
  choice: dans les lieux cachés
  rationale: Rend le sens local pluriel sans préciser indûment la nature de ces endroits dissimulés.
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: et rassembleront en un seul lieu
  rationale: Exprime à la fois le rassemblement et sa destination commune dans un français naturel.
- source_word: ለእሉ እለ ይወርደዋ ለኃጢአት
  choice: tous ceux qui ont aidé le péché
  rationale: Le texte fourni porte une leçon difficile évoquant littéralement une descente, tandis que la tradition manuscrite signalée lit un verbe signifiant « aider ». La formulation retenue suit cette leçon attestée sans ajouter l’objet « les autres », absent de la clause.
- source_word: ወይትነሣእ ልዑል
  choice: le Très-Haut se lèvera
  rationale: Conserve à la fois le titre divin consacré et l’entrée en action exprimée par le verbe.
- source_word: በይእቲ ዕለት ኵነኔ
  choice: en ce jour de jugement
  rationale: Préserve la formule solennelle et le substantif explicite « jugement ».
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: pour exercer un grand jugement
  rationale: Formulation judiciaire idiomatique qui maintient la répétition du mot « jugement ».
- source_word: እማእከሎሙ ለኃጥኣን
  choice: au milieu des pécheurs
  rationale: Conserve l’image spatiale et publique du jugement plutôt que de la réduire à un simple « parmi ».
theological_decisions:
- issue: Identité de ceux que les anges rassemblent
  choice: Des personnes ayant « aidé le péché »
  alternative: Ceux qui ont fait descendre le péché ; ceux par qui le péché est descendu ; ceux qui ont entraîné les autres dans le péché
  rationale: La clause et son histoire textuelle sont difficiles. La traduction ne réduit pas ce groupe à l’ensemble indifférencié des pécheurs et n’ajoute pas explicitement des personnes entraînées dans le péché.
- issue: Titre divin ልዑል
  choice: le Très-Haut
  alternative: l’Exalté
  rationale: « Le Très-Haut » est le titre divin français le plus clair et le plus établi ici, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste solennelle sans archaïsmes. L’ambiguïté textuelle de la clause relative au péché est signalée en note plutôt que résolue silencieusement.
