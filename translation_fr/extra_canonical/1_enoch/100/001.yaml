base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: fr
  text: En ces jours-là, en un lieu[a], des pères avec leurs fils seront abattus[b], et des frères avec leurs compagnons tomberont morts, jusqu’à ce qu’un torrent coule de leur sang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation guèze correspondant à « en un lieu » est difficile dans le témoin transcrit; cette traduction locative demeure prudente.
    reason: textual_variant
  - marker: b
    text: La transcription porte une forme probablement issue d’une erreur de lecture; la forme corrigée signifie « seront frappés » ou « seront abattus », et non « se frapperont les uns les autres ».
    reason: textual_variant
  - marker: c
    text: L’image exprime une effusion de sang si abondante qu’elle forme un torrent.
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique traditionnelle, rendue dans un français actuel tout en conservant sa solennité.
- source_word: በ፻መካን
  choice: en un même lieu
  rationale: La forme transmise est difficile, mais paraît avoir un sens locatif singulier. « En un même lieu » exprime prudemment le rassemblement dans un lieu sans préciser davantage l’expression incertaine.
- source_word: አበው ምስለ ውሉዶሙ
  choice: des pères avec leurs fils
  rationale: La relation familiale masculine explicite est conservée; « fils » évite d’élargir indûment le sens à tous les enfants.
- source_word: ይትኃድኡ (probablement lecture fautive pour ይትጐድኡ)
  choice: seront abattus
  rationale: La correction paléographique signalée donne un passif du verbe « frapper, abattre ». Le français garde ce passif et ne transforme pas la scène en violence réciproque.
- source_word: አኀው ምስለ ቢጾሙ
  choice: des frères avec leurs compagnons
  rationale: « Frères » conserve le terme familial, tandis que « compagnons » rend la relation sociale assez large du second nom.
- source_word: ይወድቁ በሞት
  choice: tomberont dans la mort
  rationale: Cette formulation conserve l’image et la gravité de l’idiome guèze, plutôt que de l’aplatir en « mourront ».
- source_word: እስከ ይውኅዝ ትክዚ እምደመ ዚአሆሙ
  choice: jusqu’à ce qu’un torrent coule de leur sang
  rationale: La formulation maintient l’image apocalyptique concrète et l’ordre de l’expression source, sans la convertir explicitement en comparaison.
theological_decisions:
- issue: Nature de la scène de violence
  choice: Effondrement social concret exprimé par une hyperbole apocalyptique
  alternative: Conflit purement métaphorique ou description strictement militaire
  rationale: Le texte décrit la mort de proches et une abondance de sang. La traduction conserve cette violence concrète tout en laissant au langage apocalyptique sa force rhétorique, sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe conserve le parallélisme entre pères et fils, puis frères et compagnons. Les expressions « tomberont dans la mort » et « un torrent coule de leur sang » gardent l’intensité inhabituelle du registre apocalyptique sans paraphrase confessionnelle.
