base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: fr
  text: Malheur à vous, gens au cœur endurci, qui restez éveillés pour tramer le mal[a] ! La peur vous atteindra[b], et il n’y aura personne pour vous secourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi évoquer le fait de veiller, d’être vigilant ou de guetter ; l’idée est ici celle d’une attention volontaire dirigée vers le mal.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous rattrapera ». Le verbe sous-jacent peut signifier « trouver », « atteindre » ou « rattraper ».
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Malheur
  rationale: Introduit une dénonciation prophétique et conserve la force de la formule de jugement apocalyptique.
- source_word: ግዙፋነ ልብ
  choice: gens au cœur endurci
  rationale: Expression française naturelle qui rend l’obstination intérieure et l’insensibilité morale de l’expression guèze.
- source_word: ትተግሁ
  choice: restez éveillés
  rationale: Le verbe évoque le fait d’être éveillé, vigilant ou attentif. Dans ce contexte, il décrit une vigilance volontaire mise au service du mal, sans introduire l’image moderne d’une sentinelle.
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: pour tramer le mal
  rationale: La construction exprime le but. « Tramer » communique ici l’idée d’une réflexion délibérée tournée vers une action mauvaise.
- source_word: ፍርሀት
  choice: la peur
  rationale: Choix large et direct, qui n’intensifie pas indûment le terme en « terreur » ou « épouvante ».
- source_word: ይረክብክሙ
  choice: vous atteindra
  rationale: Le verbe peut signifier trouver, atteindre ou rattraper. « Atteindra » reste proche de cette gamme sémantique tout en étant naturel en français.
- source_word: ወአልቦ ዘይረድአክሙ
  choice: et il n’y aura personne pour vous secourir
  rationale: Rend clairement l’absence totale d’aide ou de délivrance annoncée dans l’oracle.
theological_decisions:
- issue: Nature de la dénonciation
  choice: Un malheur prophétique prononcé contre des personnes moralement endurcies qui font délibérément le mal et subiront un jugement auquel elles ne pourront échapper
  alternative: Une simple lamentation sur les pécheurs ou un avertissement psychologique au sujet de l’anxiété
  rationale: L’interjection initiale, la description morale des destinataires et l’absence finale de secours constituent ensemble un oracle judiciaire, sans qu’il soit nécessaire d’identifier plus précisément l’agent ou la forme du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton accusateur et apocalyptique du verset, ainsi que les ambiguïtés lexicales relatives à la vigilance et au fait d’être atteint ou rattrapé.
