base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: fr
  text: Malheur à vous, pécheurs, à cause des paroles de votre bouche et des œuvres de vos mains, accomplies par votre impiété[a] ! Vous brûlerez dans l’ardeur d’une flamme plus brûlante que le feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction éthiopienne est difficile. La proposition peut désigner les paroles et les œuvres comme les produits de l’impiété des pécheurs ; elle pourrait aussi être rattachée plus étroitement aux seules œuvres de leurs mains.
    reason: ambiguïté syntaxique
  - marker: b
    text: 'Le texte exprime apparemment une comparaison : « une flamme plus brûlante que le feu ». On a aussi traduit : « dans les flammes ardentes du feu ».'
    reason: variante de traduction
lexical_decisions:
- source_word: አሌ፡ ለክሙ፡ ኃጥኣን
  choice: Malheur à vous, pécheurs
  rationale: « Malheur » conserve la formule solennelle de dénonciation et de jugement, tandis que « pécheurs » rend directement la désignation morale.
- source_word: ዲበ፡ ነገረ፡ አፉክሙ
  choice: à cause des paroles de votre bouche
  rationale: La formulation garde la valeur causale de ዲበ et l’image concrète de la bouche, en parallèle avec celle des mains.
- source_word: ወዲበ፡ ተግባረ፡ እዴክሙ
  choice: et des œuvres de vos mains
  rationale: « Œuvres » convient au registre biblique sans être archaïque et préserve le parallélisme bouche/mains.
- source_word: እለ፡ ገብረ፡ ርስዓኒክሙ
  choice: accomplies par votre impiété
  rationale: Cette tournure rattache prudemment la proposition difficile aux paroles et aux œuvres qui précèdent. « Impiété » maintient à la fois la faute morale et sa dimension religieuse.
- source_word: በዋዕየ፡ ላህብ፡ እምእሳት
  choice: dans l’ardeur d’une flamme plus brûlante que le feu
  rationale: Le choix conserve l’intensité de l’image et la force comparative de እም, sans réduire la formulation à de simples « flammes de feu ».
- source_word: ይውዒ
  choice: vous brûlerez
  rationale: Le texte transmis dans la demande présente une difficulté de personne verbale, mais la lecture critique signalée soutient la deuxième personne du pluriel, cohérente avec l’adresse « à vous ».
theological_decisions:
- issue: Rendre ርስዓኒክሙ comme faute morale générale ou comme rébellion à dimension religieuse
  choice: votre impiété
  alternative: votre méchanceté
  rationale: « Impiété » préserve la dimension religieuse et morale du terme sans introduire une catégorie doctrinale ultérieure.
- issue: Rapport syntaxique de la proposition « accomplie(s) par votre impiété »
  choice: la rattacher aux paroles et aux œuvres précédentes
  alternative: la rattacher seulement aux œuvres des mains
  rationale: La syntaxe est difficile. Le pluriel français « accomplies » permet de comprendre que l’impiété produit l’ensemble des paroles et des actes, tout en signalant cette lecture en note.
- issue: Nature de la comparaison entre la flamme et le feu
  choice: plus brûlante que le feu
  alternative: flamme de feu ardente
  rationale: La comparaison est maintenue au lieu d’être nivelée en simple intensification, conformément à la valeur comparative attestée de እም dans ce contexte.
translation_notes:
  register: Français international moderne, solennel et accessible. Le parallélisme concret entre la bouche et les mains est conservé. La ponctuation sépare nettement le motif du jugement de son annonce, tandis que les notes préservent les difficultés syntaxique et comparative du guèze.
