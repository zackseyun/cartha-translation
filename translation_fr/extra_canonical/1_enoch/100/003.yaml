  source_fidelity: 'Le texte français rend fidèlement les deux propositions du guèze : le cheval « avancera » (verbe de marche/mouvement), dans le sang des pécheurs, jusqu’à sa poitrine, puis les chars s’enfonceront jusqu’à leur partie supérieure. Il conserve le singulier générique de ፈረስ et le pluriel de ሰረገላት. Il évite à juste titre l’harmonisation injustifiée avec les « mors » d’Apocalypse 14.20 signalée dans l’ancienne piste anglaise.'
