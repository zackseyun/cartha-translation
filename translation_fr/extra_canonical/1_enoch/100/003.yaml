  terminology: « Poitrail » est le terme français usuel et approprié pour la poitrine d’un cheval. « Pécheurs » restitue sans surcharge doctrinale la catégorie morale ኃጥኣን. « Chars » convient bien à ሰረገላት dans ce contexte ancien et visionnaire.
