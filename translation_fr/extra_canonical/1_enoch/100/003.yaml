base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: fr
  text: Un cheval avancera dans le sang des pécheurs jusqu’au poitrail, et les chars s’y enfonceront jusqu’à leur sommet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à sa poitrine ». Pour un cheval, le français dit naturellement « jusqu’au poitrail ». Cette leçon ne doit pas être harmonisée avec l’image du sang montant jusqu’aux mors des chevaux en Apocalypse 14.20.'
    reason: lexical_clarification_and_cross_reference
lexical_decisions:
- source_word: ወየሐውር
  choice: avancera
  rationale: La forme verbale issue de ሐወረ exprime le fait d’aller ou de marcher. « Avancera » restitue naturellement le mouvement du cheval dans le sang sans ajouter l’idée plus précise de patauger.
- source_word: ፈረስ
  choice: un cheval
  rationale: Le guèze emploie ici le singulier. Le français le conserve, conformément à la donnée textuelle et à la révision source.
- source_word: እስከ እንግድዓሁ
  choice: jusqu’au poitrail
  rationale: እስከ marque la limite atteinte et እንግድዓሁ désigne sa poitrine. Pour un cheval, « poitrail » est le terme anatomique français naturel et évite l’harmonisation avec les « mors » d’Apocalypse 14.20.
- source_word: ውስተ ደመ ኃጥኣን
  choice: dans le sang des pécheurs
  rationale: Traduction directe de la relation locative et du pluriel moral ኃጥኣን, dont « pécheurs » préserve la portée éthique.
- source_word: ሰረገላት
  choice: les chars
  rationale: Le pluriel désigne des chars; « chars » est plus naturel que « chariots » dans cette scène de déplacement et de jugement.
- source_word: እስከ መልዕልታ
  choice: jusqu’à leur sommet
  rationale: L’expression indique la hauteur ou la partie supérieure des chars, c’est-à-dire le degré extrême d’immersion.
- source_word: ትሰጠም
  choice: s’y enfonceront
  rationale: Dans ce contexte liquide, le verbe décrit les chars qui s’enfoncent ou sombrent. Le pronom « y » rend explicite en français le milieu déjà nommé sans en changer le référent.
theological_decisions:
- issue: Catégorie morale exprimée par ኃጥኣን
  choice: pécheurs
  alternative: coupables ; transgresseurs
  rationale: « Pécheurs » rend directement la catégorie morale du texte et convient au contexte de jugement, sans lui imposer une nuance exclusivement judiciaire.
- issue: Rapport possible avec Apocalypse 14.20
  choice: préserver l’image propre au texte avec « poitrail »
  alternative: harmoniser avec « mors »
  rationale: Le parallèle thématique ne justifie pas de remplacer le terme anatomique guèze par l’équipement équestre mentionné dans l’Apocalypse.
translation_notes:
  register: Français international moderne, sobre et imagé. Le futur prophétique et l’hyperbole du jugement sont conservés. « Poitrail » apporte la précision anatomique requise sans être technique au point de gêner la lecture.
