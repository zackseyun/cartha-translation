  naturalness: « Des gardiens sur tous les justes » est compréhensible mais peu idiomatique en français moderne. « Des gardiens chargés de veiller sur » exprime naturellement la relation de protection. L’image « comme la prunelle de l’œil » est la forme française usuelle et garde la concrétude de l’original.
  terminology: « Anges saints », « justes », « saints », « gardiens » et « long sommeil » sont appropriés. « Saints » reste ici une désignation descriptive du groupe, sans imposer un sens ecclésial. La note a actuelle n’éclaire pas une ambiguïté réelle dans la traduction retenue et présente comme alternative une reformulation de sens identique.
