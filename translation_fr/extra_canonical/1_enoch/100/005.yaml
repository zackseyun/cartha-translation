base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: fr
  text: Il désignera, parmi les anges saints, des gardiens chargés de veiller sur tous les justes et les saints, et ils les garderont comme la prunelle de l’œil, jusqu’à ce que tout mal et tout péché prennent fin. Même si les justes dorment d’un long sommeil[b], ils n’auront rien à craindre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Le « long sommeil » désigne probablement la mort ou l’état des morts, mais le texte conserve l’euphémisme du sommeil.
    reason: alternative_lexicale
lexical_decisions:
- source_word: ዐቀብተ
  choice: des gardiens
  rationale: Le nom vient de la racine « garder, protéger ». « Gardiens » exprime ici la fonction protectrice sans l’assimiler au terme technique énochien désignant les Veilleurs.
- source_word: ይሁብ
  choice: il établira
  rationale: Le sens littéral est « il donnera », mais avec des gardiens placés sur des personnes, le français idiomatique demande « établir » ou « assigner ».
- source_word: ጻድቃን ወቅዱሳን
  choice: les justes et les saints
  rationale: Les deux termes sont conservés comme substantifs coordonnés, ce qui respecte la distinction lexicale du guèze et désigne la communauté humaine protégée.
- source_word: እመላእክት ቅዱሳን
  choice: parmi les anges saints
  rationale: La préposition indique que les gardiens sont choisis au sein des anges saints. L’ordre français évite de rattacher ce groupe aux justes et aux saints.
- source_word: የዐቅብዎሙ
  choice: ils les garderont
  rationale: La répétition de la racine de la garde est maintenue afin de préserver le motif protecteur du verset.
- source_word: ከመ ብንተ ዐይን
  choice: comme la pupille de l’œil
  rationale: Cette formulation concrète conserve l’image de la partie de l’œil protégée avec le plus grand soin, sans remplacer automatiquement l’expression par l’idiome biblique traditionnel.
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: jusqu’à ce que tout mal et tout péché prennent fin
  rationale: La tournure laisse le sujet implicite ou neutre, conformément au texte transmis, et exprime l’achèvement sans préciser indûment son mécanisme.
- source_word: እመኒ
  choice: même si
  rationale: 'La locution marque une concession : la promesse demeure valable jusque dans l’éventualité du long sommeil.'
- source_word: ይነውሙ ጻድቃን ንዋመ ነዋኅ
  choice: les justes dorment d’un long sommeil
  rationale: Le langage du sommeil et la construction intensive sont conservés, sans transformer dans le corps du texte cette image probablement funéraire en mention explicite de la mort.
- source_word: አልቦ ዘይፈረሁ
  choice: ils n’auront rien à craindre
  rationale: Formulation française naturelle qui rend l’absence de toute cause ou de tout objet de crainte.
theological_decisions:
- issue: Protection angélique littérale ou simple métaphore générale de la sollicitude divine
  choice: Le texte principal conserve des gardiens choisis parmi les anges saints.
  alternative: Comprendre les anges comme une image générale de la protection divine.
  rationale: Le guèze nomme explicitement les anges saints; la traduction préserve donc l’univers apocalyptique du passage sans le démythologiser.
- issue: Sens du « long sommeil »
  choice: Conserver l’image du sommeil dans le texte principal.
  alternative: Traduire directement par « mourir » ou « dormir dans la mort ».
  rationale: Le texte emploie le sommeil, vraisemblablement comme euphémisme de la mort ou de l’état des morts. Le maintien de l’image préserve son ambiguïté et sa tension théologique.
- issue: Sujet de la fin de tout mal et de tout péché
  choice: Employer la tournure intransitive « prennent fin ».
  alternative: « Jusqu’à ce qu’il mette fin à tout mal et à tout péché. »
  rationale: La forme source permet de ne pas expliciter l’agent. La traduction évite donc d’ajouter un sujet divin qui n’est pas exprimé sans ambiguïté dans ce segment.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe distingue clairement la communauté humaine des gardiens angéliques. L’image de la pupille et l’euphémisme du sommeil sont conservés; aucune terminologie confessionnelle particulière n’est ajoutée.
