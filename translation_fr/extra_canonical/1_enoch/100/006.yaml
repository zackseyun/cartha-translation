base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: fr
  text: Et les sages verront[a] ; tous les enfants de la terre comprendront tout ce dont parle ce livre, et ils sauront que leur richesse ne peut pas les sauver de la ruine causée par leurs péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme placé avant « verront » est difficile à interpréter. On peut aussi traduire : « En vérité, les sages verront » ou « les sages verront la vérité ».'
    reason: lexical_ambiguity
  - marker: b
    text: 'Littéralement, selon une autre manière de comprendre le rapport entre les mots : « dans la ruine de leurs péchés » ou « lors de l’effondrement dû à leurs péchés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙነ፡ ይሬእዩ፡ ሰብአ፡ ጠቢባን
  choice: les sages verront
  rationale: Le groupe désigne clairement des personnes sages qui verront ou discerneront. La fonction exacte de እሙነ est incertaine dans cette leçon ; le texte principal évite donc d’ajouter un complément contestable, tandis que la note conserve les principales possibilités.
- source_word: ውሉደ፡ ምድር
  choice: les enfants de la terre
  rationale: Cette traduction conserve l’expression anthropologique et le registre apocalyptique caractéristiques du livre, sans l’aplanir en « habitants de la terre ».
- source_word: ኵሎ፡ ነገረ፡ ዛቲ፡ መጽሐፍ
  choice: tout ce dont parle ce livre
  rationale: ነገር peut désigner une parole, une chose, une affaire ou un sujet. Cette formulation française naturelle maintient la portée large de l’expression.
- source_word: ያእምሩ
  choice: ils sauront
  rationale: Le verbe exprime ici la connaissance ou la prise de conscience qui découle de la compréhension du livre.
- source_word: ብዕሎሙ
  choice: leur richesse
  rationale: Le nom désigne leurs biens ou leur richesse et constitue le sujet de l’incapacité à sauver ; il ne s’agit pas d’un pronom réfléchi.
- source_word: አድኅኖቶሙ
  choice: les sauver
  rationale: Le terme exprime la délivrance ou le salut des personnes concernées. Avec « leur richesse » comme sujet, « les sauver » rend clairement la syntaxe.
- source_word: በመዳቀ፡ ኃጢአቶሙ
  choice: de la ruine causée par leurs péchés
  rationale: መዳቀ renvoie à l’effondrement, l’écrasement ou la ruine, et non au déni. La formulation choisie exprime naturellement en français le lien entre leurs péchés et leur ruine sans identifier cette ruine avec l’anéantissement des péchés eux-mêmes.
theological_decisions:
- issue: La nature du salut impossible dans la dernière proposition
  choice: Leur richesse ne peut les délivrer de la ruine causée par leurs péchés.
  alternative: Ils ne peuvent pas se sauver eux-mêmes en niant ou en abandonnant leurs péchés.
  rationale: La lecture retenue respecte ብዕሎሙ, « leur richesse », comme sujet, ainsi que መዳቀ au sens de ruine ou d’écrasement. Elle présente donc l’impuissance des biens face aux conséquences du péché, sans importer l’idée de déni ni opposer artificiellement repentance et salut.
- issue: La valeur de እሙነ au début du verset
  choice: Ne pas expliciter ce terme dans le texte principal.
  alternative: « En vérité, les sages verront » ou « les sages verront la vérité ».
  rationale: La forme peut être comprise adverbialement ou être rattachée à l’idée de vérité, mais sa fonction exacte dans cette leçon est discutée. Une note signale l’ambiguïté au lieu de la résoudre dogmatiquement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme coordonné de la phrase source est conservé, tandis que « tout ce dont parle ce livre » évite le calque peu naturel « toute affaire de ce livre ». Les expressions apocalyptiques « les sages » et « les enfants de la terre » sont maintenues.
