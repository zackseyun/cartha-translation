  - marker: b
    text: 'Littéralement, selon une autre manière de comprendre le rapport entre les mots : « dans la ruine de leurs péchés » ou « lors de l’effondrement dû à leurs péchés ».'
    reason: lexical_alternative
  revision_rationale: Aucune correction sûre n’est nécessaire. Le projet intègre les deux corrections philologiques majeures du dossier d’audit — « leur richesse » et l’idée de ruine plutôt que le déni des péchés — tout en signalant honnêtement les ambiguïtés restantes.
