base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: fr
  text: Malheur à vous, pécheurs, lorsque vous opprimez[a] les justes au jour d’une détresse terrible[b] et que vous les brûlez par le feu ! Alors, vous serez rétribués selon vos actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « opprimez » peut aussi signifier « affligez » ou « persécutez », selon la manière dont on comprend plus précisément les violences exercées contre les justes.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne littéralement un jour marqué par une affliction d’une grande intensité. « Jour d’une puissante tribulation » est également possible, mais « détresse terrible » évite d’employer ici « tribulation » comme terme eschatologique technique.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Malheur à vous
  rationale: Formule prophétique directe de condamnation, naturelle en français biblique moderne et fidèle à la force de l’exclamation.
- source_word: ኃጥኣን
  choice: pécheurs
  rationale: Conserve la désignation morale et religieuse du texte, sans la réduire à la seule idée d’injustice sociale.
- source_word: ሶበ
  choice: lorsque
  rationale: Introduit naturellement la circonstance temporelle dans laquelle se produit l’oppression.
- source_word: ታመኒድብዎሙ
  choice: vous opprimez
  rationale: Exprime les mauvais traitements violents et prolongés, tout en laissant ouvertes les nuances « affliger » et « persécuter ».
- source_word: ጻድቃን
  choice: les justes
  rationale: Terme français courant dans le registre biblique pour cette catégorie éthique majeure de la littérature hénochique.
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: au jour d’une détresse terrible
  rationale: Rend le jour caractérisé par une affliction d’une grande intensité sans recourir au terme eschatologique potentiellement technique « tribulation ».
- source_word: ታነድድዎሙ፡ በእሳት
  choice: vous les brûlez par le feu
  rationale: Préserve l’image concrète et brutale du texte source.
- source_word: ወትትፈደዩ
  choice: vous recevrez ce que méritent
  rationale: Rend clairement l’idée de rétribution adressée aux pécheurs, dans un français actuel, sans préciser un agent que le texte ne nomme pas.
- source_word: ከመ፡ ምግባራቲክሙ
  choice: vos actes
  rationale: Conserve la correspondance morale entre la conduite des pécheurs et leur rétribution.
theological_decisions:
- issue: Nature et agent de la rétribution finale
  choice: Les pécheurs directement interpellés recevront une rétribution correspondant à leurs actes, sans que son agent soit nommé.
  alternative: Comprendre la proposition comme une affirmation impersonnelle de la rétribution, ou rattacher celle-ci à la calamité du jour elle-même.
  rationale: La suite des formes verbales à la deuxième personne soutient la continuité de l’adresse directe. La formulation française affirme la rétribution sans attribuer explicitement son exécution à Dieu ni en fixer le mécanisme.
translation_notes:
  register: Français international moderne, digne et direct, avec une tonalité prophétique. « Les justes » maintient la continuité du vocabulaire biblique, tandis que « détresse terrible » évite de transformer une expression locale en terme eschatologique technique. Le point d’exclamation marque la fin de la scène violente avant l’annonce solennelle de la rétribution.
