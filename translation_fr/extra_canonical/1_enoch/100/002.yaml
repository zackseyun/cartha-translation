revisions:
- from: Car un homme ne retiendra pas sa main loin de ses fils[a], ni des fils de ses fils, mais cherchera à les tuer ; et le pécheur ne retiendra pas sa main loin de son frère honoré[b]. De l’aube jusqu’au coucher du soleil, ils s’entretueront.
  to: Car un homme ne retiendra pas sa main contre ses fils[a], ni contre les fils de ses fils, pour les tuer ; et le pécheur ne retiendra pas sa main contre son frère honoré[b]. De l’aube jusqu’au coucher du soleil, ils s’entretueront.
  rationale: La révision remplace une construction calquée et maladroite par « ne retiendra pas sa main contre », qui conserve l’image concrète de la main et rend explicitement son orientation hostile. Elle supprime aussi l’ajout interprétatif « mais cherchera à », tout en préservant le but meurtrier, la structure répétitive des relations familiales et la réciprocité finale.
