base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: fr
  text: Car un homme ne retiendra pas sa main contre ses fils[a], ni contre les fils de ses fils, pour les tuer ; et le pécheur ne retiendra pas sa main contre son frère honoré[b]. De l’aube jusqu’au coucher du soleil, ils s’entretueront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses enfants » ; le terme guèze peut désigner plus largement les enfants et non seulement les fils.
    reason: lexical_alternative
  - marker: b
    text: Ou « son frère noble » ; le terme peut souligner soit l’honneur personnel, soit le rang social.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: ne retiendra pas sa main
  rationale: Conserve l’image concrète de la main que rien ne retient, tout en restant idiomatique en français.
- source_word: እምውሉዱ
  choice: loin de ses fils
  rationale: Reproduit la construction avec « de » et garde la désignation familiale concrète ; une portée plus large, « enfants », demeure possible.
- source_word: ውሉደ ውሉዱ
  choice: des fils de ses fils
  rationale: Préserve la répétition et la cadence généalogique du guèze plutôt que de les condenser en « petits-enfants ».
- source_word: ከመ ይቅትሎ
  choice: mais cherchera à les tuer
  rationale: Exprime naturellement le but meurtrier lié à la main non retenue ; « mais » explicite légèrement en français le mouvement syntaxique sans modifier la scène.
- source_word: ኃጥእ
  choice: le pécheur
  rationale: Rend la catégorie morale singulière et représentative propre au langage de jugement hénochique.
- source_word: እኍሁ ክቡር
  choice: son frère honoré
  rationale: « Honoré » conserve le champ de l’honneur et de la dignité sans imposer l’idée plus étroite d’un rang nobiliaire.
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: De l’aube jusqu’au coucher du soleil
  rationale: Garde l’étendue complète du jour et l’image solaire du texte source dans une formulation française naturelle.
- source_word: ይትቃተሉ
  choice: ils s’entretueront
  rationale: Rend avec concision la réciprocité et l’issue meurtrière du verbe, plus fortement que « ils se combattront ».
theological_decisions:
- issue: Portée de la violence décrite
  choice: Le verset décrit un effondrement social où même les liens familiaux et l’honneur dû au frère ne retiennent plus le meurtre.
  alternative: Limiter la scène à la guerre, ou considérer les termes familiaux comme une simple hyperbole proverbiale.
  rationale: La répétition précise des fils, des fils des fils et du frère doit rester visible ; elle porte la tension théologique du jugement à travers la destruction des solidarités naturelles.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien de la cadence apocalyptique et des répétitions familiales. La formulation évite d’atténuer la violence réciproque et conserve les ambiguïtés lexicales en notes.
