base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: fr
  text: Et maintenant[a], sachez que vos actes seront examinés au ciel par les anges, le soleil, la lune et les étoiles[b], à cause de vos péchés, car, sur la terre, vous prononcez des jugements contre les justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule guèze peut aussi se rendre par « Et maintenant, comprenez bien » ; la particule finale peut renforcer la transition.
    reason: lexical_ambiguity
  - marker: b
    text: La construction peut aussi signifier qu’une enquête sera menée auprès des anges, du soleil, de la lune et des étoiles, qui seraient alors invoqués comme témoins, plutôt qu’ils ne mèneraient eux-mêmes l’enquête.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Et maintenant
  rationale: Cette formule marque une transition dans le discours. « Et maintenant » en conserve naturellement le mouvement sans donner un poids excessif à la particule finale.
- source_word: አእምሩ
  choice: sachez
  rationale: Impératif pluriel du verbe « savoir, connaître, comprendre ». « Sachez » convient à une admonestation adressée à plusieurs personnes et reste direct en français moderne.
- source_word: ይትኀሠሥ፡ ምግባሪክሙ
  choice: vos actes feront l’objet d’une enquête
  rationale: Cette formulation rend l’idée d’un examen ou d’une recherche portant sur les actes, tout en évitant de préciser un sujet personnel que la construction guèze ne nomme pas clairement.
- source_word: በእንተ፡ ኃጢአቲክሙ
  choice: au sujet de vos péchés
  rationale: Rend directement la relation exprimée par በእንተ, ici le motif ou l’objet de l’enquête.
- source_word: ትገብሩ፡ ኵነኔ፡ … በጻድቃን
  choice: vous exercez le jugement contre les justes
  rationale: Conserve le vocabulaire judiciaire et la tension de l’accusation, sans paraphraser par « condamner » ni préciser davantage la nature de ce jugement.
theological_decisions:
- issue: Rôle des anges et des luminaires dans l’enquête céleste
  choice: de la part des anges… ainsi que du soleil, de la lune et des étoiles
  alternative: auprès des anges… du soleil, de la lune et des étoiles
  rationale: La traduction principale suit la lecture traditionnelle selon laquelle ces êtres et luminaires participent à l’examen. Une note conserve l’autre analyse possible, où ils servent de témoins auprès desquels l’enquête est menée.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le pluriel « sachez » et « vous » maintient l’adresse collective. « Faire l’objet d’une enquête » exprime idiomatiquement l’examen des actes, tandis que « exercer le jugement contre » garde la coloration judiciaire et l’étrangeté mesurée du texte apocalyptique.
