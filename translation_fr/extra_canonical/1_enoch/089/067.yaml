base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: fr
  text: Et j’éprouvai une très grande tristesse à cause de l’enclos[a], car cette maison des brebis avait été démolie[b] ; et, parmi elles, je ne pus voir si ces brebis entraient dans cette maison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image guèze associe ici un « enclos » à une « maison des brebis ». Les deux expressions sont conservées plutôt que fondues en « bergerie ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se rendre par « avait été rasée », « détruite » ou, selon une nuance possible, « sapée ».
    reason: lexical_alternative
  - marker: c
    text: La fin du verset est difficile. Elle peut signifier que le voyant ne pouvait pas voir ces brebis, ou plus précisément qu’il ne pouvait pas voir si elles entraient dans cette maison.
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ፡ ብዙኃ፡ ጥቀ
  choice: Et j’éprouvai une très grande tristesse
  rationale: Le verbe exprime un profond chagrin, renforcé par deux intensifs. Cette formulation française conserve l’emphase sans devenir archaïque.
- source_word: ማኅፈድ
  choice: l’enclos
  rationale: Le mot désigne un espace clos destiné aux animaux. « Enclos » préserve cette image tout en la distinguant de la « maison des brebis » qui suit.
- source_word: ተከርየ
  choice: avait été démolie
  rationale: Dans le contexte d’un bâtiment, le passif évoque une construction déterrée, sapée ou rasée. « Démolie » est naturel en français et rend concrètement sa destruction.
- source_word: ቤት፡ ዘአባግዐ
  choice: cette maison des brebis
  rationale: La traduction littérale garde visible l’image architecturale propre à la vision, sans la réduire au seul terme « bergerie ».
- source_word: ኢክህልኩ፡ ርእዮቶሙ
  choice: je ne pus voir
  rationale: La formulation exprime à la fois l’incapacité et la perception visuelle dans le récit de vision.
- source_word: ለእልኩ፡ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif renvoie à un groupe déterminé de brebis déjà présent dans la vision.
- source_word: ይበውኡ፡ ኀበ፡ ዝኩ፡ ቤት
  choice: entraient dans cette maison
  rationale: Le verbe indique l’entrée et la préposition marque la direction vers l’intérieur. L’imparfait convient à la vision d’une action dont l’accomplissement demeure incertain.
theological_decisions:
- issue: Rapport entre l’enclos et la maison des brebis
  choice: 'Conserver les deux expressions : « l’enclos » et « cette maison des brebis »'
  alternative: Les fondre en une seule image, par exemple « la bergerie »
  rationale: Le texte juxtapose deux désignations apparentées. Les conserver évite d’aplanir l’imagerie symbolique ou d’identifier trop précisément son référent.
- issue: Nature des dommages subis par la maison
  choice: « avait été démolie »
  alternative: « avait été arrachée », « avait été rasée » ou « avait été détruite »
  rationale: Le contexte architectural appelle un verbe français naturel évoquant la destruction matérielle, sans imposer une technique précise de démolition.
- issue: Portée de la proposition finale
  choice: « je ne pus voir si ces brebis entraient dans cette maison »
  alternative: « je ne pus voir ces brebis »
  rationale: La syntaxe peut porter soit sur la visibilité des brebis elles-mêmes, soit sur la question de leur entrée. Le texte principal retient la seconde analyse, plus cohérente avec la proposition finale, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le caractère visionnaire et les répétitions symboliques du texte, tout en évitant les tours inutilement archaïques.
