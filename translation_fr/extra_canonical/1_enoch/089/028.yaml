revisions:
- from: Mais ces brebis s’éloignèrent de cette eau et sortirent dans un désert où il n’y avait ni eau ni herbe. Elles commencèrent à ouvrir les yeux et à voir.[a] Et je vis le Seigneur des brebis prendre soin d’elles comme un berger et leur donner de l’eau et de l’herbe,[b] tandis que cette brebis allait devant elles et les guidait.[c]
  to: Mais ces brebis quittèrent cette eau et entrèrent dans un désert où il n’y avait ni eau ni herbe. Elles commencèrent à ouvrir les yeux et à voir.[a] Et je vis le Seigneur des brebis les faire paître et leur donner de l’eau et de l’herbe,[b] ainsi que cette brebis qui allait et les guidait.[c]
  rationale: 'La révision resserre la traduction sur les verbes et la syntaxe de la vision : les brebis entrent dans le désert; le Seigneur les fait paître; et la brebis particulière est vue allant et les guidant. Elle conserve le titre imagé, le vocabulaire concret et l’ambiguïté symbolique sans expansion doctrinale.'
