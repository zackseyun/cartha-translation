base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: fr
  text: Mais ces brebis quittèrent cette eau et entrèrent dans un désert où il n’y avait ni eau ni herbe. Elles commencèrent à ouvrir les yeux et à voir.[a] Et je vis le Seigneur des brebis les faire paître et leur donner de l’eau et de l’herbe,[b] ainsi que cette brebis qui allait et les guidait.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’ouverture des yeux peut évoquer ici un éveil ou une perception renouvelée, mais le texte conserve l’image concrète de la vision animale.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « herbe » peut aussi désigner le pâturage ou le fourrage destiné au troupeau.
    reason: lexical_alternative
  - marker: c
    text: 'La dernière expression dépend de « je vis » : autre traduction possible, « et je vis cette brebis aller et les guider ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: አባግዕሰ
  choice: ces brebis
  rationale: Le démonstratif renvoie au groupe déjà présent dans la vision; « ces brebis » en conserve la valeur référentielle en français naturel.
- source_word: ኃለፉ እምዝኩ ማይ
  choice: s’éloignèrent de cette eau
  rationale: La tournure exprime le mouvement à partir du lieu d’eau précédent sans imposer l’idée plus précise d’une traversée.
- source_word: ውስተ በድው
  choice: dans un désert
  rationale: « Désert » désigne ici un lieu inculte et privé de ressources, sans nécessairement suggérer une étendue de sable.
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: où il n’y avait ni eau ni herbe
  rationale: La construction corrélative française exprime clairement la double privation et garde le vocabulaire concret du troupeau.
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: Elles commencèrent à ouvrir les yeux et à voir
  rationale: Cette formulation conserve à la fois l’image littérale de la vision et sa possible portée symbolique de prise de conscience.
- source_word: እግዚኦሙ ለአባግዕ
  choice: le Seigneur des brebis
  rationale: Le titre propre à l’allégorie animale est maintenu sans remplacer la métaphore par une identification explicative.
- source_word: ይርዕዮሙ
  choice: prendre soin d’elles comme un berger
  rationale: Le verbe pastoral exprime l’action de paître ou de conduire le troupeau; cette tournure reste claire en français et rend explicite l’image verbale sans identifier autrement le personnage.
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: leur donner de l’eau et de l’herbe
  rationale: La traduction simple restitue directement le renversement de la privation décrite auparavant.
- source_word: ዝኩ በግዕ
  choice: cette brebis
  rationale: Le singulier démonstratif désigne une brebis précise déjà connue dans le déroulement de la vision.
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: tandis que cette brebis allait devant elles et les guidait
  rationale: Le participe circonstanciel avec l’imparfait éthiopien décrit une action en cours vue par le narrateur; « tandis que » conserve cette simultanéité, et « allait devant elles » rend naturellement le rôle directeur.
theological_decisions:
- issue: Identité du « Seigneur des brebis »
  choice: Conserver « le Seigneur des brebis » sans explicitation
  alternative: « Dieu, le berger d’Israël » ou « le propriétaire des brebis »
  rationale: Le titre désigne la figure divine dans l’Apocalypse des animaux, mais la traduction doit préserver la métaphore propre à la vision au lieu de la remplacer par son interprétation.
- issue: Sens de l’ouverture des yeux
  choice: Maintenir l’énoncé concret « ouvrir les yeux et voir »
  alternative: « prendre conscience » ou « parvenir à comprendre »
  rationale: Le passage peut évoquer un éveil spirituel ou une perception renouvelée, mais le texte le présente sous la forme d’une scène animale; la traduction conserve cette tension.
- issue: Rapport syntaxique de la brebis conductrice avec « je vis »
  choice: Présenter son déplacement et sa conduite comme une action simultanément observée
  alternative: 'En faire une nouvelle proposition indépendante: « et cette brebis partit et les conduisit »'
  rationale: La construction avec እንዘ et l’imparfait suggère une action en cours relevant de la scène contemplée, plutôt qu’un nouvel événement simplement successif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste narrative et visuelle; les métaphores pastorales et l’ambiguïté symbolique sont conservées sans ajout doctrinal.
