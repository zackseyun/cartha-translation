base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: fr
  text: Et ces brebis grandirent et se multiplièrent, et tous ces chiens, ces chacals[a] et ces sangliers sauvages[b] eurent peur et s’enfuirent devant elles. Ce bélier les frappa de ses cornes[c] et tua toutes les bêtes. Ces bêtes ne purent plus être au milieu des brebis et ne leur arrachèrent plus rien[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renards » ; l’identification exacte de cet animal prédateur ou charognard est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « sangliers du désert » ou « sangliers d’une région inculte » ; le terme évoque des porcs sauvages vivant hors des terres cultivées.
    reason: lexical_alternative
  - marker: c
    text: Ou « encorna ». Le verbe signifie plus largement « frapper », mais, avec un bélier pour sujet, il évoque ici un coup de cornes.
    reason: lexical_alternative
  - marker: d
    text: La dernière proposition souligne que les bêtes hostiles cessèrent entièrement d’emporter ou de saisir quoi que ce soit aux brebis.
    reason: clarification
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: grandirent et se multiplièrent
  rationale: Les deux verbes proches sont conservés afin de rendre l’insistance du texte et son style visionnaire répétitif.
- source_word: አባግዕ
  choice: brebis
  rationale: Le terme concret maintient l’imagerie animale de la vision; « troupeau » aurait rendu l’image plus abstraite.
- source_word: አክላብ
  choice: chiens
  rationale: Traduction directe du nom animal, sans interpréter son référent allégorique.
- source_word: ቈናጽል
  choice: chacals
  rationale: Le terme paraît désigner un canidé prédateur ou charognard de type renard ou chacal. « Chacals » convient naturellement à cette série d’animaux hostiles, tandis que l’incertitude zoologique est signalée en note.
- source_word: ሐራዊያ ገዳም
  choice: sangliers sauvages
  rationale: La locution désigne des porcs sauvages vivant dans un espace non cultivé. Cette formulation française est claire sans préciser excessivement le milieu géographique.
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: eurent peur et s’enfuirent loin d’elles
  rationale: Les deux verbes rendent à la fois la peur et le mouvement de fuite; le pronom renvoie aux brebis.
- source_word: ሐርጌ
  choice: bélier
  rationale: Ce nom préserve l’identité concrète du mâle qui dirige et défend les brebis dans l’allégorie.
- source_word: ጐድአ
  choice: les frappa de ses cornes
  rationale: Dans le contexte d’un bélier, cette expression rend l’action spécifique de heurter ou d’encorner, tout en évitant le français moins naturel « encorna toutes les bêtes ».
- source_word: አራዊተ / አራዊት
  choice: bêtes
  rationale: « Bêtes » conserve la nuance hostile et sauvage du catalogue apocalyptique mieux que le terme générique « animaux ».
- source_word: አክህሉ ዳግመ
  choice: Dès lors, ... ne purent plus
  rationale: Cette formulation française naturelle exprime à la fois l’incapacité et la cessation indiquée par l’adverbe, sans produire une redondance maladroite.
- source_word: ማእከለ አባግዕ
  choice: se trouver au milieu des brebis
  rationale: La traduction maintient l’image spatiale des bêtes hostiles présentes parmi les brebis, sans imposer la nuance plus précise d’entrer ou de demeurer.
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: elles ne leur arrachèrent plus rien
  rationale: « Arracher » convient au contexte de prédation et souligne la cessation complète des prises faites aux brebis.
theological_decisions:
- issue: Faut-il conserver littéralement l’allégorie animale ou identifier les groupes historiques dans le corps du texte?
  choice: Conserver intégralement l’imagerie animale sans en décoder les référents.
  alternative: Remplacer les animaux par les peuples, nations ou factions qu’ils pourraient symboliser.
  rationale: La vision communique par une allégorie animale suivie. Identifier les référents dans la traduction supprimerait une ambiguïté voulue et introduirait une interprétation historique dans le texte.
translation_notes:
  register: Français international moderne, courant et digne. La coordination répétée ainsi que les images concrètes sont maintenues pour respecter le rythme narratif et le caractère apocalyptique du passage; les formulations inutilement archaïques ont été évitées.
