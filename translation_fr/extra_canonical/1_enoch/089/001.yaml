base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: fr
  text: Et l’un de ces quatre alla vers ce taureau blanc et lui enseigna un mystère, tandis qu’il ne tremblait pas[a]. Ce taureau naquit et devint un homme. Il se construisit un grand navire et y demeura. Trois taureaux étaient avec lui sur ce navire[b], et ils furent couverts par le dessus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien transmis porte la négation : « tandis qu’il ne tremblait pas ». La clause a toutefois été considérée comme textuellement difficile ; une autre lecture proposée est : « tandis qu’il tremblait ».'
    reason: textual_variant
  - marker: b
    text: Ce grand navire évoque l’embarcation du déluge dans la reprise symbolique du récit de la Genèse, mais le texte conserve ici les images propres à la vision animale.
    reason: cross_reference
lexical_decisions:
- source_word: ፬ሖረ ኀበ
  choice: alla vers
  rationale: Rend simplement le mouvement dirigé vers le bovin blanc, sans préciser davantage la manière de l’approche.
- source_word: ላህም ጸዓዳ
  choice: taureau blanc
  rationale: Le nom désigne un bovin; le masculin respecte ici la représentation symbolique du personnage masculin dans l’Apocalypse des animaux, sans remplacer l’image par son référent.
- source_word: መሀሮ ምሥጢረ
  choice: lui enseigna un mystère
  rationale: Conserve à la fois la valeur pédagogique du verbe et le caractère caché ou révélé de ce qui est communiqué.
- source_word: እንዘ ኢይርዕድ
  choice: tandis qu’il ne tremblait pas
  rationale: Le texte transmis comporte explicitement la négation ኢ; la traduction la maintient malgré la difficulté textuelle signalée dans la tradition éditoriale.
- source_word: ተወልደ ወኮነ ሰብአ
  choice: naquit et devint un homme
  rationale: Préserve l’étrange passage explicite de la figure animale à la figure humaine.
- source_word: መስቀረ ዐቢየ
  choice: un grand navire
  rationale: Le terme désigne ici une grande embarcation. « Navire » est naturel en français et évite d’introduire directement le terme théologiquement chargé « arche ».
- source_word: ነበረ ዲቤሃ
  choice: y demeura
  rationale: Exprime le séjour sur ou dans l’embarcation en français idiomatique sans alourdir la phrase.
- source_word: ፫አላህምት
  choice: trois taureaux
  rationale: Maintient l’imagerie bovine et le genre masculin des trois personnages symbolisés.
- source_word: ተከድኑ ላዕሌሆሙ
  choice: ils furent couverts par-dessus
  rationale: Conserve le passif et l’idée inhabituelle d’une couverture placée au-dessus d’eux, sans déterminer la nature de celle-ci.
theological_decisions:
- issue: Identifier explicitement le personnage à Noé et le navire à l’arche
  choice: Conserver la transformation du taureau en homme et l’image du grand navire sans nommer Noé
  alternative: Nommer Noé ou traduire « navire » par « arche » afin d’expliciter le récit du déluge
  rationale: L’allusion au récit de la Genèse est claire, mais le passage demeure une vision symbolique. La traduction ne doit pas remplacer ses images par leur interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement élevée sans archaïsmes. Les images insolites de la vision, notamment la transformation et la couverture placée au-dessus des occupants, sont conservées plutôt que normalisées.
