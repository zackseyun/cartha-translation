base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: fr
  text: Les lions et les léopards[a] dévorèrent et engloutirent la plupart de ces brebis, et les sangliers du désert mangèrent avec eux ; ils brûlèrent cette tour et démolirent cette maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte du grand félin désigné par le terme éthiopien est incertaine ; on peut aussi traduire par « panthères ».
    reason: lexical_alternative
  - marker: b
    text: Dans cette vision, la « maison » représente probablement le sanctuaire ou le temple ; le texte conserve toutefois l’image employée dans le récit.
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ ወውሕጡ
  choice: dévorèrent et engloutirent
  rationale: Les deux verbes distincts sont conservés afin de rendre l’intensification et la violence de la scène.
- source_word: መብዝሕቶሙ ለዝኩ አባግዐ
  choice: la plupart de ces brebis
  rationale: Rend clairement la majorité du groupe tout en maintenant l’image animale de la vision.
- source_word: አናብስት
  choice: lions
  rationale: Terme zoologique direct et usuel.
- source_word: አነምርት
  choice: léopards
  rationale: « Léopards » correspond mieux au terme éthiopien que « tigres », tout en laissant en note l’incertitude zoologique résiduelle.
- source_word: ሐራዊያ ገዳም
  choice: sangliers du désert
  rationale: Préserve à la fois l’image des porcs sauvages et leur association avec une région inculte ou désertique.
- source_word: በልዑ ምስሌሆሙ
  choice: mangèrent avec eux
  rationale: Respecte la seconde proposition et son verbe propre, sans la fondre dans l’action précédente.
- source_word: አውዐይዎ ለዝኩ ማኅፈድ
  choice: brûlèrent cette tour
  rationale: Traduction concrète qui conserve l’architecture symbolique sans l’interpréter.
- source_word: ከረይዎ ለዝኩ ቤት
  choice: démolirent cette maison
  rationale: « Démolirent » exprime naturellement la destruction de l’édifice; « maison » conserve le sens premier et l’image visionnaire.
theological_decisions:
- issue: Faut-il interpréter ቤት comme le Temple ou conserver l’image de la maison ?
  choice: maison
  alternative: Temple ou sanctuaire
  rationale: La vision emploie une image architecturale susceptible de désigner symboliquement le sanctuaire. Le texte principal conserve cette image et la note en indique le référent probable sans imposer l’interprétation.
