base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: fr
  text: Je continuai à regarder jusqu’à ce que ce mouton se couche[a] — celui qui avait rencontré le mouton qui les conduisait. Puis je continuai à regarder jusqu’à ce que tous les grands moutons périssent. Les petits se levèrent à leur place, entrèrent dans le pâturage et s’approchèrent d’un cours d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut évoquer indirectement la mort, mais le verbe signifie littéralement « se coucher » ou « s’étendre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: se couche
  rationale: Le verbe est actif et signifie « se coucher » ou « s’étendre ». Le français conserve cette voix et l’image du texte sans rendre explicitement une mort qui peut seulement être suggérée par le contexte.
- source_word: በግዕ / አባግዕ
  choice: mouton / moutons
  rationale: Ce terme générique convient à l’imagerie animale du passage et évite de préciser sans nécessité « bélier » ou « agneau ».
- source_word: ዘተረክበ ለዝኩ በግዕ
  choice: qui avait rencontré le mouton
  rationale: La proposition relative identifie le premier mouton par sa rencontre antérieure avec celui qui conduisait le groupe.
- source_word: ዘመርሖሙ
  choice: qui les conduisait
  rationale: Le verbe exprime l’action de mener ou de guider; « conduisait » est naturel en français et n’ajoute pas l’idée plus interprétative de paître.
- source_word: ተኃጕሉ
  choice: périssent
  rationale: Dans cette construction, le verbe signifie que les grands moutons disparaissent ou périssent. Il forme une proposition distincte de celle où les petits se lèvent.
- source_word: ተንሥኡ
  choice: se levèrent
  rationale: Le verbe exprime clairement le fait de se lever ou de surgir; il ne doit pas être omis ni confondu avec le verbe précédent.
- source_word: ህየንቴሆሙ
  choice: à leur place
  rationale: 'Le sens substitutif ou successoral convient ici: les petits se lèvent à la place des grands qui ont péri.'
- source_word: መርዔት
  choice: pâturage
  rationale: Le nom désigne un lieu où les animaux paissent; « pâturage » conserve précisément l’image de la vision.
- source_word: ፈለገ ማይ
  choice: cours d’eau
  rationale: L’expression désigne littéralement un chenal ou courant d’eau sans permettre d’en fixer précisément la taille; « cours d’eau » préserve cette généralité.
theological_decisions:
- issue: Faut-il expliciter que le mouton meurt lorsqu’il « se couche »?
  choice: Conserver « se couche » dans le texte principal.
  alternative: « meurt » ou « périt »
  rationale: Le verbe guèze est actif et décrit d’abord l’action de se coucher, même s’il peut fonctionner comme une évocation indirecte de la mort dans ce récit symbolique. La traduction ne tranche donc pas l’image.
- issue: Rapport entre les grands moutons et les petits
  choice: 'Traduire deux propositions distinctes: les grands périssent, puis les petits se lèvent à leur place.'
  alternative: Réunir grands et petits en un seul sujet qui serait mis en mouvement.
  rationale: La syntaxe du guèze distingue nettement ኵሎሙ አባግዕ ዐቢያን, sujet de « périr », de ወንኡሳን, sujet de « se lever ». Cette distinction conserve aussi la tension symbolique du passage sans l’interpréter davantage.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « je continuai à regarder jusqu’à ce que » reproduit la structure visionnaire du guèze tout en restant naturelle. Les deux propositions concernant les grands et les petits moutons sont maintenues distinctes conformément à la syntaxe de la source.
