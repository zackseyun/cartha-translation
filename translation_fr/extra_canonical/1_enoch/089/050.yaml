base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: fr
  text: Cette maison devint grande et spacieuse, et elle fut bâtie pour ces brebis. Une tour haute et grande fut bâtie sur la maison pour le Seigneur des brebis. La maison était basse, mais la tour fut élevée et devint haute. Le Seigneur des brebis se tenait sur cette tour, et l’on dressa devant lui une table bien garnie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢየ፡ ወርኅበ
  choice: grande et spacieuse
  rationale: Rend les deux qualités de la maison, sa grandeur et son ampleur, dans un français naturel.
- source_word: ማኅፈድ፡ ነዋኅ፡ ወዐቢይ
  choice: une tour haute et imposante
  rationale: « Tour » correspond au bâtiment élevé du contexte; « imposante » exprime ici la grandeur sans répéter maladroitement « grande ».
- source_word: ለእግዚአ፡ አባግዕ
  choice: pour le Seigneur des brebis
  rationale: Conserve le titre symbolique récurrent du récit sans en expliciter l’identité dans le corps du texte.
- source_word: ማእደ፡ ምልእተ
  choice: une table bien garnie
  rationale: Exprime idiomatiquement une table « pleine », c’est-à-dire pourvue de ce qui doit y être servi, sans préciser davantage le contenu.
theological_decisions:
- issue: Identité du « Seigneur des brebis »
  choice: Maintien du titre symbolique
  alternative: Remplacer le titre par « Dieu »
  rationale: Le texte visionnaire emploie la métaphore; l’expliciter supprimerait une caractéristique littéraire et interprétative de la source.
- issue: Sujet de l’action finale
  choice: « l’on dressa »
  alternative: « ils dressèrent »
  rationale: Le pluriel implicite n’a pas d’antécédent immédiatement explicite en français; le sujet indéfini préserve cette indétermination sans inventer des agents.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Les répétitions structurantes de « maison », « tour » et « brebis » sont conservées; la syntaxe est légèrement fluidifiée pour rester claire à la lecture.
