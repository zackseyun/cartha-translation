base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: fr
  text: 'Cette embarcation flotta sur l’eau[a], tandis que tous les taureaux, les éléphants, les chameaux et les ânes s’enfoncèrent dans la terre, ainsi que toutes les bêtes. Je ne pouvais pas les voir. Ils ne pouvaient pas en sortir : ils périrent et sombrèrent dans les profondeurs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot éthiopien traduit par « embarcation » est difficile. Il peut aussi désigner un mât ou une pièce de bois dressée ; l’objet exact de la vision n’est donc pas entièrement certain.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’abîme » ou « dans les eaux profondes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: መሥቀር
  choice: embarcation
  rationale: Dans le contexte du déluge et de la vision animale, le référent paraît être l’embarcation déjà évoquée. Le terme éthiopien demeure toutefois difficile et peut aussi désigner une pièce de bois dressée; cette incertitude est signalée en note.
- source_word: ይጼቢ
  choice: flottait
  rationale: Le contexte oppose l’embarcation qui demeure sur l’eau aux animaux qui s’enfoncent; « flottait » exprime naturellement cette scène sans surcharge.
- source_word: አልህምት
  choice: taureaux
  rationale: Le choix conserve la catégorie bovine particulière et son rôle dans le symbolisme de l’Apocalypse des animaux, au lieu de généraliser en « bétail ».
- source_word: ነጊያት
  choice: éléphants
  rationale: Dans l’énumération éthiopienne des quatre classes animales, ce terme correspond aux éléphants; les chameaux et les ânes sont ensuite nommés séparément.
- source_word: አገማል
  choice: chameaux
  rationale: Équivalent français direct du nom animal dans cette énumération.
- source_word: አእዱግ
  choice: ânes
  rationale: Équivalent français moderne et précis, sans archaïsme.
- source_word: ኅሠጥሙ
  choice: s’enfonçaient
  rationale: Le verbe décrit ici la descente ou l’engloutissement dans la terre. « S’enfonçaient » préserve le mouvement concret sans ajouter l’image interprétative d’une bouche qui avale.
- source_word: እንስሳ
  choice: bêtes
  rationale: Terme collectif suffisamment large pour désigner les autres animaux de la vision sans le limiter au seul bétail domestique.
- source_word: ኢክህልኩ ርእዮቶሙ
  choice: Je ne pouvais plus les voir
  rationale: La forme transcrite አክህልክ reflète vraisemblablement une corruption graphique de la première personne négative. Avec ርእዮቶሙ, le sens est « je ne pouvais pas les voir », et non une mention des oiseaux.
- source_word: ስእኑ ወጺአ
  choice: Ils ne pouvaient pas en sortir
  rationale: Rend directement l’incapacité des animaux à ressortir de l’endroit où ils se sont enfoncés.
- source_word: ተኃጐሉ
  choice: ils périrent
  rationale: « Périrent » exprime la perte catastrophique avec une solennité naturelle, sans préciser indûment le moyen de leur destruction.
- source_word: ቀላይ
  choice: les profondeurs
  rationale: Le pluriel concret évoque les eaux profondes ou les abîmes sans imposer le terme théologiquement plus chargé « l’Abîme ».
theological_decisions:
- issue: Portée apocalyptique du dernier terme désignant les eaux profondes
  choice: les profondeurs
  alternative: l’abîme
  rationale: Le texte appartient à une vision de jugement, mais le nom éthiopien peut désigner des profondeurs ou des eaux profondes. Le pluriel « les profondeurs » maintient la force menaçante de l’image tout en évitant d’en faire sans preuve un lieu cosmique ou doctrinal déterminé.
- issue: Identification des êtres qui ne peuvent plus être vus
  choice: le voyant ne peut plus voir les animaux engloutis
  alternative: le bétail et les oiseaux les voient
  rationale: La seconde lecture dépend d’une transcription fautive du groupe verbal. La correction paléographique soutenue par la syntaxe donne une première personne négative suivie de l’infinitif « voir »; elle ne justifie aucune référence aux oiseaux.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour rendre clairement la parenthèse du voyant et l’échec des animaux à ressortir, sans effacer la répétition dramatique des mouvements de descente.
