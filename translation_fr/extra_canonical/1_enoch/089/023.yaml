base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: fr
  text: Et les loups se mirent à poursuivre ces brebis, jusqu’à les rattraper près d’une source d’eau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près d’un bassin d’eau ». Le terme désigne un lieu où se trouve de l’eau, dont la nature exacte — source, bassin ou étendue d’eau — reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝእብት
  choice: les loups
  rationale: Le terme désigne ici les prédateurs figurés comme des loups dans l’imagerie animale de la vision; il convient de conserver cette image concrète.
- source_word: አሐዙ ይትልውዎሙ
  choice: se mirent à poursuivre
  rationale: አሐዙ fonctionne comme auxiliaire inchoatif devant l’action suivante, tandis que ይትልውዎሙ exprime une poursuite hostile plutôt qu’un simple accompagnement.
- source_word: ዝኩ አባግዕት
  choice: ces brebis
  rationale: Le démonstratif renvoie au groupe précis déjà présent dans le récit; « ces » le conserve naturellement en français.
- source_word: እስክ ተረክብዎሙ
  choice: jusqu’à les rattraper
  rationale: Le verbe exprime ici le fait d’atteindre ou de rejoindre au terme d’une poursuite, et non celui de pousser les brebis dans l’eau.
- source_word: በአሐቲ ዐይገ ማይ
  choice: près d’une source d’eau
  rationale: La préposition marque le lieu plutôt qu’un mouvement vers l’intérieur; « source d’eau » rend le lieu d’eau sans introduire l’idée erronée d’une entrée dans l’eau.
theological_decisions:
- issue: Symbolisme animal dans les Visions de rêve
  choice: Conserver littéralement les loups et les brebis dans le texte principal.
  alternative: Remplacer les animaux par les peuples ou groupes historiques qu’ils symbolisent.
  rationale: La vision repose sur une imagerie animale continue. La traduction doit préserver cette tension symbolique sans imposer son décodage historique dans le texte.
- issue: Relation des brebis au lieu d’eau
  choice: Les loups les rattrapent près de la source.
  alternative: Les loups les poussent dans un bassin d’eau.
  rationale: Le sens local de በ et la valeur de ተረክብዎሙ indiquent qu’elles sont rejointes au lieu d’eau; traduire un mouvement forcé dans l’eau anticiperait la suite du récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Se mirent à poursuivre » restitue naturellement l’aspect inchoatif; « rattraper » convient à l’issue d’une poursuite. L’image animale et l’indétermination relative du lieu d’eau sont préservées.
