base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: fr
  text: Il les livra entre les mains des lions, des léopards, des loups et des hyènes[a], entre les mains des renards[b], ainsi qu’à toutes les bêtes sauvages. Et ces bêtes des champs commencèrent à mettre ces brebis en pièces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’animal ainsi désigné pourrait aussi être le chacal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des chacals » ; l’identification exacte de ce canidé est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: Il les livra
  rationale: Le verbe peut signifier laisser ou abandonner, mais, avec « entre les mains de », il exprime ici le fait de livrer à une puissance hostile. Cette formulation conserve l’action judiciaire sans expliciter l’identité du sujet.
- source_word: ውስተ እደ
  choice: entre les mains de
  rationale: Cette expression idiomatique désigne le pouvoir auquel quelqu’un est livré. Le pluriel français est naturel tout en conservant l’image concrète de la main.
- source_word: አናብስት
  choice: lions
  rationale: Le terme désigne les lions dans cette série de prédateurs symboliques.
- source_word: አንምርት
  choice: léopards
  rationale: « Léopards » correspond au sens sémitique apparent du terme et évite l’anachronisme zoologique de « tigres ».
- source_word: አዝእት
  choice: loups
  rationale: Identification animale directe et bien établie dans ce contexte.
- source_word: አጽዕብት
  choice: hyènes
  rationale: « Hyènes » convient à la série de prédateurs, mais l’identification zoologique demeure incertaine ; « chacals » est signalé en note.
- source_word: ቈናጽል
  choice: renards
  rationale: C’est l’équivalent traditionnel et le plus direct, bien qu’un canidé voisin, notamment le chacal, puisse être visé.
- source_word: ኵሉ አራዊት
  choice: toutes les bêtes sauvages
  rationale: La formule élargit l’énumération des prédateurs à l’ensemble des bêtes sauvages et conserve le ton menaçant du passage.
- source_word: ዝኩ አራዊተ ገዳም
  choice: ces bêtes des champs
  rationale: Cette traduction maintient la distinction entre la formule précédente, « toutes les bêtes sauvages », et l’expression plus précise « bêtes des champs ».
- source_word: አሐዙ
  choice: commencèrent
  rationale: 'Associé au verbe suivant, le terme a ici une valeur inchoative : les bêtes se mettent à accomplir l’action.'
- source_word: ይምሥጥዎሙ
  choice: à mettre … en pièces
  rationale: Cette expression rend concrètement l’idée de déchirer ou de mettre en lambeaux, sans l’atténuer en simple destruction.
- source_word: እልኩ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif est conservé, et « brebis » maintient l’image animale établie dans l’apocalypse.
theological_decisions:
- issue: Agent du jugement dans l’image apocalyptique
  choice: Il les livra entre les mains des prédateurs
  alternative: Il les abandonna entre les mains des prédateurs
  rationale: « Livra » conserve l’idée d’une action judiciaire active suggérée par le contexte, tandis que le pronom « Il » préserve la référence implicite du texte sans transformer l’allégorie en explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « entre les mains » garde l’imagerie judiciaire du texte, tandis que la seconde phrase distingue volontairement « bêtes des champs » de « bêtes sauvages ».
