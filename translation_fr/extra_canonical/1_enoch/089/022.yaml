base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: fr
  text: Le Seigneur des brebis alla avec elles tout en les conduisant, et toutes ses brebis le suivirent. Son visage était glorieux, majestueux[a] et redoutable à voir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « splendide »; l’adjectif guèze peut évoquer l’honneur ou le poids de la dignité aussi bien que la magnificence visible.
    reason: lexical_alternative
  - marker: b
    text: « Redoutable à voir » exprime ici une crainte mêlée de saisissement et de révérence, non un mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: le Seigneur des brebis
  rationale: Cette expression conserve le rapport de possession ou de souveraineté ainsi que le registre théologique élevé, sans remplacer l’image animale par une explication.
- source_word: ሖረ ምስሌሆሙ
  choice: alla avec elles
  rationale: Le verbe simple de mouvement et la relation d’accompagnement sont rendus directement; le féminin reprend naturellement « brebis » en français.
- source_word: እንዘ ይመራሖሙ
  choice: tout en les conduisant
  rationale: La tournure exprime une action simultanée et préserve l’idée de direction sans ajouter explicitement celle de paître.
- source_word: ኵሎሙ አባግዒሁ
  choice: toutes ses brebis
  rationale: Le possessif et l’image concrète des brebis sont tous deux conservés.
- source_word: ተለውዎ
  choice: le suivirent
  rationale: Dans cette scène de conduite, « suivre » exprime naturellement la relation et le mouvement orienté.
- source_word: ገጹ
  choice: son visage
  rationale: Le terme concret maintient le détail anthropomorphe de la vision plutôt que de le diluer en « apparence ».
- source_word: ስቡሕ
  choice: glorieux
  rationale: Dans cette série descriptive, « glorieux » rend à la fois l’éclat et l’honneur attachés au visage.
- source_word: ክቡር
  choice: majestueux
  rationale: « Majestueux » distingue ce second adjectif de « glorieux » et exprime sa valeur d’honneur, de poids et de magnificence.
- source_word: ግሩም ለርእይ
  choice: redoutable à voir
  rationale: Cette formulation conserve l’effroi mêlé de révérence propre à la vision apocalyptique, sans suggérer une quelconque méchanceté morale.
theological_decisions:
- issue: Identité de la figure qui conduit dans l’Apocalypse des animaux
  choice: Rendre l’expression par « le Seigneur des brebis » et maintenir littéralement l’image des brebis.
  alternative: « leur maître » ou « le maître berger des brebis »
  rationale: Le texte présente une figure souveraine dans le cadre symbolique continu de la vision. « Seigneur des brebis » préserve à la fois la portée théologique et l’imagerie apocalyptique sans transformer le symbole en exposé explicatif.
- issue: Valeur de ግሩም dans la description du visage
  choice: « redoutable à voir »
  alternative: « impressionnant à voir », « admirable à voir » ou « terrifiant à voir »
  rationale: Le choix maintient la tension entre grandeur, crainte et saisissement. Il évite aussi bien l’affaiblissement moderne d’« impressionnant » que l’idée excessivement négative portée par « terrifiant ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du mouvement du guèze, tandis que la répétition de l’image des brebis et les trois adjectifs décrivant le visage sont préservés. Les notes signalent les principales amplitudes lexicales sans résoudre abusivement l’ambivalence de la scène.
