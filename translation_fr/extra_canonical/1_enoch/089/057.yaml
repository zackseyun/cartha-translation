base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: fr
  text: 'Et je me mis à crier de toutes mes forces. J’appelai le Seigneur des brebis et lui montrai ce qui leur arrivait : elles étaient dévorées par toutes les bêtes sauvages[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les bêtes des champs » ou « toutes les bêtes du désert ». Le terme guèze peut désigner la campagne ouverte ou une région sauvage; l’image est celle d’animaux prédateurs attaquant le troupeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዝኩ እጽራሕ
  choice: je me mis à crier
  rationale: 'Le premier verbe fonctionne ici comme un auxiliaire inchoatif avec le verbe suivant : il marque le commencement du cri plutôt qu’une prise au sens littéral.'
- source_word: በኵሉ ኃይልየ
  choice: de toutes mes forces
  rationale: Expression française naturelle qui conserve l’idée de totalité et l’intensité de l’appel.
- source_word: አጸውዖ
  choice: j’appelai
  rationale: Ce choix maintient la distinction entre le cri initial et l’appel ensuite adressé au Seigneur des brebis.
- source_word: ለእግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: « Seigneur » rend l’autorité exprimée par le titre tout en conservant le registre élevé et l’imagerie du troupeau.
- source_word: አርእዮ በእንተ አባግዕት
  choice: lui montrai ce qui leur arrivait
  rationale: Formulation française naturelle qui conserve l’idée de montrer au Seigneur la situation des brebis; le pronom « leur » évite une répétition lourde sans changer le référent.
- source_word: ተበልዑ
  choice: étaient dévorées
  rationale: « Dévorées » restitue mieux que « mangées » la violence prédatrice de la scène.
- source_word: እምኵሎሙ አራዊተ ገዳም
  choice: par toutes les bêtes sauvages
  rationale: Cette traduction met clairement en relief le caractère non domestique et prédateur des animaux; une note conserve les nuances possibles du dernier terme.
theological_decisions:
- issue: Traduction du titre divin dans l’allégorie animale
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: Le titre désigne Dieu comme souverain et propriétaire du troupeau. « Seigneur » préserve cette portée élevée sans réduire l’image à celle d’un simple propriétaire humain.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe est légèrement déliée en deux phrases pour éviter une coordination pesante, tout en conservant la progression du texte : cri, appel adressé au Seigneur, présentation du sort des brebis.'
