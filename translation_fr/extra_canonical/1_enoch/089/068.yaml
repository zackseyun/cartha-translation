base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: fr
  text: 'Les bergers et leurs compagnons livrèrent ces brebis à toutes les bêtes sauvages du désert, afin qu’elles les dévorent. Et toutes ces brebis furent livrées, chacune en son temps, selon un décompte — soixante d’entre elles[a] — tandis que le compte des autres était consigné dans le livre : combien d’entre elles avaient été détruites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le chiffre et les expressions de dénombrement qui l’entourent sont difficiles dans ce témoin. Le texte éthiopien transmis ici semble porter « soixante », mais il se peut que le nombre ou la phrase ait été altéré. L’idée principale demeure que les brebis sont livrées selon un décompte consigné.
    reason: textual_variant
lexical_decisions:
- source_word: ኖላዊያን
  choice: les bergers
  rationale: Conserve la métaphore directrice de l’Apocalypse des animaux sans identifier explicitement ces figures à des anges ou à des dirigeants humains.
- source_word: ጸማዶሙ
  choice: leurs compagnons
  rationale: Rend naturellement l’idée de personnes associées aux bergers, sans préciser davantage leur fonction.
- source_word: መጠውዎሙ / ይትሜጠው
  choice: livrèrent / furent livrées
  rationale: Le verbe exprime une remise au pouvoir d’autrui; la répétition de « livrer » maintient l’unité du motif et sa portée judiciaire.
- source_word: እእኩ አባግዕ
  choice: ces brebis
  rationale: Rendu direct du symbole animal employé dans la vision.
- source_word: አራዊተ ገዳም
  choice: les bêtes sauvages du désert
  rationale: Préserve l’image concrète et menaçante des animaux prédateurs du lieu sauvage.
- source_word: ከመ ይብልዕዎሙ
  choice: afin qu’elles les dévorent
  rationale: Exprime le but de la remise et conserve la violence de l’image animale.
- source_word: በጊዜሁ
  choice: chacune en son temps
  rationale: Rend la valeur distributive et temporelle de l’expression sans ajouter explicitement l’idée d’un temps fixé.
- source_word: በኍልቍ
  choice: selon un compte
  rationale: Traduit l’idée de dénombrement dans un français moderne et fait écho à la consignation écrite qui suit.
- source_word: ፷፻ እምኔሆሙ
  choice: soixante d’entre elles
  rationale: Suit prudemment le chiffre apparent dans le témoin fourni, tout en signalant en note l’état difficile du texte.
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ
  choice: le compte des autres était consigné dans le livre
  rationale: Rend explicitement l’idée de comptabilité écrite portée par le contexte, sans abandonner le contraste avec le groupe précédent.
- source_word: ሚመጠነ ያሐጕል እምኔሆሙ
  choice: combien d’entre elles avaient été détruites
  rationale: Préserve à la fois le dénombrement et la destruction violente indiqués par la proposition finale.
theological_decisions:
- issue: Identité des « bergers »
  choice: Maintenir les personnages sous l’image de bergers.
  alternative: Les identifier dans le texte à des surveillants angéliques ou à des souverains étrangers.
  rationale: La vision emploie une allégorie suivie; traduire directement l’interprétation supprimerait une ambiguïté réelle et imposerait une lecture historique ou théologique particulière.
- issue: Portée du dénombrement et du livre
  choice: Présenter la remise et la destruction comme comptées et consignées, sans en expliciter l’agent divin ni la signification doctrinale.
  alternative: Ajouter que Dieu autorise, ordonne ou juge chaque destruction.
  rationale: Le texte évoque un contrôle et un registre, mais ce verset ne formule pas directement toutes les conclusions théologiques possibles.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe conserve le mouvement solennel de la vision tout en évitant les archaïsmes. Le féminin des pronoms renvoie clairement aux brebis; le vocabulaire comptable (« compte », « consigné ») maintient le motif du dénombrement et du registre.
