base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: fr
  text: Et tous ceux-là eurent peur et tremblèrent devant lui. Ils l’implorèrent en faveur de ce bélier[b], qui était avec eux [qui se trouvait au milieu d’eux][a], car le bélier ne pouvait se tenir devant notre Seigneur ni le regarder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « qui se trouvait au milieu d’eux » sont placés entre crochets dans le témoin source ; ils peuvent représenter une lecture secondaire ou incertaine.
    reason: textual_variant
  - marker: b
    text: La tournure traduite par « ils l’implorèrent en faveur de ce bélier » est difficile en guèze. Elle peut aussi évoquer le fait de crier après lui, de le rechercher au sujet du bélier, ou encore de suivre le bélier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ፡ እልኩ
  choice: tous ceux-là
  rationale: L’expression renvoie collectivement au groupe déjà mentionné. « Tous ceux-là » rend cette valeur anaphorique sans conserver le calque obscur « tous lesdits ».
- source_word: ይፈርሁ፡ ወይርዐዱ
  choice: eurent peur et tremblèrent
  rationale: Les deux verbes sont maintenus afin de préserver le redoublement expressif entre la peur et sa manifestation physique.
- source_word: እምኔሁ
  choice: devant lui
  rationale: La préposition peut littéralement évoquer l’origine ou la cause de la peur (« à cause de lui »), mais « devant lui » convient au contexte de comparution et conserve sa portée relationnelle.
- source_word: ወደርኁ፡ ድኅሬሁ፡ ለዝኩ፡ በግዕ
  choice: Ils l’implorèrent en faveur de ce bélier
  rationale: La tournure guèze est difficile. Cette traduction retient le sens d’un appel adressé au personnage en faveur du bélier, tout en signalant en note les autres analyses possibles.
- source_word: ምስሌሆሙ
  choice: qui était avec eux
  rationale: Rend clairement l’association du bélier avec le groupe sans imposer une localisation plus précise.
- source_word: ዘሀሎ፡ ማእከሎሙ
  choice: qui se trouvait au milieu d’eux
  rationale: La proposition locative est conservée entre crochets, comme dans le témoin fourni, afin de rendre visible son statut textuel incertain.
- source_word: እስመ፡ ኢንክል፡ ቀዊመ
  choice: car celui-ci ne pouvait se tenir
  rationale: « Celui-ci » rattache naturellement le sujet au bélier, antécédent singulier immédiat, tout en laissant subsister la dimension humaine de la figure symbolique.
- source_word: ቅድመ፡ እግዚእነ
  choice: devant notre Seigneur
  rationale: Le possessif « notre » est explicite dans le guèze. Le titre est conservé sans identifier davantage la figure divine.
- source_word: ወአነጽሮቶ
  choice: ni le regarder
  rationale: Dans la portée de la négation, « ni » exprime naturellement l’incapacité à se tenir devant le Seigneur et à porter le regard sur lui.
theological_decisions:
- issue: Identité de « notre Seigneur » dans l’Apocalypse des animaux
  choice: Conserver « notre Seigneur » sans explicitation supplémentaire.
  alternative: « Dieu », « le Seigneur des brebis » ou « le souverain céleste ».
  rationale: Le guèze porte explicitement « notre Seigneur »; une désignation plus précise résoudrait indûment le symbolisme théologique du passage.
- issue: Référence du sujet dans la proposition finale
  choice: Rattacher « celui-ci » au bélier.
  alternative: Employer un pronom personnel humain, « il », en interprétant directement l’animal comme la personne qu’il représente.
  rationale: L’antécédent grammatical immédiat est le bélier. La traduction demeure donc au niveau de l’imagerie animale sans nier sa portée symbolique.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition expressive « eurent peur et tremblèrent », le titre « notre Seigneur » et les crochets du témoin sont conservés; les formulations archaïques ou excessivement littérales sont évitées.
