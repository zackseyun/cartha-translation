base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: fr
  text: 'Ainsi, dans la vision, je vis que celui qui écrivait consignait, jour après jour, chacun de ceux que ces bergers avaient fait périr[a]. Puis il fit monter le livre, le déposa et le montra tout entier au Seigneur des brebis : tout ce qu’ils avaient fait, tout ce que chacun d’eux avait écarté[b], et tout ce qu’ils avaient livré à la destruction.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe du guèze est difficile. On peut aussi comprendre : « chacun de ces bergers qui avait péri » ou « chacun de ceux qui avaient péri parmi ces bergers ».'
    reason: ambiguïté syntaxique
  - marker: b
    text: Le terme guèze est incertain ; il peut désigner plus précisément ce que chaque berger avait retiré, éloigné ou fait disparaître du troupeau.
    reason: alternative lexicale
lexical_decisions:
- source_word: ርኢክዎ
  choice: je vis
  rationale: Rend directement le verbe de vision dans un français narratif digne, sans archaïsme.
- source_word: ዘይጽሕፍ … ይጽሕፍ
  choice: celui qui écrivait consignait
  rationale: Conserve la répétition du champ lexical de l’écriture tout en donnant au second verbe une valeur documentaire naturelle en français.
- source_word: ዘይትሐጐል እምነ ዝኩ ኖላዊያን
  choice: chacun de ceux que ces bergers avaient fait périr
  rationale: Dans le contexte des victimes du troupeau, comprend les bergers comme agents de la destruction; une note maintient l’ambiguïté syntaxique du guèze.
- source_word: በኵሉ ዕለት
  choice: jour après jour
  rationale: Exprime la tenue continue et détaillée du registre.
- source_word: ያዓርግ
  choice: il apporta
  rationale: La forme causative indique qu’il fait monter ou apporte le livre, plutôt qu’il ne monte lui-même.
- source_word: ያዓርፍ
  choice: le déposa
  rationale: Préserve le geste concret de poser le registre dans la scène de présentation céleste.
- source_word: ያርኢ ኵሎ ኪያሁ መጽሐፈ
  choice: le montra tout entier
  rationale: Rend explicitement l’objet « livre » déjà nommé en français et la totalité de sa présentation.
- source_word: ለእግዚአ አባግዕ
  choice: au Seigneur des brebis
  rationale: Traduit sans paraphrase le titre divin propre à l’allégorie animale.
- source_word: ዘገብሩ
  choice: tout ce qu’ils avaient fait
  rationale: Formule naturelle qui maintient l’examen rétrospectif des actes des bergers.
- source_word: ዘአእተተ
  choice: tout ce que chacun d’eux avait écarté
  rationale: Le terme est lexicalement difficile; « écarté » garde l’idée générale de retrait sans imposer qu’il s’agisse nécessairement de mise à mort.
- source_word: ዘመጠዉ ለሐጕል
  choice: tout ce qu’ils avaient livré à la destruction
  rationale: Conserve la construction factitive et l’image explicite de destruction.
theological_decisions:
- issue: Identité de celui qui écrit
  choice: 'Le désigner seulement par sa fonction : « celui qui écrivait »'
  alternative: L’appeler « le scribe céleste » ou l’identifier à Énoch
  rationale: Le passage montre un personnage distinct qui tient et présente un registre, mais ne précise ici ni son titre ni son identité.
- issue: Référent du « Seigneur des brebis »
  choice: Conserver exactement le titre allégorique
  alternative: Le remplacer explicitement par « Dieu »
  rationale: Le titre désigne Dieu dans l’Apocalypse des animaux, mais sa traduction littérale préserve l’imagerie et la tension propres à la vision.
- issue: Fonction du livre
  choice: Présenter concrètement le registre au Seigneur sans ajouter « tribunal » ou « jugement »
  alternative: Expliciter un registre judiciaire céleste
  rationale: La scène suggère fortement une reddition de comptes divine, mais le verset lui-même décrit les actes sans nommer formellement un tribunal.
translation_notes:
  register: Français international moderne, narratif et solennel sans archaïsme. La répétition liée à l’écriture est partiellement conservée; la longue coordination du guèze est structurée par deux phrases et un deux-points pour rester lisible. Tous les marqueurs de notes figurent dans le texte.
