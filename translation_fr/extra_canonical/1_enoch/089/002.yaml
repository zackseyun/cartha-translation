base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: fr
  text: Et de nouveau, je levai les yeux vers le ciel et je vis un toit élevé[a], et sept cours d’eau sur lui ; ces cours d’eau coulaient dans une enceinte[b] où il y avait beaucoup d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot guèze traduit par « toit » peut aussi désigner une couverture ou une structure supérieure ; l’image architecturale exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « une cour ». Le terme désigne un espace délimité et peut aussi prendre le sens de cour, d’enclos ou d’enceinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: Et de nouveau
  rationale: Marque la reprise de l’action visionnaire et conserve la formule narrative répétitive.
- source_word: አልዓልኩ አዕይንትየ
  choice: je levai les yeux
  rationale: Préserve l’expression visionnaire concrète plutôt que de la réduire à « je regardai ».
- source_word: መንገለ ሰማይ
  choice: vers le ciel
  rationale: Rend naturellement en français la valeur directionnelle de መንገለ.
- source_word: ናሕሰ ልዑለ
  choice: un toit élevé
  rationale: « Toit » rend le sens probable de couverture ou de structure supérieure, tandis que « élevé » conserve explicitement l’idée de hauteur.
- source_word: ወ፯አስራብ ዲቤሁ
  choice: avec sept cours d’eau sur lui
  rationale: « Cours d’eau » convient au contexte aqueux sans imposer l’idée de canaux aménagés ; « sur lui » conserve la relation locative avec le toit.
- source_word: እልኩ አስራብ
  choice: ces cours d’eau
  rationale: Le démonstratif reprend les sept cours d’eau qui viennent d’être mentionnés.
- source_word: ይውሕዙ
  choice: se déversaient
  rationale: Exprime le mouvement de l’eau vers l’enceinte avec davantage de naturel que le simple « coulaient dans ».
- source_word: በ፯ ዐጸድ
  choice: dans une enceinte
  rationale: Conserve l’image d’un espace délimité et maintient la chaîne lexicale avec les versets suivants, où le même lieu est repris.
- source_word: ማየ ብዙሐ
  choice: remplie d’une grande quantité d’eau
  rationale: Rattache prudemment l’abondance d’eau à l’enceinte, conformément à l’ordre de la proposition, tout en gardant l’image concrète.
