revisions:
- from: Et de nouveau, je levai les yeux vers le ciel et je vis un toit élevé[a], avec sept cours d’eau sur lui ; ces cours d’eau se déversaient dans une enceinte[b] remplie d’une grande quantité d’eau.
  to: Et de nouveau, je levai les yeux vers le ciel et je vis un toit élevé[a], et sept cours d’eau sur lui ; ces cours d’eau coulaient dans une enceinte[b] où il y avait beaucoup d’eau.
  rationale: La révision conserve tous les référents et les ambiguïtés du texte source, tout en supprimant l’affirmation non nécessaire selon laquelle l’enceinte serait remplie d’eau. Elle harmonise aussi le mouvement des eaux avec le sens général du verbe et rétablit la coordination cumulative de la vision.
