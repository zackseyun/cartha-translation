base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: fr
  text: 'Après cela, je vis les bergers faire paître pendant douze heures ; et voici que trois de ces brebis revinrent : elles arrivèrent, entrèrent et commencèrent à rebâtir tout ce qui était tombé de cette maison.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ፡ ርኢኩ
  choice: Puis je vis
  rationale: Le syntagme enchaîne une nouvelle vision à la précédente. « Puis » rend naturellement cette progression sans imposer le sens itératif plus marqué de « de nouveau ».
- source_word: ይርዐዩ፡ ኖሎት
  choice: les bergers faire paître
  rationale: Conserve l’image pastorale et la construction où le voyant observe l’action des bergers.
- source_word: ፲ወ፪ሰዓተ
  choice: pendant douze heures
  rationale: Rend littéralement la durée exprimée dans le texte éthiopien, sans expliciter sa portée symbolique éventuelle.
- source_word: ገብኡ
  choice: revinrent
  rationale: Dans ce contexte de restauration, traduit le mouvement de retour des trois brebis conformément au sens contextuel retenu par la tradition textuelle consultée.
- source_word: ሐንጹ
  choice: rebâtir
  rationale: Le verbe désigne ici une activité de construction ou de reconstruction ; « rebâtir » convient à ce qui s’était écroulé.
- source_word: ኵሎ፡ … ወድቀ፡ እምዛቲ፡ ቤት
  choice: tout ce qui s’était écroulé de cette maison
  rationale: Formulation française naturelle qui conserve l’idée que les parties effondrées de la maison font l’objet de la reconstruction.
theological_decisions:
- issue: Valeur symbolique des douze heures et identité des trois brebis
  choice: Ne pas identifier les référents dans le corps du texte
  alternative: Nommer explicitement une période historique ou des personnages précis
  rationale: Le verset demeure allégorique et ne fournit pas lui-même ces identifications ; les ajouter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, narratif et digne. L’image allégorique des bergers, des brebis et de la maison est conservée sans paraphrase interprétative.
