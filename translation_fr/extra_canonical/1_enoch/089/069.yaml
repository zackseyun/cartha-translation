base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: fr
  text: Et ils continuaient à tuer et à détruire au-delà de la mesure qui leur était prescrite[a], tandis que moi, je pleurais et criais à cause de ces brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà de l’ordre qui leur avait été fixé » ou « au-delà du nombre qui leur avait été assigné ». Le terme guèze peut désigner un ordre, une règle, une disposition ou une quantité déterminée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: au-delà de la mesure qui leur était prescrite
  rationale: ፈድፋደ avec እም exprime le dépassement, tandis que ሥርዓት désigne un ordre, une règle ou une mesure fixée. Cette formulation conserve à la fois l’idée d’excès et celle d’une limite imposée.
- source_word: ይቀትል
  choice: ils continuaient à tuer
  rationale: L’imparfait guèze peut ici décrire une action répétée ou prolongée dans le récit visionnaire.
- source_word: ያሐጕል
  choice: à détruire
  rationale: Le verbe, dont la forme transmise est difficile, évoque la ruine ou la destruction. Le choix reste volontairement général afin de ne pas imposer une précision incertaine.
- source_word: እንዘ
  choice: tandis que
  rationale: La leçon sous-jacente est la particule circonstancielle እንዘ, et non un terme signifiant « dormir ». Elle relie ici les verbes de lamentation dans une construction continue.
- source_word: እብኪ
  choice: je pleurais
  rationale: L’imparfait français rend l’action en cours et conserve directement l’expression de la douleur.
- source_word: አዐውዩ
  choice: criais
  rationale: Le verbe indique une lamentation audible ou un cri; « criais » reste naturel sans le limiter à un rituel particulier.
- source_word: በእንተ ዝኩ አባግዕ
  choice: à cause de ces brebis
  rationale: በእንተ peut exprimer le motif ou l’objet de la plainte. « Ces brebis » maintient l’imagerie animale de la vision.
theological_decisions:
- issue: Faut-il identifier explicitement les brebis à Israël ou au peuple dans le texte principal ?
  choice: Conserver « ces brebis » comme image visionnaire
  alternative: Traduire par « ce peuple » ou « Israël »
  rationale: Le texte présente une apocalypse animale. La traduction doit préserver son symbole sans imposer dans le corps du texte une identification interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. L’imparfait soutient la continuité de la scène visionnaire; la formulation conserve l’ambiguïté de ሥርዓት entre ordre prescrit et mesure assignée.
