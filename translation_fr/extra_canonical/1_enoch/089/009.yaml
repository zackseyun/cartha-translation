base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: fr
  text: Et ce taureau blanc, qui était devenu un homme, sortit de cette arche[a], et trois taureaux sortirent avec lui. L’un de ces trois taureaux était blanc et ressemblait à ce taureau blanc, l’un était rouge comme le sang, et l’autre était noir. Et ce taureau blanc s’éloigna d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon transmise ici est difficile. Le contexte du déluge permet de comprendre « arche » ; le terme attendu désigne littéralement un bateau ou un navire.
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: taureau
  rationale: Le substantif désigne ici la figure bovine mâle récurrente de la vision; « taureau » conserve cette image symbolique précise.
- source_word: ጸዐዳ
  choice: blanc
  rationale: Le terme exprime directement la couleur blanche, essentielle au contraste symbolique entre les animaux.
- source_word: ዘኮነ ብእሴ
  choice: qui était devenu un homme
  rationale: La relative et le verbe « devenir » décrivent une transformation antérieure à la sortie.
- source_word: ወጽአ እምዝኩ መስቀር
  choice: sortit de cette arche
  rationale: La forme transcrite መስቀር paraît corrompue; le contexte immédiat du récit du déluge et la correction probable en መርከብ indiquent un bateau, ici naturellement rendu par « arche ».
- source_word: ፪አልህምት
  choice: trois taureaux
  rationale: Malgré l’apparence du chiffre dans la transcription, les données textuelles et la suite qui énumère trois animaux soutiennent « trois taureaux ».
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: était blanc et ressemblait à ce taureau blanc
  rationale: « Blanc » est le prédicat du premier des trois taureaux, tandis que le verbe suivant exprime sa ressemblance avec le taureau déjà mentionné.
- source_word: ቀይሕ ከመ ደም
  choice: rouge comme le sang
  rationale: Cette formulation garde la comparaison explicite et saisissante du guèze.
- source_word: ጸሊም
  choice: noir
  rationale: Le terme de couleur est rendu directement afin de préserver le contraste de la vision.
- source_word: ኀለፈ እምኔሆሙ
  choice: se sépara d’eux
  rationale: Le verbe indique qu’il passa ou s’éloigna d’auprès d’eux; cette traduction exprime la séparation sans suggérer nécessairement sa mort.
theological_decisions:
- issue: Identification du taureau blanc devenu homme et des trois taureaux
  choice: Conserver les figures animales de la vision sans les identifier dans le texte traduit.
  alternative: Identifier explicitement le taureau blanc et les trois autres à Noé et à ses fils, ou à d’autres personnages patriarcaux selon l’interprétation du contexte.
  rationale: La traduction doit préserver la forme symbolique propre à l’Apocalypse des animaux et ne pas transformer une lecture interprétative en identification explicite.
