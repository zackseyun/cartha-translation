  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement répétitif du texte visionnaire, tout en évitant une lourdeur excessive. « Arche » rend clairement le référent contextuel, avec une note signalant la difficulté du témoin transcrit.
