base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: fr
  text: Et de cela[a], je vis les loups, et ils devinrent extrêmement puissants contre les brebis avec toute leur force, et les brebis poussèrent des cris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de lui » ou « de là » ; le suffixe pronominal peut recevoir plusieurs référents selon le contexte de la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: de là
  rationale: La préposition እም avec suffixe pronominal peut signifier « de lui », « de cela » ou, selon le contexte, « de là ». « De là » garde en français une référence souple sans imposer un antécédent masculin ou neutre.
- source_word: ርኢክዎሙ
  choice: je vis
  rationale: Formule narrative simple et naturelle qui conserve le style du récit visionnaire à la première personne.
- source_word: አዝእብት
  choice: les loups
  rationale: Le terme est le pluriel de « loup » et doit conserver l’imagerie animale précise de l’Apocalypse des animaux.
- source_word: አፎ
  choice: et ils
  rationale: Dans cette construction, le terme introduit la manière ou le degré (« comment »). Une coordination directe est plus naturelle en français, sans ajouter à tort les « oiseaux ».
- source_word: ጸንዑ ፈድፋደ
  choice: devinrent extrêmement puissants
  rationale: 'ጸንዑ exprime le fait de devenir forts ou puissants, tandis que ፈድፋደ renforce le degré : « extrêmement ».'
- source_word: ዲበ አባግዕ
  choice: contre les brebis
  rationale: Bien que ዲበ signifie souvent « sur », le contexte hostile justifie « contre »; « brebis » maintient l’image concrète et le contraste avec les loups.
- source_word: በኵሉ ኃይሎሙ
  choice: de toute leur force
  rationale: Rend l’idée de totalité de la puissance exercée, dans une formulation française idiomatique et vigoureuse.
- source_word: ጸርኁ
  choice: poussèrent des cris
  rationale: Le verbe désigne un cri à haute voix sans préciser s’il s’agit d’une plainte, d’une alarme ou d’un appel.
theological_decisions:
- issue: Imagerie symbolique de l’Apocalypse des animaux
  choice: Conserver les termes concrets « loups » et « brebis » sans identifier leurs référents historiques dans le corps du texte.
  alternative: Traduire explicitement les animaux comme des peuples ou des groupes humains.
  rationale: Le texte rapporte les figures vues dans la vision. Les interpréter directement dans la traduction réduirait l’ambiguïté symbolique propre au passage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition des brebis et l’intensité de l’assaut, tout en évitant d’introduire les « oiseaux » ou une idée d’accroissement absente de cette lecture du guèze.
