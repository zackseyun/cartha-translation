  terminology: « Loups » et « brebis » respectent précisément l’imagerie animale. « Extrêmement puissants » rend bien le verbe de devenir fort et l’adverbe intensif; aucune interprétation historique ou doctrinale n’est introduite. L’ancre unique de note est correctement placée sur le pronom ambigu.
