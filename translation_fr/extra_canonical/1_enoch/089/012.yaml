base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: fr
  text: Et ce taureau qui était né de lui engendra un sanglier noir et un mouton blanc[a]. Le sanglier engendra beaucoup de sangliers, et le mouton engendra douze moutons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage poursuit la généalogie symbolique de la vision au moyen de figures animales. La traduction conserve ces figures sans leur substituer leurs référents historiques probables.
    reason: cultural_note
lexical_decisions:
- source_word: ላህም
  choice: taureau
  rationale: Le démonstratif ውእቱ et la relative ዘተወልደ sont masculins dans ce contexte; « taureau » respecte donc mieux la grammaire et la généalogie symbolique que « génisse ».
- source_word: ሐራዊያ ገዳም ጸሊመ
  choice: un sanglier noir
  rationale: Le terme désigne un porc sauvage et l'adjectif de couleur est explicite; « sanglier noir » conserve les deux éléments de l'image.
- source_word: በግዐ ጸዐዳ
  choice: un mouton blanc
  rationale: Le nom désigne un ovin sans imposer ici en français une identification plus précise comme « bélier » ou « brebis »; la couleur symbolique est maintenue.
- source_word: አሕርወ ብዙኃነ
  choice: beaucoup de sangliers
  rationale: Le pluriel reprend l'image porcine précédente; cette formulation naturelle conserve la continuité symbolique.
- source_word: ዐሠርተ ወክልኤተ አባግዐ
  choice: douze moutons
  rationale: Le nombre signifie littéralement « dix et deux » et le substantif est le pluriel du terme désignant les ovins; « moutons » évite de préciser indûment l'âge ou le sexe.
theological_decisions:
- issue: Identification des animaux symboliques dans l'Apocalypse des animaux
  choice: Conserver dans le texte les figures animales sans nommer leurs référents historiques présumés.
  alternative: Remplacer les animaux par les noms des personnages ou des peuples qu'ils pourraient représenter.
  rationale: Le récit présente une vision allégorique continue. Traduire directement les référents supposés supprimerait l'imagerie propre au texte et transformerait une interprétation en traduction.
translation_notes:
  register: Français international moderne, simple et digne. La répétition d’« engendra » et des noms d’animaux est conservée pour rendre la structure généalogique et la progression de la vision. Le sujet des deux dernières propositions est explicité en français (« le sanglier », « le mouton ») afin d’éviter une ambiguïté pronominale artificielle.
