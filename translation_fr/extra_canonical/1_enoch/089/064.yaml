base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: fr
  text: Qu’ils n’en sachent rien, ne leur montre rien et ne les réprimande pas. Mais consigne toutes les destructions des bergers, une à une, au moment voulu[a], et fais monter tout cela jusqu’à moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression éthiopienne associe une indication de temps à une valeur distributive : « une à une, au moment voulu » ; elle peut aussi se comprendre comme « chacune en son temps ».'
    reason: textual_clarity
  - marker: b
    text: Littéralement, le verbe évoque le fait de « faire monter » ou d’« apporter en haut » ; dans ce contexte, il peut aussi signifier « présenter » au locuteur céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: Qu’ils n’en sachent rien
  rationale: 'Le préfixe de troisième personne du pluriel et la négation donnent ici un jussif négatif : le locuteur ordonne que les bergers restent dans l’ignorance.'
- source_word: ወኢታርእዮሙ
  choice: ne leur montre rien
  rationale: La forme est à la deuxième personne du masculin singulier, dans une série d’ordres négatifs. En français, « leur montrer » exprime naturellement le fait de révéler quelque chose aux bergers sans ajouter un objet précis absent du texte.
- source_word: ወኢትዝለፎሙ
  choice: et ne les réprimande pas
  rationale: La forme à la deuxième personne du singulier interdit de reprendre ou de blâmer les bergers. « Réprimander » conserve le ton judiciaire sans être archaïque.
- source_word: አላ፡ ጸሐፍ
  choice: Mais consigne
  rationale: L’adversatif suivi de l’impératif oppose la non-intervention à la tenue d’un relevé. « Consigner » rend la portée documentaire de l’ordre.
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: tous les ravages causés par les bergers
  rationale: Le nom désigne destruction, ruine ou perte. Le contexte immédiat de l’Apocalypse des animaux présente les bergers comme les auteurs des ravages ; cette formulation française évite de suggérer à tort leur propre destruction.
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: chacun en son temps
  rationale: 'La construction associe une indication temporelle à une valeur distributive : les actes de chaque berger doivent être relevés selon le temps qui lui correspond.'
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: et fais monter le tout jusqu’à moi
  rationale: Le verbe causatif garde l’image d’une montée vers le locuteur céleste, tout en restant intelligible en français courant.
theological_decisions:
- issue: Non-intervention provisoire envers les bergers
  choice: Le locuteur ordonne à l’ange de ne pas informer, dévoiler ni réprimander les bergers, mais de consigner leurs ravages en vue d’une présentation ultérieure.
  alternative: 'Lire les premiers verbes comme un récit au passé : « ils ne savaient pas, je ne leur ai pas montré et je ne les ai pas réprimandés ».'
  rationale: Les formes verbales soutiennent des jussifs et impératifs négatifs, non des verbes narratifs à la première personne. Cette lecture maintient la tension du passage entre absence d’intervention immédiate et jugement différé.
- issue: Auteur ou victime de la destruction
  choice: Les bergers sont présentés comme les auteurs des ravages consignés.
  alternative: Comprendre l’expression comme annonçant la destruction subie par les bergers.
  rationale: La relation génitive peut être concise dans la source, mais le contexte narratif demande à l’ange d’observer et d’enregistrer ce que les bergers font aux brebis. La traduction suit ce contexte sans atténuer leur responsabilité.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs négatifs sont rendus clairement, sans archaïsme. « Bergers » conserve l’image directrice de l’Apocalypse des animaux, et « fais monter » préserve l’orientation céleste de la scène.
