base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: fr
  text: « Je vous les livrerai en nombre[a], et je vous dirai lesquels d’entre eux doivent être détruits[b] ; ceux-là, vous les détruirez. » Puis il leur livra ces brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par nombre » ou « selon le nombre » ; l’expression peut évoquer une remise après dénombrement ou selon un nombre fixé.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « lesquels d’entre eux sont destinés à périr ». Le texte ne nomme pas ici l’agent ultime de leur destruction.'
    reason: alternative_reading
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: Je vous les livrerai
  rationale: Le verbe, à la première personne avec un destinataire pluriel, exprime ici l’action de remettre ou livrer. Le pronom « les » explicite naturellement en français l’objet repris par le contexte.
- source_word: በኍልቍ
  choice: en nombre
  rationale: L’expression renvoie au dénombrement ou à une quantité déterminée, plutôt qu’à la vérité du discours. « En nombre » conserve la formulation concise et légèrement inhabituelle du témoin.
- source_word: እነግረክሙ
  choice: je vous dirai
  rationale: Verbe de déclaration adressé à plusieurs personnes ; « dire » est naturel et exact dans ce discours direct.
- source_word: ዘይትኃጐል እምኔሆሙ
  choice: lesquels d’entre eux doivent être détruits
  rationale: La proposition relative désigne, au sein du groupe, ceux qui sont voués à la destruction. Cette formulation française rend la valeur distributive et la portée du passif sans préciser l’agent.
- source_word: ኪያሆሙ አኅጕሉ
  choice: ceux-là, vous les détruirez
  rationale: 'Le pronom détaché reçoit une valeur emphatique : ce sont précisément les individus désignés qui devront être détruits. Le futur français convient au commandement prophétique dans ce contexte.'
- source_word: ወመጠወ ሎሙ
  choice: Puis il leur livra
  rationale: La forme est active, à la troisième personne du masculin singulier, avec un complément indirect pluriel. « Livra » maintient le lien lexical avec le verbe initial et la tonalité de jugement.
- source_word: ዝኩ አባግዐ
  choice: ces brebis
  rationale: Malgré la difficulté morphologique de la séquence, le contexte et la révision textuelle indiquent un groupe de brebis remis aux destinataires. Le démonstratif français marque qu’elles ont déjà été désignées.
theological_decisions:
- issue: Portée de la remise des brebis
  choice: livrer
  alternative: confier
  rationale: « Livrer » préserve la tonalité menaçante du passage et son lien avec la destruction annoncée, sans identifier davantage l’autorité ou les agents impliqués.
- issue: Agent de la destruction dans la relative
  choice: doivent être détruits
  alternative: sont destinés à périr
  rationale: Le passif maintient l’agent implicite et évite de résoudre la tension entre décret divin et action des bergers.
translation_notes:
  register: Français international moderne, digne et narratif. Le discours direct se poursuit depuis le verset précédent. La répétition de « livrer » reflète la reprise du même verbe guèze, tandis que « ceux-là » conserve l’emphase de l’objet antéposé.
