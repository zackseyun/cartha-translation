base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: fr
  text: Et je continuai à regarder dans la vision, jusqu’à ce que ce mouton devienne un homme[a]. Il bâtit une maison[b] pour le Seigneur des moutons et y plaça tous les moutons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transformation du mouton en « homme » appartient au symbolisme de la vision; le texte ne précise pas ici l’identité de cette figure.
    reason: cultural_note
  - marker: b
    text: Le mot signifie littéralement « maison », avec probablement ici une connotation de sanctuaire ou de temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: mouton
  rationale: Le terme générique maintient l’imagerie animale suivie de l’Apocalypse des animaux, sans préciser indûment l’âge ou le sexe.
- source_word: ኮነ ብእሴ
  choice: devienne un homme
  rationale: Cette formulation conserve la transformation saisissante du mouton en figure humaine au sein de la vision.
- source_word: ሐነጸ ቤተ
  choice: bâtit une maison
  rationale: Le guèze dit littéralement « maison »; le texte principal préserve cette image plutôt que d’imposer l’interprétation « temple ».
- source_word: ለእግዚአ አባግዕ
  choice: pour le Seigneur des moutons
  rationale: « Seigneur » convient au registre élevé et conserve la portée théologique possible de እግዚአ sans réduire le terme à « propriétaire ».
- source_word: አቀሞሙ
  choice: y plaça tous les moutons
  rationale: Le causatif peut exprimer le fait de faire tenir debout, de placer ou d’établir. « Plaça » est naturel ici tout en restant dans cette gamme sémantique.
- source_word: በውእቱ ቤት
  choice: y
  rationale: Le pronom locatif français renvoie clairement à la maison qui vient d’être mentionnée et évite une répétition lourde.
theological_decisions:
- issue: Rendre ቤተ par « maison » ou l’interpréter comme « temple »
  choice: maison
  alternative: temple; sanctuaire
  rationale: Le sens cultuel est vraisemblable dans le contexte, mais le mot source demeure « maison »; la traduction conserve donc l’image et signale la connotation possible en note.
- issue: Identifier le mouton devenu homme
  choice: laisser son identité implicite
  alternative: Moïse; une figure dirigeante liée à Moïse ou au culte d’Israël
  rationale: Le verset présente une transformation symbolique sans nommer la figure. L’identifier relèverait de l’interprétation plutôt que de la traduction.
- issue: Nuance de አቀሞሙ
  choice: plaça
  alternative: fit tenir debout; établit
  rationale: « Plaça » rend naturellement l’action dans la maison, tout en laissant ouverte la nuance plus concrète ou institutionnelle du causatif.
translation_notes:
  register: Français international moderne, clair et digne. « Je continuai à regarder » rend la tournure durative « je vis… jusqu’à » de façon naturelle. Le passé simple maintient le registre narratif soutenu sans archaïsme excessif.
