base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: fr
  text: Après cela, je vis qu’ils abandonnèrent la maison du Seigneur et sa tour[a]. Ils s’égarèrent tous, et leurs yeux furent aveuglés. Je vis alors le Seigneur des brebis provoquer un grand massacre parmi elles, dans leur pâturage, jusqu’à ce que ces brebis l’appellent à cause de ce massacre et livrent son lieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « tour » peut aussi désigner une bergerie ou un enclos; dans la vision, il appartient probablement à l’ensemble symbolique du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase est difficile. On peut aussi comprendre que les brebis « appellent ce massacre » — voire qu’elles « l’invitent » — et qu’elles « abandonnent son lieu »; une autre analyse du dernier verbe donne « entrent dans son lieu ».
    reason: textual_and_syntactic_uncertainty
lexical_decisions:
- source_word: ኃደጉ
  choice: abandonnèrent
  rationale: Le verbe exprime ici un départ volontaire et coupable; « abandonnèrent » est plus précis que le simple « quittèrent ».
- source_word: ቤተ ለእግዚአ
  choice: la maison du Seigneur
  rationale: La formule désigne, dans le symbolisme de la vision, le sanctuaire; cette traduction reste naturelle sans expliciter l’identification.
- source_word: ማኅፈዶ
  choice: sa tour
  rationale: « Tour » conserve l’image architecturale du complexe symbolique, tandis que les sens possibles « enclos » et « bergerie » sont signalés en note.
- source_word: እምኵሉ ስሕቱ
  choice: ils s’égarèrent tous
  rationale: Cette formulation restitue la totalité exprimée par እምኵሉ et convient naturellement à l’allégorie des brebis.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: leurs yeux furent aveuglés
  rationale: Le passif garde l’image forte de la perte de la vue sans préciser l’agent au-delà du texte.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Ce titre récurrent de l’Apocalypse des animaux demande un registre élevé et cohérent.
- source_word: ገብረ ቀትለ ብዙኃ
  choice: provoquer un grand massacre
  rationale: La construction attribue directement au Seigneur l’accomplissement du massacre; « provoquer » garde cette causalité en français idiomatique.
- source_word: በመራዕይሆሙ
  choice: dans leur pâturage
  rationale: Le terme renvoie au lieu où paissent les brebis; le singulier collectif est naturel en français.
- source_word: ይጼውዕዎ … ለዝኩ ቀትል
  choice: l’appellent à cause de ce massacre
  rationale: Le suffixe objet masculin singulier de ይጼውዕዎ est rendu par « l’ »; la formule avec ለ est comprise comme indiquant le motif de l’appel, tout en évitant de transformer cet appel en invitation au massacre.
- source_word: አግብኡ መካኖ
  choice: livrent son lieu
  rationale: La forme causative peut exprimer l’idée de remettre ou de livrer. La leçon demeure difficile; les autres compréhensions importantes sont conservées en note.
theological_decisions:
- issue: Rôle du Seigneur dans le massacre
  choice: le Seigneur des brebis provoquer un grand massacre
  alternative: le Seigneur des brebis permettre un grand massacre
  rationale: Le guèze présente le Seigneur comme agent actif. La traduction conserve cette tension théologique au lieu de l’atténuer en simple permission.
- issue: Sens de l’appel des brebis
  choice: elles l’appellent à cause de ce massacre
  alternative: elles appellent ce massacre / invitent ce massacre
  rationale: Le suffixe objet de troisième personne est conservé par « l’ », mais l’enchaînement syntaxique est difficile. Le texte principal retient un appel adressé au Seigneur motivé par le massacre, sans effacer l’autre analyse possible.
- issue: Action finale concernant le lieu du Seigneur
  choice: elles livrent son lieu
  alternative: elles abandonnent son lieu / elles entrent dans son lieu
  rationale: La forme verbale est discutée. « Livrent » reflète sa valeur causative possible, tandis que la note préserve les lectures concurrentes sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases ont été légèrement segmentées pour la clarté, tout en conservant la répétition visionnaire de « je vis ». Les images de la maison, de la tour, des brebis, du pâturage et de l’aveuglement restent non explicitées dans le corps du texte.
