base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: fr
  text: Et ils commencèrent à s’encorner les uns les autres[a]. Ce taureau blanc qui était né au milieu d’eux engendra un âne sauvage et, avec lui, un taureau blanc[b] ; puis les ânes sauvages se multiplièrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte transmis est difficile à cet endroit. Le verbe semble décrire des animaux qui s’attaquent mutuellement ; on pourrait aussi traduire : « se heurter » ou « se frapper les uns les autres ».'
    reason: textual_variant
  - marker: b
    text: Littéralement, « un taureau blanc avec lui ». L’expression peut indiquer que les deux animaux appartiennent à la même descendance, sans nécessairement préciser qu’ils sont nés au même moment.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: ይትናሰኩ
  choice: commencèrent à s’encorner les uns les autres
  rationale: Le verbe pluriel réciproque décrit vraisemblablement une action violente mutuelle. « S’encorner » conserve l’imagerie bovine concrète, tout en signalant en note la difficulté textuelle.
- source_word: ላህም ጸዓዳ
  choice: taureau blanc
  rationale: Le substantif bovin, qualifié par le terme de couleur, désigne ici la figure animale mâle de la généalogie symbolique. « Blanc » préserve la couleur significative de la vision.
- source_word: ዘተወልደ ማእከሎሙ
  choice: qui était né au milieu d’eux
  rationale: La proposition relative qualifie le taureau blanc ; elle ne constitue pas le verbe principal. Cette formulation garde clairement la syntaxe du ge‘ez.
- source_word: ወለደ
  choice: engendra
  rationale: Le verbe est actif et gouverne les deux descendants. « Engendra » rend précisément la relation généalogique sans décoder l’allégorie.
- source_word: አድገ ገዳም
  choice: un âne sauvage
  rationale: L’expression au singulier désigne un âne de la campagne ou du désert, donc un âne sauvage, plutôt qu’un bovin.
- source_word: ላህመ ጸዓዳ ምስሌሁ
  choice: avec lui, un taureau blanc
  rationale: La coordination présente un second descendant, bovin et blanc. « Avec lui » conserve la relation exprimée par ምስሌሁ sans préciser davantage la simultanéité.
- source_word: በዝኁ አእዱገ ገዳም
  choice: les ânes sauvages se multiplièrent
  rationale: Le pluriel አእዱገ et le verbe d’accroissement appellent naturellement cette traduction.
theological_decisions:
- issue: Conservation de l’imagerie animale symbolique
  choice: Maintenir « taureau blanc » et « âne sauvage » sans identifier les personnages historiques dans le texte.
  alternative: Remplacer les animaux par les personnes ou les peuples qu’ils peuvent symboliser.
  rationale: La vision communique au moyen d’une allégorie animale suivie. La traduction doit en préserver la forme concrète et laisser l’interprétation en dehors du texte principal.
- issue: Relation entre les deux descendants
  choice: Faire de « engendra » le verbe principal gouvernant « un âne sauvage » et « un taureau blanc ».
  alternative: Lire la proposition comme une simple suite de naissances indépendantes.
  rationale: La syntaxe du ge‘ez fait du taureau blanc le sujet de ወለደ et présente ensuite les deux animaux comme sa descendance ; cela préserve aussi la tension généalogique propre à l’allégorie sans la décoder.
translation_notes:
  register: Français international actuel, clair et digne. L’imagerie animale reste concrète ; « engendra » est retenu pour sa précision généalogique malgré son registre légèrement soutenu. Tous les marqueurs de notes figurent dans le texte principal.
