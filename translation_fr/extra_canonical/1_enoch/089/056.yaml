base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: fr
  text: Et je vis qu’il abandonna leur maison et leur tour[a], et qu’il les livra tous entre les mains des lions[b], pour qu’ils les déchirent, et entre les mains de toutes les bêtes sauvages[c], pour qu’elles les dévorent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison » et la « tour » sont les images mêmes de la vision ; elles ne sont pas identifiées ici de façon explicite au Temple, à un enclos ou à la communauté.
    reason: cultural_note
  - marker: b
    text: L’expression « entre les mains de » signifie ici « au pouvoir de ».
    reason: lexical_alternative
  - marker: c
    text: 'L’ordre du guèze peut aussi se rendre ainsi : « il les livra tous entre les mains des lions, pour qu’ils les déchirent et les dévorent, entre les mains de toutes les bêtes sauvages ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ሐደጎ
  choice: abandonna
  rationale: Le verbe exprime l’action de laisser ou de délaisser. « Abandonna » conserve ici la force du jugement, plus nettement que le simple « laissa ».
- source_word: ቤተ
  choice: maison
  rationale: Le sens premier est « maison ». La traduction maintient l’image concrète de la vision sans l’interpréter directement comme le Temple ou la communauté.
- source_word: ማኅፈዶሙ
  choice: leur tour
  rationale: Dans ce contexte architectural, « tour » convient à une construction protectrice associée à la maison, tout en préservant l’image symbolique du récit.
- source_word: ወደዮሙ ለኵሎሙ
  choice: il les livra tous
  rationale: Le verbe accompagné de la mention des mains exprime une remise au pouvoir d’autrui. « Les livra tous » rend clairement cette idée et ne reprend pas la mention de « bien-aimés » de la couche anglaise, laquelle n’est pas étayée par les mots présents dans le texte guèze fourni.
- source_word: ዲበ እደ / ውስተ እደዊሆሙ
  choice: entre les mains de
  rationale: Cette expression sémitique signifie être livré au pouvoir d’un autre. La conserver maintient la texture biblique et apocalyptique tout en restant intelligible en français.
- source_word: አናብስት
  choice: lions
  rationale: Le nom désigne ordinairement des lions. L’animal concret est conservé sans décoder sa valeur symbolique.
- source_word: ይምሥጥዎሙ
  choice: qu’ils les déchirent
  rationale: Dans le parallélisme avec l’action de dévorer, le verbe évoque l’attaque violente de prédateurs. « Déchirer » restitue cette force en français courant.
- source_word: ይብልዕዎሙ
  choice: qu’elles les dévorent
  rationale: Le verbe signifie manger ou consommer. « Dévorer » convient au caractère violent de la scène.
- source_word: አራዊት
  choice: bêtes sauvages
  rationale: Le terme renvoie aux animaux sauvages. Ce choix préserve leur caractère menaçant et les distingue des animaux domestiques de la vision.
theological_decisions:
- issue: Faut-il identifier explicitement la « maison » comme le Temple ou comme la communauté ?
  choice: Conserver « maison » et « tour » comme images de la vision.
  alternative: Traduire de manière interprétative par « Temple » ou par « maison et enclos » selon le référent symbolique supposé.
  rationale: Le texte présente des images apocalyptiques dont le référent ne doit pas être imposé dans la traduction. Leur portée symbolique demeure ainsi ouverte.
- issue: Faut-il remplacer l’expression des « mains » par une formulation entièrement explicative ?
  choice: Employer « entre les mains de » dans le texte principal.
  alternative: Dire « au pouvoir de » ou simplement « livra aux lions et aux bêtes sauvages ».
  rationale: L’expression des mains marque la remise sous le contrôle d’autrui et conserve le registre biblique sans être obscure en français.
- issue: Comment ordonner les deux groupes de prédateurs et les deux propositions de but ?
  choice: Associer les lions à l’action de déchirer et les bêtes sauvages à celle de dévorer.
  alternative: Conserver strictement l’ordre linéaire guèze, qui peut rattacher les deux actions aux lions avant de mentionner les bêtes sauvages.
  rationale: La syntaxe guèze permet une structure enveloppante. L’ordre retenu produit une phrase française claire sans effacer l’autre rattachement possible, signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif de la vision et son imagerie animale sont conservés. La formulation évite l’ajout « tous leurs bien-aimés » de la couche anglaise, car le texte guèze fourni porte plutôt « il les livra tous ». Les accords de « ils » avec les lions et de « elles » avec les bêtes rendent explicite le rattachement adopté en français.
