base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: fr
  text: Quand ces douze brebis eurent grandi, elles remirent l’une d’entre elles aux ânes. À leur tour, ces ânes remirent cette brebis aux loups, et cette brebis grandit au milieu des loups.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ
  choice: eurent grandi / grandit
  rationale: Le verbe exprime la croissance ou le fait de devenir grand; le rendu français varie seulement pour respecter le sujet pluriel puis singulier.
- source_word: አባግዕ / በግዕ
  choice: brebis
  rationale: Le terme désigne les membres du troupeau ovin dans l’allégorie; « brebis » maintient le fil imagé et convient au singulier comme au pluriel.
- source_word: መጦውዎ
  choice: livrèrent
  rationale: Le contexte décrit une remise à la puissance d’un autre groupe; « livrer » restitue mieux cette nuance que le simple « donner ».
- source_word: አእዱግ
  choice: ânes
  rationale: Équivalent direct du nom pluriel guèze.
- source_word: አዝእብት
  choice: loups
  rationale: Équivalent direct du nom pluriel guèze, conservant l’image animale de l’allégorie.
- source_word: ካዕበ
  choice: à leur tour
  rationale: Marque la répétition ou la succession de l’action; cette tournure est naturelle en français et conserve l’enchaînement.
- source_word: ማእከለ
  choice: au milieu de
  rationale: Rend directement la localisation centrale ou l’environnement au sein duquel la brebis grandit.
theological_decisions:
- issue: Identification des animaux de l’allégorie
  choice: Ne pas expliciter les référents historiques dans le corps du texte
  alternative: Remplacer ou accompagner les animaux par les peuples ou personnages qu’ils représentent
  rationale: Le verset source demeure allégorique; expliciter les identités historiques résoudrait une interprétation que le texte lui-même laisse sous forme d’images.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « cette brebis » est maintenue afin de préserver la chaîne référentielle et le rythme narratif du guèze.
