base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: fr
  text: Et il envoya beaucoup d’autres brebis vers ces brebis, afin qu’elles fassent entendre leur voix[a] et poussent des cris à leur sujet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’elles fassent entendre »; on pourrait aussi comprendre : « qu’elles proclament » ou « qu’elles témoignent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur elles »; peut-être : « contre elles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ
  choice: d’autres
  rationale: Le terme distingue ce groupe de brebis de celui déjà mentionné; « d’autres » convient naturellement au pluriel.
- source_word: አባግዕ
  choice: brebis
  rationale: « Brebis » conserve l’image animale stable de cette vision apocalyptique sans l’interpréter explicitement.
- source_word: ብዙኃነ
  choice: beaucoup
  rationale: Cette formulation rend simplement la quantité importante du groupe envoyé.
- source_word: ፈነወ
  choice: il envoya
  rationale: La forme verbale est un parfait à la troisième personne du masculin singulier, et non à la première personne.
- source_word: ኀቤሆሙ / ለዝኩ አባግዕ
  choice: vers ces brebis
  rationale: « Vers » exprime la direction, tandis que le démonstratif identifie le groupe destinataire sans remplacer l’image symbolique.
- source_word: ያስምዑ
  choice: qu’elles fassent entendre leur voix
  rationale: La forme causative signifie littéralement « faire entendre ». L’ajout idiomatique de « leur voix » en français explicite l’objet implicite sans réduire le verbe à la simple audition.
- source_word: የአውይዉ
  choice: poussent des cris
  rationale: Le verbe désigne un cri intense pouvant exprimer la détresse, la lamentation ou la protestation; cette traduction n’en fixe pas indûment la tonalité.
- source_word: ዲቤሆሙ
  choice: à leur sujet
  rationale: La préposition peut exprimer ici une relation concernant les brebis visées. Le choix principal reste naturel en français, tandis que les autres nuances sont signalées en note.
theological_decisions:
- issue: Identité symbolique des « autres brebis »
  choice: Conserver littéralement l’image des « autres brebis » sans identifier leur référent historique ou théologique.
  alternative: Les identifier comme des prophètes, des dirigeants fidèles ou un groupe réformateur au sein d’Israël.
  rationale: Le passage appartient à une vision symbolique; la traduction doit préserver cette image et sa tension interprétative.
- issue: Portée de l’action exprimée par ያስምዑ
  choice: Rendre explicitement la valeur causative par « fassent entendre leur voix ».
  alternative: « proclament », « témoignent » ou « entendent ».
  rationale: « Proclamer » et « témoigner » interprètent davantage le contenu de l’action, tandis que « entendre » perd la morphologie causative du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « brebis » est conservée pour maintenir la structure et le symbolisme de la vision. Les pronoms féminins renvoient grammaticalement aux brebis, sans résoudre leur identité symbolique.
