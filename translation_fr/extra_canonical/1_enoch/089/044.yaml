base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: fr
  text: Et cette brebis, dont les yeux avaient été ouverts, vit ce bélier au milieu des brebis. Celui-ci avait abandonné sa gloire ; il se mit à frapper ces brebis de ses cornes et à les piétiner, et il allait çà et là sans dignité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans bienséance » ou « d’une manière indigne ». Le texte décrit vraisemblablement une conduite inconvenante, plutôt que l’absence de quelqu’un qui aurait pu retenir le bélier.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: brebis
  rationale: Dans l’Apocalypse des animaux, « brebis » maintient l’image suivie du troupeau et désigne naturellement ici un individu de celui-ci.
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: dont les yeux avaient été ouverts
  rationale: La tournure passive préserve l’idée d’une perception accordée ou éveillée, sans attribuer explicitement l’ouverture des yeux à l’animal lui-même.
- source_word: ሐርጌ
  choice: bélier
  rationale: Le terme désigne un mouton mâle ; « bélier » est l’équivalent français naturel et conserve le symbolisme animal.
- source_word: ዘማእከለ አባግዕ
  choice: au milieu des brebis
  rationale: Cette formulation restitue directement la position du bélier à l’intérieur du troupeau.
- source_word: ዘሐደገ ስብሐተ
  choice: avait abandonné sa gloire
  rationale: « Gloire » garde l’éventail symbolique de ስብሐት — honneur, éclat ou dignité — sans imposer une interprétation précise.
- source_word: አሐዘ ይጉድኦሙ
  choice: se mit à frapper ces brebis de ses cornes
  rationale: La traduction exprime le commencement de l’action et rend concrètement la violence propre à un bélier, dans un français plus courant que « encorner ».
- source_word: ወኬዶሙ
  choice: et à les piétiner
  rationale: « Piétiner » prolonge naturellement l’image de l’agression animale et rend le mouvement violent contre les brebis.
- source_word: ወሖረ ዘእንበለ ተደላ
  choice: et il allait çà et là sans dignité
  rationale: ተደላ relève de ce qui est convenable, digne ou bienséant ; « sans dignité » évite le sens non étayé de « sans que personne le retienne », tandis que « allait çà et là » rend ወሖረ.
theological_decisions:
- issue: Sens de la « gloire » abandonnée par le bélier
  choice: Conserver littéralement « gloire » sans en préciser le référent symbolique.
  alternative: honneur ; splendeur ; dignité royale ; force
  rationale: Le terme guèze reste large et le cadre visionnaire permet plusieurs référents. La traduction ne doit pas décider s’il s’agit d’un rang royal, d’un honneur perdu, d’un éclat ou d’une force.
- issue: Sens de la conduite finale du bélier
  choice: sans dignité
  alternative: sans retenue ; sans que personne le retienne ; sans entrave
  rationale: Le rapport lexical de ተደላ avec la convenance et la dignité favorise une appréciation de la conduite du bélier, plutôt que l’idée d’une absence d’opposition extérieure.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions animales sont conservées pour respecter l’allégorie. La dernière expression suit le sens lexical de convenance ou de dignité, malgré la tradition de traduction « sans retenue ».
