base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: fr
  text: 'Puis, je vis de nouveau ces brebis : elles s’égaraient, suivaient de nombreux chemins et abandonnaient cette maison qui était la leur. Le Seigneur[a] des brebis appela certaines d’entre elles et les envoya auprès des brebis. Mais les brebis commencèrent à les tuer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Maître » ; le terme guèze peut désigner un seigneur ou un maître.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « Mais les brebis les saisirent pour les tuer. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: Puis je vis de nouveau ces brebis
  rationale: Rend naturellement la formule visionnaire et le renvoi démonstratif au troupeau déjà présent. Le second « de nouveau » du guèze n’est pas reproduit, car sa répétition serait pesante en français sans apporter de distinction claire.
- source_word: ከመ ስሕቱ
  choice: elles s’égaraient
  rationale: Conserve à la fois l’image concrète des brebis qui s’écartent et la portée morale du verbe.
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: suivaient de nombreux chemins
  rationale: Maintient l’image des voies multiples dans un français courant et naturel.
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: abandonnaient cette maison qui appartenait à leur Seigneur
  rationale: Le verbe indique plus qu’un simple départ. La relative rattache naturellement la maison au Seigneur en français, conformément à la construction du contexte.
- source_word: ወእግዚኦሙ ለአባግዕ
  choice: leur Seigneur / le Seigneur des brebis
  rationale: « Seigneur » convient au rôle divin de la figure tout en conservant le rapport d’autorité exprimé par le terme guèze.
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: appela certaines d’entre elles
  rationale: Exprime la sélection de quelques brebis au sein du troupeau sans ajouter une identité absente du texte.
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: les envoya vers les brebis
  rationale: Rend directement l’envoi en mission et sa destination.
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: Mais les brebis commencèrent à les tuer
  rationale: La construction comprimée peut marquer le commencement de l’action ou la saisie en vue de tuer. Le texte principal retient la valeur inchoative, tandis que la note préserve l’autre lecture.
theological_decisions:
- issue: Traduction de እግዚእ dans l’allégorie des brebis
  choice: Seigneur
  alternative: maître
  rationale: Dans cette vision, la figure qui possède et dirige les brebis représente Dieu. « Seigneur » garde ce poids théologique sans effacer le rapport concret de maître à troupeau.
- issue: Identité des brebis appelées et envoyées
  choice: certaines d’entre elles
  alternative: des brebis prises parmi elles
  rationale: La traduction conserve leur appartenance au troupeau et le motif de l’envoi sans les désigner explicitement comme prophètes, identification suggérée par l’allégorie mais non formulée dans ce verset.
translation_notes:
  register: Français international moderne, narratif et digne. Les images de la maison, des chemins et du troupeau sont conservées. La répétition guèze de « de nouveau » est allégée pour éviter une maladresse française, sans modifier la progression de la vision.
