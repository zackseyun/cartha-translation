revisions:
- from: 'Puis je vis de nouveau ces brebis : elles s’égaraient, suivaient de nombreux chemins et abandonnaient cette maison qui appartenait à leur Seigneur[a]. Le Seigneur des brebis appela certaines d’entre elles et les envoya vers les brebis. Mais les brebis commencèrent à les tuer[b].'
  to: 'Puis, je vis de nouveau ces brebis : elles s’égaraient, suivaient de nombreux chemins et abandonnaient cette maison qui était la leur. Le Seigneur[a] des brebis appela certaines d’entre elles et les envoya auprès des brebis. Mais les brebis commencèrent à les tuer[b].'
  rationale: La révision corrige l’attribution de la maison conformément au possessif guèze, sans modifier le sens de l’allégorie ni identifier les brebis envoyées. Elle conserve l’alternative syntaxique de la dernière proposition en note et replace l’ancre lexicale sur « Seigneur ».
