base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: fr
  text: L’une d’elles échappa et ne fut pas tuée. Elle bondit et poussa un cri au-dessus des brebis[a]. Elles voulurent la tuer, mais le Seigneur des brebis la sauva du milieu des brebis[b], la fit monter jusqu’à moi et la plaça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « vers les brebis » ou « au sujet des brebis » ; la préposition guèze admet ici plusieurs rapports possibles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la construction peut se rendre : « il la sauva d’entre elles, à savoir les brebis ».'
    reason: grammar_clarification
lexical_decisions:
- source_word: ድኅነ
  choice: échappa
  rationale: Dans l’enchaînement avec « ne fut pas tuée », le verbe décrit naturellement le fait d’échapper à la mort; le salut explicitement attribué ensuite au Seigneur est rendu par « sauva ».
- source_word: ኢተቀትለ
  choice: ne fut pas tuée
  rationale: Rend directement la forme passive négative dans un français moderne.
- source_word: ቀነጸ
  choice: bondit
  rationale: Conserve le mouvement soudain et ascendant exprimé par le verbe, sans l’omettre.
- source_word: ጸርኀ
  choice: poussa un cri
  rationale: Exprime un cri pressant sans préciser indûment s’il s’agit d’un appel, d’une alarme ou d’une lamentation.
- source_word: ዲበ አባግዕ
  choice: au-dessus des brebis
  rationale: Préserve le sens spatial ou directionnel premier de la préposition; les autres rapports possibles sont signalés en note.
- source_word: ፈቀዱ ይቅትልዎ
  choice: Elles voulurent la tuer
  rationale: Rend simplement et naturellement l’intention hostile.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Maintient le titre divin récurrent et l’imagerie de la vision animale.
- source_word: አድኃኖ
  choice: la sauva
  rationale: Le sujet étant explicitement le Seigneur des brebis, « sauva » convient à la délivrance divine tout en restant courant.
- source_word: እምኔሆሙ ለአባግዕት
  choice: du milieu des brebis
  rationale: Traite le suffixe pronominal anticipé comme repris et explicité par « les brebis »; « du milieu de » exprime clairement l’extraction hors du groupe.
- source_word: አዕረጎ ኀቤየ
  choice: la fit monter jusqu’à moi
  rationale: Conserve le mouvement vers le haut ainsi que la destination auprès du voyant.
- source_word: አንበሮ
  choice: la plaça là
  rationale: Dans la suite immédiate du déplacement, le verbe indique que le Seigneur établit ou dépose la brebis auprès du voyant; « plaça là » reste concret sans imposer l’idée d’une demeure permanente.
theological_decisions:
- issue: Titre divin dans l’Apocalypse des animaux
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: Le syntagme désigne Dieu dans le symbolisme de la vision. « Seigneur » préserve sa portée révérencielle et théologique sans sortir de l’image pastorale.
- issue: Identification grammaticale de l’être sauvé dans l’allégorie
  choice: Pronoms féminins renvoyant à une brebis
  alternative: Pronoms masculins ou tournure neutralisée
  rationale: Le contexte immédiat et le groupe explicatif des brebis permettent en français l’accord avec « brebis ». Ce choix respecte l’allégorie sans expliciter l’identité historique du personnage représenté.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont resserrées pour garder le rythme de la vision. « Brebis » est conservé comme terme symbolique récurrent; le titre « Seigneur des brebis » reste élevé. L’ambiguïté de la préposition après le cri est maintenue par une traduction spatiale accompagnée d’une note.
