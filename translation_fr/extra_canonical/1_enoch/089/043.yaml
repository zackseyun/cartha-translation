base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: fr
  text: Et ce bélier se mit à frapper de ses cornes, de ce côté-ci et de ce côté-là[b], ces chiens, ces renards[a] et ces sangliers, jusqu’à les avoir tous détruits.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « renards » peut aussi désigner plus largement des canidés sauvages, par exemple des chacals.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ce côté-ci et de ce côté-là »; l’expression évoque des attaques de part et d’autre.'
    reason: lexical_alternative
  - marker: c
    text: 'Une traduction antérieure comprenait le début ainsi : « Et je vis cette corne faire la guerre de ce côté-ci et de ce côté-là contre les chiens, les renards et les sangliers. » Le texte guèze appuie plutôt « ce bélier se mit à frapper de ses cornes ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝኩ
  choice: Et ce
  rationale: Le syntagme poursuit le récit avec une conjonction et un démonstratif; il ne contient pas de verbe signifiant « je vis ».
- source_word: ሐርጌ
  choice: bélier
  rationale: Dans le contexte animalier immédiat, le terme désigne le bélier, et non sa corne; cela maintient la cohérence de l’allégorie.
- source_word: አኃዘ ይወግእ
  choice: se mit à frapper de ses cornes
  rationale: La séquence exprime le commencement d’une attaque propre au bélier. Cette formulation conserve l’image zoomorphique sans employer le peu courant « encorner ».
- source_word: እምዝየ ወእምዝየ
  choice: de ce côté-ci et de ce côté-là
  rationale: La répétition directionnelle du guèze est conservée et suggère des attaques de part et d’autre.
- source_word: ዝኩ አክላብ
  choice: ces chiens
  rationale: Le démonstratif est rendu explicitement, conformément au texte source.
- source_word: ቈናጽል
  choice: ces renards
  rationale: « Renards » constitue une identification plausible, mais le terme peut désigner plus largement des canidés sauvages; l’incertitude est signalée en note.
- source_word: ሐራዊያ ገዳም
  choice: ces sangliers
  rationale: L’expression désigne des porcs sauvages; « sangliers » est naturel en français et préserve l’image animale concrète.
- source_word: እስከ ለኵሎሙ አኅጐሎሙ
  choice: jusqu’à les avoir tous détruits
  rationale: La proposition marque l’achèvement total de la victoire du bélier sur les animaux ennemis.
theological_decisions:
- issue: Identification historique des animaux symboliques
  choice: Conserver les animaux dans le corps du texte sans identifier les peuples ou groupes qu’ils représentent
  alternative: Remplacer ou compléter les animaux par leurs référents historiques supposés
  rationale: Le passage est une vision allégorique; la traduction doit préserver son imagerie et ne pas imposer une interprétation historique discutée.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « frapper de ses cornes » garde l’image précise du bélier tout en restant idiomatique; la répétition directionnelle est volontairement maintenue.
