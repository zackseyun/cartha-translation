base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: fr
  text: Et le premier bélier poursuivit le bélier venu après lui[a]. Celui-ci se leva et s’enfuit de devant lui[b] ; et je vis jusqu’à ce que ces chiens fassent tomber le premier bélier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bélier suivant » ou « le dernier bélier ». Le terme le distingue du « premier » bélier et marque avant tout leur succession.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant sa face », tournure sémitique signifiant qu’il s’enfuit devant lui.
    reason: literal_expression
lexical_decisions:
- source_word: ሐርጌ
  choice: bélier
  rationale: Dans le contexte immédiat de l’Apocalypse des animaux, le mot désigne les béliers qui conduisent les brebis. Bien qu’il puisse avoir un autre sens selon le contexte, « bélier » préserve ici la cohérence de la scène symbolique.
- source_word: ቀዳማዊ
  choice: premier
  rationale: Le terme marque directement l’antériorité de ce bélier par rapport à l’autre.
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: venu après lui
  rationale: Cette formulation française exprime la succession indiquée par le guèze sans imposer le sens plus définitif de « dernier ».
- source_word: ሰደዶ
  choice: poursuivit
  rationale: Le verbe décrit une poursuite active et convient au registre narratif de la vision.
- source_word: ተንሥአ
  choice: se leva
  rationale: Rend simplement le mouvement exprimé par le verbe « se lever, se dresser » avant la fuite.
- source_word: ነፍጸ
  choice: s’enfuit
  rationale: Le contexte décrit une retraite devant un poursuivant, et non simplement un départ.
- source_word: እምቅድመ ገጹ
  choice: de devant lui
  rationale: La tournure conserve l’image sémitique de l’éloignement hors de la face ou de la présence du poursuivant tout en restant intelligible en français.
- source_word: አክላብ
  choice: chiens
  rationale: Le nom pluriel désigne des chiens ; rien n’impose de préciser qu’il s’agit de chiens de chasse.
- source_word: አውደቅዎ
  choice: fassent tomber
  rationale: Le causatif exprime littéralement le fait de faire tomber. Cette traduction préserve l’action sans préciser si elle entraîne la mort.
theological_decisions:
- issue: Maintien du symbolisme animal dans une scène apocalyptique à portée politique
  choice: Conserver « bélier » et « chiens » dans le texte principal.
  alternative: Remplacer les animaux par les personnages ou groupes historiques qu’ils peuvent représenter.
  rationale: La vision s’exprime au moyen d’un système suivi d’images animales. La traduction doit préserver cette rhétorique et ne pas transformer une identification interprétative en texte.
- issue: Sens contextuel de ሐርጌ
  choice: Traduire par « bélier » en accord avec les animaux conducteurs du contexte immédiat.
  alternative: Traduire par « sanglier » en s’appuyant sur une autre valeur lexicale possible du mot.
  rationale: Le référent dans cette séquence est un bélier parmi les brebis, tandis que les sangliers sauvages sont désignés autrement dans la scène environnante. Le contexte narratif tranche ici l’ambiguïté lexicale sans identifier directement les acteurs historiques.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme de la scène et ses images animales sont conservés ; les formulations trop archaïques sont évitées, sauf la légère coloration de « de devant lui », éclairée en note.
