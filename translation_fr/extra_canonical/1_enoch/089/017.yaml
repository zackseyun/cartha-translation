base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: fr
  text: Il appela la brebis qui avait échappé aux loups et lui parla au sujet des loups, afin qu’elle entende à leur sujet[b], pour qu’ils n’oppriment pas les brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement, la proposition est difficile : « afin qu’elle entende sur eux » ou « contre eux ». Elle peut évoquer une information à leur sujet, voire une accusation portée contre eux.'
    reason: textual_and_syntactic_difficulty
lexical_decisions:
- source_word: ጸውዖ
  choice: appela
  rationale: Le verbe signifie appeler ou convoquer; « appela » conserve la simplicité du récit sans préciser indûment le degré d’autorité.
- source_word: በግዕ
  choice: la brebis
  rationale: Le nom désigne ici un ovin au singulier. « Brebis » maintient le vocabulaire symbolique du récit animalier, sans introduire « bélier », qui serait plus spécifique que la forme source.
- source_word: ዘተኃጥአ እምአዝእት
  choice: qui avait échappé aux loups
  rationale: Dans cette lecture, la forme verbale exprime le fait d’échapper, et አዝእት désigne les loups. Cette analyse convient au contexte narratif et évite la lecture fautive « avait péché parmi les brebis ».
- source_word: ተናገሮ በእንተ አዝእት
  choice: lui parla au sujet des loups
  rationale: Rend directement l’acte de parler à la brebis concernant les loups, dans un français naturel et précis.
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: afin qu’elle entende ce qui les concernait
  rationale: La construction est difficile. Cette formulation conserve l’idée d’entendre à leur sujet sans imposer une fonction précise de témoignage, d’accusation ou d’avertissement.
- source_word: ኢይግስስዎሙ
  choice: pour qu’ils n’oppriment pas
  rationale: « Opprimer » garde l’idée d’un traitement hostile et violent tout en évitant de préciser davantage que ne le permet avec assurance la donnée transmise.
- source_word: አባግዕ
  choice: les brebis
  rationale: Le pluriel est rendu par « les brebis » afin de préserver le lexique zoomorphique récurrent plutôt que de le remplacer par « le troupeau ».
theological_decisions:
- issue: Identification morale de la brebis appelée
  choice: qui avait échappé aux loups
  alternative: qui avait péché parmi les brebis
  rationale: La segmentation et le contexte soutiennent ici le sens d’une brebis échappée aux loups. La traduction ne doit donc pas introduire une accusation morale provenant d’une autre analyse lexicale.
- issue: Fonction de l’audition concernant les loups
  choice: afin qu’elle entende ce qui les concernait
  alternative: afin qu’elle témoigne contre eux
  rationale: Le syntagme est syntaxiquement difficile et peut avoir une nuance adversative. Le texte principal demeure volontairement ouvert plutôt que de transformer l’audition en témoignage judiciaire explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le pronom féminin reprend « la brebis », conformément à la grammaire française, sans déterminer le sexe du personnage symbolique. La formulation conserve l’ambiguïté de la proposition relative à ce qui doit être entendu au sujet des loups.
