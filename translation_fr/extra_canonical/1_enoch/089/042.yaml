base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: fr
  text: Alors les chiens, les renards[a] et les sangliers des champs se mirent à dévorer ces brebis, jusqu’à ce que le Seigneur des brebis suscite parmi elles un bélier[b] pour les conduire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « renards » peut aussi désigner plus largement des canidés prédateurs ou charognards, notamment des chacals.
    reason: lexical_alternative
  - marker: b
    text: Le texte transmis présente une lecture difficile ou une variante autour de « un bélier ». Le sens général demeure qu’un seul mâle du troupeau est suscité parmi les brebis pour les conduire.
    reason: textual_variant
lexical_decisions:
- source_word: አኃዙ
  choice: se mirent à
  rationale: Dans cette construction, le verbe marque le début de l’action. « Se mirent à » rend naturellement cette valeur ingressive en français.
- source_word: አክላብ
  choice: chiens
  rationale: Terme français courant, sans la précision supplémentaire qu’introduirait « chiens de chasse ».
- source_word: ቈናጽል
  choice: renards
  rationale: Équivalent traditionnel et naturel pour ce canidé prédateur, tout en signalant en note la possibilité de « chacals ».
- source_word: ሐራዊያ ሐቅል
  choice: sangliers des champs
  rationale: Conserve à la fois l’idée de porc sauvage et la mention explicite des champs ou de la campagne.
- source_word: ይብልዕዎሙ
  choice: dévorer
  rationale: Le contexte de prédation violente appelle un terme plus fort que « manger ».
- source_word: ዝኩ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif renvoie au troupeau déjà présent dans la vision. « Brebis » est ici le terme collectif naturel dans l’imagerie du troupeau.
- source_word: እስከ አንሥአ
  choice: jusqu’à ce que … suscite
  rationale: « Susciter » exprime une intervention faisant surgir un dirigeant, sans réduire le sens à une nomination officielle.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Préserve le titre récurrent et sa portée divine dans l’allégorie animale.
- source_word: ፩እምኔሆሙ
  choice: parmi elles un
  rationale: Rend explicitement l’origine du bélier au sein même du troupeau.
- source_word: ሐርጌ
  choice: bélier
  rationale: Équivalent français précis pour une brebis mâle adulte et distinction nécessaire au sein du troupeau.
- source_word: ዘይመርሖሙ
  choice: pour les conduire
  rationale: Rend sobrement l’idée de guider ou diriger, sans ajouter une métaphore pastorale absente du verbe.
theological_decisions:
- issue: Titre divin dans l’allégorie
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: « Seigneur » conserve le registre élevé, l’autorité divine et la cohérence du titre récurrent, tandis que « maître » pourrait réduire l’expression à la seule possession.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste narrative et accessible; les images animales ainsi que le titre théologique récurrent sont conservés.
