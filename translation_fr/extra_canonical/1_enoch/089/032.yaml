base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: fr
  text: Et cette brebis qui les conduisait revint et monta sur ce rocher[a]. Les brebis, les yeux aveuglés[b], s’écartèrent du chemin qu’elle leur avait montré, mais cette brebis ne le savait pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur cette hauteur rocheuse » ; le terme guèze peut désigner une élévation ou un escarpement rocheux plutôt qu’un rocher isolé.
    reason: lexical_alternative
  - marker: b
    text: Ou « tandis que leurs yeux étaient aveuglés » ; la forme peut décrire un état en cours, sans nommer ce qui en est la cause.
    reason: aspectual_alternative
lexical_decisions:
- source_word: ገብአ
  choice: revint
  rationale: Dans cette séquence narrative, le mouvement est un retour de la brebis conductrice; « revint » rend naturellement le contexte sans exclure le sens de venir ou d’entrer.
- source_word: በግዕ / አባግዕ
  choice: brebis / les brebis
  rationale: Le terme ovin est rendu de façon générique et cohérente avec l’imagerie animale du passage, sans préciser indûment l’âge ou le sexe.
- source_word: ዘይመርሖሙ
  choice: qui les avait conduites
  rationale: Le plus-que-parfait situe la conduite avant le retour et conserve l’image concrète du déplacement guidé.
- source_word: ዐርገ
  choice: monta
  rationale: Rend directement le mouvement ascendant et convient à une élévation rocheuse.
- source_word: ድማኅ
  choice: rocher
  rationale: Choix concret pour une masse ou élévation rocheuse; l’étendue sémantique plus large est signalée en note.
- source_word: እንዘ ይጸልሉ አዕይንቲሆሙ
  choice: les yeux aveuglés
  rationale: La tournure circonstancielle décrit l’état de leur vue sans introduire explicitement un agent qui les aveuglerait à cet instant.
- source_word: ይስሕቱ እምፍኖት
  choice: s’écartèrent du chemin
  rationale: Préserve à la fois l’image spatiale et sa portée morale ou visionnaire.
- source_word: እንተ አርአዮሙ
  choice: qu’elle leur avait montré
  rationale: Le sujet singulier renvoie naturellement à la brebis conductrice; « montré » conserve la valeur causative du verbe.
- source_word: ኢያእመረ
  choice: ne le savait pas
  rationale: Rend simplement l’absence de connaissance ou de conscience, sans la transformer en négligence coupable.
theological_decisions:
- issue: Nature de l’ignorance de la brebis conductrice
  choice: « cette brebis ne le savait pas »
  alternative: « cette brebis ne s’en aperçut pas » ou « n’y prêta pas attention »
  rationale: Le guèze exprime un défaut de connaissance, non nécessairement une inattention coupable. La traduction conserve cette tension sans ajouter de jugement moral.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « brebis » est conservée pour respecter l’imagerie et la cohésion du texte. Le pronom féminin « elle » suit le genre grammatical français sans déterminer davantage l’identité symbolique de la figure.
