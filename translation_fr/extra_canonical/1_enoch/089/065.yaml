base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: fr
  text: Je regardai jusqu’au moment où ces bergers firent paître le troupeau en leur temps[a]. Ils se mirent alors à tuer et à détruire bien au-delà de ce qui leur avait été ordonné[b], et ils abandonnèrent ces brebis entre les mains des lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps qui leur était fixé ». L’expression peut désigner la période assignée à l’activité des bergers.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression évoque un dépassement considérable de « leur ordre », c’est-à-dire de ce qui leur avait été commandé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: bergers
  rationale: Ce terme désigne les gardiens représentés comme des bergers dans l’Apocalypse des animaux. « Bergers » conserve cette image directrice.
- source_word: ይርዐዩ
  choice: firent paître le troupeau
  rationale: Le verbe appartient au champ lexical du pâturage. L’ajout explicite de « le troupeau », sous-entendu par l’image et repris ensuite par « ces brebis », donne une phrase française naturelle.
- source_word: በጊዜሁ
  choice: en leur temps
  rationale: Cette expression désigne la période assignée à l’activité des bergers, tout en conservant la concision et une certaine ambiguïté du texte.
- source_word: ወአኃዙ
  choice: ils se mirent alors à
  rationale: 'Le verbe a ici une valeur inchoative : il marque le commencement de l’action exprimée par les verbes suivants.'
- source_word: ይቅትሉ
  choice: tuer
  rationale: Traduction directe et courante, suffisamment forte sans ajouter de nuance étrangère au texte.
- source_word: ያሕጕሉ
  choice: détruire
  rationale: Dans le couple verbal, ce choix accentue l’ampleur de la violence sans imposer l’idée plus absolue d’une extermination totale.
- source_word: ብዙኃ እምትእዛዞሙ
  choice: bien au-delà de ce qui leur avait été ordonné
  rationale: 'La construction comparative a une valeur adverbiale : elle indique que les bergers dépassent largement la limite de l’ordre reçu, plutôt qu’un grand nombre de victimes servant d’objet direct.'
- source_word: ኃደጉ
  choice: abandonnèrent
  rationale: Le verbe exprime ici un délaissement coupable, plus fort qu’un simple fait de laisser sur place.
- source_word: ዝኩ አባግዐ
  choice: ces brebis
  rationale: Le démonstratif renvoie au troupeau précis confié aux bergers et mérite d’être conservé.
- source_word: ውስተ እደ
  choice: entre les mains de
  rationale: Cette expression garde l’idiome biblique de la remise au pouvoir d’un autre, malgré la personnification produite par l’image animale.
- source_word: አናብስት
  choice: les lions
  rationale: Le nom désigne les lions; cette précision animale doit être maintenue dans le symbolisme de la vision.
theological_decisions:
- issue: La violence des bergers reste-t-elle dans les limites de l’autorisation reçue ?
  choice: Les bergers tuent et détruisent « bien au-delà de ce qui leur avait été ordonné ».
  alternative: Ils agissent conformément à l’ordre reçu, ou ne le dépassent que par le nombre de victimes.
  rationale: La construction guèze indique le dépassement d’une limite assignée. Cette traduction maintient la tension entre autorité déléguée et abus coupable de cette autorité, sans préciser davantage l’origine de l’ordre.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’imagerie pastorale et l’idiome biblique « entre les mains », ainsi que l’ambiguïté relative de « en leur temps ». Les deux marqueurs de note figurent dans le texte principal.
