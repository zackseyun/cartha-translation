  rationale: 'La révision supprime la nuance non attestée introduite par « en appela », clarifie la syntaxe française et préserve la force partitive du guèze. Elle maintient la tension du texte : les bergers ont reçu un ordre limité, mais détruisent au-delà de ce qui leur avait été ordonné, sans préciser l''identité des personnages ni résoudre cette tension sur un plan doctrinal.'
