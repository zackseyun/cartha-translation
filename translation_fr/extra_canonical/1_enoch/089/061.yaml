base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: fr
  text: 'Puis il appela un autre et lui dit : « Prête attention[a] et regarde tout ce que les bergers font à ces brebis, car ils en détruisent plus, d''entre elles[b], que je ne leur avais ordonné d''en détruire[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l''expression évoque le fait d''appliquer son cœur ou son esprit : « sois attentif » ou « prends garde ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de leur milieu » ou « d''entre elles ». La formule a une valeur partitive : des brebis sont retranchées du troupeau.'
    reason: source_clarity
  - marker: c
    text: La formulation suppose que les bergers avaient reçu une mission limitée, mais qu'ils en ont dépassé les limites.
    reason: theological_tension
lexical_decisions:
- source_word: ለካልእ
  choice: un autre
  rationale: Le terme désigne un autre personnage sans préciser davantage son identité.
- source_word: ለቡ ወርኢ
  choice: Prête attention et regarde
  rationale: Cette formulation rend à la fois l'appel à une attention réfléchie et l'ordre concret de voir ou d'observer.
- source_word: ኖሎት
  choice: les bergers
  rationale: « Bergers » maintient l'imagerie animale suivie dans cette vision et évite les connotations ecclésiastiques de « pasteurs ».
- source_word: ዲበ እሉ አባግዕ
  choice: à ces brebis
  rationale: La préposition est rendue sans expliciter abusivement l'hostilité, déjà manifeste dans la proposition suivante.
- source_word: ያሐጕሉ
  choice: ils en détruisent
  rationale: Le verbe exprime une action destructrice sans la réduire nécessairement au seul fait de tuer.
- source_word: እምውስተቶሙ
  choice: du milieu du troupeau
  rationale: 'La combinaison de « depuis » et « au milieu de » possède une valeur partitive : les victimes sont retranchées du milieu des brebis. Le nom « troupeau » explicite naturellement en français l''antécédent collectif sans changer l''image.'
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: plus que je ne le leur avais ordonné
  rationale: La comparaison indique clairement que les bergers dépassent la limite de la mission qui leur avait été confiée.
theological_decisions:
- issue: Nature de la faute des bergers
  choice: Ils exercent une action destructrice au-delà de ce qui leur avait été ordonné.
  alternative: Ils n'auraient reçu aucune autorisation de détruire, ou seraient seulement coupables de négligence.
  rationale: Le texte associe un verbe de destruction à la formule comparative « plus que je ne le leur avais ordonné ». Il faut donc préserver la tension selon laquelle une mission limitée leur avait été confiée, mais qu'ils l'ont dépassée de manière coupable.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l'imagerie des bergers et des brebis ainsi que l'ambiguïté troublante d'une destruction en partie autorisée, sans identifier les personnages ni résoudre la tension théologique.
