base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: fr
  text: Et ce bélier prit avec lui d’autres brebis et s’avança vers les brebis qui s’étaient égarées ; il se mit à les tuer.[a] Les brebis eurent peur devant lui. Alors ce bélier fit revenir les brebis qui s’étaient égarées, et elles retournèrent dans leurs bergeries.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les saisit pour les tuer ». La construction guèze peut souligner soit le commencement de l’action, soit le fait de saisir en vue de tuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: bélier
  rationale: Dans l’Apocalypse des animaux, le chef du troupeau est distingué des autres brebis ; « bélier » maintient cette distinction narrative.
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: prit avec lui d’autres brebis
  rationale: አባግዐ est ici pluriel. Cette traduction rend l’accompagnement sans reprendre l’ancienne lecture fautive au singulier.
- source_word: ቦአ ዲበ
  choice: marcha contre
  rationale: La combinaison exprime un mouvement vers le groupe avec une nuance de confrontation ; « marcha contre » convient au contexte violent sans préciser indûment une attaque militaire.
- source_word: እለ ስሕቱ
  choice: qui s’étaient égarées
  rationale: Le verbe évoque à la fois l’égarement concret des brebis et, dans l’allégorie, une faute ; le français conserve ce double sens.
- source_word: አኀዘ ይቅትሎሙ
  choice: il se mit à les tuer
  rationale: La construction marque le commencement de l’action meurtrière. Cette formulation française est naturelle tout en conservant explicitement la violence du texte.
- source_word: ፈርሁ እምገጹ
  choice: eurent peur devant lui
  rationale: « Devant lui » garde la référence à sa face ou à sa présence et le registre élevé de l’expression guèze.
- source_word: አግብኦሙ
  choice: fit revenir
  rationale: Le causatif indique que le bélier provoque leur retour, plutôt qu’il ne se contente de les accompagner.
- source_word: አዕጻዲሆሙ
  choice: leurs bergeries
  rationale: « Bergeries » est un terme pastoral courant qui convient aux enclos où retournent les brebis dans la vision.
theological_decisions:
- issue: Violence du bélier envers les brebis égarées
  choice: Conserver dans le texte principal l’action explicite de tuer.
  alternative: Atténuer en « les punir » ou « les frapper ».
  rationale: Le guèze emploie explicitement le verbe « tuer ». L’atténuer affaiblirait la sévérité de l’imagerie judiciaire de la vision apocalyptique.
translation_notes:
  register: Français international moderne, digne et narratif. Les termes pastoraux restent accessibles. L’ambiguïté de la construction décrivant le commencement ou la prise en vue de tuer est signalée en note, tandis que le pluriel « d’autres brebis » suit la morphologie du guèze.
