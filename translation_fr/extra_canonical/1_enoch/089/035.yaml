  to: Et ce bélier prit avec lui d’autres brebis et s’avança vers les brebis qui s’étaient égarées ; il se mit à les tuer.[a] Les brebis eurent peur devant lui. Alors ce bélier fit revenir les brebis qui s’étaient égarées, et elles retournèrent dans leurs bergeries.
