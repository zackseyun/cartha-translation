base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: fr
  text: Tantôt leurs yeux s’ouvraient[a], tantôt ils étaient aveuglés, jusqu’à ce qu’un autre mouton se lève, les conduise et les fasse tous rentrer[b] ; leurs yeux s’ouvrirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cette vision, l’ouverture des yeux a vraisemblablement une portée symbolique — éveil, reconnaissance ou discernement retrouvé — que le texte ne précise pas.
    reason: cultural_note
  - marker: b
    text: 'Ou : « les rassemble tous ». Le verbe peut évoquer le fait de les faire entrer ou de les réunir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ ሰበ ... ወቦ ሶበ
  choice: tantôt… tantôt
  rationale: Cette construction idiomatique exprime l’alternance temporelle (« parfois… parfois »), et non deux groupes distincts.
- source_word: ይትከሠታ አዕይንቲሆሙ
  choice: leurs yeux s’ouvraient
  rationale: L’imparfait rend le caractère répété ou intermittent de l’ouverture des yeux tout en conservant l’image littérale.
- source_word: ይጼልሙ
  choice: ils étaient aveuglés
  rationale: Le passif français exprime l’obscurcissement ou la perte de la vue sans réduire nécessairement l’image à une cécité physique permanente.
- source_word: ተንሥአ ካልእ በግዕ
  choice: un autre mouton se lève
  rationale: La désignation animale et la formule de succession de la vision sont conservées littéralement ; le texte ne contraint pas à préciser « bélier ».
- source_word: መርሖሙ
  choice: les conduise
  rationale: Ce verbe de direction est rendu simplement, sans ajouter l’idée plus interprétative de les paître.
- source_word: አግብኦሙ ለኵሎሙ
  choice: les fasse tous rentrer
  rationale: Le causatif indique qu’il les fait entrer ou revenir. « Rentrer » préserve en français cette nuance directionnelle sans préciser un lieu absent du texte.
- source_word: ተከሥታ አዕይንቲሆሙ
  choice: leurs yeux s’ouvrirent
  rationale: Le passé simple marque ici l’aboutissement qui suit l’intervention de l’autre mouton, tout en reprenant exactement le motif des yeux ouverts.
theological_decisions:
- issue: Portée symbolique de l’ouverture des yeux dans l’Apocalypse des animaux
  choice: Conserver l’image concrète des yeux qui s’ouvrent sans en expliciter le sens symbolique.
  alternative: Traduire par « ils retrouvèrent le discernement » ou « leur intelligence fut éclairée ».
  rationale: La vision peut évoquer l’éveil, la reconnaissance, la repentance ou le discernement restauré, mais elle ne précise pas elle-même lequel de ces sens doit dominer.
translation_notes:
  register: Français international moderne, naturel et digne. L’alternance « tantôt… tantôt » rend l’idiome guèze avec concision. « Mouton » maintient l’imagerie animale sans ajouter une détermination sexuelle incertaine.
