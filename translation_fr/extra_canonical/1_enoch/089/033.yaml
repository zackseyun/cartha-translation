base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: fr
  text: Le Seigneur des brebis entra dans une très grande colère contre eux. Cette brebis le comprit, descendit du sommet du rocher et vint auprès des brebis. Elle trouva que la plupart d’entre elles avaient les yeux obscurcis[a] et s’étaient égarées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre la fin ainsi : « Elle trouva que la plupart d’entre elles avaient les yeux obscurcis, ainsi que celles qui s’étaient égarées. » Le terme rendu par « obscurcis » peut également signifier « assombris » ou « aveuglés ».'
    reason: La construction de la proposition finale et le degré d’altération de la vue gardent une certaine ambiguïté en geʿez.
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: le Seigneur des brebis
  rationale: Le syntagme désigne le seigneur ou maître des brebis. « Seigneur » conserve le registre élevé et l’identité divine du personnage dans l’Apocalypse des animaux sans ajouter de précision confessionnelle.
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  choice: entra dans une très grande colère contre eux
  rationale: La construction redoublée intensifie la colère. Cette formulation française en garde la force sans reproduire maladroitement la répétition étymologique.
- source_word: ወአእመረ ዝኩ በግዕ
  choice: Cette brebis le comprit
  rationale: ዝኩ በግዕ, « cette brebis », est compris comme le sujet de አእመረ, en contraste avec le verset précédent où la brebis ne savait pas. Le pronom « le » renvoie naturellement à la colère ou à ce qui venait de se produire.
- source_word: ወወረደ እምነ ድማኅ ለኵኵሕ
  choice: descendit du sommet du rocher
  rationale: ድማኅ désigne le sommet; la phrase décrit une descente depuis le sommet du rocher. Le sujet demeure la brebis mentionnée juste avant.
- source_word: ወመጽአ ኀበ አባግዕት
  choice: et vint auprès des brebis
  rationale: La préposition directionnelle est rendue naturellement par « auprès de », tout en maintenant l’image animale explicite.
- source_word: ዘመብዝኅቶሙ
  choice: la plupart d’entre elles
  rationale: Expression française courante et précise pour la plus grande partie du groupe.
- source_word: ዘጽሉለ አዕይንቲሆሙ
  choice: avaient les yeux obscurcis
  rationale: « Obscurcis » conserve l’image d’une vue rendue sombre ou diminuée et la valeur résultative du terme, sans imposer la cécité totale suggérée par « aveuglés ».
- source_word: እለ ስሕቱ
  choice: s’étaient égarées
  rationale: Cette expression garde à la fois l’image concrète de brebis qui se sont écartées et sa portée morale dans la vision.
theological_decisions:
- issue: Rendre እግዚኦሙ par « Seigneur » ou par « maître »
  choice: Seigneur
  alternative: maître
  rationale: Dans l’Apocalypse des animaux, le propriétaire des brebis représente le souverain et juge divin. « Seigneur » préserve cette fonction théologique sans introduire d’identification christologique ultérieure.
- issue: Identifier le sujet de አእመረ et des verbes de descente et de venue
  choice: 'la brebis désignée est le sujet : elle comprend, descend et vient'
  alternative: le Seigneur reconnaît la brebis puis descend
  rationale: La construction la plus probable fait de ዝኩ በግዕ (« cette brebis ») le sujet de « comprit », en contraste direct avec le verset 32; elle demeure ensuite le sujet naturel des verbes coordonnés.
- issue: Rapport entre les yeux obscurcis et l’égarement
  choice: les deux descriptions se rapportent à la plupart des brebis
  alternative: 'deux groupes distincts : la plupart avaient les yeux obscurcis, tandis que d’autres s’étaient égarées'
  rationale: L’enchaînement permet de comprendre les deux traits comme décrivant le même ensemble et produit une syntaxe française cohérente. La structure geʿez reste toutefois susceptible d’être segmentée autrement, d’où la note.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases coordonnées de la vision sont légèrement structurées pour la lisibilité, sans effacer la répétition narrative. Le féminin est employé pour « brebis » et ses reprises pronominales.
