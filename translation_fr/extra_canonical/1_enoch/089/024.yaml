base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: fr
  text: Et ce bassin d’eau[a] se fendit, et l’eau se tint de part et d’autre devant eux. Leur seigneur[b], tout en les conduisant, se tint entre eux et les loups.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étendue d’eau ». Le terme éthiopien paraît désigner une masse d’eau délimitée; sa nuance exacte est incertaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur maître ». Le titre peut désigner le chef du troupeau dans la vision, tout en pouvant évoquer la conduite divine; le texte ne tranche pas explicitement.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ዐይገ ማይ
  choice: bassin d’eau
  rationale: L’expression désigne ici une étendue d’eau délimitée. « Bassin d’eau » conserve l’image concrète et la cohérence avec le contexte, tout en signalant en note l’incertitude lexicale.
- source_word: ተሠጠ
  choice: se fendit
  rationale: Le verbe exprime une division ou une séparation nette. « Se fendit » rend avec force l’image visionnaire sans reprendre mécaniquement une formulation biblique traditionnelle.
- source_word: ቆመ ማይ
  choice: l’eau se tint
  rationale: La traduction conserve le verbe « se tenir », répété ensuite dans la proposition concernant le seigneur, et représente l’eau maintenue en place.
- source_word: እምዝየ ወእምዝየ
  choice: de part et d’autre
  rationale: Cette expression française naturelle rend la répartition spatiale de l’eau des deux côtés.
- source_word: በቅድመ ገጾሙ
  choice: devant eux
  rationale: Le sens littéral est « devant leurs visages ». « Devant eux » est idiomatique en français moderne sans perdre la relation spatiale.
- source_word: እግዚኦሙ
  choice: leur seigneur
  rationale: Le terme exprime une relation d’autorité. La minuscule maintient le niveau narratif de l’allégorie et évite de trancher par la typographie s’il s’agit directement de Dieu, du chef du troupeau ou d’un chevauchement intentionnel des deux niveaux.
- source_word: እንዘ ይመራሖሙ
  choice: tout en les conduisant
  rationale: La construction indique une action concomitante et durative. Cette formulation française relie naturellement la conduite du groupe au fait de se tenir entre lui et les loups.
- source_word: ማእከሎሙ ወማእከለ አዝእት
  choice: entre eux et les loups
  rationale: La tournure française exprime clairement la position intermédiaire du sujet et la séparation entre les deux groupes, sans reproduire lourdement la préposition répétée.
theological_decisions:
- issue: Référent de « leur seigneur » dans l’allégorie
  choice: « leur seigneur » avec une minuscule, sans identification explicite
  alternative: « leur Seigneur » comme titre divin direct, ou « leur maître » comme simple chef du troupeau
  rationale: La syntaxe fait de « leur seigneur » le sujet de « se tint », mais le titre ne suffit pas à fixer sans ambiguïté son identité au niveau allégorique. La minuscule et la note préservent cette tension.
- issue: Sujet du second verbe ቆመ
  choice: « leur seigneur […] se tint »
  alternative: faire de l’eau le sujet du second verbe
  rationale: La syntaxe présente ወእግዚኦሙ comme le sujet de la seconde proposition. Le seigneur se place donc entre le groupe et les loups; ce n’est pas l’eau qui est le sujet de ce second « se tint ».
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation scinde les deux tableaux sans masquer leur parallélisme. La répétition de « se tint » reflète celle du verbe guèze, tandis que « de part et d’autre » et « devant eux » évitent une littéralité peu naturelle.
