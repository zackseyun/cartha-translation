base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: fr
  text: Et je vis les brebis jusqu’à ce qu’elles entrent dans un bon endroit, dans une terre agréable et glorieuse. Et je vis jusqu’à ce que les brebis soient rassasiées, et cette maison[a] se trouvait au milieu d’elles, dans la terre agréable.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’imagerie symbolique de la vision, la « maison » peut désigner le sanctuaire ou le temple.
    reason: lexical_alternative
  - marker: b
    text: L’expression « terre agréable » reprend à la fin du verset la description donnée plus haut.
    reason: cross_reference
lexical_decisions:
- source_word: አባግዕ
  choice: les brebis
  rationale: Conserve littéralement l’imagerie animale soutenue de l’Apocalypse des animaux, sans l’expliciter comme désignant un peuple.
- source_word: መካን ሠናይ
  choice: un bon endroit
  rationale: Rend directement le nom « endroit/lieu » et l’adjectif « bon », sans préciser davantage la nature du lieu.
- source_word: ምድር ኃዋዝ ወስብሕት
  choice: un pays agréable et glorieux
  rationale: Traite ኃዋዝ et ስብሕት comme deux adjectifs qualifiant ምድር, conformément à la syntaxe guèze, tout en gardant le registre visionnaire.
- source_word: ጸግቡ
  choice: soient rassasiées
  rationale: Exprime l’état de plénitude ou de satiété du verbe, avec un terme naturel qui convient à l’image des brebis.
- source_word: ቤት
  choice: maison
  rationale: Préserve le terme concret de la vision au lieu de résoudre son référent symbolique en traduisant directement « temple ».
- source_word: ማእከሎሙ
  choice: au milieu d’elles
  rationale: Conserve la valeur spatiale et communautaire de la présence centrale de la maison parmi les brebis.
theological_decisions:
- issue: Faut-il identifier explicitement la « maison » au temple dans le texte principal ?
  choice: Conserver « maison » dans le texte principal.
  alternative: Traduire directement par « temple » ou « sanctuaire ».
  rationale: Même si la maison peut évoquer le sanctuaire ou le temple dans le symbolisme de la vision, le texte guèze emploie le mot général « maison ». Le conserver évite de transformer une interprétation probable en traduction explicite.
translation_notes:
  register: Français international actuel, digne et accessible. La construction guèze « je vis les brebis jusqu’à ce qu’elles entrent » est conservée. « Je regardai » dans la seconde proposition évite une répétition lourde en français sans modifier le sens du même verbe de vision. Les adjectifs « agréable et glorieux » qualifient directement « pays », conformément à la grammaire de la source.
