base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: fr
  text: Il alla vers lui et lui parla à part[a]. Puis il éleva ce bélier[b] et fit de lui le chef et le guide des brebis. Pendant tout cela, les chiens accablaient les brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lui parla, à lui seul »; le sens peut aussi être rendu par « lui parla en privé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « fit se lever ce bélier ». Le verbe peut évoquer à la fois le relèvement et l’établissement dans une fonction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: Il alla vers lui
  rationale: Le verbe exprime un déplacement vers le personnage animal déjà mentionné. Le pronom masculin convient naturellement à « bélier » en français sans sortir du cadre symbolique de la vision.
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: et lui parla en privé
  rationale: ለባሕቲቱ signifie qu’il lui parla à lui seul, donc à l’écart des autres. « En privé » restitue ce sens avec naturel, sans faire de l’expression une désignation du bélier.
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: Puis il éleva ce bélier
  rationale: ሐርጌ désigne ici le bélier, et ለ marque l’objet défini. « Éleva » conserve l’idée de faire monter ou d’établir dans une position supérieure, que la proposition suivante précise.
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: et fit de lui le chef et le guide des brebis
  rationale: Les deux titres expriment respectivement l’autorité et la conduite. « Chef et guide » garde leur parallélisme et reste clair en français moderne.
- source_word: ወበኵሉዝ
  choice: Pendant tout cela
  rationale: La locution porte sur l’ensemble des événements précédents et situe simultanément l’action des chiens; elle ne qualifie pas les chiens.
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: les chiens accablaient les brebis
  rationale: Le verbe évoque une pression hostile, une oppression ou une affliction continue. L’imparfait rend cette action en cours, tandis qu’« accablaient » en conserve la force.
theological_decisions:
- issue: L’expression ሐርጌ désigne-t-elle un « bélier » ou une « corne » symbolisant la puissance?
  choice: Lire « ce bélier » comme l’objet du verbe « éleva »
  alternative: « lui suscita une corne »
  rationale: Dans cette forme et cette construction, ሐርጌ renvoie au bélier de la vision, tandis que ለ introduit l’objet défini. La traduction ne doit donc pas importer ici une interprétation politique fondée sur l’image biblique de la corne.
- issue: Faut-il expliciter l’identité historique du bélier et celle des chiens?
  choice: Conserver uniquement les figures animales de la vision
  alternative: Remplacer les animaux par les personnages ou groupes qu’ils pourraient symboliser
  rationale: Le texte communique au moyen d’une allégorie animale soutenue. Identifier directement les figures dans le corps du texte résoudrait une question interprétative que le verset laisse implicite.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste narrative et accessible; les images animales et le double titre d’autorité sont conservés sans paraphrase doctrinale.
