base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: fr
  text: Le Seigneur amena les douze brebis pour qu’elles demeurent auprès de ce mouton et paissent avec lui au milieu des loups[a]. Elles se multiplièrent et devinrent de nombreux troupeaux de brebis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze porte deux fois « avec lui ». Le contexte semble renvoyer au mouton singulier mentionné auparavant, mais, grammaticalement, le pronom pourrait aussi être rattaché au Seigneur.
    reason: ambiguity
  - marker: b
    text: La fin du verset est difficile dans le témoin disponible. Elle semble indiquer que les douze brebis se sont accrues jusqu’à devenir de nombreux troupeaux; on pourrait aussi comprendre « une grande multitude de brebis ».
    reason: textual_variant
lexical_decisions:
- source_word: እግዚአ
  choice: le Seigneur
  rationale: Cette désignation conserve à la fois l’autorité du personnage divin et le registre élevé de la vision, sans réduire l’image à « propriétaire » ni expliciter par « Dieu ».
- source_word: አምጽኦሙ
  choice: amena
  rationale: Le verbe exprime le fait de faire venir les douze brebis; « amena » rend naturellement l’action et l’initiative du Seigneur.
- source_word: ፲ወ፪ አባግዕ
  choice: les douze brebis
  rationale: Le nombre est explicite. « Brebis » maintient le vocabulaire animal et pastoral suivi dans cette vision, sans remplacer le symbole par son interprétation historique.
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: pour qu’elles demeurent auprès de ce mouton
  rationale: ከመ introduit ici le but. Le masculin singulier de ምስሌሁ renvoie, d’après le contexte narratif, au mouton singulier mentionné auparavant; la reprise nominale évite qu’en français « lui » soit spontanément rattaché au Seigneur.
- source_word: ይትረዐዩ ምስሌሁ
  choice: paissent avec lui
  rationale: Le verbe appartient à l’image de l’alimentation du troupeau. « Paître » est précis, courant dans ce contexte et plus directement animal que « prendre leur pâture ».
- source_word: ማእከለ አዝእት
  choice: au milieu des loups
  rationale: La formule spatiale souligne la présence menaçante des loups et suit de près l’expression guèze.
- source_word: በዝኁ
  choice: elles se multiplièrent
  rationale: Ce verbe de croissance est rendu par une tournure biblique naturelle qui conserve l’idée d’accroissement numérique.
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: formèrent de nombreux troupeaux de brebis
  rationale: Malgré la difficulté de la transmission dans cette fin de verset, la formulation paraît décrire les brebis devenant de nombreux groupements pastoraux; « troupeaux » préserve cette valeur collective.
theological_decisions:
- issue: Identité du « Seigneur » dans la vision animale
  choice: Conserver « le Seigneur » sans l’identifier plus explicitement dans le corps du verset.
  alternative: « Dieu » ou « le maître des brebis »
  rationale: La traduction maintient le poids théologique du titre tout en respectant l’expression indirecte et le symbolisme pastoral de l’apocalypse.
- issue: Référent du suffixe masculin singulier dans ምስሌሁ
  choice: Le rattacher au mouton singulier du contexte précédent et l’expliciter sobrement à la première occurrence.
  alternative: Le rattacher au Seigneur, ou conserver partout l’ambigu « avec lui ».
  rationale: La morphologie seule permet un référent masculin singulier, mais le déroulement de la vision et l’action de paître parmi les loups favorisent le mouton mentionné auparavant. L’explicitation empêche une fausse lecture syntaxique française, tandis que la note signale l’ambiguïté formelle.
translation_notes:
  register: Français international actuel, digne et lisible. Le vocabulaire pastoral est conservé sans transformer les animaux en leurs référents historiques. « Demeurer », « paître » et « au milieu de » gardent une légère élévation biblique sans archaïsme prononcé.
