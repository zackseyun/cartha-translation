base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: fr
  text: 'Et lis devant moi, en les comptant, combien ils en détruisent[a] et combien ils en livrent à la destruction, afin que cela me serve de témoignage contre eux[b], afin que je connaisse toutes les actions des bergers, que je les évalue et que je voie ce qu’ils font : s’ils observent mon commandement, celui que je leur ai donné, ou non.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset éthiopien est difficile. La répétition du vocabulaire du compte paraît désigner un relevé numérique de ceux que les bergers détruisent ou livrent à la destruction.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « un témoignage sur eux ». Dans ce contexte judiciaire, l’expression peut signifier que le témoignage est retenu contre eux.'
    reason: lexical_alternative
  - marker: c
    text: 'Une lecture ancienne de l’ensemble de la phrase comprend plutôt : « Et je lus devant lui le compte de ces bergers, et combien ils avaient détruit pour les bergers… ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወበኍልቈ፡ አንበብ፡ ቅድሜየ
  choice: Et lis devant moi, en les comptant
  rationale: 'Le verbe est compris comme un impératif adressé au scribe, et le suffixe de ቅድሜየ est celui de la première personne : « devant moi ». La mention du compte est conservée explicitement.'
- source_word: ሚመጠነ፡ የኃጕሉ
  choice: le nombre de ceux qu’ils détruisent
  rationale: La tournure française exprime clairement le dénombrement tout en gardant le sens violent mais assez large du verbe de destruction.
- source_word: ሚመጠነ፡ ይሚጥዉ፡ ለኃጕል
  choice: le nombre de ceux qu’ils livrent à la destruction
  rationale: Cette formulation distingue l’acte de livrer de l’acte de détruire et maintient le parallélisme numérique des deux propositions.
- source_word: ስምዐ፡ ዲቤሆሙ
  choice: un témoignage contre eux
  rationale: Le contexte est celui d’un relevé à valeur probante et judiciaire. « Contre eux » rend la portée accusatrice de l’expression littéralement construite avec « sur eux ».
- source_word: ግብሮሙ፡ ለኖላዊያን
  choice: toutes les actions des bergers
  rationale: « Actions » est courant et convient à l’examen moral et judiciaire de la conduite des bergers, groupe symbolique stable de la vision.
- source_word: እመጥኖሙ
  choice: je les évaluerai
  rationale: Le verbe relève du compte et de la mesure. Dans ce contexte d’examen des bergers, « évaluer » conserve l’idée de mesure sans suggérer un simple recensement physique.
- source_word: በትእዛዝየ፡ ዘአዘዝክዎሙ
  choice: s’ils demeurent dans mon commandement, comme je le leur ai commandé
  rationale: Cette formulation garde en français la répétition intentionnelle du nom et du verbe apparentés, tout en restant compréhensible et digne.
- source_word: እመ፡ አልቦ
  choice: ou non
  rationale: Cette conclusion naturelle conserve l’alternative binaire portant sur l’obéissance.
theological_decisions:
- issue: Fonction judiciaire du relevé lu devant le Seigneur
  choice: Le dénombrement constitue un témoignage à charge contre les bergers.
  alternative: Il pourrait s’agir d’un simple compte rendu informatif.
  rationale: Le regroupement des termes relatifs au compte, au témoignage, aux actions et au commandement donne à la scène la forme d’un contrôle suivi d’un jugement.
- issue: Objet de l’évaluation
  choice: Le pronom « les » renvoie aux bergers, dont la conduite est mesurée.
  alternative: Le verbe pourrait être rendu plus littéralement par « les compter » et compris comme portant sur leurs actions ou sur les victimes.
  rationale: La morphologie et l’enchaînement sont difficiles, mais le contexte immédiat porte sur l’examen de tous les actes des bergers. La note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et soutenu. Le rythme du relevé judiciaire est conservé, de même que l’image symbolique des bergers et la répétition volontaire autour du commandement.
