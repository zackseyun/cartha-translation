base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: fr
  text: 'Et le scribe consigna tout l’excès et toute la destruction commis par les bergers[a] : combien ils en avaient détruit sur mon ordre et combien ils en avaient détruit sous leur propre responsabilité[b]. Toute la destruction causée par les soixante-dix bergers fut consignée à leur charge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier terme traduit par « excès » est difficile. Il peut aussi être compris comme « aveuglement » ou « action d’aveugler ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur leurs propres têtes ». L’expression peut indiquer que la responsabilité de ces destructions retombait sur eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ
  choice: excès
  rationale: Dans la coordination avec « destruction » et au vu du contexte de reddition de comptes, le terme désigne vraisemblablement ce qui dépasse la mesure autorisée. La tradition lexicale étant difficile, une note signale l’autre possibilité, « aveuglement ».
- source_word: ሐጕለ / ያሐጕሉ / ያሐጕሎሙ
  choice: destruction / détruire
  rationale: La répétition du même radical est conservée en français afin de maintenir l’unité lexicale et l’idée générale de ruine violente, sans imposer le sens plus précis d’arracher.
- source_word: በኖሎት
  choice: par les bergers
  rationale: ኖሎት est une forme plurielle de « berger » précédée de la préposition በ ; le groupe désigne donc les agents de l’action, non des éléphants.
- source_word: ጻሐፍ
  choice: le scribe consigna / fut consignée
  rationale: Le contexte met en scène un relevé écrit. Une formulation active dans la première proposition et passive dans le résumé final produit un français naturel tout en conservant le motif judiciaire de l’inscription.
- source_word: ሚመጠነ
  choice: combien
  rationale: La forme répétée introduit le décompte précis des destructions attribuées aux bergers.
- source_word: በትእዛዝየ
  choice: sur mon ordre
  rationale: Cette formulation préserve la première personne et l’autorité du locuteur sans ajouter d’identification doctrinale.
- source_word: በርእሶሙ
  choice: sous leur propre responsabilité
  rationale: Littéralement lié à « leurs têtes », l’idiome paraît imputer aux bergers eux-mêmes la responsabilité des actes qui excèdent l’ordre reçu. Cette traduction évite de préciser indûment qu’il s’agit de leur seule volonté.
- source_word: ፯፯ ኖላዊ
  choice: les soixante-dix bergers
  rationale: Le nombre et l’image symbolique bien établis dans cette partie de la vision sont conservés littéralement.
- source_word: ዲቤሆሙ
  choice: à leur charge
  rationale: La préposition, dans le cadre d’un registre de jugement, indique qu’un relevé accusateur est porté contre eux, et non une simple mention neutre à leur sujet.
theological_decisions:
- issue: Responsabilité dans l’exécution du jugement
  choice: Distinguer les destructions faites sur l’ordre du locuteur de celles imputables aux bergers eux-mêmes.
  alternative: Comprendre « sur leurs têtes » comme l’annonce de leur châtiment, ou considérer les deux séries d’actes comme commandées.
  rationale: Le contraste entre በትእዛዝየ (« sur mon ordre ») et በርእሶሙ (« sur/par leurs têtes ») suggère deux degrés d’imputabilité. « Sous leur propre responsabilité » préserve la tension entre ordre souverain et culpabilité des bergers sans transformer explicitement cette dernière en libre volonté.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la répétition judiciaire de « destruction » et « consigner », ainsi que l’ambiguïté relative de l’idiome « sur leurs têtes ». Tous les marqueurs de notes figurent dans le texte.
