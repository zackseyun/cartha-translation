  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: fr
  text: Et ces loups se montrèrent de nouveau aux brebis[a], qui entrèrent au milieu de ce cours d’eau. Ces loups suivirent les brebis et coururent derrière elles jusque dans ce cours d’eau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du verset est difficile dans le texte éthiopien transmis. On peut aussi comprendre : « Et ces loups poursuivirent de nouveau les brebis », si l’on corrige deux formes probablement altérées dans la transcription.'
    reason: textual_variant
  - marker: b
    text: La fin du verset répète les loups, les brebis et le cours d’eau. Cette répétition, malgré la formulation textuellement maladroite, a été conservée.
    reason: textual_variant
lexical_decisions:
- source_word: ወጓዲሆሙ፡ ዝኩ፡ አዝእብት፡ አርእይዎሙ
  choice: Et ces loups se montrèrent de nouveau aux brebis
  rationale: Le texte transmis est difficile et peut comporter des erreurs de transcription. Cette formulation suit prudemment les formes effectivement fournies, notamment le causatif de « voir », tout en produisant un français naturel et sans adopter tacitement la reconstruction conjecturale « poursuivirent de nouveau ».
- source_word: አዝእብት
  choice: loups
  rationale: Conserve l’image animale concrète et récurrente de l’Apocalypse des animaux.
- source_word: ለአባግዕ
  choice: les brebis
  rationale: « Brebis » maintient le contraste symbolique entre les prédateurs et le troupeau; le nom collectif « troupeau » aurait atténué cette correspondance.
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ
  choice: au milieu de ce cours d’eau
  rationale: Rend la précision spatiale de ማእከለ et traduit l’expression aqueuse sans décider s’il s’agit d’un fleuve, d’un torrent ou d’un canal.
- source_word: ተለውዎሙ
  choice: suivirent
  rationale: Le verbe signifie suivre ou poursuivre. « Suivirent » évite de faire double emploi avec l’action suivante, « coururent derrière elles », tout en laissant percevoir le mouvement hostile dans le contexte.
- source_word: ወረጹ፡ ድኅሬሆሙ
  choice: coururent derrière elles
  rationale: Traduction directe du mouvement rapide accompagné de l’expression « derrière elles ».
theological_decisions:
- issue: Symbolisme de l’Apocalypse des animaux
  choice: Conserver les images concrètes des loups, des brebis et du cours d’eau
  alternative: Remplacer ces figures par les Égyptiens, les Israélites et la mer Rouge
  rationale: Le texte visionnaire doit rester distinct de son interprétation historique; expliciter les référents dans le corps du verset supprimerait la polyvalence propre au symbole.
- issue: Première action des loups dans un texte possiblement corrompu
  choice: Traduire prudemment « se montrèrent de nouveau » et signaler la difficulté
  alternative: Adopter la reconstruction « poursuivirent de nouveau »
  rationale: La reconstruction proposée est plausible dans le contexte, mais elle dépend de corrections de lecture qui ne figurent pas avec certitude dans le texte source fourni. La traduction ne doit pas masquer cette incertitude.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition du récit visionnaire est conservée. « Cours d’eau » reste volontairement indéterminé quant à la taille et à la force de l’étendue d’eau.
