base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: fr
  text: Et je vis encore, dans la vision, jusqu’à ce que tous les cours d’eau se soient retirés de ce toit élevé, que les fissures de la terre aient été nivelées et que d’autres abîmes se soient ouverts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕራብት
  choice: cours d’eau
  rationale: Dans le contexte du déluge, le terme est rendu par une expression française naturelle désignant les écoulements ou courants, sans adopter le sens contextuellement moins probable de « ravins ».
- source_word: ሰሰሉ
  choice: se retirent
  rationale: Exprime la décrue ou le retrait des eaux, conformément au mouvement décrit, tout en conservant l’aspect progressif suggéré par le contexte.
- source_word: ናሕስ፡ ልዑል
  choice: toit élevé
  rationale: Conserve l’image singulière du « toit » et l’adjectif « élevé », plutôt que de l’expliciter comme ciel ou arche.
- source_word: ዐረዩ
  choice: soient aplanies
  rationale: Rend l’idée de nivellement des fissures de la terre sans la remplacer par leur simple disparition.
- source_word: መዓምቃት፡ ካልአት
  choice: d’autres abîmes
  rationale: Traduction directe préservant l’indétermination et l’imagerie cosmique du texte.
theological_decisions:
- issue: Identification du « toit élevé »
  choice: Maintien de l’image « toit élevé »
  alternative: « ciel élevé » ou « arche élevée »
  rationale: Le référent demeure ambigu dans cette vision symbolique; la traduction ne l’identifie donc pas à une réalité théologique précise.
- issue: Nature des abîmes qui s’ouvrent
  choice: Formulation non interprétative
  alternative: Préciser qu’il s’agit des sources de l’abîme ou de cavités souterraines
  rationale: Le texte ne fournit pas ici une identification suffisamment explicite pour justifier cette précision.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe visionnaire est conservée, notamment « jusqu’à ce que », tout en employant des termes accessibles. Aucun marqueur de note n’est requis.
