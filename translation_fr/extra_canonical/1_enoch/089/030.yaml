base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: fr
  text: Et parmi eux, je vis le Seigneur des brebis, qui se tenait devant elles. Il paraissait grand, redoutable et puissant. Toutes ces brebis le virent et eurent peur de sa présence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « eurent peur de sa face » ; ici, « face » peut désigner la présence de la figure vue dans la vision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: « Seigneur » conserve le poids du titre divin dans l’Apocalypse des animaux, tandis que « des brebis » maintient l’imagerie allégorique.
- source_word: ዘቆመ ቅድሜሆሙ
  choice: qui se tenait devant elles
  rationale: Rend directement la proposition relative et la posture de la figure, avec un français naturel.
- source_word: ራእዩ ዐቢይ ወግሩም ወኃያል
  choice: Il paraissait grand, redoutable et puissant
  rationale: Cette formulation rend l’aspect visible du personnage sans transformer la grandeur en simple taille physique. « Redoutable » exprime à la fois l’effroi et la majesté, et « puissant » traduit clairement la force.
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: toutes ces brebis
  rationale: Le démonstratif est conservé et renvoie au groupe déjà présent dans la vision.
- source_word: ፈርሁ እምገጹ
  choice: eurent peur de sa présence
  rationale: La préposition እም marque ici ce qui suscite la peur; ገጽ, littéralement « face », peut désigner la présence. La traduction évite de confondre እም avec le locatif « devant ».
theological_decisions:
- issue: Valeur du titre እግዚአ አባግዕ
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: Dans cette apocalypse, le personnage est le souverain divin de la communauté représentée par les brebis. « Seigneur » préserve cette portée sans expliciter davantage l’identité de la figure.
- issue: Nature de la grandeur décrite
  choice: Il paraissait grand
  alternative: Il était de grande taille
  rationale: Le terme peut évoquer la grandeur de taille, de rang ou de majesté. La formulation retenue conserve cette ouverture au lieu de la réduire à une caractéristique physique.
