base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: fr
  text: 'Un mouton se rendit auprès des loups sur la parole du Seigneur[a]. Un autre mouton le rencontra et partit avec lui. Tous deux allèrent ensemble et entrèrent dans le rassemblement de ces loups. Ils leur parlèrent et les avertirent[b] : désormais, ils ne devaient plus s’en prendre aux moutons[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur l’ordre du Seigneur ». L’expression guèze peut désigner une action accomplie en réponse à une parole divine ayant valeur de commandement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la tournure signifie approximativement « ils firent entendre contre eux »; dans ce contexte, elle exprime un avertissement ou une injonction solennelle.
    reason: lexical_alternative
  - marker: c
    text: Ou « ne devaient plus maltraiter les moutons ». Le verbe décrit une conduite hostile ou violente, sans en préciser ici la forme exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ / አባግዕት
  choice: un mouton / les moutons
  rationale: « Mouton » conserve l’image animale récurrente sans préciser indûment le sexe ou l’âge, tout en permettant de reprendre naturellement le premier animal par le pronom masculin du texte source.
- source_word: አዝእብት
  choice: les loups
  rationale: Le sens ordinaire est « loups » et maintient pleinement l’imagerie prédatrice de la vision.
- source_word: በቃለ እግዚእ
  choice: sur la parole du Seigneur
  rationale: Cette formulation soutenue exprime une action entreprise en réponse à la parole ou à l’ordre divin, sans réduire la phrase à une simple parole entendue.
- source_word: ተረክቦ
  choice: le rencontra
  rationale: Le verbe décrit la rencontre du second mouton avec le premier avant leur déplacement commun; « rencontra » conserve cette progression narrative.
- source_word: ኅቡረ
  choice: ensemble / tous deux
  rationale: La formulation souligne l’action conjointe des deux moutons sans alourdir la phrase française.
- source_word: ማኅበሮሙ
  choice: le rassemblement
  rationale: Le terme désigne le groupe réuni des loups. « Rassemblement » reste formel sans introduire de connotation ecclésiale.
- source_word: ወአስምዑ ዲቤሆሙ
  choice: les avertirent
  rationale: La construction causative avec la préposition dirigée contre ou sur eux dépasse ici le simple fait de « faire entendre » et exprime naturellement un avertissement solennel adressé aux loups.
- source_word: ኢይግሥሥዎሙ ለአባግዕት
  choice: ils ne devaient plus s’en prendre aux moutons
  rationale: Cette expression française conserve l’idée d’une action hostile et prédatrice sans préciser plus que le verbe guèze la forme exacte de la violence.
theological_decisions:
- issue: Valeur de እግዚእ dans le cadre de la vision apocalyptique
  choice: le Seigneur
  alternative: le maître
  rationale: Le contexte présente l’autorité divine qui envoie le mouton. « Le Seigneur » conserve cette portée théologique et le registre révérenciel sans ajouter d’identification confessionnelle.
- issue: Rapport logique introduit par ከመ avant l’interdiction
  choice: avertissement dont le contenu est rendu après deux-points
  alternative: « afin que désormais… » comme proposition de résultat
  rationale: Le contexte permet de comprendre la proposition comme le contenu ou l’effet visé de l’avertissement. Le deux-points produit un français naturel tout en évitant de trancher fortement entre parole rapportée et résultat recherché.
translation_notes:
  register: Français international moderne, narratif et digne. Les coordinations répétées du guèze sont légèrement allégées pour une lecture naturelle, tandis que la succession des actions, l’imagerie des moutons et des loups, et l’autorité divine restent explicites.
