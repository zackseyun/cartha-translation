base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: fr
  text: Quand ils virent le Seigneur des brebis, ils entrèrent afin de fuir loin de lui[a]. Les eaux de ce cours d’eau[b] s’amassèrent ; il devint rapide selon sa nature, se remplit d’eau et monta jusqu’à recouvrir ces loups.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de devant sa face ».'
    reason: Préserve l’idiome guèze de la présence, rendu de façon naturelle dans le texte français.
  - marker: b
    text: 'Ou : « ce chenal » ou « ce lit de torrent ». Le terme peut désigner le passage où l’eau s’écoule et qui se gonfle soudainement.'
    reason: Le terme guèze admet plusieurs désignations topographiques proches.
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: le Seigneur des brebis
  rationale: Conserve la relation de souveraineté exprimée par le construit ainsi que le registre théologique et l’imagerie récurrente de l’allégorie animale.
- source_word: ገብኡ
  choice: ils entrèrent
  rationale: Rend le sens premier du verbe de mouvement sans préciser le lieu, laissé implicite dans la source.
- source_word: ከመ ይጕየዩ እምቅድመ ገጹ
  choice: pour fuir loin de sa face
  rationale: Préserve l’image sémitique de la face tout en donnant à la relation finale une formulation française naturelle.
- source_word: ዝኩ ዐይገ ማይ
  choice: ce cours d’eau
  rationale: Désigne avec assez de souplesse un chenal ou lit de torrent susceptible de se gonfler brusquement.
- source_word: ተጋብአ
  choice: se rassembla
  rationale: Conserve l’image de l’eau qui s’amasse avant de monter.
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: devint rapide selon sa nature
  rationale: Maintient la formulation difficile mais intelligible du guèze sans lui imposer une interprétation plus précise.
- source_word: መልአ ማይ
  choice: se remplit d’eau
  rationale: Rendu direct et naturel de l’image de crue.
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  choice: monta jusqu’à recouvrir ces loups
  rationale: Analyse ከደኖሙ comme le verbe « couvrir » muni du suffixe objet pluriel, repris par l’objet explicite « ces loups ».
theological_decisions:
- issue: Désignation du personnage divin dans l’allégorie animale
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: « Seigneur » conserve la portée théologique et la dignité de la figure sans transformer l’allégorie en explication doctrinale.
- issue: Expression de la présence dans la scène de jugement
  choice: loin de sa face
  alternative: loin de sa présence
  rationale: La formulation retenue conserve l’image concrète et la force apocalyptique de l’expression source.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure légèrement solennelle afin de préserver le caractère visionnaire du passage, sans archaïsmes. Les répétitions accidentelles de la couche anglaise ont été écartées, et le verbe ገብኡ a été traduit selon le texte guèze plutôt que lissé en « ils s’enfuirent ».
