base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: fr
  text: 'Et je vis de nouveau : voici que des sources[a] s’ouvrirent sur la terre, dans ce grand enclos. Et tandis que cette eau jaillissait et montait sur la terre, cet enclos restait visible[b], jusqu’à ce que tout son sol[c] soit couvert d’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des fontaines » ou « des résurgences ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « cet enclos apparut » ou « fut visible ». La construction peut indiquer qu’il demeura visible pendant la montée des eaux, jusqu’à être entièrement recouvert.
    reason: alternative_reading
  - marker: c
    text: Ou « toute la terre », selon la manière dont on comprend le suffixe pronominal.
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: sources
  rationale: Le pluriel désigne ici des points naturels d’où l’eau sort du sol. « Sources » est courant en français et convient mieux que « fontaines », qui pourrait suggérer des ouvrages construits.
- source_word: ተርሕዉ
  choice: s’ouvrirent
  rationale: Le passif guèze est rendu naturellement par la forme pronominale française, tout en conservant l’image de sources qui s’ouvrent.
- source_word: ዐጸድ ዐቢይ
  choice: grand enclos
  rationale: « Enclos » garde l’idée d’un espace délimité sans préciser indûment qu’il s’agit d’un champ, d’une cour ou d’un jardin.
- source_word: ወአንዘ
  choice: et tandis que
  rationale: Cette locution introduit une proposition temporelle et relie la montée des eaux à la visibilité de l’enclos.
- source_word: ይፈልሕ
  choice: jaillissait
  rationale: Le verbe décrit l’eau qui sort ou surgit. « Jaillissait » restitue clairement ce mouvement sans évoquer une ébullition littérale.
- source_word: ይትነሣእ
  choice: montait
  rationale: Associé au verbe précédent, il exprime l’élévation progressive des eaux sur la terre.
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: cet enclos restait visible
  rationale: Dans la construction temporelle, l’enclos est visible pendant que l’eau monte, jusqu’à sa couverture complète. « Restait visible » rend cette logique sans transformer la scène en interprétation doctrinale.
- source_word: ኵሉ ምድሩ
  choice: tout son sol
  rationale: Le suffixe pronominal renvoie vraisemblablement à l’enclos. « Tout son sol » maintient cette référence locale, tandis qu’une note conserve la possibilité de comprendre « toute la terre ».
theological_decisions:
- issue: Étendue du déluge dans la vision
  choice: Le texte principal décrit la submersion du sol de l’enclos symbolique.
  alternative: La formule peut être comprise comme désignant toute la terre et donc une inondation universelle.
  rationale: La forme pronominale renvoie naturellement à l’enclos, mais le nom traduit par « sol » peut également signifier « terre ». La traduction principale garde le référent grammatical le plus proche sans exclure l’autre portée possible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe temporelle du guèze est explicitement conservée. Les termes concrets « sources », « enclos », « sol » et « couvert d’eau » rendent la scène accessible sans effacer ses difficultés textuelles.
