base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: fr
  text: Quand ils le virent, ils eurent peur et tremblèrent devant lui[a] ; ils voulurent retourner dans leurs propres enclos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant son visage », expression imagée signifiant « en sa présence ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme désigne des enclos pour animaux. « Enclos » préserve l’imagerie animale de la vision sans préciser l’espèce. Le verbe traduit par « retourner » peut aussi se comprendre comme « entrer ».
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: ils le virent
  rationale: Le verbe courant de la vision, avec un suffixe objet masculin, appelle la traduction simple et directe « ils le virent ».
- source_word: ፈርሁ ወርዕዱ
  choice: ils eurent peur et tremblèrent
  rationale: Cette formulation conserve à la fois la peur et sa manifestation physique, sans atténuer leur progression.
- source_word: እምቅድመ ገጹ
  choice: devant lui
  rationale: L’expression signifie littéralement « devant son visage ». « Devant lui » en restitue naturellement le sens de présence en français moderne, tandis que la note conserve l’image littérale.
- source_word: ወፈቀዱ
  choice: ils voulurent
  rationale: Le verbe exprime la volonté ou le désir. « Voulurent » est naturel dans ce récit et évite le registre affectif plus marqué de « désirèrent ».
- source_word: ከመ ይግብኡ
  choice: retourner
  rationale: La forme peut exprimer le fait d’entrer ou de revenir. Le contexte favorise ici un mouvement de retour vers les enclos antérieurs.
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: dans leurs propres bergeries
  rationale: « Bergeries » maintient l’imagerie animale suivie de l’Apocalypse des animaux ; « propres » rend explicitement l’élément possessif et distinctif.
theological_decisions:
- issue: Faut-il généraliser l’image animale en parlant de maisons ou de lieux ?
  choice: conserver « bergeries »
  alternative: leurs maisons ; leurs lieux ; leurs enclos
  rationale: La vision repose sur une symbolique animale continue. La remplacer par un terme humain générique effacerait une dimension littéraire et théologique du passage.
- issue: Faut-il résoudre le mouvement comme une simple entrée plutôt qu’un retour ?
  choice: « retourner »
  alternative: « entrer »
  rationale: Le contexte soutient le retour à un lieu antérieur, mais la note signale la latitude lexicale du verbe afin de ne pas dissimuler l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant la répétition de la peur et du tremblement ainsi que la symbolique animale du contexte apocalyptique.
