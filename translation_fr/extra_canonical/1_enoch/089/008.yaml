  source_fidelity: 'Le texte français rend fidèlement la progression du guèze, y compris la lecture inchoative vraisemblable derrière la forme textuellement incertaine initiale : l’eau « commença à descendre ». « En eux » conserve, sans le résoudre dans le corps du texte, le pronom pluriel dont l’antécédent est probablement les abîmes du verset précédent. « La terre soit mise à nu », « ce navire se posa sur la terre », la dissipation des ténèbres et l’avènement de la lumière suivent correctement les propositions successives.'
