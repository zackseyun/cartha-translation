  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
translation:
  language: fr
  text: L’eau commença à descendre en eux[a] jusqu’à ce que la terre soit mise à nu. Alors ce navire se posa sur la terre ; les ténèbres furent dissipées, et la lumière vint à l’existence.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « En eux » renvoie vraisemblablement aux abîmes ouverts au verset précédent.
    reason: clarification
  - marker: b
    text: Le passage des ténèbres à la lumière évoque la création ou la restauration du monde, mais la formulation suit ici de près le guèze.
    reason: cross_reference
lexical_decisions:
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: L’eau commença à descendre
  rationale: Le texte transmis paraît porter ወአንዘ, mais le contexte et la construction avec l’imparfait ይረድ appuient vraisemblablement la lecture ወአኀዘ, « commença à ». Le singulier « l’eau » conserve la valeur collective de ማይ.
- source_word: ውስቴቶሙ
  choice: en eux
  rationale: Le pronom masculin pluriel renvoie vraisemblablement aux abîmes mentionnés au verset précédent. La traduction garde le pronom du texte au lieu d’expliciter silencieusement son antécédent.
- source_word: ተከሥተ፡ ምድር
  choice: la terre soit mise à nu
  rationale: La tournure passive exprime le dévoilement ou la mise à découvert de la terre lorsque les eaux se retirent.
- source_word: መስቀር
  choice: navire
  rationale: Dans le déroulement du récit du déluge, le terme désigne ici l’embarcation qui vient se poser sur la terre. « Navire » est naturel et conserve un registre digne sans imposer le terme biblique traditionnel « arche ».
- source_word: ተገኅሰት፡ ጽልመት
  choice: les ténèbres furent dissipées
  rationale: Le verbe indique que les ténèbres sont écartées ou enlevées. « Furent dissipées » rend clairement ce mouvement sans en préciser abusivement le mécanisme.
- source_word: ወኮነ፡ ብርሃን
  choice: et la lumière vint à l’existence
  rationale: La formulation conserve la valeur simple de ኮነ, « devenir, venir à l’existence », ainsi que la résonance créationnelle, sans reprendre automatiquement une formule française consacrée de la Genèse.
theological_decisions:
- issue: Faut-il donner à la dernière proposition la formulation consacrée du récit de la création ?
  choice: la lumière vint à l’existence
  alternative: il y eut de la lumière
  rationale: Le passage évoque naturellement la création ou une restauration du monde, mais la traduction suit la formulation guèze et évite une harmonisation explicite avec la cadence traditionnelle de la Genèse.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe garde la progression par propositions coordonnées propre à la vision, tout en employant une ponctuation française naturelle. Le pronom « eux » est volontairement conservé malgré sa légère étrangeté afin de ne pas remplacer dans le corps du texte son antécédent implicite.
