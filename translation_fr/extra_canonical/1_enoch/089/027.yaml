  text: And I saw until all the wolves that followed those sheep perished and were drowned[a][b].
translation:
  language: fr
  text: Et je vis jusqu’à ce que tous les loups qui suivaient ces brebis périssent et se noient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je regardai
  rationale: Rend l’ouverture visionnaire à la première personne et convient à la construction durative « jusqu’à ce que ».
- source_word: እስከ
  choice: jusqu’à ce que
  rationale: Marque la poursuite de la vision jusqu’à l’événement qui en constitue l’aboutissement.
- source_word: ተሐጕሉ
  choice: périssent
  rationale: Distingue le premier verbe de destruction du verbe final évoquant l’immersion ou la noyade.
- source_word: ኵሎሙ አዝእብት
  choice: tous les loups
  rationale: አዝእብት désigne ici précisément les loups dans l’imagerie animale suivie du récit.
- source_word: እለ ተለውዎሙ
  choice: qui suivaient
  rationale: Conserve le sens lexical de suivre, sans préciser dans le texte principal s’il s’agit simplement d’aller derrière ou de poursuivre avec hostilité.
- source_word: ለዝኩ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif renvoie aux brebis déjà présentes dans la vision; « ces » est naturel dans un récit où elles demeurent sous les yeux du voyant.
- source_word: ወተሠጥሙ
  choice: et soient engloutis
  rationale: Exprime la disparition sous les eaux tout en gardant la force imagée du verbe; « se noient » demeure possible.
theological_decisions:
- issue: Faut-il expliciter les référents historiques des animaux ?
  choice: Conserver littéralement les « loups » et les « brebis ».
  alternative: Identifier dans le texte les loups aux Égyptiens et les brebis à Israël.
  rationale: La vision animale transmet son sens par un symbolisme continu; l’expliciter dans le corps du texte réduirait l’ambiguïté littéraire et imposerait une interprétation.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple soutient le registre narratif visionnaire sans archaïsme lexical; le parallélisme des deux verbes de jugement est conservé.
