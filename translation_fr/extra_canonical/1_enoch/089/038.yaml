base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: fr
  text: Et cette brebis qui les conduisait, celle qui était devenue un homme, fut séparée d’eux et se coucha[a]. Et toutes les brebis la cherchèrent et poussèrent un grand cri à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cette vision, le fait qu’elle « se coucha » évoque probablement la mort de la brebis qui guidait le troupeau ; le texte conserve toutefois l’image elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ፡ በግዕ
  choice: Et cette brebis
  rationale: ዝኩ est un démonstratif (« cette »), et non une forme du verbe « voir ». Le féminin français s’accorde avec « brebis ».
- source_word: ዘይመርሖሙ
  choice: qui les conduisait
  rationale: L’imparfait rend le rôle continu de guide dans la scène et conserve l’ordre des relatives du guèze.
- source_word: ዘኮነ፡ ብእሴ
  choice: celle qui était devenue un homme
  rationale: Le plus-que-parfait marque une transformation déjà accomplie dans le récit visionnaire, sans sortir du registre allégorique.
- source_word: ተሌለየ፡ እምኔሆሙ
  choice: fut séparée d’eux
  rationale: La tournure passive préserve l’absence d’agent exprimé et met l’accent sur l’éloignement du troupeau.
- source_word: ወሰከበ
  choice: et se coucha
  rationale: Le sens concret du verbe est conservé; dans ce contexte, l’image peut évoquer la mort sans que la traduction l’explicite.
- source_word: ኃሠሥዎ
  choice: la cherchèrent
  rationale: Rendu courant et direct du verbe de recherche; le pronom féminin reprend grammaticalement « brebis ».
- source_word: ወጸርኁ፡ ዲቤሁ
  choice: et poussèrent sur elle
  rationale: La formulation garde la préposition « sur/au-dessus de » et l’expression audible du deuil sans imposer le terme plus interprétatif « se lamentèrent ».
- source_word: ጽራኀ፡ ዐቢየ
  choice: un grand cri
  rationale: Traduction formelle qui conserve l’intensité et la diction répétitive de la vision apocalyptique.
theological_decisions:
- issue: Faut-il interpréter explicitement le fait que la brebis devenue homme « se couche » comme sa mort ?
  choice: Conserver « se coucha » dans le texte principal.
  alternative: Traduire « mourut » ou « s’endormit ».
  rationale: Le verbe guèze décrit d’abord l’action de se coucher. Le contexte suggère probablement la mort du chef, mais l’image visionnaire et son ambiguïté doivent être préservées.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du guèze tout en étant naturelle. Les pronoms sont féminins parce qu’ils reprennent grammaticalement « brebis », bien que la figure soit devenue « un homme » dans la vision.
