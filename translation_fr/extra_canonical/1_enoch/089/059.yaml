base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: fr
  text: 'Il convoqua soixante-dix bergers et leur livra ces brebis pour qu’ils les fassent paître. Puis il dit aux bergers et à leurs compagnons[a] : « Désormais, que chacun de vous fasse paître les brebis[b] et accomplisse tout ce que je vous ordonne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « leurs compagnons » est quelque peu incertaine; elle désigne probablement ceux qui sont associés aux bergers.
    reason: lexical_alternative
  - marker: b
    text: Le texte éthiopien répète ici le nombre soixante-dix dans l’adresse (« vous tous, les soixante-dix »). Comme ce nombre vient d’être indiqué, la traduction « chacun de vous » en fait ressortir le sens distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጸውዐ
  choice: convoqua
  rationale: Le verbe exprime ici un appel officiel lié à une mission; « convoqua » convient mieux que « invita » et est plus précis que « appela ».
- source_word: ፸ ኖላዊያነ
  choice: soixante-dix bergers
  rationale: Conserve à la fois le nombre explicite et l’image pastorale structurante de la vision.
- source_word: ገደፎሙ ሎሙ ለዝኩ አባግዕ
  choice: leur livra ces brebis
  rationale: Rend le transfert de garde ou de responsabilité sans l’adoucir en simple confiance; « ces brebis » maintient l’image animale concrète.
- source_word: ከመ ይርዐይዎሙ
  choice: pour qu’ils les fassent paître
  rationale: Expression française naturelle qui conserve l’action propre aux bergers envers les brebis.
- source_word: ለጸማዶሙ
  choice: à leurs compagnons
  rationale: Le terme désigne ceux qui leur sont associés ou joints; « compagnons » préserve cette relation sans identifier davantage ces figures.
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: chacun de vous
  rationale: Rend la portée distributive de l’expression, tandis que le nombre soixante-dix a déjà été donné dans la première phrase.
- source_word: እምይእዜ
  choice: désormais
  rationale: Marque clairement le commencement de leur mission dans un registre actuel et digne.
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: accomplisse tout ce que je vous ordonne
  rationale: Préserve l’impératif et l’autorité solennelle du locuteur; « accomplir » convient au registre d’une mission confiée.
theological_decisions:
- issue: Faut-il interpréter directement les bergers et les brebis comme leurs référents humains ou angéliques?
  choice: Conserver les images de « bergers » et de « brebis » sans les expliquer dans le corps du texte.
  alternative: Traduire de manière interprétative par « dirigeants/anges » et « peuple/Israël ».
  rationale: La vision repose sur une imagerie animale continue. Identifier explicitement ses référents supprimerait une part de l’ambiguïté symbolique du texte.
- issue: Faut-il comprendre la remise des brebis comme une simple responsabilité bienveillante?
  choice: Employer « livra », qui exprime le transfert sans préciser sa valeur morale.
  alternative: Employer « confia », qui suggérerait plus nettement une charge bienveillante.
  rationale: Le contexte visionnaire permet une nuance plus lourde que celle d’une simple confiance; la traduction ne doit pas anticiper le jugement porté sur les bergers.
translation_notes:
  register: Français international moderne, clair et digne. L’imagerie pastorale de la vision est conservée. « Faire paître » est préféré à l’emploi verbal moins naturel de « berger », et la syntaxe impérative évite une formulation inutilement archaïque.
