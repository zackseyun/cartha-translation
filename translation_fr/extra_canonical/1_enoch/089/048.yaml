base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: fr
  text: Alors ce second bélier se leva et conduisit les brebis[a]. Ce bélier engendra de nombreuses brebis, puis se coucha[b]. Une petite brebis[c] devint un bélier à sa place, et celui-ci devint le chef et le guide de ces brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins ajoutent ici « petite », au singulier, après le pluriel « brebis ». Cette leçon, probablement due à une anticipation de la « petite brebis » mentionnée ensuite, est omise dans le texte.
    reason: textual_variant
  - marker: b
    text: Dans le langage imagé de la vision, « se coucha » signifie probablement que le bélier mourut; la traduction conserve toutefois l’image littérale.
    reason: lexical_alternative
  - marker: c
    text: L’adjectif peut aussi signifier « jeune »; il peut donc s’agir d’une brebis petite ou jeune.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳሓራዊ ዝኩ ሐርጌ
  choice: ce second bélier
  rationale: ዳሓራዊ est ici adjectival et qualifie le bélier comme celui qui vient après, en contraste avec le premier bélier du contexte. « Second » rend cette succession plus exactement qu’un adverbe comme « ensuite ».
- source_word: ተንሥአ
  choice: se leva
  rationale: Verbe narratif courant exprimant le fait de se lever ou de surgir; « se leva » reste naturel et digne en français.
- source_word: መርሖሙ
  choice: conduisit
  rationale: Le verbe désigne l’action de mener ou de guider. « Conduisit » conserve à la fois l’image pastorale et la portée politique de l’allégorie.
- source_word: አባግዕ
  choice: brebis
  rationale: Le terme concret désigne les bêtes du troupeau. « Brebis » maintient l’imagerie animale sans l’abstraire en « troupeau ».
- source_word: ወሊደ
  choice: engendra
  rationale: Le verbe exprime explicitement la génération. « Engendra » convient au sujet mâle et au registre visionnaire sans effacer la relation de descendance.
- source_word: ብዙኃነ
  choice: de nombreuses
  rationale: Rend simplement l’idée de grand nombre dans un français fluide.
- source_word: ሰከበ
  choice: se coucha
  rationale: La traduction garde l’image littérale du verbe, même si, dans le récit visionnaire, elle évoque vraisemblablement la mort.
- source_word: በግዕ ንኡስ
  choice: une petite brebis
  rationale: ንኡስ peut indiquer la petitesse ou la jeunesse. « Petite » préserve cette ambiguïté mieux que « jeune » ou « agnelle ».
- source_word: ህየንቴሁ
  choice: à sa place
  rationale: La locution marque le remplacement ou la succession, sans expliciter davantage l’identité historique symbolisée.
- source_word: መኰንነ
  choice: chef
  rationale: Le mot exprime l’exercice d’une autorité. « Chef » est assez large pour le contexte allégorique et n’impose pas un titre institutionnel précis.
- source_word: መራሔ
  choice: guide
  rationale: Le nom désigne celui qui mène. « Guide » le distingue de « chef » tout en rappelant le verbe « conduisit » employé plus haut.
theological_decisions:
- issue: Interprétation historique de la succession entre les béliers
  choice: Une petite brebis devint un bélier à sa place
  alternative: Une jeune brebis lui succéda comme bélier
  rationale: Le texte représente la succession sous la forme d’une transformation animale. La traduction conserve cette image apocalyptique au lieu de la remplacer par une explication dynastique ou historique.
- issue: Sens de l’action de se coucher
  choice: se coucha
  alternative: mourut
  rationale: La mort est probablement suggérée dans l’économie de la vision, mais le verbe conserve une image concrète. Le sens probable est signalé en note plutôt qu’imposé dans le texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La répétition des termes animaliers est maintenue afin de préserver la cohérence symbolique de la vision. « Ce second bélier » rend la valeur adjectivale de ዳሓራዊ et le contraste contextuel avec le premier bélier.
