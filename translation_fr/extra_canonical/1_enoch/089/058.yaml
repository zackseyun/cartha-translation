base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: fr
  text: Et il garda le silence en regardant ; il se réjouit, car ils étaient dévorés, engloutis et emportés[b]. Puis il les abandonna au pouvoir[a] de toutes les bêtes, pour servir de nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main ». Cette expression signifie être placé sous le pouvoir ou la domination de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Les trois verbes forment une suite cumulative : « dévorés, engloutis et emportés ». Le dernier peut aussi être compris comme « arrachés » ou « enlevés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አርመመ
  choice: garda le silence
  rationale: Le verbe exprime le silence ou le fait de rester tranquille. « Garda le silence » conserve le sens directement attesté sans ajouter l’idée interprétative qu’il aurait refusé d’intervenir.
- source_word: እንዘ ይሬኢ
  choice: tout en regardant
  rationale: La construction marque une action simultanée. Cette formulation est naturelle en français et maintient l’aspect soutenu de la scène visionnaire.
- source_word: ተፈሥሐ
  choice: se réjouit
  rationale: Rend directement la joie exprimée par le verbe, dans un registre digne adapté au récit apocalyptique.
- source_word: ተበልዑ
  choice: étaient dévorés
  rationale: « Dévorés » préserve l’image violente de prédation qui structure l’Apocalypse des animaux.
- source_word: ተውሕጡ
  choice: engloutis
  rationale: Le terme renforce l’image de consommation totale et permet de conserver la succession cumulative des verbes.
- source_word: ተሀይዱ
  choice: emportés de force
  rationale: Le verbe peut désigner le fait d’être saisi ou emporté. Cette traduction conserve l’image concrète de proies enlevées par des prédateurs, plutôt que de la réduire au résultat général « détruits ».
- source_word: ኃደጎሙ
  choice: il les abandonna
  rationale: Le verbe signifie les laisser. Dans ce contexte de mise à la merci des bêtes, « abandonna » exprime la gravité de l’acte sans employer une formule doctrinale importée.
- source_word: ውስተ እዴ
  choice: au pouvoir
  rationale: Littéralement « dans la main », idiome sémitique désignant la puissance ou la domination. Le sens idiomatique est rendu dans le texte et le sens littéral signalé en note.
- source_word: ኵሎሙ አራዊት
  choice: toutes les bêtes
  rationale: « Bêtes » convient à l’allégorie animale et conserve la connotation prédatrice mieux que le terme plus neutre « animaux ».
- source_word: ለመብልዕ
  choice: pour qu’elles les dévorent
  rationale: L’expression infinitive indique le but ou le résultat. L’explicitation du sujet en français évite l’ambiguïté syntaxique et maintient l’image de prédation.
theological_decisions:
- issue: Présenter l’abandon comme une remise judiciaire active ou comme le fait de laisser sans protection
  choice: il les abandonna au pouvoir de toutes les bêtes
  alternative: il les livra à toutes les bêtes
  rationale: Le guèze décrit fermement le fait de les laisser exposés au pouvoir des bêtes, mais n’exige pas une formule technique de remise judiciaire. « Abandonna » préserve cette tension.
- issue: Nature de la réaction de celui qui regarde
  choice: il garda le silence… et il se réjouit
  alternative: il resta sans intervenir… et il se réjouit
  rationale: Le texte associe silence et joie, mais n’explicite pas que le silence équivaut à un refus d’intervenir. La traduction conserve cette dureté et cette ambiguïté sans les expliquer dans le corps du verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La cadence cumulative des trois passifs et l’imagerie de prédation sont conservées. L’idiome guèze de la « main » est rendu par son sens naturel en français et documenté en note.
