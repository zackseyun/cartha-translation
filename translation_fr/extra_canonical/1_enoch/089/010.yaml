base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: fr
  text: 'Et ils se mirent à donner naissance aux bêtes des champs et aux oiseaux. Il en surgit toutes sortes de peuples[a] : lions, léopards, loups, chiens, hyènes, sangliers, renards, lièvres, porcs, faucons, vautours, milans, aigles et corbeaux[b]. Et au milieu d’eux naquit un taureau blanc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze est difficile. On pourrait aussi comprendre « toutes les catégories de nations » ou, plus généralement, « toutes sortes » ; toutefois, le mot traduit par « peuples » figure bien dans le texte.
    reason: lexical_alternative
  - marker: b
    text: L’identification exacte de plusieurs animaux est incertaine. On peut notamment comprendre « chacals » au lieu de « hyènes » ou de « renards », « éperviers » au lieu de « faucons », et « corneilles » au lieu de « corbeaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: አሐዙ፡ ይለዱ
  choice: ils se mirent à donner naissance
  rationale: Rend à la fois l’idée de commencement et celle d’engendrement, sans attribuer une maternité biologique trop précise aux animaux symboliques.
- source_word: አራዊተ፡ ገዳም
  choice: les bêtes des champs
  rationale: Conserve l’expression concrète et le registre visionnaire du guèze, tout en restant idiomatique en français biblique moderne.
- source_word: ዘእምኵሉ፡ ኅብር፡ አሕዛብ
  choice: toutes sortes de peuples
  rationale: La formule est difficile, mais አሕዛብ désigne bien des peuples ou nations. Cette formulation garde la diversité des catégories et leur portée collective sans imposer une classification technique.
- source_word: አጽባዕት
  choice: hyènes
  rationale: Identification zoologique plausible et traditionnelle; l’incertitude avec des canidés tels que les chacals est signalée en note.
- source_word: ሐራዊ፡ ገዳም
  choice: sangliers
  rationale: Le composé désigne vraisemblablement des porcs sauvages; « sangliers » est précis et naturel.
- source_word: ገሐያት
  choice: lièvres
  rationale: Cette identification correspond au sens lexical attesté du terme et corrige l’ancienne proposition « écureuils ».
- source_word: ላህም፡ ጸዓዳ
  choice: un taureau blanc
  rationale: Rend directement l’animal mâle et sa couleur, éléments significatifs dans la vision allégorique.
theological_decisions:
- issue: Portée symbolique de la liste d’animaux
  choice: Conserver explicitement « peuples » dans la formule introductive.
  alternative: Traduire seulement par « toutes sortes » ou « toutes les espèces d’animaux ».
  rationale: Le guèze contient አሕዛብ, « peuples/nations ». Le maintien de ce terme laisse percevoir la dimension humaine et politique de l’allégorie sans identifier les animaux à des peuples précis.
translation_notes:
  register: Français international moderne, clair et digne. La répétition structurante de la vision est conservée, tandis que la longue énumération reçoit des articles pour rester naturelle en français. Les termes zoologiques incertains sont maintenus dans le texte principal avec une note plutôt que résolus de façon catégorique.
