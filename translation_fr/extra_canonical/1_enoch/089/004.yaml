base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: fr
  text: 'L’eau, l’obscurité et la brume[a] s’intensifièrent sur lui. Je regardai la hauteur de cette eau[b] : cette eau s’éleva au-dessus de cet enclos[c], se déversa sur l’enclos et demeura sur la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « brouillard » : le terme guèze désigne une vapeur qui obscurcit la vue.'
    reason: lexical_alternative
  - marker: b
    text: Le singulier « eau », répété dans le texte guèze, évoque ici une inondation sans la nommer explicitement comme le déluge.
    reason: cultural_note
  - marker: c
    text: L’« enclos » peut désigner plus précisément une cour clôturée ou une bergerie dans le symbolisme animal de cette vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዝኀ (lecture corrigée de በዝን)
  choice: s’intensifièrent
  rationale: Le verbe signifie « augmenter, se multiplier ». Le pluriel français convient aux trois sujets coordonnés et conserve l’idée de leur intensification commune, sans revenir à l’ancienne lecture « vinrent ».
- source_word: ዲቤሁ
  choice: sur lui
  rationale: La préposition locative munie d’un suffixe masculin renvoie à un élément déjà mentionné dans le contexte. Le pronom est conservé afin de ne pas préciser arbitrairement son référent.
- source_word: ማይ
  choice: eau
  rationale: Le guèze répète le singulier. En français, « eau » reste un nom massif naturel et évite d’expliciter prématurément l’interprétation diluvienne.
- source_word: ጽልመት
  choice: obscurité
  rationale: Terme courant et digne qui restitue l’atmosphère menaçante de la vision.
- source_word: ጊሜ
  choice: brume
  rationale: Dans cette série météorologique, « brume » exprime une vapeur qui obscurcit la vue sans imposer une masse nuageuse.
- source_word: አሬኢ … መልዕልተ
  choice: Je regardai jusqu’à quelle hauteur montait
  rationale: Cette formulation française naturelle conserve l’acte de regarder et la dimension verticale exprimée par le texte, tout en évitant le tour peu idiomatique « je regardai la hauteur de l’eau ».
- source_word: ተላዐለ
  choice: s’éleva au-dessus de
  rationale: Le verbe exprime une montée ou une élévation; ce choix maintient nettement l’image verticale de l’inondation.
- source_word: ዐጸድ
  choice: enclos
  rationale: « Enclos » désigne un espace fermé et convient au symbolisme animal de la vision, sans préciser qu’il s’agit nécessairement d’une bergerie.
- source_word: ይከዑ
  choice: se déversa par-dessus
  rationale: Le verbe décrit l’eau franchissant l’enclos. « Se déversa » rend le mouvement et la force de l’inondation.
- source_word: ቆመ
  choice: demeura
  rationale: Le sens littéral « se tint » serait peu naturel pour de l’eau en français. « Demeura » préserve l’idée qu’elle resta en place sur la terre.
theological_decisions:
- issue: Faut-il expliciter le déluge dans le texte principal ?
  choice: Conserver « eau »
  alternative: « eaux du déluge » ou « flot »
  rationale: Le contexte évoque fortement le déluge, mais le témoin guèze répète simplement « eau ». La traduction laisse donc l’identification au lecteur.
- issue: Quel degré de précision donner à ዐጸድ dans la vision animale ?
  choice: « enclos »
  alternative: « bergerie », « cour » ou « enceinte »
  rationale: « Bergerie » rendrait le symbolisme plus explicite que ne le fait ce verset. « Enclos » conserve à la fois l’espace fermé et l’ambiguïté du référent.
- issue: Comment traiter le référent du suffixe dans ዲቤሁ ?
  choice: Conserver « sur lui »
  alternative: Nommer l’enclos ou employer « à cet endroit »
  rationale: Le suffixe masculin est explicite, mais son antécédent dépend du contexte précédent. Le pronom évite de résoudre silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire. La formulation reste proche de la répétition et de la verticalité du guèze, tout en remplaçant les calques les moins naturels par des tours français lisibles.
