base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: fr
  text: Je regardai jusqu’à ce qu’elles cessent de pousser des cris pour cette brebis[a], puis elles traversèrent ce cours d’eau[b]. Les deux autres brebis, qui les conduisaient, se tinrent à la place de celles qui s’étaient couchées[c], et elles les conduisirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « cessent de pousser des cris au sujet de cette brebis » ou « cessent de pousser des cris à cause de cette brebis ». Le rapport exact exprimé par la préposition demeure incertain.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ce ruisseau », « cette rivière » ou « ce torrent », selon l’ampleur attribuée à l’eau qui coule.
    reason: lexical_alternative
  - marker: c
    text: Ou « de celles qui étaient étendues ». Le contexte peut suggérer qu’elles étaient tombées ou mortes, mais le texte ne l’explicite pas.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: አርመሙ
  choice: se soient calmées
  rationale: Le verbe exprime le fait de devenir silencieux ou calme. « Se soient calmées » rend naturellement en français ce changement d’état sans suggérer qu’un agent extérieur les aurait réduites au silence.
- source_word: እምጽራኁ
  choice: après la clameur
  rationale: Le nom désigne un cri, une clameur ou un tumulte. « Clameur » conserve ici la force collective et agitée de la scène.
- source_word: ለዝኩ በግዕ
  choice: au sujet de cette brebis
  rationale: La préposition peut exprimer le rapport, l’intérêt ou la cause. Cette formulation garde ouverte la nature exacte du lien entre la clameur et la brebis.
- source_word: ውሒዘ ማይ
  choice: cours d’eau
  rationale: L’expression désigne une eau qui coule sans imposer nécessairement l’idée précise d’un fleuve ou d’un torrent.
- source_word: ካልኤሆሙ
  choice: les deux autres brebis
  rationale: Le terme marque l’altérité ou le contraste; le duel du contexte est rendu par « deux », conformément à la scène.
- source_word: ይመርሕዎሙ / መርሕዎሙ
  choice: qui les conduisaient / elles les conduisirent
  rationale: La répétition du verbe « conduire » respecte la progression et la répétition caractéristiques du récit visionnaire.
- source_word: ተክሎሙ
  choice: à la place de celles
  rationale: La forme est comprise comme la préposition « à la place de, au lieu de » munie d’un suffixe pluriel, et non comme un verbe signifiant « placer » ou « planter ».
- source_word: ለእለ ሰከቡ
  choice: de celles qui s’étaient couchées
  rationale: Le verbe signifie ordinairement « se coucher, être étendu ». La traduction reste littérale et n’explicite ni mort ni chute, même si le contexte peut les suggérer.
theological_decisions:
- issue: Maintien concret du symbolisme animal
  choice: Conserver « brebis » et la suite des actions sans identifier les personnages historiques dans le corps du texte.
  alternative: Remplacer les animaux par des désignations interprétatives telles que « le peuple », « les Israélites » ou des noms de chefs.
  rationale: La vision communique au moyen d’une allégorie animale continue. La traduction doit préserver sa rhétorique propre sans imposer son décodage historique ou théologique.
- issue: État de celles qui s’étaient couchées
  choice: Ne pas préciser qu’elles étaient mortes ou tombées.
  alternative: Traduire « celles qui étaient mortes » ou « celles qui étaient tombées ».
  rationale: Le remplacement des premières dirigeantes peut évoquer leur mort, mais le verbe source signifie directement qu’elles étaient couchées ou étendues. L’ambiguïté est donc conservée.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les actions principales, tandis que l’imparfait et le plus-que-parfait marquent respectivement l’action en cours des guides et l’état antérieur des brebis remplacées. Le féminin grammatical de « brebis » est maintenu dans les pronoms.
