base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: fr
  text: Et le Seigneur des brebis vint vers elles. Pendant qu’on frappait ces loups et que les loups poussaient des cris, les brebis se turent et, dès lors, ne poussèrent plus de cris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La transcription éthiopienne fournie porte à la fin une forme qui pourrait se lire « ils poussèrent des cris », ce qui contredirait « les brebis se turent ». L’édition critique semble toutefois avoir « ils cessèrent », lecture adoptée ici; le contexte sous-entend qu’elles cessèrent de pousser des cris.
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: le Seigneur des brebis
  rationale: Le terme signifie littéralement « leur Seigneur ». Dans le cadre symbolique de l’Apocalypse des animaux, expliciter le référent possessif par « des brebis » préserve clairement l’image de Dieu comme Seigneur du troupeau.
- source_word: መጽአ፡ ኀቤሆሙ
  choice: vint vers elles
  rationale: Expression simple de mouvement vers un but. Le pronom féminin reprend naturellement « les brebis » en français.
- source_word: አባግዕ
  choice: les brebis
  rationale: « Brebis » maintient l’identité symbolique répétée du peuple dans la vision, plutôt que de lisser l’image par « troupeau ».
- source_word: ይዝብጥዎሙ፡ ለእልኩ፡ አዝእብት
  choice: on frappait ces loups
  rationale: 'Le groupe introduit par ለ marque ici l’objet direct : les loups subissent les coups. Le sujet verbal n’étant pas exprimé de façon claire dans cette séquence, le pronom indéfini « on » évite de l’identifier sans preuve.'
- source_word: አዝእብት፡ እንዘ፡ የአውይዉ
  choice: les loups poussaient des cris
  rationale: Le nom répété désigne les loups comme sujets de l’action vocale. « Pousser des cris » reste assez large pour rendre une clameur ou une plainte sans ajouter l’idée spécifique de hurlement.
- source_word: አባግዕ፡ አርመሙ
  choice: les brebis se turent
  rationale: Cette formulation naturelle exprime le passage au silence et prépare la proposition finale.
- source_word: ወእምሶቤሃ፡ አፀርኁ
  choice: et, dès lors, ne poussèrent plus de cris
  rationale: 'La forme transmise dans la transcription paraît résulter d’une erreur d’OCR pour une leçon signifiant « ils cessèrent ». Le complément verbal implicite est rendu d’après le contexte immédiat : les brebis cessèrent de crier.'
theological_decisions:
- issue: Identification de la figure divine dans la vision animale
  choice: « le Seigneur des brebis » désigne Dieu dans le symbolisme de la vision
  alternative: « leur seigneur », avec un référent moins explicite
  rationale: Le cadre de l’Apocalypse des animaux présente un souverain divin lié aux brebis. Cette formulation rend la relation possessive sans introduire de terminologie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition des loups et des brebis est conservée pour maintenir le symbolisme de la vision; la syntaxe est légèrement réorganisée pour rester naturelle en français sans résoudre abusivement l’identité du sujet non exprimé de « frappait ».
