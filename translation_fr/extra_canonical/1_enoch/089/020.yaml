  source_fidelity: Le texte rend correctement la relation « le Seigneur des brebis vint vers elles ». Il conserve les loups comme objet des coups, conformément à la séquence éthiopienne et à l’audit anglais révisé, sans attribuer sans preuve le sujet implicite du verbe à un groupe précis. La reprise explicite « les loups poussaient des cris » est fidèle à la répétition du nom. La finale adopte à bon droit la leçon critique « cessèrent », plutôt que la forme manifestement fautive de la transcription OCR qui produirait une contradiction avec le silence des brebis.
