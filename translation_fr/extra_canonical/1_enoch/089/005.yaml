base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: fr
  text: Et toutes les bêtes qui étaient dans cet enclos[a] se rassemblèrent, jusqu’à ce que je les voie sombrer, être englouties et périr dans cette eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « champ » ou « pâturage ». Le même terme désigne ici l’espace qui, dans les versets précédents, est envahi par l’eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ አላህምት
  choice: tout le bétail
  rationale: Le collectif français « bétail » rend naturellement l’ensemble des animaux domestiques tout en préservant l’imagerie animale de la vision.
- source_word: ዐጸድ
  choice: enclos
  rationale: Dans la continuité spatiale des versets précédents, le terme désigne ici l’espace délimité où se trouvent les animaux et que l’eau envahit; « enclos » convient donc mieux en contexte, sans exclure les sens possibles de « champ » ou « pâturage ».
- source_word: ተጋብኡ
  choice: se rassembla
  rationale: La forme exprime le rassemblement du groupe; le singulier s’accorde avec le collectif français « bétail ».
- source_word: እስክነ ርኢክዎሙ
  choice: jusqu’à ce que je le voie
  rationale: Cette formulation conserve la transition temporelle et l’objet explicite du verbe « voir » dans le guèze.
- source_word: ይሠጠሙ
  choice: s’enfoncer
  rationale: Le verbe décrit le mouvement d’enfoncement ou de submersion dans l’eau.
- source_word: ይትወንጡ
  choice: être englouti
  rationale: Le passif restitue l’image violente d’animaux absorbés ou submergés par l’eau.
- source_word: ይትኃጐሉ
  choice: périr
  rationale: « Périr » exprime l’aboutissement funeste de la série verbale sans ajouter une idée d’anéantissement absolu.
- source_word: ማይ
  choice: eau
  rationale: Le singulier du texte source est conservé, ainsi que le démonstratif dans « cette eau ».
theological_decisions:
- issue: Symbolisme animal dans les Visions des songes
  choice: Conserver l’expression concrète « bétail »
  alternative: Identifier directement les animaux à un groupe humain
  rationale: Le passage communique au moyen d’une imagerie animale suivie. La traduction ne doit pas décoder le symbole dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et narratif. La triple progression « s’enfoncer, être englouti et périr » maintient l’intensification du texte guèze. Le collectif « bétail » entraîne les reprises singulières « se rassembla » et « le voie ».
