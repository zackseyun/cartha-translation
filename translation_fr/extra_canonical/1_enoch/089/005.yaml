    issue: « s’enfoncer » pour le premier verbe
    rationale: Le verbe guèze décrit le fait de couler ou de sombrer dans l’eau. « Sombrer » rend plus directement cette image et évite l’idée possible d’un enfoncement dans le sol ou la boue.
  - severity: low
    issue: Reprise singulière du collectif dans « je le voie »
    rationale: Bien que possible avec « bétail », le singulier est moins transparent que le pluriel du texte source (« je les vis ») et alourdit la série verbale. « Toutes les bêtes ... je les vis » est naturel en français et fidèle à la pluralité explicite.
  revised_text: Et toutes les bêtes qui étaient dans cet enclos[a] se rassemblèrent, jusqu’à ce que je les voie sombrer, être englouties et périr dans cette eau.
