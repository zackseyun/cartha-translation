base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: fr
  text: Une brebis qui avait été délivrée des loups s’enfuit et passa chez les ânes sauvages du désert[a]. Puis je vis les brebis se lamenter, crier et supplier leur Seigneur de toutes leurs forces, jusqu’à ce que le Seigneur des brebis descende, à la voix des brebis, de sa haute demeure[b]. Il vint jusqu’à elles et les vit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire plus littéralement par « passa dans les ânes sauvages du désert » ou « passa parmi les ânes sauvages du désert ». La syntaxe est difficile; elle semble décrire l’entrée de la brebis dans le territoire ou au sein d’un autre groupe animal de la vision.
    reason: lexical_alternative
  - marker: b
    text: Ou « de sa haute salle » ou « de son haut palais ». Le terme guèze désigne une salle, une chambre, un palais ou, plus largement, une demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ፡ ዘድኅነ፡ እምነ፡ አዝእብት
  choice: Une brebis qui avait été délivrée des loups
  rationale: Le nom, le relatif et les verbes sont au singulier, en contraste avec les brebis au pluriel dans la suite. « Délivrée » exprime un sauvetage déjà accompli sans spiritualiser l’image.
- source_word: ነፈፀ
  choice: s’enfuit
  rationale: Le verbe décrit un départ précipité hors du danger; « s’enfuit » est naturel et conserve l’urgence.
- source_word: ወኀለፈ፡ ውስተ፡ አእዱገ፡ ገዳም
  choice: et passa au milieu des ânes sauvages du désert
  rationale: La construction indique un mouvement vers ou parmi un autre groupe animal. « Au milieu de » rend ce sens en français naturel, tandis que la note conserve la difficulté syntaxique.
- source_word: የአወይዉ፡ ወይጸርኁ፡ ወይስእልዎ፡ ለእግዚኦሙ
  choice: se lamenter, crier et supplier leur Seigneur
  rationale: La série verbale exprime une détresse audible et une requête pressante. « Supplier » convient mieux ici qu’un simple « demander ».
- source_word: በኵሉ፡ ኃይሎሙ
  choice: de toutes leurs forces
  rationale: Cette locution française idiomatique préserve l’intensité et la totalité de leur effort.
- source_word: እግዚአ፡ አባግዕ
  choice: le Seigneur des brebis
  rationale: Ce titre récurrent maintient l’imagerie propre à l’Apocalypse des animaux et la souveraineté divine.
- source_word: ወረደ
  choice: descende
  rationale: « Descendre » conserve explicitement le mouvement vertical de l’intervention céleste.
- source_word: ኀበ፡ ቃሎሙ፡ ለአባግዕ
  choice: à la voix des brebis
  rationale: La formulation resserrée est conservée sans préciser davantage si la voix constitue la cause ou l’occasion de la descente.
- source_word: እምጽርኁ፡ ልዑል
  choice: de sa demeure élevée
  rationale: ጽርሕ désigne une salle, une chambre, un palais ou une demeure, avec suffixe masculin singulier; ልዑል la qualifie d’élevée. Cette lecture évite la confusion avec le mot signifiant « cri ».
- source_word: ወበጽኀ፡ ኀቤሆሙ፡ ወርእዮሙ
  choice: Il vint jusqu’à elles et les vit
  rationale: La traduction reproduit simplement les deux actions successives et accorde les pronoms avec « brebis » en français.
theological_decisions:
- issue: Titre divin dans l’Apocalypse des animaux
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: « Seigneur » préserve la portée divine du titre tout en maintenant intacte l’image pastorale du texte.
- issue: Relation entre la voix des brebis et la descente divine
  choice: descende, à la voix des brebis
  alternative: descende en réponse à la voix des brebis
  rationale: La syntaxe guèze est concise. La formulation retenue préserve l’ambiguïté entre circonstance et réponse causale, sans expliciter une relation que le texte ne développe pas.
- issue: Origine céleste du Seigneur des brebis
  choice: de sa demeure élevée
  alternative: de son palais élevé
  rationale: « Demeure » conserve la référence spatiale céleste sans imposer une architecture trop précise; elle corrige aussi la lecture erronée « grand cri ».
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité, sans supprimer les enchaînements de la vision. Le singulier initial et le pluriel ultérieur sont strictement distingués.
