revisions:
- from: Une brebis qui avait été délivrée des loups s’enfuit et passa au milieu des ânes sauvages du désert[a]. Puis je vis les brebis se lamenter, crier et supplier leur Seigneur de toutes leurs forces, jusqu’à ce que le Seigneur des brebis descende, à la voix des brebis, de sa demeure élevée[b]. Il vint jusqu’à elles et les vit.
  to: Une brebis qui avait été délivrée des loups s’enfuit et passa chez les ânes sauvages du désert[a]. Puis je vis les brebis se lamenter, crier et supplier leur Seigneur de toutes leurs forces, jusqu’à ce que le Seigneur des brebis descende, à la voix des brebis, de sa haute demeure[b]. Il vint jusqu’à elles et les vit.
  rationale: La révision ajuste seulement deux formulations françaises. « Chez les ânes sauvages » évite de préciser indûment que la brebis traverse le centre du groupe tout en rendant la destination collective suggérée par le guèze; la note préserve les rendus plus littéraux et l’incertitude syntaxique. « Sa haute demeure » améliore l’idiomaticité et maintient la lecture correcte du lieu élevé d’où descend le Seigneur des brebis.
