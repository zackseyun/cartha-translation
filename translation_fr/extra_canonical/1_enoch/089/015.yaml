revisions:
- from: Alors les loups commencèrent à les terrifier et à les accabler[a], jusqu’à exterminer leurs petits et à les jeter dans un cours d’eau abondant[b]. Ces brebis se mirent à crier à cause de leurs petits et à se lamenter devant leur Seigneur[c].
  to: Alors, les loups commencèrent à les terrifier et à les opprimer[a], jusqu’à ce qu’ils aient détruit leurs petits et les aient jetés dans un cours d’eau aux eaux abondantes[b]. Ces brebis se mirent à crier à cause de leurs petits et à se lamenter devant leur Seigneur[c].
  rationale: La révision remplace « exterminer » par « détruire », terme plus fidèle et moins interprétatif, et « accabler » par « opprimer », qui rend plus explicitement l’hostilité persistante. Elle précise que l’abondance concerne les eaux du cours d’eau et conserve les alternatives textuelles dans les notes. Les ancres de notes sont placées auprès des expressions auxquelles elles se rapportent.
