review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement la scène allégorique, le caractère causatif de « terrifier », la destruction des petits, leur projection dans un cours d’eau abondamment alimenté, ainsi que le cri et la lamentation des brebis devant leur Seigneur. « Exterminer » va toutefois au-delà de la destruction exprimée par le texte en introduisant une nuance de mise à mort systématique.
  naturalness: Le français est globalement fluide et d’un registre narratif approprié. « Un cours d’eau aux eaux abondantes » est plus idiomatique et plus exact que « un cours d’eau abondant », qui qualifie plus spontanément le cours d’eau lui-même que la quantité d’eau. La subordonnée en « jusqu’à ce qu’ils aient… » clarifie aussi l’aboutissement des actions des loups.
  terminology: « Loups », « brebis », « petits » et « Seigneur » sont appropriés. « Opprimer » restitue plus directement l’action hostile prolongée que « accabler », sans imposer l’alternative plus spécifique « attaquer ». La note maintient avec justesse la possibilité lexicale de « maître » sans la présenter comme lecture retenue.
  issues:
  - severity: medium
    issue: « Exterminer leurs petits » est excessivement spécifique.
    rationale: Le verbe français suggère volontiers une élimination systématique et peut charger le passage d’une connotation absente de l’expression source, qui indique la destruction ou la mise à mort des petits. « Détruire » conserve la force sans ajouter cette nuance.
  - severity: low
    issue: « Un cours d’eau abondant » est sémantiquement moins précis.
    rationale: La source qualifie l’eau comme abondante. « Un cours d’eau aux eaux abondantes » rend naturellement en français cette abondance sans décider s’il s’agit d’une rivière ou d’un torrent.
  - severity: low
    issue: « Accabler » atténue l’action hostile exercée contre les brebis.
    rationale: Le terme peut évoquer une détresse ou une surcharge sans agent violent explicite. « Opprimer » exprime plus clairement la pression hostile prolongée tout en laissant ouverte l’alternative « attaquer » signalée en note.
  revised_text: Alors, les loups commencèrent à les terrifier et à les opprimer[a], jusqu’à ce qu’ils aient détruit leurs petits et les aient jetés dans un cours d’eau aux eaux abondantes[b]. Ces brebis se mirent à crier à cause de leurs petits et à se lamenter devant leur Seigneur[c].
