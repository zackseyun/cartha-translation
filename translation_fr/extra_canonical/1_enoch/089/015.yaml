base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: fr
  text: Alors, les loups commencèrent à les terrifier et à les opprimer[a], jusqu’à ce qu’ils aient détruit leurs petits et les aient jetés dans un cours d’eau aux eaux abondantes[b]. Ces brebis se mirent à crier à cause de leurs petits et à se lamenter devant leur Seigneur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les attaquer » ; le verbe guèze peut désigner une action hostile menée avec force.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « une rivière aux eaux abondantes » ou « un torrent aux eaux abondantes ».
    reason: lexical_alternative
  - marker: c
    text: « Leur Seigneur » peut aussi se comprendre comme « leur maître » ; le contexte de l’allégorie favorise toutefois une référence divine.
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: les loups
  rationale: Le nom pluriel désigne directement les loups dans l’imagerie de l’allégorie animale, sans expliciter leurs référents humains.
- source_word: ይፈርህዎሙ
  choice: à les terrifier
  rationale: 'La forme verbale est comprise au sens causatif : les loups inspirent la peur aux brebis. « Terrifier » conserve la force de la scène.'
- source_word: አጠቅዎሙ
  choice: à les accabler
  rationale: Le verbe évoque une action hostile et contraignante, pouvant aussi se comprendre comme une attaque. « Accabler » rend la violence prolongée sans la limiter à un seul assaut.
- source_word: እስከ ያኅልቅ
  choice: jusqu’à exterminer
  rationale: La tournure marque l’aboutissement destructeur de la violence. « Exterminer » exprime ici la destruction totale des petits.
- source_word: ደቂቆሙ
  choice: leurs petits
  rationale: « Petits » préserve à la fois le lien familial et l’imagerie animale des brebis, sans humaniser explicitement l’allégorie.
- source_word: ወገደፉ
  choice: à les jeter
  rationale: Le complément indiquant un cours d’eau appelle un verbe de mouvement violent. « Jeter » est précis et naturel en français actuel.
- source_word: በውኂዘ ማይ ብዙኅ
  choice: dans un cours d’eau abondant
  rationale: L’expression désigne un courant ou cours d’eau contenant beaucoup d’eau. Cette formulation reste générale et évite de trancher entre rivière et torrent.
- source_word: እልኩ አባግዕ
  choice: ces brebis
  rationale: Le démonstratif est conservé pour reprendre le groupe déjà présent dans la vision.
- source_word: ይጸርኁ
  choice: à crier
  rationale: Le verbe exprime un cri intense de détresse. « Crier » restitue sa force émotionnelle sans surcharge.
- source_word: በእንተ ደቂቆሙ
  choice: à cause de leurs petits
  rationale: 'La préposition indique naturellement ici la cause de leurs cris : le sort de leurs petits.'
- source_word: ይስክዩ
  choice: à se lamenter
  rationale: Dans ce contexte de deuil et d’appel, « se lamenter » rend mieux la plainte douloureuse qu’une simple réclamation.
- source_word: ኀበ እግዚኦሙ
  choice: devant leur Seigneur
  rationale: « Devant » conserve la relation exprimée par la préposition, tandis que « Seigneur » rend la portée divine du titre dans le contexte visionnaire.
theological_decisions:
- issue: Faut-il rendre እግዚኦሙ par « Seigneur » ou par « maître » dans l’allégorie des brebis ?
  choice: leur Seigneur
  alternative: leur maître
  rationale: Le cadre animal permet lexicalement « maître », mais, dans la vision, la plainte des brebis s’adresse au souverain divin du troupeau. La majuscule indique cette référence sans sortir du langage allégorique.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’imagerie animale et la répétition de « leurs petits » entre les deux phrases, tout en évitant d’expliciter les référents historiques de l’allégorie.
