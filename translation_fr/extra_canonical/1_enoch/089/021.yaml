base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: fr
  text: Et je regardai les brebis jusqu’à ce qu’elles sortent d’au milieu des loups[a]. Les yeux des loups furent aveuglés[b], et ces loups sortirent en suivant les brebis de toutes leurs forces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’elles sortent des loups » ; l’expression peut désigner une sortie hors de leur milieu ou de leur emprise.'
    reason: clarification
  - marker: b
    text: 'Autre traduction possible : « les yeux des loups s’obscurcirent ». Une traduction antérieure comprenait plutôt la suite ainsi : « les loups aveuglèrent leurs yeux, puis ils sortirent à la suite de ces brebis » ; la grammaire guèze favorise toutefois la tournure passive ou intransitive retenue dans le texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: Et je regardai les brebis
  rationale: Le verbe ouvre le récit de vision à la première personne. « Je regardai » convient ici à une observation qui se prolonge jusqu’à l’événement suivant, tout en restant naturel dans une narration visionnaire digne.
- source_word: ለአባግዕ
  choice: les brebis
  rationale: Le terme désigne les brebis, image symbolique constante du récit. L’article défini assure en français la reprise d’un groupe déjà connu sans ajouter un démonstratif absent à cet endroit.
- source_word: እስከ፡ ወፁኡ፡ እምአዝእብት
  choice: jusqu’à ce qu’elles sortent d’au milieu des loups
  rationale: Cette formulation rend le mouvement hors de la sphère ou du milieu occupé par les loups. « D’au milieu de » est plus idiomatique et spatialement clair que « hors des loups ».
- source_word: ተጸለሉ፡ አዕይንቲሆሙ
  choice: Les yeux des loups furent aveuglés
  rationale: 'La construction est passive ou intransitive : les yeux deviennent obscurcis ou aveuglés. La traduction évite donc d’attribuer aux loups l’action d’aveugler quelqu’un d’autre.'
- source_word: ወወፁኡ፡ እንዘ፡ ይትልውዎሙ
  choice: sortirent en suivant les brebis
  rationale: Le participe exprime une action concomitante. « Suivre » rend directement le verbe sans imposer davantage que le texte l’idée de poursuite hostile, même si le contexte peut la suggérer.
- source_word: ዝኩ፡ አዝእብት
  choice: ces loups
  rationale: Le démonstratif est conservé et identifie explicitement les loups comme sujet de la dernière proposition.
- source_word: በኵሉ፡ ኃይሎሙ
  choice: de toutes leurs forces
  rationale: Expression française naturelle qui conserve l’idée de mobilisation totale de leur puissance.
theological_decisions:
- issue: Faut-il conserver l’image concrète de l’aveuglement ou l’expliquer comme tromperie spirituelle ou politique ?
  choice: Conserver « Les yeux des loups furent aveuglés »
  alternative: « Les loups furent trompés » ou « leurs yeux s’obscurcirent »
  rationale: L’apocalypse animale exprime ses réalités par des images concrètes. Garder l’aveuglement préserve la force et l’ouverture symboliques du texte sans imposer une interprétation doctrinale.
- issue: Identifier le sujet qui sort en suivant les brebis
  choice: Faire de « ces loups » le sujet explicite
  alternative: Laisser la succession des mouvements plus indéterminée ou rattacher la sortie aux brebis
  rationale: Le démonstratif et le nom explicite ዝኩ አዝእብት soutiennent grammaticalement l’identification des loups comme sujet de la dernière action, bien que la séquence compacte justifie une note sur la difficulté de lecture.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif visionnaire. La répétition de « loups » et de « brebis » est volontaire afin de préserver les référents explicites et l’imagerie animale du passage.
