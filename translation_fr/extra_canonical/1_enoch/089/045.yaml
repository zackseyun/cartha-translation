base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: fr
  text: Et le Seigneur des brebis envoya un mouton à un autre mouton, et il l’éleva afin qu’il devienne un bélier et qu’il conduise les brebis à la place de ce bélier qui avait abandonné sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son honneur » ou « sa splendeur » ; le terme peut désigner ici le rang ou la dignité du bélier.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ፡ ለአባግዕ
  choice: le Seigneur des brebis
  rationale: Conserve le titre élevé et précise le groupe gouverné, conformément à l’imagerie animale suivie du passage.
- source_word: በግዕ
  choice: une brebis
  rationale: Le terme désigne ici un mouton sans préciser l’âge. « Brebis » est retenu au sens générique dans l’allégorie et évite d’introduire l’idée non exprimée d’un agneau.
- source_word: ኀበ፡ ካልእ፡ በግዕ
  choice: vers une autre brebis
  rationale: Rend le mouvement vers un second animal individuel tout en préservant la répétition du même terme.
- source_word: ወአንሥአ
  choice: et il l’éleva
  rationale: Préserve à la fois l’image d’élévation et l’idée de promotion, sans réduire le verbe à une nomination administrative.
- source_word: ከመ፡ ይኩን፡ ሐርጌ
  choice: afin qu’elle devienne un bélier
  rationale: Exprime le changement de statut au moyen de l’image animale concrète du texte.
- source_word: ይመርሖሙ፡ ለአባግዕ
  choice: et conduise les brebis
  rationale: « Conduire » rend naturellement l’action de guider et conserve la portée pastorale et politique de l’allégorie.
- source_word: ህየንተ፡ ዝኩ፡ ሐርጌ
  choice: à la place de ce bélier
  rationale: Marque clairement la succession ou le remplacement sans expliciter davantage l’identité symbolique des personnages.
- source_word: ዘሐደገ፡ ስብሐቲሁ
  choice: qui avait abandonné sa gloire
  rationale: « Gloire » préserve la force symbolique du terme, tandis qu’« abandonné » rend l’idée d’un délaissement sans en préciser indûment la cause.
theological_decisions:
- issue: Nature de la figure élevée
  choice: Conserver l’image d’une brebis qui devient un bélier.
  alternative: Paraphraser comme la nomination d’un chef.
  rationale: Le discours visionnaire repose sur un code animalier suivi. Le maintenir permet au lecteur d’interpréter lui-même la succession sans aplatissement doctrinal.
- issue: Sens de « sa gloire »
  choice: Traduire littéralement par « sa gloire » et signaler d’autres nuances en note.
  alternative: Traduire directement par « son honneur » ou « sa splendeur ».
  rationale: Le terme peut évoquer la gloire, l’honneur, la dignité ou l’éclat. Le texte principal conserve sa résonance large, et la note rend l’ambiguïté lexicale visible.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe narrative demeure proche du guèze, tout en évitant les calques lourds. « Brebis » est employé dans le cadre de l’allégorie animale, sans ajouter la notion d’âge qu’impliquerait « agneau ».
