    rationale: Le terme guèze est un générique pour l’animal ovin et ne signifie pas spécifiquement une femelle. En français, « brebis » désigne proprement la femelle, tandis que « mouton » peut rendre le générique sans introduire cette précision ; la correction évite aussi l’incongruité littérale d’une brebis devenant un bélier.
