    issue: Antécédent trompeur de « sa main »
    rationale: En français, le possessif dans « il prit le livre de sa main » est normalement coréférentiel au sujet et se comprend comme « de sa propre main ». Le géʿez ne réitère pas l’antécédent du possessif ; son référent demeure incertain. Il est préférable de conserver cette indétermination sans créer le faux sens d’une prise depuis sa propre main.
