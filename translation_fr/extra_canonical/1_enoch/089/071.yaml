lexical_decisions:
- source_word: መጽሐፍ
  choice: livre
  rationale: Terme courant pour un écrit ou un document; « livre » reste naturel sans préciser indûment sa forme matérielle.
- source_word: ተነበ
  choice: fut lu
  rationale: 'La forme transmise est comprise comme correspondant à ተነበበ, « fut lu ». La reprise ultérieure de la lecture peut être intentionnelle: le livre est d’abord lu devant le Seigneur, puis celui-ci le prend et le lit.'
- source_word: በቅድመ
  choice: devant
  rationale: Exprime la présence immédiate et convient à la scène solennelle.
- source_word: እግዚአ አባግዕ
  choice: le Seigneur des brebis
  rationale: Conserve le titre élevé et l’image animale propre à la vision.
- source_word: ነሥአ
  choice: prit
  rationale: Rend directement l’action de prendre le livre en main.
- source_word: እምእዱ
  choice: de sa main
  rationale: Traduction concrète qui maintient l’ambiguïté du pronom quant à la personne qui tenait le livre.
- source_word: አንበበ
  choice: le lut
  rationale: Sens ordinaire du verbe dans le contexte d’un document écrit.
- source_word: ኀተማ
  choice: le scella
  rationale: Préserve l’image juridique ou administrative d’un document muni d’un sceau.
- source_word: አንበረ
  choice: le déposa
  rationale: Rend naturellement l’action finale de placer ou poser le livre.
theological_decisions:
- issue: Titre እግዚአ አባግዕ dans l’Apocalypse des animaux
  choice: le Seigneur des brebis
  alternative: le maître des brebis
  rationale: « Seigneur » conserve l’autorité et la solennité du personnage divin sans effacer la métaphore des brebis.
- issue: Répétition de l’acte de lire
  choice: Conserver les deux lectures
  alternative: Traduire le premier verbe par « fut ouvert » afin d’éviter la répétition
  rationale: La compréhension philologique retenue du premier verbe est « fut lu ». La répétition décrit vraisemblablement deux moments distincts et ne doit pas être harmonisée.
translation_notes:
  register: Français international moderne, sobre et solennel. La coordination hébraïsante ou sémitique est légèrement fluidifiée par « Puis », sans modifier la succession des actions.
