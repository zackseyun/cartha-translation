  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: fr
  text: Et le livre fut lu devant le Seigneur des brebis. Puis il prit le livre de la main de celui qui le tenait[a], le lut, le scella et le déposa.
  philosophy: optimal-equivalence
  footnotes:
