base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: fr
  text: Là, je vis sept étoiles du ciel[a], liées ensemble dans ce lieu[b], pareilles à de grandes montagnes, et brûlant de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, ces étoiles peuvent symboliser des êtres célestes soumis au jugement, mais le texte les appelle bien « étoiles ».
    reason: cross_reference
  - marker: b
    text: Le guèze emploie ici une expression spatiale difficile, qui peut se lire littéralement « sur lui ». Le contexte soutient le sens « dans ce lieu », le pronom renvoyant vraisemblablement au lieu décrit précédemment.
    reason: textual_variant
lexical_decisions:
- source_word: ርኢኩ
  choice: je vis
  rationale: Formule simple et naturelle du témoignage visionnaire à la première personne.
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: sept étoiles du ciel
  rationale: Conserve l’image cosmique et la construction du guèze sans identifier explicitement les étoiles à des anges.
- source_word: እሱራነ ... ኅቡረ
  choice: liées ensemble
  rationale: Rend እሱራነ par l’état de contrainte et comprend ኅቡረ comme un adverbe collectif qui le modifie, conformément à la révision la plus récente.
- source_word: በላዕሌሁ
  choice: dans ce lieu
  rationale: Dans ce contexte, le pronom renvoie au lieu chaotique décrit; cette formulation évite l’image trompeuse d’étoiles suspendues au-dessus de lui tout en rendant explicite en français un référent implicite.
- source_word: ከመ አድባር ዐበይት
  choice: pareilles à de grandes montagnes
  rationale: Préserve la comparaison apocalyptique frappante et l’accord avec les étoiles.
- source_word: ወበእሳት እንዘ ይነዱ
  choice: et brûlant dans le feu
  rationale: Maintient la construction participiale et l’image du feu, avec une syntaxe française claire.
theological_decisions:
- issue: Identification éventuelle des sept étoiles à des êtres angéliques jugés
  choice: Conserver « sept étoiles du ciel » dans le texte principal
  alternative: Traduire « sept anges du ciel » ou « sept êtres célestes »
  rationale: Même si les étoiles peuvent symboliser des êtres célestes dans la littérature hénochique, le texte dit ici « étoiles »; l’identification ne doit donc pas être imposée dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère visionnaire et la comparaison saisissante du texte, tout en évitant un calque spatial ambigu.
