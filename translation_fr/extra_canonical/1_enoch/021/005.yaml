base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: fr
  text: 'Et Ouriel, l’un des saints anges[a] qui était avec moi et me guidait, me dit : « Hénoch, au sujet de qui t’interroges-tu, et au sujet de qui t’informes-tu avec tant d’empressement[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un parmi les saints anges ».'
    reason: Précision sur la construction partitive du guèze.
  - marker: b
    text: 'Le dernier verbe est difficile à préciser. Il peut évoquer l’empressement, le zèle, une vive curiosité ou l’anxiété. On peut aussi comprendre : « avec un vif désir de savoir ».'
    reason: Conserver l’incertitude lexicale tout en reflétant la nuance d’ardeur curieuse attestée dans ce contexte.
lexical_decisions:
- source_word: ኡርኤል
  choice: Ouriel
  rationale: Forme française traditionnelle et transparente du nom propre, conforme à l’usage biblique francophone.
- source_word: ፩እምቅዱሳን መላእክት
  choice: l’un des saints anges
  rationale: Rend explicitement l’appartenance d’Ouriel au groupe des anges saints et conserve la portée apocalyptique de l’expression.
- source_word: ዘምስሌየ
  choice: qui m’accompagnait
  rationale: Exprime naturellement en français la présence continue d’Ouriel auprès d’Hénoch dans la vision.
- source_word: ዘይመርሐኒ
  choice: et me guidait
  rationale: Le verbe désigne l’action continue de conduire ou guider Hénoch.
- source_word: በእንተ መኑ ትስእል
  choice: au sujet de qui poses-tu ces questions ?
  rationale: Rend la demande portant sur une personne dans un français naturel; le pluriel « ces questions » explicite idiomatiquement l’acte de questionner sans changer son objet.
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: Sur qui cherches-tu à te renseigner
  rationale: Préserve la reprise du complément interrogatif et distingue le second verbe du simple fait de poser une question.
- source_word: ወትጽህቅ
  choice: avec tant d’empressement
  rationale: Dans ce contexte d’enquête, le verbe semble exprimer le zèle, l’ardeur ou la vive curiosité plutôt qu’une recherche distincte; cette formulation conserve cette nuance sans la réduire à l’inquiétude.
theological_decisions:
- issue: Désignation des anges comme saints
  choice: saints anges
  alternative: anges sacrés
  rationale: « Saints anges » conserve le poids théologique de la catégorie céleste et correspond à l’usage biblique français, sans introduire de précision confessionnelle.
- issue: Nuance de l’attitude d’Hénoch
  choice: empressement à se renseigner
  alternative: inquiétude ou recherche
  rationale: Le contexte porte sur son désir intense de comprendre la vision. La formulation retient néanmoins en note l’incertitude lexicale et n’en fait pas une disposition doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition interrogative du guèze est conservée sous une forme idiomatique; l’imparfait marque l’accompagnement et la direction continus dans la scène visionnaire.
