base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/001.yaml
  text: And I went on until I came to a place where nothing is made[a].
translation:
  language: fr
  text: Et je poursuivis mon chemin jusqu’à un lieu où rien n’est façonné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « un lieu où rien n’avait été fait » ou « où rien n’existait ». Le guèze est concis et souligne l’absence totale de choses formées en ce lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: je poursuivis mon chemin
  rationale: Le verbe exprime la progression continue d’Hénoch dans son voyage visionnaire. Cette tournure est naturelle en français et conserve le mouvement du récit.
- source_word: እስከነ
  choice: jusqu’à
  rationale: La forme marque le terme atteint au cours du déplacement. « Jusqu’à » rend sobrement cette idée d’arrivée.
- source_word: ኀበ
  choice: un lieu
  rationale: Le terme introduit une destination. L’ajout de « lieu » explicite en français la valeur locative que le contexte porte implicitement.
- source_word: አልቦቱ
  choice: où rien n’est
  rationale: Cette expression existentielle négative caractérise le lieu par une absence radicale. Le présent préserve l’ambiguïté temporelle de la formulation concise.
- source_word: ዘይትገበር
  choice: façonné
  rationale: La forme passive du verbe « faire » peut désigner ce qui est fait, produit ou formé. « Façonné » évoque des réalités formées sans imposer la nuance cosmologique plus forte de « créé ».
theological_decisions:
- issue: Nature du lieu atteint dans la vision d’Hénoch
  choice: un lieu où rien n’est façonné
  alternative: un lieu où rien n’avait été fait ; un lieu où rien n’existait
  rationale: Le guèze souligne l’absence de choses faites ou formées sans affirmer explicitement une inexistence métaphysique absolue. La traduction conserve ainsi l’étrangeté apocalyptique et la tension du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif scripturaire sans être archaïque ; « façonné » préserve l’image de choses formées et évite de préciser indûment « créé ».
