base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: fr
  text: 'De là, je me rendis dans un autre lieu[a], plus effrayant que celui-ci, et je vis une œuvre terrifiante : il y avait là un grand feu qui brûlait et flamboyait, et le lieu était fendu jusqu’à l’abîme, rempli de grandes colonnes de feu qui descendaient[c] ; je ne pus en discerner ni la mesure ni la grandeur[b], et je ne pus le regarder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition décrivant le lieu comme fendu vers le bas est difficile en guèze. « Fendu jusqu’à l’abîme » rend prudemment l’image d’une fissure ou d’un gouffre s’étendant à une profondeur extrême.
    reason: textual_variant
  - marker: b
    text: 'Ou : « je ne pus en percevoir les dimensions ni l’immensité ». L’idée principale est qu’Énoch ne peut saisir les proportions de ce qu’il voit.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tandis que de grandes colonnes de feu descendaient ».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ፡ ካልአ፡ መካነ
  choice: De là, je me rendis dans un autre lieu
  rationale: Rend simplement le déplacement dans l’itinéraire visionnaire, dans un français narratif naturel et digne.
- source_word: እምዝ፡ ዘይገርም
  choice: plus effrayant que celui-ci
  rationale: Conserve la comparaison avec la scène précédente et la valeur de terreur propre au contexte.
- source_word: ወርኢኩ፡ ግብረ፡ ግሩመ
  choice: et je vis une œuvre terrifiante
  rationale: Maintient le nom concret ግብር, « œuvre », plutôt que de l’aplatir en « chose », tout en donnant à ግሩም sa force inquiétante.
- source_word: እሳት፡ ዐቢይ፡ በህየ፡ ዘይነድድ፡ ወያንበለብል
  choice: il y avait là un grand feu qui brûlait et flamboyait
  rationale: Préserve le double mouvement verbal et l’intensité de l’image sans ajouter d’interprétation.
- source_word: ወመምተርተ፡ ቦቱ፡ መካኑ፡ እስከ፡ ቀላይ
  choice: et le lieu était fendu jusqu’à l’abîme
  rationale: Rendu prudent d’une proposition difficile, comprise comme une fissure s’étendant vers une profondeur extrême.
- source_word: ፍጹም፡ አዕማደ፡ እሳት፡ ዐበይተ፡ ዘይወርዶሙ
  choice: rempli de grandes colonnes de feu qui descendaient
  rationale: « Rempli » conserve la portée de ፍጹም sur les colonnes, et « descendaient » maintient leur mouvement vertical.
- source_word: ወኢእምጣኖ፡ ወኢዕበዮ፡ አክሀልኩ፡ ነጽሮ
  choice: je ne pus en discerner ni la mesure ni la grandeur
  rationale: Conserve les deux noms coordonnés et exprime l’incapacité d’Énoch à saisir les dimensions de la vision.
- source_word: ወስእነኩ፡ [ነጽሮ፡] ዐይኖ
  choice: et je ne pus le regarder
  rationale: La formulation simple respecte l’instabilité signalée par le mot répété entre crochets et garde l’accent sur l’incapacité visuelle.
theological_decisions:
- issue: Nature du lieu visionnaire
  choice: Décrire le feu, l’abîme et les colonnes sans nommer explicitement l’enfer ni le châtiment final.
  alternative: Identifier le lieu comme l’enfer, le monde souterrain ou une prison cosmique.
  rationale: Le verset ne donne aucun de ces noms. La traduction préserve donc l’imagerie et sa tension théologique sans l’aligner sur une doctrine ultérieure.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le passé simple convient au récit visionnaire. « Œuvre terrifiante » conserve la concrétude du guèze malgré son caractère moins idiomatique, et « colonnes » restitue clairement l’image apocalyptique.
