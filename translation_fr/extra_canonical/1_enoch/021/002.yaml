  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: fr
  text: 'Et là, je vis une œuvre terrifiante : je ne vis ni les cieux au-dessus, ni la terre solidement établie, mais un lieu informe et terrible.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ግሩመ
  choice: une œuvre terrifiante
  rationale: ግብር désigne une œuvre ou un ouvrage, et ግሩም qualifie ici ce qui inspire l’effroi. Cette formulation conserve le substantif du texte plutôt que de le réduire à « chose ».
- source_word: ሱርርተ
  choice: solidement établie
  rationale: Le terme évoque une terre affermie ou fondée; cette expression française rend l’idée sans imposer une image plus précise que la source.
- source_word: መካነ፡ ዘአኮ፡ ድልወ
  choice: un lieu informe
  rationale: La construction décrit un lieu qui n’est pas arrangé, préparé ou ordonné. « Informe » exprime cet état tout en préservant une certaine ouverture sémantique.
- source_word: ግሩምም
  choice: terrible
  rationale: Le second emploi du terme souligne le caractère redoutable du lieu; « terrible » convient au registre visionnaire et solennel.
