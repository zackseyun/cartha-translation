base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: fr
  text: 'À ce moment-là, je dis[a] : « Pour quel péché ont-ils été liés[b], et pour quelle raison ont-ils été jetés ici[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je demandai », puisque les paroles qui suivent constituent une question directe.
    reason: lexical_alternative
  - marker: b
    text: Ou « emprisonnés » ; le verbe évoque plus concrètement le fait d’être attaché ou entravé.
    reason: lexical_alternative
  - marker: c
    text: Le dernier verbe peut aussi signifier « laissés ici » ou « abandonnés ici » ; le contexte de jugement favorise « jetés ici ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ ጊዜ
  choice: À ce moment-là
  rationale: Cette expression temporelle ouvre directement le verset, sans conjonction. La traduction conserve ce passage immédiat de la vision à la réaction d’Hénoch.
- source_word: እቤ
  choice: je dis
  rationale: Le verbe introduit d’abord une parole. « Je dis » reste proche du guèze, tandis que la ponctuation rend clairement la valeur interrogative de la phrase.
- source_word: በእንተ አይ ኃጢአት
  choice: Pour quel péché
  rationale: La tournure demande la cause de la peine. Cette formulation française est concise et conserve la mention concrète du péché.
- source_word: ተአስሩ
  choice: ont-ils été liés
  rationale: Le passif évoque le fait d’être attaché ou entravé. « Liés » préserve l’image concrète de la captivité sans la réduire au terme plus général « emprisonnés ».
- source_word: ወበእንተ ምንት
  choice: et pour quelle raison
  rationale: La formulation maintient le parallélisme entre les deux questions causales du texte source.
- source_word: ዝየ
  choice: ici
  rationale: L’adverbe désigne le lieu même qu’Hénoch contemple et garde l’immédiateté de la scène visionnaire.
- source_word: ተገደፉ
  choice: ont-ils été jetés ici
  rationale: Le verbe peut exprimer l’idée de jeter, de déposer ou de laisser. Dans cette scène de jugement, « jetés ici » transmet la force punitive sans exclure en note l’idée d’abandon.
theological_decisions:
- issue: Nature de la peine décrite
  choice: Des êtres sont concrètement liés puis jetés dans un lieu de détention.
  alternative: Ils ont été emprisonnés puis laissés ou abandonnés en ce lieu.
  rationale: Le langage visionnaire présente des actes visibles de jugement. La traduction conserve ces images sans les remplacer par des notions abstraites de culpabilité ou d’exclusion.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « je dis » convient au récit visionnaire écrit. L’absence de conjonction au début est conservée, de même que le parallélisme des deux interrogations.
