base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: fr
  text: Ce sont, parmi les étoiles, celles qui ont transgressé le commandement du Seigneur[a], et elles sont enchaînées ici jusqu’à ce que dix mille ans soient accomplis[b], le nombre des jours de leurs péchés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celles qui viennent des étoiles ». La préposition ge’ez peut exprimer aussi bien la provenance que l’appartenance à un groupe.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « dix mille ans » peut aussi désigner une immense période de châtiment fixée ; la traduction conserve le nombre donné par le texte ge’ez.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « le nombre des jours de leurs péchés ». La relation exacte entre ce nombre et les jours de leurs péchés n’est pas explicitée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: Ce sont ceux
  rationale: Le démonstratif suivi de la copule introduit l’identification. « Ce sont ceux » permet d’enchaîner naturellement avec la relative partitive.
- source_word: እምነ ከዋክብት
  choice: des étoiles
  rationale: Dans « ceux des étoiles », la préposition française exprime naturellement l’appartenance à un groupe, tout en laissant en note la nuance possible de provenance portée par le ge’ez እምነ.
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: qui ont transgressé le commandement du Seigneur
  rationale: Le verbe évoque littéralement le fait de passer au-delà et prend ici un sens juridico-moral. « Transgresser » conserve ce ton sans expliciter davantage la nature des étoiles.
- source_word: ወተአስሩ በዝየ
  choice: et ils sont enchaînés ici
  rationale: Le passif décrit leur état actuel de captivité. « Enchaînés » conserve l’image concrète du lien, plus directement que « emprisonnés ».
- source_word: እስከ ሶበ ይትፌጸም ትእልፊተ ዓም
  choice: jusqu’à ce que s’accomplissent dix mille ans
  rationale: La tournure marque le terme fixé de leur captivité. « S’accomplissent » garde la notion d’achèvement, et l’absence d’article devant « dix mille ans » respecte l’indétermination formelle de l’expression ge’ez.
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: le nombre des jours de leurs péchés
  rationale: La formulation littérale préserve l’image apocalyptique d’une durée comptée en fonction des péchés, sans la réduire à une paraphrase sur le châtiment.
theological_decisions:
- issue: Identité des « étoiles »
  choice: Maintenir « étoiles » comme désignation visionnaire de ces êtres soumis au jugement.
  alternative: Traduire explicitement par « anges » ou comprendre des astres littéraux personnifiés.
  rationale: Le contexte peut associer les étoiles à des êtres célestes, mais le texte emploie l’image des étoiles. La traduction ne résout donc pas le symbole à la place du lecteur.
- issue: Valeur de la durée de dix mille ans
  choice: Conserver le nombre explicite comme une durée punitive déterminée.
  alternative: Comprendre l’expression comme une manière idiomatique de désigner une période immense et indéfinie.
  rationale: Le témoin ge’ez donne une durée chiffrée. Le texte principal la rend littéralement, tandis que la note signale sa portée possible sans trancher.
- issue: Rapport entre la durée et « le nombre des jours de leurs péchés »
  choice: Conserver l’apposition peu explicitée du texte source.
  alternative: 'Paraphraser : « selon le nombre des jours où ils ont péché » ou « durée mesurée d’après leurs péchés ».'
  rationale: La syntaxe laisse ouverte la manière exacte dont la dernière expression explique la durée. Une formulation appositive préserve cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste légèrement solennelle afin de préserver le caractère visionnaire et judiciaire du passage. « Enchaînés » et « s’accomplissent » maintiennent les images concrètes et l’aspect d’une période fixée, sans ajouter d’interprétation confessionnelle.
