  rationale: 'La révision corrige deux difficultés de français sans modifier le sens : elle rend explicitement la relation partitive aux « étoiles » et emploie une tournure temporelle française plus naturelle. Le féminin pluriel (« celles », « elles ») reprend le nom grammaticalement féminin « étoiles » et maintient l’imagerie du texte plutôt que de la remplacer par « anges ». Les notes restent ancrées aux mêmes emplacements et signalent les nuances sans surinterpréter le passage.'
