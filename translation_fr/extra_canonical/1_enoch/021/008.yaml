base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/008.yaml
  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
translation:
  language: fr
  text: 'À ce moment-là, je dis : « Comme ce lieu est terrifiant et pénible à regarder ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: À ce moment-là
  rationale: Rend la formule temporelle narrative avec naturel tout en conservant son lien avec la séquence visionnaire.
- source_word: እቤ
  choice: je dis
  rationale: Introduit directement les paroles d’Hénoch. Le français n’a pas besoin de reproduire une formule sémitisante redondante.
- source_word: አፎ
  choice: Comme
  rationale: Compris ici comme une particule exclamative (« comme ! »), et non comme le nom « bouche » ; cette analyse correspond à la syntaxe de l’exclamation et à la révision philologique fournie.
- source_word: ግሩም
  choice: terrifiant
  rationale: Dans cette vision de jugement, le terme exprime une crainte intense plutôt qu’une admiration positive. « Terrifiant » est clair et actuel.
- source_word: ዝንቱ፡ መካን
  choice: ce lieu
  rationale: Traduction directe du syntagme déictique, adaptée à la topographie solennelle de la vision.
- source_word: ወሕሙም
  choice: et pénible
  rationale: Conserve l’idée d’affliction ou de détresse sans confondre ce qualificatif avec la terreur exprimée auparavant.
- source_word: ለነጽሮ
  choice: à regarder
  rationale: Exprime naturellement en français l’effet produit par le lieu sur celui qui le contemple.
theological_decisions:
- issue: Interprétation de አፎ
  choice: Particule exclamative rendue par « Comme »
  alternative: « ma bouche », avec une formule du type « ma bouche parla »
  rationale: La forme attestée et la syntaxe soutiennent l’exclamation « Comme ce lieu est… ». La lecture « ma bouche » imposerait une identification lexicale et une restructuration syntaxique peu probables.
- issue: Force de ግሩም dans une scène apocalyptique de jugement
  choice: terrifiant
  alternative: redoutable / terrible / impressionnant
  rationale: « Terrifiant » maintient sans ambiguïté l’atmosphère de crainte. « Impressionnant » pourrait suggérer l’admiration, tandis que « terrible » possède aussi en français moderne des emplois familiers ambivalents.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la vigueur exclamative du guèze sans archaïsme artificiel. « Ce lieu » et « à regarder » restent accessibles, tandis que « terrifiant et pénible » préserve la double caractérisation de la vision.
