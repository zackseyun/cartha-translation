base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: fr
  text: 'Et je vis une autre chose au sujet de l’éclair : certains des astres se lèvent et deviennent éclair, sans pouvoir l’abandonner.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset est incertaine. Littéralement, le texte dit qu’ils « ne peuvent abandonner » ou « ne peuvent quitter », sans exprimer clairement l’objet; on peut aussi comprendre qu’ils ne peuvent cesser.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእተ
  choice: une autre chose
  rationale: Introduit un nouvel élément de la vision et conserve la tournure de reprise du récit apocalyptique.
- source_word: ርኢኩ
  choice: je vis
  rationale: Rend simplement et dignement la formule de témoignage visionnaire à la première personne.
- source_word: በእንተ
  choice: au sujet de
  rationale: Exprime le rapport explicatif sans préciser davantage la syntaxe.
- source_word: መብረቅ
  choice: l’éclair / éclair
  rationale: Conserve la même image cosmique aux deux occurrences; l’absence d’article après « deviennent » présente l’éclair comme l’état ou la forme qu’ils prennent.
- source_word: እፎ
  choice: '[rendu par les deux-points]'
  rationale: Le français naturel peut introduire directement le contenu de la vision après les deux-points, là où le guèze emploie « comment ».
- source_word: ይቀውሙ
  choice: se lèvent
  rationale: Rend l’idée de se dresser ou de surgir, sans employer « se distinguer », qui suggérerait à tort une simple prééminence visuelle.
- source_word: እምከዋክብተ
  choice: certains des astres
  rationale: Comprend እም dans son emploi partitif ici. « Astres » maintient le caractère céleste de l’image sans identifier ces entités à des anges.
- source_word: ወይከውኑ
  choice: et deviennent
  rationale: Préserve la dynamique de transformation plutôt que de rendre le verbe par une copule statique.
- source_word: ወኢይክሉ
  choice: sans pouvoir
  rationale: Exprime l’incapacité explicitement marquée dans le texte, tout en évitant une coordination lourde en français.
- source_word: ኃዲገ
  choice: l’abandonner
  rationale: Retient le sens transitif de quitter ou abandonner; le pronom renvoie le plus naturellement à l’état d’éclair, mais l’objet n’est pas exprimé dans le guèze, d’où la note.
theological_decisions:
- issue: Nature des astres et de l’éclair
  choice: Conserver l’image d’astres qui se lèvent et deviennent éclair, sans identifier les astres à des anges ou à des esprits.
  alternative: Interpréter les astres comme des êtres angéliques, ou réduire la scène à une description de phénomènes naturels.
  rationale: Le verset ne donne aucune identification explicite. La traduction laisse donc ouverte la portée personnelle, angélique ou cosmique de l’image apocalyptique.
- issue: Objet de l’abandon dans la dernière proposition
  choice: Faire renvoyer « l’ » à l’état d’éclair tout en signalant que l’objet demeure implicite dans le texte source.
  alternative: Comprendre le verbe au sens absolu de « cesser » ou « s’arrêter », ou au sens de « partir » sans objet précisé.
  rationale: Le verbe favorise l’idée de quitter ou d’abandonner, mais la construction elliptique ne permet pas de déterminer l’objet avec pleine certitude.
translation_notes:
  register: Français international moderne, courant et digne. « Astres » convient au registre visionnaire sans archaïsme marqué. La syntaxe reste concise et conserve l’étrangeté propre à l’image apocalyptique.
