  source_fidelity: 'La mention des « montagnes de l’est », l’indication « non loin de là » avant le verbe de vision, et la reprise « au-dessus d’eux » rendent correctement la syntaxe et la topographie du texte guèze tel qu’il est attesté. En revanche, ቈላ ማያት est plus exactement « une vallée d’eaux » qu’« une vallée remplie d’eaux » : « remplie » ajoute une relation descriptive qui n’est pas exprimée. La dernière clause demeure difficile et doit conserver son caractère approximatif.'
