    rationale: Le verbe négatif de la clause finale peut évoquer ce qui ne s’épuise pas, ne se vide pas ou ne sort/ne s’écoule pas. Le tarissement est une possibilité, mais non la seule; la formulation principale doit mieux préserver cette ambiguïté.
