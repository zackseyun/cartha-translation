base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: fr
  text: 'Au-dessus d’eux[a], au-dessus de ces montagnes de l’est, non loin de là, je vis un autre lieu : une vallée d’eaux, comme si elle était inépuisable[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze transmis est incertain dans cette expression. On peut aussi comprendre simplement : « au-dessus de ces montagnes de l’est ».'
    reason: textual_variant
  - marker: b
    text: La dernière proposition est difficile. Elle peut aussi évoquer ce qui ne se vide pas ou ce dont les eaux ne s’écoulent pas; « comme si elle ne pouvait pas se tarir » est également possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ
  choice: au-dessus de
  rationale: La répétition de la préposition exprime une position élevée dans la géographie de la vision; « au-dessus de » conserve ce rapport spatial.
- source_word: እሙንቱ
  choice: eux / ces
  rationale: Le pronom renvoie à des éléments déjà décrits. La reprise « au-dessus d’eux, au-dessus de ces montagnes » garde cette valeur anaphorique sans préciser davantage l’antécédent.
- source_word: ተደብረ ጽባሕ
  choice: montagnes de l’est
  rationale: Malgré l’état incertain de la transcription, la séquence est comprise comme un pluriel construit « montagnes de » suivi de ጽባሕ, « est », conformément à la révision philologique fournie.
- source_word: አኮ ርሑቀ
  choice: non loin de là
  rationale: Cette formulation française naturelle conserve l’indication de proximité relative et sa place avant le verbe de perception.
- source_word: ወርኢኩ
  choice: je vis
  rationale: Le verbe exprime directement la perception du voyant; le passé simple convient au registre narratif digne.
- source_word: መካነ ካልአ
  choice: un autre lieu
  rationale: « Lieu » traduit la localisation et « autre » le déplacement successif entre les espaces de la vision.
- source_word: ቈላ ማያት
  choice: une vallée remplie d’eaux
  rationale: « Vallée » rend la dépression du terrain et le pluriel « eaux » préserve la forme du guèze. « Remplie de » explicite en français la relation nominale sans réduire les eaux à des cours d’eau.
- source_word: ከመ ዘኢይትዌጸእ
  choice: comme si elle ne pouvait pas se tarir
  rationale: La clause difficile semble décrire des eaux qui ne s’épuisent pas ou ne s’évacuent pas. Cette formulation conserve l’image hydraulique et le caractère comparatif sans en faire une affirmation absolue.
theological_decisions:
- issue: Caractère concret de la géographie visionnaire
  choice: 'Présenter le lieu comme un paysage effectivement vu dans la vision : « un autre lieu : une vallée remplie d’eaux »'
  alternative: Interpréter explicitement la vallée comme un symbole ou généraliser en « un lieu où il y avait de l’eau »
  rationale: Le texte décrit une topographie apocalyptique concrète. La traduction préserve cette image sans lui imposer une interprétation allégorique.
- issue: Ambiguïté de la dernière proposition
  choice: « comme si elle ne pouvait pas se tarir » avec une note signalant les autres sens possibles
  alternative: « comme si elle était inépuisable » ou « comme si ses eaux ne s’écoulaient pas »
  rationale: La formulation retenue garde l’impression d’une eau non épuisée tout en évitant de masquer l’incertitude lexicale du texte transmis.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le récit visionnaire; le pluriel littéraire « eaux » conserve l’imagerie apocalyptique. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
