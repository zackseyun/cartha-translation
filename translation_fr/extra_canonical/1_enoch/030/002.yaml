base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/002.yaml
  text: And I saw a beautiful tree[a], which resembled a fragrant tree[b], like the mastic tree.
translation:
  language: fr
  text: Et je vis un bel arbre, qui ressemblait à un arbre odorant, tel le lentisque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification de cette plante est incertaine ; il s’agit probablement du lentisque, arbre aromatique dont la résine est appelée mastic.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Le verbe visionnaire à la première personne est rendu simplement par « je vis », et la conjonction est conservée pour maintenir l’enchaînement du récit.
- source_word: ዕፀ ሠናየ
  choice: un bel arbre
  rationale: ዕፀ désigne un arbre ou du bois, et ሠናየ exprime ici la beauté ou la qualité; « un bel arbre » est naturel et fidèle.
- source_word: ዘይመስል
  choice: qui ressemblait à
  rationale: La construction relative exprime explicitement une ressemblance; le verbe est conservé plutôt que transformé en simple description de l’odeur.
- source_word: ዕፀ መዓዛ
  choice: un arbre odorant
  rationale: L’expression signifie littéralement quelque chose comme « arbre de parfum »; « arbre odorant » conserve à la fois le second emploi d’« arbre » et l’idée d’une odeur aromatique.
- source_word: ከመ
  choice: comme
  rationale: Particule comparative courante, rendue directement par « comme ».
- source_word: እንተ ዘስኪኖን
  choice: le lentisque
  rationale: Le nom végétal difficile est généralement rapproché du lentisque, arbre dont on tire le mastic. « Lentisque » nomme l’arbre lui-même en français; l’incertitude est signalée en note.
