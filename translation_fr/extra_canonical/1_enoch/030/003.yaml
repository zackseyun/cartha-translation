base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
translation:
  language: fr
  text: Aux bords de ces vallées, je vis de la cannelle odorante[a] ; au-delà d’elles[b], je m’avançai vers l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la casse odorante » ; le terme désigne une épice aromatique apparentée à la cannelle.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « au-delà d’elles » ou « dans la direction qui se trouve au-delà d’elles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ
  choice: près de / ayant dépassées / vers
  rationale: 'La préposition revient trois fois avec des valeurs spatiales adaptées au contexte : proximité, passage au-delà d’un repère, puis direction.'
- source_word: ክንፈሩ
  choice: bords
  rationale: Le terme topographique désigne ici les bords ou les lisières des vallées, plutôt qu’un côté au sens général.
- source_word: ቈላት
  choice: vallées
  rationale: Ce terme de relief est rendu naturellement en français par « vallées ».
- source_word: ርኢኩ
  choice: je vis
  rationale: Formulation directe et digne du récit visionnaire à la première personne.
- source_word: ቀናንሞስ
  choice: cannelle
  rationale: Le mot d’emprunt désigne une épice aromatique du type cannelle ou casse ; « cannelle » est l’équivalent concret le plus clair.
- source_word: ዘመዓዛ
  choice: odorante
  rationale: L’expression qualifie la cannelle par son parfum ; « odorante » conserve cette dimension sensorielle dans un registre naturel et digne.
- source_word: ቀረብኩ
  choice: je me dirigeai
  rationale: Le verbe exprime un mouvement d’approche ; associé à la direction orientale, « je me dirigeai » rend naturellement la progression sans suggérer l’arrivée.
- source_word: ጽባሕ
  choice: l’est
  rationale: Dans ce contexte géographique, le terme désigne la direction de l’orient.
theological_decisions:
- issue: Identification de la plante aromatique dans le paysage apocalyptique
  choice: cannelle
  alternative: casse ou plante aromatique
  rationale: Le terme guèze renvoie à une épice aromatique identifiable. Le choix d’un nom concret préserve l’imagerie de la vision sans la généraliser.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit. La répétition de la préposition guèze est rendue selon ses différentes valeurs spatiales afin d’éviter une formulation française rigide.
