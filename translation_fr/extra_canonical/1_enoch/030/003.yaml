    text: Ou « de la casse odorante » ; le terme désigne une épice aromatique apparentée à la cannelle.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « au-delà d’elles » ou « dans la direction qui se trouve au-delà d’elles ».
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression française un peu lourde par une localisation topographique plus idiomatique et, surtout, remplace « les ayant dépassées » par « au-delà d’elles », qui évite d’ajouter l’idée d’un franchissement achevé. Les deux ancres de note restent attachées aux éléments qu’elles éclairent.
