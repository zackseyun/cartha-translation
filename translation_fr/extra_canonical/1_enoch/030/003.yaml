revisions:
- from: Près des bords de ces vallées, je vis de la cannelle odorante[a] ; puis, les ayant dépassées[b], je me dirigeai vers l’est.
  to: Aux bords de ces vallées, je vis de la cannelle odorante[a] ; au-delà d’elles[b], je m’avançai vers l’est.
  rationale: La révision remplace une expression française un peu lourde par une localisation topographique plus idiomatique et, surtout, remplace « les ayant dépassées » par « au-delà d’elles », qui évite d’ajouter l’idée d’un franchissement achevé. Les deux ancres de note restent attachées aux éléments qu’elles éclairent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:47Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les vallées, la cannelle odorante et la direction vers l’est. Toutefois, « les ayant dépassées » présente le passage au-delà des vallées comme un fait accompli et est plus affirmatif que la construction spatiale source, qui peut simplement situer le mouvement au-delà d’elles.
  naturalness: « Près des bords de ces vallées » est compréhensible, mais « aux bords » ou « le long des bords » est plus idiomatique et plus direct en français. « Je m’avançai vers l’est » est naturel dans ce récit au passé simple.
  terminology: « Cannelle odorante », « vallées » et « l’est » conviennent. La note sur la casse préserve utilement l’incertitude botanique sans imposer une identification unique.
  issues:
  - severity: medium
    issue: « les ayant dépassées » surinterprète la relation spatiale.
    rationale: Cette formulation implique explicitement que le narrateur a franchi les vallées. « Au-delà d’elles » conserve la valeur spatiale et l’ambiguïté signalée par la tradition de traduction anglaise et par la note.
  - severity: low
    issue: « Près des bords » est légèrement lourd.
    rationale: La juxtaposition de « près » et « bords » est moins idiomatique que « aux bords », tout en rendant bien la localisation près des limites des vallées.
  revised_text: Aux bords de ces vallées, je vis de la cannelle odorante[a] ; au-delà d’elles[b], je m’avançai vers l’est.
  revised_footnotes:
