  text: And I saw a burning fire that was within all the mountains[a][b].
translation:
  language: fr
  text: Et je vis un feu ardent qui se trouvait à l’intérieur de toutes les montagnes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure éthiopienne correspondant à « qui se trouvait » est difficile. Elle peut aussi se comprendre ainsi : « Et je vis un feu qui brûlait, et ce qui se trouvait à l’intérieur de toutes les montagnes. »'
    reason: textual_variant
lexical_decisions:
- source_word: እሳተ
  choice: un feu
  rationale: Nom singulier indéfini; cette formulation conserve simplement l’image visionnaire sans préciser la nature ni la fonction du feu.
- source_word: ዘይነድድ
  choice: ardent
  rationale: La forme verbale relative décrit un feu en train de brûler. « Ardent » est naturel en français et maintient l’intensité de l’image.
- source_word: ርኢኩ
  choice: je vis
  rationale: Formule de témoignage visionnaire à la première personne. Le passé simple convient au registre narratif digne et au récit d’une vision.
- source_word: ወዘሀሎ
  choice: qui se trouvait
  rationale: Compris comme une seconde proposition relative se rapportant au feu, malgré la difficulté de la leçon éthiopienne; cette traduction restitue sa localisation sans créer un second objet de la vision.
- source_word: ውስተ ኵሉ አድባር
  choice: à l’intérieur de toutes les montagnes
  rationale: ውስተ exprime une localisation intérieure, tandis que ኵሉ avec le pluriel a un sens collectif. La formulation préserve l’étrange topographie cosmique de la vision.
theological_decisions:
- issue: Nature de l’image du feu dans les montagnes
  choice: Conserver l’image apocalyptique concrète d’un feu situé à l’intérieur des montagnes.
  alternative: Interpréter le feu comme une image générale du jugement divin ou comme un phénomène naturel souterrain.
  rationale: Le contexte décrit une topographie visionnaire. La traduction rapporte ce qui est vu sans l’allégoriser ni l’expliquer de manière naturaliste.
- issue: Rapport syntaxique de ወዘሀሎ au feu
  choice: Faire de « qui se trouvait » une proposition relative qualifiant le feu.
  alternative: 'Traduire comme un second objet indépendant: « et ce qui se trouvait à l’intérieur de toutes les montagnes ».'
  rationale: L’analyse comme seconde relative, parallèle à ዘይነድድ malgré l’hyperbate, donne la construction la plus cohérente; la difficulté du témoin est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif visionnaire; « à l’intérieur » préserve explicitement la localisation interne, et la note conserve l’ambiguïté réelle du témoin éthiopien.
