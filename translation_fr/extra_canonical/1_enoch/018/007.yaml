  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: fr
  text: Celles qui étaient du côté de l’est étaient faites de pierre aux couleurs variées ; l’une était de pierre de perle, et l’autre de pierre médicinale. Celles qui étaient du côté du sud étaient faites de pierre rouge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽባሕሰ
  choice: du côté de l’est
  rationale: Le terme désigne ici l’orient, dans une série d’orientations spatiales.
- source_word: እብነ ሕብር
  choice: pierre aux couleurs variées
  rationale: ሕብር évoque la couleur ou un mélange de couleurs ; cette formulation conserve la portée descriptive sans préciser une teinte absente du texte.
- source_word: እብነ ባሕርይ
  choice: pierre de perle
  rationale: Rendu traditionnel probable du composé, qui paraît désigner une pierre associée à la perle ; la tournure garde l’étrangeté concrète de l’original.
- source_word: እብነ ፈውስ
  choice: pierre médicinale
  rationale: ፈውስ signifie guérison ou remède. « Médicinale » exprime la propriété curative attribuée à la pierre sans transformer celle-ci en agent explicite.
- source_word: አዜብ
  choice: du côté du sud
  rationale: Terme directionnel désignant le sud.
- source_word: እብነ ቀይሕ
  choice: pierre rouge
  rationale: Traduction directe du nom suivi de l’adjectif de couleur.
