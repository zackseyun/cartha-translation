base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: fr
  text: Et celui du milieu s’élevait jusqu’au ciel[a], pareil au trône du Seigneur, qui était en pierre de cristal[b] ; et le sommet du trône[c] était en pierre de saphir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et, au milieu, il s’élevait jusqu’au ciel. » La forme guèze peut renvoyer à l’élément central ou décrire sa position.'
    reason: alternative_reading
  - marker: b
    text: Le terme traduit par « cristal » est incertain ; il paraît désigner une pierre brillante ou précieuse.
    reason: lexical_alternative
  - marker: c
    text: L’expression traduite par « le sommet du trône » est difficile ; elle peut désigner plus généralement la partie supérieure de la structure associée au trône.
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: celui du milieu
  rationale: La forme désigne l’élément central de la structure visionnaire. « Celui du milieu » conserve ce référent implicite sans préciser davantage sa nature.
- source_word: ይጐድእ እስከ ሰማይ
  choice: s’élevait jusqu’au ciel
  rationale: Le verbe exprime une extension ascendante, et እስከ marque la limite atteinte. Cette formulation restitue naturellement les deux éléments.
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: pareil au trône du Seigneur
  rationale: ከመ introduit une comparaison. « Pareil à » préserve la distinction entre l’objet contemplé et le trône divin.
- source_word: እምእብነ ፑክ
  choice: en pierre de cristal
  rationale: Le nom de matière ፑክ est incertain, mais paraît désigner une pierre brillante ou cristalline. Le choix traditionnel « cristal » est conservé avec une note.
- source_word: ይማሑ ለመንበሩ
  choice: le sommet du trône
  rationale: La phrase semble désigner la partie supérieure du trône, bien que son sens exact demeure difficile.
- source_word: እምእብነ ሰንፔር
  choice: en pierre de saphir
  rationale: Le nom de gemme est traditionnellement compris comme « saphir » ; le mot « pierre » maintient la construction matérielle du guèze.
theological_decisions:
- issue: Rendu du titre divin እግዚአብሔር
  choice: le Seigneur
  alternative: Dieu
  rationale: « Le Seigneur » rend sobrement le titre divin et maintient le lien avec l’imagerie biblique du trône, sans ajouter de précision absente du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme visionnaire et la comparaison sont préservés ; les incertitudes lexicales et syntaxiques sont signalées sans introduire la « fondation » attestée seulement dans une ancienne traduction erronée.
