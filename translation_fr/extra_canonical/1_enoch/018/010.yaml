  text: And there I saw a place beyond the great earth[b][a]; there they gather together.
translation:
  language: fr
  text: Et là, je vis un lieu au-delà de la vaste terre[a] ; là, ils se rassemblent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze est difficile à cet endroit. Autre traduction possible : « un lieu aux extrémités de la grande terre ».'
