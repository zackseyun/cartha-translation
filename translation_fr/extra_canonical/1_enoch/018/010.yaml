lexical_decisions:
- source_word: ወርኢኩ
  choice: je vis
  rationale: Formule narrative habituelle du récit visionnaire ; le passé simple convient au registre littéraire et reste clair.
- source_word: ህየ
  choice: là
  rationale: L’adverbe spatial est répété dans le texte source ; sa répétition maintient la structure et le style visionnaire.
- source_word: መካነ
  choice: un lieu
  rationale: Le nom sans détermination introduit vraisemblablement un nouvel endroit dans le parcours visionnaire.
- source_word: ማዕዶተ
  choice: au-delà de
  rationale: Le terme peut exprimer l’autre côté ou ce qui se trouve au-delà ; cette lecture est mieux étayée que « aux extrémités de », malgré l’état difficile du témoin.
- source_word: ዐቢይ ምድር
  choice: la vaste terre
  rationale: « Terre » préserve la portée cosmique de ምድር ; « vaste » rend naturellement la grandeur exprimée par ዐቢይ sans suggérer que la terre serait moralement grande.
- source_word: ይትጋብኡ
  choice: ils se rassemblent
  rationale: Le pronominal français rend bien la valeur moyenne ou réflexive probable et conserve l’idée d’un rassemblement en ce lieu.
theological_decisions:
- issue: Géographie cosmique du lieu décrit
  choice: au-delà de la vaste terre
  alternative: aux extrémités de la grande terre
  rationale: La traduction conserve l’image concrète de la cosmographie visionnaire sans la rationaliser. « Au-delà de » correspond vraisemblablement au sens du terme guèze, tandis que l’autre lecture demeure signalée en note à cause de la difficulté textuelle.
- issue: Agent du rassemblement non identifié
  choice: ils se rassemblent
  alternative: ils y sont rassemblés
  rationale: Le texte ne précise pas l’identité du groupe ni un agent extérieur. La formulation pronominale préserve cette indétermination et la valeur verbale probable.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le ton narratif visionnaire ; la répétition de « là » reproduit volontairement celle du texte source.
