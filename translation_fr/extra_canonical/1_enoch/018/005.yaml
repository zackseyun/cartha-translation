base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: fr
  text: J’ai vu les vents sur la terre, qui portent les nuages[a] ; j’ai vu les voies des anges ; j’ai vu, aux confins de la terre, le ferme appui du ciel d’en haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les vents sur la terre, portant les nuages ». La tournure guèze est difficile ; prise isolément, la préposition devant « nuages » pourrait aussi se rendre par « dans » ou « parmi », mais le témoin grec appuie nettement la traduction retenue.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « la fondation du ciel d’en haut ». Le terme guèze peut désigner la fermeté, la force qui soutient ou une fondation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: J’ai vu
  rationale: La répétition de cette formule visionnaire à trois reprises est conservée, sans ajouter de conjonctions absentes du guèze.
- source_word: ነፋሳተ
  choice: les vents
  rationale: Dans cette description de l’architecture cosmique, le sens physique « vents » convient mieux que « esprits ».
- source_word: ዘዲበ ምድር
  choice: sur la terre
  rationale: Le groupe prépositionnel situe les vents par rapport à la terre ; il ne fait pas de « la terre » l’objet du verbe suivant. Cette analyse concorde avec le témoin grec.
- source_word: ዘይጸውር በደመናት
  choice: qui portent les nuages
  rationale: Le verbe exprime l’action de porter ou de soutenir. Dans la syntaxe retenue, les nuages sont ce que portent les vents.
- source_word: ፍናወ
  choice: les voies
  rationale: Le mot désigne des chemins ou des parcours. « Voies » garde ici l’image de routes célestes tout en restant naturel en français.
- source_word: መላእክት
  choice: des anges
  rationale: Le contexte apocalyptique désigne des êtres célestes plutôt que de simples messagers humains.
- source_word: ውስተ ጽነፈ ምድር
  choice: aux confins de la terre
  rationale: Cette expression évoque la limite extrême du monde ; « aux confins » rend cette représentation cosmique avec naturel.
- source_word: ጽንዐ
  choice: le ferme appui
  rationale: Le nom évoque la fermeté ou la force qui soutient. « Ferme appui » préserve cette image sans imposer exclusivement l’idée architecturale de fondation.
- source_word: ዘሰማይ መልዕልተ
  choice: du ciel d’en haut
  rationale: Cette formulation maintient explicitement la dimension verticale du tableau cosmique.
theological_decisions:
- issue: Faut-il comprendre ነፋሳተ comme « vents » ou comme « esprits » ?
  choice: vents
  alternative: esprits
  rationale: Le verset énumère des réalités de l’ordre cosmique — les vents, les voies angéliques et l’appui du ciel. « Vents » préserve cette cohérence immédiate sans introduire une interprétation spirituelle ou démonologique.
- issue: Que portent les vents ?
  choice: les nuages
  alternative: la terre, au-dessus des nuages
  rationale: La construction guèze rattache « sur la terre » aux vents, tandis que le témoin grec confirme que les vents portent les nuages. L’ancienne analyse faisant de la terre l’objet du verbe n’est donc pas retenue dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence brève et répétitive de la vision est respectée par les trois occurrences de « J’ai vu », sans ajout de « et ». Le vocabulaire cosmique demeure concret sans archaïsme excessif.
