base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: fr
  text: 'Puis je poursuivis ma route vers le sud et je vis un lieu qui brûlait jour et nuit, où se trouvaient sept montagnes de pierre précieuse[a] : trois vers l’est et trois vers le sud[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pierre précieuse » peut aussi se traduire par « pierre de grand prix » ou « pierre splendide »; le terme guèze souligne la valeur ou l’éclat exceptionnel de la pierre.
    reason: lexical_alternative
  - marker: b
    text: Le texte guèze transmis mentionne sept montagnes, puis en situe trois vers l’est et trois vers le sud. L’emplacement de la septième n’est pas précisé dans ce verset tel qu’il est conservé.
    reason: textual_variant
lexical_decisions:
- source_word: ሐለፍኩ
  choice: je poursuivis ma route
  rationale: Exprime la continuation du déplacement dans le récit visionnaire, avec un français naturel, sans réduire le verbe à un simple passage devant un lieu.
- source_word: መንገለ አዜብ
  choice: vers le sud
  rationale: መንገለ indique une direction et አዜብ désigne ici le sud.
- source_word: ወርኢኩ መካነ
  choice: et je vis un lieu
  rationale: Introduit simplement un nouvel espace de la vision sans lui attribuer une définition excessive.
- source_word: ዘይነድድ
  choice: qui brûlait
  rationale: La proposition relative rend l’action continue décrite par la forme guèze et conserve l’image concrète.
- source_word: መዐልተ ወሌሊተ
  choice: jour et nuit
  rationale: Formule française concise qui exprime la continuité temporelle du couple guèze.
- source_word: ኀበ ሰብዓቱ አድባር
  choice: où se trouvaient sept montagnes
  rationale: ኀበ situe les montagnes dans le lieu contemplé; cette formulation reste naturelle sans préciser davantage leur relation spatiale.
- source_word: ዘእምእብን ክቡር
  choice: de pierre précieuse
  rationale: እብን signifie « pierre » et ክቡር peut exprimer la valeur, le prix ou la splendeur; « précieuse » convient au contexte minéral de la vision.
- source_word: ፫መንገለ ጽባሕ
  choice: trois vers l’est
  rationale: Dans cette énumération directionnelle, ጽባሕ, littéralement associé au matin, désigne naturellement l’est.
- source_word: ወ፫መንገለ አዜብ
  choice: et trois vers le sud
  rationale: Conserve le parallélisme directionnel du texte transmis, sans tenter de compléter le nombre de montagnes.
theological_decisions:
- issue: Topographie cosmique du lieu en feu et des montagnes de pierre précieuse
  choice: Conserver littéralement le paysage visionnaire
  alternative: Généraliser en une région de feu ou interpréter les montagnes comme des structures célestes
  rationale: Le verset présente des images apocalyptiques concrètes sans en donner l’interprétation. La traduction ne doit donc ni les symboliser ni les expliquer dans le corps du texte.
- issue: Décompte incomplet des sept montagnes
  choice: Maintenir « sept », puis « trois » à l’est et « trois » au sud
  alternative: Ajouter une orientation pour la septième montagne ou corriger le total
  rationale: Le texte guèze transmis laisse la septième montagne sans orientation dans ce verset. Préserver cette tension textuelle évite une harmonisation conjecturale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure fluide tout en conservant la répétition des directions et le caractère concret de la vision apocalyptique.
