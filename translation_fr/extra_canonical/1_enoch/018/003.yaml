base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: fr
  text: 'Et je vis comment les vents soutiennent les hauteurs du ciel[a] et comment celles-ci se tiennent entre le ciel et la terre : ce sont les piliers du ciel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe guèze est difficile. Il peut aussi évoquer l’idée d’étendre, de déployer ou d’exercer une action semblable sur les hauteurs du ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  choice: les vents
  rationale: Dans cette vision cosmologique, le terme désigne le plus naturellement les vents comme forces cosmiques, sans imposer une interprétation angélologique.
- source_word: ይረብብዋ
  choice: soutiennent
  rationale: Le verbe est difficile; « soutiennent » convient à l’image architecturale et à l’identification finale comme piliers, tout en signalant en note les autres possibilités.
- source_word: አዕልና፡ ሰማይ
  choice: les hauteurs du ciel
  rationale: Cette traduction distingue l’objet de l’action des « piliers du ciel » nommés dans la proposition finale et respecte la progression descriptive du verset.
- source_word: ይቀውሙ
  choice: se tiennent
  rationale: Le verbe exprime la position stable de ces réalités cosmiques entre le ciel et la terre.
- source_word: ማእከለ፡ ሰማይ፡ ወምድር
  choice: entre le ciel et la terre
  rationale: Formulation française naturelle qui conserve clairement l’image spatiale du guèze.
- source_word: እሙንቱ፡ ውእቶሙ
  choice: ce sont
  rationale: La tournure rend la valeur emphatique et identificatrice de la proposition finale.
theological_decisions:
- issue: Faut-il rendre ነፋሳት par « vents » ou par « esprits » ?
  choice: vents
  alternative: esprits; vents/esprits
  rationale: Le contexte décrit les forces et l’architecture du cosmos. « Vents » correspond mieux à cette scène physique et évite d’introduire une précision angélologique que le passage n’exige pas.
- issue: Antécédent du sujet de « se tiennent »
  choice: les hauteurs du ciel, ensuite identifiées comme les piliers du ciel
  alternative: les vents se tiennent entre le ciel et la terre
  rationale: L’accord grammatical français exige d’expliciter l’antécédent. Le féminin « celles-ci » rattache la proposition aux « hauteurs », conformément à l’explication finale, sans identifier les vents eux-mêmes aux piliers.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « ciel » et l’image cosmologique des « piliers » sont conservées. Le marqueur [a] figure dans le texte principal.
