base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: fr
  text: Et je vis les vents[a] qui font tourner le ciel et qui font se coucher le disque[b] du soleil et toutes les étoiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les esprits »; le terme guèze peut désigner des vents ou des esprits.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’orbe » ou « le circuit » du soleil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Rend simplement la formule visionnaire à la première personne et conserve l’enchaînement narratif marqué par ወ (« et »).
- source_word: ነፋሳተ
  choice: les vents
  rationale: Le sens concret convient au contexte cosmologique, où ces forces agissent sur le ciel et les luminaires; « esprits » demeure lexicalement possible et est signalé en note.
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: qui font tourner le ciel
  rationale: Le verbe exprime ici l’idée de mouvoir ou de faire tourner. Cette formulation conserve l’image cosmique sans lui imposer une précision astronomique étrangère au texte.
- source_word: ወእለ ያዐርቡ
  choice: et qui font se coucher
  rationale: ያዐርቡ est compris comme la forme causative du verbe désignant le coucher ou la descente des astres, et non comme un verbe signifiant « approcher ».
- source_word: ለክበበ ፀሐይ
  choice: le disque du soleil
  rationale: ክበበ désigne ce qui est rond ou forme un cercle; « disque » donne une image naturelle en français, tandis que « orbe » ou « circuit » restent possibles.
- source_word: ወኵሎ ከዋክብተ
  choice: et toutes les étoiles
  rationale: La tournure collective est rendue naturellement et sans restriction par « toutes les étoiles ».
theological_decisions:
- issue: Faut-il comprendre ነፋሳተ comme des vents cosmiques impersonnels ou comme des esprits?
  choice: des vents cosmiques
  alternative: des esprits ou esprits des vents
  rationale: Le contexte immédiat décrit les forces qui régissent les mouvements du ciel, du soleil et des étoiles. « Vents » préserve cette cosmologie apocalyptique sans introduire une personnalité angélique que le verset n’explicite pas; l’autre sens est néanmoins conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « qui font » clarifie que les vents sont les agents des deux mouvements. « Se coucher » emploie l’expression française ordinaire pour la descente apparente des astres, tout en respectant la valeur causative du verbe guèze.
