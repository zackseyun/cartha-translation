base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: fr
  text: Et je vis les réserves[a] de tous les vents, et je vis comment, par eux, il avait orné[b] toute la création et les fondations de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dépôts » ou « trésors ». L’image est celle de lieux célestes où les vents sont gardés.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi avoir ici le sens d’« ordonner » ou d’« établir », et non seulement d’« orner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: réserves
  rationale: Le nom désigne des trésors, dépôts ou lieux de stockage. « réserves » conserve ici l’image concrète de lieux célestes où les vents sont gardés, sans la connotation financière de « trésors ».
- source_word: ኵሉ ነፋሳት
  choice: tous les vents
  rationale: Dans ce contexte cosmologique, le terme renvoie plus naturellement aux vents qu’aux esprits ou aux souffles.
- source_word: ከመ
  choice: comment
  rationale: Le mot introduit ce que le voyant a perçu et exprime ici la manière dont les vents interviennent dans la création.
- source_word: ቦሙ
  choice: par eux
  rationale: La forme renvoie aux vents avec une valeur instrumentale. « par eux » rend cette fonction plus clairement en français que le calque « avec eux ».
- source_word: አሰርገወ
  choice: avait orné
  rationale: Le verbe évoque d’abord l’action d’orner ou d’embellir, tout en pouvant inclure l’idée de disposer ou d’ordonner. Le plus-que-parfait situe naturellement l’action antérieure à la vision.
- source_word: ኵሎ ፍጥረተ
  choice: toute la création
  rationale: Le collectif exprime ici la totalité du monde créé; cette formulation est naturelle et conserve la portée cosmique.
- source_word: መሰረታቲሃ ለምድር
  choice: les fondations de la terre
  rationale: Cette expression architecturale concrète correspond à la cosmographie apocalyptique du passage.
theological_decisions:
- issue: 'Sens de ነፋሳት : « vents » ou « esprits »'
  choice: vents
  alternative: esprits; souffles
  rationale: Les réserves célestes et le contexte de description cosmique favorisent « vents ». Ce choix évite d’introduire une interprétation angélologique que le passage n’exige pas.
- issue: 'Sens de አሰርገወ : embellir ou établir la création'
  choice: avait orné
  alternative: avait ordonné; avait établi; avait embelli
  rationale: Le texte guèze soutient l’image vive de l’ornement, mais le lien avec les fondations terrestres permet aussi une nuance d’organisation ou d’établissement; la note préserve cette amplitude.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « je vis » est conservée comme trait du récit visionnaire. Les images cosmologiques concrètes sont maintenues, et les ambiguïtés lexicales importantes sont signalées en notes.
