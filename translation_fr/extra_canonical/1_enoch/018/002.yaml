base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: fr
  text: Et je vis les pierres d’angle de la terre[a], et je vis les quatre vents[b] qui soutiennent la terre et la voûte du ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pierres des angles de la terre ». L’expression guèze est architecturale et peut désigner, dans cette vision, les fondements situés aux extrémités de la terre.
    reason: lexical_alternative
  - marker: b
    text: Le nom traduit par « vents » peut aussi, selon le contexte, signifier « souffles » ou « esprits » ; ici, le cadre cosmologique favorise « vents ».
    reason: lexical_alternative
  - marker: c
    text: La « voûte du ciel » conserve l’ancienne représentation cosmique d’une étendue céleste structurée.
    reason: cultural_note
lexical_decisions:
- source_word: እብነ፡ ማእዘንተ፡ ምድር
  choice: les pierres d’angle de la terre
  rationale: La construction associe « pierres » et « angles/coins ». « Pierres d’angle » conserve l’image architecturale et cosmique sans la réduire aux seules extrémités de la terre.
- source_word: ምድር
  choice: la terre
  rationale: Dans cette vision cosmologique, le sens global « terre » convient mieux que « pays » ou « sol ».
- source_word: አርባዕተ፡ ነፋሳተ
  choice: les quatre vents
  rationale: Le nom peut aussi évoquer les souffles ou les esprits, mais le cadre cosmologique et le nombre quatre favorisent ici « vents ».
- source_word: ይጸውርዋ
  choice: soutiennent
  rationale: Le verbe exprime l’action de porter ou de supporter. « Soutiennent » rend naturellement en français l’image d’un appui cosmique.
- source_word: ወጽንዐ፡ ሰማይ
  choice: et la voûte du ciel
  rationale: « Voûte du ciel » préserve l’image ancienne d’une étendue céleste structurée tout en étant plus immédiatement compréhensible en français moderne que « firmament du ciel ».
theological_decisions:
- issue: L’imagerie cosmologique ancienne décrivant la structure du monde
  choice: 'Conserver les éléments concrets : les pierres d’angle de la terre, les vents qui soutiennent la terre et la voûte du ciel.'
  alternative: Reformuler de manière abstraite en parlant des extrémités de la terre et des forces qui gouvernent le monde.
  rationale: Le texte présente une vision de l’architecture cosmique. La traduction laisse subsister cette représentation apocalyptique sans la moderniser ni trancher sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe répétitive « je vis… je vis… » est conservée pour respecter le rythme visionnaire. Les notes suivent l’ordre d’apparition de leurs appels dans le texte.
