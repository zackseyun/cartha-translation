base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: fr
  text: 'Considérez toutes les œuvres du ciel : voyez comment elles ne changent pas leurs parcours[a]. Quant aux luminaires du ciel[b], ils se lèvent et se couchent tous dans l’ordre, chacun en son temps, sans s’écarter de l’ordre qui leur est fixé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne changent pas leurs voies ». Le texte évoque les parcours fixes des réalités célestes.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les corps lumineux du ciel, notamment le soleil, la lune et les étoiles.
    reason: clarification
  - marker: c
    text: Ou « de la règle qui leur est assignée ». L’expression peut désigner un ordre, une règle ou une ordonnance établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ
  choice: Examinez
  rationale: L’impératif pluriel appelle les lecteurs à observer attentivement la création. « Examinez » garde cette force exhortative sans suggérer qu’ils doivent poser une question.
- source_word: ግብረ
  choice: œuvres
  rationale: Dans ce contexte cosmique, le terme désigne les réalités ou opérations visibles dans le ciel. « Œuvres » conserve l’idée de création sans préciser davantage que la source.
- source_word: ኢይመይጡ ፍናዊሆሙ
  choice: elles ne changent pas de trajectoire
  rationale: La formulation exprime la constance des voies suivies par les réalités célestes. « Trajectoire » rend naturellement l’image en français moderne.
- source_word: ብርሃናት
  choice: luminaires
  rationale: Le mot désigne les corps lumineux du ciel, probablement le soleil, la lune et les étoiles. « Luminaires » est précis, digne et traditionnel dans un contexte cosmique.
- source_word: ይሠርቅ ወየዐርብ
  choice: se lèvent et se couchent
  rationale: Cette paire verbale décrit le mouvement régulier des corps célestes dans le ciel; l’expression française est idiomatique et fidèle.
- source_word: ሥሩዕ
  choice: avec régularité
  rationale: Le terme souligne le caractère ordonné de leur mouvement. Cette formulation évite une répétition lourde avec « ordre » à la fin du verset.
- source_word: በበዘመኑ
  choice: chacun en son temps
  rationale: La construction distributive indique que chaque luminaire agit au moment qui lui correspond; « temps » reste plus proche et moins interprétatif que « saison ».
- source_word: ኢይትኀደዉ እምሥርዓቶሙ
  choice: sans s’écarter de l’ordre qui leur est fixé
  rationale: Le verbe avec la préposition exprime l’idée de ne pas franchir une limite ou dévier d’un ordre. La traduction garde la force normative tout en restant naturelle en français.
theological_decisions:
- issue: Faut-il exprimer la régularité céleste en termes purement descriptifs ou conserver sa portée normative ?
  choice: sans s’écarter de l’ordre qui leur est fixé
  alternative: sans changer leur ordre
  rationale: La source présente les luminaires comme respectant un ordre déterminé, avec une nuance plus forte qu’une simple régularité mécanique. La traduction conserve cette portée juridico-cosmique sans expliciter que Dieu est l’agent, puisque le verset ne le nomme pas ici.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’impératif pluriel est conservé. Le rythme met en relief l’observation de la constance céleste, et la dernière proposition préserve la nuance normative du texte guèze sans ajouter explicitement un agent divin.
