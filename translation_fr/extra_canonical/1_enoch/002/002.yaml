base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: fr
  text: 'Regardez la terre et réfléchissez aux œuvres qui s’y accomplissent, depuis leur commencement jusqu’à leur achèvement[a] : aucune des œuvres de Dieu ne change, telles qu’elles apparaissent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le singulier éthiopien peut désigner collectivement les œuvres; on pourrait aussi comprendre : « l’œuvre qui s’accomplit sur elle, depuis son commencement jusqu’à son achèvement » ou rattacher l’achèvement à la terre.'
    reason: ambiguïté grammaticale et différence de nombre
  - marker: b
    text: 'La proposition finale peut aussi se comprendre : « tandis que cela apparaît » ou « comme il est montré », selon son rattachement syntaxique. La formulation « aucune des œuvres de Dieu » peut également être comprise collectivement : « toutes les œuvres de Dieu ne changent pas ».'
    reason: lecture alternative
lexical_decisions:
- source_word: ርእይዋ ለምድር
  choice: Regardez la terre
  rationale: L’impératif invite directement à observer la terre. « Regardez » est naturel, actuel et plus délibéré que « voyez ».
- source_word: ወለብዉ
  choice: comprenez
  rationale: Le verbe fait passer de l’observation au discernement réfléchi.
- source_word: በእንተ ምግባር ዘይትገበር ላዕሌሃ
  choice: ce qu’il en est des œuvres qui s’y accomplissent
  rationale: Cette formulation rend le rapport introduit par በእንተ et la tournure passive, tout en gardant explicitement la terre comme lieu des œuvres.
- source_word: እምቀዳሚ እስከ ተፍጻሜቱ
  choice: depuis leur commencement jusqu’à leur achèvement
  rationale: Le singulier éthiopien peut être collectif; les pronoms pluriels assurent en français l’accord avec « œuvres ». « Achèvement » exprime l’idée d’accomplissement plutôt qu’une simple cessation.
- source_word: ከመ ኢይትመየጥ ኵሉ ምግባረ ለአምላክ
  choice: aucune des œuvres de Dieu ne change
  rationale: Cette lecture distributive produit un français clair tout en conservant l’affirmation de stabilité. L’ambiguïté avec une lecture collective est signalée en note.
- source_word: እንዘ ያስተርኢ
  choice: telles qu’elles apparaissent
  rationale: L’Ast-stem est ici compris dans son sens intransitif ou passif, « apparaître / être vu », plutôt que dans le sens transitif « montrer ».
theological_decisions:
- issue: Portée de l’affirmation sur l’absence de changement
  choice: Une affirmation concernant la stabilité observable des œuvres de Dieu dans l’ordre créé
  alternative: Une déclaration métaphysique générale selon laquelle aucune action divine ne change jamais quoi que ce soit
  rationale: Le contexte immédiat appelle à observer la terre et ce qui s’y accomplit. La traduction conserve la force de l’énoncé sans lui imposer une formulation issue d’un système théologique ultérieur.
- issue: Référent et sens de la proposition finale
  choice: Les œuvres apparaissent de manière observable
  alternative: Dieu les montre, ou « tandis qu’il montre cela »
  rationale: La morphologie du verbe favorise le sens intransitif ou passif « apparaître / être vu ». La note conserve toutefois la difficulté syntaxique de la proposition.
translation_notes:
  register: Français international moderne, digne et accessible. « Regardez » maintient l’appel direct à l’observation; « s’y accomplissent » et « achèvement » donnent une légère élévation de registre sans archaïsme. Les ambiguïtés de nombre, de rattachement et de portée théologique sont préservées par les notes.
