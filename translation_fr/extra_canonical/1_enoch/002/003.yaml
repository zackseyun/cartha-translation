base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: fr
  text: Observez l’été et l’hiver[a], et voyez comment toute la terre est remplie d’eau, et les nuages, la rosée[b] et la pluie reposent sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La paire de saisons « l’été et l’hiver » traduit directement le guèze. Dans le contexte éthiopien, « l’hiver » peut évoquer la saison des pluies plutôt qu’une saison froide au sens moderne.
    reason: cultural_note
  - marker: b
    text: Le mot traduit par « rosée » peut avoir d’autres sens lorsqu’il est isolé. Dans cette énumération de phénomènes météorologiques, il désigne très probablement une forme d’humidité telle que la rosée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: Observez
  rationale: L’impératif appelle collectivement les lecteurs à porter leur attention sur la création. « Observez » est naturel, digne et mieux adapté à cette contemplation que le simple « Voyez ».
- source_word: ለሐጋይ ወለክረምት
  choice: l’été et l’hiver
  rationale: La paire saisonnière est rendue directement, sans remplacer dans le corps du texte « hiver » par « saison des pluies » ; la nuance climatique est signalée en note.
- source_word: ከመ
  choice: voyez comment
  rationale: Introduit ce qui doit être constaté. La reprise de « voyez » explicite naturellement en français le mouvement de l’observation tout en conservant la valeur de « comment ».
- source_word: ኵሉ ምድር
  choice: toute la terre
  rationale: Le contexte d’observation de la création favorise la portée globale de « terre » plutôt que le sens local de « pays » ou « sol ».
- source_word: መልአት ማየ
  choice: est remplie d’eau
  rationale: Rend directement l’idée de plénitude ou de remplissage et conserve l’image concrète de l’eau.
- source_word: ወደመና
  choice: nuages
  rationale: Terme météorologique inclus dans l’énumération des phénomènes apportant l’humidité.
- source_word: ወጠለ
  choice: rosée
  rationale: Dans cette série comprenant eau, nuages et pluie, « rosée » est le sens contextuellement le plus probable, bien qu’une certaine ambiguïté lexicale demeure et soit indiquée en note.
- source_word: ወዝናም
  choice: pluie
  rationale: Équivalent concret et courant du terme météorologique guèze.
- source_word: ያዓርፍ ላዕሌሃ
  choice: reposent sur elle
  rationale: Préserve l’image élevée de phénomènes qui viennent se poser ou demeurer sur la terre, ainsi que l’accord collectif de l’énumération.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Observez » conserve l’appel à contempler la création ; les deux-points et la reprise « voyez comment » rendent fluide la syntaxe en français sans supprimer la structure d’observation du guèze. Les termes saisonniers traditionnels sont maintenus, avec l’éclairage culturel nécessaire en note.
