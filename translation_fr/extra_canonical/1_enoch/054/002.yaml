base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/002.yaml
  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: fr
  text: Et ils amèneront les rois et les puissants[a], puis les jetteront dans cette vallée profonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet n’est pas nommé dans ce verset. Le pronom « ils » renvoie probablement à des agents déjà évoqués dans la vision, peut-être des serviteurs angéliques.
    reason: alternative_reading
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: ils amèneront
  rationale: Le verbe pluriel exprime ici l’action d’amener ou de conduire. « Amèneront » est naturel en français et convient au déplacement des condamnés vers le lieu du jugement.
- source_word: ለነገሥት
  choice: les rois
  rationale: Le terme guèze désigne couramment des rois ou dirigeants; l’article défini convient aux personnages déjà visés dans cette scène de jugement.
- source_word: ወለኃያላን
  choice: et les puissants
  rationale: « Les puissants » conserve à la fois l’idée de puissance et la dimension sociale ou politique du terme, dans un registre apocalyptique digne mais courant.
- source_word: ይውድ ይዎሙ
  choice: puis les jetteront
  rationale: La locution décrit une projection énergique dans le lieu du jugement. « Jetteront » restitue clairement cette force; « puis » rend naturellement en français l’enchaînement des deux actions coordonnées.
- source_word: ውስተ
  choice: dans
  rationale: Avec le verbe « jeter », « dans » exprime naturellement en français le mouvement vers l’intérieur d’un lieu.
- source_word: ዝኩ
  choice: cette
  rationale: Le démonstratif renvoie à un endroit montré ou mentionné dans la vision; « cette » maintient ce renvoi déictique sans ajouter d’interprétation.
- source_word: ዕሙቅ
  choice: profonde
  rationale: L’adjectif indique la profondeur physique du lieu; « profonde » est simple, précis et imagé.
- source_word: ቈላ
  choice: vallée
  rationale: Le nom désigne une dépression ou une vallée. « Vallée » est l’équivalent français le plus direct et préserve l’image visible du lieu de jugement.
theological_decisions:
- issue: Identité du sujet non exprimé qui accomplit les actions
  choice: Employer simplement « ils » sans identifier les agents
  alternative: « les anges amèneront » ou « les serviteurs amèneront »
  rationale: Le guèze porte un verbe au pluriel mais ne nomme pas le sujet dans ce verset. Le contexte peut suggérer des agents angéliques, sans que le texte permette de l’affirmer ici; la traduction conserve donc cette ambiguïté.
translation_notes:
  register: Français moderne international, clair et digne. Le futur conserve la tonalité visionnaire, tandis que « les puissants » et « vallée profonde » maintiennent le registre apocalyptique sans archaïsme ni amplification.
