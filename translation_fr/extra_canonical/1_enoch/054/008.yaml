lexical_decisions:
- source_word: ይዴመሩ
  choice: seront réunis
  rationale: 'La forme est comprise comme un imperfectif passif ou réfléchi pluriel du verbe « joindre, unir, ajouter » : elle exprime donc ici une action future, « ils seront réunis ». Cette analyse corrige l’ancienne interprétation « mesurés ».'
- source_word: ወ
  choice: Et
  rationale: La conjonction préfixée se rend naturellement par « Et ». Le fragment fourni ne justifie pas un lien logique plus précis comme « alors ».
theological_decisions:
- issue: Degré de certitude possible pour une très brève proposition guèze isolée dans les Paraboles
  choice: Et ils seront réunis.
  alternative: Et ils s’uniront.
  rationale: Le passif « seront réunis » conserve la valeur grammaticale la plus probable sans préciser indûment ce qui est réuni ni par quel agent. Le contexte peut évoquer la réunion des eaux, mais le fragment transmis ne permet pas de l’inscrire explicitement dans le corps du verset.
translation_notes:
  register: Français moderne, simple et digne. « Réunis » est plus naturel que « joints ensemble » et évite un calque; le pronom masculin pluriel demeure faute d’antécédent présent dans le fragment fourni.
