  text: Et ils seront réunis[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition guèze fournie est très brève et isolée. Dans le contexte, le pronom peut renvoyer aux eaux mentionnées auparavant, mais le fragment ne les nomme pas.
    reason: textual_variant
  - marker: b
