base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: fr
  text: 'Et je demandai à l’ange de paix qui m’accompagnait : « Ces chaînes[b] d’instruments[a], pour qui sont-elles préparées ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze rendu par « instruments » est incertain dans ce témoin ; il peut désigner plus précisément des outils ou des dispositifs associés au châtiment.
    reason: textual_variant
  - marker: b
    text: 'Autres traductions possibles : « liens » ou « entraves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእእክዎ
  choice: je demandai à
  rationale: Le verbe introduit une question adressée à l’ange. « Je demandai à » est naturel en français et ne lui ajoute aucune nuance interprétative.
- source_word: መልአከ ሰላም
  choice: l’ange de paix
  rationale: Cette traduction conserve la formulation qui sert de titre au guide angélique dans le récit hénochien, sans la réduire à l’adjectif « paisible ».
- source_word: ዘየሐውር ምስሌየ
  choice: qui m’accompagnait
  rationale: La relative désigne l’ange comme compagnon de la vision. L’imparfait rend naturellement l’action en cours en français.
- source_word: እሉ እስረተ
  choice: ces chaînes
  rationale: Le démonstratif désigne des objets visibles dans la vision. « Chaînes » conserve l’image concrète, bien que « liens » ou « entraves » soient aussi possibles.
- source_word: መበልዕት
  choice: ces instruments
  rationale: La leçon transmise est incertaine. La mise en apposition, signalée par des tirets et explicitée en note, préserve la présence de ce terme difficile sans imposer une relation syntaxique artificiellement précise comme « chaînes d’instruments ».
- source_word: ለመኑ ይዴለዉ
  choice: pour qui sont-elles préparées
  rationale: La formulation conserve la question sur les destinataires futurs ainsi que la tournure passive et anticipatrice du texte.
theological_decisions:
- issue: Nature des objets punitifs montrés dans la vision
  choice: Conserver l’image concrète des « chaînes » et maintenir le terme incertain « instruments » en apposition.
  alternative: Traduire de manière interprétative par « chaînes de châtiment » ou « liens destinés au jugement ».
  rationale: Le passage décrit des objets visibles et interroge leur destination. Une formulation concrète respecte l’imagerie apocalyptique, tandis que la note signale honnêtement l’incertitude du témoin sans transformer ces objets en abstraction théologique.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple convient au récit littéraire ; « qui m’accompagnait » est plus naturel que le calque « qui allait avec moi ». Les tirets marquent la relation incertaine entre « chaînes » et le terme difficile traduit par « instruments ».
