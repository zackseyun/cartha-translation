base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/003.yaml
  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: fr
  text: Et là, mes yeux virent leurs instruments[a], tandis qu’ils fabriquaient ces chaînes de fer d’un poids incommensurable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs outils » ou « leurs ustensiles ». Le terme désigne les objets employés pour le travail décrit.
    reason: lexical_alternative
  - marker: b
    text: L’expression finale est liée à l’idée de pesée ou de poids. Une tradition de traduction la rend plutôt par « sans mesure » ou « sans limite ».
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ርእያ አዕይንትየ
  choice: mes yeux virent
  rationale: Conserve la formule visionnaire explicite et solennelle du guèze plutôt que de la réduire à « je vis ».
- source_word: ዘመባዕዕቲሆሙ
  choice: leurs instruments
  rationale: Rend le suffixe possessif de troisième personne du pluriel et maintient le sens assez large d’objets ou d’outils employés pour ce travail.
- source_word: እንዘ ይገብርዎሙ
  choice: tandis qu’ils en faisaient
  rationale: Exprime l’action en cours et représente le suffixe objet pluriel par « en », les objets fabriqués étant ensuite identifiés comme des chaînes de fer.
- source_word: መአስርተ ሐጺን
  choice: des chaînes de fer
  rationale: Restitue concrètement les dispositifs de ligature et leur matière, conformément à l’image de jugement.
- source_word: ዘአልቦ መደለውተ
  choice: d’un poids incommensurable
  rationale: Le substantif est lié à l’idée de pesée ou de poids; cette formulation française exprime un poids impossible à mesurer sans l’aplatir en simple abondance.
theological_decisions:
- issue: Nature des objets préparés dans la vision
  choice: Des chaînes de fer concrètes destinées à la ligature dans une scène de jugement
  alternative: Des instruments génériques de châtiment ou des liens purement métaphoriques
  rationale: Le vocabulaire de fabrication, de chaînes et de fer soutient une image matérielle. La traduction ne précise toutefois ni leur destination ni leur fonction au-delà de ce que dit le verset.
- issue: Valeur de l’expression finale
  choice: Elle qualifie le poids des chaînes comme incommensurable
  alternative: « sans mesure », pouvant suggérer une quantité ou une longueur illimitée
  rationale: Le lien lexical avec la pesée favorise ici le poids, mais une note conserve l’autre compréhension attestée par la tradition de traduction.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « mes yeux virent » conserve le relief apocalyptique; « tandis qu’ils en faisaient » évite une répétition lourde tout en représentant l’objet pluriel du verbe.
