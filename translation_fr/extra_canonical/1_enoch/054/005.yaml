base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: fr
  text: 'Il me dit : « Ceux-ci sont préparés pour la troupe d’Azaz’el[a], afin qu’on les saisisse et qu’on les jette au plus profond du lieu du jugement[b] ; puis on couvrira leurs mâchoires de pierres rugueuses[c], comme l’a ordonné le Seigneur des esprits. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « la troupe d’Azaz’el » est difficile dans le texte guèze. Elle peut aussi être comprise comme « l’œuvre d’Azaz’el » ou « ceux qui appartiennent à Azaz’el ».
    reason: textual_variant
  - marker: b
    text: Littéralement, l’expression est obscure. Elle a aussi été comprise comme « sous tout jugement », mais le contexte favorise ici la partie la plus basse d’un lieu de châtiment.
    reason: lexical_alternative
  - marker: c
    text: La transcription disponible porte une forme signifiant « leurs anges », probablement due à une confusion de lecture avec un mot très proche signifiant « leurs mâchoires » ou « leurs joues ». La grammaire et le parallèle de 1 Hénoch 10.4 favorisent cette dernière lecture.
    reason: textual_variant
lexical_decisions:
- source_word: ይዴለዉ
  choice: sont préparées
  rationale: Le verbe exprime ici la préparation ou la mise en état en vue du châtiment, plutôt qu’une simple existence.
- source_word: ለትዕይንተ አዛዜኤል
  choice: pour la troupe d’Azaz’el
  rationale: La forme transmise est difficile. Le contexte punitif et les pronoms pluriels favorisent un collectif associé à Azaz’el, sans imposer une nuance strictement militaire.
- source_word: ይትመጠውዎሙ
  choice: qu’on les saisisse
  rationale: Le verbe évoque le fait de prendre ou d’empoigner. « Saisir » convient à l’arrestation qui précède la projection dans le lieu du jugement.
- source_word: ወይደይዎሙ
  choice: qu’on les jette
  rationale: Le verbe décrit l’action de lancer ou précipiter ; « jeter » est naturel en français tout en maintenant la force de l’image.
- source_word: መትሕተ ኵሉ ደይን
  choice: au plus profond du lieu du jugement
  rationale: Dans cette scène, l’expression paraît spatiale et désigne la partie la plus basse d’un lieu de châtiment. Cette traduction évite le contresens abstrait « sous tout jugement » et n’importe pas le terme théologiquement chargé « enfer ».
- source_word: አእባኒ ጠያያነ
  choice: pierres rugueuses
  rationale: Le syntagme désigne des pierres dont l’adjectif suggère l’aspérité ou l’irrégularité, sans préciser qu’elles seraient nécessairement non taillées.
- source_word: ይክድኑ
  choice: on couvrira
  rationale: La forme est un pluriel actif, dans la continuité des agents non nommés des actions précédentes. Le français emploie naturellement « on » pour préserver cette indétermination.
- source_word: መላእክቲሆሙ (lecture transcrite), probablement መላትሒሆሙ
  choice: leurs mâchoires
  rationale: La leçon transcrite « leurs anges » est vraisemblablement une confusion graphique issue de l’OCR pour « leurs mâchoires/joues ». La syntaxe active et le parallèle de 1 Hénoch 10.4 appuient « leurs mâchoires ».
- source_word: እግዚአ መናፍስት
  choice: le Seigneur des esprits
  rationale: Cette formulation conserve le titre divin caractéristique des Paraboles d’Hénoch, sans lui substituer une désignation doctrinale ultérieure.
theological_decisions:
- issue: Identité du groupe associé à Azaz’el
  choice: un collectif associé à Azaz’el (« la troupe d’Azaz’el »)
  alternative: l’œuvre ou l’acte d’Azaz’el ; ceux qui appartiennent à Azaz’el
  rationale: Le texte transmis est difficile. Les pluriels qui suivent et le contexte du châtiment favorisent une référence collective, mais la note conserve les autres possibilités.
- issue: Nature du « lieu du jugement »
  choice: un lieu de châtiment situé dans la topographie apocalyptique du récit
  alternative: le jugement pris abstraitement ; l’enfer
  rationale: La formulation spatiale invite à comprendre un emplacement concret. « Lieu du jugement » préserve la cosmologie propre au texte sans l’identifier automatiquement à une conception ultérieure de l’enfer.
- issue: Lecture de l’objet couvert
  choice: les mâchoires des condamnés
  alternative: leurs anges ou leurs messagers
  rationale: Bien que la transcription fournie porte littéralement une forme correspondant à « leurs anges », l’analyse paléographique signalée et la construction grammaticale indiquent une erreur d’OCR. « Leurs mâchoires » rend le texte corrigé le plus probable, tandis que la note rend la difficulté transparente.
translation_notes:
  register: Français international moderne, digne et lisible. Le discours apocalyptique reste concret sans archaïsmes. Les agents du châtiment demeurent indéterminés par l’emploi de « on », conformément aux verbes pluriels sans sujet explicite. Les incertitudes textuelles majeures sont signalées plutôt que résolues silencieusement.
