base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
translation:
  language: fr
  text: Je regardai, puis je me tournai vers une autre région de la terre[a], et je vis là une vallée profonde où brûlait un feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une autre face de la terre », expression désignant une autre région ou un autre côté de la terre.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « une vallée profonde embrasée par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: Je regardai
  rationale: Rend le premier verbe de perception sans le confondre avec ርኢኩ, traduit ensuite par « je vis », et préserve la progression du récit visionnaire.
- source_word: ተመየጥኩ
  choice: je me tournai
  rationale: Exprime naturellement en français le changement d’orientation ou d’attention du voyant.
- source_word: ካልአ ገጸ ምድር
  choice: une autre région de la terre
  rationale: Le guèze dit littéralement « une autre face de la terre » ; « région » communique clairement le sens spatial tout en conservant la portée cosmographique.
- source_word: ርኢኩ
  choice: je vis
  rationale: Équivalent français direct du principal verbe de perception visionnaire.
- source_word: ህየ
  choice: là
  rationale: Adverbe déictique naturel renvoyant au lieu vers lequel le voyant vient de se tourner.
- source_word: ቈላ ዕሙቀ
  choice: une vallée profonde
  rationale: Rend simplement l’image topographique d’une vallée ou dépression caractérisée par sa profondeur, sans préciser indûment la nature du terrain.
- source_word: እንዘ ትነድድ እሳት
  choice: où brûlait un feu
  rationale: La proposition circonstancielle décrit le feu en pleine combustion dans la vallée ; cette formulation française est naturelle et conserve la valeur verbale de l’expression.
