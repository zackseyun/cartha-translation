base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: fr
  text: Michel, Gabriel, Raphaël et Phanuel se saisiront d’eux[a] en ce grand jour et, ce jour-là, les jetteront dans la fournaise ardente, afin que le Seigneur des Esprits exerce sa vengeance contre eux à cause de leur injustice, car ils sont devenus des serviteurs de Satan[b] et ont égaré ceux qui habitent sur la terre ferme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’empareront d’eux ». Le verbe guèze désigne une prise ferme, mais sa nuance exacte est difficile à déterminer dans cette section conservée essentiellement en guèze.
    reason: lexical_alternative
  - marker: b
    text: L’expression traduite par « serviteurs de Satan » est difficile sur les plans textuel et lexical. « Esclaves de Satan » ou, de façon moins probable, « messagers de Satan » sont aussi possibles.
    reason: textual_variant
  - marker: c
    text: Littéralement « sur la terre ferme ». L’expression peut simplement désigner les habitants de la terre, mais son caractère concret a été conservé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያፀንዕዎሙ
  choice: se saisiront d’eux
  rationale: Le verbe exprime une prise ferme ou énergique. Cette formulation conserve la force de l’action sans préciser indûment qu’ils les lient.
- source_word: ዕለት ዐባይ
  choice: ce grand jour
  rationale: Rend directement la formule apocalyptique sans ajouter explicitement l’idée de jugement.
- source_word: እቶን ዘይነድድ
  choice: la fournaise ardente
  rationale: Conserve l’image concrète et punitive dans un français naturel et digne.
- source_word: ይወድይዎሙ
  choice: les jetteront dans
  rationale: Exprime clairement l’action violente de précipiter les condamnés dans la fournaise.
- source_word: ይትበቀል
  choice: tire vengeance d’eux
  rationale: Préserve la force rétributive du verbe et la tension du langage de jugement.
- source_word: በዓመፃሆሙ
  choice: pour leur révolte
  rationale: Le terme peut désigner la transgression, l’iniquité ou la rébellion. « Révolte » restitue ici sa forte portée morale et oppositionnelle.
- source_word: ላእከ ሰሰይጣን
  choice: serviteurs de Satan
  rationale: Cette lecture exprime l’appartenance au service de Satan sans imposer la nuance plus forte d’esclavage ni la lecture moins probable de messagers.
- source_word: አስኀትዎሙ
  choice: ont égaré
  rationale: Rend naturellement l’idée de faire errer ou de détourner du bon chemin.
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: ceux qui habitent sur la terre ferme
  rationale: Maintient l’expression cosmologique concrète de l’éthiopien plutôt que de la réduire au simple mot « terre ».
theological_decisions:
- issue: Faut-il atténuer le langage du châtiment ?
  choice: Conserver explicitement la vengeance et la fournaise ardente.
  alternative: Parler de façon plus générale de punition ou de jugement.
  rationale: Le texte relève du discours apocalyptique de jugement. En atténuer les images effacerait une tension théologique réellement présente dans la source.
- issue: Comment décrire le rapport des condamnés à Satan ?
  choice: Ils sont devenus des serviteurs de Satan.
  alternative: Ils sont devenus des esclaves ou des messagers de Satan.
  rationale: « Serviteurs » conserve l’idée d’allégeance et de service sans trancher en faveur d’un statut d’esclave ni d’une fonction technique de messager.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase garde le rythme solennel et les images judiciaires du registre apocalyptique. Les noms propres suivent leurs formes françaises usuelles.
