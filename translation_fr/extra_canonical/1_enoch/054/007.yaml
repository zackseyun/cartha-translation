base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: fr
  text: En ces jours-là, le châtiment du Seigneur des esprits viendra, et tous les réservoirs des eaux[b] qui sont au-dessus des cieux, [ainsi que les sources qui sont sous les cieux][a] et les sources qui sont sous la terre seront ouverts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le membre de phrase placé entre crochets est textuellement incertain : il peut refléter une perturbation ou une répétition dans le témoin.'
    reason: textual_variant
  - marker: b
    text: Les « réservoirs des eaux » relèvent de l’ancienne représentation cosmologique selon laquelle des eaux célestes étaient gardées en réserve pour l’usage divin, notamment lors du jugement.
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: jours
  rationale: Avec በውእቱ, le terme forme la formule apocalyptique « en ces jours-là », naturelle en français et fidèle à l’expression temporelle guèze.
- source_word: መቅሠፍቱ
  choice: châtiment
  rationale: Le mot désigne une affliction punitive relevant du jugement. « Châtiment » conserve cette force judiciaire sans préciser indûment la forme du fléau.
- source_word: እግዚአ መናፍስት
  choice: Seigneur des esprits
  rationale: Cette traduction préserve le titre apocalyptique caractéristique du livre sans ajouter d’article absent de la construction traditionnelle du titre.
- source_word: ታርሑ
  choice: seront ouverts
  rationale: Le passif convient aux réservoirs et aux sources que le jugement divin met en action, tout en conservant l’image concrète de leur ouverture.
- source_word: መዛግብተ
  choice: réservoirs
  rationale: Dans ce contexte cosmologique, le mot évoque des lieux où les eaux sont retenues en réserve. « Réservoirs » est plus immédiatement intelligible en français moderne que « trésors » ou « magasins ».
- source_word: ማያት
  choice: eaux
  rationale: Le pluriel rend la forme guèze et l’ampleur cosmique des masses d’eau célestes.
- source_word: ዘመልዕልተ ሰማያት
  choice: qui sont au-dessus des cieux
  rationale: La formulation maintient la représentation stratifiée du cosmos présente dans le texte.
- source_word: አንቅዕተ
  choice: sources
  rationale: Le terme désigne ici des points d’origine ou de jaillissement des eaux. « Sources » est naturel, digne et adapté aux eaux souterraines.
- source_word: መትሕተ ምድር
  choice: sous la terre
  rationale: Traduction spatiale directe et idiomatique, qui conserve l’opposition avec les eaux situées au-dessus des cieux.
theological_decisions:
- issue: Nature du jugement à venir
  choice: Un jugement cosmique au cours duquel sont ouverts les réservoirs célestes et les sources inférieures.
  alternative: Un châtiment général sans référence concrète à un déluge, ou une image purement métaphorique.
  rationale: Le texte nomme explicitement les eaux célestes et les sources inférieures. La traduction conserve donc l’imagerie apocalyptique concrète sans déterminer davantage la nature exacte de l’événement.
translation_notes:
  register: Français international moderne, clair et digne. La formule apocalyptique « en ces jours-là » et le titre « Seigneur des esprits » sont conservés. Les crochets signalent dans le corps du texte le membre de phrase incertain plutôt que de le supprimer ou de résoudre silencieusement la difficulté.
