base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: fr
  text: Et ils m’emmenèrent jusqu’aux eaux vives[a], et jusqu’au feu de l’occident, qui reçoit chaque coucher du soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression éthiopienne placée entre crochets après « eaux vives » est incertaine dans ce témoin. Elle pourrait se comprendre comme « qui parle », mais le texte est peut-être altéré; elle n’est donc pas rendue dans le texte principal.
    reason: textual_variant
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: Et ils m’emmenèrent
  rationale: Le verbe ነሥአ peut signifier prendre, porter ou emmener. Dans le cadre de ce voyage visionnaire guidé, « m’emmenèrent » exprime naturellement le déplacement sans préciser qu’Hénoch aurait été physiquement porté.
- source_word: እስከ
  choice: jusqu’à / jusqu’aux
  rationale: La préposition répétée marque l’étendue ou la destination et relie les deux lieux successivement atteints.
- source_word: ማያት ሕያዋን
  choice: les eaux vives
  rationale: Il s’agit d’une construction nom-adjectif signifiant littéralement « eaux vivantes ». « Eaux vives » conserve cette forme tout en restant naturel et digne en français.
- source_word: '[ዘይትናገር]'
  choice: omis du texte principal
  rationale: Le mot est signalé comme incertain dans le témoin et donnerait difficilement « qui parlent » dans ce contexte. L’incertitude est conservée en note plutôt que résolue arbitrairement.
- source_word: እሳት ዐረብ
  choice: le feu de l’occident
  rationale: ዐረብ renvoie ici à l’ouest, région du soir et du coucher solaire. Cette traduction maintient la géographie cosmique concrète de la vision.
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርበተ ፀሐይ
  choice: qui reçoit chaque coucher du soleil
  rationale: La proposition relative représente le feu occidental comme accueillant le soleil lorsqu’il se couche. « Chaque coucher du soleil » rend ኵሎ sans suggérer plusieurs couchers simultanés.
theological_decisions:
- issue: Caractère de l’imagerie cosmique dans le voyage visionnaire
  choice: Conserver les « eaux vives » et le « feu de l’occident » comme lieux concrets de la vision
  alternative: Interpréter ces expressions symboliquement ou les remplacer par des phénomènes naturels génériques
  rationale: Le passage décrit une géographie cosmique révélée. La traduction préserve donc son étrangeté et sa tension propres sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au récit visionnaire écrit. L’expression « eaux vives » respecte la syntaxe éthiopienne tout en gardant la résonance apocalyptique; aucune harmonisation avec d’autres traditions scripturaires n’est recherchée.
