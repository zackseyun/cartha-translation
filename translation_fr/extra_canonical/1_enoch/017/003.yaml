base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: fr
  text: Et je vis les lieux[a] des lumières et du tonnerre, aux extrémités, dans la profondeur[b], là où se trouvaient un arc de feu, des flèches avec leur carquois, une épée de feu et tous les éclairs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les réserves ». Dans ce contexte visionnaire, le mot peut désigner des lieux où sont gardés des phénomènes cosmiques.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le texte juxtapose deux indications : « aux extrémités » et « dans la profondeur ». Leur rapport exact demeure incertain.'
    reason: source_ambiguity
lexical_decisions:
- source_word: መካናተ
  choice: les lieux
  rationale: Le terme désigne ici des emplacements cosmiques. « Les lieux » reste proche du sens lexical sans imposer l’idée plus interprétative de dépôts célestes.
- source_word: ብርሃናት
  choice: les lumières
  rationale: Le pluriel désigne des lumières ou phénomènes lumineux. « Lumières » évite de les confondre avec les éclairs explicitement mentionnés à la fin du verset.
- source_word: ነጐድጓድ
  choice: le tonnerre
  rationale: Le singulier collectif est naturel en français et rend précisément le phénomène désigné.
- source_word: ውስተ አጽናፍ
  choice: aux extrémités
  rationale: Cette formulation conserve la première indication spatiale, qui évoque les confins du monde visionnaire.
- source_word: ኀበ ዕመቃ
  choice: dans la profondeur
  rationale: La seconde indication spatiale est maintenue séparément afin de ne pas fusionner les deux syntagmes guèzes.
- source_word: ቀሥተ እሳት
  choice: un arc de feu
  rationale: Traduction directe qui conserve l’image d’une arme enflammée.
- source_word: ሐጾ ወምጕንጻቲሆሙ
  choice: des flèches avec leur carquois
  rationale: Le choix restitue clairement l’ensemble formé par les flèches et le carquois qui leur est associé.
- source_word: ሰይፈ እሳት
  choice: une épée de feu
  rationale: La formulation littérale préserve la force de l’imagerie apocalyptique.
- source_word: መበርቅት ኵሉ
  choice: tous les éclairs
  rationale: Le pluriel accompagné de « tous » exprime la totalité des éclairs recensés dans la vision.
theological_decisions:
- issue: Nature des lieux cosmiques
  choice: des lieux où se trouvent les phénomènes énumérés
  alternative: des réserves ou dépôts célestes de phénomènes cosmiques
  rationale: Le texte présente des réalités cosmiques rassemblées dans des régions éloignées, mais le mot መካናተ n’oblige pas à préciser qu’il s’agit de « réserves ». La traduction conserve donc l’imagerie sans transformer une possibilité contextuelle en affirmation explicite.
- issue: Rapport entre les deux indications spatiales
  choice: maintenir « aux extrémités » et « dans la profondeur » comme deux expressions distinctes
  alternative: les fondre en une seule expression telle que « dans les profondeurs les plus reculées »
  rationale: Le guèze comporte deux syntagmes prépositionnels distincts. Les conserver laisse intacte la topographie cosmique énigmatique de la vision.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le caractère énumératif de la vision ainsi que son imagerie cosmique et guerrière, tout en restant intelligible pour un lectorat général.
