base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: fr
  text: Ils m’emmenèrent jusqu’à un lieu de tourbillon[a], et jusqu’à une montagne dont le sommet atteignait le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un lieu de tempête » ou « un lieu de tourmente ». Le terme guèze évoque une violente agitation atmosphérique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: Ils m’emmenèrent
  rationale: Le verbe exprime le fait de prendre ou de conduire quelqu’un. « Emmenèrent » rend naturellement le déplacement visionnaire sans préciser s’il s’agit de guider ou de porter.
- source_word: መካን
  choice: lieu
  rationale: Terme locatif général, rendu sans ajouter de précision géographique absente du texte.
- source_word: ዘዐውሎ
  choice: de tourbillon
  rationale: Cette expression évoque une violente agitation atmosphérique. « Tourbillon » conserve la force de l’image apocalyptique, tandis que « tempête » reste une possibilité.
- source_word: ውስተ
  choice: vers
  rationale: Avec un verbe de mouvement, la préposition peut indiquer un déplacement vers un lieu ou à l’intérieur de celui-ci. « Vers » convient aux deux compléments et évite de suggérer une entrée dans la montagne.
- source_word: ደብር
  choice: montagne
  rationale: Rendu courant et naturel du relief élevé décrit dans la vision.
- source_word: ዘክተማ ርእሱ
  choice: dont le sommet
  rationale: L’expression désigne littéralement la tête ou le haut de la montagne. « Sommet » est idiomatique et préserve l’image verticale.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: atteignait le ciel
  rationale: La phrase décrit une extension jusqu’au ciel. Cette formulation française est concise et conserve l’image cosmique.
theological_decisions:
- issue: Sens de ሰማይ dans le contexte d’une ascension apocalyptique
  choice: le ciel
  alternative: les cieux
  rationale: Le mot peut désigner le ciel visible ou la sphère céleste. Le singulier « le ciel » préserve cette amplitude sémantique sans imposer une cosmologie doctrinale plus précise.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au récit visionnaire écrit. La répétition de « vers » conserve le parallélisme de la source tout en évitant l’idée peu naturelle d’entrer à l’intérieur d’une montagne.
