base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/007.yaml
  text: And I saw the mountains of the darkness of winter and the place where all the waters of the deep flow[a][b].
translation:
  language: fr
  text: Et je vis les montagnes des ténèbres de l’hiver et le lieu d’où s’écoulent toutes les eaux de l’abîme.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze fourni pour ce verset est très court et ne contient que : « Et je vis les montagnes. » La suite est restituée d’après le texte guèze complet de l’édition Charles (1906), signalé dans l’histoire des révisions.'
    reason: textual_variant
  - marker: b
    text: 'Le fragment guèze fourni peut se traduire simplement : « Et je vis les montagnes. » Un témoin grec porte « les vents » au lieu de « les montagnes ».'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Le verbe à la première personne introduit le récit visionnaire d’Hénoch. « Et je vis » restitue simplement la conjonction et le verbe, dans un registre narratif digne et naturel.
- source_word: አድባረ
  choice: les montagnes
  rationale: Le nom pluriel désigne concrètement des montagnes. L’article défini convient au paysage déterminé décrit par la suite dans le texte complet signalé par la tradition éditoriale.
- source_word: ጽልመተ፡ ክረምት
  choice: des ténèbres de l’hiver
  rationale: Cette formulation conserve la construction imagée et sa possible rudesse apocalyptique sans en expliciter artificiellement le sens.
- source_word: ወኀበ፡ ይውሕዝ፡ ኵሉ፡ ማያተ፡ ቀላይ
  choice: et le lieu d’où s’écoulent toutes les eaux de l’abîme
  rationale: « D’où s’écoulent » rend naturellement le lieu associé à l’écoulement; « l’abîme » exprime ici la masse profonde des eaux sans réduire l’image à une mer ordinaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et visionnaire. La tournure « ténèbres de l’hiver » est volontairement conservée malgré son étrangeté afin de ne pas résoudre une image ambiguë du texte. Les notes rendent transparente la différence entre le fragment fourni, le texte guèze complet attesté dans les données éditoriales et la variante grecque.
