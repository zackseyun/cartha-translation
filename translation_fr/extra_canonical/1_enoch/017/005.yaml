base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: fr
  text: Et j’arrivai à un fleuve de feu, dont le feu coulait comme de l’eau et se déversait dans la grande mer, en direction de l’ouest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière expression signifie littéralement quelque chose comme « en direction de ʿArab ». Elle peut désigner le côté occidental, d’où la traduction « en direction de l’ouest »; certains peuvent toutefois y voir une référence géographique à l’Arabie.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጻእኩ
  choice: j’arrivai
  rationale: Le verbe de mouvement à la première personne s’inscrit dans le récit d’un voyage visionnaire. « J’arrivai » est naturel en français et marque l’atteinte d’un lieu sans préciser indûment le trajet.
- source_word: ፈለገ እሳት
  choice: un fleuve de feu
  rationale: « Fleuve » convient à un cours d’eau qui se déverse dans une grande mer et conserve l’ampleur de l’image apocalyptique; « de feu » traduit littéralement sa nature visionnaire.
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: dont le feu coulait comme de l’eau
  rationale: La relative et le possessif sont conservés, de même que la comparaison étrange du feu se comportant comme de l’eau.
- source_word: ይትከዐው
  choice: se déversait
  rationale: Ce verbe exprime l’écoulement ou le déversement dans une étendue plus vaste; « se déversait » est idiomatique avec un fleuve et une mer.
- source_word: ባሕር ዐቢይ
  choice: la grande mer
  rationale: Traduction formelle qui maintient le registre géographique élevé et la possibilité d’une désignation conventionnelle.
- source_word: መንገለ ዐረብ
  choice: en direction de l’ouest
  rationale: L’expression peut désigner le côté occidental. Le contexte d’un fleuve se jetant dans la grande mer favorise ce sens, tout en laissant subsister une possible référence géographique à l’Arabie, signalée en note.
theological_decisions:
- issue: Nature du fleuve de feu
  choice: 'Conserver une description visionnaire concrète : « un fleuve de feu, dont le feu coulait comme de l’eau »'
  alternative: Interpréter explicitement le fleuve comme une métaphore du jugement
  rationale: Le texte décrit un paysage cosmique impossible comme une réalité contemplée dans la vision. La traduction ne doit ni rationaliser ni expliquer théologiquement cette image.
translation_notes:
  register: Français moderne, international et digne. Le passé simple soutient le registre narratif visionnaire; la syntaxe demeure claire pour un lectorat général. L’image apocalyptique et l’ambiguïté géographique finale sont préservées.
