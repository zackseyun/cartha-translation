base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: fr
  text: Ils m’emmenèrent dans un lieu où ceux qui s’y trouvaient étaient semblables à un feu ardent et, chaque fois qu’ils le voulaient, ils se montraient[a] comme des êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils apparaissaient comme des êtres humains ». Le verbe peut exprimer le fait de se rendre visibles ou de se manifester.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: Ils m’emmenèrent
  rationale: Le verbe exprime l’action de prendre ou d’emporter quelqu’un. « Emmenèrent » rend naturellement le déplacement visionnaire sans en préciser indûment le mode.
- source_word: ውስተ አሐዱ መካን
  choice: dans un lieu
  rationale: Littéralement « dans un lieu/un certain lieu ». En français moderne, « dans un lieu » conserve l’indétermination sans la lourdeur de « dans un seul lieu ».
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: où ceux qui s’y trouvaient
  rationale: Cette formulation restitue clairement la proposition locale et désigne les habitants sans déterminer leur nature.
- source_word: ከመ እሳት ዘይነድድ
  choice: étaient semblables à un feu ardent
  rationale: La comparaison explicite est maintenue. « Feu ardent » rend l’image du feu qui brûle dans un français naturel et digne.
- source_word: ወሶበ ይፈቅዱ
  choice: et, chaque fois qu’ils le voulaient
  rationale: La tournure exprime à la fois la volonté et la possibilité répétée dans le temps.
- source_word: ያስተርእዩ
  choice: ils se montraient
  rationale: La forme comporte une nuance causative ou réflexive de manifestation visible. « Se montraient » la conserve mieux que le simple « apparaissaient ».
- source_word: ከመ ሰብእ
  choice: sous forme humaine
  rationale: Le sens porte sur une apparence comparable à celle des êtres humains. Cette formulation est idiomatique et n’impose pas le sexe masculin comme élément de l’image.
theological_decisions:
- issue: Identité des êtres semblables au feu
  choice: Les désigner uniquement par « ceux qui s’y trouvaient »
  alternative: Les appeler anges, esprits ou Veilleurs
  rationale: Le verset décrit leur apparence sans nommer explicitement leur catégorie. La traduction évite donc d’importer une identification tirée du contexte plus large.
- issue: Nature de leur apparence humaine
  choice: « ils se montraient sous forme humaine »
  alternative: « ils apparaissaient comme des hommes »
  rationale: Le choix conserve l’idée qu’ils rendent visible une apparence humaine sans trancher la question de leur nature propre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit visionnaire écrit. La formulation reste descriptive et préserve l’ambiguïté sur l’identité des êtres.
