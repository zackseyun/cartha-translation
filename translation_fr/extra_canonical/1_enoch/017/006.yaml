base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/006.yaml
  text: And I saw great rivers[a], and I reached as far as the great darkness[c][b], and I went to where no flesh walks.
translation:
  language: fr
  text: Et je vis de grands fleuves, je parvins jusqu’aux grandes ténèbres, et j’allai là où aucune créature de chair ne marche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien transcrit présente probablement une erreur de reconnaissance : il faut vraisemblablement lire la particule négative ኢ, « ne… pas ». Le texte grec confirme la négation : « là où aucune chair ne marche ».'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: Et je vis
  rationale: Verbe courant de perception dans un récit visionnaire; « je vis » est naturel et conserve la progression narrative.
- source_word: ዐበይተ አፍላገ
  choice: de grands fleuves
  rationale: Le pluriel désigne de grands cours d’eau; « fleuves » maintient l’ampleur de la géographie cosmique.
- source_word: ወእስከ ዐቢይ ጽልመት በጻሕኩ
  choice: j’atteignis les grandes ténèbres
  rationale: እስከ marque ici la limite atteinte au cours du voyage. Le français évite la tournure redondante « j’atteignis jusqu’à » tout en conservant l’arrivée à cette limite.
- source_word: ወሖርኩ ኀበ
  choice: et j’allai là où
  rationale: Rend simplement le déplacement vers le lieu introduit par ኀበ et préserve la cadence répétitive du récit.
- source_word: ኵሉ ሥጋ
  choice: aucun être de chair
  rationale: Avec la négation verbale confirmée par le témoin grec, l’expression signifie idiomatiquement qu’aucun être charnel ne s’y déplace. Cette formulation française conserve la portée large de l’expression sémitique sans la limiter aux seuls humains.
- source_word: 'ኢያንሶሱ (OCR : (አ)ያንሶሱ)'
  choice: ne marche
  rationale: La lecture négative du verbe, appuyée par le grec οὐ περιπατεῖ, corrige une probable erreur d’OCR et exprime l’absence de déplacement pédestre dans ce domaine.
theological_decisions:
- issue: 'Portée de « toute chair » : humanité seulement ou ensemble des êtres charnels'
  choice: aucun être de chair
  alternative: aucun humain / aucune créature vivante
  rationale: La formule source reste large. « Être de chair » préserve cette amplitude sans décider s’il s’agit exclusivement de l’humanité ou plus généralement des créatures corporelles.
- issue: Présence ou absence de la négation dans le dernier verbe
  choice: 'lecture négative : « ne marche »'
  alternative: 'lecture positive fondée sur l’OCR : « erre »'
  rationale: Le caractère initial semble être une lecture OCR fautive de la particule négative ኢ; le témoin grec confirme explicitement la négation. La lecture positive inverserait le sens du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre visionnaire et la succession narrative. « Grandes ténèbres » conserve l’expression apocalyptique concrète sans l’interpréter métaphoriquement.
