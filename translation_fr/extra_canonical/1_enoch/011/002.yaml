base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: fr
  text: La paix et la vérité seront associées durant tous les jours du monde et dans toutes les générations du monde[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront unies ». Le terme guèze évoque le fait d’être associées, compagnes ou alliées.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « durant tous les jours du monde et dans toutes les générations du monde ». « Jours du monde » est une expression temporelle qui désigne la durée du monde.'
    reason: idiom_clarification
lexical_decisions:
- source_word: ሰላም
  choice: paix
  rationale: Équivalent français courant du terme guèze, qui peut aussi évoquer le bien-être et la plénitude.
- source_word: ርትዕ
  choice: vérité
  rationale: Rend le sens principal du nom guèze tout en conservant le parallélisme traditionnel « paix et vérité »; « droiture » reste possible selon le contexte.
- source_word: ሱቱፋነ ይከውኑ
  choice: abonderont
  rationale: Le groupe formé avec le verbe « être/devenir » exprime ici naturellement l'abondance ou la multiplication. « Abonderont » est idiomatique en français et évite de faire de la paix et de la vérité des objets que quelqu'un multiplierait.
- source_word: በኵሉ መዋዕለ ዓለም
  choice: pendant tous les jours du monde
  rationale: መዋዕል est compris ici au sens de « jours », conformément à l'expression temporelle sémitique; « pendant tous » exprime l'étendue complète dans le temps.
- source_word: በኵሉ ትውልደ ዓለም
  choice: dans toutes les générations du monde
  rationale: Traduction proche de la structure guèze, qui souligne la succession de toutes les générations.
theological_decisions:
- issue: Portée temporelle de la bénédiction
  choice: 'Maintenir la double totalité: tous les jours et toutes les générations du monde.'
  alternative: Limiter l'énoncé à un seul âge eschatologique.
  rationale: La répétition de በኵሉ, « tout/toutes », donne à la formule une portée globale et continue, sans imposer un calendrier eschatologique particulier.
- issue: Relation entre la paix et la vérité
  choice: Les traiter comme deux réalités coordonnées qui « abonderont ».
  alternative: Traduire qu'elles « seront associées » ou « seront partenaires ».
  rationale: Le contexte grammatical permet une lecture d'abondance; elle s'accorde avec le témoignage lexical fourni, tout en laissant l'autre analyse signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. Le futur « abonderont » rend naturellement l'idée d'une abondance durable. La répétition de « du monde » est conservée pour respecter l'emphase et la cadence de l'original.
