base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: fr
  text: En ces jours-là, j’ouvrirai les réserves de bénédiction qui sont dans le ciel, afin de les faire descendre sur la terre, sur leur œuvre et sur leur labeur, pour les êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: En ces jours-là
  rationale: Formule temporelle apocalyptique courante; መዋዕል signifie bien « jours » et non « portes ».
- source_word: እፈትሕ
  choice: j’ouvrirai
  rationale: Imparfait éthiopien à valeur future, à la première personne du singulier.
- source_word: መዛግብተ፡ በረከት
  choice: les réserves de bénédiction
  rationale: Expression concrète désignant des lieux où la bénédiction est tenue en réserve; le singulier abstrait በረከት est conservé.
- source_word: በሰማይ
  choice: dans le ciel
  rationale: Le singulier du texte source est conservé dans une formulation française naturelle.
- source_word: ከመ፡ አውርዶሙ
  choice: afin de les faire descendre
  rationale: Rend à la fois la proposition de but et la forme causative du verbe « descendre » avec son objet pluriel.
- source_word: ዲበ፡ ምድር
  choice: sur la terre
  rationale: Le contexte cosmique favorise « terre » plutôt que « pays ».
- source_word: ዲበ፡ ግብሮሙ፡ ወዲበ፡ ፃማሆሙ
  choice: sur l’œuvre et le labeur
  rationale: Distingue ግብር, œuvre ou travail accompli, de ፃማ, labeur, peine ou effort; ce dernier ne signifie pas « descendance ».
- source_word: ለውሉደ፡ ሰብእ
  choice: des êtres humains
  rationale: Rend naturellement en français moderne l’idiome « enfants des hommes » sans limiter le référent aux hommes de sexe masculin.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Ne pas nommer explicitement le locuteur dans la traduction.
  alternative: Ajouter « Dieu » ou « le Très-Haut ».
  rationale: Le contexte permet de comprendre une parole divine, mais le verset lui-même ne donne aucun titre; l’ajout résoudrait explicitement ce que la forme du texte laisse implicite.
- issue: Portée de « enfants des hommes »
  choice: des êtres humains
  alternative: des enfants des hommes
  rationale: L’expression est un idiome collectif désignant l’humanité; la formulation retenue est inclusive, exacte et plus naturelle en français contemporain.
- issue: Nombre de « bénédiction »
  choice: bénédiction au singulier
  alternative: bénédictions
  rationale: Le substantif guèze est singulier et peut fonctionner comme un collectif ou un nom abstrait; le français permet le même emploi.
- issue: Rapport syntaxique de « sur leur œuvre et sur leur labeur »
  choice: Conserver la coordination après « sur la terre ».
  alternative: Reformuler comme une bénédiction accordée « en récompense de » leur travail.
  rationale: Le texte exprime spatialement la descente de la bénédiction sur la terre et sur l’activité humaine; il ne faut pas introduire une notion explicite de mérite ou de récompense.
translation_notes:
  register: Français international moderne, digne et lisible. « Réserves » garde l’image cosmique de lieux de stockage tout en évitant l’ambiguïté moderne de « trésors ». « Œuvre et labeur » conserve le parallélisme et la légère solennité du texte.
