translation:
  language: fr
  text: '(1) De là, il poursuivait son chemin avec son père Joseph, lorsqu’une personne qui courait le heurta à l’épaule. Jésus lui dit : « Sois maudit à cause de ton chef ! »[a]


    Et aussitôt, cette personne mourut.


    Ceux qui la virent mourir sur-le-champ s’écrièrent : « D’où vient cet enfant, pour que sa parole devienne réalité ? »


    (2) Quand les parents de l’enfant mort virent ce qui s’était passé, ils firent des reproches à Joseph, son père : « D’où que te vienne cet enfant, tu ne peux pas vivre avec nous dans ce village. Si tu veux rester ici, apprends-lui à bénir et non à maudire, car notre enfant nous a été enlevé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule « à cause de ton chef » suit littéralement le témoin anglais fourni. Son sens demeure incertain en attendant une vérification directe de la tradition manuscrite grecque.
    reason: Signaler une expression inhabituelle dont le texte grec n’a pas encore été directement examiné, sans effacer ni résoudre son ambiguïté.
lexical_decisions:
- source_word: leader (Greek wording pending review)
  choice: chef
  rationale: Conserve le sens le plus direct du témoin anglais tout en maintenant l’étrangeté de la formule, sans proposer une interprétation absente des données fournies.
- source_word: his word becomes deed
  choice: sa parole devienne réalité
  rationale: Expression française naturelle qui garde l’idée qu’une parole prononcée produit immédiatement son effet.
- source_word: has been taken away from us
  choice: nous a été enlevé
  rationale: Préserve la formulation indirecte et le sentiment de dépossession des parents sans expliciter davantage la cause de la mort.
theological_decisions:
- issue: Rapport entre la malédiction de Jésus et la mort immédiate
  choice: Maintenir la succession narrative sans ajouter explicitement un lien causal.
  alternative: 'Traduire : « À cause de cette malédiction, il mourut aussitôt. »'
  rationale: Le témoin fourni juxtapose la parole et la mort, mais n’énonce pas formellement la causalité; la traduction préserve cette tension.
- issue: Sens de la formule « because of your leader »
  choice: Conserver littéralement « à cause de ton chef » et signaler l’incertitude.
  alternative: Remplacer par une formule interprétative telle que « maudit sois-tu jusqu’à ton dernier jour » ou « à cause de celui qui te dirige ».
  rationale: La formule est inhabituelle et la révision directe du grec reste à faire; aucune harmonisation doctrinale ou narrative n’est donc justifiée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été rendue fluide pour un lectorat général, tout en conservant la brutalité du récit et son absence d’explication morale. Projet provisoire fondé sur le témoin anglais du domaine public fourni; révision sur le grec requise.
