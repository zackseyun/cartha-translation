  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: fr
  text: '(1) Le fils d’Anne, le grand prêtre, dit à Jésus : « Pourquoi fais-tu une chose pareille pendant le sabbat ? » Puis il prit une baguette de saule, détruisit les bassins, laissa s’écouler l’eau que Jésus avait recueillie et fit sécher ce qui s’y était amassé[a].


    (2) Mais quand Jésus vit ce qui était arrivé, il lui dit : « Ton fruit n’aura pas de racine, et ton rejeton se desséchera comme une branche brûlée dans un vent violent ! »


    (3) Aussitôt, cet enfant se dessécha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression du témoin, littéralement « leurs rassemblements », est obscure ; elle semble désigner ce qui s’était accumulé dans les bassins, probablement l’eau recueillie.
    reason: Signaler une ambiguïté réelle du témoin anglais utilisé comme base provisoire, dans l’attente d’une vérification directe du grec.
lexical_decisions:
- source_word: Sabbath
  choice: sabbat
  rationale: Terme français courant et précis pour le jour sacré juif, sans le réduire au simple samedi civil.
- source_word: willow twig
  choice: baguette de saule
  rationale: « Baguette » évoque une petite branche souple employée comme instrument et convient au geste décrit.
- source_word: pools
  choice: bassins
  rationale: Désigne naturellement de petites retenues d’eau façonnées par Jésus dans le contexte immédiat.
- source_word: fruit
  choice: fruit
  rationale: Conserve l’image végétale et sa portée potentiellement symbolique sans l’interpréter.
- source_word: shoot
  choice: rejeton
  rationale: Maintient à la fois l’image d’une jeune pousse et la possible allusion à la descendance.
- source_word: withered away
  choice: se dessécha
  rationale: Reprend délibérément le vocabulaire végétal de la parole prononcée au verset précédent.
theological_decisions:
- issue: Portée de la parole de Jésus et nature du dépérissement de l’enfant
  choice: Employer le même champ lexical végétal (« se desséchera », « se dessécha ») sans expliquer le phénomène.
  alternative: Interpréter explicitement la scène comme une malédiction mortelle ou comme un simple affaiblissement.
  rationale: Le témoin décrit un dépérissement immédiat, mais n’en précise ici ni le mécanisme ni explicitement l’issue ultime ; la traduction préserve cette tension.
- issue: Identification d’Anne comme grand prêtre
  choice: « Le fils d’Anne, le grand prêtre »
  alternative: « Le fils du grand prêtre Anne »
  rationale: Cette formulation suit la relation grammaticale du témoin tout en évitant de remodeler le titre selon une reconstruction historique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple, tandis que les images abruptes du passage sont conservées. Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe d’après les manuscrits grecs demeure nécessaire.
