base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: fr
  text: '(1) Quelque temps plus tard, on construisait un bâtiment. Une grande agitation se produisit, et Jésus se leva pour se rendre sur place.


    Voyant un homme étendu, mort, Jésus lui saisit la main et dit : « Je te le dis, homme, lève-toi et fais ton travail. » Aussitôt, l’homme se leva et se prosterna devant lui.[a]


    (2) La foule vit cela et fut stupéfaite. Les gens disaient : « Cet enfant vient du ciel, car il a sauvé beaucoup d’âmes de la mort, et il continuera à en sauver tous les jours de sa vie. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’adora ». Le terme transmis par le témoin de travail peut exprimer une prosternation d’hommage ou d’adoration; l’examen direct du grec reste nécessaire.'
    reason: Signaler une ambiguïté théologiquement significative sans la résoudre dans le corps du texte.
  - marker: b
    text: Traduction provisoire fondée sur un témoin anglais public du texte grec. Une vérification directe des manuscrits grecs reste à effectuer, notamment pour « âmes » et la dernière proposition.
    reason: Le dossier fourni indique explicitement que la révision dans la langue source est encore en attente.
lexical_decisions:
- source_word: building
  choice: bâtiment
  rationale: Le témoin anglais peut désigner soit l’ouvrage en construction, soit plus généralement une construction; « bâtiment » est naturel sans préciser indûment sa nature.
- source_word: great commotion
  choice: une grande agitation
  rationale: Rend le tumulte collectif de façon claire et actuelle, sans ajouter la cause de l’agitation.
- source_word: worshipped him
  choice: se prosterna devant lui
  rationale: Préserve le geste d’hommage ou d’adoration sans trancher davantage que ne le permet le témoin de travail.
- source_word: souls
  choice: âmes
  rationale: Conserve la formulation anthropologique et théologique du témoin, plutôt que de la remplacer silencieusement par « personnes » ou « vies ».
- source_word: from death
  choice: de la mort
  rationale: Reproduit le lien explicite avec la mort et le contexte immédiat de résurrection.
theological_decisions:
- issue: Nature de l’hommage rendu à Jésus
  choice: « se prosterna devant lui »
  alternative: « l’adora »
  rationale: La formulation choisie maintient l’ambiguïté possible entre hommage corporel et adoration religieuse, particulièrement importante puisque l’examen direct du grec reste à faire.
- issue: Origine céleste de l’enfant
  choice: « Cet enfant vient du ciel »
  alternative: « Cet enfant est du ciel »
  rationale: « Vient du ciel » est idiomatique en français et conserve l’affirmation de la foule sans en développer la portée christologique.
- issue: Salut des âmes hors de la mort
  choice: « il a sauvé beaucoup d’âmes de la mort »
  alternative: « il a arraché beaucoup de personnes à la mort »
  rationale: Le choix garde la tension propre au mot « âmes » dans le témoin disponible et n’en réduit pas le sens à la seule survie physique.
translation_notes:
  register: Français international moderne, narratif et digne. Les reprises pronominales potentiellement ambiguës du témoin ont été explicitées avec « Jésus » et « l’homme ». La traduction reste volontairement provisoire, puisque seul un témoin anglais public de la tradition manuscrite grecque est fourni et que l’examen direct de la langue source est annoncé comme restant à faire.
