review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni : construction en cours, tumulte, relèvement du mort, geste de prosternation et déclaration de la foule. « Gisant sans vie » rend plus naturellement et sans atténuation « lying dead ». La formulation sur l’hommage conserve à juste titre l’ambiguïté du témoin anglais, puisque le grec n’est pas fourni pour contrôle direct.'
  naturalness: Le français est globalement naturel et d’un registre narratif digne. « Un bâtiment était en construction » et « un homme gisant sans vie » sont plus idiomatiques et précis que « on construisait un bâtiment » et « étendu, mort ». « Ils dirent » correspond mieux à la progression narrative que « Les gens disaient ».
  terminology: « Bâtiment », « agitation », « âmes », « mort » et « se prosterna devant lui » sont des choix recevables. La note sur « worshipped » doit toutefois préciser qu’elle porte sur le verbe du témoin anglais disponible, non sur un terme grec qui n’a pas été directement vérifié.
  issues:
  - severity: low
    issue: Rendu de « lying dead »
    rationale: « Un homme étendu, mort » est compréhensible, mais la juxtaposition est peu naturelle en français moderne. « Un homme gisant sans vie » garde explicitement l’état de mort sans ajouter de diagnostic.
  - severity: low
    issue: Formulation de la note a
    rationale: Le dossier ne fournit pas le mot grec, mais un témoin anglais avec « worshipped ». Dire que « le terme transmis » exprime l’ambiguïté peut laisser entendre une vérification lexicale grecque qui n’a pas eu lieu. La note doit attribuer explicitement cette ambiguïté au verbe anglais du témoin de travail.
  - severity: low
    issue: Temps verbal de la réaction de la foule
    rationale: « Les gens disaient » suggère une action durable ou répétée, tandis que le témoin rapporte une réaction narrative ponctuelle. « Ils dirent » est plus direct sans changer le sens.
