review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement le témoin anglais fourni. Quelques formulations interprètent ou modifient toutefois le texte : « pourquoi nous as-tu fait cela ? » ajoute une causalité absente de « what have you done to us? » ; « partit ... avec sa mère » ne rend pas explicitement le fait qu’il la suivit ; et l’éloge inhabituel du v. 4 est restructuré de façon à introduire une opposition (« ni vertu ») qui n’apparaît pas dans le témoin. La formule finale doit conserver l’ambiguïté de « To whom » plutôt que fixer son référent.'
  naturalness: Le français est dans l’ensemble moderne, clair et de registre approprié. « Dans le lieu de mon Père » est moins idiomatique que « chez mon Père », mais il est ici préférable pour conserver la formulation spatiale explicite du témoin ; une note signale l’état provisoire de cette option.
  terminology: « Caravane », « spécialistes de la Loi », « Loi », « pharisiens », « temple » et « Pâque » sont appropriés. « Enseignants » reste une désignation sobre qui ne confond pas les maîtres du temple avec les scribes mentionnés ensuite. L’expression d’éloge du v. 4 est conservée au plus près, avec note, car la base grecque directe n’a pas encore été contrôlée.
  issues:
  - severity: medium
    issue: 'v. 3 : « pourquoi nous as-tu fait cela ? »'
    rationale: Le témoin dit littéralement « qu’as-tu fait contre/nous ? » et non « pourquoi ». La révision évite d’ajouter une demande de motif.
  - severity: medium
    issue: 'v. 4 : reformulation de l’éloge inhabituel'
    rationale: « Pareille sagesse digne de louange, ni vertu aussi glorieuse » impose une coordination négative et redistribue les termes. Le témoin associe de manière difficile « sagesse », « louange », « gloire » et « vertu » ; il convient de ne pas résoudre cette difficulté sans contrôle direct du grec.
  - severity: medium
    issue: 'v. 5 : « partit de là avec sa mère »'
    rationale: Le témoin précise que Jésus suivit sa mère. « Avec » affaiblit ce mouvement et peut effacer la nuance narrative.
  - severity: low
    issue: 'Doxologie finale : « À lui soit »'
    rationale: Le pronom français attribue la doxologie à Jésus, alors que « To whom » dans le témoin reste grammaticalement dépendant et ne doit pas être davantage déterminé en présence de la lacune.
  revised_text: '(1) Quand Jésus eut douze ans, ses parents montèrent, selon la coutume, à Jérusalem pour la fête de la Pâque. Mais, pendant leur voyage de retour, Jésus resta à Jérusalem, sans que ses parents le sachent.


    (2) Pensant qu’il était dans la caravane, ils firent une journée de chemin et le cherchèrent parmi leurs parents et leurs connaissances. Ne l’ayant pas trouvé, ils retournèrent à Jérusalem pour le chercher.


