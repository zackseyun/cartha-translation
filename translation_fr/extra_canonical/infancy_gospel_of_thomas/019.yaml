  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: fr
  text: '(1) Quand Jésus eut douze ans, ses parents montèrent, selon la coutume, à Jérusalem pour la fête de la Pâque. Mais pendant leur voyage de retour, Jésus resta à Jérusalem sans que ses parents le sachent.


    (2) Pensant qu’il était dans la caravane, ils firent une journée de chemin et le cherchèrent parmi leurs parents et leurs connaissances. Ne l’ayant pas trouvé, ils retournèrent à Jérusalem pour le chercher.


    Au bout de trois jours, ils le trouvèrent dans le temple, assis au milieu des enseignants : il les écoutait et les interrogeait. Tous ceux qui l’entendaient étaient étonnés de la manière dont il interrogeait les anciens et expliquait les points essentiels de la Loi, ainsi que les énigmes et les paraboles des prophètes.


    (3) Sa mère lui dit : « Mon enfant, pourquoi nous as-tu fait cela ? Vois, nous te cherchions dans la douleur et l’affliction. »


    Jésus répondit : « Pourquoi me cherchiez-vous ? Ne saviez-vous pas qu’il faut que je sois chez mon Père[a] ? »


    (4) Les spécialistes de la Loi et les pharisiens dirent à Marie : « Es-tu la mère de cet enfant ? »


    Elle répondit : « Je le suis. »


    Ils lui dirent : « Tu es bénie, car le Seigneur Dieu a béni le fruit de ton ventre. Jamais nous n’avons vu pareille sagesse digne de louange, ni vertu aussi glorieuse[b]. »


    (5) Jésus se leva, partit de là avec sa mère et obéissait à ses parents. Quant à elle, elle gardait précieusement toutes ces choses et les méditait dans son cœur.


    Jésus progressait en sagesse, en maturité et en grâce devant Dieu et devant les êtres humains. À lui soit la [gloire…][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, selon le témoin fourni : « dans le lieu de mon Père ». La formule peut aussi évoquer ce qui appartient au Père, mais la présente traduction conserve son sens spatial.'
    reason: Signaler une ambiguïté connue sans remplacer la lecture attestée par une interprétation théologique.
  - marker: b
    text: La formulation grecque exacte de cette expression inhabituelle demande encore à être vérifiée directement dans la tradition manuscrite ; la traduction suit ici le témoin anglais fourni.
    reason: Le syntagme « wisdom of praise and glory of virtue » est difficile et la révision de la source grecque est explicitement en attente.
  - marker: c
    text: Les crochets et les points de suspension signalent une fin lacunaire ou une restitution incertaine dans le témoin utilisé.
    reason: Préserver honnêtement le signal textuel de la source sans compléter la doxologie par conjecture.
lexical_decisions:
- source_word: traveling company
  choice: caravane
  rationale: Terme français naturel pour un groupe voyageant ensemble dans ce contexte ancien, sans suggérer nécessairement des véhicules.
- source_word: teachers
  choice: enseignants
  rationale: Rend le rôle pédagogique sans les identifier automatiquement aux seuls spécialistes de la Loi, lesquels apparaissent ensuite séparément.
- source_word: scribes
  choice: spécialistes de la Loi
  rationale: Expression immédiatement compréhensible en français moderne qui explicite leur fonction sans connotation péjorative.
- source_word: law
  choice: Loi
  rationale: La majuscule indique ici la Torah ou Loi religieuse d’Israël, plutôt qu’une législation quelconque.
- source_word: maturity
  choice: maturité
  rationale: Préserve la formulation du témoin et sa distinction avec la sagesse, sans préciser arbitrairement qu’il s’agit seulement de stature physique.
- source_word: humans
  choice: les êtres humains
  rationale: Formulation inclusive et exacte, préférable ici à « les hommes », qui pourrait être compris au sens masculin.
theological_decisions:
- issue: Lieu ou affaires du Père dans la parole de Jésus
  choice: chez mon Père
  alternative: dans le lieu de mon Père ; aux affaires de mon Père
  rationale: La formulation transmise par le témoin indique explicitement un lieu. « Chez mon Père » reste naturelle tout en conservant la référence spatiale et sans substituer l’interprétation « aux affaires de mon Père ».
- issue: Formule finale doxologique lacunaire
  choice: À lui soit la [gloire…]
  alternative: À qui soit la [gloire…]
  rationale: Le référent probable est Jésus, mais la lacune interdit de reconstruire davantage. La formulation française rend ce référent plausible tout en maintenant le signal éditorial.
- issue: Croissance de Jésus en grâce devant Dieu
  choice: Jésus progressait… en grâce devant Dieu
  alternative: Jésus grandissait… dans la faveur de Dieu
  rationale: La tension théologique de l’énoncé est conservée telle quelle, sans l’atténuer ni expliquer comment Jésus peut progresser devant Dieu.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe narrative est légèrement lissée tout en conservant les répétitions significatives. Draft provisoire fondé sur le témoin anglais public fourni : la consultation directe de la tradition manuscrite grecque reste nécessaire, en particulier pour l’éloge du verset 4 et la finale lacunaire.'
