base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: fr
  text: '(1) L’enfant Jésus rit et dit : « Maintenant, que la stérile enfante, que les aveugles voient et que les insensés de cœur acquièrent l’intelligence : je suis ici, venu d’en haut, afin de délivrer ceux d’en bas et de les appeler à monter, comme me l’a ordonné celui qui m’a envoyé vers vous. »


    (2) Aussitôt, tous ceux qui étaient tombés sous sa malédiction furent sauvés. Dès lors, personne n’osa plus le provoquer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laughed
  choice: rit
  rationale: Rend directement le geste rapporté, sans lui attribuer une nuance de moquerie ou de joie absente du témoin disponible.
- source_word: the barren
  choice: celle qui est stérile
  rationale: Le singulier collectif anglais est conservé sous une forme française naturelle, sans préciser davantage l’identité ou la portée symbolique.
- source_word: foolish in heart
  choice: ceux dont le cœur est dépourvu d’intelligence
  rationale: Préserve l’ancrage anthropologique ancien dans le « cœur », compris comme siège de l’intelligence, tout en restant compréhensible aujourd’hui.
- source_word: here from above
  choice: je suis ici, venu d’en haut
  rationale: Conserve à la fois la présence locale (« ici ») et l’origine céleste ou supérieure (« d’en haut »), sans résoudre leur portée théologique.
- source_word: deliver
  choice: délivrer
  rationale: Maintient un terme assez large pour couvrir le secours, la libération ou le salut sans imposer une interprétation unique.
- source_word: call them up
  choice: les appeler à monter
  rationale: Conserve le mouvement vertical et l’acte d’appel, plutôt que de paraphraser théologiquement.
- source_word: curse
  choice: malédiction
  rationale: Équivalent direct et naturel du témoin, cohérent avec les épisodes antérieurs du récit.
- source_word: were saved
  choice: furent sauvés
  rationale: Préserve le verbe à portée potentiellement large, sans le réduire à « furent guéris » ou « revinrent à la vie ».
- source_word: provoke
  choice: provoquer
  rationale: Reproduit l’ambiguïté entre irriter, défier et susciter une réaction hostile.
theological_decisions:
- issue: Origine et mission de Jésus
  choice: « venu d’en haut » et « celui qui m’a envoyé »
  alternative: Expliciter une venue du ciel et identifier l’envoyeur comme Dieu ou le Père
  rationale: Le témoin fourni ne nomme pas l’envoyeur et laisse ouverte la portée exacte de « d’en haut » ; la traduction préserve cette retenue.
- issue: Portée de « furent sauvés »
  choice: Conserver « sauvés »
  alternative: « furent guéris », « furent rétablis » ou « revinrent à la vie »
  rationale: Le contexte pourrait viser l’annulation concrète des effets de la malédiction, mais le vocabulaire du témoin permet une portée plus large qu’il ne faut pas réduire sans examen grec direct.
- issue: Sens de l’appel vers le haut
  choice: « les appeler à monter »
  alternative: « les élever », « les rappeler à la vie » ou « les faire monter au ciel »
  rationale: La formulation conserve le parallélisme spatial entre « d’en haut » et « ceux d’en bas » ainsi que son possible poids symbolique, sans en fixer le sens.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste proche du témoin ancien tout en évitant les tournures artificielles. Aucun marqueur de note n’est requis, puisqu’aucune note de bas de page n’est proposée. Le texte demeure provisoire, la révision directe du grec étant indiquée comme encore en attente.
