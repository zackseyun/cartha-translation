base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: fr
  text: '(1) Quelques jours plus tard, un autre maître dit à son tour à Joseph, le père de Jésus : « Viens, frère, confie-le-moi à l’école, afin que je puisse lui apprendre les lettres en usant de douceur. »


    Joseph lui répondit : « Si tu en as le courage, frère, prends-le et va en paix[a]. »


    Le maître prit l’enfant par la main et l’emmena, rempli de crainte et d’inquiétude. Mais l’enfant le suivit avec joie.


    (2) En entrant dans l’école, Jésus trouva un livre posé sur le pupitre. Il le prit, mais ne lut pas ce qui y était écrit, car cela ne venait pas de la Loi de Dieu[b]. Il ouvrit plutôt la bouche et prononça des paroles si saisissantes que le maître, assis en face de lui, l’écoutait avec une grande joie et l’encourageait à poursuivre. La foule présente s’émerveillait de ses saintes paroles.


    (3) Joseph accourut à l’école, soupçonnant que ce maître avait maintenant fait l’expérience de Jésus et en avait souffert[c]. Mais le maître dit à Joseph : « Sache-le, frère : j’ai bien accueilli ton enfant comme élève, mais il est rempli d’une grâce et d’une sagesse immenses. Maintenant donc, frère, ramène-le chez toi et va en paix[a]. »


    (4) Jésus dit au maître : « Puisque tu as parlé avec justesse et rendu un témoignage juste, celui qui a été frappé sera lui aussi sauvé à cause de toi[d]. » Aussitôt, ce maître fut lui aussi sauvé[e]. Joseph prit alors l’enfant et le ramena chez lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prends-le avec salut » et « conduis-le avec salut ». La formule peut exprimer le fait d’aller sain et sauf, en paix ou sous la protection divine.'
    reason: La tournure du témoin est inhabituelle et son sens exact dépend d’un examen direct de la tradition grecque.
  - marker: b
    text: 'Ou : « car ce qui y était écrit ne relevait pas de la Loi de Dieu ».'
    reason: 'Le témoin permet une hésitation sur ce qui est précisément nié : l’origine du livre ou celle de son contenu.'
  - marker: c
    text: Le texte transmis ici est difficile. Littéralement, Joseph soupçonne que le maître « n’était plus inexpérimenté et avait souffert ». Il semble craindre que celui-ci ait subi une épreuve semblable à celle des maîtres précédents.
    reason: La syntaxe anglaise reflète vraisemblablement une leçon grecque obscure; la traduction principale explicite seulement le lien narratif minimal.
  - marker: d
    text: L’identité de « celui qui a été frappé » n’est pas précisée dans ce passage; « à cause de toi » peut aussi se traduire « grâce à toi ».
    reason: Préserve l’indétermination du référent et la nuance causale ou instrumentale.
  - marker: e
    text: Ici, « sauvé » peut aussi évoquer le fait d’être délivré, rétabli ou guéri.
    reason: Le contexte ne permet pas de limiter avec certitude le terme à un salut spirituel.
lexical_decisions:
- source_word: with flattery
  choice: en usant de douceur
  rationale: Le témoin anglais reflète probablement une idée de persuasion douce ou flatteuse. « En usant de douceur » reste naturel en français sans attribuer nécessairement au maître une flatterie trompeuse.
- source_word: letters
  choice: les lettres
  rationale: 'Conserve le sens scolaire ancien : apprentissage de l’alphabet et des rudiments de la lecture.'
- source_word: with salvation
  choice: va en paix
  rationale: Formule idiomatique française exprimant un départ sous le signe du salut ou du bien-être, tout en signalant en note la littéralité incertaine.
- source_word: book
  choice: livre
  rationale: Le témoin ne permet pas de préciser s’il s’agit d’un rouleau, d’un codex ou d’une tablette.
- source_word: God’s law
  choice: la Loi de Dieu
  rationale: La majuscule indique la Torah ou l’enseignement divin plutôt qu’une loi quelconque, sans préciser davantage la nature du livre.
- source_word: holy words
  choice: saintes paroles
  rationale: Maintient la qualification religieuse explicite et le registre solennel du récit.
- source_word: struck down
  choice: celui qui a été frappé
  rationale: Préserve le caractère indéterminé de la personne et de l’événement au lieu de les identifier ou de les harmoniser.
- source_word: was saved
  choice: fut sauvé
  rationale: Conserve l’ambiguïté entre guérison, délivrance et salut spirituel.
theological_decisions:
- issue: Nature des paroles prononcées par Jésus
  choice: « des paroles si saisissantes » et « saintes paroles »
  alternative: Identifier ces paroles comme une récitation ou un enseignement précis de la Loi
  rationale: Le témoin décrit leur effet et leur sainteté sans en donner le contenu; la traduction n’ajoute donc aucune doctrine précise.
- issue: Origine du contenu du livre
  choice: « cela ne venait pas de la Loi de Dieu »
  alternative: « le livre n’appartenait pas aux Écritures »
  rationale: 'La formulation retenue conserve l’ambiguïté : le jugement peut viser le texte écrit plutôt que l’objet entier.'
- issue: Salut de « celui qui a été frappé »
  choice: Conserver un référent indéterminé
  alternative: L’identifier à un ancien maître ou à une victime précise de Jésus
  rationale: Le passage fourni ne nomme pas cette personne. Une identification explicite importerait une harmonisation narrative.
- issue: Salut du troisième maître
  choice: Employer « sauvé » sans explication
  alternative: Traduire par « guéri », « délivré » ou « épargné »
  rationale: Le vocabulaire transmis peut porter plusieurs nuances. Le français « sauvé » maintient la tension théologique et narrative.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes (« frère », « avec justesse », « lui aussi sauvé ») sont conservées. Les pronoms ambigus sont remplacés avec mesure par les noms de Jésus ou de Joseph pour assurer la lisibilité. Le travail demeure provisoire, puisque la source fournie est un témoin anglais du texte grec et que la révision directe de la tradition grecque est annoncée comme encore en attente.
