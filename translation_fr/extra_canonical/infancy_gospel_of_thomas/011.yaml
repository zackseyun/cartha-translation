base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: fr
  text: '(1) L’enfant Jésus avait environ sept ans, et sa mère Marie l’envoya chercher de l’eau. Mais il y avait beaucoup de monde à la citerne ; la cruche fut heurtée et se brisa.


    (2) Alors Jésus déploya le manteau qu’il portait, le remplit d’eau et l’apporta à sa mère. Marie vit le signe que Jésus avait accompli. Elle l’embrassa et dit : « Seigneur, mon Dieu, bénis notre enfant », car ils craignaient que quelqu’un ne lui jette un sort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais fourni porte ici « ils craignaient », sans préciser clairement qui est inclus dans ce pluriel. La formulation est provisoire dans l’attente d’un examen direct des témoins grecs.
    reason: Signaler une ambiguïté réelle du témoin et la limite documentaire de la présente traduction.
lexical_decisions:
- source_word: child Jesus
  choice: l’enfant Jésus
  rationale: Rendu direct, naturel et digne, qui conserve l’accent du récit sur l’âge de Jésus.
- source_word: fill up water / fetch water
  choice: chercher de l’eau
  rationale: Expression idiomatique en français pour la tâche consistant à aller puiser et rapporter de l’eau.
- source_word: water cistern
  choice: citerne
  rationale: Terme courant correspondant au lieu collectif de réserve ou de puisage mentionné dans le témoin.
- source_word: cloak
  choice: manteau
  rationale: Terme français accessible pour le vêtement extérieur utilisé afin de transporter l’eau.
- source_word: sign
  choice: signe
  rationale: Conserve le vocabulaire théologiquement suggestif du témoin sans le remplacer par « miracle ».
- source_word: bewitch him
  choice: lui jette un sort
  rationale: Formulation française naturelle qui préserve la crainte d’une action magique hostile.
theological_decisions:
- issue: Nature de l’acte accompli par Jésus
  choice: le signe que Jésus avait accompli
  alternative: le miracle que Jésus avait fait
  rationale: « Signe » préserve la désignation du témoin et évite d’expliciter davantage la portée théologique de l’acte.
- issue: Référent de « Seigneur, mon Dieu »
  choice: Seigneur, mon Dieu, bénis notre enfant
  alternative: Seigneur mon Dieu, bénis notre enfant
  rationale: La ponctuation maintient ces mots comme une invocation adressée à Dieu, sans les rattacher artificiellement à Jésus.
- issue: Passage du singulier au pluriel dans la crainte finale
  choice: car ils craignaient
  alternative: car elle craignait
  rationale: Le pluriel du témoin est conservé, malgré l’absence d’un antécédent collectif explicite dans le contexte immédiat.
translation_notes:
  register: Français international moderne, narratif et digne. Traduction provisoire fondée sur le témoin anglais public fourni ; la vérification directe de la tradition manuscrite grecque reste à effectuer.
