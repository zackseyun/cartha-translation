translation:
  language: fr
  text: 'Dans le manuscrit Hagios Saba 259, ce passage se trouve après le chapitre 16.[a]


    (1) Une autre fois, un jeune homme fendait du bois en morceaux égaux. Il s’entailla la plante du pied, perdit tout son sang et mourut.


    (2) Il y eut alors une grande agitation, et Jésus accourut. Se frayant un chemin à travers la foule, il saisit le pied blessé, qui fut aussitôt guéri. Puis il dit au jeune homme : « Va fendre ton bois. »


    (3) Les foules virent cela et furent émerveillées. Elles disaient : « Il a sauvé beaucoup de vies de la mort, et il continuera d’en sauver tous les jours de sa vie. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le manuscrit Hagios Saba 259, cet épisode est placé après le chapitre 16 plutôt qu’à cet endroit.
    reason: Signaler clairement la variation d’ordre manuscrit fournie par le témoin.
  - marker: b
    text: 'Littéralement, selon le témoin consulté : « beaucoup d’âmes ». Ici, le mot peut désigner des personnes ou des vies sauvées de la mort.'
    reason: Préserver l’ambiguïté lexicale et théologique de « souls » en l’absence d’une vérification directe du grec.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: fendait du bois en morceaux égaux
  rationale: Rend concrètement l’action et conserve la précision inhabituelle concernant l’égalité des morceaux.
- source_word: bottom of his foot
  choice: la plante du pied
  rationale: Expression française naturelle et anatomiquement précise.
- source_word: bled out
  choice: perdit tout son sang
  rationale: Formulation claire et digne exprimant une hémorragie mortelle sans technicisme moderne excessif.
- source_word: Forcing his way through the crowd
  choice: Se frayant un chemin à travers la foule
  rationale: Rend le mouvement énergique sans suggérer une violence non nécessaire.
- source_word: souls
  choice: vies
  rationale: Dans ce contexte de délivrance de la mort physique, le terme désigne vraisemblablement des personnes ou des vies; « vies » est idiomatique tout en évitant une lecture exclusivement immatérielle.
theological_decisions:
- issue: Portée de « souls » dans la déclaration finale
  choice: beaucoup de vies
  alternative: beaucoup d’âmes
  rationale: Le contexte immédiat est celui d’un retour à la vie après une mort physique. La traduction « vies » exprime ce sens contextuel; une note conserve l’alternative littérale.
- issue: Valeur temporelle de la prédiction finale
  choice: il continuera d’en sauver tous les jours de sa vie
  alternative: il sauvera pendant tous les jours de sa vie
  rationale: La tournure choisie conserve l’idée d’une activité déjà commencée et appelée à se poursuivre, présente dans le témoin anglais, sans préciser davantage la nature du salut.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. Puisque la révision directe du grec est encore en attente, les choix susceptibles de dépendre du texte source sont formulés avec prudence et l’ambiguïté principale est documentée en note.
