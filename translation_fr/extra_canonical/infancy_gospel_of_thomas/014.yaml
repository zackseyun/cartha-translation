base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: fr
  text: '(1) Joseph vit la sagesse et l’intelligence de Jésus. Il ne voulait pas qu’il reste ignorant des lettres ; il le confia donc à un autre maître.


    Le maître écrivit l’alphabet pour Jésus et lui dit : « Dis : alpha. »


    (2) L’enfant répondit : « Dis-moi d’abord ce qu’est bêta, et moi, je te dirai ce qu’est alpha. »


    Le maître s’irrita et le frappa. Jésus le maudit, et le maître tomba et mourut.


    (3) L’enfant rentra chez ses parents. Joseph appela la mère de Jésus et lui ordonna de ne pas le laisser sortir de la maison, afin que ceux qui le provoqueraient ne meurent pas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni. Une vérification directe de la tradition manuscrite grecque reste nécessaire.
    reason: Le dossier indique que l’examen de la langue source est encore en attente ; la note rend cette limitation éditoriale transparente.
lexical_decisions:
- source_word: wisdom and understanding
  choice: la sagesse et l’intelligence
  rationale: Conserve les deux notions distinctes du témoin fourni dans un français naturel et digne.
- source_word: letters
  choice: les lettres
  rationale: Préserve la portée concrète de l’apprentissage de l’écriture et de l’alphabet, sans élargir abusivement à l’instruction en général.
- source_word: teacher
  choice: maître
  rationale: « Maître » convient au cadre ancien de l’enseignement élémentaire et évite la coloration institutionnelle moderne de « professeur ».
- source_word: cursed
  choice: maudit
  rationale: Rend directement la force de l’acte rapporté, sans l’atténuer ni en préciser artificiellement le mécanisme.
- source_word: set him free from the house
  choice: le laisser sortir de la maison
  rationale: Formulation idiomatique qui exprime clairement l’interdiction de quitter la maison.
- source_word: provoke
  choice: provoqueraient
  rationale: Maintient l’ambiguïté entre contrarier, irriter et susciter une réaction hostile.
theological_decisions:
- issue: Lien entre la malédiction de Jésus et la mort du maître
  choice: 'Deux propositions successives : « Jésus le maudit, et le maître tomba et mourut. »'
  alternative: 'Expliciter une causalité directe : « Jésus le maudit, si bien que le maître tomba mort. »'
  rationale: Le rendu retenu conserve la succession narrative et sa tension théologique sans ajouter un lien causal plus explicite que celui du témoin disponible.
- issue: Finalité de l’ordre donné par Joseph
  choice: « afin que ceux qui le provoqueraient ne meurent pas »
  alternative: « de peur que ceux qui le provoqueraient ne meurent »
  rationale: La formulation garde la logique préventive du passage sans décider si Joseph exprime un but, une crainte ou une conséquence attendue.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe simple, termes scolaires adaptés au cadre ancien, discours direct naturel. Les répétitions et la dureté du récit sont conservées sans harmonisation théologique.
