  footnotes:
  - marker: a
    text: 'La traduction suit ici le témoin fourni : « moi qui ai été créé avant ce monde ». Une vérification directe des témoins grecs reste nécessaire.'
    reason: La formulation est théologiquement significative et pourrait dépendre de la leçon manuscrite ou de sa traduction ; elle ne doit pas être harmonisée silencieusement.
  - marker: b
    text: La comparaison et la série « le son, la gloire, la puissance de l’intelligence » sont obscures dans le témoin fourni.
    reason: Avertir le lecteur que le sens exact de cette phrase difficile demeure incertain sans proposer une interprétation non attestée.
  - marker: c
    text: Le signe <…> indique une lacune ou un texte endommagé dans la tradition manuscrite représentée par le témoin fourni.
    reason: Conserver visiblement la lacune signalée dans la source de travail.
lexical_decisions:
- source_word: letters
  choice: les lettres
  rationale: Dans le contexte scolaire antique, l’expression désigne l’apprentissage de l’alphabet et, plus largement, les rudiments de la lecture ; le français conserve cette portée sans la préciser excessivement.
- source_word: lawyer
  choice: spécialiste de la Loi
  rationale: « Juriste » évoquerait trop facilement le droit civil moderne. Cette formulation indique un connaisseur ou docteur de la Loi religieuse sans lui attribuer un titre confessionnel plus précis que le témoin.
- source_word: small person
  choice: un petit
  rationale: La tournure naturelle conserve le contraste entre l’apparence enfantine de Jésus et l’avertissement de Joseph, sans résoudre ce que celui-ci sous-entend.
- source_word: fathers
  choice: pères
  rationale: Le terme généalogique est maintenu plutôt que remplacé par « ancêtres », afin de préserver la répétition ascendante du texte.
- source_word: first element
  choice: premier élément
  rationale: La désignation technique de la première lettre est conservée, puisqu’elle prépare l’exposé énigmatique sur la forme de l’alpha.
- source_word: isometric
  choice: isométrique
  rationale: Le terme géométrique rare est gardé, car la série descriptive est elle-même technique et obscure.
theological_decisions:
- issue: Préexistence et création de Jésus avant le monde
  choice: « moi qui ai été créé avant ce monde »
  alternative: « moi qui existais avant ce monde »
  rationale: Le témoin fourni affirme explicitement « was created ». La traduction conserve cette formulation théologiquement tendue au lieu de l’harmoniser avec une christologie ultérieure ; une note signale toutefois le caractère provisoire de la leçon faute de vérification grecque directe.
- issue: Présence de Jésus « hors de » et « en » Zachée
  choice: « je suis hors de toi et en toi »
  alternative: Interpréter l’expression comme une supériorité intellectuelle ou spirituelle
  rationale: L’énoncé demeure énigmatique dans le témoin. Le rendre littéralement préserve l’ambiguïté plutôt que d’imposer une explication doctrinale.
- issue: « nom du salut » porté par Joseph
  choice: « tu porteras le nom du salut »
  alternative: Identifier explicitement ce nom à Jésus
  rationale: Le texte ne fournit pas ici l’explication du jeu de mots ou de la désignation. La traduction maintient donc la formulation ouverte.
- issue: Naissance « dans la chair »
  choice: « la noblesse de ma naissance dans la chair »
  alternative: « ma noble incarnation »
  rationale: La formulation source est conservée sans transformer l’expression en terme doctrinal technique ni préciser la nature de cette noblesse.
translation_notes:
  register: Français international moderne, narratif et digne, avec syntaxe accessible. Les répétitions structurantes et les paroles abruptes de l’enfant sont conservées, tandis que les calques les moins naturels sont légèrement lissés. Projet provisoire établi à partir du témoin anglais public fourni ; la révision directe du grec reste à effectuer.
