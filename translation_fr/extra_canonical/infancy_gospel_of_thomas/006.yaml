translation:
  language: fr
  text: '(1) Un maître nommé Zachée se tenait là. Il entendit Jésus dire ces choses à son père Joseph et en fut profondément étonné.


    (2) Il dit à Joseph : « Viens, mon frère, confie-le-moi pour qu’il apprenne les lettres, acquière toute connaissance, apprenne à aimer ceux de son âge, à honorer la vieillesse et à respecter les anciens, afin qu’il en vienne à aimer les enfants et qu’à son tour il les instruise. »


    (3) Mais Joseph dit au maître : « Qui peut maîtriser cet enfant et l’instruire ? Ne le considère pas comme un petit, mon frère. »


    Le maître répondit : « Confie-le-moi, mon frère, et ne te fais pas de souci à son sujet. »


    (4) L’enfant Jésus les regarda et adressa ces paroles au maître : « Tu es maître par nature, mais tu es étranger au nom que tu portes, car je suis hors de toi et en toi en raison de la noblesse de ma naissance dans la chair. Mais toi, spécialiste de la Loi, tu ne connais pas la Loi. »


    Puis il dit à Joseph : « Quand tu es né, j’existais déjà et je me tenais auprès de toi, afin que toi, le père, tu reçoives de moi un enseignement que nul autre ne connaît ni ne peut enseigner. Et tu porteras le nom du salut. »


    (5) Les Juifs s’écrièrent : « Quel prodige nouveau et incroyable ! Cet enfant a peut-être cinq ans, et quelles paroles il prononce ! Nous n’avons jamais rien entendu de tel. Personne — ni spécialiste de la Loi ni pharisien — n’a parlé comme cet enfant. »


    (6) L’enfant leur répondit : « Pourquoi êtes-vous étonnés ? Ou plutôt, pourquoi ne croyez-vous pas ce que je vous ai dit ? En vérité, moi qui ai été créé avant ce monde[a], je sais exactement quand vous êtes nés, ainsi que vos pères et les pères de vos pères. »


    (7) Tous ceux qui l’entendirent restèrent sans voix et ne purent plus rien lui répondre. Mais il s’approcha d’eux, se mit à sautiller et dit : « Je jouais avec vous, car je sais que vous avez l’esprit étroit et que de petites choses vous étonnent. »


    (8) Lorsqu’ils parurent réconfortés par les encouragements de l’enfant, le maître dit à son père : « Viens, conduis-le à l’école. Je lui enseignerai les lettres. »


    Joseph lui prit la main et le conduisit à l’école. Le maître l’amadoua et le fit entrer. Zachée écrivit l’alphabet pour lui et commença à l’instruire en répétant souvent la même lettre. Mais l’enfant ne lui répondit pas.


    Le maître s’irrita et le frappa à la tête.


    L’enfant s’irrita à son tour et lui dit : « Je veux t’instruire plutôt que d’être instruit par toi, car je connais mieux que toi les lettres que tu enseignes. Pour moi, ces choses ressemblent à un gong retentissant ou à une cymbale qui résonne : elles ne font entendre ni le son, ni la gloire, ni la puissance de l’intelligence[b]. »


    (9) Quand la colère de l’enfant fut retombée, il récita seul toutes les lettres, de l’alpha à l’oméga, avec une grande habileté. Regardant le maître droit dans les yeux, il dit : « Si tu ne connais pas la nature de l’alpha, comment peux-tu enseigner la bêta à quelqu’un d’autre ? Hypocrite ! Si tu la connais, enseigne-moi d’abord l’alpha ; alors je te ferai confiance lorsque tu parleras de la bêta. » Puis il se mit à enseigner au maître ce qui concernait le premier élément, et celui-ci ne put rien lui répondre.


    (10) Tandis que beaucoup de gens écoutaient, il dit au maître : « Écoute, maître, et comprends la disposition du premier élément. Observe ses traits aigus et sa barre médiane : tu la vois pointer, se tenir les jambes écartées, se rejoindre, sortir, traîner en arrière, se soulever, danser tout autour, <…>[c], suivre un rythme ternaire, former deux angles, être de même forme, de même épaisseur, de même famille, élevée, équilibrée, isométrique et de proportions égales. Tels sont les traits de l’alpha. »'
