translation:
  language: fr
  text: '(1) Joseph dit à Jésus : « Pourquoi dis-tu de telles choses, si bien qu’ils souffrent et nous haïssent ? »


    L’enfant dit à Joseph : « Puisque tu connais les paroles de sagesse, tu n’ignores pas d’où elles viennent ; elles ont été dites au sujet d’un enfant de cinq ans.[a] Et ils ne se relèveront pas, tandis que ceux-ci recevront leur châtiment.[b] »


    Aussitôt, ceux qui l’accusaient devinrent aveugles.


    (2) Joseph saisit l’oreille de Jésus et la tira fortement.


    (3) Jésus lui dit : « Il te suffit de me chercher et de me trouver, sans aller jusqu’à me frapper pour avoir assumé une ignorance naturelle.[c] Tu n’as pas clairement discerné qui je suis pour toi.[d] Regarde ! Je me suis soumis devant toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation concernant « un enfant de cinq ans » est difficile et pourrait dépendre d’une variante du texte grec.
    reason: Signaler une obscurité du témoignage anglais et la nécessité d’une vérification du grec.
  - marker: b
    text: Les référents de « ils » et de « ceux-ci » ne sont pas certains ; « se relèveront » peut aussi évoquer le fait de se remettre ou de revenir à la vie.
    reason: Préserver l’ambiguïté des pronoms et du verbe sans résoudre artificiellement la menace.
  - marker: c
    text: La phrase traduite par « pour avoir assumé une ignorance naturelle » est obscure dans le témoignage disponible.
    reason: Avertir que cette expression provisoire ne doit pas être chargée d’une interprétation doctrinale.
  - marker: d
    text: 'Autre traduction possible : « Tu n’as pas clairement vu pourquoi je suis à toi. »'
    reason: Documenter l’autre lecture proche du témoignage anglais pour cette proposition particulièrement difficile.
lexical_decisions:
- source_word: wise words
  choice: paroles de sagesse
  rationale: Formulation française naturelle qui conserve la référence énigmatique à des paroles reconnues comme sages.
- source_word: raised
  choice: se relèveront
  rationale: Préserve l’ambiguïté entre se remettre, se lever et éventuellement revenir à la vie, sans imposer une lecture théologique.
- source_word: scourge
  choice: frapper
  rationale: Le contexte décrit Joseph tirant fortement l’oreille de Jésus ; « frapper » rend la violence disciplinaire sans introduire l’image plus précise d’une flagellation.
- source_word: subdued
  choice: me suis soumis
  rationale: Exprime l’idée d’abaissement ou de soumission devant Joseph tout en gardant le caractère frappant de la déclaration.
theological_decisions:
- issue: Le sens de « they won’t be raised »
  choice: « ils ne se relèveront pas »
  alternative: « ils ne ressusciteront pas » ou « ils ne se remettront pas »
  rationale: La formulation retenue conserve la polysémie du témoignage fourni et évite de transformer une menace obscure en affirmation explicite sur la résurrection.
- issue: L’identité de Jésus par rapport à Joseph dans la dernière réplique
  choice: « qui je suis pour toi »
  alternative: « pourquoi je suis à toi »
  rationale: Le passage est textuellement difficile. La traduction reste ouverte sur la nature exacte de la relation au lieu de préciser une filiation ou une appartenance théologique.
- issue: L’« ignorance naturelle » assumée
  choice: conservation littérale avec note
  alternative: explication comme condition humaine ou enfance ordinaire
  rationale: Aucune interprétation christologique particulière ne doit être imposée avant la vérification directe du grec.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’échange familial entre Joseph et l’enfant. Projet provisoire établi à partir du témoin anglais fourni, la révision directe du grec étant encore nécessaire ; les passages manifestement obscurs sont conservés et signalés plutôt que lissés.
