translation:
  language: fr
  text: '**16. Jésus guérit Jacques d’une morsure de serpent**


    (1) Jacques alla dans le bosquet pour mettre en fagots des branches, afin qu’on puisse faire du pain. Jésus l’accompagna. Pendant qu’ils ramassaient les branches, un serpent redoutable mordit Jacques à la main.


    (2) Jacques gisait à terre, mourant. L’enfant Jésus courut vers lui et souffla sur la morsure. Aussitôt, la morsure fut guérie, la bête périt et Jacques fut sauvé.


    [a] Le manuscrit Hagios Saba 259 ne contient pas les chapitres 17 et 18. Ces deux chapitres sont donc établis d’après des manuscrits grecs plus tardifs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit Hagios Saba 259 ne contient pas les chapitres 17 et 18. Ces deux chapitres sont donc établis d’après des manuscrits grecs plus tardifs.
    reason: Signaler clairement la situation manuscrite transmise avec le texte source. Le marqueur est placé dans le texte à l’endroit de la note éditoriale.
lexical_decisions:
- source_word: grove
  choice: bosquet
  rationale: Rend naturellement un petit espace boisé sans préciser davantage la nature du lieu, en l’absence d’un examen direct du grec.
- source_word: tie up sticks
  choice: mettre en fagots des branches
  rationale: Exprime clairement l’action de rassembler et lier du petit bois; «branches» est plus naturel ici que le littéral «bâtons».
- source_word: terrible snake
  choice: serpent redoutable
  rationale: Conserve l’intensité du témoin anglais dans un registre narratif digne, sans ajouter l’idée non explicitement attestée de venin.
- source_word: blew on the bite
  choice: souffla sur la morsure
  rationale: Préserve le geste concret et inhabituel du récit sans l’interpréter ni l’amplifier.
- source_word: the beast was destroyed
  choice: la bête périt
  rationale: Rend l’issue fatale avec une formulation française naturelle tout en maintenant l’enchaînement bref du récit.
theological_decisions:
- issue: Nature de la guérison accomplie par l’enfant Jésus
  choice: Conserver la simple succession narrative entre le souffle et la guérison immédiate
  alternative: Qualifier explicitement le geste de miracle ou expliquer son mode d’action
  rationale: Le témoin décrit l’événement sans fournir d’explication théologique; la traduction ne doit pas en importer une.
- issue: Sens de «Jacques fut sauvé»
  choice: Jacques fut sauvé
  alternative: Jacques fut guéri / eut la vie sauve
  rationale: La formulation conserve l’éventuelle amplitude de «saved» et le parallélisme avec la destruction de la bête, sans réduire silencieusement le sens à la seule guérison physique.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent simples et accessibles. Puisque l’examen direct du grec est encore en attente, le projet demeure explicitement fondé sur le témoin anglais public fourni; les choix évitent les précisions lexicales ou théologiques non garanties par ce témoin.
