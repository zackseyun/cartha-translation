    (2) Jacques gisait à terre, mourant. L’enfant Jésus courut vers lui et souffla sur la morsure. Aussitôt, la plaie de la morsure fut guérie, le serpent fut détruit et Jacques eut la vie sauve.


    [a] Le manuscrit Hagios Saba 259 ne contient pas les chapitres 17 et 18. Ces deux chapitres sont donc fondés sur des manuscrits grecs plus tardifs.'
