base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: fr
  text: '(1) Au temps des semailles, Joseph sema, et l’enfant Jésus sema une mesure de blé.


    (2) Son père en récolta cent grandes mesures. Il en donna généreusement aux pauvres et aux orphelins. Mais Joseph prit de la semence de Jésus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens exact de cette dernière proposition est incertain dans le témoin utilisé : elle peut vouloir dire que Joseph prit de la semence appartenant à Jésus ou qu’il recueillit ce qui provenait de la semence semée par Jésus. Une vérification directe de la tradition manuscrite grecque reste nécessaire.'
    reason: Signaler l’ambiguïté du témoin anglais et le caractère provisoire de la traduction faute de révision directe du grec.
lexical_decisions:
- source_word: one measure of wheat
  choice: une mesure de blé
  rationale: Conserve l’unité indéterminée du témoin sans lui attribuer une valeur moderne précise.
- source_word: reaped a hundred great measures
  choice: en récolta cent grandes mesures
  rationale: Préserve le contraste miraculeux entre une mesure semée et cent grandes mesures récoltées, ainsi que l’adjectif inhabituel « grandes ».
- source_word: gave graciously
  choice: donna généreusement
  rationale: Exprime en français naturel la libéralité du don plutôt qu’une simple manière aimable de donner.
- source_word: the poor and the orphans
  choice: aux pauvres et aux orphelins
  rationale: Rend directement les deux catégories de bénéficiaires sans les fondre.
theological_decisions:
- issue: Rapport entre la récolte et la semence de Jésus dans la dernière phrase
  choice: Mais Joseph prit de la semence de Jésus.
  alternative: Mais Joseph recueillit la récolte provenant de la semence de Jésus.
  rationale: Le témoin anglais fourni présente une formulation elliptique et quelque peu obscure. La traduction principale en conserve la tension au lieu de préciser sans contrôle direct du grec qu’il s’agit de toute la récolte.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif bref. Traduction provisoire fondée sur le témoin anglais public fourni ; la révision directe du grec reste en attente.
