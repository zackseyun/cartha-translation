base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/009.yaml
  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
translation:
  language: fr
  text: '(1) De nouveau, bien des jours plus tard, Jésus jouait avec d’autres enfants sur le toit d’une pièce à l’étage. Or, l’un des enfants tomba et mourut. Quand les autres enfants virent cela, ils rentrèrent chez eux et laissèrent Jésus seul.


    (2) Les parents de l’enfant mort vinrent accuser Jésus en disant : « C’est toi qui as fait tomber notre enfant ! »


    Mais Jésus répondit : « Ce n’est pas moi qui l’ai fait tomber. »


    (3) Ils étaient furieux et criaient. Jésus descendit du toit, se tint près du corps et s’écria d’une voix forte : « Zénon, Zénon — car tel était son nom —, relève-toi et dis si c’est moi qui t’ai fait tomber. »


    Il se releva et répondit : « Non, maître.[a] »


    À cette vue, ils furent stupéfaits.


    Puis Jésus lui dit : « Rendors-toi ! »


    Les parents de l’enfant louèrent Dieu et se prosternèrent devant Jésus enfant.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Non, seigneur. » Le terme d’adresse grec sous-jacent doit encore être vérifié directement dans les manuscrits.'
    reason: Signaler l’incertitude lexicale créée par une rédaction provisoirement fondée sur le témoin anglais.
  - marker: b
    text: 'Ou : « adorèrent l’enfant Jésus ». Le verbe peut désigner une prosternation ou un hommage et, selon le contexte, une adoration.'
    reason: Préserver l’ambiguïté théologique et sémantique sans la résoudre prématurément.
lexical_decisions:
- source_word: roof of an upstairs room
  choice: le toit d’une pièce à l’étage
  rationale: Conserve la configuration architecturale du témoin fourni sans la préciser au-delà de ce qu’il permet.
- source_word: pushed down
  choice: fait tomber
  rationale: Exprime naturellement en français l’accusation d’avoir provoqué la chute, tout en maintenant la répétition dans la dénégation et la question adressée à Zénon.
- source_word: Rise
  choice: relève-toi
  rationale: Convient à l’ordre donné au corps étendu et évite de préciser si le verbe doit être compris comme une formule technique de résurrection.
- source_word: sir
  choice: maître
  rationale: Rend une adresse respectueuse à Jésus ; le sens exact dépend toutefois du terme grec sous-jacent, qui reste à vérifier.
- source_word: Fall asleep
  choice: Rendors-toi
  rationale: Le préfixe « re- » est naturel après le retour momentané à la vie et conserve l’euphémisme du sommeil pour la mort.
- source_word: worshipped
  choice: se prosternèrent devant
  rationale: Décrit le geste d’hommage sans imposer à lui seul une interprétation cultuelle précise.
theological_decisions:
- issue: Nature de l’hommage rendu à Jésus enfant
  choice: se prosternèrent devant Jésus enfant
  alternative: adorèrent l’enfant Jésus
  rationale: La formulation retenue préserve l’ambiguïté possible entre prosternation, hommage et adoration, surtout en l’absence d’une vérification directe du grec.
- issue: Ordre donné à Zénon après son relèvement
  choice: Rendors-toi !
  alternative: Endors-toi ! / Meurs de nouveau !
  rationale: Le langage du sommeil maintient l’euphémisme du témoin et évite d’expliciter théologiquement la seconde mort.
- issue: Relèvement de l’enfant mort
  choice: relève-toi
  alternative: ressuscite
  rationale: Le récit montre clairement un retour à la vie, mais la traduction évite d’introduire un terme doctrinal plus marqué si le verbe grec n’a pas encore été contrôlé.
translation_notes:
  register: 'Français international actuel, narratif et digne, avec des phrases accessibles. La traduction demeure provisoire : elle repose sur le témoin anglais public fourni, la consultation directe de la tradition manuscrite grecque restant à effectuer.'
