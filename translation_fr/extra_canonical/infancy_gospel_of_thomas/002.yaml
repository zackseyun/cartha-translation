base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: fr
  text: '(1) L’enfant Jésus avait cinq ans. Après la pluie, il jouait au gué d’un ruisseau. Il remua les eaux boueuses, les rassembla dans des bassins et les rendit propres et limpides, en leur donnant un ordre par sa seule parole, sans agir de ses mains.


    (2) Puis il prit dans la boue de l’argile tendre et en façonna douze moineaux. Or, c’était un jour de sabbat qu’il faisait cela, et beaucoup d’enfants étaient avec lui.


    (3) Un Juif vit l’enfant Jésus faire cela avec les autres enfants. Il alla trouver Joseph, son père, et accusa l’enfant Jésus en disant : « Il a préparé de l’argile le jour du sabbat, ce qui n’est pas permis, et il a façonné douze moineaux. »


    (4) Joseph alla réprimander Jésus : « Pourquoi fais-tu cela le jour du sabbat ? »


    Mais Jésus frappa des mains et, devant tout le monde, donna cet ordre aux oiseaux d’une voix forte : « Allez, envolez-vous comme des êtres vivants ! » Les moineaux prirent leur envol et partirent en pépiant.


    (5) À cette vue, le pharisien[a] fut émerveillé et raconta ce qui s’était passé à tous ses amis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit désigne d’abord cet homme comme « un Juif » au verset 3, puis comme « le pharisien » ici.
    reason: Signaler sans l’harmoniser le changement de désignation présent dans le témoin.
lexical_decisions:
- source_word: ford
  choice: gué
  rationale: Conserve l’image précise d’un passage peu profond dans un cours d’eau.
- source_word: flowing stream
  choice: ruisseau
  rationale: Expression française naturelle qui maintient l’idée d’un petit cours d’eau; son écoulement est implicite.
- source_word: clean and excellent
  choice: propres et limpides
  rationale: « Limpides » exprime naturellement la qualité remarquable des eaux purifiées sans le maladroit « excellentes ».
- source_word: ordering them by word alone – and not ordering them by a deed
  choice: en leur donnant un ordre par sa seule parole, sans agir de ses mains
  rationale: Préserve le contraste entre parole et action concrète tout en restant intelligible en français.
- source_word: soft clay
  choice: argile tendre
  rationale: Rendu concret et courant de la matière malléable employée pour façonner les oiseaux.
- source_word: slandered
  choice: accusa
  rationale: Évite d’affirmer juridiquement une calomnie tout en conservant la dénonciation hostile décrite par le récit.
- source_word: squawking
  choice: en pépiant
  rationale: Verbe idiomatique pour le cri de petits oiseaux tels que les moineaux.
theological_decisions:
- issue: L’animation des moineaux façonnés en argile
  choice: Traduire directement l’ordre de Jésus et l’envol des oiseaux sans explication théologique.
  alternative: Interpréter explicitement l’épisode comme une création ou un signe de divinité.
  rationale: Le récit montre l’événement mais n’en formule pas lui-même la portée doctrinale; la traduction ne doit pas résoudre cette tension.
- issue: Activité interdite le jour du sabbat
  choice: Conserver « ce qui n’est pas permis » comme parole de l’accusateur.
  alternative: Préciser quelle règle sabbatique aurait été enfreinte.
  rationale: Le témoin fourni ne détaille ni la règle ni son fondement, et la traduction ne doit pas importer une interprétation juridique.
- issue: Désignation du témoin en (3) puis en (5)
  choice: Conserver le passage de « un Juif » à « le pharisien » et le signaler en note.
  alternative: Harmoniser les deux désignations en appelant partout le personnage « un pharisien » ou « un Juif ».
  rationale: Le changement appartient au témoin transmis et peut refléter une tension textuelle authentique; l’harmoniser la supprimerait.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe fluidifiée sans effacer les répétitions significatives. Le projet repose ici sur le témoin anglais public fourni, la vérification directe du grec étant encore en attente; les choix restent donc prudents, particulièrement pour les formulations inhabituelles du verset 1.
