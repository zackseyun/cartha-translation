base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: fr
  text: '(1) Jésus avait alors environ huit ans. Son père était charpentier et fabriquait des charrues et des jougs. Il reçut d’un homme riche un lit afin de le rendre très grand et bien adapté. Mais l’une des traverses, appelée la […][a], était trop courte : elle n’avait pas la bonne longueur. Joseph en fut affligé et ne savait que faire.


    L’enfant vint trouver son père et lui dit : « Pose les deux planches et aligne-les de ton côté. »


    (2) Joseph fit exactement ce qu’il lui avait dit. L’enfant Jésus se plaça à l’autre extrémité, saisit la planche trop courte et l’étira. Il lui donna ainsi la même longueur que l’autre.


    Puis il dit à son père : « Ne sois pas affligé ; fais maintenant ce que tu veux. »


    Joseph le prit dans ses bras et l’embrassa en disant : « Heureux suis-je, puisque Dieu m’a donné cet enfant ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom précis de cette pièce du lit est non résolu ou lacunaire dans la tradition manuscrite transmise par le témoin utilisé.
    reason: Signaler honnêtement l’incertitude textuelle représentée par les points de suspension dans la source disponible.
lexical_decisions:
- source_word: carpenter
  choice: charpentier
  rationale: Terme français naturel désignant ici l’artisan travaillant le bois et fabriquant des charrues et des jougs.
- source_word: bed
  choice: lit
  rationale: Conserve le sens direct du témoin fourni, sans préciser une forme particulière de couche que le texte ne permet pas d’établir.
- source_word: beams / boards
  choice: traverses / planches
  rationale: « Traverse » décrit la pièce du lit dans la présentation du problème, tandis que « planche » suit le vocabulaire de l’instruction et de l’action ; la variation du témoin est préservée.
- source_word: grieved / distressed
  choice: affligé
  rationale: Exprime le trouble profond de Joseph dans un registre digne et courant, sans lui attribuer une émotion plus précise.
- source_word: stretched it
  choice: l’étira
  rationale: Rend simplement le caractère miraculeux de l’allongement de la planche, sans explication ajoutée.
- source_word: Blessed am I
  choice: Heureux suis-je
  rationale: Formulation solennelle mais intelligible qui conserve l’exclamation personnelle de Joseph.
theological_decisions:
- issue: Nature du miracle accompli par l’enfant Jésus
  choice: Décrire directement Jésus étirant la planche
  alternative: Expliquer qu’il la fait croître ou qu’il exerce une puissance divine
  rationale: Le récit décrit l’acte sans en donner d’interprétation théologique explicite ; la traduction n’en ajoute donc aucune.
- issue: Déclaration finale de Joseph
  choice: « Dieu m’a donné cet enfant »
  alternative: « Dieu m’a donné son enfant » ou « Dieu m’a donné cet enfant divin »
  rationale: La formulation reçue est conservée afin de ne pas préciser une christologie que cette phrase, prise isolément, ne formule pas.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte reste accessible, avec des phrases fluides et sans archaïsmes inutiles. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque reste nécessaire.
