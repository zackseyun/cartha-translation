    Aussitôt, le bébé leva les yeux et se mit à rire. Jésus dit à la mère : « Prends ton enfant, donne-lui du lait et souviens-toi de moi. »


    (2) La foule qui se tenait là fut saisie d’étonnement et dit : « La vérité est que cet enfant est un dieu ou un ange, car chaque parole qu’il prononce se réalise ! »


    Jésus s’en alla de nouveau et joua avec les enfants.[a]'
