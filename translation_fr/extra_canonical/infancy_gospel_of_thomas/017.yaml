lexical_decisions:
- source_word: baby
  choice: bébé
  rationale: Le témoin distingue ici un très jeune enfant; « bébé » est naturel en français moderne et convient à l’ordre de lui donner du lait.
- source_word: don’t die, but live
  choice: ne reste pas mort, mais vis
  rationale: Puisque le récit vient de déclarer l’enfant mort, une traduction strictement littérale (« ne meurs pas ») créerait en français une incohérence temporelle plus forte. Cette formulation conserve l’opposition entre mort et vie sans nier l’état constaté.
- source_word: remember me
  choice: souviens-toi de moi
  rationale: Rendu direct qui préserve la portée ouverte de l’exhortation, sans préciser s’il s’agit de gratitude, de mémoire cultuelle ou de témoignage.
- source_word: becomes a deed
  choice: devient un acte
  rationale: Conserve l’image selon laquelle la parole prononcée se réalise effectivement, au lieu de l’expliciter par « s’accomplit ».
- source_word: a god or an angel
  choice: un dieu ou un ange
  rationale: Respecte la déclaration étonnée de la foule et son alternative indéterminée, sans la corriger selon une christologie ultérieure.
theological_decisions:
- issue: Déclaration de la foule sur l’identité de Jésus
  choice: « cet enfant est un dieu ou un ange »
  alternative: « cet enfant est Dieu ou un ange »
  rationale: L’indéfini du témoin fourni et l’alternative populaire sont conservés. Mettre une majuscule à « Dieu » résoudrait indûment l’ambiguïté et rendrait l’alternative moins naturelle.
- issue: Retour à la vie du bébé
  choice: « ne reste pas mort, mais vis »
  alternative: « ne meurs pas, mais vis »
  rationale: Le contexte présente déjà le bébé comme mort. Le choix français exprime donc une restauration à la vie tout en maintenant la forme impérative de la parole de Jésus.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions simples et l’émerveillement du récit ont été conservés, avec une syntaxe fluide accessible à un large public.
