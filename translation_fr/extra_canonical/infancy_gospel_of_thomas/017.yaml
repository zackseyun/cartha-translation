translation:
  language: fr
  text: '(1) Après cela, dans le voisinage de Joseph, un bébé tomba malade et mourut. Sa mère pleurait beaucoup.


    Mais Jésus entendit les pleurs et la grande agitation. Il accourut et trouva l’enfant mort. Il lui toucha la poitrine et dit : « Je te le dis, bébé : ne reste pas mort, mais vis et sois avec ta mère. »


    Aussitôt, le bébé leva les yeux et se mit à rire. Jésus dit à la mère : « Prends ton enfant, donne-lui du lait et souviens-toi de moi. »


    (2) La foule qui se tenait là fut saisie d’étonnement et dit : « En vérité, cet enfant est un dieu ou un ange, car chacune de ses paroles devient un acte ! »


    Puis Jésus repartit jouer avec les enfants.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais fourni; la vérification directe de la tradition manuscrite grecque reste à effectuer.
