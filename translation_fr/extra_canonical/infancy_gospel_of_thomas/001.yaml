lexical_decisions:
- source_word: Thomas the Israelite
  choice: Thomas l’Israélite
  rationale: Conserve l’auto-identification traditionnelle dans un français naturel et digne.
- source_word: Gentile brothers (and sisters)
  choice: frères et sœurs d’origine non juive
  rationale: Rend explicitement l’opposition avec « Israélite » tout en évitant un terme français potentiellement obscur ou péjoratif comme « païens ».
- source_word: all the things done
  choice: tout ce que … a accompli
  rationale: Formulation française idiomatique qui garde l’idée de l’ensemble des actes attribués à Jésus.
- source_word: in our region of Bethlehem
  choice: dans notre région de Bethléem
  rationale: Suit prudemment le témoin fourni sans préciser davantage la relation géographique, puisque la vérification du grec reste à faire.
- source_word: This is the beginning
  choice: Voici le commencement
  rationale: Reproduit la formule introductive de façon concise et formelle.
theological_decisions:
- issue: Titre « notre Seigneur » et identité de Jésus-Christ
  choice: notre Seigneur Jésus-Christ
  alternative: notre Seigneur Jésus le Christ
  rationale: Conserve sans développement l’expression transmise par le témoin, sans ajouter d’interprétation christologique.
- issue: Destinataires désignés comme Gentiles
  choice: frères et sœurs d’origine non juive
  alternative: frères et sœurs des nations
  rationale: La formulation retenue est immédiatement compréhensible en français moderne; l’alternative préserverait davantage un éventuel idiome biblique grec, dont l’examen direct est encore en attente.
translation_notes:
  register: Français international moderne, accessible et digne. La première personne est mise en relief par « Moi » afin de conserver l’ouverture emphatique. La phrase reste proche du témoin disponible sans prétendre résoudre les questions que seul l’examen du grec pourrait trancher.
