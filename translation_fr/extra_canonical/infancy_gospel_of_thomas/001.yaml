  text: 'I, Thomas the Israelite, considered it necessary to make known to all the Gentile brothers and sisters everything done by our Lord Jesus Christ in the village of Nazareth after he was born in our region of Bethlehem. This is the beginning:'
translation:
  language: fr
  text: Moi, Thomas l’Israélite, j’ai jugé nécessaire de faire connaître à tous les frères et sœurs d’origine non juive tout ce que notre Seigneur Jésus-Christ a accompli dans le village de Nazareth, après sa naissance dans notre région de Bethléem. Voici le commencement :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais fourni; une vérification directe de la tradition manuscrite grecque reste nécessaire.
