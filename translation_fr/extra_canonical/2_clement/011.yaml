review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le projet rend bien l’argumentation générale et corrige à juste titre la répétition accidentelle de « nor eye seen » dans le témoin anglais : le grec usuel de 2 Clément 11 et l’allusion à 1 Corinthiens 2.9 n’ont qu’une occurrence. Toutefois, « les biens promis » ajoute « promis » là où le texte dit simplement « les bonnes choses / les biens ». La note reconnaît l’ajout, mais celui-ci ne devrait pas figurer dans le corps du texte. La condition finale est aussi mieux rendue comme une action envisagée (« si nous faisons ce qui est juste ») que comme une pratique générale au présent.'
  naturalness: Le français est globalement clair, moderne et d’un registre approprié. « Prenez un arbre pour comparaison » est moins naturel que « Comparez-vous à un arbre », et « les promesses que l’oreille… » crée une construction sémantiquement heurtée en français. Une reprise explicative minimale (« ces réalités que… ») rend la citation finale intelligible sans changer son référent.
  terminology: « cœur pur », « cœur partagé », « espérance », « œuvres », « royaume » et « récompense » conviennent. « Malheureux » rend correctement le ton de ταλαίπωροι. « Raisin encore vert » et « grappe mûre » préservent la progression de l’image viticole. La suppression de « promis » après « les biens » évite une explicitation lexicale injustifiée.
  issues:
  - severity: medium
    issue: Ajout de « promis » dans « les biens promis »
    rationale: Le texte source oppose troubles et afflictions aux τὰ ἀγαθά, « les bonnes choses / les biens ». Le contexte contient certes la promesse de Dieu, mais l’adjectif « promis » n’est pas présent dans cette proposition et restreint inutilement le texte.
  - severity: low
    issue: Formulation française peu naturelle de la comparaison végétale
    rationale: « Prenez un arbre pour comparaison » est un calque pesant. « Comparez-vous à un arbre ; prenez une vigne » conserve l’impératif et l’image source avec une syntaxe française plus fluide.
  - severity: low
    issue: Condition finale rendue au présent habituel
    rationale: Le tour conditionnel grec envisage l’accomplissement de la justice en vue de l’entrée future dans le royaume. « Si donc nous faisons ce qui est juste » préserve mieux cette orientation sans introduire de conclusion doctrinale.
  - severity: low
    issue: Syntaxe ambiguë de la citation finale
    rationale: Après « les promesses », le relatif « que l’oreille… » semble qualifier les promesses elles-mêmes plutôt que leur contenu. « Ces réalités que… » clarifie le référent des choses promises tout en restant fidèle au sens.
  revised_text: 'Servons donc Dieu d’un cœur pur, et nous serons justes. Mais si nous ne le servons pas parce que nous ne croyons pas à la promesse de Dieu, nous serons malheureux.


    Car la parole prophétique dit aussi : « Malheureux ceux qui ont le cœur partagé, qui doutent dans leur cœur et disent : “Nous avons entendu parler de ces choses autrefois, déjà du temps de nos pères ; et voici que nous attendons jour après jour et que nous n’en avons rien vu.


    Insensés ! Comparez-vous à un arbre ; prenez une vigne : d’abord elle perd ses feuilles, puis une pousse apparaît ; ensuite vient un raisin encore vert, puis une grappe mûre.


    De même, mon peuple a connu des troubles et des détresses ; mais ensuite il recevra les biens.”


    Ainsi donc, mes frères, n’ayons pas le cœur partagé, mais persévérons patiemment dans l’espérance, afin que nous obtenions, nous aussi, notre récompense.


    Car celui qui a promis de rendre à chacun selon ses œuvres est fidèle.


    Si donc nous faisons ce qui est juste devant Dieu, nous entrerons dans son royaume et nous recevrons les promesses : ces réalités que l’oreille n’a pas entendues, que l’œil n’a pas vues et qui ne sont pas montées au cœur d’un être humain.[a]'
