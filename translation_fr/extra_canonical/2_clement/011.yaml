base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: fr
  text: 'Servons donc Dieu d’un cœur pur, et nous serons justes. Mais si nous ne le servons pas parce que nous ne croyons pas à sa promesse, nous serons malheureux.


    Car la parole prophétique dit aussi : « Malheureux ceux qui ont le cœur partagé, qui doutent dans leur cœur et disent : “Nous avons entendu parler de ces choses autrefois déjà, au temps de nos pères ; pourtant, nous attendons jour après jour et nous n’en avons rien vu.”


    Insensés ! Prenez un arbre pour comparaison, prenez une vigne : d’abord elle perd ses feuilles, puis une pousse apparaît ; ensuite vient un raisin encore vert, puis une grappe parvenue à maturité.


    De même, mon peuple a connu troubles et détresses ; mais après cela, il recevra les biens promis.[a] »


    Ainsi donc, mes frères, n’ayons pas le cœur partagé, mais persévérons patiemment dans l’espérance, afin de recevoir, nous aussi, notre récompense.


    Car celui qui a promis de rendre à chacun selon ses œuvres est fidèle.


    Si donc nous pratiquons la justice devant Dieu, nous entrerons dans son royaume et nous recevrons les promesses que « l’oreille n’a pas entendues, que l’œil n’a pas vues et qui ne sont pas montées au cœur de l’être humain ».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il recevra les bonnes choses » ou « les biens ». « Promis » explicite ici le lien avec la promesse évoquée dans le passage.'
    reason: Signaler une explicitation contextuelle sans la faire passer pour un élément lexical certain du texte source.
  - marker: b
    text: Le témoin anglais fourni répète « que l’œil n’a pas vues ». La citation biblique connue et la tradition grecque courante ne comportent qu’une seule occurrence ; la répétition n’est donc pas reproduite ici. Voir aussi 1 Corinthiens 2.9.
    reason: Documenter une anomalie du témoin de consultation et justifier le choix de ne pas introduire une répétition vraisemblablement accidentelle.
lexical_decisions:
- source_word: pure heart
  choice: d’un cœur pur
  rationale: Expression française naturelle qui conserve l’image biblique du cœur comme centre moral et spirituel.
- source_word: double-minded
  choice: ceux qui ont le cœur partagé / n’ayons pas le cœur partagé
  rationale: Rend l’idée d’une loyauté intérieure divisée et hésitante, sans la réduire au simple doute intellectuel.
- source_word: sour berry
  choice: un raisin encore vert
  rationale: Décrit naturellement le fruit immature de la vigne et préserve la progression vers la grappe mûre.
- source_word: recompense of his works
  choice: rendre à chacun selon ses œuvres
  rationale: Formulation biblique claire qui conserve le rapport entre les actes de chacun et la rétribution promise.
- source_word: wrought righteousness
  choice: pratiquons la justice
  rationale: Évite le calque archaïque « accomplir la justice » tout en présentant la justice comme une conduite effective devant Dieu.
theological_decisions:
- issue: Rapport entre service de Dieu, justice et entrée dans le royaume
  choice: Conserver les formulations conditionnelles et leur force exhortative
  alternative: Les reformuler comme simple preuve d’un salut déjà acquis ou comme mérite autonome
  rationale: Le passage lie explicitement la fidélité pratique, la justice, la récompense et l’entrée dans le royaume ; la traduction ne tranche pas un débat doctrinal que le texte lui-même ne développe pas.
- issue: Identité du sujet fidèle qui promet
  choice: « celui qui a promis »
  alternative: Nommer explicitement Dieu
  rationale: Le contexte renvoie clairement à Dieu, mais la formulation garde la structure référentielle du témoin sans ajouter un nom absent de la phrase.
- issue: Nature des biens futurs
  choice: « les biens promis » avec note
  alternative: « de bonnes choses »
  rationale: Le contexte eschatologique et la promesse divine rendent le sens plus intelligible, tandis que la note signale que « promis » explicite l’implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Les tours archaïques du témoin anglais ont été modernisés, tandis que les images agricoles, la citation prophétique et la tension entre promesse, persévérance, œuvres et récompense ont été conservées. Comme les données fournies indiquent qu’un contrôle direct du grec reste à faire, les décisions les plus sensibles sont formulées avec prudence et l’anomalie textuelle finale est signalée en note.
