base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: fr
  text: '« Réjouis-toi, femme stérile, toi qui n’as pas enfanté ! Éclate en cris de joie, toi qui n’as pas connu les douleurs de l’accouchement ! Car les enfants de la femme délaissée sont plus nombreux que ceux de la femme qui a un mari. »[a] En disant : « Réjouis-toi, femme stérile, toi qui n’as pas enfanté », il parlait de nous, car notre Église était stérile avant que des enfants lui soient donnés.


    Et en disant : « Éclate en cris de joie, toi qui n’as pas connu les douleurs de l’accouchement », voici ce qu’il veut dire : ne nous lassons pas d’adresser à Dieu nos prières avec simplicité, comme des femmes épuisées par les douleurs de l’accouchement.[b]


    Puis, en disant : « Les enfants de la femme délaissée sont plus nombreux que ceux de la femme qui a un mari », il parlait ainsi parce que notre peuple paraissait délaissé et abandonné de Dieu. Mais maintenant que nous avons cru, nous sommes devenus plus nombreux que ceux qui paraissaient avoir Dieu avec eux.


    Une autre parole de l’Écriture dit encore : « Je ne suis pas venu appeler des justes, mais des pécheurs. »[c]


    Voici ce qu’il veut dire : il convient de sauver ceux qui vont à leur perte.


    Car c’est vraiment une œuvre grande et merveilleuse que d’affermir, non ce qui tient debout, mais ce qui est en train de tomber.


    Ainsi, le Christ a lui aussi voulu sauver ce qui allait à sa perte. Il en a sauvé beaucoup : il est venu nous appeler alors que nous étions déjà en train de périr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Ésaïe 54.1, reprise avec une formulation proche de la tradition grecque ancienne.
    reason: Identifier la citation scripturaire et son arrière-plan.
  - marker: b
    text: 'La comparaison est difficile : elle peut évoquer soit l’épuisement lié aux douleurs de l’accouchement, soit la persévérance intense de la femme en travail. Le sens général est une exhortation à ne pas se lasser de prier.'
    reason: Signaler une ambiguïté réelle que la formulation française ne peut entièrement reproduire.
  - marker: c
    text: Citation de la parole de Jésus attestée notamment en Matthieu 9.13, Marc 2.17 et Luc 5.32.
    reason: Identifier la parole évangélique sans trancher quelle forme précise l’auteur cite.
lexical_decisions:
- source_word: ἡ ἔρημος / desolate
  choice: la femme délaissée
  rationale: Conserve l’image féminine d’Ésaïe 54 et l’idée d’abandon, tout en restant naturel en français moderne.
- source_word: ἡ ἐκκλησία / church
  choice: notre Église
  rationale: « Église » désigne ici la communauté des croyants; la majuscule signale ce sens collectif sans ajouter une identité confessionnelle.
- source_word: ἁπλότης / simplicity
  choice: simplicité
  rationale: Maintient le sens de sincérité sans détour et évite de préciser indûment « foi simple » ou « cœur pur ».
- source_word: ἀπόλλυμι / perishing
  choice: aller à sa perte / périr
  rationale: Reproduit le champ sémantique de la perdition et du danger de mort, avec une variation française naturelle selon le contexte.
- source_word: στηρίζειν / establish
  choice: affermir
  rationale: Exprime l’action de rendre stable ou de soutenir ce qui tombe, plus précisément que le calque « établir ».
theological_decisions:
- issue: Identité de la femme stérile et délaissée
  choice: Conserver l’application explicite de l’auteur à « notre Église »
  alternative: Identifier directement la femme à une entité historique ou confessionnelle particulière
  rationale: Le passage fait lui-même cette application, mais ne justifie pas une identification plus étroite.
- issue: « Ceux qui paraissaient avoir Dieu »
  choice: Garder la formulation comparative et son caractère apparent
  alternative: Nommer Israël, les Juifs ou un autre groupe
  rationale: Le texte fourni ne nomme pas explicitement le groupe; préserver cette retenue évite d’importer une interprétation polémique.
- issue: Portée de « sauver ceux qui vont à leur perte »
  choice: Traduire sans définir le mécanisme ni l’étendue du salut
  alternative: Préciser une doctrine particulière du salut
  rationale: L’énoncé insiste sur la mission salvatrice du Christ sans développer ici sa systématisation théologique.
- issue: « Ce qui » ou « ceux qui » périssent
  choice: Conserver le neutre « ce qui » lorsque le raisonnement généralise, puis « nous » pour l’application personnelle
  alternative: Uniformiser partout en « ceux qui »
  rationale: Cette formulation préserve la largeur et la tension rhétorique du passage tout en restant intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. Les citations gardent un rythme solennel sans archaïsmes. Le draft demeure prudent, car le dossier fourni indique qu’un examen direct de la tradition manuscrite grecque reste à effectuer; les choix ont donc été établis à partir du témoin anglais public, contrôlé autant que possible par les formulations grecques connues des citations scripturaires et du passage.
