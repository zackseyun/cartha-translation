    Et en disant : « Pousse des cris, toi qui n’as pas connu les douleurs de l’accouchement », voici ce qu’il veut dire : ne nous lassons pas, comme des femmes en travail, d’adresser à Dieu nos prières avec simplicité.


    Puis, en disant : « Les enfants de la femme délaissée sont plus nombreux que ceux de la femme qui a un mari », il parlait ainsi parce que notre peuple paraissait délaissé et abandonné de Dieu. Mais maintenant que nous avons cru, nous sommes devenus plus nombreux que ceux qui paraissaient avoir Dieu avec eux.


    Une autre parole de l’Écriture dit encore : « Je ne suis pas venu appeler des justes, mais des pécheurs. »[c]


    Voici ce qu’il veut dire : il convient de sauver ceux qui vont à leur perte.


    Car c’est vraiment une œuvre grande et merveilleuse que d’affermir, non ce qui tient debout, mais ce qui tombe.


    Ainsi, le Christ a lui aussi voulu sauver ce qui allait à sa perte. Il en a sauvé beaucoup : il est venu nous appeler alors que nous étions déjà en train de périr.'
