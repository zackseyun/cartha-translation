review_pass:
  verdict: revise
  source_fidelity: 'Une correction est nécessaire au deuxième paragraphe : la comparaison porte sur le fait de ne pas se lasser de prier « comme des femmes en travail », et non sur des femmes présentées comme épuisées par l’accouchement. Le reste suit fidèlement le témoin anglais fourni, notamment l’alternance entre le neutre général (« ce qui » périt/tombe) et l’application à « nous ».'
  naturalness: Le français est globalement clair, moderne et de registre approprié. La reformulation de la comparaison rend la syntaxe plus directe et évite l’inversion de sens introduite par « comme des femmes épuisées ». « Pousse des cris » est un peu plus sobre et plus proche de l’impératif cité que « Éclate en cris de joie ».
  terminology: « Église », « simplicité », « affermir » et « aller à sa perte / périr » sont appropriés. « Femme délaissée » rend naturellement l’image de la femme abandonnée/désolée sans identifier le groupe comparé. Les notes conservent l’identification des citations sans imposer d’interprétation confessionnelle.
  issues:
  - severity: medium
    issue: La comparaison avec les femmes en travail est rendue comme si elles étaient « épuisées par les douleurs de l’accouchement ».
    rationale: 'Le témoin dit : « Let us not, like women in travail, grow weary of offering up our prayers ». La version actuelle suggère que les femmes sont précisément épuisées, ce qui brouille ou inverse le mouvement exhortatif. Il faut conserver l’analogie sans ajouter « épuisées ». '
  - severity: low
    issue: La note b développe une ambiguïté que la traduction révisée peut rendre sans paraphrase interprétative.
    rationale: Une fois la syntaxe corrigée, la comparaison peut être conservée directement en français. La note n’est pas nécessaire à la fidélité et son explication de l’« épuisement » risque de reconduire le problème de la formulation antérieure.
