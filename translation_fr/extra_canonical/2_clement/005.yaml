review_pass:
  verdict: revise
  source_fidelity: 'La structure, les images et les termes majeurs du témoin sont globalement bien rendus. Deux précisions du projet dépassent toutefois le texte : « frères et sœurs » interprète l''adresse grecque ἀδελφοί, et « ensuite » ajoute une articulation temporelle qui n''est pas explicitement présente dans la proposition relative. « Sans valeur » force aussi le sens de ταπεινή (« humble, modeste, de peu d''importance »).'
  naturalness: Le français est clair, actuel et d'un registre approprié. « N'est que peu de chose et de courte durée » est plus idiomatique et plus proche de la nuance que « est sans valeur et de courte durée ».
  terminology: « Géhenne » préserve justement le toponyme et la note explicative reste non confessionnelle. « Sainteté et justice », « âme et corps », et « droit chemin » sont des choix solides. Il est préférable de conserver « frères » dans le texte, sans expansion interprétative, tout en restant naturel dans une adresse religieuse française.
  issues:
  - severity: medium
    issue: Expansion inclusive « frères et sœurs »
    rationale: Le texte source porte ἀδελφοί (« frères »). Dans ce contexte il peut viser toute la communauté, mais l'ajout explicite de « sœurs » est une explicitation interprétative qui n'est pas nécessaire à la fidélité formelle.
  - severity: low
    issue: Ajout de « ensuite » dans la parole de Jésus
    rationale: Le texte situe le pouvoir de celui qu'il faut craindre « après votre mort »; il ne dit pas explicitement que l'incapacité des meurtriers commence ensuite. La suppression préserve la concision et l'ambiguïté du texte.
  - severity: medium
    issue: « sans valeur » pour la condition/séjour de la chair
    rationale: ταπεινή évoque ce qui est humble, modeste ou de peu d'importance; « sans valeur » est plus absolu et dépréciatif. « N'est que peu de chose » garde la nuance sans jugement de nullité.
