  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: fr
  text: 'C’est pourquoi, frères, abandonnons notre séjour en ce monde, faisons la volonté de celui qui nous a appelés et n’ayons pas peur de quitter ce monde.


    Car le Seigneur dit : « Vous serez comme des agneaux au milieu des loups. »


    Mais Pierre lui répondit : « Et si les loups déchiraient les agneaux ? »


    Jésus dit à Pierre : « Une fois morts, que les agneaux ne craignent plus les loups. Vous non plus, ne craignez pas ceux qui vous tuent et qui ne peuvent rien vous faire. Craignez plutôt celui qui, après votre mort, a pouvoir sur l’âme et le corps pour les jeter dans la géhenne de feu. »[a]


    Vous le savez, frères : le séjour de cette chair en ce monde n’est que peu de chose et de courte durée, tandis que la promesse du Christ est grande et merveilleuse : le repos du royaume à venir et de la vie éternelle.[b]


    Que pouvons-nous donc faire pour les obtenir, sinon vivre dans la sainteté et la justice, considérer les choses de ce monde comme étrangères pour nous et ne pas les désirer ?


    Car, lorsque nous désirons acquérir ces choses, nous nous écartons du droit chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La géhenne, nom tiré de la vallée de Hinnom près de Jérusalem, désigne ici le lieu du jugement de feu.
    reason: Éclairer le nom ancien conservé dans le texte sans le remplacer par un terme théologiquement plus interprétatif.
  - marker: b
    text: 'La formulation peut aussi se comprendre ainsi : « le repos du royaume à venir et celui de la vie éternelle ».'
    reason: Préserver l’incertitude syntaxique concernant la relation entre le repos, le royaume et la vie éternelle.
lexical_decisions:
- source_word: παροικία / sojourn (witness)
  choice: séjour
  rationale: Conserve l’idée d’une résidence temporaire et étrangère, reprise dans le passage, sans imposer une métaphore absente du témoin fourni.
- source_word: ἀδελφοί / brethren (witness)
  choice: frères et sœurs
  rationale: Rend naturellement en français moderne l’adresse collective à la communauté; une note signale la forme littérale masculine du grec.
- source_word: ταπεινή / mean (witness)
  choice: sans valeur
  rationale: Exprime ici l’humble peu d’importance ou la faible valeur du séjour corporel, plutôt que la méchanceté morale suggérée aujourd’hui par « médiocre » ou « vil ».
- source_word: Gehenna
  choice: géhenne
  rationale: Conserve le nom traditionnel du lieu au lieu de le remplacer interprétativement par « enfer ».
- source_word: walk (witness)
  choice: vivre
  rationale: Rend l’idiome éthique de manière courante et intelligible en français.
- source_word: righteousness / righteous path (witness)
  choice: justice / droit chemin
  rationale: Maintient le champ moral de la rectitude tout en évitant une répétition artificielle en français.
theological_decisions:
- issue: Identité de celui qu’il faut craindre
  choice: celui qui
  alternative: Dieu
  rationale: Le passage ne nomme pas explicitement le référent; la traduction préserve cette formulation et sa tension théologique.
- issue: Rapport entre le royaume à venir et la vie éternelle
  choice: le repos du royaume à venir et de la vie éternelle
  alternative: le repos du royaume à venir, c’est-à-dire la vie éternelle
  rationale: La syntaxe du témoin permet plusieurs rapports entre les deux expressions; ne pas les identifier explicitement préserve l’ambiguïté.
- issue: Obtention de la promesse par la conduite
  choice: Que pouvons-nous donc faire pour les obtenir, sinon vivre…
  alternative: Nous ne pouvons les obtenir qu’en vivant…
  rationale: La question rhétorique et son exhortation sont conservées sans développer une doctrine précise du mérite ou du salut.
- issue: Sort des persécuteurs après la mort des victimes
  choice: qui, ensuite, ne peuvent plus rien vous faire
  alternative: qui ne peuvent rien vous faire
  rationale: « Ensuite » explicite la portée temporelle suggérée par le contexte sans prétendre que les meurtriers sont absolument incapables de nuire avant la mort.
translation_notes:
  register: Français international moderne, digne et accessible. Les citations gardent une solennité simple, sans archaïsmes. La traduction reste provisoire parce que le dossier fourni indique qu’une vérification directe du grec est encore en attente; les décisions sont donc ancrées dans le témoin anglais public fourni et dans les formes grecques largement attestées lorsque celles-ci peuvent être identifiées avec prudence.
