review_pass:
  verdict: revise
  source_fidelity: 'Le fond est globalement fidèle au témoin anglais et conserve utilement les tensions du passage, notamment le salut du destinataire et du conseiller. Deux points demandent cependant une correction : la construction conditionnelle de la « rétribution » doit être explicitée, et l’approche confiante de Dieu est, dans le contexte de la citation, une demande adressée à Dieu, non une simple prise de parole. « Plaisir » rend plus exactement la valeur de pleasure que « joie ».'
  naturalness: 'Le français est dans l’ensemble fluide et d’un registre approprié. « Sa propre personne » est toutefois inutilement lourd dans ce contexte ; « lui-même » est naturel. La phrase introduite par « Voici… : que » est grammaticalement possible mais moins nette que la condition explicite. La répétition « plus disposé à donner que celui qui demande ne l’est à demander » reste volontairement proche de la formulation rhétorique transmise.'
  terminology: « Maîtrise de soi », « justice », « sainteté », « assurance », « gage » et « bonté » conviennent au français international moderne. « Rendre à Dieu » conserve la force de recompense/retour sans transformer l’expression en mérite théologique. « Âme » est préférable ici, car le passage parle explicitement de convertir et de sauver une ψυχή dans le vocabulaire traditionnel de l’exhortation ; ce choix n’impose pas une anthropologie dualiste.
  issues:
  - severity: medium
    issue: La relation conditionnelle de la deuxième phrase est insuffisamment marquée.
    rationale: 'Le témoin présente la réponse que les croyants peuvent rendre à Dieu sous la condition que celui qui parle et celui qui écoute le fassent avec foi et amour. « Voici… : que » laisse la syntaxe et la logique de la proposition inachevées en français.'
  - severity: medium
    issue: « Nous adresser avec assurance à Dieu » atténue l’action de demander à Dieu.
    rationale: La formulation transmise est manifestement corrompue dans le témoin anglais (« be with boldness as of God »), mais le contexte grec traditionnel et la réponse citée d’Ésaïe portent sur une demande faite à Dieu. « Demander avec assurance à Dieu » rend cette action sans ajout doctrinal.
  - severity: low
    issue: « Joie » remplace la notion de plaisir du témoin.
    rationale: Le contraste rhétorique porte sur l’ampleur du plaisir apporté à ceux qui accomplissent ces paroles et de la condamnation des désobéissants. « Plaisir » est plus exact et reste naturel.
  revised_text: 'Je ne pense pas vous avoir donné un conseil sans importance au sujet de la maîtrise de soi. Celui qui le met en pratique ne le regrettera pas : il se sauvera lui-même et me sauvera aussi, moi qui lui ai donné ce conseil. Car ce n’est pas une petite récompense que de ramener une âme qui s’égare et va à sa perte, afin qu’elle soit sauvée.


    Car voici la rétribution que nous pouvons rendre à Dieu qui nous a créés : que celui qui parle et celui qui écoute parlent et écoutent avec foi et amour.


    Demeurons donc dans ce que nous avons cru, dans la justice et la sainteté, afin de demander avec assurance à Dieu, qui dit : « Pendant que tu parleras encore, je dirai : Me voici. »[a]


    Cette parole est le gage d’une grande promesse. En effet, le Seigneur dit de lui-même qu’il est plus disposé à donner que celui qui demande ne l’est à demander.


    Puisque nous avons part à une si grande bonté, ne nous privons pas nous-mêmes de tant de biens. Car, autant ces paroles procurent un grand plaisir à ceux qui les mettent en pratique, autant elles entraînent une grande condamnation pour ceux qui désobéissent.'
  revised_footnotes:
  - marker: a
    text: 'Citation proche d’Ésaïe 58.9 dans la Septante : « Pendant que tu parleras encore, il dira : Me voici. » Ici, le texte est formulé à la première personne : « je dirai ».'
    reason: Signaler l’arrière-plan scripturaire et la variation de personne perceptible dans le témoin transmis.
  revision_rationale: Révision limitée aux points où la fidélité syntaxique ou sémantique et l’idiome français l’exigent. Le salut du conseiller est maintenu sans atténuation confessionnelle. La demande confiante adressée à Dieu corrige une obscurité du témoin anglais en cohérence avec le contexte immédiat, tout en restant signalée par la prudence requise puisque la vérification grecque directe est indiquée comme en attente.
