base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: fr
  text: 'Je ne pense pas vous avoir donné un conseil sans importance au sujet de la maîtrise de soi. Celui qui le met en pratique ne le regrettera pas : il sauvera à la fois sa propre personne et moi, qui l’ai conseillé. Car ce n’est pas une petite récompense que de ramener une personne qui s’égare et va à sa perte, afin qu’elle soit sauvée.


    Voici, en effet, ce que nous pouvons offrir en retour à Dieu qui nous a créés : que celui qui parle et celui qui écoute parlent et écoutent avec foi et amour.


    Demeurons donc dans ce que nous avons cru, dans la justice et la sainteté, afin de pouvoir nous adresser avec assurance à Dieu, qui dit : « Pendant que tu parleras encore, je dirai : Me voici. »[a]


    Cette parole est le gage d’une grande promesse. En effet, le Seigneur dit de lui-même qu’il est plus disposé à donner que celui qui demande ne l’est à demander.


    Puisque nous avons part à une si grande bonté, ne nous privons pas nous-mêmes de tant de biens. Car, autant ces paroles procurent une grande joie à ceux qui les mettent en pratique, autant elles entraînent une grande condamnation pour ceux qui désobéissent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citation proche d’Ésaïe 58.9 dans la Septante : « Pendant que tu parleras encore, il dira : Me voici. » Ici, le texte est formulé à la première personne : « je dirai ».'
    reason: Signaler l’arrière-plan scripturaire et la variation de personne perceptible dans le témoin transmis.
lexical_decisions:
- source_word: continence
  choice: maîtrise de soi
  rationale: Le témoin anglais emploie « continence », mais le sens ascétique plus large est mieux rendu en français actuel par « maîtrise de soi », sans le limiter arbitrairement à l’abstinence sexuelle.
- source_word: convert a wandering and perishing soul
  choice: ramener une personne qui s’égare et va à sa perte
  rationale: « Ramener » conserve l’idée de détourner quelqu’un de son égarement, tandis que « personne » rend naturellement l’usage anthropologique de « soul » sans imposer une lecture dualiste.
- source_word: recompense
  choice: ce que nous pouvons offrir en retour
  rationale: Cette formulation exprime une réponse reconnaissante à Dieu plutôt qu’un paiement qui pourrait suggérer que l’être humain acquitte une dette envers son Créateur.
- source_word: abide
  choice: demeurons
  rationale: « Demeurer » préserve l’idée de persévérance stable dans la foi, la justice et la sainteté.
- source_word: token
  choice: gage
  rationale: « Gage » désigne naturellement le signe garantissant la réalité d’une promesse.
- source_word: kindness
  choice: bonté
  rationale: « Bonté » convient au registre théologique tout en restant courant et ne précise pas davantage la nuance faute de révision grecque directe.
- source_word: begrudge ourselves
  choice: ne nous privons pas nous-mêmes
  rationale: L’expression idiomatique française transmet l’idée de ne pas se refuser les biens proposés, plutôt qu’une traduction littérale obscure.
theological_decisions:
- issue: Le salut du conseiller et de l’auditeur par la mise en pratique du conseil
  choice: « il sauvera à la fois sa propre personne et moi, qui l’ai conseillé »
  alternative: Atténuer en disant qu’il « contribuera au salut » du conseiller
  rationale: Le texte témoin formule directement le salut des deux personnes. La traduction conserve cette tension sans introduire une harmonisation doctrinale absente du passage.
- issue: Assurance devant Dieu
  choice: « afin de pouvoir nous adresser avec assurance à Dieu »
  alternative: « afin de nous tenir avec assurance devant Dieu »
  rationale: Le contexte immédiat cite une réponse divine à celui qui parle. « Nous adresser » rend ce lien tout en préservant l’idée d’une approche confiante de Dieu.
- issue: Paroles qui apportent condamnation aux désobéissants
  choice: « elles entraînent une grande condamnation »
  alternative: « elles témoignent d’une grande condamnation »
  rationale: Le témoin attribue aux paroles un effet de condamnation; la formulation retenue maintient cette force sans définir plus précisément le mécanisme du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La rédaction suit une équivalence optimale, mais reste provisoire puisque le dossier fourni indique qu’une vérification directe du grec est encore attendue. Les formulations potentiellement théologiques ont été conservées sans les aligner sur une tradition confessionnelle particulière.
