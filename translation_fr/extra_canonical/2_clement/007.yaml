review_pass:
  verdict: revise
  source_fidelity: Le texte français suit globalement avec fidélité le témoin anglais fourni et conserve l’imagerie agonistique, la couronne, le sceau et la citation scripturaire. Toutefois, « l’épreuve » atténue et déplace l’image explicite du concours/ combat, et « Que fera-t-on » introduit un futur plus déterminé là où la question source demande ce qui « sera fait ». Surtout, « approchons-nous-en » a pour antécédent immédiat la couronne mais reste moins explicite que « approchons-nous au moins de la couronne ».
  naturalness: Le français est moderne et soutenu. Une terminologie plus constante (« combat » / « combattre ») rend mieux l’unité rhétorique et évite l’alternance un peu disparate entre « compétition », « lutter » et « épreuve ». « Se rendre en grand nombre » est plus idiomatique et précis que « accourons-y en foule » pour l’idée de se joindre au concours.
  terminology: « Combat » rend naturellement le champ de l’ἀγών et permet de préserver l’opposition entre le combat périssable et impérissable. « Fraudé dans le combat » rend de manière plus proche le verbe de corruption/fraude que le simple « tricher », sans expliciter indûment la nature de l’infraction. « Sceau » doit rester non interprété; la note existante est appropriée.
  issues:
  - severity: medium
    issue: « l’épreuve est toute proche »
    rationale: Le témoin parle du « contest » imminent; « épreuve » peut évoquer une tribulation plutôt qu’un combat ou concours athlétique. Il est préférable de maintenir l’image explicitement.
  - severity: low
    issue: Inconstance de l’image agonistique
    rationale: « compétition / lutter / épreuve » est compréhensible, mais « combat / combattre » maintient plus nettement le réseau lexical et le ton parénétique.
  - severity: low
    issue: « Que fera-t-on »
    rationale: Cette formulation transforme légèrement la question passive prospective (« What shall be done »). « Que sera-t-il fait » est plus fidèle, tout en restant naturel dans un registre soutenu.
  - severity: low
    issue: « approchons-nous-en »
    rationale: Le pronom est grammaticalement possible, mais « approchons-nous au moins de la couronne » maintient explicitement l’objet de l’image.
  revised_text: 'Ainsi donc, mes frères, combattons, sachant que le combat est proche. Beaucoup prennent part aux combats périssables, mais tous ne sont pas couronnés : seuls le sont ceux qui ont beaucoup peiné et combattu vaillamment.


    Combattons donc, afin que nous soyons tous couronnés.


    Courons donc dans la voie droite, le combat impérissable. Rendons-nous-y en grand nombre et combattons, afin que nous aussi soyons couronnés. Et si nous ne pouvons pas tous être couronnés, approchons-nous au moins de la couronne.


    Nous devons savoir que celui qui combat dans un combat périssable, s’il est surpris à frauder, est d’abord fouetté, puis écarté et chassé de l’hippodrome.


    Qu’en pensez-vous ? Que sera-t-il fait à celui qui aura fraudé dans le combat impérissable ?


    Car, au sujet de ceux qui n’ont pas gardé le sceau[a], il dit : « Leur ver ne mourra pas, leur feu ne s’éteindra pas, et ils seront un spectacle pour toute chair. »'
  revised_footnotes:
  - marker: a
    text: Le texte ne précise pas ici ce que représente « le sceau » ; dans les premiers écrits chrétiens, cette image peut notamment être associée au baptême ou à l’appartenance à Dieu.
    reason: Signaler l’ambiguïté historique et théologique sans l’éliminer dans le corps du texte.
  revision_rationale: Révision prudente pour rétablir l’image continue du combat présente dans le témoin, expliciter l’approche de la couronne et conserver la portée prospective de la question sur le jugement. « Hippodrome » traduit plus précisément le lieu de course antique que « stade », sans modifier le sens. La note sur le sceau est conservée, car elle respecte l’ambiguïté du passage.
