base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: fr
  text: 'Ainsi donc, mes frères, luttons, sachant que l’épreuve est toute proche. Beaucoup prennent part aux compétitions périssables, mais tous ne reçoivent pas la couronne : seuls la reçoivent ceux qui se sont donné beaucoup de peine et ont lutté vaillamment.


    Luttons donc, afin que nous recevions tous la couronne.


    Courons donc sur la voie droite, dans la compétition impérissable. Accourons-y en foule et luttons, afin que nous aussi recevions la couronne. Et si nous ne pouvons pas tous la recevoir, approchons-nous-en au moins.


    Nous devons savoir que celui qui prend part à une compétition périssable, s’il est surpris à tricher, est d’abord fouetté, puis écarté et chassé du stade.


    Qu’en pensez-vous ? Que fera-t-on à celui qui aura triché dans la compétition impérissable ?


    Au sujet de ceux qui n’ont pas gardé le sceau[a], il dit : « Leur ver ne mourra pas, leur feu ne s’éteindra pas, et ils seront offerts en spectacle à toute chair. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte ne précise pas ici ce que représente « le sceau »; dans les premiers écrits chrétiens, cette image peut notamment être associée au baptême ou à l’appartenance à Dieu.
    reason: Signaler l’ambiguïté historique et théologique sans l’éliminer dans le corps du texte.
lexical_decisions:
- source_word: contest / compete (ἀγών / ἀγωνίζομαι, sous réserve de vérification directe du grec)
  choice: compétition / lutter
  rationale: Conserve l’image athlétique continue tout en employant un français naturel. « Lutter » rend aussi l’effort et le courage associés à l’épreuve.
- source_word: corruptible / incorruptible
  choice: périssable / impérissable
  rationale: Exprime clairement le contraste entre les compétitions temporaires et l’épreuve dont l’enjeu ne se corrompt pas.
- source_word: crowned / crown
  choice: recevoir la couronne / couronne
  rationale: Préserve l’image antique de la récompense décernée au vainqueur sans la réduire à une simple victoire.
- source_word: dealing corruptly
  choice: tricher
  rationale: Dans le cadre d’une compétition, ce verbe rend directement l’idée de fraude et permet une lecture fluide, même si le jeu lexical éventuel avec « périssable » n’est pas reproductible naturellement en français.
- source_word: seal
  choice: sceau
  rationale: Maintient le symbole sans préciser de manière interprétative s’il désigne ici le baptême, la confession ou une autre marque d’appartenance.
- source_word: all flesh
  choice: toute chair
  rationale: Conserve la formulation scripturaire et sa portée collective plutôt que de la paraphraser par « toute l’humanité ».
theological_decisions:
- issue: Sens du sceau
  choice: Conserver « le sceau » sans identification explicite
  alternative: Interpréter le sceau comme le baptême
  rationale: Le passage ne fournit pas lui-même cette identification; la traduction préserve donc l’ouverture du symbole.
- issue: Possibilité que tous reçoivent la couronne
  choice: Maintenir côte à côte l’exhortation à ce que tous soient couronnés et l’hypothèse qu’ils ne le soient pas tous
  alternative: Harmoniser les deux phrases en limitant d’avance le nombre de vainqueurs
  rationale: Cette tension rhétorique appartient au texte et ne doit pas être résolue silencieusement.
- issue: Châtiment final
  choice: Préserver les images du ver, du feu et du spectacle
  alternative: Les expliquer comme symboliques ou littérales
  rationale: La traduction ne tranche pas une question interprétative que le passage laisse ouverte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore athlétique est maintenue d’un bout à l’autre. Le travail repose sur le témoin anglais public fourni; les choix associés aux termes grecs restent à confirmer par une collation directe de la tradition manuscrite grecque.
