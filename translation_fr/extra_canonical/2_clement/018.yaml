base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: fr
  text: 'Ainsi donc, soyons nous aussi trouvés parmi ceux qui rendent grâce, parmi ceux qui ont servi Dieu, et non parmi les impies qui sont jugés.


    Car moi aussi, qui suis un très grand pécheur et qui n’ai pas encore échappé à la tentation, mais qui me trouve encore au milieu des pièges du diable, je m’applique à poursuivre la justice, afin de parvenir au moins à m’en approcher, car je crains le jugement à venir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais du domaine public fourni; la vérification directe du texte grec reste à effectuer.
    reason: Le dossier indique explicitement que la révision dans la langue source est encore en attente; la note signale honnêtement cette limite documentaire.
lexical_decisions:
- source_word: give thanks
  choice: rendent grâce
  rationale: Formulation française naturelle et digne, qui conserve le sens religieux de la reconnaissance adressée à Dieu.
- source_word: served God
  choice: ont servi Dieu
  rationale: Rend directement l’idée du service accompli envers Dieu sans préciser indûment sa forme.
- source_word: ungodly
  choice: impies
  rationale: Terme français courant dans le registre biblique, désignant ceux qui vivent sans respect pour Dieu.
- source_word: engines of the devil
  choice: pièges du diable
  rationale: Le témoin anglais emploie une image ancienne pouvant désigner des machinations ou dispositifs hostiles; « pièges » reste naturel et préserve l’idée de danger rusé.
- source_word: do my diligence to follow after righteousness
  choice: je m’applique à poursuivre la justice
  rationale: Exprime un effort soutenu vers une conduite juste, sans suggérer que cette justice est déjà atteinte.
- source_word: judgment to come
  choice: jugement à venir
  rationale: Conserve la portée eschatologique ouverte et la formulation traditionnelle intelligible.
theological_decisions:
- issue: Rapport entre effort moral et justice
  choice: « je m’applique à poursuivre la justice, afin de parvenir au moins à m’en approcher »
  alternative: « je m’efforce d’obtenir la justice »
  rationale: La formulation retenue garde l’humilité et la distance exprimées par le texte, sans transformer la justice en mérite acquis ni résoudre la tension théologique.
- issue: Nature de la tentation
  choice: « la tentation » au singulier
  alternative: « les épreuves »
  rationale: Le témoin fourni porte « temptation »; le singulier maintient l’ambiguïté entre sollicitation au mal et situation d’épreuve.
- issue: Identité des impies jugés
  choice: « les impies qui sont jugés »
  alternative: « les impies condamnés »
  rationale: « Jugés » ne présuppose pas lexicalement l’issue du jugement et respecte la formulation transmise.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le mouvement exhortatif puis autobiographique du passage, tout en évitant les tournures françaises archaïques.
