source:
  text: 'Therefore, brethren, let us repent forthwith. Let us be sober unto that which is good: for we are full of much folly and wickedness. Let us wipe away from us our former sins, and let us not be found to be men pleasers. Neither let us desire to please one another only, but also those men that are without, by our righteousness, that the Name be not blasphemed by reason of us.


    For the Lord saith, Every way My Name is blasphemed among all the Gentiles; and again, Woe unto him by reason of whom My Name is blasphemed. Wherein is it blasphemed? In that ye do not the things which I desire.


    For the Gentiles, when they hear from our mouths the oracles of God, marvel at them for their beauty and greatness; then, when they discover that our works are not worthy of the words which we speak, forthwith they betake themselves to blasphemy, saying that it is an idle story and a delusion.


    For when they here from us that God saith, It is no thank unto you, if ye love them that love you, but this is thank unto you, if ye love your enemies and them that hate you; when they hear these things, I say, they marvel at their exceeding goodness; but when they see that we not only do not love us, they laugh us to scorn, and the Name is blasphemed.'
