base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: fr
  text: 'Ainsi donc, frères et sœurs, repentons-nous sans tarder. Gardons l’esprit lucide en vue du bien, car nous sommes remplis de beaucoup de folie et de méchanceté. Effaçons nos péchés d’autrefois et ne nous montrons pas désireux de plaire aux humains. Ne cherchons pas seulement à nous plaire les uns aux autres, mais aussi à plaire, par notre conduite juste, à ceux du dehors, afin que le Nom ne soit pas blasphémé à cause de nous.


    Car le Seigneur dit : « De toute manière, mon Nom est blasphémé parmi toutes les nations » ; et encore : « Malheur à celui par qui mon Nom est blasphémé ! » En quoi est-il blasphémé ? En ce que vous ne faites pas ce que je désire.


    En effet, lorsque les nations entendent de notre bouche les paroles de Dieu, elles s’émerveillent de leur beauté et de leur grandeur. Mais lorsqu’elles découvrent ensuite que nos actes ne sont pas dignes des paroles que nous prononçons, elles se mettent aussitôt à blasphémer, disant que ce n’est qu’une histoire sans fondement et une illusion.


    Car lorsqu’elles nous entendent dire que Dieu déclare : « Il n’y a pour vous aucun mérite à aimer ceux qui vous aiment ; mais il y a du mérite à aimer vos ennemis et ceux qui vous haïssent », lorsqu’elles entendent cela, dis-je, elles s’émerveillent de cette bonté extraordinaire. Mais lorsqu’elles voient que non seulement nous n’aimons pas les nôtres[a], elles se moquent de nous, et le Nom est blasphémé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte transmis à cet endroit paraît incomplet ou corrompu. Le sens exact de la proposition après « non seulement » demeure incertain ; certaines restitutions comprennent : « nous n’aimons pas nos ennemis, ni même ceux qui nous aiment ».'
    reason: Signaler honnêtement une difficulté textuelle réelle et éviter de présenter une conjecture comme certaine.
lexical_decisions:
- source_word: brethren
  choice: frères et sœurs
  rationale: Rend naturellement l’adresse communautaire collective en français moderne sans restreindre le groupe aux hommes.
- source_word: be sober unto that which is good
  choice: gardons l’esprit lucide en vue du bien
  rationale: Conserve l’idée de vigilance et de maîtrise de soi orientées vers le bien, sans suggérer seulement l’abstinence d’alcool.
- source_word: men pleasers
  choice: désireux de plaire aux humains
  rationale: Expression française claire qui garde la critique de la recherche d’approbation humaine.
- source_word: those men that are without
  choice: ceux du dehors
  rationale: Conserve l’expression ancienne désignant les personnes extérieures à la communauté, tout en restant intelligible.
- source_word: the Name
  choice: le Nom
  rationale: La majuscule signale la désignation révérencielle du nom divin sans explicitation doctrinale ajoutée.
- source_word: Gentiles
  choice: les nations
  rationale: Choix traditionnel et inclusif pour les peuples non juifs dans un contexte de citation scripturaire et de regard extérieur à la communauté.
- source_word: oracles of God
  choice: les paroles de Dieu
  rationale: Formulation naturelle en français moderne qui transmet l’idée de déclarations divines autorisées.
- source_word: no thank / thank
  choice: aucun mérite / du mérite
  rationale: Exprime ici la valeur reconnue ou louable d’un comportement, plutôt qu’un remerciement.
- source_word: idle story
  choice: une histoire sans fondement
  rationale: Rend l’accusation de vacuité ou d’inconsistance de manière idiomatique.
theological_decisions:
- issue: Rapport entre conduite juste et témoignage auprès des personnes extérieures
  choice: « à plaire, par notre conduite juste, à ceux du dehors »
  alternative: « gagner l’approbation de ceux du dehors par notre justice »
  rationale: Préserve l’exhortation éthique du témoin sans faire de la justice un moyen de salut ni réduire le propos à la réputation.
- issue: Identité du « Nom »
  choice: Conserver « le Nom » sans ajouter « de Dieu » ou « du Seigneur »
  alternative: « le nom de Dieu »
  rationale: Respecte la formulation révérencielle et son ambiguïté référentielle dans le passage.
- issue: Formulation lacunaire de la dernière phrase
  choice: « non seulement nous n’aimons pas les nôtres[a] » avec note signalant l’incertitude
  alternative: Restaurer conjecturalement « nous n’aimons pas nos ennemis, mais pas même ceux qui nous aiment »
  rationale: Le témoin fourni présente une construction incomplète. Une traduction prudente ne doit pas imposer silencieusement une restauration théologiquement plausible.
- issue: Nature des paroles citées
  choice: Présenter les citations comme paroles du Seigneur ou de Dieu sans identifier une source canonique précise
  alternative: Ajouter des références bibliques explicites
  rationale: Le texte combine ou adapte vraisemblablement des traditions scripturaires ; ne pas harmoniser préserve sa forme propre.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et les répétitions rhétoriques sont conservés. La traduction reste nécessairement provisoire, puisque le dossier fourni indique qu’une vérification directe du grec est encore à effectuer.
