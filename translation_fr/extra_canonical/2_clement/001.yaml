base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: fr
  text: 'Frères et sœurs, nous devons considérer Jésus-Christ comme Dieu, comme le Juge des vivants et des morts.


    Nous ne devons pas non plus avoir une piètre idée de notre salut. En effet, lorsque nous avons de lui une piètre idée, nous nous attendons aussi à recevoir peu. Ceux qui entendent cela comme s’il était question de choses insignifiantes pèchent ; et nous aussi, nous péchons, parce que nous ne savons pas d’où, par qui et pour quel lieu nous avons été appelés, ni tout ce que Jésus-Christ a enduré de souffrir pour nous.


    Quelle récompense lui donnerons-nous donc ? Quel fruit serait digne du don qu’il nous a fait ? Et combien de bienfaits lui devons-nous !


    Car il nous a donné la lumière ; il nous a parlé comme un père à ses enfants ; il nous a sauvés alors que nous périssions.


    Quelle louange lui offrirons-nous donc ? Quelle compensation en retour pour ce que nous avons reçu ?


    Notre intelligence était mutilée, et nous adorions des objets de bois et de pierre, d’or, d’argent et de bronze, œuvres de mains humaines. Notre vie entière n’était rien d’autre que la mort. Alors que nous étions ainsi enveloppés de ténèbres et que cet épais brouillard obscurcissait notre vue, nous avons recouvré la vue : par sa volonté, nous nous sommes défaits du nuage qui nous enveloppait.


    Car il a eu pitié de nous et, dans sa compassion, il nous a sauvés, voyant en nous beaucoup d’égarement et de perdition, alors même que nous n’avions aucun espoir de salut, sinon celui qui venait de lui.


    Car il nous a appelés quand nous n’étions pas et, du non-être, il a voulu nous faire venir à l’être.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « quand nous n’étions pas » peut évoquer le passage du non-être à l’existence, mais aussi l’appel de personnes ou d’un peuple qui n’avaient auparavant aucune existence reconnue comme tels. Le texte laisse cette portée ouverte.
    reason: Préserver l’ambiguïté de la conclusion sans imposer une lecture exclusivement métaphysique ou ecclésiale.
lexical_decisions:
- source_word: ἀδελφοί (reconstructed from the Greek tradition behind “Brethren”)
  choice: Frères et sœurs
  rationale: Formulation française naturelle pour une adresse communautaire à l’ensemble des croyants, tout en conservant la proximité familiale du terme grec.
- source_word: περὶ Ἰησοῦ Χριστοῦ ὡς περὶ θεοῦ (opening clause)
  choice: considérer Jésus-Christ comme Dieu
  rationale: Conserve sans l’atténuer l’identification christologique directe de l’ouverture.
- source_word: κριτὴς ζώντων καὶ νεκρῶν
  choice: le Juge des vivants et des morts
  rationale: Expression claire et traditionnelle, fidèle à l’opposition grecque entre vivants et morts.
- source_word: μικρὰ φρονεῖν / μικρὰ ἀκούειν (sense reflected by the witness)
  choice: avoir une piètre idée / comme s’il s’agissait de choses sans importance
  rationale: Rend la répétition conceptuelle sans employer le calque peu naturel « penser de petites choses ».
- source_word: σωτηρία
  choice: salut
  rationale: Terme français courant et théologiquement non restrictif.
- source_word: ξύλα καὶ λίθους
  choice: le bois, la pierre
  rationale: Désigne les matières des idoles plus naturellement que « des morceaux de bois », tout en maintenant la critique des œuvres humaines.
- source_word: οὐκ ὄντας / μὴ εἶναι / εἶναι (final antithesis, as reflected in the witness)
  choice: quand nous n’étions pas / du non-être / nous faire être
  rationale: Préserve le contraste ontologique ou vocationnel délibérément abrupt au lieu de l’interpréter dans un seul sens.
theological_decisions:
- issue: Désignation de Jésus-Christ comme Dieu
  choice: « considérer Jésus-Christ comme Dieu »
  alternative: « avoir de Jésus-Christ la pensée que l’on a de Dieu »
  rationale: La formulation retenue garde la force directe du témoignage sans ajout explicatif ni qualification doctrinale.
- issue: Référent du pronom dans « lorsque nous avons de lui une piètre idée »
  choice: Maintenir le pronom « lui », renvoyant naturellement au Christ dans le contexte
  alternative: Remplacer par « lorsque nous avons une piètre idée du salut »
  rationale: Le témoin anglais présente une tension entre le salut et « Him ». Le texte retient cette tension plutôt que de l’harmoniser silencieusement.
- issue: Sens de l’appel final depuis le non-être
  choice: Conserver une formulation ambiguë et littérale
  alternative: Interpréter comme conversion des païens, création, ou constitution du peuple de Dieu
  rationale: Le passage peut évoquer plusieurs cadres bibliques et théologiques. Aucun n’est imposé par la formulation transmise ; une note signale l’ambiguïté.
- issue: Langage de rétribution envers le Christ
  choice: « récompense », « fruit », « rendre »
  alternative: Transformer en simple action de grâce
  rationale: Préserve la série de questions rhétoriques et sa tension, tout en évitant de suggérer qu’un remboursement réel du salut serait possible.
translation_notes:
  register: Français international moderne, digne et accessible. Les périodes longues ont été légèrement structurées pour la lisibilité, tout en maintenant les répétitions rhétoriques. Le brouillon est établi avec prudence à partir du témoin anglais public fourni et des formulations grecques connues de la tradition de 2 Clément 1 ; une collation intégrale avec une édition critique grecque reste souhaitable.
