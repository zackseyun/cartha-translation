review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour refléter plus directement les formulations conservées par le témoin : « le jour de l’apparition de Dieu », la tournure prospective « il y aura dans deux corps une seule âme », et surtout la formule énigmatique « le mâle avec la femelle, ni mâle ni femelle ». La révision ne résout ni ne reformule doctrinalement cette dernière expression.'
  naturalness: Le français est globalement clair et de registre approprié. « À tout moment » est plus idiomatique ici que « à toute heure ». « Mâle/femelle » rend plus exactement les substantifs de la parole citée, tandis que « homme/femme » convient dans l’explication qui suit.
  terminology: « Amour », « justice », « âme », « corps », « œuvres bonnes » et « dissimulation » sont conservés. « Apparition de Dieu » restitue le substantif ἐπιφάνεια sans ajouter une paraphrase temporelle. Aucun terme confessionnel n’est imposé.
  issues:
  - severity: medium
    issue: La formule « le masculin avec le féminin ne sera ni masculin ni féminin » modifie la construction énigmatique transmise.
    rationale: Elle met au singulier un groupe coordonné et introduit une prédication au futur (« ne sera ») qui rend la formule moins fidèle. « Le mâle avec la femelle, ni mâle ni femelle » conserve la juxtaposition abrupte du témoin.
  - severity: low
    issue: « où Dieu apparaîtra » paraphrase « le jour de l’apparition de Dieu ».
    rationale: La paraphrase est compréhensible, mais le substantif « apparition » correspond plus étroitement à ἐπιφάνεια et préserve la formulation du texte.
  - severity: low
    issue: « il y a une seule âme » atténue la valeur prospective de l’explication.
    rationale: Le témoin dit « il y aura ... une seule âme »; cette forme doit être conservée.
  - severity: low
    issue: « à toute heure » est moins naturel en français international moderne dans cette exhortation.
    rationale: « À tout moment » exprime clairement l’attente constante demandée par καθ’ ὥραν.
  revised_text: 'Attendons donc à tout moment le royaume de Dieu, dans l’amour et la justice, puisque nous ne connaissons pas le jour de l’apparition de Dieu.


    En effet, comme quelqu’un lui demandait quand viendrait son royaume, le Seigneur lui-même dit : « Lorsque les deux seront un, et que l’extérieur sera comme l’intérieur, et le mâle avec la femelle, ni mâle ni femelle. »


    Les deux sont un lorsque nous nous disons la vérité les uns aux autres et que, dans deux corps, il y aura une seule âme, sans dissimulation.


    Quant à « l’extérieur comme l’intérieur », voici ce que cela signifie : par l’intérieur, il entend l’âme, et par l’extérieur, le corps. Ainsi donc, de même que ton corps est visible, que ton âme aussi se manifeste par ses œuvres bonnes.


    Quant à « le mâle avec la femelle, ni mâle ni femelle », voici ce que cela signifie : qu’un frère, en voyant une sœur, n’ait aucune pensée d’elle comme d’une femme, et qu’une sœur, en voyant un frère, n’ait aucune pensée de lui comme d’un homme.


    « Si vous faites cela, dit-il, le royaume de mon Père viendra. »'
