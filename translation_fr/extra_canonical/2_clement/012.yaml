base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: fr
  text: 'Attendons donc à toute heure le royaume de Dieu, dans l’amour et la justice, puisque nous ne connaissons pas le jour où Dieu apparaîtra.


    En effet, comme quelqu’un lui demandait quand viendrait son royaume, le Seigneur lui-même répondit : « Lorsque les deux seront un, que l’extérieur sera comme l’intérieur, et que le masculin avec le féminin ne sera ni masculin ni féminin. »


    Les deux sont un lorsque nous nous disons la vérité les uns aux autres et que, dans deux corps, il y a une seule âme, sans dissimulation.


    Quant à « l’extérieur comme l’intérieur », voici ce que cela signifie : l’intérieur désigne l’âme, et l’extérieur, le corps. Ainsi donc, de même que ton corps est visible, que ton âme aussi se manifeste par ses œuvres bonnes.


    Quant à « le masculin avec le féminin, ni masculin ni féminin », voici ce que cela signifie : qu’un frère, en voyant une sœur, ne pense pas à elle comme à une femme, et qu’une sœur, en voyant un frère, ne pense pas à lui comme à un homme.


    « Si vous faites cela, dit-il, le royaume de mon Père viendra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὥραν
  choice: à toute heure
  rationale: Rend l’idée d’une attente constante ou opportune portée par l’expression grecque, plutôt que l’archaïque et ambigu « de bonne heure » du témoin anglais.
- source_word: ἐπιφάνεια
  choice: où Dieu apparaîtra
  rationale: Une formulation verbale naturelle en français conserve l’idée de manifestation ou d’apparition divine sans imposer un vocabulaire doctrinal spécialisé.
- source_word: ἀνυπόκριτος / notion correspondante de dissimulation
  choice: sans dissimulation
  rationale: Préserve l’accent sur la sincérité et l’absence de duplicité entre les deux personnes.
- source_word: ἔργα ἀγαθά
  choice: œuvres bonnes
  rationale: Expression claire et digne, qui garde le caractère concret des actes manifestant l’état de l’âme.
- source_word: ἄρσεν / θῆλυ
  choice: masculin / féminin
  rationale: Dans la parole citée, ces termes abstraits préservent la forme énigmatique de l’opposition; l’explication qui suit emploie naturellement « femme » et « homme ».
theological_decisions:
- issue: Nature de la parole attribuée au Seigneur
  choice: Conserver la parole sous sa forme énigmatique et son explication propre au document
  alternative: L’harmoniser avec un passage canonique ou l’expliquer au moyen d’une tradition doctrinale ultérieure
  rationale: Le texte présente une parole non canonique avec sa propre interprétation; la traduction ne doit ni effacer son étrangeté ni résoudre sa tension.
- issue: « ni masculin ni féminin »
  choice: Conserver littéralement l’effacement de la distinction dans la citation, puis traduire fidèlement l’interprétation éthique donnée par l’auteur
  alternative: Transformer directement la citation en prescription d’ascèse sexuelle ou en affirmation anthropologique générale
  rationale: Le passage lui-même relie la formule au regard non sexualisé entre frère et sœur; il faut préserver à la fois la portée énigmatique de la citation et l’explication du texte.
- issue: Venue du royaume
  choice: « le royaume de mon Père viendra »
  alternative: « vous entrerez dans le royaume » ou « le royaume sera établi »
  rationale: La formulation conserve le royaume comme sujet de sa venue et évite d’ajouter un mécanisme théologique absent du témoin.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est maintenu dans l’exhortation sur le corps et l’âme, tandis que le pluriel est conservé dans l’adresse collective finale. Les répétitions interprétatives (« voici ce que cela signifie ») sont gardées pour respecter la structure argumentative. Projet établi avec consultation de la tradition grecque indiquée, mais les données fournies reposant principalement sur un témoin anglais public, une vérification critique directe et complète du grec demeure souhaitable avant publication définitive.
