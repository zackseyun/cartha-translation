base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: fr
  text: 'Que personne parmi vous ne dise que cette chair ne sera pas jugée et ne ressuscitera pas.


    Comprenez-le bien : en quoi avez-vous été sauvés ? En quoi avez-vous recouvré la vue, sinon dans cette chair ?


    Nous devons donc garder la chair comme un temple de Dieu.


    Car, de même que vous avez été appelés dans la chair, vous viendrez aussi dans la chair.[a]


    Si le Christ, le Seigneur qui nous a sauvés, était d’abord esprit, puis est devenu chair et nous a appelés ainsi, de même nous recevrons aussi notre récompense dans cette chair.[b]


    Aimons-nous donc les uns les autres, afin que nous parvenions tous au royaume de Dieu.


    Tant que nous avons le temps d’être guéris, remettons-nous entre les mains de Dieu, le médecin, en lui offrant quelque chose en retour.


    Quoi donc ? Une repentance venant d’un cœur sincère.


    Car il connaît toutes choses d’avance et sait ce qui est dans notre cœur.


    Offrons-lui donc une louange éternelle, non seulement de nos lèvres, mais aussi de notre cœur, afin qu’il nous accueille comme ses fils.


    Car le Seigneur a aussi dit : « Voici mes frères : ceux qui font la volonté de mon Père. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « vous viendrez aussi dans la chair » peut évoquer la venue devant Dieu ou la comparution future; le texte fourni ne précise pas davantage.
    reason: Préserver une ambiguïté eschatologique réelle du témoin.
  - marker: b
    text: La formule « d’abord esprit, puis est devenu chair » est conservée telle qu’elle apparaît dans le témoin ancien; elle n’est pas harmonisée avec une formulation doctrinale ultérieure.
    reason: Signaler une tension christologique sans la résoudre dans la traduction.
  - marker: c
    text: Parole apparentée à Matthieu 12.50, Marc 3.35 et Luc 8.21; la forme citée ici n’est pas identique mot pour mot à un seul de ces passages.
    reason: Identifier l’écho scripturaire sans prétendre à une citation textuellement exacte.
lexical_decisions:
- source_word: flesh (Greek source review pending)
  choice: chair
  rationale: Conserve le terme corporel et l’argument sur la résurrection de cette chair, sans l’atténuer en « corps ».
- source_word: guard
  choice: garder
  rationale: Rend l’idée de préserver et de veiller sur la chair considérée comme temple de Dieu.
- source_word: come unto
  choice: parvenir à
  rationale: Expression française naturelle qui préserve l’idée d’atteindre le royaume sans préciser davantage le mode d’entrée.
- source_word: recompense
  choice: quelque chose en retour
  rationale: Maintient la métaphore surprenante d’une contrepartie offerte au médecin, aussitôt définie comme repentance.
- source_word: repentance
  choice: repentance
  rationale: Terme religieux courant et digne, exprimant un retournement intérieur sincère plutôt qu’un simple regret.
- source_word: receive us as sons
  choice: nous accueille comme ses fils
  rationale: Préserve le langage filial du témoin tout en employant une tournure française naturelle.
theological_decisions:
- issue: Jugement et résurrection de la chair
  choice: « cette chair ne sera pas jugée et ne ressuscitera pas »
  alternative: « ce corps ne sera ni jugé ni ressuscité »
  rationale: La répétition de « chair » structure l’argument et souligne la continuité corporelle; elle ne doit pas être spiritualisée.
- issue: Venue future « dans la chair »
  choice: « vous viendrez aussi dans la chair »
  alternative: « vous vous présenterez aussi dans la chair »
  rationale: La formulation littérale conserve l’ambiguïté du mouvement ou de la comparution future au lieu de l’identifier explicitement au jugement.
- issue: Le Christ « d’abord esprit » puis chair
  choice: Conserver la formulation sans harmonisation explicative
  alternative: Reformuler selon une christologie ultérieure ou préciser « existait comme esprit »
  rationale: Le passage présente une tension christologique réelle; la traduction ne doit ni la supprimer ni lui imposer une lecture confessionnelle.
- issue: Offrir une contrepartie à Dieu médecin
  choice: Conserver la métaphore, définie par la repentance sincère
  alternative: Remplacer par « lui témoigner notre reconnaissance »
  rationale: Le texte établit lui-même la nature de ce qui est offert; une paraphrase morale affaiblirait son image et son enchaînement.
- issue: Citation sur les frères du Seigneur
  choice: '« Voici mes frères : ceux qui font la volonté de mon Père »'
  alternative: « Ceux-ci sont mes frères, ceux qui… »
  rationale: La formulation française reste proche de la citation transmise et garde le lien entre fraternité et volonté du Père.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition de « chair » est volontaire, car elle porte l’argument du passage. Le tutoiement pluriel est rendu par « vous ». Projet nécessairement provisoire : le dossier fourni indique que la vérification directe du grec reste à effectuer; les décisions reposent donc sur le témoin anglais public fourni, consulté avec la couche POB anglaise.'
