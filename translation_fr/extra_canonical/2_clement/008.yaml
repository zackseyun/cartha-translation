review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu d’après le témoin anglais fourni : l’urgence de la repentance, l’image du potier, l’impossibilité ultérieure de la confession et de la repentance, ainsi que les conditions associées à la réception de la vie sont conservés. Toutefois, « flesh »/« la chair » est remplacé deux fois par « notre corps », ce qui restreint et interprète un terme important que le passage maintient lui-même. La vérification directe de la tradition grecque demeure nécessaire, conformément aux données de dossier.'
  naturalness: Le français est clair, actuel et d’un registre exhortatif approprié. Les corrections proposées conservent cette fluidité tout en évitant d’expliciter indûment certains termes.
  terminology: « Chair » doit être conservé pour σάρξ/flesh, tant dans « les maux que nous avons commis dans la chair » que dans l’injonction à la garder pure. « Frères et sœurs » dépasse la forme de l’adresse transmise (« brethren ») ; « Frères » est ici préférable, sans empêcher que l’adresse soit comprise dans son cadre communautaire. « Le sceau » doit rester non interprété.
  issues:
  - severity: medium
    issue: « Dans notre corps » et « notre corps pur » remplacent « dans la chair » et « garder la chair pure ».
    rationale: Le remplacement réduit la portée sémantique et théologique de « chair » et introduit le possessif « notre » sans appui explicite. Une traduction d’équivalence optimale doit conserver l’expression, même si elle est plus marquée.
  - severity: low
    issue: « Frères et sœurs » élargit l’adresse « frères ».
    rationale: L’inclusivité communautaire peut être plausible en réception moderne, mais elle n’est pas exigée par le témoin et la note reconnaît elle-même une adaptation. Conserver « Frères » évite l’expansion interprétative.
