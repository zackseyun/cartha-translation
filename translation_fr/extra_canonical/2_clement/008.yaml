translation:
  language: fr
  text: 'Pendant que nous sommes encore sur la terre, repentons-nous donc, car nous sommes de l’argile entre les mains de l’artisan.


    Lorsqu’un potier façonne un vase et que celui-ci se déforme ou s’écrase entre ses mains, il le façonne de nouveau. Mais une fois qu’il l’a mis dans le four ardent, il ne peut plus le réparer. De même, pendant que nous sommes dans ce monde, repentons-nous de tout notre cœur du mal que nous avons commis dans notre corps, afin que le Seigneur nous sauve, tandis que nous avons encore le temps de nous repentir.


    Car une fois que nous aurons quitté ce monde, nous ne pourrons plus, là-bas, confesser nos fautes ni nous repentir.


    Ainsi donc, frères et sœurs,[a] si nous faisons la volonté du Père, si nous gardons notre corps pur et observons les commandements du Seigneur, nous recevrons la vie éternelle.


    Car le Seigneur dit dans l’Évangile : « Si vous n’avez pas gardé ce qui est petit, qui vous donnera ce qui est grand ? En effet, je vous le dis, celui qui est fidèle dans les plus petites choses est aussi fidèle dans les grandes. »[b]


    Voici donc ce qu’il veut dire : « Gardez votre corps pur et le sceau intact, afin que nous recevions la vie. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec traditionnellement rendu par « frères » peut s’adresser à l’ensemble de la communauté; d’où « frères et sœurs » dans le texte.
    reason: Signaler le choix inclusif sans masquer la forme ancienne de l’adresse.
  - marker: b
    text: Cette parole rappelle Luc 16.10-12, mais sa formulation n’est pas identique à celle des manuscrits du Nouveau Testament.
    reason: Préserver la forme citationnelle propre à 2 Clément et éviter une harmonisation silencieuse.
  - marker: c
    text: Le texte n’explique pas ici ce que désigne « le sceau »; l’image est donc laissée sans interprétation.
    reason: Maintenir l’ambiguïté théologique authentique.
lexical_decisions:
- source_word: clay under the craftsman's hand
  choice: de l’argile entre les mains de l’artisan
  rationale: Conserve l’image de la matière encore malléable et la dépendance envers celui qui la façonne, dans un français naturel.
- source_word: repent
  choice: se repentir
  rationale: Rend le retournement moral et religieux demandé, sans le réduire au simple regret.
- source_word: in the flesh
  choice: dans notre corps
  rationale: Dans ce contexte, l’expression désigne les actes accomplis durant l’existence corporelle; « dans la chair » serait plus littéral mais moins immédiatement clair en français courant.
- source_word: make confession
  choice: confesser nos fautes
  rationale: Précise l’objet implicite de la confession sans imposer un cadre sacramentel particulier.
- source_word: kept the flesh pure
  choice: gardons notre corps pur
  rationale: Maintient l’exhortation à la pureté corporelle tout en évitant l’ambiguïté moderne de « chair ».
- source_word: seal unstained
  choice: le sceau intact
  rationale: Préserve l’image théologique du sceau sans en déterminer le référent; « intact » exprime qu’il n’a été ni souillé ni altéré.
theological_decisions:
- issue: Possibilité de repentance après la mort
  choice: 'Formulation catégorique conservée : après avoir quitté ce monde, on ne peut plus se confesser ni se repentir.'
  alternative: Atténuer en parlant seulement de l’urgence présente de la repentance.
  rationale: Le passage affirme explicitement cette limite; la traduction ne doit ni l’adoucir ni développer une doctrine au-delà du texte.
- issue: Sens du « sceau »
  choice: L’image est conservée sans identification.
  alternative: L’expliquer comme le baptême, la foi, l’Esprit ou une marque ecclésiale.
  rationale: Le référent n’est pas explicité dans le passage et doit rester ouvert.
- issue: Rapport entre conduite et salut
  choice: Conserver les propositions conditionnelles et finales du texte.
  alternative: Les reformuler pour les harmoniser explicitement avec une doctrine particulière de la grâce ou des œuvres.
  rationale: La tension propre au passage entre repentance, obéissance, pureté et salut doit demeurer visible.
- issue: Citation attribuée au Seigneur dans l’Évangile
  choice: La citation est traduite telle qu’elle est transmise ici.
  alternative: La conformer mot pour mot à Luc 16.10 ou à une version canonique française.
  rationale: Cette forme combine ou adapte une tradition évangélique; elle ne doit pas être silencieusement normalisée.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et l’image du potier sont conservés. Cette version demeure provisoire, car les données fournies reposent sur un témoin anglais du domaine public et indiquent qu’une vérification directe du grec reste à faire.
