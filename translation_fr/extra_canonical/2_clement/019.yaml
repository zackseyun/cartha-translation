base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: fr
  text: 'Ainsi donc, frères et sœurs, après avoir entendu le Dieu de vérité, je vous lis une exhortation afin que vous prêtiez attention à ce qui est écrit. Vous pourrez ainsi vous sauver vous-mêmes, ainsi que celui qui fait la lecture au milieu de vous. Car la récompense que je vous demande, c’est de vous repentir de tout votre cœur et de vous donner à vous-mêmes le salut et la vie. En agissant ainsi, nous proposerons un but à tous les jeunes qui désirent travailler avec ardeur à la piété et à la connaissance de la bonté de Dieu.[a]


    Ne nous irritons donc pas et ne nous indignons pas, insensés que nous sommes, lorsque quelqu’un nous avertit et nous détourne de l’injustice pour nous conduire à la justice. Il nous arrive en effet de faire le mal sans nous en rendre compte, à cause de l’indécision et de l’incrédulité qui habitent notre cœur ; nos désirs vains obscurcissent alors notre intelligence.


    Pratiquons donc la justice afin d’être sauvés jusqu’à la fin. Heureux ceux qui obéissent à ces prescriptions ! Même s’ils souffrent quelque temps dans ce monde, ils récolteront le fruit immortel de la résurrection.


    Que la personne pie ne s’afflige donc pas si elle connaît le malheur dans le temps présent : un temps bienheureux l’attend. Elle revivra dans le ciel avec nos pères et se réjouira pendant une éternité sans tristesse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation de la fin de la phrase peut aussi se comprendre : « travailler avec ardeur à l’étude de la piété et de la bonté de Dieu ».'
    reason: Le témoin anglais permet une hésitation sur la coordination et la portée de « study » ; la source grecque directe reste à vérifier.
lexical_decisions:
- source_word: brothers and sisters (ἀδελφοί, presumed)
  choice: frères et sœurs
  rationale: Rend explicitement la portée collective probable de l’appellation, dans un français moderne et naturel.
- source_word: double-mindedness
  choice: indécision
  rationale: Exprime un cœur partagé et instable sans imposer un diagnostic doctrinal plus précis que le témoin disponible.
- source_word: godliness / piety
  choice: piété
  rationale: Terme français digne et courant dans un contexte religieux ancien.
- source_word: ordinances
  choice: prescriptions
  rationale: Conserve l’idée de directives faisant autorité sans les identifier nécessairement à une loi ou à des sacrements.
- source_word: the godly
  choice: la personne pie
  rationale: Formulation inclusive et naturelle correspondant à une désignation générique au singulier.
theological_decisions:
- issue: « vous sauver vous-mêmes » et « vous donner à vous-mêmes le salut et la vie »
  choice: Conserver les formulations actives et leur tension théologique
  alternative: Paraphraser par « accueillir le salut et la vie que Dieu donne »
  rationale: Le texte relie directement repentance, conduite et salut. L’expliciter selon un système doctrinal particulier effacerait cette tension propre au passage.
- issue: Lieu de la vie future
  choice: « dans le ciel avec nos pères »
  alternative: « auprès de Dieu avec nos ancêtres »
  rationale: Le témoin atteste explicitement le ciel et les pères ; ces éléments sont donc maintenus sans harmonisation.
- issue: Fruit de la résurrection
  choice: « le fruit immortel de la résurrection »
  alternative: « la récompense immortelle qu’apporte la résurrection »
  rationale: La métaphore agricole et la relation potentiellement ambiguë entre fruit, immortalité et résurrection sont préservées.
translation_notes:
  register: Français international moderne, digne et accessible. Les exhortations gardent leur force rhétorique et les images du texte sont conservées. Projet établi à partir d’un témoin anglais ancien, la vérification directe du grec étant signalée comme encore en attente ; les choix fins demeurent donc prudents.
