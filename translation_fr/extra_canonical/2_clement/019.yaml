review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire principalement en 19.1 : « connaissance de la bonté de Dieu » ajoute une notion absente du témoin et de la construction grecque traditionnellement attestée (« étude de la piété et de la bonté de Dieu »). « Indécision » atténue aussi excessivement la διψυχία / double-mindedness, qui évoque une division intérieure ou un cœur partagé. Le reste rend fidèlement les exhortations, y compris la tension des formulations actives sur le salut.'
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. Quelques ajustements rendent le lien logique plus direct (« afin de vous sauver »), évitent l’ajout interprétatif (« connaissance ») et donnent une expression plus exacte et idiomatique de l’état intérieur (« cœur partagé »).
  terminology: « Piété », « justice », « résurrection », « salut », « prescriptions » et « personne pie » conviennent au registre. « Étude » est requis ici plutôt que « connaissance »; « bonté de Dieu » est conservé sans la réduire à une qualité humaine ni imposer une lecture théologique.
  issues:
  - severity: medium
    issue: Ajout de « connaissance » dans « à la piété et à la connaissance de la bonté de Dieu ».
    rationale: Ni le témoin anglais (« study of piety and of the goodness of God ») ni la formulation grecque sous-jacente ne justifient l’ajout de « connaissance ». Il modifie la relation entre « étude », « piété » et « bonté de Dieu ».
  - severity: medium
    issue: « Indécision » rend insuffisamment la double-mindedness / διψυχία.
    rationale: 'Le terme décrit plus qu’une hésitation ponctuelle : il évoque une division ou instabilité intérieure liée à l’incrédulité. « Cœur partagé » conserve mieux cette portée sans surinterprétation.'
  - severity: low
    issue: La note [a] repose sur une ambiguïté du témoin anglais mais accompagne une traduction qui introduit elle-même « connaissance ».
    rationale: Après correction en « étude de la piété et de la bonté de Dieu », la note ne répond plus à une difficulté textuelle suffisamment établie et peut être supprimée.
  revised_text: 'Ainsi donc, frères et sœurs, après avoir entendu le Dieu de vérité, je vous lis une exhortation afin que vous prêtiez attention à ce qui est écrit, afin de vous sauver vous-mêmes ainsi que celui qui fait la lecture au milieu de vous. Car la récompense que je vous demande, c’est de vous repentir de tout votre cœur et de vous procurer à vous-mêmes le salut et la vie. En agissant ainsi, nous fixerons un objectif pour tous les jeunes qui désirent travailler avec ardeur à l’étude de la piété et de la bonté de Dieu.


    Ne nous fâchons donc pas et ne nous irritons pas, insensés que nous sommes, lorsque quelqu’un nous avertit et nous détourne de l’injustice pour nous conduire à la justice. Il nous arrive en effet de faire le mal sans nous en rendre compte, à cause du cœur partagé et de l’incrédulité qui sont en nous ; nos désirs vains obscurcissent alors notre intelligence.


    Pratiquons donc la justice afin d’être sauvés jusqu’à la fin. Heureux ceux qui obéissent à ces prescriptions ! Même s’ils souffrent quelque temps dans ce monde, ils récolteront le fruit immortel de la résurrection.


    Que la personne pie ne s’afflige donc pas si elle connaît le malheur dans le temps présent : un temps bienheureux l’attend. Elle revivra dans le ciel avec nos pères et se réjouira pendant une éternité sans tristesse.'
  revised_footnotes: []
  revision_rationale: La révision retire l’ajout interprétatif « connaissance », rend plus précisément la division intérieure visée par « double-mindedness » et supprime une note devenue inutile. Les formulations actives sur le salut, la bonté de Dieu, le fruit de la résurrection et la vie dans le ciel avec les pères sont maintenues. La tournure initiale, inhabituelle mais dépendante de la tradition textuelle et du témoin fourni, est conservée avec une formulation française lisible.
