  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: fr
  text: 'Repentons donc de tout notre cœur, de peur que l’un de nous ne périsse en chemin. Car si nous avons reçu le commandement de nous employer à arracher les gens aux idoles et à les instruire, combien plus grave encore serait-il qu’une âme qui connaît déjà Dieu périsse !


    Aidons-nous donc les uns les autres, afin de conduire aussi les faibles vers les hauteurs du bien et que nous soyons tous sauvés. Et ramenons-nous et avertissons-nous mutuellement.


    Ne pensons pas qu’il nous suffise d’être attentifs et de croire seulement maintenant. Une fois rentrés chez nous, souvenons-nous des commandements du Seigneur et ne nous laissons pas entraîner dans une autre direction par nos désirs mondains. Au contraire, venons ici plus souvent et efforçons-nous de progresser dans les commandements du Seigneur, afin que, partageant tous une même pensée, nous soyons rassemblés pour entrer dans la vie.


    Car le Seigneur a dit : « Je viens rassembler toutes les nations, les tribus et les langues. »[a] Il parle ici du jour de sa manifestation, lorsqu’il viendra nous racheter, chacun selon ses œuvres.


    Les incroyants verront sa gloire et sa puissance. Ils seront frappés de stupeur en voyant la royauté du monde remise à Jésus, et ils diront : « Malheur à nous ! Car tu étais là, et nous ne l’avons pas reconnu ; nous n’avons pas cru et nous n’avons pas obéi aux anciens qui nous parlaient de notre salut. » Et « leur ver ne mourra pas, leur feu ne s’éteindra pas, et ils seront en spectacle à toute chair ».[b]


    Il parle de ce jour du jugement, où l’on verra ceux d’entre nous qui vivent sans respect pour Dieu et se sont montrés infidèles aux commandements de Jésus-Christ.


    Mais lorsque les justes — ceux qui auront fait le bien, enduré les tourments et détesté les plaisirs de l’âme — verront ceux qui ont mal agi et renié Jésus par leurs paroles ou leurs actes subir de cruels tourments dans un feu qui ne s’éteint pas, ils rendront gloire à Dieu et diront : « Il y aura de l’espérance pour celui qui aura servi Dieu de tout son cœur. »'
