lexical_decisions:
- source_word: repent
  choice: se repentir
  rationale: Le verbe français conserve le sens moral et religieux du retournement sans l’affaiblir en simple regret.
- source_word: convert
  choice: ramener
  rationale: Dans le contexte d’une exhortation mutuelle au sein de la communauté, « ramener » conserve l’idée d’un retour vers la bonne voie sans imposer le sens moderne d’un changement d’appartenance religieuse.
- source_word: presbyters
  choice: anciens
  rationale: « Anciens » est le terme ecclésial français courant et demeure plus accessible que « presbytres ».
- source_word: appearing
  choice: manifestation
  rationale: « Manifestation » rend le dévoilement public attendu sans réduire le terme à une simple apparition visuelle.
- source_word: all flesh
  choice: toute chair
  rationale: La formule biblique est conservée en raison de son caractère citationnel et de sa portée universelle.
- source_word: dealt falsely with
  choice: se montrer infidèle à
  rationale: Cette formulation naturelle exprime la déloyauté pratique envers les commandements sans préciser abusivement la nature exacte de la faute.
theological_decisions:
- issue: Jugement selon les œuvres
  choice: « chacun selon ses œuvres »
  alternative: « en rendant à chacun selon ses œuvres »
  rationale: La formulation transmise est gardée sans harmonisation doctrinale ni ajout d’un verbe absent du témoin fourni.
- issue: Portée de « nous racheter »
  choice: Conserver la première personne du pluriel
  alternative: Généraliser en « racheter les humains »
  rationale: Le texte lie l’attente eschatologique à la communauté exhortée ; cette tension entre communauté et jugement individuel doit rester visible.
- issue: « plaisirs de l’âme »
  choice: Conserver l’expression littérale
  alternative: « désirs charnels » ou « plaisirs mauvais »
  rationale: La tournure est difficile, mais la modifier introduirait une anthropologie ou une évaluation morale plus précise que le témoin disponible.
- issue: Espérance finale
  choice: « Il y aura de l’espérance pour celui qui aura servi Dieu… »
  alternative: « Celui qui sert Dieu… peut espérer »
  rationale: La forme déclarative et future est conservée, sans résoudre sa relation avec la scène de jugement qui précède.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des images bibliques et des répétitions exhortatives. Projet provisoire fondé sur le témoin anglais public fourni, puisque la révision directe du grec est indiquée comme restant à faire. La syntaxe a été clarifiée lorsque le témoin anglais était heurté, sans supprimer les ambiguïtés théologiques réelles.
