review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le français suit globalement le témoin anglais, mais « le commandement » doit être au pluriel, comme « commands ». Surtout, « tu étais là » ajoute « là » et « nous ne l’avons pas reconnu » déplace le sens de l’adresse directe : le témoin porte « Thou wast, and we knew it not », tandis que la formulation grecque habituellement éditée est comprise comme « tu étais/existais, et nous ne t’avons pas connu ». « Le monde remis à Jésus » évite aussi de transformer sans nécessité le « world » du témoin en « royauté ». La vérification directe de la tradition grecque demeure requise.'
  naturalness: Le registre est bon et moderne dans l’ensemble. « Les incroyants » est moins idiomatique que « ceux qui ne croient pas ». « Conduire les faibles vers les hauteurs du bien » est intelligible, mais « élever les faibles vers le bien » est plus direct. « Ramenons-nous » est ambigu en français contemporain; une formulation explicitement réciproque est préférable.
  terminology: « Se repentir », « anciens », « manifestation », « toute chair », « Jésus-Christ » et « plaisirs de l’âme » conviennent. « Nous racheter » préserve correctement la première personne plurielle du témoin. Les citations et leurs notes conservent prudemment leur caractère apparenté plutôt que de les harmoniser de force.
  issues:
  - severity: medium
    issue: Singulier « le commandement »
    rationale: Le témoin fourni dit « commands »; le pluriel « les commandements » doit être conservé.
  - severity: high
    issue: « tu étais là, et nous ne l’avons pas reconnu »
    rationale: « Là » est absent, et « l’avons reconnu » ne rend pas l’objet personnel sous-entendu/attesté dans la tradition grecque. « Tu existais, et nous ne t’avons pas connu » est plus fidèle sans résoudre davantage la formule.
  - severity: medium
    issue: « la royauté du monde »
    rationale: Le témoin anglais dit « kingdom of the world », mais la tradition grecque couramment reçue est généralement rendue par « le monde remis à Jésus ». « Royauté » introduit une abstraction qui n’est pas nécessaire.
  - severity: low
    issue: « les incroyants » et « ramenons-nous »
    rationale: Ces choix sont compréhensibles, mais moins naturels ou plus ambigus que « ceux qui ne croient pas » et une formule explicitement mutuelle.
  revised_text: 'Repentons-nous donc de tout notre cœur, de peur que l’un de nous ne périsse en chemin. Car si nous avons reçu les commandements de nous employer à arracher les gens aux idoles et à les instruire, combien plus grave encore serait-il qu’une âme qui connaît déjà Dieu périsse !


