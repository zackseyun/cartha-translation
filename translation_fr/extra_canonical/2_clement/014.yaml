base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: fr
  text: 'Ainsi donc, frères et sœurs, si nous faisons la volonté de Dieu notre Père, nous appartiendrons à la première Église, celle qui est spirituelle et qui fut créée avant le soleil et la lune. Mais si nous ne faisons pas la volonté du Seigneur, nous relèverons de l’Écriture qui dit : « Ma maison est devenue une caverne de brigands. »[a] Choisissons donc plutôt d’appartenir à l’Église de la vie, afin d’être sauvés.


    Vous n’ignorez certainement pas que l’Église vivante est le corps du Christ. En effet, l’Écriture dit : « Dieu fit l’être humain homme et femme. »[b] L’homme, c’est le Christ, et la femme, c’est l’Église. De plus, les Livres et les apôtres déclarent clairement que l’Église ne date pas d’aujourd’hui, mais qu’elle existe depuis le commencement. Car elle était spirituelle, comme notre Jésus lui aussi était spirituel ; elle a été manifestée dans les derniers jours afin qu’il nous sauve.[c]


    Or l’Église, qui est spirituelle, a été manifestée dans la chair du Christ. Elle nous montre ainsi que si l’un de nous la garde dans la chair sans la souiller, il la recevra dans l’Esprit saint. Car cette chair est la figure correspondante et la copie de l’esprit.[d] Celui qui souille la copie ne recevra donc pas l’original en partage. Voici donc ce que cela signifie, frères et sœurs : « Gardez la chair, afin d’avoir part à l’esprit. »


    Mais si nous disons que la chair est l’Église et que l’esprit est le Christ, alors celui qui outrage la chair outrage l’Église. Une telle personne n’aura donc pas part à l’esprit, qui est le Christ.


    Si l’Esprit saint lui est uni, cette chair peut recevoir en partage une vie et une immortalité si excellentes que personne ne peut exprimer ni raconter ce que le Seigneur a préparé pour ceux qu’il a choisis.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Jérémie 7.11, repris aussi dans les récits évangéliques de la purification du Temple. Le texte applique cet avertissement à ceux qui ne font pas la volonté du Seigneur.
    reason: Identifier la citation et éclairer l’expression inhabituelle « relever de l’Écriture ».
  - marker: b
    text: Genèse 1.27. La citation est formulée ici de manière à soutenir l’interprétation allégorique qui suit.
    reason: Donner la source scripturaire et signaler l’usage particulier qu’en fait l’auteur.
  - marker: c
    text: L’enchaînement associe étroitement l’Église spirituelle et Jésus spirituel. « Il nous sauve » renvoie vraisemblablement à Jésus, tandis que « elle a été manifestée » renvoie à l’Église.
    reason: Préserver et expliquer une ambiguïté réelle des référents sans la masquer dans le corps du texte.
  - marker: d
    text: Le vocabulaire exprime une correspondance entre une copie visible, la chair, et une réalité spirituelle originale. La nature exacte de cette correspondance reste difficile à préciser.
    reason: Éviter de faire de l’image une identité métaphysique plus nette que ne le permet le passage.
  - marker: e
    text: La dernière phrase fait écho à 1 Corinthiens 2.9.
    reason: Signaler l’allusion scripturaire qui conclut le développement.
lexical_decisions:
- source_word: ἐκκλησία (reconstructed from the Greek tradition)
  choice: Église
  rationale: Le mot désigne ici la communauté spirituelle personnifiée et le corps du Christ. La majuscule aide à signaler cette réalité collective sans lui imposer une définition confessionnelle.
- source_word: ἄρσεν καὶ θῆλυ (Genèse 1.27, as cited)
  choice: homme et femme
  rationale: Cette formulation reste naturelle en français tout en conservant les deux termes sexués dont dépend immédiatement l’interprétation allégorique de l’auteur.
- source_word: ἀντίτυπος / ἀντίτυπον (probable Greek term behind “counterpart”)
  choice: figure correspondante
  rationale: Ce choix préserve l’idée d’une correspondance entre la chair et l’esprit sans identifier simplement les deux réalités; « copie » traduit le second terme explicatif du passage.
- source_word: ὑβρίζειν / witness sense “deal wantonly”
  choice: outrager
  rationale: Le verbe garde la force morale et corporelle du propos sans préciser abusivement la nature exacte de l’inconduite visée.
- source_word: ἐκλεκτοί
  choice: ceux qu’il a choisis
  rationale: Une tournure verbale courante rend le sens de « les élus » sans ajouter de système doctrinal sur le mode de cette élection.
theological_decisions:
- issue: Préexistence et manifestation de l’Église
  choice: Conserver l’affirmation que l’Église spirituelle fut créée avant les astres, existe depuis le commencement et fut ensuite manifestée.
  alternative: Reformuler ces expressions comme une simple prévision divine de l’Église.
  rationale: Le passage énonce une conception forte de l’Église spirituelle préexistante; l’atténuer résoudrait indûment une tension théologique propre au texte.
- issue: Interprétation de Genèse 1.27
  choice: 'Maintenir explicitement l’identification allégorique : l’homme est le Christ et la femme l’Église.'
  alternative: Présenter cette lecture comme une simple comparaison ou l’omettre.
  rationale: Cette identification est l’argument même de l’auteur, malgré son caractère inhabituel par rapport au contexte premier de la Genèse.
- issue: Rapport entre chair, Église, esprit et Christ
  choice: Préserver les identifications successives et leur tension, sans les harmoniser en une anthropologie systématique.
  alternative: Définir partout la chair comme le corps humain et l’esprit comme l’Esprit saint.
  rationale: Le texte passe de « l’esprit » au Christ et mentionne ensuite l’Esprit saint. La traduction conserve ces distinctions et ambiguïtés plutôt que de les effacer.
- issue: Référent du pronom dans « afin qu’il nous sauve »
  choice: Employer le masculin « il », renvoyant naturellement à Jésus.
  alternative: Employer « afin qu’elle nous sauve », avec l’Église pour sujet.
  rationale: Le témoin fourni a « He », et le contexte immédiat mentionne Jésus; une note signale néanmoins la difficulté de l’enchaînement.
translation_notes:
  register: Français international moderne, digne et accessible. « Frères et sœurs » explicite la portée collective de l’adresse. Les formulations étonnantes du passage — première Église créée avant les astres, Église manifestée dans la chair du Christ, chair comme copie de l’esprit — sont conservées plutôt que normalisées. Le brouillon demeure provisoire, car les données fournies indiquent qu’un contrôle direct complet du grec reste à effectuer; les décisions lexicales grecques mentionnées comme probables ou reconstruites ne prétendent donc pas remplacer une collation du texte critique.
