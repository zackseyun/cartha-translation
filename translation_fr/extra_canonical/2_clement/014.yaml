review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement conservé, y compris les affirmations difficiles sur l’Église spirituelle préexistante, son apparition dans la chair du Christ, et les identifications symboliques chair/Église et esprit/Christ. Une correction est toutefois nécessaire : « nous relèverons de l’Écriture » ne rend pas naturellement l’idiome « nous serons de l’Écriture qui dit » ; le sens est que l’Écriture vise ou décrit ceux qui refusent la volonté du Seigneur. La conclusion doit également maintenir plus explicitement que l’indicible concerne « la vie et l’immortalité » que la chair peut recevoir.'
  naturalness: Le français est globalement moderne, soutenu et intelligible. La révision remplace une formulation opaque par « nous serons de ceux dont parle l’Écriture » et rétablit une construction française plus nette dans la dernière phrase. « A outragé » restitue aussi mieux l’aspect accompli du verbe dans l’avant-dernier paragraphe.
  terminology: Église, Christ, Esprit saint, chair, esprit et « ceux qu’il a choisis » sont cohérents et ne surinterprètent pas le texte. « Homme et femme » est conservé dans la citation, car l’allégorie immédiate dépend de cette polarité. La distinction entre « l’esprit », identifié ensuite au Christ, et « l’Esprit saint » est maintenue.
  issues:
  - severity: medium
    issue: « Nous relèverons de l’Écriture »
    rationale: Cette expression est peu idiomatique en français et ne communique pas clairement la fonction accusatrice de la citation. « Nous serons de ceux dont parle l’Écriture » garde l’indétermination quelque peu abrupte du texte tout en étant intelligible.
  - severity: medium
    issue: Construction de la phrase finale
    rationale: La version proposée rattache directement l’impossibilité d’exprimer aux qualités « si excellentes », alors que le texte présente d’abord la vie et l’immortalité que la chair peut recevoir, puis déclare que nul ne peut dire ce que le Seigneur a préparé. Une phrase distincte préserve mieux cette progression.
  - severity: low
    issue: Aspect verbal dans « celui qui outrage »
    rationale: Le texte évoque celui qui a commis l’outrage ou la souillure. Le passé composé français rend plus exactement cet aspect sans modifier le sens.
  revised_text: 'Ainsi donc, frères et sœurs, si nous faisons la volonté de Dieu notre Père, nous appartiendrons à la première Église, celle qui est spirituelle et qui fut créée avant le soleil et la lune. Mais si nous ne faisons pas la volonté du Seigneur, nous serons de ceux dont parle l’Écriture qui dit : « Ma maison est devenue une caverne de brigands. »[a] Choisissons donc plutôt d’appartenir à l’Église de la vie, afin d’être sauvés.


    Vous n’ignorez certainement pas que l’Église vivante est le corps du Christ. En effet, l’Écriture dit : « Dieu fit l’être humain, homme et femme. »[b] L’homme, c’est le Christ, et la femme, c’est l’Église. De plus, les Livres et les apôtres déclarent clairement que l’Église ne date pas d’aujourd’hui, mais qu’elle existe depuis le commencement. Car elle était spirituelle, comme notre Jésus lui aussi était spirituel ; elle a été manifestée dans les derniers jours afin qu’il nous sauve.[c]


    Or l’Église, qui est spirituelle, a été manifestée dans la chair du Christ. Elle nous montre ainsi que si l’un de nous la garde dans la chair sans la souiller, il la recevra de nouveau dans l’Esprit saint. Car cette chair est la figure correspondante et la copie de l’esprit.[d] Celui qui a souillé la copie ne recevra donc pas l’original en partage. Voici donc ce que cela signifie, frères et sœurs : « Gardez la chair, afin d’avoir part à l’esprit. »


