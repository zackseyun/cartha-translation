base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: fr
  text: 'Ne laissez pas non plus cela troubler de nouveau vos esprits : nous voyons les injustes posséder des richesses, tandis que les serviteurs de Dieu connaissent la détresse.


    Ayons donc foi, frères et sœurs. La vie présente nous forme afin que nous recevions la couronne dans la vie à venir.


    Aucun juste n’a rapidement recueilli le fruit, mais il l’attend.


    En effet, si Dieu avait rapidement accordé leur récompense aux justes, nous nous serions aussitôt exercés au commerce plutôt qu’à la piété. Nous semblerions justes, alors que nous rechercherions non ce qui relève de la piété, mais ce qui rapporte. C’est pourquoi le jugement divin atteint l’esprit qui n’est pas juste et le charge de chaînes.


    Au seul Dieu invisible, le Père de la vérité, qui nous a envoyé le Sauveur et Prince de l’immortalité, par qui il nous a aussi révélé la vérité et la vie céleste, à lui soit la gloire pour les siècles des siècles. Amen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: connaissent la détresse
  rationale: Exprime naturellement une situation d’épreuve et de privation sans la réduire à la seule pauvreté matérielle.
- source_word: trained
  choice: forme / exercés
  rationale: Le contexte évoque une discipline ou un entraînement moral; la variation française conserve cette image tout en restant naturelle.
- source_word: crowned
  choice: recevions la couronne
  rationale: Conserve l’image ancienne de la récompense victorieuse, importante dans l’exhortation chrétienne.
- source_word: merchandise
  choice: commerce
  rationale: Préserve l’opposition entre une pratique intéressée, orientée vers le profit, et la piété véritable.
- source_word: godliness
  choice: piété
  rationale: Terme français courant et digne désignant une vie de dévotion et de fidélité envers Dieu.
- source_word: gainful
  choice: ce qui rapporte
  rationale: Rend clairement la recherche de l’avantage personnel et maintient le contraste avec ce qui plaît à Dieu.
- source_word: Prince of immortality
  choice: Prince de l’immortalité
  rationale: Conserve le titre christologique transmis par le témoin, sans en réduire l’ambiguïté à « auteur » ou « chef ».
theological_decisions:
- issue: Fonction de la vie présente
  choice: La vie présente nous forme afin que nous recevions la couronne dans la vie à venir.
  alternative: Nous sommes éprouvés dans la vie présente afin d’être couronnés dans la vie future.
  rationale: « Forme » maintient l’idée de discipline morale du témoin sans décider que le processus consiste uniquement en une épreuve.
- issue: Rapport entre apparence de justice et motivation intéressée
  choice: Nous aurions l’apparence de la justice, tout en recherchant non ce qui plaît à Dieu, mais ce qui rapporte.
  alternative: Nous semblerions justes, bien que recherchant non la piété, mais le profit.
  rationale: La formulation conserve la tension entre conduite extérieure et motivation intérieure, sans imposer une doctrine particulière du mérite.
- issue: Jugement et enchaînement de l’esprit injuste
  choice: le jugement divin atteint l’esprit qui n’est pas juste et le charge de chaînes
  alternative: le jugement de Dieu saisit l’âme injuste et l’enchaîne
  rationale: Maintient les images distinctes d’un jugement qui rejoint puis accable de chaînes, sans préciser la nature ni la durée de la peine.
- issue: Titre du Sauveur
  choice: le Sauveur et Prince de l’immortalité
  alternative: le Sauveur et Auteur de l’immortalité
  rationale: « Prince » suit le témoin fourni et préserve la portée possible de chef, initiateur ou souverain, que la base disponible ne permet pas de trancher.
translation_notes:
  register: Français international moderne, exhortatif et digne. Le pluriel inclusif « frères et sœurs » suit la couche de consultation anglaise. La traduction demeure provisoire, car le dossier fourni signale qu’une vérification directe du grec est encore nécessaire; les choix évitent donc de sur-préciser les termes incertains.
