base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: fr
  text: 'C’est pourquoi, mes frères et sœurs,[a] faisons la volonté du Père qui nous a appelés, afin que nous vivions. Recherchons avant tout la vertu, abandonnons le vice, précurseur de nos péchés, et fuyons l’impiété, de peur que les malheurs ne nous atteignent.


    En effet, si nous nous appliquons à faire le bien, la paix nous poursuivra.


    Voilà pourquoi une personne ne peut parvenir au bonheur : les craintes humaines l’attirent,[b] et elle préfère le plaisir présent à la promesse à venir.


    Les gens ne savent pas quel grand tourment apporte le plaisir présent, ni quelle joie apporte la promesse à venir.


    S’ils agissaient ainsi seuls, ce serait encore supportable. Mais maintenant, ils persistent à enseigner le mal à des âmes innocentes, sans savoir qu’ils recevront une double condamnation : eux-mêmes et ceux qui les écoutent.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque habituellement rendue par « frères » peut, dans une adresse à toute la communauté, inclure les femmes aussi bien que les hommes. La vérification directe du grec de ce passage reste à effectuer.
    reason: Signaler la portée communautaire de l’adresse et la limite documentaire de la base fournie.
  - marker: b
    text: Le sens exact de cette proposition est incertain dans la base transmise. Elle peut aussi être comprise comme une allusion au fait de se laisser attirer ou dominer par la crainte des hommes.
    reason: Le témoin anglais « they call in the fears of men » est obscur; il faut préserver cette incertitude en attendant la collation grecque.
  - marker: c
    text: 'Littéralement selon le témoin fourni : « leur condamnation sera doublée, eux-mêmes et ceux qui les écoutent ».'
    reason: La syntaxe laisse ouverte la manière précise dont la condamnation est dite « double ».
lexical_decisions:
- source_word: brethren (Greek source review pending)
  choice: frères et sœurs
  rationale: Formulation française naturelle qui rend l’adresse communautaire inclusive sans effacer la forme traditionnelle; la base grecque directe n’étant pas fournie, la décision reste tributaire du témoin anglais.
- source_word: virtue
  choice: vertu
  rationale: Conserve le contraste moral explicite avec « vice » et le registre exhortatif du passage.
- source_word: ungodliness
  choice: impiété
  rationale: Terme français courant dans un registre biblique digne, exprimant l’opposition à Dieu sans ajouter une doctrine particulière.
- source_word: enjoyment which is here
  choice: plaisir présent
  rationale: Rend naturellement le contraste temporel entre la jouissance actuelle et la promesse future.
- source_word: innocent souls
  choice: âmes innocentes
  rationale: Maintient l’anthropologie et la force morale du témoin sans paraphrase réductrice.
- source_word: condemnation doubled
  choice: double condamnation
  rationale: Préserve l’affirmation judiciaire forte et son explication coordonnée.
theological_decisions:
- issue: Rapport entre obéissance et vie
  choice: « faisons la volonté… afin que nous vivions »
  alternative: « pour obtenir la vie »
  rationale: La formulation retenue conserve le lien final du texte sans préciser si la vie est récompense, conséquence ou accomplissement de l’appel.
- issue: Personnification de la paix
  choice: « la paix nous poursuivra »
  alternative: « nous trouverons la paix »
  rationale: La métaphore surprenante est conservée plutôt que normalisée, en parallèle avec les malheurs qui peuvent atteindre les personnes.
- issue: Double condamnation
  choice: « eux-mêmes et ceux qui les écoutent »
  alternative: « pour eux-mêmes et pour leurs auditeurs »
  rationale: 'Conserve l’ambiguïté de la construction transmise : elle peut désigner les deux groupes concernés plutôt que deux peines distinctes infligées aux enseignants.'
translation_notes:
  register: 'Français international moderne, exhortatif et digne. Les phrases ont été légèrement fluidifiées tout en conservant les répétitions structurantes, les contrastes présent/à venir et les personnifications. Draft nécessairement provisoire : aucun texte grec n’a été fourni, et la révision directe de la tradition manuscrite grecque est explicitement indiquée comme en attente.'
