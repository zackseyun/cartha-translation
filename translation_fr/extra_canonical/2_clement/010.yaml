review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire surtout en 10.3 : « les craintes humaines l’attirent » transforme l’énoncé obscur du témoin (« they call in the fears of men ») en une relation psychologique singulière absente de la base. La version révisée conserve le pluriel et l’incohérence apparente du référent, signalée en note. « avant tout » est aussi plus fort que « rather » et est remplacé par « plutôt ».'
  naturalness: Le français demeure moderne, digne et lisible. La construction de 10.3 est volontairement un peu heurtée, car le texte témoin l’est; la note en explique l’ambiguïté plutôt que de la résoudre par paraphrase.
  terminology: « vertu / vice », « impiété », « âmes innocentes » et « condamnation double » conviennent au registre exhortatif et préservent les termes moraux et judiciaires du passage. « Maux » rend plus directement les « evils » que « malheurs », sans imposer une interprétation particulière.
  issues:
  - severity: medium
    issue: '10.3 : « les craintes humaines l’attirent »'
    rationale: Cette formulation introduit un sujet singulier (« l’ ») et le sens précis d’une attraction par la peur. Le témoin emploie un pluriel et une expression dont le sens exact reste incertain (« they call in the fears of men »).
  - severity: low
    issue: '10.1 : « Recherchons avant tout la vertu »'
    rationale: « Avant tout » ajoute une priorité absolue qui n’est pas exprimée par « rather »; « plutôt » conserve le comparatif exhortatif.
  - severity: low
    issue: '10.1 : « les malheurs »'
    rationale: Le témoin dit simplement « evils ». « Les maux » est plus proche et conserve l’ouverture entre adversités et conséquences mauvaises.
  revised_text: 'C’est pourquoi, mes frères et sœurs,[a] faisons la volonté du Père qui nous a appelés, afin que nous vivions. Poursuivons plutôt la vertu, abandonnons le vice, précurseur de nos péchés, et fuyons l’impiété, de peur que les maux ne nous atteignent.


    En effet, si nous nous appliquons à faire le bien, la paix nous poursuivra.


    C’est pour cette raison qu’une personne ne peut parvenir au bonheur : ils font appel aux craintes des hommes, préférant le plaisir d’ici-bas à la promesse à venir.[b]


    Car ils ne savent pas quel grand tourment apporte le plaisir d’ici-bas, ni quelle joie apporte la promesse à venir.


    S’ils agissaient ainsi seuls, ce serait encore supportable. Mais maintenant, ils persistent à enseigner le mal à des âmes innocentes, sans savoir qu’ils recevront une condamnation double, eux-mêmes comme ceux qui les écoutent.[c]'
  revised_footnotes:
  - marker: a
    text: L’expression grecque habituellement rendue par « frères » peut, dans une adresse à toute la communauté, inclure les femmes aussi bien que les hommes. La vérification directe du grec de ce passage reste à effectuer.
    reason: Signaler la portée communautaire possible de l’adresse et la limite documentaire de la base fournie.
  - marker: b
    text: 'Le sens exact de la première proposition est incertain dans la base transmise. Le témoin anglais porte littéralement : « ils font appel aux craintes des hommes ». Le pluriel « ils » et son rapport avec « une personne » sont également abrupts; la traduction conserve cette difficulté en attendant la collation grecque.'
    reason: Préserver l’ambiguïté syntaxique et sémantique du témoin plutôt que la résoudre par une paraphrase psychologique.
  - marker: c
    text: 'Littéralement selon le témoin fourni : « leur condamnation sera doublée, eux-mêmes et ceux qui les écoutent ».'
    reason: La syntaxe laisse ouverte la manière précise dont la condamnation est dite « double ».
  revision_rationale: La révision corrige les deux écarts de sens sûrs (« avant tout » et l’attraction singulière par les craintes), tout en maintenant les répétitions, les contrastes entre l’ici-bas et l’à-venir, ainsi que l’ambiguïté de la condamnation double. Les notes sont conservées ou précisées aux ancres pertinentes.
