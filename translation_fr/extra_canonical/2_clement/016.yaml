review_pass:
  verdict: revise
  source_fidelity: Révision prudente à partir du témoin anglais fourni, le contrôle direct du grec étant explicitement en attente. « Celui qui nous accueille » restitue plus fidèlement le substantif personnel marqué (« One ») sans réduire son référent à un vague « quelqu’un ». Les comparaisons et les affirmations fortes concernant l’aumône sont conservées.
  naturalness: 'Le français est globalement naturel. Quelques ajustements rendent le texte plus précis et plus fluide : « occasion non négligeable », « Celui qui nous accueille », « fondra comme du plomb », et « les œuvres cachées et publiques seront manifestées ».'
  terminology: « Aumône », « repentance », « miséricorde », « puissances des cieux » et « bonne conscience » conviennent au registre. « Frères et sœurs » reste une adaptation inclusive recevable de l’adresse communautaire, sans incidence sur le sens du passage.
  issues:
  - severity: medium
    issue: « tant qu’il y a encore quelqu’un pour nous accueillir »
    rationale: « Quelqu’un » affaiblit et indétermine inutilement le substantif personnel « One » du témoin, que le contexte présente vraisemblablement comme un référent divin. « Celui qui nous accueille » préserve à la fois la personnalisation et l’absence de nom explicite.
  - severity: low
    issue: « une occasion considérable »
    rationale: « No small opportunity » signifie idiomatiquement une occasion réelle ou non négligeable, non nécessairement « considérable ».
  - severity: low
    issue: « sera comme du plomb qui fond au feu » et « apparaîtront au grand jour les œuvres secrètes et manifestes »
    rationale: Le premier tour atténue le verbe de fusion appliqué à la terre ; le second ajoute l’idiome « au grand jour », peu approprié à des œuvres déjà dites manifestes. Une formulation plus directe conserve mieux l’antithèse.
  revised_text: 'Ainsi donc, frères et sœurs, puisque nous avons trouvé une occasion non négligeable de nous repentir et que nous en avons le temps, revenons à Dieu qui nous a appelés, tant que nous avons encore Celui qui nous accueille.


    Car si nous renonçons à ces plaisirs et maîtrisons notre âme en refusant de satisfaire ses mauvais désirs, nous aurons part à la miséricorde de Jésus.


    Mais vous savez que le jour du jugement vient dès maintenant comme une fournaise ardente : les puissances des cieux fondront, et toute la terre fondra comme du plomb au feu. Alors les œuvres cachées et publiques des êtres humains seront manifestées.


    L’aumône est donc une bonne chose, tout comme le repentir du péché. Le jeûne vaut mieux que la prière, mais l’aumône vaut mieux que l’un et l’autre. L’amour couvre une multitude de péchés, tandis que la prière faite avec une bonne conscience délivre de la mort. Heureux quiconque est trouvé plein de toutes ces choses ! Car l’aumône enlève le fardeau du péché.'
  revised_footnotes: []
  revision_rationale: La révision corrige une indétermination non justifiée du référent personnel qui « accueille », resserre quelques équivalents lexicaux et évite une redondance dans l’expression des œuvres « secrètes et manifestes ». Elle ne cherche pas à atténuer ni à expliquer confessionnellement les déclarations sur le repentir, le jeûne, la prière, l’amour et l’aumône. La ponctuation corrompue « sin&gt; » est, comme dans le dossier, traitée comme une séparation de phrase.
