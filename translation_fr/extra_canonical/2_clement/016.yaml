base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: fr
  text: 'Ainsi donc, frères et sœurs, puisque nous avons devant nous une occasion considérable de nous repentir et que nous en avons le temps, revenons à Dieu qui nous a appelés, tant qu’il y a encore quelqu’un pour nous accueillir.


    Car si nous renonçons à ces plaisirs et maîtrisons notre âme en refusant d’accomplir ses mauvais désirs, nous aurons part à la miséricorde de Jésus.


    Mais vous savez que le jour du jugement arrive dès maintenant comme une fournaise ardente : les puissances des cieux fondront, et toute la terre sera comme du plomb qui fond au feu. Alors apparaîtront au grand jour les œuvres secrètes et manifestes des êtres humains.


    Faire l’aumône est donc une bonne chose, tout comme se repentir du péché. Le jeûne vaut mieux que la prière, mais l’aumône vaut mieux que l’un et l’autre. L’amour couvre une multitude de péchés, tandis que la prière faite avec une bonne conscience délivre de la mort. Heureux quiconque est trouvé riche de toutes ces choses ! Car l’aumône enlève le fardeau du péché.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: frères et sœurs
  rationale: Rend l’adresse communautaire inclusive en français moderne sans modifier sa fonction fraternelle.
- source_word: repentance
  choice: se repentir / repentir
  rationale: Conserve l’idée d’un retournement moral vers Dieu, plutôt qu’un simple regret.
- source_word: conquer our soul
  choice: maîtrisons notre âme
  rationale: Expression française naturelle qui maintient l’idée de domination exercée sur les désirs mauvais, sans suggérer la destruction de l’âme.
- source_word: partakers
  choice: aurons part
  rationale: Conserve le sens de participation ou de partage, dans un registre biblique actuel.
- source_word: powers of the heavens
  choice: puissances des cieux
  rationale: Traduction formelle qui préserve l’ambiguïté entre réalités cosmiques et puissances célestes.
- source_word: almsgiving
  choice: faire l’aumône / l’aumône
  rationale: Terme français usuel pour le don charitable aux personnes dans le besoin.
- source_word: love
  choice: amour
  rationale: Préserve la portée générale du terme sans imposer une distinction théologique absente du témoin fourni.
- source_word: full of these
  choice: riche de toutes ces choses
  rationale: Formulation idiomatique et digne exprimant l’abondance de ces pratiques et vertus.
theological_decisions:
- issue: Identité de celui qui accueille
  choice: quelqu’un pour nous accueillir
  alternative: Celui qui nous accueille
  rationale: Le témoin porte « One » avec une possible référence divine, mais le grec n’ayant pas encore été vérifié, la traduction évite de préciser silencieusement l’identité.
- issue: Rapport entre aumône, repentir, jeûne et prière
  choice: Conserver la hiérarchie explicite des pratiques
  alternative: Atténuer en disant que ces pratiques sont toutes importantes
  rationale: Le passage affirme une comparaison difficile sur le plan théologique ; elle doit être conservée plutôt qu’harmonisée.
- issue: Aumône et fardeau du péché
  choice: l’aumône enlève le fardeau du péché
  alternative: l’aumône témoigne du pardon des péchés
  rationale: La formulation forte du témoin est maintenue sans lui substituer une explication doctrinale.
- issue: Temporalité du jour du jugement
  choice: arrive dès maintenant
  alternative: est sur le point d’arriver
  rationale: Préserve la tension du « even now » du témoin, qui peut signaler proximité et irruption présente.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction reste provisoire, car le dossier fourni indique que la vérification directe du grec est encore en attente. La corruption typographique « sin&gt; » a été comprise comme une fin de phrase. Les échos scripturaires et les affirmations théologiquement tendues ont été conservés sans harmonisation confessionnelle.
