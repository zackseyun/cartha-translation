base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: fr
  text: 'Ne nous contentons donc pas de l’appeler « Seigneur », car cela ne nous sauvera pas.


    En effet, il dit : « Ce ne sont pas tous ceux qui me disent : “Seigneur” qui seront sauvés, mais celui qui pratique la justice. »[a]


    Ainsi donc, frères et sœurs,[b] confessons-le par nos actes : aimons-nous les uns les autres, ne commettons pas d’adultère, ne disons pas de mal les uns des autres et ne soyons pas envieux, mais soyons maîtres de nous-mêmes, miséricordieux et bons. Nous devons avoir de la compassion les uns pour les autres et ne pas être avides. Confessons-le par ces actes, et non par le contraire.


    Nous devons craindre Dieu plutôt que les êtres humains.


    C’est pourquoi le Seigneur a dit : « Même si vous êtes réunis avec moi dans mon sein,[c] si vous n’obéissez pas à mes commandements, je vous rejetterai et je vous dirai : “Éloignez-vous de moi ! Je ne sais pas d’où vous venez, vous qui pratiquez l’injustice.” »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette parole rappelle Matthieu 7.21, mais elle est citée ici sous une forme différente : « celui qui pratique la justice » au lieu de « celui qui fait la volonté de mon Père ».'
    reason: Identifier l’écho scripturaire sans corriger la forme propre à 2 Clément.
  - marker: b
    text: 'Littéralement : « frères » ; dans ce type d’adresse, le terme peut désigner l’ensemble de la communauté.'
    reason: Signaler la forme ancienne derrière le rendu inclusif.
  - marker: c
    text: 'Littéralement : « dans mon sein ». L’image exprime une proximité extrême avec le Seigneur, tout en conservant une formulation volontairement frappante.'
    reason: Éclairer une image corporelle difficile sans la remplacer par une paraphrase.
  - marker: d
    text: La citation combine des formulations qui rappellent notamment Matthieu 7.23 et Luc 13.25–27 ; elle ne correspond mot pour mot à aucun de ces passages.
    reason: Éclairer le caractère composite ou traditionnel de la citation sans imposer une source unique.
lexical_decisions:
- source_word: κύριος / Lord (witness)
  choice: Seigneur
  rationale: Titre christologique naturel et traditionnel en français, sans expliciter davantage l’identité du référent.
- source_word: ποιῶν δικαιοσύνην / doeth righteousness (witness)
  choice: pratique la justice
  rationale: Conserve le caractère actif de l’expression et son lien avec les actes, plutôt que de réduire le sens à une qualité morale abstraite.
- source_word: ὁμολογεῖν / confess (witness)
  choice: confesser
  rationale: Préserve le vocabulaire de la confession publique et le contraste entre paroles et actes; « reconnaître » serait plus courant mais moins précis théologiquement.
- source_word: σωφρονεῖν / be temperate (witness)
  choice: faire preuve de maîtrise de soi
  rationale: Expression moderne et intelligible qui rend la retenue morale sans l’ambiguïté actuelle de « tempérant ».
- source_word: συμπαθεῖν / have fellow-feeling (witness)
  choice: partager les peines les uns des autres
  rationale: Rend concrètement la compassion mutuelle suggérée par le témoin, tout en évitant le faux ami « sympathiser ».
- source_word: πλεονεκτεῖν / be covetous (witness)
  choice: être avides
  rationale: Terme assez large pour couvrir la convoitise et la recherche intéressée d’un avantage.
- source_word: ἐργάται ἀνομίας / workers of iniquity (witness)
  choice: vous qui pratiquez l’injustice
  rationale: Formulation naturelle qui maintient l’idée d’une conduite habituelle contraire à la justice.
theological_decisions:
- issue: Rapport entre l’appellation « Seigneur », les œuvres et le salut
  choice: Conserver sans atténuation l’affirmation selon laquelle l’appellation seule ne sauve pas et celui qui pratique la justice sera sauvé.
  alternative: Reformuler en introduisant une distinction doctrinale entre foi et œuvres.
  rationale: Le passage met délibérément en tension confession verbale et obéissance concrète; la traduction ne doit pas importer une harmonisation confessionnelle.
- issue: Genre de l’adresse ἀδελφοί, attestée indirectement par « brethren »
  choice: frères et sœurs
  alternative: frères
  rationale: L’adresse vise vraisemblablement toute l’assemblée; la formulation inclusive est naturelle en français moderne. Une note signale la forme littérale du terme grec présumé, la révision grecque directe restant nécessaire.
- issue: Image du sein du Seigneur
  choice: contre mon sein
  alternative: dans mon sein; auprès de moi
  rationale: Maintient l’image corporelle et l’intimité du propos transmis, malgré son caractère inhabituel, au lieu de la remplacer par une paraphrase théologique.
- issue: Forme conditionnelle de la dernière citation
  choice: Même si… si vous n’obéissez pas…
  alternative: Bien que vous soyez… et que vous n’accomplissiez pas…
  rationale: 'Préserve la logique concessive: la proximité apparente avec le Seigneur ne remplace pas l’obéissance.'
translation_notes:
  register: Français international moderne, digne et accessible. Les périodes longues ont été légèrement structurées pour la lisibilité, tout en conservant l’enchaînement exhortatif, les répétitions et la tension entre confession verbale et conduite. Draft provisoire fondé sur le témoin anglais public fourni et contrôlé autant que possible par les expressions grecques connues ou probables; une collation directe avec l’édition grecque critique demeure nécessaire.
