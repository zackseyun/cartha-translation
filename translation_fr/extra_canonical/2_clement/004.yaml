review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’avertissement contre une confession seulement verbale, la liste de conduites concrètes et l’oracle final sont conservés. Quelques ajustements améliorent la proximité avec les formulations grecques attestées : ἐλεήμονες est mieux rendu par « miséricordieux », συμπαθεῖν ne se limite pas aux « peines », et ἐν τῷ κόλπῳ μου doit conserver la localisation imagée « dans mon sein » plutôt que l’ajout interprétatif « auprès de moi, contre mon sein ». La formulation difficile de la dernière citation et sa tension interne sont préservées sans harmonisation.'
  naturalness: Le français est globalement clair et d’un registre convenable. « Soyons maîtres de nous-mêmes, miséricordieux et bons » donne une série plus naturelle et plus proche des adjectifs grecs. « Je ne sais pas d’où vous venez » est idiomatique en français contemporain tout en rendant πόθεν ἐστέ. L’expression « dans mon sein » demeure volontairement insolite, car elle reproduit une image source difficile ; une note l’éclaire.
  terminology: « Seigneur », « pratique la justice » et « confesser » maintiennent les termes structurants du passage. « Frères et sœurs » est acceptable pour une adresse communautaire moderne, avec note sur le masculin grec. « Vous qui pratiquez l’injustice » garde la caractérisation active de ἐργάται ἀνομίας, sans lui imposer une interprétation confessionnelle.
  issues:
  - severity: medium
    issue: Rendu de ἐλεήμονες et de συμπαθεῖν
    rationale: « Compassion » puis « partager les peines » affaiblissent ou restreignent respectivement les deux termes. Le premier désigne la miséricorde ; le second évoque une participation sensible ou une compassion mutuelle qui ne se limite pas à la peine.
  - severity: medium
    issue: Image de ἐν τῷ κόλπῳ μου
    rationale: « Auprès de moi, contre mon sein » dédouble et modifie l’image locative du texte. « Avec moi dans mon sein » préserve l’expression inhabituelle sans paraphrase.
  - severity: low
    issue: Note c présentée comme une vérification future
    rationale: La note doit expliquer l’image sans affirmer qu’elle demeure à vérifier ; le texte source fourni permet d’identifier le sein/kolpos comme l’image en jeu.
  - severity: low
    issue: Formulation finale de l’oracle
    rationale: « Je ne sais pas d’où vous êtes » est calqué et peu naturel. « Je ne sais pas d’où vous venez » restitue naturellement l’origine exprimée par πόθεν ἐστέ.
