  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: fr
  text: 'Mais le Seigneur dit : « Aucun serviteur ne peut servir deux maîtres. » Si nous voulons servir à la fois Dieu et la richesse, cela ne nous sert à rien.


    En effet, quel avantage y a-t-il à gagner le monde entier si l’on perd son âme ?


    Le monde présent et le monde à venir sont ennemis l’un de l’autre.


    L’un parle d’adultère, de souillure, d’avidité et de tromperie ; l’autre dit adieu à tout cela.


    Nous ne pouvons donc pas être les amis des deux. Il nous faut dire adieu à l’un et nous attacher à l’autre.


    Reconnaissons qu’il vaut mieux détester les choses d’ici-bas, parce qu’elles sont sans valeur, passagères et périssables, et aimer celles de là-haut, parce qu’elles sont bonnes et impérissables.


    Car si nous faisons la volonté du Christ, nous trouverons le repos. Sinon, rien ne nous délivrera du châtiment éternel si nous désobéissons à ses commandements.


    L’Écriture dit aussi dans Ézéchiel : « Même si Noé, Job et Daniel se levaient, ils ne délivreraient pas leurs enfants de la captivité. »[a]


    Mais si même des hommes justes comme eux ne peuvent délivrer leurs enfants par leurs actes justes, avec quelle assurance entrerons-nous dans le royaume de Dieu si nous ne gardons pas notre baptême pur et sans souillure ? Et qui prendra notre défense si nous ne sommes pas trouvés avec des œuvres saintes et justes ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La citation attribuée à Ézéchiel reprend librement Ézéchiel 14.14, 20. Dans le texte biblique, les trois justes sont Noé, Daniel et Job, et ils ne sauvent que leur propre vie ; la formulation « se levaient » et « leurs enfants de la captivité » reflète ici une forme adaptée ou une citation de mémoire.
    reason: Signaler l’écart réel entre la citation de 2 Clément et le texte canonique d’Ézéchiel sans corriger silencieusement l’auteur.
lexical_decisions:
- source_word: mammon
  choice: la richesse
  rationale: Rend le sens concret de Mammon en français moderne sans personnification absente du contexte immédiat.
- source_word: this age / the future
  choice: le monde présent / le monde à venir
  rationale: Formulation française naturelle qui conserve le contraste eschatologique entre l’ordre actuel et celui qui vient.
- source_word: hold companionship with
  choice: nous attacher à
  rationale: Exprime une relation durable et une loyauté active sans lourdeur archaïque.
- source_word: rest
  choice: le repos
  rationale: Conserve le terme théologiquement chargé et son amplitude eschatologique, sans le réduire à la simple tranquillité.
- source_word: advocate
  choice: prendra notre défense
  rationale: Expression idiomatique gardant ouverte l’identité de celui qui pourrait plaider en faveur des personnes jugées.
theological_decisions:
- issue: Rapport entre les œuvres, le baptême et l’entrée dans le royaume
  choice: Conserver la formulation exhortative et conditionnelle du témoin
  alternative: L’atténuer afin de l’harmoniser avec une doctrine particulière du salut
  rationale: Le passage associe explicitement fidélité baptismale, œuvres justes et assurance d’entrer dans le royaume ; la traduction ne doit ni supprimer ni systématiser cette tension.
- issue: « Volonté du Christ » et repos
  choice: 'Traduction directe : « si nous faisons la volonté du Christ, nous trouverons le repos »'
  alternative: Interpréter le repos comme salut, paix intérieure ou repos après la mort
  rationale: « Le repos » reste volontairement ouvert et préserve la portée possible du langage ancien.
- issue: Châtiment éternel
  choice: « châtiment éternel »
  alternative: « destruction éternelle » ou « correction de longue durée »
  rationale: La formulation transmise soutient sans ambiguïté cette expression ; il convient de ne pas en modifier la nature ou la durée.
