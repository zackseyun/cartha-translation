review_pass:
  verdict: revise
  source_fidelity: Révision prudente sur la base du témoin anglais fourni et du grec usuel de 2 Clément 6. Le contraste porte sur « l’âge présent » et « celui qui vient », ainsi que sur les réalités « d’ici » et « de là-bas »; il ne convient pas de le transformer en opposition explicite entre la terre et le ciel. « Corruption » rend plus exactement le terme traditionnellement attesté derrière « defilement ». La citation d’Ézéchiel, manifestement adaptée, est conservée telle qu’elle est attribuée à l’auteur.
  naturalness: Le français révisé demeure moderne, international et exhortatif. « S’attacher à l’autre », « les réalités d’ici » et « prendre notre défense » sont naturels sans banaliser le registre.
  terminology: « Richesse » maintient le sens de mammon sans introduire une personnification. « Âge présent / âge à venir », « corruption », « repos », « châtiment éternel », « baptême » et « royaume de Dieu » conservent les termes et l’amplitude du passage.
  issues:
  - severity: medium
    issue: « Le monde présent et le monde à venir »
    rationale: Le témoin traduit explicitement « this age and the future ». « Monde » peut suggérer deux lieux ou deux réalités cosmiques, alors que le contraste temporel-eschatologique de « l’âge présent » et « celui qui vient » est plus fidèle.
  - severity: medium
    issue: « les choses d’ici-bas » / « celles de là-haut »
    rationale: Cette opposition spatialise et interprète le texte. Les expressions « d’ici » et « de là-bas » préservent le parallélisme et l’indétermination de l’original.
  - severity: medium
    issue: « souillure »
    rationale: Le terme grec habituellement imprimé dans ce passage est φθορά, dont « corruption » est le correspondant français direct; « souillure » est plus étroit et recouvre une autre nuance.
