review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire dans la première phrase : « en faisant que » introduit une causalité explicite qui ne correspond pas à l’énoncé, lequel présente le fait de ne pas sacrifier ni adorer comme une première manifestation de la grande miséricorde reçue. La question finale porte plus exactement sur « cette connaissance à son égard » que sur le simple fait de « le connaître ». Le reste suit fidèlement le témoin anglais, tout en conservant les pronoms non explicités.'
  naturalness: Le français est soutenu et accessible. La reformulation de l’ouverture allège la construction et restitue plus naturellement la relation logique du texte. « Se déclarer pour » demeure une solution moderne et cohérente pour la reconnaissance/confession publique, répétée dans la citation et son application.
  terminology: « Miséricorde », « Père de la vérité », « adorer », « commandements », « cœur » et « intelligence » conviennent. « Père de la vérité » conserve volontairement le caractère marqué de l’expression. Les notes conservent utilement l’absence d’harmonisation forcée des citations.
  issues:
  - severity: medium
    issue: Causalité ajoutée dans « en faisant que nous ... n’offrions pas »
    rationale: Le témoin formule la miséricorde comme incluant d’abord le fait que les croyants vivants ne sacrifient ni n’adorent les dieux morts ; il n’énonce pas explicitement que Dieu les a fait agir ainsi. La tournure causative réduit cette nuance.
  - severity: low
    issue: « que signifie donc le connaître » affaiblit la construction « cette connaissance à son égard »
    rationale: Le texte distingue la connaissance reçue et sa juste expression envers celui qui a rendu cette connaissance possible. « En quoi consiste cette connaissance à son égard » conserve mieux cette articulation.
  revised_text: 'Puisqu’il nous a témoigné une si grande miséricorde — d’abord parce que nous qui vivons, nous n’offrons pas de sacrifices à ces dieux morts et ne les adorons pas, mais que, par lui, nous avons connu le Père de la vérité —, en quoi consiste donc cette connaissance à son égard, sinon à ne pas renier celui par qui nous l’avons connu ?


    Oui, il dit lui-même : « Celui qui se déclarera pour moi, moi aussi je me déclarerai pour lui devant le Père. »[a]


    Voilà donc notre récompense, si vraiment nous nous déclarons pour celui par qui nous avons été sauvés.


    Mais comment nous déclarons-nous pour lui ? En faisant ce qu’il dit, en ne désobéissant pas à ses commandements et en l’honorant non seulement des lèvres, mais de tout notre cœur et de toute notre intelligence.


    Il dit aussi dans Ésaïe : « Ce peuple m’honore des lèvres, mais son cœur est loin de moi. »[b]'
  revised_footnotes:
  - marker: a
    text: Voir Matthieu 10.32 ; Luc 12.8. La formulation citée ne correspond pas mot pour mot à une seule forme évangélique conservée.
    reason: Identifier l’écho scripturaire sans harmoniser la citation avec un Évangile particulier.
  - marker: b
    text: Ésaïe 29.13, selon une forme proche de la tradition grecque ; voir aussi Matthieu 15.8 et Marc 7.6.
    reason: Signaler la source et la forme textuelle de la citation sans remplacer les mots de l’auteur par ceux d’une version biblique moderne.
  revision_rationale: La révision retire une relation causative non exprimée, rétablit l’accent sur « cette connaissance à son égard » et conserve tous les référents pronominaux, les ambiguïtés et les échos scripturaires du passage. Les ancres et les deux notes existantes sont conservées et demeurent correctement associées aux citations.
