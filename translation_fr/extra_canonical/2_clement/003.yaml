    Now He saith also in Isaiah, This people honoreth me with their lips, but their heart is far from Me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: fr
  text: 'Puisqu’il nous a témoigné une si grande miséricorde — avant tout, en faisant que nous, qui sommes vivants, n’offrions pas de sacrifices à ces dieux morts et ne les adorions pas, mais que, par lui, nous ayons connu le Père de la vérité —, que signifie donc le connaître, sinon ne pas renier celui par qui nous l’avons connu ?


    Oui, il dit lui-même : « Celui qui se déclarera pour moi, moi aussi je me déclarerai pour lui devant le Père. »[a]


    Voilà donc notre récompense, si vraiment nous nous déclarons pour celui par qui nous avons été sauvés.


    Mais comment nous déclarons-nous pour lui ? En faisant ce qu’il dit, en ne désobéissant pas à ses commandements et en l’honorant non seulement des lèvres, mais de tout notre cœur et de toute notre intelligence.


    Il dit aussi dans Ésaïe : « Ce peuple m’honore des lèvres, mais son cœur est loin de moi. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Matthieu 10.32 ; Luc 12.8. La formulation citée ne correspond pas mot pour mot à une seule forme évangélique conservée.
    reason: Identifier l’écho scripturaire sans harmoniser la citation avec un Évangile particulier.
  - marker: b
    text: Ésaïe 29.13, selon une forme proche de la tradition grecque ; voir aussi Matthieu 15.8 et Marc 7.6.
    reason: Signaler la source et la forme textuelle de la citation sans remplacer les mots de l’auteur par ceux d’une version biblique moderne.
lexical_decisions:
- source_word: ἐλεημοσύνη / mercy (witness)
  choice: miséricorde
  rationale: « Miséricorde » conserve la portée religieuse et la grandeur du bienfait reçu, dans un français digne et courant.
- source_word: ὁ πατὴρ τῆς ἀληθείας / Father of truth
  choice: le Père de la vérité
  rationale: Traduction formelle qui préserve l’expression inhabituelle et son éventuelle ambiguïté plutôt que de la normaliser en « vrai Père ».
- source_word: ὁμολογεῖν / confess
  choice: se déclarer pour
  rationale: Dans la parole citée et son application, le verbe désigne une reconnaissance publique et loyale. Cette tournure évite le sens moderne dominant de « confesser une faute » tout en gardant la réciprocité du passage.
- source_word: διάνοια / mind
  choice: intelligence
  rationale: Rend la faculté de pensée et de compréhension sans limiter le terme à l’intellect abstrait.
- source_word: προσκυνεῖν / worship
  choice: adorer
  rationale: Convient au culte rendu à des divinités et reste immédiatement compréhensible.
theological_decisions:
- issue: Identité des pronoms dans « par lui » et « celui par qui »
  choice: Conserver les pronoms sans ajouter explicitement « Christ » ou « Dieu »
  alternative: Expliciter le référent comme étant Jésus-Christ
  rationale: Le contexte renvoie vraisemblablement au Christ, mais le passage transmis emploie des pronoms. Les conserver évite une précision interprétative absente du texte.
- issue: Rapport entre confession et récompense
  choice: 'Conserver la formulation conditionnelle : « si vraiment »'
  alternative: Reformuler comme une assurance inconditionnelle ou comme un mérite qui procure le salut
  rationale: Le texte établit une condition rhétorique et morale sans exposer ici un système complet du salut; la traduction ne doit ni l’atténuer ni la systématiser.
- issue: Sens de la confession du Christ
  choice: Exprimer une prise de position qui se manifeste par l’obéissance et l’honneur intérieur
  alternative: Réduire la confession à une déclaration verbale ou à une formule liturgique
  rationale: Le paragraphe définit lui-même cette confession par les actes, l’obéissance, le cœur et l’intelligence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe longue de l’ouverture a été structurée par des tirets afin de préserver son enchaînement logique. « Se déclarer pour » est répété volontairement pour rendre le même verbe dans la citation et dans son commentaire. Le brouillon demeure provisoire, car les données fournies indiquent qu’une vérification directe du grec est encore nécessaire.
