  english_witness: 'Seeing then that He bestowed so great mercy on us; first of all, that we, who are living, do not sacrifice to these dead gods, neither worship them, but through Him have known the Father of truth. What else is this knowledge to Himward, but not to deny Him through whom we have known Him?


    Yea, He Himself saith, Whoso confesseth Me, Him will I confess before the Father.


