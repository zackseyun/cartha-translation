revisions:
- from: 'Ne suis-je pas capable de vous écrire au sujet des réalités célestes ? Mais je crains de vous faire du mal, puisque vous êtes encore de tout petits enfants. Supportez-moi donc : si vous n’étiez pas capables de les assimiler, elles pourraient vous étouffer.


    Car moi aussi, bien que je sois dans les chaînes et capable de comprendre les réalités célestes, les rangs des anges et les rassemblements des principautés, les choses visibles et les invisibles, ce n’est pas pour autant que je suis déjà disciple. Il nous manque en effet bien des choses, afin que Dieu ne nous manque pas.'
  to: 'Ne puis-je pas vous écrire au sujet des choses célestes ? Mais je crains de vous causer du tort, puisque vous êtes encore des enfants. Soyez donc indulgents envers moi, de peur que, incapables de les recevoir, vous ne soyez étouffés.


    Car moi aussi, bien que je sois dans les chaînes et capable de comprendre les choses célestes, les ordres des anges et les assemblées des principautés, les choses visibles et invisibles, je ne suis pas encore disciple pour autant. Car il nous manque beaucoup de choses, afin que Dieu ne nous manque pas.'
  rationale: 'La révision resserre la fidélité aux expressions grecques tout en conservant un français international moderne. « Les choses célestes » garde l’ouverture de τὰ ἐπουράνια. « Ordres » et « assemblées » rendent respectivement τάξεις et συστάσεις sans construire une hiérarchie angélique déterminée. La dernière proposition est conservée dans sa forme paradoxale : elle peut évoquer le risque d’être privés de Dieu, sans trancher davantage son interprétation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision requise pour mieux refléter les tournures du grec de la recension moyenne : « soyez indulgents envers moi » rend συγγνώμην ... ἔχετε, et « je ne suis pas encore disciple » rend explicitement οὔπω. Les images et la réserve de la conclusion paradoxale sont maintenues.'
  naturalness: Le texte révisé emploie un français moderne, soutenu et naturel. Il évite notamment l’ambiguïté de « Supportez-moi », qui peut évoquer la simple tolérance plutôt que l’indulgence demandée par l’auteur.
  terminology: « choses célestes », « ordres des anges », « assemblées des principautés » et « disciple » conservent le vocabulaire et l’indétermination de l’original, sans identifier les puissances célestes selon un système doctrinal particulier.
  issues:
  - severity: medium
    issue: « Supportez-moi donc »
    rationale: La formule grecque συγγνώμην οὖν μοι ἔχετε demande que les destinataires aient de l’indulgence ou du pardon envers l’auteur. « Supportez-moi » est possible dans un sens large, mais est moins précis et peut sonner comme « tolérez-moi ».
  - severity: medium
    issue: « ce n’est pas pour autant que je suis déjà disciple »
    rationale: Le grec οὔπω ... μαθητής εἰμι signifie littéralement « je ne suis pas encore disciple pour autant ». La place de « déjà » dans le projet peut affaiblir l’assertion présente selon laquelle l’auteur n’est pas encore disciple.
  - severity: low
    issue: « de tout petits enfants »
    rationale: Le grec νηπίοις porte la métaphore d’enfants en bas âge. « tout petits » est défendable, mais « des enfants » conserve l’image sans intensification interprétative.
