  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: fr
  text: 'Ne puis-je pas vous écrire au sujet des choses célestes ? Mais je crains de vous causer du tort, puisque vous êtes encore des enfants. Soyez donc indulgents envers moi, de peur que, incapables de les recevoir, vous ne soyez étouffés.


    Car moi aussi, bien que je sois dans les chaînes et capable de comprendre les choses célestes, les ordres des anges et les assemblées des principautés, les choses visibles et invisibles, je ne suis pas encore disciple pour autant. Car il nous manque beaucoup de choses, afin que Dieu ne nous manque pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly things
  choice: réalités célestes
  rationale: Rend l’expression de façon naturelle sans préciser indûment la nature de ces réalités.
- source_word: babes
  choice: de tout petits enfants
  rationale: Conserve la métaphore de l’immaturité et son ton pastoral sans employer le terme moderne « bébés », potentiellement trop familier.
- source_word: arrays of the angels
  choice: rangs des anges
  rationale: Exprime l’idée d’ordres organisés ou de formations angéliques dans un français clair.
- source_word: musterings of the principalities
  choice: rassemblements des principautés
  rationale: Préserve le caractère collectif et céleste de l’expression sans identifier précisément ces groupes.
- source_word: disciple
  choice: disciple
  rationale: Maintient le terme théologique courant et le paradoxe voulu par l’auteur.
- source_word: we lack many things
  choice: il nous manque bien des choses
  rationale: Préserve l’énoncé général à la première personne du pluriel ainsi que son ouverture sémantique.
theological_decisions:
- issue: Le statut de disciple malgré la connaissance spirituelle
  choice: « ce n’est pas pour autant que je suis déjà disciple »
  alternative: « cela ne suffit pas à faire de moi un disciple »
  rationale: 'La formulation retenue conserve le paradoxe du témoin : connaissance des réalités célestes et souffrance ne prouvent pas à elles seules l’accomplissement du discipulat.'
- issue: La proposition finale concernant ce qui manque à l’être humain et Dieu
  choice: « afin que Dieu ne nous manque pas »
  alternative: « pour que nous ne soyons pas privés de Dieu »
  rationale: La tournure littérale préserve la tension et l’étrangeté théologiques de la formulation transmise, sans en imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et pastoral. La traduction repose provisoirement sur le témoin anglais public fourni, la vérification directe du grec de la recension moyenne restant à effectuer. Les images fortes de l’enfance et de l’étouffement, ainsi que la phrase finale volontairement paradoxale, sont conservées.
