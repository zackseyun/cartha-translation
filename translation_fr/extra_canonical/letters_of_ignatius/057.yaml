base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a servant even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: fr
  text: 'J’écris à toutes les Églises et je fais savoir à tous que c’est de mon plein gré que je meurs pour Dieu — à moins que vous ne m’en empêchiez. Je vous en prie : ne me témoignez pas une bienveillance qui tombe mal. Laissez-moi être livré aux bêtes sauvages, car c’est par elles que je peux parvenir à Dieu. Je suis le blé de Dieu, et les dents des bêtes sauvages me broient afin que je sois trouvé pur pain [du Christ].[a]


    Attirez plutôt les bêtes sauvages, afin qu’elles deviennent mon tombeau et ne laissent rien subsister de mon corps ; ainsi, après m’être endormi, je ne serai à la charge de personne. Alors je serai véritablement disciple de Jésus-Christ, lorsque le monde ne verra même pas mon corps. Suppliez le Seigneur pour moi, afin que, par ces instruments, je sois trouvé comme un sacrifice offert à Dieu.


    Je ne vous donne pas d’ordres comme Pierre et Paul. Eux étaient apôtres ; moi, je suis un condamné. Eux étaient libres ; moi, je suis encore, jusqu’à cette heure, un esclave. Mais si je souffre, alors je serai un affranchi de Jésus-Christ et, en lui, je ressusciterai libre. Maintenant, dans mes chaînes, j’apprends à renoncer à tout désir.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « du Christ » sont conservés entre crochets parce que leur présence dans le texte grec est incertaine.
    reason: Signaler la variation ou restitution textuelle déjà indiquée par le témoin anglais fourni.
  - marker: b
    text: 'Ou : « à me défaire de tout désir ». Le terme peut désigner le désir de façon générale ; le texte ne précise pas ici une catégorie particulière de désirs.'
    reason: Préserver l’étendue lexicale et l’ambiguïté ascétique de la formule finale.
lexical_decisions:
- source_word: ἀποθανεῖν / dying (witness)
  choice: je meurs
  rationale: Conserve le présent saisissant et la déclaration volontaire du témoin, sans atténuer l’attente du martyre.
- source_word: ἐπιτυχεῖν θεοῦ / attain unto God
  choice: parvenir à Dieu
  rationale: Rend naturellement le mouvement vers Dieu tout en évitant de préciser davantage la nature de cet accomplissement.
- source_word: σῖτος θεοῦ / God’s wheat
  choice: le blé de Dieu
  rationale: Préserve directement la métaphore agricole et eucharistique potentielle sans l’interpréter.
- source_word: κατάκριτος / convict
  choice: un condamné
  rationale: Dans le contexte de la détention et de l’exécution, « condamné » est plus idiomatique et précis que « détenu » ou « criminel ».
- source_word: δοῦλος / slave
  choice: un esclave
  rationale: Maintient le contraste social et juridique fort avec « libres » et « affranchi ».
- source_word: ἀπελεύθερος / freedman
  choice: un affranchi
  rationale: Conserve l’image juridique de l’esclave libéré, essentielle au contraste du passage.
- source_word: ἐπιθυμία / desire
  choice: tout désir
  rationale: Préserve l’étendue et l’ambiguïté du terme plutôt que de le limiter aux désirs mauvais ou charnels.
theological_decisions:
- issue: Le sens de « parvenir à Dieu » par les bêtes
  choice: Conserver « parvenir à Dieu »
  alternative: « rejoindre Dieu » ou « obtenir Dieu »
  rationale: La formulation maintient la tension entre martyre, union à Dieu et accomplissement eschatologique sans imposer une explication doctrinale.
- issue: Le pain « [du Christ] »
  choice: Maintenir les crochets avec une note
  alternative: Intégrer « du Christ » sans crochets ou l’omettre
  rationale: Les crochets signalent honnêtement que ces mots sont textuellement incertains dans la base fournie.
- issue: La condition « si je souffre »
  choice: « Mais si je souffre »
  alternative: « si je subis le martyre »
  rationale: La formulation plus littérale ne réduit pas explicitement la souffrance au seul acte final du martyre, même si le contexte l’oriente ainsi.
- issue: « je ressusciterai libre en lui »
  choice: « en lui, je ressusciterai libre »
  alternative: « je me lèverai libre en lui »
  rationale: Le contexte chrétien favorise une résonance de résurrection, mais la phrase reste concise et ne développe pas son mécanisme théologique.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le pluriel « vous » et les oppositions rhétoriques sont conservés. « Églises » reçoit une majuscule comme désignation des communautés chrétiennes ; le vocabulaire juridique (« condamné », « esclave », « affranchi ») maintient la progression de l’original. Draft provisoire : la documentation fournie indique qu’une révision directe du grec de la recension moyenne reste à effectuer.'
