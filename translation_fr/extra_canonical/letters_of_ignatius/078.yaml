review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais et correspond au sens du grec de la recension moyenne : souffrance « pour nous », réalité de la souffrance et de l’auto-résurrection, polémique contre la souffrance seulement apparente, puis conséquence conforme à l’opinion des adversaires. La formulation finale « Ce qu’ils pensent leur arrivera » déplace toutefois le sens : le grec indique que ce qui leur adviendra sera conforme à leur manière de penser, non que le contenu de leurs pensées leur arrivera directement.'
  naturalness: Le français est globalement clair et de registre approprié. « Eux-mêmes ne sont qu’apparence » se comprend, mais « ils ne sont eux-mêmes qu’apparence » rend plus naturellement l’effet polémique. « Conformément à leurs opinions, il leur arrivera ainsi » est plus idiomatique et plus précis que la formulation actuelle.
  terminology: « Réellement », « en apparence », « sans corps » et « semblables aux démons » conservent les oppositions du texte sans surinterprétation. La tournure réfléchie concernant la résurrection est volontairement conservée, conformément au grec et au témoin fourni.
  issues:
  - severity: medium
    issue: La conséquence annoncée aux adversaires est rendue de manière imprécise.
    rationale: '« Ce qu’ils pensent leur arrivera aussi » peut signifier que l’objet de leur croyance se réalisera. καθὼς φρονοῦσιν, συμβήσεται αὐτοῖς signifie plutôt : « conformément à leur opinion/manière de penser, cela leur arrivera ». La formulation doit préserver cette relation sans expliciter le châtiment.'
  - severity: low
    issue: L’expression polémique « eux-mêmes ne sont qu’apparence » peut être rendue plus naturellement.
    rationale: Le grec répète τὸ δοκεῖν (« apparence, semblant ») à propos des adversaires. L’ajout de « ils » et le placement de « eux-mêmes » rendent en français moderne l’insistance du retournement sans en modifier le sens.
  revised_text: 'Car il a souffert tout cela pour nous [afin que nous soyons sauvés]. Il a réellement souffert, tout comme il s’est lui-même réellement ressuscité. Ce n’est pas comme le disent certains incroyants : il n’aurait souffert qu’en apparence, alors qu’ils ne sont eux-mêmes qu’apparence. Conformément à leurs opinions, il leur arrivera ainsi, car ils sont sans corps et semblables aux démons.'
