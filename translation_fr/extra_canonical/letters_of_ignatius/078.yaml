base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: fr
  text: 'Car il a souffert tout cela pour nous [afin que nous soyons sauvés]. Il a réellement souffert, tout comme il s’est lui-même réellement ressuscité. Ce n’est pas comme le disent certains incroyants : il n’aurait souffert qu’en apparence, alors qu’ils ne sont eux-mêmes qu’apparence. Conformément à leurs opinions, il leur arrivera ainsi, car ils sont sans corps et semblables aux démons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: for our sakes
  choice: pour nous
  rationale: Formulation française naturelle qui conserve l’idée d’une souffrance subie en notre faveur.
- source_word: truly
  choice: réellement
  rationale: Souligne la réalité effective de la souffrance et de la résurrection, en opposition directe à « en apparence ».
- source_word: raised Himself
  choice: s’est ressuscité lui-même
  rationale: Conserve la valeur réfléchie explicite du témoin fourni, sans la remplacer par le passif plus courant « a été ressuscité ».
- source_word: in semblance
  choice: en apparence
  rationale: Expression française claire pour la thèse selon laquelle la souffrance n’aurait été qu’apparente.
- source_word: mere semblance
  choice: ne sont qu’apparence
  rationale: Reproduit le retournement polémique d’Ignace en reprenant le même champ lexical.
- source_word: without body
  choice: sans corps
  rationale: Rend directement l’idée d’incorporéité sans imposer une terminologie philosophique plus technique.
- source_word: demon-like
  choice: semblables aux démons
  rationale: Traduction transparente qui préserve la comparaison sans identifier simplement les adversaires à des démons.
theological_decisions:
- issue: Réalité de la souffrance du Christ
  choice: « Il a réellement souffert »
  alternative: « Il a souffert en vérité »
  rationale: La formulation choisie exprime nettement l’opposition à une souffrance seulement apparente, sans ajouter d’explication doctrinale.
- issue: Agent de la résurrection
  choice: « il s’est réellement ressuscité lui-même »
  alternative: « il est réellement ressuscité »
  rationale: Le témoin anglais attribue explicitement l’action au Christ lui-même; cette tension est conservée plutôt que normalisée.
- issue: Portée de la rétribution polémique
  choice: « Ce qu’ils pensent leur arrivera aussi »
  alternative: « Il leur arrivera conformément à leurs opinions »
  rationale: Préserve le lien entre leur conception d’un Christ sans réalité corporelle et le sort annoncé, sans préciser davantage la nature de ce sort.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les crochets du témoin sont conservés pour signaler la restauration textuelle. Projet nécessairement provisoire : le dossier fourni repose sur un témoin anglais du domaine public, et la vérification directe du grec de la recension moyenne reste à effectuer.'
