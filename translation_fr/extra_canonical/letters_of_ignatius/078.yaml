  to: 'Car il a souffert tout cela pour nous [afin que nous soyons sauvés]. Il a réellement souffert, tout comme il s’est lui-même réellement ressuscité. Ce n’est pas comme le disent certains incroyants : il n’aurait souffert qu’en apparence, alors qu’ils ne sont eux-mêmes qu’apparence. Conformément à leurs opinions, il leur arrivera ainsi, car ils sont sans corps et semblables aux démons.'
