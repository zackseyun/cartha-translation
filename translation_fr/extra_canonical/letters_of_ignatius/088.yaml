    I salute your godly bishop and your venerable presbytery [and] my fellow-servants the deacons, and all of you severally and in a body, in the name of Jesus Christ, and in His flesh and blood, in His passion and resurrection, which was both carnal and spiritual, in the unity of God and of yourselves. Grace to you, mercy, peace, patience, always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: fr
  text: 'L’amour des frères et sœurs qui sont à Troas vous salue. C’est de là que je vous écris aussi par l’intermédiaire de Burrhus, que vous avez envoyé avec moi, de concert avec vos frères et sœurs d’Éphèse. Il m’a réconforté de toutes les manières. Je voudrais que tous l’imitent, car il est un modèle dans le service de Dieu. La grâce divine le récompensera en toutes choses.


    Je salue votre évêque, homme attaché à Dieu, votre vénérable conseil des anciens, [a] ainsi que les diacres, mes compagnons de service, et vous tous, chacun en particulier et tous ensemble, au nom de Jésus-Christ, dans sa chair et son sang, dans sa passion et sa résurrection, à la fois corporelle et spirituelle, dans l’unité de Dieu et dans la vôtre. Que la grâce, la compassion, la paix et la persévérance soient toujours avec vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais signale ici un « et » rétabli entre crochets. La présente traduction marque donc l’articulation par [a], dans l’attente d’une vérification directe du texte grec.
    reason: Préserver le signal de restauration textuelle transmis par le témoin public fourni.
lexical_decisions:
- source_word: ἀγάπη / love (witness)
  choice: L’amour
  rationale: Conserve la formulation collective et personnifiée du témoignage, tout en restant naturelle en français.
- source_word: ἀδελφοί / brethren (witness)
  choice: frères et sœurs
  rationale: Exprime le groupe communautaire mixte visé par le pluriel grec, sans limiter le propos aux hommes.
- source_word: διὰ Βούρρου / by the hand of Burrhus (witness)
  choice: par l’intermédiaire de Burrhus
  rationale: Rend l’idée d’intermédiaire ou de porteur sans reproduire littéralement un idiome anglais ancien.
- source_word: ἀνέπαυσεν / refreshed (witness)
  choice: a réconforté
  rationale: Reproduit l’idée de soulagement et d’encouragement dans un français courant et digne.
- source_word: διακονία / ministry-service (witness)
  choice: service de Dieu
  rationale: Évite de réduire le terme à une fonction ecclésiastique précise et garde son sens large de service.
- source_word: πρεσβυτέριον / presbytery (witness)
  choice: conseil des anciens
  rationale: Désigne clairement le corps collectif des presbytres dans un langage accessible.
- source_word: πάθος / passion (witness)
  choice: passion
  rationale: Terme traditionnel mais encore intelligible pour les souffrances et la mort du Christ.
- source_word: ὑπομονή / patience (witness)
  choice: persévérance
  rationale: Rend la constance endurante plutôt qu’une simple attente passive.
theological_decisions:
- issue: La résurrection dite corporelle et spirituelle
  choice: « sa résurrection, à la fois corporelle et spirituelle »
  alternative: « sa passion et sa résurrection, corporelles et spirituelles »
  rationale: Le témoignage anglais rattache grammaticalement cette qualification à la résurrection; la formulation retenue préserve cette lecture sans tenter d’en résoudre la tension théologique.
- issue: « dans l’unité de Dieu et de vous-mêmes »
  choice: « dans l’unité de Dieu et dans la vôtre »
  alternative: « dans l’unité avec Dieu et entre vous »
  rationale: Conserve l’ambiguïté du génitif transmise par le témoin au lieu d’expliciter une relation qui devra être vérifiée sur le grec.
- issue: Godly bishop
  choice: « votre évêque, homme attaché à Dieu »
  alternative: « votre évêque selon Dieu »
  rationale: Offre un français naturel sans attribuer à l’évêque une qualité divine ni imposer une définition confessionnelle de sa charge.
- issue: Divine grace shall requite him
  choice: « La grâce divine le récompensera »
  alternative: « Que la grâce divine le récompense »
  rationale: Respecte la valeur déclarative du témoin fourni, tout en signalant qu’une vérification du mode verbal grec demeure nécessaire.
translation_notes:
  register: Français international moderne, digne et lisible. Le vouvoiement pluriel est employé pour la communauté. Cette version reste provisoire, car le dossier fourni indique qu’une vérification directe de la tradition manuscrite grecque de la recension moyenne est encore nécessaire; les choix ont donc été établis avec prudence à partir du témoin anglais public et de la terminologie grecque probable.
