    Je salue votre évêque, homme attaché à Dieu, votre vénérable conseil des anciens, [et]ᵃ les diacres, mes compagnons de service, et vous tous, chacun en particulier et tous ensemble, au nom de Jésus-Christ, dans sa chair et son sang, dans sa passion et sa résurrection, à la fois corporelle et spirituelle, dans l’unité de Dieu et dans la vôtre. Que la grâce, la miséricorde, la paix et la persévérance soient toujours avec vous.'
