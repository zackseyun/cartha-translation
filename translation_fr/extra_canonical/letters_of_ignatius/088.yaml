review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement avec fidélité le témoin anglais fourni. La qualification « corporelle et spirituelle » reste rattachée à la résurrection, conformément à la syntaxe du témoin, sans résoudre son sens. En revanche, le [and] du témoin n’est pas rendu : « [a] » est un appel de note, non la conjonction textuellement signalée.'
  naturalness: Le français est globalement moderne et digne. « avec vos frères et sœurs d’Éphèse » est plus fluide que « de concert avec vos frères et sœurs d’Éphèse » dans cette phrase. « Miséricorde » est le correspondant usuel et précis de « mercy » dans une salutation chrétienne solennelle.
  terminology: « Conseil des anciens », « diacres » et « compagnons de service » sont recevables et n’imposent pas de structure confessionnelle. « Miséricorde » est préférable à « compassion » pour mercy. Le nom Burrhus et Troas sont conservés.
  issues:
  - severity: medium
    issue: Le signal textuel [and] est remplacé par le seul appel « [a] ».
    rationale: Le texte doit conserver la conjonction restaurée entre crochets, puis éventuellement y associer une note. L’appel de note seul efface un élément explicitement présent dans le témoin.
  - severity: low
    issue: « compassion » rend « mercy ».
    rationale: « Miséricorde » est plus directement fidèle au terme et correspond au registre traditionnel, sans être obscur en français moderne.
  - severity: low
    issue: « de concert avec » alourdit la relation de Burrhus aux Éphésiens.
    rationale: « avec vos frères et sœurs d’Éphèse » exprime plus naturellement l’association indiquée par le témoin.
