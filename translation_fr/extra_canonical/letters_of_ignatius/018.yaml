review_pass:
  verdict: revise
  source_fidelity: 'Le sens du témoin anglais est globalement conservé : l’onction du Seigneur, le souffle d’incorruptibilité sur l’Église, l’avertissement contre l’enseignement du « prince de ce monde », l’identification de la connaissance de Dieu à Jésus-Christ et le don de grâce envoyé par le Seigneur sont tous maintenus. La formulation révisée rend plus exactement et naturellement l’idée de captivité et de dépossession de la vie.'
  naturalness: « Emmener captifs » est compréhensible, mais moins idiomatique et moins énergique que « réduire en captivité ». « Dépouiller de la vie » restitue avec naturel le verbe « rob » dans ce contexte. « Recevoir l’onction d’un parfum sur la tête » est aussi plus français que « recevoir du parfum sur la tête », tout en préservant l’image.
  terminology: « Seigneur », « Église », « incorruptibilité », « prince de ce monde », « Jésus-Christ » et « don de grâce » conviennent au registre et maintiennent les termes théologiquement significatifs sans les interpréter. Aucune note n’est nécessaire.
  issues:
  - severity: low
    issue: Expression de la captivité
    rationale: « Ne vous emmène captifs » est moins naturel en français moderne et atténue légèrement l’idée d’asservissement/captation. « Ne vous réduise en captivité » est plus idiomatique et fidèle.
  - severity: low
    issue: Expression de l’onction initiale
    rationale: « A reçu du parfum sur la tête » est grammaticalement possible, mais « a reçu l’onction d’un parfum sur la tête » rend plus clairement l’acte rituel évoqué par le témoin, sans ajouter de sens.
  revised_text: 'C’est pour cette raison que le Seigneur a reçu l’onction d’un parfum sur la tête, afin d’insuffler l’incorruptibilité à l’Église. Ne vous laissez pas oindre de l’odeur infecte de l’enseignement du prince de ce monde, de peur qu’il ne vous réduise en captivité et ne vous dépouille de la vie placée devant vous.


    Pourquoi donc ne marchons-nous pas tous avec sagesse, en recevant la connaissance de Dieu, qui est Jésus-Christ ? Pourquoi périssons-nous dans notre folie, sans connaître le don de grâce que le Seigneur a véritablement envoyé ?'
  revised_footnotes: []
  revision_rationale: Révision limitée à deux formulations françaises. Elle améliore l’idiomaticité et la force du texte sans modifier ses images, son ambiguïté ni ses affirmations christologiques. Le dossier reposant sur un témoin anglais public-domain et non sur une vérification grecque directe, les choix restent nécessairement provisoires.
