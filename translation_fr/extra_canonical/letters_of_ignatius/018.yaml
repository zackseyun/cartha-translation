base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: fr
  text: 'C’est pour cette raison que le Seigneur a reçu du parfum sur la tête : afin d’insuffler l’incorruptibilité à l’Église. Ne vous laissez pas oindre de l’odeur infecte de l’enseignement du prince de ce monde, de peur qu’il ne vous emmène captifs et ne vous prive de la vie placée devant vous.


    Pourquoi donc ne marchons-nous pas tous avec sagesse, en recevant la connaissance de Dieu, qui est Jésus-Christ ? Pourquoi périssons-nous dans notre folie, sans connaître le don de grâce que le Seigneur a véritablement envoyé ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ointment
  choice: parfum
  rationale: « Parfum » restitue naturellement l’idée d’une substance aromatique versée sur la tête et permet de conserver le contraste olfactif avec l’« odeur infecte » de l’enseignement trompeur.
- source_word: breathe incorruption upon
  choice: insuffler l’incorruptibilité à
  rationale: Cette formulation conserve l’image forte du souffle communiqué à l’Église sans l’aplanir en une simple idée de transmission.
- source_word: ill odor
  choice: odeur infecte
  rationale: Expression actuelle et vigoureuse qui préserve l’opposition entre le parfum reçu par le Seigneur et l’odeur de l’enseignement du prince de ce monde.
- source_word: walk prudently
  choice: marcher avec sagesse
  rationale: Le verbe « marcher » maintient la métaphore traditionnelle de la conduite de vie, tandis que « avec sagesse » est clair en français moderne.
- source_word: gift of grace
  choice: don de grâce
  rationale: Conserve la proximité lexicale entre don et grâce sans réduire l’expression à un don particulier non précisé.
theological_decisions:
- issue: La connaissance de Dieu identifiée à Jésus-Christ
  choice: « la connaissance de Dieu, qui est Jésus-Christ »
  alternative: « la connaissance de Dieu qui vient par Jésus-Christ »
  rationale: Le témoin fourni formule une identification directe. La traduction la maintient afin de ne pas résoudre la tension christologique en relation instrumentale.
- issue: L’incorruptibilité communiquée à l’Église
  choice: Conserver « incorruptibilité »
  alternative: « immortalité » ou « vie impérissable »
  rationale: « Incorruptibilité » garde l’étendue possible de l’idée, qui peut viser à la fois l’absence de corruption, la victoire sur la mort et l’intégrité, sans imposer une seule interprétation.
- issue: Le Seigneur comme sujet de l’envoi final
  choice: « que le Seigneur a véritablement envoyé »
  alternative: Expliciter le référent ou remplacer « envoyé » par « accordé »
  rationale: La formulation conserve le verbe et l’ambiguïté du témoin disponible au lieu de préciser sans preuve ce qui est envoyé ou de modifier l’image.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores de l’onction, de l’odeur, du souffle et de la marche sont préservées. Le texte demeure provisoire puisque le dossier fourni repose sur un témoin anglais du domaine public et signale que la vérification directe du grec de la recension moyenne reste à effectuer.
