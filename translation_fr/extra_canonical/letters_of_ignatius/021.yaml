revisions:
- from: 'Si Jésus-Christ m’en juge digne grâce à votre prière, et si telle est la volonté de Dieu, je vous exposerai plus clairement, dans le second écrit que je compte vous adresser, le dessein[a] dont j’ai commencé à parler au sujet de l’homme nouveau, Jésus-Christ : la foi en lui et l’amour pour lui[b], sa souffrance et sa résurrection — surtout si le Seigneur me révèle quelque chose de plus.


    Rassemblez-vous tous dans la grâce, d’un commun accord, chacun personnellement[c], dans une seule foi et en un seul Jésus-Christ. Selon la chair, il est issu de la lignée de David ; il est Fils de l’homme et Fils de Dieu. Ainsi, vous obéirez à l’évêque et au collège des anciens sans avoir l’esprit partagé. Rompez un seul pain : il est remède d’immortalité, antidote destiné à nous empêcher de mourir, afin que nous vivions pour toujours en Jésus-Christ.


    [a] Le terme grec traditionnellement attesté ici peut désigner une « organisation », une « administration » ou un « dessein » divin.

    [b] Littéralement, la construction peut aussi se rendre par « sa foi et son amour ». Le contexte permet de comprendre la foi et l’amour dirigés vers Jésus-Christ, sans exclure complètement l’autre nuance.

    [c] L’expression associe paradoxalement l’idée d’être ensemble à celle de chaque personne prise individuellement.'
  to: 'Si Jésus-Christ m’en juge digne grâce à votre prière, et si telle est la volonté de Dieu, je vous exposerai plus clairement, dans le second écrit que je compte vous adresser, le dessein[a] dont j’ai commencé à parler : l’homme nouveau, Jésus-Christ, et ce qui le concerne, la foi en lui et l’amour pour lui[b], sa souffrance et sa résurrection — surtout si le Seigneur me révèle quelque chose.


    Rassemblez-vous tous ensemble, chacun individuellement[c], dans la grâce, dans une seule foi et en un seul Jésus-Christ, issu selon la chair de la lignée de David, Fils de l’homme et Fils de Dieu, afin que vous obéissiez sans avoir l’esprit partagé à l’évêque et au collège des anciens, en rompant un seul pain : il est le remède d’immortalité, l’antidote qui nous empêche de mourir et nous fait vivre pour toujours en Jésus-Christ.


    [a] Le terme grec traditionnellement attesté ici peut désigner une « organisation », une « administration » ou un « dessein » divin.


    [b] La construction peut aussi se comprendre comme « sa foi et son amour ». Le contexte permet de comprendre la foi et l’amour dirigés vers Jésus-Christ, sans exclure complètement l’autre nuance.


    [c] L’expression associe l’idée d’être réunis ensemble à celle de chaque personne prise individuellement.'
  rationale: La révision enlève les ajouts interprétatifs (« d’un commun accord », « de plus »), restitue la finalité de l’obéissance et le participe « en rompant », tout en préservant les ambiguïtés signalées par les notes. Elle conserve un français moderne, international et non confessionnellement surinterprétatif.
