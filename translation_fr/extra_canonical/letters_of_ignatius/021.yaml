base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: fr
  text: 'Si Jésus-Christ m’en juge digne grâce à votre prière, et si telle est la volonté de Dieu, je vous exposerai plus clairement, dans le second écrit que je compte vous adresser, le dessein[a] dont j’ai commencé à parler : l’homme nouveau, Jésus-Christ, et ce qui le concerne, la foi en lui et l’amour pour lui[b], sa souffrance et sa résurrection — surtout si le Seigneur me révèle quelque chose.


    Rassemblez-vous tous ensemble, chacun individuellement[c], dans la grâce, dans une seule foi et en un seul Jésus-Christ, issu selon la chair de la lignée de David, Fils de l’homme et Fils de Dieu, afin que vous obéissiez sans avoir l’esprit partagé à l’évêque et au collège des anciens, en rompant un seul pain : il est le remède d’immortalité, l’antidote qui nous empêche de mourir et nous fait vivre pour toujours en Jésus-Christ.


    [a] Le terme grec traditionnellement attesté ici peut désigner une « organisation », une « administration » ou un « dessein » divin.


    [b] La construction peut aussi se comprendre comme « sa foi et son amour ». Le contexte permet de comprendre la foi et l’amour dirigés vers Jésus-Christ, sans exclure complètement l’autre nuance.


    [c] L’expression associe l’idée d’être réunis ensemble à celle de chaque personne prise individuellement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traditionnellement attesté ici peut désigner une « organisation », une « administration » ou un « dessein » divin.
    reason: Signaler la largeur sémantique de οἰκονομία, que le seul mot « dessein » ne restitue pas entièrement.
  - marker: b
    text: La construction peut aussi se comprendre comme « sa foi et son amour ». Le contexte permet de comprendre la foi et l’amour dirigés vers Jésus-Christ, sans exclure complètement l’autre nuance.
    reason: Préserver l’ambiguïté grammaticale et théologique sans imposer une lecture unique.
  - marker: c
    text: L’expression associe l’idée d’être réunis ensemble à celle de chaque personne prise individuellement.
    reason: Rendre visible la tension de la formulation transmise, difficile à reproduire littéralement en français naturel.
lexical_decisions:
- source_word: οἰκονομία / “dispensation” dans le témoin fourni
  choice: dessein
  rationale: « Dessein » reste naturel en français moderne et conserve l’idée d’un agencement ou projet divin, tandis qu’« économie » serait opaque pour beaucoup de lecteurs. Une note signale l’étendue sémantique.
- source_word: πάθος / “passion”
  choice: souffrance
  rationale: Dans ce contexte christologique, le mot renvoie aux souffrances et à la mort de Jésus. « Souffrance » est immédiatement intelligible et évite le sens affectif moderne de « passion ».
- source_word: πρεσβυτέριον / “presbytery”
  choice: collège des anciens
  rationale: Cette expression désigne clairement le corps collectif des responsables appelés anciens, sans imposer le sens institutionnel moderne de « presbytère ».
- source_word: φάρμακον ἀθανασίας / “medicine of immortality”
  choice: remède d’immortalité
  rationale: La formulation garde la métaphore médicale forte et historiquement marquante du passage.
- source_word: ἀντίδοτος / “antidote”
  choice: antidote
  rationale: Le cognat français est naturel et conserve le parallélisme médical du texte.
theological_decisions:
- issue: Orientation de la foi et de l’amour dans la formule grecque avec pronom possessif
  choice: la foi en lui et l’amour pour lui
  alternative: sa foi et son amour
  rationale: Le témoin ancien anglais comprend ces réalités comme dirigées vers le Christ. Comme la construction peut aussi être possessive, cette possibilité est explicitement conservée en note plutôt que supprimée.
- issue: Portée sacramentelle de « rompre un seul pain » et « remède d’immortalité »
  choice: conserver les images sans les expliquer doctrinalement
  alternative: identifier explicitement le pain à l’eucharistie ou définir son mode d’efficacité
  rationale: Le passage emploie un langage ecclésial et médical très fort, mais ne développe pas ici une théorie sacramentelle. La traduction préserve cette tension sans ajouter une doctrine confessionnelle.
- issue: Titres christologiques
  choice: Fils de l’homme et Fils de Dieu
  alternative: fils d’homme et fils de Dieu
  rationale: Les majuscules reflètent l’emploi titulaire reçu dans ce contexte christologique, tout en gardant côte à côte l’humanité et la divinité affirmées par le texte.
- issue: Autorité ecclésiale
  choice: obéir à l’évêque et au collège des anciens
  alternative: obéir au surveillant et au presbytérium
  rationale: Les termes historiques usuels rendent les fonctions reconnaissables sans extrapoler leur forme institutionnelle ultérieure.
translation_notes:
  register: Français international actuel, digne et accessible. Les périodes longues ont été légèrement articulées pour la lisibilité, sans réduire la densité christologique ni les métaphores du passage. Le dossier fourni indique qu’une révision directe du grec reste à achever ; le présent projet tient donc compte du témoin anglais public fourni et des formulations grecques traditionnellement attestées, tout en signalant les principales ambiguïtés.
