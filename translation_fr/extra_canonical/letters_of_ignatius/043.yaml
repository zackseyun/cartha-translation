base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: fr
  text: 'J’ai beaucoup de pensées profondes en Dieu, mais je garde la mesure de moi-même, de peur de périr dans ma vantardise. Car maintenant, je dois craindre davantage encore et ne pas prêter attention à ceux qui voudraient me gonfler d’orgueil : ceux qui me tiennent de tels propos sont pour moi un fléau.


    Car, bien que je désire souffrir, je ne sais pas si j’en suis digne. La jalousie du diable échappe certes à beaucoup, mais contre moi elle mène une guerre d’autant plus acharnée. J’aspire donc à la douceur, par laquelle le prince de ce monde est réduit à néant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deep thoughts in God
  choice: pensées profondes en Dieu
  rationale: Conserve l’expression théologiquement dense et quelque peu inhabituelle du témoin, sans préciser indûment s’il s’agit de révélations, de méditations ou d’intelligence spirituelle.
- source_word: take the measure of myself
  choice: je garde la mesure de moi-même
  rationale: Maintient l’image de la mesure et l’idée de retenue personnelle, plutôt que de la remplacer entièrement par une explication.
- source_word: boasting
  choice: vantardise
  rationale: Exprime l’action de se glorifier avec une connotation négative naturelle en français, tout en évitant de surcharger le texte d’une terminologie paulinienne.
- source_word: puff me up
  choice: me gonfler d’orgueil
  rationale: Reproduit l’image d’enflure tout en explicitant son sens moral de façon idiomatique.
- source_word: scourge
  choice: fléau
  rationale: Préserve la force de l’image punitive sans trancher entre un fouet concret et une affliction figurée.
- source_word: envy of the devil
  choice: jalousie du diable
  rationale: « Jalousie » convient mieux que « envie » en français moderne pour une hostilité suscitée par le bien ou le statut d’autrui.
- source_word: gentleness
  choice: douceur
  rationale: Terme français digne et courant qui peut englober mansuétude, absence d’agressivité et humble maîtrise de soi.
- source_word: prince of this world
  choice: prince de ce monde
  rationale: Conserve le titre traditionnel et sa résonance johannique sans l’interpréter davantage.
- source_word: brought to nought
  choice: réduit à néant
  rationale: Rend avec force l’idée d’annulation ou de mise hors d’action, sans affirmer nécessairement une destruction ontologique.
theological_decisions:
- issue: Nature des « pensées profondes en Dieu »
  choice: Formulation laissée ouverte
  alternative: « une profonde connaissance des choses de Dieu »
  rationale: Le témoin ne permet pas de déterminer avec certitude s’il est question de révélations, de connaissance doctrinale ou de méditations spirituelles.
- issue: Dignité à souffrir
  choice: « je ne sais pas si j’en suis digne »
  alternative: « je ne sais pas si j’en suis capable »
  rationale: Le langage de dignité préserve la tension entre le désir du martyre et l’humilité d’Ignace; une formulation en termes de capacité modifierait cette nuance.
- issue: Effet de la douceur sur le prince de ce monde
  choice: « par laquelle […] est réduit à néant »
  alternative: « grâce à laquelle […] est vaincu »
  rationale: La traduction retenue conserve la formulation absolue du témoin tout en laissant ouverte la nature exacte de cette neutralisation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le mouvement exhortatif et l’intensité ascétique du passage. Projet provisoire fondé sur le témoin anglais public fourni, la révision directe du grec de la recension moyenne restant à effectuer.
