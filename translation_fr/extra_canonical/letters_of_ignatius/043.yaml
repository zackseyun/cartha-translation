source:
  text: 'I have many deep thoughts in God: but I take the measure of myself, lest I perish in my boasting. For now I ought to be the more afraid and not to give heed to those that would puff me up: for they that say these things to me are a scourge to me.


    For though I desire to suffer, yet I know not whether I am worthy: for the envy of the devil is unseen indeed by many, but against me it wages the fiercer war. So then I crave gentleness, whereby the prince of this world is brought to nought.'
