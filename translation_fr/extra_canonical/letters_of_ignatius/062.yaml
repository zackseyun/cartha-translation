base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: fr
  text: 'Souvenez-vous dans vos prières de l’Église qui est en Syrie et qui, à ma place, a Dieu pour berger. Jésus-Christ seul, ainsi que votre amour, sera son évêque.


    Quant à moi, j’ai honte d’être appelé l’un des leurs, car je n’en suis pas digne : je suis le tout dernier d’entre eux, un avorton[a]. Mais il m’a été fait miséricorde afin que je devienne quelqu’un, si toutefois j’atteins Dieu.


    Mon esprit vous salue, ainsi que l’amour des Églises qui m’ont accueilli au nom de Jésus-Christ, non comme un simple voyageur. En effet, même celles qui ne se trouvaient pas sur mon itinéraire selon la chair[b] m’ont précédé de ville en ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme est une image d’auto-humiliation : il évoque une naissance anormale ou non viable, sans viser ici une désignation médicale précise.'
    reason: Évite que « avorton », nécessaire pour rendre la force de l’image, soit compris dans un sens médical étroit ou comme une injure adressée à autrui.
  - marker: b
    text: « Selon la chair » désigne ici son trajet matériel, c’est-à-dire l’itinéraire effectivement suivi pendant son voyage.
    reason: L’expression littérale peut sembler obscure en français moderne, mais elle mérite d’être conservée en raison de sa portée rhétorique.
lexical_decisions:
- source_word: shepherd
  choice: berger
  rationale: Conserve l’image pastorale et son contraste avec « évêque », sans réduire les deux termes à une même fonction.
- source_word: bishop
  choice: évêque
  rationale: Rend le titre ecclésial traditionnel dans un français courant et historiquement approprié.
- source_word: untimely birth
  choice: comme un enfant né hors terme
  rationale: Préserve la métaphore de la naissance anormale ou prématurée sans imposer plus de précision que le témoin disponible.
- source_word: attain unto God
  choice: j’atteins Dieu
  rationale: Maintient la formulation forte et ouverte d’Ignace, qui évoque l’aboutissement auprès de Dieu sans explicitation doctrinale.
- source_word: according to the flesh
  choice: selon la chair
  rationale: Conserve l’expression ancienne et son contraste implicite avec une autre forme de proximité ou de parcours.
- source_word: went before me
  choice: m’ont précédé
  rationale: Respecte le mouvement exprimé par le témoin, sans préciser indûment la manière dont ces Églises l’ont devancé.
theological_decisions:
- issue: Rapport entre Dieu, Jésus-Christ et l’amour des destinataires dans la conduite de l’Église de Syrie
  choice: « a Dieu pour berger » et « Jésus-Christ seul sera son évêque — lui, avec votre amour »
  alternative: Reformuler « votre amour » comme l’action concrète ou la sollicitude des Romains
  rationale: La syntaxe transmise est inhabituelle et théologiquement dense. La traduction conserve cette tension sans transformer « votre amour » en office ecclésial ni résoudre artificiellement son lien avec Jésus-Christ.
- issue: Sens de l’accès à Dieu
  choice: « si toutefois j’atteins Dieu »
  alternative: « si je parviens auprès de Dieu » ou « si j’arrive jusqu’à Dieu »
  rationale: La formulation retenue garde la concision et l’intensité du texte, sans définir si l’expression vise principalement le martyre, le salut final ou l’union avec Dieu.
- issue: Auto-désignation comme naissance hors terme
  choice: Conserver la métaphore
  alternative: Paraphraser par « né trop tard » ou « avorton »
  rationale: La métaphore biblique et rhétorique doit rester perceptible; une paraphrase temporelle ou un terme fortement péjoratif fermerait le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en trois paragraphes et les images pastorales, natales et corporelles sont conservées. Comme la révision directe du grec est signalée comme encore en attente, le texte reste explicitement prudent aux endroits où le témoin anglais laisse subsister une ambiguïté.
