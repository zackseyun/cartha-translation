review_pass:
  verdict: revise
  source_fidelity: Une correction est nécessaire. Le grec de la recension moyenne exprime l’accueil de l’envoyé « comme [l’on accueillerait] celui-là même qui l’a envoyé » et situe sa charge dans la maisonnée propre du maître. « Administrer sa propre maison » risque au contraire d’attribuer la maison à l’envoyé. Le rendu direct de φοβείσθω doit aussi conserver « craindre », dont la portée peut être révérencielle sans être réduite à un simple respect.
  naturalness: Le français est globalement clair et d’un registre approprié. « Le craindre d’autant plus » est à la fois plus exact et naturel dans ce contexte ancien. « Le bon ordre qui règne parmi vous en Dieu » rend plus idiomatiquement l’idée collective d’εὐταξία. La dernière phrase est formulée de manière à ne pas trancher indûment le rattachement de « dans la vérité ».
  terminology: « Évêque », « Seigneur », « hérésie » et « Jésus-Christ » sont maintenus. « Maître de maison » convient pour οἰκοδεσπότης; « gérer sa propre maisonnée » explicite que la maisonnée est celle du maître. La note sur la crainte et celle sur la dernière proposition préservent les ambiguïtés pertinentes.
  issues:
  - severity: medium
    issue: « administrer sa propre maison »
    rationale: Cette formulation peut signifier que la maison appartient à la personne envoyée. Le grec ἐν ἰδίᾳ οἰκονομίᾳ renvoie à la charge/administration propre du maître de maison dans l’image développée par la phrase.
  - severity: medium
    issue: « comme celui qui l’a envoyée »
    rationale: Le texte souligne « celui-là même qui l’a envoyé » (αὐτὸν τὸν πέμψαντα). L’ajout de « même » restitue l’emphase sans développer une doctrine de représentation.
  - severity: low
    issue: « respecter avec crainte »
    rationale: La formule interprète φοβείσθω en atténuant « craindre ». Une traduction directe, assortie d’une note sur la crainte révérencielle possible, respecte mieux le texte.
  - severity: low
    issue: Note b actuelle
    rationale: Elle décrit surtout la comparaison portant sur l’accueil de l’envoyé, tandis que la phrase annotée porte directement sur la manière de considérer l’évêque. La note est reformulée pour viser l’intensité rhétorique sans déplacer la référence.
  revised_text: 'Et plus quelqu’un voit que l’évêque garde le silence, plus il doit le craindre.[a] Car toute personne que le maître de maison envoie pour gérer sa propre maisonnée, nous devons l’accueillir comme celui-là même qui l’a envoyée. Il est donc clair que nous devons considérer l’évêque comme le Seigneur lui-même.[b]


    Or Onésime loue vivement, de son propre chef, le bon ordre qui règne parmi vous en Dieu : vous vivez tous selon la vérité, et aucune hérésie ne demeure parmi vous. Vous n’écoutez même personne qui parle d’autre chose que de Jésus-Christ dans la vérité.[c]'
  revised_footnotes:
  - marker: a
    text: 'Ou, avec une nuance interprétative : « plus il doit le respecter avec crainte ». Le verbe peut exprimer la crainte ou une crainte révérencielle; la traduction conserve le terme direct « craindre ».'
    reason: Préserver la portée de φοβείσθω sans réduire le mot à la seule peur ni au seul respect.
  - marker: b
    text: 'La formulation est volontairement très forte : « comme le Seigneur lui-même ». Le passage ne fournit pas ici d’explication supplémentaire de cette comparaison.'
    reason: Conserver la force rhétorique du texte sans lui imposer une explication doctrinale.
  - marker: c
    text: 'La construction grecque permet aussi de comprendre : « personne qui parle, dans la vérité, en dehors de Jésus-Christ » ou « personne qui parle autrement que selon la vérité au sujet de Jésus-Christ ».'
    reason: 'Préserver l’ambiguïté syntaxique concernant le rattachement de « dans la vérité ». '
  revision_rationale: La révision corrige l’attribution potentiellement erronée de la maisonnée et restitue l’emphase de l’identification de l’envoyé avec son expéditeur dans l’acte d’accueil. Elle privilégie ensuite des formulations françaises modernes tout en maintenant les termes forts et les ambiguïtés du passage, notamment pour « craindre » et « dans la vérité ».
