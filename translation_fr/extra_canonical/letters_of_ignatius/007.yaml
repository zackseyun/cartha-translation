base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: fr
  text: 'Et plus on voit que l’évêque garde le silence, plus on doit le respecter avec crainte.[a] Car toute personne que le maître de maison envoie pour administrer sa propre maison, nous devons la recevoir comme celui qui l’a envoyée. Il est donc clair que nous devons considérer l’évêque comme le Seigneur lui-même.[b]


    Or Onésime loue vivement, de sa propre initiative, votre conduite ordonnée en Dieu : vous vivez tous selon la vérité, et aucune hérésie ne trouve place parmi vous. Bien plus, vous n’écoutez même pas quelqu’un s’il parle d’autre chose que de Jésus-Christ dans la vérité.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se traduire plus littéralement : « plus on doit le craindre ». Elle peut désigner une crainte révérencielle, sans exclure la force du mot « crainte ».'
    reason: Préserver l’étendue sémantique signalée par le témoin anglais et vraisemblable dans le grec.
  - marker: b
    text: 'Littéralement : « comme le Seigneur lui-même ». Le texte établit une comparaison quant à l’accueil dû à l’envoyé; il n’en donne pas ici d’explication supplémentaire.'
    reason: Éviter de résoudre théologiquement une comparaison particulièrement forte.
  - marker: c
    text: 'La fin peut aussi être comprise : « s’il parle de quelque chose en dehors de Jésus-Christ, [qui est] dans la vérité » ou « s’il parle autrement que selon la vérité au sujet de Jésus-Christ ».'
    reason: Signaler l’ambiguïté de rattachement de « dans la vérité ».
lexical_decisions:
- source_word: σιγῶντα (reconstructed from the Middle-recension Greek tradition)
  choice: garde le silence
  rationale: Conserve l’image du silence de l’évêque sans l’interpréter comme réserve, douceur ou absence d’enseignement.
- source_word: φοβείσθω (reconstructed)
  choice: respecter avec crainte
  rationale: Le verbe peut exprimer la crainte aussi bien que le respect révérenciel. La formulation française maintient cette tension tout en restant naturelle.
- source_word: οἰκονόμον (reconstructed)
  choice: administrer
  rationale: Rend la fonction de l’intendant chargé de la maison, plutôt qu’un simple service domestique.
- source_word: εὐταξίαν (reconstructed)
  choice: conduite ordonnée
  rationale: Préserve l’idée d’ordre collectif et moral sans imposer un sens institutionnel précis.
- source_word: αἵρεσις (reconstructed)
  choice: hérésie
  rationale: Terme traditionnel et intelligible ici pour un enseignement déviant; la phrase suivante en précise le contenu christologique.
theological_decisions:
- issue: Comparaison de l’accueil de l’évêque avec celui du Seigneur
  choice: « considérer l’évêque comme le Seigneur lui-même »
  alternative: « regarder l’évêque comme représentant le Seigneur »
  rationale: La formulation forte du témoin est conservée sans ajouter la notion explicative de représentation, absente de la phrase transmise.
- issue: Portée de « craindre » l’évêque silencieux
  choice: « respecter avec crainte »
  alternative: « le craindre davantage »
  rationale: Cette solution garde la dimension de crainte révérencielle sans réduire le propos à la peur, mais une note signale l’ambivalence.
- issue: Objet exclusif de l’écoute
  choice: « s’il parle d’autre chose que de Jésus-Christ dans la vérité »
  alternative: « s’il ne parle pas véritablement de Jésus-Christ »
  rationale: Le choix maintient l’ambiguïté syntaxique entre le contenu du discours et sa conformité à la vérité.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif archaïque est évité. Comme la révision directe du grec est indiquée comme encore en attente dans les données fournies, les décisions lexicales fondées sur des formes grecques reconstruites à partir de la tradition moyenne restent provisoires; le texte suit étroitement le témoin public fourni tout en recherchant une syntaxe française naturelle.
