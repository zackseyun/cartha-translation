source:
  text: 'And in proportion as a man seeth that his bishop is silent, let him fear him the more. For every one whom the Master of the household sendeth to be steward over His own house, we ought so to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
