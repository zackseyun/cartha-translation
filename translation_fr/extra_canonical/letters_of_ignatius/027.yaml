review_pass:
  verdict: revise
  source_fidelity: Le projet suit globalement le témoin anglais et conserve les ambiguïtés institutionnelles et normatives. Toutefois, « sans cesse » ajoute une idée de fréquence absente du témoin, et « réellement » renforce légèrement l’opposition au-delà de « être tels / être chrétiens ». La révision supprime ces ajouts.
  naturalness: Le français est clair et de registre approprié. « Être appelés chrétiens, mais être tels » est rendu plus naturellement par « ne pas seulement être appelés chrétiens, mais l’être aussi ». « Sans lui » est plus direct et idiomatique que « indépendamment de lui » tout en gardant le sens de conduite dissociée.
  terminology: « Évêque », « bonne conscience », « légitimement » et « le commandement » sont conservés. Le singulier non identifié de « le commandement » préserve l’ambiguïté du témoin. La note provisoire est maintenue et son ancre reste correctement placée.
  issues:
  - severity: medium
    issue: Ajout de « sans cesse »
    rationale: Le témoin dit seulement que certaines personnes ont le nom de l’évêque « sur les lèvres »; il n’exprime pas explicitement une répétition continuelle.
  - severity: low
    issue: Renforcement par « réellement »
    rationale: Le contraste porte sur être appelés chrétiens et l’être; « réellement » est interprétatif et n’est pas nécessaire à un français naturel.
  - severity: low
    issue: « indépendamment de lui » peut suggérer une autonomie de principe
    rationale: « Sans lui » rend plus sobrement l’action accomplie à l’écart de l’évêque, sans préciser la nature de cette dissociation.
  revised_text: Il convient donc que nous ne soyons pas seulement appelés chrétiens, mais que nous le soyons aussi. Certains ont le nom de l’évêque sur les lèvres, mais agissent en tout sans lui. De telles personnes ne me paraissent pas garder une bonne conscience, puisqu’elles ne se réunissent pas légitimement, conformément au commandement.[a]
  revised_footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais du domaine public fourni. Une vérification directe du texte grec de la recension moyenne reste nécessaire, notamment pour les nuances de « légitimement » et de « commandement ».
    reason: Le dossier indique explicitement que l’examen direct de la langue source est encore en attente; la note signale honnêtement le statut provisoire du texte.
  revision_rationale: La révision retire deux intensifications non exigées par le témoin (« sans cesse », « réellement ») et emploie « sans lui », formulation moderne qui maintient l’ambiguïté de la conduite « à part » de l’évêque. Le reste du texte, y compris l’ancre de note et le caractère non spécifié du commandement, est conservé.
