base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: fr
  text: Il convient donc que nous ne nous contentions pas de porter le nom de chrétiens, mais que nous le soyons réellement. Certains, en effet, ont sans cesse le nom de l’évêque aux lèvres, mais agissent en tout indépendamment de lui. De telles personnes ne me paraissent pas garder une bonne conscience, puisqu’elles ne se réunissent pas de manière légitime, conformément au commandement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais du domaine public fourni. Une vérification directe du texte grec de la recension moyenne reste nécessaire, notamment pour les nuances de « légitimement » et de « commandement ».
    reason: Le dossier indique explicitement que l’examen de la langue source est encore en attente; la note signale honnêtement le statut provisoire du texte.
lexical_decisions:
- source_word: be called Christians / be such
  choice: porter le nom de chrétiens / le soyons réellement
  rationale: Cette formulation naturelle en français conserve le contraste entre l’appellation chrétienne et la réalité vécue.
- source_word: have the bishop's name on their lips
  choice: ont sans cesse le nom de l’évêque aux lèvres
  rationale: L’expression imagée du témoin est préservée tout en explicitant son caractère verbal et habituel.
- source_word: act apart from him
  choice: agissent en tout indépendamment de lui
  rationale: « Indépendamment de lui » rend l’idée d’une conduite séparée de l’évêque sans préciser davantage la nature de cette séparation.
- source_word: keep a good conscience
  choice: garder une bonne conscience
  rationale: Rendu formel et intelligible qui conserve le vocabulaire moral du témoin.
- source_word: assemble themselves together lawfully
  choice: se réunissent pas de manière légitime
  rationale: Cette traduction garde la notion de conformité à l’ordre reconnu, sans réduire « lawfully » au droit civil.
- source_word: according to commandment
  choice: conformément au commandement
  rationale: Le singulier et l’absence de complément sont conservés afin de ne pas identifier implicitement le commandement visé.
theological_decisions:
- issue: Rapport à l’évêque
  choice: agissent en tout indépendamment de lui
  alternative: agissent en tout sans lui
  rationale: Le choix retenu maintient la critique d’une conduite dissociée de l’évêque sans introduire une théorie ecclésiologique plus précise que le témoin fourni.
- issue: Identification du commandement
  choice: le commandement
  alternative: ce qui a été prescrit
  rationale: La formulation conserve l’ambiguïté du témoin quant à l’origine et au contenu exacts du commandement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre porter le nom de chrétien et l’être réellement est mis en relief. La syntaxe reste proche du témoin ancien sans devenir archaïque; aucune précision confessionnelle n’est ajoutée.
