base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: fr
  text: 'Car je ne veux pas que vous cherchiez à plaire aux hommes, mais à Dieu, comme d’ailleurs vous lui plaisez. En effet, jamais je ne trouverai moi-même une occasion pareille d’atteindre Dieu ; et vous non plus, si vous gardez le silence, ne pourrez vous acquitter d’aucune tâche plus noble. Car, si vous gardez le silence et me laissez seul, je suis une parole de Dieu[a] ; mais si vous désirez ma chair, je ne serai de nouveau qu’un simple cri.



    Non, je vous demande seulement de me laisser être versé en libation pour Dieu, tandis qu’un autel est encore prêt, afin que, devenus un chœur dans l’amour, vous chantiez au Père en Jésus-Christ, parce que Dieu a bien voulu que l’évêque de Syrie soit trouvé en Occident, l’ayant appelé de l’Orient. Il est bon pour moi de me coucher loin du monde, vers Dieu, afin de me lever vers lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Une parole de Dieu » s’oppose ici à « un simple cri » : si les destinataires n’interviennent pas, la mort d’Ignace devient un message ; s’ils cherchent à préserver sa vie corporelle, elle risque de n’être qu’une protestation sans accomplissement.'
    reason: La note éclaire le contraste rhétorique sans transformer « parole » en titre christologique.
  - marker: b
    text: 'L’auteur emploie l’image du coucher puis du lever : il souhaite quitter le monde pour se lever vers Dieu. Cette formulation conserve l’imagerie sans la réduire à une définition doctrinale plus précise.'
    reason: La note explicite l’opposition imagée préservée dans le texte, sans imposer une interprétation confessionnelle.
lexical_decisions:
- source_word: men-pleasers / please God
  choice: chercher à plaire aux hommes / plaire à Dieu
  rationale: Cette formulation naturelle conserve l’opposition morale explicite du témoin sans transformer « hommes » en un groupe particulier.
- source_word: attain unto God
  choice: atteindre Dieu
  rationale: Le choix maintient le mouvement spirituel exprimé par le témoin sans préciser davantage la nature de cette union ou de cet accomplissement.
- source_word: a word of God / a mere cry
  choice: une parole de Dieu / un simple cri
  rationale: La traduction préserve le contraste saisissant entre une parole porteuse de sens et un cri, sans identifier « parole » au titre christologique « la Parole ».
- source_word: poured out a libation
  choice: répandu en libation
  rationale: Le vocabulaire sacrificiel est conservé, malgré son caractère imagé, avec une tournure compréhensible en français moderne.
- source_word: forming yourselves into a chorus
  choice: formant dans l’amour un chœur
  rationale: L’image collective et liturgique du chœur demeure visible sans l’aplatir en simple chant communautaire.
- source_word: set from the world / rise unto him
  choice: disparaître de ce monde pour aller vers Dieu / me lever en lui
  rationale: Cette formulation conserve le mouvement de disparition puis de lever, tout en rendant la phrase intelligible. Une note signale que l’image exacte demande confirmation par examen direct du grec.
theological_decisions:
- issue: Le désir d’Ignace d’atteindre Dieu par son martyre
  choice: atteindre Dieu
  alternative: rejoindre Dieu
  rationale: « Atteindre » suit de près le témoin et préserve la tension théologique sans expliquer le mécanisme ni assimiler automatiquement le martyre au salut.
- issue: L’expression « une parole de Dieu »
  choice: 'article indéfini et nom commun : « une parole de Dieu »'
  alternative: « la Parole de Dieu »
  rationale: L’article défini et la majuscule auraient pu suggérer une identification christologique que le passage, tel qu’attesté ici, ne requiert pas.
- issue: L’imagerie sacrificielle de la libation et de l’autel
  choice: conserver littéralement les deux images
  alternative: paraphraser par « offrir ma vie à Dieu »
  rationale: La paraphrase effacerait le lien interne entre la libation, l’autel et la mort attendue d’Ignace.
- issue: Le mouvement final vers Dieu
  choice: « afin que je me lève en lui »
  alternative: « afin que je ressuscite auprès de lui »
  rationale: Le terme « ressuscite » résoudrait trop vite l’image en une affirmation doctrinale précise ; « me lève » maintient sa polyvalence poétique.
translation_notes:
  register: Français international moderne, digne et accessible. Les périodes ont été légèrement allégées, mais les répétitions (« garder le silence », « Dieu ») et les images fortes ont été conservées. Le brouillon reste provisoire, car le dossier fourni indique qu’un examen direct du grec de la recension moyenne est encore attendu.
