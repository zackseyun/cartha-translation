revisions:
- from: 'Car je ne veux pas que vous cherchiez à plaire aux hommes, mais à Dieu, comme d’ailleurs vous lui plaisez. En effet, jamais je ne trouverai moi-même une occasion pareille d’atteindre Dieu ; et vous non plus, si vous gardez le silence, ne pourrez être crédités d’aucune œuvre plus noble. Car, si vous gardez le silence et me laissez seul, je suis une parole de Dieu[a] ; mais si vous désirez ma chair, je ne serai de nouveau qu’un simple cri.


    Non, ne m’accordez rien de plus que d’être répandu en libation pour Dieu, tandis qu’un autel est encore prêt. Ainsi, formant dans l’amour un chœur, vous pourrez chanter au Père en Jésus-Christ, parce que Dieu a bien voulu que l’évêque venu de Syrie se trouve en Occident, après l’avoir appelé de l’Orient. Il est bon de disparaître de ce monde pour aller vers Dieu, afin que je me lève en lui[b].'
  to: 'Car je ne veux pas que vous cherchiez à plaire aux hommes, mais à Dieu, comme d’ailleurs vous lui plaisez. En effet, jamais je ne trouverai moi-même une occasion pareille d’atteindre Dieu ; et vous non plus, si vous gardez le silence, ne pourrez vous acquitter d’aucune tâche plus noble. Car, si vous gardez le silence et me laissez seul, je suis une parole de Dieu[a] ; mais si vous désirez ma chair, je ne serai de nouveau qu’un simple cri.



    Non, je vous demande seulement de me laisser être versé en libation pour Dieu, tandis qu’un autel est encore prêt, afin que, devenus un chœur dans l’amour, vous chantiez au Père en Jésus-Christ, parce que Dieu a bien voulu que l’évêque de Syrie soit trouvé en Occident, l’ayant appelé de l’Orient. Il est bon pour moi de me coucher loin du monde, vers Dieu, afin de me lever vers lui[b].'
  rationale: 'La révision rétablit les images structurantes du passage, notamment le coucher hors du monde et le lever vers Dieu, tout en améliorant plusieurs tournures françaises. Elle maintient les ambiguïtés théologiques et rhétoriques : « atteindre Dieu », « une parole de Dieu », la libation et le langage du lever ne sont pas paraphrasés en formulations doctrinales explicatives. Les deux appels de note restent correctement ancrés après les expressions qu’ils éclairent.'
