base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: fr
  text: 'Ignace, appelé aussi Théophore, à l’Église d’Éphèse [en Asie][a], comblée de bénédictions dans la grandeur, par la plénitude de Dieu le Père, destinée d’avance, avant les siècles, à demeurer pour toujours dans une gloire stable et immuable, unie et choisie dans une passion véritable, selon la volonté du Père et de Jésus-Christ notre Dieu, digne de toute félicitation : salutations abondantes en Jésus-Christ et dans une joie irréprochable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « en Asie » sont signalés comme une restitution dans le témoin anglais fourni; leur présence dans la tradition grecque devra être vérifiée lors de la révision directe du texte source.
    reason: Préserver visiblement le signal critique entre crochets du témoin de travail, puisque la révision grecque directe est encore en attente.
lexical_decisions:
- source_word: Ἰγνάτιος, ὁ καὶ Θεοφόρος
  choice: Ignace, appelé aussi Théophore
  rationale: Le nom ou titre grec est conservé sans trancher entre ses sens possibles (« porteur de Dieu » ou « porté par Dieu »).
- source_word: τῇ εὐλογημένῃ ἐν μεγέθει
  choice: comblée de bénédictions dans la grandeur
  rationale: Cette formulation garde le lien inhabituel entre bénédiction et grandeur sans préciser artificiellement à qui appartient la grandeur.
- source_word: ἐν πληρώματι θεοῦ πατρός
  choice: par la plénitude de Dieu le Père
  rationale: « Plénitude » conserve le poids théologique de πληρώμα et la relation instrumentale ou circonstancielle suggérée par le contexte.
- source_word: προωρισμένῃ πρὸ αἰώνων
  choice: destinée d’avance, avant les siècles
  rationale: Rendu formel qui préserve l’antériorité et évite d’introduire une terminologie confessionnelle plus chargée.
- source_word: ἐν πάθει ἀληθινῷ
  choice: dans une passion véritable
  rationale: « Passion » est retenu au sens de souffrance subie, vraisemblablement celle du Christ, tout en maintenant la formulation condensée et son ambiguïté syntaxique.
- source_word: ἀξιομακαρίστῳ
  choice: digne de toute félicitation
  rationale: Expression solennelle qui rend l’idée d’être hautement digne d’être déclarée heureuse ou bénie.
- source_word: πλεῖστα χαίρειν
  choice: salutations abondantes
  rationale: Adaptation idiomatique de la formule épistolaire grecque tout en conservant son intensification.
- source_word: ἐν ἀμώμῳ χαρᾷ
  choice: dans une joie irréprochable
  rationale: « Irréprochable » rend le caractère sans défaut ou sans reproche exprimé par ἄμωμος.
theological_decisions:
- issue: Désignation de Jésus-Christ comme Dieu
  choice: Jésus-Christ notre Dieu
  alternative: notre Dieu et Jésus-Christ
  rationale: La construction transmise par le témoin associe directement « notre Dieu » à Jésus-Christ; la traduction conserve cette christologie explicite sans l’atténuer.
- issue: Référent de la « passion véritable »
  choice: Maintenir « dans une passion véritable » sans explicitation
  alternative: unie et choisie par la véritable passion du Christ
  rationale: Le référent christologique est probable, mais l’ajout « du Christ » et la valeur instrumentale de « par » résoudraient une ambiguïté que le texte condensé laisse ouverte.
- issue: Accord des participes et destinataire ecclésial
  choice: Les qualificatifs décrivent l’Église d’Éphèse
  alternative: Les rattacher à une personnification féminine distincte
  rationale: Le féminin grammatical et la forme de l’adresse indiquent que l’Église, personnifiée, est la destinataire de l’ensemble des qualificatifs.
translation_notes:
  register: Français international moderne, solennel mais lisible. La longue période de la suscription antique est conservée, avec une ponctuation qui en clarifie la progression. Projet provisoire fondé sur le témoin anglais public fourni; une collation directe avec la tradition grecque de la recension moyenne reste nécessaire.
