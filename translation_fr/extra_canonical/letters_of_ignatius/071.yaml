base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: fr
  text: 'En effet, même si certaines personnes voulaient me tromper selon la chair, l’Esprit ne se laisse pas tromper, puisqu’il vient de Dieu. Car il sait d’où il vient et où il va, et il sonde ce qui est caché. Lorsque j’étais parmi vous, je me suis écrié, j’ai parlé d’une voix forte, avec la voix de Dieu : « Soyez attentifs à l’évêque, au conseil des anciens[a] et aux diacres. »


    Cependant, certains ont soupçonné que j’avais dit cela parce que je connaissais d’avance la division de quelques-uns. Mais celui en qui je suis enchaîné m’est témoin que je ne l’ai appris d’aucun être humain[b]. C’est l’Esprit qui l’a proclamé en ces termes : « Ne faites rien sans l’évêque. Gardez votre corps comme un temple de Dieu. Cultivez l’unité. Fuyez les divisions. Imitez Jésus-Christ, comme lui-même a imité son Père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au presbytérium », c’est-à-dire au collège des presbytres ou anciens.'
    reason: Le terme institutionnel grec sous-jacent n’a pas d’équivalent français courant parfaitement univoque.
  - marker: b
    text: 'Littéralement : « de la chair d’un homme ».'
    reason: La tournure sémitisante ou biblique du témoin est préservée en note, tandis que le texte principal emploie un français naturel.
lexical_decisions:
- source_word: spirit
  choice: l’Esprit
  rationale: Le contexte présente cet esprit comme venant de Dieu, sondant les réalités cachées et proclamant un message; la majuscule indique naturellement l’Esprit de Dieu sans développer davantage l’interprétation.
- source_word: presbytery
  choice: conseil des anciens
  rationale: Rend le groupe collégial des presbytres dans un français courant, tout en évitant le terme moderne « presbytère », qui désigne habituellement une habitation.
- source_word: keep your flesh
  choice: Gardez votre corps
  rationale: « Chair » serait formellement plus proche, mais « votre corps comme un temple » exprime ici plus clairement le sens concret en français moderne.
- source_word: cherish union
  choice: Cultivez l’unité
  rationale: Formulation naturelle qui conserve l’exhortation positive à entretenir activement la concorde communautaire.
- source_word: imitators
  choice: Imitez
  rationale: L’impératif verbal est plus direct et idiomatique que « soyez des imitateurs », sans perte de sens.
theological_decisions:
- issue: Référent de « spirit »
  choice: « l’Esprit » avec une majuscule
  alternative: « l’esprit » avec une minuscule, compris comme l’esprit humain d’Ignace
  rationale: La provenance divine, la connaissance des choses cachées et la proclamation ultérieure favorisent une référence à l’Esprit de Dieu, tout en laissant le discours d’Ignace porter l’affirmation.
- issue: « avec la voix de Dieu »
  choice: Conserver l’affirmation forte et littérale
  alternative: Atténuer en « sous l’inspiration de Dieu »
  rationale: Le témoin fourni attribue explicitement la voix à Dieu; l’atténuer résoudrait ou réduirait une tension théologique présente dans le texte.
- issue: Relation du Christ au Père dans l’imitation
  choice: « comme lui-même a imité son Père »
  alternative: « comme lui-même l’a été de son Père » ou « comme lui-même suivait son Père »
  rationale: La construction comparative porte naturellement sur l’imitation. La traduction conserve cette relation sans lui ajouter une explication christologique.
- issue: Autorité de l’évêque et des ministres
  choice: Traduire directement les impératifs sans les élargir
  alternative: Ajouter une notion d’obéissance absolue ou sacramentelle
  rationale: Le passage demande attention et action concertée avec l’évêque; aucune précision confessionnelle supplémentaire ne doit être importée.
translation_notes:
  register: 'Français international moderne, digne et accessible. La structure rhétorique et les impératifs sont conservés, avec une ponctuation clarifiant les paroles rapportées. Projet nécessairement provisoire : le dossier fourni indique que la révision directe du grec de la recension moyenne reste à effectuer; les choix présents s’appuient donc sur le témoin anglais public fourni et sur les indices lexicaux qu’il transmet.'
