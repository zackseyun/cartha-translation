  terminology: « L’Esprit », « évêque », « diacres » et « conseil des anciens » sont cohérents. « Corps » pour « chair » dans l’exhortation au temple est une explicitation modérée et idiomatique; la « chair d’un homme » du passage suivant reste dûment documentée en note. Les ancres de notes sont correctement placées et les notes correspondent aux expressions annotées.
