source:
  text: 'For even though certain persons desired to deceive me after the flesh, yet the spirit is not deceived, being from God; for it knoweth whence it cometh and whence it goeth, and it searcheth out the hidden things. I cried out, when I was among you; I spake with a loud voice, with God''s own voice, Give ye heed to the bishop and the presbytery and deacons.


    Howbeit there were those who suspected me of saying this, because I knew beforehand of the division of certain persons. But He in whom I am bound is my witness that I learned it not from flesh of man; it was the preaching of the Spirit who spake on this wise; Do nothing without the bishop; keep your flesh as a temple of God; cherish union; shun divisions; be imitators of Jesus Christ, as He Himself also was of His Father.'
