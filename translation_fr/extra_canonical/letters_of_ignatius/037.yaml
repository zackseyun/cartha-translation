base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: fr
  text: Sachant que vous êtes remplis de Dieu, je vous ai adressé ces quelques paroles d’encouragement. Souvenez-vous de moi dans vos prières, afin que je parvienne jusqu’à Dieu. Souvenez-vous aussi de l’Église qui est en Syrie, moi qui ne suis pas digne d’être appelé l’un de ses membres. Car j’ai besoin de votre prière unanime et de votre amour en Dieu, afin qu’il soit accordé à l’Église qui est en Syrie d’être rafraîchie par la rosée de votre fervente supplication.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: full of God
  choice: remplis de Dieu
  rationale: Conserve l’image théologique forte du témoin sans la réduire à une simple piété ou inspiration.
- source_word: exhorted
  choice: adressé ces quelques paroles d’encouragement
  rationale: Rend naturellement l’idée d’une exhortation brève dans un français moderne et digne.
- source_word: attain unto God
  choice: parvienne jusqu’à Dieu
  rationale: Préserve le mouvement vers Dieu et sa possible portée martyrologique sans l’expliciter dans le texte.
- source_word: united prayer
  choice: prière unanime
  rationale: Exprime la prière commune et accordée de la communauté.
- source_word: refreshed by the dew
  choice: rafraîchie par la rosée
  rationale: Maintient la métaphore concrète et poétique du témoin.
- source_word: fervent supplication
  choice: fervente supplication
  rationale: Conserve à la fois l’intensité et la nuance de demande pressante.
theological_decisions:
- issue: Sens de « parvenir jusqu’à Dieu »
  choice: Conserver la formule ouverte « parvienne jusqu’à Dieu »
  alternative: « rejoigne Dieu » ou « obtienne le martyre »
  rationale: Le contexte peut évoquer la mort et le martyre, mais le témoin ne les nomme pas ici; la traduction préserve donc la tension et l’ambiguïté.
- issue: Appartenance d’Ignace à l’Église de Syrie
  choice: « être appelé l’un de ses membres »
  alternative: « porter son nom » ou « être compté parmi elle »
  rationale: Cette formulation suit le sens attesté par le témoin sans préciser une fonction ecclésiale particulière.
- issue: Agent de la faveur accordée à l’Église
  choice: Tournure impersonnelle « qu’il soit accordé »
  alternative: « afin que Dieu accorde »
  rationale: Évite d’ajouter un sujet explicite absent du témoin tout en laissant naturellement entendre l’action divine.
translation_notes:
  register: Français international moderne, sobre et épistolaire. Les images spirituelles marquées (« remplis de Dieu », « rosée ») sont conservées. Cette version demeure provisoire, car le dossier fourni signale qu’une vérification directe du grec de la recension moyenne reste à effectuer.
