  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni dans l’ensemble. Deux ajustements améliorent la précision : « ensample » désigne plus directement un exemple/une illustration de l’amour des Éphésiens qu’un « témoignage », et la formulation du souhait concernant le réconfort de Crocus doit conserver clairement le lien avec les quatre compagnons nommés.'
  naturalness: Le registre est globalement naturel et digne. « En l’honneur de vous-mêmes » est toutefois peu idiomatic en français moderne ; « pour votre honneur et celui de votre évêque » est plus fluide. « Conseil des anciens » est également plus immédiatement compréhensible que « collège des anciens » tout en préservant le sens collectif.
  terminology: « Compagnon de service », « diacre », « évêque », « glorifier » et « sanctifiés » conviennent. « Conseil des anciens » rend le caractère collectif de presbytery/presbyterion sans l’anachronisme spatial de « presbytère ». La note explicite ce choix sans imposer une lecture confessionnelle.
