    May I have joy of you always, if so be I an worthy of it. It is therefore meet for you in every way to glorify Jesus Christ who glorified you; that being perfectly joined together in one submission, submitting yourselves to your bishop and presbytery, ye may be sanctified in all things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: fr
  text: 'Quant à Burrhus, mon compagnon de service, qui est, par la volonté de Dieu, votre diacre, béni à tous égards, je demande qu’il reste auprès de moi, pour votre honneur et celui de votre évêque. Crocus aussi, qui est digne de Dieu et de vous, et que j’ai reçu comme un exemple de l’amour que vous me portez, m’a soulagé de toutes les manières. Que le Père de Jésus-Christ lui accorde du réconfort, ainsi qu’à Onésime, Burrhus, Euplus et Fronton. En eux, je vous ai tous vus avec les yeux de l’amour.


    Puissé-je toujours trouver ma joie en vous, si toutefois j’en suis digne ! Il convient donc que vous glorifiiez Jésus-Christ de toutes les manières, lui qui vous a glorifiés, afin que, parfaitement unis dans une même soumission et vous soumettant à votre évêque et au conseil des anciens[a], vous soyez sanctifiés en toutes choses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « conseil des anciens » désigne collectivement les anciens responsables de la communauté ; elle est parfois rendue par « presbytérium ».
    reason: Évite la confusion moderne avec « presbytère », qui désigne habituellement un bâtiment, et signale la valeur institutionnelle collective du terme.
lexical_decisions:
- source_word: fellow servant
  choice: compagnon de service
  rationale: Rend la relation de service partagé sans introduire l’idée plus étroite d’un emploi ou d’un rang ecclésiastique précis.
- source_word: deacon
  choice: diacre
  rationale: Terme ecclésial français direct et historiquement approprié.
- source_word: ensample
  choice: témoignage
  rationale: Dans le contexte, la présence et l’aide de Crocus manifestent concrètement l’amour des Éphésiens; « témoignage » est naturel tout en conservant cette valeur représentative.
- source_word: refresh
  choice: accorde… du réconfort
  rationale: Exprime le soulagement et la restauration souhaités en retour de l’aide reçue, sans limiter le sens au repos physique.
- source_word: presbytery
  choice: collège des anciens
  rationale: Rend la dimension collective du groupe plutôt que le lieu de résidence désigné en français moderne par « presbytère ».
- source_word: in all things / in every way
  choice: à tous égards / de toutes les manières / en toutes choses
  rationale: Varie naturellement selon le contexte tout en maintenant l’ampleur répétée de l’expression.
theological_decisions:
- issue: Relation entre l’évêque, le collège des anciens et la communauté
  choice: Conserver explicitement la soumission à « votre évêque et au collège des anciens »
  alternative: Reformuler en termes généraux d’obéissance aux responsables
  rationale: Le texte atteste une structure ecclésiale précise; la traduction ne doit ni l’effacer ni développer au-delà de ce qui est dit.
- issue: But ou résultat de l’unité et de la soumission
  choice: « afin que… vous soyez sanctifiés »
  alternative: « de sorte que… vous êtes sanctifiés »
  rationale: La construction exprime ici naturellement la finalité visée, mais la formulation reste sobre et ne précise pas davantage le mécanisme théologique de la sanctification.
- issue: Jésus-Christ glorifie la communauté
  choice: « Jésus-Christ, qui vous a glorifiés »
  alternative: « qui vous a honorés »
  rationale: « Glorifier » conserve le parallélisme théologique et lexical entre l’action du Christ et la réponse demandée à la communauté.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement collectif évité grâce à « vous ». Les noms propres suivent les formes françaises usuelles. Puisque la révision directe du grec est indiquée comme encore en attente, cette version demeure prudemment fondée sur le témoin anglais public fourni, sans prétendre résoudre des nuances grecques non vérifiées.
