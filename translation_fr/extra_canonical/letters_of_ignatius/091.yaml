revisions:
- from: 'J’accueille avec joie tes dispositions selon Dieu, établies comme sur un roc inébranlable, et je rends une gloire immense à Dieu, qui m’a accordé de voir ton visage irréprochable,


    visage dont je voudrais pouvoir me réjouir en Dieu. Je t’exhorte, par la grâce dont tu es revêtu, à poursuivre résolument ta course et à exhorter tous les êtres humains afin qu’ils soient sauvés. Accomplis pleinement ton ministère avec toute la diligence du corps et de l’esprit. Veille à l’unité : rien ne vaut mieux qu’elle. Supporte tout le monde, comme le Seigneur te supporte aussi. Sois patient envers tous dans l’amour, comme tu le fais d’ailleurs.


    Consacre-toi à des prières incessantes. Demande une sagesse plus grande que celle que tu as. Reste vigilant et ne laisse pas ton esprit s’assoupir. Parle à chacun personnellement d’une manière conforme à Dieu. Porte les faiblesses de tous, comme un athlète accompli. Là où l’effort est plus grand, le gain est abondant.'
