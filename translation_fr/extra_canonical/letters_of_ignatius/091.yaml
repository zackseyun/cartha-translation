base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: fr
  text: 'J’accueille ta résolution selon Dieu, fermement établie comme sur un roc inébranlable, et je glorifie grandement Dieu d’avoir été jugé digne de voir ton visage irréprochable,


    visage dont je puisse jouir en Dieu. Je t’exhorte, dans la grâce dont tu es revêtu, à poursuivre ta course avec ardeur et à exhorter tous afin qu’ils soient sauvés. Sois à la hauteur de ta charge avec tout le zèle de la chair et de l’esprit. Veille à l’unité : rien n’est meilleur qu’elle. Porte chacun, comme le Seigneur te porte aussi. Supporte-les tous dans l’amour, comme tu le fais d’ailleurs.


    Consacre-toi à des prières plus fréquentes. Demande un discernement plus grand que celui que tu as. Reste vigilant, en gardant un esprit qui ne sommeille pas. Parle à chacun en particulier selon Dieu. Porte les maladies de tous, comme un athlète accompli. Là où l’effort est plus grand, le gain est abondant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly mind
  choice: dispositions selon Dieu
  rationale: « Dispositions » exprime l’orientation intérieure sans réduire le terme à l’intellect; « selon Dieu » garde le caractère religieux dans un français naturel et digne.
- source_word: grounded
  choice: établies
  rationale: Conserve l’image d’une stabilité fondée sur le roc tout en évitant une tournure pesante.
- source_word: press forward in thy course
  choice: poursuivre résolument ta course
  rationale: Maintient la métaphore de la course et son appel à la persévérance.
- source_word: office
  choice: ministère
  rationale: Dans ce contexte d’exhortation à Polycarpe, le mot désigne sa charge ou son service ecclésial; « ministère » reste courant sans préciser davantage la fonction.
- source_word: flesh and spirit
  choice: corps et esprit
  rationale: « Corps » donne ici un français moderne compréhensible pour l’engagement concret de toute la personne; la distinction avec l’esprit est conservée.
- source_word: union
  choice: unité
  rationale: « Unité » est l’équivalent naturel du souci ignatien de cohésion communautaire.
- source_word: Bear
  choice: Supporte / Porte
  rationale: 'Le français varie selon l’objet : « supporter » des personnes signifie faire preuve de patience envers elles, tandis que « porter les faiblesses » préserve l’image du fardeau assumé.'
- source_word: maladies
  choice: faiblesses
  rationale: Le terme peut évoquer maladies, infirmités ou déficiences; « faiblesses » convient à la portée possiblement physique et morale sans imposer un diagnostic médical.
- source_word: perfect athlete
  choice: athlète accompli
  rationale: « Accompli » rend l’idée de maturité et de pleine aptitude plus naturellement que « parfait » dans ce contexte.
theological_decisions:
- issue: Attribution de la gloire
  choice: je rends une gloire immense à Dieu
  alternative: je donne une gloire immense
  rationale: L’anglais témoin laisse l’objet implicite, mais le contexte dévotionnel appelle naturellement Dieu; la formulation française rend l’acte intelligible sans développer une doctrine particulière.
- issue: Finalité du salut
  choice: afin qu’ils soient sauvés
  alternative: pour qu’ils puissent être sauvés
  rationale: Conserve la formulation finale et passive du témoin sans préciser ici l’agent, le mécanisme ou les conditions du salut.
- issue: Manière de parler à chacun
  choice: d’une manière conforme à Dieu
  alternative: selon la manière de Dieu
  rationale: Évite de suggérer que le responsable parle avec une autorité divine intrinsèque, tout en gardant la norme divine indiquée par le texte.
- issue: Le Seigneur supporte Polycarpe
  choice: comme le Seigneur te supporte aussi
  alternative: comme le Seigneur te porte aussi
  rationale: « Supporte » conserve l’appel à la patience et la réciprocité de l’exhortation; « porte » pourrait suggérer surtout le soutien ou le secours.
translation_notes:
  register: Tutoiement conservé pour l’adresse personnelle antique. Registre moderne, direct et digne, avec maintien des métaphores du roc, du vêtement, de la course, de l’assoupissement et de l’athlète. Aucun marqueur de note n’est nécessaire. La ponctuation et les paragraphes suivent l’articulation du témoin fourni. Comme la révision directe du grec est signalée comme encore en attente dans les données, les choix restent prudents et préservent les tensions perceptibles dans le témoin ancien.
