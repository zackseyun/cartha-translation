  rationale: La révision privilégie les sens attestés par le grec de la recension moyenne, tout en contrôlant le témoin anglais. Elle conserve les ambiguïtés de τόπος (« charge »), de κατὰ θεόν (« selon Dieu ») et des « maladies », qui peuvent être comprises littéralement ou dans un emploi élargi. Aucun appel de note n’est requis.
