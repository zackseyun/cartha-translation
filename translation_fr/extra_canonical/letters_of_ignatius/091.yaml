review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur plusieurs expressions où le brouillon suit le témoin anglais plutôt que le grec : πυκνοτέραις signifie « plus fréquentes », non « incessantes » ; σύνεσις est le discernement ou l’intelligence ; νοσήματα désigne les maladies. La distinction entre βάσταζε (« porte ») et ἀνέχου (« supporte / endure ») doit aussi être maintenue. « Chair et esprit » préserve plus exactement σαρκικῇ τε καὶ πνευματικῇ que « corps et esprit ».'
  naturalness: Le français du brouillon est généralement fluide et d’un registre approprié. La révision proposée reste moderne et directe, tout en évitant certains ajouts interprétatifs (« avec joie ») et en rendant plus nettement les impératifs successifs.
  terminology: « Résolution selon Dieu » rend naturellement γνώμη au singulier dans ce contexte. « Charge » convient à τόπος sans déterminer la nature exacte de la fonction. « Unité », « grâce », « salut », « Seigneur » et « discernement » conservent le registre et les concepts du texte sans surcharge doctrinale.
  issues:
  - severity: medium
    issue: « avec joie » ajoute un élément absent de ἀποδεχόμενος.
    rationale: Le verbe exprime l’accueil ou l’acceptation ; la joie n’est pas lexicalement exprimée.
  - severity: high
    issue: « des prières incessantes » ne rend pas πυκνοτέραις προσευχαῖς.
    rationale: Le comparatif indique des prières « plus fréquentes », non nécessairement ininterrompues.
  - severity: medium
    issue: « sagesse » pour σύνεσις et « faiblesses » pour νοσήματα affaiblissent la précision lexicale.
    rationale: σύνεσις vise le discernement / l’intelligence, et νοσήματα les maladies, éventuellement au sens figuré sans qu’il faille le préciser.
  - severity: medium
    issue: La double exhortation βάσταζε / ἀνέχου est aplatie.
    rationale: Le premier impératif appelle à porter les personnes, à l’image du Seigneur ; le second à les supporter dans l’amour.
  - severity: medium
    issue: « corps et esprit » remplace « chair et esprit ».
    rationale: Le grec oppose explicitement σαρκικός et πνευματικός ; « chair » maintient cette formulation sans en imposer une interprétation.
