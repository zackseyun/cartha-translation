base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: fr
  text: 'Mon esprit s’offre comme rebut pour la croix, qui est une pierre d’achoppement pour ceux qui ne croient pas, mais pour nous le salut et la vie éternelle. Où est le sage ? Où est celui qui débat ? Où est la fierté de ceux que l’on appelle prudents ?


    Car notre Dieu, Jésus le Christ, a été conçu dans le sein de Marie selon le dessein de Dieu[a] : il était de la descendance de David, mais aussi de l’Esprit Saint. Il est né et a été baptisé afin de purifier l’eau par sa passion[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « dessein de Dieu » peut aussi évoquer une disposition, un ordre établi ou une économie divine.
    reason: Préserver l’étendue sémantique du terme grec probable οἰκονομία, puisque la révision directe du grec reste en attente.
  - marker: b
    text: 'Littéralement selon le témoin : « afin que, par sa passion, il purifie l’eau ». Le rapport précis entre le baptême de Jésus, sa passion et cette purification n’est pas explicité ici.'
    reason: Conserver une formulation ancienne difficile sans la résoudre par une interprétation confessionnelle.
lexical_decisions:
- source_word: περίψημα (reconstructed from the Greek tradition; source review pending)
  choice: rebut
  rationale: Conserve l’image forte d’une chose rejetée ou méprisée, sans adopter une expression française obscure comme « balayure ».
- source_word: σκάνδαλον (reconstructed; source review pending)
  choice: pierre d’achoppement
  rationale: Expression française courante dans le registre biblique, qui garde l’idée d’un obstacle faisant trébucher.
- source_word: οἰκονομία (reconstructed; source review pending)
  choice: dessein de Dieu
  rationale: Rend ici l’idée d’un ordre ou plan divin de salut plus naturellement que le calque « dispensation »; une note préserve l’étendue du terme.
- source_word: σπέρμα Δαυίδ (reconstructed; source review pending)
  choice: descendance de David
  rationale: Formulation naturelle qui conserve le sens généalogique de « semence de David ».
- source_word: πάθος (reconstructed; source review pending)
  choice: passion
  rationale: Dans ce contexte ancien chrétien, désigne les souffrances et la mort du Christ; le terme français dignifié convient au registre.
theological_decisions:
- issue: Désignation de Jésus comme Dieu
  choice: « notre Dieu, Jésus le Christ »
  alternative: « Jésus-Christ, notre Dieu »
  rationale: Préserve explicitement la prédication christologique du témoin et son ordre, sans l’atténuer.
- issue: Conception liée à David et à l’Esprit Saint
  choice: « il était de la descendance de David, mais aussi de l’Esprit Saint »
  alternative: « issu de la descendance de David et de l’Esprit Saint »
  rationale: Le tour retenu maintient le contraste surprenant « mais aussi » du témoin et évite d’expliquer davantage la relation entre les deux affirmations.
- issue: Purification de l’eau par la passion
  choice: Conserver littéralement le lien entre baptême, passion et purification de l’eau
  alternative: Interpréter comme sanctification des eaux baptismales
  rationale: Le texte présente une affirmation théologiquement dense et inhabituelle; la traduction ne doit pas imposer une explication doctrinale particulière.
translation_notes:
  register: 'Français international moderne, digne et accessible, avec maintien des échos à 1 Corinthiens 1. Le texte est nécessairement provisoire : le dossier fourni repose sur un témoin anglais du domaine public et indique que la révision directe de la tradition grecque de la recension moyenne reste à effectuer.'
