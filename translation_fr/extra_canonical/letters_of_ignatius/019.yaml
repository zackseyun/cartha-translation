review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le français « s’offre comme rebut » ajoute l’idée d’une offrande, absente du témoin (« is made/an offscouring »). « Dessein de Dieu » ajoute également « de Dieu », alors que le témoin dit seulement « according to a dispensation ». Enfin, la formulation « il était de la descendance... mais aussi de l’Esprit Saint » est ambiguë en français et ne rattache pas clairement ces deux compléments à la conception.
  naturalness: Le registre est globalement digne et accessible. « Rebut de la croix » conserve une difficulté voulue, mais sans l’ajout interprétatif de « s’offre comme ». « Vantardise » rend plus exactement et naturellement « boasting » que « fierté ».
  terminology: « Pierre d’achoppement », « salut », « vie éternelle », « Jésus le Christ », « Esprit Saint » et « passion » conviennent. « Selon une disposition » est un rendu prudent de « dispensation »; la note conserve les possibilités d’« économie », d’ordre établi ou de dessein, sans introduire un qualificatif absent du texte.
  issues:
  - severity: medium
    issue: « Mon esprit s’offre comme rebut »
    rationale: « S’offre » n’est pas attesté par le témoin et transforme l’énoncé en langage d’offrande. Il faut conserver la prédication directe et l’image dépréciative de περίψημα.
  - severity: medium
    issue: « selon le dessein de Dieu »
    rationale: Le texte de contrôle porte « according to a dispensation », sans le complément « de Dieu ». Celui-ci est théologiquement plausible dans le contexte, mais reste une explicitation non nécessaire.
  - severity: medium
    issue: Rattachement ambigu de « de la descendance de David, mais aussi de l’Esprit Saint »
    rationale: Après « a été conçu », la phrase française actuelle peut faire de « il était de l’Esprit Saint » une prédication autonome. Il convient de rattacher explicitement les compléments à « conçu » tout en gardant le contraste du témoin.
  - severity: low
    issue: « fierté » pour « boasting »
    rationale: « Vantardise » correspond plus directement à la notion de glorification ou de vantardise et préserve l’écho polémique de la citation.
  revised_text: 'Mon esprit est le rebut de la croix, qui est une pierre d’achoppement pour ceux qui ne croient pas, mais pour nous le salut et la vie éternelle. Où est le sage ? Où est celui qui débat ? Où est la vantardise de ceux que l’on appelle prudents ?


    Car notre Dieu, Jésus le Christ, a été conçu dans le sein de Marie selon une disposition[a], issu de la descendance de David, mais aussi de l’Esprit Saint. Il est né et a été baptisé afin que, par sa passion, il purifie l’eau[b].'
  revised_footnotes:
  - marker: a
    text: Le terme rendu par « disposition » peut aussi évoquer un ordre établi, un dessein ou une « économie ».
    reason: Préserver l’étendue sémantique du terme grec probable οἰκονομία, sans ajouter au texte un complément tel que « de Dieu ».
  - marker: b
    text: 'Littéralement selon le témoin : « afin que, par sa passion, il purifie l’eau ». Le rapport précis entre le baptême de Jésus, sa passion et cette purification n’est pas explicité ici.'
    reason: Conserver une formulation ancienne difficile sans la résoudre par une interprétation confessionnelle.
  revision_rationale: Les corrections retirent deux explicitations absentes du témoin (« s’offre » et « de Dieu »), rendent plus directement « boasting », et clarifient en français que la double origine mentionnée qualifie la conception. La formulation concernant l’eau et la passion est conservée, avec sa note d’ambiguïté.
