base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: fr
  text: 'Puissé-je me réjouir de vous à tous égards, si j’en suis digne ! Car, même enchaîné, je ne saurais être comparé à un seul d’entre vous qui êtes libres. Je sais que vous n’êtes pas enflés d’orgueil, car vous avez Jésus-Christ en vous. Et lorsque je vous loue, je sais que vous en éprouvez d’autant plus de honte, comme il est écrit : « Le juste s’accuse lui-même. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation est apparentée à Proverbes 18.17 dans la tradition grecque ancienne, où le proverbe se poursuit par des mots absents ici. Elle ne doit donc pas être présentée comme une citation verbalement identique à toutes les formes du verset.
    reason: Indiquer l’arrière-plan scripturaire et la relation textuelle non exacte avec la forme grecque plus longue de Proverbes 18.17.
lexical_decisions:
- source_word: χαίροιμι ὑμῶν (probable Greek underlying the witness)
  choice: Puissé-je trouver en vous ma joie
  rationale: Rend naturellement le souhait et l’idée de se réjouir à leur sujet ou en eux, sans réduire l’expression à une simple formule de félicitation.
- source_word: δεδεμένος / δεσμοί (bonds)
  choice: dans les chaînes
  rationale: Conserve l’image concrète de l’emprisonnement tout en restant idiomatique en français moderne.
- source_word: ἐλευθέρων (free)
  choice: libres
  rationale: Maintient le contraste direct entre l’auteur prisonnier et les destinataires en liberté.
- source_word: φυσιόω (puffed up)
  choice: vous ne vous gonflez pas d’orgueil
  rationale: Préserve la métaphore de l’enflure et en explicite sobrement la portée morale.
- source_word: ἐν ἑαυτοῖς (within yourselves)
  choice: en vous
  rationale: Formulation naturelle qui conserve l’affirmation de la présence intérieure de Jésus-Christ sans l’interpréter davantage.
- source_word: ἐντρέπεσθε / αἰσχύνεσθε (feel shame)
  choice: vous n’en éprouvez que plus de honte
  rationale: Garde le paradoxe selon lequel l’éloge accroît leur honte ou modestie, sans remplacer ce terme fort par une interprétation atténuée.
- source_word: ὁ δίκαιος ἑαυτοῦ κατήγορος (the righteous is his own accuser)
  choice: Le juste s’accuse lui-même
  rationale: Rendu concis et proverbial, proche de la forme transmise de la citation.
theological_decisions:
- issue: Présence de Jésus-Christ dans les croyants
  choice: « vous avez Jésus-Christ en vous »
  alternative: « Jésus-Christ habite en vous »
  rationale: La formulation retenue suit le témoignage fourni et évite d’ajouter la notion spécifique d’habitation si le verbe grec sous-jacent exprime simplement le fait d’avoir.
- issue: Sens moral de la honte suscitée par l’éloge
  choice: Conserver « honte » sans l’expliquer dans le texte
  alternative: « vous devenez d’autant plus humbles »
  rationale: Le texte présente une tension rhétorique entre louange et honte. La résoudre en « humilité » supprimerait une ambiguïté authentique.
- issue: Citation sur l’auto-accusation du juste
  choice: Présenter la phrase comme une citation écrite, avec note sur sa forme
  alternative: Identifier directement Proverbes 18.17 comme citation exacte
  rationale: La formulation correspond à une forme ancienne connue de Proverbes 18.17, mais elle ne coïncide pas exactement avec toutes les traditions textuelles ou traductions modernes; la note préserve cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est rendu par « vous ». La syntaxe conserve le ton personnel, humble et exhortatif d’Ignace. Projet établi principalement à partir du témoin anglais fourni; la consultation directe du texte grec de la recension moyenne reste nécessaire avant publication définitive.
