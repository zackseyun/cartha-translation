source:
  text: Let me have joy of you in all things, if I be worthy. For even though I am in bonds, yet am I not comparable to one of you who are at liberty. I know that ye are not puffed up; for ye have Jesus Christ in yourselves. And, when I praise you, I know that ye only feel the more shame; as it is written the righteous man is a self-accuser.
