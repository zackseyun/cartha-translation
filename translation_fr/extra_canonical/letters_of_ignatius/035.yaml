    issue: « Je ne suis comparable à aucun de vous » généralise le singulier grec.
    rationale: ἑνὶ τῶν ὑμῶν signifie littéralement « à un seul d’entre vous »; le singulier souligne l’abaissement rhétorique de l’auteur.
  - severity: low
    issue: « Vous ne vous gonflez pas d’orgueil » affaiblit légèrement la forme résultative du parfait passif.
    rationale: πεφυσιῶσθαι décrit l’état d’être devenu/en être enflé. « Vous n’êtes pas enflés d’orgueil » rend plus étroitement cette valeur.
  - severity: low
    issue: « Trouver en vous ma joie » est moins naturel et moins immédiat que « me réjouir de vous ».
    rationale: Le génitif ὑμῶν après χαίροιμι exprime naturellement la joie éprouvée au sujet des destinataires.
