revisions:
- from: 'Puissé-je trouver en vous ma joie en toutes choses, si j’en suis digne ! En effet, même si je suis dans les chaînes, je ne suis comparable à aucun de vous qui êtes libres. Je sais que vous ne vous gonflez pas d’orgueil, car vous avez Jésus-Christ en vous. Et lorsque je fais votre éloge, je sais que vous n’en éprouvez que plus de honte, comme il est écrit : « Le juste s’accuse lui-même. »[a]'
  to: 'Puissé-je me réjouir de vous à tous égards, si j’en suis digne ! Car, même enchaîné, je ne saurais être comparé à un seul d’entre vous qui êtes libres. Je sais que vous n’êtes pas enflés d’orgueil, car vous avez Jésus-Christ en vous. Et lorsque je vous loue, je sais que vous en éprouvez d’autant plus de honte, comme il est écrit : « Le juste s’accuse lui-même. »[a]'
  rationale: Les corrections resserrent la fidélité au grec de la recension moyenne tout en améliorant l’idiomaticité française. Elles ne résolvent pas par interprétation la « honte » produite par l’éloge et ne développent pas la présence du Christ en une doctrine d’« habitation ».
