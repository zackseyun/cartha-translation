base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: fr
  text: 'Mais si quelqu’un vous expose le judaïsme, ne l’écoutez pas. Car il vaut mieux entendre parler du christianisme par un homme circoncis que du judaïsme par un homme incirconcis. Mais si l’un ou l’autre ne parle pas de Jésus Christ, je les considère comme des stèles funéraires et des tombeaux de morts, sur lesquels ne sont inscrits que des noms d’hommes.


    Évitez donc les artifices mauvais et les complots du prince de ce monde, de peur que ses manœuvres ne vous écrasent et que votre amour ne s’affaiblisse. Mais rassemblez-vous tous d’un cœur sans partage. Et[a]


    Je remercie mon Dieu de pouvoir garder une bonne conscience dans mes rapports avec vous. Personne ne peut se vanter, ni en secret ni ouvertement, que j’aie été à la charge de qui que ce soit, dans les petites choses ou dans les grandes. Oui, et pour tous ceux parmi lesquels j’ai parlé, je prie afin qu’ils ne fassent pas de mes paroles un témoignage contre eux-mêmes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Et » abrupt est conservé d’après le témoin fourni; il peut signaler une transition interrompue ou une irrégularité dans la transmission du texte.
    reason: Le témoin anglais et la couche POB signalent tous deux cette rupture syntaxique, qu’il convient de ne pas lisser silencieusement.
lexical_decisions:
- source_word: Judaism
  choice: le judaïsme
  rationale: Conserve le contraste explicite du témoin entre judaïsme et christianisme, sans l’atténuer ni l’élargir.
- source_word: Christianity
  choice: le christianisme
  rationale: Rend directement le nom abstrait opposé au judaïsme dans le témoin fourni.
- source_word: circumcised / uncircumcised
  choice: homme circoncis / homme incirconcis
  rationale: Préserve la formulation concrète et le paradoxe rhétorique; « incirconcis » reste précis et intelligible.
- source_word: tombstones and graves of the dead
  choice: stèles funéraires et tombeaux de morts
  rationale: Maintient les deux images funéraires distinctes et leur force polémique.
- source_word: prince of this world
  choice: prince de ce monde
  rationale: Conserve le titre traditionnel et son ambiguïté référentielle sans ajouter d’identification explicite.
- source_word: undivided heart
  choice: d’un cœur sans partage
  rationale: Expression française naturelle qui préserve l’idée d’unité intérieure et communautaire.
- source_word: burdensome
  choice: à la charge de
  rationale: Rend naturellement l’idée d’avoir imposé un fardeau matériel ou personnel, sans préciser davantage que le témoin.
theological_decisions:
- issue: Portée de la critique du judaïsme
  choice: Conserver le contraste tel qu’il est formulé, tout en rattachant le critère décisif au discours concernant Jésus Christ.
  alternative: Paraphraser en visant seulement des pratiques judaïsantes particulières.
  rationale: Le témoin emploie les abstractions « Judaism » et « Christianity »; les restreindre introduirait une interprétation non explicitée.
- issue: Référent du « prince de ce monde »
  choice: Ne pas nommer explicitement Satan ou le diable.
  alternative: Traduire par « le diable, prince de ce monde ».
  rationale: Le titre doit garder la formulation et la tension théologique du témoin sans glose doctrinale dans le texte.
- issue: « Témoignage contre eux-mêmes »
  choice: Préserver la formule judiciaire et sa portée ouverte.
  alternative: Expliquer qu’ils seraient condamnés pour avoir rejeté l’enseignement.
  rationale: Le témoin ne précise ni le mécanisme ni le moment de ce témoignage; une explicitation résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. La polémique et les images du passage sont conservées sans les amplifier. Projet établi à partir du témoin anglais public fourni; la vérification directe du grec de la recension moyenne reste à effectuer.
