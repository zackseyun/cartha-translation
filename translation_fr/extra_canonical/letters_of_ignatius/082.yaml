base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: fr
  text: 'Que personne ne se laisse tromper. Même les êtres célestes, la gloire des anges et les puissances visibles et invisibles, s’ils ne croient pas au sang du Christ [qui est Dieu][a], subiront eux aussi le jugement. Que celui qui peut recevoir, reçoive[b]. Que sa position ne rende personne orgueilleux, car la foi et l’amour sont tout, et rien ne leur est supérieur.


    Considérez attentivement ceux qui professent des doctrines étrangères au sujet de la grâce de Jésus-Christ venue jusqu’à nous : voyez combien ils sont opposés à la pensée de Dieu. Ils ne se soucient ni de l’amour[c], ni de la veuve, ni de l’orphelin, ni de l’opprimé, ni du prisonnier, ni de celui qui a faim ou soif. Ils s’abstiennent de l’eucharistie[d] et de la prière, parce qu’ils ne reconnaissent pas que l’eucharistie est la chair de notre Sauveur Jésus-Christ, celle qui a souffert pour nos péchés et que le Père, dans sa bonté, a ressuscitée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « qui est Dieu » sont conservés entre crochets parce que le témoin utilisé les présente comme une leçon ou une restauration textuellement incertaine. Une vérification directe de la tradition manuscrite grecque reste nécessaire.
    reason: Signaler honnêtement l’incertitude textuelle portée par le témoin sans supprimer une affirmation théologiquement importante.
  - marker: b
    text: L’expression ne précise pas ce qui doit être « reçu »; elle peut aussi évoquer la capacité de comprendre ou d’accueillir cette parole.
    reason: Préserver l’ellipse et l’ambiguïté du texte au lieu d’en imposer une interprétation.
  - marker: c
    text: Ici, « amour » peut désigner aussi bien la sollicitude concrète envers autrui que, possiblement, un repas communautaire appelé agape; le contexte insiste surtout sur le défaut de soin envers les personnes vulnérables.
    reason: Maintenir l’éventail sémantique susceptible d’être confirmé par l’examen du grec.
  - marker: d
    text: Le mot « eucharistie » signifie littéralement « action de grâce » ou « reconnaissance ».
    reason: Restituer le sens du glossaire « thanksgiving » fourni par le témoin sans alourdir le corps du texte.
lexical_decisions:
- source_word: heavenly beings
  choice: les êtres célestes
  rationale: Rend la catégorie céleste sans préciser indûment sa nature; la formulation reste distincte des anges mentionnés ensuite.
- source_word: rulers visible and invisible
  choice: les puissances visibles et invisibles
  rationale: « Puissances » convient au contexte cosmique et spirituel tout en conservant l’étendue visible et invisible; « dirigeants » aurait une portée trop exclusivement politique.
- source_word: He that receiveth let him receive
  choice: Que celui qui peut recevoir, reçoive
  rationale: Conserve le caractère sentencieux et énigmatique de l’expression au lieu de déterminer arbitrairement ce qui doit être reçu ou compris.
- source_word: office
  choice: position
  rationale: Désigne un rang ou une place susceptible d’enorgueillir, sans importer une structure ecclésiastique plus précise que le témoignage fourni.
- source_word: strange doctrine
  choice: doctrines étrangères
  rationale: Reproduit l’idée d’un enseignement étranger à la foi reçue, dans un français naturel et sans étiquette confessionnelle postérieure.
- source_word: mind of God
  choice: pensée de Dieu
  rationale: Expression française claire qui préserve l’idée d’une disposition ou volonté divine sans la réduire à un simple avis.
- source_word: afflicted
  choice: l’opprimé
  rationale: Exprime une personne accablée ou maltraitée; la portée exacte devra être vérifiée lors de la collation grecque.
- source_word: eucharist (thanksgiving)
  choice: eucharistie
  rationale: Le terme français conserve à la fois le nom ancien du rite et son étymologie de « reconnaissance » ou « action de grâce », explicitée en note.
theological_decisions:
- issue: Statut de la formule « qui est Dieu »
  choice: Conserver la formule entre crochets et lui adjoindre une note textuelle
  alternative: L’intégrer sans crochets ou l’omettre
  rationale: Le témoin fourni la signale comme une restauration ou une leçon textuellement incertaine. La traduction ne doit ni masquer cette incertitude ni trancher silencieusement la question christologique.
- issue: Nature de l’eucharistie
  choice: Traduire directement l’affirmation selon laquelle l’eucharistie est la chair du Sauveur
  alternative: Paraphraser en termes symboliques ou définir un mécanisme sacramentel précis
  rationale: Le texte établit lui-même cette identification en lien avec la chair souffrante et ressuscitée; il ne précise pas comment elle doit être comprise. La traduction conserve donc l’affirmation sans l’expliquer selon une doctrine ultérieure.
- issue: Sens de « recevoir »
  choice: Maintenir l’énoncé ouvert
  alternative: Traduire par « comprendre », « accepter » ou désigner explicitement un enseignement
  rationale: L’objet du verbe n’est pas exprimé dans le témoin; le préciser résoudrait une ambiguïté réelle.
- issue: Foi et amour comme totalité
  choice: « la foi et l’amour sont tout »
  alternative: « tout consiste dans la foi et l’amour »
  rationale: La formulation retenue conserve la force absolue de l’énoncé tout en évitant de construire un système doctrinal au-delà du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases gardent le ton d’avertissement et d’exhortation de la lettre. Le présent projet repose sur le témoin anglais public fourni, la révision directe du grec étant explicitement annoncée comme encore en attente; les choix qui dépendent du grec demeurent donc prudents et provisoires.
