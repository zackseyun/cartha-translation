review_pass:
  verdict: revise
  source_fidelity: 'Révision requise : dans la construction du témoin, « in whom » renvoie à l’Église (féminin), destinataire de l’adresse, et non à Jésus-Christ. Le français « En lui » introduit donc un référent masculin erroné. La formulation de la salutation doit aussi conserver plus explicitement son caractère abondant/intensifié.'
  naturalness: Le texte est globalement fluide et d’un registre épistolaire approprié. « Je lui adresse mes salutations les plus abondantes » est une formulation française moderne et soutenue qui rend l’intensification de la salutation sans le tour plus interprétatif « mes vœux les plus chaleureux ».
  terminology: « Ignace », « Théophore », « Église », « Magnésie » et « le Méandre » conviennent. « Jésus-Christ notre Sauveur » respecte le titre transmis. « En elle » préserve correctement le référent ecclésial et la souplesse sémantique de la préposition.
  issues:
  - severity: high
    issue: Référent fautif de « En lui »
    rationale: Le pronom du témoin (« in whom ») reprend « her », c’est-à-dire l’Église bénie et saluée. « Lui » renvoie normalement à Jésus-Christ en français et modifie ainsi le sens et la structure de l’adresse.
  - severity: medium
    issue: « mes vœux les plus chaleureux » atténue et réoriente « abundant greeting »
    rationale: Cette expression est naturelle, mais elle présente la formule comme des souhaits chaleureux plutôt que comme une salutation abondante/intensifiée. Une formulation épistolaire plus proche est préférable.
  revised_text: Ignace, appelé aussi Théophore, à l’Église bénie par la grâce de Dieu le Père en Jésus-Christ notre Sauveur, en elle je salue l’Église qui est à Magnésie, sur le Méandre, et je lui adresse mes salutations les plus abondantes en Dieu le Père et en Jésus-Christ.[a]
  revised_footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni; la vérification directe du grec de la recension moyenne reste à effectuer.
    reason: La source grecque n’a pas encore fait l’objet d’une révision directe dans les données fournies; le degré de certitude textuelle doit donc être signalé.
  revision_rationale: 'La révision corrige l’antécédent du pronom : « en elle » renvoie à l’Église, conformément à la syntaxe de l’adresse transmise. Elle remplace également une paraphrase chaleureuse par une salutation explicitement « abondante », tout en conservant les noms, le registre et l’avertissement méthodologique existant.'
