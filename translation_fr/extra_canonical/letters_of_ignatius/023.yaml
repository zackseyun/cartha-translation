base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: fr
  text: Ignace, appelé aussi Théophore, à l’Église qui a été bénie par la grâce de Dieu le Père en Jésus-Christ notre Sauveur. En lui, je salue l’Église qui est à Magnésie, sur le Méandre, et je lui adresse mes vœux les plus chaleureux en Dieu le Père et en Jésus-Christ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni; la vérification directe du grec de la recension moyenne reste à effectuer.
    reason: La source grecque n’a pas encore fait l’objet d’une révision directe dans les données fournies; le degré de certitude textuelle doit donc être signalé.
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Conserve le surnom traditionnel sous sa forme française, sans en imposer dans le texte une interprétation étymologique particulière.
- source_word: her / church
  choice: l’Église
  rationale: Explicite dès l’adresse le destinataire collectif, indiqué ensuite dans le témoin comme l’Église de Magnésie; le féminin du témoin anglais renvoie à cette Église.
- source_word: Magnesia on the Maeander
  choice: Magnésie, sur le Méandre
  rationale: Emploie les formes géographiques françaises usuelles et distingue cette ville des autres cités nommées Magnésie.
- source_word: abundant greeting
  choice: mes vœux les plus chaleureux
  rationale: Rend naturellement en français la salutation épistolaire intensifiée, sans calquer l’expression anglaise.
theological_decisions:
- issue: Rapport entre la grâce du Père et Jésus-Christ
  choice: bénie par la grâce de Dieu le Père en Jésus-Christ notre Sauveur
  alternative: bénie, par Jésus-Christ notre Sauveur, grâce à Dieu le Père
  rationale: Préserve la syntaxe et la portée théologique du témoin fourni sans redistribuer les rapports entre le Père, la grâce et le Christ.
- issue: Référent de « en lui »
  choice: En lui, je salue
  alternative: Par lui, je salue
  rationale: Maintient l’ambiguïté de la préposition quant à la nuance d’union, de sphère ou de médiation, plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La forme épistolaire ancienne est conservée tout en évitant les calques peu naturels. « Église » est explicité dans l’adresse pour assurer une lecture française claire.
