revisions:
- from: 'Que ceux qui paraissent dignes de confiance, mais enseignent une doctrine étrangère, ne te troublent pas. Tiens ferme, comme une enclume sous les coups. Il appartient au grand athlète de recevoir des coups et de vaincre. Mais surtout, il nous faut tout endurer à cause de Dieu, afin que lui aussi nous supporte[a].


    Sois encore plus zélé que tu ne l’es. Apprends à discerner les temps. Attends celui qui est au-dessus du temps : l’Éternel[b], l’Invisible devenu visible pour nous, l’Intouchable, celui qui ne peut souffrir et qui a souffert pour nous[c], celui qui, de toute manière, a enduré pour nous.'
  to: 'Que ceux qui paraissent dignes de confiance, mais enseignent une doctrine étrangère, ne te troublent pas. Tiens ferme, comme une enclume sous les coups. Il appartient à un grand athlète de recevoir des coups et de vaincre. Mais surtout, pour Dieu, nous devons tout endurer, afin que lui aussi nous endure[a].



    Sois plus zélé que tu ne l’es. Apprends à discerner les temps. Attends celui qui est au-dessus de tout temps : l’Éternel[b], l’Invisible, qui est devenu visible pour nous ; l’Impalpable, l’Impassible, qui a souffert pour nous ; celui qui, à tous égards, a enduré pour nous.'
  rationale: La révision resserre quelques rendus sur le grec tout en conservant le style moderne et solennel. Elle rétablit explicitement la répétition de ὑπομένω, remplace un titre potentiellement équivoque par « l’Impalpable », et rend la portée de κατὰ πάντα τρόπον sans l’ambiguïté idiomatique de « de toute manière ». La note christologique c devient inutile, car « l’Impassible, qui a souffert » conserve directement le paradoxe textuel sans besoin d’explication.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la progression exhortative et les images du grec de la recension moyenne : personnes apparemment crédibles qui enseignent autrement, enclume frappée, athlète, endurance réciproquement formulée, discernement des καιροί, puis la chaîne de prédicats christologiques. « À cause de Dieu » est possible, mais « pour Dieu » rend plus directement θεοῦ ἕνεκεν. « De toute manière » peut signifier en français moderne « quoi qu’il en soit » et affaiblit κατὰ πάντα τρόπον (« à tous égards / de toutes les manières »).'
  naturalness: Le tutoiement, le rythme bref et le registre sont appropriés. « L’Impalpable » est plus précis et moins susceptible d’évoquer l’inaccessibilité sociale ou politique que « l’Intouchable ». La répétition d’« endurer » dans le texte, éclairée par note, reproduit mieux le retour volontaire de ὑπομένω que la variation « supporter ».
  terminology: '« Dignes de confiance », « doctrine étrangère », « l’Éternel », « l’Invisible » et « l’Impassible » conviennent. « L’Impassible » maintient le titre technique ἀπαθής sans imposer d’explication doctrinale. La note sur ἄχρονος doit éviter de présenter « hors du temps » comme seule littéralité : le terme signifie d’abord « sans temps / non soumis au temps ».'
  issues:
  - severity: medium
    issue: Variation lexicale entre « tout endurer » et « lui aussi nous supporte »
    rationale: Le grec répète ὑπομένω dans les deux membres. « Supporter » est idiomatique, mais efface dans le texte le lien rhétorique délibéré ; « afin que lui aussi nous endure », même inhabituel, le conserve et la note peut en signaler l’étrangeté.
  - severity: low
    issue: « l’Intouchable » pour ἀψηλάφητος
    rationale: Le mot grec renvoie à ce qui ne peut être palpé ou touché. « L’Impalpable » est plus exact dans cette série de qualifications et plus naturel dans ce contexte.
  - severity: low
    issue: « de toute manière » pour κατὰ πάντα τρόπον
    rationale: Cette locution française peut être concessive (« quoi qu’il en soit »). « À tous égards » exprime sans ambiguïté la portée exhaustive du grec.
