    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: fr
  text: 'Que ceux qui paraissent dignes de confiance, mais enseignent une doctrine étrangère, ne te troublent pas. Tiens ferme, comme une enclume sous les coups. Il appartient à un grand athlète de recevoir des coups et de vaincre. Mais surtout, pour Dieu, nous devons tout endurer, afin que lui aussi nous endure[a].



    Sois plus zélé que tu ne l’es. Apprends à discerner les temps. Attends celui qui est au-dessus de tout temps : l’Éternel[b], l’Invisible, qui est devenu visible pour nous ; l’Impalpable, l’Impassible, qui a souffert pour nous ; celui qui, à tous égards, a enduré pour nous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète le même verbe, qui signifie « endurer », « tenir bon » ou, selon le contexte, « supporter ». La formule inhabituelle peut aussi être comprise : « afin que lui aussi fasse preuve de patience envers nous ».'
    reason: Conserver la répétition lexicale et l’ambiguïté de l’expression sans lui imposer une interprétation théologique.
  - marker: b
    text: 'Littéralement : « sans temps » ; le terme peut exprimer celui qui n’est pas soumis au temps.'
    reason: Signaler la nuance de ἄχρονος derrière le titre français plus naturel « l’Éternel ».
lexical_decisions:
- source_word: ἀξιόπιστοι
  choice: dignes de confiance
  rationale: Rend l’idée de personnes paraissant crédibles ou fiables, plutôt qu’une simple éloquence persuasive.
- source_word: ἑτεροδιδασκαλοῦντες
  choice: enseignent une doctrine étrangère
  rationale: Conserve la notion d’un enseignement autre ou étranger sans préciser davantage son contenu.
- source_word: ἄκμων τυπτόμενος
  choice: une enclume sous les coups
  rationale: Image naturelle en français qui maintient à la fois la stabilité de l’enclume et l’action répétée de la frapper.
- source_word: καιροὺς καταμάνθανε
  choice: Apprends à discerner les temps
  rationale: « Discerner » exprime l’observation attentive et la compréhension des circonstances opportunes, sans réduire καιροί à la chronologie.
- source_word: τὸν ὑπὲρ καιρόν
  choice: celui qui est au-dessus du temps
  rationale: Préserve l’expression paradoxale et évite de limiter καιρός à une seule « saison ».
- source_word: ἀψηλάφητον
  choice: l’Intouchable
  rationale: Rend de façon claire celui qu’on ne peut toucher ou palper, tout en conservant le parallélisme des titres.
- source_word: ὑπομένω
  choice: endurer / supporter
  rationale: Le même verbe grec revient avec des objets différents; le français exige ici une variation idiomatique, signalée en note afin de préserver le lien lexical.
theological_decisions:
- issue: La formule « afin que lui aussi nous supporte »
  choice: Conserver la formulation difficile et relationnelle
  alternative: « afin que lui aussi nous fasse persévérer » ou « nous soutienne »
  rationale: Le texte associe explicitement l’endurance humaine et celle de Dieu à notre égard. Une reformulation causative résoudrait une tension que le texte laisse subsister.
- issue: Le paradoxe de l’impassible qui souffre
  choice: « celui qui ne peut souffrir et qui a souffert pour nous »
  alternative: « celui qui n’était pas soumis à la souffrance, mais qui s’y est soumis pour nous »
  rationale: La traduction retenue maintient la force christologique et le contraste abrupt du texte, sans en proposer une harmonisation doctrinale.
- issue: Le titre ἄχρονος
  choice: « l’Éternel »
  alternative: « celui qui est hors du temps » ou « l’Intemporel »
  rationale: « L’Éternel » est dignifié et accessible, mais une note conserve le sens littéral lié à l’absence de temps.
translation_notes:
  register: Tutoiement conservé, puisque l’exhortation s’adresse personnellement à Polycarpe. Style actuel mais solennel, avec des phrases brèves et une série de titres parallèles. Le grec de la recension moyenne a été pris en compte dans les choix lexicaux; les notes rendent visibles les endroits où le témoin anglais fourni simplifie ou laisse une ambiguïté.
