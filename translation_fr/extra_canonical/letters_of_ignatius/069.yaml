review_pass:
  verdict: revise
  source_fidelity: 'La révision conserve les images et les ambiguïtés du témoin : les « chaînes » du Christ, l’achèvement/perfection, la recherche de refuge dans l’Évangile et les apôtres, ainsi que l’unité de Jésus-Christ. « Je veille à votre sécurité — non pas moi, mais Jésus-Christ » laisse toutefois le rapport syntaxique trop elliptique en français : la correction rend explicitement, sans ajout interprétatif, que l’action est attribuée au Christ. « Auprès de Dieu » rend plus naturellement le complément signalé par le témoin entre crochets, sans prétendre résoudre définitivement la question textuelle grecque.'
  naturalness: Le texte proposé est globalement fluide et d’un registre juste. Les corrections améliorent principalement l’enchaînement de la première phrase et remplacent « ont reçu l’approbation » par le passif plus direct « ont été approuvés ».
  terminology: « Conseil des anciens » demeure une bonne solution moderne et non confessionnellement surdéterminée pour « presbytery ». « Évangile », « chair », « apôtres », « prophètes », « héritage » et « miséricorde » sont conservés. « Comptés ensemble dans l’Évangile » maintient la formulation dense du témoin tout en restant plus proche de « numbered together » que « comptés dans ».
  issues:
  - severity: medium
    issue: Attribution elliptique de l’action protectrice
    rationale: Dans « je veille à votre sécurité — non pas moi, mais Jésus-Christ », le français peut faire de « Jésus-Christ » une simple apposition plutôt que le véritable agent de l’action. Le témoin oppose précisément Ignace au Christ comme celui qui assure leur sûreté.
  - severity: low
    issue: Rendu du complément critique [unto God]
    rationale: « Pour Dieu » est possible mais peu idiomatique dans ce contexte. « Auprès de Dieu » exprime naturellement l’orientation de la prière tout en conservant l’incertitude signalée par les crochets du témoin.
  - severity: low
    issue: Rendu de « numbered together »
    rationale: « Comptés dans » atténue l’élément collectif de « together ». « Comptés ensemble dans l’Évangile » le préserve sans expliquer la formule.
  revised_text: 'Mes frères, mon cœur déborde entièrement d’amour pour vous. Dans une joie sans mesure, je veille sur votre sécurité — ou plutôt, ce n’est pas moi, mais Jésus-Christ. Portant ses chaînes, j’éprouve d’autant plus de crainte que je ne suis pas encore parvenu à la perfection. Mais votre prière me rendra parfait [auprès de Dieu][a], afin que j’obtienne l’héritage dans lequel j’ai trouvé miséricorde, en cherchant refuge dans l’Évangile comme dans la chair de Jésus, et dans les apôtres comme dans le conseil des anciens de l’Église.


    Oui, nous aimons aussi les prophètes, parce qu’eux aussi ont annoncé l’Évangile par leur prédication, ont placé leur espérance en lui et l’ont attendu. C’est en croyant en lui qu’ils ont eux aussi été sauvés, dans l’unité de Jésus-Christ. Hommes saints, dignes de tout amour et de toute admiration, ils ont été approuvés par Jésus-Christ et comptés ensemble dans l’Évangile de notre espérance commune.'
  revised_footnotes:
  - marker: a
    text: Les mots « auprès de Dieu » correspondent à un complément placé entre crochets (« unto God ») dans le témoin anglais consulté. Ils signalent une restitution textuelle; une vérification directe du grec reste nécessaire.
    reason: Préserve explicitement le signal critique du témoin sans présenter la restitution comme certaine.
  revision_rationale: Révision limitée à des corrections sûres de syntaxe française et de précision par rapport au témoin anglais. Elle ne tranche aucune question doctrinale et maintient le caractère provisoire du complément textuel signalé entre crochets.
