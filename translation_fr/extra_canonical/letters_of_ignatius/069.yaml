base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: fr
  text: 'Mes frères, mon cœur déborde entièrement d’amour pour vous. Dans une joie sans mesure, je veille à votre sécurité — non pas moi, mais Jésus-Christ. En portant ses chaînes, j’éprouve d’autant plus de crainte que je ne suis pas encore parvenu à la perfection. Mais votre prière me rendra parfait [pour Dieu][a], afin que j’obtienne l’héritage dans lequel j’ai trouvé miséricorde, en cherchant refuge dans l’Évangile comme dans la chair de Jésus, et dans les apôtres comme dans le conseil des anciens de l’Église.


    Oui, nous aimons aussi les prophètes, parce qu’eux aussi ont annoncé l’Évangile par leur prédication, ont placé leur espérance en lui et l’ont attendu. C’est en croyant en lui qu’ils ont eux aussi été sauvés, dans l’unité de Jésus-Christ. Hommes saints, dignes de tout amour et de toute admiration, ils ont reçu l’approbation de Jésus-Christ et ont été comptés dans l’Évangile de notre espérance commune.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « pour Dieu » sont signalés comme une restitution dans le témoin anglais consulté; la vérification directe du grec reste à effectuer.
    reason: Préserver honnêtement le signal critique fourni par le témoin, puisque la révision dans la langue source est encore en attente.
lexical_decisions:
- source_word: safety
  choice: sécurité
  rationale: Conserve le sens général du témoin sans le réduire à la seule notion doctrinale de salut.
- source_word: bonds
  choice: chaînes
  rationale: Exprime naturellement l’emprisonnement d’Ignace tout en gardant la force concrète de l’image.
- source_word: perfected / perfect
  choice: parvenu à la perfection / rendra parfait
  rationale: Préserve la répétition et la tension spirituelle du passage sans préciser abusivement la nature de cette perfection.
- source_word: presbytery
  choice: conseil des anciens
  rationale: Rend la dimension collective du terme et reste intelligible en français moderne sans imposer une structure confessionnelle ultérieure.
- source_word: numbered together
  choice: comptés dans
  rationale: Conserve l’idée d’inclusion ou d’appartenance attestée par le témoin, malgré une formulation source difficile.
theological_decisions:
- issue: « yet not I, but Jesus Christ »
  choice: « non pas moi, mais Jésus-Christ »
  alternative: « ou plutôt, ce n’est pas moi, mais Jésus-Christ »
  rationale: La formulation concise maintient l’écho paulinien et l’affirmation paradoxale de l’action du Christ, sans l’expliquer.
- issue: Rapport entre l’Évangile et la chair de Jésus
  choice: « l’Évangile comme dans la chair de Jésus »
  alternative: « l’Évangile, qui est la chair de Jésus »
  rationale: Le tour comparatif préserve l’analogie du témoin et évite de transformer celle-ci en définition ontologique explicite.
- issue: Salut des prophètes et unité du Christ
  choice: « sauvés, dans l’unité de Jésus-Christ »
  alternative: « sauvés par leur union à Jésus-Christ »
  rationale: La traduction conserve la formulation théologiquement dense et son ambiguïté plutôt que de choisir une interprétation instrumentale.
- issue: Approbation par Jésus-Christ
  choice: « ont reçu l’approbation de Jésus-Christ »
  alternative: « ont été attestés par Jésus-Christ »
  rationale: Rend le sens du témoin avec une expression naturelle, sans préciser si l’approbation est historique, judiciaire ou ecclésiale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste assez soutenue pour une lettre chrétienne ancienne, tout en évitant les archaïsmes. Projet provisoire établi à partir du témoin anglais public fourni; une collation directe avec la tradition grecque de la recension moyenne demeure nécessaire.
