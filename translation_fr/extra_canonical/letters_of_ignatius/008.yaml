base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: fr
  text: 'Certains ont en effet l’habitude de colporter le Nom avec une ruse malveillante, tout en faisant certaines choses indignes de Dieu. Vous devez les éviter comme des bêtes sauvages, car ce sont des chiens enragés qui mordent en cachette. Gardez-vous d’eux, car ils sont difficiles à guérir.


    Il n’y a qu’un seul médecin, à la fois chair et esprit, engendré et inengendré[a], Dieu dans l’homme, vraie vie dans la mort, issu de Marie et de Dieu, d’abord passible puis impassible[b] : Jésus Christ notre Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Engendré et inengendré » reproduit la juxtaposition paradoxale de deux termes grecs. La formule est conservée sans en préciser le cadre théologique.
    reason: Préserve le caractère condensé et disputé de la formule sans imposer une interprétation doctrinale.
  - marker: b
    text: « Passible » signifie ici « susceptible de souffrir » ; « impassible », « non susceptible de souffrir ». La formule conserve la succession exprimée par le texte sans en préciser davantage le cadre théologique.
    reason: Explique des termes techniques peu courants tout en préservant la tension de l’original.
lexical_decisions:
- source_word: the Name
  choice: le Nom
  rationale: La majuscule conserve la référence révérencielle implicite au nom chrétien ou au nom de Jésus sans trancher davantage que le témoin fourni.
- source_word: hawk about / peddle
  choice: colporter
  rationale: « Colporter » exprime la diffusion intéressée ou trompeuse tout en restant naturel en français moderne.
- source_word: physician
  choice: médecin
  rationale: Équivalent direct et courant, conservant l’image christologique de celui qui guérit.
- source_word: of flesh and of spirit
  choice: à la fois chair et esprit
  rationale: Formulation française fluide qui préserve la construction antithétique et l’affirmation des deux réalités.
- source_word: generate and ingenerate
  choice: engendré et inengendré
  rationale: Ces termes techniques maintiennent le paradoxe théologique du témoin au lieu de l’expliciter ou de le résoudre.
- source_word: passible and impassible
  choice: passible puis impassible
  rationale: Le vocabulaire théologique précis conserve l’opposition entre capacité de souffrir et incapacité de souffrir.
theological_decisions:
- issue: Référent du « Nom »
  choice: le Nom
  alternative: le nom de Jésus / le nom chrétien
  rationale: Le témoin ne précise pas explicitement le référent; la traduction conserve cette ambiguïté.
- issue: Rapport entre humanité et divinité du médecin unique
  choice: à la fois chair et esprit, engendré et inengendré, Dieu dans l’homme
  alternative: fait de chair et d’esprit, né et non né, Dieu venu dans l’homme
  rationale: La formulation retenue garde les parallèles fortement condensés et leur tension christologique sans imposer une interprétation ultérieure.
- issue: Succession « d’abord passible puis impassible »
  choice: d’abord passible puis impassible
  alternative: d’abord capable de souffrir, puis incapable de souffrir
  rationale: Les termes techniques sont concis et préservent la portée théologique, tandis que la note les rend accessibles.
- issue: Capitalisation de fils/Fils
  choice: fils de Marie et Fils de Dieu
  alternative: Fils de Marie et Fils de Dieu
  rationale: La variation typographique souligne naturellement en français le titre « Fils de Dieu », sans nier la pleine filiation humaine exprimée par « fils de Marie ».
translation_notes:
  register: Français moderne, digne et lisible, avec tutoiement collectif rendu par « vous ». La première partie emploie un langage concret et vigoureux; la seconde garde le rythme solennel d’une confession christologique. Projet provisoire fondé sur le témoin anglais public fourni, la vérification directe du grec étant signalée comme en attente.
