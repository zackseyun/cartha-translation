base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: fr
  text: 'Je vous exhorte donc — non pas moi, mais l’amour de Jésus-Christ — à ne prendre que de la nourriture chrétienne et à vous abstenir des plantes étrangères, qui sont l’hérésie.


    Car ces gens frelatent même Jésus-Christ avec du poison et trompent les autres sous des dehors respectables, comme ceux qui administrent une drogue mortelle dans du vin miellé : celui qui ne le sait pas en boit sans méfiance et, avec un plaisir funeste, boit la mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: nourriture chrétienne
  rationale: Conserve l’image alimentaire qui structure tout le passage, dans une formulation naturelle en français.
- source_word: strange herbage
  choice: plantes étrangères
  rationale: Préserve le contraste métaphorique avec la nourriture chrétienne et l’idée de végétaux étrangers ou étrangers au bon pâturage.
- source_word: heresy
  choice: hérésie
  rationale: Terme ecclésial direct correspondant au témoin fourni, sans préciser ici une doctrine particulière.
- source_word: show of honesty
  choice: sous des dehors respectables
  rationale: Exprime une apparence trompeuse d’honorabilité dans un français actuel et digne.
- source_word: honeyed wine
  choice: vin miellé
  rationale: Rend concrètement la boisson antique mêlée de miel, tout en gardant l’opposition entre douceur et poison.
- source_word: drinketh in death
  choice: avale la mort
  rationale: Conserve avec force l’image de la mort ingérée plutôt que de l’aplatir en simple conséquence mortelle.
theological_decisions:
- issue: Rapport entre le poison et Jésus-Christ
  choice: mélangent même du poison à Jésus-Christ
  alternative: mélangent même Jésus-Christ à leur poison
  rationale: Le témoin anglais fourni présente une construction susceptible de suggérer que le poison est mêlé à Jésus-Christ. En l’absence de révision directe du grec, la traduction conserve cette formulation et sa tension plutôt que d’en inverser silencieusement les termes.
- issue: Identification des « plantes étrangères »
  choice: c’est-à-dire de l’hérésie
  alternative: qui est l’hérésie
  rationale: Présente l’hérésie comme l’explication de la métaphore sans ajouter de définition confessionnelle.
- issue: Source de l’exhortation
  choice: non pas moi, mais l’amour de Jésus-Christ
  alternative: ce n’est pas moi, mais l’amour de Jésus-Christ qui vous exhorte
  rationale: Maintient la personnification et la correction rhétorique du témoin sans chercher à expliquer leur portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et les images alimentaires et médicinales ont été conservés. Projet provisoire établi à partir du témoin anglais public fourni; une vérification directe de la tradition grecque de la recension moyenne reste nécessaire.
