revisions:
- from: 'Mais je vous avertis de ces choses, bien-aimés, sachant que vous partagez vous-mêmes cette manière de penser. Néanmoins, je veille d’avance sur vous afin de vous protéger des bêtes sauvages à visage humain : des gens que vous devez non seulement refuser d’accueillir, mais, si possible, éviter même de rencontrer. Priez seulement pour eux, dans l’espoir qu’ils puissent se repentir. Cela est certes difficile, mais Jésus-Christ, notre vraie vie, en a le pouvoir.


    Car si notre Seigneur n’a fait ces choses qu’en apparence, moi aussi, je ne suis prisonnier qu’en apparence. Et pourquoi donc me suis-je livré à la mort, au feu, à l’épée, aux bêtes sauvages ? Près de l’épée, près de Dieu ; parmi les bêtes sauvages, avec Dieu. Que ce soit seulement au nom de Jésus-Christ, afin que nous souffrions avec lui. Je supporte tout, puisque c’est lui-même qui m’en donne la force, lui qui est l’être humain parfait.[a]'
  to: 'Mais je vous avertis de ces choses, bien-aimés, sachant que vous partagez vous-mêmes cette manière de penser. Néanmoins, je veille d’avance sur vous afin de vous protéger des bêtes sauvages à forme humaine : des gens que vous ne devez pas seulement refuser d’accueillir, mais, si possible, même ne pas rencontrer. Priez seulement pour eux, afin qu’ils se repentent peut-être. C’est difficile, certes, mais Jésus-Christ, notre vraie vie, le peut.


    Car si notre Seigneur a fait ces choses seulement en apparence, moi aussi je suis enchaîné seulement en apparence. Et pourquoi donc me suis-je livré à la mort, au feu, à l’épée, aux bêtes sauvages ? Près de l’épée, près de Dieu ; avec les bêtes sauvages, avec Dieu. Pourvu que ce soit au nom de Jésus-Christ, afin que je souffre avec lui. Je supporte tout, car c’est lui-même qui me donne la force, lui, l’homme parfait.'
  rationale: 'La révision suit le grec là où il corrige ou précise le témoin anglais : « à forme humaine », « enchaîné », répétition de « avec » et première personne singulière dans la dernière proposition. Elle conserve la force rhétorique, l’avertissement sévère et le caractère non spécifié du pouvoir du Christ. La note [a] est supprimée, car elle signalait seulement le caractère indirect de l’ancienne formulation et n’est plus requise par le texte révisé.'
