    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: fr
  text: 'Mais je vous avertis de ces choses, bien-aimés, sachant que vous partagez vous-mêmes cette manière de penser. Néanmoins, je veille d’avance sur vous afin de vous protéger des bêtes sauvages à forme humaine : des gens que vous ne devez pas seulement refuser d’accueillir, mais, si possible, même ne pas rencontrer. Priez seulement pour eux, afin qu’ils se repentent peut-être. C’est difficile, certes, mais Jésus-Christ, notre vraie vie, le peut.


    Car si notre Seigneur a fait ces choses seulement en apparence, moi aussi je suis enchaîné seulement en apparence. Et pourquoi donc me suis-je livré à la mort, au feu, à l’épée, aux bêtes sauvages ? Près de l’épée, près de Dieu ; avec les bêtes sauvages, avec Dieu. Pourvu que ce soit au nom de Jésus-Christ, afin que je souffre avec lui. Je supporte tout, car c’est lui-même qui me donne la force, lui, l’homme parfait.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία / human-form beasts (as reflected in the witness)
  choice: bêtes sauvages à visage humain
  rationale: Conserve la métaphore violente et l’opposition entre apparence humaine et conduite bestiale, dans un français naturel.
- source_word: δέχεσθαι / receive (as reflected in the witness)
  choice: accueillir
  rationale: Rend l’idée d’admettre ou de recevoir ces personnes dans la communauté sans préciser indûment s’il s’agit d’hospitalité privée ou de communion ecclésiale.
- source_word: μετανοήσωσιν / repent (as reflected in the witness)
  choice: se repentir
  rationale: Terme français courant dans le registre biblique, qui garde l’idée d’un changement moral et spirituel.
- source_word: ἐν δοκήσει / in semblance (as reflected in the witness)
  choice: qu’en apparence
  rationale: Préserve l’enjeu polémique contre l’idée que les souffrances du Seigneur n’auraient été qu’apparentes.
- source_word: τέλειος ἄνθρωπος / perfect human being (as reflected in the witness)
  choice: l’être humain parfait
  rationale: Rend anthrōpos sans le limiter au masculin générique français « homme » et conserve l’affirmation christologique forte.
theological_decisions:
- issue: Nature réelle ou seulement apparente des actes et souffrances du Seigneur
  choice: « n’a fait ces choses qu’en apparence »
  alternative: « a souffert seulement en apparence »
  rationale: Le témoin fourni dit « did these things » ; la traduction conserve cette formulation plus large sans remplacer son référent par une interprétation explicative.
- issue: Sens de « Jésus-Christ… en a le pouvoir »
  choice: Conserver le complément pronominal « en »
  alternative: « peut leur donner de se repentir »
  rationale: Le référent exact du pouvoir reste quelque peu ouvert dans le témoin ; il ne faut pas le réduire silencieusement à une seule opération théologique.
- issue: « perfect Man » appliqué au Christ
  choice: « l’être humain parfait »
  alternative: « l’homme parfait »
  rationale: Cette formulation maintient l’affirmation de l’humanité parfaite du Christ tout en évitant que le masculin français soit compris comme une insistance sur le sexe plutôt que sur l’humanité.
translation_notes:
  register: Français international moderne, digne et direct. Les parallélismes brefs (« Près de l’épée, près de Dieu ») sont conservés pour leur force rhétorique. Le vouvoiement pluriel correspond à l’adresse communautaire. La syntaxe a été modernisée sans atténuer la dureté de l’avertissement ni la tension christologique.
