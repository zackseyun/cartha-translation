  yaml_path: translation/extra_canonical/letters_of_ignatius/064.yaml
  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: fr
  text: Ignace, appelé aussi Théophore, à l’Église de Dieu le Père et de Jésus-Christ qui est à Philadelphie d’Asie. Elle a obtenu miséricorde, elle est fermement établie dans l’harmonie de Dieu et elle trouve sa joie dans la passion de notre Seigneur et dans sa résurrection, sans vaciller, pleinement convaincue de toute miséricorde. Je la salue dans le sang de Jésus-Christ, qui est une joie éternelle et durable, surtout si ses membres sont unis à l’évêque, aux presbytres qui sont avec lui et aux diacres établis selon la pensée de Jésus-Christ. C’est lui qui, conformément à sa propre volonté, les a affermis et établis par son Saint-Esprit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais public fourni. Une vérification directe du texte grec de la recension moyenne reste nécessaire, notamment pour la syntaxe de la dernière phrase.
    reason: Le dossier indique explicitement que l’examen de la langue source est encore en attente; la note rend transparente cette limite textuelle.
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Translittération française traditionnelle du surnom grec, conservée sans en imposer ici une interprétation étymologique.
- source_word: church
  choice: Église
  rationale: « Église » désigne naturellement la communauté chrétienne locale dans ce contexte épistolaire ancien.
- source_word: concord
  choice: harmonie
  rationale: Rend l’idée d’accord profond et d’unité tout en restant naturel en français moderne.
- source_word: passion
  choice: passion
  rationale: Terme chrétien français établi pour les souffrances et la mort de Jésus.
- source_word: presbyters
  choice: presbytres
  rationale: Conserve le titre ancien et évite de trancher silencieusement entre les équivalents confessionnels modernes « prêtres » et « anciens ».
- source_word: mind
  choice: pensée
  rationale: Expression claire et sobre pour l’orientation ou le dessein attribué à Jésus-Christ.
theological_decisions:
- issue: Référent du pronom relatif dans la dernière proposition
  choice: « C’est lui [Jésus-Christ] qui… les [les ministres] a affermis et établis »
  alternative: Comprendre que Jésus-Christ lui-même est celui que Dieu a affermi et établi
  rationale: La syntaxe transmise par le témoin anglais demeure susceptible d’analyse, mais le contexte immédiat des nominations ecclésiales favorise Jésus-Christ comme sujet et les responsables mentionnés comme objet; l’incertitude liée à l’absence de vérification grecque est signalée en note.
- issue: Nature de l’unité avec les responsables
  choice: « si ses membres sont unis à »
  alternative: « s’ils ne font qu’un avec » ou « s’ils obéissent à »
  rationale: Cette formulation exprime la concorde demandée sans ajouter explicitement une notion d’obéissance absente du témoin fourni.
- issue: « Toute miséricorde »
  choice: Maintien de la formule « pleinement convaincue de toute miséricorde »
  alternative: Expliciter « pleinement assurée de la miséricorde »
  rationale: La tournure inhabituelle du témoin peut refléter une expression grecque porteuse d’ambiguïté; elle n’est donc pas normalisée au prix d’une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, digne et lisible. La longue salutation a été divisée en plusieurs phrases pour la clarté, sans supprimer ses relations logiques. Les titres ecclésiaux anciens sont conservés, et les formulations théologiquement ou syntaxiquement tendues ne sont pas harmonisées au-delà de ce que permet le témoin fourni.
