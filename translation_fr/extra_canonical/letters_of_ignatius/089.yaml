  rationale: 'Révision limitée à trois points : « maisonnées » restitue plus précisément household ; la première formule de souhait évite la connotation française d’un adieu définitif ; « et tous, chacun par son nom » conserve l’extension et la dimension nominative de all by name. Les notes nécessaires à la préservation des ambiguïtés sont maintenues, avec une ponctuation française normalisée.'
