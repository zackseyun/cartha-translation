base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: fr
  text: 'Je salue les maisonnées de mes frères, avec leurs femmes et leurs enfants, ainsi que les vierges que l’on appelle veuves.[a] Je vous souhaite force dans la puissance du Père. Philon, qui est avec moi, vous salue.


    Je salue la maisonnée de Tavia, et je prie pour qu’elle soit affermie dans la foi et dans l’amour, selon la chair comme selon l’esprit.[b] Je salue Alcé, nom qui m’est très cher, Daphnus l’incomparable, Eutecnus, et tous, chacun par son nom. Portez-vous bien dans la grâce de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les vierges que l’on appelle veuves » est conservée telle quelle ; elle peut désigner un groupe reconnu dans la communauté, mais son sens précis demeure incertain.
    reason: Signaler une expression historiquement et ecclésiologiquement ambiguë sans imposer une interprétation.
  - marker: b
    text: 'Ou : « dans la foi et dans l’amour, tant charnel que spirituel ». Le rattachement exact de « chair » et « esprit » reste ambigu dans le témoin disponible.'
    reason: Préserver l’ambiguïté syntaxique et théologique de la formule.
lexical_decisions:
- source_word: households
  choice: familles
  rationale: « Familles » rend naturellement l’ensemble domestique visé dans ce contexte de salutations, sans le limiter au bâtiment ni employer le terme plus institutionnel « maisonnées ».
- source_word: virgins who are called widows
  choice: les vierges que l’on appelle veuves
  rationale: Traduction volontairement littérale afin de préserver l’expression énigmatique du témoin et son éventuelle portée communautaire ou ascétique.
- source_word: grounded
  choice: affermie
  rationale: « Affermie » exprime l’idée d’un enracinement stable dans la foi et l’amour en français naturel.
- source_word: both of flesh and of spirit
  choice: selon la chair comme selon l’esprit
  rationale: Cette formulation conserve la distinction entre chair et esprit sans déterminer artificiellement le rapport exact de ces compléments à la foi et à l’amour.
- source_word: all by name
  choice: chacun de vous personnellement
  rationale: Rend le sens d’une salutation individualisée dans une tournure idiomatique moderne.
- source_word: Fare ye well
  choice: Portez-vous bien
  rationale: Formule épistolaire digne et actuelle, distincte du premier « Je vous dis adieu » tout en conservant la nuance de souhait final.
theological_decisions:
- issue: Identité des « vierges appelées veuves »
  choice: Conserver l’expression sans l’expliquer dans le corps du texte
  alternative: Interpréter « veuves » comme le nom d’un ordre ou d’un ministère ecclésial
  rationale: Le témoin fourni ne permet pas de trancher entre une désignation institutionnelle, ascétique ou autre; la traduction préserve donc la tension historique.
- issue: Rapport de « chair » et « esprit » à la foi et à l’amour
  choice: 'Maintenir un parallélisme ouvert : « dans la foi et dans l’amour, selon la chair comme selon l’esprit »'
  alternative: Comprendre exclusivement un amour à la fois corporel et spirituel
  rationale: La syntaxe transmise peut laisser ouverte la portée des deux compléments; il convient de ne pas résoudre silencieusement cette ambiguïté.
- issue: Puissance du Père
  choice: « dans la puissance du Père »
  alternative: « par la puissance du Père »
  rationale: « Dans » conserve la formulation du témoin et peut évoquer la sphère ou la force dans laquelle l’adieu est donné, sans la réduire à un simple moyen.
translation_notes:
  register: Français international moderne, chaleureux et digne, avec un ton épistolaire ancien mais intelligible. Les noms propres suivent les formes du témoin fourni. Comme la révision directe du grec est indiquée comme encore à venir, les choix restent étroitement fondés sur le témoin anglais public et évitent les reconstructions non vérifiables.
