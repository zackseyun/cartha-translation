base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: fr
  text: 'Car si, en peu de temps, j’ai eu avec votre évêque de telles relations — non selon les hommes, mais selon l’Esprit —, combien plus je vous félicite, vous qui lui êtes étroitement unis, comme l’Église l’est à Jésus-Christ et comme Jésus-Christ l’est au Père, afin que tout soit en harmonie dans l’unité.


    Que personne ne s’égare. Si quelqu’un n’est pas à l’intérieur de l’enceinte de l’autel, il est privé du pain de Dieu. Car si la prière de l’un et de l’autre a une si grande force, combien plus celle de l’évêque et de toute l’Église !


    Celui donc qui ne se réunit pas avec l’assemblée montre déjà son orgueil et s’est séparé lui-même ; car il est écrit : « Dieu s’oppose aux orgueilleux. » Efforçons-nous donc de ne pas nous opposer à l’évêque, afin que nous soyons soumis à Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: converse / fellowship (Greek review pending)
  choice: communion
  rationale: « Communion » exprime ici une relation et une participation spirituelles plus fortes qu’une simple conversation, tout en restant naturel dans ce contexte ecclésial.
- source_word: within the precinct of the altar
  choice: dans l’enceinte de l’autel
  rationale: Cette formulation conserve l’image spatiale et cultuelle du témoin sans la réduire d’emblée à une interprétation institutionnelle précise.
- source_word: congregation
  choice: assemblée
  rationale: « Assemblée » désigne naturellement la communauté réunie et évite le sens moderne plus restreint que peut prendre « congrégation ».
- source_word: resisteth
  choice: s’oppose à / nous opposer à
  rationale: Le même champ lexical est conservé dans la citation et dans son application à l’évêque.
theological_decisions:
- issue: Nature de l’union avec l’évêque
  choice: « étroitement unis »
  alternative: « attachés à lui »
  rationale: Le choix garde la force de l’unité ecclésiale et son parallèle christologique sans préciser davantage la nature de cette union.
- issue: Sens de « l’enceinte de l’autel »
  choice: conserver la métaphore cultuelle
  alternative: interpréter explicitement comme être hors de l’Église ou de l’eucharistie
  rationale: La formulation imagée est théologiquement chargée et potentiellement polysémique ; la traduction ne doit pas trancher silencieusement.
- issue: « pain de Dieu »
  choice: retenu dans le texte avec note
  alternative: « pain » sans complément
  rationale: Le complément est présent comme variante ou explicitation dans le témoin fourni ; il est conservé tout en signalant l’incertitude due à l’absence de vérification grecque directe.
- issue: Soumission à l’évêque et don à Dieu
  choice: « par notre soumission, nous nous donnions à Dieu »
  alternative: « en nous soumettant, nous soyons soumis à Dieu »
  rationale: Cette formulation respecte le mouvement du témoin vers l’offrande de soi à Dieu, sans assimiler purement et simplement les deux relations.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe légèrement solennelle adaptée à une lettre chrétienne ancienne. Le texte demeure provisoire, car le dossier fourni repose sur un témoin anglais du domaine public et indique que la vérification directe du grec de la recension moyenne reste à faire.
