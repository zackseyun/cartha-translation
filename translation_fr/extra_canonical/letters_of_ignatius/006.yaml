revisions:
- from: 'Car si, en peu de temps, j’ai eu avec votre évêque une telle communion — non pas d’une manière purement humaine, mais dans l’Esprit —, combien plus je vous félicite, vous qui lui êtes étroitement unis, comme l’Église l’est à Jésus-Christ et Jésus-Christ au Père, afin que tout s’accorde dans l’unité.


    Que personne ne se laisse tromper. Si quelqu’un se tient hors de l’enceinte de l’autel, il se prive du pain de Dieu[a]. Car si la prière de deux personnes a une si grande force, combien plus celle de l’évêque et de toute l’Église !


    Ainsi, celui qui ne vient pas à l’assemblée manifeste par là son orgueil et s’est lui-même séparé, car il est écrit : « Dieu s’oppose aux orgueilleux. » Veillons donc à ne pas nous opposer à l’évêque, afin que, par notre soumission, nous nous donnions à Dieu.'
  to: 'Car si, en peu de temps, j’ai eu avec votre évêque de telles relations — non selon les hommes, mais selon l’Esprit —, combien plus je vous félicite, vous qui lui êtes étroitement unis, comme l’Église l’est à Jésus-Christ et comme Jésus-Christ l’est au Père, afin que tout soit en harmonie dans l’unité.


    Que personne ne s’égare. Si quelqu’un n’est pas à l’intérieur de l’enceinte de l’autel, il est privé du pain de Dieu. Car si la prière de l’un et de l’autre a une si grande force, combien plus celle de l’évêque et de toute l’Église !


    Celui donc qui ne se réunit pas avec l’assemblée montre déjà son orgueil et s’est séparé lui-même ; car il est écrit : « Dieu s’oppose aux orgueilleux. » Efforçons-nous donc de ne pas nous opposer à l’évêque, afin que nous soyons soumis à Dieu.'
  rationale: 'Révision fondée sur le texte grec de la recension moyenne : suppression de l’incertitude artificielle sur « pain de Dieu »; remplacement de « communion » par « relations » pour éviter une précision théologique non imposée; rendu plus direct de l’appel à se réunir et de la subordination finale à Dieu. Le parallèle « Église / Jésus-Christ / Père » et l’ambiguïté cultuelle de « l’enceinte de l’autel » sont préservés.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:15:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le grec de la recension moyenne confirme « le pain de Dieu » (τοῦ ἄρτου τοῦ θεοῦ) sans crochets ni incertitude textuelle à signaler ici. Il confirme aussi « venir au même lieu / se réunir » (ἐπὶ τὸ αὐτό), plutôt que simplement « venir à l’assemblée ». « Communion » pour συνήθεια surinterprète légèrement une relation de fréquentation ou de familiarité; « relations » est plus fidèle. La formulation finale doit rendre le passif/subjonctif ὑποταγῶμεν : « que nous soyons soumis à Dieu », non l’idée d’un don volontaire de soi.'
  naturalness: La révision proposée reste naturelle en français international moderne, avec un registre sobre et approprié à une lettre chrétienne ancienne. « Se réunir avec l’assemblée » rend clairement le mouvement communautaire sans recourir à un jargon institutionnel.
  terminology: « Évêque », « Église », « autel » et « Esprit » sont conservés. « Étroitemment unis » convient pour συνκεκραμένους, dont l’image est celle d’une union très étroite. « Soumis à Dieu » conserve la distinction textuelle entre ne pas s’opposer à l’évêque et être soumis à Dieu.
  issues:
  - severity: medium
    issue: Note et crochets indus à « pain de Dieu »
    rationale: Le grec attesté porte explicitement τοῦ ἄρτου τοῦ θεοῦ (« du pain de Dieu »). La note actuelle, fondée sur la réserve du témoin anglais, maintient une incertitude qui n’est pas justifiée par la source grecque.
  - severity: medium
    issue: « Communion » pour συνήθεια
    rationale: Le mot grec désigne la fréquentation, les relations ou la familiarité. « Communion » peut introduire une connotation sacramentelle ou ecclésiologique plus spécifique que le texte ne l’exige.
  - severity: medium
    issue: Rendu de ἐπὶ τὸ αὐτό et de ὑποταγῶμεν
    rationale: « Venir à l’assemblée » atténue l’idée de se réunir en un même lieu. « Nous nous donnions à Dieu » ne rend pas directement « que nous soyons soumis à Dieu ».
