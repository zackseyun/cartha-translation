review_pass:
  verdict: revise
  source_fidelity: Le témoin anglais est suivi dans l’ensemble. La formulation « s’enracine » ajoutait cependant une image absente du témoin (« is established within you »), et « œuvres » réduisait indûment « things » à des actes. La vérification directe du grec de la recension moyenne reste nécessaire, notamment pour la formule d’auto-offrande.
  naturalness: La révision rend plus naturellement « the church of you Ephesians » par « l’Église des Éphésiens » et « famous unto all the ages » par « illustre à travers tous les siècles ». Elle conserve un registre moderne, solennel et accessible.
  terminology: « Chair », « Esprit », « foi », « infidélité » et « en Jésus Christ » sont conservés. « Ce qui relève de » évite de transformer les réalités ou sphères opposées du texte en simples « œuvres », tout en restant idiomatique.
  issues:
  - severity: medium
    issue: « s’enracine » pour « is established within you »
    rationale: L’enracinement introduit une métaphore et une nuance de croissance durable qui ne figurent pas dans le témoin fourni. « Demeure en vous » est plus sobre et couvre l’idée d’une disposition installée.
  - severity: medium
    issue: « accomplir les œuvres de l’Esprit/de la chair » pour « do the things of »
    rationale: « Œuvres » et « accomplir » explicitent et resserrent le sens sur des actes. Le parallélisme porte plus largement sur ce qui relève de chacune des sphères opposées.
  - severity: low
    issue: « votre Église, Éphésiens »
    rationale: Cette apposition vocative est lourde en français moderne. « l’Église des Éphésiens » restitue clairement le groupe désigné sans modifier le sens.
  revised_text: 'Que personne donc ne vous égare — et, de fait, vous ne vous laissez pas égarer — puisque vous appartenez entièrement à Dieu. Car, lorsqu’aucun désir capable de vous tourmenter ne demeure en vous, alors vous vivez vraiment selon Dieu. Je me dévoue pour vous[a] et je m’offre en sacrifice pour l’Église des Éphésiens, illustre à travers tous les siècles.


    Ceux qui sont de la chair ne peuvent faire ce qui relève de l’Esprit, pas plus que ceux qui sont de l’Esprit ne peuvent faire ce qui relève de la chair. De même, la foi ne peut faire ce qui relève de l’infidélité, ni l’infidélité ce qui relève de la foi. Bien plus, même ce que vous faites selon la chair est spirituel, car vous faites tout en Jésus Christ.'
  revised_footnotes:
  - marker: a
    text: La formulation précise devra être vérifiée directement dans le grec de la recension moyenne. Le témoin anglais public fourni peut également se comprendre dans le sens de « se consacrer » ou de « se dévouer » pour quelqu’un.
    reason: La version de travail dépend d’un témoin anglais, tandis que la vérification directe du grec est explicitement indiquée comme restant à faire.
  revision_rationale: Les corrections retirent des images ou précisions non exigées par le témoin anglais, améliorent la syntaxe française et préservent le parallélisme rhétorique ainsi que la tension non résolue entre « chair » et « Esprit ». La note est maintenue, car l’expression d’auto-offrande demande un contrôle direct de la tradition grecque avant toute précision lexicale ou doctrinale.
