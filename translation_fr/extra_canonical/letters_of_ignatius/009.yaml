source:
  text: 'Let no one therefore deceive you, as indeed ye are not deceived, seeing that ye belong wholly to God. For when no lust is established in you, which hath power to torment you, then truly ye live after God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians which is famous unto all the ages.


    They that are of the flesh cannot do the things of the Spirit, neither can they that are of the Spirit do the things of the flesh; even as faith cannot do the things of unfaithfulness, neither unfaithfulness the things of the faith. Nay, even those things which ye do after the flesh are spiritual; for ye do all things in Jesus Christ.'
