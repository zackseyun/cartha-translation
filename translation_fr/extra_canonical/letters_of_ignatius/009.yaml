base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: fr
  text: 'Que personne donc ne vous égare — et de fait, vous ne vous laissez pas égarer — puisque vous appartenez entièrement à Dieu. En effet, lorsqu’aucun désir capable de vous tourmenter ne s’enracine en vous, alors vous vivez vraiment selon Dieu. Je me donne pour vous[a] et je m’offre en sacrifice pour votre Église, Éphésiens, elle qui est renommée à travers tous les âges.


    Ceux qui sont selon la chair ne peuvent accomplir les œuvres de l’Esprit, et ceux qui sont selon l’Esprit ne peuvent accomplir les œuvres de la chair. De même, la foi ne peut accomplir les œuvres de l’infidélité, ni l’infidélité celles de la foi. Bien plus, même ce que vous faites selon la chair est spirituel, car vous faites tout en Jésus Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens exact de cette formule devra être vérifié directement dans le grec de la recension moyenne; le témoin anglais peut aussi suggérer l’idée de se consacrer ou de se dévouer pour quelqu’un.
    reason: La rédaction repose ici sur un témoin anglais public et l’examen direct de la source grecque reste en attente.
lexical_decisions:
- source_word: lust / desire (Greek review pending)
  choice: désir
  rationale: « Désir » conserve une portée plus large et moins exclusivement sexuelle que « convoitise », conformément au témoin anglais, tout en laissant la proposition relative préciser son caractère nuisible.
- source_word: is established within you
  choice: s’enracine en vous
  rationale: Expression française naturelle qui rend l’idée d’une disposition prenant durablement place en quelqu’un, sans réduire le sens à une émotion passagère.
- source_word: live after God
  choice: vivez vraiment selon Dieu
  rationale: « Selon Dieu » préserve la formulation théologique et le parallélisme ultérieur avec « selon la chair » et « selon l’Esprit ».
- source_word: things of the Spirit / flesh
  choice: œuvres de l’Esprit / de la chair
  rationale: « Œuvres » exprime ici les actes ou conduites produits dans chaque domaine et donne un français plus net que le calque « choses ».
- source_word: unfaithfulness
  choice: infidélité
  rationale: Ce choix maintient l’opposition lexicale directe avec « foi » sans préciser indûment s’il s’agit surtout d’incrédulité, de manque de fidélité ou des deux.
- source_word: in Jesus Christ
  choice: en Jésus Christ
  rationale: La préposition « en » conserve l’expression d’union ou de sphère christologique sans la paraphraser.
theological_decisions:
- issue: Opposition entre la chair et l’Esprit
  choice: Conserver les expressions « selon la chair » et « selon l’Esprit » ainsi que leur tension avec la phrase finale.
  alternative: Paraphraser « chair » par « nature humaine pécheresse » et expliquer la phrase finale comme visant uniquement les actes corporels.
  rationale: Le passage affirme à la fois une incompatibilité et que certaines actions « selon la chair » sont spirituelles parce qu’elles sont faites en Christ. Une paraphrase doctrinale résoudrait prématurément cette tension.
- issue: Rapport entre foi et infidélité
  choice: Maintenir une opposition abstraite entre « foi » et « infidélité ».
  alternative: Employer « croyants » et « incroyants », ou « foi » et « incrédulité ».
  rationale: Le témoin présente les qualités ou sphères elles-mêmes comme sujets; cette personnification et l’ambiguïté d’« unfaithfulness » méritent d’être conservées.
- issue: Langage sacrificiel d’Ignace
  choice: Traduire « je me donne » et « je m’offre en sacrifice », avec une note sur l’incertitude de la première expression.
  alternative: Neutraliser en « je me dévoue à vous » ou préciser une conception particulière du martyre.
  rationale: Le langage d’offrande est explicite, mais il ne faut ni l’atténuer ni lui imposer une doctrine du martyre non établie par le témoin fourni.
translation_notes:
  register: Français international moderne, digne et accessible. Les parallèles rhétoriques ont été conservés. Le vocabulaire traditionnel « chair », « Esprit » et « en Jésus Christ » est maintenu en raison de sa densité théologique. Cette version demeure provisoire puisque la vérification directe de la tradition grecque de la recension moyenne est signalée comme non effectuée.
