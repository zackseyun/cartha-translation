review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le grec de la recension moyenne porte οἰκοφθόροι (« corrupteurs/destructeurs de foyers »), τὰ κατὰ σάρκα πράσσοντες (« ceux qui accomplissent les actes selon la chair ») et ἐν ῥυπαρίᾳ ὤν (« étant dans la souillure »). Le projet affaiblit ou déplace ces formulations en « des familles », « dans leur corps » et « qui s’est souillé ».
  naturalness: Le français est globalement fluide et conserve un registre d’avertissement solennel. « Selon la chair » est ici plus fidèle que « dans leur corps » et demeure idiomatique dans un texte chrétien ancien. « Corrupteurs de foyers » est volontairement proche du terme grec tout en restant compréhensible.
  terminology: « Royaume de Dieu », « mauvais enseignement », « la foi de Dieu » et « feu qui ne s’éteint pas » sont appropriés. « La foi de Dieu » conserve correctement l’ambiguïté du génitif grec πίστin θεοῦ; il ne convient pas de le transformer en « foi en Dieu ».
  issues:
  - severity: medium
    issue: « dans leur corps » pour « after/according to the flesh »
    rationale: Le grec κατὰ σάρκα ne désigne pas simplement le corps. « Selon la chair » préserve l’expression et son contraste rhétorique avec la corruption par enseignement.
  - severity: medium
    issue: « des familles » pour οἰκοφθόροι
    rationale: οἶκος vise le foyer/maisonnée. « Familles » peut être recevable par extension, mais « foyers » conserve plus exactement l’image sans réduire ou préciser indûment le tort en cause.
  - severity: low
    issue: « qui s’est souillé » pour ἐν ῥυπαρίᾳ ὤν
    rationale: Le participe exprime l’état d’être dans la souillure, non explicitement l’acte réflexif de se souiller. « Étant dans la souillure » maintient cette nuance.
  - severity: low
    issue: Note provisoire devenue trop large et ancrée en fin de passage
    rationale: Une note signalant une absence de contrôle grec n’est plus justifiée pour les expressions corrigées; l’ambiguïté réellement pertinente, « la foi de Dieu », peut être laissée non résolue dans le texte sans note.
  revised_text: 'Ne vous y trompez pas, mes frères. Les corrupteurs de foyers n’hériteront pas du royaume de Dieu.


