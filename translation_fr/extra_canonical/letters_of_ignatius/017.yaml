source:
  text: 'Be not deceived, my brethren. Corrupters of houses shall not inherit the kingdom of God.


    If then they which do these things after the flesh are put to death, how much more if a man through evil doctrine corrupt the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, shall go into the unquenchable fire; and in like manner also shall he that hearkeneth unto him.'
