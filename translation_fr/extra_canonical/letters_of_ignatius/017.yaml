base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: fr
  text: 'Ne vous y trompez pas, mes frères. Les corrupteurs de foyers n’hériteront pas du royaume de Dieu.


    Si donc ceux qui accomplissent les actes selon la chair sont mis à mort, combien plus sévère sera le sort de celui qui, par un mauvais enseignement, corrompt la foi de Dieu pour laquelle Jésus Christ a été crucifié ! Cet homme, étant dans la souillure, ira dans le feu qui ne s’éteint pas ; et il en sera de même de celui qui l’écoute.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corrupters of houses
  choice: ceux qui corrompent des familles
  rationale: « Familles » rend ici le foyer humain plutôt que le bâtiment ; le sens précis reste toutefois tributaire du témoin anglais fourni, dans l’attente d’un contrôle du grec.
- source_word: after the flesh
  choice: dans leur corps
  rationale: Formulation française naturelle qui conserve l’opposition entre des actes corporels et la corruption doctrinale évoquée ensuite, sans charger « chair » d’une interprétation théologique étrangère au passage.
- source_word: evil doctrine
  choice: un enseignement mauvais
  rationale: Rend la transmission d’une doctrine nuisible en français courant et digne.
- source_word: the faith of God
  choice: la foi de Dieu
  rationale: Maintient la formulation ambiguë du témoin, qui peut désigner la foi venant de Dieu, tournée vers Dieu ou lui appartenant, sans trancher.
- source_word: unquenchable fire
  choice: le feu qui ne s’éteint pas
  rationale: Expression claire et directe conservant l’image eschatologique sans paraphrase doctrinale.
- source_word: hearkeneth unto him
  choice: celui qui l’écoute
  rationale: Conserve la responsabilité attribuée à l’auditeur qui prête attention à cet enseignement.
theological_decisions:
- issue: Sens de « la foi de Dieu »
  choice: Conserver « la foi de Dieu »
  alternative: « la foi en Dieu » ou « la foi qui vient de Dieu »
  rationale: Le témoin anglais ne permet pas de résoudre avec certitude le rapport exprimé par le génitif grec sous-jacent ; la traduction préserve donc la tension.
- issue: Comparaison des sanctions
  choice: Expliciter « combien plus sévère sera le sort »
  alternative: 'Calque elliptique : « combien plus si quelqu’un… »'
  rationale: L’ellipse comparative est peu naturelle en français. L’explicitation reste générale et n’ajoute pas une sanction précise avant la mention du feu.
- issue: Responsabilité de l’auditeur
  choice: Maintenir qu’il subit le même sort
  alternative: Atténuer en simple avertissement
  rationale: Le témoin affirme explicitement un sort analogue pour celui qui écoute ; cette force est conservée.
translation_notes:
  register: Français international moderne, direct et solennel. « Mes frères » conserve l’adresse fraternelle ancienne. La syntaxe a été légèrement dépliée pour rester intelligible, sans neutraliser l’avertissement ni ses tensions théologiques.
