revisions:
- from: 'Ne vous y trompez pas, mes frères. Ceux qui corrompent des familles n’hériteront pas du royaume de Dieu.


    Si ceux qui commettent de tels actes dans leur corps sont mis à mort, combien plus sévère sera le sort de celui qui, par un enseignement mauvais, corrompt la foi de Dieu pour laquelle Jésus-Christ a été crucifié ! Cet homme, qui s’est souillé, ira dans le feu qui ne s’éteint pas ; il en sera de même pour celui qui l’écoute.[a]'
  to: 'Ne vous y trompez pas, mes frères. Les corrupteurs de foyers n’hériteront pas du royaume de Dieu.


    Si donc ceux qui accomplissent les actes selon la chair sont mis à mort, combien plus sévère sera le sort de celui qui, par un mauvais enseignement, corrompt la foi de Dieu pour laquelle Jésus Christ a été crucifié ! Cet homme, étant dans la souillure, ira dans le feu qui ne s’éteint pas ; et il en sera de même de celui qui l’écoute.'
  rationale: Le texte est ajusté aux expressions grecques attestées, tout en conservant la structure argumentative et la force de l’avertissement. « Combien plus sévère sera le sort » explicite sobrement l’ellipse comparative sans définir une doctrine de la peine. La formulation ambiguë « la foi de Dieu » est maintenue, de même que l’image du feu inextinguible et la responsabilité analogue de l’auditeur.
