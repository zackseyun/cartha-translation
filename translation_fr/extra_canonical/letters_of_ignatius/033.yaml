revisions:
- from: 'Ne restons donc pas insensibles à sa bonté. Car s’il nous traitait comme nous agissons, nous serions perdus. Puisque nous sommes devenus ses disciples, apprenons donc à vivre selon le christianisme[a]. En effet, quiconque porte un autre nom que celui-là n’appartient pas à Dieu.


    Rejetez donc le mauvais levain, devenu vieux et aigre, et passez au levain nouveau, qui est Jésus Christ. Soyez salés en lui, afin qu’aucun de vous ne se corrompe, car c’est à votre odeur que vous serez reconnus.


    Il est inconcevable de parler de Jésus Christ tout en judaïsant[b]. Car ce n’est pas le christianisme qui a cru au judaïsme, mais le judaïsme qui a cru au christianisme, dans lequel toute langue qui a cru a été rassemblée auprès de Dieu.'
  to: 'Ne restons donc pas insensibles à sa bonté. Car, s’il nous imitait selon nos actes, nous serions perdus. Puisque nous sommes devenus ses disciples, apprenons donc à vivre selon le christianisme[a]. En effet, quiconque est appelé d’un autre nom que celui-ci n’appartient pas à Dieu.



    Rejetons donc le mauvais levain, devenu vieux et aigre, et tournons-nous vers le levain nouveau, qui est Jésus Christ. Soyez salés en lui, afin qu’aucun parmi vous ne pourrisse, car votre odeur vous démasquera.



    Il est absurde de parler de Jésus Christ et de judaïser[b]. Car ce n’est pas le christianisme qui a cru au judaïsme, mais le judaïsme qui a cru au christianisme, dans lequel toute langue ayant cru en Dieu a été rassemblée.'
  rationale: 'La révision corrige le sens de deux constructions grecques : le verbe ἐλεγχθήσεσθε, qui évoque le fait d’être confondu ou démasqué par son « odeur », et εἰς θεόν, qui se rattache à l’acte de croire. Elle rapproche aussi « ἄτοπον » de « absurde ». Les formulations sur le christianisme et le judaïsme restent délibérément proches de la rhétorique d’Ignace, sans étendre sa polémique à une affirmation ethnique ou universelle sur les Juifs.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur deux points déterminants : ἐλεγχθήσεσθε signifie « vous serez confondus / pris en défaut / démasqués », non « vous serez reconnus » ; et εἰς θεόν dépend de « croire » (πιστεύσασα), non du rassemblement. Le texte conserve par ailleurs correctement les images du levain, du sel et de la putréfaction, ainsi que la personnification polémique de « judaïsme » et « christianisme ».'
  naturalness: Le français est globalement moderne et lisible. « C’est à votre odeur que vous serez reconnus » est néanmoins à la fois imprécis et peu naturel dans ce contexte ; « votre odeur vous démasquera » rend avec plus de vigueur le sens judiciaire d’ἐλέγχω. « Il est absurde » est plus direct et idiomatique pour ἄτοπον que « il est inconcevable ».
  terminology: « Christianisme », « judaïsme », « judaïser », « levain » et « Jésus Christ » sont des choix justes. Les notes conservent utilement le caractère historique et polémique de « judaïser » sans ethniciser le terme. « Toute langue » préserve l’ambiguïté collective et confessionnelle de πᾶσα γλῶσσα.
  issues:
  - severity: high
    issue: « car c’est à votre odeur que vous serez reconnus »
    rationale: 'Le grec ἀπὸ τῆς ὀσμῆς ὑμῶν ἐλεγχθήσεσθε emploie ἐλέγχω : être convaincu, confondu, mis en évidence ou démasqué. « Reconnus » neutralise ce sens d’exposition/conviction.'
  - severity: high
    issue: « toute langue qui a cru a été rassemblée auprès de Dieu »
    rationale: 'Dans ἐν ᾧ πᾶσα γλῶσσα πιστεύσασα εἰς θεὸν συνήχθη, εἰς θεόν complète πιστεύσασα : « toute langue ayant cru en Dieu ». Le rassemblement a lieu « dans » le christianisme (ἐν ᾧ), et non « auprès de Dieu ».'
  - severity: low
    issue: « Il est inconcevable » pour ἄτοπον
    rationale: Le terme désigne ce qui est déplacé, aberrant ou absurde. « Absurde » restitue plus précisément la dénonciation rhétorique et demeure naturel en français contemporain.
