base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: fr
  text: 'Ne restons donc pas insensibles à sa bonté. Car, s’il nous imitait selon nos actes, nous serions perdus. Puisque nous sommes devenus ses disciples, apprenons donc à vivre selon le christianisme[a]. En effet, quiconque est appelé d’un autre nom que celui-ci n’appartient pas à Dieu.



    Rejetons donc le mauvais levain, devenu vieux et aigre, et tournons-nous vers le levain nouveau, qui est Jésus Christ. Soyez salés en lui, afin qu’aucun parmi vous ne pourrisse, car votre odeur vous démasquera.



    Il est absurde de parler de Jésus Christ et de judaïser[b]. Car ce n’est pas le christianisme qui a cru au judaïsme, mais le judaïsme qui a cru au christianisme, dans lequel toute langue ayant cru en Dieu a été rassemblée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « christianisme » désigne la foi chrétienne comme manière de vivre et comme appartenance confessée, et non seulement une religion institutionnelle au sens moderne.
    reason: Éviter qu’un terme ancien soit lu uniquement selon son sens sociologique moderne.
  - marker: b
    text: « Judaïser » signifie ici adopter ou pratiquer les observances religieuses juives. Le terme appartient à la polémique chrétienne ancienne de ce passage et ne désigne pas une origine ethnique.
    reason: Clarifier la portée historique et religieuse du verbe sans effacer la dureté de l’opposition formulée par Ignace.
lexical_decisions:
- source_word: χρηστότης (reflected by “goodness” in the supplied witness)
  choice: bonté
  rationale: Terme français naturel qui conserve l’idée de bienveillance morale et active.
- source_word: Χριστιανισμός
  choice: christianisme
  rationale: Reprend le nom abstrait employé par Ignace pour la manière de vivre et la confession chrétiennes, sans le réduire au sens moderne d’une institution.
- source_word: ζύμη
  choice: levain
  rationale: Conserve l’image concrète et biblique opposant l’ancien levain altéré au levain nouveau identifié à Jésus Christ.
- source_word: ἁλίζω / image of salting
  choice: Soyez salés en lui
  rationale: Maintient la métaphore volontairement frappante du sel, même si elle est moins idiomatique en français.
- source_word: ὀσμή
  choice: odeur
  rationale: Préserve le lien organique avec la corruption et l’épreuve ou reconnaissance par ce qui se dégage d’une personne.
- source_word: ἰουδαΐζειν
  choice: judaïser
  rationale: Le verbe désigne ici l’adoption ou la pratique de coutumes religieuses juives; le terme français conserve la distinction entre pratique et identité ethnique.
- source_word: ἄτοπον
  choice: inconcevable
  rationale: Rend la forte idée d’incongruité ou d’incompatibilité sans introduire la connotation biologique moderne de « monstrueux ».
- source_word: πᾶσα γλῶσσα
  choice: toute langue
  rationale: Conserve l’expression scripturaire pouvant évoquer à la fois les peuples de toute langue et toute voix confessante.
theological_decisions:
- issue: Sens de « vivre selon le christianisme »
  choice: Conserver « christianisme » et expliquer qu’il s’agit ici d’une manière de vivre et d’une confession.
  alternative: « vivre en chrétiens »
  rationale: La formulation nominale fait écho à l’opposition structurante entre christianisme et judaïsme dans le passage.
- issue: « porter un autre nom » et appartenance à Dieu
  choice: Traduction littérale sans préciser quel autre nom est visé.
  alternative: Expliciter « un autre nom que celui de chrétien » ou identifier un groupe particulier.
  rationale: Le passage lie probablement le nom au christianisme, mais l’expression conserve une certaine généralité qu’il ne faut pas résoudre dogmatiquement.
- issue: Opposition entre christianisme et judaïsme
  choice: Préserver la formulation polémique d’Ignace tout en signalant que « judaïser » décrit ici une pratique religieuse.
  alternative: Atténuer en « suivre certaines coutumes juives » ou généraliser en une opposition entre grâce et légalisme.
  rationale: L’atténuation effacerait la tension historique du texte, tandis que la généralisation importerait une grille théologique absente de la formulation.
- issue: Direction de la foi entre judaïsme et christianisme
  choice: « le judaïsme qui a cru au christianisme »
  alternative: « des Juifs ont cru au christianisme »
  rationale: La personnification et l’asymétrie rhétorique du texte doivent être conservées, sans les transformer en affirmation sur tous les Juifs.
- issue: Lieu du rassemblement final
  choice: « auprès de Dieu »
  alternative: « en Dieu »
  rationale: Le témoin anglais donne « unto God »; « auprès de Dieu » garde le mouvement ou l’orientation sans trancher une nuance grecque qui devra être vérifiée directement.
translation_notes:
  register: Français international moderne, digne et lisible. Les métaphores du levain, du sel, de la corruption et de l’odeur sont conservées plutôt que lissées. La structure argumentative et la polémique ancienne restent visibles. Le dossier fourni identifie explicitement le témoin anglais comme base provisoire et indique que la révision directe du grec est encore en attente; les choix devront donc être contrôlés sur la tradition grecque de la recension moyenne avant publication définitive.
