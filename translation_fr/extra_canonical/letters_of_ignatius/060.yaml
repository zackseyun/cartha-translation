  terminology: « prince de ce monde », « dispositions envers Dieu », « eau vive », « chair », « descendance de David » et « amour impérissable » sont appropriés. « Feu d’amour de la matière » restitue plus directement l’image du grec sans imposer une interprétation doctrinale.
