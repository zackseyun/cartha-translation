base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: fr
  text: 'Le prince de ce monde veut me mettre en pièces et corrompre mes dispositions envers Dieu. Que nul d’entre vous qui êtes présents ne lui vienne donc en aide. Rangez-vous plutôt de mon côté, c’est-à-dire du côté de Dieu. Ne parlez pas de Jésus Christ tout en désirant le monde. Que l’envie ne demeure pas en vous.


    Même si moi-même, étant auprès de vous, je vous suppliais, ne m’obéissez pas ; fiez-vous plutôt à ce que je vous écris. [Car][a] je vous écris encore vivant, tout en désirant la mort. Mon désir a été crucifié, et il n’y a en moi aucun feu d’amour de la matière ; il n’y a qu’une eau vive qui parle en moi et qui me dit au-dedans : « Viens vers le Père. »


    Je ne prends aucun plaisir à la nourriture vouée à la corruption ni aux délices de cette vie. Je désire le pain de Dieu, qui est la chair de Jésus Christ, issu de la descendance de David ; et, pour boisson, je désire son sang, qui est l’amour impérissable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot « Car » est signalé entre crochets dans le témoin anglais fourni : il s’agit d’une restitution éditoriale. La vérification directe du grec reste à effectuer.'
    reason: Préserver explicitement le signal éditorial présent dans la documentation source, dont la révision grecque est annoncée comme encore en attente.
lexical_decisions:
- source_word: prince of this world
  choice: le prince de ce monde
  rationale: Conserve le titre traditionnel et sa portée spirituelle sans préciser davantage l’identité de la figure.
- source_word: corrupt my mind to Godward
  choice: corrompre mes dispositions envers Dieu
  rationale: « Dispositions » exprime l’orientation intérieure visée, sans réduire le sens au seul intellect.
- source_word: lust / desire
  choice: désir
  rationale: Le contexte oppose le désir désormais crucifié aux attachements matériels et au désir de Dieu ; « désir » préserve cette amplitude mieux que « convoitise ».
- source_word: water living
  choice: une eau vive
  rationale: Formulation française naturelle qui garde l’écho biblique de l’eau vivante.
- source_word: food of corruption
  choice: la nourriture vouée à la corruption
  rationale: Évite de faire dire que la nourriture est moralement corrompue ; elle appartient au monde périssable.
- source_word: seed of David
  choice: la descendance de David
  rationale: Rend l’idiome généalogique grec présumé dans un français actuel et digne.
- source_word: incorruptible love
  choice: l’amour impérissable
  rationale: « Impérissable » est naturel en français et maintient l’opposition à ce qui est voué à la corruption.
theological_decisions:
- issue: Identification du « prince de ce monde »
  choice: Maintenir le titre sans explicitation
  alternative: Ajouter « le diable » ou « Satan »
  rationale: Le passage laisse l’identification implicite ; l’expliciter résoudrait une donnée que le texte ne formule pas ici.
- issue: Sens eucharistique du pain, de la chair, du sang et de la boisson
  choice: Traduire directement les images sans commentaire doctrinal
  alternative: Les paraphraser comme symboles ou affirmer une interprétation sacramentelle précise
  rationale: La formulation forte d’Ignace est conservée, mais aucune doctrine confessionnelle supplémentaire n’est importée.
- issue: « son sang, qui est l’amour impérissable »
  choice: Conserver la relation grammaticale et l’ambiguïté métaphorique
  alternative: Paraphraser « son sang, manifestation de son amour impérissable »
  rationale: Le texte associe directement le sang et l’amour ; une paraphrase explicative atténuerait la tension originale.
- issue: Désir de la mort
  choice: Conserver « désirant la mort »
  alternative: Interpréter comme seul désir du martyre ou du départ vers Dieu
  rationale: Le contexte suggère le martyre, mais la formulation transmise demeure « la mort » et ne doit pas être réduite silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement collectif n’étant pas marqué en français, les impératifs au pluriel rendent l’adresse à la communauté. Les images abruptes d’Ignace et leurs tensions sont maintenues. Projet provisoire fondé sur le témoin anglais public fourni, la consultation directe de la tradition grecque de la recension moyenne restant nécessaire.
