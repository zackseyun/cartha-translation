source:
  text: 'I do not command you, as though I were somewhat. For even though I am in bonds for the Name''s sake, I am not yet perfected in Jesus Christ. [For] now am I beginning to be a disciple; and I speak to you as to my school-fellows. For I ought to be trained by you for the contest in faith, in admonition, in endurance, in long-suffering.


    But, since love doth not suffer me to be silent concerning you, therefore was I forward to exhort you, that ye run in harmony with the mind of God: for Jesus Christ also, our inseparable life, is the mind of the Father, even as the bishops that are settled in the farthest parts of the earth are in the mind of Jesus Christ.'
