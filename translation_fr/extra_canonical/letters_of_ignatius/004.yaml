    But, since love doth not suffer me to be silent concerning you, therefore was I forward to exhort you, that ye run in harmony with the mind of God: for Jesus Christ also, our inseparable life, is the mind of the Father, even as the bishops that are settled in the farthest parts of the earth are in the mind of Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: fr
  text: 'Je ne vous donne pas d’ordres comme si j’étais quelqu’un d’important. En effet, même si je suis enchaîné à cause du Nom[a], je ne suis pas encore parvenu à la maturité en Jésus-Christ. [Car][b] je commence seulement maintenant à devenir disciple, et je m’adresse à vous comme à mes condisciples. C’est moi qui devrais être préparé par vous au combat, dans la foi, l’avertissement, la persévérance et la patience.


    Mais puisque l’amour ne me permet pas de garder le silence à votre sujet, j’ai pris l’initiative de vous exhorter à courir en accord avec la pensée de Dieu. Car Jésus-Christ, notre vie inséparable de lui[c], est lui aussi la pensée du Père, tout comme les évêques établis jusqu’aux extrémités de la terre sont en accord avec la pensée de Jésus-Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Nom » désigne vraisemblablement le nom de Jésus-Christ, confessé par Ignace et cause de son emprisonnement.
    reason: Clarifier une désignation chrétienne ancienne tout en conservant son caractère elliptique dans le texte.
  - marker: b
    text: Le mot « Car » est signalé comme une restitution textuelle dans le témoin anglais fourni; l’examen direct de toute la tradition grecque reste à achever.
    reason: Préserver avec transparence le signal critique présent dans la base documentaire fournie.
  - marker: c
    text: L’expression peut aussi se traduire plus littéralement par « notre vie inséparable » ou « notre vie sans division ».
    reason: Signaler la densité et l’ambiguïté de l’expression ancienne sans les résoudre silencieusement.
lexical_decisions:
- source_word: ὡς ὤν τι
  choice: comme si j’étais quelqu’un d’important
  rationale: L’expression signifie littéralement « comme étant quelque chose » et exprime ici une prétention à l’importance ou à l’autorité; la formulation française en restitue naturellement l’humilité.
- source_word: ἀπήρτισμαι
  choice: je ne suis pas encore parvenu à la maturité
  rationale: Le verbe évoque l’achèvement, la formation complète ou le perfectionnement. « Parvenu à la maturité » évite de suggérer une perfection absolue tout en gardant l’idée de formation inachevée.
- source_word: μαθητεύεσθαι
  choice: à devenir disciple
  rationale: La forme verbale met l’accent sur l’entrée et le progrès dans l’apprentissage du disciple, plutôt que sur un simple statut.
- source_word: συνδιδασκαλίταις
  choice: condisciples
  rationale: Le terme désigne des personnes qui apprennent ensemble. « Condisciples » conserve l’image scolaire sans introduire une relation hiérarchique.
- source_word: ἀλειφθῆναι
  choice: être préparé … au combat
  rationale: Littéralement, le verbe peut évoquer l’onction ou la friction de l’athlète avant l’épreuve; dans ce contexte, il s’agit d’un entraînement ou d’une préparation au combat spirituel.
- source_word: νουθεσίᾳ
  choice: l’avertissement
  rationale: Le mot couvre l’exhortation corrective, la mise en garde et l’admonestation. « Avertissement » est actuel et compréhensible, tout en maintenant la dimension de correction.
- source_word: ὑπομονῇ … μακροθυμίᾳ
  choice: la persévérance et la patience
  rationale: La première notion souligne le fait de tenir bon sous l’épreuve; la seconde, la patience prolongée envers les difficultés ou les personnes. Deux termes distincts sont conservés.
- source_word: γνώμη
  choice: pensée / en accord avec la pensée
  rationale: Le mot peut désigner la pensée, l’intention, le dessein ou l’avis. « Pensée » conserve l’ambiguïté et permet de rendre naturellement l’idée d’accord dans la dernière proposition.
- source_word: συντρέχητε
  choice: courir en accord avec
  rationale: Le verbe garde l’image dynamique de la course commune, tandis que « en accord avec » exprime la convergence vers la pensée de Dieu.
- source_word: τὸ ἀδιάκριτον ἡμῶν ζῆν
  choice: notre vie inséparable de lui
  rationale: L’expression est dense et peut se comprendre comme « notre vie inséparable » ou « notre vie sans division ». L’ajout explicatif « de lui » rend en français le lien avec Jésus-Christ sans éliminer l’image d’union.
- source_word: οἱ κατὰ τὰ πέρατα ὁρισθέντες
  choice: établis jusqu’aux extrémités de la terre
  rationale: La formulation garde à la fois l’idée d’une désignation ou installation et celle d’une très large dispersion géographique.
theological_decisions:
- issue: Le « Nom » pour lequel Ignace est enchaîné
  choice: Conserver « le Nom » avec une majuscule et une note
  alternative: Expliciter directement « le nom de Jésus-Christ »
  rationale: La formulation traditionnelle reste volontairement elliptique et chargée de sens. La note clarifie le référent probable sans remplacer l’expression du texte.
- issue: L’état spirituel inachevé d’Ignace en Jésus-Christ
  choice: « je ne suis pas encore parvenu à la maturité »
  alternative: « je ne suis pas encore rendu parfait »
  rationale: Le choix maintient l’affirmation d’un processus incomplet sans imposer une doctrine particulière de la perfection chrétienne.
- issue: Jésus-Christ comme « pensée du Père »
  choice: Conserver la prédication directe
  alternative: Paraphraser par « révèle la volonté du Père »
  rationale: La formulation directe préserve la force et la tension théologique du passage, sans réduire « pensée » à la seule révélation ou à la volonté.
- issue: Les évêques « dans la pensée de Jésus-Christ »
  choice: « en accord avec la pensée de Jésus-Christ »
  alternative: « sont la pensée de Jésus-Christ »
  rationale: La construction grecque indique leur sphère d’accord ou d’orientation, non une identité ontologique avec la pensée du Christ. La traduction évite donc une assimilation excessive.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est rendu par « vous ». Les images de la formation du disciple, du combat athlétique et de la course commune sont maintenues. Comme la révision directe du grec est indiquée comme encore en attente dans les données fournies, le projet reste prudent aux endroits textuellement ou lexicalement difficiles.
