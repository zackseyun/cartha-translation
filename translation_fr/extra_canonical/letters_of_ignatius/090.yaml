review_pass:
  verdict: revise
  source_fidelity: La formulation grecque de la recension moyenne oppose à Polycarpe comme « évêque » de l’Église des Smyrniotes le fait d’être lui-même ἐπισκοπημένος, c’est-à-dire « veillé/surveillé » par Dieu le Père et le Seigneur Jésus Christ. Le projet français transforme ce second terme en « avoir pour évêque », ce qui efface le jeu verbal et ne rend pas exactement la voix passive. Il omet aussi « Seigneur » (κύριος), attesté dans la formule grecque usuelle de ce prologue.
  naturalness: La phrase est globalement solennelle et lisible, mais « salut en abondance » est peu idiomatique en français actuel. « Très nombreuses salutations » conserve l’intensification de πλεῖστα χαίρειν dans une formule épistolaire française naturelle.
  terminology: « Théophore », « évêque », « Église » et « Smyrniotes » conviennent. « Dieu le Père et le Seigneur Jésus-Christ » restitue le titre christologique sans l’interpréter. « Placé sous la vigilance de » rend de façon accessible le passif lié à ἐπισκοπέω et préserve l’écho avec « évêque ».
  issues:
  - severity: high
    issue: Le second emploi du champ lexical d’« évêque » est rendu comme un substantif (« a pour évêque ») au lieu d’un passif verbal.
    rationale: 'Le grec emploie le participe passif ἐπισκοπημένῳ : Polycarpe est « surveillé/veillé sur » par Dieu et le Christ. La révision maintient à la fois le sens et le jeu rhétorique avec ἐπίσκοπος.'
  - severity: high
    issue: Omission de « Seigneur » devant Jésus-Christ.
    rationale: La formule grecque reçue porte καὶ κυρίου Ἰησοῦ Χριστοῦ. Ce titre doit être traduit.
  - severity: medium
    issue: « Salut en abondance » est une formulation française raide.
    rationale: « Très nombreuses salutations » rend l’amplification de πλεῖστα χαίρειν sans banaliser la salutation.
  revised_text: Ignace, appelé aussi Théophore, à Polycarpe, évêque de l’Église des Smyrniotes — ou plutôt, placé sous la vigilance de Dieu le Père et du Seigneur Jésus-Christ —, très nombreuses salutations.
