revisions:
- from: Ignace, appelé aussi Théophore, à Polycarpe, évêque de l’Église des Smyrniotes — ou plutôt, lui qui a pour évêque Dieu le Père et Jésus-Christ —, salut en abondance.
  to: Ignace, appelé aussi Théophore, à Polycarpe, évêque de l’Église des Smyrniotes — ou plutôt, placé sous la vigilance de Dieu le Père et du Seigneur Jésus-Christ —, très nombreuses salutations.
  rationale: Révision nécessaire pour rendre le participe passif grec associé au champ lexical de l’épiscopat, restituer le titre « Seigneur » et améliorer la formule de salutation. La construction conserve délibérément la correction rhétorique « ou plutôt » et ne résout pas doctrinalement l’image selon laquelle Polycarpe est sous la vigilance divine.
  reviewer_model: gpt-5.6-terra
