  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: fr
  text: Ignace, appelé aussi Théophore, à Polycarpe, évêque de l’Église des Smyrniotes — ou plutôt, placé sous la vigilance de Dieu le Père et du Seigneur Jésus-Christ —, très nombreuses salutations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Conserve sous sa forme française traditionnelle le surnom grec, sans en imposer une interprétation (« porteur de Dieu » ou « porté par Dieu »).
- source_word: Smyrnaens
  choice: Smyrniotes
  rationale: Gentilé français établi pour les habitants de Smyrne, plus naturel et précis que « Smyrnéens ».
- source_word: bishop
  choice: évêque
  rationale: Rend le titre ecclésial attesté par le témoin, tout en préservant le jeu rhétorique de sa seconde occurrence à propos de Dieu le Père et de Jésus-Christ.
- source_word: abundant greeting
  choice: salut en abondance
  rationale: Préserve la formulation amplifiée et inhabituelle de la salutation plutôt que de la réduire à un simple « salut ».
theological_decisions:
- issue: Rapport entre Polycarpe et l’expression « Dieu le Père et Jésus-Christ »
  choice: « lui qui a pour évêque Dieu le Père et Jésus-Christ »
  alternative: « l’Église qui a pour évêque Dieu le Père et Jésus-Christ »
  rationale: La syntaxe transmise par le témoin anglais rattache naturellement la relative à Polycarpe. La formulation conserve néanmoins la tension rhétorique sans expliquer comment le Père et le Christ peuvent ensemble être dits son « évêque ».
- issue: Force de « ou plutôt »
  choice: Maintien de la correction rhétorique explicite
  alternative: Lisser en « et placé sous l’épiscopat de »
  rationale: « Ou plutôt » marque une reformulation volontaire qui élève le regard de la charge exercée par Polycarpe vers l’autorité divine; il ne faut pas effacer ce mouvement.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase conserve la structure solennelle d’une adresse épistolaire ancienne et son paradoxe ecclésiologique. Traduction provisoire fondée sur le témoin anglais public indiqué, la vérification directe du grec restant à effectuer.
