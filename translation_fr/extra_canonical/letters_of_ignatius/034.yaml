revisions:
- from: Je vous dis cela, mes bien-aimés, non que j’aie appris que l’un de vous pense ainsi. Mais, puisque je suis inférieur à chacun de vous, je veux vous mettre en garde dès maintenant, afin que vous ne tombiez pas dans les pièges d’un enseignement sans valeur. Soyez plutôt pleinement convaincus de la naissance, de la passion et de la résurrection, qui ont eu lieu sous le gouvernement de Ponce Pilate. Car tout cela a été véritablement et certainement accompli par Jésus-Christ, notre espérance. Que nul d’entre vous ne se détourne de cette espérance.
  to: Je vous dis cela, mes bien-aimés, non parce que j’ai appris que l’un d’entre vous pense ainsi ; mais moi qui suis le moindre d’entre vous, je veux que vous soyez sur vos gardes à temps, afin que vous ne tombiez pas dans les pièges d’une doctrine vaine. Soyez plutôt pleinement convaincus au sujet de la naissance, de la passion et de la résurrection qui a eu lieu au temps où Ponce Pilate exerçait son gouvernement. Car toutes ces choses ont été réellement et assurément accomplies par Jésus-Christ, notre espérance. Que personne parmi vous ne soit détourné de cette espérance.
  rationale: La révision rétablit la portée grammaticale de la relative attestée dans le grec de la recension moyenne et évite ainsi une datation implicite de la naissance sous Pilate. Elle maintient sans ajout doctrinal la triple affirmation de la naissance, de la passion et de la résurrection, ainsi que leur accomplissement réel et certain par Jésus-Christ. Les ajustements de style conservent le ton pastoral dans un français international moderne.
