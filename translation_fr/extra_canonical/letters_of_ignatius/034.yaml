base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: fr
  text: Je vous dis cela, mes bien-aimés, non parce que j’ai appris que l’un d’entre vous pense ainsi ; mais moi qui suis le moindre d’entre vous, je veux que vous soyez sur vos gardes à temps, afin que vous ne tombiez pas dans les pièges d’une doctrine vaine. Soyez plutôt pleinement convaincus au sujet de la naissance, de la passion et de la résurrection qui a eu lieu au temps où Ponce Pilate exerçait son gouvernement. Car toutes ces choses ont été réellement et assurément accomplies par Jésus-Christ, notre espérance. Que personne parmi vous ne soit détourné de cette espérance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: my dearly beloved
  choice: mes bien-aimés
  rationale: Formule affectueuse, digne et naturelle en français, qui conserve le ton pastoral de l’adresse.
- source_word: being less than any of you
  choice: puisque je suis inférieur à chacun de vous
  rationale: Conserve l’expression d’humilité sans la transformer en comparaison quantitative maladroite.
- source_word: be on your guard betimes
  choice: vous mettre en garde dès maintenant
  rationale: Rend l’idée d’une vigilance préventive dans un français actuel.
- source_word: vain doctrine
  choice: un enseignement sans valeur
  rationale: Exprime l’inanité de l’enseignement sans suggérer simplement la vanité personnelle.
- source_word: the passion
  choice: la passion
  rationale: Terme français établi pour les souffrances et la mort du Christ, adapté au registre ancien chrétien.
- source_word: our hope
  choice: notre espérance
  rationale: « Espérance » porte ici la dimension théologique et personnelle de l’attente placée en Jésus-Christ.
theological_decisions:
- issue: Réalité historique de la naissance, de la passion et de la résurrection
  choice: « ont eu lieu sous le gouvernement de Ponce Pilate » et « véritablement et certainement accompli »
  alternative: Limiter la référence temporelle à la passion et à la résurrection seulement
  rationale: Le témoin anglais rattache grammaticalement les trois événements à la proposition relative; la traduction conserve cette portée sans la réinterpréter.
- issue: Référent de « cette espérance »
  choice: Répétition explicite de « cette espérance »
  alternative: « Que nul ne se détourne de lui »
  rationale: La reprise conserve le lien avec Jésus-Christ désigné comme « notre espérance », sans réduire l’expression à un simple pronom personnel.
translation_notes:
  register: Français international moderne, pastoral et digne. La traduction demeure provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne reste à effectuer; elle suit donc avec prudence le témoin anglais public fourni.
