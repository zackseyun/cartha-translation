revisions:
- from: 'Ne vous laissez pas égarer par des enseignements étrangers ni par des fables anciennes, qui ne servent à rien. Car si, aujourd’hui encore, nous vivons selon le judaïsme, nous reconnaissons que nous n’avons pas reçu la grâce.


