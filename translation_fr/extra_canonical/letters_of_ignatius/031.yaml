  terminology: « Enseignements étrangers », « judaïsme », « grâce », « Parole » et « Jésus Christ » conviennent. « Selon le Christ Jésus » reproduit κατὰ Χριστὸν Ἰησοῦν sans transformer l’expression en affirmation chronologique ni en explicitation confessionnelle.
