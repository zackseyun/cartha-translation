base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: fr
  text: 'Ne vous laissez pas égarer par des enseignements étrangers ni par des fables anciennes, qui ne servent à rien. Car si, aujourd’hui encore, nous vivons selon le judaïsme, nous reconnaissons que nous n’avons pas reçu la grâce.


    En effet, les prophètes divins ont vécu selon le Christ Jésus. C’est pourquoi ils ont eux aussi été persécutés, inspirés par sa grâce, afin que ceux qui refusent d’obéir soient pleinement convaincus qu’il y a un seul Dieu. Celui-ci s’est manifesté par Jésus Christ, son Fils, qui est sa Parole sortie du silence et qui, en toutes choses, a été agréable à celui qui l’a envoyé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδοξίαις
  choice: enseignements étrangers
  rationale: Rend l’idée de doctrines étrangères ou divergentes sans employer un jargon confessionnel trop marqué.
- source_word: παλαιαῖς μυθεύμασιν
  choice: fables anciennes
  rationale: Conserve le caractère péjoratif de récits anciens sans leur attribuer davantage de précision que le témoignage disponible.
- source_word: Ἰουδαϊσμόν
  choice: judaïsme
  rationale: Maintient le terme historique et la tension polémique du passage, sans l’amplifier ni le paraphraser.
- source_word: κατὰ Χριστὸν Ἰησοῦν ἔζησαν
  choice: vivaient selon Jésus Christ
  rationale: Préserve la formulation inhabituelle et théologiquement chargée, au lieu de la réduire à une simple chronologie postérieure au Christ.
- source_word: Λόγος
  choice: Parole
  rationale: Traduction française naturelle du titre théologique, avec majuscule pour signaler son emploi personnel.
- source_word: ἀπὸ σιγῆς προελθών
  choice: sortie du silence
  rationale: Reproduit l’image énigmatique sans chercher à en fixer l’interprétation métaphysique.
theological_decisions:
- issue: Rapport des prophètes à Jésus Christ
  choice: « vivaient selon Jésus Christ »
  alternative: « ont vécu après Jésus Christ »
  rationale: Le grec traditionnellement attesté est compris comme « selon Christ », tandis que le témoin anglais fourni peut donner l’impression d’une succession chronologique. La traduction retenue conserve l’affirmation théologique d’Ignace et l’ambiguïté de son application aux prophètes.
- issue: Manifestation de Dieu par le Fils
  choice: « Celui-ci s’est manifesté par Jésus Christ, son Fils »
  alternative: « un seul Dieu, manifesté par Jésus Christ son Fils »
  rationale: Le pronom explicite clairement que Dieu est le sujet de la manifestation tout en gardant la médiation exprimée par « par ».
- issue: La Parole sortie du silence
  choice: « sa Parole sortie du silence »
  alternative: « sa Parole qui procède du silence »
  rationale: « Sortie » traduit l’événement exprimé sans imposer une doctrine technique de procession; l’image demeure volontairement mystérieuse.
- issue: Finalité de l’inspiration et de la persécution
  choice: « afin que ceux qui refusent d’obéir soient pleinement convaincus »
  alternative: « afin que les désobéissants croient pleinement »
  rationale: Conserve la finalité et la force de pleine persuasion sans identifier automatiquement celle-ci à une terminologie ultérieure de conversion.
translation_notes:
  register: Français international moderne, digne et direct. Les phrases ont été légèrement restructurées pour la clarté, tout en conservant la polémique, la christologie et l’image énigmatique du silence. Projet nécessairement provisoire, puisque la notice indique que la vérification directe du grec de la recension moyenne reste à effectuer.
