review_pass:
  verdict: revise
  source_fidelity: 'Le texte français suit très fidèlement le témoin fourni et respecte ses impératifs au singulier. Une correction est néanmoins sûre : « public cost » désigne les fonds publics, non les ressources de la communauté. Le grec de la recension moyenne n’étant pas fourni directement, l’examen source reste limité au témoin anglais et à son audit trail.'
  naturalness: Le registre est naturel, sobre et adapté à une exhortation adressée à Polycarpe. « Recherche chacun par son nom » est compréhensible, mais « Cherche chacun par son nom » est plus idiomatique dans ce contexte. « aux frais de la communauté » doit être remplacé.
  terminology: « veuves », « protecteur », « assemblées », « esclaves » et « liberté meilleure » sont bien rendus. « esclaves de leurs désirs » est défendable pour « slaves of lust », mais la note est utile pour conserver l’ambiguïté de convoitise/passion. « fonds publics » restitue sans interprétation ecclésiale le sens de « public cost ».
  issues:
  - severity: medium
    issue: « aux frais de la communauté » pour « at the public cost »
    rationale: Le témoin anglais vise explicitement une prise en charge sur fonds publics. « communauté » introduit une restriction ecclésiale absente du texte et modifie le référent financier.
  - severity: low
    issue: « Recherche chacun par son nom »
    rationale: La formulation reste possible, mais « Cherche chacun par son nom » est plus naturelle en français moderne et garde l’idée de rechercher personnellement chaque individu.
  revised_text: 'Que les veuves ne soient pas négligées. Après le Seigneur, sois leur protecteur. Que rien ne se fasse sans ton accord, et toi non plus, ne fais rien sans l’accord de Dieu — ce que, de fait, tu ne fais pas. Reste ferme.


    Que les assemblées se tiennent plus souvent. Cherche chacun par son nom.


    Ne méprise pas les esclaves, hommes ou femmes. Mais qu’eux non plus ne s’enorgueillissent pas ; qu’ils servent avec une fidélité redoublée, pour la gloire de Dieu, afin d’obtenir de Dieu une liberté meilleure. Qu’ils ne cherchent pas à être affranchis aux frais des fonds publics, de peur de se trouver esclaves de leurs désirs.[a]'
  revised_footnotes:
  - marker: a
    text: L’expression traduite par « esclaves de leurs désirs » peut aussi se comprendre comme « esclaves de la convoitise » ou « esclaves de la passion ».
    reason: Le témoin anglais emploie « lust », dont la portée peut être plus large que le seul désir sexuel ; la note préserve cette ambiguïté en attendant l’examen direct du grec.
  revision_rationale: La révision remplace l’interprétation communautaire de « public cost » par « fonds publics », conformément au témoin, et améliore légèrement l’idiomaticité de l’exhortation à rechercher chacun nommément. Le reste du texte et la note conservent de manière appropriée les ambiguïtés du témoin disponible.
