base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be servants of lust.'
translation:
  language: fr
  text: 'Que les veuves ne soient pas négligées. Après le Seigneur, sois leur protecteur. Que rien ne se fasse sans ton accord, et toi non plus, ne fais rien sans l’accord de Dieu — ce que, de fait, tu ne fais pas. Reste ferme.


    Que les assemblées se tiennent plus souvent. Recherche chacun par son nom.


    Ne méprise pas les esclaves, hommes ou femmes. Mais qu’eux non plus ne s’enorgueillissent pas ; qu’ils servent plutôt avec une fidélité redoublée, pour la gloire de Dieu, afin d’obtenir de Dieu une liberté meilleure. Qu’ils ne cherchent pas à être affranchis aux frais de la communauté, de peur de se trouver esclaves de leurs désirs.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « esclaves de leurs désirs » peut aussi se comprendre comme « esclaves de la convoitise » ou « esclaves de la passion ».
    reason: Le témoin anglais emploie « lust », dont la portée peut être plus large que le seul désir sexuel; la note préserve cette ambiguïté en attendant l’examen direct du grec.
lexical_decisions:
- source_word: widows
  choice: les veuves
  rationale: Terme direct et naturel, conservant la catégorie sociale explicitement visée.
- source_word: protector
  choice: protecteur
  rationale: Préserve l’idée de protection et de responsabilité sans préciser davantage une fonction que le témoin ne définit pas.
- source_word: consent
  choice: accord
  rationale: Français courant et digne, applicable tant à l’autorité du destinataire qu’à celle de Dieu.
- source_word: meetings
  choice: assemblées
  rationale: Convient aux rassemblements communautaires chrétiens sans imposer un vocabulaire institutionnel plus tardif.
- source_word: slaves
  choice: esclaves
  rationale: Rend sans euphémisme le statut servile historique des personnes concernées.
- source_word: better freedom
  choice: une liberté meilleure
  rationale: Conserve la comparaison énigmatique entre affranchissement social et liberté accordée par Dieu, sans la résoudre théologiquement.
- source_word: public cost
  choice: aux frais de la communauté
  rationale: Exprime plus naturellement l’idée d’un financement collectif, vraisemblablement ecclésial, tout en évitant le sens moderne de dépense étatique.
- source_word: lust
  choice: leurs désirs
  rationale: Le terme peut désigner la convoitise ou le désir passionné au sens large; le possessif rend en français le rapport de servitude implicite.
theological_decisions:
- issue: Relation d’autorité exprimée par « après le Seigneur »
  choice: Après le Seigneur, sois leur protecteur
  alternative: Sous l’autorité du Seigneur, prends soin d’elles
  rationale: La formulation retenue préserve l’ordre frappant du témoin et son possible sens hiérarchique, sans l’expliquer ni l’atténuer.
- issue: Nature de la « liberté meilleure »
  choice: afin d’obtenir de Dieu une liberté meilleure
  alternative: afin que Dieu leur accorde la vraie liberté
  rationale: La version retenue garde le comparatif et ne réduit pas cette liberté à une doctrine particulière, spirituelle ou eschatologique.
- issue: Exhortation adressée aux esclaves
  choice: qu’ils servent plutôt avec une fidélité redoublée
  alternative: qu’ils accomplissent leur service avec encore plus de fidélité
  rationale: Conserve la tension éthique et sociale du passage sans transformer l’exhortation en approbation générale de l’esclavage.
translation_notes:
  register: Tutoiement singulier retenu, puisque les impératifs s’adressent personnellement à Polycarpe. Style exhortatif, sobre et digne. La formulation reste provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne demeure à effectuer.
