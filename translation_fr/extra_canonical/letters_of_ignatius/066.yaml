review_pass:
  verdict: revise
  source_fidelity: 'Le texte suit de près le témoin anglais fourni. Une correction est toutefois indiquée pour la dernière proposition : « where you are united » / « where ye are at one » exprime plus exactement le cadre de « votre unité » que le simple état « vous êtes unis ». La formulation concernant « la course de Dieu » conserve utilement l’ambiguïté du témoin en attendant le contrôle direct du grec.'
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Dans votre unité » est à la fois plus naturel dans ce contexte ecclésial et plus proche de la construction attestée par le témoin. « Ils ne trouveront aucune place » est remplacé par « ils n’y auront pas de place », qui rend plus directement l’idée de ne pas avoir de place.
  terminology: « Berger », « brebis », « divisions », « doctrines erronées », « loups aux dehors séduisants » et « plaisirs funestes » sont des choix recevables. L’identité du berger n’est pas explicitée, à juste titre. Les crochets autour de « de la lumière » et la note correspondante doivent être maintenus, puisque le dossier signale cette portion comme incertaine. La note sur « course de Dieu » préserve correctement l’ambiguïté relationnelle.
  issues:
  - severity: medium
    issue: Rendu de « where you are united / where ye are at one »
    rationale: « Là où vous êtes unis » transforme une expression portant sur l’unité commune en une simple condition. « Dans votre unité » conserve mieux l’idée que leur unité est le lieu ou la sphère dans laquelle les loups ne peuvent agir.
  - severity: low
    issue: Rendu de « they will find no place »
    rationale: « Ils n’y auront pas de place » est plus idiomatique et rend directement l’expression de possession (« have no place ») du témoin, sans changement de sens.
  revised_text: 'Ainsi donc, comme des enfants [de la lumière][a] de la vérité, fuyez les divisions et les doctrines erronées. Là où est le berger, suivez-le comme des brebis.


    Car beaucoup de loups aux dehors séduisants, par des plaisirs funestes, font prisonniers ceux qui courent dans la course de Dieu[b]. Mais dans votre unité, ils n’y auront pas de place.'
  revised_footnotes:
  - marker: a
    text: Les mots « de la lumière » sont incertains dans le témoin utilisé et devront être vérifiés dans la tradition grecque.
    reason: Signaler honnêtement les crochets transmis par le témoin public anglais.
  - marker: b
    text: 'Littéralement, selon le témoin utilisé : « ceux qui courent dans la course de Dieu »; le rapport exact entre la course et Dieu reste ouvert.'
    reason: Préserver une formulation métaphorique et une relation grammaticale qui nécessitent une vérification directe du grec.
  revision_rationale: Révision limitée de la dernière phrase afin de refléter plus fidèlement « at one » / « united » comme « votre unité », et de rendre naturellement « have no place ». Les autres formulations conservent les ambiguïtés textuelles et théologiques signalées dans le dossier. La révision grecque directe demeure nécessaire pour confirmer notamment le segment entre crochets et les nuances lexicales.
