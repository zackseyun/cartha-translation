base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: fr
  text: 'Ainsi donc, comme des enfants [de la lumière][a] de la vérité, fuyez les divisions et les doctrines erronées. Là où est le berger, suivez-le comme des brebis.


    Car beaucoup de loups aux dehors séduisants, par des plaisirs funestes, font prisonniers ceux qui courent dans la course de Dieu[b]. Mais là où vous êtes unis, ils ne trouveront aucune place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « de la lumière » sont incertains dans le témoin utilisé et devront être vérifiés dans la tradition grecque.
    reason: Signaler honnêtement les crochets transmis par le témoin public anglais.
  - marker: b
    text: 'Littéralement, selon le témoin utilisé : « ceux qui courent dans la course de Dieu »; le rapport exact entre la course et Dieu reste ouvert.'
    reason: Préserver une formulation métaphorique et une relation grammaticale qui nécessitent une vérification directe du grec.
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: enfants [de la lumière] de la vérité
  rationale: Conserve la construction inhabituelle et le segment entre crochets du témoin, sans trancher prématurément sa place ni son statut avant la vérification du grec.
- source_word: shun
  choice: fuyez
  rationale: Verbe direct et vigoureux, naturel en français, qui exprime davantage qu’un simple évitement passif.
- source_word: wrong doctrines
  choice: doctrines erronées
  rationale: Rend l’idée d’enseignements doctrinalement faux sans introduire un vocabulaire confessionnel plus chargé.
- source_word: specious wolves
  choice: loups aux dehors séduisants
  rationale: Exprime une apparence trompeusement attirante plutôt que la seule force persuasive.
- source_word: lead captive
  choice: font prisonniers
  rationale: Préserve l’image concrète de la captivité.
- source_word: runners in God’s race
  choice: ceux qui courent dans la course de Dieu
  rationale: Maintient la métaphore athlétique et son lien explicite avec Dieu, malgré la légère répétition naturelle à l’image.
- source_word: at one
  choice: unis
  rationale: Formulation française actuelle qui conserve l’appel à l’unité communautaire.
theological_decisions:
- issue: Identité du berger
  choice: Ne pas expliciter son identité
  alternative: Ajouter « l’évêque » ou « le Christ »
  rationale: Le passage fourni dit seulement « le berger »; préciser davantage résoudrait une ambiguïté qui doit rester ouverte jusqu’à l’examen du contexte grec.
- issue: Statut de « de la lumière »
  choice: Conserver les crochets et ajouter une note
  alternative: Intégrer les mots sans crochets ou les omettre
  rationale: Le témoin les signale comme textuellement incertains; la traduction ne doit pas masquer cette incertitude.
- issue: « course de Dieu »
  choice: Conserver le génitif ambigu
  alternative: « la course pour Dieu » ou « la course voulue par Dieu »
  rationale: Ces reformulations détermineraient le rapport exact à Dieu sans preuve suffisante dans les données fournies.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel est rendu par « vous ». La formulation demeure provisoire, car le dossier fourni repose sur un témoin anglais du domaine public et la révision directe du grec de la recension moyenne reste à effectuer.
