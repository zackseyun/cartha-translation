base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: fr
  text: Puisque toutes choses ont une fin et que ces deux réalités — la vie et la mort — nous sont proposées ensemble, chacun ira au lieu qui lui est propre. De même, en effet, qu’il existe deux monnaies, celle de Dieu et celle du monde, et que chacune porte l’empreinte qui lui est propre, les incroyants portent l’empreinte de ce monde, tandis que les croyants portent, dans l’amour, l’empreinte de Dieu le Père par Jésus Christ. Si, par lui, nous ne choisissons pas librement de mourir pour participer à sa passion[a], sa vie n’est pas en nous…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se comprendre plus littéralement : « accepter de mourir à sa passion » ou « mourir selon sa passion ». Le sens précis devra être vérifié directement sur le grec de la recension moyenne.'
    reason: Le témoin anglais fourni, « die unto his passion », est ambigu et la révision directe du grec est signalée comme encore en attente.
  - marker: b
    text: Les points de suspension indiquent que la phrase se poursuit dans la section suivante.
    reason: Le tiret final du témoin marque une continuation au-delà de l’extrait.
lexical_decisions:
- source_word: δύο νομίσματα (reconstructed from the middle-recension wording)
  choice: deux monnaies
  rationale: Conserve l’image concrète de pièces relevant de deux autorités et portant chacune leur empreinte, plutôt que de l’abstraire en « deux systèmes de valeurs ».
- source_word: χαρακτήρ / ἐπιγραφή (coin-stamp imagery reflected by the witness)
  choice: empreinte
  rationale: Rend naturellement en français la marque distinctive frappée sur une monnaie et appliquée métaphoriquement aux personnes.
- source_word: ἄπιστοι / πιστοί
  choice: incroyants / croyants
  rationale: Maintient l’opposition religieuse du passage dans une formulation française courante et directe.
- source_word: προκείμενα (as reflected in “set before us”)
  choice: nous sont proposées
  rationale: Préserve l’idée que la vie et la mort sont placées devant les humains comme deux voies possibles.
- source_word: εἰς τὸν τόπον τὸν ἴδιον (as reflected in the witness)
  choice: au lieu qui lui est propre
  rationale: Conserve la formulation volontairement ouverte sans préciser la destination de chaque personne.
theological_decisions:
- issue: Rapport entre le choix humain, la passion du Christ et sa vie en nous
  choice: « Si, par lui, nous ne choisissons pas librement de mourir pour participer à sa passion, sa vie n’est pas en nous »
  alternative: « si nous ne choisissons pas de mourir à l’image de sa passion » ou « de mourir pour sa passion »
  rationale: Le témoin anglais est syntaxiquement et théologiquement dense. La traduction maintient à la fois le libre choix, la médiation du Christ et la participation à sa passion, sans réduire l’expression à une doctrine particulière du martyre ou du salut.
- issue: L’empreinte divine portée par les croyants
  choice: « les croyants portent, dans l’amour, l’empreinte de Dieu le Père par Jésus Christ »
  alternative: Rattacher « dans l’amour » à Dieu le Père ou à l’action de Jésus Christ
  rationale: La ponctuation retenue suit le témoin et laisse « dans l’amour » caractériser la manière dont les croyants portent l’empreinte, tout en évitant de surdéterminer une syntaxe dont la vérification grecque reste à faire.
- issue: « chacun ira au lieu qui lui est propre »
  choice: formulation conservée sans explicitation
  alternative: « chacun ira vers sa destinée »
  rationale: Le texte peut évoquer une destination eschatologique, mais il ne la définit pas ici; l’expliciter effacerait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore monétaire est conservée, ainsi que le parallélisme entre le monde et Dieu. Le rythme reste ample pour respecter le caractère exhortatif de la lettre. Projet provisoire fondé sur le témoin anglais public fourni; une collation directe avec le grec de la recension moyenne demeure nécessaire.
