review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images principales sont bien conservées : fin de toutes choses, vie et mort posées ensemble, destination propre à chacun, double monnayage et empreinte. Toutefois, « Si, par lui » déplace indûment « par Jésus Christ » vers la proposition conditionnelle. Dans le témoin, « through Jesus Christ » qualifie l’empreinte de Dieu le Père, tandis que « through whom » introduit ensuite la relative. « pour participer à sa passion » explicite davantage que le permet l’ambiguïté de « die unto his passion ».'
  naturalness: Le français est généralement fluide et de registre approprié. « placées ensemble devant nous » rend plus directement l’image de réalités mises devant les lecteurs. La formulation révisée conserve une période ample, sans lourdeur excessive.
  terminology: « Monnaies », « empreinte », « incroyants », « croyants », « Dieu le Père » et « Jésus Christ » conviennent. « Empreinte » maintient l’image du χαρακτήρ appliquée au monnayage. « Mourir dans sa passion » est volontairement proche et ambigu, sans imposer l’idée de participation.
  issues:
  - severity: medium
    issue: Déplacement syntaxique de « par lui »
    rationale: Dans « Si, par lui, nous ne choisissons pas… », « par lui » semble dépendre du choix de mourir. Le témoin rattache d’abord « through Jesus Christ » à « the stamp of God the Father », puis emploie « through whom » dans la relative suivante.
  - severity: medium
    issue: Explicitation interprétative de « mourir pour participer à sa passion »
    rationale: Cette expression interprète « die unto his passion » comme une participation. Le témoin fourni demeure ambigu; une formulation plus littérale doit préserver cette indétermination en attendant la vérification grecque directe.
  revised_text: Puisque toute chose a une fin et que ces deux réalités — la vie et la mort — sont placées ensemble devant nous, chacun ira au lieu qui lui est propre. Car, de même qu’il existe deux monnaies, l’une de Dieu et l’autre du monde, et que chacune porte l’empreinte qui lui est propre, les incroyants portent l’empreinte de ce monde, tandis que les croyants portent, dans l’amour, l’empreinte de Dieu le Père par Jésus Christ. À moins que, de notre plein gré, nous n’acceptions de mourir dans sa passion[a], sa vie n’est pas en nous —[b]
  revised_footnotes:
  - marker: a
    text: 'L’expression peut aussi se comprendre plus littéralement : « accepter de mourir à sa passion » ou « mourir selon sa passion ». Le sens précis devra être vérifié directement sur le grec de la recension moyenne.'
    reason: Le témoin anglais fourni, « die unto his passion », est ambigu et la révision directe du grec est signalée comme encore en attente.
  - marker: b
    text: Le tiret indique que la phrase se poursuit dans la section suivante.
    reason: Le tiret final du témoin marque une continuation au-delà de l’extrait.
  revision_rationale: La révision corrige le rattachement de « par Jésus Christ » et remplace l’explicitation « pour participer à » par une formulation qui conserve l’ambiguïté du témoin. Elle rapproche aussi légèrement l’image de réalités « placées devant nous » et reproduit le tiret final plutôt que des points de suspension.
