review_pass:
  verdict: revise
  source_fidelity: 'Le projet conserve bien la structure polémique, les paradoxes et les images du passage. Quelques formulations s’éloignent toutefois inutilement du grec attesté par la tradition moyenne : le passif « ont été reniés par lui » doit être conservé sans le transformer en tournure active, « étant défenseurs » ne suppose pas qu’ils se fassent eux-mêmes défenseurs, et τὰ καθ’ ἡμᾶς πάθη se rend plus prudemment par « nos souffrances » que par une précision sur ce que chacun endure personnellement.'
  naturalness: Le français est généralement clair et de registre approprié. « C’est lui qui les a reniées » est cependant moins net que le passif et peut suggérer un contraste différent. « Il a porté une chair » est compréhensible, mais « qu’il était porteur de chair » reproduit plus exactement le prédicat σαρκοφόρον et rend l’antithèse avec « porteur d’un cadavre » plus visible. « Ne dit pas cela » correspond naturellement au participe λέγων.
  terminology: « Loi de Moïse », « Évangile », « Passion » et « notre résurrection » conviennent. « Porteur de chair » et « porteur d’un cadavre » doivent être maintenus comme images volontairement abruptes. La note sur le cadavre doit éviter d’expliciter le sens par une interprétation supplémentaire (« corps voué à la mort ») qui n’est pas formulée dans le texte.
  issues:
  - severity: medium
    issue: Voix et aspect de « ἠρνήθησαν ὑπ’ αὐτοῦ »
    rationale: « C’est lui qui les a reniées » transforme le passif grec en actif emphatique. « Ont plutôt été reniés par lui » conserve la construction et ne surinterprète pas son effet rhétorique ou temporel.
  - severity: low
    issue: « Se faisant les défenseurs »
    rationale: Le participe ὄντες signifie simplement « étant » ; la tournure actuelle introduit une nuance d’auto-attribution absente du texte.
  - severity: medium
    issue: Rendu de « τὰ καθ’ ἡμᾶς πάθη »
    rationale: « Les souffrances que chacun de nous endure personnellement » développe le texte au-delà de ce qu’il dit. « Nos souffrances » conserve l’expression collective et son ambiguïté contextuelle.
  - severity: low
    issue: « En refusant de reconnaître » et « Celui qui ne l’affirme pas »
    rationale: Le grec dit littéralement « ne confessant pas » puis « celui qui ne dit pas cela ». Les formulations révisées gardent le lien lexical et n’ajoutent pas l’idée d’un refus délibéré.
  - severity: low
    issue: Note c interprétative
    rationale: L’explication selon laquelle le corps est « voué à la mort » est plausible, mais elle dépasse l’image textuelle. Une note descriptive suffit.
  revised_text: 'Mais certaines personnes le renient par ignorance — ou plutôt, ont été reniées par lui —, étant les défenseurs de la mort plutôt que de la vérité. Ni les prophéties, ni la loi de Moïse, ni même jusqu’à ce jour l’Évangile, ni nos souffrances ne les ont convaincues ; car, à notre sujet aussi, elles pensent de la même manière.


    Quel profit y a-t-il [pour moi][a] si quelqu’un me loue, mais blasphème mon Seigneur, sans reconnaître qu’il était porteur de chair[b] ? Celui qui ne dit pas cela le renie entièrement, étant lui-même porteur d’un cadavre[c].


    Quant à leurs noms, noms d’incroyants, je n’ai pas jugé bon de les consigner par écrit ; bien plus, loin de moi l’idée même de me souvenir d’eux, jusqu’à ce qu’ils se repentent et reviennent à la Passion[d], qui est notre résurrection.'
  revised_footnotes:
  - marker: a
    text: Les mots « pour moi » sont une restitution signalée dans le témoin anglais utilisé pour ce projet provisoire.
    reason: Préserver explicitement le signal éditorial transmis par le témoin de base en attendant la vérification directe du grec.
  - marker: b
    text: L’expression présente le Christ comme « porteur de chair » ; elle conserve l’image concrète du texte.
    reason: Éclairer une tournure inhabituelle en français sans la remplacer par une paraphrase.
  - marker: c
    text: « Porteur d’un cadavre » répond à l’expression « porteur de chair » et en conserve l’antithèse saisissante.
    reason: Rendre perceptible le jeu d’images du passage sans en fixer davantage l’interprétation.
  - marker: d
    text: Ici, « la Passion » désigne les souffrances et la mort du Christ.
    reason: Éviter que le lecteur comprenne « passion » au sens moderne d’émotion intense.
  revision_rationale: La révision rapproche le français de la syntaxe et des images du grec de la recension moyenne, tout en conservant le niveau de langue moderne, l’ambiguïté de certains membres polémiques et le signal éditorial [pour moi]. Elle allège également les développements interprétatifs non nécessaires dans le texte et les notes.
