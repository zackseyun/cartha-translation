base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: fr
  text: 'Mais certaines personnes le renient par ignorance — ou plutôt, c’est lui qui les a reniées —, se faisant les défenseurs de la mort plutôt que de la vérité. Elles ne se sont laissé convaincre ni par les prophéties, ni par la loi de Moïse, ni même, jusqu’à cette heure, par l’Évangile, ni par les souffrances que chacun de nous endure personnellement ; car, à notre sujet aussi, elles pensent de la même manière.


    Quel avantage y a-t-il [pour moi][a] à ce que quelqu’un me loue, s’il blasphème mon Seigneur en refusant de reconnaître qu’il a porté une chair[b] ? Celui qui ne l’affirme pas le renie ainsi entièrement, tout en étant lui-même porteur d’un cadavre[c].


    Quant à leurs noms, puisque ce sont des incrédules, je n’ai pas jugé bon de les consigner par écrit. Loin de moi même l’idée de me souvenir d’eux, jusqu’à ce qu’ils se repentent et reviennent à la Passion[d], qui est notre résurrection.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « pour moi » sont une restitution signalée dans le témoin anglais utilisé pour ce projet provisoire.
    reason: Préserver explicitement le signal éditorial transmis par le témoin de base en attendant la vérification directe du grec.
  - marker: b
    text: Littéralement, l’expression présente le Christ comme « porteur de chair » et affirme ainsi la réalité de son incarnation corporelle.
    reason: Éclairer une tournure volontairement concrète qui peut paraître inhabituelle en français.
  - marker: c
    text: '« Porteur d’un cadavre » répond de manière frappante à « il a porté une chair » : celui qui nie la vraie chair du Christ est lui-même décrit comme portant un corps voué à la mort.'
    reason: Rendre perceptible le jeu lexical et l’antithèse conservés dans le texte.
  - marker: d
    text: Ici, « la Passion » désigne les souffrances et la mort du Christ.
    reason: Éviter que le lecteur comprenne « passion » au sens moderne d’émotion intense.
lexical_decisions:
- source_word: ἀρνοῦνται / ἠρνήθησαν (as reflected in the witness)
  choice: « le renient / c’est lui qui les a reniées »
  rationale: Conserve le retournement rhétorique et la voix passive du grec rapporté par la tradition, sans réduire le second membre à une simple conséquence psychologique.
- source_word: σάρκα φορεῖν / σαρκoφόρος (as reflected in the witness)
  choice: « il a porté une chair »
  rationale: Préserve l’image concrète et christologique du « porteur de chair », plutôt que de la paraphraser simplement par « il était humain ».
- source_word: νεκροφόρος (as reflected in the witness)
  choice: « porteur d’un cadavre »
  rationale: Maintient le contraste volontairement saisissant entre le Christ porteur de chair et l’adversaire porteur d’un corps mort.
- source_word: πάθος
  choice: « la Passion »
  rationale: Dans ce contexte, le terme désigne les souffrances et la mort du Christ ; la majuscule aide le lecteur français à reconnaître ce sens précis.
- source_word: ἡ ἀνάστασις ἡμῶν
  choice: « notre résurrection »
  rationale: Rend directement l’identification théologiquement dense de la Passion du Christ à la résurrection des croyants, sans l’expliquer ni l’atténuer.
theological_decisions:
- issue: Le Christ renie ceux qui le renient
  choice: « c’est lui qui les a reniées »
  alternative: « ils se trouvent plutôt reniés par lui »
  rationale: La formulation retenue conserve l’action attribuée au Christ et la tension judiciaire du passage, sans décider si elle est temporelle, eschatologique ou rhétorique.
- issue: Réalité de l’incarnation
  choice: « reconnaître qu’il a porté une chair »
  alternative: « reconnaître qu’il est venu dans la chair »
  rationale: Le choix garde la métaphore particulière du texte au lieu de la remplacer par une formule johannique plus familière qui importerait un autre énoncé.
- issue: La Passion comme résurrection des croyants
  choice: « la Passion, qui est notre résurrection »
  alternative: « la Passion, source de notre résurrection »
  rationale: La proposition d’identité est maintenue telle quelle ; « source de » résoudrait et affaiblirait le paradoxe théologique.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme polémique d’Ignace est conservé, ainsi que ses paradoxes et ses images abruptes. Cette proposition demeure provisoire, car le dossier fourni indique qu’une vérification directe de la tradition grecque de la recension moyenne reste à effectuer.
