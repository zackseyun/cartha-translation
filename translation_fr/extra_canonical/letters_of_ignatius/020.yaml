revisions:
- from: 'La virginité de Marie, son enfantement, ainsi que la mort du Seigneur furent cachés au prince de ce monde : trois mystères à proclamer à haute voix, accomplis dans le silence de Dieu. Comment donc furent-ils manifestés aux siècles ?


    Une étoile brilla dans le ciel plus que toutes les étoiles. Sa lumière était inexprimable, et son caractère étrange provoquait l’émerveillement. Tous les autres astres, avec le soleil et la lune, formèrent un chœur autour de l’étoile ; mais celle-ci les surpassait tous de beaucoup par son éclat. On se demandait avec perplexité d’où venait ce phénomène étrange, si différent des autres.


    Dès lors, toute sorcellerie et tout enchantement furent dissous. L’ignorance liée au mal disparut, et l’ancien royaume fut renversé lorsque Dieu apparut sous une forme humaine, en vue de la nouveauté de la vie éternelle. Ce qui avait été mené à son accomplissement dans les desseins de Dieu commença à prendre effet. Dès lors, tout fut bouleversé, car l’abolition de la mort avait été entreprise.'
  to: 'La virginité de Marie, son enfantement, et de même la mort du Seigneur, furent cachés au prince de ce monde : trois mystères à proclamer à haute voix, qui s’accomplirent dans le silence de Dieu. Comment donc furent-ils manifestés aux siècles ?


    Une étoile brilla dans le ciel, au-dessus de tous les astres. Sa lumière était inexprimable, et sa nouveauté provoquait l’étonnement. Tous les autres astres, avec le soleil et la lune, formèrent un chœur autour de l’étoile ; mais elle surpassait tous les autres par son éclat. On se demandait d’où venait cette nouveauté, si différente d’eux.


    Dès lors, toute magie fut dissoute et tout sortilège disparut ; l’ignorance du mal s’évanouit, l’ancien royaume fut renversé, lorsque Dieu se manifesta humainement, pour la nouveauté de la vie éternelle. Ce qui avait été préparé depuis toujours auprès de Dieu commença à prendre effet. Dès lors, toutes choses furent ébranlées, car la destruction de la mort était en préparation.'
