base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: fr
  text: 'La virginité de Marie, son enfantement, et de même la mort du Seigneur, furent cachés au prince de ce monde : trois mystères à proclamer à haute voix, qui s’accomplirent dans le silence de Dieu. Comment donc furent-ils manifestés aux siècles ?


    Une étoile brilla dans le ciel, au-dessus de tous les astres. Sa lumière était inexprimable, et sa nouveauté provoquait l’étonnement. Tous les autres astres, avec le soleil et la lune, formèrent un chœur autour de l’étoile ; mais elle surpassait tous les autres par son éclat. On se demandait d’où venait cette nouveauté, si différente d’eux.


    Dès lors, toute magie fut dissoute et tout sortilège disparut ; l’ignorance du mal s’évanouit, l’ancien royaume fut renversé, lorsque Dieu se manifesta humainement, pour la nouveauté de la vie éternelle. Ce qui avait été préparé depuis toujours auprès de Dieu commença à prendre effet. Dès lors, toutes choses furent ébranlées, car la destruction de la mort était en préparation.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince of this world (Greek likely ἄρχων τοῦ αἰῶνος τούτου)
  choice: prince de ce monde
  rationale: Conserve le titre traditionnel et sa portée cosmique sans préciser davantage l’identité du personnage.
- source_word: child-bearing (Greek likely ὁ τοκετός)
  choice: enfantement
  rationale: Terme naturel et digne qui désigne l’acte de mettre au monde, en parallèle avec « virginité ».
- source_word: mysteries to be cried aloud (Greek likely κραυγῆς μυστήρια)
  choice: mystères à proclamer à haute voix
  rationale: Préserve le contraste paradoxal entre la proclamation publique et le silence de Dieu.
- source_word: constellations / heavenly bodies (Greek likely τὰ λοιπὰ ἄστρα)
  choice: les autres astres
  rationale: Évite de surspécifier « constellations » et convient au regroupement incluant le soleil et la lune.
- source_word: ignorance of wickedness (Greek likely ἄγνοια κακίας)
  choice: l’ignorance liée au mal
  rationale: Maintient l’ambiguïté du rapport entre ignorance et mal au lieu de choisir arbitrairement « ignorance du mal » ou « ignorance mauvaise ».
- source_word: ancient kingdom (Greek likely παλαιὰ βασιλεία)
  choice: l’ancien royaume
  rationale: Rendu formel qui ne détermine pas explicitement de quel règne ou pouvoir il s’agit.
- source_word: in the likeness/form of man (Greek likely ἐν ὁμοιώματι ἀνθρωπίνης ζωῆς)
  choice: sous une forme humaine
  rationale: Exprime l’apparition humaine sans réduire le propos à une simple apparence trompeuse.
- source_word: abolishing of death (Greek likely κατάλυσις θανάτου)
  choice: abolition de la mort
  rationale: Conserve la force eschatologique et le substantif d’action du témoin.
theological_decisions:
- issue: Identité du « prince de ce monde »
  choice: Ne pas l’identifier explicitement
  alternative: Ajouter « le diable » ou « Satan »
  rationale: Le texte emploie un titre et laisse l’identification à son contexte théologique ; l’explicitation éliminerait cette retenue.
- issue: Rapport entre l’apparition de Dieu et l’humanité
  choice: « Dieu apparut sous une forme humaine »
  alternative: « Dieu devint homme » ou « Dieu parut être humain »
  rationale: Le premier choix irait au-delà de la formulation fournie, tandis que le second pourrait suggérer une apparence seulement illusoire.
- issue: Sens de la nouveauté de la vie éternelle
  choice: « en vue de la nouveauté de la vie éternelle »
  alternative: « dans la nouveauté de la vie éternelle »
  rationale: Le témoin anglais « unto » peut exprimer orientation ou résultat ; la traduction conserve cette dynamique sans imposer une localisation conceptuelle.
- issue: Statut du dessein divin déjà accompli mais entrant en vigueur
  choice: Conserver la tension entre accomplissement et commencement d’effet
  alternative: Harmoniser en disant simplement que le dessein commença à s’accomplir
  rationale: Le passage juxtapose intentionnellement un accomplissement dans les desseins de Dieu et son déploiement historique.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Le parallélisme, les passifs et les images cosmiques sont conservés. Aucun marqueur de note n’est requis puisque aucune note de bas de page n’est fournie. Projet nécessairement provisoire : la donnée transmise est un témoin anglais du texte grec de la recension moyenne, et la révision directe sur le grec reste à effectuer.'
