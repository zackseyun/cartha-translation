    Une étoile brilla dans le ciel, au-dessus de tous les astres. Sa lumière était inexprimable, et sa nouveauté provoquait l’étonnement. Tous les autres astres, avec le soleil et la lune, formèrent un chœur autour de l’étoile ; mais elle surpassait tous les autres par son éclat. On se demandait d’où venait cette nouveauté, si différente d’eux.


    Dès lors, toute magie fut dissoute et tout sortilège disparut ; l’ignorance du mal s’évanouit, l’ancien royaume fut renversé, lorsque Dieu se manifesta humainement, pour la nouveauté de la vie éternelle. Ce qui avait été préparé depuis toujours auprès de Dieu commença à prendre effet. Dès lors, toutes choses furent ébranlées, car la destruction de la mort était en préparation.'
