revisions:
- from: 'Les confins de l’univers ne me serviront à rien, pas plus que les royaumes de ce monde. Il vaut mieux pour moi mourir pour Jésus-Christ que régner jusqu’aux confins de la terre. C’est lui que je cherche, lui qui est mort pour nous ; c’est lui que je désire, lui qui est ressuscité [pour nous].[a]


