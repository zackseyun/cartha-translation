base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: fr
  text: 'Les confins de l’univers ne me serviront à rien, pas plus que les royaumes de ce monde. Il est bon pour moi de mourir pour Jésus-Christ plutôt que de régner sur les confins de la terre. C’est lui que je cherche, lui qui est mort pour nous ; c’est lui que je désire, lui qui est ressuscité [pour nous].[a]


    Les douleurs d’un nouvel enfantement sont sur moi. Soyez indulgents envers moi, frères. Ne m’empêchez pas de vivre ; ne désirez pas que je meure. Ne livrez pas au monde celui qui désire appartenir à Dieu, et ne l’égarez pas par les choses matérielles. Laissez-moi recevoir la lumière pure. Lorsque je serai arrivé là, alors je serai un homme.


    Permettez-moi d’être un imitateur de la passion de mon Dieu.[b] Si quelqu’un le porte en lui-même, qu’il comprenne ce que je désire et qu’il compatisse avec moi, car il connaît ce qui m’étreint.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « pour nous » sont conservés entre crochets parce qu’ils apparaissent ainsi dans le témoin fourni et signalent un supplément ou une restauration textuelle.
    reason: Préserver visiblement l’incertitude textuelle transmise par la source de travail.
  - marker: b
    text: Ici, « passion » désigne les souffrances et la mort, et non un sentiment intense.
    reason: Éviter le contresens courant en français moderne tout en conservant le terme théologiquement chargé.
lexical_decisions:
- source_word: farthest bounds
  choice: les confins
  rationale: Expression française naturelle et digne, qui conserve l’idée des limites les plus éloignées du monde.
- source_word: profit me nothing
  choice: ne me serviront à rien
  rationale: Rend clairement l’idée d’absence totale d’avantage sans archaïsme.
- source_word: pangs of a new birth
  choice: les douleurs d’un nouvel enfantement
  rationale: Préserve la métaphore de la naissance et sa tension avec la mort imminente.
- source_word: pure light
  choice: la pure lumière
  rationale: Maintient sans l’expliciter l’image spirituelle du témoignage.
- source_word: passion
  choice: passion
  rationale: Le terme français garde ici le sens traditionnel des souffrances conduisant à la mort, avec une note pour prévenir l’acception moderne dominante.
- source_word: straiten me
  choice: ce qui m’étreint
  rationale: Préserve l’image d’une pression ou contrainte intérieure sans trancher entre souffrances, désir et circonstances.
theological_decisions:
- issue: Paradoxe entre vie et mort
  choice: « Ne m’empêchez pas de vivre ; ne souhaitez pas ma mort »
  alternative: Expliciter la « vraie vie » et la « mort spirituelle »
  rationale: Le texte associe paradoxalement le martyre à la vie et l’empêchement du martyre à la mort. La traduction conserve cette tension sans imposer une interprétation doctrinale.
- issue: Supplément entre crochets après « ressuscité »
  choice: Conserver « [pour nous] »
  alternative: Omettre les mots ou les intégrer sans crochets
  rationale: Les crochets signalent honnêtement que ces mots sont une restauration ou un supplément dans le témoin fourni.
- issue: « alors je serai un homme »
  choice: « alors je serai véritablement un être humain »
  alternative: « alors je serai un homme »
  rationale: La formulation vise l’accomplissement de l’existence humaine, non une distinction de sexe ; « véritablement » rend la force contextuelle sans développer une doctrine particulière.
- issue: « mon Dieu » appliqué à celui dont Ignace imite la passion
  choice: Conserver « la passion de mon Dieu »
  alternative: « les souffrances de mon Dieu » ou reformulation christologique explicite
  rationale: Cette désignation théologique forte appartient au texte et ne doit être ni atténuée ni développée au-delà de sa formulation.
- issue: Présence de « lui » en soi
  choice: « Si quelqu’un le porte en lui-même »
  alternative: Identifier explicitement Jésus-Christ ou Dieu
  rationale: Le référent demeure implicite dans le passage ; la traduction conserve cette continuité et cette légère ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Les apostrophes fraternelles et les paradoxes liés au martyre sont conservés. Le draft reste provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne est encore attendue ; les décisions ont donc été prises avec prudence à partir du témoin anglais public et de la couche POB auditée.
