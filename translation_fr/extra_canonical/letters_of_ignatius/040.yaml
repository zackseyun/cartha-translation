  revision_rationale: 'Le texte est corrigé sur le grec disponible de la recension moyenne: διάνοια, ὑπομονή, κατὰ θεὸν καὶ Ἰησοῦν Χριστόν, συνεχάρη, πλῆθος, θεοπρεπής et ἐδόξασα. Les explicitations non exprimées dans le grec sont retirées, tandis que les ambiguïtés pertinentes sont préservées. Aucune note n’est requise: le sens de θεοπρεπής est rendu dans le texte même.'
