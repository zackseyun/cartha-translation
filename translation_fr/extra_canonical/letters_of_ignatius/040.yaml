base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: fr
  text: 'J’ai appris que vous avez une disposition irréprochable et inébranlable dans l’endurance, non par habitude, mais par nature, comme me l’a fait savoir Polybe, votre évêque. Selon Dieu et Jésus-Christ, il est venu me voir à Smyrne; il s’est si grandement réjoui avec moi dans mes chaînes en Christ Jésus que, en lui, j’ai contemplé toute votre multitude.


    Ayant donc reçu par son intermédiaire votre bienveillance digne de Dieu, j’ai rendu gloire, car j’avais découvert, comme je l’avais appris, que vous êtes des imitateurs de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind (Greek review pending)
  choice: esprit
  rationale: « Esprit » exprime ici la disposition intérieure ou l’état d’esprit collectif sans réduire le terme à l’intellect.
- source_word: steadfast in patience
  choice: une patience inébranlable
  rationale: Cette formulation naturelle conserve à la fois l’endurance et la fermeté exprimées par le témoin.
- source_word: by nature
  choice: par nature
  rationale: Le rendu formel préserve le contraste marqué avec « par habitude », sans chercher à en résoudre la portée anthropologique.
- source_word: bishop
  choice: évêque
  rationale: Terme français historique et courant correspondant au titre ecclésial transmis par le témoin.
- source_word: bonds
  choice: chaînes
  rationale: « Chaînes » garde l’image concrète de l’emprisonnement, fréquente dans les écrits chrétiens anciens.
- source_word: whole multitude
  choice: toute votre communauté
  rationale: Le contexte désigne l’ensemble des destinataires; « communauté » est plus naturel en français que « multitude » tout en maintenant la portée collective.
- source_word: imitators of God
  choice: imitateurs de Dieu
  rationale: Le calque intelligible conserve la force théologique et l’écho du vocabulaire chrétien ancien.
theological_decisions:
- issue: Relation entre la volonté de Dieu et celle de Jésus-Christ
  choice: Par la volonté de Dieu et de Jésus-Christ
  alternative: Par la volonté de Dieu, qui est aussi celle de Jésus-Christ
  rationale: La traduction maintient la coordination du témoin sans définir davantage la relation théologique entre Dieu et Jésus-Christ.
- issue: Joie partagée dans les chaînes
  choice: il a partagé avec tant de joie celle que j’éprouve dans mes chaînes en Christ Jésus
  alternative: il s’est grandement réjoui avec moi de mes chaînes en Christ Jésus
  rationale: Le choix rend le sens relationnel en français naturel, tout en évitant de suggérer que les chaînes elles-mêmes seraient l’unique objet de la joie.
- issue: Objet implicite de « j’ai rendu gloire »
  choice: j’ai rendu gloire à Dieu
  alternative: j’ai glorifié
  rationale: Le complément est explicité selon l’usage théologique naturel et le contexte immédiat, sans introduire une autre figure divine.
- issue: Disposition dite « par nature »
  choice: non par habitude, mais par nature
  alternative: non par simple pratique, mais comme une disposition innée
  rationale: La formulation littérale préserve la tension entre habitude et nature, dont la portée exacte devra être contrôlée sur le grec.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe fluide adaptée à une lettre ancienne. Le présent projet demeure provisoire, car le dossier fourni précise que l’examen direct du grec de la recension moyenne reste à faire. « Polybe » est retenu comme forme française traditionnelle de Polybius.
