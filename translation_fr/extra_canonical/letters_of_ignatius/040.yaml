revisions:
- from: 'J’ai appris que vous avez un esprit irréprochable et une patience inébranlable, non par habitude, mais par nature, comme me l’a rapporté Polybe, votre évêque. Par la volonté de Dieu et de Jésus-Christ, il est venu me voir à Smyrne et il a partagé avec tant de joie celle que j’éprouve dans mes chaînes en Christ Jésus qu’en lui j’ai vu toute votre communauté.


    Ayant donc reçu par son intermédiaire votre bienveillance selon Dieu[a], j’ai rendu gloire à Dieu, puisque j’avais constaté que vous êtes des imitateurs de Dieu, comme je l’avais appris.'
  to: 'J’ai appris que vous avez une disposition irréprochable et inébranlable dans l’endurance, non par habitude, mais par nature, comme me l’a fait savoir Polybe, votre évêque. Selon Dieu et Jésus-Christ, il est venu me voir à Smyrne; il s’est si grandement réjoui avec moi dans mes chaînes en Christ Jésus que, en lui, j’ai contemplé toute votre multitude.


    Ayant donc reçu par son intermédiaire votre bienveillance digne de Dieu, j’ai rendu gloire, car j’avais découvert, comme je l’avais appris, que vous êtes des imitateurs de Dieu.'
  rationale: 'Le texte est corrigé sur le grec disponible de la recension moyenne: διάνοια, ὑπομονή, κατὰ θεὸν καὶ Ἰησοῦν Χριστόν, συνεχάρη, πλῆθος, θεοπρεπής et ἐδόξασα. Les explicitations non exprimées dans le grec sont retirées, tandis que les ambiguïtés pertinentes sont préservées. Aucune note n’est requise: le sens de θεοπρεπής est rendu dans le texte même.'
  reviewer_model: gpt-5.6-terra
