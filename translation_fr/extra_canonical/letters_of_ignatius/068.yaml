    text: Le « presbytérat » désigne ici le corps collégial des presbytres, c’est-à-dire des anciens responsables de la communauté.
    reason: Éclaire le terme ecclésial ancien sans l’identifier à une structure confessionnelle moderne.
  - marker: b
    text: 'La formule finale est concise : elle peut aussi se rendre par « selon Dieu ». Elle indique la conformité de l’action à Dieu, sans préciser davantage le sens de cette conformité.'
    reason: Conserve l’ambiguïté de la formule et évite une paraphrase doctrinalement plus déterminée.
  revision_rationale: La révision retire l’ajout interprétatif « célébrer » et rend l’exhortation à l’unité eucharistique avec une formulation française naturelle. Elle rapproche « presbytérat » du terme collectif ancien, améliore la fluidité de la relation de la coupe à l’union, et remplace la finale trop elliptique par « conformément à Dieu », sans ajouter « volonté de Dieu » ni autre précision doctrinale. Les deux appels de note restent correctement ancrés après les termes qu’ils éclairent.
