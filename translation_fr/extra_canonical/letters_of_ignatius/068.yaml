revisions:
- from: Veillez donc à ne célébrer qu’une seule eucharistie. En effet, il y a une seule chair de notre Seigneur Jésus-Christ et une seule coupe pour l’union dans son sang ; il y a un seul autel, tout comme il y a un seul évêque avec le conseil des anciens[a] et les diacres, mes compagnons de service. Ainsi, quoi que vous fassiez, faites-le selon Dieu.[b]
  to: Veillez donc à vous attacher à une seule eucharistie (car il n’y a qu’une seule chair de notre Seigneur Jésus Christ et une seule coupe en vue de l’union dans son sang ; il n’y a qu’un seul autel, comme il n’y a qu’un seul évêque, avec le presbytérat[a] et les diacres, mes compagnons de service), afin que, quoi que vous fassiez, vous le fassiez conformément à Dieu.[b]
  rationale: La révision retire l’ajout interprétatif « célébrer » et rend l’exhortation à l’unité eucharistique avec une formulation française naturelle. Elle rapproche « presbytérat » du terme collectif ancien, améliore la fluidité de la relation de la coupe à l’union, et remplace la finale trop elliptique par « conformément à Dieu », sans ajouter « volonté de Dieu » ni autre précision doctrinale. Les deux appels de note restent correctement ancrés après les termes qu’ils éclairent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement le témoin anglais et respecte la structure unitaire de l’argument. Toutefois, « ne célébrer qu’une seule eucharistie » ajoute un verbe cultuel qui n’est pas exprimé par « observe one eucharist » et risque de transformer l’exhortation à maintenir/observer l’unité eucharistique en une limitation numérique de célébrations. La finale « faites-le selon Dieu » est trop elliptique en français moderne, alors que le sens grec traditionnellement édité (κατὰ Θεόν) est bien rendu par « conformément à Dieu » / « selon Dieu »; « conformément à Dieu » est plus idiomatique sans introduire « volonté ».

    '
  naturalness: 'Le registre est digne et généralement naturel. « Conseil des anciens » est clair, mais « presbytérat » est plus proche du terme technique collectif sans imposer « collège des prêtres ». « Pour l’union dans son sang » demeure lourd et ambigu de façon peu française; « en vue de l’union dans son sang » conserve l’ambiguïté tout en étant plus fluide. La ponctuation parenthétique est préférable, car toute l’explication centrale est une incise dans le témoin.

    '
  terminology: '« Eucharistie », « chair », « coupe », « autel », « évêque » et « diacres » sont appropriés. « Presbytérat » reproduit mieux le collectif πρεσβυτέριον que « conseil des anciens », tout en pouvant être éclairé en note. « Compagnons de service » rend fidèlement le rapport de συνδούλοι sans assimilation indue des fonctions.

    '
  issues:
  - severity: medium
    issue: « ne célébrer qu’une seule eucharistie » explicite indûment le verbe et peut suggérer une restriction quantitative.
    rationale: Le témoin demande d’« observer une seule eucharistie »; l’enjeu est l’unité. « Vous attacher à une seule eucharistie » préserve mieux cette portée sans ajouter l’acte de célébrer.
  - severity: low
    issue: « conseil des anciens » est interprétatif pour « presbytery ».
    rationale: Le terme désigne bien un corps collégial, mais « presbytérat » est plus directement calqué sur le terme institutionnel ancien; une note peut en donner l’explication non confessionnelle.
  - severity: low
    issue: La note b attribue une pseudo-littéralité au seul témoin anglais et propose « à la manière de Dieu », formulation moins exacte.
    rationale: La formule est attestée dans la tradition grecque sous la forme concise κατὰ Θεόν; la note doit signaler l’ambiguïté sans présenter une paraphrase comme équivalente.
  revised_text: Veillez donc à vous attacher à une seule eucharistie (car il n’y a qu’une seule chair de notre Seigneur Jésus Christ et une seule coupe en vue de l’union dans son sang ; il n’y a qu’un seul autel, comme il n’y a qu’un seul évêque, avec le presbytérat[a] et les diacres, mes compagnons de service), afin que, quoi que vous fassiez, vous le fassiez conformément à Dieu.[b]
  revised_footnotes:
