base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: fr
  text: Veillez donc à vous attacher à une seule eucharistie (car il n’y a qu’une seule chair de notre Seigneur Jésus Christ et une seule coupe en vue de l’union dans son sang ; il n’y a qu’un seul autel, comme il n’y a qu’un seul évêque, avec le presbytérat[a] et les diacres, mes compagnons de service), afin que, quoi que vous fassiez, vous le fassiez conformément à Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « presbytérat » désigne ici le corps collégial des presbytres, c’est-à-dire des anciens responsables de la communauté.
    reason: Éclaire le terme ecclésial ancien sans l’identifier à une structure confessionnelle moderne.
  - marker: b
    text: 'La formule finale est concise : elle peut aussi se rendre par « selon Dieu ». Elle indique la conformité de l’action à Dieu, sans préciser davantage le sens de cette conformité.'
    reason: Conserve l’ambiguïté de la formule et évite une paraphrase doctrinalement plus déterminée.
lexical_decisions:
- source_word: one eucharist
  choice: une seule eucharistie
  rationale: Conserve le terme historique et cultuel « eucharistie », tout en rendant explicitement la valeur numérique et unificatrice de « one ».
- source_word: presbytery
  choice: conseil des anciens
  rationale: Rend le groupe collégial des presbytres dans un français accessible, sans l’identifier automatiquement au sens moderne de « prêtres ».
- source_word: deacons my fellow-servants
  choice: les diacres, mes compagnons de service
  rationale: Conserve le titre ministériel traditionnel et exprime le rapport de service partagé sans suggérer une identité de fonction.
- source_word: altar
  choice: autel
  rationale: Maintient l’image cultuelle du témoin, étroitement liée dans la phrase à l’unité de l’eucharistie et de la communauté.
- source_word: after God
  choice: selon Dieu
  rationale: Préserve la formulation dense et quelque peu inhabituelle du témoin plutôt que de préciser sans preuve « selon la volonté de Dieu ».
theological_decisions:
- issue: Nature de l’union associée à la coupe
  choice: pour l’union dans son sang
  alternative: pour nous unir à son sang
  rationale: La formulation retenue conserve l’ambiguïté du témoin quant aux participants et à la nature exacte de l’union, sans imposer une explication sacramentelle particulière.
- issue: Terminologie du presbytérat
  choice: conseil des anciens
  alternative: presbyterium / collège des prêtres
  rationale: Ce choix évite d’importer directement des structures confessionnelles ultérieures tout en signalant une instance collégiale auprès de l’évêque.
- issue: Norme finale de l’action communautaire
  choice: faites-le selon Dieu
  alternative: faites-le conformément à la volonté de Dieu
  rationale: La version plus littérale garde la tension et la concision de l’expression transmise, alors que l’alternative en expliciterait l’objet.
translation_notes:
  register: 'Français international moderne, digne et lisible. Le vouvoiement pluriel est rendu par des impératifs collectifs. Cette proposition demeure provisoire : elle est fondée sur le témoin anglais public de J. B. Lightfoot, la vérification directe du grec de la recension moyenne étant encore en attente.'
