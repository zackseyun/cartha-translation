base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: fr
  text: 'Les prêtres aussi étaient bons, mais meilleur est le grand prêtre, à qui est confié le Saint des saints. Car à lui seul sont confiées les choses cachées de Dieu. Il est lui-même la porte du Père, par laquelle entrent Abraham, Isaac et Jacob, ainsi que les prophètes, les apôtres et l’Église tout entière. Tout cela concourt à l’unité de Dieu.


    Mais l’Évangile a quelque chose d’unique : la venue du Sauveur, notre Seigneur Jésus Christ, sa souffrance et sa résurrection. Car les prophètes bien-aimés l’annonçaient dans leur prédication, tandis que l’Évangile est l’accomplissement de l’immortalité. Toutes ces choses réunies sont bonnes, si vous croyez dans l’amour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: High-priest
  choice: grand prêtre
  rationale: Expression française courante et digne, correspondant au titre cultuel sans ajouter d’interprétation confessionnelle.
- source_word: holy of holies
  choice: Saint des saints
  rationale: Désignation biblique française reconnue du sanctuaire intérieur; la majuscule signale ici le lieu sacré désigné comme titre.
- source_word: hidden things of God
  choice: réalités cachées de Dieu
  rationale: « Réalités » conserve la portée générale de « things » tout en évitant le tour moins naturel « choses cachées ».
- source_word: door of the Father
  choice: porte du Père
  rationale: Métaphore conservée formellement, avec son écho johannique, sans explicitation.
- source_word: combine in the unity of God
  choice: converge vers l’unité de Dieu
  rationale: Rend le mouvement de rassemblement sans trancher si l’unité est source, sphère ou but.
- source_word: Gospel
  choice: Évangile
  rationale: Terme chrétien établi; la majuscule indique le message évangélique dans son ensemble.
- source_word: passion
  choice: souffrance
  rationale: Terme immédiatement intelligible en français moderne, sans perdre la référence aux souffrances et à la mort du Christ.
- source_word: completion of immortality
  choice: accomplissement de l’immortalité
  rationale: Préserve une formulation théologiquement dense et inhabituelle plutôt que de la réduire à une paraphrase explicative.
- source_word: believe through love
  choice: croyez dans l’amour
  rationale: Maintient le lien entre foi et amour tout en signalant en note l’incertitude de la relation exacte exprimée par la préposition du témoin.
theological_decisions:
- issue: Identité du grand prêtre
  choice: Conserver le titre sans ajouter explicitement « Christ »
  alternative: « le Christ, notre grand prêtre »
  rationale: Le contexte suggère fortement le Christ, mais le témoin fourni ne le nomme pas dans cette phrase; l’explicitation effacerait la progression rhétorique.
- issue: La porte du Père et ceux qui y entrent
  choice: Conserver au présent « entrent » et inclure patriarches, prophètes, apôtres et Église dans une même construction
  alternative: Employer un passé pour les anciens personnages ou expliciter leur accès au Père par le Christ
  rationale: Le présent et l’énumération expriment une unité théologique que la traduction ne doit ni temporaliser ni développer.
- issue: Prééminence de l’Évangile
  choice: Faire de la venue, de la souffrance et de la résurrection le contenu explicatif de cette prééminence
  alternative: « l’Évangile a une prééminence particulière dans la venue… »
  rationale: Le témoin anglais permet une relation syntaxique incertaine; les deux-points donnent un français naturel tout en présentant les événements comme ce qui distingue l’Évangile, sans théorie supplémentaire.
- issue: Rapport entre prophètes et Évangile
  choice: « tandis que »
  alternative: « mais »
  rationale: Conserve le contraste entre annonce prophétique et accomplissement évangélique sans opposer négativement les prophètes à l’Évangile.
- issue: Foi et amour
  choice: « si vous croyez dans l’amour »
  alternative: « si vous croyez par amour »
  rationale: Le témoin anglais « through love » peut exprimer le moyen, la manière ou la sphère; le choix retenu préserve davantage cette ouverture, complétée par une note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les parallélismes et les métaphores cultuelles ont été conservés. Cette version reste provisoire, car le dossier précise que l’examen direct de la tradition grecque de la recension moyenne est encore en attente.
