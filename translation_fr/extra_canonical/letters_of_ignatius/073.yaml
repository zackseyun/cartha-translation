revisions:
- from: 'Les prêtres, eux aussi, étaient bons, mais meilleur est le grand prêtre, à qui le Saint des saints est confié. Car à lui seul sont confiées les réalités cachées de Dieu. Il est lui-même la porte du Père, par laquelle entrent Abraham, Isaac et Jacob, ainsi que les prophètes, les apôtres et l’Église tout entière. Tout cela converge vers l’unité de Dieu.


    Mais l’Évangile possède une prééminence particulière : la venue du Sauveur, notre Seigneur Jésus Christ, sa souffrance et sa résurrection. Car les prophètes bien-aimés l’annonçaient dans leur prédication, tandis que l’Évangile est l’accomplissement de l’immortalité. Toutes ces choses réunies sont bonnes, si vous croyez dans l’amour.[a]'
  to: 'Les prêtres aussi étaient bons, mais meilleur est le grand prêtre, à qui est confié le Saint des saints. Car à lui seul sont confiées les choses cachées de Dieu. Il est lui-même la porte du Père, par laquelle entrent Abraham, Isaac et Jacob, ainsi que les prophètes, les apôtres et l’Église tout entière. Tout cela concourt à l’unité de Dieu.


    Mais l’Évangile a quelque chose d’unique : la venue du Sauveur, notre Seigneur Jésus Christ, sa souffrance et sa résurrection. Car les prophètes bien-aimés l’annonçaient dans leur prédication, tandis que l’Évangile est l’accomplissement de l’immortalité. Toutes ces choses réunies sont bonnes, si vous croyez dans l’amour.'
  rationale: La révision aligne le passage sur le grec de la recension moyenne sans surinterpréter ses formulations théologiques. Elle supprime une note qui ne correspond pas à la préposition grecque ἐν, rétablit le caractère exceptionnel de l’Évangile et affine l’expression de l’unité de Dieu. Les ambiguïtés et les métaphores du texte sont conservées.
