base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: fr
  text: Les Éphésiens de Smyrne vous saluent ; c’est aussi de là que je vous écris. Ils sont ici avec moi pour la gloire de Dieu, comme vous l’êtes vous aussi, et ils m’ont réconforté en toutes choses, avec Polycarpe, évêque de Smyrne. Oui, toutes les autres Églises vous saluent également en l’honneur de Jésus Christ. Portez-vous bien dans une concorde selon Dieu, gardant un esprit inébranlable, qui est Jésus Christ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: from whence
  choice: c’est aussi de là
  rationale: Rend naturellement le renvoi à Smyrne tout en conservant l’indication du lieu d’où Ignace écrit.
- source_word: comforted
  choice: réconforté
  rationale: Terme français courant qui garde l’idée de soutien et de soulagement exprimée par le témoin anglais.
- source_word: bishop of the Smyrnaeans
  choice: évêque des Smyrniotes
  rationale: « Smyrniotes » désigne les habitants de Smyrne et évite de transformer l’expression en simple titre territorial moderne.
- source_word: godly concord
  choice: une harmonie conforme à Dieu
  rationale: Formulation claire et digne qui exprime une concorde déterminée par la relation à Dieu, sans réduire l’expression à une simple bonne entente.
- source_word: steadfast spirit
  choice: un esprit ferme
  rationale: Suit le sens du témoin fourni tout en restant naturel en français ; la vérification directe du terme grec demeure nécessaire.
- source_word: possess ye
  choice: gardez
  rationale: « Gardez » est idiomatique en français moderne et exprime la possession durable demandée par l’exhortation.
theological_decisions:
- issue: Identification de l’« esprit ferme » à Jésus-Christ
  choice: qui est Jésus-Christ
  alternative: c’est-à-dire Jésus-Christ
  rationale: La proposition relative conserve l’identification forte et sa tension théologique sans l’expliquer ni l’atténuer.
- issue: Sens de « comme vous l’êtes vous aussi »
  choice: comme vous l’êtes vous aussi
  alternative: tout comme vous contribuez vous aussi à la gloire de Dieu
  rationale: La formulation garde l’ellipse et l’ambiguïté du témoin au lieu d’expliciter arbitrairement le rapport exact à la gloire de Dieu.
- issue: « dans l’honneur de Jésus-Christ »
  choice: dans l’honneur de Jésus-Christ
  alternative: en l’honneur de Jésus-Christ
  rationale: La traduction retenue préserve la construction inhabituelle du témoin, susceptible de décrire la sphère ou la dignité dans laquelle la salutation est donnée, plutôt que d’imposer un sens final ou dédicatoire.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions et les formulations théologiquement denses sont conservées. Le texte repose provisoirement sur le témoin anglais public fourni ; une révision directe de la tradition grecque de la recension moyenne reste nécessaire, notamment pour « esprit ferme » et « dans l’honneur ».
