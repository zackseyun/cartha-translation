revisions:
- from: Les Éphésiens qui sont à Smyrne vous saluent ; c’est aussi de là que je vous écris. Ils sont ici avec moi pour la gloire de Dieu, comme vous l’êtes vous aussi, et ils m’ont réconforté en toutes choses, avec Polycarpe, évêque des Smyrniotes. Oui, toutes les autres Églises vous saluent également dans l’honneur de Jésus-Christ. Portez-vous bien, dans une harmonie conforme à Dieu, et gardez un esprit ferme, qui est Jésus-Christ.
  to: Les Éphésiens de Smyrne vous saluent ; c’est aussi de là que je vous écris. Ils sont ici avec moi pour la gloire de Dieu, comme vous l’êtes vous aussi, et ils m’ont réconforté en toutes choses, avec Polycarpe, évêque de Smyrne. Oui, toutes les autres Églises vous saluent également en l’honneur de Jésus Christ. Portez-vous bien dans une concorde selon Dieu, gardant un esprit inébranlable, qui est Jésus Christ.
  rationale: Révision limitée à des formulations françaises plus idiomatiques et à une restitution un peu plus précise de termes grecs saillants (ἀκλόνητον ; ὁμονοίᾳ θεοῦ). L’ellipse de « comme vous l’êtes vous aussi » et l’identification finale de l’esprit à Jésus Christ sont maintenues, car le texte source les présente sans les expliquer. Aucune note n’est nécessaire pour ce court passage.
  reviewer_model: gpt-5.6-terra
