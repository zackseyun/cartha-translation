  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: fr
  text: 'Il convient donc que vous couriez d’accord avec la pensée de l’évêque, comme vous le faites d’ailleurs. En effet, votre honorable conseil des anciens, digne de Dieu, est accordé à l’évêque comme les cordes à une lyre. Ainsi, dans votre unité et votre amour harmonieux, Jésus-Christ est chanté.


    Que chacun de vous devienne un chœur, afin que, accordés dans l’unité et prenant la note de Dieu, vous chantiez à l’unisson, d’une seule voix, par Jésus-Christ, au Père. Ainsi, il vous entendra et reconnaîtra, par vos bonnes œuvres, que vous êtes membres de son Fils. Il vous est donc profitable de demeurer dans une unité irréprochable, afin d’avoir toujours part à Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque rendue par « avoir part à Dieu » peut aussi se traduire par « participer à Dieu » ou « partager la vie de Dieu ».
    reason: Signale l’amplitude sémantique et théologique de μετέχειν θεοῦ sans imposer une interprétation confessionnelle.
lexical_decisions:
- source_word: τρέχειν / γνώμη
  choice: avanciez en accord avec la pensée
  rationale: Conserve l’image dynamique de « courir/avancer » et rend γνώμη par « pensée », sans réduire le terme à un simple ordre administratif.
- source_word: πρεσβυτέριον
  choice: conseil des anciens
  rationale: Expression claire en français moderne qui traduit la réalité collective du presbytérion sans imposer un vocabulaire confessionnel contemporain.
- source_word: συνηρμοσμένον / λύρα
  choice: est accordé… comme les cordes d’une lyre
  rationale: Préserve la métaphore musicale qui structure tout le passage.
- source_word: χορός
  choice: chœur
  rationale: Maintient à la fois l’idée d’un ensemble organisé et celle du chant collectif.
- source_word: χρῶμα θεοῦ
  choice: le ton de Dieu
  rationale: Rend l’image musicale rare du terme, qui peut désigner une tonalité ou nuance, sans la transformer en formulation doctrinale.
- source_word: μέλη τοῦ υἱοῦ αὐτοῦ
  choice: membres de son Fils
  rationale: Conserve la métaphore corporelle et son expression théologiquement dense.
- source_word: μετέχειν θεοῦ
  choice: participer… à Dieu
  rationale: Traduction volontairement proche qui préserve la force et l’ouverture de la formule grecque.
theological_decisions:
- issue: Rapport de la communauté à l’évêque
  choice: « en accord avec la pensée de l’évêque »
  alternative: « conformément aux directives de l’évêque »
  rationale: La formulation retenue respecte le sens large de γνώμη et n’accentue pas indûment une lecture juridictionnelle.
- issue: Identification par les œuvres
  choice: « reconnaîtra, à vos bonnes œuvres, que vous êtes membres de son Fils »
  alternative: « vous reconnaîtra comme membres de son Fils à cause de vos bonnes œuvres »
  rationale: « À vos bonnes œuvres » indique le signe de reconnaissance sans présenter les œuvres comme la cause méritoire de cette appartenance.
- issue: Participation à Dieu
  choice: « participer toujours à Dieu »
  alternative: « avoir toujours part à Dieu »
  rationale: La tournure plus littérale conserve la tension ontologique et relationnelle de l’expression, expliquée en note plutôt que résolue dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le réseau d’images musicales — accord, lyre, harmonie, chœur, ton, unisson et voix — est maintenu. « Conseil des anciens » évite l’ambiguïté moderne de « presbytère ». Le projet demeure prudent puisque l’indication fournie précise que la vérification directe du grec est encore en attente.
