revisions:
- from: 'Il convient donc que vous avanciez en accord avec la pensée de l’évêque, comme vous le faites d’ailleurs. En effet, votre respectable conseil des anciens, digne de Dieu, est accordé à l’évêque comme les cordes d’une lyre. Ainsi, dans votre unité et votre amour harmonieux, Jésus-Christ est chanté.


    Que chacun de vous se joigne donc à ce chœur : accordés dans l’unité et prenant le ton de Dieu, vous chanterez à l’unisson, d’une seule voix, par Jésus-Christ, pour le Père. Ainsi, il vous entendra et reconnaîtra, à vos bonnes œuvres, que vous êtes membres de son Fils. Il vous est donc profitable de demeurer dans une unité irréprochable, afin de participer toujours à Dieu.[a]'
  to: 'Il convient donc que vous couriez d’accord avec la pensée de l’évêque, comme vous le faites d’ailleurs. En effet, votre honorable conseil des anciens, digne de Dieu, est accordé à l’évêque comme les cordes à une lyre. Ainsi, dans votre unité et votre amour harmonieux, Jésus-Christ est chanté.


    Que chacun de vous devienne un chœur, afin que, accordés dans l’unité et prenant la note de Dieu, vous chantiez à l’unisson, d’une seule voix, par Jésus-Christ, au Père. Ainsi, il vous entendra et reconnaîtra, par vos bonnes œuvres, que vous êtes membres de son Fils. Il vous est donc profitable de demeurer dans une unité irréprochable, afin d’avoir toujours part à Dieu.[a]'
  rationale: 'La révision rétablit les images et les relations syntaxiques du grec: l’élan de « courir », la constitution individuelle d’un chœur, la « note » reçue de Dieu, le Père comme destinataire du chant, et la finalité de l’unité. Elle conserve le choix sobre de « conseil des anciens » et l’ambiguïté théologique de la participation à Dieu, explicitée avec prudence en note.'
