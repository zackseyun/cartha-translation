review_pass:
  verdict: revise
  source_fidelity: 'La révision corrige plusieurs déplacements de sens : les mouvements « vers un seul temple / vers un seul autel » doivent être conservés, et la formule finale ne doit pas transformer les présents et l’aoriste du témoin (« is with ... departed unto ») en « était ... est retourné ». « D’un seul Père » rend plus exactement l’insistance numérique que « du Père unique ».'
  naturalness: Le français révisé demeure moderne et exhortatif, tout en évitant les formulations peu idiomatiques « comme en un seul temple, Dieu » et « comme autour d’un seul autel ». « Une même prière » et « dans un même lieu » rendent l’unité communautaire avec netteté.
  terminology: « Évêque », « presbytres », « autel » et « Jésus-Christ » sont maintenus. La désignation énigmatique répétée de l’Un est préservée sans explication doctrinale ajoutée.
  issues:
  - severity: high
    issue: Les directions cultuelles ont été modifiées.
    rationale: Le témoin dit de se réunir « as to one temple ... as to one altar », et le grec sous-jacent emploie des mouvements vers le temple et l’autel. « Comme en un temple » et « comme autour d’un autel » changent cette orientation.
  - severity: high
    issue: La phrase finale a été paraphrasée avec des temps et un mouvement non attestés.
    rationale: « Qui était auprès de l’Unique et qui est retourné vers l’Unique » remplace « is with One and departed unto One ». Le passage est textuellement condensé et doit rester aussi proche que possible, avec note.
  - severity: medium
    issue: « Cette espérance, c’est Jésus-Christ » impose un antécédent étroit à une construction possiblement récapitulative.
    rationale: Le relatif/neutre peut reprendre la série entière (prière, supplication, pensée et espérance), et non la seule espérance. « Cela, c’est Jésus-Christ » conserve l’ambiguïté.
  - severity: low
    issue: « Du Père unique » est moins précis que « d’un seul Père ».
    rationale: La répétition de « un/seul » est rhétoriquement importante et ne désigne pas nécessairement le Père par l’adjectif qualitatif « unique ».
  revised_text: 'Ainsi donc, de même que le Seigneur n’a rien fait sans le Père, [étant uni à lui],[a] ni par lui-même ni par les apôtres, vous non plus, ne faites rien sans l’évêque et les presbytres. Ne cherchez pas non plus à tenir pour raisonnable quoi que ce soit de votre propre initiative, à l’écart des autres ; mais que, dans un même lieu, il y ait une même prière, une même supplication, une même pensée, une même espérance, dans l’amour et dans une joie irréprochable. Cela, c’est Jésus-Christ, et il n’y a rien de meilleur que lui.[b]


    Empressez-vous tous de vous rassembler vers un seul temple, qui est Dieu ; vers un seul autel, qui est un seul Jésus-Christ, lui qui est sorti d’un seul Père, qui est avec l’Un et est allé vers l’Un.[c]


    [a] Les crochets signalent une restitution ou une incertitude dans le témoin anglais utilisé pour ce projet provisoire.


    [b] La formule « Cela, c’est Jésus-Christ » peut reprendre l’ensemble de la série précédente (prière, supplication, pensée et espérance), plutôt que la seule espérance.


    [c] La formule finale est volontairement condensée. Elle suit de près le témoin anglais : « who came forth from One Father and is with One and departed unto One ».'
  revised_footnotes:
  - marker: a
    text: Les crochets signalent une restitution ou une incertitude dans le témoin anglais utilisé pour ce projet provisoire.
    reason: Le témoin fourni place « being united with Him » entre crochets.
  - marker: b
    text: La formule « Cela, c’est Jésus-Christ » peut reprendre l’ensemble de la série précédente (prière, supplication, pensée et espérance), plutôt que la seule espérance.
    reason: Préserve l’ambiguïté de portée sans privilégier silencieusement un seul antécédent.
  - marker: c
    text: 'La formule finale est volontairement condensée. Elle suit de près le témoin anglais : « who came forth from One Father and is with One and departed unto One ».'
    reason: Évite d’ajouter les nuances interprétatives « était auprès » et « est retourné », absentes du témoin.
  revision_rationale: Une correction complète est nécessaire afin de rétablir les mouvements vers le temple et l’autel, de préserver l’ambiguïté de la phrase sur Jésus-Christ et de ne pas modifier la chronologie ni la direction de la formule finale. Les notes ont été adaptées aux ancres et au texte révisé.
