base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: fr
  text: 'Ainsi donc, de même que le Seigneur n’a rien fait sans le Père, [étant uni à lui],[a] ni par lui-même ni par les apôtres, vous non plus, ne faites rien sans l’évêque et les presbytres. Ne cherchez pas non plus à tenir pour juste quoi que ce soit de votre propre chef, à l’écart des autres. Mais qu’il y ait une seule prière commune, une seule supplication, une seule pensée, une seule espérance, dans l’amour et dans une joie irréprochable — cette espérance, c’est Jésus-Christ, et rien ne vaut mieux que lui.[b]


    Empressez-vous de vous rassembler tous ensemble, comme en un seul temple, Dieu ; comme autour d’un seul autel, Jésus-Christ, lui qui est issu du Père unique, qui était auprès de l’Unique et qui est retourné vers l’Unique.[c]


    [a] Les crochets signalent une restitution ou une incertitude dans le témoin anglais utilisé pour ce projet provisoire.

    [b] La construction du témoin peut aussi rattacher « qui est Jésus-Christ » à l’ensemble précédent, plutôt qu’à la seule espérance.

    [c] Littéralement, selon le témoin anglais : « qui est avec l’Unique et est parti vers l’Unique ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les crochets signalent une restitution ou une incertitude dans le témoin anglais utilisé pour ce projet provisoire.
    reason: Le texte fourni place « being united with Him » entre crochets, et la révision directe du grec est signalée comme encore en attente.
  - marker: b
    text: La construction du témoin peut aussi rattacher « qui est Jésus-Christ » à l’ensemble précédent, plutôt qu’à la seule espérance.
    reason: Préserver l’ambiguïté syntaxique et théologique au lieu de la résoudre silencieusement.
  - marker: c
    text: 'Littéralement, selon le témoin anglais : « qui est avec l’Unique et est parti vers l’Unique ».'
    reason: La séquence finale est inhabituelle et requiert une vérification sur le grec ; la note distingue la traduction lisible de la forme du témoin.
lexical_decisions:
- source_word: bishop
  choice: évêque
  rationale: Terme français courant et historiquement approprié pour le responsable appelé episkopos dans la tradition grecque.
- source_word: presbyters
  choice: presbytres
  rationale: Conserve la distinction historique et ecclésiale avec l’évêque sans imposer le terme confessionnel moderne « prêtres » ni réduire le mot à « anciens ».
- source_word: one mind
  choice: une seule pensée
  rationale: Rend l’unité de disposition ou de pensée sans la transformer en uniformité doctrinale explicitement formulée.
- source_word: altar
  choice: autel
  rationale: Préserve l’image cultuelle forte et son parallèle avec le temple et Jésus-Christ.
- source_word: came forth from One Father
  choice: est issu du Père unique
  rationale: Restitue le mouvement d’origine et l’insistance répétée sur l’unité, sans préciser davantage la nature théologique de cette provenance.
theological_decisions:
- issue: Autorité de l’évêque et des presbytres
  choice: « ne faites rien sans l’évêque et les presbytres »
  alternative: « ne faites rien indépendamment de l’évêque et du conseil des anciens »
  rationale: La formulation directe conserve l’exhortation ecclésiale du témoin sans l’atténuer ni lui ajouter une théorie ultérieure de l’autorité.
- issue: Référent de « qui est Jésus-Christ »
  choice: Rattachement principal à « une seule espérance », avec note d’ambiguïté
  alternative: 'Rattachement à toute la série : prière, supplication, pensée et espérance'
  rationale: La proximité grammaticale favorise « espérance », mais le témoin anglais permet une portée plus large ; la note préserve cette tension.
- issue: Formule finale sur le Père unique
  choice: « qui était auprès de l’Unique et qui est retourné vers l’Unique »
  alternative: « qui est avec l’Unique et est parti vers l’Unique »
  rationale: Le français courant demande une formulation intelligible, mais la donnée fournie n’est qu’un témoin anglais et la formulation est textuellement délicate ; une note donne la forme plus littérale.
- issue: Dieu comme temple
  choice: « comme en un seul temple, Dieu »
  alternative: « vers un seul temple, c’est-à-dire Dieu »
  rationale: Conserve l’apposition abrupte et la densité rhétorique du témoin, sans expliciter excessivement la métaphore.
translation_notes:
  register: Français international moderne, digne et exhortatif. Le pluriel « vous » remplace l’archaïsme du témoin anglais. La répétition de « un seul / une seule » est maintenue pour porter l’insistance rhétorique sur l’unité. Projet nécessairement provisoire, puisque le dossier fourni indique que la révision directe du grec de la recension moyenne reste à effectuer.
