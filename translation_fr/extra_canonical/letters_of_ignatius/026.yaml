  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: fr
  text: 'Oui, il vous convient aussi de ne pas vous prévaloir de la jeunesse de votre évêque, mais de lui témoigner tout le respect qui correspond à la puissance de Dieu le Père. J’ai appris, en effet, que les saints presbytres n’ont pas non plus profité de sa jeunesse apparente, mais qu’ils s’effacent devant lui comme devant un homme sage en Dieu — non pas devant lui, toutefois, mais devant le Père de Jésus-Christ, l’Évêque de tous.


    Par respect donc pour celui qui vous a voulus[a], il convient que vous obéissiez sans hypocrisie. Car ce n’est pas tant l’évêque visible que l’on trompe : c’est l’Invisible que l’on cherche à abuser. En pareil cas, ce n’est pas à la chair que l’on a affaire, mais à Dieu, qui connaît les réalités cachées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui vous a désirés ». Le référent et la nuance exacte de l’expression restent incertains dans le témoin utilisé.'
    reason: Signaler sans la résoudre l’ambiguïté expressément conservée par le témoin anglais, en attendant la révision directe du grec.
lexical_decisions:
- source_word: presbyters (Greek source review pending)
  choice: presbytres
  rationale: Conserve le titre ecclésial ancien sans l’identifier automatiquement aux « prêtres » au sens confessionnel moderne.
- source_word: outwardly youthful estate (Greek source review pending)
  choice: jeunesse apparente
  rationale: Préserve l’opposition entre l’apparence extérieure de jeunesse et la sagesse reconnue en Dieu.
- source_word: without dissimulation (Greek source review pending)
  choice: sans hypocrisie
  rationale: Expression française naturelle qui rend l’idée d’une obéissance sincère, sans feinte ni double jeu.
- source_word: hidden things (Greek source review pending)
  choice: les réalités cachées
  rationale: Formulation large qui ne réduit pas le sens aux seules pensées ou intentions secrètes.
theological_decisions:
- issue: Fondement du respect dû au jeune évêque
  choice: « le respect qui correspond à la puissance de Dieu le Père »
  alternative: « tout le respect, selon la puissance de Dieu le Père »
  rationale: Évite de préciser au-delà du témoin fourni la relation syntaxique exacte entre la puissance divine et le respect, tout en gardant leur lien.
- issue: Référent de « celui qui vous a voulus »
  choice: Maintien d’un référent ambigu avec une note
  alternative: « celui qui vous a choisis » ou identification explicite à Dieu
  rationale: Le témoin anglais signale une ambiguïté qu’il ne faut pas résoudre silencieusement; la formulation conserve aussi la nuance de volonté ou de désir plutôt que d’imposer celle d’élection.
- issue: Titre « l’Évêque de tous » appliqué au Père
  choice: Conserver le titre et la majuscule honorifique
  alternative: Paraphraser par « celui qui veille sur tous »
  rationale: Le caractère ecclésiologique et rhétorique du titre appartient au passage et ne doit pas être nivelé.
- issue: Contraste entre l’évêque visible et l’Invisible
  choice: '« ce n’est pas tant… : c’est… »'
  alternative: « on ne trompe pas l’évêque visible, mais l’Invisible »
  rationale: Préserve la formulation comparative et la tension du témoin, sans transformer celle-ci en négation absolue.
translation_notes:
  register: Français international moderne, digne et accessible. « Presbytres » est maintenu comme terme historique précis; les tournures archaïques ont été allégées. Projet nécessairement provisoire, puisque le dossier fourni indique qu’une révision directe du grec de la recension moyenne reste à effectuer.
