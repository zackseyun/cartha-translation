review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour rendre plus directement la construction « selon la puissance de Dieu le Père » et pour éviter que « ce n’est pas à la chair que l’on a affaire » ne transforme l’idée d’avoir à répondre/devant qui l’on parle en simple relation d’affaire. Le contraste entre l’évêque visible et l’Invisible, ainsi que l’ambiguïté de « celui qui vous a voulus/désirés », sont conservés.
  naturalness: Le français du projet est globalement digne et lisible. « Se prévaloir de la jeunesse » peut suggérer qu’on invoque cette jeunesse à son propre avantage; « tirer avantage de la jeunesse » rend plus nettement le reproche. La reprise « non pas devant lui » après « s’effacent devant lui » gagne à être formulée comme une correction rhétorique (« ou plutôt »).
  terminology: « Évêque », « presbytres », « Dieu le Père » et « l’Évêque de tous » sont appropriés. « Presbytres » maintient utilement le titre ancien sans assimilation confessionnelle indue. « Sage en Dieu » préserve la formulation reçue sans l’interpréter.
  issues:
  - severity: medium
    issue: Rendu de la relation « selon la puissance de Dieu le Père »
    rationale: « Le respect qui correspond à la puissance » explicite et infléchit la relation syntaxique. « Selon la puissance de Dieu le Père, lui rendre tout honneur » reste plus proche tout en étant français.
  - severity: medium
    issue: Rendu final de l’opposition chair/Dieu
    rationale: « Ce n’est pas à la chair que l’on a affaire » est idiomatique mais moins fidèle au registre de responsabilité ou d’adresse du témoin. « Il n’a pas affaire à la chair, mais à Dieu » est plus resserré et conserve l’opposition.
  - severity: low
    issue: « Se prévaloir de la jeunesse »
    rationale: La formule peut évoquer le fait de faire valoir la jeunesse comme argument; « tirer avantage de sa jeunesse » reproduit plus clairement l’idée de profiter de l’âge apparent du responsable.
  revised_text: 'Oui, il vous convient aussi de ne pas tirer avantage de la jeunesse de votre évêque, mais, selon la puissance de Dieu le Père, de lui rendre tout honneur. J’ai appris en effet que les saints presbytres non plus n’ont pas tiré avantage de sa jeunesse apparente, mais qu’ils lui cèdent le pas comme à un homme sage en Dieu — ou plutôt, non pas à lui, mais au Père de Jésus-Christ, l’Évêque de tous.



    Par honneur donc pour celui qui vous a voulus[a], il convient que vous obéissiez sans hypocrisie. Car ce n’est pas tant cet évêque visible que l’on trompe, mais l’Invisible que l’on cherche à abuser; et, en pareil cas, on n’a pas affaire à la chair, mais à Dieu, qui connaît les réalités cachées.'
  revised_footnotes:
  - marker: a
    text: 'Ou : « celui qui vous a désirés ». Le référent et la nuance exacte de l’expression restent incertains dans le témoin utilisé.'
    reason: Conserve sans la trancher l’ambiguïté signalée par le témoin anglais, dans l’attente d’une vérification directe du grec.
  revision_rationale: La révision resserre le texte sur le témoin fourni et sur les formulations grecques traditionnellement attestées pour ce passage, sans prétendre résoudre les questions qui exigent encore un contrôle direct de la recension grecque. Elle conserve le registre ecclésial ancien, le titre rhétorique attribué au Père et l’ambiguïté du participe « celui qui vous a voulus/désirés ».
