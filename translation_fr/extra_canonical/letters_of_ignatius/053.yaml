revisions:
- from: 'Ignace, appelé aussi Théophore, à l’Église qui a obtenu miséricorde dans la générosité du Père très-haut et de Jésus-Christ, son Fils unique ; à l’Église aimée et éclairée par la volonté de celui qui a voulu tout ce qui existe, par la foi et l’amour envers Jésus-Christ notre Dieu ; à celle qui préside dans le territoire de la région des Romains, digne de Dieu, digne d’honneur, digne d’être déclarée heureuse, digne de louange, digne de réussite, digne par sa pureté, et qui préside à l’amour[a], qui marche selon la loi du Christ et porte le nom du Père. Je la salue aussi au nom de Jésus-Christ, le Fils du Père. À ceux qui, dans la chair et dans l’esprit, sont unis à chacun de ses commandements, remplis sans défaillance de la grâce de Dieu et entièrement purifiés de toute souillure étrangère[b] : salut abondant en Jésus-Christ notre Dieu, dans une conduite irréprochable.'
  to: 'Ignace, appelé aussi Théophore, à l’Église qui a reçu miséricorde dans la majesté du Père Très-Haut et de Jésus Christ, son Fils unique ; à l’Église aimée et illuminée par la volonté de celui qui a voulu toutes les choses qui existent, par la foi et l’amour envers Jésus Christ notre Dieu ; à celle qui préside dans la région des Romains, digne de Dieu, digne d’honneur, digne d’être proclamée heureuse, digne de louange, digne de succès, digne de pureté, et qui préside à l’amour[a], vivant selon la loi du Christ et portant le nom du Père. Je salue aussi cette Église au nom de Jésus Christ, le Fils du Père. À ceux qui, dans la chair et dans l’esprit, sont unis à chacun de ses commandements, remplis de la grâce de Dieu sans hésitation et purifiés, comme par filtrage, de toute coloration étrangère[b] : salutations très abondantes en Jésus Christ notre Dieu, dans une joie irréprochable.'
  rationale: 'Le texte est corrigé selon le grec de la recension moyenne là où le témoin anglais a entraîné un écart notable : « majesté » pour μεγαλειότης et « joie irréprochable » pour la formule finale. Les images et les répétitions rhétoriques sont maintenues ; les expressions disputées relatives à la présidence et au filtrage ne reçoivent pas d’interprétation confessionnelle.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:23Z'
review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le grec de la recension moyenne emploie μεγαλειότης (« majesté/grandeur »), non la générosité. La clausule finale est normalement attestée avec l’idée de « joie irréprochable » (ἐν ἀμώμῳ χαρᾷ), que le projet omettait. L’image de l’épuration par filtrage et la « coloration étrangère » (χρῶμα) est mieux conservée.
  naturalness: La période demeure solennelle et lisible en français moderne. « Dans la région des Romains » est plus naturel que le calque pesant « dans le territoire de la région des Romains », tout en gardant la localisation volontairement peu précise.
  terminology: « Père Très-Haut », « Jésus Christ notre Dieu », « préside à l’amour », « loi du Christ » et « porte le nom du Père » conservent les formulations et ambiguïtés significatives. « Digne de pureté » corrige « digne par sa pureté », qui modifiait la relation rhétorique de la série d’épithètes.
  issues:
  - severity: high
    issue: « générosité » pour la qualité du Père
    rationale: Le terme grec μεγαλειότης désigne la majesté ou la grandeur. Le rendu suivait le témoin anglais fourni, mais ne reflète pas le grec.
  - severity: high
    issue: Omission de la joie dans la salutation finale
    rationale: La tradition grecque de la recension moyenne porte la formule ἐν ἀμώμῳ χαρᾷ, « dans une joie irréprochable ». « Dans une conduite irréprochable » changeait le sens et supprimait χαρά (« joie »).
  - severity: medium
    issue: « entièrement purifiés de toute souillure étrangère »
    rationale: Ce rendu efface l’image du filtrage et remplace χρῶμα (« couleur », « coloration ») par « souillure », interprétation plus étroite.
  - severity: medium
    issue: « digne par sa pureté »
    rationale: La série grecque d’adjectifs en ἀξιο- signifie « digne de … » ; « par sa pureté » introduit une causalité absente.
  revised_text: 'Ignace, appelé aussi Théophore, à l’Église qui a reçu miséricorde dans la majesté du Père Très-Haut et de Jésus Christ, son Fils unique ; à l’Église aimée et illuminée par la volonté de celui qui a voulu toutes les choses qui existent, par la foi et l’amour envers Jésus Christ notre Dieu ; à celle qui préside dans la région des Romains, digne de Dieu, digne d’honneur, digne d’être proclamée heureuse, digne de louange, digne de succès, digne de pureté, et qui préside à l’amour[a], vivant selon la loi du Christ et portant le nom du Père. Je salue aussi cette Église au nom de Jésus Christ, le Fils du Père. À ceux qui, dans la chair et dans l’esprit, sont unis à chacun de ses commandements, remplis de la grâce de Dieu sans hésitation et purifiés, comme par filtrage, de toute coloration étrangère[b] : salutations très abondantes en Jésus Christ notre Dieu, dans une joie irréprochable.'
