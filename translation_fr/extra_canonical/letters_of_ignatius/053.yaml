base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: fr
  text: 'Ignace, appelé aussi Théophore, à l’Église qui a reçu miséricorde dans la majesté du Père Très-Haut et de Jésus Christ, son Fils unique ; à l’Église aimée et illuminée par la volonté de celui qui a voulu toutes les choses qui existent, par la foi et l’amour envers Jésus Christ notre Dieu ; à celle qui préside dans la région des Romains, digne de Dieu, digne d’honneur, digne d’être proclamée heureuse, digne de louange, digne de succès, digne de pureté, et qui préside à l’amour[a], vivant selon la loi du Christ et portant le nom du Père. Je salue aussi cette Église au nom de Jésus Christ, le Fils du Père. À ceux qui, dans la chair et dans l’esprit, sont unis à chacun de ses commandements, remplis de la grâce de Dieu sans hésitation et purifiés, comme par filtrage, de toute coloration étrangère[b] : salutations très abondantes en Jésus Christ notre Dieu, dans une joie irréprochable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « qui préside à l’amour » est conservée littéralement autant que le permet le français. Le sens précis et la portée de cette présidence restent discutés.
    reason: Préserver l’ambiguïté historique et ecclésiologique du grec, sans l’identifier à une fonction institutionnelle déterminée.
  - marker: b
    text: Le grec emploie l’image d’un filtrage ou d’une clarification et parle de toute « coloration » étrangère.
    reason: Conserver l’image concrète inhabituelle et éviter de réduire cette expression à la seule notion de souillure morale.
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Conservation du surnom traditionnel sous sa forme française, sans en imposer ici une interprétation (« porteur de Dieu » ou « porté par Dieu »).
- source_word: hath the presidency / having the presidency
  choice: préside / préside à
  rationale: La répétition et le vocabulaire de présidence sont maintenus, car leur portée exacte demeure discutée et ne doit pas être réduite à une fonction institutionnelle précise.
- source_word: filtered clear
  choice: entièrement purifiés
  rationale: Rendu français intelligible de l’image d’épuration, tout en signalant en note sa formulation concrète inhabituelle dans le témoin.
- source_word: blamelessness
  choice: dans une conduite irréprochable
  rationale: Formulation naturelle qui exprime l’état moral visé sans lourdeur abstraite.
- source_word: felicitation
  choice: digne d’être déclarée heureuse
  rationale: Évite le faux ami moderne « félicitation » et conserve l’idée d’une Église reconnue comme heureuse ou bienheureuse.
theological_decisions:
- issue: « Jésus-Christ notre Dieu »
  choice: Jésus-Christ notre Dieu
  alternative: Jésus-Christ, qui est notre Dieu
  rationale: La formulation christologique explicite du témoin est conservée sans paraphrase ni atténuation.
- issue: « qui préside à l’amour »
  choice: qui préside à l’amour
  alternative: qui préside dans la charité / à la communauté d’amour
  rationale: La construction énigmatique est préservée, sans trancher entre une portée ecclésiale, géographique, morale ou institutionnelle.
- issue: Référent de « ses commandements »
  choice: ses commandements
  alternative: les commandements du Christ
  rationale: Le pronom est maintenu afin de ne pas résoudre artificiellement son référent dans une période où le Père et le Fils sont tous deux mentionnés.
translation_notes:
  register: 'Français international moderne, solennel mais lisible. La longue période épistolaire et ses reprises rhétoriques sont conservées, avec une ponctuation qui en facilite la lecture. Projet nécessairement provisoire : le dossier fourni repose sur un témoin anglais du texte grec de la recension moyenne, la vérification directe du grec restant à effectuer.'
