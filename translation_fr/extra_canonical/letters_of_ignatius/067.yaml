review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur deux points principaux. Le grec de la recension moyenne porte διυλισμόν, littéralement « filtrage / purification par filtrage », et non simplement « tri » : « filtrage » préserve mieux l’étrangeté et l’ambiguïté voulues par le texte. Enfin, κοινωνίαν ... τοῦ πάθους exprime la « communion / participation commune » avec la Passion ; « être en communion avec la Passion » est plus proche que « participer à la Passion ». L’image agricole est globalement conservée, mais γεώργιον désigne le champ ou la culture relevant du Christ plutôt que l’acte de cultiver accompli par lui.'
  naturalness: Le français demeure moderne, sobre et accessible. « Elles ne relèvent pas de la culture de Jésus-Christ » rend plus naturellement le rapport agricole que « Jésus-Christ ne les cultive pas », sans effacer l’image. « Ne vous laissez pas égarer » est une formulation idiomatique et directe de l’avertissement grec.
  terminology: « Évêque », « unité de l’Église », « royaume de Dieu » et « Passion » sont conservés. La majuscule à « Passion » est appropriée dans ce contexte. « Fauteur de division » est recevable pour celui qui provoque un schisme, sans importer une qualification institutionnelle supplémentaire.
  issues:
  - severity: medium
    issue: « un tri » pour διυλισμόν
    rationale: Le mot grec évoque un filtrage, un affinage ou une purification, et son emploi est inhabituel. « Tri » tend à préciser l’opération comme une sélection ; « filtrage » maintient mieux tant l’image que l’ambiguïté signalée par le témoin anglais.
  - severity: medium
    issue: « Jésus-Christ ne les cultive pas » pour οὐκ εἰσὶν ... γεώργιον
    rationale: La construction qualifie les herbes comme n’étant pas le champ/la culture de Jésus-Christ. La version proposée transforme ce prédicat nominal en une action du Christ. Une formulation de relation à sa culture conserve plus exactement la métaphore.
  - severity: medium
    issue: « il ne participe pas à la Passion » pour οὐ κοινωνίαν ἔχει τοῦ πάθους
    rationale: Le terme κοινωνία désigne la communion ou la participation partagée. « Il n’est pas en communion avec la Passion » reflète plus directement la formulation, sans préciser le mode de cette communion.
