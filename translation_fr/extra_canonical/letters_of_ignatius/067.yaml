  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: fr
  text: 'Tenez-vous à l’écart des plantes nuisibles : elles ne relèvent pas de la culture de Jésus-Christ, car elles ne sont pas la plantation du Père. Ce n’est pas que j’aie trouvé parmi vous des divisions, mais plutôt un filtrage[a].


    En effet, tous ceux qui sont de Dieu et de Jésus-Christ sont avec l’évêque. Et tous ceux qui se repentiront et entreront dans l’unité de l’Église seront eux aussi de Dieu, afin qu’ils vivent selon Jésus-Christ. Ne vous laissez pas égarer, mes frères.


    Si quelqu’un suit un fauteur de division, il n’héritera pas du royaume de Dieu. Si quelqu’un suit une doctrine étrangère, il n’est pas en communion avec la Passion[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici διυλισμόν, terme inhabituel qui peut évoquer un « filtrage » ou une purification par filtrage. Le contraste exact avec « divisions » reste discuté.
    reason: Préserve l’ambiguïté du terme grec et rend compte du « filtering » inhabituel du témoin anglais, sans réduire le sens à une sélection déterminée.
  - marker: b
    text: La « Passion » désigne les souffrances et la mort de Jésus-Christ. Le terme traduit par « communion » peut aussi comporter l’idée d’une participation partagée.
    reason: Explique le sens chrétien ancien de « Passion » tout en conservant la densité de κοινωνία, sans imposer une théorie doctrinale de ses effets.
lexical_decisions:
- source_word: noxious herbs / Greek source review pending
  choice: plantes nuisibles
  rationale: Conserve l’image agricole et sa valeur négative sans préciser abusivement quelles personnes ou doctrines elle désigne.
- source_word: husbandry / Greek source review pending
  choice: Jésus-Christ ne les cultive pas
  rationale: Rend naturellement en français l’idée de culture agricole tout en maintenant le parallélisme avec ce que le Père a planté.
- source_word: filtering / Greek source review pending
  choice: un tri
  rationale: Le témoin anglais porte un terme inhabituel. « Tri » en préserve l’idée de discernement ou de séparation sans imposer une interprétation précise.
- source_word: be of God
  choice: appartiendront à Dieu
  rationale: Formulation française idiomatique qui conserve la relation exprimée sans la réduire à une simple provenance.
- source_word: walketh in strange doctrine
  choice: suit une doctrine étrangère
  rationale: Transpose l’idiome de la marche en une expression française claire et garde l’altérité problématique de la doctrine.
- source_word: passion
  choice: Passion
  rationale: La majuscule signale ici les souffrances et la mort du Christ, sens chrétien ancien probable du terme.
theological_decisions:
- issue: Rapport à l’évêque et unité de l’Église
  choice: « sont avec l’évêque » et « entreront dans l’unité de l’Église »
  alternative: Expliciter une soumission institutionnelle ou une appartenance confessionnelle déterminée
  rationale: Le texte affirme une relation entre Dieu, le Christ, l’évêque et l’unité ecclésiale, mais il ne convient pas d’y importer une ecclésiologie confessionnelle ultérieure.
- issue: Participation à la Passion
  choice: « il ne participe pas à la Passion »
  alternative: « il ne bénéficie pas du salut obtenu par la Passion » ou « il n’est pas en communion avec les souffrances du Christ »
  rationale: La formule demeure théologiquement dense et potentiellement ambiguë; la traduction conserve cette tension sans en fixer le mécanisme sotériologique.
- issue: Condition des personnes qui se repentent
  choice: 'Futur conservé : « se repentiront… entreront… appartiendront »'
  alternative: Présent général ou impératif
  rationale: Respecte la dynamique prospective du témoin fourni et le lien entre repentance, unité ecclésiale et appartenance à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Les images agricoles sont conservées, tandis que les tournures archaïques du témoin anglais sont rendues idiomatiquement. Projet nécessairement provisoire, puisque la révision directe du grec de la recension moyenne est indiquée comme encore en attente.
