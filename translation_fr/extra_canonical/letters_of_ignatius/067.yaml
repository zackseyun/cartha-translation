  to: 'Tenez-vous à l’écart des plantes nuisibles : elles ne relèvent pas de la culture de Jésus-Christ, car elles ne sont pas la plantation du Père. Ce n’est pas que j’aie trouvé parmi vous des divisions, mais plutôt un filtrage[a].


    En effet, tous ceux qui sont de Dieu et de Jésus-Christ sont avec l’évêque. Et tous ceux qui se repentiront et entreront dans l’unité de l’Église seront eux aussi de Dieu, afin qu’ils vivent selon Jésus-Christ. Ne vous laissez pas égarer, mes frères.


    Si quelqu’un suit un fauteur de division, il n’héritera pas du royaume de Dieu. Si quelqu’un suit une doctrine étrangère, il n’est pas en communion avec la Passion[b].'
  rationale: La révision corrige des déplacements de sens dans l’image de γεώργιον et dans κοινωνία, et remplace « tri » par « filtrage » afin de conserver l’ambiguïté de διυλισμόν. Elle maintient la structure, le registre et les termes ecclésiaux du passage sans y importer d’interprétation confessionnelle ultérieure.
