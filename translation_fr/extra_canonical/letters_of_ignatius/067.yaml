- from: 'Tenez-vous à l’écart des plantes nuisibles : Jésus-Christ ne les cultive pas, car ce n’est pas le Père qui les a plantées. Ce n’est pas que j’aie trouvé parmi vous des divisions, mais plutôt un tri[a].


