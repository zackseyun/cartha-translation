  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: fr
  text: 'Puis donc que, dans les personnes mentionnées plus haut, j’ai vu toute votre multitude dans la foi et que je l’ai aimée, je vous exhorte à vous appliquer à tout faire dans une concorde selon Dieu : l’évêque présidant à la place de Dieu, les anciens à la place du conseil des apôtres, et les diacres, qui me sont très chers, eux à qui a été confié le service de Jésus Christ, lui qui était auprès du Père avant les siècles et qui s’est manifesté à la fin des temps.


    Efforcez-vous donc tous de vous conformer à Dieu et témoignez-vous mutuellement du respect. Que personne ne considère son prochain selon la chair, mais aimez-vous toujours les uns les autres en Jésus Christ. Que rien parmi vous n’ait le pouvoir de vous diviser ; mais soyez unis à l’évêque et à ceux qui président, comme un exemple et une leçon d’incorruptibilité.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le rattachement précis de « comme un exemple et une leçon d’incorruptibilité » est discuté : l’expression peut qualifier l’union avec l’évêque et ceux qui président, ou les responsables eux-mêmes.'
    reason: La construction finale permet plus d’un rattachement syntaxique. La note préserve cette ambiguïté sans imposer une interprétation.
lexical_decisions:
- source_word: bishop
  choice: évêque
  rationale: Terme français courant et historiquement approprié pour la fonction ecclésiale désignée par le témoin.
- source_word: presbyters
  choice: anciens
  rationale: Rend la fonction sans imposer rétrospectivement le sens sacerdotal plus spécialisé de « prêtres » ; le terme demeure intelligible dans un contexte ecclésial.
- source_word: deacons / diaconate
  choice: diacres / service
  rationale: « Diacres » conserve le titre reconnu, tandis que « service » exprime naturellement la charge confiée sans lourdeur technique.
- source_word: before the worlds
  choice: avant les siècles
  rationale: Formulation traditionnelle mais encore compréhensible, qui conserve la portée temporelle ou cosmique du pluriel sans la réduire à « avant la création du monde ».
- source_word: after the flesh
  choice: selon la chair
  rationale: Conserve l’expression théologiquement chargée et sa possible ambiguïté plutôt que de la paraphraser comme une simple préférence humaine.
- source_word: incorruptibility
  choice: incorruptibilité
  rationale: Préserve le champ sémantique moral et eschatologique du terme, malgré son caractère légèrement soutenu.
theological_decisions:
- issue: Analogie entre les responsables ecclésiaux et Dieu ou les apôtres
  choice: « à l’image de Dieu » et « à l’image du conseil des apôtres »
  alternative: « tenant la place de Dieu » et « tenant la place du collège apostolique »
  rationale: La formulation choisie conserve l’analogie du témoin sans affirmer une identité ou une substitution institutionnelle plus forte.
- issue: Préexistence du Christ
  choice: « lui qui était auprès du Père avant les siècles »
  alternative: « lui qui était avec le Père avant la création des mondes »
  rationale: « Auprès du Père » exprime naturellement la relation sans affaiblir la préexistence ; « avant les siècles » évite de trancher la portée exacte de l’expression transmise.
- issue: Conformité à Dieu
  choice: « vous conformer à Dieu »
  alternative: « imiter Dieu »
  rationale: La formulation garde la notion de conformité donnée par le témoin sans préciser indûment s’il s’agit surtout d’imitation morale, d’ordre communautaire ou d’union spirituelle.
- issue: Union avec l’évêque et les dirigeants
  choice: « soyez unis à l’évêque et à ceux qui vous dirigent »
  alternative: « soumettez-vous à l’évêque et aux autres chefs »
  rationale: Le texte fourni met l’accent sur l’unité ; introduire explicitement la soumission renforcerait la portée hiérarchique au-delà du témoin.
translation_notes:
  register: Français international moderne, digne et lisible. Le texte évite les archaïsmes du témoin anglais tout en maintenant les expressions théologiquement denses. Projet provisoire fondé sur le témoin anglais public fourni ; la tradition grecque de la recension moyenne doit encore faire l’objet d’une vérification directe.
