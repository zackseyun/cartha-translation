revisions:
- from: 'Puisque, dans les personnes mentionnées plus haut, j’ai vu et embrassé dans la foi tout votre peuple, je vous exhorte à avoir à cœur de tout faire dans une concorde conforme à Dieu : que l’évêque préside à l’image de Dieu, les anciens à l’image du conseil des apôtres, et les diacres — qui me sont particulièrement chers — comme des hommes à qui a été confié le service de Jésus Christ, lui qui était auprès du Père avant les siècles et qui s’est manifesté à la fin des temps.


    Efforcez-vous donc tous de vous conformer à Dieu et témoignez-vous mutuellement du respect. Que personne ne considère son prochain selon la chair, mais aimez-vous toujours les uns les autres en Jésus Christ. Que rien parmi vous n’ait le pouvoir de vous diviser ; au contraire, soyez unis à l’évêque et à ceux qui vous dirigent, comme un exemple et une leçon d’incorruptibilité.[a]'
  to: 'Puis donc que, dans les personnes mentionnées plus haut, j’ai vu toute votre multitude dans la foi et que je l’ai aimée, je vous exhorte à vous appliquer à tout faire dans une concorde selon Dieu : l’évêque présidant à la place de Dieu, les anciens à la place du conseil des apôtres, et les diacres, qui me sont très chers, eux à qui a été confié le service de Jésus Christ, lui qui était auprès du Père avant les siècles et qui s’est manifesté à la fin des temps.


    Efforcez-vous donc tous de vous conformer à Dieu et témoignez-vous mutuellement du respect. Que personne ne considère son prochain selon la chair, mais aimez-vous toujours les uns les autres en Jésus Christ. Que rien parmi vous n’ait le pouvoir de vous diviser ; mais soyez unis à l’évêque et à ceux qui président, comme un exemple et une leçon d’incorruptibilité.[a]'
  rationale: La révision corrige les écarts par rapport au grec de la recension moyenne, notamment « à la place de » et « je l’ai aimée », tout en gardant les choix terminologiques français prudents du projet. Elle améliore également le rattachement de la proposition relative concernant les diacres et maintient une note sur l’ambiguïté réelle de la clausule finale.
