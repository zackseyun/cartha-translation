review_pass:
  verdict: revise
  source_fidelity: La révision rétablit le sens de la formulation grecque attestée « comme demeurant en lui » (ἐν αὐτῷ κατοικοῦντες), là où le brouillon, suivant le témoin anglais, disait que le Seigneur habite en nous. La proposition suivante conserve bien, elle, l’affirmation que Dieu est en nous. Les pluriels relatifs (« ce qu’il dit / ce qu’il tait ») rendent plus exactement δι’ ὧν.
  naturalness: Le français demeure contemporain, sobre et naturel. « Il n’y a qu’un seul maître » est plus direct que « Il n’y a donc qu’un seul maître », sans inférer une conséquence absente du grec. « Par ce qu’il dit » et « par ce qu’il tait » sont idiomatiques et gardent le parallélisme.
  terminology: « Maître », « parole de Jésus », « accompli », « temples » et « notre Dieu » conservent les termes importants sans surcharge doctrinale. La note attachée à « son silence » reste justifiée et préserve l’ouverture de ἡσυχία.
  issues:
  - severity: high
    issue: « en sachant qu’il habite en nous »
    rationale: 'Le grec de la recension moyenne porte ὡς ἐν αὐτῷ κατοικοῦντες : « comme demeurant en lui ». La traduction anglaise fournie inverse ici le rapport. Il faut corriger sans supprimer l’énoncé suivant : « lui-même [sera] en nous, notre Dieu ».'
  - severity: medium
    issue: « par ce qu’il dit, il agisse, et ... par ce qu’il tait »
    rationale: Les relatifs pluriels δι’ ὧν ... δι’ ὧν se rendent plus fidèlement et plus clairement par « par ce qu’il dit ... par ce qu’il tait ». La première occurrence du brouillon (« par ce qu’il dit ») était déjà adéquate, mais la seconde était formulée différemment.
  - severity: low
    issue: « Il n’y a donc qu’un seul maître »
    rationale: Le grec affirme simplement « Il y a un seul maître »; « donc » introduit une relation argumentative non exprimée.
  revised_text: 'Il vaut mieux se taire et être que parler sans être. Enseigner est une belle chose, si celui qui parle met lui-même en pratique. Il n’y a qu’un seul maître : celui qui a parlé, et cela s’est produit. Même ce qu’il a accompli en silence est digne du Père.


    Celui qui possède véritablement la parole de Jésus peut aussi écouter son silence[a], afin d’être accompli : afin que, par ce qu’il dit, il agisse, et que, par ce qu’il tait, il soit reconnu.


    Rien n’échappe au Seigneur ; même nos secrets sont proches de lui. Faisons donc tout comme demeurant en lui, afin que nous soyons ses temples et que lui-même soit en nous, notre Dieu. Il en est bien ainsi, et cela se manifestera aussi devant nos yeux par l’amour que nous avons à juste titre pour lui.'
  revised_footnotes:
  - marker: a
    text: Le « silence » de Jésus peut évoquer à la fois ce qu’il n’a pas exprimé en paroles et ce qu’il a accompli sans bruit. Le texte invite à l’écouter sans trancher entre ces nuances.
    reason: Préserver l’ambiguïté suggestive de ἡσυχία et son rapport aux autres termes du silence dans le passage.
  revision_rationale: Une correction est nécessaire parce que le brouillon reproduit à cet endroit la divergence du témoin anglais au lieu de suivre le grec de la recension moyenne. La révision traduit ἐν αὐτῷ κατοικοῦντες par « comme demeurant en lui », tout en conservant la seconde partie de la phrase, qui dit bien que Dieu est en nous. Les autres ajustements resserrent le parallélisme grec et retirent une inférence logique non marquée.
