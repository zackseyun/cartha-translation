base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: fr
  text: 'Il vaut mieux se taire et être que parler sans être. Enseigner est une belle chose, si celui qui parle met lui-même en pratique. Il n’y a donc qu’un seul maître : celui qui a parlé, et cela s’est produit. Même ce qu’il a accompli en silence est digne du Père.


    Celui qui possède véritablement la parole de Jésus peut aussi écouter son silence[a], afin d’être accompli : afin que, par ce qu’il dit, il agisse, et que, par ce qu’il tait, il soit reconnu.


    Rien n’échappe au Seigneur ; même nos secrets sont proches de lui. Faisons donc tout en sachant qu’il habite en nous, afin que nous soyons ses temples et que lui-même soit en nous, notre Dieu. C’est bien la réalité, et elle se manifestera aussi devant nos yeux par l’amour que nous avons à juste titre pour lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « silence » de Jésus peut évoquer à la fois ce qu’il n’a pas exprimé en paroles et ce qu’il a accompli sans bruit. Le texte invite à l’écouter sans trancher entre ces nuances.
    reason: Préserver l’ambiguïté suggestive de ἡσυχία et son rapport aux autres termes du silence dans le passage.
lexical_decisions:
- source_word: σιωπᾶν / σιγῶν / ἡσυχίας / σιγᾷ
  choice: se taire / en silence / son silence / ce qu’il tait
  rationale: La variation française reflète les termes grecs apparentés mais distincts du passage, tout en conservant le motif rhétorique du silence.
- source_word: εἶναι
  choice: être
  rationale: Le verbe est maintenu sans explicitation afin de préserver l’énigmatique opposition entre « être » et « parler sans être ».
- source_word: ποιῇ / πράσσῃ
  choice: mette en pratique / agisse
  rationale: Ces choix rendent l’exigence que l’enseignement soit confirmé par les actes, sans réduire les deux verbes à une formule doctrinale.
- source_word: λόγον Ἰησοῦ
  choice: la parole de Jésus
  rationale: « Parole » conserve l’amplitude de λόγος, qui peut désigner le message, l’enseignement ou la parole, sans imposer ici un sens technique.
- source_word: ναοί
  choice: temples
  rationale: 'Le pluriel est conservé : les croyants sont désignés collectivement ou individuellement comme les temples de Dieu, sans harmonisation avec d’autres textes.'
- source_word: φανήσεται πρὸ προσώπου ἡμῶν
  choice: elle se manifestera aussi devant nos yeux
  rationale: Rendu idiomatique de l’expression littérale « devant notre face », en gardant l’idée d’une manifestation à venir ou progressive.
theological_decisions:
- issue: Identité du « seul maître » et référents pronominaux
  choice: Conserver le lien implicite avec Jésus sans ajouter son nom dans la première phrase
  alternative: Écrire explicitement « Jésus est le seul maître »
  rationale: Le contexte identifie naturellement le maître à Jésus, mais le texte procède par allusion ; l’explicitation supprimerait cette retenue.
- issue: Sens de « être accompli »
  choice: Rendre τέλειος par « accompli »
  alternative: « parfait » ou « arrivé à maturité »
  rationale: « Accompli » garde ensemble les nuances de plénitude et de maturité sans suggérer nécessairement une perfection morale absolue.
- issue: Présence divine en nous
  choice: « que lui-même soit en nous, notre Dieu »
  alternative: « qu’il soit lui-même notre Dieu en nous »
  rationale: La formulation conserve l’apposition dense du grec et son affirmation théologique sans préciser davantage la relation entre le Seigneur, Jésus et Dieu.
- issue: Dernière affirmation
  choice: « C’est bien la réalité »
  alternative: « Il en est bien ainsi »
  rationale: Le démonstratif grec renvoie à la réalité de Dieu habitant en nous ; la traduction reste ouverte sans transformer la phrase en démonstration doctrinale.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe antithétique et les répétitions d’Ignace sont conservées lorsqu’elles portent l’argument. Le brouillon a été confronté au texte grec couramment attesté de la recension moyenne, tout en tenant compte du témoin anglais fourni.
