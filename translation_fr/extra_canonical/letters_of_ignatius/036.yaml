review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « collège d’anciens » interprète et modernise « presbytery » / presbytère au lieu de conserver le terme ecclésial « presbytérat ». De plus, la couronne spirituelle est, dans l’image du texte, associée au presbytérat; elle ne « forme » pas le collège. « Réussir » est possible, mais « prospérer » restitue plus directement le souhait de bonne marche du témoin. La note ne doit pas transformer les crochets du témoin en une affirmation précise d’incertitude textuelle qui n’est pas établie par le dossier fourni.
  naturalness: La prose est fluide et soutenue. « Marchent selon Dieu » reste toutefois assez calqué; « qui suivent Dieu » est plus idiomatique tout en restant proche de l’image. « Avec ... avec ... et avec » peut être légèrement resserré sans perte.
  terminology: « Ordonnances », « chair », « esprit », « évêque » et « diacres » conviennent. « Presbytérat » est préférable à « collège d’anciens », car il préserve le référent institutionnel et l’imagerie ecclésiale sans la paraphraser. « Couronne spirituelle harmonieusement tressée de votre presbytérat » maintient l’attribut et l’image du témoin.
  issues:
  - severity: medium
    issue: « collège d’anciens » pour « presbytery »
    rationale: Cette expression est explicative et peut évoquer un conseil moderne; « presbytérat » conserve le terme et le statut ecclésial ancien visés par le texte.
  - severity: medium
    issue: Relation syntaxique de la couronne et du presbytérat modifiée
    rationale: « la couronne ... que forme votre collège d’anciens » fait du groupe le producteur de la couronne. Le témoin décrit plutôt le presbytérat comme une couronne spirituelle artistement tressée.
  - severity: low
    issue: Note sur les crochets trop affirmative
    rationale: Le dossier demande de préserver le signal des crochets, mais ne permet pas de conclure que ceux-ci attestent une incertitude dans la transmission ou l’établissement du texte. Une note neutre est plus fidèle au dossier provisoire.
  - severity: low
    issue: « réussir » pour « prosper »
    rationale: « Prospérer » rend plus directement le souhait global de bonne réussite ou de bonne marche, sans réduire le propos à la performance.
  revised_text: 'Efforcez-vous donc d’être fermement établis dans les ordonnances du Seigneur et des apôtres, afin de prospérer en tout ce que vous faites, dans la chair et dans l’esprit, par la foi et l’amour, dans le Fils, le Père et l’Esprit, au commencement et à la fin, avec votre évêque digne de respect, avec la couronne spirituelle harmonieusement tressée de votre presbytérat, et avec les diacres qui suivent Dieu.


    Obéissez à l’évêque et les uns aux autres, comme Jésus-Christ a obéi au Père [selon la chair][a], et comme les apôtres ont obéi au Christ et au Père, afin qu’il y ait union de la chair et de l’esprit.'
  revised_footnotes:
  - marker: a
    text: Les crochets reproduisent le signal textuel du témoin anglais fourni. La vérification directe du grec de la recension moyenne reste à faire.
    reason: Préserver le marquage du témoin sans attribuer, au-delà du dossier disponible, une cause déterminée aux crochets.
  revision_rationale: La révision conserve la structure accumulative, les termes théologiques et l’ambiguïté du témoin. Elle corrige surtout la représentation du presbytérat et de la métaphore de la couronne, tout en neutralisant une note qui surinterprétait les crochets. Le texte anglais fourni ne comporte pas « et dans l’Esprit » après « le Christ et le Père » dans la seconde phrase; cette absence est donc conservée en attendant le contrôle direct du grec.
