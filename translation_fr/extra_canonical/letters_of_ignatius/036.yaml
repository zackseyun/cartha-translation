base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: fr
  text: 'Efforcez-vous donc d’être fermement établis dans les ordonnances du Seigneur et des apôtres, afin de réussir dans tout ce que vous faites, dans la chair et dans l’esprit, par la foi et par l’amour, dans le Fils, le Père et l’Esprit, au commencement et à la fin, avec votre évêque digne de respect, avec la couronne spirituelle harmonieusement tressée que forme votre collège d’anciens, et avec les diacres qui marchent selon Dieu.


    Obéissez à l’évêque et les uns aux autres, comme Jésus-Christ a obéi au Père [selon la chair][a], et comme les apôtres ont obéi au Christ et au Père, afin qu’il y ait unité de la chair et de l’esprit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les crochets signalent que les mots « selon la chair » présentent une incertitude dans la transmission ou l’établissement du texte; ils sont conservés ici d’après le témoin fourni.
    reason: Préserver explicitement le signal textuel du témoin anglais en attendant la vérification directe du grec.
lexical_decisions:
- source_word: ordinances
  choice: ordonnances
  rationale: Conserve le sens de prescriptions ou dispositions établies sans le réduire à de simples enseignements.
- source_word: presbytery
  choice: collège d’anciens
  rationale: Rend le groupe constitué des presbytres dans un français accessible, plutôt que d’employer « presbytère », aujourd’hui souvent compris comme une habitation.
- source_word: fitly wreathed spiritual circlet
  choice: la couronne spirituelle harmonieusement tressée que forme votre collège d’anciens
  rationale: Préserve l’image élaborée de la couronne tressée tout en explicitant naturellement le rapport avec le collège d’anciens.
- source_word: walk after God
  choice: marchent selon Dieu
  rationale: Maintient l’image biblique de la marche et l’orientation de la conduite conforme à Dieu.
- source_word: flesh and spirit
  choice: la chair et l’esprit
  rationale: Conserve la paire anthropologique et sa tension sans la paraphraser en termes modernes plus restrictifs.
theological_decisions:
- issue: Obéissance de Jésus-Christ au Père
  choice: « comme Jésus-Christ a obéi au Père [selon la chair] »
  alternative: « comme Jésus-Christ était soumis au Père »
  rationale: La formulation verbale naturelle rend le parallèle d’obéissance sans développer une doctrine de subordination; les crochets préservent le signal textuel transmis par le témoin.
- issue: Relations entre le Fils, le Père et l’Esprit
  choice: « dans le Fils, le Père et l’Esprit »
  alternative: « dans le Fils et le Père et dans l’Esprit »
  rationale: Suit l’ordre et l’association inhabituels du témoin sans normaliser la phrase en formule trinitaire postérieure.
- issue: Unité de la chair et de l’esprit
  choice: « unité de la chair et de l’esprit »
  alternative: « unité corporelle et spirituelle »
  rationale: Préserve les catégories du texte et leur possible portée communautaire autant qu’anthropologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passage reste provisoire, car le dossier fourni indique qu’une vérification directe de la tradition grecque de la recension moyenne est encore à effectuer. Les images ecclésiales et corporelles ont été conservées plutôt que nivelées.
