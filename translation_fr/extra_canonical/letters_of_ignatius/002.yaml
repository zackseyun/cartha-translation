translation:
  language: fr
  text: 'J’ai accueilli en Dieu votre nom tant aimé[a], que vous portez par une disposition naturelle juste et vertueuse, dans la foi et l’amour en Jésus-Christ notre Sauveur. Imitateurs de Dieu, vous avez ravivé, dans le sang de Dieu[b], l’œuvre qui vous est naturelle et vous l’avez menée parfaitement à son accomplissement.


    En effet, lorsque vous avez appris que je venais de Syrie, chargé de chaînes à cause du Nom et de l’espérance que nous avons en commun[c], et que j’espérais, grâce à vos prières, obtenir de combattre les bêtes sauvages à Rome afin que, par cette réussite, je puisse être un disciple, vous vous êtes empressés de venir me voir.


    Ainsi, au nom de Dieu, j’ai reçu en Onésime toute votre communauté[d]. Son amour est au-delà de toute parole, et il est aussi votre évêque dans la chair[e]. Je prie pour que vous l’aimiez en accord avec Jésus-Christ et que vous lui ressembliez tous. Car béni soit celui qui vous a accordé, puisque vous en étiez dignes, d’avoir un tel évêque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Votre nom » peut désigner à la fois le nom porté par la communauté et la réputation qui lui est attachée.
    reason: L’expression est corporative et son référent exact demeure ouvert.
  - marker: b
    text: Le texte dit littéralement « dans le sang de Dieu »; cette formulation remarquable est conservée sans en préciser davantage le référent.
    reason: Préserver la formulation christologique forte et sa tension.
  - marker: c
    text: Le « Nom » semble être le Nom confessé en commun par les croyants, mais le texte ne l’explicite pas.
    reason: Éclairer l’emploi absolu de « Nom » sans résoudre son ambiguïté.
  - marker: d
    text: 'Littéralement : « votre multitude »; Onésime représente ici l’ensemble de la communauté.'
    reason: Signaler l’image collective derrière la formulation française naturelle.
  - marker: e
    text: « Dans la chair » souligne sa fonction au sein de la communauté dans l’existence présente; l’expression est conservée en raison de sa portée possible.
    reason: Ne pas réduire l’expression à « évêque terrestre » ou à une simple indication administrative.
lexical_decisions:
- source_word: ὄνομα (onoma)
  choice: nom
  rationale: Conserve l’image corporative et l’éventuelle idée de réputation sans la réduire à une seule interprétation.
- source_word: φύσει δικαίᾳ καὶ ἐναρέτῳ (physei dikaia kai enaretō)
  choice: par une disposition naturelle juste et vertueuse
  rationale: Rend la qualité morale attachée à φύσις tout en évitant le calque peu naturel « par un droit naturel ».
- source_word: τὸ συγγενικὸν ἔργον (to syngenikon ergon)
  choice: l’œuvre qui vous est naturelle
  rationale: Préserve l’idée difficile d’une œuvre apparentée, propre ou connaturelle aux destinataires, sans préciser abusivement sa nature.
- source_word: θηριομαχῆσαι (thēriomachēsai)
  choice: combattre les bêtes sauvages
  rationale: Expression concrète renvoyant au supplice dans l’arène, sans remplacer l’image par le terme interprétatif « subir le martyre ».
- source_word: τὸ πολυπληθὲς ὑμῶν (to polyplēthes hymōn)
  choice: toute votre communauté
  rationale: Français naturel pour la collectivité nombreuse représentée par Onésime; le sens littéral est signalé en note.
- source_word: ἐπίσκοπος (episkopos)
  choice: évêque
  rationale: Terme historique français usuel pour la fonction ecclésiale nommée dans le texte.
theological_decisions:
- issue: Le sang de Dieu
  choice: dans le sang de Dieu
  alternative: par le sang du Christ
  rationale: Maintient l’expression théologiquement forte et christologiquement tendue du texte au lieu d’en expliciter ou d’en atténuer le référent.
- issue: Le Nom commun
  choice: le Nom et l’espérance que nous avons en commun
  alternative: le nom chrétien et notre espérance commune
  rationale: Préserve l’ambiguïté de « Nom », probablement chargé d’une valeur confessionnelle, sans identifier explicitement ce Nom dans le corps du texte.
- issue: Devenir disciple par le combat
  choice: afin que, par cette réussite, je puisse être un disciple
  alternative: afin que, par le martyre, je devienne un vrai disciple
  rationale: Ne rajoute ni « martyre » ni « vrai » et conserve la conception paradoxale d’Ignace selon laquelle son épreuve à venir doit manifester ou accomplir sa condition de disciple.
- issue: Dignité des destinataires
  choice: puisque vous en étiez dignes
  alternative: selon vos mérites
  rationale: Rend l’idée de dignité sans imposer une doctrine précise du mérite.
translation_notes:
  register: Français international moderne, digne et lisible. Les longues périodes ont été légèrement segmentées, mais les enchaînements logiques et les images inhabituelles ont été conservés. Le brouillon tient compte de la tradition grecque de la recension moyenne; puisque le dossier fourni signale qu’une révision directe de la langue source reste à achever, les formulations particulièrement incertaines devront être collationnées avant publication.
