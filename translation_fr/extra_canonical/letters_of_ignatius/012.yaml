base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: fr
  text: 'Ce sont les derniers temps. Désormais, soyons pleins de respect et craignons la patience de Dieu, de peur qu’elle ne se transforme en jugement contre nous. De deux choses l’une : craignons la colère à venir ou aimons la grâce présente, pourvu seulement que nous soyons trouvés en Jésus-Christ, en vue de la vraie vie.


    Que rien ne brille à vos yeux en dehors de lui. C’est en lui que je porte partout mes chaînes, mes perles spirituelles. Puissé-je ressusciter avec elles grâce à votre prière, et avoir toujours part à celle-ci, afin d’être trouvé parmi les chrétiens d’Éphèse. Ceux-ci, d’ailleurs, ont toujours été en plein accord avec les apôtres, par la puissance de Jésus-Christ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais public fourni. Une vérification directe du grec de la recension moyenne reste nécessaire, notamment pour la syntaxe de la phrase sur les chaînes, la prière et la résurrection.
    reason: Le dossier indique explicitement que l’examen de la langue source est encore en attente; la note rend transparente cette limite importante.
lexical_decisions:
- source_word: last times
  choice: les derniers temps
  rationale: Expression eschatologique traditionnelle, claire en français moderne, qui conserve la portée temporelle du témoin.
- source_word: long-suffering of God
  choice: la patience de Dieu
  rationale: « Patience » exprime naturellement la longue retenue de Dieu sans la paraphraser excessivement.
- source_word: fear
  choice: craignons
  rationale: Conserve la force d’exhortation et la tension entre crainte du jugement et amour de la grâce.
- source_word: grace which now is
  choice: la grâce présente
  rationale: Formulation concise qui maintient le contraste temporel avec « la colère à venir ».
- source_word: spiritual pearls
  choice: mes perles spirituelles
  rationale: Maintient l’image métaphorique appliquée aux chaînes, sans l’expliquer dans le corps du texte.
- source_word: of one mind with
  choice: en plein accord avec
  rationale: Français idiomatique exprimant la concorde ou l’unité de pensée sans imposer une formulation confessionnelle.
theological_decisions:
- issue: Rapport entre la crainte de la colère et l’amour de la grâce
  choice: 'Maintien de l’alternative rhétorique : « De deux choses l’une »'
  alternative: Fusionner les deux attitudes ou faire de l’une une étape vers l’autre
  rationale: Le témoin présente explicitement une alternative et ne résout pas la tension théologique.
- issue: Sens de « unto true life »
  choice: « en vue de la vraie vie »
  alternative: « pour la vie éternelle »
  rationale: Évite d’identifier explicitement la « vraie vie » à la vie éternelle alors que le témoin fourni ne le précise pas.
- issue: Résurrection et chaînes
  choice: « Puissé-je ressusciter avec elles »
  alternative: Comprendre « elles » comme les prières ou supprimer le lien avec les chaînes
  rationale: La syntaxe du témoin rattache vraisemblablement le souhait de résurrection aux « perles spirituelles », mais l’état provisoire de la source recommande de ne pas développer davantage.
- issue: « in the power of Jesus Christ »
  choice: « par la puissance de Jésus-Christ »
  alternative: « dans la puissance de Jésus-Christ »
  rationale: La tournure française choisie est naturelle tout en conservant l’idée que cette concorde dépend de la puissance du Christ.
translation_notes:
  register: Français international moderne, digne et exhortatif. Les images fortes du témoin (« briller à vos yeux », « perles spirituelles ») sont conservées. La ponctuation et quelques articulations ont été adaptées pour rendre les longues périodes intelligibles sans effacer leur tension.
