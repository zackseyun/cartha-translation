review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur quelques nuances du grec de la recension moyenne : ὡς ποιεῖτε signifie « comme vous le faites », non spécifiquement « comme vous en avez l’habitude » ; κατὰ πάντα πᾶσιν énonce sans atténuation l’obligation de plaire à tous « en toute chose » ; et κατηγορία désigne plus précisément une accusation qu’un simple « sujet de reproche ». Le reste rend fidèlement les parallèles et les termes institutionnels du passage.'
  naturalness: Le français est globalement clair et d’un registre approprié. « Comme vous le faites » est plus direct et fidèle. « Doivent plaire à tous en toute chose » conserve l’énoncé exhortatif sans introduire l’atténuation interprétative de « chercher à ». « Se garder de toute accusation comme du feu » est naturel tout en reproduisant l’image.
  terminology: « Évêque », « conseil des anciens » (avec note explicative), « diacres », « mystères » et « Église de Dieu » sont des choix recevables. La note sur les diacres éclaire utilement le rapprochement lexical entre διάκονοι et « serviteurs », sans lui imposer de lecture confessionnelle.
  issues:
  - severity: medium
    issue: « comme vous en avez l’habitude »
    rationale: Le grec ὡς ποιεῖτε signifie littéralement « comme vous faites / le faites ». La notion d’habitude est possible par implication, mais elle est plus interprétative que nécessaire.
  - severity: medium
    issue: « doivent chercher à plaire »
    rationale: Le verbe grec ἀρέσκειν (« plaire »), accompagné de « doivent », n’exprime pas seulement une tentative. « Chercher à » atténue l’exhortation du texte.
  - severity: medium
    issue: « se gardent de tout sujet de reproche »
    rationale: ἀπὸ κατηγορίας renvoie à une accusation ou mise en cause. « Tout sujet de reproche » déplace le sens vers les occasions de blâme plutôt que vers ce dont ils doivent se préserver.
