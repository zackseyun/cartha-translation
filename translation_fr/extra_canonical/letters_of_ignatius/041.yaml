base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: fr
  text: 'Car, lorsque vous obéissez à l’évêque comme à Jésus-Christ, il m’apparaît clairement que vous ne vivez pas selon les hommes, mais selon Jésus-Christ, qui est mort pour nous afin que, croyant en sa mort, vous échappiez à la mort.


    Il est donc nécessaire, comme vous le faites, que vous ne fassiez rien sans l’évêque. Obéissez aussi au conseil des anciens[a] comme aux apôtres de Jésus-Christ, notre espérance. Car, si nous vivons en lui, nous serons aussi trouvés en lui.


    De même, ceux qui sont diacres[b] des mystères de Jésus-Christ doivent plaire à tous en toute chose. Car ils ne sont pas au service de la nourriture et de la boisson, mais ils sont serviteurs de l’Église de Dieu. Il convient donc qu’ils se gardent de toute accusation comme du feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « conseil des anciens » désigne collectivement les presbytres, c’est-à-dire le groupe des anciens responsables de l’Église.
    reason: Éclairer un terme institutionnel ancien sans imposer un vocabulaire confessionnel particulier.
  - marker: b
    text: Le mot « diacres » est lié à l’idée de service ; la phrase suivante reprend précisément ce sens en les appelant « serviteurs » de l’Église.
    reason: Faire percevoir le jeu lexical que le français ne reproduit qu’en partie.
lexical_decisions:
- source_word: 'bishop (Greek: episkopos, source-language review pending)'
  choice: évêque
  rationale: Terme français courant et historiquement approprié pour le responsable ecclésial désigné dans ce contexte ignatien.
- source_word: 'presbytery (Greek: presbyterion, source-language review pending)'
  choice: conseil des anciens
  rationale: Rend la dimension collective du terme sans le confondre avec un bâtiment ni imposer d’emblée le vocabulaire confessionnel « presbyterium ».
- source_word: 'deacons (Greek: diakonoi, source-language review pending)'
  choice: diacres
  rationale: Conserve le titre ecclésial reconnu en français, tout en laissant le jeu sémantique avec le service apparaître dans la suite.
- source_word: mysteries
  choice: mystères
  rationale: Maintient la portée religieuse et l’ambiguïté du terme plutôt que de la réduire à des rites ou à des enseignements secrets.
- source_word: found in him
  choice: trouvés en lui
  rationale: Préserve la formulation inhabituelle et sa tension eschatologique possible sans l’expliciter.
- source_word: blame
  choice: tout sujet de reproche
  rationale: Expression française naturelle qui couvre à la fois le blâme moral et ce qui peut donner prise à une accusation.
theological_decisions:
- issue: Nature de l’obéissance à l’évêque
  choice: « comme à Jésus-Christ »
  alternative: « comme vous obéiriez à Jésus-Christ »
  rationale: La formulation brève conserve l’analogie forte du témoin sans préciser qu’il s’agirait d’une identité ou d’une équivalence absolue.
- issue: Fonction du conseil des anciens
  choice: « comme aux apôtres de Jésus-Christ »
  alternative: « comme vous obéiriez aux apôtres »
  rationale: Conserve le parallèle ecclésial explicite sans développer une doctrine de succession ou d’autorité absente de la phrase.
- issue: « Plaire à tous en toutes choses »
  choice: « chercher à plaire à tous en toutes choses »
  alternative: « donner satisfaction à tous de toute manière »
  rationale: Produit une phrase française idiomatique tout en gardant l’exigence générale; « chercher à » évite de présenter comme réalisable une réussite universelle garantie.
- issue: « Nourriture et boisson »
  choice: sens concret maintenu
  alternative: interprétation sacramentelle ou administrative explicite
  rationale: Le passage oppose des tâches matérielles au service de l’Église, mais les données fournies ne permettent pas de trancher entre plusieurs arrière-plans possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est rendu par « vous ». Le rythme exhortatif et les parallèles du témoin sont conservés. Comme la source grecque n’a pas encore fait l’objet d’une révision directe dans les données fournies, les choix restent explicitement fondés sur le témoin anglais public fourni et devront être vérifiés sur la tradition grecque de la recension moyenne.
