  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: fr
  text: 'L’amour des Smyrniotes et des Éphésiens vous salue. Souvenez-vous dans vos prières de l’Église qui est en Syrie, dont je ne suis pas digne [même][a] d’être appelé membre, moi qui suis le dernier de tous.


    Portez-vous bien en Jésus-Christ. Soumettez-vous à l’évêque comme au commandement, et de même au collège des anciens. Que chacun de vous aime les autres d’un cœur sans partage.


    Mon esprit s’offre pour vous, non seulement maintenant, mais aussi lorsque je parviendrai jusqu’à Dieu. Car je suis encore en danger. Mais le Père est fidèle, en Jésus-Christ, pour accomplir ma demande et la vôtre. Puissions-nous être trouvés irréprochables en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « même » correspond à une restitution éditoriale signalée entre crochets dans le témoin anglais; sa présence dans le texte grec devra être vérifiée lors de la révision sur la langue source.
    reason: Conserver visiblement le signal éditorial du témoin fourni et indiquer le caractère provisoire de la restitution.
lexical_decisions:
- source_word: Smyrnaens
  choice: Smyrniotes
  rationale: Gentilé français moderne et intelligible pour les habitants de Smyrne.
- source_word: presbytery
  choice: collège des anciens
  rationale: Rend la dimension collective du terme ecclésial sans imposer le sens moderne de « presbytère », qui désigne couramment une habitation.
- source_word: undivided heart
  choice: d’un cœur sans partage
  rationale: Expression française naturelle qui conserve l’idée d’une affection entière et non divisée.
- source_word: attain unto God
  choice: parviendrai jusqu’à Dieu
  rationale: Préserve le mouvement vers Dieu et la tension eschatologique du témoignage sans l’expliciter davantage.
- source_word: unblamable
  choice: irréprochables
  rationale: Équivalent courant et digne exprimant l’absence de reproche.
theological_decisions:
- issue: Relation à l’évêque et au commandement
  choice: « Soumettez-vous à l’évêque comme au commandement »
  alternative: « comme à un commandement » ou « comme au commandement de Dieu »
  rationale: La formulation transmise est conservée sans ajouter un complément divin absent du témoin fourni ni résoudre sa concision.
- issue: Offrande de l’esprit d’Ignace
  choice: « Mon esprit s’offre pour vous »
  alternative: « Je donne ma vie pour vous »
  rationale: La traduction garde le terme « esprit » et la métaphore d’offrande, sans la réduire explicitement au martyre ou à la vie physique.
- issue: Accomplissement de la demande
  choice: « le Père est fidèle, en Jésus-Christ, pour accomplir ma demande et la vôtre »
  alternative: « le Père, fidèle en Jésus-Christ, exaucera vos prières et les miennes »
  rationale: Cette formulation préserve autant que possible la structure et l’ambiguïté de rattachement du témoignage anglais, ainsi que la différence entre demande et prière.
- issue: Référent final de « en lui »
  choice: « en lui »
  alternative: « en Jésus-Christ » ou « en Dieu »
  rationale: Le pronom est maintenu afin de ne pas trancher silencieusement son antécédent théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Cette version reste provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne est encore à effectuer. « Église » est employé pour la communauté locale; « collège des anciens » évite l’ambiguïté contemporaine de « presbytère ». Le marqueur [a] figure bien dans le texte principal.
