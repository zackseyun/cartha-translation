base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: fr
  text: 'Votre prière est parvenue jusqu’à l’Église qui est à Antioche de Syrie. C’est de là que je viens, prisonnier dans des chaînes très agréables à Dieu, et je salue tout le monde. Pourtant, je ne suis pas digne d’appartenir à cette Église, moi qui suis le dernier de ses membres. Cela m’a été accordé par la volonté divine, non parce que je le méritais, mais par la grâce de Dieu. Je demande à recevoir pleinement cette grâce, afin que, grâce à vos prières, je parvienne jusqu’à Dieu.


    Ainsi, pour que votre œuvre soit menée à son accomplissement sur la terre comme au ciel, il convient que votre Église désigne, pour l’honneur de Dieu, un ambassadeur de Dieu. Qu’il aille jusqu’en Syrie et se réjouisse avec eux de ce qu’ils sont en paix, qu’ils ont retrouvé leur juste stature et que leur pleine dimension leur a été rendue.


    Il m’a donc semblé bon que vous envoyiez l’un des vôtres, muni d’une lettre, afin qu’il s’unisse à eux pour rendre gloire à Dieu à cause du calme qui leur est survenu par sa volonté, et parce que, grâce à vos prières, ils atteignaient déjà le port. Puisque vous êtes accomplis, que vos décisions le soient aussi. Car, si vous désirez faire le bien, Dieu est prêt à vous en accorder les moyens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais du domaine public fourni. Une vérification directe du texte grec de la recension moyenne demeure nécessaire, notamment pour les expressions rendues par « non parce que je le méritais », « juste stature » et « pleine dimension ».
    reason: La source grecque n’a pas encore fait l’objet d’un examen direct; la note signale honnêtement les principaux points d’incertitude textuelle et lexicale.
lexical_decisions:
- source_word: prayer sped forth
  choice: Votre prière est parvenue jusqu’à
  rationale: Rend naturellement en français le mouvement exprimé par le témoin anglais sans imposer une image artificielle de vitesse.
- source_word: most godly bonds / bonds most pleasing to God
  choice: des chaînes très agréables à Dieu
  rationale: Préserve l’évaluation religieuse paradoxale des liens d’Ignace, sans les réduire simplement à des « chaînes sacrées ».
- source_word: not of my own complicity
  choice: non parce que je le méritais
  rationale: Le terme anglais « complicity » paraît ici obscur ou vieilli; le contexte oppose le mérite personnel à la grâce divine. Ce choix reste provisoire dans l’attente du contrôle grec.
- source_word: attain unto God
  choice: je parvienne jusqu’à Dieu
  rationale: Conserve la formulation téléologique caractéristique d’Ignace sans expliciter davantage la manière dont il espère parvenir à Dieu.
- source_word: ambassador of God
  choice: un ambassadeur de Dieu
  rationale: Maintient l’image officielle de la personne mandatée par l’Église.
- source_word: proper stature / proper fullness
  choice: leur juste stature / leur pleine dimension
  rationale: Préserve les deux métaphores corporelles voisines sans les fusionner en une simple idée de rétablissement institutionnel.
- source_word: calm ... haven
  choice: le calme ... le port
  rationale: Maintient l’ensemble de l’imagerie maritime du passage.
- source_word: perfect
  choice: accomplissement / accomplis
  rationale: Le français « parfait » risquerait d’évoquer une perfection morale absolue; « accompli » conserve l’idée d’achèvement et le jeu de répétition.
theological_decisions:
- issue: Le sens de « parvenir jusqu’à Dieu »
  choice: Conserver la formule sans l’expliquer
  alternative: Interpréter explicitement la mort d’Ignace comme martyre lui donnant accès à Dieu
  rationale: Le passage laisse cette finalité chargée de sens sans en développer ici le mécanisme; une explicitation importerait une interprétation théologique.
- issue: Rapport entre volonté divine, grâce et mérite humain
  choice: Maintenir l’opposition entre absence de mérite et grâce de Dieu
  alternative: Présenter l’événement comme résultant d’une coopération ou d’une initiative personnelle d’Ignace
  rationale: Le témoin fourni attribue expressément le don à la volonté et à la grâce divines plutôt qu’à Ignace lui-même.
- issue: « Sur la terre comme au ciel »
  choice: Conserver la portée double de l’œuvre ecclésiale
  alternative: Réduire le ciel à une simple approbation spirituelle de l’action terrestre
  rationale: La formulation garde une tension entre l’action concrète de l’Église et son accomplissement céleste.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement collectif est employé pour l’Église de Smyrne. Les répétitions rhétoriques d’Ignace, les images corporelles et l’imagerie maritime sont conservées autant que possible. Le texte demeure explicitement provisoire faute de contrôle direct du grec.
