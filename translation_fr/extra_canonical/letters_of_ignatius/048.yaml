base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: fr
  text: 'Soyez donc sourds quand quelqu’un vous parle en dehors de Jésus-Christ, qui est de la lignée de David, qui est issu de Marie, qui est véritablement né, qui a mangé et bu, qui a véritablement été persécuté sous Ponce Pilate, qui a véritablement été crucifié et qui est mort sous les yeux des êtres célestes, terrestres et souterrains.


    De plus, il a véritablement été ressuscité d’entre les morts, car son Père l’a ressuscité. De la même manière, son Père nous ressuscitera aussi, nous qui croyons en lui — oui, son Père nous ressuscitera — en Jésus-Christ, en dehors de qui nous n’avons pas la vraie vie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκωφώθητε (reconstructed from the Greek tradition; direct review pending)
  choice: Soyez donc sourds
  rationale: Conserve l’image volontairement forte de la surdité face à tout enseignement séparé de Jésus-Christ, plutôt que de l’atténuer en « n’écoutez pas ».
- source_word: γένος Δαυίδ (reconstructed; direct review pending)
  choice: de la lignée de David
  rationale: Expression française naturelle qui rend l’ascendance davidique sans suggérer seulement une famille immédiate.
- source_word: ἀληθῶς (reconstructed; direct review pending)
  choice: véritablement
  rationale: La répétition est conservée, car elle porte l’insistance polémique du passage sur la réalité de la naissance, des souffrances, de la mort et de la résurrection de Jésus.
- source_word: ἐπουρανίων, ἐπιγείων, ὑποχθονίων (reconstructed; direct review pending)
  choice: des êtres célestes, terrestres et souterrains
  rationale: Rend les trois catégories comme des êtres témoins plutôt que comme de simples lieux, conformément à la formulation personnelle « sous les yeux de ».
- source_word: ἀληθινὸν ζῆν (reconstructed; direct review pending)
  choice: la vraie vie
  rationale: Formulation idiomatique qui maintient l’affirmation qualitative et théologique sans la développer.
theological_decisions:
- issue: Réalité de l’incarnation, des souffrances et de la résurrection
  choice: Répéter « véritablement » aux étapes affirmées par le texte
  alternative: Alléger la répétition pour obtenir un français plus fluide
  rationale: La répétition est théologiquement et rhétoriquement décisive dans cette réfutation d’une compréhension irréelle ou seulement apparente de la vie et de la mort de Jésus.
- issue: Agent de la résurrection de Jésus et de celle des croyants
  choice: Nommer explicitement le Père comme celui qui ressuscite Jésus et ressuscitera les croyants
  alternative: Employer une tournure passive sans agent
  rationale: Le témoin fourni insiste deux fois sur l’action du Père; cette insistance doit rester visible.
- issue: Sens de « en Jésus-Christ » dans la dernière phrase
  choice: Conserver « en Jésus-Christ » sans préciser davantage son rattachement syntaxique
  alternative: Expliciter « le Père nous ressuscitera par Jésus-Christ » ou « nous qui sommes en Jésus-Christ »
  rationale: Le rattachement exact est potentiellement ambigu; la traduction évite de trancher silencieusement entre le moyen de la résurrection et la sphère d’union avec le Christ.
- issue: « En dehors de Jésus-Christ »
  choice: Conserver la formulation spatiale et relationnelle « en dehors de »
  alternative: Traduire par « sans Jésus-Christ » ou « contrairement à l’enseignement de Jésus-Christ »
  rationale: Cette expression préserve la tension du passage et n’en réduit pas la portée à la seule doctrine verbale.
translation_notes:
  register: 'Français international moderne, digne et directement compréhensible. La structure a été légèrement segmentée pour la lisibilité, tout en maintenant les répétitions et la progression confessionnelle. Projet nécessairement provisoire : la documentation fournie est un témoin anglais du domaine public et indique que la vérification directe du grec de la recension moyenne reste à faire.'
