source:
  text: 'Be ye deaf therefore, when any man speaketh to you apart from Jesus Christ, who was of the race of David, who was the Son of Mary, who was truly born and ate and drank, was truly persecuted under Pontius Pilate, was truly crucified and died in the sight of those in heaven and those on earth and those under the earth;


    who moreover was truly raised from the dead, His Father having raised Him, who in the like fashion will so raise us also who believe on Him--His Father, I say, will raise us--in Christ Jesus, apart from whom we have not true life.'
