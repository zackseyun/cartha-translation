    issue: « fils de Marie » traduit de façon trop interprétative « ἐκ Μαρίας ».
    rationale: Le grec exprime l’origine (« de/issu de Marie »), tandis que « fils de Marie » introduit une relation filiale qui n’est pas la formulation du texte.
  - severity: low
    issue: « il est véritablement ressuscité » ne maintient pas explicitement la voix passive de ἠγέρθη.
    rationale: Puisque la phrase suivante précise que le Père l’a ressuscité, « a véritablement été ressuscité » reproduit plus exactement la séquence et évite de suggérer une voix active française.
