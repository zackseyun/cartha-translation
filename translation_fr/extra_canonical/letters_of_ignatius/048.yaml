  to: 'Soyez donc sourds quand quelqu’un vous parle en dehors de Jésus-Christ, qui est de la lignée de David, qui est issu de Marie, qui est véritablement né, qui a mangé et bu, qui a véritablement été persécuté sous Ponce Pilate, qui a véritablement été crucifié et qui est mort sous les yeux des êtres célestes, terrestres et souterrains.


