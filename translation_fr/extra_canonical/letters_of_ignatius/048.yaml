review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur « fils de Marie » : le grec de la recension moyenne porte « ἐκ Μαρίας » (« issu/de Marie »), et non « fils de Marie ». La voix passive de la résurrection est aussi mieux maintenue par « a été ressuscité », en cohérence avec ἠγέρθη et avec l’action explicitement attribuée au Père. Le reste conserve l’insistance répétée de ἀληθῶς, l’ascendance davidique et la triade célestes, terrestres et souterrains.'
  naturalness: Le français est globalement naturel et de registre approprié. La reprise de relatives (« qui est... qui est... qui est... ») rend plus clairement la construction descriptive du texte source, sans alourdir excessivement. « Soyez donc sourds » demeure une image forte mais recevable en français moderne dans ce contexte exhortatif.
  terminology: « Jésus-Christ », « Ponce Pilate », « Père », « ressusciter » et « vraie vie » sont cohérents et accessibles. « Issu de Marie » est plus exact que « fils de Marie » tout en restant idiomatique. « A été ressuscité » préserve l’agent divin sans effacer la formulation passive initiale.
  issues:
