base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: fr
  text: 'Évitez donc ces mauvais rejetons qui produisent un fruit mortel : quiconque y goûte meurt sur-le-champ. Car ces gens ne sont pas une plantation du Père.


    S’ils l’étaient, ils apparaîtraient comme des branches de la croix, et leur fruit serait impérissable. Par cette croix, dans sa passion, il vous appelle, vous qui êtes ses membres. Or, une tête ne peut se trouver sans membres, puisque Dieu promet l’union, et que cette union, c’est lui-même.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais public de J. B. Lightfoot; une vérification directe du grec de la recension moyenne reste nécessaire, notamment pour la syntaxe de la phrase sur la croix et l’union.
    reason: Le dossier fourni indique que l’examen de la langue source est encore en attente; la note signale honnêtement cette limite textuelle.
lexical_decisions:
- source_word: vile offshoots
  choice: mauvais rejetons
  rationale: Conserve l’image végétale et le jugement négatif sans recourir à un terme inutilement archaïque.
- source_word: deadly fruit
  choice: un fruit mortel
  rationale: Reproduit directement la métaphore et son effet létal.
- source_word: the Father’s planting
  choice: une plantation du Père
  rationale: Préserve l’image agricole et le lien explicite avec le Père.
- source_word: branches of the Cross
  choice: des branches de la croix
  rationale: Maintient la métaphore frappante du témoin, sans la normaliser en une expression ecclésiologique plus interprétative.
- source_word: passion
  choice: passion
  rationale: Terme français courant dans le registre chrétien pour les souffrances et la mort du Christ.
- source_word: members
  choice: membres
  rationale: Conserve l’image organique de la tête et des membres.
- source_word: union
  choice: union
  rationale: Préserve la formulation abstraite et sa tension théologique, plutôt que de préciser indûment « unité » ou « communion ».
theological_decisions:
- issue: Référent de « He » dans l’expression relative à la croix
  choice: « il », compris dans le contexte comme le Christ
  alternative: Nommer explicitement « le Christ » ou « Jésus-Christ »
  rationale: Le témoin emploie un pronom et laisse le référent dépendre du contexte; la traduction évite d’ajouter un nom absent.
- issue: Relation entre la tête, les membres et Dieu
  choice: Maintenir la suite d’images et l’affirmation « cette union, c’est lui-même »
  alternative: Expliquer que le Christ est la tête ou que Dieu garantit l’unité de l’Église
  rationale: Une explicitation résoudrait une formulation théologiquement dense que le témoin laisse ouverte.
- issue: Sens de l’invitation par la croix
  choice: « il nous appelle »
  alternative: « il nous invite à lui » ou « il nous attire »
  rationale: « Appelle » exprime naturellement l’invitation sans fournir un complément ou une finalité que le témoin ne précise pas.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores végétale et corporelle sont conservées. La ponctuation et le découpage des phrases clarifient la syntaxe très dense du témoin sans supprimer ses ambiguïtés.
