revisions:
- from: 'Évitez donc ces mauvais rejetons qui produisent un fruit mortel : dès qu’on en goûte, on meurt. Car ces gens ne sont pas une plantation du Père.


    S’ils l’étaient, on verrait qu’ils sont des branches de la croix, et leur fruit serait impérissable. Par cette croix, au moyen de sa passion, il nous appelle, nous qui sommes ses membres. Or, on ne peut trouver une tête sans membres, puisque Dieu promet l’union, et que cette union, c’est lui-même.[a]'
  to: 'Évitez donc ces mauvais rejetons qui produisent un fruit mortel : quiconque y goûte meurt sur-le-champ. Car ces gens ne sont pas une plantation du Père.


    S’ils l’étaient, ils apparaîtraient comme des branches de la croix, et leur fruit serait impérissable. Par cette croix, dans sa passion, il vous appelle, vous qui êtes ses membres. Or, une tête ne peut se trouver sans membres, puisque Dieu promet l’union, et que cette union, c’est lui-même.[a]'
  rationale: La révision rétablit surtout la deuxième personne plurielle attestée dans le grec (« il vous appelle, vous qui êtes ses membres »). Elle améliore en outre la restitution de la valeur hypothétique (« ils apparaîtraient ») et rend plus littéralement la relation de la passion à l’appel (« dans sa passion »). L’affirmation finale sur Dieu et l’union est volontairement conservée dans sa densité et son ambiguïté théologique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'La vérification du grec de la recension moyenne confirme l’essentiel des images et de la construction. Une correction est nécessaire : le grec porte ὑμᾶς (« vous »), et non « nous », dans la proposition où le Christ appelle ses membres. La formulation sur l’union demeure dense : elle doit conserver l’identification de l’union à Dieu lui-même sans explicitation ecclésiologique.'
  naturalness: Le français est globalement moderne et lisible. « Apparaîtraient comme » rend plus naturellement la valeur potentielle de ἐφαίνοντο ἄν que « on verrait qu’ils sont ». « Dans sa passion » reflète sans lourdeur l’expression grecque ἐν τῷ πάθει αὐτοῦ.
  terminology: « Rejetons », « fruit mortel », « plantation du Père », « branches de la croix », « passion », « membres » et « union » préservent les métaphores et le registre chrétien ancien. La minuscule à « croix » est idiomatique en français tout en gardant le référent christologique contextuel.
  issues:
  - severity: high
    issue: 'Changement de personne : « il nous appelle, nous qui sommes ses membres »'
    rationale: Le texte grec de la recension moyenne lit ὑμᾶς (« vous »). Le destinataire est donc l’auditoire épistolaire, non un « nous » incluant le narrateur-traducteur.
  - severity: low
    issue: « on verrait qu’ils sont » affaiblit la valeur potentielle
    rationale: ἐφαίνοντο ἄν exprime ce qu’ils apparaîtraient/seraient manifestement s’ils étaient réellement la plantation du Père.
  - severity: low
    issue: « au moyen de sa passion »
    rationale: La préposition ἐν est plus directement rendue par « dans sa passion »; cette formulation évite aussi de présenter la passion comme un second instrument distinct de la croix.
