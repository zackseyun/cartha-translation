base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: fr
  text: 'Puisque, comme on me l’a rapporté, l’Église qui est à Antioche de Syrie jouit de la paix grâce à vos prières, j’en ai moi-même été d’autant plus réconforté, car Dieu a dissipé mon inquiétude — pourvu que, par la souffrance, je parvienne jusqu’à Dieu et que, grâce à votre intercession, je sois reconnu comme disciple.


    Il te convient, très bienheureux Polycarpe, de réunir un conseil selon Dieu et de choisir parmi vous quelqu’un qui vous soit particulièrement cher et qui soit aussi plein de zèle, quelqu’un qui soit digne de porter le titre de courrier de Dieu. Charge-le donc de se rendre en Syrie et d’y manifester, pour la gloire de Dieu, l’ardeur de votre amour.


    Un chrétien ne dispose pas de lui-même, mais consacre son temps à Dieu. Cette œuvre est celle de Dieu, et elle sera aussi la vôtre lorsque vous l’aurez accomplie. Car j’ai confiance dans la grâce divine : vous êtes prêts à accomplir une bonne œuvre digne de Dieu. Connaissant l’ardeur de votre sincérité, je vous ai adressé cette brève exhortation.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais fourni. Une vérification directe du texte grec de la recension moyenne reste nécessaire, notamment pour les expressions rendues par « courrier de Dieu », « consacre son temps à Dieu » et « sincérité ».
    reason: Les données indiquent explicitement que la révision dans la langue source est encore en attente; la note rend transparente cette limite textuelle.
lexical_decisions:
- source_word: ἡ ἐκκλησία ἡ οὖσα ἐν Ἀντιοχείᾳ τῆς Συρίας (reconstructed from the middle-recension tradition)
  choice: l’Église qui est à Antioche de Syrie
  rationale: Conserve la formulation localisante ancienne sans donner à « Église » un sens purement institutionnel.
- source_word: εἰς θεὸν ἐπιτυχεῖν / equivalent reflected by “attain unto God”
  choice: parvienne jusqu’à Dieu
  rationale: Préserve la formulation forte et la tension eschatologique d’Ignace sans la réduire à « mourir » ou à « être sauvé ».
- source_word: θεοδρόμος / expression reflected by “God’s courier”
  choice: courrier de Dieu
  rationale: Rend l’image d’un envoyé chargé de porter une communication ou une représentation, plutôt que d’introduire un titre ecclésiastique absent.
- source_word: σχολάζειν θεῷ / expression reflected by “giveth his time to God”
  choice: consacre son temps à Dieu
  rationale: Exprime naturellement la disponibilité entière envers Dieu, tout en évitant l’idée moderne de simple loisir.
- source_word: θεοπρεπὴς εὐποιΐα / expression reflected by “act of well doing worthy of God”
  choice: une bonne œuvre digne de Dieu
  rationale: Conserve à la fois la dimension concrète de l’action bienfaisante et son caractère conforme à Dieu.
theological_decisions:
- issue: Rapport entre souffrance, accès à Dieu et identité de disciple
  choice: « pourvu que, par la souffrance, je parvienne jusqu’à Dieu et que… je sois reconnu comme disciple »
  alternative: « si le martyre me permet d’aller auprès de Dieu et de prouver que je suis disciple »
  rationale: La traduction retenue garde le caractère conditionnel et la tension du texte, sans identifier explicitement la souffrance au martyre ni transformer le jugement final en simple preuve humaine.
- issue: Intercession de la communauté
  choice: « grâce à votre intercession »
  alternative: « grâce à vos prières »
  rationale: Le premier paragraphe mentionne déjà les prières; « intercession » préserve la nuance distincte du témoignage anglais et n’en précise pas indûment le mécanisme théologique.
- issue: Absence d’autonomie du chrétien
  choice: « ne dispose pas de lui-même »
  alternative: « n’a aucune autorité sur lui-même »
  rationale: Cette formulation française naturelle exprime l’appartenance et la disponibilité envers Dieu sans suggérer une négation générale de toute responsabilité personnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé lorsque Ignace s’adresse personnellement à Polycarpe, puis le pluriel lorsque l’exhortation vise la communauté. Les tournures archaïques du témoin anglais ont été modernisées, tout en maintenant la densité théologique et les ambiguïtés authentiques.
