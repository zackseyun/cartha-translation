review_pass:
  verdict: revise
  source_fidelity: 'Le mouvement, les métaphores animales, l’accumulation finale et la tension entre discipulat et justification sont globalement bien conservés. Quelques formulations peuvent toutefois suivre plus exactement le témoin : la prière porte sur la promptitude des bêtes, l’allusion aux personnes qu’elles n’ont pas touchées doit rester syntaxiquement claire, et l’engagement d’Ignace à les contraindre est au futur plutôt qu’au conditionnel.'
  naturalness: Le français est soutenu et intelligible, mais « je prie de les trouver prêtes », « qu’elles ont fait pour certains » et « ne m’envie d’atteindre » sont peu naturels ou ambigus. Les corrections proposées préservent le rythme véhément du passage tout en améliorant la syntaxe moderne.
  terminology: « disciple », « justifié », « Jésus Christ » et « supplices du diable » sont conservés. « Me jalouse » restitue la personnification de l’envie tout en nécessitant une note pour l’acception possible d’obstacle envieux.
  issues:
  - severity: medium
    issue: La construction « ne m’envie d’atteindre Jésus Christ » n’est pas idiomatique en français moderne.
    rationale: Elle obscurcit le rapport entre l’envie des réalités visibles/invisibles et l’atteinte de Jésus Christ. « Ne me jalouse » est plus naturel; la note explicite l’idée possible d’une entrave jalouse sans la substituer au texte.
  - severity: medium
    issue: « Je les y forcerais » emploie un conditionnel là où le témoin exprime une détermination future.
    rationale: « Je les y contraindrai » rend la résolution emphatique du locuteur, sans modifier le contenu.
  - severity: low
    issue: La phrase concernant « certains » est syntaxiquement lourde et peut momentanément laisser incertain l’antécédent de « qu’elles ».
    rationale: Une ponctuation explicative et la reprise de « elles » rendent clairement compte du fait que les bêtes ont refusé de toucher certaines personnes par crainte.
  - severity: low
    issue: « Je prie de les trouver prêtes » ne rend pas avec netteté la demande que les bêtes soient promptes.
    rationale: « Je prie pour qu’elles soient promptes » correspond plus directement au souhait formulé.
  revised_text: 'Depuis la Syrie jusqu’à Rome, je combats contre des bêtes sauvages, sur terre et sur mer, nuit et jour, enchaîné au milieu de dix léopards — je veux dire une troupe de soldats — qui ne font qu’empirer quand on les traite avec bonté. Pourtant, en subissant leurs injustices, je deviens plus pleinement disciple ; mais ce n’est pas pour autant que je suis justifié.


    Puissé-je me réjouir des bêtes préparées pour moi ! Je prie pour qu’elles soient promptes ; je les inciterai même à me dévorer sans tarder, non comme elles l’ont fait à l’égard de certains : par crainte, elles ont refusé de les toucher. Et si elles ne le voulaient pas d’elles-mêmes, alors que moi je suis prêt, je les y contraindrai.


    Soyez indulgents envers moi. Je sais ce qui m’est avantageux. Maintenant, je commence à être un disciple. Que rien de visible ou d’invisible ne me jalouse[a], afin que j’atteigne Jésus Christ. Que viennent sur moi le feu et la croix, les luttes avec les bêtes sauvages, [les lacérations et les déchirements,][b] la dislocation des os, le démembrement, le broiement de tout mon corps ; que viennent sur moi les cruels supplices du diable. Pourvu seulement que j’atteigne Jésus Christ !'
  revised_footnotes:
