base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: fr
  text: 'Depuis la Syrie jusqu’à Rome, je combats contre des bêtes sauvages, sur terre et sur mer, nuit et jour, enchaîné au milieu de dix léopards — je veux dire une troupe de soldats — qui ne font qu’empirer quand on les traite avec bonté. Pourtant, par leurs mauvais traitements, je deviens plus pleinement disciple ; mais ce n’est pas pour autant que je suis justifié.


    Puissé-je trouver ma joie dans les bêtes préparées pour moi ! Je prie de les trouver prêtes ; je les inciterai même à me dévorer sans tarder, contrairement à ce qu’elles ont fait pour certains, qu’elles ont refusé de toucher par crainte. Et si elles ne le voulaient pas d’elles-mêmes alors que moi, je suis prêt, je les y forcerais.


    Supportez-moi. Je sais ce qui m’est avantageux. Maintenant, je commence à être disciple. Que rien, parmi les réalités visibles ou invisibles, ne m’envie[a] d’atteindre Jésus Christ. Que viennent sur moi le feu et la croix, les assauts des bêtes sauvages, [les lacérations et les déchirements,][b] la dislocation des os, le démembrement, le broiement de tout mon corps ; que viennent sur moi les cruels supplices du diable. Pourvu seulement que j’atteigne Jésus Christ !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se comprendre ainsi : « ne fasse obstacle, par jalousie, à ce que j’atteigne Jésus Christ ».'
    reason: La personnification des réalités visibles et invisibles et la construction avec « envier » sont inhabituelles en français ; la note préserve l’idée possible d’entrave sans l’imposer dans le texte.
  - marker: b
    text: Les mots entre crochets sont transmis comme un passage textuellement incertain ou restauré dans le témoin anglais fourni ; une vérification directe de la tradition manuscrite grecque reste nécessaire.
    reason: Les crochets du témoin doivent être conservés et expliqués, car ils signalent une incertitude textuelle plutôt qu’une simple parenthèse stylistique.
lexical_decisions:
- source_word: θηριομαχῶ (reconstructed from the Greek tradition; review pending)
  choice: je combats contre des bêtes sauvages
  rationale: Conserve l’image concrète de la lutte sans décider si elle est ici entièrement littérale ou si elle qualifie aussi les soldats qui escortent Ignace.
- source_word: δέκα λεοπάρδοις (reconstructed; review pending)
  choice: dix léopards
  rationale: Maintient la métaphore animale forte, immédiatement explicitée par « une troupe de soldats ».
- source_word: μαθητεύομαι / μαθητής (reconstructed; review pending)
  choice: je deviens plus pleinement disciple / je commence à être disciple
  rationale: 'Préserve la progression paradoxale exprimée par Ignace : ses souffrances approfondissent son apprentissage sans constituer sa justification.'
- source_word: δικαίωμαι (reconstructed; review pending)
  choice: je suis justifié
  rationale: Garde le terme théologiquement chargé et sa tension avec le fait de devenir disciple, sans le réduire à « déclaré innocent » ou « rendu juste ».
- source_word: ἐπιτήδειον (probable Greek basis; review pending)
  choice: ce qui m’est avantageux
  rationale: Rend l’idée de ce qui convient ou profite à Ignace dans ce contexte, avec une formulation française naturelle.
- source_word: ἐπιτύχω Ἰησοῦ Χριστοῦ (probable Greek basis; review pending)
  choice: j’atteigne Jésus Christ
  rationale: Conserve l’image d’aboutissement et le mouvement vers le Christ, plutôt que de préciser « rejoindre » ou « obtenir », qui résoudraient davantage le sens.
theological_decisions:
- issue: Rapport entre souffrance, discipulat et justification
  choice: « par leurs mauvais traitements, je deviens plus pleinement disciple ; mais ce n’est pas pour autant que je suis justifié »
  alternative: « leurs injustices font de moi un meilleur disciple, mais elles ne prouvent pas mon innocence »
  rationale: 'La traduction retenue conserve le vocabulaire et la tension théologiques : la souffrance peut approfondir le discipulat, mais elle ne produit pas automatiquement la justification.'
- issue: Désir du martyre et action divine
  choice: Reproduire directement les souhaits d’Ignace sans ajouter d’approbation ni d’explication doctrinale
  alternative: Reformuler comme une simple acceptation passive de la mort
  rationale: Le passage exprime explicitement un désir actif d’affronter les bêtes ; l’atténuer effacerait une caractéristique historique et rhétorique du texte.
- issue: « supplices du diable »
  choice: « les cruels supplices du diable »
  alternative: « les cruels supplices inspirés par le diable »
  rationale: 'Le génitif demeure ambigu : origine, possession ou médiation. La formulation retenue ne tranche pas entre ces rapports.'
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Le rythme accumulatif et l’intensité du passage sont conservés, notamment dans la dernière série de supplices. La traduction est provisoire : elle s’appuie sur le témoin anglais public fourni et sur des correspondances grecques probables de la recension moyenne ; une collation directe du grec reste requise avant publication définitive.'
