base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: fr
  text: 'De même, que tous respectent les diacres comme Jésus-Christ, tout comme ils doivent respecter l’évêque comme une figure du Père, et les anciens comme le conseil de Dieu et l’assemblée des apôtres. Sans eux, on ne peut même pas parler d’Église.


    Je suis convaincu que telle est votre manière de voir sur ces questions. En effet, j’ai reçu un exemple de votre amour, et je l’ai auprès de moi en la personne de votre évêque. Sa conduite même est un grand enseignement, et sa douceur est une force. C’est un homme auquel, je pense, même les impies témoignent du respect.


    C’est parce que je vous aime que je vous épargne ainsi, bien que je puisse écrire avec plus de sévérité pour prendre sa défense. Mais je ne me suis pas estimé autorisé à le faire : moi qui suis un condamné, je ne voulais pas vous donner des ordres comme si j’étais un apôtre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deacons
  choice: diacres
  rationale: Terme ecclésial français établi, correspondant directement à la fonction mentionnée.
- source_word: bishop
  choice: évêque
  rationale: Équivalent historique et courant du titre ecclésial.
- source_word: presbyters
  choice: anciens
  rationale: Rend le sens premier du terme sans imposer le titre confessionnel moderne « prêtres » ; « presbytres » serait moins accessible au grand public.
- source_word: type of the Father
  choice: une figure du Père
  rationale: « Figure » conserve l’idée de représentation typologique sans suggérer une identité avec le Père.
- source_word: council of God
  choice: le conseil de Dieu
  rationale: Préserve l’image institutionnelle et délibérative du témoin, sans l’expliciter davantage.
- source_word: college of Apostles
  choice: l’assemblée des apôtres
  rationale: « Assemblée » est naturel en français moderne et évite les connotations techniques contemporaines de « collège ».
- source_word: there is not even the name of a church
  choice: on ne peut même pas parler d’Église
  rationale: Formulation idiomatique qui conserve l’affirmation forte selon laquelle, sans ces ministères, l’appellation même d’Église ne convient pas.
- source_word: convict
  choice: condamné
  rationale: Dans le contexte de l’emprisonnement d’Ignace, « condamné » est plus naturel que « forçat » et ne précise pas au-delà du témoin fourni.
theological_decisions:
- issue: Nature de l’analogie entre les diacres et Jésus-Christ
  choice: « respecter les diacres comme Jésus-Christ »
  alternative: « respecter les diacres comme ils respectent Jésus-Christ »
  rationale: La formulation brève du témoin conserve la force et l’ambiguïté rhétorique de l’analogie, sans transformer celle-ci en équivalence ontologique.
- issue: Rapport de l’évêque au Père
  choice: « comme une figure du Père »
  alternative: « comme tenant la place du Père »
  rationale: « Figure » reste proche du langage typologique et évite d’affirmer une substitution ou une représentation juridictionnelle plus précise.
- issue: Définition de l’Église par ses ministères
  choice: « Sans eux, on ne peut même pas parler d’Église »
  alternative: « Sans eux, il n’y a même pas ce qu’on appelle une Église »
  rationale: La traduction garde la tension ecclésiologique du passage sans en tirer une définition dogmatique développée.
- issue: Autorité apostolique d’Ignace
  choice: « comme si j’étais un apôtre »
  alternative: « en qualité d’apôtre »
  rationale: La tournure hypothétique maintient la distinction explicite qu’Ignace établit entre sa condition de condamné et l’autorité d’un apôtre.
translation_notes:
  register: Français international moderne, digne et accessible. Les titres ecclésiaux sont rendus de manière cohérente, avec « anciens » pour éviter un choix confessionnel indu. Aucun appel de note n’est requis, puisqu’aucune note n’est fournie. Le dossier indique qu’une vérification directe du grec de la recension moyenne reste à effectuer ; le présent projet demeure donc fondé sur le témoin anglais public fourni, consulté avec la couche POB anglaise.
