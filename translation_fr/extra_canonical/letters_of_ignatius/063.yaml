base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: fr
  text: 'Je vous écris ces choses depuis Smyrne, par l’intermédiaire des Éphésiens, qui méritent toutes les félicitations. Crocus aussi, un nom qui m’est très cher, est ici avec moi, ainsi que beaucoup d’autres.


    Quant à ceux qui m’ont précédé de Syrie à Rome pour la gloire de Dieu, je crois que vous avez reçu des instructions à leur sujet. Faites-leur aussi savoir que je suis proche, car ils sont tous dignes de Dieu et de vous, et il convient que vous leur procuriez du réconfort en toute chose.


    Je vous écris ces choses le neuvième jour avant les calendes de septembre.[a] Portez-vous bien jusqu’à la fin, dans l’attente patiente de Jésus-Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Date du calendrier romain, traditionnellement comprise comme le 24 août.
    reason: Le texte conserve le système de datation antique; la note fournit l’équivalent usuel sans le substituer au texte.
lexical_decisions:
- source_word: by the hand of
  choice: par l’intermédiaire de
  rationale: Exprime naturellement en français le rôle des Éphésiens comme porteurs ou transmetteurs de la lettre, sans préciser davantage que le témoin.
- source_word: worthy of all felicitation
  choice: méritent toutes les félicitations
  rationale: Conserve la force laudative et la formulation large du témoin anglais, dans un français actuel.
- source_word: refresh them
  choice: leur procuriez du réconfort
  rationale: Rend l’idée de soulager, soutenir et réconforter, sans la réduire à la seule hospitalité matérielle.
- source_word: patient waiting
  choice: l’attente patiente
  rationale: Préserve ensemble les idées d’attente et de persévérance patiente.
theological_decisions:
- issue: '« unto the glory of God » : but du voyage ou horizon théologique'
  choice: pour la gloire de Dieu
  alternative: vers la gloire de Dieu
  rationale: Le témoin permet une nuance de finalité ou de destination. « Pour » reste naturel et conserve l’orientation vers la gloire de Dieu sans développer doctrinalement la formule.
- issue: « worthy of God and of you »
  choice: dignes de Dieu et de vous
  alternative: dignes aux yeux de Dieu et aux vôtres
  rationale: La traduction littérale maintient la tension rhétorique entre Dieu et les destinataires, sans expliquer la nature exacte de cette dignité.
- issue: « unto the end »
  choice: jusqu’à la fin
  alternative: parfaitement
  rationale: Conserve la possible portée eschatologique ou persévérante de la formule au lieu de la réduire à une simple intensité.
translation_notes:
  register: Français international moderne, digne et lisible. Le brouillon demeure provisoire, car les données fournies signalent qu’une vérification directe du grec de la recension moyenne reste à effectuer; les choix sont donc fondés sur le témoin anglais public fourni, consulté avec prudence.
