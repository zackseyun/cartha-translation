base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: fr
  text: 'Priez aussi sans cesse pour le reste de l’humanité, car il y a pour eux un espoir de repentance : qu’ils puissent trouver Dieu. Permettez-leur donc d’apprendre au moins par vos œuvres.


    À leurs accès de colère, opposez la douceur ; à leurs paroles orgueilleuses, l’humilité ; à leurs insultes, vos prières ; à leurs erreurs, la fermeté dans la foi ; à leur violence, la bienveillance. Ne vous empressez pas de les imiter en leur rendant la pareille.


    Montrons-nous leurs frères par notre patience. Mais empressons-nous d’imiter le Seigneur, rivalisant les uns avec les autres pour savoir qui subira le plus grand tort, qui sera dépouillé, qui sera tenu pour rien, afin qu’aucune plante du diable ne se trouve parmi vous. Mais demeurez en Jésus-Christ, dans toute pureté et maîtrise de soi, dans votre chair comme dans votre esprit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rest of mankind
  choice: le reste de l’humanité
  rationale: Formulation inclusive et naturelle en français moderne, sans restreindre la portée universelle du propos.
- source_word: repentance
  choice: repentance
  rationale: Conserve le sens religieux de retournement intérieur et moral, plus précis ici que le simple « regret ».
- source_word: works
  choice: œuvres
  rationale: Préserve la portée éthique des actes visibles dont les autres peuvent tirer enseignement.
- source_word: set ye your prayers
  choice: opposez… vos prières
  rationale: 'Rend la structure antithétique : les prières constituent la réponse aux insultes, sans suggérer une vengeance.'
- source_word: requital
  choice: en leur rendant la pareille
  rationale: Expression française courante qui transmet clairement l’idée de répliquer de la même manière.
- source_word: forbearance
  choice: patience
  rationale: Terme naturel couvrant ici l’endurance et la retenue envers ceux qui font du tort.
- source_word: herb of the devil
  choice: plante du diable
  rationale: Maintient l’image végétale inhabituelle du témoin au lieu de la normaliser en « semence » ou « mauvaise herbe ».
- source_word: temperance
  choice: maîtrise de vous-mêmes
  rationale: Exprime en français actuel la discipline personnelle et la retenue morale visées dans ce contexte.
theological_decisions:
- issue: Portée de l’espoir de repentance
  choice: « il y a pour eux un espoir de repentance »
  alternative: « ils ont l’espoir de se repentir »
  rationale: Évite d’attribuer nécessairement cet espoir aux personnes elles-mêmes ; le témoin affirme qu’un espoir existe à leur sujet.
- issue: Trouver Dieu
  choice: « qu’ils puissent trouver Dieu »
  alternative: « afin qu’ils trouvent Dieu »
  rationale: Conserve la nuance de souhait ou de finalité sans garantir l’issue.
- issue: Imitation du Seigneur par l’acceptation du tort
  choice: « rivalisant… pour savoir qui supportera… »
  alternative: « chacun cherchant à supporter… »
  rationale: Préserve la tension rhétorique du concours paradoxal dans l’imitation du Seigneur, sans en faire une règle de passivité absolue.
- issue: Unité de la personne en Christ
  choice: « dans votre chair comme dans votre esprit »
  alternative: « corps et âme »
  rationale: Maintient les catégories explicites de chair et d’esprit et n’introduit pas une anthropologie différente.
translation_notes:
  register: Français international moderne, digne et exhortatif. Les parallélismes ont été conservés pour restituer la cadence rhétorique. Le tutoiement pluriel est maintenu. Ce projet demeure provisoire, car les données fournies signalent qu’une vérification directe du grec de la recension moyenne reste à effectuer.
