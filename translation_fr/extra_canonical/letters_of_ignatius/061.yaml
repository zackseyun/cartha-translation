review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le contraste final doit garder l’imputation directe du grec (aoristes : « vous l’avez voulu / vous m’avez haï »), plutôt que des conséquences futures. La métaphore « la bouche sans erreur, en qui le Père a parlé » préserve plus exactement le relatif personnel du témoin et de la formulation grecque usuelle. Les ajouts entre crochets transmis par le témoin anglais ne doivent pas être intégrés comme s’ils appartenaient avec certitude au texte.'
  naturalness: Le français est globalement digne et naturel. « À la manière des hommes », « selon la chair » et « selon la pensée de Dieu » conviennent au registre. « Que j’atteigne » demeure intelligible, mais « que je parvienne au but » est plus idiomatique tout en gardant l’objet implicite.
  terminology: Conserver « Jésus Christ », « le Père », « le Saint-Esprit », « la chair » et « pensée de Dieu ». « Bouche sans erreur » rend avec concision l’image de στόμα ἄπλανον sans introduire la catégorie confessionnelle abstraite d’« infaillibilité ».
  issues:
  - severity: high
    issue: 'Le dernier membre est rendu au futur : « ce sera ce que vous avez désiré / ce sera l’effet de votre haine ».'
    rationale: 'Le texte oppose directement les deux éventualités à l’attitude déjà exprimée des destinataires : « si je souffre, vous l’avez voulu ; si je suis rejeté, vous m’avez haï ». La reformulation future affaiblit et modifie l’accusation rhétorique.'
  - severity: medium
    issue: « Par laquelle le Père a parlé en vérité » remplace l’image « en qui le Père a parlé » et rattache artificiellement « en vérité » à la parole du Père.
    rationale: Le relatif est personnel dans la tradition grecque et dans le témoin (« in whom »). Le « truly » entre crochets du témoin anglais relève de la formule précédente (« je dis la vérité ») et ne justifie pas l’ajout affirmatif « en vérité » après « a parlé ».
  - severity: medium
    issue: « Par le Saint-Esprit » figure sans crochets dans le corps du texte.
    rationale: Puisque la base documentaire le transmet entre crochets et qu’aucune vérification manuscrite directe n’est fournie, les crochets doivent être conservés dans la traduction ou les mots doivent être omis. Les conserver entre crochets préserve l’information sans trancher.
  - severity: low
    issue: La note d explique extensivement l’intention supposée des destinataires.
    rationale: L’explication introduit « empêchent d’atteindre le but », élément absent de la formulation même. Le contraste peut être compris sans cette paraphrase interprétative.
  revised_text: 'Je ne désire plus vivre à la manière des hommes ; et cela arrivera, si vous le désirez. Désirez-le, afin que vous aussi, vous soyez désirés.[a] Dans cette brève lettre, je vous en supplie : croyez-moi.


    Et Jésus Christ vous manifestera ces choses : je dis la vérité — Jésus Christ, la bouche sans erreur, en qui le Père a parlé.[b]


    Priez pour moi, afin que je parvienne au but [par le Saint-Esprit].[c] Je ne vous écris pas selon la chair, mais selon la pensée de Dieu. Si je souffre, vous l’avez voulu ; si je suis rejeté, vous m’avez haï.[d]'
  revised_footnotes:
  - marker: a
    text: 'L’expression « afin que vous aussi, vous soyez désirés » reproduit volontairement la répétition du même verbe et son ambiguïté : le texte ne précise pas qui désirera les destinataires ni en quel sens.'
    reason: Préserver le jeu verbal sans imposer une interprétation.
  - marker: b
    text: Le témoin anglais fourni comporte « [truly] » (« véritablement ») entre crochets dans la proposition « je dis la vérité » ; la présente traduction ne le traite pas comme une lecture certaine. La formulation « en qui le Père a parlé » conserve l’image personnelle du Christ comme « bouche sans erreur ».
    reason: Signaler le statut incertain de l’ajout tout en conservant la syntaxe et l’image du passage.
  - marker: c
    text: Les mots « par le Saint-Esprit » sont entre crochets dans le témoin anglais fourni ; les crochets sont donc maintenus en attendant une vérification directe du grec.
    reason: Ne pas masquer l’incertitude textuelle transmise par la documentation.
  - marker: d
    text: 'La formulation abrupte garde le contraste rhétorique du texte : la souffrance d’Ignace serait attribuée à leur volonté, son rejet à leur haine.'
    reason: Éclairer la construction sans ajouter de scénario interprétatif.
  revision_rationale: La révision rétablit la force grammaticale et rhétorique du dernier distique, corrige l’attache de l’expression textuellement incertaine « [truly] », rend le relatif christologique de façon plus fidèle, et conserve explicitement entre crochets l’ajout relatif au Saint-Esprit. Elle maintient l’ambiguïté du jeu sur « désirer » et n’explicite pas l’objet implicite de « parvenir au but ».
