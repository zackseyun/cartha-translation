base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: fr
  text: 'Je ne désire plus vivre à la manière des hommes ; et cela arrivera, si vous le désirez. Désirez-le, afin que vous aussi, vous soyez désirés.[a] Dans cette brève lettre, je vous en supplie : croyez-moi.


    Et Jésus-Christ vous manifestera que je dis vrai — Jésus-Christ, la bouche qui ne se trompe pas, par laquelle le Père a parlé en vérité.[b]


    Priez pour moi, afin que j’atteigne le but, par le Saint-Esprit.[c] Je ne vous écris pas selon la chair, mais selon la pensée de Dieu. Si je souffre, ce sera ce que vous avez désiré ; si je suis rejeté, ce sera l’effet de votre haine.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « afin que vous aussi, vous soyez désirés » est volontairement concise et ambiguë : elle reprend le même verbe sans préciser qui désirera les destinataires ni de quelle manière.'
    reason: Préserver un jeu verbal difficile sans imposer une interprétation absente du témoin.
  - marker: b
    text: Le témoin anglais met « truly » (« en vérité ») entre crochets ; la formulation grecque devra être vérifiée directement.
    reason: Signaler l’incertitude textuelle transmise par la base documentaire fournie.
  - marker: c
    text: Les mots « par le Saint-Esprit » sont placés entre crochets dans le témoin anglais et demandent confirmation par examen direct du grec.
    reason: Ne pas masquer le statut provisoire de ces mots tout en les faisant apparaître dans le texte.
  - marker: d
    text: Autrement dit, si les destinataires laissent Ignace souffrir, ils auront respecté son désir ; s’ils l’empêchent d’atteindre le but recherché, leur intervention sera interprétée comme de la haine.
    reason: Éclairer le contraste rhétorique abrupt sans le modifier dans le corps du texte.
lexical_decisions:
- source_word: after the manner of men
  choice: à la manière des hommes
  rationale: Conserve l’opposition anthropologique du témoin entre une manière humaine de vivre et la volonté de Dieu, dans un français naturel mais formel.
- source_word: desire / desired
  choice: désirez / soyez désirés
  rationale: Maintient la répétition et le jeu verbal délibéré, sans en imposer une interprétation unique.
- source_word: make manifest
  choice: manifestera
  rationale: Reproduit le registre solennel et l’idée de rendre évident, plutôt que de simplement expliquer.
- source_word: unerring mouth
  choice: la bouche qui ne se trompe pas
  rationale: Exprime clairement l’infaillibilité du témoignage du Christ sans employer un terme abstrait ou confessionnel.
- source_word: attain
  choice: atteigne le but
  rationale: Le verbe absolu signifie parvenir à l’issue espérée, ici probablement le martyre et l’union au Christ, mais la traduction ne nomme pas explicitement ce que le texte laisse sous-entendu.
- source_word: after the flesh
  choice: selon la chair
  rationale: Préserve l’expression théologique traditionnelle et son contraste avec la pensée de Dieu.
- source_word: mind of God
  choice: la pensée de Dieu
  rationale: Rend le sens d’intention ou de disposition divine sans le réduire à un simple ordre.
theological_decisions:
- issue: Le sens de « afin que vous aussi, vous soyez désirés »
  choice: Conserver la formulation réciproque et énigmatique
  alternative: « afin que Dieu vous accueille favorablement » ou « afin que votre désir soit agréé »
  rationale: Le témoin fourni ne précise ni l’agent qui désire ni la nature exacte de cette réciprocité ; expliciter Dieu ou l’acceptation résoudrait indûment l’ambiguïté.
- issue: Le Père parle en Christ ou par Christ
  choice: « par laquelle le Père a parlé »
  alternative: « en qui le Père a parlé »
  rationale: Le relatif renvoie grammaticalement à la « bouche » ; « par laquelle » donne un français plus naturel tout en conservant l’image du Christ comme expression véridique du Père.
- issue: La présence du Saint-Esprit
  choice: Inclure « par le Saint-Esprit » avec une note textuelle
  alternative: Omettre les mots entre crochets
  rationale: Ils figurent dans le témoin entre crochets et leur statut grec n’a pas encore été directement vérifié ; ils sont donc traduits sans être présentés comme textuellement certains.
- issue: La responsabilité des destinataires si Ignace souffre ou est rejeté
  choice: Conserver le contraste tranchant entre désir et haine
  alternative: Adoucir en parlant d’approbation et de refus
  rationale: La tension rhétorique du passage avertit les Romains que leur intervention manifesterait l’opposé de leur amour déclaré ; l’adoucir affaiblirait le texte.
translation_notes:
  register: 'Français international moderne, digne et direct. La répétition de « désirer » ainsi que les expressions « selon la chair » et « pensée de Dieu » sont conservées pour respecter la texture théologique. Draft provisoire : la documentation fournie est un témoin anglais public, et l’examen direct de la tradition grecque de la recension moyenne reste à effectuer.'
