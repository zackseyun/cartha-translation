base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: fr
  text: 'Puisqu’il m’a été rapporté que, en réponse à votre prière et à la tendre compassion que vous éprouvez en Jésus Christ, l’Église qui est à Antioche de Syrie jouit de la paix, il vous convient, en tant qu’Église de Dieu, de désigner un diacre pour s’y rendre comme ambassadeur de Dieu, afin qu’il les félicite lorsqu’ils seront rassemblés et qu’il glorifie le Nom[a].


    Heureux en Jésus Christ celui qui sera jugé digne d’un tel service ! Et vous-mêmes, vous serez glorifiés. Si vous le voulez, il ne vous est pas impossible de le faire pour le nom de Dieu. Les Églises les plus proches ont envoyé des évêques ; d’autres Églises, des anciens[b] et des diacres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Nom » est employé ici de manière absolue et révérencielle pour désigner le nom divin.
    reason: Éclairer un usage ancien qui pourrait sembler incomplet au lecteur moderne sans résoudre plus précisément son référent.
  - marker: b
    text: 'Ou : « presbytres ».'
    reason: Signaler l’équivalent ecclésiastique traditionnel du terme rendu par « anciens ».
lexical_decisions:
- source_word: tender sympathy
  choice: tendre compassion
  rationale: Rend l’affection compatissante exprimée par le témoin anglais dans un français naturel et digne, sans la réduire à une simple sympathie.
- source_word: hath peace
  choice: jouit de la paix
  rationale: Expression française idiomatique qui conserve l’idée d’un état de paix retrouvé par l’Église d’Antioche.
- source_word: God’s ambassador
  choice: ambassadeur de Dieu
  rationale: Conserve l’image forte d’une mission de représentation confiée par Dieu.
- source_word: ministration
  choice: service
  rationale: Terme courant et ecclésialement neutre, qui exprime une mission accomplie au bénéfice de l’Église.
- source_word: presbyters
  choice: anciens
  rationale: Choix français transparent et enraciné dans le vocabulaire chrétien ancien, avec une note signalant l’autre rendu traditionnel.
theological_decisions:
- issue: Référence au « Nom »
  choice: le Nom
  alternative: son nom
  rationale: La majuscule préserve l’emploi absolu et révérenciel transmis par le témoin, sans expliciter davantage l’identité du référent.
- issue: Nature de la paix à Antioche
  choice: jouit de la paix
  alternative: est en paix
  rationale: La formulation maintient l’ambiguïté entre cessation de troubles externes et réconciliation interne.
- issue: Glorification des destinataires
  choice: vous serez glorifiés
  alternative: vous recevrez de l’honneur
  rationale: Le rendu littéral conserve la force et la possible portée théologique de l’énoncé sans l’atténuer.
- issue: Titres ministériels
  choice: évêques, anciens et diacres
  alternative: évêques, presbytres et diacres
  rationale: « Anciens » reste accessible au lectorat moderne, tandis que la note conserve le terme ecclésiastique traditionnel possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement allégée tout en conservant les rapports logiques, les titres ecclésiaux et les tensions du témoin. Projet nécessairement provisoire, fondé sur le témoin anglais public fourni, puisque la révision directe du grec de la recension moyenne reste en attente.
