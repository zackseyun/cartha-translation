base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: fr
  text: 'Je me donne entièrement pour vous[a] et pour ceux que vous avez envoyés à Smyrne pour l’honneur de Dieu. C’est aussi de là que je vous écris, en rendant grâce au Seigneur. J’aime Polycarpe comme je vous aime, vous aussi. Souvenez-vous de moi, comme je souhaite que Jésus-Christ se souvienne aussi de vous.


    Priez pour l’Église qui est en Syrie, d’où l’on m’emmène prisonnier à Rome — moi qui suis le tout dernier des fidèles de là-bas —, puisque j’ai été jugé digne d’être trouvé pour l’honneur de Dieu[b]. Portez-vous bien en Dieu le Père et en Jésus-Christ, notre espérance commune.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « Je me donne entièrement pour vous » est une formule de dévouement très forte, qui peut aller jusqu’à l’idée de donner sa vie pour quelqu’un. La formulation exacte devra être vérifiée directement sur le grec.
    reason: Signaler la force et l’ambiguïté de la formule initiale, le dossier fourni reposant encore sur un témoin anglais.
  - marker: b
    text: L’expression « être trouvé pour l’honneur de Dieu » suit de près le témoin disponible; son sens précis demeure difficile et devra être contrôlé sur le texte grec.
    reason: Éviter de résoudre silencieusement une expression incertaine en l’absence de révision directe de la langue source.
lexical_decisions:
- source_word: ἀντίψυχον (probable Greek behind “I am devoted”)
  choice: Je me donne entièrement pour vous
  rationale: Cette formule exprime le dévouement personnel, voire le don de sa vie, sans réduire le terme à une simple affection. La révision directe du grec reste à confirmer.
- source_word: μνημονεύετε / μνημονεύσαι (probable)
  choice: Souvenez-vous de moi / se souvienne de vous
  rationale: Le parallélisme est conservé, ainsi que la portée relationnelle et potentiellement favorable du souvenir du Christ.
- source_word: ἐκκλησία
  choice: Église
  rationale: Le terme désigne ici la communauté chrétienne située en Syrie; la majuscule suit l’usage français courant pour cette réalité ecclésiale.
- source_word: δέσμιος / δεδεμένος (probable expression behind “a prisoner”)
  choice: prisonnier
  rationale: Rend clairement la condition d’Ignace conduit sous garde vers Rome.
- source_word: κοινὴ ἐλπίς
  choice: notre espérance commune
  rationale: Préserve l’idée d’une espérance partagée par Ignace et ses destinataires, centrée sur Jésus-Christ.
theological_decisions:
- issue: Force de la formule initiale de dévouement
  choice: Je me donne entièrement pour vous
  alternative: Je suis dévoué à vous
  rationale: La formulation retenue laisse entendre le don personnel intense propre au langage d’Ignace, sans affirmer explicitement une doctrine sacrificielle que le témoin anglais ne suffit pas à établir.
- issue: Le souvenir accordé par Jésus-Christ
  choice: que Jésus-Christ se souvienne aussi de vous
  alternative: que Jésus-Christ se rappelle aussi de vous
  rationale: La tournure conserve la tension entre souvenir relationnel, faveur et intercession sans l’expliquer doctrinalement.
- issue: Expression obscure liée à l’honneur de Dieu
  choice: être trouvé pour l’honneur de Dieu
  alternative: être reconnu digne de contribuer à l’honneur de Dieu
  rationale: La traduction garde la formulation difficile du témoin au lieu d’en préciser artificiellement le sens avant une vérification directe du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement collectif évité grâce aux formes françaises non marquées; syntaxe légèrement solennelle adaptée à une lettre chrétienne ancienne. Le texte est provisoire, car les données fournies indiquent qu’une révision directe de la tradition grecque de la recension moyenne reste à faire.
