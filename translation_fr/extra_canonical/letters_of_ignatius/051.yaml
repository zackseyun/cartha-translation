base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: fr
  text: 'Je vous salue depuis Smyrne, avec les Églises de Dieu qui sont ici avec moi et qui m’ont réconforté de toutes les manières, dans mon corps comme dans mon esprit.


    Mes chaînes, que je porte à cause de Jésus-Christ, vous adressent leur exhortation, tandis que je supplie qu’il me soit donné d’atteindre Dieu : demeurez dans la concorde et priez les uns avec les autres. Il convient à chacun de vous, et tout particulièrement aux anciens, de réconforter l’âme de votre évêque, pour l’honneur du Père [et pour l’honneur] de Jésus-Christ et des apôtres.[a]


    Je vous prie de m’écouter avec amour, afin que cette lettre ne fasse pas de moi un témoin contre vous. Vous aussi, priez pour moi, car j’ai besoin de votre amour dans la miséricorde de Dieu, afin qu’il me soit accordé d’obtenir le sort que je désire ardemment atteindre et que je ne sois pas trouvé désapprouvé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et pour l’honneur » sont placés entre crochets dans le témoin utilisé, qui signale ainsi une restitution ou une incertitude du texte.
    reason: Rendre visible au lecteur la portée des crochets conservés dans le corps du texte.
lexical_decisions:
- source_word: churches of God
  choice: Églises de Dieu
  rationale: Conserve la désignation ecclésiale et le pluriel du témoin, dans une formulation française naturelle.
- source_word: refreshed
  choice: réconforté
  rationale: Exprime le soutien reçu tant physiquement que spirituellement sans réduire le terme à un simple repos corporel.
- source_word: bonds
  choice: chaînes
  rationale: Rend concrètement la captivité d’Ignace et préserve la personnification selon laquelle ses chaînes exhortent les destinataires.
- source_word: attain unto God
  choice: atteindre Dieu
  rationale: Maintient la formulation forte et concise, ainsi que son orientation martyrologique probable, sans l’expliciter dans le texte.
- source_word: presbyters
  choice: anciens
  rationale: Terme français compréhensible qui conserve la fonction ecclésiale du grec presbyteroi sans importer automatiquement un titre confessionnel moderne.
- source_word: bishop
  choice: évêque
  rationale: Équivalent français historique et usuel du titre episkopos dans le contexte ignatien.
- source_word: lot
  choice: sort
  rationale: Préserve l’image d’une part ou destinée attribuée, sans préciser au-delà du témoin qu’il s’agit du martyre.
- source_word: reprobate
  choice: désapprouvé
  rationale: Conserve l’idée d’échouer à l’épreuve ou de ne pas être reconnu apte, sans surcharger le passage d’un sens dogmatique ultérieur.
theological_decisions:
- issue: Sens de « atteindre Dieu »
  choice: Formulation conservée littéralement
  alternative: parvenir auprès de Dieu / mourir en martyr
  rationale: Le contexte suggère le martyre et l’union avec Dieu, mais l’expression doit garder sa densité et ne pas être réduite à une paraphrase interprétative.
- issue: Honneur rendu au Père, à Jésus-Christ et aux apôtres
  choice: Maintien des crochets autour de « et pour l’honneur »
  alternative: Supprimer les crochets et intégrer les mots au texte courant
  rationale: Les crochets du témoin signalent une restauration ou une incertitude textuelle; ils sont conservés et expliqués en note plutôt que silencieusement résolus.
- issue: Exhortation attribuée aux chaînes
  choice: Personnification maintenue
  alternative: Je vous exhorte par mes chaînes
  rationale: La tournure frappante du passage donne aux chaînes elles-mêmes une valeur de témoignage et d’exhortation.
- issue: « témoin contre vous »
  choice: Conserver la dimension judiciaire
  alternative: afin que ma lettre ne vous condamne pas
  rationale: La formulation préserve la tension entre avertissement pastoral et témoignage à charge sans transformer Ignace lui-même en juge.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les images et tensions du témoin tout en évitant ses archaïsmes. Ce projet demeure provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne reste à effectuer.
