review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le projet rend globalement bien la syntaxe et le sens de la recension moyenne, y compris le participe παρών dans la dernière proposition. Toutefois, « sa mort, que certains nient » réduit indûment le neutre ὅ à « mort »; « pour lequel nous persévérons » transforme διὰ τοῦτο (« pour cette raison »); et la transition conditionnelle vers la question rhétorique est effacée.
  naturalness: Le français est généralement clair et de registre approprié. « N’observant plus le sabbat », « a aussi surgi » et « nous endurons avec patience » sont plus précis et naturels dans ce contexte. Une nouvelle phrase avant « S’il en est ainsi » rend la période lisible tout en conservant l’articulation argumentative du texte.
  terminology: « Jour du Seigneur » est le rendu traditionnel et contextuellement le plus solide de κατὰ κυριακήν, en contraste avec le sabbat; la note doit simplement indiquer que « jour » est implicite en grec. « Jésus Christ » et « relevés d’entre les morts » conviennent. La note sur la corruption du témoin anglais est justifiée, mais doit citer plus exactement la valeur de παρών.
  issues:
  - severity: medium
    issue: Antécédent de « que certains nient » restreint à la mort
    rationale: Le relatif grec neutre ὅ ne correspond pas grammaticalement à « mort » (θάνατος, masculin) et vise plus naturellement l’assertion précédente, ou son contenu. « Ce que certains nient » préserve cette portée sans trancher davantage.
  - severity: medium
    issue: διὰ τοῦτο rendu « pour lequel »
    rationale: La locution signifie « pour cette raison / c’est pourquoi », et non « pour lequel », qui fait du mystère l’antécédent direct et modifie la relation logique.
  - severity: medium
    issue: La condition introductive de la question est omise
    rationale: Après l’argument précédent, le texte pose explicitement une question conditionnelle (« si cela est ainsi » dans le témoin anglais; πῶς… dans le grec). La rétablir conserve la progression rhétorique.
  - severity: low
    issue: « célébrant le sabbat » et « persévérons » sont moins directs
    rationale: σαββατίζοντες désigne l’observance du sabbat; ὑπομένομεν exprime l’endurance. Les rendus proposés sont plus proches du texte sans changer le registre.
  - severity: low
    issue: 'Note a: « [réalité] du Seigneur » n’est pas un littéral défendable'
    rationale: κυριακήν est un adjectif féminin substantivé; dans ce contexte, l’ellipse de « jour » est le point pertinent. Introduire « réalité » donne une paraphrase non signalée comme telle.
