base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: fr
  text: 'Si donc ceux qui avaient vécu selon les anciennes pratiques sont parvenus à une espérance nouvelle, n’observant plus le sabbat, mais vivant selon le jour du Seigneur[a] — jour où notre vie a aussi surgi par lui et par sa mort, ce que certains nient —, mystère par lequel nous avons reçu la foi, et c’est pour cela que nous endurons avec patience, afin d’être trouvés disciples de Jésus Christ, notre seul maître.


    S’il en est ainsi, comment pourrions-nous vivre sans lui ? Car même les prophètes, étant ses disciples, l’attendaient par l’Esprit comme leur maître. C’est pourquoi celui qu’ils attendaient à juste titre, étant venu, les a relevés d’entre les morts.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « vivant selon la [journée] du Seigneur ». Le nom « jour » est implicite; le contraste avec l’observance du sabbat soutient le rendu traditionnel « jour du Seigneur ».'
    reason: Signaler l’ellipse du grec sans présenter comme littérale une paraphrase telle que « réalité du Seigneur ».
  - marker: b
    text: Le témoin anglais fourni est ici manifestement corrompu (« when he one »). Dans la recension moyenne grecque, le participe παρών signifie « étant présent »; dans ce contexte, « étant venu » en rend naturellement la valeur avant « les a relevés d’entre les morts ».
    reason: Rendre compte de la divergence avec le témoin anglais et expliquer sobrement la correction fondée sur le grec.
lexical_decisions:
- source_word: σαββατίζοντες
  choice: célébrant le sabbat
  rationale: Le verbe signifie observer ou pratiquer le sabbat. « Célébrer le sabbat » est naturel en français et conserve ici la dimension concrète de cette observance.
- source_word: κατὰ κυριακὴν ζῶντες
  choice: vivant selon le jour du Seigneur
  rationale: La formule grecque est concise et l’adjectif κυριακήν est substantivé. L’interprétation traditionnelle « jour du Seigneur » convient au contraste avec le sabbat, tout en méritant une note en raison de l’ellipse et de l’ambiguïté possibles.
- source_word: ἀνέτειλεν
  choice: s’est aussi levée
  rationale: Le verbe évoque le lever ou le surgissement, notamment celui d’un astre. Cette formulation préserve l’image appliquée à « notre vie » sans la réduire explicitement à « commencer » ou à « ressusciter ».
- source_word: ἐλάβομεν τὸ πιστεύειν
  choice: nous avons reçu la foi
  rationale: Cette expression désigne littéralement le fait d’avoir reçu de croire. « Nous avons reçu la foi » reste idiomatique et conserve l’idée de réception.
- source_word: ὑπομένομεν
  choice: nous persévérons
  rationale: Le verbe peut exprimer le fait d’endurer ou de tenir ferme. « Persévérons » convient au contexte de fidélité éprouvée sans ajouter expressément une persécution non nommée.
- source_word: παρὼν
  choice: est venu
  rationale: Le participe signifie littéralement « étant présent » ou « étant arrivé ». « Est venu » rend naturellement l’entrée en présence du Christ et rétablit le sens que le témoin anglais corrompu (« when he one ») ne transmet pas correctement.
- source_word: ἤγειρεν αὐτοὺς ἐκ νεκρῶν
  choice: les a relevés d’entre les morts
  rationale: Le verbe ἐγείρω signifie relever ou ressusciter. « Relevés d’entre les morts » conserve l’image verbale et la portée résurrectionnelle.
theological_decisions:
- issue: Sens de « vivre selon la κυριακή »
  choice: jour du Seigneur
  alternative: vie du Seigneur / selon le Seigneur
  rationale: Le contraste immédiat avec l’observance du sabbat favorise une référence au jour du Seigneur. Toutefois, comme le nom « jour » est sous-entendu dans la formulation grecque transmise, l’autre lecture n’est pas entièrement effacée et est signalée en note.
- issue: Référent de « par lui et par sa mort »
  choice: la vie de la communauté s’est levée par le Christ et par sa mort
  alternative: le jour du Seigneur a pris naissance par le Christ et sa mort
  rationale: Le sujet grammatical est « notre vie ». La traduction garde cette syntaxe, ainsi que la tension entre vie et mort, sans expliciter davantage le mécanisme théologique.
- issue: Les prophètes relevés d’entre les morts
  choice: affirmation conservée telle quelle
  alternative: interpréter figurativement leur relèvement
  rationale: Le texte attribue au Christ venu l’action de relever les prophètes d’entre les morts. La traduction ne décide pas si l’énoncé doit être lu littéralement, typologiquement ou autrement.
translation_notes:
  register: Français international moderne, digne et lisible. La longue période argumentative d’Ignace est conservée, mais ponctuée pour rester compréhensible. « Jésus Christ » est écrit sans trait d’union selon un usage éditorial contemporain. Cette proposition repose sur la formulation grecque couramment attestée de la recension moyenne ; une collation critique directe des manuscrits et éditions reste souhaitable.
