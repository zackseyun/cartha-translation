source:
  text: 'If then those who had walked in ancient practices attained unto newness of hope, no longer observing Sabbaths but fashioning their lives after the Lord''s day, on which our life also arose through Him and through His death which some men deny--a mystery whereby we attained unto belief, and for this cause we endure patiently, that we may be found disciples of Jesus Christ our only teacher--


    if this be so, how shall we be able to live apart from Him? seeing that even the prophets, being His disciples, were expecting Him as their teacher through the Spirit. And for this cause He whom they rightly awaited, when He one, raised them from the dead.'
