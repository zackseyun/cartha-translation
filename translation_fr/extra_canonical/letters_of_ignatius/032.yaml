revisions:
- from: Si donc ceux qui avaient vécu selon les anciennes pratiques sont parvenus à une espérance nouvelle, ne célébrant plus le sabbat, mais vivant selon le jour du Seigneur[a] — jour où notre vie s’est aussi levée par lui et par sa mort, que certains nient —, mystère par lequel nous avons reçu la foi et pour lequel nous persévérons, afin d’être reconnus comme disciples de Jésus Christ, notre seul maître, comment pourrions-nous vivre sans lui ? Même les prophètes, qui étaient ses disciples, l’attendaient par l’Esprit comme leur maître. C’est pourquoi celui qu’ils attendaient à juste titre est venu et les a relevés d’entre les morts.[b]
  to: 'Si donc ceux qui avaient vécu selon les anciennes pratiques sont parvenus à une espérance nouvelle, n’observant plus le sabbat, mais vivant selon le jour du Seigneur[a] — jour où notre vie a aussi surgi par lui et par sa mort, ce que certains nient —, mystère par lequel nous avons reçu la foi, et c’est pour cela que nous endurons avec patience, afin d’être trouvés disciples de Jésus Christ, notre seul maître.


    S’il en est ainsi, comment pourrions-nous vivre sans lui ? Car même les prophètes, étant ses disciples, l’attendaient par l’Esprit comme leur maître. C’est pourquoi celui qu’ils attendaient à juste titre, étant venu, les a relevés d’entre les morts.[b]'
  rationale: Le texte révisé maintient l’ambiguïté du relatif neutre après « sa mort », restitue la relation causale de διὰ τοῦτο et réintroduit l’articulation conditionnelle de l’argument. Il conserve la lecture traditionnelle de κυριακήν avec une note philologique plus exacte, sans imposer d’interprétation confessionnelle.
