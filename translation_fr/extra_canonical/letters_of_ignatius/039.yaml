base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: fr
  text: Ignace, appelé aussi Théophore, à l’Église aimée de Dieu, le Père de Jésus-Christ, à la sainte Église qui est à Tralles, en Asie, choisie et digne de Dieu, qui possède la paix dans la chair et dans l’esprit par la passion de Jésus-Christ, lui qui est notre espérance par notre résurrection qui nous conduit à lui[a]. Je la salue aussi dans la plénitude divine, à la manière des apôtres, et lui adresse mes salutations les plus abondantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction de cette proposition est incertaine dans le témoin utilisé. On peut aussi comprendre : « lui qui est notre espérance dans notre résurrection en lui ». Une vérification directe du grec reste nécessaire.'
    reason: Le dossier fourni repose sur un témoin anglais du domaine public et indique que la révision à partir du grec est encore en attente; la formulation doit donc préserver l’ambiguïté plutôt que la résoudre silencieusement.
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Conserve comme surnom traditionnel le nom grec translittéré, sans en imposer ici une interprétation (« porteur de Dieu » ou « porté par Dieu »).
- source_word: church
  choice: Église
  rationale: « Église » désigne naturellement la communauté chrétienne locale dans ce registre épistolaire et ecclésial.
- source_word: passion
  choice: passion
  rationale: Le terme français traditionnel exprime ici les souffrances et la mort de Jésus-Christ sans réduire la portée théologique de la formule.
- source_word: Divine plenitude
  choice: plénitude divine
  rationale: Traduction formellement proche qui préserve la densité et l’éventuelle ambiguïté de l’expression, faute de révision grecque directe.
- source_word: after the apostolic fashion
  choice: à la manière des apôtres
  rationale: Formulation française claire qui évite l’adjectif plus abstrait « apostolique » tout en conservant l’idée de conformité au modèle des apôtres.
theological_decisions:
- issue: Rapport entre le Christ, l’espérance, la résurrection et le mouvement « vers lui »
  choice: « lui qui est notre espérance par notre résurrection qui nous conduit à lui »
  alternative: « lui qui est notre espérance dans notre résurrection en lui »
  rationale: La syntaxe du témoin anglais est difficile et le contrôle direct du grec est signalé comme restant à faire. Le texte principal conserve donc le mouvement « vers lui » sans le transformer en simple union statique « en lui », et une note signale l’incertitude.
- issue: Paix « dans la chair et dans l’esprit »
  choice: Conserver les deux dimensions sans les opposer
  alternative: « paix du corps et de l’âme »
  rationale: « Chair » et « esprit » maintiennent la terminologie théologique du témoin et évitent d’importer une anthropologie dualiste plus précise.
translation_notes:
  register: Français international moderne, digne et épistolaire. La phrase longue du prologue est légèrement articulée pour rester lisible, tout en conservant son caractère solennel. Projet provisoire fondé sur le témoin anglais fourni; une collation directe avec la tradition grecque de la recension moyenne demeure requise.
