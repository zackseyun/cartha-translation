base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: fr
  text: 'Prêtez attention à l’évêque, afin que Dieu, lui aussi, vous prête attention. Je donnerais ma vie[a] pour ceux qui se soumettent à l’évêque, aux presbytres et aux diacres. Qu’il me soit accordé d’avoir part avec eux auprès de Dieu ! Peinez ensemble, luttez ensemble, courez ensemble, souffrez ensemble, reposez-vous ensemble, levez-vous ensemble, comme des intendants de Dieu, des membres de son conseil et ses serviteurs.


    Cherchez à plaire à celui sous les ordres de qui vous combattez et de qui vous recevrez aussi votre solde. Qu’aucun de vous ne soit trouvé déserteur. Que votre baptême demeure comme votre armure[b], votre foi comme votre casque, votre amour comme votre lance et votre persévérance comme votre équipement complet. Que vos œuvres soient les sommes que vous déposez, afin que vous receviez les fonds qui vous reviennent[c]. Usez donc de patience les uns envers les autres, avec douceur, comme Dieu en use envers vous. Puissé-je toujours trouver ma joie en vous !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « Je me livre en rançon pour eux » ou « je me dévoue pour eux ». Elle exprime ici un profond don de soi.'
    reason: Préserver la force et l’ambiguïté de l’idiome ἀντίψυχον.
  - marker: b
    text: 'Littéralement : « comme vos armes » ou « comme votre équipement militaire ».'
    reason: Le témoin anglais porte « bouclier », mais le grec ὅπλα a un sens plus large.
  - marker: c
    text: 'Le texte emploie ici des termes comptables empruntés au latin : les œuvres sont comparées à des dépôts dont les sommes correspondantes seront ensuite reçues.'
    reason: Rendre explicite une métaphore financière difficile à reproduire naturellement en français et éviter de la réduire à une formulation doctrinale.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: Je donnerais ma vie
  rationale: Cette formule ignatienne exprime un engagement personnel allant jusqu’au don de soi. La tournure française garde sa force sans imposer une théorie précise de substitution.
- source_word: πρεσβυτέροις
  choice: presbytres
  rationale: Le terme historique « presbytres » préserve la désignation ancienne sans l’assimiler entièrement à une fonction ecclésiale moderne particulière.
- source_word: πάρεδροι
  choice: membres de son conseil
  rationale: Le mot désigne ceux qui siègent auprès d’un responsable comme assistants ou conseillers. Cette formulation est plus intelligible aujourd’hui que « assesseurs », tout en conservant l’image administrative.
- source_word: ὑπηρέται
  choice: serviteurs
  rationale: Rend le service exercé sous l’autorité de Dieu sans surcharger le terme d’un sens ecclésiastique technique.
- source_word: ὅπλα
  choice: armure
  rationale: Le grec est pluriel et peut désigner les armes ou l’équipement militaire. « Armure » convient à la série casque, lance et équipement complet, tandis que « bouclier » est plus étroit que le terme source.
- source_word: ὑπομονή
  choice: persévérance
  rationale: Le mot évoque l’endurance constante dans l’épreuve. « Persévérance » est naturel et évite de le confondre avec μακροθυμία, rendu ensuite par « patience ».
- source_word: πανοπλία
  choice: équipement complet
  rationale: Désigne la panoplie entière du soldat, non la seule cuirasse. La traduction conserve la progression de l’image militaire.
- source_word: μακροθυμεῖτε
  choice: Usez de patience
  rationale: Exprime la patience durable envers autrui, avec une tournure française claire et digne.
theological_decisions:
- issue: Relation entre l’attention portée à l’évêque et celle que Dieu porte aux destinataires
  choice: « afin que Dieu, lui aussi, vous prête attention »
  alternative: « pour que Dieu veille aussi sur vous »
  rationale: La répétition verbale conserve le parallélisme et le lien exhortatif du texte sans définir plus précisément la nature de la réponse divine.
- issue: Portée de ἀντίψυχον
  choice: Formule personnelle de don de soi
  alternative: « Je suis une rançon pour ceux qui… »
  rationale: La traduction évite de transformer une expression affective et sacrificielle en affirmation technique sur l’expiation, tout en signalant l’ambiguïté en note.
- issue: Métaphore des dépôts et des sommes reçues
  choice: Conserver l’image financière
  alternative: Paraphraser comme récompense divine des bonnes œuvres
  rationale: Le texte juxtapose des termes comptables à l’image militaire. Garder cette métaphore préserve la tension entre œuvres déposées et réception future sans élaborer une doctrine du mérite.
- issue: « auprès de Dieu »
  choice: « avoir part avec eux auprès de Dieu »
  alternative: « partager leur sort en présence de Dieu »
  rationale: Cette formulation reste ouverte quant à la nature exacte de la communion ou de la destinée évoquée.
translation_notes:
  register: Français international moderne, digne et exhortatif. Les répétitions de « ensemble » sont maintenues pour reproduire l’insistance rhétorique du passage. Le vocabulaire militaire et comptable est conservé, mais formulé de façon compréhensible. « Presbytres » maintient la couleur historique du texte. Le dossier fourni indiquant qu’une révision directe du grec reste à achever, les choix ont été contrôlés autant que possible selon le texte grec usuel de la recension moyenne, et les points particulièrement sensibles sont signalés en note.
