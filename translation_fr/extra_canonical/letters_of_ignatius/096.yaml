review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « Je donnerais ma vie » introduit un conditionnel absent du grec et resserre trop ἀντίψυχον. La série militaire doit distinguer ὅπλα (« armes » au sens large) de πανοπλία (« équipement/armure complète »). La métaphore financière finale doit rester plus près de ses termes sans expliquer au-delà du texte.'
  naturalness: 'Le français est globalement fluide et le rythme exhortatif est bien rendu. Quelques formulations gagnent en précision et en naturel : « je me dévoue » plutôt qu’un conditionnel, « ceux qui servent comme soldats » pour l’image militaire, et « les montants qui vous sont dus » pour la conclusion comptable.'
  terminology: « Évêque », « presbytres » et « diacres » sont bien choisis. « Assesseurs » restitue plus directement πάρεδροι que « membres de son conseil », qui explicite indûment la relation. « Armes » et « armure complète » maintiennent la distinction des deux termes grecs.
  issues:
  - severity: medium
    issue: Conditionnel et sens de ἀντίψυχον
    rationale: « Je donnerais ma vie » est au conditionnel, alors que l’énoncé grec est affirmatif, et il ne représente qu’une possibilité interprétative de l’idiome. Une formule affirmative de dévouement, assortie d’une note, conserve mieux sa force et son ambiguïté.
  - severity: medium
    issue: Distinction de l’équipement militaire
    rationale: Le texte oppose ὅπλα, terme collectif pour les armes ou l’équipement, à πανοπλία, l’armement complet. Rendre le premier par « armure » et le second par « équipement complet » atténue cette distinction et rend la série moins cohérente.
  - severity: low
    issue: πάρεδροι rendu par « membres de son conseil »
    rationale: Cette expression interprète le terme comme une appartenance à un conseil déterminé. « Assesseurs » conserve l’idée d’assistants siégeant auprès de Dieu sans préciser davantage l’institution.
  - severity: low
    issue: Note financière trop assertive sur l’origine lexicale
    rationale: La mention d’« emprunts au latin » n’est pas nécessaire à la compréhension et risque de présenter comme certaine une caractérisation lexicale qui demande une discussion philologique. La note peut simplement expliciter l’image comptable.
  revised_text: 'Prêtez attention à l’évêque, afin que Dieu, lui aussi, vous prête attention. Je me dévoue[a] pour ceux qui se soumettent à l’évêque, aux presbytres et aux diacres. Qu’il me soit accordé d’avoir part avec eux auprès de Dieu ! Peinez ensemble, luttez ensemble, courez ensemble, souffrez ensemble, couchez-vous ensemble, levez-vous ensemble, comme intendants de Dieu, assesseurs et serviteurs.


    Cherchez à plaire au chef sous les ordres duquel vous servez comme soldats et de qui vous recevrez aussi votre solde. Qu’aucun de vous ne soit trouvé déserteur. Que votre baptême soit pour vous vos armes[b], votre foi votre casque, votre amour votre lance et votre persévérance votre armure complète. Que vos œuvres soient vos dépôts, afin que vous receviez les montants qui vous sont dus[c]. Usez donc de patience les uns envers les autres, avec douceur, comme Dieu en use envers vous. Puissé-je toujours trouver ma joie en vous !'
  revised_footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « Je suis une rançon pour eux » ou « Je réponds de leur vie ». Elle exprime ici un profond dévouement personnel.'
    reason: Préserver la force et l’ambiguïté de l’idiome ἀντίψυχον sans introduire un conditionnel absent du texte.
  - marker: b
    text: Le grec emploie un terme collectif qui peut désigner les « armes » ou l’équipement militaire en général.
    reason: Distinguer ὅπλα de l’« armure complète » mentionnée ensuite.
  - marker: c
    text: 'Le texte emploie une image comptable : les œuvres sont comparées à des dépôts, suivis de la réception des montants correspondants.'
    reason: Rendre intelligible la métaphore financière sans la transformer en formulation doctrinale.
  revision_rationale: 'La révision corrige un conditionnel non justifié, restitue plus exactement l’ambiguïté de ἀντίψυχον et maintient les distinctions du vocabulaire militaire grec. Elle allège aussi deux interprétations explicatives : πάρεδροι est rendu par « assesseurs », et la note sur les dépôts se limite à la métaphore effectivement présente. Le ton exhortatif, les répétitions et les désignations historiques sont conservés.'
