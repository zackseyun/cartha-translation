source:
  text: 'Not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith which is the flesh of the Lord, and in love which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for Woe unto him through whom My name is vainly blasphemed before some.'
