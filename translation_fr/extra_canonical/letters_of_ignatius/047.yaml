base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: fr
  text: 'Ce n’est pas que j’aie eu connaissance d’une telle chose parmi vous. Mais je veille d’avance sur vous, mes bien-aimés, car je prévois les pièges du diable. Armez-vous donc de douceur et reprenez force dans la foi, qui est la chair du Seigneur, et dans l’amour, qui est le sang de Jésus-Christ.


    Que personne parmi vous ne garde rancune à son prochain. Ne donnez aux non-Juifs aucune occasion de mal parler, de peur qu’à cause de quelques insensés la multitude qui vit selon Dieu ne soit blasphémée. Car : « Malheur à celui par qui mon nom est blasphémé en vain devant certains ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public fourni. La formulation exacte de la citation finale, notamment « en vain » et « devant certains », devra être vérifiée directement dans la tradition manuscrite grecque de la recension moyenne.
    reason: La révision directe du grec est signalée comme restant à faire, et la syntaxe de la citation finale est inhabituelle.
lexical_decisions:
- source_word: keep watch over you betimes
  choice: je veille d’avance sur vous
  rationale: Rend l’idée d’une vigilance préventive, motivée par les dangers qu’Ignace discerne à l’avance.
- source_word: arm yourselves with gentleness
  choice: armez-vous donc de douceur
  rationale: Conserve le paradoxe martial de l’image tout en employant le terme éthique naturel « douceur ».
- source_word: recover yourselves
  choice: reprenez force
  rationale: Exprime le rétablissement ou l’affermissement suggéré par le témoin anglais sans imposer une interprétation médicale trop précise.
- source_word: faith which is the flesh of the Lord
  choice: la foi, qui est la chair du Seigneur
  rationale: Préserve l’identification métaphorique forte et sa tension théologique, sans l’atténuer en simple comparaison.
- source_word: love which is the blood of Jesus Christ
  choice: l’amour, qui est le sang de Jésus-Christ
  rationale: Maintient le parallélisme sacramentel et corporel du passage.
- source_word: Gentiles
  choice: non-Juifs
  rationale: Choix moderne et immédiatement intelligible pour désigner les nations extérieures au peuple juif, tout en évitant le caractère aujourd’hui ambigu de « païens ».
- source_word: godly multitude
  choice: la multitude qui vit selon Dieu
  rationale: Restitue le sens religieux et éthique sans employer l’adjectif vieilli « pieuse » comme désignation collective.
- source_word: bear a grudge
  choice: garde rancune
  rationale: Expression française courante qui rend directement l’hostilité persistante envers le prochain.
theological_decisions:
- issue: Rapport entre la foi et la chair du Seigneur, puis entre l’amour et le sang de Jésus-Christ
  choice: 'Conserver les formulations d’identité : « qui est »'
  alternative: Interpréter par « symbolisée par », « nourrie par » ou « comparable à »
  rationale: Le témoin présente des identifications métaphoriques abruptes. Les expliquer dans le corps du texte résoudrait indûment leur portée théologique et possiblement sacramentelle.
- issue: Sujet blasphémé dans « la multitude qui vit selon Dieu ne soit blasphémée »
  choice: Conserver la construction où la communauté est grammaticalement l’objet de la diffamation
  alternative: Reformuler comme si Dieu ou le nom de Dieu seul était blasphémé
  rationale: La première proposition du témoin vise directement la réputation de la communauté; la citation suivante déplace explicitement l’attention vers « mon nom ».
- issue: 'Voix de la citation finale : « mon nom »'
  choice: Maintenir la première personne sans identifier explicitement le locuteur
  alternative: Ajouter « dit Dieu » ou remplacer par « le nom de Dieu »
  rationale: L’identité du locuteur est implicite dans la citation transmise; l’expliciter irait au-delà de la preuve fournie.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement collectif rendu par des impératifs au pluriel. Les métaphores fortes et la construction difficile de la citation finale sont conservées plutôt que lissées. Projet nécessairement provisoire, puisque seul un témoin anglais du grec a été fourni et que la révision de la langue source reste en attente.
