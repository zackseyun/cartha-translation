review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l'avertissement préventif, les métaphores « foi/chair » et « amour/sang », ainsi que l'interdiction de rancune. Toutefois, « ne donnez aux non-Juifs aucune occasion de mal parler » ajoute au témoin l'idée explicite de parler mal, alors que « Give no occasion to the Gentiles » ne précise pas l'objet de l'occasion. La citation finale demeure provisoire, la révision directe du grec étant signalée comme en attente.
  naturalness: Le français est globalement naturel et de registre approprié. « Je veille d'avance sur vous » est toutefois un peu lourd et moins idiomatique que « je vous mets en garde à l'avance » pour l'avertissement préventif. « Ne donnez aucune occasion aux non-Juifs » est à la fois plus naturel et plus fidèle.
  terminology: « Non-Juifs » est compréhensible en français international, sans introduire la connotation historique de « païens ». « Douceur », « chair », « sang », « Seigneur » et « Jésus-Christ » préservent convenablement le registre et les termes théologiques du témoin. La première personne de la citation ne doit pas être explicitée.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « aucune occasion de mal parler »
    rationale: Le témoin anglais dit seulement « Give no occasion to the Gentiles ». Le blasphème est exprimé dans la proposition finale; l'ajout « de mal parler » anticipe et resserre indûment le sens.
  - severity: low
    issue: « Je veille d’avance sur vous » est une formulation peu idiomatique et légèrement imprécise
    rationale: Dans ce contexte d'exhortation, « je vous mets en garde à l'avance » rend plus directement la vigilance préventive sans modifier le sens.
  - severity: low
    issue: Ancrage de note final
    rationale: La note porte sur la citation finale entière; son appel doit donc suivre le guillemet fermant, après la ponctuation de la citation.
  revised_text: 'Ce n’est pas que j’aie eu connaissance d’une telle chose parmi vous. Mais je vous mets en garde à l’avance, mes bien-aimés, car je prévois les pièges du diable. Armez-vous donc de douceur et reprenez force dans la foi, qui est la chair du Seigneur, et dans l’amour, qui est le sang de Jésus-Christ.


    Que personne parmi vous ne garde rancune à son prochain. Ne donnez aucune occasion aux non-Juifs, de peur qu’à cause de quelques insensés la multitude qui vit selon Dieu ne soit blasphémée. Car : « Malheur à celui par qui mon nom est blasphémé en vain devant certains ! »[a]'
  revised_footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public fourni. La formulation exacte de la citation finale, notamment « en vain » et « devant certains », devra être vérifiée directement dans la tradition manuscrite grecque de la recension moyenne.
    reason: La révision directe du grec est signalée comme restant à faire, et la syntaxe de la citation finale est inhabituelle.
