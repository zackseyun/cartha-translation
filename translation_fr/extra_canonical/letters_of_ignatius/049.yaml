revisions:
- from: Mais si, comme le disent certaines personnes sans Dieu, c’est-à-dire incrédules, il n’a souffert qu’en apparence — elles qui ne sont elles-mêmes qu’apparence —, pourquoi suis-je enchaîné ? Et pourquoi désiré-je aussi combattre contre les bêtes sauvages ? Alors, je meurs pour rien. Dès lors, je rends un faux témoignage contre le Seigneur.
  to: Mais si, comme le disent certaines personnes sans Dieu, c’est-à-dire incrédules, il n’a souffert qu’en apparence — elles qui ne sont elles-mêmes qu’apparence —, pourquoi suis-je enchaîné ? Et pourquoi est-ce que je désire, moi aussi, combattre contre les bêtes sauvages ? C’est donc en vain que je meurs. Je porte donc un faux témoignage contre le Seigneur.
  rationale: Révision limitée à la syntaxe et à l’idiomaticité françaises. Elle préserve l’ambiguïté polémique de « elles qui ne sont elles-mêmes qu’apparence », ainsi que la force argumentative et la terminologie du témoin anglais. Aucune note n’est nécessaire pour ce bref passage; la vérification directe du grec reste signalée comme pending dans le dossier source.
