base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: fr
  text: Mais si, comme le disent certaines personnes sans Dieu, c’est-à-dire incrédules, il n’a souffert qu’en apparence — elles qui ne sont elles-mêmes qu’apparence —, pourquoi suis-je enchaîné ? Et pourquoi est-ce que je désire, moi aussi, combattre contre les bêtes sauvages ? C’est donc en vain que je meurs. Je porte donc un faux témoignage contre le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless
  choice: sans Dieu
  rationale: Expression française naturelle qui conserve ici la qualification religieuse forte, immédiatement explicitée par « incrédules ».
- source_word: suffered only in semblance
  choice: n’a souffert qu’en apparence
  rationale: Rend clairement l’affirmation docète sans ajouter d’explication théologique absente du témoin.
- source_word: being themselves mere semblance
  choice: elles qui ne sont elles-mêmes qu’apparence
  rationale: Préserve le jeu polémique sur l’apparence et son caractère quelque peu énigmatique, sans le résoudre.
- source_word: in bonds
  choice: enchaîné
  rationale: Formulation actuelle et concrète pour la captivité d’Ignace.
- source_word: fight with wild beasts
  choice: combattre contre les bêtes sauvages
  rationale: Conserve l’image explicite de l’affrontement dans l’arène.
- source_word: I lie against the Lord
  choice: je rends un faux témoignage contre le Seigneur
  rationale: Exprime naturellement l’idée d’une affirmation mensongère portant atteinte à la vérité concernant le Seigneur, tout en gardant la préposition polémique « contre ».
theological_decisions:
- issue: Réalité de la souffrance du Christ
  choice: Conserver l’opposition entre souffrance réelle et souffrance seulement apparente
  alternative: Expliciter qu’il s’agit du corps humain réel de Jésus
  rationale: Le passage combat une conception apparente de la Passion, mais le témoin fourni ne développe pas ici une doctrine plus complète de l’incarnation.
- issue: Sens de « elles-mêmes ne sont qu’apparence »
  choice: Maintenir la formule paradoxale
  alternative: Interpréter comme « leur existence est illusoire » ou « ce ne sont que des imposteurs »
  rationale: La tournure est rhétorique et ambiguë; la traduction ne doit pas imposer une interprétation unique.
- issue: Mensonge contre le Seigneur
  choice: « je rends un faux témoignage contre le Seigneur »
  alternative: « je mens au sujet du Seigneur »
  rationale: Le choix retenu conserve la force de « contre » et le lien logique avec le témoignage d’Ignace rendu par ses chaînes et sa mort.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe rhétorique qui conserve l’enchaînement serré des questions et des conclusions. Aucun marqueur de note n’est nécessaire. Le texte demeure provisoire, car le dossier précise qu’une vérification directe du grec de la recension moyenne reste à effectuer.
