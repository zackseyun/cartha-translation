base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: fr
  text: 'Quant à Philon, le diacre de Cilicie, homme dont on rend un bon témoignage, il me sert maintenant encore dans la parole de Dieu, avec Rhaius Agathopous, un élu qui me suit depuis la Syrie après avoir dit adieu à la vie présente. Tous deux rendent aussi témoignage en votre faveur. Pour ma part, je remercie Dieu à votre sujet parce que vous les avez accueillis, tout comme j’ai confiance que le Seigneur vous accueillera. Quant à ceux qui les ont traités sans honneur, puissent-ils être rachetés par la grâce de Jésus-Christ.


    L’amour des frères et sœurs qui sont à Troas vous salue. C’est de là que je vous écris par l’intermédiaire de Burrhus, que les Éphésiens et les Smyrniotes ont envoyé avec moi pour m’honorer. Le Seigneur les honorera, lui, Jésus-Christ, en qui ils espèrent dans la chair, l’âme et l’esprit, par la foi, l’amour et la concorde. Portez-vous bien en Jésus-Christ, notre commune espérance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deacon
  choice: diacre
  rationale: Terme ecclésial français courant, qui conserve le titre transmis par le témoin sans en préciser davantage les fonctions.
- source_word: ministereth to me in the word of God
  choice: me sert maintenant encore dans la parole de Dieu
  rationale: « Servir » préserve le champ du ministère sans alourdir la phrase; « dans la parole de Dieu » maintient la formulation et son possible sens de service lié à la proclamation.
- source_word: an elect one
  choice: un élu
  rationale: Conserve la qualification théologique forte et son ambiguïté, sans la réduire à « choisi comme compagnon ».
- source_word: having bidden farewell to this present life
  choice: après avoir dit adieu à la vie présente
  rationale: Reproduit l’image radicale du détachement envers la vie actuelle sans l’interpréter comme une mort littérale.
- source_word: bear witness to you
  choice: rendent aussi témoignage en votre faveur
  rationale: Dans ce contexte, la préposition paraît désigner un témoignage favorable concernant les destinataires; la formulation française évite l’ambiguïté artificielle de « témoignent à vous ».
- source_word: treated them with dishonor
  choice: les ont traités sans honneur
  rationale: Rendu proche de la formulation transmise, plus large que « insultés » ou « méprisés ».
- source_word: the love of the brethren
  choice: l’amour des frères et sœurs
  rationale: Exprime naturellement en français moderne la communauté croyante visée par le masculin collectif ancien.
- source_word: by the hand of Burrhus
  choice: par l’intermédiaire de Burrhus
  rationale: Restitue idiomatiquement l’idée que Burrhus porte ou transmet la lettre.
- source_word: in flesh and soul and spirit
  choice: dans la chair, l’âme et l’esprit
  rationale: Conserve la triade anthropologique sans imposer une théorie précise de la constitution humaine.
- source_word: concord
  choice: concorde
  rationale: Terme digne et intelligible qui exprime l’unité harmonieuse de la communauté.
theological_decisions:
- issue: Le titre « élu » appliqué à Rhaius Agathopous
  choice: Conserver « un élu »
  alternative: « un homme choisi »
  rationale: 'Le témoin laisse ouverte la portée du terme: élection divine, qualité chrétienne ou choix particulier. « Élu » préserve cette tension.'
- issue: La demande concernant ceux qui ont déshonoré les envoyés
  choice: « puissent-ils être rachetés »
  alternative: « puissent-ils être délivrés »
  rationale: « Rachetés » garde la teneur sotériologique du témoin et ne transforme pas la phrase en condamnation.
- issue: Identification du Seigneur à Jésus-Christ
  choice: « Le Seigneur les honorera, lui, Jésus-Christ »
  alternative: « Le Seigneur les honorera, c’est-à-dire Jésus-Christ »
  rationale: L’apposition est maintenue sans développer une explication doctrinale absente du passage.
- issue: Espérance « dans la chair, l’âme et l’esprit »
  choice: Conserver les trois termes dans leur ordre
  alternative: Paraphraser par « de tout leur être »
  rationale: La paraphrase serait plus fluide, mais effacerait une formulation anthropologique et théologique significative.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe a été clarifiée, notamment en séparant le témoignage des deux compagnons de l’action de grâce d’Ignace. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est fournie. Le brouillon demeure nécessairement provisoire: les données fournies signalent qu’une vérification directe du grec de la recension moyenne reste à faire; les décisions sont donc fondées sur le témoin anglais public indiqué, avec prudence devant ses ambiguïtés.'
