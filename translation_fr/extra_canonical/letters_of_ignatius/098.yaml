    issue: « Ainsi, vous recevrez la gloire »
    rationale: 'Le verbe grec δοξασθῇς est au singulier et vise Polycarpe : « afin que tu sois/seras glorifié ». « Vous » est donc un changement de destinataire.'
  - severity: medium
    issue: « Polycarpe, qui l’enverra »
    rationale: 'Le participe grec est présent : Polycarpe est celui qui l’envoie, non celui qui l’enverra.'
  - severity: medium
    issue: « car cela est digne de toi »
    rationale: La construction grecque signifie « car tu en es digne »; elle qualifie Polycarpe, non l’action.
  - severity: low
    issue: Note a fondée sur une ambiguïté inexistante dans le grec accessible
    rationale: La note conserve une lecture erronée provenant de la formulation défectueuse du témoin anglais. Elle doit être supprimée.
