  naturalness: Le français du projet est globalement clair et d’un registre approprié. Les corrections rétablissent cependant des référents plus nets et évitent « recevoir la gloire », qui affaiblissait le singulier passif du texte.
  terminology: « Églises », « pensée de Dieu », « messagers », « maisonnée » et « supervision » sont retenus. « Supervision de Dieu » demeure une traduction volontairement non confessionnalisante de ἐπισκοπή; une note brève indique son champ sémantique sans imposer « épiscopat ».
