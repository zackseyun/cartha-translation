revisions:
- from: 'Comme je n’ai pas pu écrire à toutes les Églises, parce que j’ai dû prendre soudainement la mer de Troas à Néapolis, conformément à la volonté divine, tu écriras aux Églises qui sont plus loin, toi qui possèdes la pensée de Dieu, afin qu’elles fassent elles aussi la même chose : que celles qui le peuvent envoient des messagers, et que les autres fassent parvenir des lettres par les personnes que tu enverras. Ainsi, vous recevrez la gloire pour une œuvre dont le souvenir ne s’effacera jamais — car cela est digne de toi.


