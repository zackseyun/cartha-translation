base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: fr
  text: 'Comme je n’ai pas pu écrire à toutes les Églises, parce que j’ai pris soudainement la mer de Troas à Néapolis, comme la volonté divine l’ordonne, tu écriras aux Églises qui sont plus loin, comme quelqu’un qui possède la pensée de Dieu, afin qu’elles fassent elles aussi la même chose : que celles qui le peuvent envoient des messagers, et que les autres envoient des lettres par les personnes que tu enverras, afin que tu sois glorifié par une œuvre qui demeurera à jamais — car tu en es digne.


    Je salue chacun par son nom, en particulier la femme d’Épitropos, avec toute sa maisonnée et ses enfants. Je salue Attale, mon bien-aimé. Je salue celui qui sera désigné pour se rendre en Syrie. Que la grâce soit toujours avec lui, ainsi qu’avec Polycarpe, qui l’envoie.


    Je vous souhaite de toujours vous bien porter en notre Dieu Jésus-Christ. Demeurez en lui, dans l’unité et la supervision de Dieu.[a] Je salue Alcé, nom qui m’est très cher. Portez-vous bien dans le Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « supervision » (grec ἐπισκοπή) peut désigner la vigilance, la direction ou la charge de veiller; il n’est pas traduit ici comme un titre ecclésiastique technique.
    reason: Préserver l’étendue du terme grec sans imposer une interprétation institutionnelle.
lexical_decisions:
- source_word: churches
  choice: Églises
  rationale: « Églises » désigne naturellement ici les communautés chrétiennes locales et conserve le registre ecclésial ancien.
- source_word: the mind of God
  choice: la pensée de Dieu
  rationale: Traduction sobre qui préserve l’expression forte sans l’expliquer ni la réduire à une simple opinion conforme à Dieu.
- source_word: messengers
  choice: messagers
  rationale: Le terme reste assez large pour ne pas préciser indûment la fonction des personnes envoyées.
- source_word: supervision
  choice: supervision
  rationale: Ce choix conserve l’idée de surveillance ou de direction présente dans le témoin, sans importer un titre ecclésiastique précis avant la révision grecque.
- source_word: household
  choice: maisonnée
  rationale: « Maisonnée » inclut les membres vivant sous le même toit et convient mieux au contexte ancien que la seule famille nucléaire.
theological_decisions:
- issue: Rapport entre Jésus-Christ et l’expression « notre Dieu »
  choice: notre Dieu Jésus-Christ
  alternative: Jésus-Christ, notre Dieu
  rationale: L’ordre retenu conserve l’affirmation christologique directe du témoin et son ambiguïté syntaxique minimale, sans atténuation confessionnelle.
- issue: Unité et supervision de Dieu
  choice: dans l’unité et sous la supervision de Dieu
  alternative: dans l’unité et l’épiscopat de Dieu
  rationale: La formulation ne transforme pas prématurément « supervision » en office épiscopal; la révision du grec reste explicitement nécessaire.
- issue: Valeur de la gloire promise
  choice: vous recevrez la gloire
  alternative: vous serez glorifiés
  rationale: Cette tournure française naturelle conserve le passif théologique sans nommer l’agent qui glorifie.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement singulier est conservé lorsque l’auteur s’adresse à Polycarpe, tandis que le pluriel apparaît là où le témoin vise la communauté. Les noms propres suivent des formes françaises usuelles ou une translittération transparente. Projet provisoire fondé sur le témoin anglais du domaine public; une collation directe avec la recension moyenne grecque demeure nécessaire.
