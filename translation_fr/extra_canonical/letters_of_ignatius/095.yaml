review_pass:
  verdict: revise
  source_fidelity: La traduction suit globalement le témoin anglais et préserve les formulations difficiles concernant la chasteté, la connaissance « au-delà de l’évêque » et le consentement de l’évêque. Toutefois, « aux fidèles » ajoute un destinataire absent du texte. La formulation de la note doit aussi rendre compte plus exactement de l’ambiguïté de la proposition sans attribuer explicitement un « engagement » qui n’est pas nommé.
  naturalness: Le français est dans l’ensemble naturel et d’un registre pastoral approprié. « Parle aux fidèles à leur sujet » est fluide, mais son explicitation est indue. « Parle plutôt de ces choses » est à la fois direct et fidèle.
  terminology: « Pratiques mauvaises », « chasteté », « souillé », « selon le Seigneur » et « convoitise » sont recevables dans ce contexte. « Se satisfaire de leurs maris » peut être conservé, car il exprime le contentement demandé sans introduire une notion juridique ou confessionnelle étrangère.
  issues:
  - severity: medium
    issue: Ajout de « aux fidèles »
    rationale: Le témoin dit seulement de parler de ces pratiques/choses; il ne désigne pas les fidèles comme auditoire. Cet ajout pastoral réduit inutilement la portée de l’impératif.
  - severity: low
    issue: Note explicative trop spécifique sur un « engagement de chasteté »
    rationale: La phrase ne nomme pas explicitement un engagement. La note doit présenter l’ambiguïté de la connaissance publique sans transformer l’exhortation à demeurer dans la chasteté en catégorie technique.
  revised_text: 'Fuis les pratiques mauvaises — ou plutôt, parle de ces choses. Dis à mes sœurs d’aimer le Seigneur et de se satisfaire de leurs maris, dans la chair comme dans l’esprit. De même, recommande à mes frères, au nom de Jésus-Christ, d’aimer leurs femmes comme le Seigneur a aimé l’Église.


    Si quelqu’un est capable de demeurer dans la chasteté en l’honneur de la chair du Seigneur, qu’il le fasse sans s’en vanter. S’il s’en vante, il est perdu ; et si cela vient à être connu de quelqu’un d’autre que l’évêque, il est souillé.[a] Il convient aussi aux hommes et aux femmes qui se marient de s’unir avec l’accord de l’évêque, afin que leur mariage soit selon le Seigneur et non selon la convoitise. Que tout se fasse pour l’honneur de Dieu.'
  revised_footnotes:
  - marker: a
    text: 'Le sens précis de cette proposition est incertain dans le témoin utilisé : elle peut signifier que cette situation ne doit être connue que de l’évêque, ou qu’une connaissance publique allant au-delà de l’évêque compromet celui qui s’en glorifie.'
    reason: Le grec n’a pas encore fait l’objet d’une vérification directe et la formulation du témoin anglais (« known beyond the bishop ») demeure ambiguë.
  revision_rationale: La révision supprime l’ajout interprétatif « aux fidèles » et resserre la note afin de préserver l’ambiguïté du passage. Le reste du texte est conservé, car il rend de manière fidèle et naturelle le témoin fourni, sans imposer d’interprétation confessionnelle.
