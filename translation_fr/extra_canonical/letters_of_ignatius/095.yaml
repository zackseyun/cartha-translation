base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: fr
  text: 'Fuis les pratiques mauvaises — ou plutôt, parle aux fidèles à leur sujet. Dis à mes sœurs d’aimer le Seigneur et de se satisfaire de leurs maris, dans la chair comme dans l’esprit. De même, recommande à mes frères, au nom de Jésus-Christ, d’aimer leurs femmes comme le Seigneur a aimé l’Église.


    Si quelqu’un est capable de demeurer dans la chasteté en l’honneur de la chair du Seigneur, qu’il le fasse sans s’en vanter. S’il s’en vante, il est perdu ; et si cela vient à être connu de quelqu’un d’autre que l’évêque, il est souillé.[a] Il convient aussi aux hommes et aux femmes qui se marient de s’unir avec l’accord de l’évêque, afin que leur mariage soit selon le Seigneur et non selon la convoitise. Que tout se fasse pour l’honneur de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens précis de cette proposition est incertain dans le témoin utilisé : elle peut signifier que l’engagement de chasteté ne doit être connu que de l’évêque, ou qu’une reconnaissance publique au-delà de celui-ci compromet celui qui s’en glorifie.'
    reason: Le grec n’a pas encore fait l’objet d’une vérification directe et la formulation du témoin anglais est ambiguë.
lexical_decisions:
- source_word: evil arts
  choice: pratiques mauvaises
  rationale: Le témoin anglais peut évoquer des procédés ou pratiques malfaisants; « pratiques mauvaises » reste large sans préciser arbitrairement magie, ruse ou doctrine.
- source_word: hold thou discourse about these
  choice: parle aux fidèles à leur sujet
  rationale: Formulation naturelle qui conserve l’opposition entre fuir les pratiques et en parler pastoralement; « aux fidèles » explicite prudemment les destinataires suggérés par le contexte communautaire.
- source_word: to be content with their husbands
  choice: se satisfaire de leurs maris
  rationale: Conserve l’idée de contentement ou d’attachement exclusif du témoin, sans la réduire à la simple soumission.
- source_word: chastity
  choice: chasteté
  rationale: Terme français traditionnel et intelligible, suffisamment large pour préserver ici la possible référence au célibat continuellement vécu.
- source_word: concupiscence
  choice: convoitise
  rationale: Mot moderne qui rend un désir déréglé sans imposer une terminologie confessionnelle spécialisée.
theological_decisions:
- issue: Rapport entre chasteté et chair du Seigneur
  choice: demeurer dans la chasteté en l’honneur de la chair du Seigneur
  alternative: rester célibataire pour honorer le corps du Seigneur
  rationale: La formulation retenue préserve le lien théologique inhabituel et l’étendue sémantique de « chastity », sans réduire explicitement la phrase au célibat.
- issue: Rôle de l’évêque dans le mariage
  choice: avec l’accord de l’évêque
  alternative: avec l’approbation de l’évêque
  rationale: « Accord » traduit sobrement le consentement mentionné, sans transformer le passage en définition juridique ou sacramentelle.
- issue: Portée de « polluted »
  choice: il est souillé
  alternative: il s’est corrompu
  rationale: « Souillé » conserve la force religieuse et morale du témoin ainsi que son caractère abrupt, sans expliquer la nature exacte de la souillure.
translation_notes:
  register: Français international moderne, digne et pastoral. Le tutoiement adressé à Polycarpe est rendu par l’impératif singulier. Projet provisoire fondé sur le témoin anglais du domaine public; une révision directe du grec de la recension moyenne demeure nécessaire.
