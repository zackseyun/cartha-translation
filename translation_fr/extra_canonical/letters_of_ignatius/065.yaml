base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: fr
  text: 'J’ai constaté que votre évêque exerce le ministère qui concerne le bien commun, non de sa propre initiative ni par l’entremise d’êtres humains, ni encore par vaine gloire, mais dans l’amour de Dieu le Père et du Seigneur Jésus-Christ. Je suis émerveillé par sa patience : son silence est plus puissant que la parole des autres. En effet, il est accordé aux commandements comme une lyre à ses cordes. C’est pourquoi mon âme bénit son esprit attaché à Dieu, car je l’ai trouvé vertueux et accompli — notamment par son caractère imperturbable et paisible, tandis qu’il vit dans une patience pleinement conforme à Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir du témoin anglais public fourni; une vérification directe du texte grec de la recension moyenne reste nécessaire.
    reason: La source grecque n’a pas été fournie et sa révision est explicitement signalée comme encore à faire; la note rend transparente cette limite textuelle.
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: le ministère qui concerne le bien commun
  rationale: Conserve l’idée d’un service/ministère orienté vers l’intérêt commun, sans préciser davantage la fonction en l’absence d’une vérification directe du grec.
- source_word: not of himself or through men
  choice: non de sa propre initiative ni par l’entremise d’êtres humains
  rationale: Rend la double négation en français naturel tout en maintenant la distinction entre origine personnelle et médiation humaine.
- source_word: forbearance
  choice: patience
  rationale: « Patience » est clair et digne; le terme peut englober ici endurance, retenue et longanimité.
- source_word: godly mind
  choice: esprit attaché à Dieu
  rationale: Évite l’ambiguïté moderne de « esprit divin », qui pourrait suggérer que l’esprit de l’évêque est lui-même divin, tout en conservant l’orientation pieuse.
- source_word: imperturbable and calm temper
  choice: caractère imperturbable et paisible
  rationale: 'Préserve les deux qualités complémentaires: stabilité intérieure et calme.'
theological_decisions:
- issue: Origine et légitimité du ministère épiscopal
  choice: non de sa propre initiative ni par l’entremise d’êtres humains
  alternative: non de lui-même ni par les hommes
  rationale: La formulation retenue préserve l’opposition du témoin sans ajouter explicitement une nomination divine ou une doctrine particulière de l’ordination.
- issue: Relation de l’évêque aux commandements
  choice: il est accordé aux commandements
  alternative: il vit en harmonie avec les commandements
  rationale: La métaphore musicale est maintenue, sans décider si le propos vise d’abord l’obéissance morale, l’enseignement ou l’unité ecclésiale.
- issue: Sens de « godly »
  choice: attaché à Dieu / conforme à Dieu
  alternative: divin
  rationale: Le français « divin » risquerait d’attribuer une nature divine à une disposition humaine; le choix exprime plutôt son orientation vers Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement rhétorique du passage et sa métaphore de la lyre, tout en évitant les archaïsmes. « Évêque », « ministère » et « commandements » sont gardés en raison de leur rôle ecclésial explicite. La formulation demeure provisoire faute d’accès, dans les données fournies, au texte grec à contrôler directement.
