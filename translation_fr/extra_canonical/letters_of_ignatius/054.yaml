    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: fr
  text: 'Puisque, en réponse à ma prière adressée à Dieu, il m’a été accordé de voir vos visages qui honorent Dieu, j’ai reçu plus encore que je ne demandais. En effet, chargé de chaînes en Jésus-Christ, j’espère pouvoir vous saluer, si telle est la volonté divine et si je suis jugé digne d’aller jusqu’au bout.


    Car le commencement est vraiment bien engagé, pourvu que j’atteigne le but et reçoive mon héritage sans obstacle. C’est précisément votre amour que je crains, de peur qu’il ne me fasse du tort. Il vous est facile, en effet, de faire ce que vous voulez ; mais il m’est difficile d’atteindre Dieu, à moins que vous ne m’épargniez.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Autrement dit, Ignace demande aux chrétiens de Rome de ne pas intervenir pour empêcher l’issue qu’il espère atteindre. La formulation demeure toutefois volontairement indirecte.
    reason: Éclaire le paradoxe de « m’épargner » sans remplacer dans le texte l’ambiguïté rhétorique de l’auteur.
lexical_decisions:
- source_word: godly countenances (θεοπρεπεῖς... ὄψεις, probable Greek underlying the witness)
  choice: vos visages qui honorent Dieu
  rationale: Rend l’idée de visages dignes de Dieu ou conformes à Dieu sans employer l’expression française peu naturelle « visages pieux ».
- source_word: wearing bonds in Christ Jesus
  choice: chargé de chaînes en Jésus-Christ
  rationale: Conserve l’image concrète de l’emprisonnement et son rattachement théologique au Christ.
- source_word: reach unto the end / attain unto the goal
  choice: aller jusqu’au bout / atteindre le but
  rationale: Maintient la progression et la légère variation entre la fin du parcours et le but visé.
- source_word: receive mine inheritance
  choice: reçoive mon héritage
  rationale: Préserve la métaphore biblique et eschatologique sans préciser indûment la nature de l’héritage.
- source_word: attain unto God
  choice: atteindre Dieu
  rationale: Conserve la formulation forte et théologiquement tendue d’Ignace plutôt que de l’expliciter comme simple arrivée auprès de Dieu.
- source_word: spare me
  choice: m’épargniez
  rationale: 'Préserve l’ambiguïté rhétorique : les destinataires doivent s’abstenir d’intervenir pour empêcher son martyre.'
theological_decisions:
- issue: Sens de « votre amour » comme danger potentiel
  choice: C’est précisément votre amour que je crains, de peur qu’il ne me fasse du tort
  alternative: Je crains que votre amour ne vous pousse à intervenir en ma faveur
  rationale: La traduction conserve le paradoxe et n’explicite pas dans le corps du texte la forme exacte de l’intervention redoutée.
- issue: Portée de « atteindre Dieu »
  choice: atteindre Dieu
  alternative: parvenir auprès de Dieu
  rationale: La formulation directe respecte la tension mystique et eschatologique du passage sans la réduire à un déplacement ou à une doctrine détaillée de la mort.
- issue: Condition liée à la volonté divine et à la dignité
  choice: si telle est la volonté divine et si je suis jugé digne
  alternative: si Dieu veut que je sois jugé digne
  rationale: Garde distinctes les deux nuances présentes dans le témoin anglais tout en évitant de trancher leur articulation syntaxique avant vérification directe du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Les tournures archaïques du témoin anglais ont été actualisées, tandis que les images des chaînes, de la course, de l’héritage et de l’accès à Dieu ont été conservées. Projet nécessairement provisoire, puisque le dossier fourni indique que la vérification directe du grec de la recension moyenne reste à effectuer.
