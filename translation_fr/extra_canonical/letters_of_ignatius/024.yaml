base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: fr
  text: 'Quand j’ai appris le très bon ordre de votre amour selon Dieu, je me suis réjoui et j’ai décidé de vous adresser la parole dans la foi de Jésus Christ.


    En effet, ayant été jugé digne d’un nom tout à fait digne de Dieu, dans les chaînes que je porte, je célèbre les Églises ; et je prie pour qu’il y ait en elles l’union de la chair et de l’esprit de Jésus Christ, lui qui est notre vie pour toujours ; l’union de la foi et de l’amour, à laquelle rien n’est préférable ; et, ce qui est meilleur que tout, l’union de Jésus et du Père. En qui[a], si nous endurons tout et échappons au prince de ce monde, nous parviendrons à Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte un relatif masculin singulier (« en qui »), après « l’union de Jésus et du Père ». Son antécédent précis est difficile à déterminer dans cette construction ; la traduction conserve le singulier sans trancher davantage.
    reason: Préserver la difficulté syntaxique du texte grec et éviter de transformer le relatif singulier en un pluriel interprétatif.
lexical_decisions:
- source_word: exceeding good order
  choice: l’ordre admirable qui règne
  rationale: Rend l’idée d’une conduite harmonieusement ordonnée sans conserver une tournure anglaise lourde.
- source_word: in the ways of God
  choice: selon les voies de Dieu
  rationale: Conserve l’image traditionnelle des « voies » tout en exprimant la conformité à celles-ci.
- source_word: most godly name
  choice: un nom très saint
  rationale: Rend la valeur religieuse du qualificatif sans l’étrange calque « très divin » ; le référent précis du nom n’est pas explicité.
- source_word: which I carry about
  choice: que je porte partout avec moi
  rationale: Préserve l’image concrète d’Ignace transportant ses chaînes au cours de son déplacement.
- source_word: never-failing life
  choice: notre vie qui ne nous fera jamais défaut
  rationale: Exprime naturellement la permanence et la fidélité inépuisable de cette vie.
- source_word: despite
  choice: outrages
  rationale: Désigne les mauvais traitements et affronts subis sans les réduire à un simple mépris intérieur.
- source_word: prince of this world
  choice: prince de ce monde
  rationale: Conserve la formule théologique traditionnelle et son identification implicite, sans ajouter « diable » ou « Satan ».
- source_word: attain unto God
  choice: nous parviendrons jusqu’à Dieu
  rationale: Garde la dynamique d’aboutissement à Dieu sans préciser davantage la nature de cet accomplissement.
theological_decisions:
- issue: Rapport de la chair et de l’esprit à Jésus Christ
  choice: « la chair et […] l’esprit, qui appartiennent à Jésus Christ »
  alternative: « l’union charnelle et spirituelle de Jésus Christ »
  rationale: Le témoin fourni rattache explicitement la chair et l’esprit à Jésus Christ. La formulation retenue préserve cette relation, malgré sa densité, sans la réduire à l’unité interne de la communauté.
- issue: Référent de « in whom »
  choice: « en eux », avec note signalant l’ambiguïté
  alternative: « en qui », rapporté au Père seul
  rationale: L’antécédent immédiat comprend Jésus et le Père. Le pluriel français représente cette lecture tout en signalant que la syntaxe transmise peut aussi orienter vers le Père.
- issue: Nature du « nom très saint »
  choice: ne pas identifier le nom
  alternative: expliciter « le nom de chrétien » ou le nom d’Ignace/Théophore
  rationale: Le passage fourni ne précise pas son référent ; une explicitation imposerait une interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. Les termes ecclésiaux et johanniques traditionnels (« Églises », « prince de ce monde », « voies de Dieu ») sont conservés. La traduction demeure provisoire, car le dossier fourni indique qu’une vérification directe du grec de la recension moyenne reste à effectuer.
