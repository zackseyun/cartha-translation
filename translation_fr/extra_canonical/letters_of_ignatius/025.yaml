base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: fr
  text: Puis donc que j’ai eu la faveur de vous voir en la personne de Damas, votre évêque très aimé de Dieu, ainsi que de vos dignes anciens Bassus et Apollonius, et de Zotion, le diacre, mon compagnon de service, auprès duquel je souhaite être, parce qu’il est soumis à l’évêque comme à la grâce de Dieu, et au conseil des anciens comme à la loi de Jésus-Christ —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly bishop
  choice: évêque attaché à Dieu
  rationale: Rend la piété et l’orientation vers Dieu en français naturel, sans suggérer que l’évêque serait lui-même divin.
- source_word: presbyters / presbytery
  choice: anciens / conseil des anciens
  rationale: Conserve le sens ancien de responsables ecclésiaux tout en distinguant les personnes du corps collégial; évite d’importer sans nécessité une terminologie confessionnelle moderne.
- source_word: fellow-servant
  choice: compagnon de service
  rationale: Exprime le service partagé sans ajouter explicitement un maître absent de la formulation transmise.
- source_word: would fain have joy
  choice: voudrais avoir à me réjouir
  rationale: Préserve la tournure relationnelle et prospective plutôt que de réduire l’expression à une simple appréciation présente.
- source_word: subject
  choice: soumis
  rationale: Reproduit directement le rapport d’autorité exprimé dans le témoin.
theological_decisions:
- issue: Comparaison de la soumission à l’évêque avec la grâce de Dieu
  choice: comme à la grâce de Dieu
  alternative: comme représentant la grâce de Dieu
  rationale: Maintient la comparaison forte et son ambiguïté théologique sans expliquer ni identifier l’évêque à la grâce divine.
- issue: Comparaison du conseil des anciens avec la loi de Jésus-Christ
  choice: comme à la loi de Jésus-Christ
  alternative: comme représentant la loi de Jésus-Christ
  rationale: Conserve le parallélisme et la tension du texte reçu sans ajouter une interprétation médiatrice.
- issue: Visibilité de la communauté dans ses responsables
  choice: vous voir dans la personne de Damas… ainsi que dans celles de…
  alternative: vous voir représentés par Damas…
  rationale: Préserve l’image corporative du témoin tout en rendant explicite l’accord nécessaire en français, sans réduire l’expression à une représentation purement administrative.
translation_notes:
  register: 'Français international actuel, digne et lisible. La phrase longue et le tiret final sont conservés parce que le passage se poursuit syntaxiquement dans la section suivante. Projet nécessairement provisoire: les données fournies reposent sur un témoin anglais du domaine public et signalent que l’examen direct du grec de la recension moyenne reste à effectuer.'
