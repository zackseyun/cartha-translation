    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: fr
  text: 'Désormais, il est donc raisonnable que nous nous réveillions et retrouvions notre sobriété, tant que nous avons [encore] le temps de nous repentir et de nous tourner vers Dieu. Il est bon de reconnaître Dieu et l’évêque. Celui qui honore l’évêque est honoré par Dieu ; celui qui fait quoi que ce soit à l’insu de l’évêque sert le diable.



    Que tout vous soit abondamment accordé dans la grâce, car vous en êtes dignes. Vous m’avez réconforté en toutes choses, et Jésus-Christ vous réconfortera. En mon absence comme en ma présence, vous m’avez aimé. Que Dieu vous le rende ! Si, pour lui, vous persévérez à travers toutes choses, vous parviendrez jusqu’à lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness
  choice: nous nous réveillions et retrouvions notre sobriété
  rationale: Conserve les deux images coordonnées du réveil et de la sobriété morale sans les réduire à une seule idée.
- source_word: recognize
  choice: reconnaître
  rationale: Maintient la formulation du témoin, qui peut évoquer à la fois la reconnaissance et l’acceptation de l’autorité.
- source_word: without the knowledge of the bishop
  choice: à l’insu de l’évêque
  rationale: Expression française naturelle qui préserve l’idée d’agir sans que l’évêque le sache, sans renforcer le texte en « sans son autorisation ».
- source_word: rendereth service
  choice: sert
  rationale: Restitution directe et idiomatique de l’idée de service rendu au diable.
- source_word: refreshed
  choice: réconforté
  rationale: Terme naturel qui exprime le soulagement et l’encouragement reçus, puis promis en retour.
- source_word: cherished
  choice: avez pris soin de moi
  rationale: Évite une nuance affective trop étroite et rend l’attention concrète manifestée à l’auteur.
- source_word: attain unto Him
  choice: parviendrez jusqu’à lui
  rationale: Préserve l’image dynamique d’atteindre Dieu, sans expliciter davantage la nature de cet aboutissement.
theological_decisions:
- issue: Rapport entre Dieu et l’évêque dans « reconnaître Dieu et l’évêque »
  choice: 'Conserver la coordination simple : « reconnaître Dieu et l’évêque »'
  alternative: « reconnaître l’autorité de Dieu et celle de l’évêque »
  rationale: L’explicitation par « autorité » résoudrait une ambiguïté que le témoin ne tranche pas.
- issue: Action accomplie sans la connaissance de l’évêque
  choice: « à l’insu de l’évêque »
  alternative: « sans l’autorisation de l’évêque »
  rationale: Le texte parle de connaissance, non explicitement de permission ; la traduction ne doit pas importer une conception ecclésiologique plus forte.
- issue: Référent de « for whose sake »
  choice: « Si, pour lui, vous supportez toutes choses » après la mention explicite de Dieu
  alternative: « Si vous supportez toutes choses pour l’amour de Dieu »
  rationale: Le pronom conserve la structure et le référent probable tout en évitant une explicitation interprétative superflue.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche du mouvement exhortatif de la lettre, avec des formulations accessibles. Les crochets autour de « [encore] » conservent le signal de restitution transmis par le témoin anglais, la vérification directe du grec étant indiquée comme encore en attente.
