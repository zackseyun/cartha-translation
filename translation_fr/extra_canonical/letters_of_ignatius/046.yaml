review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le grec de la recension moyenne emploie θυσιαστήριον (« autel »), et non un terme général pour « sanctuaire ». La traduction doit conserver cette image cultuelle précise. La construction finale rend bien l’idée d’agir « sans »/en dehors de l’évêque, du presbytérium et des diacres, mais « n’a pas la conscience pure » reformule plus librement le prédicat de pureté appliqué à la personne dans sa conscience.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Ne vous laissez pas enfler d’orgueil » est idiomatique, mais « ne vous enorgueillissez pas » est plus direct et plus fluide. « Presbytérium » est préférable à « collège des anciens », qui interprète et modernise le terme institutionnel.
  terminology: Conserver « [Dieu] Jésus-Christ » avec les crochets, signal textuel déjà présent dans le témoin. Rendre πρεσβυτέριον par « presbytérium » et l’expliquer en note préserve le terme collectif sans l’assimiler sans reste à un « collège des anciens ». « Prescriptions des apôtres » convient pour δόγματα. « Autel » restitue θυσιαστήριον.
  issues:
  - severity: high
    issue: « sanctuaire » traduit l’image θυσιαστήριον de manière trop générale.
    rationale: Le texte grec reçu de la recension moyenne dit explicitement « autel ». Le remplacement par « sanctuaire » affaiblit l’image et ne doit pas être maintenu lorsque l’on vise la fidélité au texte-source.
  - severity: medium
    issue: « collège des anciens » est une interprétation de πρεσβυτέριον.
    rationale: Le mot désigne ici le corps des presbytres. « Presbytérium », avec une note explicative, conserve le terme ecclésial collectif et évite d’imposer une équivalence institutionnelle moderne.
  - severity: low
    issue: « n’a pas la conscience pure » reformule l’assertion finale.
    rationale: Le grec dit littéralement que cette personne « n’est pas pure dans sa conscience ». Cette formulation maintient la répétition de « pur » et la localisation « dans sa conscience ».
  revised_text: 'Soyez donc sur vos gardes contre de telles personnes. Et cela arrivera certainement si vous ne vous enorgueillissez pas et si vous demeurez inséparables de [Dieu] Jésus-Christ, de l’évêque et des prescriptions des apôtres.



    Celui qui est à l’intérieur de l’autel est pur ; mais celui qui est à l’extérieur de l’autel n’est pas pur. Autrement dit, celui qui fait quoi que ce soit sans l’évêque, le presbytérium[a] et les diacres n’est pas pur dans sa conscience.'
  revised_footnotes:
  - marker: a
    text: Le « presbytérium » est le corps collectif des presbytres (anciens).
    reason: Préserve le terme collectif correspondant à πρεσβυτέριον tout en le rendant compréhensible dans un français moderne.
  revision_rationale: La révision restitue « autel », correspondant au grec θυσιαστήριον, conserve le contraste spatial et la répétition de « pur », et remplace l’équivalence interprétative « collège des anciens » par le terme collectif « presbytérium » expliqué en note. Les crochets de [Dieu] sont maintenus sans trancher la question textuelle signalée par le dossier.
