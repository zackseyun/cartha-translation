  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Be ye therefore on your guard against such men. And this will surely be, if ye be not puffed up and if ye be inseparable from [God] Jesus Christ and from the bishop and from the ordinances of the Apostles.


    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: fr
  text: 'Soyez donc sur vos gardes contre de telles personnes. Cela sera certainement le cas si vous ne vous laissez pas enfler d’orgueil et si vous demeurez inséparables de [Dieu] Jésus-Christ, de l’évêque et des prescriptions des apôtres.


    Celui qui est à l’intérieur du sanctuaire est pur ; mais celui qui est à l’extérieur du sanctuaire ne l’est pas. Autrement dit, celui qui fait quoi que ce soit sans l’évêque, le collège des anciens[a] et les diacres n’a pas la conscience pure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le presbytérium », c’est-à-dire l’ensemble des presbytres.'
    reason: Signale le sens collectif du terme et une autre transcription française possible.
lexical_decisions:
- source_word: puffed up
  choice: vous laissez pas enfler d’orgueil
  rationale: Rend l’image de l’enflure tout en exprimant clairement l’orgueil dans un français actuel.
- source_word: sanctuary
  choice: sanctuaire
  rationale: Conserve la métaphore cultuelle et son contraste entre l’intérieur et l’extérieur.
- source_word: clean
  choice: pur / conscience pure
  rationale: Maintient le vocabulaire de pureté dans la métaphore, puis l’adapte naturellement à la conscience dans l’explication.
- source_word: presbytery
  choice: collège des anciens
  rationale: Désigne le corps collectif des presbytres plutôt qu’un lieu ou un individu, dans une formulation accessible.
- source_word: ordinances
  choice: prescriptions
  rationale: Exprime des directives normatives reçues des apôtres sans préciser indûment leur forme exacte.
theological_decisions:
- issue: Lecture de « [God] Jesus Christ »
  choice: '[Dieu] Jésus-Christ'
  alternative: Jésus-Christ notre Dieu / Jésus-Christ
  rationale: Les crochets sont conservés comme signal textuel puisque la vérification directe de la tradition grecque reste en attente ; la formulation n’efface ni n’accentue davantage la variante.
- issue: Portée de l’image du sanctuaire
  choice: Conserver l’image, puis laisser l’auteur l’expliquer en termes d’action ecclésiale
  alternative: Remplacer directement le sanctuaire par l’Église
  rationale: Évite de résoudre la métaphore à la place de l’auteur et préserve le mouvement argumentatif du passage.
- issue: Autorité de l’évêque, des anciens et des diacres
  choice: Traduction directe de l’énumération et de l’affirmation sur la conscience
  alternative: Ajouter une qualification sacramentelle ou juridictionnelle
  rationale: Le texte affirme la nécessité d’agir avec ces responsables, mais ne développe pas ici une théorie institutionnelle précise.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement pluriel implicite de l’exhortation est rendu par « vous ». La tournure répétitive du contraste sur le sanctuaire est conservée. Traduction provisoire fondée sur le témoin anglais public fourni ; révision directe du grec encore nécessaire.
