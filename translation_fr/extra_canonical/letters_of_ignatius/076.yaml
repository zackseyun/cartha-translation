base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: fr
  text: 'Ignace, appelé aussi Théophore, à l’Église de Dieu le Père et de Jésus-Christ, le Bien-Aimé, qui, dans sa miséricorde, a été comblée de toute grâce, qui est remplie de foi et d’amour et ne manque d’aucun don de grâce, digne du plus grand respect et porteuse de trésors saints ; à l’Église qui est à Smyrne, en Asie : dans un esprit irréprochable et dans la parole de Dieu, abondantes salutations.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Théophore
  rationale: Conserve le surnom traditionnel sous sa forme française plutôt que d’en imposer une interprétation étymologique, laquelle peut être comprise comme « porteur de Dieu » ou « porté par Dieu ».
- source_word: church
  choice: Église
  rationale: « Église » désigne naturellement la communauté chrétienne locale dans ce contexte épistolaire ancien.
- source_word: the Beloved
  choice: le Bien-Aimé
  rationale: Rend le titre christologique avec une formulation française biblique, claire et digne.
- source_word: grace
  choice: grâce / don de grâce
  rationale: La variation évite une répétition pesante tout en conservant le champ sémantique de la grâce et des dons reçus.
- source_word: most reverend
  choice: digne du plus grand respect
  rationale: Exprime l’honneur dû à la communauté sans employer un titre ecclésiastique moderne potentiellement anachronique.
- source_word: bearing holy treasures
  choice: porteuse de trésors saints
  rationale: Préserve l’image concrète et sa possible portée spirituelle sans l’expliciter abusivement.
- source_word: abundant greeting
  choice: abondantes salutations
  rationale: Reproduit l’intensification inhabituelle de la salutation tout en restant intelligible en français.
theological_decisions:
- issue: Relation exprimée par « l’Église de Dieu le Père et de Jésus-Christ »
  choice: Conserver la coordination « de Dieu le Père et de Jésus-Christ »
  alternative: Reformuler en « l’Église qui appartient à Dieu le Père et à Jésus-Christ »
  rationale: La formulation retenue respecte la densité et l’ambiguïté relationnelle du témoignage fourni sans préciser au-delà de celui-ci la nature exacte de l’appartenance.
- issue: Sens du surnom Theophorus
  choice: Translittérer « Théophore »
  alternative: Traduire par « porteur de Dieu » ou « porté par Dieu »
  rationale: L’étymologie permet plusieurs nuances ; la translittération évite de trancher une ambiguïté ancienne.
- issue: Nature des « trésors saints »
  choice: Maintenir la métaphore sans identification
  alternative: Les identifier aux sacrements, aux reliques ou aux dons spirituels
  rationale: Le témoignage fourni ne permet pas de déterminer sûrement le référent ; une explicitation importerait une lecture doctrinale particulière.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible, avec la longue période épistolaire conservée et clarifiée par la ponctuation. Projet nécessairement provisoire : le dossier fourni repose sur un témoin anglais du domaine public et indique que la vérification directe du grec de la recension moyenne reste à effectuer.'
