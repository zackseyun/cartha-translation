revisions:
- from: 'Ainsi donc, ceux qui contredisent le bon don de Dieu périssent à cause de leurs discussions. Il leur serait pourtant profitable d’avoir l’amour, afin qu’eux aussi ressuscitent.


    Il convient donc que vous vous teniez à l’écart de telles personnes et que vous ne parliez pas d’elles, ni en privé ni en public. Attachez-vous plutôt aux Prophètes, et surtout à l’Évangile, où la Passion nous est montrée et où la résurrection s’accomplit.'
  to: 'Ainsi donc, ceux qui s’opposent au bon don de Dieu périssent par leurs contestations. Il leur vaudrait pourtant mieux aimer, afin qu’eux aussi ressuscitent.


    Il convient donc que vous vous teniez à l’écart de ces gens-là et que vous ne parliez pas d’eux, ni en privé ni en public. Attachez-vous plutôt aux Prophètes, et surtout à l’Évangile, où la Passion nous a été manifestée et où la résurrection est accomplie.'
  rationale: La révision conserve l’ambiguïté du « bon don de Dieu » et le lien, volontairement non explicité davantage, entre aimer et ressusciter. Elle rétablit l’infinitif « aimer » et l’aspect accompli des deux affirmations finales. Aucun ajout interprétatif ni note n’est requis.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:16:46Z'
review_pass:
  verdict: revise
  source_fidelity: Révision fondée sur la formulation grecque de la recension moyenne, avec contrôle du témoin anglais. Le projet rend globalement le sens, mais « avoir l’amour » ne traduit pas exactement le verbe ἀγαπᾶν (« aimer »), et les présents « nous est montrée » / « s’accomplit » affaiblissent les parfaits grecs δεδήλωται et τετελείωται, qui présentent la Passion comme manifestée et la résurrection comme accomplie.
  naturalness: Le français est fluide et d’un registre approprié. « Il leur vaudrait mieux aimer » est plus naturel et plus fidèle que « il leur serait profitable d’avoir l’amour ». « Ces gens-là » évite la tournure un peu administrative « telles personnes », tout en conservant la distance polémique du texte.
  terminology: « Don de Dieu », « Prophètes », « Évangile », « Passion » et « résurrection » conviennent. Le singulier « l’Évangile » est conservé, sans décider s’il désigne un écrit particulier ou la proclamation évangélique. « Contestations » rend avec prudence τοῖς μερισμοῖς, terme dont la nuance peut recouvrir les querelles, dissensions ou controverses; il ne faut pas lui imposer une définition technique plus étroite.
  issues:
  - severity: medium
    issue: « avoir l’amour » pour ἀγαπᾶν
    rationale: Le grec emploie l’infinitif verbal « aimer », non le substantif « amour ». La formulation du projet modifie légèrement l’exhortation éthique et son mouvement verbal.
  - severity: medium
    issue: Temps de « nous est montrée » et « s’accomplit »
    rationale: Les parfaits grecs indiquent ici que la Passion a été manifestée et que la résurrection est accomplie. Le présent français « s’accomplit » introduit indûment une idée de processus actuel et contredit également l’audit anglais « is accomplished ».
  - severity: low
    issue: « discussions » pour τοῖς μερισμοῖς
    rationale: « Discussions » reste possible à partir du témoin anglais, mais « contestations » exprime mieux le caractère polémique sans trancher entre les nuances possibles de querelles, divisions ou raisonnements litigieux.
  revised_text: 'Ainsi donc, ceux qui s’opposent au bon don de Dieu périssent par leurs contestations. Il leur vaudrait pourtant mieux aimer, afin qu’eux aussi ressuscitent.


    Il convient donc que vous vous teniez à l’écart de ces gens-là et que vous ne parliez pas d’eux, ni en privé ni en public. Attachez-vous plutôt aux Prophètes, et surtout à l’Évangile, où la Passion nous a été manifestée et où la résurrection est accomplie.'
