base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: fr
  text: 'Ainsi donc, ceux qui s’opposent au bon don de Dieu périssent par leurs contestations. Il leur vaudrait pourtant mieux aimer, afin qu’eux aussi ressuscitent.


    Il convient donc que vous vous teniez à l’écart de ces gens-là et que vous ne parliez pas d’eux, ni en privé ni en public. Attachez-vous plutôt aux Prophètes, et surtout à l’Évangile, où la Passion nous a été manifestée et où la résurrection est accomplie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: contredisent
  rationale: Rend l’opposition active au don de Dieu sans préciser davantage la forme exacte du refus, conformément au témoin disponible.
- source_word: good gift of God
  choice: le bon don de Dieu
  rationale: Conserve la formulation générale et théologiquement ouverte du témoin, sans identifier explicitement ce don.
- source_word: questionings
  choice: discussions
  rationale: Exprime des controverses ou raisonnements disputés; le terme reste assez large puisque la vérification directe du grec est encore en attente.
- source_word: have love
  choice: avoir l’amour
  rationale: Préserve la formulation substantielle et l’accent éthique du passage plutôt que de réduire le sens à une attitude affective.
- source_word: passion
  choice: la Passion
  rationale: Terme français établi pour les souffrances et la mort du Christ dans ce contexte chrétien ancien.
- source_word: is accomplished
  choice: s’accomplit
  rationale: Maintient la voix moyenne/passive et la tension du témoin, sans ajouter d’agent ni d’explication chronologique.
theological_decisions:
- issue: Lien entre l’amour et la résurrection
  choice: « afin qu’eux aussi ressuscitent »
  alternative: « afin qu’ils puissent eux aussi ressusciter »
  rationale: La formulation retenue conserve le lien final exprimé dans le témoin sans transformer explicitement l’amour en capacité intrinsèque ni résoudre la portée sotériologique de la phrase.
- issue: Référent du « bon don de Dieu »
  choice: Le référent demeure non précisé.
  alternative: L’identifier à l’eucharistie, à l’incarnation ou au salut.
  rationale: Le passage fourni ne nomme pas ici le don; une identification explicite importerait une interprétation contextuelle non vérifiée directement sur le grec.
- issue: Portée de « l’Évangile »
  choice: 'Majuscule et singulier collectif : « l’Évangile »'
  alternative: « les Évangiles » ou un écrit évangélique particulier
  rationale: Respecte le singulier du témoin et son sens potentiellement large, proclamation ou tradition évangélique, sans trancher artificiellement.
- issue: Accomplissement de la résurrection
  choice: « où la résurrection s’accomplit »
  alternative: « où l’accomplissement de la résurrection est rapporté »
  rationale: Conserve la formulation dense et théologique du témoin, qui distingue la Passion montrée de la résurrection accomplie.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et les parallélismes sont conservés. Aucun marqueur de note n’est nécessaire. Comme la révision directe de la source grecque est signalée comme étant en attente, les choix évitent de surinterpréter les nuances que le seul témoin anglais ne permet pas d’établir avec certitude.
