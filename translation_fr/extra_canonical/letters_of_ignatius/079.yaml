base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: fr
  text: 'Car je sais et je crois qu’il était dans la chair même après la résurrection.


    Lorsqu’il vint auprès de Pierre et de ceux qui étaient avec lui, il leur dit : « Prenez-moi, palpez-moi et voyez que je ne suis pas un démon incorporel. » Aussitôt, ils le touchèrent et crurent, étroitement attachés à sa chair et à son sang. C’est pourquoi ils méprisèrent aussi la mort ; bien plus, ils se montrèrent supérieurs à la mort. Après sa résurrection, il mangea et but avec eux comme étant de chair, bien que, spirituellement, il fût uni au Père.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in the flesh
  choice: dans la chair
  rationale: Conserve l’expression corporelle et théologiquement chargée du témoignage, sans la réduire à « dans un corps ».
- source_word: Peter and his company
  choice: Pierre et ses compagnons
  rationale: Formulation française naturelle qui désigne le groupe présent avec Pierre sans préciser davantage son identité.
- source_word: Lay hold and handle me
  choice: Saisissez-moi, touchez-moi
  rationale: Rend les deux impératifs concrets et souligne la possibilité d’un contact physique réel.
- source_word: a demon without a body
  choice: un esprit démoniaque sans corps
  rationale: « Esprit démoniaque » est plus idiomatique en français moderne que le seul substantif « démon », tout en maintenant l’opposition avec la corporéité.
- source_word: being joined unto His flesh and His blood
  choice: unis à sa chair et à son sang
  rationale: Préserve le langage fort d’union et sa possible portée théologique sans en imposer une explication sacramentelle.
- source_word: found superior to death
  choice: se montrèrent supérieurs à la mort
  rationale: Exprime une supériorité attestée dans les faits plutôt qu’une simple attitude intérieure.
- source_word: as one in the flesh
  choice: comme un être de chair
  rationale: Français naturel qui maintient l’affirmation de l’existence corporelle après la résurrection.
theological_decisions:
- issue: Corporéité du Christ ressuscité
  choice: Maintien répété de « chair », « sang », du toucher, du manger et du boire
  alternative: Généraliser en parlant seulement d’une présence physique
  rationale: Le passage insiste précisément sur la réalité corporelle du Ressuscité ; l’atténuer effacerait sa tension polémique.
- issue: Union des disciples à la chair et au sang du Christ
  choice: « unis à sa chair et à son sang » sans commentaire interprétatif dans le corps du texte
  alternative: Expliciter une union eucharistique, mystique ou seulement perceptive
  rationale: La formulation peut recevoir plusieurs lectures ; la traduction ne doit pas trancher ce que le témoin fourni laisse ouvert.
- issue: Relation spirituelle du Fils au Père
  choice: « spirituellement, il fût uni au Père »
  alternative: « selon l’Esprit, il était uni au Père »
  rationale: Le témoin anglais permet une lecture adverbiale générale ; faute de vérification grecque directe, la version évite de transformer explicitement « esprit » en titre ou en catégorie technique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la progression argumentative et les répétitions corporelles du passage. Projet provisoire fondé sur le témoin anglais public fourni, la révision directe du grec étant encore en attente.
