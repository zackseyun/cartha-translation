base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: fr
  text: '[Mais] fuyez les divisions, car elles sont le commencement des maux. Suivez tous votre évêque, comme Jésus-Christ suit le Père, et le conseil des anciens comme les apôtres ; quant aux diacres, respectez-les comme le commandement de Dieu. Que personne ne fasse rien de ce qui concerne l’Église sans l’évêque. Que soit tenue pour valide l’eucharistie qui relève de l’évêque ou de celui à qui il en donne l’autorisation.


    Là où paraît l’évêque, que la communauté s’y trouve ; de même que là où est Jésus-Christ, là est l’Église universelle.[a] Sans l’évêque, il n’est permis ni de baptiser ni de célébrer le repas fraternel.[b] Mais tout ce qu’il approuve est aussi agréable à Dieu, afin que tout ce que vous faites soit sûr et valide.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traditionnellement rendue par « Église catholique » signifie ici « Église universelle », c’est-à-dire l’Église dans sa totalité.
    reason: Éclairer un terme historiquement important sans imposer son sens confessionnel ultérieur.
  - marker: b
    text: Le « repas fraternel » désigne l’agape, un repas communautaire des premiers chrétiens.
    reason: Expliquer une pratique ancienne peu familière au lectorat moderne.
lexical_decisions:
- source_word: ἐπίσκοπος (episkopos)
  choice: évêque
  rationale: Terme français traditionnel et historiquement approprié pour le responsable ecclésial désigné dans ce passage.
- source_word: πρεσβυτέριον (presbyterion)
  choice: conseil des anciens
  rationale: Rend la dimension collective du groupe plutôt qu’un titre individuel ; formulation intelligible en français moderne.
- source_word: διάκονοι (diakonoi)
  choice: diacres
  rationale: Conserve le titre ministériel attesté et usuel dans la tradition chrétienne.
- source_word: εὐχαριστία (eucharistia)
  choice: eucharistie
  rationale: Maintient le terme technique du texte, sans le réduire à une interprétation confessionnelle particulière.
- source_word: βέβαιος (bebaios)
  choice: valide / sûr
  rationale: Le contexte institutionnel appelle « valide » pour l’eucharistie et les actes reconnus ; dans la conclusion, « sûr et valide » conserve l’étendue sémantique du terme.
- source_word: πλῆθος (plēthos)
  choice: communauté
  rationale: Dans ce contexte ecclésial, désigne l’ensemble rassemblé des fidèles ; « communauté » est plus naturel que « multitude » en français.
- source_word: καθολικὴ ἐκκλησία (katholikē ekklēsia)
  choice: Église universelle
  rationale: Rend le sens ancien de « selon le tout, universelle » sans faire automatiquement du mot un nom confessionnel ultérieur.
- source_word: ἀγάπη (agapē)
  choice: repas fraternel
  rationale: Le contexte désigne vraisemblablement l’agape communautaire ; cette traduction explicite la pratique sans la confondre avec le seul sentiment d’amour.
theological_decisions:
- issue: Nature de l’autorité épiscopale
  choice: « sous l’autorité de l’évêque » et « sans l’évêque »
  alternative: « présidée par l’évêque » / « en dehors de l’évêque »
  rationale: La formulation retenue exprime la supervision ou l’autorisation mentionnée dans le passage sans exiger que l’évêque préside personnellement chaque acte.
- issue: Sens de « Église universelle »
  choice: Traduire καθολική par « universelle »
  alternative: « Église catholique »
  rationale: « Universelle » communique le sens lexical ancien tout en évitant d’importer directement les frontières confessionnelles développées plus tard.
- issue: Comparaison concernant les diacres
  choice: « respectez-les comme le commandement de Dieu »
  alternative: « respectez-les comme vous respectez le commandement de Dieu »
  rationale: La formulation plus littérale préserve la comparaison condensée et sa possible tension, sans identifier les diacres à Dieu lui-même.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement collectif est évité grâce aux impératifs et aux tournures avec « vous ». La traduction demeure provisoire, puisque le dossier fourni indique qu’une vérification directe du grec de la recension moyenne reste à effectuer.
