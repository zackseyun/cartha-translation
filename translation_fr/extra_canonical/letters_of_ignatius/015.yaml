source:
  text: 'None of these things is hidden from you, if ye be perfect in your faith and love toward Jesus Christ, for these are the beginning and end of life--faith is the beginning and love is the end--and the two being found in unity are God, while all things else follow in their train unto true nobility.


    No man professing faith sinneth, and no man possessing love hateth. The tree is manifest from its fruit; so they that profess to be Christ''s shall be seen through their actions. For the Work is not a thing of profession now, but is seen then when one is found in the power of faith unto the end.'
