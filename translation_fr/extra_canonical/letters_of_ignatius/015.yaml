review_pass:
  verdict: revise
  source_fidelity: Le projet conserve les principales difficultés du témoin, notamment l’identification énigmatique de la foi et de l’amour unis à Dieu et les énoncés absolus sur le péché et la haine. Toutefois, « tout le reste ... conduit à » transforme l’image selon laquelle les autres réalités suivent la foi et l’amour vers la véritable noblesse. « Demeure » ajoute aussi une nuance de durée qui n’est pas explicitement présente dans « is found ». La majuscule à « Œuvre » ne correspond pas à une distinction vérifiable dans le grec ancien et risque de substantiver ou de théologiser indûment le terme.
  naturalness: La formulation est globalement claire et digne. « La foi et l’amour, lorsqu’ils se trouvent unis » est plus naturel et plus explicite que « Tous deux, unis », tout en gardant la formulation difficile. « Se trouve dans la puissance de la foi jusqu’à la fin » rend plus directement l’image du témoin que « demeure ».
  terminology: '« Accomplis » convient ici. « Véritable noblesse », « professe la foi », « possède l’amour » et « jusqu’à la fin » préservent utilement le lexique et les tensions du témoin. Le terme « œuvre » est conservé sans majuscule : aucune capitalisation théologique ne peut être inférée du grec, et le contexte l’oppose à une simple profession verbale.'
  issues:
  - severity: medium
    issue: « tandis que tout le reste, à leur suite, conduit à la véritable noblesse »
    rationale: Le témoin dit que « tout le reste » suit ces deux réalités dans leur mouvement vers la véritable noblesse; le français fait de « tout le reste » l’agent qui conduit, ce qui modifie les relations logiques.
  - severity: medium
    issue: « elle se manifeste lorsque quelqu’un demeure dans la puissance de la foi »
    rationale: « Demeure » interprète « is found » comme une persévérance déjà établie. Une formulation avec « se trouve » maintient l’expression du témoin sans ajouter cette nuance.
  - severity: low
    issue: Majuscule à « l’Œuvre »
    rationale: La majuscule du témoin anglais ne peut pas être reportée comme une catégorie théologique du texte grec, qui ne connaît pas cette distinction graphique. La minuscule est plus neutre.
  - severity: low
    issue: Note a formulée comme « littéralement selon le témoin fourni »
    rationale: Le texte français peut signaler qu’il s’agit d’une traduction proche du témoin anglais, mais « littéralement » serait trop fort en l’absence de contrôle direct de la formulation grecque.
  revised_text: 'Rien de tout cela ne vous est caché, si vous êtes accomplis dans votre foi et votre amour envers Jésus-Christ, car la foi et l’amour sont le commencement et la fin de la vie : la foi est le commencement, et l’amour la fin. La foi et l’amour, lorsqu’ils se trouvent unis, sont Dieu[a], tandis que tout le reste les suit vers la véritable noblesse.


    Quiconque professe la foi ne pèche pas, et quiconque possède l’amour ne hait pas[b]. On reconnaît l’arbre à son fruit ; de même, ceux qui déclarent appartenir au Christ seront reconnus à leurs actes. Car l’œuvre n’est pas maintenant une affaire de profession : elle se voit lorsqu’on se trouve dans la puissance de la foi jusqu’à la fin[c].'
  revised_footnotes:
  - marker: a
    text: 'Traduction proche du témoin fourni : « les deux, se trouvant dans l’unité, sont Dieu ». Cette formulation théologiquement dense est conservée sans harmonisation ; son détail devra être vérifié directement sur le grec.'
    reason: Préserver une difficulté réelle sans la résoudre silencieusement, puisque la révision directe de la langue source est encore en attente.
  - marker: b
    text: 'Ces deux affirmations ont une forme absolue dans le témoin : le texte ne précise pas ici s’il parle d’une conduite sans exception ou de ce qui caractérise véritablement la foi et l’amour.'
    reason: Éviter d’importer une explication doctrinale absente du passage.
  - marker: c
    text: « Jusqu’à la fin » peut évoquer la persévérance dans le temps aussi bien que l’accomplissement jusqu’au terme.
    reason: Conserver l’ambiguïté de l’expression transmise par le témoin anglais en attendant la vérification grecque.
  revision_rationale: Révision limitée aux endroits où le français modifiait la syntaxe ou l’orientation du témoin anglais, ou risquait d’ajouter une interprétation graphique/théologique. Les affirmations difficiles et absolues sont maintenues, et les notes continuent de signaler honnêtement que l’examen direct du grec reste requis.
