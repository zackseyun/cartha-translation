base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: fr
  text: 'Rien de tout cela ne vous est caché, si vous êtes accomplis dans votre foi et votre amour envers Jésus-Christ, car ils sont le commencement et la fin de la vie : la foi est le commencement, et l’amour la fin. Tous deux, unis, sont Dieu[a], tandis que tout le reste, à leur suite, conduit à la véritable noblesse.


    Quiconque professe la foi ne pèche pas, et quiconque possède l’amour ne hait pas[b]. On reconnaît l’arbre à son fruit ; de même, ceux qui déclarent appartenir au Christ seront reconnus à leurs actes. Car l’Œuvre ne consiste pas maintenant en une simple profession : elle se manifeste lorsque quelqu’un demeure dans la puissance de la foi jusqu’à la fin[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement selon le témoin fourni : « les deux, se trouvant dans l’unité, sont Dieu ». Cette formulation théologiquement dense est conservée ; son détail devra être vérifié directement sur le grec.'
    reason: Préserver une difficulté réelle sans la résoudre silencieusement, puisque la révision de la langue source est encore en attente.
  - marker: b
    text: 'Ces deux affirmations ont une forme absolue dans le témoin : le texte ne précise pas ici s’il parle d’une conduite sans exception ou de ce qui caractérise véritablement la foi et l’amour.'
    reason: Éviter d’importer une explication doctrinale absente du passage.
  - marker: c
    text: « Jusqu’à la fin » peut évoquer la persévérance dans le temps aussi bien que l’accomplissement jusqu’au terme.
    reason: Conserver l’ambiguïté de l’expression transmise par le témoin anglais en attendant la vérification grecque.
lexical_decisions:
- source_word: perfect / complete (Greek review pending)
  choice: accomplis
  rationale: Rend l’idée de maturité ou d’achèvement sans suggérer nécessairement une perfection absolue.
- source_word: true nobility
  choice: véritable noblesse
  rationale: Conserve l’image morale élevée du témoin, sans la réduire à la respectabilité sociale.
- source_word: professing faith
  choice: professe la foi
  rationale: Préserve le contraste entre déclaration et conduite qui structure le second paragraphe.
- source_word: the Work
  choice: l’Œuvre
  rationale: Maintient la majuscule du témoin fourni, tout en signalant dans la note l’incertitude de sa portée.
- source_word: found in the power of faith
  choice: demeure dans la puissance de la foi
  rationale: Formulation française naturelle qui conserve l’idée d’une fidélité effectivement vécue et persévérante.
theological_decisions:
- issue: Identification de la foi et de l’amour unis avec Dieu
  choice: Tous deux, unis, sont Dieu
  alternative: Leur unité vient de Dieu / tous deux conduisent à Dieu
  rationale: La formulation difficile du témoin est conservée sans harmonisation théologique ; une note avertit que la vérification grecque reste nécessaire.
- issue: Affirmations absolues sur le péché et la haine
  choice: Quiconque professe la foi ne pèche pas, et quiconque possède l’amour ne hait pas
  alternative: Celui qui vit réellement dans la foi ne persiste pas dans le péché
  rationale: Le caractère catégorique du texte est maintenu au lieu d’être atténué par une interprétation doctrinale ajoutée.
- issue: Persévérance finale
  choice: jusqu’à la fin
  alternative: parfaitement / jusqu’au but
  rationale: Conserve l’ambiguïté entre durée, accomplissement et terme eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe légèrement sentencieuse pour respecter le caractère exhortatif et aphoristique d’Ignace. Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe du grec de la recension moyenne reste indispensable.
