    issue: Relation de Paul aux « mystères » légèrement imprécise
    rationale: « Vous partagez les mystères avec Paul » peut suggérer qu’ils se répartissent des mystères, plutôt qu’ils sont associés à Paul dans ce domaine. Une formulation associative rend mieux le témoin sans explicitation confessionnelle.
  - severity: low
    issue: Ancrage de la note sur « chacune de ses lettres »
    rationale: La note b porte actuellement sur « Jésus-Christ », alors qu’elle concerne la portée de « dans chacune de ses lettres ». L’appel doit suivre « lettres ».
