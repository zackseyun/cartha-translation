base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: fr
  text: 'Je sais qui je suis et à qui j’écris. Moi, je suis un condamné ; vous, vous avez obtenu miséricorde. Moi, je suis en péril ; vous, vous êtes solidement établis.


    Vous êtes la grande route qu’empruntent ceux qui sont en chemin pour mourir pour Dieu.[a] Vous partagez les mystères avec Paul, qui a été sanctifié, qui a reçu un bon témoignage et qui est digne de toutes les félicitations. Puissé-je être trouvé marchant sur ses traces lorsque je parviendrai auprès de Dieu ! Dans chacune de ses lettres, il fait mention de vous en Jésus-Christ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour mourir à Dieu ». La tournure exacte devra être réévaluée lors de la vérification directe du grec.'
    reason: Le témoin anglais « die unto God » conserve une relation sémantique ambiguë que le français ne peut reproduire parfaitement.
  - marker: b
    text: La formulation « dans chacune de ses lettres » suit le témoin fourni. Une vérification du texte grec est nécessaire pour déterminer sa portée exacte.
    reason: L’énoncé peut sembler englober toutes les lettres de Paul, alors que sa formulation et sa référence précises dépendent du grec.
lexical_decisions:
- source_word: convict (English witness; Greek review pending)
  choice: condamné
  rationale: Conserve le statut judiciaire et la gravité du terme sans préciser au-delà du témoin fourni la forme exacte de détention.
- source_word: high-road (English witness; Greek review pending)
  choice: grande route
  rationale: Préserve l’image forte d’une voie publique empruntée par d’autres, plutôt que de la réduire à un simple exemple moral.
- source_word: associates in the mysteries (English witness; Greek review pending)
  choice: vous partagez les mystères
  rationale: Maintient le vocabulaire ancien et son ambiguïté religieuse, sans imposer une interprétation sacramentelle particulière.
- source_word: attain unto God (English witness; Greek review pending)
  choice: parviendrai auprès de Dieu
  rationale: Rend l’idée d’atteindre Dieu dans le contexte du martyre, tout en évitant une formulation française suggérant une assimilation à Dieu.
- source_word: obtained a good report (English witness; Greek review pending)
  choice: a reçu un bon témoignage
  rationale: Garde la notion d’attestation favorable, avec un vocabulaire naturel et bibliquement reconnaissable.
theological_decisions:
- issue: Sens de « die unto God »
  choice: mourir pour Dieu
  alternative: mourir à Dieu / mourir en Dieu
  rationale: Dans le contexte d’Ignace en route vers le martyre, « pour Dieu » exprime naturellement la destination et le dévouement sans résoudre davantage la nuance grecque, qui reste à vérifier.
- issue: Nature des « mystères » partagés avec Paul
  choice: Maintien du terme « mystères » sans explication doctrinale dans le corps du texte
  alternative: participer aux sacrements avec Paul / être initiés avec Paul
  rationale: Le témoin anglais ne permet pas de trancher entre plusieurs nuances possibles ; une précision confessionnelle serait injustifiée.
- issue: Portée de « every letter »
  choice: Dans chacune de ses lettres
  alternative: dans toute lettre / dans toute son épître
  rationale: Suit le témoin transmis tout en signalant en note la difficulté historique et textuelle possible de cette affirmation.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme « Moi… vous… » est conservé pour faire ressortir le contraste rhétorique. Cette version demeure provisoire, car le dossier fourni repose sur un témoin anglais du domaine public et indique que l’examen direct du grec de la recension moyenne reste à effectuer.
