revisions:
- from: 'J’ai donc fait ma part, en homme voué à l’unité. Mais là où règnent la division et la colère, Dieu ne demeure pas. Or le Seigneur pardonne à tous ceux qui se repentent, si, dans leur repentance, ils reviennent à l’unité de Dieu et au conseil de l’évêque. J’ai confiance en la grâce de Jésus-Christ, qui vous délivrera de toute entrave. Et je vous en supplie :


