  to: 'J’ai donc fait ma part, en homme formé pour l’unité. Mais là où règnent la division et la colère, Dieu ne demeure pas. Or le Seigneur pardonne à tous ceux qui se repentent, si, en se repentant, ils reviennent à l’unité de Dieu et au conseil de l’évêque. J’ai confiance en la grâce de Jésus-Christ, qui vous délivrera de toute entrave. Et je vous en supplie :


    Ne faites rien dans un esprit de parti, mais agissez selon l’enseignement du Christ. Car j’ai entendu certaines personnes dire : « Si je ne le trouve pas dans les archives[a], je ne le crois pas dans l’Évangile. » Lorsque je leur ai dit : « C’est écrit », elles m’ont répondu : « C’est là le point en question. » Mais pour moi, mes archives, c’est Jésus-Christ ; les archives inviolables, ce sont sa croix, sa mort, sa résurrection et la foi par lui[b]. C’est en cela que je désire être justifié par vos prières.'
