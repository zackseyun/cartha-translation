base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: fr
  text: 'J’ai donc fait ma part, en homme formé pour l’unité. Mais là où règnent la division et la colère, Dieu ne demeure pas. Or le Seigneur pardonne à tous ceux qui se repentent, si, en se repentant, ils reviennent à l’unité de Dieu et au conseil de l’évêque. J’ai confiance en la grâce de Jésus-Christ, qui vous délivrera de toute entrave. Et je vous en supplie :


    Ne faites rien dans un esprit de parti, mais agissez selon l’enseignement du Christ. Car j’ai entendu certaines personnes dire : « Si je ne le trouve pas dans les archives[a], je ne le crois pas dans l’Évangile. » Lorsque je leur ai dit : « C’est écrit », elles m’ont répondu : « C’est là le point en question. » Mais pour moi, mes archives, c’est Jésus-Christ ; les archives inviolables, ce sont sa croix, sa mort, sa résurrection et la foi par lui[b]. C’est en cela que je désire être justifié par vos prières.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « documents », « actes ». Le grec ἀρχεῖα désigne des écrits ou archives auxquels on fait appel comme à une autorité.'
    reason: Précise la plage lexicale de ἀρχεῖα et maintient l’image répétée dans le passage.
  - marker: b
    text: 'Ou : « la foi par son intermédiaire ». Le grec peut décrire la foi en relation avec le Christ sans préciser davantage cette relation.'
    reason: Conserve la réserve syntaxique et théologique de δι’ αὐτοῦ sans le confondre avec « en lui ».
lexical_decisions:
- source_word: charters (English witness; Greek review pending)
  choice: archives
  rationale: « Archives » conserve l’image de documents faisant autorité tout en rendant naturel le contraste répété avec Jésus-Christ et les événements du salut. Le terme reste provisoire en attendant la vérification du grec.
- source_word: council of the bishop (English witness; Greek review pending)
  choice: conseil de l’évêque
  rationale: Traduction formelle qui préserve l’ambiguïté entre le conseil donné par l’évêque et l’assemblée qui l’entoure, sans imposer une structure ecclésiologique précise.
- source_word: strike off every fetter
  choice: vous délivrera de toute entrave
  rationale: Rend idiomatiquement l’image de liens ôtés, sans préciser si les entraves sont morales, spirituelles ou communautaires.
- source_word: factiousness
  choice: esprit de parti
  rationale: Expression française actuelle qui désigne la conduite partisane et la formation de factions dans la communauté.
- source_word: justified
  choice: être reconnu juste
  rationale: Conserve la portée judiciaire et théologique de « justifié » tout en restant immédiatement intelligible.
theological_decisions:
- issue: Rapport entre repentance, pardon et retour à l’unité
  choice: Maintien de la condition formulée par « si »
  alternative: Reformuler le retour à l’unité comme simple conséquence du pardon
  rationale: Le témoin lie explicitement le pardon, la repentance et le retour à l’unité ; la traduction préserve cette tension sans construire une doctrine systématique.
- issue: « Unity of God »
  choice: « l’unité de Dieu »
  alternative: « l’unité avec Dieu »
  rationale: La formulation littérale garde l’ambiguïté entre l’unité qui appartient à Dieu et l’union avec Dieu.
- issue: Nature des « archives » inviolables
  choice: La croix, la mort, la résurrection et la foi venant par le Christ
  alternative: Faire de la foi une simple réponse humaine distincte des archives
  rationale: La syntaxe du témoin inclut ces éléments dans l’énumération, mais sa relation exacte à « archives » demeure tendue ; la traduction ne la résout pas artificiellement.
- issue: Justification et prières des destinataires
  choice: « grâce à vos prières »
  alternative: « dans vos prières » ou « par vos prières »
  rationale: Cette formulation exprime le rôle demandé aux prières sans attribuer mécaniquement aux destinataires la cause de la justification.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes (« archives », « unité ») sont conservées. La traduction reste explicitement prudente, car le dossier ne fournit pas le texte grec et indique qu’une révision directe de la langue source est en attente.
