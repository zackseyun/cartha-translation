base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: fr
  text: 'Si tu aimes les disciples qui sont bons, tu n’en as aucun mérite. Soumets plutôt les plus difficiles par la douceur. Toutes les blessures ne se soignent pas avec le même remède. Calme les douleurs aiguës avec des compresses.


    En toutes choses, sois prudent comme le serpent et toujours pur comme la colombe. Tu es fait de chair et d’esprit afin de t’adapter avec tact[a] à ce qui se présente devant tes yeux. Quant aux réalités invisibles, demande qu’elles te soient révélées, afin que tu ne manques de rien, mais que tu abondes en tout don spirituel.


    Le temps présent a besoin de toi, comme les pilotes ont besoin des vents et le marin battu par la tempête, d’un port, afin que tu parviennes jusqu’à Dieu.[b] Reste vigilant, comme un athlète de Dieu. Le prix, c’est l’incorruptibilité et la vie éternelle, dont toi aussi tu es convaincu. En toutes choses, je me donne pour toi[c], moi ainsi que mes chaînes, que tu as aimées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se rendre par « ménager » ou, plus littéralement, « flatter » les réalités qui se présentent devant toi; l’idée semble être de savoir les traiter avec discernement.
    reason: Le verbe κολακεύῃς est inhabituel ici et porte une nuance difficile à restituer sans ambiguïté.
  - marker: b
    text: 'Autrement dit : atteindre le but qui est Dieu, ou parvenir à l’union avec lui.'
    reason: L’idiome ignatien « parvenir jusqu’à Dieu » est théologiquement dense et peut sembler inhabituel en français.
  - marker: c
    text: 'Littéralement : « je suis donné en échange pour toi ». C’est une vive expression d’affection et de dévouement, qui peut aller jusqu’à l’idée d’offrir sa vie.'
    reason: Le nom ἀντίψυχον n’a pas d’équivalent français direct et sa force sacrificielle mérite d’être signalée.
lexical_decisions:
- source_word: μαθητάς
  choice: disciples
  rationale: Le terme peut désigner des élèves ou des disciples. « Disciples » convient au cadre d’accompagnement ecclésial sans limiter le propos à l’enseignement scolaire.
- source_word: λοιμοτέρους
  choice: les plus difficiles
  rationale: Le comparatif est fortement péjoratif (« plus nuisibles », « plus turbulents »). « Les plus difficiles » exprime naturellement les personnes dont la conduite exige davantage de patience, sans leur attribuer une essence malfaisante.
- source_word: πραΰτητι
  choice: par la douceur
  rationale: Rend la douceur maîtrisée, et non la faiblesse, qui caractérise la manière d’exercer l’autorité.
- source_word: ἐμβροχαῖς
  choice: avec des compresses
  rationale: Désigne des applications humides ou fomentations médicales. « Compresses » est clair en français moderne et maintient l’image thérapeutique.
- source_word: ἄφθαρσία
  choice: incorruptibilité
  rationale: Conserve le terme théologique et eschatologique, qui peut évoquer à la fois l’absence de corruption et l’immortalité.
- source_word: ἀντίψυχον
  choice: je me donne pour toi
  rationale: Expression idiomatique de dévouement intense, littéralement liée à l’idée de donner sa vie en échange. La traduction principale reste naturelle et une note signale la force de l’expression.
theological_decisions:
- issue: Relation entre la chair et l’esprit
  choice: « fait de chair et d’esprit »
  alternative: « charnel et spirituel »
  rationale: La formulation retenue conserve les deux dimensions de la personne sans faire de « charnel » un jugement moral négatif que le contexte n’impose pas.
- issue: Finalité exprimée par εἰς τὸ θεοῦ ἐπιτυχεῖν
  choice: « afin que tu parviennes jusqu’à Dieu »
  alternative: « afin qu’il parvienne jusqu’à Dieu »
  rationale: L’infinitif de but se rapporte naturellement au destinataire requis par le temps présent. Le pronom ambigu de certains relais anglais n’a pas de correspondant explicite dans le grec et ne doit donc pas être artificiellement reproduit.
- issue: Sens de ἄφθαρσία
  choice: « incorruptibilité »
  alternative: « immortalité »
  rationale: « Incorruptibilité » préserve l’étendue du terme et son lien traditionnel avec la transformation eschatologique, sans le réduire à la seule durée infinie.
- issue: Portée de χάρισμα
  choice: « tout don spirituel »
  alternative: « toute grâce »
  rationale: Dans ce contexte, le mot évoque ce qui est accordé par Dieu pour équiper le croyant. « Don spirituel » préserve cette portée sans préciser un type particulier de charisme.
translation_notes:
  register: Français international moderne, digne et pastoral. Les impératifs restent directs sans devenir cassants. Les métaphores médicales, nautiques et athlétiques sont conservées. La traduction suit prioritairement les lectures lexicales attestées dans la tradition grecque de la recension moyenne, tout en tenant compte du témoin anglais fourni; les endroits particulièrement incertains ou idiomatiques sont signalés en note.
