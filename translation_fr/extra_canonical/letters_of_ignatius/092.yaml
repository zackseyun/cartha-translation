review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire à plusieurs endroits. Le comparatif λοιμοτέρους ne doit pas être affaibli en « les plus difficiles » : l’image est celle de personnes plus gravement atteintes ou plus nocives. ἀκέραιος signifie « sans malice / innocent », plutôt que « pur ». νῆφε commande d’être sobre et vigilant, non seulement vigilant. La tournure relative aux réalités visibles doit conserver, avec une note, la nuance inhabituelle de κολακεύειν (« ménager », littéralement « flatter »).'
  naturalness: Le français est globalement fluide et pastoral. Les corrections proposées maintiennent un registre moderne, direct et digne. « Sois sobre » est naturel dans cette exhortation antique; « sans malice » rend clairement le contraste avec le serpent prudent.
  terminology: '« Disciples » est recevable dans ce contexte ecclésial, conformément au témoin anglais, mais l’attribution lexicale à μαθητάς ne peut être retenue sans réserve : la tradition grecque usuelle porte une formulation différente. « Incorruptibilité », « don spirituel » et « compresses » conviennent. La note interprétant l’arrivée à Dieu comme une « union » dépasse inutilement le texte et est supprimée.'
  issues:
  - severity: medium
    issue: « les plus difficiles » affaiblit le comparatif λοιμοτέρους.
    rationale: Le mot est nettement péjoratif et relève de l’image de la maladie ou de la nocivité. « Les plus atteints » conserve l’image sans essentialiser les personnes.
  - severity: medium
    issue: « pur comme la colombe » ne rend pas précisément ἀκέραιος.
    rationale: Le terme évoque l’innocence, l’intégrité et l’absence de malice; « sans malice comme la colombe » est plus exact et plus clair.
  - severity: medium
    issue: « Reste vigilant » ne rend qu’une partie de νῆφε.
    rationale: L’impératif appelle d’abord à la sobriété et, par extension, à la vigilance. « Sois sobre et vigilant » préserve les deux dimensions.
  - severity: medium
    issue: La note b ajoute l’idée d’« union avec Dieu ».
    rationale: εἰς τὸ θεοῦ ἐπιτυχεῖν exprime l’atteinte de Dieu comme but; le texte ne précise pas une doctrine de l’union. La traduction directe suffit.
  - severity: low
    issue: La formulation principale « t’adapter avec tact » explicite trop librement κολακεύῃς.
    rationale: « Saches ménager » est plus proche tout en restant français; la note conserve la possibilité littérale « flatter ».
  revised_text: 'Si tu aimes les bons disciples, tu n’en as aucun mérite. Soumets plutôt les plus atteints par la douceur. Toutes les blessures ne se soignent pas avec le même remède. Calme les douleurs aiguës avec des compresses.


    En toutes choses, sois prudent comme le serpent et toujours sans malice comme la colombe. Tu es fait de chair et d’esprit afin que tu saches ménager[a] ce qui se présente devant tes yeux. Quant aux réalités invisibles, demande qu’elles te soient révélées, afin que tu ne manques de rien, mais que tu abondes en tout don spirituel.


    Le temps présent a besoin de toi, comme les pilotes ont besoin des vents et le marin battu par la tempête, d’un port, afin que tu parviennes jusqu’à Dieu. Sois sobre et vigilant, comme un athlète de Dieu. Le prix, c’est l’incorruptibilité et la vie éternelle, dont toi aussi tu es convaincu. En toutes choses, je me donne pour toi[b], moi ainsi que mes chaînes, que tu as aimées.'
  revised_footnotes:
  - marker: a
    text: Le verbe grec peut aussi se rendre par « flatter »; dans ce contexte, il semble évoquer l’art de ménager ou de traiter avec discernement ce qui se présente à toi.
    reason: κολακεύειν est inhabituel dans cette exhortation et sa nuance ne se laisse pas rendre par un seul mot français.
  - marker: b
    text: Littéralement, l’expression désigne quelqu’un qui est donné « en échange de la vie » d’un autre. Elle exprime ici un dévouement extrême, pouvant aller jusqu’au don de sa vie.
    reason: ἀντίψυχον est une expression idiomatique forte, dont « je me donne pour toi » restitue le sens général sans en reproduire toute la densité.
  revision_rationale: La révision corrige les affaiblissements lexicaux et les glissements interprétatifs, tout en conservant les images médicales, nautiques et athlétiques ainsi que le ton pastoral. La note sur l’arrivée à Dieu est retirée parce qu’elle ajoutait une explicitation théologique non imposée par le grec. Les ancres sont renumérotées de façon cohérente après cette suppression.
