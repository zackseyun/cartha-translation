review_pass:
  verdict: revise
  source_fidelity: Le fond christologique et la structure de la confession sont bien conservés. Toutefois, « par le sang du Christ » impose une relation instrumentale que le grec (ἐν ... ἐν αἵματι Χριστοῦ) et le témoin anglais ne précisent pas. La dernière proposition est une proposition de but et doit être rendue comme telle. La référence de « dont nous sommes le fruit » doit également être explicitée sans introduire « de cela ».
  naturalness: Le français est généralement soutenu, clair et naturel. « Pour tous les âges » est toutefois un calque peu idiomatique dans ce contexte; « pour les siècles » rend mieux la portée durable de l’étendard. La ponctuation de l’incise peut être simplifiée.
  terminology: « Le Dieu », « selon la chair », « Fils de Dieu », « passion », « tétrarque » et « étendard » sont appropriés. « Non-Juifs » est actuel et convient ici. « Dans l’amour, dans le sang du Christ » préserve le parallélisme sans interprétation ajoutée.
  issues:
  - severity: medium
    issue: Relation entre l’amour et le sang du Christ surinterprétée
    rationale: « par le sang du Christ » transforme les deux compléments introduits par ἐν en un rapport causal ou instrumental. Le texte permet plutôt de les maintenir en parallèle.
  - severity: medium
    issue: Proposition finale de but rendue à l’indicatif
    rationale: Le sens est « afin qu’il élève/dresse un étendard », et non l’assertion indépendante « il dresse ». La note existante reconnaît cette valeur mais le texte doit la porter.
  - severity: low
    issue: Antécédent de « cela » insuffisamment explicite
    rationale: L’incise renvoie à la passion bénie du Christ. « Dont nous sommes le fruit » conserve cette référence plus exactement et plus élégamment.
  - severity: low
    issue: « Pour tous les âges » est peu naturel
    rationale: Dans cette image d’un étendard durable, « pour les siècles » est un français plus idiomatique et conserve la portée temporelle.
  revised_text: 'Je rends gloire à Jésus-Christ, le Dieu qui vous a accordé une telle sagesse. J’ai en effet constaté que vous êtes établis dans une foi inébranlable, comme cloués à la croix du Seigneur Jésus-Christ dans la chair et dans l’esprit, et solidement enracinés dans l’amour, dans le sang du Christ.[a] Vous êtes pleinement convaincus, au sujet de notre Seigneur, qu’il est véritablement de la lignée de David selon la chair, mais Fils de Dieu par la volonté et la puissance divines ; qu’il est véritablement né d’une vierge et a été baptisé par Jean afin que toute justice soit accomplie par lui ;[b]


    qu’il a véritablement été cloué à la croix dans la chair pour nous, sous Ponce Pilate et Hérode le tétrarque — dont nous sommes le fruit, c’est-à-dire le fruit de sa très bienheureuse passion — ; et afin que, par sa résurrection, il dresse un étendard pour les siècles, pour ses saints et ses fidèles, qu’ils soient parmi les Juifs ou parmi les non-Juifs, dans l’unique corps de son Église.[c]'
  revised_footnotes:
  - marker: a
    text: 'La construction ancienne est très resserrée : « dans l’amour, dans le sang du Christ » peut décrire deux sphères parallèles, ou rattacher plus étroitement le sang du Christ à l’enracinement dans l’amour.'
    reason: Préserver l’ambiguïté syntaxique sans imposer une relation instrumentale.
  - marker: b
    text: 'On peut aussi traduire : « afin qu’il accomplisse toute justice ».'
    reason: Signaler la formulation active possible, tout en conservant la tournure passive du témoin fourni.
  - marker: c
    text: Le terme rendu par « passion » désigne ici les souffrances et la mort du Christ. « Afin que » rend la nuance de but de la proposition finale.
    reason: Éclairer le terme historique et expliciter la valeur syntaxique sans ajouter d’interprétation doctrinale.
  revision_rationale: 'La révision conserve les choix lexicaux solides du projet, mais corrige trois points de fidélité : le parallélisme « dans l’amour, dans le sang du Christ », la référence directe à la passion, et la proposition finale de but. Elle améliore aussi l’idiomaticité de la formulation temporelle en français.'
