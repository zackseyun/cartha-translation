  witness_license: Public domain witness
  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: fr
  text: 'Je rends gloire à Jésus-Christ, le Dieu qui vous a accordé une telle sagesse. J’ai en effet constaté que vous êtes établis dans une foi inébranlable, comme cloués à la croix du Seigneur Jésus-Christ dans la chair et dans l’esprit, et solidement enracinés dans l’amour par le sang du Christ.[a] Vous êtes pleinement convaincus, au sujet de notre Seigneur, qu’il est véritablement de la lignée de David selon la chair, mais Fils de Dieu par la volonté et la puissance divines ; qu’il est véritablement né d’une vierge et a été baptisé par Jean afin que toute justice soit accomplie par lui ;[b]


    qu’il a véritablement été cloué à la croix dans la chair pour nous, sous Ponce Pilate et Hérode le tétrarque — et nous sommes le fruit de cela, c’est-à-dire de sa très bienheureuse passion — ; et que, par sa résurrection, il dresse un étendard pour tous les âges, en faveur de ses saints et de ses fidèles, qu’ils soient parmi les Juifs ou parmi les non-Juifs, dans l’unique corps de son Église.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction ancienne est très resserrée : « par le sang du Christ » peut se rattacher à l’enracinement dans l’amour, ou être compris comme une expression parallèle décrivant le fondement de cet amour.'
    reason: Préserver une ambiguïté syntaxique réelle du témoin disponible.
  - marker: b
    text: 'On peut aussi traduire : « afin qu’il accomplisse toute justice ».'
    reason: Signaler la variante naturelle correspondant à l’allusion à Matthieu 3.15 et à la relation d’agent.
  - marker: c
    text: 'Le terme rendu par « passion » désigne ici les souffrances et la mort du Christ. La proposition peut aussi avoir une nuance de but : « afin que, par sa résurrection, il dresse un étendard… »'
    reason: Éclairer un terme théologique historique et conserver la nuance finale possible de la syntaxe.
lexical_decisions:
- source_word: the God
  choice: le Dieu
  rationale: Conserve l’affirmation christologique explicite du témoin, qui qualifie directement Jésus-Christ de Dieu, sans l’atténuer.
- source_word: established in faith immovable
  choice: établis dans une foi inébranlable
  rationale: Reproduit l’image de stabilité tout en restant naturel en français moderne.
- source_word: in flesh and in spirit
  choice: dans la chair et dans l’esprit
  rationale: Maintient le parallélisme et l’ambiguïté quant à l’application exacte de ces deux termes.
- source_word: of the race of David according to the flesh
  choice: de la lignée de David selon la chair
  rationale: « Lignée » exprime clairement l’ascendance, tandis que « selon la chair » conserve la formulation théologique ancienne.
- source_word: passion
  choice: passion
  rationale: Le terme français traditionnel désigne ici les souffrances et la mort du Christ ; une note en éclaire le sens courant.
- source_word: ensign
  choice: étendard
  rationale: Préserve l’image publique d’un signe élevé et rassembleur, plutôt que de la réduire à une idée abstraite.
- source_word: Gentiles
  choice: non-Juifs
  rationale: Formulation actuelle et immédiatement compréhensible, sans connotations modernes indésirables de « païens ».
theological_decisions:
- issue: Lien entre l’amour et le sang du Christ
  choice: solidement enracinés dans l’amour par le sang du Christ
  alternative: solidement enracinés dans l’amour, dans le sang du Christ
  rationale: Le témoin anglais est syntaxiquement compact et la relation exacte demeure difficile. Le rendu choisi est lisible, mais la note signale l’autre rattachement possible sans trancher davantage.
- issue: Accomplissement de toute justice
  choice: afin que toute justice soit accomplie par lui
  alternative: afin qu’il accomplisse toute justice
  rationale: La tournure passive conserve le témoin fourni et laisse ouverte la nuance d’agent exprimée par « par lui ».
- issue: But ou résultat de la résurrection
  choice: et que, par sa résurrection, il dresse un étendard
  alternative: afin que, par sa résurrection, il dresse un étendard
  rationale: Dans la longue série introduite par la conviction des destinataires, l’indicatif français évite de suggérer que la résurrection elle-même serait seulement un moyen envisagé. Une note conserve la nuance finale possible du témoin.
- issue: Unité ecclésiale des Juifs et des non-Juifs
  choice: dans l’unique corps de son Église
  alternative: dans un seul corps, celui de son Église
  rationale: Conserve l’affirmation d’un corps ecclésial unique sans développer une ecclésiologie confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible, avec conservation des images anciennes (« cloués », « enracinés », « étendard ») et du vocabulaire christologique (« selon la chair », « passion »). Projet provisoire fondé sur le témoin anglais public fourni ; la révision directe du grec de la recension moyenne reste nécessaire.
