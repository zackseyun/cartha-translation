base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: fr
  text: 'Appliquez-vous donc à vous réunir plus souvent pour rendre grâce à Dieu et pour sa gloire. Car, lorsque vous vous réunissez fréquemment, les puissances de Satan sont renversées, et ses œuvres destructrices sont réduites à néant par l’accord de votre foi.


    Rien n’est meilleur que la paix : en elle prend fin toute guerre menée par les êtres célestes et terrestres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute guerre des réalités célestes et terrestres est abolie ». Le témoin anglais permet aussi de comprendre que le conflit concerne les choses du ciel et de la terre, plutôt que des êtres qui combattent.'
    reason: Préserver l’ambiguïté syntaxique et conceptuelle du témoin disponible, dans l’attente d’une vérification directe du grec.
lexical_decisions:
- source_word: thanksgiving
  choice: rendre grâce
  rationale: Expression française naturelle qui conserve le sens religieux de l’action de grâce sans imposer ici le terme technique « eucharistie » sur la seule base du témoin anglais.
- source_word: concord
  choice: accord
  rationale: « Accord » rend l’unité harmonieuse de la foi dans un français actuel et digne; « concorde » serait possible, mais plus marqué et moins courant.
- source_word: mischief
  choice: œuvres destructrices
  rationale: Le terme anglais ancien désigne ici l’action nuisible ou funeste de Satan; cette formulation évite le trop faible « méfaits » et le plus abstrait « malice ».
- source_word: powers of Satan
  choice: puissances de Satan
  rationale: Maintient la portée potentiellement personnelle ou spirituelle de « powers » au lieu de la réduire à une simple influence.
- source_word: abolished
  choice: prend fin
  rationale: Formulation idiomatique convenant à la cessation de la guerre, sans suggérer nécessairement une abolition juridique.
theological_decisions:
- issue: Sens sacramentel possible de « thanksgiving »
  choice: rendre grâce
  alternative: célébrer l’eucharistie
  rationale: En l’absence de révision directe du grec, la traduction ne tranche pas entre l’action de grâce au sens général et une éventuelle allusion au rassemblement eucharistique.
- issue: Agent ou domaine du dernier conflit
  choice: guerre menée par les êtres célestes et terrestres
  alternative: guerre des réalités célestes et terrestres
  rationale: Le témoin anglais est ambigu. La traduction principale adopte une lecture personnelle plausible tout en signalant l’autre possibilité en note.
- issue: Effet de l’unité de foi
  choice: réduites à néant par l’accord de votre foi
  alternative: échouent dans l’accord de votre foi
  rationale: Conserve l’affirmation forte du texte selon laquelle l’action nuisible de Satan devient inefficace au sein de l’unité croyante, sans préciser un mécanisme doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel reflète l’adresse communautaire. Projet provisoire établi à partir du témoin anglais public fourni; une révision directe de la tradition grecque de la recension moyenne reste nécessaire.
