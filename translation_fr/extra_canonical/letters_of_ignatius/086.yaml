base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: fr
  text: 'Vous avez bien fait d’accueillir Philon et Rhaios Agathopous, qui m’ont accompagné pour la cause de Dieu, comme des serviteurs de [Christ] Dieu.[a] Eux aussi rendent grâce au Seigneur à votre sujet, parce que vous les avez réconfortés de toutes les manières. Rien de cela ne sera perdu pour vous.


    Mon esprit se donne pour vous, tout comme mes chaînes, que vous n’avez pas méprisées et dont vous n’avez pas eu honte. Celui qui est la fidélité parfaite, Jésus-Christ, n’aura pas non plus honte de vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « Christ » est placé entre crochets dans le témoin utilisé, ce qui signale une restauration ou une incertitude textuelle. La formulation « [Christ] Dieu » est donc conservée sans harmonisation.
    reason: Rendre visible au lecteur l’état incertain du texte transmis par la base documentaire fournie.
lexical_decisions:
- source_word: Philo and Rhaius Agathopus
  choice: Philon et Rhaios Agathopous
  rationale: Translittération française prudente des noms grecs, sans les remplacer par leurs formes anglaises.
- source_word: followed me
  choice: m’ont accompagné
  rationale: Exprime naturellement le fait d’avoir suivi Ignace dans son déplacement ou son service, sans préciser davantage une relation dont le témoin anglais laisse la nature ouverte.
- source_word: in the cause of God
  choice: pour la cause de Dieu
  rationale: Conserve la formulation large du témoin, qui peut viser le service, la mission ou les circonstances subies pour Dieu.
- source_word: ministers
  choice: serviteurs
  rationale: Terme français accessible et digne, qui n’impose pas un office ecclésiastique précis.
- source_word: refreshed them
  choice: les avez réconfortés
  rationale: Rend l’idée d’un soulagement bienfaisant et concret tout en restant naturel en français moderne.
- source_word: My spirit is devoted for you
  choice: Mon esprit se donne pour vous
  rationale: Préserve la force d’une formule de dévouement personnel sans introduire une interprétation sacrificielle trop précise.
- source_word: perfect faithfulness
  choice: la fidélité parfaite
  rationale: Maintient la personnification et l’identification christologique du témoin au lieu d’aplatir l’expression en simple adjectif.
theological_decisions:
- issue: Lecture « [Christ] God »
  choice: '[Christ] Dieu'
  alternative: Dieu / le Christ Dieu
  rationale: Les crochets sont conservés comme signal de restauration ou d’incertitude textuelle fourni par le témoin; la syntaxe difficile n’est pas harmonisée silencieusement.
- issue: Identification de celui qui est « la fidélité parfaite »
  choice: Celui qui est la fidélité parfaite, Jésus-Christ
  alternative: Celui qui est parfaitement fidèle, Jésus-Christ
  rationale: La formulation nominale conserve la tension rhétorique et théologique du témoin, tandis que l’alternative adjectivale l’interpréterait davantage.
- issue: Rétribution promise
  choice: Rien de cela ne sera perdu pour vous
  alternative: Vous ne perdrez rien
  rationale: « De cela » relie prudemment la promesse à l’accueil et au réconfort accordés, sans définir la nature de la récompense.
translation_notes:
  register: Français international moderne, digne et lisible. Tutoiement collectif rendu par « vous ». La traduction demeure provisoire puisque la révision directe du grec est indiquée comme en attente; elle conserve les crochets et les ambiguïtés du témoin public fourni.
