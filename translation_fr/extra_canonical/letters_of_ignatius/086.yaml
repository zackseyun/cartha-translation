review_pass:
  verdict: revise
  source_fidelity: 'Le grec de la recension moyenne appelle quelques corrections substantielles par rapport au pont anglais : διακόνους θεοῦ [Χριστοῦ] se rend naturellement « serviteurs de Dieu [Christ] », et non « de [Christ] Dieu » ; οὐδὲν ἀπολεῖται ne contient pas « de cela » ; ἀντίψυχον exprime un gage ou une rançon de substitution plus fortement que le simple dévouement ; enfin ἡ τελεία πίστις est littéralement « la foi parfaite », sans qu’il soit sûr de la réduire à « la fidélité parfaite ».'
  naturalness: La version révisée reste en français international moderne. « Ma vie est en gage pour vous » rend de façon idiomatique l’image difficile d’ἀντίψυχον sans lui imposer une théorie sacrificielle. La reprise « la foi parfaite, Jésus-Christ » conserve la personnification et l’apposition du grec, malgré sa formulation volontairement dense.
  terminology: « Serviteurs » ne préjuge pas d’un office technique pour διάκονοι. Les crochets sont déplacés après « Dieu » conformément à l’ordre et à la portée du supplément textuel attestés par le grec. « Foi » est retenu pour πίστις ; le contexte permet une nuance de fidélité, mais ne justifie pas de supprimer le terme de foi.
  issues:
  - severity: medium
    issue: Portée et place du texte entre crochets
    rationale: 'Le témoin grec porte θεοῦ [Χριστοῦ] : le supplément concerne « Christ » après « Dieu ». « serviteurs de [Christ] Dieu » inverse cette présentation et produit une syntaxe française trompeuse.'
  - severity: medium
    issue: « Rien de cela » ajoute un référent absent du texte
    rationale: La formule οὐδὲν ἀπολεῖται ὑμῖν dit seulement que rien ne sera perdu pour les destinataires. L’ajout « de cela » interprète la portée de la promesse.
  - severity: medium
    issue: « Mon esprit se donne pour vous » affaiblit ἀντίψυχον
    rationale: Le mot exprime l’idée d’une vie/âme donnée en contrepartie, d’un gage ou d’une rançon. « Se donne » ne conserve pas cette notion de substitution ou de garantie.
  - severity: medium
    issue: « fidélité parfaite » traduit interprétativement πίστις
    rationale: πίστις signifie d’abord « foi » ici, même si l’expression personnifiée peut évoquer la fidélité. « La foi parfaite » préserve mieux l’ambiguïté du grec.
  revised_text: 'Vous avez bien fait d’accueillir Philon et Rhaios Agathopous, qui m’ont suivi pour la cause de Dieu, comme des serviteurs de Dieu [Christ].[a] Eux aussi rendent grâce au Seigneur à votre sujet, parce que vous les avez réconfortés de toutes les manières. Rien ne sera perdu pour vous.


    Ma vie est en gage pour vous, tout comme mes chaînes, que vous n’avez pas méprisées et dont vous n’avez pas eu honte. La foi parfaite, Jésus-Christ, n’aura pas non plus honte de vous.'
  revised_footnotes:
  - marker: a
    text: Le mot « Christ » est placé entre crochets dans le témoin utilisé, après « Dieu ». Les crochets signalent une restauration ou une incertitude textuelle ; la formulation est donc conservée sans harmonisation.
    reason: Rendre visible la portée exacte du supplément textuel tout en conservant la syntaxe du témoin.
  revision_rationale: Révision nécessaire pour corriger la place du supplément [Christ], retirer un ajout interprétatif, mieux rendre l’image de ἀντίψυχον et conserver le sens premier de πίστις. Le rendu de « pour la cause de Dieu » est maintenu provisoirement, car la base fournie est un témoin anglais et l’expression grecque correspondante demeure idiomatiquement ouverte dans ce contexte.
