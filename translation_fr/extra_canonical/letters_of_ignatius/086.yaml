source:
  text: 'Philo and Rhaius Agathopus, who followed me in the cause of God, ye did well to receive as ministers of [Christ] God; who also give thanks to the Lord for you, because ye refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which ye despised not, neither were ashamed of them. Nor shall He, who is perfect faithfulness, be ashamed of you, even Jesus Christ.'
