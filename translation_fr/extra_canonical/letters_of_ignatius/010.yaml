revisions:
- from: 'Mais j’ai appris que certaines personnes venues de là-bas sont passées parmi vous, apportant un enseignement mauvais. Vous ne les avez pas laissées semer en vous, car vous vous êtes bouché les oreilles afin de ne pas recevoir la semence qu’elles répandaient. En effet, vous êtes les pierres d’un temple, préparées d’avance pour l’édifice de Dieu le Père. Vous êtes hissés vers les hauteurs par la machine de levage de Jésus Christ — la croix —, avec l’Esprit Saint pour câble. Votre foi est le treuil, et l’amour, le chemin qui monte vers Dieu.


    Vous êtes donc tous compagnons de route, portant votre Dieu et votre sanctuaire, votre Christ et vos objets sacrés, revêtus de la tête aux pieds des commandements de Jésus Christ. Moi aussi, associé à la fête, il m’est accordé de cheminer avec vous par cette lettre et de me réjouir avec vous, parce que vous ne mettez votre amour en rien de ce qui relève de la vie ordinaire des êtres humains, mais en Dieu seul.'
  to: 'Mais j’ai appris que certaines personnes venues de là-bas sont passées parmi vous, apportant un enseignement mauvais. Vous ne les avez pas laissées semer en vous, car vous avez fermé vos oreilles afin de ne pas recevoir la semence qu’elles répandaient. En effet, vous êtes les pierres d’un temple, préparées d’avance pour l’édifice de Dieu le Père. Vous êtes hissés vers les hauteurs par la machine de levage de Jésus Christ — la croix —, avec l’Esprit Saint pour câble. Votre foi est votre treuil, et l’amour est le chemin qui monte vers Dieu.


    Vous êtes donc tous participants au même chemin, porteurs de Dieu, du sanctuaire, du Christ et des choses saintes, revêtus de la tête aux pieds des commandements de Jésus Christ. Moi aussi, associé à la fête, il m’est accordé, par cette lettre, de cheminer avec vous et de me réjouir avec vous, afin que vous n’aimiez rien selon la vie commune des êtres humains, mais seulement selon Dieu.'
  rationale: 'La révision corrige surtout deux points de fidélité au grec: la série répétée des « porteurs de » et le contraste final entre « selon la vie commune » et « selon Dieu ». Elle améliore aussi l’idiomaticité sans rationaliser les images architecturales et cultuelles du passage. Aucun appel de note n’est présent ni nécessaire.'
