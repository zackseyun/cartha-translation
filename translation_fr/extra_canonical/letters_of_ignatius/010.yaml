base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: fr
  text: 'Mais j’ai appris que certaines personnes venues de là-bas sont passées parmi vous, apportant un enseignement mauvais. Vous ne les avez pas laissées semer en vous, car vous avez fermé vos oreilles afin de ne pas recevoir la semence qu’elles répandaient. En effet, vous êtes les pierres d’un temple, préparées d’avance pour l’édifice de Dieu le Père. Vous êtes hissés vers les hauteurs par la machine de levage de Jésus Christ — la croix —, avec l’Esprit Saint pour câble. Votre foi est votre treuil, et l’amour est le chemin qui monte vers Dieu.


    Vous êtes donc tous participants au même chemin, porteurs de Dieu, du sanctuaire, du Christ et des choses saintes, revêtus de la tête aux pieds des commandements de Jésus Christ. Moi aussi, associé à la fête, il m’est accordé, par cette lettre, de cheminer avec vous et de me réjouir avec vous, afin que vous n’aimiez rien selon la vie commune des êtres humains, mais seulement selon Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evil doctrine (Greek review pending)
  choice: un enseignement mauvais
  rationale: Expression naturelle qui conserve le jugement négatif du témoin sans préciser davantage le contenu doctrinal.
- source_word: 'engine / lifting device (Greek: μηχανή, source review pending)'
  choice: machine de levage
  rationale: Préserve l’image concrète d’un chantier où les pierres sont hissées, tout en restant compréhensible en français moderne.
- source_word: rope (Greek review pending)
  choice: câble
  rationale: Dans la métaphore de construction, « câble » s’accorde plus naturellement avec une machine de levage moderne que « corde », sans changer la fonction de l’image.
- source_word: windlass (Greek review pending)
  choice: treuil
  rationale: Terme français précis et accessible pour le mécanisme de levage associé à la foi.
- source_word: companions in the way
  choice: compagnons de route
  rationale: Rend naturellement l’idée de personnes cheminant ensemble, tout en maintenant le motif de la voie qui mène à Dieu.
- source_word: shrine
  choice: sanctuaire
  rationale: Conserve la dimension cultuelle sans imposer l’idée plus précise d’un reliquaire.
- source_word: holy things
  choice: objets sacrés
  rationale: Maintient la distinction avec « votre Christ » et « votre sanctuaire »; le sens exact devra être vérifié sur le grec.
- source_word: common life of men
  choice: la vie ordinaire des êtres humains
  rationale: Évite le masculin générique marqué et conserve le contraste entre le mode de vie humain commun et l’amour placé en Dieu.
theological_decisions:
- issue: Relation entre Jésus Christ et la croix dans l’image de levage
  choice: « la machine de levage de Jésus Christ — la croix — »
  alternative: « la machine qu’est la croix de Jésus Christ »
  rationale: La ponctuation conserve l’apposition du témoin, selon laquelle la machine de Jésus Christ est identifiée à la croix, sans développer une interprétation théologique supplémentaire.
- issue: Rôle de l’Esprit Saint dans la métaphore
  choice: « avec l’Esprit Saint pour câble »
  alternative: « l’Esprit Saint vous servant de corde »
  rationale: Préserve l’identification métaphorique directe et la coordination des rôles de la croix, de l’Esprit, de la foi et de l’amour.
- issue: Formule « portant votre Dieu »
  choice: conservation littérale de « portant votre Dieu »
  alternative: « portant Dieu en vous »
  rationale: La formulation saisissante et potentiellement ambiguë est maintenue; ajouter « en vous » résoudrait sans preuve la nature exacte de cette relation.
- issue: Objet exclusif de l’amour
  choice: « mais en Dieu seul »
  alternative: « mais seulement les choses de Dieu »
  rationale: Le témoin oppose explicitement la vie humaine commune à Dieu; la traduction garde cette tension ascétique sans l’atténuer ni l’amplifier.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement collectif est rendu par « vous ». Les métaphores enchaînées du temple, du chantier, du levage et du chemin sont conservées plutôt que lissées. Le texte fourni étant un témoin anglais public et la vérification directe du grec de la recension moyenne restant à faire, les choix les plus sensibles — notamment « sanctuaire », « objets sacrés » et la dernière proposition — demeurent provisoires.
