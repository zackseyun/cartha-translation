review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire au regard du grec de la recension moyenne. La construction finale κατὰ τὸν κοινὸν βίον ... κατὰ θεόν se rend plus fidèlement par « selon la vie commune ... selon Dieu » que par « en Dieu seul ». La série θεοφόροι, ναοφόροι, χριστοφόροι, ἁγιοφόροι décrit littéralement des personnes « porteuses de »; les possessifs français (« votre Dieu », etc.) ne sont pas requis par le grec. L’image technique (μηχανή, σχοινίον, ἀναγωγεύς) est globalement bien conservée.
  naturalness: Le texte est lisible et conserve heureusement les métaphores de construction. Toutefois, « vous vous êtes bouché les oreilles » est moins fluide ici que « vous avez fermé vos oreilles », et « vous ne mettez votre amour en rien » est peu idiomatique et s’éloigne de la syntaxe source. « Participants au même chemin » rend plus explicitement σύνοδοι tout en restant naturel.
  terminology: « enseignement mauvais », « machine de levage », « câble », « treuil », « sanctuaire » et « objets sacrés » sont recevables dans une traduction moderne. « Porteurs de Dieu ... du sanctuaire ... du Christ ... des choses saintes » restitue mieux la répétition rhétorique grecque et maintient son caractère frappant sans interprétation ajoutée.
  issues:
  - severity: medium
    issue: Rendu de la proposition finale
    rationale: '« mais en Dieu seul » transforme la formulation grecque κατὰ θεόν (« selon Dieu ») en objet exclusif de l’amour. Il convient de conserver le parallélisme avec « selon la vie commune des êtres humains ». '
  - severity: medium
    issue: Possessifs dans la série des porteurs
    rationale: Le grec aligne des composés en -φόροι (« porteurs de »), sans les possessifs que comporte le français proposé. Une formulation sans possessifs restitue plus exactement l’effet de la source.
  - severity: low
    issue: Formulation de l’amour
    rationale: « mettre son amour en rien » est peu naturel et dépend trop étroitement du témoin anglais; « n’aimer rien ... mais seulement selon Dieu » est plus idiomatique et plus proche du grec.
  revised_text: 'Mais j’ai appris que certaines personnes venues de là-bas sont passées parmi vous, apportant un enseignement mauvais. Vous ne les avez pas laissées semer en vous, car vous avez fermé vos oreilles afin de ne pas recevoir la semence qu’elles répandaient. En effet, vous êtes les pierres d’un temple, préparées d’avance pour l’édifice de Dieu le Père. Vous êtes hissés vers les hauteurs par la machine de levage de Jésus Christ — la croix —, avec l’Esprit Saint pour câble. Votre foi est votre treuil, et l’amour est le chemin qui monte vers Dieu.


    Vous êtes donc tous participants au même chemin, porteurs de Dieu, du sanctuaire, du Christ et des choses saintes, revêtus de la tête aux pieds des commandements de Jésus Christ. Moi aussi, associé à la fête, il m’est accordé, par cette lettre, de cheminer avec vous et de me réjouir avec vous, afin que vous n’aimiez rien selon la vie commune des êtres humains, mais seulement selon Dieu.'
  revised_footnotes: []
