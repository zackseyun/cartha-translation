revisions:
- from: 'Vous n’avez jamais jalousé personne ; vous avez enseigné les autres. Je désire que les enseignements que vous transmettez demeurent fermement établis.


    Priez seulement pour que j’aie la force intérieure et extérieure, afin que je ne me contente pas de le dire, mais que je le veuille aussi ; que je ne sois pas seulement appelé chrétien, mais que je le sois réellement. Car si je suis reconnu tel, je pourrai aussi en porter le nom et être fidèle lorsque je ne serai plus visible aux yeux du monde.


    Rien de ce qui est visible n’est bon[a]. Car notre Dieu, Jésus Christ, qui est dans le Père, se manifeste d’autant plus clairement. L’œuvre ne relève pas de la persuasion : le christianisme est une puissance lorsqu’il est haï par le monde.'
  to: 'Vous n’avez jamais envié personne ; vous en avez instruit d’autres. Pour ma part, je désire que ce que vous prescrivez en enseignant soit ferme.


    Priez seulement pour moi, afin que j’aie de la force au-dedans et au-dehors, pour que non seulement je parle, mais encore je le veuille ; pour que non seulement je sois appelé chrétien, mais que je sois aussi trouvé tel. Car si je suis trouvé tel, je puis aussi être appelé ainsi et être alors fidèle, lorsque je ne serai plus visible au monde.


    Rien de ce qui est visible n’est bon[a]. Car notre Dieu, Jésus Christ, étant dans le Père, se manifeste d’autant plus clairement. Le christianisme n’est pas une affaire de persuasion, mais de grandeur, lorsqu’il est haï par le monde.'
  rationale: La révision suit la formulation grecque de la recension moyenne lorsque celle-ci diffère du témoin anglais de travail, en particulier dans la dernière antithèse (« persuasion » / « grandeur »). Elle améliore aussi l’idiomaticité française, conserve les répétitions et oppositions du texte, et maintient la réserve interprétative requise pour « rien de ce qui est visible n’est bon ».
