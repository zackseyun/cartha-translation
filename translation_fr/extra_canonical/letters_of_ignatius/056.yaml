base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: fr
  text: 'Vous n’avez jamais envié personne ; vous en avez instruit d’autres. Pour ma part, je désire que ce que vous prescrivez en enseignant soit ferme.


    Priez seulement pour moi, afin que j’aie de la force au-dedans et au-dehors, pour que non seulement je parle, mais encore je le veuille ; pour que non seulement je sois appelé chrétien, mais que je sois aussi trouvé tel. Car si je suis trouvé tel, je puis aussi être appelé ainsi et être alors fidèle, lorsque je ne serai plus visible au monde.


    Rien de ce qui est visible n’est bon[a]. Car notre Dieu, Jésus Christ, étant dans le Père, se manifeste d’autant plus clairement. Le christianisme n’est pas une affaire de persuasion, mais de grandeur, lorsqu’il est haï par le monde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Énoncé abrupt. Dans son contexte, il oppose vraisemblablement ce qui est visible à la manifestation du Christ « dans le Père »; il ne convient pas d’en élargir le sens dans la traduction à une condamnation systématique de toute réalité visible.
    reason: Préserve l’ambiguïté et la tension de l’énoncé sans imposer une interprétation doctrinale.
lexical_decisions:
- source_word: grudged
  choice: jalousé
  rationale: Le témoin anglais exprime l’idée de ne rien envier ou refuser par rivalité ; « jalouser » conserve cette nuance sans ajouter un objet absent.
- source_word: hold good
  choice: demeurent fermement établis
  rationale: Rend l’idée de validité durable des enseignements dans un français naturel et digne.
- source_word: power within and without
  choice: la force intérieure et extérieure
  rationale: Préserve le parallélisme entre disposition intérieure et conduite ou témoignage extérieur.
- source_word: be found one
  choice: le sois réellement / reconnu tel
  rationale: Exprime l’écart ignatien entre porter le nom de chrétien et être constaté comme tel dans les faits.
- source_word: might
  choice: puissance
  rationale: Conserve le contraste avec la persuasion verbale et la force effective du christianisme.
theological_decisions:
- issue: Désignation de Jésus Christ comme Dieu
  choice: « notre Dieu, Jésus Christ »
  alternative: « Jésus Christ notre Dieu »
  rationale: Conserve explicitement et sans atténuation la formulation christologique du témoin.
- issue: Rapport du Christ au Père
  choice: « qui est dans le Père »
  alternative: « étant auprès du Père »
  rationale: Préserve la formulation transmise sans préciser davantage la nature de cette relation.
- issue: Visibilité après la mort ou le martyre
  choice: « lorsque je ne serai plus visible aux yeux du monde »
  alternative: « lorsque le monde ne me verra plus »
  rationale: Maintient l’expression volontairement indirecte sans réduire explicitement son sens à la mort ou au martyre.
- issue: Portée de « rien de visible n’est bon »
  choice: Conserver l’énoncé abrupt avec une note
  alternative: L’expliciter comme une comparaison entre renommée visible et fidélité cachée
  rationale: Le texte présente une tension réelle ; une explicitation dans le corps du texte risquerait d’enfermer le sens.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement collectif est rendu par « vous ». Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe du grec de la recension moyenne demeure nécessaire.
