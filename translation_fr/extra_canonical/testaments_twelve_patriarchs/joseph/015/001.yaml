  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: fr
  text: 'Car elle voulait me voir avec un désir coupable, mais moi, j’ignorais tout cela. Il lui dit : « Chez les Égyptiens, on ne prend pas ce qui appartient à autrui avant que les faits soient établis. » Il parla ainsi au sujet du marchand.[a] Mais le garçon[b] doit rester enfermé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet de l’échange » ou « au sujet du changeur » ; le terme grec peut désigner l’échange ou la personne qui le pratique.'
    reason: Le sens précis de μεταβόλου est lexicalement ambigu dans ce contexte.
  - marker: b
    text: 'Ou : « le serviteur » ; le mot grec peut désigner un garçon, un enfant ou un serviteur.'
    reason: παῖς ne permet pas à lui seul de trancher entre l’âge et le statut social.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: avec un désir coupable
  rationale: Rend naturellement le désir orienté vers le péché sans préciser davantage sa nature, que le grec laisse implicite.
- source_word: ἠγνόουν ἐν πᾶσι τούτοις
  choice: j’ignorais tout cela
  rationale: Expression française directe qui conserve l’idée que Joseph n’avait pas connaissance de l’ensemble de ces intentions ou faits.
- source_word: πρὸ ἀποδείξεως
  choice: avant que les faits soient établis
  rationale: ἀπόδειξις désigne ici une preuve ou démonstration; la formulation française exprime l’exigence d’établissement préalable sans surinterpréter la procédure.
- source_word: τὰ ἀλλότρια
  choice: ce qui appartient à autrui
  rationale: Conserve le sens collectif du pluriel grec dans une tournure française idiomatique.
- source_word: μεταβόλου
  choice: marchand
  rationale: Le terme peut désigner un marchand ou intermédiaire pratiquant l’échange; le contexte personnel favorise ici « marchand », tout en signalant l’autre possibilité en note.
- source_word: παῖς
  choice: garçon
  rationale: Le mot peut signifier garçon, enfant ou serviteur; « garçon » préserve ici l’indétermination de statut.
- source_word: ἐγκατάκλειστος εἶναι
  choice: rester enfermé
  rationale: Rend l’idée de maintien en détention ou en confinement dans un français naturel.
