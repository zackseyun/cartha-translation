  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a servant? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: fr
  text: « Pourquoi as-tu dit que tu étais esclave ? Car voici, nous avons appris que tu es le fils d’un homme important au pays de Canaan, et que ton père est encore en deuil pour toi, dans le sac et les cendres. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: esclave
  rationale: Le grec désigne ici une personne asservie; « esclave » conserve plus précisément la force du terme que « serviteur ».
- source_word: ἀνδρὸς μεγάλου
  choice: un homme important
  rationale: L’expression peut évoquer la grandeur, le rang ou l’influence; « important » est naturel en français et ne précise pas indûment la nature de cette grandeur.
- source_word: πενθεῖ περί σου
  choice: porte encore ton deuil
  rationale: Cette formulation rend le deuil continu du père à cause de Joseph, tenu pour perdu ou mort.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vêtu d’un sac et assis dans la cendre
  rationale: L’expression grecque désigne les signes traditionnels du deuil; l’explicitation idiomatique évite l’étrange calque « dans le sac et la cendre ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct garde la solennité narrative de « Car voici » tout en restant compréhensible. « Au pays de Canaan » suit l’usage biblique courant.
