review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement la question, « esclave », la condition de fils d’un homme important en Canaan et le deuil continu du père. Cependant, « assis dans la cendre » n’est pas exprimé par le grec : ἐν σάκκῳ καὶ σποδῷ indique les signes de deuil « dans le sac et la cendre / les cendres », sans préciser une posture. Le pluriel « cendres » correspond en outre mieux à σποδῷ dans l’expression idiomatique française consacrée.'
  naturalness: Le français est globalement naturel et de registre approprié. « Ton père est encore en deuil pour toi » conserve le sens sans l’ajout interprétatif de « assis ». « Dans le sac et les cendres » est une expression biblique française claire et idiomatique.
  terminology: « Esclave » est exact pour δοῦλον. « Un homme important » préserve utilement l’indétermination de ἀνδρὸς μεγάλου. « Au pays de Canaan » et « sac et cendres » conviennent au registre biblique moderne.
  issues:
  - severity: medium
    issue: Ajout de la posture « assis »
    rationale: Le grec ἐν σάκκῳ καὶ σποδῷ ne dit pas que le père est assis ; il le situe dans les pratiques de deuil associées au sac et à la cendre. L’ajout restreint indûment le sens.
  - severity: low
    issue: « dans la cendre » au singulier
    rationale: La formulation française usuelle pour ce motif est « dans le sac et les cendres » ; elle rend plus naturellement l’expression grecque sans introduire de détail supplémentaire.
  revised_text: « Pourquoi as-tu dit que tu étais esclave ? Car voici, nous avons appris que tu es le fils d’un homme important au pays de Canaan, et que ton père est encore en deuil pour toi, dans le sac et les cendres. »
