  text: Τί ὅτι εἶπας σεαυτὸν⁸ *δοῦλον εἶναι⁹; καὶ ἰδοὺ ⌜ἡμεῖς⌉¹⁰ ἐγνώκαμεν¹¹ ὅτι *υἱὸς εἰ ἀνδρὸς μεγάλου¹² ἐν γῇ¹³ Χαναάν, καὶ *ὁ πατήρ σου ⌜ἔτι⌉ πενθεῖ περί σου¹⁴ *ἐν σάκκῳ ⌜καὶ σποδῷ⌉¹⁵.
