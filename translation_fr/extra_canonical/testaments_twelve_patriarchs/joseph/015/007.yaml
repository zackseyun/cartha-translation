source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐκεῖνοι δὲ προσελθόντες³⁴ ᾔτουν³⁵ με³⁶ λέγοντες· ⌜Εἰπὲ⌉³⁷ ὅτι ἐν ἀργυρίῳ ἠγοράσθης³⁸ ἡμῖν, *κἀκεῖνος ἀπολῦσαι ἡμᾶς ἔχει³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/007.yaml
  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: fr
  text: 'Alors ils s’approchèrent et me demandèrent : « Dis que nous t’avons acheté avec de l’argent, et il nous relâchera. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀργυρίῳ
  choice: avec de l’argent
  rationale: Rend naturellement le moyen ou le prix exprimé par ἐν avec le datif, tout en conservant le sens monétaire de ἀργύριον.
- source_word: ἠγοράσθης ἡμῖν
  choice: nous t’avons acheté
  rationale: La tournure active est plus naturelle en français et exprime clairement que les interlocuteurs se présentent comme les acheteurs, conformément au sens contextuel du datif ἡμῖν.
- source_word: κἀκεῖνος
  choice: et il
  rationale: Le démonstratif désigne un homme déjà identifiable dans le contexte ; le pronom français évite une lourdeur sans ajouter d’identification absente du verset.
- source_word: ἀπολῦσαι ἡμᾶς ἔχει
  choice: il nous relâchera
  rationale: La construction ἔχει avec l’infinitif exprime ici une action attendue ou future ; « relâchera » convient à des personnes retenues et restitue le résultat envisagé.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste bref et pressant ; « avec de l’argent » conserve l’image concrète du paiement sans archaïsme.
