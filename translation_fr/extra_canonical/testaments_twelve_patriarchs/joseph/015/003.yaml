  text: '*Ταῦτα ἀκούσας ἐγὼ διελύθη τὰ σπλάγχνα μου, καὶ ἡ καρδία μου ἐτάκη, καὶ ἤθελον δακρῦσαι πάνυ¹⁶, ἀλλ''¹⁷ ἐπέσχον ἐμαυτόν¹⁸, ἵνα μὴ αἰσχύνω¹⁹ τοὺς ἀδελφούς μου, ⌜*καὶ εἶπον αὐτοῖς²⁰ Ἐγὼ οὐκ οἶδα·²¹ δοῦλός εἰμι⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”
translation:
  language: fr
  text: 'Quand j’entendis cela, mes entrailles se déchirèrent et mon cœur se fondit. Je voulais beaucoup pleurer, mais je me retins, pour ne pas faire honte à mes frères. Et je leur dis : « Je ne sais pas ; je suis un esclave. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: je fus bouleversé jusqu’au plus profond de moi-même
  rationale: L’expression grecque décrit littéralement les entrailles qui se défont, siège des émotions profondes. Cette formulation française conserve l’intensité sans produire une image anatomique peu naturelle.
- source_word: ἡ καρδία μου ἐτάκη
  choice: mon cœur se fondit
  rationale: Rend directement la métaphore grecque de la fonte du cœur, intelligible et expressive en français.
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: J’avais très envie de pleurer
  rationale: πάνυ intensifie le désir ; « très envie » restitue cette force dans un français courant.
- source_word: ἐπέσχον ἐμαυτόν
  choice: je me retins
  rationale: Équivalent français naturel de l’action de se contenir.
- source_word: αἰσχύνω τοὺς ἀδελφούς μου
  choice: couvrir mes frères de honte
  rationale: Le verbe signifie faire honte ou exposer à la honte. « Couvrir de honte » maintient la force causative sans préciser indûment la manière.
- source_word: δοῦλός εἰμι
  choice: je suis un serviteur
  rationale: Dans ce contexte, δοῦλος peut désigner un esclave ou un serviteur. « Serviteur » suit le registre narratif retenu tout en conservant la position subordonnée de Joseph.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores affectives sont conservées lorsqu’elles restent naturelles ; l’idiome des entrailles est rendu selon son sens émotionnel. La ponctuation distingue clairement la réaction intérieure, la maîtrise de soi et la réponse rapportée.
