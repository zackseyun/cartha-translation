  text: Then the trader said to them, “Free me from the judgment of Potiphar.”
translation:
  language: fr
  text: 'Alors le marchand leur dit : « Délivrez-moi du jugement de Potiphar. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: le marchand
  rationale: Dans ce contexte, le terme désigne le négociant impliqué dans la vente de Joseph ; « marchand » est naturel et précis en français.
- source_word: Λύσατέ με
  choice: Délivrez-moi
  rationale: L’impératif exprime l’idée de détacher ou libérer quelqu’un d’une contrainte ; « délivrez-moi » conserve ici la force de la demande.
- source_word: κρίσεως
  choice: du jugement
  rationale: Le mot peut désigner le jugement, la décision judiciaire ou la procédure qui en découle. « jugement » préserve cette latitude sans préciser indûment la forme de la menace.
- source_word: Πεντεφρί
  choice: Putiphar
  rationale: Emploi de la forme française courante du nom biblique correspondant, immédiatement reconnaissable par les lecteurs.
