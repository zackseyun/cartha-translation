review_pass:
  verdict: revise
  source_fidelity: La structure de crainte suivie de ἵνα μή est mieux rendue par « de peur que ... ne » que par une condition (« s’il venait »). « Au milieu d’eux » rend correctement ἐν αὐτοῖς. Le génitif κινδύνου demeure ambigu; il ne faut pas donner à entendre que le péril lui-même est l’objet de la vengeance.
  naturalness: « Tirer vengeance du péril » n’est pas idiomatique en français et peut signifier à tort que le péril est ce dont on se venge. « Exercer une vengeance au sujet du péril » est plus naturel tout en restant volontairement peu spécifique.
  terminology: « Grand devant Dieu et devant les hommes » conserve le parallélisme de παρὰ Θεῷ καὶ ἀνθρώποις et convient au registre. Aucun terme théologique ne nécessite une adaptation.
  issues:
  - severity: medium
    issue: Construction de la crainte affaiblie par une condition
    rationale: Ἐφοβοῦντο ... ἵνα μὴ introduit ce qu’ils redoutaient (« de peur qu’il ne vienne »), non simplement une éventualité conditionnelle.
  - severity: medium
    issue: « tirer vengeance du péril » est idiomatiquement et sémantiquement problématique
    rationale: Cette expression peut faire du « péril » la cible de la vengeance. Le grec ἐκδίκησιν κινδύνου présente un rapport génitif incertain, qui doit être signalé sans produire une formulation française trompeuse.
  revised_text: Car ils craignaient mon père, de peur qu’il ne vienne parmi eux exercer une vengeance au sujet du péril[a]. Ils avaient en effet entendu dire qu’il était grand devant Dieu et devant les hommes.
