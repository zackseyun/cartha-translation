  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: fr
  text: Car ils craignaient mon père, de peur qu’il ne vienne parmi eux exercer une vengeance au sujet du péril[a]. Ils avaient en effet entendu dire qu’il était grand devant Dieu et devant les hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exercer une vengeance à cause du danger » ; le rapport exact entre « vengeance » et « péril » est incertain en grec.'
    reason: Signaler l’ambiguïté réelle de ἐκδίκησιν κινδύνου sans préciser qui était en danger ni contre qui la vengeance devait être exercée.
lexical_decisions:
- source_word: ἐλθὼν ἐν αὐτοῖς
  choice: s’il venait au milieu d’eux
  rationale: Rend la présence de ἐν αὐτοῖς, plutôt que de traduire simplement « s’il venait ».
- source_word: ποιήσῃ ἐκδίκησιν
  choice: il pourrait tirer vengeance
  rationale: Expression française naturelle qui conserve l’idée d’une vengeance ou rétribution exercée.
- source_word: μέγας ἐστὶ παρὰ Θεῷ καὶ ἀνθρώποις
  choice: il était grand devant Dieu et devant les hommes
  rationale: Conserve directement le parallélisme et le jugement favorable exprimé par παρά avec le datif.
theological_decisions:
- issue: Sens de ἐκδίκησιν κινδύνου
  choice: tirer vengeance du péril
  alternative: les punir pour le danger qu’ils lui avaient fait courir
  rationale: Le génitif κινδύνου est inhabituel et laisse incertain le rapport exact entre la vengeance et le péril. Le texte principal préserve cette tension sans préciser qui avait été mis en danger ni transformer explicitement la vengeance en punition des intéressés.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation explicite la construction de crainte sans alourdir la phrase, et la répétition de « devant » maintient le parallélisme solennel du grec.
