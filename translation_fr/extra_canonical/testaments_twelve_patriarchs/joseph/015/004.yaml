lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle du récit.
- source_word: οὖν
  choice: donc
  rationale: Conserve la valeur inférentielle ou récapitulative du terme, malgré une légère redondance naturelle avec « Alors ».
- source_word: ἐβουλεύσαντο
  choice: ils décidèrent
  rationale: Le moyen a ici le sens de délibérer puis prendre la résolution; « décidèrent » exprime clairement l'aboutissement de leur concertation.
- source_word: πωλῆσαί με
  choice: de me vendre
  rationale: Rend directement l'infinitif aoriste et son complément.
- source_word: ἵνα μὴ εὑρεθῶ
  choice: afin que je ne sois pas retrouvé
  rationale: Préserve le passif et la proposition de but sans préciser qui pourrait le retrouver.
- source_word: ἐν ταῖς χερσὶν αὐτῶν
  choice: entre leurs mains
  rationale: Expression française idiomatique qui conserve l'image et peut évoquer aussi bien la possession que la responsabilité.
