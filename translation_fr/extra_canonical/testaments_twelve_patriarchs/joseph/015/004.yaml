  source_fidelity: Le sens de ἐβουλεύσαντο (« ils décidèrent / prirent la résolution »), πωλῆσαί με (« de me vendre ») et la finalité introduite par ἵνα est bien visé. Toutefois, « retrouvé » ajoute l'idée d'une recherche antérieure ou d'une récupération, absente de εὑρεθῶ, qui signifie simplement « être trouvé ».
  naturalness: « Alors, ils décidèrent donc » est redondant et peu naturel en français moderne. « Alors, ils décidèrent » rend bien la progression narrative sans surcharger la phrase. « Pour qu’on ne me trouve pas entre leurs mains » est idiomatique et maintient le passif indéfini du grec sans désigner l’agent.
  terminology: Aucun terme théologique ni nom propre n’est en jeu. « Entre leurs mains » conserve l’image grecque ἐν ταῖς χερσὶν αὐτῶν et son ambiguïté de possession ou de pouvoir.
