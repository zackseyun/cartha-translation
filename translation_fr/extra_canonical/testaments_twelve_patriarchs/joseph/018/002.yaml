source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: fr
  text: Et si quelqu’un veut vous faire du mal, vous, priez pour lui en faisant le bien, et le Seigneur vous délivrera de tout mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: vous faire du mal
  rationale: Rend naturellement en français l’idée de mal agir envers les destinataires, sans préciser indûment la forme du tort.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: faites le bien
  rationale: Le substantif grec exprime l’action bienfaisante ou la pratique du bien ; une tournure verbale est plus naturelle en français moderne.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: priez pour lui
  rationale: Traduction directe de l’intercession demandée en faveur de celui qui veut leur nuire.
- source_word: λυτρωθήσεσθε
  choice: vous délivrera
  rationale: La voix passive grecque avec l’agent ὑπὸ Κυρίου se rend plus clairement par une construction active en français.
- source_word: παντὸς κακοῦ
  choice: tout mal
  rationale: Préserve la portée générale du grec, qui peut englober le mal moral et le mal subi.
theological_decisions:
- issue: Rapport entre la pratique du bien, la prière et la délivrance
  choice: Coordonner les deux impératifs, puis présenter la délivrance comme leur suite
  alternative: « par vos bonnes actions, priez pour lui »
  rationale: Le grec associe étroitement ἀγαθοεργίᾳ et εὔχεσθε, mais la relation syntaxique exacte est peu naturelle en français. La formulation retenue conserve les deux réponses au mal sans faire des bonnes œuvres le moyen instrumental de la prière.
- issue: Agent de la délivrance
  choice: « le Seigneur vous délivrera »
  alternative: « vous serez délivrés par le Seigneur »
  rationale: La forme active est idiomatique et maintient explicitement le Seigneur comme agent, conformément au grec.
translation_notes:
  register: Français international moderne, simple et digne. La répétition emphatique de ὑμεῖς est reflétée par « vous, » afin de marquer le contraste entre l’intention malveillante d’autrui et la conduite attendue des destinataires.
