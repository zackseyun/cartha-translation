revisions:
- from: Et si quelqu’un veut vous faire du mal, vous, faites le bien et priez pour lui ; alors le Seigneur vous délivrera de tout mal.
  to: Et si quelqu’un veut vous faire du mal, vous, priez pour lui en faisant le bien, et le Seigneur vous délivrera de tout mal.
  rationale: La révision conserve toutes les composantes du texte, y compris l’emphase sur « vous » et l’agent explicite de la délivrance, tout en rattachant correctement « en faisant le bien » à l’unique exhortation grecque à prier. Elle évite aussi d’ajouter une nuance temporelle par « alors ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement le souhait de nuire, l’intercession en faveur de l’adversaire, la délivrance et l’agent divin. Toutefois, τῇ ἀγαθοεργείᾳ est un datif associé à l’unique impératif εὔχεσθε (« priez ») et exprime le moyen ou la manière (« en faisant le bien »), non un second impératif autonome.
  naturalness: Le français proposé est clair et d’un registre approprié. « Alors » ajoute cependant une articulation temporelle/consécutive absente du grec; « et » reproduit plus sobrement la coordination source. La formulation révisée demeure naturelle tout en gardant le lien étroit entre la pratique du bien et la prière.
  terminology: « Faire du mal », « prier pour lui », « le Seigneur » et « délivrer de tout mal » sont justes, naturels et terminologiquement cohérents. « En faisant le bien » rend adéquatement ἀγαθοεργείᾳ sans surinterpréter sa fonction.
  issues:
  - severity: medium
    issue: τῇ ἀγαθοεργείᾳ est rendu comme un impératif distinct (« faites le bien »).
    rationale: Le grec ne comporte qu’un impératif, εὔχεσθε. Le datif ἀγαθοεργείᾳ qualifie l’acte de prier comme moyen ou accompagnement; le rendre par « en faisant le bien » préserve cette relation syntaxique.
  - severity: low
    issue: Ajout de « alors ».
    rationale: Le grec coordonne la promesse par καί (« et »), sans marquer explicitement une séquence temporelle. « Et » est plus fidèle tout en restant idiomatique.
  revised_text: Et si quelqu’un veut vous faire du mal, vous, priez pour lui en faisant le bien, et le Seigneur vous délivrera de tout mal.
  revised_footnotes: []
  revision_rationale: La révision conserve toutes les composantes du texte, y compris l’emphase sur « vous » et l’agent explicite de la délivrance, tout en rattachant correctement « en faisant le bien » à l’unique exhortation grecque à prier. Elle évite aussi d’ajouter une nuance temporelle par « alors ».
