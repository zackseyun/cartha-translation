source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: fr
  text: Il m’a même donné une beauté supérieure à celle des beaux hommes d’Israël, et il m’a gardé jusqu’à la vieillesse, plein de force et de beauté ; car, en toutes choses, j’étais semblable à Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: beauté
  rationale: Le nom désigne ici la beauté ou la grâce physique ; « beauté » est naturel et correspond au parallèle avec κάλλει.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: supérieure à celle des beaux hommes d’Israël
  rationale: ὑπέρ exprime la supériorité comparative. La reformulation avec « celle » évite de comparer grammaticalement une beauté à des personnes.
- source_word: ἐφύλαξέ με
  choice: il m’a gardé
  rationale: Rend directement l’idée de conservation et de protection exprimée par φυλάσσω.
- source_word: ἕως γήρους
  choice: jusqu’à la vieillesse
  rationale: Traduction idiomatique et précise de l’expression temporelle.
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: plein de force et de beauté
  rationale: Le grec indique l’état dans lequel Joseph fut préservé ; cette tournure est plus naturelle en français que « dans la force et dans la beauté ».
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: en toutes choses, j’étais semblable à Jacob
  rationale: Conserve l’ampleur potentiellement ambiguë de ἐν πᾶσι sans préciser la nature exacte de la ressemblance.
theological_decisions:
- issue: Étendue de la ressemblance entre Joseph et Jacob
  choice: « en toutes choses »
  alternative: « à tous égards » ou une limitation à l’apparence physique
  rationale: Le texte grec formule une ressemblance générale. Le contexte peut suggérer l’apparence et la vigueur, mais la traduction ne doit pas réduire explicitement la portée de ἐν πᾶσι.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « beauté » est conservée parce qu’elle reflète le lien lexical et rhétorique entre ὡραιότητα et κάλλει. Aucun marqueur de note n’est requis.
