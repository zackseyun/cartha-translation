  terminology: « Humilité », « patience », « fille du prêtre d’Héliopolis », « cent talents d’or » et « mon Seigneur » sont appropriés. « Assujettis » traduit la force de κατεδούλωσεν sans introduire un cadre institutionnel d’esclavage ni un destinataire absent du grec.
