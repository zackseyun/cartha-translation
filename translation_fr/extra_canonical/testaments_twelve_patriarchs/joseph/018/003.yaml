base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: fr
  text: 'Voyez : vous savez en effet que, par mon humilité et ma patience, j’ai pris pour femme la fille du prêtre d’Héliopolis. Cent talents d’or m’ont été donnés avec elle, et mon Seigneur les[a] a assujettis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom traduit par « les » est ambigu : il peut reprendre grammaticalement les cent talents, ou, selon le contexte, des personnes que le Seigneur aurait assujetties.'
    reason: Préserver l’ambiguïté de αὐτούς sans expliciter un référent ni ajouter que la subordination serait envers Joseph.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ ὁρᾶτε
  choice: 'Voyez donc : vous savez'
  rationale: Ἰδού attire l’attention et γάρ marque le lien explicatif; dans ce contexte, ὁρᾶτε a le sens cognitif de « vous voyez / vous savez ». Cette formulation reste naturelle sans ajouter l’intensif « vous-mêmes », absent du grec.
- source_word: διὰ τὴν ταπείνωσιν καὶ τὴν μακροθυμίαν μου
  choice: grâce à mon humilité et à ma patience
  rationale: διά avec l’accusatif exprime ici la cause ou le moyen. « Humilité » rend ταπείνωσις; « patience » exprime naturellement μακροθυμία, endurance prolongée face aux épreuves ou aux offenses.
- source_word: ἔλαβον ἐμαυτῷ εἰς γυναῖκα
  choice: j’ai pris pour femme
  rationale: La tournure française « prendre pour femme » rend idiomatiquement l’acte matrimonial et porte déjà l’idée réfléchie de ἐμαυτῷ, sans le calque lourd « pour moi-même ».
- source_word: θυγατέρα ἱερέως ἡλιουπόλεως
  choice: la fille du prêtre d’Héliopolis
  rationale: Traduction directe; le génitif ἡλιουπόλεως rattache le prêtre à Héliopolis.
- source_word: ἑκατὸν τάλαντα χρυσίου
  choice: cent talents d’or
  rationale: Le talent est conservé comme unité pondérale et monétaire antique; χρυσίου précise la matière ou la valeur en or.
- source_word: κατεδούλωσεν
  choice: a soumis à mon autorité
  rationale: Le verbe signifie littéralement « réduire en servitude / assujettir ». La formulation conserve l’idée forte de subordination tout en évitant de suggérer sans nécessité une mise en esclavage au sens institutionnel.
theological_decisions:
- issue: Identité de « mon Seigneur »
  choice: mon Seigneur
  alternative: le Seigneur
  rationale: Le possessif μου appartient au texte grec et doit être conservé, sans décider s’il désigne Dieu de manière générale ou une référence plus précisément christologique.
- issue: Référent du pronom αὐτούς
  choice: les, avec une note signalant l’ambiguïté
  alternative: ceux-ci / eux
  rationale: Le masculin pluriel peut grammaticalement reprendre les « talents », nom masculin en grec, mais la notion de soumission convient aussi à des personnes présupposées par le contexte. La traduction ne remplace donc pas le pronom par un référent explicite.
translation_notes:
  register: Français moderne, international et digne. La phrase est divisée en deux pour alléger la syntaxe tout en maintenant la progression du grec. « Voyez donc » conserve l’appel rhétorique; « Héliopolis » suit la forme française usuelle du toponyme antique.
