source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Ἐὰν⌉¹ οὖν καὶ ὑμεῖς² πορευθῆτε ἐν ταῖς³ ἐντολαῖς Κυρίου⁴, ὑψώσει ὑμᾶς⁵ *ὁ θεὸς⁶ ⌜ἐν ἀγαθοῖς⁷ εἰς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: fr
  text: Si donc vous aussi vous marchez selon les commandements du Seigneur, Dieu vous élèvera dans les biens pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: vous marchez selon les commandements
  rationale: L’expression grecque signifie littéralement « marcher dans les commandements ». En français actuel, « marcher selon » conserve l’image biblique de la conduite tout en exprimant clairement la conformité aux commandements.
- source_word: ὑψώσει
  choice: élèvera
  rationale: Rend directement l’idée d’élever ou d’exalter, sans préciser indûment la nature de cette élévation.
- source_word: ἐν ἀγαθοῖς
  choice: vous comblera de biens
  rationale: La tournure grecque est concise et peut évoquer une élévation accompagnée de bonnes choses ou de bienfaits. Cette formulation française naturelle conserve ce sens favorable sans définir ces biens.
- source_word: εἰς αἰῶνας
  choice: pour toujours
  rationale: Expression française courante et digne pour la durée indéfinie ou perpétuelle exprimée par le grec.
theological_decisions:
- issue: Rapport entre l’obéissance et l’élévation accordée par Dieu
  choice: Conserver explicitement la construction conditionnelle
  alternative: Atténuer le lien en présentant l’élévation comme une simple espérance générale
  rationale: Le texte grec établit clairement une condition (« si ») et une conséquence future; la traduction ne doit ni supprimer ni systématiser davantage cette relation.
translation_notes:
  register: Français international moderne, clair et digne. L’image biblique de la marche est conservée, tandis que la construction peu idiomatique de ἐν ἀγαθοῖς est rendue naturellement.
