revisions:
- from: '**Testament de Joseph 6**


    1 Après cela, elle m’envoya de la nourriture mêlée de sorcellerie[a]. 2 Lorsque l’eunuque qui l’apportait arriva, je levai les yeux et vis un homme terrifiant[b] qui me tendait une épée avec le plat. Je compris alors qu’il s’agissait d’un stratagème[c] destiné à m’égarer. 3 Après le départ de l’eunuque, je pleurai sans goûter ni à cette nourriture ni à aucun des autres mets qu’elle m’avait envoyés.


    4 Le lendemain, elle vint me voir. Reconnaissant la nourriture, elle me demanda : « Pourquoi n’as-tu pas mangé cette nourriture ? »


    5 Je lui répondis : « Parce que tu l’as remplie d’une sorcellerie mortelle. Comment as-tu donc pu dire : “Je ne m’approche pas des idoles, mais du Seigneur seul” ? 6 Sache maintenant que le Dieu de mon père m’a révélé ta méchanceté par son ange. C’est pourquoi j’ai gardé cette nourriture pour te confondre[d], dans l’espoir qu’en la voyant, peut-être te repentirais-tu.


    7 Mais afin que tu apprennes que la méchanceté des impies ne triomphera pas de ceux qui adorent Dieu en vivant dans la maîtrise de soi, voici : je vais en prendre et en manger devant toi. » Après avoir dit cela, je déclarai : « Le Dieu de mes pères et l’ange d’Abraham[e] seront avec moi. » Puis j’en mangeai.


    8 En voyant cela, elle tomba face contre terre à mes pieds et se mit à pleurer. Je la relevai et lui adressai des avertissements. 9 Elle s’engagea alors envers moi à ne plus commettre une telle impiété.'
  to: '**Testament de Joseph 6**


