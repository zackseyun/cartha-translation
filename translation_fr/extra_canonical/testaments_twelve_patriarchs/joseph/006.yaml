  rationale: La révision retire l’ajout « qu’elle m’avait envoyés », clarifie le constat de la nourriture au v. 4, rend l’action immédiate de Joseph au v. 7 et resserre la traduction de θεοσεβούντων. Elle conserve les ambiguïtés du personnage terrifiant, de l’ange d’Abraham et du terme ἔλεγχος, ainsi que les marqueurs de notes correctement ancrés.
