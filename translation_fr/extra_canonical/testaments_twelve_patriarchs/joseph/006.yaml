  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: fr
  text: '**Testament de Joseph 6**


    1 Après cela, elle m’envoya de la nourriture mêlée de sorcellerie[a]. 2 Lorsque l’eunuque qui l’apportait arriva, je levai les yeux et vis un homme terrifiant[b] qui me tendait, avec le plat, une épée. Je compris alors qu’il s’agissait d’un stratagème[c] destiné à m’égarer. 3 Après son départ, je pleurai sans goûter ni à cette nourriture ni à aucun de ses autres aliments.


    4 Un jour plus tard, elle vint me voir et, voyant la nourriture, me demanda : « Pourquoi n’as-tu pas mangé cette nourriture ? »


    5 Je lui répondis : « Parce que tu l’as remplie d’une sorcellerie mortelle. Comment as-tu donc pu dire : “Je ne m’approche pas des idoles, mais du Seigneur seul” ? 6 Sache maintenant que le Dieu de mon père m’a révélé ta méchanceté par son ange. C’est pourquoi je l’ai gardée comme preuve contre toi[d], afin que, peut-être, en la voyant, tu te repentes.


    7 Mais afin que tu apprennes que la méchanceté des impies ne prévaudra pas contre ceux qui honorent Dieu dans la maîtrise de soi, voici : j’en prends et j’en mange devant toi. » Après avoir dit cela, je déclarai : « Le Dieu de mes pères et l’ange d’Abraham[e] seront avec moi. » Puis j’en mangeai.


    8 En voyant cela, elle tomba le visage contre terre à mes pieds en pleurant. Je la relevai et l’avertis. 9 Elle s’engagea alors envers moi à ne plus commettre une telle impiété.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement que la nourriture avait été « mêlée » ou « pétrie » avec de la sorcellerie.
    reason: Précision lexicale sur l’image concrète du grec.
  - marker: b
    text: Le texte grec n’identifie pas cet « homme terrifiant » ; il peut s’agir d’une apparition, d’une figure symbolique ou d’un être lié à la tentative de sorcellerie.
    reason: Préservation de l’ambiguïté narrative et théologique.
  - marker: c
    text: Le mot grec peut aussi désigner une manœuvre artificieuse, une pratique magique ou une ruse destinée à l’égarer.
    reason: Alternative lexicale pour un terme sémantiquement large.
  - marker: d
    text: 'Ou : « pour te reprendre » ou « pour ta conviction ». Le terme grec peut désigner la réprimande, la réfutation ou la mise en évidence d’une faute.'
    reason: Préservation de l’étendue sémantique de ἔλεγχος.
  - marker: e
    text: L’expression « l’ange d’Abraham » est celle du grec ; le texte ne précise pas s’il s’agit de l’ange qui accompagnait, protégeait ou était apparu à Abraham.
    reason: Préservation de l’ambiguïté du génitif.
lexical_decisions:
- source_word: βρῶμα
  choice: nourriture
  rationale: Terme général désignant la nourriture; ce choix reste naturel et convient à toutes ses occurrences dans le passage.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: mêlée de sorcellerie
  rationale: πεφυρμένον exprime l’idée de mélange, tandis que γοητεία désigne ici une pratique magique ou une sorcellerie.
- source_word: φοβερὸν ἄνδρα
  choice: un homme terrifiant
  rationale: Rend la force menaçante de φοβερός sans identifier la nature de l’apparition.
- source_word: τρύβλιον
  choice: plat
  rationale: Désigne un récipient servant à présenter la nourriture, sans en préciser excessivement la forme.
- source_word: μάχαιρα
  choice: épée
  rationale: Le mot peut aussi désigner un grand couteau, mais « épée » convient à la portée menaçante de la vision.
- source_word: περιέργεια
  choice: stratagème
  rationale: Dans ce contexte, le terme évoque une manœuvre artificieuse ou magique visant à détourner Joseph.
- source_word: εἰς ἀποπλάνησίν μου
  choice: destiné à m’égarer
  rationale: Conserve la dimension morale et spirituelle du verbe de la famille ἀποπλανάω.
- source_word: μὴ γευσάμενος
  choice: sans goûter
  rationale: Reproduit le sens précis du verbe γεύομαι et souligne le refus total de Joseph.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: reconnaissant la nourriture
  rationale: ἐπιγινώσκω indique qu’elle reconnaît ou constate la présence de la nourriture restée intacte.
- source_word: γοητείας θανάτου
  choice: sorcellerie mortelle
  rationale: Le génitif θανάτου qualifie vraisemblablement la sorcellerie par son effet létal.
- source_word: ἐν σωφροσύνῃ θεοσεβούντων
  choice: ceux qui adorent Dieu en vivant dans la maîtrise de soi
  rationale: Déploie naturellement en français le lien entre la piété envers Dieu et la σωφροσύνη, qui comprend retenue, chasteté et maîtrise de soi.
- source_word: συνεθέτό μου
  choice: elle s’engagea envers moi
  rationale: Le verbe exprime ici un accord ou un engagement pris auprès de Joseph.
theological_decisions:
- issue: Nature de l’homme terrifiant portant l’épée
  choice: Le présenter sans préciser son identité ni sa nature.
  alternative: L’identifier comme un ange, un démon ou une image symbolique du danger.
  rationale: Le grec rapporte ce que Joseph voit, mais n’identifie pas cet homme; la traduction maintient donc l’ambiguïté.
- issue: Sens de μετανοήσεις
  choice: te repentirais
  alternative: changerais d’avis ou de conduite
  rationale: Le contexte concerne une faute déterminée que Joseph révèle et condamne; « se repentir » convient sans ajouter de contenu doctrinal.
- issue: L’ange d’Abraham
  choice: Conserver littéralement « l’ange d’Abraham ».
  alternative: L’expliciter comme l’ange protecteur d’Abraham ou l’ange qui apparut à Abraham.
  rationale: Le texte n’explique pas la relation exprimée par le génitif et ne permet pas de trancher entre ces interprétations.
translation_notes:
  register: Français international moderne, narratif et digne. Les paroles directes restent simples et fermes. « Maîtrise de soi » rend σωφροσύνη sans réduire le terme à la seule chasteté, bien que celle-ci soit importante dans le contexte. Les ambiguïtés concernant l’apparition et « l’ange d’Abraham » sont conservées et signalées en note.
