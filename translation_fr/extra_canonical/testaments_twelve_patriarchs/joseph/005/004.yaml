  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: fr
  text: Et elle se retira, me comblant de cadeaux et de toutes sortes de plaisirs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: elle se retira
  rationale: Le verbe indique qu’elle s’éloigna ou se retira; cette formulation française reste naturelle sans préciser davantage les circonstances.
- source_word: ἐπιθάλπουσά με
  choice: cherchant à me séduire
  rationale: Le participe évoque une sollicitude flatteuse destinée à gagner Joseph; dans ce contexte, « séduire » rend naturellement la visée persuasive et sensuelle sans la réduire à une simple bonté.
- source_word: δώροις
  choice: par des cadeaux
  rationale: Équivalent direct et courant du datif instrumental.
- source_word: ἀπολαύσεσι πάσαις
  choice: toutes sortes de plaisirs
  rationale: Le pluriel accompagné de πᾶς exprime ici l’ensemble ou la variété des plaisirs proposés; cette tournure française est plus idiomatique que « tous les plaisirs ».
