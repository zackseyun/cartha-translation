  text: Alors, effrayée, elle me supplia de ne pas révéler ce projet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβηθεῖσα
  choice: prise de peur
  rationale: Rend naturellement le participe aoriste passif à valeur circonstancielle, sans alourdir la phrase.
- source_word: ἠξίου με
  choice: elle me supplia
  rationale: Dans ce contexte, ἀξιόω exprime une demande insistante plutôt qu’une simple requête.
- source_word: ἐξαγγελῶ
  choice: révéler à personne
  rationale: Le verbe signifie faire connaître ou divulguer; l’ajout idiomatique « à personne » donne en français une formulation naturelle de l’interdiction de divulguer.
- source_word: ἐπίνοιαν
  choice: projet
  rationale: Désigne ici un dessein conçu, vraisemblablement répréhensible; « projet » conserve le sens sans imposer la nuance plus accusatrice de « complot ».
