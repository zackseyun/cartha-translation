  text: Φοβηθεῖσα¹⁶ οὖν ἐκείνη ἠξίου με¹⁷ ἵνα μὴ¹⁸ ἐξαγγελῶ¹⁹ τὴν *ἐπίνοιαν ταύτην²⁰.
