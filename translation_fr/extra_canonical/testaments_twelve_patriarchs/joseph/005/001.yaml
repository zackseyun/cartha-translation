  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: fr
  text: 'Une autre fois, elle me dit : « Si tu ne veux pas commettre l’adultère, je tuerai mon mari avec du poison et je te prendrai pour mari. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend directement l’idée de répétition, dans un registre narratif naturel.
- source_word: ἐν ἑτέρῳ χρόνῳ
  choice: à un autre moment
  rationale: Expression française courante qui conserve la référence temporelle indéterminée du grec.
- source_word: μοιχεῦσαι
  choice: commettre l’adultère
  rationale: Restitue explicitement le sens moral et sexuel du verbe grec sans l’atténuer.
- source_word: ἀνελῶ
  choice: je tuerai
  rationale: Rend clairement le futur actif du verbe ἀναιρέω dans ce contexte de menace homicide.
- source_word: φαρμάκῳ
  choice: avec du poison
  rationale: Le datif instrumental désigne ici le moyen employé; « poison » correspond au sens contextuel de φάρμακον.
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: je te prendrai pour mari
  rationale: Tour idiomatique français fidèle à la construction grecque, sans ajouter de possessif explicite.
