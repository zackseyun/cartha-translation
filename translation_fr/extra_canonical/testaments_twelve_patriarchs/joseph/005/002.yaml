  text: Ἐγὼ οὖν, ὡς ἤκουσα τοῦτο, διέρρηξα *τὰ ἱμάτιά⁷ μου, καὶ εἶπον ⌜αὐτῇ⌝⁸· Γύναι, αἰδέσθητι τὸν Θεόν⁹, καὶ¹⁰ μὴ ποιήσῃς τὴν *πρᾶξιν ταύτην τὴν πονηράν¹¹, ἵνα μὴ¹² ἐξολοθρευθῇς· *ἐπεὶ καίγε γίνωσκε ὅτι ἐγὼ¹³ ἐξαγγελῶ¹⁴ *πᾶσιν τὴν ἐπίνοιάν σου ταύτην¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: fr
  text: 'Alors, quand j’entendis cela, je déchirai mes vêtements et lui dis : « Femme, aie du respect pour Dieu et ne commets pas cette mauvaise action, de peur que tu ne sois anéantie. Sache aussi ceci : je révélerai à tous ce projet que tu as conçu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  choice: je déchirai mes vêtements
  rationale: Rend directement le geste de détresse exprimé par le grec, dans un français biblique naturel.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: respecte Dieu
  rationale: αἰδέομαι exprime ici une retenue révérencielle devant Dieu. « Respecte Dieu » préserve cette nuance sans réduire le sens à la seule peur ni employer l’expression peu naturelle « aie honte devant Dieu ».
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: cette mauvaise action
  rationale: Traduction sobre et exacte de πρᾶξις et πονηράν; le texte grec fourni ne comporte pas de terme distinct signifiant « illégale ».
- source_word: ἐξολοθρευθῇς
  choice: tu ne sois anéantie
  rationale: Le verbe indique une destruction complète; le féminin s’accorde avec la femme interpellée.
- source_word: ἐξαγγελῶ πᾶσιν
  choice: je révélerai à tous
  rationale: ἐξαγγέλλω signifie faire connaître ou divulguer publiquement; « révélerai » convient au projet jusque-là caché.
- source_word: τὴν ἐπίνοιάν σου ταύτην
  choice: ce projet que tu as conçu
  rationale: ἐπίνοια désigne une pensée, une intention ou un dessein conçu. Cette formulation rend aussi explicitement le possessif σου et le démonstratif ταύτην.
theological_decisions:
- issue: Sens de αἰδέσθητι τὸν Θεόν
  choice: respecte Dieu
  alternative: crains Dieu
  rationale: Le grec met l’accent sur la révérence et la retenue inspirée par le respect ou la honte. « Crains Dieu » est possible dans le contexte religieux, mais correspond moins précisément au verbe employé.
- issue: Portée de ἵνα μὴ ἐξολοθρευθῇς
  choice: de peur que tu ne sois anéantie
  alternative: afin que tu ne sois pas anéantie
  rationale: La proposition exprime ici la conséquence redoutée de l’acte. La traduction ne précise ni l’agent ni la forme du jugement, conformément au grec passif.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre narratif. La formulation conserve la gravité de l’avertissement sans ajouter de qualification absente du texte grec.
