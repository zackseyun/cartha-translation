  text: '4. For she wanted to see me in the desire of sin, but I was ignorant in all these things.


    5. And I said to her, “This is not the custom among the Egyptians, to take what belongs to another before proof is given.”


    6. So I said this concerning the exchange. But the boy ought to be kept shut up.


    1. And after twenty-four days the Ishmaelites came, for they had heard that Jacob my father was mourning greatly for me. And when they came they said to me,


    2. “Why did you say that you were a servant? For look, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”


    3. When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”


    4. Then they took counsel to sell me, so that I might not be found in their hands.


    5. For they feared my father, lest he come against them and execute dangerous vengeance on them; for they had heard that he was great before God and men.


    6. Then the trader said to them, “Release me from the judgment of Potiphar.”


    7. So they came near and asked me, saying, “Say that you were bought by us for silver, and he will release us.”'
translation:
  language: fr
  text: '14.4 En effet, elle voulait me voir dans le désir du péché, mais moi, je ne comprenais rien à toutes ces choses.


    5 Je lui dis : « Ce n’est pas l’usage chez les Égyptiens de prendre ce qui appartient à autrui avant d’en avoir apporté la preuve. »


    6 Je dis donc cela au sujet du marchand. Mais le garçon doit rester enfermé.


    15.1 Vingt-quatre jours plus tard, les Ismaélites arrivèrent. Ils avaient en effet appris que Jacob, mon père, menait grand deuil à mon sujet. À leur arrivée, ils me dirent :


    2 « Pourquoi as-tu dit que tu étais esclave ? Car voici, nous avons appris que tu es le fils d’un homme important du pays de Canaan et que ton père porte encore ton deuil, dans le sac et la cendre. »


    3 Quand j’entendis cela, mes entrailles furent déchirées et mon cœur se fondit. Je voulais beaucoup pleurer, mais je me retins pour ne pas faire honte à mes frères. Je leur dis : « Je ne sais pas ; je suis esclave. »


    4 Ils décidèrent alors de me vendre, afin que je ne sois pas trouvé entre leurs mains.


    5 En effet, ils craignaient mon père, de peur qu’il ne vienne contre eux et n’exerce sur eux une vengeance redoutable[a], car ils avaient entendu dire qu’il était grand devant Dieu et devant les hommes.


    6 Alors le marchand leur dit : « Libérez-moi du jugement de Pentéphri. »[b]


    7 Ils s’approchèrent donc de moi et me demandèrent : « Dis que nous t’avons acheté pour de l’argent, et il pourra nous relâcher. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de l’expression traduite par « vengeance redoutable » est difficile et peut aussi se comprendre comme une vengeance liée au péril encouru.
    reason: Préserve l’incertitude textuelle et syntaxique de ἐκδίκησιν κινδύνου.
  - marker: b
    text: Pentéphri est la forme grecque du nom généralement rendu par Potiphar dans la Genèse.
    reason: Aide le lecteur à identifier le personnage tout en respectant la forme nominale du texte source.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: animé du désir de pécher
  rationale: Rend le désir orienté vers le péché sans préciser davantage une syntaxe grecque difficile.
- source_word: μετάβολος
  choice: marchand
  rationale: Dans ce contexte de vente et de comparution, le terme désigne le négociant ou marchand impliqué dans la transaction.
- source_word: δοῦλος
  choice: esclave
  rationale: Le cadre est celui de l’achat et de la vente d’une personne ; « esclave » est donc plus précis que « serviteur ».
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: je fus bouleversé jusqu’au plus profond de moi-même
  rationale: Expression idiomatique française qui conserve la force viscérale de l’image grecque sans produire une formulation anatomique artificielle.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vêtu d’un sac et assis dans la cendre
  rationale: Explicite naturellement en français l’expression traditionnelle du deuil tout en gardant ses deux éléments matériels.
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: devant Dieu et devant les hommes
  rationale: Formule française biblique, claire et fidèle à l’idée d’estime ou de grandeur reconnue auprès de Dieu et des humains.
- source_word: ἐν ἀργυρίῳ ἠγοράσθης ἡμῖν
  choice: nous t’avons acheté contre de l’argent
  rationale: Rend la transaction exprimée par le datif et ἐν ἀργυρίῳ dans un français naturel.
theological_decisions:
- issue: La dissimulation de Joseph pour protéger ses frères
  choice: « Je ne sais pas de quoi vous parlez ; je suis esclave. »
  alternative: « Je ne sais pas ; je suis esclave. »
  rationale: L’ajout idiomatique « de quoi vous parlez » clarifie la portée probable du démenti sans transformer le passage en jugement moral explicite ; la tension entre vérité et loyauté fraternelle demeure.
- issue: La grandeur de Jacob auprès de Dieu
  choice: « grand devant Dieu et devant les hommes »
  alternative: « puissant auprès de Dieu et des hommes »
  rationale: Conserve le terme général μέγας sans lui imposer une nature précise, spirituelle, sociale ou militaire.
- issue: La vengeance redoutée
  choice: « exercer sur eux une vengeance redoutable »
  alternative: « venger le danger » / « tirer vengeance du péril »
  rationale: Le grec ἐκδίκησιν κινδύνου est difficile. La traduction maintient la menace grave perçue par les Ismaélites sans définir une doctrine de la rétribution.
translation_notes:
  register: Français international moderne, narratif et digne. La traduction privilégie des phrases accessibles, conserve « esclave » dans le contexte marchand et évite de lisser les tensions morales du récit. La numérotation inclut la fin du chapitre 14 transmise avec le passage afin d’éviter de présenter ces versets comme appartenant au chapitre 15.
