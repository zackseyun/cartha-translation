revisions:
- from: '14.4 En effet, elle voulait me voir animé du désir de pécher, mais moi, j’étais sans expérience en toutes ces choses.


    5 Je lui dis : « Chez les Égyptiens, il n’est pas permis de prendre ce qui appartient à autrui avant que les preuves soient produites. »


    6 Voilà donc ce que je dis au sujet du marchand. « Quant au garçon, il doit rester enfermé. »


    15.1 Vingt-quatre jours plus tard, les Ismaélites arrivèrent. Ils avaient en effet appris que Jacob, mon père, menait grand deuil à mon sujet. À leur arrivée, ils me dirent :


    2 « Pourquoi as-tu dit que tu étais esclave ? Nous avons appris que tu es le fils d’un homme important du pays de Canaan et que ton père porte encore ton deuil, vêtu d’un sac et assis dans la cendre. »


    3 Quand j’entendis cela, je fus bouleversé jusqu’au plus profond de moi-même, et mon cœur se fondit. J’avais une très grande envie de pleurer, mais je me retins pour ne pas couvrir mes frères de honte. Je leur dis : « Je ne sais pas de quoi vous parlez ; je suis esclave. »[a]


    4 Ils décidèrent alors de me vendre, afin qu’on ne me trouve pas entre leurs mains.


    5 En effet, ils craignaient mon père : il pouvait venir les affronter et exercer sur eux une vengeance redoutable[b], car ils avaient entendu dire qu’il était grand devant Dieu et devant les hommes.


    6 Alors le marchand leur dit : « Libérez-moi du jugement de Pentéphri. »[c]


    7 Ils s’approchèrent donc de moi et me demandèrent : « Dis que nous t’avons acheté contre de l’argent ; ainsi, il nous relâchera. »'
