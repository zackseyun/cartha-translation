  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: fr
  text: 'Car elle vantait ouvertement ma conduite, en me présentant comme un homme maître de lui-même, mais en secret elle me disait : « Ne crains pas mon mari, car il est persuadé de ta maîtrise de toi ; même si quelqu’un lui parle de nous, il ne le croira pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρονα / σωφροσύνης
  choice: chasteté
  rationale: Dans ce contexte de sollicitation sexuelle, ces termes désignent la maîtrise de soi, particulièrement la conduite chaste. « Chasteté » rend clairement ce sens en français moderne tout en conservant le même terme dans les deux occurrences.
- source_word: ἐδόξαζε
  choice: faisait l’éloge de
  rationale: Le verbe signifie ici louer ou vanter publiquement quelqu’un; cette formulation est naturelle et digne en français.
- source_word: ἐν κρυφῇ
  choice: en secret
  rationale: Rend directement l’opposition avec φανερῶς, « en public ».
- source_word: πέπεισται
  choice: est convaincu
  rationale: Le parfait exprime un état établi de conviction ou de confiance à l’égard de la chasteté de Joseph.
- source_word: περὶ ἡμῶν
  choice: lui parle de nous
  rationale: Préserve l’allusion volontairement vague à une prétendue relation entre la femme et Joseph, sans expliciter davantage que le grec.
