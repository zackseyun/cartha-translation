  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: fr
  text: 'Et je lui adressais des paroles du Très-Haut[a] : peut-être se détournerait-elle du mauvais désir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ils lui adressaient des paroles du Très-Haut ». La forme grecque ἔλεγον peut se comprendre comme « je disais » ou « ils disaient » ; le contexte autobiographique favorise ici « je ».'
    reason: Préserver dans la note l’ambiguïté morphologique réelle de ἔλεγον, tout en conservant dans le texte la lecture singulière contextuellement plausible.
lexical_decisions:
- source_word: ἔλεγον
  choice: je […] adressais
  rationale: La forme de l’imparfait peut être comprise comme la première personne du singulier ou la troisième du pluriel. Le récit autobiographique de Joseph favorise ici « je », tandis que l’imparfait exprime une action répétée ou prolongée.
- source_word: ῥήματα ὑψίστου
  choice: des paroles du Très-Haut
  rationale: Rend directement l’expression grecque tout en conservant le titre divin traditionnel et intelligible.
- source_word: εἰ ἄρα ἐπιστρέψει
  choice: pour voir si peut-être elle se détournerait
  rationale: Formulation française naturelle qui maintient l’incertitude exprimée par εἰ ἄρα sans présenter le changement comme assuré.
- source_word: ἀπὸ τῆς ἐπιθυμίας τῆς πονηρᾶς
  choice: de ce mauvais désir
  rationale: « Se détourner de » rend le mouvement d’ἐπιστρέφω avec ἀπό; « ce mauvais désir » désigne naturellement en français le désir déjà connu dans le contexte, sans ajouter un possessif absent du grec.
theological_decisions:
- issue: Identification du sujet de ἔλεγον
  choice: 'Première personne du singulier : « je »'
  alternative: 'Troisième personne du pluriel : « ils/elles »'
  rationale: Les deux analyses sont morphologiquement possibles. La voix autobiographique de Joseph et la logique immédiate de son récit soutiennent la première personne, mais l’autre lecture est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Adressais des paroles » garde la teneur solennelle du grec sans raideur excessive; l’imparfait conserve l’aspect duratif ou répétitif.
