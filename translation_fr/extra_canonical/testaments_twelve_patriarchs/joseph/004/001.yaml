id: T12P.JOS.4.1
reference: Testament of Joseph 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ νοήσας ἐγὼ⁵⁵ ἐλυπήθην ἕως θανάτου⁵⁶· *ἐξελθούσης δὲ⁵⁷ αὐτῆς ἦλθον εἰς ἐμαυτόν, καὶ ἐπένθησα⁵⁸ περὶ αὐτῆς⁵⁹ ἡμέρας πολλάς, *ὅτι ἔγνων τὸν δόλον αὐτῆς καὶ τὴν πλάνην⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: fr
  text: Et quand je compris, j’en fus affligé à en mourir. Mais, une fois qu’elle fut sortie, je revins à moi et me lamentai à son sujet pendant de nombreux jours, parce que je connaissais sa tromperie et son égarement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: quand je compris
  rationale: Rend naturellement le participe aoriste et l’idée de saisir ou comprendre ce qui se passait.
- source_word: ἐλυπήθην ἕως θανάτου
  choice: j’en fus affligé à en mourir
  rationale: Conserve l’intensité de l’expression grecque sans imposer qu’une mort réelle ait été imminente.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: je revins à moi
  rationale: Expression idiomatique française correspondant directement à l’idée de retrouver ses esprits ou sa maîtrise de soi.
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: je me lamentai sur elle
  rationale: 'Préserve l’ambiguïté de περί avec le génitif : Joseph se lamente à son sujet, possiblement aussi sur son état, sans préciser davantage.'
- source_word: τὸν δόλον αὐτῆς
  choice: sa tromperie
  rationale: δόλος désigne ici la ruse ou la conduite trompeuse; « tromperie » convient au contexte.
- source_word: τὴν πλάνην
  choice: son égarement
  rationale: πλάνη peut exprimer l’erreur, l’illusion ou l’égarement. « Égarement » maintient une certaine amplitude sémantique et convient à une personne qui s’écarte du juste chemin.
theological_decisions:
- issue: Nature de la πλάνη de la femme
  choice: son égarement
  alternative: son illusion / son erreur
  rationale: Le grec ne précise pas si πλάνη désigne une illusion subie, une erreur intellectuelle ou une déviation morale. « Égarement » préserve cette tension sans la résoudre doctrinalement.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste proche du grec tout en étant fluide; le passé simple convient au registre littéraire du testament.
