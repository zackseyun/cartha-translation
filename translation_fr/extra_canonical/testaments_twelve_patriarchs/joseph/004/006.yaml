  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: fr
  text: Comme elle ne réussissait en rien dans cette affaire, elle recommença à venir me trouver pour recevoir un enseignement, désireuse d’apprendre la parole de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est syntaxiquement difficile. L’expression peut aussi se comprendre : « elle recommença à venir me trouver avec des paroles d’enseignement, voulant apprendre la parole de Dieu ». Le grec ne précise pas si « la parole de Dieu » est le contenu même de l’enseignement ou le but de sa démarche.'
    reason: Préserve l’ambiguïté de λόγῳ κατηχήσεως et le rapport syntaxique entre l’enseignement et l’infinitif « apprendre », sans introduire l’idée interprétative d’un prétexte.
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  choice: elle n’obtenait rien par ce moyen
  rationale: Rend naturellement l’idée qu’elle ne réussissait en rien par cette démarche, sans ajouter un résultat précis.
- source_word: λόγῳ κατηχήσεως
  choice: sous prétexte de s’instruire
  rationale: Dans le contexte de la tentative de séduction, la formule désigne vraisemblablement l’instruction comme motif déclaré de ses visites; ce rendu restitue cette fonction sans employer le terme ecclésiastique moderne « catéchèse ».
- source_word: λόγον Θεοῦ
  choice: la parole de Dieu
  rationale: Équivalent français traditionnel, clair et fidèle de λόγον Θεοῦ.
theological_decisions:
- issue: Rapport entre le motif d’instruction et le désir d’apprendre la parole de Dieu
  choice: Conserver une formulation où l’instruction motive ses visites et où l’apprentissage de la parole de Dieu en constitue le but déclaré.
  alternative: « elle recommença à venir me voir avec des paroles d’instruction, désireuse d’apprendre la parole de Dieu »
  rationale: La syntaxe grecque est difficile et les variantes signalées peuvent influer sur l’analyse. Le texte principal suit le sens contextuel le plus cohérent, tandis que la note préserve une lecture plus littérale.
translation_notes:
  register: Français moderne, courant et digne. « S’instruire » évite l’anachronisme possible de « catéchèse »; « sous prétexte » explicite avec mesure le caractère stratégique de la démarche dans le contexte narratif.
