  source_fidelity: 'La traduction principale ajoute « sous prétexte », qui n’est pas exprimé par le grec. Le contexte narratif peut suggérer une motivation intéressée, mais λόγῳ κατηχήσεως ne l’affirme pas. « Par ce moyen » interprète également plus fortement ἐν τούτῳ (« en cela / dans cette affaire »). La révision rend directement les éléments grecs : échec, nouvelle approche, enseignement et désir d’apprendre la parole de Dieu.'
  naturalness: La formulation révisée est idiomatique en français moderne et conserve un registre narratif sobre. « Venir me trouver » rend naturellement πρὸς με ἤρχετο sans alourdir le texte.
  terminology: « Enseignement » est un rendu neutre et moderne de κατήχησις, sans l’anachronisme institutionnel possible de « catéchèse ». « La parole de Dieu » est un équivalent établi de λόγον Θεοῦ. La note signale avec prudence l’ambiguïté de λόγῳ κατηχήσεως et de la construction finale.
