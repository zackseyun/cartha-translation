  - severity: low
    issue: « par ce moyen »
    rationale: ἐν τούτῳ signifie plus littéralement « en cela » ou « dans cette affaire ». « Par ce moyen » spécifie une stratégie instrumentale qui n’est pas nécessaire au sens.
