review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : flatteries verbales, louange trompeuse de la maîtrise de soi devant le mari, et intention de provoquer une chute en privé. Toutefois, « comme on flatte un homme saint » introduit un sujet générique (« on ») qui affaiblit la construction grecque, où elle flatte directement Joseph en le traitant comme un homme saint. « Lorsque nous serions seuls » ajoute une condition temporelle et un futur dans le passé qui ne sont pas explicitement marqués par κατὰ μόνας.'
  naturalness: Le français est globalement fluide et de registre approprié. Une formulation plus directe évite toutefois la rupture de point de vue créée par « comme on flatte » et rend plus naturellement l’opposition entre les paroles publiques et le dessein privé.
  terminology: « Maîtrise de moi » est un bon rendu large de σωφροσύνη et évite de réduire indûment le terme à la seule chasteté. « Son mari » rend correctement ἀνδρός. « Faire tomber » transmet le sens figuré probable de ὑποσκελίσαι, tout en restant accessible.
  issues:
  - severity: medium
    issue: La tournure « comme on flatte un homme saint » remplace l’adresse directe à Joseph par un générique impersonnel.
    rationale: 'Ὡς ἁγίῳ ἀνδρί qualifie la manière dont elle le flatte : elle le traite comme un homme saint. Une formulation avec « me » conserve plus exactement la relation syntaxique et narrative.'
  - severity: low
    issue: « Lorsque nous serions seuls » explicite un futur conditionnel absent du grec.
    rationale: Κατὰ μόνας indique que l’action projetée doit avoir lieu en privé / seul à seul, sans préciser une hypothèse temporelle au futur. « En privé » ou « seul à seul » préserve cette concision.
  revised_text: Ainsi donc, à maintes reprises, elle me prodiguait, en paroles, des flatteries comme à un homme saint ; avec fourberie, elle louait ma maîtrise de moi devant son mari, cherchant à me faire tomber en privé.
