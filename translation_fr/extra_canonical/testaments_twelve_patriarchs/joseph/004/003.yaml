source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις οὖν¹ *ὡς ἁγίῳ ἀνδρὶ ἐν λόγοις² ἐκολάκευέ³ με⁴ καὶ⁵ μετὰ δόλου διὰ⁶ ῥημάτων ἐπαίνει⁷ *τὴν σωφροσύνην⁸ μου ἐνώπιον τοῦ ἀνδρὸς αὐτῆς⁹, βουλομένη *κατὰ μόνας¹⁰ ὑποσκελίσαι με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: fr
  text: Ainsi donc, à maintes reprises, elle me prodiguait, en paroles, des flatteries comme à un homme saint ; avec fourberie, elle louait ma maîtrise de moi devant son mari, cherchant à me faire tomber en privé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλάκις οὖν
  choice: Ainsi donc, à maintes reprises
  rationale: Rend à la fois la liaison logique οὖν et la répétition exprimée par πολλάκις, dans un français naturel et soutenu.
- source_word: ὡς ἁγίῳ ἀνδρὶ
  choice: comme on flatte un homme saint
  rationale: Explicite la construction elliptique grecque sans identifier Joseph comme saint de manière absolue ; la tournure conserve l'idée qu'elle le traitait ou le présentait comme tel.
- source_word: ἐν λόγοις ἐκολάκευέ με
  choice: elle me flattait par ses paroles
  rationale: Traduction directe et idiomatique de la flatterie verbale.
- source_word: μετὰ δόλου διὰ ῥημάτων ἐπαίνει
  choice: avec fourberie, elle louait
  rationale: δόλος désigne la tromperie ou la ruse ; « avec fourberie » maintient la dimension intentionnellement trompeuse sans lourde répétition de « paroles ».
- source_word: τὴν σωφροσύνην μου
  choice: ma maîtrise de moi
  rationale: Dans ce contexte de sollicitation sexuelle, σωφροσύνη désigne la retenue, la chasteté et la maîtrise personnelle. « Maîtrise de moi » garde une portée assez large sans imposer le seul sens de chasteté.
- source_word: ἐνώπιον τοῦ ἀνδρὸς αὐτῆς
  choice: devant son mari
  rationale: ἀνήρ avec le possessif et dans ce contexte signifie naturellement « mari ».
- source_word: βουλομένη κατὰ μόνας ὑποσκελίσαι με
  choice: tout en cherchant à me faire tomber lorsque nous serions seuls
  rationale: ὑποσκελίζω évoque littéralement le fait de faire trébucher et figurativement de provoquer la chute. κατὰ μόνας indique une situation en privé ; le futur dans le passé rend son projet.
theological_decisions:
- issue: Portée morale de σωφροσύνη
  choice: ma maîtrise de moi
  alternative: ma chasteté
  rationale: Le contexte autorise « chasteté », mais le terme grec possède une portée plus vaste de retenue et de maîtrise personnelle. La formulation choisie préserve cette amplitude.
- issue: Valeur de ὡς ἁγίῳ ἀνδρί
  choice: comme on flatte un homme saint
  alternative: comme si j’étais un homme saint
  rationale: La construction peut exprimer la manière dont elle s’adressait à Joseph ou le statut qu’elle feignait de lui reconnaître. Le choix évite de trancher théologiquement la sainteté de Joseph tout en conservant sa stratégie flatteuse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’opposition entre les louanges publiques et le projet secret de provoquer la chute de Joseph. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
