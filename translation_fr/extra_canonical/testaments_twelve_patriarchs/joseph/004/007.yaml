  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: fr
  text: 'Et elle me dit : « Si tu veux que j’abandonne les idoles, mon proche parent, moi, je persuaderai mon mari de se détourner des idoles, et nous marcherons devant ton Seigneur.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque « devant ton Seigneur » est précédée d’un signe critique dans l’édition.
    reason: Le signe critique doit être signalé sans en préciser la portée textuelle au-delà de ce que fournit l’édition citée.
lexical_decisions:
- source_word: καταλείψω τὰ εἴδωλα
  choice: que j’abandonne les idoles
  rationale: Le tour θέλῃς ἵνα introduit ici ce que Joseph souhaite qu’elle fasse ; « abandonner » rend naturellement καταλείπω sans en atténuer la portée.
- source_word: συγγενοῦς μου
  choice: mon parent
  rationale: Le substantif désigne un membre de la parenté ou un proche apparenté. « Mon parent » conserve cette relation sans préciser un degré de parenté absent du grec.
- source_word: κἀγὼ πείθω τὸν ἄνδρα μου
  choice: moi, je persuaderai mon mari
  rationale: « Moi » restitue l’insistance de κἀγώ. Le futur français exprime naturellement l’action promise, même si le grec emploie un présent à valeur prospective.
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: de se détourner des idoles
  rationale: Cette formulation rend le mouvement de séparation exprimé par ἀφίστημι avec ἀπό et évite une répétition française trop mécanique d’« abandonner ».
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: nous marcherons devant ton Seigneur
  rationale: « Marcher devant » conserve l’image biblique et la portée relationnelle de πορεύομαι ἐνώπιον, sans ajouter la mention d’une loi qui ne figure pas dans le texte grec fourni.
theological_decisions:
- issue: Sens de « marcher devant le Seigneur »
  choice: Conserver la formule « marcherons devant ton Seigneur »
  alternative: « nous irons en présence de ton Seigneur »
  rationale: La formulation retenue préserve l’ambiguïté entre conduite de vie sous le regard du Seigneur et déplacement en sa présence, sans imposer une interprétation doctrinale.
- issue: Désignation « ton Seigneur »
  choice: Maintenir le possessif de deuxième personne
  alternative: « le Seigneur »
  rationale: Le grec Κυρίου σου distingue explicitement le Seigneur de Joseph du culte idolâtre de la locutrice ; supprimer « ton » effacerait cette tension narrative.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste naturel tout en conservant la répétition des « idoles », l’apostrophe familiale et l’expression biblique « marcher devant ».
