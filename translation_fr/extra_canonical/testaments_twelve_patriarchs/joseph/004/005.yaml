base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/005.yaml
  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: fr
  text: Dans tout cela, moi, couché à même le sol, je suppliais Dieu qu’il me délivre de sa perfidie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τούτοις πᾶσιν
  choice: Au milieu de tout cela
  rationale: Rend naturellement la circonstance englobante exprimée par ἐν avec le démonstratif pluriel et πᾶσιν, sans suggérer une liste abstraite.
- source_word: ἐγὼ
  choice: moi
  rationale: Conserve l’insistance explicite du pronom grec, inhabituelle puisque la personne est déjà marquée par le verbe.
- source_word: χαμοκοιτῶν
  choice: couché à même le sol
  rationale: Exprime le sens concret de « coucher/dormir par terre » dans un français courant et digne, sans préciser indûment s’il dormait effectivement.
- source_word: ἐδεόμην
  choice: je suppliais
  rationale: L’imparfait rend l’action prolongée ou répétée, tandis que « supplier » restitue la force de la demande adressée à Dieu.
- source_word: ὅπως ῥύσεταί με
  choice: de me délivrer
  rationale: La construction française à l’infinitif rend naturellement la prière de délivrance; « délivrer » convient au verbe ῥύομαι, qui implique le sauvetage hors d’un danger.
- source_word: ἐκ τῆς δολιότητος αὐτῆς
  choice: de sa perfidie
  rationale: « Perfidie » rend la tromperie malveillante de δολιότης et αὐτῆς renvoie à la femme mentionnée dans le contexte.
theological_decisions:
- issue: Objet et modalité de la prière
  choice: « je suppliais Dieu de me délivrer »
  alternative: « je demandais à Dieu comment il me délivrerait »
  rationale: ὅπως introduit ici le but ou le contenu de la supplication, non une interrogation sur la manière; la traduction garde Dieu comme destinataire sans développer le mode de son intervention.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’emphase sur « moi », l’aspect duratif de l’imparfait et l’image concrète de la posture au sol.
