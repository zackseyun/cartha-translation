base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: fr
  text: Mais moi, j’ajoutais le jeûne et la prière, afin que le Seigneur me délivre d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: j’ajoutais
  rationale: L’imparfait grec exprime ici une action poursuivie ou répétée; «j’ajoutais» conserve l’image d’un supplément apporté à la conduite déjà décrite.
- source_word: νηστείαν καὶ προσευχήν
  choice: le jeûne et la prière
  rationale: Rendu direct et naturel des deux pratiques religieuses désignées par le grec.
- source_word: ῥύσεταί με
  choice: me délivre
  rationale: ῥύομαι signifie arracher à un danger ou délivrer; «délivrer» convient au registre biblique moderne sans exagérer le sens.
- source_word: ἀπ᾽ αὐτῆς
  choice: d’elle
  rationale: Le pronom féminin renvoie à la femme mentionnée dans le contexte; le français conserve cette référence personnelle.
theological_decisions:
- issue: Rapport entre les pratiques ascétiques et la délivrance divine
  choice: afin que le Seigneur me délivre d’elle
  alternative: pour que le Seigneur me délivre d’elle
  rationale: La formulation conserve la finalité exprimée par ὅπως sans préciser si le jeûne et la prière sont une cause méritoire, une condition ou l’expression d’une supplication.
translation_notes:
  register: Français moderne, digne et accessible. «Mais moi» garde l’emphase contrastive de Ἐγὼ δὲ; l’imparfait «j’ajoutais» respecte l’aspect de προσετιθέμην.
