source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: fr
  text: 'Mais moi, je lui disais : « Le Seigneur ne veut pas que ceux qui le révèrent vivent dans l’impureté, ni ne prend plaisir à ceux qui commettent l’adultère, mais à ceux qui s’approchent de lui avec un cœur pur et des lèvres sans souillure. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: je lui disais
  rationale: L’imparfait grec présente une parole répétée ou prolongée dans le contexte, plutôt qu’une déclaration seulement ponctuelle.
- source_word: ἀκαθαρσίᾳ
  choice: l’impureté
  rationale: Ce terme conserve ici sa portée morale et sexuelle sans la restreindre à une catégorie rituelle.
- source_word: τοὺς σεβομένους αὐτόν
  choice: ceux qui le révèrent
  rationale: « Révérer » rend le respect religieux exprimé par σέβομαι dans un registre digne et intelligible.
- source_word: τοῖς μοιχεύουσιν
  choice: aux adultères
  rationale: Le participe substantivé désigne ceux qui commettent l’adultère; cette formulation française est concise et naturelle.
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: avec un cœur pur
  rationale: La préposition ἐν exprime ici la disposition intérieure dans laquelle on s’approche de Dieu.
- source_word: στόμασιν ἀμίαντοις
  choice: des lèvres sans souillure
  rationale: Bien que στόμα signifie littéralement « bouche », « lèvres » restitue naturellement l’image morale de paroles non souillées et s’accorde avec le pluriel grec.
- source_word: προσερχομένοις
  choice: ceux qui s’approchent de lui
  rationale: Le verbe garde son image d’approche de Dieu, avec une possible nuance cultuelle, sans l’expliciter davantage.
theological_decisions:
- issue: Portée de la volonté du Seigneur dans οὐχ … θέλει Κύριος
  choice: Le Seigneur ne veut pas que ceux qui le révèrent vivent dans l’impureté
  alternative: Le Seigneur ne veut pas ceux qui le révèrent dans l’impureté
  rationale: La formulation retenue explicite seulement la syntaxe nécessaire en français, sans transformer l’énoncé moral en affirmation sur un décret divin.
- issue: Objet de εὐδοκεῖ
  choice: il ne prend pas plaisir aux adultères, mais à ceux qui s’approchent de lui
  alternative: il n’approuve pas les adultères, mais ceux qui s’approchent de lui
  rationale: « Prendre plaisir à » préserve le sens affectif de εὐδοκέω et le contraste entre les personnes, sans réduire le verbe à une approbation abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique du grec est conservée, ainsi que le langage de pureté morale et d’approche de Dieu.
