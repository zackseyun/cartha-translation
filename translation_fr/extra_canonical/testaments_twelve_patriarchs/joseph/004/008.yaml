  to: 'Mais moi, je lui disais : « Le Seigneur ne veut pas que ceux qui le révèrent vivent dans l’impureté, ni ne prend plaisir à ceux qui commettent l’adultère, mais à ceux qui s’approchent de lui avec un cœur pur et des lèvres sans souillure. »'
  rationale: La révision rétablit la relation « ni… mais » du grec et explicite sans ambiguïté que le participe μοιχεύουσιν désigne les personnes qui commettent l’adultère. Elle conserve l’imparfait narratif, la portée morale non précisée de « impureté » et l’imagerie traditionnelle du cœur et des lèvres.
