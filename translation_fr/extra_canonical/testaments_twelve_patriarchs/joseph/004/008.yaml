review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens général sont bien rendus : l’imparfait de ἔλεγον, l’opposition entre impureté/adultère et approche de Dieu, ainsi que les images du cœur pur et des organes de parole non souillés, sont préservés. Toutefois, le δεύτερος membre doit garder la corrélation négative « ni… mais » (οὔτε… ἀλλά), et τοῖς μοιχεύουσιν désigne des personnes qui commettent l’adultère, non les actes d’adultère eux-mêmes.'
  naturalness: Le français est globalement naturel et de registre soutenu accessible. « Aux adultères » est toutefois ambigu en français moderne, où « adultères » désigne très couramment les actes; « à ceux qui commettent l’adultère » est clair et idiomatique dans ce contexte.
  terminology: « Seigneur », « révèrent », « impureté », « cœur pur » et « sans souillure » conviennent au registre religieux et moral du texte. « Lèvres » est une transposition idiomatique acceptable de στόμασιν dans cette image de parole pure, tout en conservant le pluriel distributif.
  issues:
  - severity: medium
    issue: « et il ne prend pas plaisir » affaiblit la construction οὔτε… ἀλλά.
    rationale: Le grec coordonne explicitement la seconde négation à la première (« ni… »), suivie d’une opposition (« mais… »). La formulation française doit rendre cette antithèse.
  - severity: medium
    issue: « aux adultères » est sémantiquement ambigu.
    rationale: τοῖς μοιχεύουσιν est un participe substantivé désignant des personnes qui commettent l’adultère. En français contemporain, « les adultères » évoque d’abord des actes; une périphrase personnelle évite ce déplacement.
