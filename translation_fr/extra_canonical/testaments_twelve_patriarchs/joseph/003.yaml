base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
translation:
  language: fr
  text: '1. Dans dix épreuves, elle démontra que j’avais fait mes preuves, et dans chacune d’elles je fus patient. Car la patience est un puissant remède, et l’endurance procure beaucoup de biens.


    2. Combien de fois l’Égyptienne m’a-t-elle menacé de mort ! Combien de fois m’a-t-elle livré aux châtiments, puis rappelé[a] ! Et comme je refusais de m’unir à elle, elle me disait : « Tu auras autorité sur moi aussi et sur tous ceux de ma maison, si tu te donnes à moi, et tu seras comme notre maître. »


    3. Mais moi, je me souvenais des paroles de mon père ; j’entrais dans la chambre retirée et, en pleurant, je priais le Seigneur.


    4. Pendant ces sept années, je jeûnais, tout en paraissant aux yeux de l’Égyptien[b] vivre dans l’abondance ; car ceux qui jeûnent pour Dieu reçoivent un visage plein de grâce.


    5. Lorsque mon maître était en voyage, je ne buvais pas de vin. Je ne prenais de nourriture que tous les trois jours[c], et je la donnais aux pauvres et aux malades.


    6. Dès l’aube, je me présentais devant le Seigneur et je pleurais au sujet de Memphis, l’Égyptienne[d], car elle ne cessait de me tourmenter vivement. Même la nuit, en effet, elle entrait chez moi sous prétexte de me rendre visite.


    7. Comme elle n’avait pas d’enfant mâle, elle faisait semblant…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins ajoutent ici : « et me menaçait ».'
    reason: textual_variant
  - marker: b
    text: Le grec porte le masculin « l’Égyptien » ; il s’agit vraisemblablement du maître égyptien de Joseph, mais la formulation reste concise.
    reason: alternative_reading
  - marker: c
    text: Le terme grec peut aussi se comprendre comme « le troisième jour » ou « après un intervalle de trois jours ».
    reason: lexical_alternative
  - marker: d
    text: Dans ce témoin grec, Memphis est le nom donné à l’Égyptienne.
    reason: cultural_note
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: elle démontra que j’avais fait mes preuves
  rationale: La tournure conserve l’idée d’une qualité éprouvée et reconnue à l’issue des tentations, dans un français naturel.
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: patience / je pris patience
  rationale: Le terme désigne ici l’endurance patiente face aux provocations répétées. La répétition lexicale est autant que possible maintenue.
- source_word: ὑπομονή
  choice: endurance
  rationale: Ce choix distingue ὑπομονή de μακροθυμία tout en conservant leur proximité sémantique.
- source_word: φάρμακον
  choice: remède
  rationale: « Remède » restitue directement la métaphore thérapeutique sans la développer.
- source_word: συνελθεῖν αὐτῇ
  choice: m’unir à elle
  rationale: La formule grecque est un euphémisme sexuel ; cette traduction reste claire, digne et non crue.
- source_word: κυριεύσεις
  choice: tu auras autorité
  rationale: La proposition porte sur le pouvoir dans la maison ; « avoir autorité » exprime ce sens sans coloration théologique indue.
- source_word: ἐπιδῷς ἑαυτὸν
  choice: si tu te donnes à moi
  rationale: La formulation conserve l’idée de se livrer personnellement et sexuellement à la femme.
- source_word: ταμεῖον
  choice: chambre retirée
  rationale: Le contexte de prière privée favorise le sens de pièce intérieure ou retirée, sans imposer « réserve » ou « cellier ».
- source_word: ἐν τρυφῇ διάγων
  choice: vivre dans l’abondance
  rationale: La formule exprime une apparence de vie aisée et bien nourrie, en contraste avec le jeûne.
- source_word: τοῦ προσώπου τὴν χάριν
  choice: un visage plein de grâce
  rationale: Cette expression conserve l’image concrète du visage et l’ambivalence de χάρις entre beauté, agrément et faveur.
- source_word: τριημερίζων
  choice: tous les trois jours
  rationale: Le verbe indique vraisemblablement un rythme de jeûne de trois jours ; une note conserve les autres nuances possibles.
- source_word: ὤρθριζον πρὸς Κύριον
  choice: dès l’aube, je me présentais devant le Seigneur
  rationale: Le choix rend à la fois l’action matinale et son orientation vers le Seigneur.
- source_word: λόγῳ ἐπισκέψεως
  choice: sous prétexte de me rendre visite
  rationale: La formule indique que la visite alléguée servait de motif ou de prétexte à son entrée.
- source_word: προσεποιεῖτο
  choice: elle faisait semblant…
  rationale: Le texte fourni s’interrompt après ce verbe. Les points de suspension signalent que la proposition demeure inachevée sans inventer son complément.
theological_decisions:
- issue: Référent de Κύριος dans la prière
  choice: Seigneur
  alternative: Maître
  rationale: Dans les versets 3 et 6, Joseph prie Dieu ; « Seigneur » est donc la désignation naturelle, tout en distinguant ce référent de son maître humain au verset 5.
- issue: Effet du jeûne pratiqué pour Dieu
  choice: ceux qui jeûnent pour Dieu reçoivent un visage plein de grâce
  alternative: ceux qui jeûnent à cause de Dieu reçoivent la grâce du visage
  rationale: La traduction conserve l’affirmation du texte reliant le jeûne consacré à Dieu à une grâce visible, sans expliquer ni rationaliser cette relation.
translation_notes:
  register: Français international moderne, narratif et digne. La traduction conserve les répétitions rhétoriques, distingue la patience de l’endurance, rend clairement mais sobrement les euphémismes sexuels et laisse le verset 7 inachevé comme le texte source transmis. Le début fourni prolonge explicitement la section précédente ; il est néanmoins présenté ici comme le verset 1 selon la structuration demandée.
