revisions:
- from: '**Testament de Joseph 19**


    **18.4 (suite)** Il m’a même donné une beauté supérieure à celle des beaux hommes d’Israël, et il m’a gardé jusqu’à la vieillesse, plein de force et de beauté. Car, en toutes choses, je ressemblais à Jacob.


    **19.1** Écoutez aussi, mes enfants, ce qui concerne les rêves que j’ai eus.


    **2** Douze cerfs paissaient au même endroit. Neuf d’entre eux furent dispersés sur toute la terre, puis les trois autres le furent de même. **3** Je vis alors les trois cerfs devenir trois agneaux. Ils crièrent vers le Seigneur, et le Seigneur les conduisit dans un lieu verdoyant et bien arrosé ; il les fit passer des ténèbres à la lumière. **4** Là, ils crièrent vers le Seigneur jusqu’à ce que les neuf cerfs soient rassemblés auprès d’eux. Eux aussi devinrent comme des brebis, au nombre de douze. Peu de temps après, ils se multiplièrent et formèrent de nombreux troupeaux.


    **5** Après cela, je regardai : voici que douze taureaux tétaient une seule génisse. D’elle jaillit une mer de lait[a], à laquelle burent les douze troupeaux et d’innombrables autres troupeaux. **6** Les cornes du quatrième taureau montèrent jusqu’au ciel et devinrent comme une muraille protégeant les troupeaux. Entre ses deux cornes, une autre corne se mit à pousser. **7** Je vis un veau qui fit douze fois le tour d’eux et qui apporta aux taureaux une aide complète.


    **8** Puis je vis naître une vierge, et d’elle naquit un agneau[b]. À sa gauche se tenait quelque chose qui ressemblait à un lion[c]. Toutes les bêtes sauvages se précipitèrent contre l’agneau, mais il les vainquit, les détruisit et les foula aux pieds. **9** Les anges, les êtres humains et toute la terre se réjouirent à son sujet. **10** Ces choses arriveront en leur temps, dans les derniers jours.


    **11** Vous donc, mes enfants, gardez les commandements du Seigneur et honorez Lévi et Juda, car de leur descendance se lèvera pour vous celui qui sauvera Israël[d]. **12** Son règne sera éternel et ne passera pas. Mais mon règne parmi vous prendra fin : comme une cabane de gardien après la récolte, il disparaîtra[e].'
  to: '**Testament de Joseph 19**


    **18.4 (suite)** Il m’a même donné une beauté supérieure à celle des beaux hommes d’Israël, et il m’a gardé jusqu’à la vieillesse, dans la force et la beauté. Car, en toutes choses, je ressemblais à Jacob.


