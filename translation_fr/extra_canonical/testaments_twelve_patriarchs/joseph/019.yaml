  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: fr
  text: '**Testament de Joseph 19**


    **18.4 (suite)** Il m’a même donné une beauté supérieure à celle des beaux hommes d’Israël, et il m’a gardé jusqu’à la vieillesse, dans la force et la beauté. Car, en toutes choses, je ressemblais à Jacob.


    **19.1** Écoutez aussi, mes enfants, ce que je sais au sujet des rêves[a].


    **2** Douze cerfs paissaient au même endroit. Neuf d’entre eux furent dispersés sur toute la terre, et les trois autres le furent de même. **3** Je vis alors les trois cerfs devenir trois agneaux. Ils crièrent vers le Seigneur, et le Seigneur les conduisit dans un lieu verdoyant et bien arrosé ; il les fit passer des ténèbres à la lumière. **4** Là, ils crièrent vers le Seigneur jusqu’à ce que les neuf cerfs soient rassemblés auprès d’eux. Ils devinrent alors comme douze brebis. Peu de temps après, ils se multiplièrent et formèrent de nombreux troupeaux.


    **5** Après cela, je regardai : voici que douze taureaux tétaient une seule génisse. D’elle jaillit une mer de lait[b], et les douze troupeaux ainsi que d’innombrables troupeaux en burent. **6** Les cornes du quatrième taureau montèrent jusqu’au ciel et devinrent comme une muraille pour les troupeaux. Entre les deux cornes, une autre corne se mit à pousser. **7** Je vis un veau qui fit douze fois le tour d’eux et qui fut pour les taureaux un secours total[c].


    **8** Puis je vis naître une vierge, et d’elle naquit un agneau[d]. À sa gauche, il y avait comme un lion[e]. Toutes les bêtes sauvages se précipitèrent contre l’agneau, mais il les vainquit, les détruisit et les foula aux pieds. **9** Les anges, les êtres humains et toute la terre se réjouirent à son sujet. **10** Ces choses arriveront en leur temps, dans les derniers jours.


    **11** Vous donc, mes enfants, gardez les commandements du Seigneur et honorez Lévi et Juda, car de leur descendance se lèvera pour vous un sauveur pour Israël[f]. **12** Son règne sera éternel et ne passera pas. Mais mon règne parmi vous prendra fin : comme une cabane de gardien après l’été, il disparaîtra[g].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est difficile : elle porte littéralement « ce que je sais au sujet des rêves ». Certains témoins ou formes du texte présentent l’introduction du rêve différemment.'
    reason: textual_difficulty
  - marker: b
    text: Le texte grec est lacunaire à cet endroit. Le sens général est qu’une mer de lait provient de la génisse.
    reason: textual_difficulty
  - marker: c
    text: Le mot grec rendu par « total » est incertain dans le texte transmis. Le sens général est que le veau apporta aux taureaux un secours considérable.
    reason: textual_difficulty
  - marker: d
    text: 'Certains témoins donnent une forme plus développée : « de Juda naquit une vierge », vêtue de fin lin, et d’elle naquit un agneau « sans défaut ». Une autre forme du texte situe la vierge parmi les cornes.'
    reason: textual_variant
  - marker: e
    text: La phrase grecque rendue par « À sa gauche, il y avait comme un lion » est difficile et varie selon les témoins. La suite présente clairement les bêtes sauvages attaquant l’agneau.
    reason: alternative_reading
  - marker: f
    text: 'Certains témoins développent fortement ce passage : « l’Agneau de Dieu, qui enlève le péché du monde », sauvant « toutes les nations et » Israël. Dans la forme courte, le sujet de « se lèvera » est affecté par cette variation textuelle.'
    reason: textual_variant
  - marker: g
    text: La « cabane de gardien » était un abri temporaire dans un champ ou un verger. Après l’été, elle était abandonnée et disparaissait rapidement.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα / κάλλει
  choice: beauté
  rationale: Les deux termes relèvent ici de la beauté physique. « Beauté » est naturel en français et maintient le parallélisme du passage.
- source_word: ἐφύλαξέ
  choice: il m’a gardé
  rationale: Le verbe exprime la protection et la préservation de Joseph jusqu’à la vieillesse ; « garder » conserve cette valeur sans alourdir la phrase.
- source_word: ἐνυπνίων
  choice: rêves
  rationale: Le contexte introduit une vision symbolique reçue en rêve. Le pluriel français respecte la forme grecque, malgré la difficulté syntaxique de la proposition.
- source_word: ἔλαφοι
  choice: cerfs
  rationale: Le terme désigne des cervidés. « Cerfs » rend l’image vive et correspond au masculin grammatical et symbolique de la scène.
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: un lieu verdoyant et bien arrosé
  rationale: Cette formulation restitue à la fois la végétation florissante et l’abondance d’eau dans un français courant.
- source_word: πρόβατα / ποίμνια
  choice: brebis / troupeaux
  rationale: La distinction entre les animaux devenus douze et leur multiplication ultérieure en troupeaux est ainsi préservée.
- source_word: βόες / δάμαλιν
  choice: taureaux / génisse
  rationale: Ces choix conservent le contraste de sexe et l’étrangeté voulue de l’image des taureaux qui tètent.
- source_word: κέρατα
  choice: cornes
  rationale: Le sens littéral convient à la vision tout en laissant ouverte sa portée symbolique liée à la puissance et à la protection.
- source_word: βασιλεία
  choice: règne
  rationale: Ici, le terme évoque surtout l’exercice durable ou passager de la souveraineté. « Règne » convient mieux que le seul territoire appelé « royaume ».
- source_word: ὀπωροφυλάκιον
  choice: cabane de gardien
  rationale: Il s’agit d’un abri temporaire installé dans un champ ou un verger pour le gardien ; la note précise l’arrière-plan de l’image.
theological_decisions:
- issue: Développements messianiques variables aux versets 8 et 11
  choice: Le texte principal conserve la vierge, l’agneau et le futur sauveur d’Israël, sans intégrer les formulations chrétiennes plus explicites attestées entre crochets ou dans certains témoins.
  alternative: « Une vierge issue de Juda, vêtue de fin lin, enfanta un agneau sans défaut » et « l’Agneau de Dieu qui enlève le péché du monde, sauvant toutes les nations et Israël ».
  rationale: La tradition grecque présente des expansions importantes et probablement secondaires. Les signaler en note permet de ne pas effacer leur existence tout en évitant de faire passer une forme développée pour le texte le plus ancien.
- issue: Identité du personnage qui se lève de la descendance de Lévi et de Juda
  choice: « Celui qui sauvera Israël »
  alternative: Une désignation explicite comme « l’Agneau de Dieu », ou la formulation impersonnelle « le salut d’Israël ».
  rationale: Le participe σώζων et le possessif de « son règne » orientent vers une figure personnelle, mais le texte court ne l’identifie pas davantage. La traduction maintient cette tension prophétique.
- issue: Sens de βασιλεία au verset 12
  choice: « Son règne » et « mon règne »
  alternative: « Son royaume » et « mon royaume ».
  rationale: Le contraste porte sur une souveraineté éternelle opposée à l’influence passagère de Joseph parmi ses descendants. « Règne » exprime naturellement cette opposition sans déterminer la nature institutionnelle du royaume.
translation_notes:
  register: Français international moderne, digne et narratif. Les images animales et agricoles restent concrètes, sans explicitation allégorique dans le corps du texte. Les répétitions structurantes du récit de rêve sont conservées, tandis que les tournures grecques difficiles sont rendues avec une syntaxe française lisible. Tous les développements textuels à forte portée christologique sont signalés sans être silencieusement incorporés au texte principal.
