  rationale: La révision suit prioritairement le grec fourni, y compris ses lacunes et ses passages signalés comme incertains. Elle supprime des explicitation non nécessaires (« que j’ai eus », « protégeant »), corrige une tournure française, et ajoute une note indispensable pour l’incertitude de ὁλοκλήρως au v. 7. Les variantes plus explicitement chrétiennes restent en notes. La formulation du v. 11 maintient une figure salvatrice sans imposer une identification confessionnelle ni masquer l’instabilité textuelle du sujet.
