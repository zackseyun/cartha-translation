    **5** Après cela, je regardai : voici que douze taureaux tétaient une seule génisse. D’elle jaillit une mer de lait[b], et les douze troupeaux ainsi que d’innombrables troupeaux en burent. **6** Les cornes du quatrième taureau montèrent jusqu’au ciel et devinrent comme une muraille pour les troupeaux. Entre les deux cornes, une autre corne se mit à pousser. **7** Je vis un veau qui fit douze fois le tour d’eux et qui fut pour les taureaux un secours total[c].


    **8** Puis je vis naître une vierge, et d’elle naquit un agneau[d]. À sa gauche, il y avait comme un lion[e]. Toutes les bêtes sauvages se précipitèrent contre l’agneau, mais il les vainquit, les détruisit et les foula aux pieds. **9** Les anges, les êtres humains et toute la terre se réjouirent à son sujet. **10** Ces choses arriveront en leur temps, dans les derniers jours.


