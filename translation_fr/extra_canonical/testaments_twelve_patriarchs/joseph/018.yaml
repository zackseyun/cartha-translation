base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: fr
  text: '**Testament de Joseph 18**


    1. Si donc vous aussi vous marchez dans les commandements du Seigneur, Dieu vous élèvera de biens pour toujours.[a]


    2. Et si quelqu’un veut vous faire du mal, vous, en faisant le bien, priez pour lui, et le Seigneur vous délivrera de tout mal.


    3. Car voyez : vous savez vous-mêmes que c’est grâce à mon humilité et à ma patience que j’ai pris pour femme la fille du prêtre d’Héliopolis ; avec elle, on m’a donné cent talents d’or, et mon Seigneur les a mis à mon service.[b]


    4. Il m’a même donné une beauté supérieure à celle des plus beaux hommes d’Israël, et il m’a gardé jusqu’à la vieillesse dans la force et dans la beauté ; car, en toutes choses, je ressemblais à Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec de bonnes choses pour toujours » ou « dans la prospérité pour toujours ».'
    reason: ἐν ἀγαθοῖς peut désigner des biens, de bonnes choses ou la prospérité ; le français principal conserve cette ouverture.
  - marker: b
    text: Le pronom « les » renvoie grammaticalement aux cent talents d’or. Le grec dit littéralement que le Seigneur « les a assujettis » ; l’image appliquée à des talents est inhabituelle.
    reason: Conserver et signaler la difficulté référentielle et imagée du grec sans la résoudre de manière excessive.
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: vous suivez les commandements
  rationale: Littéralement « marcher dans les commandements » ; « suivre » restitue naturellement en français l’idée d’une conduite conforme aux commandements.
- source_word: ἐν ἀγαθοῖς εἰς αἰῶνας
  choice: au milieu des biens pour toujours
  rationale: Conserve la formulation large et quelque peu ambiguë du grec, qui peut évoquer les biens, les bonnes choses ou la prospérité, sans la réduire au seul bonheur.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: faites le bien
  rationale: Le nom grec exprime l’action bienfaisante ; la tournure verbale est naturelle en français et maintient le contraste avec « faire du mal ».
- source_word: μακροθυμίαν
  choice: patience
  rationale: Dans ce contexte, le mot désigne l’endurance patiente et la maîtrise de soi devant le mal subi.
- source_word: κατεδούλωσεν
  choice: a soumis à mon autorité
  rationale: Rend l’idée forte d’assujettissement sans employer ici le très littéral « réduire en esclavage », peu naturel à propos des talents d’or.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: surpassant celle des beaux hommes d’Israël
  rationale: Le comparatif elliptique indique une beauté supérieure à celle des hommes réputés beaux en Israël.
theological_decisions:
- issue: Relation entre la bienfaisance, la prière et la délivrance
  choice: « faites le bien et priez pour lui ; alors le Seigneur vous délivrera »
  alternative: « par vos bonnes œuvres, priez pour lui »
  rationale: La syntaxe grecque est compacte. La traduction garde ensemble l’appel à faire le bien, la prière pour l’adversaire et la délivrance divine, sans transformer les bonnes œuvres en cause méritoire explicitement formulée.
- issue: Identification de l’agent divin au verset 4
  choice: « Il m’a aussi donné… et il m’a conservé »
  alternative: Répéter « mon Seigneur »
  rationale: Le sujet se poursuit naturellement depuis « mon Seigneur » au verset précédent ; le pronom conserve cette continuité sans ajouter un titre absent du grec à cet endroit.
- issue: Portée de la ressemblance avec Jacob
  choice: « en toutes choses, je ressemblais à Jacob »
  alternative: Préciser une ressemblance physique ou morale
  rationale: Le grec dit largement « en toutes choses ». La traduction préserve cette affirmation ouverte au lieu d’en restreindre la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La numérotation des quatre versets est conservée. Les formulations volontairement larges du grec sont maintenues lorsque le contexte ne permet pas de trancher, avec des notes brèves pour les principales ambiguïtés.
