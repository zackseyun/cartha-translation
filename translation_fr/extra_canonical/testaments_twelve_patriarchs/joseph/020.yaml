lexical_decisions:
- source_word: τελευτή
  choice: mort
  rationale: Dans ce contexte testamentaire, le terme désigne sans détour la fin de la vie de Joseph.
- source_word: θλίψουσιν
  choice: opprimeront
  rationale: Le verbe évoque ici une affliction durable et correspond au contexte de l’oppression en Égypte.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: exercera pour vous la vengeance
  rationale: Cette formulation conserve la force active de ἐκδίκησις ainsi que l’ambiguïté entre vengeance et rétablissement du droit, sans transformer le complément grec en vengeance exercée par Israël.
- source_word: ἐπάξει ... εἰς τὰς ἐπαγγελίας
  choice: vous fera entrer dans les promesses
  rationale: Le tour garde le mouvement exprimé par le grec et sa formulation inhabituelle, sans ajouter explicitement l’idée de retour absente du verbe.
- source_word: συνανοίσετε
  choice: vous ferez monter ... avec vous
  rationale: Le verbe désigne le transport des ossements lors de la montée hors d’Égypte; « faire monter » préserve cette orientation.
- source_word: ἐν φωτί / ἐν σκότει
  choice: dans la lumière / dans les ténèbres
  rationale: Le parallélisme français restitue directement le contraste symbolique du grec.
- source_word: Βελίαρ
  choice: Béliar
  rationale: La translittération suit la forme grecque du nom sans l’harmoniser avec « Bélial » ni le remplacer par une abstraction.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: s’endormit d’un doux sommeil
  rationale: La traduction conserve l’euphémisme de la mort et la qualification positive du sommeil.
- source_word: ἐπιτελεῖται
  choice: prendra fin
  rationale: Dans le contraste avec le royaume éternel et avec l’abri saisonnier qui disparaît, le verbe indique ici l’achèvement ou la cessation du royaume de Joseph.
- source_word: ὀπωροφυλάκιον
  choice: cabane de gardien dans un verger
  rationale: Le mot désigne un abri temporaire servant à surveiller des cultures ou des fruits; cette expression garde à la fois l’image concrète et sa fonction.
theological_decisions:
- issue: Sens de l’intervention divine exprimée par ἐκδίκησις
  choice: Dieu exerce lui-même la vengeance en faveur des opprimés.
  alternative: Dieu se contente de visiter ou de secourir Israël sans dimension de jugement.
  rationale: Le nom grec porte une force vindicative réelle. La traduction ne l’atténue pas en simple providence, tout en indiquant par « pour vous » que Dieu est l’agent.
- issue: Contraste entre le Seigneur et Béliar
  choice: Conserver Béliar comme figure personnelle associée aux Égyptiens dans les ténèbres.
  alternative: Remplacer Béliar par « le mal », « la méchanceté » ou « Satan ».
  rationale: Le témoin grec personnifie Béliar; la traduction préserve cette imagerie apocalyptique sans l’interpréter ni l’harmoniser.
- issue: Contraste entre « son royaume » et « mon royaume »
  choice: Préserver le contraste référentiel sans identifier explicitement le possesseur du royaume éternel.
  alternative: Identifier « son royaume » comme celui de Dieu, du Messie ou d’une autre figure dans le texte principal.
  rationale: Le fragment fourni ne donne pas ici l’antécédent de αὐτοῦ. Une identification explicite résoudrait une ambiguïté réelle du passage transmis.
- issue: Instabilité de l’instruction funéraire
  choice: Retenir Aséneth et Rachel dans le texte principal, avec la lecture Zilpa/Bilha en note.
  alternative: Fusionner les deux traditions ou privilégier Zilpa/Bilha dans le texte principal.
  rationale: Cette présentation suit le texte grec principal fourni tout en rendant visible l’autre lecture attestée dans la couche de consultation.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases restent proches des structures grecques lorsque celles-ci portent une ambiguïté théologique ou textuelle, mais les tournures funéraires et narratives sont rendues naturellement. Les crochets sont réservés à l’expression incertaine du texte; toutes les variantes importantes sont signalées en notes.
