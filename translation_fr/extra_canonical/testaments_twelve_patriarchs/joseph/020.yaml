    text: L’expression entre crochets est textuellement incertaine dans le témoin grec fourni.
    reason: textual_variant
  - marker: b
    text: 'D’autres témoins portent : « Faites aussi monter Zilpa, votre mère, et placez-la près de Bilha [à côté de l’Hippodrome], tout près de Rachel. »'
