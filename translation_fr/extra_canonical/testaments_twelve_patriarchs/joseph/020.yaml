base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: fr
  text: '**Testament de Joseph 20**


    **1** Je sais, en effet, qu’après ma mort les Égyptiens vous opprimeront. Mais Dieu exercera pour vous la vengeance et vous fera entrer dans les promesses faites à vos pères.


    **2** Quant à vous, vous ferez monter mes ossements avec vous, car, lorsque mes ossements seront emportés là-bas, le Seigneur sera avec vous dans la lumière, tandis que Béliar sera avec les Égyptiens dans les ténèbres.


    **3** Amenez aussi Aséneth, votre mère, [près de l’Hippodrome][a], et enterrez-la près de Rachel, ma mère.[b]


    **4** Après avoir dit cela, il étendit ses jambes et s’endormit d’un doux sommeil.


    **5** Tout Israël et toute l’Égypte portèrent pour lui un grand deuil.


    **6** Lorsque les fils d’Israël sortirent d’Égypte, ils emportèrent les ossements de Joseph et l’enterrèrent à Hébron, avec ses pères. La durée de sa vie fut de cent dix ans.


    **12**[c] Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume s’accomplit parmi vous : comme une cabane de gardien dans un verger, il disparaît après l’été.[d]


    [a] L’expression entre crochets est textuellement incertaine dans le témoin grec fourni.


    [b] D’autres témoins portent : « Faites aussi monter Zilpa, votre mère, et placez-la près de Bilha [à côté de l’Hippodrome], tout près de Rachel. »


    [c] Le passage fourni donne ici un écho de 19.12. La numérotation passe donc de 6 à 12 dans cet extrait.


    [d] La cabane du gardien était un abri saisonnier dans les cultures ; après la récolte, elle était abandonnée et disparaissait. Comparer Ésaïe 1.8.'
  philosophy: optimal-equivalence
  footnotes:
