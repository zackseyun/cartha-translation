  register: Français moderne, international et digne. Le dialogue reste direct et fluide. Le présent narratif grec λέγει est rendu par le passé simple « demanda » pour une narration française naturelle, et la valeur interrogative de la phrase est explicitée sans ajouter d’interprétation théologique.
