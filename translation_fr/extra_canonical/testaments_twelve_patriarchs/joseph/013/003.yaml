  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: fr
  text: 'Pentéphris lui demanda : « D’où vient donc ce garçon hébreu ? » Celui-ci répondit : « Les Ismaélites me l’ont confié jusqu’à leur retour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρής
  choice: Pentéphris
  rationale: Translittération française du nom grec, cohérente avec la forme attestée dans cette œuvre.
- source_word: παῖς
  choice: jeune
  rationale: Le terme peut désigner un garçon, un jeune homme ou un serviteur. « jeune Hébreu » conserve ici l’indication d’âge sans imposer le sens plus précis d’« esclave ».
- source_word: παρέθεντό μοι αὐτόν
  choice: me l’ont confié
  rationale: Rend naturellement l’idée de remettre quelqu’un à la garde ou aux soins d’une autre personne.
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: jusqu’à leur retour
  rationale: Formulation française concise et naturelle équivalant à « jusqu’à ce qu’ils reviennent ».
