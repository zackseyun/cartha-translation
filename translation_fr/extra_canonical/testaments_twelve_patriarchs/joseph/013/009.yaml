  text: But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked and beaten.
translation:
  language: fr
  text: 'Mais il me dit : « Tu mens vraiment. » Et aussitôt, il ordonna que moi aussi je sois battu nu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄντως ψεύδῃ
  choice: Tu mens vraiment
  rationale: Rend directement l’accusation au présent, tout en conservant l’intensité de ὄντως.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Exprime la succession immédiate indiquée par l’adverbe grec.
- source_word: κἀμὲ
  choice: moi aussi
  rationale: Conserve la valeur emphatique et additive de καὶ ἐμέ.
- source_word: γυμνὸν τύπτεσθαι
  choice: qu’on me déshabille […] et qu’on me frappe
  rationale: Le grec présente Joseph nu comme objet des coups; cette formulation française naturelle restitue l’ordre de le mettre à nu en vue de le battre, sans préciser davantage les agents.
