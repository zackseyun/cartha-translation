  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/002.yaml
  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: fr
  text: 'Mais le courtier tomba à ses pieds et supplia en disant : « Je vous en prie, seigneur, je ne sais pas ce que vous dites. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: courtier
  rationale: Le terme désigne ici un intermédiaire dans une transaction; « courtier » est précis, naturel et conforme au contexte.
- source_word: ἐδέετο / Δέομαί σου
  choice: le supplia / Je vous en prie
  rationale: La variation française évite une répétition pesante tout en conservant l'insistance de la supplication grecque.
- source_word: κύριε
  choice: seigneur
  rationale: Vocatif respectueux adressé à un supérieur; la minuscule évite d'en faire ici un titre divin.
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: je ne sais pas de quoi vous parlez
  rationale: Rendu idiomatique moderne du grec littéral « je ne sais pas ce que vous dites », sans changer le sens.
theological_decisions: []
translation_notes:
  register: Français moderne international, digne et accessible. Le vouvoiement marque la déférence exprimée par κύριε. L'objet de la supplication est rendu explicitement par le pronom « le », naturellement requis en français et clairement déterminé par la scène, bien que le grec emploie ἐδέετο sans complément exprimé.
