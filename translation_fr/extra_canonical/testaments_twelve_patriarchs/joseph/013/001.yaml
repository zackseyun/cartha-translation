  to: 'Mais Pentephris, convaincu par ses paroles, ordonna au courtier de venir et lui dit : « Qu’est-ce donc que j’entends dire à ton sujet : que tu enlèves des personnes du pays de Canaan et les revends comme esclaves ? »'
  rationale: La révision rétablit la forme interrogative unique de l’accusation grecque, remplace le démonstratif interprétatif « cette femme » par le possessif neutre « ses », et précise le rôle de μετάβολος par « courtier ». Elle maintient « personnes », « pays de Canaan » et « revends comme esclaves », qui rendent fidèlement le sens contextuel sans ajout doctrinal ni historique.
