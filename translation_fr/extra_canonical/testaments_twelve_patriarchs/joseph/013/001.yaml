  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Pentephris croit les paroles de la femme, fait venir l’intermédiaire et l’accuse d’enlever des personnes de Canaan pour les revendre dans l’esclavage. Toutefois, la réplique grecque est une seule interrogation introduisant l’accusation, tandis que le projet la transforme en question suivie d’une exclamation indépendante.'
  naturalness: Le français est globalement naturel et de registre approprié. Une formulation en une seule question rend plus exactement la syntaxe tout en restant fluide. « Courtier » rend mieux la fonction d’intermédiaire de μετάβολος que le générique « marchand ».
  terminology: « Personnes » est un bon rendu contextuel de ψυχάς et évite le littéralisme français trompeur « âmes ». « Revendre comme esclaves » rend correctement μεταπωλεῖς et εἰς παῖδας. Le nom Pentephris est conservé.
