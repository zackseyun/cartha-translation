  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as servants?”
translation:
  language: fr
  text: 'Mais Pentephris, convaincu par ses paroles, ordonna au courtier de venir et lui dit : « Qu’est-ce donc que j’entends dire à ton sujet : que tu enlèves des personnes du pays de Canaan et les revends comme esclaves ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: Pentephris
  rationale: Translittération traditionnelle du nom propre grec, cohérente avec l’identification du personnage dans le Testament de Joseph.
- source_word: πεισθεὶς τοῖς λόγοις αὐτῆς
  choice: convaincu par les paroles de cette femme
  rationale: Rend le participe passif et explicite naturellement en français le référent féminin, sans ajouter d’identification absente du verset.
- source_word: μετάβολον
  choice: marchand
  rationale: Dans ce contexte de revente d’une personne, le terme désigne un intermédiaire commercial ou négociant ; « marchand » est naturel et compréhensible, tandis que « courtier » serait plus technique.
- source_word: κλέπτεις ψυχὰς
  choice: tu enlèves des personnes
  rationale: ψυχάς signifie littéralement « âmes », mais désigne ici des êtres humains ; avec κλέπτεις, l’accusation porte sur leur enlèvement. Cette formulation évite l’expression française trompeuse « voler des âmes ».
- source_word: ἐκ γῆς Χαναάν
  choice: du pays de Canaan
  rationale: Rendu idiomatique et fidèle de l’origine géographique.
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: tu les revends comme esclaves
  rationale: μεταπωλεῖς exprime la revente, et εἰς παῖδας indique la condition servile à laquelle les personnes sont vendues ; « esclaves » convient mieux au contexte que le polysémique « serviteurs ».
