  text: But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”
translation:
  language: fr
  text: 'Mais il dit : « Comment es-tu devenu leur esclave ? » Et je répondis : « Parce qu’ils m’ont acheté au pays de Canaan. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Dans ce contexte d’achat d’une personne, « esclave » rend plus précisément le statut exprimé par le grec que « serviteur ».
- source_word: ἐκ γῆς Χαναὰν
  choice: au pays de Canaan
  rationale: Avec un verbe d’achat, ἐκ peut désigner le lieu où la transaction ou la prise de possession a eu lieu; cette formulation française naturelle préserve ce sens contextuel.
- source_word: ἐπριάσαντό με
  choice: ils m’ont acheté
  rationale: Rend directement l’aoriste moyen de πρίαμαι, dont le sens est « acheter, acquérir par achat ».
