base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: fr
  text: 'Mais il ne le crut pas ; au contraire, il ordonna qu’on le frappe nu. Comme celui-ci persistait dans ces paroles, Pentéphris dit : « Qu’on fasse donc venir le jeune homme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυμνὸν τύπτεσθαι
  choice: qu’on le déshabille et qu’on le frappe
  rationale: Rend naturellement en français l’ordre de le frapper alors qu’il est nu, sans donner à « nu » une valeur adverbiale maladroite.
- source_word: ἐπιμένοντος
  choice: persistait
  rationale: Conserve l’idée qu’il maintenait fermement ses propos malgré le traitement subi.
- source_word: τούτοις τοῖς λόγοις
  choice: dans ses déclarations
  rationale: Ici, λόγοις désigne les propos ou affirmations qu’il continue de soutenir ; « déclarations » est clair et digne.
- source_word: Ἐναχθήτω
  choice: Qu’on fasse venir
  rationale: Traduit l’impératif passif indiquant qu’il faut amener ou introduire le jeune homme auprès de Pentéphris.
- source_word: νεανίσκος
  choice: le jeune homme
  rationale: Équivalent direct et naturel du grec.
