  verdict: revise
  source_fidelity: 'La trame est fidèle au grec : refus de croire, ordre de châtiment, persistance dans les mêmes propos, puis ordre d’amener le jeune homme. Toutefois, « qu’on le déshabille et qu’on le frappe » explicite un acte préalable que γυμνὸν τύπτεσθαι n’énonce pas directement ; le grec dit qu’il soit battu nu.'
  naturalness: Le français est moderne et narratif. « Comme celui-ci persistait dans ces paroles » rend plus directement τούτοις τοῖς λόγοις que « dans ses déclarations », tout en gardant une formulation naturelle.
  terminology: « Pentéphris » correspond à Πεντεφρής dans l’édition fournie. « Le jeune homme » rend correctement νεανίσκος. Aucun terme théologique n’est en jeu.
  issues:
