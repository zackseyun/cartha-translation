    issue: Ajout explicite du déshabillage
    rationale: La formulation actuelle transforme l’état exprimé par γυμνόν (« nu ») en une action distincte (« qu’on le déshabille »). Même si ce déshabillage peut être implicite dans le contexte, il n’est pas formulé par le grec et ne doit pas être ajouté.
