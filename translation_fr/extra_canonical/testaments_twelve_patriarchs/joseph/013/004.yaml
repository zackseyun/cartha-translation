  to: 'Mais il ne le crut pas ; au contraire, il ordonna qu’on le frappe nu. Comme celui-ci persistait dans ces paroles, Pentéphris dit : « Qu’on fasse donc venir le jeune homme. »'
  rationale: La révision remplace l’explicitation non exprimée du déshabillage par « qu’on le frappe nu », qui conserve l’état indiqué par γυμνόν et le passif infinitif τύπτεσθαι. Elle rapproche également « ces paroles » de τούτοις τοῖς λόγοις sans alourdir le récit.
