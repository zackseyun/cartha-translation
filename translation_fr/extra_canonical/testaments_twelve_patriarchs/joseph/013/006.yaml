  text: And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”
translation:
  language: fr
  text: 'Après m’avoir séparé de lui, il me demanda : « Es-tu esclave ou libre ? » Je répondis : « Esclave. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας
  choice: Après m’avoir séparé
  rationale: Le participe aoriste exprime une action antérieure à la question ; cette formulation conserve le sens tout en étant naturelle en français.
- source_word: Δοῦλος
  choice: esclave
  rationale: Dans ce contraste explicite avec ἐλεύθερος (« libre »), δοῦλος désigne une personne privée de liberté plutôt qu’un simple serviteur.
- source_word: λέγει
  choice: il me demanda
  rationale: Bien que le verbe signifie littéralement « il dit », la parole rapportée est une question directe ; « demanda » rend naturellement sa fonction en français.
- source_word: ἐλεύθερος
  choice: libre
  rationale: Équivalent direct qui préserve l’opposition juridique et sociale avec « esclave ».
