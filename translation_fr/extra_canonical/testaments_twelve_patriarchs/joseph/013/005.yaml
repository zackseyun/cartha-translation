  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: fr
  text: Quand on m’eut fait entrer, je me prosternai devant Pentéphris³⁵, car il occupait le troisième rang³⁶ parmi les dignitaires³⁷ de Pharaon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθείς
  choice: Quand on m’eut fait entrer
  rationale: Le participe aoriste passif indique que Joseph fut introduit; cette tournure française rend naturellement l’antériorité par rapport à l’action principale.
- source_word: προσεκύνησα
  choice: je me prosternai devant
  rationale: Le verbe désigne ici un geste de déférence envers un haut personnage, sans imposer le sens cultuel d’« adorer ».
- source_word: Πεντεφρῇ
  choice: Pentéphris
  rationale: Translittération française du nom grec, cohérente avec la forme transmise dans cette version du Testament de Joseph.
- source_word: τρίτος … ἐν ἀξιώματι
  choice: il occupait le troisième rang
  rationale: Expression idiomatique qui conserve précisément l’idée de troisième position dans la hiérarchie.
- source_word: παρὰ τῶν Φαραὼ ἀρχόντων
  choice: parmi les dignitaires de Pharaon
  rationale: Le grec transmis est textuellement difficile, mais le sens contextuel est celui d’un rang au sein des hauts responsables de Pharaon; « dignitaires » convient à leur statut officiel.
