base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: fr
  text: Dans dix épreuves, elle a montré que j’étais digne d’approbation; dans toutes, j’ai été patient. Car la patience est un grand remède, et l’endurance procure de nombreux bienfaits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειρασμοῖς
  choice: épreuves
  rationale: Dans ce récit de mise à l’épreuve, « épreuves » exprime naturellement le sens de tests éprouvants sans réduire le terme aux seules tentations morales.
- source_word: δόκιμον ἀπέδειξέ με
  choice: il a montré que j’étais digne d’approbation
  rationale: Conserve l’idée qu’une épreuve révèle une qualité éprouvée et reconnue, plutôt que le simple fait d’avoir été testé.
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: j’ai fait preuve de patience / la patience
  rationale: Rend l’endurance patiente et la maîtrise de soi dans l’adversité en français actuel.
- source_word: φάρμακον
  choice: remède
  rationale: Le sens métaphorique de moyen curatif ou salutaire est direct et idiomatique.
- source_word: ἡ ὑπομονή
  choice: la persévérance
  rationale: Distingue ce terme de μακροθυμία tout en exprimant le fait de tenir ferme sous l’épreuve.
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: procure beaucoup de bienfaits
  rationale: Formulation française naturelle qui préserve l’idée de nombreux biens accordés ou produits.
theological_decisions:
- issue: Référent du sujet implicite dans ἀπέδειξέ
  choice: « il », sans identification supplémentaire
  alternative: « elle », en référence à la femme mentionnée dans le contexte précédent
  rationale: Le grec transmis porte un sujet implicite, et l’extrait isolé ne permet pas de fixer grammaticalement son identité. Le masculin non marqué maintient cette réserve, conformément à la couche anglaise auditée, sans ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la distinction entre μακροθυμία (« patience ») et ὑπομονή (« persévérance »), ainsi que l’image médicale du « remède ».
