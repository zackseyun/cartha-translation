review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : menaces de mort, remise aux châtiments, invitation sexuelle euphémisée et promesse de domination domestique. Cependant, le δεύτερο membre grec comporte une séquence explicitement placée entre crochets dans l’édition (« et me menaça ») ; cette incertitude textuelle doit être signalée plutôt que laissée sans note.'
  naturalness: Le français est globalement naturel et de registre adéquat. « Me fit revenir » rend plus clairement ἀνεκαλέσατο (« fit revenir / rappela ») que « puis rappelé », qui peut paraître elliptique et, en français moderne, évoquer le fait de rappeler un souvenir.
  terminology: « L’Égyptienne », « châtiments », « m’unir à elle », « autorité », « te donnes à moi » et « notre maître » conviennent au grec et au contexte. « Notre maître » conserve la force domestique de δεσπότης sans surinterprétation.
  issues:
  - severity: medium
    issue: La clause « et me menaça » est textuellement incertaine dans l’édition source.
    rationale: Elle est imprimée entre crochets ([καὶ ἠπείλησέ μοι]). Puisque le texte anglais l’inclut, elle peut être maintenue, mais une note doit informer le lecteur de son statut incertain.
  - severity: low
    issue: « Puis rappelé » est peu idiomatique et ambigu en français moderne.
    rationale: Le grec ἀνεκαλέσατο vise l’action de rappeler ou de faire revenir Joseph. « Me fit revenir » exprime clairement cette action narrative.
  revised_text: 'Combien de fois l’Égyptienne m’a-t-elle menacé de mort ! Combien de fois, après m’avoir livré aux châtiments, m’a-t-elle fait revenir et m’a-t-elle menacé !a Et, comme je refusais de m’unir à elle, elle me disait : « Tu auras autorité sur moi aussi et sur tous ceux qui sont dans ma maison, si tu te donnes à moi, et tu seras comme notre maître. »'
  revised_footnotes:
  - marker: a
    text: '« Et m’a-t-elle menacé » : ces mots sont placés entre crochets dans l’édition grecque utilisée et leur présence dans le texte est incertaine.'
    reason: Signale l’incertitude textuelle visible dans la source tout en conservant dans le texte la lecture suivie par l’audit anglais.
  revision_rationale: La révision conserve la lecture de l’anglais POB et tous les euphémismes du grec, améliore la clarté de ἀνεκαλέσατο par « me fit revenir » et ajoute une note indispensable sur la clause entre crochets.
