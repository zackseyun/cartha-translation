revisions:
- from: 'Combien de fois l’Égyptienne m’a-t-elle menacé de mort ! Combien de fois m’a-t-elle livré aux châtiments, puis rappelé et menacé ! Et comme je refusais de m’unir à elle, elle me disait : « Tu auras autorité sur moi aussi et sur tous ceux de ma maison, si tu te donnes à moi, et tu seras comme notre maître. »'
  to: 'Combien de fois l’Égyptienne m’a-t-elle menacé de mort ! Combien de fois, après m’avoir livré aux châtiments, m’a-t-elle fait revenir et m’a-t-elle menacé !a Et, comme je refusais de m’unir à elle, elle me disait : « Tu auras autorité sur moi aussi et sur tous ceux qui sont dans ma maison, si tu te donnes à moi, et tu seras comme notre maître. »'
  rationale: La révision conserve la lecture de l’anglais POB et tous les euphémismes du grec, améliore la clarté de ἀνεκαλέσατο par « me fit revenir » et ajoute une note indispensable sur la clause entre crochets.
