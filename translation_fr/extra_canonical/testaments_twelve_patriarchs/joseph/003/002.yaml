  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: fr
  text: 'Combien de fois l’Égyptienne m’a-t-elle menacé de mort ! Combien de fois, après m’avoir livré aux châtiments, m’a-t-elle fait revenir et m’a-t-elle menacé !a Et, comme je refusais de m’unir à elle, elle me disait : « Tu auras autorité sur moi aussi et sur tous ceux qui sont dans ma maison, si tu te donnes à moi, et tu seras comme notre maître. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: l’Égyptienne
  rationale: Reproduit naturellement en français le substantif féminin grec désignant la femme égyptienne, sans ajouter une identification absente du verset.
- source_word: τιμωρίαις
  choice: aux châtiments
  rationale: Conserve le pluriel et la notion de sanctions ou sévices imposés.
- source_word: συνελθεῖν αὐτῇ
  choice: m’unir à elle
  rationale: Rend avec dignité l’euphémisme grec à portée sexuelle, sans le rendre inutilement explicite ni en effacer le sens.
- source_word: Κυριεύσεις
  choice: Tu auras autorité
  rationale: Exprime l’exercice de la domination promis par le verbe grec, dans un français courant.
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: si tu te donnes à moi
  rationale: Préserve l’image réflexive et relationnelle du grec ainsi que son invitation sexuelle implicite.
- source_word: δεσπότης ἡμῶν
  choice: notre maître
  rationale: Rend le titre d’autorité forte sans introduire une nuance théologique étrangère au contexte domestique.
theological_decisions:
- issue: Nature de l’offre faite à Joseph
  choice: Maintenir à la fois l’invitation sexuelle voilée et la promesse d’autorité domestique
  alternative: Expliciter l’acte sexuel ou interpréter la promesse comme un transfert juridique précis
  rationale: Le grec formule l’union par euphémisme et ne précise pas le mécanisme exact de l’autorité promise ; la traduction conserve cette tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. Les exclamations et la répétition rhétorique de « Combien de fois » sont conservées. La séquence textuellement instable autour de « puis rappelé et menacé » est rendue dans le corps du texte sans note, conformément au sens attesté par le texte fourni.
