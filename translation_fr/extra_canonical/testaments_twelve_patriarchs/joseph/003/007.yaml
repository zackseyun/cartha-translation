lexical_decisions:
- source_word: τέκνον ἄρρεν
  choice: enfant mâle
  rationale: Rend directement l’expression grecque, qui précise le sexe de l’enfant, sans introduire l’idée plus étroite de « fils ».
- source_word: προσεποιεῖτο
  choice: elle faisait semblant
  rationale: L’imparfait exprime une action en cours ou répétée; le verbe signifie feindre ou faire semblant. Le complément absent n’est pas ajouté.
