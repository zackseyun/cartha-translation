revisions:
- from: 4. Pendant ces sept années-là, je jeûnais, tout en paraissant à l’Égyptien mener une vie d’abondance ; car ceux qui jeûnent pour Dieu reçoivent un visage plein de grâce.[a]
  to: 4. Pendant ces sept années-là, je jeûnais et, aux yeux de l’Égyptien, je paraissais vivre dans le luxe ; car ceux qui jeûnent pour Dieu reçoivent de la grâce sur leur visage.[a]
  rationale: La révision clarifie la relation entre l’apparence de Joseph et le regard de l’Égyptien, rend τρυφή par « luxe », et conserve plus explicitement le lien grec entre χάρις et πρόσωπον. Elle ne précise pas la nature exacte de cette grâce, que le texte laisse ouverte.
