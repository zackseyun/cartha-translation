  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: fr
  text: 4. Pendant ces sept années-là, je jeûnais et, aux yeux de l’Égyptien, je paraissais vivre dans le luxe ; car ceux qui jeûnent pour Dieu reçoivent de la grâce sur leur visage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « reçoivent la grâce du visage ». L’expression peut désigner une apparence gracieuse ou agréable, ou une faveur visible sur le visage.'
    reason: La tournure grecque τοῦ προσώπου τὴν χάριν est concrète tout en restant sémantiquement ouverte ; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: ἐνήστευον
  choice: je jeûnais
  rationale: L’imparfait rend naturellement l’action habituelle ou prolongée durant les sept années.
- source_word: ἐν τοῖς ἑπτὰ ἔτεσιν ἐκείνοις
  choice: pendant ces sept années-là
  rationale: Rend explicitement la durée et conserve la valeur démonstrative de ἐκείνοις.
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: mener une vie d’abondance
  rationale: τρυφή évoque ici l’aisance, le bien-être ou l’opulence apparente ; « abondance » reste naturel sans imposer l’idée de débauche.
- source_word: διὰ τὸν θεόν
  choice: pour Dieu
  rationale: Conserve la formulation concise et la possible nuance de motif ou d’orientation du jeûne.
- source_word: τοῦ προσώπου τὴν χάριν
  choice: un visage plein de grâce
  rationale: 'Préserve l’image concrète du visage et la polysémie de χάρις : grâce, faveur, charme ou agrément.'
theological_decisions:
- issue: Rapport entre le jeûne pour Dieu et l’apparence extérieure
  choice: Conserver l’affirmation selon laquelle les jeûneurs reçoivent « un visage plein de grâce »
  alternative: « voient leur apparence devenir agréable » ou « reçoivent de la faveur dans leur apparence »
  rationale: Le grec relie directement χάρις au visage sans préciser s’il s’agit d’une beauté visible, d’un air favorable ou d’une faveur divine perceptible ; la traduction maintient cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le contraste entre le jeûne réel de Joseph et son apparence d’aisance aux yeux de l’Égyptien, avec une formulation fluide mais proche de la structure grecque.
