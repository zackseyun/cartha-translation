base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: fr
  text: Je me levais de bonne heure pour prier le Seigneur et je pleurais à cause de Memphis, l’Égyptienne, car elle me tourmentait beaucoup, sans relâche. Même la nuit, en effet, elle entrait chez moi sous prétexte de me rendre visite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤρθριζον πρὸς Κύριον
  choice: Je me levais de bonne heure pour prier le Seigneur
  rationale: ὀρθρίζω indique le fait de se lever ou d’agir dès le matin. La finalité dévotionnelle de πρὸς Κύριον est rendue naturellement par « pour prier le Seigneur », sans réduire l’expression à un simple déplacement.
- source_word: ἔκλαιον περὶ Μεμφίας
  choice: je pleurais à cause de Memphis
  rationale: περί avec le génitif peut signifier « au sujet de » ou « à cause de ». Le contexte de harcèlement favorise ici « à cause de », tout en conservant le lien direct entre ses pleurs et Memphis.
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: elle me tourmentait beaucoup, sans relâche
  rationale: ἐνοχλέω exprime une gêne pressante ou un tourment. « Sans relâche » restitue l’insistance de ἀδιαλείπτως, et « beaucoup » celle de σφόδρα.
- source_word: λόγῳ ἐπισκέψεως
  choice: sous prétexte de me rendre visite
  rationale: λόγῳ peut indiquer le motif déclaré ou le prétexte, tandis que ἐπίσκεψις désigne ici une visite. Le contexte hostile justifie « sous prétexte », sans préciser davantage ses intentions.
theological_decisions:
- issue: Sens dévotionnel de πρὸς Κύριον
  choice: « pour prier le Seigneur »
  alternative: « devant le Seigneur » ou « vers le Seigneur »
  rationale: Le grec ne contient pas explicitement le verbe « prier », mais les pleurs adressés à Dieu et l’usage dévotionnel de la construction rendent cette explicitation naturelle en français. Elle ne détermine pas le contenu précis de la supplication.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait restitue les actions répétées du grec. « Memphis » est conservé comme nom propre féminin, suivi de l’apposition explicative « l’Égyptienne ».
