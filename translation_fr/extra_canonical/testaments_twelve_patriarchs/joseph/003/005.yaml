  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: fr
  text: Et si mon maître était absent, je ne buvais pas de vin ; pendant trois jours, je prenais ma nourriture et je la donnais aux pauvres et aux malades.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: était absent
  rationale: Le verbe indique que le maître était parti ou se trouvait loin de chez lui ; cette formulation naturelle conserve l’idée sans préciser inutilement la nature du déplacement.
- source_word: τριημερίζων
  choice: pendant trois jours
  rationale: Le participe exprime une période de trois jours. Sa relation exacte avec l’action suivante reste concise dans le grec ; la traduction conserve cette durée sans ajouter explicitement un jeûne, que le texte ne nomme pas.
- source_word: ἐλάμβανον μου τὴν τροφήν
  choice: je mettais de côté ma nourriture
  rationale: Littéralement, Joseph « prenait sa nourriture », mais le contexte immédiat précise qu’il la donnait ensuite. « Mettais de côté » rend naturellement cette mise à disposition sans suggérer qu’il la mangeait.
- source_word: πένησιν καὶ ἀσθενοῦσιν
  choice: aux pauvres et aux malades
  rationale: Équivalents français directs, courants et dignes des deux groupes bénéficiaires.
