  source_fidelity: La traduction de ἀπεδήμει par « était absent » est juste dans son contexte, mais « lorsque » atténue la valeur conditionnelle de ἐάν. « Mettais de côté » ne correspond pas au verbe ἐλάμβανον (« je prenais/recevais ») et introduit une étape absente du grec. La durée exprimée par τριημερίζων est rendue de manière sobre par « pendant trois jours », conformément aussi à la piste d’audit anglaise.
  naturalness: La formulation révisée reste naturelle et fluide en français moderne. L’imparfait convient à la présentation d’une conduite répétée ou caractéristique.
  terminology: « Maître », « vin », « pauvres » et « malades » sont des équivalents directs et de registre approprié. Aucun terme théologique spécialisé n’est en jeu.
