    rationale: Cette expression interprète ἐλάμβανον (« je prenais ») comme une mise en réserve. Le grec ne dit pas explicitement qu’il mettait la nourriture de côté ; il dit qu’il la prenait puis la donnait.
  - severity: low
    issue: « lorsque » pour ἐάν
    rationale: La conjonction ἐάν porte une nuance conditionnelle (« si »), que « lorsque » transforme en simple repère temporel.
