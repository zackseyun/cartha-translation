  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/003.yaml
  text: But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.
translation:
  language: fr
  text: Quant à moi, je me souvenais des paroles de mon père et, en entrant dans la pièce intérieure tout en pleurant, je priais le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Mais moi
  rationale: Rend à la fois le contraste marqué par δέ et l’insistance du pronom ἐγώ.
- source_word: ἐμνημόνευον
  choice: je me souvenais
  rationale: L’imparfait exprime ici une action ou un état en cours dans le récit.
- source_word: λόγους πατρός μου
  choice: des paroles de mon père
  rationale: Traduction naturelle de λόγους, qui désigne ici les propos ou enseignements du père.
- source_word: τὸ ταμεῖον
  choice: la réserve
  rationale: Le terme désigne d’abord une pièce intérieure servant de réserve ou de lieu retiré; « réserve » conserve son sens concret sans imposer « chambre ».
- source_word: κλαίων
  choice: en pleurant
  rationale: Le participe présent indique une action concomitante à l’entrée et à la prière.
- source_word: προσηυχόμην Κυρίῳ
  choice: je priais le Seigneur
  rationale: L’imparfait est conservé et le datif Κυρίῳ est rendu par le complément français usuel de « prier ».
theological_decisions:
- issue: Référent de « Seigneur »
  choice: le Seigneur
  alternative: le Seigneur Dieu
  rationale: Le grec porte seulement Κυρίῳ; aucun complément explicatif n’est ajouté.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe garde la progression du grec et ses imparfaits, tout en restant naturelle.
