  source_fidelity: 'La voix passive de συνήχθησαν doit être conservée dans le texte principal : les neuf cerfs « furent réunis » aux autres, sans agent explicité. La dernière proposition doit également garder ἐγίνοντο (« devinrent ») plutôt que suggérer qu’ils ont activement « formé » des troupeaux.'
  naturalness: Le français est globalement naturel et de registre approprié. « Deviennent de nombreux troupeaux » est volontairement imagé, mais rend la transformation symbolique du grec plus exactement que « formèrent de nombreux troupeaux ».
  terminology: « Seigneur », « cerfs », « brebis » et « troupeaux » sont des choix justes et cohérents. Aucune interprétation allégorique ne doit être introduite.
