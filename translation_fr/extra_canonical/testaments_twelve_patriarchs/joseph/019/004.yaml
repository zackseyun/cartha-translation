    rationale: Le grec est passif et ne précise pas l’agent. Le réfléchi est une possibilité interprétative, mais il ne devrait pas remplacer le passif dans le texte principal.
  - severity: medium
    issue: « Ils se multiplièrent et formèrent de nombreux troupeaux » affaiblit le second ἐγίνοντο.
    rationale: ἐγίνοντο signifie « ils devenaient/devinrent »; « formèrent » attribue une action de constitution qui n’est pas exprimée et atténue l’imagerie de transformation.
