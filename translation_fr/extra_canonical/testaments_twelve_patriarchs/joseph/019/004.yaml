source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: fr
  text: Et là, ils crièrent vers le Seigneur jusqu’à ce que les neuf cerfs soient réunis auprès d’eux[a], et ils devinrent comme douze brebis. Peu de temps après, ils se multiplièrent et devinrent de nombreux troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce que les neuf cerfs se rassemblent auprès d’eux ». Le grec emploie un passif et ne précise pas l’agent du rassemblement.'
    reason: Préserve dans le texte principal la voix passive de συνήχθησαν, tout en signalant la possibilité d’une compréhension à valeur réflexive.
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  choice: ils crièrent vers le Seigneur
  rationale: Conserve l’idée d’un appel pressant adressé au Seigneur, avec une formulation naturelle et digne en français.
- source_word: οἱ ἐννέα ἔλαφοι
  choice: les neuf cerfs
  rationale: Rend directement l’image animale du grec sans l’interpréter allégoriquement.
- source_word: ὡς δώδεκα πρόβατα
  choice: comme douze brebis
  rationale: Préserve la comparaison introduite par ὡς ainsi que le contraste symbolique entre les cerfs et les brebis.
- source_word: ηὐξάνοντο
  choice: ils se multiplièrent
  rationale: Dans le contexte de troupeaux qui deviennent nombreux, le verbe exprime une augmentation numérique plutôt qu’une simple croissance physique.
- source_word: ἐγίνοντο ποίμνια πολλά
  choice: formèrent de nombreux troupeaux
  rationale: Formulation française naturelle qui conserve le passage d’un groupe de douze brebis à une pluralité de troupeaux.
theological_decisions:
- issue: Identification symbolique des cerfs, des brebis et des troupeaux
  choice: Maintenir les images sans en expliciter les référents
  alternative: Identifier dans le corps du texte les personnes ou groupes représentés par ces animaux
  rationale: Le verset présente une vision symbolique sans fournir ici son interprétation; l’expliciter imposerait une lecture théologique extérieure au texte.
- issue: Lien temporel exprimé par μέχρι
  choice: jusqu’à ce que
  alternative: tandis que
  rationale: Le grec marque que leur cri se prolonge jusqu’au rassemblement des neuf cerfs, même si la relation précise entre la prière et l’événement demeure implicite.
translation_notes:
  register: Français moderne international, narratif et digne. La syntaxe a été légèrement répartie en trois phrases pour assurer la lisibilité tout en préservant la progression de la vision et son imagerie.
