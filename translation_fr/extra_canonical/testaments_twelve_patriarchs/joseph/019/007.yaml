  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: fr
  text: Et je vis un veau qui les entourait douze fois, et il devint pour les taureaux un secours complet[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec rendu par « complet » est signalé comme incertain dans l’édition du texte source.
    reason: L’édition imprime ὁλοκλήρως avec un point d’interrogation; la note conserve cette incertitude textuelle au mot concerné.
lexical_decisions:
- source_word: μόσχον
  choice: un veau
  rationale: Le terme grec désigne un jeune bovin; « veau » conserve l’image de la vision sans préciser un sexe que le mot n’impose pas ici.
- source_word: δωδεκάκις περιέβαλλε
  choice: les entoura douze fois
  rationale: Cette formulation rend directement le nombre et le mouvement d’encerclement exprimés par le grec.
- source_word: τοῖς βουσὶ
  choice: aux taureaux
  rationale: Dans le cadre symbolique de la vision, « taureaux » restitue les bovins adultes et suit la désignation retenue dans le contexte, plutôt que le terme plus utilitaire « bœufs ».
- source_word: ὁλοκλήρως … εἰς βοήθειαν
  choice: vint entièrement en aide
  rationale: Cette tournure française naturelle conserve l’idée qu’il devint un secours complet pour les taureaux, tout en évitant le calque peu idiomatique « devint entièrement une aide ».
theological_decisions:
- issue: Identification symbolique du veau et des taureaux
  choice: Ne pas expliciter leur identité dans le texte
  alternative: Identifier les figures à des personnes ou à des groupes précis
  rationale: Le verset présente les figures sans les interpréter explicitement; ajouter une identification résoudrait indûment la tension symbolique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec, tandis que « vint … en aide » assure une expression naturelle et compréhensible.
