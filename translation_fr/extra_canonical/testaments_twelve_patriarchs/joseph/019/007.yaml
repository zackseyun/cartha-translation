- from: Et je vis un veau qui les entoura douze fois, et il vint entièrement[a] en aide aux taureaux.
  to: Et je vis un veau qui les entourait douze fois, et il devint pour les taureaux un secours complet[a].
  rationale: La révision restitue l'imparfait descriptif de la vision (« entourait ») et, surtout, la construction « devint ... un secours » avec l'adverbe rendu comme qualifiant le secours. Elle maintient sans interprétation l'imagerie du veau et des taureaux ainsi que l'incertitude éditoriale sur ὁλοκλήρως.
