  source_fidelity: 'Le rendu conserve fidèlement la vision : les douze bovins mâles tètent une génisse, une « mer de lait » est produite, et les douze troupeaux avec des troupeaux innombrables y boivent. La lacune après ἐκ empêche de fixer avec certitude toute la formulation de la proposition relative ; l’attribution à la génisse est contextuellement probable et doit rester signalée.'
