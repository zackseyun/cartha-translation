  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: fr
  text: 'Après cela, je vis — et voici : douze taureaux tétaient une seule génisse. Celle-ci produisait une mer de lait[a], et les douze troupeaux ainsi que d’innombrables troupeaux y buvaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette proposition est lacunaire ou altéré ; le sens général paraît être que la génisse produisait une mer de lait.
    reason: Signaler honnêtement l’incertitude matérielle et syntaxique de la source tout en donnant dans le corps du texte la lecture contextuelle la plus probable.
lexical_decisions:
- source_word: βόες
  choice: taureaux
  rationale: Dans cette vision, le contexte et la tradition textuelle indiquent des bovins mâles; « taureaux » conserve aussi le caractère saisissant de l’image où ils tètent.
- source_word: θηλάζοντες
  choice: tétaient
  rationale: Rend directement l’action de prendre le lait au pis, sans atténuer l’étrangeté de la scène.
- source_word: δάμαλιν
  choice: génisse
  rationale: Terme naturel et précis pour une jeune femelle bovine.
- source_word: γάλακτος θάλασσαν ἐποίει
  choice: produisait une mer de lait
  rationale: Expression française naturelle qui garde l’image hyperbolique de la mer et la valeur causative de ἐποίει.
- source_word: ποίμναι / ποίμνια
  choice: troupeaux / troupeaux
  rationale: Le grec emploie deux formes apparentées; le français courant « troupeaux » convient aux deux tout en permettant de distinguer les douze premiers des innombrables autres.
theological_decisions:
- issue: Identification symbolique de la génisse, des taureaux et des troupeaux
  choice: Laisser les figures sans interprétation ajoutée
  alternative: Identifier explicitement leurs référents théologiques ou historiques
  rationale: Le verset rapporte une vision symbolique sans en donner ici l’interprétation; une identification explicite importerait une lecture extérieure au texte.
- issue: Sujet de la production de la mer de lait
  choice: « Celle-ci » renvoie à la génisse
  alternative: 'Employer un sujet impersonnel: « il se forma une mer de lait »'
  rationale: Le contexte associe naturellement le lait à la génisse, mais l’état incertain du texte grec impose de signaler cette difficulté en note plutôt que de présenter la syntaxe comme parfaitement assurée.
translation_notes:
  register: Français international moderne, narratif et digne. Le tiret et « et voici » conservent l’effet d’apparition de la vision sans lourdeur archaïque. « À laquelle buvaient » exprime naturellement l’idée grecque de boire à cette source, et « autres » clarifie que les troupeaux innombrables s’ajoutent aux douze sans modifier le contenu.
