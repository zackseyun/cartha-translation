source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὑμεῖς οὖν, τέκνα μου, φυλάξατε τὰς ἐντολὰς Κυρίου, καὶ τιμᾶτε³⁸ τὸν *Λευὶ καὶ τὸν Ἰούδαν³⁹. ὅτι *ἐκ τοῦ σπέρματος⁴⁰ αὐτῶν ἀνατελεῖ ὑμῖν⁴¹ [ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου]⁴², σώζων [πάντα τὰ ἔθνη καὶ]⁴⁸ τὸν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: fr
  text: Vous donc, mes enfants, gardez les commandements du Seigneur et honorez Lévi et Juda, car de leur descendance se lèvera pour vous [l’Agneau de Dieu, qui enlève le péché du monde][a], sauvant [toutes les nations et][a] Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots placés entre crochets sont textuellement incertains dans la tradition manuscrite de ce passage.
    reason: Le texte grec fourni signale ces deux segments par des crochets éditoriaux ; la note en indique le statut sans les supprimer ni trancher la question textuelle.
lexical_decisions:
- source_word: φυλάξατε
  choice: gardez
  rationale: Rend l’impératif par un verbe biblique courant qui signifie observer fidèlement, sans l’alourdir par une paraphrase.
- source_word: τιμᾶτε
  choice: honorez
  rationale: Correspond directement au sens de manifester respect et considération.
- source_word: ἐκ τοῦ σπέρματος αὐτῶν
  choice: de leur descendance
  rationale: « Descendance » exprime naturellement en français moderne le sens généalogique de σπέρμα.
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Préserve l’image d’un astre ou d’une lumière qui se lève, ainsi que la valeur future du verbe.
- source_word: ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου
  choice: qui enlève le péché du monde
  rationale: Rend littéralement αἴρων et conserve l’écho johannique manifeste sans développer son interprétation.
- source_word: σώζων
  choice: sauvant
  rationale: Le participe présent maintient la construction grecque et son lien syntaxique potentiellement ambigu avec celui qui se lève.
theological_decisions:
- issue: Identification et fonction de « l’Agneau de Dieu »
  choice: Conserver la formulation christologique transmise entre crochets sans explicitation doctrinale.
  alternative: Identifier explicitement l’Agneau à Jésus-Christ ou expliquer la portée expiatoire de l’expression.
  rationale: Le texte source emploie ce titre et la formule « enlève le péché du monde », mais une explicitation confessionnelle dépasserait la traduction.
- issue: Portée du salut
  choice: Maintenir entre crochets « toutes les nations et », conformément au signalement textuel de l’édition.
  alternative: Ne lire que « sauvant Israël ».
  rationale: La présentation éditoriale indique une portion textuellement incertaine; la conserver entre crochets préserve cette donnée sans trancher.
- issue: Référent de « leur descendance »
  choice: Garder le pluriel collectif renvoyant à Lévi et Juda.
  alternative: Répartir les rôles ou attribuer exclusivement la figure annoncée à Juda.
  rationale: Le grec dit explicitement αὐτῶν (« leur ») et ne précise pas davantage le rapport entre les deux lignées.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en demeurant naturelle. « Mes enfants », « gardez les commandements » et « Agneau de Dieu » conservent le registre testamentaire et biblique du passage.
