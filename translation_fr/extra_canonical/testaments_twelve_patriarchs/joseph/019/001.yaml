base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: fr
  text: En effet, il m’a aussi donné une beauté supérieure à celle des beaux hommes d’Israël et m’a préservé jusqu’à la vieillesse, dans la force et la beauté ; car j’étais en tout point semblable à Jacob. Écoutez aussi, mes enfants, ce que je sais au sujet des rêves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque est incertaine ; la leçon conservée signifie littéralement « les rêves que je connais » ou « ce que je sais au sujet des rêves ».
    reason: Le signe critique devant οἶδα dans l’édition signale une difficulté textuelle. La note maintient la leçon « savoir/connaître » sans la remplacer par « voir » et conserve le pluriel « rêves ».
lexical_decisions:
- source_word: ὡραιότητα … ὡραίους
  choice: « une beauté supérieure à celle des beaux hommes »
  rationale: Rend le rapprochement lexical grec entre la beauté de Joseph et les hommes réputés beaux, tout en restant idiomatique en français.
- source_word: ἐφύλαξέ με
  choice: « m’a gardé »
  rationale: Conserve le sens de protection et de préservation du verbe grec sans préciser un agent autrement que ne le fait le contexte.
- source_word: ἕως γήρους ἐν δυνάμει καὶ ἐν κάλλει
  choice: « jusqu’à la vieillesse, plein de force et de beauté »
  rationale: Exprime naturellement le maintien de la force et de la beauté jusque dans la vieillesse.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: « j’étais en tout point semblable à Jacob »
  rationale: Reproduit directement la comparaison globale formulée par le grec.
- source_word: περὶ ὧν … ἐνυπνίων
  choice: « ce qui concerne les rêves »
  rationale: Respecte le pluriel ἐνυπνίων et la construction περί, sans réduire le passage à un seul rêve.
- source_word: οἶδα
  choice: « dont j’ai connaissance »
  rationale: Suit le sens du verbe « savoir, connaître » plutôt que de le remplacer par « voir », malgré le caractère textuellement suspect de la leçon.
theological_decisions:
- issue: Identité implicite de celui qui donne et préserve
  choice: Maintenir les pronoms « il » et « m’ » sans ajouter « Dieu »
  alternative: Expliciter « Dieu m’a donné… »
  rationale: Le texte grec ne nomme pas explicitement le sujet dans ce verset; l’expliciter résoudrait une donnée contextuelle que la traduction peut laisser implicite.
- issue: Nature de la ressemblance avec Jacob
  choice: « en tout point semblable à Jacob »
  alternative: Limiter la ressemblance à l’apparence physique
  rationale: Le grec dit ἐν πᾶσι (« en toutes choses / en tout point »); limiter la comparaison à la beauté introduirait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Oui » rend l’emphase initiale; la syntaxe demeure solennelle sans archaïsmes. Le pluriel « rêves » et la valeur de connaissance de οἶδα sont conservés.
