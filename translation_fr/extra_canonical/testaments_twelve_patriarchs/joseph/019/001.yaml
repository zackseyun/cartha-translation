  revision_rationale: 'La révision est limitée à des améliorations sûres de fidélité et de syntaxe : elle restitue l’addition emphatique initiale, emploie « préservé » pour ἐφύλαξέ με, et reformule la dernière proposition afin que l’exhortation à écouter soit naturelle en français. Elle ne résout pas la difficulté textuelle autour de οἶδα et la signale explicitement en note.'
