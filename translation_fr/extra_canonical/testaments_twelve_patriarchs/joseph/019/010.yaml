  text: But these things will happen in their time, in the last days.
translation:
  language: fr
  text: Mais ces choses arriveront en leur temps, dans les derniers jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: Mais ces choses
  rationale: « Ces choses » reprend naturellement ce qui précède; δέ marque ici une transition ou un léger contraste, rendu par « mais ».
- source_word: γενήσεται
  choice: arriveront
  rationale: Le futur moyen singulier avec un sujet neutre pluriel se rend idiomatiquement au pluriel en français; « arriveront » exprime simplement l’accomplissement futur.
- source_word: ἐν καιρῷ αὐτῶν
  choice: en leur temps
  rationale: Cette formulation conserve le possessif pluriel et la nuance d’un moment propre ou fixé, sans préciser davantage.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Rendu direct de l’expression eschatologique grecque, sans en définir la durée ni la chronologie.
theological_decisions:
- issue: Portée eschatologique de « dans les derniers jours »
  choice: Conserver littéralement « dans les derniers jours »
  alternative: « à la fin des temps »
  rationale: Le grec parle de « jours » au pluriel; la traduction retenue préserve cette image et évite d’imposer une interprétation chronologique plus précise.
translation_notes:
  register: Français moderne, clair et digne. La répétition de deux compléments temporels est maintenue parce qu’elle reflète la formulation grecque et sa tension entre le temps propre des événements et les derniers jours.
