  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: fr
  text: Et je vis que les trois cerfs devinrent trois agneaux. Ils crièrent au Seigneur, et le Seigneur les fit sortir pour les conduire dans un lieu verdoyant et bien arrosé, puis il les conduisit des ténèbres à la lumière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: cerfs
  rationale: Rend directement le nom grec au pluriel, dans un français naturel.
- source_word: ἀμνοὶ
  choice: agneaux
  rationale: Équivalent courant et précis du grec, en conservant l’imagerie animale.
- source_word: ἐξήγαγε
  choice: fit sortir
  rationale: Exprime la valeur causative et le mouvement hors d’un état ou lieu contenus dans ἐξάγω.
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: verdoyant et bien arrosé
  rationale: Restitue l’idée d’une végétation florissante et d’un lieu pourvu d’eau dans une formulation française idiomatique.
- source_word: ἤγαγε
  choice: conduisit
  rationale: Distingue le verbe simple ἄγω du précédent ἐξάγω, tout en conservant le mouvement des ténèbres vers la lumière.
theological_decisions:
- issue: Portée symbolique du passage des ténèbres à la lumière
  choice: Conserver l’image sans l’expliciter
  alternative: Interpréter explicitement ce passage comme une conversion ou un salut
  rationale: Le grec présente une image théologiquement suggestive, mais n’en fixe pas ici l’interprétation; la traduction préserve cette ouverture.
- issue: Référent des trois cerfs devenus agneaux
  choice: Ne pas identifier les figures
  alternative: Ajouter une identification historique ou théologique
  rationale: Le verset ne donne aucune identification explicite; en ajouter une importerait une interprétation extérieure.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement segmentée pour faciliter la lecture, sans altérer la succession narrative. Aucun marqueur de note n’est requis, puisqu’aucune note n’est ajoutée.
