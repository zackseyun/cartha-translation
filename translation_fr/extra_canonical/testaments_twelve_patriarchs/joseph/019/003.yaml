revisions:
- from: Et je vis que les trois cerfs devinrent trois agneaux. Ils crièrent vers le Seigneur, et le Seigneur les fit sortir vers un lieu verdoyant et bien arrosé, puis il les conduisit des ténèbres à la lumière.
  to: Et je vis que les trois cerfs devinrent trois agneaux. Ils crièrent au Seigneur, et le Seigneur les fit sortir pour les conduire dans un lieu verdoyant et bien arrosé, puis il les conduisit des ténèbres à la lumière.
  rationale: La révision corrige la construction directionnelle maladroite après « fit sortir » en exprimant l’arrivée dans le lieu, tout en maintenant la distinction narrative entre ἐξάγω (« fit sortir ») et ἄγω (« conduisit »). Elle adopte également un tour français plus naturel pour l’appel au Seigneur, sans expliciter l’imagerie du texte.
