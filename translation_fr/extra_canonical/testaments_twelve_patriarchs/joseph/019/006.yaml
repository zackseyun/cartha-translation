  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: fr
  text: Les cornes du quatrième taureau s’élevèrent jusqu’au ciel et devinrent comme une muraille des troupeaux ; et, au milieu des deux cornes, une autre corne poussa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ
  choice: Les cornes … s’élevèrent jusqu’au ciel
  rationale: Conserve le mouvement ascendant et la limite exprimée par μέχρι, dans un français naturel et soutenu.
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  choice: comme une muraille pour les troupeaux
  rationale: Le génitif peut exprimer ici une relation ou une fonction protectrice. « Pour les troupeaux » reste naturel sans préciser davantage le sens symbolique.
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: au milieu des deux cornes
  rationale: Reproduit précisément l’expression spatiale grecque, plutôt que de la réduire à « entre ».
- source_word: ἐξεβλάστησε
  choice: se mit à pousser
  rationale: Préserve l’image végétale du verbe tout en rendant son caractère ingrésif et son emploi appliqué à une corne de manière idiomatique.
theological_decisions:
- issue: Interprétation symbolique de la muraille et de la nouvelle corne
  choice: Maintenir les images sans identifier leur référent
  alternative: Expliciter une protection des troupeaux ou identifier la corne à un personnage précis
  rationale: Le verset présente une vision symbolique sans en donner ici l’interprétation ; la traduction ne doit pas résoudre cette indétermination.
