  text: And the angels and men and all the earth rejoiced over him.
translation:
  language: fr
  text: Et les anges, les hommes et toute la terre se réjouissaient de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: se réjouissaient
  rationale: L’imparfait grec exprime ici une joie en cours ou répétée; l’imparfait français en conserve l’aspect.
- source_word: ἐπ᾽ αὐτῷ
  choice: à son sujet
  rationale: Cette formulation naturelle préserve la valeur assez large de ἐπί avec le datif, sans préciser indûment s’il s’agit de joie «pour lui» ou «à cause de lui».
- source_word: οἱ ἄγγελοι καὶ οἱ ἄνθρωποι
  choice: les anges, les hommes
  rationale: Traduction directe des deux groupes nommés; «les hommes» désigne ici les êtres humains collectivement.
- source_word: πᾶσα ἡ γῆ
  choice: toute la terre
  rationale: Rend littéralement l’expression grecque et conserve son ampleur poétique.
theological_decisions:
- issue: Objet ou motif exact de la joie exprimé par ἐπ᾽ αὐτῷ
  choice: à son sujet
  alternative: à cause de lui / pour lui
  rationale: Le grec permet plusieurs nuances contextuelles. «À son sujet» maintient cette ouverture sans imposer une interprétation théologique plus précise.
translation_notes:
  register: Français moderne, simple et digne. La coordination est légèrement allégée en français tout en conservant les trois sujets du grec et l’imparfait verbal.
