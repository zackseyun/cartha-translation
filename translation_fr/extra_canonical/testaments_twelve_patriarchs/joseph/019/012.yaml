review_pass:
  verdict: revise
  source_fidelity: La première phrase rend fidèlement ἔσται αἰώνιος et οὐ παρελεύσεται. En revanche, ἐπιτελεῖται est au présent et la proposition comparative grecque fait disparaître l’ὀπωροφυλάκιον (« la cabane »), non explicitement le règne. La révision conserve ces deux éléments.
  naturalness: « S’achève parmi vous » est naturel dans un registre français moderne et soutenu. La formulation « comme disparaît une cabane de gardien après l’été » rattache sans ambiguïté la disparition à l’image comparative, conformément à la syntaxe grecque.
  terminology: « Règne » convient pour βασιλεία; « éternel » pour αἰώνιος; et « cabane de gardien » transmet de façon accessible l’abri temporaire de surveillance exprimé par ὀπωροφυλάκιον. Aucune identification doctrinale des pronoms n’est ajoutée.
  issues:
  - severity: medium
    issue: Temps de ἐπιτελεῖται
    rationale: Le draft emploie le futur (« arrivera »), alors que le grec porte le présent ἐπιτελεῖται. Dans ce contraste, « s’achève » rend l’aspect verbal sans transformer le texte en prédiction explicite.
  - severity: medium
    issue: Référent de ἐξαφανίζεται
    rationale: Dans le grec, ἐξαφανίζεται est le verbe de la comparaison introduite par ὡς et se rapporte naturellement à l’ὀπωροφυλάκιον. Le draft fait grammaticalement disparaître « mon règne », ce qui obscurcit l’image source.
  revised_text: Car son règne sera un règne éternel, qui ne passera pas. Mais mon règne parmi vous s’achève, comme disparaît une cabane de gardien après l’été.
