source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: fr
  text: Car son règne sera un règne éternel, qui ne passera pas. Mais mon règne parmi vous s’achève, comme disparaît une cabane de gardien après l’été.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: règne
  rationale: Dans les deux occurrences, le contexte évoque avant tout l’exercice et la durée de la royauté; «règne» est naturel en français et maintient le contraste entre le sien et le mien.
- source_word: αἰώνιος
  choice: éternel
  rationale: Rend directement la durée sans fin, renforcée par la relative «qui ne passera pas».
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: La préposition ἐν avec le pluriel peut signifier «au milieu de/parmi»; ici, il s’agit du règne de Joseph au sein de ses descendants ou frères plutôt que d’une réalité intérieure individuelle.
- source_word: ἐπιτελεῖται
  choice: arrivera à son terme
  rationale: Le verbe peut exprimer l’accomplissement ou l’achèvement. Dans le contraste avec le règne éternel et avec «disparaîtra», cette formulation conserve l’idée d’achèvement tout en indiquant la fin du règne.
- source_word: ὀπωροφυλάκιον
  choice: cabane de gardien
  rationale: Désigne un abri temporaire servant à surveiller un verger ou une récolte; cette expression est claire et garde l’image de précarité.
- source_word: μετὰ τὸ θέρος
  choice: après l’été
  rationale: Traduction directe de l’expression temporelle; l’été désigne ici la saison après laquelle l’abri de surveillance n’est plus utile.
- source_word: ἐξαφανίζεται
  choice: disparaîtra
  rationale: Exprime la disparition complète; le futur français s’accorde avec la perspective prophétique du passage.
theological_decisions:
- issue: Contraste entre «son règne» et «mon règne»
  choice: Maintenir strictement le contraste pronominal sans identifier explicitement les personnages.
  alternative: Préciser dans le texte à qui renvoient «son» et «mon».
  rationale: Le verset fourni n’explicite pas à lui seul l’antécédent de «son»; l’ajouter résoudrait une référence que le texte laisse au contexte.
- issue: Sens de ἐπιτελεῖται
  choice: «arrivera à son terme»
  alternative: «sera mené à son accomplissement»
  rationale: Le contexte oppose un règne impérissable au règne de Joseph qui disparaît. La traduction choisie préserve la nuance d’achèvement du verbe sans suggérer un accomplissement théologique positif absent de la comparaison.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, tandis que la coordination «et, comme…, disparaîtra» évite le participe anglais peu naturel et rattache clairement la comparaison à la disparition du règne.
