base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: fr
  text: Et je vis que [de Juda naquit] une vierge, [vêtue d’une robe de fin lin, et que d’elle] naquit un agneau [sans défaut] ; et, à sa gauche, il y avait comme un lion. Toutes les bêtes se précipitaient contre lui, et l’agneau les vainquit et les détruisit, les vouant au piétinement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρθένος
  choice: une vierge
  rationale: Rend directement le terme grec, sans préciser davantage son âge ou son statut.
- source_word: στολὴν βυσσίνην
  choice: une robe de fin lin
  rationale: « Robe » exprime naturellement στολή et « fin lin » est l’équivalent courant de βύσσινος.
- source_word: ἀμνὸς ἄμωμος
  choice: un agneau [sans défaut]
  rationale: « Sans défaut » conserve la portée cultuelle et morale possible de ἄμωμος sans la réduire à « innocent ».
- source_word: ἐξ ἀριστερῶν αὐτοῦ ὡς λέων
  choice: à sa gauche se tenait comme un lion
  rationale: Conserve la localisation, la comparaison introduite par ὡς et l’imparfait statif ἦν, sans transférer au lion le mouvement attribué ensuite aux bêtes.
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: se précipitaient contre lui
  rationale: Rend l’élan hostile et répété ou en cours marqué par l’imparfait.
- source_word: ἀπώλεσεν αὐτὰ εἰς καταπάτημα
  choice: les livra à l’anéantissement, pour qu’elles soient foulées aux pieds
  rationale: Préserve à la fois l’idée de destruction et la construction finale ou résultative difficile εἰς καταπάτημα, plutôt que de fondre les deux en deux verbes coordonnés.
theological_decisions:
- issue: Identification du référent de l’agneau et du lion
  choice: Maintenir les images sans identifier explicitement leurs référents
  alternative: Nommer une figure messianique précise ou assimiler le lion à l’agneau
  rationale: Le verset présente un langage visionnaire ambigu ; la traduction ne doit pas imposer une interprétation confessionnelle.
- issue: Valeur de ἄμωμος
  choice: « sans défaut »
  alternative: « irréprochable » ou « innocent »
  rationale: Cette formulation garde ouvertes les résonances sacrificielles et éthiques du grec.
- issue: Coordination avant la victoire de l’agneau
  choice: « mais »
  alternative: « et »
  rationale: Le grec emploie καί, mais le contraste discursif entre l’assaut des bêtes et leur défaite est rendu naturellement en français par « mais », sans modifier la relation événementielle.
translation_notes:
  register: Français international moderne, narratif et digne. Les crochets de l’édition source sont conservés exactement comme signalement des segments textuellement incertains ou secondaires ; aucun appel de note n’est ajouté puisqu’aucune note n’est nécessaire.
