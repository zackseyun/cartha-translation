revisions:
- from: Et je vis qu’[une vierge naquit de Juda], [vêtue d’une robe de fin lin, et que d’elle] naquit un agneau [sans défaut] ; à sa gauche se tenait comme un lion. Toutes les bêtes se précipitaient contre lui, mais l’agneau les vainquit et les livra à l’anéantissement, pour qu’elles soient foulées aux pieds.
  to: Et je vis que [de Juda naquit] une vierge, [vêtue d’une robe de fin lin, et que d’elle] naquit un agneau [sans défaut] ; et, à sa gauche, il y avait comme un lion. Toutes les bêtes se précipitaient contre lui, et l’agneau les vainquit et les détruisit, les vouant au piétinement.
  rationale: La révision maintient exactement les segments textuels signalés par des crochets, conserve l’indétermination des figures visionnaires et suit la coordination grecque. La formule finale rend ἀπώλεσεν αὐτὰ εἰς καταπάτημα par « les détruisit, les vouant au piétinement », qui préserve la destruction et l’orientation vers le piétinement sans créer une proposition finale passive ni identifier l’agent du piétinement.
