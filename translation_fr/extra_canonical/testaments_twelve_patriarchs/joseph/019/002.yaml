  text: Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also.
translation:
  language: fr
  text: Douze cerfs paissaient en un lieu, et les neuf furent dispersés sur toute la terre ; les trois le furent de même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: cerfs
  rationale: Le grec désigne des cervidés; « cerfs » est le terme français naturel et collectif ici.
- source_word: ἐνέμοντο
  choice: paissaient
  rationale: Le moyen imparfait de νέμω décrit des animaux en train de se nourrir en broutant.
- source_word: ἐν τόπῳ
  choice: en un même lieu
  rationale: Le grec dit littéralement « en un lieu »; dans ce contexte, il souligne que les douze sont initialement rassemblés au même endroit.
- source_word: διεσπάρησαν
  choice: furent dispersés
  rationale: Le passif conserve l’agent indéterminé et exprime une dispersion dans de nombreuses directions.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: sur toute la terre
  rationale: Rend directement l’étendue universelle exprimée par πᾶσαν τὴν γῆν.
- source_word: ὁμοίως δὲ καὶ οἱ τρεῖς
  choice: puis les trois autres le furent également
  rationale: « Le furent » reprend sans ambiguïté « furent dispersés »; « autres » explicite en français naturel que ces trois complètent le groupe des douze, sans ajouter de contenu interprétatif.
theological_decisions:
- issue: Identification symbolique des douze cerfs
  choice: Ne pas identifier explicitement les cerfs dans le corps du texte
  alternative: Les présenter comme les douze tribus ou les fils de Jacob
  rationale: Le verset conserve une image visionnaire sans en donner ici l’interprétation; l’ajout d’une identification résoudrait indûment cette ouverture symbolique.
translation_notes:
  register: Français moderne, sobre et narratif. La seconde phrase évite la lourdeur de « et de même aussi les trois », tout en préservant la répartition neuf plus trois et le parallélisme du grec.
