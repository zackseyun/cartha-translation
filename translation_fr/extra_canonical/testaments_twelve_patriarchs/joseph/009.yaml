base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: fr
  text: '1[a]. Alors que j’étais dans les chaînes, l’Égyptienne était accablée de chagrin. Quand elle venait, elle m’écoutait en secret rendre grâce au Seigneur et chanter des hymnes dans la maison des ténèbres. D’une voix joyeuse, je me réjouissais et glorifiais mon Dieu, parce qu’au moyen d’un prétexte j’avais été délivré de l’Égyptienne. Bien des fois, elle m’envoya dire : « Accepte de satisfaire mon désir, et je te libérerai de tes chaînes, je te délivrerai des ténèbres. »


    2[b]. Mais je ne me suis pas tourné vers elle, même en pensée. Car Dieu aime davantage celui qui, au fond d’une fosse de ténèbres, demeure fidèle dans la maîtrise de soi que celui qui, tel un roi dans ses chambres, vit dans le luxe et le dérèglement.


    3. Mais si celui qui vit dans la maîtrise de soi désire aussi la gloire, et si le Très-Haut sait qu’elle lui est avantageuse, il la lui accorde également, comme il l’a fait pour moi.


    4. Que de fois, bien que malade, elle est descendue vers moi à une heure indue et a entendu ma voix pendant que je priais ! Et moi, comprenant ses gémissements, je gardais le silence.


    5. En effet, lorsque j’étais dans sa maison, elle se dénudait les bras et les jambes[c], afin que je tombe sur elle. Car elle était très belle, surtout lorsqu’elle se parait pour me tromper. Mais le Seigneur m’a gardé de ses manœuvres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « maison des ténèbres » désigne vraisemblablement le lieu où Joseph était détenu ; le grec conserve l’image des ténèbres au lieu de parler directement d’une prison.
    reason: cultural_note
  - marker: b
    text: Le grec présente ici un contraste difficile, littéralement proche de « celui qui est fidèle dans la maîtrise de soi au fond d’une fosse de ténèbres » et « le roi dans des chambres, vivant dans le luxe avec dérèglement ».
    reason: textual_variant
  - marker: c
    text: Le terme traduit par « jambes » désigne plus précisément les tibias ou le bas des jambes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηκροᾶτό μου
  choice: elle m’écoutait en secret
  rationale: Le verbe évoque une écoute attentive, possiblement à la dérobée; cette formulation garde cette nuance et la valeur répétitive de l’imparfait.
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: dans la maison des ténèbres / des ténèbres
  rationale: Le grec conserve l’image des ténèbres sans nommer directement la prison; la traduction maintient cette image.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: au moyen d’un prétexte j’avais été délivré
  rationale: πρόφασις désigne un prétexte ou motif apparent; « délivré » préserve la portée providentielle possible sans l’expliciter davantage.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα
  choice: je ne me suis pas tourné vers elle, même en pensée
  rationale: L’expression souligne que le refus de Joseph était aussi intérieur, et pas seulement extérieur.
- source_word: σωφροσύνη
  choice: maîtrise de soi
  rationale: Dans ce contexte, le terme vise particulièrement la retenue sexuelle, tout en désignant plus largement une conduite mesurée et disciplinée.
- source_word: ἐν ταμείοις
  choice: dans ses chambres
  rationale: ταμεῖον peut désigner une pièce intérieure, une réserve ou un trésor. « Chambres » produit un contraste naturel entre le lieu privilégié du roi et la fosse de Joseph sans réduire le mot aux seuls entrepôts.
- source_word: θέλει καὶ δόξαν
  choice: désire aussi la gloire
  rationale: La traduction rend explicitement θέλει, « veut, désire », que la couche anglaise avait atténué, et conserve la condition posée par le grec.
- source_word: τοὺς στεναγμούς
  choice: ses gémissements
  rationale: « Gémissements » préserve mieux que « soupirs » l’ambiguïté entre souffrance, frustration et désir.
- source_word: τὰς κνήμας
  choice: les jambes
  rationale: Le mot désigne plus précisément les tibias ou le bas des jambes; « jambes » est naturel dans le corps du texte, avec précision en note.
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: pour me faire tomber sur elle
  rationale: La formulation garde l’image corporelle difficile du texte grec sans la transformer en une expression française comme « tomber dans ses bras », qui résoudrait excessivement le sens.
theological_decisions:
- issue: Action divine et maîtrise humaine dans la résistance de Joseph
  choice: Conserver à la fois la maîtrise de soi de Joseph et l’action protectrice explicite du Seigneur
  alternative: Présenter l’épisode uniquement comme une réussite morale personnelle
  rationale: Le grec attribue clairement la protection finale au Seigneur tout en insistant sur la fidélité et la maîtrise de soi de Joseph.
- issue: Sens de σωφροσύνη dans un contexte de séduction
  choice: Employer « maîtrise de soi »
  alternative: Employer « chasteté » ou « tempérance »
  rationale: « Maîtrise de soi » conserve l’étendue du terme grec, tandis que le contexte rend sa dimension sexuelle évidente.
- issue: Condition relative au désir de gloire au verset 3
  choice: Traduire le désir humain et le discernement du Très-Haut comme deux éléments distincts
  alternative: Dire seulement que le Très-Haut accorde la gloire lorsqu’il la juge convenable
  rationale: Cette lecture rend θέλει sans supprimer la souveraineté du Très-Haut, qui sait si cette gloire est avantageuse et décide de l’accorder.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement fluidifiée, mais les images inhabituelles du grec — maison des ténèbres, fosse obscure, tomber sur elle — ont été conservées. Le début transmis comme continuation de VIII.5 dans l’édition grecque a été inclus conformément au périmètre fourni par la couche de consultation anglaise.
