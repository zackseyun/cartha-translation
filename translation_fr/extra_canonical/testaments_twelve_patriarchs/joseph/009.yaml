revisions:
- from: '1[a]. Alors que j’étais dans les chaînes, l’Égyptienne était accablée de chagrin. Quand elle venait, elle m’écoutait en secret rendre grâce au Seigneur et chanter des hymnes dans la maison des ténèbres. D’une voix joyeuse, je me réjouissais et glorifiais mon Dieu, parce qu’au moyen d’un prétexte j’avais été délivré de l’Égyptienne. Bien des fois, elle m’envoya dire : « Accepte de satisfaire mon désir, et je te libérerai de tes chaînes, je te délivrerai des ténèbres. »


    2[b]. Mais je ne me suis pas tourné vers elle, même en pensée. Car Dieu aime davantage celui qui, au fond d’une fosse obscure, demeure fidèle dans la maîtrise de soi que celui qui, tel un roi dans ses chambres, vit dans le luxe et le dérèglement.


    3. Mais si celui qui vit dans la maîtrise de soi désire aussi la gloire, et si le Très-Haut sait qu’elle lui est avantageuse, il la lui accorde également, comme il l’a fait pour moi.


    4. Que de fois, bien que malade, elle est descendue vers moi à une heure indue et a entendu ma voix pendant que je priais ! Et moi, comprenant ce que signifiaient ses gémissements, je gardais le silence.


    5. En effet, lorsque j’étais dans sa maison, elle se dénudait les bras et les jambes[c] pour me faire tomber sur elle. Car elle était très belle, surtout lorsqu’elle se parait pour me tromper. Mais le Seigneur m’a gardé de ses manœuvres.'
  to: '1[a]. Alors que j’étais dans les chaînes, l’Égyptienne était accablée de chagrin. Quand elle venait, elle m’écoutait en secret rendre grâce au Seigneur et chanter des hymnes dans la maison des ténèbres. D’une voix joyeuse, je me réjouissais et glorifiais mon Dieu, parce qu’au moyen d’un prétexte j’avais été délivré de l’Égyptienne. Bien des fois, elle m’envoya dire : « Accepte de satisfaire mon désir, et je te libérerai de tes chaînes, je te délivrerai des ténèbres. »


    2[b]. Mais je ne me suis pas tourné vers elle, même en pensée. Car Dieu aime davantage celui qui, au fond d’une fosse de ténèbres, demeure fidèle dans la maîtrise de soi que celui qui, tel un roi dans ses chambres, vit dans le luxe et le dérèglement.


    3. Mais si celui qui vit dans la maîtrise de soi désire aussi la gloire, et si le Très-Haut sait qu’elle lui est avantageuse, il la lui accorde également, comme il l’a fait pour moi.


    4. Que de fois, bien que malade, elle est descendue vers moi à une heure indue et a entendu ma voix pendant que je priais ! Et moi, comprenant ses gémissements, je gardais le silence.


    5. En effet, lorsque j’étais dans sa maison, elle se dénudait les bras et les jambes[c], afin que je tombe sur elle. Car elle était très belle, surtout lorsqu’elle se parait pour me tromper. Mais le Seigneur m’a gardé de ses manœuvres.'
  rationale: 'La révision est limitée à trois points sûrs : elle rétablit l’image lexicale de la « fosse de ténèbres » en 9:2, supprime en 9:4 une explication absente du grec, et rend en 9:5 la proposition de but sans renforcer causalement l’action de l’Égyptienne. Les ancres de notes [a], [b] et [c] ainsi que leurs contenus sont conservés et harmonisés avec le texte révisé.'
