source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐκείνη δὲ¹⁸ ⌜κρατήσασα τοῦτον¹⁹ ἐσυκοφάντησέ με· καὶ ἐλθὼν ὁ ἀνὴρ αὐτῆς ἔβαλέ με εἰς φυλακὴν ἐν τῷ αὐτοῦ οἴκῳ²⁰, καὶ τῇ ἑξῆς *μαστιγώσας ἐξέπεμψέ²¹ με εἰς *τὴν τοῦ Φαραὼ εἰρκτήν²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/004.yaml
  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: fr
  text: 4 Mais elle s’en empara[a] et m’accusa faussement. Quand son mari arriva, il me jeta dans une prison située dans sa maison ; le lendemain, après m’avoir fait fouetter, il m’envoya dans la prison du Pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant saisi celui-ci » ou « ayant saisi ceci » ; l’objet visé n’est pas explicite dans cette phrase grecque.'
    reason: Le pronom grec est ambigu et son référent ne doit pas être déterminé silencieusement.
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  choice: s’en étant emparée
  rationale: La tournure conserve l’objet anaphorique sans lui attribuer explicitement une identité que le verset grec ne précise pas clairement.
- source_word: ἐσυκοφάντησέ με
  choice: m’accusa faussement
  rationale: Dans ce contexte judiciaire, le verbe désigne une accusation mensongère plutôt qu’une simple médisance.
- source_word: ἔβαλέ με εἰς φυλακὴν
  choice: il me jeta dans la prison
  rationale: « Jeta » garde la force du verbe grec, tandis que « prison » est naturel et précis.
- source_word: μαστιγώσας
  choice: après m’avoir fait fouetter
  rationale: Le participe indique une action antérieure à l’envoi ; la construction causative française laisse ouverte la possibilité que le mari ait fait exécuter le châtiment.
- source_word: τὴν τοῦ Φαραὼ εἱρκτήν
  choice: la prison du Pharaon
  rationale: Rendu idiomatique de l’établissement de détention appartenant au Pharaon, sans surspécifier sa nature comme « cachot ».
