  verdict: revise
  source_fidelity: La principale correction nécessaire concerne ἐν τῷ αὐτοῦ οἴκῳ, qui situe la prison « dans sa maison ». « La prison de sa maison » peut suggérer une prison appartenant à sa maisonnée plutôt que sa localisation. Le pronom τοῦτον demeure ambigu dans l’extrait grec et la note le signale correctement.
  naturalness: La révision allège « s’en étant emparée » en « s’en empara » tout en conservant l’antériorité narrative exprimée par le participe grec. « Une prison située dans sa maison » est explicite et reste naturel en français moderne.
  terminology: « Accusa faussement », « fit fouetter » et « prison du Pharaon » rendent convenablement ἐσυκοφάντησέ, μαστιγώσας et τὴν τοῦ Φαραὼ εἱρκτήν, sans surinterprétation.
