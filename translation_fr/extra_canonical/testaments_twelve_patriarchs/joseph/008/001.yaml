review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la chronologie, la prière prolongée et la demande de délivrance. Toutefois, « resta à genoux » explicite une durée continue que le participe aoriste κλίνας (« ayant fléchi / s’étant agenouillé ») n’énonce pas directement, et « me quitta » est moins précis que ἐξῆλθεν ἀπ᾽ ἐμοῦ (« s’éloigna/sortit de chez moi »).
  naturalness: Le français est globalement fluide et d’un registre narratif approprié. « Vers l’aube » et « toute la journée et toute la nuit » sont plus idiomatiques que « à l’approche de l’aube » et « tout le jour ».
  terminology: « Seigneur » et « être délivré d’elle » sont justes et préservent l’ambiguïté du référent féminin ainsi que la nature non précisée de la délivrance. « Vers midi » communique adéquatement la sixième heure dans le décompte diurne antique.
  issues:
  - severity: medium
    issue: « Après être resté à genoux »
    rationale: Le grec κλίνας γόνυ signifie littéralement « ayant fléchi le genou » et ne dit pas explicitement « être resté ». La durée est déjà exprimée par « toute la journée et toute la nuit »; « après m’être agenouillé » est plus proche de la forme participiale sans perdre la lisibilité.
  - severity: low
    issue: « lorsqu’elle me quitta »
    rationale: ἐξῆλθεν ἀπ᾽ ἐμοῦ signifie plus précisément qu’elle s’en alla/s’éloigna de lui. « S’éloigna de moi » conserve ce mouvement et évite l’élargissement possible de « quitter ».
  revised_text: 'Je vous le dis donc, mes enfants : il était vers midi lorsqu’elle s’éloigna de moi. Après m’être agenouillé devant le Seigneur toute la journée et toute la nuit, je me relevai vers l’aube, en pleurant et en demandant d’être délivré d’elle.'
