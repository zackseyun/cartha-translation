  to: 'Je vous le dis donc, mes enfants : il était vers midi lorsqu’elle s’éloigna de moi. Après m’être agenouillé devant le Seigneur toute la journée et toute la nuit, je me relevai vers l’aube, en pleurant et en demandant d’être délivré d’elle.'
  rationale: La révision resserre la formulation sur les verbes grecs tout en conservant un français moderne, naturel et digne. Elle ne précise ni l’identité de « elle » ni le sens particulier de la délivrance demandée.
