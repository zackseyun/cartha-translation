source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγω οὖν¹, τέκνα μου², ὅτι ὥρα *ἦν ὡσεὶ³ ἕκτη ὅτε³ ἐξῆλθεν ἀπ᾽ ἐμοῦ⁴. *Καὶ κλίνας γόνυ⁵ πρὸς Κύριον ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα⁶, πρὸς⁷ ὄρθρον ἀνέστην, δακρύων⁸ καὶ αἰτῶν⁹ λύτρωσιν *ἐξ αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: fr
  text: 'Je vous le dis donc, mes enfants : il était vers midi lorsqu’elle s’éloigna de moi. Après m’être agenouillé devant le Seigneur toute la journée et toute la nuit, je me relevai vers l’aube, en pleurant et en demandant d’être délivré d’elle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρα … ὡσεὶ ἕκτη
  choice: environ midi
  rationale: Dans le mode antique de décompte à partir du lever du jour, la sixième heure correspond approximativement à midi; cette formulation transmet clairement le sens au lecteur moderne.
- source_word: κλίνας γόνυ
  choice: après être resté à genoux
  rationale: Littéralement « ayant fléchi le genou »; avec « tout le jour et toute la nuit », le français naturel exprime ici une posture de prière prolongée.
- source_word: πρὸς Κύριον
  choice: devant le Seigneur
  rationale: Dans ce contexte de supplication à genoux, « devant le Seigneur » rend naturellement l’orientation de la prière sans surinterpréter la préposition.
- source_word: πρὸς ὄρθρον
  choice: à l’approche de l’aube
  rationale: Reproduit la valeur temporelle de πρὸς et la référence au point du jour.
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: d’être délivré d’elle
  rationale: Conserve le référent féminin explicite et la demande de libération, sans préciser davantage la nature du péril.
theological_decisions:
- issue: Nature de la délivrance demandée
  choice: d’être délivré d’elle
  alternative: d’être délivré de son emprise
  rationale: Le grec dit seulement « délivrance d’elle ». L’ajout d’« emprise » résoudrait indûment l’ambiguïté quant à la nature exacte de la délivrance.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement collectif « vous » dans « Je vous le dis » rend l’adresse aux enfants. Le passé simple convient au registre testamentaire tout en restant lisible.
