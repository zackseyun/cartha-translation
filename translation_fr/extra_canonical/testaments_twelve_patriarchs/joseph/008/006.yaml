source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ λέγει³⁷ πρὸς με· *Ἰδοὺ οὖν³⁸ ἀγαπᾷς με· *τοῦτό μοι ἀρκεῖτω· μόνον ἀντιποιῆσαι³⁹ *τῆς ζωῆς μου⁴⁰ ⌜καὶ *τῶν τέκνων⁴¹ μου, *καὶ ἔχω⁴² προσδοκίαν ἀπολαῦσαι⁴³ ⌜καὶ⁴⁴ τῆς ἐπιθυμίας μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: fr
  text: 'Et elle me dit : « Vois donc, tu m’aimes. Que cela me suffise : prends seulement soin de ma vie et de mes enfants, et j’espère obtenir aussi ce que je désire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου
  choice: veille seulement sur ma vie
  rationale: Le verbe ἀντιποιέομαι avec le génitif exprime ici le fait de prendre soin de quelqu’un ou de veiller à sa préservation ; cette formulation est naturelle en français et convient au contexte.
- source_word: ἀπολαῦσαι
  choice: obtenir
  rationale: Dans ce contexte, le verbe désigne le fait de parvenir à jouir de l’objet désiré ; « obtenir » restitue sobrement le sens sans explicitation indue.
- source_word: τῆς ἐπιθυμίας μου
  choice: ce que je désire
  rationale: La tournure verbale est plus naturelle en français moderne que « mon désir » après « obtenir », tout en conservant la portée non précisée du grec.
theological_decisions:
- issue: Genre du locuteur dans λέγει πρὸς με
  choice: elle me dit
  alternative: il me dit
  rationale: La forme λέγει ne marque pas le genre. Le contexte narratif de la femme qui s’adresse à Joseph détermine le féminin ; la révision anglaise signalée infère à tort le masculin à partir du grec.
translation_notes:
  register: Français moderne, clair et digne. La parole demeure directe et persuasive, sans préciser la nature du désir final, conformément à l’ambiguïté du texte.
