    issue: ἰδού n’est pas rendu comme une interpellation.
    rationale: Ἰδοὺ οὖν introduit l’argument de la locutrice (« Vois donc »), plutôt qu’une simple conclusion affirmative (« Ainsi donc »).
  - severity: medium
    issue: « celle de mes enfants » fait porter « ma vie » sur les enfants.
    rationale: Le complément grec καὶ τῶν τέκνων μου désigne les enfants eux-mêmes comme objet de la sollicitude, non leurs vies formulées de façon elliptique.
  revised_text: 'Et elle me dit : « Vois donc, tu m’aimes. Que cela me suffise : prends seulement soin de ma vie et de mes enfants, et j’espère obtenir aussi ce que je désire. »'
