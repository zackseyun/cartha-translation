  text: At last, by force, she seized my garments, violently dragging me toward intercourse.
translation:
  language: fr
  text: Finalement, elle saisit mes vêtements avec violence, m’entraînant de force à une relation sexuelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέλος
  choice: Finalement
  rationale: Rend naturellement l’aboutissement ou le dernier stade de l’action dans ce contexte narratif.
- source_word: βίᾳ / μετὰ βίας
  choice: de force / violemment
  rationale: Conserve la double insistance du grec sur la contrainte physique sans alourdir excessivement la phrase.
- source_word: ἐπελαμβάνετό μου τῶν ἱματίων
  choice: elle saisit de force mes vêtements
  rationale: Exprime clairement la prise exercée sur les vêtements du narrateur; «mes vêtements» est plus idiomatique en français que le calque «des vêtements de moi».
- source_word: ἐφελκομένη με
  choice: me tira
  rationale: Rend le mouvement forcé par un verbe concret et naturel; la violence est explicitée par le complément adverbial.
- source_word: εἰς συνουσίαν
  choice: vers l’union sexuelle
  rationale: Traduit explicitement le sens sexuel de συνουσία dans ce contexte, tout en gardant un registre digne et non euphémistique.
