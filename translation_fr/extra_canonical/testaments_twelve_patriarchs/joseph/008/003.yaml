source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: fr
  text: 3 Quand je vis donc que, prise de frénésie, elle agrippait ma tunique, je la lui laissai [et m’en dégageai][a], puis je m’enfuis nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et m’en dégageai » sont entre crochets dans le texte grec édité et leur appartenance au texte est incertaine.
    reason: Signaler fidèlement l’incertitude textuelle de [καὶ ἐκτιναξάμενος].
lexical_decisions:
- source_word: μαινομένη
  choice: prise de frénésie
  rationale: Rend l’idée d’un comportement délirant ou frénétique sans préciser à tort qu’il s’agirait de colère.
- source_word: κρατεῖ
  choice: agrippait
  rationale: Exprime la prise ferme indiquée par le verbe grec et convient naturellement à une tunique saisie de force.
- source_word: χιτῶνα
  choice: tunique
  rationale: Équivalent français courant et historiquement approprié pour le vêtement désigné.
- source_word: καταλείψας αὐτόν
  choice: je la lui laissai
  rationale: Le pronom grec renvoie à la tunique; l’ajout idiomatique de « lui » clarifie qu’elle demeure entre les mains de la femme sans modifier l’action.
- source_word: ἐκτιναξάμενος
  choice: m’en dégageai
  rationale: Rend le mouvement énergique par lequel Joseph se libère ou se débarrasse du vêtement, tout en conservant la concision du grec.
- source_word: γυμνός
  choice: nu
  rationale: Conserve le terme direct du grec et son effet narratif, sans l’atténuer en « peu vêtu ».
theological_decisions:
- issue: Nature de l’état de la femme
  choice: prise de frénésie
  alternative: folle de rage
  rationale: Le grec décrit la frénésie ou la démence apparente, mais ne nomme pas explicitement la colère; la traduction évite donc d’imposer ce mobile.
- issue: Degré de nudité de Joseph
  choice: nu
  alternative: dévêtu
  rationale: Le grec emploie γυμνός de façon directe. Malgré l’éventail contextuel possible du mot, rien dans ce verset ne justifie d’en réduire la force.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde l’enchaînement participial du grec sous une forme naturelle, et le passage incertain reste entre crochets avec une note explicative.
