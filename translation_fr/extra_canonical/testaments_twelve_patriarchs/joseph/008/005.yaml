revisions:
- from: Tandis que j’étais enchaîné, l’Égyptienne était accablée de chagrin. Elle vint m’écouter et entendit comment je remerciais le Seigneur et chantais des hymnes dans la maison des ténèbres, comment je me réjouissais d’une voix joyeuse en glorifiant mon Dieu, parce que, grâce à un prétexte[a], j’avais été délivré de l’Égyptienne.
  to: 'Tandis que j’étais enchaîné, l’Égyptienne était accablée de chagrin. Lorsqu’elle venait, elle m’écoutait : je rendais grâce au Seigneur, je chantais des hymnes dans la maison des ténèbres et je me réjouissais d’une voix joyeuse, en glorifiant mon Dieu, parce que j’avais été délivré de l’Égyptienne par un prétexte[a].'
  rationale: La révision conserve l’imagerie et les termes narratifs du grec, tout en rétablissant la valeur durative des imparfaits. Elle rend διὰ προφάσεως par «par un prétexte», formulation plus proche du moyen exprimé par διά, et remplace une explication de note trop spécifique par une note strictement lexicale.
