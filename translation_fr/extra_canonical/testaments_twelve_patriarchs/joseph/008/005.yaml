review_pass:
  verdict: revise
  source_fidelity: La traduction rend globalement bien le grec, notamment «l’Égyptienne», «la maison des ténèbres» et la joie de Joseph. Toutefois, les imparfaits ἐπηκροᾶτό («elle écoutait / avait l’habitude d’écouter») et ηὐχαρίστουν, ὕμνουν, ἔχαιρον demandent une formulation française qui conserve plus clairement cette valeur durative ou répétée. «Elle vint ... et entendit» les transforme indûment en événements ponctuels.
  naturalness: Le français est naturel et d’un registre approprié. La révision allège toutefois la répétition un peu raide de «comment ... comment» et restitue plus souplement la relation entre l’écoute de la femme et les actions de Joseph.
  terminology: «Seigneur», «hymnes», «maison des ténèbres» et «mon Dieu» sont adéquats. Pour διὰ προφάσεως, «par un prétexte» est plus proche et moins interprétatif que «grâce à un prétexte». La note ne doit pas identifier ce prétexte à une accusation mensongère, élément qui n’est pas exprimé dans ce verset même.
  issues:
  - severity: medium
    issue: Les temps verbaux de la seconde phrase ne reflètent pas les imparfaits grecs.
    rationale: ἐπηκροᾶτό, ηὐχαρίστουν, ὕμνουν et ἔχαιρον décrivent une action en cours ou habituelle. «Elle vint ... entendit» est ponctuel et affaiblit ce trait.
  - severity: low
    issue: La note interprète le «prétexte» comme une accusation mensongère.
    rationale: πρόφασις peut désigner un prétexte, un motif invoqué ou une raison apparente; le verset ne qualifie pas lui-même ce motif d’accusation mensongère.
