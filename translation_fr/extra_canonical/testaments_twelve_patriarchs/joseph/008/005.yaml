base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: fr
  text: 'Tandis que j’étais enchaîné, l’Égyptienne était accablée de chagrin. Lorsqu’elle venait, elle m’écoutait : je rendais grâce au Seigneur, je chantais des hymnes dans la maison des ténèbres et je me réjouissais d’une voix joyeuse, en glorifiant mon Dieu, parce que j’avais été délivré de l’Égyptienne par un prétexte[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «par un motif invoqué» ou «par une raison apparente». Le grec πρόφασις peut désigner un prétexte, un motif allégué ou une apparence de justification.
    reason: Préserve l’ambiguïté lexicale de πρόφασις sans préciser la nature du prétexte au-delà du texte.
lexical_decisions:
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: était accablée de chagrin
  rationale: Le verbe exprime ici l’idée d’être saisi, oppressé ou dominé par le chagrin; une traduction littérale comme «était maintenue ensemble» serait obscure et trompeuse en français.
- source_word: ἐπηκροᾶτό μου
  choice: m’écouter et entendit
  rationale: Le verbe suggère une écoute attentive, possiblement à la dérobée. Cette formulation naturelle conserve l’idée qu’elle perçoit le contenu des paroles de Joseph sans imposer qu’elle espionnait nécessairement.
- source_word: οἴκῳ τοῦ σκότους
  choice: maison des ténèbres
  rationale: La formulation imagée du grec est conservée plutôt que remplacée explicitement par «prison».
- source_word: ἱλαρᾷ φωνῇ
  choice: d’une voix joyeuse
  rationale: ἱλαρός désigne une disposition joyeuse, sereine ou allègre; «joyeuse» est naturel et correspond au contraste voulu avec l’emprisonnement.
- source_word: διὰ προφάσεως
  choice: grâce à un prétexte
  rationale: 'La traduction garde le paradoxe du récit: l’accusation servant de prétexte a néanmoins permis à Joseph d’échapper à la femme.'
theological_decisions:
- issue: La délivrance de Joseph au moyen d’une fausse accusation
  choice: parce que, grâce à un prétexte, j’avais été délivré
  alternative: parce que j’avais été délivré de l’Égyptienne sous un faux prétexte
  rationale: La formulation retenue préserve la causalité paradoxale du grec sans préciser au-delà du texte si Joseph attribue directement cette délivrance à une intervention divine.
translation_notes:
  register: Français moderne, courant et digne. Le rythme répétitif de «comment… comment…» restitue la dépendance des actions de grâce, du chant et de la joie à l’écoute de l’Égyptienne. «L’Égyptienne» est conservé comme désignation narrative, conformément au grec.
