id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: fr
  text: Car si quelqu’un succombe à une passion de désir et lui devient esclave, comme elle l’a été elle aussi, même s’il entend quelque chose de bon, il l’interprète à travers cette passion, au service de son mauvais désir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: tombe sous l’emprise du désir passionnel
  rationale: Rend l’idée de tomber sous le pouvoir d’une passion liée au désir, en français naturel, sans réduire ἐπιθυμία au seul désir sexuel.
- source_word: δουλωθῇ αὐτῷ
  choice: en devient esclave
  rationale: Conserve la forte métaphore d’asservissement exprimée par δουλόω et rattache clairement le pronom à ce désir passionnel.
- source_word: ἐκλαμβάνει αὐτό
  choice: il l’interprète
  rationale: Dans ce contexte de parole entendue, ἐκλαμβάνει indique la manière dont la personne comprend ou prend ce qu’elle entend.
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: dans le sens de son mauvais désir
  rationale: Exprime l’orientation de l’interprétation vers un désir moralement mauvais, tout en gardant le lien avec la proposition précédente.
theological_decisions:
- issue: Nature de ἐπιθυμία
  choice: désir / désir passionnel
  alternative: convoitise ou désir sexuel
  rationale: Le contexte narratif peut suggérer la convoitise sexuelle, mais le grec désigne plus largement un désir intense; la traduction préserve cette portée sans imposer une précision absente du verset.
- issue: Portée morale de πονηρά
  choice: mauvais désir
  alternative: désir pervers
  rationale: « Mauvais » traduit directement la qualification morale sans intensifier indûment le grec ni introduire une doctrine particulière.
translation_notes:
  register: Français moderne, international et digne. La structure causale et la progression du grec sont conservées, avec une formulation idiomatique. Le référent féminin de « elle » demeure volontairement dépendant du contexte immédiat.
