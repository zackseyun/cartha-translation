source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὐκ ἔγνω δὲ αὐτὴ⁴⁵ ὅτι διὰ τὸν⁴⁶ Κύριόν⁴⁷ μου εἶπον οὕτως ἐγώ⁴⁸, καὶ οὐχὶ⁴⁹ δι᾽ αὐτήν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/007.yaml
  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: fr
  text: Mais elle ne savait pas que j’avais parlé ainsi à cause de mon Seigneur, et non à cause d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνω
  choice: elle ne savait pas
  rationale: Dans ce contexte, l’aoriste de γινώσκω exprime l’absence de connaissance ou de compréhension; cette formulation est naturelle en français.
- source_word: διὰ τὸν Κύριόν μου
  choice: à cause de mon Seigneur
  rationale: Rend directement διά avec l’accusatif comme indication de motif, tout en conservant le titre théologique et le possessif.
- source_word: εἶπον οὕτως
  choice: j’avais parlé ainsi
  rationale: Le plus-que-parfait explicite naturellement en français que les paroles précèdent son ignorance, sans modifier la relation temporelle du grec.
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: et non à cause d’elle
  rationale: Préserve le contraste emphatique et la répétition implicite du même rapport causal.
theological_decisions:
- issue: Référent de « mon Seigneur »
  choice: Conserver « mon Seigneur » avec une majuscule
  alternative: « mon maître » ou « le Seigneur »
  rationale: Κύριόν μου signifie littéralement « mon Seigneur ». La majuscule suit la compréhension théologique probable du passage sans ajouter une identification absente du verset.
translation_notes:
  register: Français moderne, sobre et digne. La structure contrastive du grec est conservée, avec une légère adaptation temporelle idiomatique.
source_grounding:
  english_pob_role: consult_only
