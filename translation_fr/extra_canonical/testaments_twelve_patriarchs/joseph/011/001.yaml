source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: fr
  text: Ainsi donc, mes enfants, dans tout ce que vous faites, gardez devant vos yeux la crainte de Dieu et honorez vos frères ; car quiconque met en pratique la loi du Seigneur sera aimé de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: dans tout ce que vous faites
  rationale: Formulation naturelle en français moderne qui conserve l’idée de toute action ou conduite.
- source_word: τὸν τοῦ θεοῦ φόβον
  choice: la crainte de Dieu
  rationale: Expression biblique établie qui préserve la portée religieuse de φόβος sans la réduire à la simple peur.
- source_word: τιμᾶτε
  choice: honorez
  rationale: Rend directement l’impératif grec et son idée de respect manifesté.
- source_word: τοὺς ἀδελφοὺς ὑμῶν
  choice: vos frères
  rationale: Traduction directe qui conserve le langage de parenté du texte, avec sa possible portée communautaire.
- source_word: ποιῶν νόμον Κυρίου
  choice: met en pratique la loi du Seigneur
  rationale: En contexte de loi, ποιεῖν signifie observer ou accomplir concrètement ; cette tournure est plus idiomatique que « faire la loi ».
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: sera aimé de lui
  rationale: Conserve le passif futur et le pronom grec, dont le référent naturel est le Seigneur.
theological_decisions:
- issue: Sens de « crainte de Dieu »
  choice: Maintenir la formule « crainte de Dieu »
  alternative: « profond respect pour Dieu »
  rationale: La formule retenue conserve la tension sémantique de φόβος entre crainte, révérence et respect, sans l’interpréter à la place du lecteur.
- issue: Rapport entre pratique de la loi et amour du Seigneur
  choice: Conserver l’assertion causale telle quelle
  alternative: Ajouter une nuance explicative sur la grâce ou le mérite
  rationale: Le grec relie directement l’observance de la loi à l’amour reçu ; aucune précision doctrinale absente du texte n’est ajoutée.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux impératifs est conservé, ainsi que la conclusion introduite par « car ». Aucun marqueur de note n’est nécessaire.
