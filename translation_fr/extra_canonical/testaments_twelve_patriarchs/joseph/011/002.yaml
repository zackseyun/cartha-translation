base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: fr
  text: 'Alors que je voyageais avec les Ismaélites, ils ne cessaient de me demander : « Es-tu esclave ? » Je répondis que j’étais un esclave de la maisonnée, afin de ne pas couvrir mes frères de honte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος
  choice: Alors que je voyageais
  rationale: Dans ce contexte de déplacement avec les Ismaélites, le participe exprime le trajet plutôt qu’une arrivée précise.
- source_word: ἐπηρώτων
  choice: ils ne cessaient de me demander
  rationale: L’imparfait grec indique une question répétée ou insistante.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme désigne ici une personne asservie; « serviteur » atténuerait indûment la situation de Joseph.
- source_word: ἐξ οἴκου
  choice: né dans la maison
  rationale: L’expression qualifie vraisemblablement un esclave appartenant à la maisonnée dès sa naissance; cette formulation naturelle conserve cette valeur sans ajouter de propriétaire explicite.
- source_word: αἰσχύνω
  choice: couvrir ... de honte
  rationale: Rend l’idée de faire honte ou d’exposer au déshonneur, dans un français naturel et digne.
theological_decisions:
- issue: Motif de la réponse de Joseph
  choice: afin de ne pas couvrir mes frères de honte
  alternative: afin de ne pas déshonorer mes frères
  rationale: La traduction conserve explicitement la loyauté paradoxale de Joseph envers ses frères malgré leur conduite, sans expliquer ni résoudre cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct demeure simple et oral; le vocabulaire de l’esclavage est rendu sans euphémisme.
