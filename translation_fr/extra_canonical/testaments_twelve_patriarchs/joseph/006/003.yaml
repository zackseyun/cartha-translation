  text: Et, lorsqu’il fut sorti, je pleurais, sans avoir goûté ni de ce mets-là ni d’aucun autre de ses mets.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον
  choice: je pleurai
  rationale: Rend directement l’imparfait grec dans un récit au passé, avec un français naturel et digne.
- source_word: μὴ γευσάμενος
  choice: sans avoir goûté
  rationale: Conserve la valeur circonstancielle du participe aoriste et indique que Joseph n’avait rien goûté avant de pleurer.
- source_word: μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: ni de ce mets-là ni d’aucun autre de ses mets
  rationale: Préserve la corrélation négative, la distinction entre le mets désigné et les autres mets, ainsi que le possessif féminin αὐτῆς.
