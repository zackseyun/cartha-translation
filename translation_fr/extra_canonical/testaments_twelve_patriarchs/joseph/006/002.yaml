  text: '*Ὡς δὲ⁴ ἦλθεν ὁ⁵ εὐνοῦχος ὁ κομίζων αὐτό⁶, *ἀνέβλεψα καὶ⁷ εἶδον *φοβερὸν ἄνδρα⁸ ἐπιδιδόντα μοι *μετὰ τοῦ τρυβλίου⁹ μάχαιραν· καὶ συνῆκα ὅτι¹⁰ *περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου¹¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: fr
  text: Mais lorsque l’eunuque qui l’apportait arriva, je levai les yeux et vis un homme terrifiant qui me tendait une épée avec le plat. Je compris alors que c’était une ruse destinée à m’égarer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβλεψα
  choice: je levai les yeux
  rationale: Rend naturellement le mouvement exprimé par le verbe dans ce contexte, plutôt qu’un possible sens technique de recouvrement de la vue.
- source_word: φοβερὸν ἄνδρα
  choice: un homme terrifiant
  rationale: Préserve la force de l’adjectif grec, qui décrit une figure inspirant la peur.
- source_word: μετὰ τοῦ τρυβλίου
  choice: avec le plat
  rationale: Conserve la relation volontairement concise du grec entre l’épée et le plat, sans préciser davantage la manière de les présenter.
- source_word: περιέργεια
  choice: une ruse
  rationale: Dans ce contexte de tentative de séduction et de piège, le terme désigne une manœuvre artificieuse plutôt qu’une simple curiosité ou indiscrétion.
- source_word: εἰς ἀποπλάνησίν μου
  choice: destinée à m’égarer
  rationale: Exprime la finalité de la manœuvre et le sens de détourner quelqu’un de la bonne voie.
theological_decisions:
- issue: Nature de l’homme terrifiant aperçu par Joseph
  choice: Conserver simplement « un homme terrifiant »
  alternative: L’identifier explicitement comme une figure surnaturelle ou démoniaque
  rationale: Le grec ne précise ni son identité ni son statut; la traduction préserve donc cette ambiguïté.
- issue: Sens moral de ἀποπλάνησις
  choice: « m’égarer »
  alternative: « me séduire » ou « me faire pécher »
  rationale: « Égarer » conserve la portée large du grec sans réduire le passage à une catégorie doctrinale ou morale plus précise que le texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste fluide; « l’ » conserve le référent implicite fourni par le contexte précédent. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
