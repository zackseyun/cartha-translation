  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: fr
  text: Sache donc maintenant que le Dieu de mon père m’a révélé, par son ange, ta méchanceté ; par ce moyen, je l’ai gardé[a] pour te convaincre de ta faute, dans l’espoir que, peut-être, à sa vue, tu te repentirais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec est neutre, mais son référent exact n’est pas précisé dans cette phrase ; il peut renvoyer à un élément du contexte.
    reason: αὐτό est un pronom neutre dont l’antécédent reste incertain. La traduction conserve cette indétermination sans lui attribuer un genre ou un référent précis.
lexical_decisions:
- source_word: γνῶθι
  choice: Sache
  rationale: Impératif direct et naturel, qui conserve la force de l’injonction grecque.
- source_word: κακίαν
  choice: méchanceté
  rationale: Rend le mal moral ou l’intention mauvaise sans préciser davantage que le grec.
- source_word: ἐν τούτῳ
  choice: Par ce moyen
  rationale: Préserve la valeur instrumentale probable de l’expression sans l’interpréter comme une simple causalité.
- source_word: εἰς ἔλεγχόν σου
  choice: pour te confondre
  rationale: Exprime l’idée de réfutation, de mise en évidence de la faute ou de conviction portée par ἔλεγχος, sans ajouter une procédure judiciaire.
- source_word: μετανοήσεις
  choice: tu te repentirais
  rationale: Rend le changement intérieur et moral exprimé par μετανοέω dans un français biblique actuel et intelligible.
theological_decisions:
- issue: Révélation divine par l’intermédiaire d’un ange
  choice: le Dieu de mon père m’a révélé, par son ange
  alternative: l’ange du Dieu de mon père m’a révélé
  rationale: La syntaxe grecque fait de Dieu le sujet de ἀπεκάλυψε et de l’ange son intermédiaire; la traduction conserve cette distinction.
- issue: Référent du pronom αὐτό
  choice: je l’ai gardé
  alternative: j’en ai gardé la preuve
  rationale: Le pronom grec est masculin ou neutre selon l’analyse et son référent demeure incertain dans la phrase transmise. Le pronom français, accompagné d’une note, évite de résoudre silencieusement cette difficulté.
translation_notes:
  register: Français international moderne, digne et direct. « Te confondre » garde une légère solennité biblique tout en restant compréhensible; la structure finale conserve l’hésitation exprimée par εἴπως ἄρα.
