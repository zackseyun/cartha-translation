source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ¹Καὶ μετὰ τοῦτο¹¹ ἀποστέλλει² μοι βρῶμα ἐν γοητείᾳ πεφυρμένον³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/001.yaml
  text: And after this she sent me food mixed with sorcery.
translation:
  language: fr
  text: Après cela, elle m’envoya de la nourriture mêlée de sorcellerie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: elle m’envoya
  rationale: Le présent historique grec est rendu par un passé simple, naturel dans un récit français au registre digne.
- source_word: βρῶμα
  choice: de la nourriture
  rationale: Terme général désignant ce qui se mange; « nourriture » convient mieux que le plus étroit « aliment » dans ce contexte.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: mêlée à un sortilège
  rationale: πεφυρμένον exprime l’idée de mélange ou d’imprégnation, tandis que γοητεία désigne une pratique magique ou un enchantement. Cette formulation conserve l’idée que la nourriture sert de véhicule au sortilège sans préciser davantage le procédé.
theological_decisions:
- issue: Nature de la γοητεία
  choice: un sortilège
  alternative: de la sorcellerie
  rationale: « Sortilège » désigne ici plus naturellement une opération magique particulière mêlée à la nourriture, tout en évitant de définir une doctrine précise de la magie.
translation_notes:
  register: Français moderne, narratif et digne. La phrase demeure concise et conserve l’étrangeté concrète de l’expression grecque.
