  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/005.yaml
  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: fr
  text: 'Et je lui dis : « Tu l’as rempli de la sorcellerie de mort. Comment as-tu donc pu dire : “Je ne m’approche pas des idoles, mais du Seigneur seul” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γοητείας θανάτου
  choice: de la sorcellerie de mort
  rationale: Conserve la construction nominale grecque et son association forte entre la sorcellerie et la mort, sans la réduire au simple adjectif « mortelle ».
- source_word: προσεγγίζω
  choice: je ne m’approche pas
  rationale: Rend directement l’idée de s’approcher ou d’avoir accès, tout en préservant la possible nuance cultuelle du contexte.
- source_word: τῷ Κυρίῳ μόνῳ
  choice: du Seigneur seul
  rationale: Préserve l’exclusivité exprimée par μόνῳ et le titre Κυρίῳ, sans ajouter d’interprétation confessionnelle.
- source_word: πῶς εἶπας
  choice: Comment as-tu donc pu dire
  rationale: Formulation française naturelle qui exprime la contestation indignée portée par la question, sans modifier son contenu.
theological_decisions:
- issue: Portée cultuelle de « s’approcher »
  choice: Conserver « je ne m’approche pas »
  alternative: « je ne rends pas de culte »
  rationale: Le grec emploie un verbe général d’approche qui peut avoir une portée cultuelle, mais ne dit pas explicitement « rendre un culte » ; la traduction maintient cette ambiguïté.
- issue: Rapport exclusif au Seigneur
  choice: « mais du Seigneur seul »
  alternative: « mais seulement du Seigneur »
  rationale: La formulation retenue conserve l’accent grec sur le Seigneur comme unique objet de l’approche, sans expliciter davantage la nature de cette relation.
translation_notes:
  register: Français international moderne, digne et direct. Le tour « sorcellerie de mort » est volontairement marqué afin de refléter au plus près l’expression grecque, tandis que « Comment as-tu donc pu dire » restitue naturellement la force de la question rhétorique.
