  text: Καὶ εἶπον *πρὸς αὐτήν²³· Ὅτι²⁴ ἐπλήρωσας αὐτὸ ⸀γοητείας⸀²⁵ θανάτου²⁶. καὶ *πῶς εἶπας²⁷ ὅτι Οὐ προσεγγίζω²⁸ τοῖς²⁹ εἰδώλοις³⁰ ἀλλὰ τῷ³¹ Κυρίῳ³² ⸀μόνῳ⸀³³;
