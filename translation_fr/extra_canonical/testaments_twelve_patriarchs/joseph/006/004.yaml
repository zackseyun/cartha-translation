source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Μετὰ δὲ¹⁵ μίαν ἡμέραν ἐλθοῦσα¹⁶ πρός με¹⁷ *καὶ ἐπιγνοῦσα τὸ βρῶμα¹⁸ λέγει¹⁹ μοι²⁰· Τί τοῦτο ὅτι οὐκ ἔφαγες²¹ *τοῦ βρώματος²²;'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/004.yaml
  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: fr
  text: 'Un jour plus tard, elle vint vers moi et, remarquant la nourriture, elle me dit : « Pourquoi n’as-tu pas mangé cette nourriture ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: Puis, au bout d’un jour
  rationale: Rend naturellement la succession narrative et le délai d’une journée, sans alourdir le français par un calque.
- source_word: ἐλθοῦσα πρός με
  choice: elle vint me voir
  rationale: Exprime en français courant le mouvement vers le narrateur; « me voir » ne suppose pas à lui seul une intention plus précise que le contexte.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: remarquant la nourriture
  rationale: Dans ce contexte, ἐπιγινώσκω indique qu’elle constate ou remarque la nourriture restée là, plutôt qu’une reconnaissance d’identité.
- source_word: Τί τοῦτο ὅτι οὐκ ἔφαγες τοῦ βρώματος;
  choice: Pourquoi n’as-tu pas mangé cette nourriture ?
  rationale: Rend idiomatiquement la question grecque. Le génitif après ἔφαγες peut être partitif, mais le contexte permet une formulation française naturelle portant sur la nourriture laissée intacte.
