base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: fr
  text: '**2** Cet homme[a], le chef des cuisiniers de Pharaon, me confia sa maison. Je luttai contre une femme sans pudeur qui me pressait d’enfreindre la loi avec elle, mais le Dieu de mon père me délivra d’une flamme ardente[b]. Je fus emprisonné, battu et tourné en dérision ; et le Seigneur me fit trouver compassion auprès du gardien de la prison. Car le Seigneur n’abandonne pas ceux qui le craignent, ni dans les ténèbres, ni dans les chaînes, ni dans les détresses, ni dans les contraintes. Car Dieu n’éprouve pas de honte comme un homme ; il ne perd pas courage comme un fils d’homme et, à la différence d’un être né de la terre, il ne faiblit pas et ne s’épouvante pas. Mais, dans toutes ces choses, il préside[c] et, de diverses manières, il apporte du réconfort. Il ne s’éloigne que pour un court moment, afin de mettre à l’épreuve la résolution de l’âme[d]. Au cours de dix épreuves, il m’a montré éprouvé, et dans toutes j’ai patienté. Car la patience est un grand remède, et la persévérance
    procure de nombreux biens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner littéralement le chef des cuisiniers, mais certains témoins ou interprètes y voient un titre officiel de la cour ; comparer le récit de Joseph en Égypte dans la Genèse.
    reason: lexical_alternative
  - marker: b
    text: La « flamme ardente » représente vraisemblablement ici le danger dévorant de la tentation sexuelle, mais le grec ne développe pas la métaphore.
    reason: lexical_alternative
  - marker: c
    text: Le verbe grec peut aussi se comprendre comme « il dirige », « il veille sur nous » ou « il se tient à nos côtés ». Il associe diverses nuances de direction, de protection et de sollicitude.
    reason: alternative_reading
  - marker: d
    text: Le terme grec peut désigner la résolution, le dessein mûri ou la disposition intérieure de l’âme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: chef des cuisiniers
  rationale: Le composé grec désigne littéralement un responsable des cuisiniers. Cette traduction garde la transparence lexicale tout en signalant en note qu’il peut s’agir d’un titre de cour plus large.
- source_word: ἠγωνισάμην
  choice: je luttai
  rationale: Le verbe exprime un combat actif. « Lutter » convient à la résistance morale de Joseph sans imposer une image strictement militaire.
- source_word: γυναῖκα ἀναιδῆ
  choice: une femme sans pudeur
  rationale: ἀναιδής caractérise une personne dépourvue de retenue ou de honte. La formule est directe, actuelle et digne.
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: qui me pressait d’enfreindre la loi avec elle
  rationale: L’imparfait rendu par « pressait » exprime une sollicitation insistante. παρανομεῖν conserve ici son sens moral et légal général, sans être réduit explicitement à l’adultère.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: me délivra d’une flamme ardente
  rationale: La métaphore vive du grec est conservée sans être explicitée comme désir sexuel dans le corps du texte.
- source_word: ἔδωκέ με εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: me fit trouver compassion auprès du gardien de la prison
  rationale: Cette tournure française rend l’idiome grec selon lequel Joseph devient l’objet de compassion devant le gardien, sans remplacer οἰκτιρμοί par la notion plus générale de faveur.
- source_word: ἀνάγκαις
  choice: situations sans issue
  rationale: ἀνάγκη peut désigner la contrainte, la nécessité pressante ou une extrême détresse. La formulation exprime concrètement l’étau de la contrainte tout en évitant la répétition de « détresses ».
- source_word: προΐσταται
  choice: il se tient au premier rang
  rationale: Le verbe peut évoquer le fait de se placer devant, de diriger, de protéger ou de prendre soin. Cette image française conserve l’idée de présence active en avant sans choisir exclusivement entre autorité et protection.
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: la résolution de l’âme
  rationale: διαβούλιον désigne le dessein mûri, la décision ou la disposition délibérée. « Résolution » convient ici à ce que l’épreuve révèle dans l’intériorité.
- source_word: δόκιμον ἀπέδειξέ με
  choice: il a montré que je résistais à l’épreuve
  rationale: δόκιμος qualifie ce qui s’avère valable ou authentique après examen. La traduction reproduit cette logique d’épreuve sans introduire une doctrine du mérite.
- source_word: μακροθυμία / ὑπομονή
  choice: patience / persévérance
  rationale: 'Deux termes proches sont distingués : μακροθυμία désigne la patience prolongée, tandis que ὑπομονή souligne l’endurance constante sous l’épreuve.'
theological_decisions:
- issue: Référence du « Dieu de mon père »
  choice: Maintien du singulier « mon père »
  alternative: « le Dieu de mes pères »
  rationale: Le texte grec porte le singulier et convient à la référence personnelle de Joseph à Jacob. Le singulier préserve l’intimité du témoignage.
- issue: Portée métaphorique de la « flamme ardente »
  choice: Maintien de l’image sans explication dans le texte
  alternative: « le feu du désir » ou « la passion adultère »
  rationale: Le contexte permet de comprendre le danger sexuel, mais le grec laisse l’image intacte. L’expliciter dans le texte résoudrait inutilement la métaphore.
- issue: Sens de l’action divine exprimée par προΐσταται
  choice: « il se tient au premier rang »
  alternative: « il dirige », « il veille sur nous » ou « il se tient à nos côtés »
  rationale: Le verbe permet des nuances d’autorité, de protection et de sollicitude. La traduction conserve cette amplitude, et la note rend les principales lectures possibles.
- issue: Éloignement temporaire de Dieu et mise à l’épreuve
  choice: Traduction directe de l’éloignement temporaire et de son but probatoire
  alternative: Atténuer en « il semble s’éloigner » ou reformuler comme un simple sentiment humain
  rationale: Le grec affirme qu’il s’éloigne brièvement. Ajouter « semble » résoudrait une tension théologique que le texte maintient entre assistance divine et retrait probatoire.
- issue: Statut de Joseph après les dix épreuves
  choice: « il a montré que je résistais à l’épreuve »
  alternative: « il m’a déclaré juste » ou « il a établi mon mérite »
  rationale: δόκιμος concerne la qualité révélée par l’épreuve. La formulation évite d’importer un cadre doctrinal de justification ou de mérite absent du passage.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. Le passé simple convient au témoignage narratif bref, tandis que le présent porte les maximes générales. Les parallélismes et les accumulations du grec sont conservés, avec un vocabulaire accessible. Les images et tensions théologiques du texte — flamme, action protectrice ou directrice de Dieu, bref éloignement probatoire — ne sont pas silencieusement explicitées.
