    procure de nombreux biens.'
  rationale: La révision maintient l’ensemble du passage et ses notes, mais évite une explicitation excessive de ἀνάγκαις, rend προΐσταται dans un français plus intelligible tout en conservant son amplitude en note, et restitue plus directement le statut de Joseph comme « éprouvé » dans les dix épreuves. Aucune ambiguïté théologique n’est résolue au-delà de ce que permet le grec.
