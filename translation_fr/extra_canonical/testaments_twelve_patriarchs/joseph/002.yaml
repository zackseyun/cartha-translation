- from: '**2** Cet homme[a], le chef des cuisiniers de Pharaon, me confia sa maison. Je luttai contre une femme sans pudeur qui me pressait d’enfreindre la loi avec elle, mais le Dieu de mon père me délivra d’une flamme ardente[b]. Je fus emprisonné, battu et tourné en dérision ; et le Seigneur me fit trouver compassion auprès du gardien de la prison. Car le Seigneur n’abandonne pas ceux qui le craignent, ni dans les ténèbres, ni dans les chaînes, ni dans les détresses, ni dans les situations sans issue. En effet, Dieu n’éprouve pas de honte comme un homme ; il ne perd pas courage comme un fils d’homme et, à la différence d’un être né de la terre, il ne faiblit pas et ne s’épouvante pas. Au contraire, dans tout cela, il se tient au premier rang[c] et apporte du réconfort de diverses manières. Il ne s’éloigne que pour un court moment, afin de mettre à l’épreuve la résolution de l’âme[d]. Par dix épreuves, il a montré que je résistais à l’épreuve, et dans chacune d’elles j’ai fait preuve de
    patience. Car la patience est un puissant remède, et la persévérance procure de nombreux bienfaits.'
