  text: Εὐθέως δὲ ἀπέστειλεν εὐνοῦχον ἐν τοῖς Ἰσμαϊλίταις, αἰτοῦσά με εἰς διάπρασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/002.yaml
  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: fr
  text: Aussitôt, elle envoya un eunuque parmi les Ismaélites, en demandant qu’on me vende.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Aussitôt… donc
  rationale: « Aussitôt » rend l’immédiateté de Εὐθέως; « donc » marque naturellement la continuité narrative portée par δέ sans créer une opposition forte.
- source_word: ἀπέστειλεν εὐνοῦχον
  choice: elle envoya un eunuque
  rationale: Traduction directe et naturelle du grec, qui ne précise pas davantage la fonction de l’eunuque.
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  choice: parmi les Ismaélites
  rationale: « Parmi » respecte la préposition ἐν et évite de transformer celle-ci en simple destination (« aux Ismaélites »).
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: pour demander qu’on me vende
  rationale: La tournure finale exprime naturellement la demande visant la mise en vente de Joseph. Aucun bénéficiaire de la vente n’est ajouté, puisque le grec ne dit pas explicitement « à elle ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’imprécision du grec quant à l’identité de la personne sollicitée et quant à l’éventuel acquéreur.
