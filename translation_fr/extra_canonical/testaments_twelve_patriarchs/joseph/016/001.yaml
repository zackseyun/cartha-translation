  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: fr
  text: 'Mais Memphis dit à son mari : « Achète le jeune homme, car, dit-elle, j’entends dire qu’on le vend. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγόρασον
  choice: Achète
  rationale: Impératif aoriste rendu directement par un impératif français naturel.
- source_word: τὸν νεανίαν
  choice: ce jeune homme
  rationale: Le démonstratif français convient au jeune homme précis dont Memphis parle, tandis que « jeune homme » rend νεανίαν sans surinterprétation.
- source_word: ἀκούω
  choice: j’entends dire
  rationale: Dans ce contexte de renseignement rapporté, « j’entends dire » exprime naturellement le sens de ἀκούω.
- source_word: πωλοῦσιν αὐτόν
  choice: qu’on le vend
  rationale: Le sujet pluriel indéfini est rendu idiomatiquement par « on » et αὐτόν par le pronom « le ».
