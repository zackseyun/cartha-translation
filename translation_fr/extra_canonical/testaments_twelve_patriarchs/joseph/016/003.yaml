source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁ δὲ εὐνοῦχος *μὴ θελήσας ἀγοράσαι με⁴ ἀνεχώρησεν πειράσας αὐτούς, καὶ δηλοῖ τῇ δεσποίνῃ αὐτοῦ, ὅτι πολλὴν τιμὴν αἰτοῦσιν τοῦ παιδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: fr
  text: Mais l’eunuque, ne voulant pas m’acheter, se retira après les avoir mis à l’épreuve, puis informa sa maîtresse qu’ils demandaient un prix élevé pour le garçon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: l’eunuque
  rationale: Équivalent direct et naturel du terme grec, qui désigne ici l’agent au service de sa maîtresse.
- source_word: πειράσας αὐτούς
  choice: après les avoir mis à l’épreuve
  rationale: Conserve la portée assez large de πειράζω (« éprouver, tester ») sans préciser indûment la nature de la démarche.
- source_word: δηλοῖ
  choice: informa
  rationale: Rend naturellement en français l’idée de faire savoir ou signaler quelque chose.
- source_word: πολλὴν τιμὴν
  choice: un prix élevé
  rationale: Dans ce contexte d’achat, τιμή désigne le prix demandé; « élevé » exprime idiomatiquement πολλήν.
- source_word: τοῦ παιδός
  choice: pour le garçon
  rationale: Le génitif dépend du prix demandé; « garçon » convient à παῖς dans le contexte et évite de préciser davantage son statut.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La coordination grecque est rendue par « puis » afin de clarifier la succession des actions sans ajouter d’interprétation.
