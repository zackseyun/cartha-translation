  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: fr
  text: 'L’eunuque vint donc, leur donna quatre-vingts pièces d’or et m’emmena. Mais il dit à l’Égyptienne : « J’en ai donné cent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: l’eunuque
  rationale: Correspondance directe et naturelle du terme grec, en continuité avec le personnage déjà identifié dans le récit.
- source_word: ὀγδοήκοντα χρυσοῦς
  choice: quatre-vingts pièces d’or
  rationale: Le substantif désigne ici des pièces ou monnaies d’or; « pièces d’or » est clair sans imposer une dénomination monétaire absente du grec.
- source_word: ἀνελάβετό με
  choice: m’emmena
  rationale: Dans ce contexte d’achat et de transfert de Joseph, le verbe exprime le fait de le prendre avec soi; « m’emmena » rend naturellement le mouvement sans surinterprétation.
- source_word: τῇ Αἰγυπτίᾳ
  choice: à l’Égyptienne
  rationale: Le grec emploie l’adjectif substantivé féminin et renvoie à la femme égyptienne connue du contexte.
- source_word: δέδωκα ἑκατόν
  choice: J’en ai donné cent
  rationale: L’ellipse grecque de l’objet est conservée naturellement par le pronom « en », dont l’antécédent est les pièces d’or.
