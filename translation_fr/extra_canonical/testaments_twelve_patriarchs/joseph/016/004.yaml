  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: fr
  text: 'Alors elle envoya un autre eunuque en disant : « Même s’ils demandent deux mines, versez-les. Ne lésinez pas sur l’or. Achetez seulement le jeune homme et amenez-le-moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχον ἕτερον
  choice: un autre eunuque
  rationale: Rend directement le nom et l’adjectif grecs dans un français naturel.
- source_word: δύο μνᾶς
  choice: deux mines
  rationale: Conserve l’unité monétaire antique plutôt que de proposer une équivalence moderne incertaine.
- source_word: παρέχετε
  choice: donnez-les-leur
  rationale: Le verbe signifie ici fournir ou remettre la somme demandée; les pronoms explicitent naturellement en français la somme et ses destinataires implicites.
- source_word: μὴ φείσασθε χρυσίου
  choice: N’épargnez pas l’or
  rationale: Préserve l’image et l’impératif du grec, au sens de ne pas regarder à la dépense.
- source_word: τὸν παῖδα
  choice: le jeune homme
  rationale: Dans ce contexte, παῖς désigne Joseph comme jeune homme; « garçon » risquerait de le faire paraître enfant, tandis que « serviteur » anticiperait son statut.
