  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: fr
  text: 'Memphis me vit par les fenêtres tandis qu’on me frappait — car sa maison était toute proche — et elle lui fit dire : « Ton jugement est injuste, car tu punis un homme libre qui a été enlevé comme s’il avait commis une faute. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: Memphis
  rationale: Nom propre conservé sous sa forme traditionnelle.
- source_word: ἑώρα διὰ τῶν θυρίδων
  choice: me vit par les fenêtres
  rationale: Rend naturellement le regard à travers des ouvertures ou fenêtres, sans préciser davantage leur forme.
- source_word: τυπτόμενόν με
  choice: tandis qu’on me frappait
  rationale: Exprime clairement le participe présent passif et la simultanéité.
- source_word: ἀπέστειλε πρὸς αὐτόν
  choice: elle lui fit dire
  rationale: Formulation française idiomatique pour l’envoi d’un message à cet homme.
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: un homme libre qui a été enlevé
  rationale: Dans ce contexte, κλέπτω appliqué à une personne désigne le rapt; « enlevé » est plus naturel que « volé » en français.
- source_word: ὡς ἀδικήσαντα
  choice: comme s’il avait commis une injustice
  rationale: Préserve le lien lexical avec ἄδικος et le caractère imputé, plutôt qu’avéré, de la faute.
theological_decisions: []
