  text: '*Ἡ δὲ γυνὴ¹⁶ ἔλεγε¹⁷ πρὸς *τὸν ἄνδρα αὐτῆς¹⁸· ⌜Τί⌉¹⁹ συνέχεις²⁰ τὸν αἰχμάλωτον καὶ εὐγενῆ παῖδα *ἐν δεσμοῖς²¹, *ὃν ἔδει μᾶλλον ἄνετον εἶναι²² καὶ ὑπηρετεῖσθαι²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/003.yaml
  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: fr
  text: 'La femme répétait à son mari : « Pourquoi gardes-tu enchaîné ce jeune homme captif et de noble naissance, alors qu’il devrait plutôt être libéré et servi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: répétait
  rationale: L’imparfait exprime ici une parole répétée ou insistante dans le contexte narratif.
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: ce jeune homme captif et de noble naissance
  rationale: « Jeune homme » convient mieux que « garçon » à Joseph dans ce récit; « de noble naissance » restitue explicitement εὐγενῆ sans suggérer seulement une qualité morale.
- source_word: ἐν δεσμοῖς
  choice: dans les chaînes
  rationale: Expression française naturelle qui conserve l’image concrète de la captivité.
- source_word: ἄνετον εἶναι
  choice: être libre
  rationale: ἄνετος désigne ici le fait d’être relâché ou dégagé de ses liens; la formulation reste naturelle sans surtraduire le geste juridique d’une libération.
- source_word: ὑπηρετεῖσθαι
  choice: être servi
  rationale: La forme passive indique que d’autres devraient se mettre à son service; « être servi » préserve cette orientation.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’insistance de la femme, le contraste entre captivité et noblesse, ainsi que le parallélisme entre être libre et être servi.
