base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/002.yaml
  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: fr
  text: Mais puisque je n’ai pas changé ma déclaration, même lorsqu’on me frappait, il ordonna qu’on me garde jusqu’à ce que les maîtres du garçon arrivent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: je ne changeais pas ma déclaration
  rationale: Le grec exprime le refus de modifier ses paroles ou sa version des faits. « Déclaration » rend naturellement λόγος dans ce contexte d’interrogatoire, tandis que l’imparfait français convient à la persistance sous les coups.
- source_word: τυπτόμενος
  choice: même sous les coups
  rationale: Le participe présent passif signifie « étant frappé/battu ». Cette formulation française concise conserve la simultanéité et souligne la constance de Joseph.
- source_word: φυλαχθῆναί με
  choice: qu’on me garde sous surveillance
  rationale: Le passif aoriste de φυλάσσω indique ici une mise sous garde ou en détention; « sous surveillance » reste naturel sans préciser une forme d’emprisonnement absente du grec.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: les maîtres du garçon
  rationale: La traduction littérale maintient le pluriel κύριοι et la relation d’autorité ou de possession exprimée par le génitif, sans la préciser davantage.
