base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.'
translation:
  language: fr
  text: '**Testament de Joseph 11**


    1 Ainsi donc, mes enfants, dans tout ce que vous faites, gardez la crainte de Dieu devant vos yeux et honorez vos frères, car quiconque met en pratique la loi du Seigneur sera aimé de lui.


    2 Lorsque je voyageais avec les Ismaélites, ils ne cessaient de me demander[a] : « Es-tu esclave ? » Je leur répondis que j’étais un esclave de maison[b], afin de ne pas couvrir mes frères de honte.


    3 Mais le plus important d’entre eux me dit : « Tu n’es pas esclave, car même ton apparence le montre. » Moi, je leur affirmai que j’étais leur esclave[c].


    4 Quand nous fûmes arrivés en Égypte, ils se disputèrent à mon sujet pour savoir qui paierait de l’or et me prendrait.


    5 Tous jugèrent donc bon que je reste en Égypte auprès de leur intermédiaire commercial[d], jusqu’à ce qu’ils reviennent avec de la marchandise.


    6 Le Seigneur me rendit favorable aux yeux de cet intermédiaire, et celui-ci me confia sa maison.


    7 Dieu le bénit par mon intermédiaire et le fit prospérer en or, en argent et dans son travail[e].


    8 Je restai auprès de lui pendant trois mois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le temps du verbe grec peut indiquer qu’ils l’interrogeaient à plusieurs reprises.
    reason: Nuance aspectuelle de l’imparfait ἐπηρώτων.
  - marker: b
    text: L’expression grecque peut désigner un esclave domestique, voire un esclave né dans la maison.
    reason: Ambiguïté lexicale de ἐξ οἴκου.
  - marker: c
    text: 'Certains témoins textuels mettent « leur » en doute ; sans ce mot, on lirait simplement : « j’étais esclave ».'
    reason: Le mot αὐτῶν est signalé comme textuellement incertain dans l’édition fournie.
  - marker: d
    text: Le terme grec peut désigner un négociant, un courtier ou un agent de leurs affaires commerciales.
    reason: Étendue sémantique de μετάβολος dans ce contexte.
  - marker: e
    text: Les mots traduits par « dans son travail » sont textuellement incertains ; le grec peut aussi se rendre par « en travail », « en activité » ou « en entreprises ».
    reason: Incertitude textuelle et sémantique de καὶ ἔργῳ.
lexical_decisions:
- source_word: φόβον τοῦ θεοῦ
  choice: la crainte de Dieu
  rationale: Cette expression conserve la force morale et religieuse de la formule grecque sans l’atténuer en simple respect.
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: devant vos yeux
  rationale: La traduction garde l’image concrète de vigilance morale présente dans l’idiome grec.
- source_word: ποιῶν νόμον Κυρίου
  choice: met en pratique la loi du Seigneur
  rationale: Le grec dit littéralement « faire la loi » ; cette formulation naturelle en français en préserve le sens actif.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contexte porte sur la vente et le statut de Joseph ; « esclave » exprime donc mieux la condition de dépendance que « serviteur ».
- source_word: ἐξ οἴκου
  choice: esclave de maison
  rationale: La formule semble désigner un esclave domestique ou attaché à une maison ; une note maintient l’autre possibilité, celle d’un esclave né dans la maison.
- source_word: ὁ μείζων αὐτῶν
  choice: le plus important d’entre eux
  rationale: μείζων peut indiquer le rang, l’autorité ou l’âge. La traduction retient le rang sans préciser indûment qu’il serait nécessairement le plus âgé.
- source_word: ἡ ὄψις σου
  choice: ton apparence
  rationale: Le terme désigne l’aspect visible ou le visage ; « apparence » convient au raisonnement fondé sur ce que Joseph laisse voir.
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: leur intermédiaire commercial
  rationale: Dans ce contexte, μετάβολος paraît désigner un négociant ou agent lié à leurs opérations commerciales. « Intermédiaire commercial » évite le sens moderne trop étroit de « changeur ».
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: me confia sa maison
  rationale: Le verbe exprime la confiance et la remise d’une responsabilité ; « maison » conserve l’ambivalence entre maisonnée et biens domestiques.
- source_word: ἐν χειρί μου
  choice: par mon intermédiaire
  rationale: L’idiome signifie que la bénédiction divine agit par l’entremise de Joseph, tout en conservant celui-ci comme instrument et non comme source de la bénédiction.
- source_word: καὶ ἔργῳ
  choice: et en activités
  rationale: ἔργον peut désigner le travail, l’activité ou les entreprises. Le pluriel français s’intègre au tableau de la prospérité commerciale tout en faisant l’objet d’une note.
theological_decisions:
- issue: La relation entre la mise en pratique de la loi et l’amour du Seigneur
  choice: « quiconque met en pratique la loi du Seigneur sera aimé de lui »
  alternative: « quiconque observe la loi du Seigneur sera aimé de lui »
  rationale: Le futur passif et le lien explicite posé par le texte sont conservés sans transformer la phrase en formulation systématique sur le mérite ou le salut.
- issue: Le statut revendiqué par Joseph
  choice: « esclave » et « esclave de maison »
  alternative: « serviteur » et « serviteur domestique »
  rationale: La scène concerne la vente et la possession de Joseph. Le vocabulaire de l’esclavage est donc historiquement et lexicalement pertinent, sans adoucir sa condition.
- issue: Le motif de Joseph pour cacher son identité
  choice: « afin de ne pas couvrir mes frères de honte »
  alternative: « afin de ne pas déshonorer mes frères »
  rationale: Le complément direct grec vise les frères de Joseph. La traduction garde son refus de révéler leur conduite honteuse, sans développer davantage ses intentions.
- issue: La source de la prospérité du marchand
  choice: « Dieu le bénit par mon intermédiaire »
  alternative: « Dieu le bénit entre mes mains »
  rationale: Dieu demeure explicitement l’auteur de la bénédiction, tandis que Joseph en est l’instrument, conformément à l’idiome grec.
translation_notes:
  register: Français international moderne, sobre et digne. Le récit est rendu au passé simple pour sa tenue littéraire, tandis que l’exhortation conserve un présent direct. Les formulations techniques ou archaïques ont été évitées, mais les images bibliques (« crainte de Dieu », « devant vos yeux », « sa maison ») ont été préservées.
