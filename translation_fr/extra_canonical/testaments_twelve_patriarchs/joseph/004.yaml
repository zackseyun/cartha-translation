  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: fr
  text: '9. Quand je compris cela, j’en fus affligé jusqu’à la mort. Mais, après son départ, je revins à moi et je la pleurai durant de nombreux jours, car j’avais discerné sa ruse et son égarement.


    10. Je lui adressais des paroles du Très-Haut, afin de voir si elle se détournerait peut-être de son mauvais désir.


    11. Ainsi, bien souvent, elle me flattait par ses paroles comme un saint homme. Avec ruse, elle louait ma maîtrise de moi devant son mari, tout en voulant me faire tomber lorsque nous étions seuls.


    12. Car elle faisait ouvertement mon éloge comme d’un homme chaste[a] ; mais, en secret, elle me disait : « Ne crains pas mon mari, car il est convaincu de ta chasteté. Même si quelqu’un lui parle de nous, il ne le croira pas. »


    13. Au milieu de tout cela, je couchais à même le sol[b] et je suppliais Dieu de me délivrer de sa ruse.


    14. Comme elle n’obtenait rien de cette manière, elle recommença à s’adresser à moi par des paroles d’enseignement, afin d’apprendre la parole de Dieu.


    15. Elle me dit : « Si tu veux que j’abandonne les idoles, aie des relations avec moi ; et moi, je persuaderai mon mari de se détourner des idoles, et nous irons devant ton Seigneur. »


    16. Mais je lui répondais : « Le Seigneur ne veut pas que ceux qui le révèrent soient dans l’impureté, et il ne prend pas plaisir aux adultères, mais à ceux qui s’approchent de lui avec un cœur pur et des lèvres sans souillure. »


    17. Elle persistait pourtant à me contredire, car elle voulait assouvir son désir.


    18. Quant à moi, j’ajoutais le jeûne et la prière, afin que le Seigneur me délivre d’elle.'
