lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: j’en fus affligé jusqu’à la mort
  rationale: Conserve l’intensité idiomatique et la dignité du registre sans expliciter au-delà du grec.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: je revins à moi
  rationale: Rend directement l’idiome grec dans un français naturel, tout en laissant ouverte la nuance entre ressaisissement et retour à la pleine conscience.
- source_word: δόλος / πλάνη
  choice: ruse / égarement
  rationale: Maintient la distinction entre la tromperie calculée et l’état d’erreur ou de dévoiement.
- source_word: ῥήματα ὑψίστου
  choice: des paroles du Très-Haut
  rationale: Préserve le génitif, qui présente ces paroles comme provenant du Très-Haut ou lui appartenant.
- source_word: σωφροσύνη / σώφρονα
  choice: maîtrise de moi / homme chaste
  rationale: Le premier terme désigne largement la maîtrise de soi, tandis que le contexte sexuel du second justifie « chaste » sans ajouter au texte une mention explicite du lit.
- source_word: ὑποσκελίσαι
  choice: me faire tomber
  rationale: Conserve la métaphore de la chute morale dans une formulation française courante.
- source_word: χαμοκοιτῶν
  choice: je couchais à même le sol
  rationale: Le verbe rare évoque le fait de coucher bas ou sur le sol ; cette traduction garde le geste concret sans imposer la posture précise de la prosternation.
- source_word: λόγῳ κατηχήσεως
  choice: sous prétexte de recevoir un enseignement
  rationale: Rend le sens didactique sans employer le terme ecclésiastique plus tardif « catéchèse » ; le contexte montre que l’apprentissage allégué sert d’approche.
- source_word: συγγενοῦς μου
  choice: unis-toi à moi
  rationale: Le verbe συγγίνομαι, dans ce contexte de sollicitation sexuelle, demande une formulation explicite mais non vulgaire.
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: je redoublais de jeûne et de prière
  rationale: Exprime l’idée d’ajouter ou d’intensifier ces pratiques, tout en conservant la coordination des deux noms.
theological_decisions:
- issue: Identité de celui que Joseph supplie au verset 13
  choice: Dieu
  alternative: le Dieu de mes pères
  rationale: Le texte grec fourni porte simplement τοῦ Θεοῦ. La formule patriarcale plus développée de la couche anglaise n’est pas attestée dans la source citée et n’est donc pas introduite.
- issue: Possessif dans Κυρίου σου au verset 15
  choice: ton Seigneur
  alternative: le Seigneur
  rationale: Le possessif de deuxième personne est conservé, même si « le Seigneur » serait plus conventionnel.
- issue: Condition proposée par la femme au verset 15
  choice: unis-toi à moi
  alternative: viens avec moi / aie des relations avec moi
  rationale: Le contexte et l’emploi de συγγίνομαι indiquent une union sexuelle. La traduction le laisse comprendre clairement sans adopter un registre cru.
- issue: Pureté cultuelle et conduite sexuelle au verset 16
  choice: impureté, adultères, cœur pur et lèvres sans souillure
  alternative: souillure, ceux qui commettent l’adultère, cœur pur et bouche irréprochable
  rationale: La traduction maintient ensemble les dimensions morale, sexuelle et cultuelle du vocabulaire grec, sans les réduire à une doctrine particulière.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions du récit testamentaire sont conservées lorsqu’elles structurent l’insistance. Les formulations ecclésiastiques anachroniques ont été évitées. La numérotation 9–18 suit la présentation continue demandée, tout en correspondant à III.9–10 puis IV.1–8 dans l’édition grecque.
