revisions:
- from: '9. Quand je compris cela, j’en fus affligé jusqu’à la mort. Mais après son départ, je revins à moi et je la pleurai durant de nombreux jours, car j’avais discerné sa ruse et son égarement.


    10. Je lui adressais des paroles du Très-Haut, dans l’espoir qu’elle se détournerait peut-être de son mauvais désir.


    11. Ainsi, bien souvent, elle me flattait par ses paroles comme on flatte un saint homme. Avec ruse, elle louait ma maîtrise de moi devant son mari, tout en voulant me faire tomber lorsque nous étions seuls.


    12. En public, en effet, elle faisait mon éloge comme d’un homme chaste[a] ; mais en secret, elle me disait : « Ne crains pas mon mari, car il est convaincu de ta chasteté. Même si quelqu’un lui parle de nous, il ne le croira pas. »


    13. Au milieu de tout cela, je couchais à même le sol[b] et je suppliais Dieu de me délivrer de sa ruse.


    14. Comme elle n’obtenait rien de cette manière, elle recommença à venir me trouver sous prétexte de recevoir un enseignement, parce qu’elle voulait apprendre la parole de Dieu.


    15. Elle me dit : « Si tu veux que j’abandonne les idoles, unis-toi à moi. Alors je persuaderai moi aussi mon mari de se détourner des idoles, et nous irons devant ton Seigneur[c]. »


    16. Mais je lui répondais : « Le Seigneur ne veut pas que ceux qui le révèrent vivent dans l’impureté, et il ne prend pas plaisir aux adultères, mais à ceux qui s’approchent de lui avec un cœur pur et des lèvres sans souillure. »


    17. Elle persistait pourtant à me contredire, car elle voulait assouvir son désir.


    18. Quant à moi, je redoublais de jeûne et de prière pour que le Seigneur me délivre d’elle.'
