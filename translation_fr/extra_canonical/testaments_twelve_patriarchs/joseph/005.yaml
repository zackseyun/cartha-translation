base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: fr
  text: '5 À un autre moment, elle me dit encore : « Si tu ne veux pas commettre l’adultère, je tuerai mon mari avec du poison et je te prendrai comme mari. »


    2 Quand j’entendis cela, je déchirai mes vêtements et lui dis : « Femme, aie honte devant Dieu et ne commets pas cet acte mauvais, de peur que tu ne sois anéantie. Sache-le bien : je révélerai ton projet à tous. »


    3 Alors, prise de peur, elle me supplia de ne pas révéler ce projet.


    4 Puis elle se retira, cherchant à me gagner par des cadeaux et toutes sortes de plaisirs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: commettre l’adultère
  rationale: Rend explicitement le sens sexuel et conjugal du verbe grec dans un français naturel.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: aie honte devant Dieu
  rationale: Conserve la nuance première de αἰδέσθητι, qui appelle à la honte ou à la retenue morale en présence de Dieu, sans la remplacer par « crains Dieu ».
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: cet acte mauvais
  rationale: Traduction directe de πρᾶξις et πονηρός; le grec fourni ne comporte pas ici un terme distinct signifiant « contraire à la loi ».
- source_word: ἐπίνοιαν
  choice: projet
  rationale: Dans ce contexte, le mot désigne le dessein prémédité d’empoisonner son mari; « projet » reste naturel sans exagérer le sens.
- source_word: ἐπιθάλπουσά με
  choice: cherchant à me gagner
  rationale: Exprime l’action de cajoler ou d’amadouer Joseph afin de le séduire, plutôt qu’un simple geste d’affection.
- source_word: ἀπολαύσεσι πάσαις
  choice: toutes sortes de plaisirs
  rationale: Rend l’idée de plaisirs de toute nature en français idiomatique, sans préciser ce que le grec laisse général.
theological_decisions:
- issue: Sens de l’exhortation αἰδέσθητι τὸν Θεόν
  choice: aie honte devant Dieu
  alternative: crains Dieu / respecte Dieu
  rationale: Le texte appelle directement à la honte et à la retenue morale; cette formulation préserve la tension du grec au lieu de l’assimiler à la formule théologique plus courante « crains Dieu ».
- issue: Portée de la menace ἐξολοθρευθῇς
  choice: de peur que tu ne sois anéantie
  alternative: de peur que tu ne périsses
  rationale: « Être anéantie » conserve la force passive du verbe et ne précise pas l’agent de la destruction, que le grec ne nomme pas.
translation_notes:
  register: Français international moderne, digne et lisible. Le récit reste sobre; les paroles menaçantes et l’avertissement moral conservent leur force. La numérotation suit le chapitre 5 et ses sections.
