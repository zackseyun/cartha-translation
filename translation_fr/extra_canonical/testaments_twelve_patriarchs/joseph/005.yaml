  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la progression du grec : nouvelle proposition, menace d’empoisonnement, réaction de Joseph, avertissement, supplication, puis tentative de le séduire par des dons et des plaisirs. « Aie honte devant Dieu » reflète bien αἰδέσθητι τὸν Θεόν, et « anéantie » garde la force passive sans nommer l’agent. Une légère correction idiomatique est nécessaire pour λήψομαί σε εἰς ἄνδρα.'
  naturalness: Le français est moderne et globalement naturel. « Te prendrai pour mari » est toutefois moins idiomatique que « te prendrai comme mari ». « À tous » est plus soutenu et plus naturel ici que « à tout le monde », sans modifier la portée de πᾶσιν.
  terminology: « Commettre l’adultère », « acte mauvais », « projet », « cadeaux » et « toutes sortes de plaisirs » correspondent au grec sans surcharge doctrinale. La désignation directe « Femme » conserve le registre de l’adresse grecque.
