base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: fr
  text: 'Testament de Joseph, le onzième fils de Jacob et de Rachel


    1. Copie du testament de Joseph. Sur le point de mourir, il appela ses fils et ses frères et leur dit :


    2. « Mes frères et mes enfants, écoutez Joseph, celui qu’Israël a aimé ; prêtez l’oreille aux paroles de ma bouche.


    3. Au cours de ma vie, j’ai vu l’envie et la mort, mais je ne me suis pas égaré : je suis demeuré dans la vérité du Seigneur.


    4. Mes frères m’ont haï, mais le Seigneur m’a aimé. Ils voulaient me tuer, mais le Dieu de mes pères m’a gardé. Ils m’ont descendu dans une fosse, et le Très-Haut m’en a fait remonter.


    5. J’ai été vendu comme esclave, et le Maître de tous m’a libéré. J’ai été emmené en captivité, et sa main puissante m’est venue en aide. La famine m’a étreint, et le Seigneur lui-même m’a nourri.


    6. J’étais seul, et Dieu m’a consolé. J’étais faible, et le Seigneur est venu prendre soin de moi. J’étais en prison, et le Sauveur m’a accordé sa faveur. [J’étais dans les chaînes, et il m’a délivré.][a]


    7. Au milieu des calomnies, il a pris ma défense. Dans les paroles amères des rêves,[b] il m’a délivré. J’étais esclave, et il m’a élevé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase entre crochets est textuellement incertaine dans l’édition grecque.
    reason: Signaler au lecteur le statut éditorial de la ligne ἐν δεσμοῖς καὶ ἔλυσέ με.
  - marker: b
    text: 'Le grec de cette proposition est elliptique et peut aussi se comprendre : « dans les paroles amères concernant des rêves ».'
    reason: Préserver l’ambiguïté syntaxique de ἐν λόγοις ἐνυπνίων πικροῖς.
lexical_decisions:
- source_word: φθόνον καὶ τὸν θάνατον
  choice: l’envie et la mort
  rationale: Conserve les deux substantifs grecs sans réduire « mort » à la seule menace de mort.
- source_word: ἔμενα ἐν τῇ ἀληθείᾳ Κυρίου
  choice: je suis demeuré dans la vérité du Seigneur
  rationale: Rend directement le verbe de permanence et la construction prépositionnelle.
- source_word: ἐφύλαξέν με
  choice: m’a gardé
  rationale: Formulation sobre qui préserve le sens de protection sans ajouter d’objet implicite.
- source_word: ἐπράθην εἰς δουλείαν
  choice: j’ai été vendu comme esclave
  rationale: Expression française naturelle du passage à la condition servile.
- source_word: ἐν λιμῷ συνεσχέθην
  choice: la famine m’a étreint
  rationale: Reproduit l’idée d’être saisi ou serré par la famine, avec une tournure française intelligible.
- source_word: ἐπεσκέψατό με
  choice: est venu prendre soin de moi
  rationale: Dans ce contexte de faiblesse, exprime la visite bienveillante et secourable plutôt qu’une simple visite sociale.
- source_word: ἐχαρίτωσέ με
  choice: m’a accordé sa faveur
  rationale: Préserve le champ lexical de la grâce ou faveur sans surcharger la phrase d’une formulation doctrinale.
- source_word: συνηγόρησέ μοι
  choice: il a pris ma défense
  rationale: Rend l’image judiciaire de plaider en faveur de quelqu’un dans un français courant.
- source_word: ὕψωσέ με
  choice: il m’a élevé
  rationale: Conserve le contraste entre la condition d’esclave et l’élévation sans préciser une promotion particulière.
theological_decisions:
- issue: Titres divins successifs
  choice: Seigneur, Dieu de mes pères, Très-Haut, Maître de tous, Dieu et Sauveur
  alternative: Uniformiser tous les titres sous « Dieu » ou « Seigneur »
  rationale: Le grec varie délibérément les désignations divines ; la traduction maintient cette diversité théologique et rhétorique.
- issue: Sens de ἐν τῇ ἀληθείᾳ Κυρίου
  choice: dans la vérité du Seigneur
  alternative: fidèle au Seigneur
  rationale: La formulation retenue préserve la construction et son éventuelle portée théologique, sans résoudre « vérité » en simple fidélité morale.
- issue: Valeur de ἐπεσκέψατό με
  choice: est venu prendre soin de moi
  alternative: m’a visité
  rationale: Le verbe peut désigner une intervention attentive et secourable ; cette option reste naturelle sans identifier une doctrine spécifique de visitation.
- issue: Ligne entre crochets sur les chaînes
  choice: maintenue entre crochets avec une note textuelle
  alternative: l’intégrer sans signalement ou l’omettre
  rationale: Les crochets de l’édition signalent une incertitude textuelle qui doit rester visible.
- issue: Construction elliptique sur les rêves
  choice: paroles amères concernant des rêves
  alternative: paroles amères de rêves / récit amer de rêves
  rationale: Le rapport exact entre λόγοις et ἐνυπνίων est difficile ; la traduction conserve une relation assez ouverte plutôt que d’imposer que les rêves eux-mêmes parlent.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme du témoignage a été conservé. Les formulations volontairement répétitives rendent la cadence grecque. La traduction inclut le titre et les §§ 1–2 ainsi que la dernière proposition du § 7, présents dans la source grecque même s’ils manquent dans la couche anglaise fournie.
