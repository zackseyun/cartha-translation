    rationale: Ils ne correspondent pas directement aux aoristes grecs, qui présentent ici les actes dans la série narrative rétrospective au même titre que les verbes suivants au passé composé.
  - severity: low
    issue: « M’a gardé » pour ἐφύλαξέν
    rationale: La formulation est possible, mais « m’a préservé » rend plus nettement le sens de protection/sauvegarde et rejoint le niveau de précision de l’audit anglais sans surinterpréter.
