base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: fr
  text: Mes frères m’ont haï, mais le Seigneur m’a aimé. Ils voulaient me tuer, mais le Dieu de mes pères m’a préservé. Ils m’ont fait descendre dans une fosse, et le Très-Haut m’en a fait remonter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν / ἠγάπησέ
  choice: haïssaient / aimait
  rationale: L’imparfait rend naturellement en français le contraste durable entre l’hostilité des frères et l’amour du Seigneur dans ce récit rétrospectif.
- source_word: ἀνελεῖν
  choice: me tuer
  rationale: Expression française directe et actuelle correspondant ici au sens de faire mourir.
- source_word: ἐφύλαξέν
  choice: m’a gardé
  rationale: « Garder » conserve la portée assez large du verbe grec, qui peut exprimer la protection ou la préservation, sans préciser davantage le mode de délivrance.
- source_word: ἐχάλασάν
  choice: m’ont fait descendre
  rationale: Le verbe indique une descente provoquée, vraisemblablement au moyen d’une corde; la formulation reste proche du grec sans ajouter ce détail implicite.
- source_word: ἀνήγαγέν
  choice: m’en a fait remonter
  rationale: Rend le mouvement inverse de la descente et explicite seulement par le pronom « en » le point de départ déjà nommé, la fosse.
- source_word: ὁ ὕψιστος
  choice: le Très-Haut
  rationale: Titre divin consacré et transparent en français biblique moderne.
theological_decisions:
- issue: Relation entre l’action hostile des frères et la protection divine
  choice: Conserver les oppositions « mais » et la coordination finale sans expliquer la providence divine
  alternative: Développer le texte en présentant explicitement Dieu comme celui qui déjoue chaque action des frères
  rationale: Le grec juxtapose les actions humaines et divines dans une structure antithétique; il convient d’en préserver la tension sans ajouter d’interprétation théologique.
- issue: Désignation ancestrale de Dieu
  choice: le Dieu de mes pères
  alternative: le Dieu de mes ancêtres
  rationale: « Mes pères » reproduit la formule grecque et son registre scripturaire, tout en restant compréhensible en français moderne.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des trois propositions est conservé, avec un registre biblique mesuré et sans archaïsmes.
