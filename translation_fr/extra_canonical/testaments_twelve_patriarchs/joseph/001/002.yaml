source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: fr
  text: Mes frères et mes enfants, écoutez Joseph, celui qui est aimé par Israël. Prêtez l’oreille aux paroles de ma bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: Mes frères et mes enfants
  rationale: Rend directement les deux vocatifs et conserve la répétition affective de « mon/mes » portée par le grec.
- source_word: Ἀκούσατε
  choice: écoutez
  rationale: Impératif naturel qui exprime ici l’attention portée à une personne qui va parler.
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: celui qu’Israël aimait
  rationale: Le participe passif avec ὑπό désigne Joseph comme aimé par Israël. La proposition relative est plus idiomatique en français moderne que « le bien-aimé d’Israël », qui pourrait laisser croire qu’Israël est l’être aimé.
- source_word: Ἐνωτίσασθε ῥήματα τοῦ στόματός μου
  choice: Prêtez l’oreille aux paroles de ma bouche
  rationale: Conserve l’image corporelle et le parallélisme solennel du grec sans remplacer la phrase par une paraphrase absente de la source.
theological_decisions:
- issue: Identification d’Israël
  choice: Conserver simplement le nom « Israël »
  alternative: Expliciter « mon père Israël » ou « Jacob »
  rationale: Le texte grec ne fournit pas cette explicitation. La formulation retenue préserve la référence narrative sans ajouter une interprétation au corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’adresse solennelle et le parallélisme du grec. La seconde phrase suit le texte source (« les paroles de ma bouche ») plutôt que la paraphrase de la couche anglaise (« mes enfants… votre père »).
