  text: Ἐγὼ εἶδον ἐν τῇ ζωῇ μου τὸν φθόνον καὶ τὸν θάνατον Καὶ¹⁰ οὐκ ἐπλανήθην ⸀ἀλλʼ ἔμενα¹¹ ἐν τῇ ἀληθείᾳ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: fr
  text: Au cours de ma vie, j’ai vu l’envie et la mort, et je n’ai pas été égaré, mais je suis demeuré dans la vérité du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: l’envie
  rationale: Le terme désigne l’envie ou la jalousie malveillante. « L’envie » restitue directement le sens dans un français naturel.
- source_word: θάνατον
  choice: la mort
  rationale: Traduction directe de θάνατος, sans préciser si la mort est ici littérale, personnifiée ou synonyme de danger mortel.
- source_word: ἐπλανήθην
  choice: je ne me suis pas égaré
  rationale: La forme passive peut exprimer le fait d’être égaré ou de s’égarer. La tournure pronominale française conserve naturellement cette latitude.
- source_word: ἔμενα
  choice: je suis demeuré
  rationale: Rend l’idée de persistance contenue dans μένω, dans un registre digne et courant.
- source_word: ἀληθείᾳ
  choice: vérité
  rationale: Choix lexical direct pour ἀλήθεια; il préserve la portée morale et religieuse de l’expression sans la réduire à la seule sincérité ou fidélité.
theological_decisions:
- issue: Sens du génitif dans ἐν τῇ ἀληθείᾳ Κυρίου
  choice: dans la vérité du Seigneur
  alternative: dans la fidélité au Seigneur
  rationale: Le génitif grec permet de comprendre la vérité comme appartenant au Seigneur ou venant de lui. La formulation retenue conserve cette ambiguïté et évite de transformer explicitement l’expression en fidélité humaine envers le Seigneur.
translation_notes:
  register: Français moderne, international et digne. La structure antithétique « je ne me suis pas égaré, mais… » est conservée, ainsi que les images fortes et volontairement peu explicitées de « l’envie » et de « la mort ».
