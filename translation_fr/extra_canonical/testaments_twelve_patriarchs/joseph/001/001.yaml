source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Διαθήκη Ἰωσὴφ τοῦ ἑνδεκάτου υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. Ἀντίγραφον διαθήκης Ἰωσήφ². Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν³, καλέσας⁴ τοὺς υἱοὺς αὐτοῦ καὶ τοὺς ἀδελφοὺς αὐτοῦ⁷ εἶπεν αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: fr
  text: 'Testament de Joseph, onzième fils de Jacob et de Rachel. Copie du testament de Joseph. Comme il était sur le point de mourir, il appela ses fils et ses frères et leur dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans ce titre et dans la désignation littéraire de l’ouvrage, « testament » rend naturellement l’idée des dernières paroles transmises avant la mort.
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Équivalent direct et courant, qui conserve la présentation du texte comme reproduction d’un testament.
- source_word: ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: Comme il était sur le point de mourir
  rationale: Rend avec naturel en français la construction temporelle et l’imminence exprimée par μέλλειν.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Traduction littérale de la leçon grecque, sans tenter de résoudre la difficulté narrative éventuelle.
theological_decisions:
- issue: Lien de filiation dans le titre
  choice: onzième fils de Jacob et de Rachel
  alternative: onzième fils de Jacob, né de Rachel
  rationale: Le génitif coordonné grec rattache directement Joseph à Jacob et à Rachel; la formulation retenue en préserve simplement la structure, malgré l’ambiguïté possible quant au décompte.
- issue: Identité des personnes convoquées
  choice: ses fils et ses frères
  alternative: ses fils et ses proches
  rationale: Le texte grec porte explicitement « frères »; la difficulté historique ou narrative ne justifie pas une harmonisation.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « testament de Joseph » est conservée parce qu’elle appartient au dispositif de titre et d’introduction du grec. Aucun marqueur de note n’est requis.
