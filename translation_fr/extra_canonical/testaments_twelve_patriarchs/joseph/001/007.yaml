  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/007.yaml
  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A servant, he exalted me.
translation:
  language: fr
  text: Au milieu des calomnies, il a aussi plaidé ma cause. Par les paroles amères des rêves, il m’a délivré. J’étais esclave, et il m’a élevé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβολαῖς
  choice: calomnies
  rationale: Le terme désigne ici des accusations malveillantes ou diffamatoires; « calomnies » rend ce sens directement en français courant.
- source_word: συνηγόρησέ μοι
  choice: il a plaidé ma cause
  rationale: Le verbe évoque l’action de parler en faveur de quelqu’un ou de prendre sa défense; cette formulation est naturelle et conserve la nuance judiciaire.
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: par les paroles amères des rêves
  rationale: Cette traduction conserve la construction dense et inhabituelle du grec, y compris l’association de « paroles », « amères » et « rêves », sans en imposer une interprétation supplémentaire.
- source_word: ἐρρύσατό με
  choice: il m’a délivré
  rationale: « Délivrer » exprime le fait d’arracher à un danger ou à une détresse et convient au registre du passage.
- source_word: Δοῦλος
  choice: J’étais esclave
  rationale: Le nominatif isolé est elliptique. L’ajout du verbe d’état nécessaire en français explicite que Joseph se trouvait dans la condition d’esclave, sans modifier le sens.
- source_word: ὕψωσέ με
  choice: il m’a élevé
  rationale: « Élever » garde à la fois l’idée de changement de rang et la formulation théologique possible, sans préciser indûment la nature de cette exaltation.
theological_decisions:
- issue: Sujet implicite des verbes
  choice: Conserver le pronom « il » sans identifier explicitement son référent
  alternative: Nommer Dieu comme sujet
  rationale: Le fragment grec ne nomme pas ici le sujet. Le rendre par « il » préserve le lien contextuel et évite d’ajouter une identification absente de cette unité textuelle.
- issue: Sens de l’élévation de Joseph
  choice: Employer le terme général « élevé »
  alternative: Préciser « élevé à un rang supérieur » ou « exalté »
  rationale: Le grec peut évoquer tant une promotion concrète qu’une exaltation accordée par Dieu. « Élevé » conserve cette amplitude.
translation_notes:
  register: Français moderne, digne et accessible. Les phrases brèves reflètent le style elliptique et parallèle du grec, tandis que les verbes indispensables à la grammaire française sont ajoutés avec retenue.
