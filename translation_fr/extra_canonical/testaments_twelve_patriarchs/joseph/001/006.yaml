  naturalness: Le français est globalement naturel, simple et adapté à un registre scripturaire moderne. « J’étais enchaîné » est plus idiomatique que « J’étais dans les chaînes » et conserve le sens de ἐν δεσμοῖς.
  terminology: « Dieu », « le Seigneur » et « le Sauveur » reproduisent correctement les trois titres grecs. « M’a accordé sa faveur » rend convenablement ἐχαρίτωσέ με sans préciser indûment la nature de cette faveur.
