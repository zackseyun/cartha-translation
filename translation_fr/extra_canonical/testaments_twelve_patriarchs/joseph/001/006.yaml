  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: fr
  text: J’étais seul, et Dieu m’a consolé. J’étais faible, et le Seigneur m’a visité. J’étais en prison, et le Sauveur m’a accordé sa faveur. [J’étais enchaîné, et il m’a libéré.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière phrase est absente de certains témoins ou considérée comme textuellement incertaine.
    reason: Les crochets de l’édition signalent une incertitude textuelle; la note la rend explicite au lecteur.
lexical_decisions:
- source_word: παρεκάλεσέ
  choice: m’a consolé
  rationale: Dans ce contexte d’épreuve, le verbe exprime le réconfort apporté à une personne seule.
- source_word: ἐν ἀσθενείᾳ
  choice: j’étais faible
  rationale: Formulation française naturelle qui conserve l’idée générale de faiblesse, sans la limiter explicitement à la maladie.
- source_word: ἐπεσκέψατό
  choice: a pris soin de moi
  rationale: 'Le verbe signifie ici davantage qu’une simple visite : il évoque une intervention attentive et bienveillante.'
- source_word: ἐχαρίτωσέ
  choice: m’a accordé sa faveur
  rationale: Rend l’idée d’un don gracieux ou d’une faveur, sans préciser une forme d’aide absente du grec.
- source_word: ἐν δεσμοῖς ... ἔλυσέ
  choice: dans les chaînes ... m’en a délivré
  rationale: Conserve l’image de la captivité tout en exprimant naturellement l’action de défaire ou libérer.
theological_decisions:
- issue: Désignations divines successives
  choice: Dieu, le Seigneur, le Sauveur
  alternative: Uniformiser les trois titres
  rationale: Le grec emploie trois désignations distinctes; les conserver respecte la progression et évite d’effacer une nuance théologique du texte.
- issue: Portée de la visite du Seigneur
  choice: a pris soin de moi
  alternative: m’a visité
  rationale: La traduction choisie exprime le sens biblique de ἐπισκέπτομαι comme attention secourable, sans imposer le moyen précis de l’intervention.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des quatre propositions est conservé. Les crochets autour de la dernière phrase maintiennent l’incertitude signalée par l’édition grecque.
