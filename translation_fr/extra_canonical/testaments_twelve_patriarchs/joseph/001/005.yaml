source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐπράθην *εἰς δουλείαν¹⁹, *Καὶ ὁ πάντων δεσπότης²⁰ ἠλευθέρωσέν με· Εἰς αἰχμαλωσίαν ἐλήφθην²¹, Καὶ ἡ κραταιὰ αὐτοῦ χεὶρ ἐβοήθησέ μοι· Ἐν λιμῷ συνεσχέθην, Καὶ αὐτὸς ὁ Κύριος διέθρεψέ με²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: fr
  text: J’ai été vendu comme esclave, et le Maître de tous m’a rendu libre. J’ai été emmené en captivité, et sa main puissante m’est venue en aide. J’ai été accablé par la famine, et le Seigneur lui-même m’a nourri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθην εἰς δουλείαν
  choice: J’ai été vendu comme esclave
  rationale: Rend directement la vente et la condition servile, dans un français naturel.
- source_word: ὁ πάντων δεσπότης
  choice: le Maître de tous
  rationale: « Maître » conserve l’idée d’autorité souveraine de δεσπότης; « de tous » maintient la portée universelle de πάντων.
- source_word: ἠλευθέρωσέν με
  choice: m’a rendu libre
  rationale: Exprime explicitement le passage de l’esclavage à la liberté sans ajouter de nuance absente du grec.
- source_word: εἰς αἰχμαλωσίαν ἐλήφθην
  choice: J’ai été emmené en captivité
  rationale: Formulation idiomatique qui conserve le passif et la notion de captivité.
- source_word: ἡ κραταιὰ αὐτοῦ χείρ
  choice: sa main puissante
  rationale: Reproduit naturellement l’image biblique de la main forte ou puissante.
- source_word: ἐβοήθησέ μοι
  choice: m’est venue en aide
  rationale: Le sujet grammatical est « sa main puissante »; cette tournure garde l’image tout en restant naturelle.
- source_word: ἐν λιμῷ συνεσχέθην
  choice: J’ai été accablé par la famine
  rationale: συνέχω peut évoquer le fait d’être serré, retenu ou dominé par une détresse. « Accablé » préserve cette pression sans produire l’expression peu naturelle « enfermé par la famine ».
- source_word: αὐτὸς ὁ Κύριος διέθρεψέ με
  choice: le Seigneur lui-même m’a nourri
  rationale: « Lui-même » rend l’insistance de αὐτός, et « nourri » correspond au sens de διέτρεφω dans ce contexte.
theological_decisions:
- issue: Désignation divine par δεσπότης et Κύριος
  choice: « le Maître de tous » puis « le Seigneur »
  alternative: Uniformiser les deux titres par « Seigneur »
  rationale: Le grec emploie deux titres distincts; les conserver évite d’effacer une variation potentiellement significative.
- issue: Agent de l’aide dans « sa main puissante m’est venue en aide »
  choice: Conserver la main comme sujet grammatical
  alternative: « il m’a aidé de sa main puissante »
  rationale: Le choix retenu respecte l’image et la syntaxe grecques sans expliciter davantage l’action divine.
translation_notes:
  register: Français moderne, international et digne, avec un parallélisme clair entre les trois épreuves et les trois interventions divines. Aucun archaïsme ni terme confessionnel marqué.
