- from: '1. Memphis me vit par les fenêtres[a] pendant qu’on me battait — car sa maison était toute proche — et elle lui envoya dire : « Ton jugement est injuste, car tu punis comme un malfaiteur un homme libre qui a été enlevé[b]. »


