base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014.yaml
  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: fr
  text: '1. Memphis me vit, à travers les fenêtres[a], pendant qu’on me battait — car sa maison était tout près — et elle lui envoya dire : « Ton jugement est injuste, car tu punis comme s’il avait fait le mal un homme libre qui a été enlevé[b]. »


    2. Mais, comme je ne changeais pas ma déposition, même sous les coups, il ordonna qu’on me garde sous bonne garde jusqu’à ce que les maîtres du garçon arrivent.


    3. La femme disait à son mari : « Pourquoi gardes-tu enchaîné ce garçon captif et de noble naissance ? Il faudrait plutôt le laisser libre et qu’on le serve. »


    4. En effet, elle désirait me voir avec un désir coupable. Mais moi, je ne savais rien de tout cela.


    5. Il lui dit : « Chez les Égyptiens, on ne prend pas le bien d’autrui avant qu’une preuve soit apportée. »


    6. Il dit donc cela à propos du marchand[c]. Quant au garçon, il doit rester enfermé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à travers les ouvertures ». Le grec peut désigner des ouvertures de fenêtre, qui n’étaient pas nécessairement vitrées au sens moderne.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « un homme libre qui a été volé ». Le grec présente l’enlèvement d’une personne libre comme un vol.'
    reason: lexical_alternative
  - marker: c
    text: Le terme grec est rare et son sens précis est incertain; il peut désigner un négociant, un revendeur ou un intermédiaire. Le français « marchand » reste donc prudent.
    reason: textual_uncertainty
lexical_decisions:
- source_word: Μεμφίς
  choice: Memphis
  rationale: Le nom propre est translittéré conformément à l’usage français, sans l’identifier arbitrairement à la ville du même nom.
- source_word: διὰ τῶν θυρίδων
  choice: par les fenêtres
  rationale: θυρίς désigne une petite ouverture ou fenêtre. « Fenêtres » est clair en français moderne, tandis qu’une note préserve la réalité architecturale ancienne.
- source_word: τυπτόμενόν με
  choice: pendant qu’on me battait
  rationale: Le participe présent passif exprime des coups répétés ou en cours, sans préciser l’instrument employé.
- source_word: Ἄδικος ἡ κρίσις σου
  choice: Ton jugement est injuste
  rationale: κρίσις a ici une portée à la fois judiciaire et morale; « jugement » conserve ces deux dimensions.
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: un homme libre qui a été enlevé
  rationale: Le grec dit littéralement qu’un homme libre a été « volé ». Pour une personne, « enlevé » exprime naturellement la saisie illégale sans effacer l’image littérale, signalée en note.
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: je ne changeais pas ma déposition
  rationale: Dans cette scène d’interrogatoire, λόγος désigne le récit ou témoignage maintenu par Joseph; « déposition » rend le contexte judiciaire.
- source_word: φυλαχθῆναί με
  choice: qu’on me garde sous surveillance
  rationale: Le verbe signifie garder ou tenir sous bonne garde et ne requiert pas à lui seul l’idée plus précise d’une cellule de prison.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: les maîtres du jeune homme
  rationale: κύριοι désigne ceux qui revendiquent autorité ou propriété sur lui. « Maîtres » maintient sans l’atténuer le cadre de servitude, tandis que « jeune homme » convient ici à παῖς.
- source_word: τὸν αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: ce jeune captif de noble naissance
  rationale: La traduction conserve ensemble sa captivité et son origine noble, au lieu de faire de εὐγενής une simple qualité morale.
- source_word: ἄνετον εἶναι καὶ ὑπηρετεῖσθαι
  choice: le laisser libre de ses mouvements et le servir
  rationale: ἄνετος évoque ici l’absence de liens ou de contrainte plutôt qu’un changement formel de statut; le passif ὑπηρετεῖσθαι indique qu’il devrait recevoir des services.
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: poussée par un désir coupable
  rationale: L’expression associe explicitement son désir au péché. Cette formulation naturelle garde le jugement moral sans préciser davantage la nature de l’acte désiré.
- source_word: ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: retirer à quelqu’un ce qui lui appartient
  rationale: Littéralement, il s’agit d’enlever « les biens d’autrui ». Dans le contexte, Joseph est traité comme la propriété revendiquée par un tiers; la formulation française laisse apparaître cette logique sans l’approuver.
- source_word: μετάβολος
  choice: marchand
  rationale: Dans ce contexte de vente et de revendication de propriété, le terme désigne vraisemblablement le négociant ou intermédiaire. Le mot grec est rare et textuellement délicat; cette incertitude est indiquée en note.
- source_word: ἐγκατάκλειστος
  choice: rester enfermé
  rationale: L’adjectif exprime une détention close. « Enfermé » en donne directement la force, plus marquée que la simple surveillance du verset 2.
theological_decisions:
- issue: Contraste entre liberté personnelle et propriété revendiquée
  choice: Conserver « homme libre », « maîtres » et le langage de ce qui « appartient » à autrui
  alternative: Neutraliser par « innocent », « responsables » et « le rendre à autrui »
  rationale: Le passage juxtapose volontairement l’affirmation du statut libre de Joseph et le système qui le traite comme un bien possédé. La traduction maintient cette tension éthique et sociale sans légitimer la revendication de propriété.
- issue: Nature du désir de la femme
  choice: « un désir coupable »
  alternative: « un désir de pécher » ou une explicitation sexuelle
  rationale: Le génitif ἁμαρτίας rattache le désir au péché, mais la formulation grecque ne décrit pas ici l’acte précis. La traduction conserve le jugement moral tout en évitant une explicitation dépassant ce verset.
- issue: Ponctuation du verset 6
  choice: Présenter la première proposition comme une remarque narrative, puis la dernière comme la conclusion prononcée par le mari
  alternative: Faire de tout le verset une narration indirecte ou rattacher entièrement la dernière phrase au narrateur
  rationale: Les manuscrits grecs anciens ne fixent pas la ponctuation moderne, et la syntaxe permet plus d’un découpage. Le choix adopté suit le mouvement du dialogue, sans modifier le contenu de l’ordre de détention.
translation_notes:
  register: Français international actuel, narratif et digne. Les phrases restent accessibles sans moderniser artificiellement le cadre judiciaire et servile. Le passé simple est évité au profit du passé composé et de l’imparfait, naturels dans une narration destinée à un large public; le discours direct conserve une certaine solennité.
