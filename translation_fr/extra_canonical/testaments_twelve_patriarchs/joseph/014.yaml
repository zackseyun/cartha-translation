  rationale: Révision limitée aux endroits où le français pouvait affaiblir, obscurcir ou surinterpréter le grec. Le texte conserve le statut d’« homme libre », la terminologie de maîtrise et de captivité, ainsi que l’ambiguïté du terme rare μεταβόλος. La ponctuation du v. 6 est rendue de façon narrative afin de ne pas attribuer avec certitude au mari une limite de discours direct que le grec ne fixe pas.
