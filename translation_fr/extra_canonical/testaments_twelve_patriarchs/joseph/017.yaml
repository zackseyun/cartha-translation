base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as servants to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: fr
  text: '1. Voyez donc, mes enfants, tout ce que j’ai supporté pour ne pas faire honte à mes frères. 2. Vous aussi donc, aimez-vous les uns les autres et, avec patience, couvrez les manquements les uns des autres[a]. 3. Car Dieu prend plaisir à l’entente entre frères et à la résolution d’un cœur bon, tourné vers le bien[b]. 4. Lorsque mes frères sont venus en Égypte, ils savent eux-mêmes que je leur ai rendu leur argent, que je ne leur ai fait aucun reproche et que je les ai encouragés. 5. Après la mort de Jacob, mon père, je les ai aimés davantage encore, et j’ai fait pour eux, bien au-delà de toute mesure, tout ce qu’ils désiraient. 6. Je n’ai pas permis qu’ils soient affligés, même dans la plus petite affaire ; bien plus, je leur ai donné tout ce qui était en mon pouvoir. 7. Leurs fils étaient mes fils, et mes fils étaient comme leurs esclaves[c] ; leur âme était mon âme, chacune de leurs douleurs était ma douleur, chacune de leurs faiblesses était mon infirmité, et leur dessein était
    mon dessein. 8. Je ne me suis pas montré hautain parmi eux à cause de ma gloire terrestre ; au contraire, j’étais parmi eux comme l’un des plus petits.


    [a] Ou : « cachez les défaillances les uns des autres ». Le verbe grec évoque le fait de ne pas exposer durement les fautes d’un frère.


    [b] Le texte grec de la proposition concernant la résolution d’un cœur bon est difficile. La traduction en restitue le sens éthique apparent : un cœur résolument orienté vers le bien.


    [c] Le grec emploie le mot douloi, « esclaves ». Cette formulation volontairement forte exprime l’humilité de Joseph et la subordination de ses propres fils à ses frères.'
  philosophy: optimal-equivalence
