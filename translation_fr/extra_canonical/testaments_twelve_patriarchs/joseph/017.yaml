    rationale: « Couvrir mes frères de honte » est compréhensible mais n’est pas une collocation française naturelle. « Faire honte à mes frères » rend directement le verbe causatif grec et conserve son sens relationnel.
  - severity: low
    issue: Rendu de παρεκάλεσα au v. 4
    rationale: « Réconforter » est possible, mais plus étroit que le grec. « Encourager » préserve la polyvalence du verbe et suit avec prudence le sens retenu dans la piste d’audit anglaise.
  - severity: medium
    issue: Rendu de ψυχή au v. 7
    rationale: Le grec répète ψυχή. « Leur âme était mon âme » conserve cette répétition et évite de substituer « vie », qui déplace l’image affective et personnelle du texte.
  - severity: low
    issue: Ajout interprétatif au v. 8
    rationale: « Au-dessus d’eux » n’est pas exprimé dans le grec, qui dit que Joseph ne s’est pas exalté parmi eux avec arrogance. « Je ne me suis pas montré hautain parmi eux » est idiomatique et plus exact.
