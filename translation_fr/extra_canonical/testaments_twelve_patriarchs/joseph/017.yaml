lexical_decisions:
- source_word: αἰσχύνω
  choice: couvrir ... de honte
  rationale: Le verbe signifie causer de la honte ou humilier. Cette tournure française conserve la dimension relationnelle et publique de l’acte que Joseph dit avoir évité.
- source_word: μακροθυμία
  choice: patience
  rationale: Dans cette exhortation, le terme désigne une retenue durable envers autrui. « Patience » est naturel en français moderne tout en gardant la portée morale du contexte.
- source_word: συγκρύπτετε
  choice: couvrez
  rationale: Le composé évoque l’action de couvrir ou de tenir caché pour autrui. « Couvrez » évite de suggérer la tromperie et s’accorde avec l’appel à ne pas exposer durement les fautes fraternelles.
- source_word: ἐλαττώματα
  choice: manquements
  rationale: Le mot peut désigner des défauts ou défaillances. « Manquements » convient au registre moral sans être clinique ni excessivement accusateur.
- source_word: ὁμονοία
  choice: entente
  rationale: Le terme désigne la concorde fondée sur une disposition commune. « Entente entre frères » est idiomatique et préserve la dimension familiale.
- source_word: προαίρεσις καρδίας
  choice: résolution d’un cœur bon
  rationale: L’expression vise une intention morale délibérée. « Résolution » rend mieux l’orientation volontaire que le seul mot « intention ».
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: tourné vers le bien
  rationale: La formulation transmise est grammaticalement difficile. Cette traduction conserve prudemment le sens apparent d’une disposition intérieure favorable au bien.
- source_word: ὠνείδισα
  choice: fait aucun reproche
  rationale: Le verbe désigne le fait d’adresser des reproches susceptibles de faire honte. La tournure est naturelle en français et convient à la scène de réconciliation.
- source_word: παρεκάλεσα
  choice: réconfortés
  rationale: Le verbe peut signifier exhorter, encourager ou consoler. Dans le contexte de l’accueil des frères inquiets, « réconfortés » exprime vraisemblablement l’action rassurante de Joseph tout en laissant subsister la polyvalence dans la décision lexicale.
- source_word: ὑπερεκπερισσοῦ
  choice: bien au-delà de toute mesure
  rationale: L’adverbe intensif souligne une générosité extraordinaire. La tournure française restitue cette surabondance.
- source_word: θλιβῆναι
  choice: être affligés
  rationale: Le passif peut évoquer la détresse, l’oppression ou l’épreuve. « Être affligés » demeure assez large et convient au registre testamentaire.
- source_word: ἕως μικροῦ πράγματος
  choice: même dans la plus petite affaire
  rationale: L’expression insiste sur une sollicitude qui s’étend jusque dans les détails les plus minimes.
- source_word: ψυχή
  choice: vie
  rationale: Dans « leur ψυχή était ma ψυχή », « vie » rend naturellement en français l’identification profonde et solidaire, sans imposer une anthropologie technique du mot « âme ».
- source_word: δόξα κοσμική
  choice: gloire dans ce monde
  rationale: Cette formulation française claire conserve l’opposition entre le rang terrestre de Joseph et son humilité familiale.
theological_decisions:
- issue: Exhortation à couvrir les manquements fraternels
  choice: « couvrez les manquements les uns des autres »
  alternative: « cachez les défaillances les uns des autres »
  rationale: Le texte appelle à la patience et au refus d’exposer durement les fautes d’un frère, sans nier leur réalité ni introduire une formule doctrinale ultérieure.
- issue: Traduction de δοῦλοι au verset 7
  choice: « esclaves »
  alternative: « serviteurs »
  rationale: Le terme grec désigne explicitement des esclaves. La force de l’image souligne l’humilité de Joseph et la subordination qu’il attribue à sa propre maison.
- issue: Proposition textuellement difficile au verset 3
  choice: « à la résolution d’un cœur bon, tourné vers le bien »
  alternative: « au choix d’un cœur bon qui prend plaisir au bien »
  rationale: La transmission grecque est instable ou syntaxiquement rugueuse. La traduction donne le sens éthique apparent sans prétendre reconstruire avec certitude chaque relation grammaticale.
- issue: Relation de Joseph à ses frères au verset 8
  choice: « comme l’un des plus petits »
  alternative: « comme l’un des moindres »
  rationale: La formulation conserve le paradoxe théologique et moral entre sa gloire terrestre et son abaissement volontaire, sans en faire une affirmation de statut ontologique.
translation_notes:
  register: Français international moderne, digne et accessible, avec une syntaxe exhortative claire. Le vouvoiement collectif familial est rendu par les formes plurielles naturelles. Le texte évite les archaïsmes (« longanimité », « opprobre ») tout en conservant la solennité testamentaire. Les répétitions du verset 7 sont maintenues pour préserver son rythme emphatique.
