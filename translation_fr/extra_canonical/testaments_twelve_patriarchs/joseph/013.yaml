  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013.yaml
  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as servants?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew servant before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: fr
  text: '1. Mais Pentephris, convaincu par ses paroles, ordonna qu’on fasse venir le marchand, et il lui dit : « Qu’est-ce que j’entends dire à ton sujet ? Tu enlèves des personnes du pays de Canaan et tu les revends comme esclaves ? »


    2. Le marchand tomba à ses pieds et le supplia : « Je t’en prie, seigneur, je ne sais pas de quoi tu parles. »


    3. Pentephris lui dit : « Alors, d’où vient ce jeune esclave hébreu ? » Il répondit : « Les Ismaélites me l’ont confié jusqu’à leur retour. »


    4. Mais Pentephris ne le crut pas et ordonna qu’on le déshabille et qu’on le frappe. Comme le marchand persistait dans ses déclarations, Pentephris dit : « Qu’on fasse donc venir le jeune homme. »


    5. Quand on m’eut fait entrer, je me prosternai devant Pentephris, car il occupait le troisième rang parmi les dignitaires de Pharaon.[a]


    6. Après m’avoir séparé de lui, Pentephris me demanda : « Es-tu esclave ou libre ? » Je répondis : « Esclave. »


    7. Il demanda : « De qui ? » Je répondis : « Des Ismaélites. »


    8. Il reprit : « Comment es-tu devenu leur esclave ? » Je répondis : « Ils m’ont acheté du pays de Canaan. »


    9. Il me dit alors : « Tu mens, c’est certain. » Et aussitôt, il ordonna qu’on me déshabille et qu’on me frappe, moi aussi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il était le troisième en dignité parmi les dirigeants de Pharaon ».'
    reason: La syntaxe grecque est concise et légèrement difficile ; la note conserve sa formulation plus littérale et indique que le classement concerne le rang officiel.
lexical_decisions:
- source_word: μετάβολος
  choice: marchand
  rationale: Le terme désigne ici l’intermédiaire qui revend Joseph. « Marchand » est naturel en français et évite le sens moderne trompeur de « courtier », tout en laissant le contexte préciser son activité.
- source_word: ψυχὰς
  choice: des personnes
  rationale: Le sens concret est celui d’êtres humains. Traduire littéralement par « âmes » serait obscur en français moderne et pourrait introduire une portée théologique absente du contexte.
- source_word: παῖδας / παῖς
  choice: esclaves / jeune esclave
  rationale: Dans ce contexte de vente et d’appartenance, le mot désigne des esclaves ou serviteurs. « Esclave » exprime clairement le statut, tandis que « jeune » conserve aussi la nuance d’âge au verset 3.
- source_word: γυμνὸν τύπτεσθαι
  choice: qu’on le déshabille et qu’on le frappe
  rationale: La formulation française explicite naturellement que la victime est mise nue pour subir les coups, sans atténuer la violence du grec.
- source_word: προσεκύνησα
  choice: je me prosternai
  rationale: Le geste est un hommage rendu à un haut dignitaire; « se prosterner » restitue le geste sans lui imposer nécessairement un sens cultuel.
- source_word: Ὄντως ψεύδῃ
  choice: Tu mens, c’est certain
  rationale: Cette formulation conserve l’insistance de ὄντως tout en restant idiomatique dans un interrogatoire en français.
theological_decisions:
- issue: Traduction de ψυχαί dans le contexte de la traite humaine
  choice: des personnes
  alternative: des âmes
  rationale: Le passage parle d’enlèvement et de revente d’êtres humains. « Des personnes » communique le référent sans suggérer que l’objet du trafic serait l’âme au sens théologique.
- issue: Nature de la prosternation devant Pentephris
  choice: je me prosternai devant Pentephris
  alternative: je rendis hommage à Pentephris
  rationale: La traduction conserve le geste concret du texte grec et laisse le lecteur en comprendre la portée sociale, sans le transformer en adoration religieuse.
- issue: Statut exprimé par δοῦλος et παῖς
  choice: esclave
  alternative: serviteur
  rationale: Le récit traite d’achat, de possession et de revente; « esclave » conserve cette réalité juridique et sociale plutôt que de l’adoucir en simple service domestique.
translation_notes:
  register: Français international moderne, narratif et digne. Les dialogues restent directs et naturels. Les répétitions judiciaires du grec sont conservées lorsqu’elles structurent l’interrogatoire, mais certaines coordinations sont allégées pour éviter une prose artificielle.
