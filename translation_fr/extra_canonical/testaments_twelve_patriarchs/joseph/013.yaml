review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le grec dit seulement que Pentephris fut convaincu « par ses paroles » (τοῖς λόγοις αὐτῆς) ; l’ajout « de sa femme » n’est pas justifié dans cet extrait. En 13.8, ἐκ γῆς Χαναάν indique l’origine : Joseph a été acheté « du pays de Canaan », non simplement acheté « au pays de Canaan ». Le reste rend fidèlement l’interrogatoire, le statut servile et l’ordre de châtiment.'
  naturalness: Le français est fluide, moderne et d’un registre narratif approprié. « Qu’on le déshabille et qu’on le frappe » restitue naturellement le fait d’être battu nu, sans euphémisation.
  terminology: « Marchand » est recevable pour μετάβολος dans ce contexte ; « personnes » rend bien ψυχάς au sens d’êtres humains. « Esclave », « se prosterner » et « dignitaires » sont appropriés. La note de 13.5 est utile pour la construction elliptique du rang.
  issues:
  - severity: medium
    issue: Ajout de « sa femme » en 13.1
    rationale: Le pronom αὐτῆς renvoie à une femme mentionnée dans le contexte antérieur, mais le verset grec fourni ne dit pas « sa femme ». La traduction ne doit pas préciser cette relation ici.
  - severity: low
    issue: « Ils m’ont acheté au pays de Canaan » en 13.8
    rationale: La préposition ἐκ marque la provenance. « Ils m’ont acheté dans le pays » peut exprimer le lieu de la transaction ; « Ils m’ont acheté du pays de Canaan » conserve l’idée qu’il en a été tiré.
