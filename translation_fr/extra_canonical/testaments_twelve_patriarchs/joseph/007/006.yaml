  text: '*Ἐγὼ δὲ¹⁷ νοήσας ὅτι *τὸ πνεῦμα¹⁸ τοῦ Βελίαρ *ἐνοχλεῖ αὐτήν¹⁹, προσευξάμενος τῷ²⁰ Κυρίῳ, εἶπον *πρὸς αὐτήν²¹.'
