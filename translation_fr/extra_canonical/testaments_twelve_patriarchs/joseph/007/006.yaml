base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/006.yaml
  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: fr
  text: 'Mais moi, ayant compris que l’esprit de Béliar la tourmentait, je priai le Seigneur et lui dis :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: comprenant
  rationale: Le participe exprime ici le fait de discerner ou de reconnaître la cause spirituelle de son état ; « comprenant » reste naturel tout en conservant cette nuance cognitive.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: l’esprit de Béliar
  rationale: Traduction formellement proche du grec, sans préciser si l’expression désigne Béliar lui-même ou un esprit qui lui appartient.
- source_word: ἐνοχλεῖ αὐτήν
  choice: la tourmentait
  rationale: Dans ce contexte, ἐνοχλέω indique une action pénible et persistante ; « tourmentait » rend mieux cette force que le plus faible « dérangeait ».
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: je priai le Seigneur
  rationale: Le participe aoriste antérieur est rendu par une proposition coordonnée fluide en français, avec le registre narratif digne du passé simple.
- source_word: εἶπον πρὸς αὐτήν
  choice: lui dis
  rationale: Expression française naturelle correspondant à « je dis à elle », avec le deux-points qui introduit les paroles à venir.
theological_decisions:
- issue: Nature de « l’esprit de Béliar »
  choice: Conserver littéralement « l’esprit de Béliar »
  alternative: « l’esprit mauvais de Béliar » ou « Béliar »
  rationale: Le grec ne qualifie pas explicitement cet esprit de « mauvais » et ne permet pas de réduire sans reste l’expression à Béliar lui-même ; la formulation conserve donc l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre littéraire du testament tout en restant clair. Aucun ajout explicatif ni particularisme confessionnel.
