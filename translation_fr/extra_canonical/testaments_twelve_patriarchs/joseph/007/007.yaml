base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: fr
  text: « Pourquoi, malheureuse, es-tu troublée et agitée, t’aveuglant dans tes péchés ? Souviens-toi que, si tu te donnes la mort, Astêthô, la concubine de ton mari, ta rivale, frappera tes enfants à coups de poing, et tu feras disparaître de la terre le souvenir de toi. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  choice: malheureuse
  rationale: Rend l’apostrophe féminine péjorative avec dignité, sans la nuance principalement économique que pourrait suggérer « misérable ».
- source_word: τάρασσον καὶ θορυβῇ
  choice: t’agites-tu et te troubles-tu
  rationale: Conserve le redoublement grec exprimant agitation et bouleversement, dans un français naturel.
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: aveuglée par tes péchés
  rationale: Expression idiomatique qui maintient le lien causal ou instrumental probable entre les péchés et l’aveuglement.
- source_word: ἀνέλῃς σεαυτήν
  choice: tu te donnes la mort
  rationale: Rend clairement l’acte de se tuer tout en gardant un registre digne.
- source_word: παλλακή
  choice: concubine
  rationale: Équivalent historique direct désignant une partenaire secondaire non assimilée à l’épouse.
- source_word: κονδυλίσει
  choice: frappera tes enfants à coups de poing
  rationale: Le verbe désigne concrètement le fait de frapper du poing; cette précision est préférable au terme général « battre ».
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: tu feras disparaître de la terre tout souvenir de toi
  rationale: Préserve le sujet grammatical « tu » et l’idée de supprimer sa mémoire ou sa postérité, sans attribuer cette action à Asthô.
theological_decisions:
- issue: Rapport entre le suicide envisagé et la disparition du souvenir
  choice: Maintenir « tu feras disparaître » avec la femme comme sujet
  alternative: « Asthô… effacera ton souvenir de la terre »
  rationale: Le grec ἀπολέσεις est à la deuxième personne du singulier; il présente la disparition du souvenir comme conséquence de son propre acte, malgré l’ambiguïté narrative possible concernant le rôle d’Asthô.
translation_notes:
  register: Français international moderne, soutenu mais immédiatement compréhensible. Le parallélisme et la rudesse de l’avertissement sont conservés; le nom propre Ἀστηθώ est translittéré « Asthô ».
