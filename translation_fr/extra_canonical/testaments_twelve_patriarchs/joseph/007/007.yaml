review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le participe présent actif τυφλώττουσα décrit la femme comme s’aveuglant elle-même « dans ses péchés », plutôt que comme passivement « aveuglée par » eux. Le nom Ἀστηθώ est plus fidèlement transcrit « Astêthô ». La seconde personne de ἀπολέσεις doit bien rester distincte du futur attribué à Astêthô.
  naturalness: Le texte est globalement fluide et d’un registre approprié. « Es-tu troublée et agitée » restitue plus naturellement en français le couple τάρασσον καὶ θορυβῇ, tandis que « t’aveuglant dans tes péchés » conserve la construction et l’agentivité du grec.
  terminology: « Concubine », « rivale » et « à coups de poing » rendent adéquatement παλλακή, ἀντίζηλος et κονδυλίσει. « Te donner la mort » est une formulation moderne et fidèle pour ἀνέλῃς σεαυτήν. « Le souvenir de toi » garde le sens de μνημόσυνον sans surinterpréter sa portée éventuelle de mémoire ou de postérité.
  issues:
  - severity: medium
    issue: Rendu passif et causal de τυφλώττουσα ἐν ἁμαρτίαις
    rationale: « Aveuglée par tes péchés » fait des péchés la cause agissante et atténue l’activité réflexive du participe grec. « T’aveuglant dans tes péchés » préserve l’ambiguïté exacte de ἐν et l’agentivité de la destinataire.
  - severity: medium
    issue: Transcription incomplète du nom Ἀστηθώ
    rationale: « Asthô » ne reflète pas l’epsilon après le tau ni le thêta du grec. « Astêthô » est une translittération française transparente et complète.
  - severity: low
    issue: Ajout de « tout » devant « souvenir »
    rationale: Le grec porte le singulier défini τὸ μνημόσυνόν σου. Le retirer donne une formulation plus proche sans nuire au français.
  revised_text: « Pourquoi, malheureuse, es-tu troublée et agitée, t’aveuglant dans tes péchés ? Souviens-toi que, si tu te donnes la mort, Astêthô, la concubine de ton mari, ta rivale, frappera tes enfants à coups de poing, et tu feras disparaître de la terre le souvenir de toi. »
  revised_footnotes: []
  revision_rationale: 'La révision corrige le nom propre et restitue la voix active ainsi que la relation non spécifiée par ἐν dans le participe « t’aveuglant dans tes péchés ». Elle conserve la structure syntaxique importante : Astêthô est le sujet de « frappera », tandis que la femme apostrophée demeure le sujet de « tu feras disparaître ».'
