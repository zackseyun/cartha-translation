- from: « Pourquoi, malheureuse, t’agites-tu et te troubles-tu, aveuglée par tes péchés ? Souviens-toi que, si tu te donnes la mort, Asthô, la concubine de ton mari, ta rivale, frappera tes enfants à coups de poing, et tu feras disparaître de la terre tout souvenir de toi. »
