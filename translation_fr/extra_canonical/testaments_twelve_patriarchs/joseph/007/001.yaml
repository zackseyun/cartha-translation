source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: fr
  text: 'Afin que tu apprennes que la méchanceté des impies ne triomphera pas de ceux qui révèrent Dieu en gardant la maîtrise d’eux-mêmes[a], regarde : j’en prends et j’en mange devant toi[b]. Après avoir dit cela, je déclarai : « Le Dieu de mes pères et l’ange d’Abraham[c] seront avec moi. » Et je mangeai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec rendu par « maîtrise d’eux-mêmes » peut aussi évoquer la retenue, la modération et, dans ce contexte, la pureté sexuelle.
    reason: Préserver l’étendue sémantique de σωφροσύνη sans réduire le terme à la chasteté.
  - marker: b
    text: 'Le grec présente ici une construction abrupte, littéralement : « regarde, ayant pris de cela, mangeant devant toi ».'
    reason: Signaler que la formulation française clarifie une syntaxe source elliptique ou textuellement difficile.
  - marker: c
    text: 'Ou : « l’ange appartenant à Abraham » ; la nature exacte de ce lien n’est pas précisée.'
    reason: Préserver l’ambiguïté du génitif Ἀβραάμ.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: en gardant la maîtrise d’eux-mêmes
  rationale: Le terme désigne la maîtrise de soi, la retenue et, dans ce contexte, peut inclure la pureté sexuelle. La formulation française conserve cette portée sans la réduire à la seule chasteté.
- source_word: θεοσεβούντων
  choice: ceux qui révèrent Dieu
  rationale: Le participe exprime une attitude de crainte respectueuse et de dévotion envers Dieu ; « révèrent » rend les deux dimensions dans un français naturel et digne.
- source_word: κακία
  choice: la méchanceté
  rationale: Le mot peut désigner le mal moral ou la malveillance. Ici, « méchanceté » convient à l’action hostile des impies sans surinterpréter sa forme précise.
- source_word: ἐσθίων
  choice: j’en mange
  rationale: Le participe présent grec s’insère dans une construction abrupte. Une proposition au présent rend naturellement l’action démonstrative accomplie devant l’interlocutrice.
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: l’ange d’Abraham
  rationale: Le génitif grec est conservé sans préciser une relation que le texte ne définit pas.
theological_decisions:
- issue: Relation entre la maîtrise de soi et la piété
  choice: « ceux qui révèrent Dieu en gardant la maîtrise d’eux-mêmes »
  alternative: « ceux qui craignent Dieu dans la chasteté »
  rationale: Le choix conserve le lien établi par le grec entre piété et σωφροσύνη, tout en évitant de limiter ce dernier terme à une doctrine particulière de la chasteté.
- issue: Identité et fonction de « l’ange d’Abraham »
  choice: Conserver littéralement « l’ange d’Abraham »
  alternative: « l’ange qui protégea Abraham »
  rationale: Le texte ne précise ni l’identité ni la fonction de cet ange ; expliciter une protection ou une identification résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, courant mais digne. Le tutoiement suit l’adresse grecque au singulier. Les temps narratifs au passé simple maintiennent un registre littéraire accessible, tandis que le présent « j’en prends et j’en mange » restitue le geste démonstratif immédiat.
