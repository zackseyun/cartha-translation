  text: But when she saw this, she fell on her face at my feet, weeping; and I raised her up and admonished her.
translation:
  language: fr
  text: Mais lorsqu’elle vit cela, elle tomba face contre terre à mes pieds, en pleurant. Je la relevai et lui adressai un avertissement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  choice: elle tomba face contre terre à mes pieds
  rationale: Rend naturellement en français la posture exprimée littéralement par « tomber sur son visage », tout en conservant la mention des pieds de Joseph.
- source_word: κλαίουσα
  choice: en pleurant
  rationale: Exprime simplement l’action simultanée du participe grec.
- source_word: ἀναστήσας αὐτήν
  choice: Je la relevai
  rationale: Le verbe signifie ici faire se relever; la proposition indépendante est plus naturelle en français et préserve la succession des actions.
- source_word: ἐνουθέτησα
  choice: lui adressai des remontrances
  rationale: Νουθετέω désigne un avertissement ou une correction visant à ramener quelqu’un à une conduite juste; « adresser des remontrances » conserve ici la force corrective sans préciser indûment leur contenu.
