  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/005.yaml
  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: fr
  text: 'Alors, profitant d’une occasion, elle se précipita à l’intérieur vers moi tandis que son mari était encore dehors et me dit : « Je suffoque, ou bien je me jetterai du haut d’un précipice, si tu ne couches pas avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: profitant d’une occasion
  rationale: Rend naturellement le participe grec et l’idée d’avoir saisi une circonstance favorable.
- source_word: εἰσεπήδησε πρός με
  choice: elle se précipita vers moi
  rationale: Conserve le mouvement soudain et énergique exprimé par le verbe grec.
- source_word: Ἄγχομαι
  choice: Je suffoque
  rationale: Préserve le présent et le sens littéral d’oppression ou d’étranglement, sans imposer une interprétation psychologique.
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: je me jetterai du haut d’un précipice
  rationale: Formulation française naturelle qui exprime clairement le geste de se jeter dans un escarpement.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: tu ne couches pas avec moi
  rationale: Expression directe, actuelle et compréhensible pour désigner l’union sexuelle, sans ajout explicatif ni euphémisme excessif.
