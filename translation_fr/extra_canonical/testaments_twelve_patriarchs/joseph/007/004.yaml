base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: fr
  text: 'Quand son mari la vit, il lui dit : « Qu’est-il arrivé à ton visage ? » Elle lui répondit : « Je souffre d’une douleur au cœur, et les gémissements de mon esprit m’oppressent. » Alors il la guérit par des paroles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί συνέπεσε τὸ πρόσωπόν σου;
  choice: Qu’est-il arrivé à ton visage ?
  rationale: Rend directement la question grecque tout en conservant son expression inhabituelle, qui porte sur l’altération visible du visage.
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: Je souffre d’une douleur au cœur
  rationale: Conserve le langage corporel et affectif de καρδία sans le réduire au seul sens moderne de maladie cardiaque.
- source_word: οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με
  choice: les gémissements de mon esprit m’oppressent
  rationale: « M’oppressent » exprime l’idée de pression, d’emprise ou d’accablement portée par συνέχω, dans un français naturel.
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: il la réconforta par ses paroles
  rationale: Dans ce contexte de détresse intérieure, « réconforta » communique naturellement l’effet bienfaisant ou guérissant des paroles, sans suggérer un traitement médical.
theological_decisions:
- issue: Portée de πνεῦμα dans « les gémissements de mon esprit »
  choice: esprit
  alternative: souffle / être intérieur
  rationale: Le terme grec peut désigner le souffle ou l’esprit; « esprit » maintient l’ambiguïté anthropologique sans introduire explicitement une entité divine.
- issue: Sens de ἐθεράπευσεν dans la dernière proposition
  choice: réconforta
  alternative: guérit / soulagea
  rationale: Le verbe signifie littéralement qu’il la soigna ou la guérit. Le contexte précise que cela se fait par des paroles; « réconforta » rend l’effet psychologique probable, tandis que la note conserve le sens plus littéral.
translation_notes:
  register: Français international moderne, fluide et digne. Le dialogue reste direct; les images du cœur et des gémissements de l’esprit sont préservées. La ponctuation française et les espaces typographiques sont employées.
