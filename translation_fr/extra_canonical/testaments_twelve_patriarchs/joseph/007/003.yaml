  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: fr
  text: Elle convint avec moi de ne plus commettre cette impiété. Pourtant, son cœur restait tourné vers le mal, et elle regardait autour d’elle pour voir comment elle pourrait me prendre au piège. Tout en gémissant, elle s’effondrait soudain, sans être faible.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de la proposition décrivant son effondrement est incertain; autre traduction possible : « elle s’affaissait rapidement, bien qu’elle ne fût pas faible ».'
    reason: Le texte comporte un signe de corruption et permet plusieurs nuances pour συντόμως συνεπίπτε et ἀσθενοῦσα.
lexical_decisions:
- source_word: συνεθέτό μου
  choice: se mit d’accord avec moi
  rationale: Rend l’idée d’un accord conclu avec Joseph, sans durcir le verbe en promesse ou en serment.
- source_word: ἀσέβειαν
  choice: impiété
  rationale: Conserve la portée morale et religieuse du terme grec, plutôt qu’un simple « mal ».
- source_word: ἔκειτο εἰς τὸ κακόν
  choice: restait tourné vers le mal
  rationale: Expression française naturelle qui préserve l’orientation persistante du cœur vers le mal.
- source_word: περιεβλέπετο
  choice: cherchait de tous côtés
  rationale: Restitue l’idée de regarder autour de soi en quête d’un moyen ou d’une occasion.
- source_word: παγιδεύσῃ
  choice: prendre au piège
  rationale: Équivalent direct et idiomatique de l’image du piège.
- source_word: συντόμως συνεπίπτε
  choice: s’effondrait soudain
  rationale: Le texte transmis est difficile; cette formulation suit le sens contextuel probable de brusque effondrement.
- source_word: μὴ ἀσθενοῦσα
  choice: sans être malade
  rationale: Dans ce contexte de simulation d’un malaise, « malade » exprime plus naturellement le sens de ἀσθενέω que « faible ».
theological_decisions:
- issue: Nature de l’ἀσέβεια
  choice: impiété
  alternative: faute / acte mauvais
  rationale: Le choix conserve la dimension religieuse du grec sans préciser davantage la nature de l’acte.
- issue: Intention intérieure de la femme
  choice: son cœur restait tourné vers le mal
  alternative: son cœur était fixé sur le mal
  rationale: Préserve l’affirmation morale forte du texte tout en restant naturelle en français moderne.
