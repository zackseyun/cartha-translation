revisions:
- from: '**Testament de Joseph 11.3–8**


    3. Le chef des Ismaélites me dit : « Tu n’es pas esclave, car ton apparence elle-même le montre. » Mais je leur déclarai que j’étais leur esclave. 4. Lorsque nous fûmes arrivés en Égypte, ils se disputèrent à mon sujet pour savoir qui me prendrait en échange d’or.[a] 5. Ils décidèrent donc tous de me laisser en Égypte auprès du négociant avec qui ils faisaient commerce, jusqu’à ce qu’ils reviennent avec des marchandises. 6. Mais le Seigneur m’accorda la faveur du négociant, qui me confia sa maison. 7. Dieu le bénit par mon intermédiaire et multiplia, grâce à moi, son or, son argent et le fruit de son travail.[b] 8. Je restai auprès de lui pendant trois mois.


    **Testament de Joseph 12**


    1. À cette époque, la femme de Pentéphri descendit à Memphis dans un char, en grande pompe,[c] car ses eunuques lui avaient parlé de moi. 2. Elle dit à son mari : « Le négociant s’est enrichi grâce à un jeune Hébreu. On raconte que celui-ci a été enlevé du pays de Canaan. 3. Règle donc cette affaire avec lui et fais entrer le jeune homme dans notre maison. Alors le Dieu des Hébreux te bénira, car la faveur du ciel est avec ce jeune homme. »'
  to: '**Testament de Joseph 11.3–8**


    3. Le chef des Ismaélites me dit : « Tu n’es pas esclave, car ton apparence elle-même le montre. » Mais je leur déclarai que j’étais leur esclave. 4. Lorsque nous fûmes arrivés en Égypte, ils se disputèrent à mon sujet pour savoir lequel d’entre eux, en me livrant, recevrait de l’or pour moi.[a] 5. Tous décidèrent donc de me laisser en Égypte auprès du négociant de leur commerce, jusqu’à ce qu’ils reviennent avec des marchandises. 6. Mais le Seigneur me fit trouver grâce aux yeux du négociant, qui me confia sa maison. 7. Dieu le bénit par mon intermédiaire et le fit prospérer en or, en argent et par son travail.[b] 8. Je restai auprès de lui pendant trois mois.


