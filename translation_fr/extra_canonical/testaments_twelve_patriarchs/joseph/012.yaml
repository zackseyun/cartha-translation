  text: '3[a]. And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: fr
  text: '**Testament de Joseph 11.3–8**


    3. Le chef des Ismaélites me dit : « Tu n’es pas esclave, car ton apparence elle-même le montre. » Mais je leur déclarai que j’étais leur esclave. 4. Lorsque nous fûmes arrivés en Égypte, ils se disputèrent à mon sujet pour savoir lequel d’entre eux, en me livrant, recevrait de l’or pour moi.[a] 5. Tous décidèrent donc de me laisser en Égypte auprès du négociant de leur commerce, jusqu’à ce qu’ils reviennent avec des marchandises. 6. Mais le Seigneur me fit trouver grâce aux yeux du négociant, qui me confia sa maison. 7. Dieu le bénit par mon intermédiaire et le fit prospérer en or, en argent et par son travail.[b] 8. Je restai auprès de lui pendant trois mois.


    **Testament de Joseph 12**


    1. À cette époque, la femme de Pentéphri descendit à Memphis dans un véhicule d’apparat, avec grand apparat,[c] car elle avait entendu parler de moi par ses eunuques. 2. Elle dit à son mari : « Le négociant s’est enrichi grâce à un certain jeune Hébreu ; on raconte qu’il a été enlevé du pays de Canaan. 3. Fais donc juger cette affaire avec lui et prends le jeune homme dans notre maison. Le Dieu des Hébreux peut te bénir, car la faveur du ciel est sur lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de cette phrase est difficile et très condensé. Le participe rendu par « en me livrant » peut aussi évoquer le fait de me trahir ou de me céder ; la relation exacte entre « recevoir de l’or » et « moi » reste incertaine.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « en or, en argent et en travail ». Le dernier terme peut aussi désigner la production, les affaires ou l’activité du domaine.'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec traduit par « véhicule d’apparat » est transmis sous une forme incertaine ; il semble désigner un moyen de transport associé à l’apparat.
    reason: textual_variant
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le récit porte sur la vente et la possession de Joseph; « esclave » exprime clairement cette condition, contrairement au plus général « serviteur ».
- source_word: ἡ ὄψις σου δηλοῖ
  choice: ton apparence elle-même le montre
  rationale: Cette formulation naturelle conserve l’idée que l’aspect et le maintien de Joseph rendent son affirmation peu crédible.
- source_word: τίς προδοὺς χρυσίον λάβῃ με
  choice: qui me prendrait en échange d’or
  rationale: Le grec est comprimé et textuellement difficile. La traduction conserve les éléments sûrs — l’or versé et la prise de Joseph — sans imposer le sens « tromper » ou « trahir ».
- source_word: μετάβολος
  choice: négociant
  rationale: Le terme désigne ici un intermédiaire ou marchand impliqué dans le commerce des Ismaélites; « négociant » convient au contexte et au registre.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: me confia sa maison
  rationale: L’expression signifie que Joseph reçoit la responsabilité de la maison ou maisonnée du négociant.
- source_word: ἐν χειρί μου
  choice: par mon intermédiaire
  rationale: Cette expression rend clairement l’idée biblique d’une bénédiction accordée au maître par l’action et l’administration de Joseph.
- source_word: ἔργῳ
  choice: le fruit de son travail
  rationale: Le terme peut viser le travail, la production ou l’activité économique. Cette expression garde cette ampleur tout en restant idiomatique en français.
- source_word: ἐν λαμπήνῃ
  choice: dans un char
  rationale: Le mot transmis est incertain, mais paraît désigner une voiture ou un véhicule d’apparat; l’incertitude est signalée en note.
- source_word: μετὰ δόξης πολλῆς
  choice: en grande pompe
  rationale: Dans ce contexte, δόξα évoque l’apparat et la magnificence extérieure plutôt que la gloire abstraite.
- source_word: εὐνοῦχοι
  choice: eunuques
  rationale: La traduction conserve le sens explicite du grec, même si le mot pouvait aussi désigner plus largement des officiers de cour.
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: règle donc cette affaire avec lui
  rationale: Le grec évoque une intervention ou décision judiciaire à prendre avec ou à l’encontre du négociant. La formulation française préserve prudemment cette portée sans préciser une procédure absente du texte.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: la faveur du ciel est avec ce jeune homme
  rationale: χάρις désigne ici une faveur d’origine céleste. La reprise explicite de « ce jeune homme » évite une ambiguïté pronominale en français.
theological_decisions:
- issue: Variation entre ὁ Κύριος et ὁ Θεός en 11.6–7
  choice: « le Seigneur » au verset 6 et « Dieu » au verset 7
  alternative: Harmoniser les deux titres en employant partout « Dieu » ou « le Seigneur »
  rationale: La variation du témoin grec est intentionnellement conservée plutôt qu’aplanie.
- issue: Identification de Pentéphri
  choice: Conserver la forme grecque « Pentéphri » sans l’identifier dans le corps du texte
  alternative: Employer « Potiphar » par harmonisation avec la Genèse
  rationale: Le texte grec nomme Pentéphri; l’harmonisation avec une autre tradition textuelle ne doit pas être introduite silencieusement.
- issue: Nature de la faveur céleste en 12.3
  choice: « la faveur du ciel est avec ce jeune homme »
  alternative: « la grâce du ciel repose sur lui »
  rationale: « Faveur » rend ici le bénéfice providentiel visible dans la prospérité, sans charger χάρις d’un sens doctrinal plus spécialisé que le contexte n’exige.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible tout en conservant les répétitions théologiques et les transitions abruptes du témoin grec. Les formulations trop archaïques ou inutilement juridiques ont été évitées.
