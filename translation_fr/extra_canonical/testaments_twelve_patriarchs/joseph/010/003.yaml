id: T12P.JOS.10.3
reference: Testament of Joseph 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: fr
  text: Mais là où demeure le Très-Haut, même si l’envie, l’esclavage ou la calomnie s’abattent sur quelqu’un, le Seigneur qui demeure auprès de lui, à cause de sa maîtrise de soi, non seulement le délivre de ces maux, mais encore l’élève et le glorifie, comme il l’a fait pour moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιπέσῃ
  choice: se trouve en butte à
  rationale: Rend naturellement l’idée de tomber au milieu d’épreuves ou d’en être assailli, tout en laissant l’envie, l’esclavage et la calomnie comme sujets d’adversité.
- source_word: σωφροσύνην
  choice: maîtrise de soi
  rationale: Dans le contexte de Joseph résistant à la séduction, le terme désigne la retenue et la conduite maîtrisée; ce choix reste clair sans le limiter à la seule chasteté.
- source_word: ῥύεται
  choice: délivre
  rationale: Exprime un sauvetage effectif hors des maux et convient au registre biblique moderne.
- source_word: ὑψοῖ
  choice: élève
  rationale: Conserve le sens d’exaltation ou d’élévation accordée par le Seigneur.
- source_word: δοξάζει
  choice: glorifie
  rationale: Préserve le vocabulaire théologique du grec et la distinction avec l’élévation.
theological_decisions:
- issue: Référent de αὐτόν après διὰ τὴν σωφροσύνην
  choice: La maîtrise de soi appartient à la personne éprouvée, que le Seigneur délivre.
  alternative: Rapporter la maîtrise de soi au Seigneur.
  rationale: Le contexte moral du Testament de Joseph et la construction du passage favorisent la maîtrise de soi de l’être humain; la formulation française conserve toutefois la chaîne pronominale sans ajout doctrinal.
- issue: Rapport spatial exprimé par κατοικῶν ἐπ᾽ αὐτόν
  choice: « demeure auprès de lui »
  alternative: « demeure sur lui » ou « demeure en lui »
  rationale: Le grec ἐπί avec l’accusatif est inhabituel après κατοικέω et les variantes éditoriales signalent une difficulté textuelle. « Auprès de lui » évite d’imposer une doctrine d’inhabitation tout en exprimant la présence protectrice du Seigneur.
- issue: Sujet implicite de ὡς κἀμέ
  choice: « comme il l’a fait pour moi »
  alternative: « comme moi aussi »
  rationale: Le sens contextuel est que le Seigneur a délivré, élevé et glorifié Joseph; l’explicitation française évite une phrase elliptique obscure.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’opposition introduite par δέ, la série des trois adversités et la progression « délivre… élève… glorifie ». Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
