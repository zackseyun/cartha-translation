  source_fidelity: 'Le sens général est fidèlement rendu : la présence du Très-Haut, les trois adversités, la délivrance, l’élévation et la glorification sont tous conservés. « Se trouve en butte à l’esclavage » est toutefois moins fidèle à la construction grecque unique περιπέσῃ (« survenir à / tomber sur ») et produit une association française maladroite.'
  naturalness: Le registre est clair et moderne. La reformulation de la série des adversités par « s’abattent sur quelqu’un » est plus idiomatique tout en gardant leur fonction commune dans la phrase.
  terminology: '« Très-Haut », « Seigneur », « maîtrise de soi », « délivre », « élève » et « glorifie » sont des équivalents justes et cohérents. « Auprès de lui » est maintenu pour κατοικῶν ἐπ᾽ αὐτόν : cette expression grecque est difficile, et cette solution ne surinterprète pas sa portée théologique.'
