source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁρᾶτε οὖν, τέκνα μου, πόσα κατεργάζεται¹ ἡ² ὑπομονὴ καὶ ἡ³ προσευχὴ μετὰ νηστείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: fr
  text: Voyez donc, mes enfants, combien la persévérance et la prière avec le jeûne peuvent accomplir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Voyez
  rationale: L’impératif invite les auditeurs à constater la leçon qui ressort du récit; « Voyez » conserve cette force directe.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rendu naturel et affectueux de l’adresse familiale.
- source_word: πόσα κατεργάζεται
  choice: tout ce que peuvent accomplir
  rationale: Le pluriel neutre πόσα exprime l’ampleur des résultats; cette tournure française transmet l’idée idiomatiquement sans la réduire à une simple quantité.
- source_word: ἡ ὑπομονὴ
  choice: la persévérance
  rationale: Dans ce contexte d’épreuve prolongée, « persévérance » exprime l’endurance active et fidèle mieux que « patience ».
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: la prière accompagnée du jeûne
  rationale: μετά indique ici que la prière s’exerce avec le jeûne; « accompagnée du jeûne » évite de faire du jeûne un troisième sujet indépendant.
theological_decisions:
- issue: Rapport entre la persévérance, la prière et le jeûne
  choice: La persévérance et la prière accompagnée du jeûne sont présentées ensemble comme sujets de l’accomplissement.
  alternative: Faire porter « tout ce que peut accomplir » sur la seule persévérance, puis détacher la prière avec le jeûne.
  rationale: Les articles ἡ… καὶ ἡ… coordonnent ὑπομονή et προσευχή, tandis que μετὰ νηστείας qualifie la prière. La traduction maintient cette structure sans préciser davantage la nature des résultats obtenus.
translation_notes:
  register: Français moderne, clair et digne. L’adresse « mes enfants » et l’impératif « Voyez » préservent le ton exhortatif. Aucun marqueur de note n’est requis.
