source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πάντας⁷ γὰρ ⸀ἀνθρώπους¹⁶ ἢ ἐν ἔργῳ⁷ *ἢ ἐν λόγῳ, ἢ ἐν διανοίᾳ¹⁷ †συνέρχεται¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: fr
  text: Car cela atteint tout le monde, soit dans les actes, soit dans les paroles, soit dans la pensée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec de cette phrase est incertain; il peut littéralement évoquer le fait de « se joindre » ou de « venir avec », mais la construction transmise est difficile.
    reason: Signaler honnêtement l’incertitude textuelle indiquée dans l’édition et préserver l’ambiguïté du texte grec.
lexical_decisions:
- source_word: πάντας … ἀνθρώπους
  choice: tout le monde
  rationale: Rend naturellement en français la totalité exprimée par « tous les êtres humains », sans restriction de genre.
- source_word: ἐν ἔργῳ
  choice: dans les actes
  rationale: Le pluriel idiomatique français exprime le domaine de l’action visé par le singulier grec.
- source_word: ἐν λόγῳ
  choice: dans les paroles
  rationale: Dans cette série éthique, λόγος désigne ce qui est dit plutôt que la faculté abstraite du langage.
- source_word: ἐν διανοίᾳ
  choice: dans la pensée
  rationale: Conserve le sens général de l’activité intérieure de l’esprit, sans ajouter l’idée non exprimée d’imagination.
- source_word: συνέρχεται
  choice: atteint
  rationale: Le verbe grec transmis est difficile dans cette construction; « atteint » restitue prudemment l’idée contextuelle de quelque chose qui touche toute personne, sans inverser sujet et objet.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: Le pronom « cela » maintient le sujet implicite renvoyant au contexte.
  alternative: Faire de « tout le monde » le sujet, comme dans « tout le monde se réunit ».
  rationale: πάντας … ἀνθρώπους est à l’accusatif et fonctionne comme objet; en faire le sujet produirait un contresens et obscurcirait la portée morale de l’énoncé.
translation_notes:
  register: Français international actuel, sobre et digne. La structure ternaire « actes, paroles, pensée » est conservée, avec une formulation accessible et sans ajout confessionnel.
