id: T12P.JOS.10.5
reference: Testament of Joseph 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Γινώσκουσιν¹⁹ οἱ ἀδελφοί μου²⁰ πῶς ἠγάπησέ με ὁ πατήρ μου²¹, καὶ οὐχὶ²² ὑψούμην²³ ⸀ἐν τῇ διανοίᾳ²⁴ μου⸃, καίπερ νήπιος ὑπάρχων²⁵, ⸀εἶχον τὸν *φόβον τοῦ θεοῦ²⁶ ἐν τῇ καρδίᾳ²⁷ μου⸃· ᾔδειν²⁸ γὰρ ὅτι πάντα²⁹ παρελεύσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: fr
  text: Mes frères savent combien mon père m’aimait. Pourtant, je ne m’enorgueillissais pas intérieurement et, bien que je fusse encore enfant, j’avais la crainte de Dieu dans mon cœur, car je savais que tout passerait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσιν
  choice: savent
  rationale: Le présent grec est conservé plutôt que d’être harmonisé avec le passé du récit.
- source_word: πῶς ἠγάπησέ με
  choice: combien mon père m’aimait
  rationale: Dans ce contexte, πῶς introduit la mesure ou la manière manifeste de l’amour; « combien » donne un français naturel sans surinterpréter.
- source_word: οὐχὶ ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: je ne m’enorgueillissais pas intérieurement
  rationale: Littéralement, Joseph ne « s’élevait » pas dans sa pensée; cette formulation française exprime clairement l’absence d’orgueil intérieur.
- source_word: νήπιος
  choice: encore enfant
  rationale: Le terme désigne ici un jeune enfant ou une personne encore immature; « enfant » convient au contexte biographique.
- source_word: φόβον τοῦ θεοῦ
  choice: la crainte de Dieu
  rationale: Expression théologique traditionnelle et exacte, qui peut englober révérence et peur sans réduire la tension sémantique.
- source_word: πάντα παρελεύσεται
  choice: tout passerait
  rationale: πάντα est rendu collectivement par « tout »; le futur grec est transposé au conditionnel dans le discours indirect français dépendant de « je savais ».
theological_decisions:
- issue: Sens de « la crainte de Dieu »
  choice: Conserver « la crainte de Dieu »
  alternative: « le respect de Dieu »
  rationale: « Respect » atténuerait le champ sémantique de φόβος et résoudrait indûment la tension entre révérence et crainte.
- issue: Portée de « tout passera »
  choice: Garder la formulation générale « tout passerait »
  alternative: Préciser « toutes les choses terrestres passeraient »
  rationale: Le grec ne précise pas la portée de πάντα; aucun complément interprétatif ne doit être ajouté.
translation_notes:
  register: Français moderne, digne et accessible. Le présent initial du grec est maintenu (« savent »), tandis que les faits rapportés restent au passé. L’imparfait du subjonctif « bien que je fusse » conserve un registre littéraire approprié sans archaïsme lexical excessif.
