review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : l’exhortation conditionnelle, la double vertu, la persévérance, la prière associée au jeûne, l’humilité de cœur, ainsi que « demeurera en vous » correspondent au grec. La formulation proposée rend toutefois la coordination des compléments un peu moins directement : le grec associe « persévérance et prière » sous ἐν, puis ajoute « avec jeûne ».'
  naturalness: Le français est globalement clair et de registre approprié. « Dans la prière accompagnée de jeûne » est toutefois un peu pesant et « l’humilité du cœur » est moins idiomatique, dans ce registre, que « l’humilité de cœur ».
  terminology: « Maîtrise de soi » rend sobrement σωφροσύνη, sans restreindre indûment le terme à la chasteté. « Pureté » convient à ἁγνεία. « Le Seigneur » et « demeurera en vous » sont fidèles et naturels; le pluriel conserve la portée non spécifiée de ἐν ὑμῖν.
  issues:
