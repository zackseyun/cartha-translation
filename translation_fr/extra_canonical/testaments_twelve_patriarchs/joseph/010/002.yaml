  - severity: low
    issue: Expression « l’humilité du cœur »
    rationale: Le grec ἐν ταπεινώσει καρδίας se rend plus naturellement en français religieux et littéraire moderne par « dans l’humilité de cœur ».
  revised_text: Ainsi, vous aussi, si vous recherchez la maîtrise de soi et la pureté dans la persévérance et la prière, avec le jeûne, dans l’humilité de cœur, le Seigneur demeurera en vous, car il aime la maîtrise de soi.
