source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: fr
  text: Ainsi, vous aussi, si vous recherchez la maîtrise de soi et la pureté dans la persévérance et la prière, avec le jeûne, dans l’humilité de cœur, le Seigneur demeurera en vous, car il aime la maîtrise de soi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: la maîtrise de soi
  rationale: Le terme désigne ici la retenue et la discipline personnelle, notamment face aux désirs; « maîtrise de soi » est naturel et convient au contexte moral.
- source_word: ἁγνείαν
  choice: la pureté
  rationale: « Pureté » rend le sens moral et sexuel possible du terme sans le limiter indûment à la chasteté.
- source_word: μεταδιώκητε
  choice: recherchez
  rationale: Le verbe exprime une poursuite active et soutenue; « recherchez » est idiomatique en français tout en conservant cette orientation volontaire.
- source_word: ὑπομονῇ
  choice: avec persévérance
  rationale: Dans ce contexte d’effort moral durable, « persévérance » rend mieux l’endurance constante que la simple patience.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: demeurera en vous
  rationale: Cette formulation respecte la préposition ἐν et maintient l’ambiguïté du pluriel français entre une présence intérieure en chacun et une présence au sein du groupe.
theological_decisions:
- issue: Portée de « en vous » (ἐν ὑμῖν)
  choice: le Seigneur demeurera en vous
  alternative: le Seigneur demeurera parmi vous
  rationale: Le grec emploie littéralement « en vous ». La traduction retenue évite de réduire le propos à une présence seulement communautaire, tout en laissant au pluriel sa portée collective possible.
- issue: Valeur de σωφροσύνη
  choice: maîtrise de soi
  alternative: chasteté
  rationale: Le contexte peut comporter une dimension sexuelle, mais le terme a une portée plus large de retenue et de discernement moral; « chasteté » résoudrait trop étroitement cette tension.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement ordonnée pour rendre lisible la série de compléments tout en conservant le lien entre prière et jeûne exprimé par « μετὰ νηστείας ».
