  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: fr
  text: Et je ne me suis pas enorgueilli dans le mal ; au contraire, j’honorais mes frères et, par crainte d’eux, je me suis tu pendant qu’on me vendait, sans dire aux Ismaélites que j’étais fils de Jacob, un homme grand et juste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  choice: je ne me suis pas enorgueilli dans le mal
  rationale: Rend le passif à valeur d’état de ἐπαίρω et conserve l’expression inhabituelle ἐν κακῷ, signalée comme textuellement incertaine dans l’édition.
- source_word: ἐτίμουν
  choice: j’honorais
  rationale: L’imparfait exprime une conduite continue envers ses frères.
- source_word: διὰ τὸν φόβον αὐτῶν
  choice: par crainte d’eux
  rationale: Le génitif peut indiquer l’objet de la crainte ; cette formulation française reste naturelle sans préciser davantage sa cause.
- source_word: πιπρασκόμενος
  choice: pendant qu’on me vendait
  rationale: Rend le participe présent passif et sa simultanéité avec le silence.
- source_word: δικαίου
  choice: juste
  rationale: Sens moral et religieux ordinaire de δίκαιος, à distinguer de « puissant ».
theological_decisions:
- issue: Caractérisation de Jacob par δίκαιος
  choice: un homme grand et juste
  alternative: un homme important et juste
  rationale: « Grand » conserve la portée ouverte de μέγας, tandis que « juste » traduit précisément δικαίου sans lui imposer une définition confessionnelle.
- issue: Motif du silence de Joseph
  choice: par crainte d’eux
  alternative: à cause de la crainte qu’ils inspiraient
  rationale: La traduction maintient l’ambiguïté sobre du génitif αὐτῶν tout en suivant son interprétation la plus naturelle comme génitif objectif.
translation_notes:
  register: Français international moderne, digne et lisible. Le contraste ἀλλά est rendu par « au contraire ». La répétition grecque de ἐσιώπουν, probablement liée à la transmission textuelle, n’est pas reproduite mécaniquement afin d’éviter une redondance artificielle en français.
