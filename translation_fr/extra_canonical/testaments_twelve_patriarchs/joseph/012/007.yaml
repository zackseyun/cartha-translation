revisions:
- from: Et Dieu le bénit entre mes mains et, grâce à moi, multiplia son or, son argent et ses biens.[a]
  to: Et Dieu le bénit sous mon autorité, et le rendit prospère en or, en argent et en travail.[a]
  rationale: La révision rétablit la portée de la construction grecque sans ajouter « grâce à moi » à la seconde action divine. Elle remplace une image française impropre par un équivalent contextuel naturel, rend ἔργῳ de façon lexicalement transparente et corrige la note afin qu’elle ne prête pas au grec une expression absente. Elle conserve le signalement de l’incertitude textuelle portant sur l’expression finale.
  reviewer_model: gpt-5.6-terra
