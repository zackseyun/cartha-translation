translation:
  language: fr
  text: Et Dieu le bénit sous mon autorité, et le rendit prospère en or, en argent et en travail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ma main » et « le rendit abondant en or, en argent et en travail ». « Sous mon autorité » rend ici l’expression « dans ma main ». Le mot grec traduit par « travail » peut aussi désigner une activité ou une œuvre; l’expression « et en travail » est entre crochets dans l’édition et sa présence dans le texte est incertaine.'
    reason: La note explique le sens non littéral nécessaire de l’expression idiomatique, maintient l’ambiguïté de ἔργῳ et signale précisément l’incertitude textuelle indiquée par les crochets de l’édition.
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: entre mes mains
  rationale: L’expression indique que la bénédiction divine accordée à l’homme s’est réalisée par l’intermédiaire ou sous la gestion de Joseph. Le français idiomatique emploie ici le pluriel, bien que le grec ait le singulier collectif « dans ma main ».
- source_word: ἐπλήθυνεν αὐτὸν
  choice: multiplia son or, son argent et ses biens
  rationale: Le verbe signifie « rendre nombreux, multiplier, accroître ». En français, rattacher directement le verbe aux possessions énumérées évite l’expression peu naturelle « le multiplia en or » tout en conservant le sens d’enrichissement.
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ
  choice: son or, son argent
  rationale: Le contexte matériel appelle les noms des métaux précieux, présentés comme les richesses de l’homme.
- source_word: ἔργῳ
  choice: biens
  rationale: Le sens premier est « œuvre, travail, activité ». Dans cette énumération de richesses accrues, « biens » rend vraisemblablement le résultat matériel ou les ressources issues du travail, sans imposer le peu naturel « en travail ».
theological_decisions:
- issue: Articulation entre l’action divine et l’intermédiaire humain
  choice: Dieu bénit, tandis que Joseph est présenté comme l’intermédiaire de cette prospérité
  alternative: Attribuer directement à Joseph l’enrichissement de l’homme
  rationale: Le sujet explicite du grec est Dieu; les expressions ἐν χειρί μου et la tournure traduite « grâce à moi » maintiennent la médiation de Joseph sans lui transférer l’action divine.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement restructurée pour être naturelle, tout en maintenant l’action de Dieu, le rôle médiateur de Joseph et l’incertitude lexicale et textuelle signalée en note.
