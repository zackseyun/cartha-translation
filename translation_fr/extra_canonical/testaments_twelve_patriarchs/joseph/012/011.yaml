    rationale: La collocation française usuelle est « rendre une décision » ou « prononcer un jugement », plutôt que « rendre un jugement ». Le premier choix conserve l'ouverture du grec κρίσις.
  - severity: low
    issue: Mouvement vers la maison insuffisamment idiomatique
    rationale: Avec εἰς, l'entrée ou le déplacement vers la maison est en jeu. « Emmène le jeune homme dans notre maison » est plus naturel et plus explicite que « prends ... dans notre maison ».
