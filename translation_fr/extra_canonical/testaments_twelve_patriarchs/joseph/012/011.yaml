  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: fr
  text: À présent donc, rends une décision à son sujet, emmène le jeune homme dans notre maison, et le Dieu des Hébreux te bénira, car la grâce du ciel repose sur lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: rends un jugement à son sujet
  rationale: Cette formulation française naturelle conserve le sens judiciaire de κρίσιν et comprend μετ᾿ αὐτοῦ comme indiquant la personne concernée, sans suggérer qu’elle participe elle-même au jugement.
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: prends le jeune homme dans notre maison
  rationale: « Prends » rend simplement l’impératif ἀφελοῦ dans ce contexte, tandis que « dans notre maison » exprime le mouvement marqué par εἰς.
- source_word: εὐλογῆσαί σε ἔχει
  choice: te bénira
  rationale: La tournure périphrastique grecque exprime ici une action future; le futur simple est idiomatique en français.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: la grâce du ciel repose sur lui
  rationale: « Grâce » préserve χάρις; « repose sur lui » rend naturellement l’idée d’une faveur céleste dirigée vers lui ou présente auprès de lui.
theological_decisions:
- issue: Sens de χάρις ἐκ τοῦ οὐρανοῦ
  choice: la grâce du ciel
  alternative: une faveur venant du ciel
  rationale: « Grâce » maintient la portée religieuse possible de χάρις sans préciser davantage la nature de cette faveur.
- issue: Désignation divine ὁ Θεὸς τῶν Ἑβραίων
  choice: le Dieu des Hébreux
  alternative: Dieu, celui des Hébreux
  rationale: La formulation traditionnelle et directe reproduit fidèlement le génitif grec sans ajout confessionnel.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe impérative suivie de la promesse est conservée; aucune note n’est nécessaire pour ce verset.
