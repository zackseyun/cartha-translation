source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Κατ᾽ ἐκεῖνον δὲ¹ τὸν καιρὸν κατῆει² Μεμφίς³ †ἐν λαμπήνῃ†⁴ *ἡ γυνὴ⁵ τοῦ Πεντεφρὶ⁶ ⌜μετὰ δόξης πολλῆς, ὅτι ἤκουσε περὶ ἐμοῦ παρὰ τῶν εὐνούχων αὐτῆς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: fr
  text: À cette époque, la femme de Pentéphri descendit à Memphis dans une litière[a], en grande pompe, car elle avait entendu parler de moi par ses eunuques.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec correspondant à « dans une litière » est incertain; le mot transmis peut désigner une litière ou une voiture couverte.
    reason: L’édition marque ἐν λαμπήνῃ comme une leçon textuellement douteuse; la note préserve cette incertitude sans supprimer le détail.
lexical_decisions:
- source_word: κατῆει Μεμφίς
  choice: descendit à Memphis
  rationale: Le verbe exprime un déplacement vers le bas ou vers un lieu considéré comme en contrebas; la tournure française conserve cette nuance sans lourdeur.
- source_word: ἐν λαμπήνῃ
  choice: dans une litière
  rationale: λαμπήνη désigne vraisemblablement un véhicule de transport couvert, ici rendu naturellement par « litière »; la leçon étant signalée comme incertaine dans l’édition, une note l’indique.
- source_word: μετὰ δόξης πολλῆς
  choice: en grande pompe
  rationale: Cette expression française rend le faste et l’éclat public impliqués par une « grande gloire », plus naturellement qu’un calque littéral.
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  choice: par ses eunuques
  rationale: Conserve le sens précis du grec et l’appartenance indiquée par αὐτῆς.
