  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: fr
  text: Quand nous fûmes arrivés en Égypte, ils se disputèrent à mon sujet pour savoir lequel, après m’avoir trahi, recevrait l’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφθάσαμεν
  choice: nous fûmes arrivés
  rationale: Dans ce contexte, le verbe exprime l’arrivée en Égypte; le passé antérieur marque naturellement en français l’antériorité par rapport à la dispute.
- source_word: ἐμάχοντο
  choice: ils se disputèrent
  rationale: Rend l’idée d’une vive querelle sans surcharger le texte d’une notion de combat physique.
- source_word: προδούς
  choice: après m’avoir trahi
  rationale: Le participe de προδίδωμι signifie livrer ou trahir; «trahi» conserve ici la portée personnelle du geste envers Joseph.
- source_word: χρυσίον
  choice: l’or
  rationale: Le terme désigne explicitement de l’or, et non simplement de l’argent ou une somme d’argent.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La tournure «lequel… recevrait» conserve l’enjeu de la dispute et l’ambiguïté du texte quant aux modalités précises de la trahison et du paiement.
