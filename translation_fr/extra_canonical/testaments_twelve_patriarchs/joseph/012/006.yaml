  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/006.yaml
  text: But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me.
translation:
  language: fr
  text: Mais le Seigneur me fit trouver grâce aux yeux du marchand, et celui-ci me confia sa maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέ μοι χάριν ἐν ὀφθαλμοῖς
  choice: m’accorda la faveur de
  rationale: Cette formulation française naturelle conserve l’idée sémitisante de recevoir la faveur auprès de quelqu’un sans reproduire littéralement « dans les yeux de ».
- source_word: τοῦ μεταβόλου
  choice: du marchand
  rationale: Dans ce contexte, μεταβόλος désigne un commerçant ou marchand; « marchand » est clair et conforme au récit.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: celui-ci me confia sa maison
  rationale: Le verbe πιστεύω avec un objet confié exprime ici la remise sous responsabilité. « Maison » préserve l’ambiguïté possible entre la demeure et la maisonnée ou les affaires domestiques.
theological_decisions:
- issue: Rôle du Seigneur dans la faveur accordée à Joseph
  choice: Le Seigneur est explicitement présenté comme celui qui accorde cette faveur.
  alternative: Traduire de manière impersonnelle, par exemple « je trouvai faveur ».
  rationale: Le grec ὁ Κύριος ἔδωκέ μοι attribue directement l’action au Seigneur; cette causalité théologique doit être conservée.
translation_notes:
  register: Français moderne, fluide et digne. Le démonstratif « celui-ci » clarifie que le sujet de « confia » est le marchand, tandis que « sa maison » maintient la portée souple de οἶκος.
