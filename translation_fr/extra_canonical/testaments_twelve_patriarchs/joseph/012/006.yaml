  text: '*Ὁ δὲ Κύριος ἔδωκέ μοι³⁰ χάριν ἐν ὀφθαλμοῖς τοῦ μεταβόλου καὶ ἐπίστευσέ³¹ μοι τὸν οἶκον αὐτοῦ.'
