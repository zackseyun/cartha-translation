  source_fidelity: 'Le sens général est bien rendu : μετάβολος est correctement compris comme « marchand », τινος νέου Ἑβραίου comme « un certain jeune Hébreu », et la seconde proposition conserve le caractère rapporté de λέγουσι. Toutefois, « grâce au travail » explicite indûment les « mains » grecques en y ajoutant la notion de travail. De même, « volé et emmené hors » transforme la construction unique κλοπῇ ἔκλεψαν (« ils le volèrent par un vol ») en deux actions coordonnées, dont « emmené » n''est qu''une implication contextuelle.'
  naturalness: La formulation proposée est fluide et de registre approprié. « Par l’intermédiaire de » rend naturellement l’instrumentalité de ἐν χερσίν sans ajouter « travail ». « A été enlevé du pays de Canaan » est idiomatique en français pour le rapt d’une personne; la note conserve l’emphase lexicale inhabituelle du grec.
  terminology: « Marchand », « jeune Hébreu » et « pays de Canaan » conviennent. « Enlevé » est préférable à « volé » dans le texte français courant pour une personne, tandis que la note doit signaler que le grec le décrit expressément au moyen du vocabulaire du vol.
