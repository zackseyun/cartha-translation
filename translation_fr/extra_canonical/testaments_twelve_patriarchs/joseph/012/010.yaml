  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: fr
  text: 'Et elle dit à son mari : « Le marchand s’est enrichi par l’intermédiaire d’un certain jeune Hébreu[a]. On dit aussi que celui-ci a été enlevé du pays de Canaan[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par les mains d’un certain jeune Hébreu ».'
    reason: Signaler l’image concrète et l’idée d’intermédiaire exprimées par le grec, sans ajouter la notion de travail.
  - marker: b
    text: 'Littéralement : « ils l’ont volé par un vol hors du pays de Canaan » ; le grec emploie un nom et un verbe de même racine pour insister sur le vol.'
    reason: Préserver l’emphase inhabituelle de la construction grecque, tandis que « enlevé » est plus naturel en français à propos d’une personne.
lexical_decisions:
- source_word: μετάβολος
  choice: le marchand
  rationale: Le terme désigne ici un marchand ou négociant; « marchand » est clair et naturel dans le contexte.
- source_word: ἐν χερσὶν τινος νέου Ἑβραίου
  choice: grâce au travail d’un certain jeune Hébreu
  rationale: Littéralement « par les mains d’un certain jeune Hébreu »; la formulation française explicite naturellement l’idée d’un enrichissement obtenu grâce à son activité.
- source_word: κλοπῇ ἔκλεψαν
  choice: a été volé
  rationale: La construction associe le nom et le verbe de même racine pour souligner le vol. Le français « a été volé » conserve l’image volontairement choquante d’une personne traitée comme un bien, tandis que la note signale l’insistance grecque.
- source_word: ἐκ γῆς Χαναάν
  choice: emmené hors du pays de Canaan
  rationale: « Hors du pays » rend explicitement le mouvement exprimé par ἐκ; « emmené » donne en français le résultat implicite du vol d’une personne.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le discours direct reste fluide; « celui-ci » évite l’ambiguïté du pronom et renvoie clairement au jeune Hébreu. La répétition étymologique du grec est expliquée en note plutôt qu’imitée maladroitement.
