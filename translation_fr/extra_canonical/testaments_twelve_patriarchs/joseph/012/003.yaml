  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/003.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: fr
  text: 'Et le principal d’entre eux me dit : « Tu n’es pas esclave, car ton apparence même le montre. » Je leur réponds que je suis leur[a] esclave.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « leur » est absent de certains témoins.
    reason: Le pronom αὐτῶν est textuellement incertain dans l’édition source; la note signale exactement l’élément en question.
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: le chef d’entre eux
  rationale: Littéralement « le plus grand d’entre eux » ; dans ce contexte, l’expression désigne naturellement celui qui occupe le premier rang dans le groupe.
- source_word: δοῦλος
  choice: esclave
  rationale: Le grec désigne une personne asservie ; « esclave » conserve plus exactement ce sens que « serviteur ».
- source_word: ἡ ὄψις σου δηλοῖ
  choice: ton apparence aussi le montre
  rationale: Formulation française naturelle qui garde le sens visible et probant de ὄψις et δηλοῖ, sans préciser ce que l’apparence révèle au-delà du contexte.
- source_word: λέγει … λέγω
  choice: me dit … je leur réponds
  rationale: Le présent de narration grec est conservé. « Je leur réponds » rend naturellement la prise de parole en retour, sans ajouter l’idée de « clairement », absente du texte grec transmis ici.
