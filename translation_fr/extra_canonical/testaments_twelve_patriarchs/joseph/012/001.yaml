source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐρχόμενος δὲ¹⁰ *μετὰ τῶν Ἰσμαϊλιτῶν¹¹ *ἐπηρώτων με λέγοντες· Δοῦλος εἶ; Κἀγὼ εἶπον¹² ὅτι δοῦλός¹³ εἰμι¹⁴ ἐξ οἴκου¹⁵, ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: fr
  text: 'Pendant que je voyageais avec les Ismaélites, ils ne cessaient de me demander : « Es-tu esclave ? » Je leur répondis que j’étais un esclave de maison, afin de ne pas couvrir mes frères de honte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: Pendant que je voyageais avec les Ismaélites
  rationale: Le participe ἐρχόμενος exprime ici le déplacement en compagnie des Ismaélites. « Voyageais » est naturel en français et évite un « venais » qui demanderait un point d’arrivée explicite.
- source_word: ἐπηρώτων με
  choice: ils ne cessaient de me demander
  rationale: L’imparfait grec peut suggérer une interrogation répétée ou insistante, nuance retenue dans la consultation anglaise.
- source_word: δοῦλος
  choice: esclave
  rationale: Dans ce contexte de vente et de statut personnel, « esclave » rend plus exactement δοῦλος que « serviteur ».
- source_word: δοῦλος ... ἐξ οἴκου
  choice: un esclave né dans la maison
  rationale: 'ἐξ οἴκου désigne vraisemblablement une origine domestique : Joseph se présente comme esclave appartenant à la maison depuis sa naissance, plutôt que comme une personne récemment asservie. Cette formulation française reste concise tout en explicitant l’idiome.'
- source_word: αἰσχύνω
  choice: couvrir ... de honte
  rationale: Cette expression naturelle et digne rend la notion de honte ou de déshonneur attachée au verbe.
theological_decisions:
- issue: La déclaration de Joseph sur son statut
  choice: Conserver le mensonge protecteur sans commentaire moral
  alternative: Atténuer « esclave » en « serviteur » ou expliquer la conduite de Joseph
  rationale: Le texte présente la déclaration comme destinée à protéger ses frères, mais ne tranche pas ici explicitement sa valeur morale. La traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple marque la réponse ponctuelle, tandis que l’imparfait rend le déplacement et l’interrogation répétée.
