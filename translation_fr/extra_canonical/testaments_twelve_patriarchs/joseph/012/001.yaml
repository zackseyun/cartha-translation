- from: 'Pendant que je voyageais avec les Ismaélites, ils ne cessaient de me demander : « Es-tu esclave ? » Je leur répondis que j’étais un esclave né dans la maison, afin de ne pas couvrir mes frères de honte.'
  to: 'Pendant que je voyageais avec les Ismaélites, ils ne cessaient de me demander : « Es-tu esclave ? » Je leur répondis que j’étais un esclave de maison, afin de ne pas couvrir mes frères de honte.'
  rationale: La révision remplace uniquement « né dans la maison », qui surinterprétait ἐξ οἴκου, par « esclave de maison », expression qui garde l’idée d’un esclave rattaché à une maisonnée sans imposer l’idée d’une naissance dans celle-ci. Le reste du texte est fidèle et naturel.
