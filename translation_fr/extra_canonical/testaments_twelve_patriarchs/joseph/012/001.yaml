review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement le déplacement avec les Ismaélites, l’interrogation répétée, l’emploi de δοῦλος (« esclave ») et la proposition de but. Toutefois, « né dans la maison » introduit explicitement l’idée de naissance, alors que ἐξ οἴκου signifie plus prudemment qu’il est un esclave relevant d’une maison ou de la maisonnée. L’anglais audité (« household servant ») va dans ce sens sans affirmer la naissance.
  naturalness: Le français est globalement naturel, clair et d’un registre narratif approprié. « Esclave de maison » est une formulation compréhensible et concise pour éviter l’explicitation indue de « né ».
  terminology: « Ismaélites », « esclave » et « couvrir ... de honte » sont appropriés. Le maintien d’« esclave » restitue correctement le statut exprimé par δοῦλος sans l’atténuer en « serviteur ».
  issues:
  - severity: medium
    issue: « un esclave né dans la maison » explicite une naissance non assurée par le grec.
    rationale: La locution ἐξ οἴκου renvoie à l’origine ou à l’appartenance domestique, mais ne contient pas le terme « né ». Une traduction doit conserver cette marge d’ambiguïté.
  revised_text: 'Pendant que je voyageais avec les Ismaélites, ils ne cessaient de me demander : « Es-tu esclave ? » Je leur répondis que j’étais un esclave de maison, afin de ne pas couvrir mes frères de honte.'
