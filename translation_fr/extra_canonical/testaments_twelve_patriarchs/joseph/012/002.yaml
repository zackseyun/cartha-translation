  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/002.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: fr
  text: 'Alors le principal d’entre eux me dit : « Tu n’es pas un esclave, car ton apparence aussi le montre clairement. » Mais moi, je leur dis que je suis leur esclave.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: le plus important d’entre eux
  rationale: Le comparatif substantivé désigne ici celui qui occupe le rang principal dans le groupe, sans nécessairement indiquer l’âge ou la taille.
- source_word: δοῦλος
  choice: esclave
  rationale: Le grec désigne normalement une personne asservie; « serviteur » atténuerait ici la condition sociale affirmée par Joseph.
- source_word: ἡ ὄψις σου
  choice: ton apparence
  rationale: Expression naturelle qui conserve la référence générale à l’aspect visible de Joseph.
- source_word: δηλοῖ
  choice: le montre clairement
  rationale: Rend l’idée de rendre manifeste ou évident sans ajouter ce que l’apparence révèle précisément.
- source_word: ὑπάρχω
  choice: je suis
  rationale: Dans cette construction avec un attribut, le verbe exprime simplement l’état ou la condition; « je suis » est le rendu français le plus naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition d’« esclave » est conservée afin de maintenir le contraste explicite du grec. Le passage au présent narratif suit les verbes λέγει et λέγω du texte fourni.
