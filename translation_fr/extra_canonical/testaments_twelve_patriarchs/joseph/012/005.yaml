source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Διὰ πᾶσιν ἔδοξεν *τοῦ εἶναι²⁴ με εἰς Αἴγυπτον πρὸς *τὸν μετάβολον τῆς ἐμπορίας²⁵ αὐτῶν, ἕως ὅτου²⁶ ἐπιστρέψουσιν²⁷ φέροντες²⁸ ἐμπορίαν²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: fr
  text: Donc, tous jugèrent bon que je demeure en Égypte auprès de l’intermédiaire de leur commerce, jusqu’à ce qu’ils reviennent en apportant des marchandises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: ils jugèrent bon
  rationale: Cette tournure française naturelle conserve l’idée d’une décision qui parut convenable à l’ensemble du groupe.
- source_word: τοῦ εἶναι με εἰς Αἴγυπτον
  choice: que je reste en Égypte
  rationale: Dans ce contexte, εἶναι avec εἰς exprime le fait de demeurer sur place plutôt qu’un simple déplacement vers l’Égypte.
- source_word: μετάβολον
  choice: intermédiaire
  rationale: Le terme rare désigne ici vraisemblablement un agent ou partenaire commercial; « intermédiaire » rend cette fonction sans le réduire nécessairement à un simple marchand.
- source_word: ἐμπορίαν
  choice: des marchandises
  rationale: Dans la construction avec φέροντες, le nom désigne concrètement les biens rapportés pour le commerce.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation demeure proche de la syntaxe grecque tout en étant claire; « intermédiaire de leur commerce » préserve la relation quelque peu ambiguë exprimée par le génitif grec.
