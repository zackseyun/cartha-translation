revisions:
- from: Ainsi, ils jugèrent tous bon que je reste en Égypte auprès de l’intermédiaire de leur commerce, jusqu’à ce qu’ils reviennent avec des marchandises.
  to: Donc, tous jugèrent bon que je demeure en Égypte auprès de l’intermédiaire de leur commerce, jusqu’à ce qu’ils reviennent en apportant des marchandises.
  rationale: 'Révision limitée : elle explicite la valeur active de φέροντες et améliore légèrement la fluidité, sans résoudre de manière excessive le sens commercial incertain de μετάβολος.'
