base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008.yaml
  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: fr
  text: '**7:6** Elle me dit : « Tu vois donc que tu m’aimes. Que cela me suffise : seulement, prends soin de ma vie et de celle de mes enfants, et j’espère obtenir aussi ce que je désire. » **7** Mais elle ne savait pas que j’avais parlé ainsi à cause de mon Seigneur, et non à cause d’elle. **8** En effet, si quelqu’un tombe sous l’emprise de la passion du désir et en devient esclave, comme elle l’était, même s’il entend une parole bonne, il l’interprète en fonction de cette passion, dans le sens de son mauvais désir.


    **8:1** Je vous le dis donc, mes enfants : il était environ midi lorsqu’elle me quitta.[a] Je pliai les genoux devant le Seigneur pendant tout le jour et toute la nuit. À l’approche de l’aube, je me relevai, en pleurant et en demandant d’être délivré d’elle. **2** Finalement, elle saisit mes vêtements de force et tenta de me tirer violemment pour avoir des relations sexuelles avec moi.[b] **3** Quand je vis que, dans sa frénésie, elle tenait fermement ma tunique, je la lui laissai et m’enfuis nu.[c] **4** Elle s’en empara et m’accusa faussement. Lorsque son mari arriva, il me fit jeter dans une prison située dans sa propre maison. Le lendemain, après m’avoir fait fouetter, il m’envoya dans la prison du Pharaon. **5** Pendant que j’étais enchaîné, l’Égyptienne était accablée de chagrin. Elle venait écouter comment, dans la maison des ténèbres, je remerciais le Seigneur et chantais ses louanges, et comment, d’une voix joyeuse, je glorifiais mon Dieu, heureux d’avoir, à cette occasion,
    été délivré de l’Égyptienne.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « c’était environ la sixième heure » ; selon le mode antique de compter les heures depuis le lever du jour, il s’agit d’environ midi.'
    reason: historical_context
  - marker: b
    text: Le grec συνουσία désigne ici explicitement des relations sexuelles.
    reason: lexical_alternative
  - marker: c
    text: Certains témoins ajoutent ici une expression pouvant se traduire par « et, m’en étant dégagé ». La phrase reste claire avec ou sans ces mots. Voir aussi Genèse 39.12.
    reason: textual_variant_and_cross_reference
  - marker: d
    text: Le grec peut aussi se traduire par « grâce à un prétexte » ou « par un motif apparent ». Dans le contexte, Joseph voit son éloignement de l’Égyptienne comme résultant paradoxalement des circonstances qui l’ont conduit en prison.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: prends soin de ma vie et de celle de mes enfants
  rationale: L’expression signifie prendre en charge ou faire sien le souci de quelque chose. « Prends soin de » restitue naturellement l’appel manipulateur sans imposer une responsabilité juridique.
- source_word: διὰ τὸν Κύριόν μου
  choice: à cause de mon Seigneur
  rationale: Le contexte de résistance morale et la prière qui suit favorisent le référent divin, tout en conservant la formulation causale sobre du grec.
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας καὶ δουλωθῇ αὐτῷ
  choice: tombe sous l’emprise de la passion du désir et en devient esclave
  rationale: La formulation garde l’image de la sujétion exprimée par ὑποπίπτω et toute la force servile de δουλόω.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: il l’interprète en fonction de cette passion, dans le sens de son mauvais désir
  rationale: 'Le verbe décrit ici une compréhension déformée : même une bonne parole est comprise à travers le désir qui domine la personne.'
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: il était environ midi
  rationale: La sixième heure, comptée depuis le lever du jour, correspond approximativement à midi. La traduction communique directement l’heure au lecteur moderne.
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: d’être délivré d’elle
  rationale: Dans ce contexte, λύτρωσις désigne une libération concrète plutôt qu’une notion technique de rédemption.
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: me tira violemment vers elle pour avoir des relations sexuelles avec moi
  rationale: συνουσία désigne explicitement les rapports sexuels. La formulation française est directe, claire et non euphémistique.
- source_word: ἐσυκοφάντησέ με
  choice: m’accusa faussement
  rationale: Le verbe implique une accusation mensongère et malveillante. Cette traduction est plus précise ici que le seul terme « calomnia ».
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: dans la maison des ténèbres
  rationale: La traduction conserve l’image métaphorique et solennelle du grec pour la prison.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: sous ce prétexte, été délivré
  rationale: πρόφασις peut désigner un prétexte ou un motif apparent. Joseph voit dans l’accusation mensongère le moyen paradoxal par lequel il a échappé à la femme.
theological_decisions:
- issue: Référent de « mon Seigneur » en 7:7
  choice: Le Seigneur désigne Dieu, motif de la retenue de Joseph.
  alternative: Le terme pourrait désigner son maître humain.
  rationale: La conduite de Joseph, sa prière adressée au Seigneur dès 8:1 et la glorification de « mon Dieu » en 8:5 soutiennent le référent divin. La traduction ne développe toutefois pas cette identification dans le corps du texte.
- issue: Portée de l’enseignement sur le désir en 7:8
  choice: 'La maxime généralise le cas de l’Égyptienne : le désir asservit aussi l’interprétation des paroles bonnes.'
  alternative: La phrase pourrait être comprise seulement comme un commentaire ponctuel sur le malentendu de la femme.
  rationale: Les formes indéfinies « si quelqu’un » et « même s’il entend » donnent explicitement une portée générale, tandis que « comme elle l’était » maintient le lien narratif.
- issue: Joie de Joseph en prison
  choice: Joseph se réjouit d’avoir été délivré de la femme par les circonstances mêmes de la fausse accusation.
  alternative: « Sous ce prétexte » pourrait qualifier seulement son emprisonnement, sans présenter celui-ci comme moyen de délivrance.
  rationale: La syntaxe relie la joie et la glorification à ἀπηλλάγην, « j’ai été délivré », tout en préservant le caractère paradoxal et pénible du moyen.
translation_notes:
  register: Français international actuel, digne et narratif. Les périodes grecques ont été légèrement segmentées pour la clarté. Le vocabulaire moral demeure fort (« emprise », « esclave », « mauvais désir »), sans archaïsme inutile. « Le Pharaon » conserve le titre avec article, et « l’Égyptienne » reprend la désignation caractéristique du récit.
