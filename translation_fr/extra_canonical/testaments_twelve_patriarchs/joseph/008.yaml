review_pass:
  verdict: revise
  source_fidelity: 'Le texte français rend avec fidélité l’enchaînement grec, y compris la maxime générale sur le désir, la prière nocturne, la tentative de contrainte sexuelle, la fuite et la scène de prison. La correction principale est à 8:4 : κρατήσασα τοῦτον signifie d’abord qu’elle s’empara du vêtement, non explicitement qu’elle le garda. La note sur πρόφασις doit aussi éviter d’identifier sans réserve le « prétexte » à l’accusation mensongère, même si celle-ci est le contexte narratif le plus probable.'
  naturalness: Le français est actuel, clair et conserve un registre narratif digne. « Vers elle pour avoir des relations sexuelles avec moi » est compréhensible, mais « pour avoir des relations sexuelles avec moi » exprime directement la direction/visée de εἰς συνουσίαν sans ajouter « vers elle ».
  terminology: « Seigneur », « délivré », « esclave », « tunique », « l’Égyptienne » et « le Pharaon » sont appropriés. « Maison des ténèbres » préserve utilement l’image du grec. « Accusa faussement » restitue bien ἐσυκοφάντησέ με.
  issues:
  - severity: low
    issue: '8:4 : « Elle garda la tunique »'
    rationale: κρατήσασα τοῦτον décrit le fait de saisir ou de tenir le vêtement. « Elle s’en empara » est plus proche du grec et n’ajoute pas l’idée de le conserver.
  - severity: low
    issue: '8:2 : ajout spatial dans « me tira violemment vers elle »'
    rationale: Le grec dit qu’elle le tirait de force vers une relation sexuelle (εἰς συνουσίαν), non spécifiquement « vers elle ». Une formulation française plus directe évite ce léger ajout.
  - severity: medium
    issue: 'Note d : identification catégorique du « prétexte »'
    rationale: διὰ προφάσεως peut désigner un prétexte, un motif apparent ou une occasion. Dans le récit, l’accusation est vraisemblablement en jeu, mais le grec ne l’explicite pas dans cette expression ; la note doit préserver cette marge.
