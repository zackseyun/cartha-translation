reference: Testament of Joseph 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: fr
  text: Et j’ai lutté contre une femme sans pudeur qui me pressait d’enfreindre la loi avec elle, mais le Dieu de mon père m’a délivré d’une flamme ardente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  choice: j’ai lutté
  rationale: Rend directement l’idée d’un combat ou d’une résistance soutenue.
- source_word: γυναῖκα ἀναιδῆ
  choice: une femme sans pudeur
  rationale: Exprime le manque de retenue et l’effronterie du grec sans recourir à une formulation excessivement insultante.
- source_word: ἐπείγουσάν με
  choice: qui me pressait
  rationale: Conserve la pression insistante exercée sur Joseph.
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: de commettre avec elle un acte contraire à la Loi
  rationale: παρανομεῖν signifie agir en violation de la loi; l’ajout de « avec elle » préserve l’allusion sexuelle sans rendre explicite ce que le grec laisse indirect.
- source_word: ἐρρύσατό με
  choice: m’a délivré
  rationale: Rend le sauvetage hors d’un danger avec une tournure française digne et naturelle.
- source_word: ἐκ φλογὸς καιομένης
  choice: d’une flamme ardente
  rationale: Conserve l’image métaphorique du feu brûlant en évitant la redondance peu naturelle de « flamme brûlante ».
theological_decisions:
- issue: Valeur de τοῦ πατρός μου après Θεός
  choice: le Dieu de mon père
  alternative: Dieu de mon père
  rationale: En grec, l’article appartient au complément « de mon père », tandis que le français idiomatique requiert normalement « le Dieu de mon père ». L’absence d’article devant Θεός en grec n’impose donc pas une tournure française sans article.
- issue: Nature de la transgression
  choice: un acte contraire à la Loi
  alternative: pécher / avoir des relations avec elle
  rationale: La formulation garde la dimension normative de παρανομεῖν et l’allusion contextuelle, sans réduire le terme à une catégorie théologique plus générale ni expliciter davantage que la source.
- issue: Sens de la flamme
  choice: maintien de l’image sans explication
  alternative: interpréter la flamme comme la passion, la tentation ou le jugement
  rationale: Le texte ne précise pas le référent de l’image; la traduction préserve cette ambiguïté théologique et littéraire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le témoignage à la première personne, la résistance prolongée, l’allusion sexuelle indirecte et la métaphore finale.
