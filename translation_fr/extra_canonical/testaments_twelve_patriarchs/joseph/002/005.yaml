source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: fr
  text: Car Dieu n’a pas honte comme un homme, il ne prend pas peur comme un fils d’homme et, comme un être né de la terre, [il ne s’affaiblit pas ou il] ne s’épouvante pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: éprouve de honte
  rationale: Rend naturellement l’idée d’avoir honte, sans suggérer nécessairement une humiliation infligée de l’extérieur.
- source_word: δειλιᾷ
  choice: prend peur
  rationale: Exprime la peur ou la lâcheté suggérée par le verbe dans un français courant, tout en restant parallèle à « s’épouvante ».
- source_word: γηγενής
  choice: un être né de la terre
  rationale: Conserve l’image étymologique et anthropologique du grec plutôt que de la réduire simplement à « mortel ».
- source_word: ἀσθενεῖ
  choice: s’affaiblit
  rationale: Préserve le sens d’être ou de devenir faible et maintient le membre textuellement incertain entre crochets.
- source_word: πτοεῖται
  choice: s’épouvante
  rationale: Rend une peur intense ou un état de terreur, distinct de δειλιᾷ.
theological_decisions:
- issue: Comparaisons anthropomorphiques négatives
  choice: Conserver les trois comparaisons explicites avec l’être humain
  alternative: Les reformuler comme une affirmation abstraite de l’impassibilité divine
  rationale: Le grec oppose directement Dieu à l’homme, au fils d’homme et à l’être né de la terre; une abstraction résoudrait indûment la tension théologique du texte.
- issue: Segment textuellement incertain [ἀσθενεῖ ἢ]
  choice: Le traduire entre crochets et garder les deux verbes séparés
  alternative: L’omettre ou fondre faiblesse et effroi en une seule expression
  rationale: Les crochets de l’édition signalent l’incertitude textuelle; leur maintien rend visible l’état de la source sans imposer une reconstruction.
translation_notes:
  register: Français moderne, digne et accessible. La coordination répétée garde le rythme solennel de la triple négation grecque. Les crochets reproduisent ceux de l’édition source et ne sont pas des marqueurs de note.
