  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: fr
  text: Car le Seigneur n’abandonne pas ceux qui le craignent, ni dans les ténèbres, ni dans les chaînes, ni dans les afflictions, ni dans la détresse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: abandonne
  rationale: Rend directement l’idée de délaisser ou d’abandonner, dans un français naturel et digne.
- source_word: τοὺς φοβουμένους αὐτόν
  choice: ceux qui le craignent
  rationale: Conserve l’expression biblique de la crainte du Seigneur sans en réduire le sens au respect.
- source_word: σκότει
  choice: ténèbres
  rationale: Préserve la force imagée du grec et le registre biblique naturel en français.
- source_word: δεσμοῖς
  choice: chaînes
  rationale: Dans ce contexte d’épreuves et de captivité, « chaînes » est concret et idiomatique.
- source_word: θλίψεσιν
  choice: afflictions
  rationale: Exprime les épreuves oppressantes et douloureuses sans préciser au-delà du grec.
- source_word: ἀνάγκαις
  choice: détresse
  rationale: Rend ici la contrainte extrême ou la situation pressante par un terme français naturel adapté à l’énumération.
theological_decisions:
- issue: Portée de la négation devant l’énumération
  choice: Répétition de « ni » devant chaque circonstance
  alternative: « pas dans les ténèbres, ou les chaînes, ou les afflictions, ou la détresse »
  rationale: Le grec associe la négation à une série introduite par ἢ. La répétition française de « ni » clarifie que l’abandon n’a lieu dans aucune de ces situations, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La structure sentencieuse et l’énumération du grec sont conservées, avec une syntaxe française fluide.
