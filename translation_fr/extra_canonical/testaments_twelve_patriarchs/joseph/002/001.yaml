  text: '*Καὶ οὗτος [¹ὁ ἀρχιμάγειρος Φαραὼ]¹ ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/001.yaml
  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: fr
  text: Et cet homme, le chef des cuisiniers[a] de Pharaon, me confia sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le chef de la garde » ; le titre grec signifie littéralement « chef des cuisiniers » et peut désigner un haut fonctionnaire de la cour.'
    reason: Le titre ἀρχιμάγειρος est ambigu dans le contexte administratif et narratif ; la note préserve l’équivalent traditionnel lié au récit de Joseph sans effacer le sens littéral grec.
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: chef des cuisiniers
  rationale: Le grec désigne littéralement le responsable principal des cuisiniers. Bien que ce titre puisse aussi désigner un haut fonctionnaire chargé de la garde ou des exécutions, la traduction conserve ici le sens lexical direct et signale l’autre compréhension en note.
- source_word: ἐπίστευσέ μοι
  choice: me confia
  rationale: Le verbe πιστεύω suivi du datif exprime ici le fait de remettre quelque chose à la responsabilité d’une personne.
- source_word: τὸν οἶκον αὐτοῦ
  choice: sa maison
  rationale: οἶκος peut désigner la maison, la maisonnée ou les affaires domestiques. « Sa maison » préserve cette amplitude en français.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La syntaxe suit étroitement le grec tout en restant naturelle ; « cet homme » reprend explicitement le démonstratif οὗτος.
