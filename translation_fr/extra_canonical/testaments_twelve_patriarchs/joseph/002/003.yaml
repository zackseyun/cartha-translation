  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: fr
  text: J’ai été emprisonné, battu et tourné en dérision, et le Seigneur m’a fait trouver compassion auprès du geôlier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: J’ai été emprisonné
  rationale: Rend directement l’aoriste passif et reste naturel en français moderne.
- source_word: ἐτύφθην
  choice: battu
  rationale: Exprime le fait d’avoir reçu des coups, sens courant du verbe dans ce contexte.
- source_word: ἐξεμυκτηρίσθην
  choice: tourné en dérision
  rationale: Conserve la force de la moquerie méprisante exprimée par le verbe grec.
- source_word: ἔδωκέ με ὁ Κύριος εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: le Seigneur m’a accordé la compassion du gardien de la prison
  rationale: Formulation française naturelle qui conserve l’idée que le Seigneur a suscité envers Joseph la compassion du geôlier.
- source_word: δεσμοφύλακος
  choice: gardien de la prison
  rationale: Expression claire et actuelle pour le responsable de la garde des détenus.
theological_decisions:
- issue: Action divine et compassion humaine
  choice: Le Seigneur accorde à Joseph la compassion du gardien
  alternative: Le Seigneur rend Joseph compatissant devant le gardien
  rationale: La construction εἰς οἰκτιρμοὺς ἐνώπιον de quelqu’un indique naturellement que Joseph devient l’objet de la compassion de cette personne, non qu’il éprouve lui-même de la compassion.
translation_notes:
  register: Français international moderne, simple et digne. La série des trois passifs est resserrée pour une lecture fluide, sans atténuer l’enchaînement des souffrances.
