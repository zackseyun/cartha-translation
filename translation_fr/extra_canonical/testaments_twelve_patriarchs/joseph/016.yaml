revisions:
- from: '**Testament de Joseph 16**


    1 Mais Memphis dit à son mari : « Achète ce jeune homme, car j’apprends qu’ils le mettent en vente. »


    2 Elle envoya aussitôt un eunuque auprès des Ismaélites pour leur demander de me lui vendre.


    3 Mais l’eunuque, ne voulant pas m’acheter, se retira après avoir sondé leurs intentions. Il informa sa maîtresse qu’ils demandaient un prix élevé pour le garçon.


    4 Alors elle envoya un autre eunuque en disant : « Même s’ils demandent deux mines[a], paie-les. N’épargne pas l’or. Achète seulement le garçon et amène-le-moi. »


    5 L’eunuque alla donc leur donner quatre-vingts pièces d’or[b] et m’emmena. Mais il dit à l’Égyptienne : « J’en ai donné cent. »


    6 Moi, je le savais, mais je gardai le silence afin que l’eunuque ne soit pas couvert de honte.'
  to: '**Testament de Joseph 16**


    1 Mais Memphis dit à son mari : « Achète ce jeune homme, car j’entends dire qu’ils le vendent. »


    2 Elle envoya aussitôt un eunuque auprès des Ismaélites, demandant qu’ils me lui vendent.


    3 Mais l’eunuque, ne voulant pas m’acheter, se retira après les avoir sondés et informa sa maîtresse qu’ils demandaient un prix élevé pour le garçon.


    4 Alors elle envoya un autre eunuque en disant : « Même s’ils demandent deux mines[a], paie-les. N’épargne pas l’or. Achète seulement le garçon et amène-le-moi. »


    5 L’eunuque vint donc, leur donna quatre-vingts pièces d’or[b] et m’emmena. Mais il dit à l’Égyptienne : « J’en ai donné cent. »


