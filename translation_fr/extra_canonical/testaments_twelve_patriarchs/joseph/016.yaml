  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: fr
  text: '**Testament de Joseph 16**


    1 Mais Memphis dit à son mari : « Achète ce jeune homme, car j’entends dire qu’ils le vendent. »


    2 Elle envoya aussitôt un eunuque auprès des Ismaélites, demandant qu’ils me lui vendent.


    3 Mais l’eunuque, ne voulant pas m’acheter, se retira après les avoir sondés et informa sa maîtresse qu’ils demandaient un prix élevé pour le garçon.


    4 Alors elle envoya un autre eunuque en disant : « Même s’ils demandent deux mines[a], paie-les. N’épargne pas l’or. Achète seulement le garçon et amène-le-moi. »


    5 L’eunuque vint donc, leur donna quatre-vingts pièces d’or[b] et m’emmena. Mais il dit à l’Égyptienne : « J’en ai donné cent. »


    6 Moi, le sachant, je gardai le silence afin que l’eunuque n’ait pas honte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mine était une unité antique de poids et de valeur monétaire. Sa valeur exacte variait selon les lieux et les époques.
    reason: cultural_note
  - marker: b
    text: Le grec dit littéralement « quatre-vingts [pièces] d’or », puis « cent » ; il ne précise pas la dénomination monétaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφὶς
  choice: Memphis
  rationale: Le grec présente ce terme comme le nom propre de la femme. La translittération « Memphis » le conserve sans l’identifier à la ville ni adopter une forme interprétative.
- source_word: νεανίαν / παιδός / παῖδα
  choice: jeune homme / garçon
  rationale: 'La variation française suit celle du grec : νεανίας désigne un jeune homme, tandis que παῖς peut désigner un garçon ou un jeune serviteur. « Garçon » reste naturel dans le récit de la vente sans atténuer son statut.'
- source_word: εὐνοῦχος
  choice: eunuque
  rationale: Le terme grec désigne explicitement un eunuque. Le rendre simplement par « fonctionnaire » effacerait une information présente dans la source.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: pour leur demander de me lui vendre
  rationale: La tournure concerne la conclusion de la vente de Joseph. Cette formulation explicite naturellement en français le sens commercial de διάπρασις.
- source_word: πειράσας αὐτούς
  choice: après avoir sondé leurs intentions
  rationale: Dans ce contexte de négociation, πειράζω évoque le fait de mettre les vendeurs à l’épreuve ou de les sonder, non une tentation morale.
- source_word: δεσποίνῃ
  choice: maîtresse
  rationale: Le mot marque l’autorité de la femme au sein de la maison et sa relation avec l’eunuque.
- source_word: πολλὴν τιμήν
  choice: un prix élevé
  rationale: Dans un contexte d’achat, τιμή désigne le prix demandé. La formulation française est directe et idiomatique.
- source_word: μνᾶς
  choice: mines
  rationale: La mine est une unité antique de poids et de valeur. Conserver le terme évite une conversion moderne incertaine.
- source_word: μὴ φείσασθε χρυσίου
  choice: N’épargne pas l’or
  rationale: Cette traduction garde l’image concrète et la force impérative du grec. Le singulier français s’accorde au destinataire individuel indiqué par la suite de l’ordre.
- source_word: χρυσοῦς
  choice: pièces d’or
  rationale: Le grec substantivé signifie littéralement des objets monétaires « d’or » sans préciser clairement la dénomination. « Pièces d’or » reste général.
- source_word: ἀνελάβετό με
  choice: m’emmena
  rationale: Dans le contexte de la transaction achevée, le verbe signifie que l’eunuque prit Joseph avec lui. « M’emmena » exprime naturellement le déplacement qui en résulte.
- source_word: ἐσιώπησα
  choice: je gardai le silence
  rationale: La formulation restitue le caractère volontaire et durable du silence de Joseph, dans un registre narratif digne.
- source_word: ἵνα μὴ αἰσχυνθῇ
  choice: afin que… ne soit pas couvert de honte
  rationale: Le passif grec peut exprimer le fait d’éprouver de la honte ou d’être déshonoré. Cette traduction conserve la dimension sociale et personnelle sans préciser davantage la cause.
theological_decisions:
- issue: Langage du statut de Joseph lors de la transaction
  choice: Conserver explicitement le vocabulaire d’achat, de vente, de prix et de prise en possession
  alternative: Atténuer la scène en parlant seulement d’entrée au service d’une maison
  rationale: Le grec décrit sans détour une vente humaine. L’atténuer introduirait une lecture étrangère au texte et masquerait la violence sociale de la scène.
- issue: Motif du silence de Joseph
  choice: Présenter son silence comme destiné à éviter la honte à l’eunuque
  alternative: Interpréter ce silence comme une approbation, un pardon explicite ou une obligation morale générale
  rationale: Le texte donne uniquement le but immédiat du silence. La traduction n’ajoute ni jugement moral explicite ni doctrine du pardon.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la tonalité testamentaire sans archaïsmes. Les paroles directes restent fermes et naturelles. Le vocabulaire commercial explicite du grec est conservé, et les unités ou dénominations incertaines ne sont pas converties en valeurs modernes.
