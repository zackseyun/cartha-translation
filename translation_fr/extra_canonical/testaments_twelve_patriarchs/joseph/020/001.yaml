  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: fr
  text: Car je sais qu’après ma mort, les Égyptiens vous opprimeront, mais Dieu vous rendra justice et vous conduira vers les promesses faites à vos pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψουσιν
  choice: opprimeront
  rationale: Le verbe exprime ici l’idée de faire subir détresse et oppression; « opprimeront » est naturel et précis dans ce contexte.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: vous rendra justice
  rationale: Cette tournure française restitue naturellement l’intervention de Dieu en faveur des destinataires sans suggérer qu’ils exercent eux-mêmes une vengeance.
- source_word: ἐπάξει
  choice: vous conduira
  rationale: Le verbe signifie amener ou conduire; aucun « retour » n’est explicité dans le grec.
- source_word: τὰς ἐπαγγελίας
  choice: ce qui a été promis
  rationale: Le pluriel grec désigne les promesses dans leur contenu ou leur accomplissement; cette formulation évite l’expression française peu naturelle « conduire dans les promesses ».
- source_word: τῶν πατέρων ὑμῶν
  choice: à vos pères
  rationale: Le génitif peut rattacher les promesses aux pères comme destinataires; « promis à vos pères » rend clairement ce rapport dans le contexte biblique.
theological_decisions:
- issue: Sens de ἐκδίκησις
  choice: Dieu vous rendra justice
  alternative: Dieu exercera votre vengeance
  rationale: Le choix conserve l’idée de justice vindicative et de défense divine tout en évitant une formulation française susceptible d’attribuer une vengeance personnelle aux destinataires.
- issue: Rapport entre les promesses et les pères
  choice: ce qui a été promis à vos pères
  alternative: les promesses de vos pères
  rationale: Le grec permet formellement « les promesses de vos pères », mais le contexte favorise les promesses divines faites aux ancêtres. La traduction explicite ce rapport sans ajouter de contenu confessionnel.
translation_notes:
  register: Français moderne, international et digne. La ponctuation en deux phrases allège la longue période grecque. Aucun marqueur de note n’est nécessaire.
