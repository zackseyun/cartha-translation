id: T12P.JOS.20.12
reference: Testament of Joseph 20:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: fr
  text: Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume au milieu de vous arrive à son terme, comme une cabane de gardien dans un verger[a], qui disparaît après l’été.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec présente ici, après «cabane de gardien dans un verger», un élément obscur ou altéré qui ne permet pas de traduction assurée.
    reason: Signaler honnêtement la difficulté textuelle représentée par ⌜γος⌉ sans introduire une conjecture dans le corps du texte.
lexical_decisions:
- source_word: βασιλεία
  choice: royaume
  rationale: «Royaume» rend naturellement le domaine et l’autorité royale dans les deux propositions tout en maintenant leur contraste.
- source_word: ἐπιτελεῖται
  choice: arrive à son terme
  rationale: Le présent grec exprime ici l’achèvement, avec une possible nuance de fin; cette formulation française préserve les deux aspects sans imposer un futur.
- source_word: ὀπωροφυλάκιον
  choice: cabane de gardien dans un verger
  rationale: Le mot composé désigne un abri de surveillance associé à un verger ou à une plantation fruitière; la périphrase est claire en français moderne.
- source_word: ἐξαφανίζεται
  choice: disparaît
  rationale: Le verbe indique que la cabane cesse d’être visible ou disparaît, plutôt qu’une simple absence d’apparition.
theological_decisions:
- issue: Contraste entre «son royaume» et «mon royaume»
  choice: Conserver distinctement les deux possessifs et le contraste introduit par «Mais»
  alternative: Harmoniser les deux mentions en les rapportant au même royaume
  rationale: Le grec oppose explicitement αὐτοῦ à ἐμὴ; cette tension doit rester visible sans identification interprétative.
- issue: Temporalité de l’achèvement du royaume de Joseph
  choice: 'Présent: «arrive à son terme»'
  alternative: 'Futur: «arrivera à son terme»'
  rationale: ἐπιτελεῖται est au présent. Le français peut conserver ce présent, même si le contexte pourrait autoriser une portée imminente ou prophétique.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de «royaume» reproduit le contraste rhétorique du grec. Le guillemet fermant est conservé puisque le verset clôt manifestement un discours commencé auparavant.
