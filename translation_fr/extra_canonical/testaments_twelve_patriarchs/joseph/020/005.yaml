  text: '*Ὑμεῖς δὲ¹⁰ συνανοίσετε¹¹ τὰ ὀστᾶ μου¹² μεθ᾽ ὑμῶν¹³, ⌜ὅτι, ἀναγομένων¹⁴ τῶν ὀστέων ἐκεῖ¹⁵, Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν¹⁶, καὶ ὁ¹⁷ Βελίαρ *ἐν σκότει ἔσται¹⁸ μετὰ τῶν Αἰγυπτίων⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: fr
  text: Vous emporterez mes os avec vous. Car, lorsque mes os auront été emportés là-bas, le Seigneur sera avec vous dans la lumière, et Béliar sera avec les Égyptiens dans les ténèbres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: vous emporterez avec vous
  rationale: Le verbe composé exprime l’action d’emporter en montant avec soi; cette tournure française conserve l’idée essentielle sans lourdeur.
- source_word: τὰ ὀστᾶ μου
  choice: mes os
  rationale: Équivalent direct et naturel du grec.
- source_word: ἐν φωτί
  choice: dans la lumière
  rationale: Rend littéralement l’image spatiale et symbolique du grec sans en préciser davantage la portée théologique.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Transcription française traditionnelle du nom propre grec, sans l’interpréter par «le diable» ou «le Malin».
- source_word: ἐν σκότει
  choice: dans les ténèbres
  rationale: Préserve le contraste explicite avec la lumière et le caractère symbolique de l’expression.
theological_decisions:
- issue: Nature de la présence du Seigneur et de Béliar
  choice: sera avec vous… sera avec les Égyptiens
  alternative: vous accompagnera… accompagnera les Égyptiens
  rationale: La formulation retenue suit étroitement ἔσται μετὰ et maintient le parallélisme ainsi que l’ambiguïté quant au mode de cette présence.
- issue: Portée de «là-bas»
  choice: là-bas
  alternative: jusque là-bas / vers ce lieu
  rationale: Le référent de ἐκεῖ n’est pas explicité dans ce seul verset; la traduction conserve donc cette dépendance au contexte au lieu de nommer une destination.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme lumière/ténèbres et la tension théologique du texte grec sont conservés sans explicitation confessionnelle.
