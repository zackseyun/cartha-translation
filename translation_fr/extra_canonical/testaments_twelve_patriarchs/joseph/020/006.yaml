base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/006.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: fr
  text: Après avoir dit ces choses, il étendit ses pieds et s’endormit d’un paisible sommeil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: Après avoir dit cela
  rationale: Rend naturellement en français le participe aoriste circonstanciel, qui indique une action antérieure.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: il étendit les jambes
  rationale: Dans cette scène de mort, l’expression désigne le geste de s’allonger en étendant les membres inférieurs; «les jambes» est plus naturel que le littéral «ses pieds» en français.
- source_word: ἐκοιμήθη
  choice: s’endormit
  rationale: Conserve l’image grecque du sommeil, employée ici comme manière digne d’évoquer la mort sans l’expliciter davantage.
- source_word: ὕπνῳ καλῷ
  choice: d’un doux sommeil
  rationale: «Doux» exprime ici la qualité paisible et favorable de καλός plus idiomatiquement que «beau sommeil».
theological_decisions:
- issue: Le sommeil comme image de la mort
  choice: s’endormit
  alternative: mourut
  rationale: Le grec maintient explicitement la métaphore du sommeil; la traduction la préserve afin de ne pas résoudre l’image par une explicitation interprétative.
translation_notes:
  register: Français moderne, simple et digne. La formulation reste proche du grec tout en évitant les tours peu idiomatiques «étendre ses pieds» et «un beau sommeil».
