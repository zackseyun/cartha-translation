  text: '*Ὑμεῖς δὲ¹⁰ συνανοίσετε¹¹ τὰ ὀστᾶ μου¹² μεθ᾽ ὑμῶν¹³, ⌜ὅτι, ἀναγομένων¹⁴ τῶν ὀστέων ἐκεῖ¹⁵, Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν¹⁶, καὶ ὁ¹⁷ Βελίαρ *ἐν σκότει ἔσται¹⁸ μετὰ τῶν Αἰγυπτίων⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: fr
  text: Mais vous emporterez mes os avec vous. Car lorsque mes os seront emportés de là, le Seigneur sera avec vous dans la lumière, et Béliar sera avec les Égyptiens dans les ténèbres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: vous emporterez… avec vous
  rationale: Le verbe composé exprime le fait de porter avec soi, dans le contexte du transfert futur des ossements de Joseph hors d’Égypte.
- source_word: ἀναγομένων
  choice: seront emportés là-haut
  rationale: Le participe passif évoque une montée ou un transport vers le haut, ici vraisemblablement depuis l’Égypte vers le pays promis; «là-haut» conserve cette orientation.
- source_word: ἐν φωτί
  choice: dans la lumière
  rationale: Traduction directe qui préserve la portée à la fois imagée et théologique de la lumière.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, sans l’interpréter par un équivalent tel que «le Malin».
- source_word: ἐν σκότει
  choice: dans les ténèbres
  rationale: Rend littéralement le contraste antithétique avec «dans la lumière» dans un registre français naturel et digne.
theological_decisions:
- issue: Nature de la présence du Seigneur et de Béliar
  choice: sera avec vous… sera avec les Égyptiens
  alternative: vous accompagnera… accompagnera les Égyptiens
  rationale: La formulation conserve le parallélisme du grec et ne précise pas davantage la manière dont cette présence doit être comprise.
- issue: Sens symbolique de la lumière et des ténèbres
  choice: dans la lumière / dans les ténèbres
  alternative: du côté de la lumière / dans l’obscurité
  rationale: La traduction littérale maintient l’ambiguïté entre circonstances visibles, domaine spirituel et condition morale ou eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de la phrase grecque est conservé, ainsi que l’opposition lumière/ténèbres et le nom propre Béliar.
