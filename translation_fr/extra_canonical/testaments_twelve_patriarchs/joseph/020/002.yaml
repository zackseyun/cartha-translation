    rationale: ἐκεῖ désigne simplement « là / là-bas »; l'idée de montée relève du participe ἀναγομένων. « Là-haut » ajoute une nuance spatiale qui n'est pas explicitement exprimée par l'adverbe et sonne moins naturel ici.
