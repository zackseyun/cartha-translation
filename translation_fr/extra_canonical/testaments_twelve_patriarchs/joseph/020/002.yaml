- from: Mais vous emporterez mes os avec vous. Car lorsque mes os seront emportés là-haut, le Seigneur sera avec vous dans la lumière, et Béliar sera avec les Égyptiens dans les ténèbres.
  to: Mais vous emporterez mes os avec vous. Car lorsque mes os seront emportés de là, le Seigneur sera avec vous dans la lumière, et Béliar sera avec les Égyptiens dans les ténèbres.
  rationale: La révision remplace seulement « là-haut » par « de là », afin de rendre l'adverbe ἐκεῖ sans lui attribuer une nuance directionnelle supplémentaire, tout en conservant l'idée de transport ascendant portée par « emportés » dans ce contexte.
