  source_fidelity: 'Le sens général et le parallélisme sont fidèlement rendus : l''ordre de transporter les ossements, la présence du Seigneur « dans la lumière » et celle de Béliar avec les Égyptiens « dans les ténèbres ». Toutefois, « là-haut » interprète et renforce ἐκεῖ (« là / là-bas ») en lui donnant une coloration directionnelle supplémentaire. Cette orientation est déjà portée par ἀναγομένων (« emportés vers le haut »).'
  naturalness: Le français est clair, moderne et de registre approprié. « De là » est plus idiomatique dans ce contexte de départ d'Égypte et évite la tournure légèrement lourde et interprétative « emportés là-haut ».
  terminology: « Seigneur », « Béliar », « lumière » et « ténèbres » sont justes et cohérents. Le nom Βελίαρ est correctement conservé sous la forme française traditionnelle « Béliar ».
