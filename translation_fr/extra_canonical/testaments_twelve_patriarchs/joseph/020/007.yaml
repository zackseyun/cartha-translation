lexical_decisions:
- source_word: ἐπένθησεν … πένθος μέγα
  choice: prirent … un grand deuil
  rationale: Cette tournure française naturelle conserve l’intensification sémitisante du verbe et du nom apparentés sans produire la lourdeur de « pleurèrent… d’un grand deuil ».
- source_word: αὐτόν
  choice: pour lui
  rationale: Avec « prendre le deuil », le complément français idiomatique « pour lui » exprime clairement que le défunt est l’objet du deuil.
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: tout Israël et toute l’Égypte
  rationale: Rend directement les deux collectivités personnifiées et répétées avec πᾶς/πᾶσα.
