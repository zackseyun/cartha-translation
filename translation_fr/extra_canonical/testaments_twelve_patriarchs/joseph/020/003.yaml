base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/003.yaml
  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: fr
  text: Amenez Aséneth, votre mère, [près de l’Hippodrome][a], et enterrez-la près de Rachel, ma mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « près de l’Hippodrome » sont textuellement incertains.
    reason: Les crochets de l’édition grecque signalent que cette expression n’est pas assurée dans la tradition manuscrite.
lexical_decisions:
- source_word: ἀγάγετε
  choice: Amenez
  rationale: L’impératif exprime l’ordre de conduire ou d’apporter Aséneth à l’endroit indiqué, sans préciser explicitement si elle est encore vivante ou déjà morte.
- source_word: παρὰ τὸν Ἱππόδρομον
  choice: près de l’Hippodrome
  rationale: Avec l’accusatif, παρά peut indiquer un mouvement vers un lieu situé à côté de l’Hippodrome; cette formulation respecte aussi la proximité exprimée par le contexte.
- source_word: πλησίον
  choice: près de
  rationale: Rend simplement la proximité spatiale demandée pour la sépulture.
- source_word: θάψατε
  choice: enterrez
  rationale: Équivalent naturel et direct de l’impératif grec désignant l’inhumation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « mère » est conservée parce qu’elle structure explicitement les deux liens familiaux dans le grec. Les crochets autour de l’expression incertaine sont maintenus, avec une note explicative.
