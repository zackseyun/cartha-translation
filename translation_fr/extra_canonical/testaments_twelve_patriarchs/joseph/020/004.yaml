  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/004.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: fr
  text: Après avoir dit cela, il étendit ses pieds et s’endormit d’un doux sommeil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: Après avoir dit cela
  rationale: Rend naturellement en français le participe aoriste circonstanciel tout en conservant l’antériorité de la parole.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: il étendit les pieds
  rationale: Traduction directe de l’expression grecque, sans ajouter une interprétation absente du texte.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: s’endormit d’un doux sommeil
  rationale: Préserve l’image explicite du sommeil et rend καλός de façon idiomatique; le contexte peut évoquer la mort, mais le grec ne dit pas directement «mourut» ni «dans une heureuse vieillesse».
theological_decisions:
- issue: Le sommeil comme possible euphémisme de la mort
  choice: Conserver «s’endormit»
  alternative: «mourut»
  rationale: Le verbe ἐκοιμήθη signifie littéralement «s’endormit» et peut euphémiser la mort; traduire directement par «mourut» supprimerait cette image et résoudrait une nuance que le texte laisse implicite.
translation_notes:
  register: Français moderne, sobre et digne. «D’un doux sommeil» est plus idiomatique que le calque «dans un bon sommeil», tout en maintenant le sens positif de καλῷ.
