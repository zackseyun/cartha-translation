source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ ἐν τῇ ἐξόδῳ τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου συνήγαγον τὰ ὀστᾶ Ἰωσήφ, καὶ ἔθαψαν αὐτὸν ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ· ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/008.yaml
  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: fr
  text: Lors de la sortie des fils d’Israël d’Égypte, ils rassemblèrent les ossements de Joseph et l’ensevelirent à Hébron avec ses pères[a]. Joseph vécut cent dix ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte « à Hébron ». D’autres traditions bibliques situent la sépulture de Joseph à Sichem (voir notamment Josué 24.32).
    reason: Signaler, à l’ancre du nom de lieu, la divergence historique sans modifier ni harmoniser le texte traduit.
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: Lors de la sortie
  rationale: Rend naturellement la circonstance temporelle du grec sans imposer le terme technique « exode ».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Conserve l’expression généalogique traditionnelle du texte grec.
- source_word: συνήγαγον τὰ ὀστᾶ Ἰωσήφ
  choice: ils emportèrent les ossements de Joseph
  rationale: Dans ce contexte funéraire et migratoire, « emportèrent » exprime idiomatiquement le rassemblement et le transport des restes.
- source_word: ἔθαψαν αὐτὸν
  choice: l’ensevelirent
  rationale: Le pronom masculin renvoie à Joseph considéré dans ses restes; cette formulation préserve cette référence personnelle.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Préserve la désignation ancestrale et l’idée d’une sépulture commune ou voisine.
- source_word: ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα
  choice: Joseph vécut cent dix ans
  rationale: Formulation française naturelle qui transmet exactement la durée de sa vie sans la répétition peu idiomatique de « années ».
theological_decisions:
- issue: Lieu de l’ensevelissement de Joseph
  choice: à Hébron
  alternative: à Sichem, selon Genèse 50.25, Exode 13.19 et Josué 24.32 dans la tradition biblique canonique
  rationale: La traduction suit le texte grec fourni et ne corrige pas sa donnée géographique à partir de récits parallèles.
translation_notes:
  register: Français moderne, digne et narratif. La syntaxe a été légèrement resserrée pour éviter la lourde répétition grecque finale, tout en conservant les détails historiques et la tension textuelle propre au lieu d’ensevelissement.
