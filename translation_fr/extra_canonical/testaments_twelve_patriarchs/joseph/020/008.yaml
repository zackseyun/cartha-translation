  source_fidelity: La traduction rend globalement le grec avec fidélité, y compris « Hébron », qu’il ne faut pas harmoniser avec les traditions parallèles. Toutefois, « emportèrent » exprime le transport mais omet la notion explicite de rassemblement/collecte de συνήγαγον.
