  text: Et tout Israël et toute l’Égypte observèrent un grand deuil pour lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπένθησεν … πένθος μέγα
  choice: portèrent son deuil avec une grande affliction
  rationale: La tournure grecque associe le verbe « prendre le deuil, pleurer » à son nom apparenté, littéralement « le pleurèrent d’un grand deuil ». La formulation française conserve à la fois l’idée du deuil et son intensité sans produire une répétition maladroite.
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: tout Israël et toute l’Égypte
  rationale: Rend directement la double totalité exprimée par πᾶς/πᾶσα et garde les désignations collectives du grec.
- source_word: αὐτόν
  choice: son
  rationale: Dans l’expression française « porter le deuil de quelqu’un », le pronom grec désignant le défunt se rend naturellement par le possessif « son ».
