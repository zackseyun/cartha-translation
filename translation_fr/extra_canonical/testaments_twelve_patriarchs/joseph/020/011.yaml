review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement βασιλεία, αἰώνιος, παρελεύσεται, ἐν ὑμῖν et l’image de l’ὀπωροφυλάκιον. Toutefois, ἐπιτελεῖται est au présent (« s’achève / est en voie d’achèvement »), tandis que « arrivera à son terme » le reporte sans nécessité au futur. La comparaison évoque bien une disparition ultérieure, mais ne justifie pas à elle seule ce changement de temps.
  naturalness: Le français est clair et d’un registre approprié. « Cabane de garde dans un verger » est compréhensible et rend bien l’abri saisonnier destiné à surveiller les fruits. « S’achève » est à la fois plus direct, plus idiomatique et plus proche de la forme verbale grecque.
  terminology: « Royaume », « éternel », « parmi vous » et « cabane de garde » sont des choix solides. Le contraste possessif entre « son royaume » et « mon royaume » est correctement maintenu sans identification interprétative du référent de « son ».
  issues:
  - severity: medium
    issue: Le temps de ἐπιτελεῖται n’est pas conservé.
    rationale: Le grec porte un présent passif, ἐπιτελεῖται. « Arrivera à son terme » emploie un futur. « S’achève » conserve le présent et l’idée d’achèvement, tout en laissant à l’image suivante sa fonction d’expliciter le caractère transitoire du royaume de Joseph.
  revised_text: Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume parmi vous s’achève, comme une cabane de garde dans un verger disparaît après l’été.
