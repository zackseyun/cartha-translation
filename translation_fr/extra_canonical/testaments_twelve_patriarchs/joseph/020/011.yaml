- from: Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume parmi vous arrivera à son terme, comme une cabane de garde dans un verger, qui disparaît après l’été.
  to: Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume parmi vous s’achève, comme une cabane de garde dans un verger disparaît après l’été.
  rationale: La seule correction nécessaire consiste à rendre ἐπιτελεῖται au présent par « s’achève ». Le reste du texte conserve avec justesse l’opposition, l’ambiguïté référentielle et l’image agricole du grec, sans ajout doctrinal ni note nécessaire.
