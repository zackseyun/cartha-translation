source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: fr
  text: Car son royaume sera un royaume éternel, qui ne passera pas. Mais mon royaume parmi vous s’achève, comme une cabane de garde dans un verger disparaît après l’été.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: royaume
  rationale: Le contexte oppose le règne durable du personnage annoncé au royaume de Joseph parmi ses descendants ; « royaume » conserve cette dimension collective et historique.
- source_word: αἰώνιος
  choice: éternel
  rationale: Équivalent naturel de l’adjectif grec, renforcé ici par la proposition « qui ne passera pas ».
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans ce contexte collectif, l’expression désigne le royaume établi au milieu des destinataires plutôt qu’une réalité intérieure.
- source_word: ἐπιτελεῖται
  choice: arrivera à son terme
  rationale: Cette formulation rend l’idée d’achèvement avec, dans le contexte de la comparaison suivante, la nuance de fin, sans la réduire simplement à une destruction.
- source_word: ὀπωροφυλάκιον
  choice: cabane de garde dans un verger
  rationale: Le terme désigne un abri ou poste de guet lié à la garde des fruits ; la formulation française explicite naturellement sa fonction.
- source_word: ἐξαφανίζεται
  choice: disparaît
  rationale: Rend directement la disparition de l’abri saisonnier après l’été.
theological_decisions:
- issue: Contraste entre « son royaume » et « mon royaume »
  choice: Conserver explicitement l’opposition possessive
  alternative: Identifier ou expliquer dans le corps du texte le titulaire du premier royaume
  rationale: Le verset grec maintient le référent de αὐτοῦ dans son contexte antérieur ; la traduction ne doit pas ajouter ici une identification doctrinale absente de cette phrase.
- issue: Sens de ἐπιτελεῖται appliqué au royaume de Joseph
  choice: « arrivera à son terme »
  alternative: « sera mené à son accomplissement »
  rationale: La comparaison avec la cabane qui disparaît indique vraisemblablement une fin temporelle. Le choix préserve toutefois la notion grecque d’achèvement plutôt que d’introduire explicitement l’abolition.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe parallèle et l’image agricole sont conservées. Aucun marqueur de note n’est requis.
