source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: fr
  text: Après avoir dit cela, il étendit les jambes et s’endormit d’un doux sommeil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’endormit d’un bon [ou beau] sommeil ». Dans ce contexte, l’expression évoque sa mort tout en conservant l’image du sommeil.'
    reason: La note rend compte de la formulation grecque inhabituelle et de son sens contextuel, sans introduire « mourut » ou « éternel » dans le texte.
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: s’endormit
  rationale: Le verbe signifie littéralement « s’endormir » et peut, dans ce contexte, évoquer la mort sans que la traduction l’explicite.
- source_word: ὕπνῳ καλῷ
  choice: d’un sommeil paisible
  rationale: Littéralement « d’un bon/beau sommeil ». « Sommeil paisible » rend naturellement en français la valeur positive de καλῷ sans introduire l’idée d’un sommeil « éternel », absente du grec.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: il étendit les jambes
  rationale: En français courant, « étendre les jambes » exprime plus naturellement le geste que le calque « étendre ses pieds ».
theological_decisions:
- issue: Le sommeil comme évocation de la mort
  choice: Conserver l’image « s’endormit » sans ajouter « éternel » ni « mourut »
  alternative: « mourut » ou « s’endormit du sommeil éternel »
  rationale: Le contexte peut faire du sommeil un euphémisme de la mort, mais le grec maintient l’image du sommeil et ne contient aucun équivalent d’« éternel ».
translation_notes:
  register: Français moderne, simple et digne. La phrase conserve l’image poétique du sommeil tout en évitant le calque peu naturel « beau sommeil » dans le texte principal.
