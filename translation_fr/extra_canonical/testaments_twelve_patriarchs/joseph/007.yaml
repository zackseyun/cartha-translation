  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: fr
  text: '7. Afin que tu saches que la méchanceté des impies ne l’emportera pas sur ceux qui révèrent Dieu dans la maîtrise de soi, regarde : j’en ai pris et j’en ai mangé devant toi.[a] Après avoir dit cela, j’ai déclaré : « Le Dieu de mes pères et l’ange d’Abraham seront avec moi. » Puis j’ai mangé.


    8. Quand elle vit cela, elle tomba face contre terre à mes pieds en pleurant. Je la relevai et lui adressai des avertissements.


    9. Elle convint avec moi de ne plus commettre cette impiété. Pourtant, son cœur restait tourné vers le mal, et elle cherchait de tous côtés comment me prendre au piège. Elle gémissait et s’effondrait soudain, bien qu’elle ne soit pas malade.[b]


    10. Quand son mari la vit, il lui demanda : « Qu’est-il arrivé à ton visage ? » Elle lui répondit : « Je souffre d’une douleur au cœur, et les gémissements de mon esprit m’oppressent. » Alors il chercha à la soulager par des paroles.


    11. Puis, ayant trouvé une occasion, elle se précipita vers moi tandis que son mari était encore dehors et me dit : « J’étouffe ! Je vais me jeter du haut d’un escarpement si tu ne t’unis pas à moi. »[c]


    12. Mais moi, comprenant que l’esprit de Béliar la tourmentait, je priai le Seigneur et lui dis :


    13. « Pourquoi, malheureuse, te laisses-tu troubler et bouleverser, aveuglée par tes péchés ? Souviens-toi que, si tu te donnes la mort, Astho, la concubine de ton mari et ta rivale, frappera tes enfants, et tu feras disparaître de la terre ton souvenir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette phrase est abrupt et sa transmission présente des difficultés ; il peut aussi se comprendre, plus littéralement : « regarde : en en prenant, mangeant devant toi ».'
    reason: Signaler une construction grecque incertaine sans imposer une reconstruction unique.
  - marker: b
    text: La formulation grecque traduite par « s’effondrait soudain » est textuellement incertaine.
    reason: Le passage est marqué comme corrompu ou douteux dans l’édition source.
  - marker: c
    text: « Tu ne t’unis pas à moi » est une manière indirecte de demander une relation sexuelle.
    reason: Clarifier l’euphémisme grec tout en le conservant dans le texte principal.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: maîtrise de soi
  rationale: Le terme désigne la retenue, la modération et notamment la chasteté dans ce contexte; « maîtrise de soi » reste naturel sans réduire le sens à la seule conduite sexuelle.
- source_word: θεοσεβούντων
  choice: ceux qui révèrent Dieu
  rationale: Rend explicitement l’idée de respect religieux et de piété envers Dieu, sans vocabulaire confessionnel marqué.
- source_word: κατισχύσει
  choice: ne l’emportera pas sur
  rationale: Exprime l’idée de prévaloir ou de triompher contre quelqu’un.
- source_word: ἐνουθέτησα
  choice: lui adressai des avertissements
  rationale: Le verbe signifie reprendre, avertir ou exhorter; cette formulation convient au contexte où Joseph cherche à détourner la femme de son projet.
- source_word: παγιδεύσῃ
  choice: me prendre au piège
  rationale: Équivalent idiomatique direct de l’image du piège.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: tu ne t’unis pas à moi
  rationale: Préserve l’euphémisme relationnel et sexuel du grec sans le rendre plus explicite que la source.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: l’esprit de Béliar
  rationale: Translittération traditionnelle d’un nom propre désignant ici une puissance mauvaise; la traduction ne précise pas davantage sa nature.
- source_word: κονδυλίσει
  choice: frappera
  rationale: Le verbe évoque des coups, notamment portés avec le poing; « frappera » est clair et n’ajoute pas un degré de violence absent du terme.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου
  choice: tu feras disparaître… jusqu’à ton souvenir
  rationale: Conserve la conséquence formulée à la deuxième personne et l’idée d’effacement de la mémoire laissée sur terre.
theological_decisions:
- issue: Rapport entre piété, maîtrise de soi et protection contre le mal
  choice: « ceux qui révèrent Dieu dans la maîtrise de soi »
  alternative: « ceux qui craignent Dieu grâce à leur chasteté »
  rationale: Le grec associe la révérence envers Dieu à la σωφροσύνη sans définir un mécanisme causal ni limiter explicitement cette vertu à la chasteté.
- issue: Identité et action de « l’esprit de Béliar »
  choice: Conserver littéralement « l’esprit de Béliar la tourmentait »
  alternative: Interpréter comme une possession démoniaque ou comme une simple inclination morale
  rationale: La source attribue le trouble à cet esprit, mais ne tranche pas ici la nature précise de son action; la traduction maintient cette tension.
- issue: « l’ange d’Abraham »
  choice: Conserver l’expression telle quelle
  alternative: « l’ange qui protégeait Abraham » ou identification à une figure particulière
  rationale: Le génitif grec est concis et potentiellement ouvert; aucune identification doctrinale ne doit être ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit conserve ses répétitions significatives et ses formulations religieuses anciennes, tout en employant une syntaxe française naturelle. Les ambiguïtés textuelles ou euphémiques sont maintenues dans le corps du texte et précisées seulement en note.
