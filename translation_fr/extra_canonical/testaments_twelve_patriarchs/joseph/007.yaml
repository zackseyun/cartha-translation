  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « Face contre terre », « prendre au piège » et « se jeter du haut d’un escarpement » sont naturels. La correction au v. 13 améliore aussi la sobriété de la formulation.
  terminology: Les choix « maîtrise de soi », « révèrent Dieu », « impiété », « Seigneur », « Béliar » et « concubine » conviennent au contexte et ne surinterprètent pas le texte. « S’unir à moi » préserve adéquatement l’euphémisme grec, avec une note explicative justifiée.
