lexical_decisions:
- source_word: Ὁρᾶτε οὖν
  choice: Voyez donc
  rationale: Conserve l’impératif et la valeur conclusive de οὖν dans une formulation française naturelle.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse affectueuse et familiale.
- source_word: πόσα ὑπέμεινα
  choice: tout ce que j’ai enduré
  rationale: πόσα exprime ici l’ampleur des épreuves, tandis que ὑπέμεινα indique le fait de les avoir supportées avec persévérance.
- source_word: ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου
  choice: afin de ne pas couvrir mes frères de honte
  rationale: 'Exprime clairement la finalité introduite par ἵνα μή et le sens causatif de αἰσχύνω : faire honte à quelqu’un ou l’exposer à la honte.'
