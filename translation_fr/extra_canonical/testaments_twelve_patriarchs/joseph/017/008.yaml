source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ οὐχ ὕψωσα ἐμαυτὸν³⁹ ἐν αὐτοῖς ⌜ἐν ἀλαζονείᾳ⌉, διὰ τὴν ⌜κοσμικήν⌉ μου δόξαν⁴⁰, ⌜ἀλλ᾿⁴¹ ἤμην ἐν αὐτοῖς ὡς εἷς τῶν ἐλαχίστων⁴².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/008.yaml
  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: fr
  text: Et je ne me suis pas élevé parmi eux avec arrogance à cause de ma gloire terrestre, mais j’étais parmi eux comme l’un des plus petits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕψωσα ἐμαυτόν
  choice: je ne me suis pas élevé … au-dessus d’eux
  rationale: Rend l’idée de s’exalter ou de se placer au-dessus des autres, dans un français naturel.
- source_word: ἐν ἀλαζονείᾳ
  choice: avec arrogance
  rationale: Exprime directement l’orgueil présomptueux désigné par ἀλαζονεία.
- source_word: κοσμικήν μου δόξαν
  choice: ma gloire dans ce monde
  rationale: Restitue l’idée d’une gloire terrestre ou mondaine sans la connotation moderne parfois exclusivement morale de « mondaine ».
- source_word: ἤμην ἐν αὐτοῖς
  choice: j’ai vécu parmi eux
  rationale: Dans ce contexte, rend naturellement la présence et la conduite durables exprimées par l’imparfait de εἰμί.
- source_word: ὡς εἷς τῶν ἐλαχίστων
  choice: comme l’un des plus petits
  rationale: Conserve le superlatif substantivé et son idée de rang humble, sans préciser arbitrairement « le moindre ».
theological_decisions:
- issue: Nature de la « gloire » de Joseph
  choice: gloire dans ce monde
  alternative: gloire mondaine
  rationale: La formulation retenue préserve l’opposition entre statut terrestre et humilité sans suggérer nécessairement une gloire moralement condamnable.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le contraste net du grec entre le haut rang de Joseph et sa conduite humble.
