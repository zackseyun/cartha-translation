  text: And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure.
translation:
  language: fr
  text: Après la mort de Jacob, mon père, je les ai aimés plus encore, et je faisais pour eux, bien au-delà de toute mesure, tout ce qu’ils désiraient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσοτέρως
  choice: plus encore
  rationale: Rend naturellement le comparatif intensif portant sur l’amour, sans ajouter une comparaison absente du contexte immédiat.
- source_word: ἤθελον
  choice: désiraient
  rationale: Exprime ici ce qu’ils voulaient ou souhaitaient, dans un registre digne et courant.
- source_word: ὑπερεκπερισσοῦ
  choice: bien au-delà de toute mesure
  rationale: Conserve la très forte intensification de l’expression grecque, qui souligne le caractère surabondant de ce que Joseph faisait pour eux.
- source_word: ἐποίουν αὐτοῖς
  choice: je faisais pour eux
  rationale: Suit la valeur imperfective du verbe et rend clairement le bénéficiaire indiqué par le datif.
