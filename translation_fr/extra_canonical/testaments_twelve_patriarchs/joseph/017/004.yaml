  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: fr
  text: Quand mes frères vinrent en Égypte, ils savent eux-mêmes que je leur ai rendu leur argent, que je ne leur ai adressé aucun reproche et que je les ai encouragés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον αὐτοῖς
  choice: je leur ai rendu leur argent
  rationale: « Rendre » exprime naturellement le retour de la somme à ses détenteurs, tandis qu’« argent » conserve le sens courant de ἀργύριον dans ce contexte.
- source_word: οὐκ ὠνείδισα αὐτούς
  choice: je ne leur ai adressé aucun reproche
  rationale: Cette formulation française claire restitue le fait de ne pas blâmer ni couvrir de reproches.
- source_word: παρεκάλεσα αὐτούς
  choice: je les ai encouragés
  rationale: παρακαλέω peut signifier exhorter, encourager ou consoler ; « encouragés » convient au contexte tout en évitant une précision affective non explicitée.
