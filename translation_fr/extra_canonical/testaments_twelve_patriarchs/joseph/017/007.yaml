review_pass:
  verdict: revise
  source_fidelity: La structure parallèle et les termes principaux sont fidèlement rendus. Toutefois, δοῦλοι désigne ici des « esclaves » plutôt que de simples « serviteurs » ; la comparaison ὡς n’atténue pas le statut exprimé par le nom.
  naturalness: Le français est naturel, lisible et conserve efficacement le parallélisme solennel. « Comme leurs esclaves » est à la fois idiomatique et plus direct que « pour eux comme des serviteurs ».
  terminology: « Âme », « douleur », « faiblesse », « maladie » et « dessein » rendent convenablement ψυχή, ἄλγημα, μαλακία/ἀσθένεια et βουλή. Le singulier collectif de « leur âme » respecte le singulier ψυχή transmis, malgré l’antécédent pluriel.
  issues:
