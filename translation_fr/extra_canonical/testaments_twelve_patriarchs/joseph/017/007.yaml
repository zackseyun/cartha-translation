base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as servants to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: fr
  text: Et leurs fils étaient mes fils, et mes fils étaient comme leurs esclaves ; leur âme était mon âme, chacune de leurs douleurs était ma douleur, chacune de leurs faiblesses était ma maladie, et leur dessein était mon dessein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: serviteurs
  rationale: Rend le statut de subordination exprimé par le grec tout en restant naturel dans ce contexte familial ; « esclaves » serait possible, mais plus dur et moins adapté à la comparaison introduite par ὡς.
- source_word: ψυχή
  choice: âme
  rationale: Conserve le terme anthropologique et affectif du grec sans le réduire à « vie » ou à « personne ».
- source_word: ἄλγημα
  choice: douleur
  rationale: Équivalent courant qui exprime une souffrance ressentie, physique ou morale.
- source_word: μαλακία / ἀσθένεια
  choice: faiblesse / maladie
  rationale: Préserve la variation lexicale du texte grec entre leur faiblesse et la maladie que Joseph fait sienne.
- source_word: βουλή
  choice: dessein
  rationale: Exprime un projet ou une intention délibérée ; le mot reste assez large pour ne pas trancher entre conseil, résolution et projet.
theological_decisions:
- issue: Solidarité exprimée par ψυχή
  choice: « leur âme était mon âme »
  alternative: « leurs âmes étaient mon âme »
  rationale: Le texte grec transmis porte le singulier ψυχή de part et d’autre. La traduction conserve cette formulation collective et sa tension grammaticale plutôt que d’introduire un pluriel absent du texte cité.
translation_notes:
  register: Français moderne, digne et lisible. Le parallélisme répétitif du grec est conservé, avec une ponctuation qui rend la longue série naturelle. « Pour eux comme des serviteurs » évite l’ambiguïté possible de « leurs serviteurs » tout en respectant ὡς δοῦλοι αὐτῶν.
