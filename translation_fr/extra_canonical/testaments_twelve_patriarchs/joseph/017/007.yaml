    issue: δοῦλοι est traduit par « serviteurs ».
    rationale: Dans l’usage grec, δοῦλος renvoie normalement à l’esclave, à une personne en condition de servitude, et non au terme plus large et moins contraignant « serviteur ». Le contexte comparatif ne justifie pas d’affaiblir ce sens.
