  text: Τέρπεται γὰρ⁸ ὁ θεὸς⁷ ⌜ἐπὶ⌉ *ὁμονοίᾳ ἀδελφῶν⁸ καὶ⁷ ἐπὶ προαιρέσει καρδίας⁹ ⌜ἀγαθῆς⌉¹⁰ †εὐδοκοῦσιν¹¹ εἰς ἀγαθόν¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: fr
  text: Car Dieu prend plaisir à l’entente entre frères et à la bonne intention du cœur ; elles sont agréables en vue du bien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque de la dernière proposition est incertaine ; on pourrait aussi comprendre : « elles trouvent leur satisfaction dans le bien » ou « elles contribuent au bien ».'
    reason: Le verbe εὐδοκοῦσιν est signalé comme textuellement problématique dans l’édition, et son sujet ainsi que son rapport avec εἰς ἀγαθόν restent ambigus.
lexical_decisions:
- source_word: ὁμονοίᾳ
  choice: entente
  rationale: Rend l’accord profond et la concorde entre frères dans un français naturel, sans suggérer une uniformité absolue.
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: bonne intention du cœur
  rationale: Exprime la disposition volontaire ou le dessein intérieur. Cette formulation suit la lecture contextuelle de ἀγαθῆς avec l’ensemble de l’expression, tout en restant proche de sa structure.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: elles sont agréables en vue du bien
  rationale: Conserve le pluriel grec, qui semble reprendre l’entente et la bonne intention, ainsi que l’orientation exprimée par εἰς ἀγαθόν, sans transformer celle-ci en résultat certain.
theological_decisions:
- issue: Référent implicite de « agréables »
  choice: Ne pas ajouter explicitement « à Dieu » dans le texte
  alternative: « elles sont agréables à Dieu et conduisent au bien »
  rationale: Le contexte permet de comprendre que ces réalités plaisent à Dieu, mais le grec ne répète pas de complément et la fin du verset présente une difficulté textuelle. La traduction évite donc d’expliciter davantage que la source.
- issue: Valeur de εἰς ἀγαθόν
  choice: « en vue du bien »
  alternative: « pour le bien » ou « conduisent au bien »
  rationale: « En vue du bien » préserve la nuance d’orientation ou de finalité de εἰς, sans imposer une relation causale absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Entente entre frères » est idiomatique et conserve la dimension fraternelle ; la dernière proposition demeure volontairement proche et légèrement ouverte en raison de l’incertitude du grec.
