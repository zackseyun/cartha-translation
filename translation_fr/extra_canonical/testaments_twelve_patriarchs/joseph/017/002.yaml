source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: fr
  text: Ainsi donc, vous aussi, aimez-vous les uns les autres et, avec patience, couvrez les faiblesses les uns des autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: Rend directement le commandement réciproque dans un français naturel et digne.
- source_word: ἐν μακροθυμίᾳ
  choice: avec patience
  rationale: Dans ce contexte relationnel, « patience » exprime clairement l’endurance et la maîtrise de soi envers autrui.
- source_word: συγκρύπτετε
  choice: couvrez
  rationale: Conserve l’image grecque de dissimulation bienveillante sans préciser indûment s’il s’agit de cacher, de pardonner ou de ne pas divulguer.
- source_word: τὰ ἐλαττώματα
  choice: les faiblesses
  rationale: Désigne les insuffisances ou défauts d’autrui sans donner au terme une portée morale plus forte que ne l’exige le grec.
theological_decisions:
- issue: Portée de « couvrez »
  choice: Maintien de la métaphore « couvrez »
  alternative: « ne dévoilez pas » ou « passez sur »
  rationale: Le grec invite à dissimuler les faiblesses d’autrui, mais ne dit pas explicitement qu’il faut les pardonner ni les excuser; la métaphore préserve cette tension.
translation_notes:
  register: Français international moderne, exhortatif et digne. La structure coordonnée et la réciprocité du grec sont conservées sans lourdeur.
