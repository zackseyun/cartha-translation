base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: fr
  text: Et je ne les ai pas laissés souffrir, même pour la plus petite chose ; et même, je leur ai donné tout ce qui était entre mes mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀφῆκα αὐτοὺς θλιβῆναι
  choice: je ne les ai pas laissés souffrir
  rationale: Rend naturellement la construction avec ἀφίημι et l’infinitif passif de θλίβω, sans préciser indûment la nature de la détresse.
- source_word: ἕως μικροῦ πράγματος
  choice: même pour la plus petite chose
  rationale: L’expression grecque est inhabituelle ; cette formulation suit le sens contextuel probable et conserve l’idée d’une sollicitude jusque dans les moindres affaires.
- source_word: καίγε
  choice: bien plus
  rationale: Exprime la valeur emphatique et additive de la particule, plutôt qu’un contraste.
- source_word: πᾶν ὃ ἦν ἐν τῇ χειρί μου
  choice: tout ce qui était entre mes mains
  rationale: Conserve l’image sémitisante de ce qui se trouve sous la main ou à la disposition du locuteur, dans une tournure française idiomatique.
- source_word: αὐτοῖς δέδωκα
  choice: je leur ai donné
  rationale: Le passé composé rend naturellement en français l’accompli du parfait grec dans ce récit.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche du grec tout en évitant un calque obscur ; aucune précision théologique ou interprétative étrangère au verset n’est ajoutée.
