base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: fr
  text: '1. Voyez donc, mes enfants, tout ce que peuvent accomplir la persévérance et la prière accompagnée du jeûne.


    2. Vous aussi, si vous recherchez la maîtrise de soi et la pureté avec persévérance, dans la prière accompagnée du jeûne et dans l’humilité du cœur, le Seigneur habitera en vous, car il aime la maîtrise de soi.


    3. Là où habite le Très-Haut, même si l’envie, l’esclavage ou la calomnie[a] s’abat sur quelqu’un, le Seigneur, qui habite en lui à cause de sa maîtrise de soi, non seulement le délivre de ces maux, mais encore l’élève et le glorifie, comme il l’a fait pour moi.


    4. En effet, toute personne se manifeste, que ce soit par ses actes, ses paroles ou ses pensées[b].


    5. Mes frères savaient combien mon père m’aimait, mais je ne m’enorgueillissais pas intérieurement. Bien que je ne sois encore qu’un enfant, j’avais dans le cœur la crainte de Dieu, car je savais que tout passerait.


    6. Je ne me suis pas enorgueilli dans le mal[c] ; au contraire, j’honorais mes frères. Par crainte d’eux, lorsqu’on me vendait, j’ai gardé le silence et n’ai pas dit aux Ismaélites que j’étais fils de Jacob, un homme grand et juste[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « victime d’une fausse accusation » ; le terme grec peut désigner une accusation mensongère ou montée de toutes pièces, comme celle dont Joseph fut victime en Égypte.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec de cette phrase est difficile et paraît avoir été altéré. Littéralement, le verbe conservé signifie « se réunit » ou « converge » ; le contexte semble indiquer qu’une personne se révèle ou se fait reconnaître dans chacun de ces domaines : actes, paroles et pensées.'
    reason: textual_variant
  - marker: c
    text: 'Le texte grec de cette proposition est incertain. La formulation conservée peut se comprendre littéralement : « Je ne me suis pas enorgueilli dans le mal » ; son sens précis demeure discuté.'
    reason: textual_variant
  - marker: d
    text: Certains témoins présentent des différences dans cette proposition, mais le sens général est que Joseph garda le silence sur son identité familiale pendant qu’on le vendait.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπομονή
  choice: persévérance
  rationale: Dans cette exhortation, le mot désigne la constance qui tient ferme dans l’épreuve. « Persévérance » est naturel en français et exprime mieux une disposition durable que le simple fait de supporter.
- source_word: προσευχή μετὰ νηστείας
  choice: prière accompagnée du jeûne
  rationale: La préposition μετά exprime ici l’accompagnement. Cette formulation conserve le lien entre les deux pratiques sans les confondre.
- source_word: σωφροσύνη
  choice: maîtrise de soi
  rationale: Le terme englobe la retenue sexuelle, particulièrement pertinente dans l’histoire de Joseph, mais aussi une discipline morale plus large. Son association avec « pureté » maintient ces deux dimensions.
- source_word: ἁγνεία
  choice: pureté
  rationale: Le terme évoque ici la pureté morale, notamment sexuelle, sans se limiter exclusivement à la chasteté.
- source_word: ταπείνωσις καρδίας
  choice: humilité du cœur
  rationale: Cette expression conserve l’accent biblique sur la disposition intérieure tout en restant claire en français moderne.
- source_word: κατοικέω
  choice: habiter
  rationale: Le verbe exprime directement la présence durable du Seigneur sans préciser davantage la nature de cette présence.
- source_word: ὁ ὕψιστος
  choice: le Très-Haut
  rationale: C’est le titre divin consacré et naturel en français biblique.
- source_word: φθόνος
  choice: envie
  rationale: Le terme renvoie à l’hostilité jalouse qui motive les frères de Joseph.
- source_word: δουλεία
  choice: être réduit en esclavage
  rationale: Le contexte concerne l’asservissement réel de Joseph. La tournure verbale s’intègre naturellement à la série des épreuves.
- source_word: συκοφαντία
  choice: calomnie
  rationale: Le mot désigne une accusation malveillante et mensongère, en écho à l’expérience de Joseph en Égypte.
- source_word: ῥύεται
  choice: délivre
  rationale: Le verbe exprime le fait d’arracher quelqu’un au danger ou au mal. « Délivre » convient au registre biblique sans être archaïque.
- source_word: ὑψοῖ καὶ δοξάζει
  choice: élève et glorifie
  rationale: Les deux verbes sont conservés distinctement afin de respecter la progression rhétorique du grec.
- source_word: δίκαιος
  choice: juste
  rationale: Le grec qualifie Jacob de juste, et non de puissant. « Juste » préserve l’évaluation morale explicite du texte source.
theological_decisions:
- issue: Présence divine exprimée par κατοικήσει / κατοικεῖ
  choice: Traduire directement que le Seigneur « habitera en vous » et que le Très-Haut « habite » là où se trouve la personne fidèle.
  alternative: Réduire l’expression à la faveur, à l’assistance ou à la protection divine.
  rationale: Le grec emploie un langage fort de demeure divine. La traduction le maintient sans lui imposer une définition doctrinale ultérieure.
- issue: Portée morale de σωφροσύνη
  choice: Employer « maîtrise de soi ».
  alternative: Employer « chasteté » ou « tempérance ».
  rationale: Le contexte met fortement en jeu la retenue sexuelle, mais le terme grec décrit une discipline de soi plus vaste. La proximité de « pureté » conserve la dimension sexuelle sans rétrécir le sens.
- issue: Lien entre conduite humaine et délivrance divine
  choice: Conserver « à cause de sa maîtrise de soi » comme motivation formulée par le texte.
  alternative: Reformuler pour éviter toute apparence de mérite humain.
  rationale: Le passage établit lui-même ce lien exhortatif. Il convient de préserver cette tension théologique plutôt que de la résoudre selon un cadre doctrinal extérieur.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est évité au profit de formulations naturelles avec « vous ». Le registre biblique est conservé dans « le Très-Haut », « crainte de Dieu », « délivre » et « glorifie », sans tournures inutilement archaïques. Les difficultés textuelles des versets 4 et 6 sont signalées plutôt que masquées.
