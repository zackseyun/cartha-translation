    6. Je ne me suis pas laissé entraîner au mal[c] ; au contraire, j’honorais mes frères. Par crainte d’eux, lorsqu’on me vendait, j’ai gardé le silence et n’ai pas dit aux Ismaélites que j’étais fils de Jacob, un homme grand et juste[d].'
  to: '1. Voyez donc, mes enfants, tout ce que peuvent accomplir la persévérance et la prière accompagnée du jeûne.


    2. Vous aussi, si vous recherchez la maîtrise de soi et la pureté avec persévérance, dans la prière accompagnée du jeûne et dans l’humilité du cœur, le Seigneur habitera en vous, car il aime la maîtrise de soi.


    3. Là où habite le Très-Haut, même si l’envie, l’esclavage ou la calomnie[a] s’abat sur quelqu’un, le Seigneur, qui habite en lui à cause de sa maîtrise de soi, non seulement le délivre de ces maux, mais encore l’élève et le glorifie, comme il l’a fait pour moi.


    4. En effet, toute personne se manifeste, que ce soit par ses actes, ses paroles ou ses pensées[b].


    5. Mes frères savaient combien mon père m’aimait, mais je ne m’enorgueillissais pas intérieurement. Bien que je ne sois encore qu’un enfant, j’avais dans le cœur la crainte de Dieu, car je savais que tout passerait.


    6. Je ne me suis pas enorgueilli dans le mal[c] ; au contraire, j’honorais mes frères. Par crainte d’eux, lorsqu’on me vendait, j’ai gardé le silence et n’ai pas dit aux Ismaélites que j’étais fils de Jacob, un homme grand et juste[d].'
  rationale: La révision corrige principalement le v. 6 afin de ne pas substituer au vocabulaire grec d’élévation ou d’orgueil l’idée distincte d’être entraîné au mal. Elle harmonise aussi la série du v. 3 avec la syntaxe nominale du grec. Les autres choix du projet sont conservés, y compris le traitement prudent des passages textuellement difficiles aux vv. 4 et 6.
