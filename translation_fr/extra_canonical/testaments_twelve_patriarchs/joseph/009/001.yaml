base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: fr
  text: Pendant que j’étais dans les chaînes, l’Égyptienne était accablée de chagrin. Lorsqu’elle venait, elle m’écoutait rendre grâce au Seigneur et chanter des hymnes dans la demeure des ténèbres, et elle m’écoutait me réjouir d’une voix joyeuse en glorifiant mon Dieu, parce que, grâce à un prétexte, j’avais été délivré de l’Égyptienne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: dans les chaînes
  rationale: Rend concrètement l’emprisonnement et conserve l’image du grec.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: était accablée de chagrin
  rationale: Expression française naturelle traduisant l’idée d’être saisie ou oppressée par la peine.
- source_word: ἐπηκροᾶτό μου
  choice: venait écouter
  rationale: Le verbe indique une écoute attentive; l’imparfait français restitue la valeur durative ou répétée du grec.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: dans la demeure des ténèbres
  rationale: Préserve la métaphore solennelle de la prison comme « maison des ténèbres » sans la réduire explicitement à « prison ».
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: d’une voix joyeuse
  rationale: Rend simplement et naturellement la joie audible exprimée par ἱλαρός.
- source_word: διὰ προφάσεως
  choice: grâce à un prétexte
  rationale: 'Conserve l’ambiguïté du grec: l’accusation portée contre Joseph sert paradoxalement de motif apparent à sa délivrance d’avec la femme.'
- source_word: ἀπηλλάγην
  choice: j’avais été délivré
  rationale: Le passif maintient le bénéficiaire et laisse implicite l’agent de la délivrance, comme dans le grec.
theological_decisions:
- issue: Agent implicite de la délivrance
  choice: Maintenir le passif « j’avais été délivré »
  alternative: « Dieu m’avait délivré »
  rationale: Le contexte de louange suggère l’action divine, mais le texte grec ne nomme pas explicitement Dieu comme agent dans cette proposition.
- issue: Sens paradoxal de προφάσεως
  choice: « grâce à un prétexte »
  alternative: « sous le prétexte de l’accusation » ou « à cause d’une fausse accusation »
  rationale: La formulation retenue préserve la tension du texte sans préciser que le prétexte est une accusation mensongère, même si le récit global le laisse entendre.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe a été légèrement fluidifiée tout en conservant la répétition de « l’Égyptienne », l’image de la demeure des ténèbres et l’ambiguïté concernant le prétexte et l’agent de la délivrance.
