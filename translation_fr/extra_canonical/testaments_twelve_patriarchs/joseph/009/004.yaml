  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: fr
  text: Combien de fois, bien qu’elle fût malade, elle descendait vers moi[a] à une heure indue et entendait ma voix pendant que je priais ! Et moi, comprenant ses gémissements, je gardais le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots grecs traduits par « vers moi » sont signalés comme textuellement incertains dans l’édition source.
    reason: Informer le lecteur de l’incertitude indiquée par les signes critiques de l’édition sans retirer ces mots du texte principal.
lexical_decisions:
- source_word: Ποσάκις
  choice: Combien de fois
  rationale: Conserve la tournure expressive et l’idée de répétition du grec.
- source_word: καίπερ ἀσθενοῦσα
  choice: bien qu’elle fût malade
  rationale: Rend naturellement la concession exprimée par καίπερ avec le participe.
- source_word: κατῄει
  choice: elle descendait
  rationale: Préserve le sens spatial concret et l’aspect répétitif suggéré par le contexte.
- source_word: ἐν ἀωρίᾳ
  choice: à une heure indue
  rationale: Exprime une heure inopportune ou inhabituelle sans préciser arbitrairement qu’il s’agit de la nuit.
- source_word: προσευχομένου
  choice: pendant que je priais
  rationale: Rend clairement le participe grec lié à « ma voix » dans un français courant.
- source_word: συνίων τοὺς στεναγμούς
  choice: comprenant ses gémissements
  rationale: Maintient la nuance cognitive de συνίων et le sens physique ou affectif de στεναγμούς, sans expliquer ce que ces gémissements signifiaient.
- source_word: ἐσιώπων
  choice: je gardais le silence
  rationale: Restitue l’imparfait et l’idée d’un silence maintenu.
theological_decisions:
- issue: Nature des « gémissements » de la femme
  choice: Ne pas en expliciter le sens
  alternative: Les interpréter comme des soupirs de désir ou comme une plainte due à la maladie
  rationale: Le grec ne tranche pas explicitement entre ces nuances; la traduction conserve donc la tension narrative.
translation_notes:
  register: Français moderne, digne et narratif. L’imparfait traduit l’action répétée. « Heure indue » reste accessible tout en préservant l’indétermination de ἀωρία.
