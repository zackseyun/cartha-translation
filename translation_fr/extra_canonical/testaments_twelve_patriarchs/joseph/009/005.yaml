  naturalness: Le texte révisé est fluide en français international moderne. « Tout particulièrement parée » reflète naturellement le participe κοσμουμένη, sans introduire une circonstance absente du grec (« quand »).
  terminology: « Seigneur » et « me préserva » rendent naturellement Κύριος et ἐφύλαξέ. « Manœuvres » convient à ἐγχειρημάτων dans ce contexte. « Me tromper » conserve le champ de ἀπάτη, plus large que la seule séduction sexuelle.
