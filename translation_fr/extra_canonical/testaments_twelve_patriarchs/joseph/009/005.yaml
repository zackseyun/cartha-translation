revisions:
- from: En effet, lorsque j’étais dans sa maison, elle découvrait ses bras et ses jambes pour que je tombe dans ses bras.[a] Car elle était très belle, surtout quand elle se parait pour me séduire. Mais le Seigneur me protégea de ses manœuvres.
  to: En effet, lorsque j’étais dans sa maison, elle dénudait ses bras et ses jambes afin que je me livre à elle.[a] Car elle était très belle, tout particulièrement parée pour me tromper. Mais le Seigneur me préserva de ses manœuvres.
  rationale: La révision supprime l’image ajoutée des « bras », corrige la note afin qu’elle ne déforme pas la préposition grecque et conserve l’ambiguïté de l’expression, dont le texte édité est lui-même marqué comme incertain. Elle rapproche aussi « dénudait » et « tout particulièrement parée » de la formulation grecque, tout en gardant un français naturel et un registre narratif digne.
