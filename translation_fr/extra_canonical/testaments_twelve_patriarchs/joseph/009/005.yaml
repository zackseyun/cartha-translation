base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: fr
  text: En effet, lorsque j’étais dans sa maison, elle dénudait ses bras et ses jambes afin que je me livre à elle.[a] Car elle était très belle, tout particulièrement parée pour me tromper. Mais le Seigneur me préserva de ses manœuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie littéralement une expression du type « afin que je tombe en elle ». Son sens précis est incertain; elle peut évoquer une relation sexuelle.
    reason: Conserve l’ambiguïté de συμπέσω εἰς αὐτήν et signale prudemment l’incertitude textuelle, sans ajouter l’image des « bras » ni présenter « sur elle » comme littéral.
lexical_decisions:
- source_word: ἐγύμνου
  choice: elle découvrait
  rationale: L’imparfait exprime une conduite répétée; « découvrir » rend naturellement le fait de dénuder ses membres sans suggérer qu’elle était entièrement nue.
- source_word: τοὺς βραχίονας ... καὶ τὰς κνήμας
  choice: ses bras et ses jambes
  rationale: « Bras » et « jambes » sont les équivalents français courants; κνήμας peut désigner plus précisément le bas des jambes, mais cette précision anatomique serait peu naturelle ici.
- source_word: ὡραία πάνυ
  choice: très belle
  rationale: Rend directement l’intensité de πάνυ et le sens esthétique de ὡραία.
- source_word: μάλιστα κοσμουμένη
  choice: surtout quand elle se parait
  rationale: Le participe évoque le fait de s’orner ou de se parer; l’imparfait français maintient le cadre narratif répétitif.
- source_word: πρὸς ἀπάτην μου
  choice: pour me séduire
  rationale: Dans ce contexte sexuel, « séduire » exprime naturellement la tromperie dirigée contre Joseph sans réduire ἀπάτη à une simple attirance.
- source_word: ἐγχειρημάτων
  choice: manœuvres
  rationale: Le terme désigne ici ses entreprises ou tentatives calculées; « manœuvres » convient au contexte et évite le sens moderne principalement juridique de « tentatives ».
theological_decisions:
- issue: Action protectrice du Seigneur
  choice: le Seigneur me protégea
  alternative: le Seigneur me garda
  rationale: « Protégea » rend clairement ἐφύλαξέ dans un français naturel, tout en conservant l’affirmation que la délivrance de Joseph vient du Seigneur.
- issue: Expression συμπέσω εἰς αὐτήν
  choice: que je tombe dans ses bras
  alternative: que je tombe sur elle
  rationale: Le grec est littéralement « que je tombe sur/en elle » et peut porter une forte connotation sexuelle. « Tomber dans ses bras » reste suggestif et idiomatique sans expliciter davantage que le texte; une note conserve la formulation plus littérale.
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent les actions habituelles ou répétées de la femme, tandis que le passé simple marque l’intervention décisive du Seigneur. La formulation évite aussi bien l’euphémisme opaque que l’explicitation sexuelle excessive.
