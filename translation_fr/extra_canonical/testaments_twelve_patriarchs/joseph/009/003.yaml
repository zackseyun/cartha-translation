source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἰ δὲ¹⁷ ἐν σωφροσύνῃ διάγων *θέλει καὶ¹⁸ δόξαν, καὶ¹⁹ οἶδεν ὁ ὕψιστος ὅτι συμφέρει, παρέχει²⁰ καὶ αὐτῷ καὶ ταῦτα²¹ ὡς κἀμοί.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: fr
  text: Mais si quelqu’un mène une vie de maîtrise de soi et désire aussi la gloire, et si le Très-Haut sait que cela lui est bénéfique, il lui accorde aussi ces choses, comme à moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: maîtrise de soi
  rationale: Rend ici la retenue et la conduite disciplinée qu’exprime σωφροσύνη, dans un français courant et digne.
- source_word: διάγων
  choice: mène une vie
  rationale: Exprime naturellement l’idée de vivre ou de se conduire durablement d’une certaine manière.
- source_word: δόξαν
  choice: la gloire
  rationale: Conserve le sens direct et la portée ouverte de δόξα sans préciser s’il s’agit d’honneur, de renommée ou de gloire accordée par Dieu.
- source_word: συμφέρει
  choice: lui est bénéfique
  rationale: Traduit l’idée de ce qui est avantageux ou bon pour la personne, sans la réduire à ce qui serait simplement convenable.
- source_word: ταῦτα
  choice: ces choses
  rationale: Respecte le pluriel grec, même si son référent exact reste quelque peu implicite dans la phrase.
theological_decisions:
- issue: Rapport entre le désir de gloire et le don du Très-Haut
  choice: Maintenir que la personne désire la gloire, tandis que le Très-Haut ne l’accorde que s’il sait qu’elle lui est bénéfique.
  alternative: Comprendre que le Très-Haut sait que la gloire convient à la personne.
  rationale: La syntaxe transmise présente θέλει καὶ δόξαν comme le désir du sujet, puis ὅτι συμφέρει comme le jugement souverain du Très-Haut; la traduction préserve cette tension.
- issue: Comparaison finale avec Joseph
  choice: comme il me les a accordées à moi
  alternative: comme à moi aussi
  rationale: L’explicitation du verbe en français clarifie la comparaison elliptique ὡς κἀμοί sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne international, naturel et digne. La répétition de « aussi » est légèrement redistribuée pour rester lisible tout en reflétant les particules καί du grec. Aucun marqueur de note n’est requis.
