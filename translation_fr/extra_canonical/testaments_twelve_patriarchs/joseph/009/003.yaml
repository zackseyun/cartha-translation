  verdict: revise
  source_fidelity: 'La phrase suit fidèlement la structure grecque : la personne vit dans la maîtrise de soi, désire aussi la gloire, et le Très-Haut accorde aussi « ces choses » s’il sait que cela est bénéfique. Le pluriel de ταῦτα est conservé. Toutefois, « comme il me les a accordées à moi » introduit indûment un accomplissement au passé : παρέχει est au présent, et ὡς κἀμοί est une comparaison elliptique (« comme à moi aussi »).'
