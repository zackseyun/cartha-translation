  to: Mais si quelqu’un mène une vie de maîtrise de soi et désire aussi la gloire, et si le Très-Haut sait que cela lui est bénéfique, il lui accorde aussi ces choses, comme à moi.
  rationale: La révision se limite à supprimer l’explicitation injustifiée au passé dans la dernière comparaison. « comme à moi » conserve l’ellipse et le présent du grec, sans préciser le moment ni la modalité du don reçu par Joseph.
