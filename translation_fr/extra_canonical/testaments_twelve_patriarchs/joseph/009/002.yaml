  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: fr
  text: 'À maintes reprises, elle m’envoya dire : « Accepte de satisfaire mon désir, et je te délivrerai de tes liens et te libérerai des ténèbres. » Mais moi, je ne me tournai pas vers elle, même en pensée. Car Dieu aime davantage celui qui, dans une fosse de ténèbres, demeure fidèle et maître de lui-même[a], qu’un roi qui, dans des pièces intérieures, mène une vie de luxe et de débauche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec rendu par « fidèle » est signalé comme incertain dans l’édition.
    reason: πιστόν porte une marque d’incertitude textuelle dans le texte source.
  - marker: b
    text: Le terme grec rendu par « roi » est signalé comme incertain dans l’édition. « Pièces intérieures » peut aussi se traduire par « réserves » ou « magasins ».
    reason: βασιλέα est marqué comme textuellement incertain, et ταμεῖα a un sens qui peut désigner des pièces intérieures ou des réserves.
lexical_decisions:
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: Accepte de satisfaire mon désir
  rationale: Rend l’appel au consentement exprimé par Εὐδόκησον et le sens sexuel contextuel de ἐπιθυμία sans l’expliciter au-delà du grec.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: je ne me tournai pas vers elle, même en pensée
  rationale: Formulation française naturelle qui conserve l’idée d’un refus allant jusqu’au mouvement intérieur de la pensée.
- source_word: πιστὸν ἐν σωφροσύνῃ
  choice: demeure fidèle et maître de lui-même
  rationale: Préserve à la fois la fidélité de πιστός et la maîtrise de soi, particulièrement sexuelle dans ce contexte, portée par σωφροσύνη.
- source_word: ἐν ταμείοις
  choice: dans ses appartements
  rationale: ταμεῖον peut désigner une pièce intérieure ou privée ainsi qu’une réserve; « appartements » convient au cadre royal sans imposer l’image plus étroite d’un entrepôt.
- source_word: τρυφῶντα μετ’ ἀκολασίας
  choice: mène une vie de luxe et de débauche
  rationale: Rend le contraste entre la jouissance raffinée ou luxueuse de τρυφάω et l’absence de retenue morale ou sexuelle de ἀκολασία.
theological_decisions:
- issue: Nature de la préférence divine exprimée par ἀγαπᾷ μᾶλλον
  choice: Dieu aime davantage celui qui…
  alternative: Dieu préfère celui qui…
  rationale: La traduction conserve le verbe « aimer » et la comparaison explicite du grec, sans reformuler celle-ci en jugement abstrait de mérite.
- issue: Portée morale de σωφροσύνη et ἀκολασία
  choice: maîtrise de soi / débauche
  alternative: chasteté / impudicité
  rationale: Le contexte est sexuel, mais les termes grecs ont une portée morale plus large; la formulation retenue garde cette amplitude et évite une précision confessionnelle indue.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste net; le contraste rhétorique entre la fosse obscure et le luxe royal est conservé. Les incertitudes signalées par l’édition grecque sont reportées en notes plutôt que résolues silencieusement.
