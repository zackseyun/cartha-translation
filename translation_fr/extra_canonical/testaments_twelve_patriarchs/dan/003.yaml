  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: fr
  text: '**Testament de Dan 3**


    1 La colère est en effet mauvaise, mes enfants, car elle bouleverse jusqu’à l’âme elle-même. 2 Elle s’approprie le corps de celui qui se met en colère, domine son âme et donne au corps la force de commettre toute sorte d’actes contraires à la loi. 3 Et lorsque le corps a commis tous ces actes, l’âme, elle aussi, justifie ce qui a été fait, parce qu’elle ne voit pas correctement.


    4 C’est pourquoi celui qui se met en colère, s’il est physiquement fort, possède dans sa colère une triple force : la première lui vient de l’aide de ceux qui le servent ; la deuxième, de sa richesse, par laquelle il persuade et l’emporte injustement[a] ; la troisième est sa force naturelle, par laquelle il fait le mal. 5 Mais si celui qui se met en colère est faible, la passion de la fureur se développe doublement en lui, car la colère l’aide toujours à agir contre la loi.


    6 Cet esprit marche toujours avec le mensonge, à la droite de Satan, afin que ses actes se fassent dans la cruauté et le mensonge[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de cette énumération est difficile. Il peut aussi se comprendre ainsi : « la deuxième vient de la richesse, en persuadant et en triomphant injustement de lui ».'
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: Le pronom traduit par « ses » peut renvoyer à Satan ou à l’esprit de colère.
    reason: referential_ambiguity
lexical_decisions:
- source_word: θυμός
  choice: colère
  rationale: Terme français courant et digne pour le vice central du passage; il permet de distinguer ὀργή, rendu par « fureur » au v. 5.
- source_word: ἐκταράσσει
  choice: bouleverse
  rationale: Exprime la forte agitation infligée à l’âme sans alourdir la phrase.
- source_word: ἴδιον ποιεῖται
  choice: s’approprie
  rationale: Conserve l’idée forte selon laquelle la colère fait du corps son instrument propre, clause absente de la couche anglaise mais présente dans le grec.
- source_word: κατακυριεύει
  choice: domine
  rationale: Rend la prise de pouvoir de la colère sur l’âme sans la réduire à une simple influence psychologique.
- source_word: πᾶσαν ἀνομίαν
  choice: toute sorte d’actes contraires à la loi
  rationale: Formulation française naturelle qui conserve la notion d’ἀνομία plutôt que de la généraliser en simple méchanceté.
- source_word: οὐ βλέπει ὀρθῶς
  choice: elle ne voit pas droit
  rationale: Préserve l’image visuelle et le jugement moral faussé; la légère étrangeté de l’expression correspond à la formulation grecque.
- source_word: τῶν ὑπουργούντων
  choice: ceux qui le servent
  rationale: Désigne naturellement les assistants ou subordonnés qui prêtent leur concours à l’homme en colère.
- source_word: ὀργή
  choice: fureur
  rationale: Maintient une distinction lexicale avec θυμός (« colère »), sans prétendre établir une différence technique absolue.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: à la droite de Satan
  rationale: Conserve directement l’image spatiale et la personnification du texte grec.
- source_word: ὠμότης
  choice: cruauté
  rationale: Rend la dureté brutale et impitoyable indiquée par le terme grec.
theological_decisions:
- issue: Personnification de la colère comme esprit agissant
  choice: Conserver « cet esprit » et ses actions de domination, d’assistance et de marche aux côtés du mensonge.
  alternative: Réduire l’ensemble à une description purement psychologique d’une émotion humaine.
  rationale: Le grec personnifie explicitement l’esprit de colère; la traduction préserve ce langage sans en déduire une doctrine démonologique plus élaborée.
- issue: Rapport entre l’âme, le corps et la colère
  choice: 'Traduire les trois affirmations du grec : la colère s’approprie le corps, domine l’âme et donne de la force au corps.'
  alternative: Suivre la couche anglaise abrégée, qui ne conserve explicitement que la force donnée au corps.
  rationale: 'Ces clauses appartiennent au texte grec transmis et expriment la tension morale du passage : le corps agit, puis l’âme aveuglée approuve ses actes.'
- issue: « à la droite de Satan »
  choice: Maintenir littéralement la place de l’esprit avec le mensonge à la droite de Satan.
  alternative: Paraphraser comme une simple alliance avec le mal.
  rationale: L’image est intelligible et théologiquement marquée; l’effacer résoudrait indûment la personnification du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La traduction suit d’abord le grec de la section III.1-6, y compris les clauses omises dans la couche anglaise et la phrase finale sur Satan. Les images de domination, d’aveuglement moral et de personnification sont conservées sans harmonisation doctrinale.
