  to: '**Testament de Dan 3**


    1 La colère est en effet mauvaise, mes enfants, car elle bouleverse jusqu’à l’âme elle-même. 2 Elle s’approprie le corps de celui qui se met en colère, domine son âme et donne au corps la force de commettre toute sorte d’actes contraires à la loi. 3 Et lorsque le corps a commis tous ces actes, l’âme, elle aussi, justifie ce qui a été fait, parce qu’elle ne voit pas correctement.


    4 C’est pourquoi celui qui se met en colère, s’il est physiquement fort, possède dans sa colère une triple force : la première lui vient de l’aide de ceux qui le servent ; la deuxième, de sa richesse, par laquelle il persuade et l’emporte injustement[a] ; la troisième est sa force naturelle, par laquelle il fait le mal. 5 Mais si celui qui se met en colère est faible, la passion de la fureur se développe doublement en lui, car la colère l’aide toujours à agir contre la loi.


    6 Cet esprit marche toujours avec le mensonge, à la droite de Satan, afin que ses actes se fassent dans la cruauté et le mensonge[b].'
  rationale: 'Révision limitée à des améliorations idiomatiques et syntaxiques sûres : « correctement » explicite naturellement l’adverbe ὀρθῶς; « se développe doublement » rend mieux ἀναφύει; et « se fassent dans » évite d’ajouter l’idée d’un agent accomplissant les actes. Le passage demeure complet pour Testament de Dan 3 (section III.1-6), sans importer les versets II.1-5 inclus seulement comme contexte de source.'
  reviewer_model: gpt-5.6-terra
