  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: fr
  text: Même s’il s’agit d’un père ou d’une mère, elle les considère comme des ennemis. S’il s’agit d’un frère, elle ne le connaît pas. Si c’est un prophète du Seigneur, elle lui désobéit ; si c’est un juste, elle ne le voit pas ; si c’est un ami, elle ne le reconnaît pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: elle les considère comme des ennemis
  rationale: Rend naturellement l’idée de porter son attention sur eux ou de les envisager comme des ennemis, sans renforcer le texte jusqu’à « les traite en ennemis ».
- source_word: παρακούει
  choice: elle lui désobéit
  rationale: Le verbe peut exprimer le refus d’écouter et, par extension, la désobéissance ; « désobéit » convient au rapport avec un prophète du Seigneur et correspond au sens contextuel.
- source_word: οὐ βλέπει
  choice: elle ne le voit pas
  rationale: Conserve le sens direct de βλέπει et la formulation volontairement frappante du grec, plutôt que de l’atténuer en « ne le remarque pas ».
- source_word: οὐ γνωρίζει
  choice: elle ne le reconnaît pas
  rationale: Distingue γνωρίζει de οἶδεν et exprime le refus de reconnaître l’ami comme tel.
theological_decisions:
- issue: Sujet implicite des verbes grecs
  choice: Le pronom féminin « elle » est conservé comme renvoi au sujet féminin établi par le contexte antérieur.
  alternative: Répéter explicitement le nom du sujet à chaque proposition ou employer une tournure impersonnelle.
  rationale: Le verset grec poursuit un sujet implicite déjà présent dans le contexte. Le pronom évite d’ajouter au verset un nom absent de la phrase transmise tout en produisant un français naturel.
translation_notes:
  register: Français moderne, clair et digne. La répétition conditionnelle et les contrastes père/mère, frère, prophète, juste et ami sont préservés. « S’il s’agit de » évite l’ambiguïté grammaticale qu’aurait « même si c’est un père » tout en gardant la structure du grec.
