source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐν τίνι δὲ²⁵ περιβάλλει τοὺς ὀφθαλμοὺς αὐτοῦ²⁶; *ἐν μίσει καρδίας²⁷ κατὰ τοῦ ἀδελφοῦ αὐτοῦ²⁸ *εἰς φθόνον²⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: fr
  text: Mais de quoi couvre-t-il ses yeux ? De la haine dans son cœur contre son frère, jusqu’à l’envie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει
  choice: couvre
  rationale: Rend directement l’idée d’envelopper ou de couvrir, avec « les yeux » comme complément, sans introduire l’image plus spécifique d’un voile.
- source_word: μῖσος καρδίας
  choice: la haine du cœur
  rationale: Conserve l’expression sémitisante et sa force intérieure plutôt que de la réduire à « une haine profonde ».
- source_word: ἀδελφοῦ
  choice: frère
  rationale: Équivalent direct, naturel et conforme au contexte fraternel du Testament de Dan.
- source_word: εἰς φθόνον
  choice: jusqu’à la jalousie
  rationale: Préserve la valeur orientée de εἰς sans imposer une relation causale plus explicite que le grec; « jalousie » est ici plus naturel en français pour une hostilité envers un frère, tout en gardant la proximité avec l’envie.
theological_decisions:
- issue: Relation entre la haine du cœur et φθόνος
  choice: jusqu’à la jalousie
  alternative: conduisant à la jalousie
  rationale: Le grec εἰς peut exprimer une orientation ou un résultat, mais ne précise pas formellement une causalité. La traduction retenue conserve cette légère ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La tournure interrogative et le parallélisme de la réponse sont conservés; le pronom « lui » maintient la référence au sujet masculin du contexte immédiat.
