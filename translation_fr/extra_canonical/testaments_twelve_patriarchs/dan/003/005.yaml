- from: Et de quoi lui couvre-t-il les yeux ? De la haine du cœur contre son frère, jusqu’à la jalousie.
  to: Mais de quoi couvre-t-il ses yeux ? De la haine dans son cœur contre son frère, jusqu’à l’envie.
