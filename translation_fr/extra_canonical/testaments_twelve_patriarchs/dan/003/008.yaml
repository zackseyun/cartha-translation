source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: fr
  text: Et lorsque le corps a fait toutes ces choses, l’âme aussi[a] justifie ce qui a été fait, parce qu’elle ne voit pas juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins omettent « aussi ».
    reason: Le chiffre de note attaché à καὶ ἡ ψυχή dans l’édition signale une variation textuelle; la formulation principale suit le texte grec fourni.
lexical_decisions:
- source_word: πράξῃ / τὰ πραχθέντα
  choice: a commis / ce qui a été fait
  rationale: Le contexte négatif favorise « commettre » pour le premier verbe, tandis que la tournure passive « ce qui a été fait » conserve la formulation générale du grec.
- source_word: δικαιοῖ
  choice: justifie
  rationale: Rend directement l’idée de déclarer ou de tenir les actes pour justes, sans atténuer la responsabilité de l’âme.
- source_word: οὐ βλέπει ὀρθῶς
  choice: elle ne voit pas juste
  rationale: Expression française naturelle qui conserve la métaphore de la vision et le sens d’un jugement faussé.
theological_decisions:
- issue: Rapport entre le corps et l’âme dans la responsabilité morale
  choice: Conserver l’affirmation selon laquelle l’âme justifie après coup les actes du corps.
  alternative: Paraphraser en disant que l’esprit rationalise les actes commis.
  rationale: Le grec distingue explicitement le corps et l’âme; une paraphrase psychologique résoudrait indûment la tension anthropologique du texte.
translation_notes:
  register: Français moderne, clair et digne. « Tous ces actes » évite la lourdeur de « toutes ces choses », et « ne voit pas juste » garde l’image grecque dans une tournure courante.
