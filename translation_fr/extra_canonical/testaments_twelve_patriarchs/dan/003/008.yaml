- from: Et quand le corps a commis tous ces actes, l’âme, elle aussi, justifie ce qui a été fait,[a] parce qu’elle ne voit pas juste.
  to: Et lorsque le corps a fait toutes ces choses, l’âme aussi[a] justifie ce qui a été fait, parce qu’elle ne voit pas juste.
  rationale: La révision remplace une interprétation morale ajoutée par le verbe français général « faire », tout en conservant la distinction explicite entre le corps et l’âme, le sens de δικαιοῖ et la métaphore visuelle finale. L’ancre de note est rapprochée de l’élément textuel concerné.
