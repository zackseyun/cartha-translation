  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: fr
  text: Car la colère est un aveuglement et elle ne permet pas de voir en vérité le visage de qui que ce soit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: la colère
  rationale: Dans ce contexte moral, « colère » exprime naturellement l’emportement qui obscurcit le jugement.
- source_word: τύφλωσις
  choice: un aveuglement
  rationale: « Aveuglement » conserve la métaphore abstraite du grec et convient mieux ici que la cécité physique.
- source_word: πρόσωπόν τινος
  choice: le visage de qui que ce soit
  rationale: Cette formulation rend le sens indéfini de τινος dans la portée de la négation, sans limiter la phrase à une personne particulière.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Le tour volontairement sobre préserve l’ambiguïté du grec entre voir une personne selon la vérité et la voir telle qu’elle est réellement.
