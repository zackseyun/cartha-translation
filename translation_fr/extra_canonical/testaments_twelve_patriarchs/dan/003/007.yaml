source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: fr
  text: Elle s’approprie le corps de celui qui se met en colère, prend le pouvoir sur son âme et donne au corps [de la force] afin qu’il commette toute action contraire à la loi.a
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδιον ποιεῖται
  choice: s’approprie
  rationale: Rend naturellement l’idée de faire sien ou de prendre possession, tout en conservant la personnification implicite de la colère.
- source_word: τοῦ θυμουμένου
  choice: de celui qui se met en colère
  rationale: Le participe présent désigne la personne en proie à la colère; cette formulation est claire et actuelle.
- source_word: κατακυριεύει
  choice: domine entièrement
  rationale: Exprime la maîtrise forte suggérée par le préverbe κατα- sans alourdir la phrase.
- source_word: ἀνομίαν
  choice: actes contraires à la loi
  rationale: Préserve le lien lexical avec la loi contenu dans ἀνομία, plutôt que de réduire le terme à une méchanceté générale.
theological_decisions:
- issue: Référent implicite du sujet féminin
  choice: Conserver « elle », renvoyant au contexte à la colère
  alternative: Répéter « la colère »
  rationale: Le grec emploie un sujet implicite; le pronom maintient la cohésion avec le contexte sans ajouter une précision absente de ce verset.
- issue: Portée de πᾶσαν ἀνομίαν
  choice: « toutes sortes d’actes contraires à la loi »
  alternative: « tout acte contraire à la loi »
  rationale: Cette tournure française rend la portée distributive possible de πᾶσαν sans prétendre que chaque personne commet littéralement toute transgression imaginable.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement grec, mais la dernière proposition est légèrement resserrée pour éviter une répétition lourde de « afin que » et « corps ».
