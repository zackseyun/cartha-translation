  text: τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/001.yaml
  text: '...truth and long-suffering, you will perish.'
translation:
  language: fr
  text: … la vérité et la patience, vous périrez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec conservé commence au milieu d’une phrase; le lien exact entre « la vérité et la patience » et « vous périrez » dépend du contexte précédent.
    reason: Signaler le caractère fragmentaire de l’extrait sans compléter conjecturalement la syntaxe.
lexical_decisions:
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: Correspondance directe qui conserve le sens abstrait du grec dans un français naturel et digne.
- source_word: τὴν μακροθυμίαν
  choice: la patience
  rationale: Dans ce contexte fragmentaire, « patience » rend naturellement l’endurance et la maîtrise prolongée impliquées par μακροθυμία, sans imposer « longanimité », moins accessible aujourd’hui.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Le futur moyen de ἀπόλλυμι exprime ici la perte ou la ruine des destinataires; « vous périrez » en conserve la force et la concision.
theological_decisions:
- issue: Nature exacte de μακροθυμία
  choice: patience
  alternative: longanimité / patience persévérante
  rationale: Le fragment ne permet pas de déterminer avec certitude s’il s’agit surtout de patience envers autrui ou d’endurance dans l’épreuve; le terme général « patience » préserve cette ouverture.
translation_notes:
  register: Français moderne international, sobre et intelligible. L’ellipse initiale est conservée par les points de suspension, et aucune relation syntaxique absente de l’extrait grec n’est ajoutée.
