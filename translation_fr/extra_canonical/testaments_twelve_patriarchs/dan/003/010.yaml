base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: fr
  text: Mais si celui qui se met en colère est faible, la passion de la colère grandit doublement en lui, car la colère l’aide toujours dans l’iniquité. Cet esprit va toujours avec le mensonge, à la droite de Satan, afin que ses actes se fassent dans la cruauté et le mensonge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμούμενος
  choice: celui qui se met en colère
  rationale: Rend naturellement en français le participe désignant la personne en colère, sans lui attribuer un trait permanent.
- source_word: τὸ τῆς ὀργῆς πάθος
  choice: la passion de la fureur
  rationale: Conserve la distinction lexicale entre θυμός, rendu ensuite par « colère », et ὀργή, ici « fureur », tout en préservant l’idée d’une passion qui s’empare de la personne.
- source_word: διπλοῦν … ἀναφύει
  choice: grandit doublement
  rationale: Reflète à la fois l’intensification exprimée par διπλοῦν et l’image de croissance ou de surgissement portée par ἀναφύει.
- source_word: ἐν παρανομίᾳ
  choice: à agir contre la loi
  rationale: Exprime le sens de παρανομία comme transgression de la loi dans une tournure française naturelle; le contexte décrit l’aide que la colère apporte à la conduite fautive.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: à la droite de Satan
  rationale: Préserve l’image spatiale précise et potentiellement significative du grec sans l’interpréter davantage.
- source_word: γίνωνται αἱ πράξεις αὐτοῦ
  choice: ses actes s’accomplissent
  rationale: Rend la construction littéralement orientée vers le fait que les actes adviennent, dans un français digne et intelligible.
theological_decisions:
- issue: Référent de « cet esprit »
  choice: Maintenir « Cet esprit » sans préciser s’il s’agit de la colère, du mensonge ou d’un esprit mauvais associé.
  alternative: « L’esprit de colère » ou « cet esprit mauvais »
  rationale: Le démonstratif grec renvoie au contexte, mais le référent précis n’est pas explicité dans l’extrait; une précision résoudrait indûment l’ambiguïté.
- issue: Fonction de la position « à la droite de Satan »
  choice: Conserver l’expression telle quelle.
  alternative: Paraphraser comme une place de soutien, d’autorité ou de proximité.
  rationale: Le texte fournit une image mais n’en explique pas la portée théologique; la traduction ne doit pas imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec, avec une distinction entre « fureur » (ὀργή) et « colère » (θυμός). Aucun marqueur de note n’est nécessaire.
