source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: fr
  text: 'Car la colère est mauvaise, mes enfants : elle bouleverse jusqu’à l’âme elle-même.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὸς
  choice: mauvaise
  rationale: Rend directement le jugement moral porté sur la colère, sans renforcer indûment le terme par « maléfique ».
- source_word: θυμός
  choice: colère
  rationale: Dans ce contexte exhortatif, le mot désigne la colère ou l’emportement; « colère » est le terme français courant et naturel.
- source_word: ἐκταράσσει
  choice: bouleverse
  rationale: Exprime une perturbation profonde et intérieure, plus forte qu’un simple trouble passager.
- source_word: καὶ αὐτὴν τὴν ψυχὴν
  choice: jusqu’à l’âme elle-même
  rationale: Préserve l’intensification grecque portant sur l’âme elle-même et la portée de καί au sens de « même ».
theological_decisions:
- issue: Nature de l’affirmation sur la colère
  choice: « la colère est mauvaise »
  alternative: « la colère est un mal »
  rationale: La formulation adjectivale suit la syntaxe grecque et conserve l’affirmation morale générale sans en faire une entité abstraite.
translation_notes:
  register: Français moderne, clair et digne. Les deux propositions sont reliées par deux-points afin de rendre naturellement la valeur explicative de ὡς dans ce contexte, sans alourdir la phrase.
