source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Διὰ τοῦτο¹¹ ὁ θυμούμενος¹², *ἐὰν μὲν ᾖ¹³ *δυνατὸς ⌈τῷ σώματι⌉¹⁴, *τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται¹⁵· μίαν¹⁶ μὲν ἀπὸ¹⁷ τῆς βοηθείας *τῶν ὑπουργούντων¹⁸. *δεύτερον δὲ¹⁹ διὰ τοῦ πλούτου *πείθων καὶ νικῶν [αὐτὸν] ἀδίκως²⁰. *τρίτον τὴν²¹ φυσικὴν ἔχων *δύναμιν δι'' αὐτῆς δρᾷ²² τὸ κακόν²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: fr
  text: 'C’est pourquoi celui qui se met en colère, s’il est fort physiquement, possède dans sa colère une puissance triple : la première lui vient de l’aide de ceux qui le servent ; la deuxième, de la richesse, grâce à laquelle il persuade et l’emporte injustement ; la troisième est sa force naturelle, par laquelle il fait le mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: celui qui se met en colère
  rationale: Rend naturellement le participe présent désignant la personne en proie à la colère, sans en faire un trait permanent.
- source_word: δυνατὸς τῷ σώματι
  choice: fort physiquement
  rationale: Expression française courante et fidèle au sens de force corporelle.
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: possède dans sa colère une puissance triple
  rationale: Conserve le lien entre la puissance et la colère ainsi que la structure ternaire, sans introduire l’âme, absente du texte grec fourni.
- source_word: τῶν ὑπουργούντων
  choice: ceux qui le servent
  rationale: Désigne les personnes qui assistent ou sont au service de l’homme en colère ; formulation plus claire que « subalternes » ou « assistants » dans ce contexte.
- source_word: πείθων καὶ νικῶν [αὐτὸν] ἀδίκως
  choice: grâce à laquelle il persuade et l’emporte injustement
  rationale: Préserve les deux participes, convaincre et avoir le dessus, ainsi que la qualification morale ἀδίκως. Le pronom αὐτόν, entre crochets dans l’édition, n’est pas exprimé puisqu’il est textuellement incertain et que son référent est obscur.
- source_word: φυσικὴν … δύναμιν
  choice: sa force naturelle
  rationale: Rend directement la force possédée par nature, ici vraisemblablement corporelle, sans surinterprétation.
- source_word: δρᾷ τὸ κακόν
  choice: il fait le mal
  rationale: Équivalent français direct, naturel et moralement non atténué.
theological_decisions:
- issue: Nature de la triple puissance liée à la colère
  choice: « possède dans sa colère une puissance triple »
  alternative: « la puissance de sa colère est triplée »
  rationale: La formulation retenue conserve l’idée d’une puissance présentée sous trois formes ou provenant de trois sources, plutôt que d’affirmer mathématiquement qu’elle est multipliée par trois.
- issue: Référent du pronom αὐτόν
  choice: Ne pas traduire le pronom textuellement incertain
  alternative: « il le persuade et l’emporte sur lui injustement »
  rationale: Le pronom est signalé entre crochets et son référent n’est pas clair. L’omettre préserve l’incertitude de la source sans imposer un objet absent ou douteux.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’énumération rhétorique en trois temps tout en évitant une syntaxe excessivement calquée sur le grec.
