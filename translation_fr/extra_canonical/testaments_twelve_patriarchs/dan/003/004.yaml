source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: fr
  text: Car l’esprit de colère l’enveloppe dans le filet de l’égarement, aveugle ses yeux et, par le mensonge, obscurcit son intelligence et lui donne sa propre vision.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: l’esprit de colère
  rationale: Rend directement la construction grecque tout en conservant la possible personnification de la colère.
- source_word: τὸ δίκτυον τῆς πλάνης
  choice: le filet de l’égarement
  rationale: « Filet » préserve l’image du piège; « égarement » garde l’amplitude de πλάνη, qui peut évoquer erreur, tromperie ou dévoiement.
- source_word: τὴν διάνοιαν
  choice: son intelligence
  rationale: Désigne ici la faculté de comprendre et de juger, plutôt que le simple esprit au sens général.
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  choice: lui impose sa propre manière de voir
  rationale: La traduction littérale « lui donne sa propre vision » serait ambiguë en français; le contexte indique que l’esprit de colère substitue sa perspective à celle de la personne.
theological_decisions:
- issue: Nature de « l’esprit de colère »
  choice: Conserver « l’esprit de colère » sans préciser s’il s’agit d’un être personnel ou d’une force intérieure.
  alternative: « La colère » ou « un esprit de colère »
  rationale: L’article grec et la formulation personnifiée permettent plusieurs lectures; la traduction ne doit pas trancher une question que le texte laisse ouverte.
translation_notes:
  register: Français moderne, clair et digne. La structure causale et l’enchaînement des actions du grec sont conservés, avec une légère explicitation idiomatique dans la proposition finale.
