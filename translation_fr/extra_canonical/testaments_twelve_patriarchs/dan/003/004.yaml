revisions:
- from: Car l’esprit de colère l’enveloppe dans le filet de l’égarement, aveugle ses yeux et, par le mensonge, obscurcit son intelligence et lui impose sa propre manière de voir.
  to: Car l’esprit de colère l’enveloppe dans le filet de l’égarement, aveugle ses yeux et, par le mensonge, obscurcit son intelligence et lui donne sa propre vision.
  rationale: La dernière proposition est corrigée afin de rendre παρέχει sans ajouter l’idée de coercition. Le possessif de « sa propre vision » conserve l’ambiguïté du grec quant à la perspective ainsi attribuée, tandis que le reste du texte est maintenu.
