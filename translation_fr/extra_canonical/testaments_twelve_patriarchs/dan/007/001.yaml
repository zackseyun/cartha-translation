  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/001.yaml
  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: fr
  text: Après avoir dit cela, il les embrassa tendrement et s’endormit d’un sommeil paisible.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφιλήσας
  choice: embrassa tendrement
  rationale: Le verbe intensif καταφιλέω exprime ici un baiser affectueux; « tendrement » restitue cette nuance en français naturel.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: s’endormit d’un sommeil paisible
  rationale: La construction apparentée au verbe et au nom est conservée autant que le permet le français; « paisible » rend καλῷ dans ce contexte de sommeil final sans imposer explicitement le sens de « mort ».
theological_decisions:
- issue: Le sommeil comme possible euphémisme de la mort
  choice: s’endormit
  alternative: mourut
  rationale: Le grec emploie explicitement le vocabulaire du sommeil. La traduction préserve cette image et son éventuelle portée euphémistique au lieu de l’expliciter.
translation_notes:
  register: Français moderne, digne et fluide. « Après avoir dit cela » rend naturellement le participe grec; « les embrassa tendrement » communique l’affection exprimée par le verbe intensif.
