  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: fr
  text: Cependant, Dan[a] leur prophétisa qu’après cela ils transporteraient ses ossements et les déposeraient tout près[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Dan » est restitué dans l’édition grecque.
    reason: Signaler la restitution éditoriale indiquée par les signes critiques du texte source.
  - marker: b
    text: 'Certains témoins omettent : « et les déposeraient tout près ».'
    reason: Signaler la variation textuelle sans créer de contradiction avec la proposition retenue dans le texte principal.
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: Cependant
  rationale: Rend la transition adversative et conclusive sans la surcharger.
- source_word: προεφήτευσεν αὐτοῖς
  choice: leur prophétisa
  rationale: Conserve explicitement l’acte prophétique et le complément indirect.
- source_word: ἐπὶ/ἐπιλά ταῦτα
  choice: après cela
  rationale: Suit l’interprétation temporelle attestée par le texte corrigé tout en restant naturelle en français.
- source_word: ἀνήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: ils emporteraient ses ossements
  rationale: Le conditionnel français convient au discours indirect dépendant d’un verbe au passé; «ossements» est le terme digne et courant dans un contexte funéraire.
- source_word: κατέθηκαν σύνεγγυς
  choice: les déposeraient tout près
  rationale: Préserve l’idée de dépôt et l’indication spatiale volontairement non précisée dans le grec.
theological_decisions:
- issue: Temps des actions annoncées dans la prophétie
  choice: 'Conditionnel futur dans le passé: «emporteraient… déposeraient»'
  alternative: 'Passé composé ou passé simple: «ont emporté… déposèrent»'
  rationale: En français, le conditionnel marque naturellement des actes futurs vus depuis le moment où Dan prophétise, sans modifier leur contenu.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’imprécision spatiale de «tout près» au lieu de fournir un lieu absent du grec.
