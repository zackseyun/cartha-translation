source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ³ ἔθαψαν αὐτὸν *οἱ υἱοὶ αὐτοῦ. Καὶ⁴ μετὰ *τοῦτο ἀπήνεγκαν⁵ ⌈τὰ ὀστᾶ αὐτοῦ⌉⁶... *ἔνθα ἦν⁷ ᾿Αβραὰμ⁸ καὶ Ἰσαὰκ καὶ Ἰακώβ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/002.yaml
  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: fr
  text: Et ses fils l’ensevelirent. Après cela, ils emportèrent ses ossements jusqu’au lieu où se trouvaient Abraham, Isaac et Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: ensevelirent
  rationale: Rend précisément l’acte de mettre au tombeau, dans un registre biblique digne mais encore naturel.
- source_word: ἀπήνεγκαν
  choice: emportèrent… jusqu’au
  rationale: Le verbe exprime le transport au loin; «jusqu’au lieu» donne en français une destination naturelle sans surinterpréter le mouvement.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: ses ossements
  rationale: «Ossements» convient au contexte funéraire et traduit naturellement le pluriel grec.
- source_word: ἔνθα ἦν
  choice: où se trouvaient
  rationale: Préserve la simple indication de présence du grec; l’accord pluriel est naturel puisque trois patriarches sont nommés.
theological_decisions:
- issue: Nature du lieu où étaient les patriarches
  choice: Ne pas préciser s’il s’agit d’un tombeau, d’un territoire ou d’un autre lieu
  alternative: «dans le tombeau où reposaient Abraham, Isaac et Jacob»
  rationale: Le grec dit seulement «le lieu où étaient»; ajouter «tombeau» ou «reposaient» résoudrait une ambiguïté absente du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. «Ensevelirent» et «ossements» gardent une tonalité funéraire appropriée sans archaïsme excessif.
