source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: fr
  text: 'Mais le Dieu de mes pères ne permit pas qu’il tombe entre mes mains : je ne pus donc pas le trouver seul, le tuer et faire ainsi disparaître une deuxième tribu d’Israël[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « délier (ou dissoudre) un deuxième sceptre pour Israël ». Ici, « sceptre » désigne vraisemblablement une tribu.'
    reason: Le grec présente une image et une construction inhabituelles. La note documente le sens littéral et signale que l’identification à une tribu, bien que contextuellement forte, est interprétative.
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: le Dieu de mes pères
  rationale: Rend directement l’expression ancestrale grecque dans un français biblique naturel et actuel.
- source_word: οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: ne permit pas qu’il tombe entre mes mains
  rationale: Conserve l’image grecque de tomber entre les mains de quelqu’un plutôt que de la remplacer par « livrer ».
- source_word: ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ
  choice: je ne pus donc pas le trouver seul et le tuer
  rationale: Dans la portée de la négation précédente, ἵνα exprime ici le résultat ou le dessein empêché. Une coordination négative française évite de suggérer que Dieu souhaitait le meurtre.
- source_word: σκῆπτρον δεύτερον
  choice: une deuxième tribu
  rationale: σκῆπτρον signifie littéralement « sceptre », mais peut désigner par métonymie une tribu d’Israël organisée sous son sceptre. « Tribu » rend clairement le référent dans ce contexte familial.
- source_word: ποιήσω λυθῆναι
  choice: faire ainsi disparaître
  rationale: Rend la construction causative et la dissolution ou suppression exprimée par λυθῆναι, sans imposer un mécanisme précis.
theological_decisions:
- issue: Rapport entre la permission divine et l’intention homicide de Dan
  choice: 'Formuler la suite comme une action empêchée : « je ne pus donc pas »'
  alternative: « afin que, le trouvant seul, je le tue »
  rationale: La négation de « ne permit pas » porte sémantiquement sur le résultat envisagé. Cette formulation préserve l’affirmation de la protection divine sans présenter le meurtre comme son but.
- issue: Sens collectif de σκῆπτρον
  choice: « tribu », avec indication du sens littéral en note
  alternative: « sceptre »
  rationale: Le contexte concerne la suppression d’une composante d’Israël; traduire littéralement « sceptre » serait obscur, mais la note conserve l’image et l’ambiguïté lexicales de la source.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’image « tomber entre mes mains », tout en explicitant naturellement que le dessein homicide fut empêché. La note maintient la tension du grec autour de σκῆπτρον et λυθῆναι.
