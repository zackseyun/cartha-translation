source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: fr
  text: 'Et l’un des esprits de Béliar agissait de concert avec moi en me disant : « Prends l’épée et, avec elle, tue Joseph. Après sa mort[a], ton père t’aimera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lui étant mort ». Le pronom renvoie probablement à Joseph, mais peut aussi, grammaticalement, désigner le père.'
    reason: Préserver l’ambiguïté du génitif absolu ἀποθανόντος αὐτοῦ sans alourdir le texte principal.
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: l’un des esprits de Béliar
  rationale: La tournure grecque signifie littéralement « parmi les esprits de Béliar » ; avec le verbe au singulier, elle désigne naturellement l’un d’entre eux.
- source_word: συνήργει μοι
  choice: agissait de concert avec moi
  rationale: Cette formulation rend l’idée de coopération exprimée par συνεργέω sans suggérer une simple présence intérieure.
- source_word: ἐν τούτῳ
  choice: avec elle
  rationale: Le démonstratif renvoie à l’épée et indique le moyen par lequel Joseph doit être tué.
- source_word: ἄνελε
  choice: tue
  rationale: Dans ce contexte, l’impératif de ἀναιρέω signifie directement mettre à mort.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française directe de la forme grecque Βελίαρ, sans l’assimiler silencieusement à la variante « Bélial ».
theological_decisions:
- issue: Référent de αὐτοῦ dans ἀποθανόντος αὐτοῦ
  choice: « Après sa mort », avec une note signalant l’ambiguïté
  alternative: « Après la mort de Joseph » ou « quand ton père sera mort »
  rationale: Le pronom grec est grammaticalement ambigu. Le contexte favorise Joseph comme référent, mais le préciser dans le corps du texte supprimerait une ambiguïté réelle du grec.
translation_notes:
  register: Français moderne, courant et digne. « Agissait de concert avec moi » conserve la nuance de coopération de l’imparfait grec ; le discours direct reste incisif et naturel.
