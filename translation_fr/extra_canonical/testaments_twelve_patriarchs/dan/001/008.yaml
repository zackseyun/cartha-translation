    issue: La seconde occurrence du verbe « sucer entièrement » est remplacée par « faire de même ».
    rationale: Le grec répète ἐκμύζω dans l’image du léopard et dans son application à Joseph. Une traduction optimale doit conserver cette reprise, malgré son caractère brutal et inhabituel.
  - severity: low
    issue: « Panthère » est moins précis que « léopard » pour πάρδαλις.
    rationale: Dans ce contexte animalier, πάρδαλις désigne normalement le léopard; « léopard » est aussi le terme français international le plus immédiatement identifiable.
