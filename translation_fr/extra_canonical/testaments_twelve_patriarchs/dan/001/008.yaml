source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Τοῦτο δὲ ἦν τὸ πνεῦμα τοῦ θυμοῦ τὸ πεῖθόν με⁴⁹· ὥσπερ⁵⁰ πάρδαλις †ἐκμύζουσα⁵¹ ἔριφον, ἵνα οὕτως *⌜ἐμοὶ ἐνέβαλεν⌝ †ἐκμυζῆσαι⁵² τὸν Ἰωσήφ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: fr
  text: 'C’était l’esprit de colère qui me persuadait : comme un léopard suce un chevreau jusqu’à le vider, ainsi il me poussa à sucer Joseph jusqu’à le vider.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile : les deux occurrences du verbe rendu par « sucer… jusqu’à le vider » sont signalées comme douteuses dans l’édition. Le texte conservé répète néanmoins ce même verbe à propos du chevreau et de Joseph.'
    reason: Signaler explicitement les difficultés textuelles marquées dans l’édition tout en expliquant la répétition lexicale préservée dans la traduction.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: l’esprit de colère
  rationale: Rend directement l’expression grecque sans préciser si l’« esprit » est une entité personnelle ou une disposition intérieure.
- source_word: τὸ πεῖθόν με
  choice: qui me persuadait
  rationale: Conserve l’idée d’une influence persuasive continue exprimée par le participe présent.
- source_word: πάρδαλις
  choice: panthère
  rationale: Équivalent français courant et naturel pour le grand félin désigné ici.
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: suce… jusqu’à le vider / faire de même
  rationale: Préserve l’image inhabituelle mais explicite du verbe « sucer entièrement, vider en suçant »; la reprise allégée évite une tournure française grotesquement mécanique sans remplacer l’image par « détruire ».
- source_word: ἐμοὶ ἐνέβαλεν
  choice: il m’incita
  rationale: Exprime naturellement en français l’idée de mettre en quelqu’un une impulsion ou une intention, tout en gardant l’esprit de colère pour sujet.
- source_word: ἔριφον
  choice: un chevreau
  rationale: Équivalent précis et courant du nom grec.
theological_decisions:
- issue: Nature de « l’esprit de colère »
  choice: Maintien de l’expression « l’esprit de colère » et du pronom « il »
  alternative: « la colère qui m’animait »
  rationale: Le grec peut évoquer une puissance spirituelle personnifiée ou une disposition; la traduction ne réduit pas cette tension à un simple état psychologique.
- issue: Portée de l’image appliquée à Joseph
  choice: « faire de même avec Joseph »
  alternative: « sucer Joseph jusqu’à le vider » ou « détruire Joseph »
  rationale: La formulation conserve le renvoi explicite à l’action imagée sans introduire l’interprétation abstraite « détruire », absente du texte grec.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve l’image violente et insolite du grec, tout en rendant sa répétition de façon idiomatique. Le démonstratif initial est traduit par « C’était », sans ajouter de marqueur discursif absent.
