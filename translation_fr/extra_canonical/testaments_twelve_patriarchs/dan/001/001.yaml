base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/001.yaml
  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: fr
  text: 'Testament de Dan, septième fils de Jacob et de Bilha.


    1 Voici une copie des paroles que Dan adressa à ses fils dans les derniers jours de sa vie, au cours de la cent vingt-cinquième année de sa vie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans le titre de cette œuvre, le terme désigne les dernières paroles et dispositions attribuées au patriarche; « Testament » conserve le titre traditionnel et le genre littéraire.
- source_word: Ἀντίγραφον
  choice: une copie
  rationale: Rend directement l’idée d’une transcription ou reproduction écrite, sans préciser davantage la nature du document.
- source_word: λόγων
  choice: des paroles
  rationale: Le pluriel désigne ici les propos prononcés par Dan et transmis par écrit.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: dans les derniers jours de sa vie
  rationale: Formulation française naturelle qui exprime la fin de ses jours sans suggérer les « derniers jours » eschatologiques.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: la cent vingt-cinquième année de sa vie
  rationale: Suit précisément le décompte ordinal du grec et évite de reformuler comme un âge révolu.
theological_decisions:
- issue: Portée de « derniers jours »
  choice: dans les derniers jours de sa vie
  alternative: à la fin de ses jours
  rationale: Le complément possessif grec renvoie aux derniers jours de Dan lui-même; la traduction évite une lecture eschatologique non exigée par le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le titre traditionnel est conservé. « Adressa » rend naturellement l’acte de parler à ses fils, tandis que la répétition de « sa vie » reflète les deux expressions grecques sans obscurité.
