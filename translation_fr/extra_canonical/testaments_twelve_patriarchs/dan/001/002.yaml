base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/002.yaml
  text: Hear my words, sons of Dan, and pay attention to the words of your father.
translation:
  language: fr
  text: 'En effet, il convoqua sa famille et dit : « Fils de Dan, écoutez mes paroles et prêtez attention aux paroles de votre père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν πατρίαν αὐτοῦ
  choice: sa famille
  rationale: Dans ce contexte, πατριά désigne le groupe familial ou la parenté de Dan ; « sa famille » est clair et naturel en français moderne.
- source_word: Ἀκούσατε … λόγων μου
  choice: écoutez mes paroles
  rationale: Le verbe ἀκούω appelle ici une écoute attentive, tandis que λόγοι est rendu simplement par « paroles ».
- source_word: προσέχετε ῥήμασι
  choice: prêtez attention aux paroles
  rationale: Cette formulation restitue l’exhortation de προσέχετε et maintient le parallélisme avec le premier membre sans introduire une distinction artificielle entre λόγοι et ῥήματα.
- source_word: υἱοὶ Δάν
  choice: Fils de Dan
  rationale: Le vocatif est conservé littéralement ; il peut désigner les fils ou, plus largement, les descendants de Dan.
theological_decisions:
- issue: Portée de l’expression « fils de Dan »
  choice: Conserver « Fils de Dan » sans explicitation
  alternative: « Mes fils » ou « descendants de Dan »
  rationale: Le grec permet une adresse aux fils ou aux descendants de Dan. La traduction préserve cette latitude au lieu de la trancher.
translation_notes:
  register: Français moderne, digne et accessible. La proposition narrative présente dans la source grecque est conservée, bien qu’elle ne figure pas dans la couche anglaise fournie. Le parallélisme entre « mes paroles » et « les paroles de votre père » est maintenu.
