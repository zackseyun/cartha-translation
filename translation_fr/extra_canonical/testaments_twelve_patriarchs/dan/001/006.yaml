  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: fr
  text: 'Car l’esprit de jalousie et d’arrogance me répétait : « Toi aussi, tu es son fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς ἀλαζονείας
  choice: l’esprit de jalousie et d’arrogance
  rationale: Cette formulation naturelle en français conserve les deux traits coordonnés qui caractérisent l’esprit.
- source_word: ἔλεγέ μοι
  choice: me répétait
  rationale: L’imparfait grec présente une parole persistante ou répétée ; « me répétait » rend clairement cette nuance.
- source_word: Καίγε σὺ αὐτός
  choice: Toi aussi
  rationale: « Toi » exprime l’insistance portée par σὺ αὐτός, tandis que « aussi » rend καίγε sans alourdir la phrase.
theological_decisions:
- issue: Nature de « l’esprit »
  choice: Conserver « l’esprit » sans préciser s’il s’agit d’un être personnel ou d’une impulsion intérieure.
  alternative: Traduire par « un esprit » ou reformuler comme un sentiment psychologique.
  rationale: Le grec emploie πνεῦμα avec l’article, mais le passage ne tranche pas explicitement entre personnification et entité spirituelle ; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Les guillemets français distinguent clairement la parole rapportée ; la répétition de « de » est évitée pour une expression naturelle.
