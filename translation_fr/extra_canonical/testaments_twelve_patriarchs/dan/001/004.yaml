source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ὁμολογῶ οὖν ὑμῖν σήμερον²⁹, τέκνα μου³⁰, ὅτι ἐν καρδίᾳ μου ἐθέμην³¹ περὶ τοῦ θανάτου³² Ἰωσήφ, ⸀τοῦ ἀδελφοῦ μου⸁³³, *τοῦ ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: fr
  text: 'Je vous l’avoue donc aujourd’hui, mes enfants : en mon cœur, j’avais formé un dessein au sujet de la mort de Joseph, mon frère, cet homme bon et véritable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: Je vous l’avoue
  rationale: « Avouer » exprime ici une reconnaissance franche d’une intention coupable et convient naturellement au complément introduit par ὅτι.
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: dans mon cœur, j’avais résolu
  rationale: La tournure conserve l’image sémitisante du cœur comme siège de la décision et rend le moyen grec de τίθημι par une décision intérieure arrêtée.
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  choice: la mort de Joseph
  rationale: Dans ce contexte, περί avec le verbe de résolution désigne l’objet du dessein. La formulation française garde toutefois la concision du grec sans préciser un moyen ni ajouter explicitement « provoquer » ou « tuer ».
- source_word: ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ
  choice: cet homme bon et vrai
  rationale: « Bon et vrai » reproduit directement les deux qualités attribuées à Joseph; « vrai » préserve la portée ouverte de ἀληθινός, qui peut évoquer l’authenticité ou la véracité.
theological_decisions:
- issue: Nature exacte du dessein de Dan concernant la mort de Joseph
  choice: « j’avais résolu la mort de Joseph »
  alternative: « j’avais pris une résolution au sujet de la mort de Joseph »
  rationale: Le choix retenu indique un dessein dirigé contre Joseph, conformément au contexte et à la construction, sans ajouter au texte une formulation explicite telle que « j’avais décidé de tuer Joseph ». Il maintient ainsi une légère tension dans l’expression grecque.
translation_notes:
  register: Français moderne, digne et accessible. L’inversion affective « mes enfants » et l’apposition finale conservent le ton confessionnel et solennel du testament.
