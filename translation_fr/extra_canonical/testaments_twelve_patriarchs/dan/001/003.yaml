base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: fr
  text: J’ai constaté, dans mon cœur et tout au long de ma vie, que la vérité avec la pratique de la justice est bonne et agréable à Dieu, et que le mensonge et la colère sont mauvais et enseignent à l’être humain toute méchanceté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: J’ai éprouvé
  rationale: Rend l’idée d’avoir vérifié ou constaté par l’expérience, sans réduire le verbe à une simple réflexion intérieure.
- source_word: ἐν πάσῃ ζωῇ μου
  choice: tout au long de ma vie
  rationale: Formulation française naturelle exprimant l’étendue de l’expérience dans toute la vie du locuteur.
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: la vérité, accompagnée d’une conduite juste
  rationale: Préserve l’association entre vérité et pratique de ce qui est juste; « conduite juste » est clair et actuel.
- source_word: θυμός
  choice: colère
  rationale: Dans ce contexte moral, le terme désigne la colère ou l’emportement.
- source_word: πᾶσαν κακίαν
  choice: toute forme de méchanceté
  rationale: Rend naturellement en français la portée générale de πᾶσαν avec le sens moral de κακία.
- source_word: ἐκδιδάσκοντα
  choice: enseignent
  rationale: Conserve l’image forte selon laquelle le mensonge et la colère instruisent la personne dans le mal.
theological_decisions:
- issue: Accord et portée du participe ἐκδιδάσκοντα
  choice: « le mensonge et la colère […] enseignent »
  alternative: « la colère enseigne » ou une construction où seul un élément serait le sujet
  rationale: Malgré la difficulté formelle du participe grec, le sens contextuel le plus vraisemblable attribue conjointement au mensonge et à la colère l’action d’enseigner toute méchanceté, conformément au parallélisme de la phrase.
- issue: Relation entre vérité et δικαιοπραγία
  choice: La vérité est présentée avec une conduite juste
  alternative: Fondre les deux notions en « sincérité vertueuse »
  rationale: Maintient distinctes la vérité et la pratique juste, sans imposer une équivalence théologique entre elles.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique entre vérité/conduite juste et mensonge/colère est conservée, avec une syntaxe fluide.
