id: T12P.DAN.1.5
reference: Testament of Dan 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἔχαιρον ἐπὶ τῇ πράσει αὐτοῦ³⁵, ὅτι³⁶ *ὑπὲρ ἡμᾶς³⁷ *ὁ πατὴρ αὐτὸν ἠγάπα³⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/005.yaml
  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: fr
  text: Et je me réjouissais de ce qu’il avait été vendu, parce que notre père l’aimait plus que nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: je me réjouissais
  rationale: L’imparfait grec exprime ici un état ou un sentiment dans le passé; l’imparfait français le rend naturellement.
- source_word: ἐπὶ τῇ πράσει αὐτοῦ
  choice: de ce qu’il avait été vendu
  rationale: πρᾶσις désigne la vente. La tournure verbale française est plus naturelle que «de sa vente» et le plus-que-parfait situe clairement la vente avant la joie évoquée.
- source_word: ὑπὲρ ἡμᾶς
  choice: plus que nous
  rationale: 'Avec ἀγαπάω, ὑπέρ suivi de l’accusatif marque ici la comparaison: il l’aimait davantage que les autres frères.'
- source_word: ὁ πατὴρ
  choice: notre père
  rationale: Le grec dit littéralement «le père», mais le contexte familial et le pronom «nous» rendent «notre père» idiomatique et explicite en français sans modifier le référent.
- source_word: ἠγάπα
  choice: aimait
  rationale: L’imparfait rend l’affection durable exprimée par l’imparfait grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve sans l’atténuer l’aveu moralement troublant de la joie éprouvée devant la vente du frère.
