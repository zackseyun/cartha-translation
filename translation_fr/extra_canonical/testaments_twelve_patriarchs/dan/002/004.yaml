source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: fr
  text: 'Et maintenant, mes enfants, voici que je meurs. Je vous le dis en vérité : à moins que vous ne vous gardiez de l’esprit du mensonge et de la colère, et que vous n’aimiez la vérité et la patience, vous périrez.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la force présentative de l’impératif grec dans une tournure française naturelle et digne.
- source_word: φυλάξητε ἑαυτούς
  choice: vous ne vous gardiez
  rationale: Rend la vigilance active et réfléchie exprimée par le verbe et son pronom réfléchi.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: l’esprit du mensonge et de la colère
  rationale: Suit au plus près la construction grecque sans décider si la colère est une seconde qualification du même esprit ou un mal associé.
- source_word: μακροθυμίαν
  choice: la patience
  rationale: Terme français courant qui exprime ici l’endurance et la retenue prolongée face à la provocation.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Préserve la gravité du futur grec sans en préciser arbitrairement la nature physique, morale ou eschatologique.
theological_decisions:
- issue: Nature de « l’esprit du mensonge et de la colère »
  choice: Maintien littéral de « l’esprit » au singulier
  alternative: les dispositions au mensonge et à la colère
  rationale: Le texte personnifie ou conceptualise ces forces au moyen de πνεῦμα ; une paraphrase psychologique réduirait cette ambiguïté.
- issue: Portée de la condition introduite par ἐὰν μή
  choice: « à moins que… et que… »
  alternative: « si vous ne… et si vous ne… »
  rationale: Cette structure conserve l’unité de la condition grecque, qui associe le rejet du mensonge et de la colère à l’amour de la vérité et de la patience.
translation_notes:
  register: Français international moderne, direct et solennel. La phrase reste proche de la syntaxe exhortative grecque tout en étant divisée après l’annonce de la mort pour faciliter la lecture.
