source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, voici que je meurs. En vérité, je vous le dis : si vous ne vous gardez pas de l’esprit du mensonge et de la colère, et si vous n’aimez pas la vérité et la patience[a], vous périrez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la longanimité », c’est-à-dire la patience durable face aux offenses et aux provocations.'
    reason: Signale la portée plus précise possible de μακροθυμία sans alourdir le texte principal.
lexical_decisions:
- source_word: φυλάξητε ἑαυτούς
  choice: vous vous gardez
  rationale: Rend directement l’idée de se préserver soi-même d’une influence dangereuse, dans un français naturel.
- source_word: τὸ πνεῦμα τοῦ ψεύδους
  choice: l’esprit du mensonge
  rationale: Conserve l’expression grecque et son possible sens personnel, spirituel ou dispositionnel sans la réduire à une simple tendance.
- source_word: θυμός
  choice: colère
  rationale: Dans ce contexte d’exhortation morale, « colère » exprime clairement l’emportement ou la fureur visés.
- source_word: μακροθυμία
  choice: patience
  rationale: Choix courant et intelligible; le terme grec peut aussi désigner la longanimité, particulièrement face aux provocations.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Préserve la force de l’avertissement futur sans préciser une modalité de destruction que le grec ne fournit pas.
theological_decisions:
- issue: Nature de « l’esprit du mensonge »
  choice: Maintien de la formulation « l’esprit du mensonge »
  alternative: « la disposition au mensonge » ou « l’esprit mensonger »
  rationale: Le grec laisse ouverte la question de savoir s’il s’agit d’un être spirituel, d’une puissance ou d’une disposition intérieure; la traduction ne tranche pas.
- issue: Structure de la condition négative
  choice: Répétition de « si vous ne… pas » devant « aimez »
  alternative: « si vous ne vous gardez pas… et aimez… »
  rationale: En grec, la condition exige à la fois de se garder du mensonge et de la colère, et d’aimer la vérité et la patience. La répétition française évite de faire croire que l’amour de la vérité conduirait à périr.
translation_notes:
  register: Français moderne, digne et accessible. « Voici que je meurs » conserve la solennité de l’annonce, tandis que la ponctuation clarifie l’enchaînement de l’exhortation conditionnelle.
