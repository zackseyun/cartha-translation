source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: fr
  text: Et maintenant, mes enfants, voici, je meurs, et je vous dis en vérité que si vous ne vous gardez pas de l’esprit de mensonge et de colère, et si vous n’aimez pas la vérité et la patience, vous périrez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: voici que je vais mourir
  rationale: Cette tournure française naturelle conserve la solennité de ἰδού et rend le présent grec dans son sens imminent.
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: vous gardez de
  rationale: Rend l’idée de se tenir soi-même à l’écart d’une influence dangereuse, sans alourdir la phrase.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: l’esprit de mensonge et de colère
  rationale: Conserve le singulier « esprit » ainsi que les deux génitifs coordonnés, sans décider s’il s’agit d’un être personnel, d’une influence ou d’une disposition.
- source_word: μακροθυμία
  choice: patience
  rationale: Terme moderne et accessible qui exprime l’endurance et la retenue face à la provocation, particulièrement pertinente en contraste avec la colère.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Préserve la force du futur grec, qui annonce la ruine ou la perdition sans en préciser ici la nature.
theological_decisions:
- issue: Nature de « l’esprit de mensonge et de colère »
  choice: Maintien de l’expression littérale « l’esprit de mensonge et de colère »
  alternative: « les dispositions au mensonge et à la colère » ou « l’esprit du Mensonge et de la Colère »
  rationale: Le grec ne tranche pas explicitement entre une puissance personnelle et une disposition intérieure; la traduction conserve cette ambiguïté.
- issue: Portée de ἀπολεῖσθε
  choice: « vous périrez » sans précision supplémentaire
  alternative: « vous serez perdus » ou « vous serez détruits »
  rationale: Le contexte fourni ne permet pas de déterminer s’il s’agit principalement d’une ruine morale, physique ou eschatologique.
translation_notes:
  register: 'Français international moderne, solennel mais accessible. La ponctuation clarifie l’avertissement conditionnel tout en conservant les deux exigences coordonnées du grec : se garder du mal et aimer la vérité ainsi que la patience.'
