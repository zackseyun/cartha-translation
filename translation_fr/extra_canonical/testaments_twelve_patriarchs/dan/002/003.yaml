source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: fr
  text: 'Et maintenant, mes enfants, voici que je meurs. Je vous le dis en vérité : si vous ne vous gardez pas de l’esprit du mensonge et de la colère, et si vous n’aimez pas la vérité et la patience, vous périrez.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse affectueuse et solennelle du patriarche.
- source_word: φυλάξητε ἑαυτούς
  choice: vous gardez
  rationale: 'Conserve la valeur réfléchie de l’expression grecque : se tenir soi-même à l’écart d’une influence dangereuse.'
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: de l’esprit du mensonge et de la colère
  rationale: Suit la construction grecque sans décider si « esprit » désigne un être personnel, une influence ou une disposition.
- source_word: μακροθυμίαν
  choice: patience
  rationale: Dans cette opposition à la colère, « patience » exprime naturellement la maîtrise durable de soi et la capacité à supporter sans s’emporter.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Reproduit la force de l’avertissement futur sans préciser une forme de ruine que le grec ne définit pas.
theological_decisions:
- issue: Nature de « l’esprit du mensonge et de la colère »
  choice: Conserver la formulation « l’esprit du mensonge et de la colère »
  alternative: Interpréter comme « la disposition au mensonge et à la colère » ou comme un esprit mauvais personnel
  rationale: Le grec permet une portée personnelle ou dispositionnelle ; la traduction préserve cette ambiguïté.
- issue: Portée de ἀπολεῖσθε
  choice: « vous périrez »
  alternative: « vous serez perdus » ou « vous vous perdrez »
  rationale: La formulation retenue garde la gravité et l’indétermination du verbe grec, sans imposer une lecture exclusivement physique ou eschatologique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation répartit la longue période grecque en deux phrases pour une lecture naturelle, tout en conservant sa logique conditionnelle. Le texte suit le grec fourni plutôt que la couche anglaise, qui correspond manifestement à un autre passage.
