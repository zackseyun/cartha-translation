base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, voici que je vais mourir. Je vous le dis en vérité : à moins que vous ne vous gardiez de l’esprit de mensonge et de colère et n’aimiez la vérité et la patience, vous périrez.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ ἐγὼ ἀποθνῄσκω
  choice: voici que je vais mourir
  rationale: Rend l’annonce imminente exprimée par ἰδού avec le présent grec, dans un français naturel et solennel.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: de l’esprit de mensonge et de colère
  rationale: 'Conserve la construction grecque et son ambiguïté possible : un même esprit caractérisé par le mensonge et la colère, ou l’influence spirituelle associée à ces deux réalités.'
- source_word: μακροθυμίαν
  choice: la patience
  rationale: Terme français courant couvrant l’endurance patiente et la maîtrise de soi dans les relations, sans recourir au plus archaïque « longanimité ».
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Préserve la force du futur grec et sa portée ouverte, sans préciser s’il s’agit d’une ruine physique, morale ou eschatologique.
theological_decisions:
- issue: Nature de « l’esprit de mensonge et de colère »
  choice: Maintenir l’expression personnelle ou spirituelle « l’esprit de… »
  alternative: Paraphraser par « la tendance au mensonge et à la colère »
  rationale: Le grec πνεῦμα peut désigner un esprit ou une disposition. La traduction retenue conserve cette tension sans imposer une lecture psychologique ou démonologique.
- issue: Portée de la perdition annoncée
  choice: « vous périrez » sans qualification
  alternative: « vous serez perdus » ou « vous vous perdrez »
  rationale: Le verbe ἀπόλλυμι est fort mais ne définit pas ici la nature exacte de la perdition; il convient de ne pas résoudre cette indétermination.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La structure conditionnelle a été explicitée par la répétition de « si » afin d’éviter que « à moins que » ne rende maladroitement la coordination négative grecque. Le projet anglais contient une suite absente de l’extrait grec fourni; le présent draft se limite donc au texte grec attesté pour cette unité.
