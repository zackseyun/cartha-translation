  source_fidelity: La condition grecque ἐὰν μὴ φυλάξητε … καὶ ἀγαπήσητε exprime que les destinataires doivent à la fois se garder de l’esprit de mensonge et de colère et aimer la vérité et la patience. La formulation proposée, avec deux propositions introduites par « si … et si … », peut faire dépendre la perdition du cumul de deux manquements et affaiblit cette structure. Le reste rend fidèlement les termes principaux, notamment πνεῦμα, ψεῦδος, θυμός, μακροθυμία et ἀπολεῖσθε.
  naturalness: Le français est clair, moderne et d’un registre convenablement solennel. « À moins que vous ne vous gardiez … et n’aimiez … » rend naturellement la portée conditionnelle conjointe du grec; le « ne » y est explétif après « à moins que » et ne doit pas être compris comme une négation supplémentaire.
  terminology: « L’esprit de mensonge et de colère », « la vérité », « la patience » et « vous périrez » sont des choix justes et suffisamment ouverts. Ils ne tranchent pas indûment la question de savoir si « esprit » désigne une puissance personnelle ou une disposition, ni la nature de la perdition.
