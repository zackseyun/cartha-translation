base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: fr
  text: '7 Après avoir dit cela, il les embrassa avec affection et s’endormit d’un doux sommeil.


    2 Ses fils l’ensevelirent. Ensuite, ils transportèrent ses ossements jusqu’au lieu où se trouvaient Abraham, Isaac et Jacob.


    3 Cependant, Dan leur avait prophétisé qu’ils oublieraient leur Dieu et deviendraient étrangers à la terre de leur héritage, au peuple d’Israël et à la famille de leurs descendants.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le témoin grec fourni ici, la phrase se poursuit seulement jusqu’au début du mot « oublieraient »; la suite du verset est conservée d’après le texte établi et la tradition parallèle consultée.
    reason: Signaler honnêtement que l’extrait grec transmis dans les données est lacunaire à cet endroit.
lexical_decisions:
- source_word: καταφιλήσας
  choice: il les embrassa avec affection
  rationale: Le verbe intensif exprime des baisers affectueux; cette formulation naturelle conserve cette nuance.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: s’endormit d’un doux sommeil
  rationale: Conserve l’image euphémique du sommeil sans expliciter la mort au-delà du grec.
- source_word: ἀπήνεγκαν
  choice: ils firent monter
  rationale: Rend la direction ascendante retenue par la tradition textuelle et évite de réduire le verbe à un simple transport.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: ses ossements
  rationale: Équivalent français idiomatique du pluriel grec dans un contexte de transfert funéraire.
- source_word: Πλὴν οὖν
  choice: Cependant
  rationale: Marque sobrement la transition contrastive sans la surcharger.
theological_decisions:
- issue: Le sommeil comme désignation de la mort
  choice: s’endormit d’un doux sommeil
  alternative: mourut paisiblement
  rationale: La traduction maintient la métaphore et sa possible portée théologique au lieu de l’interpréter explicitement.
- issue: Rapport futur d’Israël à Dieu et à son héritage
  choice: ils oublieraient leur Dieu et deviendraient étrangers
  alternative: ils abandonneraient leur Dieu et seraient chassés
  rationale: Cette formulation préserve la distinction entre oubli de Dieu et éloignement identitaire ou territorial, sans transformer la prophétie en expulsion explicite.
translation_notes:
  register: Français international moderne, narratif et digne. « Ensevelirent », « ossements » et « terre de leur héritage » gardent une tonalité testamentaire accessible; les formulations évitent aussi bien l’archaïsme excessif que la paraphrase doctrinale.
