review_pass:
  verdict: revise
  source_fidelity: Le récit est fidèlement rendu dans l’ensemble. Toutefois, ἀπήνεγκαν signifie « emportèrent/transportèrent »; le grec fourni ne comporte pas de préfixe ou d’indication qui justifierait « firent monter », formulation à la fois causative et directionnelle. Le v. 3 est lacunaire dans l’extrait grec communiqué; la note signale à juste titre cette limite, tandis que le texte suit la suite transmise dans l’audit anglais.
  naturalness: Le français est naturel, sobre et adapté à un registre testamentaire moderne. « S’endormit d’un doux sommeil », « ossements » et « terre de leur héritage » sont idiomatiques dans ce contexte. Le remplacement par « transportèrent » est plus direct et ne suggère pas un déplacement vers le haut absent du grec cité.
  terminology: Les noms propres, « Dieu », « héritage », « peuple d’Israël » et la formulation non confessionnelle de la mort comme sommeil sont appropriés. « Famille de leurs descendants » conserve, sans la résoudre, la formulation généalogique inhabituelle de la tradition transmise.
  issues:
  - severity: medium
    issue: « ils firent monter ses ossements » pour ἀπήνεγκαν
    rationale: Le verbe signifie transporter ou emporter; il n’exprime ni une action causative (« firent ») ni nécessairement une montée. La traduction doit éviter d’importer cette direction depuis l’audit anglais lorsque le grec fourni ne l’indique pas.
