  text: ⌈Καὶ⌉⁶⁹ διὰ τοῦτο ἀπαχθήσεσθε⁷⁰ [σὺν αὐτοῖς]⁷¹ *εἰς αἰχμαλωσίαν⁷², κἀκεῖ ἀπολήψεσθε⁷³ *πάσας τὰς πληγὰς Αἰγύπτου⁷⁴ καὶ πάσας τὰς⁷⁵ πονηρίας⁷⁶ τῶν ἐθνῶν.
