base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: fr
  text: C’est pourquoi vous serez emmenés avec eux en captivité ; et là, vous subirez toutes les plaies d’Égypte et tous les maux des nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  choice: vous serez emmenés
  rationale: Le passif futur exprime le fait d’être conduit de force, avec une formulation naturelle en français.
- source_word: εἰς αἰχμαλωσίαν
  choice: en captivité
  rationale: Rend directement l’idée d’exil et de captivité sans ajouter de précision absente du grec.
- source_word: ἀπολήψεσθε
  choice: vous subirez
  rationale: Dans le contexte de plaies et de maux, « subir » exprime idiomatiquement le fait d’en recevoir les effets.
- source_word: πληγὰς Αἰγύπτου
  choice: plaies d’Égypte
  rationale: Expression biblique française claire, conservant l’allusion aux fléaux d’Égypte.
- source_word: πονηρίας τῶν ἐθνῶν
  choice: maux des nations
  rationale: « Maux » préserve ici la portée large de πονηρίας, qui peut désigner des réalités mauvaises ou des calamités, sans imposer uniquement le sens moral.
theological_decisions:
- issue: Portée de πονηρίας
  choice: maux
  alternative: méchancetés
  rationale: Le contexte parallèle avec les « plaies » favorise une formulation englobant les malheurs subis, tout en laissant subsister une possible dimension morale.
- issue: Présence de σὺν αὐτοῖς dans une variante signalée
  choice: avec eux
  alternative: omission de l’expression
  rationale: L’expression figure dans le texte source entre crochets et dans la couche anglaise auditée ; elle est retenue dans le corps du texte sans surinterpréter l’identité du référent.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve le parallélisme entre les plaies d’Égypte et les maux des nations.
