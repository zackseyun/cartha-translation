source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: fr
  text: Et pour vous, le salut du Seigneur se lèvera de la tribu de Juda[a] et de Lévi. Car lui-même fera la guerre à Béliar et accordera à vos pères la vengeance de la victoire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Juda et » est entre crochets dans l’édition grecque citée, ce qui signale une difficulté textuelle. Le singulier « la tribu » est conservé.
    reason: Signale au point pertinent l’incertitude textuelle affectant la coordination « Juda et Lévi », sans la résoudre ni normaliser le singulier grec.
  - marker: b
    text: 'Le texte grec de la dernière proposition est incertain et son expression est inhabituelle; on pourrait aussi comprendre : « il donnera à vos pères une revanche victorieuse » ou « la rétribution de la victoire ».'
    reason: Conserve le signalement de l’incertitude textuelle, notamment autour de « pères », ainsi que de l’ambiguïté de τὴν ἐκδίκησιν τοῦ νίκους.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Conserve l’image de quelque chose qui se lève ou surgit, souvent employée pour un astre ou une lumière, sans préciser davantage la métaphore.
- source_word: τὸ σωτήριον Κυρίου
  choice: le salut du Seigneur
  rationale: Rend naturellement le substantif grec tout en conservant l’ambiguïté entre le salut comme action et sa manifestation concrète.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, désignant ici la puissance adverse personnifiée.
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: la vengeance de la victoire
  rationale: Traduction volontairement formelle d’une expression grecque inhabituelle, afin de ne pas trancher entre vengeance victorieuse, revanche menant à la victoire et rétribution liée à la victoire.
- source_word: τοῖς πατράσιν ὑμῶν
  choice: à vos pères
  rationale: Suit le texte grec transmis, malgré l’incertitude textuelle signalée sur « pères ».
theological_decisions:
- issue: Référent personnel de « lui-même »
  choice: lui-même
  alternative: celui-ci / le Sauveur
  rationale: Le grec passe du neutre « salut » au masculin αὐτός. La traduction préserve cette tension grammaticale et l’implication personnelle sans identifier explicitement le référent.
- issue: Origine tribale du salut
  choice: de la tribu de Juda et de Lévi
  alternative: des tribus de Juda et de Lévi
  rationale: Conserve le singulier φυλῆς et la coordination textuelle étrange, sans normaliser en deux tribus distinctes ni résoudre une possible difficulté de transmission.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec aux endroits où le texte présente une ambiguïté réelle; « Béliar » est maintenu comme nom propre ancien.
