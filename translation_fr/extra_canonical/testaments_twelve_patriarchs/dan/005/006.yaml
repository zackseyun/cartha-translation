source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: fr
  text: Car j’ai lu dans le livre d’Hénoch le juste et j’ai appris que votre chef est Satan, et que les esprits de méchanceté et d’orgueil obéiront en se tenant auprès des fils de Lévi[a], afin de les faire pécher devant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est difficile. On peut aussi comprendre : « recevront l’ordre de se tenir auprès des fils de Lévi » ou simplement « se tiendront auprès des fils de Lévi ».'
    reason: Signaler l’incertitude syntaxique de ὑπακούσονται τοῦ παρεδρεύειν et préserver les principales possibilités sans en imposer une.
lexical_decisions:
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: Hénoch le juste
  rationale: Le génitif appositif désigne Hénoch par le qualificatif « le juste » ; cette formulation est naturelle et conserve le titre honorifique.
- source_word: ἄρχων
  choice: chef
  rationale: « Chef » exprime ici l’autorité exercée par Satan sans imposer le sens politique plus étroit de « prince » ou de « souverain ».
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: les esprits de méchanceté et d’orgueil
  rationale: La formulation conserve les deux génitifs abstraits, qui peuvent caractériser la nature ou le domaine d’action de ces esprits.
- source_word: παρεδρεύειν
  choice: se tenir auprès de
  rationale: Le verbe évoque le fait de siéger ou de demeurer à côté de quelqu’un ; « se tenir auprès de » reste intelligible sans préciser abusivement la fonction de cette présence.
- source_word: ἐξαμαρτάνειν ἐνώπιον Κυρίου
  choice: faire pécher devant le Seigneur
  rationale: Cette traduction maintient la causalité exprimée par ποιεῖν et la dimension relationnelle et judiciaire de « devant le Seigneur ».
theological_decisions:
- issue: Identité du chef des destinataires
  choice: « votre chef est Satan »
  alternative: « celui qui vous gouverne est Satan »
  rationale: La traduction directe préserve l’affirmation forte du texte sans définir davantage la nature ou l’étendue de cette autorité.
- issue: Action des esprits auprès des fils de Lévi
  choice: « obéiront en se tenant auprès » avec note
  alternative: « seront aux côtés des fils de Lévi » ou « recevront l’ordre de se tenir auprès »
  rationale: Le grec transmis associe ὑπακούσονται à un infinitif au génitif de construction difficile. Le texte principal conserve à la fois l’idée d’obéissance et celle de présence auprès des fils de Lévi, sans fournir un donneur d’ordre absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Deux phrases remplacent la longue coordination grecque afin d’assurer la clarté, tout en conservant les relations logiques. Le vocabulaire reste sobre et proche des images du texte source.
