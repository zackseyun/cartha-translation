  to: Et Jérusalem ne subira plus la dévastation, ni Israël ne sera plus emmené en captivité, car le Seigneur sera au milieu d’elle, [demeurant parmi les humains], le Saint d’Israël, régnant sur elle [dans l’humilité et la pauvreté ; et celui qui croit en lui régnera parmi les humains en vérité].[a]
  rationale: La révision corrige la coordination négative et la syntaxe française du participe, sans transformer βασιλεύων en futur fini. Elle remplace aussi « véritablement » par « en vérité » afin de conserver plus explicitement le sens de ἐν ἀληθείᾳ. Les crochets, le pronom ambigu « en lui » et la note textuelle sont préservés.
