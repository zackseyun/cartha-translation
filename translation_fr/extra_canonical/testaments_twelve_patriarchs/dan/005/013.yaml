base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: fr
  text: Et Jérusalem ne subira plus la dévastation, ni Israël ne sera plus emmené en captivité, car le Seigneur sera au milieu d’elle, [demeurant parmi les humains], le Saint d’Israël, régnant sur elle [dans l’humilité et la pauvreté ; et celui qui croit en lui régnera parmi les humains en vérité].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots placés entre crochets ont un statut textuel incertain dans l’édition grecque utilisée.
    reason: Signaler au lecteur que les segments entre crochets ne bénéficient pas du même degré d’attestation textuelle que le reste du verset.
lexical_decisions:
- source_word: ὑπομενεῖ
  choice: subira
  rationale: Dans ce contexte, le verbe signifie supporter ou connaître encore la dévastation ; « subira » est naturel et fidèle en français.
- source_word: ἐρήμωσιν
  choice: la dévastation
  rationale: Le terme désigne l’état ou l’action de rendre désert, avec l’idée de ruine ; « dévastation » convient au contexte de Jérusalem.
- source_word: αἰχμαλωτισθήσεται
  choice: sera emmené en captivité
  rationale: Le passif exprime la capture et la déportation ; cette formulation française en restitue clairement les deux dimensions.
- source_word: ἐν μέσῳ αὐτῆς
  choice: au milieu d’elle
  rationale: Conserve le référent féminin, Jérusalem, et la formulation spatiale du grec.
- source_word: συναναστρεφόμενος
  choice: vivant parmi
  rationale: Le participe évoque le fait de séjourner, de vivre et d’avoir commerce avec des personnes ; « vivant parmi » est idiomatique sans surinterprétation.
- source_word: βασιλεύων
  choice: régnant
  rationale: Le participe présent est conservé plutôt que transformé en futur explicite, maintenant la dépendance syntaxique et la tension du texte grec.
- source_word: ἐν ἀληθείᾳ
  choice: véritablement
  rationale: L’expression peut être adverbiale, « en vérité » ou « véritablement » ; ce choix donne un français fluide tout en gardant l’idée de réalité et de vérité.
theological_decisions:
- issue: Rapport syntaxique entre « le Seigneur » et « le Saint d’Israël »
  choice: Conserver « et le Saint d’Israël régnant sur elle » sous forme participiale
  alternative: « et le Saint d’Israël régnera sur elle »
  rationale: Le grec porte ἔσται pour le Seigneur puis le participe βασιλεύων. Ne pas ajouter un second futur préserve la construction et son ambiguïté quant à l’apposition ou à la coordination.
- issue: Référent du pronom dans « celui qui croit en lui »
  choice: Maintenir « en lui » sans explicitation
  alternative: Nommer « le Seigneur » ou « le Saint d’Israël »
  rationale: Le référent de αὐτῷ n’est pas entièrement explicité dans la phrase ; la traduction conserve cette ambiguïté.
- issue: Passages entre crochets dans l’édition source
  choice: Les conserver entre crochets et ajouter une note
  alternative: Les intégrer sans signalement ou les omettre
  rationale: Les crochets témoignent d’une incertitude textuelle ou d’un statut éditorial particulier qu’une traduction fondée sur la source doit rendre visible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les parallélismes, les images de captivité et de règne, ainsi que le participe inhabituel « régnant », nécessaire pour refléter la syntaxe grecque. « Humains » rend ἀνθρώποις de manière inclusive et actuelle.
