source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: fr
  text: Il reprendra à Béliar les captifs — les âmes des saints[a] —, ramènera au Seigneur les cœurs désobéissants et donnera une paix éternelle à ceux qui l’invoquent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « les âmes des saints » sont textuellement incertains dans la tradition grecque.
    reason: L’édition source place cette expression entre crochets, signalant un doute textuel qu’il convient de rendre visible sans supprimer les mots du texte principal.
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: Il reprendra à Béliar les captifs
  rationale: Le nom collectif αἰχμαλωσία peut désigner la captivité ou l’ensemble des captifs. L’apposition « les âmes des saints » favorise ici le sens personnel et collectif. « Reprendra à » exprime naturellement l’idée de les soustraire au pouvoir de Béliar.
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: les âmes des saints
  rationale: Traduction directe qui conserve le vocabulaire anthropologique du grec et la relation appositionnelle avec les captifs.
- source_word: ἐπιστρέψει καρδίας ἀπειθεῖς πρὸς Κύριον
  choice: ramènera au Seigneur les cœurs désobéissants
  rationale: ἐπιστρέφω avec πρός exprime ici un retournement ou un retour vers le Seigneur. « Désobéissants » rend ἀπειθεῖς sans réduire le terme à une simple incrédulité intellectuelle.
- source_word: τοῖς ἐπικαλουμένοις αὐτόν
  choice: à ceux qui l’invoquent
  rationale: « Invoquer » est une formulation française naturelle et digne pour ἐπικαλέομαι dans un contexte religieux. Le pronom « l’ » préserve l’identification implicite de son référent.
- source_word: εἰρήνην αἰώνιον
  choice: une paix éternelle
  rationale: Rendu formel et idiomatique des deux termes grecs, sans préciser davantage la nature de cette paix.
theological_decisions:
- issue: Référent de « αὐτόν » dans « ceux qui l’invoquent »
  choice: Conserver le pronom « l’ » sans expliciter son référent
  alternative: Écrire « ceux qui invoquent le Seigneur » ou « ceux qui l’invoquent, lui »
  rationale: Le grec emploie un pronom masculin dont le référent peut être compris à partir du Seigneur mentionné juste avant ou du personnage qui agit dans l’ensemble du verset. La traduction ne tranche pas une ambiguïté que le texte laisse subsister.
- issue: Nature des personnes délivrées de Béliar
  choice: Présenter « les âmes des saints » comme une apposition à « les captifs »
  alternative: Traduire « il ôtera à Béliar la captivité, celle des âmes des saints »
  rationale: La syntaxe appositionnelle du grec identifie vraisemblablement les captifs aux âmes des saints, tout en évitant d’ajouter une explication doctrinale sur leur état.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le mouvement ternaire du grec et emploie « Béliar », forme traditionnelle du nom propre dans ce corpus. Les tirets rendent clairement l’apposition sans alourdir la syntaxe.
