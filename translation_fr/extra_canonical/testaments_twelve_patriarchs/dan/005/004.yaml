id: T12P.DAN.5.4
reference: Testament of Dan 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: fr
  text: Je sais que, dans les derniers jours, vous vous détournerez du Seigneur, vous irriterez Lévi et vous vous rangerez en ordre de bataille contre Juda, mais vous ne l’emporterez pas sur eux. Car un ange du Seigneur les guide tous les deux, parce que c’est en eux qu’Israël tiendra ferme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε τοῦ Κυρίου
  choice: vous vous détournerez du Seigneur
  rationale: Exprime naturellement l’idée de s’éloigner ou de faire défection, sans imposer un sens doctrinal plus précis.
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: vous irriterez Lévi
  rationale: Le verbe indique qu’on provoque l’irritation ou l’indignation de Lévi.
- source_word: πρὸς τῷ Ἰουδὰ παρατάξεσθε
  choice: vous vous rangerez en ordre de bataille contre Juda
  rationale: παρατάσσομαι appartient au registre militaire et décrit le fait de se ranger pour affronter un adversaire.
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: vous ne l’emporterez pas sur eux
  rationale: Rend idiomatiquement l’incapacité à résister victorieusement à Lévi et Juda.
- source_word: ὁδηγεῖ ἑκατέρους
  choice: les guide tous les deux
  rationale: ἑκατέρους renvoie distributivement aux deux figures nommées, Lévi et Juda.
- source_word: ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: c’est en eux qu’Israël tiendra ferme
  rationale: Conserve la préposition ἐν et le sens de stabilité ou de maintien porté par στήσεται.
theological_decisions:
- issue: Référent de « eux » dans la dernière proposition
  choice: Conserver « en eux », renvoyant à Lévi et Juda
  alternative: Traduire « par eux » et présenter Lévi et Juda comme les agents du relèvement d’Israël
  rationale: Le grec ἐν αὐτοῖς signifie littéralement « en eux »; cette formulation préserve l’ambiguïté entre fondement, sphère et moyen.
- issue: Fonction de l’ange du Seigneur
  choice: « un ange du Seigneur »
  alternative: « l’ange du Seigneur »
  rationale: L’absence d’article devant ἄγγελος favorise ici l’indéfini; il ne convient pas d’identifier davantage cette figure.
translation_notes:
  register: Français moderne, digne et accessible. Le tour militaire « se ranger en ordre de bataille » garde la force du grec; « tenir ferme » restitue l’idée de stabilité sans effacer la tension de la proposition finale.
