  source_fidelity: 'Le texte rend avec précision les principaux éléments grecs : l’abandon du Seigneur (ἀποστήσεσθε τοῦ Κυρίου), l’irritation provoquée chez Lévi, la mise en ordre de bataille contre Juda, l’incapacité à l’emporter sur les deux, et la conduite des deux par un ange du Seigneur. « C’est en eux qu’Israël tiendra ferme » conserve utilement la préposition ἐν et ne tranche pas indûment entre les nuances possibles de lieu, d’appui ou de moyen.'
  naturalness: 'Français moderne, clair et d’un registre convenant à un écrit testamentaire ancien. « Se ranger en ordre de bataille » restitue naturellement la coloration militaire de παρατάξεσθε. La répétition pronominale demeure intelligible : « eux » désigne Lévi et Juda.'
