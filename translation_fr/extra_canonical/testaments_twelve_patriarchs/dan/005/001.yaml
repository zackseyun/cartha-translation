base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: fr
  text: Ainsi donc, mes enfants, gardez le commandement du Seigneur et observez sa loi. Éloignez-vous de la colère et détestez le mensonge, afin que le Seigneur habite en vous et que Béliar fuie loin de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: gardez
  rationale: Rend l’idée de veiller fidèlement sur le commandement et de s’y conformer.
- source_word: τηρήσατε
  choice: observez
  rationale: Expression française naturelle pour la mise en pratique fidèle d’une loi, tout en distinguant ce verbe de Φυλάξατε.
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  choice: Éloignez-vous de la colère
  rationale: Traduit l’impératif de se détourner ou de se tenir à distance de la colère dans un français courant et digne.
- source_word: μισήσατε τὸ ψεῦδος
  choice: détestez le mensonge
  rationale: Conserve la force de μισέω sans suggérer ici la haine d’une personne.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: habite en vous
  rationale: Préserve la préposition ἐν et l’ambiguïté du pluriel, qui peut viser les personnes du groupe ou la communauté collectivement.
- source_word: φεύξεται ἀφ᾽ ὑμῶν
  choice: fuie loin de vous
  rationale: Rend à la fois le mouvement de fuite et l’éloignement exprimé par ἀπό.
theological_decisions:
- issue: Valeur de ἵνα suivi de deux futurs
  choice: afin que… habite… et que… fuie
  alternative: de sorte que… habitera… et… fuira
  rationale: La tournure finale exprime naturellement le but recherché par les impératifs, sans exclure une nuance de résultat.
- issue: Portée de ἐν ὑμῖν
  choice: en vous
  alternative: parmi vous
  rationale: « En vous » suit de plus près le grec et maintient ouverte la portée individuelle ou communautaire, sans trancher théologiquement.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des exhortations est conservé, avec une distinction naturelle entre « gardez » et « observez ». Le nom Βελίαρ est translittéré « Béliar ».
