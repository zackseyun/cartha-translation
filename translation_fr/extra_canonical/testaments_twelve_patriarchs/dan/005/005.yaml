revisions:
- from: Et lorsque vous vous détournerez du Seigneur, vous marcherez dans toute forme de méchanceté et commettrez les abominations des nations, vous livrant à la débauche avec des femmes sans loi ; et toute forme de mal agira parmi vous par l’intermédiaire des esprits de méchanceté.
  to: Et chaque fois que vous vous détournerez du Seigneur, marchant dans toute forme de méchanceté, vous commettrez les abominations des nations, vous livrant à la débauche avec des femmes sans loi, tandis que les esprits de méchanceté agiront en vous dans toute sorte de mal.
  rationale: La révision rétablit les esprits de méchanceté comme agents de ἐνεργούντων et conserve l'ambiguïté de leur mode d'action, sans adopter l'analyse plus interprétative de la couche anglaise. Elle maintient les futures principales et rend les participes grecs par des formes participiales françaises et une proposition circonstancielle naturelle.
