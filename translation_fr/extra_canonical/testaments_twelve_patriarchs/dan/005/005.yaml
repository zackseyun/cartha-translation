source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: fr
  text: Et chaque fois que vous vous détournerez du Seigneur, marchant dans toute forme de méchanceté, vous commettrez les abominations des nations, vous livrant à la débauche avec des femmes sans loi, tandis que les esprits de méchanceté agiront en vous dans toute sorte de mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: vous vous détournerez du Seigneur
  rationale: Rend naturellement l’idée de s’éloigner ou d’abandonner le Seigneur, sans durcir inutilement le terme en « apostasier ».
- source_word: ἐν πάσῃ κακίᾳ πορευόμενοι
  choice: vous marcherez dans toute forme de méchanceté
  rationale: Conserve la métaphore biblique de la marche et exprime la portée générale de πᾶς.
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: les abominations des nations
  rationale: Traduction formelle et intelligible de l’expression cultuelle et morale grecque.
- source_word: ἐκπορνεύοντες ἐν γυναιξὶν ἀνόμων
  choice: vous livrant à la débauche avec des femmes sans loi
  rationale: ἐκπορνεύω désigne ici l’inconduite sexuelle ; « femmes sans loi » maintient la formulation inhabituelle du grec et son ambiguïté.
- source_word: ἐν πάσῃ πονηρίᾳ
  choice: toute forme de mal
  rationale: Évite une répétition française lourde avec κακία tout en conservant la distinction lexicale.
- source_word: ἐνεργούντων ἐν ὑμῖν τῶν πνευμάτων τῆς πονηρίας
  choice: agira parmi vous par l’intermédiaire des esprits de méchanceté
  rationale: Suit l’analyse reflétée par le texte de consultation, où les esprits sont les agents du mal, tout en rendant ἐν ὑμῖν par « parmi vous ».
theological_decisions:
- issue: Nature de l’éloignement du Seigneur
  choice: vous vous détournerez du Seigneur
  alternative: vous apostasierez loin du Seigneur
  rationale: Le verbe peut évoquer l’apostasie, mais la traduction choisie préserve une portée plus large et naturelle sans imposer un terme théologique technique.
- issue: Agent de l’action mauvaise dans la proposition finale
  choice: le mal agira par l’intermédiaire des esprits de méchanceté
  alternative: les esprits de méchanceté agiront en vous dans toute forme de mal
  rationale: La syntaxe transmise est difficile et comporte une leçon éditorialement incertaine. Le choix suit la compréhension retenue par la couche anglaise auditée sans nier l’autre construction possible.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore « marcher » et les expressions « abominations des nations » et « esprits de méchanceté » sont conservées en raison de leur poids scripturaire. La ponctuation clarifie les deux conséquences futures sans effacer la syntaxe accumulative du grec.
