source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: fr
  text: Et les saints trouveront le repos en Éden, et les justes se réjouiront au sujet de la nouvelle Jérusalem, qui est la gloire éternelle de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: trouveront le repos
  rationale: Rend naturellement le futur moyen grec avec l’idée de repos accordé ou trouvé, sans surinterprétation.
- source_word: ἅγιοι
  choice: les saints
  rationale: Équivalent français courant et digne pour désigner ceux qui sont consacrés à Dieu.
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: au sujet de la nouvelle Jérusalem
  rationale: Préserve la valeur de ἐπί avec le génitif, ici comprise comme l’objet ou le motif de la joie, plutôt que comme un lieu où elle se déroule.
- source_word: εὐφρανθήσονται
  choice: se réjouiront
  rationale: Exprime directement la joie annoncée par le futur passif à valeur intransitive.
- source_word: δόξα θεοῦ αἰώνιος
  choice: la gloire éternelle de Dieu
  rationale: Conserve l’ordre sémantique et l’ambiguïté normale du génitif θεοῦ.
theological_decisions:
- issue: Référent et valeur explicative de ἥτις
  choice: « qui est », avec pour antécédent « la nouvelle Jérusalem »
  alternative: « car elle est »
  rationale: Le relatif qualitatif ἥτις rattache directement la proposition à Jérusalem et la caractérise, sans transformer explicitement la relation en causalité.
- issue: Relation des justes à la nouvelle Jérusalem
  choice: Ils se réjouissent « au sujet de » celle-ci
  alternative: Ils se réjouissent « dans » ou « sur » celle-ci
  rationale: Cette formulation maintient la distinction entre ἐπί suivi du génitif et une localisation plus directe, tout en restant idiomatique en français.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre « les saints » et « les justes » est conservé, ainsi que les deux futurs eschatologiques.
