source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: fr
  text: Et mes fils se rapprochent de Lévi et pèchent avec eux en toutes choses. Mais les fils de Juda seront cupides, s’emparant comme des lions de ce qui appartient à autrui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντες
  choice: se rapprochent de
  rationale: Le participe présent est rendu par un présent progressif naturel en français, sans lui donner la valeur future d’une tradition textuelle secondaire.
- source_word: συναμαρτάνοντες αὐτοῖς
  choice: pèchent avec eux
  rationale: Cette formulation conserve l’idée de participation commune au péché. Le pluriel « eux » reprend naturellement Lévi comme groupe tribal.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Rendu formel qui conserve l’étendue générale de l’expression grecque sans préciser artificiellement la nature des actes.
- source_word: ἐν πλεονεξίᾳ
  choice: livrés à la cupidité
  rationale: « Cupidité » exprime le désir avide d’acquérir davantage; « livrés à » restitue idiomatiquement l’état introduit par ἐν, sans réduire la proposition à un simple adjectif.
- source_word: ἁρπάζοντες ἀλλότρια
  choice: s’emparant de ce qui appartient à autrui
  rationale: Rend à la fois l’action prédatrice de ἁρπάζω et le sens substantivé d’ἀλλότρια, les biens ou choses appartenant à d’autres.
- source_word: ὡς λέοντες
  choice: comme des lions
  rationale: Conservation directe de la comparaison animale et de sa force prédatrice.
theological_decisions:
- issue: Référent pluriel de αὐτοῖς après Λευί
  choice: « eux », compris collectivement comme les membres de la tribu de Lévi
  alternative: « lui », en accord grammatical avec le nom propre singulier Lévi
  rationale: Le grec emploie explicitement le pluriel αὐτοῖς; la traduction le préserve plutôt que de normaliser l’accord, tout en laissant le contexte tribal expliquer ce pluriel.
- issue: Valeur temporelle des participes de la première proposition
  choice: 'présent : « se rapprochent » et « pèchent »'
  alternative: 'futur : « se rapprocheront » et « pécheront »'
  rationale: Les participes présents avec εἰσι décrivent littéralement une action en cours ou caractéristique. Le futur explicite ἔσονται n’apparaît que dans la proposition concernant Juda.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en évitant le calque peu idiomatique « seront dans la cupidité ». « Ce qui appartient à autrui » est clair pour un lectorat général et conserve la portée indéfinie du neutre pluriel grec.
