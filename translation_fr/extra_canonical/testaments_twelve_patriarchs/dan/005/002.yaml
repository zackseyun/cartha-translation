base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: fr
  text: Dites la vérité, chacun à son prochain, et vous ne tomberez certainement pas dans la colère ni dans les troubles. Au contraire, vous serez en paix, ayant avec vous le Dieu de paix, et aucune guerre ne triomphera de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: Dites la vérité
  rationale: Rend directement l’exhortation à parler vrai dans un français naturel et digne.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: à son prochain
  rationale: Conserve le sens relationnel de πλησίον et la tournure distributive « chacun… son prochain ».
- source_word: μῆνιν
  choice: la colère
  rationale: Le terme désigne une colère intense; « colère » reste clair sans surinterpréter sa durée ou sa violence.
- source_word: ταραχάς
  choice: les troubles
  rationale: Préserve la portée assez large du pluriel grec, qui peut évoquer agitation, désordres ou tumultes.
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: Correspondance directe qui convient aussi bien à la paix intérieure qu’à l’absence de conflit.
- source_word: ἔχοντες τὸν θεὸν τῆς εἰρήνης
  choice: ayant avec vous le Dieu de paix
  rationale: Conserve le participe « ayant » tout en ajoutant « avec vous » pour rendre l’expression idiomatique en français, sans préciser davantage la nature de cette présence.
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  choice: aucune guerre ne triomphera de vous
  rationale: Rend la négation grecque fortement emphatique et le verbe κατισχύω, « l’emporter sur, vaincre ».
theological_decisions:
- issue: Portée de « le Dieu de paix »
  choice: Maintien du titre « le Dieu de paix » sans développement explicatif
  alternative: « Dieu, qui donne la paix »
  rationale: Le génitif grec est préservé afin de ne pas réduire le titre à une seule interprétation causale.
- issue: Sens de πόλεμος
  choice: « guerre », sans préciser si elle est littérale, sociale ou spirituelle
  alternative: « conflit » ou « combat spirituel »
  rationale: Le grec emploie le terme général pour la guerre; la traduction conserve cette tension sans imposer une lecture particulière.
translation_notes:
  register: Français international moderne, clair et exhortatif. La formulation demeure proche de la structure grecque tout en évitant les tours inutilement archaïques.
