source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: fr
  text: Ainsi donc, une fois revenus au Seigneur, il vous sera fait miséricorde, et il vous conduira dans son sanctuaire et vous donnera la paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi donc
  rationale: Rend le lien conclusif avec le contexte tout en restant naturel en français.
- source_word: ἐπιστρέψαντες πρὸς Κύριον
  choice: une fois revenus au Seigneur
  rationale: Préserve la construction participiale antérieure au verbe principal et le mouvement de retour vers le Seigneur.
- source_word: ἐλεηθήσεσθε
  choice: vous recevrez miséricorde
  rationale: Exprime naturellement le passif grec sans préciser de manière injustifiée l’agent, implicite dans le contexte.
- source_word: ἄξει ὑμᾶς εἰς τὸ ἁγίασμα αὐτοῦ
  choice: il vous conduira dans son sanctuaire
  rationale: « Conduira » traduit ἄξει et « sanctuaire » rend le lieu saint désigné par ἁγίασμα.
- source_word: δώσει ὑμῖν εἰρήνην
  choice: vous donnera la paix
  rationale: Traduction directe qui conserve le don divin de la paix.
theological_decisions:
- issue: Rapport entre le retour au Seigneur et la miséricorde reçue
  choice: 'Conserver l’antériorité participiale : « une fois revenus »'
  alternative: « quand vous reviendrez »
  rationale: Le grec présente le retour comme accompli relativement à la réception future de la miséricorde, sans développer davantage la relation théologique entre les deux.
- issue: Référent du sujet de « conduira » et « donnera »
  choice: Employer « il » en continuité avec « le Seigneur »
  alternative: Répéter « le Seigneur »
  rationale: Le sujet est naturellement le Seigneur mentionné juste avant; le pronom maintient cette continuité sans ajout interprétatif.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la syntaxe grecque tout en étant fluide; aucune note n’est nécessaire.
