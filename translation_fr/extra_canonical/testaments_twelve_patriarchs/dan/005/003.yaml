  text: Love the Lord all your life, and one another with a true heart.
translation:
  language: fr
  text: Aimez le Seigneur toute votre vie, et aimez-vous les uns les autres d’un cœur sincère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Aimez
  rationale: L’impératif aoriste appelle directement les destinataires à aimer; l’impératif présent français est la formulation naturelle d’une exhortation générale.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: toute votre vie
  rationale: Rend naturellement en français l’étendue temporelle de l’expression grecque, sans la lourdeur de «durant toute votre vie».
- source_word: ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: Le verbe «aimer» est sous-entendu en grec après la coordination; sa reprise en français clarifie la syntaxe sans ajouter de sens.
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: d’un cœur sincère
  rationale: «Sincère» exprime ici un cœur vrai, authentique et sans duplicité; cette tournure est idiomatique et digne en français moderne.
theological_decisions:
- issue: Portée de l’amour commandé
  choice: Conserver distinctement l’amour du Seigneur et l’amour mutuel
  alternative: Fusionner les deux objets dans une seule construction elliptique
  rationale: La coordination grecque relie les deux commandements tout en maintenant leurs objets et leurs compléments respectifs.
translation_notes:
  register: Français moderne, clair et digne. La répétition de «aimez» évite une ellipse peu naturelle en français et préserve la force exhortative du grec.
