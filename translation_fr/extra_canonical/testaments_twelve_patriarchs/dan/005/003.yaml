  text: ᾿Αγαπήσατε²¹ τὸν Κύριον²² ἐν πάσῃ *τῇ ζωῇ²³ ὑμῶν²⁴ *καὶ ἀλλήλους²⁵ ἐν ἀληθινῇ²⁶ καρδίᾳ.
