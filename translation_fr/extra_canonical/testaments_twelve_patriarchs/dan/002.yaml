  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother. Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains
    mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing. This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath. Therefore, when anyone speaks against you, do
    not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry. If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.'
translation:
  language: fr
  text: '## Testament de Dan 2


    Et maintenant, mes enfants, voici : je meurs. Je vous le dis en vérité : si vous ne vous gardez pas de l’esprit de fausseté[a] et de colère, et si vous n’aimez pas la vérité et la patience persévérante[b], vous périrez.


    Car la colère est un aveuglement et ne permet pas de voir en vérité le visage de qui que ce soit. Même s’il s’agit d’un père ou d’une mère, l’homme en colère les traite comme des ennemis ; même s’il s’agit d’un frère, il ne le reconnaît pas ; même s’il s’agit d’un prophète du Seigneur, il lui désobéit ; même s’il s’agit d’un juste, il n’a aucun égard pour lui ; même s’il s’agit d’un ami, il ne veut pas le reconnaître. Car l’esprit de colère l’enveloppe dans les filets de la tromperie, aveugle ses yeux, obscurcit son intelligence par la fausseté et lui impose sa propre manière de voir. Et avec quoi enveloppe-t-il ses yeux ? Avec la haine qui habite son cœur, afin qu’il éprouve de l’envie envers son frère.


    La colère est un mal, mes enfants, car elle trouble l’âme elle-même. Elle prend possession du corps de l’homme en colère, se rend maîtresse de son âme et communique sa puissance au corps, de sorte qu’il commet tout acte contraire à la loi. Et lorsque le corps fait tout cela, l’âme justifie ce qui a été fait, parce qu’elle ne voit plus correctement.


    Ainsi, lorsqu’un homme colérique est puissant, il a une triple force dans sa colère : la première lui vient de l’aide de ses serviteurs ; la deuxième, de sa richesse, grâce à laquelle il persuade et l’emporte injustement ; la troisième, de sa force naturelle, par laquelle il fait le mal. Et si l’homme colérique est pauvre, il a une double force dans sa colère, car elle l’aide toujours à mal agir. Cet esprit se tient constamment avec la fausseté à la droite de Satan, afin que ses œuvres s’accomplissent avec cruauté et fausseté.


    Comprenez donc que la puissance de la colère est vide. Elle commence par provoquer au moyen d’une parole ; puis, par des actes, elle fortifie celui qui est en colère. Par de dures pertes, elle trouble son intelligence et soulève ainsi son âme dans une grande fureur. C’est pourquoi, lorsque quelqu’un parle contre vous, ne vous laissez pas emporter par la colère. Et si quelqu’un vous loue comme des hommes saints, ne vous laissez pas exalter, que ce soit pour le plaisir ou le déplaisir. Car cela plaît d’abord à l’oreille ; ensuite, l’intelligence est mise en mouvement pour discerner des motifs de provocation ; enfin, une fois en colère, l’homme pense que sa colère est juste.


    Si vous subissez une perte ou un désastre, mes enfants, ne vous laissez pas accabler. Car cet esprit même amène l’être humain à désirer ce qui est périssable, afin que la peine causée par la perte le mette en colère. Que cette perte soit volontaire ou involontaire, ne vous irritez pas, car de l’irritation naît une colère mensongère.


    De plus, la colère unie à la fausseté constitue un double mal : elles s’entraident pour détruire le cœur. Et quand l’âme est continuellement troublée, le Seigneur se retire d’elle, et Béliar[c] règne sur elle.


    [a] Ou « l’esprit de tromperie ». Le terme grec peut désigner la fausseté dans les paroles ou, plus largement, le caractère trompeur.


    [b] Le terme grec peut aussi se traduire par « patience », « endurance » ou « longanimité » ; il désigne ici la capacité de supporter longtemps les provocations sans céder à la colère.


    [c] Béliar est une forme traditionnelle du nom Bélial dans la littérature juive et chrétienne ancienne.'
