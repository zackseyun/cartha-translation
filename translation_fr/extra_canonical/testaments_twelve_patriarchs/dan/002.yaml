lexical_decisions:
- source_word: πνεῦμα
  choice: esprit
  rationale: Le contexte présente la fausseté et la colère comme des forces morales et spirituelles actives, associées ensuite à Satan et à Béliar ; « esprit » conserve cette personnification sans la réduire à une simple humeur.
- source_word: ψεύδους
  choice: fausseté
  rationale: Le substantif abstrait s’oppose à la vérité et désigne plus qu’un mensonge ponctuel. Une note signale « tromperie », possible dans ce contexte.
- source_word: θυμός
  choice: colère
  rationale: « Colère » est naturel en français moderne et couvre le vice dominant du chapitre ; « fureur » est réservé à une intensification contextuelle.
- source_word: ἀλήθεια
  choice: vérité
  rationale: Le mot désigne à la fois la vérité opposée à la fausseté et la droiture dans les relations.
- source_word: μακροθυμία
  choice: patience persévérante
  rationale: Cette expression française accessible conserve l’idée d’endurance prolongée face à la provocation, plus explicitement que le seul mot « patience ».
- source_word: δίκτυα
  choice: filets
  rationale: Le terme maintient l’image concrète de l’enchevêtrement et du piège produits par la tromperie.
- source_word: ἴδιον ὅρασιν
  choice: sa propre manière de voir
  rationale: Cette formulation naturelle préserve la métaphore visuelle et l’idée que la colère impose une perception déformée.
- source_word: φθονεῖν
  choice: éprouver de l’envie
  rationale: Le choix exprime clairement la disposition hostile envers le frère.
- source_word: ἀνομία
  choice: actes contraires à la loi
  rationale: La formulation garde la nuance morale et juridique de conduite opposée à l’ordre divin, sans employer le terme moins courant « iniquité ».
- source_word: κρατεῖ
  choice: se rend maîtresse
  rationale: Le verbe exprime une domination croissante de la colère sur l’âme.
- source_word: κενόν
  choice: vide
  rationale: Le mot conserve le jugement selon lequel la puissance apparente de la colère est creuse et trompeuse.
- source_word: παροξυσμός / παροξύνειν
  choice: provocation / irritation
  rationale: La variation française rend à la fois le déclencheur extérieur et le mouvement intérieur d’exaspération, selon le contexte.
theological_decisions:
- issue: Action morale et spirituelle de la colère et de la fausseté
  choice: Conserver le vocabulaire actif de l’« esprit » et la personnification des vices.
  alternative: Réduire « esprit » à « disposition », « attitude » ou « tempérament ».
  rationale: Le chapitre relie ces forces à Satan et à Béliar et les décrit comme capables d’aveugler, de dominer et d’agir. La traduction préserve cette cosmologie morale sans la systématiser.
- issue: Retrait du Seigneur hors de l’âme
  choice: 'Traduire explicitement : « le Seigneur se retire d’elle ».'
  alternative: Paraphraser en termes de perte de paix ou de discernement moral.
  rationale: La formulation théologique sévère du texte ne doit pas être atténuée en simple description psychologique.
- issue: Présence de Satan et de Béliar dans le même chapitre
  choice: Maintenir les deux noms distinctement.
  alternative: Identifier explicitement Béliar à Satan ou harmoniser les deux désignations.
  rationale: Le témoin transmis emploie les deux noms ; préserver cette distinction évite de résoudre une relation que le texte n’explicite pas.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Les répétitions rhétoriques et la personnification de la colère sont conservées. « Béliar » maintient la forme propre à cette tradition littéraire. Les marqueurs de notes ont été placés auprès des termes qu’ils expliquent. Le grec fourni directement couvre l’exhortation initiale ; pour la suite du chapitre, la rédaction suit la couche anglaise auditée transmise dans le dossier, tout en conservant ses tensions et son imagerie.
