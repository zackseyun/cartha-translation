    Comprenez donc que la puissance de la colère est vide. Elle commence par provoquer au moyen d’une parole ; puis, par des actes, elle fortifie celui qui est en colère. Par de dures pertes, elle trouble son intelligence et soulève ainsi son âme dans une grande fureur. C’est pourquoi, lorsque quelqu’un parle contre vous, ne vous laissez pas emporter par la colère. Et si quelqu’un vous loue comme des hommes saints, ne vous laissez pas exalter, que ce soit pour le plaisir ou le déplaisir. Car cela plaît d’abord à l’oreille ; ensuite, l’intelligence est mise en mouvement pour discerner des motifs de provocation ; enfin, une fois en colère, l’homme pense que sa colère est juste.


    Si vous subissez une perte ou un désastre, mes enfants, ne vous laissez pas accabler. Car cet esprit même amène l’être humain à désirer ce qui est périssable, afin que la peine causée par la perte le mette en colère. Que cette perte soit volontaire ou involontaire, ne vous irritez pas, car de l’irritation naît une colère mensongère.


    De plus, la colère unie à la fausseté constitue un double mal : elles s’entraident pour détruire le cœur. Et quand l’âme est continuellement troublée, le Seigneur se retire d’elle, et Béliar[c] règne sur elle.


    [a] Ou « l’esprit de tromperie ». Le terme grec peut désigner la fausseté dans les paroles ou, plus largement, le caractère trompeur.


    [b] Le terme grec peut aussi se traduire par « patience », « endurance » ou « longanimité » ; il désigne ici la capacité de supporter longtemps les provocations sans céder à la colère.


    [c] Béliar est une forme traditionnelle du nom Bélial dans la littérature juive et chrétienne ancienne.'
