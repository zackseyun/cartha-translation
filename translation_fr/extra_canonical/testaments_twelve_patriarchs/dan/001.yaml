base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001.yaml
  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: fr
  text: '**Testament de Dan, septième fils de Jacob et de Bilha**


    **1** Copie des paroles que Dan adressa à ses fils vers la fin de sa vie, dans la cent vingt-cinquième année de son existence.[a]


    **2** Il rassembla les membres de sa famille et leur dit :


    « Écoutez mes paroles, fils de Dan, et soyez attentifs aux paroles de votre père.


    **3** J’ai constaté dans mon cœur et tout au long de ma vie que la vérité, accompagnée d’une conduite juste, est bonne et agréable à Dieu, tandis que le mensonge et la colère sont mauvais et enseignent à l’être humain toutes sortes de méchancetés.


    **4** Je vous l’avoue donc aujourd’hui, mes enfants : dans mon cœur, j’avais décidé la mort de mon frère Joseph, cet homme bon et véridique.


    **5** Je me réjouissais qu’il ait été vendu, parce que notre père l’aimait plus que nous.


    **6** En effet, l’esprit de jalousie et d’orgueil me répétait : “Toi aussi, tu es son fils !”


    **7** Et l’un des esprits de Béliar agissait avec moi en me disant : “Prends l’épée, tue Joseph avec elle, et ton père t’aimera quand Joseph sera mort.”


    **8** C’était l’esprit de colère qui me poussait : comme un léopard vide un chevreau de son sang, il m’incitait à vider Joseph de son sang.[b]


    **9** Mais le Dieu de mes pères ne permit pas qu’il tombe entre mes mains, afin que je ne le trouve pas seul, ne le tue pas et ne fasse pas disparaître un second sceptre en Israël.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni dit clairement « dans la cent vingt-cinquième année ». Certaines présentations modernes ont « dans la cinquième année », lecture qui ne correspond pas à cette formulation grecque.
    reason: textual_variant
  - marker: b
    text: Le grec de cette comparaison est fortement altéré. Il paraît décrire un léopard qui suce ou vide un chevreau, puis appliquer cette image à Joseph ; la traduction conserve cette image prédatrice sans prétendre rétablir chaque détail de la phrase.
    reason: textual_variant
  - marker: c
    text: L’expression grecque signifie littéralement « faire disparaître un second sceptre en Israël ». Elle pourrait évoquer la disparition d’une autorité ou d’une lignée tribale liée à Joseph, mais son sens précis demeure incertain.
    reason: translation_clarity
lexical_decisions:
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: vers la fin de sa vie
  rationale: L’expression signifie littéralement « dans les derniers jours de sa vie ». La formulation française conserve le cadre testamentaire sans suggérer nécessairement les temps eschatologiques.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει
  choice: dans la cent vingt-cinquième année
  rationale: Le grec fourni porte explicitement les nombres cent, vingt et cinquième. Cette lecture prime sur la couche anglaise, qui donne « cinquième année ».
- source_word: προσέχετε
  choice: soyez attentifs
  rationale: L’impératif demande une écoute soutenue et convient à l’exhortation solennelle d’un père à ses fils.
- source_word: ἀλήθεια μετὰ δικαιοπραγίας
  choice: la vérité, accompagnée d’une conduite juste
  rationale: δικαιοπραγία désigne la pratique effective de ce qui est juste, et non la seule qualité abstraite de justice.
- source_word: ψεῦδος
  choice: mensonge
  rationale: Le substantif abstrait s’oppose ici à la vérité comme disposition morale générale.
- source_word: θυμός
  choice: colère
  rationale: Ce terme central du chapitre désigne une colère violente, mais « colère » permet un rendu stable et naturel en français.
- source_word: ζῆλος
  choice: jalousie
  rationale: Le contexte est la rivalité suscitée par l’amour préférentiel du père pour Joseph.
- source_word: ἀλαζονεία
  choice: orgueil
  rationale: Le mot évoque une prétention hautaine; « orgueil » est naturel dans une liste de vices en français contemporain.
- source_word: πνευμάτων τοῦ Βελίαρ
  choice: esprits de Béliar
  rationale: Le nom propre et le cadre démonologique du texte sont conservés plutôt que remplacés par une désignation générale du mal.
- source_word: ἄνελε
  choice: tue
  rationale: L’impératif grec est direct et meurtrier; le français conserve cette force sans archaïsme.
- source_word: πάρδαλις
  choice: léopard
  rationale: Il s’agit du sens zoologique ordinaire et de l’image prédatrice voulue par le passage.
- source_word: σκῆπτρον δεύτερον
  choice: un second sceptre
  rationale: Le grec présente une image politique ou tribale énigmatique. La traduction la conserve au lieu de l’expliciter en « tribu » ou de la remplacer par « acte illégal ».
theological_decisions:
- issue: Béliar comme puissance personnelle du mal
  choice: Conserver « l’un des esprits de Béliar »
  alternative: un esprit mauvais / un esprit de Bélial
  rationale: Le grec nomme expressément Béliar et distingue l’un de ses esprits. Le rendu préserve cette représentation sans la réduire à une impulsion psychologique.
- issue: Action de Dieu empêchant le meurtre de Joseph
  choice: « ne permit pas qu’il tombe entre mes mains »
  alternative: ne me le livra pas
  rationale: Le rendu suit οὐκ εἴασεν et maintient ensemble l’intervention restrictive de Dieu et la responsabilité meurtrière de Dan.
- issue: Conséquence possible de la mort de Joseph
  choice: « faire disparaître un second sceptre en Israël »
  alternative: détruire deux tribus d’Israël / commettre cet acte contraire à la loi
  rationale: La formulation grecque transmise est σκῆπτρον δεύτερον τῷ Ἰσραήλ. Son référent reste énigmatique; traduire littéralement évite d’imposer une interprétation tribale ou juridique absente des mots conservés.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe testamentaire est maintenue sans tournures archaïques. Le titre et la notice d’âge sont traduits directement du grec. Les passages textuellement difficiles, surtout 1.8 et l’image du « second sceptre » en 1.9, restent visibles et ne sont pas harmonisés avec la couche anglaise.
