review_pass:
  verdict: revise
  source_fidelity: Le premier membre rend fidèlement λαλεῖ ... καθ᾽ ὑμῶν et κινεῖσθε εἰς ὀργήν. « Ne vous enflez pas d’orgueil » restitue bien l’élévation orgueilleuse de ἐπαίρεσθε. Dans la dernière phrase, όμως, « d’attitude » et « sous l’effet de » explicitent une interprétation psychologique et causale qui n’est pas exprimée par μεταβάλλεσθε ... εἰς.
  naturalness: Le français est globalement naturel. « Vous loue comme étant saints » est toutefois plus lourd que nécessaire; « vous loue comme saints » est idiomatique et garde la valeur de ὡς.
  terminology: « Saints », « colère », « orgueil », « plaisir » et « déplaisir » conviennent au registre et ne surchargent pas le texte de catégories doctrinales. « Déplaisir » conserve utilement une portée plus large que « dégoût ».
  issues:
  - severity: medium
    issue: La dernière proposition ajoute « d’attitude » et « sous l’effet de ».
    rationale: Ces ajouts déterminent le type de changement et font du plaisir et du déplaisir des causes instrumentales, alors que le grec emploie simplement μεταβάλλεσθε avec εἰς et laisse la relation exacte plus ouverte.
  - severity: low
    issue: « Comme étant saints » est lourd.
    rationale: La tournure française « comme saints » rend directement ὡς ἁγίους sans perte de nuance.
  revised_text: Ainsi donc, lorsque quelqu’un parle contre vous, ne vous laissez pas entraîner à la colère ; et si quelqu’un vous loue comme saints, ne vous enflez pas d’orgueil. Ne changez ni pour le plaisir ni pour le déplaisir.
