  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: fr
  text: Ainsi donc, lorsque quelqu’un parle contre vous, ne vous laissez pas entraîner à la colère ; et si quelqu’un vous loue comme saints, ne vous enflez pas d’orgueil. Ne changez ni pour le plaisir ni pour le déplaisir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλεῖ ... καθ᾽ ὑμῶν
  choice: parle contre vous
  rationale: Rend directement l’opposition exprimée par κατά avec le génitif, sans préciser à tort s’il s’agit de calomnie ou d’accusation.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: vous laissez pas entraîner à la colère
  rationale: Exprime le mouvement vers un état de colère tout en donnant en français une exhortation naturelle.
- source_word: ἐπαινέσῃ ... ὡς ἁγίους
  choice: vous loue comme étant saints
  rationale: Conserve la nuance de ὡς, qui présente la sainteté comme la qualité sous laquelle les destinataires sont loués.
- source_word: ἐπαίρεσθε
  choice: vous enflez pas d’orgueil
  rationale: Dans ce contexte moral, le verbe désigne l’élévation orgueilleuse plutôt qu’une exaltation légitime.
- source_word: μεταβάλλεσθε
  choice: changez d’attitude
  rationale: Le complément « d’attitude » explicite naturellement en français le changement intérieur ou comportemental visé, sans en surdéterminer la nature.
- source_word: τέρψιν ... ἀηδίαν
  choice: plaisir ... déplaisir
  rationale: Préserve l’opposition entre réaction agréable et réaction désagréable. « Déplaisir » reste plus large et contextuellement plus naturel que « dégoût ».
theological_decisions:
- issue: Sens de ἁγίους
  choice: saints
  alternative: des gens saints
  rationale: Le terme est conservé dans sa force religieuse et morale ordinaire, sans définir ici un statut doctrinal particulier.
- issue: Nature du changement interdit dans la dernière proposition
  choice: Ne changez d’attitude ni sous l’effet du plaisir ni sous celui du déplaisir
  alternative: Ne passez ni au plaisir ni au dégoût
  rationale: La formulation choisie maintient l’idée d’instabilité provoquée par les réactions aux paroles d’autrui, tout en évitant de transformer les deux noms en destinations psychologiques trop précises.
translation_notes:
  register: Français moderne, digne et accessible. Le balancement des deux avertissements est conservé, ainsi que le parallélisme final. Aucun vocatif (« mes enfants ») n’est ajouté, puisqu’il ne figure pas dans le texte grec fourni.
