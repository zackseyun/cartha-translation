  to: Ainsi donc, lorsque quelqu’un parle contre vous, ne vous laissez pas entraîner à la colère ; et si quelqu’un vous loue comme saints, ne vous enflez pas d’orgueil. Ne changez ni pour le plaisir ni pour le déplaisir.
  rationale: La révision allège la formulation de l’éloge et retire les précisions interprétatives ajoutées à la dernière phrase. « Ne changez ni pour le plaisir ni pour le déplaisir » conserve la concision et l’indétermination relative de μεταβάλλεσθε ... εἰς, tout en restant lisible en français moderne.
