  text: Therefore understand the power of anger, that it is futile.
translation:
  language: fr
  text: Comprenez donc que la puissance de la colère est vaine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνετε
  choice: Comprenez
  rationale: 'Impératif aoriste de συνίημι : invitation directe à saisir ou reconnaître la réalité décrite.'
- source_word: δύναμιν
  choice: puissance
  rationale: Rend directement l’idée de force ou de pouvoir exercé par la colère.
- source_word: θυμοῦ
  choice: colère
  rationale: Dans ce contexte moral, θυμός désigne la colère, notamment dans son élan passionnel.
- source_word: ματαία
  choice: vaine
  rationale: Préserve le sens de ce qui est sans résultat valable, inutile ou dépourvu de véritable portée, sans réduire le terme à la seule idée d’inefficacité.
theological_decisions:
- issue: Rapport logique introduit par ὅτι
  choice: Deux-points suivis de « elle est vaine »
  alternative: « comprenez que la puissance de la colère est vaine »
  rationale: Le texte grec peut présenter ὅτι comme introduisant le contenu à comprendre ou comme une explication. Les deux-points conservent cette légère souplesse tout en produisant un français naturel.
translation_notes:
  register: Français moderne, sobre et dignifié. La formulation demeure concise comme le grec et conserve la personnification implicite de la colère comme puissance agissante.
