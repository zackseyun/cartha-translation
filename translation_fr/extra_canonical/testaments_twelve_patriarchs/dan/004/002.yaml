base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: fr
  text: Car il est d’abord irrité par une parole. Puis, par des actes, l’esprit de colère[a] donne de la force à celui qui se met en colère ; par de douloureuses pertes, il trouble son dessein, et ainsi il éveille son âme à une grande colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec sous-entend ici le sujet ; d’après le contexte, il s’agit de l’esprit de colère.
    reason: Signaler que « l’esprit de colère » est une explicitation contextuelle et non un groupe nominal exprimé dans ce verset.
lexical_decisions:
- source_word: παροξύνεται
  choice: il est […] provoqué
  rationale: Le moyen-passif exprime ici le fait d’être irrité ou poussé à la colère. « Est provoqué » conserve la voix et reste naturel en français.
- source_word: δυναμοῖ
  choice: donne de la force
  rationale: Rend directement l’idée de fortifier ou de rendre puissant, sans préciser abusivement la manière dont la colère gagne en intensité.
- source_word: ζημίαις πικραῖς
  choice: de douloureuses pertes
  rationale: ζημία désigne une perte, un dommage ou un préjudice ; πικρός en souligne le caractère pénible. Cette formulation française est plus idiomatique que « pertes amères ».
- source_word: διαβούλιον
  choice: dessein
  rationale: Le terme peut désigner la réflexion, le projet ou la résolution. « Dessein » préserve ici le lien entre délibération intérieure et intention.
- source_word: θυμῷ μεγάλῳ
  choice: une grande fureur
  rationale: θυμός évoque une colère ardente et impétueuse ; « grande fureur » conserve la force de l’expression grecque.
- source_word: διεγείρει … τὴν ψυχὴν
  choice: soulève son âme
  rationale: Conserve l’image d’un mouvement intérieur intense exprimée par διεγείρω, dans un registre digne et intelligible.
theological_decisions:
- issue: Sujet implicite des verbes δυναμοῖ, διαταράσσει et διεγείρει
  choice: l’esprit de colère
  alternative: « il », sans explicitation, ou « la colère »
  rationale: Le grec laisse le sujet inexprimé, tandis que la première proposition passive vise la personne provoquée. Le contexte immédiat du Testament de Dan présente l’esprit de colère comme l’agent à l’œuvre. L’explicitation évite en français une référence pronominale incohérente, tout en étant signalée par une note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure progressive du grec — parole, actes, pertes, puis agitation de l’âme — est conservée. Le découpage en deux phrases améliore la lisibilité tout en maintenant l’enchaînement logique.
