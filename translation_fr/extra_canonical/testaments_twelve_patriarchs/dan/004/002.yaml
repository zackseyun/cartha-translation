  source_fidelity: 'Le projet rend correctement la progression du grec : une parole irrite d’abord la personne, puis l’agent implicite fortifie celui qui se met en colère, trouble son dessein par des pertes pénibles et excite son âme à la colère. L’explicitation contextuelle de l’agent est acceptable, à condition d’être signalée, car le grec ne l’exprime pas dans ce verset.'
