  terminology: « Esprit de colère » convient comme explicitation contextuelle avec note. « Donne de la force », « douloureuses pertes » et « dessein » sont défendables. « Grande colère » rend θυμῷ μεγάλῳ sans surinterpréter le degré ou la nuance du terme.
