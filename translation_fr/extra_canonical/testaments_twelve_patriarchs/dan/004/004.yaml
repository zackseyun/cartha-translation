  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: fr
  text: Car d’abord, il charme l’oreille, puis aiguise l’esprit afin qu’il perçoive la provocation ; et, une fois en colère, il estime que sa colère est justifiée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: il charme l’oreille
  rationale: Conserve l’image auditive du grec tout en exprimant naturellement l’idée d’un discours d’abord plaisant ou séduisant.
- source_word: ὀξύνει τὸν νοῦν
  choice: il aiguise l’esprit
  rationale: Rend directement la métaphore grecque de l’aiguisement appliquée à l’intelligence.
- source_word: τὸ ἐρεθισθέν
  choice: l’offense subie
  rationale: Le participe substantivé désigne ici ce qui a provoqué ou irrité la personne. « L’offense subie » reste idiomatique sans préciser davantage la nature de la provocation.
- source_word: θυμωθείς
  choice: une fois rempli de fureur
  rationale: Exprime l’entrée dans un état de vive colère, avec une intensité correspondant à θυμόω.
- source_word: δικαίως ὀργίζεσθαι
  choice: que sa colère est juste
  rationale: Restitue l’idée que la personne estime sa colère légitime, dans un français courant et digne.
theological_decisions:
- issue: Référent implicite du sujet
  choice: Maintenir un sujet général au moyen de « on » dans la dernière proposition
  alternative: Employer partout « il », susceptible de renvoyer explicitement à la colère personnifiée ou à un homme particulier
  rationale: Le grec passe par des formes verbales dont le sujet dépend du contexte. La formulation retenue préserve la portée générale de l’observation morale sans imposer une personnification explicite.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure progressive du grec — séduction de l’ouïe, aiguisement de l’esprit, perception de l’offense, justification de la colère — est conservée.
