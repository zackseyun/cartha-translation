source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: fr
  text: Et si vous subissez une perte, volontairement ou involontairement, ne vous affligez pas ; car de l’affliction naît aussi la colère, accompagnée de fausseté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « accompagnée de fausseté » sont signalés comme textuellement incertains dans l’édition grecque.
    reason: Les signes éditoriaux entourant μετὰ ψεύδους indiquent une incertitude ou une variation dans la transmission du texte.
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: vous subissez une perte
  rationale: Rend naturellement le passif grec, qui désigne le fait d’éprouver un dommage ou une perte sans en préciser la nature.
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: volontairement ou involontairement
  rationale: Préserve l’opposition explicite du grec entre ce qui arrive de plein gré et ce qui arrive sans l’avoir voulu.
- source_word: μὴ λυπεῖσθε / λύπης
  choice: ne vous affligez pas / de l’affliction
  rationale: Maintient le lien lexical entre le verbe et le nom, important pour le raisonnement causal du verset.
- source_word: θυμός
  choice: la colère
  rationale: Dans ce contexte moral, le terme évoque un mouvement de colère plutôt qu’une simple émotion ou ardeur.
- source_word: μετὰ ψεύδους
  choice: accompagnée de fausseté
  rationale: Exprime la relation générale de μετά avec le génitif sans déterminer excessivement si ψεῦδος désigne le mensonge proféré, la tromperie ou la fausseté.
theological_decisions:
- issue: Rapport entre la colère et la fausseté
  choice: accompagnée de fausseté
  alternative: avec le mensonge
  rationale: La formulation conserve la portée large de ψεῦδος et évite de réduire l’idée à un mensonge verbal précis.
translation_notes:
  register: Français moderne, clair et digne. La répétition « affligez / affliction » est volontaire afin de préserver la logique et l’écho lexical du grec.
