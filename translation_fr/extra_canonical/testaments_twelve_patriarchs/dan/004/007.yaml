source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: fr
  text: La colère unie au mensonge est un mal à deux visages ; ils s’unissent l’un à l’autre afin de troubler le cœur. Et lorsque l’âme est continuellement troublée, le Seigneur s’éloigne d’elle, et Béliar règne sur elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμὸς μετὰ ψεύδους
  choice: la colère unie au mensonge
  rationale: « θυμός » désigne ici la colère, tandis que « μετά » exprime leur association. Cette formulation naturelle conserve l’idée que la colère et le mensonge agissent ensemble.
- source_word: διπρόσωπον κακόν
  choice: un mal à deux visages
  rationale: Rend directement l’image grecque d’un mal « à deux faces », en référence à la colère et au mensonge.
- source_word: συναίρονται ἀλλήλοις
  choice: ils s’allient
  rationale: Le verbe exprime l’idée d’agir de concert ou de s’associer ; le pluriel renvoie à la colère et au mensonge.
- source_word: ταράξωσι τὴν καρδίαν
  choice: troubler le cœur
  rationale: Conserve le vocabulaire anthropologique et l’image du texte grec.
- source_word: ἀφίσταται
  choice: s’éloigne
  rationale: Traduit le mouvement de retrait ou d’éloignement sans préciser davantage sa nature théologique.
- source_word: κυριεύει αὐτῆς
  choice: règne sur elle
  rationale: Exprime la domination exercée sur l’âme, dans un français digne et courant.
- source_word: ὁ Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec Βελίαρ.
theological_decisions:
- issue: Le retrait du Seigneur devant l’âme continuellement troublée
  choice: le Seigneur s’éloigne d’elle
  alternative: le Seigneur l’abandonne
  rationale: « S’éloigne » respecte le sens de ἀφίσταται sans renforcer le texte par la notion plus absolue d’abandon.
- issue: La domination de Béliar
  choice: Béliar règne sur elle
  alternative: Béliar s’en rend maître
  rationale: La formulation conserve la force de κυριεύει tout en restant fluide ; elle n’explicite pas la nature ou le degré de cette domination.
translation_notes:
  register: Français moderne international, clair et digne. La structure en deux phrases allège la longue coordination grecque sans effacer le rapport causal et temporel. Le pronom pluriel « ils » préserve la personnification implicite de la colère et du mensonge.
