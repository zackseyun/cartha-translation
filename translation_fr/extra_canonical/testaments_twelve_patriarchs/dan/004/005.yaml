revisions:
- from: Mais si vous subissez quelque dommage ou quelque perte, enfants, ne vous laissez pas troubler. Car cet esprit même fait désirer ce qui se perd, afin que, sous l’effet de cette souffrance[a], on tombe dans la colère.
  to: Mais si vous subissez quelque dommage ou quelque destruction, enfants, ne vous laissez pas troubler. Car ce même esprit fait désirer ce qui périt, afin que l’on tombe dans la colère par la passion[a].
  rationale: Révision limitée afin de mieux distinguer ζημία de ἀπώλεια et de ne pas imposer à πάθος le seul sens de « souffrance ». Le sujet de l’infinitif et du subjonctif demeure volontairement non identifié par « l’on », conformément à l’indétermination du grec.
