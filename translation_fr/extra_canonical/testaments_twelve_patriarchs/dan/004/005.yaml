  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: fr
  text: Mais si vous subissez quelque dommage ou quelque destruction, enfants, ne vous laissez pas troubler. Car ce même esprit fait désirer ce qui périt, afin que l’on tombe dans la colère par la passion[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par cette souffrance » ou « par cette vive émotion ». Le mot grec peut désigner une souffrance subie, une émotion intense ou une passion.'
    reason: πάθος est polysémique; « passion » conserve le sens le plus ouvert dans le texte courant, tandis que la note signale les autres possibilités contextuellement pertinentes.
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  choice: quelque dommage ou quelque perte
  rationale: Cette formulation française naturelle maintient la distinction entre le préjudice subi et la perte ou destruction, sans alourdir la phrase.
- source_word: μὴ ἐκθροεῖσθε
  choice: ne vous laissez pas troubler
  rationale: Le verbe exprime l’agitation, l’effroi ou le bouleversement; cette tournure rend l’idée sans suggérer une simple tristesse.
- source_word: ἐπιθυμῆσαι τοῦ ἀπολλυμένου
  choice: désirer ce qui se perd
  rationale: Le génitif dépend naturellement du verbe «désirer». La traduction évite d’introduire «désirer se mettre en colère», idée qui n’est pas explicitement portée par la syntaxe grecque.
- source_word: θυμῷ πέσῃ
  choice: on tombe dans la colère
  rationale: La tournure impersonnelle restitue le sujet non exprimé du grec et rend l’image de la chute dans un état de colère.
- source_word: διὰ τοῦ πάθους
  choice: sous l’effet de cette souffrance
  rationale: Dans ce contexte de dommage ou de perte, πάθος peut désigner ce que l’on subit et la souffrance qui en résulte; une note conserve aussi la possibilité du sens «passion».
theological_decisions:
- issue: Référent et sujet implicite dans ποιεῖ ἐπιθυμῆσαι … πέσῃ
  choice: Employer «on» sans identifier davantage la personne affectée
  alternative: Répéter «vous» ou introduire «l’être humain»
  rationale: Le grec omet le sujet de l’infinitif et de πέσῃ. La formulation choisie préserve cette indétermination au lieu d’en fixer artificiellement le référent.
translation_notes:
  register: Français moderne, international et digne. L’adresse «enfants» est conservée sans ajouter «mes», absent du grec. Le rythme reste exhortatif et la causalité du texte source est explicitement maintenue.
