  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005.yaml
  text: '1 Therefore[v6], my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.


    2 Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace[v8], and war will certainly not prevail against you.


    3 Love the Lord throughout all your life, and one another with a true heart.


    4 I know that in the last days you will depart from the Lord, and you will provoke Levi, and you will set yourselves in battle array against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.


    5 And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and the spirits of wickedness working among you in every evil.


    6 For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and of pride will attend on the sons of Levi, to make them sin before the Lord.


    7 And my sons will draw near to Levi and will sin together with them in all things. But the sons of Judah will be greedy, snatching what belongs to others like lions.


    8 Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.


    9 And so, when you return to the Lord, you will receive mercy, and he will bring you into his sanctuary, and he will give you peace.


    10 And for you the salvation of the Lord will arise from the tribe of Judah and of Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.


    11 And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.


    12 And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.


    13 And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst[v13][v12][v11][v10], and the Holy One of Israel will reign over her.'
translation:
  language: fr
  text: '**Testament de Dan 5**


    **1** Ainsi donc, mes enfants, gardez le commandement du Seigneur et observez sa loi. Éloignez-vous de la colère et haïssez le mensonge, afin que le Seigneur demeure en vous et que Béliar fuie loin de vous.


    **2** Que chacun dise la vérité à son prochain. Alors, vous ne tomberez certainement pas dans la fureur et les troubles, mais vous vivrez en paix, avec le Dieu de paix, et la guerre ne l’emportera certainement pas sur vous.


    **3** Aimez le Seigneur durant toute votre vie, et aimez-vous les uns les autres d’un cœur sincère.


    **4** Je sais que, dans les derniers jours, vous vous détournerez du Seigneur, vous provoquerez Lévi et vous vous rangerez en ordre de bataille contre Juda. Mais vous ne pourrez pas l’emporter sur eux, car un ange du Seigneur les guide tous les deux, et c’est par eux qu’Israël subsistera.


    **5** Chaque fois que vous vous détournerez du Seigneur, vous suivrez toutes sortes de voies mauvaises et commettrez les abominations des nations. Vous vous prostituerez avec des femmes sans loi, et les esprits de la méchanceté agiront parmi vous dans toute perversité.


    **6** En effet, j’ai lu dans le livre d’Hénoch le juste[a] et j’ai appris que votre chef est Satan, et que les esprits de la méchanceté et de l’orgueil se tiendront auprès des fils de Lévi[b] pour les amener à pécher devant le Seigneur.


    **7** Mes fils se rapprocheront de Lévi et pécheront avec eux en toutes choses. Quant aux fils de Juda, poussés par la cupidité, ils s’empareront du bien d’autrui comme des lions.


    **8** C’est pourquoi vous serez emmenés avec eux[c] en captivité. Là, vous subirez toutes les plaies d’Égypte et tous les maux des nations.


    **9** Puis, lorsque vous reviendrez au Seigneur, il vous fera miséricorde, vous conduira dans son sanctuaire et vous donnera la paix.


    **10** Alors se lèvera pour vous, de la tribu de Juda et de Lévi[d], le salut du Seigneur. Il fera lui-même la guerre à Béliar et accordera à vos pères la vengeance de la victoire[e].


    **11** Il enlèvera à Béliar les captifs — les âmes des saints[f] —, ramènera au Seigneur les cœurs désobéissants et donnera une paix éternelle à ceux qui font appel à lui.


    **12** Les saints trouveront le repos en Éden, et les justes se réjouiront au sujet de la Jérusalem nouvelle[g], qui est la gloire éternelle de Dieu.


    **13** Jérusalem ne subira plus la dévastation, et Israël ne sera plus emmené en captivité, car le Seigneur sera au milieu d’elle et le Saint d’Israël régnera sur elle[h].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mention du « livre d’Hénoch le juste » est explicite dans le témoin grec et renvoie vraisemblablement à des traditions hénochiennes connues dans le judaïsme du Second Temple.
    reason: cross_reference
  - marker: b
    text: Le texte grec de la proposition décrivant la relation des esprits avec les fils de Lévi est difficile et probablement altéré. On peut aussi comprendre qu’ils leur « obéiront afin de se tenir auprès d’eux ».
    reason: textual_variant
  - marker: c
    text: Les mots « avec eux », qui associent explicitement les captifs à Lévi et à Juda, ne figurent que dans une partie de la tradition manuscrite.
    reason: textual_variant
  - marker: d
    text: Les mots « Juda et » sont textuellement incertains. Certains témoins parlent seulement de la tribu de Lévi ; la double référence à Juda et à Lévi est toutefois bien attestée dans la tradition.
    reason: textual_variant
  - marker: e
    text: Le mot grec traduit par « vos pères » est signalé comme incertain dans l’édition, et l’expression littérale « la vengeance de la victoire » est difficile. La traduction en conserve ici la formulation sans en trancher précisément le sens.
    reason: textual_variant
  - marker: f
    text: Les mots « les âmes des saints » sont textuellement incertains ; ils précisent que les captifs enlevés à Béliar sont des personnes.
    reason: textual_variant
  - marker: g
    text: La « Jérusalem nouvelle » est ici l’image eschatologique d’une Sion restaurée et glorifiée, et non simplement la ville historique dans son état présent.
    reason: cultural_note
  - marker: h
    text: Certains témoins ajoutent que le Seigneur vivra parmi les humains et que le Saint d’Israël régnera « dans l’humilité et la pauvreté » ; ils poursuivent en affirmant que celui qui croit en lui régnera véritablement parmi les humains. Ces développements, souvent considérés comme des expansions, ne sont pas intégrés au texte principal.
    reason: textual_variant
lexical_decisions:
- source_word: φυλάξατε / τηρήσατε
  choice: gardez / observez
  rationale: 'Le couple français conserve le parallélisme des deux verbes grecs sans répétition pesante : on garde le commandement et l’on observe la loi.'
- source_word: θυμός
  choice: colère
  rationale: Dans cette exhortation morale, « colère » est naturel et garde la force du vice dénoncé.
- source_word: ψεῦδος
  choice: mensonge
  rationale: Le singulier grec désigne ici le mensonge comme conduite opposée à la vérité, et non seulement une parole mensongère isolée.
- source_word: Βελίαρ
  choice: Béliar
  rationale: La forme grecque du nom est conservée au lieu d’être normalisée en « Bélial ».
- source_word: ἀλήθειαν φθέγγεσθε
  choice: Que chacun dise la vérité
  rationale: Cette formulation française rend directement l’impératif tout en intégrant naturellement ἕκαστος.
- source_word: μῆνις / ταραχαί
  choice: fureur / troubles
  rationale: « Fureur » distingue ce terme plus intense de θυμός au verset 1 ; « troubles » peut désigner les désordres collectifs suggérés par le pluriel.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: durant toute votre vie
  rationale: Rend naturellement l’idée d’une fidélité qui embrasse la vie entière.
- source_word: παρατάξεσθε
  choice: vous vous rangerez en ordre de bataille
  rationale: Le choix préserve l’image militaire explicite plutôt que de réduire le verbe à une opposition générale.
- source_word: τὸ σωτήριον Κυρίου
  choice: le salut du Seigneur
  rationale: Le neutre grec désigne littéralement le salut, tout en laissant ouverte la possible personnification qui se poursuit par αὐτός.
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: Il arrachera à Béliar ce qu’il retenait captif
  rationale: Cette tournure française exprime le sens de la construction sans donner à « captivité » un emploi artificiel comme objet personnel.
theological_decisions:
- issue: Satan et les esprits mauvais aux versets 5 à 7
  choice: Traduire directement les êtres et leur action comme le fait le témoin grec.
  alternative: Les réduire à des impulsions mauvaises personnifiées ou supprimer le passage comme secondaire.
  rationale: Le langage démonologique appartient explicitement au texte transmis et reste étroitement lié à son exhortation morale.
- issue: Le salut issu de Juda et de Lévi au verset 10
  choice: Conserver « le salut du Seigneur » ainsi que la double référence tribale, avec une note sur l’instabilité de « Juda et ».
  alternative: Traduire « le Sauveur du Seigneur » ou imposer une identification messianique plus précise.
  rationale: Le grec permet une tension entre une réalité appelée salut et sa personnification subséquente ; la traduction ne tranche pas cette tension.
- issue: Passages eschatologiques textuellement développés aux versets 10 à 13
  choice: Traduire le noyau du texte et signaler les expansions entre crochets dans les notes.
  alternative: Intégrer toutes les expansions au texte principal ou retrancher toute la section.
  rationale: Cette méthode rend visible la complexité de la tradition manuscrite sans harmonisation ni suppression silencieuse.
- issue: Le règne du Saint d’Israël au verset 13
  choice: 'Maintenir le sujet tel que le donne le texte principal : « le Saint d’Israël régnera ».'
  alternative: Attribuer explicitement le règne à un messie humain à partir de l’expansion manuscrite.
  rationale: Le texte principal ne requiert pas cette identification et l’expansion est textuellement incertaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est rendu par « vous », conformément au discours testamentaire adressé aux descendants. Les termes traditionnels nécessaires — Seigneur, sanctuaire, Éden, saints — sont conservés, tandis que la syntaxe est allégée lorsque le calque grec deviendrait obscur. Les images militaires, démonologiques et eschatologiques restent explicites.
