  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: fr
  text: C’est pourquoi l’ennemi s’efforce de faire trébucher tous ceux qui invoquent le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement en français la relation causale et déductive exprimée par le grec.
- source_word: σπουδάζει
  choice: s’efforce
  rationale: Exprime l’empressement actif et l’application de l’ennemi sans alourdir la phrase.
- source_word: ὁ ἐχθρός
  choice: l’ennemi
  rationale: Correspondance directe, en conservant la désignation définie du texte grec.
- source_word: ὑποσκελίζειν
  choice: faire trébucher
  rationale: Conserve l’image concrète d’un croc-en-jambe et son sens figuré de provoquer la chute.
- source_word: τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: ceux qui invoquent le Seigneur
  rationale: Rend fidèlement le participe présent et l’expression cultuelle « invoquer le Seigneur ».
theological_decisions:
- issue: Identité de « l’ennemi »
  choice: Maintenir la désignation « l’ennemi » sans l’expliciter
  alternative: Identifier explicitement l’ennemi à Satan ou au diable
  rationale: Le texte grec ne fournit ici aucun nom propre; l’expliciter résoudrait indûment une référence laissée au contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de la chute ainsi que le vocabulaire biblique courant d’« invoquer le Seigneur ».
