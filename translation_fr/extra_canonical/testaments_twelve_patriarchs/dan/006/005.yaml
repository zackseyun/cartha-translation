    rationale: Le grec porte le génitif pluriel κακῶν (« maux »). Le singulier français atténue cette donnée et la note ne corrige pas le décalage du texte principal.
  - severity: low
    issue: Antécédent de « qu’il » potentiellement flottant
    rationale: Après « l’ange de la paix », le pronom français peut être relu comme renvoyant à l’ange. Répéter « Israël » rend explicite la dépendance infinitive grecque sans modifier le sens.
