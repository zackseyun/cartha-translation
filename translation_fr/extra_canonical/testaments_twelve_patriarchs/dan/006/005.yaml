  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: fr
  text: Car lui-même, l’ange de la paix, fortifiera Israël afin qu’Israël ne tombe pas dans les pires maux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule grecque peut aussi évoquer l’aboutissement des maux, ou leur extrême gravité.
    reason: La construction εἰς τέλος κακῶν est inhabituelle; la note conserve son éventuelle nuance d’aboutissement sans écarter le sens principal de maux extrêmes.
lexical_decisions:
- source_word: Αὐτὸς
  choice: lui-même
  rationale: Conserve l’emphase portée par le pronom grec placé en tête.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: l’ange de la paix
  rationale: Rend directement le groupe nominal grec, avec son titre défini.
- source_word: ἐνισχύσει
  choice: fortifiera
  rationale: Exprime naturellement l’idée de rendre fort ou d’affermir, au futur.
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Préserve l’ambiguïté possible entre le peuple pris collectivement et son ancêtre éponyme.
- source_word: εἰς τέλος κακῶν
  choice: dans les derniers degrés du mal
  rationale: Reproduit la construction difficile associant τέλος à un génitif pluriel, sans la réduire à une simple intensification.
theological_decisions:
- issue: Référent du sujet sous-entendu de μὴ ἐμπεσεῖν αὐτόν
  choice: il, renvoyant à Israël
  alternative: celui-ci, ou une reformulation collective telle que « les Israélites »
  rationale: Le masculin singulier αὐτόν reprend grammaticalement Israël; la traduction conserve cette personnification sans décider s’il s’agit du peuple ou du patriarche.
- issue: Portée de εἰς τέλος κακῶν
  choice: les derniers degrés du mal
  alternative: les pires maux / une ruine complète causée par les maux
  rationale: La formule grecque est inhabituelle et peut exprimer un degré extrême ou un aboutissement; le choix principal maintient cette tension, tandis que la note signale les autres lectures possibles.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire tout en conservant l’emphase de « lui-même », la personnification grammaticale d’Israël et l’ambiguïté de la formule finale.
