source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: fr
  text: Car il sait que, le jour où Israël reviendra, le règne de l’ennemi prendra fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: reviendra
  rationale: Le verbe exprime un retour ou un changement de direction. « Reviendra » conserve cette portée sans préciser explicitement s’il s’agit d’un retour à Dieu, puisque le complément demeure implicite dans le grec.
- source_word: συντελεσθήσεται
  choice: prendra fin
  rationale: Ce futur passif peut signifier être achevé, consommé ou mené à son terme. En lien avec un règne hostile, « prendra fin » rend naturellement l’aboutissement annoncé sans alourdir la phrase.
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: le règne de l’ennemi
  rationale: « Règne » désigne ici plus naturellement l’exercice de la domination ennemie que le territoire d’un royaume, tout en préservant l’identité non précisée de l’ennemi.
theological_decisions:
- issue: Nature du retour d’Israël
  choice: « Israël reviendra » sans complément explicite
  alternative: « Israël reviendra à Dieu » ou « Israël se convertira »
  rationale: Le grec emploie ἐπιστρέψει sans complément. La traduction conserve cette ambiguïté au lieu de rendre explicite une interprétation théologique probable mais non formulée.
- issue: Fin de la domination ennemie
  choice: « le règne de l’ennemi prendra fin »
  alternative: « le royaume de l’ennemi sera anéanti »
  rationale: Le texte annonce l’achèvement ou la fin de cette βασιλεία, mais n’emploie pas ici un verbe signifiant explicitement détruire ou anéantir.
translation_notes:
  register: Français moderne, clair et digne. La structure causale et temporelle du grec est conservée, avec une formulation idiomatique. Aucun appel de note n’est nécessaire.
