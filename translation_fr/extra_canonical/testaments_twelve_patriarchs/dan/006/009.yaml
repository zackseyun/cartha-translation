source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἃ ἠκούσατε³⁸ παρὰ τοῦ πατρὸς ὑμῶν, μεταδοτε³⁹ ⌈καὶ⁴⁰ ὑμεῖς⁴¹⌉ τοῖς τέκνοις ὑμῶν⁴², [ἵνα δέξηται⁴³ ὑμᾶς ὁ Σωτὴρ⁴⁴ τῶν ἐθνῶν· *ἐστὶ γὰρ ἀληθὴς καὶ μακρόθυμος, πρᾷος καὶ ταπεινός⁴⁵, καὶ⁴⁶ ἐκδιδάσκων⁴⁷ διὰ τῶν ἔργων *τὸν νόμον Κυρίου⁴⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: fr
  text: Et ce que vous avez entendu de votre père, transmettez-le, vous aussi, à vos enfants, afin que le Sauveur des nations vous accueille ; car il est vrai et patient, doux et humble, et, par ses œuvres, il enseigne la loi du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase allant de « afin que » jusqu’à la fin du verset est souvent considérée comme un développement ou un ajout ultérieur ; elle est traduite ici parce qu’elle figure dans le témoin grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: μετάδοτε
  choice: transmettez-le
  rationale: Le verbe exprime ici l’idée de communiquer ou de faire passer à d’autres l’enseignement reçu ; « transmettez-le » convient naturellement au contexte intergénérationnel.
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: le Sauveur des nations
  rationale: Rend directement le titre grec et conserve la portée potentiellement large de ἐθνῶν, sans préciser arbitrairement « païens » ou « peuples ».
- source_word: μακρόθυμος
  choice: patient
  rationale: Dans cette série de qualités, « patient » exprime clairement l’endurance et la lenteur à la colère impliquées par le grec.
- source_word: ἐκδιδάσκων
  choice: il enseigne
  rationale: Formulation française naturelle qui restitue l’activité pédagogique du participe grec sans surcharger le texte.
theological_decisions:
- issue: Identité du « Sauveur des nations »
  choice: Maintien du titre sans identification explicite
  alternative: Employer un référent christologique explicite
  rationale: Le grec donne un titre, mais ne nomme pas son référent dans ce verset ; la traduction préserve cette formulation et son éventuelle portée théologique.
- issue: Rapport entre les œuvres et l’enseignement de la loi
  choice: « par ses œuvres, il enseigne la loi du Seigneur »
  alternative: « ses œuvres enseignent la loi du Seigneur »
  rationale: Le participe se rapporte au sujet personnel et διά avec le génitif indique le moyen ; la formulation retenue conserve l’idée qu’il enseigne au moyen de ses actes.
- issue: Statut textuel de la proposition finale
  choice: Traduction intégrale avec note textuelle
  alternative: Omettre le passage considéré comme secondaire
  rationale: Le passage figure dans le témoin grec fourni, mais son caractère possiblement interpolé mérite d’être signalé sans le retrancher du texte traduit.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le lien de but introduit par ἵνα. « Vous aussi » rend l’insistance de καὶ ὑμεῖς sans alourdir la phrase.
