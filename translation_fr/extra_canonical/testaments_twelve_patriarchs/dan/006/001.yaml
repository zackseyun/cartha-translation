source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: fr
  text: Et maintenant, mes enfants, craignez le Seigneur et gardez-vous de Satan et de ses esprits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: craignez
  rationale: L’impératif « craignez » conserve le sens direct de respect mêlé de crainte devant le Seigneur, sans l’atténuer en simple révérence.
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: gardez-vous de
  rationale: Cette tournure française naturelle exprime l’idée de veiller sur soi afin de se tenir à distance d’un danger.
- source_word: τοῦ Σατανᾶ
  choice: Satan
  rationale: Le nom propre traditionnel rend directement le grec et reste immédiatement compréhensible.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: ses esprits
  rationale: La traduction littérale préserve le pluriel et le rapport d’appartenance ou d’association exprimé par αὐτοῦ.
theological_decisions:
- issue: Nature de la crainte du Seigneur
  choice: craignez le Seigneur
  alternative: révérez le Seigneur
  rationale: Le grec φοβήθητε désigne explicitement la crainte; la traduction ne réduit pas d’emblée cette tension théologique à la seule révérence.
- issue: Rapport entre Satan et les esprits
  choice: ses esprits
  alternative: les esprits qui lui sont associés
  rationale: Le possessif reproduit sobrement le génitif grec sans préciser davantage la nature de leur relation.
translation_notes:
  register: Français international moderne, simple et digne. L’adresse « mes enfants » et la coordination de la phrase grecque sont conservées, tandis que « gardez-vous de » offre une formulation idiomatique et claire.
