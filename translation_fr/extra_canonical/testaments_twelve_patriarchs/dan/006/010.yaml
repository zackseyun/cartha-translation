- from: Éloignez-vous donc de toute injustice et attachez-vous à la justice de Dieu ; ainsi, votre descendance sera sauvée pour toujours. Puis enterrez-moi auprès de mes pères.
  to: Éloignez-vous donc de toute injustice et attachez-vous à la justice de Dieu ; votre descendance sera vouée au salut pour toujours. Puis enterrez-moi auprès de mes pères.
  rationale: 'La révision remplace seulement « sera sauvée » par « sera vouée au salut », afin de rendre εἰς σωτηρίαν sans convertir une destination vers le salut en déclaration explicite de salut déjà obtenu. Aucun ajout de note n’est nécessaire : les appels de notes de l’édition source ne sont accompagnés d’aucun contenu critique dans les données fournies.'
