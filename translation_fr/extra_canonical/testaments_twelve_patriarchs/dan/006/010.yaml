source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀπόστητε οὖν ἀπὸ πάσης ἀδικίας καὶ κολλήθητε⁴⁹ τῇ δικαιοσύνῃ τοῦ⁵⁰ Θεοῦ⁵¹, καὶ ἔσται τὸ γένος ὑμῶν⁵² εἰς σωτηρίαν *ἕως τοῦ αἰῶνος⁵³. 11. *Καὶ θάψατέ με⁵⁴ ἐγγὺς τῶν πατέρων μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: fr
  text: Éloignez-vous donc de toute injustice et attachez-vous à la justice de Dieu ; votre descendance sera vouée au salut pour toujours. Puis enterrez-moi auprès de mes pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: Éloignez-vous
  rationale: Rend naturellement l’impératif appelant à se détourner et à prendre ses distances.
- source_word: κολλήθητε
  choice: attachez-vous
  rationale: Conserve l’image forte d’une adhésion étroite et durable.
- source_word: ἀδικίας
  choice: injustice
  rationale: Terme courant qui couvre ici ce qui est contraire à la justice morale.
- source_word: δικαιοσύνῃ τοῦ Θεοῦ
  choice: la justice de Dieu
  rationale: Traduction directe qui préserve la portée théologique et l’ambiguïté du génitif.
- source_word: τὸ γένος ὑμῶν
  choice: votre descendance
  rationale: Dans ce contexte familial et testamentaire, désigne naturellement les générations issues des destinataires.
- source_word: εἰς σωτηρίαν ἕως τοῦ αἰῶνος
  choice: sera sauvée pour toujours
  rationale: Expression française naturelle traduisant l’orientation vers le salut et sa durée permanente.
- source_word: θάψατέ με
  choice: enterrez-moi
  rationale: Équivalent direct et idiomatique de l’impératif grec.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: auprès de mes pères
  rationale: Préserve le langage ancestral traditionnel tout en restant compréhensible.
theological_decisions:
- issue: Nature de « la justice de Dieu »
  choice: Conserver « la justice de Dieu »
  alternative: « la justice que Dieu demande » ou « la justice accordée par Dieu »
  rationale: Le grec ne précise pas s’il s’agit principalement de la justice propre à Dieu, de celle qu’il exige ou de celle qu’il donne ; la formulation retenue maintient cette tension.
- issue: Construction « εἰς σωτηρίαν »
  choice: « sera sauvée »
  alternative: « sera destinée au salut »
  rationale: La tournure retenue est plus naturelle en français, sans préciser le mécanisme ni la nature exacte du salut.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination « ainsi » explicite le lien de conséquence porté par καὶ dans le contexte. « Mes pères » est conservé plutôt que « mes ancêtres » afin de respecter la formulation familiale et funéraire du texte source.
