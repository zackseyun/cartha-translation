review_pass:
  verdict: revise
  source_fidelity: La phrase « votre descendance sera sauvée » transforme εἰς σωτηρίαν (« pour/en vue du salut ») en un énoncé explicite de salut accompli. Le grec exprime la destination ou l’orientation vers le salut, sans préciser son mécanisme ni l’accomplissement individuel. Le reste rend fidèlement les impératifs et les expressions principales.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Sera vouée au salut » est idiomatique, tout en préservant mieux la valeur de εἰς σωτηρίαν que « sera sauvée ».
  terminology: « Injustice », « justice de Dieu », « descendance » et « auprès de mes pères » sont justes et conservent le registre testamentaire. « Justice de Dieu » maintient correctement l’ambiguïté du génitif grec.
  issues:
  - severity: medium
    issue: « votre descendance sera sauvée » pour ἔσται τὸ γένος ὑμῶν εἰς σωτηρίαν
    rationale: Cette formulation affirme le salut comme résultat accompli, alors que εἰς σωτηρίαν signifie littéralement « pour le salut » et laisse ouverte la manière dont ce salut est entendu ou réalisé. Il convient de conserver la nuance de destination.
  revised_text: Éloignez-vous donc de toute injustice et attachez-vous à la justice de Dieu ; votre descendance sera vouée au salut pour toujours. Puis enterrez-moi auprès de mes pères.
  revised_footnotes: []
