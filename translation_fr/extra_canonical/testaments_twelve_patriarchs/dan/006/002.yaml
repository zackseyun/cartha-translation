source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐγγίσατε⁴ τῷ θεῷ καὶ τῷ ἀγγέλῳ *τῷ παραιτουμένῳ ὑμᾶς⁵· ὅτι οὗτός ἐστι μεσίτης θεοῦ καὶ ἀνθρώπων καὶ⁶ ἐπὶ τῆς εἰρήνης τοῦ⁷ Ἰσραὴλ κατέναντι⁸ *τῆς βασιλείας τοῦ †θεοῦ στήσεται⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/002.yaml
  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: fr
  text: Approchez-vous de Dieu et de l’ange qui intercède pour vous, car celui-ci est médiateur entre Dieu et les êtres humains[a] ; et, pour la paix d’Israël, il se dressera face au royaume de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « médiateur entre Dieu et les êtres humains » traduit directement le grec. Le passage parle toujours d’un « ange » ; son identité n’est donc pas précisée davantage.
    reason: lexical_alternative
  - marker: b
    text: Le grec fourni porte « face au royaume de Dieu », formulation difficile dans ce contexte. Certaines traductions proposent par conjecture « face au royaume de l’ennemi ».
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: Approchez-vous
  rationale: Rend naturellement l’impératif aoriste exprimant le fait de s’approcher de Dieu.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: de l’ange qui intercède pour vous
  rationale: παραιτέομαι peut exprimer une supplication ou une intervention en faveur de quelqu’un ; « intercède pour vous » convient au contexte sans ajouter l’idée absente de « rester avec vous ».
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: médiateur entre Dieu et les êtres humains
  rationale: Traduction directe de la relation exprimée par les génitifs ; « êtres humains » est inclusif et actuel.
- source_word: ἐπὶ τῆς εἰρήνης τοῦ Ἰσραήλ
  choice: pour la paix d’Israël
  rationale: Expression française naturelle qui conserve la visée ou l’intérêt indiqué par ἐπί avec le génitif.
- source_word: κατέναντι … στήσεται
  choice: il se dressera face à
  rationale: Conserve l’image spatiale et potentiellement antagoniste de « se tenir/se dresser en face de », sans imposer « contre ».
theological_decisions:
- issue: Identité du « médiateur entre Dieu et les êtres humains »
  choice: Maintenir explicitement l’antécédent angélique sans l’identifier à une figure doctrinale ultérieure.
  alternative: Identifier ce médiateur au Christ ou à une autre figure précise.
  rationale: Le texte appelle lui-même cette figure « l’ange » ; la traduction préserve cette tension interne au lieu de la résoudre doctrinalement.
- issue: Lecture finale τοῦ θεοῦ
  choice: 'Traduire le texte grec fourni : « royaume de Dieu ».'
  alternative: Adopter la conjecture contextuelle « royaume de l’ennemi ».
  rationale: Même si « se dresser face au royaume de Dieu » est difficile dans le contexte, θεοῦ est la lecture transmise dans le texte fourni et doit rester visible ; une note signale la difficulté.
translation_notes:
  register: Français international moderne, clair et digne. « Approchez-vous », « intercède » et « se dressera face à » gardent la solennité du passage sans archaïsme. Les deux notes préservent les tensions lexicale et textuelle du grec.
