  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: fr
  text: Mais, au temps de l’iniquité d’Israël, le Seigneur ne s’éloignera pas d’eux, mais il passera à une nation qui recherche sa volonté, car aucun des anges ne sera son égal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase grecque est difficile : le texte transmis affirme que le Seigneur « ne s’éloignera pas d’eux », puis qu’« il passera à une nation qui recherche sa volonté ». La traduction conserve cette tension au lieu de l’atténuer.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: mépris de la loi
  rationale: Rend le sens de conduite contraire à la loi, plutôt qu’une simple absence de règles, dans un français naturel.
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: ne s’éloignera pas d’eux
  rationale: Préserve la négation transmise par le texte édité et le mouvement d’éloignement exprimé par le verbe.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: il passera à une nation
  rationale: Conserve le mouvement vers un autre peuple sans préciser davantage la nature de ce passage.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: qui cherche à faire sa volonté
  rationale: En français courant, chercher la volonté de quelqu’un implique ici de vouloir la connaître et l’accomplir.
- source_word: ἴσος αὐτῷ
  choice: son égal
  rationale: Expression française directe qui garde la comparaison avec le Seigneur comme référent le plus naturel.
theological_decisions:
- issue: Tension entre la non-séparation du Seigneur d’avec Israël et son passage à une autre nation
  choice: Maintenir les deux affirmations sans les harmoniser
  alternative: Comprendre ou corriger le premier membre comme « le Seigneur s’éloignera d’eux »
  rationale: Le texte grec édité comporte οὐκ ἔσται et affirme donc qu’il ne s’éloignera pas, tandis que la proposition suivante dit qu’il passera à une nation cherchant sa volonté. Cette difficulté textuelle et théologique doit rester visible.
- issue: Référent de αὐτῷ dans la comparaison avec les anges
  choice: Le Seigneur
  alternative: Un autre personnage implicite
  rationale: Le Seigneur est l’antécédent masculin singulier explicite qui gouverne l’ensemble de la phrase; la traduction ne crée pas de nouveau référent.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant la tension du grec. « Israël vivra dans le mépris de la loi » évite la lourdeur de « l’illégalité d’Israël »; « nation » maintient la portée collective de ἔθνος.
