  text: Et son nom sera partout en Israël et parmi les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: Et son nom
  rationale: « δέ » assure ici une transition ou une continuation naturelle, rendue simplement par « Et » ; « son nom » conserve l’expression grecque.
- source_word: ἐν παντὶ τόπῳ
  choice: sera connu partout
  rationale: Littéralement « sera en tout lieu ». En français, l’ajout de « connu » explicite naturellement le sens idiomatique probable de la présence ou de la renommée du nom, tout en gardant la portée générale de l’expression.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: « Parmi » exprime naturellement la présence au sein des peuples non israélites ; « les nations » conserve le vocabulaire traditionnel sans préciser davantage leur identité.
theological_decisions:
- issue: Nature de la présence du nom
  choice: « son nom sera connu »
  alternative: « son nom sera »
  rationale: Le grec est elliptique et dit littéralement que le nom « sera » en ces lieux. La formulation française explicite l’idée probable de notoriété, sans ajouter de contenu confessionnel.
translation_notes:
  register: Français international moderne, simple et digne. La phrase reste concise et maintient le contraste entre Israël et les nations.
