base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: fr
  text: Préservez-vous donc, mes enfants, de toute œuvre mauvaise. Rejetez loin de vous la colère et le mensonge, et aimez la vérité et la patience.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε … ἑαυτούς
  choice: Veillez … sur vous-mêmes, pour vous garder
  rationale: Le verbe exprime l’idée de se préserver soigneusement; cette formulation naturelle en français conserve à la fois la vigilance et la protection de soi.
- source_word: παντὸς ἔργου πονηροῦ
  choice: toute œuvre mauvaise
  rationale: « Œuvre » garde le caractère concret et moral de ἔργον, tandis que « mauvaise » rend πονηροῦ sans surinterprétation.
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: Rejetez loin de vous
  rationale: La tournure restitue l’image énergique d’un rejet hors de soi.
- source_word: τὸν θυμὸν
  choice: la colère
  rationale: Dans ce contexte d’exhortation morale, θυμός désigne la colère ou l’emportement; « colère » est clair et idiomatique.
- source_word: τὸ ψεῦδος
  choice: le mensonge
  rationale: Le singulier abstrait grec est naturellement rendu par « le mensonge », qui peut englober la fausseté et l’acte de mentir.
- source_word: τὴν μακροθυμίαν
  choice: la patience
  rationale: μακροθυμία évoque la patience durable, notamment face aux provocations; « patience » est accessible et convient au parallélisme de la phrase.
theological_decisions:
- issue: Portée morale de πονηρός
  choice: œuvre mauvaise
  alternative: œuvre du Malin
  rationale: La syntaxe décrit ici la qualité morale des actes et ne requiert pas de personnifier le mal.
- issue: Sens de μακροθυμία
  choice: patience
  alternative: longanimité
  rationale: « Patience » préserve le sens général sans employer un terme rare; le contexte ne justifie pas une nuance doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’adresse affectueuse « mes enfants » et la force impérative de l’exhortation sont conservées.
