  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: fr
  text: '**Testament de Dan 4**


    **1.** Comprenez donc la puissance de la fureur : elle est vaine.


    **2.** Elle est d’abord excitée par une parole ; ensuite, par des actes, elle fortifie celui qui s’irrite. Par de cruelles pertes, elle bouleverse son jugement et soulève ainsi son âme dans une grande fureur.


    **3.** Ainsi, lorsque quelqu’un parle contre vous, ne vous laissez pas entraîner à la colère. Et si quelqu’un vous loue comme des saints, ne vous élevez pas : ne passez ni au plaisir ni à l’aversion.


    **4.** Car elle charme d’abord l’oreille, puis aiguise l’esprit pour lui faire percevoir ce qui l’a irrité[a] ; une fois en fureur, l’homme pense que sa colère est juste.


    **5.** Mais si vous subissez quelque perte ou quelque ruine, enfants, ne vous laissez pas troubler. Car cet esprit même fait désirer ce qui est perdu, afin que l’on tombe dans la fureur à cause de cette épreuve[b].


    **6.** Et si vous subissez une perte, volontairement ou involontairement, ne vous affligez pas ; car de l’affliction naît aussi la fureur, accompagnée du mensonge[c].


    **7.** La fureur accompagnée du mensonge est un mal à deux visages. Tous deux s’allient pour troubler le cœur. Or, quand l’âme est continuellement troublée, le Seigneur s’éloigne d’elle, et Béliar règne sur elle[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile. On peut aussi comprendre : « pour lui faire percevoir la provocation » ou « pour lui faire percevoir ce qui a été excité ».'
    reason: alternative_reading
  - marker: b
    text: 'La construction grecque est difficile. Elle peut aussi se comprendre : « cet esprit même fait désirer ce qui se perd, afin que l’on tombe dans la fureur à cause de l’épreuve ».'
    reason: alternative_reading
  - marker: c
    text: « Accompagnée du mensonge » peut signifier que la fureur naît avec la tromperie, ou que le mensonge vient ensuite la renforcer.
    reason: alternative_reading
  - marker: d
    text: Béliar est un nom traditionnel de la puissance mauvaise ou de l’adversaire dans la littérature juive ancienne ; il est aussi transcrit « Bélial ».
    reason: cultural_note
lexical_decisions:
- source_word: θυμός
  choice: fureur
  rationale: Dans ce passage, le terme désigne une colère violente et envahissante. « Fureur » le distingue utilement de ὀργή, rendu par « colère » au verset 3.
- source_word: ματαία
  choice: vaine
  rationale: 'Conserve le jugement lapidaire du grec : cette puissance est vaine, futile ou sans valeur, sans préciser davantage le sens.'
- source_word: παροξύνεται
  choice: est excitée
  rationale: Rend le passif et l’idée d’une colère mise en mouvement par une parole.
- source_word: δυναμοῖ
  choice: fortifie
  rationale: Préserve l’image selon laquelle les actes donnent de la force à la personne qui s’irrite.
- source_word: ζημίαις πικραῖς
  choice: par de cruelles pertes
  rationale: Exprime la douleur des pertes sans les limiter à des dommages matériels.
- source_word: διαβούλιον
  choice: jugement
  rationale: Désigne ici la faculté de délibérer et de former une décision réfléchie, que la fureur bouleverse.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: ne vous laissez pas entraîner à la colère
  rationale: Conserve naturellement en français l’image grecque d’un mouvement vers la colère.
- source_word: ἐπαίρεσθε
  choice: ne vous élevez pas
  rationale: Maintient la métaphore de l’élévation de soi suscitée par la louange.
- source_word: τέρψιν … ἀηδίαν
  choice: plaisir … aversion
  rationale: Reproduit les deux réactions émotionnelles opposées dans un français courant et digne.
- source_word: ἐκθροεῖσθε
  choice: ne vous laissez pas troubler
  rationale: Rend l’agitation émotionnelle sans la réduire à la peur ou au désespoir.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittère le nom traditionnel de la puissance adverse au lieu de le réduire à une abstraction morale.
theological_decisions:
- issue: Action morale et spirituelle de « cet esprit »
  choice: Conserver « cet esprit même » comme agent qui pousse la personne vers la fureur.
  alternative: Rendre πνεῦμα par « impulsion » ou « disposition » et limiter le passage à un mécanisme psychologique.
  rationale: Le texte associe exhortation morale et conflit spirituel ; la traduction maintient ces deux dimensions sans définir plus précisément la nature de cet esprit.
- issue: κύριος dans ce testament juif parénétique
  choice: le Seigneur
  alternative: le SEIGNEUR ; le Maître
  rationale: « Le Seigneur » conserve la portée religieuse du titre sans identifier explicitement une forme du nom divin absente du grec.
- issue: Éloignement du Seigneur lorsque l’âme demeure troublée
  choice: Traduire directement « le Seigneur s’éloigne d’elle ».
  alternative: Atténuer en « la personne s’éloigne du Seigneur » ou expliquer l’énoncé comme une simple perception humaine.
  rationale: La formulation forte appartient au texte grec ; elle est conservée sans résoudre la tension théologique qu’elle peut susciter.
- issue: Personnalisation de Béliar
  choice: Conserver « Béliar règne sur elle ».
  alternative: Traduire « le mal règne sur elle ».
  rationale: Le grec emploie un nom propre traditionnel et présente Béliar comme puissance adverse ; le neutraliser effacerait cette dimension du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « fureur » reproduit le fil directeur du grec, tandis que « colère » est réservé à ὀργή. Les ambiguïtés syntaxiques et théologiques les plus importantes sont conservées dans le texte ou signalées en note.
