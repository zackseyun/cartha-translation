lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: craignez le Seigneur
  rationale: Conserve la force de l’impératif d’exhortation ; « révérez » serait possible, mais atténuerait l’avertissement.
- source_word: προσέχετε ἑαυτοῖς ἀπὸ τοῦ Σατανᾶ
  choice: tenez-vous en garde contre Satan
  rationale: Formulation française actuelle qui maintient à la fois la vigilance réflexive et l’idée de se préserver d’un danger.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: l’ange qui intercède pour vous
  rationale: Le sens d’intercession convient au contexte immédiat, qui qualifie ensuite l’ange de médiateur.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: médiateur entre Dieu et les êtres humains
  rationale: Rend précisément μεσίτης tout en employant un français générique naturel pour ἀνθρώπων.
- source_word: ὑποσκελίζειν
  choice: faire trébucher
  rationale: Préserve l’image concrète d’une chute provoquée par l’ennemi.
- source_word: ἐπιστρέψει Ἰσραήλ
  choice: Israël reviendra à Dieu
  rationale: Explicite le mouvement religieux impliqué par le contexte, sans employer le terme technique « se repentira ».
- source_word: εἰς τέλος κακῶν
  choice: dans le comble du mal
  rationale: Exprime l’idée d’un mal poussé à son extrême, malgré la construction grecque concise et difficile.
- source_word: ἐν καιρῷ τῆς ἀνομίας τοῦ Ἰσραήλ
  choice: au temps où Israël vivra dans le mépris de la Loi
  rationale: Dans ce contexte juif, ἀνομία évoque non seulement l’injustice mais la transgression ou le rejet de la Loi.
- source_word: τὸ γένος ὑμῶν ... εἰς σωτηρίαν
  choice: votre descendance contribuera au salut
  rationale: La construction εἰς σωτηρίαν indique une orientation ou une fonction en vue du salut ; « contribuera au salut » reste intelligible sans préciser indûment le mécanisme.
- source_word: θάψατέ με ἐγγὺς τῶν πατέρων μου
  choice: Ensevelissez-moi près de mes pères
  rationale: Conserve le registre testamentaire et l’expression ancestrale du grec.
theological_decisions:
- issue: Identité de l’ange intercesseur appelé médiateur
  choice: Maintenir ensemble les désignations d’« ange » et de « médiateur » sans identifier davantage la figure.
  alternative: L’identifier à un ange protecteur d’Israël, à une figure messianique ou à une référence chrétienne ultérieure.
  rationale: Le grec juxtapose explicitement ces termes ; préciser l’identité supprimerait une ambiguïté réelle du texte.
- issue: Tension du verset 6 entre la présence du Seigneur auprès d’Israël et son passage à une autre nation
  choice: Traduire les deux affirmations et signaler leur tension en note.
  alternative: Supprimer la négation, faire d’une autre figure le sujet du second verbe, ou harmoniser théologiquement les deux propositions.
  rationale: Le témoin fourni est textuellement difficile ; la traduction ne doit pas résoudre silencieusement cette difficulté.
- issue: Passage sur le Sauveur des nations au verset 9
  choice: Inclure le passage entre crochets et expliquer son statut en note.
  alternative: L’omettre comme interpolation ou l’imprimer sans indication textuelle.
  rationale: Le passage appartient au texte grec fourni tout en étant marqué comme expansion possible ; les crochets préservent les deux données.
translation_notes:
  register: Français international moderne, digne et accessible, avec un registre testamentaire légèrement élevé. Les termes bibliques courants (« craignez le Seigneur », « invoquent », « justice de Dieu ») sont conservés lorsqu’ils restent immédiatement compréhensibles. Les ambiguïtés textuelles et théologiques ne sont pas harmonisées.
