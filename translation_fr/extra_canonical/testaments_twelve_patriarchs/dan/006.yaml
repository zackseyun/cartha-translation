  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
translation:
  language: fr
  text: '1 Et maintenant, mes enfants, craignez le Seigneur et tenez-vous en garde contre Satan et ses esprits. 2 Approchez-vous de Dieu et de l’ange qui intercède pour vous, car il est médiateur entre Dieu et les êtres humains[a] et, pour la paix d’Israël, il se dressera contre le royaume de l’ennemi. 3 Voilà pourquoi l’ennemi s’efforce de faire trébucher tous ceux qui invoquent le Seigneur. 4 Il sait en effet que, le jour où Israël reviendra, son royaume prendra fin. 5 Car l’ange de la paix lui-même fortifiera Israël, afin qu’il ne tombe pas dans le mal extrême. 6 Mais, au temps de l’injustice d’Israël, le Seigneur ne s’éloignera pas d’eux ; pourtant, il passera à une nation qui recherche sa volonté, car aucun des anges ne sera son égal[b]. 7 Son nom sera en tout lieu d’Israël et parmi les nations.


    8 Gardez-vous donc, mes enfants, de toute œuvre mauvaise. Rejetez loin de vous la colère et le mensonge, et aimez la vérité et la patience. 9 Ce que vous avez entendu de votre père, transmettez-le, vous aussi, à vos enfants, [afin que le Sauveur des nations vous accueille ; car il est vrai et patient, doux et humble, et, par ses œuvres, il enseigne la loi du Seigneur][c]. 10 Éloignez-vous donc de toute injustice et attachez-vous à la justice de Dieu ; alors votre descendance connaîtra le salut pour toujours. 11 Ensevelissez-moi près de mes pères.


    [a] L’expression « médiateur entre Dieu et les êtres humains » traduit directement le grec. Le passage parle toujours d’un « ange » : son identité n’est donc pas précisée à partir de catégories doctrinales postérieures.


    [b] Le grec présente ici une difficulté : le texte donné affirme que le Seigneur « ne s’éloignera pas d’eux », puis qu’il « passera à une nation qui recherche sa volonté ». La traduction conserve cette tension sans chercher à l’harmoniser.


    [c] La proposition placée entre crochets est souvent considérée comme une expansion ou une interpolation tardive. Elle est traduite ici parce qu’elle figure dans le témoin grec fourni.'
  philosophy: optimal-equivalence
  footnotes:
