base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: fr
  text: La haine est donc un mal, car elle s’attache constamment au mensonge et parle contre la vérité ; elle grossit les petites choses, présente la lumière comme des ténèbres et appelle amer ce qui est doux. Elle enseigne la calomnie, attise la colère et provoque la guerre ; elle remplit le cœur d’arrogance, de toute avidité, de maux et d’un poison diabolique.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῖσος
  choice: la haine
  rationale: Équivalent français direct, naturel et conforme à la force morale du terme grec.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: elle s’attache constamment au mensonge
  rationale: Rend l’idée d’une association persistante avec le mensonge sans alourdir la phrase par le double aspect duratif des deux termes grecs.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: elle grossit les petites choses
  rationale: Formulation idiomatique qui conserve l’image grecque consistant à faire devenir grandes les petites choses.
- source_word: τὸ φῶς σκότος παρέχει
  choice: présente la lumière comme des ténèbres
  rationale: Préserve l’opposition lumière-ténèbres et la valeur factitive ou représentative de παρέχει.
- source_word: συκοφαντίαν ἐκδιδάσκει
  choice: elle enseigne la calomnie
  rationale: Traduction formellement proche et intelligible ; συκοφαντία désigne ici la calomnie ou l’accusation mensongère.
- source_word: ὀργὴν ἐκταράσσει
  choice: attise la colère
  rationale: Expression française naturelle pour l’action de soulever ou d’exciter fortement la colère.
- source_word: πόλεμον διεγείρει
  choice: provoque la guerre
  rationale: Rend clairement l’idée d’éveiller, susciter ou déclencher un conflit.
- source_word: ὕβριν
  choice: arrogance
  rationale: Dans cette liste de dispositions mauvaises, « arrogance » restitue la démesure insolente exprimée par ὕβρις.
- source_word: πλεονεξίαν
  choice: avidité
  rationale: Terme assez large pour couvrir le désir d’avoir toujours davantage, sans restreindre le sens à la seule cupidité financière.
- source_word: ἰοῦ διαβολικοῦ
  choice: d’un poison diabolique
  rationale: ἰός peut désigner le poison ou le venin ; « poison » convient au contexte moral, tandis que διαβολικός est conservé sans explicitation doctrinale.
theological_decisions:
- issue: Portée de διαβολικοῦ
  choice: diabolique
  alternative: du diable
  rationale: L’adjectif grec qualifie directement le poison ; la traduction adjectivale préserve cette forme et évite de préciser inutilement s’il s’agit d’une origine personnelle ou d’une qualité.
- issue: Relation syntaxique de κακῶν καὶ ἰοῦ διαβολικοῦ avec le remplissage du cœur
  choice: de maux et d’un poison diabolique
  alternative: elle remplit de maux et d’un poison diabolique le cœur déjà caractérisé par l’arrogance et l’avidité
  rationale: La ponctuation et la construction de l’énumération sont difficiles. La version retenue maintient tous les éléments comme contenus du cœur, conformément au mouvement général de la phrase, sans imposer une hiérarchie théologique entre eux.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue accumulation rhétorique du grec est conservée, avec une ponctuation française qui en clarifie la progression. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
