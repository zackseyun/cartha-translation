base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: fr
  text: 11 Ainsi donc, puisque mon foie était sans pitié envers Joseph, moi aussi, souffrant du foie, je fus jugé sans pitié pendant dix ans, tout le temps où je m’acharnais contre Joseph[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec rendu par « je m’acharnais contre » est difficile dans cette construction et peut évoquer le fait de faire pression sur Joseph ou de persister dans une attitude hostile envers lui.
    reason: Signaler l’ambiguïté de ἐπείχον τῷ Ἰωσήφ tout en conservant dans le texte la proposition attestée.
lexical_decisions:
- source_word: τὰ ἥπατά μου / τῷ ἥπατι
  choice: mon foie / atteint au foie
  rationale: Conserve l’image corporelle répétée du grec et le lien de rétribution entre l’attitude de Gad envers Joseph et son propre mal.
- source_word: ἀνιλέως
  choice: sans pitié
  rationale: Rend le même adverbe de façon identique dans ses deux emplois, afin de préserver le parallélisme moral du texte.
- source_word: ἐκρινόμην
  choice: je fus jugé
  rationale: Maintient le sens judiciaire et théologique du passif grec sans préciser explicitement l’auteur du jugement.
- source_word: ἐπὶ χρόνους δέκα
  choice: pendant dix ans
  rationale: Le contexte et la tradition textuelle soutiennent ici la durée de dix ans, comme dans la révision anglaise auditée.
theological_decisions:
- issue: Agent du jugement exprimé par le passif ἐκρινόμην
  choice: 'Ne pas nommer l’agent : « je fus jugé »'
  alternative: « Dieu me jugea » ou « je fus châtié »
  rationale: Le grec emploie un passif sans agent explicite. La traduction conserve cette retenue et n’impose ni une identification divine explicite ni une réduction du jugement au seul châtiment.
- issue: Rapport entre l’hostilité envers Joseph et la maladie du foie
  choice: Préserver le parallélisme verbal sans expliquer davantage la causalité
  alternative: Expliciter une punition correspondant exactement au péché
  rationale: Le verset présente une correspondance rétributive forte, mais la traduction ne doit pas ajouter une formulation doctrinale absente du grec.
translation_notes:
  register: 'Français international moderne, digne et direct. La répétition de « foie » et de « sans pitié » est volontaire : elle reproduit la structure rhétorique et la logique de rétribution du grec. « Était sans pitié envers » est plus naturel en français que le calque spatial « gisait contre », tout en gardant la personnification de l’organe.'
