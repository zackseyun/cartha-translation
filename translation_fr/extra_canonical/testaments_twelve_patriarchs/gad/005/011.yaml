    issue: La proposition finale grecque est omise du texte traduit.
    rationale: Une note qui signale une clause difficile ne remplace pas sa traduction lorsque le sens général peut être rendu sans conjecture excessive. L’omission réduit le contenu temporel et narratif du verset.
  - severity: low
    issue: « Atteint au foie » est moins directement lié au participe πάσχων.
    rationale: « Souffrant du foie » rend plus naturellement et plus précisément l’idée de souffrance en français moderne.
