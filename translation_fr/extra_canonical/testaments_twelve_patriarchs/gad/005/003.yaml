base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: fr
  text: La justice chasse la haine, et l’humilité supprime la jalousie. Car le juste, dans son humilité, a honte de commettre ce qui est injuste, condamné non par un autre, mais par son propre cœur, car le Seigneur veille sur son âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justice
  rationale: Rend naturellement la qualité morale désignée ici et maintient son lien avec δίκαιος dans la phrase suivante.
- source_word: ἐκβάλλει
  choice: chasse
  rationale: Conserve l’image énergique d’expulsion exprimée par le verbe grec.
- source_word: ταπείνωσις
  choice: humilité
  rationale: Dans ce contexte moral, le substantif désigne l’humilité plutôt que l’abaissement imposé.
- source_word: τὸ ζῆλος
  choice: la jalousie
  rationale: Le contexte négatif favorise « jalousie » plutôt que le sens positif possible de « zèle ».
- source_word: αἰδεῖται
  choice: a honte
  rationale: Exprime la retenue morale et la honte devant l’acte injuste.
- source_word: καταγινωσκόμενος
  choice: le condamne
  rationale: Le participe peut évoquer le fait d’être reconnu coupable ou condamné; la formulation française explicite l’agent contrasté, autrui puis le cœur propre.
- source_word: ἐπισκοπεῖ
  choice: veille sur
  rationale: Rend l’idée de regard attentif et de surveillance divine sans durcir le sens en jugement explicite.
theological_decisions:
- issue: Rôle du cœur dans la condamnation morale
  choice: « parce que son propre cœur le condamne »
  alternative: « sous le jugement de son propre cœur »
  rationale: La formulation garde le parallélisme avec la condamnation par autrui et présente le cœur comme témoin intérieur, sans identifier techniquement celui-ci à la conscience.
- issue: Sens de la surveillance divine
  choice: « le Seigneur veille sur son âme »
  alternative: « le Seigneur examine son âme »
  rationale: Le grec ἐπισκοπεῖ permet une nuance de surveillance ou d’attention. « Veille sur » préserve cette portée sans décider si l’accent est pastoral ou judiciaire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du raisonnement grec tout en évitant une tournure maladroite telle que « le juste, humblement, a honte ». Le masculin générique « celui qui est juste » traduit ὁ δίκαιος sans ajouter de précision absente du texte.
