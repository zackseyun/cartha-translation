id: T12P.GAD.5.5
reference: Testament of Gad 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: fr
  text: Car, craignant d’offenser le Seigneur, il ne veut en aucune manière faire du tort à quelqu’un, pas même en pensée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενος
  choice: dans sa crainte
  rationale: Rend le participe causal avec γάρ tout en conservant l’idée de crainte révérencielle.
- source_word: προσκρούσαι Κυρίῳ
  choice: offenser le Seigneur
  rationale: Dans ce contexte moral, προσκρούω avec le datif exprime le fait de heurter ou de se rendre fautif envers le Seigneur; «offenser» est naturel et digne en français.
- source_word: τὸ καθόλου
  choice: en aucune manière
  rationale: Reproduit l’insistance absolue de l’expression grecque, renforcée par la négation.
- source_word: ἕως ἐννοίας
  choice: pas même en pensée
  rationale: Expression idiomatique française qui conserve l’extension de l’interdit jusqu’au domaine intérieur de l’intention ou de la pensée.
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: faire du tort à quelqu’un
  rationale: ἀδικέω signifie traiter injustement, léser ou faire du tort; «quelqu’un» rend ici le sens générique de ἄνθρωπον sans marquage de genre inutile.
theological_decisions:
- issue: Nature de la crainte du Seigneur
  choice: Conserver simplement «crainte», sans la qualifier
  alternative: «respect révérenciel» ou «peur»
  rationale: Le grec φοβούμενος peut comporter plusieurs nuances; la traduction ne tranche pas entre peur et révérence.
- issue: Portée intérieure de l’exigence morale
  choice: «pas même en pensée»
  alternative: «pas même dans son intention»
  rationale: La formulation garde la tension entre pensée et intention présente dans ἐννοία, sans ajouter une doctrine particulière de la faute intérieure.
translation_notes:
  register: Français international moderne, fluide et digne. La structure causale et la forte insistance négative du grec sont préservées sans lourdeur littérale.
