source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. *Οὐ καταλαλεῖ³⁷ *ἀνδρὸς ὁσίου³⁸, ἐπειδὴ ὁ φόβος τοῦ Θεοῦ³⁹ *οἰκεῖ ἐν αὐτῷ⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/004.yaml
  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: fr
  text: Il ne dit pas de mal d’un homme saint, parce que la crainte de Dieu habite en lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: dit du mal de
  rationale: Le verbe signifie parler contre quelqu’un, notamment en le dénigrant ou en le calomniant. « Dire du mal de » est naturel en français moderne tout en conservant la portée générale du grec.
- source_word: ἀνδρὸς ὁσίου
  choice: d’un homme saint
  rationale: « Homme saint » rend directement ἀνήρ et ὅσιος, ce dernier désignant ici une personne pieuse ou consacrée à Dieu.
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: la crainte de Dieu
  rationale: Cette expression biblique établie préserve la dimension de respect révérenciel et d’obéissance impliquée par φόβος.
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: habite en lui
  rationale: La formulation conserve l’image forte et personnelle du verbe οἰκέω, plutôt que de l’aplatir en « est présent ».
theological_decisions:
- issue: Référent du pronom αὐτῷ
  choice: Conserver « en lui », avec son ambiguïté grammaticale
  alternative: Expliciter « en celui qui ne médit pas » ou « en l’homme saint »
  rationale: Le grec permet formellement de rattacher le pronom au sujet implicite ou à « l’homme saint ». La traduction ne tranche donc pas silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du grec sans paraître artificielle.
