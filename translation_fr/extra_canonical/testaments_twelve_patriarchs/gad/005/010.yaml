  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: fr
  text: Car c’est par les choses mêmes par lesquelles quelqu’un transgresse la loi qu’il est puni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δι’ ὧν ... δι’ ἐκείνων
  choice: par les choses mêmes qui… qu’il…
  rationale: Conserve la construction corrélative et l’idée de correspondance directe entre les moyens de la faute et ceux du châtiment, tout en produisant une phrase française naturelle.
- source_word: ἄνθρωπος
  choice: quelqu’un
  rationale: Rend la portée générique du grec sans limiter l’énoncé aux hommes de sexe masculin.
- source_word: παρανομεῖ
  choice: transgresser la loi
  rationale: Exprime explicitement la notion de violation d’une norme ou d’une loi contenue dans παρανομέω.
- source_word: κολάζεται
  choice: est puni
  rationale: Reproduit simplement le passif présent grec, sans préciser l’agent ni la nature du châtiment.
theological_decisions:
- issue: Correspondance entre la faute et le châtiment
  choice: Conserver l’idée que les choses employées pour transgresser deviennent celles par lesquelles la personne est punie.
  alternative: Généraliser en disant seulement que chacun est puni selon ses fautes.
  rationale: La répétition grecque Δι’ ὧν… δι’ ἐκείνων établit une correspondance instrumentale forte qu’il ne faut ni atténuer ni expliquer davantage.
translation_notes:
  register: Français international moderne, sobre et sentencieux. La formulation reste digne et accessible, avec une syntaxe légèrement resserrée adaptée à une maxime morale.
