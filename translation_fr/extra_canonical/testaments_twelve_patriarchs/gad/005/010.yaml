  source_fidelity: Le sens de la corrélation instrumentale Δι’ ὧν … δι’ ἐκείνων et du passif présent κολάζεται est bien visé. Toutefois, « qui servent à quelqu’un pour » ajoute légèrement l’idée que les choses ont une fonction ou une utilité au service de la transgression, idée qui n’est pas explicitement exprimée par le grec.
  naturalness: La phrase proposée est compréhensible, mais « servir à quelqu’un pour transgresser » est plus lourd et moins idiomatique qu’une reprise directe de « par lesquelles ».
  terminology: « Transgresser la loi » rend adéquatement παρανομεῖ dans cette maxime; « est puni » rend sans surcharge κολάζεται. « Quelqu’un » conserve la portée générique de ἄνθρωπος en français moderne.
