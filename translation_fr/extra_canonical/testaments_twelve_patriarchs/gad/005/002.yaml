source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ταῦτα οὖν¹⁹ ἐκ πείρας²⁰ λέγω ὑμῖν, τέκνα μου, ὅπως ἐξώσητε²¹ τὸ μῖσος *τὸ διαβολικόν²², καὶ κολληθῆτε τῇ ἀγάπῃ τοῦ²³ Θεοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: fr
  text: C’est donc par expérience que je vous dis cela, mes enfants, afin que vous chassiez la haine diabolique et que vous vous attachiez à l’amour de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: par expérience
  rationale: Rend directement l’idée d’un enseignement fondé sur l’expérience vécue.
- source_word: ἐξώσητε
  choice: vous chassiez
  rationale: Préserve la force du verbe, qui signifie expulser ou faire sortir, tout en restant naturel en français.
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: la haine diabolique
  rationale: Conserve la qualification adjectivale explicite de la haine sans préciser davantage si elle vient du diable ou lui ressemble.
- source_word: κολληθῆτε
  choice: vous vous attachiez
  rationale: Exprime l’adhésion étroite et durable portée par le verbe grec.
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: à l’amour de Dieu
  rationale: Reproduit naturellement le génitif grec tout en laissant ouverte sa nuance subjective ou objective.
theological_decisions:
- issue: Sens du génitif dans « l’amour de Dieu »
  choice: Conserver « l’amour de Dieu »
  alternative: « l’amour pour Dieu » ou « l’amour que Dieu donne »
  rationale: Le grec τοῦ Θεοῦ est susceptible de plusieurs relations sémantiques; la formulation française maintient cette ambiguïté théologique.
- issue: Portée de « diabolique »
  choice: Qualifier directement la haine de « diabolique »
  alternative: « la haine du diable »
  rationale: Le texte grec emploie un adjectif et non un génitif; la traduction évite donc d’imposer une relation de possession ou d’origine.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure emphatique « C’est donc par expérience que… » souligne ἐκ πείρας sans alourdir la phrase. Aucun marqueur de note n’est requis.
