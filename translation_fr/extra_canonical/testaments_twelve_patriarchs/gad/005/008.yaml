source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: fr
  text: Et il n’a pas appris cela d’êtres humains, mais il sait, par le repentir, accueillir ceux qui reviennent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ ἀνθρώπων
  choice: des êtres humains
  rationale: Rend le pluriel grec de manière inclusive et naturelle, sans le limiter aux hommes de sexe masculin.
- source_word: διὰ μετανοίας
  choice: à cause de la repentance
  rationale: Conserve le rapport causal ou médiateur du grec sans préciser explicitement à qui appartient la repentance.
- source_word: τοὺς ἐπιστρέφοντας
  choice: ceux qui reviennent
  rationale: Préserve le sens de retour ou de changement d’orientation, ainsi que son lien sémantique avec la repentance.
- source_word: δέχεσθαι
  choice: accueillir
  rationale: Exprime naturellement l’idée de recevoir favorablement ou d’accepter des personnes.
theological_decisions:
- issue: Rapport entre la repentance et l’accueil de ceux qui reviennent
  choice: Conserver la formulation « à cause de la repentance »
  alternative: « par la repentance » ou « ceux qui reviennent dans la repentance »
  rationale: Le grec διὰ μετανοίας permet plusieurs nuances et la syntaxe reste théologiquement tendue; la traduction évite d’attribuer silencieusement la repentance soit au sujet, soit à ceux qui reviennent.
translation_notes:
  register: Français moderne, clair et digne. La légère étrangeté de « il sait, à cause de la repentance » est maintenue afin de ne pas résoudre une ambiguïté réelle du grec.
