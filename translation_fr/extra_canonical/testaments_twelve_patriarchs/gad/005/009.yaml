base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: fr
  text: Car Dieu m’infligea une maladie du foie et, si les prières de mon père ne m’avaient pas secouru, mon esprit aurait presque défailli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε … μοι
  choice: m’infligea
  rationale: Le verbe signifie littéralement « fit venir sur moi ». Dans ce contexte de maladie envoyée par Dieu, « infligea » rend naturellement l’idée sans alourdir la phrase.
- source_word: νόσον ἥπατος
  choice: une maladie du foie
  rationale: Traduction directe et intelligible de l’expression grecque.
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: les prières de mon père
  rationale: εὐχαί désigne ici des prières ou supplications, comme le confirme leur fonction secourable.
- source_word: ἐβοήθησάν μοι
  choice: ne m’avaient pas secouru
  rationale: Le verbe signifie « venir en aide, secourir ». Le plus-que-parfait convient à l’irréel du passé en français.
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: il s’en serait fallu de peu que mon esprit ne m’abandonne
  rationale: Cette tournure française rend l’idée de « presque » portée par ὀλίγου δεῖν et le sens de ἐκλείπω, « défaillir, s’éteindre, abandonner », tout en conservant πνεῦμα comme « esprit ».
theological_decisions:
- issue: Causalité divine de la maladie
  choice: Dieu m’infligea une maladie
  alternative: Dieu fit venir sur moi une maladie
  rationale: Le texte attribue explicitement à Dieu l’arrivée de la maladie. La traduction conserve cette causalité sans l’atténuer, tandis que « infligea » reste idiomatique et digne.
- issue: Efficacité des prières du père
  choice: les prières de mon père ne m’avaient pas secouru
  alternative: les prières de mon père ne m’étaient pas venues en aide
  rationale: Le texte présente les prières comme le moyen du secours, sans expliquer le mécanisme ni préciser davantage leur rapport à l’action divine.
- issue: Sens de πνεῦμα
  choice: mon esprit
  alternative: mon souffle / ma vie
  rationale: « Esprit » préserve la portée possible de πνεῦμα et l’ambiguïté entre défaillance vitale et réalité spirituelle, plutôt que de réduire le mot à la seule respiration ou à la mort.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conditionnelle irréelle est rendue idiomatiquement, et l’ambiguïté de « mon esprit » est préservée.
