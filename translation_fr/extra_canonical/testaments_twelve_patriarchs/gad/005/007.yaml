id: T12P.GAD.5.7
reference: Testament of Gad 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: fr
  text: Car la véritable repentance selon Dieu [enlève l’ignorance et][a] met les ténèbres en fuite, éclaire les yeux, donne la connaissance à l’âme et guide la pensée vers le salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « enlève l’ignorance et » sont textuellement incertains.
    reason: L’édition grecque place ἀναιρεῖ τὴν ἄγνοιαν καὶ entre crochets, signalant que ces mots peuvent ne pas appartenir au texte original.
lexical_decisions:
- source_word: ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: la véritable repentance selon Dieu
  rationale: « Repentance » rend le sens moral et spirituel de μετάνοια, tandis que « selon Dieu » conserve sans la préciser davantage la relation exprimée par κατὰ Θεόν.
- source_word: φυγαδεύει τὸ σκότος
  choice: met les ténèbres en fuite
  rationale: Cette expression naturelle en français préserve l’image énergique du verbe φυγαδεύει.
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: donne la connaissance à l’âme
  rationale: Traduction directe qui conserve les notions distinctes de connaissance et d’âme.
- source_word: ὁδηγεῖ τὸ διαβούλιον πρὸς σωτηρίαν
  choice: guide la pensée vers le salut
  rationale: « La pensée » rend ici la faculté de réflexion ou de délibération désignée par διαβούλιον, dans un français courant, sans la réduire à la seule volonté ou à un projet.
theological_decisions:
- issue: Sens de κατὰ Θεόν appliqué à la repentance
  choice: selon Dieu
  alternative: conforme à la volonté de Dieu
  rationale: La formulation retenue préserve la concision et l’ouverture sémantique du grec, sans expliciter une relation théologique que le texte ne détaille pas.
- issue: Orientation de la faculté intérieure vers le salut
  choice: guide la pensée vers le salut
  alternative: guide l’intelligence vers le salut
  rationale: « Pensée » conserve l’idée d’une activité intérieure délibérative sans suggérer que le salut résulterait uniquement de l’intellect.
translation_notes:
  register: Français international moderne, clair et digne. La structure cumulative et les images du grec sont conservées; la proposition textuellement incertaine reste entre crochets et reçoit une note.
