  text: 6. Ταῦτα *ἐγὼ ἔσχατον⁴⁷ ἔγνων μετὰ τὸ μετανοῆσαί⁴⁸ με περὶ⁴⁹ Ἰωσήφ⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/006.yaml
  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: fr
  text: Ce n’est qu’à la fin que j’ai compris ces choses, après m’être repenti au sujet de Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατον
  choice: seulement à la fin
  rationale: Exprime naturellement la valeur adverbiale « finalement, à la fin » tout en conservant l’idée que cette compréhension est venue tardivement.
- source_word: ἔγνων
  choice: j’ai compris
  rationale: Dans ce contexte de prise de conscience morale, « comprendre » rend mieux γινώσκω que le simple fait d’apprendre une information.
- source_word: μετανοῆσαί με
  choice: m’être repenti
  rationale: Restitue la portée morale de μετανοέω, plus forte qu’un simple changement d’avis.
- source_word: περὶ Ἰωσήφ
  choice: de ce que j’avais fait à Joseph
  rationale: Le grec est littéralement « au sujet de Joseph », mais le contexte renvoie au comportement de Gad envers Joseph; cette formulation française rend le sens implicite sans lui attribuer une doctrine particulière.
theological_decisions:
- issue: Portée de la repentance concernant Joseph
  choice: de ce que j’avais fait à Joseph
  alternative: au sujet de Joseph
  rationale: La formulation retenue explicite l’objet moral de la repentance et évite en français l’ambiguïté maladroite de « se repentir au sujet de quelqu’un », tout en restant conforme au contexte narratif.
translation_notes:
  register: 'Français moderne, clair et digne. La phrase conserve la progression du grec : compréhension tardive, puis indication qu’elle est survenue après la repentance.'
