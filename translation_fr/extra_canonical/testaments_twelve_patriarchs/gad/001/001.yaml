  text: I. Ἀντίγραφον διαθήκης Γάδ², ἣ³ ἐλάλησε⁴ τοῖς υἱοῖς αὐτοῦ⁵ ἐν *τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς⁶ αὐτοῦ, *λέγων αὐτοῖς⁷.
