base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/001.yaml
  text: 'The copy of the testament of Gad, which he spoke to his sons in the one hundred and twenty-fifth year of his life, saying to them:'
translation:
  language: fr
  text: '1. Copie du testament de Gad, qu’il adressa à ses fils dans la cent vingt-cinquième année de sa vie, en leur disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Rend directement l’idée d’une transcription ou d’un exemplaire écrit, tout en restant naturel comme intitulé.
- source_word: διαθήκης
  choice: testament
  rationale: Dans ce contexte littéraire, le mot désigne les dernières paroles et dispositions attribuées au patriarche.
- source_word: ἐλάλησε
  choice: prononça
  rationale: Exprime ici le fait de communiquer solennellement ce testament à ses fils, sans alourdir la phrase par « parla ».
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: dans la cent vingt-cinquième année de sa vie
  rationale: Conserve la manière grecque de compter l’année en cours plutôt que de reformuler par un âge révolu.
- source_word: λέγων αὐτοῖς
  choice: 'Il leur dit :'
  rationale: Transforme naturellement le participe grec introducteur de discours en proposition autonome française.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation garde le caractère d’un incipit testamentaire tout en évitant le calque peu naturel « qu’il parla à ses fils ».
