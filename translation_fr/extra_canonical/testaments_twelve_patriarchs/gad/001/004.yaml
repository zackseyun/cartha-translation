    rationale: ἐποίμαινε est à l’imparfait et décrit une activité durable ; « gardait » est plus fidèle que le passé simple perfectif « garda ».
  - severity: low
    issue: Nuance de « comme il était jeune »
    rationale: « Comme » peut introduire une cause explicite. « Encore jeune » préserve mieux la valeur descriptive du participe ὑπάρχων νέος tout en restant naturel.
