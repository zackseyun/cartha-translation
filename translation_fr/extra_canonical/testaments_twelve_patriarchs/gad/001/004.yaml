  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: fr
  text: 4 Joseph, mon frère, gardait les troupeaux avec nous depuis trente jours et, encore jeune, il fut affaibli par la chaleur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινε
  choice: garda les troupeaux
  rationale: Le verbe signifie « faire paître, garder comme berger ». En français, « garder les troupeaux » exprime naturellement l’activité pastorale sans ajouter l’idée plus large de « tout le bétail ».
- source_word: ἕως ἡμέρας τριάκοντα
  choice: pendant trente jours
  rationale: Dans ce contexte temporel, la tournure indique la durée de l’activité. « Pendant trente jours » est la formulation française la plus naturelle.
- source_word: ὑπάρχων νέος
  choice: comme il était jeune
  rationale: Cette proposition circonstancielle conserve le lien établi par le grec entre la jeunesse de Joseph et son affaiblissement.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: il fut affaibli par la chaleur brûlante
  rationale: Le passif décrit une perte de forces causée par une chaleur intense. « Chaleur brûlante » rend καύσων sans limiter nécessairement le sens à un vent chaud précis.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la syntaxe grecque tout en évitant le calque peu naturel « il faisait paître avec nous ».
