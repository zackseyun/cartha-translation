  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/005.yaml
  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: fr
  text: 5. Il retourna à Hébron auprès de notre père. Et il le fit s’allonger près de lui, car il l’aimait beaucoup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: retourna
  rationale: Rend directement l’idée d’un retour, avec un passé simple adapté au récit.
- source_word: πρὸς τὸν πατέρα ἡμῶν
  choice: auprès de notre père
  rationale: « Auprès de » exprime naturellement le mouvement vers une personne sans confondre ce complément avec « à Hébron ».
- source_word: ἀνέκλινεν
  choice: fit prendre place
  rationale: Expression française naturelle pour l’action de faire s’installer ou s’allonger auprès de quelqu’un; elle évite le calque peu idiomatique « fit s’étendre » sans ajouter explicitement un repas absent du verset.
- source_word: πλησίον αὐτοῦ
  choice: près de lui
  rationale: Conserve simplement la proximité exprimée par le grec et maintient la chaîne pronominale du texte.
- source_word: πάνυ
  choice: beaucoup
  rationale: Rend l’intensité de l’amour dans un français courant et digne.
theological_decisions:
- issue: Référents des pronoms dans la seconde phrase
  choice: Maintenir les pronoms « il », « le » et « lui » sans identifier explicitement les personnages
  alternative: Écrire « notre père le fit prendre place à ses côtés »
  rationale: Le grec emploie des pronoms dont les référents dépendent du contexte. Les expliciter ici résoudrait une ambiguïté que le verset lui-même ne lève pas formellement.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste fluide tout en conservant l’ambiguïté pronominale du grec.
