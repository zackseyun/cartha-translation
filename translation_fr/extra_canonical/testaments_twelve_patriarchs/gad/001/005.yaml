    issue: « fit prendre place » ne rend pas suffisamment la posture exprimée par ἀνέκλινεν.
    rationale: Le grec ἀνακλίνω signifie faire s’étendre, faire s’allonger ou installer en position inclinée. « Prendre place » peut simplement désigner le fait de s’asseoir et réduit ainsi l’image corporelle du texte.
