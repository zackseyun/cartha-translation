  source_fidelity: La première phrase rend correctement ὑπέστρεψεν, Χεβρών et πρὸς τὸν πατέρα ἡμῶν. Dans la seconde, « fit prendre place » atténue ἀνέκλινεν, qui évoque plus précisément le fait de faire s’étendre ou s’allonger (souvent dans une posture de repas, sans que le repas soit explicitement mentionné ici).
  naturalness: Le texte est fluide et d’un registre narratif moderne approprié. « Il le fit s’allonger près de lui » reste naturel tout en étant plus proche du verbe grec que « fit prendre place ».
  terminology: 'Les noms et les termes relationnels sont bien rendus : « Hébron », « notre père », « près de lui » et « l’aimait beaucoup ». Les pronoms doivent demeurer non explicités, car le grec les emploie également sans lever formellement tous les référents au niveau isolé du verset.'
  issues:
