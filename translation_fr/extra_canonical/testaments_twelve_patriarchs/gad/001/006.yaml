  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: fr
  text: 6. Joseph dit à notre père que les fils de Zilpa et de Bilha abattent les plus belles bêtes du troupeau et les mangent sans l’accord de Ruben et de Juda.
