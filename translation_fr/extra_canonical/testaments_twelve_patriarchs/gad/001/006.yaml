- source_word: τὰ θρέμματα τὰ καλά
  choice: les plus belles bêtes du troupeau
  rationale: θρέμματα désigne les animaux élevés, et καλά marque leur qualité supérieure dans ce contexte.
- source_word: παρὰ γνώμην
  choice: sans l’accord de
  rationale: L’expression indique qu’ils agissent sans l’assentiment, voire contre l’avis, de Ruben et de Juda.
