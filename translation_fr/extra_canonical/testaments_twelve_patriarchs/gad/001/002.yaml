  text: 'Listen, my children: I was the ninth son born to Jacob, and I was brave over the flocks.'
translation:
  language: fr
  text: 'Écoutez, mes enfants : j’étais le neuvième fils de Jacob, et j’étais vaillant à la garde des troupeaux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: L’impératif aoriste appelle directement les enfants de Gad à prêter attention.
- source_word: ἐγενόμην ἔννατος υἱὸς τῷ Ἰακώβ
  choice: j’étais le neuvième fils de Jacob
  rationale: Cette formulation française naturelle rend le rang filial exprimé en grec sans ajouter explicitement l’idée de naissance.
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  choice: je gardais courageusement les troupeaux
  rationale: ἀνδρεῖος exprime la bravoure, tandis que ἐπὶ τῶν ποιμνίων situe cette qualité dans la garde et la surveillance des troupeaux; la formulation évite le calque peu naturel « courageux sur les troupeaux ».
