  text: And beyond this I was angry with Joseph until the day of his being sold.
translation:
  language: fr
  text: 8. Et, en plus de cela, je gardais de la rancune contre Joseph jusqu’au jour de sa vente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ τοῦτο
  choice: par-dessus tout cela
  rationale: Cette expression marque ici un motif ou un degré supplémentaire; la formulation française conserve le renvoi à ce qui précède sans l’expliciter davantage.
- source_word: ἐνεκότουν τῷ Ἰωσήφ
  choice: j’en voulais à Joseph
  rationale: Le verbe exprime une hostilité ou une rancœur persistante envers quelqu’un; «j’en voulais à» est naturel en français moderne tout en gardant cette durée implicite.
- source_word: ἕως ἡμέρας διαπράσεως αὐτοῦ
  choice: jusqu’au jour où il fut vendu
  rationale: Dans ce contexte, le nom διαπράσεως désigne la vente de Joseph. La tournure passive française rend clairement que Joseph en est l’objet.
