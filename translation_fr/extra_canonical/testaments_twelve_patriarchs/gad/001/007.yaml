base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: fr
  text: Car il avait vu que j’avais arraché un agneau à la gueule d’une ourse et que je l’avais tuée, mais j’avais égorgé l’agneau — j’en étais attristé, car il ne pouvait pas vivre — et nous l’avions mangé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξειλάμην
  choice: j’avais arraché
  rationale: Exprime un sauvetage énergique hors de la gueule de l’animal, conformément au moyen grec et au contexte.
- source_word: ἄρκου
  choice: d’une ourse
  rationale: Le pronom féminin κἀκείνην qui suit indique ici une femelle; «ourse» préserve cette donnée.
- source_word: ἔθυσα
  choice: je l’avais égorgé
  rationale: Dans ce contexte, il s’agit de mettre à mort l’agneau devenu incapable de survivre, sans imposer une connotation cultuelle que le passage n’explicite pas.
- source_word: οὐκ ἠδύνατο ζῆν
  choice: il ne pouvait pas survivre
  rationale: Rend naturellement l’incapacité de l’agneau à rester en vie après ses blessures.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le plus-que-parfait situe les faits vus antérieurement; la ponctuation clarifie la succession des actions sans supprimer le lien entre l’abattage de l’agneau et la tristesse du narrateur.
