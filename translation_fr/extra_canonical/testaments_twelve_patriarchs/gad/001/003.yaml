  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: fr
  text: Je gardais donc le troupeau pendant la nuit. Lorsqu’un lion, un loup ou toute autre bête sauvage s’attaquait au troupeau, je le poursuivais ; quand je le rattrapais, je saisissais sa patte de ma main, le projetais à une distance d’environ un jet de pierre et le tuais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: je gardais
  rationale: L’imparfait grec décrit ici une activité habituelle ou répétée dans le passé.
- source_word: ποίμνιον / ποίμνην
  choice: le troupeau
  rationale: Le français naturel emploie le même terme pour les deux substantifs grecs quasi synonymes.
- source_word: ἐπὶ τὴν ποίμνην
  choice: s’attaquait au troupeau
  rationale: Dans ce contexte de prédateur, cette formulation rend naturellement le mouvement hostile exprimé par ἐπί avec l’accusatif.
- source_word: κατεδίωκον
  choice: je le poursuivais
  rationale: Le verbe indique une poursuite soutenue ; l’imparfait conserve la valeur habituelle.
- source_word: φθάνων
  choice: quand je le rattrapais
  rationale: Le participe marque ici le fait de rejoindre la bête après l’avoir poursuivie.
- source_word: τὸν πόδα αὐτοῦ
  choice: sa patte
  rationale: Pour un animal, « patte » est plus idiomatique que le littéral « pied ».
- source_word: τῇ χειρί μου
  choice: d’une main
  rationale: Rend l’instrument exprimé par le datif tout en conservant l’idée que Gad saisissait lui-même l’animal.
- source_word: ἠκόντισα
  choice: je le lançais
  rationale: Le verbe signifie projeter ou lancer ; « lancer » convient clairement à l’objet animé dans ce récit.
- source_word: ὡσεὶ λίθου βολήν
  choice: à peu près à un jet de pierre
  rationale: Conserve l’approximation de ὡσεί et l’expression de distance fondée sur un lancer de pierre.
- source_word: ἀνῄρουν
  choice: je le tuais
  rationale: Dans ce contexte, le verbe signifie mettre à mort ; l’imparfait s’accorde avec la série d’actions répétées.
