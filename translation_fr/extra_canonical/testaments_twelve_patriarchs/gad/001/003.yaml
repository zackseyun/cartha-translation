- from: Je gardais donc le troupeau pendant la nuit. Lorsqu’un lion, un loup ou toute autre bête sauvage s’attaquait au troupeau, je le poursuivais ; quand je le rattrapais, je saisissais sa patte d’une main, le lançais à peu près à un jet de pierre et le tuais.
  to: Je gardais donc le troupeau pendant la nuit. Lorsqu’un lion, un loup ou toute autre bête sauvage s’attaquait au troupeau, je le poursuivais ; quand je le rattrapais, je saisissais sa patte de ma main, le projetais à une distance d’environ un jet de pierre et le tuais.
  rationale: Révision limitée à la restitution de « ma main » et à une expression française plus précise de la distance approximative indiquée par l’image du jet de pierre. Le caractère répétitif de l’ensemble est conservé par les imparfaits.
