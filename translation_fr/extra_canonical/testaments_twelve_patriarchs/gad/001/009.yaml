id: T12P.GAD.1.9
reference: Testament of Gad 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Καὶ τὸ πνεῦμα τοῦ⁵⁹ μίσους ἦν ἐν ἐμοί, καὶ⁶⁰ οὐκ ἤθελον⁶¹ *οὔτε †δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν⁶² ἰδεῖν τὸν Ἰωσήφ, ὅτι⁶³ κατὰ πρόσωπον⁶⁴ ἤλεγξεν ἡμᾶς Γλέγων¹⁶⁵, ὅτι χωρὶς⁶⁶ Ἰούδα⁶⁷ ἠσθίομεν *τὰ θρέμματα⁶⁸. *πάντα γὰρ⁶⁹ ὅσα ἔλεγε *τῷ πατρὶ⁷⁰ ἐπείθετο αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: fr
  text: 9. L’esprit de haine était en moi, et je ne voulais ni entendre parler de Joseph ni le voir, parce qu’il nous avait repris en face, disant que nous mangions le bétail sans Juda. En effet, notre père croyait tout ce que Joseph lui disait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de la dernière phrase est concis et ses pronoms peuvent sembler ambigus; il signifie probablement que leur père croyait tout ce que Joseph lui rapportait.
    reason: Signaler une ambiguïté grammaticale réelle sans alourdir le corps du texte.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: l’esprit de haine
  rationale: Reproduit directement l’expression grecque tout en restant naturel en français.
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν τὸν Ἰωσήφ
  choice: ni entendre parler de Joseph ni le voir
  rationale: Rend les deux moyens, l’ouïe et la vue, dans une tournure française idiomatique sans réduire le premier membre à une simple perception abstraite.
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  choice: il nous avait repris en face
  rationale: Conserve à la fois l’idée de réprimande ou de dénonciation et son caractère direct, en présence des intéressés.
- source_word: τὰ θρέμματα
  choice: le bétail
  rationale: Terme collectif naturel correspondant aux animaux d’élevage.
- source_word: χωρὶς Ἰούδα
  choice: sans Juda
  rationale: Préserve la formulation grecque concise et son ambiguïté contextuelle.
- source_word: πάντα γὰρ ὅσα ἔλεγε τῷ πατρὶ ἐπείθετο αὐτῷ
  choice: En effet, notre père croyait tout ce que Joseph lui disait
  rationale: Explicite les référents pronominaux requis par le français; le sens le plus probable est que le père accordait foi aux rapports de Joseph.
theological_decisions:
- issue: Personnalisation de « l’esprit de haine »
  choice: Conserver littéralement « l’esprit de haine » sans préciser s’il s’agit d’un être personnel ou d’une disposition intérieure.
  alternative: Traduire par « un esprit de haine » ou « la haine m’habitait ».
  rationale: Le grec emploie l’article défini et le vocabulaire de l’esprit, mais le contexte ne tranche pas explicitement la nature de cet esprit; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, avec les référents explicités seulement lorsque la clarté française l’exige.
