source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a servant, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: fr
  text: Et si quelqu’un est esclave, elle le calomnie auprès de son maître et se réjouit de chacune de ses détresses, dans l’espoir qu’il soit peut-être mis à mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme grec désigne ici une personne asservie; « esclave » en conserve clairement la portée sociale et juridique.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: elle le calomnie auprès de son maître
  rationale: Dans ce contexte hostile, la tournure indique qu’elle met l’esclave aux prises avec son maître en portant contre lui des accusations; cette formulation naturelle suit le sens retenu par l’édition et la couche de consultation.
- source_word: ἐν πάσῃ θλίψει ἐπιχαίρει αὐτῷ
  choice: se réjouit de chacune de ses détresses
  rationale: « Se réjouir de » exprime la joie malveillante d’ἐπιχαίρω, tandis que « chacune de ses détresses » rend la valeur distributive possible de πάσῃ et rattache clairement l’épreuve à la victime.
- source_word: εἴπως θανατωθῇ
  choice: dans l’espoir qu’il soit mis à mort
  rationale: εἴπως marque ici le résultat espéré par malveillance plutôt qu’une simple éventualité neutre; le passif « soit mis à mort » préserve celui du grec.
theological_decisions:
- issue: Référent du sujet implicite féminin
  choice: Conserver « elle » sans expliciter le référent dans ce verset isolé
  alternative: Répéter « la haine » ou un autre antécédent fourni par le contexte
  rationale: Les verbes grecs ont un sujet implicite hérité du contexte. L’expliciter ici risquerait d’ajouter au verset une information absente de l’extrait transmis.
- issue: Degré de finalité dans εἴπως
  choice: « dans l’espoir que »
  alternative: « si peut-être » / « pour qu’il soit peut-être »
  rationale: La formulation choisie restitue l’intention meurtrière tout en évitant d’affirmer que la mise à mort aura effectivement lieu.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec sans reproduire ses tours les moins naturels; « maître » est conservé comme terme relationnel correspondant à l’esclavage antique.
