  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: fr
  text: Car la haine s’allie à l’envie, même contre ceux qui prospèrent ; celui qui entend et voit leur réussite s’affaiblit toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est syntaxiquement abrupt : « entendant », « voyant » et « s’affaiblit » sont au masculin singulier, alors que le sujet explicite précédent, « haine », est neutre en grec. Le sujet masculin n’est pas nommé ; il peut désigner implicitement une personne animée par la haine ou l’envie. Une lecture qui rapporte ces verbes à la haine elle-même est également possible, malgré le décalage grammatical.'
    reason: Conserver l’ambiguïté réelle du grec sans introduire comme certain un « homme haineux » absent du texte.
lexical_decisions:
- source_word: φθόνῳ
  choice: à l’envie
  rationale: Le datif exprime ici l’association ou l’aide apportée à l’envie ; ce terme reste distinct de « haine ».
- source_word: συνεργεῖ
  choice: prête main-forte
  rationale: Cette expression française naturelle rend l’idée de coopérer ou d’agir de concert, sans fondre la haine et l’envie en une seule réalité.
- source_word: τὸ μῖσος
  choice: la haine
  rationale: Équivalent direct et courant, conservé comme sujet de la proposition principale.
- source_word: τῶν εὐπραγούντων
  choice: ceux qui prospèrent
  rationale: Le participe désigne ceux dont les affaires vont bien ou qui réussissent ; « prospèrent » convient au contexte de l’envie.
- source_word: ἐν προκοπῇ
  choice: de leurs progrès
  rationale: Le nom προκοπή indique une avancée ou un progrès. Le possessif explicite naturellement en français le lien avec ceux qui prospèrent.
- source_word: ἀσθενεῖ
  choice: elle s’affaiblit
  rationale: 'Le verbe est intransitif : il signifie devenir faible, manquer de force ou dépérir, plutôt qu’être affaibli par un agent exprimé.'
theological_decisions:
- issue: Sujet de « entendant, voyant… s’affaiblit »
  choice: Comprendre la haine, personnifiée, comme le sujet poursuivi dans la seconde proposition.
  alternative: Comprendre implicitement l’homme haineux ou envieux comme sujet.
  rationale: La haine est le sujet explicite le plus proche et le fil logique de la phrase, mais les participes grecs au masculin singulier créent une irrégularité réelle ; celle-ci est signalée en note plutôt que supprimée sans indication.
translation_notes:
  register: Français international moderne, naturel et digne. « Prête main-forte » rend la coopération hostile de manière claire ; la syntaxe française attribue les actions à la haine personnifiée, tandis que la note conserve l’autre lecture possible.
