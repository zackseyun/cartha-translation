review_pass:
  verdict: revise
  source_fidelity: Le parallélisme et les deux occurrences de θέλει (« veut ») sont fidèlement rendus. « Rendre la vie aux morts », « rappeler » et « sous le coup d’une condamnation à mort » transmettent bien ζωοποιῆσαι, ἀνακαλέσασθαι et ἐν ἀποφάσει θανάτου. La dernière expression grecque ἐν ὀλίγῳ appelle cependant une formulation française moins ambiguë que « dans une petite affaire ».
  naturalness: La phrase est globalement claire et de registre approprié. « Dans une petite affaire » évoque spontanément une transaction ou une affaire professionnelle et sonne peu naturel dans ce contexte moral. « Pour peu de chose » est idiomatique et conserve l’indétermination du grec.
  terminology: Les termes « amour », « haine », « péché » et « condamnation à mort » conviennent. Aucun enjeu de nom propre ni de terminologie confessionnelle ne se présente.
  issues:
