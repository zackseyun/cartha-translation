source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: fr
  text: De même que l’amour veut rendre la vie aux morts et rappeler ceux qui sont sous le coup d’une condamnation à mort, de même la haine veut tuer les vivants et ne veut pas que vivent ceux qui ont péché pour peu de chose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωοποιῆσαι
  choice: rendre la vie
  rationale: Exprime naturellement en français l’action de faire vivre ou de ramener à la vie, avec « les morts » comme complément.
- source_word: ἀνακαλέσασθαι
  choice: rappeler
  rationale: Conserve l’image d’un rappel ou d’un retour demandé, sans préciser davantage le mécanisme de la délivrance.
- source_word: ἐν ἀποφάσει θανάτου
  choice: sous le coup d’une condamnation à mort
  rationale: Rend l’idée d’une sentence ou décision judiciaire de mort dans un français actuel et clair.
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: ceux qui n’ont péché que dans une petite affaire
  rationale: 'Préserve la portée indéterminée de ἐν ὀλίγῳ : une faute commise dans une affaire de peu d’importance, sans identifier celle-ci.'
theological_decisions:
- issue: Personnification de l’amour et de la haine
  choice: Conserver la répétition de « veut »
  alternative: Reformuler comme une simple tendance ou un effet
  rationale: Le grec attribue explicitement une volonté à l’amour et à la haine par la répétition de θέλει; cette tension rhétorique doit rester visible.
- issue: Portée de la faute légère
  choice: « dans une petite affaire »
  alternative: « n’ont que peu péché »
  rationale: Le texte peut viser une faute portant sur une chose minime plutôt qu’un faible degré général de péché; la formulation retenue conserve cette lecture contextuelle sans développer une doctrine de la gravité des péchés.
translation_notes:
  register: Français moderne, international et digne. La structure comparative « De même que… de même… » ainsi que le parallélisme entre amour et haine sont conservés.
