    rationale: Cette expression est grammaticalement possible, mais elle est peu idiomatique ici et risque de restreindre ἐν ὀλίγῳ à une “affaire” au sens pratique ou commercial. Le grec désigne plus largement le fait de pécher en/à propos de peu de chose.
