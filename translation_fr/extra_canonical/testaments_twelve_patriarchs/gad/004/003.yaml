source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: fr
  text: Car si un frère tombe, elle s’empresse aussitôt d’en informer tous et se hâte d’agir à son sujet, afin que, jugé et puni, il meure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ
  choice: tombe
  rationale: Conserve l’image et l’ambiguïté du grec, qui peut évoquer une chute morale sans l’expliciter.
- source_word: σπουδάζει εὐθὺς ἀναγγεῖλαι
  choice: s’empresse aussitôt de le dénoncer
  rationale: Rend l’empressement exprimé par σπουδάζει et la nuance hostile de l’annonce publique dans ce contexte.
- source_word: σπεύδει περὶ αὐτοῦ
  choice: s’acharne contre lui
  rationale: Expression française naturelle qui restitue ici l’empressement hostile dirigé contre la personne, tout en évitant le calque peu idiomatique « se hâte à son sujet ».
- source_word: κριθεὶς καὶ κολασθεὶς
  choice: après avoir été jugé et puni
  rationale: Reproduit la succession des participes passifs antérieurs au verbe principal.
- source_word: ἀποθάνῃ
  choice: il meure
  rationale: Traduit directement le subjonctif placé sous ἵνα, exprimant le résultat recherché.
theological_decisions:
- issue: Antécédent implicite des verbes « s’empresse » et « s’acharne »
  choice: Maintien du pronom féminin « elle », renvoyant au thème personnifié fourni par le contexte antérieur
  alternative: Répéter explicitement « la haine » ou un autre antécédent contextuel
  rationale: Le sujet est sous-entendu dans le verset grec transmis. Le pronom évite d’ajouter dans ce verset un nom absent de la phrase source tout en préservant la continuité contextuelle.
- issue: Nature de la chute du frère
  choice: « tombe » sans précision
  alternative: « commet une faute » ou « tombe dans le péché »
  rationale: Le grec πέσῃ reste métaphorique et ne précise pas expressément la nature morale ou religieuse de la chute.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formulation garde la violence progressive du mouvement grec : chute du frère, dénonciation publique, poursuite hostile, jugement, châtiment et mort.'
