review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la chute, l’empressement, le jugement, le châtiment et la mort. Toutefois, « le dénoncer » spécifie davantage que ἀναγγεῖλαι, qui signifie d’abord faire connaître ou annoncer; l’objet implicite est vraisemblablement la chute ou l’affaire du frère. « S’acharne contre lui » intensifie aussi σπεύδει περὶ αὐτοῦ, qui exprime plus directement une activité empressée à son sujet.
  naturalness: Le français est globalement naturel. La révision proposée conserve un registre moderne et soutenu tout en évitant de transformer l’annonce en dénonciation formelle et l’empressement en acharnement prolongé.
  terminology: « Tombe », « jugé », « puni » et « meure » sont justes et conservent l’ambiguïté morale de πέσῃ. Le pronom féminin demeure recevable, son antécédent étant fourni par le contexte.
  issues:
  - severity: medium
    issue: « le dénoncer » est trop spécifique pour ἀναγγεῖλαι.
    rationale: Le grec ne comporte pas de verbe équivalant explicitement à « dénoncer » et ne formule pas d’accusation; il dit qu’elle s’empresse de faire connaître l’affaire à tous.
  - severity: medium
    issue: « s’acharne contre lui » renforce σπεύδει περὶ αὐτοῦ.
    rationale: Cette expression française évoque une hostilité insistante et prolongée. Le grec exprime l’empressement à agir à son sujet; le but mortel rend l’orientation hostile claire sans que le verbe lui-même exige cette intensification.
  revised_text: Car si un frère tombe, elle s’empresse aussitôt d’en informer tous et se hâte d’agir à son sujet, afin que, jugé et puni, il meure.
