- from: Car si un frère tombe, elle s’empresse aussitôt de le dénoncer à tous et s’acharne contre lui pour qu’après avoir été jugé et puni, il meure.
  to: Car si un frère tombe, elle s’empresse aussitôt d’en informer tous et se hâte d’agir à son sujet, afin que, jugé et puni, il meure.
  rationale: La révision restitue plus sobrement ἀναγγεῖλαι et σπεύδει περὶ αὐτοῦ, sans supprimer la progression hostile que manifeste la proposition finale. « D’en informer » laisse l’objet implicite comme dans le grec, et « se hâte d’agir à son sujet » conserve l’activité dirigée vers le frère sans ajouter une modalité d’acharnement.
