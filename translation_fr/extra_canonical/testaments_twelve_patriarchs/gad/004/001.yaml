  source_fidelity: 'Le sens général est bien rendu : l’exhortation à se garder de la haine, ainsi que la haine personnifiée comme auteur de l’acte, sont conservées. Toutefois, « envers » atténue légèrement la direction hostile de εἰς, qui se rend plus exactement ici par « contre ». La valeur emphatique de καὶ … αὐτὸν (« même … lui-même ») mérite aussi d’être exprimée sans dépendre seulement de l’idiome « va jusqu’à ».'
