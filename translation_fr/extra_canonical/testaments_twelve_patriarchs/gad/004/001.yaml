source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: IV. Φυλάξασθε οὖν, τέκνα μου¹, ἀπὸ τοῦ μίσους, ὅτι Γκαὶ² εἰς³ αὐτὸν τὸν Κύριον ἀνομίαν⁴ ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/001.yaml
  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: fr
  text: Gardez-vous donc, mes enfants, de la haine, car elle commet même l’injustice contre le Seigneur lui-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Gardez-vous
  rationale: L’impératif aoriste moyen appelle les destinataires à se protéger eux-mêmes; « gardez-vous » est naturel et conserve la force de l’exhortation.
- source_word: μίσους
  choice: haine
  rationale: Équivalent direct et courant du nom grec, sans atténuer sa portée morale.
- source_word: ἀνομίαν ποιεῖ
  choice: commettre l’injustice
  rationale: L’expression signifie littéralement « faire l’ἀνομία ». Ici, « commettre l’injustice » rend l’acte contraire à l’ordre moral sans imposer le sens plus étroit de violation d’une loi codifiée.
- source_word: καὶ … αὐτὸν τὸν Κύριον
  choice: va jusqu’à … envers le Seigneur lui-même
  rationale: Le grec, malgré une transmission typographique difficile autour de καί, souligne que la haine s’en prend même au Seigneur; cette tournure française restitue naturellement cette valeur culminative.
theological_decisions:
- issue: Nature de la faute commise par la haine contre le Seigneur
  choice: « commettre l’injustice envers le Seigneur »
  alternative: « violer la loi contre le Seigneur »
  rationale: Le choix conserve la portée générale d’ἀνομία et évite de réduire le propos à une infraction juridique ou à une doctrine particulière de la Loi.
translation_notes:
  register: Français moderne, digne et accessible. L’adresse affectueuse « mes enfants » et l’exhortation solennelle sont conservées. La personnification de la haine, sujet implicite de ποιεῖ, demeure nette en français.
