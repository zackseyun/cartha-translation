  terminology: « Haine » convient à μῖσος. Pour ἀνομίαν ποιεῖ, « commettre l’injustice » est acceptable en français moderne et évite de surdéterminer le terme grec; il convient de conserver cette option. « Seigneur » rend correctement Κύριος.
