id: T12P.GAD.4.7
reference: Testament of Gad 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: fr
  text: Car l’esprit de haine, par le découragement, coopère en toutes choses avec Satan en vue de la mort des êtres humains ; mais l’esprit d’amour, par la patience, coopère avec la loi de Dieu en vue de leur salut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοψυχία
  choice: découragement
  rationale: Le terme désigne littéralement un manque de cœur ou de courage, donc l’abattement ou le découragement ; ce choix est naturel en français moderne sans réduire le sens à la seule peur.
- source_word: μακροθυμία
  choice: patience
  rationale: Le mot exprime la capacité de supporter longtemps sans céder à la colère ; « patience » est ici clair, courant et adapté au contraste avec le découragement.
- source_word: συνεργεῖ
  choice: coopère avec
  rationale: Cette formulation conserve explicitement l’idée grecque d’une action menée conjointement, aussi bien avec Satan qu’avec la loi de Dieu.
- source_word: εἰς θάνατον / εἰς σωτηρίαν
  choice: en vue de la mort / en vue de leur salut
  rationale: « En vue de » garde l’orientation ou le résultat exprimé par εἰς, sans trancher plus précisément entre intention et conséquence.
- source_word: τῶν ἀνθρώπων
  choice: des êtres humains / leur
  rationale: Rend le pluriel générique de ἄνθρωπος dans un français international actuel ; le pronom évite une répétition lourde dans le second membre.
theological_decisions:
- issue: La coopération de l’esprit d’amour avec la loi de Dieu
  choice: coopère avec la loi de Dieu
  alternative: agit conformément à la loi de Dieu
  rationale: Le grec dit explicitement συνεργεῖ τῷ νόμῳ, parallèle à συνεργεῖ τῷ Σατανᾷ. La traduction conserve cette formulation théologiquement frappante au lieu de l’interpréter ou de l’atténuer.
- issue: Valeur de εἰς devant « mort » et « salut »
  choice: en vue de
  alternative: pour conduire à
  rationale: La formulation retenue préserve l’ambiguïté entre finalité et résultat, sans attribuer au texte une causalité plus précise qu’il ne l’énonce.
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique du grec est conservée (« esprit de haine » / « esprit d’amour », « mort » / « salut »), ainsi que le parallélisme du verbe « coopérer ». Aucun marqueur de note n’est nécessaire.
