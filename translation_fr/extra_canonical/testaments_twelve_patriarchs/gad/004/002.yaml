source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Οὐ γὰρ θέλει ἀκούειν Γλόγων⁵ ἐντολῶν⁶ αὐτοῦ περὶ ἀγάπης *τοῦ πλησίον⁷* *Γκαὶ¹ εἰς Θεὸν ἁμαρτάνει⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: fr
  text: Car il ne veut pas écouter les paroles de ses commandements au sujet de l’amour du prochain, et il pèche contre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ θέλει ἀκούειν
  choice: Car il ne veut pas écouter
  rationale: Rend directement la causalité de γάρ et la volonté exprimée par θέλει; « écouter » conserve ici l’idée d’entendre avec attention, sans expliciter davantage l’obéissance.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: les paroles de ses commandements
  rationale: Conserve la formulation grecque quelque peu redondante et le pronom αὐτοῦ, dont le référent demeure implicite dans ce fragment.
- source_word: περὶ ἀγάπης τοῦ πλησίον
  choice: au sujet de l’amour du prochain
  rationale: Formulation française naturelle qui préserve le sens de l’amour envers le prochain sans ajouter de possessif absent du grec.
- source_word: καὶ εἰς Θεὸν ἁμαρτάνει
  choice: et il pèche contre Dieu
  rationale: « Pécher contre Dieu » est l’équivalent français idiomatique de ἁμαρτάνει εἰς Θεόν.
theological_decisions:
- issue: Référent du sujet implicite et du possessif αὐτοῦ
  choice: Maintenir « il » et « ses » sans préciser leur référent
  alternative: Identifier explicitement le sujet ou le possesseur à partir du contexte élargi
  rationale: Le verset grec fourni laisse ces référents implicites; les expliciter dans ce segment résoudrait une ambiguïté que le texte ne résout pas lui-même.
- issue: Portée morale de ἀκούειν
  choice: Traduire simplement par « écouter »
  alternative: « obéir à » ou « prêter attention à »
  rationale: Même si l’écoute peut impliquer l’obéissance dans ce contexte, le grec emploie le verbe « entendre/écouter »; la traduction évite d’en renforcer silencieusement la portée.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant intelligible; aucune note n’est nécessaire pour ce bref verset.
