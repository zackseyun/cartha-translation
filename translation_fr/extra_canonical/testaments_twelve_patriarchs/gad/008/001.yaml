  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/001.yaml
  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: fr
  text: Dites, vous aussi, ces choses à vos enfants, afin qu’ils honorent Juda et Lévi, car c’est d’eux que le Seigneur fera surgir, pour vous, un salut pour Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec juxtapose « pour vous » et « pour Israël » auprès de « salut ». Leur relation syntaxique exacte n’est pas explicitée.
    reason: Conserver et signaler la double relation dative sans privilégier une interprétation théologique ou syntaxique particulière.
lexical_decisions:
- source_word: Εἴπατε
  choice: Dites
  rationale: Impératif aoriste pluriel rendu par un impératif français direct et naturel.
- source_word: τιμήσωσιν
  choice: qu’ils honorent
  rationale: 'Reproduit le sens courant de τιμάω : accorder honneur et respect.'
- source_word: ἀνατελεῖ
  choice: fera surgir
  rationale: Conserve l’image de quelque chose que le Seigneur fait se lever ou apparaître, tout en restant idiomatique en français.
- source_word: σωτηρίαν
  choice: le salut
  rationale: Équivalent théologique et courant de σωτηρία, sans préciser ici la nature de la délivrance au-delà du grec.
theological_decisions:
- issue: Origine du salut liée à Juda et à Lévi
  choice: « c’est d’eux que le Seigneur fera surgir »
  alternative: « le Seigneur se lèvera d’entre eux comme salut »
  rationale: La syntaxe fournie présente le Seigneur comme sujet de ἀνατελεῖ et σωτηρίαν comme objet; la traduction n’identifie donc pas explicitement le Seigneur lui-même au salut.
- issue: Double destinataire exprimé par ὑμῖν et τῷ Ἰσραήλ
  choice: « pour vous le salut destiné à Israël »
  alternative: « le salut pour Israël »
  rationale: Cette formulation conserve les deux datifs transmis au lieu d’en supprimer un, malgré la tournure grecque condensée.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre « Juda et Lévi » suit le grec fourni. La syntaxe finale demeure légèrement solennelle afin de préserver la formulation théologique et l’ambiguïté du texte source.
