  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: fr
  text: 'Après s’être tu un peu, il parla de nouveau : « Mes enfants, obéissez à votre père et enterrez-moi près de mes ancêtres. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: après s’être reposé un peu
  rationale: Le participe aoriste exprime une action préalable; « se reposer » convient ici au contexte de la fin de vie, tout en conservant la sobriété du grec.
- source_word: εἶπε πάλιν
  choice: il reprit la parole
  rationale: Formulation française naturelle exprimant qu’il parla de nouveau.
- source_word: ὑπακούσατε
  choice: obéissez
  rationale: Rend directement l’impératif aoriste adressé aux enfants.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: près de mes pères
  rationale: Conserve l’expression généalogique et funéraire du texte grec sans la réduire à « ancêtres ».
theological_decisions:
- issue: Sens de « mes pères »
  choice: mes pères
  alternative: mes ancêtres
  rationale: La traduction formelle préserve le lien explicite avec les patriarches et la formulation biblique, sans préciser davantage l’identité des personnes visées.
