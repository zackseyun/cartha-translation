source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ ἔγνων⁶, ὅτι ἀποστήσονται⁷ τὰ τέκνα ὑμῶν ἀπ᾽ αὐτοῦ⁸, καὶ⁹ πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ ἔσονται ἀπὸ¹⁰ Κυρίου.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: fr
  text: Car je sais que vos enfants se détourneront de lui et que, dans toute méchanceté, affliction et corruption, ils seront loin du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: je sais
  rationale: Le parfait à valeur présente exprime ici un savoir acquis et assuré; le présent est naturel en français.
- source_word: ἀποστήσονται
  choice: se détourneront
  rationale: Rend l’idée d’éloignement ou de défection sans préciser davantage la nature de l’abandon.
- source_word: κακώσει
  choice: souffrance
  rationale: Le terme peut désigner mauvais traitements, affliction ou oppression; « souffrance » conserve une portée assez large.
- source_word: διαφθορᾷ
  choice: corruption
  rationale: Équivalent direct qui garde la dimension morale et destructrice du terme grec.
- source_word: ἀπὸ Κυρίου
  choice: loin du Seigneur
  rationale: Rend la séparation exprimée par ἀπό de manière idiomatique, sans transformer explicitement le Seigneur en agent.
theological_decisions:
- issue: Référent de αὐτοῦ dans « se détourneront de lui »
  choice: Conserver le pronom « lui »
  alternative: Expliciter « du Seigneur »
  rationale: Le référent dépend du contexte antérieur et le grec emploie un pronom; l’explicitation supprimerait une ambiguïté réelle.
- issue: Rapport syntaxique entre les trois datifs et « ils seront loin du Seigneur »
  choice: Les comprendre comme l’état ou le domaine auquel les enfants seront livrés
  alternative: Coordonner directement les noms à l’éloignement du Seigneur
  rationale: La formulation grecque est abrupte; « livrés à » produit un français intelligible tout en gardant les trois réalités associées à leur séparation d’avec le Seigneur.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la tension du grec entre la défection envers « lui » et l’éloignement du Seigneur, tout en explicitant légèrement la construction très heurtée des datifs.
