  text: And after five years they brought him up to Hebron, and laid him with his fathers.
translation:
  language: fr
  text: Après cinq ans, ils le firent monter à Hébron et le placèrent avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ἔτη πέντε
  choice: au bout de cinq ans
  rationale: Exprime naturellement en français le délai écoulé indiqué par μετά avec l’accusatif.
- source_word: ἀνήγαγον
  choice: ramenèrent
  rationale: Le verbe signifie littéralement « firent monter »; dans ce contexte de transfert vers Hébron, « ramenèrent » rend naturellement le mouvement sans surcharger la formulation.
- source_word: ἔθηκαν
  choice: déposèrent
  rationale: Conserve le sens général de « placer, déposer » et convient au contexte funéraire sans ajouter explicitement une inhumation.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Préserve l’expression ancestrale et funéraire du grec, sans la réduire à une simple mention de tombe familiale.
theological_decisions:
- issue: Sens funéraire implicite de « le déposèrent auprès de ses pères »
  choice: Conserver l’implicite
  alternative: « l’ensevelirent auprès de ses ancêtres »
  rationale: Le grec emploie le verbe général τίθημι et le terme littéral « pères »; la traduction évite d’expliciter davantage que la source.
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au registre narratif. Aucun marqueur de note n’est requis.
