  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: fr
  text: Puis, ayant relevé les pieds, il s'endormit en paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: ayant ramené ses pieds contre lui
  rationale: L’expression décrit le geste de ramener ou relever les pieds avant de mourir; «contre lui» explicite naturellement le mouvement en français sans surinterpréter la posture.
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Conserve l’euphémisme grec du sommeil pour la mort, ainsi que sa portée littéraire et théologique.
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: 'Rend directement l’expression grecque et préserve son possible double sens: une mort paisible et un état de paix.'
theological_decisions:
- issue: Le sommeil comme désignation de la mort
  choice: il s’endormit
  alternative: il mourut
  rationale: Le grec emploie explicitement le verbe «dormir»; le conserver évite d’effacer l’image traditionnelle et son éventuelle résonance eschatologique.
translation_notes:
  register: Français moderne, simple et digne. La tournure participiale maintient l’enchaînement narratif concis du grec.
