  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: fr
  text: Tout ce que fait celui qui hait est abominable. Si quelqu’un met en pratique la loi du Seigneur, celui qui hait ne le loue pas. Si quelqu’un craint le Seigneur et désire ce qui est juste, celui qui hait ne l’aime pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: celui qui hait
  rationale: Rend littéralement le participe substantivé et maintient la désignation répétée de la personne dominée par la haine, sans l’alourdir par un nom abstrait comme « le haineux ».
- source_word: βδελυκτόν
  choice: abominable
  rationale: Conserve la force morale du terme grec et le registre solennel de la phrase.
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: met en pratique la loi du Seigneur
  rationale: L’expression littérale « fait la loi » serait ambiguë ou peu naturelle en français; « mettre en pratique » exprime ici l’accomplissement de la loi sans introduire une nuance confessionnelle.
- source_word: φοβεῖται Κύριον
  choice: craint le Seigneur
  rationale: Préserve le vocabulaire biblique de la crainte du Seigneur et sa portée théologique, plutôt que de l’atténuer en simple respect.
- source_word: θέλει τὸ δίκαιον
  choice: désire ce qui est juste
  rationale: Rend le neutre substantivé τὸ δίκαιον sans le réduire à une vertu abstraite unique; θέλει est compris ici comme une volonté ou une aspiration positive.
theological_decisions:
- issue: Sujet sous-entendu des verbes « ne loue pas » et « n’aime pas »
  choice: Répéter « celui qui hait »
  alternative: Laisser le sujet sous-entendu ou employer seulement « il »
  rationale: Le grec sous-entend grammaticalement le sujet, mais le contexte immédiat l’identifie à ὁ μισῶν. La répétition française clarifie l’enchaînement sans résoudre une ambiguïté théologique étrangère au texte.
- issue: Sens de la « crainte » du Seigneur
  choice: Conserver « craint »
  alternative: « respecte » ou « révère »
  rationale: Le verbe φοβεῖται porte une tension biblique que des équivalents plus faibles ou plus interprétatifs effaceraient.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en évitant les calques peu naturels, notamment « faire la loi ». Aucun marqueur de note n’est requis.
