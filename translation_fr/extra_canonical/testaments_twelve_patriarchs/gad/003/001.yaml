source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: fr
  text: Et maintenant, écoutez une parole de vérité, afin de pratiquer la justice et d’observer toute loi du Très-Haut. Ne vous laissez pas égarer, enfants, par l’esprit de haine, car il est mauvais en toute action humaine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: une parole de vérité
  rationale: Rend directement l’expression grecque tout en conservant son ton solennel.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: pratiquez la justice
  rationale: Le génitif articulé à l’infinitif dépend de l’exhortation à écouter et en exprime la visée; une injonction coordonnée est plus naturelle en français sans modifier le sens pratique de ποιεῖν.
- source_word: πάντα νόμον ὑψίστου
  choice: toute loi du Très-Haut
  rationale: Conserve le singulier distributif πάντα νόμον et le titre divin sans ajouter d’article absent du grec.
- source_word: πλανᾶσθε
  choice: vous laissez pas égarer
  rationale: Le passif exprime le fait d’être entraîné hors du bon chemin, ici sous l’influence de l’esprit de haine.
- source_word: τέκνα
  choice: enfants
  rationale: Vocatif sans possessif; aucun « mes » n’est ajouté.
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: par l’esprit de haine
  rationale: Le datif indique ici l’agent ou le moyen de l’égarement; « haine » conserve la valeur abstraite du génitif.
- source_word: ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: dans toutes les actions des êtres humains
  rationale: Formulation inclusive et naturelle qui maintient la portée générale de ἀνθρώπων.
theological_decisions:
- issue: Portée de « toute loi du Très-Haut »
  choice: Conserver la formule sans préciser quelles lois sont visées
  alternative: Expliciter par « tous les commandements du Très-Haut »
  rationale: Le grec dit littéralement « toute loi »; une explicitation réduirait une formulation potentiellement large.
- issue: Référent du pronom dans « il est mauvais »
  choice: Conserver le masculin singulier renvoyant naturellement à « l’esprit de haine »
  alternative: Reformuler pour attribuer explicitement le mal à la haine
  rationale: Le grec ὅτι κακόν ἐστιν laisse grammaticalement implicite le sujet; le contexte favorise l’esprit de haine, sans qu’il faille développer davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement segmentée pour éviter une construction infinitive lourde, tout en gardant la progression exhortative du grec.
