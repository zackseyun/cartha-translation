    issue: Restructuration excessive et ambiguïté effacée au v. 8
    rationale: '« Cela ne s’apprend pas des humains : ... on sait » remplace le sujet masculin singulier du grec par deux tournures impersonnelles. « Il ne l’a pas appris des humains, mais ... il sait » reflète la syntaxe tout en ne déterminant pas l’antécédent.'
  - severity: high
