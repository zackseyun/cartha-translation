    rationale: La traduction omet καθ’ ὃν χρόνον ἐπείχον τῷ Ἰωσήφ, qui relie la durée du jugement à la période de l’hostilité de Gad envers Joseph.
  - severity: medium
    issue: Durée résolue indûment au v. 11
    rationale: χρόνους δέκα désigne littéralement dix temps/périodes; « dix ans » peut être défendu contextuellement, mais ne doit pas être imposé dans le texte lorsque la note reconnaît l’incertitude.
