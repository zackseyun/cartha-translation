  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005.yaml
  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: fr
  text: '1. La haine est donc un mal, car elle ne cesse de tenir compagnie au mensonge et de parler contre la vérité. Elle grossit les petites choses, présente la lumière comme des ténèbres et appelle amer ce qui est doux. Elle enseigne la calomnie, attise la colère et la guerre, et remplit le cœur d’insolence, de toute avidité, de maux et d’un poison diabolique.


    2. Je vous dis donc cela par expérience, mes enfants, afin que vous chassiez cette haine diabolique et que vous vous attachiez à l’amour de Dieu. 3. La justice chasse la haine, et l’humilité fait disparaître la jalousie[a]. En effet, le juste, dans son humilité, a honte de commettre l’injustice, non parce qu’un autre le condamne, mais parce que son propre cœur le condamne, car le Seigneur veille sur son âme. 4. Il ne médit pas d’un homme pieux, parce que la crainte de Dieu habite en lui. 5. Craignant d’offenser le Seigneur, il ne veut faire aucun tort à qui que ce soit, pas même en pensée.


    6. C’est ce que j’ai finalement appris après m’être repenti au sujet de Joseph. 7. En effet, la véritable repentance selon Dieu [fait disparaître l’ignorance et][b] met les ténèbres en fuite, éclaire les yeux, donne la connaissance à l’âme et oriente la volonté vers le salut. 8. Il ne l’a pas appris des humains, mais, par la repentance, il sait accueillir ceux qui reviennent.[c]


    9. Car Dieu m’a infligé une maladie du foie et, si les prières de mon père ne m’avaient pas secouru, mon esprit aurait presque défailli. 10. En effet, c’est par les choses mêmes au moyen desquelles une personne transgresse qu’elle est punie. 11. Ainsi, puisque mon foie était implacablement tourné contre Joseph, j’ai moi-même souffert du foie et j’ai été jugé sans pitié pendant dix périodes, durant le temps où je me montrais implacable envers Joseph.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’envie »; le grec ζῆλος peut désigner aussi bien la jalousie hostile que la rivalité envieuse.
    reason: lexical_alternative
  - marker: b
    text: Les mots « fait disparaître l’ignorance et » sont textuellement incertains dans le témoin grec; ils sont donc conservés entre crochets.
    reason: textual_variant
  - marker: c
    text: Le sujet masculin singulier des verbes n’est pas identifié explicitement en grec. Il peut être compris notamment comme Dieu ou comme la personne repentante; la traduction conserve cette ambiguïté.
    reason: syntactic_ambiguity
  - marker: d
    text: L’expression grecque signifie littéralement « pendant dix temps/périodes ». Elle peut être comprise comme « dix ans » dans ce contexte, mais la durée exacte n’est pas explicitée.
    reason: alternative_reading
lexical_decisions:
- source_word: μῖσος
  choice: la haine
  rationale: Le nom abstrait maintient le thème directeur du vice et sa personnification dans le passage.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: elle ne cesse de tenir compagnie au mensonge
  rationale: Cette formulation naturelle conserve à la fois la continuité et l’image de la haine alliée au mensonge.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: elle grossit les petites choses
  rationale: Rend clairement l’exagération visée tout en préservant le contraste entre petites et grandes choses.
- source_word: τὸ φῶς σκότος παρέχει
  choice: présente la lumière comme des ténèbres
  rationale: Conserve l’inversion morale sans affirmer littéralement que la lumière devient ténèbres.
- source_word: συκοφαντίαν
  choice: la calomnie
  rationale: Terme français courant et précis pour une accusation mensongère et malveillante.
- source_word: ὀργὴν ἐκταράσσει / πόλεμον διεγείρει
  choice: attise la colère et la guerre
  rationale: Le même verbe français donne à l’énumération une vigueur naturelle tout en exprimant l’action de provoquer et d’intensifier.
- source_word: ὕβριν
  choice: l’insolence
  rationale: Préserve la dimension d’arrogance outrageante du terme grec, plus forte que le simple orgueil.
- source_word: πλεονεξίαν
  choice: toute forme d’avidité
  rationale: « Avidité » exprime le désir d’avoir toujours davantage; « toute forme de » rend la portée de πᾶσαν.
- source_word: ἰοῦ διαβολικοῦ
  choice: un poison diabolique
  rationale: Conserve l’image vive du poison et la qualification diabolique sans expliciter indûment le génitif.
- source_word: ζῆλος
  choice: la jalousie
  rationale: Dans cette liste de vices relationnels, « jalousie » convient bien, tout en laissant en note la possibilité d’« envie ».
- source_word: μετάνοια
  choice: la repentance
  rationale: Dans les versets 7-8, le terme désigne une réorientation morale et religieuse, et non un simple changement d’opinion.
- source_word: διαβούλιον
  choice: la volonté
  rationale: Le terme vise ici le dessein ou l’orientation intérieure; « volonté » est intelligible et s’accorde avec le mouvement vers le salut.
- source_word: χρόνους δέκα
  choice: pendant dix ans
  rationale: χρόνος peut désigner une année, notamment avec un nombre; la traduction principale suit cette lecture tout en signalant en note le sens plus littéral et moins précis.
theological_decisions:
- issue: Portée de la repentance en 6-8
  choice: « m’être repenti » au v. 6 et « repentance » aux v. 7-8
  alternative: « avoir changé d’avis » / « changement d’esprit »
  rationale: Le contexte associe le changement intérieur de Gad à sa faute envers Joseph puis en tire un principe moral orienté vers Dieu; « repentance » préserve cette continuité sans la réduire à une opération intellectuelle.
- issue: Expression κατὰ Θεὸν au v. 7
  choice: « la véritable repentance selon Dieu »
  alternative: « la véritable repentance devant Dieu » ou « voulue par Dieu »
  rationale: La formulation littérale conserve la tension du grec et évite de préciser sans preuve si Dieu est la norme, l’auteur ou l’objet de la repentance.
- issue: Phrase incertaine ἀναιρεῖ τὴν ἄγνοιαν καὶ au v. 7
  choice: Traduite entre crochets
  alternative: L’omettre ou l’intégrer sans marque
  rationale: Les crochets de la source signalent une incertitude textuelle; la traduction rend les mots disponibles tout en maintenant leur statut incertain.
- issue: Sujet non exprimé au v. 8
  choice: 'Tournure impersonnelle : « on sait accueillir ceux qui reviennent »'
  alternative: Faire de Dieu, de la repentance ou de la personne repentante le sujet explicite
  rationale: Le grec passe à un verbe au masculin singulier sans antécédent masculin assuré. La tournure impersonnelle préserve le contenu sans imposer une identification théologique contestable du sujet.
- issue: Rétribution correspondante aux v. 9-11
  choice: Conserver le lien entre le foie hostile à Joseph et la maladie du foie
  alternative: Atténuer le foie figuré en traduisant simplement par « mes passions »
  rationale: Le texte établit expressément une correspondance entre l’organe associé à la faute et celui qui subit le châtiment; l’image doit rester visible sans généralisation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les personnifications et les contrastes rhétoriques du grec sont maintenus, tandis que les enchaînements sont légèrement adaptés à la syntaxe française. « Homme pieux » garde la couleur éthique de ἀνὴρ ὅσιος; les formulations inclusives sont employées là où le grec parle de l’être humain en général, sans effacer les références masculines particulières.
