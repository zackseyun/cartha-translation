  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004.yaml
  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some servant, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love,
    through longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: fr
  text: 1 Ainsi donc, mes enfants, gardez-vous de la haine, car elle commet l’iniquité même contre le Seigneur lui-même. 2 Car elle ne veut pas écouter les paroles de ses commandements concernant l’amour du prochain, et elle pèche contre Dieu. 3 Car si un frère tombe, elle s’empresse aussitôt de le faire savoir à tous et s’active pour qu’il soit jugé, puni et meure. 4 Et s’il s’agit d’un esclave, elle l’accuse auprès de son maître[a] et se réjouit de toutes ses détresses, dans l’espoir qu’il soit mis à mort. 5 Car la haine fait cause commune avec l’envie contre ceux qui prospèrent ; lorsqu’elle entend parler de leur réussite et qu’elle la voit, elle s’en trouve toujours affaiblie. 6 De même que l’amour veut même rendre la vie aux morts et rappeler ceux qui sont sous le coup d’une sentence de mort, de même la haine veut tuer les vivants et ne veut pas laisser vivre ceux qui n’ont péché que dans une petite affaire[b]. 7 Car l’esprit de haine, par la faiblesse de courage[c], collabore avec
    Satan en tout pour la mort des êtres humains ; mais l’esprit d’amour, par la longanimité, collabore avec la loi de Dieu pour le salut des êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle le dénonce à son maître ». L’expression grecque peut évoquer une dénonciation hostile devant une personne ayant autorité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui n’ont que peu péché ». Le grec peut désigner soit une faute peu importante, soit un faible degré de péché.'
    reason: ambiguity
  - marker: c
    text: Le terme grec peut aussi évoquer la petitesse d’âme, le découragement ou la lâcheté.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: la haine
  rationale: Le nom abstrait est conservé et personnifié, conformément au mouvement du passage qui aboutit à « l’esprit de haine ».
- source_word: ἀνομίαν ποιεῖ
  choice: commet l’injustice
  rationale: Formulation française naturelle qui conserve l’idée d’un acte contraire à la loi, sans limiter le terme à une infraction civile.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: les paroles de ses commandements
  rationale: Les deux substantifs grecs restent perceptibles au lieu d’être réduits au seul mot « commandements ».
- source_word: ἀγάπης τοῦ πλησίον
  choice: l’amour du prochain
  rationale: Expression biblique française claire et consacrée, qui indique sans ambiguïté l’objet de l’amour.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: elle l’accuse auprès de son maître
  rationale: Le contexte appelle une dénonciation hostile destinée à entraîner le châtiment ; une note signale l’incertitude précise de l’expression.
- source_word: ἐπιχαίρει αὐτῷ
  choice: se réjouit de chacune de ses détresses
  rationale: Rend le plaisir malveillant pris aux souffrances d’autrui sans ajouter le terme plus interprétatif « jubile ».
- source_word: ἐν προκοπῇ
  choice: leur réussite
  rationale: Dans le contexte de ceux qui prospèrent, le terme désigne leur progrès ou leur succès.
- source_word: ἀσθενεῖ
  choice: elle en est toujours malade
  rationale: Conserve l’image forte d’une haine rendue malade ou faible par la prospérité d’autrui.
- source_word: ζωοποιῆσαι
  choice: rendre la vie
  rationale: Préserve la vigueur de l’image de vivification sans décider s’il s’agit d’une résurrection littérale.
- source_word: ὀλιγοψυχίας
  choice: pusillanimité
  rationale: Le mot français exprime la petitesse ou faiblesse d’âme suggérée par le grec ; une note en déploie les nuances possibles.
- source_word: μακροθυμίᾳ
  choice: patience
  rationale: Terme français courant couvrant ici l’endurance patiente et la lenteur à la colère.
theological_decisions:
- issue: Personnification de la haine et de l’amour
  choice: Maintenir ces réalités comme des puissances morales personnifiées, puis parler explicitement de leur « esprit ».
  alternative: Les réduire partout à de simples sentiments ou dispositions psychologiques.
  rationale: Le grec passe des noms abstraits à πνεῦμα. La personnification respecte cette progression et sa tension spirituelle sans construire un système doctrinal supplémentaire.
- issue: Langage vivifiant appliqué à l’amour
  choice: Conserver les images fortes de rendre la vie aux morts et de rappeler les condamnés à mort.
  alternative: Paraphraser en disant seulement que l’amour cherche à sauver ou à aider tout le monde.
  rationale: Le texte emploie un langage susceptible d’être entendu comme hyperbole morale ou comme évocation plus littérale ; la traduction ne tranche pas cette ambiguïté.
- issue: Coopération avec Satan et avec la loi de Dieu
  choice: Traduire symétriquement συνεργεῖ par « collabore avec » dans les deux membres.
  alternative: Atténuer le premier membre en une simple influence psychologique, ou personnifier davantage la loi de Dieu.
  rationale: La symétrie du grec oppose directement les deux esprits et leurs alliances respectives ; elle doit rester audible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les parallélismes rhétoriques du grec tout en évitant les calques peu naturels. « Esclave » est retenu là où le rapport explicite à un maître indique un statut servile. Le masculin pluriel final est rendu par « êtres humains », puis par « leur », afin d’exprimer la portée générique de ἀνθρώπων.
