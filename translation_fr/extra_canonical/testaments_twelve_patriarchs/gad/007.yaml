  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: fr
  text: '**Testament de Gad 7**


    **1.** Si quelqu’un prospère plus que vous, ne vous en attristez pas. Priez plutôt pour lui, afin qu’il parvienne à l’accomplissement[a] ; car cela est à votre avantage. **2.** Et s’il s’élève encore davantage, ne l’enviez pas, en vous rappelant que toute chair mourra. Offrez plutôt des hymnes au Seigneur, qui accorde à tous les humains ce qui est bon et avantageux. **3.** Examine les jugements du Seigneur : alors ton dessein sera éclairé et trouvera le repos[b]. **4.** Mais si quelqu’un s’enrichit par le mal, comme Ésaü, le frère de mon père, ne le jalousez pas ; attendez plutôt la limite fixée par le Seigneur[c]. **5.** Car si ces biens lui sont retirés à cause de ses maux, ou s’il se repent, il lui est pardonné ; mais s’il demeure sans repentance, il est gardé en vue d’un châtiment éternel[d]. **6.** En effet, le pauvre qui, sans envier personne en quoi que ce soit, plaît au Seigneur est plus riche que tous, car il ne connaît pas les distractions des gens futiles. **7.** Arrachez
    donc la haine de vos âmes et aimez-vous les uns les autres avec droiture de cœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « afin qu’il soit rendu parfait » ou « afin qu’il soit pleinement accompli ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte grec de cette proposition est difficile. On peut aussi comprendre : « Examine les jugements du Seigneur, et ton projet deviendra clair et s’apaisera. »'
    reason: textual_variant
  - marker: c
    text: L’expression peut aussi désigner « le moment fixé » ou « le décret du Seigneur ».
    reason: lexical_alternative
  - marker: d
    text: Le début de ce verset présente une syntaxe grecque incertaine. Le grec peut aussi être compris comme disant que le Seigneur retire les richesses acquises par le mal et pardonne à celui qui se repent. Le mot traduit par « éternel » peut également qualifier ce qui appartient à l’âge à venir.
    reason: textual_variant
lexical_decisions:
- source_word: εὐοδοῦται
  choice: prospère
  rationale: Dans ce contexte de comparaison sociale, le verbe désigne le fait de réussir ou de connaître la prospérité, non un voyage littéral.
- source_word: τελειωθῇ
  choice: parvienne à l’accomplissement
  rationale: Cette formulation conserve l’idée d’achèvement ou de plénitude sans réduire le terme à la seule réussite matérielle ni lui imposer un sens technique de perfection morale.
- source_word: συμφέρον / συμφέροντα
  choice: à votre avantage / avantageux
  rationale: La reprise lexicale française fait entendre le thème de ce qui procure un véritable bien, au verset 1 comme au verset 2.
- source_word: ὑψοῦται
  choice: s’élève
  rationale: Le verbe peut évoquer une élévation de rang ou de situation. « S’élève » garde cette amplitude et reste naturel.
- source_word: πᾶσα σὰρξ
  choice: toute chair
  rationale: La formule traditionnelle exprime ici la condition mortelle de tous les êtres humains et conserve la solennité de l’expression grecque.
- source_word: ὕμνους προσφέρετε
  choice: offrez des hymnes
  rationale: « Offrez » préserve la coloration cultuelle de προσφέρετε, plus nettement que le simple verbe « chanter ».
- source_word: κρίματα Κυρίου
  choice: jugements du Seigneur
  rationale: Le terme peut désigner les décisions ou les actes judiciaires divins. « Jugements » garde cette portée sans la restreindre à des prescriptions.
- source_word: διαβούλιον
  choice: dessein
  rationale: Le mot renvoie à la délibération, au projet ou à la résolution intérieure. « Dessein » convient au registre sapientiel et demeure compréhensible.
- source_word: ἄφθονος
  choice: sans envier personne
  rationale: Le terme décrit l’absence d’envie. L’explicitation de l’objet implicite produit un français idiomatique sans changer le sens.
- source_word: ἐν εὐθύτητι καρδίας
  choice: avec un cœur droit
  rationale: Cette expression française naturelle restitue l’idée de droiture ou de rectitude du cœur sans ajouter les éléments absents du texte grec fourni.
theological_decisions:
- issue: Portée de τελειωθῇ dans la prière pour la personne prospère
  choice: « afin qu’il parvienne à l’accomplissement »
  alternative: « afin qu’il soit rendu parfait »
  rationale: Le grec évoque un aboutissement complet et peut aussi comporter une nuance de perfection. Le texte principal conserve cette largeur de sens, et la note signale l’autre traduction possible.
- issue: Sens de ὅρον Κυρίου face à la prospérité acquise par le mal
  choice: « la limite fixée par le Seigneur »
  alternative: « le moment fixé par le Seigneur » ou « le décret du Seigneur »
  rationale: ὅρος peut désigner une limite, un terme ou une détermination. La traduction principale garde l’image de la borne divine sans décider si elle est surtout temporelle ou judiciaire.
- issue: Sens de αἰωνίαν κόλασιν
  choice: « châtiment éternel »
  alternative: « châtiment de l’âge à venir » ou « châtiment durable »
  rationale: « Éternel » est la traduction française directe et usuelle dans cet avertissement eschatologique. Une note maintient visible l’étendue sémantique possible de αἰώνιος sans résoudre doctrinalement la question.
- issue: Conclusion de l’exhortation au verset 7
  choice: Traduire seulement « aimez-vous les uns les autres avec un cœur droit »
  alternative: Ajouter une exhortation à aimer « en actes et en paroles »
  rationale: Le texte grec fourni se termine par ἐν εὐθύτητι καρδίας et ne contient pas l’expansion présente dans la couche anglaise de consultation. Aucun complément non attesté n’est introduit.
translation_notes:
  register: Français international moderne, digne et accessible, avec un léger relief sapientiel. Le tutoiement singulier du verset 3 suit les impératifs grecs au singulier, tandis que les autres exhortations s’adressent au groupe au pluriel. Les répétitions conceptuelles du grec sont maintenues lorsqu’elles structurent l’argument. La fin suit strictement le texte grec fourni plutôt que l’expansion de la couche anglaise.
