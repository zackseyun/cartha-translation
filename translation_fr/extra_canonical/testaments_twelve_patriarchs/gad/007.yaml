    issue: 'Verset 5 : relation entre la perte des biens, le repentir et le pardon'
    rationale: Le texte grec est syntaxiquement difficile, mais ἀφίησι exprime un acte de pardon. « Il reçoit le pardon » atténue cette relation et « au milieu des malheurs » ne rend pas précisément ἐν κακοῖς. La révision emploie une tournure impersonnelle française, tout en expliquant dans la note les lectures possibles.
  - severity: low
    issue: 'Verset 7 : expression de la droiture du cœur'
    rationale: « Avec droiture de cœur » restitue directement l’expression grecque et offre une formulation internationale plus naturelle.
