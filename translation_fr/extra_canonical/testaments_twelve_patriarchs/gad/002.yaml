base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: fr
  text: '**Testament de Gad 2**


    **Première forme du récit**


    **1** Je confesse donc mon péché, mes enfants[a] : bien des fois, j’ai voulu le tuer, parce que je le haïssais de toute mon âme. **2** À cause de ses rêves, j’ai encore accru ma haine contre lui, et j’ai voulu l’effacer du pays des vivants[b], comme un veau lèche la verdure du champ. **3** Mais Juda le vendit en secret aux Ismaélites[c]. **4** Ainsi, le Dieu de nos pères le délivra de nos mains, afin que nous ne commettions pas un grand acte contraire à la loi en Israël.


    **Autre forme du récit**


    **3** C’est pourquoi Siméon et moi, nous l’avons vendu aux Ismaélites pour trente pièces d’or[d] ; après en avoir caché dix, nous en avons montré vingt à nos frères. **4** Ainsi, poussés par l’avidité, nous étions pleinement résolus à le tuer. **5** Mais le Dieu de mes pères le délivra de mes mains, afin que je ne commette pas un acte contraire à la loi en Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le chapitre conserve plus d’une forme textuelle du récit de la vente de Joseph. Les deux sont traduites ici au lieu d’être harmonisées.
    reason: textual_variant
  - marker: b
    text: Littéralement, le verbe grec évoque l’action de « lécher entièrement ». Dans ce contexte, il signifie éliminer ou effacer quelqu’un ; la comparaison avec le veau reprend ensuite son sens concret.
    reason: lexical_alternative
  - marker: c
    text: 'Dans cette forme du récit, Juda vend Joseph en secret. L’autre forme dit : « Siméon et moi, nous l’avons vendu aux Ismaélites. »'
    reason: textual_variant
  - marker: d
    text: « Trente pièces d’or » est le texte grec de cette forme du récit. La précision selon laquelle dix furent cachées et vingt montrées aux frères appartient à la même tradition textuelle.
    reason: textual_variant
lexical_decisions:
- source_word: Ὁμολογῶ ... τὴν ἁμαρτίαν μου
  choice: Je confesse ... mon péché
  rationale: « Confesser » conserve le caractère personnel et pénitentiel de l’aveu, tandis que « péché » garde sa portée morale et religieuse.
- source_word: πλειστάκις ἤθελον ἀνελεῖν αὐτόν
  choice: bien des fois, j’ai voulu le tuer
  rationale: Formulation française directe qui rend la répétition et l’intention meurtrière sans archaïsme.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: je le haïssais de toute mon âme
  rationale: Cette expression naturelle en français conserve l’intensité et l’image de l’âme présentes dans le grec.
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: j’ai encore accru ma haine contre lui
  rationale: Le français idiomatique exprime l’augmentation de la haine sans reproduire gauchement la construction grecque.
- source_word: ἐκλεῖξαι ... ἐκ γῆς ζώντων
  choice: l’effacer du pays des vivants
  rationale: Le verbe exprime ici l’élimination complète. « Effacer » rend ce sens idiomatique, tandis que la comparaison suivante conserve l’image concrète du veau qui lèche la verdure.
- source_word: ἐκλείχει ὁ μόσχος τὰ χλωρὰ τοῦ πεδίου
  choice: comme un veau lèche toute la verdure des champs
  rationale: La traduction garde le verbe concret de la comparaison et rend τὰ χλωρά par le collectif naturel « la verdure ».
- source_word: κρυφῆ πράσας
  choice: vendit en secret
  rationale: Rend clairement le caractère clandestin de la vente.
- source_word: ἐρρύσατο
  choice: l’arracha à nos mains / à mes mains
  rationale: « Arracher à » exprime une délivrance concrète hors d’un danger immédiat et convient bien à la construction avec « mains ».
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: un grand acte contraire à la Loi / un acte contraire à la Loi
  rationale: Cette formulation préserve la dimension juridico-morale de la famille d’ἀνομία et distingue fidèlement la forme amplifiée de la forme simple.
- source_word: τῇ πλεονεξίᾳ ἐπληροφορήθημεν τῆς ἀναιρέσεως αὐτοῦ
  choice: poussés par l’avidité, nous étions pleinement résolus à le tuer
  rationale: Rend la cupidité comme force motrice et l’idée d’une détermination complète en vue du meurtre.
theological_decisions:
- issue: Deux formes divergentes de la vente de Joseph sont conservées dans le texte grec.
  choice: Présenter successivement les deux formes, avec leur numérotation propre, sans les fusionner.
  alternative: Choisir une seule forme ou harmoniser Juda avec Gad et Siméon dans un récit unique.
  rationale: 'Le témoin fourni juxtapose deux traditions : l’une attribue secrètement la vente à Juda et parle d’un secours hors de « nos mains » ; l’autre l’attribue à Gad et Siméon et parle d’un secours hors de « mes mains ». La traduction doit laisser cette tension textuelle visible.'
- issue: Sens de l’image ἐκλεῖξαι ... ὡς ... ἐκλείχει.
  choice: Traduire idiomatiquement l’intention par « l’effacer », puis conserver littéralement l’image du veau qui « lèche » la verdure.
  alternative: Employer « le lécher hors du pays des vivants » ou généraliser les deux propositions par « le dévorer » ou « l’anéantir ».
  rationale: La première occurrence a le sens contextuel d’éliminer quelqu’un, mais la comparaison explicite repose sur l’action concrète de lécher. Cette solution conserve à la fois le sens et la force littéraire.
- issue: Portée de ἀνομία / ἀνόμημα en Israël.
  choice: « acte contraire à la Loi »
  alternative: « crime », « faute » ou « méchanceté »
  rationale: La traduction retenue maintient le lien entre l’acte meurtrier et la transgression d’un ordre normatif, sans introduire une qualification confessionnelle plus précise que le grec.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les deux formes textuelles sont signalées par de sobres intertitres éditoriaux afin d’éviter qu’une reprise de la numérotation soit prise pour une erreur. Le vocabulaire reste biblique sans archaïsmes : « pays des vivants », « de toute mon âme », « le Dieu de nos pères ».'
