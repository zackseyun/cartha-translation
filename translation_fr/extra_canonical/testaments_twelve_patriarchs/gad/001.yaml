  rationale: 'Révision limitée aux corrections sûres requises par le grec fourni : précision numérique, sens pastoral de ἐποίμαινε, action directe du père en 1.5, rendu plus proche de παρὰ γνώμην, et préservation du parallélisme de 1.9. Les ambiguïtés de 1.3, 1.6 et la variation des noms entre 1.6 et 1.9 restent signalées, sans harmonisation doctrinale ou narrative.'
