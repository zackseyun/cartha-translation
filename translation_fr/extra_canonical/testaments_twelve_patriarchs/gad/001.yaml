  footnotes:
  - marker: a
    text: La formulation grecque décrivant la manière dont Gad projette la bête est inhabituelle ; elle peut aussi se comprendre comme « je la lançais comme on lance une pierre ».
    reason: textual_variant
  - marker: b
    text: L’expression grecque peut signifier « contre l’avis de », « sans l’accord de » ou « à l’insu de ». Le témoin fourni nomme ici Ruben et Juda.
    reason: alternative_reading
  - marker: c
    text: 'La construction grecque oppose littéralement l’ouïe et les yeux : Gad ne voulait ni entendre Joseph ni le voir. Le texte nomme ici Juda seul, alors que le verset 6 nomme Ruben et Juda.'
    reason: textual_variant
lexical_decisions:
- source_word: διαθήκη
  choice: testament
  rationale: Dans le titre de cette œuvre, le mot désigne les dernières paroles et recommandations attribuées au patriarche ; « testament » conserve le genre littéraire traditionnel.
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  choice: vaillant dans la garde des troupeaux
  rationale: Cette formulation exprime le courage physique de Gad dans son activité pastorale sans réduire ἀνδρεῖος à une simple compétence.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: la chaleur l’affaiblit
  rationale: Rendu idiomatique qui conserve l’idée que le jeune Joseph fut physiquement diminué par une chaleur intense.
- source_word: παρὰ γνώμην
  choice: sans l’accord de
  rationale: Dans ce contexte collectif, l’expression indique que l’acte fut accompli contre l’avis ou sans l’autorisation de Ruben et de Juda. La note signale l’éventail possible.
- source_word: ἐνεκότουν
  choice: j’en voulus à
  rationale: Le verbe décrit une hostilité ou rancune durable, plus précisément qu’une colère momentanée.
- source_word: πνεῦμα τοῦ μίσους
  choice: l’esprit de haine
  rationale: La traduction maintient le langage moral et spirituel personnel du texte, ainsi que son thème central.
- source_word: κατὰ πρόσωπον ἤλεγξεν
  choice: il nous avait repris en face
  rationale: Cette expression conserve à la fois l’idée de reproche et son caractère direct et ouvert.
- source_word: τὰ θρέμματα
  choice: les bêtes
  rationale: Terme collectif pour les animaux élevés ; « les bêtes » convient ici, car le passage vise les animaux abattus et mangés plutôt que le troupeau comme ensemble.
theological_decisions:
- issue: Nature de « l’esprit de haine »
  choice: Conservation littérale du langage d’un « esprit de haine »
  alternative: Interprétation psychologique comme simple sentiment de haine
  rationale: Le grec permet et favorise une dimension spirituelle tout en décrivant l’état intérieur de Gad. La traduction ne tranche pas entre agent spirituel et personnification morale.
- issue: Accusation portée par Joseph contre ses frères
  choice: Traduction de l’accusation telle qu’elle apparaît dans le témoin grec fourni
  alternative: Harmonisation avec d’autres récits ou versions du Testament de Gad
  rationale: Le texte source nomme Ruben et Juda au verset 6, puis seulement Juda au verset 9. Cette variation est préservée plutôt que corrigée.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases restent accessibles, tandis que le vocabulaire « testament », « esprit de haine » et « repris en face » conserve la couleur éthique et religieuse du grec. La traduction se limite au passage grec fourni (1.1-9) et ne reprend pas les développements supplémentaires de la couche anglaise de consultation.
