base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: fr
  text: 1[a] Maintenant, écoutez une parole de vérité, afin de pratiquer la justice et toute loi du Très-Haut. Et ne vous laissez pas égarer, mes enfants, par l’esprit de haine, car il est mauvais dans toutes les actions des hommes. 2 Quoi que fasse celui qui hait, cela est abominable. Si quelqu’un observe la loi du Seigneur, celui qui hait ne l’approuve pas. Si quelqu’un craint le Seigneur et désire ce qui est juste, celui qui hait ne l’aime pas. 3 Il blâme la vérité, jalouse celui qui réussit[b], accueille volontiers la médisance et aime l’orgueil, car la haine aveugle son âme, comme elle aveuglait aussi la mienne lorsque je regardais Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écoutez une parole vraie » ; la formule grecque peut être comprise de l’une ou l’autre manière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui agit avec droiture » ; le verbe grec peut désigner la réussite ou l’action juste, mais la mention de la jalousie favorise ici l’idée de réussite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: une parole de vérité
  rationale: Conserve la tournure solennelle et l’indétermination du grec, sans imposer « la parole de vérité ».
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: afin de pratiquer la justice
  rationale: Le génitif infinitif marque ici le but de l’écoute; « pratiquer la justice » rend naturellement la conduite droite demandée.
- source_word: πάντα νόμον ὑψίστου
  choice: toute loi du Très-Haut
  rationale: Préserve la formulation distributive du témoin grec et le titre divin élevé.
- source_word: πλανᾶσθε
  choice: ne vous laissez pas égarer
  rationale: Rend la nuance médio-passive et l’influence exercée par l’esprit de haine.
- source_word: πνεύματι τοῦ μίσους
  choice: par l’esprit de haine
  rationale: Maintient la personnification ou quasi-personnification de la haine sans décider s’il s’agit d’une entité démoniaque.
- source_word: κακόν ἐστιν ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: il exerce une influence mauvaise sur toutes les actions humaines
  rationale: La préposition ἐπί suggère une portée ou une incidence sur les actions; cette formulation évite de dire que toute action humaine serait intrinsèquement mauvaise.
- source_word: βδελυκτόν ἐστιν
  choice: cela lui est odieux
  rationale: 'Le contexte décrit la perception déformée de celui qui hait: même l’observance de la Loi lui déplaît. « Lui est odieux » rend ce rapport implicite sans déclarer moralement abominable toute action du haineux.'
- source_word: φοβεῖται Κύριον
  choice: craint le Seigneur
  rationale: Conserve l’idiome biblique de respect et d’obéissance envers Dieu.
- source_word: θέλει τὸ δίκαιον
  choice: désire ce qui est juste
  rationale: Exprime l’orientation de la volonté vers la droiture tout en restant naturel en français moderne.
- source_word: τῷ κατορθοῦντι
  choice: celui qui réussit
  rationale: Avec φθονεῖ, la réussite constitue naturellement l’objet de la jalousie, bien que le verbe puisse aussi évoquer l’action droite.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: accueille avec faveur la médisance
  rationale: Préserve l’image d’un accueil empressé tout en employant un terme français adapté aux paroles malveillantes tenues contre autrui.
- source_word: ὑπερηφανίαν
  choice: l’orgueil
  rationale: Terme naturel et digne pour l’arrogance hautaine condamnée dans cette liste de vices.
- source_word: ἐκτυφλοῖ
  choice: aveugle
  rationale: Restitue directement la métaphore forte de l’aveuglement intérieur.
theological_decisions:
- issue: Personnification de la haine comme puissance spirituelle
  choice: Conserver « l’esprit de haine » dans le texte principal.
  alternative: « un esprit de haine » ou « des intentions haineuses »
  rationale: Le grec permet de comprendre une force morale personnifiée sans exiger une lecture pleinement démonologique; le maintien du mot « esprit » conserve cette tension.
- issue: Portée de βδελυκτόν dans la description de celui qui hait
  choice: Comprendre « cela lui est odieux » comme décrivant le jugement du haineux.
  alternative: « quoi qu’il fasse, c’est abominable »
  rationale: Les deux propositions suivantes expliquent que le haineux désapprouve celui qui observe la Loi et n’aime pas celui qui craint le Seigneur. La lecture subjective assure cette progression sans faire de toute action du haineux une abomination en soi.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours d’exhortation demeure direct; le vocabulaire biblique traditionnel (« Très-Haut », « craint le Seigneur », « esprit de haine ») est conservé lorsqu’il reste immédiatement intelligible.
