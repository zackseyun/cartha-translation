  to: 1[a] Maintenant, écoutez une parole de vérité, afin de pratiquer la justice et toute loi du Très-Haut. Et ne vous laissez pas égarer, mes enfants, par l’esprit de haine, car il est mauvais dans toutes les actions des hommes. 2 Quoi que fasse celui qui hait, cela est abominable. Si quelqu’un observe la loi du Seigneur, celui qui hait ne l’approuve pas. Si quelqu’un craint le Seigneur et désire ce qui est juste, celui qui hait ne l’aime pas. 3 Il blâme la vérité, jalouse celui qui réussit[b], accueille volontiers la médisance et aime l’orgueil, car la haine aveugle son âme, comme elle aveuglait aussi la mienne lorsque je regardais Joseph.
