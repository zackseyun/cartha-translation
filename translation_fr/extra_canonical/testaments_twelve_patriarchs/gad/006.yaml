review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour corriger l’accord de « cœur » au v. 1, mieux situer la sortie « de chez Joseph » au v. 2, et retirer au v. 6 l’explicitation (« il ne veut plus recommencer ») absente du grec. La formulation finale doit rendre plus directement ἐκδίκησις, « vengeance », sans résoudre ou atténuer sa portée.
  naturalness: Le français est globalement clair et d’un registre approprié. Les corrections proposées rendent les impératifs et les enchaînements narratifs plus naturels tout en gardant le tutoiement individuel des vv. 3–7.
  terminology: « Prochain », « esprit de haine », « duplicité », « poison » et « paroles de paix » sont bien choisis. « Change d’avis » exprime ici le retournement de pensée de μετανοέω plus précisément que « change d’attitude », et « laisse à Dieu la vengeance » conserve le terme de rétribution du texte.
  issues:
  - severity: medium
    issue: 'Accord et nombre au v. 1 : « arrache la haine de son cœur ».'
    rationale: Le grec adresse un impératif pluriel et parle des « cœurs » des destinataires (ἐξάρατε ... ἀπὸ τῶν καρδιῶν ὑμῶν).
  - severity: medium
    issue: Référence de « sa présence » au v. 2.
    rationale: 'Le participe ἐξερχόμενος δὲ ἐξ αὐτοῦ renvoie immédiatement à Joseph : Gad parle paisiblement à Joseph devant son père, puis sort de chez/de la présence de Joseph. « Sa présence » est ambigu en français et peut renvoyer au père.'
  - severity: medium
    issue: 'Ajout interprétatif au v. 6 : « il ne veut plus recommencer ».'
    rationale: Le texte grec fourni dit que celui qui nie regrette de t’avoir fait du tort et, craignant, fait la paix. Il ne contient pas l’idée explicite de ne plus recommencer; celle-ci doit rester hors du texte.
  - severity: low
    issue: « Le soin de faire justice » au v. 7 atténue et reformule ἐκδίκησις.
    rationale: « Vengeance » est le correspondant direct, naturel et théologiquement non réducteur de τὴν ἐκδίκησιν; le contexte commande de la confier à Dieu plutôt que de l’exercer soi-même.
