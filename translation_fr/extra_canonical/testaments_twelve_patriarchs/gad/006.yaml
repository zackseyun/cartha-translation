  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006.yaml
  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
translation:
  language: fr
  text: '1. Et maintenant, mes enfants, je vous exhorte : que chacun aime son prochain et arrachez la haine de vos cœurs. Aimez-vous les uns les autres par les actes, par la parole et par l’intention de l’âme.


    2. Car moi-même, en présence de mon père, je parlais paisiblement à Joseph ; mais, en sortant de chez lui, l’esprit de haine obscurcissait mon intelligence et troublait mes pensées, au point que je voulais le tuer.


    3. Aimez-vous les uns les autres de tout cœur. Si quelqu’un pèche contre toi, adresse-lui des paroles de paix[a] et ne garde aucune duplicité dans ton âme. S’il reconnaît sa faute et change d’avis, pardonne-lui.


    4. Mais s’il nie, ne te dispute pas avec lui, de peur que, s’il en vient à prêter serment, tu ne pèches doublement.


    5. Au cours d’une querelle, ne laisse pas un étranger entendre ton secret, de peur qu’il ne se mette à te haïr, ne devienne ton ennemi et ne commette un grand péché contre toi. Car souvent, après avoir reçu de toi ce poison, il te tue par traîtrise ou t’entraîne dans des maux[b].


    6. Mais s’il nie et éprouve de la honte quand il est repris, reste tranquille et ne le reprends plus. Car celui qui nie regrette de t’avoir fait du tort et, saisi de crainte, fait la paix[c].


    7. Mais même s’il est sans honte et persiste dans le mal, pardonne-lui malgré tout de tout cœur et laisse à Dieu la vengeance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset 3 présente une variation textuelle entre « adresse-lui des paroles de paix » et « parle-lui dans la paix », ainsi que dans l’ordre de la phrase concernant l’absence de duplicité intérieure. L’appel à une parole pacifique sans fausseté demeure clair.
    reason: textual_variant
  - marker: b
    text: 'Le texte du verset 5 est difficile. Il avertit contre la divulgation d’une affaire privée pendant une querelle : la haine ainsi transmise comme un « poison » peut pousser un tiers à l’hostilité, à la traîtrise ou à d’autres actes mauvais.'
    reason: textual_variant
  - marker: c
    text: Les témoins diffèrent dans le verset 6 sur la formulation du regret et de la crainte de celui qui nie. Le sens général paraît être que sa honte peut le conduire à cesser de faire du tort et à rechercher la paix.
    reason: textual_variant
lexical_decisions:
- source_word: παραινῶ
  choice: je vous exhorte
  rationale: Conserve la force de l’exhortation testamentaire dans un français digne et courant.
- source_word: πλησίον
  choice: prochain
  rationale: Terme éthique français établi, qui exprime clairement la relation envers autrui.
- source_word: ἐξάρατε τὸ μῖσος
  choice: arrache la haine
  rationale: Rend la vigueur de l’impératif et l’idée d’une expulsion décisive, sans lourdeur.
- source_word: διανοίᾳ ψυχῆς
  choice: par l’intention de l’âme
  rationale: Préserve l’expression grecque de l’intériorité sans la réduire à « sincèrement ».
- source_word: εἰρηνικά
  choice: paisiblement
  rationale: Reproduit naturellement la valeur adverbiale et le contraste avec la haine intérieure.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: l’esprit de haine
  rationale: Maintient la personnification et la portée morale de l’expression grecque.
- source_word: νοῦν / λογισμόν
  choice: intelligence / pensées
  rationale: Distingue les deux facultés évoquées par le grec tout en produisant un français naturel.
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: adresse-lui des paroles de paix
  rationale: Conserve l’image sémitisante de la paix tout en restant intelligible en français moderne.
- source_word: δόλον
  choice: duplicité
  rationale: Exprime la fausseté intérieure visée dans ce contexte relationnel.
- source_word: μετανοήσας
  choice: change d’attitude
  rationale: Dans ce cadre interpersonnel, le mot désigne une reconnaissance suivie d’un retournement concret ; cette formulation évite de surcharger le passage d’un sens doctrinal technique.
- source_word: τὸν ἰόν
  choice: ce poison
  rationale: Préserve la métaphore du venin ou poison transmis par la haine.
- source_word: τὴν ἐκδίκησιν
  choice: le soin de faire justice
  rationale: Rend l’abandon à Dieu de la rétribution sans suggérer une vengeance passionnelle humaine.
theological_decisions:
- issue: Sens de μετανοήσας au verset 3
  choice: change d’attitude
  alternative: se repent
  rationale: Le contexte associe aveu, retournement relationnel et pardon. La traduction retenue garde ce mouvement sans imposer un vocabulaire théologique plus technique que le contexte.
- issue: Rétribution finale confiée à Dieu
  choice: laisse à Dieu le soin de faire justice
  alternative: laisse la vengeance à Dieu
  rationale: La formule conserve l’exigence de non-représailles et le jugement divin, tout en rendant ἐκδίκησις dans un français naturel sans en atténuer la gravité.
- issue: Le « spirit of hatred » comme réalité morale ou personnifiée
  choice: l’esprit de haine
  alternative: un sentiment de haine
  rationale: La traduction ne réduit pas πνεῦμα à une simple émotion et préserve l’ambiguïté quant à sa personnification.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier suit le passage du grec aux exhortations adressées à chacun individuellement, tandis que le pluriel est maintenu pour l’adresse collective. Les images fortes — « esprit de haine », « poison » — sont conservées. Les passages textuellement incertains ne sont pas harmonisés au-delà de ce que permet l’ensemble des témoins.
