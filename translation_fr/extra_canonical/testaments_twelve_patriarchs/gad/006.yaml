    3. Aimez-vous les uns les autres de tout cœur. Si quelqu’un pèche contre toi, adresse-lui des paroles de paix[a] et ne garde aucune duplicité dans ton âme. S’il reconnaît sa faute et change d’attitude, pardonne-lui.


    4. Mais s’il nie, ne te dispute pas avec lui, de peur que, s’il en vient à prêter serment, tu ne pèches doublement.


