    6. Mais s’il nie et éprouve de la honte quand il est repris, reste tranquille et cesse de le reprendre. Car celui qui nie regrette de t’avoir fait du tort : il ne veut plus recommencer et, saisi de crainte, il fait la paix[c].


    7. Mais même s’il est sans honte et persiste dans le mal, pardonne-lui malgré tout de tout cœur et laisse à Dieu le soin de faire justice.'
