  rationale: La révision suit les cinq versets du texte grec fourni, plutôt que les développements beaucoup plus longs de la piste anglaise, lesquels ne correspondent pas à ce chapitre dans la source. Elle corrige les verbes narratifs et l’injonction de 8.3, maintient l’ambiguïté prudente du pronom de 8.2, et ne précise pas davantage la portée du salut issu de Juda et de Lévi.
