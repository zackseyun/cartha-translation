  to: '**Testament de Gad 8**


    1 Dites donc, vous aussi, ces choses à vos enfants, afin qu’ils honorent Juda et Lévi, car c’est d’eux que le Seigneur fera surgir pour vous le salut d’Israël.


    2 En effet, je sais que vos enfants se détourneront de lui[a] et que, dans toutes sortes de méchanceté, de mauvais traitements et de corruption, ils seront loin du Seigneur.


    3 Après un court silence, il reprit : « Mes enfants, obéissez à votre père et ensevelissez-moi près de mes ancêtres. »


    4 Puis il releva ses pieds et s’endormit en paix.


