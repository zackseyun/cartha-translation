revisions:
- from: '**Testament de Gad 8**


    1 Dites donc, vous aussi, ces choses à vos enfants, afin qu’ils honorent Juda et Lévi, car c’est d’eux que le Seigneur fera surgir pour vous le salut destiné à Israël.


    2 En effet, je sais que vos enfants se détourneront de lui[a] et que, livrés à toutes sortes de méchanceté, de violence et de corruption, ils seront loin du Seigneur.


    3 Après un court silence, il reprit : « Mes enfants, écoutez votre père et ensevelissez-moi près de mes ancêtres. »


