  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
translation:
  language: fr
  text: '**Testament de Gad 8**


    1 Dites donc, vous aussi, ces choses à vos enfants, afin qu’ils honorent Juda et Lévi, car c’est d’eux que le Seigneur fera surgir pour vous le salut d’Israël.


    2 En effet, je sais que vos enfants se détourneront de lui[a] et que, dans toutes sortes de méchanceté, de mauvais traitements et de corruption, ils seront loin du Seigneur.


    3 Après un court silence, il reprit : « Mes enfants, obéissez à votre père et ensevelissez-moi près de mes ancêtres. »


    4 Puis il releva ses pieds et s’endormit en paix.


    5 Cinq ans plus tard, ils le transportèrent à Hébron et le placèrent avec ses ancêtres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’éloigneront de lui ». Le pronom grec n’a pas d’antécédent explicite. Dans le contexte, il renvoie probablement au Seigneur, sujet de la proposition précédente.
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: τιμήσωσιν
  choice: qu’ils honorent
  rationale: Exprime le respect dû à Juda et à Lévi sans lui donner nécessairement une portée cultuelle.
- source_word: ἀνατελεῖ … σωτηρίαν
  choice: fera surgir … le salut
  rationale: Conserve l’image grecque d’un salut que le Seigneur fait se lever ou surgir, ainsi que sa portée prophétique.
- source_word: ἀποστήσονται
  choice: se détourneront
  rationale: Rend le mouvement de rupture et d’éloignement impliqué par le verbe, sans imposer le terme doctrinal plus technique « apostasieront ».
- source_word: κακώσει
  choice: violence
  rationale: Dans l’énumération des maux, « violence » rend naturellement l’idée de mauvais traitements ou d’oppression, tout en évitant de confondre ce terme avec la méchanceté déjà exprimée par πονηρίᾳ.
- source_word: ἡσυχάσας ὀλίγον
  choice: Après un court silence
  rationale: Formulation française naturelle pour une brève pause avant de reprendre la parole.
- source_word: ἐκοιμήθη ἐν εἰρήνῃ
  choice: s’endormit en paix
  rationale: Préserve l’euphémisme grec de la mort et sa tonalité paisible.
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: il ramena ses pieds contre lui
  rationale: Rend le geste final de replier ou relever les pieds, sans ajouter un lit que le texte grec ne mentionne pas.
- source_word: ἀνήγαγον
  choice: ils le transportèrent à Hébron
  rationale: Le verbe indique qu’on le fit monter; en français, « transportèrent à Hébron » exprime clairement le transfert du corps.
theological_decisions:
- issue: Le salut surgissant de Juda et de Lévi
  choice: « c’est d’eux que le Seigneur fera surgir pour vous le salut destiné à Israël »
  alternative: « d’eux le salut se lèvera pour Israël »
  rationale: La formulation maintient à la fois l’action du Seigneur, le rôle conjoint de Juda et de Lévi et la portée prophétique, sans identifier plus précisément ce salut à une interprétation sacerdotale, royale ou messianique particulière.
- issue: L’antécédent du pronom dans « se détourneront de lui »
  choice: Maintien du pronom avec une note signalant l’ambiguïté
  alternative: Remplacer directement le pronom par « du Seigneur »
  rationale: Le grec emploie un pronom singulier dont l’antécédent n’est pas explicite. La suite de la phrase favorise une référence au Seigneur, mais le texte traduit conserve l’indétermination formelle.
- issue: La mort de Gad décrite comme un sommeil
  choice: « s’endormit en paix »
  alternative: « mourut en paix »
  rationale: Le maintien de la métaphore grecque respecte la formulation théologique et narrative sans en préciser les implications sur l’état des morts.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction suit les cinq versets effectivement présents dans la source grecque fournie, dans l’ordre Juda–Lévi, sans reprendre les développements absents du texte grec mais présents dans la couche anglaise de consultation.
