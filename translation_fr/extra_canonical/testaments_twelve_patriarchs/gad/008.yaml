review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour corriger plusieurs écarts précis avec le grec : ὑπακούσατε demande « obéissez à », ἐξάρας τοὺς πόδας signifie qu’il releva les pieds, et μετὰ τῶν πατέρων implique « avec ses ancêtres ». La formulation du salut est resserrée afin de ne pas ajouter « destiné à ».'
  naturalness: Le français révisé reste moderne, international et digne. « Releva ses pieds » conserve volontairement le geste quelque peu solennel du grec sans le paraphraser.
  terminology: « Honorer », « salut », « se détourner », « s’endormit en paix » et « ancêtres » conviennent au registre testamentaire. « Mauvais traitements » rend κακώσει plus exactement que « violence », sans fusionner ce terme avec πονηρία.
  issues:
  - severity: medium
    issue: « écoutez votre père » pour ὑπακούσατε τῷ πατρὶ ὑμῶν
    rationale: Ὑπακούω signifie écouter en obéissant. « Obéissez à votre père » rend l’injonction explicitement présente dans le grec.
  - severity: medium
    issue: « il ramena ses pieds contre lui » pour ἐξάρας τοὺς πόδας
    rationale: Le participe ἐξάρας signifie « ayant levé/relevé »; l’idée de les ramener contre son corps n’est pas exprimée.
  - severity: medium
    issue: « auprès de ses ancêtres » pour μετὰ τῶν πατέρων αὐτοῦ
    rationale: Μετά avec le génitif signifie « avec ». La traduction doit indiquer l’ensevelissement parmi ses ancêtres.
  - severity: low
    issue: « violence » pour κακώσει et ajout de « destiné à »
    rationale: Κακώσις évoque plus largement les mauvais traitements, l’affliction ou l’oppression. « Destiné à » explicite une relation qui n’est pas formulée ainsi dans le grec.
  - severity: low
    issue: Rationale de note sur l’antécédent de « lui »
    rationale: La note dit que le Seigneur est « nommé ensuite », alors qu’il est le sujet explicite de la proposition précédente. La note peut signaler l’ambiguïté formelle sans cette justification inexacte.
