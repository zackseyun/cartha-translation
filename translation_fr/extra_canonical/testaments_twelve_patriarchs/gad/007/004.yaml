base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: fr
  text: Mais si quelqu’un s’enrichit par le mal, comme Ésaü, le frère de mon père, ne l’enviez pas. En effet, attendez le terme du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: par le mal
  rationale: Rend naturellement l’origine ou le moyen mauvais de l’enrichissement, sans préciser indûment s’il s’agit d’actes, de biens ou de profits mal acquis.
- source_word: πλουτήσει
  choice: s’enrichit
  rationale: Équivalent français idiomatique du verbe signifiant devenir riche.
- source_word: πατράδελφος
  choice: le frère de mon père
  rationale: Conserve le lien de parenté explicite donné par le grec plutôt que de le remplacer par « oncle ».
- source_word: μὴ ζηλώσητε
  choice: ne l’enviez pas
  rationale: Dans ce contexte, ζηλόω exprime l’envie suscitée par la prospérité d’autrui ; le pronom reprend naturellement la personne enrichie.
- source_word: ὅρον Κυρίου
  choice: la limite fixée par le Seigneur
  rationale: ὅρος désigne une limite ou un terme ; « fixée » explicite sobrement l’idée d’une limite établie, sans déterminer en quoi consiste cette échéance.
- source_word: ἐκδέξασθε
  choice: attendez
  rationale: Impératif invitant à attendre l’issue ou le terme venant du Seigneur.
theological_decisions:
- issue: Sens de « ὅρον Κυρίου »
  choice: la limite fixée par le Seigneur
  alternative: le terme fixé par le Seigneur
  rationale: « Limite » maintient la valeur lexicale large de ὅρος et préserve l’ambiguïté entre borne, terme et issue déterminée par Dieu.
- issue: Force de γάρ
  choice: car
  alternative: en effet
  rationale: Conserve explicitement le rapport justificatif du grec, même si l’enchaînement demeure abrupt.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’apposition généalogique et la tension du raisonnement grec sans ajouter « plutôt » ni préciser la nature de la limite divine.
