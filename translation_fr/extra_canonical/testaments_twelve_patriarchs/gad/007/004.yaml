review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : πλουτήσει est bien rendu par « s’enrichit », ζηλώσητε par « ne l’enviez pas », et l’apposition généalogique d’Ésaü est conservée. Toutefois, « limite fixée » ajoute l’idée explicite d’une fixation, qui n’est pas exprimée par ὅρον, et « limite » est moins naturel ici que « terme », tout en gardant l’ambiguïté du grec.'
  naturalness: « Car attendez » est un enchaînement abrupt et peu naturel en français moderne. « En effet, attendez… » conserve la valeur justificative de γάρ tout en donnant une phrase française fluide. « Le terme du Seigneur » est plus idiomatique que « la limite fixée par le Seigneur ».
  terminology: « Ésaü » et « le frère de mon père » sont corrects. « Le terme du Seigneur » rend ὅρον Κυρίου sans imposer une interprétation eschatologique, judiciaire ou providentialiste précise. « Par le mal » maintient utilement le caractère large et indéterminé de ἐκ κακῶν.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « la limite fixée »
    rationale: ὅρον signifie « limite, borne, terme » ; le participe « fixée » explicite une notion possible, mais non lexicalement exprimée dans le grec. « Terme » préserve mieux l’amplitude du terme source.
  - severity: low
    issue: 'Enchaînement français peu naturel : « car attendez »'
    rationale: Bien que γάρ soit justificatif, la juxtaposition de « car » et d’un impératif est raide en français moderne. « En effet, attendez » maintient le rapport discursif sans modifier le sens.
  revised_text: Mais si quelqu’un s’enrichit par le mal, comme Ésaü, le frère de mon père, ne l’enviez pas. En effet, attendez le terme du Seigneur.
