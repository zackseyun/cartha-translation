revisions:
- from: Mais si quelqu’un s’enrichit par le mal, comme Ésaü, le frère de mon père, ne l’enviez pas ; car attendez la limite fixée par le Seigneur.
  to: Mais si quelqu’un s’enrichit par le mal, comme Ésaü, le frère de mon père, ne l’enviez pas. En effet, attendez le terme du Seigneur.
  rationale: La révision remplace l’expression interprétative et peu idiomatique « la limite fixée par le Seigneur » par « le terme du Seigneur », qui rend naturellement ὅρος tout en préservant son ambiguïté. Elle reformule aussi la coordination introduite par γάρ afin d’obtenir un français moderne fluide sans ajouter l’opposition « plutôt » absente du grec.
