- source_word: Ἐξάρατε
  choice: Rejetez… loin de
  rationale: L’impératif aoriste exprime une action résolue consistant à ôter ou bannir la haine; cette tournure est naturelle en français tout en gardant la force de l’image.
- source_word: τὸ μῖσος
  choice: la haine
  rationale: Équivalent direct et courant du substantif grec.
- source_word: ἀπὸ τῶν ψυχῶν ὑμῶν
  choice: de vos âmes
  rationale: Conserve le terme anthropologique ψυχή et l’image intérieure du texte source.
- source_word: ἀγαπήσατε ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: Rend directement l’impératif et la réciprocité exprimée par ἀλλήλους.
- source_word: ἐν εὐθύτητι καρδίας
  choice: avec un cœur droit
  rationale: Formulation française claire et digne qui rend l’idée de droiture ou de rectitude intérieure sans lourdeur littérale.
