review_pass:
  verdict: revise
  source_fidelity: 'La formulation française actuelle interprète ἀφαιρεῖται comme un passif (« ce qui a été pris… lui est retiré »), alors que la forme grecque peut naturellement se lire comme un moyen avec αὐτά pour objet : « il les enlève / les emporte ». Elle introduit donc une double action de retrait qui n’est pas explicitement présente. Le passage grec est lui-même textuellement abrupt, notamment autour de ἢ et de αὐτά (signalé comme douteux dans l’édition) ; une note est nécessaire pour ne pas masquer cette difficulté.'
  naturalness: « Il reçoit le pardon » est naturel, mais il éloigne la formulation de ἀφίησι, qui signifie littéralement « [on/il] pardonne à » avec le datif μετανοήσαντι. « On pardonne à celui qui se repent » est à la fois naturel en français moderne et plus proche de la construction grecque. « Est réservé pour un châtiment éternel » rend plus idiomatiquement la valeur de τηρεῖται εἰς.
  terminology: « Se repent », « pardonne » et « châtiment éternel » sont appropriés. Le pronom αὐτά a un antécédent incertain dans le texte transmis ; « les » le conserve sans introduire un référent interprétatif. L’agent du pardon demeure non précisé.
  issues:
  - severity: medium
    issue: Double retrait ajouté par la traduction
    rationale: « Ce qui a été pris injustement lui est retiré » traite ἀφαιρεῖται comme un passif et ajoute l’idée que l’objet est retiré au fautif. Avec αὐτά à l’accusatif, une lecture moyenne, « il les enlève », est plus directement soutenue par le grec.
  - severity: medium
    issue: Construction grecque textuellement difficile non signalée
    rationale: Le texte imprimé comporte un signe d’incertitude sur αὐτά et une coordination abrupte par ἢ. Une traduction lissée sans note risque de présenter comme certaine une syntaxe et un enchaînement qui ne le sont pas.
  - severity: low
    issue: Rendu de ἀφίησι
    rationale: « Il reçoit le pardon » transmet l’idée générale, mais « on pardonne à celui qui se repent » reflète mieux le verbe actif et le datif μετανοήσαντι, sans identifier l’agent.
  revised_text: Car, s’il les enlève avec de mauvaises intentions, on pardonne à celui qui se repent ; mais celui qui ne se repent pas est réservé pour un châtiment éternel.
  revised_footnotes:
  - marker: a
    text: Le grec de la première partie est difficile et probablement altéré dans la tradition manuscrite. Le pronom « les » (grec αὐτά) a un antécédent incertain, et la liaison exacte avec « celui qui se repent » n’est pas assurée.
    reason: Signaler l’incertitude textuelle et syntaxique sans imposer une reconstruction ni un référent absent du texte transmis.
  revision_rationale: La révision abandonne l’interprétation passive et la double action de retrait introduites par le brouillon. Elle rend ἀφαιρεῖται de manière neutre comme un moyen (« s’il les enlève »), conserve l’agent du pardon indéterminé par « on », et rend τηρεῖται εἰς par « est réservé pour ». La note préserve explicitement l’ambiguïté du grec transmis, plutôt que de résoudre de façon spéculative sa syntaxe abrupte.
