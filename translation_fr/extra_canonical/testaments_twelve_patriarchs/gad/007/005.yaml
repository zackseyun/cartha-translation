  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: fr
  text: Car si ce qui a été pris injustement lui est retiré, ou s’il se repent, il reçoit le pardon ; mais s’il demeure sans repentir, il est gardé en vue d’un châtiment éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κακοῖς
  choice: injustement
  rationale: L’expression signifie littéralement « dans des maux » ; dans le contexte d’un bien pris à autrui, « injustement » rend naturellement la dimension morale de l’acte.
- source_word: μετανοήσαντι
  choice: s’il se repent
  rationale: Le participe aoriste désigne ici le fait de changer d’attitude et de se repentir.
- source_word: ἀφίησι
  choice: il reçoit le pardon
  rationale: Cette formulation conserve le sens passif suggéré par la compréhension contextuelle (« il est pardonné ») tout en évitant en français moderne l’ambiguïté de « il pardonne », le sujet grec n’étant pas explicite.
- source_word: ἀμετανόητος
  choice: sans repentir
  rationale: Rend l’état persistant de celui qui ne se repent pas sans alourdir la phrase par « impénitent ».
- source_word: τηρεῖται εἰς αἰωνίαν κόλασιν
  choice: il est gardé en vue d’un châtiment éternel
  rationale: Conserve le passif de τηρεῖται et la valeur prospective de εἰς, ainsi que la portée durable de αἰωνίαν.
theological_decisions:
- issue: Agent du pardon non exprimé
  choice: Employer « il reçoit le pardon » sans nommer l’agent
  alternative: « Dieu lui pardonne »
  rationale: Le grec ne nomme pas explicitement Dieu ; la traduction évite donc d’ajouter un sujet théologique absent du texte.
- issue: Portée de αἰωνίαν κόλασιν
  choice: « châtiment éternel »
  alternative: « correction pour l’âge à venir »
  rationale: « Châtiment éternel » correspond au sens usuel de l’expression grecque, sans préciser davantage la nature du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La construction conditionnelle et le contraste entre repentir et absence de repentir sont conservés. Aucun ajout confessionnel.
