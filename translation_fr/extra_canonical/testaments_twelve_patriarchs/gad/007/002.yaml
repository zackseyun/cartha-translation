- from: Et s’il est élevé encore davantage, ne l’enviez pas, vous souvenant que toute chair mourra. Mais offrez des hymnes au Seigneur, qui procure à tous les êtres humains ce qui est bon et avantageux.
  to: Et s’il est élevé encore davantage, ne l’enviez pas, en vous souvenant que toute chair mourra. Mais offrez des hymnes au Seigneur, qui procure à tous les êtres humains ce qui est bon et utile.
  rationale: 'Révision stylistique mineure, sans modification du sens ni de l’ambiguïté du texte grec : le passif « est élevé » est maintenu, de même que l’universalité de « toute chair » et de « tous les êtres humains ».'
