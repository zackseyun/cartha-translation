id: T12P.GAD.7.2
reference: Testament of Gad 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: fr
  text: Et s’il est élevé encore davantage, ne l’enviez pas, en vous souvenant que toute chair mourra. Mais offrez des hymnes au Seigneur, qui procure à tous les êtres humains ce qui est bon et utile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  choice: il est élevé encore davantage
  rationale: Conserve la forme passive et l’idée d’une élévation accrue, sans préciser si elle relève du statut, de l’honneur ou de la prospérité.
- source_word: μὴ φθονεῖτε αὐτῷ
  choice: ne l’enviez pas
  rationale: Rend directement le verbe φθονέω et son complément, dans un français courant et digne.
- source_word: πᾶσα σὰρξ
  choice: toute chair
  rationale: Maintient l’expression anthropologique traditionnelle et la portée universelle du grec.
- source_word: ὕμνους προσφέρετε
  choice: offrez des hymnes
  rationale: Préserve le vocabulaire cultuel de l’offrande ainsi que le sens précis d’ὕμνους.
- source_word: παρέχοντι
  choice: procure
  rationale: Exprime l’action de fournir ou d’accorder, avec un tour naturel en français.
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: ce qui est bon et avantageux
  rationale: 'Restitue les deux qualités distinctes : ce qui est bon en soi et ce qui apporte un avantage ou un bienfait.'
- source_word: πᾶσιν ἀνθρώποις
  choice: à tous les êtres humains
  rationale: Rend explicitement la portée inclusive d’ἀνθρώποις en français moderne.
theological_decisions:
- issue: Agent implicite de ὑψοῦται
  choice: Conserver le passif « il est élevé »
  alternative: « il s’élève » ou « Dieu l’élève »
  rationale: Le grec ne nomme pas l’agent et ne permet pas d’attribuer explicitement cette élévation à Dieu ni au sujet lui-même.
- issue: Portée de la providence divine
  choice: « à tous les êtres humains »
  alternative: « à tous »
  rationale: Le complément grec est expressément universel et humain; la traduction le conserve sans restreindre les bénéficiaires.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le parallélisme exhortatif, le passif ambigu et les termes bibliques « toute chair » et « hymnes ».
