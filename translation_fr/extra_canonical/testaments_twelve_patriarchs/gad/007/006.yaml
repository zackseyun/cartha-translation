revisions:
- from: Car le pauvre, s’il fait preuve de générosité en toutes choses et plaît au Seigneur, est plus riche que tous les autres[a], puisqu’il n’est pas accaparé par les préoccupations des gens futiles.
  to: Car le pauvre, s’il se montre généreux en toutes choses et plaît au Seigneur, est plus riche que tous les autres[a], car il n’a pas les préoccupations des gens futiles.
  rationale: La révision rétablit dans la dernière proposition la relation directe exprimée par le grec (« il n’a pas »), tout en conservant le choix contextuel de la générosité pour ἄφθονος et la note qui expose honnêtement son ambiguïté.
  reviewer_model: gpt-5.6-terra
