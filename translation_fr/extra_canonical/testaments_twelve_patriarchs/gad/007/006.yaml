base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: fr
  text: Car le pauvre, s’il se montre généreux en toutes choses et plaît au Seigneur, est plus riche que tous les autres[a], car il n’a pas les préoccupations des gens futiles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « se montre généreux » peut aussi signifier « est sans envie » ou « est dans l’abondance ».
    reason: Le grec ἄφθονος présente une ambiguïté réelle entre absence d’envie, libéralité et abondance.
lexical_decisions:
- source_word: ἄφθονος
  choice: fait preuve de générosité
  rationale: Le terme peut évoquer ce qui est abondant, accordé sans compter ou dépourvu d’envie. Appliqué à un pauvre, « faire preuve de générosité » exprime naturellement une disposition non envieuse et sans mesquinerie, sans suggérer qu’il possède matériellement tout en abondance.
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: est plus riche que tous les autres
  rationale: La construction comparative indique que ce pauvre surpasse tous les autres en richesse, dans un sens paradoxal qui ne se réduit pas aux biens matériels.
- source_word: περισπασμὸν τῶν ματαίων ἀνθρώπων
  choice: accaparé par les préoccupations des gens futiles
  rationale: περισπασμός désigne ce qui détourne, distrait ou absorbe l’esprit. Ici, « préoccupations » rend mieux l’idée de soucis absorbants que le français moderne « distraction ».
theological_decisions:
- issue: Nature de la richesse du pauvre qui plaît au Seigneur
  choice: Conserver le paradoxe « plus riche que tous les autres » sans définir cette richesse.
  alternative: Préciser qu’il s’agit d’une richesse spirituelle.
  rationale: Le grec affirme la supériorité en richesse sans ajouter « spirituelle » ; l’explicitation introduirait une interprétation absente du texte.
- issue: Portée de ἄφθονος
  choice: Rendre le mot par une générosité de disposition.
  alternative: « dans l’abondance » ou « sans envie »
  rationale: Le contexte du pauvre rend une abondance matérielle peu probable, tandis que le terme peut désigner une attitude sans envie et sans réticence. La note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le raisonnement serré du grec tout en évitant le calque peu naturel « avoir la distraction ». « Gens futiles » rend ματαίων sans la connotation historique ou religieuse plus étroite de « vaniteux ».
