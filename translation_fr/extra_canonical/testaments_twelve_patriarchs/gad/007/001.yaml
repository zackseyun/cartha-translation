source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: fr
  text: Mais si quelqu’un réussit mieux que vous, ne vous en attristez pas. Priez plutôt pour lui, afin qu’il soit rendu parfait. Car c’est ainsi que cela est dans votre intérêt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: réussit
  rationale: Le verbe signifie littéralement « suivre une bonne voie » et, par extension, réussir ou prospérer. « Réussit » est naturel en français et convient à la comparaison introduite par ὑπὲρ ὑμᾶς.
- source_word: μὴ λυπεῖσθε
  choice: ne vous en attristez pas
  rationale: Rend directement l’idée de tristesse ou d’affliction, avec le pronom « en » qui explicite naturellement en français la cause déjà mentionnée.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: Priez plutôt pour lui
  rationale: « Prier pour » est l’équivalent français idiomatique de εὔχεσθαι ὑπέρ; « plutôt » fait ressortir l’opposition marquée par ἀλλά.
- source_word: τελειωθῇ
  choice: qu’il parvienne à la perfection
  rationale: Le passif aoriste de τελειόω évoque l’accomplissement, l’achèvement ou la perfection. Cette formulation préserve cette amplitude sans préciser indûment s’il s’agit d’une perfection morale, spirituelle ou d’un plein accomplissement.
- source_word: συμφέρον
  choice: tournera à votre avantage
  rationale: συμφέρον désigne ce qui est utile, profitable ou avantageux. La tournure française exprime naturellement que cette conduite profite aux destinataires.
theological_decisions:
- issue: Portée de τελειωθῇ
  choice: qu’il parvienne à la perfection
  alternative: qu’il soit rendu parfait / qu’il soit mené à son plein accomplissement
  rationale: Le texte ne précise ni l’agent ni la nature exacte de cet accomplissement. La traduction conserve donc l’ouverture théologique du passif et évite d’ajouter explicitement Dieu comme agent.
translation_notes:
  register: Français moderne, international et digne. L’impératif pluriel est conservé. Deux phrases remplacent le point-virgule pour une lecture claire, sans modifier le rapport logique du grec.
