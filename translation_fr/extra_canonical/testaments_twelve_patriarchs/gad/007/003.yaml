  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: fr
  text: '3 Examine les jugements du Seigneur : alors ton dessein s’éclairera et s’apaisera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξέτασον
  choice: Examine
  rationale: Rend directement l’impératif grec, avec l’idée d’une considération attentive.
- source_word: κρίματα Κυρίου
  choice: les jugements du Seigneur
  rationale: « Jugements » conserve la portée judiciaire et morale de κρίματα sans la réduire à de simples commandements.
- source_word: τὸ διαβούλιόν σου
  choice: ton dessein
  rationale: « Dessein » exprime ici le projet ou l’orientation intérieure délibérée, dans un registre digne et naturel.
- source_word: καταλάμψει
  choice: s’éclairera
  rationale: Cette tournure naturelle en français conserve l’image de la lumière appliquée au dessein.
- source_word: ἡσυχάσει
  choice: s’apaisera
  rationale: Rend l’idée de parvenir au calme ou au repos sans suggérer une simple cessation d’activité.
theological_decisions:
- issue: Lien entre l’examen des jugements divins et l’état du dessein humain
  choice: Rendre les deux futurs comme la conséquence de l’impératif au moyen de « alors »
  alternative: Conserver une simple coordination avec « et »
  rationale: Le grec coordonne les propositions par καί, mais la relation consécutive est naturelle dans le contexte. « Alors » l’explicite légèrement sans introduire de doctrine supplémentaire.
translation_notes:
  register: Français moderne international, concis et digne. Le parallélisme des deux futurs est conservé par « s’éclairera et s’apaisera ».
