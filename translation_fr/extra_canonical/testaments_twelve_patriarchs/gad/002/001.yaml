source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: II. Ὁμολογῶ τοίνυν¹ τὴν ἁμαρτίαν μου, τέκνα², ὅτι πλειστάκις ἤθελον³ ἀνελεῖν αὐτόν, *ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: fr
  text: 'Je vous avoue donc mon péché, mes enfants : bien des fois, j’ai voulu le tuer, parce que je le haïssais du fond de mon âme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: Je vous avoue
  rationale: Dans ce contexte, le verbe exprime l’aveu personnel d’une faute. L’ajout du pronom « vous » rend naturelle en français l’adresse explicite « mes enfants » sans modifier le sens.
- source_word: τοίνυν
  choice: donc
  rationale: Conserve la valeur de transition et de conséquence du connecteur grec.
- source_word: πλειστάκις
  choice: bien des fois
  rationale: Rend l’idée de répétition fréquente dans un français courant et digne.
- source_word: ἀνελεῖν
  choice: le tuer
  rationale: Le verbe signifie ici faire mourir ou supprimer une personne; « tuer » exprime directement l’intention meurtrière.
- source_word: ἐκ ψυχῆς
  choice: du fond de mon âme
  rationale: Préserve l’image grecque d’une haine venant de l’être intérieur tout entier, tout en restant idiomatique en français.
theological_decisions:
- issue: Rapport introduit par ὅτι
  choice: Employer les deux-points après « mes enfants »
  alternative: « … mon péché, mes enfants, à savoir que… » ou « … en reconnaissant que… »
  rationale: ὅτι introduit le contenu de l’aveu. Les deux-points rendent ce rapport clairement et naturellement en français, sans ajouter d’interprétation causale.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse familiale « mes enfants » et la force de l’aveu sont conservées; aucune atténuation n’est apportée à l’intention de tuer ni à la haine exprimée.
