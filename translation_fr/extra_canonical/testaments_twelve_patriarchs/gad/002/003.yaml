source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: fr
  text: '[Texte α] Et Juda le vendit secrètement aux Ismaélites.


    [Textes β, A et S¹] C’est pourquoi Siméon et moi, nous l’avons vendu aux Ismaélites pour trente pièces d’or[a] ; après en avoir caché dix, nous en avons montré vingt à nos frères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage allant de « pour trente pièces d’or » à « nos frères » est signalé comme une addition ou une portion textuellement incertaine dans l’édition grecque consultée.
    reason: Les crochets et l’astérisque de l’édition distinguent ce segment du reste de la forme β, A et S¹.
lexical_decisions:
- source_word: κρυφῆ πράσας
  choice: le vendit secrètement
  rationale: πράσσω, dans ce contexte transactionnel, signifie « vendre » ; κρυφῆ indique que l’acte fut accompli en secret.
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Rend explicitement le lien causal marqué par la conjonction grecque.
- source_word: πεπράκαμεν
  choice: nous l’avons vendu
  rationale: Le parfait grec présente la vente comme un acte accompli dont la réalité demeure pertinente dans le récit.
- source_word: τριάκοντα χρυσίων
  choice: trente pièces d’or
  rationale: χρυσίον désigne ici une somme ou des pièces d’or sans préciser une unité monétaire particulière.
- source_word: ἀποκρύψαντες
  choice: après en avoir caché
  rationale: Le participe aoriste exprime une action antérieure à celle de montrer les vingt pièces.
theological_decisions:
- issue: Identité des responsables de la vente selon les témoins grecs
  choice: 'Présenter séparément les deux formes textuelles : Juda dans le texte α, Siméon et Gad dans les textes β, A et S¹.'
  alternative: Fusionner les deux versions en un seul récit harmonisé.
  rationale: Les témoins transmettent une divergence réelle sur l’auteur de la vente ; la conserver évite de résoudre artificiellement la tension textuelle.
- issue: Détail des trente pièces et de leur dissimulation
  choice: Conserver le détail dans la forme β, A et S¹ avec une note signalant son statut textuel.
  alternative: L’omettre ou l’intégrer sans indication.
  rationale: Le passage est attesté dans la tradition citée, mais les crochets et l’apparat de l’édition demandent que son caractère textuellement particulier soit visible.
translation_notes:
  register: Français international moderne, sobre et narratif. Les variantes α et β/A/S¹ sont présentées distinctement afin de préserver la divergence des témoins. « Pièces d’or » reste volontairement non technique, puisque le grec ne nomme pas de monnaie précise.
