- from: Et à cause de ses rêves, j’ajoutai encore de la haine à celle que j’avais contre lui, et je voulus le faire disparaître de la terre des vivants, comme un veau broute la verdure des champs.
  to: Et même à cause de ses rêves, j’accrus encore ma haine contre lui, et je voulus le lécher entièrement de la terre des vivants, comme un veau lèche la verdure du champ.
  rationale: La révision conserve l'image forte et inhabituelle du grec — l'effacement figuré par le fait de lécher entièrement — dans les deux membres de la comparaison. Elle maintient l'expression biblique « terre des vivants », sans imposer une explicitation doctrinale ou interprétative de l'intention meurtrière.
