base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: fr
  text: Et même à cause de ses rêves, j’accrus encore ma haine contre lui, et je voulus le lécher entièrement de la terre des vivants, comme un veau lèche la verdure du champ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Et… encore
  rationale: Rend la progression et la nuance additive de la particule sans alourdir la phrase française.
- source_word: διὰ τὰ ἐνύπνια
  choice: à cause de ses rêves
  rationale: Le contexte désigne les rêves de Joseph; le possessif explicite naturellement en français ce référent implicite.
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: j’ajoutai encore de la haine à celle que j’avais contre lui
  rationale: Conserve l’image d’une haine ajoutée ou accrue tout en donnant une syntaxe française intelligible.
- source_word: ἐκλεῖξαι ἐκ γῆς ζώντων
  choice: le faire disparaître de la terre des vivants
  rationale: Littéralement, le verbe évoque l’action de lécher entièrement; avec ce complément idiomatique, il exprime l’anéantissement. La formulation française conserve l’idée de suppression sans produire une expression incompréhensible.
- source_word: ὃν τρόπον ἐκλείχει ὁ μόσχος τὰ χλωρὰ τοῦ πεδίου
  choice: comme un veau broute la verdure des champs
  rationale: La comparaison explique le verbe précédent. «Broute» restitue naturellement en français l’action du veau qui fait disparaître la végétation, tandis que «verdure des champs» garde l’image agricole.
theological_decisions:
- issue: Portée de «terre des vivants»
  choice: Conserver l’expression traditionnelle «terre des vivants»
  alternative: Traduire explicitement «le tuer» ou «l’effacer du monde des vivants»
  rationale: L’expression désigne la sphère de la vie présente et implique la mort, mais il convient de préserver son imagerie biblique sans réduire le texte à une paraphrase.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au registre testamentaire. La métaphore grecque du «léchage complet» est répartie entre «faire disparaître» et la comparaison naturelle «comme un veau broute», afin de préserver à la fois le sens violent et l’image pastorale.
