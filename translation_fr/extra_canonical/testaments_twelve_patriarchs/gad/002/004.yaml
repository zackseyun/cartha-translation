reference: Testament of Gad 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: fr
  text: 'Ainsi, le Dieu de nos pères l’a délivré de nos mains, afin que nous ne commettions pas une grande transgression en Israël.[a]


    Et c’est ainsi que, sous l’effet de la cupidité, nous avons été pleinement convaincus de sa mise à mort.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte α donne cette phrase comme le verset 5; les autres témoins cités présentent à cet endroit la phrase qui suit comme le verset 4.
    reason: Signaler la divergence de tradition textuelle et de numérotation attestée par l’édition source.
  - marker: b
    text: 'Littéralement : « par la cupidité, nous avons été pleinement convaincus de sa mise à mort ».'
    reason: Préserver la construction grecque inhabituelle et l’ambiguïté de la relation entre la cupidité, la conviction et la mise à mort.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: a délivré
  rationale: Rend le sens de sauver ou d’arracher quelqu’un à un danger, ici explicitement « de nos mains », dans un registre biblique naturel.
- source_word: ἀνομίαν μεγάλην
  choice: une grande transgression
  rationale: « Transgression » conserve l’idée d’un acte contraire à la loi sans la réduire au seul statut de crime civil; l’adjectif « grande » traduit directement μεγάλην.
- source_word: πλεονεξίᾳ
  choice: sous l’effet de la cupidité
  rationale: Le datif exprime vraisemblablement la cause ou le moyen. Cette formulation française naturelle maintient la cupidité comme force déterminante.
- source_word: ἐπληροφορήθημεν
  choice: nous avons été pleinement convaincus
  rationale: Conserve la valeur passive et l’idée de pleine conviction de πληροφορέω, sans l’affaiblir en simple résolution.
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: de sa mise à mort
  rationale: ἀναίρεσις désigne ici l’action de tuer. « Mise à mort » est précis et digne, tout en évitant de déterminer juridiquement ou moralement le terme comme le ferait nécessairement « meurtre ».
theological_decisions:
- issue: Finalité de l’intervention divine
  choice: « afin que nous ne commettions pas »
  alternative: « pour nous empêcher de commettre »
  rationale: La traduction retenue suit directement ἵνα μὴ ποιήσωμεν et préserve la formulation selon laquelle la délivrance empêche une grave transgression en Israël, sans expliciter davantage le mode d’action divine.
- issue: Nature de l’ἀνομία
  choice: « transgression »
  alternative: « acte contraire à la Loi »
  rationale: « Transgression » garde ouverte la portée morale, communautaire et religieuse du mot, sans imposer que νόμος renvoie ici à un code déterminé.
translation_notes:
  register: Français international moderne, digne et lisible. La première phrase conserve une cadence biblique sobre. La seconde reste volontairement proche de la construction grecque, malgré sa tension sémantique. Les deux formes transmises sont présentées séparément, comme dans la couche de consultation anglaise, avec une note indiquant leur statut textuel.
