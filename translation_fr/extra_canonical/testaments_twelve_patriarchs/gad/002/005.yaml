source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[β, Α, S¹] 5. Καὶ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου, ἵνα μὴ²¹ ποιήσω ἀνόμημα²² ἐν Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/005.yaml
  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: fr
  text: Mais le Dieu de mes pères l’a délivré de mes mains, afin que je ne commette pas un acte contraire à la Loi en Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρύσατο
  choice: a délivré
  rationale: Rend naturellement l’idée d’arracher quelqu’un à un danger ou à une emprise, ici celle des mains du locuteur.
- source_word: ἐκ τῶν χειρῶν μου
  choice: de mes mains
  rationale: Conserve l’image concrète et idiomatique du grec.
- source_word: ἀνόμημα
  choice: un acte contraire à la Loi
  rationale: Exprime la transgression impliquée par le terme grec sans la réduire à une simple illégalité civile moderne.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Préserve la formulation collective et théologique du texte source.
theological_decisions:
- issue: Sens de ἀνόμημα
  choice: un acte contraire à la Loi
  alternative: un acte criminel / une faute
  rationale: La traduction retenue garde le lien lexical avec la loi tout en évitant d’imposer une qualification pénale moderne ou une catégorie doctrinale plus précise que le grec.
- issue: Valeur de ἵνα μή avec le subjonctif
  choice: afin que je ne commette pas
  alternative: de peur que je ne commette
  rationale: Le contexte présente la délivrance divine comme empêchant l’acte; la tournure finale française reflète directement cette relation sans résoudre davantage la question de l’intention ou du résultat.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement le grec tout en restant naturelle; l’expression «le Dieu de mes pères» conserve la couleur ancestrale et scripturaire de l’original.
