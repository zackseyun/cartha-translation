revisions:
- from: En effet, devant mon père, je parlais à Joseph de manière pacifique ; mais dès que je le quittais, l’esprit de haine obscurcissait mon intelligence et troublait mes pensées au point de vouloir le tuer.
  to: En effet, devant mon père, je parlais paisiblement à Joseph ; mais, lorsque je le quittais, l’esprit de haine obscurcissait mon intelligence et tournait mes pensées vers l’idée de le tuer.
  rationale: La révision supprime l’immédiateté ajoutée par « dès que » et évite d’attribuer explicitement un vouloir au locuteur. Elle conserve les imparfaits, l’ambiguïté de « l’esprit de haine », ainsi que le contraste entre le νοῦς obscurci et les λογισμοί orientés vers le meurtre.
