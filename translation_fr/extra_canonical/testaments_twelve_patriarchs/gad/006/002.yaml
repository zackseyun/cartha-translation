  text: 2. *Ἐγὼ γὰρ⁸ κατὰ πρόσωπον τοῦ πατρὸς μου⁹, εἰρηνικὰ¹⁰ ἐλάλουν τῷ Ἰωσήφ· *ἐξερχόμενος δὲ ἐξ αὐτοῦ¹¹ τὸ πνεῦμα *τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν¹², καὶ ἐτάρασσέ¹³ *μου τὸν λογισμόν¹⁴ *πρὸς τὸ¹⁵ ἀνελεῖν αὐτόν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: fr
  text: En effet, devant mon père, je parlais paisiblement à Joseph ; mais, lorsque je le quittais, l’esprit de haine obscurcissait mon intelligence et tournait mes pensées vers l’idée de le tuer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρός μου
  choice: devant mon père
  rationale: Rend naturellement l’expression grecque de présence immédiate, sans l’alourdir par un calque.
- source_word: εἰρηνικά
  choice: de manière pacifique
  rationale: Conserve la valeur adverbiale et l’idée de paroles paisibles, sans ajouter une notion de sincérité absente du grec.
- source_word: ἐξερχόμενος δὲ ἐξ αὐτοῦ
  choice: mais dès que je le quittais
  rationale: Expression française naturelle pour le fait de sortir d’auprès de Joseph ; l’imparfait s’accorde avec les verbes grecs décrivant le comportement répété ou caractéristique.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: l’esprit de haine
  rationale: Traduction directe qui préserve la possible personnification ou force spirituelle sans l’expliquer.
- source_word: τὸν νοῦν
  choice: mon intelligence
  rationale: Rend νοῦς comme faculté de discernement et de compréhension, tout en le distinguant de λογισμός.
- source_word: τὸν λογισμόν
  choice: mes pensées
  rationale: Rend le mouvement intérieur de la réflexion ou du raisonnement en français courant.
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: au point de vouloir le tuer
  rationale: Exprime naturellement l’orientation du trouble vers le meurtre ; « vouloir » explicite en français l’intention portée par les pensées, sans affirmer que l’acte a été accompli.
theological_decisions:
- issue: Nature de « l’esprit de haine »
  choice: Conserver littéralement « l’esprit de haine »
  alternative: la haine
  rationale: Le grec parle explicitement d’un πνεῦμα ; la traduction ne tranche pas entre personnification morale et réalité spirituelle.
- issue: Valeur aspectuelle des imparfaits ἐλάλουν, ἐσκότιζε et ἐτάρασσε
  choice: Employer les imparfaits « parlais », « obscurcissait » et « troublait »
  alternative: Employer le passé composé pour décrire une seule occasion
  rationale: L’imparfait grec peut présenter une action en cours ou habituelle ; le contexte autobiographique se prête à une conduite répétée, mais la formulation française reste compatible avec une scène décrite dans son déroulement.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le contraste entre les paroles pacifiques en présence du père et l’emprise de la haine hors de cette présence, tout en distinguant νοῦς (« intelligence ») de λογισμός (« pensées »).
