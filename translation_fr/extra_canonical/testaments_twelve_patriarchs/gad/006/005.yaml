  to: Ne laisse pas quelqu’un d’autre entendre ton secret au cours d’une querelle, de peur que, s’étant mis à te haïr, il ne devienne ton ennemi et ne commette un grand péché contre toi. Car souvent, il t’assassine par traîtrise ou t’entraîne dans de mauvaises actions, après avoir reçu de toi le poison.
