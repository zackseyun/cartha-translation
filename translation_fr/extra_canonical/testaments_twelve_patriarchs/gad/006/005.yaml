base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: fr
  text: Ne laisse pas quelqu’un d’autre entendre ton secret au cours d’une querelle, de peur que, s’étant mis à te haïr, il ne devienne ton ennemi et ne commette un grand péché contre toi. Car souvent, il t’assassine par traîtrise ou t’entraîne dans de mauvaises actions, après avoir reçu de toi le poison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλότριος
  choice: un étranger
  rationale: Le terme désigne une personne extérieure au cercle concerné, « un autre » ou « un étranger ». « Un étranger » conserve cette distance sans préciser davantage son identité.
- source_word: ἐν μάχῃ
  choice: au cours d’une querelle
  rationale: Dans ce contexte de divulgation d’un secret sous l’effet de l’hostilité, « querelle » rend naturellement μάχη sans suggérer nécessairement un combat armé.
- source_word: μυστήριόν σου
  choice: ton secret
  rationale: Ici μυστήριον désigne une confidence ou une information cachée, non un mystère cultuel.
- source_word: δολοφωνεῖ σε
  choice: il t’assassine par traîtrise
  rationale: Le verbe exprime l’idée de tuer perfidement ou par guet-apens; cette formulation conserve à la fois la mise à mort et la traîtrise.
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: t’entraîne dans le mal
  rationale: La tournure est difficile; ce rendu exprime l’action de mêler ou d’impliquer quelqu’un dans des choses mauvaises, en français idiomatique.
- source_word: λαβὼν ἀπό σου τὸν ἰόν
  choice: après avoir reçu de toi le poison
  rationale: Le participe marque l’antériorité ou la circonstance, et ἰός signifie littéralement « poison », image de l’hostilité communiquée par celui qui révèle son secret.
theological_decisions:
- issue: Sens causal et moral du « poison »
  choice: Conserver l’image littérale du poison reçu de la personne qui divulgue son secret
  alternative: Expliciter par « la haine » ou « le motif de nuire »
  rationale: Le grec maintient une métaphore forte et ne définit pas précisément le poison; l’expliciter réduirait l’ambiguïté morale du passage.
- issue: Grande faute commise « contre toi »
  choice: « commette un grand péché contre toi »
  alternative: « commette à ton égard une grave faute »
  rationale: ἁμαρτία porte ici une dimension morale forte; « péché » la préserve, tandis que « contre toi » rend le texte reçu ἐν σοί dans son sens relationnel probable.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe garde la progression d’avertissement du grec tout en divisant la longue période en deux phrases. Aucune note n’est ajoutée, puisque les difficultés peuvent être rendues directement sans imposer une interprétation confessionnelle.
