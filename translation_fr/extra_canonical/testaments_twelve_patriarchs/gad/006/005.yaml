review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’avertissement, la haine suivie de l’hostilité, le « grand péché » et l’image non explicitée du poison. Toutefois, ἀλλότριος signifie ici « un autre / quelqu’un d’extérieur », non nécessairement « un étranger » au sens d’une personne de nationalité étrangère. La révision corrige cette restriction indue. « Dans de mauvaises actions » rend plus explicitement le pluriel ἐν κακοῖς et l’idée d’être entraîné ou impliqué dans des maux.
  naturalness: La formulation révisée demeure naturelle dans un français moderne et conserve le registre proverbial et moral du passage. « Quelqu’un d’autre » évite l’ambiguïté moderne de « un étranger ».
  terminology: « Secret », « haïr », « ennemi », « grand péché » et « poison » conviennent. « Assassiner par traîtrise » maintient la force perfide de δολοφονεῖ. Aucune terminologie théologique confessionnelle n’est imposée.
  issues:
  - severity: medium
    issue: « un étranger » pour ἀλλότριος
    rationale: En contexte, le grec vise une autre personne, extérieure à la confidence ou au différend. Le français « un étranger » évoque couramment un étranger national ou une personne inconnue et restreint donc inutilement le référent.
  - severity: low
    issue: « dans le mal » pour ἐν κακοῖς
    rationale: Le singulier français est possible comme collectif, mais « dans de mauvaises actions » reflète mieux le pluriel grec et l’idée de maux concrets dans lesquels l’adversaire implique la victime.
  revised_text: Ne laisse pas quelqu’un d’autre entendre ton secret au cours d’une querelle, de peur que, s’étant mis à te haïr, il ne devienne ton ennemi et ne commette un grand péché contre toi. Car souvent, il t’assassine par traîtrise ou t’entraîne dans de mauvaises actions, après avoir reçu de toi le poison.
