source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VI. *Καὶ νῦν¹, τέκνα μου, Γπαραινῶ ὑμῖν⌉². ἀγαπᾶτε³ ἕκαστος *τὸν πλησίον⁴ αὑτοῦ⁵, καὶ ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν· ἀγαπήσατε⁶ ἀλλήλους⁷ ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, je vous exhorte : que chacun aime son prochain et ôtez la haine de vos cœurs. Aimez-vous les uns les autres en actes, en paroles et par la pensée de l’âme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  choice: je vous exhorte
  rationale: Rend le conseil pressant exprimé par le verbe grec dans un registre digne et naturel.
- source_word: τὸν πλησίον αὑτοῦ
  choice: son prochain
  rationale: Équivalent français établi et précis pour la personne qui est proche d’autrui.
- source_word: ἐξάρατε
  choice: arrachez
  rationale: Préserve la force du verbe, qui demande d’enlever complètement la haine plutôt que de simplement l’écarter.
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: par vos actes, vos paroles
  rationale: Formulation française idiomatique qui conserve les deux domaines concrets de l’amour mentionnés par le grec.
- source_word: διανοίᾳ ψυχῆς
  choice: les pensées de votre âme
  rationale: Conserve l’association grecque de la pensée et de l’âme sans la réduire à la seule intention.
theological_decisions:
- issue: Portée de l’amour demandé
  choice: son prochain, puis les uns les autres
  alternative: autrui dans les deux propositions
  rationale: La traduction maintient la variation du grec entre τὸν πλησίον αὑτοῦ et ἀλλήλους, sans en uniformiser la portée.
- issue: Sens de διανοίᾳ ψυχῆς
  choice: les pensées de votre âme
  alternative: l’intention de votre âme
  rationale: « Pensées » préserve mieux l’ouverture sémantique de διάνοια et évite de limiter le propos à la volonté ou à l’intention.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif singulier distributif « que chacun aime » est suivi des impératifs pluriels du grec. « Votre cœur » emploie le singulier collectif, naturel en français, pour le pluriel grec « vos cœurs ».
