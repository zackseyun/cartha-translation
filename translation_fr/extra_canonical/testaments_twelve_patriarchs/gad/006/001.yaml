revisions:
- from: 'Et maintenant, mes enfants, je vous exhorte : que chacun aime son prochain et arrache la haine de votre cœur. Aimez-vous les uns les autres par vos actes, vos paroles et les pensées de votre âme.'
  to: 'Et maintenant, mes enfants, je vous exhorte : que chacun aime son prochain et ôtez la haine de vos cœurs. Aimez-vous les uns les autres en actes, en paroles et par la pensée de l’âme.'
  rationale: 'Révision nécessaire pour corriger la structure verbale : après « que chacun aime », le grec emploie l’impératif pluriel « ôtez ». La dernière coordination est ajustée pour représenter les trois compléments grecs et maintenir l’ambiguïté de « pensée de l’âme ».'
