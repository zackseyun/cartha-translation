  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: fr
  text: Aimez-vous les uns les autres de tout cœur. Si quelqu’un pèche contre toi, adresse-lui des paroles de paix et ne garde pas de tromperie dans ton âme. S’il reconnaît sa faute et se repent, pardonne-lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’α-text porte : « s’il se repent et reconnaît sa faute ». Les témoins β/A/S¹ lisent : « s’il reconnaît sa faute et se repent » et ajoutent, après « adresse-lui des paroles de paix », « après avoir chassé le poison de la haine »; ils ont aussi « parle-lui en paix ».'
    reason: Signaler les variantes substantielles concernant la formulation de paix, l’ajout sur la haine et l’ordre entre repentir et aveu, sans les fusionner dans le texte.
lexical_decisions:
- source_word: Ἀγαπήσατε ἀλλήλους ἀπὸ καρδίας
  choice: Aimez-vous les uns les autres de tout cœur
  rationale: Rend naturellement l’amour réciproque et son origine intérieure; « de tout cœur » est idiomatique en français moderne.
- source_word: ἁμαρτήσει εἰς σέ
  choice: pèche contre toi
  rationale: Conserve la portée morale de ἁμαρτάνω et la relation personnelle exprimée par εἰς σέ.
- source_word: εἰπὲ αὐτῷ εἰρήνην / εἰπὲ αὐτῷ ἐν εἰρήνῃ
  choice: parle-lui dans un esprit de paix
  rationale: Formulation française naturelle qui couvre les deux leçons grecques, « dis-lui la paix » et « parle-lui en paix », sans transformer l’expression en simple salutation.
- source_word: δόλον
  choice: tromperie
  rationale: Préserve l’idée de duplicité ou de dessein frauduleux intérieur; « tromperie » reste clair pour le lectorat général.
- source_word: ὁμολογήσῃ / ὁμολογήσας
  choice: reconnaît sa faute
  rationale: Dans ce contexte interpersonnel, ὁμολογέω désigne l’aveu de la faute; cette formulation explicite naturellement le complément sous-entendu.
- source_word: μετανοήσας / μετανοήσῃ
  choice: se repent
  rationale: Rend la réorientation morale exprimée par μετανοέω avec le terme français courant dans un contexte éthique et religieux.
- source_word: ἄφες αὐτῷ
  choice: pardonne-lui
  rationale: Le contexte d’une faute reconnue appelle le sens de remise ou de pardon de ἀφίημι.
theological_decisions:
- issue: Ordre entre confession et repentance
  choice: S’il reconnaît sa faute et se repent
  alternative: S’il se repent et reconnaît sa faute
  rationale: Les témoins grecs présentent les deux ordres. Le texte retient l’ordre de la branche β/A/S¹, également représenté dans la couche anglaise, tandis que la note signale l’autre ordre sans en tirer de distinction théologique.
- issue: Variante longue sur l’expulsion du poison de la haine
  choice: Ne pas intégrer la proposition au corps du verset
  alternative: « après avoir chassé le poison de la haine »
  rationale: Cette proposition appartient à la branche β/A/S¹, mais manque dans l’α-text. Elle est conservée en note afin de ne pas construire un texte composite sans signalement.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier est conservé pour le destinataire de l’offense, tandis que l’impératif initial demeure collectif. La formulation évite les archaïsmes et maintient le vocabulaire moral du grec.
