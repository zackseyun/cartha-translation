  to: Aimez-vous les uns les autres de tout cœur. Si quelqu’un pèche contre toi, adresse-lui des paroles de paix et ne garde pas de tromperie dans ton âme. S’il reconnaît sa faute et se repent, pardonne-lui.[a]
  rationale: La révision rend plus directement l’injonction de paix et clarifie l’appareil de variantes. Elle conserve dans le texte l’ordre « aveu puis repentir », conforme à la branche β/A/S¹ et à l’audit anglais, tout en donnant explicitement en note l’ordre inverse de l’α-text et l’ajout propre à β/A/S¹.
