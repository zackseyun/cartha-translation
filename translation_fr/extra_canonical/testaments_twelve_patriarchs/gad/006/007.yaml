source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: fr
  text: Mais même s’il est effronté et persiste dans le mal, pardonne-lui malgré tout de tout ton cœur, et remets à Dieu la vengeance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: effronté
  rationale: Rend l’idée d’une personne sans honte ni retenue, dans un français naturel et actuel.
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: persiste dans le mal
  rationale: Conserve la construction et la portée générale de κακία sans la réduire à un tort particulier.
- source_word: ἀπὸ καρδίας
  choice: de tout ton cœur
  rationale: Expression française idiomatique qui garde l’idée d’un pardon sincère venant du cœur.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: remets à Dieu la vengeance
  rationale: Exprime naturellement l’acte de confier à Dieu l’exercice de la vengeance, tout en restant proche de l’impératif δός.
theological_decisions:
- issue: Rapport entre pardon humain et vengeance divine
  choice: remets à Dieu la vengeance
  alternative: donne à Dieu la vengeance
  rationale: '« Remets à Dieu » est plus idiomatique en français et préserve la tension du texte : pardonner personnellement sans nier que la vengeance relève de Dieu.'
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’insistance de καὶ οὕτως par « malgré tout » et évite un tour trop littéral ou ambigu avec « donner la vengeance ».
