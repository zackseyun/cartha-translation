source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: fr
  text: Mais s’il le nie et éprouve de la honte quand on le reprend, garde le silence ; ne le reprends pas. En effet, celui qui nie se repent d’avoir péché contre toi et, pris de crainte[a], il fait la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « pris de crainte » ont une attestation textuelle incertaine.
    reason: Dans l’édition grecque fournie, φοβηθείς figure entre crochets, signalant une incertitude critique.
lexical_decisions:
- source_word: αἰδεσθῇ
  choice: éprouve de la honte
  rationale: Rend le sentiment de honte ou de gêne exprimé par le verbe, sans lui donner artificiellement le sens de repentance.
- source_word: ἡσύχασον
  choice: garde le silence
  rationale: Dans ce contexte d’admonestation, l’impératif invite à cesser de parler ou d’intervenir ; cette formulation française est naturelle et cohérente avec l’interdiction qui suit.
- source_word: ἐλέγξῃς
  choice: reprends
  rationale: Conserve le sens de réprimander ou de reprendre quelqu’un pour sa faute, en français courant et digne.
- source_word: πλημμελῆσαι εἰς σέ
  choice: avoir péché contre toi
  rationale: La tournure désigne une faute commise envers la personne ; « péché contre toi » conserve la portée morale du grec.
- source_word: εἰρηνεύει
  choice: il fait la paix
  rationale: Rend ici l’idée d’adopter une conduite pacifique ou de se réconcilier, conformément au contexte relationnel.
theological_decisions:
- issue: Lien entre le déni de la faute et la repentance
  choice: celui qui nie se repent
  alternative: celui qui nie regrette sa faute
  rationale: La formulation paradoxale du grec est conservée sans expliquer ni harmoniser le rapport entre déni, honte et repentance.
- issue: Portée de φοβηθείς
  choice: pris de crainte
  alternative: par crainte
  rationale: La traduction garde le caractère général de la crainte, sans préciser indûment si elle vise Dieu, la réprimande ou les conséquences de la faute.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement du grec, tout en évitant une formulation artificielle. Le passage ne comporte pas la proposition « afin qu’il ne te fasse plus de tort », absente du texte grec fourni ; elle n’a donc pas été introduite depuis la couche anglaise.
