source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: fr
  text: Mais s’il le nie, ne te dispute pas avec lui, de peur que, lorsqu’il prête serment, tu ne pèches doublement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνεῖται
  choice: le nie
  rationale: Le verbe signifie ici nier le fait ou l’accusation évoqués dans le contexte; le pronom « le » conserve cette référence implicite.
- source_word: μὴ φιλονείκει αὐτῷ
  choice: ne te dispute pas avec lui
  rationale: φιλονικέω exprime l’idée de chercher querelle ou de s’engager dans une contestation; cette formulation est naturelle en français tout en gardant la portée de l’impératif.
- source_word: ὁμόσαντος αὐτοῦ
  choice: lorsqu’il prête serment
  rationale: Le participe aoriste au génitif absolu indique qu’il en vient à jurer; « prêter serment » rend explicitement et naturellement le sens de ὄμνυμι sans ajouter le contenu du serment.
- source_word: δισσῶς ἁμαρτάνεις
  choice: tu ne pèches doublement
  rationale: Rend directement l’adverbe δισσῶς et le présent ἁμαρτάνεις, en conservant la qualification morale et la tension du texte.
theological_decisions:
- issue: Responsabilité du destinataire dans le double péché
  choice: Conserver « tu ne pèches doublement » sans expliquer les deux fautes.
  alternative: Préciser que les deux péchés seraient la querelle et le fait d’avoir provoqué un serment.
  rationale: Le grec ne définit pas expressément les deux péchés; les expliciter dans le texte résoudrait une ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et accessible. Le tour « de peur que… tu ne » emploie le ne explétif standard après une expression de crainte; il ne renverse pas le sens. Aucun appel de note n’est requis.
