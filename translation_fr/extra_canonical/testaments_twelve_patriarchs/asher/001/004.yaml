source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Διὰ τοῦτο πάντα¹⁷ δύο¹⁸ εἰσίν¹⁹, ἐν κατέναντι τοῦ ἑνός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/004.yaml
  text: Therefore all things are twofold, one over against the other.
translation:
  language: fr
  text: C’est pourquoi toutes choses sont doubles et se font face l’une à l’autre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement la relation de conséquence exprimée par la locution grecque.
- source_word: πάντα δύο εἰσίν
  choice: toutes choses vont par deux
  rationale: Exprime en français courant que toute réalité se présente selon une dualité, sans surinterpréter la nature de celle-ci.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: l’une en face de l’autre
  rationale: Conserve l’idée spatiale et relationnelle d’éléments placés vis-à-vis l’un de l’autre; « l’une » s’accorde avec « choses ».
theological_decisions:
- issue: Nature de la dualité universelle
  choice: 'Formulation générale et relationnelle : « vont par deux »'
  alternative: « sont doubles » ou « ont deux aspects »
  rationale: Le grec affirme que toutes choses sont deux, mais ne précise pas s’il s’agit d’aspects, de voies ou de principes; la traduction préserve cette tension sans imposer une doctrine dualiste particulière.
translation_notes:
  register: Français moderne, clair et digne. La tournure idiomatique « vont par deux » évite le calque raide « sont deux », tandis que « en face de » conserve la force de κατέναντι. La révision anglaise signalée est manifestement étrangère au texte grec fourni et n’a pas été suivie.
