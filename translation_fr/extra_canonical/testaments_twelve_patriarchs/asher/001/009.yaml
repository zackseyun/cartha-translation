  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: fr
  text: Car, lorsqu’il commence à faire le bien, l’issue de l’acte le pousse vers le mal, puisque le trésor du dessein est rempli d’un esprit mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: faire le bien
  rationale: Rend directement l’expression grecque sans introduire l’idée absente de « faire le mal contre le bien ».
- source_word: τὸ τέλος τῆς πράξεως
  choice: l’aboutissement de l’acte
  rationale: « Aboutissement » exprime ici le résultat final de l’action, tandis que « acte » conserve le caractère concret de πρᾶξις.
- source_word: εἰς πονηρὸν αὐτῷ ἐλαύνει
  choice: le pousse vers le mal
  rationale: Conserve l’image dynamique de ἐλαύνει et comprend αὐτῷ comme désignant celui que l’issue entraîne au mal.
- source_word: θησαυρὸς
  choice: trésor
  rationale: Maintient la métaphore du dépôt intérieur ou de la réserve accumulée.
- source_word: διαβουλίου
  choice: dessein
  rationale: Le terme peut désigner une délibération, une résolution ou un projet intérieur ; « dessein » convient au contexte moral sans le surinterpréter.
- source_word: πονηροῦ πνεύματος
  choice: d’un esprit mauvais
  rationale: Respecte l’accord grammatical de πονηροῦ avec πνεύματος et évite une terminologie confessionnelle plus chargée.
- source_word: πεπλήρωται
  choice: est plein
  rationale: Le parfait passif peut décrire un état accompli ; le français « est plein » permet de conserver l’absence de complément explicite dans cette lecture de la construction.
theological_decisions:
- issue: Référent du sujet implicite dans « il commence »
  choice: Conserver le pronom « il » sans identifier davantage son référent
  alternative: Nommer explicitement le penchant, l’être humain ou l’esprit mauvais
  rationale: Le sujet est implicite dans le verset grec fourni ; le préciser imposerait une résolution dépendant du contexte ou d’une interprétation.
- issue: Rapport syntaxique de πονηροῦ πνεύματος
  choice: 'Le rattacher à διαβουλίου : « le dessein d’un esprit mauvais »'
  alternative: Comprendre l’esprit mauvais comme ce dont le trésor du dessein est rempli
  rationale: L’accord génitif de πονηροῦ πνεύματος favorise son rattachement à « dessein », mais la construction demeure assez compacte pour justifier la mention de l’autre lecture en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la syntaxe et des images grecques tout en étant lisible ; elle préserve l’ambiguïté du sujet implicite et signale en note l’incertitude de la dernière proposition.
