  terminology: « Faire le bien », « acte », « mal », « trésor », « dessein » et « esprit mauvais » sont des choix sobres et adaptés. « Esprit mauvais » conserve la portée non spécifiée de πονηρὸν πνεῦμα, sans imposer une identification doctrinale.
