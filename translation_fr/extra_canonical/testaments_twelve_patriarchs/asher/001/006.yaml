source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: fr
  text: Si donc l’âme veut bien se conduire, elle accomplit toutes ses actions dans la justice ; et même si elle pèche, elle se repent aussitôt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ψυχὴ
  choice: l’âme
  rationale: Correspondance directe et naturelle qui conserve la conception anthropologique du texte.
- source_word: θέλει
  choice: veut
  rationale: Rend directement la volonté exprimée par le verbe grec, sans l’intensifier.
- source_word: καλῶς πορευθῆναι
  choice: bien se conduire
  rationale: Littéralement « bien marcher » ; l’expression française choisie restitue naturellement le sens moral du déplacement métaphorique.
- source_word: πάσας τὰς πράξεις αὐτῆς ποιεῖ
  choice: elle accomplit toutes ses actions
  rationale: Préserve l’étendue de πάσας et le sens concret de πράξεις, dans une formulation française fluide.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Conserve le substantif théologique et moral δικαιοσύνη sans le réduire au seul adverbe « justement ».
- source_word: κἂν ἁμάρτῃ
  choice: même si elle pèche
  rationale: Rend la concession κἄν et conserve le vocabulaire explicite du péché.
- source_word: εὐθὺς μετανοεῖ
  choice: elle se repent aussitôt
  rationale: « Aussitôt » traduit la promptitude de εὐθύς, tandis que « se repent » rend le changement moral exprimé par μετανοεῖ.
theological_decisions:
- issue: Rapport entre conduite juste, péché et repentance
  choice: Conserver la possibilité que l’âme pèche tout en affirmant sa repentance immédiate
  alternative: Reformuler de manière à suggérer qu’une âme bien disposée ne pèche pas réellement
  rationale: La proposition concessive grecque maintient explicitement cette tension ; la traduction ne doit pas la résoudre.
translation_notes:
  register: Français moderne, clair et digne. « Bien se conduire » rend l’image idiomatique de la marche morale sans lourdeur littérale ; « dans la justice » conserve la portée éthique et théologique du grec.
