  text: Δίκαια *γὰρ λογιζομένη³¹ καὶ ἀπορρίπτουσα³² τὴν πονηρίαν ἀνατρέπει εὐθὺς τὸ κακόν³³, καὶ³⁴ ἐκριζοῖ³⁵ τὴν ἁμαρτίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: fr
  text: Car, en considérant ce qui est juste et en rejetant la méchanceté, elle renverse aussitôt le mal et déracine le péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια
  choice: ce qui est juste
  rationale: Le neutre pluriel substantivé désigne les choses justes ou ce qui est juste; cette formulation française est naturelle et conserve la portée générale.
- source_word: λογιζομένη
  choice: en considérant
  rationale: Le participe exprime ici l’action de prendre en compte ou de méditer; «considérant» reste proche du grec sans ajouter l’idée explicite de «pensées».
- source_word: ἀπορρίπτουσα τὴν πονηρίαν
  choice: en rejetant la méchanceté
  rationale: «Rejeter» rend directement l’idée de repousser ou d’écarter, tandis que «méchanceté» traduit la qualité morale de πονηρία.
- source_word: ἀνατρέπει εὐθὺς τὸ κακόν
  choice: elle renverse aussitôt le mal
  rationale: La formulation conserve la force de ἀνατρέπει et la valeur temporelle immédiate de εὐθύς.
- source_word: ἐκριζοῖ τὴν ἁμαρτίαν
  choice: déracine le péché
  rationale: «Déraciner» reproduit l’image forte du verbe grec, qui évoque l’extraction jusque dans les racines.
theological_decisions:
- issue: Référent du sujet féminin sous-entendu
  choice: Maintien du pronom «elle» sans explicitation
  alternative: Nommer explicitement la bonne inclination ou la pensée, selon le contexte antérieur
  rationale: Les participes féminins et les verbes ont un sujet repris du contexte, mais le verset isolé ne le nomme pas. L’expliciter ici risquerait de résoudre une référence contextuelle sans preuve suffisante.
translation_notes:
  register: Français international moderne, clair et digne. La structure participiale et la progression rhétorique du grec sont conservées sans lourdeur excessive.
