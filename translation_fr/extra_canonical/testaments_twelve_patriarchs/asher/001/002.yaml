base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/002.yaml
  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: fr
  text: 'En effet, alors qu’il était en bonne santé, il leur dit : « Écoutez votre père, enfants d’Aser, et je vous montrerai tout ce qui est droit devant Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: Alors qu’il était encore en bonne santé
  rationale: Le participe présent indique l’état d’Aser au moment où il parle. « En bonne santé » rend naturellement le sens physique de ὑγιαίνω dans ce contexte.
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: L’impératif aoriste appelle les enfants à prêter attention à l’enseignement qui suit.
- source_word: πᾶν τὸ εὐθὲς
  choice: tout ce qui est droit
  rationale: Cette formulation conserve la portée générale de πᾶν et la valeur morale de εὐθύς sans préciser davantage que le grec.
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: devant Dieu
  rationale: Expression française naturelle qui préserve l’idée d’une rectitude évaluée en présence de Dieu ou à ses yeux.
- source_word: ὑποδείξω
  choice: je vous montrerai
  rationale: Rend directement le futur grec et peut englober ici l’idée d’exposer ou de faire connaître.
theological_decisions:
- issue: Nature de ce qui est « droit »
  choice: tout ce qui est droit devant Dieu
  alternative: tout ce qui est juste aux yeux de Dieu
  rationale: « Droit » suit plus étroitement εὐθές et maintient la tension entre conduite droite et jugement divin, sans réduire le terme à une catégorie juridique.
translation_notes:
  register: Français moderne, clair et digne. La construction vocative « enfants d’Aser » est conservée, et « votre père » demeure en apposition comme dans le grec, malgré son caractère légèrement solennel.
