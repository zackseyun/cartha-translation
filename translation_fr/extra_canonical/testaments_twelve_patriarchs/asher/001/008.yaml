base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: fr
  text: 'Mais si l’intention penche vers le mal, toutes ses actions sont dans la méchanceté : elle repousse le bien, s’attache au mal et est dominée par Béliar. Même si elle fait quelque chose de bien, elle le change en mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: l’intention
  rationale: Le terme désigne ici le dessein ou l’orientation délibérée intérieure; « intention » est naturel en français et conserve cette dimension volitive.
- source_word: ἐν πονηρίᾳ
  choice: dans la méchanceté
  rationale: Cette formulation garde la valeur morale de πονηρία et l’idée que les actes s’inscrivent dans le mal, sans réduire le terme à leur seul résultat.
- source_word: προσκολλώμενος τὸ κακόν
  choice: s’attache au mal
  rationale: « S’attacher » rend l’idée d’adhésion forte exprimée par προσκολλάω dans un français idiomatique.
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: tombe sous la domination de Béliar
  rationale: La tournure exprime clairement la soumission à l’autorité de Béliar portée par le passif de κυριεύω.
- source_word: μεταστρέφει
  choice: change
  rationale: Dans ce contexte, le verbe indique que le bien est détourné et transformé en mal; « change en » est direct et accessible.
theological_decisions:
- issue: Agent des participes et des verbes au féminin dans un texte dont la transmission présente des difficultés syntaxiques
  choice: Faire de « l’intention » l’agent continu de « repousse », « s’attache », « tombe » et « change »
  alternative: Rendre les participes de façon impersonnelle ou faire de la personne humaine leur agent explicite
  rationale: Le féminin αὐτῆς et la continuité de la proposition permettent de rapporter l’action à l’intention; cette solution préserve la personnification du dessein sans ajouter un sujet absent du grec.
- issue: Portée de κἂν ἀγαθὸν πράξει
  choice: « Même si elle fait quelque chose de bien »
  alternative: « Et si jamais elle accomplit le bien »
  rationale: κἄν introduit ici une concession; la traduction maintient la tension selon laquelle une action extérieurement bonne peut être détournée par une intention mauvaise.
translation_notes:
  register: Français moderne, international et dignifié. La phrase a été légèrement segmentée pour la lisibilité tout en conservant l’enchaînement moral du grec et la personnification de l’intention.
