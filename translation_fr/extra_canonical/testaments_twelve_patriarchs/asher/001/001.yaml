  text: The testament of Asher, the tenth son of Jacob and Zilpah. The copy of the testament of Asher, which he spoke to his sons in the one hundred and twenty-fifth year of his life.
translation:
  language: fr
  text: 'Testament d’Aser, dixième fils de Jacob et de Zilpa.


    1 Voici une copie du testament d’Aser, qu’il adressa à ses fils dans la cent vingt-cinquième année de sa vie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans ce titre, le mot désigne les dernières paroles et dispositions attribuées au patriarche ; « testament » rend naturellement le genre littéraire.
- source_word: Ἀντίγραφον
  choice: copie
  rationale: Rend directement l’idée d’une transcription ou reproduction écrite.
- source_word: ἐλάλησε τοῖς υἱοῖς αὐτοῦ
  choice: qu’il adressa à ses fils
  rationale: Formulation française naturelle qui conserve le caractère oral de la déclaration sans suggérer une simple conversation.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: dans la cent vingt-cinquième année de sa vie
  rationale: Reproduit précisément la manière grecque de situer l’événement au cours de sa 125e année, plutôt que d’affirmer simplement qu’il avait 125 ans.
