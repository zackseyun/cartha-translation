source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὁδοὶ *⌜γὰρ⌝ εἰσὶ²⁰ δύο, καλοῦ καὶ κακοῦ· ἐν οἷς²¹ εἰσι τὰ δύο²² διαβούλια ἐν στέρνοις²³ ἡμῶν²⁴ *διακρίνοντα αὐτά²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: fr
  text: Car il y a deux voies, celle du bien et celle du mal ; et en elles se trouvent les deux desseins qui sont dans nos cœurs et qui les distinguent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: voies
  rationale: « Voies » conserve l’image morale traditionnelle du grec tout en restant naturel en français.
- source_word: καλοῦ καὶ κακοῦ
  choice: du bien et du mal
  rationale: Le contexte oppose des catégories morales ; cette formulation rend clairement les génitifs grecs.
- source_word: διαβούλια
  choice: intentions
  rationale: Le terme désigne des desseins, résolutions ou orientations intérieures. « Intentions » est courant et préserve la dimension volontaire sans imposer une psychologie trop technique.
- source_word: ἐν στέρνοις ἡμῶν
  choice: dans nos cœurs
  rationale: Littéralement « dans nos poitrines ». En français actuel, « dans nos cœurs » exprime naturellement le siège intérieur de la volonté et de la réflexion visé ici.
- source_word: διακρίνοντα αὐτά
  choice: qui […] les distinguent
  rationale: La traduction garde le participe actif et son pronom objet. L’antécédent exact de « les » demeure celui suggéré par le texte grec, sans explicitation doctrinale.
theological_decisions:
- issue: Rapport entre les deux voies et les deux intentions intérieures
  choice: Conserver la formulation selon laquelle les intentions distinguent les voies
  alternative: Comprendre que les intentions sont elles-mêmes discernées ou séparées
  rationale: Le grec transmis porte un participe actif, διακρίνοντα, accordé au neutre pluriel διαβούλια ; la traduction suit donc cette syntaxe tout en laissant subsister la tension conceptuelle.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule maintient le parallélisme de la phrase grecque. « Cœurs » privilégie l’équivalence idiomatique à la traduction anatomique « poitrines ».
