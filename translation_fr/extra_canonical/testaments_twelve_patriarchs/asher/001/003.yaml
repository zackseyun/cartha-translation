source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δύο ὁδοὺς *ἔδωκεν ὁ Θεὸς τοῖς υἱοῖς τῶν ἀνθρώπων¹⁴, καὶ δύο διαβούλια, ⌜καὶ δύο πράξεις, *καὶ δύο τρόπους¹⁵⌝, *καὶ ⌜δύο⌝ τέλεα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: fr
  text: Dieu a donné aux êtres humains deux voies, deux desseins, deux actions, deux manières d’agir et deux fins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aux êtres humains
  rationale: L’expression sémitisante signifie collectivement les humains; cette formulation naturelle en français moderne conserve sa portée universelle.
- source_word: ὁδοὺς
  choice: voies
  rationale: « Voies » conserve l’image morale structurante des deux chemins.
- source_word: διαβούλια
  choice: desseins
  rationale: Le terme désigne des projets, intentions ou délibérations; « desseins » garde cette amplitude sans imposer le seul sens de pensée.
- source_word: πράξεις
  choice: sortes d’actions
  rationale: « Actions » rend directement le grec; l’ajout de « sortes de » fait comprendre que le texte oppose deux catégories d’actes plutôt que deux actes isolés.
- source_word: τρόπους
  choice: manières d’agir
  rationale: Le mot peut désigner des manières, comportements ou dispositions; dans cette série morale, « manières d’agir » est clair sans se confondre avec les « voies ».
- source_word: τέλεα
  choice: aboutissements
  rationale: Le pluriel neutre renvoie aux fins, résultats ou accomplissements; « aboutissements » préserve ici l’idée d’issue sans affirmer exclusivement un but intentionnel.
theological_decisions:
- issue: Portée de la dualité morale
  choice: Conserver la série parallèle de cinq réalités opposées sans préciser leur nature dans ce verset.
  alternative: Qualifier explicitement chaque élément de « bon » ou de « mauvais ».
  rationale: Le grec énumère deux voies, desseins, actions, manières et fins, mais n’explicite pas encore leurs qualités; les ajouter résoudrait prématurément la tension du passage.
- issue: Genre de « fils des hommes »
  choice: Employer le collectif inclusif « êtres humains ».
  alternative: Traduire littéralement « fils des hommes ».
  rationale: L’expression grecque d’arrière-plan sémitique vise l’humanité, non les seuls hommes de sexe masculin; la traduction choisie transmet son sens référentiel sans particularisme doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « deux » et la structure cumulative du grec sont maintenues. La révision fournie dans les métadonnées a été écartée, car elle correspond manifestement à un autre verset et contredit le texte grec cité.
