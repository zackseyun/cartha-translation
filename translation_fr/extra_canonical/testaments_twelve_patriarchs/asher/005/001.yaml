source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: fr
  text: 'Voyez, mes enfants, comment il y en a deux en toutes choses, l’une opposée à l’autre, et l’une cachée sous l’autre : dans la création, l’avidité ; dans la réjouissance, l’ivresse ; dans le rire, le chagrin ; dans le mariage, la débauche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Voyez
  rationale: Impératif direct et naturel, qui conserve l’appel à observer ou à considérer.
- source_word: τέκνα
  choice: mes enfants
  rationale: Le grec signifie littéralement « enfants » ; « mes » est implicite dans l’adresse paternelle et rend l’apostrophe naturelle en français.
- source_word: δύο
  choice: deux réalités
  rationale: Le substantif est sous-entendu en grec. « Réalités » évite le français abrupt « deux » tout en préservant l’indétermination de ce qui est mis par paires.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Rend fidèlement la portée générale de l’expression grecque.
- source_word: κατέναντι
  choice: opposée à
  rationale: Exprime l’idée de position face à face et, dans ce contexte, d’opposition.
- source_word: ὑπὸ ... κέκρυπται
  choice: cachée sous
  rationale: Conserve l’image spatiale du grec plutôt que de l’interpréter comme une simple dissimulation « derrière » l’autre.
- source_word: κτίσει
  choice: création
  rationale: Sens lexical direct de κτίσις dans le texte transmis ; la formulation inhabituelle est conservée plutôt que corrigée conjecturalement en « acquisition de richesses ».
- source_word: πλεονεξία
  choice: avidité
  rationale: Désigne le désir d’avoir toujours davantage, souvent avec la nuance de cupidité ; « avidité » convient à la généralité du propos.
- source_word: εὐφροσύνῃ
  choice: réjouissance
  rationale: Évoque la joie festive et s’accorde avec le contraste de l’ivresse.
- source_word: μέθη
  choice: ivresse
  rationale: Équivalent direct désignant l’état ou la pratique liée à l’alcool.
- source_word: πένθος
  choice: chagrin
  rationale: Rend la peine ou le deuil caché dans le rire sans imposer exclusivement le contexte funéraire.
- source_word: ἀσωτία
  choice: débauche
  rationale: Rend l’inconduite dissolue évoquée par le terme, ici mise en contraste avec le mariage.
theological_decisions:
- issue: Nature des deux éléments présents « en toutes choses »
  choice: Ne pas les identifier explicitement comme deux voies, deux esprits ou deux inclinations
  alternative: Traduire « deux voies » ou « deux tendances »
  rationale: Le grec laisse le nom sous-entendu. Ajouter une catégorie précise résoudrait une ambiguïté réelle du texte.
- issue: Le couple inhabituel « dans la création, l’avidité »
  choice: Conserver « création »
  alternative: Adopter une conjecture telle que « acquisition de richesses »
  rationale: Le texte grec fourni porte κτίσει. La traduction respecte cette leçon même si le rapport avec l’avidité demeure difficile.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle et la ponctuation en série reproduisent le mouvement sentencieux du grec. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est fournie.
