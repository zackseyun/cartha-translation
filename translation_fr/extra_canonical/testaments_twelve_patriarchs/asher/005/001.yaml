  source_fidelity: 'Le texte grec affirme littéralement qu’« il y en a deux en toutes choses », sans nommer la nature de ces deux éléments. La série finale et ses termes principaux sont correctement rendus : κτίσει par « création », πλεονεξία par « avidité », μέθη par « ivresse », πένθος par « chagrin » et ἀσωτία par « débauche ».'
  naturalness: La phrase est globalement fluide et conserve le parallélisme sentencieux. Toutefois, « deux réalités » précise indûment un substantif que le grec laisse absent ; « il y en a deux » est à la fois idiomatique et plus fidèle à cette indétermination.
  terminology: « Création » doit être conservé, malgré le caractère énigmatique de l’association avec l’avidité, car κτίσις est la leçon du texte fourni. Les autres termes relèvent d’un registre moderne et sobre approprié.
