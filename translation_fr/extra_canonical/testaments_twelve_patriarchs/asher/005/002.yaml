source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: fr
  text: 'La mort succède à la vie, le déshonneur à la gloire, la nuit au jour, l’obscurité à la lumière. Mais tout relève du jour : ce qui est juste relève de la vie, et ce qui est injuste, de la mort¹. C’est pourquoi la vie éternelle attend aussi la mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαδέχεται
  choice: succède à
  rationale: Rend directement l’idée de succession exprimée par le verbe grec, tout en conservant le parallélisme de la phrase.
- source_word: ἡ ἀτιμία
  choice: le déshonneur
  rationale: Correspond au contraste avec « la gloire » et garde la portée abstraite du nom grec.
- source_word: ὑπὸ ἡμέραν εἰσίν
  choice: relèvent du jour
  rationale: Expression française naturelle qui conserve l’idée d’être placé sous le domaine ou l’autorité du jour, sans introduire une localisation physique.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: ce qui est juste / ce qui est injuste
  rationale: Les adjectifs neutres substantivés désignent littéralement les réalités ou choses justes et injustes; cette formulation préserve mieux leur genre grammatical et leur portée que « les justes / les injustes ».
- source_word: ἀναμένει
  choice: attend
  rationale: Traduction directe qui maintient l’image étonnante selon laquelle la vie éternelle attend la mort, sans l’expliquer ni l’atténuer.
theological_decisions:
- issue: Sens de « la vie éternelle attend aussi la mort »
  choice: Conserver littéralement la formulation paradoxale
  alternative: 'Interpréter : « après la mort vient aussi la vie éternelle »'
  rationale: Le grec fait de « la vie éternelle » le sujet et de « la mort » l’objet; la traduction garde donc cette tension eschatologique sans imposer une paraphrase doctrinale.
- issue: Référent de τὰ δίκαια et τὰ ἄδικα
  choice: « ce qui est juste » et « ce qui est injuste »
  alternative: « les justes » et « les injustes »
  rationale: Le neutre pluriel grec favorise une référence aux choses, actes ou réalités justes et injustes. La formulation choisie maintient cette ambiguïté plutôt que de la limiter explicitement aux personnes.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme sentencieux du grec est préservé. « Relèvent de » évite le calque peu naturel « sont sous le jour » tout en maintenant la métaphore des domaines opposés.
