  source_fidelity: 'Le parallélisme et les rapports de succession de διαδέχεται sont bien rendus. « Relève de » exprime de façon idiomatique le classement ou la dépendance suggéré par ὑπό, sans surinterprétation. « Ce qui est juste / injuste » préserve convenablement la portée non personnelle des neutres substantivés τὰ δίκαια / τὰ ἄδικα. Une note textuelle est toutefois nécessaire : la proposition relative aux réalités injustes est imprimée entre crochets dans l’édition source.'
  naturalness: Le français est fluide et conserve le ton sentencieux. « L’obscurité » rend plus exactement le singulier grec τὸ σκότος que « les ténèbres », tout en restant naturel dans ce parallélisme.
  terminology: « Déshonneur », « gloire », « vie éternelle » et « mort » sont précis et ne chargent pas le texte d’une interprétation doctrinale. La formulation paradoxale finale est correctement maintenue.
