  to: 'La mort succède à la vie, le déshonneur à la gloire, la nuit au jour, l’obscurité à la lumière. Mais tout relève du jour : ce qui est juste relève de la vie, et ce qui est injuste, de la mort¹. C’est pourquoi la vie éternelle attend aussi la mort.'
  rationale: La révision remplace le pluriel interprétatif « les ténèbres » par le singulier « l’obscurité », qui correspond à τὸ σκότος. Elle ajoute une note textuelle à la proposition que l’édition source imprime entre crochets. Le reste de la traduction est conservé, notamment « relève de » et la conclusion paradoxale, qui sont à la fois fidèles et naturels en français moderne.
