source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: fr
  text: J’ai donc éprouvé toutes ces choses au cours de ma vie. Je ne me suis pas écarté de la vérité du Seigneur, et j’ai recherché de toutes mes forces les commandements du Très-Haut, tout en marchant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: j’ai éprouvé
  rationale: Le verbe exprime ici l’idée de mettre à l’épreuve et de vérifier par l’expérience; « éprouvé » conserve cette portée dans un français digne et naturel.
- source_word: ἐπλανήθην ἀπό
  choice: je ne me suis pas écarté de
  rationale: Cette formulation rend le mouvement d’égarement loin de la vérité sans ajouter une interprétation doctrinale.
- source_word: ἐξεζήτησα
  choice: j’ai recherché
  rationale: « Rechercher » restitue l’effort soutenu suggéré par le verbe grec renforcé, sans surtraduire.
- source_word: κατὰ πᾶσαν ἰσχύν μου
  choice: de toutes mes forces
  rationale: Expression française courante et fidèle pour indiquer que la recherche mobilise toute la force du locuteur.
- source_word: πορευόμενος
  choice: tout en marchant
  rationale: Le participe est conservé avec son image de marche et sa relation simultanée à l’action principale, sans le réduire explicitement à la seule conduite morale.
theological_decisions:
- issue: Rapport entre la vérité du Seigneur et les commandements du Très-Haut
  choice: Conserver les deux désignations et leur coordination
  alternative: Fusionner les deux propositions en présentant les commandements comme une définition de la vérité
  rationale: Le grec coordonne les idées sans affirmer explicitement qu’elles sont identiques; la traduction préserve cette tension.
- issue: Portée de l’expression « de toutes mes forces »
  choice: La rattacher principalement à la recherche des commandements
  alternative: La rattacher à la marche
  rationale: Sa position après ἐξεζήτησα favorise ce rattachement, tout en maintenant séparément le participe « tout en marchant ».
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation allège la longue coordination grecque tout en maintenant l’enchaînement logique. Aucun marqueur de note n’est requis.
