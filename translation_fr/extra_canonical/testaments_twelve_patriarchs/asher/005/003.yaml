source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: fr
  text: Et l’on ne peut appeler la vérité mensonge, ni ce qui est juste injuste, car toute vérité est sous la lumière, comme toutes choses sont sous Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: appeler
  rationale: Dans cette construction à double accusatif, « appeler » exprime naturellement le fait de qualifier la vérité de mensonge.
- source_word: τὸ δίκαιον
  choice: ce qui est juste
  rationale: Le neutre substantivé désigne ce qui est juste ou conforme à la justice, sans imposer le sens plus étroit d’une personne juste.
- source_word: ὑπὸ τοῦ φωτός
  choice: sous la lumière
  rationale: Conserve l’image spatiale et la formulation inhabituelle du grec, sans l’interpréter comme « dans la lumière » ou « éclairée par la lumière ».
- source_word: ὑπὸ τοῦ Θεοῦ
  choice: sous Dieu
  rationale: Reproduit le parallélisme avec « sous la lumière » et préserve l’idée de dépendance ou de souveraineté sans l’expliciter davantage.
theological_decisions:
- issue: Rapport entre la vérité, la lumière et Dieu
  choice: Maintien littéral de « sous la lumière » et « sous Dieu »
  alternative: « toute vérité relève de la lumière, comme toutes choses relèvent de Dieu »
  rationale: Le grec laisse ouverte la nature précise de ce rapport. La traduction conserve cette tension et le parallélisme au lieu de préciser une relation d’origine, d’autorité ou d’appartenance.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le parallélisme rhétorique du grec et son image volontairement singulière.
