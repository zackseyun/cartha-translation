  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: fr
  text: Vous donc, mes enfants, gardez la loi du Seigneur ; ne considérez pas le mal comme un bien, mais tournez plutôt vos regards vers le bien véritable, et préservez-le dans tous les commandements du Seigneur, en vous tournant vers lui et en vous reposant en lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε / διατηρεῖτε
  choice: gardez / gardez-le en observant
  rationale: Le premier impératif appelle à garder la loi; le second à conserver le bien véritable dans la pratique de tous les commandements. La légère explicitation «en observant» rend naturelle la construction française sans effacer la répétition grecque.
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: Ne prêtez pas attention au mal comme s’il était bien
  rationale: προσέχω exprime l’attention portée à quelque chose; «comme s’il était bien» traduit clairement la valeur comparative de ὡς καλῷ.
- source_word: τὸ ὄντως καλόν
  choice: ce qui est véritablement bien
  rationale: ὄντως souligne la réalité ou l’authenticité du bien, en contraste avec le mal présenté comme bien.
- source_word: ἀποβλέπετε
  choice: fixez plutôt vos regards sur
  rationale: Le verbe désigne le fait de regarder attentivement vers une réalité prise pour visée.
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: tournez-vous vers lui
  rationale: Dans ce contexte directionnel, εἰς favorise l’idée de se tourner vers le bien; cette lecture évite le calque peu naturel «se conduire en lui».
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: trouvez en lui votre repos
  rationale: καταπαύω évoque le repos ou la cessation; cette formulation française conserve la force positive de l’image.
theological_decisions:
- issue: Référent des pronoms αὐτό / αὐτῷ
  choice: Le bien véritable, repris par «le» puis «lui»
  alternative: La loi du Seigneur ou l’ensemble des commandements
  rationale: Le neutre singulier renvoie le plus naturellement à τὸ ὄντως καλόν, également neutre singulier. Le texte maintient ainsi le bien véritable comme objet à garder, orientation et lieu figuré de repos.
- issue: Rapport entre le bien véritable et les commandements
  choice: Le bien est gardé par l’observation de tous les commandements du Seigneur
  alternative: Le bien serait gardé à l’intérieur de chaque commandement sans explicitation pratique
  rationale: «en observant» exprime idiomatiquement la portée de ἐν πάσαις ταῖς ἐντολαῖς tout en maintenant leur lien étroit, sans identifier de façon réductrice le bien à une doctrine particulière.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse familiale «mes enfants» et l’impératif moral sont conservés. Les images du regard, de l’orientation et du repos restent perceptibles, avec une syntaxe française fluide.
