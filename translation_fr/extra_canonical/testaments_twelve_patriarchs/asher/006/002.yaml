source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: fr
  text: Car ceux qui ont deux visages sont doublement punis, parce qu’ils font le mal et approuvent ceux qui le font, imitant les esprits de l’égarement et luttant contre les êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ διπρόσωποι
  choice: les gens à double face
  rationale: Rend littéralement l’image grecque de la « double face », qui désigne ici des personnes duplices, tout en restant compréhensible en français courant.
- source_word: δισσῶς κολάζονται
  choice: sont punis doublement
  rationale: Conserve le parallélisme lexical entre διπρόσωποι et δισσῶς ainsi que le sens judiciaire de κολάζονται.
- source_word: συνευδοκοῦσι
  choice: ils approuvent
  rationale: Exprime l’assentiment donné aux actes de ceux qui font le mal, sans ajouter l’idée plus forte de participation directe.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: les esprits de l’égarement
  rationale: « Égarement » préserve la portée de πλάνη, qui peut évoquer à la fois l’erreur, la tromperie et le fait de détourner du droit chemin.
- source_word: συναγωνιζόμενοι
  choice: luttant avec eux
  rationale: Le préverbe συν- indique qu’ils combattent de concert avec les esprits qu’ils imitent; l’ajout explicite de « avec eux » rend cette nuance naturelle en français.
- source_word: τῶν ἀνθρώπων
  choice: les êtres humains
  rationale: Rend le pluriel générique ἄνθρωποι de manière inclusive et précise.
theological_decisions:
- issue: Nature des « esprits de l’égarement »
  choice: Conserver l’expression sans en préciser davantage l’identité
  alternative: les esprits trompeurs / les mauvais esprits
  rationale: Le grec présente ces esprits comme liés à πλάνη, mais ne les identifie pas plus précisément; la traduction évite donc une interprétation démonologique supplémentaire.
- issue: Lien de συναγωνιζόμενοι avec les esprits
  choice: Comprendre qu’ils luttent aux côtés des esprits contre les êtres humains
  alternative: ils rivalisent contre les êtres humains
  rationale: La construction et le préverbe συν- favorisent l’idée d’une action menée conjointement, dans la continuité de « imitant les esprits ».
translation_notes:
  register: Français moderne, digne et accessible. La reprise « non seulement… mais encore » explicite naturellement la corrélation καὶ… καὶ. L’image inhabituelle « à double face » est conservée afin de préserver le jeu rhétorique grec avec « doublement ».
