revisions:
- from: Car les gens à double face sont punis doublement, parce que non seulement ils font le mal, mais encore ils approuvent ceux qui le font, imitant ainsi les esprits de l’égarement et luttant avec eux contre les êtres humains.
  to: Car ceux qui ont deux visages sont doublement punis, parce qu’ils font le mal et approuvent ceux qui le font, imitant les esprits de l’égarement et luttant contre les êtres humains.
  rationale: La révision supprime l’explicitation non marquée du partenaire impliqué par συναγωνιζόμενοι, afin de ne pas imposer une lecture syntaxique ou théologique. Elle améliore aussi l’idiomaticité française tout en préservant le parallélisme rhétorique entre les « deux visages » et la punition « doublement » infligée.
  reviewer_model: gpt-5.6-terra
