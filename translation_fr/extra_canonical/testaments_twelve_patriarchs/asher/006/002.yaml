review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : les personnes duplices reçoivent une punition double, font le mal, approuvent ceux qui le font, imitent les esprits de l’égarement et s’opposent aux êtres humains. Toutefois, « avec eux » n’est pas exprimé explicitement dans le grec. Le composé συναγωνιζόμενοι peut suggérer une action concertée, mais le texte ne précise pas le partenaire de cette action ; l’ajout lève une ambiguïté que la traduction doit conserver.'
  naturalness: « Les gens à double face » est compréhensible, mais peu idiomatique en français moderne. « Ceux qui ont deux visages » est plus naturel tout en gardant l’image grecque et son écho avec « doublement ».
  terminology: '« Esprits de l’égarement » est un bon rendu non doctrinal de τὰ πνεύματα τῆς πλάνης. « Êtres humains » rend adéquatement le pluriel générique τῶν ἀνθρώπων. Aucune note de bas de page n’est nécessaire dans l’état des données fournies : les signes critiques de l’édition source ne sont pas accompagnés de leur contenu.'
  issues:
  - severity: medium
    issue: Ajout de « avec eux »
    rationale: Le grec porte συναγωνιζόμενοι κατὰ τῶν ἀνθρώπων, « luttant/combattant contre les êtres humains ». Bien que συν- puisse évoquer une action commune, aucun complément ne désigne explicitement les esprits comme compagnons de lutte. « Avec eux » impose donc une lecture possible au lieu de préserver l’ambiguïté.
  - severity: low
    issue: Formulation « les gens à double face »
    rationale: Cette expression est moins naturelle que « ceux qui ont deux visages » dans un français moderne international. La révision conserve l’image de duplicité sans introduire le terme interprétatif « hypocrites ».
  revised_text: Car ceux qui ont deux visages sont doublement punis, parce qu’ils font le mal et approuvent ceux qui le font, imitant les esprits de l’égarement et luttant contre les êtres humains.
