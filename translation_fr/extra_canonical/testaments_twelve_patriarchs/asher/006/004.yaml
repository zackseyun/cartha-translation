revisions:
- from: En effet, la fin de chaque être humain[a] révèle sa justice[b], et elle est connue des anges du Seigneur comme de ceux de Béliar[c].
  to: Car les fins des êtres humains[a] révèlent leur justice[b], et elles sont connues des anges du Seigneur et de ceux de Béliar[c].
  rationale: La révision rétablit les pluriels du grec et emploie un connecteur plus direct, tout en conservant l’explicitation française nécessaire de l’ellipse « [anges] de Béliar ». Les notes restent ancrées aux mêmes éléments et signalent les ambiguïtés pertinentes sans les trancher doctrinalement.
