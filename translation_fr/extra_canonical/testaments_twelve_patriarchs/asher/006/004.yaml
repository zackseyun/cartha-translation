  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: fr
  text: Car les fins des êtres humains[a] révèlent leur justice[b], et elles sont connues des anges du Seigneur et de ceux de Béliar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fins des êtres humains » ; l’expression peut désigner leur issue finale ou la manière dont leur vie s’achève.'
    reason: La note explicite le pluriel grec et l’éventail sémantique de τέλη.
  - marker: b
    text: 'Ou : « leur droiture » ; le mot grec peut désigner la justice morale ou la conduite juste.'
    reason: δικαιοσύνη admet plusieurs nuances proches qu’il ne faut pas réduire silencieusement.
  - marker: c
    text: 'Littéralement : « aux anges du Seigneur et de Béliar », c’est-à-dire aux anges appartenant respectivement au Seigneur et à Béliar.'
    reason: La construction grecque elliptique sous-entend un second groupe d’anges et ne fait pas de Béliar lui-même le destinataire.
lexical_decisions:
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: la fin de chaque être humain
  rationale: Le pluriel grec « les fins des êtres humains » est rendu par une tournure distributive naturelle en français, sans réduire nécessairement le terme au seul instant de la mort.
- source_word: δεικνύουσι
  choice: révèle
  rationale: Le verbe signifie montrer ou manifester; « révèle » exprime ici que l’issue d’une vie met en évidence sa qualité morale.
- source_word: τὴν δικαιοσύνην αὐτῶν
  choice: sa justice
  rationale: « Justice » conserve le terme théologique et moral δικαιοσύνη, qui peut aussi évoquer la droiture ou la conduite juste.
- source_word: γνωρίζονται
  choice: elle est connue
  rationale: Le passif grec est conservé. Dans la reformulation distributive française, le pronom renvoie à « la fin ».
- source_word: τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ
  choice: des anges du Seigneur comme de ceux de Béliar
  rationale: Les deux génitifs, « du Seigneur » et « de Béliar », dépendent naturellement de « anges ». Cette formulation évite de faire de Béliar lui-même le second destinataire.
theological_decisions:
- issue: Portée de « justice »
  choice: Conserver « justice »
  alternative: « droiture » ou « conduite juste »
  rationale: Le grec δικαιοσύνη porte une densité morale et théologique que « justice » préserve, tandis que la note signale la nuance de droiture.
- issue: Rapport syntaxique de Béliar aux anges
  choice: Comprendre « les anges du Seigneur et ceux de Béliar »
  alternative: « aux anges du Seigneur et à Béliar »
  rationale: τοῦ Βελίαρ est au génitif, parallèle à Κυρίου, et qualifie donc vraisemblablement un second groupe d’anges sous-entendu; traduire « à Béliar » traiterait à tort ce génitif comme un datif.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation distributive évite l’expression peu idiomatique « les fins des êtres humains ». « Béliar » est conservé comme nom propre traditionnel. Le parallélisme « du Seigneur… de ceux de Béliar » reflète la syntaxe grecque plutôt que la révision anglaise qui fait de Béliar un destinataire direct.
