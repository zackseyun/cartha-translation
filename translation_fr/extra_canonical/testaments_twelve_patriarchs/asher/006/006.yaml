    rationale: Le grec emploie l’adjectif masculin ἥσυχος et le pronom objet masculin αὐτόν. Même si le contexte doit fournir le référent, « l’âme » (féminin) et « la » effacent ce fait textuel et ne sont pas justifiés par la phrase grecque donnée.
  - severity: low
    issue: « demeure paisible » ajoute une nuance aspectuelle
    rationale: ἔστω ἥσυχος signifie plus directement « est/soit tranquille ». « Demeure » suggère une persistance qui n’est pas explicitement exprimée.
