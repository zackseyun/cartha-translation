revisions:
- from: Mais si l’âme demeure paisible dans la joie, elle reconnaît l’ange de la paix, et celui-ci la fait entrer dans la vie éternelle.[a]
  to: Mais si l’esprit est tranquille dans la joie, il reconnaît l’ange de la paix, et celui-ci le fait entrer dans la vie éternelle.[a]
  rationale: La révision remplace « l’âme » par « l’esprit » afin de respecter le masculin des formes grecques conservées et rend ἔστω ἥσυχος plus directement par « est tranquille ». Elle maintient l’interprétation contextuelle selon laquelle l’ange conduit le référent implicite dans la vie éternelle, tout en la signalant en note comme une explicitation du sujet non exprimé.
