base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: fr
  text: Mais si l’esprit est tranquille dans la joie, il reconnaît l’ange de la paix, et celui-ci le fait entrer dans la vie éternelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne formule pas expressément le sujet de « fait entrer ». La traduction comprend, selon le sens le plus probable du contexte, que l’ange de la paix fait entrer l’esprit dans la vie éternelle.
    reason: Signaler l’implicite syntaxique de εἰσφέρει sans présenter comme certaine une explicitation qui dépend du contexte.
lexical_decisions:
- source_word: ἥσυχος
  choice: paisible
  rationale: Le terme évoque le calme et la tranquillité; « paisible » convient au contexte de joie et à la mention de l’ange de la paix.
- source_word: γνωρίζει
  choice: reconnaît
  rationale: Le verbe peut signifier connaître ou reconnaître; ici, « reconnaît » exprime naturellement le discernement de l’ange de la paix.
- source_word: εἰσφέρει … εἰς ζωὴν αἰώνιον
  choice: fait entrer … dans la vie éternelle
  rationale: Cette formulation conserve le mouvement d’entrée exprimé par εἰς et la valeur causative de « faire entrer ».
theological_decisions:
- issue: Identité du sujet qui fait entrer dans la vie éternelle
  choice: « celui-ci », renvoyant à l’ange de la paix
  alternative: L’âme fait entrer l’ange de la paix dans la vie éternelle
  rationale: Le sens contextuel soutient l’idée que l’ange conduit l’âme, comme le comprend aussi la couche de consultation anglaise; toutefois, la syntaxe grecque transmise est irrégulière ou ambiguë, ce qui est signalé en note.
- issue: Sujet implicite de la proposition
  choice: Explicitation par « l’âme »
  alternative: Conserver un pronom isolé (« elle » ou « il »)
  rationale: Le référent vient du contexte et son explicitation rend le verset autonome et intelligible en français sans introduire de doctrine particulière.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « paix / paisible » reflète le lien lexical et thématique du grec sans alourdir la phrase.
