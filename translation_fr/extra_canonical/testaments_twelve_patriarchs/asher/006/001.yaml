revisions:
- from: Ainsi donc, vous aussi, mes enfants, prenez garde aux commandements du Seigneur, en suivant la vérité d’un cœur sans partage.
  to: Soyez donc attentifs, vous aussi, mes enfants, en suivant les commandements du Seigneur d’un cœur sans partage, dans la vérité.
  rationale: Correction du rattachement syntaxique des « commandements du Seigneur » au participe grec « suivant ». Le choix « soyez attentifs » rend l’impératif προσέχετε de façon claire et non ambiguë; « en suivant » préserve la valeur participiale. La position de « d’un cœur sans partage » auprès de « suivant » maintient l’analyse retenue pour μονοπροσώπως, tandis que « dans la vérité » conserve l’élément final du texte source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'La formulation grecque fait de προσέχετε l’exhortation principale (« soyez attentifs / veillez »), tandis que le participe ἀκολουθοῦντες décrit la manière ou la conduite concomitante : suivre les commandements du Seigneur. Le projet inverse ce rapport en faisant de « aux commandements » le complément de « prenez garde », ce qui est moins fidèle et peut suggérer en français qu’il faut se méfier des commandements. La révision conserve « dans la vérité » et rend μονοπροσώπως par une expression idiomatique de dévouement sans partage.'
  naturalness: « Soyez donc attentifs » est naturel en français moderne international et porte l’exhortation sans l’ambiguïté négative possible de « prenez garde aux commandements ». La construction participiale par « en suivant » reste fluide et reflète raisonnablement le grec.
  terminology: « commandements du Seigneur » rend exactement τὰς ἐντολὰς Κυρίου. « d’un cœur sans partage » est une bonne équivalence contextuelle de l’adverbe rare μονοπροσώπως, exprimant une orientation entière sans surinterprétation doctrinale. « la vérité » est conservé avec l’article défini.
  issues:
  - severity: medium
    issue: Le complément « aux commandements du Seigneur » est rattaché à « prenez garde ».
    rationale: Dans le grec, τὰς ἐντολὰς Κυρίου est l’objet de ἀκολουθοῦντες (« suivant les commandements »), non le complément de προσέχετε. En français, « prenez garde aux commandements » est en outre susceptible de signifier qu’il faut s’en méfier.
  - severity: low
    issue: Le lien entre l’exhortation principale et le participe est obscurci.
    rationale: La révision rend explicite, sans ajouter de contenu, que l’attention demandée s’exerce dans une conduite qui suit les commandements.
  revised_text: Soyez donc attentifs, vous aussi, mes enfants, en suivant les commandements du Seigneur d’un cœur sans partage, dans la vérité.
