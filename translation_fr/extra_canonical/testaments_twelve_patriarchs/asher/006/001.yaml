base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/001.yaml
  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: fr
  text: Soyez donc attentifs, vous aussi, mes enfants, en suivant les commandements du Seigneur d’un cœur sans partage, dans la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: prenez garde
  rationale: Rend l’impératif présent par une exhortation naturelle et soutenue, avec l’idée d’attention vigilante.
- source_word: τὰς ἐντολὰς Κυρίου
  choice: aux commandements du Seigneur
  rationale: Le verbe προσέχω peut régir le datif au sens de « prêter attention à »; la formulation française transmet naturellement cette relation avec les commandements.
- source_word: μονοπροσώπως
  choice: d’un cœur sans partage
  rationale: Cet adverbe rare exprime une orientation unique, sans duplicité ni division. Cette tournure française idiomatique conserve l’idée de résolution entière sans imposer une interprétation confessionnelle.
- source_word: ἀκολουθοῦντες τῇ ἀληθείᾳ
  choice: en suivant la vérité
  rationale: Conserve le participe et son complément au datif dans une expression française claire, sans réduire « la vérité » à la seule sincérité subjective.
theological_decisions:
- issue: Rapport syntaxique de μονοπροσώπως
  choice: 'Le rattacher à « suivre la vérité » : « en suivant la vérité d’un cœur sans partage »'
  alternative: 'Le rattacher plus largement à l’observation des commandements : « prenez garde aux commandements du Seigneur d’un cœur sans partage, en suivant la vérité »'
  rationale: La proximité de l’adverbe avec ἀκολουθοῦντες favorise son rattachement au participe, tout en laissant s’étendre naturellement l’exhortation à l’ensemble de la conduite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’exhortation solennelle du texte grec tout en évitant un calque maladroit de μονοπροσώπως.
