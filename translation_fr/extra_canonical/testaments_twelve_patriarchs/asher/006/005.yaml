  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: fr
  text: Car, lorsqu’une âme mauvaise part, elle est tourmentée par l’esprit mauvais, qui la réduisait aussi en esclavage par des désirs et des actes mauvais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de cette proposition est difficile. On peut aussi comprendre : « l’esprit mauvais qu’elle servait aussi par des désirs et des actes mauvais ».'
    reason: Préserver l’ambiguïté syntaxique et lexicale de ὃ καὶ ἐδούλευεν sans trancher silencieusement entre la compréhension principale et la lecture selon laquelle l’âme servait l’esprit mauvais.
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχὴ
  choice: une âme mauvaise
  rationale: Rend directement l’adjectif πονηρά sans préciser davantage la nature morale de la méchanceté.
- source_word: ἀπέρχεται
  choice: s’en va
  rationale: Conserve l’expression sobre et non explicitée du grec; le contexte évoque le départ de l’âme sans que le verbe dise expressément «meurt» ou «quitte ce monde».
- source_word: βασανίζεται
  choice: est tourmentée
  rationale: Exprime le sens passif de souffrance ou de supplice porté par le verbe.
- source_word: ἐδούλευεν
  choice: avait réduite en esclavage
  rationale: Retient ici la lecture causative reflétée par la couche de consultation anglaise et fait entendre l’idée forte d’asservissement attachée à la racine de δουλεύω, tout en signalant en note la difficulté syntaxique et l’autre lecture possible.
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: dans des désirs et des actes mauvais
  rationale: Préserve la préposition ἐν et le parallélisme entre les désirs intérieurs et les actes; «désirs» évite de restreindre ἐπιθυμίαις au seul domaine sexuel.
theological_decisions:
- issue: Rapport entre l’âme mauvaise et l’esprit mauvais
  choice: L’esprit mauvais avait asservi l’âme.
  alternative: L’âme servait l’esprit mauvais.
  rationale: Le texte transmis présente une difficulté autour de ὃ καὶ ἐδούλευεν. La formulation principale suit la lecture retenue dans la version anglaise auditée, mais l’autre compréhension, plus habituelle pour δουλεύω, reste authentiquement possible et est conservée en note.
translation_notes:
  register: Français international actuel, clair et digne. La phrase reste proche de la structure grecque sans ajouter «ce monde» ni expliciter la mort. «Actes» est plus naturel ici que «œuvres», tandis que la note conserve la lecture concurrente importante.
