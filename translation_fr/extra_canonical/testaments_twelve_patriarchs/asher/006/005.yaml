  revision_rationale: La révision remplace le plus-que-parfait non justifié par un imparfait qui correspond à ἐδούλευεν, et emploie « part » pour ἀπέρχεται. La difficulté substantielle de la relative grecque demeure explicitement documentée en note, sans imposer une interprétation doctrinale ni supprimer la lecture alternative.
