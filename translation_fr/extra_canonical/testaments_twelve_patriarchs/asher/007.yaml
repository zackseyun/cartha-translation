  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007.yaml
  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
translation:
  language: fr
  text: '**Testament d’Aser 7**


    1 Ne devenez pas comme Sodome, qui n’a pas reconnu les anges du Seigneur et qui a été détruite pour toujours.


    2 Car je sais que vous pécherez et que vous serez livrés aux mains de vos ennemis. Votre pays sera dévasté, vos lieux saints seront entièrement détruits, et vous serez dispersés aux quatre coins de la terre. Dans la dispersion, vous serez méprisés comme une eau inutilisable,


    3 jusqu’à ce que le Très-Haut intervienne sur la terre. Lui-même viendra comme un homme, mangeant et buvant avec les humains, et il écrasera la tête du dragon sur l’eau. C’est lui qui sauvera Israël et toutes les nations — [Dieu apparaissant comme un homme][a].


    4 Vous donc aussi, mes enfants, dites ces choses à vos enfants, afin qu’ils ne lui désobéissent pas.


    5 Car je sais que, désobéissants, vous désobéirez, et qu’impies, vous agirez avec impiété, sans prêter attention à la loi de Dieu, mais corrompus par le mal à cause des commandements humains.


    6 C’est pourquoi vous serez dispersés, comme Gad et Dan, mes frères, et vous ne connaîtrez plus leur pays, leur tribu ni leur langue.


    7 Mais il vous rassemblera dans la foi[b], par sa compassion[c], et par Abraham, Isaac et Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots entre crochets, « Dieu apparaissant comme un homme », appartiennent à une leçon grecque textuellement incertaine, peut-être développée secondairement. Le verbe grec peut aussi évoquer le fait de jouer le rôle d’un homme ou d’en prendre l’apparence.
    reason: textual_variant
  - marker: b
    text: « Dans la foi » peut aussi se comprendre au sens de « dans la fidélité ».
    reason: lexical_alternative
  - marker: c
    text: La dispersion suivie du rassemblement reprend un thème de jugement et de rétablissement lié à l’alliance, fréquent dans les Écritures d’Israël.
    reason: cross_reference
lexical_decisions:
- source_word: ἠγνόησε
  choice: n’a pas reconnu
  rationale: Le verbe peut signifier ignorer ou ne pas reconnaître. Ici, « ne pas reconnaître » rend naturellement le manquement de Sodome envers les anges sans préciser au-delà du grec la nature exacte de cette faute.
- source_word: τὰ ἅγια
  choice: vos lieux saints
  rationale: Le neutre pluriel peut désigner les choses saintes ou les sanctuaires. Dans le parallèle avec la dévastation du pays, « lieux saints » offre un sens concret tout en évitant de désigner un sanctuaire particulier.
- source_word: εἰς διασπορὰν
  choice: dans la dispersion
  rationale: Cette expression conserve le motif biblique de la dispersion sans transformer nécessairement le terme en nom propre ou en institution historique.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: il écrasera la tête du dragon
  rationale: « Écraser » rend la défaite violente exprimée par συντρίβω, tandis que « tête du dragon » conserve l’image apocalyptique précise du grec.
- source_word: ὑποκρινόμενος
  choice: apparaissant comme
  rationale: Dans cette proposition textuellement incertaine, le verbe peut évoquer le fait de jouer un rôle ou de prendre une apparence. « Apparaissant comme » reste lisible et évite d’imposer l’idée d’une tromperie, tandis que la note signale la difficulté.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: impies, vous agirez avec impiété
  rationale: La formulation garde autant que possible la répétition volontaire de la même famille lexicale, tout en restant intelligible en français moderne.
- source_word: νόμῳ θεοῦ
  choice: la loi de Dieu
  rationale: Dans ce cadre testamentaire juif, « loi de Dieu » est l’équivalent direct et attendu, en contraste avec les commandements humains.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: vous vous laisserez corrompre par le mal
  rationale: « Le mal » garde l’étendue sémantique de κακία sans le réduire à la seule malveillance, et la tournure pronominale exprime le processus de corruption morale.
- source_word: ἀγνοήσετε
  choice: vous ne connaîtrez plus
  rationale: Le futur simple signifie littéralement « vous ne connaîtrez pas ». L’ajout de « plus » explicite naturellement en français la perte de connaissance de l’identité ancestrale impliquée par la dispersion.
- source_word: ἐν πίστει
  choice: dans la foi
  rationale: Cette traduction formellement proche préserve l’ouverture entre la foi comme confiance et la fidélité, possibilité signalée en note.
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: grâce à sa compassion
  rationale: La préposition exprime ici le moyen ou le fondement du rassemblement, et εὐσπλαγχνία désigne une compassion profonde.
theological_decisions:
- issue: Proposition entre crochets θεὸς εἰς ἄνδρα ὑποκρινόμενος
  choice: Conservée entre crochets sous la forme « Dieu apparaissant comme un homme »
  alternative: Omettre la proposition comme expansion secondaire, ou traduire plus littéralement « Dieu jouant le rôle d’un homme »
  rationale: Le témoin grec fourni contient cette proposition tout en signalant son caractère incertain. La garder entre crochets rend compte du texte transmis sans l’harmoniser avec une formulation doctrinale ultérieure.
- issue: Référent du sauveur et du sujet au verset 7
  choice: Employer « c’est lui » au verset 3 et « il » au verset 7 sans ajouter un titre divin
  alternative: Préciser « le Seigneur » ou identifier explicitement une figure messianique
  rationale: Le grec ne répète pas ici de titre ou de nom comme sujet. Une identification plus précise résoudrait une ambiguïté que le texte laisse ouverte.
- issue: Sens de ἐν πίστει
  choice: « dans la foi »
  alternative: « dans la fidélité » ou « par la foi »
  rationale: La formulation retenue demeure proche du grec et conserve la tension entre confiance croyante, sphère de foi et fidélité.
- issue: Valeur de διὰ devant Abraham, Isaac et Jacob
  choice: « à cause d’Abraham, d’Isaac et de Jacob »
  alternative: « par Abraham, Isaac et Jacob »
  rationale: Le second διά peut être compris comme indiquant le moyen ou le motif. « À cause de » exprime prudemment que le rassemblement est lié aux patriarches, sans faire nécessairement d’eux les agents directs de l’action.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique a été légèrement segmentée pour la clarté, tout en maintenant la continuité entre les versets 2 et 3. Les répétitions marquées du verset 5 ont été conservées autant que le permet un français naturel. Les crochets du témoin grec sont maintenus dans le corps du texte et expliqués en note.
