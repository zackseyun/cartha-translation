review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire aux vv. 2, 4 et 6. Le grec ne dit pas que les personnes à deux visages combattent « avec » les esprits d’égarement; il les décrit comme combattant contre les êtres humains. Au v. 4, le sujet de « sont connus » est le pluriel τὰ τέλη (« les fins/issues »), non les êtres humains eux-mêmes. Au v. 6, le texte grec transmis porte αὐτόν, pronom masculin : une traduction qui fait de l’ange le sujet et de l’âme l’objet résout une difficulté sans la conserver. La note doit plutôt signaler cette syntaxe inattendue.'
  naturalness: Le français est globalement clair et d’un registre approprié. « D’un seul visage » est très littéral et peu idiomatique; « sans duplicité » rend naturellement la force morale de μονοπροσώπως tout en maintenant le contraste avec « deux visages ». « Leur fin » est plus naturel en français que « les fins des êtres humains » et conserve la portée collective/distributive du grec.
  terminology: « Seigneur », « loi », « esprits d’égarement », « Béliar », « justice », « vie éternelle » et « ange de la paix » sont cohérents avec le grec et avec un français moderne. « Désirs » pour ἐπιθυμίαις conserve utilement l’extension du terme.
  issues:
  - severity: medium
    issue: Ajout d’un lien de coopération au v. 2
    rationale: « combattant avec eux contre les êtres humains » ajoute « avec eux », absent de συναγωνιζόμενοι κατὰ τῶν ἀνθρώπων. Le texte atteste seulement l’opposition aux êtres humains.
  - severity: high
    issue: Référent erroné au v. 4
    rationale: Le pluriel γνωρίζονται reprend naturellement τὰ τέλη. La traduction actuelle dit que les êtres humains sont connus des anges, alors que le grec dit que leurs fins/issues le sont.
  - severity: high
    issue: Normalisation non signalée du pronom masculin au v. 6
    rationale: Le texte transmis lit εἰσφέρει αὐτόν (« le fait entrer »). Faire de l’ange le sujet et de l’âme le complément inverse le sens grammatical transmis. La formulation difficile doit être reproduite, avec une note indiquant que le contexte peut avoir suscité une interprétation inverse.
  revised_text: '**Testament d’Aser 6**


    1 Soyez donc attentifs, vous aussi, mes enfants : observez les commandements du Seigneur sans duplicité, en suivant la vérité. 2 Car ceux qui ont deux visages sont doublement punis : ils font le mal et approuvent ceux qui le font, imitant les esprits d’égarement et combattant contre les êtres humains.


    3 Vous donc, mes enfants, gardez la loi du Seigneur. Ne considérez pas le mal comme s’il était bon, mais fixez vos regards sur ce qui est véritablement bon. Préservez-le dans tous les commandements du Seigneur ; conduisez-vous selon lui et trouvez-y votre repos. 4 Car leur fin révèle la justice des êtres humains, et elle est connue des anges du Seigneur et de Béliar. 5 En effet, lorsqu’une âme mauvaise s’en va, elle est tourmentée par l’esprit mauvais qu’elle a aussi servi par ses désirs et ses œuvres mauvaises. 6 Mais si elle est paisible dans la joie, elle reconnaît l’ange de la paix et le fait entrer dans la vie éternelle.[a]'
  revised_footnotes:
  - marker: a
    text: Le grec transmis dit littéralement que l’âme « fait entrer » l’ange de la paix dans la vie éternelle, le pronom étant masculin. Cette formulation est inattendue dans le contexte; certains comprendraient plutôt que l’ange fait entrer l’âme dans la vie éternelle. La traduction conserve ici la syntaxe du texte grec.
    reason: Signaler la difficulté grammaticale et l’interprétation contextuelle possible sans substituer cette dernière au texte transmis.
  revision_rationale: La révision supprime un ajout au v. 2, rétablit au v. 4 le référent grammatical des « fins » humaines, et, au v. 6, conserve la construction masculine difficile du grec tout en l’expliquant en note. Elle améliore également l’idiomaticité de μονοπροσώπως sans effacer l’opposition structurante avec les personnes « à deux visages ».
