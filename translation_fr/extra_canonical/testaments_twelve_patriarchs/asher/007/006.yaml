source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: fr
  text: Et à cause de cela, vous serez dispersés comme Gad et Dan, mes frères, et vous ne connaîtrez ni leurs pays, ni leur tribu ni leur langue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασκορπισθήσεσθε
  choice: vous serez dispersés
  rationale: Rend directement le futur passif grec, avec le sens d’une dispersion géographique.
- source_word: ἀγνοήσετε
  choice: vous ne connaîtrez
  rationale: Conserve le sens général de l’ignorance ou de l’absence de connaissance, sans préciser indûment s’il s’agit de reconnaissance, d’expérience ou d’information.
- source_word: χώρας
  choice: pays
  rationale: Dans cette énumération identitaire et géographique, « pays » est naturel en français et couvre le territoire ou la contrée.
- source_word: φυλὴν
  choice: tribu
  rationale: Équivalent direct dans le contexte des groupes issus d’Israël.
- source_word: γλῶσσαν
  choice: langue
  rationale: Équivalent direct, désignant ici la langue parlée.
theological_decisions:
- issue: Référent du possessif αὐτῶν (« leur »)
  choice: Conserver « leur » sans expliciter davantage le référent
  alternative: Remplacer par « vos pays, tribus et langues » ou expliciter « les pays, les tribus et les langues de Gad et de Dan »
  rationale: Le grec porte un possessif de troisième personne dont le référent peut paraître délicat dans le fil du discours. La traduction maintient cette ambiguïté au lieu de la résoudre par conjecture.
- issue: Portée de « mes frères »
  choice: Ponctuer comme une apostrophe adressée aux destinataires
  alternative: Le rattacher à Gad et Dan comme une apposition
  rationale: Le vocatif οἱ ἀδελφοί μου est le plus naturellement compris comme une adresse aux auditeurs; les virgules françaises rendent cette lecture sans ajout doctrinal.
translation_notes:
  register: Français moderne, international et digne. La coordination négative répétée (« ni… ni… ni… ») rend l’énumération naturelle et claire. Aucun archaïsme ni développement interprétatif n’a été ajouté.
