revisions:
- from: 'Car je sais que, persistant dans la désobéissance, vous désobéirez, et que, persistant dans l’impiété, vous agirez en impies : vous ne prêterez pas attention à la loi de Dieu, mais vous vous laisserez corrompre par la méchanceté, en suivant des commandements humains.'
  to: Car je sais que, en désobéissant, vous désobéirez, et que, en agissant de manière impie, vous agirez de manière impie, sans prêter attention à la loi de Dieu, mais corrompus par la méchanceté, par des commandements des hommes.
  rationale: La révision retire les nuances non exprimées de persistance et de suivi. Elle conserve les répétitions emphatiques du grec, rend les participes par des gérondifs et maintient sans la résoudre la relation condensée des deux datifs finaux (« par la méchanceté, par des commandements des hommes »).
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:48Z'
review_pass:
  verdict: revise
  source_fidelity: La répétition des racines ἀπειθ- et ἀσεβ- ainsi que l’opposition entre la loi de Dieu et les commandements humains sont bien perçues. Toutefois, « persistant dans » ajoute l’idée de continuité, et « en suivant » transforme les commandements humains en action explicitement accomplie par les destinataires. Le grec présente plutôt une chaîne de participes dont le rapport précis entre la corruption, la méchanceté et les commandements humains demeure condensé.
  naturalness: Le français proposé est globalement clair et de registre approprié, mais l’explicitation par « persistant dans » et « en suivant » est plus interprétative que nécessaire. Une formulation légèrement plus littérale reste fluide tout en conservant la rhétorique volontairement redoublée du texte.
  terminology: « Loi de Dieu », « impie », « méchanceté » et « commandements humains » conviennent. « Commandements des hommes » rend plus directement le génitif ἀνθρώπων et préserve le contraste avec Dieu.
  issues:
  - severity: medium
    issue: « Persistant dans la désobéissance / l’impiété »
    rationale: Les participes ἀπειθοῦντες et ἀσεβοῦντες expriment l’action correspondante, mais n’impliquent pas explicitement la persistance. Cette nuance ajoutée réduit la fidélité formelle du redoublement.
  - severity: medium
    issue: « en suivant des commandements humains »
    rationale: Le grec ne dit pas explicitement « suivre » ces commandements. Les deux datifs finaux sont syntaxiquement serrés; la traduction doit éviter de trancher leur rapport en ajoutant une action non exprimée.
  revised_text: Car je sais que, en désobéissant, vous désobéirez, et que, en agissant de manière impie, vous agirez de manière impie, sans prêter attention à la loi de Dieu, mais corrompus par la méchanceté, par des commandements des hommes.
  revised_footnotes: []
  revision_rationale: La révision retire les nuances non exprimées de persistance et de suivi. Elle conserve les répétitions emphatiques du grec, rend les participes par des gérondifs et maintient sans la résoudre la relation condensée des deux datifs finaux (« par la méchanceté, par des commandements des hommes »).
