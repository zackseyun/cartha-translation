  text: '*Ἐγὼ γὰρ ἔγνων³³ ὅτι ⸀ἀπειθοῦντες⸀³⁴ *ἀπειθήσετε, καὶ ἀσεβοῦντες ἀσεβήσετε³⁵, μὴ προσέχοντες³⁶ *τῷ νόμῳ³⁷ θεοῦ, ἀλλ᾽ ἐντολαῖς ἀνθρώπων *κακίᾳ διαφθειρόμενοι³⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: fr
  text: Car je sais que, en désobéissant, vous désobéirez, et que, en agissant de manière impie, vous agirez de manière impie, sans prêter attention à la loi de Dieu, mais corrompus par la méchanceté, par des commandements des hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντες … ἀπειθήσετε
  choice: persistant dans la désobéissance, vous désobéirez
  rationale: Conserve la répétition emphatique et le jeu sur la même racine grecque, tout en donnant en français une tournure compréhensible.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: persistant dans l’impiété, vous agirez en impies
  rationale: Préserve le redoublement du grec sans employer une formulation française artificielle comme « impies, vous serez impies ».
- source_word: μὴ προσέχοντες
  choice: vous ne prêterez pas attention
  rationale: Rend naturellement l’idée d’accorder son attention ou son adhésion à quelque chose.
- source_word: τῷ νόμῳ θεοῦ
  choice: à la loi de Dieu
  rationale: Traduction directe et traditionnelle, sans préciser davantage la portée de νόμος.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: des commandements humains
  rationale: « Humains » exprime le génitif ἀνθρώπων de manière inclusive et naturelle.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: vous vous laisserez corrompre par la méchanceté
  rationale: Rend le participe passif et conserve κακία comme force ou moyen corrupteur.
theological_decisions:
- issue: Rapport syntaxique entre « commandements humains », « méchanceté » et « corrompre »
  choice: « corrompre par la méchanceté, en suivant des commandements humains »
  alternative: « corrompre par la méchanceté au moyen des commandements humains »
  rationale: Le grec transmis est compact et sa syntaxe peut faire de la méchanceté le moyen de la corruption, tandis que les commandements humains s’opposent à la loi de Dieu. La formulation choisie conserve cette opposition sans affirmer que les commandements sont eux-mêmes l’instrument grammatical de la corruption.
translation_notes:
  register: Français moderne, international et digne. La répétition rhétorique du grec est volontairement maintenue, mais légèrement explicitée par « persistant dans » afin qu’elle reste intelligible à la lecture.
