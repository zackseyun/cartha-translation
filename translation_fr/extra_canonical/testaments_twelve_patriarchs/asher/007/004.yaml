  text: Therefore, my children, you also tell these things to your children, so that they may not disobey him.
translation:
  language: fr
  text: Ainsi donc, mes enfants, vous aussi, dites ces choses à vos enfants, afin qu’ils ne lui désobéissent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε οὖν
  choice: Ainsi donc, dites
  rationale: Le tour conserve la valeur conclusive de οὖν et l’impératif aoriste, tout en restant naturel en français.
- source_word: τέκνα μου καὶ ὑμεῖς
  choice: mes enfants, vous aussi
  rationale: Cette formulation garde l’adresse affectueuse et l’insistance portée par καὶ ὑμεῖς.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif renvoie au contenu précédent sans le préciser davantage; la traduction préserve cette référence ouverte.
- source_word: μὴ ἀπειθήσωσιν
  choice: afin qu’ils ne lui désobéissent pas
  rationale: Le verbe ἀπειθέω exprime ici la désobéissance; la proposition française rend naturellement la finalité négative.
theological_decisions:
- issue: Référent du pronom αὐτῷ
  choice: lui
  alternative: à Dieu / à la loi / à celui-ci
  rationale: Le texte grec emploie un pronom masculin singulier sans expliciter son référent dans ce verset. Le conserver sous forme pronominale évite de résoudre une ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « enfants ... enfants » est conservée parce qu’elle structure explicitement la transmission intergénérationnelle dans le grec.
