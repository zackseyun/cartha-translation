  text: VII. Μὴ γίνεσθε¹ ὡς Σόδομα², ἥτις ἠγνόησε³ *τοὺς ἀγγέλους⁴ Κυρίου, καὶ ἀπώλετο ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/001.yaml
  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: fr
  text: Ne devenez pas comme Sodome, qui n’a pas reconnu les anges du Seigneur et a péri pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Ne devenez pas
  rationale: Rend l’impératif présent de γίνομαι plus précisément que « ne soyez pas », en exprimant l’idée de ne pas en venir à ressembler à Sodome.
- source_word: ἠγνόησε
  choice: n’a pas reconnu
  rationale: Le verbe peut signifier ignorer, méconnaître ou ne pas reconnaître; dans le récit de Sodome et des anges, « n’a pas reconnu » conserve le lien contextuel sans préciser abusivement s’il s’agit d’identité, d’accueil ou de connaissance.
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: les anges du Seigneur
  rationale: Traduction directe du syntagme grec, naturelle dans le registre biblique français.
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: a péri pour toujours
  rationale: Restitue l’aoriste de ἀπόλλυμι et la portée durable de ἕως αἰῶνος dans un français clair et digne.
theological_decisions:
- issue: Nature de la faute de Sodome exprimée par ἠγνόησε
  choice: n’a pas reconnu
  alternative: a ignoré / n’a pas connu
  rationale: Le texte relie explicitement le jugement au fait de ne pas reconnaître les anges du Seigneur. La formulation retenue préserve cette affirmation sans importer une interprétation doctrinale plus précise de la faute.
- issue: Portée de ἕως αἰῶνος
  choice: pour toujours
  alternative: à jamais / jusqu’à l’éternité
  rationale: « Pour toujours » exprime naturellement la durée indéfinie ou définitive de la formule grecque, sans surcharger le verset d’une terminologie métaphysique.
translation_notes:
  register: Français international moderne, direct et digne. La structure brève et l’avertissement solennel du grec sont conservés; aucun appel de note n’est nécessaire.
