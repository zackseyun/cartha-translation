revisions:
- from: Car je sais que vous pécherez et que vous serez livrés aux mains de vos ennemis. Votre pays sera dévasté, vos lieux saints seront détruits, et vous serez dispersés aux quatre coins de la terre. Dans la dispersion, vous serez méprisés comme de l’eau impropre à l’usage.
  to: Car je sais que vous pécherez et que vous serez livrés aux mains de vos ennemis. Votre pays sera dévasté, vos choses saintes seront détruites, et vous serez dispersés aux quatre coins de la terre. Vous serez réduits à la dispersion, méprisés comme de l’eau inutile.
  rationale: Révision limitée à la préservation de l’ambiguïté de τὰ ἅγια et à un rendu plus fidèle de la construction εἰς διασποράν. Aucune note n’est nécessaire.
  reviewer_model: gpt-5.6-terra
