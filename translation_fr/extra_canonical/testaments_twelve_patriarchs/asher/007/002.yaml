source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: fr
  text: Car je sais que vous pécherez et que vous serez livrés aux mains de vos ennemis. Votre pays sera dévasté, vos choses saintes seront détruites, et vous serez dispersés aux quatre coins de la terre. Vous serez réduits à la dispersion, méprisés comme de l’eau inutile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοθήσεσθε εἰς χεῖρας
  choice: vous serez livrés aux mains
  rationale: Conserve l’image sémitisante du pouvoir exercé par les ennemis tout en restant idiomatique en français.
- source_word: ἡ γῆ ὑμῶν
  choice: votre pays
  rationale: Dans ce contexte de dévastation territoriale, « pays » exprime plus naturellement le territoire du peuple que « terre ».
- source_word: τὰ ἅγια ὑμῶν
  choice: vos lieux saints
  rationale: Le pluriel neutre désigne vraisemblablement les réalités ou lieux sacrés; « lieux saints » convient au contexte de destruction sans préciser indûment le sanctuaire.
- source_word: εἰς τὰς τέσσαρας γωνίας τῆς γῆς
  choice: aux quatre coins de la terre
  rationale: Reproduit fidèlement une expression imagée bien établie en français.
- source_word: εἰς διασποράν
  choice: dans la dispersion
  rationale: Maintient le sens concret d’une existence dispersée sans imposer le terme technique « Diaspora ».
- source_word: ὕδωρ ἄχρηστον
  choice: de l’eau impropre à l’usage
  rationale: Rend ἄχρηστον comme « inutilisable, sans utilité » dans un français naturel, sans transformer l’image en « eau sale » ou « imbuvable », notions absentes du grec.
theological_decisions:
- issue: Nature de « vos choses saintes » (τὰ ἅγια ὑμῶν)
  choice: vos lieux saints
  alternative: vos choses saintes / vos sanctuaires
  rationale: Le texte ne précise pas exactement ce qui est sacré. « Lieux saints » garde une certaine amplitude et s’accorde avec le verbe de destruction, sans identifier explicitement le Temple.
- issue: Portée de « dispersion »
  choice: dans la dispersion
  alternative: dans la Diaspora / dispersés parmi les nations
  rationale: Le grec nomme l’état de dispersion mais ne mentionne pas les nations; la traduction évite donc d’ajouter ce complément théologique ou historique.
translation_notes:
  register: Français moderne, international et digne. La première longue phrase grecque est divisée pour améliorer la lisibilité, sans modifier la progression prophétique. Le tutoiement pluriel « vous » est conservé; aucune note n’est nécessaire.
