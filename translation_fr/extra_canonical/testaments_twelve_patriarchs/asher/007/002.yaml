review_pass:
  verdict: revise
  source_fidelity: 'La progression prophétique, les futurs passifs, l’image des « quatre coins de la terre » et la comparaison finale sont bien rendus. Toutefois, τὰ ἅγια (« les choses saintes / sacrées ») est un neutre pluriel qui ne désigne pas explicitement des lieux : « vos lieux saints » restreint indûment le référent.'
  naturalness: Le français est fluide et de registre approprié. « Vous serez réduits à la dispersion » rend plus explicitement et naturellement la valeur résultative de ἔσεσθε εἰς διασποράν que « Dans la dispersion, vous serez... », tout en conservant la répétition intentionnelle avec « vous serez dispersés ».
  terminology: « Pays », « livrés aux mains de », « dévasté », « dispersés » et « méprisés » conviennent. « Choses saintes » préserve l’ambiguïté de τὰ ἅγια sans identifier les réalités visées à des sanctuaires ou à des lieux saints.
  issues:
  - severity: medium
    issue: « vos lieux saints » restreint τὰ ἅγια
    rationale: Le grec substantivise l’adjectif neutre pluriel « saintes » et peut viser des réalités sacrées au sens large. Rien dans cette formulation ne permet d’en faire exclusivement des lieux.
  - severity: low
    issue: Rendu de εἰς διασποράν
    rationale: « Dans la dispersion » est compréhensible, mais le tour grec exprime l’aboutissement à un état de dispersion. « Vous serez réduits à la dispersion » le restitue plus directement en français.
  revised_text: Car je sais que vous pécherez et que vous serez livrés aux mains de vos ennemis. Votre pays sera dévasté, vos choses saintes seront détruites, et vous serez dispersés aux quatre coins de la terre. Vous serez réduits à la dispersion, méprisés comme de l’eau inutile.
  revised_footnotes: []
