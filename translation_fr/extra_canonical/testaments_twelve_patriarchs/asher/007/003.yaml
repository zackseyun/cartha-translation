base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: fr
  text: 'Jusqu’à ce que le Très-Haut visite la terre et que lui-même vienne comme un homme au milieu des hommes, mangeant et buvant avec eux, et écrasant la tête du dragon au-dessus de l’eau[a] : c’est lui qui sauvera Israël et toutes les nations — [Dieu se faisant passer pour un homme][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur l’eau » ; la préposition grecque permet ici plusieurs nuances spatiales.'
    reason: Préserver l’ambiguïté de ἐπὶ τοῦ ὕδατος tout en adoptant dans le texte la formulation française la plus naturelle.
  - marker: b
    text: La formule finale est placée entre crochets dans l’édition grecque, ce qui signale que son appartenance au texte est incertaine.
    reason: Rendre transparente l’incertitude textuelle indiquée par l’édition source.
lexical_decisions:
- source_word: ἐπισκέψηται
  choice: visite
  rationale: Conserve le sens de venir auprès de quelqu’un ou d’un lieu pour intervenir, sans préciser d’avance si cette intervention est jugement ou secours.
- source_word: ὡς ἄνθρωπος μετὰ ἀνθρώπων
  choice: comme un homme au milieu des hommes
  rationale: Rend naturellement la comparaison ὡς et la présence parmi les humains exprimée par μετὰ ἀνθρώπων.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: écrasant la tête du dragon
  rationale: « Écraser » exprime la destruction violente portée par συντρίβω, tandis que « tête » est le terme français courant correspondant à κάρα.
- source_word: ὑποκρινόμενος
  choice: se faisant passer pour
  rationale: Le participe peut évoquer le fait de jouer un rôle ou de prendre une apparence; ce choix préserve cette nuance plus précisément que le simple « apparaissant ».
theological_decisions:
- issue: Identification du Très-Haut avec celui qui vient comme un homme
  choice: Conserver la continuité grammaticale et le pronom emphatique « lui-même »
  alternative: Introduire un autre personnage ou expliciter une doctrine christologique particulière
  rationale: Le grec rattache αὐτός au Très-Haut, mais la traduction ne doit pas développer cette formulation au-delà de ce que dit le texte.
- issue: Formule finale entre crochets
  choice: La maintenir entre crochets et traduire littéralement son idée de rôle ou d’apparence assumée
  alternative: L’intégrer sans signalement au corps du verset ou l’omettre
  rationale: L’édition source la place entre crochets, ce qui signale une incertitude textuelle ou éditoriale qu’il faut rendre visible.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure solennelle et l’imagerie du grec, tout en ajoutant une ponctuation qui clarifie la reprise par « celui-ci ».
