  to: 'Jusqu’à ce que le Très-Haut visite la terre et que lui-même vienne comme un homme au milieu des hommes, mangeant et buvant avec eux, et écrasant la tête du dragon au-dessus de l’eau[a] : c’est lui qui sauvera Israël et toutes les nations — [Dieu se faisant passer pour un homme][b].'
