  text: Ἀλλ᾽ ἐπισυνάξει ὑμᾶς⁴⁵ ἐν πίστει διὰ τῆς⁴⁶ εὐσπλαγχνίας αὐτοῦ, καὶ⁴⁷ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: fr
  text: Mais il vous rassemblera dans la foi, par sa compassion, et par Abraham, Isaac et Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: rassemblera
  rationale: Le futur exprime l’action promise de réunir; le français « rassemblera » rend directement le sens du verbe grec.
- source_word: ἐν πίστει
  choice: dans la foi
  rationale: 'Cette formulation conserve la préposition et l’ambiguïté du grec: il peut s’agir de la sphère de la foi ou de la fidélité.'
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: par sa compassion
  rationale: « Compassion » rend naturellement εὐσπλαγχνία, qui désigne une profonde miséricorde, et « par » maintient la valeur instrumentale de διά avec le génitif.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: par Abraham, Isaac et Jacob
  rationale: La répétition conceptuelle de διά est préservée sans alourdir la coordination française; la relation précise avec les patriarches reste volontairement non explicitée.
theological_decisions:
- issue: Sujet implicite de ἐπισυνάξει
  choice: Conserver le pronom « il » sans ajouter « le Seigneur »
  alternative: « Mais le Seigneur vous rassemblera… »
  rationale: Le texte grec fourni porte un sujet verbal implicite et ne contient pas explicitement κύριος. La traduction évite donc d’importer dans ce verset une identification venant du contexte ou de la couche anglaise.
- issue: Fonction d’Abraham, d’Isaac et de Jacob
  choice: « par Abraham, Isaac et Jacob »
  alternative: Préciser « grâce à », « par l’intermédiaire de » ou « à cause de »
  rationale: Le grec διά avec le génitif permet une relation médiatrice ou instrumentale, mais le verset n’en explique pas la nature. La formulation retenue préserve cette tension.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; aucune précision théologique absente de la source n’est ajoutée.
