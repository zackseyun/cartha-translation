source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: fr
  text: 'Il y a quelqu’un qui déteste l’homme miséricordieux et l’homme injuste, l’adultère et celui qui jeûne. Cela aussi est double, mais l’œuvre, prise dans son ensemble, est bonne, car cet homme imite le Seigneur : il ne confond pas[a] ce qui paraît bon avec ce qui est véritablement bon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette proposition est incertain; littéralement, on pourrait lire : « il n’attend pas ce qui paraît bon avec ce qui est véritablement bon ».'
    reason: Les signes critiques de l’édition indiquent une corruption autour de προσδοκώμενος et μετά; la traduction principale adopte une restitution contextuelle et la note préserve l’incertitude.
lexical_decisions:
- source_word: διπρόσωπον
  choice: double
  rationale: Le grec signifie littéralement « à deux visages ». Dans le contexte, « double » exprime une attitude qui se porte pareillement vers des personnes bonnes et mauvaises, sans imposer d’emblée l’idée moderne d’hypocrisie.
- source_word: τὸ πᾶν ἔργον ἀγαθόν
  choice: l’œuvre, prise dans son ensemble, est bonne
  rationale: Cette formulation conserve l’idée du tout exprimée par τὸ πᾶν et produit un français naturel malgré la syntaxe grecque difficile.
- source_word: μιμεῖται Κύριον
  choice: imite le Seigneur
  rationale: Rendu direct qui préserve le titre Κύριον sans explicitation théologique supplémentaire.
- source_word: τὸ δοκοῦν καλόν
  choice: ce qui paraît bon
  rationale: δοκοῦν marque l’apparence ou l’estimation, en contraste avec ἀληθινός, « véritable ».
- source_word: τὸ ἀληθινὸν καλόν
  choice: ce qui est véritablement bon
  rationale: Rend explicitement le contraste entre le bien apparent et le bien authentique.
theological_decisions:
- issue: Sens moral de l’imitation du Seigneur
  choice: Conserver simplement « imite le Seigneur »
  alternative: Préciser que Dieu hait le péché tout en faisant miséricorde aux personnes
  rationale: Le texte transmis ne développe pas cette logique. Une explicitation résoudrait une tension que la traduction doit préserver.
- issue: Interprétation de la proposition finale corrompue
  choice: « il ne confond pas ce qui paraît bon avec ce qui est véritablement bon »
  alternative: « il n’attend pas ce qui paraît bon avec ce qui est véritablement bon »
  rationale: Le texte grec signalé comme corrompu donne littéralement une construction proche de « ne s’attendant pas à… avec… », peu intelligible ici. Le contexte oppose le bien apparent au bien véritable; « ne confond pas » en propose un sens cohérent tout en étant signalé en note.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « l’homme » dans le premier couple clarifie que les adjectifs substantivés désignent des personnes; elle n’est pas répétée dans le second couple, où les substantifs sont explicites. Le passage étant textuellement difficile, la formulation vise la lisibilité sans masquer l’incertitude de la finale.
