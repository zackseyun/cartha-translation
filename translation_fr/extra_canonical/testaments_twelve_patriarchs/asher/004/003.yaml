review_pass:
  verdict: revise
  source_fidelity: La proposition finale est textuellement incertaine, comme le signalent les cruces de l’édition autour de προσδοκώμενος et μετά. La traduction principale « il ne confond pas » ne correspond toutefois pas au verbe grec transmis (« s’attendre à / attendre ») et constitue une interprétation contextuelle trop affirmée. Le sens difficile doit rester apparent dans le texte, avec une note explicative.
  naturalness: Le français est généralement fluide et de registre approprié. « Cela aussi est double » est un peu abrupt, mais reproduit sans imposer « hypocrite » au διπρόσωπον ambigu. La reformulation de la finale proposée demeure lisible tout en conservant la construction inhabituelle du grec.
  terminology: « miséricordieux », « adultère », « jeûne », « Seigneur » et « véritablement bon » sont des choix justes et constants. « Toute son action » rend plus naturellement τὸ πᾶν ἔργον que « l’œuvre, prise dans son ensemble », tout en maintenant l’idée de totalité.
  issues:
  - severity: high
    issue: La traduction principale remplace « ne s’attendant pas à » par « il ne confond pas ».
    rationale: προσδοκώμενος, malgré l’état corrompu du contexte, est un participe de προσδοκάω (« attendre / s’attendre à »), non de « confondre ». La note ne suffit pas à justifier que le texte principal substitue un sens absent de la leçon transmise.
  - severity: low
    issue: « l’œuvre, prise dans son ensemble » est une explicitation interprétative de τὸ πᾶν ἔργον.
    rationale: « toute son action » conserve directement la totalité exprimée par τὸ πᾶν et s’insère plus naturellement dans la phrase française.
  revised_text: Il y a quelqu’un qui déteste l’homme miséricordieux et l’homme injuste, l’adultère et celui qui jeûne. Cela aussi est double, mais toute son action est bonne, car il imite le Seigneur, sans attendre, avec ce qui est véritablement bon, ce qui paraît bon[a].
  revised_footnotes:
  - marker: a
    text: 'Le texte grec est incertain dans cette proposition, particulièrement autour de « sans attendre » et de « avec ». Littéralement, il se lit approximativement : « ne s’attendant pas à ce qui paraît bon avec ce qui est véritablement bon ».'
    reason: Préserve dans le texte principal le sens du verbe grec προσδοκώμενος (« s’attendre à ») et signale sans la résoudre la difficulté syntaxique et textuelle.
  revision_rationale: La révision retire l’interprétation « ne confond pas », qui dépasse la leçon grecque attestée. Elle conserve plutôt le verbe « attendre » et la relation incertaine introduite par « avec », dans une formulation française volontairement marquée mais intelligible. « Toute son action » rend directement l’idée de « toute l’œuvre / toute action » sans paraphrase excessive.
