  source_fidelity: La structure argumentative et l’antithèse entre les personnes « à un seul visage » et celles « à deux visages » sont bien rendues. Toutefois, « les tiennent pour pécheurs » décrit plus naturellement une identité ou un statut (« être des pécheurs »), tandis que le grec νομισθῶσι ... ἁμαρτάνειν dit qu’on les croit en train de pécher ou qu’on juge qu’ils pèchent.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Qui n’ont qu’un seul visage » conserve volontairement l’image du grec; « qui n’ont qu’un visage » est légèrement plus idiomatique tout en gardant cette métaphore.
