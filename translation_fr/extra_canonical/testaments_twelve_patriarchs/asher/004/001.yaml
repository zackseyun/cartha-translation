source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: IV. Οἱ γὰρ ἀγαθοὶ ἄνθρωποι¹ *⌜καὶ⌝ μονοπρόσωποι κἂν² νομισθῶσι παρὰ τῶν³ διπροσώπων⁴ ἁμαρτάνειν⁵, δίκαιοί εἰσι παρὰ τῷ⁶ Θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: fr
  text: Car les hommes bons, qui n’ont qu’un visage, même si les hommes à deux visages les croient pécher, sont justes devant Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: les hommes bons
  rationale: Rend directement l’expression grecque dans un français simple et digne.
- source_word: μονοπρόσωποι
  choice: qui n’ont qu’un seul visage
  rationale: Conserve la métaphore du « visage » et son opposition explicite à διπροσώπων, plutôt que de la réduire à « sincères ».
- source_word: διπροσώπων
  choice: les hommes à deux visages
  rationale: Préserve le parallélisme antithétique du grec et l’idée de duplicité sans effacer l’image originale.
- source_word: νομισθῶσι … ἁμαρτάνειν
  choice: les tiennent pour pécheurs
  rationale: Expression française naturelle qui transmet le jugement porté sur eux; elle rend ἁμαρτάνειν dans son sens moral contextuel.
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  choice: sont justes devant Dieu
  rationale: Formulation biblique claire qui maintient le contraste entre l’opinion humaine et l’évaluation divine.
theological_decisions:
- issue: Rapport entre l’accusation humaine de péché et le jugement divin
  choice: 'Maintenir sans l’expliquer le contraste: tenus pour pécheurs par les humains, ils sont justes devant Dieu.'
  alternative: Interpréter la justice comme une déclaration judiciaire précise ou comme la perfection morale.
  rationale: Le grec affirme le contraste mais ne précise ni le mécanisme ni la portée doctrinale de cette justice; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, accessible et digne. La métaphore inhabituelle d’un seul visage et de deux visages est volontairement conservée, car elle structure l’antithèse du verset.
