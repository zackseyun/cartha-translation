source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: fr
  text: 'Car de tels hommes ressemblent aux gazelles et aux cerfs : bien que, par leurs mœurs d’animaux sauvages, ils paraissent impurs, ils sont pourtant entièrement purs, parce qu’ils marchent avec zèle pour le Seigneur, s’abstenant de ce que Dieu déteste et interdit lui aussi par les commandements, et tenant le mal à l’écart du bien.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  choice: aux gazelles et aux cerfs
  rationale: Rend directement les deux animaux nommés, sans généralisation.
- source_word: ἐν ἤθει ἀγρίων
  choice: par leurs mœurs d’animaux sauvages
  rationale: ἦθος désigne ici la manière d’être ou les habitudes; « mœurs » conserve cette nuance tout en restant naturel dans le contraste entre apparence d’impureté et pureté réelle.
- source_word: τὸ δὲ πᾶν καθαροί
  choice: ils sont pourtant entièrement purs
  rationale: Le tour grec exprime une pureté totale; « entièrement » est plus idiomatique que « en toute chose » dans ce contexte.
- source_word: ἐν ζήλῳ Κυρίου
  choice: avec zèle pour le Seigneur
  rationale: Le génitif est compris objectivement, conformément au contexte d’une conduite fidèle aux commandements, sans ajouter d’idée confessionnelle.
- source_word: ἀπεχόμενοι
  choice: s’abstenant
  rationale: Exprime naturellement l’action de se tenir éloigné de pratiques interdites.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: tenant le mal à l’écart du bien
  rationale: Préserve l’image d’une séparation active entre le mal et le bien sans préciser indûment la manière dont elle s’opère.
theological_decisions:
- issue: Sens du génitif dans ζήλῳ Κυρίου
  choice: zèle pour le Seigneur
  alternative: zèle du Seigneur
  rationale: Les deux relations grammaticales sont envisageables, mais le sujet humain de « marchent » et l’obéissance décrite ensuite favorisent le zèle dirigé vers le Seigneur.
- issue: Rapport entre pureté apparente et pureté réelle
  choice: bien que… ils sont pourtant
  alternative: ils semblent impurs… mais ils sont purs
  rationale: La structure concessive rend explicitement le contraste du grec sans supprimer la tension entre les apparences liées aux animaux sauvages et la pureté fondée sur l’obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la comparaison animale, le contraste concessif et la série de participes du grec, tout en évitant une syntaxe excessivement littérale.
