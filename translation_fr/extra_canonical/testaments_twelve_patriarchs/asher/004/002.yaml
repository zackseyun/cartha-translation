  text: Πολλοὶ ⌜δὲ⌝⁷ ἀναιροῦντες τοὺς⁸ πονηρούς, δύο⁹ ποιοῦσιν ἔργα *καλοῦ τε καὶ κακοῦ¹⁰, *τὸ δὲ ὅλον¹¹ καλόν, ὅτι τὸ¹² κακὸν ἐκριζώσας ἀπώλεσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: fr
  text: Et beaucoup, en supprimant les méchants, accomplissent deux œuvres, l’une bonne et l’autre mauvaise ; pourtant, l’ensemble est bon, car celui qui a déraciné le mal l’a détruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: en supprimant les méchants
  rationale: « Supprimer » conserve ici la portée de ἀναιρέω, qui peut désigner le fait d’éliminer ou de mettre à mort, sans préciser davantage que le grec le mode d’action.
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: accomplissent deux œuvres, l’une bonne et l’autre mauvaise
  rationale: Cette formulation rend explicitement la dualité des ἔργα et le contraste entre καλόν et κακόν, dans un français naturel et soutenu.
- source_word: τὸ δὲ ὅλον καλόν
  choice: pourtant, l’ensemble est bon
  rationale: « L’ensemble » traduit τὸ ὅλον comme l’action considérée globalement, tout en maintenant la tension morale du texte.
- source_word: ἐκριζώσας ἀπώλεσεν
  choice: celui qui a déraciné le mal l’a détruit
  rationale: 'Les deux images verbales sont conservées : extirper à la racine, puis détruire. Le participe singulier est rendu par « celui qui » afin de ne pas gommer le changement grammatical par rapport au pluriel initial.'
theological_decisions:
- issue: Évaluation morale d’une action comportant du bien et du mal
  choice: Maintenir l’affirmation paradoxale selon laquelle l’ensemble est bon
  alternative: Atténuer en disant que « le résultat est bon » ou que « l’intention est bonne »
  rationale: Le grec qualifie directement τὸ ὅλον de καλόν. La traduction ne doit ni résoudre ni atténuer la tension éthique en substituant une évaluation des seules conséquences ou intentions.
- issue: Passage du pluriel au singulier
  choice: Rendre le participe singulier par « celui qui »
  alternative: 'Harmoniser au pluriel : « car ils ont déraciné et détruit le mal »'
  rationale: Le texte grec passe de « beaucoup » et « accomplissent » au singulier ἐκριζώσας. La traduction préserve ce trait plutôt que de le normaliser silencieusement.
translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe conserve le raisonnement serré et la tension morale de l’original. Aucun marqueur de note n’est requis.
