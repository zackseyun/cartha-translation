revisions:
- from: Un autre ne veut pas connaître de jours heureux en compagnie des débauchés, de peur de déshonorer son corps et de souiller son âme. Bien que cette attitude soit à double face, elle est pourtant entièrement bonne.
  to: Un autre ne veut pas connaître de jours heureux en compagnie des débauchés, de peur de déshonorer son corps et de souiller son âme. Et même cela est à deux visages, mais entièrement bon.
  rationale: La révision conserve le vocabulaire fidèlement rendu dans la première phrase. Elle rétablit dans la seconde une proposition coordonnée, avec le contraste explicite de « mais », au lieu d'une subordination concessive. « À deux visages » préserve l'ambiguïté du grec dans une expression française plus naturelle.
