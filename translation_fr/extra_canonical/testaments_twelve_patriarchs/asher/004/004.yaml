source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: fr
  text: Un autre ne veut pas connaître de jours heureux en compagnie des débauchés, de peur de déshonorer son corps et de souiller son âme. Et même cela est à deux visages, mais entièrement bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν ἡμέρας ἀγαθάς
  choice: connaître des jours heureux
  rationale: L’expression grecque signifie littéralement « voir de bons jours », idiome rendu naturellement en français par « connaître des jours heureux ».
- source_word: ἀσώτων
  choice: débauchés
  rationale: Le terme désigne des personnes menant une vie dissolue ou prodigue; « débauchés » convient ici au contexte de corruption du corps et de l’âme.
- source_word: αἰσχράνει
  choice: déshonorer
  rationale: Ce verbe exprime l’idée de rendre honteux ou de couvrir de honte, distincte de la souillure exprimée ensuite par μολυνεῖ.
- source_word: μολυνεῖ
  choice: souiller
  rationale: Le verbe désigne une contamination ou une souillure, ici appliquée à l’âme.
- source_word: διπρόσωπον
  choice: à double face
  rationale: Cette formulation conserve l’image et l’ambiguïté du grec, qui qualifie la conduite de « double » sans préciser exactement en quoi.
- source_word: ὅλον δὲ καλόν
  choice: elle est pourtant entièrement bonne
  rationale: Rend le contraste introduit par δέ et la totalité exprimée par ὅλον, sans atténuer la tension avec « à double face ».
theological_decisions:
- issue: Appréciation paradoxale d’une conduite dite διπρόσωπον
  choice: Conserver la tension entre « à double face » et « entièrement bonne »
  alternative: Interpréter διπρόσωπον comme « ambivalente », « hypocrite » ou expliquer les deux aspects de la conduite
  rationale: Le texte grec juxtapose les deux appréciations sans résoudre explicitement le paradoxe; la traduction ne doit pas imposer une lecture doctrinale ou morale particulière.
translation_notes:
  register: Français moderne, courant et digne. « Cette attitude » explicite sobrement le référent neutre de τοῦτο et évite une tournure française obscure, tout en préservant l’ambiguïté du jugement porté sur elle.
