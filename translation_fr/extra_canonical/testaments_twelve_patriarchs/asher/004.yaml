base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: fr
  text: '1 En effet, les hommes de bien, qui n’ont qu’un seul visage, sont justes devant Dieu, même si ceux qui ont un double visage[a] les considèrent comme péchant.


    2 Beaucoup, en supprimant les méchants, accomplissent deux œuvres, l’une bonne et l’autre mauvaise ; pourtant, l’ensemble est bon, car, ayant déraciné le mal, ils l’ont détruit.


    3 Il y a quelqu’un qui hait le miséricordieux et l’injuste, l’adultère et celui qui jeûne ; cela aussi est à double visage, mais l’œuvre tout entière est bonne, car il imite le Seigneur, sans attendre ce qui paraît bon avec le bien véritable[b].


    4 Un autre ne veut pas voir de jours heureux avec les débauchés, afin de ne pas déshonorer son corps ni souiller son âme. Cela aussi est à double visage, mais c’est entièrement bon.


    5 De tels hommes ressemblent aux gazelles et aux cerfs : par leur allure de bêtes sauvages, ils paraissent impurs, mais ils sont entièrement purs[c], car ils marchent avec zèle pour le Seigneur, se tenant à l’écart de ce que Dieu aussi déteste et interdit par les commandements, écartant le mal du bien[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à deux visages ». La même image revient dans tout le chapitre ; elle peut évoquer la duplicité, mais, dans l’argument du passage, aussi une conduite qui paraît avoir deux aspects.
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase est difficile dans le grec transmis. Le texte porte littéralement « sans attendre ce qui paraît bon avec le bien véritable » et oppose clairement le bien apparent au bien véritable. La relation exacte entre les deux expressions reste incertaine.
    reason: textual_difficulty
  - marker: c
    text: La comparaison semble viser des animaux dont l’allure sauvage peut les faire paraître suspects, alors qu’ils sont considérés comme purs. Elle illustre l’opposition entre l’apparence extérieure et la pureté réelle.
    reason: cultural_note
  - marker: d
    text: 'La dernière proposition est très condensée en grec. On peut aussi traduire : « tenant le mal éloigné du bien » ou « empêchant le mal de se mêler au bien ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  choice: qui n’ont qu’un seul visage
  rationale: Conserve l’image structurante du visage unique tout en produisant une expression française intelligible et digne.
- source_word: διπρόσωποι / διπρόσωπον
  choice: à double visage / présente un double visage
  rationale: Maintient l’opposition explicite avec μονοπρόσωποι. Cette formulation évite le ton familier de « faux jetons » et ne réduit pas le terme à la seule hypocrisie.
- source_word: ἀναιροῦντες
  choice: en supprimant
  rationale: Le verbe peut désigner la mise à mort ou, plus largement, l’élimination. « Supprimer » préserve cette amplitude sans atténuer entièrement la force du propos.
- source_word: τὸ δὲ ὅλον καλόν
  choice: pourtant, l’ensemble est bon
  rationale: Rend la formule évaluative récurrente et souligne que le jugement porte sur l’acte considéré dans sa totalité.
- source_word: μιμεῖται Κύριον
  choice: imite le Seigneur
  rationale: Traduction directe de l’idée d’imitation éthique, sans introduire une identification théologique absente du grec.
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  choice: ce qui paraît bon ... ce qui est véritablement bon
  rationale: Préserve le contraste central entre apparence de bonté et bonté véritable.
- source_word: ἀσώτων
  choice: débauchés
  rationale: Le terme désigne des personnes dissipées et moralement sans retenue. « Débauchés » transmet mieux cette portée en français moderne que le sens trop étroit de « gaspilleurs ».
- source_word: αἰσχράνει ... μολυνεῖ
  choice: déshonorer ... souiller
  rationale: Respecte la distinction entre l’atteinte honteuse au corps et la contamination de l’âme, sans confondre les deux verbes.
- source_word: δορκάσι καὶ ἐλάφοις
  choice: gazelles et cerfs
  rationale: Conserve les deux espèces de l’image animale dans un français naturel.
- source_word: ἐν ἤθει ἀγρίων
  choice: par leur comportement d’animaux sauvages
  rationale: Rend l’impression extérieure suggérée par ἦθος et prépare le contraste avec leur pureté réelle.
- source_word: ἐν ζήλῳ Κυρίου
  choice: avec zèle pour le Seigneur
  rationale: Comprend le génitif comme l’objet du zèle humain, lecture naturelle dans le contexte immédiat.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: maintenant ainsi le mal loin du bien
  rationale: La clause grecque est condensée. Cette traduction conserve l’idée de séparation ou d’empêchement sans préciser indûment la relation syntaxique.
theological_decisions:
- issue: Évaluation morale d’actes qui paraissent doubles ou mêlés
  choice: Le texte distingue la duplicité intérieure des actes qui, vus de l’extérieur, ont un aspect double mais sont jugés bons dans leur visée globale d’écarter le mal.
  alternative: Condamner toute forme de dualité sans exception, ou présenter le passage comme une approbation générale de moyens mauvais.
  rationale: Les formules répétées selon lesquelles l’acte « présente un double visage » mais est bon dans son ensemble imposent de conserver la tension du raisonnement sans la transformer en règle morale systématique.
- issue: Référent de Κύριον
  choice: le Seigneur
  alternative: Dieu ; le SEIGNEUR
  rationale: Le témoin grec porte Κύριον. « Le Seigneur » traduit le titre sans lui imposer une précision christologique ou une représentation du tétragramme que ce passage grec n’explicite pas.
- issue: Interprétation de la proposition textuellement difficile au verset 3
  choice: « il ne confond pas ce qui paraît bon avec ce qui est véritablement bon »
  alternative: « il n’attend pas ce qui paraît bon avec ce qui est véritablement bon »
  rationale: Le grec transmis est difficile et probablement perturbé. La traduction retient le contraste sémantique sûr entre bonté apparente et bonté véritable, tout en signalant la difficulté en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’image récurrente des visages est conservée plutôt que remplacée par un vocabulaire abstrait. Les phrases ont été légèrement réorganisées pour la lisibilité, tout en maintenant les ambiguïtés morales et les difficultés textuelles du grec.
