revisions:
- from: '1 En effet, les hommes de bien, qui n’ont qu’un seul visage, sont justes devant Dieu, même si les gens à double visage[a] estiment qu’ils pèchent.


    2 Beaucoup, en supprimant les méchants, accomplissent deux œuvres, l’une bonne et l’autre mauvaise ; pourtant, l’ensemble est bon, car celui qui a déraciné le mal l’a détruit.


    3 Il arrive que quelqu’un haïsse l’homme qui est à la fois miséricordieux et injuste, ainsi que celui qui est à la fois adultère et jeûne. Cela aussi présente un double visage, mais l’œuvre, prise dans son ensemble, est bonne, car cet homme imite le Seigneur : il ne confond pas ce qui paraît bon avec ce qui est véritablement bon[b].


    4 Un autre ne veut pas connaître de jours heureux en compagnie des débauchés, afin de ne pas déshonorer son corps ni souiller son âme. Cela aussi présente un double visage, mais c’est entièrement bon.


    5 De tels hommes ressemblent aux gazelles et aux cerfs : par leur comportement d’animaux sauvages, ils paraissent impurs, mais ils sont purs à tous égards[c], car ils marchent avec zèle pour le Seigneur. Ils se tiennent à l’écart de ce que Dieu lui-même déteste et interdit par les commandements, maintenant ainsi le mal loin du bien[d].'
  to: '1 En effet, les hommes de bien, qui n’ont qu’un seul visage, sont justes devant Dieu, même si ceux qui ont un double visage[a] les considèrent comme péchant.


    2 Beaucoup, en supprimant les méchants, accomplissent deux œuvres, l’une bonne et l’autre mauvaise ; pourtant, l’ensemble est bon, car, ayant déraciné le mal, ils l’ont détruit.


    3 Il y a quelqu’un qui hait le miséricordieux et l’injuste, l’adultère et celui qui jeûne ; cela aussi est à double visage, mais l’œuvre tout entière est bonne, car il imite le Seigneur, sans attendre ce qui paraît bon avec le bien véritable[b].


    4 Un autre ne veut pas voir de jours heureux avec les débauchés, afin de ne pas déshonorer son corps ni souiller son âme. Cela aussi est à double visage, mais c’est entièrement bon.


    5 De tels hommes ressemblent aux gazelles et aux cerfs : par leur allure de bêtes sauvages, ils paraissent impurs, mais ils sont entièrement purs[c], car ils marchent avec zèle pour le Seigneur, se tenant à l’écart de ce que Dieu aussi déteste et interdit par les commandements, écartant le mal du bien[d].'
  rationale: La correction rétablit les coordinations du v. 3 et rend προσδοκώμενος par « attendre », sans prétendre résoudre une construction grecque difficile. Elle conserve les métaphores récurrentes, le registre du texte et les ambiguïtés du passage. Au v. 2, l'antécédent du participe aoriste est rendu au pluriel (« ils »), conformément au sujet πολλοί, plutôt que par un singulier interprétatif.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le v. 3 du projet modifie indûment la syntaxe grecque : les quatre désignations (« le miséricordieux », « l''injuste », « l''adultère », « celui qui jeûne ») sont coordonnées et ne qualifient pas deux personnes chacune « à la fois » de deux manières. Surtout, μὴ προσδοκώμενος signifie littéralement « sans attendre / ne s''attendant pas à », et non « ne confond pas ». La construction transmise reste difficile ; il convient de conserver cette difficulté en français et de l''expliquer en note plutôt que de lui substituer une interprétation. Les autres versets suivent globalement le grec de près.'
  naturalness: La révision maintient un français international contemporain et soutenu. « À un seul visage » et « à double visage » gardent l'image structurante sans recourir à une expression familière. Au v. 3, la légère rudesse de « sans attendre ce qui paraît bon avec le bien véritable » est volontaire, car elle reflète une formulation grecque difficile et disputée.
  terminology: « Hommes de bien », « justes devant Dieu », « le Seigneur », « débauchés », « souiller », « gazelles et cerfs » et « zèle pour le Seigneur » sont appropriés. « Écartant le mal du bien » conserve la compression et l'ambiguïté relationnelle de ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ sans imposer l'idée plus précise du mélange.
  issues:
  - severity: high
    issue: Le v. 3 transforme les objets coordonnés en paires de qualités portées par les mêmes personnes.
    rationale: Le grec énumère τὸν ἐλεήμονα καὶ ἄδικον, puis τὸν μοιχὸν καὶ νηστεύοντα. « L'homme qui est à la fois miséricordieux et injuste » et « celui qui est à la fois adultère et jeûne » ajoutent une relation qualificative que le texte ne marque pas.
  - severity: high
    issue: « Il ne confond pas » au v. 3 ne rend pas προσδοκώμενος.
    rationale: Le participe grec relève de προσδοκάω (« attendre, s'attendre à »). Même si la phrase est textuellement ou syntaxiquement difficile, « confondre » est une résolution interprétative qui n'est pas justifiée par le mot transmis.
  - severity: medium
    issue: La note b qualifie l'énoncé grec de difficile mais le texte principal le remplace par une paraphrase explicative.
    rationale: Pour préserver l'ambiguïté signalée, le texte doit traduire le sens lexical attesté de « attendre », tandis que la note peut indiquer l'incertitude de construction et les interprétations possibles.
