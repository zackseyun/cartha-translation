  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002.yaml
  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: fr
  text: '**Testament d’Aser 2**


    1 Il y a donc une âme qui, dans ses paroles, écarte le bien au profit du mal et conduit l’issue de l’affaire à la méchanceté.


    2 Il y a un homme qui n’a pas pitié de ses propres serviteurs. Cela aussi présente deux visages, mais l’ensemble est mauvais.


    3 Il y a un homme qui aime celui qui agit avec méchanceté — ce qui est méchanceté —, car il choisit même de mourir dans le mal. À ce propos, il est manifeste que cela présente deux visages, mais que le tout est une action mauvaise.[a]


    4 Même s’il s’agit d’amour, celui qui dissimule le mal sous un nom honorable demeure dans la méchanceté ; l’issue de son action aboutit au mal.[b]


    5 Un autre vole, commet l’injustice, pille, cherche à s’enrichir aux dépens d’autrui, tout en ayant pitié des pauvres. Cela aussi présente deux visages, mais l’ensemble est mauvais.


    6 Celui qui exploite son prochain provoque Dieu ; il se parjure envers le Très-Haut, mais prend pitié du pauvre. Il rejette et irrite le Seigneur, qui a donné la Loi, mais soulage l’indigent.[c]


    7 Il souille l’âme et fait resplendir le corps ; il tue beaucoup de gens et n’a pitié que de quelques-uns. Cela aussi présente deux visages, mais l’ensemble est mauvais.


    8 Un autre commet l’adultère et se livre à l’immoralité sexuelle, tout en s’abstenant de certains aliments. En jeûnant, il fait le mal ; par la puissance que lui donne sa richesse, il entraîne beaucoup de gens à leur perte et, du fond de son immense méchanceté, il accomplit les commandements. Cela présente deux visages, mais l’ensemble est mauvais.


    9 De telles personnes ressemblent aux lièvres : elles sont à moitié pures, mais, en vérité, elles sont impures.[d]


    10 Car Dieu l’a également déclaré ainsi sur les tablettes des commandements.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de ce verset est difficile et probablement altéré. Il peut aussi se comprendre ainsi : « celui qui aime une personne agissant avec méchanceté choisit même de mourir dans le mal à cause d’elle ».'
    reason: Signaler sans la masquer l’incertitude syntaxique entourant ἀγαπῶν, πονηρευόμενον et les expressions marquées comme douteuses dans l’édition.
  - marker: b
    text: Le grec de la première proposition est incertain. Littéralement, il associe « l’amour », « être dans la méchanceté » et le fait de « dissimuler le mal sous le nom honorable ».
    reason: Le passage est textuellement et grammaticalement irrégulier ; la note préserve l’ambiguïté derrière la formulation française.
  - marker: c
    text: La construction grecque de ce verset est irrégulière, notamment autour de « son prochain », « les pauvres » et « prend pitié ». Le sens général oppose les torts infligés à autrui et à Dieu aux secours accordés aux pauvres.
    reason: La traduction ordonne les propositions pour les rendre lisibles, mais le lecteur doit être averti de l’état difficile du texte source.
  - marker: d
    text: Le grec dit littéralement « aux pieds velus », une appellation du lièvre. L’image évoque un animal tenu pour partiellement conforme aux critères de pureté alimentaire, mais néanmoins déclaré impur.
    reason: Expliquer l’appellation grecque et le raisonnement implicite de la comparaison sans surcharger le corps du texte.
lexical_decisions:
- source_word: διπρόσωπον
  choice: présente deux visages
  rationale: Conserve l’image centrale des « deux visages » plutôt que de la réduire à « hypocrite » ou « ambigu », tout en produisant une expression française intelligible.
- source_word: πλεονεκτεῖ / πλεονεκτῶν
  choice: cherche à s’enrichir aux dépens d’autrui / exploite
  rationale: Le verbe désigne ici une cupidité active qui lèse autrui, et non le simple désir abstrait de posséder davantage.
- source_word: ἀθετεῖ
  choice: rejette
  rationale: Rend la force du verbe, qui signifie écarter, répudier ou tenir pour nul, sans ajouter une interprétation confessionnelle.
- source_word: δασύποδες
  choice: lièvres
  rationale: Le mot signifie littéralement « aux pieds velus » et sert de désignation du lièvre ; le contexte de pureté alimentaire confirme ce référent.
- source_word: κατασύρει
  choice: entraîne … à leur perte
  rationale: Exprime le mouvement énergique de tirer ou d’entraîner vers le bas dans un français naturel.
- source_word: λαμπρύνει
  choice: fait resplendir
  rationale: Préserve le contraste concret entre l’âme souillée et le corps rendu éclatant, sans préciser indûment s’il s’agit de vêtements, de parure ou d’apparence.
theological_decisions:
- issue: La valeur morale d’une action mêlant bien et mal
  choice: Maintenir le refrain selon lequel l’action « présente deux visages », mais que son ensemble est mauvais.
  alternative: Paraphraser en disant que les bonnes œuvres ne compensent jamais les péchés.
  rationale: Le texte juge l’ensemble des conduites décrites, mais ne formule pas une doctrine générale de la compensation, du mérite ou du salut.
- issue: L’accomplissement des commandements au verset 8
  choice: 'Conserver la tension : l’homme accomplit les commandements « du fond de son immense méchanceté ».'
  alternative: Corriger ou expliquer le passage comme un accomplissement seulement apparent ou motivé par l’hypocrisie.
  rationale: Le grec affirme paradoxalement qu’il accomplit les commandements à partir de sa méchanceté ; la traduction ne doit pas résoudre silencieusement cette tension.
- issue: Le Seigneur comme auteur de la Loi
  choice: « le Seigneur, qui a donné la Loi »
  alternative: Employer un titre doctrinal développé tel que « le divin Législateur » ou identifier plus précisément le référent.
  rationale: Cette formulation rend ἐντολέα τοῦ νόμου sans importer d’identification ou de doctrine supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le refrain a été uniformisé par « présente deux visages » afin de conserver l’image grecque et la cohésion du chapitre. Les phrases difficiles ont été rendues lisibles sans effacer les anomalies textuelles, signalées en notes.
