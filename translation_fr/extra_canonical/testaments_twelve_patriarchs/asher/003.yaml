base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003.yaml
  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: fr
  text: '1 Quant à vous, mes enfants, ne devenez pas comme eux des gens à double face[a], partagés entre la bonté et la méchanceté. Attachez-vous plutôt à la seule bonté, car le Seigneur Dieu y trouve son repos, et les êtres humains la désirent. 2 Fuyez la méchanceté et réduisez son dessein à néant par vos bonnes actions. En effet, les gens à double face n’appartiennent pas à Dieu : ils sont esclaves de leurs propres désirs, afin de plaire à Béliar[b] et aux êtres humains qui leur ressemblent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à deux visages ».'
    reason: Signale l’image précise du grec derrière une expression qui évoque la duplicité ou une orientation morale partagée.
  - marker: b
    text: Béliar est un nom donné à une figure ou puissance du mal dans la littérature juive ancienne.
    reason: Fournit au lecteur moderne le minimum de contexte nécessaire sans imposer une identification doctrinale plus précise.
lexical_decisions:
- source_word: διπρόσωποι
  choice: des gens à double face
  rationale: Rend littéralement l’image grecque des « deux visages » tout en restant idiomatique en français; l’expression décrit ici une loyauté morale divisée entre bonté et méchanceté.
- source_word: κολλήθητε
  choice: attachez-vous
  rationale: Conserve l’idée forte d’adhérer étroitement à la bonté, sans produire une formulation française artificielle.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: y trouve son repos
  rationale: Préserve la métaphore du repos divin et le renvoi du pronom féminin à la bonté.
- source_word: τὸ διαβούλιον
  choice: ses desseins
  rationale: Le terme désigne un projet, un plan ou une machination. « Desseins » conserve cette portée sans préciser indûment s’il s’agit d’un plan personnifié ou des effets intentionnels de la méchanceté.
- source_word: ἀναιροῦντες
  choice: réduisez ... à néant
  rationale: Exprime plus nettement la force de « supprimer, détruire » que le simple verbe « déjouer ».
- source_word: δουλεύουσιν
  choice: sont esclaves de
  rationale: Conserve la force du verbe grec, qui signifie servir comme esclave, plutôt que de l’atténuer en « suivre ».
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: aux hommes qui leur ressemblent
  rationale: Traduit la proposition finale présente dans le grec mais absente de la couche anglaise fournie; le pronom est rapporté naturellement aux gens à double face.
theological_decisions:
- issue: Le repos du Seigneur Dieu dans la bonté
  choice: « le Seigneur Dieu y trouve son repos »
  alternative: « le Seigneur Dieu demeure en elle »
  rationale: Le grec emploie ἀναπαύεται, terme de repos. La traduction conserve cette affirmation théologique sans la remplacer par l’idée plus générale de demeure.
- issue: Rapport des gens à double face avec Dieu
  choice: « n’appartiennent pas à Dieu »
  alternative: « ne sont pas de Dieu »
  rationale: « Appartenir à Dieu » communique naturellement le génitif τοῦ Θεοῦ en français moderne tout en préservant l’idée d’origine ou d’allégeance, sans trancher davantage.
- issue: Nom de Béliar
  choice: Béliar
  alternative: le diable
  rationale: Le nom propre Βελίαρ est conservé plutôt que remplacé par une identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel familial (« vous, mes enfants ») et les impératifs gardent le ton d’exhortation. La numérotation interne du chapitre est maintenue telle que la source la présente. La traduction suit le grec, notamment en rétablissant la fin « et aux hommes qui leur ressemblent », omise dans la couche anglaise.
