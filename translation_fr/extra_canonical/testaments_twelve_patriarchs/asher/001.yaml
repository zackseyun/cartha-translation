review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire surtout aux v. 3, 6 et 9. « Deux sortes d’actions » ajoute une catégorisation absente du grec, et « suivre la bonne voie » explicite indûment le simple « bien marcher / se bien conduire ». Au v. 9, le grec ne dit pas « lorsqu’elle commence à faire le bien » sans difficulté : la construction transmet l’idée que, lorsque la personne commence à faire le bien, son orientation mauvaise conduit l’issue de l’action vers le mal; le pronom αὐτῷ est masculin et son référent reste grammaticalement incertain. La révision conserve cette difficulté par une note.'
  naturalness: Le français est globalement naturel, moderne et d’un registre testamentaire approprié. « Toutes choses vont par deux » est idiomatique; l’ajout « opposées » rend plus explicite l’antithèse de κατέναντι sans alourdir la phrase. « En notre sein » demeure une solution soutenue mais intelligible pour l’image intérieure de στέρνοις.
  terminology: Aser, Zilpa et Béliar sont maintenus de façon cohérente. « Intentions », « justice », « péché » et « esprit mauvais » conviennent au contexte moral. « Actions », « manières d’agir » et « aboutissements » préservent la distinction rhétorique des termes grecs.
  issues:
  - severity: medium
    issue: Ajout de « sortes de » au v. 3
    rationale: πράξεις signifie « actions »; le grec ne qualifie pas celles-ci comme des « sortes » ou catégories d’actions.
  - severity: medium
    issue: « Suivre la bonne voie » au v. 6 est plus interprétatif que le grec
    rationale: πορευθῆναι signifie littéralement marcher/aller; le contexte est éthique, mais le texte ne répète pas explicitement « voie » ni l’adjectif « bonne ».
  - severity: high
    issue: Le v. 9 ne rend pas suffisamment la construction difficile ni le pronom masculin du grec
    rationale: Le texte grec porte αὐτῷ (« pour lui / le ») et associe l’orientation mauvaise à l’issue de l’action. La formulation proposée féminise et résout silencieusement le référent en « elle ».
  revised_text: '**Testament d’Aser, dixième fils de Jacob et de Zilpa[a]**


    **1.** Copie du testament d’Aser : paroles qu’il adressa à ses fils dans la cent vingt-cinquième année de sa vie.


    **2.** Comme il était encore en bonne santé, il leur dit : « Écoutez votre père, enfants d’Aser, et je vous montrerai tout ce qui est droit devant Dieu.


    **3.** Dieu a donné aux êtres humains deux voies, deux intentions, deux actions, deux manières d’agir et deux aboutissements.


    **4.** C’est pourquoi toutes choses vont par deux, l’une opposée à l’autre.


    **5.** Il existe en effet deux voies, celle du bien et celle du mal ; en elles se trouvent les deux intentions qui, en notre sein[b], les distinguent.


    **6.** Si donc l’âme désire bien se conduire[c], elle accomplit toutes ses actions dans la justice ; même si elle pèche, elle se repent aussitôt.


    **7.** En effet, lorsqu’elle porte ses pensées sur ce qui est juste et rejette la méchanceté, elle renverse aussitôt le mal et déracine le péché.


    **8.** Mais si son intention penche vers le mal, toutes ses actions relèvent de la méchanceté : elle repousse le bien, s’attache au mal et tombe sous le pouvoir de Béliar. Même si elle fait quelque chose de bon, elle le change en mal.


    **9.** Car, lorsqu’elle commence à faire le bien, elle conduit l’aboutissement de son action vers le mal pour lui[d], parce que le trésor de son intention est rempli d’un esprit mauvais. »'
