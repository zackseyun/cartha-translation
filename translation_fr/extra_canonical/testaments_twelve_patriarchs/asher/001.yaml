base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001.yaml
  text: '1[1]. The copy of the testament of Asher.


    2. In the one hundred and twenty-fifth year of his life, while still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything upright before God.


    3. God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two outcomes.


    4. Therefore all things are twofold[2], set one over against the other.


    5. For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.


    6. If, then, the soul desires to walk well, it does all its deeds in righteousness; and even if it sins, it immediately repents.


    7. For by thinking righteous thoughts and casting away wickedness, it at once overturns evil and uproots sin.


    8. But if its purpose inclines to evil, all its deeds are in wickedness, driving away the good and clinging to the evil, and it is ruled by Beliar; and even if it does something good, it turns it into evil.


    9. For whenever it begins to do good in an evil way, it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit.


    10. My children, obey your father, and bury me near my fathers.”


    11. And after he had drawn up his feet, he fell asleep in peace.


    12. And after five years they carried him up to Hebron[3], and placed him with his fathers.'
translation:
  language: fr
  text: '**Testament d’Aser, dixième fils de Jacob et de Zilpa[a]**


    **1.** Copie du testament d’Aser : paroles qu’il adressa à ses fils dans la cent vingt-cinquième année de sa vie.


    **2.** Comme il était encore en bonne santé, il leur dit : « Écoutez votre père, enfants d’Aser, et je vous montrerai tout ce qui est droit devant Dieu.


    **3.** Dieu a donné aux êtres humains deux voies, deux intentions, deux sortes d’actions, deux manières d’agir et deux aboutissements.


    **4.** C’est pourquoi toutes choses vont par deux, l’une en face de l’autre.


    **5.** Il existe en effet deux voies, celle du bien et celle du mal ; en elles se trouvent les deux intentions qui, en notre sein[b], les distinguent.


    **6.** Si donc l’âme désire suivre la bonne voie[c], elle accomplit toutes ses actions dans la justice ; même si elle pèche, elle se repent aussitôt.


    **7.** En effet, lorsqu’elle porte ses pensées sur ce qui est juste et rejette la méchanceté, elle renverse aussitôt le mal et déracine le péché.


    **8.** Mais si son intention penche vers le mal, toutes ses actions relèvent de la méchanceté : elle repousse le bien, s’attache au mal et tombe sous le pouvoir de Béliar. Même si elle fait quelque chose de bon, elle le change en mal.


    **9.** Car lorsqu’elle commence à faire le bien, la fin de son action la pousse vers le mal[d], parce que le trésor de son intention est rempli d’un esprit mauvais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le titre grec complet est : « Testament d’Aser, dixième fils de Jacob et de Zilpa ». Le verset 1 reprend ensuite la désignation « Copie du testament d’Aser ».'
    reason: Clarifier la distinction entre la suscription du document et le début numéroté du testament.
  - marker: b
    text: 'Littéralement : « dans nos poitrines ». Le grec désigne la poitrine comme le siège de la réflexion et des intentions intérieures.'
    reason: Signaler l’image corporelle concrète derrière la formulation française « en notre sein ».
  - marker: c
    text: Le texte grec de cette expression est incertain ; littéralement, la leçon imprimée signifie « bien marcher » ou « bien se conduire ».
    reason: Rendre visible l’incertitude textuelle marquée dans l’édition source et indiquer une traduction plus littérale.
  - marker: d
    text: 'La construction grecque de cette phrase est abrupte et passe à un pronom masculin : littéralement, « la fin de l’action le pousse vers le mal ». Le référent exact du pronom n’est pas explicite.'
    reason: Préserver l’ambiguïté grammaticale du témoin grec plutôt que de la résoudre silencieusement.
lexical_decisions:
- source_word: ὑγιαίνων
  choice: encore en bonne santé
  rationale: Le participe circonstanciel indique qu’Aser jouissait toujours d’une bonne santé au moment de parler ; cette formulation est naturelle et conserve ce détail narratif.
- source_word: εὐθές
  choice: droit
  rationale: Dans ce contexte moral, « droit devant Dieu » exprime la rectitude tout en conservant l’image fondamentale de ce qui est droit.
- source_word: υἱοῖς τῶν ἀνθρώπων
  choice: êtres humains
  rationale: L’expression idiomatique désigne l’humanité ; « êtres humains » est inclusif, courant et fidèle à la portée générale du propos.
- source_word: διαβούλια
  choice: intentions
  rationale: Le terme désigne ici les orientations issues de la délibération intérieure, plutôt que de simples projets extérieurs.
- source_word: πράξεις
  choice: sortes d’actions / actions
  rationale: Au verset 3, l’ajout léger de « sortes de » rend la série naturelle en français ; ailleurs, « actions » traduit directement les actes accomplis.
- source_word: τρόπους
  choice: manières d’agir
  rationale: Cette expression distingue le terme des « voies » déjà mentionnées et rend clairement l’idée de modes de conduite.
- source_word: τέλεα
  choice: aboutissements
  rationale: Le mot renvoie aux fins ou résultats auxquels conduisent les orientations opposées ; « aboutissements » garde à la fois l’idée de terme et de résultat.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: l’une en face de l’autre
  rationale: Cette formulation préserve l’opposition structurée des réalités présentées par paires sans transformer le passage en dualisme métaphysique explicite.
- source_word: στέρνοις
  choice: en notre sein
  rationale: Le grec nomme concrètement la poitrine comme siège de la délibération intérieure. « En notre sein » conserve cette image dans un français digne et intelligible.
- source_word: πορευθῆναι
  choice: suivre la bonne voie
  rationale: Le verbe signifie littéralement aller ou marcher. Dans le contexte des deux voies, cette traduction rend naturellement la métaphore de la conduite morale.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: La tournure conserve la valeur morale et relationnelle de δικαιοσύνη sans la réduire au seul adverbe « justement ».
- source_word: μετανοεῖ
  choice: se repent
  rationale: Le contexte mentionne explicitement le péché et un retournement moral immédiat ; « se repent » convient donc au sens précis du verbe.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Le grec emploie un nom propre pour la puissance mauvaise qui domine ; la translittération française préserve cette personnification.
- source_word: θησαυρὸς τοῦ διαβουλίου
  choice: le trésor de son intention
  rationale: La traduction maintient l’image concrète d’une réserve intérieure remplie d’un esprit mauvais, malgré son caractère inhabituel en français.
theological_decisions:
- issue: Le contraste répété entre deux voies et deux intentions
  choice: Conserver sans atténuation la structure binaire du bien et du mal dans la vie morale humaine.
  alternative: Comprendre le passage soit comme un dualisme métaphysique absolu, soit comme une simple diversité psychologique.
  rationale: Le grec affirme fortement deux orientations opposées et leurs effets, mais ne développe pas ici une ontologie de deux principes éternels. La traduction maintient cette tension sans aller au-delà du texte.
- issue: Le statut de Βελίαρ
  choice: Traiter Béliar comme le nom personnel de la puissance mauvaise qui exerce sa domination.
  alternative: Traduire le nom par « indignité », « perversité » ou « mal personnifié ».
  rationale: Dans la phrase, Βελίαρ fonctionne comme l’agent sous le pouvoir duquel on tombe. Garder le nom propre respecte cette fonction sans préciser davantage sa nature.
- issue: Le bien changé en mal aux versets 8-9
  choice: Conserver l’affirmation paradoxale selon laquelle une action bonne peut être détournée vers une fin mauvaise par une intention remplie d’un esprit mauvais.
  alternative: Reformuler en disant que l’action n’était bonne qu’en apparence.
  rationale: Le texte maintient une tension entre le commencement bon de l’action et son aboutissement mauvais. La traduction ne résout pas cette tension en niant la bonté initiale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme sapientiel et testamentaire, notamment les répétitions de « deux », tout en évitant les calques opaques. Les images concrètes importantes — les voies, le sein, le déracinement et le trésor intérieur — sont maintenues. Seuls la suscription et les versets 1 à 9 présents dans la source grecque fournie sont traduits ; les versets 10 à 12 de la couche anglaise ne sont pas ajoutés faute de texte grec correspondant dans l’extrait source.
