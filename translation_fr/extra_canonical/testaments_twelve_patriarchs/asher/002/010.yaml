source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ γὰρ⁶⁴ ὁ Θεὸς ἐν ταῖς πλαξὶ⁶⁵ τῶν ἐντολῶν⁶⁶ οὕτως εἶπεν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/010.yaml
  text: For God also, in the tablets of the commandments, has declared it so.
translation:
  language: fr
  text: Car Dieu aussi l’a dit ainsi dans les tables des commandements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Car… lui-même
  rationale: La combinaison introduit une justification et ajoute une nuance d’insistance; cette tournure est naturelle en français dans le contexte isolé.
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: sur les tables des commandements
  rationale: Le français emploie naturellement «sur» pour ce qui est écrit ou déclaré sur des tablettes; «tables des commandements» conserve le lien explicite avec les commandements.
- source_word: οὕτως εἶπεν
  choice: l’a dit ainsi
  rationale: Rend directement le parfait français correspondant à l’aoriste grec et conserve οὕτως sans préciser davantage son référent.
theological_decisions:
- issue: Nature de la parole divine inscrite sur les tables
  choice: «Dieu lui-même l’a dit»
  alternative: «Dieu l’a déclaré»
  rationale: Le grec emploie le verbe courant εἶπεν, «a dit»; éviter «a déclaré» ne surinterprète pas la forme ou le statut de cette parole.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche du grec tout en évitant le calque peu naturel «dans les tables».
