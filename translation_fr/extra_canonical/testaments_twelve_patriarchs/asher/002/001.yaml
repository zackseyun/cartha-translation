source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: II. *Ἔστιν οὖν¹ ἡ² ψυχὴ *ἐν λόγοις †ἀφιστῶσα³ τὸ καλὸν ὑπὲρ *τοῦ κακοῦ⁴, καὶ *τὸ τέλος⁵ *τοῦ πράγματος⁶ εἰς κακίαν †ἄγων⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: fr
  text: Il y a donc une âme qui, en paroles, se détourne du bien en faveur du mal et conduit l’issue de l’affaire à la méchanceté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχή
  choice: âme
  rationale: Équivalent naturel et formel qui conserve ici la désignation de la personne intérieure sans réduire le terme à l’esprit ou à l’attitude.
- source_word: ἐν λόγοις
  choice: en paroles
  rationale: Rend littéralement la sphère verbale indiquée par le grec, tout en restant idiomatique en français.
- source_word: ἀφιστῶσα τὸ καλόν
  choice: se détourne du bien
  rationale: Le participe moyen/intransitif exprime l’éloignement à l’égard du bien; «se détourne du bien» est naturel et respecte ce mouvement.
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: en faveur du mal
  rationale: Conserve la valeur de soutien ou de préférence de ὑπέρ dans ce contexte, sans imposer une nuance causale trop précise.
- source_word: τὸ τέλος τοῦ πράγματος
  choice: l’issue de l’affaire
  rationale: τέλος désigne ici l’aboutissement ou le résultat, tandis que πρᾶγμα demeure général; «affaire» préserve cette latitude.
- source_word: εἰς κακίαν ἄγων
  choice: conduit … à la méchanceté
  rationale: Reproduit l’image directionnelle de εἰς avec ἄγω et rend κακία par un terme moral général.
theological_decisions:
- issue: Nature de «l’âme» décrite
  choice: 'Maintenir la formulation existentielle et générale: «Il y a donc une âme qui…»'
  alternative: Interpréter «âme» comme un type précis de personne ou comme une faculté psychologique
  rationale: Le grec ne précise pas davantage l’identité ou le statut de cette âme; la traduction conserve donc l’ambiguïté anthropologique du texte.
- issue: Rapport entre les paroles, le bien et le mal
  choice: Conserver l’opposition selon laquelle l’âme se détourne verbalement du bien en faveur du mal
  alternative: Reformuler comme hypocrisie, apostasie ou choix doctrinal explicite
  rationale: Ces interprétations seraient possibles dans un contexte plus large, mais elles dépasseraient ce que le verset affirme directement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant intelligible; «en faveur du mal» conserve la tension de ὑπέρ, et «issue de l’affaire» évite de préciser indûment la nature de πρᾶγμα.
