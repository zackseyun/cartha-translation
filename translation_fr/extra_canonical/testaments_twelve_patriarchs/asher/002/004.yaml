base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: fr
  text: Même s’il y a de l’amour[a], celui qui cache le mal sous un nom honorable est dans la méchanceté ; mais l’issue de l’acte aboutit au mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette première proposition est incertain et sa construction grammaticale est difficile. L’édition l’encadre d’obèles ; « amour » est au féminin, tandis que « celui qui cache » est au masculin.
    reason: Signaler la corruption ou l’irrégularité textuelle et éviter de présenter comme certaine une relation syntaxique disputée.
lexical_decisions:
- source_word: ἀγάπη
  choice: amour
  rationale: Rend directement le substantif grec, sans préciser de quel type d’amour il s’agit.
- source_word: ὁ συγκρύπτων
  choice: celui qui dissimule
  rationale: Conserve le participe substantivé masculin singulier et l’idée de cacher entièrement ou soigneusement.
- source_word: ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: sous un beau nom
  rationale: Expression naturelle en français qui suit le sens contextuel de présenter le mal sous une désignation favorable, tout en évitant d’expliciter davantage que le grec.
- source_word: τὸ τέλος τῆς πράξεως
  choice: l’aboutissement de l’acte
  rationale: « Aboutissement » exprime ici la fin comme résultat, tandis que « acte » conserve la portée générale de πρᾶξις.
- source_word: ἔρχεται εἰς κακόν
  choice: mène au mal
  rationale: Formulation française idiomatique qui préserve le mouvement vers une mauvaise issue exprimé par le grec.
theological_decisions:
- issue: Rapport entre l’amour, la personne qui dissimule et la méchanceté
  choice: Même s’il s’agit d’amour, celui qui dissimule… demeure dans la méchanceté
  alternative: Même l’amour, lorsqu’il dissimule le mal…, se trouve dans la méchanceté
  rationale: 'La syntaxe transmise est difficile : ἀγάπη οὖσα est féminin, tandis que ὁ συγκρύπτων est masculin. La traduction conserve la référence explicite à l’amour tout en faisant de « celui qui dissimule » le sujet grammatical de la proposition principale, conformément au grec, sans résoudre silencieusement l’incertitude textuelle.'
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure grecque tout en étant lisible ; la note signale l’incertitude réelle du texte transmis.
