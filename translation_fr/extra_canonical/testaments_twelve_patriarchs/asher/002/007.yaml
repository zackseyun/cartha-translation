  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: fr
  text: Cela souille l’âme et fait resplendir le corps ; cela tue beaucoup de personnes et a pitié de quelques-unes. Cela aussi est à double face, mais l’ensemble est mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: souille
  rationale: Rend directement l’idée de tacher ou de contaminer moralement l’âme, dans un registre naturel et digne.
- source_word: λαμπρύνει
  choice: fait resplendir
  rationale: Conserve le contraste marqué avec « souille » et exprime le fait de rendre brillant ou éclatant.
- source_word: ἀναιρεῖ
  choice: tue
  rationale: Dans ce contexte, le verbe signifie faire périr ou mettre à mort ; « tue » est clair et direct.
- source_word: ἐλεεῖ
  choice: fait miséricorde à
  rationale: Préserve la portée morale de l’opposition avec « tue » et le sens d’exercer la compassion envers quelqu’un.
- source_word: διπρόσωπον
  choice: a deux visages
  rationale: Traduction transparente de l’image grecque, qui maintient l’ambivalence sans l’expliciter abusivement.
- source_word: τὸ ὅλον
  choice: l’ensemble
  rationale: Rend le substantif neutre collectif sans imposer un référent plus précis que ne le fait le grec.
- source_word: πονηρόν
  choice: mauvais
  rationale: Préserve la qualification morale générale du grec ; « mauvais » reste naturel sans renforcer indûment en « mal absolu ».
theological_decisions:
- issue: Référent du sujet neutre implicite
  choice: Répétition de « cela »
  alternative: Employer un nom explicite ou un pronom personnel genré
  rationale: Le grec laisse le référent dépendre du contexte précédent et emploie des formes neutres. « Cela » conserve cette dépendance et évite de préciser ou de personnifier ce que le verset ne nomme pas ici.
- issue: Portée de « τὸ ὅλον πονηρόν »
  choice: « l’ensemble est mauvais »
  alternative: « tout cela est mauvais » ou « il est entièrement mauvais »
  rationale: Cette formulation maintient l’ambiguïté entre la totalité du phénomène décrit et sa qualification globale, sans transformer nécessairement l’expression en affirmation sur chacune de ses parties.
translation_notes:
  register: Français international moderne, clair et soutenu. Le parallélisme antithétique du grec est conservé, ainsi que l’image de ce qui « a deux visages ». Aucun ajout explicatif ni marque confessionnelle.
