revisions:
- from: Cela souille l’âme et fait resplendir le corps ; cela en tue beaucoup et fait miséricorde à quelques-uns. Cela aussi a deux visages, mais l’ensemble est mauvais.
  to: Cela souille l’âme et fait resplendir le corps ; cela tue beaucoup de personnes et a pitié de quelques-unes. Cela aussi est à double face, mais l’ensemble est mauvais.
  rationale: 'Suppression de l’anaphore partitive non présente dans le grec. « Beaucoup de personnes » explicite seulement ce que l’accord masculin pluriel de πολλούς désigne dans un français naturel, sans identifier le groupe. « A pitié de » rend ἐλεεῖ de manière idiomatique sans surcharge théologique. « Est à double face » conserve l’image et la prédication grecques. Aucune note n’est requise : le passage ne porte pas de marqueur de note dans le texte fourni.'
