  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: fr
  text: Celui qui exploite son prochain[a] provoque Dieu, jure faussement par le Très-Haut et fait miséricorde au pauvre. Il rejette et irrite le Seigneur qui a prescrit la Loi, et soulage l’indigent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis comporte ici le mot « pauvres » au pluriel, dont le rattachement syntaxique est incertain. La traduction suit la construction claire : « exploite son prochain », puis « fait miséricorde au pauvre ».'
    reason: Signaler une difficulté réelle du texte source sans imposer silencieusement une reconstruction.
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: exploite
  rationale: Le verbe désigne le fait de tirer injustement avantage d’autrui, de léser ou de dépouiller. « Exploite » rend ce sens dans un français actuel sans le limiter à une fraude précise.
- source_word: ἐπιορκεῖ
  choice: se parjure
  rationale: Le verbe signifie prêter un faux serment ou violer son serment. Avec τὸν ὕψιστον, « se parjure par le Très-Haut » conserve la référence à celui par qui le serment est prononcé.
- source_word: ἐλεεῖ
  choice: prend … en pitié
  rationale: Cette expression rend l’acte de compassion indiqué par le verbe et maintient le contraste avec l’exploitation du prochain.
- source_word: ἐντολέα τοῦ νόμου
  choice: qui a prescrit la Loi
  rationale: ἐντολεύς désigne celui qui ordonne ou prescrit. La tournure évite de réduire le sens à « donateur » tout en restant naturelle en français.
- source_word: ἀθετεῖ
  choice: rejette
  rationale: Le verbe exprime ici le refus ou la mise à l’écart de l’autorité du Seigneur et de sa prescription.
- source_word: ἀναπαύει
  choice: soulage
  rationale: Littéralement, le verbe évoque le repos accordé. Appliqué à l’indigent, « soulage » exprime naturellement le secours qui lui procure du répit.
theological_decisions:
- issue: Juxtaposition d’actes mauvais et d’actes compatissants
  choice: Conserver les deux affirmations en marquant leur contraste par « pourtant »
  alternative: Coordonner uniformément toutes les propositions par « et » ou supprimer les mentions de compassion
  rationale: Le grec attribue paradoxalement au même individu l’exploitation et le parjure, mais aussi la compassion envers le pauvre. Ce contraste correspond au thème de la conduite double et ne doit pas être harmonisé ou supprimé.
- issue: Rapport du Seigneur à la Loi
  choice: « le Seigneur qui a prescrit la Loi »
  alternative: « le Seigneur, donateur de la Loi »
  rationale: La formulation suit plus directement ἐντολέα, « celui qui ordonne/prescrit », sans introduire une conception confessionnelle particulière de la promulgation de la Loi.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la tension morale du grec sont conservés. « Loi » prend une majuscule parce qu’il s’agit ici de la Loi divine.
