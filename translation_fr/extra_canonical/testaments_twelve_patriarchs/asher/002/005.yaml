review_pass:
  verdict: revise
  source_fidelity: La série d’actions et le contraste moral sont bien conservés. Toutefois, « commet l’injustice » est un calque peu naturel de ἀδικεῖ, qui exprime le fait d’agir injustement. « Cherche à s’enrichir » affaiblit πλεονεκτεῖ, terme qui dénote l’avidité et la recherche d’un avantage ou gain excessif.
  naturalness: Le texte est globalement clair et de registre approprié. « Agit injustement » est plus idiomatique que « commet l’injustice ». « Est avide de gain » restitue naturellement la nuance de πλεονεκτεῖ sans introduire un objet que le grec ne précise pas.
  terminology: « Pille », « fait miséricorde aux pauvres », « à double face » et « mauvais » sont recevables. L’expression « à double face » conserve utilement l’image de διπρόσωπον, sans la réduire à une interprétation doctrinale telle que « hypocrite ».
  issues:
  - severity: medium
    issue: « commet l’injustice » traduit ἀδικεῖ de façon peu idiomatique.
    rationale: Le grec emploie un verbe général signifiant agir injustement ou faire du tort; la formulation proposée est plus naturelle en français moderne.
  - severity: medium
    issue: « cherche à s’enrichir » atténue πλεονεκτεῖ.
    rationale: Le terme vise l’avidité, le désir d’avoir davantage ou le profit cupide, et non simplement la recherche de richesse, qui peut être moralement neutre.
  revised_text: Un autre vole, agit injustement, pille, est avide de gain et fait miséricorde aux pauvres. Cela aussi est à double face, mais l’ensemble est mauvais.
