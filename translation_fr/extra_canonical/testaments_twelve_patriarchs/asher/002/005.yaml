base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: fr
  text: Un autre vole, agit injustement, pille, est avide de gain et fait miséricorde aux pauvres. Cela aussi est à double face, mais l’ensemble est mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικεῖ
  choice: commet l’injustice
  rationale: Rend le verbe de manière naturelle tout en conservant sa portée générale, sans le limiter à un tort particulier.
- source_word: ἁρπάζει
  choice: pille
  rationale: Exprime l’idée de s’emparer avec violence ou rapacité et maintient la distinction avec « vole ».
- source_word: πλεονεκτεῖ
  choice: cherche à s’enrichir
  rationale: Rend ici la recherche avide d’un gain supérieur ou injuste dans une formulation française courante, sans réduire le terme à un simple état psychologique.
- source_word: ἐλεεῖ πτωχούς
  choice: fait miséricorde aux pauvres
  rationale: Conserve le vocabulaire moral de la miséricorde et l’objet explicite « les pauvres ».
- source_word: διπρόσωπον
  choice: à double face
  rationale: Préserve l’image grecque d’un comportement présentant deux faces opposées, centrale dans le contexte.
- source_word: τὸ δὲ ὅλον πονηρόν
  choice: mais l’ensemble est mauvais
  rationale: Maintient le jugement porté sur la totalité de cette conduite mêlée, sans préciser au-delà du grec le sens de πονηρόν.
theological_decisions:
- issue: Valeur morale des actes mêlés
  choice: « mais l’ensemble est mauvais »
  alternative: « mais, dans son ensemble, cet homme est mauvais »
  rationale: Le neutre grec demeure ambigu quant au référent exact; la traduction vise l’ensemble décrit sans transformer explicitement le propos en jugement ontologique sur la personne.
- issue: Relation entre cupidité et miséricorde
  choice: Coordination simple par « et »
  alternative: « et pourtant fait miséricorde »
  rationale: Le grec coordonne les actes sans particule adversative; ne pas ajouter « pourtant » préserve la forme et laisse le contraste émerger du contenu.
translation_notes:
  register: Français international moderne, digne et accessible. La série verbale est conservée, ainsi que l’image frappante de la « double face ». Aucun marqueur de note n’est requis.
