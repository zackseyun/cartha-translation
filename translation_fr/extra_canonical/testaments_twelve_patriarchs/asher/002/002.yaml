source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν⁸ ἄνθρωπος ὃς⁹ οὐκ οἰκτείρει¹⁰ *λειτουργοὺς αὐτοῦ¹¹. καίγε τοῦτο διπρόσωπον¹², ἀλλὰ τὸ ὅλον πονηρόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: fr
  text: Il y a un homme qui ne prend pas en pitié ses serviteurs ; et bien que cela soit à double visage, l’ensemble est mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ οἰκτείρει
  choice: n’a pas compassion de
  rationale: Rend naturellement en français le sens de ne pas éprouver ou manifester de pitié envers quelqu’un, tout en conservant le registre moral du grec.
- source_word: λειτουργοὺς αὐτοῦ
  choice: ses serviteurs
  rationale: Dans ce contexte, λειτουργούς désigne ceux qui sont à son service; «ses» suffit à rendre αὐτοῦ sans ajouter l’insistance de «ses propres».
- source_word: διπρόσωπον
  choice: présente un double visage
  rationale: Conserve l’image grecque des «deux visages» et l’ambivalence morale qu’elle exprime, sans la réduire d’emblée à la seule hypocrisie.
- source_word: τὸ ὅλον πονηρόν ἐστιν
  choice: c’est entièrement mauvais
  rationale: Rend l’évaluation globale formulée par τὸ ὅλον, dans un français clair et idiomatique.
theological_decisions:
- issue: Portée morale de διπρόσωπον
  choice: Maintien de la métaphore du double visage
  alternative: «cela aussi est ambigu» ou «cela aussi est hypocrite»
  rationale: Le grec décrit littéralement quelque chose de «double-faced»; conserver l’image évite de trancher entre duplicité, ambivalence et apparence contrastée.
- issue: Référent de τὸ ὅλον
  choice: «c’est entièrement mauvais»
  alternative: «l’ensemble est mauvais»
  rationale: Le neutre grec résume le comportement évoqué. La formulation choisie garde cette portée globale sans introduire un référent doctrinal supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La seconde phrase reste volontairement proche de l’image grecque malgré son caractère énigmatique, afin de préserver l’ambiguïté du passage.
