revisions:
- from: Il y a un homme qui n’a pas compassion de ses serviteurs. Cela aussi présente un double visage, mais c’est entièrement mauvais.
  to: Il y a un homme qui ne prend pas en pitié ses serviteurs ; et bien que cela soit à double visage, l’ensemble est mauvais.
  rationale: La révision conserve le sens moral et l’ambiguïté de l’original, tout en corrigeant le lien concessif de la seconde proposition et en rendant explicitement τὸ ὅλον comme un ensemble plutôt que comme un adverbe d’intensité.
