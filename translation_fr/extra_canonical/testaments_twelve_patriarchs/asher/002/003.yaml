source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: fr
  text: Il y a aussi l’homme qui aime celui qui agit avec méchanceté — ce qui est méchanceté[a] —, puisqu’il choisit lui aussi de mourir dans le mal. À ce propos, il est évident que l’ensemble[b] a deux visages, mais que tout cela est une mauvaise action.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots grecs traduits par « ce qui est méchanceté » sont textuellement incertains.
    reason: L’édition signale ὃ ἐστι πονηρία comme un segment corrompu ou douteux.
  - marker: b
    text: Le texte grec traduit ici par « l’ensemble » est incertain; le sens exact de la proposition demeure difficile.
    reason: L’édition place τὸ ὅλον entre signes de critique textuelle, et la syntaxe de la phrase est obscure.
lexical_decisions:
- source_word: πονηρευόμενον
  choice: celui qui agit avec méchanceté
  rationale: Le participe présent décrit une personne en train d’agir de manière mauvaise, sans réduire le terme à une identité figée comme « le méchant ».
- source_word: αἱρεῖται
  choice: il choisit
  rationale: Rend directement l’idée de préférence ou de choix volontaire portée par le moyen αἱρεῖται.
- source_word: διπρόσωπον
  choice: présente un double visage
  rationale: Conserve l’image littérale du mot grec et son idée probable de duplicité, sans imposer une interprétation psychologique trop précise.
- source_word: κακὴ πρᾶξις
  choice: une mauvaise action
  rationale: Traduction simple et directe de l’expression, qui évalue l’acte sur le plan moral.
theological_decisions:
- issue: Sujet implicite de « choisit de mourir »
  choice: Conserver « il » sans ajouter « lui-même » ni « à cause de cet homme »
  alternative: « parce que lui-même choisit aussi de mourir dans le mal à cause de cet homme »
  rationale: Le grec ne contient pas explicitement de pronom intensif ni de complément causal équivalent à « à cause de cet homme ». La traduction évite d’importer les précisions interprétatives de la couche anglaise.
- issue: Rapport entre duplicité et mauvaise action
  choice: Maintenir la tension entre « double visage » et « le tout est une mauvaise action »
  alternative: Expliquer que l’homme est hypocrite ou partagé entre le bien et le mal
  rationale: Le passage formule une opposition difficile sans en donner une explication doctrinale univoque; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La structure reste volontairement proche du grec dans les deux segments textuellement incertains. « Présente un double visage » garde l’image antique tout en restant compréhensible aujourd’hui.
