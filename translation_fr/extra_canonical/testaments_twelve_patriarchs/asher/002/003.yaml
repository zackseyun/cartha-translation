  rationale: La révision conserve les segments douteux et leurs notes, mais évite d’assigner sans nécessité περὶ τούτου à la seule personne mentionnée. Elle rend aussi plus directement la prédication de διπρόσωπον tout en gardant l’image et l’ambiguïté du grec.
