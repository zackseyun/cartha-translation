revisions:
- from: Il y a aussi l’homme qui aime celui qui agit avec méchanceté — ce qui est méchanceté[a] —, puisqu’il choisit même de mourir dans le mal. À son sujet, il est évident que l’ensemble[b] présente un double visage, mais que le tout est une mauvaise action.
