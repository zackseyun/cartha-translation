revisions:
- from: Un autre commet l’adultère et se livre à l’immoralité sexuelle, tout en s’abstenant de certains aliments. Même lorsqu’il jeûne, il fait le mal ; par le pouvoir de la richesse, il entraîne beaucoup de gens à leur perte et, dans sa méchanceté démesurée, il observe les commandements. Voilà une conduite à double face, mais entièrement mauvaise.
  to: Un autre commet l’adultère, se livre à l’immoralité sexuelle et s’abstient d’aliments. Tout en jeûnant, il fait le mal ; par le pouvoir de la richesse, il entraîne beaucoup de gens à leur perte et, dans sa méchanceté démesurée, observe les commandements. Cela est à double face, mais tout cela est mauvais.
  rationale: La révision retire la restriction non exprimée « certains », maintient sans explication doctrinale le paradoxe entre méchanceté et observance des commandements, et rend la conclusion comme un jugement sur l’ensemble décrit. Aucune note n’est nécessaire, car les ambiguïtés pertinentes restent visibles dans le texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend avec justesse les principaux contrastes du grec : adultère, porneia, abstinence alimentaire, jeûne joint au mal, puissance de la richesse, entraînement destructeur d’autrui et accomplissement paradoxal des commandements. Cependant, « certains aliments » introduit une restriction absente de ἐδεσμάτων, qui signifie simplement « aliments/nourritures ». La conclusion gagnerait aussi à garder le référent global et neutre de τὸ δὲ ὅλον.'
  naturalness: Le français est moderne et clair. « Tout en jeûnant » rend naturellement le participe νηστεύων. « Cela est à double face » conserve l’image sans imposer l’interprétation plus étroite d’« hypocrisie ».
  terminology: « Commet l’adultère », « se livre à l’immoralité sexuelle », « observe les commandements » et « entraîne ... à leur perte » sont appropriés. « Pouvoir de la richesse » restitue correctement δυναστείᾳ τοῦ πλούτου sans attribuer explicitement la richesse au personnage.
  issues:
  - severity: low
    issue: Ajout de « certains » devant « aliments »
    rationale: Le grec ἀπέχεται ἐδεσμάτων ne précise pas qu’il ne s’agit que de certains aliments. L’abstinence peut porter sur des aliments en général ou sur des aliments déterminés par un contexte non explicité ; la traduction ne doit pas choisir cette dernière possibilité.
  - severity: low
    issue: Référent de la conclusion légèrement particularisé
    rationale: « Voilà une conduite ... mais entièrement mauvaise » est idiomatique, mais introduit « conduite » et fait porter « entièrement mauvaise » sur ce nom féminin. Le neutre τὸ δὲ ὅλον vise plus directement l’ensemble de ce qui vient d’être décrit.
  revised_text: Un autre commet l’adultère, se livre à l’immoralité sexuelle et s’abstient d’aliments. Tout en jeûnant, il fait le mal ; par le pouvoir de la richesse, il entraîne beaucoup de gens à leur perte et, dans sa méchanceté démesurée, observe les commandements. Cela est à double face, mais tout cela est mauvais.
  revised_footnotes: []
  revision_rationale: La révision retire la restriction non exprimée « certains », maintient sans explication doctrinale le paradoxe entre méchanceté et observance des commandements, et rend la conclusion comme un jugement sur l’ensemble décrit. Aucune note n’est nécessaire, car les ambiguïtés pertinentes restent visibles dans le texte.
