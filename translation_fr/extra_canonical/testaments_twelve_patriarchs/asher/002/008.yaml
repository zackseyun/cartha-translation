base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: fr
  text: Un autre commet l’adultère, se livre à l’immoralité sexuelle et s’abstient d’aliments. Tout en jeûnant, il fait le mal ; par le pouvoir de la richesse, il entraîne beaucoup de gens à leur perte et, dans sa méchanceté démesurée, observe les commandements. Cela est à double face, mais tout cela est mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  choice: commet l’adultère et se livre à l’immoralité sexuelle
  rationale: Distingue l’adultère du terme plus large πορνεύει dans un français moderne et clair.
- source_word: ἀπέχεται ἐδεσμάτων
  choice: s’abstenant de certains aliments
  rationale: Rend l’idée d’abstinence alimentaire sans laisser entendre une privation totale de nourriture, puisque le contexte évoque une pratique ascétique.
- source_word: κακοποιεῖ
  choice: il fait le mal
  rationale: Traduction directe et naturelle, qui conserve la portée générale du verbe.
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: par le pouvoir de la richesse
  rationale: Préserve l’idée que la richesse confère une puissance ou une influence.
- source_word: πολλοὺς κατασύρει
  choice: il entraîne beaucoup de gens à leur perte
  rationale: Exprime le mouvement destructeur de κατασύρει, plus fort qu’un simple fait d’influencer.
- source_word: ἐκ τῆς ὑπερόγκου κακίας
  choice: dans sa méchanceté démesurée
  rationale: Restitue l’intensité de ὑπέρογκος tout en reliant naturellement le motif paradoxal au verbe suivant.
- source_word: ποιεῖ τὰς ἐντολάς
  choice: il observe les commandements
  rationale: Expression française idiomatique pour l’accomplissement des commandements, sans résoudre le paradoxe moral du texte.
- source_word: διπρόσωπον
  choice: une conduite à double face
  rationale: Conserve la métaphore des deux faces tout en explicitant que le jugement porte sur la conduite décrite.
- source_word: τὸ δὲ ὅλον κακόν ἐστιν
  choice: mais entièrement mauvaise
  rationale: 'Rend le jugement global : malgré l’apparence de bien, l’ensemble est mauvais.'
theological_decisions:
- issue: Valeur morale de l’observance des commandements accomplie dans la méchanceté
  choice: 'Conserver le paradoxe : « dans sa méchanceté démesurée, il observe les commandements »'
  alternative: Reformuler comme une observance hypocrite ou motivée par le mal
  rationale: Le grec juxtapose explicitement la méchanceté excessive et l’accomplissement des commandements. La traduction ne précise donc ni la motivation ni la nature exacte de cette observance.
- issue: Sens de διπρόσωπον
  choice: Maintenir l’image de la double face
  alternative: Traduire par « hypocrite » ou « ambivalent »
  rationale: Les solutions interprétatives réduiraient la tension entre actes ascétiques, actes mauvais et jugement global.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe souligne les contrastes moraux sans transformer le passage en explication doctrinale.
