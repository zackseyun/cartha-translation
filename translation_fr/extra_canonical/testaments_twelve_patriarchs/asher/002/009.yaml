source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Οἱ τοιοῦτοί εἰσι⁶¹ δασύποδες, ὅτι⁶² ἐξ ἡμισείας εἰσὶ καθαροί, τὸ δ᾽ ἀληθὲς⁶³ ἀκάθαρτοί εἰσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: fr
  text: 'De telles personnes sont semblables aux lièvres : elles ne sont pures qu’à moitié, mais en vérité, elles sont impures.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δασύποδες
  choice: semblables aux lièvres
  rationale: Le terme signifie littéralement « aux pieds velus », mais sert à désigner les lièvres. La formulation comparative exprime naturellement en français l’image appliquée à des personnes.
- source_word: ἐξ ἡμισείας
  choice: qu’à moitié
  rationale: Rend directement l’idée d’une pureté partielle, tout en conservant le contraste avec l’impureté réelle.
- source_word: τὸ δ᾽ ἀληθές
  choice: mais en vérité
  rationale: Préserve l’opposition explicite entre l’apparence partiellement pure et la réalité.
- source_word: ἀκάθαρτοι
  choice: impures
  rationale: Conserve le vocabulaire rituel et moral du passage sans en préciser davantage le sens.
theological_decisions:
- issue: Contraste entre pureté partielle et impureté véritable
  choice: 'Maintenir la tension littérale : « pures qu’à moitié » / « en vérité… impures »'
  alternative: Reformuler comme une simple hypocrisie ou une fausse pureté
  rationale: Le grec juxtapose volontairement les deux affirmations sans expliquer ni résoudre leur tension; la traduction ne doit pas imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. L’image ancienne du lièvre est conservée, avec une syntaxe naturelle pour un lectorat contemporain.
