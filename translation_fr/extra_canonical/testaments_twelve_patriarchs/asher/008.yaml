  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: fr
  text: '**Testament d’Aser 8**


    **1** Après leur avoir dit cela, il leur donna cet ordre : « Enterrez-moi à Hébron. » Puis il mourut, s’étant endormi d’un bon sommeil.[a] **2** Ses fils firent ce qu’il leur avait ordonné : ils le transportèrent à Hébron et l’enterrèrent avec ses pères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec associe l’affirmation directe « il mourut » à l’expression « s’étant endormi d’un bon sommeil ». Le texte grec édité signale en outre cette dernière tournure comme textuellement incertaine.
    reason: Formulation littérale et incertitude textuelle
lexical_decisions:
- source_word: ἐνετείλατο
  choice: il leur donna cet ordre / il leur avait ordonné
  rationale: Le verbe exprime une instruction faisant autorité. La première formulation convient naturellement à l’introduction du discours direct, tandis que la seconde rend clairement le rappel narratif du même ordre.
- source_word: Θάψατέ
  choice: Enterrez-moi
  rationale: L’impératif direct est rendu simplement et fermement, sans ajouter d’idée absente du grec.
- source_word: Χεβρών
  choice: Hébron
  rationale: Forme française conventionnelle du nom de lieu biblique.
- source_word: ἀπέθανεν
  choice: il mourut
  rationale: Le verbe énonce explicitement la mort et doit rester distinct de l’image du sommeil qui suit.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: s’étant endormi d’un bon sommeil
  rationale: Cette formulation conserve l’image et la répétition étymologique du sommeil présentes en grec, au lieu de les réduire à l’interprétation « paisiblement ».
- source_word: ἀπήγαγον
  choice: ils le transportèrent
  rationale: Dans ce contexte funéraire, le verbe désigne le déplacement du corps vers Hébron. « Transportèrent » est clair et naturel en français.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: Le choix conserve la formule traditionnelle de parenté et d’ensevelissement, sans l’élargir au terme plus général « ancêtres ».
theological_decisions:
- issue: La mort décrite au moyen de l’image du sommeil
  choice: Conserver à la fois « il mourut » et « s’étant endormi d’un bon sommeil »
  alternative: Fusionner les deux expressions en « il mourut paisiblement » ou ne garder que « il s’endormit »
  rationale: Le grec juxtapose l’affirmation explicite de la mort et l’image traditionnelle du sommeil. Maintenir les deux préserve la tension et la texture du texte sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au bref récit testamentaire. La répétition volontaire autour du sommeil est maintenue malgré son caractère inhabituel en français, car elle porte une image importante du texte grec.
