base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: fr
  text: '1. Voyez, mes enfants, comment il y en a deux en toutes choses, l’une opposée à l’autre, et l’une est cachée sous l’autre : dans la création, l’avidité[a] ; dans la réjouissance, l’ivresse ; dans le rire, le chagrin ; dans le mariage, la débauche. 2. La mort succède à la vie, le déshonneur à la gloire, la nuit au jour, les ténèbres à la lumière. Mais toutes choses sont sous le jour : ce qui est juste, sous la vie, et ce qui est injuste, sous la mort. C’est pourquoi la vie éternelle, elle aussi, attend la mort[b]. 3. On ne peut dire que la vérité est mensonge, ni que ce qui est juste est injuste, car toute vérité est sous la lumière, tout comme toutes choses sont sous Dieu[c]. 4. J’ai donc éprouvé toutes ces choses au cours de ma vie, et je ne me suis pas écarté de la vérité du Seigneur ; j’ai recherché les commandements du Très-Haut, marchant de toute ma force.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la convoitise » (πλεονεξία).
    reason: lexical_alternative
  - marker: b
    text: La phrase « la vie éternelle, elle aussi, attend la mort » est difficile tant sur le plan textuel que conceptuel. La traduction conserve la formulation grecque au lieu d’en paraphraser le sens.
    reason: textual_variant
  - marker: c
    text: 'Dans ce chapitre, la répétition de « sous » indique probablement une sphère morale ou cosmique : « sous le jour… sous la vie… sous la mort… sous la lumière… sous Dieu ».'
    reason: cultural_note
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Voyez
  rationale: Impératif direct qui convient à l’exhortation paternelle et conserve la vigueur de l’ouverture.
- source_word: τέκνα
  choice: mes enfants
  rationale: Rend l’adresse affectueuse propre au genre testamentaire ; le possessif est naturel en français dans cette apostrophe.
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: deux réalités ... l’une opposée à l’autre
  rationale: « Réalités » explicite légèrement le substantif sous-entendu sans réduire l’énoncé à de simples « côtés » ; la structure antithétique est maintenue.
- source_word: κέκρυπται
  choice: est cachée sous
  rationale: Conserve le passif parfait et anticipe le motif répété de ὑπό, sans en fixer précisément la portée.
- source_word: πλεονεξία
  choice: avidité
  rationale: Terme moderne et clair pour le désir d’avoir davantage ; « convoitise » reste possible et figure en note.
- source_word: εὐφροσύνη
  choice: réjouissance
  rationale: Désigne une joie festive susceptible de dissimuler l’ivresse, sans imposer un cadre trop précis.
- source_word: μέθη
  choice: ivresse
  rationale: Équivalent direct et naturel du vice désigné.
- source_word: πένθος
  choice: chagrin
  rationale: Convient au contraste avec le rire et couvre la peine sans limiter le sens au deuil rituel.
- source_word: ἀσωτία
  choice: débauche
  rationale: Dans le contexte du mariage, exprime le dérèglement moral et la dissipation mieux que le seul gaspillage.
- source_word: διαδέχεται
  choice: succède à
  rationale: Reproduit précisément l’idée de succession et permet une série elliptique fluide en français.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: ce qui est juste / ce qui est injuste
  rationale: Préserve la valeur neutre et catégorielle des pluriels grecs sans les transformer en groupes de personnes.
- source_word: ἐξεζήτησα
  choice: j’ai recherché
  rationale: Rend l’effort soutenu suggéré par le composé, dans un français naturel.
- source_word: κατὰ πᾶσαν ἰσχύν μου πορευόμενος
  choice: marchant de toute ma force
  rationale: Conserve la métaphore de la marche et l’engagement total exprimé par le grec.
theological_decisions:
- issue: Sens du paradoxe διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει
  choice: C’est pourquoi la vie éternelle, elle aussi, attend la mort.
  alternative: C’est pourquoi, au-delà de la mort, il y a aussi la vie éternelle.
  rationale: La syntaxe grecque fait le plus naturellement de « la vie éternelle » le sujet et de « la mort » l’objet. La traduction maintient le paradoxe au lieu de le résoudre par une paraphrase doctrinale.
- issue: Portée des expressions répétées avec ὑπό
  choice: Conserver « sous » dans le texte principal.
  alternative: Traduire par « appartient à », « relève de » ou « se trouve du côté de ».
  rationale: La répétition construit un motif rhétorique et peut exprimer une sphère, une autorité ou une relation cosmique. Le maintien de « sous » préserve cette ambiguïté.
- issue: Relation entre les vices et les réalités dans lesquelles ils sont cachés
  choice: Conserver la formulation symétrique « dans… » sans affirmer que chaque réalité est mauvaise en elle-même.
  alternative: Paraphraser comme une condamnation de la richesse, de la joie, du rire et du mariage.
  rationale: Le grec présente un vice caché au sein d’une réalité contrastée ; il ne justifie pas de transformer toute la série en condamnation absolue de ces réalités.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe aphoristique et les parallélismes du grec sont conservés, avec des ellipses naturelles au verset 2. Les formulations volontairement étranges, notamment « sous le jour » et « la vie éternelle… attend la mort », ne sont pas normalisées afin de préserver l’ambiguïté du texte source.
