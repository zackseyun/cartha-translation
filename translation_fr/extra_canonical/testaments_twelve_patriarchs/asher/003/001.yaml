id: T12P.ASH.3.1
reference: Testament of Asher 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: III. Ὑμεῖς¹ δὲ², *τέκνα μου³, μὴ γίνεσθε *κατ᾽ αὐτοὺς⁴ διπρόσωποι, ἀγαθότητος καὶ κακίας, ἀλλὰ τῇ ἀγαθότητι μόνῃ⁵ κολλήθητε, ὅτι ⌜Κύριος⌝⁶ ὁ Θεὸς *ἀναπαύεται ἐν⁷ αὐτῇ⁸, καὶ οἱ ἄνθρωποι *αὐτὴν ποθοῦσιν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: fr
  text: Mais vous, mes enfants, ne devenez pas comme eux des êtres à double face[a], partagés entre la bonté et le mal. Attachez-vous plutôt à la seule bonté, car le Seigneur Dieu repose en elle, et les humains la désirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à deux visages ». Le terme grec évoque un caractère moralement divisé, et non pas seulement un manque de sincérité envers les autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: διπρόσωποι
  choice: des êtres à double face
  rationale: Rend concrètement l’image grecque des « deux visages » tout en désignant ici un caractère moralement divisé, et non seulement l’hypocrisie sociale.
- source_word: ἀγαθότητος καὶ κακίας
  choice: partagés entre la bonté et le mal
  rationale: La construction grecque précise en quoi consiste le double visage; « partagés entre » explicite naturellement ce rapport sans supprimer la tension morale.
- source_word: κολλήθητε
  choice: Attachez-vous
  rationale: Conserve l’idée forte d’adhérer étroitement à quelque chose, dans un français naturel et digne.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: repose en elle
  rationale: Maintient la métaphore et le pronom féminin qui renvoie à la bonté, sans interpréter davantage la nature de ce repos.
- source_word: οἱ ἄνθρωποι
  choice: les humains
  rationale: Désigne l’humanité en général de façon claire et inclusive, conformément à la portée générique du grec.
theological_decisions:
- issue: Le repos de Dieu dans la bonté
  choice: le Seigneur Dieu repose en elle
  alternative: le Seigneur Dieu trouve son repos en elle
  rationale: La formulation retenue suit de près le grec et préserve l’expression théologique inhabituelle sans l’expliquer ni l’atténuer.
- issue: Nature de la duplicité morale
  choice: à double face, partagés entre la bonté et le mal
  alternative: hypocrites dans le bien et le mal
  rationale: Le texte décrit une division morale entre bonté et mal; le rendre simplement par « hypocrites » réduirait indûment la portée de l’image.
translation_notes:
  register: Français international moderne, accessible et digne. La tournure imagée « à double face » est conservée et éclairée par le contexte ainsi que par une note; la répétition de « bonté » respecte le fil lexical du grec.
