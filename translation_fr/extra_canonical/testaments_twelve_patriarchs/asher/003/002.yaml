source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: fr
  text: Mais fuyez la méchanceté, en anéantissant son dessein grâce à vos bonnes actions ; car les gens à double face ne sont pas de Dieu, mais ils sont esclaves de leurs propres désirs, afin de plaire à Béliar[a] et à leurs semblables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béliar est la forme grecque du nom souvent rendu par Bélial.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: la méchanceté
  rationale: Rend le mal moral exprimé par κακία dans un français courant et digne.
- source_word: ἀποδράσατε
  choice: fuyez
  rationale: Impératif énergique correspondant au sens de s’enfuir ou d’échapper.
- source_word: τὸ διαβούλιον
  choice: ses desseins
  rationale: Le terme désigne un projet ou dessein délibéré ; le possessif explicite naturellement son lien avec la méchanceté.
- source_word: διπρόσωποι
  choice: les gens à double face
  rationale: Conserve l’image grecque de duplicité sans la réduire à une simple étiquette interprétative.
- source_word: οὐκ εἰσὶ τοῦ Θεοῦ
  choice: n’appartiennent pas à Dieu
  rationale: Exprime naturellement en français la relation d’appartenance marquée par le génitif.
- source_word: δουλεύουσιν
  choice: ils sont esclaves de
  rationale: Préserve la force du verbe, qui évoque l’asservissement plutôt qu’un simple service volontaire.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française de la forme grecque du nom.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: aux hommes qui leur ressemblent
  rationale: Maintient la proposition finale présente dans la source grecque, malgré son absence dans le texte anglais de consultation.
theological_decisions:
- issue: Relation des gens à double face avec Dieu
  choice: n’appartiennent pas à Dieu
  alternative: ne sont pas de Dieu
  rationale: La formulation choisie est idiomatique et conserve l’affirmation d’appartenance sans préciser davantage sa portée théologique.
- issue: Référent de « leur » dans la dernière proposition
  choice: aux hommes qui leur ressemblent
  alternative: aux hommes semblables à Béliar
  rationale: Le pluriel αὐτῶν renvoie le plus naturellement aux personnes à double face ou asservies à leurs désirs ; la traduction préserve ce lien sans importer une identification doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La structure exhortative et l’image de la double face sont conservées, tandis que la ponctuation explicite le contraste et la conséquence.
