revisions:
- from: 'Mais fuyez la méchanceté et détruisez ses desseins par vos bonnes actions, car les gens à double face n’appartiennent pas à Dieu : ils sont esclaves de leurs propres désirs, afin de plaire à Béliar[a] et aux hommes qui leur ressemblent.'
  to: Mais fuyez la méchanceté, en anéantissant son dessein grâce à vos bonnes actions ; car les gens à double face ne sont pas de Dieu, mais ils sont esclaves de leurs propres désirs, afin de plaire à Béliar[a] et à leurs semblables.
  rationale: La révision rétablit le singulier de τὸ διαβούλιον et rend la fonction du participe ἀναιροῦντες avec « en anéantissant ». Elle conserve sans interprétation confessionnelle la formule οὐκ εἰσὶ τοῦ Θεοῦ et inclut, conformément au grec, le dernier complément absent de l’audit anglais.
