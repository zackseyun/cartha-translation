  text: Καὶ⁸ ἐποίησαν οἱ υἱοὶ αὐτοῦ ὅσα⁹ ἐνετείλατο αὐτοῖς, καὶ¹⁰ *ἀπήγαγον αὐτὸν ἐν Χεβρὼν καὶ ἔθαψαν αὐτὸν¹¹ μετὰ τῶν πατέρων αὐτοῦ¹².
