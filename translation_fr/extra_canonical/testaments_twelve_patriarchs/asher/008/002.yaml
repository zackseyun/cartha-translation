  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: fr
  text: Ses fils firent tout ce qu’il leur avait ordonné. Ils l’emmenèrent à Hébron et l’ensevelirent avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν … ὅσα ἐνετείλατο αὐτοῖς
  choice: firent ce qu’il leur avait ordonné
  rationale: Rend naturellement en français l’accomplissement de tout ce qui avait été prescrit, sans alourdir la phrase.
- source_word: ἀπήγαγον αὐτὸν
  choice: Ils l’emmenèrent
  rationale: Le verbe exprime le fait de conduire ou d’emporter quelqu’un vers un autre lieu; dans ce contexte funéraire, « l’emmenèrent » reste digne et évite d’ajouter explicitement « le corps », absent du grec.
- source_word: ἐν Χεβρών
  choice: à Hébron
  rationale: La préposition grecque est ici rendue idiomatiquement comme destination après un verbe de déplacement.
- source_word: ἔθαψαν αὐτὸν
  choice: l’ensevelirent
  rationale: Terme funéraire courant dans un registre biblique moderne et digne.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Préserve l’expression familiale ancestrale et son sens sépulcral, sans la remplacer par une interprétation explicative.
theological_decisions:
- issue: Sens de « ses pères »
  choice: Conserver « ses pères »
  alternative: « ses ancêtres »
  rationale: Le grec emploie littéralement « pères ». Cette formulation peut désigner les ancêtres ou leur lieu de sépulture; la conserver respecte l’imagerie et la légère latitude du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Deux phrases sont employées pour une lecture fluide, tout en conservant l’enchaînement narratif du grec.
