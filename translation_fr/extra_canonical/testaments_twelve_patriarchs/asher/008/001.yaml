  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: fr
  text: 'Après leur avoir dit cela, il leur donna cet ordre : « Enterrez-moi à Hébron. » Et il mourut, s’étant endormi dans un bon sommeil[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque est textuellement incertaine; elle signifie littéralement « s’étant endormi dans un bon sommeil ».
    reason: Le texte édité signale ce passage par une dague, marque habituelle d’une leçon tenue pour incertaine ou corrompue; la note informe le lecteur sans corriger conjecturalement le texte.
lexical_decisions:
- source_word: ἐνετείλατο λέγων
  choice: il leur donna cet ordre
  rationale: Cette formulation française naturelle rend l’idée de commander et évite le calque lourd « il leur ordonna en disant ».
- source_word: Θάψατέ με
  choice: Enterrez-moi
  rationale: Impératif direct et courant correspondant exactement à la demande d’ensevelissement.
- source_word: Χεβρών
  choice: Hébron
  rationale: Forme française traditionnelle et moderne du nom de lieu.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: s’étant endormi d’un bon sommeil
  rationale: Conserve la répétition étymologique et l’expression inhabituelle du grec, ainsi que l’image de la mort comme sommeil, sans la reformuler en une affirmation théologique plus précise.
theological_decisions:
- issue: La mort décrite comme un sommeil
  choice: 'Conserver l’image : « s’étant endormi d’un bon sommeil »'
  alternative: « après une mort paisible » ou « s’étant paisiblement éteint »
  rationale: Le grec juxtapose explicitement « il mourut » et le langage du sommeil. La traduction préserve cette tension sans déterminer ce qu’elle implique quant à l’état des morts.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe narrative a été allégée, mais l’expression finale volontairement inhabituelle du grec a été conservée et expliquée en note.
