lexical_decisions:
- source_word: καθῆκα
  choice: je fixai
  rationale: Le verbe, dans ce contexte matériel, exprime l’action de placer ou d’attacher solidement; « fixai » rend naturellement ce sens en français.
- source_word: ξύλον
  choice: un morceau de bois
  rationale: ξύλον peut désigner du bois ou une pièce de bois; l’expression française précise ici un objet matériel sans en déterminer indûment la forme.
- source_word: ὄπισθεν αὐτοῦ
  choice: derrière lui
  rationale: Le pronom grec est au masculin singulier. « Lui » en conserve le genre et évite de remplacer arbitrairement le référent par un neutre.
