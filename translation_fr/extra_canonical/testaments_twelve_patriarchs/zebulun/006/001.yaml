source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VI. Πρῶτος ⌈οὖν⌉¹ ἐγὼ ἐποίησα σκάφος² ἐπιπλέειν³ ἐν τῇ⁴ θαλάσσῃ, ὅτι Κύριος ἔδωκέ μοι ⌈*σύνεσιν καὶ σοφίαν⁵⌉ ἐν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: fr
  text: Ainsi, j’ai d’abord fabriqué un bateau pour naviguer sur la mer, car le Seigneur m’avait donné, en cela, intelligence et sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉ ἐγώ
  choice: Ainsi, j’ai été le premier
  rationale: Πρῶτος est pris comme attribut du sujet (« le premier »), tandis que οὖν marque la continuité logique ou narrative (« ainsi »). Cette formulation française est plus naturelle que « Premièrement donc, moi ».
- source_word: ἐποίησα σκάφος
  choice: à fabriquer un bateau
  rationale: σκάφος désigne une embarcation ou un bateau; « fabriquer » rend clairement ἐποίησα dans ce contexte d’invention ou de construction.
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  choice: pour naviguer sur la mer
  rationale: L’infinitif exprime ici la fonction de l’embarcation; « naviguer sur la mer » est idiomatique et fidèle au sens.
- source_word: σύνεσιν καὶ σοφίαν
  choice: l’intelligence et la sagesse
  rationale: Le binôme grec est conservé sans fusionner les deux notions.
- source_word: ἐν αὐτῷ
  choice: m’en
  rationale: Le référent exact du pronom est peu net en grec. « m’en avait donné » rattache prudemment le don divin à cette entreprise ou capacité sans imposer le bateau comme lieu matériel de la sagesse.
theological_decisions:
- issue: Origine divine de l’habileté technique
  choice: « car le Seigneur m’en avait donné l’intelligence et la sagesse »
  alternative: « car le Seigneur m’avait donné en cela intelligence et sagesse »
  rationale: La traduction maintient que l’intelligence et la sagesse viennent du Seigneur, sans développer une doctrine particulière de l’inspiration ou de la providence.
translation_notes:
  register: Français international moderne, courant et digne. La tournure met naturellement en relief la revendication de priorité exprimée par Πρῶτος et conserve le lien causal avec le don du Seigneur.
