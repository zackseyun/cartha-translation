base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: fr
  text: 'C’est pourquoi il est écrit dans le livre de la loi de Moïse : « Celui qui ne veut pas susciter une descendance à son frère, qu’on lui retire sa sandale et qu’on lui crache au visage. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: dans le livre de la loi de Moïse
  rationale: « Livre » rend naturellement γραφή dans cette référence à un texte écrit, tandis que la construction française explicite clairement son lien avec la loi de Moïse.
- source_word: ἀναστῆσαι σπέρμα
  choice: donner une descendance
  rationale: L’expression grecque signifie littéralement « susciter une semence », c’est-à-dire assurer une descendance au frère; la formulation retenue est claire en français moderne sans effacer la portée familiale de l’expression.
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: qu’on lui retire sa sandale
  rationale: Le passif grec est rendu par le pronom indéfini « on », naturel en français et sans identification supplémentaire de l’agent.
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: qu’on lui crache au visage
  rationale: Rend directement l’acte public d’humiliation, en conservant le passif impersonnel du contexte.
theological_decisions:
- issue: Sens de l’obligation envers le frère décédé
  choice: donner une descendance à son frère
  alternative: susciter une postérité à son frère
  rationale: La traduction exprime la pratique léviratique sans ajouter d’explication doctrinale et reste accessible au lectorat moderne.
translation_notes:
  register: Français international moderne, digne et direct. La citation conserve une tonalité juridique grâce à « qu’on lui retire » et « qu’on lui crache », tout en évitant le calque peu naturel « susciter une semence ».
