  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/008.yaml
  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: fr
  text: Et les frères de Joseph ne voulurent pas épargner la vie de leur frère, et le Seigneur leur ôta la sandale qu’ils portaient contre Joseph, leur frère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec transmis est difficile, surtout dans la première proposition et dans l’expression concernant la sandale. Le sens général semble être que les frères refusèrent d’épargner Joseph et que le Seigneur leur ôta la sandale qu’ils portaient contre lui.
    reason: Signaler les difficultés textuelles et syntaxiques, notamment la leçon problématique autour de « vie », sans résoudre ni expliquer l’image de la sandale.
lexical_decisions:
- source_word: οὐκ ἠθέλησαν †ζωὴν ἀδελφοῦ αὐτῶν
  choice: ne voulurent pas laisser vivre leur frère
  rationale: Le texte transmis est difficile ou corrompu autour de ζωὴν. Cette formulation française exprime naturellement le refus de préserver la vie du frère, sans introduire l’idée moins probable de « relever la vie ».
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: leur retira la sandale
  rationale: Le tour grec est inhabituel, mais le verbe évoque l’action de délier ou d’ôter une chaussure. « Retira » conserve l’image concrète et la relation de dépossession.
- source_word: ὃ ἐφόρεσαν κατὰ Ἰωσὴφ
  choice: qu’ils avaient portée contre Joseph
  rationale: La traduction garde la métaphore énigmatique de la sandale « portée contre » Joseph, au lieu de l’expliquer par une interprétation non explicitée dans le texte.
theological_decisions:
- issue: Sens du jugement divin symbolisé par la sandale
  choice: Conserver l’image sans l’expliciter
  alternative: Interpréter la sandale comme le prix de la vente de Joseph ou comme un symbole précis de culpabilité
  rationale: Le passage lui-même n’explique pas nettement le symbole; une traduction ne doit pas imposer une lecture théologique ou narrative particulière.
translation_notes:
  register: Français international moderne, sobre et digne. « Laisser vivre » est idiomatique tout en restant proche du sens contextuel; la répétition finale de « leur frère » préserve l’insistance du grec.
