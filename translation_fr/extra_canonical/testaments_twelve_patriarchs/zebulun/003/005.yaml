  text: For I had no share in his price, my children.
translation:
  language: fr
  text: Car je n’ai pas eu part au prix de sa vente, mes enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίμημα
  choice: le prix payé pour lui
  rationale: Le nom désigne ici le prix obtenu en échange de Joseph. Cette formulation française explicite naturellement la relation exprimée par αὐτοῦ sans ajouter de contenu étranger au contexte.
- source_word: ἐκοινώνησα
  choice: je n’ai pas eu de part
  rationale: Le verbe signifie participer ou avoir part à quelque chose. La tournure retenue conserve l’idée que Zabulon n’a pas participé au produit de la vente.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Traduction directe et naturelle de l’adresse affectueuse.
