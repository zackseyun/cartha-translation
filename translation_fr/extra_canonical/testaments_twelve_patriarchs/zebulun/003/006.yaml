base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: fr
  text: 'en disant : « Nous ne la mangerons pas, car c’est le prix du sang de notre frère. Piétinons-la plutôt, puisqu’il a dit qu’il régnerait sur nous ; et nous verrons alors ce que sont ses rêves. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ φαγόμεθα αὐτήν
  choice: Nous ne la mangerons pas
  rationale: Le pronom féminin renvoie à la somme reçue pour Joseph ; le français permet de conserver cette reprise pronominale sans ajouter un référent absent du verset.
- source_word: τιμὴ ... αἵματος
  choice: le prix du sang
  rationale: « Prix » rend ici la somme obtenue en échange du sang, c’est-à-dire de la vie, de leur frère, et préserve la force de l’expression grecque.
- source_word: καταπατήσωμεν αὐτήν
  choice: Piétinons-la
  rationale: L’impératif français rend naturellement le subjonctif exhortatif grec à la première personne du pluriel.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: qu’il régnerait sur nous
  rationale: Cette formulation restitue directement l’idée de royauté et de domination exprimée par βασιλεύω avec ἐπί.
- source_word: τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: ce que valent ses rêves
  rationale: L’expression grecque est littéralement « ce que sont ses rêves » ; en français idiomatique, « ce que valent » exprime leur défi méprisant quant à leur portée ou leur accomplissement.
theological_decisions:
- issue: Portée du « sang » du frère
  choice: Conserver l’expression concrète « le prix du sang de notre frère »
  alternative: Expliciter « le prix obtenu en vendant notre frère »
  rationale: Le texte associe directement la somme au sang du frère, avec une tension morale forte qu’une explicitation risquerait d’atténuer.
- issue: Sens de la question finale sur les rêves
  choice: « ce que valent ses rêves »
  alternative: « ce que sont ses rêves » ou « ce qu’il adviendra de ses rêves »
  rationale: Le grec demeure bref et provocateur. Le choix retenu garde le défi sans préciser abusivement s’il porte sur la nature, la validité ou l’accomplissement des rêves.
translation_notes:
  register: Français moderne, courant et digne. Le discours direct garde le ton résolu et méprisant des frères. « Piétinons-la » est plus naturel que « foulons-la aux pieds » tout en conservant l’image grecque.
