  naturalness: Le français est moderne, fluide et le ton méprisant est bien rendu. « Piétinons-la » est une bonne restitution naturelle de l’exhortation. « Ce que sont ses rêves » reste compréhensible en français littéraire courant et est préférable ici à une paraphrase interprétative.
