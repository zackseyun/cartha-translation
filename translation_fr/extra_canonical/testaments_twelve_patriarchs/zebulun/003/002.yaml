  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: fr
  text: 'Entre-temps, Ruben se leva et dit : « Venez, mes frères, ne le tuons pas, mais jetons-le dans l’une de ces citernes sèches, que nos pères ont creusées sans trouver d’eau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: Entre-temps
  rationale: Expression française naturelle qui rend la transition temporelle et le léger contraste porté par δέ.
- source_word: Δεῦτε
  choice: Venez
  rationale: Rend directement l’exhortation adressée aux frères, sans ajouter une nuance absente du grec.
- source_word: ξηρῶν λάκκων
  choice: citernes sèches
  rationale: Dans ce contexte, λάκκος désigne une fosse creusée pour recueillir de l’eau; « citerne » est précis et idiomatique, tandis que « sèches » traduit explicitement ξηρῶν.
- source_word: ὤρυξαν ... καὶ οὐχ εὗρον ὕδωρ
  choice: ont creusées sans trouver d’eau
  rationale: 'Formulation française fluide qui conserve la succession logique: les pères les ont creusées, mais n’y ont trouvé aucune eau.'
