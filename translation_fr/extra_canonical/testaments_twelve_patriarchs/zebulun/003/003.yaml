source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: fr
  text: C’est pourquoi le Seigneur empêcha l’eau de jaillir en eux, afin qu’on prenne des dispositions pour Joseph.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin qu’il y ait une περιποίησις pour Joseph ». Ce terme peut évoquer une provision ou une sauvegarde.'
    reason: Conserve l’ambiguïté sémantique de περιποίησις sans alourdir le texte principal.
lexical_decisions:
- source_word: ἀναβλῦσαι ὕδωρ
  choice: l’eau de jaillir
  rationale: Rend naturellement l’idée de l’eau qui surgit ou jaillit, sans préciser une source absente du grec.
- source_word: ἐν αὐτοῖς
  choice: en eux
  rationale: Conserve le pronom masculin pluriel du texte grec et son renvoi au contexte antérieur, sans introduire explicitement un antécédent.
- source_word: γένηται περιποίησις τῷ Ἰωσήφ
  choice: afin que Joseph soit préservé
  rationale: Dans ce contexte, περιποίησις exprime la sauvegarde ou la préservation de Joseph. La tournure passive française restitue clairement l’expression grecque idiomatique « qu’il y ait préservation pour Joseph ».
theological_decisions:
- issue: Finalité de l’intervention du Seigneur
  choice: afin que Joseph soit préservé
  alternative: afin que des ressources soient prévues pour Joseph
  rationale: Le sens de sauvegarde convient au nom περιποίησις et au contexte où l’absence d’eau empêche la mort de Joseph. La traduction ne développe aucune explication doctrinale supplémentaire.
translation_notes:
  register: Français moderne, digne et accessible. « Car c’est pour cette raison » maintient le lien explicatif de διὰ γὰρ τοῦτο. Le texte grec fourni ne contient pas « son frère » ; cette précision n’a donc pas été ajoutée.
