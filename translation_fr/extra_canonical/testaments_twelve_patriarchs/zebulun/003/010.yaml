source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Οὐ μόνον δὲ προσεκύνησαν αὐτῷ⁴² ἀλλὰ καὶ ἐνεπτύσθησαν⁴³ παραχρῆμα⁴⁴ πεσόντες ἔμπροσθεν αὐτοῦ, καὶ⁴⁵ ἠσχύνθησαν⁴⁶ παρὰ⁴⁷ τῶν⁴⁸ Αἰγυπτίων⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: fr
  text: Et non seulement ils se prosternèrent devant lui, mais on leur cracha aussi dessus aussitôt après qu’ils furent tombés devant lui, et ils furent couverts de honte par les Égyptiens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκύνησαν
  choice: ils se prosternèrent
  rationale: Le verbe désigne ici un geste d’hommage ou de soumission accompli devant quelqu’un; « se prosterner » exprime naturellement ce geste sans lui imposer nécessairement un sens cultuel.
- source_word: ἐνεπτύσθησαν
  choice: on leur cracha dessus
  rationale: 'La forme grecque est un aoriste passif pluriel de ἐμπτύω : ils subirent l’action, contrairement à la couche anglaise révisée qui la comprend comme active. La tournure impersonnelle française rend clairement ce passif.'
- source_word: παραχρῆμα πεσόντες ἔμπροσθεν αὐτοῦ
  choice: aussitôt tombés devant lui
  rationale: Cette formulation conserve la valeur immédiate de παραχρῆμα et le participe circonstanciel πεσόντες, ainsi que la répétition de leur position devant lui.
- source_word: ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων
  choice: ils furent couverts de honte par les Égyptiens
  rationale: Le passif accompagné de παρὰ avec le génitif désigne les Égyptiens comme agents de leur humiliation; « couverts de honte » donne un français actuel et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction suit directement la morphologie grecque, notamment le passif ἐνεπτύσθησαν, tout en maintenant le rattachement explicite de « par les Égyptiens » au dernier verbe, comme dans la syntaxe source.
