base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/001.yaml
  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: fr
  text: Quand Joseph me vit pleurer avec lui et vit les frères s’avancer pour le tuer, il se réfugia derrière moi et me supplia de lui venir en aide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ
  choice: me vit pleurer avec lui
  rationale: Rend naturellement l’idée de pleurer avec Joseph, tout en conservant la relation exprimée par le préfixe συν-.
- source_word: ἐπερχομένους
  choice: s’avancer
  rationale: Exprime le mouvement menaçant des frères vers Joseph sans ajouter un détail absent du grec.
- source_word: ἀνελεῖν
  choice: pour le tuer
  rationale: Dans ce contexte, l’infinitif signifie mettre à mort; «tuer» est direct, clair et actuel.
- source_word: κατέφυγον ὄπισθεν μου
  choice: il se réfugia derrière moi
  rationale: Conserve l’image concrète de Joseph cherchant protection derrière Zabulon.
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: me supplia de lui venir en aide
  rationale: Formulation française idiomatique qui préserve l’insistance de la supplication et le fait que l’aide est demandée en faveur de Joseph.
theological_decisions: []
