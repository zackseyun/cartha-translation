base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/009.yaml
  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: fr
  text: En effet, lorsqu’ils arrivèrent en Égypte, les serviteurs de Joseph leur retirèrent leurs sandales à l’extérieur du portail. Ils se prosternèrent ainsi devant Joseph selon le cérémonial observé devant le roi Pharaon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le modèle du roi Pharaon » ; le grec peut évoquer la manière ou le cérémonial en usage devant lui.'
    reason: La syntaxe finale est compacte et quelque peu ambiguë. La note conserve une formulation plus littérale et signale l’éventail de sens de τύπος.
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: leur retirèrent leurs sandales
  rationale: Le verbe ὑπολύω signifie ici délier ou enlever ce que l’on porte aux pieds; l’ajout explicite de « sandales » rend naturellement en français le complément sous-entendu.
- source_word: ὑπὸ τῶν παίδων Ἰωσήφ
  choice: les serviteurs de Joseph
  rationale: παῖδες peut désigner des enfants, de jeunes gens ou des serviteurs. Dans cette scène d’accueil officiel, « serviteurs » convient au contexte sans surinterprétation.
- source_word: ἔξωθεν τοῦ πυλῶνος
  choice: à l’extérieur du portail
  rationale: πυλών désigne un grand portail ou une entrée monumentale plutôt qu’une simple porte.
- source_word: προσεκύνησαν τῷ Ἰωσήφ
  choice: ils se prosternèrent devant Joseph
  rationale: προσκυνέω exprime ici un geste physique d’hommage et de soumission devant un haut personnage.
- source_word: κατὰ τὸν τύπον
  choice: selon le cérémonial observé
  rationale: τύπος peut signifier modèle, forme ou manière prescrite; « cérémonial observé » communique ici une conduite protocolaire de cour.
- source_word: βασιλέως Φαραώ
  choice: le pharaon-roi
  rationale: La construction grecque associe les titres « roi » et « Pharaon ». Cette formulation française les conserve sans suggérer deux personnes.
theological_decisions:
- issue: Nature de la prosternation devant Joseph
  choice: geste d’hommage protocolaire
  alternative: acte cultuel d’adoration
  rationale: Le parallèle explicite avec le cérémonial devant Pharaon situe le geste dans le cadre de la cour. La traduction « se prosternèrent » conserve néanmoins le geste sans en imposer l’interprétation théologique.
translation_notes:
  register: Français moderne, digne et narratif. « En effet » maintient le lien explicatif de καὶ γάρ. La phrase est divisée en deux pour une lecture naturelle, sans modifier la succession des actions.
