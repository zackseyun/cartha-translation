    rationale: '« Alors » marque principalement la succession temporelle, tandis que οὕτως introduit le résultat ou la manière : « ainsi ». La révision conserve les deux actions tout en restituant ce lien.'
  - severity: low
    issue: « le pharaon-roi » est peu naturel et reflète maladroitement βασιλέως Φαραώ.
    rationale: La construction est mieux rendue en français par « le roi Pharaon ». Cette formulation ne suggère pas deux personnages et correspond au titre apposé dans le grec.
