revisions:
- from: En effet, lorsqu’ils arrivèrent en Égypte, les serviteurs de Joseph leur retirèrent leurs sandales à l’extérieur du portail. Alors ils se prosternèrent devant Joseph selon le cérémonial observé devant le pharaon-roi.[a]
  to: En effet, lorsqu’ils arrivèrent en Égypte, les serviteurs de Joseph leur retirèrent leurs sandales à l’extérieur du portail. Ils se prosternèrent ainsi devant Joseph selon le cérémonial observé devant le roi Pharaon.[a]
  rationale: La révision ajoute « ainsi » pour rendre οὕτως et remplace l’expression non idiomatique « pharaon-roi » par « roi Pharaon », dans le texte comme dans la note. Elle maintient l’interprétation protocolaire, contextuellement indiquée, tout en préservant dans la note l’ambiguïté lexicale de τύπος.
