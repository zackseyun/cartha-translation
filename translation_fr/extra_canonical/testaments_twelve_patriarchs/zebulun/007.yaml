  text: 1[a]. Therefore, my children, have compassion in mercy toward every person, so that the Lord also may have compassion in mercy toward you. 2. Because in the last days you also will send forth your compassion upon the earth, and wherever the Most High finds a heart of compassion, there he dwells. 3. For in the measure that a man has compassion on his neighbors, so also the Lord has compassion on him. 4. And when we came down into Egypt, Joseph my brother tested us, and he learned that I was compassionate. 5. For when I sat by him, I did not grieve him with envy, and I did not speak bitterly against him. 6. And after these things, my children, I urge you not to hold malice in your hearts against one another[b], and to love one another in deed and in word. 7. For in the presence of my father I spoke peaceably to Joseph; and when I had gone out, Dan told us that the prince of the eunuchs was seeking to destroy him, because he had become attached to him as a pure and good young man. 8.
    But I wept over Joseph, and I prayed for him, that the Lord would deliver him from every evil intention. 9. And afterward the Ishmaelites came and took him away, and they persuaded him to go with them, and they sold him to Potiphar in Egypt. 10. But because of the compassion that I had shown to my brother, the Lord did not let me fall into the same testing. 11. And when all my brothers were sick, and our father was grieving because of them, I had compassion on every poor man and every sick man, and I gave to all in simplicity of heart. 12. And if I had nothing to give to the needy, I walked with him for seven stadia, weeping with him in mercy. 13. Therefore, my children, have compassion in mercy toward every person with a good heart, so that God also may give you compassion and mercy. 14. For if a man does not have compassion on his neighbor, he provokes the Lord. 15. And if he hardens his heart, and does not have compassion on his neighbor, and does not help the poor, the Lord will
    judge him. 16. For throughout all my life I did not walk in crookedness, but in all simplicity. 17. I did not set my mind on silver or gold, or on any glory of men. 18. I did not wear a double face. 19. I did not devise evil against my neighbor. 20. I did not corrupt my speech with many-colored words. 21. I walked with all men in simplicity of heart. 22. Therefore, my children, do you also have these things, and every spirit of Beliar will flee from you, and no deed of wicked men will rule over you; and every wild beast you will master, since you have with you the God of heaven and earth and walk with men in simplicity of heart. 23. And after he had said these things, he commanded them to carry his body to Hebron and to bury it with his fathers. 24. And when he had fallen asleep at a good old age, his sons laid him in a coffin. 25[c][d]. And afterward they carried him up to Hebron and buried him with his fathers.
translation:
  language: fr
  text: '**Testament de Zabulon 7**


    1. Je tendis une toile sur une autre pièce de bois dressée au milieu[a]. 2. À bord, je parcourais les rivages et je pêchais des poissons pour la maison de mon père, jusqu’à ce que nous arrivions en Égypte. 3. Pris de compassion pour tout étranger, je partageais avec lui le produit de ma pêche[b]. 4. Si quelqu’un était étranger, malade ou âgé, je faisais cuire les poissons, les préparais convenablement selon les besoins de chacun et les offrais à tous, partageant leur douleur et leur souffrance. 5. C’est pourquoi le Seigneur aussi remplissait mes filets d’une grande quantité de poissons. Car celui qui partage avec son prochain reçoit du Seigneur bien davantage. 6. Je pêchai donc pendant cinq ans, partageant avec toute personne que je voyais et pourvoyant aux besoins de toute la maison de mon père. 7. Et pendant l’hiver, j’en préparais la moitié avec mes frères[c].


    8. Si vous n’avez rien à donner à celui qui est dans le besoin, partagez sa souffrance avec une profonde compassion. 9. Je sais que, lorsque ma main ne trouvait rien à donner à celui qui était dans le besoin, je l’accompagnais sur sept stades[d] en pleurant avec lui ; au-dedans de moi, j’étais bouleversé de compassion pour lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La description grecque est difficile : elle parle littéralement d’une toile tendue « sur une autre pièce de bois dressée au milieu ». Il s’agit vraisemblablement de l’aménagement d’une embarcation, peut-être d’une voile et de son mât.'
    reason: textual_ambiguity
  - marker: b
    text: L’édition grecque place les versets 3 à 5, ainsi qu’une partie du verset 6, entre crochets, signalant leur statut textuel particulier dans la tradition manuscrite.
    reason: textual_variant
  - marker: c
    text: Le complément de « la moitié » n’est pas exprimé dans le grec. Il s’agit probablement de la moitié de la pêche, préparée ou conservée pour l’hiver.
    reason: textual_ambiguity
  - marker: d
    text: Sept stades correspondent approximativement à 1,3 kilomètre.
    reason: cultural_note
lexical_decisions:
- source_word: ὀθόνη
  choice: toile
  rationale: Le mot désigne une pièce de tissu ou une toile. Dans ce contexte de navigation, il peut s’agir d’une voile, mais la construction décrite reste obscure ; « toile » conserve la valeur lexicale sans imposer une reconstruction nautique.
- source_word: ξύλον ὀρθόν
  choice: pièce de bois dressée
  rationale: Rend concrètement le bois placé verticalement, sans l’identifier avec certitude à un mât.
- source_word: διαπορεύομαι τοὺς αἰγιαλούς
  choice: parcourir les rivages
  rationale: Expression naturelle en français qui garde le cadre côtier du grec.
- source_word: σπλαγχνίζομαι / σπλάγχνα
  choice: être pris de compassion / profonde compassion / au-dedans de moi, être bouleversé de compassion
  rationale: La famille de mots exprime une compassion viscérale. Les formulations françaises maintiennent ce thème tout en évitant l’image anatomique devenue peu naturelle.
- source_word: μεταδίδωμι
  choice: partager
  rationale: Le verbe indique le fait de donner une part de ce que l’on possède ; sa répétition est conservée aux versets 3, 5 et 6.
- source_word: συναλγέω καὶ συμπάσχω
  choice: partager leur douleur et leur souffrance
  rationale: Maintient les deux verbes coordonnés et leur insistance sur la participation à la détresse d’autrui.
- source_word: πολλοὺς ἰχθύας ἐνέπλησέ με ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: remplissait mes filets d’une grande quantité de poissons
  rationale: Le grec dit littéralement que le Seigneur le remplissait de nombreux poissons dans la pêche. « Mes filets » explicite naturellement le résultat de la prise, sans modifier le sens causal.
- source_word: ἐξαρκέω
  choice: pourvoir aux besoins
  rationale: Le verbe signifie suffire ou fournir assez ; cette tournure convient à l’entretien de toute la maisonnée.
- source_word: χρήζων
  choice: celui qui est dans le besoin
  rationale: Rend l’état de nécessité de manière claire et constante aux versets 8 et 9.
- source_word: στάδιον
  choice: stade
  rationale: Conserve l’unité de distance ancienne ; une note en donne l’équivalence approximative.
- source_word: ἐστρέφετο τὰ σπλάγχνα
  choice: au-dedans de moi, j’étais bouleversé
  rationale: Préserve la force corporelle et affective de l’expression grecque dans un français actuel et digne.
theological_decisions:
- issue: Lien entre le partage humain et la récompense du Seigneur
  choice: Conserver l’affirmation directe selon laquelle celui qui partage reçoit du Seigneur bien davantage.
  alternative: Réduire la phrase à une maxime générale sur les bienfaits de la générosité.
  rationale: Le grec attribue explicitement au Seigneur la rétribution abondante ; cette relation théologique ne doit être ni atténuée ni transformée en causalité impersonnelle.
- issue: Compassion sans aide matérielle possible
  choice: Présenter le partage de la souffrance comme la réponse requise lorsque l’on n’a rien à donner.
  alternative: Paraphraser comme un simple encouragement moral ou remplacer la compassion par une aide matérielle supposée.
  rationale: 'Les versets 8 et 9 maintiennent une tension importante : l’absence de biens à donner n’abolit pas l’obligation de compassion et de présence.'
- issue: Formulation de la bénédiction liée à la pêche
  choice: Dire que le Seigneur remplit les filets d’une grande quantité de poissons.
  alternative: Rendre la phrase comme une prospérité générale ou un miracle nettement défini.
  rationale: Le texte lie la pêche abondante à la générosité de Zabulon, sans préciser davantage le mode de l’action divine.
translation_notes:
  register: Français international moderne, clair et digne. La traduction suit le passage grec fourni plutôt que le texte anglais de consultation, qui correspond manifestement à un autre contenu sous la même référence. Les répétitions liées au partage, au besoin et à la compassion sont conservées. Les crochets éditoriaux ne sont pas reproduits dans le corps du texte afin de préserver la lisibilité, mais leur présence est signalée en note.
