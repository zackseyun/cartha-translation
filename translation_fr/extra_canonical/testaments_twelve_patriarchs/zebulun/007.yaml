    rationale: οὐχ εὗρε ἐπιδοῦναι signifie que sa main ne manquait pas de donner, et non qu'elle « ne trouvait rien à donner ». La formulation du projet est vraisemblablement influencée par le texte anglais, qui est ici un contenu différent.
