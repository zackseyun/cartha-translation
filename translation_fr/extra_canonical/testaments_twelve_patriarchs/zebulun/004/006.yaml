  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: fr
  text: Il prit l’argent et courut après les marchands. Mais, ne les ayant pas trouvés, il revint en se lamentant. Les marchands, eux, avaient quitté la grand-route et étaient passés à travers le pays des Troglodytes[a] par un chemin plus court.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les Troglodytes sont ici une population ancienne; l’expression désigne, dans cet itinéraire, le territoire qu’elle habitait.
    reason: Le nom ancien pourrait être pris à tort pour une désignation générique moderne; la note en précise la fonction géographique dans le contexte sans trancher davantage son identification.
lexical_decisions:
- source_word: ἀργύριον
  choice: l’argent
  rationale: Le terme désigne ici l’argent comme somme ou moyen de paiement, plutôt que le métal pris isolément.
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: courut après les marchands
  rationale: Rend directement le mouvement de poursuite exprimé par le verbe et la préposition.
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: il revint tout affligé
  rationale: Conserve à la fois le retour absent de la couche anglaise et la vive douleur exprimée par le participe grec.
- source_word: τὴν πλατεῖαν ὁδόν
  choice: la grand-route
  rationale: Expression française naturelle pour la route large ou principale opposée au raccourci.
- source_word: διὰ Τρωγλοδιτῶν
  choice: traversé le pays des Troglodytes
  rationale: Le grec signifie littéralement « à travers les Troglodytes »; en contexte itinéraire, il s’agit naturellement de leur territoire.
- source_word: ἐν συντόμῳ
  choice: par un raccourci
  rationale: Rend idiomatiquement l’idée d’un trajet plus court.
