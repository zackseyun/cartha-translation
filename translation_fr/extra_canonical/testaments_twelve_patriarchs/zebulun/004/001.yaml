source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: fr
  text: Car ils avaient appris tout le mal qui lui avait été fait. Après qu’il eut été vendu[a], mes frères s’assirent pour manger et boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis dit « vendu ». Une correction proposée d’après le contexte donne : « jeté dans la citerne ».'
    reason: La leçon grecque porte un signe de difficulté textuelle et ne correspond pas à la reconstruction contextuelle reflétée dans la version anglaise de consultation.
lexical_decisions:
- source_word: ἐνεδείξαντο αὐτῷ κακά
  choice: tout le mal qui lui avait été fait
  rationale: Cette formulation française naturelle rend l’idée des mauvais traitements infligés à Joseph sans préciser davantage l’agent, conformément à la formulation contextuelle du grec.
- source_word: πραθῆναι
  choice: eut été vendu
  rationale: Le texte grec transmis signifie « être vendu ». Ce choix suit directement la leçon fournie, même si le contexte narratif a conduit à proposer une autre lecture.
- source_word: ἐκάθησαν … ἐσθίειν καὶ πίνειν
  choice: s’assirent pour manger et boire
  rationale: Rend simplement et naturellement la construction grecque exprimant le fait de s’asseoir en vue de manger et de boire.
