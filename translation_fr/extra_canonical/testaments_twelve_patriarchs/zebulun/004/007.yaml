  text: Reuben was grieved, and he did not eat bread on that day. Then Dan came near and said to him,
translation:
  language: fr
  text: 'Ruben était affligé et ne mangea pas de pain ce jour-là. Dan s’approcha donc et lui dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενος
  choice: était affligé
  rationale: Le participe présent décrit l’état de tristesse ou de peine de Ruben; « affligé » conserve sa gravité sans préciser indûment la cause.
- source_word: οὐκ ἔφαγεν ἄρτον
  choice: ne mangea pas de pain
  rationale: Traduction directe de l’expression grecque, qui peut signaler qu’il s’abstint de manger; le terme concret « pain » est conservé.
- source_word: προσελθών
  choice: s’approcha
  rationale: Rend naturellement en français le mouvement exprimé par le participe aoriste grec.
- source_word: οὖν
  choice: donc
  rationale: Conserve l’articulation narrative ou déductive marquée par la particule grecque.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Formulation française idiomatique qui rend explicitement le destinataire indiqué par αὐτῷ.
