  text: 5. Ἐλθὼν δὲ Ῥουβὶμ καὶ ἀκούσας ὅτι ἐπράθη⁹ ἀπόντος *αὐτοῦ περιεσχίσατο¹¹ τὸν χιτῶνα αὐτοῦ θρηνῶν ἔλεγεν¹². Πῶς ὄψωμαι²⁴ τὸ πρόσωπον τοῦ πατρός μου Ἰακώβ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/005.yaml
  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: fr
  text: 'Lorsque Ruben arriva et apprit que Joseph avait été vendu en son absence, il déchira sa tunique et, en se lamentant, dit : « Comment pourrai-je voir le visage de mon père Jacob ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθη
  choice: avait été vendu
  rationale: Le passif aoriste indique que la vente avait déjà eu lieu lorsque Ruben l’apprit.
- source_word: ἀπόντος αὐτοῦ
  choice: pendant son absence
  rationale: Cette formulation rend naturellement en français le génitif absolu et maintient Ruben comme référent de αὐτοῦ.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: il déchira sa tunique
  rationale: χιτών désigne ici le vêtement porté par Ruben; « tunique » est précis et convient au contexte antique.
- source_word: θρηνῶν ἔλεγεν
  choice: dit en pleurant
  rationale: Le participe exprime la lamentation qui accompagne ses paroles; cette tournure est naturelle et digne en français.
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: Comment pourrai-je paraître devant
  rationale: L’expression littérale « voir le visage » a ici le sens idiomatique d’affronter la présence de son père; la traduction française en restitue la force sans lourdeur.
theological_decisions:
- issue: Référent implicite du sujet de ἐπράθη
  choice: Nommer Joseph
  alternative: « qu’il avait été vendu »
  rationale: Le grec laisse le sujet sous-entendu, mais le contexte narratif l’identifie comme Joseph. Le nom explicite évite en français une ambiguïté artificielle avec Ruben, sans introduire d’interprétation théologique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat tout en conservant le deuil de Ruben et sa crainte d’affronter Jacob.
