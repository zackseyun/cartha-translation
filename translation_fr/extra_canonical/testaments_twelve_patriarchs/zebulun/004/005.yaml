- from: 'Quand Ruben revint et apprit que Joseph avait été vendu pendant son absence, il déchira sa tunique et dit en pleurant : « Comment pourrai-je paraître devant mon père Jacob ? »'
  to: 'Lorsque Ruben arriva et apprit que Joseph avait été vendu en son absence, il déchira sa tunique et, en se lamentant, dit : « Comment pourrai-je voir le visage de mon père Jacob ? »'
