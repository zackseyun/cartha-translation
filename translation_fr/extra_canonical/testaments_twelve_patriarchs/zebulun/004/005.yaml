review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la vente, l’absence de Ruben, le geste de deuil et la question adressée à Jacob. Toutefois, Ἐλθών signifie d’abord « arriva/vint » et ne précise pas nécessairement un retour; « revint » est donc plus interprétatif. La formulation « paraître devant » explicite l’idiome, mais atténue l’image explicite du « visage » (τὸ πρόσωπον).
  naturalness: Le français est globalement fluide et de registre narratif approprié. « Lorsque Ruben arriva » et « voir le visage de mon père Jacob » sont naturels, tout en restant plus proches du grec. « En se lamentant » rend explicitement la valeur de θρηνῶν.
  terminology: « Ruben », « Joseph », « Jacob » et « tunique » conviennent. L’explicitation de Joseph est recevable dans ce contexte narratif et évite une ambiguïté française, sans enjeu doctrinal.
  issues:
  - severity: medium
    issue: « revint » dépasse la précision du grec Ἐλθών.
    rationale: Le grec dit que Ruben « vint/arriva »; il ne marque pas à lui seul le préfixe de retour. Il convient de conserver une formulation non plus précise que la source.
  - severity: low
    issue: « paraître devant mon père » remplace l’image du « visage ».
    rationale: L’expression grecque comporte explicitement τὸ πρόσωπον (« le visage »). Une traduction qui conserve cette image est à la fois naturelle et plus fidèle.
  - severity: low
    issue: La lamentation est rendue de façon un peu atténuée par « dit en pleurant ».
    rationale: θρηνῶν désigne la lamentation ou le deuil. « En se lamentant » rend plus exactement la nuance sans alourdir le français.
  revised_text: 'Lorsque Ruben arriva et apprit que Joseph avait été vendu en son absence, il déchira sa tunique et, en se lamentant, dit : « Comment pourrai-je voir le visage de mon père Jacob ? »'
