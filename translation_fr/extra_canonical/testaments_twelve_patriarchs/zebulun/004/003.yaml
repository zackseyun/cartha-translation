  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: fr
  text: Quand ils virent que moi non plus je ne mangeais pas, on me chargea de le garder jusqu’à ce qu’il soit vendu aux Ismaélites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  choice: Quand ils virent que je ne mangeais pas, moi non plus
  rationale: Rend naturellement la construction participiale et conserve l’idée contextuelle d’association portée par δέ et reflétée dans la tradition anglaise par « also ».
- source_word: ἔθετό με τηρεῖν αὐτόν
  choice: ils me chargèrent de le garder
  rationale: Le grec exprime l’affectation de Zabulon à la garde de Joseph; cette formulation est idiomatique en français tout en conservant le sens.
- source_word: ἕως οὗ ἀπεδόθη τοῖς Ἰσμαηλίταις
  choice: jusqu’à ce qu’il soit vendu aux Ismaélites
  rationale: Le passif ἀπεδόθη signifie ici qu’il fut cédé ou vendu; « vendu » convient au contexte narratif, et τοῖς Ἰσμαηλίταις désigne les acquéreurs.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la première personne du témoignage et nomme explicitement les Ismaélites, présents dans le texte grec mais omis dans la couche anglaise fournie.
