  text: « Ne pleure pas et ne t’afflige pas, car nous avons trouvé quoi dire à notre père. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ κλαῖε
  choice: Ne pleure pas
  rationale: Rend directement l’impératif présent négatif, adressé à une seule personne.
- source_word: μηδὲ λυποῦ
  choice: et ne sois pas accablé
  rationale: λυπέομαι peut exprimer la tristesse, la peine ou la détresse ; « être accablé » communique ici une profonde affliction dans un français naturel.
- source_word: εὕρομεν
  choice: nous avons trouvé
  rationale: Conserve le sens concret du verbe et l’aspect accompli de l’aoriste.
- source_word: τί εἴπωμεν
  choice: ce que nous dirons
  rationale: Dans ce contexte délibératif, le subjonctif aoriste porte sur les paroles à adresser au père ; le futur français est idiomatique sans préciser davantage la modalité.
- source_word: τῷ πατρὶ ἡμῶν
  choice: à notre père
  rationale: Traduction directe du datif de destinataire et du possessif pluriel.
