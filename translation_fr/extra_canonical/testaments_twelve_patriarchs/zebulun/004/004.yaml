source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '4. (α-text omits this verse; β-text reads: ἐποίησε δὲ ἐν τῷ λάκκῳ τρεῖς ἡμέρας καὶ τρεῖς νύκτας καὶ οὕτως ἐπράθη ἄσιτος.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/004.yaml
  text: He spent three days and three nights in the pit, and so he was sold while fasting.
translation:
  language: fr
  text: '[a] Il passa trois jours et trois nuits dans la fosse, et c’est ainsi qu’il fut vendu sans avoir mangé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent du texte α ; il figure dans le texte β.
    reason: 'La tradition grecque présente une variante majeure : omission intégrale du verset dans le texte α.'
lexical_decisions:
- source_word: ἐποίησε … τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: Il passa trois jours et trois nuits
  rationale: En contexte temporel, ποιέω avec une durée signifie naturellement « passer » ce laps de temps.
- source_word: ἐν τῷ λάκκῳ
  choice: dans la fosse
  rationale: « Fosse » rend λάκκος dans le contexte du lieu où Joseph a été jeté.
- source_word: καὶ οὕτως ἐπράθη
  choice: puis il fut vendu
  rationale: La tournure marque la suite et l’aboutissement des événements; le passif de πιπράσκω est conservé.
- source_word: ἄσιτος
  choice: sans avoir mangé
  rationale: Cette formulation française naturelle exprime le fait d’être resté privé de nourriture, sans suggérer nécessairement un jeûne religieux volontaire.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste concise, et « sans avoir mangé » évite la possible connotation religieuse de « à jeun » ou « en jeûnant ».
