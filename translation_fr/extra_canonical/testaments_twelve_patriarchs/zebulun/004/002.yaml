- from: Mais moi, pris de compassion pour Joseph, je ne mangeai pas ; je restai attentif près de la citerne, parce que Juda craignait que Siméon, Dan et Gad ne se précipitent sur lui et ne le tuent.
  to: Mais moi, par compassion pour Joseph, je ne mangeai pas, mais je surveillais la fosse, car Juda craignait que Siméon, Dan et Gad ne bondissent et ne le tuent.
  rationale: La révision remplace la localisation ajoutée et la spécification « citerne » par « je surveillais la fosse », qui exprime l’attention durable de προσέχων τῷ λάκκῳ. Elle rend ἀποπηδήσαντες par « ne bondissent », afin de conserver le mouvement brusque sans en imposer la direction. Le sens narratif et la relation causale explicitement attribuée à la crainte de Juda sont maintenus.
