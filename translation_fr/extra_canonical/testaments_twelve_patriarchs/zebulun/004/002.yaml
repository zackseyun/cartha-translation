base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: fr
  text: Mais moi, par compassion pour Joseph, je ne mangeai pas, mais je surveillais la fosse, car Juda craignait que Siméon, Dan et Gad ne bondissent et ne le tuent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: pris de compassion
  rationale: Rend naturellement en français le profond mouvement de compassion exprimé par le participe grec.
- source_word: οὐκ ἔφαγον
  choice: je ne mangeai pas
  rationale: Traduction directe de l’aoriste, dans un registre narratif digne.
- source_word: προσέχων δὲ τῷ λάκκῳ
  choice: je restai attentif près de la citerne
  rationale: Le verbe indique une attention soutenue dirigée vers la fosse ; « citerne » convient au contexte du récit de Joseph sans ajouter qu’il la gardait formellement.
- source_word: ἀποπηδήσαντες
  choice: ne se précipitent sur lui
  rationale: Le participe évoque un mouvement brusque, littéralement un bond ; cette formulation française en exprime la violence sans lourdeur.
- source_word: ἀνέλωσιν αὐτόν
  choice: ne le tuent
  rationale: Dans ce contexte, ἀναιρέω signifie mettre à mort.
theological_decisions:
- issue: Motif de la vigilance de Zabulon
  choice: Maintenir la crainte de Juda comme cause explicitement donnée
  alternative: Présenter Zabulon comme gardant la citerne de sa propre initiative
  rationale: La syntaxe grecque rattache la vigilance à la crainte de Juda, tout en laissant intacte la compassion personnelle de Zabulon.
translation_notes:
  register: Français moderne international, narratif et digne. Le passé simple convient au registre testamentaire. La tournure « craignait que… ne » emploie un ne explétif standard, sans valeur négative.
