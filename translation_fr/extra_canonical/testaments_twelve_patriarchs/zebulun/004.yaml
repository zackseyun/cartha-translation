  text: 'After he had been thrown into the pit[a], my brothers sat down to eat and drink. But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Gad might leap up and kill him. And when they saw that I also was not eating, they set me to guard him until he was sold. He spent three days and three nights in the pit, and so he was sold while fasting.


    When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?” And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes. Reuben was grieved, and on that day he ate no bread.


    Then Dan came up to him and said, “Do not weep or be distressed; for we have found what we shall say to our father. Let us slaughter a male goat with the sword, stain Joseph’s tunic, and send it to Jacob our father, saying, ‘Look whether this is the tunic of your son.’” And they did so. Therefore Jacob bewailed Joseph all his days.


    And my brothers were afraid, and they all repented because of what they had done to Joseph. But the Egyptians and the Ishmaelites did him no harm, because the Lord did not allow them to do evil to him.


    For he was a handsome man, good-looking and beautiful in appearance, and there was no spite in him, but he was gentle and had a simple soul. Therefore be compassionate, my children[b], because compassion is good for all. And mercy, even if a man is a sinner, if he has compassion, the Lord will count it as righteousness for him. And even if he prospers, if he has no compassion, the Lord will destroy him.


    For in the days of famine I remembered the compassion of the Lord, and I gave to all the stranger, the fatherless, and the widow. And when I was forty years old, I took a wife, for my life had been spent in toil and labor, and because of my simplicity I had no wealth. For my father had blessed me, saying, “Your sons shall be like a haven for sailors, and like a harbor for ships.”


    And now, my children, I command you: have compassion toward every man with mercy, so that the Lord also may have compassion on you. Because in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will rise up against Judah; but you will not prevail against them, for an angel of the Lord will guide them both, because by them Israel will stand.


    And whenever you depart from the Lord, you will walk in every evil and commit the abominations of the nations, going astray after women and being enslaved by every wickedness while the spirits of deceit work in you. For I have read in the writing of Enoch that your sons also will be corrupted in the last days, and will commit lawlessness against the sons of Levi, and will sin against Judah. But they will not be able to stand against them; for from Levi the Lord will raise up a priest, and from Judah a king, God and man. He will save all the nations and the race of Israel.


    And now I command you, my children: obey Zebulun your father, and have mercy on your neighbors, and compassion on all, not only on men, but also on the cattle. For because of this the Lord blessed me, and when all my brothers were sick, I remained without sickness; for the Lord knows the intention of each man.


    Have compassion, therefore, in your inward parts, my children, because in whatever way a man does to his neighbor, so also the Lord will do to him. For I saw the sons of my brothers sickening and dying because they had no compassion; but my sons were kept unharmed, as you know. For in the days of Canaan I made no gain from a balance of weights, nor did I have in my house a double measure, but all my possessions were shared with all in singleness of heart. And I did not remember evil against anyone. Even to the age of old age I kept my integrity in all things.


    You also, therefore, my children, keep the law of the Lord, and show mercy to your neighbor, and deal compassionately with all, not only with men but also with irrational animals. Because of this also I found mercy with the Lord, and all men blessed me, and the Lord increased my goods a thousandfold. For the compassionate man does good to his own soul.


    Know, therefore, my children, that in the last times you will depart from the Lord, and you will be divided in Israel, and you will follow two evils, and you will not be found in the assembly of the righteous. But after these things the Lord himself will arise for you, the light of righteousness, and he will heal and save all. And he will bring back the captives from Beliar, and he will turn disobedient hearts to the Lord, and he will grant everlasting peace to those who call on him.


    And the saints shall rest in Eden, and in the New Jerusalem the righteous shall rejoice, and it shall be for the glory of God forever. And Jerusalem shall no longer endure desolation, nor shall Israel be led captive; for the Lord will be in her midst, dwelling among men, and the Holy One of Israel will reign over them in humility and poverty. And whoever believes in him shall reign in truth in the heavens.


    And now, my children, fear the Lord your God, and beware of Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men for the peace of Israel. He will stand against the kingdom of the enemy; therefore the enemy is eager to destroy all who call on the Lord. For he knows that on the day when Israel repents, the kingdom of the enemy will be brought to an end.


    For the angel of peace himself will strengthen Israel, so that it may not fall into the extremity of evil. And in the time of Israel’s lawlessness the Lord will not abandon them, but will transform them into a nation that does his will; for no angel is equal to him. His name is in every place in Israel and among the nations.


    Keep yourselves, therefore, from every evil deed, and cast away hatred and every deceit, and love one another in truth and with patience. And the things that I have heard from my father, hand on to your children, so that the Savior of the nations may receive you; for he is gentle and humble, and by his own example he teaches the law of God.


    Flee, therefore, from all unrighteousness, and cling to the righteousness of the law of the Lord, and your seed will be forever, and you will be blessed in all your generations.


    And after he had commanded them these things, he stretched out his feet and died in a good old age. And his sons laid him in a coffin[g][f][e][d][c]. Later they carried him up to Hebron and buried him with his fathers.'
translation:
  language: fr
  text: 'Après qu’on l’eut jeté dans la citerne[a], mes frères s’assirent pour manger et boire. Mais moi, ému de compassion pour Joseph, je ne mangeai pas. Je veillais près de la citerne, car Juda craignait que Siméon et Gad[b] ne se précipitent sur lui et ne le tuent. Quand ils virent que je ne mangeais pas, ils me chargèrent de le garder jusqu’à ce qu’il soit vendu aux Ismaélites. Il passa trois jours et trois nuits dans la citerne, puis fut vendu sans avoir mangé.


    Lorsque Ruben revint et apprit que Joseph avait été vendu en son absence, il déchira sa tunique et dit en pleurant : « Comment pourrai-je regarder mon père Jacob en face ? » Il prit l’argent et courut à la poursuite des marchands, mais il ne les trouva pas. Ceux-ci avaient quitté la grand-route et pris un raccourci par le pays des Troglodytes[c]. Ruben était dans la tristesse et, ce jour-là, il ne mangea pas de pain.


    Dan s’approcha alors de lui et dit : « Ne pleure pas et ne sois pas accablé, car nous avons trouvé ce que nous dirons à notre père. Tuons d’un coup d’épée un chevreau, tachons de son sang la tunique de Joseph et envoyons-la à Jacob en disant : “Regarde bien : est-ce la tunique de ton fils ?” » Et ils firent ainsi.[d]


    Jacob pleura donc Joseph tous les jours de sa vie. Mes frères eurent peur, et tous se repentirent de ce qu’ils avaient fait à Joseph. Mais les Égyptiens et les Ismaélites ne lui firent aucun mal, car le Seigneur ne leur permit pas de lui faire du mal.


    Joseph était un homme bien fait, agréable et beau d’apparence. Il n’y avait en lui aucune malveillance : il était doux et avait une âme sans détour. Soyez donc compatissants, mes enfants, car la compassion est un bien pour tous. Même si un homme est pécheur, s’il fait preuve de compassion, le Seigneur la lui comptera comme justice. Mais même s’il prospère, s’il est sans compassion, le Seigneur le fera périr.


    Pendant les jours de famine, je me souvins de la compassion du Seigneur et je donnai à tout étranger, à l’orphelin et à la veuve. J’avais quarante ans lorsque je pris femme, car ma vie s’était passée dans la peine et le travail et, à cause de ma simplicité, je ne possédais aucune richesse. Mon père m’avait béni en disant : « Tes fils seront comme un refuge pour les marins et comme un port pour les navires. »


    Et maintenant, mes enfants, je vous donne ce commandement : faites preuve de compassion et de miséricorde envers tout être humain, afin que le Seigneur ait lui aussi compassion de vous. Car, dans les derniers jours, vous vous éloignerez du Seigneur, vous provoquerez Lévi à la colère et vous vous dresserez contre Juda. Mais vous ne l’emporterez pas sur eux, car un ange du Seigneur les guidera l’un et l’autre, puisque c’est par eux qu’Israël subsistera.


    Chaque fois que vous vous éloignerez du Seigneur, vous commettrez tout mal et les abominations des nations. Vous vous égarerez à la suite des femmes et deviendrez esclaves de toute forme de méchanceté, tandis que les esprits de tromperie agiront en vous. J’ai en effet lu dans le livre d’Hénoch que vos fils aussi se corrompront dans les derniers jours, commettront des actes contraires à la Loi contre les fils de Lévi et pécheront contre Juda. Mais ils ne pourront leur résister, car le Seigneur suscitera de Lévi un prêtre, et de Juda un roi, Dieu et homme[e]. Celui-ci sauvera toutes les nations ainsi que la lignée d’Israël.


    Et maintenant, mes enfants, je vous donne ce commandement : obéissez à Zabulon, votre père ; faites miséricorde à vos prochains et montrez de la compassion envers tous, non seulement envers les êtres humains, mais aussi envers le bétail. C’est pour cela que le Seigneur m’a béni : lorsque tous mes frères furent malades, je demeurai exempt de maladie, car le Seigneur connaît l’intention de chacun.


    Ayez donc de la compassion du fond du cœur, mes enfants, car le Seigneur agira envers chacun de la même manière que celui-ci agit envers son prochain. J’ai vu les fils de mes frères tomber malades et mourir parce qu’ils étaient sans compassion, tandis que mes fils ont été préservés de tout mal, comme vous le savez. Au temps où j’habitais Canaan, je ne tirai aucun profit d’une balance et de poids, et je ne gardai pas chez moi deux mesures différentes[f]. Je partageais tous mes biens avec tous, d’un cœur sans partage, et je ne gardais rancune à personne. Jusqu’à ma vieillesse, je demeurai intègre en toutes choses.


    Vous aussi, mes enfants, gardez donc la loi du Seigneur, faites miséricorde à votre prochain et agissez avec compassion envers tous, non seulement envers les êtres humains, mais aussi envers les animaux privés de raison. C’est aussi pour cela que j’ai trouvé miséricorde auprès du Seigneur, que tous les hommes m’ont béni et que le Seigneur a multiplié mes biens par mille. Car l’homme compatissant fait du bien à sa propre âme.


    Sachez donc, mes enfants, que dans les derniers temps vous vous éloignerez du Seigneur, que vous serez divisés en Israël, que vous suivrez deux voies mauvaises et que vous ne serez pas comptés dans l’assemblée des justes. Mais après cela, le Seigneur lui-même se lèvera pour vous, lumière de justice ; il guérira et sauvera tous. Il ramènera les captifs arrachés à Béliar[g], tournera vers le Seigneur les cœurs désobéissants et accordera une paix éternelle à ceux qui font appel à lui.


    Les saints trouveront le repos en Éden, et les justes se réjouiront dans la Jérusalem nouvelle ; elle sera pour toujours la gloire de Dieu. Jérusalem ne subira plus la dévastation, et Israël ne sera plus emmené en captivité, car le Seigneur sera au milieu d’elle et habitera parmi les êtres humains. Le Saint d’Israël régnera sur eux dans l’humilité et la pauvreté, et quiconque croit en lui régnera véritablement dans les cieux.


    Et maintenant, mes enfants, craignez le Seigneur votre Dieu et gardez-vous de Satan et de ses esprits. Approchez-vous de Dieu et de l’ange qui intercède pour vous, car il est médiateur entre Dieu et les hommes en vue de la paix d’Israël. Il se dressera contre le royaume de l’ennemi ; c’est pourquoi l’ennemi cherche avec ardeur à détruire tous ceux qui font appel au Seigneur. Il sait en effet que le jour où Israël se repentira, son royaume prendra fin.


    L’ange de paix lui-même fortifiera Israël afin qu’il ne tombe pas au plus profond du mal. Au temps où Israël méprisera la Loi, le Seigneur ne l’abandonnera pas, mais le transformera en un peuple qui accomplit sa volonté, car aucun ange ne lui est égal. Son nom est en tout lieu en Israël et parmi les nations.


    Gardez-vous donc de toute action mauvaise ; rejetez la haine et toute tromperie, et aimez-vous les uns les autres dans la vérité et avec patience. Ce que j’ai entendu de mon père, transmettez-le à vos enfants, afin que le Sauveur des nations vous accueille. Car il est doux et humble, et par son propre exemple il enseigne la loi de Dieu.


    Fuyez donc toute injustice, attachez-vous à la justice de la loi du Seigneur, et votre descendance subsistera pour toujours ; vous serez bénis de génération en génération.


    Après leur avoir donné ces commandements, Zabulon allongea ses jambes et mourut dans une heureuse vieillesse. Ses fils le déposèrent dans un cercueil. Plus tard, ils le transportèrent à Hébron et l’ensevelirent auprès de ses pères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les témoins grecs varient entre « après qu’il eut été vendu » et « après qu’on l’eut jeté dans la citerne ». La présente traduction retient la seconde leçon, qui correspond au déroulement de la scène.
    reason: textual_variant
  - marker: b
    text: Certains témoins incluent Dan parmi ceux dont Juda craignait qu’ils ne tuent Joseph ; d’autres ne nomment que Siméon et Gad.
    reason: textual_variant
  - marker: c
    text: « Troglodytes » transcrit l’ethnonyme grec, littéralement associé à des habitants de cavernes ; il désigne probablement un peuple ou une région situés sur un itinéraire commercial plus court.
    reason: cultural_note
  - marker: d
    text: À partir d’ici, le chapitre est plus développé dans la tradition grecque étendue que dans l’extrait grec abrégé fourni en tête du dossier. La traduction suit le texte continu plus complet représenté dans la tradition éditée par Charles.
    reason: textual_variant
  - marker: e
    text: La formule « de Lévi un prêtre, et de Juda un roi, Dieu et homme » est souvent considérée par les chercheurs comme une expansion chrétienne ultérieure ; elle est néanmoins traduite parce qu’elle figure dans la tradition grecque suivie.
    reason: alternative_reading
  - marker: f
    text: Garder « deux mesures différentes » désigne vraisemblablement une pratique commerciale frauduleuse consistant à employer des mesures inégales selon que l’on achète ou que l’on vend.
    reason: cultural_note
  - marker: g
    text: « Béliar » reproduit la forme grecque du nom également connu sous la forme « Bélial ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: ému de compassion
  rationale: Rend la profondeur affective et presque viscérale du terme tout en annonçant le thème dominant de la compassion.
- source_word: τηρεῖν
  choice: garder
  rationale: Dans le contexte de la citerne et du danger couru par Joseph, le verbe désigne une surveillance active et protectrice.
- source_word: ἐπράθη
  choice: fut vendu
  rationale: Le contexte commercial du récit de Joseph impose le sens concret de vente.
- source_word: ἄσιτος
  choice: sans avoir mangé
  rationale: Expression française naturelle qui conserve l’idée de privation de nourriture sans suggérer nécessairement un jeûne volontaire.
- source_word: περιεσχίσατο
  choice: déchira sa tunique
  rationale: Conserve le geste traditionnel de deuil et suit le singulier χιτῶνα du texte grec fourni.
- source_word: Τρωγλοδιτῶν
  choice: Troglodytes
  rationale: Conserve l’ethnonyme grec, expliqué en note plutôt que remplacé par une identification incertaine.
- source_word: μολύνωμεν
  choice: tachons de son sang
  rationale: Dans ce contexte, le sang est implicite ; l’explicitation minimale produit un français clair et concret.
- source_word: μετενόησαν
  choice: se repentirent
  rationale: Le contexte d’une faute morale précise justifie le vocabulaire du repentir plutôt qu’un simple changement d’avis.
- source_word: ἁπλότης / ἁπλοῦς
  choice: simplicité / sans détour / d’un cœur sans partage
  rationale: Les rendus contextuels préservent le fil thématique de la droiture, de l’absence de calcul et de la générosité, sans donner à « simple » un sens péjoratif.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Maintient autant que possible la distinction avec le vocabulaire de la compassion associé aux entrailles.
- source_word: λογιεῖται εἰς δικαιοσύνην
  choice: la lui comptera comme justice
  rationale: Préserve l’image théologique d’une imputation tout en restant intelligible en français moderne.
- source_word: ἀλλότριος
  choice: étranger
  rationale: S’accorde avec la triade éthique traditionnelle « étranger, orphelin et veuve ».
theological_decisions:
- issue: Formule messianique issue de Lévi et de Juda
  choice: « de Lévi un prêtre, et de Juda un roi, Dieu et homme »
  alternative: Traiter la formule comme une interpolation ou atténuer « Dieu et homme »
  rationale: La formulation élevée présente dans la tradition grecque suivie est traduite sans l’harmoniser ni la supprimer ; la question de son développement textuel est signalée en note.
- issue: « Quiconque croit en lui »
  choice: Conserver le pronom personnel et l’acte de croire en lui
  alternative: Généraliser en « quiconque croit en Dieu »
  rationale: Le référent conserve la tension du passage ; la traduction ne résout pas silencieusement son identité.
- issue: Langage de l’ange médiateur
  choice: Distinguer l’ange qui intercède du Seigneur et conserver « médiateur entre Dieu et les hommes »
  alternative: Identifier explicitement cet ange au Messie ou en faire un simple auxiliaire céleste
  rationale: Le discours présente les figures de manière distincte ; la traduction respecte cette distinction et son ambiguïté théologique.
- issue: Antécédent dans « aucun ange ne lui est égal »
  choice: Conserver le pronom ambigu « lui »
  alternative: Remplacer par « au Seigneur » ou « à l’ange de paix »
  rationale: La formulation française préserve l’ambiguïté référentielle du passage au lieu de choisir une identification doctrinale.
translation_notes:
  register: Français international moderne, digne et narratif, sans archaïsmes inutiles. Les répétitions de « compassion » et de « miséricorde » sont volontairement maintenues afin de préserver la structure exhortative et les distinctions lexicales du chapitre. Les images bibliques traditionnelles restent concrètes, tandis que les ambiguïtés référentielles et théologiques ne sont pas résolues par paraphrase.
