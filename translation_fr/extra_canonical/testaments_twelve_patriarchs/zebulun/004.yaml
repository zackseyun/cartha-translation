    Et maintenant, mes enfants, je vous donne ce commandement : faites preuve de compassion et de miséricorde envers tout être humain, afin que le Seigneur ait lui aussi compassion de vous. Car, dans les derniers jours, vous vous éloignerez du Seigneur, vous provoquerez Lévi et vous vous dresserez contre Juda. Mais vous ne l’emporterez pas sur eux, car un ange du Seigneur les guidera l’un et l’autre, puisque c’est par eux qu’Israël subsistera.


    Chaque fois que vous vous éloignerez du Seigneur, vous suivrez toutes sortes de voies mauvaises et commettrez les abominations des nations. Vous vous égarerez à la suite des femmes et deviendrez esclaves de toute forme de méchanceté, tandis que les esprits de tromperie agiront en vous. J’ai en effet lu dans le livre d’Hénoch que vos fils aussi se corrompront dans les derniers jours, agiront au mépris de la Loi envers les fils de Lévi et pécheront contre Juda. Mais ils ne pourront leur résister, car le Seigneur suscitera de Lévi un prêtre, et de Juda un roi, Dieu et homme[e]. Celui-ci sauvera toutes les nations ainsi que la lignée d’Israël.


    Et maintenant, mes enfants, je vous donne ce commandement : obéissez à Zabulon, votre père ; faites miséricorde à vos prochains et montrez de la compassion envers tous, non seulement envers les êtres humains, mais aussi envers le bétail. C’est pour cela que le Seigneur m’a béni : lorsque tous mes frères furent malades, je demeurai exempt de maladie, car le Seigneur connaît l’intention de chacun.


    Ayez donc de la compassion du fond du cœur, mes enfants, car le Seigneur agira envers chacun de la même manière que celui-ci agit envers son prochain. J’ai vu les fils de mes frères tomber malades et mourir parce qu’ils étaient sans compassion, tandis que mes fils ont été préservés de tout mal, comme vous le savez. Au temps où j’habitais Canaan, je ne tirai aucun profit d’une balance faussée et je ne gardai pas chez moi deux mesures différentes[f]. Je partageais tous mes biens avec tous, d’un cœur sans partage, et je ne gardais rancune à personne. Jusqu’à ma vieillesse, je demeurai intègre en toutes choses.


    Vous aussi, mes enfants, gardez donc la loi du Seigneur, faites miséricorde à votre prochain et agissez avec compassion envers tous, non seulement envers les êtres humains, mais aussi envers les animaux privés de raison. C’est aussi pour cela que j’ai trouvé miséricorde auprès du Seigneur, que tous les hommes m’ont béni et que le Seigneur a multiplié mes biens par mille. Car l’homme compatissant fait du bien à sa propre âme.


    Sachez donc, mes enfants, que dans les derniers temps vous vous éloignerez du Seigneur, que vous serez divisés en Israël, que vous suivrez deux voies mauvaises et que vous ne serez pas comptés dans l’assemblée des justes. Mais après cela, le Seigneur lui-même se lèvera pour vous, lumière de justice ; il guérira et sauvera tous les hommes. Il ramènera les captifs arrachés à Béliar[g], tournera vers le Seigneur les cœurs désobéissants et accordera une paix éternelle à ceux qui font appel à lui.


    Les saints trouveront le repos en Éden, et les justes se réjouiront dans la Jérusalem nouvelle, qui manifestera pour toujours la gloire de Dieu. Jérusalem ne subira plus la dévastation, et Israël ne sera plus emmené en captivité, car le Seigneur sera au milieu d’elle et habitera parmi les êtres humains. Le Saint d’Israël régnera sur eux dans l’humilité et la pauvreté, et quiconque croit en lui régnera dans les cieux selon la vérité.


    Et maintenant, mes enfants, craignez le Seigneur votre Dieu et gardez-vous de Satan et de ses esprits. Approchez-vous de Dieu et de l’ange qui intercède pour vous, car il est médiateur entre Dieu et les hommes en vue de la paix d’Israël. Il se dressera contre le royaume de l’ennemi ; c’est pourquoi l’ennemi cherche avec ardeur à détruire tous ceux qui font appel au Seigneur. Il sait en effet que le jour où Israël se repentira, son royaume prendra fin.


    L’ange de paix lui-même fortifiera Israël afin qu’il ne tombe pas au plus profond du mal. Au temps où Israël méprisera la Loi, le Seigneur ne l’abandonnera pas, mais le transformera en un peuple qui accomplit sa volonté, car aucun ange ne lui est égal. Son nom sera partout en Israël et parmi les nations.


    Gardez-vous donc de toute action mauvaise ; rejetez la haine et toute tromperie, et aimez-vous les uns les autres dans la vérité et avec patience. Ce que j’ai entendu de mon père, transmettez-le à vos enfants, afin que le Sauveur des nations vous accueille. Car il est doux et humble, et par son propre exemple il enseigne la loi de Dieu.


    Fuyez donc toute injustice, attachez-vous à la justice de la loi du Seigneur, et votre descendance subsistera pour toujours ; vous serez bénis de génération en génération.


    Après leur avoir donné ces commandements, Zabulon étendit les pieds et mourut dans une heureuse vieillesse. Ses fils le déposèrent dans un cercueil. Plus tard, ils le transportèrent à Hébron et l’ensevelirent auprès de ses pères.'
