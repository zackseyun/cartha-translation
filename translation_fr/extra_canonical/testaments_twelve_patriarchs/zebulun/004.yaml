  rationale: 'La révision rétablit les deux données explicites du grec fourni : Siméon et Gad dans le texte principal, Dan en variante, et la remise de Joseph aux Ismaélites. Elle déplace aussi l’ancre de la note relative à la tradition longue au point où commence le matériau concerné. Les autres ajustements évitent des développements interprétatifs et améliorent la lisibilité sans modifier le sens ni résoudre les ambiguïtés textuelles ou théologiques.'
  reviewer_model: gpt-5.6-terra
