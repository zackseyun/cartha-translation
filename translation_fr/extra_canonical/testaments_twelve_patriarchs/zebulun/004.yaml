review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le texte grec fourni nomme Siméon et Gad dans la crainte de Juda (Dan étant une variante signalée), et précise que Zabulon garde Joseph jusqu’à ce qu’il soit remis aux Ismaélites. Ces deux éléments doivent apparaître dans le texte principal. Le reste suit globalement avec fidélité la tradition grecque plus longue reflétée par la piste d’audit anglaise, tout en signalant ses questions textuelles.
  naturalness: Le français est généralement naturel, moderne et d’un registre approprié. Quelques formulations ont été resserrées pour éviter des ajouts interprétatifs (« voies mauvaises », « balance faussée »), améliorer la fluidité, et rendre plus idiomatiques certaines expressions.
  terminology: Les noms, notamment Joseph, Juda, Siméon, Gad, Ruben, Lévi, Zabulon, Hénoch et Béliar, sont cohérents. La distinction récurrente entre « compassion » et « miséricorde » est maintenue. « Troglodytes », « Éden », « Jérusalem nouvelle » et la formule théologiquement disputée « Dieu et homme » sont conservés sans harmonisation doctrinale.
  issues:
  - severity: medium
    issue: Dan est inclus dans le texte principal de 4.2.
    rationale: Le grec présenté lit Siméon et Gad; Dan relève d’une variante, comme l’indique déjà la note. Le texte principal doit suivre la leçon retenue et la note signaler l’autre lecture.
  - severity: medium
    issue: La destination ismaélite est omise en 4.3.
    rationale: Le grec dit que Joseph est gardé jusqu’à ce qu’il soit remis/vendu aux Ismaélites. « Jusqu’à ce qu’il soit vendu » seul perd ce référent explicite.
  - severity: low
    issue: Plusieurs rendus introduisent une interprétation non nécessaire ou sont moins précis.
    rationale: « Toutes sortes de voies mauvaises » développe « tout mal »; « balance faussée » qualifie ce que le texte ne qualifie pas explicitement; « tous les hommes » resserre inutilement « tous ». Ces formulations sont corrigées.
  - severity: low
    issue: L’ancre de la note sur la tradition longue est placée après un développement qu’elle est censée introduire.
    rationale: La note est déplacée après « Et ils firent ainsi », au début du matériau qui dépasse l’extrait grec abrégé fourni.
