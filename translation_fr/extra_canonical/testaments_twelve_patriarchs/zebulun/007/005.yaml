source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Εἰ δὲ ἦν ξένος, ἢ νοσῶν, ἢ²¹ γηράσας, ἐψήσας²² τοὺς ἰχθύας, καὶ *ποιήσας αὐτὰ ἀγαθῶς²³ κατὰ τὴν ἑκάστου χρείαν προσέφερον πᾶσι, συναλγῶν²⁴ καὶ συμπάσχων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: fr
  text: Si quelqu’un était étranger, malade ou âgé, je faisais cuire les poissons et les préparais avec soin selon les besoins de chacun, puis je les offrais à tous, compatissant à leur douleur et partageant leur souffrance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  choice: étranger
  rationale: Rend directement le statut d’une personne venue d’ailleurs, sans préciser indûment qu’il s’agit d’un voyageur ou d’un immigré.
- source_word: ἐψήσας
  choice: je faisais cuire
  rationale: Le verbe désigne ici la cuisson des poissons; «faire cuire» est naturel en français et évite de surspécifier le procédé malgré la consultation anglaise «boiling».
- source_word: ποιήσας αὐτὰ ἀγαθῶς
  choice: les préparais avec soin
  rationale: Exprime idiomatiquement l’idée de bien apprêter les poissons, plutôt que le calque peu naturel «les faire bien».
- source_word: κατὰ τὴν ἑκάστου χρείαν
  choice: selon les besoins de chacun
  rationale: Conserve la distribution adaptée au besoin propre à chaque personne.
- source_word: συναλγῶν καὶ συμπάσχων
  choice: compatissant à leur douleur et partageant leur souffrance
  rationale: 'Maintient les deux participes grecs et leur nuance cumulative: ressentir la douleur avec autrui et souffrir avec lui.'
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe à la première personne suit le contexte autobiographique et les participes au nominatif singulier du texte grec; le sujet implicite est donc «je», contrairement à la révision anglaise qui emploie «they». La répétition sémantique finale est conservée, car elle reflète deux verbes grecs distincts.
