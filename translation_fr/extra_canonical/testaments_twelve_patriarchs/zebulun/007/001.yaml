  language: fr
  text: J’ai tendu une toile sur une autre pièce de bois dressée, au milieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀθόνην
  choice: une toile
  rationale: Le nom désigne une étoffe ou une pièce de tissu; « toile » convient naturellement au contexte sans préciser une fonction non exprimée.
- source_word: ἐξέτεινα
  choice: j’ai tendu
  rationale: Rend directement l’idée d’étendre ou de déployer en mettant sous tension.
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: sur une autre pièce de bois dressée
  rationale: ξύλον peut désigner du bois ou une pièce de bois; ὀρθῷ indique qu’elle est droite ou dressée. « Pièce de bois » évite de déterminer sans preuve qu’il s’agit précisément d’une poutre.
- source_word: ἐν μέσῳ
  choice: au milieu
  rationale: Conserve la formulation spatiale concise et l’indétermination du grec.
