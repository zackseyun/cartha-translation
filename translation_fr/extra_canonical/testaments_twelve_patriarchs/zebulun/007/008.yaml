base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: fr
  text: 8 Mais si vous n’avez rien à donner à celui qui est dans le besoin, partagez sa souffrance avec une profonde compassion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « souffrez avec lui dans des entrailles de miséricorde » ; les « entrailles » représentent ici le siège de la compassion profonde.'
    reason: La note préserve l’image anthropologique concrète du grec, difficile à rendre littéralement en français moderne sans lourdeur.
lexical_decisions:
- source_word: χρήζοντι
  choice: celui qui est dans le besoin
  rationale: Le participe désigne une personne qui manque du nécessaire ou qui a besoin d’aide; cette formulation reste générale comme le grec.
- source_word: συμπάσχετε αὐτῷ
  choice: partagez sa souffrance
  rationale: Le verbe appelle non seulement à éprouver de la compassion, mais à souffrir avec la personne; la traduction conserve cette dimension de solidarité.
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: avec une profonde compassion
  rationale: L’expression viscérale grecque évoque une compassion venant du plus profond de l’être. La formulation française en transmet naturellement la force, tandis que la note conserve l’image littérale.
theological_decisions:
- issue: Portée de l’exhortation en l’absence de biens à donner
  choice: Conserver l’appel à partager la souffrance de la personne démunie
  alternative: Réduire le sens à « ayez pitié de lui »
  rationale: Le composé συμπάσχετε exprime une participation à la souffrance, et non une simple émotion distante.
translation_notes:
  register: Français moderne, clair et digne. « Partagez sa souffrance » garde la vigueur de συμπάσχετε, tandis que « profonde compassion » rend idiomatiquement l’image des entrailles de miséricorde.
