base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/007.yaml
  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: fr
  text: Je pêchai donc pendant cinq ans, partageant avec toute personne que j’avais vue et subvenant aux besoins de toute la maisonnée de mon père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίευσα
  choice: je pêchai
  rationale: Le verbe signifie directement « pêcher »; le passé simple convient au registre narratif et dignifié.
- source_word: μεταδιδούς
  choice: donnant une part
  rationale: Le participe exprime le fait de faire participer autrui à ce que l’on possède ou de lui en donner une part; cette formulation reste naturelle sans préciser explicitement qu’il s’agit du produit de la pêche.
- source_word: παντὶ ἀνθρώπῳ ὃν ἑωράκειν
  choice: à toute personne que j’avais vue
  rationale: La traduction conserve la valeur littérale du relatif et la forme verbale transmise, malgré une expression quelque peu inhabituelle dans ce contexte.
- source_word: ἐξαρκῶν
  choice: pourvoyant aux besoins
  rationale: Le verbe évoque le fait de suffire ou de fournir assez; la formulation française exprime qu’il assurait ce qui était nécessaire.
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου
  choice: de toute la maison de mon père
  rationale: « Maison » garde ici son sens collectif de maisonnée ou famille, conformément à l’expression grecque.
