source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Καὶ¹⁸ ἐκ τῆς θήρας μου *παντὶ ἀνθρώπῳ ξένῳ¹⁹ σπλαγχνιζόμενος μετεδίδουν²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/004.yaml
  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: fr
  text: Et, de ce que je prenais à la chasse, je donnais une part à tout étranger, par compassion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  choice: de ce que je prenais à la chasse
  rationale: Le nom θήρα désigne ici le produit de la chasse ou la prise. Cette formulation naturelle conserve l’idée de provenance exprimée par ἐκ.
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: à tout étranger
  rationale: La traduction rend l’ensemble de l’expression sans le lourd pléonasme « à tout homme étranger »; ξένος peut désigner une personne étrangère ou inconnue.
- source_word: σπλαγχνιζόμενος
  choice: par compassion
  rationale: Le participe circonstanciel exprime la disposition compatissante qui motivait le partage.
- source_word: μετεδίδουν
  choice: je donnais une part
  rationale: μεταδίδωμι signifie faire participer quelqu’un à ce que l’on possède, donc partager ou donner une part. L’imparfait indique une conduite répétée ou habituelle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’imparfait conserve l’aspect habituel du grec; la formulation évite de préciser si « étranger » signifie étranger au pays, inconnu ou personne extérieure au groupe.
