source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: fr
  text: C’est pourquoi le Seigneur, lui aussi, m’a comblé de nombreux poissons lors de la pêche. En effet, celui qui partage avec son prochain reçoit du Seigneur plusieurs fois autant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέπλησέ με
  choice: m’a comblé
  rationale: Rend l’idée de remplir ou pourvoir abondamment, tout en restant idiomatique avec le complément « de nombreux poissons ».
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: lors de la pêche
  rationale: Le grec peut désigner l’action de capturer ou la prise; « lors de la pêche » exprime naturellement le cadre sans introduire un filet absent du texte.
- source_word: ὁ μεταδιδοὺς
  choice: celui qui partage
  rationale: Le participe désigne celui qui donne une part de ce qu’il possède.
- source_word: τῷ πλησίον
  choice: avec son prochain
  rationale: « Prochain » est le terme français courant et digne pour la personne proche ou l’autre envers qui s’exerce le partage.
- source_word: πολλαπλασίονα
  choice: plusieurs fois autant
  rationale: Préserve plus précisément l’idée d’une quantité multipliée, plutôt que le sens plus vague de « beaucoup plus ».
theological_decisions:
- issue: Rapport entre partage humain et don divin
  choice: Conserver l’affirmation directe selon laquelle celui qui partage reçoit davantage du Seigneur
  alternative: Atténuer en parlant d’une simple possibilité ou d’une récompense uniquement spirituelle
  rationale: Le texte formule une maxime générale sans préciser la nature de ce qui est reçu; la traduction ne doit ni affaiblir cette relation ni définir la récompense.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche du grec tout en évitant le calque peu naturel « dans la capture des poissons ».
