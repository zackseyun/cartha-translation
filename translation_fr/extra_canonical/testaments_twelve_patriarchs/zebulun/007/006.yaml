  source_fidelity: 'Le texte français rend fidèlement les éléments du grec : la conséquence (« C’est pourquoi »), l’action du Seigneur qui pourvoit abondamment en poissons, le cadre de la pêche, le partage envers le prochain et la réception d’un bien multiplié de la part du Seigneur. « Plusieurs fois autant » conserve utilement la force multiplicative de πολλαπλασίονα sans préciser la nature de ce qui est reçu.'
