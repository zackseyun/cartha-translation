  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/003.yaml
  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: fr
  text: Et je longeais les côtes à son bord, pêchant du poisson pour la maisonnée de mon père, jusqu’à ce que nous arrivions en Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: à son bord
  rationale: Le pronom renvoie vraisemblablement à l’embarcation mentionnée dans le contexte; « à son bord » exprime naturellement en français le déplacement en bateau sans répéter son nom.
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: je longeais les côtes
  rationale: Cette formulation rend le déplacement le long des rivages dans un français naturel et tient compte du contexte nautique.
- source_word: ἁλιεύων ἰχθύας
  choice: pêchant du poisson
  rationale: Le grec dit littéralement « pêchant des poissons »; le collectif « du poisson » est idiomatique en français.
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: pour la maisonnée de mon père
  rationale: οἶκος peut désigner la maison au sens du foyer et de ses membres; « maisonnée » conserve ici cette portée mieux que le seul bâtiment.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. Le passage de la première personne du singulier (« je ») à la première personne du pluriel (« nous ») est conservé conformément au grec.
