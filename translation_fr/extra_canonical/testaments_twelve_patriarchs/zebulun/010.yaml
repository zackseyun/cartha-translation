lexical_decisions:
- source_word: εὐσπλαγχνία
  choice: compassion
  rationale: Rend la miséricorde viscérale exprimée par le grec dans un français actuel et digne.
- source_word: πᾶσαν αἰχμαλωσίαν
  choice: toute captivité
  rationale: Conserve l’expression collective et quelque peu inhabituelle du grec sans la réduire aux seuls captifs.
- source_word: υἱῶν ἀνθρώπων
  choice: des êtres humains
  rationale: Expression française inclusive et naturelle correspondant à l’idiome grec désignant l’humanité.
- source_word: πνεῦμα πλάνης
  choice: esprit d’égarement
  rationale: Πλάνη peut désigner l’erreur, la tromperie ou l’égarement; ce choix préserve sa portée morale et spirituelle.
- source_word: εἰς παραζήλωσιν αὐτοῦ
  choice: à brûler de zèle pour lui
  rationale: Rend le mouvement vers un zèle intense sans imposer le sens négatif moderne de « jalousie ».
- source_word: ἐν σχήματι ἀνθρώπου
  choice: sous la forme d’un être humain
  rationale: Suit littéralement l’idée de forme ou d’apparence humaine sans explicitation christologique.
- source_word: συμπέσητε
  choice: ne vous effondrez pas de chagrin
  rationale: Le verbe évoque le fait de s’écrouler; le complément explicite naturellement le contexte de deuil.
- source_word: ἡγούμενος
  choice: chef
  rationale: Terme sobre désignant celui qui conduit ou dirige, sans importer un titre institutionnel précis.
- source_word: υἱῶν δικαιοσύνης
  choice: fils de justice
  rationale: Maintient l’expression sémitisante et sa valeur identitaire.
- source_word: εἰς θήκην ξυλίνην
  choice: dans un cercueil de bois
  rationale: Dans le contexte funéraire, θήκη désigne un contenant funéraire; « cercueil » est clair en français moderne.
theological_decisions:
- issue: Vision de Dieu sous forme humaine
  choice: « vous verrez Dieu sous la forme d’un être humain »
  alternative: « vous verrez un dieu sous forme humaine » ou une identification christologique explicite
  rationale: L’absence d’article devant θεόν ne rend pas nécessairement le nom indéfini en grec; la traduction conserve l’énoncé fort sans identifier doctrinalement la figure.
- issue: Identité du personnage choisi et rapport avec Jérusalem
  choice: Conserver l’enchaînement abrupt avec un tiret et une note textuelle
  alternative: Faire de Jérusalem le sujet qui choisit, ou corriger le texte pour attribuer un autre nom au personnage
  rationale: Le grec transmis est syntaxiquement difficile; la traduction ne résout pas silencieusement son ambiguïté.
- issue: Résurrection de Zabulon
  choice: « je me relèverai »
  alternative: « je ressusciterai »
  rationale: Le verbe ἀναστήσομαι peut exprimer la résurrection, mais « me relèverai » préserve sa largeur sémantique tout en restant intelligible dans ce contexte eschatologique.
- issue: Feu éternel et destruction prolongée
  choice: Maintenir ensemble « feu éternel » et « détruira de génération en génération »
  alternative: Harmoniser ces expressions selon une doctrine précise du châtiment final
  rationale: Le texte juxtapose ces formulations; la traduction conserve cette tension théologique.
- issue: Béliar et la captivité humaine
  choice: « délivrera toute captivité… hors du pouvoir de Béliar »
  alternative: « rachètera tous les captifs de Béliar »
  rationale: Cette formulation respecte l’objet abstrait αἰχμαλωσίαν tout en rendant intelligible la relation exprimée par ἐκ.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures sémitisantes porteuses de sens (« fils de justice », « de génération en génération ») sont conservées, tandis que la syntaxe générale reste accessible. La numérotation interne du chapitre 10 est rétablie; le paragraphe initial et le verset 9 appartiennent à la fin du chapitre précédent telle qu’elle figure dans l’extrait fourni.
