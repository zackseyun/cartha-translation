  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: fr
  text: 'Et vous retournerez dans votre pays, et vous le verrez à Jérusalem à cause de son saint nom. La guérison et la compassion seront dans ses ailes.[a] Lui-même délivrera toute captivité des êtres humains hors du pouvoir de Béliar, et tout esprit d’égarement sera foulé aux pieds. Il amènera toutes les nations à brûler de zèle pour lui, et vous verrez Dieu sous la forme d’un être humain, celui que le Seigneur choisira — Jérusalem, un nom pour lui.[b]


    9. De nouveau, par la ruse de vos actes, vous provoquerez sa colère, et vous serez rejetés loin de lui jusqu’au temps de l’accomplissement.


    10. Et maintenant, mes enfants, ne vous affligez pas parce que je meurs et ne vous effondrez pas de chagrin parce que j’arrive à ma fin. 2 En effet, je me relèverai au milieu de vous, comme chef parmi les fils de justice, et je me réjouirai au milieu de ma tribu, parmi ceux qui garderont la loi du Seigneur.[c] 3 Mais sur les impies, le Seigneur fera venir un feu éternel, et il les détruira de génération en génération. 4 Quant à moi, je me hâte maintenant vers mon repos, comme l’ont fait aussi mes pères. 5 Mais vous, craignez le Seigneur tous les jours de votre vie, de toute votre force.[d]


    6 Après avoir dit cela, il s’endormit, et ses fils le déposèrent dans un cercueil de bois.[e] 7 Plus tard, ils l’emportèrent et l’ensevelirent à Hébron avec ses pères.


    [a] Les mots allant de « La guérison » à « foulé aux pieds » constituent une expansion attestée dans un groupe de manuscrits grecs.


    [b] Les mots allant de « Il amènera » à « un nom pour lui » constituent une autre expansion attestée dans ce même groupe de manuscrits. La syntaxe grecque de la dernière proposition est difficile et permet plusieurs ponctuations; elle dit littéralement, de façon abrupte : « celui que le Seigneur choisira, Jérusalem, nom pour lui ».


    [c] Certains témoins ajoutent : « et les commandements de Zabulon, leur père ».


    [d] Certains témoins développent ainsi cette exhortation : « craignez le Seigneur notre Dieu de toute votre force, tous les jours de votre vie ».


    [e] Certains témoins ajoutent qu’il s’endormit « d’un beau sommeil ».'
