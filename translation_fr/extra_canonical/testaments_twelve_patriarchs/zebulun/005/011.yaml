  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/011.yaml
  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: fr
  text: Siméon prit la tunique et ne voulut pas s’en dessaisir. En effet, il voulait le tailler en pièces avec l’épée, furieux de ne pas l’avoir tué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτῶνα
  choice: la tunique
  rationale: Équivalent français direct et naturel du vêtement désigné par le grec.
- source_word: οὐκ ἤθελε δοῦναι αὐτόν
  choice: ne voulut pas la rendre
  rationale: Dans ce contexte, δοῦναι signifie remettre ou céder la tunique; «la rendre» exprime naturellement en français le refus de s’en dessaisir.
- source_word: τῇ ῥομφαίᾳ
  choice: avec l’épée
  rationale: «Épée» est le terme courant et digne qui convient ici pour ῥομφαία, sans imposer une précision typologique incertaine.
- source_word: κατακόψαι αὐτόν
  choice: le tailler en pièces
  rationale: Le verbe intensif κατακόπτω évoque l’action de frapper et mettre en pièces, plus forte qu’un simple «abattre».
- source_word: ὀργιζόμενος
  choice: furieux
  rationale: Rend de façon concise et idiomatique la colère active exprimée par le participe grec.
- source_word: ὅτι οὐκ ἀνεῖλεν αὐτόν
  choice: de ne pas l’avoir tué
  rationale: La tournure française infinitive restitue clairement la cause de sa colère tout en conservant le sujet implicite, Siméon.
theological_decisions: []
translation_notes:
  register: Français moderne international, narratif et digne. La seconde phrase explicite le lien causal de γάρ par «En effet». Aucun marqueur de note n’est requis.
