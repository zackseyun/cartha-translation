    issue: « ne voulut pas la rendre »
    rationale: Cette expression suggère normalement qu’il s’agit de restituer la tunique à celui à qui elle appartient. Le grec dit simplement qu’il ne voulait pas la donner/céder. « Ne voulut pas s’en dessaisir » conserve l’absence de destinataire et l’idée de refus d’abandonner le vêtement.
