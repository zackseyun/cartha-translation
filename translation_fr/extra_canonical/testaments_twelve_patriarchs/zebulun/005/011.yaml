  source_fidelity: 'Le sens général est fidèle : Siméon prend la tunique, refuse de s’en défaire, veut mettre l’autre homme en pièces avec l’épée et est irrité de ne pas l’avoir tué. Toutefois, « la rendre » introduit plus précisément l’idée de restitution à un propriétaire, alors que δοῦναι (« donner, céder ») ne précise ni destinataire ni notion de retour.'
