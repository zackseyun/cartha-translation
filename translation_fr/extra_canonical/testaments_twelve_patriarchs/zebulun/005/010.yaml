  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a servant’s garment.
translation:
  language: fr
  text: Car ils dépouillèrent Joseph de sa tunique lorsqu’ils le vendirent, et le revêtirent d’un vêtement d’esclave.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: tunique
  rationale: Rend naturellement le vêtement désigné par le grec et maintient le lien avec le récit de Joseph.
- source_word: πιπράσκω
  choice: vendre
  rationale: Le participe grec situe l’action au moment de la vente; le passé simple « lorsqu’ils le vendirent » convient au registre narratif.
- source_word: ἱμάτιον δουλικόν
  choice: vêtement d’esclave
  rationale: « δουλικόν » signifie proprement « servile, propre à un esclave »; cette formulation conserve nettement le statut social exprimé par le grec.
- source_word: ἐκδύω / ἐνδύω
  choice: dépouiller / revêtir
  rationale: Ce couple verbal français restitue l’opposition grecque entre retirer la tunique et faire porter un autre vêtement.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple s’accorde avec le style testamentaire; « vêtement d’esclave » est plus précis que « vêtement de serviteur ».
