  text: 10. ΓΤὸν γὰρ χιτῶνα˥⁵⁹ ἐξέδυσαν τὸν⁶⁰ Ἰωσὴφ ἐν *τῷ πιπράσκειν⁶¹ αὐτόν⁶², *καὶ ἐνέδυσαν αὐτὸν ἱμάτιον δουλικόν⁶³.
