  source_fidelity: 'La traduction rend fidèlement les principaux éléments grecs : les imparfaits ἠσθένουν et ἀπέθνησκον (« tombaient malades et mouraient »), la causalité non explicitée de διὰ Ἰωσήφ (« à cause de Joseph »), l’absence de miséricorde/compassion (ἐποίησαν ἔλεος), et la préservation sans maladie (ἄνοσοι διεφυλάχθησαν). Elle ne résout pas indûment l’ambiguïté du lien avec Joseph.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Au plus profond d’eux-mêmes » est idiomatique, et la note permet de conserver l’arrière-plan imagé des σπλάγχνα sans imposer un littéralisme corporel peu naturel dans le texte courant.
  terminology: « Compassion » convient pour ἔλεος dans ce contexte, tandis que la note explique utilement l’expression grecque « dans leurs entrailles ». « Préservés de toute maladie » rend naturellement ἄνοσοι διεφυλάχθησαν. Les noms et termes ne soulèvent pas de difficulté.
