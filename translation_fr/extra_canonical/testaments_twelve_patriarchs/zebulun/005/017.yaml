source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: fr
  text: Car les fils de mes frères tombaient malades et mouraient à cause de Joseph, parce qu’ils n’avaient pas fait preuve de compassion au plus profond d’eux-mêmes[a] ; mais mes fils furent préservés de toute maladie, comme vous le savez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « dans leurs entrailles » ; dans l’usage ancien, les entrailles étaient considérées comme le siège des émotions profondes, notamment de la compassion.'
    reason: Signaler l’image corporelle du grec, difficile à conserver littéralement dans un français naturel.
lexical_decisions:
- source_word: ἠσθένουν καὶ ἀπέθνησκον
  choice: tombaient malades et mouraient
  rationale: Les imparfaits grecs décrivent des actions répétées ou en cours ; cette formulation française en conserve l’aspect.
- source_word: διὰ Ἰωσήφ
  choice: à cause de Joseph
  rationale: Rend directement la valeur causale de διά avec l’accusatif, sans préciser davantage le rapport à Joseph.
- source_word: ἐποίησαν ἔλεος
  choice: fait preuve de compassion
  rationale: Expression naturelle en français moderne qui restitue l’idée d’exercer concrètement la miséricorde ou la compassion.
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: au plus profond d’eux-mêmes
  rationale: Transmet l’image antique des entrailles comme siège de la compassion tout en restant immédiatement compréhensible.
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: furent préservés de toute maladie
  rationale: Restitue à la fois l’idée d’être gardés ou préservés et l’état d’absence de maladie.
theological_decisions:
- issue: Lien causal entre le sort des neveux de Zabulon et Joseph
  choice: Conserver « à cause de Joseph »
  alternative: Expliciter « à cause de ce qu’ils avaient fait à Joseph »
  rationale: Le grec reste concis et peut viser Joseph lui-même ou les actes commis envers lui ; la traduction ne tranche pas cette ambiguïté.
- issue: Nature de la compassion absente
  choice: Conserver sa dimension intérieure par « au plus profond d’eux-mêmes »
  alternative: Dire simplement « dans leur cœur » ou seulement « ils n’avaient pas eu compassion »
  rationale: La formulation retenue préserve l’insistance anthropologique de σπλάγχνα sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste entre les fils des frères et ceux de Zabulon est maintenu par « mais ». Les imparfaits initiaux et le passé simple de la préservation respectent la dynamique aspectuelle du grec.
