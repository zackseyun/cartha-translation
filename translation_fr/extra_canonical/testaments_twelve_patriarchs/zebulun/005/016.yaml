base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/016.yaml
  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
translation:
  language: fr
  text: Ayez donc de la compassion au plus profond de vous-mêmes[a], car tout ce que quelqu’un fait à son prochain, le Seigneur agira de même envers lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec parle littéralement de la compassion « dans vos entrailles », celles-ci étant considérées comme le siège des sentiments profonds.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος ἐν σπλάγχνοις ὑμῶν
  choice: de la compassion au plus profond de vous-mêmes
  rationale: Rend naturellement l’image grecque des entrailles comme siège de la compassion, sans employer en français une expression anatomique obscure.
- source_word: τῷ πλησίον αὐτοῦ
  choice: à son prochain
  rationale: « Son prochain » est une formulation française claire qui conserve la portée relationnelle de πλησίον.
- source_word: οὕτω
  choice: de même
  rationale: Marque explicitement la correspondance entre la conduite envers le prochain et celle du Seigneur envers l’auteur de cette conduite.
- source_word: μετʼ αὐτοῦ
  choice: le lui fera
  rationale: Le grec dit littéralement que le Seigneur agira « avec lui » ou « envers lui »; cette formulation idiomatique française conserve le principe de réciprocité dans le contexte.
theological_decisions:
- issue: Portée du principe de réciprocité divine
  choice: Conserver l’énoncé général sans préciser s’il s’agit exclusivement de jugement, de rétribution ou de mesure morale.
  alternative: « Le Seigneur le traitera de la même manière »
  rationale: Le texte établit une correspondance directe, mais ne développe pas ici son mécanisme théologique; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français moderne, international et digne. L’impératif pluriel « Ayez » est conservé. « Au plus profond de vous-mêmes » communique l’idiome anthropologique grec tout en restant immédiatement compréhensible; la note en préserve l’image littérale.
