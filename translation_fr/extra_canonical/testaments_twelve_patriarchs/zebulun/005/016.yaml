review_pass:
  verdict: revise
  source_fidelity: La première exhortation rend correctement ἔλεος ἐν σπλάγχνοις ὑμῶν comme une compassion intérieure, avec une note qui conserve l’image corporelle grecque. La proposition finale, όμως, traduit μετʼ αὐτοῦ (« avec lui / envers lui ») par « le lui fera », formulation plus déterminée qui présente l’action divine comme la répétition de l’acte. « Agira de même envers lui » rend plus directement la construction grecque sans préciser le mode de cette réciprocité.
  naturalness: Le français est globalement naturel et d’un registre approprié. La révision de la dernière proposition est plus fluide et évite la légère lourdeur de « le lui fera de même ».
  terminology: « Compassion », « prochain » et « Seigneur » conviennent au registre du texte. La note sur les « entrailles » explique utilement σπλάγχνα sans imposer une expression anatomique peu naturelle dans le corps du texte.
  issues:
  - severity: medium
    issue: La traduction de μετʼ αὐτοῦ par « le lui fera de même » est trop explicative.
    rationale: Μετά avec le génitif signifie de manière première « avec » et peut, dans ce contexte, exprimer la manière dont le Seigneur agira à l’égard de la personne. « Le lui fera » transforme cette relation en un objet direct et spécifie davantage une stricte répétition de l’acte. Une formulation avec « agir ... envers lui » préserve mieux la portée ouverte du grec.
  revised_text: Ayez donc de la compassion au plus profond de vous-mêmes[a], car tout ce que quelqu’un fait à son prochain, le Seigneur agira de même envers lui.
  revised_footnotes:
