revisions:
- from: Ayez donc de la compassion au plus profond de vous-mêmes[a], car tout ce que quelqu’un fait à son prochain, le Seigneur le lui fera de même.
  to: Ayez donc de la compassion au plus profond de vous-mêmes[a], car tout ce que quelqu’un fait à son prochain, le Seigneur agira de même envers lui.
  rationale: La révision se limite à la dernière proposition afin de rendre μετʼ αὐτοῦ de façon plus fidèle et moins interprétative. Elle conserve le principe de correspondance exprimé par οὕτω (« de même »), tout en ne décidant pas si l’action du Seigneur est une rétribution précise, un traitement correspondant ou une autre forme de réponse.
