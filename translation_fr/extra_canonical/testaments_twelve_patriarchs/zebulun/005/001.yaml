source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: αὐτὸν τῷ Ἰακὼβ λέγοντες⁵⁵. Ἐπίγνωθι, ὁ⁵⁶ *χιτὼν τοῦ υἱοῦ σου ἐστίν⁵⁷; *καὶ ἐποίησαν οὕτως⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: fr
  text: 'Et ils dirent à Jacob : « Reconnais donc si c’est la tunique[a] de ton fils. » Et ils firent ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtement »; le mot grec χιτών désigne une tunique portée sur le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: Reconnais donc
  rationale: L’impératif appelle Jacob à identifier la tunique; « reconnais » conserve le lien direct avec l’acte d’identification, tandis que « donc » rend la nuance contextuelle de l’énoncé.
- source_word: χιτών
  choice: tunique
  rationale: « Tunique » désigne plus précisément le vêtement porté sur le corps que les termes plus généraux « manteau » ou « vêtement ».
- source_word: καὶ ἐποίησαν οὕτως
  choice: Et ils firent ainsi
  rationale: Rendu formel qui préserve la formulation brève et quelque peu énigmatique du grec sans expliciter ce que le groupe fit.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe garde la concision narrative du grec et ne résout pas l’imprécision de « ils firent ainsi ».
