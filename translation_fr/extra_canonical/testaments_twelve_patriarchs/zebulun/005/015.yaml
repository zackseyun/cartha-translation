    rationale: Διὰ γὰρ ταῦτα exprime une justification causale ; « Car c’est pour cela que » la conserve naturellement.
  - severity: medium
    issue: « Les dispositions de chacun » ne respecte pas exactement le singulier προαίρεσιν.
    rationale: Le grec vise la prédisposition, l’intention ou le choix volontaire de chaque personne. Le pluriel français élargit le référent à un ensemble de traits ou d’attitudes.
