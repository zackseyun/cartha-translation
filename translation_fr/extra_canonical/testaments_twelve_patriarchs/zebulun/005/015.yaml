revisions:
- from: C’est pour cela que le Seigneur m’a béni ; et tandis que tous mes frères étaient malades, je suis resté exempt de maladie. Car le Seigneur connaît les dispositions de chacun.
  to: 'Car c’est pour cela que le Seigneur m’a béni : alors que tous mes frères étaient malades, je suis demeuré sans maladie. Car le Seigneur connaît l’intention de chacun.'
  rationale: La révision rend explicitement la causalité de γάρ, conserve le contraste médical de ἀσθενούντων et ἄνοσος, et remplace le pluriel élargissant « les dispositions » par le singulier « l’intention », qui correspond plus étroitement à προαίρεσιν tout en restant non doctrinal.
