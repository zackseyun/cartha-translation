source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: fr
  text: 'Car c’est pour cela que le Seigneur m’a béni : alors que tous mes frères étaient malades, je suis demeuré sans maladie. Car le Seigneur connaît l’intention de chacun.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ γὰρ ταῦτα
  choice: C’est pour cela que
  rationale: Rend naturellement en français la relation causale et explicative, sans le tour lourd « Car à cause de ces choses ».
- source_word: ἀσθενούντων
  choice: étaient malades
  rationale: Exprime directement l’état de faiblesse ou de maladie des frères dans ce contexte.
- source_word: ἄνοσος παρῆλθον
  choice: je suis resté exempt de maladie
  rationale: ἄνοσος signifie littéralement « sans maladie » ; cette formulation conserve le contraste médical avec ἀσθενούντων sans élargir indûment le sens à toute forme de mal.
- source_word: προαίρεσιν
  choice: les dispositions
  rationale: Le terme désigne l’orientation délibérée de la volonté, le choix ou l’intention morale. « Dispositions » préserve cette ampleur mieux qu’un terme uniquement ponctuel.
theological_decisions:
- issue: Objet de la connaissance divine exprimé par προαίρεσιν
  choice: les dispositions de chacun
  alternative: l’intention de chacun
  rationale: Le grec peut viser l’intention, le dessein choisi ou la disposition morale. La traduction retenue maintient cette latitude sans définir une doctrine particulière de la volonté.
translation_notes:
  register: Français moderne, digne et accessible. Le contraste entre les frères malades et Zabulon demeuré sans maladie est conservé explicitement ; la causalité initiale est formulée de manière idiomatique.
