source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: fr
  text: Et maintenant, mes enfants, je vous ordonne d’observer les commandements du Seigneur, de faire preuve de miséricorde envers votre prochain et d’avoir compassion de tous, non seulement envers les êtres humains, mais aussi envers les animaux dépourvus de raison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: je vous ordonne
  rationale: Rend la force directive du verbe grec dans cette exhortation testamentaire.
- source_word: φυλάσσειν τὰς ἐντολὰς
  choice: observer les commandements
  rationale: En français biblique actuel, « observer » exprime naturellement l’idée de garder et de mettre en pratique des commandements.
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: faire preuve de miséricorde envers votre prochain
  rationale: Restitue l’expression grecque « faire miséricorde » dans une formulation française naturelle, sans confondre « les commandements » avec « le prochain ».
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας
  choice: avoir compassion de tous
  rationale: Conserve la portée universelle de πάντας et traduit l’idée d’une compassion profonde.
- source_word: ἄλογοις ζώοις
  choice: animaux privés de raison
  rationale: Rend explicitement le sens de ἄλογος dans ce contexte, plutôt que le faux ami moderne « animaux irrationnels ».
theological_decisions:
- issue: Étendue de la compassion commandée
  choice: Conserver explicitement l’inclusion des animaux
  alternative: Généraliser en parlant seulement de toute créature
  rationale: Le grec distingue expressément les êtres humains des animaux privés de raison; cette tension éthique doit rester visible sans être élargie ni restreinte.
translation_notes:
  register: Français international moderne, clair et digne. La structure ternaire de l’exhortation est conservée, avec des infinitifs coordonnés.
source_grounding:
  english_pob_role: consult_only
