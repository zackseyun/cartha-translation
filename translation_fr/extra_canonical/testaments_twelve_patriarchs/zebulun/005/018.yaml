  terminology: Aucun terme théologique ou nom propre ne pose problème. « Jacob, mon père » est exact. « Je chassais du gibier » est une traduction littérale recevable de ἐθήρευον θήραν; la note explique utilement que le cadre maritime peut orienter l’interprétation vers la pêche ou la capture d’animaux marins, sans transformer le texte traduit.
