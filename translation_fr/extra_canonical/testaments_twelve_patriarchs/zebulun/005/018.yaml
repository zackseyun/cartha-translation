  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : le cadre cananéen et côtier (ἐν γῇ Χαναὰν, εἰς τὴν παραλίαν), l’imparfait habituel et la figure « chasser du gibier » (ἐθήρευον θήραν), le contraste entre les nombreux hommes qui étaient étouffés/suffoquaient en mer (πολλῶν ἀγχομένων ἐν τῇ θαλάσσῃ) et le narrateur qui demeurait sans dommage (ἀβλαβὴς διέμενον). « Suffoquaient » préserve avec justesse l’ambiguïté sans imposer « se noyaient ».'
