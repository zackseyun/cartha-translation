  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/018.yaml
  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
translation:
  language: fr
  text: Lorsque j’étais au pays de Canaan, sur le littoral, je chassais du gibier[a] pour Jacob, mon père. Et tandis que beaucoup suffoquaient dans la mer, moi, je demeurais sain et sauf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « je chassais du gibier »; dans ce contexte côtier, il peut s’agir de pêche ou de capture d’animaux marins.
    reason: lexical_alternative
  - marker: b
    text: La phrase semble se poursuivre au-delà de l’extrait conservé ici; la traduction s’arrête avec le texte grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: εἰς τὴν παραλίαν
  choice: sur le littoral
  rationale: Rend naturellement l’indication de lieu liée à la côte, sans préciser davantage que le grec.
- source_word: ἐθήρευον θήραν
  choice: je chassais du gibier
  rationale: Conserve la figure étymologique et le sens littéral du grec, tout en signalant en note que le contexte maritime peut viser une activité de pêche ou la capture d’animaux marins.
- source_word: ἀγχομένων
  choice: suffoquaient
  rationale: Le participe évoque le fait d’être étranglé ou étouffé; « suffoquaient » reste intelligible dans un contexte maritime sans transformer explicitement le verbe en « se noyaient ».
- source_word: ἀβλαβὴς διέμενον
  choice: je demeurais sain et sauf
  rationale: Exprime à la fois la continuité de διέμενον et l’absence de dommage indiquée par ἀβλαβής.
