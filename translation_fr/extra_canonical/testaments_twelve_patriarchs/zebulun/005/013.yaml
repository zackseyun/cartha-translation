  source_fidelity: Le masculin singulier αὐτόν est correctement représenté par « le ». Toutefois, δέδωκεν signifie d’abord « donna » ou « remit »; « livra » ajoute une nuance de remise hostile ou de trahison qui n’est pas explicitée par le verbe grec. La seconde proposition rend fidèlement ἐποίησαν καθὼς εἶπεν ὁ Δάν.
  naturalness: « Et c’est ainsi qu’il le leur remit » est naturel en français moderne et conserve la sobriété du récit. « Et ils firent comme Dan l’avait dit » est idiomatique; le plus-que-parfait exprime naturellement l’antériorité du dire de Dan.
  terminology: « Remit » convient à la remise d’une personne sans imposer les connotations plus fortes de « livra ». Le nom « Dan » est conservé conformément au grec Δάν.
  issues:
