  text: And so he gave it to them. And they did as Dan had said.
translation:
  language: fr
  text: Et c’est ainsi qu’il le leur remit. Et ils firent comme Dan l’avait dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκεν αὐτὸν αὐτοῖς
  choice: il le leur livra
  rationale: Le pronom masculin αὐτόν désigne une personne (« le »), non une chose. Dans ce contexte, « livrer » rend naturellement le fait de remettre une personne entre les mains d’autrui, tout en conservant la sobriété du grec.
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: ils firent ce que … avait dit
  rationale: Formulation française naturelle qui exprime fidèlement l’action accomplie conformément aux paroles antérieures de Dan.
- source_word: Καὶ
  choice: Puis
  rationale: Au début de la seconde phrase, « Puis » marque naturellement la succession narrative portée par καί, sans alourdir le français par une répétition de « Et ».
