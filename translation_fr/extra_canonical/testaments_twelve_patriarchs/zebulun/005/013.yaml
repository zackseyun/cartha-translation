    issue: « livra » est plus interprétatif que δέδωκεν.
    rationale: Le grec emploie le parfait de δίδωμι (« donner »). Dans l’absence d’un terme grec explicitant la livraison ou la trahison, « remit » préserve mieux l’amplitude sémantique du source.
  revised_text: Et c’est ainsi qu’il le leur remit. Et ils firent comme Dan l’avait dit.
