base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/012.yaml
  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: fr
  text: 'Mais nous nous sommes tous levés et lui avons dit : « Si tu ne donnes pas la tunique, nous dirons à notre père que toi seul as commis ce mal en Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάντες
  choice: nous nous sommes levés
  rationale: Rend directement le participe grec tout en l’intégrant naturellement à la coordination française.
- source_word: τὸν χιτῶνα
  choice: la tunique
  rationale: Équivalent courant et précis de χιτών dans ce contexte narratif.
- source_word: ἐποίησας τὸ πονηρὸν τοῦτο
  choice: as commis ce mal
  rationale: « Commettre un mal » est idiomatique en français et conserve la qualification morale du grec.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Préserve la formulation collective et théologiquement chargée du texte source sans l’expliciter.
theological_decisions:
- issue: Portée de « en Israël »
  choice: Conserver littéralement « en Israël »
  alternative: « parmi les fils d’Israël » ou « contre Israël »
  rationale: Le grec porte simplement ἐν Ἰσραήλ; la traduction maintient son ambiguïté entre le peuple, la famille et la communauté d’Israël.
translation_notes:
  register: Français moderne, narratif et digne. Le pronom tonique « toi seul » conserve l’insistance de σὺ μόνος. « Nous donnes » explicite le bénéficiaire naturellement impliqué par l’injonction collective, sans modifier le sens.
