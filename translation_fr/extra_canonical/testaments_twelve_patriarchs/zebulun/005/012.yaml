  text: 12. Ἀναστάντες δὲ⁷¹ *Γπάντες˥⁷² εἴπομεν αὐτῷ⁷³, ὅτι⁷⁴ ἐὰν μὴ δῷς *τὸν χιτῶνα⁷⁴, εἴπωμεν⁷⁵ Γτῷ πατρὶ ἡμῶν˥⁷⁶ ὅτι σὺ⁷³ μόνος ἐποίησας τὸ πονηρὸν *τοῦτο ἐν Ἰσραήλ⁷⁷.
