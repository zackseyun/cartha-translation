base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006.yaml
  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: fr
  text: 6 Ainsi[a], je fus le premier à construire une embarcation pour naviguer sur la mer, car le Seigneur me donna intelligence et sagesse à ce sujet[b]. Je fixai une pièce de bois à l’arrière, et…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec disponible pour ce chapitre est fragmentaire ; l’extrait s’interrompt au milieu de la phrase après « et ».
    reason: textual_variant
  - marker: b
    text: Ici, « sagesse » peut aussi désigner une habileté pratique, notamment celle nécessaire à la construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉
  choice: Pour commencer, c’est donc moi
  rationale: Πρῶτος marque ici la priorité de Zabulon dans le récit, tandis que οὖν assure la transition. Cette formulation française conserve les deux nuances sans l’expression peu naturelle « premier donc ».
- source_word: σκάφος
  choice: une embarcation
  rationale: Terme général désignant un bâtiment flottant; « embarcation » reste naturel et évite de préciser indûment sa taille ou son type.
- source_word: ἐπιπλέειν
  choice: naviguer
  rationale: Le verbe signifie littéralement flotter ou aller sur l’eau; dans le contexte d’une embarcation construite pour la mer, « naviguer » exprime naturellement ce déplacement sans supposer nécessairement l’emploi d’une voile.
- source_word: σύνεσιν
  choice: l’intelligence
  rationale: Le terme évoque la compréhension et le discernement; « intelligence » forme en français un couple naturel avec « sagesse » et convient à une aptitude donnée par Dieu.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Conserve la portée large et théologique du mot grec, tout en laissant au contexte la possibilité d’une compétence pratique de constructeur.
- source_word: ἐν αὐτῷ
  choice: m’en avait donné
  rationale: La reprise pronominale française rattache naturellement le don divin au projet de construction et de navigation, tout en évitant un « en cela » lourd et ambigu.
- source_word: καθῆκα
  choice: Je fixai
  rationale: Dans ce contexte de construction navale, le verbe de placement indique vraisemblablement la mise en place ou la fixation d’un élément.
- source_word: ξύλον
  choice: une pièce de bois
  rationale: Le composant nautique exact n’étant pas identifiable dans l’extrait conservé, cette désignation reste proche du grec sans imposer « gouvernail », « poutre » ou un autre objet précis.
- source_word: ὄπισθεν αὐτοῦ
  choice: à l’arrière
  rationale: Dans le contexte de l’embarcation, le grec indique une position derrière ou à l’arrière de celle-ci; la formulation française est idiomatique sans identifier la fonction de la pièce.
- source_word: Κύριος
  choice: le Seigneur
  rationale: L’article et la majuscule signalent clairement la référence divine, conformément à l’usage français biblique courant.
theological_decisions:
- issue: Origine divine de l’aptitude technique
  choice: Le Seigneur donne à Zabulon intelligence et sagesse pour cette entreprise.
  alternative: Réduire σοφία à la seule habileté artisanale.
  rationale: Le couple σύνεσις–σοφία peut inclure un savoir-faire concret, mais possède aussi une portée cognitive et théologique plus large. La traduction maintient ces deux dimensions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé introduit l’affirmation principale, puis le passé simple poursuit sobrement le récit. Les points de suspension rendent visible l’interruption matérielle du texte grec, sans compléter la phrase.
