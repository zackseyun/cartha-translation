  source_fidelity: 'La traduction rend correctement les éléments conservés : priorité de Zabulon (Πρῶτος), construction d’un σκάφος, navigation maritime, don divin de σύνεσις et σοφία, puis fixation d’un ξύλον à l’arrière. Toutefois, « Pour commencer » transforme la revendication de priorité en simple organisateur discursif. « m’en avait donné » ne rend pas clairement ἐν αὐτῷ et le plus-que-parfait ne correspond pas à l’aoriste ἔδωκεν.'
  naturalness: « Ainsi, je fus le premier à construire » est naturel en français narratif et exprime nettement la priorité. « à ce sujet » rend de manière idiomatique le référent de ἐν αὐτῷ sans identifier de façon excessive ce référent incertain. Le passage au passé simple rend le bref récit plus cohérent.
  terminology: « embarcation », « naviguer », « intelligence », « sagesse », « le Seigneur » et « pièce de bois » conviennent. La note sur la sagesse comme habileté pratique est appropriée. La formulation révisée ne réduit pas σοφία à une compétence technique.
