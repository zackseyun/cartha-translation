    rationale: ἐν αὐτῷ renvoie de façon elliptique à l’entreprise ou à l’embarcation; en français, « en » après « donner » peut être compris partitif ou référer à une provenance. L’aoriste ἔδωκεν se rend ici normalement par un passé simple narratif.
