  to: 6 Ainsi[a], je fus le premier à construire une embarcation pour naviguer sur la mer, car le Seigneur me donna intelligence et sagesse à ce sujet[b]. Je fixai une pièce de bois à l’arrière, et…
  rationale: La révision restitue explicitement la priorité exprimée par Πρῶτος et conserve la nuance connective de οὖν par « Ainsi ». Elle remplace la reprise pronominale française ambiguë et le plus-que-parfait par une formulation idiomatique qui maintient l’ellipse du grec quant au domaine auquel se rapporte ἐν αὐτῷ. Les ancres et les deux notes sont conservées, et les points de suspension signalent sans ajout la lacune matérielle après καί.
