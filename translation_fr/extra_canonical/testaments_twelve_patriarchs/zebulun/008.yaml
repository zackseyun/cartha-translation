review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien le réseau lexical σπλάγχνα/ἔλεος par « compassion » et « miséricorde », ainsi que l’exhortation générale. Deux détails demandent toutefois correction : κατοικεῖ est au présent (« il demeure »), non au futur ; et μὴ λογίζεσθε κακίαν demande de ne pas concevoir ou méditer le mal contre le frère, plutôt que de ne pas nourrir de simples « mauvaises pensées ».'
  naturalness: Le français est moderne, fluide et de registre approprié. « Prenez donc exemple sur lui » est naturel. La formulation révisée de 8.2 conserve une syntaxe française claire tout en rendant le référent personnel suggéré par ἐν αὐτῷ.
  terminology: « Seigneur », « Dieu », « compassion », « miséricorde », « prochain », « âme » et « frère » sont cohérents avec le grec et avec un registre moral ancien accessible. « Compassion miséricordieuse » maintient délibérément la double expression σπλάγχνα ἐλέους, sans identification doctrinale de la compassion envoyée.
  issues:
  - severity: medium
    issue: Temps de κατοικεῖ en 8.2
    rationale: 'Le grec porte le présent κατοικεῖ : après le futur « Dieu enverra », il affirme « il demeure » là/chez celui où il trouve la compassion de miséricorde. « Il demeurera » transforme ce présent en futur.'
  - severity: medium
    issue: Rendu de μὴ λογίζεσθε κακίαν en 8.5
    rationale: « Nourrir de mauvaises pensées » peut désigner des pensées négatives en général. Le grec vise plus précisément le fait de compter, concevoir ou méditer le mal contre son frère. « Ne médite le mal » conserve cette orientation hostile sans surinterpréter.
