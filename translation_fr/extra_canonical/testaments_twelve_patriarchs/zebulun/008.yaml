base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: fr
  text: '8 Et vous donc, mes enfants, ayez de la compassion pour toute personne et faites preuve de miséricorde, afin que le Seigneur, ayant lui aussi compassion de vous, vous fasse miséricorde. 2 Car, dans les derniers jours, Dieu enverra sa compassion sur la terre, et chez celui en qui il trouvera une compassion miséricordieuse, il demeure. 3 En effet, dans la mesure où une personne a compassion de son prochain, le Seigneur a lui aussi compassion d’elle.


    4 Lorsque nous sommes descendus en Égypte, Joseph ne nous a pas gardé rancune. 5 Prenez donc exemple sur lui, vous aussi, mes enfants : aimez-vous les uns les autres, et que personne ne médite le mal contre son frère. 6 Car cela brise l’unité, disperse toute parenté, trouble l’âme et défigure le visage.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν / σπλάγχνα / σπλαγχνίζεται
  choice: compassion / avoir compassion
  rationale: La famille grecque évoque une compassion profonde et viscérale. La répétition de « compassion » conserve le lien lexical structurant du passage dans un français naturel.
- source_word: ἐν ἐλέει / ἐλεήσῃ / σπλάγχνα ἐλέους
  choice: faire preuve de miséricorde / faire miséricorde / compassion miséricordieuse
  rationale: « Miséricorde » distingue ἔλεος du vocabulaire de la compassion tout en préservant leur association insistante.
- source_word: κατοικεῖ
  choice: demeurera
  rationale: Le verbe signifie habiter ou demeurer. Le futur s’accorde au cadre futur de la proposition principale, sans préciser davantage la nature de cette présence divine.
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: ne nous a pas gardé rancune
  rationale: Expression française idiomatique qui rend l’idée de se souvenir du mal subi afin d’en tenir rigueur.
- source_word: προσέχοντες
  choice: prenez exemple sur lui
  rationale: Dans ce contexte parénétique, il s’agit de porter son attention sur Joseph comme modèle de conduite.
- source_word: μὴ λογίζεσθε ... κακίαν
  choice: que personne ne nourrisse de mauvaises pensées
  rationale: λογίζομαι désigne ici le fait de concevoir ou entretenir intérieurement le mal contre quelqu’un. Cette formulation reste ouverte entre intention malveillante et ressentiment.
- source_word: πᾶσαν συγγένειαν
  choice: toute parenté
  rationale: Le terme désigne les liens de parenté ou le groupe familial; « toute parenté » conserve l’étendue et la teneur familiale du grec.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: défigure le visage
  rationale: ἀφανίζω peut signifier faire disparaître, altérer ou rendre méconnaissable. « Défigure » exprime naturellement l’altération visible du visage causée par le trouble intérieur.
theological_decisions:
- issue: Rapport entre compassion humaine et compassion du Seigneur au verset 3
  choice: « dans la mesure où… le Seigneur a lui aussi compassion »
  alternative: Présenter la compassion divine comme mécaniquement méritée ou proportionnée à l’action humaine.
  rationale: Le parallélisme quantitatif du grec est conservé sans élaborer un système causal ou méritoire absent du texte.
- issue: Envoi de la compassion divine sur la terre
  choice: « Dieu enverra sa compassion sur la terre »
  alternative: Identifier explicitement cette compassion à une personne, au Messie ou à l’Esprit.
  rationale: Le grec personnifie possiblement la compassion divine, mais n’en donne pas ici d’identification explicite; l’ambiguïté est donc préservée.
- issue: Demeure divine auprès de la compassion miséricordieuse
  choice: « partout où il trouvera… là il demeurera »
  alternative: « dans celui en qui il la trouvera, il demeurera »
  rationale: Le grec passe d’une formulation spatiale (« où ») à une reprise susceptible d’être personnelle (« en lui »). La traduction conserve la déclaration sans décider si la demeure vise une personne précise ou tout lieu où cette qualité se trouve.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions de « compassion » et « miséricorde » sont volontairement maintenues parce qu’elles structurent l’argument grec. « Prochain », « âme » et « frère » conservent le registre moral et familial du texte ancien sans ajout confessionnel.
