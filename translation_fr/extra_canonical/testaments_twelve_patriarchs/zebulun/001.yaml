base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: fr
  text: '**Testament de Zabulon, sixième fils de Jacob et de Léa[a]**


    **1** Copie des paroles de Zabulon, par lesquelles il donna ses dernières instructions à ses fils avant de mourir, dans la cent quatorzième année de sa vie[b], deux ans après la mort de Joseph.


    **2** Il leur dit : « Écoutez-moi »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins présentent une variante du nom du patriarche dans la suscription ; le texte fourni nomme Zabulon.
    reason: textual_variant
  - marker: b
    text: Le nombre exact indiquant l’âge varie dans la tradition manuscrite ; la traduction suit ici le témoin grec fourni.
    reason: textual_variant
  - marker: c
    text: Le texte grec fourni pour cette unité s’interrompt après « Écoutez-moi ».
    reason: source_scope
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans ce titre, le terme désigne les dernières paroles et dispositions attribuées au patriarche; « Testament » conserve le genre littéraire traditionnel sans imposer ici le sens d’« alliance ».
- source_word: Ἀντίγραφον λόγων
  choice: Copie des paroles
  rationale: Rend directement l’idée d’une transcription ou copie des paroles, dans un français naturel.
- source_word: διέθετο
  choice: donna ses dernières instructions
  rationale: Le verbe peut évoquer le fait de disposer, d’ordonner ou de transmettre des consignes testamentaires. Cette formulation exprime le contexte sans introduire une notion juridique trop étroite.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει
  choice: dans la cent quatorzième année
  rationale: Suit littéralement le nombre du témoin grec fourni tout en employant une tournure française claire.
- source_word: Ἀκούσατέ μου
  choice: Écoutez-moi
  rationale: Impératif direct et naturel, qui conserve l’appel solennel adressé aux fils.
theological_decisions:
- issue: Sens de διαθήκη dans la suscription
  choice: Testament
  alternative: Alliance
  rationale: Le contexte est celui des dernières instructions d’un patriarche à ses fils. « Testament » préserve le genre de l’œuvre, tandis qu’« alliance » orienterait indûment le passage vers une catégorie théologique différente.
- issue: Portée de διέθετο
  choice: il donna ses dernières instructions
  alternative: il ordonna / il disposa
  rationale: La traduction garde la tonalité testamentaire sans préciser à tort s’il s’agit d’ordres formels, de dispositions juridiques ou d’une exhortation morale.
translation_notes:
  register: Français international moderne, digne et accessible. La suscription est conservée comme titre. Le fragment transmis est traduit sans compléter la suite à partir de la couche anglaise de consultation.
