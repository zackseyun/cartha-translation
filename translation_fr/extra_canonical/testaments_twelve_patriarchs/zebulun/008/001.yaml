source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: fr
  text: Ainsi donc, mes enfants, ayez de la compassion envers toute personne, avec miséricorde, afin que le Seigneur aussi, ayant compassion de vous, vous fasse miséricorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν
  choice: compassion
  rationale: Le nom « compassion » rend naturellement en français l’idée d’une profonde sollicitude exprimée par le grec.
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: de toute personne
  rationale: « Toute personne » est inclusif, moderne et fidèle à la portée universelle de παντὸς ἀνθρώπου.
- source_word: ἐν ἐλέει
  choice: avec miséricorde
  rationale: Cette tournure française naturelle conserve la distinction entre la compassion demandée et la miséricorde dans laquelle elle doit s’exercer.
- source_word: σπλαγχνισθεὶς
  choice: ait compassion
  rationale: Le subjonctif français s’intègre à la proposition finale et restitue le participe grec sans imposer une antériorité marquée.
- source_word: ἐλεήσῃ
  choice: vous fasse miséricorde
  rationale: La formulation dignifiée maintient le lien lexical et rhétorique avec ἐλέει.
theological_decisions:
- issue: Rapport entre la compassion humaine et la miséricorde divine
  choice: « afin que »
  alternative: « pour que » ou une formulation présentant la miséricorde divine comme automatique
  rationale: « Afin que » conserve la relation exhortative exprimée par ἵνα, sans préciser davantage la nature théologique de cette relation ni en faire un mécanisme méritoire.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « compassion » et de « miséricorde » est conservée afin de rendre le parallélisme et les échos lexicaux du grec.
