source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ὅτι καίγε³ ἐπʼ ἐσχάτων τῶν⁴ ἡμερῶν ὁ Θεὸς ἀποστελεῖ⁵ *τὰ σπλάγχνα⁶ αὐτοῦ ἐπὶ τῆς⁷ γῆς, καὶ ὅπου εὕρῃ σπλάγχνα ἐλέους, ἐν αὐτῷ κατοικεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/002.yaml
  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: fr
  text: Car, certes, dans les derniers jours, Dieu enverra sa compassion sur la terre, et là où il trouvera une compassion empreinte de miséricorde, il demeure en cette personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: sa compassion
  rationale: Littéralement « ses entrailles », expression grecque désignant le siège de la tendresse et de la compassion. « Sa compassion » transmet naturellement ce sens en français moderne.
- source_word: σπλάγχνα ἐλέους
  choice: une compassion pleine de miséricorde
  rationale: Cette formulation conserve les deux éléments de l’expression grecque — la compassion (σπλάγχνα) et la miséricorde (ἐλέους) — sans produire le tour peu naturel « entrailles de miséricorde ».
- source_word: κατοικεῖ
  choice: il habitera
  rationale: Le présent grec peut avoir ici une valeur future dans la suite de « Dieu enverra » ; le futur rend cette cohérence temporelle en français tout en gardant l’idée forte de demeure.
theological_decisions:
- issue: Le sujet implicite de κατοικεῖ et la présence divine
  choice: « là il habitera », avec Dieu pour sujet
  alternative: « en cette personne elle demeure », avec la compassion pour sujet
  rationale: Le masculin αὐτῷ et le contexte rendent naturel le sens selon lequel Dieu habite en celui où il trouve la compassion. La traduction évite d’expliciter davantage le mode de cette habitation.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « compassion » est maintenue pour refléter le lien lexical voulu par le grec, tandis que « pleine de miséricorde » rend l’expression génitivale de manière idiomatique.
