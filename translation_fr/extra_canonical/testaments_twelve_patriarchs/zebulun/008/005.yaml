source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Εἰς¹⁴ ὃν *προσέχοντες καὶ ὑμεῖς, τέκνα μου ἀγαπᾶτε ἀλλήλους¹⁵, καὶ μὴ λογίζεσθε¹⁶ ἕκαστος *κακίαν πρὸς τὸν ἀδελφὸν¹⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: fr
  text: En prêtant attention à lui[a], vous aussi, mes enfants, aimez-vous les uns les autres, et que nul ne forme de mauvais dessein contre son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En vous attachant à lui ». Le référent de « lui » se trouve dans le contexte précédent.'
    reason: Indique la nuance possible de προσέχοντες et la dépendance contextuelle du pronom, sans imposer l'identité du référent.
lexical_decisions:
- source_word: προσέχοντες
  choice: en vous attachant à
  rationale: Le verbe exprime ici une attention soutenue et une orientation vers quelqu’un. Cette formulation est naturelle en français tout en conservant la relation marquée par εἰς ὃν.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: Rend directement le commandement réciproque dans un français courant et digne.
- source_word: μὴ λογίζεσθε … κακίαν
  choice: que personne ne médite le mal
  rationale: λογίζομαι peut désigner le fait de calculer, concevoir ou nourrir intérieurement un dessein. « Méditer le mal » préserve ici l’idée d’une intention mauvaise dirigée contre autrui.
- source_word: ἀδελφόν
  choice: frère
  rationale: Conserve l’image familiale du grec sans la généraliser en « prochain ».
theological_decisions:
- issue: Référent du pronom relatif εἰς ὃν
  choice: lui
  alternative: celui-ci / cette personne
  rationale: Le grec emploie un référent masculin singulier dont l’identité dépend du contexte précédent. Le pronom maintient ce lien sans préciser indûment son identité.
- issue: Nature du mal visé par κακίαν
  choice: le mal médité contre le frère
  alternative: la rancune nourrie envers le frère
  rationale: Le terme κακία est plus large que la seule rancune. La traduction conserve donc la portée générale du mal intentionnel sans la réduire à un sentiment particulier.
translation_notes:
  register: Français international moderne, simple et digne. L’adresse « mes enfants » et l’image de « frère » sont conservées. La syntaxe impérative reste fluide sans ajouter le connecteur « alors », absent du texte grec établi.
