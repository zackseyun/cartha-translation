  text: 3. Ὅσον γὰρ⁸ ἄνθρωπος σπλαγχνίζεται εἰς *τὸν πλησίον αὐτοῦ⁹, τοσοῦτον *καὶ ὁ⁴ Κύριος εἰς αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/003.yaml
  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: fr
  text: Car plus un homme éprouve de la compassion pour son prochain, plus le Seigneur éprouve aussi de la compassion pour lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  choice: éprouve de la compassion
  rationale: Rend naturellement en français le mouvement profond de compassion exprimé par le verbe grec, sans en réduire la portée à une simple pitié.
- source_word: ὁ πλησίον αὐτοῦ
  choice: son prochain
  rationale: « Son prochain » est l’équivalent français traditionnel et toujours intelligible, qui conserve la portée relationnelle du grec.
- source_word: Ὅσον … τοσοῦτον
  choice: plus… plus
  rationale: Cette corrélation idiomatique restitue clairement la proportion exprimée par la construction grecque.
theological_decisions:
- issue: Rapport proportionnel entre la compassion humaine et celle du Seigneur
  choice: Conserver la formulation proportionnelle « plus… plus »
  alternative: « Autant un homme… autant le Seigneur… »
  rationale: Le grec établit explicitement une correspondance de degré. La traduction la maintient sans préciser s’il s’agit d’une condition, d’une récompense ou d’un principe de réciprocité.
translation_notes:
  register: Français moderne, simple et digne. La répétition d’« éprouve de la compassion » est conservée pour faire entendre le parallélisme du grec.
