source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Ὅτι τοῦτο⁷ χωρίζει ἑνότητα¹⁸, καὶ Γπᾶσαν συγγένειαν˥¹⁹ διασκορπίζει²⁰, Γκαὶ τὴν ψυχὴν ταράσσει˥²¹ καὶ τὸ πρόσωπον ἀφανίζει²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: fr
  text: Car cela divise l’unité, disperse tous les liens de parenté, trouble l’âme et défigure le visage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: brise l’unité
  rationale: χωρίζει exprime ici la séparation ou la rupture; « brise » rend naturellement en français l’effet destructeur exercé sur l’unité.
- source_word: πᾶσαν συγγένειαν διασκορπίζει
  choice: disperse tous les liens de parenté
  rationale: συγγένεια peut désigner la parenté ou les relations familiales; « liens de parenté » conserve la dimension relationnelle, tandis que διασκορπίζει est rendu directement par « disperse ».
- source_word: τὴν ψυχὴν ταράσσει
  choice: trouble l’âme
  rationale: Traduction proche du grec, qui préserve le sens intérieur et personnel de ψυχή sans le réduire à l’émotion.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: défigure le visage
  rationale: ἀφανίζει signifie faire disparaître, rendre méconnaissable ou détériorer; appliqué au visage, « défigure » exprime idiomatiquement cet effet sans imposer un mécanisme précis.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure cumulative des quatre effets est conservée, avec une formulation légèrement idiomatique pour χωρίζει ἑνότητα.
