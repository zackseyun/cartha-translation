  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: fr
  text: '1 Observez donc les eaux et comprenez ceci : lorsqu’elles se dirigent vers un même endroit, elles entraînent des pierres, du bois, de la terre et diverses autres choses. 2 Mais si elles se divisent en de nombreux bras, la terre les fait disparaître et elles deviennent faciles à mépriser. 3 Il en sera de même pour vous si vous vous divisez. 4 Ne vous partagez donc pas entre deux têtes, car tout ce que le Seigneur a fait possède une seule tête, et deux épaules, deux mains, deux pieds, ainsi que tous les autres membres. 5 En effet, j’ai appris dans un écrit de mes pères que vous vous diviserez au sein d’Israël, que vous suivrez deux royaumes et que vous commettrez toute abomination. 6 Vos ennemis vous emmèneront en captivité, et vous souffrirez parmi les nations, dans de nombreuses faiblesses et détresses. 7 Après cela, lorsque vous vous souviendrez du Seigneur, vous reviendrez[a], et il aura compassion de vous, car il est miséricordieux et compatissant. Il ne met pas la méchanceté
    au compte des êtres humains, parce qu’ils sont chair et qu’ils s’égarent dans leurs actes mauvais[b]. 8 Après cela, le Seigneur lui-même se lèvera pour vous[c], lumière de justice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins portent : « vous vous souviendrez du Seigneur et vous vous repentirez, et il vous ramènera », au lieu de : « lorsque vous vous souviendrez du Seigneur, vous reviendrez ».'
    reason: textual_variant
  - marker: b
    text: 'Certains témoins développent ainsi la proposition causale : « parce qu’ils sont chair et que les esprits d’égarement les égarent dans tous leurs actes ».'
    reason: textual_variant
  - marker: c
    text: Ou « poindra pour vous » ; l’image est celle du Seigneur apparaissant comme une lumière qui se lève.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: Observez
  rationale: Dans le contexte de l’exemple tiré des eaux, « observez » exprime naturellement l’exhortation à porter attention et à en tirer une leçon.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: se dirigent vers un même endroit
  rationale: Cette formulation garde l’idée de mouvement vers un même lieu sans imposer plus précisément l’image d’une confluence.
- source_word: κατασύρουσιν
  choice: entraînent
  rationale: Le verbe français rend le mouvement par lequel le courant emporte avec lui les divers matériaux.
- source_word: ἀφανίζει
  choice: fait disparaître
  rationale: Rend directement l’absorption des eaux dispersées par la terre, sans transformer le verbe en une métaphore absente du grec.
- source_word: εὐκαταφρόνητα
  choice: faciles à mépriser
  rationale: Conserve la notion de mépris ou de peu de considération attachée aux eaux devenues faibles par leur dispersion.
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: ne vous scindez pas sous deux têtes
  rationale: « Scinder » distingue χωρίζω du vocabulaire répété de la division, tandis que « têtes » préserve la métaphore corporelle et politique développée aussitôt après.
- source_word: γραφῇ τῶν πατέρων μου
  choice: dans les écrits de mes pères
  rationale: Formulation française naturelle qui conserve l’autorité ancestrale sans affirmer explicitement un statut canonique.
- source_word: ἀσθενείαις καὶ θλίψεσιν
  choice: faiblesses et détresses
  rationale: Préserve les deux termes du grec, le premier pouvant désigner des faiblesses ou des infirmités et le second des situations d’oppression ou d’angoisse.
- source_word: οὐ λογίζεται κακίαν
  choice: ne met pas la méchanceté au compte
  rationale: Reproduit l’image comptable de λογίζομαι tout en restant intelligible en français moderne.
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Le verbe convient à l’apparition du Seigneur comme lumière tout en laissant ouverte l’image d’un astre qui se lève ou d’une lumière qui paraît.
- source_word: φῶς δικαιοσύνης
  choice: lumière de justice
  rationale: Conserve sans l’interpréter l’expression théologiquement dense et son rapport appositionnel au Seigneur.
theological_decisions:
- issue: Séquence du souvenir et du retour au verset 7
  choice: « lorsque vous vous souviendrez du Seigneur, vous reviendrez »
  alternative: « vous vous souviendrez du Seigneur et vous vous repentirez, et il vous ramènera »
  rationale: Le texte principal suit la forme grecque fournie, où le peuple revient après s’être souvenu du Seigneur. La variante, qui attribue explicitement à Dieu l’action de ramener, est signalée sans harmonisation.
- issue: Cause de l’égarement humain au verset 7
  choice: « parce qu’ils sont chair et qu’ils s’égarent dans leurs actes mauvais »
  alternative: « parce qu’ils sont chair et que les esprits d’égarement les égarent dans tous leurs actes »
  rationale: La leçon courte du texte fourni est retenue; l’expansion sur les esprits d’égarement est conservée en note afin de ne pas introduire silencieusement un développement théologique textuellement variable.
- issue: Identité et portée de la « lumière de justice » au verset 8
  choice: Maintenir l’expression comme apposition au Seigneur lui-même
  alternative: En faire explicitement un titre messianique ou une simple métaphore générale de restauration
  rationale: Le grec identifie étroitement le Seigneur qui se lève et la lumière de justice, mais ne précise pas davantage le statut de l’expression. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure assez formelle pour préserver la structure exhortative et prophétique. Les métaphores des eaux, des deux têtes et de la lumière sont conservées plutôt qu’explicitées dans le corps du texte.
