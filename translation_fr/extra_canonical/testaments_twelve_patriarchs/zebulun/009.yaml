review_pass:
  verdict: revise
  source_fidelity: 'Le texte suit fidèlement le grec dans l’ensemble : l’image des eaux convergentes puis dispersées, l’avertissement contre la division sous deux « têtes », la captivité, le retour au Seigneur et l’image finale de la lumière de justice sont préservés. Une correction est requise en v. 4 : le grec coordonne les membres par καί (« et »), sans opposition justifiant « mais ». En v. 5, γραφῇ est au singulier ; « un écrit de mes pères » rend plus exactement le texte fourni.'
  naturalness: Le français est généralement moderne, clair et d’un registre approprié. « Ne vous scindez pas sous deux têtes » est compréhensible mais peu idiomatique ; « ne vous partagez pas entre deux têtes » est plus naturel tout en maintenant la métaphore corporelle et politique. « En de nombreux bras » donne une expression française naturelle à la dispersion des eaux.
  terminology: « Seigneur », « abomination », « captivité », « miséricordieux », « compatissant », « chair » et « lumière de justice » sont bien rendus. « Mettre la méchanceté au compte des êtres humains » conserve utilement l’image comptable de λογίζεται. Les trois notes conservent les variantes et l’alternative lexicale sans imposer d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: Coordination fautive en v. 4
    rationale: '« Mais deux épaules » introduit en français une opposition absente du grec, qui énumère simplement : « une tête, et deux épaules, deux mains, deux pieds... ». Il faut « et ».'
  - severity: low
    issue: Nombre de γραφῇ en v. 5
    rationale: Le grec porte le singulier γραφῇ. « Dans les écrits de mes pères » est possible comme généralisation, mais « dans un écrit de mes pères » respecte plus étroitement le singulier sans affecter le sens.
  - severity: low
    issue: Formulation de l’exhortation en v. 4
    rationale: « Se scinder sous deux têtes » est grammaticalement possible, mais raide en français moderne. « Se partager entre deux têtes » exprime naturellement l’allégeance divisée tout en gardant les « têtes » explicites.
