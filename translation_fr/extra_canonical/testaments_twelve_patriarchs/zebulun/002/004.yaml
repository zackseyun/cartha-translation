  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: fr
  text: 'Je ne me souviens pas d’avoir commis de transgression, sauf l’ignorance que j’ai commise à l’égard de Joseph : j’ai obtenu de mes frères l’assurance qu’ils ne diraient pas à mon père ce qui s’était passé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομίαν
  choice: transgression
  rationale: Le terme désigne une conduite contraire à la loi; « transgression » conserve cette portée morale et juridique dans un français digne et courant.
- source_word: ἄγνοιαν
  choice: faute par ignorance
  rationale: Le substantif signifie littéralement « ignorance », mais il est ici présenté comme quelque chose que le locuteur a commis; « faute par ignorance » rend naturellement cette valeur fautive sans effacer l’absence de pleine connaissance.
- source_word: ἐβεβαίωσα
  choice: j’ai confirmé
  rationale: Le verbe exprime le fait de rendre ferme, confirmer ou garantir. « J’ai confirmé » reste proche du grec et évite d’ajouter explicitement la notion de promesse.
- source_word: μὴ εἰπεῖν
  choice: que nous ne dirions pas
  rationale: L’infinitif négatif dépend de ἐβεβαίωσα. La formulation française explicite naturellement l’engagement collectif impliqué par le contexte, tout en conservant la négation.
- source_word: τὸ γενόμενον
  choice: ce qui s’était passé
  rationale: Rend idiomatiquement le participe substantivé, littéralement « ce qui était arrivé/advenu ».
theological_decisions:
- issue: Portée morale de ἄγνοιαν
  choice: faute par ignorance
  alternative: ignorance
  rationale: Le grec associe ἄγνοιαν à ἐποίησα, « j’ai commise »; la traduction maintient donc à la fois l’ignorance et sa qualification comme acte fautif, sans préciser davantage le degré de culpabilité.
- issue: Sujet implicite de μὴ εἰπεῖν
  choice: nous ne dirions pas
  alternative: de ne pas dire / qu’ils ne diraient pas
  rationale: Le grec ne donne pas de sujet explicite à l’infinitif. Le contexte permet une portée collective incluant Zabulon, mais l’ambiguïté syntaxique demeure réelle; la solution retenue produit un français intelligible sans faire des frères seuls les sujets.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « commis/commise » reflète celle de ἐποίησα tout en restant acceptable; « quelque transgression que ce soit » restitue la négation générale. Le nom est rendu « Joseph », conformément à l’usage français biblique.
