    issue: Ajout de « mais »
    rationale: Le grec coordonne les deux propositions par καί (« et »). Le contraste peut être ressenti dans le récit, mais n’est pas grammaticalement marqué; « mais » explicite donc légèrement l’interprétation.
  - severity: low
    issue: « Vinrent trouver Joseph » atténue la direction hostile de ἐπί
    rationale: Avec le projet de le tuer, ἐπὶ τὸν Ἰωσήφ signifie un mouvement dirigé contre/vers Joseph. « Vinrent vers Joseph » conserve cette orientation sans ajouter une agression accomplie.
