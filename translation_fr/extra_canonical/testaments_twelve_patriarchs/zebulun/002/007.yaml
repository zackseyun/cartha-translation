  text: For Simeon and Dan and Gad came against Joseph to kill him, and he spoke to them with tears.
translation:
  language: fr
  text: En effet, Siméon, Dan et Gad vinrent vers Joseph pour le tuer, et il leur parlait en pleurant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον … ἐπὶ τὸν Ἰωσήφ
  choice: vinrent trouver Joseph
  rationale: Rend naturellement en français le mouvement dirigé vers Joseph; « s’en prirent à Joseph » aurait anticipé une agression que le grec ne formule pas explicitement ici.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: pour le tuer
  rationale: Exprime directement la finalité indiquée par l’infinitif articulé au génitif.
- source_word: ἔλεγεν αὐτοῖς
  choice: celui-ci leur parlait
  rationale: L’imparfait grec suggère une parole en cours ou répétée. « Celui-ci » désambiguïse naturellement le sujet, qui renvoie à Joseph dans le contexte.
- source_word: μετὰ δακρύων
  choice: en pleurant
  rationale: Formulation française courante qui conserve le sens de « avec des larmes » sans lourdeur littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination grecque est légèrement lissée; « mais » explicite le contraste narratif entre l’intention meurtrière des frères et la supplication de Joseph, implicite dans la scène.
