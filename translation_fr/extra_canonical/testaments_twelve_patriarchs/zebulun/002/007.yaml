  verdict: revise
  source_fidelity: Le projet rend correctement les personnages, le but meurtrier (τοῦ ἀνελεῖν αὐτόν) et la valeur durative de l’imparfait ἔλεγεν. Toutefois, « mais » introduit un contraste absent de la coordination grecque καί; il convient de conserver une simple succession narrative. « Vinrent vers Joseph » rend le mouvement dirigé contre/vers Joseph (ἐπὶ τὸν Ἰωσήφ) sans surinterpréter l’attaque elle-même.
  naturalness: La formulation révisée est fluide et naturelle en français moderne international. « Il leur parlait en pleurant » exprime sobrement la parole en cours et les larmes.
  terminology: Les noms traditionnels français « Siméon », « Dan » et « Gad » sont appropriés. Aucun terme théologique spécialisé n’est en jeu.
  issues:
