  naturalness: « Prendre en compassion les entrailles » n'est pas une tournure naturelle en français moderne et donne l'impression que les entrailles elles-mêmes sont l'objet matériel de la pitié. Une expression abstraite dans le texte, accompagnée d'une note sur l'image grecque, conserve le sens tout en restant idiomatique.
  terminology: « Ayez pitié », « sang innocent » et « j'ai péché contre vous » sont exacts et conviennent au registre. « La tendresse de Jacob » communique ici la valeur affective de σπλάγχνα sans imposer une interprétation doctrinale.
