base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: fr
  text: « Ayez pitié de moi, mes frères ! Ayez compassion de la tendresse de Jacob, notre père[a]. Ne portez pas la main sur moi pour verser un sang innocent, car je n’ai pas péché contre vous, même en tombant parmi vous[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayez compassion des entrailles de Jacob, notre père ». Dans cet emploi figuré, les « entrailles » désignent les affections profondes, la tendresse et la compassion.'
    reason: Conserver et expliquer l'image corporelle grecque sans employer dans le texte une tournure française peu naturelle.
  - marker: b
    text: 'Le grec est difficile. On peut aussi comprendre : « car, même tombé parmi vous, je n’ai pas péché contre vous ».'
    reason: Préserver l'incertitude du rattachement de « contre vous » et de la valeur du participe « tombé ».
lexical_decisions:
- source_word: ἐλεήσατέ με
  choice: Ayez pitié de moi
  rationale: Rend directement l’impératif et son objet dans un français naturel et digne.
- source_word: οἰκτειρήσατε σπλάγχνα
  choice: Prenez en compassion les entrailles
  rationale: Conserve l’image grecque des « entrailles », siège figuré de la tendresse et de la douleur, tout en donnant à l’impératif une tournure française compréhensible.
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: Ne portez pas la main sur moi
  rationale: Expression française idiomatique correspondant au geste hostile visé; « sur moi » explicite la victime implicite dans le grec.
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: pour répandre un sang innocent
  rationale: Reproduit l’expression grecque et sa portée morale sans l’atténuer.
- source_word: οὐχ ἥμαρτον
  choice: je n’ai pas péché
  rationale: Préserve le vocabulaire moral et théologique du verbe grec plutôt que de le réduire à « je ne vous ai fait aucun mal ».
- source_word: καὶ πεσὼν εἰς ὑμᾶς
  choice: contre vous, même en tombant entre vos mains
  rationale: Cherche à rendre à la fois la relation de ἁμαρτάνω avec εἰς ὑμᾶς (« pécher contre vous ») et le participe πεσών (« tombant »), laissé de côté dans la consultation anglaise; la syntaxe grecque demeure difficile.
theological_decisions:
- issue: La métaphore des « entrailles » de Jacob
  choice: Conserver l’image corporelle dans le texte
  alternative: Parler seulement de la compassion ou des sentiments de Jacob
  rationale: Le grec nomme explicitement les σπλάγχνα. Les remplacer sans indication par une abstraction effacerait l’intensité familiale et affective de l’appel.
- issue: L’innocence affirmée par le locuteur
  choice: « je n’ai pas péché contre vous »
  alternative: « je ne vous ai fait aucun mal »
  rationale: La formulation retenue maintient la force morale de ἁμαρτάνω sans tirer de conclusion doctrinale plus large sur une éventuelle absence totale de péché.
- issue: La proposition finale syntaxiquement difficile
  choice: Inclure le participe « tombant » et signaler l’ambiguïté en note
  alternative: Omettre le participe et traduire simplement « car je n’ai pas péché contre vous »
  rationale: L’omission produirait une phrase plus fluide, comme dans la consultation anglaise, mais ne représenterait pas tout le texte grec transmis.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. L’adresse fraternelle et les impératifs gardent l’urgence de la supplication. La métaphore biblique des « entrailles » est maintenue et expliquée, tandis que « porter la main sur quelqu’un » assure une lecture naturelle.
