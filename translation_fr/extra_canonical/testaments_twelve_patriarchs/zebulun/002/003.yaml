  text: 4. Οὐκ ἔγνων ⌜δὲ²⁶⌝ ὅτι ἥμαρτον ἐν ταῖς ἡμέραις μου ⌜παρεκτὸς ἐννοίας⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/003.yaml
  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: fr
  text: Et je n’ai pas eu conscience d’avoir péché au cours de ma vie, si ce n’est en pensée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνων
  choice: je n’ai pas eu conscience
  rationale: Dans ce contexte d’examen rétrospectif de sa conduite, cette formulation française exprime naturellement l’idée de ne pas savoir ou ne pas avoir connaissance d’une faute commise, sans transformer l’énoncé en affirmation absolue d’innocence.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: au cours de ma vie
  rationale: L’expression grecque signifie littéralement « pendant mes jours » et désigne ici l’ensemble de la vie passée du locuteur.
- source_word: παρεκτὸς ἐννοίας
  choice: si ce n’est en pensée
  rationale: ἐννοία peut désigner la pensée, l’intention ou le dessein. « En pensée » reste naturel et assez large pour ne pas réduire le sens à une intention arrêtée.
theological_decisions:
- issue: Portée de la déclaration concernant le péché
  choice: Formuler l’énoncé comme une absence de conscience d’avoir péché, avec l’exception « en pensée »
  alternative: « Je sais que je n’ai pas péché au cours de ma vie, sauf en intention »
  rationale: La syntaxe grecque rattache directement la négation à ἔγνων (« je n’ai pas su / reconnu »). La traduction retenue conserve donc la nuance épistémique et évite de convertir le passage en revendication catégorique d’absence de péché.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure concise et introspective; « au cours de ma vie » évite le calque peu naturel « durant mes jours », tandis que « en pensée » préserve l’étendue sémantique de ἐννοία.
