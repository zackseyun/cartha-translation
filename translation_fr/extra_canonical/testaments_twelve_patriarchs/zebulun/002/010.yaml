base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/010.yaml
  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: fr
  text: Et tandis qu’il prononçait ces paroles en se lamentant, moi, incapable de supporter ses cris, je me mis à pleurer. Mon foie se répandit, et toute la substance de mes entrailles défaillit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυρόμενος
  choice: en se lamentant
  rationale: Le participe exprime une lamentation douloureuse accompagnant la parole; cette formulation conserve à la fois l’action et la tonalité de deuil.
- source_word: οἰμωγῶν
  choice: cris
  rationale: Le terme désigne des plaintes ou cris de douleur; «cris» reste naturel en français et correspond au contexte de lamentation.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: Mon foie se répandit
  rationale: Traduction volontairement concrète de l’image physiologique grecque, où le foie est associé aux émotions profondes; une paraphrase comme «mon cœur se brisa» effacerait l’imagerie source.
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου
  choice: toute la substance de mes entrailles
  rationale: «Substance» rend le sens concret de ὑπόστασις dans cette expression, tandis que «entrailles» restitue σπλάγχνα comme siège corporel des émotions.
- source_word: ἐχαυνοῦτο
  choice: défaillit
  rationale: Le verbe évoque l’affaissement, l’épuisement ou la perte de vigueur; «défaillit» rend cet effondrement intérieur dans un registre digne.
theological_decisions: []
