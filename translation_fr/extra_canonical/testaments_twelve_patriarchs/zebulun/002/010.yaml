  source_fidelity: 'Le texte français suit de près le grec : le participe ὀδυρόμενος est bien rendu, l’incapacité à supporter les οἰμωγαί est conservée, et la succession « je me mis à pleurer / mon foie se répandit / la substance de mes entrailles défaillit » respecte l’imagerie corporelle et l’enchaînement du source. Le singulier français « mon foie » est une restitution naturelle du pluriel grec τὰ ἤπατα, employé ici dans une image physiologique.'
  naturalness: Le français est moderne, clair et d’un registre sobrement élevé. « En se lamentant », « ses cris » et « se mit à pleurer » sont idiomatiques. L’étrangeté de « Mon foie se répandit » est intentionnelle et justifiée par la fidélité à l’image grecque; elle ne résulte pas d’une maladresse de français.
