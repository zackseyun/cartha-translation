base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/009.yaml
  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: fr
  text: Mais même si j’ai péché, imposez-moi une discipline, mes frères ; mais ne levez pas la main pour tuer votre frère, par égard pour Jacob, votre père.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: corrigez-moi comme il convient
  rationale: La construction répétitive associe le verbe παιδεύω au nom παιδεία et demande une correction disciplinaire. Une répétition littérale serait lourde en français ; cette formulation en garde le sens et l’insistance sans suggérer nécessairement un châtiment précis.
- source_word: τὴν ... χεῖρα ὑμῶν μὴ ἐνέγκατε
  choice: ne levez pas la main
  rationale: Expression française naturelle qui rend l’image grecque de la main engagée dans un acte violent.
- source_word: ἐν φόνῳ ἀδελφοῦ ὑμῶν
  choice: pour tuer votre frère
  rationale: φόνος désigne la mise à mort ou le meurtre. L’infinitif français exprime clairement l’action envisagée sans employer la tournure peu naturelle «dans le meurtre».
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: par égard pour Jacob, votre père
  rationale: 'διὰ avec l’accusatif indique ici le motif : ils doivent s’abstenir à cause de leur père Jacob, c’est-à-dire par considération pour lui.'
theological_decisions:
- issue: Nature de la discipline demandée
  choice: «corrigez-moi comme il convient» laisse ouverte la forme de la correction
  alternative: «punissez-moi» ou «infligez-moi une correction»
  rationale: Le grec παιδεία peut couvrir l’éducation, la discipline et la correction ; le contexte oppose une correction légitime au meurtre, sans en préciser la modalité.
- issue: Portée de φόνος
  choice: «tuer»
  alternative: «assassiner» ou «commettre le meurtre de»
  rationale: «Tuer» conserve l’idée centrale de mise à mort sans ajouter la préméditation que peut évoquer «assassiner» en français moderne.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le contraste δὲ ... δὲ est rendu par «Mais ... toutefois». L’adresse «mes frères» et l’apposition «votre père» sont conservées.
