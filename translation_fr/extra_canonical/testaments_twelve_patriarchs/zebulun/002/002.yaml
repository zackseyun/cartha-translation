revisions:
- from: Moi, Zabulon, je suis devenu un don précieux pour mes parents. En effet, à ma naissance, mon père connut un grand accroissement, de même que ses moutons et ses troupeaux de bovins, lorsqu’il reçut sa part parmi les baguettes striées.[a]
  to: Moi, Zabulon, je suis devenu un bon don pour mes parents. En effet, lorsque je naquis, mon père prospéra grandement, et les brebis comme les bovins se multiplièrent, lorsqu’il avait sa part parmi les baguettes striées.[a]
  rationale: La révision remplace l’expression française peu naturelle concernant l’« accroissement » du père par une formulation contextuellement fidèle, explicite l’augmentation des deux catégories de bétail, et surtout corrige « reçut » en « avait » afin de respecter l’imparfait grec. L’allusion finale demeure volontairement étrange, conformément à l’état du texte source.
