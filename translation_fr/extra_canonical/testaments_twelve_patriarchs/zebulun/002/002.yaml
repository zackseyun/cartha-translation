  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: fr
  text: Moi, Zabulon, je suis devenu un bon don pour mes parents. En effet, lorsque je naquis, mon père prospéra grandement, et les brebis comme les bovins se multiplièrent, lorsqu’il avait sa part parmi les baguettes striées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Allusion probable à l’épisode où Jacob plaça des baguettes striées devant les troupeaux et reçut pour part les animaux marquetés ou tachetés (Genèse 30.32-43). La formulation grecque est obscure.
    reason: Éclairer l’allusion scripturaire sans résoudre dans le texte principal la relation syntaxique incertaine entre la part et les baguettes.
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: un don précieux
  rationale: Exprime naturellement en français un don bénéfique et de valeur, sans donner à « bon » une tournure maladroite.
- source_word: γέγονα
  choice: je suis devenu
  rationale: Conserve la valeur résultative du parfait grec et la formulation autobiographique.
- source_word: ηὐξήνθη ... σφόδρα
  choice: connut un grand accroissement
  rationale: Rend l’idée d’une forte augmentation sans limiter explicitement celle-ci à la prospérité économique.
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: ses moutons et ses troupeaux de bovins
  rationale: Distingue les ovins des bovins et restitue le possessif que le contexte français exige naturellement.
- source_word: τὸν κλῆρον
  choice: sa part
  rationale: Rend le lot ou la portion attribuée, sans préciser davantage la nature du partage.
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις
  choice: parmi les baguettes striées
  rationale: Conserve l’image des baguettes de Genèse 30; « striées » rend ici plus clairement ποικίλαις que le très général « multicolores ».
theological_decisions:
- issue: Lien entre la naissance de Zabulon et l’accroissement de Jacob
  choice: Maintenir la simple succession formulée par « à ma naissance »
  alternative: Présenter explicitement la naissance comme la cause de la prospérité
  rationale: Le texte associe les événements au moyen d’une indication temporelle, sans énoncer nettement une causalité théologique.
- issue: Référence obscure aux baguettes et à la part du père
  choice: Conserver l’expression dans le texte et signaler son allusion probable en note
  alternative: Expliciter directement l’épisode de Jacob et Laban dans le corps du texte
  rationale: La syntaxe et l’allusion restent difficiles; une explicitation dans le texte résoudrait indûment l’ambiguïté de la source.
translation_notes:
  register: Français international moderne, naturel et digne. La première personne emphatique est rendue par « Moi, Zabulon ». La phrase conserve l’étrangeté de l’allusion finale sans devenir inutilement littérale.
