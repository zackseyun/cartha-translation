  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: fr
  text: Mais je pleurais en secret pendant de nombreux jours à cause de Joseph. En effet, j’avais peur de mes frères, car ils avaient tous convenu que quiconque révélerait le secret serait tué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον
  choice: j’ai pleuré
  rationale: Rend directement l’imparfait grec dans un récit rétrospectif; la durée est déjà exprimée par « pendant de nombreux jours ».
- source_word: ἐν κρυφῇ
  choice: en secret
  rationale: Expression française naturelle qui conserve l’idée d’une action cachée.
- source_word: διὰ τὸν Ἰωσήφ
  choice: à cause de Joseph
  rationale: Préserve la valeur causale de διά avec l’accusatif sans préciser davantage la nature du chagrin.
- source_word: συνέθεντο
  choice: avaient convenu
  rationale: Exprime un accord collectif antérieur à la peur racontée, conformément au contexte et à l’aoriste grec.
- source_word: ὅστις ἐξείπῃ τὸ μυστήριον
  choice: quiconque révélerait le secret
  rationale: « Quiconque » restitue la portée indéfinie de ὅστις; « révéler » rend naturellement l’idée de divulguer ce qui devait rester caché.
- source_word: ἀναιρεθῆναι
  choice: serait tué
  rationale: Rend directement le passif de ἀναιρέω dans son sens de mise à mort, sans l’atténuer.
