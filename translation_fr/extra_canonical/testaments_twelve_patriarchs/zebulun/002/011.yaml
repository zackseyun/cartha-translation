  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: fr
  text: Je pleurais avec Joseph, et mon cœur grondait, et les jointures de mon corps tremblaient, et je ne pouvais pas rester debout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόμβει
  choice: grondait
  rationale: Le verbe évoque un bruit sourd et intense, comme un grondement ou un bourdonnement. « Grondait » conserve cette image corporelle frappante sans l'aplanir en simple émotion.
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου
  choice: les articulations de mon corps
  rationale: Traduction directe de l'expression grecque, qui désigne les jointures ou articulations du corps.
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: je ne pouvais pas tenir debout
  rationale: Le grec exprime l'incapacité à rester ou à se mettre debout. Dans ce contexte de tremblement physique, « tenir debout » est naturel et précis.
