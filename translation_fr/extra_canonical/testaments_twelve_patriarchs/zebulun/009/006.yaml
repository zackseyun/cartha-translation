base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/006.yaml
  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: fr
  text: Et vos ennemis vous emmèneront en captivité, et vous serez maltraités parmi les nations, accablés de nombreuses faiblesses et détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν
  choice: emmèneront en captivité
  rationale: Rend naturellement en français l’idée d’être capturé puis déporté comme prisonnier.
- source_word: κακωθήσεσθε
  choice: serez maltraités
  rationale: Conserve le sens passif large de subir du mal, sans préciser indûment la nature des sévices.
- source_word: ἐν ἔθνεσιν
  choice: parmi les nations
  rationale: Traduction directe qui situe les destinataires au milieu de peuples étrangers.
- source_word: ἀσθενείαις
  choice: faiblesses
  rationale: Préserve la portée générale du terme grec, qui peut évoquer faiblesse, infirmité ou maladie.
- source_word: θλίψεσιν
  choice: détresses
  rationale: Exprime les épreuves et afflictions pressantes sans réduire le terme à la seule persécution.
theological_decisions:
- issue: Nature des « faiblesses » annoncées
  choice: Maintenir le terme général « faiblesses »
  alternative: « maladies » ou « infirmités »
  rationale: Le grec ἀσθένεια peut désigner diverses formes de faiblesse ou de maladie; le contexte ne justifie pas de trancher.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme prophétique du grec tout en évitant une syntaxe trop lourde.
