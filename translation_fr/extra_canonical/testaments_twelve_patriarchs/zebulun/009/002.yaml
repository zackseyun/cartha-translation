source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἐὰν⁸ δὲ εἰς πολλὰ διαιρεθῶσιν⁹, ἡ γῆ ἀφανίζει¹⁰ αὐτά, *καὶ γίνονται¹¹ εὐκαταφρόνητα¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: fr
  text: Mais s’ils sont divisés en de nombreuses parties, la terre les fait disparaître, et ils deviennent faciles à mépriser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: s’ils sont divisés en de nombreuses parties
  rationale: Rend littéralement l’idée d’une division en une pluralité d’éléments sans préciser, comme « cours d’eau », ce que le grec laisse implicite.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Correspond directement au grec et conserve la portée possible de « terre » ou « sol » dans le contexte.
- source_word: ἀφανίζει
  choice: les fait disparaître
  rationale: Exprime le sens de supprimer, anéantir ou faire disparaître, sans introduire l’image absente du grec d’un sol qui les engloutit.
- source_word: εὐκαταφρόνητα
  choice: méprisables
  rationale: Adjectif naturel en français pour ce qui peut aisément être tenu en peu d’estime; la nuance de facilité est portée par le composé grec, mais « faciles à mépriser » serait moins idiomatique ici.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe parallèle du grec est conservée, ainsi que l’indétermination du référent pluriel. Aucun marqueur de note n’est requis.
