- from: Car j’ai appris dans les écrits de mes pères que vous serez divisés en Israël, que vous vous attacherez à deux royaumes et que vous commettrez toutes sortes d’abominations.
  to: Car j’ai appris dans les écrits de mes pères que vous serez divisés en Israël, que vous suivrez deux royaumes et que vous commettrez toutes les abominations.
