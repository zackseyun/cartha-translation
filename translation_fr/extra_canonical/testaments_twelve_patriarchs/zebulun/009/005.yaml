base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: fr
  text: Car j’ai appris dans les écrits de mes pères que vous serez divisés en Israël, que vous suivrez deux royaumes et que vous commettrez toutes les abominations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: j’ai appris
  rationale: Dans ce contexte, le verbe exprime une connaissance acquise par la lecture des écrits ancestraux.
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: dans les écrits de mes pères
  rationale: Le singulier collectif γραφῇ peut désigner un corpus écrit; le pluriel français est naturel et correspond bien au sens contextuel.
- source_word: ἐξακολουθήσετε
  choice: vous vous attacherez à
  rationale: Rend l’idée de suivre durablement ou d’adhérer à ces royaumes, sans suggérer simplement un déplacement derrière eux.
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: vous commettrez toutes sortes d’abominations
  rationale: Formulation française idiomatique qui conserve la portée distributive de πᾶν et la gravité morale de βδέλυγμα.
theological_decisions:
- issue: Nature de la division annoncée
  choice: vous serez divisés en Israël
  alternative: vous serez dispersés en Israël
  rationale: Le grec διαιρεθήσεσθε indique d’abord une division ou un partage; « divisés » préserve cette formulation sans préciser indûment s’il s’agit d’une dispersion géographique ou d’une rupture politique.
- issue: Rapport aux deux royaumes
  choice: vous vous attacherez à deux royaumes
  alternative: vous suivrez deux royaumes
  rationale: La traduction retenue exprime l’allégeance probable tout en évitant d’identifier explicitement les royaumes ou de développer une interprétation historique absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée par « que » rend naturellement la série prophétique. Aucun marqueur de note n’est requis, puisqu’aucune note n’est fournie.
