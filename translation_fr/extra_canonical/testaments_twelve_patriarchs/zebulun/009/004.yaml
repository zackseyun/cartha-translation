base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: fr
  text: Ne vous divisez donc pas en deux têtes, car tout ce que le Seigneur a créé possède une seule tête, deux épaules, deux mains, deux pieds et tous les autres membres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: vous divisez… en deux têtes
  rationale: Rend directement l’image grecque inhabituelle sans l’interpréter comme une soumission à deux chefs.
- source_word: ἐποίησεν
  choice: a créé
  rationale: Dans ce contexte où le Seigneur façonne les êtres et leurs membres, « créer » exprime naturellement l’acte de faire.
- source_word: κέκτηται
  choice: possède
  rationale: Conserve le sens d’avoir ou de posséder, plutôt que de réduire la proposition à une simple identification.
- source_word: μέλη
  choice: membres
  rationale: Terme anatomique naturel qui préserve aussi la portée métaphorique possible du grec.
theological_decisions:
- issue: Portée de l’image des « deux têtes »
  choice: Conserver littéralement « en deux têtes »
  alternative: « sous deux chefs » ou « en deux camps »
  rationale: Le grec présente une image corporelle développée par l’énumération des membres; expliciter « chefs » ou « camps » résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’étrangeté intentionnelle de l’image corporelle tout en restant syntaxiquement naturelle.
