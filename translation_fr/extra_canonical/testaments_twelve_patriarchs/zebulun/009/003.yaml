lexical_decisions:
- source_word: Καὶ ὑμεῖς
  choice: Et vous aussi
  rationale: Rend directement la coordination Καί et l’insistance portée par ὑμεῖς, avec une formulation française naturelle.
- source_word: ἐὰν διαιρεθῆτε
  choice: si vous vous divisez
  rationale: La tournure pronominale exprime naturellement en français la division interne d’un groupe; le présent après « si » convient à la condition éventuelle grecque.
- source_word: ἔσεσθε οὕτως
  choice: vous serez ainsi
  rationale: ἔσεσθε est le futur de « être », non de « devenir »; « ainsi » conserve la référence contextuelle de οὕτως sans l’expliciter.
