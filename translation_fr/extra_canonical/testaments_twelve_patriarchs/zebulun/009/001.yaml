  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/001.yaml
  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: fr
  text: Prêtez donc attention aux eaux et comprenez que, lorsqu’elles convergent vers un même endroit, elles entraînent vers le bas des pierres, du bois, de la terre et diverses autres choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: Observez
  rationale: L’impératif appelle ici à porter une attention réfléchie aux eaux prises comme exemple; « observez » est naturel et précis en français.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: elles convergent vers un même endroit
  rationale: Dans le contexte des eaux, cette formulation rend le mouvement vers un point commun sans imposer l’idée plus particulière de cours d’eau distincts qui « se rejoignent ».
- source_word: κατασύρουσιν
  choice: elles entraînent
  rationale: Le verbe exprime l’action d’emporter ou de charrier dans le mouvement descendant; « entraînent » convient à tous les éléments énumérés et reste fluide.
- source_word: ἕτερά τινα
  choice: diverses autres choses
  rationale: Cette expression conserve à la fois l’indétermination de τινα et l’idée d’éléments supplémentaires variés.
theological_decisions: []
translation_notes:
  register: Français moderne international, clair et digne. La phrase conserve la structure d’exhortation suivie de l’observation tirée du comportement des eaux, sans expliciter au-delà du grec.
