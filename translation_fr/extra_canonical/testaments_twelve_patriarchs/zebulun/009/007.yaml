revisions:
- from: Après cela, lorsque vous vous souviendrez du Seigneur, vous reviendrez à lui, et il aura compassion de vous, car il est miséricordieux et plein de tendresse. Il ne tient pas compte du mal chez les êtres humains, parce qu’ils sont chair et s’égarent dans leurs mauvaises actions.
  to: Après cela, lorsque vous vous souviendrez du Seigneur, vous reviendrez, et il aura compassion de vous, car il est miséricordieux et plein de tendresse. Il n’impute pas le mal aux êtres humains, parce qu’ils sont chair et s’égarent dans leurs mauvaises actions.
  rationale: La révision retire l’explicitation non formulée du complément de « revenir » et remplace une formulation qui localisait le mal « chez » les humains par « n’impute pas le mal aux êtres humains », qui rend le datif grec et λογίζομαι sans ajouter d’interprétation doctrinale. Le reste du texte est conservé.
