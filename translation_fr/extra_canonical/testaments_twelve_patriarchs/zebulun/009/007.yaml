  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: fr
  text: Après cela, lorsque vous vous souviendrez du Seigneur, vous reviendrez, et il aura compassion de vous, car il est miséricordieux et plein de tendresse. Il n’impute pas le mal aux êtres humains, parce qu’ils sont chair et s’égarent dans leurs mauvaises actions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: lorsque vous vous souviendrez du Seigneur
  rationale: Rend le participe aoriste dans son rapport temporel au futur principal, tout en conservant le sens direct de « se souvenir ».
- source_word: ἐπιστρέψετε
  choice: vous reviendrez à lui
  rationale: Le verbe peut signifier « revenir » ou « se tourner de nouveau »; « à lui » explicite en français la direction naturellement suggérée par la mention du Seigneur, sans employer le terme théologiquement plus marqué « se convertir ».
- source_word: ἐλεήσει / ἐλεήμων
  choice: aura compassion / miséricordieux
  rationale: La variation française évite une répétition lourde tout en conservant le champ lexical de la miséricorde.
- source_word: εὔσπλαγχνος
  choice: plein de tendresse
  rationale: Expression française naturelle qui rend la compassion profonde et viscérale du terme grec.
- source_word: οὐ λογίζεται κακίαν
  choice: ne tient pas compte du mal
  rationale: Rend λογίζομαι comme une opération d’imputation ou de mise en compte sans imposer un vocabulaire doctrinal technique.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: chez les êtres humains
  rationale: Formulation inclusive et idiomatique pour l’expression sémitisante « les fils des hommes »; le datif peut marquer les personnes concernées sans exiger « contre ».
- source_word: σάρξ εἰσιν
  choice: ils sont chair
  rationale: Conserve l’anthropologie concise et la tension de l’expression grecque, plutôt que de la paraphraser par « faibles » ou « mortels ».
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: s’égarent dans leurs mauvaises actions
  rationale: Suit l’image d’errance et conserve la relation volontairement large entre l’égarement et les actes mauvais.
theological_decisions:
- issue: Portée du retour
  choice: « vous reviendrez à lui »
  alternative: « vous vous convertirez » ou « vous reviendrez »
  rationale: La traduction garde l’idée de retour vers le Seigneur sans charger ἐπιστρέφω d’une terminologie confessionnelle précise ni laisser la direction trop implicite en français.
- issue: Non-imputation du mal
  choice: « ne tient pas compte du mal chez les êtres humains »
  alternative: « n’impute pas le mal aux êtres humains » ou « ne leur reproche pas leur méchanceté »
  rationale: Cette formulation préserve l’idée de mise en compte tout en évitant de transformer la phrase en énoncé systématique sur la justification ou en simple absence de reproche.
- issue: Motif lié à la chair
  choice: « parce qu’ils sont chair »
  alternative: « parce qu’ils sont faibles »
  rationale: Le texte donne explicitement la condition charnelle comme motif; la traduction ne résout pas cette notion en une interprétation morale ou ontologique unique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement allégée en deux phrases, sans perdre les rapports logiques. Aucun marqueur de note n’est requis, puisqu’aucune note n’est fournie.
