  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: fr
  text: Et après cela, le Seigneur lui-même se lèvera pour vous, lumière de justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: Rend naturellement l’expression temporelle grecque sans alourdir le français par « après ces choses ».
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Conserve l’image de surgissement ou de lever, souvent associée à un astre ou à une lumière, tout en restant naturelle en français.
- source_word: ὑμῖν
  choice: pour vous
  rationale: Reproduit la valeur bénéficiaire probable du datif et suit la lecture du texte établi, où le mot est toutefois signalé comme incertain.
- source_word: φῶς δικαιοσύνης
  choice: lumière de justice
  rationale: Préserve la construction nominale et sa portée théologique sans préciser indûment s’il s’agit d’une lumière caractérisée par la justice ou qui la produit.
theological_decisions:
- issue: Identification du Seigneur à la « lumière de justice »
  choice: 'Apposition directe : « le Seigneur lui-même… lumière de justice »'
  alternative: « le Seigneur lui-même se lèvera pour vous comme une lumière de justice »
  rationale: Le grec juxtapose « lumière de justice » sans marque explicite de comparaison; l’apposition conserve cette force et l’ambiguïté syntaxique.
translation_notes:
  register: Français moderne, sobre et dignifié. La formulation garde l’imagerie du lever de la lumière ainsi que l’apposition théologiquement dense du grec.
