base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: fr
  text: '1 Fils de Zabulon, prêtez attention aux paroles de votre père.


    2 Moi, Zabulon, j’ai été un bon don pour mes parents. En effet, à ma naissance, mon père prospéra beaucoup, ainsi que les brebis et le gros bétail, lorsqu’ils avaient leur part parmi les baguettes bigarrées[a].


    3 Je n’ai pas conscience d’avoir péché au cours de ma vie, si ce n’est en intention[b].


    4 Je ne me souviens pas d’avoir commis quelque transgression, hormis l’ignorance que j’ai eue au sujet de Joseph : je m’étais engagé envers mes frères à ne pas dire à mon père ce qui s’était passé.


    5 Pourtant, j’ai pleuré en secret pendant de nombreux jours à cause de Joseph. Je craignais mes frères, car ils avaient tous convenu que quiconque révélerait le secret serait mis à mort.


    6 Cependant, lorsqu’ils voulurent le tuer, je les suppliai avec larmes de ne pas commettre ce péché.


    7 En effet, Siméon, Dan et Gad s’avancèrent contre Joseph pour le tuer, et celui-ci leur dit avec larmes :


    8 « Ayez pitié de moi, mes frères ! Prenez en compassion les entrailles de Jacob, notre père[d]. Ne portez pas vos mains pour verser un sang innocent, car je n’ai pas péché contre vous.


    9 Même si j’ai péché, corrigez-moi, mes frères ; mais ne vous rendez pas coupables du meurtre de votre frère, par égard pour Jacob, votre père. »


    10 Tandis qu’il prononçait ces paroles en se lamentant, ne pouvant supporter ses cris, je me mis à pleurer ; mon foie se répandit[c], et toute la substance de mes entrailles défaillit.


    11 Je pleurais avec Joseph ; mon cœur grondait, les articulations de mon corps tremblaient, et je ne pouvais pas rester debout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les baguettes bigarrées renvoient au procédé employé par Jacob pour ses troupeaux en Genèse 30.
    reason: cross_reference
  - marker: b
    text: L’expression grecque traduite par « si ce n’est en intention » est difficile ; elle peut désigner une pensée ou une disposition intérieure plutôt qu’un acte extérieur.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « prenez en compassion les entrailles de Jacob, notre père ». Dans l’Antiquité, les entrailles pouvaient représenter le siège de la profonde compassion.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « mon foie se répandit ». Cette image corporelle très vive exprime un chagrin extrême.'
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: prêtez attention
  rationale: Rend directement l’impératif exhortatif dans un français actuel et soutenu, sans archaïsme.
- source_word: δόσις ἀγαθή
  choice: un bon don
  rationale: Conserve l’image concrète du don et la manière singulière dont Zabulon décrit ce qu’il a représenté pour ses parents.
- source_word: ηὐξήνθη
  choice: connut une très grande prospérité
  rationale: Dans le contexte des troupeaux et des biens de Jacob, le verbe exprime naturellement l’accroissement de sa prospérité.
- source_word: ποικίλαις ῥάβδοις
  choice: baguettes bigarrées
  rationale: Préserve l’allusion précise au récit des troupeaux de Jacob ainsi que l’idée d’une apparence variée.
- source_word: παρεκτὸς ἐννοίας
  choice: si ce n’est en intention
  rationale: La formule grecque est difficile ; cette traduction en conserve la concision et la tension entre acte extérieur et disposition intérieure.
- source_word: παρανομίαν
  choice: transgression
  rationale: Maintient la portée morale et juridique du terme sans recourir au calque moins naturel « illégalité ».
- source_word: ἄγνοιαν
  choice: faute par ignorance
  rationale: Conserve l’ignorance revendiquée par Zabulon tout en indiquant clairement qu’il la reconnaît comme une faute.
- source_word: ἐβεβαίωσα
  choice: je m’étais engagé envers mes frères
  rationale: Exprime l’adhésion ferme de Zabulon au pacte de silence, plutôt qu’une simple confirmation verbale.
- source_word: μυστήριον
  choice: le secret
  rationale: Désigne ici l’affaire dissimulée concernant Joseph, sans la connotation doctrinale que pourrait prendre « mystère ».
- source_word: ἀναιρεθῆναι
  choice: serait mis à mort
  rationale: Rend explicitement le passif dans le contexte d’une menace de mort.
- source_word: προσεκάλουν
  choice: je les suppliai
  rationale: Communique l’intensité de l’appel accompagné de larmes.
- source_word: σπλάγχνα
  choice: entrailles
  rationale: Préserve l’ancrage corporel antique de la compassion au lieu de le remplacer par une abstraction émotionnelle.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: mon foie se répandit
  rationale: Maintient l’image corporelle saisissante et inhabituelle du grec, éclairée par une note.
- source_word: ἐβόμβει ἡ καρδία μου
  choice: mon cœur grondait
  rationale: Conserve la force sonore du verbe, qui suggère un bruit sourd ou un frémissement intense.
theological_decisions:
- issue: L’affirmation d’innocence de Zabulon malgré sa faute concernant Joseph
  choice: Maintenir la progression selon laquelle il n’a pas conscience d’avoir péché, sauf en intention, puis reconnaît une faute par ignorance au sujet de Joseph.
  alternative: Uniformiser le passage en une simple déclaration d’innocence assortie d’une seule exception, ou écarter la formule difficile sur l’intention.
  rationale: Le grec présente une autoévaluation moralement complexe. La traduction laisse subsister cette tension au lieu de la résoudre artificiellement.
- issue: Le langage corporel de la compassion et du chagrin
  choice: Conserver les termes concrets « entrailles », « mon foie se répandit » et les réactions physiques du corps.
  alternative: Remplacer ces images par des expressions abstraites telles que « soyez profondément compatissants » ou « j’eus le cœur brisé ».
  rationale: Ces images appartiennent à la rhétorique affective du texte et à son anthropologie corporelle ; les notes permettent de les comprendre sans les effacer.
- issue: Le sang innocent revendiqué par Joseph
  choice: 'Traduire directement la déclaration de Joseph : « je n’ai pas péché contre vous ».'
  alternative: Atténuer cette parole en disant seulement qu’il ne mérite pas la mort.
  rationale: La déclaration d’innocence fait partie de la supplication telle qu’elle est transmise et doit demeurer distincte de l’hypothèse concessive du verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe testamentaire et les répétitions significatives sont conservées, tandis que les tournures sont rendues idiomatiques. Les images corporelles inhabituelles restent dans le texte et sont expliquées en notes. La numérotation suit la couche de consultation anglaise en onze unités de lecture.
