  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005.yaml
  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a servant’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: fr
  text: 'Ils la donnèrent à Jacob en disant : « Reconnais donc si c’est la tunique de ton fils[a]. » Et ils firent ainsi. En effet, ils avaient ôté sa tunique à Joseph au moment de le vendre et l’avaient revêtu d’un vêtement d’esclave. Siméon prit la tunique et ne voulut pas la donner, car il voulait tailler Joseph en pièces avec son épée, furieux de ne pas l’avoir tué. Mais nous nous levâmes tous et lui dîmes : « Si tu ne donnes pas la tunique, nous dirons à notre père que toi seul as commis ce mal en Israël. » Alors il la leur donna. Et ils firent comme Dan l’avait dit.



    5 Et maintenant, mes enfants, je vous ordonne de garder les commandements du Seigneur, de faire preuve de miséricorde envers votre prochain et d’avoir de la compassion pour tous, non seulement pour les êtres humains, mais aussi pour les animaux privés de raison. C’est pour cela que le Seigneur m’a béni : alors que tous mes frères étaient malades, je suis resté sans maladie. Car le Seigneur connaît l’intention de chacun.



    Ayez donc de la miséricorde au fond du cœur[b], car tout ce qu’une personne fait à son prochain, le Seigneur agira de même envers elle. En effet, les fils de mes frères tombaient malades et mouraient à cause de Joseph[c], parce qu’ils n’avaient pas fait preuve de miséricorde au fond du cœur. Mais mes fils furent préservés de la maladie, comme vous le savez.



    Lorsque j’étais au pays de Canaan, sur le littoral, je pêchais[d] pour Jacob, mon père ; et alors que beaucoup étouffaient dans la mer, je demeurais indemne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se traduire : « Reconnais donc si c’est le vêtement de ton fils. » Le terme χιτών désigne plus précisément une « tunique ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayez de la miséricorde dans vos entrailles ». Dans l’usage grec, les entrailles représentent le siège de la compassion et des sentiments profonds.'
    reason: cultural_note
  - marker: c
    text: 'Ou, d’après le contexte : « à cause de ce qui avait été fait à Joseph ». Le grec dit simplement « à cause de Joseph ».'
    reason: textual_ambiguity
  - marker: d
    text: 'Littéralement : « je chassais une proie ». La situation sur le littoral et la mention de la mer suggèrent qu’il s’agit de pêche ou de capture d’animaux marins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιτών
  choice: tunique
  rationale: « Tunique » désigne précisément le vêtement de base évoqué ici et convient au récit de Joseph sans recourir au terme plus vague « manteau ».
- source_word: ἱμάτιον δουλικόν
  choice: vêtement d’esclave
  rationale: δουλικός indique explicitement ce qui appartient à la condition servile ; « esclave » conserve cette réalité sociale.
- source_word: κατακόψαι
  choice: tailler Joseph en pièces
  rationale: Le verbe est fortement violent et, avec l’épée, peut exprimer l’idée de mettre en pièces. Le nom « Joseph » explicite seulement le référent du pronom grec ambigu dans une longue suite de pronoms.
- source_word: τηρεῖν τὰς ἐντολὰς Κυρίου
  choice: garder les commandements du Seigneur
  rationale: Le grec transmis porte explicitement l’ordre de garder les commandements du Seigneur ; cette proposition doit être conservée indépendamment de la couche anglaise qui l’omet.
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: faire preuve de bonté envers votre prochain
  rationale: ἔλεος peut désigner miséricorde, bonté ou compassion. « Faire preuve de bonté » est naturel en français et permet de distinguer cette expression de εὐσπλαγχνία.
- source_word: εὐσπλαγχνίαν
  choice: compassion
  rationale: Le terme désigne une pitié profonde et bienveillante ; « compassion » en rend clairement la portée éthique.
- source_word: ἀλόγοις ζώοις
  choice: animaux privés de raison
  rationale: Cette formulation préserve le contraste grec entre les humains et les êtres vivants non doués de raison, sans l’aplatir en simple « animaux ».
- source_word: προαίρεσιν
  choice: intention
  rationale: Le mot désigne ici la disposition délibérée ou l’orientation morale intérieure de chacun.
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: bonté au fond du cœur
  rationale: σπλάγχνα nomme littéralement les entrailles comme siège des sentiments. L’expression française transmet l’intériorité affective sans produire une formulation anatomique artificielle.
- source_word: ἐθήρευον θήραν
  choice: je pêchais
  rationale: L’expression signifie littéralement « je chassais une proie », mais le littoral et la mention immédiate de la mer rendent probable une activité de pêche ; une note conserve la formulation plus littérale.
- source_word: ἀβλαβὴς διέμενον
  choice: je demeurais indemne
  rationale: La traduction garde à la fois l’idée de continuité exprimée par διέμενον et l’absence de dommage exprimée par ἀβλαβής.
theological_decisions:
- issue: Principe de réciprocité morale en 5.3
  choice: « ce que quelqu’un fait à son prochain, le Seigneur le lui fera de même »
  alternative: « le Seigneur agira envers lui de la même manière »
  rationale: La formulation conserve la symétrie directe et austère du grec sans l’atténuer ni expliquer son mécanisme théologique.
- issue: Portée de la compassion envers les animaux
  choice: Maintenir explicitement « non seulement pour les êtres humains, mais aussi pour les animaux privés de raison »
  alternative: Généraliser par « envers toute créature »
  rationale: Le grec étend expressément le devoir de compassion au-delà des humains ; cette particularité éthique doit rester visible.
- issue: Cause des maladies « à cause de Joseph »
  choice: Conserver la formule ambiguë dans le texte et l’expliquer en note
  alternative: « à cause de ce que leurs pères avaient fait à Joseph »
  rationale: διὰ Ἰωσήφ ne précise pas grammaticalement le rapport causal. Le contexte suggère le traitement infligé à Joseph, mais le texte principal ne doit pas résoudre silencieusement l’ambiguïté.
translation_notes:
  register: 'Français international moderne, digne et narratif. Le passé simple soutient le récit testamentaire sans archaïsmes excessifs ; le discours d’exhortation reste direct et accessible. La traduction rétablit deux éléments explicites du grec absents de la couche anglaise fournie : l’obéissance aux commandements du Seigneur et l’affirmation selon laquelle les frères agirent comme Dan l’avait dit.'
