base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/005.yaml
  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: fr
  text: 'Je ne me rappelle pas avoir commis d’iniquité[a], sauf la faute involontaire commise dans l’affaire de Joseph : à savoir d’avoir donné à mes frères ma parole de ne pas révéler à mon père ce qui s’était passé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune injustice » ou « aucune transgression ».'
    reason: Le terme anglais audité « lawlessness » peut désigner plus largement l’iniquité, l’injustice ou la transgression. Le grec propre au verset n’est pas aligné dans le fragment source fourni.
lexical_decisions:
- source_word: lawlessness (grec du verset non aligné ; probablement ἀνομία)
  choice: acte contraire à la Loi
  rationale: Cette formulation conserve l’idée de transgression normative ou religieuse sans la réduire au seul désordre moral.
- source_word: unwitting wrong
  choice: tort involontaire
  rationale: Rend clairement l’absence d’intention tout en maintenant que l’acte constituait réellement un tort.
- source_word: pledge
  choice: donné ma parole
  rationale: Expression française naturelle et digne qui traduit un engagement personnel solennel sans introduire la notion plus technique de serment.
- source_word: concerning Joseph
  choice: dans l’affaire de Joseph
  rationale: Conserve la portée relationnelle assez large de la formule plutôt que de préciser abusivement que le tort aurait été directement fait à Joseph.
theological_decisions:
- issue: Portée de « lawlessness »
  choice: acte contraire à la Loi
  alternative: injustice ; faute
  rationale: Le choix maintient la tension entre transgression de la loi et faute morale, sans importer une définition confessionnelle de la Loi.
- issue: Responsabilité malgré l’absence d’intention
  choice: le tort involontaire que j’ai causé
  alternative: la faute commise sans le savoir
  rationale: La formulation conserve simultanément l’innocence quant à l’intention et la reconnaissance d’un tort réel.
translation_notes:
  register: Français international moderne, naturel et digne. La source grecque fournie est un fragment au niveau du chapitre et ne contient pas le texte grec aligné de ce verset ; le projet s’appuie donc ici sur la couche anglaise auditée, tout en signalant prudemment les principales possibilités lexicales.
