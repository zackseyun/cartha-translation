  to: 'Je ne me rappelle pas avoir commis d’iniquité[a], sauf la faute involontaire commise dans l’affaire de Joseph : à savoir d’avoir donné à mes frères ma parole de ne pas révéler à mon père ce qui s’était passé.'
  rationale: 'Révision limitée de style et de syntaxe : elle améliore l’idiomaticité et rend explicite que la promesse de silence constitue la faute exceptionnelle. Elle ne précise pas davantage la nature du tort « dans l’affaire de Joseph », domaine où l’anglais conserve une formulation large.'
