- source_word: this sin
  choice: ce péché
  rationale: Conserve la qualification morale explicite sans préciser davantage la nature de la faute.
theological_decisions:
- issue: Qualification du meurtre projeté comme péché
  choice: ne pas commettre ce péché
  alternative: ne pas faire cela
  rationale: La mention explicite du péché figure dans la couche anglaise auditée et doit être conservée plutôt qu’atténuée.
translation_notes:
  register: Français international moderne, simple et digne. « Pourtant » maintient le contraste avec le contexte antérieur. En l’absence d’un texte grec de 1:7 aligné dans les données fournies, la traduction reste proche de la couche anglaise auditée sans introduire de précisions absentes.
