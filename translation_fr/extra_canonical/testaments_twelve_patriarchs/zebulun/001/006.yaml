base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/006.yaml
  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: fr
  text: 'Mais, pendant de nombreux jours, je pleurai en secret à cause de Joseph, car j’avais peur de mes frères : ils avaient tous convenu que quiconque révélerait le secret serait mis à mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “wept in secret”'
  choice: je pleurai en secret
  rationale: Formulation française naturelle qui conserve à la fois l’action prolongée dans son cadre temporel et le caractère caché des pleurs.
- source_word: 'English consultation: “because of Joseph”'
  choice: à cause de Joseph
  rationale: Préserve la relation causale sans préciser davantage si les pleurs portent sur son sort, sa perte ou le remords.
- source_word: 'English consultation: “disclosed the secret”'
  choice: révélerait le secret
  rationale: Expression claire et courante qui maintient l’idée d’une information tenue secrète.
- source_word: 'English consultation: “should be put to death”'
  choice: serait mis à mort
  rationale: Rend explicitement la peine convenue, dans un registre digne et non euphémistique.
theological_decisions:
- issue: Nature des pleurs de Zabulon
  choice: Ne pas définir leur motif au-delà de « à cause de Joseph »
  alternative: Interpréter explicitement les pleurs comme du remords ou du deuil
  rationale: Le texte de consultation ne tranche pas entre chagrin, culpabilité et compassion; la traduction conserve cette ouverture.
- issue: Portée de l’accord des frères
  choice: ils avaient tous convenu
  alternative: ils avaient décidé unanimement
  rationale: « Tous » traduit la portée collective sans renforcer le texte par le terme plus technique « unanimement ».
translation_notes:
  register: Français international moderne, narratif et digne. Le grec fourni n’est pas aligné sur le verset 1:6 et ne contient que le début du chapitre; le texte anglais audité sert donc ici de principale attestation verset par verset. Aucun marqueur de note n’est requis.
