source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: Διαθήκη Ζαβουλὼν τοῦ ἕκτου υἱοῦ Ἰακὼβ καὶ Λείας¹. I. *Ἀντίγραφον λόγων² Ζαβουλών, ὧν³ διέθετο τοῖς υἱοῖς⁴ αὐτοῦ, ⁵πρὶν ἢ ἀποθανεῖν αὐτὸν⁵ *ἐν τῷ⁶ ἑκατοστῷ *τετάρτῳ καὶ δεκάτῳ⁷ ἔτει τῆς ζωῆς αὐτοῦ⁸, μετὰ *οὖν δύο ἔτη⁹ *τοῦ θανάτου¹⁰ Ἰωσήφ. 2. Εἶπεν¹¹ αὐτοῖς· Ἀκούσατέ μου¹²,
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/001.yaml
  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: fr
  text: Copie des paroles de Zabulon, qu’il adressa à ses fils avant de mourir, dans la cent quatorzième année de sa vie, deux ans après la mort de Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων Ζαβουλών
  choice: Copie des paroles de Zabulon
  rationale: Rend directement le caractère de transcription ou de reproduction exprimé par ἀντίγραφον, ainsi que λόγων au sens large de propos.
- source_word: ὧν διέθετο τοῖς υἱοῖς αὐτοῦ
  choice: qu’il adressa à ses fils
  rationale: Le verbe διατίθεμαι peut évoquer ici des dispositions solennelles ou testamentaires. « Adressa » reste naturel en français sans imposer le sens juridique plus étroit de « légua ».
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: avant de mourir
  rationale: Formulation française directe et fidèle à la proposition temporelle grecque.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: dans la cent quatorzième année de sa vie
  rationale: Suit le nombre transmis par le grec fourni et conserve la manière antique de compter l’année de vie.
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: deux ans après la mort de Joseph
  rationale: Restitue clairement la relation chronologique, sans traduire le οὖν peu naturel dans ce contexte en français.
theological_decisions:
- issue: Valeur testamentaire de διέθετο
  choice: « qu’il adressa à ses fils »
  alternative: « dont il chargea ses fils » ou « qu’il prescrivit à ses fils »
  rationale: Le contexte est celui d’un testament patriarcal, mais le verbe ne doit pas être surchargé d’un sens doctrinal ou juridique précis. La traduction choisie préserve la solennité tout en restant ouverte.
- issue: Discordance de la révision récente mentionnant Dan et cent vingt ans
  choice: Conserver Zabulon et cent quatorze ans
  alternative: Dan et cent vingt ans
  rationale: Le texte grec fourni pour cette unité lit explicitement Ζαβουλών et ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ. La révision citée semble provenir d’une autre unité textuelle et ne correspond pas à la source présente.
translation_notes:
  register: 'Français international moderne, sobre et digne. La phrase garde la forme d’un incipit documentaire. Aucun titre de chapitre ni début du verset suivant (« Il leur dit : Écoutez-moi ») n’est inclus, puisque la référence demandée est 1:1 et que l’anglais audité délimite ainsi l’unité.'
