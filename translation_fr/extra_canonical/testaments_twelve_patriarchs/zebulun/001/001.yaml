  source_fidelity: 'Le texte rend fidèlement l’incipit grec : Ἀντίγραφον λόγων est bien rendu par « Copie des paroles », Ζαβουλών par « Zabulon », et la relative ὧν διέθετο τοῖς υἱοῖς αὐτοῦ est correctement exprimée par « qu’il adressa à ses fils ». La chronologie — avant sa mort, dans sa cent quatorzième année, deux ans après la mort de Joseph — correspond au grec fourni. La mention récente de Dan et de cent vingt ans est manifestement étrangère à cette unité et ne doit pas influer sur ce texte.'
