base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: fr
  text: 'Moi, Zabulon, je fus un heureux don pour mes parents. En effet, à ma naissance, mon père prospéra considérablement : son petit et son gros bétail se multiplièrent lorsque, grâce aux baguettes tachetées, il obtint sa part.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῶρον ἀγαθόν (formulation reflected in the consultation layer; verse-level Greek not aligned)
  choice: un don précieux
  rationale: Rend naturellement l’idée d’un « bon don » en français et conserve l’allusion probable au nom de Zabulon sans la transformer en explication.
- source_word: ηὐξήθη ... ἔν τε τοῖς προβάτοις καὶ τοῖς βουσίν (formulation reflected in the consultation layer)
  choice: 'prospéra considérablement : son petit et son gros bétail se multiplièrent'
  rationale: Évite l’étrange littéralisme « mon père augmenta » tout en exprimant clairement que sa prospérité se manifesta dans ses troupeaux.
- source_word: ῥάβδοις ταῖς ῥανταῖς (formulation reflected in the consultation layer)
  choice: baguettes tachetées
  rationale: Conserve l’image concrète liée au récit de Genèse 30 sans ajouter d’interprétation sur leur fonction.
- source_word: κλῆρον αὐτοῦ (formulation reflected in the consultation layer)
  choice: sa part
  rationale: « Part » convient ici mieux que « héritage » ou « lot », puisqu’il s’agit de la part de troupeau acquise par Jacob.
