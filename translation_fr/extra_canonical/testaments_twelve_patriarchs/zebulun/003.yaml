  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
translation:
  language: fr
  text: '**Testament de Zabulon 3**


    1. Joseph vit que je pleurais avec lui et que ses frères s’avançaient pour le tuer. Il se réfugia derrière moi et me supplia de lui venir en aide.


    2. Entre-temps, Ruben se leva et dit : « Venez, mes frères, ne le tuons pas ! Jetons-le plutôt dans l’une de ces fosses sèches que nos pères ont creusées sans y trouver d’eau. »


    3. En effet, le Seigneur avait empêché l’eau d’y jaillir afin que Joseph soit préservé.


    4. C’est ce qu’ils firent, jusqu’au moment où ils le vendirent aux Ismaélites.


    5. Quant au prix reçu pour lui, mes enfants, je n’en ai pris aucune part. Mais Siméon, Dan et Gad, ainsi que leurs enfants, prirent l’argent de sa vente et s’achetèrent des sandales, à eux-mêmes, à leurs femmes et à leurs enfants.


    6. Ils disaient : « Nous n’en mangerons pas, car c’est le prix du sang de notre frère. Piétinons-le plutôt, puisqu’il a dit qu’il régnerait sur nous ; nous verrons alors ce que deviendront ses rêves ! »


    7. C’est pourquoi il est écrit dans le livre de la loi de Moïse : « Celui qui ne veut pas donner une descendance à son frère, qu’on lui retire sa sandale et qu’on lui crache au visage. »[a]


    8. Or les frères de Joseph n’ont pas voulu susciter la vie de leur frère[b] ; le Seigneur leur a donc retiré la sandale qu’ils avaient portée contre Joseph, leur frère.


    9. En effet, lorsqu’ils arrivèrent en Égypte, les serviteurs de Joseph leur retirèrent leurs sandales à l’extérieur du portail. Puis ils se prosternèrent devant Joseph comme on se prosterne devant le roi Pharaon.


    10. Et non seulement ils se prosternèrent devant lui, mais, dès qu’ils tombèrent à ses pieds, on leur cracha aussi dessus[c], et les Égyptiens les couvrirent de honte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Allusion à Deutéronome 25.5-10 : l’homme qui refuse d’accomplir son devoir envers son frère est publiquement humilié par le retrait de sa sandale et par un crachat au visage.'
    reason: cross_reference
  - marker: b
    text: 'La formulation grecque est inhabituelle : littéralement, « les frères de Joseph n’ont pas voulu susciter la vie de leur frère ». Elle semble adapter, par analogie morale, le vocabulaire de la loi du lévirat citée au verset précédent, plutôt que reprendre strictement sa formule juridique.'
    reason: lexical_alternative
  - marker: c
    text: Le crachat peut être compris comme un prolongement symbolique de la loi citée plus haut ; toutefois, le récit grec affirme directement que les frères subirent ce geste.
    reason: alternative_reading
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ … κατέφυγον ὄπισθεν μου
  choice: je pleurais avec lui … Il se réfugia derrière moi
  rationale: La construction grecque transmise est grammaticalement irrégulière, notamment par la forme verbale à la première personne, mais la scène indique que Joseph voit Zabulon pleurer avec lui, puis cherche refuge derrière lui. La traduction restitue ce mouvement sans importer les détails absents du passage grec fourni.
- source_word: ξηρῶν λάκκων
  choice: fosses sèches
  rationale: « Fosse » conserve le sens large de λάκκος sans imposer la précision de « citerne » ; la proposition suivante explique qu’on y cherchait de l’eau.
- source_word: ἐκώλυσε … ἀναβλῦσαι ὕδωρ
  choice: avait empêché l’eau d’y jaillir
  rationale: Cette formulation garde le Seigneur comme agent et rend le mouvement vif du verbe ἀναβλύω.
- source_word: περιποίησις
  choice: soit préservé
  rationale: Dans ce contexte, le nom exprime la conservation providentielle de Joseph en vie dans la fosse.
- source_word: τιμή / τίμημα
  choice: prix reçu pour lui / argent de sa vente
  rationale: Le terme désigne ici le produit concret de la vente de Joseph. La légère variation française évite une répétition raide tout en maintenant l’accent moral sur son prix.
- source_word: ὑποδήματα
  choice: sandales
  rationale: Le mot désigne une chaussure et participe au motif juridique tiré de la loi du lévirat ; « sandales » en conserve la couleur biblique.
- source_word: καταπατήσωμεν
  choice: piétinons-le
  rationale: Le verbe exprime un geste volontaire de mépris et prépare le motif des sandales.
- source_word: ἀναστῆσαι σπέρμα
  choice: donner une descendance
  rationale: Cette expression française transmet clairement la formule juridique du lévirat. « Susciter une descendance » serait plus littéral, mais moins immédiatement accessible.
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: susciter la vie de leur frère
  rationale: Le texte grec passe de la « descendance » à la « vie » dans son application morale. La traduction préserve cette formulation inhabituelle au lieu de la normaliser.
- source_word: ὑπέλυσεν
  choice: a retiré
  rationale: Le verbe reprend explicitement le retrait de la sandale mentionné dans la citation légale.
- source_word: παῖδες
  choice: serviteurs
  rationale: Dans la maison de Joseph, le terme désigne naturellement les membres subalternes de son personnel, sans qu’il soit nécessaire de le rendre par « garçons ».
- source_word: ἐνεπτύσθησαν
  choice: on leur cracha dessus
  rationale: Le passif grec affirme directement que les frères subirent ce geste humiliant.
theological_decisions:
- issue: Interprétation providentielle des fosses sans eau
  choice: Le Seigneur a activement empêché l’eau de jaillir afin de préserver Joseph.
  alternative: Présenter la sécheresse des fosses comme une simple coïncidence relue après coup.
  rationale: Le grec nomme explicitement le Seigneur comme sujet de l’action et exprime une finalité concernant Joseph.
- issue: Application morale de la loi du lévirat
  choice: Conserver le passage inhabituel de la « descendance » à la « vie » du frère.
  alternative: Uniformiser les deux versets en parlant partout de descendance.
  rationale: Le texte établit une analogie rhétorique entre le refus du devoir fraternel et l’attentat contre la vie de Joseph. Sa tension lexicale ne doit pas être effacée.
- issue: Crachat subi par les frères en Égypte
  choice: Le présenter comme un événement directement affirmé par le récit.
  alternative: Le réduire à une image purement symbolique inspirée de Deutéronome 25.
  rationale: Le passif grec ἐνεπτύσθησαν énonce le crachat comme une action subie, même si sa fonction littéraire prolonge manifestement la citation légale.
translation_notes:
  register: Français international moderne, narratif et digne. Les répliques restent directes et accessibles, tandis que la citation de la loi garde une solennité mesurée. Les formulations grecques théologiquement ou rhétoriquement tendues sont conservées et, au besoin, expliquées en note.
