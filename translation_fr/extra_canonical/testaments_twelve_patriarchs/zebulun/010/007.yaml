  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: fr
  text: Mais sur les impies, le Seigneur fera venir un feu éternel, et il les détruira pour des générations et des générations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: Rend le terme grec désignant ceux qui vivent sans respect envers Dieu, dans un registre biblique clair et actuel.
- source_word: ἐπάξει
  choice: fera venir
  rationale: Exprime naturellement l’action future de faire survenir ou d’amener le feu sur les impies.
- source_word: πῦρ αἰώνιον
  choice: un feu éternel
  rationale: Traduction directe qui conserve la portée temporelle et théologique de l’expression grecque sans l’atténuer.
- source_word: ἀπολεῖ
  choice: détruira
  rationale: Reproduit la force du verbe grec, qui peut signifier faire périr ou détruire, conformément au contexte judiciaire.
- source_word: ἕως γενεὰς γενεῶν
  choice: pour des générations et des générations
  rationale: Préserve la formulation grecque inhabituelle et sa possible tension avec « éternel », sans la normaliser en une expression doctrinalement plus déterminée.
theological_decisions:
- issue: Rapport entre le « feu éternel » et la durée de la destruction
  choice: Conserver à la fois « éternel » et « pour des générations et des générations »
  alternative: Harmoniser les deux expressions en traduisant « pour toujours »
  rationale: Le grec juxtapose ces deux formulations. La traduction conserve cette tension et évite de trancher implicitement la question de la durée ou de la nature du jugement.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « des générations et des générations » est volontairement conservée afin de refléter la tournure emphatique et singulière du grec.
