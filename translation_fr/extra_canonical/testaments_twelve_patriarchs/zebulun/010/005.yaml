  text: X. Καὶ νῦν τέκνα μου, μὴ λυπεῖσθε *ὅτι ἀποθνῄσκω¹, μηδὲ συμπέσητε² ὅτι ἀπολήγω³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/005.yaml
  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: fr
  text: Et maintenant, mes enfants, ne vous affligez pas de ce que je meurs, et ne vous effondrez pas de ce que j’arrive à ma fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπεῖσθε
  choice: vous affligez
  rationale: Rend naturellement l’idée de tristesse et de chagrin exprimée par le verbe grec, dans un registre digne.
- source_word: συμπέσητε
  choice: vous effondrez
  rationale: Préserve l’image concrète de la chute tout en exprimant en français actuel l’abattement profond visé dans ce contexte.
- source_word: ἀπολήγω
  choice: j’arrive à ma fin
  rationale: Reproduit l’euphémisme grec désignant l’approche de la mort, sans le confondre avec le verbe précédent, « je meurs ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et solennel. Le parallélisme des deux défenses et la distinction entre « je meurs » et « j’arrive à ma fin » sont conservés.
