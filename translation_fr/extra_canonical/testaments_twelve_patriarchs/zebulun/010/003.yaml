source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: fr
  text: Et il amènera toutes les nations à éprouver de la jalousie à son égard[a] ; et vous verrez Dieu sous une forme humaine, lui que le Seigneur choisira pour lui[b] — Jérusalem est son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est ambigu : il peut évoquer la jalousie, la rivalité ou l’émulation suscitée par lui.'
    reason: Signaler l’étendue sémantique de παραζήλωσις et l’ambiguïté du pronom αὐτοῦ.
  - marker: b
    text: 'La syntaxe grecque de cette proposition est difficile ; littéralement : « que le Seigneur choisira pour lui » et le relatif semble reprendre « Dieu ».'
    reason: Préserver une difficulté réelle du texte transmis sans imposer une reconstruction théologique.
  - marker: c
    text: 'Littéralement : « Jérusalem, nom à lui » ; l’identité de celui qui porte ce nom demeure obscure dans cette phrase.'
    reason: Expliquer la tournure sémitisante et l’ambiguïté référentielle de αὐτῷ.
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: amènera
  rationale: Le verbe exprime ici un changement d’orientation ou d’état ; « amènera … à » rend naturellement en français la construction avec εἰς.
- source_word: παραζήλωσιν αὐτοῦ
  choice: éprouver de la jalousie à son égard
  rationale: Cette formulation conserve le sens de jalousie ou d’émulation de παραζήλωσις et laisse à αὐτοῦ sa référence ambiguë, sans l’affaiblir en simple « zèle ».
- source_word: ἐν σχήματι ἀνθρώπου
  choice: sous une forme humaine
  rationale: Rend directement l’apparence ou la forme humaine, dans un français actuel, sans préciser davantage la nature de cette manifestation.
- source_word: ὃν ἂν ἐκλέξηται
  choice: lui que … choisira
  rationale: Le relatif masculin reprend grammaticalement θεόν ; le futur français exprime ici naturellement l’action attendue, tandis que la note signale la difficulté syntaxique.
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  choice: Jérusalem est son nom
  rationale: Reproduit la construction sémitisante de possession au datif tout en gardant l’énoncé frappant et théologiquement tendu du grec.
theological_decisions:
- issue: La vision de Dieu en forme humaine
  choice: « vous verrez Dieu sous une forme humaine »
  alternative: « vous verrez un dieu sous la forme d’un homme »
  rationale: θεόν est naturellement défini dans ce contexte bien qu’il soit sans article ; la traduction conserve l’affirmation du texte sans l’identifier explicitement à une figure doctrinale particulière.
- issue: Référent du relatif ὃν et du pronom αὐτῷ
  choice: Maintenir leur lien grammatical apparent avec « Dieu », tout en signalant l’obscurité
  alternative: 'Introduire un autre personnage : « vous verrez Dieu sous la forme d’un homme que le Seigneur choisira »'
  rationale: Le grec permet formellement de rattacher ὃν à θεόν, mais l’idée que « le Seigneur » choisisse Dieu « pour lui » est difficile. Il vaut mieux préserver cette tension textuelle que la résoudre par une interprétation non exprimée.
- issue: Sens de παραζήλωσις
  choice: jalousie à son égard
  alternative: zèle pour lui / émulation en sa faveur
  rationale: Le terme peut évoquer jalousie, rivalité ou émulation. « Jalousie à son égard » retient le noyau lexical sans transformer le passage en déclaration positive de dévouement.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation maintient l’enchaînement solennel du passage. Les formulations inhabituelles qui subsistent reflètent les ambiguïtés et tensions du grec plutôt que de les harmoniser.
