  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: fr
  text: Car je me relèverai au milieu de vous, comme un chef au milieu des fils de justice, et je me réjouirai au milieu de ma tribu, dont les membres garderont la loi du Seigneur [et les commandements de Zabulon, leur père][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition entre crochets — « et les commandements de Zabulon, leur père » — est signalée comme textuellement incertaine dans l’édition grecque fournie.
    reason: Informer le lecteur du statut éditorial particulier de la clause finale, tout en la conservant dans le texte et en ancrant la note directement à cette clause.
lexical_decisions:
- source_word: Ἀναστήσομαι
  choice: je me relèverai
  rationale: Le futur moyen de ἀνίστημι peut évoquer le fait de se lever ou de ressusciter. « Me relèverai » conserve ici cette amplitude sans imposer explicitement une lecture technique de résurrection.
- source_word: ἡγούμενος
  choice: un chef
  rationale: Le participe substantivé désigne celui qui conduit ou dirige; « chef » est naturel et digne dans ce contexte.
- source_word: υἱῶν δικαιοσύνης
  choice: fils de justice
  rationale: Conservation de l’expression sémitisante et de sa portée identitaire, plutôt que paraphrase en « hommes justes ».
- source_word: φυλάξουσιν
  choice: garderont
  rationale: « Garder » rend le sens d’observer fidèlement une loi ou des commandements et maintient le futur grec.
- source_word: εὐφρανθήσομαι
  choice: je me réjouirai
  rationale: Rend directement l’idée de joie exprimée par le futur passif à valeur intransitive.
theological_decisions:
- issue: Portée de Ἀναστήσομαι
  choice: je me relèverai
  alternative: je ressusciterai
  rationale: Le contexte peut inviter à une lecture de résurrection, mais le verbe garde une ambiguïté lexicale réelle; la traduction choisie ne tranche pas davantage que nécessaire.
- issue: Statut textuel de la proposition finale
  choice: maintien entre crochets
  alternative: intégration sans signalement ou omission
  rationale: La clause « et les commandements de Zabulon, leur père » est transmise comme élément textuellement délimité dans l’édition fournie; les crochets préservent cette donnée sans l’omettre.
- issue: Expression « fils de justice »
  choice: forme littérale conservée
  alternative: les justes
  rationale: La formulation peut désigner un groupe caractérisé par la justice; conserver l’image évite d’en réduire la portée théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition grecque de « au milieu de » est légèrement variée par « parmi » et « au sein de » pour une expression française naturelle, sans modifier les relations spatiales ou communautaires du texte.
