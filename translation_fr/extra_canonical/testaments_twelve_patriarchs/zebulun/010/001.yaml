source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: καὶ ἐπιστρέψετε⁵² *εἰς τὴν γῆν⁵³ ὑμῶν⁵⁴, καὶ ὄψεσθε αὐτὸν⁵⁵ ἐν Ἱερουσαλὴμ ⌈διὰ τὸ ὄνομα αὐτοῦ *τὸ ἅγιον⁵⁶⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: fr
  text: Et vous retournerez dans votre pays, et vous le verrez à Jérusalem à cause de son saint nom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: vous retournerez
  rationale: Le futur exprime ici le retour annoncé; « retourner » est naturel et fidèle au sens directionnel du verbe.
- source_word: εἰς τὴν γῆν ὑμῶν
  choice: dans votre pays
  rationale: Dans ce contexte, γῆ désigne la terre ou le pays auquel les destinataires appartiennent; « pays » donne un français courant sans exclure l'idée de territoire ancestral.
- source_word: ὄψεσθε αὐτόν
  choice: vous le verrez
  rationale: Conserve le pronom masculin du grec sans préciser une identité que le verset ne nomme pas.
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: à cause de son saint nom
  rationale: Rend la valeur causale naturelle de διά avec l'accusatif et conserve la formulation théologique du texte sans l'expliciter.
theological_decisions:
- issue: Référent de αὐτόν (« le »)
  choice: Maintenir le pronom « le »
  alternative: Identifier explicitement le personnage visé
  rationale: Le verset grec ne nomme pas ici le référent; l'expliciter introduirait une interprétation absente de cette unité textuelle.
- issue: Rapport causal exprimé par διά
  choice: « à cause de son saint nom »
  alternative: « par son saint nom » ou « pour son saint nom »
  rationale: Avec l'accusatif, διά indique normalement la cause. La traduction retenue préserve cette relation, même si sa portée exacte demeure ouverte.
translation_notes:
  register: Français moderne, simple et digne. La syntaxe parallèle du grec est conservée, ainsi que l'ambiguïté référentielle du pronom masculin.
