base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/009.yaml
  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: fr
  text: Quant à vous, craignez le Seigneur, notre Dieu, de toute votre force, tous les jours de votre vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « notre Dieu, de toute votre force, tous les jours de votre vie » sont placés entre crochets dans l’édition grecque utilisée, ce qui signale une incertitude textuelle.
    reason: Préserver visiblement l’incertitude attestée par la présentation éditoriale de la source sans supprimer les mots retenus dans le texte principal.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: craignez
  rationale: Dans ce contexte d’exhortation, le présent est rendu naturellement par un impératif français; « craindre » conserve l’idée biblique de révérence et d’obéissance sans la réduire à la simple peur.
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: de toute votre force
  rationale: Rend directement l’idée de totalité et de capacité personnelle, dans un français courant et digne.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: tous les jours de votre vie
  rationale: Expression française naturelle qui préserve pleinement la portée temporelle du grec.
theological_decisions:
- issue: Rapport entre « le Seigneur » et « notre Dieu »
  choice: le Seigneur, notre Dieu
  alternative: le Seigneur notre Dieu
  rationale: L’apposition avec virgules rend clairement κύριον τὸν θεὸν ἡμῶν sans introduire de distinction entre deux référents.
- issue: Valeur de φοβεῖσθε
  choice: 'impératif : « craignez »'
  alternative: 'indicatif : « vous craignez »'
  rationale: La forme grecque peut être morphologiquement impérative ou indicative, mais l’adresse directe et le contexte testamentaire d’exhortation favorisent nettement l’impératif.
translation_notes:
  register: Français international moderne, simple et solennel. « Quant à vous » restitue l’emphase de ὑμεῖς δέ, tandis que la phrase conserve l’ordre général et la tension exhortative du grec.
