  - severity: low
    issue: Nuance de mouvement ascendant de ἀναγαγόντες atténuée
    rationale: « Ils le transportèrent à Hébron » transmet le déplacement, mais non la montée exprimée par le participe grec. « Ils le firent monter à Hébron » est idiomatique et conserve cette nuance.
