source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: fr
  text: Après avoir dit cela, il s’endormit[a], et ses fils le déposèrent dans un cercueil en bois. Plus tard, ils le firent monter à Hébron et l’y ensevelirent auprès de ses pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette édition ajoute, avec un signe de doute textuel, « d’un bon sommeil » (ὕπνῳ καλῷ).
    reason: Signale sans l’intégrer au texte courant l’expression marquée comme textuellement douteuse dans la source fournie.
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Conserve l’euphémisme grec du sommeil pour la mort sans l’expliciter ni en réduire la portée.
- source_word: θήκην ξυλίνην
  choice: un cercueil en bois
  rationale: Dans ce contexte funéraire, « cercueil » rend naturellement θήκη, tandis que « en bois » traduit ξυλίνην.
- source_word: ἀναγαγόντες
  choice: ils le transportèrent à Hébron
  rationale: Rend le déplacement du corps vers Hébron en français naturel; la nuance littérale de montée est liée au trajet et n’a pas besoin d’être forcée dans la formulation.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Préserve l’expression familiale traditionnelle du grec, qui désigne les ancêtres auprès desquels il est enseveli.
theological_decisions:
- issue: Le sommeil comme désignation de la mort
  choice: il s’endormit
  alternative: il mourut
  rationale: La traduction maintient l’image du texte source et son éventuelle portée théologique sans l’interpréter explicitement.
translation_notes:
  register: Français moderne, clair et digne, avec une légère coloration biblique dans « auprès de ses pères ». La syntaxe évite la répétition maladroite de Hébron grâce à « l’y ensevelirent ».
