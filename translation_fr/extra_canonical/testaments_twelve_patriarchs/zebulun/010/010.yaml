  verdict: revise
  source_fidelity: 'Le projet rend fidèlement l’enchaînement principal : parole finale, sommeil euphémistique, dépôt dans un cercueil de bois, transfert ultérieur et ensevelissement à Hébron avec les pères. Toutefois, l’édition grecque fournie place après ἐκοιμήθη une expression marquée d’un poignard critique, ὕπνῳ καλῷ (« d’un bon sommeil »). Elle ne doit pas être introduite sans réserve, mais son omission non signalée efface une difficulté textuelle présente dans la source. « Firent monter » conserve en outre la nuance explicite de ἀναγαγόντες.'
  naturalness: Le français est naturel, moderne et digne. « Il s’endormit » préserve bien l’euphémisme. « L’y ensevelirent » est fluide; la légère révision proposée remplace « transportèrent » par « firent monter », expression naturelle dans ce contexte et plus proche du grec.
  terminology: « Cercueil en bois », « ensevelirent » et « auprès de ses pères » sont appropriés. Aucun terme théologique ne nécessite de normalisation doctrinale.
