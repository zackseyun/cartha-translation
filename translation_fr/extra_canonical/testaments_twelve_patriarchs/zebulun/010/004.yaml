source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 9. Καὶ⁶⁴ πάλιν ⌈ἐν *τῇ πανουργίᾳ⁶⁵ *τῶν ἔργων⁶⁶ ὑμῶν⁶⁷⌉ παροργίσετε⁶⁸ αὐτόν, καὶ ἀπορριφήσεσθε⁶⁹ ⌈ἀπ᾽ αὐτοῦ⌉⁷⁰ ἕως καιροῦ συντελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: fr
  text: Et de nouveau, dans la ruse de vos œuvres, vous provoquerez sa colère, et vous serez rejetés loin de lui jusqu’au temps de l’accomplissement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν
  choice: par la ruse de vos œuvres
  rationale: « Par » rend naturellement en français la valeur circonstancielle ou instrumentale de ἐν, tandis que « ruse » conserve la nuance négative de πανουργία et « œuvres » correspond à ἔργων.
- source_word: παροργίσετε
  choice: vous provoquerez sa colère
  rationale: Le verbe signifie provoquer à la colère ou irriter; cette formulation explicite l’affect impliqué tout en gardant le pronom αὐτόν comme référent non nommé.
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: vous serez rejetés loin de lui
  rationale: Le passif est préservé, et « loin de lui » exprime nettement l’éloignement marqué par ἀπό.
- source_word: ἕως καιροῦ συντελείας
  choice: jusqu’au temps de l’accomplissement
  rationale: Cette traduction conserve l’indétermination et la portée possiblement eschatologique de συντέλεια sans préciser ce qui atteint son terme.
theological_decisions:
- issue: Référent de αὐτόν / αὐτοῦ
  choice: Conserver « sa » et « lui » sans nommer le référent
  alternative: Expliciter « Dieu »
  rationale: Le verset grec emploie seulement un pronom; expliciter Dieu résoudrait une référence que cet extrait laisse implicite.
- issue: Sens de συντέλεια
  choice: « accomplissement »
  alternative: « fin » ou « consommation »
  rationale: « Accomplissement » maintient la tension entre achèvement, terme fixé et possible horizon eschatologique, sans réduire le mot à une simple cessation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec, mais « par la ruse » est plus idiomatique que « dans la ruse » dans ce contexte.
