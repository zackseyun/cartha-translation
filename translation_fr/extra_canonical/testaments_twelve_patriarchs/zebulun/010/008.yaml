  text: 4. *Ἐγὼ δὲ νῦν¹⁵ εἰς τὴν ἀνάπαυσίν μου¹⁶ ἀποτρέχω¹⁷, *ὡς καὶ¹⁸ οἱ πατέρες μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: fr
  text: Mais moi, maintenant, je me hâte vers mon repos, comme mes pères avant moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάπαυσίν
  choice: repos
  rationale: « Repos » conserve l’image grecque de la mort comme entrée dans le repos, sans en préciser davantage la portée théologique.
- source_word: ἀποτρέχω
  choice: je me hâte vers
  rationale: Le verbe exprime ici un mouvement rapide vers un terme; cette tournure naturelle maintient à la fois l’idée de mouvement et celle d’empressement.
- source_word: οἱ πατέρες μου
  choice: mes pères
  rationale: « Mes pères » rend directement l’expression grecque et désigne les ancêtres de Zabulon dans un registre biblique clair.
theological_decisions:
- issue: La nature du « repos »
  choice: Conserver simplement « mon repos »
  alternative: Expliciter par « la mort » ou « le repos éternel »
  rationale: Le grec emploie une image sans définir explicitement l’état visé; l’expliciter résoudrait indûment une ambiguïté théologique réelle.
translation_notes:
  register: Français moderne, digne et accessible. « Comme mes pères avant moi » explicite idiomatiquement la comparaison elliptique du grec sans ajouter de contenu doctrinal.
