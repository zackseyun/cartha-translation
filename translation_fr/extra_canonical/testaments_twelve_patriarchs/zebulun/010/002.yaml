source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: fr
  text: La guérison et la compassion seront dans ses ailes. Lui-même délivrera de Béliar toute captivité des êtres humains, et tout esprit d’égarement sera foulé aux pieds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  choice: la guérison
  rationale: Rend directement le nom grec désignant la guérison, dans une formulation naturelle et digne.
- source_word: εὐσπλαγχνία
  choice: la compassion
  rationale: Exprime la profonde bonté compatissante indiquée par le terme grec.
- source_word: ἐν ταῖς πτέρυξιν αὐτοῦ
  choice: dans ses ailes
  rationale: Conserve l’image métaphorique du grec sans l’expliciter ni l’atténuer.
- source_word: λυτρώσεται
  choice: délivrera
  rationale: Le verbe peut évoquer la libération ou le rachat; «délivrera» convient particulièrement au contexte de captivité sans imposer une transaction.
- source_word: πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: tous les captifs parmi les êtres humains
  rationale: Le grec littéral «toute captivité des fils des hommes» est difficile en français; cette formulation comprend le collectif abstrait comme désignant les personnes tenues captives, tout en gardant la portée universelle.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, sans interprétation ajoutée.
- source_word: πνεῦμα πλάνης
  choice: esprit d’égarement
  rationale: πλάνη peut désigner l’erreur, l’illusion ou l’égarement; ce choix préserve sa portée morale et cognitive sans la réduire à une tromperie intentionnelle.
- source_word: πατηθήσεται
  choice: sera foulé aux pieds
  rationale: Reproduit l’image forte du passif grec et son idée de défaite complète.
theological_decisions:
- issue: Sens rédempteur de λυτρώσεται
  choice: délivrera
  alternative: rachètera
  rationale: «Délivrera» maintient l’idée de libération présente dans le champ lexical du verbe et s’accorde avec la captivité mentionnée, sans préciser un mécanisme de rachat absent du verset.
- issue: Référent de «ses ailes»
  choice: maintien du pronom sans identification explicite
  alternative: nommer le personnage auquel renvoie le contexte
  rationale: Le fragment grec emploie simplement αὐτοῦ; la traduction conserve cette référence contextuelle et n’importe aucune identification théologique.
- issue: Nature de «tout esprit d’égarement»
  choice: conserver «esprit» au sens ouvert
  alternative: traduire par «toute influence trompeuse»
  rationale: Le grec πνεῦμα peut ici être compris personnellement ou comme une puissance/disposition; le maintien de «esprit» préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux phrases suit le texte fourni. «Les êtres humains» rend l’expression idiomatique υἱῶν ἀνθρώπων sans exclusivité masculine, tandis que les images des ailes et du piétinement sont conservées.
