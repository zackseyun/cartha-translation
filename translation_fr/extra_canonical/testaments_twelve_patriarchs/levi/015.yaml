base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: fr
  text: 15 Ainsi, le temple[a] que le Seigneur choisira deviendra désert au milieu de votre impureté, et vous serez emmenés en captivité parmi toutes les nations. 2 Vous serez pour elles un objet d’abomination, et vous recevrez de la part du juste jugement[b] de Dieu l’opprobre et une honte éternelle. 3 Tous ceux qui vous haïssent se réjouiront de votre ruine. 4 Et sans Abraham, Isaac et Jacob, nos pères, vous ne recevriez aucune miséricorde ; pas un seul de vos descendants[c] ne resterait sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaire » ; le grec ναός désigne précisément le temple saint.
    reason: Alternative lexicale et précision du terme grec.
  - marker: b
    text: On pourrait aussi traduire « jugement conforme à la justice ».
    reason: Le mot grec δικαιοκρισία souligne que le jugement est caractérisé par la justice.
  - marker: c
    text: Littéralement « semence », terme qui évoque ici la lignée et la descendance.
    reason: Signalement de l’image grecque et de sa portée généalogique.
lexical_decisions:
- source_word: ναός
  choice: temple
  rationale: Dans ce contexte juif, le terme désigne le temple saint choisi par Dieu. « Temple » est naturel en français et conserve la référence au sanctuaire de Jérusalem.
- source_word: ἔρημος ἔσται
  choice: deviendra désert
  rationale: Cette formulation conserve l’idée d’abandon et de désolation tout en restant claire en français moderne.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: au milieu de votre impureté
  rationale: « Au milieu de » rend la préposition ἐν sans imposer un lien causal absent de la formulation grecque; « impureté » convient aux dimensions cultuelle et morale du contexte.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: vous serez emmenés en captivité
  rationale: La tournure exprime naturellement en français la captivité et l’exil subis.
- source_word: βδέλυγμα
  choice: objet d’abomination
  rationale: Cette expression conserve la forte idée de répulsion tout en produisant une phrase française idiomatique avec le complément « pour elles ».
- source_word: ὄνειδος
  choice: opprobre
  rationale: « Opprobre » maintient le registre solennel et la notion de déshonneur public.
- source_word: αἰσχύνην αἰώνιον
  choice: une honte éternelle
  rationale: La traduction rend directement la durée exprimée par αἰώνιον sans préciser davantage sa portée doctrinale.
- source_word: δικαιοκρισίας
  choice: juste jugement
  rationale: Le composé désigne un jugement caractérisé par la justice. « Juste jugement » est concis et naturel.
- source_word: ἀπωλείᾳ
  choice: ruine
  rationale: Dans ce contexte de chute collective, « ruine » exprime fortement le désastre sans suggérer nécessairement une catégorie eschatologique systématisée.
- source_word: ἔλεος λήψεσθε
  choice: vous receviez miséricorde
  rationale: La restructuration conditionnelle française conserve la miséricorde reçue à cause des patriarches et rend clairement le lien avec la survie du reste.
- source_word: σπέρματος
  choice: descendants
  rationale: Le sens contextuel est celui de la lignée issue des destinataires. « Descendants » est naturel, tandis qu’une note signale l’image littérale de la semence.
- source_word: οὐ μὴ καταλειφθῇ
  choice: aucun … ne serait laissé
  rationale: « Aucun » rend la négation grecque emphatique et la totalité de la menace.
theological_decisions:
- issue: Les patriarches comme motif de la miséricorde
  choice: La miséricorde qui empêche l’anéantissement total est explicitement liée à Abraham, Isaac et Jacob.
  alternative: Présenter les patriarches seulement comme des exemples de fidélité ou atténuer leur rôle dans l’octroi de la miséricorde.
  rationale: Le grec rattache directement la miséricorde aux patriarches. La traduction conserve cette logique d’alliance sans définir plus précisément son mécanisme théologique.
- issue: Portée de « honte éternelle »
  choice: Conserver l’expression temporelle forte sans la réduire à une disgrâce purement historique ni l’identifier explicitement à une doctrine eschatologique ultérieure.
  alternative: Traduire par une honte temporaire, ou développer le texte en condamnation eschatologique pleinement définie.
  rationale: αἰώνιον exprime une durée grave et durable, mais le passage ne systématise pas davantage la nature de ce jugement.
- issue: Rapport entre l’impureté et la désolation du temple
  choice: Rendre ἐν par « au milieu de » afin de conserver la relation formulée dans le grec.
  alternative: Traduire causalement par « à cause de votre impureté ».
  rationale: Une lecture causale est possible dans le contexte, mais elle explicite davantage que la préposition grecque; la formulation retenue préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité prophétique solennelle. Les termes « opprobre », « miséricorde » et « abomination » conservent la force religieuse du passage sans archaïsme syntaxique excessif.
