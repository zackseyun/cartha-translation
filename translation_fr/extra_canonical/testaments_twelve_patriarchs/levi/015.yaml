revisions:
- from: 15 Ainsi, le temple[a] que le Seigneur choisira deviendra désert au milieu de votre impureté, et vous serez emmenés en captivité parmi toutes les nations. 2 Vous serez pour elles un objet d’abomination, et le juste jugement[b] de Dieu vous vaudra l’opprobre et une honte éternelle. 3 Tous ceux qui vous haïssent se réjouiront de votre ruine. 4 Et si, à cause d’Abraham, d’Isaac et de Jacob, nos pères, vous ne receviez pas miséricorde, aucun de vos descendants[c] ne serait laissé sur la terre.
  to: 15 Ainsi, le temple[a] que le Seigneur choisira deviendra désert au milieu de votre impureté, et vous serez emmenés en captivité parmi toutes les nations. 2 Vous serez pour elles un objet d’abomination, et vous recevrez de la part du juste jugement[b] de Dieu l’opprobre et une honte éternelle. 3 Tous ceux qui vous haïssent se réjouiront de votre ruine. 4 Et sans Abraham, Isaac et Jacob, nos pères, vous ne recevriez aucune miséricorde ; pas un seul de vos descendants[c] ne resterait sur la terre.
  rationale: 'La révision corrige la logique conditionnelle de 15:4 sans interpréter davantage le rôle des patriarches : leur absence implique l’absence de miséricorde et l’anéantissement complet de la descendance. Elle rétablit aussi en 15:2 la construction proche du grec, où les destinataires reçoivent opprobre et honte de la part du juste jugement de Dieu. Les notes conservent leurs ancres a, b et c et leurs fonctions lexicales.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:12:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les éléments principaux du grec : le temple choisi par le Seigneur, la désolation en lien avec l’impureté, la captivité parmi les nations, l’opprobre et la honte durable issus du jugement divin, la joie des ennemis devant la ruine, ainsi que la préservation conditionnée par Abraham, Isaac et Jacob. Toutefois, la syntaxe française de 15:4 inverse involontairement la condition : « si ... vous ne receviez pas miséricorde » fait dépendre la privation de miséricorde de l’intervention des patriarches, alors que εἰ μὴ δι᾽ ... signifie que, sans eux, les destinataires ne recevraient pas miséricorde.'
  naturalness: Le registre est généralement naturel, soutenu et approprié à une proclamation de jugement. « Au milieu de votre impureté » préserve de façon défendable l’ouverture de ἐν, sans imposer la causalité. La correction de 15:4 rend la période conditionnelle immédiatement intelligible en français moderne.
  terminology: « Temple », « impureté », « captivité », « abomination », « opprobre », « honte éternelle », « juste jugement », « ruine » et « miséricorde » conviennent au contexte et au registre. La note sur « semence » justifie adéquatement le choix plus naturel de « descendants ».
  issues:
  - severity: high
    issue: La condition de 15:4 est formulée à l’envers en français.
    rationale: '« Et si, à cause d’Abraham, d’Isaac et de Jacob, nos pères, vous ne receviez pas miséricorde » suggère que les patriarches sont la condition de l’absence de miséricorde. Le grec εἰ μὴ δι᾽ Ἀβραὰμ ... ἔλεος λήψεσθε signifie au contraire : sans l’intervention ou le motif que constituent les patriarches, aucune miséricorde ne serait accordée.'
  - severity: medium
    issue: L’agent du jugement en 15:2 est légèrement moins direct dans la formulation actuelle.
    rationale: '« Le juste jugement de Dieu vous vaudra » est possible, mais le grec place les destinataires comme sujets de « vous recevrez » et présente le jugement comme la source : παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ. « Vous recevrez de la part du juste jugement de Dieu » conserve plus directement cette relation.'
