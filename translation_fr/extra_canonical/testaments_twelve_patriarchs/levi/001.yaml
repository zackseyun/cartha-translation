source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: Διαθήκη Λευὶ τοῦ τρίτου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. ᾿Αντίγραφον λόγων² Λευί³, ὅσα διέθετο⁴ τοῖς υἱοῖς αὐτοῦ⁵ κατὰ πάντα ἃ⁶ ποιήσουσιν⁷, καὶ ὅσα συναντήσει αὐτοῖς *ἕως ἡμέρας κρίσεως⁸. 2. Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
  language: Greek
  source_pages:
  - 92
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: fr
  text: 'Copie des paroles de Lévi, qu’il prescrivit à ses fils au sujet de tout ce qu’ils feraient et de tout ce qui leur arriverait[a] jusqu’au jour du jugement.


    Il était en effet en bonne santé lorsqu’il les appela auprès de lui ; mais il lui fut révélé qu’il allait mourir. Lorsqu’ils se furent réunis, il leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout ce qui viendrait à leur rencontre ». L’expression grecque évoque littéralement ce qui les « rencontrerait » dans l’avenir.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Copie des paroles
  rationale: « Copie » conserve la présentation documentaire du passage, tandis que « paroles » rend largement λόγων sans limiter le sens à des discours formels.
- source_word: διέθετο
  choice: prescrivit
  rationale: Dans ce contexte testamentaire, le verbe exprime l’idée de disposer, d’établir ou d’ordonner solennellement. « Prescrivit » garde cette force sans employer un archaïsme.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: au sujet de tout ce qu’ils feraient
  rationale: Cette formulation française naturelle conserve l’orientation prospective du grec et son lien avec les instructions testamentaires.
- source_word: συναντήσει αὐτοῖς
  choice: leur arriverait
  rationale: Le verbe signifie littéralement ce qui viendra à leur rencontre ; l’expression idiomatique française « leur arriverait » en communique clairement le sens, avec une note qui préserve l’image grecque.
- source_word: ἕως ἡμέρας κρίσεως
  choice: jusqu’au jour du jugement
  rationale: Cette expression formelle et transparente maintient l’horizon eschatologique du texte sans lui ajouter de précision doctrinale.
- source_word: Ὑγιαίνων
  choice: en bonne santé
  rationale: Le participe souligne que Lévi n’était pas visiblement mourant au moment où il convoqua ses fils.
- source_word: ἀπεκαλύφθη
  choice: il lui fut révélé
  rationale: Le passif conserve la tonalité révélatrice du texte tout en laissant implicite l’auteur de la révélation, comme en grec.
- source_word: μέλλει ἀποθνήσκειν
  choice: il allait mourir
  rationale: Cette tournure rend directement l’imminence exprimée par la construction grecque.
- source_word: συνήχθησαν
  choice: ils furent réunis
  rationale: Le passif français respecte la forme grecque et convient au déroulement narratif après la convocation.
theological_decisions:
- issue: Portée eschatologique de ἕως ἡμέρας κρίσεως
  choice: jusqu’au jour du jugement
  alternative: jusqu’au jour où viendra le jugement
  rationale: Le choix retenu suit la construction nominale solennelle du grec et préserve son horizon apocalyptique sans identifier plus précisément la nature ni les modalités du jugement.
- issue: Agent implicite de ἀπεκαλύφθη
  choice: il lui fut révélé
  alternative: Dieu lui révéla
  rationale: Le grec ne nomme pas l’agent. Le passif français conserve cette retenue et évite d’expliciter ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton solennel d’un testament sans archaïsmes inutiles. Les temps du conditionnel rendent naturellement les futurs grecs envisagés depuis le cadre narratif passé.
