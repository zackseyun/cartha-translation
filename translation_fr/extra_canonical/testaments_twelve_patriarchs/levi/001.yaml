  source_fidelity: 'Le sens est globalement fidèle : le cadre documentaire, la portée prospective, la révélation non attribuée explicitement et « jusqu’au jour du jugement » sont bien rendus. « Lorsqu’ils furent réunis » peut toutefois suggérer plus nettement en français qu’un tiers les a réunis, tandis que συνήχθησαν décrit ici leur rassemblement en réponse à l’appel de Lévi.'
  naturalness: Le français est clair, moderne et d’un registre convenant au genre testamentaire. « Lorsqu’ils se furent réunis » est plus idiomatique et plus précis dans ce contexte narratif.
  terminology: « Copie des paroles », « prescrivit », « en bonne santé », « il lui fut révélé » et « jour du jugement » sont des choix recevables. La note conserve utilement l’image du verbe συναντάω sans en faire le sens principal.
