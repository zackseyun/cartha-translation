  naturalness: Le français est soutenu, moderne et généralement très lisible. « Isaac me faisait constamment appeler » est toutefois moins direct et naturel que « Isaac m’appelait constamment » dans ce contexte. La formulation révisée de l’instruction obscure sur les arbres reste volontairement proche du grec, avec une note explicative.
  terminology: Les choix « prêtre », « sacerdoce », « holocaustes », « prémices », « offrandes volontaires », « sacrifices de paix » et « choses saintes » conviennent au registre cultuel. « Les choses saintes » est requis en 9.11 afin de ne pas identifier les réalités sacrées au seul sanctuaire.
