  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: fr
  text: 'Après deux jours, Juda et moi montâmes avec notre père Jacob auprès d’Isaac, notre aïeul. Le père de mon père me bénit selon les visions que j’avais eues, mais il ne voulut pas aller avec nous à Béthel.


    Quand nous arrivâmes à Béthel, mon père Jacob eut à mon sujet une vision : je serais leur prêtre. S’étant levé de bon matin, il remit par mon intermédiaire au Seigneur la dixième part de tout.


    C’est ainsi que nous arrivâmes à Hébron pour y demeurer. Isaac m’appelait constamment afin de me rappeler la loi du Seigneur, comme l’ange me l’avait montrée. Il m’enseignait la loi du sacerdoce, des sacrifices, des holocaustes, des prémices, des offrandes volontaires et des sacrifices de paix[a]. Chaque jour, il continuait à m’instruire et, me consacrant son attention, il me disait :


    « Garde-toi de l’esprit d’inconduite sexuelle : il persiste[b] et va souiller les choses saintes par l’intermédiaire de ta descendance. Prends donc une femme pendant que tu es encore jeune, une femme sans défaut, qui n’ait pas été souillée et qui ne soit pas issue de peuples étrangers.


    « Avant d’entrer dans les choses saintes, lave-toi ; lorsque tu offres un sacrifice, lave-toi ; et quand tu achèves le sacrifice, lave-toi de nouveau.[c]


    « Offre au Seigneur douze arbres portant des feuilles[d], comme Abraham me l’a enseigné. De tout animal pur, ainsi que de tout oiseau, offre un sacrifice au Seigneur. De tous tes premiers produits et de ton vin, offre des prémices en sacrifice au Seigneur Dieu. Sale chacun de tes sacrifices. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « sacrifices de paix » peut aussi désigner plus largement des sacrifices associés au bien-être, au salut ou à la délivrance.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec est difficile à cet endroit. Il semble exprimer l’idée que l’esprit d’inconduite sexuelle demeure continuellement à l’œuvre ou persiste.
    reason: textual_variant
  - marker: c
    text: Dans ce contexte sacrificiel, ces lavages sont vraisemblablement rituels. Le grec ne précise toutefois pas explicitement, à chaque occurrence, quelle partie du corps doit être lavée.
    reason: cultural_note
  - marker: d
    text: La prescription concernant « douze arbres portant des feuilles » est obscure. La traduction suit de près le grec sans tenter de reconstruire le rite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα
  choice: il remit ... la dixième part de tout
  rationale: Exprime clairement l’action de prélever et donner la dîme, tout en conservant δι’ ἐμοῦ par « par mon intermédiaire ».
- source_word: ἱερέα
  choice: prêtre
  rationale: Équivalent français direct et usuel de la fonction cultuelle.
- source_word: νόμον ἱερωσύνης
  choice: la loi du sacerdoce
  rationale: Conserve la construction génitive et le caractère institutionnel de l’enseignement.
- source_word: ὁλοκαυτωμάτων
  choice: holocaustes
  rationale: Terme cultuel français consacré désignant les sacrifices entièrement consumés, sans employer la périphrase lourde « sacrifices entièrement brûlés ».
- source_word: ἀπαρχῶν
  choice: prémices
  rationale: Terme cultuel courant pour l’offrande des premiers produits.
- source_word: ἑκουσίου
  choice: offrandes volontaires
  rationale: Rend explicitement la notion de volontariat portée par l’adjectif grec substantivé.
- source_word: σωτηρίου
  choice: sacrifices de paix
  rationale: Équivalent cultuel traditionnel et intelligible; le champ sémantique plus large est signalé en note.
- source_word: πρόσεχε σεαυτῷ
  choice: Garde-toi
  rationale: Impératif naturel et solennel en français, exprimant la vigilance personnelle.
- source_word: πνεύματος τῆς πορνείας
  choice: l’esprit d’inconduite sexuelle
  rationale: Préserve la personnification spirituelle et rend πορνεία dans un français moderne sans archaïsme.
- source_word: ἐνδελεχῆ ἐστιν
  choice: il persiste
  rationale: Rend prudemment l’idée probable de continuité dans un passage textuellement difficile.
- source_word: μιαίνειν ... τὰ ἅγια
  choice: souiller les choses saintes
  rationale: Conserve le vocabulaire concret d’impureté cultuelle sans préciser indûment s’il s’agit d’objets, de rites ou du domaine sacré.
- source_word: μὴ ἔχουσαν μῶμον
  choice: une femme sans défaut
  rationale: Préserve l’écho du vocabulaire cultuel de l’intégrité tout en restant naturel en français.
- source_word: εἰς τὰ ἅγια
  choice: dans le sanctuaire
  rationale: Dans ce contexte d’entrée et de prescriptions sacerdotales, le pluriel substantivé désigne naturellement le lieu saint; la formulation française évite l’étrange « entrer dans les choses saintes ».
- source_word: ἅλατι ἁλιεῖς
  choice: Sale chacun de tes sacrifices
  rationale: Rend directement l’impératif grec et l’emploi rituel du sel.
theological_decisions:
- issue: La souillure des réalités saintes par la descendance de Lévi
  choice: La mise en garde demeure explicitement liée à la descendance de Lévi et aux choses saintes.
  alternative: Transformer le passage en avertissement moral général sans dimension sacerdotale héréditaire.
  rationale: Le grec relie expressément « ta descendance » aux « choses saintes »; cette tension entre conduite sexuelle et vocation sacerdotale familiale doit être conservée.
- issue: Valeur cultuelle de σωτηρίου
  choice: « sacrifices de paix » dans le texte, avec une note sur l’étendue sémantique.
  alternative: « sacrifices de salut » ou « sacrifices de bien-être »
  rationale: La liste est celle de catégories sacrificielles. « Sacrifices de paix » est reconnaissable, mais ne doit pas masquer les nuances de salut, délivrance ou bien-être.
- issue: Nature du lavage en 9.11
  choice: Répéter simplement « lave-toi » sans ajouter « les mains » ni « en présence du Seigneur ».
  alternative: Préciser chaque fois qu’il s’agit de se laver les mains.
  rationale: Le grec emploie deux verbes de lavage, mais ne nomme pas expressément les mains. La traduction n’impose donc pas une précision absente, tandis que la note indique le contexte rituel probable.
- issue: Référence de αὐτοῖς en 9.3
  choice: « je serais leur prêtre »
  alternative: « je serais prêtre pour eux » ou identifier explicitement le groupe visé.
  rationale: Le référent du pronom reste implicite dans le grec; la traduction conserve cette ambiguïté au lieu de nommer Israël, la famille ou les descendants.
translation_notes:
  register: Français international moderne, digne et lisible, avec un récit au passé simple et un discours direct naturel. Les termes cultuels établis (« sacerdoce », « holocaustes », « prémices ») sont maintenus lorsqu’ils restent largement compréhensibles. Les ajouts de la couche anglaise qui ne sont pas exprimés par le grec, notamment « les mains » et « en présence du Seigneur », ne sont pas intégrés au texte.
