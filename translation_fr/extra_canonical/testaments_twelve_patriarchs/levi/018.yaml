lexical_decisions:
- source_word: ἱερωσύνη
  choice: sacerdoce
  rationale: Terme français naturel et digne qui désigne à la fois la fonction et l’institution sacerdotales, thème central du chapitre.
- source_word: ἱερέα καινόν
  choice: un prêtre nouveau
  rationale: La postposition de « nouveau » souligne ici le renouvellement qualitatif ou eschatologique sans identifier davantage la figure.
- source_word: κρίσιν ἀληθείας
  choice: un jugement conforme à la vérité
  rationale: Cette formulation rend clairement le génitif grec sans transformer l’expression en simple affirmation de véracité.
- source_word: οἰκουμένη
  choice: le monde habité
  rationale: Conserve la nuance géographique de la terre habitée plutôt que celle du cosmos en général.
- source_word: ἁγίασμα
  choice: une consécration
  rationale: Dans ce contexte sacerdotal, le mot paraît désigner une communication sacrée qui consacre la figure, sans préciser un objet absent du grec.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: un esprit d’intelligence et de sanctification
  rationale: Préserve le parallélisme abstrait et le registre prophétique sans imposer une identification trinitaire explicite.
- source_word: διαδοχή
  choice: personne ne lui succédera
  rationale: Rend la non-transmission de l’office en français idiomatique tout en maintenant le caractère unique de ce sacerdoce.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Traduction large qui évite d’importer dans le texte le sens chrétien ultérieur que peut suggérer « les païens ».
- source_word: οἱ ἄνομοι
  choice: ceux qui méprisent la Loi
  rationale: Exprime la relation à la loi contenue dans ἄνομος, plus précisément que le seul terme moral « méchants ».
- source_word: πνεῦμα ἁγιωσύνης
  choice: un esprit de sainteté
  rationale: La minuscule et l’article indéfini préservent l’ambiguïté de la formule grecque au lieu d’en faire d’office un titre trinitaire fixé.
theological_decisions:
- issue: Identité du « prêtre nouveau »
  choice: Maintenir la désignation générique « un prêtre nouveau ».
  alternative: L’identifier explicitement au Messie, au Christ ou à un grand prêtre historique.
  rationale: Le portrait possède des traits cosmiques et salvifiques, mais le grec ne donne pas ici une identification explicite ; la traduction conserve donc cette tension.
- issue: Passages placés entre crochets aux versets 5, 7 et 9
  choice: Les exclure du corps principal et les signaler en notes textuelles.
  alternative: Les intégrer directement au texte.
  rationale: La présentation de la source les marque comme expansions textuellement incertaines ; les notes rendent leur présence transparente sans leur accorder silencieusement le même statut.
- issue: « Esprit de sainteté » au verset 11
  choice: Employer « un esprit de sainteté » sans majuscules titulaires.
  alternative: Traduire « le Saint-Esprit ».
  rationale: La formulation grecque peut recevoir une forte portée théologique, mais elle ne contraint pas à la précision terminologique trinitaire ultérieure.
- issue: Les « fils » ou « enfants » du prêtre aux versets 8 et 12
  choice: Conserver le référent possessif masculin sans l’identifier à un groupe historique ou confessionnel précis.
  alternative: Comprendre explicitement les descendants lévitiques, Israël, les croyants ou les disciples du Messie.
  rationale: Le texte ne résout pas nettement l’identité de ce groupe ; la traduction ne doit pas la fixer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme prophétique et les images répétées de lumière, de sacerdoce et de sainteté sont conservés. Les formulations ne donnent pas à la figure sacerdotale une identité confessionnelle que le grec ne précise pas.
