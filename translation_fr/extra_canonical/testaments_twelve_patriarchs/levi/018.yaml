  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
translation:
  language: fr
  text: 1 Après que la vengeance exercée contre eux sera venue du Seigneur, le sacerdoce prendra fin. 2 Alors le Seigneur suscitera un prêtre nouveau, à qui toutes les paroles du Seigneur seront révélées. Il exercera sur la terre un jugement conforme à la vérité pendant de nombreux jours. 3 Son étoile se lèvera dans le ciel comme celle d’un roi, répandant la lumière de la connaissance comme le soleil en plein jour, et il sera exalté dans le monde habité. 4 Il brillera comme le soleil sur la terre, il dissipera toutes les ténèbres de dessous le ciel, et la paix régnera sur toute la terre. 5 Les cieux exulteront en ses jours, la terre se réjouira et les nuages seront dans l’allégresse[a]. Les anges de la gloire de la présence du Seigneur se réjouiront en lui. 6 Les cieux s’ouvriront et, du temple de la gloire, une consécration viendra sur lui, accompagnée d’une voix paternelle, comme celle d’Abraham s’adressant à Isaac. 7 La gloire du Très-Haut sera proclamée sur lui, et un esprit d’intelligence
    et de sanctification reposera sur lui[b]. 8 Car il donnera pour toujours, en vérité, la majesté du Seigneur à ses fils, et personne ne lui succédera, de génération en génération, pour l’éternité. 9 Sous son sacerdoce, les nations croîtront dans la connaissance sur la terre et seront éclairées par la grâce du Seigneur[c]. Sous son sacerdoce, le péché prendra fin et les hommes sans loi cesseront de faire le mal[d]. 10 Oui, il ouvrira les portes du paradis et écartera l’épée menaçante contre Adam[e]. 11 Il donnera aux saints à manger de l’arbre de la vie, et un esprit de sainteté reposera sur eux. 12 Béliar sera lié par lui, et il donnera à ses enfants le pouvoir de fouler aux pieds les esprits mauvais. 13 Le Seigneur se réjouira au sujet de ses enfants et prendra plaisir en ses bien-aimés pour toujours. 14 Alors Abraham, Isaac et Jacob exulteront ; moi aussi, je me réjouirai, et tous les saints se revêtiront de justice.
  philosophy: optimal-equivalence
