  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013.yaml
  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
translation:
  language: fr
  text: '1. Et maintenant, mes enfants, je vous donne cet ordre : craignez le Seigneur votre Dieu de tout votre cœur et marchez avec simplicité, en suivant toute sa Loi. 2. Vous aussi, apprenez les lettres à vos enfants, afin qu’ils aient de l’intelligence toute leur vie, en lisant sans cesse la Loi de Dieu. 3. Car quiconque parviendra à connaître la Loi du Seigneur sera honoré et ne sera étranger nulle part où il ira. 4. Bien plus, il se fera beaucoup d’amis, plus que de parents[a], et beaucoup de gens désireront le servir et entendre la Loi de sa bouche. 5. Pratiquez donc la justice sur la terre, mes enfants, afin de la retrouver dans les cieux[b]. 6. Semez de bonnes choses dans votre âme, et vous les retrouverez dans votre vie. Mais si vous semez de mauvaises choses, vous récolterez toutes sortes de troubles et de détresses. 7. Acquérez la sagesse dans la crainte de Dieu. Car si vient la captivité, si villes et territoires sont détruits, et si l’or, l’argent et tous les biens disparaissent,
    personne ne peut enlever au sage sa sagesse, sauf l’aveuglement causé par l’impiété et l’endurcissement causé par le péché. 8. En effet, si quelqu’un se garde de ces œuvres mauvaises, alors la sagesse sera pour lui éclatante même parmi ses ennemis ; elle sera pour lui une patrie en terre étrangère, et, au milieu de ses adversaires, il sera trouvé comme un ami[c]. 9. Quiconque enseigne ce qui est bon et le met en pratique partagera le trône des rois, comme l’a fait Joseph, mon frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque, littéralement « beaucoup d’amis plus que des parents », est difficile. Elle peut signifier qu’une personne instruite se fait des amis au-delà de son cercle familial, ou davantage que ne lui en procurerait sa parenté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pratiquez la justice… afin que vous trouviez dans les cieux ». Le complément de « trouviez » reste sous-entendu en grec.'
    reason: alternative_reading
  - marker: c
    text: 'Le grec est très condensé : la sagesse est dite « éclatante parmi les ennemis » et « une patrie » en terre étrangère ; la personne elle-même est ensuite « trouvée [comme] un ami » au milieu de ses adversaires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης
  choice: simplicité
  rationale: Conserve l’idée d’une conduite droite, sans duplicité et sans partage intérieur, sans la réduire à la seule sincérité.
- source_word: γράμματα
  choice: les lettres
  rationale: Le contexte relie l’apprentissage élémentaire de la lecture à la lecture continuelle de la Loi ; la formulation concrète du grec est donc maintenue.
- source_word: σύνεσις
  choice: intelligence
  rationale: Terme français courant qui couvre ici la compréhension intellectuelle et morale acquise par l’instruction.
- source_word: ξένος
  choice: étranger
  rationale: Préserve l’image sociale d’une personne qui, grâce à sa connaissance de la Loi, trouve accueil et considération partout.
- source_word: δουλεῦσαι
  choice: servir
  rationale: Dans ce contexte d’honneur accordé à un maître de la Loi, le verbe indique vraisemblablement un service volontaire plutôt que l’esclavage.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Pratiquer la justice » exprime naturellement en français une conduite droite devant Dieu tout en gardant la portée éthique du terme.
- source_word: ψυχαῖς
  choice: âme
  rationale: Conserve l’image anthropologique grecque et la métaphore de semer dans l’être intérieur ; le singulier distributif est naturel en français.
- source_word: ταραχή
  choice: troubles
  rationale: Rend l’agitation ou le bouleversement, intérieur comme extérieur, et s’associe naturellement à « détresses ».
- source_word: κτήσασθε
  choice: acquérez
  rationale: Maintient l’impératif qui présente la sagesse comme un bien précieux à obtenir.
- source_word: φόβῳ Θεοῦ
  choice: dans la crainte de Dieu
  rationale: Préserve l’expression biblique traditionnelle et sa portée morale et religieuse.
- source_word: πώρωσις
  choice: endurcissement
  rationale: Rend l’insensibilité morale produite par le péché et fait écho au vocabulaire biblique français.
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: brillera pour lui même parmi ses ennemis
  rationale: La syntaxe grecque est condensée ; cette formulation garde l’image d’une sagesse éclatante et reconnue jusque dans un milieu hostile.
- source_word: σύνθρονος ἔσται βασιλέων
  choice: partagera le trône des rois
  rationale: Rend l’idée d’être associé au trône ou intronisé avec des rois, sans multiplier les trônes au-delà du grec.
theological_decisions:
- issue: Rétribution céleste en 13.5
  choice: « afin de la retrouver dans les cieux » renvoie implicitement à la justice pratiquée sur terre.
  alternative: « afin de trouver un trésor dans les cieux » ou « afin d’être trouvés dans les cieux ».
  rationale: L’objet de εὕρητε n’est pas exprimé. Le féminin « la » explicite seulement l’antécédent le plus naturel, la justice, tout en signalant l’ellipse grecque dans la note.
- issue: Exception à l’impossibilité de perdre la sagesse en 13.7
  choice: Seule la corruption morale intérieure — impiété et péché — peut dépouiller le sage de sa sagesse.
  alternative: Comprendre l’aveuglement et l’endurcissement comme des forces extérieures personnifiées, ou comme une glose.
  rationale: La syntaxe présente ces vices comme l’unique exception à la sécurité de la sagesse ; la traduction conserve cette tension sans spéculation supplémentaire.
- issue: Sagesse, patrie et amitié en contexte hostile en 13.8
  choice: Les propositions décrivent les effets de la sagesse pour celui qui se garde du mal.
  alternative: Lire les groupes nominaux comme une série d’identifications très elliptiques de la sagesse elle-même.
  rationale: Le grec est fortement condensé. La traduction française explicite légèrement les relations nécessaires, tandis que la note signale cette compression.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs conservent le ton testamentaire et sapiential. Les expressions bibliques « la Loi », « la crainte de Dieu » et « de sa bouche » sont maintenues, tandis que les ellipses grecques les plus abruptes sont légèrement explicitées et documentées en notes.
