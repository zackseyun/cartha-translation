  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: fr
  text: 'Et leur père leur dit : « Le Seigneur est témoin, ses anges sont témoins, vous êtes témoins, et moi, je suis témoin au sujet de la parole de votre bouche. » Ses fils lui répondirent : « Nous sommes témoins. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: en est témoin / en sont témoins
  rationale: Le français demande naturellement un complément repris par « en »; cette formulation conserve le motif juridique et solennel du témoignage ainsi que la répétition grecque.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: de la parole sortie de votre bouche
  rationale: Cette tournure garde l'image sémitisante de la bouche tout en étant intelligible en français moderne; « parole » reste au singulier comme λόγου.
- source_word: εἶπεν / εἶπον
  choice: dit / répondirent
  rationale: Le second verbe introduit la réplique des fils; « répondirent » rend naturellement la relation discursive sans modifier son contenu.
theological_decisions:
- issue: Portée du témoignage divin, angélique et humain
  choice: Conserver la série répétée de témoins sans expliciter davantage sa fonction
  alternative: Reformuler comme une formule de serment ou d’alliance
  rationale: Le grec présente plusieurs témoins au sujet de la parole prononcée, mais ne définit pas explicitement le cadre théologique ou juridique; la traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « témoin(s) » est volontaire afin de préserver l’insistance rhétorique du grec; « moi aussi » fluidifie la coordination emphatique.
