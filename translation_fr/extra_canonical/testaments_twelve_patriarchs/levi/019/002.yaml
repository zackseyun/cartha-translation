  text: 'Ses fils lui répondirent : « Nous marcherons devant le Seigneur, conformément à sa loi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνώπιον κυρίου
  choice: devant le Seigneur
  rationale: Rend directement l’expression grecque et conserve l’idée d’une conduite vécue en présence du Seigneur.
- source_word: πορευσόμεθα
  choice: nous marcherons
  rationale: Conserve la métaphore biblique de la marche pour désigner la conduite de vie.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: conformément à sa loi
  rationale: Exprime naturellement en français la norme indiquée par κατά, sans alourdir la phrase.
theological_decisions:
- issue: Rapport entre la marche devant le Seigneur et sa loi
  choice: devant le Seigneur, conformément à sa loi
  alternative: devant le Seigneur et selon sa loi
  rationale: Le καί est textuellement incertain et paraît maladroit s’il coordonne directement les deux expressions; la formulation choisie conserve les deux aspects sans imposer une coordination artificielle.
translation_notes:
  register: 'Français moderne, digne et naturel. Le tour introductif grec « répondirent ... disant » est rendu par « répondirent : », formulation idiomatique qui ne retranche aucun contenu propositionnel.'
