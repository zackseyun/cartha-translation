    issue: La coordination française peut effacer le groupement des deux alternatives grecques.
    rationale: Le grec oppose explicitement « la lumière ou les ténèbres », puis « la loi du Seigneur ou les œuvres de Béliar ». Employer quatre occurrences successives de « soit » risque de présenter lumière, ténèbres, loi et œuvres comme quatre choix équivalents. La répétition de « ou bien » rend les deux paires plus nettement tout en ne tranchant pas leur relation précise.
