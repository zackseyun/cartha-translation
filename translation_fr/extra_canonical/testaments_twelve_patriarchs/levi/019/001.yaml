base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: fr
  text: Et maintenant, mes enfants, vous avez tout entendu. Choisissez pour vous-mêmes ou bien la lumière ou bien les ténèbres, ou bien la loi du Seigneur ou bien les œuvres de Béliar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend naturellement l’adresse affectueuse et solennelle du père à ses descendants.
- source_word: πάντα ἠκούσατε
  choice: vous avez tout entendu
  rationale: Traduction directe qui conserve la portée récapitulative de πάντα.
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Choisissez pour vous-mêmes
  rationale: Préserve à la fois l’impératif et l’insistance réflexive du grec.
- source_word: τὸ φῶς / τὸ σκότος
  choice: la lumière / les ténèbres
  rationale: Couple antithétique biblique naturel en français; le pluriel «ténèbres» est l’expression française consacrée pour le singulier collectif grec.
- source_word: νόμον κυρίου
  choice: la loi du Seigneur
  rationale: Correspondance formelle et théologiquement non interprétative; l’absence d’article devant κυρίου se rend naturellement par «du Seigneur».
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: les œuvres de Béliar
  rationale: Conserve le contraste entre la loi du Seigneur et les actions attribuées à Béliar, tout en translittérant le nom propre selon l’usage français.
theological_decisions:
- issue: Structure du choix moral
  choice: Conserver les deux couples introduits par «soit… soit…»
  alternative: Fusionner en une seule opposition explicative, par exemple «la lumière, c’est-à-dire la loi du Seigneur…»
  rationale: Le grec juxtapose deux alternatives sans préciser explicitement si le second couple explique exactement le premier; la traduction préserve cette tension.
- issue: Identité de Βελίαρ
  choice: Béliar
  alternative: Bélial ou «le Malin»
  rationale: La translittération respecte la forme grecque propre à ce texte et évite d’identifier ou d’interpréter davantage la figure.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe parallèle du grec est conservée sans alourdissement; aucune note n’est nécessaire.
