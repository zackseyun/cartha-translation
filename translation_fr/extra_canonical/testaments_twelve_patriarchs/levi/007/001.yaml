  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: fr
  text: 'Je dis à mon père Jacob : « En toi, le Seigneur réduira les Cananéens à néant et il donnera leur pays à toi et à ta descendance après toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σοὶ
  choice: Par toi
  rationale: La préposition ἐν avec le datif peut ici désigner le moyen ou la sphère d’action. « Par toi » donne un français naturel tout en conservant l’idée que l’action du Seigneur s’accomplit en lien avec Jacob.
- source_word: ἐξουδενώσει
  choice: réduira … à néant
  rationale: Ce choix restitue avec force le sens d’anéantir ou de tenir pour rien, sans atténuer le jugement exprimé.
- source_word: τὴν γῆν αὐτῶν
  choice: leur pays
  rationale: Dans ce contexte territorial, « pays » est plus naturel en français que « terre », tout en désignant le territoire des Cananéens.
- source_word: τῷ σπέρματί σου
  choice: à ta descendance
  rationale: « Descendance » rend le nom collectif σπέρμα de façon claire et actuelle, sans imposer ici un référent individuel.
theological_decisions:
- issue: Rôle de Jacob dans l’action annoncée par ἐν σοὶ
  choice: Par toi
  alternative: En toi
  rationale: Le grec permet une nuance instrumentale ou relationnelle. Le texte principal adopte la formulation française la plus intelligible, tandis que la note signale la traduction plus littérale afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français moderne, digne et direct. La phrase conserve la structure prophétique du grec, avec « réduire à néant » pour sa vigueur et « descendance » pour le collectif biblique.
