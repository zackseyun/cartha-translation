  text: And departing, we came to Dinan Bethel.
translation:
  language: fr
  text: Après être partis, nous sommes arrivés à Dinan Béthel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte « Dinan Béthel ». La relation exacte entre ces deux noms de lieu est incertaine; on pourrait aussi comprendre : « à Dinan, à Béthel ».'
    reason: Préserver l’ambiguïté syntaxique et géographique de Δίναν Βεθήλ sans imposer la lecture d’un nom composé.
lexical_decisions:
- source_word: Ἀπάραντες
  choice: Après être partis
  rationale: Le participe de ἀπαίρω signifie ici « partir, se mettre en route ». Cette traduction évite de lui attribuer un complément non exprimé, comme « l’ayant emporté ».
- source_word: ἤλθομεν εἰς
  choice: nous sommes arrivés à
  rationale: Dans un récit de déplacement, cette formulation rend naturellement en français l’idée de venir ou d’aller jusqu’à un lieu.
- source_word: Δίναν Βεθήλ
  choice: Dinan-Béthel
  rationale: Les deux noms transmis à la suite sont conservés. Le trait d’union les présente prudemment comme une désignation géographique composée, sans supprimer « Dinan ».
theological_decisions: []
translation_notes:
  register: Français moderne, simple et narratif. La formulation reste proche du grec tout en étant idiomatique; elle ne reprend pas l’interprétation « après l’avoir emporté », puisque le verbe peut s’employer sans objet au sens de partir.
