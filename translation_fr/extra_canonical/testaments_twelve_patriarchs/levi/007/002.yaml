base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: fr
  text: Car, à partir de ce jour, la ville appelée Sichem sera une ville de gens dépourvus de bon sens, parce que, comme quelqu’un se moque d’un insensé, ainsi nous nous sommes moqués d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  choice: la ville appelée Sichem
  rationale: Rend directement la construction grecque et emploie la forme française biblique courante du toponyme.
- source_word: ἀσυνέτων
  choice: de gens dépourvus de bon sens
  rationale: Exprime l’absence d’intelligence ou de discernement indiquée par le terme, sans la réduire au seul substantif « fous ».
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: on se moque / nous nous sommes moqués
  rationale: Conserve la répétition du même verbe grec et son idée de raillerie.
- source_word: μωρόν
  choice: un insensé
  rationale: Rend le terme désignant une personne folle ou déraisonnable dans un registre digne et intelligible.
theological_decisions:
- issue: Lien logique introduit par ὅτι
  choice: parce que
  alternative: car
  rationale: Conserve la valeur causale explicite du grec sans ajouter d’interprétation théologique.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la comparaison et la répétition rhétorique du grec; « Sichem » suit l’usage biblique français.
