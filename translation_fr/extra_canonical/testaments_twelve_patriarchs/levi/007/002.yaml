revisions:
- from: Car, à partir d’aujourd’hui, la ville appelée Sichem sera une ville de gens dépourvus de bon sens, parce que, comme on se moque d’un insensé, ainsi nous nous sommes moqués d’eux.
  to: Car, à partir de ce jour, la ville appelée Sichem sera une ville de gens dépourvus de bon sens, parce que, comme quelqu’un se moque d’un insensé, ainsi nous nous sommes moqués d’eux.
  rationale: 'La révision est limitée à deux ajustements de fidélité formelle : « ce jour » reflète mieux le repère temporel grec, et « quelqu’un » traduit le τις explicite. La causalité introduite par « parce que », le contraste entre le futur de la comparaison et le passé de l’action rapportée, ainsi que la répétition de « se moquer », sont conservés.'
