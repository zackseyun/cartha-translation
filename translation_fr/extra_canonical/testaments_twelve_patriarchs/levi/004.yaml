base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004.yaml
  text: '1. Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are being split, and the sun is being extinguished, and waters are drying up, and fire is cowering, and all creation is being shaken, and the invisible spirits are melting away, and Hades is being plundered at the suffering of the Most High, men will persist in disobedience and remain in their injustices. Therefore they will be judged with a greater punishment.


    2. Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister of his presence.


    3. You shall shine forth the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.


    4. And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son forever.


    5. And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.


    6. For those who bless him will be blessed, and those who curse him will perish.'
translation:
  language: fr
  text: '**Testament de Lévi 4**


    **1.** Sache donc maintenant que le Seigneur exercera son jugement sur les êtres humains. Car, tandis que les rochers se fendront, que le soleil s’éteindra, que les eaux se dessécheront, que le feu se recroquevillera, que toute la création sera ébranlée, que les esprits invisibles fondront et que le séjour des morts sera pillé lors de la souffrance du Très-Haut[a], les humains persisteront dans leur désobéissance et resteront attachés à leurs injustices. C’est pourquoi ils subiront un châtiment plus sévère.


    **2.** Le Très-Haut a donc entendu ta prière, pour te séparer de l’injustice afin que tu deviennes pour lui un fils, un serviteur et un ministre en sa présence.


    **3.** Tu feras briller en Jacob la lumière de la connaissance, et tu seras comme le soleil pour toute la descendance d’Israël.


    **4.** Une bénédiction te sera accordée, à toi et à toute ta descendance, jusqu’à ce que le Seigneur visite toutes les nations dans la tendre compassion de son Fils[b], pour toujours.


    **5.** C’est pour cette raison que le conseil et l’intelligence t’ont été donnés, afin que tu instruises tes fils à ce sujet.


    **6.** Car ceux qui le bénissent seront bénis, mais ceux qui le maudissent périront.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « lors de la souffrance du Très-Haut » est textuellement incertaine dans la tradition manuscrite.
    reason: Signaler le statut éditorial de [ἐπὶ τῷ πάθει τοῦ ὑψίστου] sans supprimer une lecture théologiquement significative.
  - marker: b
    text: 'Le mot « Fils » est textuellement incertain. Certains témoins ajoutent ici : « Cependant, tes fils mettront la main sur lui pour le mettre en croix. » Le verbe grec peut aussi signifier « l’empaler ».'
    reason: Rendre compte à la fois du mot υἱοῦ placé entre crochets et de la phrase entière également rejetée entre crochets dans l’édition, tout en conservant l’ambiguïté lexicale de ἀνασκολοπίσαι.
  - marker: c
    text: Le texte grec dit simplement « le » ; l’identité précise de la personne bénie ou maudite demeure ambiguë.
    reason: Éviter d’imposer un antécédent christologique, théocentrique ou personnel que le texte ne nomme pas explicitement.
lexical_decisions:
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: les êtres humains
  rationale: L’expression sémitisante signifie ici l’humanité en général; la traduction naturelle évite de la restreindre aux hommes de sexe masculin.
- source_word: τοῦ ᾅδου
  choice: le séjour des morts
  rationale: Rend Hadès comme le domaine des morts sans importer les connotations françaises modernes de « l’enfer » comme lieu du châtiment final.
- source_word: καταπτήσσοντος
  choice: se recroquevillera
  rationale: Le verbe évoque le fait de se tapir ou de se recroqueviller sous l’effet de la peur; cette image inhabituelle est conservée plutôt que normalisée.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: un ministre en sa présence
  rationale: « Ministre » garde l’idée d’un service cultuel ou officiel, tandis que « en sa présence » exprime naturellement le sémitisme « de sa face ».
- source_word: σπέρματι
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » est plus idiomatique que le calque « semence » tout en gardant le sens collectif.
- source_word: ἐπισκέψεται
  choice: visite
  rationale: Le verbe peut désigner une intervention divine favorable ou judiciaire. « Visiter » maintient cette amplitude au lieu de préciser arbitrairement la nature de l’intervention.
- source_word: ἐν σπλάγχνοις
  choice: dans la tendre compassion
  rationale: Littéralement lié aux entrailles comme siège de l’émotion, le syntagme désigne une compassion profonde; la formulation française garde l’intensité affective.
theological_decisions:
- issue: La souffrance attribuée au Très-Haut en 4.1
  choice: Conserver « lors de la souffrance du Très-Haut » avec une note textuelle
  alternative: Omettre l’expression entre crochets ou l’expliquer explicitement comme une référence christologique
  rationale: L’expression figure dans la source transmise mais est textuellement discutée. La traduction préserve sa tension théologique sans identifier le Très-Haut à une personne précise ni effacer la difficulté.
- issue: Le « Fils » en 4.4
  choice: Traduire « son Fils » et signaler l’incertitude textuelle
  alternative: Lire simplement « dans sa tendre compassion » sans « Fils »
  rationale: Le nom est présent dans le texte fourni mais placé entre crochets par l’éditeur. La note permet de conserver à la fois la lecture et son statut incertain.
- issue: Phrase sur les fils de Lévi mettant la main sur lui
  choice: Ne pas l’intégrer au corps du texte, mais la signaler en note
  alternative: Inclure « Cependant, tes fils porteront la main sur lui pour le mettre en croix » comme texte principal
  rationale: Toute la phrase est mise entre crochets dans l’édition source, ce qui indique un statut textuel particulièrement fragile. La note documente la lecture sans lui donner le même poids que le texte retenu.
- issue: Antécédent du pronom αὐτόν en 4.6
  choice: 'Garder le pronom non explicité : « le »'
  alternative: Remplacer par « le Fils », « le Seigneur » ou « toi »
  rationale: Le référent n’est pas explicite dans la forme grecque transmise. Le préciser résoudrait indûment une ambiguïté potentiellement théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe apocalyptique du premier verset est conservée, mais articulée naturellement. Les termes techniques ou sémitisants sont rendus par des équivalents courants sans atténuer les images étranges du grec. Les incertitudes majeures de la tradition textuelle sont indiquées en notes plutôt que résolues silencieusement.
