lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: pendant soixante-dix semaines
  rationale: La formulation temporelle littérale conserve l’écho d’une périodisation apocalyptique sans développer « semaines » en « séries de sept ».
- source_word: πλανηθήσεσθε
  choice: vous vous égarerez
  rationale: Le tour pronominal français exprime la déviation morale tout en évitant de préciser indûment si elle est entièrement volontaire ou provoquée de l’extérieur.
- source_word: ἱερωσύνην βεβηλώσετε
  choice: vous profanerez le sacerdoce
  rationale: « Profaner » maintient le registre cultuel de βεβηλόω, et « sacerdoce » rend précisément ἱερωσύνη.
- source_word: τὰ θυσιαστήρια μιανεῖτε
  choice: vous souillerez les autels
  rationale: « Souiller » exprime clairement la contamination cultuelle, tandis que le pluriel du grec est conservé.
- source_word: τὸν νόμον ἀθετήσετε
  choice: vous rejetterez la Loi
  rationale: Dans ce contexte, ἀθετέω indique la répudiation ou la mise à l’écart ; « rejeter » est naturel et ferme sans introduire de terminologie doctrinale technique.
- source_word: λόγους προφητῶν ἐξουδενώσετε
  choice: vous traiterez avec mépris les paroles des prophètes
  rationale: Cette locution française restitue explicitement la valeur de mépris portée par ἐξουδενόω.
- source_word: ἐν διαστροφῇ κακῇ
  choice: dans une funeste perversion
  rationale: « Perversion » conserve l’idée de distorsion morale ; « funeste » donne à κακή une expression française digne et idiomatique.
- source_word: εὐσεβεῖς
  choice: ceux qui sont attachés à Dieu
  rationale: Cette formulation actuelle communique la piété et le respect religieux sans la coloration parfois affectée de « pieux ».
- source_word: ἀληθινῶν λόγους
  choice: les paroles des hommes véridiques
  rationale: Le grec est comprimé et l’adjectif substantivé peut renvoyer à des personnes vraies ou dignes de foi ; cette traduction conserve cette dimension personnelle.
- source_word: ἄνδρα καινοποιοῦντα νόμον
  choice: un homme qui renouvelle la Loi
  rationale: « Renouvelle » rend l’idée de faire nouveau sans présenter d’emblée cet homme comme un réformateur ni donner au syntagme une interprétation doctrinale.
- source_word: πλάνου προσαγορεύσετε
  choice: vous traiterez d’imposteur
  rationale: Le contexte est celui d’une désignation hostile ; « imposteur » rend naturellement πλάνος, une personne qui égare ou trompe.
- source_word: τὸ ἀνάστημα
  choice: sa stature
  rationale: Le sens littéral est conservé dans le texte, tandis qu’une note signale les sens figurés possibles de valeur ou de majesté.
- source_word: τὰ ἅγια ὑμῶν
  choice: vos lieux saints
  rationale: Le pluriel neutre peut désigner les sanctuaires ou choses saintes ; le contexte de dévastation jusqu’au sol favorise « lieux saints » sans réduire le référent à un seul Temple.
- source_word: ἐπισκέψηται
  choice: revienne vous visiter
  rationale: « Visiter » préserve le langage biblique de l’intervention divine et πάλιν est rendu par « revienne », sans identifier le sujet ambigu.
theological_decisions:
- issue: Statut textuel de la section concernant l’homme qui renouvelle la Loi et sa mise à mort
  choice: Le passage est inclus dans le corps du texte et traduit directement, avec une note sur sa difficulté et son possible caractère secondaire.
  alternative: Omettre la section comme interpolation, ou la reformuler en termes explicitement messianiques.
  rationale: Le témoin grec fourni contient cette section. La conserver respecte la source, tandis que la note informe honnêtement le lecteur des indices de perturbation textuelle sans résoudre la question par suppression ou harmonisation.
- issue: Référent de αὐτός dans la dernière proposition
  choice: « lui-même » est conservé implicitement dans « revienne vous visiter », sans identification dans le texte principal.
  alternative: Identifier explicitement le sujet comme Dieu, ou comme l’homme mentionné au verset 3.
  rationale: La syntaxe grecque n’impose pas un antécédent unique. La note expose les deux possibilités et préserve la tension théologique.
- issue: Portée de « à cause de lui » en 16:4
  choice: Le pronom masculin est maintenu sans expliquer si la dévastation survient en raison de l’homme, de son rejet ou de sa mort.
  alternative: Expliciter « à cause de ce que vous lui aurez fait » ou rattacher directement la causalité à sa mise à mort.
  rationale: Le grec δι᾽ αὐτόν est concis et ambigu quant au mécanisme causal ; l’explicitation ajouterait une interprétation absente de la formulation source.
translation_notes:
  register: Français international contemporain, soutenu mais accessible. Le rythme prophétique et les répétitions accusatrices sont conservés. Les termes cultuels « sacerdoce », « autels », « Loi » et « lieux saints » maintiennent le registre du passage. Les ambiguïtés textuelles et référentielles sont signalées en notes plutôt que résolues dans le corps du texte.
