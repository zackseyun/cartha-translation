base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: fr
  text: '16


    Et maintenant, je sais que, pendant soixante-dix semaines, vous serez égarés. Vous profanerez le sacerdoce et souillerez les autels. Vous rejetterez la Loi et, dans une perversion malfaisante, vous traiterez avec mépris les paroles des prophètes. Vous persécuterez les hommes justes, vous haïrez ceux qui sont attachés à Dieu et vous aurez en horreur les paroles des hommes véridiques.


    Vous traiterez d’imposteur un homme qui renouvelle la Loi[b] par la puissance du Très-Haut. Finalement, vous vous précipiterez pour le tuer, sans connaître sa stature[c], et, dans votre méchanceté, vous ferez retomber son sang innocent sur vos têtes.[a]


    Mais je vous le dis : à cause de lui, vos lieux saints seront dévastés jusqu’au sol. Il ne restera pour vous aucun lieu pur ; parmi les nations, vous deviendrez une malédiction et serez dispersés, jusqu’à ce que lui-même vous visite de nouveau[d], ait compassion de vous et vous accueille.


    [a] Le texte grec de cette phrase est difficile et paraît avoir subi des perturbations. La traduction suit le témoin fourni, mais ce passage pourrait être une addition ou une interpolation postérieure.


    [b] Autre traduction possible : « qui rend la Loi nouvelle ». L’expression pourrait aussi être comprise comme une accusation hostile portée contre un réformateur.


    [c] « Sa stature » traduit le grec littéralement ; l’expression peut désigner sa véritable valeur ou sa majesté.


    [d] Le sujet de « lui-même vous visite de nouveau » peut être Dieu ou, éventuellement, l’homme mentionné plus haut ; le grec ne permet pas de trancher avec certitude.'
