  source_fidelity: 'La traduction rend fidèlement les éléments du grec : « Copie des paroles » correspond à Ἀντίγραφον λόγων ; « qu’il prescrivit à ses fils » exprime de façon recevable la valeur dispositive/solennelle de διέθετο ; les deux champs parallèles de κατὰ πάντα ἃ ποιήσουσιν et καὶ ὅσα συναντήσει αὐτοῖς sont conservés. Le conditionnel français (« feraient », « arriverait ») transpose naturellement les futurs grecs depuis le point de vue du testament attribué à Lévi. « Jusqu’au jour du jugement » rend exactement ἕως ἡμέρας κρίσεως sans ajout doctrinal.'
