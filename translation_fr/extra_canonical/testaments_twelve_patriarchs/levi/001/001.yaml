base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/001.yaml
  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: fr
  text: Copie des paroles de Lévi, qu’il prescrivit à ses fils au sujet de tout ce qu’ils feraient et de tout ce qui leur arriverait[a] jusqu’au jour du jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui les atteindrait ». L’expression grecque évoque littéralement ce qui viendrait « à leur rencontre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Copie des paroles
  rationale: Rend directement l’intitulé grec, ἀντίγραφον désignant une copie ou transcription et λόγων les paroles ou déclarations.
- source_word: διέθετο
  choice: prescrivit
  rationale: Le moyen de διατίθημι peut évoquer le fait de disposer, fixer ou transmettre solennellement des instructions. « Prescrivit » garde ici la valeur d’une disposition adressée aux fils sans imposer le sens plus technique de « léguer ».
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: au sujet de tout ce qu’ils feraient
  rationale: « Au sujet de » exprime naturellement κατὰ dans ce titre; le conditionnel français situe les actes futurs par rapport à la prescription passée.
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: tout ce qui leur arriverait
  rationale: Rend idiomatiquement le grec « tout ce qui les rencontrera », c’est-à-dire ce qui leur adviendra, tout en signalant le sens concret dans la note.
- source_word: ἕως ἡμέρας κρίσεως
  choice: jusqu’au jour du jugement
  rationale: Correspondance formelle et naturelle avec l’expression eschatologique grecque, sans ajouter d’article possessif ni de précision doctrinale.
theological_decisions:
- issue: Portée du « jour du jugement »
  choice: jour du jugement
  alternative: jour du Jugement
  rationale: La minuscule conserve la désignation du texte sans imposer par la typographie une interprétation théologique plus déterminée.
translation_notes:
  register: Français moderne, digne et lisible. La structure d’intitulé est conservée, ainsi que les deux propositions parallèles introduites par « tout ».
