source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: fr
  text: 'Car il était en bonne santé lorsqu’il les appela auprès de lui ; mais il lui fut révélé qu’il allait mourir. Et lorsqu’ils se furent rassemblés, il leur dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: il était en bonne santé
  rationale: Le participe exprime ici l’état physique de Lévi au moment où il les convoqua ; cette formulation française est naturelle et fidèle.
- source_word: ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν
  choice: il les appela auprès de lui
  rationale: Rend explicitement le mouvement vers Lévi exprimé par πρὸς ἑαυτόν, dans un registre narratif digne.
- source_word: ἀπεκαλύφθη δὲ αὐτῷ
  choice: mais il lui fut révélé
  rationale: Conserve la voix passive du grec, qui laisse volontairement inexprimé l’auteur de la révélation.
- source_word: μέλλει ἀποθνήσκειν
  choice: il allait mourir
  rationale: Restitue l’imminence ou la destinée prochaine exprimée par μέλλει avec l’infinitif.
- source_word: συνήχθησαν
  choice: ils se furent rassemblés
  rationale: Le plus-que-parfait marque naturellement en français que le rassemblement précède la prise de parole.
- source_word: εἶπεν πρὸς αὐτούς
  choice: il leur dit
  rationale: Équivalent idiomatique direct en français moderne, sans lourdeur littérale.
theological_decisions:
- issue: Auteur de la révélation
  choice: 'Maintenir le passif impersonnel : « il lui fut révélé »'
  alternative: « Dieu lui révéla »
  rationale: Le texte grec ne nomme pas l’agent ; l’expliciter comme Dieu résoudrait une ambiguïté que la traduction doit préserver.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’enchaînement du grec tout en évitant un calque maladroit. Aucun marqueur de note n’est requis.
