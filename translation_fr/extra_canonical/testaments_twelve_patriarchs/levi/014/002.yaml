    issue: « porteront les mains sur »
    rationale: Cette expression n’est pas idiomatique ici et peut surinterpréter le geste comme un coup ou une violence physique. « mettront les mains sur » rend plus directement le grec ἐπιβάλλω τὰς χεῖρας ἐπί tout en préservant son ambiguïté.
