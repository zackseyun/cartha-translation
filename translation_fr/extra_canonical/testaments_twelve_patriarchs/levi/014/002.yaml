source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ γὰρ ὁ πατὴρ ἡμῶν Ἰσραὴλ καθαρός ἐστιν¹⁸ ἀπὸ τῆς¹⁹ ἀσεβείας²⁰ τῶν ἀρχιερέων [οἵτινες ἐπιβαλοῦσι²¹ τὰς χεῖρας αὐτῶν ἐπὶ τὸν σωτῆρα τοῦ κόσμου]²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: fr
  text: Car notre père Israël est pur de l’impiété des grands prêtres [qui mettront les mains sur le Sauveur du monde].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition entre crochets est ainsi signalée dans l’édition grecque utilisée, ce qui indique que son statut textuel est incertain.
    reason: Expliquer au lecteur la portée éditoriale des crochets sans trancher la question textuelle.
lexical_decisions:
- source_word: καθαρός ἐστιν ἀπό
  choice: est pur de
  rationale: Reproduit directement l’idée d’être exempt ou dégagé de quelque chose, tout en restant naturel en français.
- source_word: ἀσέβεια
  choice: impiété
  rationale: Conserve le sens religieux de conduite irrévérencieuse ou opposée à Dieu, sans le réduire à une simple méchanceté.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Équivalent français courant du titre sacerdotal au pluriel.
- source_word: ἐπιβάλλω τὰς χεῖρας ἐπί
  choice: porter les mains sur
  rationale: Préserve l’expression concrète du grec et son idée hostile de saisie ou d’agression, sans préciser davantage que le texte.
- source_word: σωτὴρ τοῦ κόσμου
  choice: Sauveur du monde
  rationale: Rend fidèlement le titre sotériologique et sa portée universelle; la majuscule signale son emploi titulaire dans ce contexte.
theological_decisions:
- issue: Rapport entre Israël et l’impiété des grands prêtres
  choice: Conserver l’affirmation qu’Israël est « pur de » leur impiété
  alternative: Reformuler comme une absence de responsabilité collective
  rationale: Le grec affirme littéralement la pureté ou l’exemption d’Israël sans expliciter juridiquement la nature de cette distinction; la traduction ne résout donc pas davantage la tension.
- issue: Identification du « Sauveur du monde »
  choice: Conserver le titre sans ajouter de nom
  alternative: Expliciter « Jésus-Christ »
  rationale: Le texte source ne nomme pas la personne; l’identification implicite doit rester implicite.
- issue: Statut textuel de la proposition finale
  choice: Maintenir les crochets dans le texte
  alternative: Intégrer la proposition sans crochets ou l’omettre
  rationale: Les crochets de l’édition signalent une incertitude ou particularité textuelle qu’il convient de rendre visible.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, tandis que le vocabulaire religieux traditionnel demeure accessible. Le connecteur « Car » rend καὶ γάρ naturellement dans la continuité argumentative du passage.
