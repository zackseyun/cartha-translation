base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/003.yaml
  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: fr
  text: Car, de même que le soleil est pur devant le Seigneur sur la terre, de même vous aussi, vous êtes les luminaires d’Israël, au-dessus de toutes les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρὸς
  choice: pur
  rationale: Correspondance directe qui conserve ici la valeur morale ou cultuelle possible du grec sans la préciser davantage.
- source_word: φωστῆρες
  choice: luminaires
  rationale: Le terme désigne des corps ou foyers lumineux; « luminaires » préserve l’image cosmique introduite par le soleil et convient au registre solennel.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: au-dessus de toutes les nations
  rationale: Cette formulation rend la comparaison ou prééminence exprimée par παρά avec l’accusatif, sans transformer explicitement celle-ci en supériorité morale.
theological_decisions:
- issue: Nature de la pureté du soleil et des destinataires
  choice: Conserver simplement « pur »
  alternative: « sans souillure » ou « irréprochable »
  rationale: Le texte n’explicite pas si la pureté est cultuelle, morale ou imagée; la traduction maintient cette ouverture.
- issue: Prééminence d’Israël parmi les nations
  choice: « au-dessus de toutes les nations »
  alternative: « plus que toutes les nations » ou « parmi toutes les nations »
  rationale: Le grec indique vraisemblablement une prééminence comparative. « Parmi » l’atténuerait, tandis que « plus que » laisserait le terme de comparaison trop elliptique en français.
translation_notes:
  register: Français moderne, digne et assez formel. La répétition « de même… de même » reproduit la structure comparative grecque; la reprise « vous aussi, vous êtes » garde l’emphase portée sur les destinataires.
