source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: fr
  text: Moi donc, mes enfants, j’ai su qu’à la fin des âges vous agirez en impies contre le Seigneur, portant la main sur lui[a] avec méchanceté, et que vous deviendrez un objet de moquerie parmi toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « sur lui » sont textuellement incertains dans le grec.
    reason: L’édition source place ἐπ᾿ αὐτόν entre crochets. La note préserve donc l’incertitude textuelle tout en indiquant que, s’il est retenu, le pronom renvoie naturellement au Seigneur.
lexical_decisions:
- source_word: ἔγνων
  choice: j’ai su
  rationale: Le parfait grec est rendu par un passé composé français, qui conserve l’aspect d’une connaissance acquise tout en restant naturel.
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: à la fin des âges
  rationale: Cette formulation garde le pluriel αἰώνων et la portée eschatologique de l’expression.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: vous agirez avec impiété contre le Seigneur
  rationale: « Agir avec impiété » exprime le verbe ἀσεβέω sans réduire son sens à une simple désobéissance; « contre » rend ici la valeur hostile de ἐπί.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: portant les mains sur lui
  rationale: L’expression française évoque une action hostile et demeure proche de l’image grecque des mains mises sur quelqu’un.
- source_word: χλευασμός
  choice: un objet de moquerie
  rationale: Le nom abstrait grec désigne ici ce dont les nations se moquent; cette tournure est plus idiomatique en français que « une moquerie ».
theological_decisions:
- issue: Référent de « sur lui » dans [ἐπ᾿ αὐτόν]
  choice: Conserver « sur lui » dans le texte avec une note signalant l’incertitude textuelle.
  alternative: Omettre « sur lui » et laisser « portant les mains avec méchanceté ».
  rationale: Le pronom est présent entre crochets dans l’édition source, ce qui indique une incertitude; s’il est retenu, son antécédent naturel est « le Seigneur », mais cette lecture ne doit pas être présentée comme textuellement certaine.
translation_notes:
  register: Français moderne, digne et intelligible. La syntaxe prophétique et la tension du passage sont conservées sans explicitation doctrinale.
