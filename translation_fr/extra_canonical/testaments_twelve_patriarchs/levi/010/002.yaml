id: T12P.LEV.10.2
reference: Testament of Levi 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: fr
  text: Et voici, je suis innocent de votre impiété et de la transgression que vous commettrez au terme des âges [contre le Sauveur du monde, le Messie][a], en égarant Israël et en suscitant contre lui[b] de grands malheurs de la part du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « contre le Sauveur du monde, le Messie » sont signalés comme textuellement incertains dans l’édition grecque.
    reason: Informer le lecteur du statut éditorial de la proposition placée entre crochets.
  - marker: b
    text: Le pronom grec traduit par « lui » peut renvoyer soit au Sauveur, le Messie, soit à Israël.
    reason: Préserver l’ambiguïté grammaticale réelle de l’antécédent.
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: je suis innocent
  rationale: Rend directement l’affirmation d’absence de culpabilité ou de responsabilité.
- source_word: ἀσέβεια
  choice: impiété
  rationale: Conserve la portée religieuse et morale du terme grec dans un français actuel et digne.
- source_word: παράβασις
  choice: transgression
  rationale: Préserve l’idée de franchissement d’une limite ou de violation, sans préciser une loi que le grec ne nomme pas.
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: au terme des âges
  rationale: Expression naturelle qui garde la perspective eschatologique de συντέλεια et le pluriel αἰώνων.
- source_word: σωτῆρα τοῦ κόσμου χριστόν
  choice: le Sauveur du monde, le Messie
  rationale: Rend σωτήρ par « Sauveur » et χριστός comme titre messianique plutôt que comme simple nom propre.
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: en égarant Israël
  rationale: Exprime clairement l’action de conduire Israël dans l’erreur.
- source_word: ἐπεγείροντες ... κακὰ μεγάλα
  choice: en suscitant ... de grands malheurs
  rationale: Reproduit l’idée de faire surgir ou de soulever des maux, tout en restant idiomatique en français.
- source_word: παρὰ Κυρίου
  choice: de la part du Seigneur
  rationale: Conserve l’indication de provenance ou d’origine sans expliciter davantage le rapport causal.
theological_decisions:
- issue: Statut de la proposition concernant le Sauveur et le Messie
  choice: Conserver les crochets et ajouter une note de critique textuelle
  alternative: Intégrer la proposition sans crochets comme partie certaine du texte
  rationale: L’édition source signale elle-même cette proposition entre crochets; la traduction ne doit pas masquer cette incertitude.
- issue: Référent de αὐτόν dans ἐπ᾿ αὐτόν
  choice: Employer « lui » et signaler l’ambiguïté
  alternative: Expliciter « le Messie » ou « Israël »
  rationale: Le pronom grec peut être rattaché au Sauveur/Messie mentionné auparavant ou à Israël, plus proche dans la phrase; le texte français préserve cette tension.
- issue: Sens de χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce contexte de titre eschatologique, « le Messie » rend explicitement la valeur de l’oint attendu sans imposer que χριστός soit ici un nom propre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe suit étroitement le mouvement de la phrase grecque, tandis que les participes sont rendus par « en égarant » et « en suscitant » pour une lecture naturelle.
