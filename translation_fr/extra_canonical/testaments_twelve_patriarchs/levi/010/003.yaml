    issue: Ajout de « plus » dans « il ne couvrira plus votre honte »
    rationale: Le grec ὥστε μὴ καλύψαι signifie « de sorte qu’il ne couvrira pas » / « afin de ne pas couvrir » ; il ne comporte aucun équivalent explicite de « plus ». L’ajout suggère une antériorité temporelle qui n’est pas formulée dans la source.
