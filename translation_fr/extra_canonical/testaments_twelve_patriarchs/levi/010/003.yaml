base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: fr
  text: Et vous agirez au mépris de la Loi en Israël, si bien que Jérusalem ne pourra pas supporter votre méchanceté. Mais le voile du Temple se déchirera, de sorte qu’il ne couvrira pas votre honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: vous agirez au mépris de la Loi
  rationale: Le verbe exprime le fait d’agir contre la loi; cette formulation naturelle conserve ici la possible portée religieuse de la Loi sans réduire le sens à une simple conduite désordonnée.
- source_word: βαστάζειν
  choice: supporter
  rationale: Le verbe signifie porter ou supporter. « Supporter votre méchanceté » reproduit directement l’image grecque tout en restant idiomatique en français.
- source_word: πονηρίας
  choice: méchanceté
  rationale: Rend la qualité morale mauvaise visée par le grec, sans l’atténuer en simple faute ou mauvaise conduite.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: le voile du Temple
  rationale: Expression française consacrée et claire pour le rideau ou voile du sanctuaire.
- source_word: σχισθήσεται
  choice: se déchirera
  rationale: Conserve le futur passif de sens; la tournure pronominale française reste naturelle sans préciser l’agent.
- source_word: ἀσχημοσύνην
  choice: honte
  rationale: Dans ce contexte, le terme désigne ce qui est honteux ou indécent; « honte » préserve l’idée d’une réalité coupable que le voile ne pourra plus cacher.
theological_decisions:
- issue: Portée de ἀνομέω
  choice: agir au mépris de la Loi
  alternative: agir de manière impie / commettre l’iniquité
  rationale: La traduction retenue garde le lien lexical avec la loi et évite de définir plus précisément la nature théologique de la transgression.
- issue: Allusion à la déchirure du voile
  choice: énoncé conservé sans explicitation
  alternative: ajouter une référence ou identifier l’événement accompli
  rationale: Le verset annonce la déchirure du voile, mais le texte grec n’explicite ni sa date ni son interprétation théologique; la traduction préserve cette réserve.
- issue: Fonction du voile par rapport à la honte
  choice: de sorte qu’il ne couvrira plus votre honte
  alternative: afin de ne pas couvrir votre honte
  rationale: ὥστε avec l’infinitif exprime ici le résultat. La formulation française rend ce rapport sans suggérer nécessairement une intention divine explicitée par le texte.
translation_notes:
  register: Français moderne, international et digne. « Temple » prend une majuscule pour désigner le sanctuaire de Jérusalem. La structure en deux propositions conserve le mouvement prophétique du grec tout en évitant une phrase française trop chargée.
