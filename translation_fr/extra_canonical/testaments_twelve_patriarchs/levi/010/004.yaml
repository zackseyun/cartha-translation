  text: Καὶ²⁹ διασπαρήσεσθε³⁰ αἰχμάλωτοι³¹ ἐν³² τοῖς ἔθνεσιν, καὶ ἔσεσθε *εἰς ὄνειδος καὶ εἰς κατάραν ἐκεῖ³³.
