  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: fr
  text: Et vous serez dispersés parmi les nations en captifs, et là, vous serez un objet de honte et de malédiction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: vous serez dispersés
  rationale: Rend le futur passif grec et l’idée d’une dispersion forcée.
- source_word: αἰχμάλωτοι
  choice: comme captifs
  rationale: Exprime la condition dans laquelle ils seront dispersés, conformément à l’emploi prédicatif du grec.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: « Parmi » est naturel en français pour une dispersion au sein de peuples étrangers; « nations » conserve la portée collective de ἔθνη.
- source_word: εἰς ὄνειδος
  choice: un objet de honte
  rationale: Formulation idiomatique qui conserve l’idée qu’ils seront exposés au déshonneur et aux reproches.
- source_word: εἰς κατάραν
  choice: de malédiction
  rationale: Conserve le terme fort κατάρα et la coordination étroite avec ὄνειδος.
- source_word: ἐκεῖ
  choice: là
  rationale: Maintient explicitement l’adverbe grec, renvoyant à la présence parmi les nations.
theological_decisions:
- issue: Portée de κατάρα
  choice: malédiction
  alternative: objet d’exécration
  rationale: « Malédiction » est le correspondant direct et théologiquement non réducteur; la traduction ne précise pas s’ils subissent une malédiction ou deviennent une formule de malédiction.
translation_notes:
  register: Français moderne, digne et accessible. La répétition grecque de εἰς est rendue par la construction française naturelle « un objet de honte et de malédiction », sans ajouter d’explication interprétative.
