source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ τανῦν¹ φυλάξατε² *ὅσα ἐγὼ ἐντέλλομαι ὑμῖν, τέκνα, ἐπειδὴ ὅσα ἐγὼ ἤκουσα παρὰ τῶν πατέρων μου Γἀνήγγειλα ὑμῖν³⁾.'
