base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: fr
  text: Et maintenant, mes enfants, observez ce que je vous commande, puisque je vous ai annoncé tout ce que j’ai entendu de mes pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: gardez
  rationale: Conserve le sens d’observer fidèlement ou de mettre en pratique les instructions, tout en restant proche de l’image grecque.
- source_word: τέκνα
  choice: mes enfants
  rationale: Rend l’adresse familiale naturelle en français; le possessif est implicite dans le contexte de l’exhortation paternelle.
- source_word: ἀνήγγειλα
  choice: je vous ai rapporté
  rationale: Exprime la transmission fidèle de ce qui a été entendu, sans donner au verbe un sens technique ou théologique absent du contexte.
- source_word: παρὰ τῶν πατέρων μου
  choice: de mes pères
  rationale: Préserve la formulation généalogique traditionnelle et sa possible portée ancestrale, sans la réduire explicitement à «ancêtres».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de «tout ce que» reflète les deux occurrences de ὅσα dans le grec, et «mes pères» maintient l’ambiguïté entre ascendants directs et ancêtres.
