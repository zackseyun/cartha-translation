  source_fidelity: 'Le sens général est fidèle : l’exhortation présente (φυλάξατε), le contenu transmis et l’origine paternelle de l’enseignement sont tous conservés. Toutefois, « garder tout ce que je vous commande » est moins idiomatique en français pour l’observation de prescriptions et risque de suggérer la conservation matérielle. « Rapporter » est possible, mais ἀνήγγειλα exprime plus directement l’annonce ou la déclaration faite aux destinataires.'
  naturalness: « Observez ce que je vous commande » est plus naturel et précis dans un contexte d’instructions. L’adresse « mes enfants » est recevable en français et convient au cadre filial, bien que le grec porte simplement le vocatif « enfants ».
  terminology: « Observez » rend adéquatement φυλάξατε dans son sens d’obéir à des instructions. « Annoncé » rend ἀνήγγειλα sans lui attribuer de sens théologique technique. « Mes pères » préserve l’ambiguïté du grec entre pères immédiats et ascendants.
