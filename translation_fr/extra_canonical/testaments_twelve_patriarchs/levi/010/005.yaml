  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: fr
  text: Car la maison que le Seigneur choisira sera appelée Jérusalem, comme le contient le livre du juste Hénoch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: maison
  rationale: Rend directement le terme grec tout en conservant son ambiguïté possible entre édifice, sanctuaire et maisonnée.
- source_word: ἐκλέξεται
  choice: choisira
  rationale: Le futur simple correspond au futur moyen grec dans ce contexte.
- source_word: κληθήσεται
  choice: sera appelée
  rationale: Reproduit naturellement en français le passif futur grec.
- source_word: περιέχει
  choice: atteste
  rationale: Dans la formule de renvoi à un livre, « atteste » exprime naturellement que cet écrit contient ou rapporte cette affirmation, sans suggérer une citation littérale.
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: Hénoch le juste
  rationale: Conserve l’apposition honorifique du grec dans une formulation française usuelle.
theological_decisions:
- issue: Identification de la « maison »
  choice: Conserver « maison » sans explicitation
  alternative: Traduire ou préciser « temple » / « sanctuaire »
  rationale: Le grec dit οἶκος; expliciter « temple » résoudrait une ambiguïté que le texte source laisse ouverte.
- issue: Phrase « et pour une malédiction » signalée dans la révision anglaise
  choice: Ne pas l’ajouter
  alternative: Ajouter « et pour une malédiction »
  rationale: La phrase καὶ εἰς κατάραν n’apparaît pas dans le texte grec source fourni. La traduction suit prioritairement cette attestation originale plutôt qu’une révision anglaise discordante.
translation_notes:
  register: Français moderne, digne et accessible. Syntaxe proche du grec sans raideur; aucun marqueur de note n’est nécessaire.
