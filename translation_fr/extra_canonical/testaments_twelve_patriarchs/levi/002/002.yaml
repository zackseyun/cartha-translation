  source_fidelity: 'Le sens essentiel est bien rendu : Lévi situe son âge à environ vingt ans et associe Siméon à une vengeance liée à Dina et dirigée contre Hamor. Toutefois, « en nous en prenant à Hamor » est plus vague et plus idiomatiquement interprétatif que le grec ἀπὸ Ἐμμώρ, qui maintient explicitement Hamor dans la relation de vengeance.'
