  text: Ἤμην⁹ δὲ¹⁰ νεώτερος¹¹, ὡς¹² ἐτῶν εἴκοσι, *καὶ τότε¹³ ἐποίησα¹⁴ *τὴν ἐκδίκησιν μετὰ Συμεὼν¹⁵ *τῆς ἀδελφῆς ἡμῶν Δείνας¹⁶ *ἀπὸ Ἐμμώρ¹⁷.
