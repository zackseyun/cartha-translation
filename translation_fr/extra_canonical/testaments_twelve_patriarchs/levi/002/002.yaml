  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/002.yaml
  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: fr
  text: J’étais encore jeune, âgé d’environ vingt ans, et c’est alors qu’avec Siméon j’ai vengé notre sœur Dina contre Hamor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai exercé la vengeance avec Siméon pour notre sœur Dina contre Hamor ». La construction grecque avec « de/à partir de Hamor » est inhabituelle ; elle peut présenter Hamor comme celui contre qui la vengeance est exercée.'
    reason: Signale la construction inhabituelle de ἀπὸ Ἐμμώρ sans imposer une interprétation plus précise.
lexical_decisions:
- source_word: νεώτερος
  choice: encore jeune
  rationale: Rend naturellement l’idée comparative ou relative de jeunesse dans ce récit autobiographique.
- source_word: ὡς ἐτῶν εἴκοσι
  choice: âgé d’environ vingt ans
  rationale: ὡς indique ici une estimation de l’âge.
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: j’ai vengé
  rationale: Expression française directe qui conserve l’idée d’un acte de vengeance sans l’alourdir par un calque.
- source_word: μετὰ Συμεών
  choice: avec Siméon
  rationale: Conserve simplement l’association de Lévi et Siméon dans l’action.
- source_word: ἀπὸ Ἐμμώρ
  choice: en nous en prenant à Hamor
  rationale: La préposition ἀπό est inhabituelle avec ἐκδίκησις; ce rendu exprime Hamor comme cible de la vengeance sans imposer un sens trop précis.
theological_decisions:
- issue: Évaluation morale de la vengeance
  choice: Employer le terme descriptif « vengé » sans approbation ni condamnation ajoutée
  alternative: « fait justice » ou « exercé le châtiment »
  rationale: Le grec nomme une vengeance ou rétribution, mais le verset n’en donne pas ici une évaluation théologique explicite.
translation_notes:
  register: Français moderne, narratif et digne. « Dina » et « Hamor » suivent les formes bibliques françaises courantes; la formulation évite un calque maladroit tout en maintenant l’ambiguïté du grec.
