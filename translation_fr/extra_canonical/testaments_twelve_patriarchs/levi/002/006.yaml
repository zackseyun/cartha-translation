  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/006.yaml
  text: And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi, enter.”
translation:
  language: fr
  text: 'Et voici que les cieux s’ouvrirent, et un ange du Seigneur me dit : « Lévi, Lévi, entre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le signal narratif et visionnaire du grec dans une formulation française naturelle et digne.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: les cieux s’ouvrirent
  rationale: Rend le pluriel οἱ οὐρανοί et la forme passive grecque par une tournure pronominale idiomatique, sans préciser qui les ouvre.
- source_word: ἄγγελος Κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise « un ange »; « du Seigneur » traduit directement le génitif Κυρίου.
- source_word: εἴσελθε
  choice: entre
  rationale: Impératif singulier direct et naturel, qui préserve l’absence de complément explicite dans le grec.
theological_decisions:
- issue: Identité de l’ange
  choice: un ange du Seigneur
  alternative: l’ange du Seigneur
  rationale: Le grec ne comporte pas d’article devant ἄγγελος; la traduction évite donc d’identifier implicitement ce messager à une figure unique ou techniquement définie.
- issue: Agent de l’ouverture des cieux
  choice: les cieux s’ouvrirent
  alternative: les cieux furent ouverts
  rationale: La tournure retenue maintient l’événement au premier plan sans introduire un agent absent du texte; elle est aussi plus naturelle en français moderne.
translation_notes:
  register: Français moderne international, sobre et visionnaire. La répétition solennelle « Lévi, Lévi » et le pluriel « les cieux » sont conservés; la ponctuation française encadre clairement la parole directe.
