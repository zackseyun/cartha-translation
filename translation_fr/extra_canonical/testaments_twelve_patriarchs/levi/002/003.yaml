revisions:
- from: Pendant que je faisais paître les troupeaux à Abelmaoul, un esprit d’intelligence venant du Seigneur vint sur moi. Je vis alors tous les humains mener leur voie à la ruine ; le péché s’édifiait sur une muraille, et l’injustice siégeait sur des tours.
  to: Pendant que je faisais paître à Abelmaoul, un esprit de discernement de la part du Seigneur vint sur moi, et je contemplais tous les humains qui avaient détruit leur voie ; le péché s’édifiait sur une muraille, et l’injustice siégeait sur des tours.
  rationale: La révision rétablit l’imparfait visionnaire de ἐθεώρουν et la valeur accomplie du participe ἀφανίσαντας, tout en conservant le parallélisme et les images symboliques du texte. « De la part du Seigneur » exprime prudemment le rapport du génitif Κυρίου sans trancher une question théologique, et « discernement » est un équivalent moderne et contextuellement précis de σύνεσις.
