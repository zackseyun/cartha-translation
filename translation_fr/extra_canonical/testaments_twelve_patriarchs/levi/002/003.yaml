base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: fr
  text: Pendant que je faisais paître à Abelmaoul, un esprit de discernement de la part du Seigneur vint sur moi, et je contemplais tous les humains qui avaient détruit leur voie ; le péché s’édifiait sur une muraille, et l’injustice siégeait sur des tours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: je faisais paître les troupeaux
  rationale: Le verbe désigne l’activité du berger. L’ajout naturel de « les troupeaux » explicite en français l’objet implicite sans modifier le sens.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: un esprit d’intelligence venant du Seigneur
  rationale: « Intelligence » rend σύνεσις dans son sens de compréhension ou discernement, et « venant du Seigneur » conserve la relation exprimée par le génitif sans imposer une analyse théologique plus précise.
- source_word: ἐθεώρουν
  choice: je vis alors
  rationale: Le verbe exprime une perception attentive ou visionnaire. Le passé simple convient à l’entrée dans la vision, tandis que « alors » marque naturellement son lien avec la venue de l’esprit.
- source_word: πάντας ἀνθρώπους
  choice: tous les humains
  rationale: Formulation inclusive et actuelle qui conserve la portée universelle de l’expression grecque.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: mener leur voie à la ruine
  rationale: ἀφανίζω signifie détruire, ruiner ou faire disparaître. Cette formulation préserve la force destructrice du participe tout en évitant l’expression française peu naturelle « détruire leur voie ».
- source_word: οἰκοδομεῖτο
  choice: s’édifiait
  rationale: L’imparfait passif grec est rendu par une construction pronominale française qui maintient l’image architecturale et l’aspect progressif.
- source_word: ἐκάθητο
  choice: siégeait
  rationale: « Siéger » conserve l’image personnifiée de l’injustice assise en hauteur et convient au registre visionnaire.
theological_decisions:
- issue: Nature de l’« esprit d’intelligence »
  choice: un esprit d’intelligence venant du Seigneur
  alternative: l’Esprit d’intelligence du Seigneur
  rationale: L’absence d’article et la construction grecque ne requièrent pas d’identifier explicitement cet esprit à une personne divine déterminée. La traduction conserve donc l’indétermination du texte.
- issue: Sens moral ou destructeur de ἀφανίσαντας
  choice: mener leur voie à la ruine
  alternative: corrompre leur conduite
  rationale: Le choix retient la valeur forte de destruction ou ruine attestée par le verbe, sans réduire « voie » à la seule conduite morale.
- issue: Images de la muraille et des tours
  choice: conservation littérale des images
  alternative: explication symbolique de la domination du mal
  rationale: Le texte présente une vision symbolique sans en donner ici l’interprétation. La traduction ne doit pas résoudre cette tension en paraphrase doctrinale.
translation_notes:
  register: Français moderne, digne et lisible, avec maintien du parallélisme visionnaire. « Abelmaoul » est translittéré comme nom de lieu. Les imparfaits « s’édifiait » et « siégeait » préservent le caractère continu de la scène contemplée.
