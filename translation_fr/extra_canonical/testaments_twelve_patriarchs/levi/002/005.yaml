lexical_decisions:
- source_word: ἐπέπεσέ με ὕπνος
  choice: le sommeil tomba sur moi
  rationale: Rend directement l’image grecque où le sommeil survient et s’abat sur le narrateur, tout en restant clair en français.
- source_word: ἐθεασάμην
  choice: je vis
  rationale: Traduction naturelle du verbe de perception visuelle dans le contexte d’une vision, sans ajouter explicitement « en vision ».
- source_word: ὄρος ὑψηλόν
  choice: une haute montagne
  rationale: Reproduit simplement le substantif et son qualificatif, sans préciser une taille ou une élévation absente du grec.
- source_word: ἤμην ἐν αὐτῷ
  choice: j’étais sur elle
  rationale: Dans le contexte d’une montagne, le français idiomatique « sur elle » exprime la présence du narrateur sur la montagne; le référent féminin est explicite en français.
