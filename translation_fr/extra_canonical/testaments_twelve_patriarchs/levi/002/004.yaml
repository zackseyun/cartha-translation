  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: fr
  text: J’étais attristé pour la race des fils des hommes, et je priai le Seigneur afin d’être sauvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: J’étais profondément attristé
  rationale: La construction périphrastique exprime un état de tristesse en cours; « profondément » rend naturellement la force de λυπέομαι sans modifier le sens.
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  choice: au sujet de la race des fils des hommes
  rationale: « Au sujet de » conserve ici la portée de ὑπέρ, tandis que « race » et « fils des hommes » maintiennent l’expression généalogique et anthropologique du grec.
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: je priai le Seigneur
  rationale: Formulation française naturelle qui rend le datif indiquant le destinataire de la prière.
- source_word: ὅπως σωθῶ
  choice: afin d’être sauvé
  rationale: Conserve la proposition finale et le passif du grec, sans préciser de quel péril vient le salut.
theological_decisions:
- issue: Nature du salut demandé
  choice: être sauvé
  alternative: être délivré
  rationale: Le passif σωθῶ reste ouvert à un salut physique, spirituel ou global; « être sauvé » préserve cette amplitude.
translation_notes:
  register: Français moderne, digne et lisible. La tournure traditionnelle « fils des hommes » est conservée parce qu’elle porte une nuance littéraire et anthropologique absente de « êtres humains ».
