  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002.yaml
  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: fr
  text: '**Testament de Lévi 2**


    1. Moi, Lévi, je suis né à Harrân et je suis venu avec mon père à Sichem. 2. J’étais encore jeune, âgé d’environ vingt ans, lorsque j’ai exercé avec Siméon la vengeance pour notre sœur Dina contre Hamor. 3. Tandis que je faisais paître les troupeaux à Abelmaoul, un esprit d’intelligence venant du Seigneur vint sur moi. Je vis alors tous les humains détruire leur propre voie[a] ; le péché se bâtissait sur une muraille, et l’injustice siégeait sur des tours. 4. J’étais affligé au sujet de la race des fils des hommes[b], et je priai le Seigneur afin d’être sauvé. 5. Alors, le sommeil tomba sur moi. Je vis une haute montagne, et je m’y trouvais. 6. Et voici que les cieux s’ouvrirent[c], et un ange du Seigneur me dit : « Lévi, Lévi, entre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression signifie littéralement que les humains détruisent ou ruinent leur propre « voie », c’est-à-dire leur manière de vivre et leur conduite.
    reason: lexical_alternative
  - marker: b
    text: « La race des fils des hommes » est une expression solennelle, de tournure sémitique, qui désigne l’humanité.
    reason: cultural_note
  - marker: c
    text: L’ouverture des cieux appartient au langage habituel des visions apocalyptiques ; on retrouve cette image dans d’autres récits de visions bibliques et juifs.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: j’ai exercé […] la vengeance
  rationale: Cette formulation conserve la force active de l’expression grecque et la participation de Lévi à une action de représailles, sans l’atténuer.
- source_word: νεώτερος
  choice: encore jeune
  rationale: Dans cette indication autobiographique suivie de l’âge approximatif, cette expression rend naturellement la jeunesse relative de Lévi.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: un esprit d’intelligence venant du Seigneur
  rationale: L’article indéfini respecte l’absence d’article en grec, tandis que « venant du Seigneur » exprime clairement l’origine divine sans imposer un titre doctrinal plus précis.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: détruire leur propre voie
  rationale: Le choix conserve le sens fort de ἀφανίζω et l’image biblique de la « voie » comme conduite ou manière de vivre.
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: le péché se bâtissait
  rationale: La construction pronominale française garde l’aspect progressif et la métaphore architecturale du grec.
- source_word: ἀδικία ἐκάθητο
  choice: l’injustice siégeait
  rationale: « Siégeait » préserve la personnification et l’image statique d’une injustice installée sur les tours.
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: la race des fils des hommes
  rationale: Cette traduction conserve le tour solennel, d’allure sémitique, plutôt que de le réduire simplement à « l’humanité ».
- source_word: ὅπως σωθῶ
  choice: afin d’être sauvé
  rationale: « Sauvé » maintient l’étendue possible du verbe, qui peut évoquer à la fois délivrance et salut, sans réduire la demande à une protection physique.
- source_word: ἐπέπεσέ με ὕπνος
  choice: le sommeil tomba sur moi
  rationale: La formulation conserve l’image vive du grec et convient au passage à la vision.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: les cieux s’ouvrirent
  rationale: Le pluriel du grec et le langage apocalyptique sont préservés dans une tournure française naturelle.
theological_decisions:
- issue: Nature de πνεῦμα συνέσεως
  choice: un esprit d’intelligence venant du Seigneur
  alternative: l’Esprit d’intelligence / le Saint-Esprit d’intelligence
  rationale: Le grec indique une origine divine, mais ne contraint pas à identifier explicitement cette réalité au Saint-Esprit comme titre personnel. La traduction conserve cette ouverture.
- issue: Portée de σωθῶ dans la prière de Lévi
  choice: être sauvé
  alternative: être délivré / être préservé
  rationale: Le contexte associe la corruption morale de l’humanité et la demande personnelle de Lévi. « Être sauvé » garde les dimensions existentielle et théologique sans trancher entre elles.
- issue: Image du péché et de l’injustice
  choice: conservation des personnifications architecturales
  alternative: paraphrase morale explicative
  rationale: Le texte présente le péché comme une construction et l’injustice comme une figure qui siège. Ces images sont conservées sans leur attribuer une signification doctrinale plus précise.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les répétitions et les images visionnaires du grec sont conservées lorsqu’elles portent le style du passage. Les noms propres suivent des formes françaises courantes ou une translittération transparente : Harrân, Sichem, Siméon, Dina, Hamor et Abelmaoul.'
