  source_fidelity: Le français rend fidèlement les oppositions parallèles de 19.1, l'engagement de marcher devant le Seigneur selon sa loi en 19.2, et la formulation juridique répétitive de 19.3. « Pour vous-mêmes » reflète bien le moyen ἑαυτοῖς; « conformément à sa loi » rend correctement κατά; et « la parole sortie de votre bouche » conserve l'image concrète de περὶ τοῦ λόγου τοῦ στόματος ὑμῶν sans surinterprétation. La réponse elliptique Μάρτυρες est naturellement explicitée par « Nous sommes témoins », avec note littérale.
  naturalness: Le texte est fluide en français international moderne tout en gardant un registre solennel approprié à une exhortation testamentaire. La répétition de « témoin(s) » est naturelle et préserve la tonalité d'attestation. « Marcher devant le Seigneur » demeure un idiome biblique compréhensible, utilement éclairé par la note.
  terminology: « Seigneur », « loi », « œuvres », « Béliar » et « témoin » sont cohérents avec le grec et avec le registre religieux du passage. Le nom Béliar respecte la forme Βελίαρ attestée dans la source; la note signale sobrement Bélial comme forme alternative. Les ancres de notes sont placées auprès des expressions qu'elles expliquent.
