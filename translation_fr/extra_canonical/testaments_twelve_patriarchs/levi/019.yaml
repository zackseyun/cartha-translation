base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: fr
  text: '1. Et maintenant, mes enfants, vous avez tout entendu. Choisissez pour vous-mêmes soit la lumière, soit les ténèbres, soit la loi du Seigneur, soit les œuvres de Béliar[a].


    2. Ses fils lui répondirent : « Nous marcherons devant le Seigneur, conformément à sa loi[b]. »


    3. Leur père leur dit : « Le Seigneur est témoin, ses anges sont témoins, vous êtes témoins, et moi aussi, je suis témoin de la parole sortie de votre bouche. » Ses fils lui répondirent : « Nous sommes témoins[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béliar est la forme du nom employée ici dans le texte grec; ailleurs, on rencontre aussi la forme Bélial.
    reason: alternative_reading
  - marker: b
    text: « Marcher devant le Seigneur » est une expression biblique qui signifie mener sa vie devant Dieu, sous son regard et dans l’obéissance.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « Témoins. »'
    reason: literal_rendering
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Choisissez pour vous-mêmes
  rationale: L’impératif moyen et le pronom réfléchi soulignent que les fils doivent personnellement faire ce choix; la formulation française conserve cette force sans paraphraser.
- source_word: ἢ τὸ φῶς ἢ τὸ σκότος
  choice: soit la lumière, soit les ténèbres
  rationale: Conserve directement l’opposition morale et symbolique du grec ainsi que sa construction alternative.
- source_word: νόμον κυρίου
  choice: la loi du Seigneur
  rationale: Rend la formulation d’alliance de manière transparente et garde κύριος comme titre divin.
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: les œuvres de Béliar
  rationale: « Œuvres » maintient le registre moral et religieux de ἔργα; « Béliar » translittère la forme grecque attestée plutôt que de la normaliser en « Bélial ».
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: Nous marcherons devant le Seigneur
  rationale: Préserve l’idiome biblique de la marche devant Dieu tout en adoptant un ordre naturel et solennel en français.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: conformément à sa loi
  rationale: Exprime clairement la valeur normative de κατά avec l’accusatif dans un français actuel.
- source_word: Μάρτυς / μάρτυρες
  choice: témoin / témoins
  rationale: La répétition cohérente conserve le ton juridique et solennel de l’engagement.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: de la parole sortie de votre bouche
  rationale: Garde l’image concrète de la bouche et le caractère oral de l’engagement, dans une formulation française intelligible.
theological_decisions:
- issue: Le dualisme éthique entre lumière et ténèbres, puis entre la loi du Seigneur et les œuvres de Béliar
  choice: Conserver sans atténuation les deux couples d’oppositions.
  alternative: Expliciter par « le bien ou le mal » et « la justice ou la méchanceté ».
  rationale: Le grec formule un choix testamentaire tranché au moyen d’images et de parallélismes; les remplacer par des abstractions réduirait sa texture apocalyptique et morale.
- issue: La forme du nom Βελίαρ
  choice: Béliar
  alternative: Bélial
  rationale: La traduction suit la forme propre au témoin grec fourni, sans l’harmoniser avec une forme plus familière transmise ailleurs.
- issue: La réponse finale Μάρτυρες
  choice: « Nous sommes témoins. »
  alternative: « Témoins. »
  rationale: Le mot isolé constitue une réponse elliptique. L’ajout français du verbe, signalé en note, rend naturellement l’engagement collectif sans en modifier le sens.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme solennel du verset 1 et la répétition juridique de « témoin » sont conservés. La syntaxe narrative est légèrement allégée par rapport aux enchaînements grecs en καί, sans effacer leur progression.
