lexical_decisions:
- source_word: ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: dans ma quatre-vingt-quatorzième année
  rationale: Rend directement l’âge exprimé par l’ordinal grec, dans une formulation française naturelle et digne.
- source_word: ἔλαβεν … ἑαυτῷ εἰς γυναῖκα
  choice: prit pour femme
  rationale: Expression française idiomatique qui conserve le sens matrimonial de la tournure grecque.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Transcription française traditionnelle et exacte du nom attesté dans le texte grec fourni.
- source_word: Ἰωχαβὲδ
  choice: Jokébed
  rationale: Forme française usuelle du nom biblique, reconnaissable pour le lectorat moderne.
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: étaient nés le même jour
  rationale: Restitue naturellement en français l’idée qu’ils sont tous deux nés en un seul et même jour.
