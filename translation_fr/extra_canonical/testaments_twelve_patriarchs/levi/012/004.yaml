  text: And in the ninety-fourth year of my life, Abraham took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day.
translation:
  language: fr
  text: Et dans ma quatre-vingt-quatorzième année, Abraham prit pour femme ma fille Jokébed, parce que lui et ma fille étaient nés un seul et même jour.
