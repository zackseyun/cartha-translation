  text: Et voici, mes enfants, vous êtes la troisième génération.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte un signe de note après « génération », mais le contenu de la note 45 n’est pas fourni dans les données sources.
