lexical_decisions:
- source_word: ἰδού
  choice: voici
  rationale: Conserve le marqueur grec qui attire solennellement l’attention, dans une formulation française naturelle et digne.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse familiale et affectueuse du grec.
- source_word: τρίτη γενεά
  choice: la troisième génération
  rationale: Traduction littérale et intelligible qui préserve l’expression grecque sans en préciser implicitement le point de départ.
theological_decisions:
- issue: Référent de « troisième génération »
  choice: Maintenir l’expression sans explicitation
  alternative: Préciser de qui ou de quel événement cette génération est comptée
  rationale: Le verset grec isolé ne précise pas le point de référence; l’ajouter résoudrait indûment une ambiguïté réelle.
translation_notes:
  register: Français moderne international, simple et solennel. La tournure « Et voici » conserve le caractère discursif du grec biblique tout en restant immédiatement compréhensible.
