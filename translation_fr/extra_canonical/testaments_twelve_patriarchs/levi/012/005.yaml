base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/005.yaml
  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: fr
  text: J’avais huit ans lorsque je suis entré dans le pays de Canaan ; j’avais dix-huit ans lorsque j’ai tué Sichem ; j’avais dix-neuf ans lorsque j’ai exercé comme prêtre ; j’avais vingt-huit ans lorsque j’ai pris femme ; et j’avais quarante-huit ans lorsque je suis entré en Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθον εἰς γῆν Χανάαν
  choice: je suis entré dans le pays de Canaan
  rationale: Rend directement le mouvement exprimé par εἰσῆλθον et la désignation géographique γῆν Χανάαν dans un français naturel.
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: j’ai tué Sichem
  rationale: Conserve le sens direct de ἀποκτείνω et la forme personnelle du nom Συχέμ, sans préciser davantage une possible ambiguïté entre la personne et la ville.
- source_word: ἱεράτευσα
  choice: je suis devenu prêtre
  rationale: Dans cette suite d’âges marquant des étapes de vie, le verbe aoriste est rendu comme l’accès à la fonction sacerdotale; « j’ai exercé la prêtrise » resterait également possible.
- source_word: ἔλαβον γυναῖκα
  choice: j’ai pris femme
  rationale: Expression française concise et digne correspondant à l’idiome grec signifiant se marier.
- source_word: τεσσαράκοντα (καὶ ὀκτὼ) ἐτῶν
  choice: quarante-huit ans
  rationale: Suit la leçon éditoriale incluant καὶ ὀκτώ, en accord avec le texte de consultation anglais.
