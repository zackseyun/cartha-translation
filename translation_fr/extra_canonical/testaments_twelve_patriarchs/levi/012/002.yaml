- source_word: Ἀβραάμ
  choice: Amram
  rationale: Le texte grec fourni porte littéralement « Abraham », mais le contexte généalogique et la tradition parallèle identifient ici Amram; la leçon grecque est signalée en note afin de ne pas la dissimuler.
- source_word: Ἰσαχάρ
  choice: Issacar
  rationale: Forme française traditionnelle et immédiatement reconnaissable.
- source_word: Χεβρών
  choice: Hébron
  rationale: Forme française standard du nom propre.
- source_word: Ὀζηήλ
  choice: Ouzziel
  rationale: Forme française biblique usuelle correspondant à Uzziel.
