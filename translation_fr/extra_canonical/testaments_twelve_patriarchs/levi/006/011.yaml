lexical_decisions:
- source_word: Ἔφθασε
  choice: atteignit
  rationale: Le verbe exprime ici le fait que la colère parvint jusqu’à eux et les frappa; « atteignit » rend naturellement cette idée en français.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: la colère de Dieu
  rationale: Traduction directe qui conserve le langage théologique du grec sans l’atténuer.
- source_word: εἰς τέλος
  choice: pleinement
  rationale: Cette expression indique ici l’accomplissement total ou complet de l’action; « pleinement » préserve cette portée sans imposer une nuance temporelle comme « jusqu’à la fin ».
theological_decisions:
- issue: Portée de la colère divine
  choice: les atteignit pleinement
  alternative: vint sur eux jusqu’au bout
  rationale: La formulation retenue conserve l’idée que la colère divine les a effectivement atteints dans toute sa mesure, tout en évitant de trancher en faveur d’une lecture strictement temporelle de εἰς τέλος.
translation_notes:
  register: Français moderne, sobre et dignifié. Le passé simple convient au registre narratif du passage; la syntaxe reste proche du grec tout en étant naturelle.
