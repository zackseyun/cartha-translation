base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: fr
  text: Après cela, je pris conseil avec mon père et avec Ruben, afin qu’il dise aux fils d’Emmor de ne pas se faire circoncire, car j’avais été saisi de zèle à cause de l’abomination qu’ils avaient commise contre ma sœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβούλευσα
  choice: je conseillai
  rationale: Le verbe signifie ici « conseiller » ou « prendre conseil avec ». La construction avec le datif et la proposition finale se rend naturellement par « conseiller à quelqu’un de ».
- source_word: τοῖς υἱοῖς Ἐμμώρ
  choice: aux fils d’Emmor
  rationale: Traduction directe du groupe nominal grec, en conservant la forme du nom propre transmise par cette édition.
- source_word: τοῦ μὴ περιτμηθῆναι αὐτούς
  choice: de ne pas se faire circoncire
  rationale: Rend l’infinitif passif aoriste de façon idiomatique et claire en français, sans suggérer qu’ils se circonciraient eux-mêmes.
- source_word: ἐζήλωσα
  choice: j’étais indigné
  rationale: Dans ce contexte de réaction à une abomination commise contre sa sœur, le verbe exprime une ardeur jalouse et outrée. « Être indigné » communique naturellement cette réaction sans ajouter de précision doctrinale.
- source_word: βδέλυγμα
  choice: abomination
  rationale: Équivalent formel qui conserve la forte condamnation morale du terme grec.
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  choice: contre ma sœur
  rationale: La préposition ἐπί désigne ici la personne lésée; « contre » exprime clairement le tort commis à son encontre.
theological_decisions:
- issue: Sens de ἐζήλωσα
  choice: j’étais indigné
  alternative: je fus rempli de zèle / j’éprouvai une jalousie ardente
  rationale: Le contexte appelle une réaction intense à la profanation subie par la sœur. La formulation retenue préserve la force morale tout en restant compréhensible et sans imposer une lecture théologique particulière.
- issue: Référent implicite de εἴπῃ
  choice: de dire
  alternative: pour qu’il dise
  rationale: Le sujet singulier implicite pourrait renvoyer au père ou à Ruben, mais le grec ne l’explicite pas clairement. La restructuration française évite de trancher artificiellement ce référent tout en conservant le contenu du conseil.
translation_notes:
  register: Français moderne, international et digne. La phrase est légèrement restructurée pour éviter l’ambiguïté peu naturelle du pronom singulier français, sans modifier le propos. Aucun marqueur de note n’est requis.
