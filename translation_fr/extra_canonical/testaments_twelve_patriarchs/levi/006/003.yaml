  verdict: revise
  source_fidelity: 'La formulation « je conseillai à mon père et à Ruben » ne rend pas de façon suffisamment sûre συνεβούλευσα avec les deux datifs : dans cette construction, le sens « je pris conseil avec » est préférable et correspond aussi à la trace d’audit anglaise. Le singulier εἴπῃ doit rester non résolu. « J’étais indigné » atténue et reformule ἐζήλωσα; une expression explicite du zèle rend mieux le terme sans imposer d’interprétation.'
  naturalness: La version révisée reste naturelle en français moderne. « Afin qu’il dise » conserve volontairement l’ambiguïté du sujet singulier grec, même si le référent du pronom n’est pas déterminable entre le père et Ruben.
  terminology: « Emmor », « se faire circoncire », « abomination » et « contre ma sœur » sont recevables. « Être saisi de zèle » restitue mieux ἐζήλωσα que « être indigné », tout en évitant de spécifier indûment la nature de ce zèle.
  issues:
  - severity: medium
    issue: Sens de συνεβούλευσα
    rationale: Le projet traduit le verbe par « je conseillai à », alors que la construction et la tradition de traduction ici soutiennent « je pris conseil avec ». La première option modifie les rôles respectifs de Lévi, de son père et de Ruben.
  - severity: medium
    issue: Rendu de ἐζήλωσα
    rationale: « J’étais indigné » interprète le zèle comme une simple indignation et passe d’un aoriste à un imparfait. Une formulation comportant « zèle » conserve plus directement le lexique et la force du grec.
  revised_text: Après cela, je pris conseil avec mon père et avec Ruben, afin qu’il dise aux fils d’Emmor de ne pas se faire circoncire, car j’avais été saisi de zèle à cause de l’abomination qu’ils avaient commise contre ma sœur.
