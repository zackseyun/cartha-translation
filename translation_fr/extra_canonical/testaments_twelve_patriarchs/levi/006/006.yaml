id: T12P.LEV.6.6
reference: Testament of Levi 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἤκουσεν²⁶ ὁ πατήρ *μου ⌈ταῦτα⌉²⁷ *καὶ ὀργισθεὶς²⁸ ἐλυπήθη²⁹ ὅτι κατεδέξαντο³⁰ τὴν περιτομὴν καὶ³¹ ἀπέθανον³², *καὶ ἐν ταῖς εὐλογίαις³³ †παρεῖδεν ἡμῖν³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: fr
  text: Mon père apprit tout cela et, dans sa colère, il fut affligé parce qu’ils avaient accepté la circoncision et étaient morts. Dans ses bénédictions, il ne fit pas mention de nous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de la dernière proposition est incertain; autre traduction possible : « dans ses bénédictions, il nous passa sous silence » ou « il nous négligea ».'
    reason: Signaler honnêtement l’incertitude textuelle marquée dans l’édition et l’éventail sémantique du verbe.
lexical_decisions:
- source_word: ἤκουσεν ... ταῦτα
  choice: apprit tout cela
  rationale: En contexte, « apprendre » rend naturellement le fait d’entendre parler des événements, tandis que « tout cela » restitue le démonstratif pluriel.
- source_word: ὀργισθεὶς ἐλυπήθη
  choice: dans sa colère, il fut affligé
  rationale: Conserve les deux réactions distinctes, la colère et l’affliction, sans réduire l’une à la cause certaine de l’autre.
- source_word: κατεδέξαντο τὴν περιτομήν
  choice: avaient accepté la circoncision
  rationale: Rend directement l’acceptation de la circoncision, vraisemblablement dans le cadre de l’accord trompeur évoqué par le récit.
- source_word: ἐν ταῖς εὐλογίαις παρεῖδεν ἡμῖν
  choice: Dans ses bénédictions, il ne fit pas mention de nous
  rationale: « Ne pas faire mention de » exprime en français courant l’idée de passer quelqu’un sous silence dans une série de bénédictions.
theological_decisions:
- issue: Lien entre l’acceptation de la circoncision et la mort
  choice: parce qu’ils avaient accepté la circoncision et étaient morts
  alternative: parce qu’après avoir accepté la circoncision, ils étaient morts
  rationale: La coordination grecque unit les deux faits sans préciser explicitement un rapport temporel ou causal entre eux; la traduction préserve cette sobriété.
- issue: Sens du dernier membre textuellement incertain
  choice: il ne fit pas mention de nous
  alternative: il nous passa sous silence / il nous négligea
  rationale: Le texte porte un signe de corruption ou d’incertitude; la formulation choisie suit le sens probable de παρεῖδεν dans le contexte des bénédictions sans surinterpréter la nature exacte de l’omission.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation sépare la dernière proposition afin d’éviter une phrase trop lourde, tout en maintenant la continuité du récit.
