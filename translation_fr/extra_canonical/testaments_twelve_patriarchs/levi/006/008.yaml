- from: Mais je vis que c’était une décision de Dieu pour leur malheur, car ils avaient voulu traiter Sara et Rébecca comme ils avaient traité Dina, notre sœur, et le Seigneur les en avait empêchés.
  to: Mais je vis que c’était un décret de Dieu visant leur malheur, car ils voulaient faire à Sara et à Rébecca ce qu’ils avaient fait à Dina, notre sœur ; mais le Seigneur les en empêcha.
  rationale: 'La révision ajuste les temps verbaux au grec et à la progression narrative : intention durable, acte antérieur envers Dina, puis intervention ponctuelle du Seigneur. Elle conserve l’ambiguïté délibérée de « faire à », sans expliciter l’outrage évoqué, et maintient les formes françaises usuelles des noms.'
