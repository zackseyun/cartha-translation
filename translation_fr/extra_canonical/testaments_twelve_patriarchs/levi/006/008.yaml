base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: fr
  text: Mais je vis que c’était un décret de Dieu visant leur malheur, car ils voulaient faire à Sara et à Rébecca ce qu’ils avaient fait à Dina, notre sœur ; mais le Seigneur les en empêcha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: une décision de Dieu
  rationale: Rend directement l’idée d’une décision ou sentence divine, sans préciser davantage sa nature.
- source_word: εἰς κακά
  choice: pour leur malheur
  rationale: Exprime l’orientation vers des maux touchant les hommes concernés, tout en évitant le français ambigu « pour le mal ».
- source_word: ἤθελον
  choice: ils avaient voulu
  rationale: Le plus-que-parfait restitue naturellement une intention antérieure à l’intervention empêchante du Seigneur.
- source_word: ποιῆσαι ὃν τρόπον ἐποίησαν
  choice: traiter … comme ils avaient traité
  rationale: Cette formulation française idiomatique conserve le parallèle entre l’intention envers Sara et Rébecca et l’acte commis envers Dina, sans expliciter la nature de l’outrage.
- source_word: ἐκώλυσεν αὐτούς
  choice: les en avait empêchés
  rationale: Rend l’action divine d’empêcher l’accomplissement de leur intention; « en » renvoie clairement au traitement projeté.
theological_decisions:
- issue: Rapport entre la décision divine et le mal
  choice: « une décision de Dieu pour leur malheur »
  alternative: « un décret de Dieu en vue de maux »
  rationale: La traduction maintient la tension du grec, selon lequel la décision divine s’oriente vers un malheur, sans faire de Dieu l’auteur d’un mal moral ni résoudre le sens en simple châtiment.
- issue: Nature de l’acte projeté contre Sara et Rébecca
  choice: Ne pas l’expliciter
  alternative: « leur faire violence » ou « les violer »
  rationale: Le grec emploie seulement le verbe général « faire » dans une comparaison avec Dina; la formulation retenue préserve cette réticence et l’ambiguïté du texte source.
- issue: Temporalité de l’empêchement divin
  choice: « les en avait empêchés »
  alternative: « les empêcha »
  rationale: Le plus-que-parfait clarifie en français que l’empêchement appartient au cadre antérieur de l’événement raconté, sans modifier le contenu théologique.
translation_notes:
  register: 'Français international moderne, digne et lisible. Les noms propres suivent les formes françaises courantes: Sara, Rébecca et Dina. La syntaxe reste proche du grec tout en évitant une tournure artificielle.'
