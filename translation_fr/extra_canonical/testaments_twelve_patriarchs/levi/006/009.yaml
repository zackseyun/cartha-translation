source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ⁴⁴ ἐδίωξαν Ἀβραὰμ τὸν πατέρα ἡμῶν ξένον ὄντα⁴⁵ καὶ κατεπόνησαν⁴⁶ τὰ ποίμνια⁴⁷ ὀγκούμενα⁴⁸ ὄντα⁴⁹, καὶ Ἐβλαὴν⁵⁰ τὸν οἰκογενῆ⁵¹ αὐτοῦ⁵² σφόδρα⁵³ ἠκίσαντο⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: fr
  text: Ils poursuivirent Abraham, notre père, alors qu’il était étranger, accablèrent ses troupeaux qui se multipliaient et maltraitèrent cruellement Eblan, son serviteur né dans sa maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: poursuivirent
  rationale: Rend directement l’idée de poursuite ou de persécution sans préciser davantage le motif.
- source_word: ξένον ὄντα
  choice: alors qu’il était étranger
  rationale: Préserve la situation d’Abraham comme étranger, sans imposer le sens plus précis de résident temporaire.
- source_word: κατεπόνησαν
  choice: accablèrent
  rationale: Exprime les mauvais traitements et les épreuves infligés aux troupeaux, avec une tournure française naturelle.
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: ses troupeaux qui se multipliaient
  rationale: Dans ce contexte, ὀγκούμενα indique vraisemblablement des troupeaux en croissance; cette formulation évite le calque maladroit « qui enflaient ».
- source_word: οἰκογενῆ
  choice: né dans sa maison
  rationale: Conserve le sens littéral d’une personne née au sein de la maisonnée, plutôt que de le réduire à « domestique ».
- source_word: σφόδρα ἠκίσαντο
  choice: maltraitèrent cruellement
  rationale: Reproduit l’intensité de σφόδρα et la violence exprimée par ἀικίζομαι dans un français clair.
