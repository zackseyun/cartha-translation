source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διότι ἡμάρτομεν ἐπειδὴ³⁵ παρὰ γνώμην αὐτοῦ τοῦτο πεποιήκαμεν³⁶, καίγε ἐμαλακίσθη³⁷ ἐν τῇ ἡμέρᾳ ἐκείνῃ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/007.yaml
  text: For we sinned, because we had done this contrary to his will, although he became weak on that day.
translation:
  language: fr
  text: Car nous avons péché, parce que nous avons fait cela contre sa volonté, alors même qu’il s’est affaibli ce jour-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώμην
  choice: volonté
  rationale: Dans l’expression παρὰ γνώμην αὐτοῦ, « contre sa volonté » exprime naturellement l’idée d’une action contraire à l’intention ou au vouloir de quelqu’un; « jugement » serait ici moins idiomatique et probablement trop intellectuel.
- source_word: ἐμαλακίσθη
  choice: s’est affaibli
  rationale: Le verbe passif peut décrire le fait de devenir faible ou de perdre ses forces. La formulation pronominale française conserve ce sens sans préciser la nature physique, morale ou affective de cet affaiblissement.
- source_word: καίγε
  choice: bien que
  rationale: Dans ce contexte, la particule introduit une nuance concessive ou adversative. « Bien que » restitue clairement ce rapport en français naturel, conformément au sens contextuel retenu par la couche de consultation anglaise.
theological_decisions:
- issue: Nature de la « volonté » désignée par γνώμη
  choice: Ne pas préciser davantage que « sa volonté »
  alternative: « sa décision », « son jugement » ou une identification explicite de la personne
  rationale: Le grec emploie un pronom masculin sans expliciter ici son référent et γνώμη peut couvrir l’intention, l’avis ou la décision. La traduction conserve cette indétermination plutôt que d’introduire une interprétation.
- issue: Nature de l’affaiblissement exprimé par ἐμαλακίσθη
  choice: Employer le terme général « s’est affaibli »
  alternative: Préciser qu’il s’agit d’un affaiblissement physique, moral ou émotionnel
  rationale: Le verset ne définit pas la nature de cet état. Une formulation générale préserve la tension et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure causale « Car… puisque… » reflète les deux conjonctions grecques διότι et ἐπειδή sans alourdir excessivement la phrase. Le plus-que-parfait marque l’antériorité de l’action accomplie par rapport à l’aveu du péché.
