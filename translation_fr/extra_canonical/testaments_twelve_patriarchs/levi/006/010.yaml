source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καίγε οὕτως⁵⁵ ἐποίουν *πᾶσι τοῖς ξένοις⁵⁶, *ἐν δυναστείᾳ ἁρπάζοντες⁵⁷ *τὰς ξένας⁵⁸ καὶ †ἐξενηλάτουν⁵⁹ αὐτάς⁶⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: fr
  text: 'Et c’est bien ainsi qu’ils agissaient envers tous les étrangers : ils s’emparaient de force des femmes étrangères et les chassaient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε οὕτως
  choice: Et c’est bien ainsi
  rationale: Rend la valeur renforcée de Καίγε et la manière exprimée par οὕτως dans un français naturel et digne.
- source_word: ἐποίουν
  choice: qu’ils agissaient
  rationale: L’imparfait traduit l’action habituelle ou répétée suggérée par la forme verbale dans ce contexte.
- source_word: πᾶσι τοῖς ξένοις
  choice: envers tous les étrangers
  rationale: Conserve la portée universelle de πᾶσι et le sens personnel masculin/pluriel de ξένοις.
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: ils s’emparaient de force
  rationale: Exprime à la fois l’acte violent de ἁρπάζω et la contrainte ou puissance indiquée par ἐν δυναστείᾳ.
- source_word: τὰς ξένας
  choice: des femmes étrangères
  rationale: Le féminin pluriel substantivé désigne des étrangères; cette formulation évite d’introduire une idée de possession absente du grec.
- source_word: ἐξενηλάτουν αὐτάς
  choice: les chassaient
  rationale: Rend directement l’expulsion exprimée par ἐξενηλατέω, avec αὐτάς renvoyant aux femmes étrangères.
theological_decisions: []
