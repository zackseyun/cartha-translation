source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ ὡς ἠρχόμην πρὸς τὸν πατέρα μου εὗρον ἀσπίδα χαλκῆν *διὸ καὶ τὸ ὄνομα τοῦ ὄρους Ἄσπις² *ὅ ἐστιν³ ἐγγὺς Γεβάλ, ἐκ δεξιῶν Ἀβιμά⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: fr
  text: Comme je me rendais auprès de mon père, je trouvai un bouclier de bronze. C’est pourquoi cette montagne porte le nom d’Aspis[a]. Elle se trouve près de Gébal, à droite d’Abima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, Aspis signifie « bouclier ».
    reason: La note rend explicite le jeu de mots qui relie le bouclier trouvé au nom donné à la montagne.
lexical_decisions:
- source_word: ἠρχόμην
  choice: je me rendais
  rationale: Cette formulation naturelle conserve ici la valeur de déplacement du verbe, sans trancher inutilement entre « venir » et « aller ».
- source_word: ἀσπίδα χαλκῆν
  choice: un bouclier de bronze
  rationale: Rend directement le nom ἀσπίς et l’adjectif χαλκοῦς, qui désigne ici la matière.
- source_word: Ἄσπις
  choice: Aspis
  rationale: Le nom propre grec est translittéré afin de préserver le jeu étymologique avec ἀσπίδα, « bouclier », expliqué en note.
- source_word: Γεβάλ
  choice: Gébal
  rationale: Translittération française transparente du toponyme grec.
- source_word: Ἀβιμά
  choice: Abima
  rationale: Suit directement la forme grecque Ἀβιμά plutôt que la forme « Abim » de la couche anglaise de consultation.
- source_word: ἐκ δεξιῶν
  choice: à droite de
  rationale: Expression française naturelle correspondant à l’indication spatiale grecque.
theological_decisions: []
