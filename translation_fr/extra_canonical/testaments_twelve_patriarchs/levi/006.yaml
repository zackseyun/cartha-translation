lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: un bouclier de bronze
  rationale: Rend directement l’objet et conserve le lien étiologique avec le nom Aspis.
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: je gardai ... dans mon cœur
  rationale: Expression française naturelle qui préserve l’idée de retenir intérieurement des paroles.
- source_word: συνεβούλευσα
  choice: je pris conseil auprès de
  rationale: Conserve l’idée de consultation délibérée dans un registre narratif digne.
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: de ne pas se faire circoncire
  rationale: Formulation idiomatique qui rend correctement l’infinitif passif.
- source_word: ἐζήλωσα
  choice: j’étais rempli d’indignation
  rationale: Dans ce contexte, le terme exprime un zèle indigné et non la jalousie envieuse.
- source_word: βδέλυγμα
  choice: abomination
  rationale: Préserve la forte condamnation morale du grec.
- source_word: ἐν στόματι μαχαίρας
  choice: au fil de l’épée
  rationale: Équivalent français traditionnel et intelligible de l’idiome sémitisant.
- source_word: παρεῖδεν ἡμῖν
  choice: il passa sur nous
  rationale: Conserve autant que possible l’ambiguïté d’un texte difficile, explicitée en note.
- source_word: παρὰ γνώμην αὐτοῦ
  choice: contre son jugement
  rationale: γνώμη désigne ici l’avis arrêté ou la décision autorisée du patriarche.
- source_word: ἐμαλακίσθη
  choice: il se fût affaibli
  rationale: Rendu prudent d’un verbe difficile pouvant exprimer faiblesse, adoucissement ou abattement.
- source_word: ἀπόφασις θεοῦ
  choice: un décret de Dieu
  rationale: Préserve la valeur décisionnelle et judiciaire de l’expression.
- source_word: εἰς κακά
  choice: pour leur malheur
  rationale: Exprime le jugement défavorable dirigé contre les Sichémites sans attribuer à Dieu le mal moral.
- source_word: τὰς ξένας
  choice: les femmes étrangères
  rationale: Rend le féminin substantivé de ξένος sans le remplacer par un possessif absent du grec.
- source_word: εἰς τέλος
  choice: pleinement
  rationale: Rend l’idée d’un jugement arrivé à son terme, avec le sens littéral signalé en note.
theological_decisions:
- issue: Interprétation providentielle du massacre de Sichem
  choice: Maintenir ensemble l’aveu «nous avions péché» et l’affirmation d’un «décret de Dieu» contre les Sichémites.
  alternative: Présenter le massacre soit comme entièrement justifié, soit comme dépourvu de toute dimension providentielle.
  rationale: Les versets 7 à 11 conservent explicitement cette tension; la traduction ne doit pas la résoudre artificiellement.
- issue: Mention de Sara et de Rébecca au verset 8
  choice: Traduire les deux noms et l’intention attribuée aux hommes de Sichem, tout en signalant la difficulté textuelle.
  alternative: Omettre la proposition comme corrompue ou la généraliser en une référence vague aux femmes ancestrales.
  rationale: Le témoin grec nomme explicitement Sara et Rébecca malgré la syntaxe difficile.
- issue: Sens de εἰς κακά
  choice: «pour leur malheur»
  alternative: «pour le mal contre eux»
  rationale: Le français choisi conserve le caractère adverse du décret tout en évitant de suggérer sans nécessité que Dieu décrète le mal moral.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du récit sont principalement au passé simple, avec des formulations courantes et sans archaïsmes inutiles. Les noms sont francisés selon l’usage biblique français; Aspis, Guébal, Abim et Éblan sont translittérés. Les difficultés réelles du grec sont conservées ou signalées en notes.
