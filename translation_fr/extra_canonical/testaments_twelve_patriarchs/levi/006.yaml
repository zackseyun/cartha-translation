  - severity: medium
    issue: « avaient été mis à mort » au v. 6
    rationale: ἀπέθανον veut dire « ils moururent ». La formulation actuelle ajoute une modalité causative/passive qui n’est pas explicitement exprimée.
  - severity: low
    issue: « il passa sur nous » au v. 6
    rationale: La formule est compréhensible mais peu idiomatique en français moderne. « Il nous passa sous silence dans ses bénédictions » explicite l’omission sans dépasser le sens de παρεῖδεν.
