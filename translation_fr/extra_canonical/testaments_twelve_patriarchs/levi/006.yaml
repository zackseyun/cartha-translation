  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: fr
  text: '1 Comme je me rendais auprès de mon père, je trouvai un bouclier de bronze. C’est pourquoi la montagne porte le nom d’Aspis; elle est près de Guébal, à droite d’Abim. 2 Je gardai ces paroles dans mon cœur. 3 Après cela, je pris conseil auprès de mon père et de Ruben, afin qu’il dise aux fils d’Emmor de ne pas se faire circoncire, car j’étais rempli d’indignation à cause de l’abomination qu’ils avaient commise contre ma sœur. 4 Moi, je tuai Sichem le premier, et Siméon tua Emmor. 5 Ensuite, mes frères arrivèrent et frappèrent cette ville au fil de l’épée. 6 Mon père apprit tout cela. Dans sa colère, il fut affligé parce qu’ils avaient accepté la circoncision et étaient morts; dans ses bénédictions, il nous passa sous silence[a]. 7 En effet, nous avions péché, puisque nous avions agi contre son jugement, bien qu’il se fût affaibli ce jour-là[b]. 8 Mais je vis que c’était un décret de Dieu pour leur malheur, car ils voulaient faire à Sara et à Rébecca ce qu’ils avaient fait à Dina,
    notre sœur; et le Seigneur les en empêcha[c]. 9 Ils poursuivaient Abraham, notre père, alors qu’il était étranger; ils accablaient ses troupeaux quand ceux-ci étaient gonflés par la multiplication, et ils maltraitèrent cruellement Éblan, son serviteur né dans sa maison[d]. 10 C’est ainsi qu’ils agissaient envers tous les étrangers: ils enlevaient de force les femmes étrangères et les chassaient. 11 Mais la colère de Dieu les atteignit pleinement[e].


    [a] Ou: «il ne tint pas compte de nous dans ses bénédictions»; c’est-à-dire que Jacob ne favorisa ni Lévi ni Siméon lorsqu’il prononça ses bénédictions.


    [b] Le verbe grec est difficile et peut signifier que Jacob fut adouci, affaibli ou abattu ce jour-là.


    [c] Ce verset présente des difficultés textuelles. Le grec semble dire que les hommes de Sichem voulaient traiter Sara et Rébecca comme ils avaient traité Dina.


    [d] Le nom «Éblan» est incertain dans la transmission du texte. Le sens général est qu’un serviteur d’Abraham né dans sa maison fut cruellement maltraité.


    [e] Littéralement: «jusqu’à la fin», expression qui peut évoquer un jugement total ou définitif.'
  philosophy: optimal-equivalence
