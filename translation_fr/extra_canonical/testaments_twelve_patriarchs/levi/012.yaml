  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012.yaml
  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: fr
  text: 1. Gersam prit une femme, et il eut d’elle Lomné et Séméï. 2. Les fils de Kaath furent Abraham, Isachar, Chébron et Ozièl.[a] 3. Les fils de Merari furent Mooli et Moïse.[b] 4. Dans la quatre-vingt-quatorzième année de ma vie, Abraham prit pour femme Jochabed, ma fille,[c] car lui et ma fille étaient nés le même jour. 5. J’avais huit ans lorsque j’entrai dans le pays de Canaan, dix-huit ans lorsque je tuai Sichem, dix-neuf ans lorsque j’accomplis le service sacerdotal,[d] vingt-huit ans lorsque je pris une femme, et quarante-huit ans lorsque j’entrai en Égypte. 6. Et voici, mes enfants, vous êtes la troisième génération. 7. Joseph mourut dans la cent dix-huitième année de ma vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms de cette liste sont rendus d’après leurs formes grecques transmises, sans être harmonisés avec les graphies ou les généalogies bibliques plus familières. Le grec porte notamment « Abraham ».
    reason: textual_variant
  - marker: b
    text: Ces noms peuvent évoquer une lignée mérarite connue par ailleurs, mais la traduction suit ici les formes effectivement transmises par le grec, notamment « Mooli » et « Moïse ».
    reason: textual_variant
  - marker: c
    text: L’expression « Jochabed, ma fille » crée une tension avec des traditions généalogiques plus familières. La traduction conserve l’affirmation explicite du texte grec.
    reason: alternative_reading
  - marker: d
    text: Le verbe grec désigne l’accomplissement du service ou du ministère sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν ... γυναῖκα
  choice: prit une femme
  rationale: Cette formule matrimoniale garde la tournure généalogique du grec tout en restant claire dans un français digne et courant.
- source_word: ἔτεκεν ... ἐξ αὐτῆς
  choice: il eut d’elle
  rationale: Le sujet grammatical demeure Gersam. Cette formulation française exprime naturellement l’engendrement et rend ἐξ αὐτῆς sans imposer une construction maladroite.
- source_word: υἱοί
  choice: fils
  rationale: Dans cette liste généalogique, le terme désigne explicitement la lignée masculine.
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: étaient nés le même jour
  rationale: L’expression indique une naissance à la même date; la formulation française est directe et idiomatique.
- source_word: ἱεράτευσα
  choice: j’exerçai le sacerdoce
  rationale: Le verbe désigne l’accomplissement d’un ministère sacerdotal; cette traduction en conserve le sens actif et solennel.
- source_word: ἰδού
  choice: voici
  rationale: « Voici » conserve la fonction solennelle d’appel à l’attention sans archaïsme excessif.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Le grec τέκνα est plus large que υἱοί; la traduction évite donc de le restreindre à « fils ».
- source_word: τρίτη γενεά
  choice: la troisième génération
  rationale: L’expression identifie les auditeurs selon leur position généalogique par rapport à Lévi.
- source_word: ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: dans la quatre-vingt-quatorzième année de ma vie
  rationale: Le texte grec fourni porte explicitement « quatre-vingt-quatorzième »; la traduction suit cette donnée même si d’autres couches de consultation donnent un autre nombre.
theological_decisions:
- issue: Les formes des noms généalogiques divergent de traditions bibliques plus familières
  choice: Conserver des formes proches du témoin grec, notamment Gersam, Kaath, Chébron, Ozièl et Mooli.
  alternative: Normaliser tous les noms selon les formes courantes des généalogies de l’Ancien Testament.
  rationale: La priorité accordée au texte grec exige de ne pas harmoniser silencieusement cette généalogie avec une autre tradition.
- issue: Le témoin grec nomme Abraham parmi les fils de Kaath et de nouveau au verset 4
  choice: Traduire Ἀβραάμ par « Abraham » aux deux endroits.
  alternative: Corriger en « Ambram » ou « Amram » d’après une reconstruction généalogique ou une couche anglaise.
  rationale: Le texte grec fourni lit clairement Ἀβραάμ. La difficulté généalogique doit rester visible plutôt que d’être résolue par conjecture.
- issue: Jochabed est appelée « ma fille »
  choice: Traduire directement « Jochabed, ma fille ».
  alternative: Employer « ma descendante » ou modifier la parenté pour l’accorder avec une généalogie plus connue.
  rationale: θυγατέρα μου signifie explicitement « ma fille ». La tension avec d’autres traditions ne doit pas être effacée.
- issue: L’âge indiqué au verset 4
  choice: Retenir quatre-vingt-quatorze ans.
  alternative: Retenir soixante-quatre ans d’après la couche anglaise consultative.
  rationale: L’original grec transmis ici porte ἐνενηκοστῷ τετάρτῳ, « quatre-vingt-quatorzième »; l’original prime sur la couche de consultation.
translation_notes:
  register: Français international moderne, sobre et digne, avec une syntaxe généalogique légèrement solennelle. Les noms propres suivent autant que possible le témoin grec plutôt qu’une harmonisation confessionnelle. Les nombres sont traduits directement du grec, notamment « quatre-vingt-quatorzième » au verset 4.
