- from: Le quatrième sera dans les douleurs, car l’injustice se multipliera démesurément sous son règne, et tous en Israël se haïront les uns les autres.
  to: Le quatrième sera en proie aux douleurs, car l’injustice s’accumulera sur lui en abondance, et tout Israël haïra, chacun, son prochain.
  rationale: La révision retire l’ajout interprétatif « sous son règne » et conserve la relation ambiguë de ἐπ’ αὐτῷ par « sur lui ». Elle rend plus naturellement l’expression grecque relative aux douleurs et maintient la portée distributive de la dernière proposition.
