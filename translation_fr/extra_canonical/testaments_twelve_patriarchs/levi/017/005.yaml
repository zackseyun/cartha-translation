  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: fr
  text: Le quatrième sera en proie aux douleurs, car l’injustice s’accumulera sur lui en abondance, et tout Israël haïra, chacun, son prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὀδύναις
  choice: dans les douleurs
  rationale: Rend directement l’expression grecque, qui peut évoquer des souffrances aiguës ou des tourments, sans en préciser la nature.
- source_word: ἡ ἀδικία
  choice: l’injustice
  rationale: Terme français large qui correspond au sens de ἀδικία comme conduite contraire à la justice, sans réduire le mot à une notion strictement juridique de transgression de la loi.
- source_word: εἰς πλῆθος
  choice: démesurément
  rationale: Exprime idiomatiquement l’idée d’un accroissement jusqu’à une grande abondance.
- source_word: πᾶς Ἰσραὴλ ... ἕκαστος τὸν πλησίον αὐτοῦ
  choice: tous en Israël se haïront les uns les autres
  rationale: Restitue en français naturel la portée distributive de « chacun [haïra] son prochain » et l’accord selon le sens du sujet collectif.
theological_decisions:
- issue: Référent de ἐπ’ αὐτῷ
  choice: sous son règne
  alternative: sur lui / en son temps
  rationale: Le contexte numérotant une succession de sacerdoces ou de périodes favorise une valeur temporelle liée au quatrième; « sous son règne » rend cette relation avec naturel, tout en explicitant légèrement le grec.
translation_notes:
  register: Français moderne, digne et lisible. La formulation conserve la gravité prophétique du passage; elle privilégie une équivalence optimale plutôt qu’un calque syntaxique.
