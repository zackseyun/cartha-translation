    issue: « sous son règne » pour ἐπ’ αὐτῷ
    rationale: Le grec dit littéralement « sur lui » et ne mentionne ni règne ni période. Cette reformulation résout une ambiguïté du référent ou de la relation en faveur d’une interprétation contextuelle qui n’est pas exprimée dans ce verset.
  - severity: low
    issue: Rendu de « dans les douleurs »
    rationale: La formulation est un peu calquée sur le grec. « En proie aux douleurs » est plus naturel sans modifier le sens.
  revised_text: Le quatrième sera en proie aux douleurs, car l’injustice s’accumulera sur lui en abondance, et tout Israël haïra, chacun, son prochain.
