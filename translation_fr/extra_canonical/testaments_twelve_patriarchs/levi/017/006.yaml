  text: The fifth will be taken in darkness.
translation:
  language: fr
  text: Le cinquième sera pris dans les ténèbres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: Le cinquième
  rationale: Rend directement l’adjectif ordinal substantivé masculin, dont le référent ressort du contexte plus large.
- source_word: ἐν σκότει
  choice: dans les ténèbres
  rationale: Conserve la valeur spatiale ou circonstancielle de ἐν et la portée sombre de σκότος sans préciser davantage le sens figuré éventuel.
- source_word: παραληφθήσεται
  choice: sera emporté
  rationale: Le futur passif de παραλαμβάνω peut exprimer le fait d’être pris ou emmené. « Sera emporté » reste naturel tout en préservant l’absence d’agent explicite.
theological_decisions:
- issue: Nature des « ténèbres »
  choice: Maintenir l’expression sans interprétation
  alternative: Préciser qu’il s’agit de ténèbres morales, spirituelles ou de la mort
  rationale: Le grec ne détermine pas explicitement la nature des ténèbres; la traduction conserve donc cette ambiguïté.
- issue: Agent et sens de l’action passive
  choice: Ne pas identifier l’agent
  alternative: Employer une formulation qui suggère une arrestation, un enlèvement divin ou une condamnation
  rationale: Le passif grec ne nomme aucun agent et ne permet pas, dans ce seul verset, de trancher entre ces nuances.
translation_notes:
  register: Français moderne, sobre et digne. La formulation brève reproduit la concision du grec et conserve son ambiguïté.
