source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: fr
  text: Et, au cours de la cinquième semaine, ils retourneront dans leur pays dévasté, et ils rénoveront la maison du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πέμπτῃ ἑβδομάδι
  choice: durant la cinquième semaine
  rationale: La préposition ἐν situe le retour dans cette période; «durant» est naturel en français tout en conservant la désignation chronologique symbolique.
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: le pays qu’ils avaient laissé dévasté
  rationale: Le génitif αὐτῶν se rapporte vraisemblablement aux acteurs de la dévastation; cette formulation rend ce rapport plus clairement que le calque ambigu «le pays de leur dévastation», sans préciser davantage l’identité des responsables.
- source_word: ἀνακαινοποιήσουσιν
  choice: ils rénoveront
  rationale: Le verbe exprime l’action de rendre neuf ou de restaurer. «Rénoveront» convient idiomatiquement à un édifice et évite la tournure moins naturelle «rendront de nouveau neuf».
- source_word: οἶκον κυρίου
  choice: la maison du Seigneur
  rationale: Rend littéralement l’expression cultuelle, qui désigne le sanctuaire ou le Temple, sans remplacer l’image source par une interprétation explicative.
theological_decisions:
- issue: Identification de la «maison du Seigneur»
  choice: Conserver «la maison du Seigneur»
  alternative: «le Temple du Seigneur»
  rationale: Le grec dit οἶκον, «maison». La formulation traditionnelle préserve l’image et n’impose pas une explicitation, même si le Temple est manifestement visé.
- issue: Sens du possessif dans «ἐρημώσεως αὐτῶν»
  choice: Comprendre la dévastation comme causée par ceux qui reviennent
  alternative: «le pays de leur dévastation», pouvant signifier le pays où eux-mêmes ont subi la dévastation
  rationale: Dans le contexte du passage sur les prêtres impies, le possessif est le plus naturellement subjectif. La traduction garde toutefois l’objet «pays» sans ajouter de détails doctrinaux ou historiques.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme des deux futurs grecs et le vocabulaire biblique «maison du Seigneur», avec une syntaxe immédiatement compréhensible.
