base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: fr
  text: Au deuxième jubilé, l’oint sera saisi alors qu’il sera en deuil d’un être aimé ; son sacerdoce sera tenu en honneur, et tous lui rendront gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ δευτέρῳ ἰωβηλαίῳ
  choice: Au deuxième jubilé
  rationale: Rend directement l’indication temporelle et conserve le terme technique « jubilé ».
- source_word: ὁ χριόμενος
  choice: l’oint
  rationale: Le participe présent passif substantivé désigne celui qui reçoit l’onction. « L’oint » est naturel, concis et ne transforme pas implicitement le terme en titre propre.
- source_word: συλληφθήσεται
  choice: sera saisi
  rationale: Le futur passif de συλλαμβάνω signifie ici le plus naturellement « être saisi » ou « être arrêté ». Le choix conserve une certaine latitude contextuelle sans adopter le sens moins probable « sera conçu ».
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: alors qu’il sera en deuil d’un être aimé
  rationale: πένθος désigne le deuil ou l’affliction, et le génitif ἀγαπητοῦ indique vraisemblablement la personne aimée dont on porte le deuil. La formulation française explicite seulement la relation requise pour être naturelle.
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  choice: son sacerdoce sera tenu en honneur
  rationale: τιμία exprime le caractère précieux, estimé ou honoré du sacerdoce. « Tenu en honneur » préserve cette nuance sans suggérer que le sacerdoce reçoit lui-même un acte cérémoniel.
- source_word: παρὰ πάντων δοξασθήσεται
  choice: tous lui rendront gloire
  rationale: Tour actif naturel en français qui rend le passif grec « il sera glorifié par tous » tout en conservant son sujet et son universalité.
theological_decisions:
- issue: Statut de ὁ χριόμενος
  choice: l’oint
  alternative: le Messie
  rationale: Le grec parle littéralement de « celui qui est oint ». Traduire par « le Messie » imposerait une identification théologique plus précise que la forme grecque seule.
- issue: Sens de συλληφθήσεται
  choice: sera saisi
  alternative: sera conçu
  rationale: Le verbe peut, selon le contexte, se rapporter à la conception, mais l’emploi passif absolu et la construction présente favorisent « sera saisi ». L’ambiguïté lexicale résiduelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination du grec est légèrement structurée par un point-virgule. Aucune majuscule christologique n’est ajoutée à « l’oint », afin de ne pas préjuger son identification.
