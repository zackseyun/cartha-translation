id: T12P.LEV.17.9
reference: Testament of Levi 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ τοῦτο ἐν αἰχμαλωσίᾳ καὶ ἐν προνομῇ ἔσονται· καὶ ἡ γῆ αὐτῶν⁴⁴ καὶ *ἡ ὕπαρξις⁴⁵ ἀφανισθήσεται⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/009.yaml
  text: Therefore they will be in captivity and in plunder, and their land and their possessions will be destroyed.
translation:
  language: fr
  text: C’est pourquoi ils seront emmenés en captivité et livrés au pillage, et leur pays ainsi que leurs biens seront détruits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement la relation de conséquence exprimée par la locution grecque.
- source_word: ἐν αἰχμαλωσίᾳ
  choice: emmenés en captivité
  rationale: Le grec dit littéralement « en captivité »; l’ajout verbal idiomatique explicite en français le sort subi sans changer le sens.
- source_word: ἐν προνομῇ
  choice: livrés au pillage
  rationale: προνομή désigne le pillage ou la mise à sac; cette tournure française conserve le parallélisme avec la captivité tout en restant naturelle.
- source_word: ἡ γῆ αὐτῶν
  choice: leur pays
  rationale: γῆ peut désigner la terre ou le territoire; « leur pays » convient ici à un territoire collectif voué à la destruction.
- source_word: ἡ ὕπαρξις
  choice: leurs biens
  rationale: Dans ce contexte, ὕπαρξις désigne ce que l’on possède, les biens ou possessions.
- source_word: ἀφανισθήσεται
  choice: seront détruits
  rationale: Le singulier grec gouverne l’ensemble coordonné; le pluriel français assure l’accord naturel avec « leur pays ainsi que leurs biens » et exprime la disparition ou destruction annoncée.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve les deux volets du jugement — captivité et pillage, puis destruction du pays et des biens — sans ajout interprétatif confessionnel.
