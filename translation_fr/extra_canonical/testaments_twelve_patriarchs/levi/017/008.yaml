- from: Mais dans le septième, il y aura une souillure dont je ne peux parler devant les hommes, car ceux qui commettent ces actes les connaîtront eux-mêmes.
  to: Mais au septième, il y aura une souillure dont je ne peux parler devant les hommes, car ceux qui commettent ces choses les connaîtront.
  rationale: Révision limitée à la correction de l’emphase syntaxique de αὐτοί et à une tournure française plus naturelle pour l’ordinal elliptique. Le référent du « septième » et la nature des « choses » demeurent volontairement non précisés, conformément au grec et à l’anglais de contrôle.
