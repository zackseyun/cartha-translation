source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: fr
  text: Mais au septième, il y aura une souillure dont je ne peux parler devant les hommes, car ceux qui commettent ces choses les connaîtront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ ἑβδόμῳ
  choice: dans le septième
  rationale: Conserve l’ellipse du grec, qui renvoie dans le contexte au septième ordre ou sacerdoce sans préciser ici le substantif.
- source_word: μιασμός
  choice: une souillure
  rationale: Rend l’idée de contamination ou de profanation morale et cultuelle portée par le terme grec.
- source_word: εἰπεῖν ἐνώπιον ἀνθρώπων
  choice: parler devant les hommes
  rationale: Formulation française naturelle qui reste proche de la construction grecque.
- source_word: οἱ ποιοῦντες αὐτά
  choice: ceux qui commettent ces actes
  rationale: « Commettre » convient à des actes répréhensibles; le pluriel neutre αὐτά est explicité sobrement par « ces actes ».
- source_word: γνώσονται
  choice: les connaîtront
  rationale: Préserve le futur du grec et son sens direct, sans le remplacer par une idée de reconnaissance ou de compréhension.
theological_decisions:
- issue: Référent elliptique de « septième »
  choice: Maintenir « le septième » sans ajout explicatif dans le texte
  alternative: « le septième sacerdoce » ou « la septième génération »
  rationale: Le grec laisse le substantif sous-entendu; l’ajouter résoudrait une ellipse que ce verset ne tranche pas à lui seul.
- issue: Nature de la souillure indicible
  choice: Ne pas préciser les actes visés
  alternative: Nommer une faute morale, sexuelle ou cultuelle particulière
  rationale: Le texte refuse lui-même de les énoncer; la traduction doit conserver cette retenue et cette indétermination.
translation_notes:
  register: Français moderne, digne et accessible. La structure demeure proche du grec tout en évitant un calque pesant. « Les hommes » conserve ici la portée collective de ἀνθρώπων; « eux-mêmes » souligne naturellement le sujet explicite αὐτοί.
