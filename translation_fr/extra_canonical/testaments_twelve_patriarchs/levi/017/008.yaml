review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’ellipse de τῷ ἑβδόμῳ, le futur ἔσται, μιασμός (« souillure »), l’indicibilité devant les humains, et le lien causal introduit par ὅτι. Toutefois, « les connaîtront eux-mêmes » déplace l’emphase de αὐτοί : le grec souligne les auteurs des actes (« eux, ils les connaîtront »), plutôt que la connaissance personnelle ou intrinsèque des actes.'
  naturalness: « Au septième » est plus idiomatique en français que « dans le septième » tout en maintenant exactement l’ellipse du substantif. La reprise « ces choses » / « les » conserve une formulation naturelle sans spécifier la nature des actes.
  terminology: « Souillure » convient à μιασμός et préserve sa possible dimension morale, rituelle ou cultuelle. « Ceux qui commettent ces choses » rend οἱ ποιοῦντες αὐτά sans introduire une qualification doctrinale ou une précision absente du texte.
  issues:
  - severity: medium
    issue: Placement de l’emphase dans « les connaîtront eux-mêmes »
    rationale: 'αὐτοί est un pronom emphatique sujet : il met en relief « ceux qui font ces choses ». En français, « les connaîtront eux-mêmes » se lit plus spontanément comme si « eux-mêmes » qualifiait l’objet connu ou le mode de connaissance. Il vaut mieux l’omettre, l’emphase restant suffisamment portée par le sujet explicite, ou la placer sur le sujet.'
  - severity: low
    issue: « dans le septième » est peu idiomatique
    rationale: Le grec est elliptique, mais le français peut préserver cette ellipse plus naturellement par « au septième ».
