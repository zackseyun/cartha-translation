  text: Ὁ δὲ τρίτος ἱερεὺς²⁵ λύπῃ παραληφθήσεται²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/004.yaml
  text: But the third priest will be taken away with grief.
translation:
  language: fr
  text: Mais le troisième prêtre sera enlevé au milieu du chagrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sera enlevé dans la douleur » ou « sera emmené avec chagrin ». Le datif grec peut exprimer la circonstance, le moyen ou la cause; le verbe peut signifier être pris, emmené ou enlevé.'
    reason: Le grec λύπῃ παραληφθήσεται ne précise ni la nature de ce qui arrive au prêtre ni le rapport exact entre son enlèvement et le chagrin.
lexical_decisions:
- source_word: ἱερεὺς
  choice: prêtre
  rationale: Équivalent direct et naturel du nom grec désignant celui qui exerce la fonction sacerdotale.
- source_word: παραληφθήσεται
  choice: sera emporté
  rationale: Le futur passif exprime le fait d’être pris ou emmené. « Sera emporté » restitue cette idée en français courant sans préciser indûment la nature de l’événement.
- source_word: λύπῃ
  choice: dans le chagrin
  rationale: Le datif peut exprimer la circonstance ou le moyen. Cette formulation conserve le lien avec le chagrin sans affirmer avec certitude qu’il constitue la cause directe.
theological_decisions:
- issue: Nature de ce qui arrive au troisième prêtre
  choice: Ne pas préciser s’il s’agit de la mort, d’une destitution ou d’un enlèvement.
  alternative: « mourra de chagrin » ou « sera destitué dans le chagrin »
  rationale: Le grec ne définit pas explicitement l’événement; une précision supplémentaire résoudrait abusivement son ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La phrase brève suit la structure du grec tout en conservant l’ambiguïté entourant le sort du troisième prêtre.
