  naturalness: Le français est moderne et lisible. « Dans sa plénitude avec le Seigneur » reste légèrement marqué, mais cela est justifié par la formulation grecque elle-même, inhabituelle, et rend mieux ses deux composantes que « rempli du Seigneur ».
  terminology: « Jubilé », « sacerdoce », « onction » et « salut » conviennent au registre et au contexte. « Se lèvera » conserve prudemment la polysémie de ἀναστήσεται.
