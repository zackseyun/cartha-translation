id: T12P.LEV.17.2
reference: Testament of Levi 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: fr
  text: Car à chaque jubilé correspondra un sacerdoce. Et, au premier jubilé, celui qui recevra le premier l’onction pour le sacerdoce sera grand et parlera à Dieu comme à un père. Son sacerdoce sera dans sa plénitude avec le Seigneur. [Et, aux jours de sa joie, il se lèvera pour le salut du monde.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition entre crochets est textuellement incertaine dans la tradition grecque. Le verbe traduit par « se lèvera » peut aussi signifier « surgira » ou « ressuscitera ».
    reason: Indique explicitement que les crochets signalent l’incertitude textuelle et conserve l’ambiguïté significative de ἀναστήσεται.
lexical_decisions:
- source_word: Καθ’ ἕκαστον ... ἰωβηλαῖον
  choice: à chaque jubilé
  rationale: Rend naturellement la valeur distributive de la préposition κατά sans alourdir la phrase.
- source_word: ἱερωσύνη
  choice: sacerdoce
  rationale: Désigne ici l’institution ou la dignité sacerdotale, plutôt que le seul groupe des prêtres.
- source_word: ὁ χριόμενος πρῶτος
  choice: celui qui recevra le premier l’onction
  rationale: Préserve l’idée d’une onction reçue et l’ambiguïté de πρῶτος, qui peut porter sur la priorité de la personne ou de l’acte.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: parlera à Dieu comme à un père
  rationale: Traduction directe qui conserve la comparaison, sans transformer « comme à un père » en affirmation ontologique.
- source_word: πλήρης μετὰ κυρίου
  choice: rempli du Seigneur
  rationale: Le grec transmis est inhabituel. Cette formulation française garde l’image de plénitude et le lien avec le Seigneur sans imposer « complet » ni une paraphrase doctrinale.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: pour le salut du monde
  rationale: Rend la valeur finale ou orientée vers un but de ἐπί avec le datif dans ce contexte.
- source_word: ἀναστήσεται
  choice: il se lèvera
  rationale: Conserve la polysémie du verbe, qui peut évoquer le fait de se lever, de surgir ou de ressusciter, sans trancher explicitement.
theological_decisions:
- issue: Sens de ἀναστήσεται
  choice: il se lèvera
  alternative: il ressuscitera / il surgira
  rationale: Le contexte peut recevoir une lecture eschatologique, mais le verbe demeure lexicalement ambigu; la traduction retenue ne décide pas à la place du texte.
- issue: Relation exprimée par πλήρης μετὰ κυρίου
  choice: Son sacerdoce sera rempli du Seigneur
  alternative: Son sacerdoce sera pleinement avec le Seigneur
  rationale: La leçon grecque est syntaxiquement difficile. Le choix suit πλήρης de près tout en évitant d’introduire une notion confessionnelle absente du texte.
- issue: Statut de la dernière proposition
  choice: maintien entre crochets avec note textuelle
  alternative: intégration sans crochets / omission
  rationale: Les crochets de l’édition signalent une incertitude textuelle réelle qui doit rester visible dans le texte publié.
translation_notes:
  register: Français international moderne, digne et lisible. « Jubilé », « sacerdoce » et « onction » sont conservés comme termes historiques et religieux nécessaires. La syntaxe est légèrement segmentée pour la clarté, sans effacer les connecteurs du grec ni ses tensions textuelles.
