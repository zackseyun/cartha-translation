  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: fr
  text: '**Testament de Lévi 7**


    Je dis à mon père Jacob : « En toi, le Seigneur réduira à néant les Cananéens, et il donnera leur terre à toi et à ta descendance après toi. Car, dès aujourd’hui, la ville appelée Sykem[a] sera une ville d’insensés : de même que l’on se moque d’un insensé, ainsi nous nous sommes moqués d’eux, puisqu’ils ont bel et bien commis une folie en Israël en souillant ma sœur. Puis, après avoir emmené Dina[b], nous sommes arrivés à Béthel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sykem est la forme grecque du nom plus couramment rendu en français par « Sichem ».
    reason: lexical_alternative
  - marker: b
    text: Le grec transmis est syntaxiquement difficile dans ce dernier membre. Le participe peut évoquer le fait d’emmener ou d’éloigner Dina avant le trajet vers Béthel; le lien précis entre Dina, le départ et l’arrivée n’est pas entièrement clair.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξουδενώσει
  choice: réduira à néant
  rationale: Le verbe exprime l’idée de réduire à rien ou de tenir pour rien. Dans ce contexte de conquête, « réduira à néant » conserve sa force sans préciser indûment la manière dont cela s’accomplira.
- source_word: σπέρματί
  choice: descendance
  rationale: « Descendance » rend naturellement en français moderne le sens collectif de σπέρμα dans le cadre d’une promesse patriarcale, sans perdre la dimension générationnelle de la formule.
- source_word: ἀσυνέτων
  choice: d’insensés
  rationale: Le génitif dépend de πόλις. « Une ville d’insensés » conserve le jugement moral et prépare la comparaison qui suit.
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: se moque / nous nous sommes moqués
  rationale: La répétition du même verbe français préserve l’écho lexical et la structure rhétorique du grec.
- source_word: ἀφροσύνην
  choice: une folie
  rationale: Ce terme exprime ici une conduite moralement insensée. « Folie » maintient le lien avec « insensés » sans introduire une qualification plus précise que le grec.
- source_word: μιάναντες
  choice: en souillant
  rationale: Le participe évoque une souillure morale ou religieuse. « Souillant » en garde la portée tout en évitant d’expliciter au-delà du texte.
- source_word: Ἀπάραντες … Δίναν
  choice: après avoir emmené Dina
  rationale: Dans la construction textuellement difficile du verset, cette traduction comprend le participe comme le fait d’emmener Dina avant de se rendre à Béthel. Une note signale l’incertitude.
- source_word: Σύκημα
  choice: Sykem
  rationale: Cette forme translittère le nom grec du témoin tout en restant prononçable en français; la forme française biblique plus courante est indiquée en note.
- source_word: Βεθήλ
  choice: Béthel
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
theological_decisions:
- issue: Langage de la promesse faite à Jacob concernant le pays et sa postérité
  choice: Conserver explicitement le don du pays à Jacob et à sa « descendance »
  alternative: Employer « semence » ou reformuler comme une simple prédiction de victoire
  rationale: Le grec reprend le langage des promesses patriarcales concernant le pays et σπέρμα. « Descendance » préserve cette teneur en français naturel, sans imposer une harmonisation doctrinale ultérieure.
- issue: Qualification morale de l’acte commis contre Dina
  choice: Rendre ἀφροσύνην et μιάναντες par « folie » et « souillant »
  alternative: Employer « outrage », « déshonorant » ou une formulation sexuelle plus explicite
  rationale: Le grec présente l’acte comme une folie et une souillure au sein d’Israël. La traduction conserve ce registre moral et religieux sans ajouter de détails absents du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton testamentaire et la progression argumentative du grec. « Bel et bien » rend l’insistance de καίγε sans alourdir la phrase; les noms propres suivent soit la forme grecque signalée en note (Sykem), soit la forme française consacrée (Jacob, Dina, Béthel).
