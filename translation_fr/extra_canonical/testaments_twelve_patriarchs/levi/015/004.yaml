base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: fr
  text: Et sans Abraham, Isaac et Jacob, nos pères, vous ne recevriez aucune miséricorde ; pas un seul de vos descendants ne resterait sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: sans Abraham, Isaac et Jacob
  rationale: Dans cette construction conditionnelle irréelle, διά exprime que leur présence ou leur intervention constitue le motif empêchant le jugement total ; « sans » rend cela naturellement en français.
- source_word: τῶν πατέρων ἡμῶν
  choice: nos pères
  rationale: Conserve l’apposition généalogique et honorifique du grec.
- source_word: ἔλεος λήψεσθε
  choice: vous ne recevriez aucune miséricorde
  rationale: Le futur grec se comprend dans l’apodose d’une condition irréelle ; le conditionnel français restitue cette relation. « Miséricorde » préserve le registre religieux de ἔλεος.
- source_word: εἷς ἐκ τοῦ σπέρματος ὑμῶν
  choice: pas un seul de vos descendants
  rationale: σπέρμα désigne ici la descendance collective ; « descendants » est idiomatique et évite le littéralisme obscur de « semence ».
- source_word: οὐ μὴ καταλειφθῇ ἐπὶ τῆς γῆς
  choice: ne resterait sur la terre
  rationale: La négation renforcée οὐ μή exprime une exclusion catégorique, rendue avec « pas un seul » ; le passif grec est naturellement exprimé par « rester » en français.
theological_decisions:
- issue: Rôle d’Abraham, Isaac et Jacob dans l’obtention de la miséricorde
  choice: 'Formulation causale non précisée : « sans Abraham, Isaac et Jacob »'
  alternative: « si ce n’était à cause d’Abraham, d’Isaac et de Jacob »
  rationale: Le texte attribue la miséricorde à leur égard sans expliquer s’il s’agit de leur mérite, de leur intercession ou de l’alliance. La traduction conserve cette indétermination.
translation_notes:
  register: Français moderne, clair et digne. Le conditionnel présent rend l’hypothèse contraire aux faits, tandis que le point-virgule maintient le lien étroit entre l’absence de miséricorde et l’anéantissement annoncé.
