    issue: Causalité explicitée dans « à cause de votre impureté »
    rationale: La préposition ἐν peut marquer la circonstance, la sphère ou, selon le contexte, une nuance causale. La version causale seule réduit une ambiguïté présente dans le grec. « Dans votre impureté » la conserve.
  - severity: low
    issue: Formulation française de la destination de la captivité
    rationale: « Vers toutes les nations » est compréhensible mais raide après « emmenés captifs ». « Emmenés en captivité dans toutes les nations » est idiomatique et rend la déportation vers l’ensemble des nations.
