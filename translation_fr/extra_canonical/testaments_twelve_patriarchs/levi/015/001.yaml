review_pass:
  verdict: revise
  source_fidelity: La proposition rend correctement le futur, le temple et la captivité. Toutefois, « à cause de votre impureté » tranche en faveur d’une causalité que ἐν τῇ ἀκαθαρσίᾳ ὑμῶν n’exprime pas nécessairement et dont l’ambiguïté doit être conservée.
  naturalness: Le registre est globalement naturel et digne. « Emmenés captifs vers toutes les nations » suit littéralement εἰς, mais demeure peu idiomatique en français moderne. « Emmenés en captivité dans toutes les nations » est plus naturel tout en gardant la destination et l’idée de dispersion.
  terminology: « Le Seigneur », « le temple », « désert » et « impureté » conviennent. La formulation révisée ne précise pas la nature de l’impureté et évite toute interprétation doctrinale ajoutée.
  issues:
