id: T12P.LEV.15.1
reference: Testament of Levi 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ¹ τοῦτο² *ὁ ναός³, ὃν⁴ ἐκλέξεται⁵ κύριος⁶, *ἔρημος ἔσται⁷ *ἐν τῇ ἀκαθαρσίᾳ ὑμῶν⁸, καὶ ὑμεῖς αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/001.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: fr
  text: C’est pourquoi le temple que le Seigneur choisira deviendra désert dans votre impureté, et vous serez emmenés en captivité dans toutes les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ναός
  choice: le temple
  rationale: Désigne le sanctuaire ou temple; « le temple » est ici la formulation française naturelle et concorde avec le contexte.
- source_word: ἔρημος ἔσται
  choice: deviendra désert
  rationale: Rend la valeur future et l’idée de désolation sans préciser davantage si elle implique destruction ou abandon.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: à cause de votre impureté
  rationale: Dans ce contexte, ἐν peut exprimer la circonstance ou la cause; cette formulation française relie naturellement la désolation à l’impureté des destinataires.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: vous serez emmenés captifs
  rationale: Exprime idiomatiquement en français le fait de devenir prisonniers à la suite d’une déportation.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: vers toutes les nations
  rationale: Préserve la direction exprimée par εἰς, plutôt que de la remplacer par une simple localisation « parmi ».
theological_decisions:
- issue: Rapport entre l’impureté du peuple et la désolation du temple
  choice: à cause de votre impureté
  alternative: dans votre impureté
  rationale: La traduction causale convient au contexte tout en évitant d’ajouter une explication doctrinale sur la nature précise de cette impureté.
- issue: Portée du choix futur du temple par le Seigneur
  choice: que le Seigneur choisira
  alternative: que le Seigneur aura choisi
  rationale: Le futur simple suit directement ἐκλέξεται et laisse intacte la tension temporelle du passage.
translation_notes:
  register: Français moderne, international et digne. Syntaxe claire, avec conservation de la tonalité prophétique et du mouvement vers les nations.
source_grounding:
  english_pob_role: consult_only
