- from: C’est pourquoi le temple que le Seigneur choisira deviendra désert à cause de votre impureté, et vous serez emmenés captifs vers toutes les nations.
  to: C’est pourquoi le temple que le Seigneur choisira deviendra désert dans votre impureté, et vous serez emmenés en captivité dans toutes les nations.
