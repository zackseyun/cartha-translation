  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: fr
  text: Et vous serez pour eux une abomination, et vous recevrez l’opprobre et une honte éternelle de la part du juste jugement de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: un objet d’abomination
  rationale: Rend le nom grec avec sa forte valeur de répulsion tout en produisant une tournure française naturelle après « vous serez ».
- source_word: ὄνειδος
  choice: l’opprobre
  rationale: Conserve le sens de déshonneur public et de reproche attaché à la personne.
- source_word: αἰσχύνην αἰώνιον
  choice: une honte éternelle
  rationale: Traduction directe qui préserve la portée durable exprimée par αἰώνιον.
- source_word: παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ
  choice: de la part du juste jugement de Dieu
  rationale: Respecte la construction de provenance avec παρά et rend δικαιοκρισία comme un jugement caractérisé par la justice.
theological_decisions:
- issue: Origine de l’opprobre et de la honte
  choice: de la part du juste jugement de Dieu
  alternative: à cause du juste jugement de Dieu
  rationale: La formulation retenue préserve au plus près la valeur de provenance de παρά sans réduire le jugement divin à une simple cause impersonnelle.
translation_notes:
  register: Français moderne, digne et soutenu sans archaïsme syntaxique. « Opprobre » est conservé pour sa précision et la solennité du contexte judiciaire.
