  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011.yaml
  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: fr
  text: '1. Lorsque je pris femme, j’avais vingt-huit ans, et elle s’appelait Melcha. 2. Elle conçut et mit au monde un fils, que j’appelai Gersam, parce que nous vivions en étrangers dans ce pays. 3. Je vis à son sujet qu’il n’était pas au premier rang. 4. Qehath naquit dans la trente-cinquième année de ma vie, vers le levant. 5. Je vis dans une vision qu’il se tenait dans les hauteurs, au milieu de toute l’assemblée. 6. C’est pourquoi je l’appelai Qehath, ce qui signifie : « commencement de grandeur et union »[a]. 7. Un troisième fils, Merari, me naquit dans la quarantième année de ma vie. Comme sa mère eut un accouchement difficile, je l’appelai Merari, ce qui signifie : « amertume ». 8. Yokébed naquit en Égypte, dans la soixante-quatrième année de ma vie, car j’étais alors honoré parmi mes frères[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’explication rattachée au nom de Qehath est textuellement difficile dans le témoin grec. La traduction suit les mots conservés sans tenter de reconstruire une formulation plus fluide.
    reason: textual_variant
  - marker: b
    text: Certains éléments du texte autour de ce verset sont condensés ou instables. L’énoncé principal affirme clairement que Yokébed naquit en Égypte dans la soixante-quatrième année de Lévi.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: je pris femme
  rationale: Cette expression française traditionnelle mais encore intelligible rend directement l’idiome grec désignant le mariage et convient au registre testamentaire.
- source_word: ἐν γῇ παροικίας ἦμεν
  choice: nous vivions en étrangers dans ce pays
  rationale: La formulation exprime la condition de résidents étrangers impliquée par παροικία, tout en restant naturelle en français et en maintenant le lien avec le nom de Gersam.
- source_word: πρώτῃ τάξει
  choice: au premier rang
  rationale: La traduction conserve l’idée de rang ou de préséance sans préciser s’il s’agit d’une hiérarchie familiale, cultuelle ou symbolique.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: au lever du soleil
  rationale: L’expression grecque signifie littéralement les levers du soleil. Sa position dans le texte la rattache ici à la naissance de Qehath plutôt qu’à la vision suivante.
- source_word: ἐν ὑψηλοῖς
  choice: dans les hauteurs
  rationale: Le pluriel substantivé évoque une position élevée, éventuellement céleste, sans imposer une interprétation cosmologique.
- source_word: συναγωγῆς
  choice: assemblée
  rationale: « Assemblée » rend le sens collectif du mot sans lui donner artificiellement une coloration institutionnelle plus tardive.
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: commencement de grandeur et union
  rationale: 'La formulation demeure proche du grec difficile : ἀρχή est rendu par « commencement », μεγαλείου par « grandeur » et συμβιβασμός par « union », sans reconstruire une étymologie plus fluide.'
- source_word: ἐδυστόκησεν
  choice: eut un accouchement difficile
  rationale: Cette formulation française claire rend précisément l’idée d’un enfantement pénible.
- source_word: πικριασμός
  choice: amertume
  rationale: Le choix conserve le sens lexical simple et la valeur explicative donnée au nom de Merari.
- source_word: ἔνδοξος
  choice: honoré
  rationale: Dans ce contexte relationnel, le terme indique que Lévi jouissait d’honneur ou de considération parmi ses frères; « honoré » est plus naturel que « illustre » sans ajouter un sens théologique.
theological_decisions:
- issue: Portée de l’évaluation visionnaire de Gersam et de Qehath
  choice: La traduction rapporte simplement leur rang ou leur position tels que Lévi les perçoit, sans expliciter une future hiérarchie sacerdotale.
  alternative: Interpréter ouvertement ces paroles comme une annonce de la préséance cultuelle des descendants de Qehath.
  rationale: Le grec suggère une différence de rang, mais ne développe pas ici sa portée historique ou sacerdotale; l’ambiguïté doit donc être conservée.
- issue: Nature des « hauteurs » dans la vision
  choice: Conserver l’expression spatiale et élevée « dans les hauteurs ».
  alternative: Préciser « dans les cieux » ou comprendre seulement une place d’honneur au sein de l’assemblée.
  rationale: Le texte permet une lecture céleste ou symbolique, mais ne tranche pas explicitement entre elles.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère tonalité biblique. Les noms propres suivent une translittération française lisible et, pour Qehath et Yokébed, les formes bibliques françaises courantes. La syntaxe conserve les enchaînements sobres du récit grec sans multiplier les « et » lorsqu’ils alourdiraient inutilement le français.
