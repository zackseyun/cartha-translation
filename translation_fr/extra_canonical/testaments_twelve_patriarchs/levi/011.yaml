  verdict: revise
  source_fidelity: Révision nécessaire en 11.3 et 11.4. Le présent grec οὐκ ἔστιν appelle « n’est pas », non un futur (« ne serait pas »). En 11.4, πρὸς ἀνατολὰς ἡλίου est directionnel (« vers le levant / vers l’est »), non temporel (« au lever du soleil »). La répartition de la naissance en v. 4 et de la vision en v. 5 respecte le grec et doit être conservée.
  naturalness: Le français est globalement fluide, sobre et adapté à un registre biblique moderne. « Vers le levant » est à la fois naturel dans ce registre et plus fidèle que « au lever du soleil ».
  terminology: « Qehath », « Yokébed », « assemblée », « hauteurs », « amertume » et « honoré » sont recevables. « Union » rend avec prudence συμβιβασμός dans la glose textuellement difficile; la note doit donc être maintenue. Les ancres [a] en 11.6 et [b] en 11.8 correspondent bien à leurs notes.
