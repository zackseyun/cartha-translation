source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: fr
  text: 'C’est pourquoi je lui donnai le nom de Qehath, [ce qui signifie : « commencement de la grandeur et union »].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition explicative figure entre crochets dans l’édition grecque utilisée, ce qui signale son statut textuel incertain ou éditorialement délimité.
    reason: Informer le lecteur de la valeur des crochets conservés dans le texte source sans prétendre résoudre la question textuelle en l’absence d’apparat critique détaillé.
lexical_decisions:
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: je lui donnai le nom de
  rationale: Expression française naturelle qui conserve l’idée sémitisante de nommer l’enfant, sans reproduire lourdement « j’appelai son nom ».
- source_word: Καάθ
  choice: Qehath
  rationale: Transcription française traditionnelle et reconnaissable du nom biblique correspondant à Kohath.
- source_word: ἀρχὴ μεγαλείου
  choice: commencement de la grandeur
  rationale: Rend directement ἀρχή et μεγαλείου, tout en conservant la portée quelque peu énigmatique de l’étymologie proposée.
- source_word: συμβιβασμός
  choice: union
  rationale: Le terme peut désigner l’action de réunir, l’union, l’accord ou la conciliation. « Union » convient ici au parallélisme nominal et n’ajoute pas un complément absent du texte grec fourni.
theological_decisions:
- issue: Portée de συμβιβασμός
  choice: union
  alternative: conciliation / réconciliation
  rationale: Le contexte immédiat ne permet pas de trancher en faveur d’une réconciliation au sens théologique. Le choix plus large « union » préserve l’ambiguïté du grec.
- issue: Statut de la glose étymologique entre crochets
  choice: maintien entre crochets
  alternative: intégration sans crochets
  rationale: Les crochets appartiennent au texte grec fourni et signalent vraisemblablement un statut textuel ou éditorial particulier; ils sont donc conservés plutôt que silencieusement supprimés.
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde le caractère ancien de l’explication du nom, tout en évitant le calque peu naturel « j’appelai son nom ». Aucun complément tel que « de tous » n’est ajouté, puisqu’il ne figure pas dans le texte grec fourni.
