  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: fr
  text: Et je vis dans une vision qu’il se tenait au milieu de toute l’assemblée, dans les hauteurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: dans une vision
  rationale: Rend directement l’expression grecque tout en conservant son caractère visionnaire.
- source_word: μέσος … πάσης τῆς συναγωγῆς
  choice: au milieu de toute l’assemblée
  rationale: « Assemblée » convient au sens général de συναγωγή sans importer automatiquement le sens institutionnel moderne de « synagogue »; πάσης est explicitement rendu par « toute ».
- source_word: ἐν ὑψηλοῖς
  choice: dans les hauteurs
  rationale: Traduction concise du pluriel substantivé, qui préserve l’indétermination du grec quant à la nature exacte de ces hauteurs.
theological_decisions:
- issue: Référent implicite du sujet de ἵστατο
  choice: qu’il se tenait
  alternative: il se tenait
  rationale: Le grec porte un sujet implicite masculin fourni par le contexte; « qu’il » l’exprime sans identifier davantage la personne.
- issue: Rapport de « dans les hauteurs » avec le reste de la scène
  choice: maintien en position finale, séparé par une virgule
  alternative: au milieu de toute l’assemblée qui se trouvait dans les hauteurs
  rationale: La syntaxe grecque est compacte et laisse ouverte la portée exacte du complément; la formulation retenue évite de décider s’il qualifie uniquement la position du personnage ou l’ensemble de la scène.
translation_notes:
  register: Français international moderne, sobre et digne. La structure reste proche du grec, avec une formulation naturelle et sans explicitation doctrinale.
