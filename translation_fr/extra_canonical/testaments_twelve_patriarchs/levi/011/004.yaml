  rationale: Rend directement l’expression chronologique grecque dans un français naturel et digne.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: du côté du soleil levant
  rationale: Conserve l’image concrète du lever du soleil et la valeur directionnelle de πρός, plutôt que de réduire l’expression au seul mot « est ».
