source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἡ δὲ Ἰωχαβέδ³⁵ *ἐγεννήθη ἐν Αἰγύπτῳ τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει³⁶, *ἔνδοξος γὰρ ἦν τότε ἐν μέσῳ τῶν ἀδελφῶν μου³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: fr
  text: Et Jokébed naquit en Égypte, dans la soixante-quatrième année de ma vie, car j’étais alors tenu en grand honneur parmi mes frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  choice: Jokébed
  rationale: Forme française biblique courante du nom propre, claire pour le lectorat moderne.
- source_word: ἐγεννήθη
  choice: naquit
  rationale: Rend directement l’aoriste passif grec employé idiomatiquement pour la naissance.
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: dans la soixante-quatrième année de ma vie
  rationale: Conserve la manière antique de compter l’âge sans la convertir de façon incertaine en « à soixante-quatre ans ».
- source_word: ἔνδοξος
  choice: tenu en grand honneur
  rationale: Exprime ici la considération et le prestige dont jouit le locuteur, plus naturellement que le calque « glorieux ».
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: parmi mes frères
  rationale: Équivalent français naturel qui conserve le cadre relationnel du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et fluide. La relation causale marquée par γάρ est maintenue, même si son lien avec la naissance de Jokébed demeure peu explicite dans ce verset.
