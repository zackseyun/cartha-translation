  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/003.yaml
  text: And I saw concerning him that he was not in the first rank.
translation:
  language: fr
  text: Et je vis, à son sujet, qu’il n’était pas au premier rang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον περὶ αὐτόν
  choice: je vis à son sujet
  rationale: Rend directement la perception introduite par εἶδον et conserve la construction inhabituelle περὶ αὐτόν sans la transformer en simple vision de la personne.
- source_word: οὐκ ἔστιν
  choice: il n’était pas
  rationale: Le présent grec peut être rendu par un imparfait français sous la dépendance du verbe de perception au passé, conformément à la concordance naturelle des temps.
- source_word: ἐν τῇ πρώτῃ τάξει
  choice: dans le premier rang
  rationale: τάξις peut désigner un rang, un ordre ou une classe. « Premier rang » préserve ici l’idée de position hiérarchique sans préciser davantage la nature du classement.
theological_decisions:
- issue: Nature du « premier rang »
  choice: Conserver l’expression non explicitée « premier rang »
  alternative: « premier ordre » ou une identification explicite d’un ordre sacerdotal ou céleste
  rationale: Le grec ne précise pas de quel classement il s’agit; une explicitation introduirait une interprétation contextuelle ou théologique absente de cette phrase.
translation_notes:
  register: Français moderne, sobre et digne. La formulation garde l’ambiguïté du grec sur la nature du rang et conserve « à son sujet », plus fidèle à περὶ αὐτόν que « je le vis ».
