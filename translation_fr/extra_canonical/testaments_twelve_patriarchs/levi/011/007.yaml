  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/007.yaml
  text: And a third son, Merari, was born to me in the fortieth year of my life; and because his mother had difficulty in childbirth, I called him Merari, which means bitterness.
translation:
  language: fr
  text: Un troisième fils, Merari, me naquit dans la quarantième année de ma vie. Comme sa mère eut un accouchement difficile, je l’appelai Merari, ce qui signifie « amertume ».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτεκέν μοι
  choice: me naquit
  rationale: Rend naturellement en français la naissance d’un fils « à » Lévi, tout en gardant celui-ci comme point de vue du récit.
- source_word: τῷ τεσσαρακοστῷ ἔτει τῆς ζωῆς μου
  choice: dans la quarantième année de ma vie
  rationale: Traduction formellement proche qui conserve le mode antique de datation par année de vie.
- source_word: ἐδυστόκησεν
  choice: eut un accouchement difficile
  rationale: Le verbe désigne le fait d’éprouver des difficultés lors de l’accouchement; cette formulation est précise et idiomatique.
- source_word: πικριασμός
  choice: amertume
  rationale: Correspond au sens du substantif grec et préserve l’explication étiologique du nom.
