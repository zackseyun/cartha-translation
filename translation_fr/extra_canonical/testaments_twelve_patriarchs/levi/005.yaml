review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire au v. 6 : le grec τοῦ μὴ πατάξαι αὐτούς emploie l’infinitif actif (« afin de ne pas les frapper »), dont le sujet le plus naturel est l’ange. Le passif français du projet (« afin qu’ils ne soient pas frappés ») change cette relation grammaticale. Les autres choix principaux rendent fidèlement le grec transmis, sans introduire les développements absents du texte source au v. 6.'
  naturalness: Le français est globalement moderne, digne et fluide. « Le saint Très-Haut » est plus idiomatique et plus nettement titulaire que « le Très-Haut saint ». « T’invoquer » rend directement ἐπικαλέσομαί σε et reste naturel dans ce registre.
  terminology: « Lévi », « Sichem », « Dina », « Hamor », « sacerdoce », « Seigneur » et « Très-Haut » sont cohérents. « Une arme et une épée » conserve à juste titre la généralité de ὅπλον. Les notes conservent prudemment les difficultés de ἐν τούτῳ, des « tablettes des pères » et du participe παραιτούμενος.
  issues:
  - severity: medium
    issue: Voix grammaticale modifiée au verset 6
    rationale: Le grec τοῦ μὴ πατάξαι αὐτούς est un infinitif actif, non une proposition passive. « Afin de ne pas les frapper » respecte la construction et laisse le rôle protecteur résulter de l’identification de l’ange, sans ajouter l’expansion de certains témoins.
  - severity: low
    issue: Ordre du titre divin au verset 1
    rationale: « Le saint Très-Haut » rend les deux termes grecs tout en produisant une désignation française plus naturelle que « le Très-Haut saint ».
  - severity: low
    issue: Rendu de ἐπικαλέσομαί σε au verset 5
    rationale: « T’invoquer » correspond plus directement à « appeler/invoquer [ton nom] » que « faire appel à toi » et convient au ton solennel.
