  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
translation:
  language: fr
  text: '5 Dans cette vision[a], l’ange m’ouvrit les portes du ciel, et je vis le saint Très-Haut assis sur un trône.


    2 Il me dit : « Lévi, c’est à toi que j’ai donné les bénédictions du sacerdoce, jusqu’à ce que je vienne habiter au milieu d’Israël. »


    3 Alors l’ange me fit redescendre sur la terre et me donna une arme et une épée. Il me dit : « Exerce la vengeance à Sichem pour Dina, ta sœur. Moi, je serai avec toi, car le Seigneur m’a envoyé. »


    4 En ce temps-là, j’exterminai les fils de Hamor, comme cela est écrit sur les tablettes des pères[b].


    5 Je lui dis : « Je t’en prie, Seigneur, apprends-moi ton nom, afin que je puisse t’invoquer au jour de la détresse. »


    6 Il dit : « Je suis l’ange qui intercède pour la descendance d’Israël, afin de ne pas les frapper. »[c]


    7 Après cela, lorsque je me réveillai, je bénis le Très-Haut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « en ceci » ; la formulation est difficile. Le contexte indique qu’il s’agit de la vision.
    reason: textual_difficulty
  - marker: b
    text: 'Littéralement : « sur les tablettes des pères ». Dans ce contexte apocalyptique, il pourrait s’agir de tablettes célestes, mais le mot « célestes » n’apparaît pas dans le texte grec conservé.'
    reason: lexical_alternative
  - marker: c
    text: Le grec de ce verset est difficile, tant par son vocabulaire que par sa transmission. Certains témoins développent la fin du passage pour préciser que l’ange protège Israël d’une destruction complète et des esprits mauvais ; ces mots ne figurent pas dans le texte grec donné ici.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dans cette vision
  rationale: Le démonstratif est elliptique et textuellement signalé comme difficile. Le contexte immédiat est celui d’une expérience visionnaire; « cette vision » donne en français un antécédent naturel sans prétendre résoudre définitivement la formulation grecque.
- source_word: τὸν ἅγιον ὕψιστον
  choice: le Très-Haut saint
  rationale: Conserve les deux éléments du titre grec, avec « Très-Haut » comme désignation divine et « saint » comme qualificatif, dans un ordre naturel en français.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: les bénédictions du sacerdoce
  rationale: Maintient explicitement le rapport génitival entre les bénédictions et la fonction sacerdotale.
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: jusqu’à ce que je vienne habiter au milieu d’Israël
  rationale: Rend naturellement le participe associé au verbe conjugué tout en maintenant la première personne et la portée temporelle de ἕως.
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: une arme et une épée
  rationale: ὅπλον a ici un sens large et ne permet pas d’imposer « bouclier »; « arme » préserve cette généralité, tandis que ῥομφαία est rendue par « épée ».
- source_word: Ποίησον ἐκδίκησιν
  choice: Exerce la vengeance
  rationale: Préserve la force impérative et la dimension rétributive de ἐκδίκησις sans l’adoucir en simple réparation judiciaire.
- source_word: συνετέλεσα
  choice: j’exterminai
  rationale: Dans le contexte de l’action violente menée contre les fils de Hamor, le verbe exprime le fait de les mener à leur fin.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: sur les tablettes des pères
  rationale: Suit le grec conservé sans ajouter « célestes », qualification plausible dans le contexte apocalyptique mais non exprimée.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: au jour de la détresse
  rationale: Conserve l’idiome singulier et le registre solennel tout en restant naturel en français.
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: l’ange qui intercède pour la descendance d’Israël
  rationale: παραιτούμενος est difficile, mais la proposition finale qui suit favorise l’idée d’une médiation protectrice. « Descendance » rend le collectif γένος sans connotation biologique moderne de « race ».
- source_word: ἔξυπνος γενόμενος
  choice: lorsque je me réveillai
  rationale: Expression française naturelle pour l’idiome participial marquant le réveil après la vision.
theological_decisions:
- issue: Identité du locuteur au verset 2
  choice: 'Maintien du discours à la première personne : « jusqu’à ce que je vienne habiter »'
  alternative: Comprendre que l’ange parle uniquement comme représentant de Dieu, ou voir ici une transition textuelle entre parole divine et parole angélique.
  rationale: Le texte fait voir le Très-Haut sur son trône puis introduit une parole sans identifier clairement un nouveau locuteur. La traduction conserve cette tension au lieu de transformer la parole en discours indirect.
- issue: Nature des « tablettes des pères »
  choice: Traduction littérale « tablettes des pères », avec explication en note
  alternative: « tablettes célestes des pères » ou simples archives ancestrales terrestres
  rationale: Le contexte apocalyptique rend probable une référence à des tablettes célestes, mais l’adjectif « célestes » ne figure pas dans le texte grec transmis.
- issue: Fonction de l’ange au verset 6
  choice: Intercesseur protecteur de la descendance d’Israël
  alternative: Ange qui écarte, récuse ou protège Israël d’une manière non précisément définie
  rationale: Le participe est lexicalement et textuellement difficile. La proposition finale « afin qu’ils ne soient pas frappés » indique néanmoins une fonction protectrice, sans justifier l’ajout dans le corps du texte des expansions absentes de la source fournie.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit visionnaire conserve un ton solennel sans archaïsmes inutiles. Les ambiguïtés relatives au locuteur divin, aux tablettes et au rôle de l’ange sont maintenues ou signalées en note plutôt que résolues par des ajouts.
