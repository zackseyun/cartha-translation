  text: And the fifth gave me a branch of a rich olive tree.
translation:
  language: fr
  text: Le cinquième me donna un rameau d’un olivier fertile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: Le cinquième
  rationale: Rend directement l’adjectif ordinal substantivé, dont le référent masculin ressort du contexte.
- source_word: κλάδον
  choice: un rameau
  rationale: « Rameau » convient au registre digne du passage et désigne naturellement une branche d’olivier.
- source_word: ἐλαίας
  choice: d’un olivier
  rationale: Le génitif désigne ici l’arbre dont provient le rameau; cette formulation est plus naturelle que « rameau d’olive » en français.
- source_word: πιότητος
  choice: vigoureux
  rationale: Le génitif de qualité évoque littéralement la graisse ou l’abondance, et, appliqué à un olivier, sa vigueur et sa richesse. « Vigoureux » restitue naturellement cette idée sans suggérer que le rameau est huileux.
