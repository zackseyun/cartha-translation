  text: And the first anointed me with holy oil and gave me a priestly staff.
translation:
  language: fr
  text: Et le premier m’oignit d’huile sainte et me donna un bâton.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλειψέ με ἐλαίῳ ἁγίῳ
  choice: m’oignit d’huile sainte
  rationale: Rend directement le geste d’onction et le caractère sacré de l’huile, dans un français biblique actuel et naturel.
- source_word: ῥάβδον
  choice: un bâton
  rationale: Le grec désigne un bâton ou une verge sans préciser explicitement qu’il est sacerdotal. « Bâton » conserve cette amplitude sémantique sans ajouter l’interprétation contextuelle de la version anglaise.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Conserve la référence ordinale du grec sans expliciter l’identité du personnage, qui dépend du contexte précédent.
theological_decisions:
- issue: Caractère sacerdotal du bâton
  choice: Ne pas ajouter « sacerdotal » dans le texte
  alternative: « un bâton sacerdotal »
  rationale: Même si le contexte peut suggérer un insigne sacerdotal, ῥάβδον seul ne porte pas cette précision. La traduction préserve donc l’ambiguïté du texte grec.
translation_notes:
  register: Style narratif simple, digne et légèrement biblique. L’emploi de « oindre » est courant dans le registre scripturaire français et convient à une scène d’investiture sacrée.
