  text: Quant au deuxième, il appartiendra au sacerdoce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ δεύτερος
  choice: Quant au deuxième
  rationale: La tournure détache le deuxième élément et rend naturellement en français la particule δέ, qui marque ici une transition ou un contraste léger.
- source_word: ἔσται ἐν ἱερωσύνῃ
  choice: il appartiendra au sacerdoce
  rationale: Cette formulation française naturelle conserve l’idée d’être dans l’état ou la fonction sacerdotale, sans réduire explicitement l’expression au simple titre « il sera prêtre ».
theological_decisions:
- issue: Sens de ἱερωσύνη
  choice: sacerdoce
  alternative: prêtrise
  rationale: « Sacerdoce » désigne clairement l’état ou la fonction sacerdotale et correspond au substantif abstrait grec. « Prêtrise » serait également possible, mais convient moins bien après « appartenir à ».
translation_notes:
  register: Français moderne, sobre et digne. La formulation évite le calque peu idiomatique « être dans le sacerdoce » tout en préservant la référence à l’état ou à la fonction sacerdotale.
