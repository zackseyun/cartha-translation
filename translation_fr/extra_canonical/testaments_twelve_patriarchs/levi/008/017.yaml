source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: fr
  text: Parmi eux, il y aura des prêtres, des juges et des scribes ; et sur leur bouche, ce qui est saint sera reçu[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette proposition est incertain ; littéralement : « sur leur bouche, ce qui est saint sera reçu » (ou « pris »). La relation exprimée par « sur leur bouche » demeure difficile à préciser.'
    reason: Le verbe ληφθήσεται est marqué comme douteux dans l’édition, et ἐπὶ στόματος αὐτῶν admet une relation syntaxique et sémantique incertaine.
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: parmi eux
  rationale: Rend naturellement l’idée d’origine au sein du groupe, sans préciser davantage le lien que le grec ne le fait.
- source_word: ἱερεῖς καὶ κριταὶ καὶ γραμματεῖς
  choice: des prêtres, des juges et des scribes
  rationale: Correspondances françaises directes, traditionnelles et compréhensibles pour ces trois fonctions.
- source_word: ἐπὶ στόματος αὐτῶν
  choice: par leur bouche
  rationale: Conserve l’image corporelle du grec et l’idée que la transmission ou la réception passe par leur parole.
- source_word: τὸ ἅγιον
  choice: ce qui est saint
  rationale: Le neutre substantivé reste indéterminé ; cette formulation évite de l’identifier sans preuve à une chose, un lieu ou un enseignement précis.
- source_word: ληφθήσεται
  choice: sera reçu
  rationale: Rend le futur passif de λαμβάνω tout en conservant la construction difficile du texte transmis.
theological_decisions:
- issue: Référent de τὸ ἅγιον
  choice: ce qui est saint
  alternative: la chose sainte / le sanctuaire
  rationale: Le grec ne précise pas le référent. Une expression ouverte préserve l’ambiguïté au lieu d’imposer une interprétation cultuelle particulière.
translation_notes:
  register: Français moderne, digne et accessible. La coordination répétée du grec est légèrement allégée selon l’usage français, tandis que l’image « par leur bouche » et l’indétermination de « ce qui est saint » sont maintenues. Le guillemet fermant conserve l’indication contextuelle selon laquelle le verset achève un discours cité.
