id: T12P.LEV.8.14
reference: Testament of Levi 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: fr
  text: Et le troisième sera appelé d’un nom nouveau[a], car un roi se lèvera de Juda et établira un sacerdoce nouveau, selon le modèle des nations, pour toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « recevra un nom nouveau ».'
    reason: La construction grecque ἐπικληθήσεται αὐτῷ ὄνομα καινόν peut se rendre de manière idiomatique comme l’attribution d’un nouveau nom.
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: sera appelé d’un nom nouveau
  rationale: Rend directement la construction grecque, dont le sens est qu’un nom nouveau lui sera attribué, tout en restant naturel en français.
- source_word: βασιλεὺς … Ἰούδα ἀναστήσεται
  choice: un roi se lèvera de Juda
  rationale: Préserve le verbe ἀναστήσεται et l’origine indiquée par Ἰούδα sans préciser davantage la relation à Juda.
- source_word: ποιήσει ἱερατείαν νέαν
  choice: établira un sacerdoce nouveau
  rationale: Le littéral « fera un sacerdoce nouveau » serait maladroit; « établira » exprime naturellement l’action institutionnelle de ποιήσει dans ce contexte.
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: selon le modèle des nations
  rationale: Conserve le sens formel de τύπος (« modèle, type ») et l’ambiguïté de ἐθνῶν, sans expliquer si les nations fournissent le modèle ou en sont autrement la référence.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: pour toutes les nations
  rationale: Rend la destination ou la portée exprimée par εἰς, en distinguant cette expression de la précédente.
theological_decisions:
- issue: Rapport entre le sacerdoce nouveau et « les nations »
  choice: selon le modèle des nations, pour toutes les nations
  alternative: selon le modèle destiné aux nations / à la manière des nations
  rationale: La formulation retenue maintient la tension du grec entre κατὰ τὸν τύπον τῶν ἐθνῶν et εἰς πάντα τὰ ἔθνη, sans harmonisation théologique ni clarification conjecturale.
- issue: Identification du roi issu de Juda
  choice: un roi se lèvera de Juda
  alternative: le Roi se lèvera de Juda / un roi descendant de Juda se lèvera
  rationale: Le texte ne nomme pas explicitement ce roi et n’impose ni majuscule interprétative ni précision généalogique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en évitant les calques maladroits. « Sacerdoce » est conservé comme terme religieux courant et précis.
