base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: fr
  text: 'Chacun d’eux portait quelque chose ; ils déposèrent sur moi ce qu’ils portaient et me dirent : « À partir de maintenant, deviens prêtre, toi et toute ta descendance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες ἦσαν
  choice: portait
  rationale: La périphrase grecque indique que chacun était en train de porter quelque chose. Le complément n’étant pas exprimé, « quelque chose » le restitue sans identifier indûment les objets.
- source_word: ἐπέθηκαν μοι
  choice: ils le posèrent sur moi
  rationale: Rend le geste concret de placer sur la personne ; le pronom « le » reprend collectivement ce que chacun portait, avec une légère explicitation nécessaire en français.
- source_word: γενοῦ εἰς ἱερέα
  choice: deviens prêtre
  rationale: Formulation française naturelle qui conserve la valeur impérative et l’entrée dans la fonction sacerdotale.
- source_word: πᾶν τὸ σπέρμα σου
  choice: toute ta descendance
  rationale: « Descendance » exprime ici naturellement le sens collectif de σπέρμα en français moderne, sans le détour physiologique que pourrait évoquer « semence ».
theological_decisions:
- issue: Portée du sacerdoce sur Lévi et sa lignée
  choice: « toi et toute ta descendance » est coordonné à l’ordre de devenir prêtre
  alternative: Comprendre la descendance comme une simple mention secondaire ou limiter implicitement la déclaration à certains descendants
  rationale: La syntaxe grecque associe explicitement Lévi et toute sa descendance à la déclaration, sans fournir ici de restriction ; la traduction conserve cette portée sans développer une doctrine sacerdotale.
translation_notes:
  register: Français moderne, clair et digne. Le point-virgule évite une coordination trop lourde. Aucune note n’est requise, car les ambiguïtés mineures peuvent être rendues directement dans le texte.
