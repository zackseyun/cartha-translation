base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: fr
  text: Et le deuxième me lava avec l’eau pure du Seigneur, me donna à manger du pain et du vin saints, et me revêtit d’une robe sainte et glorieuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: Rend directement l’adjectif ordinal substantivé, qui renvoie au deuxième personnage de la séquence.
- source_word: ἔλουσέ με
  choice: me lava
  rationale: Le verbe λούω désigne ici l’action de laver; le passé simple convient au registre narratif et solennel.
- source_word: ὕδατι κυρίου καθαρῷ
  choice: avec l’eau pure du Seigneur
  rationale: Conserve le génitif κυρίου sans préciser s’il indique la possession, la provenance ou une relation sacrée.
- source_word: ἐψώμισέν με
  choice: me donna à manger
  rationale: Exprime naturellement en français l’action de nourrir quelqu’un ou de lui donner de la nourriture.
- source_word: ἄρτον καὶ οἶνον ἅγιον
  choice: du pain et du vin saints
  rationale: L’adjectif singulier ἅγιον peut, dans cette construction, qualifier l’ensemble coordonné; le pluriel français fait porter la sainteté sur le pain comme sur le vin, conformément au sens probable et à la consultation anglaise.
- source_word: περιέθηκε μοι στολὴν
  choice: me revêtit d’une robe
  rationale: Rend idiomatiquement l’idée de placer un vêtement autour de quelqu’un; «robe» traduit στολή dans son sens de vêtement long et distinctif.
- source_word: ἁγίαν καὶ ἔνδοξον
  choice: sainte et glorieuse
  rationale: Préserve les deux qualificatifs de la robe sans explicitation théologique.
theological_decisions:
- issue: Portée sacramentelle possible du lavage, du pain et du vin
  choice: Traduction littéraire directe sans vocabulaire rituel ajouté
  alternative: Employer «baptisa» ou «communion»
  rationale: Le grec décrit un lavage et un repas de pain et de vin saints, mais ne nomme explicitement aucun rite chrétien; la traduction conserve cette tension sans l’interpréter.
- issue: Relation exprimée par «κυρίου»
  choice: «du Seigneur»
  alternative: «venant du Seigneur» ou «consacrée au Seigneur»
  rationale: Le génitif grec reste ouvert; la formulation retenue maintient cette ambiguïté.
translation_notes:
  register: Français moderne, international et dignifié. Le passé simple soutient la narration solennelle; la syntaxe reste fluide et accessible. Aucun marqueur de note n’est nécessaire.
