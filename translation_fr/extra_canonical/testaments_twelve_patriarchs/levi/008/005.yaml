  text: '*Καὶ ὁ³³ δεύτερος ἔλουσέ³⁴ με³⁵ ὕδατι κυρίου καθαρῷ³⁶, καὶ ἐψώμισέν³⁷ με³⁸ *ἄρτον καὶ οἶνον³⁹ ἅγιον⁴⁰ καὶ περιέθηκε⁴¹ μοι στολὴν ἁγίαν⁴² καὶ ἔνδοξον.'
