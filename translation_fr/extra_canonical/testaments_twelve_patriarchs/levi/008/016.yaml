- from: Ainsi, tout ce qui est désirable en Israël sera pour toi et pour ta descendance ; vous mangerez tout ce qui est beau à voir, et ta descendance répartira ce qui est sur la table du Seigneur.
  to: Ainsi, tout ce qui est désirable en Israël sera pour toi et pour ta descendance ; vous mangerez tout ce qui est beau à voir, et ta descendance répartira la table du Seigneur.
  rationale: La seule correction nécessaire supprime l’ajout interprétatif « ce qui est sur ». Le maintien de l’alternance entre « toi », « vous » et « ta descendance » reflète la formulation grammaticale du grec fourni. La traduction conserve « beau à voir » selon ἐν ὁράσει, plutôt que l’anglais audité qui paraît dépendre d’une leçon différente.
  reviewer_model: gpt-5.6-terra
