source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: fr
  text: Ainsi, tout ce qui est désirable en Israël sera pour toi et pour ta descendance ; vous mangerez tout ce qui est beau à voir, et ta descendance répartira la table du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: ce qui est désirable
  rationale: Rend la valeur générale de l’adjectif substantivé sans la réduire aux biens matériels.
- source_word: σπέρμα
  choice: descendance
  rationale: Équivalent français naturel pour la postérité collective, plus clair ici que le calque « semence ».
- source_word: ἔδεσθε
  choice: vous mangerez
  rationale: Le verbe est à la deuxième personne du pluriel dans le texte grec fourni ; la traduction conserve cette forme plutôt que d’attribuer explicitement l’action à la seule descendance.
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: tout ce qui est beau à voir
  rationale: Expression française naturelle qui conserve le rapport explicite à la vue ; le texte fourni lit ὁράσει, non δράσει.
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  choice: répartira ce qui est sur la table du Seigneur
  rationale: Évite l’étrangeté de « répartir la table » tout en conservant l’idée de distribuer ou partager son contenu.
theological_decisions:
- issue: Portée de la promesse faite à Lévi et à sa descendance
  choice: Conserver l’alternance entre « toi », « vous » et « ta descendance »
  alternative: Harmoniser tous les verbes en faisant de la descendance le seul sujet
  rationale: La formulation grecque fournie passe du singulier à un verbe pluriel, puis nomme explicitement la descendance ; cette tension grammaticale ne doit pas être silencieusement résolue.
- issue: Sens cultuel de « la table du Seigneur »
  choice: Garder l’expression sans l’identifier davantage
  alternative: Préciser qu’il s’agit des offrandes, des sacrifices ou du service sacerdotal
  rationale: Le contexte peut être cultuel, mais le verset ne donne pas lui-même cette explicitation.
translation_notes:
  register: Français moderne, international et digne. La traduction suit prioritairement le grec fourni. Elle ne reprend pas la révision anglaise mentionnant « in action », car cette révision suppose ἐν δράσει tandis que la source grecque affichée porte ἐν ὁράσει (« à la vue »).
