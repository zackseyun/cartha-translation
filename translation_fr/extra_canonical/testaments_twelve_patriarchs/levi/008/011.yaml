id: T12P.LEV.8.11
reference: Testament of Levi 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: fr
  text: 'Et ils me disent : « Lévi, ta descendance sera répartie en trois divisions[a], comme signe de la gloire du Seigneur qui vient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens donné au mot grec : « trois fonctions », « trois autorités » ou « trois commencements ».'
    reason: Le nom ἀρχάς est polysémique et son sens précis dans ce passage n’est pas certain.
lexical_decisions:
- source_word: λέγουσι
  choice: ils me disent
  rationale: Le présent grec est conservé, conformément au récit visionnaire au présent.
- source_word: τὸ σπέρμα σου
  choice: ta descendance
  rationale: « Descendance » exprime naturellement en français le sens collectif de σπέρμα sans le littéralisme ambigu de « semence ».
- source_word: εἰς τρεῖς ἀρχὰς διαιρεθήσεται
  choice: sera répartie en trois divisions
  rationale: Cette formulation rend l’idée de division en trois ensembles tout en évitant la répétition lourde « divisée en trois divisions ». Le sens précis de ἀρχάς demeure incertain et est signalé en note.
- source_word: εἰς σημεῖον
  choice: comme signe
  rationale: 'Dans ce contexte prédicatif, εἰς indique ce que cette répartition constituera : un signe.'
- source_word: Κυρίου ἐπερχομένου
  choice: du Seigneur qui vient
  rationale: Le participe présent ἐπερχομένου qualifie naturellement « Seigneur » et conserve la perspective de sa venue.
theological_decisions:
- issue: Nature des « trois » désignées par ἀρχάς
  choice: trois divisions
  alternative: trois fonctions / trois autorités / trois commencements
  rationale: Le grec ἀρχή possède plusieurs sens possibles. « Divisions » reste neutre dans ce contexte et évite d’imposer une structure institutionnelle ou ecclésiastique précise.
- issue: Rapport entre la gloire et la venue du Seigneur
  choice: la gloire du Seigneur qui vient
  alternative: la gloire de la venue du Seigneur
  rationale: La syntaxe grecque rattache directement le participe ἐπερχομένου à Κυρίου. La traduction retenue préserve cette construction sans assimiler explicitement la gloire à la venue elle-même.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le présent de la vision et emploie « descendance » dans son sens collectif. La note rend visible l’ambiguïté lexicale centrale sans introduire d’interprétation confessionnelle.
