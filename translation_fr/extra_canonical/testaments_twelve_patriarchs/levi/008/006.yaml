  text: And the third put on me a linen garment, like an ephod.
translation:
  language: fr
  text: Le troisième me revêtit d’un vêtement de lin, semblable à un éphod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: un vêtement de lin
  rationale: L’adjectif substantivé au féminin désigne ici une pièce de vêtement en lin fin; « vêtement de lin » est naturel en français et évite de préciser sans preuve le type exact d’habit.
- source_word: περιέθηκεν
  choice: me revêtit de
  rationale: Le verbe exprime l’action de placer ou d’attacher quelque chose autour d’une personne; dans ce contexte vestimentaire, « revêtir de » restitue clairement le sens.
- source_word: ἐφούδ
  choice: éphod
  rationale: Translittération française consacrée du terme désignant le vêtement ou insigne sacerdotal, sans en imposer une identification matérielle plus précise.
theological_decisions:
- issue: Nature exacte du vêtement sacerdotal
  choice: semblable à un éphod
  alternative: comme un éphod
  rationale: « Semblable à » préserve la comparaison explicite ὁμοίαν et n’identifie pas nécessairement le vêtement de lin à l’éphod lui-même.
translation_notes:
  register: Style narratif sobre, actuel et digne. Le passé simple convient à la succession cérémonielle des actions; le terme cultuel « éphod » est conservé.
