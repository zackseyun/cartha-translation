base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: fr
  text: 'Et je vis sept hommes vêtus de blanc, qui me disaient : « Lève-toi, revêts la robe du sacerdoce, la couronne de la justice, le pectoral du discernement, la longue robe de la vérité, la plaque de la foi, le turban pour la tête et l’éphod de la prophétie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στολὴν τῆς ἱερατείας
  choice: la robe du sacerdoce
  rationale: « Robe » rend naturellement στολή comme vêtement cérémoniel, tandis que « sacerdoce » exprime l’état et la fonction sacerdotale désignés par ἱερατεία.
- source_word: λόγιον τῆς συνέσεως
  choice: le pectoral du discernement
  rationale: Dans cette liste de vêtements sacerdotaux, λόγιον désigne le pectoral plutôt qu’un oracle abstrait. « Discernement » rend σύνεσις sans le réduire au seul savoir intellectuel.
- source_word: ποδήρη τῆς ἀληθείας
  choice: la longue robe de la vérité
  rationale: ποδήρης désigne un vêtement descendant jusqu’aux pieds. « Longue robe » est clair en français courant et conserve l’image vestimentaire.
- source_word: πέταλον τῆς πίστεως
  choice: la plaque de la foi
  rationale: πέταλον renvoie à la plaque sacerdotale, vraisemblablement frontale. Le terme générique « plaque » évite d’ajouter une localisation non explicitée ici.
- source_word: μίτραν τῆς κεφαλῆς
  choice: le turban pour la tête
  rationale: « Turban » est le terme biblique naturel pour μίτρα. La formulation fonctionnelle « pour la tête » rend le grec transmis tout en évitant le français peu idiomatique « de la tête ».
- source_word: ἐφοὺδ τῆς προφητείας
  choice: l’éphod de la prophétie
  rationale: Le terme cultuel emprunté « éphod » est consacré en français biblique et préserve la référence sacerdotale précise.
theological_decisions:
- issue: Valeur de δικαιοσύνη dans « couronne de la justice »
  choice: justice
  alternative: droiture
  rationale: « Justice » conserve la polysémie traditionnelle de δικαιοσύνη, qui peut englober rectitude morale, justice et juste statut, sans trancher inutilement.
- issue: Relation des génitifs abstraits aux vêtements sacerdotaux
  choice: Maintenir les constructions « de la justice », « du discernement », « de la vérité », « de la foi » et « de la prophétie »
  alternative: Les expliciter comme qualités symbolisées ou conférées par chaque vêtement
  rationale: Le grec laisse ouverte la nature exacte de ces relations. La traduction conserve cette tension symbolique sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La cadence accumulative de la vision est conservée, avec une terminologie sacerdotale biblique compréhensible. Aucun marqueur de note n’est requis.
