source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ⁶⁸ ὁ πρῶτος κλῆρος ἔσται μέγας· καὶ ὑπὲρ αὐτὸν οὐ γενήσεται ἕτερος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/012.yaml
  text: And the first lot will be great, and no other will arise above it.
translation:
  language: fr
  text: Et le premier lot sera grand, et aucun autre ne s’élèvera au-dessus de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλῆρος
  choice: lot
  rationale: « Lot » conserve le sens de part attribuée ou de rang reçu, tout en laissant ouverte la portée précise du terme dans le contexte.
- source_word: μέγας
  choice: grand
  rationale: Traduction directe qui préserve l’évaluation positive sans la préciser davantage.
- source_word: οὐ γενήσεται ἕτερος
  choice: aucun autre ne s’élèvera
  rationale: « Aucun autre » rend explicitement ἕτερος sous la négation; « ne s’élèvera » exprime idiomatiquement γενήσεται avec le complément de supériorité qui suit.
- source_word: ὑπὲρ αὐτόν
  choice: au-dessus de lui
  rationale: Reproduit l’image comparative du grec sans la réduire à « plus grand que lui ».
theological_decisions:
- issue: Nature du « premier lot »
  choice: Conserver « lot » sans explicitation
  alternative: « première part » ou « premier ordre »
  rationale: Le verset isolé ne justifie pas de fixer la référence institutionnelle ou théologique de κλῆρος.
- issue: Type de supériorité exprimé
  choice: « au-dessus de lui »
  alternative: « plus grand que lui »
  rationale: La formulation retenue maintient l’ambiguïté entre rang, autorité et grandeur.
translation_notes:
  register: Français moderne, sobre et dignifié. La répétition de « et » suit la coordination grecque; le pronom masculin « lui » reprend naturellement « lot ».
