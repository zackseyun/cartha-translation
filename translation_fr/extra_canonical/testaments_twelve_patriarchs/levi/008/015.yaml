revisions:
- from: Et sa venue est bien-aimée, comme celle d’un prophète du Très-Haut, issu de la descendance d’Abraham, notre père.
  to: Et sa venue est aimée, comme celle d’un prophète du Très-Haut, issu de la descendance d’Abraham, notre père.
  rationale: La révision remplace seulement « bien-aimée » par « aimée », expression plus intelligible pour qualifier une venue sans affaiblir ἀγαπητή. Elle conserve « comme celle d’un prophète » afin que la comparaison porte explicitement sur la venue, et maintient l’ambiguïté compacte de la relation généalogique telle qu’elle se présente dans le grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : παρουσία désigne la venue/la manifestation, ἀγαπητή exprime qu’elle est aimée ou favorablement reçue, et la comparaison concerne un prophète du Très-Haut lié à la descendance d’Abraham. Toutefois, « issu de la descendance » est actuellement rattaché grammaticalement à « prophète », alors que la note affirme qu’il se rapporte à l’homme évoqué. Le grec compact ne justifie pas cette affirmation de référent avec certitude.'
  naturalness: '« Sa venue est bien-aimée » est grammaticalement possible, mais peu idiomatique en français moderne : « bien-aimé(e) » qualifie normalement une personne, ou s’emploie dans un registre très marqué. « Sa venue est aimée » demeure volontairement inhabituel, à l’image de la formulation grecque, mais est plus clair et plus naturel.'
  terminology: « Très-Haut », « descendance d’Abraham » et « notre père » sont appropriés. « Venue » est un rendu recevable de παρουσία et évite de trancher indûment entre présence, apparition et venue. La formulation révisée ne donne pas à « comme un prophète » une portée christologique ou doctrinale supplémentaire.
  issues:
  - severity: medium
    issue: Accord et idiomaticité de « bien-aimée » avec « venue »
    rationale: En français moderne, « bien-aimée » évoque principalement une personne aimée. Pour une venue, « aimée » rend plus directement le prédicat grec tout en conservant son caractère quelque peu insolite.
  - severity: medium
    issue: La note sur le référent de « issu de la descendance » ne correspond pas à la syntaxe française du texte
    rationale: Dans « un prophète du Très-Haut, issu... », le participe se rapporte naturellement à « prophète ». Le grec permet une construction compacte dont l’attachement ne doit pas être surinterprété.
  revised_text: Et sa venue est aimée, comme celle d’un prophète du Très-Haut, issu de la descendance d’Abraham, notre père.
  revised_footnotes: []
  revision_rationale: La révision remplace seulement « bien-aimée » par « aimée », expression plus intelligible pour qualifier une venue sans affaiblir ἀγαπητή. Elle conserve « comme celle d’un prophète » afin que la comparaison porte explicitement sur la venue, et maintient l’ambiguïté compacte de la relation généalogique telle qu’elle se présente dans le grec.
