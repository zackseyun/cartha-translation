  text: Ἡ δὲ παρουσία⁷⁹ αὐτοῦ ἀγαπητή⁸⁰ ἐστιν⁸¹ ὡς προφήτης⁸² ὑψίστου⁸³ ἐκ σπέρματος Ἀβραὰμ τοῦ⁸⁴ πατρὸς ἡμῶν⁸⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: fr
  text: Et sa venue est aimée, comme celle d’un prophète du Très-Haut, issu de la descendance d’Abraham, notre père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: venue
  rationale: Le terme désigne ici la venue ou l’apparition de la personne. « Venue » reste naturel en français tout en conservant la portée du grec, sans lui imposer d’emblée un sens technique.
- source_word: ἀγαπητή
  choice: bien-aimée
  rationale: Rend directement l’adjectif grec féminin accordé à παρουσία et conserve sa formulation inhabituelle plutôt que de la banaliser par « agréable ».
- source_word: ὡς προφήτης ὑψίστου
  choice: comme celle d’un prophète du Très-Haut
  rationale: L’ajout français de « celle » rattache clairement la comparaison à « venue » et évite de faire grammaticalement de la venue elle-même un prophète.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: issu de la descendance d’Abraham
  rationale: « Descendance » exprime idiomatiquement le sens généalogique de σπέρμα; « issu » se rapporte naturellement à l’homme évoqué.
theological_decisions:
- issue: Portée de παρουσία
  choice: venue
  alternative: apparition / présence
  rationale: Le contexte permet une venue ou manifestation. « Venue » préserve cette ouverture et évite aussi bien de réduire le terme à l’aspect visuel que de lui attribuer automatiquement un sens eschatologique technique.
- issue: Référent de « issu de la descendance d’Abraham »
  choice: l’homme évoqué par « sa »
  alternative: le prophète pris comme simple terme de comparaison
  rationale: Le grec laisse la construction assez compacte. La traduction conserve la continuité du sujet sans développer une identification théologique absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe légèrement solennelle et l’expression « bien-aimée » préservent le relief du grec; « notre père » maintient le langage ancestral du texte.
