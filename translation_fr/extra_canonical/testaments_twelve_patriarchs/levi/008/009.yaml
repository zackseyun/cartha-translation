lexical_decisions:
- source_word: Ὁ ἕκτος
  choice: Le sixième
  rationale: L’adjectif ordinal substantivé désigne le sixième personnage de la série; le masculin est conservé.
- source_word: στέφανόν
  choice: une couronne
  rationale: Équivalent naturel de στέφανος dans ce contexte de couronnement.
- source_word: μοι τῇ κεφαλῇ
  choice: sur ma tête
  rationale: Le datif possessif μοι associé à τῇ κεφαλῇ se rend idiomatiquement en français par le possessif « ma ».
- source_word: περιέθηκεν
  choice: posa
  rationale: Le verbe περιτίθημι exprime ici l’action de placer une couronne autour ou sur la tête; « posa » est naturel et fidèle au contexte.
