id: T12P.LEV.8.10
reference: Testament of Levi 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: fr
  text: Le septième posa sur moi un diadème sacerdotal et remplit mes mains d’encens, afin que j’exerce le sacerdoce au service du Seigneur Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα ἱερατείας
  choice: un diadème sacerdotal
  rationale: Expression naturelle et digne qui conserve l’image concrète du diadème ainsi que sa qualification sacerdotale.
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: remplit mes mains d’encens
  rationale: Rend littéralement l’image grecque sans la réduire à une éventuelle formule technique d’investiture.
- source_word: ἱερατεύειν
  choice: j’exerce le sacerdoce
  rationale: Exprime l’activité propre du prêtre tout en évitant le tour moins naturel « servir comme prêtre ».
- source_word: Κυρίῳ, τῷ θεῷ
  choice: pour le Seigneur Dieu
  rationale: Le datif peut indiquer le bénéficiaire ou celui au service duquel le sacerdoce est exercé; « pour » le préserve naturellement en français.
theological_decisions:
- issue: Portée de l’expression « remplir les mains »
  choice: Conserver l’image « remplit mes mains d’encens »
  alternative: Traduire comme une formule d’ordination ou de consécration sacerdotale
  rationale: Le génitif θυμιάματος précise explicitement que les mains sont remplies d’encens; il ne faut donc pas remplacer cette scène par une interprétation cultuelle plus technique.
- issue: Relation du service sacerdotal au Seigneur Dieu
  choice: « pour le Seigneur Dieu »
  alternative: « devant le Seigneur Dieu »
  rationale: Le grec emploie le datif Κυρίῳ plutôt qu’une préposition signifiant explicitement « devant »; « pour » suit plus directement la construction sans exclure l’idée de service en sa présence.
translation_notes:
  register: Français international moderne, sobre et solennel. La structure coordonnée du grec est conservée, ainsi que les images cultuelles, avec une formulation accessible.
