  text: And there again I saw a vision like the former one, after we had spent seventy days there.
translation:
  language: fr
  text: Et là encore, j’ai eu une vision semblable à la précédente, après que nous y avons passé soixante-dix jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖ πάλιν
  choice: Là encore
  rationale: Rend de façon naturelle la combinaison de « et là » avec « de nouveau », sans alourdir la phrase.
- source_word: εἶδον ὅραμα
  choice: j’ai eu une vision
  rationale: En français courant, « avoir une vision » exprime naturellement l’expérience visionnaire littéralement formulée en grec comme « voir une vision ».
- source_word: ὡς τὸ πρότερον
  choice: semblable à la précédente
  rationale: Le contexte indique que la vision est comparée à la vision antérieure; cette formulation conserve la comparaison sans imposer une identité absolue.
- source_word: μετὰ τὸ ποιῆσαι ἡμᾶς ἐκεῖ ἡμέρας ἑβδομήκοντα
  choice: après que nous y avons passé soixante-dix jours
  rationale: L’expression grecque signifie idiomatiquement passer une durée dans un lieu; la formulation française est claire et naturelle.
