source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ δὲ⁴⁷ τέταρτος ζώνην *μοι περιέβαλεν⁴⁸, ὁμοίαν πορφύρας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/007.yaml
  text: And the fourth wrapped around me a belt, like purple.
translation:
  language: fr
  text: Et le quatrième m’entoura d’une ceinture semblable à la pourpre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « semblable à une étoffe pourpre » ; le grec peut désigner la couleur, la teinture ou l’étoffe de pourpre.'
    reason: La construction grecque est concise et laisse indéterminé si la comparaison porte sur la couleur ou sur la matière.
lexical_decisions:
- source_word: ζώνην
  choice: une ceinture
  rationale: « Ceinture » est le terme français courant et précis pour désigner ce qui se porte autour du corps, sans l’archaïsme de « baudrier » ni une précision absente du grec.
- source_word: περιέβαλεν
  choice: m’entoura de
  rationale: Cette formulation conserve l’idée du geste d’envelopper ou de placer autour, portée par le verbe grec, tout en restant intelligible en français.
- source_word: πορφύρας
  choice: la pourpre
  rationale: Le grec peut évoquer la couleur pourpre, la teinture ou une étoffe pourpre. Le terme français « pourpre » préserve cette amplitude sémantique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure conserve l’image concrète du grec sans expliciter à tort la taille ni trancher entre couleur et étoffe.
