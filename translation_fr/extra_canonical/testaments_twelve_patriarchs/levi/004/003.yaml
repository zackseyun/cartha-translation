base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/003.yaml
  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: fr
  text: Tu feras briller la lumière de la connaissance en Jacob, et tu seras comme le soleil pour toute la descendance d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτιεῖς
  choice: tu feras briller
  rationale: Le verbe signifie ici faire luire ou répandre la lumière; «faire briller» conserve son caractère transitif avec «la lumière» tout en restant naturel en français.
- source_word: φῶς γνώσεως
  choice: la lumière de la connaissance
  rationale: Traduction directe du syntagme grec, qui préserve l’image de la lumière ainsi que le rapport génitif avec la connaissance.
- source_word: ἐν τῷ Ἰακώβ
  choice: en Jacob
  rationale: La formulation littérale maintient Jacob comme désignation collective du peuple, sans expliciter davantage que le grec.
- source_word: ὡς ἥλιος
  choice: comme le soleil
  rationale: Rend directement la comparaison grecque, sans la transformer en métaphore.
- source_word: παντὶ σπέρματι Ἰσραήλ
  choice: pour toute la descendance d’Israël
  rationale: «Descendance» exprime naturellement en français le sens collectif de σπέρμα, tandis que «pour» rend le datif de relation ou de bénéfice.
theological_decisions:
- issue: Portée collective de «Jacob» et de la «descendance d’Israël»
  choice: Conserver les deux désignations sans les identifier explicitement à une institution ou à un groupe ultérieur.
  alternative: Paraphraser par «au sein du peuple de Jacob» et «pour tout le peuple d’Israël».
  rationale: Le grec emploie les noms traditionnels et laisse subsister leur portée poétique et collective; une explicitation risquerait d’importer une interprétation.
translation_notes:
  register: Français moderne, digne et accessible. Le futur prophétique est conservé. La répétition des images lumineuses est maintenue, ainsi que le parallélisme des deux propositions.
