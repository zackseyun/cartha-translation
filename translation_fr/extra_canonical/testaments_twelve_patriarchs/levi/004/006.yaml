  text: Ὅτι *οἱ εὐλογοῦντες⁴⁹ †αὐτὸν⁵⁰ εὐλογημένοι⁵¹ ἔσονται⁵² *καὶ οἱ⁵³ καταρώμενοι †αὐτὸν⁵⁰ ἀπολοῦνται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/006.yaml
  text: For those who bless him will be blessed, and those who curse him will perish.
translation:
  language: fr
  text: Car ceux qui le bénissent seront bénis, et ceux qui le maudissent périront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογοῦντες / εὐλογημένοι
  choice: bénissent / bénis
  rationale: Conserve en français le jeu lexical du grec entre l’action de bénir et le fait d’être béni.
- source_word: καταρώμενοι
  choice: maudissent
  rationale: Équivalent naturel et précis du verbe grec exprimant la malédiction.
- source_word: ἀπολοῦνται
  choice: périront
  rationale: Rend le futur grec sans préciser indûment la manière ou la portée de la destruction.
theological_decisions:
- issue: Référent du pronom αὐτόν
  choice: le
  alternative: celui-ci / cet homme
  rationale: Le grec emploie un pronom masculin dont le référent dépend du contexte antérieur; le pronom français préserve cette dépendance sans l’identifier explicitement.
- issue: Portée de ἀπολοῦνται
  choice: périront
  alternative: seront détruits
  rationale: « Périront » préserve la force du terme tout en évitant de trancher entre ruine, destruction et perte eschatologique.
translation_notes:
  register: Français moderne, sobre et digne. La structure parallèle du grec est conservée, ainsi que la répétition du pronom et la correspondance entre « bénissent » et « bénis ».
