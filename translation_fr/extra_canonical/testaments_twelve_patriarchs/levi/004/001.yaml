revisions:
- from: Maintenant donc, sache que le Seigneur exercera son jugement sur les fils des hommes. Car, quand les rochers se fendent, que le soleil s’éteint, que les eaux se dessèchent, que le feu se recroqueville, que toute la création est ébranlée, que les esprits invisibles se dissolvent et que l’Hadès est dépouillé lors de la souffrance du Très-Haut[a], les hommes désobéissants persistent dans leurs injustices ; c’est pourquoi ils seront jugés dans le châtiment.
  to: Sache donc maintenant que le Seigneur exercera son jugement sur les fils des hommes. Car, quand les rochers se fendent, que le soleil s’éteint, que les eaux se dessèchent, que le feu se tapit, que toute la création est ébranlée, que les esprits invisibles fondent et que l’Hadès est dépouillé lors de la souffrance du Très-Haut[a], des hommes désobéissants persistent dans leurs injustices ; c’est pourquoi ils seront jugés et châtiés.
  rationale: La révision améliore l’idiomaticité sans modifier la portée du texte. Elle rend plus précisément l’image de καταπτήσσοντος par « se tapit », conserve la métaphore de fusion de τηκομένων par « fondent », et remplace le calque français peu naturel « jugés dans le châtiment » par « jugés et châtiés ». La proposition entre crochets de l’édition est conservée avec sa note d’incertitude, sans trancher son statut textuel ni lui imposer une lecture doctrinale.
