  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: fr
  text: Sache donc maintenant que le Seigneur exercera son jugement sur les fils des hommes. Car, quand les rochers se fendent, que le soleil s’éteint, que les eaux se dessèchent, que le feu se tapit, que toute la création est ébranlée, que les esprits invisibles fondent et que l’Hadès est dépouillé lors de la souffrance du Très-Haut[a], des hommes désobéissants persistent dans leurs injustices ; c’est pourquoi ils seront jugés et châtiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « lors de la souffrance du Très-Haut » est textuellement incertaine dans la tradition grecque et pourrait être une expansion plus tardive ; elle est traduite ici parce qu’elle figure dans le texte témoin fourni.
    reason: textual_variant
lexical_decisions:
- source_word: γίνωσκε
  choice: sache
  rationale: L’impératif présent appelle une prise de conscience directe ; « sache » est naturel, digne et proche de la forme grecque.
- source_word: ποιήσει Κύριος κρίσιν
  choice: le Seigneur exercera son jugement
  rationale: Cette formulation rend l’expression sémitisante « faire un jugement » en français naturel sans réduire κρίσις à une simple condamnation.
- source_word: υἱοὺς τῶν ἀνθρώπων
  choice: les fils des hommes
  rationale: Conserve l’expression anthropologique traditionnelle du grec plutôt que de la neutraliser en « les humains ».
- source_word: καταπτήσσοντος
  choice: se recroqueville
  rationale: Le verbe évoque le fait de se tapir ou de se recroqueviller sous l’effet de la peur ; ce choix conserve l’image inhabituelle appliquée au feu.
- source_word: τηκομένων
  choice: se dissolvent
  rationale: Rend l’idée de fondre ou de se liquéfier dans un registre adapté aux esprits, tout en préservant l’étrangeté apocalyptique de l’image.
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: l’Hadès est dépouillé
  rationale: « Hadès » désigne ici le séjour des morts ; « dépouillé » traduit le pillage exprimé par σκυλεύω sans l’assimiler silencieusement à l’enfer.
- source_word: ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: persistent dans leurs injustices
  rationale: Restitue l’idée de persévérance obstinée dans des actes ou états injustes.
- source_word: ἐν τῇ κολάσει κριθήσονται
  choice: ils seront jugés dans le châtiment
  rationale: Suit la leçon fournie, qui ne comporte pas explicitement le comparatif « plus grand » ; la tournure volontairement tendue préserve la relation ambiguë entre jugement et châtiment.
theological_decisions:
- issue: Souffrance attribuée au Très-Haut
  choice: lors de la souffrance du Très-Haut
  alternative: omettre la proposition comme expansion secondaire
  rationale: La proposition est présente dans le témoin fourni mais signalée par les crochets éditoriaux comme textuellement incertaine. Elle est donc traduite et accompagnée d’une note, sans résoudre la difficulté théologique qu’elle porte.
- issue: Sens de ᾅδης
  choice: l’Hadès
  alternative: l’enfer ou le séjour des morts
  rationale: La translittération préserve la catégorie grecque du monde des morts sans lui imposer la conception plus étroite d’un lieu de châtiment final.
- issue: Portée de la scène cosmique
  choice: quand… les hommes désobéissants persistent
  alternative: bien que… les hommes persistent
  rationale: La construction grecque au génitif absolu est rendue temporellement, sans ajouter explicitement une nuance concessive, même si le contraste demeure perceptible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La série d’images apocalyptiques conserve son parallélisme et son étrangeté. « Fils des hommes » et « Hadès » sont maintenus pour leur précision historique et littéraire ; la ponctuation clarifie la longue période sans en effacer la tension.
