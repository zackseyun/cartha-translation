source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Καὶ⸀⁴⁴ διὰ τοῦτο δέδωταί⁴⁵ σοι⁴⁶ βουλὴ καὶ σύνεσις τοῦ συνετίσαι τοὺς υἱούς σου⁴⁷ *περὶ τούτου⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/005.yaml
  text: And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.
translation:
  language: fr
  text: Et c’est pour cette raison que le conseil et l’intelligence t’ont été donnés, afin que tu instruises tes fils à ce sujet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλή
  choice: le conseil
  rationale: Rend le sens de discernement délibératif ou de capacité à conseiller, tout en conservant le parallélisme avec « intelligence ».
- source_word: σύνεσις
  choice: l’intelligence
  rationale: Exprime la faculté de comprendre et de discerner, dans un registre naturel et digne.
- source_word: τοῦ συνετίσαι
  choice: afin que tu instruises
  rationale: L’infinitif articulé exprime ici le but; « instruire » communique l’idée de rendre ses fils avisés ou capables de comprendre sans alourdir la phrase.
- source_word: τοὺς υἱούς σου
  choice: tes fils
  rationale: Traduction directe du grec, qui désigne explicitement les fils du destinataire.
- source_word: περὶ τούτου
  choice: à ce sujet
  rationale: Préserve la référence démonstrative relativement ouverte du grec sans préciser indûment son contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La construction causale et finale du grec est conservée, ainsi que le passif « t’ont été donnés », qui laisse implicite l’agent du don.
