source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Εἰσήκουσεν¹⁷ Γοὖν¹⁸ ὁ ὕψιστος τῆς προσευχῆς¹⁹ σου *τοῦ διελεῖν²⁰ σε ἀπὸ²¹ ἀδικίας²² καὶ γενέσθαι αὐτῷ²³ *υἱὸν καὶ θεράποντα²⁴ καὶ λειτουργὸν²⁵ τοῦ προσώπου αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: fr
  text: Ainsi donc, le Très-Haut a entendu ta prière, afin de te séparer de l’injustice et de faire de toi pour lui un fils, un serviteur et un ministre devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: le Très-Haut
  rationale: Rend directement le titre divin grec dans une formulation française consacrée et digne.
- source_word: ἀδικίας
  choice: l’injustice
  rationale: Conserve le sens moral large du terme grec sans le réduire à une faute particulière.
- source_word: θεράποντα
  choice: serviteur
  rationale: Exprime le service personnel et dévoué impliqué par le grec, sans introduire le sens moderne de « thérapeute ».
- source_word: λειτουργὸν
  choice: ministre
  rationale: Préserve la distinction avec θεράποντα et le registre de service officiel ou cultuel du terme.
- source_word: τοῦ προσώπου αὐτοῦ
  choice: devant lui
  rationale: Rend idiomatiquement l’idée de servir en présence de Dieu, plutôt que l’expression française moins naturelle « de sa face ».
theological_decisions:
- issue: Relation syntaxique de l’infinitif τοῦ διελεῖν avec l’exaucement de la prière
  choice: « il te séparera… et tu deviendras »
  alternative: « afin de te séparer… et de devenir »
  rationale: La formulation française explicite comme résultat ou contenu de l’exaucement ce que la construction grecque exprime par des infinitifs, tout en évitant de faire de Lévi l’agent de sa propre séparation.
- issue: Portée de υἱὸν appliqué à Lévi
  choice: « un fils »
  alternative: « son fils »
  rationale: Conserve l’indéfini grec et évite de préciser davantage la nature théologique de cette filiation.
translation_notes:
  register: Français moderne, clair et solennel. La coordination ternaire « un fils, un serviteur et un ministre » est conservée, ainsi que la tension entre filiation et service. Aucun marqueur de note n’est nécessaire.
