base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: fr
  text: Une bénédiction te sera accordée, à toi et à toute ta descendance, jusqu’à ce que le Seigneur visite toutes les nations dans la profonde compassion de [son fils][a], pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte fourni met entre crochets « son fils », dont la présence est incertaine. Il place aussi entre crochets une clause finale selon laquelle « tes fils » mettront les mains sur lui afin de l’empaler. La présente traduction suit la forme courte, tout en conservant « son fils » entre crochets.
    reason: textual_variant
lexical_decisions:
- source_word: σπέρματί
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » rend naturellement le sens collectif de « semence » en français moderne.
- source_word: ἐπισκέψεται
  choice: visite
  rationale: Le verbe peut désigner une intervention divine, favorable ou judiciaire. « Visite » conserve cette amplitude sans préciser indûment la nature de l’intervention.
- source_word: ἐν σπλάγχνοις
  choice: dans la profonde compassion
  rationale: Littéralement lié aux entrailles comme siège des émotions, le syntagme exprime une compassion profonde ; cette formulation en restitue le sens idiomatique avec dignité.
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Expression française courante correspondant à la durée indéfinie ou perpétuelle exprimée par le grec.
theological_decisions:
- issue: Référence filiale textuellement incertaine
  choice: '[son fils] en minuscules et entre crochets'
  alternative: '[son Fils] avec majuscule christologique'
  rationale: Le mot υἱοῦ est lui-même signalé comme incertain dans le texte grec fourni. Les crochets préservent cette incertitude, tandis que la minuscule évite d’imposer une identification christologique que la forme grecque seule ne marque pas typographiquement.
- issue: Portée de la visite divine
  choice: Conserver « visite » sans ajouter « sauve » ni « juge »
  alternative: Expliciter l’intervention comme salut
  rationale: ἐπισκέπτομαι peut évoquer une intervention providentielle sans que le membre de phrase précise ici sa nature ; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition grecque de ἕως crée une articulation difficile ; « jusqu’à ce que… pour toujours » la conserve sans trancher artificiellement la portée exacte de la dernière expression.
