  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
translation:
  language: fr
  text: '1. Et maintenant, mes enfants, observez tout ce que je vous commande, puisque je vous ai rapporté tout ce que j’ai entendu de mes pères.


    2. Voici, je suis innocent de votre impiété et de votre transgression, que vous commettrez à l’achèvement des siècles [contre le Sauveur du monde, le Messie][a], en égarant Israël et en suscitant contre lui de grands malheurs venant du Seigneur.[b]


    3. Vous vous livrerez à l’iniquité en Israël, au point que Jérusalem ne pourra plus le supporter à cause de votre méchanceté. Mais le voile du Temple[c] se déchirera, afin de ne plus couvrir votre honte.


    4. Vous serez dispersés comme captifs parmi les nations, et là vous serez un objet de honte et de malédiction.


    5. En effet, la maison que le Seigneur choisira sera appelée Jérusalem, comme le rapporte le livre d’Hénoch le juste.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « contre le Sauveur du monde, le Messie » figurent dans le témoin grec utilisé ici, mais de nombreux spécialistes les considèrent comme un ajout chrétien plus tardif. Ils sont donc conservés entre crochets.
    reason: textual_variant
  - marker: b
    text: La proposition « en suscitant contre lui de grands malheurs venant du Seigneur » est syntaxiquement difficile. Le référent du pronom « lui » peut être compris de plusieurs manières.
    reason: alternative_reading
  - marker: c
    text: Ou « rideau ». Il s’agit de la tenture intérieure du Temple.
    reason: lexical_alternative
  - marker: d
    text: Cette référence à Hénoch reflète le monde littéraire plus large de l’époque du Second Temple, où l’on pouvait citer comme faisant autorité des livres ancestraux qui ne figurent pas dans le canon biblique ultérieur.
    reason: cultural_note
lexical_decisions:
- source_word: φυλάξατε
  choice: observez
  rationale: Dans le contexte d’un commandement, « observez » exprime naturellement une mise en pratique fidèle, et non une simple conservation.
- source_word: ἀθῷός εἰμι
  choice: je suis innocent
  rationale: Cette formulation exprime clairement l’absence de responsabilité de Lévi dans les fautes futures qu’il annonce.
- source_word: ἀσεβείας
  choice: impiété
  rationale: Le terme conserve la dimension religieuse de l’offense envers Dieu.
- source_word: συντελείᾳ τῶν αἰώνων
  choice: à l’achèvement des siècles
  rationale: Cette expression garde le registre apocalyptique ainsi que l’idée d’accomplissement ou de consommation, sans la réduire à une simple date finale.
- source_word: χριστόν
  choice: le Messie
  rationale: Le mot grec fonctionne ici comme un titre; « Messie » en restitue le sens dans son cadre juif.
- source_word: πλανῶντες
  choice: en égarant
  rationale: Le choix conserve la forme participiale et l’idée de conduire Israël hors du bon chemin.
- source_word: ἐπεγείροντες
  choice: en suscitant
  rationale: Le verbe suggère que leurs actes provoquent ou font surgir les malheurs annoncés.
- source_word: ἀνομήσετε
  choice: vous vous livrerez à l’iniquité
  rationale: Cette tournure française naturelle exprime une conduite contraire à la loi sans introduire explicitement une référence à la Torah absente de la formulation grecque.
- source_word: καταπέτασμα
  choice: voile
  rationale: « Voile » est le terme traditionnel et intelligible pour la tenture intérieure du Temple; une note signale l’autre traduction possible.
- source_word: εἰς ὄνειδος καὶ εἰς κατάραν
  choice: un objet de honte et de malédiction
  rationale: Cette formulation idiomatique conserve le double effet public de déshonneur et de malédiction.
theological_decisions:
- issue: La proposition entre crochets qui mentionne « le Sauveur du monde, le Messie »
  choice: Conservée dans le texte entre crochets
  alternative: L’omettre comme développement chrétien secondaire, ou l’intégrer sans crochets
  rationale: Elle figure dans le témoin grec fourni, mais son caractère possiblement secondaire doit rester visible. Les crochets respectent à la fois le témoin et l’incertitude textuelle.
- issue: Le référent de « contre lui » au verset 2
  choice: Le pronom masculin singulier est conservé sans explicitation
  alternative: L’identifier expressément à Israël, au Messie ou aux transgresseurs
  rationale: La syntaxe grecque est difficile et ne permet pas de résoudre avec certitude le référent. La traduction préserve cette ambiguïté.
- issue: La déchirure du voile du Temple
  choice: L’image prophétique est traduite sans interprétation ajoutée
  alternative: L’identifier explicitement aux récits évangéliques de la Passion ou à une image purement symbolique
  rationale: Le texte annonce que le voile se déchirera et ne couvrira plus leur honte; il ne précise pas lui-même le cadre interprétatif à imposer.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve le ton testamentaire et prophétique, les répétitions significatives et les ambiguïtés réelles du grec, tout en évitant les tournures excessivement littérales ou confessionnelles.
