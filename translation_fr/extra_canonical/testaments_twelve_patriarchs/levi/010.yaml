  source_fidelity: 'Le texte suit fidèlement le grec fourni : les impératifs et prédictions, l’incise textuellement disputée entre crochets, l’ambiguïté de « contre lui », l’image du voile et la citation d’Hénoch sont préservés. Une correction est requise au v. 2 : le relatif grec se rapporte à l’ensemble coordonné « impiété et transgression », tandis que le singulier français « la transgression que » le limitait indûment au second nom.'
  naturalness: Français moderne, clair et d’un registre prophétique approprié. « Vous vous livrerez à l’iniquité », « objet de honte et de malédiction » et « le voile du Temple » sont naturels dans ce contexte. La reprise de « votre » devant « transgression » rend la coordination plus nette.
  terminology: « Impiété », « transgression », « Messie », « iniquité », « voile », « nations » et « Seigneur » rendent adéquatement les termes grecs sans surinterprétation. Les notes conservent les enjeux textuels, syntaxiques, lexicaux et culturels.
