base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: fr
  text: '17.1 Puisque vous avez entendu parler des soixante-dix semaines[a], écoutez aussi ce qui concerne le sacerdoce. 2 En effet, à chaque jubilé, il y aura un sacerdoce. Au premier jubilé, le premier à recevoir l’onction pour le sacerdoce sera grand. Il parlera à Dieu comme à un père, et son sacerdoce sera pleinement accompli avec le Seigneur. [Durant les jours de sa joie, il se lèvera pour le salut du monde.][b]


    3 Au deuxième jubilé, celui qui recevra l’onction sera conçu dans le deuil d’un être aimé. Son sacerdoce sera tenu en honneur, et lui-même sera glorifié par tous.


    4 Mais le troisième prêtre sera pris dans la tristesse. 5 Le quatrième sera dans les douleurs, car l’injustice s’accumulera sur lui en abondance. Dans tout Israël, chacun haïra son prochain. 6 Le cinquième sera pris dans les ténèbres. 7 Il en sera de même du sixième et du septième.


    8 Mais au septième, il y aura une souillure[c] dont je ne peux parler devant les hommes, car ceux qui commettent ces actes les connaîtront. 9 C’est pourquoi ils seront emmenés en captivité et livrés au pillage ; leur pays et leurs biens seront détruits.


    10 À la cinquième semaine, ils retourneront dans le pays de leur dévastation et renouvelleront la maison du Seigneur[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « soixante-dix semaines » reprend le langage chronologique apocalyptique connu notamment dans le livre de Daniel ; le passage suppose qu’une explication antérieure a déjà été entendue.
    reason: cross_reference
  - marker: b
    text: La proposition « Durant les jours de sa joie, il se lèvera pour le salut du monde » est textuellement incertaine dans le témoin utilisé ici et pourrait être une expansion postérieure ; elle est donc conservée entre crochets.
    reason: textual_variant
  - marker: c
    text: Le mot traduit par « souillure » peut évoquer aussi bien une profanation cultuelle qu’une corruption morale, particulièrement dans ce contexte de dégradation du sacerdoce.
    reason: lexical_alternative
  - marker: d
    text: « Renouveler la maison du Seigneur » peut désigner la restauration ou la reconstruction du temple après sa dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: soixante-dix semaines
  rationale: Conserve la formulation chronologique apocalyptique et son écho au livre de Daniel, sans la développer en « soixante-dix septaines ».
- source_word: ἱερωσύνη
  choice: sacerdoce
  rationale: Terme français courant et précis pour la fonction ou l’institution sacerdotale qui structure le passage.
- source_word: ἰωβηλαῖον
  choice: jubilé
  rationale: Rend directement le terme calendaire et préserve la succession prophétique organisée en jubilés.
- source_word: χριόμενος
  choice: celui qui recevra l’onction
  rationale: Exprime l’installation sacerdotale par l’onction sans transformer automatiquement le participe en titre messianique.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: il parlera à Dieu comme à un père
  rationale: Préserve la comparaison filiale frappante du grec sans l’atténuer en une simple idée de proximité.
- source_word: πλήρης μετὰ κυρίου
  choice: son sacerdoce sera pleinement accompli avec le Seigneur
  rationale: La construction grecque est condensée. Cette formulation garde l’idée de plénitude ou d’accomplissement en relation avec le Seigneur, sans préciser davantage la nature de cette relation.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: pour le salut du monde
  rationale: Traduction naturelle de la finalité exprimée ; la proposition entière reste entre crochets en raison de son incertitude textuelle.
- source_word: συλληφθήσεται
  choice: sera conçu
  rationale: Dans cette formule de succession, le sens lié à la conception convient mieux que « sera saisi », tout en laissant l’expression environnante non identifiée historiquement.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: dans le deuil d’un être aimé
  rationale: Préserve l’indétermination du référent et le caractère affectif du génitif grec.
- source_word: τιμία
  choice: tenu en honneur
  rationale: Rend l’estime attachée au sacerdoce dans un français naturel et évite l’ambiguïté moderne de « précieux ».
- source_word: παραληφθήσεται
  choice: sera pris
  rationale: Choix volontairement sobre qui conserve l’ambiguïté entre le fait d’être emporté, saisi ou marqué par la tristesse ou les ténèbres.
- source_word: ὀδύναις
  choice: douleurs
  rationale: Terme assez large pour couvrir souffrances, angoisses ou tourments sans les réduire à la douleur physique.
- source_word: μιασμός
  choice: souillure
  rationale: Le mot peut désigner à la fois une profanation cultuelle et une corruption morale, double portée adaptée au contexte sacerdotal.
- source_word: ἀνακαινοποιήσουσιν
  choice: renouvelleront
  rationale: Conserve le sens de restauration ou de remise à neuf sans décider si le temple est réparé ou entièrement reconstruit.
theological_decisions:
- issue: Statut de la proposition sur le salut du monde en 17.2
  choice: La traduire dans le texte principal entre crochets.
  alternative: L’omettre comme ajout secondaire, ou l’intégrer sans signalement.
  rationale: Le témoin grec fourni marque cette proposition comme textuellement incertaine. Les crochets permettent de la conserver tout en rendant cette incertitude visible.
- issue: Identification des prêtres et des périodes prophétiques
  choice: Présenter la succession des prêtres, jubilés et semaines sans identifier les personnages.
  alternative: Associer chaque prêtre à un grand prêtre historique précis, ou réduire toute la séquence à des ères purement symboliques.
  rationale: Le grec expose un schéma prophétique, mais ne fournit pas lui-même les identifications historiques nécessaires. La traduction n’en impose donc aucune.
- issue: Portée de χριόμενος
  choice: Employer une périphrase liée à l’onction sacerdotale.
  alternative: Employer « l’Oint » comme titre messianique.
  rationale: Le contexte immédiat concerne l’entrée dans le sacerdoce. Une périphrase évite d’importer un titre christologique ou messianique que la forme grecque n’exige pas ici.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique et la répétition structurante des jubilés et des prêtres sont conservées, tandis que les tournures grecques les plus condensées sont légèrement explicitées. Les ambiguïtés concernant les personnes historiques, la nature de la souillure et la manière dont le temple est renouvelé ne sont pas résolues dans le corps du texte.
