source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: fr
  text: Et son étoile se lèvera dans le ciel comme un roi, faisant rayonner la lumière de la connaissance comme le soleil le jour[a] ; et il sera magnifié dans le monde habité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec correspondant à « comme le soleil le jour » est incertain et paraît altéré ; il se lit littéralement, de façon approximative : « dans le soleil, jour » ou « dans le soleil du jour ».'
    reason: Les signes critiques de l’édition signalent une corruption textuelle. La note indique que la formulation française est une restitution prudente et non une lecture certaine.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Rend naturellement l’image du lever d’un astre tout en conservant le futur du grec.
- source_word: ὡς βασιλέως
  choice: comme celle d’un roi
  rationale: Le génitif grec est abrupt. Cette formulation comprend implicitement « étoile » et préserve l’association royale sans faire du roi lui-même le sujet de la comparaison.
- source_word: φῶς γνώσεως
  choice: la lumière de la connaissance
  rationale: Traduction directe qui conserve l’image et la portée sapientielle de l’expression.
- source_word: μεγαλυνθήσεται
  choice: il sera exalté
  rationale: Le passif exprime l’élévation ou la reconnaissance de la grandeur du personnage. « Exalté » reste digne et plus naturel ici que le calque « magnifié ».
- source_word: οἰκουμένῃ
  choice: monde habité
  rationale: Conserve le sens ancien de l’ensemble du monde habité, plutôt que de réduire le terme à une région ou de l’assimiler simplement à « la terre ».
theological_decisions:
- issue: Référent du pronom dans « il sera exalté »
  choice: Conserver le pronom masculin sans identifier explicitement le personnage
  alternative: Nommer le roi, le prêtre ou le Messie
  rationale: Le verset dépend du contexte pour son référent ; l’identifier dans la traduction importerait une interprétation théologique non exprimée dans cette phrase.
- issue: Nature de l’image royale
  choice: « comme celle d’un roi »
  alternative: « comme un roi »
  rationale: Cette lecture rattache plus naturellement le génitif βασιλέως à l’étoile sous-entendue et évite de résoudre l’expression en une comparaison directe entre l’astre et un roi.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La phrase conserve le parallélisme et les images du grec, avec une ponctuation qui clarifie les deux annonces futures. Le point-virgule évite une accumulation pesante sans rompre l’unité du verset.
