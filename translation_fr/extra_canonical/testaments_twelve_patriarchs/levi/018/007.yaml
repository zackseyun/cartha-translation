id: T12P.LEV.18.7
reference: Testament of Levi 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: fr
  text: Et la gloire du Très-Haut sera proclamée sur lui, et un esprit d’intelligence et de consécration reposera sur lui [dans l’eau].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « dans l’eau » sont textuellement incertains.
    reason: Le segment ἐν τῷ ὕδατι apparaît entre crochets dans l’édition grecque fournie et doit être signalé au lecteur.
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: la gloire du Très-Haut
  rationale: Rend directement le génitif grec et conserve le titre divin traditionnel dans un français actuel et digne.
- source_word: ῥηθήσεται
  choice: sera proclamée
  rationale: Le passif de λέγω signifie littéralement « sera dite »; « sera proclamée » restitue ici plus naturellement l’idée d’une déclaration solennelle sans en préciser l’auteur.
- source_word: πνεῦμα συνέσεως
  choice: un esprit d’intelligence
  rationale: « Intelligence » rend σύνεσις comme capacité de comprendre ou de discerner, tout en maintenant l’ambiguïté de πνεῦμα entre souffle, disposition et esprit.
- source_word: ἁγιασμοῦ
  choice: de consécration
  rationale: Le terme désigne l’action ou l’état de rendre saint; « consécration » convient au contexte rituel possible et évite de réduire le sens à une qualité morale.
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: reposera sur lui
  rationale: Expression française naturelle qui suit l’image grecque d’un esprit venant demeurer sur une personne.
theological_decisions:
- issue: Nature de l’« esprit »
  choice: un esprit
  alternative: l’Esprit
  rationale: L’absence d’article et l’enchaînement descriptif ne permettent pas d’imposer une identification explicite à l’Esprit saint; la formulation française conserve cette ouverture.
- issue: Statut de « dans l’eau »
  choice: maintien entre crochets dans le texte
  alternative: intégration sans crochets ou omission
  rationale: Les crochets de l’édition signalent une incertitude textuelle; ils sont conservés afin de ne pas présenter la phrase comme incontestablement originale.
- issue: Sens de ἁγιασμός
  choice: consécration
  alternative: sanctification
  rationale: « Consécration » exprime clairement la mise à part comme sainte dans ce contexte, tandis que « sanctification » pourrait suggérer plus étroitement un processus doctrinal particulier.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure parallèle du grec est conservée, ainsi que le passif sans agent et l’ambiguïté de « esprit ».
