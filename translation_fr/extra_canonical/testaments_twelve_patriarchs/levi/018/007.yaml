  source_fidelity: 'Le texte rend fidèlement les deux propositions coordonnées : δόξα ὑψίστου est bien « la gloire du Très-Haut », le futur passif ῥηθήσεται est conservé par « sera proclamée », et καταπαύσει est correctement traduit par « reposera ». « Sur lui » reflète ἐπ’ αὐτόν sans introduire d’agent. Le complément [ἐν τῷ ὕδατι] est maintenu entre crochets, conformément à l’incertitude signalée par l’édition source.'
