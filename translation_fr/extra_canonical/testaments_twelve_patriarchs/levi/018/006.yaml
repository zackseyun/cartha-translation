base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: fr
  text: Les cieux s’ouvriront, et du temple de la gloire la sainteté viendra sur lui, avec une voix paternelle, comme celle d’Abraham à Isaac.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοὶ
  choice: Les cieux
  rationale: Reproduit naturellement le pluriel grec dans le registre biblique français.
- source_word: ἀνοιγήσονται
  choice: s’ouvriront
  rationale: Rend directement le futur passif grec par la tournure pronominale idiomatique française.
- source_word: ἐκ τοῦ ναοῦ τῆς δόξης
  choice: du temple de la gloire
  rationale: Conserve la construction génitive et son caractère élevé sans explicitation indue.
- source_word: ἥξει ἐπ’ αὐτὸν
  choice: descendra sur lui
  rationale: Le grec signifie littéralement « viendra sur lui »; « descendra » rend naturellement le mouvement depuis les cieux et le temple, sans modifier le référent.
- source_word: ἁγίασμα
  choice: une consécration
  rationale: Le substantif désigne ce qui consacre ou confère la sainteté. « Consécration » convient ici à quelque chose qui vient sur la personne, tout en évitant l’expression française peu naturelle « la sainteté viendra sur lui ».
- source_word: μετὰ φωνῆς πατρικῆς
  choice: accompagnée d’une voix paternelle
  rationale: Rend la concomitance exprimée par μετά et préserve la qualité paternelle de la voix.
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: comme celle d’Abraham s’adressant à Isaac
  rationale: 'Explicite seulement l’ellipse française nécessaire: la comparaison porte naturellement sur la voix venant d’Abraham et dirigée vers Isaac.'
theological_decisions:
- issue: Nature de ἁγίασμα
  choice: une consécration
  alternative: la sainteté / une sanctification
  rationale: Le terme peut évoquer la sainteté, la consécration ou ce qui sanctifie. Dans cette construction, « consécration » demeure concret et naturel, sans imposer un processus doctrinal précis.
- issue: Rapport entre la voix paternelle et Abraham
  choice: comme celle d’Abraham s’adressant à Isaac
  alternative: comme venant d’Abraham vers Isaac
  rationale: La formulation retenue comprend la comparaison comme portant sur la voix, lecture syntaxiquement naturelle, tout en évitant d’identifier explicitement la voix divine à Abraham.
translation_notes:
  register: Français moderne, digne et accessible, avec maintien du registre visionnaire et biblique. La syntaxe est légèrement explicitée à la fin pour rendre intelligible l’ellipse grecque.
