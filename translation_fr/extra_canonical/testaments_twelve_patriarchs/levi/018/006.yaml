- from: Les cieux s’ouvriront, et du temple de la gloire descendra sur lui une consécration, accompagnée d’une voix paternelle, comme celle d’Abraham s’adressant à Isaac.
  to: Les cieux s’ouvriront, et du temple de la gloire la sainteté viendra sur lui, avec une voix paternelle, comme celle d’Abraham à Isaac.
