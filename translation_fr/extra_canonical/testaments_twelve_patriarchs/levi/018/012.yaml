id: T12P.LEV.18.12
reference: Testament of Levi 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: fr
  text: Et Béliar sera lié par lui, et il donnera à ses enfants le pouvoir de fouler aux pieds les esprits mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, qui préserve l’identité de la figure sans l’interpréter.
- source_word: δεθήσεται ὑπ᾿ αὐτοῦ
  choice: sera lié par lui
  rationale: Rend directement le passif futur et conserve l’ambiguïté du référent du pronom masculin.
- source_word: ἐξουσίαν
  choice: le pouvoir
  rationale: Dans ce contexte, « pouvoir » exprime naturellement l’autorité ou la capacité accordée pour dominer les esprits.
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: à ses enfants
  rationale: Traduction simple de τέκνοις qui garde le sens relationnel et laisse ouvert son éventuel emploi figuré.
- source_word: πατεῖν ἐπὶ
  choice: de fouler aux pieds
  rationale: Conserve l’image concrète de domination exprimée par le verbe et la préposition.
- source_word: τὰ πονηρὰ πνεύματα
  choice: les esprits mauvais
  rationale: Reproduit l’article défini et traduit l’adjectif sans ajouter de catégorie démonologique absente du grec.
theological_decisions:
- issue: Référents des pronoms αὐτοῦ
  choice: Conserver « par lui » et « ses enfants » sans explicitation
  alternative: Remplacer les pronoms par un personnage nommé d’après le contexte élargi
  rationale: Le verset grec emploie des pronoms dont les référents ne sont pas explicités dans la phrase; les préciser ici résoudrait indûment une ambiguïté contextuelle.
- issue: Nature de la victoire sur les esprits
  choice: Maintenir l’image « fouler aux pieds »
  alternative: Paraphraser par « vaincre » ou « dominer »
  rationale: La métaphore corporelle fait partie du texte et peut porter une nuance théologique de soumission complète qu’une paraphrase atténuerait.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique; aucune note n’est nécessaire pour ce verset.
