  source_fidelity: 'La traduction suit fidèlement la structure et les principales images du grec : le cadre temporel du sacerdoce, l’accroissement des nations dans la connaissance, l’illumination par la grâce du Seigneur, la cessation du péché et le repos « en lui » sont conservés. Une correction est toutefois nécessaire : σκοτισθήσεται ἐν πένθει signifie littéralement que Israël sera obscurci/dans les ténèbres « dans le deuil », et non qu’il sera assombri « par le deuil », formulation qui transforme le complément de sphère/condition en cause instrumentale.'
