  terminology: « Sacerdoce », « grâce du Seigneur », « péché », « ceux qui vivent sans loi » et « justes » sont appropriés. Le pronom de « en lui » est à juste titre maintenu sans explicitation doctrinale. Les crochets et leurs notes rendent correctement l’incertitude textuelle signalée par l’édition.
