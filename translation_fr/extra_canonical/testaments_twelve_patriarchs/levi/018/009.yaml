  to: Et sous son sacerdoce, les nations grandiront en connaissance sur la terre et seront éclairées par la grâce du Seigneur. [Mais Israël, lui, s’amoindrira dans l’ignorance et s’obscurcira dans le deuil.][a] Sous son sacerdoce, le péché cessera, et ceux qui vivent sans loi cesseront de faire le mal ; [mais les justes trouveront leur repos en lui.][b]
  rationale: La seule révision modifie « sera assombri par le deuil » en « s’obscurcira dans le deuil », afin de rendre plus exactement σκοτισθήσεται ἐν πένθει sans ajouter d’interprétation causale. Le reste du texte et les notes sont maintenus, y compris les ambiguïtés textuelles et référentielles.
