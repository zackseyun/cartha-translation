  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: fr
  text: Et sous son sacerdoce, les nations grandiront en connaissance sur la terre et seront éclairées par la grâce du Seigneur. [Mais Israël, lui, s’amoindrira dans l’ignorance et s’obscurcira dans le deuil.][a] Sous son sacerdoce, le péché cessera, et ceux qui vivent sans loi cesseront de faire le mal ; [mais les justes trouveront leur repos en lui.][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette phrase est placée entre crochets dans l’édition grecque utilisée, ce qui signale que son statut textuel est incertain.
    reason: Informer le lecteur de l’incertitude éditoriale sans retirer la phrase du texte.
  - marker: b
    text: Cette proposition est placée entre crochets dans l’édition grecque utilisée, ce qui signale que son statut textuel est incertain.
    reason: Reproduire de façon transparente la réserve textuelle de l’édition source.
lexical_decisions:
- source_word: ἐπὶ τῆς ἱερωσύνης αὐτοῦ
  choice: sous son sacerdoce
  rationale: Exprime naturellement la période ou le régime de son ministère sacerdotal, sans réduire ἱερωσύνη à une simple fonction ponctuelle.
- source_word: τὰ ἔθνη πληθυνθήσονται ἐν γνώσει
  choice: les nations grandiront en connaissance
  rationale: Conserve comme sujet « les nations » et rend l’idée d’accroissement de πληθυνθήσονται, tout en évitant l’expression française peu naturelle « seront multipliées en connaissance ».
- source_word: φωτισθήσονται διὰ χάριτος κυρίου
  choice: seront éclairées par la grâce du Seigneur
  rationale: Préserve la voix passive, l’image de l’illumination et le rôle médiateur de la grâce.
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: le péché cessera
  rationale: Rend ici ἐκλείπω au sens de disparaître ou prendre fin, conformément au contexte eschatologique.
- source_word: οἱ ἄνομοι
  choice: ceux qui vivent sans loi
  rationale: Garde la référence explicite à l’absence ou au mépris de la loi sans employer « impies », qui élargirait et interpréterait davantage le terme.
- source_word: καταπαύσουσιν εἰς κακά
  choice: cesseront de faire le mal
  rationale: Produit un français intelligible à partir d’une tournure grecque difficile, en suivant le sens contextuel d’un arrêt des mauvaises actions.
- source_word: καταπαύσουσιν ἐν αὐτῷ
  choice: trouveront leur repos en lui
  rationale: Distingue dans ce contexte le sens de repos de celui de cessation, tout en conservant le pronom masculin ou référentiel ambigu.
theological_decisions:
- issue: Rapport entre les nations et Israël
  choice: Maintien du contraste explicite dans le passage entre croître en connaissance et s’amoindrir dans l’ignorance
  alternative: Atténuer ou harmoniser ce contraste au profit d’une lecture théologique unifiée
  rationale: Le texte grec présente une tension nette ; la traduction ne doit ni l’effacer ni préciser sa portée au-delà du texte.
- issue: Référent de « en lui »
  choice: Conservation du pronom « lui » sans explicitation
  alternative: Remplacer par « dans le prêtre », « dans le Seigneur » ou un titre messianique
  rationale: Le référent de αὐτῷ n’est pas nommé dans cette proposition ; l’expliciter résoudrait indûment une ambiguïté théologique réelle.
- issue: La grâce comme moyen d’illumination
  choice: « par la grâce du Seigneur »
  alternative: « grâce au Seigneur » ou « par la faveur du Seigneur »
  rationale: Cette formulation conserve à la fois χάρις et la relation instrumentale exprimée par διά.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant les calques les plus opaques. Les crochets de l’édition source sont conservés et accompagnés de notes textuelles.
