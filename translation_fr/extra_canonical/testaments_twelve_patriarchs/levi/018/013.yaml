  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: fr
  text: Et le Seigneur se réjouira de ses enfants et prendra plaisir à ses bien-aimés pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: se réjouira
  rationale: Rend naturellement en français le futur passif de forme mais à valeur intransitive, exprimant la joie du Seigneur.
- source_word: τέκνοις
  choice: enfants
  rationale: Équivalent direct et courant, qui conserve la relation familiale du grec.
- source_word: εὐδοκήσει
  choice: prendra plaisir
  rationale: Exprime l’idée d’agrément et de satisfaction sans réduire le verbe à une simple approbation.
- source_word: ἀγαπητοῖς
  choice: bien-aimés
  rationale: Préserve la portée substantivée de l’adjectif grec et son registre affectif digne.
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Formulation française naturelle qui restitue ici la durée indéfinie ou perpétuelle.
theological_decisions:
- issue: Rapport entre « ses enfants » et « ses bien-aimés »
  choice: Conserver les deux désignations parallèles sans les identifier ni les distinguer explicitement.
  alternative: Traduire la seconde expression par « ceux qu’il aime » ou préciser qu’il s’agit du même groupe.
  rationale: Le grec présente deux expressions parallèles, mais ne tranche pas explicitement leur relation exacte.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme de la phrase grecque est conservé, ainsi que la répétition du sujet pronominal.
