source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: fr
  text: Car c’est lui qui donnera pour toujours, en vérité, la majesté du Seigneur à ses fils[a] ; il n’y aura pas de succession pour lui, durant des générations et des générations, jusqu’à l’éternité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms « lui » et « ses » renvoient au personnage évoqué dans le contexte ; le grec ne le nomme pas ici.
    reason: Signaler l’ambiguïté référentielle réelle sans la résoudre dans le corps du texte.
  - marker: b
    text: 'Littéralement : « pour des générations et des générations, jusqu’à l’éternité ».'
    reason: Faire apparaître la construction cumulative et inhabituelle de l’expression grecque.
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  choice: la majesté du Seigneur
  rationale: Rend directement le groupe nominal grec, sans réduire μεγαλωσύνη à la seule « grandeur » ni expliciter une relation qui reste implicite.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Conserve la formulation grecque et son ambiguïté possible entre véracité, fidélité et réalité.
- source_word: διαδοχή
  choice: succession
  rationale: Le nom abstrait grec désigne une succession ou transmission ; « successeur » transformerait le nom en personne et préciserait indûment le sens.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: durant des générations et des générations
  rationale: Reproduit l’insistance de la répétition grecque tout en donnant une tournure française compréhensible.
- source_word: ἕως τοῦ αἰῶνος
  choice: jusqu’à l’éternité
  rationale: Préserve la formulation temporelle distincte du grec, plutôt que de la fondre dans un second « pour toujours ».
theological_decisions:
- issue: Référents de αὐτός et αὐτοῦ
  choice: « c’est lui » et « après lui »
  alternative: Identifier explicitement le personnage auquel renvoient les pronoms
  rationale: Le verset grec emploie des pronoms dont les référents dépendent du contexte ; la traduction ne leur substitue aucun titre ou nom interprétatif.
- issue: Relation entre la majesté du Seigneur et les fils
  choice: « donnera… la majesté du Seigneur à ses fils »
  alternative: « conférera à ses fils une majesté venant du Seigneur »
  rationale: La syntaxe du génitif est conservée sans décider s’il indique possession, origine ou qualité.
- issue: Nature de la succession refusée
  choice: « aucune succession après lui »
  alternative: « il n’aura aucun successeur »
  rationale: Le substantif abstrait διαδοχή peut concerner une continuité de charge ou une transmission plus largement ; la formulation retenue évite de la réduire à une seule personne.
translation_notes:
  register: Français international moderne, digne et lisible. « Car c’est lui qui » garde l’emphase de αὐτός ; la répétition « générations et des générations » et l’expression « jusqu’à l’éternité » sont maintenues malgré leur caractère marqué afin de respecter la tension du grec.
