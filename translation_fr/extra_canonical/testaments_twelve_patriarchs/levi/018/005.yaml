base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: fr
  text: Les cieux exulteront durant ses jours, et la terre se réjouira, et les nuées seront dans l’allégresse. [Et la connaissance du Seigneur sera répandue sur la terre comme les eaux des mers.][a] Et les anges de la gloire de la présence du Seigneur se réjouiront en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase placée entre crochets est textuellement incertaine dans la tradition grecque éditée.
    reason: Le texte source imprime ce segment entre crochets; la note explique ce signal éditorial sans trancher la question textuelle.
lexical_decisions:
- source_word: ἀγαλλιάσονται
  choice: exulteront
  rationale: Rend la joie intense exprimée par le verbe grec tout en conservant un registre poétique et digne.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: en ses jours
  rationale: Conserve l’expression temporelle et la référence pronominale du grec sans préciser davantage l’identité du personnage.
- source_word: νεφέλαι
  choice: nuées
  rationale: Équivalent naturel dans un registre biblique poétique; le terme grec du texte édité est toutefois signalé comme incertain.
- source_word: ἡ γνῶσις κυρίου
  choice: la connaissance du Seigneur
  rationale: Traduction formelle qui préserve la portée potentiellement relationnelle autant qu’intellectuelle de γνῶσις.
- source_word: ἐκχυθήσεται
  choice: sera répandue
  rationale: Restitue l’image d’un déversement abondant sans produire en français une personnification maladroite.
- source_word: ὕδωρ θαλασσῶν
  choice: les eaux des mers
  rationale: Le pluriel français correspond naturellement au génitif pluriel θαλασσῶν et maintient l’image aquatique.
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: les anges de la gloire de la présence du Seigneur
  rationale: Préserve la chaîne de génitifs et rend πρόσωπον par « présence », sens idiomatique possible ici, sans effacer la formulation dense du grec.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Maintient l’ambiguïté du référent masculin et la formulation théologiquement chargée du grec.
theological_decisions:
- issue: Référent des pronoms αὐτοῦ et αὐτῷ
  choice: « ses » et « en lui »
  alternative: Nommer explicitement le prêtre ou le personnage messianique
  rationale: Le verset grec emploie des pronoms; expliciter leur référent résoudrait une ambiguïté que le texte conserve.
- issue: Sens de τοῦ προσώπου κυρίου
  choice: « de la présence du Seigneur »
  alternative: « de la face du Seigneur »
  rationale: « Présence » exprime l’idiome sémitisant courant derrière « face » tout en restant intelligible; la construction génitive demeure volontairement dense.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des trois éléments cosmiques et la répétition du vocabulaire de la joie sont conservés. Les crochets éditoriaux autour de la phrase sur la connaissance du Seigneur sont maintenus, avec une note expliquant leur fonction.
