source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οὗτος¹⁹ ἀναλάμψει²⁰ *ὡς ὁ²¹ ἥλιος ἐν τῇ γῇ²², καὶ ἐξαρεῖ πᾶν σκότος *ἐκ τῆς ὑπ᾽ οὐρανὸν²³ καὶ ἔσται εἰρήνη ἐν πάσῃ τῇ γῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/004.yaml
  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: fr
  text: Il resplendira comme le soleil sur la terre ; il fera disparaître toutes les ténèbres de sous le ciel, et il y aura la paix sur toute la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: resplendira
  rationale: Le verbe exprime le fait de se mettre à briller ou de briller avec éclat; « resplendira » restitue cette force dans un français naturel et digne.
- source_word: ἐξαρεῖ
  choice: fera disparaître
  rationale: Le verbe signifie littéralement « enlèvera »; dans le contexte des ténèbres, « fera disparaître » est idiomatique sans atténuer l’idée de leur suppression complète.
- source_word: εἰρήνη
  choice: la paix
  rationale: Correspondance directe qui conserve la portée générale du terme grec.
- source_word: ἔσται ... ἐν πάσῃ τῇ γῇ
  choice: la paix régnera sur toute la terre
  rationale: La tournure française exprime naturellement la présence étendue de la paix, tout en conservant le sens existentiel du grec.
theological_decisions:
- issue: Identité du sujet Οὗτος
  choice: Il
  alternative: Celui-ci
  rationale: Le contexte fournit le référent masculin; « Il » reste naturel en français et n'ajoute aucune identification christologique ou autre absente du verset.
- issue: Portée de ὑπ᾽ οὐρανόν
  choice: de dessous le ciel
  alternative: du monde sous le ciel
  rationale: La formulation retenue conserve l’image cosmique et l’étendue du grec sans la préciser davantage.
translation_notes:
  register: Français international moderne, clair et solennel. Le parallélisme de la phrase grecque est préservé, avec une syntaxe fluide et sans ajout confessionnel.
