source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: fr
  text: Il donnera aux saints de manger de l’arbre de la vie, et un esprit de sainteté sera sur eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: aux saints
  rationale: Rend directement le datif substantivé grec, qui désigne ceux qui sont consacrés à Dieu.
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: à manger de l’arbre de la vie
  rationale: Conserve la construction grecque et l’image traditionnelle de l’arbre de la vie, sans expliciter s’il s’agit de son fruit.
- source_word: πνεῦμα ἁγιωσύνης
  choice: l’Esprit de sainteté
  rationale: Préserve l’expression sémitisante du grec et sa possible portée divine, sans la réduire à une simple disposition intérieure.
- source_word: ἐπ᾿ αὐτοῖς
  choice: sur eux
  rationale: Traduction formelle de la préposition, qui évoque une présence reposant sur les saints.
theological_decisions:
- issue: Référence de « πνεῦμα ἁγιωσύνης »
  choice: l’Esprit de sainteté
  alternative: un esprit de sainteté
  rationale: L’expression peut désigner l’Esprit divin ou une puissance de sanctification. La majuscule reflète ici le contexte eschatologique et la formulation reçue, tout en maintenant l’expression littérale plutôt que d’imposer « Saint-Esprit ».
translation_notes:
  register: Français moderne, sobre et dignifié. La syntaxe reste proche du grec tout en étant naturelle; le parallélisme des deux propositions est conservé.
