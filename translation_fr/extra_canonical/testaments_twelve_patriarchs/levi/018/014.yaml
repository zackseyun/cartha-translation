source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: fr
  text: Alors Abraham, Isaac et Jacob exulteront, et moi aussi, je me réjouirai, et tous les saints se revêtiront de justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: exulteront
  rationale: Le verbe exprime une joie intense et manifeste; « exulter » en conserve la force dans un registre digne.
- source_word: κἀγὼ χαρήσομαι
  choice: et moi aussi, je me réjouirai
  rationale: κἀγώ associe explicitement le locuteur à la joie des patriarches; « moi aussi » rend naturellement cette valeur additive, tandis que « je me réjouirai » correspond à χαρήσομαι.
- source_word: οἱ ἅγιοι
  choice: les saints
  rationale: Expression française consacrée et compréhensible pour désigner ceux qui sont saints ou consacrés, sans préciser davantage leur identité.
- source_word: ἐνδύσονται δικαιοσύνην
  choice: se revêtiront de justice
  rationale: La formulation conserve la métaphore vestimentaire du grec et l'abstraction théologique de δικαιοσύνη.
theological_decisions:
- issue: Identité de πάντες οἱ ἅγιοι
  choice: tous les saints
  alternative: tous les êtres saints / tous ceux qui sont saints
  rationale: Le grec ne détermine pas explicitement s'il s'agit d'humains, d'anges ou de l'ensemble des consacrés; la traduction garde cette indétermination.
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » préserve l'étendue sémantique du terme grec, qui peut évoquer tant la rectitude que la justice accordée ou manifestée, sans trancher la tension théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition des verbes de joie et la métaphore « se revêtir de justice » sont maintenues pour respecter la structure et l'imagerie du grec.
