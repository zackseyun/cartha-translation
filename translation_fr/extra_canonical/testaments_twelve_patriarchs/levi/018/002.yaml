base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: fr
  text: Alors le Seigneur suscitera un nouveau prêtre, à qui toutes les paroles du Seigneur seront révélées ; et il exercera un jugement conforme à la vérité sur la terre pendant de nombreux jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: suscitera
  rationale: Rend naturellement l’idée de faire surgir ou d’établir une personne pour une mission, dans un registre religieux digne.
- source_word: ἱερέα καινόν
  choice: un prêtre nouveau
  rationale: Conserve la valeur de καινός, qui souligne la nouveauté du prêtre, sans préciser indûment en quoi elle consiste.
- source_word: πάντες οἱ λόγοι κυρίου
  choice: toutes les paroles du Seigneur
  rationale: Reproduit le pluriel λόγοι et son sens large de paroles ou déclarations, sans le réduire à un message unique.
- source_word: ποιήσει κρίσιν ἀληθείας
  choice: il exercera un jugement conforme à la vérité
  rationale: Expression française naturelle qui garde la relation génitive entre jugement et vérité, sans suggérer seulement qu’un verdict serait factuellement exact.
- source_word: ἐν πλήθει ἡμερῶν
  choice: pendant de nombreux jours
  rationale: Rend l’idée idiomatique d’une longue durée exprimée comme une multitude de jours.
theological_decisions:
- issue: Identité du « prêtre nouveau »
  choice: Ne pas l’identifier explicitement
  alternative: Employer une formulation qui l’assimilerait directement au Messie ou à une figure historique déterminée
  rationale: Le verset annonce cette figure sans la nommer ni résoudre ici son identité.
- issue: Portée des « paroles du Seigneur » révélées
  choice: Conserver « toutes les paroles du Seigneur »
  alternative: Préciser qu’il s’agit de secrets, de prophéties ou de commandements
  rationale: Le grec λόγοι reste général ; une précision doctrinale dépasserait le texte.
- issue: Nature de κρίσιν ἀληθείας
  choice: « un jugement conforme à la vérité »
  alternative: « le vrai jugement » ou « un jugement de vérité »
  rationale: Cette formulation préserve le lien entre jugement et vérité tout en restant claire en français moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux propositions coordonnées du grec ; le point-virgule évite une phrase heurtée. Aucun marqueur de note n’est nécessaire.
