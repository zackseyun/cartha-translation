source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: fr
  text: Et lui-même ouvrira les portes du paradis et écartera l’épée menaçante dirigée contre Adam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Oui
  rationale: Rend l’insistance affirmative de la particule grecque dans un français naturel et digne.
- source_word: αὐτὸς
  choice: c’est lui qui
  rationale: Conserve l’emphase portée sur le sujet.
- source_word: ἀνοίξει τὰς θύρας τοῦ παραδείσου
  choice: ouvrira les portes du paradis
  rationale: Traduction directe et idiomatique de l’expression grecque.
- source_word: ἀποστήσει
  choice: écartera
  rationale: Exprime l’idée de faire retirer ou éloigner, sans préciser davantage le mode d’action.
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν κατὰ τοῦ Ἀδάμ
  choice: l’épée menaçante dressée contre Adam
  rationale: Préserve la personnification du participe et la relation hostile exprimée par κατά.
theological_decisions:
- issue: Nature et identification du sujet emphatique αὐτός
  choice: Conserver le pronom sans identifier davantage le personnage
  alternative: Nommer explicitement le personnage messianique ou sacerdotal
  rationale: Le verset grec dit seulement « lui-même / lui »; une identification explicite importerait une interprétation contextuelle dans le texte.
- issue: Rapport de l’épée à Adam
  choice: « dressée contre Adam »
  alternative: « qui menaçait Adam »
  rationale: Cette formulation garde la construction hostile de κατά et l’image concrète de l’épée, sans résoudre la portée symbolique du passage.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe reste proche du grec tout en évitant une tournure artificielle; l’emphase de Καίγε αὐτός est rendue par « Oui, c’est lui qui ».
