source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ μετὰ τὸ γενέσθαι τὴν ἐκδίκησιν αὐτῶν παρὰ κυρίου, *ἐκλείψει ἡ ἱερωσύνη².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/001.yaml
  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: fr
  text: Après que leur châtiment sera venu de la part du Seigneur, le sacerdoce cessera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: châtiment
  rationale: Dans ce contexte, le terme désigne l’action punitive ou rétributive exercée par le Seigneur. « Châtiment » est naturel en français et évite que « vengeance » évoque une réaction passionnelle.
- source_word: παρὰ κυρίου
  choice: de la part du Seigneur
  rationale: Cette formulation rend explicitement la provenance ou l’initiative indiquée par παρά avec le génitif.
- source_word: ἐκλείψει
  choice: disparaîtra
  rationale: Le verbe signifie cesser, faire défaut ou disparaître. « Disparaîtra » exprime clairement la fin annoncée du sacerdoce sans préciser indûment son mécanisme.
- source_word: ἡ ἱερωσύνη
  choice: le sacerdoce
  rationale: Équivalent français usuel pour l’institution ou la fonction sacerdotale visée par le nom grec.
theological_decisions:
- issue: Nature de l’ἐκδίκησις divine
  choice: châtiment
  alternative: vengeance
  rationale: Le choix conserve l’idée de rétribution divine tout en évitant les connotations modernes de vindicte personnelle; il ne tranche pas davantage la nature précise du jugement.
- issue: Portée de la cessation du sacerdoce
  choice: le sacerdoce disparaîtra
  alternative: le sacerdoce prendra fin
  rationale: La traduction maintient l’énoncé général du grec sans identifier un sacerdoce particulier ni expliquer théologiquement sa cessation.
translation_notes:
  register: Français moderne, sobre et dignifié. La structure temporelle de la phrase grecque est conservée, avec une formulation naturelle et accessible.
