source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: fr
  text: '[Vous traiterez d’imposteur un homme qui renouvellera la loi par la puissance du Très-Haut. À la fin, vous vous précipiterez pour le tuer sans connaître sa stature[a], assumant sur vos têtes, dans votre méchanceté, la responsabilité de son sang innocent.]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette proposition est incertain. Le mot traduit par « stature » peut aussi signifier « relèvement » et, selon le contexte, évoquer une résurrection.
    reason: Signaler l’incertitude textuelle marquée dans l’édition et l’ambiguïté de ἀνάστημα, sans imposer une interprétation théologique.
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: qui renouvellera la loi
  rationale: Le participe désigne l’action de rendre la loi nouvelle ou de la renouveler. Le futur français s’accorde naturellement avec les verbes principaux au futur, sans ajouter l’incise « selon vous », absente du grec.
- source_word: ἐν δυνάμει ὑψίστου
  choice: par la puissance du Très-Haut
  rationale: Cette formulation conserve le sens instrumental de ἐν et rattache naturellement l’expression à l’action de renouveler la loi, conformément à la lecture suivie par le texte de consultation.
- source_word: πλάνου προσαγορεύσετε
  choice: vous traiterez d’imposteur
  rationale: πλάνος désigne ici quelqu’un qui égare ou trompe. « Imposteur » est actuel et idiomatique, tandis que « traiter de » exprime bien l’attribution hostile d’un titre.
- source_word: ὁρμήσετε τοῦ ἀποκτεῖναι αὐτόν
  choice: vous vous précipiterez pour le tuer
  rationale: La tournure rend l’élan violent exprimé par ὁρμάω et le but indiqué par l’infinitif.
- source_word: ἀναδεχόμενοι
  choice: vous chargeant ainsi de
  rationale: Le participe évoque le fait d’assumer ou de prendre sur soi la responsabilité du sang versé; cette expression française garde l’image de la culpabilité portée personnellement.
theological_decisions:
- issue: Sens de ἀνάστημα dans un passage textuellement difficile
  choice: sa stature
  alternative: son relèvement / sa résurrection
  rationale: Le sens ordinaire « stature » est conservé dans le texte principal afin de ne pas imposer une lecture christologique précise. Une note signale honnêtement que le mot peut aussi évoquer le relèvement, possibilité particulièrement chargée dans ce contexte.
- issue: Rattachement de « par la puissance du Très-Haut »
  choice: à l’homme qui renouvelle la loi
  alternative: à l’appellation « imposteur »
  rationale: La syntaxe transmise est difficile et la ponctuation éditoriale n’est pas décisive. La lecture choisie donne une phrase cohérente et suit l’interprétation attestée dans le texte de consultation, sans transformer « imposteur » en qualification du Très-Haut.
- issue: Image du sang innocent sur les têtes
  choice: responsabilité assumée pour son sang innocent
  alternative: reproduction littérale « prenant le sang innocent sur vos têtes »
  rationale: La formulation française retenue préserve l’image biblique de culpabilité sans devenir obscure ou artificielle.
translation_notes:
  register: Français international moderne, digne et lisible. « Le Très-Haut » conserve le titre divin traditionnel; « loi » reste en minuscule, comme dans la source. Les crochets de l’édition sont maintenus autour du verset, et le marqueur [a] figure bien dans le texte principal.
