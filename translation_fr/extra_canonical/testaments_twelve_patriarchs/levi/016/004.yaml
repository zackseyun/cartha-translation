  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/004.yaml
  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: fr
  text: Mais je vous dis qu’à cause de lui, vos lieux saints seront dévastés jusqu’au sol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια ὑμῶν
  choice: vos lieux saints
  rationale: Le neutre pluriel substantivé désigne ici les réalités ou lieux sacrés appartenant aux destinataires; «lieux saints» est naturel en français et convient au contexte de dévastation.
- source_word: ἔρημα
  choice: dévastés
  rationale: Le terme exprime l’état de désolation ou d’abandon résultant de la destruction; «dévastés» rend clairement cette force dans la phrase.
- source_word: ἕως ἐδάφους
  choice: jusqu’au sol
  rationale: Cette expression indique une dévastation complète atteignant le niveau du sol; la formulation conserve l’image grecque sans l’expliciter davantage.
- source_word: δι᾽ αὐτὸν
  choice: à cause de lui
  rationale: Rend directement la causalité et maintient l’ambiguïté du référent masculin.
theological_decisions:
- issue: Référent de αὐτόν
  choice: lui
  alternative: cet homme / cela
  rationale: Le grec emploie un pronom masculin dont le référent dépend du contexte antérieur; la traduction conserve cette anaphore sans imposer d’identification.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit étroitement le grec tout en restant idiomatique; la virgule après «lui» facilite la lecture.
