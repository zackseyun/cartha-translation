base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: fr
  text: Et maintenant, je sais que, pendant soixante-dix semaines[a], vous serez égarés, vous profanerez le sacerdoce et vous souillerez les autels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soixante-dix périodes de sept » ; le grec ne précise pas s’il s’agit de semaines ordinaires ou d’une désignation symbolique, par exemple de semaines d’années.'
    reason: Préserver l’ambiguïté chronologique de ἑβδομήκοντα ἑβδομάδας sans imposer une interprétation.
lexical_decisions:
- source_word: ἔγνωκα
  choice: je sais
  rationale: Le parfait grec exprime ici un savoir acquis dont le résultat demeure présent.
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: pendant soixante-dix semaines
  rationale: Conserve l’expression temporelle littérale et son possible caractère symbolique, sans préciser arbitrairement s’il s’agit de semaines d’années.
- source_word: πλανηθήσεσθε
  choice: vous vous égarerez
  rationale: Le passif grec peut avoir une valeur intransitive; cette formulation naturelle préserve l’idée d’égarement sans ajouter d’agent.
- source_word: ἱερωσύνην
  choice: le sacerdoce
  rationale: Désigne l’institution ou la fonction sacerdotale, et non simplement des prêtres individuels.
- source_word: βεβηλώσετε
  choice: vous profanerez
  rationale: Rend l’opposition entre ce qui est consacré et ce qui est traité comme profane.
- source_word: θυσιαστήρια
  choice: les autels
  rationale: Équivalent courant et précis du pluriel grec.
- source_word: μιανεῖτε
  choice: vous souillerez
  rationale: Exprime la contamination ou l’impureté cultuelle attachée au verbe grec.
theological_decisions:
- issue: Nature des « soixante-dix semaines »
  choice: Conserver « soixante-dix semaines » avec une note signalant l’ambiguïté
  alternative: Traduire « soixante-dix semaines d’années »
  rationale: Le texte grec ne contient pas le mot « années »; l’ajouter résoudrait une question interprétative que la traduction doit laisser ouverte.
- issue: Valeur de πλανηθήσεσθε
  choice: « vous vous égarerez »
  alternative: « vous serez égarés »
  rationale: Le futur passif peut être compris comme un passif véritable ou comme une tournure à valeur intransitive; le français retenu est naturel et n’introduit pas explicitement un agent séducteur absent du texte.
translation_notes:
  register: Français moderne, international et digne. La coordination répétée du grec est légèrement allégée en français tout en conservant la progression des trois annonces. « Sacerdoce », « profaner » et « souiller » maintiennent le registre cultuel du passage.
