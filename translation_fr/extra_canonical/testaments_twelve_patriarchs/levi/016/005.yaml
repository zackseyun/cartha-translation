source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *τόπος ὑμῖν καθαρὸς οὐκ ἔσται³², ἀλλ᾽ ἔσεσθε³³ ἐν τοῖς ἔθνεσιν εἰς κατάραν καὶ *εἰς διασκορπισμόν³⁴, ἕως³⁵ *αὐτὸς πάλιν³⁶ ἐπισκέψηται³⁷ καὶ *οἰκτειρήσῃ καὶ³⁸ προσδέξηται³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: fr
  text: Et il n’y aura pour vous aucun lieu pur ; mais vous serez parmi les nations, pour la malédiction et la dispersion, jusqu’à ce que lui-même vous visite de nouveau, ait compassion de vous et vous reçoive.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  choice: il n’y aura pour vous aucun lieu pur
  rationale: Rend directement la construction existentielle grecque et conserve καθαρός (« pur ») sans lui substituer « sûr » ou « saint ».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Traduction naturelle et fidèle ; « de la terre » présent dans l’anglais n’apparaît pas dans le texte grec fourni.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  choice: livrés à la malédiction et à la dispersion
  rationale: La tournure française exprime l’état ou la destinée introduite par εἰς tout en préservant les deux substantifs parallèles.
- source_word: ἐπισκέψηται
  choice: intervienne
  rationale: Dans ce contexte, le verbe désigne une venue attentive et agissante ; « intervienne » évite le sens moderne trop faible de « rendre visite ».
- source_word: οἰκτειρήσῃ
  choice: ait compassion de vous
  rationale: Restitue explicitement l’objet humain implicite du verbe grec, naturellement requis en français.
- source_word: προσδέξηται
  choice: vous accueille
  rationale: Exprime l’idée de recevoir favorablement ou d’accueillir, avec l’objet sous-entendu repris du contexte.
theological_decisions:
- issue: Référent du sujet αὐτός (« lui-même »)
  choice: lui-même
  alternative: Dieu lui-même
  rationale: Le verset grec ne nomme pas explicitement le sujet ; la traduction préserve cette référence contextuelle au lieu de l’expliciter théologiquement.
- issue: Valeur de πάλιν avec ἐπισκέψηται
  choice: intervienne de nouveau
  alternative: revienne vous visiter
  rationale: Conserve l’idée d’une nouvelle intervention sans imposer que le texte parle nécessairement d’un retour personnel ou d’une visitation au sens technique.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule et le parallélisme maintiennent le mouvement prophétique de la phrase. Aucun ajout de « de la terre », absent du grec fourni.
