base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: fr
  text: Vous rejetterez la Loi et, dans une mauvaise perversion, vous mépriserez les paroles des prophètes. Vous persécuterez les hommes justes et haïrez les pieux ; vous aurez en horreur les paroles des véridiques.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσετε
  choice: vous rejetterez
  rationale: Le verbe exprime l’idée d’écarter, d’invalider ou de refuser une autorité ; « rejetterez » rend clairement ici le refus de la Loi.
- source_word: ἐξουδενώσετε
  choice: vous mépriserez
  rationale: Rend le fait de tenir pour rien ou de traiter avec dédain, dans un français naturel.
- source_word: ἐν διαστροφῇ κακῇ
  choice: dans une perversion mauvaise
  rationale: Conserve la formulation grecque appuyée et son jugement moral, sans en préciser artificiellement la portée.
- source_word: διώξετε
  choice: vous persécuterez
  rationale: Dans ce contexte hostile, le verbe désigne la poursuite persécutrice plutôt qu’une simple action de suivre.
- source_word: εὐσεβεῖς
  choice: ceux qui sont attachés à Dieu
  rationale: Exprime la piété et le respect religieux en langage moderne, sans coloration confessionnelle particulière.
- source_word: βδελύξεσθε
  choice: vous aurez en horreur
  rationale: Préserve la forte répulsion exprimée par le grec.
- source_word: ἀληθινῶν
  choice: des hommes véridiques
  rationale: Le génitif pluriel substantivé désigne vraisemblablement des personnes caractérisées par la vérité ; cette formulation conserve ce rapport avec leurs paroles.
theological_decisions:
- issue: Portée de « la Loi »
  choice: la Loi
  alternative: la loi
  rationale: La majuscule signale naturellement, dans ce contexte juif, la Loi reçue comme autorité religieuse, sans ajouter une identification plus étroite absente du verset.
- issue: Sens de εὐσεβεῖς
  choice: ceux qui sont attachés à Dieu
  alternative: les hommes pieux
  rationale: La formulation retenue rend explicitement l’orientation religieuse du terme tout en restant accessible et non confessionnelle.
- issue: Référent de ἀληθινῶν
  choice: les hommes véridiques
  alternative: les paroles vraies
  rationale: La construction distingue probablement les « paroles » de ceux qui sont véridiques ; la traduction ne transforme donc pas l’adjectif en simple qualificatif de « paroles ».
translation_notes:
  register: Français moderne, international et digne. Le parallélisme accusateur et la succession des futurs sont conservés. La formulation reste proche du grec tout en évitant des tournures inutilement archaïques.
