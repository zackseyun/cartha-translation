source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: Καὶ ἔχει πῦρ χιόνα καὶ⁴ κρύσταλλον ἡτοιμασμένον⁵ εἰς A ª
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
translation:
  language: fr
  text: 'Il contient du feu, de la neige et de la glace, préparés pour le jour fixé par Dieu, comme juste jugement de Dieu sur les humains. Là se trouvent tous les esprits des châtiments, pour exercer la vengeance contre ceux qui méprisent la Loi. Au-dessus se trouve le lieu saint, où sont les troupes des armées désignées pour le jour du jugement, afin d’exercer la vengeance contre les esprits de tromperie et de Béliar[b]. Au-dessus d’eux se trouvent les saints. Au plus haut de tout demeure la Grande Gloire, bien au-dessus de toute sainteté. Dans le ciel qui lui est adjacent se trouvent les archanges : ils servent le Seigneur et accomplissent auprès de lui l’expiation[a] pour tous les péchés commis involontairement par les justes, en offrant au Seigneur un parfum d’agréable odeur, une offrande raisonnable et non sanglante[c]. Dans le ciel situé au-dessous se trouvent les anges qui apportent les réponses aux anges de la présence du Seigneur. Dans le ciel qui vient encore au-dessous se trouvent
    les trônes et les dominations, où des hymnes sont continuellement offerts à Dieu. Ainsi, quand le Seigneur porte son regard sur nous depuis le degré de sa sainteté, les cieux sont ébranlés. La terre aussi est ébranlée jusque dans ses fondations et, toute tremblante, elle est ébranlée jusque dans ses profondeurs. Mais les fils des hommes, ne comprenant pas ces choses, s’égarent et provoquent sa colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendent le Seigneur propice ». Dans un contexte cultuel, le verbe grec peut exprimer l’expiation ou la propitiation.
    reason: lexical_alternative
  - marker: b
    text: « Béliar » reproduit la forme grecque du nom, souvent rendue par « Bélial » dans d’autres traditions.
    reason: lexical_alternative
  - marker: c
    text: L’expression « une offrande raisonnable et non sanglante » peut aussi se comprendre comme « une offrande rationnelle » ou, de manière plus interprétative, « une offrande spirituelle et non sanglante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: feu
  rationale: Équivalent direct, conservant l’image élémentaire du texte grec.
- source_word: χιόνα
  choice: neige
  rationale: Rend directement l’accusatif de χιών et maintient l’énumération concrète.
- source_word: κρύσταλλον
  choice: glace
  rationale: Dans ce contexte cosmologique, le terme désigne vraisemblablement la glace ou le cristal glacé; «glace» s’accorde naturellement avec le feu et la neige.
- source_word: ἡτοιμασμένον
  choice: préparés
  rationale: Le pluriel français rattache naturellement le participe à l’ensemble des trois éléments énumérés, sans modifier le sens de préparation en vue du jugement.
- source_word: Beliar
  choice: Béliar
  rationale: Translittération française de la forme grecque du nom, distinguée par une note de la forme traditionnelle «Bélial».
- source_word: reasonable offering
  choice: offrande raisonnable
  rationale: Conserve l’ambivalence de la qualification transmise par la couche de consultation, plutôt que d’imposer l’interprétation «spirituelle».
- source_word: sons of men
  choice: fils des hommes
  rationale: Maintient l’expression sémitisante et son registre ancien sans la réduire simplement à «les humains».
theological_decisions:
- issue: Fonction expiatoire des archanges
  choice: «accomplissent auprès de lui l’expiation» avec note
  alternative: «rendent le Seigneur propice» ou «font propitiation au Seigneur»
  rationale: La formulation française garde le cadre cultuel et évite de trancher silencieusement la nuance du verbe entre expiation et propitiation.
- issue: Identité des êtres situés au-dessus des armées
  choice: «les saints»
  alternative: «les êtres saints»
  rationale: La désignation substantivée préserve l’indétermination du texte quant à leur identité précise.
- issue: Le «degré» de la sainteté divine
  choice: «depuis le degré de sa sainteté»
  alternative: «du haut de sa sainteté»
  rationale: La formulation conserve l’imagerie cosmologique et hiérarchisée au lieu de la transformer en simple locution figurée.
- issue: Nature de l’offrande non sanglante
  choice: «raisonnable et non sanglante» avec note
  alternative: «spirituelle et non sanglante»
  rationale: Le choix ne détermine pas à lui seul si l’offrande est rationnelle, spirituelle ou conforme au culte véritable.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques traditionnels («archanges», «trônes», «dominations») et les répétitions structurantes ont été conservés. La syntaxe a été légèrement fluidifiée, tout en maintenant les ambiguïtés cultuelles et théologiques signalées par les notes.
