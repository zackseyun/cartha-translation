source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: ῎Ακουσον οὖν¹ περὶ τῶν δει- χθέντων σοι οὐρα- νῶν· ὁ κατώτερος *διὰ τοῦτό σοί ἐστι στυγνός, ἐπειδὴ² ὁρᾷ πάσας³ τὰς ἀδικίας τῶν ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: fr
  text: 'Écoute donc ce qui concerne les cieux qui t’ont été montrés. Le ciel le plus bas est lugubre pour cette raison : il voit toutes les injustices des êtres humains.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον οὖν
  choice: Écoute donc
  rationale: Rend directement l’impératif et la particule de transition, dans un français naturel et digne.
- source_word: περὶ τῶν δειχθέντων σοι οὐρανῶν
  choice: ce qui concerne les cieux qui t’ont été montrés
  rationale: Conserve le pluriel « cieux », le passif et le destinataire, tout en évitant la tournure moins naturelle « écoute au sujet de ».
- source_word: ὁ κατώτερος
  choice: Le plus bas
  rationale: Le comparatif substantivé désigne ici le ciel inférieur parmi ceux qui viennent d’être mentionnés; « le plus bas » est idiomatique dans ce contexte hiérarchisé.
- source_word: στυγνός
  choice: a un aspect lugubre
  rationale: στυγνός évoque une apparence sombre, morne ou lugubre. Cette formulation exprime cet état visible sans réduire le mot à une simple obscurité physique.
- source_word: ἀδικίας
  choice: injustices
  rationale: Préserve le sens large d’actes ou de réalités contraires à la justice, sans préciser indûment « péchés » ou « mauvaises actions ».
- source_word: τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: Rend le terme générique de manière inclusive et précise en français moderne.
theological_decisions:
- issue: Personnification du ciel inférieur
  choice: « il voit »
  alternative: « on y voit » ou « il est témoin de »
  rationale: Le grec attribue explicitement au ciel inférieur l’action de voir (ὁρᾷ). La traduction conserve cette personnification et l’étrangeté cosmologique du texte au lieu de l’expliquer.
- issue: Nature des ἀδικίαι humaines
  choice: « toutes les injustices »
  alternative: « toutes les actions injustes » ou « toutes les iniquités »
  rationale: « Injustices » maintient l’ampleur et une certaine ambiguïté du pluriel grec; « iniquités » serait plus marqué religieusement et moins courant.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La phrase conserve l’imagerie cosmologique et la personnification du ciel. Aucun marqueur de note n’est requis.
