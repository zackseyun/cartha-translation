  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: fr
  text: 'Et il dit : « Je suis l’ange qui intercède pour le peuple d’Israël, afin de ne pas les frapper. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραιτούμενος
  choice: qui intercède pour
  rationale: Le participe moyen peut exprimer ici une démarche de supplication ou d’intercession destinée à détourner le châtiment. « Intercéder pour » rend naturellement cette fonction en français sans préciser indûment auprès de qui l’ange intervient.
- source_word: τὸ γένος Ἰσραήλ
  choice: le peuple d’Israël
  rationale: γένος désigne ici la lignée ou le peuple issu d’Israël. « Peuple » est idiomatique et dignifié en français moderne, tandis que « race » aurait aujourd’hui des connotations étrangères au contexte.
- source_word: πατάξαι
  choice: soient frappés
  rationale: Le verbe signifie frapper, souvent au sens d’infliger un coup ou un châtiment. La formulation passive conserve l’indétermination de l’agent et n’ajoute pas l’idée de destruction totale.
theological_decisions:
- issue: Nature de l’action de l’ange
  choice: « intercède pour »
  alternative: « supplie en faveur de » ou « cherche à préserver »
  rationale: Le texte présente l’ange comme intervenant afin d’empêcher qu’Israël soit frappé. « Intercède » conserve cette fonction médiatrice sans développer une angélologie absente du verset.
- issue: Portée du châtiment évité
  choice: « ne soient pas frappés »
  alternative: « ne soient pas abattus » ou « ne soient pas frappés à mort »
  rationale: Le grec ne comporte aucun équivalent explicite de « entièrement », « à mort » ou « anéantis ». La traduction maintient donc l’ambiguïté sur la gravité précise du coup.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe suit étroitement le grec tout en évitant le calque peu idiomatique « la race d’Israël ». Le pluriel « ils » reprend collectivement « le peuple d’Israël », conformément au pronom grec αὐτούς.
