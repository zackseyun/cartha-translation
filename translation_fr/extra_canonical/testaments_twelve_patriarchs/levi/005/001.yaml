  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: fr
  text: En cela, l’ange m’ouvrit les portes du ciel, et je vis le Très-Haut, le Saint, assis sur un trône.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: là
  rationale: Dans ce contexte narratif, l’expression renvoie vraisemblablement à la situation ou au moment de la vision. « Là » donne un français naturel sans préciser davantage un grec dont le référent demeure peu explicite.
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: Rend directement le substantif grec défini, sans identifier l’ange au-delà de ce que dit le texte.
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: les portes du ciel
  rationale: Traduction concrète et traditionnelle de l’image grecque, au pluriel comme dans la source.
- source_word: τὸν ἅγιον ὕψιστον
  choice: le Très-Haut saint
  rationale: 'Conserve les deux qualifications et leur tension syntaxique : ὕψιστον fonctionne comme titre substantivé, tandis que ἅγιον le qualifie.'
- source_word: ἐπὶ θρόνου καθήμενον
  choice: assis sur un trône
  rationale: Restitue naturellement la posture et la localisation exprimées par le participe grec.
theological_decisions:
- issue: Identification de la figure céleste
  choice: le Très-Haut saint
  alternative: le Saint, le Très-Haut
  rationale: Le texte grec associe « saint » et « Très-Haut » à une seule figure sans fournir ici de nom explicite. La traduction ne précise donc pas davantage son identité et évite de transformer les deux termes en deux désignations séparées.
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au récit visionnaire écrit. La formule « Et là » privilégie la fluidité tout en laissant ouvert le référent exact de ἐν τούτῳ.
