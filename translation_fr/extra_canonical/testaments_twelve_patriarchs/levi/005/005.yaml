  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: fr
  text: 'Et je lui dis : « Je t’en prie, Seigneur, enseigne-moi ton nom, afin que je t’invoque au jour de la détresse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: Je t’en prie
  rationale: Rend naturellement en français la supplication directe exprimée par le verbe δέομαι suivi du génitif.
- source_word: δίδαξόν με τὸ ὄνομά σου
  choice: enseigne-moi ton nom
  rationale: Conserve l’expression grecque et sa portée relationnelle ou révélatrice sans la paraphraser.
- source_word: ἐπικαλέσομαί σε
  choice: je puisse t’invoquer
  rationale: « Invoquer » exprime l’appel adressé au Seigneur, particulièrement dans la détresse, et garde le registre religieux du grec.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: au jour de la détresse
  rationale: Formulation française naturelle qui demeure proche de la construction grecque et de son caractère défini dans ce contexte.
theological_decisions:
- issue: Sens de la connaissance du nom divin
  choice: enseigne-moi ton nom
  alternative: fais-moi connaître ton nom
  rationale: La traduction formelle préserve l’image et l’ambiguïté du texte, sans préciser si le nom doit être appris, révélé ou compris.
- issue: Nature du « jour de la détresse »
  choice: au jour de la détresse
  alternative: dans un jour de détresse
  rationale: L’expression définie suit la lecture éditoriale et la révision anglaise, tout en évitant d’identifier ce jour à un événement eschatologique particulier.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond aux formes grecques singulières et convient à l’adresse personnelle au Seigneur.
