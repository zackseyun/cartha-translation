  text: Καὶ εἰπέ μοι⁵· Λευί, σοὶ⁶ ἔδωκα⁷ *τὰς εὐλογίας τῆς ἱερατείας⁸ ἕως⁹ ἐλθὼν¹⁰ κατοικήσω¹¹ *ἐν μέσῳ¹² τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/002.yaml
  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: fr
  text: 'Et il me dit : « Lévi, c’est à toi que j’ai donné les bénédictions du sacerdoce, jusqu’à ce que je vienne habiter au milieu d’Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοὶ
  choice: c’est à toi que
  rationale: La tournure emphatique rend la mise en relief du pronom grec placé en tête.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: les bénédictions du sacerdoce
  rationale: Traduction directe qui conserve le pluriel « bénédictions » et le rapport génitif avec la fonction sacerdotale.
- source_word: κατοικήσω
  choice: j’habite
  rationale: « Habiter » exprime naturellement l’établissement ou la demeure durable porté par le verbe grec.
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: au milieu d’Israël
  rationale: Rend littéralement l’expression spatiale sans préciser si Israël désigne le peuple ou son territoire.
theological_decisions:
- issue: Identité du locuteur et portée de sa venue
  choice: Conserver la première personne sans identifier explicitement le locuteur
  alternative: Préciser « Dieu » ou donner à la venue une interprétation messianique
  rationale: Le verset isolé ne nomme pas ici le locuteur; l’ajout d’une identification résoudrait une question que le grec laisse au contexte.
- issue: Valeur temporelle de ἕως avec le subjonctif
  choice: « jusqu’à ce que je vienne habiter »
  alternative: « jusqu’à ma venue, lorsque j’habiterai »
  rationale: Cette formulation préserve le lien temporel et la possible tension sur la durée des bénédictions sacerdotales, sans l’expliquer doctrinalement.
translation_notes:
  register: Français moderne, digne et accessible. L’emphase grecque sur « à toi » est conservée par une construction clivée; la syntaxe de la citation reste fluide tout en suivant étroitement le texte source.
