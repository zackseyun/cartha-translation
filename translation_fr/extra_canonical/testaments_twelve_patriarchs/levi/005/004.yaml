  source_fidelity: Le sens de συνετέλεσα appliqué aux fils de Hamor est correctement compris comme une mise à mort ou destruction accomplie. « Les fils de Hamor » rend fidèlement τοὺς υἱοὺς Ἐμμώρ, et « les tablettes des pères » conserve sans ajout l’expression énigmatique ἐν πλαξὶ τῶν πατέρων. Aucun élément tel que « célestes » ne doit être introduit.
