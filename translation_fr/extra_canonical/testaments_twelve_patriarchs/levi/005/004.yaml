  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: fr
  text: Et, à cette époque-là, j’anéantis les fils de Hamor, comme il est écrit sur les tablettes des pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: j’exterminai
  rationale: Dans ce contexte de destruction de personnes, le verbe exprime l’idée de mener leur destruction à son terme. « J’exterminai » est naturel et conserve cette force, sans ajouter d’élément absent du grec.
- source_word: τῷ καιρῷ ἐκείνῳ
  choice: à cette époque-là
  rationale: Rend l’indication temporelle avec un français actuel tout en conservant la valeur démonstrative de ἐκείνῳ.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: les fils de Hamor
  rationale: Traduction directe de υἱούς et forme française courante du nom biblique Ἐμμώρ.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: sur les tablettes des pères
  rationale: Rend littéralement les tablettes et leur complément. Aucun qualificatif tel que « célestes » n’est ajouté, puisqu’il est absent du texte grec.
theological_decisions:
- issue: Nature des « tablettes des pères »
  choice: Conserver « les tablettes des pères » sans explicitation
  alternative: les tablettes célestes des pères
  rationale: Le grec ne comporte aucun équivalent de « célestes ». La formulation énigmatique doit rester ouverte plutôt que d’être interprétée dans le corps du texte.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple convient au registre narratif du testament. La formulation conserve la densité et l’ambiguïté de la référence aux « tablettes des pères ».
