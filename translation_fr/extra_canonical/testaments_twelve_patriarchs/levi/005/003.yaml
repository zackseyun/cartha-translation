  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: fr
  text: 'Alors l’ange me fit descendre sur la terre, me donna une arme et une épée, puis me dit : « Venge Dina, ta sœur, à Sichem, et moi, je serai avec toi, car le Seigneur m’a envoyé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπλον
  choice: une arme
  rationale: Le terme désigne largement une arme ou un équipement de combat; « arme » préserve cette portée sans imposer le sens plus précis de « bouclier ».
- source_word: ῥομφαίαν
  choice: une épée
  rationale: Rend naturellement en français l’arme blanche distincte mentionnée après ὅπλον, sans surspécifier sa forme.
- source_word: Ποίησον ἐκδίκησιν
  choice: Exerce la vengeance
  rationale: Reproduit l’idée d’accomplir une vengeance punitive dans un registre digne, tout en restant idiomatique.
- source_word: ἐν Συχὲμ
  choice: à Sichem
  rationale: La préposition situe l’action dans la ville; « Sichem » est la forme française traditionnelle du toponyme.
- source_word: ὑπὲρ Δείνας τῆς ἀδελφῆς σου
  choice: pour Dina, ta sœur
  rationale: « Pour » conserve la valeur de défense ou de vengeance en faveur de Dina; l’apposition est naturelle en français.
theological_decisions:
- issue: Fondement de la présence de l’ange
  choice: « car le Seigneur m’a envoyé »
  alternative: « puisque le Seigneur m’a envoyé »
  rationale: « Car » conserve le lien causal explicite de ὅτι sans préciser davantage la nature de la mission ni résoudre la tension morale du commandement.
- issue: Ordre de vengeance attribué à l’ange
  choice: Traduction directe sans atténuation
  alternative: Paraphrase morale telle que « rends justice »
  rationale: ἐκδίκησις exprime bien la vengeance ou la rétribution. Le rendre par « justice » atténuerait le texte et résoudrait indûment sa tension théologique.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « une arme et une épée » est maintenue parce qu’elle appartient au texte grec, même si les catégories peuvent se recouper. « Et moi, je serai avec toi » fait ressortir le pronom grec κἀγώ sans lourdeur excessive.
