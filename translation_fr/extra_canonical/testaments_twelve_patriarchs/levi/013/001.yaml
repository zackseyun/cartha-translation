id: T12P.LEV.13.1
reference: Testament of Levi 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *νῦν, τέκνα μου¹, ἐντέλλομαι ὑμῖν, φοβεῖσθε² *Κύριον τὸν Θεὸν ὑμῶν³ Γἐξ ὅλης τῆς καρδίας ὑμῶν⁴⁾, καὶ πορεύεσθε ἐν ἁπλότητι⁵ *κατὰ πάντα τὸν νόμον αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, je vous donne cet ordre : craignez le Seigneur votre Dieu de tout votre cœur et marchez avec simplicité, conformément à toute sa loi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: je vous donne cet ordre
  rationale: Rend explicitement l’idée d’un commandement personnel et solennel, dans un français naturel.
- source_word: φοβεῖσθε
  choice: craignez
  rationale: Conserve le sens religieux et éthique de la crainte révérencielle sans le réduire à « respectez ».
- source_word: ἐξ ὅλης τῆς καρδίας ὑμῶν
  choice: de tout votre cœur
  rationale: Expression française idiomatique correspondant directement à la totalité de l’engagement intérieur.
- source_word: πορεύεσθε
  choice: marchez
  rationale: Préserve la métaphore biblique de la conduite de vie.
- source_word: ἐν ἁπλότητι
  choice: avec simplicité
  rationale: 'Maintient la portée potentiellement large du terme : simplicité, droiture et absence de duplicité.'
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: conformément à toute sa loi
  rationale: Exprime clairement la conformité à l’ensemble de la loi, sans lourdeur excessive.
theological_decisions:
- issue: Sens de φοβεῖσθε appliqué à Dieu
  choice: craignez
  alternative: révérez
  rationale: « Craignez » conserve la tension biblique entre respect, révérence et crainte, tandis que « révérez » en réduirait la gamme sémantique.
- issue: Portée de ἁπλότης
  choice: simplicité
  alternative: droiture
  rationale: Le grec peut évoquer la sincérité ou l’absence de duplicité; « simplicité » préserve cette ambiguïté plutôt que de la résoudre en une seule qualité morale.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le ton testamentaire et exhortatif du grec, avec une ponctuation qui clarifie l’ordre principal sans alourdir la phrase.
