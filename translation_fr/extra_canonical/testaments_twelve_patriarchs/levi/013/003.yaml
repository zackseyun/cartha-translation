  text: Ὅτι¹⁴ πᾶς, *ὃς γνώσεται¹⁵ *νόμον Κυρίου¹⁶, τιμηθήσεται, καὶ οὐκ ἔσται¹⁷ ξένος, ὅπου ὑπάγει¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: fr
  text: Car quiconque connaîtra la loi du Seigneur sera honoré et ne sera pas un étranger, où qu’il aille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς, ὃς γνώσεται
  choice: quiconque connaîtra
  rationale: Reproduit la portée universelle de πᾶς ὃς et la valeur future de γνώσεται, tout en restant naturel en français.
- source_word: νόμον Κυρίου
  choice: la loi du Seigneur
  rationale: Équivalent direct et traditionnel, sans ajout interprétatif.
- source_word: τιμηθήσεται
  choice: sera honoré
  rationale: Conserve le passif futur du grec et son sens de considération accordée.
- source_word: οὐκ ἔσται ξένος
  choice: ne sera étranger nulle part
  rationale: ξένος peut désigner un étranger ou quelqu’un qui n’est pas reconnu comme appartenant au lieu; l’ajout syntaxique « nulle part » exprime naturellement en français la portée de la proposition locative suivante.
- source_word: ὅπου ὑπάγει
  choice: où il ira
  rationale: Rend simplement la destination ou le déplacement exprimé par ὑπάγει dans ce contexte à orientation future.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme des deux futurs et évite de préciser qui accordera l’honneur ou de quelle manière l’intéressé cessera d’être étranger.
