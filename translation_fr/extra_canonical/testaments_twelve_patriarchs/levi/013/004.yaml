  source_fidelity: 'Le sens général est bien rendu : acquisition de nombreux amis, désir de le servir et d’entendre la loi provenant de sa bouche. Toutefois, la majuscule à « Loi » interprète le νόμου grec anarthre comme désignant nécessairement la Loi religieuse reconnue. Le grec ne l’impose pas et la minuscule préserve mieux cette ouverture.'
  naturalness: La formulation est globalement naturelle en français moderne. « Oui » rend l’affirmation renforcée de Καίγε, mais « Et même » conserve plus clairement sa valeur connective et emphatique dans un registre scripturaire sobre.
