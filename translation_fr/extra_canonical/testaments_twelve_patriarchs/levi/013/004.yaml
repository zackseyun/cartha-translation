source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: fr
  text: Et même, il se fera beaucoup d’amis, plus que ses parents, et beaucoup de gens désireront le servir et entendre la loi de sa bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Oui
  rationale: Marque avec naturel l’affirmation renforcée portée par Καίγε dans ce contexte.
- source_word: κτήσεται
  choice: il se fera
  rationale: Rend idiomatiquement l’idée d’acquérir ou de gagner des amis.
- source_word: ὑπὲρ γονεῖς
  choice: plus que ses parents
  rationale: Conserve la comparaison inhabituelle du grec sans la remplacer par l’idée moins précise d’amis « en plus » de ses parents.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: beaucoup de gens
  rationale: Expression française courante correspondant au sens partitif de la tournure grecque.
- source_word: νόμου
  choice: la Loi
  rationale: Le singulier sans article peut désigner ici la Loi comme enseignement reconnu; la majuscule signale ce référent probable sans développer une interprétation confessionnelle.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: Préserve l’image sémitisante et la transmission orale directe exprimées par le grec.
theological_decisions:
- issue: Sens de νόμου sans article
  choice: la Loi
  alternative: une loi / la loi
  rationale: Le contexte sapientiel et religieux favorise la Loi ou son enseignement; la formulation reste concise et ne précise pas davantage son contenu.
- issue: Comparaison ὑπὲρ γονεῖς
  choice: plus que ses parents
  alternative: en dehors de ses parents / au-delà de ses parents
  rationale: Le grec présente une comparaison susceptible de paraître abrupte. La traduction conserve cette tension au lieu de la transformer en simple addition.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec tout en étant idiomatique; aucune note n’est nécessaire.
