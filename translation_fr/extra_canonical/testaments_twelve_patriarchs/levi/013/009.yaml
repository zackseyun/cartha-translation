  source_fidelity: La phrase rend correctement la portée généralisante, l’enseignement et la mise en pratique du bien. Toutefois, « partagera le trône des rois » transforme la construction σύνθρονος βασιλέων (« siégeant/établi sur le trône avec des rois ») en un trône possédé par les rois et partagé avec eux. Une formulation plus proche conserve l’association avec des rois sans surinterpréter le génitif.
