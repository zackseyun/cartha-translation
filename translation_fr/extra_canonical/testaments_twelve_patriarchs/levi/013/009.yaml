source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶς ὃς ἂν διδάσκει καλὰ καὶ πράττει⁶⁰ σύνθρονος ἔσται⁶¹ βασιλέων⁶², ὥσπερ⁶³ καὶ Ἰωσὴφ ὁ ἀδελφός⁶⁴ μου⁶⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/009.yaml
  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: fr
  text: Quiconque enseigne ce qui est bien et le met en pratique sera assis sur un trône avec des rois, tout comme Joseph, mon frère, lui aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὃς ἂν
  choice: Quiconque
  rationale: 'Rend naturellement en français la tournure grecque généralisante : « toute personne qui ».'
- source_word: διδάσκει καλὰ
  choice: enseigne ce qui est bien
  rationale: καλά désigne ici les choses bonnes ou justes enseignées, sans imposer un sens plus étroit.
- source_word: καὶ πράττει
  choice: et le met en pratique
  rationale: Le complément sous-entendu reprend ce qui est bien ; cette formulation française exprime clairement l'accord entre enseignement et conduite.
- source_word: σύνθρονος ἔσται βασιλέων
  choice: partagera le trône des rois
  rationale: σύνθρονος signifie « associé au trône » ou « siégeant sur le trône avec ». Cette formulation conserve l'image royale et évite le calque peu naturel « sera co-trônant ».
- source_word: ὥσπερ καὶ Ἰωσὴφ ὁ ἀδελφός μου
  choice: comme Joseph, mon frère
  rationale: La comparaison renvoie au même statut attribué à Joseph ; « mon frère » est mis en apposition selon l'usage naturel du français.
theological_decisions:
- issue: Nature de la promesse liée à l'enseignement et à la pratique du bien
  choice: Conserver l'image d'un partage du trône avec des rois
  alternative: Interpréter abstraitement comme une élévation à un rang honorable
  rationale: Le grec emploie explicitement le vocabulaire du trône et des rois ; il convient de préserver cette image sans préciser si sa portée est politique, honorifique ou eschatologique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme entre enseigner le bien et le pratiquer, ainsi que l'image concrète du trône.
