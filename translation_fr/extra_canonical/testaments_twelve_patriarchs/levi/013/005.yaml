  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/005.yaml
  text: Therefore do righteousness, my children, on the earth, so that you may be found in the heavens.
translation:
  language: fr
  text: Pratiquez donc la justice, mes enfants, sur la terre, afin que vous la trouviez dans les cieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « afin que vous trouviez dans les cieux »; l’objet n’est pas exprimé. « La justice » est repris de la proposition précédente. Le signe † dans l’édition indique une difficulté textuelle à cet endroit.'
    reason: Rendre la voix active de εὕρητε, signaler l’objet implicite et préserver la difficulté textuelle sans imposer la lecture passive de l’audit anglais.
lexical_decisions:
- source_word: Ποιήσατε … δικαιοσύνην
  choice: Pratiquez … la justice
  rationale: L’expression grecque signifie littéralement « faites la justice ». « Pratiquez la justice » est naturel en français tout en conservant l’idée d’une conduite juste concrète.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse affectueuse et pédagogique du grec.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Traduction idiomatique qui maintient le contraste spatial avec « dans les cieux ».
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel du grec est conservé plutôt que normalisé en « au ciel ».
theological_decisions:
- issue: Sens de †εὕρητε
  choice: afin d’être trouvés
  alternative: afin que vous trouviez [la justice]
  rationale: 'La forme transmise est textuellement signalée comme incertaine et peut formellement se lire « que vous trouviez ». Cependant, sans objet exprimé, le contexte et la tradition de traduction soutiennent un sens passif ou intransitif : « être trouvés ». Une note préserve l’autre lecture possible sans ajouter silencieusement un objet au texte.'
translation_notes:
  register: Français moderne, digne et accessible. L’impératif « Pratiquez » exprime naturellement l’appel moral; le pluriel « les cieux » respecte la forme grecque. La formulation passive, légèrement solennelle, est maintenue en raison de l’ambiguïté réelle du texte source.
