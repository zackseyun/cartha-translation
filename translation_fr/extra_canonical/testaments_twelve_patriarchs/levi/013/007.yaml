revisions:
- from: Acquérez la sagesse dans la crainte de Dieu, car même si survient la captivité, que villes et campagnes sont détruites, et que l’or, l’argent et tous les biens disparaissent, personne ne peut enlever au sage sa sagesse, si ce n’est l’aveuglement dû à l’impiété et l’endurcissement dû au péché.
  to: Acquérez la sagesse dans la crainte de Dieu, car si une captivité survient, si des villes et des pays sont détruits, et si l’or, l’argent et toute possession périssent, personne ne peut enlever au sage sa sagesse, si ce n’est l’aveuglement de l’impiété et l’endurcissement du péché.
  rationale: La révision remplace la concession par la condition exprimée dans le grec, corrige la coordination des propositions conditionnelles et évite de trancher par une paraphrase causale la relation exprimée par les génitifs finaux. Elle conserve le parallélisme rhétorique entre les pertes extérieures et la sagesse du sage.
