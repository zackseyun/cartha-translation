  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: fr
  text: Acquérez la sagesse dans la crainte de Dieu, car si une captivité survient, si des villes et des pays sont détruits, et si l’or, l’argent et toute possession périssent, personne ne peut enlever au sage sa sagesse, si ce n’est l’aveuglement de l’impiété et l’endurcissement du péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: Acquérez la sagesse
  rationale: L’impératif aoriste invite à se procurer ou à gagner la sagesse; «acquérez» restitue directement cette idée dans un registre digne et courant.
- source_word: ἐν φόβῳ Θεοῦ
  choice: dans la crainte de Dieu
  rationale: Conserve l’expression religieuse grecque et sa portée de respect révérenciel sans la réduire à la simple peur.
- source_word: πόλεις καὶ χῶραι
  choice: villes et campagnes
  rationale: χῶραι désigne ici les territoires ou régions opposés aux villes; «campagnes» forme en français une paire naturelle avec «villes».
- source_word: πᾶσα κτῆσις
  choice: tous les biens
  rationale: Dans cette énumération de richesses susceptibles de disparaître, κτῆσις renvoie aux possessions; le pluriel collectif français est naturel.
- source_word: ἀφελέσθαι
  choice: enlever
  rationale: Rend le sens de retirer ou ôter quelque chose à quelqu’un, en conservant l’image de la sagesse comme bien inaliénable.
- source_word: τύφλωσις ἀσεβείας
  choice: l’aveuglement dû à l’impiété
  rationale: Le génitif peut exprimer la source ou la caractérisation; «dû à» rend clairement le rôle destructeur de l’impiété sans identifier les deux notions.
- source_word: πώρωσις ἁμαρτίας
  choice: l’endurcissement dû au péché
  rationale: πώρωσις évoque l’insensibilisation ou l’endurcissement; la formulation française préserve le parallélisme avec la proposition précédente.
theological_decisions:
- issue: Sens de «si ce n’est» dans la conclusion
  choice: 'Conserver l’exception paradoxale: nul agent extérieur ne peut ôter la sagesse, sauf l’aveuglement et l’endurcissement liés au mal.'
  alternative: 'Reformuler comme une condition explicite: «à moins qu’il ne soit aveuglé par l’impiété et endurci par le péché».'
  rationale: Le grec εἰ μὴ introduit directement les deux abstractions comme seules exceptions. La traduction conserve cette tension rhétorique sans ajouter un sujet ou un mécanisme absent du texte.
- issue: Portée de la crainte de Dieu
  choice: «crainte de Dieu»
  alternative: «respect de Dieu» ou «révérence envers Dieu»
  rationale: La formule traditionnelle et intelligible préserve toute la gamme sémantique de φόβος, y compris la révérence et la crainte, sans en réduire la force.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la longue progression conditionnelle et le contraste entre les biens extérieurs périssables et la sagesse intérieure. «Même si» rend naturellement ἐὰν avec la valeur concessive suggérée par le raisonnement.
