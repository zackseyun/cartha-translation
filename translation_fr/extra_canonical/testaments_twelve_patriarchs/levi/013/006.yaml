source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: fr
  text: Semez de bonnes choses dans vos âmes, et vous les trouverez dans votre vie. Mais si vous semez de mauvaises choses, vous récolterez toute agitation et toute détresse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρατε / σπείρητε
  choice: Semez / si vous semez
  rationale: Conserve la métaphore agricole et le contraste exhortatif du grec.
- source_word: ἐν ταῖς ψυχαῖς ὑμῶν
  choice: dans vos âmes
  rationale: Rend directement le pluriel ψυχαῖς sans réduire son sens à la pensée ou au cœur.
- source_word: ἀγαθὰ / πονηρά
  choice: de bonnes choses / de mauvaises choses
  rationale: Préserve la substantivation et le parallélisme moral des adjectifs neutres grecs.
- source_word: εὑρήσετε αὐτὰ ἐν τῇ ζωῇ ὑμῶν
  choice: vous les trouverez dans votre vie
  rationale: Suit la formulation grecque, distincte du verbe « récolter » employé dans la proposition suivante.
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: toutes sortes de troubles et de détresses
  rationale: Exprime idiomatiquement la portée distributive de πᾶσαν avec deux noms coordonnés, tout en conservant leur distinction.
- source_word: θερίσετε
  choice: vous récolterez
  rationale: Maintient l'image de la moisson qui répond au fait de semer.
theological_decisions:
- issue: Rapport entre les semailles morales et leurs conséquences
  choice: Conserver l'affirmation directe selon laquelle le bien semé se retrouve dans la vie et le mal produit troubles et détresses.
  alternative: Préciser qu'il s'agit exclusivement d'une rétribution divine, présente ou future.
  rationale: Le grec ne précise ni l'agent de la rétribution ni son calendrier; la traduction préserve cette ouverture.
translation_notes:
  register: Français moderne, clair et digne. L'impératif initial garde la force de l'exhortation; le parallélisme entre semer et récolter demeure perceptible.
