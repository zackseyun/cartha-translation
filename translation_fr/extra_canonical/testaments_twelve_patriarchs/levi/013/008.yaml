review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la condition, les « œuvres mauvaises » et le contraste entre terre étrangère et patrie. Toutefois, il transforme deux prédications grecques en actions différentes : γενήσεται ... σοφία ... λαμπρά signifie que la sagesse « deviendra/glorifiera » pour la personne, non qu’elle « lui donnera de l’éclat » ; εὑρηθήσεται φίλος est passif et désigne la personne comme « trouvée amie », non comme trouvant un ami.'
  naturalness: La formulation révisée reste naturelle en français international moderne tout en conservant le parallélisme sentencieux et les ellipses expressives du grec.
  terminology: « Œuvres mauvaises », « sagesse », « terre étrangère », « patrie », « ennemis » et « ami » conservent les termes et contrastes du texte source sans ajout interprétatif.
  issues:
  - severity: medium
    issue: « la sagesse lui donnera de l’éclat »
    rationale: 'Le grec fait de σοφία le sujet de γενήσεται et de λαμπρά son prédicat : la sagesse devient « éclatante/glorieuse » pour lui, y compris auprès des ennemis. La version proposée introduit un sens causatif absent.'
  - severity: high
    issue: « il trouvera un ami »
    rationale: 'εὑρηθήσεται φίλος est un futur passif : « il sera trouvé [comme] ami » ou « on le trouvera ami ». Le projet inverse les rôles en faisant de la personne le sujet qui trouve un autre ami.'
  revised_text: Car si quelqu’un se garde de ces œuvres mauvaises, alors la sagesse deviendra pour lui éclatante, même parmi ses ennemis ; sur une terre étrangère, il aura une patrie, et au milieu de ses ennemis, il sera trouvé ami.
  revised_footnotes: []
