base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: fr
  text: Car si quelqu’un se garde de ces œuvres mauvaises, alors la sagesse deviendra pour lui éclatante, même parmi ses ennemis ; sur une terre étrangère, il aura une patrie, et au milieu de ses ennemis, il sera trouvé ami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν ἐκ
  choice: se garde de
  rationale: Rend naturellement en français l’idée de se préserver soi-même de certaines conduites.
- source_word: τῶν πονηρῶν τούτων ἔργων
  choice: ces œuvres mauvaises
  rationale: Conserve le vocabulaire moral et la référence démonstrative du grec.
- source_word: σοφία ... λαμπρά
  choice: la sagesse lui donnera de l’éclat
  rationale: Le grec présente une construction elliptique où « sagesse » devient pour lui « éclatante » parmi ses ennemis. Cette formulation française conserve le lien entre sagesse et éclat sans suggérer simplement que la sagesse elle-même serait visible.
- source_word: ἐπὶ γῆς ἀλλοτρίας πατρίς
  choice: une terre étrangère deviendra pour lui une patrie
  rationale: Explicite la proposition nominale elliptique en préservant son contraste entre terre étrangère et patrie.
- source_word: ἐν μέσῳ ἐχθρῶν εὑρηθήσεται φίλος
  choice: au milieu de ses adversaires, il trouvera un ami
  rationale: Rend l’expression idiomatique et intelligible ; le passif grec est elliptique et peut littéralement évoquer « un ami sera trouvé ».
