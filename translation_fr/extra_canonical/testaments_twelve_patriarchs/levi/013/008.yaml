revisions:
- from: Car si quelqu’un se garde de ces œuvres mauvaises, alors la sagesse lui donnera de l’éclat, même parmi ses ennemis ; une terre étrangère deviendra pour lui une patrie, et au milieu de ses adversaires, il trouvera un ami.
  to: Car si quelqu’un se garde de ces œuvres mauvaises, alors la sagesse deviendra pour lui éclatante, même parmi ses ennemis ; sur une terre étrangère, il aura une patrie, et au milieu de ses ennemis, il sera trouvé ami.
  rationale: La révision rétablit les deux prédications du grec sans les convertir en relations causatives ou en recherche d’un tiers. « Il aura une patrie » explicite avec sobriété l’ellipse de « sur une terre étrangère, [une] patrie », tout en gardant le paradoxe du texte.
