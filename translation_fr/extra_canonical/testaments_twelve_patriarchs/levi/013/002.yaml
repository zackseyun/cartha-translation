source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: fr
  text: Vous aussi, apprenez à vos enfants à lire et à écrire, afin qu’ils aient de l’intelligence durant toute leur vie, en lisant sans cesse la loi de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: à lire et à écrire
  rationale: Le terme désigne littéralement les « lettres », mais dans ce contexte pédagogique il renvoie naturellement à l’apprentissage de la lecture et de l’écriture.
- source_word: σύνεσιν
  choice: de l’intelligence
  rationale: Rend la faculté de comprendre et de discerner, sans réduire le terme à la seule acquisition de connaissances.
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: durant toute leur vie
  rationale: Expression française naturelle qui conserve la portée temporelle englobante du grec.
- source_word: ἀδιαλείπτως
  choice: sans cesse
  rationale: Reproduit l’idée de continuité ou de régularité persistante exprimée par l’adverbe grec.
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: la loi de Dieu
  rationale: Traduction directe, traditionnelle et non confessionnelle de l’expression grecque.
theological_decisions:
- issue: Rapport entre instruction, intelligence et lecture de la loi
  choice: 'Conserver la construction finale et participiale : l’instruction vise l’intelligence, entretenue par la lecture constante de la loi.'
  alternative: Faire de la lecture de la loi un second commandement indépendant.
  rationale: La syntaxe grecque rattache « en lisant » au sujet « ils », sans trancher plus précisément si cette lecture est le moyen exclusif ou une manifestation de leur intelligence.
translation_notes:
  register: Français moderne, clair et digne. « Apprenez à vos enfants à lire et à écrire » explicite idiomatiquement γράμματα, tandis que le rythme de la phrase et les notions de loi, d’intelligence et de lecture continue restent proches du grec.
