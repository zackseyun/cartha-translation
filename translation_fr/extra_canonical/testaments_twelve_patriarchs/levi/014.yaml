  text: 1[a]. Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands on him in wickedness, and among all the nations you will become a mockery[b]. 2. For our father Israel is pure from the ungodliness of the chief priests, who will lay their hands on the savior of the world. 3. For just as the sun is pure before the Lord upon the earth, so also...
translation:
  language: fr
  text: '1. Ainsi donc, mes enfants, j’ai compris qu’à la fin des âges vous agirez avec impiété contre le Seigneur : dans votre méchanceté, vous porterez la main sur lui[a], et vous deviendrez un objet de dérision parmi toutes les nations. 2. En effet, notre père Israël est pur de l’impiété des grands prêtres, eux qui porteront la main sur le Sauveur du monde[b]. 3. Car, de même que le soleil est pur devant le Seigneur sur la terre[c], de même vous l’êtes aussi, vous, les luminaires d’Israël, plus que toutes les nations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La précision « sur lui » correspond à l’expression grecque ἐπ᾿ αὐτόν, placée entre crochets dans l’édition fournie ; son appartenance au texte est donc incertaine.
    reason: textual_variant
  - marker: b
    text: La proposition « eux qui porteront la main sur le Sauveur du monde » est placée entre crochets dans l’édition grecque fournie ; elle pourrait être une expansion plus tardive de la transmission.
    reason: textual_variant
  - marker: c
    text: L’édition signale comme incertaine ou altérée la formulation grecque autour de « soleil » et de « sur la terre ». La traduction suit les mots conservés sans tenter de reconstruire un autre texte.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἔγνων
  choice: j’ai compris
  rationale: L’aoriste exprime ici l’acquisition ou la possession d’une connaissance. « J’ai compris » garde cette nuance mieux qu’un simple présent « je sais ».
- source_word: ἀσεβήσετε / ἀσεβείας
  choice: vous agirez avec impiété / l’impiété
  rationale: Cette famille de mots désigne une conduite irrévérencieuse envers Dieu. Le choix conserve le lien lexical entre les versets 1 et 2 tout en restant idiomatique en français.
- source_word: ἐπὶ Κυρίου
  choice: contre le Seigneur
  rationale: Dans le contexte hostile de la main portée sur quelqu’un, ἐπί a un sens adversatif.
- source_word: χεῖρας ἐπιβάλλοντες / ἐπιβαλοῦσι τὰς χεῖρας
  choice: porter la main sur
  rationale: Cette expression française garde la force hostile de l’idiome grec sans préciser s’il s’agit d’une arrestation ou d’une violence plus poussée.
- source_word: χλευασμός
  choice: un objet de dérision
  rationale: Le nom prédicatif indique que le groupe sera publiquement tourné en ridicule parmi les nations.
- source_word: καθαρός
  choice: pur
  rationale: « Pur » préserve les résonances à la fois morales et religieuses du terme, en contraste avec l’impiété.
- source_word: ἀρχιερέων
  choice: grands prêtres
  rationale: C’est l’équivalent français courant du pluriel grec dans le contexte du judaïsme du Second Temple.
- source_word: σωτῆρα τοῦ κόσμου
  choice: Sauveur du monde
  rationale: Traduction directe de la formule grecque; sa portée théologique et son statut textuel sont signalés en note plutôt que neutralisés.
- source_word: οἱ φωστῆρες τοῦ Ἰσραήλ
  choice: les luminaires d’Israël
  rationale: « Luminaires » conserve la métaphore céleste introduite par le soleil et le registre élevé du passage.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: plus que toutes les nations
  rationale: Avec l’accusatif, παρά peut exprimer une comparaison. La formulation conserve toutefois l’ellipse grecque, qui rattache implicitement cette supériorité à la pureté évoquée dans la comparaison.
theological_decisions:
- issue: Référent du pronom dans « porter la main sur lui » au verset 1
  choice: Conserver le Seigneur comme référent immédiat sans l’identifier davantage
  alternative: Identifier explicitement le référent au « Sauveur du monde » du verset 2, ou comprendre seulement une rébellion contre l’autorité divine
  rationale: La formulation grecque est directe et saisissante. La traduction en maintient la tension sans harmoniser les deux versets.
- issue: Proposition entre crochets concernant les grands prêtres et le Sauveur du monde
  choice: Inclure la proposition dans le texte principal et signaler son statut incertain en note
  alternative: Omettre la proposition comme expansion secondaire
  rationale: La proposition figure dans le texte grec fourni, bien qu’entre crochets éditoriaux. Elle doit donc être traduite sans que son incertitude textuelle soit dissimulée.
- issue: Comparaison de la pureté d’Israël avec celle du soleil et des nations
  choice: Préserver la comparaison et son ellipse finale
  alternative: Expliciter « vous êtes plus purs que toutes les nations »
  rationale: L’explicitation serait possible, mais elle résoudrait une construction grecque concise et textuellement difficile. « Vous l’êtes aussi » restitue l’attribut « purs » sans surcharger le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le registre testamentaire et prophétique est maintenu par « fin des âges », « impiété », « Sauveur du monde » et « luminaires d’Israël ». Contrairement à la couche anglaise de consultation, le verset 3 est traduit jusqu’à la fin, puisque ces mots figurent dans la source grecque fournie.
