source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀναστὰς¹⁴ *τῷ πρωὶ¹⁵ *ἀπεδεκάτωσε πάντα¹⁶ δι’ ἐμοῦ ῾τῷ Κυρίῳ’¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/004.yaml
  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: fr
  text: Et, s’étant levé de bon matin, il donna au Seigneur, par mon intermédiaire, la dîme de tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  choice: s’étant levé le matin
  rationale: Reproduit naturellement le participe circonstanciel et le sens temporel du grec, sans ajouter l’idée de « tôt », qui n’est pas explicitement exprimée.
- source_word: ἀπεδεκάτωσε πάντα
  choice: donna […] la dîme de tout
  rationale: Exprime clairement en français l’action de verser la dîme sur l’ensemble des biens, tout en conservant la portée de πάντα.
- source_word: δι’ ἐμοῦ
  choice: par mon intermédiaire
  rationale: Rend le sens instrumental ou médiateur de διά avec le génitif sans préciser davantage le rôle du narrateur.
- source_word: τῷ Κυρίῳ
  choice: au Seigneur
  rationale: Correspond au datif indiquant le destinataire de la dîme et conserve le titre divin traditionnel.
theological_decisions:
- issue: Nature du rôle du narrateur dans la remise de la dîme
  choice: par mon intermédiaire
  alternative: par moi
  rationale: La formulation retenue préserve l’idée de médiation portée par δι’ ἐμοῦ sans déterminer si le narrateur agit comme prêtre, représentant ou simple agent.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve l’ordre logique de l’action tout en plaçant « au Seigneur » avant l’incise afin d’éviter une fin de phrase lourde.
