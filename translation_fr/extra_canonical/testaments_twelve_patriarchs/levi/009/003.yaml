base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/003.yaml
  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: fr
  text: Quand nous arrivâmes à Béthel, mon père Jacob vit une vision à mon sujet, selon laquelle je serais leur prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλθομεν εἰς Βεθήλ
  choice: nous fûmes arrivés à Béthel
  rationale: Rend naturellement en français le déplacement achevé exprimé par ἤλθομεν εἰς, dans le cadre d’un récit au passé.
- source_word: εἶδεν … ὅραμα
  choice: eut … une vision
  rationale: Expression française idiomatique pour « voir une vision », sans modifier le caractère visionnaire de l’expérience.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Correspond directement au sens de περὶ avec le génitif et reste naturel dans un registre narratif digne.
- source_word: εἰς ἱερέα
  choice: prêtre
  rationale: ἱερεύς désigne ici la fonction sacerdotale; la tournure française avec « être » n’a pas besoin de reproduire littéralement εἰς.
- source_word: αὐτοῖς
  choice: leur
  rationale: Conserve le référent pluriel non explicité du grec sans chercher à l’identifier.
theological_decisions:
- issue: Référent de αὐτοῖς (« eux »)
  choice: leur prêtre
  alternative: un prêtre pour eux
  rationale: Le grec ne précise pas l’identité du groupe. « Leur prêtre » maintient cette indétermination et exprime clairement la relation sacerdotale, sans ajout interprétatif.
- issue: Rapport entre la vision et le futur sacerdoce de Lévi
  choice: une vision selon laquelle je serais leur prêtre
  alternative: 'une vision à mon sujet : je serais leur prêtre'
  rationale: Cette formulation rattache le contenu prophétique à la vision tout en évitant d’ajouter une nuance de décret, de consécration ou de certitude théologique absente de la phrase.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre testamentaire écrit; la formulation reste claire pour un lectorat général. Aucun marqueur de note n’est requis.
