source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Λαβὲ οὖν σεαυτῷ⁴² *γυναῖκα, ἔτι⁴³ νέος ὤν, *μὴ ἔχουσαν μῶμον μήτε βεβηλωμένην, μήτε ἀπὸ γένους⁴⁴ ἀλλοφύλων⁴⁵ ἐθνῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: fr
  text: Prends donc pour toi une femme pendant que tu es encore jeune, une femme sans défaut, qui n’ait pas été profanée et qui ne soit pas issue d’une lignée de peuples étrangers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῶμον
  choice: défaut
  rationale: Le terme désigne une tare, un défaut ou un motif de blâme. « Sans défaut » conserve cette portée générale sans lui imposer un sens exclusivement physique ou moral.
- source_word: βεβηλωμένην
  choice: qui n’ait pas été profanée
  rationale: Le participe parfait passif évoque un état résultant d’une profanation ou d’une souillure. Cette formulation maintient sa distinction avec μῶμον.
- source_word: ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  choice: issue de peuples étrangers
  rationale: Cette tournure française naturelle exprime l’origine ou l’ascendance indiquée par ἀπὸ γένους et rend ἀλλοφύλων ἐθνῶν sans lourdeur excessive.
theological_decisions:
- issue: Nature du « défaut » et de la « profanation » exigés de la femme
  choice: 'Employer des termes généraux et distincts : « sans défaut » et « qui n’ait pas été profanée »'
  alternative: Préciser une faute morale, une impureté rituelle ou une situation sexuelle particulière
  rationale: Le grec ne détermine pas explicitement la nature du μῶμος ni celle de la profanation. La traduction préserve donc l’ambiguïté du texte et évite d’y introduire une interprétation confessionnelle ou sociale précise.
translation_notes:
  register: Français moderne, clair et digne. La reprise « une femme » facilite l’enchaînement des trois qualifications sans modifier la structure ni le sens de l’exhortation.
