  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/006.yaml
  text: And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me.
translation:
  language: fr
  text: Isaac m’appelait sans cesse pour me rappeler la loi du Seigneur, comme l’ange me l’avait montré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  choice: m’appelait sans cesse
  rationale: Rend l’imparfait duratif ἐκάλει et l’idée de continuité exprimée par συνεχῶς dans un français naturel.
- source_word: τοῦ ὑπομνῆσαί με
  choice: pour me rappeler
  rationale: Exprime la valeur finale de l’infinitif articulé et conserve l’idée de remettre en mémoire.
- source_word: νόμον Κυρίου
  choice: la loi du Seigneur
  rationale: Équivalent direct, courant et théologiquement non spécifique de l’expression grecque.
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  choice: comme l’ange me l’avait montrée
  rationale: Le plus-que-parfait français clarifie naturellement que la révélation de l’ange précède les appels répétés d’Isaac; le pronom féminin reprend « la loi ».
theological_decisions:
- issue: Objet de ce que l’ange a montré
  choice: « l’ » renvoie à « la loi »
  alternative: 'Traduire sans complément explicite : « comme l’ange me l’avait montré »'
  rationale: Le grec omet l’objet de ἔδειξέ, mais le contexte immédiat favorise νόμον comme antécédent; le pronom est nécessaire pour un français naturel tout en maintenant ce lien contextuel.
translation_notes:
  register: Français moderne, digne et accessible. La répétition sémantique entre « sans cesse » et l’imparfait est conservée pour refléter l’insistance du grec.
