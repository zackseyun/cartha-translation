id: T12P.LEV.9.14
reference: Testament of Levi 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: fr
  text: De tous tes premiers produits et de ton vin, offre les prémices en sacrifice au Seigneur Dieu. Et tu saleras de sel chaque sacrifice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: de tous tes premiers produits
  rationale: Rend le sens agricole général de πρωτογέννημα sans le confondre avec le « premier-né » d’un être vivant; le singulier collectif grec est naturellement exprimé par un pluriel français.
- source_word: οἴνου
  choice: de ton vin
  rationale: Le possessif est explicité en français d’après le parallélisme avec « tes premiers produits ».
- source_word: ἀπαρχὰς
  choice: les prémices
  rationale: Terme cultuel français précis et intelligible pour les premières parts consacrées.
- source_word: εἰς θυσίαν
  choice: en sacrifice
  rationale: Expression française naturelle qui conserve la fonction sacrificielle de l’offrande.
- source_word: ἅλατι ἁλιεῖς
  choice: tu saleras de sel
  rationale: Conserve volontairement la répétition étymologique appuyée du grec plutôt que de l’atténuer par « assaisonner ».
theological_decisions:
- issue: Forme du titre divin Κυρίῳ τῷ θεῷ
  choice: au Seigneur Dieu
  alternative: au Seigneur, le Dieu
  rationale: « Au Seigneur Dieu » restitue naturellement en français le titre divin grec sans ajouter de détermination confessionnelle ni séparer artificiellement les deux noms.
- issue: Portée de πᾶσαν θυσίαν
  choice: chaque sacrifice
  alternative: tout sacrifice
  rationale: « Chaque sacrifice » exprime clairement la portée distributive de πᾶσαν tout en conservant le caractère universel de la prescription.
translation_notes:
  register: Français international moderne, digne et direct. La formulation cultuelle « prémices » est conservée pour sa précision; la répétition « saleras de sel » reproduit l’insistance concrète du grec.
