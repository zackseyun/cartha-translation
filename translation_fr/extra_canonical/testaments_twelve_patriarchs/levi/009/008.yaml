- source_word: ἀσχολούμενος εἰς ἐμὲ
  choice: s’occupant de moi
  rationale: Rend littéralement l’attention ou le soin consacré au narrateur, sans préciser une activité absente du grec.
- source_word: ἔλεγέ μοι
  choice: il me disait
  rationale: L’imparfait grec indique une parole répétée ou prolongée et introduit naturellement le discours qui suit.
