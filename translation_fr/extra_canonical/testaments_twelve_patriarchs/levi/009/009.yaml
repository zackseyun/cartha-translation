id: T12P.LEV.9.9
reference: Testament of Levi 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Πρόσεχε³⁴ σεαυτῷ³⁵ ἀπὸ τοῦ πνεύματος τῆς πορνείας. τοῦτο γὰρ³⁶ †ἐνδελεχῆ ἐστιν†³⁷ *καὶ μέλλει μιαίνειν³⁸ διὰ³⁹ τοῦ σπέρματός σου⁴⁰ *τὰ ἅγια⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: fr
  text: Garde-toi de l’esprit d’immoralité sexuelle, car il est tenace[a] et va souiller les choses saintes par ta descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de cette expression est incertain; il semble signifier que cet esprit persiste ou qu’il est tenace.
    reason: Les signes critiques de l’édition signalent une corruption ou une difficulté textuelle autour de †ἐνδελεχῆ ἐστιν†; la note rend cette incertitude visible.
lexical_decisions:
- source_word: πνεύματος τῆς πορνείας
  choice: l’esprit d’immoralité sexuelle
  rationale: « Esprit » conserve la personnification du grec, tandis qu’« immoralité sexuelle » rend πορνεία dans un français actuel sans en limiter indûment la portée.
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: Garde-toi de
  rationale: Cette tournure française exprime naturellement l’exhortation à être vigilant contre un danger.
- source_word: μέλλει μιαίνειν
  choice: va souiller
  rationale: Le futur proche restitue l’imminence ou la perspective annoncée par μέλλει, et « souiller » conserve la dimension de profanation de μιαίνω.
- source_word: διὰ τοῦ σπέρματός σου
  choice: par ta descendance
  rationale: Dans ce contexte, σπέρμα désigne la postérité issue de Lévi plutôt que la semence au sens matériel.
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Cette formulation garde la référence grecque au pluriel et évite de préciser sans preuve s’il s’agit du sanctuaire, des objets sacrés ou plus largement de ce qui est saint.
theological_decisions:
- issue: Référent de τὰ ἅγια
  choice: les choses saintes
  alternative: le sanctuaire / les lieux saints
  rationale: Le grec permet une portée cultuelle, mais ne désigne pas explicitement ici un bâtiment ou un lieu précis; la traduction conserve donc cette ouverture.
- issue: Mode de la souillure annoncée
  choice: par ta descendance
  alternative: au moyen de ta semence
  rationale: La formulation indique que la profanation se produira par la postérité de Lévi, sans développer davantage le mécanisme ni lui imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif « Garde-toi » convient à une exhortation paternelle; « tenace » est clair et naturel tout en exprimant la persistance suggérée par le texte difficile.
