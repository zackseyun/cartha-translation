revisions:
- from: Prélève donc sur douze arbres qui portent des feuilles et présente-le au Seigneur, comme Abraham me l’a enseigné.
  to: Fais donc monter vers le Seigneur ce qui provient de douze arbres portant des feuilles, comme Abraham me l’a enseigné.
  rationale: La révision rend ἀνάγαγε par « fais monter vers », qui préserve son image directionnelle et sa possible coloration cultuelle sans imposer « sacrifier ». « Ce qui provient de » rend praticable en français la construction grecque sans complément exprimé et évite d’identifier indûment l’objet avec les feuilles. « Donc », « Seigneur » et la référence à l’enseignement reçu d’Abraham sont maintenus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:24Z'
review_pass:
  verdict: revise
  source_fidelity: Le grec ordonne littéralement de « faire monter / apporter » au Seigneur à partir de « douze arbres ayant des feuilles ». Son complément d’objet n’est pas exprimé. Le couple ajouté « prélève… et présente-le » dédouble l’unique impératif ἀνάγαγε et introduit un antécédent artificiel au pronom « le ».
  naturalness: La formulation actuelle est compréhensible, mais « présente-le » est grammaticalement suspendu, puisque aucun objet masculin n’a été nommé. Une formulation avec « ce qui provient de » permet un français moderne fluide tout en signalant que l’objet précis demeure indéterminé.
  terminology: '« Seigneur » rend correctement Κυρίῳ, et « Abraham » est conforme au grec. Il convient de ne pas préciser que l’offrande consiste en feuilles, branches ou fruits : le texte grec ne le dit pas.'
  issues:
  - severity: medium
    issue: Dédoublement de l’impératif et pronom à antécédent ajouté
    rationale: ἀνάγαγε est un seul impératif; le texte ne dit ni explicitement « prélève », ni explicitement « présente », et il ne fournit aucun nom auquel « le » puisse renvoyer. La révision conserve l’indétermination de l’objet tout en produisant une phrase française complète.
  revised_text: Fais donc monter vers le Seigneur ce qui provient de douze arbres portant des feuilles, comme Abraham me l’a enseigné.
