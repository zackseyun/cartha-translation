source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Δώδεκα οὖν δένδρων ἐχόντων φύλλα⁵¹ ἀνάγαγε⁵² τῷ⁵³ Κυρίῳ⁵⁴ *ὡς κἀμὲ⁵⁵ Ἀβραὰμ ἐδίδαξε.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/012.yaml
  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: fr
  text: Fais donc monter vers le Seigneur ce qui provient de douze arbres portant des feuilles, comme Abraham me l’a enseigné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Conserve la valeur de liaison ou de conséquence du grec.
- source_word: δένδρων ἐχόντων φύλλα
  choice: arbres qui portent des feuilles
  rationale: Rend directement le participe grec sans préciser qu’il s’agit d’arbres persistants, nuance absente du texte.
- source_word: ἀνάγαγε
  choice: prélève… et présente-le
  rationale: Le verbe signifie littéralement « fais monter » et peut, dans un contexte cultuel, désigner ce que l’on apporte ou offre. Cette formulation française explicite le mouvement implicite sans employer le terme plus chargé « sacrifie ».
- source_word: τῷ Κυρίῳ
  choice: au Seigneur
  rationale: Équivalent français habituel du titre divin Κύριος.
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  choice: comme Abraham me l’a enseigné
  rationale: κἀμέ associe καί à ἐμέ et marque ici que le locuteur a lui-même reçu cet enseignement d’Abraham.
theological_decisions:
- issue: Nature exacte de ce qui doit être apporté au Seigneur
  choice: Employer le pronom neutre « le » sans nommer la matière prélevée
  alternative: « offre au Seigneur [ce qui vient] de douze arbres »
  rationale: Le grec ne fournit pas de complément d’objet explicite. La traduction garde cette indétermination plutôt que d’ajouter « feuilles », « branches » ou une offrande précise.
translation_notes:
  register: Français moderne, sobre et prescriptif. La formulation conserve l’indétermination inhabituelle du grec quant à l’objet prélevé et présenté, tout en restant intelligible.
