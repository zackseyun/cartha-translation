id: T12P.LEV.9.2
reference: Testament of Levi 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐλόγησέν με *⁵ὁ πατὴρ τοῦ πατρός μου⁵ κατὰ⁶ *τῶν ὁραμάτων ὧν⁷ εἶδον· *καὶ οὐκ ἠθέλησε πορευθῆναι μεθ’ ἡμῶν εἰς Βεθήλ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: fr
  text: Mon grand-père me bénit à cause des visions que j’avais eues[a], et il ne voulut pas aller avec nous à Béthel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet des visions que j’avais eues »; littéralement, l’expression grecque peut aussi se comprendre « selon les visions que j’avais vues ».'
    reason: Préserver l’étendue sémantique de κατὰ τῶν ὁραμάτων et la formulation grecque de « voir » une vision.
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: mon grand-père
  rationale: Cette expression littérale, « le père de mon père », désigne naturellement le grand-père en français moderne.
- source_word: κατὰ τῶν ὁραμάτων
  choice: à cause des visions
  rationale: Avec le génitif, l’expression peut indiquer le motif ou le sujet de la bénédiction. Le contexte et la couche de consultation anglaise favorisent ici une nuance causale, tout en signalant l’autre possibilité en note.
- source_word: ὧν εἶδον
  choice: que j’avais eues
  rationale: En français, on « a » couramment une vision. Le plus-que-parfait marque clairement que les visions précèdent la bénédiction.
- source_word: οὐκ ἠθέλησε πορευθῆναι
  choice: il ne voulut pas aller
  rationale: Cette formulation restitue directement le refus exprimé par ἠθέλησε et le déplacement exprimé par πορευθῆναι.
- source_word: Βεθήλ
  choice: Béthel
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu biblique.
theological_decisions:
- issue: Rapport entre la bénédiction et les visions
  choice: à cause des visions
  alternative: au sujet des visions / conformément aux visions
  rationale: Le grec permet une certaine latitude. La traduction principale retient la lecture causale la plus naturelle dans le contexte, sans transformer les visions en prescription divine explicite; la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Mon grand-père » évite un calque inutile, tandis que « ne voulut pas » conserve la sobriété narrative du grec.
