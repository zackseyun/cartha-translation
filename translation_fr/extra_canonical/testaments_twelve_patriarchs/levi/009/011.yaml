id: T12P.LEV.9.11
reference: Testament of Levi 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: fr
  text: Et avant d’entrer dans les choses saintes[a], baigne-toi ; lorsque tu offres le sacrifice, lave-toi ; puis, au moment d’achever le sacrifice, lave-toi de nouveau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le sanctuaire » ou « dans les lieux saints ».'
    reason: Le grec τὰ ἅγια peut désigner soit les choses saintes, soit un espace sacré.
lexical_decisions:
- source_word: τὰ ἅγια
  choice: les choses saintes
  rationale: Le pluriel substantivé peut désigner les réalités saintes ou le sanctuaire. « Les choses saintes » conserve cette formulation sans imposer « le lieu saint ».
- source_word: λούου
  choice: baigne-toi
  rationale: Le verbe λούω évoque normalement le lavage du corps ou le bain ; ce choix le distingue des deux occurrences suivantes de νίπτω.
- source_word: νίπτου
  choice: lave-toi
  rationale: Le grec ordonne un lavage sans en préciser explicitement l’objet. La traduction n’ajoute donc pas « les mains ».
- source_word: ἀπαρτίζων
  choice: au moment d’achever
  rationale: Le participe exprime ici l’accomplissement ou l’achèvement du sacrifice, rendu naturellement comme une indication temporelle.
theological_decisions:
- issue: Nature de « τὰ ἅγια »
  choice: les choses saintes
  alternative: le sanctuaire / les lieux saints
  rationale: Le contexte sacerdotal permet une lecture spatiale, mais la forme grecque reste assez large. La traduction principale préserve cette latitude, et la note signale l’autre possibilité.
translation_notes:
  register: Français moderne, digne et direct. Les trois impératifs rituels sont conservés, ainsi que la distinction lexicale entre le bain initial (λούου) et les lavages associés au sacrifice (νίπτου).
