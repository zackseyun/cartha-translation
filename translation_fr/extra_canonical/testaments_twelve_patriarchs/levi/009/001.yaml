base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/001.yaml
  text: And after two days, I and Judah went up with our father Jacob to Isaac our grandfather.
translation:
  language: fr
  text: Deux jours plus tard, Juda et moi, nous sommes montés avec notre père Jacob chez Isaac, notre grand-père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας δύο
  choice: Deux jours plus tard
  rationale: Rend naturellement en français la valeur temporelle de l’expression grecque, plutôt qu’un calque lourd comme « après deux jours ».
- source_word: ἀνέβην
  choice: nous sommes montés
  rationale: Le verbe est formellement à la première personne du singulier, mais son sujet associe le narrateur à Juda; le pluriel est requis en français. « Monter » conserve l’idée de déplacement exprimée par le grec.
- source_word: πρὸς Ἰσαὰκ
  choice: chez Isaac
  rationale: Dans ce contexte de visite à une personne, « chez » est la tournure française naturelle pour πρὸς avec l’accusatif.
- source_word: τὸν προπάτορα ἡμῶν
  choice: notre grand-père
  rationale: Isaac est le grand-père de Lévi et de Juda; ce terme de parenté précis convient ici à προπάτωρ.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La reprise disloquée « Juda et moi, nous sommes montés » permet de conserver l’insistance du pronom grec ἐγώ tout en restant naturelle.
