  text: '*Καὶ μεθ’ ἡμέρας¹ δύο ἀνέβην² ἐγὼ καὶ Ἰούδας *μετὰ τοῦ πατρὸς ἡμῶν Ἰακὼβ πρὸς Ἰσαὰκ³ Γτὸν προπάτορα ἡμῶν⁴⁾.'
