  text: Καὶ ἐκ⁵⁶ παντὸς ζώου καθαροῦ⁵⁷ Γκαὶ πετεινοῦ⁵⁸⁾ πρόσφερε θυσίαν *τῷ Κυρίῳ⁵⁹.
