  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: fr
  text: Et, de tout animal pur et de tout oiseau, offre un sacrifice au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ παντὸς
  choice: parmi tout
  rationale: Rend la préposition ἐκ et le distributif παντός sans laisser entendre nécessairement qu’il faut sacrifier chaque animal individuellement.
- source_word: ζώου καθαροῦ
  choice: animal pur
  rationale: Traduction directe de la catégorie rituelle exprimée par le grec.
- source_word: πετεινοῦ
  choice: oiseau
  rationale: Terme français courant et naturel pour un animal ailé dans ce contexte sacrificiel.
- source_word: πρόσφερε θυσίαν
  choice: offre un sacrifice
  rationale: Conserve l’impératif et le vocabulaire cultuel du texte grec.
- source_word: τῷ Κυρίῳ
  choice: au Seigneur
  rationale: Équivalent français traditionnel et transparent du titre divin Κυρίῳ.
theological_decisions:
- issue: Portée distributive de παντός
  choice: parmi tout animal pur et tout oiseau
  alternative: de chaque animal pur et de chaque oiseau
  rationale: « Parmi tout » préserve la construction avec ἐκ et évite de préciser indûment que chaque espèce ou chaque individu doit être offert.
translation_notes:
  register: Français moderne, clair et digne, avec maintien du vocabulaire rituel. Aucun marqueur de note n’est nécessaire.
