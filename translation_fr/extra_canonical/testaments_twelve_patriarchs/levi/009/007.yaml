source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐδίδασκέ *με²⁷ νόμον ἱερωσύνης²⁸, *θυσιῶν, ὁλοκαυτωμάτων²⁹, *ἀπαρχῶν ἑκουσίου, σωτηρίου³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: fr
  text: Et il m’enseignait la loi du sacerdoce, des sacrifices, des holocaustes, des prémices, des offrandes volontaires et des sacrifices de communion[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de paix »; le terme grec peut évoquer la paix, le bien-être ou le salut.
    reason: Le substantif cultuel σωτήριον admet plusieurs rendus français; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  choice: la loi concernant le sacerdoce
  rationale: Cette formulation française rend le rapport génitif sans laisser entendre que le sacerdoce lui-même serait une loi.
- source_word: ὁλοκαυτωμάτων
  choice: les holocaustes
  rationale: Dans le vocabulaire cultuel biblique, « holocauste » désigne une offrande entièrement consumée.
- source_word: ἀπαρχῶν
  choice: les prémices
  rationale: Le nom grec, explicitement présent dans la source fournie, signifie les premières parts ou premiers produits consacrés; il doit donc être conservé malgré son omission dans la couche anglaise révisée.
- source_word: ἑκουσίου
  choice: les offrandes volontaires
  rationale: Le terme désigne ici la catégorie cultuelle des dons présentés librement; le pluriel catégoriel est naturel en français dans cette énumération.
- source_word: σωτηρίου
  choice: les sacrifices de communion
  rationale: Dans un contexte cultuel, le terme correspond à une offrande de paix ou de bien-être; « sacrifice de communion » est une désignation française claire, tout en signalant en note l'autre rendu possible.
theological_decisions:
- issue: Sens cultuel de σωτηρίου
  choice: sacrifices de communion
  alternative: sacrifices de paix / sacrifices de salut
  rationale: Le contexte énumère des catégories sacrificielles. Le choix retient la valeur cultuelle habituelle sans réduire le terme à une conception doctrinale particulière; la note préserve sa portée possible de paix, bien-être ou salut.
translation_notes:
  register: Français moderne, digne et accessible. La structure énumérative du grec est conservée, avec des articles répétés seulement là où le français l’exige. « Et » maintient le lien narratif avec le contexte précédent.
