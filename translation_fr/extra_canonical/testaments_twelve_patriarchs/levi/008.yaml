  verdict: revise
  source_fidelity: 'Révision nécessaire surtout aux v. 15 et 18 : παρουσία désigne d’abord la « présence » et ὀνείρου, au v. 18, un « rêve », non une vision. Le reste suit globalement avec précision le grec, y compris les formulations difficiles et les ambiguïtés signalées.'
  naturalness: Le français est clair, soutenu et moderne. Quelques retouches rendent plus idiomatiques « ceinture couleur de pourpre » et la formulation de la supériorité de la première part.
  terminology: 'Le vocabulaire sacerdotal est bien traité : « pectoral », « éphod », « plaque », « diadème » et « sacerdoce » conviennent au contexte. « Présence » est préférable à « venue » pour παρουσία, sans donner au terme une portée doctrinale technique.'
  issues:
  - severity: medium
    issue: 'Verset 15 : « Sa venue » traduit παρουσία.'
    rationale: Le sens lexical direct est « présence ». Le contexte peut évoquer une venue, mais le grec ne requiert pas ce déplacement de sens.
  - severity: high
    issue: 'Verset 18 : « cette vision » traduit τοῦ πρώτου ὀνείρου.'
    rationale: ὄνειρος signifie « rêve ». La vision du v. 1 (ὅραμα) et le rêve mentionné ici ne doivent pas être nivelés.
  - severity: low
    issue: 'Verset 12 : « aucune autre ne s’élèvera au-dessus d’elle ».'
    rationale: οὐ γενήσεται ἕτερος signifie plus directement qu’il n’y en aura pas d’autre au-dessus d’elle ; la révision évite d’ajouter l’idée d’un surgissement.
  - severity: low
    issue: 'Verset 16 : « répartira ce qui se trouve sur la table ».'
    rationale: L’ajout « ce qui se trouve » n’est pas exprimé. La traduction conserve l’image abrupte de « répartir la table du Seigneur ».
  revised_text: '1 Là encore, je vis une vision semblable à la précédente, après que nous y fûmes restés soixante-dix jours. 2 Je vis sept hommes vêtus de blanc, qui me dirent : « Lève-toi, revêts la robe du sacerdoce, la couronne de la justice, le pectoral du discernement, la longue robe de la vérité, la plaque de la foi, le turban de la tête et l’éphod de la prophétie. » 3 Chacun d’eux portait ces objets ; ils me les mirent et me dirent : « Dès maintenant, deviens prêtre, toi et toute ta descendance. »


    4 Le premier m’oignit d’huile sainte et me donna un bâton. 5 Le deuxième me lava avec l’eau pure du Seigneur, me donna à manger du pain et du vin saints, et me revêtit d’une robe sainte et glorieuse. 6 Le troisième me revêtit d’un vêtement de fin lin semblable à un éphod. 7 Le quatrième m’entoura d’une ceinture couleur de pourpre. 8 Le cinquième me donna un rameau d’olivier fertile.[a] 9 Le sixième posa une couronne sur ma tête. 10 Le septième me ceignit du diadème du sacerdoce et remplit mes mains d’encens, afin que j’exerce le sacerdoce pour le Seigneur Dieu.


    11 Ils me dirent : « Lévi, ta descendance sera divisée en trois fonctions, comme signe de la gloire du Seigneur qui vient. 12 La première part sera grande, et il n’y en aura aucune autre au-dessus d’elle. 13 La deuxième exercera le sacerdoce. 14 Quant à la troisième, elle sera appelée d’un nom nouveau, car un roi issu de Juda se lèvera et établira un sacerdoce nouveau, selon le modèle des nations, pour toutes les nations.[b] 15 Sa présence est bien-aimée, comme celle d’un prophète du Très-Haut issu de la descendance d’Abraham, notre père.[c] 16 Ainsi, tout ce qui est désirable en Israël sera pour toi et pour ta descendance ; vous mangerez tout ce qui est beau à voir, et ta descendance répartira la table du Seigneur. 17 Parmi eux se trouveront des prêtres, des juges et des scribes, et c’est sur leur parole que sera reçu ce qui est saint.[d] »


    18 À mon réveil, je compris que cela était semblable au premier rêve.


    [a] Grec : « un rameau d’olivier de graisse/abondance » ; l’expression évoque probablement un olivier riche en huile.


    [b] « Selon le modèle des nations » peut aussi se rattacher à ce qui suit : « un sacerdoce nouveau pour toutes les nations ».


    [c] Le grec permet aussi de comprendre : « Sa présence est aimée comme un prophète du Très-Haut » ; la syntaxe et le référent exact demeurent difficiles.


    [d] Le texte grec de cette proposition est incertain ; littéralement : « sur leur bouche sera reçu le saint » ou « ce qui est saint ».'
