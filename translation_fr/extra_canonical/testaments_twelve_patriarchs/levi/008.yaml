  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008.yaml
  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: fr
  text: '1 Là encore, je vis une vision semblable à la précédente, après que nous y fûmes restés soixante-dix jours. 2 Je vis sept hommes vêtus de blanc, qui me dirent : « Lève-toi, revêts la robe du sacerdoce, la couronne de la justice, le pectoral du discernement, la longue robe de la vérité, la plaque de la foi, le turban de la tête et l’éphod de la prophétie. » 3 Chacun d’eux portait ces objets ; ils me les mirent et me dirent : « Dès maintenant, deviens prêtre, toi et toute ta descendance. »


    4 Le premier m’oignit d’huile sainte et me donna un bâton. 5 Le deuxième me lava avec l’eau pure du Seigneur, me donna à manger du pain et du vin saints, et me revêtit d’une robe sainte et glorieuse. 6 Le troisième me revêtit d’un vêtement de fin lin semblable à un éphod. 7 Le quatrième m’entoura d’une ceinture couleur de pourpre. 8 Le cinquième me donna un rameau d’olivier fertile.[a] 9 Le sixième posa une couronne sur ma tête. 10 Le septième me ceignit du diadème du sacerdoce et remplit mes mains d’encens, afin que j’exerce le sacerdoce pour le Seigneur Dieu.


    11 Ils me dirent : « Lévi, ta descendance sera divisée en trois fonctions, comme signe de la gloire du Seigneur qui vient. 12 La première part sera grande, et il n’y en aura aucune autre au-dessus d’elle. 13 La deuxième exercera le sacerdoce. 14 Quant à la troisième, elle sera appelée d’un nom nouveau, car un roi issu de Juda se lèvera et établira un sacerdoce nouveau, selon le modèle des nations, pour toutes les nations.[b] 15 Sa présence est bien-aimée, comme celle d’un prophète du Très-Haut issu de la descendance d’Abraham, notre père.[c] 16 Ainsi, tout ce qui est désirable en Israël sera pour toi et pour ta descendance ; vous mangerez tout ce qui est beau à voir, et ta descendance répartira la table du Seigneur. 17 Parmi eux se trouveront des prêtres, des juges et des scribes, et c’est sur leur parole que sera reçu ce qui est saint.[d] »


    18 À mon réveil, je compris que cela était semblable au premier rêve.


    [a] Grec : « un rameau d’olivier de graisse/abondance » ; l’expression évoque probablement un olivier riche en huile.


    [b] « Selon le modèle des nations » peut aussi se rattacher à ce qui suit : « un sacerdoce nouveau pour toutes les nations ».


    [c] Le grec permet aussi de comprendre : « Sa présence est aimée comme un prophète du Très-Haut » ; la syntaxe et le référent exact demeurent difficiles.


    [d] Le texte grec de cette proposition est incertain ; littéralement : « sur leur bouche sera reçu le saint » ou « ce qui est saint ».'
