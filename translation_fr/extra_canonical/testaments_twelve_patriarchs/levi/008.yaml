lexical_decisions:
- source_word: λόγιον
  choice: pectoral
  rationale: Dans une liste de vêtements sacerdotaux, le terme désigne le pectoral oraculaire plutôt qu’un simple « oracle » abstrait ; « du discernement » conserve la valeur symbolique de συνέσεως.
- source_word: ποδήρης
  choice: longue robe
  rationale: Le mot désigne un vêtement descendant jusqu’aux pieds ; cette formulation française est claire sans surcharger le texte.
- source_word: πέταλον
  choice: plaque
  rationale: Terme technique pour la plaque frontale sacerdotale, ici qualifiée symboliquement « de la foi ».
- source_word: βύσσινος
  choice: vêtement de fin lin
  rationale: Le substantif/adjectif désigne ici une pièce vestimentaire en lin fin ; l’ajout générique « vêtement » est requis en français.
- source_word: κλάδον ... ἐλαίας ... πιότητος
  choice: rameau d’olivier fertile
  rationale: La construction est inhabituelle et littéralement liée à la graisse/abondance ; « fertile » restitue l’idée d’un olivier riche en huile, avec une note préservant la difficulté.
- source_word: ἀρχάς
  choice: fonctions
  rationale: Dans ce contexte de division de la descendance en trois catégories institutionnelles, « fonctions » est plus naturel que « principautés » tout en évitant de préciser excessivement la nature des groupes.
- source_word: κλῆρος
  choice: part
  rationale: Conserve le sens de lot ou portion attribuée, sans transformer le terme en ordre sacerdotal explicitement défini.
- source_word: παρουσία
  choice: venue
  rationale: Le contexte parle de celui qui doit se lever et venir ; « venue » garde le sens ordinaire du grec sans imposer un usage doctrinal technique.
- source_word: σπέρμα
  choice: descendance
  rationale: Équivalent français naturel qui maintient le sens collectif de lignée.
theological_decisions:
- issue: Référent et structure prophétique des trois groupes
  choice: Conserver la succession des trois fonctions sans identifier historiquement ou confessionnellement leurs représentants.
  alternative: Identifier les groupes à des figures ou institutions précises.
  rationale: Le texte grec ne fournit pas explicitement ces identifications ; les ajouter résoudrait une ambiguïté théologique authentique.
- issue: Relation entre le roi issu de Juda et le nouveau sacerdoce
  choice: Traduire directement que le roi établira un sacerdoce nouveau.
  alternative: Fusionner explicitement royauté et sacerdoce dans la personne du roi.
  rationale: Le verbe ποιήσει indique l’établissement ou la production du sacerdoce, mais ne dit pas sans ambiguïté que le roi en sera lui-même le prêtre.
- issue: Portée de κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: « selon le modèle des nations, pour toutes les nations », avec note syntaxique.
  alternative: « selon le modèle, pour toutes les nations » ou « à la manière des nations ».
  rationale: La leçon reçue contient deux occurrences d’ἔθνη et une syntaxe difficile ; la traduction maintient les deux tout en signalant l’autre rattachement possible.
- issue: Sens théologique de παρουσία au verset 15
  choice: Employer le sens non technique « venue » et signaler l’ambiguïté syntaxique.
  alternative: Employer « avènement » avec une connotation eschatologique plus marquée.
  rationale: Le texte peut avoir une portée eschatologique, mais le lexème seul ne justifie pas l’importation d’une terminologie confessionnelle spécialisée.
- issue: Objet saint reçu sur la parole des prêtres
  choice: « c’est sur leur parole que sera reçu ce qui est saint » avec note textuelle.
  alternative: Préciser « la sainteté », « le Saint » ou « la chose sainte ».
  rationale: Le grec transmis est corrompu ou très obscur ; la formulation retenue respecte l’indétermination sans créer un objet théologique absent.
translation_notes:
  register: Français international moderne, digne et lisible. Le vocabulaire sacerdotal traditionnel (« sacerdoce », « éphod », « pectoral », « diadème ») est conservé lorsqu’il correspond à des objets ou fonctions techniques, avec une syntaxe contemporaine. Les répétitions structurantes et la progression visionnaire sont maintenues sans archaïsmes inutiles.
