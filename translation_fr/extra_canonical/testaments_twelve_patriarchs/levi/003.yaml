  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: fr
  text: '**Testament de Lévi 3**


    1 Écoute donc ce qui concerne les cieux qui t’ont été montrés. Le plus bas t’apparaît sombre parce qu’il voit toutes les injustices des êtres humains. 2 Il contient du feu, de la neige et de la glace, préparés pour le jour du jugement, quand Dieu exercera sa juste justice. Car c’est là que se trouvent tous les esprits chargés d’infliger des châtiments pour exercer la vengeance contre les êtres humains.


    3 Dans le deuxième ciel se trouvent les puissances des armées, établies pour exercer, au jour du jugement, la vengeance contre les esprits de l’égarement et de Béliar[a]. Au-dessus d’elles se trouvent les saints. 4 Dans la demeure la plus élevée de toutes réside la grande Gloire, bien au-dessus de toute sainteté.


    5 Dans le ciel qui vient ensuite[b] se trouvent les archanges : ils accomplissent leur service et font l’expiation[c] auprès du Seigneur pour toutes les fautes involontaires des justes. 6 Ils offrent au Seigneur un parfum de bonne odeur, un sacrifice raisonnable[d] et non sanglant. 7 Dans le ciel situé au-dessous se trouvent les anges qui apportent les réponses aux anges de la présence du Seigneur. 8 Dans le ciel qui vient après eux[b] se trouvent des trônes et des autorités ; là, des hymnes sont continuellement offerts à Dieu.


    9 Lorsque le Seigneur porte son regard sur nous, nous tremblons tous ; le ciel, la terre et l’abîme sont ébranlés devant sa majesté. 10 Mais les êtres humains, insensibles à ces réalités, pèchent et provoquent la colère du Très-Haut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Béliar » reproduit la forme grecque du nom, souvent rendue par « Bélial » dans d’autres traditions.
    reason: lexical_alternative
  - marker: b
    text: Le texte grec est incertain dans ces indications relatives à l’ordre des cieux ; littéralement, il porte à chaque endroit une expression proche de « celui qui vient après eux ».
    reason: textual_uncertainty
  - marker: c
    text: Ou « accomplissent un rite de propitiation ». Le verbe grec appartient au vocabulaire cultuel de l’expiation et de la propitiation.
    reason: lexical_alternative
  - marker: d
    text: Ou « rationnel » ; selon une interprétation plus large, « spirituel ». Le grec qualifie ainsi le sacrifice non sanglant sans lever entièrement l’ambiguïté.
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνός
  choice: sombre
  rationale: Le terme décrit ici l’aspect lugubre du ciel inférieur sans lui attribuer explicitement un sentiment d’hostilité.
- source_word: ἀδικίας
  choice: injustices
  rationale: Ce choix conserve à la fois la dimension morale et le sens concret des actes injustes.
- source_word: κρύσταλλον
  choice: glace
  rationale: Dans cette série de phénomènes punitifs avec le feu et la neige, le grec désigne naturellement de la glace plutôt que le matériau moderne appelé cristal.
- source_word: πνεύματα τῶν ἐπαγωγῶν
  choice: esprits des fléaux
  rationale: ἐπαγωγή peut désigner un malheur ou un châtiment amené sur quelqu’un; «fléaux» convient au cadre judiciaire et apocalyptique.
- source_word: δυνάμεις τῶν παρεμβολῶν
  choice: puissances des armées
  rationale: δυνάμεις évoque des puissances ou forces célestes, tandis que παρεμβολαί désigne des camps ou armées rangées.
- source_word: Βελίαρ
  choice: Béliar
  rationale: La translittération française conserve la forme propre au témoin grec au lieu de l’harmoniser avec «Bélial».
- source_word: μεγάλη δόξα
  choice: la grande Gloire
  rationale: La majuscule rend la valeur quasi titulaire de cette périphrase révérencielle de la présence divine.
- source_word: ἐξιλασκόμενοι
  choice: font l’expiation
  rationale: Le verbe appartient au langage cultuel; cette formulation préserve cette force sans réduire l’action à une simple intercession.
- source_word: ἀγνοίαις
  choice: fautes involontaires
  rationale: Le mot vise les manquements dus à l’ignorance; «fautes involontaires» rend clairement sa portée cultuelle.
- source_word: λογικὴν
  choice: raisonnable
  rationale: Le rendu formel maintient l’ambiguïté entre ce qui relève de la raison, de la parole ou, par interprétation, du spirituel.
- source_word: ἀπὸ προσώπου τῆς μεγαλωσύνης αὐτοῦ
  choice: devant sa majesté
  rationale: Cette tournure française naturelle conserve l’idée que toute la création est bouleversée en présence de la grandeur divine.
theological_decisions:
- issue: Action cultuelle des archanges en faveur des justes
  choice: «accomplissent leur service et font l’expiation auprès du Seigneur»
  alternative: «servent et obtiennent la propitiation devant le Seigneur» ou simple intercession
  rationale: Le grec associe explicitement service cultuel, expiation et offrande. La traduction maintient cette texture sacerdotale et la tension théologique du passage.
- issue: Désignation de la présence divine
  choice: «la grande Gloire»
  alternative: «la Gloire majestueuse» ou «Dieu»
  rationale: La formulation grecque est conservée comme périphrase révérencielle plutôt que remplacée par une identification explicite.
- issue: Identité de la puissance mauvaise
  choice: «Béliar»
  alternative: «Bélial»
  rationale: La forme du texte grec est représentée sans harmonisation avec la graphie biblique plus familière.
- issue: Portée de la vengeance céleste
  choice: «contre les êtres humains» au verset 2
  alternative: «contre les impies» ou «contre ceux qui méprisent la Loi»
  rationale: Le texte grec fourni porte τῶν ἀνθρώπων, «des êtres humains»; il ne contient pas ici le qualificatif «sans loi» présent dans certaines reconstructions ou traductions.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du registre apocalyptique et cultuel. Les phrases elliptiques du grec ont été légèrement explicitées en français, notamment par la répétition de «ciel», sans reprendre les expansions de la couche anglaise qui ne figurent pas dans le texte grec fourni. La numérotation des versets est conservée.
