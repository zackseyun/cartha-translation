base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: fr
  text: Par son sceptre[a], Dieu apparaîtra sur la terre, habitant parmi les humains[b], afin de sauver le peuple d’Israël, et il rassemblera les justes d’entre les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « par son sceptre » est signalée comme textuellement difficile dans l’édition.
    reason: Le signe critique de l’édition signale cette expression comme problématique; la note avertit le lecteur sans reconstruire conjecturalement le texte.
  - marker: b
    text: Les mots « habitant parmi les humains » sont placés entre crochets dans l’édition grecque, ce qui indique que leur appartenance au texte est incertaine.
    reason: La traduction les conserve parce qu’ils figurent dans le texte imprimé, tout en signalant explicitement leur statut textuel.
lexical_decisions:
- source_word: Διὰ τοῦ σκήπτρου αὐτοῦ
  choice: Par son sceptre
  rationale: Rend naturellement l’idée de moyen exprimée par διά avec le génitif, tout en conservant l’image royale du sceptre et sans préciser davantage l’identité de son possesseur.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: le peuple d’Israël
  rationale: Dans ce contexte collectif, « peuple » exprime clairement la descendance ou la communauté d’Israël sans les connotations modernes et biologisantes de « race ».
- source_word: δικαίους ἐκ τῶν ἐθνῶν
  choice: les justes d’entre les nations
  rationale: Conserve le sens moral ou religieux de δικαίους et la provenance marquée par ἐκ, tandis que « les nations » maintient l’expression biblique sans imposer « païens ».
theological_decisions:
- issue: Rapport entre Dieu et le possesseur du sceptre
  choice: Conserver le pronom « son » sans identifier explicitement son référent
  alternative: Expliciter « le sceptre de Dieu » ou attribuer le sceptre à une figure messianique nommée
  rationale: Le grec dit simplement « son sceptre » dans un contexte immédiat insuffisant pour lever ici l’ambiguïté; l’explicitation introduirait une interprétation théologique absente du verset.
- issue: Portée du salut et rassemblement des nations
  choice: Distinguer le salut du peuple d’Israël et le rassemblement des justes issus des nations
  alternative: Fusionner les deux groupes ou présenter toutes les nations comme sauvées
  rationale: La syntaxe grecque coordonne deux actions visant des groupes formulés différemment; la traduction préserve cette tension sans harmonisation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la structure prophétique du grec, l’image du sceptre et le parallélisme entre Israël et les nations, avec des notes limitées aux véritables difficultés textuelles.
