source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: fr
  text: Devenez donc sages en Dieu, mes enfants, et avisés, en discernant l’ordre de ses commandements et les prescriptions concernant toute chose, afin que le Seigneur vous aime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  choice: sages en Dieu
  rationale: Conserve la relation exprimée par ἐν sans la réduire à une simple sagesse « selon Dieu ».
- source_word: φρόνιμοι
  choice: avisés
  rationale: Rend l’idée d’intelligence pratique et de discernement dans un français naturel et digne.
- source_word: ἰδόντες
  choice: en discernant
  rationale: Le participe de ὁράω signifie littéralement « ayant vu », mais désigne ici la perception attentive ou la compréhension.
- source_word: τάξιν ἐντολῶν αὐτοῦ
  choice: l’ordre de ses commandements
  rationale: Reproduit directement l’idée d’un ordre, d’un agencement ou d’une disposition des commandements.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: les règles propres à toute chose
  rationale: θεσμός désigne une règle, une prescription ou un ordre établi; « propres à » explicite sobrement le génitif παντὸς πράγματος tout en évitant une tournure française opaque.
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: afin que le Seigneur vous aime
  rationale: Préserve la proposition finale et son lien explicite avec l’amour du Seigneur.
theological_decisions:
- issue: Lien entre l’obéissance et l’amour du Seigneur
  choice: afin que le Seigneur vous aime
  alternative: afin que le Seigneur manifeste son amour envers vous
  rationale: Le grec énonce directement ἀγαπήσει ὑμᾶς. La traduction conserve cette tension théologique sans l’atténuer ni expliquer la nature de la relation causale.
translation_notes:
  register: Français moderne international, clair et digne. L’adresse « mes enfants » est maintenue, ainsi que le parallélisme entre sagesse et prudence pratique. Aucun marqueur de note n’est requis.
