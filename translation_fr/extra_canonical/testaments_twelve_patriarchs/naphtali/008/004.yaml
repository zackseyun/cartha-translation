    issue: « le diable fuira loin de vous »
    rationale: « Loin » explicite une distance qui n’est pas exprimée comme telle par ἀφʼ ὑμῶν. « Fuira devant vous » est plus direct et idiomatique, tout en conservant la relation indiquée par la préposition.
  - severity: low
    issue: « les humains »
    rationale: Ce choix est compréhensible et exact, mais « les gens » est plus naturel en français international moderne pour οἱ ἄνθρωποι dans une opposition aux anges.
