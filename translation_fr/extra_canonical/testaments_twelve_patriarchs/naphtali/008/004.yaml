source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. *Ἐὰν Γοὖν καὶ ὑμεῖς˥²³ ἐργάσησθε τὸ καλόν²⁴, εὐλογήσουσιν ὑμᾶς *οἱ ἄνθρωποι καὶ οἱ ἄγγελοι²⁵, καὶ ὁ²⁶ Θεὸς δοξασθήσεται ἐν τοῖς ἔθνεσιν *διʼ ὑμῶν²⁷, καὶ ὁ διάβολος φεύξεται ἀφʼ ὑμῶν, Γκαὶ τὰ θηρία φοβηθήσονται ὑμᾶς˥²⁸, *καὶ ὁ Κύριος ἀγαπήσει ὑμᾶς²⁹, [καὶ οἱ ἄγγελοι ἀνθέξονται ὑμῶν]³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: fr
  text: Si donc, vous aussi, vous faites ce qui est bien, les gens et les anges vous béniront, Dieu sera glorifié parmi les nations grâce à vous, le diable fuira devant vous, les bêtes sauvages vous craindront, le Seigneur vous aimera et les anges vous soutiendront.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière proposition, « et les anges vous soutiendront », est placée entre crochets dans l’édition grecque, ce qui signale une incertitude quant à son appartenance au texte.
    reason: Préserver de façon transparente l’incertitude textuelle indiquée dans la source.
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: vous faites ce qui est bien
  rationale: Rend naturellement l’action exprimée par ἐργάζομαι et la valeur morale de τὸ καλόν, sans réduire l’expression à une œuvre particulière.
- source_word: οἱ ἄνθρωποι
  choice: les humains
  rationale: Désigne l’humanité ou les gens en contraste avec les anges, sans employer le masculin potentiellement ambigu « les hommes ».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les nations
  rationale: Conserve la portée collective de ἔθνη et la relation spatiale exprimée par ἐν.
- source_word: διʼ ὑμῶν
  choice: grâce à vous
  rationale: Exprime ici le moyen par lequel Dieu sera glorifié; « par votre intermédiaire » serait plus formel mais moins fluide.
- source_word: τὰ θηρία
  choice: les bêtes sauvages
  rationale: Restitue le sens usuel de θηρία comme animaux sauvages plutôt que les animaux en général.
- source_word: ἀνθέξονται ὑμῶν
  choice: vous soutiendront
  rationale: Le verbe ἀντέχομαι avec le génitif peut signifier s’attacher à quelqu’un, le soutenir ou lui rester fidèle; « soutenir » donne un français naturel tout en restant proche du sens contextuel.
theological_decisions:
- issue: Lien entre la bonne conduite et les bénédictions énumérées
  choice: Conserver la construction conditionnelle directe
  alternative: Atténuer par « lorsque » ou présenter les effets comme de simples possibilités
  rationale: Le grec emploie ἐάν avec le subjonctif, suivi de futurs; la traduction maintient cette tension exhortative sans ajouter d’explication doctrinale.
- issue: Glorification de Dieu parmi les nations
  choice: « Dieu sera glorifié parmi les nations grâce à vous »
  alternative: « vous glorifierez Dieu parmi les nations »
  rationale: La forme passive δοξασθήσεται fait de Dieu le sujet glorifié et ne doit pas être transformée en action directe des destinataires.
- issue: Statut textuel de la dernière proposition
  choice: La conserver dans le texte avec une note
  alternative: L’omettre ou la placer uniquement en note
  rationale: La proposition figure entre crochets dans l’édition fournie, signalant une incertitude textuelle; elle est aussi présente dans la couche de consultation anglaise. La note préserve cette donnée sans trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La longue coordination du grec est maintenue pour conserver le mouvement cumulatif de l’exhortation, avec une ponctuation légère. « Les humains » évite l’ambiguïté de « les hommes » dans le contraste avec les anges.
