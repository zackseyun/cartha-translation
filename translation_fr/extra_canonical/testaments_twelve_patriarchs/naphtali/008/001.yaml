source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: fr
  text: 'Et voici, mes enfants, je vous ai montré les derniers temps : tout arrivera en Israël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici ὅτι (« que »), précédé d’un signe d’incertitude dans cette édition ; son lien syntaxique exact avec « les derniers temps » est incertain.
    reason: Signaler l’incertitude textuelle et syntaxique sans imposer dans le texte français une subordonnée temporelle (« où ») que le grec ne fournit pas clairement.
lexical_decisions:
- source_word: ἰδού
  choice: voici
  rationale: Conserve le marqueur solennel qui attire l’attention, dans une tournure française naturelle après « Et ».
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse affectueuse et testamentaire.
- source_word: ὑπέδειξα ὑμῖν
  choice: je vous ai montré
  rationale: Traduction directe et idiomatique du verbe signifiant montrer ou faire connaître.
- source_word: καιροὺς ἐσχάτους
  choice: les derniers temps
  rationale: Conserve explicitement ἐσχάτους, élément présent dans le grec mais absent de la couche anglaise consultative.
- source_word: πάντα γενήσεται
  choice: tout arrivera
  rationale: Respecte l’indéfini πάντα sans ajouter « ces choses », et rend naturellement γενήσεται dans ce contexte prophétique.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Préserve la formulation géographique ou communautaire du grec sans en préciser indûment le sens.
theological_decisions:
- issue: Portée eschatologique de καιροὺς ἐσχάτους
  choice: les derniers temps
  alternative: les temps à venir
  rationale: Le grec porte bien l’adjectif ἐσχάτους (« derniers »). La traduction maintient cette tension eschatologique sans l’atténuer ni la développer.
- issue: Lien syntaxique introduit par ὅτι
  choice: où, avec note
  alternative: que
  rationale: Le texte grec transmis est signalé comme incertain à cet endroit. « Où » donne en français un lien intelligible entre « les derniers temps » et ce qui arrivera, tandis que la note conserve la forme littérale possible « que ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’ouverture testamentaire solennelle et la concision du grec, tout en explicitant les « derniers temps » présents dans la source originale.
