  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les deux réalités sont rapportées à Dieu, leur non-respect de l’ordre qui leur est assigné entraîne un très grand péché, et le principe s’étend aux autres commandements. Toutefois, « chez les êtres humains » affaiblit et déplace légèrement le datif τοῖς ἀνθρώποις : le grec présente le péché comme résultant pour les humains, non simplement comme existant parmi eux.'
  naturalness: Le français est globalement moderne et fluide. « Elles occasionnent un très grand péché chez les êtres humains » reste néanmoins moins idiomatique et moins précis que « elles causent aux êtres humains un très grand péché ».
  terminology: « Viennent de Dieu », « l’ordre qui leur est propre » et « les autres commandements » sont des choix appropriés. La révision maintient l’ambiguïté du génitif τοῦ Θεοῦ sans lui imposer une lecture doctrinale.
