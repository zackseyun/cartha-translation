    issue: Rendement de τοῖς ἀνθρώποις par « chez les êtres humains »
    rationale: « Chez » situe le péché au sein de l’humanité, tandis que le datif grec dépend de παρεῖχον et désigne les humains comme ceux pour qui ou à qui le très grand péché est causé. Une formulation avec « aux êtres humains » préserve mieux cette relation.
