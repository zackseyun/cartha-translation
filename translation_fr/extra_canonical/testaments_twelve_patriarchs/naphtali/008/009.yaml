source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: fr
  text: Toutes deux viennent de Dieu, et si elles ne se produisent pas dans l’ordre qui leur est propre, elles causent aux êtres humains un très grand péché. Il en va de même pour les autres commandements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο τοῦ Θεοῦ εἰσι
  choice: Toutes deux viennent de Dieu
  rationale: Le féminin pluriel reprend les deux réalités mentionnées dans le contexte. « Viennent de Dieu » exprime naturellement l’origine ou l’appartenance indiquée par le génitif τοῦ Θεοῦ sans préciser davantage le rapport.
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: dans l’ordre qui leur est propre
  rationale: Cette formulation rend l’idée de leur ordre assigné ou approprié, tout en restant idiomatique en français.
- source_word: ἁμαρτίαν μεγίστην παρεῖχον τοῖς ἀνθρώποις
  choice: elles occasionnent un très grand péché chez les êtres humains
  rationale: « Occasionnent » conserve la forte relation causale de παρεῖχον sans suggérer explicitement qu’elles contraignent à pécher. « Les êtres humains » rend τοῖς ἀνθρώποις dans un français international non ambigu.
- source_word: τὸ αὐτὸ καὶ ἐπὶ τῶν λοιπῶν ἐντολῶν ἐστι
  choice: Il en va de même pour les autres commandements
  rationale: Tour français naturel qui reproduit l’application du même principe au reste des commandements.
theological_decisions:
- issue: Nature du lien entre les deux réalités et Dieu
  choice: « viennent de Dieu »
  alternative: « appartiennent à Dieu »
  rationale: Le génitif grec peut exprimer l’origine ou l’appartenance. Le choix retenu suit le sens contextuel probable tout en évitant d’expliquer la manière dont elles procèdent de Dieu.
- issue: Responsabilité liée au désordre
  choice: « occasionnent un très grand péché »
  alternative: « font commettre un très grand péché »
  rationale: Le texte présente le désordre comme source de péché, mais ne précise pas la mécanique de la responsabilité morale. « Occasionnent » préserve cette tension sans imposer une causalité coercitive.
translation_notes:
  register: Français moderne, digne et accessible. La structure concise du grec est conservée, avec une explicitation minimale de « leur ordre » par « l’ordre qui leur est propre ».
