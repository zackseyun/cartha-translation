  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: fr
  text: Mais celui qui ne fait pas le bien, les anges et les hommes le maudiront. Par lui, Dieu sera déshonoré parmi les nations ; le diable se l’approprie comme son propre instrument, toute bête sauvage exercera sa domination sur lui, et le Seigneur le haïra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καλόν
  choice: le bien
  rationale: Rend naturellement en français la notion morale substantivée de « ce qui est bon / le bien », sans alourdir la phrase.
- source_word: ἀδοξήσει
  choice: sera déshonoré
  rationale: Le verbe exprime ici la privation d’honneur ou de gloire accordée à Dieu ; le passif français restitue clairement le sens dans ce contexte.
- source_word: οἰκειοῦται
  choice: se l’appropriera
  rationale: Exprime l’idée de faire de quelqu’un sa propriété ou de le revendiquer comme sien.
- source_word: σκεῦος
  choice: instrument
  rationale: Dans ce contexte personnel et moral, « instrument » communique mieux que le littéral « vase/récipient » l’idée d’une personne mise au service du diable, tout en conservant la métaphore fonctionnelle.
- source_word: κατακυριεύσει
  choice: dominera sur lui
  rationale: Préserve la force du verbe, qui désigne l’exercice d’une maîtrise ou d’une domination sur quelqu’un.
theological_decisions:
- issue: Dieu déshonoré parmi les nations par la conduite du malfaiteur
  choice: À cause de lui, Dieu sera déshonoré parmi les nations
  alternative: Par lui, Dieu perdra sa gloire parmi les nations
  rationale: La formulation retenue conserve la causalité de διʼ αὐτοῦ sans suggérer que Dieu perdrait intrinsèquement sa gloire.
- issue: La haine du Seigneur envers le malfaiteur
  choice: le Seigneur le haïra
  alternative: le Seigneur le rejettera
  rationale: Le grec μισήσει signifie explicitement « haïra ». La traduction maintient cette tension théologique au lieu de l’atténuer par une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La coordination grecque très longue est répartie en deux phrases pour la lisibilité, sans modifier la progression des affirmations. Aucun marqueur de note n’est requis.
