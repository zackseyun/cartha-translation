- from: Mais celui qui ne fait pas le bien, les anges et les hommes le maudiront. À cause de lui, Dieu sera déshonoré parmi les nations ; le diable se l’appropriera comme son propre instrument, toute bête sauvage dominera sur lui, et le Seigneur le haïra.
