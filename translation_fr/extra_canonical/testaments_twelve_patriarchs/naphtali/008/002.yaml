  text: 2. Καὶ ὑμεῖς Γοὖν⁵, ἐντείλασθε τοῖς τέκνοις ὑμῶν⁶ ἵνα ἑνοῦνται τῷ Λευὶ καὶ τῷ⁷ Ἰούδα. Διὰ γὰρ †τοῦ Ἰούδα†⁸ ἀνατελεῖ⁹ ἡ¹⁰ σωτηρία¹¹ τῷ Ἰσραὴλ¹², καὶ ἐν †αὐτῷ¹³ εὐλογηθήσεται¹⁴ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: fr
  text: Et vous donc, ordonnez à vos enfants de rester unis à Lévi et à Juda. Car, par Juda, le salut se lèvera pour Israël, et en lui Jacob sera béni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντείλασθε
  choice: ordonnez
  rationale: Rend directement l’impératif grec, qui exprime une consigne ferme donnée aux enfants.
- source_word: ἵνα ἑνοῦνται
  choice: de rester unis
  rationale: Exprime naturellement en français l’union durable visée par le présent grec, sans préciser davantage la nature de cette solidarité.
- source_word: ἀνατελεῖ
  choice: se lèvera
  rationale: Conserve l’image d’un astre ou d’une lumière qui se lève, plutôt que de la réduire à la simple idée de « venir ».
- source_word: σωτηρία
  choice: le salut
  rationale: 'Équivalent français usuel qui garde toute l’étendue possible du terme grec : délivrance historique et portée théologique.'
- source_word: εὐλογηθήσεται
  choice: sera béni
  rationale: Reproduit le futur passif grec sans expliciter l’auteur de la bénédiction.
theological_decisions:
- issue: Médiation de Juda dans l’apparition du salut
  choice: par Juda
  alternative: de Juda
  rationale: Le grec διὰ avec le génitif indique normalement l’intermédiaire ou le moyen. « Par Juda » préserve cette nuance sans déterminer si Juda désigne la personne, la tribu ou sa lignée.
- issue: Référent de ἐν αὐτῷ
  choice: en lui
  alternative: par lui
  rationale: Le texte grec porte littéralement « en lui » et son référent peut être Juda ou celui qui procède de Juda. La formulation conserve cette ambiguïté et l’écho possible au langage biblique de la bénédiction.
translation_notes:
  register: Français moderne, digne et accessible. L’introducteur οὖν est rendu par « donc »; le « behold » de la couche anglaise n’est pas ajouté, faute d’équivalent dans le texte grec fourni. Les cruces éditoriales autour de « Juda » et de « en lui » signalent une incertitude textuelle dans l’édition, mais aucune variante précise n’étant fournie, le texte reçu est traduit sans note conjecturale.
