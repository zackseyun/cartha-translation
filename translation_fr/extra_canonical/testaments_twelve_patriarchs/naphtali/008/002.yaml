review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’impératif adressé aux descendants, l’union avec Lévi et Juda, le salut qui « se lève » pour Israël et le futur passif concernant Jacob sont conservés. Toutefois, « rester unis » introduit une idée de maintien dans un état antérieur que ἵνα ἑνοῦνται n’exprime pas nécessairement ; « qu’ils s’unissent » est plus direct et préserve mieux l’ambiguïté entre alliance/association et unité. Les deux expressions signalées par des cruces dans l’édition grecque doivent recevoir des ancres de note, sans prétendre résoudre une incertitude textuelle dont l’apparat n’est pas fourni.'
  naturalness: '« Et vous donc » est compréhensible mais raide en français moderne. « Vous aussi, donc » rend naturellement καὶ…γοῦν. La tournure « donnez cet ordre à vos enfants : qu’ils s’unissent… » est idiomatique tout en gardant la force injonctive du grec.'
  terminology: « Lévi », « Juda », « salut », « Israël », « Jacob », « par Juda » et « en lui » sont appropriés. « Par Juda » conserve la valeur médiatrice de διὰ avec génitif. « En lui » maintient le référent non résolu de αὐτῷ et ne transforme pas la préposition en une interprétation causale.
  issues:
  - severity: medium
    issue: « rester unis » ajoute une nuance aspectuelle non imposée par le grec.
    rationale: Le présent ἑνοῦνται appelle l’union, mais ne présuppose pas explicitement que les enfants sont déjà unis et doivent le demeurer.
  - severity: medium
    issue: Les deux segments que l’édition source marque d’une crux ne sont pas ancrés par des notes.
    rationale: L’absence d’apparat détaillé interdit toute correction conjecturale, mais le lecteur doit être averti que « Juda » dans la proposition causale et « en lui » sont textuellement signalés comme incertains.
  - severity: low
    issue: L’enchaînement initial est peu naturel.
    rationale: « Vous aussi, donc » restitue à la fois καὶ et γοῦν avec une syntaxe française plus fluide.
  revised_text: 'Vous aussi, donc, donnez cet ordre à vos enfants : qu’ils s’unissent à Lévi et à Juda. Car c’est par Juda[a] que le salut se lèvera pour Israël, et c’est en lui[b] que Jacob sera béni.'
  revised_footnotes:
  - marker: a
    text: Le mot « Juda » est conservé conformément au texte grec édité. L’édition source le signale toutefois par une crux, indiquant une difficulté textuelle ; aucun apparat de variantes n’est fourni ici pour permettre une restitution plus précise.
    reason: Signaler l’incertitude textuelle marquée dans l’édition sans modifier ni interpréter le texte reçu.
  - marker: b
    text: 'Le grec porte littéralement « en lui ». Son référent n’est pas précisé : il peut renvoyer à Juda ou à une réalité/personne associée à Juda. L’édition source marque également ce terme par une crux.'
    reason: Préserver l’ambiguïté référentielle et signaler la difficulté textuelle.
  revision_rationale: La révision supprime l’ajout implicite de continuité dans « rester unis », améliore l’ordre des mots français et ajoute les notes requises par les cruces de l’édition. Elle ne tranche ni les difficultés textuelles ni l’identification théologique du référent de « en lui ».
