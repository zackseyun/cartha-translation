revisions:
- from: Car les commandements de la Loi ont eux aussi un double aspect et s’accomplissent avec discernement.
  to: Car les commandements de la Loi sont doubles et sont accomplis avec habileté.
  rationale: 'La révision privilégie une équivalence plus directe : elle garde sans explication la dualité exprimée par διπλαῖ, rend τέχνη par « habileté » et maintient la forme passive de πληροῦνται. Aucun renvoi de note n’est présent dans le texte français fourni; les chiffres de l’édition source relèvent de son apparat et n’appellent pas ici de note de traduction.'
