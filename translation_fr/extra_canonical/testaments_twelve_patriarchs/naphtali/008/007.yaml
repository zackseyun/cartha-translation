source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ γὰρ⁴⁷ αἱ ἐντολαὶ τοῦ νόμου⁴⁸ διπλαῖ εἰσιν Γκαὶ¹⁴⁹ μετὰ τέχνης πληροῦνται⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/007.yaml
  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: fr
  text: Car les commandements de la Loi sont doubles et sont accomplis avec habileté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Car … eux aussi
  rationale: Rend à la fois la valeur explicative de γάρ et la valeur additive de καί, en français naturel.
- source_word: αἱ ἐντολαὶ τοῦ νόμου
  choice: les commandements de la Loi
  rationale: Traduction directe; la majuscule à « Loi » indique ici la Loi comme ensemble reconnu, sans ajouter de précision confessionnelle.
- source_word: διπλαῖ
  choice: ont un double aspect
  rationale: Le grec signifie littéralement « doubles ». Cette formulation française conserve l’idée de dualité tout en évitant de suggérer que les commandements seraient dupliqués.
- source_word: μετὰ τέχνης
  choice: avec discernement
  rationale: τέχνη désigne ici une manière avisée, habile ou réfléchie d’agir. « Avec discernement » est naturel et digne, sans la connotation manipulatrice que pourrait avoir « avec habileté ».
- source_word: πληροῦνται
  choice: s’accomplissent
  rationale: Conserve la voix passive ou médio-passive et le champ sémantique d’accomplissement, plutôt que de réduire le sens à la simple observance.
theological_decisions:
- issue: Nature du caractère « double » des commandements
  choice: Ne pas préciser en quoi consiste ce double aspect
  alternative: Expliciter deux catégories ou deux niveaux d’accomplissement
  rationale: Le verset grec affirme seulement que les commandements sont διπλαῖ; toute identification précise des deux aspects importerait une interprétation absente du texte.
- issue: Sens de l’accomplissement « avec τέχνη »
  choice: avec discernement
  alternative: avec habileté / selon les règles de l’art
  rationale: Le choix garde l’idée d’une mise en œuvre réfléchie sans laisser entendre une technique rituelle particulière ni une doctrine déterminée.
translation_notes:
  register: Français moderne international, sobre et digne. La phrase reste concise et préserve l’énigmatique dualité du grec sans l’expliquer artificiellement.
