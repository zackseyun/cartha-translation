source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: fr
  text: Car il y a un temps pour s’unir à une femme, et un temps pour se maîtriser[a] en vue de sa prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pratiquer la continence »; le mot grec désigne la maîtrise de soi et peut ici évoquer l’abstinence sexuelle.'
    reason: Signaler la portée contextuelle possible de ἐγκράτεια sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: s’unir à une femme
  rationale: Le nom συνουσία désigne ici l’union ou les rapports conjugaux. La tournure verbale française est naturelle et conserve l’expression discrète du grec.
- source_word: ἐγκρατείας
  choice: se maîtriser
  rationale: Ἐγκράτεια exprime la maîtrise de soi et, dans ce contraste, peut impliquer l’abstinence sexuelle. « Se maîtriser » préserve cette portée sans la réduire explicitement à un seul comportement.
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: en vue de sa prière
  rationale: La formulation conserve à la fois l’idée de but portée par εἰς et le possessif αὐτοῦ, sans transformer simplement le syntagme en « pour prier ».
theological_decisions:
- issue: Rapport entre union sexuelle, maîtrise de soi et prière
  choice: Conserver l’alternance temporelle formulée par le texte
  alternative: Présenter l’abstinence comme une exigence permanente ou universelle de la prière
  rationale: Le grec oppose explicitement deux temps appropriés; il ne formule pas une condamnation générale de l’union avec une femme.
translation_notes:
  register: Français moderne, digne et accessible. La formulation « s’unir à une femme » rend l’allusion sexuelle avec la même retenue que le grec; « en vue de sa prière » garde la structure finalisée et le possessif du texte source.
