source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. *Ὡς ἄν τις³¹ τέκνου³² †ἐκθρέψῃ³³ καλῶς³⁴ μνείαν ἔχει καλήν³⁵, οὕτως³⁶ καὶ *ἐπὶ τοῦ καλοῦ ἔργου μνήμη παρὰ Θεοῦ ἀγαθή³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/005.yaml
  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: fr
  text: De même que celui qui a bien élevé un enfant en garde un bon souvenir, de même une bonne œuvre demeure en mémoire favorable auprès de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: a bien élevé
  rationale: Le verbe évoque le fait de nourrir et d’élever un enfant jusqu’à sa croissance; «bien élevé» rend naturellement l’ensemble en français.
- source_word: μνείαν ἔχει καλήν
  choice: garde de lui un bon souvenir
  rationale: Cette formulation conserve l’idée d’une mémoire favorable liée à l’enfant, tout en restant idiomatique.
- source_word: μνήμη παρὰ Θεοῦ ἀγαθή
  choice: Dieu garde un bon souvenir
  rationale: Le grec exprime littéralement une «bonne mémoire auprès de Dieu». La tournure choisie rend clairement Dieu comme siège de cette mémoire favorable sans lui ajouter une notion explicite de récompense.
theological_decisions:
- issue: Portée de la mémoire divine
  choice: «Dieu garde un bon souvenir»
  alternative: «une bonne œuvre reste en mémoire devant Dieu»
  rationale: La traduction préserve l’image biblique de la mémoire divine et sa valeur favorable, sans préciser si elle implique approbation, récompense ou jugement.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme grec «de même que… de même aussi» est conservé. Aucun marqueur de note n’est requis.
