base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: fr
  text: Et tandis que Lévi était comme le soleil, voici qu’un jeune homme lui remet douze branches de palmier. Juda devint lumineux comme la lune, et sous leurs pieds se trouvaient douze rayons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Λευὶ ὡς ὁ ἥλιος
  choice: tandis que Lévi était comme le soleil
  rationale: Rend naturellement en français la construction au génitif absolu tout en conservant la comparaison explicite.
- source_word: ἰδοὺ νέος τις
  choice: voici qu’un jeune homme
  rationale: Préserve la valeur présentative de ἰδού et l’indétermination de τις sans alourdir la phrase par « un certain jeune homme ».
- source_word: ἐπιδίδωσιν
  choice: lui remet
  rationale: Le présent français conserve le présent historique et la vivacité du récit grec; « remet » exprime l’acte de donner ou transmettre à Lévi.
- source_word: βαΐα φοινίκων δώδεκα
  choice: douze branches de palmier
  rationale: Formulation française claire pour des rameaux ou branches de palmier; elle évite de préciser une symbolique absente de l’expression.
- source_word: λαμπρὸς
  choice: lumineux
  rationale: Conserve l’image céleste et la qualité d’éclat sans introduire une idée morale.
- source_word: ἀκτῖνες
  choice: rayons
  rationale: Correspond au sens visuel de rayons lumineux dans le contexte du soleil et de la lune.
theological_decisions:
- issue: Référent du possessif αὐτῶν dans « sous leurs pieds »
  choice: leurs pieds
  alternative: ses pieds
  rationale: Le pluriel grec αὐτῶν renvoie naturellement à Lévi et Juda; la traduction maintient ce pluriel sans chercher à résoudre davantage la disposition symbolique de la vision.
- issue: Symbolisme des branches et des rayons
  choice: Traduction littérale des images sans interprétation ajoutée
  alternative: Expliciter les douze tribus ou une dignité royale et sacerdotale
  rationale: Le verset ne formule pas lui-même cette interprétation; la traduction préserve donc l’image et sa tension symbolique.
translation_notes:
  register: Français moderne, international et digne. Le présent historique de « remet » contraste volontairement avec les temps passés environnants, conformément à ἐπιδίδωσιν. La ponctuation en deux phrases améliore la lisibilité sans modifier la relation entre les scènes.
