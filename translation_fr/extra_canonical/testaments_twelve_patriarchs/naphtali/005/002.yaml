  text: V. Ἐν γὰρ *τῷ τεσσαρακοστῷ ἔτει τῆς¹ ζωῆς μου, εἶδον² *⌈ὄραμα⌉³ ἐν τῷ ὄρει τοῦ Ἐλαιῶνος³ κατὰ ἀνατολὰς Ἱερουσαλήμ, ὅτι⁴ ὁ ἥλιος καὶ ἡ σελήνη ἕστηκαν⁵. 2. Καὶ ἰδοὺ Ἰσαὰκ⁶ ὁ πατὴρ *τοῦ πατρός⁷ μου⁸ ἔλεγεν⁹ ἡμῖν· Προσδραμόντες *κρατήσατε ἕκαστος¹⁰ κατὰ δύναμιν¹¹, Γκαὶ *τοῦ πιάσαντος¹² ἔσται ὁ ἥλιος καὶ ἡ σελήνη˥.
