  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: fr
  text: '2 Et voici qu’Isaac, le père de mon père, nous disait : « Accourez, et que chacun saisisse selon sa force ; le soleil et la lune seront à celui qui aura saisi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: voici que
  rationale: Conserve le marqueur grec qui attire l’attention tout en restant naturel dans un récit de vision.
- source_word: τοῦ πατρός μου
  choice: de mon père
  rationale: 'Rend littéralement la relation généalogique : Isaac est le père du père de Nephtali.'
- source_word: Προσδραμόντες
  choice: Accourez
  rationale: Exprime l’idée de courir vers le but, sous la forme d’une exhortation adressée au groupe.
- source_word: κρατήσατε
  choice: que chacun saisisse
  rationale: « Saisir » restitue l’action de prendre fermement. Aucun pronom objet n’est ajouté, conformément au grec.
- source_word: κατὰ δύναμιν
  choice: selon sa force
  rationale: Préserve l’expression distributive et sa référence à la capacité ou à la force propre de chacun.
- source_word: τοῦ πιάσαντος
  choice: celui qui aura saisi
  rationale: Le participe aoriste désigne celui qui réussit à prendre; le futur antérieur français marque naturellement l’antériorité par rapport à la conséquence annoncée.
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: possédera le soleil et la lune
  rationale: Formulation française naturelle pour une construction grecque elliptique signifiant que le soleil et la lune seront à celui qui saisit, sans ajouter d’objet à « saisir ».
theological_decisions:
- issue: Objet implicite des verbes « saisir »
  choice: Ne pas expliciter l’objet
  alternative: « saisisse-les » / « les aura saisis »
  rationale: Le grec ne fournit aucun objet explicite. L’ellipse, bien que marquée en français, préserve l’ambiguïté du texte au lieu d’identifier automatiquement l’objet au soleil et à la lune.
- issue: Nature de la possession annoncée
  choice: « possédera le soleil et la lune »
  alternative: « le soleil et la lune seront à lui »
  rationale: Les deux rendent l’attribution elliptique exprimée par ἔσται; « possédera » est plus fluide et ne tranche pas la portée symbolique de la vision.
translation_notes:
  register: Français international moderne, digne et narratif. L’impératif « Accourez » garde l’élan de la scène visionnaire. L’ellipse de l’objet après « saisisse » est volontaire afin de respecter le grec, sans importer une interprétation absente du texte source.
