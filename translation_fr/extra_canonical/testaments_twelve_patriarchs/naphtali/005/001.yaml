  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: fr
  text: 3 Après avoir été abaissés, vous reviendrez et vous reconnaîtrez le Seigneur votre Dieu ; il vous ramènera dans votre pays, selon l’abondance de sa miséricorde. 4 Et il arrivera que, lorsqu’ils iront dans le pays de leurs pères, ils oublieront de nouveau le Seigneur et se conduiront en impies. 5 Le Seigneur les dispersera sur toute la surface de la terre, jusqu’à ce que vienne la compassion du Seigneur[a], un homme qui pratique la justice et fait miséricorde envers tous, ceux qui sont loin et ceux qui sont proches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « les entrailles du Seigneur », expression figurée de sa compassion profonde. Il juxtapose ensuite « un homme » sans préciser explicitement le lien syntaxique entre les deux expressions.
    reason: Cette note rend la métaphore anatomique et préserve l’ambiguïté syntaxique du grec, sans imposer que « un homme » soit une apposition à « la compassion du Seigneur ».
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: Après avoir été abaissés
  rationale: Le participe signifie littéralement « devenus petits » et, dans ce contexte, évoque l’humiliation ou l’abaissement subi.
- source_word: ἐπιστρέψετε
  choice: vous reviendrez
  rationale: Le verbe peut désigner à la fois un retour et une conversion. « Reviendrez » conserve cette amplitude dans le contexte du retour au Seigneur.
- source_word: ἐπιγνώσεσθε
  choice: vous reconnaîtrez
  rationale: Rend l’idée d’une connaissance pleinement assumée du Seigneur, sans surcharger le texte d’une formulation doctrinale.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: selon l’abondance de sa miséricorde
  rationale: Formulation proche du grec, digne et intelligible, qui conserve la notion de miséricorde abondante.
- source_word: ἀσεβήσουσιν
  choice: agiront avec impiété
  rationale: Exprime un comportement irrévérencieux envers Dieu plutôt qu’une simple faute morale générale.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: sur toute la surface de la terre
  rationale: Équivalent français naturel de l’expression grecque littérale « sur la face de toute la terre ».
- source_word: τὸ σπλάγχνον Κυρίου
  choice: la compassion du Seigneur
  rationale: σπλάγχνον désigne littéralement les entrailles, siège figuré de la profonde compassion. La traduction conserve le sens figuré adapté au français moderne.
- source_word: ποιῶν δικαιοσύνην
  choice: qui pratique la justice
  rationale: Conserve l’aspect actif de ποιῶν et le sens éthique de δικαιοσύνη.
- source_word: ποιῶν ἔλεος
  choice: fait miséricorde
  rationale: Garde le parallélisme avec « pratique la justice » et la force biblique de l’action miséricordieuse.
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: ceux qui sont au loin comme à ceux qui sont proches
  rationale: Reproduit l’opposition spatiale ou relationnelle du grec sans préciser indûment les groupes concernés.
theological_decisions:
- issue: Rapport entre « la compassion du Seigneur » et « un homme »
  choice: Ponctuation par deux-points, présentant « un homme » comme une explicitation possible de la compassion qui vient
  alternative: « jusqu’à ce que vienne la compassion du Seigneur, et qu’un homme pratique la justice… »
  rationale: Le grec juxtapose τὸ σπλάγχνον Κυρίου et ἄνθρωπος sans conjonction. Les deux-points préservent l’apposition probable tout en évitant d’ajouter un lien absent du texte.
- issue: Portée de « ceux qui sont au loin » et « ceux qui sont proches »
  choice: Maintien des catégories sans identification
  alternative: Les identifier explicitement aux nations et à Israël
  rationale: Le texte grec ne nomme pas ces groupes ; une identification confessionnelle ou intertextuelle résoudrait une ambiguïté réelle.
- issue: Dimension spirituelle ou géographique du retour
  choice: Employer « reviendrez » sans préciser davantage
  alternative: « vous vous convertirez »
  rationale: ἐπιστρέφω permet les deux nuances, et le passage associe retour au Seigneur et retour au pays.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme biblique est conservé sans archaïsmes inutiles. Les changements de personne entre « vous » au verset 3 et « ils » aux versets 4-5 suivent le texte grec.
