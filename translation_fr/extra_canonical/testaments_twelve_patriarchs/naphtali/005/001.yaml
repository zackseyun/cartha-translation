revisions:
- from: '3 Après avoir été abaissés, vous reviendrez et vous reconnaîtrez le Seigneur votre Dieu ; il vous ramènera dans votre pays, selon l’abondance de sa miséricorde. 4 Mais lorsqu’ils partiront pour le pays de leurs pères, ils oublieront de nouveau le Seigneur et agiront avec impiété. 5 Alors le Seigneur les dispersera sur toute la surface de la terre, jusqu’à ce que vienne la compassion du Seigneur[a] : un homme qui pratique la justice et fait miséricorde à tous ceux qui sont au loin comme à ceux qui sont proches.'
  to: 3 Après avoir été abaissés, vous reviendrez et vous reconnaîtrez le Seigneur votre Dieu ; il vous ramènera dans votre pays, selon l’abondance de sa miséricorde. 4 Et il arrivera que, lorsqu’ils iront dans le pays de leurs pères, ils oublieront de nouveau le Seigneur et se conduiront en impies. 5 Le Seigneur les dispersera sur toute la surface de la terre, jusqu’à ce que vienne la compassion du Seigneur[a], un homme qui pratique la justice et fait miséricorde envers tous, ceux qui sont loin et ceux qui sont proches.
  rationale: La révision maintient les choix lexicaux solides du projet tout en supprimant une ponctuation qui résolvait indûment une construction grecque ambiguë. Elle rapproche également les vv. 4–5 de la syntaxe et des coordinations du texte source, dans un français moderne naturel.
