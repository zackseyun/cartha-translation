  text: 3. Καὶ¹³ *ἐδράμομεν πάντες ὁμοῦ¹⁴ Γκαὶ¹⁵ ὁ¹⁶ Λευὶ¹⁷ ἐκράτησε τὸν ἥλιον *καὶ ὁ Ἰούδας φθάσας ἔπιασε τὴν σελήνην¹⁸, καὶ ὑψώθησαν ἀμφότεροι σὺν αὐτοῖς¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/003.yaml
  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: fr
  text: Et nous courûmes tous ensemble. Lévi saisit le soleil, et Juda, arrivé le premier, saisit la lune ; puis tous deux furent élevés avec eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Avec eux » renvoie probablement au soleil et à la lune, bien que le pronom grec soit masculin pluriel et que son référent ne soit pas entièrement explicite.
    reason: Préserver l’ambiguïté grammaticale réelle de σὺν αὐτοῖς tout en indiquant la lecture contextuelle la plus naturelle.
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: nous courûmes tous ensemble
  rationale: Rend directement le mouvement collectif et simultané exprimé par le grec.
- source_word: ἐκράτησε
  choice: saisit
  rationale: Exprime ici l’action de s’emparer fermement du soleil sans alourdir la phrase.
- source_word: φθάσας
  choice: arrivé le premier
  rationale: Le participe indique que Juda devance les autres ou atteint le but avant eux.
- source_word: ἔπιασε
  choice: saisit
  rationale: Rend naturellement l’idée de prendre ou d’attraper la lune ; la répétition française correspond au parallélisme grec.
- source_word: ὑψώθησαν
  choice: furent élevés
  rationale: Conserve la voix passive et ne précise pas l’agent, comme le grec.
theological_decisions:
- issue: Référent de σὺν αὐτοῖς
  choice: avec eux
  alternative: avec le soleil et la lune
  rationale: Le pronom grec est masculin pluriel, alors que « soleil » est masculin et « lune » féminin en grec ; son référent demeure donc formellement ambigu. Le texte principal conserve cette ambiguïté et la note signale le sens contextuellement probable.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif ancien sans être archaïsant. Le parallélisme entre Lévi et Juda est conservé.
