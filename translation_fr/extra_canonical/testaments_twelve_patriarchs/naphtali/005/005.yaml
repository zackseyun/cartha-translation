  text: Les deux, Lévi et Juda, accoururent et les saisirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδραμόντες
  choice: accoururent
  rationale: Le participe aoriste exprime le fait de courir vers les personnes concernées; « accoururent » le rend naturellement et avec concision.
- source_word: ἐκράτησαν
  choice: saisirent
  rationale: Dans ce contexte, le verbe indique une prise physique ou une maîtrise; « saisirent » conserve cette force sans ajouter l’idée explicite de ligoter.
- source_word: οἱ δύο … Λευὶ καὶ Ἰούδας
  choice: Les deux, Lévi et Juda
  rationale: Cette formulation conserve l’apposition grecque qui identifie les deux personnes.
- source_word: ὅτε
  choice: alors
  rationale: Le texte édité porte ὅτε, mais la construction est textuellement difficile; « alors » donne un enchaînement temporel naturel sans faire dépendre artificiellement la phrase d’une proposition absente.
