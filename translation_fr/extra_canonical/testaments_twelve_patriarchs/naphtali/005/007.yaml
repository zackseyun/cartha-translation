lexical_decisions:
- source_word: ἐλθών
  choice: arriva
  rationale: Le participe aoriste marque ici l’arrivée de Joseph avant l’action principale; « arriva » est naturel en français narratif.
- source_word: κατέλαβεν
  choice: le saisit
  rationale: Le verbe exprime une prise effective; « saisit » conserve sa force et le pronom masculin de αὐτόν.
- source_word: συνανῆλθεν αὐτῷ
  choice: monta avec lui
  rationale: Le composé indique que Joseph monte en compagnie du référent masculin; la formulation française reste directe.
- source_word: εἰς τὸ ὕψος
  choice: jusqu’au sommet
  rationale: Dans ce contexte de montée, « sommet » rend idiomatiquement la hauteur visée, tandis que « jusqu’à » exprime le mouvement vers le point élevé.
