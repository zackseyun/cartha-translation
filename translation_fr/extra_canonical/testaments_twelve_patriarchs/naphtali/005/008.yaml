source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: fr
  text: 'Et je vis que j’étais là. Et voici qu’un écrit saint nous apparut, disant : « Les Assyriens, les Mèdes, les Perses, les Chaldéens et les Syriens recevront en héritage, dans la captivité, les douze sceptres[a] d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les douze tribus » ; les « sceptres » représentent ici vraisemblablement les divisions tribales d’Israël.
    reason: Éclaire la métonymie sans la supprimer du texte principal.
lexical_decisions:
- source_word: παρεκεῖ
  choice: j’étais là
  rationale: Rend naturellement l’idée de présence exprimée par le terme grec, conformément au contexte visionnaire, sans préciser une proximité dont le référent demeure incertain.
- source_word: γραφὴ ἁγία
  choice: un écrit saint
  rationale: « Écrit » conserve le sens large de γραφή sans identifier nécessairement le document aux Écritures canoniques.
- source_word: ὤφθη ἡμῖν
  choice: nous apparut
  rationale: Reproduit la formulation grecque passive d’apparition et maintient le passage du narrateur singulier au groupe désigné par « nous ».
- source_word: κληρονομήσουσιν
  choice: recevront en héritage
  rationale: Conserve le vocabulaire d’héritage, frappant ici puisqu’il est appliqué aux puissances étrangères.
- source_word: αἰχμαλωσίαν
  choice: dans la captivité
  rationale: Suit l’interprétation adverbiale reflétée par la tradition de traduction, tout en préservant l’association explicite avec la captivité.
- source_word: τὰ δώδεκα σκῆπτρα
  choice: les douze sceptres
  rationale: Préserve l’image politique et tribale du grec plutôt que de la remplacer directement par « tribus ».
theological_decisions:
- issue: Rapport entre les nations étrangères, la captivité et les douze sceptres
  choice: Maintenir l’image selon laquelle les nations recevront les sceptres en héritage dans la captivité
  alternative: Expliciter que les nations emmèneront les douze tribus d’Israël en captivité
  rationale: La syntaxe grecque est inhabituelle et l’explicitation éliminerait une ambiguïté réelle tout en affaiblissant le langage d’héritage.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure visionnaire « Et voici » est conservée. L’énumération reçoit la coordination française naturelle avant le dernier élément, tandis que l’étrangeté théologique et syntaxique de l’héritage accordé aux nations est maintenue.
