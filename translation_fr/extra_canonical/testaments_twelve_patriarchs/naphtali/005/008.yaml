  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : la présence du narrateur (ὅτι ἤμην παρεκεῖ), l’apparition à « nous » d’un écrit qualifié de saint, l’énumération des peuples, ainsi que l’image volontairement étrange des « douze sceptres » et leur lien avec la captivité. « Dans la captivité » conserve de façon prudente la construction grecque difficile αἰχμαλωσίαν, sans imposer l’explicitation selon laquelle les tribus seraient emmenées captives.'
  naturalness: Le français est moderne, clair et d’un registre visionnaire sobre. « Et voici qu’un écrit saint nous apparut » est légèrement solennel, mais convient au genre et reste naturel. La répétition initiale de « Et » reflète raisonnablement la coordination grecque.
  terminology: Les ethnonymes sont corrects en français moderne (Assyriens, Mèdes, Perses, Chaldéens, Syriens). « Sceptres » préserve σκῆπτρα sans réduire indûment l’image à « tribus ». La note explique avec prudence la métonymie possible et n’en fait pas une certitude. « Écrit saint » évite d’identifier sans justification γραφὴ ἁγία aux Écritures canoniques.
