  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: fr
  text: 'Et voici : un taureau était sur la terre. Il avait deux grandes cornes et, sur le dos, les ailes d’un aigle. Nous voulions le saisir, mais nous n’y sommes pas parvenus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: 'Et voici :'
  rationale: Conserve la formule grecque qui introduit soudainement un élément de la vision, dans un français narratif digne et naturel.
- source_word: ταῦρος
  choice: un taureau
  rationale: Équivalent direct du nom grec.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Reproduit le sens spatial de la préposition et conserve la portée potentiellement symbolique de « terre ».
- source_word: ἔχων δύο κέρατα μεγάλα
  choice: Il avait deux grandes cornes
  rationale: Rend clairement le participe descriptif tout en respectant l’ordre naturel du français.
- source_word: πτέρυγας ἀετοῦ ἐπὶ νώτου αὐτοῦ
  choice: sur le dos, les ailes d’un aigle
  rationale: Le génitif ἀετοῦ est rendu naturellement par « d’un aigle » et l’emplacement sur le dos est maintenu.
- source_word: πιάσαι αὐτόν
  choice: le saisir
  rationale: Exprime l’action concrète de s’emparer de l’animal sans ajouter l’idée de le tuer ou de le maîtriser.
- source_word: οὐκ ἠδυνήθημεν
  choice: nous n’y sommes pas parvenus
  rationale: Rend l’incapacité effective exprimée par le grec dans un français idiomatique.
