  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: fr
  text: 'Et, tout en glorifiant le Seigneur, il reprit des forces et dit : « Après le repas d’hier, ma chair est morte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: tout en glorifiant
  rationale: Le participe présent exprime une action concomitante. Le grec fourni ne comporte pas de verbe signifiant « bénir ».
- source_word: ἐκραταιώθη
  choice: il reprit des forces
  rationale: Cette tournure française naturelle rend l’idée qu’il devint fort ou fut fortifié dans ce contexte narratif.
- source_word: δεῖπνον
  choice: repas
  rationale: Le terme désigne ici le repas, sans imposer l’idée plus particulière d’un festin.
- source_word: σάρξ
  choice: chair
  rationale: « Chair » conserve le vocabulaire concret du grec ainsi que l’éventuelle portée anthropologique de l’expression, sans la réduire d’emblée à « corps ».
- source_word: ἀπέθανεν
  choice: est morte
  rationale: Traduction directe du verbe « mourir », sans ajouter l’idée de défaillance.
theological_decisions:
- issue: Sens de « ma chair est morte » alors que le locuteur parle encore
  choice: Conserver littéralement « ma chair est morte »
  alternative: Interpréter comme « mon corps s’est affaibli » ou comme une mort figurée explicitée
  rationale: La formulation grecque crée une tension réelle et peut avoir une portée physique, ascétique ou figurée. La traduction ne tranche pas silencieusement entre ces lectures.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste fluide tout en préservant l’étrangeté voulue de la dernière proposition.
