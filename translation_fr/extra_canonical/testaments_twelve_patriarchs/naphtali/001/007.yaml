  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: fr
  text: '7 En effet, Rachel m’aimait beaucoup, parce que je suis né sur ses genoux. Alors que j’étais encore tout petit, elle me couvrait de baisers en disant : « Qu’il me soit donné, de mon ventre, un frère qui te ressemble ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῶν γονάτων αὐτῆς ἐγεννήθην
  choice: j’étais né sur ses genoux
  rationale: Rend directement l’expression grecque et conserve son arrière-plan culturel sans l’expliciter dans le texte.
- source_word: ἁπαλὸν
  choice: tout petit
  rationale: Dans ce contexte, le terme décrit la tendre jeunesse de l’enfant; cette formulation est naturelle en français moderne.
- source_word: με κατεφίλει
  choice: elle me couvrait de baisers
  rationale: L’imparfait grec et le verbe intensif suggèrent des baisers affectueux et répétés, plutôt qu’un acte ponctuel.
- source_word: Δοίη μοι
  choice: Qu’il me soit donné
  rationale: Conserve le souhait au passif et l’agent implicite du grec, sans préciser qu’il s’agit de Dieu.
- source_word: ἀδελφόν σου … κατά σε
  choice: un frère pour toi qui soit comme toi
  rationale: 'Distingue les deux éléments du grec : le frère est destiné à être le frère de Naphtali et il est souhaité semblable à lui.'
- source_word: ἐκ τῆς κοιλίας μου
  choice: de mon propre ventre
  rationale: Rend concrètement l’origine maternelle exprimée par κοιλία; « propre » souligne que Rachel désire elle-même enfanter cet enfant.
theological_decisions:
- issue: Agent du souhait exprimé par δοίη
  choice: Maintenir l’agent indéterminé par « Qu’il me soit donné »
  alternative: « Que Dieu me donne »
  rationale: Le grec ne nomme pas explicitement Dieu; l’ajouter résoudrait une implicitation du texte source.
translation_notes:
  register: Français moderne, naturel et digne. « Tout petit » évite le calque peu idiomatique « encore tendre », tandis que « elle me couvrait de baisers » restitue la valeur affective et répétée du verbe. Le texte grec fourni ne contient pas de proposition équivalant à « et Rachel m’enfanta »; cette addition signalée dans une révision anglaise n’a donc pas été retenue.
