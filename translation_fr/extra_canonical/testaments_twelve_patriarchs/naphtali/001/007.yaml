review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’image culturelle « né sur ses genoux », le caractère répété et affectueux de κατεφίλει, et le souhait à agent non exprimé. Toutefois, « un frère pour toi » ne rend pas exactement ἀδελφόν σου (« ton frère ») et risque de présenter l’enfant comme destiné à Naphtali plutôt que comme son frère.
  naturalness: Le français est fluide, moderne et d’un registre approprié. « Tout petit » et « me couvrait de baisers » sont naturels. La formulation corrigée reste idiomatique.
  terminology: « Né sur ses genoux » conserve volontairement l’expression traditionnelle sans interprétation culturelle ajoutée. « De mon ventre » traduit κοιλία μου sans renforcer inutilement le possessif par « propre ». « Un frère qui te ressemble » rend à la fois ἀδελφόν σου et κατά σε sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: La relation exprimée par ἀδελφόν σου est rendue par « un frère pour toi ».
    rationale: Le génitif σου signifie littéralement « ton frère ». En français, « un frère pour toi » peut plutôt suggérer un frère attribué ou destiné à Naphtali. « Un frère qui te ressemble » maintient clairement la relation fraternelle tout en exprimant κατά σε.
  revised_text: '7 En effet, Rachel m’aimait beaucoup, parce que je suis né sur ses genoux. Alors que j’étais encore tout petit, elle me couvrait de baisers en disant : « Qu’il me soit donné, de mon ventre, un frère qui te ressemble ! »'
