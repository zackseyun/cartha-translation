  text: And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him.
translation:
  language: fr
  text: 'Et le matin, après s’être réveillé, il leur dit : « Je meurs. » Mais ils ne l’ont pas cru.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρωί
  choice: le matin
  rationale: Rend directement l’indication temporelle grecque dans un français naturel.
- source_word: μετὰ τὸ ἐξυπνισθῆναι αὐτόν
  choice: après s’être réveillé
  rationale: La construction grecque désigne son réveil; la tournure pronominale française est fluide et conserve la succession des actions.
- source_word: Ἀποθνήσκω
  choice: Je meurs
  rationale: Le présent grec exprime le fait de mourir en cours ou imminent; « Je meurs » en préserve la force directe sans préciser davantage.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: ils ne le crurent pas
  rationale: Avec une personne au datif, πιστεύω signifie ici croire ce qu’elle affirme; cette formulation idiomatique conserve le sens.
