source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: Διαθήκη Νεφθαλεὶμ τοῦ ὀγδόου υἱοῦ Ἰακὼβ καὶ Βάλλας¹. I. Ἀντίγραφον διαθήκης Νεφθαλείμ ἧς² διέθετο³ ἐν καιρῷ ⸀τῆς ἐξόδου⁴ αὐτοῦ ἐν ἔτει *ἑκατοστῷ καὶ τριακοστῷ⁵ τῆς⁶ ζωῆς αὐτοῦ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/001.yaml
  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: fr
  text: Copie du testament de Nephtali, huitième fils de Jacob et de Balla, qu’il établit au moment de son départ, dans la cent trentième année de sa vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Rend directement l’idée d’une reproduction écrite du testament.
- source_word: διαθήκης
  choice: du testament
  rationale: Dans ce contexte littéraire et avec le verbe apparenté διέθετο, le terme désigne les dernières dispositions attribuées à Nephtali.
- source_word: διέθετο
  choice: qu’il établit
  rationale: « Établir un testament » est une formulation française naturelle, digne et juridiquement appropriée, sans surtraduire le verbe par « ordonner ».
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: au moment de son départ
  rationale: Conserve l’euphémisme et l’ambiguïté du grec ἔξοδος, qui peut évoquer la mort sans la nommer explicitement.
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: dans la cent trentième année de sa vie
  rationale: Reproduit précisément le calcul ordinal du grec plutôt que de reformuler en âge révolu.
theological_decisions:
- issue: Sens de « départ »
  choice: Maintenir « départ »
  alternative: « mort »
  rationale: Le grec emploie un terme indirect; le rendre explicitement par « mort » supprimerait une nuance authentique du texte.
translation_notes:
  register: Français international moderne, clair et soutenu. La tournure « établir un testament » conserve la tonalité formelle du passage. L’apposition « huitième fils de Jacob » suit la couche anglaise auditée et correspond à l’information de la suscription grecque, bien que celle-ci mentionne aussi Balla.
