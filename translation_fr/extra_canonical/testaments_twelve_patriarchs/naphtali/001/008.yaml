source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Ὅθεν καὶ ὅμοιός μου⁴⁶ ἦν Γκατὰ πάντα¹⁴⁷ Ἰωσὴφ⁴⁸ κατὰ τὰς †εὐλογίας⁴⁹ Ῥαχιήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/008.yaml
  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: fr
  text: C’est pourquoi Joseph aussi me ressemblait en tout, conformément aux prières de Rachel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins ou éditeurs ont ici « bénédictions » plutôt que « prières » ; le texte suit la lecture manuscrite « prières » signalée dans l’apparat.
    reason: Signaler honnêtement l’incertitude textuelle entre εὐχάς et εὐλογίας.
lexical_decisions:
- source_word: ὅμοιός μου
  choice: me ressemblait
  rationale: Rend naturellement en français l’idée d’être semblable au locuteur, sans alourdir la phrase par « était semblable à moi ».
- source_word: κατὰ πάντα
  choice: en tout
  rationale: Expression française concise qui conserve la portée générale du grec.
- source_word: 'εὐχάς (lecture manuscrite signalée par l’apparat ; texte imprimé : εὐλογίας)'
  choice: prières
  rationale: Suit la lecture manuscrite signalée dans l’apparat, qui convient aussi naturellement à Rachel comme personne formulant ces prières.
- source_word: κατά
  choice: conformément à
  rationale: Préserve le rapport exprimé par le grec entre la ressemblance et les prières de Rachel, sans préciser davantage le mécanisme envisagé.
theological_decisions:
- issue: Nature des paroles attribuées à Rachel
  choice: prières
  alternative: bénédictions
  rationale: La tradition textuelle présente une hésitation. La lecture « prières » est retenue d’après la lecture manuscrite signalée dans l’apparat, sans transformer ces paroles en déclaration prophétique ou en bénédiction formelle.
translation_notes:
  register: Français international moderne, simple et digne. « Me ressemblait en tout » est idiomatique, tandis que « conformément aux prières » maintient le lien quelque peu énigmatique du grec sans l’expliciter.
