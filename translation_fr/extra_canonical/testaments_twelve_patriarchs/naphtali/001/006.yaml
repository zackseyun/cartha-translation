  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: fr
  text: Je suis né de Bilha, parce que Rachel agit avec ruse et donna Bilha à Jacob à sa place. Bilha conçut et me mit au monde sur les genoux de Rachel ; c’est pourquoi elle me donna le nom de Nephtali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: agit avec ruse
  rationale: Rend directement la nuance de πανουργία, qui évoque l’habileté rusée, sans l’atténuer ni lui donner une portée doctrinale supplémentaire.
- source_word: ἀντʼ αὐτῆς
  choice: à sa place
  rationale: Expression française naturelle qui conserve l’idée de substitution présente dans le grec.
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: sur les genoux de Rachel
  rationale: Conserve l’image concrète et culturellement marquée du grec, également liée au récit de la Genèse, sans l’interpréter dans le corps du texte.
- source_word: ἐκάλεσε τὸ ὄνομά μου
  choice: elle me donna le nom de
  rationale: Formulation idiomatique en français moderne qui transmet fidèlement l’acte de nommer.
theological_decisions:
- issue: Identité du sujet de ἐκάλεσε (« elle donna le nom »)
  choice: Maintien du pronom « elle »
  alternative: Expliciter « Rachel »
  rationale: Le grec n’énonce pas de nouveau le sujet. Le contexte scripturaire désigne Rachel, mais conserver le pronom évite d’ajouter dans le texte principal une précision absente de la formulation grecque.
translation_notes:
  register: 'Français moderne, digne et accessible. Les noms propres suivent les formes françaises courantes : Bilha, Jacob, Rachel et Nephtali. La coordination grecque a été répartie en deux phrases pour assurer une lecture naturelle sans modifier la succession des événements.'
