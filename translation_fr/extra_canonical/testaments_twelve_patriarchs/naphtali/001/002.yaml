  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: fr
  text: Lorsque ses fils se furent réunis le premier jour du septième mois, il leur prépara un repas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: Quand ses fils se furent réunis
  rationale: Le génitif absolu exprime ici une circonstance temporelle antérieure à l’action principale; le plus-que-parfait rend naturellement cette relation en français.
- source_word: ἐν τῷ ἑβδόμῳ μηνί
  choice: au septième mois
  rationale: Formulation idiomatique qui conserve l’indication calendaire précise du grec.
- source_word: μιᾷ τοῦ μηνός
  choice: le premier jour du mois
  rationale: L’expression grecque désigne le premier jour du mois; «jour» est explicité en français pour assurer la clarté.
- source_word: ἐποίησε δεῖπνον αὐτοῖς
  choice: il leur prépara un festin
  rationale: Le tour grec signifie qu’il organisa ou donna un repas pour eux. «Prépara un festin» restitue le caractère particulier du repas sans suggérer nécessairement qu’il l’a cuisiné lui-même.
