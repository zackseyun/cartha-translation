  text: '1[a]. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he blessed me as though I were a deer.


    2. For just as the potter knows how much the vessel can hold, and according to that brings the clay for the work, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body''s capacity places the spirit within it.


    3. And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.


    4. And just as the potter knows the use of each vessel, how much it is fit for, so also the Lord knows the body: how long it will endure in good, and when it comes into evil.


    5. For there is no purpose of his creation that the Lord does not know; for he created every human being in his own image.


    6[b]. As a person''s strength is, so also is his work, whether in the law of the Lord or in the law of Beliar.


    7. And just as there is a division between light and darkness, between seeing and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in all things one face is the same as another.


    8. For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.


    9. So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.


    10. For if you say to the eye, “Hear,” it cannot; or to the ear, “See,” it cannot.


    11. In the same way, neither can you do the works of heaven on earth, nor the works of earth in heaven.


    12. For God made all things beautiful in their time. He gave the sun to rule the day, and the moon and stars to rule the night.


    13. Therefore, my children, recognize in your heart that as the sun is not the moon, so also the righteous are not the sinners, nor the sinners the righteous.


    14. But there is a difference in conduct and in understanding and in purpose.


    15. For the righteous man has understanding in all things, but the sinner walks in darkness and does not know what he does.


    16. Therefore be wise in God, my children, and understand the order of all things, each in its season, so that you may not transgress the law of the Lord or the law of Beliar by confusion.


    17. But rather choose the law of the Lord, and walk in simplicity and in the fear of God, doing what is good before him.


    18. If you do these things, my children, you will prosper in every work and in every counsel[d][c], and the Lord will bless you forever.'
translation:
  language: fr
  text: '## Testament de Nephtali 2


    **1.** J’étais agile sur mes pieds comme une biche, et mon père Jacob me chargea de toute mission ; il me bénit comme une biche.[a]


    **2.** En effet, de même que le potier sait quelle quantité un récipient peut contenir et apporte l’argile en conséquence, de même le Seigneur façonne le corps en correspondance avec l’esprit et place l’esprit selon la capacité du corps.


    **3.** Rien n’y manque, pas même le tiers d’un cheveu ; car toute la création a été faite selon un poids, une mesure et une règle.


    **4.** Et de même que le potier sait à quel usage chaque récipient est propre, de même le Seigneur connaît le corps : il sait combien de temps celui-ci persévérera dans le bien et quand il en viendra au mal.


    **5.** Car il n’existe aucune créature ni aucune pensée que le Seigneur ne connaisse ; en effet, il a créé tout être humain à son image.


    **6.** Comme est sa force, ainsi est aussi sa parole, que ce soit sous la loi du Seigneur ou sous la loi de Béliar.[b]


    **7.** De même qu’une séparation existe entre la lumière et les ténèbres, ainsi qu’entre la vue et l’ouïe, de même une distinction existe entre un homme et un autre, et entre une femme et une autre ; on ne peut pas dire que deux visages soient en tout point identiques.[c]


    **8.** Car Dieu a fait toutes choses bonnes dans leur ordre : il a disposé les cinq sens dans la tête et rattaché le cou à la tête ; il lui a aussi ajouté les cheveux pour sa beauté et sa gloire, puis le cœur pour l’intelligence, le ventre pour l’évacuation, l’estomac pour broyer les aliments, la trachée pour la santé, le foie pour la colère, la bile pour l’amertume, la rate pour le rire, les reins pour la ruse, les lombes pour la force, le flanc pour le sommeil, la taille pour la vigueur, et ainsi de suite.[d]


    **9.** Ainsi donc, mes enfants, que toutes vos œuvres soient accomplies avec ordre, en vue du bien et dans la crainte de Dieu. Ne faites rien de désordonné avec mépris, ni rien hors de son temps.


    **10.** Car si tu dis à l’œil : « Écoute », il ne le pourra pas. De même, étant dans les ténèbres, vous ne pouvez pas accomplir les œuvres de la lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du chapitre est transmis sous une forme textuellement instable. Le sens général est que Nephtali, agile comme une biche, était chargé par Jacob de porter des messages ou d’accomplir des missions.
    reason: textual_variant
  - marker: b
    text: Béliar est, dans la littérature testamentaire juive, un nom traditionnel de la puissance opposée à Dieu et à sa loi.
    reason: cultural_note
  - marker: c
    text: Le texte grec de ce verset est incertain, notamment dans la comparaison des facultés et dans sa dernière proposition. « La vue et l’ouïe » correspond le mieux à l’argument fondé sur les sens et les fonctions distinctes du corps.
    reason: textual_variant
  - marker: d
    text: La liste des parties du corps et de leurs fonctions est transmise avec plusieurs difficultés textuelles. La traduction conserve les fonctions formulées par le grec, y compris « la trachée pour la santé », sans chercher à les harmoniser avec une physiologie moderne.
    reason: textual_variant
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν ὡς ἡ ἔλαφος
  choice: agile sur mes pieds comme une biche
  rationale: κοῦφος exprime ici la légèreté et l’agilité. « Biche » convient au féminin grec ἔλαφος dans cette comparaison traditionnelle, sans faire de l’animal le point principal.
- source_word: ἀγγελία
  choice: messages
  rationale: Le terme désigne ici les missions de messager confiées par Jacob à Nephtali. « Messages » est concret et naturel en français.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: en correspondance avec l’esprit
  rationale: La formule indique une correspondance entre le corps et l’esprit sans préciser davantage leur relation métaphysique.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος τὸ πνεῦμα ἐπιτίθησιν
  choice: place l’esprit selon la capacité du corps
  rationale: δύναμις peut désigner la capacité, tandis que ἐπιτίθησιν signifie littéralement « place sur ». La formulation française conserve le rapport de proportion sans imposer une anthropologie ultérieure.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: selon un poids, une mesure et une règle
  rationale: La triple formule souligne l’ordre et la proportion de la création ; « règle » garde la valeur de norme de κανών.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: persévérera dans le bien
  rationale: « Dans le bien » conserve la portée morale ouverte de l’expression, tandis que « persévérera » rend la durée indiquée par διαρκέσει.
- source_word: λόγος
  choice: parole
  rationale: Le grec transmis porte λόγος, non « œuvre ». « Parole » respecte donc la source, même si le lien exact avec la force demeure elliptique.
- source_word: νόμος Κυρίου ... νόμος τοῦ Βελίαρ
  choice: loi du Seigneur ... loi de Béliar
  rationale: La traduction directe maintient l’opposition morale entre deux domaines d’allégeance et conserve Béliar comme nom propre.
- source_word: ἄτακτον ... ἔξω καιροῦ αὐτοῦ
  choice: désordonné ... hors du moment qui lui convient
  rationale: Le contraste porte à la fois sur l’ordre convenable et sur le temps approprié à chaque action.
theological_decisions:
- issue: Rapport entre le corps et l’esprit aux versets 2 à 4
  choice: Conserver l’idée d’une correspondance et d’une proportion établies par Dieu
  alternative: Présenter le passage comme une doctrine dualiste systématique du corps et de l’âme
  rationale: L’image du potier insiste sur l’ajustement, la capacité et l’ordre divin, mais ne définit pas précisément la nature ontologique du corps et de l’esprit.
- issue: Connaissance divine au verset 5
  choice: Affirmer que toute créature et toute pensée sont connues du Seigneur
  alternative: Limiter ἔννοια au seul dessein créateur de Dieu
  rationale: Le grec transmis permet une portée large. La traduction évite de réduire silencieusement « pensée » à un sens exclusivement créatif ou téléologique.
- issue: Opposition entre la loi du Seigneur et celle de Béliar
  choice: Maintenir Béliar comme puissance adverse nommée et les deux lois comme sphères morales opposées
  alternative: Remplacer Béliar par une abstraction telle que « le mal »
  rationale: Le texte testamentaire emploie un nom propre et présente une opposition éthique nette ; la traduction ne la démythologise pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme sapientiel et l’adresse « mes enfants » sont conservés. La traduction suit exclusivement les versets 1 à 10 présents dans la source grecque fournie ; elle n’ajoute pas les versets 11 à 18 de la couche anglaise, qui ne figurent pas dans l’extrait original soumis.
