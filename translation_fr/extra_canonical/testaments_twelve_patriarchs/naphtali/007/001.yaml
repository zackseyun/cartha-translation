  text: VII. Ταῦτα¹ τὰ δύο ἐνύπνια εἶπον² τῷ πατρί μου³ καὶ⁴ εἶπέ μοι· Δεῖ *ταῦτα πληρωθῆναι⁵ κατὰ *τοὺς καιροὺς⁶ αὐτῶν, *πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: fr
  text: 'J’ai raconté ces deux rêves à mon père, et il m’a dit : « Ces choses doivent s’accomplir aux temps qui leur sont fixés, après qu’Israël aura beaucoup souffert. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνύπνια
  choice: rêves
  rationale: Équivalent français naturel pour des visions reçues pendant le sommeil.
- source_word: πληρωθῆναι
  choice: s’accomplir
  rationale: Conserve l’idée de réalisation effective de ce qui a été annoncé ou vu.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: aux temps qui leur sont fixés
  rationale: Rend la notion de périodes propres à ces événements, sans préciser artificiellement qui les a fixées.
- source_word: ὑπομείναντος
  choice: après qu’Israël aura beaucoup souffert
  rationale: Le génitif absolu exprime ici une circonstance antérieure; « souffert » restitue naturellement l’endurance d’épreuves impliquée par ὑπομένω.
theological_decisions:
- issue: Rapport temporel entre l’accomplissement et les souffrances d’Israël
  choice: après qu’Israël aura beaucoup souffert
  alternative: Israël ayant beaucoup enduré
  rationale: Cette formulation française explicite la valeur circonstancielle probablement antérieure du génitif absolu, tout en évitant d’identifier la nature des épreuves.
translation_notes:
  register: Français moderne, clair et digne. « J’ai raconté » est plus idiomatique que « j’ai dit » pour communiquer des rêves; la parole directe et la tension prophétique du grec sont conservées.
