source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Τότε⁸ λέγει μοι ὁ πατήρ μου· Πιστεύω⁹ *τῷ θεῷ¹⁰ ὅτι ζῇ¹¹ Ἰωσήφ¹²· ὁρῶ γὰρ ⌜πάντοτε⌝¹³ ὅτι Κύριος ἀριθμεῖ¹⁴ αὐτὸν μεθʼ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: fr
  text: 'Alors mon père me dit : « Je crois Dieu : Joseph est vivant. Car je vois toujours que le Seigneur le compte parmi nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: Je crois Dieu
  rationale: Le datif après πιστεύω exprime ici la confiance accordée à Dieu ou l'adhésion à ce qu'il atteste. « Je crois Dieu » conserve cette construction et évite de la réduire à la simple croyance en son existence.
- source_word: ζῇ Ἰωσήφ
  choice: Joseph est vivant
  rationale: Rend directement le présent grec ζῇ dans un français naturel.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: le compte parmi nous
  rationale: Préserve l'image du dénombrement portée par ἀριθμεῖ et le sens inclusif de μεθʼ ἡμῶν.
- source_word: πάντοτε
  choice: toujours
  rationale: Conserve sans l'atténuer la portée temporelle du texte grec.
theological_decisions:
- issue: Nature de la foi exprimée envers Dieu
  choice: « Je crois Dieu »
  alternative: « Je crois en Dieu » ou « J'ai confiance en Dieu »
  rationale: Le grec emploie πιστεύω avec le datif, construction qui porte sur la confiance ou le crédit accordé à Dieu. La formulation retenue garde cette nuance sans introduire une confession doctrinale plus générale.
- issue: Présence de Joseph auprès de la famille
  choice: « le Seigneur le compte parmi nous »
  alternative: « le Seigneur considère qu'il est avec nous »
  rationale: La traduction conserve la métaphore de ἀριθμεῖ et ne précise pas si cette inclusion est familiale, providentielle ou visionnaire.
translation_notes:
  register: Français moderne, digne et direct. La ponctuation après « Je crois Dieu » explicite que « Joseph est vivant » constitue le contenu de cette conviction, tout en respectant la concision et la tension du grec.
