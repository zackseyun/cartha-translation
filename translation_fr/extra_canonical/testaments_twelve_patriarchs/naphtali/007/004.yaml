base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: fr
  text: Ainsi, par ces paroles, il me fit pleurer moi aussi. Quant à moi, je brûlais au plus profond de moi-même de lui annoncer que Joseph avait été vendu, mais j’avais peur de mes frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐποίησε … με δακρῦσαι
  choice: il me fit pleurer
  rationale: Rend directement la construction causative grecque sans alourdir la phrase.
- source_word: τοῖς λόγοις τούτοις
  choice: par ces paroles
  rationale: Le datif exprime ici naturellement le moyen ou la cause.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: je brûlais au plus profond de moi-même
  rationale: Conserve l’image de la brûlure intérieure tout en rendant σπλάγχνα par une expression française naturelle désignant le for intérieur.
- source_word: ἀναγγεῖλαι
  choice: annoncer
  rationale: Reproduit l’idée de faire connaître une nouvelle; le complément indirect « lui » est fourni par le contexte immédiat.
- source_word: πέπραται
  choice: avait été vendu
  rationale: Le parfait passif présente la vente comme un fait accompli dont la conséquence demeure; le plus-que-parfait français convient à la narration au passé.
- source_word: ἐφοβούμην
  choice: j’avais peur
  rationale: Formulation moderne et directe, correspondant à l’imparfait grec.
theological_decisions: []
