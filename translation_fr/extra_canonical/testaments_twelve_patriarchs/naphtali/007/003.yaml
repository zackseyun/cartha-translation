  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: fr
  text: 'Et, tout en pleurant, il disait : « Hélas, mon enfant Joseph, tu es vivant, et je ne te vois pas ; et toi, tu ne vois pas Jacob, qui t’a engendré. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίων
  choice: tout en pleurant
  rationale: Rend le participe présent et la simultanéité avec l’acte de parler dans un français naturel.
- source_word: Οἴμοι
  choice: Hélas
  rationale: Conserve l’exclamation de douleur et son registre digne.
- source_word: τέκνον μου
  choice: mon enfant
  rationale: Exprime directement le lien affectif et familial sans ajouter de nuance absente du grec.
- source_word: ζῇς
  choice: tu es vivant
  rationale: Traduction directe qui souligne le constat bouleversant que Joseph vit encore.
- source_word: τὸν γεννήσαντά σε
  choice: qui t’a engendré
  rationale: Préserve le sens biologique explicite de γεννάω et la relation de la proposition participiale avec Jacob.
