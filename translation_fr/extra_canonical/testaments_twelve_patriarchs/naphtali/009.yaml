  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: fr
  text: '**9** Après leur avoir prescrit beaucoup de choses semblables, il les exhorta à transporter ses ossements à Hébron et à l’ensevelir avec ses pères.


    **2** Après avoir mangé et bu dans la joie de l’âme, il se couvrit le visage et mourut.


    **3** Ses fils exécutèrent en tous points tout ce que Nephtali, leur père, leur avait ordonné.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ τοιαῦτα ἐντειλάμενος
  choice: après leur avoir prescrit beaucoup de choses semblables
  rationale: « Prescrire » exprime des directives qui font autorité tout en convenant au ton testamentaire. « Beaucoup de choses semblables » maintient la référence récapitulative de πολλὰ τοιαῦτα sans ajouter « autres », absent du grec.
- source_word: παρεκάλεσεν
  choice: il les exhorta
  rationale: Le verbe désigne ici un appel pressant. « Exhorta » en conserve la force et la dignité sans lui donner une nuance militaire.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: transporter ses ossements
  rationale: Le verbe indique le déplacement des restes vers un autre lieu. « Ossements » rend explicitement ὀστᾶ et appartient naturellement au vocabulaire funéraire français.
- source_word: ἐν Χεβρών
  choice: à Hébron
  rationale: Avec le verbe de déplacement, la préposition indique ici la destination malgré son sens local habituel.
- source_word: θάψωσι αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: l’ensevelir avec ses pères
  rationale: Cette formulation conserve l’image familiale et patriarcale du grec ainsi que son expression traditionnelle, sans la réduire à la notion plus générale d’ancêtres.
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: dans la joie de l’âme
  rationale: La traduction garde l’intériorité de ψυχή et le ton serein et solennel de la scène de mort.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: il se couvrit le visage
  rationale: La formulation directe suit le geste concret décrit par le grec et en préserve la sobriété.
- source_word: κατὰ πάντα ὅσα
  choice: en tout ce que
  rationale: Cette tournure française naturelle exprime l’accomplissement intégral de ce qui avait été ordonné.
theological_decisions:
- issue: Statut de la ligne annonçant le testament suivant
  choice: La conserver entre crochets comme transition paratextuelle, accompagnée d’une note.
  alternative: L’omettre parce qu’elle ne fait pas partie des dernières paroles de Nephtali, ou l’imprimer comme texte courant.
  rationale: L’incipit est attesté comme clôture transitionnelle du témoin grec consulté, mais il n’appartient pas au récit de la mort de Nephtali. Les crochets et la note rendent sa présence et sa fonction transparentes.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire funéraire (« ossements », « ensevelir ») conserve la couleur concrète et solennelle du grec. Les répétitions familiales du verset 3 sont légèrement réordonnées pour obtenir une syntaxe française naturelle sans modifier les relations exprimées.
