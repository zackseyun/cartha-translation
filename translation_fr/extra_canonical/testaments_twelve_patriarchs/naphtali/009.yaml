review_pass:
  verdict: revise
  source_fidelity: 'Le texte traduit fidèlement les trois versets grecs fournis : les ordres, le transfert explicite des ossements à Hébron, l’ensevelissement « avec ses pères », le repas joyeux, le geste de couvrir son visage et l’obéissance des fils sont préservés. Toutefois, l’incipit du Testament de Gad ne figure pas dans le texte grec fourni sous « original_language_source » ; il ne doit donc pas être ajouté au texte français sur la seule base de la piste d’audit anglaise.'
  naturalness: Le français est globalement sobre et naturel. Au v. 3, « firent en tout ce que » est compréhensible, mais « exécutèrent en tous points tout ce que » rend plus clairement l’insistance cumulative de κατὰ πάντα ὅσα et est plus idiomatique dans ce contexte.
  terminology: « Prescrit », « exhorta », « ossements », « ensevelir » et « joie de l’âme » conviennent au registre testamentaire et funéraire, sans surcharge confessionnelle. Les noms « Nephtali », « Gad » et « Zilpa » suivent des formes françaises usuelles ; la mention de Gad est néanmoins retirée, car absente de la source grecque ici fournie.
  issues:
  - severity: medium
    issue: Ajout d’un incipit et de sa note sans attestation dans le texte grec source fourni
    rationale: Le grec transmis s’achève à 9.3 (« ... Νεφθαλεὶ ὁ πατὴρ αὐτῶν ») et ne contient pas l’incipit du Testament de Gad. La piste anglaise affirme une clôture différente, mais l’examen de la source première fournie ne permet pas de l’insérer dans la traduction. Le retirer préserve la fidélité à la source et évite d’introduire un paratexte non attesté ici.
  - severity: low
    issue: Rendu incomplet de l’intensification au v. 3
    rationale: « En tout ce que » peut rendre ὅσα, mais exprime moins nettement κατὰ πάντα. « En tous points, tout ce que » conserve les deux éléments sans alourdir excessivement la phrase.
