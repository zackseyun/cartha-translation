source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: fr
  text: 'Et voici qu’un navire approchait, voguant sans marins ni pilotes. Sur le navire était inscrit : « Navire de Jacob. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχετο
  choice: approchait
  rationale: L’imparfait exprime une action en cours; « approchait » rend naturellement le mouvement du navire dans ce contexte.
- source_word: ἁρμενίζον
  choice: voguant
  rationale: Le participe décrit le navire en train de naviguer; « voguant » conserve cette simultanéité dans un français naturel et soutenu.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: sans marins ni pilotes
  rationale: ἐκτός suivi du génitif signifie ici « sans, dépourvu de ». Cette lecture suit directement le grec, contrairement à l’anglais de consultation qui porte « with ».
- source_word: ἐπεγέγραπτο
  choice: était inscrit
  rationale: Le plus-que-parfait passif grec décrit une inscription déjà apposée et visible sur le navire; la tournure française restitue naturellement cet état résultant.
- source_word: πλοῖον Ἰακώβ
  choice: « Navire de Jacob »
  rationale: Cette formulation brève préserve le caractère nominal de l’inscription grecque, sans ajouter d’article absent du texte.
theological_decisions: []
