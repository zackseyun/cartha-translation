  text: 9. Ὡς δὲ ἐπαύσατο ὁ χειμών, *ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς⁴⁶, Γὥσπερ⁴⁷ ἐν εἰρήνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/009.yaml
  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: fr
  text: Quand l’hiver[a] eut cessé, le bateau parvint à terre, comme en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la tempête » ; le mot grec peut désigner l’hiver ou le mauvais temps, notamment une tempête.'
    reason: Le contexte nautique permet cette autre acception de χειμών, tandis que « l’hiver » reste le sens principal retenu dans le texte.
lexical_decisions:
- source_word: χειμών
  choice: l’hiver
  rationale: Le sens premier est « hiver », et ce choix correspond directement au grec, tout en laissant signaler en note le sens maritime possible de « tempête » ou « mauvais temps ».
- source_word: ἔφθασε … ἐπὶ τῆς γῆς
  choice: atteignit la terre
  rationale: Cette formulation française naturelle exprime l’arrivée du bateau à terre sans ajouter l’idée plus précise d’un accostage.
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: comme en temps de paix
  rationale: Rend la comparaison inhabituelle du grec dans un français compréhensible, sans préciser davantage ce que cette paix désigne.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La tournure « comme en temps de paix » conserve l’étrangeté et l’ouverture interprétative de la comparaison grecque.
