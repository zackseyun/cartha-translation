  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: fr
  text: Mais Joseph s’en alla dans une petite embarcation, et nous fûmes séparés sur neuf planches. Lévi et Juda étaient ensemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκάτιον
  choice: petite embarcation
  rationale: Le terme désigne une petite embarcation ou un petit bateau. « Petite embarcation » est naturel en français et ne précise pas indûment son type.
- source_word: διεχωρίσθημεν
  choice: nous fûmes dispersés
  rationale: Le passif exprime la séparation du groupe en plusieurs éléments; « dispersés » rend bien cette distribution sur les neuf planches.
- source_word: σανίδων ἐννέα
  choice: neuf planches
  rationale: Traduction directe du grec, qui évoque des planches de bois sans indiquer davantage leur fonction.
- source_word: ἐπὶ τὸ αὐτό
  choice: ensemble
  rationale: Cette locution idiomatique signifie ici que Lévi et Juda se trouvaient réunis au même endroit.
