source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ³⁷ διεσπάρημεν³⁸ πάντες εἰς³⁹ τὰ πέρατα *τῆς γῆς⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/007.yaml
  text: And we were scattered, all of us, to the ends of the earth[c].
translation:
  language: fr
  text: Et nous avons tous été dispersés jusqu’aux extrémités de la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: La dispersion «jusqu’aux extrémités de la terre» évoque probablement, de manière symbolique, la dispersion au loin, bien que le texte la présente comme un élément du rêve de Nephtali.
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: avons été dispersés
  rationale: Le passif aoriste exprime la dispersion subie par le groupe; cette formulation française en conserve clairement la voix passive.
- source_word: πάντες
  choice: tous
  rationale: Placée après «nous», cette formulation naturelle préserve l’insistance du grec sur la totalité du groupe.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: jusqu’aux extrémités de la terre
  rationale: Cette expression rend le mouvement vers les régions les plus éloignées et conserve la portée imagée possible de la formule grecque.
theological_decisions:
- issue: Portée de la dispersion dans le récit du rêve
  choice: Conserver l’image des «extrémités de la terre» sans l’interpréter dans le corps du texte
  alternative: Expliciter une dispersion parmi toutes les nations
  rationale: Le grec décrit la scène sans préciser lui-même si sa portée est géographique, symbolique ou prophétique; la traduction maintient cette ouverture.
translation_notes:
  register: Français moderne, clair et digne. «Nous avons tous été dispersés» est plus naturel que «nous fûmes tous dispersés» tout en conservant le passif et l’insistance de πάντες.
