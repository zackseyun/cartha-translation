source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
translation:
  language: fr
  text: Et de nouveau, sept jours plus tard, je vis que mon père Jacob se tenait dans la mer d’Amnia[a], et que nous étions avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification du lieu appelé « Amnia » est incertaine ; la traduction conserve la forme grecque au lieu de proposer une localisation conjecturale.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ πάλιν
  choice: Et de nouveau
  rationale: Rend directement la reprise narrative exprimée par le grec, dans un français naturel et digne.
- source_word: μετὰ ἡμέρας ἑπτὰ
  choice: sept jours plus tard
  rationale: Expression idiomatique française correspondant au sens temporel littéral « après sept jours ».
- source_word: ἴστατο ἐν τῇ θαλάσσῃ
  choice: se tenait dans la mer
  rationale: Préserve la préposition grecque ἐν (« dans ») plutôt que de suivre la consultation anglaise « by » (« au bord de »), qui résout implicitement une difficulté du texte.
- source_word: Ἀμνείας
  choice: d’Amnia
  rationale: Translittère le toponyme grec sans proposer d’identification conjecturale.
- source_word: ἡμεῖς σὺν αὐτῷ
  choice: nous étions avec lui
  rationale: Restitue naturellement en français la proposition nominale grecque, avec le verbe « être » sous-entendu.
theological_decisions: []
translation_notes:
  register: Français moderne international, narratif et digne. La formulation conserve l’étrangeté possible de « dans la mer » afin de ne pas remplacer le grec par l’interprétation « au bord de la mer ».
