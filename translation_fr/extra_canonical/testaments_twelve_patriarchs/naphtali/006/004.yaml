  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
translation:
  language: fr
  text: Quand nous fûmes entrés, une violente tempête se leva, et une grande bourrasque de vent. Alors notre père s’éloigna de nous, tenant les gouvernails[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile ici : le mot traduit par « gouvernails » signifie habituellement « cous » ou « nuques », mais le contexte pourrait indiquer un sens nautique.'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσήλθομεν
  choice: nous fûmes entrés
  rationale: Rend naturellement l’aoriste de εἰσέρχομαι tout en laissant le contexte déterminer le lieu ou l’embarcation dans lesquels ils entrent.
- source_word: γίνεται χειμὼν σφοδρός
  choice: une violente tempête se leva
  rationale: Dans ce contexte nautique, χειμών désigne une tempête plutôt que simplement l’hiver ou le mauvais temps; « se leva » exprime idiomatiquement γίνεται.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: un grand tourbillon de vent
  rationale: Conserve l’image intense et quelque peu redondante du grec sans la réduire à la première mention de la tempête.
- source_word: ἀφίσταται
  choice: s’éloigna
  rationale: Exprime le mouvement de retrait ou d’éloignement sans imposer une séparation passive.
- source_word: κρατῶν τοὺς αὐχένας
  choice: tenant les gouvernails
  rationale: Le sens ordinaire de αὐχένες est « cous » ou « nuques », mais le cadre nautique et la tradition textuelle suggèrent ici des éléments servant à diriger l’embarcation; la difficulté est signalée en note.
