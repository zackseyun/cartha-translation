lexical_decisions:
- source_word: περιβαλλόμενος σάκκον
  choice: revêtu d’un sac
  rationale: Rend naturellement l’action de porter un vêtement de toile de sac, signe de deuil ou d’humiliation, sans ajouter une interprétation absente du grec.
- source_word: ἐδέετο
  choice: priait
  rationale: L’imparfait exprime une action en cours dans le récit; «priait» restitue ici simplement l’idée d’adresser une supplication.
- source_word: τοῦ Κυρίου
  choice: le Seigneur
  rationale: Équivalent français traditionnel et transparent de κύριος avec l’article.
