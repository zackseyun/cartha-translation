review_pass:
  verdict: revise
  source_fidelity: Le texte grec dit littéralement que Lévi, «portant/ayant revêtu un sac», était en train de supplier le Seigneur. L’imparfait ἐδέετο appelle bien un imparfait français. «Priait» est possible, mais «suppliait» rend plus précisément la valeur de déesis; «un sac» risque en français moderne d’évoquer un contenant plutôt qu’un vêtement de toile grossière.
  naturalness: «Revêtu d’un vêtement de sac» est clair en français moderne international, conserve l’image antique sans explicitation interprétative, et évite l’ambiguïté usuelle de «un sac».
  terminology: «Lévi» et «le Seigneur» sont appropriés. «Vêtement de sac» restitue σάκκος sans imposer le terme plus interprétatif «toile de sac» ni une explication rituelle.
  issues:
  - severity: medium
    issue: «Revêtu d’un sac» est lexicalement ambigu en français moderne.
    rationale: Dans l’usage courant, «un sac» désigne d’abord un contenant. Le grec σάκκος désigne ici le vêtement de sac porté par Lévi; «vêtement de sac» rend cette fonction sans ajout doctrinal ou historique.
  - severity: low
    issue: «Priait» atténue la nuance de supplication de ἐδέετο.
    rationale: Le verbe δέομαι signifie demander instamment, supplier. «Suppliait» maintient l’imparfait narratif et reflète plus étroitement le grec.
  revised_text: Mais Lévi, revêtu d’un vêtement de sac, suppliait le Seigneur.
