revisions:
- from: Et nous, ballottés par la tempête en pleine mer, nous étions emportés à la dérive. Le bateau se remplit d’eau et, malmené par les tempêtes, menaçait de se briser.
  to: Et nous, ballottés par la tempête en pleine mer, nous étions emportés. Et le bateau fut rempli d’eau, battu par les vagues, au point de se briser.
  rationale: La révision supprime une précision non exprimée (« à la dérive »), rend le passif grec de manière explicite, et distingue les vagues violentes de la tempête. Elle conserve le caractère consécutif de l’infinitif final sans affirmer que le bateau s’est effectivement brisé.
