  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/005.yaml
  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: fr
  text: Et nous, ballottés par la tempête en pleine mer, nous étions emportés. Et le bateau fut rempli d’eau, battu par les vagues, au point de se briser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: ballottés par la tempête
  rationale: Le participe exprime le fait d’être violemment éprouvés par une tempête; cette formulation est naturelle en français tout en conservant la force de l’image.
- source_word: ἐπὶ τὸ πέλαγος
  choice: en pleine mer
  rationale: πέλαγος désigne la haute ou pleine mer; «en pleine mer» restitue naturellement la situation maritime.
- source_word: ἐφερόμεθα
  choice: nous étions emportés à la dérive
  rationale: L’imparfait passif indique un mouvement subi et continu; «à la dérive» explicite sans surinterprétation l’absence de maîtrise impliquée par le contexte.
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: Le bateau se remplit d’eau
  rationale: Rendu direct et idiomatique de la construction indiquant que l’embarcation fut remplie d’eau.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: malmené par les tempêtes
  rationale: περιρήσσω évoque ici un bateau battu ou violemment secoué; le pluriel «tempêtes» préserve celui de τρικυμίαις.
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: menaçait de se briser
  rationale: La construction consécutive présente la rupture du bateau comme l’issue imminente de la violence subie, sans affirmer qu’elle s’est effectivement produite.
