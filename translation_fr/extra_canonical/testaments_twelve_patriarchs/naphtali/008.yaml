  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: fr
  text: '1. Et voici, mes enfants, je vous ai montré les derniers temps[a] : tout cela arrivera en Israël.


    2. Vous donc, ordonnez à vos enfants de s’unir à Lévi et à Juda. Car, par Juda, le salut se lèvera pour Israël, et en lui Jacob sera béni.


    3. Par son sceptre, Dieu apparaîtra sur la terre, demeurant parmi les humains[b], afin de sauver la descendance d’Israël, et il rassemblera les justes d’entre les nations.


    4. Si donc vous aussi faites le bien, les humains et les anges vous béniront, Dieu sera glorifié parmi les nations grâce à vous, le diable fuira loin de vous, les bêtes sauvages vous craindront, le Seigneur vous aimera et les anges vous soutiendront.


    5. De même que celui qui a bien élevé un enfant garde de lui un bon souvenir, de même une bonne œuvre est gardée en bon souvenir auprès de Dieu.


    6. Mais celui qui ne fait pas le bien sera maudit par les anges et les humains ; à cause de lui, Dieu sera déshonoré parmi les nations ; le diable se l’appropriera comme son propre instrument ; toute bête sauvage le dominera, et le Seigneur le haïra.


    7. En effet, les commandements de la Loi ont deux aspects et s’accomplissent avec discernement.


    8. Il y a un temps pour l’union avec une femme[c], et un temps pour s’en abstenir en vue de la prière[d].


    9. L’un et l’autre sont de Dieu ; mais s’ils n’ont pas lieu selon l’ordre qui leur convient, ils entraînent les humains dans un très grand péché. Il en va de même des autres commandements.


    10. Devenez donc sages en Dieu, mes enfants, et avisés : discernez l’ordre de ses commandements et les prescriptions relatives à toute chose, afin que le Seigneur vous aime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les temps ultimes ».'
    reason: lexical_alternative
  - marker: b
    text: La proposition « demeurant parmi les humains » présente des variations dans les témoins. La traduction suit ici la formulation grecque développée fournie. Les mentions de Juda et de son sceptre portent une forte imagerie royale et salvifique, sans que la traduction impose une interprétation plus précise.
    reason: textual_variant
  - marker: c
    text: « L’union avec une femme » désigne avec retenue l’union sexuelle.
    reason: cultural_note
  - marker: d
    text: 'Littéralement, « un temps de continence en vue de la prière » : il s’agit de s’abstenir de relations sexuelles au moment consacré à la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: les temps à venir
  rationale: Le texte grec transmis est marqué comme incertain autour de ἐσχάτους. « Les temps à venir » restitue naturellement l’horizon eschatologique sans imposer la formule plus technique « les derniers temps ».
- source_word: ἑνοῦνται
  choice: rester unis
  rationale: Exprime l’union durable et la solidarité demandées envers Lévi et Juda.
- source_word: σωτηρία
  choice: le salut
  rationale: Conserve la portée théologique du terme tout en laissant ouverte sa dimension de délivrance collective.
- source_word: σκήπτρου
  choice: sceptre
  rationale: Maintient explicitement l’image royale et dynastique du grec.
- source_word: ὀφθήσεται
  choice: apparaîtra
  rationale: Rend directement la manifestation visible annoncée, sans lui ajouter une formulation doctrinale ultérieure.
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: demeurant parmi les humains
  rationale: « Parmi » convient au contexte de présence divine au milieu de l’humanité, tout en évitant le masculin générique devenu moins naturel.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: la descendance d’Israël
  rationale: « Descendance » restitue γένος de manière digne et naturelle sans la connotation biologique moderne de « race ».
- source_word: ἀνθέξονται ὑμῶν
  choice: vous soutiendront
  rationale: Le verbe peut exprimer le fait de s’attacher à quelqu’un pour le soutenir ; ce choix convient au parallélisme protecteur.
- source_word: μετὰ τέχνης
  choice: avec discernement
  rationale: La littéralité « avec art » serait obscure en français ; le contexte exige une mise en œuvre avisée, attentive à l’ordre approprié.
- source_word: ἐγκρατείας
  choice: s’en abstenir
  rationale: Dans le contraste avec l’union sexuelle, le terme désigne concrètement la continence au moment consacré à la prière.
- source_word: τάξιν
  choice: ordre
  rationale: Préserve le thème structurant de l’agencement approprié des commandements et des actes.
theological_decisions:
- issue: Langage royal et salvifique lié à Juda aux versets 2-3
  choice: Traduire directement l’annonce du salut par Juda, du sceptre et de l’apparition de Dieu.
  alternative: Réduire le passage à une espérance politique ou expliciter qu’il s’agit nécessairement d’une prophétie messianique précise.
  rationale: Le grec porte une forte attente royale et salvifique, mais la traduction ne doit ni l’affaiblir ni en fixer une interprétation confessionnelle plus étroite.
- issue: Présence de Dieu « parmi les humains » au verset 3
  choice: Conserver la proposition dans le texte principal et signaler sa complexité textuelle en note.
  alternative: Lire « en des humains » ou omettre la proposition comme expansion secondaire.
  rationale: La leçon fournie contient la proposition, dont le sens contextuel le plus naturel est une présence sur terre parmi les humains.
- issue: Ordre divin de l’union conjugale et de la continence aux versets 7-9
  choice: Présenter les deux conduites comme venant de Dieu et devant chacune avoir lieu au moment approprié.
  alternative: Transformer le passage en maxime générale sur la modération ou y importer un système précis de pureté rituelle.
  rationale: Le texte donne un exemple concret d’actions légitimes dont la moralité dépend de l’ordre et du temps qui leur conviennent.
- issue: « Le Seigneur le haïra » au verset 6
  choice: Conserver le verbe fort « haïra ».
  alternative: Adoucir en « le rejettera » ou « ne l’aimera pas ».
  rationale: Le grec μισήσει est explicite ; la tension théologique doit être préservée plutôt que résolue par atténuation.
translation_notes:
  register: Français international moderne, digne et accessible. Les connecteurs et répétitions structurantes du grec sont conservés lorsqu’ils restent naturels. « Humains » évite un masculin générique ambigu ; « Loi », « Dieu » et « Seigneur » gardent la solennité religieuse du passage. Les images fortes — salut, sceptre, instrument du diable, amour et haine du Seigneur — ne sont ni neutralisées ni confessionnellement surinterprétées.
