  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: fr
  text: '1. Ne vous empressez donc pas, par cupidité, de corrompre vos actions, ni, par des paroles creuses, de tromper vos âmes. Car, si vous gardez le silence dans la pureté du cœur, vous comprendrez comment vous attacher à la volonté de Dieu et rejeter celle de Béliar.


    2. Le soleil, la lune et les étoiles ne changent pas leur ordre ; vous non plus, ne changez pas la loi de Dieu par le désordre de vos actions.


    3. Les nations se sont égarées et ont abandonné le Seigneur ; elles ont changé leur ordre et obéi au bois et à la pierre, à des esprits d’égarement.


    4. Mais vous, mes enfants, n’agissez pas ainsi. Reconnaissez, dans le firmament, sur la terre, dans la mer et dans toutes les créatures, le Seigneur qui a tout fait, afin de ne pas devenir comme Sodome, qui a changé l’ordre de sa nature.


    5. De même, les Veilleurs ont changé l’ordre de leur nature, et le Seigneur les a maudits lors du déluge ; à cause d’eux, il a rendu la terre inhabitée et stérile.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset présente une formulation grecque difficile et probablement altérée. Le texte semble dire que la terre fut privée d’habitants et rendue stérile ; une variante transmise ajoute « inhabitée ».
    reason: Signaler l’incertitude entourant ἀπὸ κατοικησίας et le mot entre crochets ἀοίκητον, tout en rendant dans le texte principal le sens le plus directement suggéré par les termes conservés.
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: cupidité
  rationale: Rend le désir avide d’avoir davantage, plutôt qu’une simple hâte ou ambition.
- source_word: λόγοις κενοῖς
  choice: paroles creuses
  rationale: Expression française naturelle qui conserve l’idée de paroles vides, dépourvues de substance.
- source_word: κρατεῖν
  choice: vous attacher à
  rationale: Dans la construction avec « la volonté de Dieu », exprime le fait de la tenir fermement sans suggérer qu’on la maîtrise.
- source_word: τάξιν
  choice: ordre
  rationale: Maintient le terme récurrent qui relie l’ordre cosmique, moral et naturel dans les versets 2 à 5.
- source_word: πνεύμασι πλάνης
  choice: esprits d’égarement
  rationale: Conserve l’ambiguïté entre des esprits qui égarent et des esprits caractérisés par l’erreur.
- source_word: Ἐγρήγοροι
  choice: Veilleurs
  rationale: Désignation traditionnelle et intelligible des êtres angéliques éveillés dans la littérature juive ancienne.
- source_word: ἄκαρπον
  choice: stérile
  rationale: Rend littéralement l’absence de fruit ou de fécondité dans un français idiomatique.
theological_decisions:
- issue: Relation entre silence, pureté du cœur et compréhension de la volonté divine
  choice: « si vous gardez le silence dans la pureté du cœur »
  alternative: « en gardant le silence dans la pureté du cœur »
  rationale: Le grec juxtapose le participe « gardant le silence » et le futur « vous comprendrez » sans particule conditionnelle explicite. La formulation conditionnelle suit le sens probable tout en évitant de présenter mécaniquement le silence comme une cause sacramentelle.
- issue: Le « changement de l’ordre de la nature » à Sodome et chez les Veilleurs
  choice: Conserver la formulation générale du texte
  alternative: Préciser une faute sexuelle déterminée
  rationale: Le grec ne précise pas ici la nature exacte de la transgression ; expliciter davantage importerait une interprétation absente du passage.
- issue: Béliar
  choice: Béliar
  alternative: le diable / Satan
  rationale: Conserve le nom propre du texte et n’identifie pas explicitement le personnage au-delà de ce que dit la source.
- issue: Objet de la malédiction au verset 5
  choice: « le Seigneur les a maudits »
  alternative: « le Seigneur a maudit la terre »
  rationale: Le relatif masculin pluriel οὓς renvoie naturellement aux Veilleurs.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel est conservé dans les exhortations. « Firmament » maintient l’imagerie cosmologique ancienne ; « créatures » rend naturellement δημιουργήματα. La répétition d’« ordre » est volontaire afin de préserver la cohésion argumentative du grec.
