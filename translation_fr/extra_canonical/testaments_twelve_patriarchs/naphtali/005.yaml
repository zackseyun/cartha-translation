  text: '1[a]. For in the fortieth year of my life I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still.


    2. And behold, Isaac, the father of my father, said to us, “Run up and let each of you seize them according to his strength; and the one who takes hold of them, his shall be the sun and the moon.”


    3. And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.


    4. And while Levi was like the sun, behold, a certain young man was giving him twelve palm branches[b]; and Judah became bright like the moon, and beneath their feet were twelve rays.


    5. And the two, Levi and Judah, ran up and held them fast.


    6. And behold, there was a bull on the earth, having two great horns and eagle’s wings on its back; and though we wanted to seize it, we were not able.


    7. But Joseph came and took hold of it, and went up with it to the height.


    8. And I saw that I was there, and behold, a holy writing appeared to us, saying: “Assyrians, Medes, Persians,”'
translation:
  language: fr
  text: '**Testament de Nephtali 5**


    **1.** En effet, dans la quarantième année de ma vie, j’eus une vision sur le mont des Oliviers, à l’est de Jérusalem : le soleil et la lune se tenaient immobiles.


    **2.** Et voici qu’Isaac, le père de mon père, nous disait : « Accourez et que chacun de vous les saisisse selon sa force. Celui qui les attrapera possédera le soleil et la lune. »


    **3.** Nous courûmes tous ensemble. Lévi saisit le soleil et Juda, arrivé le premier, attrapa la lune ; tous deux furent élevés avec eux.


    **4.** Tandis que Lévi était comme le soleil, voici qu’un jeune homme lui tendait douze branches de palmier. Juda devint lumineux comme la lune, et douze rayons se trouvaient sous leurs pieds.


    **5.** Les deux accoururent : Lévi et Juda les saisirent fermement.[a]


    **6.** Et voici qu’il y avait sur la terre un taureau pourvu de deux grandes cornes et d’ailes d’aigle sur le dos. Nous voulions l’attraper, mais nous n’en étions pas capables.


    **7.** Cependant, Joseph vint, s’en empara et monta avec lui vers la hauteur.


    **8.** Je vis que j’étais là, tout près, et voici qu’un écrit saint nous apparut et disait : « Les Assyriens, les Mèdes, les Perses, les Chaldéens et les Syriens recevront en héritage les douze sceptres d’Israël réduits en captivité. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque transmise de ce verset est difficile et peut être une reprise secondaire ou résumée de l’action de Lévi et de Juda.
    reason: textual_variant
  - marker: b
    text: 'La construction grecque est inhabituelle. Elle peut aussi se comprendre ainsi : « auront pour héritage, dans la captivité, les douze sceptres d’Israël ». Les « douze sceptres » représentent vraisemblablement les douze tribus, mais la traduction conserve l’image du texte.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὄραμα
  choice: vision
  rationale: Terme naturel et précis pour une révélation vue, conforme au contexte visionnaire.
- source_word: ἕστηκαν
  choice: se tenaient immobiles
  rationale: Le parfait décrit un état fixe dans la vision, et non une action simplement ponctuelle.
- source_word: Προσδραμόντες
  choice: Accourez
  rationale: Conserve l’élan vif de l’impératif grec tout en restant naturel en français.
- source_word: κρατήσατε
  choice: saisisse
  rationale: Exprime une prise ferme et préserve le caractère compétitif de la scène.
- source_word: κατὰ δύναμιν
  choice: selon sa force
  rationale: 'Reproduit la valeur distributive : chacun agit à la mesure de sa propre capacité.'
- source_word: φθάσας
  choice: arrivé le premier
  rationale: Rend l’idée d’antériorité de Juda sans préciser davantage une séquence que le grec laisse concise.
- source_word: ὑψώθησαν
  choice: furent élevés
  rationale: Conserve d’abord le mouvement spatial tout en laissant subsister les éventuelles résonances symboliques.
- source_word: βαΐα φοινίκων
  choice: branches de palmier
  rationale: Désignation concrète, courante et immédiatement compréhensible.
- source_word: ἀκτῖνες
  choice: rayons
  rationale: Correspond directement à l’imagerie lumineuse du soleil et de la lune.
- source_word: κατέλαβεν
  choice: s’en empara
  rationale: Marque la maîtrise réussie de Joseph sur le taureau sans imposer une violence absente du contexte immédiat.
- source_word: γραφὴ ἁγία
  choice: un écrit saint
  rationale: Respecte l’indéfini et le cadre visionnaire sans présupposer qu’il s’agit de l’Écriture canonique au sens ultérieur.
- source_word: σκῆπτρα
  choice: sceptres
  rationale: Maintient l’image politique et tribale du grec au lieu de la remplacer directement par son interprétation probable, « tribus ».
theological_decisions:
- issue: Portée symbolique de Lévi et de Juda
  choice: Conserver sans l’expliquer l’association de Lévi au soleil et de Juda à la lune.
  alternative: Identifier explicitement Lévi au sacerdoce et Juda à la royauté ou à une figure messianique.
  rationale: Le passage présente des images sans en donner ici l’interprétation ; la traduction ne doit pas transformer ces symboles en doctrine explicite.
- issue: Statut de γραφὴ ἁγία
  choice: un écrit saint
  alternative: l’Écriture sainte
  rationale: L’expression grecque est indéfinie et désigne un écrit apparaissant dans une vision ; « l’Écriture sainte » introduirait une détermination canonique plus forte.
- issue: Les douze σκῆπτρα d’Israël
  choice: les douze sceptres d’Israël
  alternative: les douze tribus d’Israël
  rationale: La métaphore du grec est intelligible et doit être conservée, même si elle renvoie vraisemblablement aux douze tribus.
translation_notes:
  register: Français international moderne, digne et narratif. Les tournures visionnaires (« voici que ») sont conservées sans accumulation archaïsante. Les images symboliques demeurent concrètes et ne sont pas remplacées par une interprétation confessionnelle.
