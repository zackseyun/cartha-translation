  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006.yaml
  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
translation:
  language: fr
  text: '**6** ¹ Sept jours plus tard, j’eus encore une vision : mon père Jacob se tenait au bord de la mer d’Amnia[a], et nous étions avec lui. ² Et voici qu’un navire s’approchait sous voiles, sans marins ni pilotes. Il portait cette inscription : « Navire de Jacob. »


    ³ Notre père nous dit : « Venez, montons à bord de notre navire. » ⁴ Dès que nous fûmes montés, une violente tempête se leva, accompagnée d’un puissant tourbillon de vent. Notre père, qui tenait les gouvernails[b], fut séparé de nous. ⁵ Ballottés par la tempête, nous étions emportés en pleine mer. Le navire se remplit d’eau et fut battu par de hautes vagues, au point de se briser.


    ⁶ Joseph, lui, partit dans une petite embarcation. Quant à nous, nous fûmes répartis sur neuf planches ; Lévi et Juda restèrent ensemble. ⁷ Nous fûmes tous dispersés jusqu’aux extrémités de la terre[c]. ⁸ Mais Lévi, vêtu d’un sac, priait le Seigneur. ⁹ Lorsque la tempête cessa, le bateau atteignit la terre, comme en paix. ¹⁰ Et voici que notre père arriva, et nous nous réjouîmes tous d’un même cœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification de la « mer d’Amnia » est incertaine. La traduction conserve la forme du nom transmise par le grec plutôt que de proposer un lieu conjectural.
    reason: cultural_note
  - marker: b
    text: 'Le texte grec est difficile : le mot traduit par « gouvernails » signifie normalement « cous ». Le contexte nautique semble toutefois désigner ici des pièces servant à diriger le navire.'
    reason: textual_variant
  - marker: c
    text: La dispersion « jusqu’aux extrémités de la terre » peut avoir une portée symbolique, mais le texte la présente ici comme un élément de la vision de Nephtali sans en donner explicitement l’interprétation.
    reason: cross_reference
lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  choice: mer d’Amnia
  rationale: Le grec présente Amnia comme un nom de lieu. La translittération conserve cette donnée sans proposer une identification géographique conjecturale.
- source_word: ἁρμενίζον
  choice: s’approchait sous voiles
  rationale: Cette formulation française rend le mouvement du navire et l’image nautique du participe grec.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: sans marins ni pilotes
  rationale: ἐκτός signifie ici « sans » ou « dépourvu de ». Cette traduction suit le texte grec, contrairement à la formulation positive de la couche anglaise de consultation.
- source_word: ἐπεγέγραπτο δὲ τῷ πλοίῳ
  choice: Il portait cette inscription
  rationale: Formulation française naturelle qui exprime clairement qu’un texte était inscrit sur le navire.
- source_word: χειμὼν σφοδρός
  choice: une violente tempête
  rationale: Dans ce contexte maritime, χειμών désigne une tempête plutôt que la saison hivernale, et σφοδρός en marque la force.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: un puissant tourbillon de vent
  rationale: La traduction conserve l’expression emphatique et distincte qui s’ajoute à la violente tempête.
- source_word: ἀφίσταται
  choice: fut séparé de nous
  rationale: Le passif français convient au mouvement de séparation subi dans la scène onirique sans suggérer un départ volontaire.
- source_word: τοὺς αὐχένας
  choice: les gouvernails
  rationale: Le sens ordinaire est « les cous », mais le contexte nautique paraît désigner des éléments servant à diriger le navire. L’incertitude est explicitement signalée en note.
- source_word: χειμαζόμενοι ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: Ballottés par la tempête, nous étions emportés en pleine mer
  rationale: Cette formulation garde la passivité des personnages, la violence de la tempête et la référence à la haute mer.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: battu par de hautes vagues
  rationale: Rend de manière claire l’idée d’un navire violemment malmené au milieu d’une mer démontée.
- source_word: ἀκάτιον
  choice: petite embarcation
  rationale: Équivalent courant et précis pour un petit bateau, sans imposer un type d’embarcation plus spécifique que le grec.
- source_word: σανίδων ἐννέα
  choice: neuf planches
  rationale: Le terme désigne des planches, vraisemblablement des débris sur lesquels les frères sont séparés.
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: comme si elle avait navigué dans le calme
  rationale: Dans le contexte maritime, εἰρήνη évoque ici le calme qui contraste avec la tempête, tout en conservant la comparaison du grec.
- source_word: ὁμοθυμαδόν
  choice: d’un même cœur
  rationale: Expression française biblique mais intelligible qui rend l’unanimité et l’élan commun exprimés par l’adverbe grec.
theological_decisions:
- issue: Portée symbolique de la dispersion dans la vision
  choice: Présenter directement le naufrage et la dispersion comme les événements de la vision
  alternative: Identifier explicitement la scène à l’exil futur des tribus d’Israël
  rationale: Le grec raconte une vision sans en fournir ici l’interprétation. La traduction préserve sa force symbolique sans transformer une implication possible en explication certaine.
- issue: Traduction de Κυρίου dans ce testament juif
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le témoin grec porte Κυρίου et non le tétragramme. « le Seigneur » traduit directement le titre grec tout en conservant un registre révérencieux.
- issue: Navire dépourvu d’équipage
  choice: sans marins ni pilotes
  alternative: avec des marins et des pilotes
  rationale: La lecture négative suit ἐκτός dans le texte grec fourni. Elle maintient aussi l’étrangeté propre à la vision au lieu de la normaliser d’après la couche anglaise.
- issue: Image nautique de τοὺς αὐχένας
  choice: les gouvernails, avec une note d’incertitude
  alternative: les cous
  rationale: Le sens littéral ordinaire produit ici une image obscure. Le contexte favorise une pièce de gouverne, mais la note empêche de présenter cette interprétation contextuelle comme certaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit conserve la vivacité et l’étrangeté de la vision. Les temps narratifs alternent naturellement entre imparfait et passé simple. Les termes maritimes restent courants. La traduction corrige d’après le grec la couche anglaise de consultation en rendant ἐκτός par « sans ». Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
