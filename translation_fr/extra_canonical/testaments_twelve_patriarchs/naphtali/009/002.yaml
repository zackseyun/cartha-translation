  text: And having eaten and drunk with gladness of soul, he covered his face and died.
translation:
  language: fr
  text: Après avoir mangé et bu dans la joie de son âme, il se couvrit le visage et mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: dans la joie de son âme
  rationale: Rend naturellement l’état intérieur de joie exprimé par ἱλαρότης, tout en conservant explicitement ψυχή par « âme ».
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: il se couvrit le visage
  rationale: Le verbe grec et son complément indiquent qu’il couvrit son propre visage ; la tournure pronominale est idiomatique en français.
- source_word: φαγὼν καὶ πιὼν
  choice: Après avoir mangé et bu
  rationale: Les participes aoristes expriment ici des actions accomplies avant les verbes principaux ; cette formulation française en restitue clairement la succession.
