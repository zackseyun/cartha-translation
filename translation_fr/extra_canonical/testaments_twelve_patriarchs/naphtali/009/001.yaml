source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IX. *Καὶ πολλὰ¹ τοιαῦτα ἐντειλάμενος² αὐτοῖς παρεκάλεσεν ἵνα μετακομίσωσι³ τὰ ὀστᾶ αὐτοῦ⁴ *ἐν Χεβρών, καὶ θάψωσι αὐτὸν⁵ μετὰ τῶν πατέρων αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: fr
  text: Après leur avoir donné beaucoup d’instructions semblables, il les exhorta à transporter ses ossements à Hébron et à l’ensevelir avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: leur avoir donné […] des instructions
  rationale: Le participe exprime le fait de donner des prescriptions ou des consignes. « Donner des instructions » est naturel en français et conserve ici la force directive du grec.
- source_word: παρεκάλεσεν
  choice: il les exhorta
  rationale: Le verbe peut signifier exhorter, presser ou supplier selon le contexte. « Exhorta » rend l’appel insistant sans lui donner une tonalité excessivement suppliante.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: transporter ses ossements
  rationale: « Transporter » rend le déplacement vers un autre lieu, et « ossements » est le terme français idiomatique et digne dans un contexte funéraire.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Cette formulation conserve l’expression familiale traditionnelle tout en indiquant naturellement une sépulture en leur compagnie.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la progression du grec tout en évitant un calque lourd. « Pères » est maintenu plutôt que développé en « ancêtres », afin de préserver l’expression et sa portée familiale dans le contexte funéraire.
