  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: fr
  text: Ainsi donc, mes enfants, que toutes vos actions soient en ordre, en vue du bien et dans la crainte de Dieu. Ne faites rien de désordonné avec mépris, ni en dehors du moment qui lui convient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα τὰ ἔργα ὑμῶν
  choice: toutes vos actions
  rationale: « Actions » rend naturellement ἔργα dans ce contexte d’instruction morale, sans se limiter aux travaux matériels.
- source_word: ἐν τάξει
  choice: avec ordre
  rationale: Conserve l’idée explicite d’ordre et fait écho à l’antonyme ἄτακτον dans la proposition suivante.
- source_word: εἰς ἀγαθόν
  choice: en vue du bien
  rationale: Rend la valeur orientée de εἰς sans préciser indûment s’il s’agit du résultat, du but moral ou du bénéfice.
- source_word: ἐν φόβῳ Θεοῦ
  choice: dans la crainte de Dieu
  rationale: Formulation biblique claire et formellement proche du grec, désignant une attitude de respect révérenciel sans effacer le terme « crainte ».
- source_word: ἄτακτον
  choice: de désordonné
  rationale: Préserve le contraste lexical avec ἐν τάξει et la portée morale du manque d’ordre.
- source_word: ἐν καταφρονήσει
  choice: par mépris
  rationale: Exprime naturellement en français la disposition ou le motif de dédain indiqué par καταφρόνησις.
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: en dehors du moment qui lui convient
  rationale: Rend καιρός comme moment opportun ou approprié et maintient le pronom αὐτοῦ, dont le référent exact demeure assez ouvert.
theological_decisions:
- issue: Sens de « crainte de Dieu »
  choice: Conserver « dans la crainte de Dieu »
  alternative: « dans le respect de Dieu »
  rationale: Le grec φόβος comporte une tension entre crainte et révérence. Le terme français traditionnel « crainte » préserve cette amplitude au lieu de la réduire au seul respect.
- issue: Référent de αὐτοῦ dans « son moment »
  choice: « le moment qui lui convient »
  alternative: « le moment fixé par Dieu »
  rationale: Le texte grec ne nomme pas Dieu comme celui qui fixe ce moment. La traduction évite donc d’introduire une détermination théologique absente et rattache prudemment le moment à l’acte concerné.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour la lisibilité, tout en conservant le parallélisme entre l’ordre et le désordre ainsi que l’ambiguïté relative du dernier pronom.
