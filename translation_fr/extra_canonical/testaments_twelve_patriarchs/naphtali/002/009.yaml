  source_fidelity: 'Le projet rend fidèlement les éléments essentiels : l’exhortation adressée aux enfants, l’ordre (ἐν τάξει), l’orientation vers le bien (εἰς ἀγαθόν), la crainte de Dieu, l’interdit de ce qui est désordonné et la réserve concernant le moment approprié. Le pronom αὐτοῦ demeure à juste titre non théologiquement spécifié. Toutefois, « accomplies avec ordre » déplace légèrement ἐν τάξει, qui qualifie plus directement les œuvres comme étant en ordre.'
