  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: fr
  text: Car, telle est sa force, telle est aussi sa parole, que ce soit dans la loi du Seigneur ou dans la loi de Béliar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La couche anglaise d’audit traduit ici « dans les œuvres de Béliar » ; le texte grec fourni lit toutefois « dans la loi de Béliar », comme dans le premier membre.
    reason: Signale de manière précise l’écart textuel dans la documentation fournie, sans attribuer sans preuve la leçon à des témoins particuliers ni modifier le texte traduit.
lexical_decisions:
- source_word: ἰσχὺς
  choice: force
  rationale: Rend directement la capacité ou la puissance de la personne, tout en conservant le parallélisme avec sa parole.
- source_word: λόγος
  choice: parole
  rationale: Le grec transmis porte λόγος, « parole » ou « propos » ; « œuvre » ne correspond pas au texte source fourni.
- source_word: νόμῳ
  choice: loi
  rationale: Le nom νόμος apparaît dans les deux membres de l’alternative selon le texte grec fourni ; la répétition est donc conservée.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom grec, ici opposé au Seigneur.
theological_decisions:
- issue: Parallèle entre la loi du Seigneur et celle de Béliar
  choice: Conserver « loi » dans les deux membres
  alternative: « les œuvres de Béliar »
  rationale: Malgré la révision de la couche anglaise, le texte grec explicitement fourni lit ἐν νόμῳ τοῦ Βελίαρ. Traduire les deux occurrences de νόμος de la même manière préserve le contraste rhétorique sans corriger le texte d’après une autre leçon non présentée.
- issue: Référent du pronom αὐτοῦ
  choice: Employer le masculin singulier « sa » sans expliciter le référent
  alternative: « la force d’une personne… sa parole »
  rationale: Le verset isolé ne nomme pas le référent. La formulation française conserve cette dépendance au contexte et n’ajoute pas « une personne » au texte grec.
translation_notes:
  register: Français moderne, sobre et dignifié. La construction corrélative « telle… telle aussi… » reproduit naturellement le parallélisme grec. Le marqueur [a] figure dans le texte principal.
