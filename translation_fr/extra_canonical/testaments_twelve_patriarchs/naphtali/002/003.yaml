base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: fr
  text: Et il n’y manque rien, pas même un tiers d’un cheveu ; car toute la création a été faite par le poids, la mesure et la règle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνλεῖπον
  choice: il n’y manque rien
  rationale: Rend naturellement en français l’idée d’absence de déficience ou de manque.
- source_word: ἐκ τοῦ ἑνὸς τρίτου τριχός
  choice: pas même un tiers de cheveu
  rationale: Conserve l’image grecque précise d’une quantité infime, sans la remplacer par une expression française plus générale.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: selon un poids, une mesure et une règle
  rationale: Préserve la triple formulation concrète ainsi que l’idée d’un ordre déterminé.
- source_word: πᾶσα ἡ κτίσις
  choice: toute la création
  rationale: Le singulier collectif « création » convient ici à l’ensemble de l’ordre créé.
- source_word: ἐγένετο
  choice: a été faite
  rationale: Exprime la venue à l’existence de la création dans un français clair et dignifié.
theological_decisions:
- issue: Portée de l’ordre créateur
  choice: Conserver la formulation générale « toute la création »
  alternative: « toute créature » ou « chaque chose créée »
  rationale: Le grec πᾶσα ἡ κτίσις désigne naturellement la création dans son ensemble; la traduction n’ajoute aucune précision doctrinale sur son mode de production.
translation_notes:
  register: Français moderne international, sobre et dignifié. La syntaxe reste proche du grec tout en étant naturelle; l’image inhabituelle du « tiers de cheveu » est volontairement conservée.
