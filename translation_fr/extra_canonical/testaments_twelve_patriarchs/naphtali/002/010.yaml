- from: 'Car si tu dis à l’œil : « Écoute », il ne le peut pas ; de même, tant que vous êtes dans les ténèbres, vous ne pouvez pas accomplir les œuvres de la lumière.'
  to: 'Car si tu dis à l’œil : « Écoute ! », il ne pourra pas le faire ; de même, vous ne pouvez pas non plus, étant dans les ténèbres, faire les œuvres de la lumière.'
  rationale: La révision restitue le futur de δύνασθε/δυνήσεται selon leurs formes respectives, l’addition négative de οὐδέ, et la valeur circonstancielle non temporellement limitée du participe ὄντες. Elle conserve l’image de l’œil à qui l’on ordonne d’écouter ainsi que l’expression « œuvres de la lumière ».
