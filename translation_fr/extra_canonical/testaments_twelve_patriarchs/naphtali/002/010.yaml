id: T12P.NAP.2.10
reference: Testament of Naphtali 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: fr
  text: 'Car si tu dis à l’œil : « Écoute ! », il ne pourra pas le faire ; de même, vous ne pouvez pas non plus, étant dans les ténèbres, faire les œuvres de la lumière.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: à l’œil
  rationale: Équivalent direct qui conserve l’image corporelle et le contraste avec l’action d’entendre.
- source_word: Ἄκουε
  choice: Écoute
  rationale: Impératif présent rendu naturellement en français, sans expliciter davantage l’impossibilité sensorielle.
- source_word: ἐν σκότει ὄντες
  choice: tant que vous êtes dans les ténèbres
  rationale: Rend la construction participiale de manière idiomatique tout en conservant l’état ou la situation dans les ténèbres.
- source_word: ποιεῖν ἔργα φωτός
  choice: accomplir les œuvres de la lumière
  rationale: Conserve le vocabulaire concret et la portée éthique ou théologique de l’expression grecque, sans la réduire à de simples « bonnes actions ».
theological_decisions:
- issue: Rapport entre ténèbres et incapacité d’accomplir les œuvres de la lumière
  choice: Conserver l’affirmation d’incapacité telle quelle
  alternative: Paraphraser comme une simple difficulté morale à bien agir
  rationale: Le grec emploie δύνασθε et établit une analogie forte avec l’impossibilité pour l’œil d’entendre ; la traduction ne doit pas atténuer cette tension.
translation_notes:
  register: Français moderne, clair et digne. Le passage du singulier « tu » dans l’exemple au pluriel « vous » dans l’application suit précisément le grec. « Les œuvres de la lumière » est conservé comme expression imagée et théologiquement ouverte.
