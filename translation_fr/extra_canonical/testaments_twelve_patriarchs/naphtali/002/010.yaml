review_pass:
  verdict: revise
  source_fidelity: La structure argumentative et l’alternance du singulier (« tu ») puis du pluriel (« vous ») sont bien rendues. Toutefois, « tant que vous êtes » introduit une restriction temporelle absente du participe grec ἐν σκότει ὄντες (« étant dans les ténèbres »). Le futur οὐ δυνήσεται est plus exactement rendu par « ne pourra pas », et οὐδέ appelle explicitement « non plus ».
  naturalness: Le français du projet est clair et digne. La formulation révisée conserve cette lisibilité tout en évitant l’ajout interprétatif de « tant que ».
  terminology: « les œuvres de la lumière » est un rendu fidèle, naturel et théologiquement non réducteur de ἔργα φωτός. « Ténèbres » convient à σκότος dans cette antithèse figurée.
  issues:
  - severity: medium
    issue: « tant que vous êtes dans les ténèbres » ajoute une nuance temporelle.
    rationale: Le grec emploie le participe circonstanciel ὄντες, « étant », sans indiquer que l’incapacité ne durerait que jusqu’à une limite temporelle explicitée.
  - severity: low
    issue: Le futur grec et la particule négative additive ne sont pas pleinement représentés.
    rationale: οὐ δυνήσεται est au futur (« ne pourra pas ») et οὐδέ signifie « ne… pas non plus » dans l’application de l’analogie.
  revised_text: 'Car si tu dis à l’œil : « Écoute ! », il ne pourra pas le faire ; de même, vous ne pouvez pas non plus, étant dans les ténèbres, faire les œuvres de la lumière.'
