  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: fr
  text: 'Et, de même que le potier connaît l’usage de chacun, selon ce qui convient[a], de même le Seigneur connaît le corps : jusqu’à quand il durera dans le bien et quand il entrera dans le mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec est incertain à cet endroit. Il se lit littéralement : « l’usage de chacun, comme/selon ce qui convient »; le lien précis de cette dernière expression avec le reste de la proposition demeure difficile.'
    reason: Signale l’incertitude textuelle et syntaxique sans introduire un objet sous-entendu, tel que « vase », ni imposer une interprétation.
lexical_decisions:
- source_word: κεραμεύς
  choice: potier
  rationale: Équivalent français direct et naturel du métier désigné.
- source_word: ἑνὸς ἑκάστου τὴν χρῆσιν
  choice: à quel usage chacun
  rationale: Conserve « chacun » sans ajouter explicitement « vase » ou « objet », absent du grec transmis, tout en donnant à la phrase une syntaxe française intelligible.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Rend littéralement le groupe nominal grec défini sans préciser de quel corps il s’agit.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: persévérera dans le bien
  rationale: « Persévérera » exprime ici l’idée de durer ou tenir jusqu’à un certain terme, tandis que « dans le bien » préserve la formulation morale générale du grec.
- source_word: ἔρχεται ἐν κακῷ
  choice: en viendra au mal
  rationale: Reproduit le mouvement exprimé par ἔρχεται sans introduire l’image plus forte d’une chute; « mal » reste sans article, conformément à la tournure grecque.
theological_decisions:
- issue: Portée de la connaissance du Seigneur concernant le corps
  choice: '« le Seigneur connaît le corps : il sait combien de temps… »'
  alternative: « le Seigneur sait combien de temps le corps… »
  rationale: La reprise par « il sait » clarifie naturellement le rapport syntaxique sans expliquer si cette connaissance relève de la prescience, du jugement ou d’une autre notion théologique.
- issue: Nature du « bien » et du « mal »
  choice: Conserver les expressions générales « dans le bien » et « au mal »
  alternative: Les expliciter comme conduite vertueuse et conduite pécheresse
  rationale: Le texte grec ne précise pas davantage leur portée; l’explicitation imposerait une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « de même que… de même aussi » conserve la structure argumentative du grec. La formulation évite d’ajouter « vase », sous-entendu possible dans l’image du potier mais absent du texte conservé.
