  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: fr
  text: En effet, de même que le potier sait quelle quantité le récipient peut contenir et apporte l’argile en conséquence, de même aussi le Seigneur façonne le corps à la ressemblance de l’esprit et, selon la capacité du corps, y place l’esprit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκεῦος
  choice: récipient
  rationale: Le terme désigne ici un objet façonné par le potier et envisagé selon sa contenance; « récipient » exprime naturellement ces deux aspects sans préciser indûment sa forme.
- source_word: πόσον χωρεῖ
  choice: quelle contenance aura
  rationale: La tournure grecque signifie littéralement « combien il contient/peut contenir ». Le futur français convient au potier qui connaît d’avance la capacité de l’objet qu’il va façonner.
- source_word: πρὸς αὐτὸ φέρει τὸν πηλόν
  choice: apporte l’argile en conséquence
  rationale: Cette formulation conserve le rapport entre la contenance prévue et la quantité d’argile apportée, tout en évitant un pronom français dont le référent serait maladroit.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: à la ressemblance de l’esprit
  rationale: Rendu formel qui préserve la formulation inhabituelle et son ambiguïté plutôt que de la réduire à « en fonction de l’esprit ».
- source_word: ποιεῖ τὸ σῶμα
  choice: façonne le corps
  rationale: Dans le cadre de l’image du potier, « façonne » rend ποιεῖ avec naturel et maintient la métaphore de la fabrication.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος
  choice: selon la capacité du corps
  rationale: δύναμις peut désigner la puissance ou la capacité; ici, le parallèle avec la contenance du récipient favorise « capacité ».
- source_word: τὸ πνεῦμα ἐπιτίθησιν
  choice: y place l’esprit
  rationale: ἐπιτίθησιν signifie poser, appliquer ou placer sur/dans. « Y place » suit le parallélisme et le sens contextuel sans développer une théorie précise de l’union du corps et de l’esprit.
theological_decisions:
- issue: Rapport entre le corps et l’esprit dans l’acte créateur
  choice: 'Conserver les deux propositions: le corps est façonné « à la ressemblance de l’esprit », puis l’esprit est placé selon la capacité du corps.'
  alternative: Harmoniser les deux membres en disant que Dieu adapte simplement le corps à l’esprit ou l’esprit au corps.
  rationale: Le grec présente une tension réciproque et potentiellement énigmatique entre la ressemblance de l’esprit et la capacité du corps. La traduction ne doit pas résoudre cette anthropologie à la place du texte.
- issue: Sens de πνεῦμα
  choice: « esprit » dans les deux occurrences, sans majuscule.
  alternative: « Esprit » au sens de l’Esprit divin, ou « âme ».
  rationale: Le contexte oppose ou associe le πνεῦμα humain au corps. La minuscule évite d’identifier sans fondement le terme au Saint-Esprit, tandis que « âme » modifierait le lexique grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure comparative du grec et la répétition de « l’esprit », importante pour le raisonnement. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
