id: T12P.NAP.2.7
reference: Testament of Naphtali 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: fr
  text: Et de même qu’il existe une séparation entre la lumière et les ténèbres, entre la vue et l’ouïe, de même il existe une distinction entre un homme et un autre, et entre une femme et une autre ; et l’on ne peut pas dire que, par son apparence, l’un soit inférieur à l’autre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de la dernière proposition est difficile et probablement altéré. On peut aussi comprendre : « quant aux traits du visage, l’un était inférieur » ; toutefois, le sens comparatif exact demeure incertain.'
    reason: Signaler honnêtement l’état problématique du texte transmis et préserver l’ambiguïté de πρόσωπον ainsi que de la construction finale.
lexical_decisions:
- source_word: κεχώρισται
  choice: « il existe une séparation » / « il existe une distinction »
  rationale: Le verbe exprime une séparation ou une différenciation. « Séparation » convient aux réalités opposées que sont la lumière et les ténèbres ; « distinction » rend plus naturellement le même verbe lorsqu’il s’applique aux personnes, sans suggérer nécessairement une rupture entre elles.
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: « entre la vue et l’ouïe »
  rationale: Les deux noms désignent ici des facultés sensorielles mises en parallèle. « Vue » et « ouïe » forment en français un couple naturel et précis.
- source_word: ἀνάμεσον ἀνδρὸς καὶ ἀνδρός
  choice: « entre un homme et un autre »
  rationale: Cette formulation idiomatique conserve la comparaison entre deux personnes de sexe masculin sans la lourdeur de « entre homme et homme ».
- source_word: ἐν τῷ ἑνὶ τοῖς προσώποις
  choice: « par son apparence »
  rationale: Le texte grec transmis est syntaxiquement difficile. πρόσωπον peut évoquer le visage, les traits ou plus largement l’apparence ; la traduction retient le sens général requis par le contexte tout en signalant l’incertitude en note.
- source_word: ἡττόμενον
  choice: « inférieur »
  rationale: Le participe exprime l’idée d’être moindre ou inférieur. La formulation française maintient cette comparaison sans préciser un critère que le grec n’explicite pas clairement.
theological_decisions:
- issue: Rapport entre les différences individuelles et la valeur des personnes
  choice: Conserver à la fois l’affirmation d’une distinction entre les individus et l’impossibilité de déclarer l’un inférieur à l’autre d’après son apparence.
  alternative: Uniformiser le propos en affirmant que tous les visages sont identiques, ou en faire une déclaration générale d’égalité absolue sans référence à l’apparence.
  rationale: Le passage reconnaît des différences réelles tout en refusant une conclusion d’infériorité fondée sur l’apparence. La traduction ne résout pas cette tension en faveur d’une doctrine particulière et n’ajoute pas une identité que le grec n’énonce pas.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition structurante « entre… et… » est maintenue, tandis que « un homme et un autre » et « une femme et une autre » évitent un calque peu naturel. La note rend visible l’incertitude textuelle sans alourdir le corps du verset.
