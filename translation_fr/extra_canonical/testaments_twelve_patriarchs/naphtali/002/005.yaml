  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: fr
  text: Car il n’existe aucun être créé ni aucune pensée que le Seigneur ne connaisse ; en effet, il a tout créé, et il a créé l’être humain à sa propre image.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis de la dernière proposition est grammaticalement difficile. La traduction suit la lecture qui distingue la création de toutes choses de la création de l’être humain à l’image de Dieu.
    reason: Signaler honnêtement l’incertitude textuelle sans alourdir le corps du texte ni présenter la reconstruction comme absolument certaine.
lexical_decisions:
- source_word: πλάσμα
  choice: être créé
  rationale: Le nom désigne ce qui a été façonné ou créé. « Être créé » est naturel en français et évite l’ambiguïté moderne de « création », qui peut désigner soit l’acte, soit son résultat.
- source_word: πᾶσα ἔννοια
  choice: aucune pensée
  rationale: Dans la construction négative, cette expression désigne toute pensée ou conception. « Aucune pensée » restitue clairement la portée universelle.
- source_word: ἔγνω
  choice: ne connaisse
  rationale: Le parfait grec exprime ici une connaissance acquise et présente ; le français idiomatique emploie simplement « connaître ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel peut avoir le sens collectif de « toutes choses » ; « il a tout créé » est la formulation française la plus naturelle.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier générique ἄνθρωπος renvoie à l’humanité, sans mettre spécialement l’accent sur le sexe masculin. « L’être humain » conserve ce sens générique.
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: à sa propre image
  rationale: Cette traduction directe conserve la formulation théologique et la référence réfléchie au créateur.
theological_decisions:
- issue: Étendue de la connaissance du Seigneur
  choice: « aucun être créé ni aucune pensée que le Seigneur ne connaisse »
  alternative: « aucun dessein de sa création que le Seigneur ne connaisse »
  rationale: Le texte grec distingue πλάσμα de πᾶσα ἔννοια. La traduction maintient donc les deux éléments au lieu de les fusionner en une interprétation téléologique.
- issue: Humanité créée à l’image divine
  choice: « l’être humain à sa propre image »
  alternative: « l’homme à son image »
  rationale: Le singulier générique est conservé, mais exprimé dans un français international actuel qui inclut clairement toute l’humanité, sans ajouter une doctrine particulière.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe garde le parallélisme explicatif du grec, tandis que « être créé » et « être humain » évitent des formulations artificielles ou inutilement genrées.
