  - severity: medium
    issue: Confusion potentielle entre νεφροί et ὀσφύς
    rationale: Le grec distingue les νεφροί, les reins comme organes, des ὀσφύες, les lombes/la région lombaire. Employer « reins » pour les deux efface cette distinction, malgré la note.
  - severity: low
