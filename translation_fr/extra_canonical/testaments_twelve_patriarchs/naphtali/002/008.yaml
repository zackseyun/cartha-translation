revisions:
- from: 'Car Dieu a fait toutes choses bonnes, chacune à sa place : les cinq sens dans la tête; il a relié le cou à la tête et y a ajouté les cheveux pour la beauté et la gloire; puis le cœur pour l’intelligence, le ventre pour l’évacuation[a], l’estomac pour broyer, la trachée pour respirer[b], le foie pour la colère, la bile pour l’amertume, la rate pour le rire, les reins pour la ruse, les muscles lombaires[c] pour la force, le flanc pour dormir[d], les reins[e] pour la vigueur, et ainsi de suite.'
  to: 'Car Dieu a fait toutes choses bonnes selon un ordre : les cinq sens dans la tête; il a uni le cou à la tête et y a ajouté des cheveux pour la beauté et la gloire; puis le cœur pour l’intelligence, le ventre pour l’évacuation[a], l’estomac pour broyer, le tube pour la santé[b], le foie pour la colère, la bile pour l’amertume, la rate pour le rire, les reins pour la ruse, les psoas[c] pour la force, le flanc pour dormir[d], les lombes[e] pour la vigueur, et ainsi de suite.'
  rationale: La révision conserve la structure et les associations corporelles du grec, y compris les lectures difficiles que l’anglais ne reproduit pas entièrement. Elle retire l’interprétation non garantie « trachée pour respirer », rend ὀσφύες par « lombes » afin de le distinguer de νεφροί, et complète l’annotation de la leçon entre crochets ψύαι.
