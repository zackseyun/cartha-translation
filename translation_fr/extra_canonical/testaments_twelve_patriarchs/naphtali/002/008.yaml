base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: fr
  text: 'Car Dieu a fait toutes choses bonnes selon un ordre : les cinq sens dans la tête; il a uni le cou à la tête et y a ajouté des cheveux pour la beauté et la gloire; puis le cœur pour l’intelligence, le ventre pour l’évacuation[a], l’estomac pour broyer, le tube pour la santé[b], le foie pour la colère, la bile pour l’amertume, la rate pour le rire, les reins pour la ruse, les psoas[c] pour la force, le flanc pour dormir[d], les lombes[e] pour la vigueur, et ainsi de suite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est incertain; littéralement, le mot peut signifier « distinction » ou « séparation ». Dans ce contexte corporel, il paraît désigner l’élimination des déchets.
    reason: Signaler une leçon marquée comme douteuse et préserver son ambiguïté.
  - marker: b
    text: 'Littéralement : « le tube pour la santé ». Le nom de l’organe et le terme indiquant sa fonction sont incertains dans l’édition. Il pourrait s’agir de la trachée et de la respiration, mais cette interprétation reste conjecturale.'
    reason: Préserver dans le texte l’incertitude des deux termes tout en donnant l’interprétation anatomique probable.
  - marker: c
    text: Le grec est ici éditorialement reconstruit ou incertain. Le terme désigne probablement les psoas, des muscles profonds de la région lombaire.
    reason: Signaler le statut textuel de la leçon et expliciter le terme anatomique.
  - marker: d
    text: 'Toute cette expression est textuellement incertaine; littéralement : « le flanc pour dormir ».'
    reason: Conserver la proposition grecque reçue tout en signalant sa corruption probable.
  - marker: e
    text: Le terme grec désigne les lombes, c’est-à-dire la région lombaire; il est distinct des « reins » mentionnés plus haut.
    reason: Préserver la distinction anatomique entre ὀσφύες et νεφροί.
lexical_decisions:
- source_word: ἐν τάξει
  choice: chacune à sa place
  rationale: Rend naturellement l’idée d’un ordre ou d’un agencement assigné à chaque partie.
- source_word: φρόνησις
  choice: intelligence
  rationale: Désigne ici la faculté de comprendre ou de discerner, traditionnellement située dans le cœur.
- source_word: διάκρισις
  choice: évacuation
  rationale: Dans ce catalogue physiologique, le terme paraît désigner la séparation ou l’élimination, mais le texte est incertain.
- source_word: ἀλεσμός
  choice: broyer
  rationale: Conserve l’image concrète de la mouture appliquée à la fonction de l’estomac.
- source_word: κάλαμος
  choice: trachée
  rationale: Le sens littéral est « roseau/tube »; dans l’anatomie décrite, il s’agit vraisemblablement de la trachée.
- source_word: πανουργία
  choice: ruse
  rationale: Conserve la nuance potentiellement négative d’habileté rusée sans l’atténuer en simple ingéniosité.
- source_word: ψύαι
  choice: muscles lombaires
  rationale: Terme anatomique désignant les muscles de la région lombaire, notamment les psoas.
- source_word: πλευρά
  choice: flanc
  rationale: Équivalent anatomique direct, malgré l’incertitude textuelle de toute la proposition.
- source_word: ὀσφύς
  choice: reins
  rationale: Désigne la région des reins ou les lombes; « reins » convient au registre français traditionnel, tout en étant distingué des organes précédemment nommés.
theological_decisions:
- issue: La bonté et l’ordre de la création corporelle
  choice: « Dieu a fait toutes choses bonnes, chacune à sa place »
  alternative: « Dieu a bien fait toutes choses dans l’ordre »
  rationale: La formulation retenue conserve à la fois καλά, « bonnes », et ἐν τάξει, l’agencement ordonné des parties, sans transformer le passage en affirmation doctrinale plus large.
- issue: Associations symboliques entre organes et dispositions
  choice: Les rendre littéralement sans les rationaliser
  alternative: Les expliquer ou les remplacer par des fonctions physiologiques modernes
  rationale: Le texte associe explicitement certains organes à la colère, l’amertume, le rire et la ruse; ces tensions anthropologiques doivent rester visibles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure cumulative du catalogue grec, avec des points-virgules pour la lisibilité. Les lectures textuellement douteuses ne sont pas harmonisées avec la couche anglaise, qui omet ou réordonne certains éléments du grec.
