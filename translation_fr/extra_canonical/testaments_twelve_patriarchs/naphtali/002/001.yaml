  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: fr
  text: 'Ma mère, Bilha, était fille de Routhaïos, frère de Débora, la nourrice de Rébecca ; elle était née le même jour que Rachel. 10 Routhaïos était de la lignée d’Abraham. C’était un Chaldéen, un homme qui craignait Dieu, de condition libre et de noble naissance. 11 Après avoir été fait prisonnier, il fut acheté par Laban. Celui-ci lui donna pour femme sa servante Eunan. Elle mit au monde une fille, et Routhaïos l’appela Zélpha, du nom de la ville où il avait été fait prisonnier. 12 Après cela, elle mit au monde Bilha, et Routhaïos dit : « Ma fille est celle qui renouvelle. »


    2 Moi, j’avais le pied léger comme une biche, et mon père Jacob me chargeait de toutes sortes de messages ; il me bénit aussi comme une biche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τροφοῦ
  choice: nourrice
  rationale: Le terme désigne ici celle qui a nourri et élevé Rébecca ; « nourrice » est naturel et précis en français.
- source_word: θεοσεβής
  choice: un homme qui craignait Dieu
  rationale: Cette formulation française courante rend l’idée de piété et de révérence envers Dieu sans ajouter de nuance confessionnelle.
- source_word: ἐλεύθερος καὶ εὐγενής
  choice: de condition libre et de noble naissance
  rationale: La traduction conserve la distinction entre statut libre et noblesse de naissance.
- source_word: Καινοποιός μου ἡ θυγάτηρ
  choice: Ma fille m’apporte du renouveau
  rationale: Le composé rare καινοποιός exprime l’idée de faire du neuf ou de renouveler ; la tournure française garde cette valeur tout en restant naturelle.
- source_word: κοῦφος τοῖς ποσίν
  choice: j’avais le pied léger
  rationale: L’expression idiomatique rend littéralement la légèreté des pieds et, dans le contexte, la rapidité.
- source_word: εἰς πᾶσαν ἀγγελίαν
  choice: me chargeait de toutes sortes de messages
  rationale: ἀγγελία peut désigner un message ou une mission de messager ; cette traduction exprime la fonction confiée à Nephtali sans la réduire à une simple course.
- source_word: ἔλαφος
  choice: biche
  rationale: Le nom grec peut désigner le cerf au sens générique ou la femelle ; « biche » évoque naturellement la légèreté et concorde avec l’image traditionnelle de Nephtali.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Les enchaînements grecs ont été légèrement segmentés pour la lisibilité. Les noms propres suivent des formes françaises reconnaissables lorsque celles-ci sont établies (Bilha, Débora, Rébecca, Rachel, Laban, Jacob), tandis que Routhaïos, Eunan et Zélpha sont translittérés selon le texte grec. La numérotation commence à 2 conformément à la référence demandée, bien que l’extrait source inclue la fin du chapitre précédent.
