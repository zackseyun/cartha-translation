revisions:
- from: 'Ma mère, Bilha, était fille de Routhaïos, frère de Débora, la nourrice de Rébecca ; elle était née le même jour que Rachel. 10 Routhaïos était de la lignée d’Abraham. C’était un Chaldéen, un homme qui craignait Dieu, de condition libre et de noble naissance. 11 Après avoir été fait prisonnier, il fut acheté par Laban. Celui-ci lui donna pour femme sa servante Eunan. Elle mit au monde une fille, et il l’appela Zélpha, du nom de la ville où il avait été fait prisonnier. 12 Après cela, elle mit au monde Bilha et dit : « Ma fille m’apporte du renouveau. »


