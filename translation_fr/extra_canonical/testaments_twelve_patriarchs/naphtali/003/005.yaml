- from: De même, les Veilleurs ont changé l’ordre propre à leur nature. Le Seigneur les a maudits au temps du déluge et, à cause d’eux, il a rendu la terre inhabitable et stérile.[a]
  to: De même, les Veilleurs ont changé l’ordre de leur nature, eux que le Seigneur a maudits au temps du déluge et à cause desquels il a rendu la terre déserte et stérile.[a]
  rationale: La révision conserve l’ambiguïté textuelle de la dernière proposition, emploie un français plus exact pour la terre non habitée ou désertée, et restitue la chaîne de relatives du grec. Elle ne précise ni la nature de la faute des Veilleurs ni une interprétation théologique particulière.
