  source_fidelity: La traduction rend correctement les Veilleurs, l’altération de l’ordre de leur nature, la malédiction lors du déluge et la conséquence attribuée à leur action. Toutefois, le grec articule ces éléments par deux relatives (« eux que… », « à cause desquels… »), articulation qu’il est préférable de conserver. Surtout, « inhabitable » en français signifie normalement « où l’on ne peut habiter », tandis que la leçon éditée entre crochets ἀοίκητον signifie « non habité / désert »; ce n’est donc pas le meilleur équivalent.
  naturalness: Le français est globalement naturel et digne. « Déserte et stérile » est plus idiomatique et plus précis que « inhabitable et stérile » dans ce contexte. La reprise par des relatives demeure fluide en français soutenu.
  terminology: « Veilleurs » est le terme français établi et convient. « Ordre de leur nature », « maudits », « déluge » et « stérile » sont fidèles et de registre approprié. La note doit décrire la difficulté sans présenter « loin de l’habitation » comme une traduction littérale assurée.
  issues:
  - severity: medium
    issue: « inhabitable » ne correspond pas de manière sûre à ἀοίκητον et peut inverser ou déplacer le sens.
    rationale: En français moderne, « inhabitable » désigne le plus souvent un lieu impropre à l’habitation. La leçon ἀοίκητον évoque plutôt une terre non habitée, déserte; le segment transmis avant cette variante est lui-même difficile.
  - severity: low
    issue: Les relatives grecques sont remplacées par des propositions indépendantes.
    rationale: Cela ne produit pas de contresens, mais « eux que… à cause desquels… » rend plus exactement le lien syntaxique et causal du texte source.
  - severity: medium
    issue: La note explique de façon imprécise le segment textuellement difficile.
    rationale: ἀπὸ κατοικησίας ne se laisse pas traduire avec certitude par « loin de l’habitation ». Il convient de signaler une formulation probablement altérée et de distinguer la variante ἀοίκητον, « non habitée / déserte ».
