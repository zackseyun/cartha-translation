base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: fr
  text: De même, les Veilleurs ont changé l’ordre de leur nature, eux que le Seigneur a maudits au temps du déluge et à cause desquels il a rendu la terre déserte et stérile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de la dernière proposition est difficile, probablement altéré. La leçon entre crochets ἀοίκητον signifie « non habitée » ou « déserte » et soutient la traduction « déserte »; le texte conserve aussi « stérile ».
    reason: Signaler la difficulté textuelle sans attribuer un sens trop assuré au segment transmis, tout en expliquant le choix de « déserte ».
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: les Veilleurs
  rationale: Terme traditionnel et transparent pour désigner ces êtres angéliques dans la littérature juive ancienne; la majuscule signale qu’il s’agit d’un groupe déterminé.
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: ont changé l’ordre propre à leur nature
  rationale: Conserve les notions d’altération (ἐνήλλαξαν), d’ordre (τάξιν) et de nature (φύσεως), tout en rendant naturellement le possessif grec.
- source_word: κατηράσατο
  choice: a maudits
  rationale: Rend directement le verbe grec de malédiction sans en atténuer la portée.
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: au temps du déluge
  rationale: Exprime ici la valeur temporelle de la préposition et conserve la référence traditionnelle au Déluge.
- source_word: ἀπὸ κατοικησίας … [ἀοίκητον]
  choice: inhabitable
  rationale: Le texte transmis est difficile ou corrompu à cet endroit; « inhabitable » suit le sens soutenu par la lecture entre crochets ἀοίκητον et par la tradition éditoriale.
- source_word: ἄκαρπον
  choice: stérile
  rationale: Dans le contexte de la terre, « stérile » exprime naturellement l’absence de production ou de fruit.
theological_decisions:
- issue: Nature du changement accompli par les Veilleurs
  choice: « ont changé l’ordre propre à leur nature »
  alternative: « ont transgressé l’ordre de leur nature »
  rationale: Le grec parle d’un changement ou d’une altération et ne précise pas explicitement la manière de cette transgression; la formulation retenue préserve cette réserve.
- issue: Enchaînement des relatives grecques
  choice: 'Deux propositions coordonnées: « Le Seigneur les a maudits… et… il a rendu… »'
  alternative: Maintenir littéralement « eux que le Seigneur a maudits…, à cause desquels… »
  rationale: La syntaxe française devient plus claire sans modifier les relations causales ni identifier plus précisément la faute des Veilleurs.
translation_notes:
  register: Français international moderne, digne et accessible. « Veilleurs » conserve le terme technique ancien; le reste de la phrase privilégie une syntaxe claire sans effacer l’ambiguïté concernant la nature exacte de leur changement.
