  naturalness: Le français est globalement fluide et d’un registre approprié. « comprendrez comment vous attacher fermement à » est naturel, précis et évite l’ajout normatif de « il faut ».
  terminology: « avidité », « paroles creuses », « pureté du cœur » et « Béliar » sont des choix solides. « S’attacher fermement à la volonté de Dieu » rend de manière idiomatique κρατεῖν sans perdre l’idée de fermeté.
