source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: fr
  text: Ne vous empressez donc pas, par avidité, de corrompre vos actions, ni, par des paroles creuses, de tromper vos âmes. Car, en gardant le silence dans la pureté du cœur, vous comprendrez comment vous attacher fermement à la volonté de Dieu et rejeter celle de Béliar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάζετε
  choice: vous empressez
  rationale: Rend l’idée de zèle ou d’empressement, ici sous une interdiction, sans ajouter une nuance absente du grec.
- source_word: πλεονεξίᾳ
  choice: avidité
  rationale: Exprime le désir cupide d’avoir davantage; « avidité » est naturel en français moderne et conserve la portée morale du terme.
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: corrompre vos actions
  rationale: Traduction proche de la formulation grecque, qui peut évoquer la détérioration morale des actes.
- source_word: λόγοις κενοῖς
  choice: paroles creuses
  rationale: Conserve l’image de paroles vides de contenu ou de valeur, dans un français idiomatique.
- source_word: σιωπῶντες
  choice: en gardant le silence
  rationale: Rend le participe présent comme le moyen ou la circonstance dans laquelle vient la compréhension, sans introduire une condition absente du texte.
- source_word: καθαρότητι καρδίας
  choice: pureté du cœur
  rationale: Correspondance formelle et naturelle de l’expression anthropologique et morale grecque.
- source_word: κρατεῖν
  choice: vous attacher à
  rationale: Dans ce contexte, le verbe indique le fait de tenir fermement ou de rester attaché à la volonté divine; cette expression est plus naturelle que « tenir fermement la volonté ».
- source_word: ἀπορρίπτειν
  choice: rejeter
  rationale: Rend directement l’idée de jeter loin de soi, avec une formulation française claire.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle de la forme grecque Βελίαρ, distincte de la variante « Bélial ».
theological_decisions:
- issue: Rapport syntaxique entre συνήσετε, κρατεῖν et ἀπορρίπτειν
  choice: « vous comprendrez qu’il faut vous attacher… et rejeter… »
  alternative: « vous saurez vous attacher… et rejeter… » ou « vous comprendrez comment vous attacher… »
  rationale: L’enchaînement infinitif après « comprendre » est difficile à reproduire littéralement. « qu’il faut » exprime la compréhension pratique et normative suggérée par le contexte, tout en évitant d’affirmer que les infinitifs dépendent d’un verbe de capacité.
- issue: Valeur de ὅτι et du participe σιωπῶντες
  choice: « Car, en gardant le silence… »
  alternative: « parce qu’en gardant le silence… »
  rationale: ὅτι peut être causal ici. « Car » relie naturellement l’exhortation à son fondement, tandis que le gérondif conserve la construction participiale sans ajouter un « si » conditionnel.
- issue: Opposition entre les volontés de Dieu et de Béliar
  choice: « la volonté de Dieu… celle de Béliar »
  alternative: Répéter « la volonté de Béliar »
  rationale: Le pronom « celle » évite une répétition lourde tout en maintenant explicitement l’opposition théologique du grec, sans expliquer davantage l’identité de Béliar.
translation_notes:
  register: Français moderne international, digne et accessible. La structure exhortative et l’opposition morale du grec sont conservées, avec un léger ajustement idiomatique pour le régime de κρατεῖν et la coordination des infinitifs.
