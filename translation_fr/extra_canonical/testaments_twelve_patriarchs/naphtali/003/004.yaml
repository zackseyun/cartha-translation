  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: fr
  text: 'Mais vous, mes enfants, ne soyez pas ainsi : reconnaissez, dans le firmament, sur la terre, dans la mer et dans toutes les réalités créées, le Seigneur qui a tout fait, afin de ne pas devenir comme Sodome, qui a changé l’ordre de sa nature.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκοντες
  choice: reconnaissant
  rationale: Le participe présent conserve la construction grecque sans la transformer en impératif indépendant. « Reconnaître » exprime ici le fait de discerner le Seigneur à travers l’ordre créé plus naturellement que le simple « connaître ».
- source_word: στερεώματι
  choice: firmament
  rationale: Ce terme français traditionnel correspond directement au grec et désigne l’étendue ou la voûte céleste.
- source_word: πᾶσι τοῖς δημιουργήμασι
  choice: dans tout ce qui a été créé
  rationale: Cette formulation inclut l’ensemble des réalités créées et évite que « toutes les créatures » soit compris, en français actuel, comme visant seulement les êtres vivants.
- source_word: τάξιν φύσεως αὐτῆς
  choice: l’ordre de sa propre nature
  rationale: Rendu proche du grec, qui maintient ensemble les notions d’ordre et de nature sans préciser davantage en quoi consistait le changement.
theological_decisions:
- issue: Lien entre la connaissance du Créateur et l’exemple de Sodome
  choice: Conserver la proposition participiale et la finalité négative sans explicitation doctrinale
  alternative: Reformuler par un impératif tel que « reconnaissez le Seigneur » ou préciser la faute attribuée à Sodome
  rationale: Le grec présente γινώσκοντες comme un participe et décrit Sodome de manière générale comme ayant changé l’ordre de sa nature. La traduction préserve cette tension sans imposer une interprétation particulière.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe participiale, légèrement soutenue, est maintenue pour respecter le lien grammatical du grec; l’énumération cosmique reste claire et équilibrée.
