  naturalness: La phrase est fluide et d’un registre moderne approprié. « N’altérez pas la loi de Dieu » est à la fois plus idiomatique et plus précis que « ne bouleversez pas la loi de Dieu ». « Dans le désordre de vos actes » rend plus directement ἐν ἀταξίᾳ que « par le désordre ».
