  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: fr
  text: Le soleil, la lune et les étoiles ne changent pas leur ordre[a] ; de même, vous non plus, n’altérez pas la loi de Dieu dans le désordre de vos actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec transmis ici est signalé comme textuellement incertain dans l’édition. Le sens contextuel, suivi par cette traduction, est qu’ils ne changent pas leur ordre ; la lecture littérale du mot conservé est difficile dans ce contexte.
    reason: Signaler l’incertitude explicitement marquée (†) dans le texte grec, sans imposer une reconstitution conjecturale.
lexical_decisions:
- source_word: τάξιν
  choice: ordre
  rationale: Rend directement l’idée d’un ordre ou agencement régulier, sans ajouter la notion non explicite d’un ordre « fixé ».
- source_word: ἀλλοιώσητε
  choice: bouleversez
  rationale: Le verbe signifie changer ou altérer. Dans ce parallélisme avec ἀταξίᾳ, « bouleverser » exprime naturellement en français le fait de porter atteinte à un ordre établi.
- source_word: νόμον Θεοῦ
  choice: la loi de Dieu
  rationale: Traduction directe, naturelle et théologiquement non interprétative.
- source_word: ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν
  choice: par le désordre de vos actes
  rationale: « Par » rend ici le moyen ou la manière ; « actes » correspond à πράξεις et conserve le lien entre conduite humaine et désordre.
theological_decisions:
- issue: Rapport entre l’ordre cosmique et la conduite humaine
  choice: Conserver l’analogie sans expliciter son fondement théologique
  alternative: Ajouter que l’ordre est établi ou fixé par Dieu
  rationale: Le texte exhorte à imiter la régularité cosmique, mais τάξιν n’énonce pas explicitement que cet ordre est « fixé par Dieu ».
- issue: Sens de « bouleverser la loi de Dieu »
  choice: Maintenir la formulation métaphorique du texte
  alternative: Traduire par « transgresser la loi de Dieu »
  rationale: « Transgresser » serait plus idiomatique dans un contexte moral, mais réduirait le jeu conceptuel entre ordre, altération et désordre présent dans le grec.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « bouleverser » conserve le parallélisme exhortatif, tandis que « de même, vous non plus » reproduit l’insistance de οὕτως καὶ ὑμεῖς μή.
