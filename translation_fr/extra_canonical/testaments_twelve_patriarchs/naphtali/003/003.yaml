  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: fr
  text: Les nations, après s’être égarées et avoir abandonné le Seigneur, ont altéré leur ordre et ont obéi au bois et à la pierre, à des esprits d’égarement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔθνη
  choice: Les nations
  rationale: Rend directement le pluriel grec et conserve sa portée collective.
- source_word: πλανηθέντα
  choice: après s’être égarées
  rationale: Le participe aoriste passif employé de façon intransitive décrit l’entrée dans l’égarement; la tournure française marque naturellement l’antériorité.
- source_word: ἀφέντα Κύριον
  choice: avoir abandonné le Seigneur
  rationale: ἀφίημι signifie ici délaisser ou abandonner; «le Seigneur» conserve le titre du texte grec.
- source_word: ἠλλοίωσαν τὴν τάξιν αὐτῶν
  choice: ont bouleversé l’ordre qui leur était propre
  rationale: ἀλλοιόω exprime une altération profonde; la relative explicite sans surinterpréter le possessif αὐτῶν.
- source_word: ὑπήκουσαν
  choice: ont obéi
  rationale: Le verbe signifie littéralement écouter en se soumettant; «obéir» préserve la force de cette soumission idolâtre.
- source_word: ξύλοις καὶ λίθοις
  choice: au bois et à la pierre
  rationale: Conserve les substantifs matériels singuliers du grec, employés collectivement comme objets d’idolâtrie.
- source_word: πνεύμασι πλάνης
  choice: à des esprits d’égarement
  rationale: Le génitif πλάνης peut caractériser des esprits qui égarent ou qui relèvent de l’erreur; «d’égarement» maintient cette latitude.
theological_decisions:
- issue: Rapport entre «le bois et la pierre» et «des esprits d’égarement»
  choice: Conserver deux compléments coordonnés du verbe «obéir»
  alternative: Faire des esprits une apposition explicative aux objets matériels
  rationale: La syntaxe grecque permet une association étroite, mais n’impose pas d’identifier sans reste les idoles aux esprits; la traduction préserve cette tension.
- issue: Sens de «leur ordre»
  choice: «l’ordre qui leur était propre»
  alternative: «l’ordre établi pour elles» ou «leur nature»
  rationale: Le grec ne précise ni l’auteur de cet ordre ni s’il s’agit de nature, de conduite ou de disposition; la formulation retenue évite de trancher.
translation_notes:
  register: Français moderne, digne et lisible. La coordination ample du grec est conservée, tandis que les participes sont intégrés dans une construction temporelle naturelle. Aucun marqueur de note n’est requis.
