base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: fr
  text: '1. Je racontai ces deux rêves à mon père, et il me dit : « Ces choses doivent s’accomplir aux temps qui leur sont fixés[a], après qu’Israël aura enduré bien des épreuves. »


    2. Alors mon père me dit : « J’ai confiance en Dieu : Joseph est vivant. Car je vois toujours que le Seigneur le compte comme étant avec nous[b]. »


    3. Et il disait en pleurant : « Hélas, mon enfant Joseph ! Tu es vivant, et je ne te vois pas ; et toi, tu ne vois pas Jacob, qui t’a engendré. »


    4. Par ces paroles, il me fit donc pleurer, moi aussi. Quant à moi, je brûlais dans mes entrailles[c] de lui annoncer que Joseph avait été vendu, mais j’avais peur de mes frères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en leur saison ». Le grec καιροί peut désigner des moments appropriés ou fixés.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression peut aussi se traduire : « le compte parmi nous » ou « le considère comme étant avec nous ».'
    reason: lexical_alternative
  - marker: c
    text: « Brûler dans ses entrailles » est une image grecque très concrète qui exprime une vive détresse intérieure.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: rêves
  rationale: Le sens ordinaire est « rêves » ; le contexte immédiat n’exige pas le terme plus élevé de « visions ».
- source_word: δεῖ ... πληρωθῆναι
  choice: doivent s’accomplir
  rationale: Cette formulation conserve à la fois la nécessité exprimée par δεῖ et la notion d’accomplissement de πληρωθῆναι.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: aux temps qui leur sont fixés
  rationale: καιροί désigne ici des moments appropriés ou déterminés, et non la simple succession chronologique.
- source_word: πολλὰ ... ὑπομείναντος
  choice: après qu’Israël aura enduré bien des épreuves
  rationale: Le participe génitif exprime une endurance préalable ; « bien des épreuves » rend naturellement l’objet neutre pluriel πολλὰ sans préciser la nature des souffrances.
- source_word: πιστεύω τῷ θεῷ
  choice: J’ai confiance en Dieu
  rationale: Le datif exprime la confiance accordée à Dieu plutôt qu’une simple affirmation de son existence. La formulation française reste naturelle sans ajouter une parole divine absente du grec.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: le compte comme étant avec nous
  rationale: La traduction maintient la métaphore de l’acte de compter ainsi que l’ambiguïté de l’expression grecque.
- source_word: Οἴμοι
  choice: Hélas
  rationale: « Hélas » conserve le ton de lamentation dans un français digne et encore intelligible.
- source_word: γεννήσαντά σε
  choice: qui t’a engendré
  rationale: Le verbe rend explicitement la paternité de Jacob sans substituer une paraphrase interprétative.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: je brûlais dans mes entrailles
  rationale: La formulation préserve l’image corporelle forte de l’idiome grec au lieu de la réduire à une émotion générale.
- source_word: πέπραται
  choice: avait été vendu
  rationale: Le passif parfait renvoie à la vente antérieure de Joseph ; le plus-que-parfait convient au récit rétrospectif français.
theological_decisions:
- issue: Nécessité prophétique dans la réponse de Jacob
  choice: Ces choses doivent s’accomplir aux temps qui leur sont fixés
  alternative: Ces choses doivent arriver en leur saison
  rationale: La traduction garde le cadre providentiel et le vocabulaire d’accomplissement sans élaborer un système théologique absent du texte.
- issue: Sens de ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: le Seigneur le compte comme étant avec nous
  alternative: le Seigneur le compte parmi nous
  rationale: L’expression grecque demeure quelque peu idiomatique. Le choix conserve la métaphore et la conviction de Jacob que Joseph reste associé au cercle familial, sans trancher davantage.
- issue: Portée de πιστεύω τῷ θεῷ
  choice: 'J’ai confiance en Dieu : Joseph est vivant'
  alternative: 'Je crois Dieu : Joseph est vivant'
  rationale: Le choix rend la confiance personnelle portée par le datif tout en évitant le français raide de l’alternative et sans transformer l’énoncé en simple credo sur l’existence de Dieu.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre testamentaire sans archaïsmes excessifs ; les paroles directes restent naturelles. Les images fortes et les ambiguïtés du grec sont conservées, avec des notes seulement là où une autre lecture ou un idiome culturel mérite d’être signalé.
