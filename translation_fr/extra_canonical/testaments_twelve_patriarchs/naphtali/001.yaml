base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: fr
  text: '**Testament de Nephtali, huitième fils de Jacob et de Bilha**


    **1** Copie du testament de Nephtali, qu’il établit au moment de son départ, dans la cent trentième année de sa vie.


    **2** Ses fils s’étant réunis au septième mois, le premier jour du mois, il leur prépara un repas. **3** Le matin, après s’être réveillé, il leur dit : « Je meurs. » Mais ils ne le crurent pas. **4** Alors, rendant gloire au Seigneur, il reprit des forces et dit : « Après le repas d’hier, ma chair est morte. »


    **5** Puis il se mit à parler : « Écoutez, mes enfants, fils de Nephtali ; écoutez les paroles de votre père. **6** Je suis né de Bilha, parce que Rachel usa de ruse et donna Bilha à Jacob à sa place. Bilha conçut et m’enfanta sur les genoux de Rachel ; c’est pourquoi Rachel m’appela Nephtali. **7** En effet, Rachel m’aimait beaucoup parce que j’étais né sur ses genoux. Alors que j’étais encore tout petit, elle m’embrassait en disant : “Puisse-t-il m’être donné, de mon propre ventre, ton frère, qui te ressemble !” **8** C’est ainsi que Joseph me ressemblait en tout, selon les bénédictions de Rachel.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « bénédictions » est signalé comme textuellement incertain dans l’édition ; certains comprennent ici « prières » ou « souhaits ».
    reason: Le signe critique placé devant εὐλογίας indique une difficulté textuelle ou une lecture suspecte, et le sens exact du rapport avec la ressemblance de Joseph demeure incertain.
lexical_decisions:
- source_word: διαθήκη
  choice: testament
  rationale: Le terme désigne ici les dernières dispositions et exhortations attribuées à Nephtali ; « testament » est naturel en français et correspond au genre littéraire.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: au moment de son départ
  rationale: Conserve l’euphémisme grec de la mort sans l’expliciter dans le corps du texte.
- source_word: ἐποίησε δεῖπνον
  choice: il leur prépara un repas
  rationale: « Repas » convient mieux que « festin » ou « banquet », que le grec n’impose pas.
- source_word: δοξάζων τὸν Κύριον
  choice: rendant gloire au Seigneur
  rationale: Suit précisément le grec, qui parle de glorifier le Seigneur sans verbe supplémentaire signifiant bénir.
- source_word: ἐκραταιώθη
  choice: il reprit des forces
  rationale: Expression française naturelle qui rend l’idée d’être fortifié ou de retrouver sa vigueur.
- source_word: ἀπέθανεν ἡ σάρξ μου
  choice: ma chair est morte
  rationale: Préserve l’expression frappante et théologiquement ouverte du grec, sans ajouter l’idée absente que la chair aurait d’abord défailli.
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: usa de ruse
  rationale: Rend le sens de πανουργία dans ce contexte sans atténuer le jugement porté sur l’action de Rachel.
- source_word: ἁπαλὸν ὄντα
  choice: alors que j’étais encore tout petit
  rationale: Formulation moderne et naturelle pour un enfant encore tendre ou en bas âge.
- source_word: κατὰ τὰς εὐλογίας Ῥαχιήλ
  choice: conformément aux bénédictions de Rachel
  rationale: Traduit directement εὐλογίας par « bénédictions » plutôt que par « prières », tout en signalant en note l’incertitude textuelle.
theological_decisions:
- issue: Sens de la mort de la « chair » en 1.4
  choice: « ma chair est morte »
  alternative: « ma chair a défailli et est morte »
  rationale: Le texte grec transmis contient simplement ἀπέθανεν, « est morte ». L’ajout de « a défailli » interpréterait et développerait indûment l’énoncé.
- issue: Agent implicite dans le souhait de Rachel en 1.7
  choice: « Puisse-t-il m’être donné »
  alternative: « Que Dieu me donne »
  rationale: Le grec emploie un optatif sans nommer explicitement Dieu. La traduction conserve cette réserve au lieu d’ajouter un agent théologique.
- issue: Lien entre Joseph et les paroles de Rachel en 1.8
  choice: « conformément aux bénédictions de Rachel »
  alternative: « selon les prières de Rachel »
  rationale: Le substantif grec lisible est εὐλογίας, « bénédictions ». La formulation évite de transformer celles-ci sans preuve en prières, malgré la difficulté du passage.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les répétitions rhétoriques du discours paternel sont conservées. Les noms propres suivent les formes françaises bibliques usuelles : Nephtali, Bilha, Rachel, Jacob et Joseph. L’étrangeté de certaines formulations du texte source, notamment « ma chair est morte », est maintenue lorsqu’elle porte une ambiguïté réelle.'
