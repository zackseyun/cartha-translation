base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004.yaml
  text: These things I say to you[a], my children, because I learned from the writing of Enoch that you also will surely depart from the Lord, walking in every lawlessness of the nations and doing all the wickedness of Sodom. And the Lord will bring captivity upon you, and there you will serve your enemies and the land will be laid waste and your holy places will be desolate. And you will be scattered to the four corners of the earth, and you will be as something despised among the nations, a curse and a dispersion, until the Most High visits the earth. He himself will come, saving Israel and all the nations, God speaking in the person of man. And after he has entered, unrighteousness will again increase upon the earth, and all the nations will be gathered against him. But whoever believes in him shall not be condemned in his name. And you, my children, shall rise up from your tribes with Levi and Judah; and there shall be war among you. And the Lord will be seen among men, and he will save
    Israel and all the nations. Therefore do not be divided into two heads, because every division among brothers is evil in the sight of the Lord. For the Lord loves singleness of purpose. And if you also walk in singleness of purpose according to his law[b], my children, no evil spirit will have power over you. For he knows that the God of heaven is one, and he will not accept a divided mind. Love the Lord through all your life[c], and one another with a true heart.
translation:
  language: fr
  text: '**4.1** Je vous dis cela, mes enfants, parce que j’ai appris dans l’écrit d’Hénoch[a] que vous aussi, vous vous détournerez du Seigneur, en suivant toute l’iniquité des nations et en commettant toute la perversité de Sodome. **2** Le Seigneur vous fera partir en captivité et, là[b], vous servirez vos ennemis ; vous vivrez au milieu de toutes sortes de mauvais traitements et de détresses[c], jusqu’à ce que le Seigneur vous détruise tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner un écrit ou une tradition écrite attribuée à Hénoch ; à elle seule, elle ne permet pas de trancher la question de son statut canonique.
    reason: cultural_note
  - marker: b
    text: Le mot « là » est signalé comme incertain dans l’édition grecque utilisée.
    reason: textual_variant
  - marker: c
    text: Le verbe grec de cette proposition est textuellement difficile. Il peut évoquer le fait de vivre au milieu des mauvais traitements et des détresses, ou d’y être continuellement exposé.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: j’ai appris
  rationale: Avec ἐν τῇ γραφῇ Ἐνώχ, le verbe désigne ici une connaissance acquise par un écrit ou une tradition écrite; « j’ai appris » est naturel sans dépasser le grec.
- source_word: γραφή
  choice: écrit
  rationale: « Écrit » désigne un document associé à Hénoch sans trancher son statut canonique, contrairement à « Écriture ».
- source_word: ἀποστήσεσθε
  choice: vous vous détournerez
  rationale: Le verbe exprime l’éloignement ou la défection à l’égard du Seigneur; cette formulation évite le terme ecclésiastique plus technique « apostasier ».
- source_word: ἀνομία
  choice: pratiques contraires à la loi
  rationale: Cette expression rend l’idée de conduite rebelle à l’ordre ou à la loi, tout en produisant un français courant dans la construction avec πορευόμενοι κατὰ.
- source_word: πονηρία
  choice: perversité
  rationale: Le terme désigne une méchanceté morale grave; « perversité » convient au rapprochement avec Sodome sans préciser davantage la nature des fautes.
- source_word: αἰχμαλωσία
  choice: captivité
  rationale: Le mot évoque la déportation et l’asservissement résultant d’un jugement national; « captivité » conserve cette portée.
- source_word: κακώσει
  choice: mauvais traitements
  rationale: Le datif renvoie aux souffrances ou sévices subis; « mauvais traitements » est idiomatique et distinct de θλίψει.
- source_word: θλίψει
  choice: détresses
  rationale: Le mot exprime l’oppression et l’affliction; « détresses » en conserve la force dans un français moderne.
- source_word: ἀναλώσει
  choice: ait tous anéantis
  rationale: Le verbe signifie consumer, épuiser ou détruire entièrement. « Anéantir » préserve la sévérité du jugement annoncé.
theological_decisions:
- issue: Statut de l’écrit d’Hénoch
  choice: « l’écrit d’Hénoch »
  alternative: « l’Écriture d’Hénoch » ou « le livre d’Hénoch »
  rationale: Le grec γραφή permet plusieurs nuances. La traduction signale une source écrite sans imposer une conclusion sur son statut canonique ni identifier plus précisément l’ouvrage.
- issue: Portée de la défection annoncée
  choice: « vous vous détournerez du Seigneur »
  alternative: « vous apostasierez loin du Seigneur »
  rationale: La formulation retenue exprime clairement la rupture religieuse et morale sans importer une terminologie doctrinale ultérieure.
- issue: Sévérité du jugement final
  choice: « jusqu’à ce que le Seigneur vous ait tous anéantis »
  alternative: « jusqu’à ce que le Seigneur vous ait tous consumés »
  rationale: Le grec ἀναλίσκω est très fort. La traduction ne l’atténue pas, même si cette annonce demeure en tension avec d’éventuelles promesses de restauration dans un contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique et la force du jugement sont conservées, tandis que les deux difficultés textuelles visibles dans l’édition sont signalées en notes. Le brouillon ne traduit que le texte grec fourni pour Testament de Naphtali 4.1-2 et n’intègre pas les développements supplémentaires présents dans la couche anglaise de consultation, faute de source grecque correspondante dans l’extrait transmis.
