revisions:
- from: '**4.1** Je vous dis cela, mes enfants, parce que j’ai appris dans l’écrit d’Hénoch[a] que vous aussi, vous vous détournerez du Seigneur : vous suivrez toutes les pratiques contraires à la loi des nations et vous commettrez toute la perversité de Sodome. **2** Alors le Seigneur vous livrera à la captivité; là[b], vous servirez vos ennemis et vous vivrez au milieu de toutes sortes de mauvais traitements et de détresses[c], jusqu’à ce que le Seigneur vous ait tous anéantis.'
  to: '**4.1** Je vous dis cela, mes enfants, parce que j’ai appris dans l’écrit d’Hénoch[a] que vous aussi, vous vous détournerez du Seigneur, en suivant toute l’iniquité des nations et en commettant toute la perversité de Sodome. **2** Le Seigneur vous fera partir en captivité et, là[b], vous servirez vos ennemis ; vous vivrez au milieu de toutes sortes de mauvais traitements et de détresses[c], jusqu’à ce que le Seigneur vous détruise tous.'
  rationale: La révision se limite aux versets 4.1–2 réellement présents dans le texte grec fourni. Elle corrige une explicitation potentiellement trompeuse de ἀνομία, améliore l’idiomaticité de l’annonce de captivité et de la proposition finale, et maintient les deux notes nécessaires aux difficultés textuelles signalées par l’édition. Les ajouts de la piste anglaise ne sont pas intégrés, faute de correspondant grec dans l’extrait source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:13:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le brouillon suit correctement les deux versets grecs fournis et, à juste titre, ne reprend pas les développements beaucoup plus longs de la piste anglaise, qui ne correspondent pas à l’extrait grec transmis. Une légère révision améliore la restitution de κατὰ πᾶσαν ἀνομίαν ἐθνῶν : « pratiques contraires à la loi » explicite et pluralise davantage que ne le fait le grec. « Vous fera partir en captivité » rend plus naturellement ἐπάξει ... αἰχμαλωσίαν.'
  naturalness: Le français est globalement clair et soutenu. « Vous vivrez au milieu de toutes sortes de mauvais traitements et de détresses » est plus idiomatique et conserve l’ouverture sémantique du verbe textuellement difficile. « Jusqu’à ce que le Seigneur vous détruise tous » est une construction française plus directe que le subjonctif passé, sans affaiblir ἀναλώσει.
  terminology: « Écrit d’Hénoch », « se détourner du Seigneur », « captivité », « mauvais traitements » et « détresses » conviennent. « Toute l’iniquité des nations » conserve le terme moral global ἀνομία sans le réduire à des pratiques particulières. « Toute la perversité de Sodome » peut rester, en gardant la gravité sans préciser la nature des fautes.
  issues:
  - severity: medium
    issue: « pratiques contraires à la loi des nations » pour κατὰ πᾶσαν ἀνομίαν ἐθνῶν
    rationale: La formulation interprète ἀνομία comme des « pratiques » et peut laisser entendre que la loi en question est celle des nations. Le grec évoque plutôt toute forme d’iniquité ou de conduite sans loi, associée aux nations.
  - severity: low
    issue: « vous livrera à la captivité »
    rationale: C’est compréhensible, mais « vous fera partir en captivité » ou « fera venir sur vous la captivité » rend plus naturellement l’idée de ἐπάξει αἰχμαλωσίαν.
  - severity: low
    issue: Subjonctif passé dans « jusqu’à ce que le Seigneur vous ait tous anéantis »
    rationale: Le grec emploie un futur à valeur d’aboutissement. Le subjonctif présent français après « jusqu’à ce que » est plus naturel ici et préserve la force du jugement.
