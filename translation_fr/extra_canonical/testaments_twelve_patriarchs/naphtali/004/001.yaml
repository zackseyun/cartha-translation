base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: fr
  text: Je vous dis cela, mes enfants, parce que j’ai appris dans l’écrit d’Hénoch que vous aussi, vous vous détournerez du Seigneur, en marchant dans toute l’iniquité des nations et en commettant toute la méchanceté de Sodome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  choice: dans l’écrit d’Hénoch
  rationale: Rend directement ἐν (« dans ») et γραφή au singulier comme un écrit déterminé attribué à Hénoch, sans le transformer en simple source introduite par « d’après ».
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: vous vous détournerez du Seigneur
  rationale: Exprime l’éloignement ou l’abandon impliqué par ἀφίστημι avec ἀπό, sans ajouter l’intensif « sûrement » absent du grec.
- source_word: πορευόμενοι
  choice: en suivant
  rationale: Le participe signifie littéralement « marchant » ou « allant »; dans ce contexte moral, « en suivant » donne naturellement l’idée d’une conduite conforme à celle des nations.
- source_word: πᾶσαν ἀνομίαν ἐθνῶν
  choice: toutes les pratiques contraires à la loi des nations
  rationale: ἀνομία désigne ce qui est sans loi ou contraire à la loi. Le pluriel français « pratiques » rend idiomatiquement l’ensemble des conduites visé par πᾶσαν, tandis que « des nations » conserve le génitif ἐθνῶν.
- source_word: πᾶσαν πονηρίαν Σοδόμων
  choice: toute la méchanceté de Sodome
  rationale: Conserve la portée globale de πᾶσαν et la référence collective de Σοδόμων, selon l’usage français traditionnel du nom « Sodome ».
theological_decisions:
- issue: Portée de la prédiction concernant les descendants de Nephtali
  choice: « vous aussi, vous vous détournerez »
  alternative: « même vous, vous vous détournerez »
  rationale: καίγε met en relief l’inclusion des destinataires. « Vous aussi » préserve cette nuance sans accentuation excessive et sans atténuer le futur affirmatif.
- issue: Sens moral et juridique de ἀνομία
  choice: « pratiques contraires à la loi »
  alternative: « injustice », « impiété » ou « absence de loi »
  rationale: La formulation retenue conserve la dimension de transgression de la norme sans préciser de façon confessionnelle s’il s’agit exclusivement de la Torah, de la loi morale ou d’un autre cadre légal.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « vous aussi, vous » est idiomatique et souligne καίγε. La phrase conserve la structure causale et les deux développements participiaux du grec tout en évitant un calque pesant.
