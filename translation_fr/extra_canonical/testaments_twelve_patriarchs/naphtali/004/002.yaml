base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: fr
  text: Et le Seigneur fera venir sur vous la captivité. Là, vous servirez vos ennemis et vous vivrez dans toute affliction et toute détresse, jusqu’à ce que le Seigneur vous ait tous fait périr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάξει ... αἰχμαλωσίαν
  choice: fera venir sur vous la captivité
  rationale: Rend directement l’idée d’une captivité amenée comme jugement, tout en conservant la formulation concrète du grec.
- source_word: δουλεύσετε
  choice: vous servirez
  rationale: Le verbe signifie servir en condition de dépendance ou d’esclavage; le contexte de captivité suffit à en faire entendre la force sans surtraduire par « serez esclaves ».
- source_word: πάσῃ κακώσει
  choice: toutes sortes de mauvais traitements
  rationale: κάκωσις désigne ici l’affliction, l’oppression ou les sévices subis; cette expression est naturelle en français et se distingue de θλίψις.
- source_word: θλίψει συναναστραφήσεσθε
  choice: vous vivrez au milieu de ... détresses
  rationale: La leçon transmise exprime littéralement le fait de vivre ou de séjourner avec l’affliction; la formulation française en conserve l’image sans devenir obscure.
- source_word: ἀναλώσει
  choice: ait ... anéantis
  rationale: Le verbe peut signifier consumer, détruire ou faire périr. « Anéantir » restitue ici la sévérité du jugement et convient mieux au français courant que « consumer ».
theological_decisions:
- issue: Agent et portée du jugement
  choice: Conserver explicitement le Seigneur comme celui qui fait venir la captivité et qui anéantit tous les destinataires.
  alternative: Atténuer la causalité divine en parlant seulement d’une captivité permise ou d’une disparition indirecte.
  rationale: Le grec attribue directement les deux actions à Κύριος; il ne revient pas à la traduction d’atténuer cette tension théologique.
translation_notes:
  register: Français moderne, digne et accessible. La traduction suit de près la syntaxe et la force du grec, tout en évitant les calques peu naturels tels que « être en compagnie de toute affliction ». Les mots entre signes critiques dans l’édition sont traduits dans le texte reçu, sans note faute de variantes détaillées fournies.
