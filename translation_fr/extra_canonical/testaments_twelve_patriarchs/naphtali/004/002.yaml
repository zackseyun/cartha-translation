  rationale: 'La révision conserve la structure, l’agent divin explicite, « là » pour ἐκεῖ et le futur antérieur exigé par la subordonnée introduite par « jusqu’à ce que ». Elle remplace des expressions interprétatives ou plus étroites par des équivalents français modernes qui couvrent la portée lexicale du grec. Aucune note ne peut être formulée de manière responsable : les sigles critiques de l’édition sont présents, mais l’appareil correspondant n’est pas fourni.'
