revisions:
- from: Et le Seigneur fera venir sur vous la captivité. Là, vous servirez vos ennemis et vous vivrez au milieu de toutes sortes de mauvais traitements et de détresses, jusqu’à ce que le Seigneur vous ait tous anéantis.
