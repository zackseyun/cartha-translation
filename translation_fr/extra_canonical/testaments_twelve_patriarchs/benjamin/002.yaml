base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002.yaml
  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: fr
  text: '**Testament de Benjamin 2**


    **1** Lorsque j’arrivai en Égypte, mon frère me reconnut et me dit : « Ils ont enduit ta tunique de sang et ont dit : “Regarde si c’est bien cette tunique.” »[a]


    **2** Il me dit encore : « Oui, mon frère. Quand ils m’eurent retiré ma tunique, ils me livrèrent aux Ismaélites. Ils me donnèrent un pagne, puis, après m’avoir fouetté, ils m’ordonnèrent de courir.


    **3** L’un d’eux me frappait avec un bâton lorsqu’un lion surgit devant lui et le tua.


    **4** Alors, pris de peur, ses compagnons me gardèrent sans me maltraiter.[b]


    **5** En racontant cela, Joseph ne mentait pas.[c] Il voulait en effet me cacher les actes de nos frères.


    **6** Il appela donc ses frères auprès de lui et leur dit :


    **7** « Ne racontez pas à mon père ce que vous m’avez fait. Dites-lui plutôt les choses comme je les ai exposées à Benjamin.


    **8** Ayez, vous aussi, les mêmes intentions, et que ces paroles ne parviennent pas au cœur de mon père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est difficile : elle porte littéralement « ta tunique », alors que le récit semble évoquer la tunique de Joseph présentée à son père. Certains témoins ont une formulation plus explicite : « Ils l’envoyèrent et dirent : “Regarde si c’est la tunique de ton fils.” »'
    reason: textual_variant
  - marker: b
    text: Le grec de la fin de ce verset est endommagé; il semble indiquer que les compagnons, effrayés, retinrent Joseph en lui accordant un traitement moins dur. D’autres témoins disent qu’ils le vendirent à d’autres marchands de leur groupe, ou aux Ismaélites.
    reason: textual_variant
  - marker: c
    text: Le grec transmis porte ici le pluriel, « ils ne mentaient pas », mais la suite passe au singulier et désigne Joseph. La traduction adopte le sujet que le contexte rend le plus probable.
    reason: textual_variant
lexical_decisions:
- source_word: ἦλθον
  choice: j’arrivai
  rationale: La forme peut être celle de la première personne du singulier; dans ce récit à la première personne, elle désigne naturellement l’arrivée de Benjamin en Égypte.
- source_word: ἐγνώρισέν με
  choice: me reconnut
  rationale: Le verbe exprime ici l’identification personnelle de Benjamin par Joseph. « Me reconnut » est naturel et n’impose pas le sens réfléchi « se fit reconnaître de moi ».
- source_word: ἔφυραν
  choice: ont enduit
  rationale: Le verbe signifie fondamentalement mélanger ou pétrir, mais, appliqué au sang sur une tunique, il évoque le fait de l’étaler ou de l’enduire.
- source_word: χιτών
  choice: tunique
  rationale: « Tunique » désigne concrètement le vêtement ancien et évite les connotations modernes de « manteau ».
- source_word: περίζωμα
  choice: pagne
  rationale: Le terme désigne une pièce d’étoffe portée autour des reins; « pagne » est clair et concret en français actuel.
- source_word: φραγγελλώσαντες
  choice: après m’avoir fouetté
  rationale: Le participe décrit une flagellation physique. « Fouetté » conserve la brutalité de l’acte sans archaïsme.
- source_word: ῥάβδῳ μαστίζων
  choice: me frappait avec un bâton
  rationale: La traduction rend à la fois l’instrument, ῥάβδος, et l’action répétée exprimée par le participe présent.
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: un lion surgit devant lui
  rationale: Cette formulation française restitue la soudaineté de la rencontre narrative sans affaiblir le texte en simple coïncidence.
- source_word: μέτοχοι
  choice: compagnons
  rationale: Le mot désigne les associés de l’homme au sein du groupe; « compagnons » convient au contexte narratif.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: les actes de nos frères
  rationale: ἔργα renvoie ici à leurs actions concrètes. « Actes » garde leur poids moral tout en restant naturel.
- source_word: ἐξηγησάμην
  choice: je les ai exposées
  rationale: Le verbe signifie relater ou expliquer en détail. « Exposées » convient à la transmission d’une version des événements.
- source_word: ἔννοιαι
  choice: intentions
  rationale: Dans l’exhortation, le terme désigne moins des pensées passagères que des dispositions intérieures orientant la conduite.
theological_decisions:
- issue: Dissimulation par Joseph de la faute de ses frères
  choice: Joseph cherche volontairement à cacher à Benjamin les actes de leurs frères et leur demande de ne pas les révéler à Jacob.
  alternative: Présenter Joseph comme se bornant à rapporter les faits, sans intention particulière de protéger ses frères.
  rationale: Le grec donne explicitement comme motif ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ τὰ ἔργα τῶν ἀδελφῶν ἡμῶν. Cette retenue contribue au portrait moral de Joseph, sans qu’il soit nécessaire d’en tirer une doctrine supplémentaire.
- issue: Instabilité textuelle des versets 1 à 5
  choice: Donner dans le corps du texte une lecture suivie fondée d’abord sur le grec fourni, tout en signalant les formulations corrompues ou grammaticalement discordantes.
  alternative: Reconstruire silencieusement tout le passage à partir de témoins plus développés, notamment en ajoutant la dissimulation de la tunique ou une nouvelle vente de Joseph.
  rationale: Le grec fourni diffère par endroits de la consultation anglaise et présente des difficultés réelles. La traduction conserve le récit attesté sans transformer les reconstructions en certitudes.
- issue: Fin du chapitre
  choice: Traduire le verset 8 comme une phrase complète.
  alternative: Laisser la dernière phrase en suspens comme dans la couche anglaise de consultation.
  rationale: Dans le texte grec fourni, le verset 8 possède une proposition complète, jusqu’à « le cœur de mon père ». Il n’y a donc pas lieu de reproduire ici une lacune provenant d’un autre état textuel.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple structure le récit, tandis que les paroles directes restent fluides. Les termes concrets (« tunique », « pagne », « bâton ») évitent à la fois l’archaïsme et la paraphrase. Les discordances du grec sont signalées plutôt que masquées.
