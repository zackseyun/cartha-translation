  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/001.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: fr
  text: Après avoir dit ces choses, il étendit ses pieds et s’endormit d’un bon sommeil [et bon].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et bon » sont textuellement incertains.
    reason: Explique les crochets éditoriaux entourant καὶ ἀγαθῷ dans la source grecque.
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: il étendit les jambes
  rationale: Littéralement « ayant étendu ses pieds » ; en français naturel, le geste d’une personne qui s’allonge ou se prépare à mourir se dit plus couramment « étendre les jambes ».
- source_word: ἐκοιμήθη
  choice: s’endormit
  rationale: Conserve l’image grecque du sommeil, qui peut ici évoquer avec retenue la mort sans l’expliciter davantage que le texte.
- source_word: ὕπνῳ καλῷ
  choice: d’un sommeil paisible
  rationale: καλός peut signifier beau, bon ou heureux. « Sommeil paisible » rend idiomatiquement l’idée positive dans ce contexte, tout en évitant l’expression peu naturelle « bon sommeil ».
theological_decisions:
- issue: Le sommeil comme désignation possible de la mort
  choice: s’endormit
  alternative: mourut
  rationale: Le grec emploie explicitement le vocabulaire du sommeil ; traduire directement par « mourut » supprimerait l’image et son éventuelle portée théologique.
- issue: Statut de καὶ ἀγαθῷ
  choice: conserver « [et bon] » entre crochets
  alternative: omettre la variante ou l’intégrer sans crochets
  rationale: Les crochets de l’édition signalent un élément textuellement incertain. Il faut préserver cette donnée plutôt que l’effacer ou présenter les mots comme assurés.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche du grec tout en évitant le calque maladroit « étendit ses pieds » et la répétition peu naturelle « sommeil paisible et bon ».
