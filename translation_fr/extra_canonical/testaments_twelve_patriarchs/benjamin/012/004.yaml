lexical_decisions:
- source_word: ἐπέστρεψαν
  choice: revinrent
  rationale: Le verbe exprime ici un retour depuis le pays de Canaan; « revinrent » est naturel en français tout en conservant le mouvement indiqué par le grec.
- source_word: ᾤκησαν
  choice: habitèrent
  rationale: Rend directement l’idée de demeurer ou résider, avec un registre narratif digne.
- source_word: ἐξόδου
  choice: sortie
  rationale: Traduction transparente du substantif grec, qui désigne leur départ hors d’Égypte sans ajouter d’interprétation.
