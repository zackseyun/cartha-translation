base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: fr
  text: 'Ses fils firent ce qu’il leur avait ordonné : ils emportèrent son corps et l’ensevelirent à Hébron avec ses pères.


    Lorsqu’il eut achevé ses paroles, il dit : « Je vous donne cet ordre, mes enfants : faites remonter mes ossements d’Égypte et ensevelissez-moi à Hébron, près de mes pères. »


    Benjamin mourut à l’âge de cent vingt-cinq ans, dans une belle vieillesse, et ils le déposèrent dans un cercueil.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: ils emportèrent son corps
  rationale: Le participe aoriste de αἴρω exprime ici le fait de soulever puis transporter le corps; « emportèrent » rend naturellement les deux aspects dans ce contexte funéraire.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: Conserve l’expression généalogique traditionnelle du grec sans la réduire explicitement à « ancêtres ».
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: emportez mes ossements hors d’Égypte
  rationale: ἀναφέρω peut évoquer une montée, mais dans ce contexte l’idée essentielle est le transfert des restes depuis l’Égypte; « hors d’Égypte » rend clairement ἐξ Αἰγύπτου.
- source_word: ἐν γήρει καλῷ
  choice: dans une heureuse vieillesse
  rationale: Formule française naturelle et digne pour l’expression littérale « dans une bonne vieillesse », qui indique une vieillesse accomplie et favorable.
- source_word: ἐν παραθήκῃ
  choice: dans un cercueil
  rationale: Dans ce contexte funéraire, le terme désigne vraisemblablement un réceptacle où le corps est conservé ou déposé; « cercueil » suit le sens contextuel attesté par la tradition de traduction.
theological_decisions:
- issue: Sens de « ses pères »
  choice: Maintien de « ses pères »
  alternative: « ses ancêtres »
  rationale: Le grec emploie πατέρες et établit un lien explicite avec la sépulture familiale à Hébron. La formulation conserve cette résonance scripturaire sans ajouter d’interprétation.
- issue: Direction exprimée par ἀνενέγκατε
  choice: « emportez … hors d’Égypte »
  alternative: « faites monter … d’Égypte »
  rationale: La traduction retenue préserve le mouvement de sortie clairement indiqué par ἐξ tout en évitant une tournure française artificielle. La portée symbolique éventuelle de la « montée » n’est pas explicitée par ajout.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe fluide, avec maintien des répétitions structurantes (« Hébron », « mes/ses pères ») et du ton testamentaire. Aucun marqueur de note n’est requis, puisqu’aucune note n’est fournie.
