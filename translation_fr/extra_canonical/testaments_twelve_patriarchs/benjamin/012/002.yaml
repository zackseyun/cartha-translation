  naturalness: Le français est sobre, clair et d’un registre testamentaire approprié. « Belle vieillesse » est une expression plus idiomatique en français moderne que « heureuse vieillesse », tout en rendant καλῷ.
  terminology: 'Les noms et les termes funéraires sont bien rendus : « Hébron », « ossements », « pères » et « cercueil » conviennent au contexte. Le maintien de « pères » respecte la formulation généalogique du grec.'
