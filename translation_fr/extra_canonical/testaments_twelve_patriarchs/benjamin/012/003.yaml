base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: fr
  text: Et, dans la quatre-vingt-onzième année qui suivit la sortie des fils d’Israël hors d’Égypte, eux et leurs frères remontèrent en secret les ossements de leurs pères, au cours de la guerre en Canaan, et les ensevelirent à Hébron, auprès des pieds de leurs pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « auprès des pieds de leurs pères » traduit littéralement le grec ; elle peut désigner un emplacement funéraire proche des tombeaux ancestraux plutôt qu’un lieu situé directement aux pieds des pères.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  choice: la quatre-vingt-onzième année
  rationale: Rend directement l’ordinal grec dans un français naturel.
- source_word: ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  choice: après la sortie des fils d’Israël hors d’Égypte
  rationale: « Sortie » conserve le sens concret d’ἔξοδος sans imposer ici le terme théologique « Exode »; « fils d’Israël » reste proche du grec.
- source_word: ἀνήγαγον τὰ ὀστᾶ
  choice: remontèrent les ossements
  rationale: Le verbe ἀνάγω exprime le mouvement vers le haut ou vers le pays; « remonter » convient au transport vers Canaan, tandis qu’« ossements » est idiomatique dans un contexte funéraire.
- source_word: ἐν κρυφῇ
  choice: en secret
  rationale: Équivalent français clair et direct de la locution grecque.
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: pendant la guerre en Canaan
  rationale: La formulation grecque transmise est abrupte; cette traduction conserve la référence à la guerre et à Canaan tout en restant intelligible.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: auprès des pieds de leurs pères
  rationale: Traduction volontairement littérale d’une expression dont la portée funéraire exacte demeure incertaine; la note explicite l’ambiguïté.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe narrative reste proche du grec, tandis que « pendant la guerre en Canaan » clarifie avec retenue une tournure textuellement difficile. L’expression funéraire inhabituelle est conservée dans le texte et expliquée en note.
