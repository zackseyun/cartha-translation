  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
translation:
  language: fr
  text: '**Testament de Benjamin 10**


    **1.** Lorsque Joseph était en Égypte, je désirais vivement voir son apparence et les traits de son visage. Grâce aux prières de Jacob, mon père, je le vis en plein jour, tout éveillé, exactement tel qu’il était, dans toute son apparence.


    **2.** Après avoir dit cela, il leur déclara : « Sachez donc, mes enfants, que je vais mourir. **3.** Pratiquez donc la vérité, chacun envers son prochain[a], et gardez la loi du Seigneur et ses commandements. **4.** Voilà ce que je vous laisse en guise de tout héritage. Vous aussi, transmettez-le à vos enfants comme une possession éternelle, car c’est ainsi qu’ont agi Abraham, Isaac et Jacob. **5.** Ils nous ont donné toutes ces choses en héritage, en disant : “Gardez les commandements de Dieu jusqu’à ce que [le Seigneur révèle son salut à toutes les nations][b]. **6.** Alors vous verrez Hénok, Seth, Abraham, Isaac et Jacob ressuscités à sa droite, dans l’allégresse.”


    **7.** Alors nous aussi, nous ressusciterons, chacun avec son sceptre[c], et nous adorerons le Roi des cieux, [celui qui est apparu sur la terre sous la forme d’un être humain, dans l’humilité ; et tous ceux qui croiront en lui sur la terre se réjouiront avec lui].


    **8.** Tous ressusciteront : les uns pour la gloire, les autres pour le déshonneur. Le Seigneur jugera d’abord Israël à cause de son injustice, [parce qu’ils n’ont pas cru en Dieu lorsqu’il est venu dans la chair]. **9.** Ensuite, il jugera toutes les nations [qui n’ont pas cru en lui lorsqu’il est apparu sur la terre]. **10.** Par les élus d’entre les nations, il convaincra Israël de faute, comme il a convaincu Ésaü par les Madianites, qui ont trompé leurs frères [pour les amener, par l’immoralité sexuelle et l’idolâtrie, à devenir étrangers à Dieu] ; ainsi, ils sont devenus des enfants ayant leur part parmi ceux qui craignent le Seigneur.


    **11.** Vous donc, mes enfants, si vous marchez dans la sainteté, en suivant les commandements du Seigneur, vous demeurerez de nouveau dans l’espérance en moi[d], et tout Israël sera rassemblé auprès du Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « agissez avec vérité ». L’expression grecque signifie littéralement « faites la vérité » et décrit une conduite concrète et droite envers autrui.'
    reason: lexical_alternative
  - marker: b
    text: Les passages entre crochets sont ainsi signalés dans l’édition grecque utilisée. Plusieurs, surtout aux versets 7 à 9, sont souvent considérés comme des développements chrétiens postérieurs en raison de leurs formulations explicites sur l’apparition de Dieu dans la chair et la foi en lui sur la terre.
    reason: textual_variant
  - marker: c
    text: L’expression grecque signifie littéralement quelque chose comme « chacun sur notre sceptre ». Le texte est difficile ; l’image peut évoquer la dignité restaurée ou l’autorité tribale lors de la résurrection.
    reason: textual_difficulty
  - marker: d
    text: 'Le grec dit littéralement : « vous habiterez de nouveau dans l’espérance en moi ». La relation exacte entre « dans l’espérance » et « en moi » demeure difficile à déterminer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: apparence / traits / visage
  rationale: Le grec accumule des termes voisins. La traduction conserve cette insistance sans produire en français une série artificielle de quasi-synonymes.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: en plein jour, tout éveillé
  rationale: Cette formulation souligne que Benjamin ne dormait pas, sans imposer au texte le terme technique de « vision ».
- source_word: ποιήσατε ... ἀλήθειαν
  choice: pratiquez ... la vérité
  rationale: L’expression garde le caractère concret et moral de l’idiome grec, tout en étant plus naturelle en français que « faites la vérité ».
- source_word: ἀντὶ πάσης κληρονομίας
  choice: en guise de tout héritage
  rationale: La formule conserve l’idée que ces prescriptions constituent le véritable legs de Benjamin.
- source_word: κατάσχεσιν αἰώνιον
  choice: possession éternelle
  rationale: Le choix exprime un bien gardé et transmis durablement de génération en génération.
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: ressuscités à sa droite
  rationale: Le contexte eschatologique favorise le sens de résurrection, tandis que le pronom « sa » maintient l’ambiguïté de son référent.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: chacun avec son sceptre
  rationale: Le français courant exige un ajustement distributif. Une note signale que la préposition et le possessif grecs rendent l’expression obscure.
- source_word: ἀτιμία
  choice: déshonneur
  rationale: « Déshonneur » forme avec « gloire » une opposition formelle adaptée au contexte du jugement.
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: avec moi, pleins d’espérance
  rationale: Cette formulation française conserve à la fois l’espérance et l’association avec Benjamin sans prétendre résoudre entièrement la syntaxe difficile.
theological_decisions:
- issue: Passages placés entre crochets dans le témoin grec
  choice: Ils sont traduits dans le corps du texte et maintenus entre crochets.
  alternative: Les omettre comme interpolations chrétiennes, ou les intégrer sans aucun signalement.
  rationale: Le témoin fourni les contient, mais les crochets éditoriaux et le langage explicitement incarnationnel de plusieurs clauses appellent une présentation transparente de leur statut textuel.
- issue: Référent de « sa droite » au verset 6
  choice: Le pronom ambigu « sa » est conservé.
  alternative: Préciser « à la droite de Dieu » ou « à la droite du Seigneur ».
  rationale: Le grec ne répète pas explicitement l’antécédent ; le préciser ajouterait une interprétation.
- issue: Portée de la résurrection et du jugement
  choice: Le texte est rendu comme annonçant la résurrection de tous, avec des issues différentes, puis le jugement d’Israël et des nations.
  alternative: Comprendre la résurrection comme une simple restauration symbolique ou la limiter à Israël.
  rationale: La répétition des verbes de résurrection, suivie du contraste entre gloire et déshonneur et du jugement des nations, soutient naturellement la lecture eschatologique universelle.
- issue: Syntaxe de ἐπὶ σκήπτρον ἡμῶν
  choice: « chacun avec son sceptre », avec une note sur l’obscurité du grec.
  alternative: « chacun sur notre sceptre », « chacun selon sa tribu » ou « chacun sur son trône ».
  rationale: La traduction choisie rend vraisemblablement l’image de dignité royale ou tribale, sans faire passer une conjecture plus précise pour une certitude.
- issue: Lien entre les versets 5 et 6
  choice: La parole héritée des patriarches est close après l’annonce de la révélation du salut ; Benjamin poursuit ensuite l’annonce à ses enfants.
  alternative: Inclure l’ensemble du verset 6 dans la citation des patriarches.
  rationale: La ponctuation n’est pas inhérente au texte grec ancien. Cette délimitation produit un discours cohérent, mais ne change pas le contenu de l’annonce.
translation_notes:
  register: Français international moderne, digne et accessible, avec un ton testamentaire et apocalyptique. Les termes bibliques établis — loi, commandements, gloire, sainteté, résurrection — sont conservés. Les difficultés textuelles et syntaxiques ne sont pas effacées, mais signalées sans alourdir le corps du texte.
