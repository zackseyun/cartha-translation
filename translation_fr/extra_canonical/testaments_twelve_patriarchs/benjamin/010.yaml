  rationale: La révision rétablit la continuité grammaticale de la parole attribuée aux patriarches aux vv. 5–6 et rend ἐν ἐμοί au v. 11 sans le remplacer par une simple association spatiale (« avec moi »). Une légère précision au v. 1 restitue aussi l’insistance de πᾶσα ἡ εἰδέα (« toute son apparence »). Les crochets textuels, l’ambiguïté du référent de « sa droite », et les notes existantes sont préservés.
