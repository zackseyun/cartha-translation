revisions:
- from: Et dans les derniers temps se lèvera un bien-aimé du Seigneur, [issu de la descendance de Juda et de Lévi][a], accomplissant ce qui lui est agréable par sa bouche, [éclairant toutes les nations d’une connaissance nouvelle][b], lumière de connaissance, venant sur Israël avec le salut, leur arrachant quelque chose comme un loup, et le donnant à l’assemblée des nations.[c]
  to: Et dans les derniers temps se lèvera un bien-aimé du Seigneur, [issu de la descendance de Juda et de Lévi][a], faisant par sa bouche ce qui est agréable, [éclairant toutes les nations d’une connaissance nouvelle][b], lumière de connaissance, venant sur Israël avec le salut, arrachant [quelque chose] à ceux-ci comme un loup, et donnant [quelque chose] à l’assemblée des nations.[c]
  rationale: La révision retire une attribution implicite (« lui est agréable ») qui n’est pas fournie par le grec, et rend visiblement les deux objets sous-entendus à la fin. Elle conserve les crochets textuels de l’édition, la métaphore « lumière de connaissance », ainsi que la construction difficile concernant Israël et le salut, sans identifier le personnage ni déterminer ce qui est arraché ou donné.
  reviewer_model: gpt-5.6-terra
