source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: fr
  text: Et dans les derniers temps se lèvera un bien-aimé du Seigneur, [issu de la descendance de Juda et de Lévi][a], faisant par sa bouche ce qui est agréable, [éclairant toutes les nations d’une connaissance nouvelle][b], lumière de connaissance, venant sur Israël avec le salut, arrachant [quelque chose] à ceux-ci comme un loup, et donnant [quelque chose] à l’assemblée des nations.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « issu de la descendance de Juda et de Lévi » sont placés entre crochets dans l’édition grecque utilisée, ce qui signale une incertitude ou une particularité de la tradition textuelle.
    reason: Expliquer le statut éditorial du premier passage entre crochets.
  - marker: b
    text: Les mots « éclairant toutes les nations d’une connaissance nouvelle » sont eux aussi placés entre crochets dans l’édition grecque utilisée.
    reason: Expliquer le statut éditorial du second passage entre crochets.
  - marker: c
    text: Le grec ne précise ni ce qui est arraché à « ceux-ci » ni ce qui est donné à l’assemblée des nations; ces objets sont donc indiqués entre crochets dans la traduction. « Ceux-ci » peut renvoyer à Israël ou aux Israélites.
    reason: Préserver et expliciter les ellipses et l’ambiguïté référentielle de la fin du verset.
lexical_decisions:
- source_word: ἐν ὑστέροις
  choice: dans les derniers temps
  rationale: Rend l’expression eschatologique de façon naturelle sans préciser davantage une formulation grecque elliptique.
- source_word: ἀγαπητὸς Κυρίου
  choice: un bien-aimé du Seigneur
  rationale: Conserve la valeur nominale et la relation au Seigneur, sans identifier explicitement le personnage.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: accomplissant ce qui lui est agréable par sa bouche
  rationale: Préserve l’étrange association de l’action agréable et de la bouche; « lui » renvoie naturellement au Seigneur, tout en laissant subsister la légère ambiguïté du grec.
- source_word: φῶς γνώσεως
  choice: lumière de connaissance
  rationale: Maintient la métaphore nominale distincte de la proposition précédente.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: venant sur Israël avec le salut
  rationale: Reproduit autant que possible la construction difficile du texte transmis, sans la normaliser en « apportant le salut à Israël ».
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: leur arrachant quelque chose comme un loup
  rationale: Le complément d’objet n’est pas exprimé en grec; « quelque chose » signale cette ellipse sans inventer un référent précis.
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: l’assemblée des nations
  rationale: « Assemblée » restitue le sens courant de συναγωγή sans importer automatiquement l’institution appelée synagogue.
theological_decisions:
- issue: Identité du « bien-aimé du Seigneur »
  choice: Aucune identification explicite ajoutée
  alternative: L’identifier au Messie ou à une figure historique précise
  rationale: Le verset peut recevoir une lecture messianique, mais le grec donné ne nomme pas le personnage.
- issue: Rapport de la figure à Juda et Lévi
  choice: Conserver la proposition entre crochets
  alternative: L’intégrer sans signalement ou la supprimer
  rationale: Les crochets de l’édition indiquent un statut textuel particulier qui doit rester visible au lecteur.
- issue: Objet arraché à Israël puis donné aux nations
  choice: Maintenir le référent indéterminé
  alternative: Préciser qu’il s’agit du salut, de la connaissance ou d’un peuple
  rationale: Le texte grec omet l’objet; le déterminer résoudrait indûment une tension théologique et syntaxique réelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe volontairement inhabituelle de « venant sur Israël avec le salut » et l’objet indéfini de « arrachant » reflètent les difficultés du grec transmis plutôt que de les résoudre silencieusement.
