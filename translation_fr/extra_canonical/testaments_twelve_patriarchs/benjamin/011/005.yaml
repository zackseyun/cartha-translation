  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: fr
  text: 'Et, par leur intermédiaire, il viendra comme Jacob, mon père, en disant : « C’est lui qui comblera ce qui manque à ta tribu. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction grecque de « comme Jacob, mon père, en disant » est difficile et peut se comprendre de plusieurs manières.
    reason: Signale une ambiguïté syntaxique réelle du texte source sans imposer une reconstruction conjecturale.
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: par leur intermédiaire
  rationale: Rend le pluriel αὐτῶν et la valeur instrumentale de διά sans réduire l’expression à un simple déplacement spatial.
- source_word: φοιτήσει
  choice: il viendra
  rationale: Le verbe peut évoquer le fait d’aller, de venir ou de se rendre auprès de quelqu’un. « Il viendra » est naturel en français et évite l’emploi transitif peu justifié de « visiter » sans complément.
- source_word: ἀναπληρώσει τὰ ὑστερήματα
  choice: comblera ce qui manque
  rationale: Expression française claire qui conserve l’idée de compléter ou de suppléer à des insuffisances.
- source_word: φυλῆς
  choice: tribu
  rationale: Équivalent usuel de φυλή dans le cadre des tribus d’Israël.
theological_decisions:
- issue: Référent de αὐτός dans la parole citée
  choice: C’est lui qui
  alternative: Il
  rationale: La tournure clivée conserve l’insistance portée par le pronom grec αὐτός sans identifier davantage son référent.
- issue: Rapport syntaxique de « comme Jacob, mon père » avec le contexte
  choice: Conserver la formulation comparative sans l’expliciter
  alternative: comme Jacob, mon père, l’a dit
  rationale: Le grec présente ὡς Ἰακὼβ ὁ πατήρ μου suivi de λέγων, une construction difficile. Ajouter « l’a dit » résoudrait silencieusement l’ambiguïté et modifierait la valeur du participe.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe légèrement inhabituelle autour de « comme Jacob, mon père » est maintenue afin de ne pas effacer la difficulté du grec.
