  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/004.yaml
  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: fr
  text: Et il sera inscrit dans les livres saints, lui, son œuvre et sa parole ; et il sera l’élu de Dieu pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγραφόμενος
  choice: mentionné
  rationale: Le participe exprime le fait d’être consigné ou inscrit par écrit. « Mentionné » rend naturellement l’idée dans ce contexte, tandis que la présence des « livres » conserve le cadre écrit.
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: son œuvre et sa parole
  rationale: 'Cette formulation maintient les deux substantifs grecs au singulier et leur portée ouverte : ce qu’il accomplit et ce qu’il dit ou proclame.'
- source_word: ἐκλεκτὸς Θεοῦ
  choice: l’élu de Dieu
  rationale: Traduction directe qui conserve la valeur théologique du qualificatif sans préciser davantage l’identité ou la fonction de la personne.
- source_word: ἕως τοῦ αἰῶνος
  choice: pour toujours
  rationale: Expression française naturelle pour la durée indéfinie ou perpétuelle indiquée par la locution grecque.
theological_decisions:
- issue: Portée du titre ἐκλεκτὸς Θεοῦ
  choice: l’élu de Dieu
  alternative: choisi par Dieu
  rationale: Le substantif français « l’élu » reflète mieux la tournure prédicative grecque et préserve sa possible valeur de titre, sans imposer une identification confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe parallèle du grec est conservée, avec une ponctuation française fluide.
