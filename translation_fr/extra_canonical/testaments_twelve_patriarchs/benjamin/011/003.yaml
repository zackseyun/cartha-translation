id: T12P.BEN.11.3
reference: Testament of Benjamin 11:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: fr
  text: Jusqu’à l’achèvement de l’ère, il sera présent dans les assemblées des nations et parmi leurs dirigeants, comme une mélodie sur toutes les lèvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντελείας τοῦ αἰῶνος
  choice: l’achèvement de l’ère
  rationale: Rend la notion d’aboutissement ou de consommation d’une période, sans imposer explicitement le sens plus général de « fin du monde ».
- source_word: συναγωγαῖς ἐθνῶν
  choice: les assemblées des nations
  rationale: « Assemblées » conserve ici le sens général de συναγωγαί; « nations » rend ἐθνῶν sans le charger du terme confessionnel « païens ».
- source_word: ἄρχουσιν
  choice: dirigeants
  rationale: Terme français actuel et suffisamment large pour les autorités ou gouvernants.
- source_word: μουσικὸν μέλος
  choice: une mélodie
  rationale: Expression naturelle qui restitue l’image d’un air ou chant musical.
- source_word: ἐν στόματι πάντων
  choice: sur toutes les lèvres
  rationale: Idiome français naturel correspondant à l’image grecque « dans la bouche de tous » et indiquant que tous le chantent ou le répètent.
theological_decisions:
- issue: Portée eschatologique de τοῦ αἰῶνος
  choice: l’ère
  alternative: le monde
  rationale: Le grec αἰών désigne d’abord un âge ou une ère. Cette formulation préserve la portée eschatologique sans confondre explicitement l’achèvement de l’âge avec la destruction du monde.
- issue: Référent implicite du pronom verbal ἔσται
  choice: il sera présent
  alternative: il sera
  rationale: Le sujet masculin est implicite et dépend du contexte antérieur. « Il sera présent » rend le sens locatif de la proposition sans identifier davantage ce référent.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure imagée « sur toutes les lèvres » préserve l’image poétique tout en restant immédiatement compréhensible.
