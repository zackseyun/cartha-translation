source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: fr
  text: Je ne serai plus appelé « loup ravisseur » à cause de vos pillages, mais [ouvrier du Seigneur, distribuant de la nourriture à ceux qui font le bien].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: « loup ravisseur »
  rationale: Rend directement l’image du loup qui saisit et dépouille, tout en conservant l’écho traditionnel de Genèse 49.27.
- source_word: διὰ τὰς ἁρπαγὰς ὑμῶν
  choice: « à cause de vos pillages »
  rationale: Ἁρπαγαί désigne des actes de rapine ou de spoliation; « pillages » est naturel et garde le lien lexical avec l’image du loup ravisseur.
- source_word: ἐργάτης Κυρίου
  choice: « ouvrier du Seigneur »
  rationale: « Ouvrier » exprime le sens courant de ἐργάτης et convient au registre religieux sans surinterprétation.
- source_word: διαδιδὼν τροφὴν
  choice: « distribuant de la nourriture »
  rationale: Traduction proche du grec, qui ne précise ni la nature exacte de la nourriture ni son éventuelle portée symbolique.
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: « à ceux qui font le bien »
  rationale: Formulation française naturelle qui rend l’action exprimée par ἐργάζομαι avec τὸ ἀγαθόν.
theological_decisions:
- issue: Nature de la nourriture distribuée
  choice: Conserver le sens concret et non précisé de « nourriture »
  alternative: Expliciter une nourriture spirituelle ou un enseignement
  rationale: Le grec τροφή ne tranche pas entre une lecture concrète et une portée figurée; la traduction préserve cette ouverture.
- issue: Statut textuel de la seconde proposition
  choice: Maintenir les crochets éditoriaux autour de « ouvrier du Seigneur… »
  alternative: Intégrer la proposition sans crochets
  rationale: La source fournie signale ce segment entre crochets comme textuellement incertain ou interpolé; cette donnée doit rester visible.
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique « ne… plus…, mais… » et les crochets critiques de l’édition grecque sont conservés. Aucun appel de note n’est nécessaire.
