base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: fr
  text: '**Testament de Benjamin 11**


    1 Je ne serai plus appelé « loup ravisseur » à cause de vos rapines, mais « ouvrier du Seigneur », distribuant de la nourriture à ceux qui font le bien.


    2 Dans les derniers temps se lèvera un bien-aimé du Seigneur, issu de la descendance de Juda et de Lévi[a]. Il fera ce qui est agréable par sa bouche[b], éclairant toutes les nations d’une connaissance nouvelle — lumière de connaissance. Il interviendra en Israël avec le salut[c], arrachera, comme un loup, quelque chose d’eux, et le donnera à l’assemblée des nations.


    3 Jusqu’à l’achèvement de l’ère, il sera présent dans les assemblées des nations et parmi leurs dirigeants, comme une mélodie sur toutes les lèvres.


    4 Dans les livres saints seront consignés son œuvre et sa parole, et il sera l’élu de Dieu pour toujours.


    5 Par eux, il viendra comme Jacob, mon père, en disant : « Il comblera ce qui manque à ta tribu. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de ce chapitre est difficile et paraît avoir connu des développements ou des remaniements, particulièrement au verset 2. Le témoin fourni lit ici « de la descendance de Juda et de Lévi »; la traduction anglaise de contrôle porte « de ma descendance ».
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « faisant le bon plaisir dans/par sa bouche ». La construction grecque est obscure; elle peut évoquer ce qui est agréable exprimé par sa bouche, mais le texte ne précise pas à qui ce bon plaisir se rapporte.'
    reason: textual_variant
  - marker: c
    text: 'La construction grecque est incertaine. Autres traductions possibles : « venant sur Israël dans le salut » ou « entrant en Israël avec le salut ».'
    reason: lexical_alternative
  - marker: d
    text: La dernière phrase est obscure. Le grec porte « par eux », au pluriel, sans identifier clairement ni son antécédent ni le sujet de « viendra ». Le verbe peut aussi signifier « se rendre », « aller et venir » ou « visiter ».
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ / ἁρπαγάς
  choice: « loup ravisseur » / « rapines »
  rationale: Conserve l’image prédatrice ainsi que le lien lexical entre le loup qui saisit et les actes de saisie, dans un français digne et intelligible.
- source_word: ἐργάτης Κυρίου
  choice: ouvrier du Seigneur
  rationale: Rend le sens concret de celui qui travaille et maintient le contraste avec le loup ravisseur.
- source_word: ἐργαζομένοις τὸ ἀγαθόν
  choice: ceux qui font le bien
  rationale: Traduit directement l’action de pratiquer ce qui est bon sans introduire l’idée plus étroite de travailler à une œuvre particulière.
- source_word: ἀγαπητὸς Κυρίου
  choice: un bien-aimé du Seigneur
  rationale: Formulation élevée mais courante, qui ne précise pas davantage l’identité de la figure annoncée.
- source_word: ἐκ σπέρματος Ἰούδα καὶ Λευί
  choice: issu de la descendance de Juda et de Lévi
  rationale: Suit le texte grec fourni, malgré la difficulté de cette double ascendance, plutôt que la consultation anglaise qui porte « from my seed ».
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη / φῶς γνώσεως
  choice: éclairant toutes les nations d’une connaissance nouvelle, lumière de connaissance
  rationale: Maintient l’image de l’illumination et la reprise apparemment redondante du témoin grec au lieu de la lisser silencieusement.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: interviendra en Israël avec le salut
  rationale: Le verbe est difficile dans cette construction; « interviendra » préserve l’idée d’entrée en action sans décider si Israël est le lieu, l’objet ou le bénéficiaire.
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: arrachera quelque chose aux leurs comme un loup
  rationale: Conserve la violence du verbe, la comparaison avec le loup et l’absence d’objet explicite; « quelque chose » signale en français cet objet sous-entendu sans l’identifier.
- source_word: συναγωγῇ τῶν ἐθνῶν / συναγωγαῖς ἐθνῶν
  choice: l’assemblée des nations / les assemblées des nations
  rationale: « Assemblée » exprime le rassemblement collectif sans imposer le sens institutionnel moderne de « synagogue ».
- source_word: συντελείας τοῦ αἰῶνος
  choice: l’achèvement de l’ère
  rationale: Préserve à la fois l’idée d’accomplissement ou de terme et la portée temporelle de αἰών.
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: comme une mélodie sur toutes les lèvres
  rationale: Expression française naturelle qui conserve l’image musicale et sa présence dans la bouche de tous.
- source_word: δι᾽ αὐτῶν φοιτήσει
  choice: par eux, il viendra
  rationale: Respecte le pluriel αὐτῶν et rend sobrement le déplacement ou la venue exprimés par φοιτήσει, dont la nuance exacte reste incertaine.
- source_word: ἀναπληρώσει τὰ ὑστερήματα τῆς φυλῆς σου
  choice: il comblera ce qui manque à ta tribu
  rationale: Restitue l’idée de suppléer ou remplir un manque, sans préciser la nature de ce manque.
theological_decisions:
- issue: Identité de la figure future des versets 2 à 5
  choice: La présenter seulement comme « un bien-aimé du Seigneur » et « l’élu de Dieu », selon le témoin grec.
  alternative: L’identifier explicitement comme le Messie, le Christ ou un simple chef tribal.
  rationale: Le passage emploie un langage prophétique et exalté, mais le texte fourni ne donne pas explicitement l’un de ces titres; l’ambiguïté théologique doit donc demeurer.
- issue: Ascendance de la figure annoncée
  choice: Traduire « de la descendance de Juda et de Lévi ».
  alternative: 'Suivre l’anglais de consultation : « de ma descendance », donc de Benjamin.'
  rationale: Le grec fourni nomme explicitement Juda et Lévi. La tension avec le cadre benjaminite et avec d’autres états textuels est signalée en note, non corrigée dans le texte.
- issue: Sens de ἔθνη
  choice: nations
  alternative: païens ou non-Juifs
  rationale: « Nations » conserve l’extension collective du grec et évite d’imposer une opposition confessionnelle plus tardive.
- issue: Objet de l’action comparée à celle d’un loup
  choice: Laisser l’objet indéterminé.
  alternative: Préciser qu’il arrache des personnes, le salut ou un bien à Israël.
  rationale: Le grec omet l’objet de ἁρπάζων; toute identification résoudrait indûment une ambiguïté réelle.
- issue: Référents pronominaux du verset 5
  choice: Conserver le pluriel « par eux » et un sujet masculin non identifié, « il ».
  alternative: Corriger en « par lui » et identifier explicitement le sujet à Dieu ou à la figure annoncée.
  rationale: δι᾽ αὐτῶν est pluriel dans le texte transmis, tandis que le sujet de φοιτήσει n’est pas exprimé. La traduction ne doit pas harmoniser ces difficultés par conjecture.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. La syntaxe a été légèrement régularisée pour être lisible, mais les ruptures, répétitions et ambiguïtés substantielles du grec ont été conservées ou signalées. Les appellations divines et prophétiques restent littérales sans identification confessionnelle ajoutée.
