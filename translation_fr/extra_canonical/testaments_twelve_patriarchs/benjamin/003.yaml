base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003.yaml
  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: fr
  text: '1. Maintenant donc, mes enfants, vous aussi, aimez le Seigneur, le Dieu du ciel et de la terre, et gardez ses commandements, en imitant Joseph, cet homme bon et saint. 2. Que votre pensée soit tournée vers le bien, comme vous savez que la mienne l’est. En effet, celui dont la pensée est droite voit toute chose avec justesse. 3. Craignez le Seigneur et aimez votre prochain. Même si les esprits de Béliar vous poussent vers toute méchanceté qui apporte la détresse, ils ne domineront certainement pas sur vous, pas plus qu’ils n’ont dominé sur Joseph, mon frère. 4. Combien d’hommes ont voulu le tuer ! Pourtant, Dieu l’a gardé à l’abri. En effet, celui qui craint Dieu et aime son prochain ne peut être frappé par l’esprit de Béliar, car la crainte de Dieu le garde à l’abri. 5. Il ne peut pas non plus être dominé par les complots des hommes ou des bêtes, car, pour vivre, il est secouru par l’amour qu’il porte à son prochain.[a] 6. Joseph lui-même supplia notre père de prier pour ses frères,
    afin que le Seigneur ne leur compte pas comme péché le mal qu’ils lui avaient fait. 7. Alors Jacob s’écria : « Mon enfant, toi qui es bon, tu as conquis le cœur de Jacob, ton père ! » Puis il le serra dans ses bras et, pendant deux heures, ne cessa de l’embrasser. Il disait : 8. « Une prophétie céleste s’accomplira à ton sujet[b] : [elle concerne l’Agneau de Dieu et le Sauveur du monde,] car celui qui est sans tache sera livré par des hommes sans loi, et celui qui est sans péché mourra pour des impies [dans le sang de l’alliance, pour le salut des nations et d’Israël, ainsi que pour la destruction de Béliar et de ses serviteurs].[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette phrase est altéré et difficile à reconstruire. Certains témoins développent aussi la mention des bêtes ou parlent d’un « esprit aérien ». La traduction conserve prudemment les éléments lisibles : la personne est secourue « pour vivre » par l’amour qu’elle porte à son prochain.'
    reason: textual_variant
  - marker: b
    text: 'On peut aussi traduire : « La prophétie venue du ciel s’accomplira à ton sujet. » La formulation prépositionnelle varie légèrement selon les témoins.'
    reason: alternative_reading
  - marker: c
    text: Les deux passages placés entre crochets au verset 8 sont également signalés comme secondaires ou textuellement incertains dans l’édition grecque ; ils sont traduits ici afin de rendre visible toute la source fournie.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: aimez
  rationale: L’impératif simple conserve la force éthique et religieuse du verbe sans paraphrase.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: gardez ses commandements
  rationale: « Garder » est naturel dans le registre biblique français et conserve l’idée d’observer fidèlement.
- source_word: μιμούμενοι
  choice: en imitant
  rationale: Cette formulation maintient la valeur participiale et l’appel explicite à prendre Joseph pour modèle.
- source_word: διάνοια
  choice: pensée
  rationale: Le terme désigne ici l’orientation morale et intellectuelle de la personne ; sa répétition est conservée au verset 2.
- source_word: εἰς τὸ ἀγαθόν
  choice: tournée vers le bien
  rationale: La formulation rend le mouvement ou l’orientation exprimés par εἰς dans un français naturel.
- source_word: ὀρθὴν … ὀρθῶς
  choice: droite … avec justesse
  rationale: La parenté sémantique est maintenue sans recourir au peu naturel « voit droitement ».
- source_word: πλησίον
  choice: prochain
  rationale: Terme éthique français établi, qui convient au contexte d’exhortation et à ses résonances scripturaires.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: les esprits de Béliar
  rationale: La translittération suit la forme grecque Βελίαρ et conserve le langage apocalyptique du texte.
- source_word: ἐκστήσωσι
  choice: vous poussent
  rationale: Le verbe exprime ici une pression hostile conduisant au mal ; « pousser » reste lisible sans préciser indûment son mécanisme.
- source_word: κατακυριεύσωσιν / κυριευθῆναι
  choice: dominer / être dominé
  rationale: Le même champ lexical est conservé aux versets 3 et 5 afin de rendre le motif de la domination hostile.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: a gardé à l’abri / garde à l’abri
  rationale: La répétition de l’image protectrice est préservée dans un français actuel.
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: tu as conquis le cœur
  rationale: Littéralement, Joseph a « vaincu les entrailles » de son père ; « conquis le cœur » communique naturellement l’idée d’avoir triomphé de ses sentiments profonds.
- source_word: ὑπὲρ ἀσεβῶν
  choice: pour des impies
  rationale: La préposition conserve ici la valeur de mort en faveur d’autrui, sans développer une théorie particulière de cette mort.
theological_decisions:
- issue: La crainte de Dieu comme protection au verset 4
  choice: La personne est gardée à l’abri par la crainte de Dieu.
  alternative: Comprendre la crainte uniquement comme une disposition psychologique subjective.
  rationale: Le grec présente explicitement la crainte de Dieu comme ce par quoi la personne est protégée ; cette image théologique est conservée sans l’expliquer davantage.
- issue: L’intercession de Joseph au verset 6
  choice: Joseph demande à son père de prier afin que le Seigneur ne compte pas le péché à ses frères.
  alternative: Présenter seulement le pardon direct accordé par Joseph.
  rationale: Le texte grec associe explicitement la miséricorde de Joseph à une prière d’intercession et au fait que Dieu compte ou non le péché.
- issue: Les développements messianiques du verset 8
  choice: Traduire les passages conservés entre crochets dans l’édition, tout en signalant leur statut textuel.
  alternative: Les omettre entièrement du texte principal comme le fait la couche anglaise consultée.
  rationale: Ils figurent dans les données grecques fournies, mais les crochets éditoriaux indiquent qu’ils ne doivent pas être présentés comme textuellement assurés.
- issue: La mort de l’être sans péché « pour des impies »
  choice: Conserver la formulation relationnelle « mourra pour des impies ».
  alternative: Préciser une doctrine déterminée de l’expiation ou de la substitution.
  rationale: La traduction garde la portée théologique de ὑπέρ tout en laissant intacte la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes du grec sont maintenues autant que le permet un français naturel. « Béliar » suit la forme grecque plutôt que la forme française plus courante « Bélial ». Les passages textuellement incertains du verset 8 restent entre crochets, et la corruption du verset 5 est traitée avec prudence plutôt que complétée par une mention non assurée du Seigneur.
