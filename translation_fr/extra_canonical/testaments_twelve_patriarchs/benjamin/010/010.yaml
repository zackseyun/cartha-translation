source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: fr
  text: Et il convaincra Israël de faute parmi les élus des nations, comme il a convaincu Ésaü de faute parmi les Madianites, qui avaient trompé leurs frères [afin qu’ils deviennent, par l’immoralité sexuelle et l’idolâtrie, séparés de Dieu], devenant ainsi des enfants ayant leur part parmi ceux qui craignent le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de ce verset présente plusieurs variantes et une syntaxe difficile. Le passage entre crochets est textuellement incertain : la construction de « deviennent » et de « séparés de Dieu » est irrégulière dans le grec, et les référents de « ils » et de « devenant » ne sont pas entièrement clairs.'
    reason: Les signes critiques de l’édition et l’enchaînement de l’infinitif γενέσθαι, de la proposition ἀπηλλοτριώθησαν Θεοῦ et du participe γενόμενοι ne permettent pas une résolution assurée.
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: convaincra de faute / a convaincu de faute
  rationale: Le verbe ἐλέγχω désigne ici la mise en évidence d’une faute ou la condamnation qui en résulte. « Convaincre de faute » conserve cette portée judiciaire et morale sans réduire le sens à une simple réprimande.
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: parmi ceux des nations qui ont été choisis
  rationale: Cette formulation garde le génitif τῶν ἐθνῶν et l’ambiguïté quant à l’identité exacte des élus, sans introduire le terme ecclésial plus chargé « païens ».
- source_word: ἀπατήσασιν ἀδελφοὺς αὐτῶν
  choice: lesquels avaient trompé leurs frères
  rationale: Le participe aoriste est rendu par un plus-que-parfait pour marquer l’action antérieure. « Leurs frères » conserve littéralement la relation exprimée, même si son référent demeure difficile.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Expression moderne et générale qui rend πορνεία sans le limiter au sens moderne étroit de « prostitution ».
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  choice: soient ainsi séparés de Dieu
  rationale: Le verbe exprime l’aliénation ou l’éloignement. « Séparés de Dieu » est naturel en français et garde la force relationnelle du grec.
- source_word: τέκνα ἐν μερίδι φοβουμένων Κύριον
  choice: des enfants ayant leur part parmi ceux qui craignent le Seigneur
  rationale: La traduction conserve à la fois la métaphore de la filiation et l’idée de part ou de lot portée par μερίς, malgré la syntaxe textuellement incertaine.
theological_decisions:
- issue: Identité des « élus des nations »
  choice: ceux des nations qui ont été choisis
  alternative: les élus parmi les nations
  rationale: La formulation retenue suit de près le grec et évite de préciser s’il s’agit d’un groupe gentil distinct, des élus issus des nations, ou d’un cadre dans lequel Israël est repris.
- issue: Portée du jugement exprimé par ἐλέγχω
  choice: convaincre de faute
  alternative: condamner / reprendre
  rationale: Le choix maintient la tension entre dévoilement de la faute, réprimande et jugement, sans imposer une condamnation définitive.
- issue: Relation logique de la proposition finale
  choice: ils sont donc devenus
  alternative: devenant ainsi
  rationale: Le pluriel grec γενόμενοι se rattache le plus naturellement aux personnes évoquées juste avant, mais son référent exact reste incertain. Une note le signale plutôt que de trancher théologiquement.
translation_notes:
  register: Français moderne, international et digne. La phrase reste relativement ample afin de respecter l’enchaînement grec. Le passage textuellement incertain est conservé entre crochets comme dans la source fournie, et une note avertit le lecteur des difficultés sans reconstruire silencieusement le texte.
