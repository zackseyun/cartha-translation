revisions:
- from: Et il convaincra Israël de faute parmi ceux des nations qui ont été choisis, comme il a convaincu Ésaü de faute parmi les Madianites, lesquels avaient trompé leurs frères [pour qu’ils se livrent à l’immoralité sexuelle et à l’idolâtrie, et qu’ils soient ainsi séparés de Dieu] ; ils sont donc devenus des enfants ayant leur part parmi ceux qui craignent le Seigneur.[a]
  to: Et il convaincra Israël de faute parmi les élus des nations, comme il a convaincu Ésaü de faute parmi les Madianites, qui avaient trompé leurs frères [afin qu’ils deviennent, par l’immoralité sexuelle et l’idolâtrie, séparés de Dieu], devenant ainsi des enfants ayant leur part parmi ceux qui craignent le Seigneur.[a]
  rationale: La révision retire l'ajout interprétatif « se livrent à », conserve « devenir » et emploie une participiale pour le dernier membre afin de mieux refléter l'ambiguïté de la syntaxe grecque. La note est précisée afin d'avertir le lecteur que la formulation française du passage entre crochets demeure nécessairement prudente.
  reviewer_model: gpt-5.6-terra
