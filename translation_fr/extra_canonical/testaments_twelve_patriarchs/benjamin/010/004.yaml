source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: fr
  text: Car je vous laisse ces choses à la place de tout héritage. Et vous donc, donnez-les à vos enfants comme une possession éternelle ; car c’est ainsi qu’ont fait Abraham, Isaac et Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ πάσης κληρονομίας
  choice: à la place de tout héritage
  rationale: Rend directement l’idée de substitution exprimée par ἀντί, sans réduire πάσης à un héritage particulier.
- source_word: δότε αὐτὰ τοῖς τέκνοις ὑμῶν
  choice: transmettez-les à vos enfants
  rationale: Dans le contexte d’un legs moral destiné aux générations suivantes, « transmettre » exprime naturellement le sens de δότε sans suggérer un simple don matériel.
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: comme une possession éternelle
  rationale: Κατάσχεσις désigne ici ce qui est détenu ou possédé durablement ; cette formulation conserve l’image patrimoniale et la portée de αἰώνιον.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure argumentative et l’image de l’héritage sont conservées, tandis que l’impératif « transmettez » évite une tournure française artificielle.
