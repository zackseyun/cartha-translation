  text: And after saying these things he said to them, “Know then, my children, that I am dying.
translation:
  language: fr
  text: 'Après avoir dit cela, il leur déclara : « Sachez donc, mes enfants, que je meurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Rend naturellement en français la construction participiale grecque et évite la lourdeur de « et ayant dit ces choses ».
- source_word: λέγει αὐτοῖς
  choice: il leur déclara
  rationale: Le présent historique grec est rendu par un passé narratif français ; « déclara » évite la répétition de « dit » tout en conservant l'idée de parole adressée.
- source_word: Γινώσκετε οὖν
  choice: Sachez donc
  rationale: Conserve l'impératif et la valeur conclusive de οὖν dans un registre digne et courant.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Équivalent direct et naturel de l'adresse affectueuse.
- source_word: ἀποθνῄσκω
  choice: je vais mourir
  rationale: Dans ce contexte d'annonce de sa mort imminente, cette formulation française exprime naturellement le présent grec sans le durcir en futur absolu.
