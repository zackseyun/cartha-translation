review_pass:
  verdict: revise
  source_fidelity: La phrase principale correspond au grec. Toutefois, χαρίσονται est la forme transmise et signifie normalement « ils feront grâce / accorderont une faveur », tandis que « se réjouiront » correspondrait à χαρήσονται, une forme très proche mais différente. Le futur antérieur « auront cru » ajoute aussi un accomplissement antérieur que le subjonctif aoriste ne requiert pas; « croiront » est plus direct. Le participe προσκυνοῦντες est mieux rendu par une tournure participiale ou circonstancielle que par une seconde proposition coordonnée.
  naturalness: La formulation reste naturelle en français moderne tout en conservant l'étrangeté intentionnelle de « chacun sur notre sceptre », signalée en note. La minuscule à « roi des cieux » évite de transformer automatiquement le titre grec en capitalisation confessionnelle.
  terminology: « Ressusciterons », « nous prosternant », « roi des cieux », « sous la forme d’un être humain » et « dans l’humilité » rendent convenablement les termes grecs sans surinterprétation. La note lexicale doit définir correctement la valeur active usuelle de χαρίσονται et distinguer explicitement la lecture χαρήσονται qui sous-tend « se réjouiront ».
  issues:
  - severity: medium
    issue: Le texte traduit χαρίσονται par « se réjouiront ».
    rationale: La forme grecque imprimée est normalement le futur de χαρίζομαι (« faire grâce », « accorder généreusement »), non celui de χαίρω (« se réjouir »). La ressemblance avec χαρήσονται peut expliquer une correction ou une variante implicite, mais elle ne doit pas être adoptée sans la signaler dans le texte traduit.
  - severity: low
    issue: « Tous ceux qui auront cru » surdétermine le temps de πιστεύσωσιν.
    rationale: Le subjonctif aoriste peut ici se rendre simplement par « tous ceux qui croiront »; le futur antérieur français introduit une antériorité qui n'est pas explicitement marquée.
  - severity: low
    issue: La note c décrit inexactement le sens alternatif de χαρίσονται.
    rationale: « Recevront une faveur » inverse la valeur active habituelle de χαρίζομαι. Il convient de signaler « feront grâce » ou « accorderont une faveur », ainsi que la possible lecture voisine χαρήσονται, « se réjouiront ».
  - severity: medium
    issue: L'historique anglais le plus récent est contradictoire avec le texte grec et avec le texte anglais actuellement affiché.
    rationale: La révision auditée mentionne un jugement des nations et l'incrédulité, éléments absents du grec fourni, alors que le texte anglais courant correspond largement à ce grec. Cette incohérence de traçabilité mérite une vérification éditoriale, sans modifier la traduction française sur sa seule base.
  revised_text: Alors nous aussi, nous ressusciterons, chacun sur notre sceptre[a], en nous prosternant devant le roi des cieux, [celui qui est apparu sur la terre sous la forme d’un être humain, dans l’humilité ; et tous ceux qui croiront en lui sur la terre feront grâce avec lui].[b][c]
  revised_footnotes:
  - marker: a
    text: L’expression grecque « chacun sur notre sceptre » est inhabituelle et son sens précis demeure incertain.
    reason: Préserver une difficulté réelle du texte sans remplacer « sceptre » par une conjecture telle que « trône ».
  - marker: b
    text: Les crochets signalent que ce passage est présenté comme textuellement incertain dans l’édition grecque utilisée.
    reason: Rendre visible le statut éditorial de toute la proposition mise entre crochets dans la source.
  - marker: c
    text: Le grec transmis porte « feront grâce avec lui » ou « accorderont une faveur avec lui ». Une forme très proche, χαρήσονται (« se réjouiront avec lui »), pourrait être à l’origine d’une autre compréhension du passage.
    reason: Conserver la valeur usuelle de χαρίσονται tout en signalant la lecture voisine qui explique la traduction « se réjouiront ».
  revision_rationale: La révision suit la forme grecque effectivement fournie, notamment χαρίσονται, sans effacer la possibilité d’une lecture textuelle voisine. Elle rend πιστεύσωσιν par un futur simple plus neutre et maintient les crochets ainsi que la difficulté de « sceptre ». La divergence interne de l'audit anglais est signalée pour contrôle, mais ne prévaut pas sur le texte source.
