base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: fr
  text: Alors nous aussi, nous ressusciterons, chacun sur notre sceptre[a], et nous nous prosternerons devant le Roi des cieux, [celui qui est apparu sur la terre sous la forme d’un être humain, dans l’humilité ; et tous ceux qui auront cru en lui sur la terre se réjouiront avec lui].[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque « chacun sur notre sceptre » est inhabituelle et son sens précis demeure incertain.
    reason: Préserver une difficulté réelle du texte sans remplacer « sceptre » par une conjecture telle que « trône ».
  - marker: b
    text: Les crochets signalent que ce passage est présenté comme textuellement incertain dans l’édition grecque utilisée.
    reason: Rendre visible le statut éditorial de toute la proposition mise entre crochets dans la source.
  - marker: c
    text: La forme grecque transmise peut aussi être comprise au sens de « recevront une faveur avec lui » ; « se réjouiront » suppose une forme très proche, vraisemblablement visée ici.
    reason: Signaler l’ambiguïté lexicale ou graphique de χαρίσονται au lieu de la résoudre silencieusement.
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: nous ressusciterons
  rationale: Le futur moyen de ἀνίστημι désigne ici le relèvement des morts ; « ressusciterons » exprime clairement ce sens.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: chacun sur notre sceptre
  rationale: Rendu formel qui conserve la formulation grecque inhabituelle ainsi que le pluriel distributif suivi de « notre » ; une note signale l’obscurité de l’expression sans la corriger conjecturalement.
- source_word: προσκυνοῦντες
  choice: et nous nous prosternerons devant
  rationale: Le participe décrit l’hommage cultuel associé à la résurrection ; la coordination donne une phrase française naturelle tout en gardant la relation avec le verbe principal.
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: le Roi des cieux
  rationale: Expression française digne et directe correspondant au titre grec.
- source_word: ἐν μορφῇ ἀνθρώπου
  choice: sous la forme d’un être humain
  rationale: « Être humain » rend ἄνθρωπος sans imposer le sexe masculin là où le grec vise l’humanité, tout en conservant la notion de μορφή.
- source_word: ἐν ταπεινώσει
  choice: dans l’humilité
  rationale: Conserve le substantif abstrait et l’ambivalence entre humble condition et attitude d’humilité.
- source_word: χαρίσονται σὺν αὐτῷ
  choice: se réjouiront avec lui
  rationale: Suit la compréhension contextuelle attestée par la couche de consultation anglaise, probablement liée à la proximité phonétique ou graphique avec χαρήσονται ; une note conserve toutefois l’incertitude créée par la forme grecque transmise.
theological_decisions:
- issue: Identité du « Roi des cieux » et de celui qui est apparu
  choice: Maintenir l’apposition telle qu’elle se présente dans le grec
  alternative: Séparer les deux référents ou expliciter un titre christologique
  rationale: La syntaxe les associe, mais il ne convient pas d’ajouter une identification doctrinale plus précise que le texte.
- issue: Portée de ὅσοι πιστεύσωσιν
  choice: « tous ceux qui auront cru en lui »
  alternative: « tous ceux qui croiront en lui »
  rationale: Le subjonctif aoriste envisage l’ensemble de ceux qui seront parvenus à la foi avant l’aboutissement futur ; le futur antérieur français rend naturellement ce rapport temporel sans transformer la foi en catégorie confessionnelle.
- issue: Crochets éditoriaux autour de la seconde moitié du verset
  choice: Conserver les crochets et les expliquer en note
  alternative: Intégrer les mots sans signalement
  rationale: Les crochets appartiennent à la présentation critique de la source fournie et signalent une réserve textuelle qu’une traduction ne doit pas effacer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche du grec lorsque l’enjeu textuel ou théologique l’exige. Les majuscules de « Roi des cieux » marquent un titre dans ce contexte, sans ajouter de terminologie confessionnelle.
