source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: fr
  text: Quand Joseph était en Égypte, je désirais ardemment voir son apparence et les traits de son visage. Par les prières de Jacob, mon père, je le vis alors que j’étais éveillé, en plein jour, tel qu’il était, dans toute son apparence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεθύμουν
  choice: je désirais ardemment
  rationale: Rend la force du verbe de désir sans adopter une tournure vieillie.
- source_word: τὴν εἰδέαν αὐτοῦ
  choice: son apparence
  rationale: εἰδέα désigne ici l’aspect visible ou l’apparence de Joseph.
- source_word: τὴν μόρφωσιν τῆς ὄψεως αὐτοῦ
  choice: les traits de son visage
  rationale: Formulation française naturelle qui conserve l’idée de la forme ou configuration visible de son visage.
- source_word: δι᾽ εὐχῶν
  choice: Grâce aux prières
  rationale: Exprime ici le moyen par lequel la vision a été accordée; «par les prières» serait plus formel mais moins idiomatique.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: en plein jour, tout éveillé
  rationale: 'Conserve les deux éléments du grec: la vision survient de jour et non pendant le sommeil.'
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  choice: tel qu’il était dans toute son apparence
  rationale: Préserve la formulation quelque peu insistante du grec sans ajouter l’idée d’une exactitude explicitement formulée.
theological_decisions:
- issue: Nature de la vision obtenue par la prière
  choice: je le vis en plein jour, tout éveillé
  alternative: je le vis dans une vision
  rationale: Le texte affirme que Benjamin vit Joseph tout en étant éveillé, mais ne nomme pas explicitement le phénomène comme une «vision»; la traduction conserve cette retenue.
- issue: Efficacité des prières de Jacob
  choice: Grâce aux prières de Jacob, mon père
  alternative: par les prières de Jacob, mon père
  rationale: Le grec attribue aux prières un rôle médiateur sans expliquer le mécanisme; «grâce à» le rend naturellement sans développer de doctrine sur l’intercession.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement fluidifiée en deux phrases. «Tout éveillé» évite l’ambiguïté possible de «veillant» et souligne que l’expérience n’était pas un rêve.
