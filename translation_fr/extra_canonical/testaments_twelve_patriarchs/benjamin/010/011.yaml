source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: fr
  text: Vous donc, mes enfants, si vous marchez dans la sainteté, en gardant les commandements du Seigneur, vous habiterez de nouveau avec moi dans l’espérance, et tout Israël sera rassemblé auprès du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ἁγιασμῷ
  choice: vous marchez dans la sainteté
  rationale: Conserve l’image biblique de la marche comme conduite de vie et rend directement ἐν ἁγιασμῷ, dans un français naturel et digne.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: en gardant les commandements du Seigneur
  rationale: Le grec dit littéralement « dans les commandements »; l’ajout verbal « en gardant » explicite idiomatiquement l’idée de conformer sa conduite aux commandements sans introduire de contenu doctrinal.
- source_word: πάλιν κατοικήσετε
  choice: vous habiterez de nouveau
  rationale: Rend le sens concret de κατοικέω et préserve la valeur de restauration portée par πάλιν.
- source_word: ἐπʼ ἐλπίδι
  choice: dans l’espérance
  rationale: Préserve explicitement ἐλπίς comme « espérance », plutôt que de l’aplatir en « confiance ».
- source_word: ἐν ἐμοί
  choice: avec moi
  rationale: Dans le contexte de κατοικέω, la formulation française « habiter avec moi » est plus naturelle que le calque « habiter en moi ». Le texte grec transmis présente toutefois ici une variation signalée par l’édition.
- source_word: συναχθήσεται πρὸς Κύριον
  choice: sera rassemblé auprès du Seigneur
  rationale: « Auprès du Seigneur » exprime le mouvement ou le rassemblement vers sa présence indiqué par πρός, sans surinterpréter la nature de ce rassemblement.
theological_decisions:
- issue: Rapport entre sainteté et commandements
  choice: « dans la sainteté, en gardant les commandements »
  alternative: « dans la sainteté, dans les commandements »
  rationale: Le calque répété serait obscur en français. La traduction maintient le lien étroit entre sainteté et obéissance sans définir leur relation théologique au-delà du grec.
- issue: Lieu ou relation exprimé par ἐν ἐμοί
  choice: « avec moi »
  alternative: « en moi »
  rationale: « Avec moi » suit le sens contextuel retenu par la couche anglaise auditée et convient au verbe « habiter », tandis que « en moi » pourrait suggérer une union mystique que le passage ne permet pas d’imposer avec certitude.
- issue: Rassemblement de tout Israël
  choice: « tout Israël sera rassemblé auprès du Seigneur »
  alternative: « tout Israël sera réuni au Seigneur »
  rationale: La formulation choisie conserve le passif et l’idée de rassemblement collectif, tout en évitant de préciser l’agent ou les modalités eschatologiques.
translation_notes:
  register: Français international moderne, accessible et solennel. La syntaxe garde la longue phrase conditionnelle du grec tout en rendant idiomatiquement la construction « dans les commandements ». Aucun vocabulaire confessionnel particulier n’est ajouté.
