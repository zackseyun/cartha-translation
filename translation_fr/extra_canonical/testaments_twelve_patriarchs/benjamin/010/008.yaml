source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: fr
  text: Et tous ressusciteront, les uns pour la gloire, les autres pour le déshonneur. Et le Seigneur jugera d’abord Israël à cause de leur injustice, [parce qu’ils n’ont pas cru en lui lorsque Dieu est venu dans la chair].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσονται
  choice: ressusciteront
  rationale: Le contexte eschatologique et les destinations opposées, gloire ou déshonneur, indiquent ici la résurrection plutôt que le simple fait de se lever.
- source_word: ἀτιμίαν
  choice: déshonneur
  rationale: Rend directement l’opposition à δόξαν (« gloire »), sans préciser davantage la nature du sort évoqué.
- source_word: ἐν πρώτοις
  choice: d’abord
  rationale: Expression adverbiale indiquant la priorité du jugement d’Israël.
- source_word: περὶ τῆς ἀδικίας αὐτῶν
  choice: à cause de leur injustice
  rationale: Formulation française naturelle qui conserve le motif du jugement et le pluriel référentiel de αὐτῶν.
- source_word: παραγενόμενον Θεὸν ἐν σαρκί
  choice: lorsque Dieu est venu dans la chair
  rationale: Conserve l’affirmation grecque et l’expression théologiquement chargée ἐν σαρκί sans la paraphraser ni en atténuer la tension.
theological_decisions:
- issue: Statut textuel de la proposition finale
  choice: Maintenir les crochets autour de « parce qu’ils n’ont pas cru en lui lorsque Dieu est venu dans la chair »
  alternative: Intégrer la proposition sans crochets
  rationale: Le texte source fourni place toute cette proposition entre crochets, signal éditorial qu’il convient de préserver plutôt que de trancher silencieusement la question textuelle.
- issue: Référent du pronom αὐτῷ
  choice: « en lui »
  alternative: « en Dieu »
  rationale: Le pronom grec demeure formellement pronominal; conserver « lui » évite d’expliciter au-delà du texte, même si Dieu est l’antécédent immédiat.
- issue: Portée de « tous »
  choice: Conserver « tous » sans restriction
  alternative: Préciser un groupe particulier
  rationale: Le grec πάντες ne fournit ici aucune restriction explicite.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle. Les crochets éditoriaux du texte source sont conservés; aucun appel de note n’est nécessaire.
