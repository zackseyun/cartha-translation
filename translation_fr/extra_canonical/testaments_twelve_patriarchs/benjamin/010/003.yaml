source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ποιήσατε οὖν¹¹ ἀλήθειαν *ἕκαστος πρὸς τὸν πλησίον αὐτοῦ¹², Γκαὶ τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ¹³ φυλάξατε˥.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: fr
  text: Ainsi donc, agissez chacun avec vérité envers votre prochain, et gardez la loi du Seigneur et ses commandements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: agisse avec vérité
  rationale: L’expression grecque signifie littéralement « faire la vérité ». « Agir avec vérité » en conserve la force morale tout en étant naturel en français moderne.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: envers son prochain
  rationale: Rend directement la relation exprimée par πρός et le sens éthique de πλησίον.
- source_word: φυλάξατε
  choice: gardez
  rationale: Conserve l’impératif grec et l’idée d’observer fidèlement des prescriptions.
theological_decisions:
- issue: Rapport entre « la loi du Seigneur » et « ses commandements »
  choice: Maintien des deux expressions coordonnées
  alternative: Les fusionner en « tous les commandements de la loi du Seigneur »
  rationale: Le grec distingue explicitement τὸν νόμον Κυρίου et τὰς ἐντολὰς αὐτοῦ; la traduction ne résout donc pas leur rapport en les fondant l’une dans l’autre.
- issue: Variation de nombre dans l’exhortation
  choice: « que chacun agisse » puis « gardez »
  alternative: Harmoniser au singulier ou au pluriel
  rationale: Le texte grec passe de l’impératif pluriel Ποιήσατε, précisé par ἕκαστος, à un autre impératif pluriel φυλάξατε. La formulation française rend naturellement la valeur distributive de « chacun » tout en conservant l’adresse collective finale.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « agir avec vérité » évite le calque peu idiomatique « faire la vérité » sans réduire ἀλήθεια à la seule franchise verbale.
