review_pass:
  verdict: revise
  source_fidelity: Le futur κρινεῖ est correctement rendu par « jugera », et πάντα τὰ ἔθνη par « toutes les nations ». Toutefois, ἐπίστευσαν est un aoriste qui renvoie naturellement à l’incrédulité lors de l’apparition passée, non à un futur antérieur français. De plus, πιστεύειν avec le datif (αὐτῷ) se rend plus directement par « croire quelqu’un / lui croire » que par « croire en lui », formulation qui peut légèrement renforcer la connotation confessionnelle sans y être obligée par la syntaxe grecque.
  naturalness: « Toutes celles qui ne lui ont pas cru lorsqu’il est apparu sur terre » est idiomatique, maintient l’antécédent « nations » et évite la bascule moins nette vers « tous ceux ». « Sur terre » est naturel en français moderne et correspond à ἐπὶ τῆς γῆς.
  terminology: Le pronom reste non explicité, conformément au grec et au contexte. Les crochets éditoriaux sont conservés, et la note explique leur statut sans préjuger de la décision textuelle.
  issues:
  - severity: medium
    issue: Temps de « n’auront pas cru »
    rationale: Le futur antérieur introduit une relation d’antériorité future qui n’est pas explicitement portée par l’aoriste grec ἐπίστευσαν. Un passé composé situe plus directement le refus de croire au moment de l’apparition.
  - severity: low
    issue: « croire en lui » pour πιστεύειν avec datif
    rationale: Le datif αὐτῷ signifie littéralement « le croire / lui faire confiance ». « Ne lui ont pas cru » respecte plus étroitement la construction grecque tout en restant naturel.
  - severity: low
    issue: « tous ceux » après « toutes les nations »
    rationale: Le relatif neutre pluriel ὅσα reprend les nations collectivement. Le féminin « toutes celles » conserve plus nettement cet antécédent en français.
  revised_text: Et alors, il jugera toutes les nations, [toutes celles qui ne lui ont pas cru lorsqu’il est apparu sur terre].[a]
