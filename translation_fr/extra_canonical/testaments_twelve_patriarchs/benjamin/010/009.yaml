  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: fr
  text: Et alors, il jugera toutes les nations, [toutes celles qui ne lui ont pas cru lorsqu’il est apparu sur terre].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition placée entre crochets a un statut textuel incertain dans l’édition grecque.
    reason: Informer le lecteur de la portée des crochets éditoriaux sans trancher la question textuelle.
lexical_decisions:
- source_word: κρινεῖ
  choice: il jugera
  rationale: Le futur actif est rendu directement, sans préciser davantage la nature du jugement.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Rend naturellement l’expression grecque tout en conservant sa portée collective.
- source_word: ὅσα οὐκ ἐπίστευσαν αὐτῷ
  choice: tous ceux qui n’auront pas cru en lui
  rationale: Le relatif neutre pluriel reprend ici les nations en désignant l’ensemble de ceux qui n’ont pas cru; le futur antérieur français situe cette incrédulité avant le jugement futur.
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: lorsqu’il est apparu sur la terre
  rationale: Déplie le participe aoriste grec en une proposition temporelle naturelle; «apparu» préserve l’idée de manifestation sans en préciser le mode.
theological_decisions:
- issue: Référent du pronom et du participe dans «αὐτῷ … φανέντι»
  choice: «en lui lorsqu’il est apparu»
  alternative: «en celui qui est apparu» ou explicitation du personnage
  rationale: Le grec emploie un pronom et un participe sans nommer ici le référent; la traduction conserve cette dépendance au contexte et n’ajoute aucune identification doctrinale.
- issue: Statut textuel de la proposition entre crochets
  choice: Conserver les crochets dans le texte
  alternative: Intégrer la proposition sans crochets ou l’omettre
  rationale: Les crochets de l’édition signalent une incertitude ou un statut textuel particulier; ils doivent rester visibles plutôt que d’être silencieusement résolus.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du grec, avec une formulation temporelle idiomatique pour le participe.
