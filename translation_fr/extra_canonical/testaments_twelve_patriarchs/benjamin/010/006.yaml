  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: fr
  text: Et alors, vous verrez Hénoc, Seth, Abraham, Isaac et Jacob, relevés à sa droite dans l’allégresse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: vous verrez
  rationale: Rend directement le futur moyen à valeur déponente, adressé au pluriel.
- source_word: ἀνασταμένους
  choice: relevés
  rationale: Le participe aoriste de ἀνίστημι peut évoquer le fait de se lever ou d’être ressuscité; « relevés » préserve cette ouverture dans le contexte eschatologique.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: à sa droite
  rationale: Expression idiomatique française correspondant à la place d’honneur indiquée par le grec.
- source_word: ἐν ἀγαλλιάσει
  choice: dans l’allégresse
  rationale: Conserve la force de joie exultante du substantif grec dans un registre digne et naturel.
theological_decisions:
- issue: Portée résurrectionnelle de ἀνασταμένους
  choice: relevés
  alternative: ressuscités
  rationale: Le contexte peut être celui de la résurrection, mais le verbe décrit littéralement le fait d’être levé; le choix retenu évite de supprimer cette ambiguïté.
- issue: Référent du pronom αὐτοῦ
  choice: sa
  alternative: expliciter le nom du référent
  rationale: Le grec emploie un pronom; la traduction le conserve afin de ne pas imposer une identification absente de ce verset isolé.
translation_notes:
  register: Français international moderne, fluide et digne. La coordination grecque répétitive est légèrement allégée sans modifier la liste ni son mouvement.
