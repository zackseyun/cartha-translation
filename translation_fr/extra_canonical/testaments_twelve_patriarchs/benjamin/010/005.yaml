source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: fr
  text: 'Car ils nous ont donné toutes ces choses en héritage, en disant : « Gardez les commandements de Dieu jusqu’à ce que [le Seigneur révèle son salut à toutes les nations]. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: héritage
  rationale: Rend directement l’idée d’un bien transmis et reçu, tout en conservant la portée traditionnelle du terme.
- source_word: Φυλάξατε
  choice: Gardez
  rationale: L’impératif exprime ici l’observance fidèle des commandements ; « gardez » reste naturel et proche du grec.
- source_word: ἀποκαλύψει
  choice: révèle
  rationale: Conserve l’idée de dévoilement propre au verbe grec ; le subjonctif est requis en français après « jusqu’à ce que ».
- source_word: τὸ σωτήριον αὐτοῦ
  choice: son salut
  rationale: Formulation française naturelle qui exprime l’œuvre salvatrice venant du Seigneur.
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: à toutes les nations
  rationale: Reproduit l’extension universelle de l’expression grecque sans préciser artificiellement « peuples » ou « non-Juifs ».
theological_decisions:
- issue: Portée du salut révélé
  choice: « son salut à toutes les nations »
  alternative: « son moyen de salut à tous les peuples »
  rationale: La formulation retenue préserve la densité théologique et l’universalité du grec sans développer ce que le texte ne précise pas.
- issue: Passage placé entre crochets dans la source fournie
  choice: Conserver les crochets
  alternative: Les supprimer ou expliquer une variante non documentée
  rationale: Les crochets font partie de la présentation de la source fournie ; leur maintien signale honnêtement le statut éditorial du segment sans inventer un apparat critique absent.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec, avec une ponctuation française naturelle. Les crochets de l’édition source sont conservés.
