id: T12P.BEN.3.2
reference: Testament of Benjamin 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: fr
  text: Que votre pensée soit tournée vers le bien, comme vous savez que la mienne l’est. Car celui dont la pensée est droite voit toute chose avec justesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: pensée
  rationale: « Pensée » rend naturellement la faculté intérieure de comprendre et de juger, tout en convenant aux deux occurrences du terme.
- source_word: εἰς τὸ ἀγαθόν
  choice: tournée vers le bien
  rationale: Cette formulation restitue l’orientation indiquée par εἰς sans alourdir la phrase et conserve le caractère moral de τὸ ἀγαθόν.
- source_word: ὀρθὴν / ὀρθῶς
  choice: droite / avec justesse
  rationale: Le couple français préserve le lien lexical entre la disposition intérieure correcte et la manière correcte de voir, tout en évitant la répétition peu naturelle « voit tout droitement ».
- source_word: πάντα
  choice: toute chose
  rationale: Le singulier collectif français rend l’étendue générale de « toutes choses » dans un registre fluide et digne.
theological_decisions:
- issue: Portée de l’affirmation « voit toute chose avec justesse »
  choice: Conserver la formulation absolue du grec
  alternative: Atténuer en « porte un regard juste sur les choses »
  rationale: Le texte grec emploie πάντα sans restriction explicite. La traduction maintient donc cette force rhétorique sans lui ajouter de qualification doctrinale.
- issue: Référent sous-entendu après « comme vous savez »
  choice: Expliciter « que la mienne l’est »
  alternative: Traduire littéralement « comme vous me connaissez »
  rationale: Le grec κἀμὲ οἴδατε est elliptique et peut se comprendre par référence à la disposition de Benjamin. L’explicitation française reprend naturellement « pensée » sans introduire une idée absente.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre la pensée orientée vers le bien, la pensée droite et la juste perception est conservé sans tournure archaïque.
