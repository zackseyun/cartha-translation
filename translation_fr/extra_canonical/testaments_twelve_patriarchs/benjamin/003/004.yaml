source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: fr
  text: Combien d’hommes ont voulu le tuer, et Dieu l’a protégé ! Car celui qui craint Dieu et aime son prochain ne peut être frappé par l’esprit de Béliar, étant protégé par la crainte de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: a protégé / le protège
  rationale: Le verbe signifie littéralement « couvrir, abriter ». Dans ce contexte de préservation contre une attaque, « protéger » est naturel en français et conserve l’image fonctionnelle commune aux deux occurrences.
- source_word: πλησίον
  choice: prochain
  rationale: « Prochain » est l’équivalent français courant et digne pour la personne envers laquelle s’exerce l’amour demandé.
- source_word: πνεύματος τοῦ Βελίαρ
  choice: l’esprit de Béliar
  rationale: La formulation génitive est maintenue sans préciser si elle désigne Béliar lui-même ou un esprit qui lui appartient, afin de préserver l’ambiguïté du grec.
- source_word: φοβούμενος / φόβου
  choice: craint / crainte
  rationale: Le même champ lexical est conservé dans les deux propositions, conformément à la répétition grecque.
theological_decisions:
- issue: Nature de « l’esprit de Béliar »
  choice: l’esprit de Béliar
  alternative: Béliar / un esprit envoyé par Béliar
  rationale: Le texte grec ne tranche pas explicitement entre identification, appartenance et provenance ; la traduction garde donc la construction ouverte.
- issue: Portée de la protection promise
  choice: ne peut être frappé
  alternative: ne peut subir aucun mal
  rationale: La formulation traduit directement πληγῆναι sans élargir la promesse à toute forme de souffrance ou de malheur.
translation_notes:
  register: Français international moderne, clair et digne. La première phrase garde la force exclamative de l’interrogatif grec, tandis que « En effet » rend la relation explicative introduite par γάρ. La dernière proposition est légèrement restructurée à la voix active pour éviter une tournure passive lourde, sans modifier l’agent de la protection.
