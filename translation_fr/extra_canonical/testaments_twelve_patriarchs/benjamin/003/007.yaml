  text: Καὶ *οὕτως ἐβόα Ἰακώβ³⁷· *ὦ τέκνον χρηστόν³⁸, ἐνίκησας³⁹ τὰ σπλάγχνα⁴⁰ Ἰακὼβ τοῦ πατρός σου· καὶ περιλαβὼν⁴¹ αὐτὸν⁴² ἐπὶ⁴³ δύο⁴⁴ ὥρας κατεφίλει, λέγων·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/007.yaml
  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: fr
  text: 'Et Jacob s’écria ainsi : « Ô toi, bon fils, tu as vaincu les entrailles de Jacob, ton père ! » Puis il le serra dans ses bras et, pendant deux heures, ne cessa de l’embrasser, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστόν
  choice: bon
  rationale: Rend simplement et dignement l’idée de bonté exprimée par l’adjectif, dans l’apostrophe affectueuse « bon enfant ».
- source_word: ἐνίκησας
  choice: tu as vaincu
  rationale: Conserve l’image forte et quelque peu surprenante de la victoire, plutôt que de l’atténuer en « émouvoir ».
- source_word: τὰ σπλάγχνα
  choice: les entrailles
  rationale: Préserve la métaphore corporelle grecque désignant le siège des affections profondes; « le cœur » serait plus naturel mais effacerait l’image originale.
- source_word: περιλαβών
  choice: il le serra dans ses bras
  rationale: Expression française naturelle pour l’action d’entourer quelqu’un de ses bras.
- source_word: κατεφίλει
  choice: ne cessa de l’embrasser
  rationale: L’imparfait grec exprime une action prolongée ou répétée; cette tournure la restitue clairement.
- source_word: ἐπὶ δύο ὥρας
  choice: pendant deux heures
  rationale: Rend directement la durée indiquée par le grec.
theological_decisions:
- issue: Sens figuré de « vaincre les entrailles »
  choice: Maintenir littéralement l’image de la victoire sur les entrailles paternelles
  alternative: « tu as profondément ému Jacob, ton père »
  rationale: Le grec associe explicitement ἐνίκησας et τὰ σπλάγχνα. La formulation retenue conserve sa force affective et son étrangeté sans imposer une interprétation plus précise.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est fluidifiée, tandis que la métaphore sémitisante des « entrailles » et le verbe « vaincre » sont conservés afin de respecter la tension du texte source.
