    issue: « toutes sortes de détresses mauvaises »
    rationale: Cette expression rend πᾶσαν par une pluralité indéfinie (« toutes sortes de ») plutôt que par « toute », et elle interprète la relation difficile entre πονηρία et θλίψεως. Une formulation au singulier conserve plus exactement le quantificateur et l’ambiguïté du grec.
  revised_text: Craignez le Seigneur et aimez votre prochain ; et si les esprits de Béliar vous entraînent dans toute mauvaise détresse, ils ne domineront certainement pas sur vous, de même qu’ils n’ont pas dominé sur Joseph, mon frère.
