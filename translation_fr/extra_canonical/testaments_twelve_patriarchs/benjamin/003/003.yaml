source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: fr
  text: Craignez le Seigneur et aimez votre prochain ; et si les esprits de Béliar vous entraînent dans toute mauvaise détresse, ils ne domineront certainement pas sur vous, de même qu’ils n’ont pas dominé sur Joseph, mon frère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβεῖσθε
  choice: Craignez
  rationale: Rend directement l’impératif grec, dans son sens religieux de crainte respectueuse du Seigneur.
- source_word: τὸν πλησίον
  choice: votre prochain
  rationale: Expression française naturelle et traditionnelle qui conserve la portée éthique du grec.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: les esprits de Béliar
  rationale: Translittère le nom propre et maintient la désignation plurielle du texte grec.
- source_word: ἐκστήσωσι ὑμᾶς
  choice: vous entraînent
  rationale: Exprime l’action de pousser ou d’égarer hors d’un état stable, sans imposer un mécanisme plus précis que le grec.
- source_word: εἰς πᾶσαν πονηρίαν θλίψεως
  choice: dans toutes sortes de détresses mauvaises
  rationale: La construction grecque est heurtée. Cette formulation française conserve l’association de la méchanceté ou du mal avec la détresse, tout en restant intelligible.
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: ils ne domineront certainement pas sur vous
  rationale: Le double négatif grec est fortement emphatique; « certainement pas » en restitue la force, tandis que « dominer sur » rend κατακυριεύω.
- source_word: ὡς οὔτε Ἰωσὴφ τὸν ἀδελφόν μου
  choice: pas plus qu’ils n’ont dominé sur Joseph, mon frère
  rationale: Complète en français le verbe sous-entendu dans la comparaison grecque et identifie Joseph conformément au texte.
theological_decisions:
- issue: Portée de la promesse concernant les esprits de Béliar
  choice: Conserver la tension entre leur capacité d’entraîner dans la détresse et leur incapacité à dominer définitivement
  alternative: Atténuer « entraîner » pour éviter l’apparente tension
  rationale: Le texte juxtapose explicitement les deux idées; la traduction ne doit pas résoudre cette tension théologique.
- issue: Sens de la crainte du Seigneur
  choice: Employer « Craignez » sans paraphrase explicative
  alternative: « Révérez » ou « Respectez profondément »
  rationale: « Craignez le Seigneur » demeure naturel dans le registre biblique français et préserve l’éventail sémantique de φοβεῖσθε.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère coloration biblique. La syntaxe a été lissée sans effacer la construction difficile de πᾶσαν πονηρίαν θλίψεως ni l’emphase de οὐ μή.
