  rationale: La révision remplace « toutes sortes de détresses mauvaises » par « toute mauvaise détresse », afin de conserver le singulier et la portée de πᾶσαν, tout en maintenant la formulation volontairement quelque peu dense du grec εἰς πᾶσαν πονηρίαν θλίψεως. La comparaison est conservée explicitement, sans ajouter d’interprétation théologique.
