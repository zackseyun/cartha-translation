source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: fr
  text: « Une prophétie céleste à ton sujet s’accomplira, [au sujet de l’Agneau de Dieu et du Sauveur du monde][a], car celui qui est sans défaut sera livré par des hommes sans loi, et celui qui est sans péché mourra pour les impies, [dans le sang de l’alliance, pour le salut des nations et d’Israël, et pour la destruction de Béliar[b] et de ses serviteurs][c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce segment est placé entre crochets dans l’édition grecque utilisée, ce qui signale une réserve textuelle ou éditoriale.
    reason: Préserver de façon transparente le statut indiqué par le texte source.
  - marker: b
    text: Béliar est un nom donné à la puissance du mal dans plusieurs écrits juifs anciens.
    reason: Aider le lecteur moderne sans remplacer le nom propre par une identification interprétative.
  - marker: c
    text: Tout ce segment final est placé entre crochets dans l’édition grecque utilisée.
    reason: Signaler que les crochets appartiennent à la présentation critique de la source.
lexical_decisions:
- source_word: Πληρωθήσεται
  choice: s’accomplira
  rationale: Le verbe πληρόω appliqué à une prophétie signifie naturellement qu’elle arrive à son accomplissement.
- source_word: περὶ σοῦ
  choice: à ton sujet
  rationale: Rend directement la relation exprimée par περί sans préciser davantage l’identité ou le rôle du destinataire.
- source_word: ἀμνὸς τοῦ Θεοῦ
  choice: Agneau de Dieu
  rationale: Expression traditionnelle et immédiatement intelligible, qui conserve l’image sacrificielle du grec.
- source_word: ἄμωμος
  choice: l’homme irréprochable
  rationale: Ἄμωμος peut signifier sans défaut ou irréprochable; cette formulation garde sa portée morale et sacrificielle sans les confondre explicitement.
- source_word: ὑπὸ ἀνόμων
  choice: par des hommes sans loi
  rationale: Avec le passif παραδοθήσεται, ὑπό indique l’agent; « sans loi » préserve le lien lexical avec ἄνομος plutôt que de généraliser en « méchants ».
- source_word: ἀναμάρτητος
  choice: celui qui est sans péché
  rationale: Traduction explicite et naturelle de l’adjectif substantivé, distincte d’ἄμωμος.
- source_word: ὑπὲρ ἀσεβῶν
  choice: pour les impies
  rationale: Conserve la valeur potentiellement substitutive ou bénéficiaire de ὑπέρ sans l’expliciter au-delà du texte.
- source_word: ἐν αἵματι διαθήκης
  choice: dans le sang de l’alliance
  rationale: Rendu formel qui maintient l’image et l’ambiguïté de la préposition ἐν.
- source_word: ἐθνῶν
  choice: nations
  rationale: Dans le contraste avec Israël, « nations » rend le sens collectif de ἔθνη sans imposer « païens ».
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française usuelle de la forme grecque, sans la remplacer interprétativement par « Satan ».
- source_word: καταλύσει
  choice: destruction
  rationale: Le nom dépend de ἐπί comme « salut » et désigne ici l’abolition ou la ruine de Béliar et de ses serviteurs.
theological_decisions:
- issue: Portée de la mort « pour les impies »
  choice: Conserver « pour »
  alternative: « à la place des impies » ou « en faveur des impies »
  rationale: Ὑπέρ permet une nuance de substitution ou de bénéfice, mais le contexte immédiat ne commande pas de trancher entre elles.
- issue: Identification de Béliar
  choice: Conserver le nom propre « Béliar »
  alternative: « le diable » ou « Satan »
  rationale: Le texte grec donne un nom propre; le remplacer résoudrait une identification que la traduction doit laisser au lecteur et au contexte.
- issue: Segments placés entre crochets dans l’édition source
  choice: Maintenir les crochets dans le texte français
  alternative: Intégrer les segments sans indication ou les omettre
  rationale: Les crochets de l’édition signalent une réserve textuelle ou éditoriale; les conserver rend visible cette situation sans reconstruire un apparat absent.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe reste proche du mouvement du grec, tout en divisant l’énoncé en deux phrases pour la lisibilité. Les deux qualificatifs ἄμωμος et ἀναμάρτητος sont distingués, et les ambiguïtés de ὑπέρ et de ἐν sont conservées.
