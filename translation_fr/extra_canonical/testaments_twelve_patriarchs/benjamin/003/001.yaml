base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: fr
  text: Maintenant donc, mes enfants, vous aussi, aimez le Seigneur, le Dieu du ciel et de la terre, gardez ses commandements, en imitant Joseph, l'homme bon et saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νῦν οὖν
  choice: Maintenant donc
  rationale: Rend explicitement la transition logique et temporelle du grec.
- source_word: ἀγαπήσατε
  choice: aimez
  rationale: Impératif direct et naturel correspondant au verbe grec « aimer ».
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: gardez ses commandements
  rationale: « Garder » conserve l’idée d’observer fidèlement les commandements et le langage biblique courant.
- source_word: μιμούμενοι
  choice: imitez
  rationale: La coordination impérative exprime naturellement en français la valeur exhortative du participe grec, étroitement lié aux impératifs précédents.
- source_word: τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα Ἰωσήφ
  choice: Joseph, cet homme bon et saint
  rationale: La reprise démonstrative produit un français naturel tout en conservant les deux qualifications morales du grec.
theological_decisions:
- issue: Portée de « Seigneur » et de l’apposition divine
  choice: le Seigneur, le Dieu du ciel et de la terre
  alternative: le Seigneur Dieu du ciel et de la terre
  rationale: La virgule préserve la structure appositionnelle de Κύριον τὸν Θεὸν et évite de transformer l’expression en simple titre composé.
- issue: Sens de ὅσιος appliqué à Joseph
  choice: saint
  alternative: pieux
  rationale: « Saint » rend le sens moral et religieux de ὅσιος sans réduire le terme à une pratique dévotionnelle particulière.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase conserve le ton d’exhortation paternelle et la structure ternaire : aimer Dieu, garder ses commandements, imiter Joseph.'
