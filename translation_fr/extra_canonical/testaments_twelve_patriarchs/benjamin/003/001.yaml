  source_fidelity: 'Le sens est fidèlement rendu : l''exhortation porte sur l''amour du Seigneur, l''observance de ses commandements et Joseph comme modèle. Le participe grec μιμούμενοι est toutefois plus exactement préservé en français par une tournure participiale ou de manière (« en imitant »), plutôt que par un troisième impératif autonome.'
  naturalness: Le français est clair et de registre approprié. « En imitant Joseph, l'homme bon et saint » est à la fois plus naturel dans cette période et plus proche de l'enchaînement grec que « et imitez Joseph, cet homme bon et saint ».
  terminology: « Seigneur », « Dieu du ciel et de la terre », « gardez ses commandements » et « saint » rendent de manière juste et non confessionnellement surchargée les termes grecs. « Homme bon et saint » maintient les deux qualifications ἀγαθός et ὅσιος.
