  text: '*Καὶ γὰρ³¹ *ὁ Ἰωσὴφ ἐδεήθη τοῦ πατρὸς ἡμῶν³², ἵνα προσεύξηται *ὑπὲρ τῶν ἀδελφῶν αὐτοῦ³³· ἵνα μὴ³⁴ λογίσηται *⌈Κύριος⌉ αὐτοῖς³⁵ *ἁμαρτίαν, ὅτι ἐποίησαν πονηρὸν εἰς αὐτόν³⁶.'
