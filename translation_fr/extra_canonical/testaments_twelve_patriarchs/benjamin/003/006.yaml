base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: fr
  text: Car Joseph aussi supplia notre père de prier pour ses frères, afin que le Seigneur ne leur impute pas ce péché, puisqu’ils lui avaient fait du mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: supplia
  rationale: Rend la demande instante exprimée par le verbe grec, dans un registre digne et naturel.
- source_word: λογίσηται
  choice: impute
  rationale: Conserve l’idée de porter un acte au compte de quelqu’un, sans réduire le sens à un simple souvenir.
- source_word: ἁμαρτίαν
  choice: ce péché
  rationale: Le singulier renvoie naturellement au mal précis commis contre Joseph; le démonstratif clarifie ce lien en français.
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: ils lui avaient fait du mal
  rationale: Expression française naturelle qui traduit directement l’acte mauvais dirigé contre Joseph.
theological_decisions:
- issue: Sujet de λογίσηται
  choice: le Seigneur
  alternative: Seigneur, sans article défini ou avec une variante textuelle signalée
  rationale: Le texte édité présente Κύριος et le contexte syntaxique en fait le sujet de l’imputation; la traduction n’ajoute aucune précision doctrinale.
- issue: Portée de ἁμαρτίαν
  choice: ne leur impute pas ce péché
  alternative: ne leur compte pas de péché
  rationale: La formulation retenue rattache le péché à l’acte commis contre Joseph tout en préservant le langage comptable et théologique du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Notre père » est conservé comme désignation familiale, et le lien causal de ὅτι est rendu par « puisque ».
