source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀπὸ²⁴ ἐπιβουλῆς ἀνθρώπων ἢ θηρίων οὐ δύναται κυριευθῆναι²⁸, βοηθούμενος *†ζῆν ἀπ᾽ αὐτῆς† ὑπὸ τῆς ἀγάπης²⁹ ἧς³⁰ ἔχει πρὸς τὸν πλησίον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: fr
  text: Et il ne peut être dominé par les embûches des hommes ou des bêtes, étant aidé †à vivre d’elle†[a] par l’amour qu’il porte à son prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec correspondant à « à vivre d’elle » est corrompu et son sens demeure incertain ; « elle » renverrait grammaticalement à un nom féminin, peut-être à l’amour.
    reason: Signaler l’incertitude textuelle marquée par les obèles dans l’édition et préserver l’ambiguïté du pronom.
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: embûches
  rationale: Le nom désigne un dessein hostile, un complot ou une attaque préparée. « Embûches » convient à la fois aux hommes et aux bêtes et reste naturel en français.
- source_word: κυριευθῆναι
  choice: être dominé
  rationale: Le passif exprime le fait de tomber sous le pouvoir ou la maîtrise de quelqu’un ou de quelque chose; « être dominé » conserve cette image sans réduire le sens à la seule défaite physique.
- source_word: ὑπὸ τῆς ἀγάπης ἧς ἔχει πρὸς τὸν πλησίον
  choice: par l’amour qu’il porte à son prochain
  rationale: Cette formulation rend directement l’agent introduit par ὑπό et l’expression relationnelle πρὸς τὸν πλησίον dans un français actuel et digne.
- source_word: βοηθούμενος
  choice: étant aidé
  rationale: Le participe présent passif est conservé afin de respecter la relation syntaxique avec la proposition principale, sans transformer explicitement l’aide en cause.
theological_decisions:
- issue: Identité de l’agent qui apporte l’aide
  choice: L’amour est maintenu comme agent grammatical de l’aide.
  alternative: Introduire « le Seigneur » comme agent.
  rationale: Dans le texte grec fourni, ὑπὸ τῆς ἀγάπης signifie explicitement « par l’amour ». Aucun terme correspondant à « Seigneur » n’apparaît; il ne convient donc pas de l’ajouter.
- issue: Passage textuellement corrompu ζῆν ἀπ᾽ αὐτῆς
  choice: Conserver une traduction littérale signalée par des obèles et une note.
  alternative: Supprimer le segment ou en proposer une correction conjecturale.
  rationale: La leçon transmise est incertaine, mais sa conservation rend visible l’état réel du texte et évite de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure participiale et les obèles sont conservés en raison de l’état difficile du grec; la note empêche de présenter comme certaine une reconstruction conjecturale.
