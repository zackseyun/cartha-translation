source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: fr
  text: L’épée est la mère de sept maux. D’abord, la pensée conçoit par l’intermédiaire de Béliar[a]. Le premier est l’envie, le deuxième la destruction, le troisième la détresse, le quatrième le châtiment divin[b], le cinquième le dénuement, le sixième le trouble et le septième la dévastation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béliar est un nom donné à la puissance du mal ou à son chef.
    reason: Le nom propre peut être inconnu du lectorat moderne; la note l’identifie sobrement sans imposer une construction doctrinale détaillée.
  - marker: b
    text: 'Littéralement : « fléau venu de Dieu ». Certaines traductions donnent ici « captivité », mais le texte grec fourni porte un terme désignant une calamité attribuée à l’action divine.'
    reason: Le terme grec est rare et la traduction anglaise de consultation suit une autre compréhension; la note rend visible la difficulté textuelle et lexicale.
lexical_decisions:
- source_word: μάχαιρα
  choice: l’épée
  rationale: Désigne ici une arme tranchante; « épée » conserve l’image traditionnelle et le rapport avec les violences qui suivent.
- source_word: διάνοια
  choice: la pensée
  rationale: Rend la faculté intérieure qui forme ou conçoit une intention, sans imposer la distinction moderne entre intelligence et esprit.
- source_word: συλλαμβάνει
  choice: conçoit
  rationale: Préserve la métaphore de l’engendrement introduite par « mère ».
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française de la forme grecque, plutôt que substitution par un autre nom traditionnel.
- source_word: ἀπώλεια
  choice: la destruction
  rationale: Sens direct du terme grec dans ce contexte; évite de l’atténuer en « désespoir ».
- source_word: θλῖψις
  choice: la détresse
  rationale: Exprime l’oppression et l’affliction de façon naturelle en français moderne.
- source_word: θεηλασία
  choice: le châtiment divin
  rationale: Le grec désigne un fléau ou une calamité attribuée à l’action divine; « captivité », retenu dans certaines traductions, ne correspond pas au mot grec transmis ici.
- source_word: ἔνδεια
  choice: le dénuement
  rationale: Désigne le manque et la pauvreté; « dénuement » convient à une liste de calamités.
- source_word: ταραχή
  choice: le trouble
  rationale: Conserve l’étendue du terme, qui peut évoquer agitation, désordre ou bouleversement.
- source_word: ἐρήμωσις
  choice: la dévastation
  rationale: Rend l’action ou l’état de rendre désert, plutôt qu’un simple sentiment d’abandon.
theological_decisions:
- issue: Rôle de Béliar dans la conception du mal
  choice: « par l’intermédiaire de Béliar »
  alternative: « sous l’influence de Béliar »
  rationale: La préposition διά exprime une médiation ou une causalité; la formulation retenue préserve cette force sans préciser au-delà du texte la nature exacte de l’action de Béliar.
- issue: Interprétation de θεηλασία
  choice: « châtiment divin » avec note
  alternative: « captivité »
  rationale: Le choix suit le lexème grec attesté dans la source fournie. La note signale le caractère littéral et potentiellement difficile de cette lecture sans corriger silencieusement le texte d’après la tradition anglaise.
translation_notes:
  register: Français moderne, sobre et rythmé. La répétition ordinale est maintenue afin de préserver la structure didactique du grec, tandis que les articles sont employés naturellement. La transition grecque est abrupte et textuellement signalée comme difficile; le français conserve cette succession sans ajouter l’expression interprétative « voici ce qu’elle enfante ».
