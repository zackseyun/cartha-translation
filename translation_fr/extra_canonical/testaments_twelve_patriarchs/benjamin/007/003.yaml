source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: fr
  text: C’est pourquoi Caïn aussi fut livré par Dieu à sept châtiments. Car, chaque centième année, le Seigneur lui infligea une plaie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο καὶ
  choice: C’est pourquoi Caïn aussi
  rationale: Rend à la fois le lien causal et καί, qui inclut Caïn comme cas parallèle dans le raisonnement.
- source_word: ἑπτὰ ἐκδικίαις
  choice: à sept châtiments
  rationale: ἐκδίκησις peut désigner la vengeance ou le châtiment vindicatif. « Châtiments » est naturel ici et évite l’expression peu idiomatique « actes de vengeance », tout en conservant la dimension punitive.
- source_word: παρεδόθη ὑπὸ τοῦ Θεοῦ
  choice: fut livré par Dieu
  rationale: Conserve le passif et exprime explicitement l’agent divin présent dans le grec.
- source_word: κατὰ ἑκατοστὸν ἔτος
  choice: chaque centième année
  rationale: Suit la valeur distributive de κατά avec l’ordinal, sans transformer l’expression en simple durée de cent ans.
- source_word: μίαν πληγὴν ἐπήγαγεν ἐπʼ αὐτὸν
  choice: lui infligea une plaie
  rationale: Rend l’idée de faire venir une atteinte sur quelqu’un dans un français naturel, tout en conservant μίαν, « une ».
theological_decisions:
- issue: Nature des sept ἐκδικίαις
  choice: sept châtiments
  alternative: sept actes de vengeance
  rationale: Le contexte présente des sanctions imposées par Dieu. « Châtiments » garde cette portée judiciaire sans attribuer au terme une nuance moderne de revanche personnelle.
- issue: Agent de la remise de Caïn
  choice: par Dieu
  alternative: agent sous-entendu
  rationale: Le grec nomme explicitement Dieu comme agent avec ὑπὸ τοῦ Θεοῦ; il doit donc rester exprimé.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la syntaxe grecque tout en évitant les calques maladroits. Aucune note n’est nécessaire.
