base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: fr
  text: Pendant deux cents ans, il souffre, et dans la neuf-centième année, il est dévasté[a]. En effet, à cause d’Abel, son frère, il fut jugé par toutes sortes de malheurs, tandis que Lamek le fut soixante-dix fois sept fois. Car jusqu’à la fin de l’ère, ceux qui deviennent semblables à Caïn par une telle jalousie et une telle haine de leurs frères seront punis par un jugement semblable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est réduit à la désolation ». Le sujet implicite demeure Caïn ; le présent grec peut aussi se comprendre comme un présent narratif.'
    reason: Signaler l’étendue sémantique de ἐρημοῦται et l’ambiguïté temporelle sans alourdir le texte principal.
lexical_decisions:
- source_word: πάσχει
  choice: il souffre
  rationale: Rend directement le présent grec tout en conservant son caractère narratif ou gnomique.
- source_word: ἐρημοῦται
  choice: il est dévasté
  rationale: Le verbe peut évoquer le fait d’être rendu désert, désolé ou ruiné; « dévasté » reste naturel sans préciser indûment le mode de destruction.
- source_word: ἐκρίνετο
  choice: il fut jugé
  rationale: Conserve le vocabulaire judiciaire et la voix passive du grec.
- source_word: ἐν πᾶσι τοῖς κακοῖς
  choice: par toutes sortes de malheurs
  rationale: Dans ce contexte de rétribution, κακά désigne probablement les maux subis; cette formulation française évite l’idée peu naturelle d’être jugé « dans tous les maux ».
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: soixante-dix fois sept fois
  rationale: Préserve la formule numérique grecque et son écho scripturaire plutôt que de la convertir en 490.
- source_word: ἕως τοῦ αἰῶνος
  choice: jusqu’à la fin de l’ère
  rationale: Suit le sens contextuel attesté par la tradition textuelle consultée, tout en gardant αἰών distinct du simple « monde ».
- source_word: μισαδελφίᾳ
  choice: haine de leurs frères
  rationale: Exprime clairement le composé grec désignant la haine fraternelle, dans un français courant et inclusif quant aux personnes visées.
- source_word: κολασθήσονται ... κρίσει
  choice: seront punis par un jugement
  rationale: Maintient à la fois l’idée de châtiment de κολάζω et celle de jugement de κρίσις.
theological_decisions:
- issue: Nature et durée du châtiment de Caïn
  choice: Conserver la chronologie telle qu’elle apparaît, sans l’harmoniser avec la Genèse ni en expliciter le mécanisme.
  alternative: Interpréter les deux cents et neuf cents ans comme des périodes symboliques ou corriger la chronologie.
  rationale: Le texte grec présente ces nombres sans explication; les résoudre imposerait une interprétation absente de la source.
- issue: Portée de ἕως τοῦ αἰῶνος
  choice: « jusqu’à la fin de l’ère »
  alternative: « pour toujours » ou « jusqu’au siècle »
  rationale: La formulation retenue conserve l’orientation eschatologique probable sans affirmer explicitement un châtiment éternel.
- issue: Lien entre ressemblance à Caïn et jugement
  choice: « par une telle jalousie et une telle haine de leurs frères »
  alternative: Faire de la jalousie et de la haine des circonstances séparées de la ressemblance à Caïn.
  rationale: La syntaxe associe naturellement la ressemblance à Caïn à ces dispositions, tout en laissant intact le principe de rétribution analogue.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions judiciaires et la formule « soixante-dix fois sept fois » sont maintenues pour préserver la texture et les échos du grec. La ponctuation clarifie l’enchaînement sans résoudre les difficultés chronologiques du passage.
