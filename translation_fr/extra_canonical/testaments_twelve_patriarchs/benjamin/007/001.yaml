source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: fr
  text: 'C’est pourquoi, mes enfants, je vous le dis : fuyez le mal de Béliar, car il donne une épée à ceux qui lui obéissent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement la conclusion ou la conséquence introduite par l’expression grecque.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Traduction directe et naturelle de l’adresse affectueuse.
- source_word: φεύγετε
  choice: fuyez
  rationale: Conserve la force de l’impératif présent grec, qui appelle à se tenir loin du mal.
- source_word: τὴν κακίαν
  choice: le mal
  rationale: Κακία peut désigner la méchanceté ou le mal; « le mal » convient ici à la construction avec « de Béliar » sans en préciser excessivement la nuance.
- source_word: τοῦ Βελίαρ
  choice: de Béliar
  rationale: Conserve le nom propre traditionnel et l’ambiguïté du génitif, qui peut évoquer le mal provenant de Béliar ou lui appartenant.
- source_word: μάχαιραν
  choice: une épée
  rationale: Équivalent courant de μάχαιρα dans ce contexte; l’image de l’arme est maintenue sans interprétation ajoutée.
- source_word: τοῖς πειθομένοις αὐτόν
  choice: à ceux qui lui obéissent
  rationale: Le participe de πείθομαι suivi de l’accusatif exprime ici le fait de se laisser persuader par Béliar et de lui obéir; cette formulation française est claire et fidèle au contexte.
theological_decisions:
- issue: Nature du « mal de Béliar »
  choice: Conserver « le mal de Béliar »
  alternative: « la méchanceté de Béliar » ou « le mal qui vient de Béliar »
  rationale: Le génitif grec ne tranche pas explicitement entre possession, origine et association; la formulation retenue préserve cette tension.
- issue: Sens de l’épée donnée par Béliar
  choice: Maintenir l’image sans l’expliquer
  alternative: Préciser qu’il s’agit de violence, de châtiment ou de destruction
  rationale: Le verset ne définit pas la fonction symbolique ou concrète de l’épée; toute explicitation réduirait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle à l’oral comme à l’écrit. Aucun marqueur de note n’est nécessaire.
