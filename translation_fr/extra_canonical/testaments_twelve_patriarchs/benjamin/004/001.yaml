  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: fr
  text: 4.1 Voyez donc, mes enfants, la fin de l’homme bon. Imitez [dans le bien][a], à cause de sa compassion, afin que vous aussi, vous portiez des couronnes de gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots traduits par « dans le bien » sont placés entre crochets dans l’édition grecque utilisée ; leur formulation et leur lien exact avec le reste de la phrase sont incertains.
    reason: Signaler honnêtement l’état du texte source et préserver l’incertitude syntaxique sans la résoudre silencieusement.
lexical_decisions:
- source_word: Ἴδετε οὖν
  choice: Voyez donc
  rationale: Rend directement l’impératif et la particule conclusive, dans un français naturel.
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς τὸ τέλος
  choice: la fin de l’homme bon
  rationale: Conserve le sens premier de τέλος (« fin »), sans préciser s’il s’agit de sa mort, de son sort final ou de l’aboutissement de sa conduite.
- source_word: μιμήσασθε
  choice: Imitez-le
  rationale: Le pronom reprend naturellement « l’homme bon », objet implicite de l’exhortation grecque.
- source_word: ἐν ἀγαθῇ
  choice: dans le bien
  rationale: Reproduit prudemment la formule grecque transmise et son caractère quelque peu elliptique, plutôt que de la transformer en « sa bonté ».
- source_word: εὐσπλαγχνίαν
  choice: compassion
  rationale: Terme courant et digne qui exprime la profonde bienveillance envers autrui.
- source_word: στεφάνους δόξης φορέσητε
  choice: vous portiez des couronnes de gloire
  rationale: Préserve l’image concrète des couronnes ainsi que le pluriel du grec.
theological_decisions:
- issue: Rapport entre l’imitation, le bien et la compassion
  choice: « Imitez-le [dans le bien], en raison de sa compassion »
  alternative: « Imitez sa bonté et sa compassion »
  rationale: La traduction retenue n’ajoute pas un second objet à l’impératif et conserve la relation causale exprimée par διά, malgré son caractère interprétativement difficile.
- issue: Sens de τέλος
  choice: « la fin »
  alternative: « l’aboutissement » ou « le sort final »
  rationale: « La fin » maintient l’ambiguïté du grec entre terme de la vie, destinée finale et résultat observable.
translation_notes:
  register: Français international moderne, simple et solennel. L’adresse « mes enfants » et l’image des « couronnes de gloire » sont conservées. La légère étrangeté de « dans le bien » reflète une difficulté réelle du texte grec, explicitée en note.
