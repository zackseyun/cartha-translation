source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⸢Κἂν *μὴ βούλωνται περὶ αὐτοῦ εἰς καλά¹⁴, *οὗτος τὸ ἀγαθὸν ποιῶν¹⁵ νικᾷ τὸ κακόν, σκεπόμενος¹⁶ ὑπὸ τοῦ Θεοῦ¹⁷⸣. τοὺς †ἀδικοῦντας¹⁸ ἀγαπᾷ ὡς τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: fr
  text: Et même s’ils ne veulent pas son bien, lui, en faisant le bien, triomphe du mal, protégé par Dieu. Il aime ceux qui lui font du tort comme sa propre vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  choice: s’ils ne veulent pas son bien
  rationale: Rend naturellement l’intention hostile ou l’absence de bienveillance envers lui, sans alourdir le français par une formulation littérale.
- source_word: τὸ ἀγαθὸν ποιῶν
  choice: en faisant le bien
  rationale: Conserve le contraste lexical entre le bien accompli et le mal vaincu.
- source_word: νικᾷ τὸ κακόν
  choice: triomphe du mal
  rationale: Exprime clairement le sens de νικάω tout en gardant la portée morale de l’énoncé.
- source_word: σκεπόμενος
  choice: protégé
  rationale: Le participe évoque le fait d’être couvert, abrité ou protégé; « protégé » est naturel et suffisamment proche dans ce contexte.
- source_word: τοὺς ἀδικοῦντας
  choice: ceux qui lui font du tort
  rationale: Restitue le participe substantivé sans limiter l’injustice à une forme précise.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: comme sa propre vie
  rationale: ψυχή peut désigner l’âme, la personne ou la vie; ici, « sa propre vie » donne en français le sens idiomatique d’un amour égal à celui porté à soi-même.
theological_decisions:
- issue: Rapport entre l’action humaine et la protection divine
  choice: 'Maintien des deux éléments: il fait le bien et il est protégé par Dieu.'
  alternative: Présenter la protection divine comme la cause explicite de sa victoire.
  rationale: Le grec juxtapose le participe σκεπόμενος à l’action principale sans préciser davantage le lien logique; la traduction préserve cette tension.
- issue: Sens de ψυχή
  choice: « sa propre vie »
  alternative: « sa propre âme » ou « lui-même »
  rationale: « Vie » conserve une valeur possible de ψυχή et produit une comparaison naturelle, sans imposer une anthropologie particulière.
translation_notes:
  register: Français moderne, international et digne. La syntaxe garde l’opposition entre les intentions d’autrui et la conduite de l’homme bon. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
