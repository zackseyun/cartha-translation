base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: fr
  text: Si quelqu’un reçoit des honneurs, il ne l’envie pas ; si quelqu’un est riche, il ne le jalouse pas ; si quelqu’un est courageux, il fait son éloge ; il aime celui qui sait se maîtriser ; il a compassion du pauvre ; il partage la souffrance de celui qui est faible ; il craint Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: reçoit des honneurs
  rationale: Le passif évoque ici une personne honorée ou tenue en haute estime. Cette formulation est naturelle en français et évite l’ambiguïté moderne de « glorifié ».
- source_word: φθονεῖ
  choice: envie
  rationale: Rend directement l’idée d’éprouver de l’envie devant l’honneur accordé à autrui.
- source_word: ζηλοῖ
  choice: jalouse
  rationale: Préserve la proximité avec φθονεῖ tout en exprimant la jalousie suscitée par la richesse d’autrui.
- source_word: ἀνδρεῖος
  choice: courageux
  rationale: Désigne une personne vaillante ou courageuse, sans limiter le terme au sexe masculin.
- source_word: σώφρονα
  choice: celui qui sait se maîtriser
  rationale: σωφροσύνη réunit maîtrise de soi, mesure et bon sens ; cette expression rend clairement sa dimension éthique dans un français courant.
- source_word: ἐλεεῖ
  choice: a compassion
  rationale: Exprime une compassion active envers le pauvre, avec un registre digne et naturel.
- source_word: συμπάσχει
  choice: partage la souffrance
  rationale: Rend littéralement l’idée de souffrir avec quelqu’un, sans suggérer nécessairement qu’il éprouve exactement la même faiblesse.
- source_word: φοβεῖται
  choice: craint
  rationale: Traduction directe du verbe grec ; elle conserve le langage religieux de la crainte de Dieu.
theological_decisions:
- issue: Sens de τὸν Θεὸν φοβεῖται
  choice: il craint Dieu
  alternative: il révère Dieu
  rationale: « Craint Dieu » préserve l’expression biblique et la tension sémantique de φοβεῖται, qui peut inclure peur, respect et révérence, sans la réduire silencieusement à la seule vénération.
translation_notes:
  register: Français international moderne, fluide et digne. La série de propositions parallèles et les points-virgules du grec sont conservés. Les formulations épicènes « quelqu’un » et « celui qui » évitent d’ajouter une restriction masculine absente de la portée générale du passage.
