  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: fr
  text: Et il aime celui qui possède la grâce d’un esprit bon comme sa propre âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα χάριν ἀγαθοῦ πνεύματος
  choice: celui qui possède la grâce d’un esprit bon
  rationale: Rend directement la construction grecque et conserve l’ambiguïté de χάρις, qui peut évoquer la grâce, la faveur ou une qualité accordée, sans préciser indûment l’identité de l’esprit.
- source_word: ἀγαπᾷ
  choice: il aime
  rationale: Équivalent français naturel et fidèle du verbe grec, dans un registre digne et courant.
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: comme sa propre âme
  rationale: La préposition κατά exprime ici une comparaison ou une mesure; cette formulation maintient l’image sémitisante de l’âme tout en restant compréhensible.
theological_decisions:
- issue: Sens et référent de « ἀγαθοῦ πνεύματος »
  choice: un esprit bon
  alternative: l’Esprit bon / un bon caractère
  rationale: Les minuscules grecques ne déterminent pas une référence à l’Esprit divin, et le contexte fourni ne justifie pas de transformer « esprit » en « caractère ». La traduction conserve donc l’ambiguïté théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « comme sa propre âme » conserve volontairement l’expression ancienne et sa force affective plutôt que de la banaliser en « comme lui-même ».
