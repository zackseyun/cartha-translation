source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ¹⁰ ἀγαθὸς ⁹ἄνθρωπος⁹ οὐκ ἔχει σκοτεινὸν ὀφθαλμόν¹¹, ἐλεεῖ¹² γὰρ πάντας, κἂν *ἁμαρτωλοὶ ὦσιν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: fr
  text: 'Car l’homme bon n’a pas le regard sombre : il a compassion de tous, même s’ils sont pécheurs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: l’homme bon
  rationale: Rend directement l’expression grecque dans un français naturel et digne.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: le regard sombre
  rationale: Littéralement « un œil sombre » ; « le regard sombre » conserve l’image de l’œil tout en exprimant naturellement en français la disposition malveillante suggérée par le contexte.
- source_word: ἐλεεῖ
  choice: il a compassion de
  rationale: Exprime l’action de prendre autrui en pitié et de lui témoigner miséricorde, sans ajouter une action précise absente du grec.
- source_word: πάντας
  choice: tous
  rationale: Préserve la portée universelle du grec.
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: même s’ils sont pécheurs
  rationale: Reproduit directement la concession grecque sans en atténuer la portée morale.
theological_decisions:
- issue: Portée de la compassion envers les pécheurs
  choice: Conserver « tous, même s’ils sont pécheurs »
  alternative: Préciser que cette compassion implique le pardon ou l’approbation
  rationale: Le texte affirme la compassion universelle, mais ne précise ni ses modalités ni ses conséquences ; la traduction ne résout donc pas cette tension.
translation_notes:
  register: Français moderne international, simple et digne. Les deux propositions grecques liées par γάρ sont rendues par deux-points afin d’éviter la répétition lourde de « car » tout en gardant clairement le rapport explicatif.
