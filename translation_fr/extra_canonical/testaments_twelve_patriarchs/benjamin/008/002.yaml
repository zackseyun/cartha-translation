base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: fr
  text: Car l’esprit pur ne contracte aucune souillure au contact du fumier et de la boue ; au contraire, il refroidit l’un et l’autre[a] et en chasse la puanteur. De même, l’esprit pur, retenu au milieu des souillures de la terre, édifie plutôt[b], sans être lui-même souillé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « il refroidit l’un et l’autre ». L’image est obscure ; certaines traductions comprennent plutôt qu’il les repousse.
    reason: Signaler une formulation grecque sémantiquement difficile sans remplacer silencieusement le texte transmis par une conjecture plus fluide.
  - marker: b
    text: Le mot grec traduit par « édifie » est signalé comme incertain dans l’édition ; le sens exact de la phrase demeure obscur.
    reason: Préserver le crux textuel marqué dans la source et éviter de présenter une lecture incertaine comme assurée.
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: l’esprit pur
  rationale: Rend directement l’expression grecque tout en conservant sa portée morale et intérieure.
- source_word: μίασμα / μιασμοῖς / μιαίνεται
  choice: souillure / souillures / être souillé
  rationale: Maintient en français la répétition lexicale du grec et son image de contamination.
- source_word: κόπρου καὶ βόρβορον
  choice: fumier et boue
  rationale: « Fumier » rend κόπρος et « boue » rend βόρβορος sans atténuer le caractère concret de l’image.
- source_word: συνεχόμενος
  choice: retenu au milieu de
  rationale: Conserve l’idée d’être pris ou maintenu dans un environnement impur, sans préciser abusivement la nature de cette contrainte.
- source_word: ἀπελαύνει τὴν δυσωδίαν
  choice: en chasse la puanteur
  rationale: Expression française naturelle qui garde la force concrète du verbe et du nom grecs.
theological_decisions:
- issue: Rapport de l’esprit pur aux souillures terrestres
  choice: Conserver l’affirmation paradoxale selon laquelle il demeure sans souillure et « édifie » au milieu d’elles.
  alternative: Interpréter explicitement la phrase comme une doctrine de purification morale ou d’invulnérabilité spirituelle.
  rationale: Le texte formule une comparaison énigmatique sans en développer le mécanisme théologique ; la traduction ne doit pas imposer une explication confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « souillure » est volontaire afin de reproduire la cohésion lexicale du grec. Les deux difficultés majeures du texte transmis sont maintenues dans le corps du verset et explicitées en notes.
