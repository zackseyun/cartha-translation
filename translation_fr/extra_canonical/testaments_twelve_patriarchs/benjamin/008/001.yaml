source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: fr
  text: Mais vous, mes enfants, fuyez le mal, l’envie et la haine envers les frères, et attachez-vous à la bonté et à l’amour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε
  choice: fuyez
  rationale: L’impératif exprime l’idée de s’éloigner résolument ou de s’échapper; « fuyez » la rend avec force et naturel.
- source_word: κακίαν
  choice: la méchanceté
  rationale: Le terme désigne ici le mal moral ou la disposition mauvaise; « méchanceté » convient à l’énumération qui suit.
- source_word: φθόνον
  choice: la jalousie
  rationale: Le mot grec peut désigner l’envie malveillante; « jalousie » est courant et intelligible, tout en conservant cette nuance négative dans le contexte.
- source_word: μισαδελφίαν
  choice: la haine fraternelle
  rationale: Ce composé rare désigne la haine envers ses frères ou les membres de sa communauté; « haine fraternelle » conserve la forme condensée et le contraste implicite avec l’amour.
- source_word: προσκολλᾶσθε
  choice: attachez-vous
  rationale: Le verbe évoque une adhésion étroite et durable; « attachez-vous » restitue naturellement cette image.
- source_word: ἀγαθότητι
  choice: la bonté
  rationale: Équivalent direct et naturel de la qualité morale exprimée.
- source_word: ἀγάπῃ
  choice: l’amour
  rationale: Terme français large et digne qui préserve la portée non spécifiée du grec.
theological_decisions:
- issue: Portée de μισαδελφίαν
  choice: la haine fraternelle
  alternative: la haine de vos frères
  rationale: La formulation retenue préserve la concision du composé grec sans limiter explicitement « frères » aux seuls liens biologiques; l’expression peut viser la fraternité familiale ou communautaire.
translation_notes:
  register: Français moderne, clair et digne. La coordination et les tirets rendent l’explication de « méchanceté » lisible sans effacer l’ambiguïté syntaxique du grec quant au rapport précis entre le mal et les deux vices nommés.
