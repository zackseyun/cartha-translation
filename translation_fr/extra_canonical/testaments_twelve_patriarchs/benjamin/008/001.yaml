    issue: « la jalousie » pour φθόνος
    rationale: φθόνος désigne premièrement l’envie, souvent malveillante; « envie » est l’équivalent français le plus direct dans cette liste de vices.
  - severity: low
    issue: Tirets appositionnels autour de « la jalousie et la haine fraternelle »
    rationale: Le grec présente ces noms comme des objets coordonnés de « fuyez », sans signaler qu’ils définissent ou épuisent la κακία. Une simple énumération préserve mieux cette relation.
  - severity: low
    issue: « haine fraternelle » pour μισαδελφία
    rationale: L’expression française peut évoquer une haine qualifiée de fraternelle ou une haine entre frères. « haine envers les frères » exprime plus nettement la portée objective du composé grec tout en laissant ouverte l’identité précise des « frères ».
  revised_text: Mais vous, mes enfants, fuyez le mal, l’envie et la haine envers les frères, et attachez-vous à la bonté et à l’amour.
