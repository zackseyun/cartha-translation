lexical_decisions:
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: vous vous livrerez à la débauche sexuelle de Sodome
  rationale: La tournure française exprime clairement la conduite sexuelle condamnée tout en conservant l’allusion directe à Sodome et la force accusatrice de la construction grecque redoublée.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: vous périrez pour un peu de temps
  rationale: Cette formulation conserve l’étrange limitation temporelle du jugement, avant le renouvellement annoncé, sans la transformer en « bientôt ».
- source_word: ἀνανεωθήσεσθε
  choice: vous serez de nouveau renouvelés
  rationale: Le futur passif et l’idée explicite de renouvellement sont conservés, malgré une légère redondance voulue par le grec.
- source_word: ἐν μερίδι ὑμῶν
  choice: dans la part qui vous a été attribuée
  rationale: La formulation évoque naturellement le territoire reçu en partage par Benjamin sans réduire le sens au seul territoire.
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: le dernier sera plus glorieux que le premier
  rationale: Le contraste grec entre le dernier et le premier est maintenu sans préciser à leur place un référent que le texte laisse implicite.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: son salut
  rationale: La formule concise préserve aussi bien l’idée de salut que celle de délivrance accordée par le Très-Haut.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: lors de la visite d’un prophète unique
  rationale: « Visite » garde la valeur de visitation décisive d’ἐπισκοπή. « Unique » rend naturellement μονογενής en français, tandis que la note signale ses autres nuances possibles.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: élevé sur du bois
  rationale: La traduction conserve le mot concret ξύλον et l’ambivalence de l’expression au lieu de préciser « croix ».
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: la tenture déployée du temple
  rationale: Cette expression conserve le caractère inhabituel d’ἅπλωμα, lié à ce qui est étendu ou déployé, tout en restant intelligible en français.
- source_word: ἐκ τοῦ ᾅδου
  choice: du séjour des morts
  rationale: Cette traduction communique le sens ancien d’Hadès à un lectorat moderne sans l’assimiler automatiquement à l’enfer final.
- source_word: ταπεινὸς
  choice: humble
  rationale: « Humble » peut désigner à la fois l’abaissement de condition et l’humilité, ce qui préserve l’étendue sémantique du grec.
theological_decisions:
- issue: Présence des versets 3 à 5, placés entre crochets dans l’édition grecque
  choice: Les inclure dans le texte principal avec une note textuelle
  alternative: Les omettre comme expansion secondaire
  rationale: Ils figurent dans la source grecque fournie, mais leur statut distinct et leur incertitude dans la tradition doivent être signalés sans être dissimulés.
- issue: Sens de μονογενοῦς προφήτου
  choice: « d’un prophète unique », avec les autres possibilités en note
  alternative: « d’un prophète monogène » ou « d’un prophète engendré unique »
  rationale: « Unique » est naturel et lexicalement défendable en français moderne. La note conserve la portée théologique et l’ambiguïté du terme grec sans imposer une lecture christologique particulière.
- issue: Référent du « Seigneur » au verset 3
  choice: Conserver « le Seigneur sera outragé »
  alternative: Remplacer le Seigneur par le prophète, l’oint ou une autre désignation interprétative
  rationale: Le grec porte explicitement Κύριος. La traduction n’harmonise donc pas le référent avec une interprétation ultérieure.
- issue: Nature du bois au verset 3
  choice: Conserver « sur du bois »
  alternative: Traduire explicitement par « sur une croix »
  rationale: Le texte dit ξύλον, non σταυρός. La formulation littérale laisse subsister l’écho possible de l’arbre, du poteau ou de la croix sans trancher.
- issue: Hadès et châtiment final
  choice: Traduire par « séjour des morts » et expliquer le terme grec en note
  alternative: Traduire par « enfer »
  rationale: L’Hadès grec désigne d’abord le domaine des morts ; « enfer » introduirait ici une précision eschatologique absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible, avec une cadence prophétique sobre. Les expressions inhabituelles du grec sont conservées lorsqu’elles portent une ambiguïté réelle, puis éclairées en note. Les désignations théologiquement chargées ne sont ni harmonisées ni développées selon une tradition confessionnelle.
