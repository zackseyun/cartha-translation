base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: fr
  text: '**Testament de Benjamin 9**


    **1.** Je vous dis aussi, d’après les paroles d’Hénoch le juste, que vous vous livrerez à la débauche sexuelle de Sodome et que vous périrez pour un peu de temps. Puis vous serez renouvelés, et le royaume du Seigneur ne sera pas au milieu de vous. **2.** Pourtant, dans la part qui vous a été attribuée, se trouvera le temple de Dieu. Le dernier sera plus glorieux que le premier ; là seront rassemblées les douze tribus et toutes les nations, jusqu’à ce que le Très-Haut envoie son salut lors de la visitation d’un prophète unique[b].


    **3.** Il entrera dans le premier temple et, là, le Seigneur sera outragé et élevé sur du bois[c]. **4.** La tenture du temple[d] se déchirera, et l’Esprit de Dieu passera aux nations, comme un feu répandu. **5.** Après être remonté du séjour des morts[e], il passera de la terre au ciel. Je sais combien il sera humble sur la terre et combien il sera glorieux dans le ciel.[a]


    [a] Les versets 3 à 5 sont incertains dans la tradition manuscrite et sont souvent considérés comme une addition postérieure. Ils sont traduits ici parce qu’ils figurent dans le texte grec fourni.


    [b] Le grec *monogenês* peut aussi signifier « seul de son espèce » ou « unique » ; dans certains contextes, il a été compris au sens d’« unique engendré ».


    [c] « Élevé sur du bois » traduit littéralement l’expression grecque, qui peut évoquer le fait d’être élevé sur un arbre ou sur un poteau de bois.


    [d] Le grec emploie ici un terme inhabituel désignant ce qui est déployé ou étendu dans le temple ; il peut s’agir du voile du temple.


    [e] Littéralement « remonté de l’Hadès », c’est-à-dire du séjour des morts, sans que cela désigne nécessairement le lieu du châtiment final.'
  philosophy: optimal-equivalence
