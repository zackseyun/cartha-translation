review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour mieux rendre des formulations grecques précises : λέγω (« Je vous dis »), le mouvement de l’Esprit « aux nations », et l’image passive du feu « répandu ». Le texte maintient à juste titre les ambiguïtés de ξύλον, ἅπλωμα, μονογενοῦς et du référent de « Seigneur ».'
  naturalness: Quelques formulations du projet sont lourdes ou redondantes en français moderne, notamment « de nouveau renouvelés » et « la tenture déployée ». La révision conserve une cadence prophétique sobre et naturelle.
  terminology: « Débauche sexuelle », « séjour des morts », « le Seigneur », « élevé sur du bois » et « prophète unique » sont des choix défendables. La note sur monogenês est reformulée pour éviter « engendré unique », qui n’est pas idiomatique en français.
  issues:
  - severity: medium
    issue: « Vous serez de nouveau renouvelés »
    rationale: ἀνανεωθήσεσθε exprime le renouvellement ; la répétition française « de nouveau renouvelés » est inutilement lourde et ne reproduit pas une répétition formelle du grec.
  - severity: low
    issue: « La tenture déployée »
    rationale: ἅπλωμα désigne bien ce qui est étendu, mais « tenture déployée » sonne redondant en français. « La tenture du temple » garde le sens sans identifier de façon indue l’objet au voile.
  - severity: low
    issue: « passera vers les nations, comme un feu qui se répand »
    rationale: μεταβήσεται ἐπὶ τὰ ἔθνη se rend plus naturellement par « passera aux nations », et ἐκχυνόμενον est plus exactement « répandu » que « qui se répand ».
  - severity: low
    issue: Note lexicale sur monogenês
    rationale: « Engendré unique » n’est pas une expression française recevable. La note doit présenter les possibilités lexicales sans créer un calque opaque.
