  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵. 2. Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις. 3. Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵. 4. Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. 5. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
