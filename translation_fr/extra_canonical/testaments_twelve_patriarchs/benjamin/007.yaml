base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007.yaml
  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
translation:
  language: fr
  text: '**7** C’est pourquoi, mes enfants, je vous le dis : fuyez le mal de Béliar[a], car il donne une épée à ceux qui lui obéissent.


    **2** Or, l’épée est la mère de sept maux. D’abord, l’esprit conçoit sous l’influence de Béliar. Le premier est l’envie, le deuxième la destruction, le troisième la détresse, le quatrième le châtiment divin[b], le cinquième le dénuement, le sixième le trouble et le septième la dévastation.


    **3** C’est pourquoi Caïn aussi fut livré par Dieu à sept actes de vengeance. En effet, tous les cent ans, le Seigneur lui infligea un fléau.


    **4** Il souffre pendant deux cents ans et, dans sa neuf-centième année, il est voué à la dévastation[c]. Car, à cause d’Abel, son frère, il fut jugé par tous ces maux, tandis que Lémek le fut soixante-dix fois sept fois.


    **5** Car, jusqu’à la fin des temps, ceux qui ressemblent à Caïn par une telle envie et une telle haine de leur frère seront punis par un jugement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec porte « Béliar », forme du nom souvent connue sous la forme « Belial ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec est rare et peut désigner une calamité attribuée à une intervention divine. Une autre tradition textuelle est parfois comprise comme portant « captivité ».
    reason: textual_variant
  - marker: c
    text: 'La chronologie est difficile : le texte mentionne successivement un fléau tous les cent ans, deux cents ans de souffrance, puis la neuf-centième année. Ces nombres sont conservés sans harmonisation avec la Genèse.'
    reason: textual_difficulty
lexical_decisions:
- source_word: Βελίαρ
  choice: Béliar
  rationale: Conserve la forme propre au témoin grec, avec l’accentuation naturelle en français, sans la normaliser silencieusement en « Belial ».
- source_word: μάχαιρα
  choice: épée
  rationale: Rend clairement l’image d’une arme et permet de préserver la métaphore selon laquelle elle engendre sept maux.
- source_word: πειθομένοις
  choice: ceux qui lui obéissent
  rationale: Dans cette exhortation morale, le participe désigne ceux qui se laissent persuader par Béliar au point de se soumettre à lui.
- source_word: διάνοια
  choice: esprit
  rationale: Désigne ici la faculté intérieure où se forme le mal; « esprit » est idiomatique en français tout en maintenant la portée morale et psychologique.
- source_word: συλλαμβάνει
  choice: conçoit
  rationale: Préserve la métaphore de la conception introduite par l’expression « mère de sept maux ».
- source_word: φθόνος
  choice: envie
  rationale: Terme moral précis pour le désir hostile suscité par le bien d’autrui.
- source_word: ἀπώλεια
  choice: destruction
  rationale: Exprime l’issue ruineuse sans lui imposer un sens théologique technique.
- source_word: θλῖψις
  choice: détresse
  rationale: Rend la souffrance accablante dans un français actuel et digne.
- source_word: θεηλασία
  choice: châtiment divin
  rationale: Le mot imprimé désigne une calamité ou une visitation attribuée à la puissance divine; cette traduction suit la leçon fournie plutôt que de la remplacer par αἰχμαλωσία, « captivité ».
- source_word: ἔνδεια
  choice: dénuement
  rationale: Exprime le manque et la pauvreté avec la gravité requise par cette liste de calamités.
- source_word: ταραχή
  choice: trouble
  rationale: Préserve le sens d’agitation et de désordre sans préciser indûment s’il est intérieur ou collectif.
- source_word: ἐρήμωσις / ἐρημοῦται
  choice: dévastation / est voué à la dévastation
  rationale: Maintient le lien lexical entre le septième mal et le sort final de Caïn.
- source_word: μισαδελφία
  choice: haine de leur frère
  rationale: Déplie en français naturel le composé grec désignant la haine fraternelle.
theological_decisions:
- issue: Relation entre l’action de Béliar et la responsabilité humaine
  choice: « l’esprit conçoit sous l’influence de Béliar » et « ceux qui lui obéissent »
  alternative: « Béliar fait concevoir l’esprit » ou « ceux qu’il persuade »
  rationale: La formulation conserve à la fois l’influence de Béliar et l’adhésion humaine, sans transformer le passage en affirmation déterministe.
- issue: Nature du quatrième mal
  choice: « le châtiment divin » d’après θεηλασία
  alternative: « la captivité » d’après une conjecture αἰχμαλωσία
  rationale: Le texte grec fourni porte θεηλασία. La traduction ne substitue pas une leçon conjecturale plus harmonieuse, mais signale que le terme est rare et susceptible d’une compréhension plus large.
- issue: Chronologie et peines de Caïn
  choice: Conserver les cent, deux cents et neuf cents ans ainsi que les sept actes de vengeance
  alternative: Harmoniser les nombres avec le récit de la Genèse ou atténuer leur précision
  rationale: La chronologie du témoin est difficile, mais ses données numériques doivent rester visibles afin de préserver la tension avec les traditions bibliques connues.
- issue: Comparaison entre Caïn et Lémek
  choice: « tandis que Lémek le fut soixante-dix fois sept fois »
  alternative: Expliciter l’objet du jugement ou harmoniser avec Genèse 4.24
  rationale: Le grec est elliptique. La traduction garde cette ellipse et le contraste numérique sans ajouter une explication absente du texte.
- issue: Portée du jugement final
  choice: « jusqu’à la fin des temps »
  alternative: « pour toujours » ou « durant le siècle »
  rationale: ἕως τοῦ αἰῶνος peut évoquer la durée indéfinie ou l’horizon de l’âge. Cette formulation française maintient la portée eschatologique sans définir techniquement la durée de la peine.
translation_notes:
  register: Français international moderne, clair et soutenu. Les répétitions, les nombres et les métaphores de la conception, de l’épée et de la dévastation sont maintenus. Les versets transmis dans la source grecque fournie sont tous traduits; le matériau placé avant « C’est pourquoi » dans la consultation anglaise n’a pas été ajouté, puisqu’il ne figure pas dans l’extrait grec de ce chapitre.
