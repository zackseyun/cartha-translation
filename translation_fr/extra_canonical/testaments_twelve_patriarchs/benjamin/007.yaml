review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire principalement pour le quatrième mal : θεηλασία est une leçon manifestement problématique dans cette liste et « châtiment divin » ne correspond pas au sens lexical usuel du mot ni ne rend convenablement l’incertitude. La traduction « captivité », attestée par la tradition parallèle signalée dans l’audit anglais, est recevable à condition d’être explicitement signalée. La formulation de la durée au v. 5 doit aussi éviter de fixer ἕως τοῦ αἰῶνος à « la fin des temps ».'
  naturalness: Le français est généralement clair et soutenu. « Voici les sept maux » rend plus naturellement l’introduction de la liste tout en conservant l’image de la conception. « À chaque centième année » est plus proche du grec que « tous les cent ans ».
  terminology: « Béliar », « épée », « esprit », « envie », « dénuement », « trouble » et « dévastation » conviennent. « Captivité » est préférable ici pour le quatrième élément, avec une note de critique textuelle. « Jusqu’à l’âge » conserve l’ambiguïté de αἰών sans imposer une eschatologie déterminée.
  issues:
  - severity: high
    issue: Le quatrième mal est traduit « châtiment divin ».
    rationale: La leçon imprimée θεηλασία est textuellement anormale dans ce catalogue et ne signifie pas normalement « châtiment divin ». L’audit anglais indique une tradition parallèle αἰχμαλωσία (« captivité »). Il faut adopter cette restitution prudente et documenter l’incertitude plutôt que produire un sens lexicalement insuffisamment fondé.
  - severity: medium
    issue: « jusqu’à la fin des temps » surinterprète ἕως τοῦ αἰῶνος.
    rationale: L’expression peut viser l’âge/siècle ou une durée indéfinie. « jusqu’à l’âge » conserve volontairement cette ambiguïté.
  - severity: low
    issue: « tous les cent ans » est moins exact que la formulation distributive grecque.
    rationale: κατὰ ... ἑκατοστὸν ἔτος exprime plus directement « à chaque centième année ».
  revised_text: '**7** C’est pourquoi, mes enfants, je vous le dis : fuyez le mal de Béliar[a], car il donne une épée à ceux qui lui obéissent.


    **2** Or, l’épée est la mère de sept maux. D’abord, l’esprit conçoit par Béliar. Voici les sept maux : le premier est l’envie, le deuxième la destruction, le troisième la détresse, le quatrième la captivité[b], le cinquième le dénuement, le sixième le trouble et le septième la dévastation.


    **3** C’est pourquoi Caïn aussi fut livré par Dieu à sept actes de vengeance. En effet, à chaque centième année, le Seigneur lui infligeait un fléau.


    **4** Il souffre pendant deux cents ans et, dans sa neuf-centième année, il est dévasté[c]. Car, à cause d’Abel, son frère, il fut jugé par tous les maux, tandis que Lémek le fut soixante-dix fois sept fois.


    **5** Car, jusqu’à l’âge, ceux qui ressemblent à Caïn par une telle envie et une telle haine de leur frère seront punis par un jugement.'
  revised_footnotes:
  - marker: a
    text: Le témoin grec porte « Béliar », forme du nom souvent connue sous la forme « Belial ».
    reason: lexical_alternative
  - marker: b
