base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: fr
  text: Car si quelqu’un insulte un homme saint, il se repent ; en effet, le saint prend en pitié ceux qui l’injurient et garde le silence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: insulte
  rationale: Le verbe exprime ici l’outrage ou l’insulte ; « insulte » rend naturellement le sens dans ce contexte sans introduire l’idée plus forte de violence physique.
- source_word: ἄνδρα ὅσιον
  choice: un homme saint
  rationale: Cette formulation conserve la référence masculine explicite de ἄνδρα et rend ὅσιον par un terme français courant et digne.
- source_word: μετανοεῖ
  choice: il se repent
  rationale: Le verbe μετανοέω désigne un changement intérieur qui, dans ce contexte moral, est justement exprimé par « se repentir ».
- source_word: ἐλεεῖ
  choice: prend en pitié
  rationale: Cette expression rend l’attitude de compassion et de miséricorde indiquée par ἐλεέω dans un français naturel.
- source_word: τῶν λοιδορούν
  choice: ceux qui l’injurient
  rationale: Le participe désigne ceux qui adressent des injures ou des paroles outrageantes ; le complément « l’ » est explicité naturellement d’après le contexte.
- source_word: σιωπᾷ
  choice: garde le silence
  rationale: Cette tournure française restitue clairement l’action continue ou caractéristique exprimée par le présent grec.
theological_decisions:
- issue: Sujet implicite de μετανοεῖ
  choice: Le pronom « il » renvoie à celui qui insulte l’homme saint.
  alternative: Comprendre que l’homme saint change d’attitude ou se repent.
  rationale: Le sujet non exprimé se comprend le plus naturellement comme celui du verbe ὑβρίσει dans la proposition conditionnelle. La proposition suivante change explicitement de sujet avec ὁ ὅσιος, « le saint ».
- issue: Portée morale de ὅσιος
  choice: Traduction par « saint » sans préciser une appartenance ou un statut religieux particulier.
  alternative: « homme pieux » ou « fidèle »
  rationale: « Saint » préserve la qualité morale et religieuse du grec tout en évitant d’introduire une catégorie confessionnelle absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure causale répétée du grec est conservée au moyen de « Car » puis « en effet », tout en évitant une répétition française pesante.
