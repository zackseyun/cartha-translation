base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: fr
  text: Si vous faites le bien, les esprits impurs s’enfuiront loin de vous, et les animaux sauvages auront peur de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  choice: faites le bien
  rationale: Rend naturellement en français le participe exprimant une conduite active et habituelle orientée vers le bien.
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: les esprits impurs
  rationale: Équivalent courant et fidèle de l’expression grecque, sans ajouter d’interprétation démonologique.
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: fuiront loin de vous
  rationale: Le verbe et la préposition expriment ensemble l’éloignement par la fuite; «loin de vous» est idiomatique et conserve cette force.
- source_word: τὰ θηρία
  choice: les bêtes sauvages
  rationale: Dans ce contexte, θηρία désigne des animaux sauvages plutôt que les animaux en général.
- source_word: φοβηθήσονται ὑμᾶς
  choice: auront peur de vous
  rationale: Formulation moderne et directe qui reproduit le sens transitif de l’expression grecque.
theological_decisions:
- issue: Portée de καί devant «les esprits impurs»
  choice: même les esprits impurs
  alternative: les esprits impurs aussi
  rationale: Dans l’enchaînement, καί peut avoir une valeur intensive («même»), comme le comprend la couche anglaise auditée; cette lecture souligne l’étendue de l’effet sans modifier l’affirmation théologique.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la structure conditionnelle et le parallélisme entre la fuite des esprits impurs et la peur des bêtes sauvages.
