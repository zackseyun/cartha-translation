  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: fr
  text: Car là où il y a la crainte des bonnes œuvres et la lumière dans l’esprit, les ténèbres s’enfuient loin de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: la crainte des bonnes œuvres
  rationale: Cette formulation conserve le génitif grec et son ambiguïté inhabituelle, sans en atténuer ni en réinterpréter le sens.
- source_word: φῶς εἰς διάνοιαν
  choice: la lumière dans l’intelligence
  rationale: « Intelligence » désigne ici la faculté intérieure de comprendre et de penser; « dans » rend naturellement en français la présence de la lumière au sein de cette faculté.
- source_word: τὸ σκότος ἀποδιδράσκει ἀπʼ αὐτοῦ
  choice: les ténèbres s’enfuient loin de lui
  rationale: Le pluriel français « les ténèbres » est idiomatique pour le singulier collectif grec; « de lui » préserve le pronom masculin du texte source plutôt que de lui imposer un antécédent.
theological_decisions:
- issue: Rapport entre la crainte et les bonnes œuvres
  choice: Conserver « la crainte des bonnes œuvres »
  alternative: Interpréter comme « la révérence qui accompagne les bonnes œuvres » ou « la crainte qui produit de bonnes œuvres »
  rationale: Le grec est grammaticalement compact et sémantiquement difficile; la traduction ne doit pas résoudre cette tension sans appui textuel.
translation_notes:
  register: Français moderne, digne et accessible. La structure proverbiale du grec est conservée, ainsi que l’étrangeté signifiante de « la crainte des bonnes œuvres ».
