  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: fr
  text: Et même si quelqu’un trahit un juste, le juste prie. Même s’il est abaissé pour un peu de temps, il ne tarde pas à reparaître plus rayonnant, comme Joseph, mon frère, l’est devenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον / ὁ δίκαιος
  choice: un juste / le juste
  rationale: Le substantif « juste » restitue directement le grec et conserve sa portée morale sans ajouter « homme » ou « âme », absents du texte établi.
- source_word: προδώσει
  choice: trahit
  rationale: « Trahir » rend naturellement l’idée de livrer ou de trahir une personne dans ce contexte.
- source_word: ταπεινωθῇ
  choice: est abaissé
  rationale: La tournure passive préserve le fait que le juste subit l’humiliation ou l’abaissement, sans préciser l’agent.
- source_word: μετ’ οὐ πολύ
  choice: il ne tarde pas à
  rationale: Cette expression française naturelle rend le sens temporel « peu après / avant longtemps ».
- source_word: φαιδρότερος ἀναφαίνεται
  choice: reparaître plus rayonnant
  rationale: « Reparaître » exprime le retour visible indiqué par ἀναφαίνεται, tandis que « plus rayonnant » conserve le comparatif de φαιδρότερος.
theological_decisions:
- issue: Réaction du juste à la trahison
  choice: « le juste prie » sans complément
  alternative: « le juste prie pour celui qui l’a trahi »
  rationale: Le grec ne précise ni l’objet ni le bénéficiaire de la prière; la traduction maintient cette indétermination.
- issue: Nature de l’abaissement
  choice: « est abaissé »
  alternative: « s’humilie »
  rationale: Le passif grec décrit un abaissement subi plutôt qu’une démarche volontaire d’humilité.
translation_notes:
  register: Français moderne, sobre et digne. La répétition « un juste, le juste » est conservée parce qu’elle structure explicitement la phrase grecque. Aucun élément provenant de la variante anglaise antérieure (« âme », « insulte ») n’est introduit, puisqu’il ne figure pas dans le texte grec fourni.
