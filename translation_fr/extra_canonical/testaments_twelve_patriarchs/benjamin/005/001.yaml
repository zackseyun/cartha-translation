source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: fr
  text: Si donc vous avez, vous aussi, de bonnes dispositions, même les gens mauvais vivront en paix avec vous. Les débauchés, saisis de honte devant vous[a], se tourneront vers le bien. Quant aux gens cupides, non seulement ils renonceront à leur passion, mais ils donneront aussi aux personnes dans la détresse les biens liés à leur cupidité qu’ils possédaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « amenés par vous à éprouver de la honte » ou « ayant honte à cause de vous ».'
    reason: Le rapport exact entre αἰδεσθέντες et ὑμᾶς admet plusieurs nuances proches.
  - marker: b
    text: 'Littéralement : « les choses de la cupidité qu’ils avaient ». La formule peut désigner des biens associés à leur avidité, sans préciser comment ils les avaient obtenus.'
    reason: La tournure grecque τὰ τῆς πλεονεξίας ἃ εἶχον est condensée et ne dit pas explicitement que les biens ont été acquis par cupidité.
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  choice: de bonnes dispositions
  rationale: Exprime naturellement en français une orientation intérieure bonne, plutôt que le calque peu idiomatique « un bon esprit ».
- source_word: οἱ πονηροὶ ἄνθρωποι
  choice: les gens mauvais
  rationale: Rend simplement la qualification morale du grec sans durcir inutilement en « méchants » comme identité absolue.
- source_word: οἱ ἄσωτοι
  choice: les débauchés
  rationale: Ἄσωτος désigne des personnes à la conduite dissolue ou prodigue; « débauchés » convient ici au contexte moral, tout en évitant le sens juridique de « hors-la-loi ».
- source_word: αἰδεσθέντες ὑμᾶς
  choice: saisis de honte devant vous
  rationale: Conserve la relation exprimée par l’accusatif ὑμᾶς sans trancher excessivement entre la honte ressentie en leur présence et la honte provoquée par leur exemple.
- source_word: οἱ πλεονεκτοῦντες
  choice: les gens cupides
  rationale: Rend le comportement de recherche avide du gain dans un français courant et moralement précis.
- source_word: τοῦ πάθους
  choice: cette passion
  rationale: Le démonstratif français rattache naturellement la passion à la cupidité qui vient d’être mentionnée, sans effacer le terme fort πάθος.
- source_word: τοῖς θλιβομένοις
  choice: aux personnes dans la détresse
  rationale: Restitue la souffrance ou l’affliction sans préciser indûment qu’elle résulte nécessairement d’une oppression.
theological_decisions:
- issue: Effet des bonnes dispositions sur les personnes mauvaises
  choice: 'Conserver l’enchaînement affirmatif du texte : elles vivront en paix, auront honte et se tourneront vers le bien.'
  alternative: Atténuer ces résultats en possibilités (« pourront vivre », « pourront se tourner »).
  rationale: Les futurs grecs présentent ces conséquences directement; les modaliser importerait une réserve absente du texte.
- issue: Nature de πάθος chez les cupides
  choice: « cette passion », comprise contextuellement comme la cupidité
  alternative: « leur mauvais désir » ou « leur cupidité »
  rationale: Cette formulation garde la force et la relative généralité de πάθος tout en assurant la cohérence du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement segmentée pour la lisibilité, sans modifier la progression logique du grec. « Vous » est pluriel, conformément à ὑμεῖς et ὑμῶν.
