lexical_decisions:
- source_word: τέλος
  choice: aboutissement
  rationale: Le terme peut désigner la fin, le résultat ou l’accomplissement d’une conduite. « Aboutissement » conserve cette amplitude dans l’exhortation à considérer la destinée de l’homme bon.
- source_word: μιμήσασθε
  choice: imitez-le
  rationale: L’impératif appelle directement les enfants de Benjamin à prendre l’homme bon pour modèle. Le pronom explicite en français le référent immédiat sans modifier le sens.
- source_word: εὐσπλαγχνία
  choice: compassion
  rationale: Le mot exprime une profonde tendresse miséricordieuse. « Compassion » est naturel en français moderne et convient au contexte éthique.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: le regard obscurci
  rationale: Cette formulation conserve l’image grecque tout en restant idiomatique. Une note signale le sens possible de « mauvais œil », associé à l’envie ou à la malveillance.
- source_word: ἐλεεῖ
  choice: fait preuve de compassion
  rationale: La tournure exprime une attitude active de miséricorde envers autrui et permet de rendre naturellement les deux occurrences du passage.
- source_word: νικᾷ τὸ κακόν
  choice: triomphe du mal
  rationale: Rend directement le contraste moral entre faire le bien et vaincre le mal sans accent militaire excessif.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: protégé par Dieu
  rationale: Le participe évoque le fait d’être couvert ou mis à l’abri. « Protégé » transmet clairement cette image de sauvegarde divine.
- source_word: ἀδικοῦντας
  choice: ceux qui lui font du tort
  rationale: La formulation rend l’injustice personnelle subie par l’homme bon et s’accorde avec l’appel à aimer ceux qui l’offensent.
- source_word: δοξάζηται
  choice: reçoit de l’honneur
  rationale: Dans cette liste de relations sociales, le passif désigne vraisemblablement l’honneur accordé à quelqu’un plutôt qu’une glorification cultuelle.
- source_word: σώφρονα
  choice: celui qui sait se maîtriser
  rationale: Le contexte est un catalogue de vertus. Cette expression moderne met en valeur la retenue morale portée par σώφρων.
- source_word: συμπάσχει
  choice: partage la souffrance
  rationale: 'Le composé indique davantage qu’un simple sentiment de sympathie : il présente une solidarité effective avec la personne faible.'
- source_word: χάριν ἀγαθοῦ πνεύματος
  choice: la grâce d’un esprit bon
  rationale: La traduction reste proche de la construction grecque et n’identifie pas explicitement l’« esprit » à l’Esprit saint, identification que le texte ne tranche pas à lui seul.
theological_decisions:
- issue: Sens de l’image « regard obscurci »
  choice: Conserver l’image dans le texte principal
  alternative: Traduire directement par « mauvais œil » ou « regard envieux »
  rationale: Le grec permet une connotation d’envie ou de malveillance, mais ne l’explicite pas. La traduction préserve donc l’image et présente l’interprétation possible en note.
- issue: Développement éthique du verset 5 dans certains témoins
  choice: Traduire uniquement la phrase attestée dans le grec fourni
  alternative: Ajouter les actions consistant à défendre celui qui craint le Seigneur, aider celui qui aime Dieu et ramener celui qui rejette le Très-Haut
  rationale: Ces éléments figurent dans la couche anglaise et dans une tradition textuelle plus développée, mais ils ne sont pas présents dans le texte grec source fourni pour ce verset. Ils ne sont donc pas intégrés au corps de la traduction.
- issue: Référent de πνεύματος au verset 5
  choice: « un esprit bon » en minuscule
  alternative: « l’Esprit bon » ou « le Saint-Esprit »
  rationale: L’absence d’article et la formulation grecque ne permettent pas d’imposer une identification pneumatologique précise. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exhortatif et les parallélismes du catalogue de vertus sont conservés. Les images anthropologiques du grec, notamment « comme sa propre âme », ne sont pas réduites à des paraphrases interprétatives.
