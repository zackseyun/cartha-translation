  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: fr
  text: '**Testament de Benjamin 4**


    **1.** Voyez donc, mes enfants, l’aboutissement de l’homme bon[a]. Imitez l’homme bon, à cause de sa compassion, afin que vous aussi, vous portiez des couronnes de gloire.


    **2.** En effet, l’homme bon n’a pas le regard obscurci[b], car il fait preuve de compassion envers tous, même s’ils sont pécheurs.


    **3.** Même si l’on ne lui veut aucun bien, il triomphe du mal en faisant le bien, protégé par Dieu. Il aime ceux qui lui font du tort comme sa propre âme.


    **4.** Si quelqu’un reçoit de l’honneur, il ne l’envie pas ; si quelqu’un s’enrichit, il n’en est pas jaloux ; si quelqu’un est courageux, il le loue. Il aime celui qui sait se maîtriser, fait preuve de compassion envers le pauvre, partage la souffrance du faible et craint Dieu.


    **5.** Quant à celui qui possède la grâce d’un esprit bon, il l’aime comme sa propre âme[c].


    [a] La couche OCR contient, avant ce verset, des lignes concernant « l’agneau de Dieu » et la mort de l’innocent pour les impies. Ce matériau, textuellement difficile et apparemment déplacé par rapport à l’ouverture cohérente de ce chapitre, n’est pas inclus dans la traduction.


    [b] Ou : « un mauvais œil », expression pouvant désigner une disposition envieuse ou malveillante.


    [c] Certains témoins présentent ici une liste de vertus plus développée. Le texte traduit suit la forme brève du grec fourni.'
  philosophy: optimal-equivalence
