  naturalness: Le registre est moderne, international et soutenu sans être archaïque. « De bonnes dispositions », « les esprits impurs » et « les bêtes sauvages » sont naturels. Au verset 3, « là où se trouvent ... » était un peu lourd et l’antécédent de « s’enfuient » restait moins explicite ; « là où il y a ... les ténèbres s’enfuient loin de là » est plus idiomatique.
  terminology: Les choix pour ἄσωτοι (« les débauchés »), πλεονεκτοῦντες (« ceux qui sont avides »), ἀκάθαρτα πνεύματα (« les esprits impurs »), ὑβρίσει (« outrage ») et μετανοεῖ (« change d’attitude ») sont défendables et ne surdéterminent pas le texte. La note sur la crainte des bonnes œuvres maintient correctement l’ambiguïté du génitif.
