base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: fr
  text: '1. Si donc vous aussi avez de bonnes dispositions, même les gens mauvais vivront en paix avec vous, et les débauchés[a], remplis de honte devant vous, reviendront à ce qui est bon. Ceux qui sont avides ne renonceront pas seulement à leur passion, mais donneront aussi aux personnes dans la détresse les biens provenant de leur avidité[b] qu’ils possédaient.


    2. Si vous faites le bien, même les esprits impurs fuiront loin de vous, et les bêtes sauvages auront peur de vous.


    3. Car là où il y a de la crainte liée aux bonnes œuvres[c] et de la lumière dans l’intelligence, les ténèbres s’enfuient loin de là.


    4. En effet, si quelqu’un outrage un homme saint, il change d’attitude[d] ; car l’homme saint a compassion de ceux qui l’insultent et garde le silence.


    5. Et si quelqu’un trahit un juste, le juste prie. Même s’il est abaissé pour un peu de temps, il ne tarde pas à apparaître plus rayonnant, comme le devint Joseph, mon frère[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dissolus », « ceux qui vivent sans retenue ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les choses de l’avidité » ; on peut aussi comprendre « les profits de leur avidité » ou « ce qu’ils avaient acquis par avidité ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque est difficile. Elle peut désigner la révérence associée aux bonnes œuvres ou la crainte produite par une conduite bonne.
    reason: alternative_reading
  - marker: d
    text: Le verbe grec peut aussi se traduire par « il se repent ».
    reason: lexical_alternative
  - marker: e
    text: L’histoire de Joseph illustre cet abaissement temporaire suivi d’une réhabilitation éclatante. Voir Genèse 37 ; 39–45.
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: dispositions
  rationale: Dans l’exhortation, le terme désigne l’orientation intérieure, à la fois mentale et morale. « De bonnes dispositions » est naturel en français et évite de réduire le sens à l’intellect.
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: vivront en paix avec vous
  rationale: Cette formulation rend la relation durable exprimée par le verbe et la préposition μετά.
- source_word: ἄσωτοι
  choice: les débauchés
  rationale: Le mot vise des personnes moralement dissolues ou vivant sans retenue. « Débauchés » maintient cette idée sans lui attribuer précisément le sens d’« hors-la-loi ».
- source_word: αἰδεσθέντες
  choice: remplis de honte devant vous
  rationale: Le participe exprime une honte ressentie en présence de personnes dont la conduite est bonne.
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: reviendront à ce qui est bon
  rationale: « Reviendront » conserve la nuance de retour possible dans ἐπιστρέφω, tandis que « ce qui est bon » rend l’expression substantivée.
- source_word: πλεονεκτοῦντες
  choice: ceux qui sont avides
  rationale: Le participe caractérise des personnes dominées par le désir d’avoir davantage, éventuellement aux dépens d’autrui.
- source_word: τοῦ πάθους
  choice: à leur passion
  rationale: πάθος désigne ici l’impulsion intérieure associée à l’avidité. « Passion » en préserve la dimension morale et psychologique.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: les biens provenant de leur avidité qu’ils possédaient
  rationale: La tournure grecque est condensée. Cette traduction reste proche du texte tout en indiquant naturellement le lien entre les biens et l’avidité, sans préciser indûment comment ils ont été obtenus.
- source_word: θλιβομένοις
  choice: aux personnes dans la détresse
  rationale: Le participe couvre largement l’affliction et la pression subies, sans limiter le sens à l’oppression ou à la persécution.
- source_word: ἀκάθαρτα πνεύματα
  choice: les esprits impurs
  rationale: Expression française consacrée et claire pour des êtres spirituels associés à l’impureté.
- source_word: φόβος ἀγαθῶν ἔργων
  choice: la crainte liée aux bonnes œuvres
  rationale: Le génitif grec est difficile. « Liée aux » garde volontairement ouverte la question de savoir si la crainte accompagne les bonnes œuvres ou en résulte.
- source_word: ὑβρίσει
  choice: outrage
  rationale: Le verbe peut désigner un traitement insolent, insultant ou violent. « Outrage » conserve cette force sans imposer la seule violence physique.
- source_word: μετανοεῖ
  choice: il change d’attitude
  rationale: Le contexte décrit le revirement de l’auteur de l’outrage devant la réaction miséricordieuse du saint. La formulation maintient le sens de changement intérieur sans imposer d’emblée le vocabulaire religieux du repentir.
- source_word: φαιδρότερος
  choice: plus rayonnant
  rationale: Le comparatif évoque éclat, joie ou splendeur. « Plus rayonnant » convient à la réhabilitation de Joseph sans réduire le terme à une émotion.
theological_decisions:
- issue: Sens de μετανοεῖ au verset 4
  choice: il change d’attitude
  alternative: il se repent
  rationale: Le verbe peut avoir le sens théologique de « se repentir », mais il décrit immédiatement ici un changement chez celui qui outrage l’homme saint. La traduction choisie préserve ce revirement tout en signalant l’autre possibilité en note.
- issue: Interprétation de φόβος ἀγαθῶν ἔργων au verset 3
  choice: la crainte liée aux bonnes œuvres
  alternative: la révérence pour les bonnes œuvres ; la crainte produite par les bonnes œuvres
  rationale: La relation du génitif est ambiguë. Le texte principal ne tranche pas entre une révérence associée aux bonnes actions et une crainte qu’elles inspirent.
- issue: Sujet et objet au verset 5
  choice: si quelqu’un trahit un juste, le juste prie
  alternative: si quelqu’un livre une âme juste et outrage une âme juste, l’homme juste prie
  rationale: Le grec fourni ne contient qu’une proposition avec προδώσει avant « le juste prie ». La répétition anglaise de l’insulte n’est pas appuyée par ce texte grec et n’est donc pas importée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement exhortatif du grec sans reproduire ses tours les plus lourds. Les ambiguïtés significatives de φόβος ἀγαθῶν ἔργων et μετανοεῖ sont conservées ou signalées. Les marqueurs [a] à [e] figurent tous dans le texte principal.
