source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καταφιλήσας δὲ αὐτοὺς¹⁰ εἶπεν¹¹. Ὥσπερ¹² Ἰσαὰκ *ἐτέχθη τῷ Ἀβραὰμ ἐν γήρει αὐτοῦ¹³, οὕτως κἀγὼ τῷ¹⁴ Ἰακώβ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: fr
  text: 'Après les avoir embrassés, il dit : « De même qu’Isaac naquit à Abraham dans sa vieillesse, moi aussi, je naquis à Jacob. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας
  choice: Après les avoir embrassés
  rationale: Le participe aoriste exprime ici une action antérieure à « il dit » ; « embrasser » rend naturellement le geste affectueux du verbe composé.
- source_word: ἐτέχθη
  choice: naquit
  rationale: Le passif grec de τίκτω se rend idiomatiquement en français par « naître », tout en préservant le parallèle avec la naissance de Benjamin.
- source_word: ἐν γήρει αὐτοῦ
  choice: dans sa vieillesse
  rationale: Traduction directe et naturelle de l’expression indiquant qu’Abraham était âgé lors de la naissance d’Isaac.
- source_word: οὕτως κἀγώ
  choice: moi aussi
  rationale: κἀγώ combine « et » et « moi » dans une comparaison corrélative ; « moi aussi » restitue clairement le parallèle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif et maintient le parallélisme des deux naissances. La relation dative « à Abraham / à Jacob » est conservée, car elle exprime sobrement la filiation sans ajouter d’élément absent du grec.
