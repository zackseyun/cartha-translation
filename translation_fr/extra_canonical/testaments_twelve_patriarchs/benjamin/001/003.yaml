revisions:
- from: Comme Rachel, ma mère, était morte en me mettant au monde, je n’avais pas de lait ; c’est donc Balla, sa servante, qui m’a allaité.
  to: Puisque Rachel, ma mère, mourut en me mettant au monde, je n’eus pas de lait ; je fus donc allaité par Balla, son esclave.
  rationale: La révision corrige la relation temporelle entre la mort de Rachel et la naissance de Benjamin, rend plus directement la perspective du verbe « téter » et explicite avec sobriété le statut de Bilha/Balla. Aucun ajout interprétatif ni note n’est nécessaire.
