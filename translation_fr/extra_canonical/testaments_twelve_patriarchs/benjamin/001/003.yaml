  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her servant-girl.
translation:
  language: fr
  text: Puisque Rachel, ma mère, mourut en me mettant au monde, je n’eus pas de lait ; je fus donc allaité par Balla, son esclave.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδή
  choice: Comme
  rationale: Introduit naturellement en français la cause exprimée par la conjonction grecque.
- source_word: τέθνηκε γεννῶσά με
  choice: était morte en me mettant au monde
  rationale: Rend l’état résultant du parfait et la simultanéité du participe, dans un français naturel.
- source_word: γάλα οὐκ ἔσχον
  choice: je n’avais pas de lait
  rationale: Conserve l’expression concrète du grec, qui signifie que le nourrisson n’avait pas de lait maternel à sa disposition.
- source_word: Βαλλάν
  choice: Balla
  rationale: Forme française traditionnelle du nom biblique correspondant à Bilhah.
- source_word: τὴν παιδίσκην αὐτῆς
  choice: sa servante
  rationale: « Servante » exprime le statut subordonné de παιδίσκη sans imposer une précision juridique que le terme ne tranche pas à lui seul dans ce contexte.
- source_word: ἐθήλασα
  choice: qui m’a allaité
  rationale: Le grec actif signifie littéralement que Benjamin a tété Balla ; la formulation française causative exprime clairement et naturellement qu’elle fut sa nourrice.
