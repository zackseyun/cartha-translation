  text: Διαθήκη Βενιαμὴν τοῦ ιβ´ υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. I. Ἀντίγραφον λόγων² Βενιαμήν³, ὧν⁴ διέθετο⁵ *τοῖς υἱοῖς⁶ αὐτοῦ⁷, ζήσας⁸ *ἔτη ἑκατὸν εἴκοσι πέντε⁹.
