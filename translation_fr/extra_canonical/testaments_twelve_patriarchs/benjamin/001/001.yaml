- from: 'Testament de Benjamin, douzième fils de Jacob et de Rachel


    1 Voici une copie des paroles de Benjamin, qu’il transmit à ses fils comme testament, après avoir vécu cent vingt-cinq ans.'
  to: 'Testament de Benjamin, douzième fils de Jacob et de Rachel


