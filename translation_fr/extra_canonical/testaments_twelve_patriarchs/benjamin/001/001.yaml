  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/001.yaml
  text: The Testament of Benjamin, the twelfth son of Jacob and Rachel. The Copy of the Words of Benjamin, which he set in order for his sons, after he had lived one hundred and twenty-five years.
translation:
  language: fr
  text: 'Testament de Benjamin, douzième fils de Jacob et de Rachel


    1 Copie des paroles de Benjamin, qu’il établit pour ses fils, après avoir vécu cent vingt-cinq ans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans le titre, le terme désigne les dernières volontés ou exhortations attribuées à Benjamin; « Testament » est à la fois exact et conforme au genre de l’œuvre.
- source_word: Ἀντίγραφον λόγων
  choice: une copie des paroles
  rationale: Cette formulation conserve explicitement l’idée d’une copie écrite (ἀντίγραφον) et rend λόγων dans son sens courant de « paroles ».
- source_word: διέθετο
  choice: transmit … comme testament
  rationale: Le moyen de διατίθημι peut évoquer le fait de disposer de quelque chose, d’établir des prescriptions ou de faire un testament. Cette traduction naturelle maintient ici la portée testamentaire sans réduire le verbe à une simple mise en ordre.
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  choice: après avoir vécu cent vingt-cinq ans
  rationale: Le participe aoriste est rendu par une proposition temporelle indiquant que ces paroles viennent au terme de la vie mentionnée.
theological_decisions:
- issue: Portée testamentaire de διέθετο
  choice: « qu’il transmit à ses fils comme testament »
  alternative: « qu’il établit pour ses fils » ou « qu’il mit en ordre pour ses fils »
  rationale: Le contexte et le titre favorisent une portée testamentaire, mais la formulation retenue évite d’y importer une notion juridique moderne trop précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le titre est distingué du premier paragraphe. « Voici » introduit naturellement la notice de copie sans modifier son contenu substantiel.
