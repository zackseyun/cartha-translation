  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/005.yaml
  text: For my father loved Rachel exceedingly, and he prayed to see two sons from her.
translation:
  language: fr
  text: Car mon père aimait très profondément Rachel et priait de voir naître deux fils d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σφόδρα
  choice: profondément
  rationale: Rend l’intensité de l’adverbe (« extrêmement, vivement ») dans un français naturel appliqué à l’amour.
- source_word: ηὔχετο
  choice: priait
  rationale: Le verbe peut désigner la prière ou le vœu; dans ce contexte, « priait » conserve naturellement l’orientation religieuse sans préciser indûment le contenu comme un simple souhait.
- source_word: ἰδεῖν
  choice: avoir la joie de voir
  rationale: « Voir » peut ici exprimer le fait de vivre assez longtemps ou d’obtenir de contempler la naissance de ces fils; cette formulation reste idiomatique tout en maintenant l’image de la vue.
- source_word: ἐξ αὐτῆς
  choice: nés d’elle
  rationale: Explicite en français le rapport de filiation exprimé littéralement par « d’elle ».
theological_decisions:
- issue: Portée de ηὔχετο
  choice: priait
  alternative: souhaitait / faisait le vœu
  rationale: Le contexte permet la prière, le souhait ou le vœu. « Priait » correspond à la lecture la plus directe retenue par le texte de consultation, sans ajouter de destinataire absent du grec.
translation_notes:
  register: Français moderne, fluide et digne. La coordination simple du grec est conservée, tandis que « avoir la joie de voir » évite une tournure française raide et exprime naturellement l’attente de deux fils issus de Rachel.
