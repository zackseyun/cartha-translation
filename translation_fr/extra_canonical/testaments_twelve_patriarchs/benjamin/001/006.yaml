  text: Because of this I was called Benjamin, which means son of days.
translation:
  language: fr
  text: C’est pourquoi je fus appelé Benjamin[a], ce qui signifie « fils des jours ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec explique ici Benjamin par « fils des jours ». Le nom hébreu Benjamin signifie habituellement « fils de la droite » ou « fils du sud ».
    reason: Signaler que l’explication donnée par le récit diffère du sens hébreu généralement reconnu, sans corriger le texte source.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement en français le lien causal exprimé par le grec.
- source_word: ἐκλήθην
  choice: je fus appelé
  rationale: Conserve le passif aoriste et le registre narratif du texte.
- source_word: υἱὸς ἡμερῶν
  choice: fils des jours
  rationale: Traduit littéralement l’explication propre au texte grec sans la remplacer par l’étymologie hébraïque habituelle du nom Benjamin.
