  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: fr
  text: En effet, Rachel resta stérile pendant douze ans après avoir donné naissance à Joseph. Elle pria le Seigneur en jeûnant et, après être devenue enceinte, elle me mit au monde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: resta stérile
  rationale: Exprime naturellement en français l’état de stérilité durant la période indiquée, sans suggérer qu’il commença nécessairement à ce moment-là.
- source_word: μετὰ τὸ τεκεῖν τὸν Ἰωσήφ
  choice: après avoir donné naissance à Joseph
  rationale: Rend clairement la construction temporelle et le verbe τεκεῖν dans un français courant et digne.
- source_word: μετὰ νηστείας
  choice: en jeûnant
  rationale: Rattache explicitement le jeûne à la prière, conformément à sa position dans le grec, plutôt qu’à la conception.
- source_word: συλλαβοῦσα
  choice: après être devenue enceinte
  rationale: Préserve la séquence circonstancielle du participe aoriste sans ajouter que la conception aurait eu lieu pendant le jeûne.
- source_word: τέτοκέ με
  choice: elle me mit au monde
  rationale: Rend l’accompli grec dans un récit naturel à la première personne.
theological_decisions:
- issue: Rapport entre le jeûne, la prière et la conception
  choice: Le jeûne accompagne la prière; la conception est ensuite mentionnée dans une proposition distincte.
  alternative: « ayant conçu dans le jeûne » ou « devenue enceinte en jeûnant »
  rationale: La syntaxe grecque place μετὰ νηστείας avec προσηύξατο. Rien n’impose grammaticalement de rattacher le jeûne à συλλαβοῦσα; ce rattachement ajouterait une précision absente du texte.
- issue: Désignation divine sans article dans πρὸς Κύριον
  choice: « le Seigneur »
  alternative: « vers le Seigneur »
  rationale: En français biblique moderne, « prier le Seigneur » transmet naturellement le sens de la préposition et du titre sans surinterprétation confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. Deux phrases évitent une période trop lourde tout en conservant l’enchaînement causal et temporel du grec. Aucun marqueur de note n’est requis.
