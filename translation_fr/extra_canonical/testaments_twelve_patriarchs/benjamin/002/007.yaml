lexical_decisions:
- source_word: Μὴ λέγετε
  choice: Ne dites pas
  rationale: Rend naturellement en français l’impératif présent négatif adressé à plusieurs personnes.
- source_word: ἃ ἐποιήσατέ μοι
  choice: ce que vous m’avez fait
  rationale: Traduction directe de la proposition relative, en conservant la portée personnelle de μοι.
- source_word: ἀλλʼ οὕτως λέξατε
  choice: mais parlez ainsi
  rationale: Préserve l’opposition et la manière indiquée par οὕτως sans ajouter de contenu implicite.
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: comme je l’ai expliqué à Benjamin
  rationale: Suit la construction grecque sans ajouter un pronom objet absent du texte source; « expliquer à » reste compréhensible en français et maintient l’indétermination de ce qui a été expliqué.
