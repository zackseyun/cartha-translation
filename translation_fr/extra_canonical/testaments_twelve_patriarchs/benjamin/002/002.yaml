source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ λέγει μοι· Ναί, ἀδελφέ¹⁶. καὶ ὅτε¹⁷ ἐξέδυσάν με τὸν χιτῶνά μου δέδωκάν με τοῖς Ἰσμαηλίταις· καὶ δέδωκάν μοι περίζωμα, καὶ φραγγελλώσαντες εἰπόν μοι τρέχειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/002.yaml
  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: fr
  text: 'Et il me dit : « Oui, mon frère. Et lorsqu’ils m’eurent dépouillé de ma tunique, ils me livrèrent aux Ismaélites ; puis ils me donnèrent un pagne et, après m’avoir fouetté, ils m’ordonnèrent de courir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφέ
  choice: mon frère
  rationale: Le vocatif grec signifie littéralement « frère » ; l’ajout naturel du possessif en français rend l’adresse fraternelle sans en modifier le sens.
- source_word: ἐξέδυσάν με τὸν χιτῶνά μου
  choice: ils m’eurent dépouillé de ma tunique
  rationale: Cette formulation conserve l’action de retirer le vêtement et rend χιτών par « tunique », terme clair et historiquement approprié.
- source_word: δέδωκάν με τοῖς Ἰσμαηλίταις
  choice: ils me livrèrent aux Ismaélites
  rationale: Pour une personne remise à des tiers, « livrer » est plus idiomatique que « donner » tout en préservant l’agent pluriel et le destinataire explicite.
- source_word: περίζωμα
  choice: pagne
  rationale: Le mot désigne un vêtement entourant la taille ; « pagne » est naturel et précis en français courant.
- source_word: φραγγελλώσαντες
  choice: après m’avoir fouetté
  rationale: Le participe exprime une action antérieure ; « fouetter » restitue directement l’idée de flagellation sans alourdir la phrase.
- source_word: εἰπόν μοι τρέχειν
  choice: ils m’ordonnèrent de courir
  rationale: Le grec dit littéralement qu’ils lui dirent de courir ; dans ce contexte coercitif, « ordonnèrent » en rend naturellement la force.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction maintient le sujet pluriel indéterminé dans toute la séquence, conformément au grec, et ne transfère pas l’action aux Ismaélites.
