  source_fidelity: 'Le texte français suit fidèlement la succession et les agents du grec : le sujet pluriel indéterminé demeure en place, Joseph est bien « livré aux Ismaélites », puis reçoit un περίζωμα, est fouetté et reçoit l’ordre de courir. « Tunique », « livrèrent », « pagne » et « m’ordonnèrent de courir » rendent correctement les termes et la syntaxe pertinents sans ajouter d’agent ou de circonstance.'
  naturalness: La formulation est fluide, claire et d’un registre narratif digne en français international moderne. Le passé antérieur (« lorsqu’ils m’eurent dépouillé ») s’accorde correctement avec le passé simple qui suit et convient à ce style de récit.
  terminology: « Ismaélites » est la forme française usuelle. « Tunique » rend justement χιτών ; « pagne » est un équivalent naturel de περίζωμα dans ce contexte ; « fouetté » rend adéquatement le participe φραγγελλώσαντες. L’adresse « mon frère » est naturelle pour le vocatif grec.
