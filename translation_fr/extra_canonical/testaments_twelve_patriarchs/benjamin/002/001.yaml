  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: fr
  text: 'Lorsque je vins en Égypte, mon frère me reconnut et me dit : « Ils ont enduit ta tunique de sang », dirent-ils. « Reconnais si c’est la tunique. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec présente ici une succession abrupte de paroles rapportées : « me dit », puis « dirent-ils ». La dernière phrase dit littéralement : « Reconnais si c’est la tunique. »'
    reason: Signaler sans la résoudre la transition inhabituelle entre les locuteurs et préserver la formulation directe de l’impératif grec.
lexical_decisions:
- source_word: ἐγνώρισέν
  choice: me reconnut
  rationale: Le verbe signifie ici reconnaître ou identifier quelqu’un; « me reconnut » est direct et naturel en français.
- source_word: ἔφυραν
  choice: ont taché
  rationale: Le verbe évoque le fait de souiller ou d’enduire la tunique avec du sang; « taché » restitue clairement l’action dans ce contexte.
- source_word: Ἐπίγνωθι
  choice: Vérifie
  rationale: L’impératif demande d’examiner afin d’identifier; « Vérifie » rend cette nuance plus naturellement que le littéral « reconnais ».
- source_word: χιτών
  choice: tunique
  rationale: Terme courant et historiquement approprié pour le vêtement désigné.
theological_decisions:
- issue: Identification du frère
  choice: mon frère
  alternative: Joseph, mon frère
  rationale: Le grec ne nomme pas Joseph; la traduction conserve donc la formulation explicite de la source sans ajouter une identification contextuelle.
- issue: Identification de la tunique dans la dernière phrase
  choice: la tunique
  alternative: la tunique de ton fils
  rationale: Le texte grec fourni porte seulement « la tunique » et ne contient pas « de ton fils »; l’ajout narrativement attendu n’est pas importé.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif de ce testament ancien. La syntaxe légèrement abrupte du discours rapporté est conservée, avec une note pour en avertir le lecteur.
