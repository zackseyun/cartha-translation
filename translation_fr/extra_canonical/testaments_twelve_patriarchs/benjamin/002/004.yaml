source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ οὕτως οἱ μέτοχοι αὐτοῦ φοβηθέντες ἐν †ἀνέσει με κατέσχεν†.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/004.yaml
  text: And thus his companions, being afraid, †kept me at ease†.
translation:
  language: fr
  text: Et ainsi, pris de peur, ses compagnons me retinrent en me laissant en paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette proposition est altéré ou incertain. Littéralement, il se rapproche de : « ses compagnons, ayant eu peur, me retint dans le repos ». Une autre forme de la tradition comprend que ses compagnons le vendirent aux Ismaélites.'
    reason: Signaler les marques critiques entourant la proposition, l’anomalie d’accord du verbe et l’existence de l’autre lecture attestée, sans masquer l’incertitude dans le texte principal.
lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: ses compagnons
  rationale: « Μέτοχοι » désigne ceux qui sont associés à quelqu’un ou partagent son action; « compagnons » convient naturellement au contexte sans préciser davantage leur statut.
- source_word: φοβηθέντες
  choice: pris de peur
  rationale: Le participe aoriste passif de φοβέομαι exprime ici la peur éprouvée par les compagnons; cette tournure française est claire et idiomatique.
- source_word: ἐν ἀνέσει
  choice: en me laissant en paix
  rationale: Ἄνεσις peut évoquer le relâchement, le répit ou le repos. La formulation retenue restitue cette idée dans un français naturel, sans lui donner le sens plus précis d’une libération.
- source_word: με κατέσχεν
  choice: me retinrent
  rationale: Κατέχω signifie notamment retenir ou garder. Le pluriel français s’accorde avec « ses compagnons », malgré le singulier verbal transmis par le texte grec, qui fait partie des difficultés du passage.
theological_decisions:
- issue: Identification éventuelle des personnes auxquelles Benjamin aurait été vendu
  choice: Ne pas introduire les Ismaélites dans le corps du texte
  alternative: « ses compagnons me vendirent aux Ismaélites »
  rationale: Le grec fourni ne contient ni « vendre » ni « Ismaélites ». Même si une autre forme de la tradition peut soutenir cette lecture narrative, l’introduire ici remplacerait le texte-source transmis plutôt que d’en traduire prudemment la formulation difficile.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la tension entre l’idée de retenir et celle d’accorder du répit, tout en évitant le calque peu naturel « me gardèrent à l’aise ».
