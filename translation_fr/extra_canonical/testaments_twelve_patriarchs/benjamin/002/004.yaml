review_pass:
  verdict: revise
  source_fidelity: Le texte principal doit rendre la leçon grecque fournie, qui porte « compagnons », « ayant eu peur », puis une séquence explicitement marquée comme corrompue ou incertaine. « Me retinrent en me laissant en paix » transforme ἐν ἀνέσει (« dans le repos / le répit ») en une action secondaire et introduit une tension interprétative inutile avec « retinrent ». « Me gardèrent au repos » reflète plus directement, et plus lisiblement, les deux éléments conservés de la séquence difficile. L’anomalie du verbe grec au singulier doit rester signalée en note, non être présentée comme une forme française littérale normale.
  naturalness: « Ainsi, ses compagnons, pris de peur, me gardèrent au repos » est du français moderne, sobre et compréhensible. Il évite le tour peu naturel « me retinrent en me laissant en paix » tout en ne prétendant pas résoudre la corruption textuelle.
  terminology: « Compagnons » convient à μέτοχοι. « Pris de peur » rend correctement φοβηθέντες. « Au repos » rend ἀνέσει avec davantage de précision que « en paix », sans imposer le sens de libération. Ni une vente ni les Ismaélites ne figurent dans le grec cité; ils ne doivent donc pas apparaître dans le texte principal.
  issues:
  - severity: medium
    issue: Rendu interprétatif de ἐν ἀνέσει
    rationale: « En me laissant en paix » ne correspond pas directement à la construction « en/dans le repos, le relâchement, le répit » et fait de l’expression une concession à « me retinrent ». Le texte difficile doit être rendu de façon plus proche et signalé comme tel.
  - severity: low
    issue: Note formulée comme un littéral français fautif
    rationale: « Ses compagnons ... me retint » est utile pour signaler le singulier grec, mais ne doit pas être présenté sans explication comme une traduction littérale française. Il faut distinguer le singulier verbal transmis de la traduction française, qui s’accorde avec son sujet pluriel.
  - severity: medium
    issue: Référence à la vente aux Ismaélites insuffisamment cadrée
    rationale: Cette lecture n’est pas dans le texte grec fourni. Elle peut être mentionnée uniquement comme lecture d’une autre forme textuelle, sans l’utiliser pour lever l’incertitude de la leçon traduite.
  revised_text: Ainsi, ses compagnons, pris de peur, me gardèrent au repos.[a]
  revised_footnotes:
  - marker: a
    text: 'La séquence grecque est marquée comme corrompue ou incertaine. Elle contient littéralement l’idée : « ses compagnons, ayant eu peur, me retint dans le repos / le répit »; le verbe transmis est au singulier malgré « ses compagnons ». Une autre forme de la tradition porte plutôt qu’ils le vendirent aux Ismaélites.'
    reason: Signaler la corruption textuelle, l’anomalie d’accord du grec et l’existence de l’autre lecture, sans la substituer à la leçon traduite.
  revision_rationale: La révision conserve la leçon grecque attestée dans le corps du texte, avec une formulation française naturelle qui respecte l’association difficile de « garder/retenir » et de « repos/répit ». La note documente l’incertitude textuelle et l’autre lecture traditionnelle sans importer « vendirent aux Ismaélites » dans la traduction de ce texte-source.
