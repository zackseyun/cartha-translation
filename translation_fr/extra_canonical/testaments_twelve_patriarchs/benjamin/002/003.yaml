source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Εἰς δὲ ἐξ αὐτῶν ῥάβδῳ μαστίζων με, ὑπήντησεν αὐτῷ λέων καὶ ἀνεῖλεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: fr
  text: Et l’un d’eux, tandis qu’il me frappait avec un bâton, fut rencontré par un lion, qui le tua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ
  choice: avec un bâton
  rationale: « Bâton » rend naturellement l’instrument avec lequel l’homme frappe, sans préciser indûment sa forme.
- source_word: μαστίζων
  choice: frappait
  rationale: Le verbe peut évoquer des coups ou une flagellation ; avec ῥάβδῳ, « frappait avec un bâton » est clair et idiomatique.
- source_word: ὑπήντησεν
  choice: se trouva face à
  rationale: Cette formulation conserve l’idée de rencontre tout en rendant naturelle en français la construction où l’homme a pour sujet grammatical et le lion pour agent de la rencontre.
- source_word: ἀνεῖλεν
  choice: tua
  rationale: Rend directement le sens de mise à mort dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition explicative de « lion » dans la couche anglaise n’est pas nécessaire en français, le pronom relatif « qui » ayant un antécédent non ambigu.
