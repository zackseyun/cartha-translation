lexical_decisions:
- source_word: ἔννοιαι
  choice: pensées
  rationale: Rend naturellement l’idée de pensées, dispositions ou intentions intérieures sans en préciser indûment la nuance.
- source_word: γένωνται ἐν ὑμῖν
  choice: soient en vous
  rationale: Conserve la formulation grecque et son caractère exhortatif, tout en restant intelligible en français moderne.
- source_word: οἱ λόγοι οὗτοι
  choice: ces paroles
  rationale: Dans ce contexte de discours rapporté, «paroles» convient mieux que le plus général «mots».
- source_word: εἰς καρδίαν
  choice: dans le cœur
  rationale: Préserve l’image biblique du cœur comme siège de la pensée et de la vie intérieure.
