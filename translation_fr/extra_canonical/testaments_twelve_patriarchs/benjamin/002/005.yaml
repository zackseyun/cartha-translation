  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/005.yaml
  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: fr
  text: Et eux-mêmes ne mentirent pas en disant cela, car il voulait me cacher les actes de nos frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο
  choice: ne mentirent pas
  rationale: Rend directement l’aoriste grec au pluriel, sans substituer Joseph comme sujet.
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: Conserve le pronom intensif et le contraste implicite du grec.
- source_word: ταῦτα λέγοντες
  choice: en disant cela
  rationale: Formulation française naturelle qui préserve le rapport circonstanciel du participe grec.
- source_word: κρύπτειν ἀπʼ ἐμοῦ
  choice: me cacher
  rationale: Expression idiomatique française pour l’idée de tenir quelque chose caché à Benjamin.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: les actes de nos frères
  rationale: « Actes » restitue ἔργα sans préciser indûment leur caractère moral; « nos frères » conserve la première personne du pluriel.
