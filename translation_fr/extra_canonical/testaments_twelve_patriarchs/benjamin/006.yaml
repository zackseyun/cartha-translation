base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: fr
  text: '**Testament de Benjamin 6**


    **1** Le dessein de l’homme bon n’est pas au pouvoir de l’esprit d’égarement de Béliar[a], car l’ange de la paix guide son âme.


    **2** Il ne porte pas un regard passionné sur les choses périssables et n’amasse pas de richesse pour satisfaire son amour du plaisir[b].


    **3** Il ne trouve pas sa joie dans le plaisir, ne fait pas de peine à son prochain, ne se rassasie pas de luxe et ne se laisse pas égarer par les vagabondages des yeux. Car le Seigneur est sa part.


    **4** Le bon dessein n’accepte ni la gloire ni le déshonneur venant des humains ; il ne connaît ni tromperie, ni mensonge, ni querelle, ni injure. Car le Seigneur habite en cet homme, illumine son âme, et celui-ci se réjouit à l’égard de tous en tout temps.


    **5** La pensée bonne n’a pas deux langues : pour bénir et pour maudire, pour insulter et pour honorer, pour la tranquillité et pour l’agitation, pour l’hypocrisie et pour la vérité, pour la pauvreté et pour la richesse. Elle a plutôt envers tous une seule disposition, sincère et pure.


    **6** Elle n’a ni regard ni écoute doubles[c] ; car, dans tout ce que cet homme fait, dit ou voit, il sait que le Seigneur examine son âme.


    **7** Il purifie sa pensée afin de n’être condamné ni par les humains ni par Dieu. De même, les œuvres de Béliar sont doubles et ne comportent aucune simplicité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Béliar » reproduit la forme du nom dans le témoin grec ; beaucoup de lecteurs connaissent ce personnage sous le nom de « Bélial ». Le « dessein » peut aussi désigner ici la résolution ou l’intention arrêtée.
    reason: Signaler la forme grecque du nom propre et l’étendue sémantique de διαβούλιον.
  - marker: b
    text: Plusieurs mots et propositions des versets 2 à 5 présentent des incertitudes dans la transmission du texte grec. La traduction suit ici le texte édité, sans masquer son caractère parfois heurté.
    reason: Rendre visibles les nombreuses marques éditoriales d’incertitude et de reconstruction dans cette section.
  - marker: c
    text: 'Littéralement : « Elle n’a ni vue ni ouïe doubles. » Cette image prolonge l’opposition entre la duplicité et la simplicité qui structure le passage.'
    reason: Préserver l’image grecque tout en expliquant la formulation légèrement développée du texte principal.
lexical_decisions:
- source_word: διαβούλιον
  choice: dessein
  rationale: Le mot désigne ici l’orientation intérieure et résolue de l’homme bon. « Dessein » conserve à la fois les nuances d’intention et de résolution, sans le réduire à un simple conseil.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: l’esprit d’égarement de Béliar
  rationale: Cette formulation respecte l’enchaînement des génitifs et conserve la portée morale et spirituelle de πλάνη, qui peut évoquer l’égarement, l’erreur ou la tromperie.
- source_word: ἐμπαθῶς
  choice: d’un regard passionné
  rationale: L’adverbe évoque un désir qui asservit, sans se limiter nécessairement à la convoitise sexuelle. La formulation française garde cette amplitude.
- source_word: τὰ φθαρτά
  choice: les choses périssables
  rationale: La traduction préserve le contraste entre les réalités passagères et le Seigneur, présenté comme la véritable part de l’homme bon.
- source_word: εἰς φιληδονίαν
  choice: pour satisfaire son amour du plaisir
  rationale: Cette expression rend plus précisément que le simple « pour le plaisir » l’idée d’une richesse amassée en vue de l’attachement aux jouissances.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: les vagabondages du regard
  rationale: La formulation conserve l’image d’un regard instable et entraîné par le désir, tout en restant naturelle en français contemporain.
- source_word: μερὶς
  choice: part
  rationale: « Part » maintient la résonance scripturaire d’un bien véritable attribué à quelqu’un, sans imposer la notion plus précise d’héritage.
- source_word: δύο γλώσσας
  choice: deux langues
  rationale: L’image concrète de la duplicité est conservée, puis explicitée par la série d’oppositions du texte.
- source_word: ἐπισκέπτει
  choice: examine
  rationale: Dans le contexte de la condamnation par Dieu et par les humains, le verbe exprime ici le regard attentif et évaluateur du Seigneur plutôt qu’une simple visite.
- source_word: ἀπλότητα
  choice: simplicité
  rationale: Le terme s’oppose directement au caractère « double » des œuvres de Béliar. « Simplicité » désigne ici l’unité et l’absence de duplicité, non la naïveté.
theological_decisions:
- issue: Rapport entre la souveraineté morale de l’homme bon et l’action de Béliar
  choice: « n’est pas au pouvoir de l’esprit d’égarement de Béliar »
  alternative: « ne tombe pas dans la tromperie de Béliar »
  rationale: L’image de la « main », c’est-à-dire du pouvoir, appartient au grec et affirme une sphère d’emprise sans expliquer doctrinalement le mécanisme de cette protection.
- issue: Action du Seigneur sur l’âme
  choice: « le Seigneur examine son âme »
  alternative: « le Seigneur veille sur son âme »
  rationale: Le contexte immédiat évoque la possibilité d’être condamné. « Examine » conserve cette tension judiciaire sans exclure la sollicitude divine que le verbe peut également suggérer.
- issue: Simplicité opposée aux œuvres doubles de Béliar
  choice: Conserver « simplicité » comme terme moral positif
  alternative: Paraphraser par « sincérité » ou « intégrité »
  rationale: Le grec oppose explicitement διπλᾶ à ἀπλότης. Le maintien de cette opposition préserve l’architecture théologique et rhétorique du chapitre.
- issue: Étendue du texte traduit
  choice: S’en tenir aux sept versets présents dans la source grecque fournie
  alternative: Ajouter la continuation figurant dans la couche anglaise de consultation
  rationale: La continuation anglaise après la dernière phrase sur la simplicité ne figure pas dans le texte grec fourni. Puisque la traduction doit partir des données originales, elle n’est pas intégrée au corps du texte.
translation_notes:
  register: Français international actuel, digne et accessible. Les images structurantes — la part, les deux langues, la vue et l’ouïe doubles, la simplicité — sont conservées. Les répétitions rhétoriques restent perceptibles, tandis que les séries grecques sont légèrement explicitées lorsque le français l’exige. Le masculin renvoie à « l’homme bon » du premier verset, sans ajout doctrinal.
