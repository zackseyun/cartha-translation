revisions:
- from: '**Testament de Benjamin 6**


    **1** Le dessein de l’homme bon n’est pas au pouvoir de l’esprit d’égarement de Béliar[a], car l’ange de la paix guide son âme.


    **2** Il ne porte pas un regard passionné sur les choses périssables et n’amasse pas de richesses pour satisfaire son amour du plaisir[b].


    **3** Il ne trouve pas sa joie dans le plaisir, ne fait pas de peine à son prochain, ne se gorge pas de luxe et ne se laisse pas égarer par les vagabondages du regard. Car le Seigneur est sa part.


    **4** Le bon dessein ne se laisse gagner ni par la gloire ni par le déshonneur venant des humains ; il ne connaît ni tromperie, ni mensonge, ni querelle, ni injure. Car le Seigneur habite en cet homme, illumine son âme, et celui-ci se réjouit à l’égard de tous en tout temps.


    **5** La pensée bonne n’a pas deux langues : l’une pour bénir et l’autre pour maudire, l’une pour insulter et l’autre pour honorer, l’une pour la tranquillité et l’autre pour l’agitation, l’une pour l’hypocrisie et l’autre pour la vérité, l’une pour la pauvreté et l’autre pour la richesse. Elle garde plutôt envers tous une seule disposition, sincère et pure.


    **6** Elle n’a pas une manière double de voir ou d’entendre[c] ; car, dans tout ce que cet homme fait, dit ou voit, il sait que le Seigneur examine son âme.


    **7** Il purifie donc sa pensée afin de n’être condamné ni par les humains ni par Dieu. De même, les œuvres de Béliar sont doubles et ne comportent aucune simplicité.


    [a] « Béliar » reproduit la forme du nom dans le témoin grec ; beaucoup de lecteurs connaissent ce personnage sous le nom de « Bélial ». Le « dessein » peut aussi désigner ici la résolution ou l’intention arrêtée.


    [b] Plusieurs mots et propositions des versets 2 à 5 présentent des incertitudes dans la transmission du texte grec. La traduction suit ici le texte édité, sans masquer son caractère parfois heurté.


    [c] Littéralement : « Elle n’a ni vue ni ouïe doubles. » Cette image prolonge l’opposition entre la duplicité et la simplicité qui structure le passage.'
