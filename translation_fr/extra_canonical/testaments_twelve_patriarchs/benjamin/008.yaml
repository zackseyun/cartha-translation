base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
translation:
  language: fr
  text: '**Testament de Benjamin 8**


    **1.** Mais vous, mes enfants, fuyez la méchanceté, la jalousie et la haine envers vos frères, et attachez-vous à la bonté et à l’amour.


    **2.** En effet, l’esprit pur ne se souille pas au contact du fumier et de la boue ; au contraire, il les refroidit l’un et l’autre et en chasse la mauvaise odeur. De même, l’esprit pur, confronté aux souillures de la terre, édifie plutôt[a], sans être lui-même souillé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec est incertain à cet endroit. Le mot transmis signifie normalement « édifie » ou « construit »; dans cette comparaison, son sens précis et la portée de « plutôt » restent difficiles à établir. Des restitutions contextuelles, telles que « purifie », ont été proposées.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόδρατε
  choice: fuyez
  rationale: Le verbe exprime une fuite énergique, et non un simple évitement.
- source_word: κακίαν
  choice: le mal
  rationale: Dans cette exhortation morale, « le mal » est naturel et conserve la portée générale du terme.
- source_word: φθόνον
  choice: la jalousie
  rationale: Le mot désigne une jalousie envieuse; « jalousie » est ici plus courant et direct que « envie malveillante ».
- source_word: μισαδελφίαν
  choice: la haine fraternelle
  rationale: Ce nom rare désigne la haine envers un frère ou entre frères. La formulation française conserve l’idée familiale sans la réduire à une hostilité générale.
- source_word: προσκολλᾶσθε
  choice: attachez-vous
  rationale: Le choix garde l’image d’une adhésion ferme et durable.
- source_word: ἀγαθότητι
  choice: la bonté
  rationale: Le terme désigne la qualité morale de ce qui est bon.
- source_word: ἀγάπῃ
  choice: l’amour
  rationale: Traduction directe et naturelle, sans ajouter une qualification doctrinale absente du grec.
- source_word: καθαρὸς νοῦς
  choice: l’esprit pur
  rationale: « Esprit » rend ici la faculté intérieure de pensée et de discernement; « pur » maintient le contraste avec la souillure.
- source_word: κόπρου καὶ βόρβορον
  choice: du fumier et de la boue
  rationale: Cette traduction conserve le caractère concret et répugnant de l’image.
- source_word: ψύγει
  choice: il les refroidit
  rationale: Le témoin grec fourni porte ψύγει, « refroidit », malgré le caractère inhabituel de cette expression dans l’image.
- source_word: δυσωδίαν
  choice: la mauvaise odeur
  rationale: Expression française claire qui restitue directement l’idée de puanteur.
- source_word: συνεχόμενος
  choice: bien qu’entouré
  rationale: La tournure concessive rend le sens contextuel d’être pris ou enserré au milieu des souillures.
- source_word: †οἰκοδομεῖ
  choice: édifie davantage
  rationale: Rendu aussi littéralement que possible, puisque le mot transmis est signalé comme corrompu et produit un sens difficile dans ce contexte.
theological_decisions:
- issue: Pureté de l’esprit au milieu des souillures terrestres
  choice: La comparaison affirme que l’esprit pur demeure non souillé, sans préciser une doctrine de séparation du monde ou d’impeccabilité.
  alternative: Interpréter le passage comme une affirmation doctrinale d’immunité absolue au péché.
  rationale: Le texte emploie une exhortation et une image morale; il ne faut pas transformer cette image en système doctrinal.
- issue: Sens du verbe corrompu †οἰκοδομεῖ
  choice: Conserver le sens transmis, « édifie », tout en signalant dans une note que le texte est incertain.
  alternative: Conjecturer « purifie » ou « assainit » afin de rendre la comparaison plus cohérente.
  rationale: Le témoin fourni marque explicitement le mot d’une obèle. Une conjecture silencieuse résoudrait artificiellement une difficulté réelle du texte.
translation_notes:
  register: 'Français moderne, international et digne, avec une exhortation directe. L’image concrète du fumier, de la boue et de la mauvaise odeur est conservée. La syntaxe de la seconde phrase est légèrement explicitée pour rester intelligible, sans masquer les deux difficultés du témoin grec: ψύγει (« refroidit ») et †οἰκοδομεῖ (« édifie », texte signalé comme incertain).'
