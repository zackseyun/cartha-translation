revisions:
- from: '**Testament de Benjamin 8**


    **1.** Mais vous, mes enfants, fuyez le mal, la jalousie et la haine fraternelle, et attachez-vous à la bonté et à l’amour.


    **2.** En effet, l’esprit pur ne se souille pas au contact du fumier et de la boue ; au contraire, il les refroidit tous deux et en chasse la mauvaise odeur. De même, l’esprit pur, bien qu’entouré des souillures de la terre, édifie davantage[a] sans être lui-même souillé.'
  to: '**Testament de Benjamin 8**


    **1.** Mais vous, mes enfants, fuyez la méchanceté, la jalousie et la haine envers vos frères, et attachez-vous à la bonté et à l’amour.


    **2.** En effet, l’esprit pur ne se souille pas au contact du fumier et de la boue ; au contraire, il les refroidit l’un et l’autre et en chasse la mauvaise odeur. De même, l’esprit pur, confronté aux souillures de la terre, édifie plutôt[a], sans être lui-même souillé.'
  rationale: Révision limitée aux points où le français pouvait soit obscurcir le sens directionnel du grec, soit résoudre excessivement une difficulté textuelle. L’image déroutante de « refroidir » est maintenue conformément au témoin, et l’obèle sur οἰκοδομεῖ demeure signalée par une note qui n’impose pas de conjecture.
