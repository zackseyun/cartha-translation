    issue: « Comme Rachel ... mourut » peut se lire temporellement.
    rationale: ἐπειδὴ introduit ici la cause de l’absence de lait ; « Puisque » rend plus explicitement cette relation causale.
  - severity: low
    issue: « priait pour avoir deux fils d’elle » est légèrement moins proche de ἠύχετο ... ἰδεῖν.
    rationale: Le grec dit littéralement qu’il priait de « voir » deux fils issus de Rachel. « priait de voir deux fils naître d’elle » conserve cette image et reste naturel en français.
