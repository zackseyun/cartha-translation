base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: fr
  text: '**Testament de Benjamin, douzième fils de Jacob et de Rachel**


    **1** Voici la copie des paroles de Benjamin, qu’il transmit à ses fils après avoir vécu cent vingt-cinq ans.


    **2** Après les avoir embrassés avec affection, il dit :


    « De même qu’Isaac naquit à Abraham dans sa vieillesse, de même je suis né, moi aussi, à Jacob. **3** Puisque Rachel, ma mère, mourut en me mettant au monde[a], je n’eus pas de lait maternel ; c’est donc Bilha, sa servante, qui m’allaita. **4** En effet, après avoir donné naissance à Joseph, Rachel resta stérile pendant douze ans. Elle pria le Seigneur en jeûnant ; puis elle conçut et me mit au monde. **5** Mon père aimait profondément Rachel et priait de voir deux fils naître d’elle. **6** C’est pourquoi je fus appelé Benjamin, ce qui signifie « fils des jours »[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Voir Genèse 35.16-19 : Rachel meurt lors de la naissance de Benjamin.'
    reason: cross_reference
  - marker: b
    text: Le grec porte littéralement « fils des jours ». Dans Genèse 35.18, le nom Benjamin est généralement compris autrement, comme « fils de la droite » ; la présente traduction conserve l’explication propre à ce testament.
    reason: textual_note
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans le titre de cet écrit, le terme désigne les dernières paroles et dispositions attribuées au patriarche ; « Testament » correspond au genre littéraire traditionnel sans réduire le mot à un acte juridique moderne.
- source_word: Ἀντίγραφον λόγων
  choice: la copie des paroles
  rationale: Rend directement l’idée d’une transcription ou copie des paroles de Benjamin, tout en restant naturel en français.
- source_word: διέθετο
  choice: transmit
  rationale: Dans ce contexte testamentaire, le verbe exprime une disposition solennelle adressée aux fils. « Transmit » est naturel et laisse au titre le soin d’indiquer la nature testamentaire du discours.
- source_word: Καταφιλήσας
  choice: Après les avoir embrassés avec affection
  rationale: Le composé grec suggère des baisers affectueux ou répétés. Cette formulation rend la tendresse de la scène sans lourdeur.
- source_word: ἐν γήρει αὐτοῦ
  choice: dans sa vieillesse
  rationale: Expression française idiomatique correspondant exactement à la comparaison entre la naissance d’Isaac et celle de Benjamin.
- source_word: τέθνηκε γεννῶσά με
  choice: mourut en me mettant au monde
  rationale: Le participe associe la mort de Rachel à l’accouchement de Benjamin. La traduction française exprime clairement cette simultanéité.
- source_word: γάλα οὐκ ἔσχον
  choice: je n’eus pas de lait maternel
  rationale: 'L’ajout explicatif « maternel » rend en français le sens contextuel : la mort de Rachel priva l’enfant de son allaitement, non de tout lait au sens absolu.'
- source_word: Βαλλὰν ... ἐθήλασα
  choice: c’est donc Bilha, sa servante, qui m’allaita
  rationale: Bien que la construction grecque soit littéralement active du point de vue de l’enfant, le français nomme naturellement Bilha comme celle qui l’allaita.
- source_word: ἐστείρευσεν
  choice: resta stérile
  rationale: Le verbe décrit la période sans conception qui suivit la naissance de Joseph ; « resta stérile » fait ressortir la durée indiquée.
- source_word: προσηύξατο πρὸς Κύριον μετὰ νηστείας
  choice: Elle pria le Seigneur en jeûnant
  rationale: Formulation française fluide qui conserve à la fois la direction de la prière et son accompagnement par le jeûne.
- source_word: Σφόδρα ... ἠγάπα
  choice: aimait profondément
  rationale: Rend avec naturel l’intensité de l’adverbe σφόδρα dans un registre digne et actuel.
- source_word: δύο υἱοὺς ἰδεῖν ἐξ αὐτῆς
  choice: avoir deux fils d’elle
  rationale: Littéralement, Jacob priait de « voir » deux fils issus de Rachel. En français, « avoir deux fils d’elle » exprime naturellement l’objet de cette espérance sans préciser davantage le mécanisme de la prière.
- source_word: υἱὸς ἡμερῶν
  choice: fils des jours
  rationale: Le texte grec fournit explicitement cette étymologie. La traduction littérale préserve la particularité du témoin grec et sa tension avec l’explication habituelle du nom dans la Genèse.
theological_decisions:
- issue: Sens du nom Benjamin dans le témoin grec
  choice: Traduire l’explication explicite par « fils des jours »
  alternative: Harmoniser avec « fils de la droite » ou interpréter « fils de la vieillesse »
  rationale: Le passage donne lui-même la glose ὅ ἐστιν υἱὸς ἡμερῶν. La priorité accordée au texte source exige de conserver cette formulation inhabituelle plutôt que de la remplacer par l’étymologie hébraïque traditionnelle.
- issue: Prière et conception de Rachel
  choice: 'Conserver la succession narrative : prière avec jeûne, conception, naissance'
  alternative: Présenter explicitement la conception comme une réponse divine causale
  rationale: Le grec juxtapose les événements sans formuler directement une causalité théologique. La traduction maintient cette retenue et n’ajoute pas une interprétation absente du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Les versets sont indiqués pour faciliter la consultation. Le titre grec complet, qui nomme Jacob et Rachel, est conservé. Les formulations restent accessibles sans effacer les traits singuliers du témoin grec.
