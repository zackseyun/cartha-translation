  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/003.yaml
  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: fr
  text: Il ne se complaît pas dans le plaisir [il ne chagrine pas son prochain, ne se rassasie pas de luxe et ne s’égare pas par les errances de ses yeux][a]. Car le Seigneur est sa part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots placés entre crochets ont un statut textuel incertain dans la tradition grecque.
    reason: Signaler au lecteur les crochets critiques présents dans le texte source sans intégrer silencieusement le passage au texte assuré.
lexical_decisions:
- source_word: τέρπεται ἐν ἡδονῇ
  choice: se complaît dans les plaisirs
  rationale: Rend l’idée de trouver son agrément dans le plaisir, en français naturel, sans réduire ἡδονή à un plaisir particulier.
- source_word: λυπεῖ τὸν πλησίον
  choice: chagrine son prochain
  rationale: Préserve le sens général de causer peine ou tristesse à autrui et maintient le terme relationnel « prochain ».
- source_word: ἐμπίπλαται τρυφῇ
  choice: se rassasie de luxe
  rationale: Conserve l’image de se remplir ou de se repaître, tandis que « luxe » exprime ici la vie de mollesse et d’abondance.
- source_word: πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  choice: s’égare au gré des errances de ses yeux
  rationale: Reproduit l’idée d’égarement provoqué par les mouvements vagabonds du regard, sans préciser davantage l’objet de la convoitise.
- source_word: Κύριος γάρ ἐστι ἡ μερὶς αὐτοῦ
  choice: Car le Seigneur est sa part
  rationale: Formulation biblique claire qui garde la métaphore de la part attribuée ou de l’héritage.
theological_decisions:
- issue: Le Seigneur comme « part » de l’homme bon
  choice: le Seigneur est sa part
  alternative: le Seigneur est son héritage
  rationale: « Part » conserve directement la métaphore grecque et son ouverture théologique, sans l’expliciter uniquement comme héritage.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme négatif du grec est conservé, avec une syntaxe légèrement allégée à l’intérieur des crochets. Les « errances des yeux » restent volontairement imagées et ambiguës.
