  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/002.yaml
  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: fr
  text: Il ne regarde pas les choses périssables avec passion et n’amasse pas non plus de richesses pour la recherche du plaisir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾷ ἐμπαθῶς
  choice: porte un regard passionné
  rationale: Rend à la fois l’acte de regarder et l’adverbe indiquant un désir passionnel, dans un français naturel.
- source_word: τὰ φθαρτά
  choice: les choses périssables
  rationale: Conserve le sens général du neutre pluriel grec, qui désigne ce qui est corruptible ou voué à disparaître.
- source_word: συνάγει πλοῦτον
  choice: amasse des richesses
  rationale: Expression française idiomatique correspondant à l’idée de rassembler ou accumuler de la richesse.
- source_word: εἰς φιληδονίαν
  choice: pour son plaisir
  rationale: Exprime la finalité de l’accumulation et le penchant pour le plaisir, sans alourdir le verset par un terme technique.
theological_decisions:
- issue: Portée morale de ἐμπαθῶς et φιληδονίαν
  choice: Employer « passionné » et « pour son plaisir »
  alternative: « avec convoitise » et « pour satisfaire son amour du plaisir »
  rationale: La formulation retenue préserve le lien avec les passions et le plaisir sans préciser davantage que le grec la nature exacte du désir.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme négatif des deux propositions est conservé au moyen de « et… pas non plus ».
