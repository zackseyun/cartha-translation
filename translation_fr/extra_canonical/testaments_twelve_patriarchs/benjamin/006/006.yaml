  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: fr
  text: Il n’a ni vision double ni ouïe double. En effet, dans tout ce qu’il fait, dit ou voit, il sait que le Seigneur veille sur son âme. Il purifie aussi sa pensée afin de n’être condamné ni par les humains ni par Dieu. De même, les œuvres de Béliar sont doubles et n’ont aucune simplicité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρασιν … ἀκοὴν διπλῆν
  choice: le regard double … l’écoute double
  rationale: Conserve l’image grecque et son parallélisme, qui évoquent une perception divisée ou duplicite sans réduire explicitement l’expression à une seule interprétation.
- source_word: ἐπισκέπτει
  choice: veille sur
  rationale: Rend naturellement l’idée d’une attention active du Seigneur envers l’âme; le contexte permet aussi une nuance d’examen, qui reste perceptible dans la perspective du jugement.
- source_word: διάνοιαν
  choice: pensée
  rationale: Terme courant et ample pour la faculté intérieure de réflexion et d’intention, sans imposer le sens plus psychologique de « mental ».
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre dans la littérature testamentaire, sans l’identifier interprétativement à une autre figure.
- source_word: διπλᾶ … ἀπλότητα
  choice: doubles … simplicité
  rationale: Préserve l’antithèse lexicale grecque entre duplicité et simplicité/unité de disposition.
theological_decisions:
- issue: Portée de l’action divine exprimée par ἐπισκέπτει
  choice: le Seigneur veille sur son âme
  alternative: le Seigneur examine son âme
  rationale: « Veille sur » maintient la polyvalence du verbe, qui peut exprimer l’attention, la visitation ou l’inspection divine; « examine » aurait accentué unilatéralement le jugement.
- issue: Jugement par les humains et par Dieu
  choice: afin de n’être condamné ni par les humains ni par Dieu
  alternative: afin de ne pas être désapprouvé par les humains, de même que par Dieu
  rationale: Le passif καταγνωσθῆναι porte l’idée d’un verdict défavorable. La coordination française conserve les deux instances mentionnées sans suggérer qu’elles possèdent la même autorité.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la tension entre le double et le simple sont conservés. « Humains » rend le pluriel générique ἀνθρώπων de manière inclusive et naturelle.
