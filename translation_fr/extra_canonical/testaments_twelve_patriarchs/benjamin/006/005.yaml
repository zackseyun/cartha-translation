base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: fr
  text: 'La bonne disposition d’esprit n’a pas deux langues : de bénédiction et de malédiction, d’insulte et d’honneur, de calme et d’agitation, d’hypocrisie et de vérité, [de pauvreté et de richesse][a] ; mais elle a envers tous une seule disposition, sincère et pure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le groupe « de pauvreté et de richesse » est textuellement incertain dans l’édition grecque et y figure entre crochets.
    reason: Signaler au lecteur la réserve textuelle matérialisée par les crochets dans la source.
lexical_decisions:
- source_word: ἡ ἀγαθὴ διάνοια
  choice: la bonne disposition d’esprit
  rationale: διάνοια désigne ici l’orientation intérieure de la pensée; « disposition d’esprit » est naturel en français et prépare le contraste avec les comportements divisés.
- source_word: δύο γλώσσας
  choice: deux langages
  rationale: Le grec dit littéralement « deux langues », mais l’expression vise une parole double ou contradictoire. « Deux langages » conserve l’image tout en restant idiomatique.
- source_word: ὕβρεως
  choice: l’insulte
  rationale: Dans cette série liée aux « langues », le terme évoque l’outrage verbal; « insulte » rend ce sens contextuel sans lui donner une portée doctrinale supplémentaire.
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: du calme et de l’agitation
  rationale: Le couple oppose tranquillité et trouble. Ces termes modernes préservent l’antithèse sans préciser artificiellement s’il s’agit de parole ou de conduite.
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: une seule attitude, sincère et pure
  rationale: διάθεσις exprime ici une orientation ou attitude intérieure. « Attitude » évite la répétition de « disposition » et rend clairement l’unité morale envers tous.
- source_word: περὶ πάντας
  choice: envers tous
  rationale: Cette formulation rend naturellement la relation ou l’orientation à l’égard de toutes les personnes.
theological_decisions:
- issue: Portée de l’image des « deux langues »
  choice: Conserver une image de dualité verbale avec « deux langages »
  alternative: Traduire explicitement par « un double langage »
  rationale: « Deux langages » suit de plus près le grec et laisse la série d’oppositions développer elle-même l’idée, sans réduire le propos à la seule duplicité rhétorique.
- issue: Statut textuel de πενίας καὶ πλούτου
  choice: Maintenir le couple entre crochets
  alternative: L’intégrer sans crochets ou l’omettre
  rationale: Les crochets de l’édition signalent une incertitude textuelle réelle; ils doivent être préservés afin de ne pas présenter ce segment comme également assuré.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en couples antithétiques est conservée. La seconde phrase allège une période grecque très longue sans modifier le contraste entre duplicité et unité intérieure.
