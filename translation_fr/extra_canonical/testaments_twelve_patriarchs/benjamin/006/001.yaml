source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: fr
  text: Le dessein de l’homme bon n’est pas aux mains de l’esprit d’égarement[a] de Béliar, car l’ange de la paix guide son âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’esprit d’erreur de Béliar » ou « l’esprit de tromperie de Béliar ». Le grec πλάνη peut évoquer l’égarement, l’erreur ou la tromperie.'
    reason: Signaler l’étendue sémantique de πλάνη et préserver l’ambiguïté du texte source.
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: le dessein
  rationale: Le terme désigne ici l’intention réfléchie, le projet ou la résolution intérieure; « dessein » conserve cette portée sans la réduire à un simple avis.
- source_word: ἐν χειρί
  choice: aux mains de
  rationale: Cette expression française préserve l’image grecque de la main comme symbole de pouvoir ou de domination, tout en restant naturelle.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: l’esprit d’égarement de Béliar
  rationale: La suite de génitifs qualifie le « esprit » par l’égarement et le rattache à Béliar. « Égarement » rend πλάνη sans imposer exclusivement l’idée d’une tromperie délibérée.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: l’ange de la paix
  rationale: Traduction directe qui conserve la formulation et l’imagerie religieuse du grec.
- source_word: ὁδηγεῖ τὴν ψυχὴν αὐτοῦ
  choice: guide son âme
  rationale: Rend simplement le verbe de conduite et le terme ψυχή, sans explicitation théologique supplémentaire.
theological_decisions:
- issue: Rapport entre le dessein humain, Béliar et l’ange de la paix
  choice: Conserver le contraste entre l’absence de domination de l’esprit de Béliar et la conduite positive de l’ange de la paix.
  alternative: Présenter le passage comme une affirmation absolue d’impossibilité morale ou de possession spirituelle.
  rationale: Le grec emploie une image de pouvoir (« dans la main de ») sans définir précisément le mécanisme de cette influence; la traduction ne doit pas trancher au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique et les images de la main, de l’ange et de l’âme sont conservées; « aux mains de » est idiomatique en français tout en restant proche du grec.
