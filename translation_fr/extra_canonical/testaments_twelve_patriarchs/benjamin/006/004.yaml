base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: fr
  text: Le bon dessein n’accepte ni la gloire ni le déshonneur[a] de la part des humains, et il ne connaît ni tromperie, ni mensonge, ni querelle, ni injure. Car le Seigneur demeure en lui, illumine son âme, et il se réjouit de tous en tout temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec imprimé est incertain dans cette expression ; la traduction suit la lecture qui oppose la gloire au déshonneur.
    reason: Signaler la difficulté textuelle indiquée par les crochets de l’édition source, sans résoudre au-delà de ce que permet le texte.
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: Le bon dessein
  rationale: « Dessein » exprime une intention ou résolution réfléchie et rend naturellement le substantif abstrait διαβούλιον, qualifié par ἀγαθόν.
- source_word: οὐ δέχεται
  choice: ne se laisse influencer ni par
  rationale: Avec « gloire » et « déshonneur », cette tournure française rend l’idée de ne pas accueillir ou accepter comme déterminants, sans suggérer qu’un dessein reçoit matériellement quelque chose.
- source_word: δόξης … ἀτιμίας ἀνθρώπων
  choice: la gloire ni le déshonneur venant des humains
  rationale: « Gloire » et « déshonneur » conservent le contraste du grec; « venant des humains » rattache clairement ἀνθρώπων aux deux termes et reste inclusif.
- source_word: δόλον … ψεῦδος … μάχην … λοιδωρίαν
  choice: tromperie, mensonge, querelle, injure
  rationale: 'Ces termes courants préservent l’énumération morale: ruse trompeuse, fausseté, conflit et parole outrageante.'
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  choice: illumine son âme
  rationale: Traduction directe et idiomatique de φωτίζει, en conservant ψυχή par « âme ».
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: il se réjouit à l’égard de tous en tout temps
  rationale: La formulation conserve la préposition πρὸς et l’étendue universelle et temporelle du grec, malgré une légère étrangeté voulue.
theological_decisions:
- issue: Référent des pronoms masculins dans « en lui », « son âme » et « il se réjouit »
  choice: Conserver les pronoms masculins et leur enchaînement sans expliciter le référent
  alternative: Remplacer les pronoms par « la personne au bon dessein » ou attribuer explicitement l’illumination au Seigneur
  rationale: Le grec passe du neutre « bon dessein » à des pronoms masculins qui semblent viser l’homme porteur de ce dessein, mais sans le nommer. Expliciter supprimerait cette tension syntaxique. Dans « illumine », le sujet grammatical demeure naturellement « le Seigneur », tandis que le dernier « il » reste formellement ambigu.
translation_notes:
  register: Français moderne, digne et accessible. La structure répétitive de l’énumération est conservée, ainsi que l’ambiguïté pronominale du dernier membre. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
