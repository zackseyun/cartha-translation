  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012.yaml
  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: fr
  text: '**Testament de Benjamin 12**


    **1.** Après avoir dit cela, il étendit ses pieds et s’endormit d’un doux sommeil[a].


    **2.** Ses fils firent ce qu’il leur avait ordonné : ils emportèrent son corps et l’ensevelirent à Hébron avec ses pères.


    **2.** La durée de sa vie fut de cent vingt-cinq ans[b]. Lorsqu’il eut achevé ses paroles, il dit : « Je vous l’ordonne, mes enfants : emportez mes os hors d’Égypte et ensevelissez-moi à Hébron, près de mes pères. »


    **2.** Benjamin mourut à l’âge de cent vingt-cinq ans, dans une heureuse vieillesse, et on le déposa dans un cercueil.


    **3.** La quatre-vingt-onzième année après la sortie des fils d’Israël hors d’Égypte, ceux-ci et leurs frères remontèrent secrètement les ossements de leurs pères pendant la guerre en Canaan. Ils les ensevelirent à Hébron, près des pieds de leurs pères[c].


    **4.** Puis ils revinrent du pays de Canaan et habitèrent en Égypte jusqu’au jour où ils sortirent du pays d’Égypte.


    [a] Certains témoins grecs ajoutent « et bon » après « un doux sommeil ».


    [b] Le chapitre conserve plusieurs conclusions qui se chevauchent au sujet de la mort et de l’ensevelissement de Benjamin, puis du transfert ultérieur des ossements des patriarches. Cette répétition reflète probablement une histoire complexe de transmission ; elle est néanmoins traduite ici telle qu’elle apparaît dans le texte grec transmis.


    [c] L’expression « près des pieds de leurs pères » traduit littéralement le grec. Elle peut désigner un emplacement funéraire proche des tombeaux ancestraux, plutôt qu’un lieu situé directement aux pieds des patriarches.'
  philosophy: optimal-equivalence
  footnotes:
