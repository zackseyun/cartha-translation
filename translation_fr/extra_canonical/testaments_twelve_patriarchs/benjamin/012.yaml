    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: s’endormit d’un beau sommeil
  rationale: Conserve l’euphémisme testamentaire de la mort comme sommeil ainsi que la répétition du vocabulaire du sommeil. « Beau » permet aussi de rendre intelligible la variante qui ajoute « et bon ».
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: ils emportèrent son corps
  rationale: ἄραντες exprime ici le fait de soulever et d’emporter le corps ; le français naturel n’exige pas d’ajouter une direction ascendante que ce verbe seul ne précise pas nécessairement.
- source_word: ἐντέλλομαι ὑμῖν
  choice: Je vous l’ordonne
  rationale: Maintient la force de la charge paternelle finale et son caractère impératif.
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: emportez mes os hors d’Égypte
  rationale: Rend le déplacement des restes depuis l’Égypte sans imposer en français un « vers le haut » peu naturel ; « os » conserve le caractère concret du grec.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: près de mes pères
  rationale: Préserve à la fois la proximité spatiale et le langage de parenté, sans préciser davantage la disposition funéraire.
- source_word: ἐν γήρει καλῷ
  choice: dans une heureuse vieillesse
  rationale: Expression française digne et biblique qui rend l’évaluation positive de καλῷ sans transformer l’âge avancé en simple donnée chronologique.
- source_word: ἐν παραθήκῃ
  choice: on le déposa dans un cercueil
  rationale: Dans ce contexte funéraire et en vue du transfert ultérieur des ossements, παραθήκη désigne vraisemblablement une mise en dépôt ou en sûreté ; « cercueil » exprime clairement le référent concret probable.
- source_word: ἐν κρυφῇ
  choice: secrètement
  rationale: Rend directement la valeur adverbiale et le caractère dissimulé de l’opération.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: près des pieds de leurs pères
  rationale: Conserve l’image corporelle inhabituelle du grec au lieu de la réduire à la formule générale « avec leurs pères ».
theological_decisions:
- issue: Conclusions doubles et notices répétées sur la mort et l’ensevelissement
  choice: Traduire intégralement les notices qui se chevauchent, avec leur numérotation répétée.
  alternative: Fusionner les notices en une seule conclusion ou en omettre certaines comme secondaires.
  rationale: Le texte grec transmis présente ces reprises. Les conserver rend visible la complexité de sa transmission sans harmonisation silencieuse.
- issue: Datation à la quatre-vingt-onzième année après la sortie d’Égypte
  choice: Traduire la précision chronologique telle qu’elle est transmise.
  alternative: Corriger la chronologie ou la reformuler de manière vague.
  rationale: Le témoin grec formule une affirmation chronologique précise ; la traduction en préserve la tension historique au lieu de la résoudre par conjecture.
- issue: Sommeil comme désignation de la mort
  choice: Conserver l’image « s’endormit d’un beau sommeil ».
  alternative: Expliciter par « mourut paisiblement ».
  rationale: Le grec emploie délibérément le langage du sommeil. Une paraphrase explicative supprimerait cette image et pourrait trancher sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les répétitions, les images funéraires et les tensions du texte grec. Le terme « pères » est maintenu pour préserver le motif ancestral, et non remplacé par « ancêtres ».
