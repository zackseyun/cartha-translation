  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: fr
  text: Après être remonté du séjour des morts, il passera de la terre au ciel. Et je compris combien il serait humble sur la terre et combien il serait glorieux au ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: séjour des morts
  rationale: Rend Hadès par une expression française claire et non confessionnelle, désignant le domaine des morts sans l’assimiler automatiquement à un lieu de châtiment.
- source_word: ἀνελθών
  choice: étant remonté
  rationale: Conserve la valeur circonstancielle et l’antériorité du participe aoriste, ainsi que le mouvement ascendant exprimé par le verbe.
- source_word: μεταβαίνων
  choice: il passera
  rationale: Exprime naturellement en français le déplacement futur de la terre au ciel; le participe grec est lié à ἔσται et forme une périphrase à valeur future.
- source_word: ἔγνων
  choice: je compris
  rationale: Respecte l’aoriste et traduit ici une prise de connaissance ou une perception acquise, plutôt qu’un présent « je sais ».
- source_word: ταπεινός
  choice: humble
  rationale: Préserve le champ sémantique de l’abaissement et de l’humilité sans imposer une interprétation plus étroite comme « méprisé ».
- source_word: ἔνδοξος
  choice: glorieux
  rationale: Correspond directement à l’idée de gloire et maintient le contraste avec l’humilité terrestre.
theological_decisions:
- issue: Sens de ᾅδης
  choice: séjour des morts
  alternative: Hadès / enfer
  rationale: « Séjour des morts » préserve la portée générale du terme grec et évite de trancher en faveur de l’« enfer » comme lieu de punition; « Hadès » serait plus formel mais moins immédiatement accessible.
- issue: Contraste entre condition terrestre et céleste
  choice: « humble sur la terre » / « glorieux au ciel »
  alternative: « abaissé sur la terre » / « revêtu de gloire au ciel »
  rationale: La formulation retenue suit sobrement les adjectifs grecs et conserve la tension du texte sans développer leur portée christologique.
translation_notes:
  register: Français moderne, international et digne. Syntaxe légèrement solennelle pour refléter la structure grecque, tout en restant intelligible. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
