source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: fr
  text: Et le voile du Temple se déchirera, et l’Esprit de Dieu passera vers les nations, comme un feu qui se déverse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅπλωμα τοῦ ναοῦ
  choice: le voile du Temple
  rationale: ἅπλωμα désigne littéralement ce qui est étendu ou déployé; dans ce contexte cultuel, «voile» est la formulation française naturelle et correspond à l’image du voile du Temple.
- source_word: σχιζόμενον
  choice: se déchirera
  rationale: Rend directement l’idée de séparation violente exprimée par σχίζω, tout en conservant la valeur future de la construction.
- source_word: μεταβήσεται
  choice: passera vers
  rationale: Préserve le mouvement ou transfert indiqué par μεταβαίνω sans préciser davantage le point de départ, que le grec ne formule pas explicitement.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Choix usuel qui conserve la portée collective et potentiellement théologique du grec, sans réduire le terme à une seule interprétation telle que «les païens».
- source_word: πῦρ ἐκχυνόμενον
  choice: un feu qui se répand
  rationale: Exprime naturellement en français l’image d’un feu versé ou déversé. «Se répand» évite la tournure peu idiomatique «un feu répandu» tout en gardant l’idée d’effusion.
theological_decisions:
- issue: Destination de l’Esprit de Dieu
  choice: vers les nations
  alternative: sur les nations / parmi les nations
  rationale: La préposition ἐπί avec l’accusatif après un verbe de mouvement suggère une orientation vers les nations. La traduction ne précise ni remplacement ni exclusivité.
- issue: Rapport entre l’Esprit et l’image du feu
  choice: comme un feu qui se répand
  alternative: comme du feu répandu
  rationale: 'La comparaison est laissée ouverte: elle peut évoquer la manière, la puissance ou l’extension de la venue de l’Esprit, sans identifier simplement l’Esprit au feu.'
translation_notes:
  register: Français moderne, digne et accessible. La majuscule à «Temple» signale le sanctuaire de Jérusalem dans cet emploi déterminé; «Esprit» prend une majuscule puisqu’il s’agit de l’Esprit de Dieu.
