source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: fr
  text: '[3. Il entrera dans le premier temple, et là le Seigneur sera insulté et élevé sur un bois.[a]]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versets 3 à 5 présentent des incertitudes textuelles dans la tradition manuscrite et sont souvent considérés comme une addition postérieure; ils sont traduits ici parce qu’ils figurent dans le texte grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: τὸν πρῶτον ναόν
  choice: le premier temple
  rationale: Rend directement l’expression grecque, sans préciser de quel temple il s’agit au-delà de ce que dit le texte.
- source_word: ὑβρισθήσεται
  choice: sera insulté
  rationale: Exprime naturellement l’outrage ou l’affront indiqué par le passif grec, sans ajouter l’idée plus large de mauvais traitements.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: sera élevé sur un bois
  rationale: Conserve le terme concret et potentiellement allusif ξύλον (« bois ») ainsi que l’ambiguïté de ὑψόω entre élévation physique et portée théologique.
theological_decisions:
- issue: Référent du sujet dans les deux verbes passifs
  choice: Traiter « le Seigneur » comme sujet de « sera insulté » et de « sera élevé »
  alternative: Introduire un pronom distinct ou laisser entendre un changement de sujet
  rationale: La syntaxe grecque enchaîne naturellement les deux passifs sous le même sujet explicite, Κύριος.
- issue: Allusion possible à la crucifixion
  choice: Conserver « élevé sur un bois »
  alternative: Expliciter par « élevé sur une croix » ou « crucifié »
  rationale: Le grec dit ξύλον, non σταυρός, et ὑψωθήσεται porte une tension entre le geste physique et une possible exaltation; l’explicitation résoudrait indûment cette tension.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la syntaxe grecque tout en étant naturelle. Les crochets reproduisent le statut éditorial du passage dans la source fournie.
