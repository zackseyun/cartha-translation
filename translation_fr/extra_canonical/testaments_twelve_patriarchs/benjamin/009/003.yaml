  source_fidelity: '« Il entrera dans le premier temple » rend fidèlement Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν. Les deux futurs passifs sont correctement rapportés au même sujet, « le Seigneur » : « sera insulté » pour ὑβρισθήσεται et « [sera] élevé sur un bois » pour ἐπὶ ξύλου ὑψωθήσεται. Le choix de « bois » préserve à juste titre le lexique non spécifique de ξύλον et l''ambiguïté allusive du passage.'
