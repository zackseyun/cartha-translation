  terminology: « Seigneur », « premier temple », « insulté » et « bois » sont cohérents avec le grec et avec une traduction d'équivalence optimale. La note rend correctement l'incertitude textuelle sans présenter comme certaine l'hypothèse d'une addition tardive.
