source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: fr
  text: 'Je vous dis aussi, d’après les paroles d’Hénoch le juste : vous vous livrerez à l’immoralité sexuelle de Sodome et vous périrez pour peu de temps. Puis vous serez à nouveau renouvelés, et le royaume du Seigneur ne sera pas parmi vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: ce que disent les oracles
  rationale: La tournure grecque est inhabituelle. « Oracles » conserve la portée de λόγια comme paroles faisant autorité, tandis que la formulation française rend naturellement l’idée d’un contenu rapporté.
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: Hénoch le juste
  rationale: Rend directement le titre grec et conserve sa valeur honorifique.
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: vous vous livrerez à l’immoralité sexuelle de Sodome
  rationale: La construction intensive associe le verbe et le nom de même racine. Cette formulation naturelle en français préserve la référence sexuelle explicite sans limiter le sens au seul adultère ou à la prostitution.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: vous périrez pour peu de temps
  rationale: Conserve la tension inhabituelle entre la destruction et sa durée limitée, sans la réinterpréter comme une simple souffrance.
- source_word: ἀνανεωθήσεσθε
  choice: vous serez de nouveau renouvelés
  rationale: Reproduit l’insistance de πάλιν avec le sens passif de restauration ou de renouvellement.
- source_word: ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν
  choice: le royaume du Seigneur ne sera pas parmi vous
  rationale: « Parmi vous » préserve le sens collectif probable de ἐν ὑμῖν sans exclure entièrement la nuance « en vous ».
theological_decisions:
- issue: Nature de la « fornication de Sodome »
  choice: immoralité sexuelle de Sodome
  alternative: débauche de Sodome
  rationale: Le texte emploie explicitement la famille de πορνεία. La traduction maintient la dimension sexuelle tout en évitant de préciser un acte que le grec ne nomme pas.
- issue: Rapport entre le renouvellement et l’absence du royaume
  choice: mais le royaume du Seigneur ne sera pas parmi vous
  alternative: et le royaume du Seigneur ne sera pas parmi vous
  rationale: Le grec porte simplement καί, mais le contexte crée une tension nette après le renouvellement. « Mais » rend cette relation discursive sans résoudre la tension théologique.
- issue: Portée de ἐν ὑμῖν
  choice: parmi vous
  alternative: en vous
  rationale: L’adresse est collective et peut viser la présence du règne au sein du groupe. La formulation retenue n’impose pas une lecture purement intérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le style conserve la tonalité prophétique, la répétition liée au renouvellement et la tension finale du grec.
