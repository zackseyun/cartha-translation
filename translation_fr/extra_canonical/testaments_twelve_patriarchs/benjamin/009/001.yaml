review_pass:
  verdict: revise
  source_fidelity: 'La proposition conserve correctement l’annonce de la transgression sexuelle associée à Sodome, de la perdition temporaire, du renouvellement et de l’absence du royaume. Toutefois, « mais » introduit une opposition que le grec ne marque pas : le texte porte simplement καί (« et »). « Je vous dis aussi, d’après les paroles… » rend plus directement λέγω δὲ ὑμῖν … ἀπὸ λογίων, tout en évitant de surinterpréter la tournure grecque difficile.'
  naturalness: Le français révisé reste moderne, international et d’un registre prophétique sobre. « À nouveau renouvelés » reproduit l’insistance de πάλιν avec le passif d’ἀνανεωθήσεσθε, sans lourdeur excessive.
  terminology: « Paroles d’Hénoch le juste » est suffisamment large pour λόγια et ne donne pas à « oracles » une coloration technique inutile. « Immoralité sexuelle de Sodome » garde la référence explicite à πορνεία sans spécifier une pratique absente du grec. « Parmi vous » est une bonne restitution collective et non doctrinalement restrictive de ἐν ὑμῖν.
  issues:
  - severity: medium
    issue: Ajout d’une opposition par « mais »
    rationale: Le grec καί coordonne la dernière proposition sans adversatif explicite. La tension contextuelle ne justifie pas de convertir la coordination en opposition dans une traduction d’équivalence optimale.
  - severity: low
    issue: « Je vous rapporte aussi ce que disent les oracles » est plus indirect que le grec
    rationale: λέγω δὲ ὑμῖν signifie directement « je vous dis ». La construction source avec πράξεις ἀπὸ λογίων est difficile, mais la formulation révisée suit l’audit anglais tout en restant plus proche de la diction grecque.
  revised_text: 'Je vous dis aussi, d’après les paroles d’Hénoch le juste : vous vous livrerez à l’immoralité sexuelle de Sodome et vous périrez pour peu de temps. Puis vous serez à nouveau renouvelés, et le royaume du Seigneur ne sera pas parmi vous.'
