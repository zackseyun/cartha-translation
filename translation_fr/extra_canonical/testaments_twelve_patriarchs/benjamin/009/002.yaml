source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: fr
  text: Cependant, dans la part qui vous est attribuée se trouvera le temple de Dieu. Le dernier sera plus glorieux que le premier. Là, les douze tribus et toutes les nations seront rassemblées, jusqu’à ce que le Très-Haut envoie son salut lors de la visitation d’un prophète unique[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lors de l’intervention d’un prophète unique en son genre ». Le mot grec traduit par « visitation » peut aussi désigner une intervention ou une inspection ; celui rendu par « unique » peut signifier « seul de son espèce » ou, selon une compréhension traditionnelle, « unique-engendré ».'
    reason: La formule ἐν ἐπισκοπῇ μονογενοῦς προφήτου comporte des ambiguïtés lexicales réelles. La note les indique sans décider de l’identité du prophète ni imposer une interprétation théologique.
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: dans la part qui vous est attribuée
  rationale: Exprime naturellement en français la part territoriale échue aux destinataires, sans préciser davantage sa nature.
- source_word: ὁ ἔσχατος … ὑπὲρ τὸν πρῶτον
  choice: le dernier sera plus glorieux que le premier
  rationale: Conserve le contraste temporel du grec entre le dernier temple et le premier, le nom « temple » restant aisément sous-entendu.
- source_word: συναχθήσονται
  choice: seront rassemblées
  rationale: Le passif français correspond au passif grec et fait clairement des douze tribus comme de toutes les nations les sujets du rassemblement.
- source_word: ἐν ἐπισκοπῇ
  choice: lors de la venue
  rationale: Rend ici l’idée d’une visitation ou venue décisive dans un français courant, tout en signalant en note l’étendue sémantique du terme.
- source_word: μονογενοῦς προφήτου
  choice: d’un prophète unique
  rationale: « Unique » préserve le sens possible de seul en son genre sans imposer l’interprétation plus spécialisée « engendré unique ».
theological_decisions:
- issue: Sens de μονογενής appliqué au prophète
  choice: prophète unique
  alternative: prophète seul-engendré / Fils unique et prophète
  rationale: Le grec qualifie explicitement « prophète » et peut signifier unique ou seul de son espèce. Une formulation christologique plus explicite résoudrait une identification que ce verset laisse implicite.
- issue: Rapport entre le salut envoyé et la visitation du prophète
  choice: son salut lors de la venue d’un prophète unique
  alternative: son salut par l’intervention d’un prophète unique
  rationale: « Lors de » maintient un lien temporel ou circonstanciel et évite de décider si le prophète est l’agent, le moyen ou l’incarnation du salut.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation en phrases brèves clarifie les relations syntaxiques sans modifier leur ordre. Le fragment explicitement numéroté « 3 » dans la source fournie n’est pas inclus, puisque la référence demandée est Testament de Benjamin 9:2.
