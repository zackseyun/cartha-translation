base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007.yaml
  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: fr
  text: '1. Voyez donc : comme vous le constatez, j’ai cent vingt-six ans, et je n’ai conscience d’avoir commis aucun péché qui mène à la mort[a]. 2. À part ma femme, je n’ai connu aucune autre femme. Je ne me suis pas livré à l’immoralité sexuelle en laissant mes yeux s’égarer. 3. Je n’ai pas bu de vin pour l’égarement[b] ; je n’ai convoité aucun bien de mon prochain. 4. La tromperie n’a pas trouvé place dans mon cœur, et aucun mensonge n’est monté à mes lèvres. 5. J’ai gémi avec toute personne qui souffrait, et j’ai partagé mon pain avec le pauvre. J’ai vécu dans la piété tous les jours de ma vie ; je suis resté fidèle à la vérité. 6. J’ai aimé le Seigneur et toute personne de tout mon cœur, plus que mes propres enfants. 7. Vous aussi, mes enfants, agissez ainsi : tout esprit de Béliar[c] fuira loin de vous, aucune action des méchants ne prendra le dessus sur vous, et vous soumettrez toute bête sauvage, car vous aurez avec vous le Dieu du ciel et de la terre, qui marche avec les êtres
    humains dans la simplicité du cœur[d]. 8. Après avoir dit cela, il ordonna à ses fils de le faire monter à Hébron et de l’y ensevelir avec ses pères. 9. Puis il étendit les pieds et s’endormit dans une heureuse vieillesse, du sommeil éternel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus littéralement : « je n’ai reconnu en moi aucun péché qui mène à la mort ». Le grec exprime un examen moral de soi ; il ne dit pas simplement qu’Issacar était absolument sans péché.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec peut aussi signifier : « je n’ai pas bu de vin pour être égaré », « afin de m’égarer » ou « pour tromper ». Le rapport exact entre le vin et l’égarement ou la tromperie reste concis dans le texte.'
    reason: lexical_ambiguity
  - marker: c
    text: « Béliar » reproduit la forme grecque du nom ; certaines traditions emploient « Bélial ».
    reason: alternative_reading
  - marker: d
    text: La construction grecque rattache le plus naturellement « qui marche avec les êtres humains » à Dieu. La formule « dans la simplicité du cœur » peut aussi être comprise comme caractérisant les êtres humains accompagnés, sans préciser explicitement à qui appartient cette disposition.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: je n’ai conscience d’avoir commis en moi aucun péché qui mène à la mort
  rationale: « Avoir conscience » rend la portée d’auto-examen de ἔγνων, tandis que « en moi » conserve ἐν ἐμοί. « Qui mène à la mort » préserve εἰς θάνατον sans importer la catégorie doctrinale ultérieure de « péché mortel ».
- source_word: Πλὴν τῆς συμβίου μου οὐκ ἔγνων ἄλλην
  choice: À part ma femme, je n’ai connu aucune autre femme
  rationale: « Connaître » garde l’euphémisme sexuel du grec, naturel aussi en français biblique moderne ; συμβίου désigne ici la compagne conjugale.
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: en laissant mes yeux s’égarer
  rationale: La formulation exprime un regard mobile et attiré par le désir, sans surinterpréter la nature précise de cette errance.
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: du vin jusqu’à m’égarer
  rationale: ἀποπλάνησις évoque le fait d’être détourné ou égaré. Cette formulation rend un effet recherché ou produit par le vin, tout en signalant l’incertitude en note.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα
  choice: je n’ai convoité aucun bien de mon prochain
  rationale: La répétition de la racine du désir et le génitif du prochain évoquent nettement le langage de la convoitise ; « bien » rend l’objet convoité sans le limiter à une catégorie précise.
- source_word: συνεστέναξα
  choice: j’ai gémi avec
  rationale: Le verbe composé décrit une participation concrète à la souffrance, plus forte qu’une simple sympathie.
- source_word: Εὐσέβειαν ἐποίησα
  choice: j’ai vécu dans la piété
  rationale: Cette tournure française naturelle exprime une pratique habituelle de la piété sans le calque maladroit « j’ai fait la piété ».
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: je suis resté fidèle à la vérité
  rationale: ἐφύλαξα signifie garder ou préserver ; la formulation conserve à ἀλήθεια sa portée morale, au-delà de la seule exactitude factuelle.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: aucune action des méchants ne prendra le dessus sur vous
  rationale: κυριεύω exprime la domination. « Prendre le dessus » est actuel et intelligible tout en gardant cette force.
- source_word: ἐν ἁπλότητι καρδίας
  choice: dont le cœur est sans duplicité
  rationale: ἁπλότης désigne la simplicité, la sincérité ou l’absence de duplicité. La formulation évite que « simplicité de cœur » soit comprise comme naïveté intellectuelle.
- source_word: ἐκοιμήθη ... ὕπνον αἰώνιον
  choice: s’endormit ... du sommeil éternel
  rationale: Le sommeil est l’euphémisme mortuaire structurant du verset ; la répétition est légèrement resserrée en français sans effacer l’image.
theological_decisions:
- issue: Portée de la déclaration concernant le péché au verset 1
  choice: Une déclaration d’examen moral personnel, qualifiée par « qui mène à la mort »
  alternative: Une affirmation d’absence absolue de tout péché intérieur, ou la catégorie technique ultérieure de « péché mortel »
  rationale: Le texte associe ἔγνων, ἐν ἐμοί et εἰς θάνατον. Il faut préserver à la fois la force du témoignage d’Issacar et sa qualification, sans aplatir la tension théologique.
- issue: Référent de συμπορευόμενον au verset 7
  choice: Le participe décrit le Dieu du ciel et de la terre comme accompagnant les êtres humains au cœur sans duplicité
  alternative: Le participe décrirait les fils marchant avec Dieu, ou énoncerait une maxime générale
  rationale: L’accord accusatif masculin singulier rattache naturellement συμπορευόμενον à τὸν θεόν, tandis que ἐν ἁπλότητι καρδίας peut caractériser les humains accompagnés. Une note conserve l’autre possibilité syntaxique.
- issue: Contenu de la forme textuelle aux versets 8–9
  choice: 'Suivre le texte grec fourni : ensevelissement avec les pères, puis sommeil éternel dans une heureuse vieillesse'
  alternative: Ajouter la grotte au verset 8 et les expansions « sain de tous ses membres et vigoureux » au verset 9
  rationale: Ces éléments figurent dans certaines formes ou expansions, mais pas dans le texte grec principal fourni ici ; ils ne doivent donc pas être introduits silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme testimonial et les parallélismes sont conservés sans calques inutiles. « Béliar » maintient la forme propre à ce témoin grec. Les expansions présentes dans certaines traditions anglaises mais absentes du texte grec fourni aux versets 6, 8 et 9 ne sont pas intégrées au corps du texte.
