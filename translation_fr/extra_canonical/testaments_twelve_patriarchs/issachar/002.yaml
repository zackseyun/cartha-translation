revisions:
- from: '**Testament d’Issacar 2**


    **1.** Alors donc, un ange du Seigneur apparut à Jacob et lui dit : « Rachel enfantera des enfants, parce qu’elle a dédaigné les relations avec son mari[a] et choisi la maîtrise de soi. »


    **2.** Et si Léa, ma mère, n’avait pas donné les deux fruits[b] en échange de relations conjugales, elle aurait dû enfanter huit fils ; voilà pourquoi elle en enfanta six, tandis que Rachel enfanta les deux autres, car, par les mandragores, le Seigneur intervint en sa faveur[c].'
  to: '**Testament d’Issacar 2**


    **1.** Alors donc, un ange du Seigneur apparut à Jacob et lui dit : « Rachel mettra des enfants au monde, parce qu’elle a dédaigné les relations avec son mari[a] et choisi la maîtrise de soi. »


    **2.** Et si Léa, ma mère, n’avait pas donné les deux pommes[b] en échange de relations conjugales, elle aurait enfanté huit fils ; voilà pourquoi elle en enfanta six, tandis que Rachel en enfanta deux, car, par les mandragores, le Seigneur intervint en sa faveur[c].'
  rationale: La révision corrige l’ajout modal de « aurait dû », traduit μῆλα par « pommes » et reformule la note afin de préserver la distinction du grec avec les mandragores. Elle améliore aussi une redondance française sans modifier le sens ni résoudre les tensions de la tradition.
