  text: '1[a]. Then an angel of the Lord appeared to Jacob and said, “Rachel will bear two children, because she despised intercourse with a husband and chose self-control.” 2. And Leah took mandrakes, and for them hired me for one night. 3. Because of the mandrakes, therefore, Jacob went in to Rachel rather than to me. 4. But the Lord gave heed to my prayer, and I conceived. 5. For I envied Rachel because she was bearing children, while I was childless. 6. And the Lord heard me, and he gave me this fruit. 7. Because I had offered the mandrakes to the Lord through the priest of the Most High, therefore he gave me Issachar as wages. 8. So then, my children, hear Issachar your father. 9. I was born as wages because of the mandrakes, and I became to my father a reward of hire. 10. Therefore I was called Issachar, which means “hire.” 11. And now, children, hear me: walk in simplicity of heart, because I have seen that all who are guileless in heart prevail over every evil. 12. For if a man does
    not desire gold[b], he does not wrong his neighbor; he does not crave many delicacies; he does not delight in varied clothing. 13. He does not long to live many days; only he waits for the will of God. 14. And the spirits of deceit have no power against him, for he does not look on the beauty of women, lest he pollute his mind with corruption. 15. There is no envy in his thoughts, no malicious person darkens his soul, and no greed distresses his life. 16. He walks in uprightness of life, and he sees all things in sincerity, shunning excess in the desire for worldly gain, so that he may not see the corruption of the commandments of the Lord. 17. Therefore, my children, keep the law of God, and gain singleness of heart, and walk without guile, not busying yourselves with meddling in the affairs of your neighbor, 18. but love the Lord and your neighbor; have compassion on the poor and the weak. 19. Bow your back to farming, and labor in all kinds of fieldwork, offering thanksgiving to the
    Lord. 20. For from the firstfruits of the earth the Lord will bless you, just as he blessed all the saints from Abel until now. 21. For no other portion is given to you than the fatness of the earth, whose fruits are raised by toil. 22. For our father Jacob blessed me with blessings of the earth and of firstfruits. 23. Levi and Judah were glorified by the Lord among the sons of Jacob; to them he gave an inheritance, and to me he gave the things of the earth, with firstfruits of fruits. 24. Therefore be not eager for adornment, nor for luxury in food, 25. but cultivate the land in singleness of heart, and take from it the firstfruits for the Lord. 26. For if you do these things, every spirit of Beliar will flee from you, and no deed of wickedness will rule over you. 27. And you will eat every good thing of the earth, and your sons after you. 28. But know that in the last times your sons will abandon singleness of heart, and will cling to insatiable desire; 29. they will forsake innocence
    and draw near to malice; they will leave the commandments of the Lord and cling to Beliar; 30. they will abandon farming and follow after their own evil schemes; and they will be scattered among the nations and serve their enemies. 31. Therefore tell these things to your children, so that if they sin, they may quickly return to the Lord. 32. For he is merciful[c], and he will deliver them and bring them back into their land.'
translation:
  language: fr
  text: '**Testament d’Issacar 2**


    **1.** Alors donc, un ange du Seigneur apparut à Jacob et lui dit : « Rachel mettra des enfants au monde, parce qu’elle a dédaigné les relations avec son mari[a] et choisi la maîtrise de soi. »


    **2.** Et si Léa, ma mère, n’avait pas donné les deux pommes[b] en échange de relations conjugales, elle aurait enfanté huit fils ; voilà pourquoi elle en enfanta six, tandis que Rachel en enfanta deux, car, par les mandragores, le Seigneur intervint en sa faveur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les relations avec un homme ». Le verbe grec traduit par « dédaigné » est particulièrement fort et peut aussi se rendre par « méprisé » ou « repoussé avec mépris ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « les deux pommes », puis mentionne les mandragores plus loin dans le verset. Le passage fait écho à Genèse 30.14-18.'
    reason: textual_and_cross_reference
  - marker: c
    text: 'Littéralement : « le Seigneur la visita ». Dans ce contexte, cette expression désigne son intervention favorable, qui accorde à Rachel d’enfanter.'
    reason: idiom_clarification
lexical_decisions:
- source_word: τέκνα τέξει
  choice: enfantera des enfants
  rationale: Le grec emploie un pluriel indéfini et ne précise pas ici le nombre. La traduction conserve cette indétermination plutôt que d’introduire « deux » depuis le contexte ultérieur.
- source_word: κατέπτυσεν
  choice: a dédaigné
  rationale: Le verbe exprime un rejet marqué, voire méprisant. « Dédaigné » conserve cette force inhabituelle sans l’atténuer.
- source_word: συνουσίαν ἀνδρός
  choice: les relations avec son mari
  rationale: Dans ce contexte conjugal, συνουσία désigne les rapports sexuels. Cette formulation française reste claire et digne tout en laissant la note signaler la rudesse du grec.
- source_word: ἐγκράτειαν
  choice: la maîtrise de soi
  rationale: Terme éthique désignant la retenue ou le contrôle de ses désirs ; « maîtrise de soi » est naturel en français moderne.
- source_word: τὰ δύο μῆλα
  choice: les deux fruits
  rationale: Μῆλα signifie littéralement « pommes » ou, plus largement, « fruits ». Le contexte les identifie aux mandragores, mais « fruits » préserve la formulation distincte du texte avant la mention explicite des mandragores.
- source_word: ἀντὶ συνουσίας ἀπέδοτο
  choice: avait donné … en échange de relations conjugales
  rationale: 'La construction indique un échange : Léa cède les fruits en contrepartie de l’accès conjugal à Jacob. La formulation évite d’obscurcir cette logique tout en restant sobre.'
- source_word: ἐπεσκέψατο αὐτὴν ὁ Κύριος
  choice: le Seigneur intervint en sa faveur
  rationale: Le verbe ἐπισκέπτομαι peut signifier « visiter », mais désigne ici l’intervention favorable de Dieu qui accorde la fécondité. La traduction rend le sens contextuel sans préciser indûment le mécanisme.
theological_decisions:
- issue: Éloge de Rachel pour son refus des relations conjugales
  choice: Traduire directement le témoignage grec comme un choix de maîtrise de soi, sans harmoniser avec le récit de la Genèse.
  alternative: Comprendre une abstinence seulement temporaire ou atténuer le verbe en « renoncer » sans sa nuance de mépris.
  rationale: Le grec associe explicitement le dédain des relations avec un mari au choix de l’ἐγκράτεια. La tension interprétative est donc conservée et signalée en note.
- issue: Nombre d’enfants annoncé au verset 1
  choice: Conserver le pluriel indéfini « des enfants ».
  alternative: Traduire « deux enfants » en anticipant le verset 2.
  rationale: Le texte grec fourni dit τέκνα sans numéral. Le nombre de deux apparaît seulement ensuite et ne doit pas être rétroactivement introduit dans la parole angélique.
- issue: Action du Seigneur liée aux mandragores
  choice: 'Maintenir le lien causal formulé par le texte : le Seigneur intervient en faveur de Rachel « par les mandragores ».'
  alternative: Réduire les mandragores à une simple circonstance narrative sans rapport avec l’intervention divine.
  rationale: La construction ἐν τοῖς μανδραγόροις … ὁ Κύριος établit explicitement ce lien. La traduction le conserve sans expliquer comment les mandragores se rapportent à l’action divine.
translation_notes:
  register: Français international moderne, sobre et testamentaire. La syntaxe causale et le contraste numérique entre les huit fils potentiels de Léa, ses six fils effectifs et les deux fils de Rachel sont conservés. La traduction suit exclusivement les deux versets du texte grec fourni ; elle ne reprend pas les développements supplémentaires présents dans la couche anglaise de consultation.
