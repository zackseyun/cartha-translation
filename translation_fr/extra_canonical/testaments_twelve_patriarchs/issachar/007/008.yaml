  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/008.yaml
  text: And after saying these things, he commanded his sons to carry him up to Hebron, and there to bury him with his fathers.
translation:
  language: fr
  text: Après avoir dit cela, il ordonna à ses fils de le transporter jusqu’à Hébron et de l’y ensevelir avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγάγωσιν
  choice: transporter jusqu’à
  rationale: Le verbe exprime littéralement l’idée de faire monter ou d’emmener vers un lieu. Dans ce contexte funéraire, « transporter jusqu’à » rend naturellement le déplacement du corps vers Hébron sans imposer en français une indication topographique trop appuyée.
- source_word: θάψωσιν
  choice: ensevelir
  rationale: « Ensevelir » est un équivalent français actuel et digne de « mettre au tombeau », adapté au contexte funéraire.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: La formulation conserve l’expression généalogique traditionnelle du grec et son possible sens d’inhumation auprès des ancêtres.
theological_decisions:
- issue: Sens de « avec ses pères »
  choice: Conserver l’expression littérale « avec ses pères »
  alternative: « auprès de ses ancêtres »
  rationale: Le grec permet de comprendre une inhumation dans le même lieu que les patriarches, tout en employant la formule traditionnelle « ses pères ». La traduction préserve cette résonance sans l’expliciter davantage.
translation_notes:
  register: Français international moderne, fluide et digne. La coordination est légèrement resserrée afin d’éviter une répétition lourde de « il » tout en maintenant clairement les deux ordres donnés aux fils.
