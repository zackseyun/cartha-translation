  text: 8. *Καὶ ταῦτα εἰπὼν ἐνετείλατο τοῖς υἱοῖς αὐτοῦ³⁰ ὅπως ἀναγάγωσιν αὐτὸν³¹ ἐν³² Χεβρών³³, κακεῖ³⁴ θάψωσιν αὐτὸν³⁵ Γμετὰ τῶν πατέρων αὐτοῦ³⁶.
