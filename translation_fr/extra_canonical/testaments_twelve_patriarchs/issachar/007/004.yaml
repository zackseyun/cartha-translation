  text: No deceit came to be in my heart, and no lie went up through my lips.
translation:
  language: fr
  text: Il n’y a pas eu de tromperie dans mon cœur, et aucun mensonge n’est sorti de mes lèvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δόλος
  choice: la tromperie
  rationale: Rend l’idée de ruse ou de duplicité de façon naturelle et suffisamment large en français moderne.
- source_word: οὐκ ἐγένετο
  choice: n’a pas pris naissance
  rationale: Préserve l’idée littérale de venue à l’existence tout en produisant une formulation française intelligible.
- source_word: ἐν τῇ καρδίᾳ μου
  choice: dans mon cœur
  rationale: Conserve l’image anthropologique du texte grec, où le cœur désigne le for intérieur.
- source_word: ψεῦδος
  choice: aucun mensonge
  rationale: Le nom français correspond directement au grec et la négation française exige ici naturellement « aucun ».
- source_word: οὐκ ἀνῆλθε διὰ τῶν χειλέων μου
  choice: n’est monté jusqu’à mes lèvres
  rationale: Maintient l’image ascendante inhabituelle du grec tout en rendant διά par une destination idiomatique; « à travers mes lèvres » serait plus formel mais moins naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme entre le cœur et les lèvres est conservé, de même que l’image du mensonge qui « monte ».
