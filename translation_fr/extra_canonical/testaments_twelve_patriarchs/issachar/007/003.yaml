    issue: Réflexivité ajoutée dans « pour m’égarer »
    rationale: Le grec ne comporte aucun pronom réfléchi. Ἀποπλάνησις renvoie à l’égarement ou à la tromperie, mais le texte ne précise pas que le vin avait pour but d’égarer le locuteur lui-même.
  - severity: medium
    issue: Restriction de πᾶν ἐπιθύμημα à un « bien » appartenant au prochain
    rationale: « Bien » et « de mon prochain » orientent vers la propriété. La construction grecque peut désigner tout ce que désire le prochain; il convient de ne pas réduire cette expression à des biens possédés.
