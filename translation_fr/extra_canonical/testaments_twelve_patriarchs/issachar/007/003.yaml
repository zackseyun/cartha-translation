source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. Οἶνον⁶ εἰς ἀποπλάνησιν οὐκ ἔπιον· ⌈πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: fr
  text: Je n’ai pas bu de vin à des fins de tromperie, et je n’ai rien convoité de ce que désirait mon prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἀποπλάνησιν
  choice: pour m’égarer
  rationale: La tournure exprime le but ou l’effet recherché. Le moyen « s’égarer » conserve l’idée de déviation ou d’égarement sans réduire le sens à la tromperie exercée sur autrui.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: aucun bien de mon prochain
  rationale: Dans cette construction avec ἐπιθυμέω, l’expression désigne naturellement une chose désirable appartenant au prochain. « Bien » donne en français un objet clair au verbe tout en restant général.
- source_word: οὐκ ἐπεθύμησα
  choice: je n’ai convoité
  rationale: « Convoiter » rend la force du désir dirigé vers ce qui appartient au prochain et fait écho au vocabulaire biblique courant.
theological_decisions:
- issue: Sens de l’usage du vin
  choice: pour m’égarer
  alternative: pour tromper
  rationale: ἀποπλάνησις peut évoquer l’égarement ou la séduction. Le contexte immédiat ne précise pas si Issacar tromperait autrui ou se laisserait détourner; la formulation retenue privilégie le sens directement lié à l’effet du vin sans introduire une victime extérieure.
translation_notes:
  register: Français moderne, sobre et digne. La coordination simple reproduit le parallélisme des deux déclarations négatives.
