  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: fr
  text: Puis il étendit ses pieds et mourut dans une heureuse vieillesse, ayant tous ses membres sains. Vigoureux, il s’endormit du sommeil éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: il étendit les pieds
  rationale: Rend directement le geste physique du texte grec sans l’interpréter davantage comme une posture funéraire.
- source_word: ἐν γήρει καλῷ
  choice: dans une heureuse vieillesse
  rationale: Expression française naturelle qui conserve l’idée d’une vieillesse bonne et favorable.
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: tous ses membres étant en bonne santé
  rationale: Préserve la portée distributive de πᾶν et le sens corporel de μέλος dans un français clair.
- source_word: ἰσχύων
  choice: encore vigoureux
  rationale: Exprime la force physique persistante au moment de la mort; « encore » explicite naturellement le contraste contextuel sans modifier le fond.
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: il s’endormit du sommeil éternel
  rationale: Conserve la figure étymologique et la métaphore du sommeil présente en grec, ainsi que sa portée théologique non explicitée.
theological_decisions:
- issue: Sens du « sommeil éternel »
  choice: Conserver littéralement « il s’endormit du sommeil éternel »
  alternative: Paraphraser simplement par « il mourut » ou interpréter l’expression en fonction d’une doctrine de l’au-delà
  rationale: Le grec emploie explicitement la métaphore du sommeil après avoir déjà mentionné la mort. La traduction préserve cette tension sans imposer une lecture doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La seconde phrase évite une longue accumulation participiale peu naturelle en français, tout en gardant le lien entre vigueur physique et mort.
