  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : le geste, la mort dans une heureuse vieillesse, l’intégrité corporelle, la vigueur et la métaphore du sommeil éternel sont conservés. Toutefois, le grec dit explicitement « ses pieds », et « encore vigoureux » ajoute une nuance temporelle absente de ἰσχύων.'
  naturalness: Le français est globalement clair et d’un registre approprié. « Dans une heureuse vieillesse » est une tournure biblique française établie et naturelle dans ce contexte. La coordination finale peut être rendue plus directement sans alourdir la phrase.
  terminology: « Membres sains » restitue plus précisément ὑγιές appliqué à chaque membre que « membres étant en bonne santé ». « Sommeil éternel » préserve correctement la figure du grec sans imposer d’interprétation doctrinale.
