id: T12P.ISS.7.1
reference: Testament of Issachar 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: fr
  text: 'Voyez donc, comme vous le constatez : j’ai cent vingt-six ans, et je n’ai connu en moi aucun péché qui mène à la mort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je n’ai connu en moi aucun péché vers la mort ». L’expression peut désigner un péché qui conduit à la mort, sans préciser davantage le rapport exact entre le péché et la mort.'
    reason: Corrige l’équivalence inexacte « jusqu’à la mort » et signale sobrement l’ambiguïté de εἰς θάνατον.
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: Voyez donc
  rationale: Rend l’appel à l’attention ἰδού et la valeur conclusive de οὖν dans un français actuel et digne.
- source_word: ὡς ὁρᾶτε
  choice: comme vous le constatez
  rationale: Conserve l’idée de perception visuelle ou évidente de ὁράω, tout en évitant la répétition peu naturelle « Voyez… comme vous voyez ».
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: j’ai cent vingt-six ans
  rationale: Expression française idiomatique et exacte de l’âge indiqué par le grec.
- source_word: οὐκ ἔγνων … ἐν ἐμοὶ ἁμαρτίαν
  choice: je n’ai connu en moi aucun péché
  rationale: Suit de près la formulation grecque et n’ajoute ni l’idée explicite d’avoir commis le péché ni celle d’une simple conscience subjective.
- source_word: εἰς θάνατον
  choice: qui mène à la mort
  rationale: Exprime la direction ou l’aboutissement porté par εἰς sans déterminer davantage la nature de la mort.
theological_decisions:
- issue: Rapport du péché à la mort
  choice: un péché qui mène à la mort
  alternative: un péché mortel / un péché jusqu’à la mort
  rationale: La traduction retenue préserve la portée directionnelle de εἰς θάνατον sans importer une catégorie doctrinale technique; une note signale la traduction plus littérale.
- issue: Nature de l’affirmation d’Issacar
  choice: je n’ai connu en moi aucun péché
  alternative: je n’ai pas eu conscience d’avoir commis de péché
  rationale: Le grec parle littéralement de connaître un péché « en moi »; il ne précise pas explicitement s’il s’agit d’absence réelle ou d’absence de conscience. La formulation conserve cette tension.
translation_notes:
  register: Français moderne international, sobre et testamentaire. « Comme vous le constatez » évite une répétition maladroite tout en restant proche du grec. La syntaxe « connu en moi » est volontairement plus formelle afin de préserver l’ambiguïté de l’original.
