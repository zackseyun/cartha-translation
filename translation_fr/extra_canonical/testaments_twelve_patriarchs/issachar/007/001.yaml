    text: 'Littéralement : « je n’ai connu en moi aucun péché vers la mort ». L’expression peut désigner un péché qui conduit à la mort, sans préciser davantage le rapport exact entre le péché et la mort.'
    reason: Corrige l’équivalence inexacte « jusqu’à la mort » et signale sobrement l’ambiguïté de εἰς θάνατον.
  revision_rationale: Révision limitée à la ponctuation et à la note. Le texte principal conserve les choix fidèles du projet, notamment « je n’ai connu en moi » et « qui mène à la mort », tandis que la note décrit désormais εἰς θάνατον sans lui attribuer la valeur temporelle de « jusqu’à ».
