  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: fr
  text: Vous aussi, mes enfants, faites ces choses, et tout esprit de Béliar fuira loin de vous. Aucune action d’hommes mauvais ne dominera sur vous, et vous soumettrez toute bête sauvage, ayant avec vous le Dieu du ciel et de la terre, qui chemine avec les êtres humains dans la simplicité du cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ... ποιεῖτε
  choice: faites cela
  rationale: Rend directement l’impératif et le démonstratif pluriel grec, le français employant naturellement le singulier collectif « cela ».
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  choice: tout esprit de Béliar
  rationale: Conserve la formulation distributive et le nom propre du texte grec sans interpréter la nature exacte de ces esprits.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: Aucune action des hommes mauvais ne dominera sur vous
  rationale: La négation française avec « aucune » exprime naturellement la portée de πᾶσα ... οὐ, tandis que « dominer sur » maintient l’image d’autorité de κυριεύσει.
- source_word: πᾶν ἄγριον θηρίον καταδουλώσετε
  choice: vous soumettrez toute bête sauvage
  rationale: « Soumettre » traduit la domination forte de καταδουλόω sans imposer le sens français plus étroit d’un esclavage institutionnel.
- source_word: συμπορευόμενον
  choice: qui accompagne
  rationale: Le participe signifie aller ou cheminer avec quelqu’un ; « accompagne » est actuel, naturel et fidèle à cette idée.
- source_word: ἐν ἁπλότητι καρδίας
  choice: dans la simplicité du cœur
  rationale: Maintient l’expression anthropologique et éthique littérale, dont la portée peut inclure sincérité, droiture et absence de duplicité.
theological_decisions:
- issue: Identité et statut de Béliar
  choice: Conserver « Béliar » comme nom propre sans explication dans le corps du texte
  alternative: Identifier explicitement Béliar à Satan ou au diable
  rationale: Le grec nomme Béliar mais ne formule pas ici cette identification ; la traduction préserve donc la donnée textuelle sans harmonisation doctrinale.
- issue: Relation entre la présence divine et la simplicité du cœur
  choice: Conserver le rattachement grammatical de « dans la simplicité du cœur » à l’accompagnement divin des êtres humains
  alternative: Comprendre la simplicité du cœur uniquement comme la disposition des personnes qui ont Dieu avec elles
  rationale: Le participe συμπορευόμενον et le complément qui le suit favorisent le premier rattachement, tout en laissant subsister la densité théologique de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement resserrée en trois propositions pour éviter une période trop lourde, sans supprimer les rapports logiques du grec. « Car » explicite la valeur circonstancielle du participe ἔχοντες, naturellement causale ici.
