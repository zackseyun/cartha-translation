  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/006.yaml
  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: fr
  text: J’ai aimé le Seigneur et tout être humain de tout mon cœur, plus que mes enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον ἠγάπησα
  choice: J’ai aimé le Seigneur
  rationale: Rend directement l’aoriste ἠγάπησα et le titre Κύριον dans un français naturel et digne.
- source_word: πάντα ἄνθρωπον
  choice: toute personne
  rationale: Exprime la portée distributive de l’expression grecque sans employer « tout homme », qui peut aujourd’hui paraître limité au genre masculin.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: de tout mon cœur
  rationale: Équivalent idiomatique fidèle à l’expression grecque de totalité intérieure.
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: plus que mes propres enfants
  rationale: Dans cette construction comparative, ὑπέρ signifie « plus que ». « Propres » explicite naturellement en français la relation déjà indiquée par μου, sans modifier le sens.
theological_decisions:
- issue: Objet humain universel de l’amour
  choice: toute personne
  alternative: tout être humain
  rationale: Le singulier distributif πάντα ἄνθρωπον inclut chaque personne; la formulation retenue conserve cette universalité sans ajout doctrinal.
- issue: Comparaison entre l’amour universel et l’amour des enfants
  choice: plus que mes propres enfants
  alternative: au-dessus de mes enfants
  rationale: La valeur comparative de ὑπέρ avec l’accusatif est ici la lecture la plus naturelle; elle conserve la tension frappante du texte au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, clair et digne. La coordination simple du grec est conservée, ainsi que la comparaison volontairement forte de la dernière proposition.
