  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/002.yaml
  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: fr
  text: À part mon épouse, je n’en ai connu aucune autre. Je n’ai pas commis d’immoralité sexuelle par le vagabondage de mes yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῆς συμβίου μου
  choice: mon épouse
  rationale: Le substantif σύμβιος désigne ici la femme avec qui Issacar partage sa vie, donc son épouse.
- source_word: οὐκ ἔγνων ἄλλην
  choice: je n’en ai connu aucune autre
  rationale: Le verbe « connaître » conserve l’euphémisme biblique à portée sexuelle; « en » rend naturel en français le féminin implicite de ἄλλην sans ajouter explicitement « femme ».
- source_word: Οὐκ ἐπόρνευσα
  choice: Je ne me suis pas livré à l’immoralité sexuelle
  rationale: Cette formulation exprime largement le champ sexuel de πορνεύω sans le limiter au seul adultère ni employer le terme français vieilli « fornication ».
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: en laissant mes yeux vagabonder
  rationale: L’expression grecque évoque le regard qui s’élève, s’égare ou se porte ailleurs; cette tournure idiomatique française garde l’image des yeux et son lien avec le désir.
theological_decisions:
- issue: Nature précise de l’inconduite sexuelle
  choice: immoralité sexuelle
  alternative: adultère
  rationale: Le grec πορνεύω a une portée plus large que l’adultère; la traduction ne précise donc pas une faute que le texte ne circonscrit pas.
- issue: Rapport entre le regard et l’acte sexuel
  choice: en laissant mes yeux vagabonder
  alternative: par le vagabondage de mes yeux
  rationale: La préposition ἐν permet plusieurs nuances instrumentales ou circonstancielles. La formulation retenue conserve le lien sans construire une doctrine plus précise sur l’intention ou la culpabilité du regard.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux déclarations à la première personne est conservé, ainsi que l’euphémisme biblique « connaître ».
