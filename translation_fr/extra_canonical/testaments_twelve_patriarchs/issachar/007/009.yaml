  text: 9. Καὶ ἐκτείνας τοὺς πόδας αὐτοῦ³⁷ ἐκοιμήθη ἐν γήρει καλῷ ὕπνον αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/009.yaml
  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: fr
  text: Puis il étendit ses pieds et s’endormit, dans une bonne vieillesse, du sommeil éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: il étendit les pieds
  rationale: Rend directement le geste final décrit par le grec, sans lui ajouter d’interprétation.
- source_word: ἐκοιμήθη
  choice: s’endormit
  rationale: Préserve l’euphémisme du sommeil pour la mort ainsi que son lien rhétorique avec ὕπνον.
- source_word: ἐν γήρει καλῷ
  choice: parvenu à une heureuse vieillesse
  rationale: Formulation française naturelle qui conserve l’appréciation positive de καλῷ et situe la mort au terme de la vieillesse.
- source_word: ὕπνον αἰώνιον
  choice: du sommeil éternel
  rationale: Reproduit l’accusatif de contenu grec par la tournure idiomatique française « s’endormir du sommeil… », sans expliciter davantage la nature de cet état.
theological_decisions:
- issue: Portée de l’expression « sommeil éternel »
  choice: Conserver littéralement l’image du « sommeil éternel »
  alternative: Paraphraser par « mourut » ou interpréter explicitement l’état après la mort
  rationale: Le grec emploie une métaphore funéraire dont la portée théologique ne doit pas être résolue ou précisée par la traduction.
translation_notes:
  register: Français moderne, digne et accessible. La légère répétition entre « s’endormit » et « sommeil » est intentionnelle et reflète la figure étymologique du grec. Le chiffre 37 de l’édition est traité comme un appel d’apparat critique non documenté dans les données fournies, et non comme un élément du texte à publier.
