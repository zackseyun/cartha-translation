id: T12P.ISS.7.5
reference: Testament of Issachar 7:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: fr
  text: J’ai gémi avec toute personne qui souffrait, et j’ai partagé mon pain avec le pauvre. J’ai pratiqué la piété tous les jours de ma vie ; j’ai gardé la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ
  choice: qui souffrait
  rationale: Le participe désigne une personne éprouvant douleur ou détresse ; « qui souffrait » est naturel et conserve la portée générale du grec.
- source_word: συνεστέναξα
  choice: j’ai gémi avec
  rationale: Rend explicitement le préfixe συν-, qui exprime la participation à la douleur d’autrui, sans réduire le verbe à la seule compassion intérieure.
- source_word: πτωχῷ
  choice: le pauvre
  rationale: Correspond directement au singulier grec et maintient la formulation représentative du texte source.
- source_word: μετέδωκα
  choice: j’ai partagé
  rationale: Exprime l’action de donner une part de ce que l’on possède, ici le pain du locuteur.
- source_word: Εὐσέβειαν ἐποίησα
  choice: J’ai pratiqué la piété
  rationale: Formulation française naturelle pour l’expression littérale « faire la piété », désignant une conduite pieuse concrète.
- source_word: ᾿Αλήθειαν ἐφύλαξα
  choice: j’ai gardé la vérité
  rationale: Conserve l’image du verbe φυλάσσω, « garder, préserver, observer », ainsi que la densité morale de ἀλήθεια sans la préciser indûment.
theological_decisions:
- issue: Sens de εὐσέβεια
  choice: piété
  alternative: fidélité envers Dieu
  rationale: « Piété » conserve la notion large d’une conduite respectueuse envers Dieu sans introduire une explicitation absente du grec.
- issue: Portée de ἀλήθεια
  choice: la vérité
  alternative: la loyauté
  rationale: Le terme peut comporter une dimension de sincérité ou de fidélité, mais « vérité » préserve son sens premier et son ouverture sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des affirmations à la première personne est conservé, avec un point-virgule pour marquer le lien étroit entre la pratique de la piété et la garde de la vérité.
