    **1.** Copie des paroles d’Issachar. Ayant appelé ses fils, il leur dit : Écoutez, enfants de votre père Issachar ; prêtez l’oreille aux paroles de celui que le Seigneur aime.


    **2.** Je suis né comme cinquième fils de Jacob, en salaire des mandragores.


    **3.** En effet, mon frère Ruben avait rapporté des mandragores des champs. Rachel vint à sa rencontre et les prit.


    **4.** Mais Ruben pleurait ; en entendant sa voix, Léa, ma mère, sortit.


    **5.** C’étaient des fruits parfumés[a], qui poussent au pays de Haran, au-dessous d’un ravin où coule de l’eau.


    **6.** Rachel dit : « Je ne te les donnerai pas ; je veux les avoir à la place d’enfants. Car le Seigneur m’a délaissée, et je n’ai pas eu d’enfants de Jacob. »


    **7.** Il y avait donc deux fruits. Léa dit à Rachel : « Ne te suffit-il pas d’avoir pris mon mari ? Vas-tu encore me prendre ces fruits ? »


    **8.** Rachel lui répondit : « Que Jacob soit à toi cette nuit en échange des mandragores de ton fils. »


    **9.** Mais Léa lui dit : « Jacob est à moi, car je suis la femme de sa jeunesse. »


    **10.** Rachel répondit : « Ne te vante pas et ne cherche pas à te glorifier : il m’a prise pour femme avant toi, et c’est pour moi qu’il a servi notre père pendant quatorze ans.


    **11.** Si la tromperie ne s’était pas multipliée sur la terre et si la méchanceté humaine ne s’y était pas répandue, tu ne verrais pas aujourd’hui le visage de Jacob.


    **12.** Mais Laban m’a trompée par ruse et m’a écartée cette nuit-là. Il n’a pas permis à Jacob de me voir ; car si j’avais été là, cela ne lui serait pas arrivé.


    **13.** Malgré tout, en échange des mandragores, je te louerai Jacob pour une nuit. »


    **14.** Rachel poursuivit : « Je prendrai une des mandragores et, en échange de celle-ci, je te louerai Jacob pour la nuit. »[b]


    **15.** Jacob connut Léa ; elle devint enceinte et me mit au monde. C’est en raison de ce salaire que je fus appelé Issachar[c].'
