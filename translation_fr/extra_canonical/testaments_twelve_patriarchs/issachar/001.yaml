  rationale: La révision conserve le contenu, la numérotation et les ambiguïtés du témoin grec transmis, notamment l’ajout textuellement incertain du v. 14. Elle corrige les formulations françaises qui obscurcissaient les relations grammaticales ou le sens matrimonial et transactionnel, tout en maintenant la tension et l’étrangeté du récit.
