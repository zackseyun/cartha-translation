base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/004.yaml
  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: fr
  text: Car le Seigneur vous bénira dans les prémices des fruits de la terre, comme il a béni tous les saints, d’Abel jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: par les prémices des produits de la terre
  rationale: « Prémices » rend le langage cultuel de πρωτογεννήμασιν, tandis que « produits de la terre » exprime naturellement καρπῶν τῆς γῆς. La préposition « par » conserve ici l’idée de la sphère ou du moyen dans lequel la bénédiction se manifeste.
- source_word: εὐλογήσει ὑμᾶς Κύριος
  choice: le Seigneur vous bénira
  rationale: Rend directement le futur grec et place naturellement le sujet en français.
- source_word: πάντας τοὺς ἁγίους
  choice: tous les saints
  rationale: Traduction formelle et intelligible de l’expression, sans préciser davantage l’identité de ces personnes.
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: depuis Abel jusqu’à maintenant
  rationale: Préserve l’étendue temporelle explicite du grec et son point d’arrivée au présent du locuteur.
theological_decisions:
- issue: Identité de « tous les saints »
  choice: Conserver « tous les saints » sans explication dans le texte
  alternative: « tous ceux qui lui appartiennent » ou « tous les hommes saints »
  rationale: Le grec ne définit pas plus précisément le groupe; une paraphrase risquerait d’imposer une interprétation théologique absente du texte.
- issue: Rapport entre les prémices et la bénédiction
  choice: Employer « par les prémices »
  alternative: « dans les prémices » ou « en vous donnant les prémices »
  rationale: La construction grecque ἐν peut exprimer la sphère, la circonstance ou le moyen. « Par » donne une phrase française naturelle sans déterminer précisément si les prémices sont le moyen ou la manifestation de la bénédiction.
translation_notes:
  register: Français international moderne, digne et accessible. « Prémices » est maintenu en raison de sa précision biblique et cultuelle; la syntaxe reste fluide sans développer les ambiguïtés du grec.
