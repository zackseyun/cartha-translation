revisions:
- from: Car le Seigneur vous bénira par les prémices des produits de la terre, comme il a béni tous les saints depuis Abel jusqu’à maintenant.
  to: Car le Seigneur vous bénira dans les prémices des fruits de la terre, comme il a béni tous les saints, d’Abel jusqu’à ce jour.
  rationale: La révision rétablit l’ambiguïté de ἐν au moyen de « dans », emploie le correspondant lexical direct « fruits », et clarifie en français la portée de la période allant d’Abel au présent du locuteur. Aucun ajout théologique ni note textuelle n’est nécessaire.
