- from: Ainsi donc, mes enfants, gardez la loi de Dieu, recherchez la simplicité et marchez dans l’innocence, sans vous mêler des actes de votre prochain.
  to: Ainsi donc, mes enfants, gardez la loi de Dieu, acquérez la simplicité et marchez dans l’innocence, sans vous occuper des actes de votre prochain.
  rationale: La révision rétablit la force de κτήσασθε par « acquérez » et rend plus clairement μὴ περιαργαζόμενοι tout en conservant la formulation ouverte du grec quant à la nature des actes du prochain.
