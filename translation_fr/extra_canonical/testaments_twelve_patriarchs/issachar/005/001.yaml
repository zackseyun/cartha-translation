base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: fr
  text: Ainsi donc, mes enfants, gardez la loi de Dieu, acquérez la simplicité et marchez dans l’innocence, sans vous occuper des actes de votre prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: gardez
  rationale: Rend l’impératif par le verbe biblique courant « garder », au sens d’observer fidèlement.
- source_word: τὴν ἁπλότητα κτήσασθε
  choice: recherchez la simplicité
  rationale: κτάομαι signifie acquérir ou se procurer. « Recherchez » exprime naturellement en français l’appel à faire sienne cette disposition, sans suggérer un achat ou une possession matérielle.
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: marchez dans l’innocence
  rationale: Conserve la métaphore éthique de la marche et rend ἀκακία par « innocence », ici absence de malice ou de méchanceté.
- source_word: μὴ περιαργαζόμενοι
  choice: sans vous mêler
  rationale: Le verbe désigne le fait de s’occuper indiscrètement de ce qui ne regarde pas quelqu’un; cette tournure française est naturelle et garde la nuance d’ingérence.
- source_word: τοῦ πλησίον τὰς πράξεις
  choice: des actes de votre prochain
  rationale: « Prochain » préserve le vocabulaire éthique et biblique de πλησίον; « actes » rend πράξεις sans préciser leur valeur morale.
theological_decisions:
- issue: Sens moral de ἁπλότης et ἀκακία
  choice: « simplicité » et « innocence »
  alternative: « sincérité » et « absence de malice »
  rationale: Le texte juxtapose deux qualités apparentées mais distinctes. Les termes retenus maintiennent cette tension et restent proches du grec sans leur attribuer une définition doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination exhortative du grec est conservée, tout en employant une formulation idiomatique pour l’interdiction finale.
