  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: fr
  text: 'Lévi et Juda furent glorifiés par le Seigneur parmi les fils de Jacob. Le Seigneur leur attribua leur héritage : à Lévi, le sacerdoce, et à Juda, la royauté.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: furent glorifiés
  rationale: Conserve la voix passive et le sens d’honneur ou de gloire conféré par le Seigneur.
- source_word: ἐκληροδότησεν αὐτούς
  choice: leur attribua leur héritage
  rationale: Rend l’idée d’une attribution de part héréditaire, dans une formulation française naturelle, sans suggérer que les personnes elles-mêmes auraient été données en héritage.
- source_word: ἱερατείαν
  choice: sacerdoce
  rationale: Terme français courant et précis pour la fonction ou dignité sacerdotale.
- source_word: βασιλείαν
  choice: royauté
  rationale: Désigne ici la dignité et l’autorité royales attribuées à Juda, plutôt qu’un territoire politique.
theological_decisions:
- issue: Nature des attributions faites à Lévi et à Juda
  choice: le sacerdoce et la royauté
  alternative: la prêtrise et le royaume
  rationale: La formulation retenue exprime des charges ou prérogatives institutionnelles parallèles, sans ajouter de lecture confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle du grec est conservée, avec une ponctuation naturelle en français.
