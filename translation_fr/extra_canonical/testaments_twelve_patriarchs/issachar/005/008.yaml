base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: fr
  text: Vous aussi donc, obéissez-leur et marchez dans la simplicité de votre père. [Mais à Gad, il a été donné de détruire les bandes de pillards qui s’avancent contre Israël.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le passage entre crochets présente une incertitude textuelle dans la tradition grecque.
    reason: Informer le lecteur de la raison éditoriale des crochets sans supprimer ni normaliser le texte.
lexical_decisions:
- source_word: ὑπακούετε
  choice: obéissez-leur
  rationale: Rend directement l’impératif présent et conserve le pronom pluriel αὐτοῖς.
- source_word: ἁπλότητι
  choice: simplicité
  rationale: Conserve le sens moral de droiture, sincérité et absence de duplicité sans le réduire à une seule interprétation.
- source_word: περιπατεῖτε
  choice: marchez
  rationale: Préserve la métaphore biblique de la conduite de vie, naturelle dans un registre scripturaire français.
- source_word: πειρατήρια
  choice: bandes de pillards
  rationale: Le terme désigne vraisemblablement des groupes de maraudeurs ou de brigands plutôt que des attaques abstraites.
- source_word: ἐπερχόμενα
  choice: qui fondraient sur
  rationale: Exprime le mouvement hostile contre Israël et s’accorde naturellement avec « bandes ».
theological_decisions:
- issue: Sens de « la simplicité de votre père »
  choice: simplicité
  alternative: droiture / sincérité
  rationale: Le grec ἁπλότης peut évoquer la simplicité, la sincérité ou la droiture; le terme français retenu maintient cette amplitude et le lien littéral avec la qualité attribuée au père.
- issue: Valeur de ἐδόθη
  choice: il a été donné
  alternative: Dieu a accordé
  rationale: La formulation passive conserve le passif divin possible sans expliciter un agent que le grec ne nomme pas.
- issue: Statut du passage sur Gad
  choice: maintien entre crochets
  alternative: intégration sans crochets
  rationale: Les crochets de l’édition signalent une incertitude ou particularité textuelle qu’il convient de préserver.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « marchez » est conservée pour sa portée éthique et biblique; « bandes de pillards » évite l’expression moins naturelle « raids de maraude ».
