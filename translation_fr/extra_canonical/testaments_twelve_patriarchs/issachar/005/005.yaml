source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. Οὐ γὰρ δέδοται ὑμῖν²⁴ ἄλλη μερὶς Γ*εἰ μὴ²⁵ *τῆς πιότητος²⁶ τῆς γῆς *ἐν πόνοις καρπῶν²⁷¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/005.yaml
  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: fr
  text: Car aucune autre part ne vous a été donnée, si ce n’est la fertilité de la terre, avec le labeur des récoltes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les peines des fruits ». L’expression grecque peut désigner le labeur lié aux produits de la terre; son lien exact avec la « part » donnée reste condensé.'
    reason: La note conserve la formulation concise du grec et évite de fixer indûment le rapport entre la fertilité de la terre et le labeur.
lexical_decisions:
- source_word: μερὶς
  choice: part
  rationale: « Part » conserve l’idée d’une portion attribuée, d’un lot reçu.
- source_word: πιότητος τῆς γῆς
  choice: richesse de la terre
  rationale: Le grec désigne littéralement la « graisse » ou la fertilité du sol ; « richesse de la terre » est naturel en français tout en gardant l’idée d’abondance fertile.
- source_word: ἐν πόνοις καρπῶν
  choice: par le travail pénible des récoltes
  rationale: πόνοις évoque les peines, les efforts ou le labeur ; καρπῶν peut désigner les fruits ou les produits de la terre. « Récoltes » rend ici ce sens agricole sans suggérer que les fruits eux-mêmes travaillent.
theological_decisions:
- issue: Nature de la part attribuée aux descendants d’Issacar
  choice: Conserver l’image d’une part reçue dans la richesse agricole de la terre
  alternative: Interpréter explicitement cette part comme un héritage territorial ou une bénédiction divine particulière
  rationale: Le verset parle d’une part donnée, mais n’identifie pas expressément le donateur ni ne développe sa portée théologique ; la traduction n’ajoute donc pas ces précisions.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « acquise par » explicite sobrement le rapport instrumental ou circonstanciel de ἐν, tandis que la note signale la formulation grecque plus littérale.
