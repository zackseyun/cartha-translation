review_pass:
  verdict: revise
  source_fidelity: 'La suppression de « acquise » est nécessaire : le grec dit qu’aucune autre part n’a été donnée, hormis la richesse/fertilité de la terre « dans/avec les peines des fruits », sans affirmer explicitement que cette richesse est acquise par le travail. « Fertilité » rend plus précisément πιότης, image de la graisse, de l’abondance ou de la fécondité du sol.'
  naturalness: « Avec le labeur des récoltes » est un français moderne et compréhensible. Cette formulation conserve le lien volontairement compact entre la part agricole et les peines liées à ses produits, sans imposer une relation strictement instrumentale.
  terminology: « Part » convient pour μερίς. « Fertilité de la terre » rend naturellement πιότητος τῆς γῆς et maintient l’imagerie agricole. « Labeur des récoltes » rend πόνοις καρπῶν dans un registre digne sans attribuer littéralement le travail aux fruits eux-mêmes.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « richesse de la terre, acquise par le travail pénible des récoltes »
    rationale: « Acquise » fait de la richesse l’objet obtenu par le travail et « par » impose une relation instrumentale. Le grec ἐν πόνοις καρπῶν est plus elliptique et peut caractériser la part reçue comme liée aux peines des produits de la terre.
  revised_text: Car aucune autre part ne vous a été donnée, si ce n’est la fertilité de la terre, avec le labeur des récoltes.[a]
