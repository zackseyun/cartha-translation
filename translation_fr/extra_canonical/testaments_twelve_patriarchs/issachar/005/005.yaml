- from: Car aucune autre part ne vous a été donnée, si ce n’est la richesse de la terre, acquise par le travail pénible des récoltes.[a]
  to: Car aucune autre part ne vous a été donnée, si ce n’est la fertilité de la terre, avec le labeur des récoltes.[a]
  rationale: La révision remplace une explicitation qui dépasse le grec par une formulation française naturelle et plus ouverte. Elle rend également πιότης par « fertilité », terme plus proche de l’image agricole du texte source.
