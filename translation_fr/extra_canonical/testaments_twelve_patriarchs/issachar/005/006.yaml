  text: For my father Jacob also blessed me with blessings of the earth and firstfruits of fruits.
translation:
  language: fr
  text: Car mon père Jacob, lui aussi, m’a béni de bénédictions de la terre et des prémices des fruits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογίαις
  choice: par des bénédictions
  rationale: Le datif exprime ici vraisemblablement le moyen ou le contenu de la bénédiction; cette formulation conserve aussi la répétition avec εὐλόγησέ.
- source_word: γῆς
  choice: de la terre
  rationale: Équivalent direct et naturel de γῆ, dans un contexte évoquant les produits du sol.
- source_word: ἀπαρχῶν
  choice: des prémices
  rationale: « Prémices » rend précisément les premiers produits consacrés ou offerts, sans réduire le terme à une simple récolte précoce.
- source_word: καρπῶν
  choice: de ses fruits
  rationale: « Fruits » correspond directement à καρποί; le possessif explicite naturellement en français leur rapport à « la terre », tout en évitant l’expression lourde « prémices de fruits ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition étymologique « béni par des bénédictions » est volontairement conservée pour refléter εὐλογίαις… εὐλόγησέ, malgré son caractère marqué en français.
