  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: fr
  text: Mais aimez le Seigneur et votre prochain. Ayez compassion du pauvre et du faible.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: aimez
  rationale: L’impératif « aimez » rend directement l’aoriste impératif grec et convient naturellement aux deux compléments.
- source_word: πλησίον
  choice: prochain
  rationale: « Votre prochain » est l’équivalent français courant du substantif relationnel grec au singulier.
- source_word: πένητα
  choice: pauvre
  rationale: Le singulier générique du grec est conservé; πένης désigne une personne pauvre ou indigente.
- source_word: ἀσθενῆ
  choice: faible
  rationale: « Faible » préserve la portée assez large de ἀσθενής, qui peut évoquer la faiblesse, la fragilité ou la maladie selon le contexte.
- source_word: ἐλεήσατε
  choice: ayez compassion de
  rationale: Cette formulation exprime l’appel concret à la miséricorde dans un français naturel et digne.
theological_decisions:
- issue: Référent de Κύριον
  choice: le Seigneur
  alternative: Dieu
  rationale: La traduction conserve le titre grec sans préciser davantage son référent ni résoudre une éventuelle nuance théologique absente du verset.
translation_notes:
  register: Français moderne, clair et digne. Les deux impératifs et les singuliers génériques du grec sont conservés; la coupure entre les deux phrases suit la ponctuation de l’édition source.
