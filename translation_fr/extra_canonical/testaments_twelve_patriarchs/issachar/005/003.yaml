  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: fr
  text: Courbez le dos pour cultiver la terre et travaillez à toutes les tâches agricoles, en présentant au Seigneur des dons avec reconnaissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: Courbez le dos
  rationale: Conserve l’image concrète de l’effort physique tout en employant une expression française naturelle.
- source_word: εἰς τὸ γεωργεῖν
  choice: pour cultiver la terre
  rationale: Rend explicitement le sens agricole du verbe γεωργεῖν dans un français courant.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: accomplissez toutes sortes de travaux agricoles
  rationale: Reproduit l’étendue de l’expression grecque, qui vise l’ensemble des tâches liées à la culture, sans conserver sa redondance peu naturelle en français.
- source_word: δῶρα … Κυρίῳ προσφέροντες
  choice: en présentant au Seigneur des offrandes
  rationale: Dans le contexte d’un don présenté au Seigneur, « offrandes » restitue mieux la portée cultuelle de δῶρα que le terme général « dons ».
- source_word: μετ᾽ εὐχαριστείας
  choice: avec reconnaissance
  rationale: Exprime clairement l’attitude de gratitude indiquée par εὐχαριστία, sans imposer un sens liturgique plus précis que le texte.
theological_decisions:
- issue: Nature des δῶρα présentés au Seigneur
  choice: offrandes
  alternative: dons
  rationale: « Offrandes » traduit naturellement des présents destinés au Seigneur, tout en laissant indéterminées leur forme et leur fonction exactes.
translation_notes:
  register: Français moderne, clair et digne. L’impératif pluriel est conservé. La métaphore corporelle du dos courbé et la relation entre travail agricole, offrande et gratitude restent perceptibles.
