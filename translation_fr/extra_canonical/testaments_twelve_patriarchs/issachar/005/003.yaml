  source_fidelity: 'Le sens général est bien rendu : l’exhortation impérative, l’effort agricole, les dons au Seigneur et la reconnaissance sont conservés. Toutefois, δῶρα signifie d’abord « dons/cadeaux »; « offrandes » est possible dans ce contexte, mais introduit plus explicitement une coloration cultuelle que le grec ne précise pas. « Dons » préserve mieux cette indétermination.'
