  text: 3. Καὶ ὑμεῖς οὖν εἴπατε ταῦτα¹⁵ τοῖς τέκνοις ὑμῶν, ὅπως, ἐὰν ἁμάρτωσι¹⁶, τάχιον¹⁷ ἐπιστρέψωσι¹⁸ πρὸς τὸν¹⁹ Κύριον,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: fr
  text: Vous aussi, dites donc ces choses à vos enfants, afin que, s’ils pèchent, ils reviennent plus vite au Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Revenir au Seigneur » évoque à la fois la repentance et le rétablissement de la relation avec lui.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: Vous aussi… donc
  rationale: Rend à la fois l’inclusion exprimée par καὶ ὑμεῖς et la conséquence marquée par οὖν, dans un ordre naturel en français.
- source_word: εἴπατε ταῦτα τοῖς τέκνοις ὑμῶν
  choice: dites ces choses à vos enfants
  rationale: Traduction directe et intelligible de l’impératif et de son complément, sans expliciter ce que désigne ταῦτα.
- source_word: ἐὰν ἁμάρτωσι
  choice: s’ils pèchent
  rationale: Conserve la condition éventuelle et le sens moral et religieux de ἁμαρτάνω.
- source_word: τάχιον
  choice: plus vite
  rationale: Préserve la valeur comparative de l’adverbe, même si le second terme de la comparaison reste implicite dans le grec.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: ils reviennent au Seigneur
  rationale: Le verbe « revenir » exprime naturellement le mouvement de retour vers Dieu et peut porter en contexte la nuance de conversion ou de repentance, sans la surinterpréter dans le corps du texte.
theological_decisions:
- issue: Portée spirituelle de ἐπιστρέφω πρὸς τὸν Κύριον
  choice: revenir au Seigneur
  alternative: se tourner de nouveau vers le Seigneur / retourner au Seigneur
  rationale: « Revenir au Seigneur » maintient ensemble l’idée de changement d’orientation, de repentance et de restauration, sans réduire le verbe à un terme doctrinal technique.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’impératif adressé aux auditeurs, la condition éventuelle et le comparatif implicite de τάχιον.
