review_pass:
  verdict: revise
  source_fidelity: 'La phrase restitue fidèlement l’enchaînement général du grec : abandon de l’agriculture, adhésion à de mauvais projets, dispersion parmi les nations, puis soumission aux ennemis. Toutefois, « réduits en esclavage par leurs ennemis » transforme le verbe actif δουλεύσουσιν (« ils seront esclaves/ils serviront comme esclaves leurs ennemis ») en une construction passive et introduit plus explicitement l’agent de la réduction. Une formulation avec « seront esclaves de » conserve à la fois la force de δουλεύω et la syntaxe sémantique du datif τοῖς ἐχθροῖς.'
  naturalness: « Abandonnant la culture de la terre » est naturel et clair en français moderne. « Ils seront esclaves de leurs ennemis » est idiomatique, sobre et plus direct que « réduits en esclavage par leurs ennemis ».
  terminology: « Mauvais desseins » rend bien πονηροῖς διαβουλίοις ; « nations » convient à ἔθνεσιν ; « esclaves » conserve la force de δουλεύσουσιν sans confondre le sens avec un simple service.
  issues:
  - severity: medium
    issue: Changement de voix et explicitation de l’agent dans la dernière proposition.
    rationale: Le grec emploie le futur actif δουλεύσουσιν avec un datif indiquant ceux auxquels ils seront soumis. « Réduits en esclavage par leurs ennemis » est passif et présente les ennemis comme agents explicites de l’action. Bien que plausible contextuellement, cette reformulation s’éloigne de la formulation source.
  revised_text: Abandonnant la culture de la terre, ils suivront leurs mauvais desseins ; ils seront dispersés parmi les nations et seront esclaves de leurs ennemis.
