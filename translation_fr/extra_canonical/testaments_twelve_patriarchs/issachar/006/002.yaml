  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/002.yaml
  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will servant for their enemies.
translation:
  language: fr
  text: Abandonnant la culture de la terre, ils suivront leurs mauvais desseins ; ils seront dispersés parmi les nations et seront esclaves de leurs ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες τὸ γεωργεῖν
  choice: Abandonnant le travail de la terre
  rationale: Exprime naturellement en français l’idée de délaisser l’activité agricole, sans limiter γεωργεῖν à une technique particulière.
- source_word: ἐξακολουθήσουσι τοῖς πονηροῖς διαβουλίοις αὐτῶν
  choice: ils suivront leurs mauvais desseins
  rationale: « Suivre » rend ἐξακολουθέω, tandis que « mauvais desseins » restitue le caractère moralement mauvais de πονηροῖς et l’idée de projets délibérés portée par διαβουλίοις.
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  choice: ils seront dispersés parmi les nations
  rationale: Conserve la voix passive et rend ἔθνη par le terme biblique courant « nations ».
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  choice: réduits en esclavage par leurs ennemis
  rationale: Rend explicitement la servitude forte exprimée par δουλεύω. La coordination française avec « ils seront » permet une formulation idiomatique, et le datif désigne ceux auxquels ils seront asservis.
theological_decisions:
- issue: Degré de contrainte exprimé par δουλεύσουσιν
  choice: réduits en esclavage par leurs ennemis
  alternative: ils serviront leurs ennemis
  rationale: « Servir » pourrait atténuer la servitude imposée dans ce contexte de dispersion et de domination ennemie ; « réduits en esclavage » en préserve la force sans ajouter de précision doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve la progression du grec : abandon de l’agriculture, adhésion à de mauvais desseins, dispersion, puis asservissement.'
