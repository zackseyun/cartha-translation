revisions:
- from: Abandonnant le travail de la terre, ils suivront leurs mauvais desseins ; ils seront dispersés parmi les nations et réduits en esclavage par leurs ennemis.
  to: Abandonnant la culture de la terre, ils suivront leurs mauvais desseins ; ils seront dispersés parmi les nations et seront esclaves de leurs ennemis.
  rationale: La révision remplace la formulation passive « réduits en esclavage par » par « seront esclaves de », afin de rendre plus directement le futur actif δουλεύσουσιν et son complément au datif, tout en conservant l’idée de servitude forte. « Culture de la terre » est une formulation française naturelle pour τὸ γεωργεῖν.
