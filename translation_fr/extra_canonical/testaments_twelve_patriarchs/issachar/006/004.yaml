translation:
  language: fr
  text: car il est miséricordieux et les délivrera, afin de les ramener dans leur pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de la phrase peut aussi se comprendre ainsi : « et les rétablira dans leur pays ».'
