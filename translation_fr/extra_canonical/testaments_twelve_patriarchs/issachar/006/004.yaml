lexical_decisions:
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Rend directement la compassion active attribuée à Dieu, dans un registre biblique courant et digne.
- source_word: ἐξελεῖται
  choice: les délivrera
  rationale: Le futur moyen de ἐξαιρέω exprime ici l’action de soustraire ou délivrer; «les délivrera» reste naturel sans préciser un danger que le texte ne nomme pas.
- source_word: τοῦ ἐπιστρέψαι
  choice: afin de les ramener
  rationale: L’infinitif aoriste articulé au génitif peut exprimer le but ou le résultat. Avec un objet personnel et une destination, la tournure causative «les ramener» transmet naturellement le retour sans trancher excessivement la relation syntaxique.
- source_word: εἰς τὴν γῆν αὐτῶν
  choice: dans leur pays
  rationale: Dans ce contexte de retour collectif, γῆ désigne leur terre ou pays; «dans leur pays» est idiomatique en français moderne.
theological_decisions:
- issue: Rapport entre la délivrance et le retour au pays
  choice: afin de les ramener dans leur pays
  alternative: et les rétablira dans leur pays
  rationale: La traduction principale conserve la valeur finale probable de τοῦ avec l’infinitif et l’idée de retour portée par ἐπιστρέφω. La note signale l’autre compréhension possible, plus coordonnée et restaurative, sans imposer une lecture théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la motivation introduite par «car» et l’ambiguïté relative de la proposition finale grâce à une note.
