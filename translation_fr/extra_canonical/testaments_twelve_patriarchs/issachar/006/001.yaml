  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: fr
  text: 6 Sachez donc, mes enfants, que, dans les derniers temps, vos fils délaisseront la simplicité et s’attacheront à l’avidité ; abandonnant l’innocence[a], ils s’approcheront de la ruse ; et délaissant les commandements du Seigneur, ils s’attacheront à Béliar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’absence de malice » ou « la franchise » : le mot grec (ἀκακία) désigne l’absence de méchanceté et de tromperie.'
    reason: lexical_alternative
  - marker: b
    text: Béliar est la forme grecque employée ici ; ce nom est aussi couramment connu sous la forme « Bélial ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότητα
  choice: simplicité
  rationale: Le terme évoque ici une disposition simple, entière et sans duplicité ; « simplicité » conserve cette amplitude morale sans la réduire à la naïveté.
- source_word: ἀπληστίᾳ
  choice: avidité
  rationale: Le grec désigne le désir insatiable d’avoir davantage ; « avidité » convient au contraste moral avec la simplicité.
- source_word: ἀκακίαν
  choice: droiture sans malice
  rationale: ἀκακία exprime l’absence de méchanceté ou de tromperie. Cette formulation naturelle explicite le sens sans choisir exclusivement entre innocence, intégrité et absence de malice.
- source_word: πανουργίᾳ
  choice: ruse
  rationale: Dans ce contexte négatif, le mot renvoie à une habileté fourbe ou sans scrupules ; « ruse » rend clairement ce contraste avec ἀκακία.
- source_word: κολληθήσονται
  choice: s’attacheront
  rationale: Le verbe signifie adhérer étroitement à quelqu’un ou à quelque chose. La répétition française préserve celle du grec.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Cette translittération suit la forme grecque du nom dans le passage plutôt que de la normaliser silencieusement en « Bélial ».
theological_decisions:
- issue: « derniers temps » (ἐν ἐσχάτοις καιροῖς)
  choice: dans les derniers temps
  alternative: à la fin des temps
  rationale: La traduction conserve la formulation temporelle plurielle du grec et n’impose pas une construction eschatologique plus précise.
- issue: Identité de Béliar
  choice: conserver le nom propre sans glose dans le corps du texte
  alternative: le Mauvais / Satan
  rationale: Le texte grec emploie un nom propre ; l’identifier explicitement à une figure particulière résoudrait une question que ce verset laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme du grec est maintenu par « délaisser/abandonner » et la répétition de « s’attacher ». « Vos fils » est conservé plutôt que généralisé en « vos descendants », afin de respecter le texte source.
