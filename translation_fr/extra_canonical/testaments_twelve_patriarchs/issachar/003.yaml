  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: fr
  text: '### Testament d’Issacar 3


    **1** Quand donc je fus devenu adulte, mes enfants, je marchai dans la droiture de cœur. Je devins cultivateur pour mon père et mes frères, et j’apportais des fruits des champs en leur saison. **2** Mon père me bénissait, car il voyait que je marchais devant lui dans la simplicité. **3** Je ne suis pas indiscret dans mes activités, et je ne suis ni envieux ni malveillant envers mon prochain. **4** Je n’ai jamais calomnié personne ni critiqué la manière de vivre d’un homme.


    **5** À trente-cinq ans, je pris une femme, car le travail épuisait mes forces. Je ne pensais pas au plaisir d’une femme ; mais, à cause de mon labeur, le sommeil avait raison de moi. **6** Mon père se réjouissait toujours de ma simplicité, parce que j’offrais au Seigneur, par l’intermédiaire du prêtre, tout premier produit[a], puis aussi à mon père. **7** Le Seigneur multiplia par dix mille les biens que j’avais entre les mains. Et Jacob, mon père, savait lui aussi que Dieu agissait de concert avec ma simplicité.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut désigner tout premier produit ou tout premier fruit, et pas seulement un premier-né animal.
    reason: lexical_alternative
  - marker: b
    text: La proposition « Et Jacob, mon père, savait lui aussi que Dieu agissait de concert avec ma simplicité » est placée entre crochets critiques dans l’édition grecque ; son statut dans la tradition manuscrite est incertain.
    reason: textual_variant
lexical_decisions:
- source_word: εὐθύτητι καρδίας
  choice: avec un cœur droit
  rationale: Rend naturellement la droiture intérieure exprimée par le grec, sans réduire la formule à la seule honnêteté extérieure.
- source_word: ἁπλότης / ἁπλότητι
  choice: simplicité
  rationale: Conserve le terme clé du chapitre et son idée d’une conduite sans duplicité, droite et sans calcul.
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: je ne me mêlais pas de ce qui ne me regardait pas dans mes activités
  rationale: Le terme désigne ici une ingérence indiscrète plutôt qu’une simple curiosité ; cette formulation est claire en français moderne.
- source_word: φθονερὸς καὶ βάσκανος
  choice: envieux ni malveillant
  rationale: « Envieux » traduit directement φθονερός ; « malveillant » communique le sens hostile de βάσκανος sans imposer dans le texte la nuance particulière du mauvais œil.
- source_word: οὐ κατελάλησά τινος
  choice: je n’ai calomnié personne
  rationale: Le verbe signifie parler contre quelqu’un de manière diffamatoire ; « calomnier » en garde la force morale.
- source_word: ἔψεξα βίον ἀνθρώπου
  choice: critiqué la manière de vivre d’un homme
  rationale: βίος vise ici la conduite ou le mode de vie ; la traduction reste générale comme le grec.
- source_word: ὁ κάματος κατήσθιε τὴν ἰσχύν μου
  choice: le travail épuisait mes forces
  rationale: Le grec dit littéralement que la peine « dévorait » sa force ; la formulation choisie garde le sens avec naturel.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: le sommeil avait raison de moi
  rationale: Rend l’idée que le sommeil l’emportait sur lui à cause de son labeur, plutôt qu’un simple endormissement.
- source_word: πᾶν πρῶτον γέννημα
  choice: tout premier produit
  rationale: γέννημα peut désigner ce qui est engendré ou produit. Dans le contexte agricole, « premier produit » évite de limiter indûment l’expression aux premiers-nés animaux.
- source_word: ἐμυριοπλασίασε
  choice: multiplia par dix mille
  rationale: Préserve l’hyperbole numérique vive du verbe grec plutôt que de la remplacer par un vague « multiplia abondamment ».
- source_word: ὁ Θεὸς συνεργεῖ τῇ ἁπλότητί μου
  choice: Dieu agissait avec ma simplicité
  rationale: Le datif et le verbe συνεργεῖ permettent cette formulation inhabituelle, qui conserve la tension du texte sans expliquer si Dieu soutient, récompense ou coopère avec cette simplicité.
theological_decisions:
- issue: Sens moral de ἁπλότης
  choice: Employer uniformément « simplicité »
  alternative: « sincérité », « intégrité » ou « droiture sans partage »
  rationale: La simplicité constitue le thème moral central du Testament d’Issacar. La répétition française maintient le lien lexical et ne transforme pas cette vertu en une doctrine plus précise.
- issue: Offrande des premiers produits par l’intermédiaire du prêtre dans le cadre patriarcal
  choice: Traduire directement la référence au prêtre
  alternative: Omettre ou atténuer cette mention afin d’harmoniser le récit avec la Genèse
  rationale: Le témoin grec contient explicitement διὰ τοῦ ἱερέως. La traduction conserve donc cette présentation cultuelle sans harmonisation silencieuse.
- issue: Rapport entre l’action divine et la simplicité d’Issacar en 3.7
  choice: « Dieu agissait avec ma simplicité »
  alternative: « Dieu favorisait/récompensait ma simplicité »
  rationale: Le grec συνεργεῖ exprime une action conjointe ou un concours, mais ne définit pas exactement ce rapport. Une traduction plus explicative résoudrait une ambiguïté réelle.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours autobiographique et exhortatif est conservé, avec répétition volontaire de « simplicité ». Les images grecques sont rendues naturellement, sauf l’hyperbole « par dix mille », maintenue pour sa force. La traduction suit le passage grec fourni pour le chapitre 3 et ne reprend pas les paragraphes de la couche anglaise qui relèvent du contexte précédent ou présentent une conclusion différente du grec ici cité.
