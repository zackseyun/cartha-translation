revisions:
- from: Mais il marche avec une âme sans détour ; il voit toutes choses avec un cœur droit, sans adopter le regard mauvais qui vient de l’égarement du monde, afin de ne pas voir les commandements du Seigneur comme déformés.
  to: Mais il marche avec simplicité d’âme ; il voit toutes choses avec un cœur droit, sans accueillir des yeux mauvais issus de l’égarement du monde, afin de ne pas voir les commandements du Seigneur déformés.
  rationale: 'La révision rapproche le français des termes et des images du grec : « simplicité d’âme » pour ἁπλότητι ψυχῆς, « accueillir » pour ἐπιδεχόμενος, et « des yeux mauvais » au pluriel pour ὀφθαλμοὺς πονηρούς. Elle préserve la portée perceptive de ἴδῃ : les commandements ne sont pas déclarés déformés en eux-mêmes, mais vus comme tels par celui qui accueille ce regard perverti.'
