  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: fr
  text: Mais il marche avec simplicité d’âme ; il voit toutes choses avec un cœur droit, sans accueillir des yeux mauvais issus de l’égarement du monde, afin de ne pas voir les commandements du Seigneur déformés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι ψυχῆς
  choice: avec une âme sans détour
  rationale: Rend l’idée de simplicité, de sincérité et d’absence de duplicité dans une expression française naturelle, sans suggérer la naïveté.
- source_word: πάντα ὁρᾷ
  choice: il voit toutes choses
  rationale: Conserve la portée générale de πάντα et le verbe concret « voir ».
- source_word: ἐν εὐθύτητι καρδίας
  choice: avec un cœur droit
  rationale: Expression française claire et digne qui restitue la droiture intérieure évoquée par εὐθύτης et καρδία.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: sans adopter le regard mauvais
  rationale: La tournure grecque, littéralement liée à l’accueil de « yeux mauvais », désigne ici une manière pervertie de regarder ; « adopter le regard » reste intelligible tout en conservant l’image.
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: qui vient de l’égarement du monde
  rationale: ἀπό indique la provenance ; πλάνη peut exprimer l’erreur ou l’égarement. « Égarement » conserve sa dimension morale sans la surinterpréter.
- source_word: διεστραμμένας
  choice: comme déformés
  rationale: 'Le participe décrit les commandements tels qu’ils seraient perçus : tordus, faussés ou déformés. « Comme » explicite cette valeur prédicative sans affirmer qu’ils le sont réellement.'
theological_decisions:
- issue: Nature de la déformation des commandements du Seigneur
  choice: ne pas voir les commandements du Seigneur comme déformés
  alternative: ne pas déformer les commandements du Seigneur
  rationale: Le grec porte sur la perception (« voir »), non directement sur une action consistant à altérer les commandements. La traduction maintient cette tension entre regard corrompu et objet perçu.
- issue: Sens des « yeux mauvais »
  choice: le regard mauvais
  alternative: des yeux mauvais
  rationale: La formulation idiomatique française rend la disposition morale ou la perspective pervertie sans imposer une doctrine particulière ; elle préserve néanmoins la métaphore visuelle qui structure la phrase.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le parallélisme entre l’âme, le cœur et le regard, tout en évitant que « simplicité » soit comprise comme un manque d’intelligence.
