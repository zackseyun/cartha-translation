  source_fidelity: La première et la deuxième proposition sont globalement fidèles, y compris l’inclusion de la proposition imprimée entre crochets par l’édition. En revanche, la dernière proposition grecque est une formulation existentielle (« il n’y a pas de distraction/tiraillement ... dans son esprit ») ; le projet fait de « la convoitise » le sujet qui « trouble » l’esprit. Cette restructuration réduit l’ambiguïté syntaxique et remplace plus nettement περισπασμός (« distraction », « tiraillement ») par « trouble ».
  naturalness: Le français du projet est sobre et naturel dans l’ensemble. « Il ne ressent pas d’envie lors des délibérations » et « son esprit n’est pas distrait par l’avidité » sont idiomatiques tout en étant plus proches de la syntaxe et du lexique grecs.
  terminology: « Envie » convient à ζηλοῖ dans cette négation, et « envie malveillante » rend bien βάσκανος. « Avidité » exprime ἀπληστία de manière suffisamment large ; « distraction » rend plus directement περισπασμός que « trouble ».
