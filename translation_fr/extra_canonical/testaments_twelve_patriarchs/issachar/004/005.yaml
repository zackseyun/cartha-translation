  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: fr
  text: Il ne ressent pas d’envie lors des délibérations ; l’envie malveillante ne consume pas son âme[a], et son esprit n’est pas distrait par l’avidité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette proposition est imprimée entre crochets dans l’édition grecque citée.
    reason: Signale fidèlement le statut textuel donné par l’édition source, sans porter de jugement sur son authenticité.
lexical_decisions:
- source_word: ζηλοῖ
  choice: éprouve de jalousie
  rationale: Dans ce contexte négatif, le verbe désigne la jalousie ou l’envie plutôt qu’un zèle positif.
- source_word: ἐν διαβουλίοις
  choice: dans les délibérations
  rationale: Rend le pluriel grec de façon formelle tout en restant intelligible en français moderne.
- source_word: βάσκανος
  choice: l’envie malveillante
  rationale: Le terme qualifie une envie hostile ou maligne ; la tournure nominale française s’accorde naturellement avec le verbe « consume ».
- source_word: ἐκτήκει
  choice: consume
  rationale: Préserve l’image d’un dépérissement intérieur progressif.
- source_word: περισπασμὸς
  choice: trouble
  rationale: Le substantif évoque la distraction, l’agitation ou le tiraillement ; « trouble » exprime naturellement ici son effet sur l’esprit.
- source_word: ἀπληστείᾳ
  choice: convoitise
  rationale: Le mot peut désigner l’avidité ou l’insatiabilité ; « convoitise » convient à ce contexte moral sans le limiter aux biens matériels.
- source_word: ἐν νοΐ
  choice: son esprit
  rationale: Rend νοῦς par le siège de la pensée et du discernement, avec le possessif requis naturellement en français.
theological_decisions:
- issue: Rapport syntaxique de « ἐν ἀπληστείᾳ »
  choice: la convoitise ne trouble pas son esprit
  alternative: il n’y a pas, dans son esprit, de distraction liée à l’avidité
  rationale: Le grec est compact et quelque peu abrupt. La formulation retenue exprime le lien entre avidité et trouble sans ajouter une interprétation doctrinale.
- issue: Statut textuel de la proposition sur l’envie malveillante
  choice: inclure la proposition dans le texte
  alternative: l’omettre ou la signaler comme variante
  rationale: Elle figure dans le texte source fourni, bien qu’encadrée par des crochets éditoriaux ; elle est donc traduite, tout en évitant d’inventer une note sans données suffisantes sur les témoins.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination en trois membres conserve la progression du grec, tandis que la dernière proposition est légèrement restructurée pour être idiomatique.
