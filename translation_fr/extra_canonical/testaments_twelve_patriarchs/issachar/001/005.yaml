  text: These were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: fr
  text: C’étaient des fruits parfumés[a], qui poussent dans le pays de Harân, en contrebas d’un ravin où il y a des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des pommes parfumées ». Le mot grec peut désigner des pommes ou, plus généralement, des fruits.'
    reason: Le terme μῆλα conserve une ambiguïté lexicale réelle qu’il ne faut pas trancher sans certitude.
lexical_decisions:
- source_word: μῆλα
  choice: fruits
  rationale: Le terme peut désigner des pommes, mais aussi plus largement des fruits. « Fruits » convient au contexte sans imposer une identification botanique incertaine.
- source_word: εὔοσμα
  choice: parfumés
  rationale: Rend naturellement l’idée d’une odeur agréable et marquée.
- source_word: γίνονται
  choice: poussent
  rationale: Dans le contexte de fruits produits dans une région, « poussent » exprime idiomatiquement le sens de « viennent à l’existence / sont produits ».
- source_word: ἐν τῇ γῇ Χαράν
  choice: dans le pays de Harân
  rationale: Traduction directe et naturelle de la désignation géographique.
- source_word: ὑποκάτω φάραγγος ὑδάτων
  choice: en contrebas d’un ravin où coule de l’eau
  rationale: Préserve l’idée spatiale de ὑποκάτω et le sens concret de φάραγξ, « ravin », tout en rendant idiomatiquement le complément « d’eaux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche de la structure grecque tout en évitant le tour peu naturel « un ravin d’eaux ».
