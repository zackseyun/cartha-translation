  rationale: La révision remplace l’expression de désir par une affirmation de conservation future, maintient la répétition démonstrative du grec et rend ἐγέννησα par le verbe précis « enfanter ». Le sens négatif de παρεῖδε et son ambiguïté de nuance sont conservés dans le texte et la note.
