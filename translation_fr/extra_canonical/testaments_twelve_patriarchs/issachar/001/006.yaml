  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: fr
  text: 'Rachel dit : « Je ne te donnerai pas ces choses, mais je garderai ces choses à la place d’enfants, car le Seigneur m’a négligée[a] et je n’ai pas enfanté pour Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne s’est pas soucié de moi » ; littéralement : « m’a laissée de côté » ou « m’a négligée ».'
    reason: Le verbe grec peut exprimer les nuances de négliger, laisser de côté ou ne pas prendre en considération.
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel désigne concrètement les objets évoqués dans le contexte ; « ces choses » en conserve la valeur sans ajouter un référent absent de ce verset.
- source_word: ἵνα σχῶ ταῦτα ἀντὶ τέκνων
  choice: je veux les avoir à la place d’enfants
  rationale: Cette formulation rend le sens de possession de σχῶ et préserve l’expression frappante et ambiguë « à la place d’enfants », sans la transformer en un échange explicitement négocié.
- source_word: παρεῖδε
  choice: m’a délaissée
  rationale: Le verbe παροράω exprime ici le fait de négliger, délaisser ou ne pas prendre en considération. « Délaissée » est naturel en français et convient au constat douloureux d’infécondité.
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: je n’ai pas donné d’enfants à Jacob
  rationale: Expression française naturelle pour rendre le fait d’enfanter pour Jacob, tout en conservant le lien explicite avec celui-ci.
theological_decisions:
- issue: Sens de παρεῖδε appliqué à l’action du Seigneur
  choice: le Seigneur m’a délaissée
  alternative: le Seigneur a porté son regard sur moi
  rationale: Le sens lexical normal de παροράω est « négliger, ne pas prendre en considération, laisser de côté ». La proposition suivante sur l’absence d’enfants soutient ce sens négatif ; traduire par une attention favorable inverserait la plainte de Rachel.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste simple et intelligible. L’étrangeté de « à la place d’enfants » est volontairement conservée, car elle appartient au texte source.
