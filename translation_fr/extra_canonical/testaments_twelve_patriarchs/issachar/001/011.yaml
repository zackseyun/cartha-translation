  source_fidelity: 'La structure contrefactuelle est bien rendue : les deux aoristes (« s’était multipliée », « avait gagné du terrain ») conduisent à la conséquence présente exprimée par « tu ne verrais pas ». « La tromperie », « la méchanceté des humains » et « gagner du terrain » rendent fidèlement δόλος, πονηρία τῶν ἀνθρώπων et ἐχώρησεν. En revanche, « contempler » est plus marqué que ὁρῶσα, qui signifie simplement « voyant / regardant » dans cette expression.'
