source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: fr
  text: Et si la tromperie ne s’était pas multipliée sur la terre et si la méchanceté des humains n’avait pas gagné du terrain, tu ne verrais pas le visage de Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόλος
  choice: la tromperie
  rationale: Rend le sens de fraude ou de duplicité par un terme français courant, sans le limiter à une ruse ponctuelle.
- source_word: ἐπλήθυνεν
  choice: ne s’était pas multipliée
  rationale: Conserve directement l’idée d’une augmentation et d’une prolifération sur la terre.
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  choice: la méchanceté des humains
  rationale: Expression naturelle et inclusive qui conserve la portée morale de πονηρία et le sens collectif de ἀνθρώπων.
- source_word: ἐχώρησεν
  choice: n’avait pas gagné du terrain
  rationale: Cette tournure idiomatique exprime l’avancée ou la propagation de la méchanceté, sens contextuel du verbe.
- source_word: ὁρῶσα τὸ πρόσωπον
  choice: contemplerais le visage
  rationale: Préserve l’action durative suggérée par le participe présent féminin, tout en gardant l’image sémitisante du visage de Jacob.
theological_decisions:
- issue: Lien entre le mal répandu dans le monde et la situation de l’interlocutrice auprès de Jacob
  choice: Maintenir le rapport contrefactuel sans en préciser la causalité
  alternative: Expliquer que la tromperie particulière de l’interlocutrice lui a permis d’épouser Jacob
  rationale: Le grec formule une affirmation générale et tendue, mais n’explicite pas davantage le mécanisme ni l’identité exacte de la faute; la traduction ne doit pas ajouter une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure contrefactuelle du grec. « Gagner du terrain » évite une formulation artificielle tout en exprimant une progression active; « contemplerais le visage » garde la dimension continue et relationnelle de l’expression source.
