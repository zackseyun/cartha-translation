  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: fr
  text: 15 Jacob s’unit à Léa ; elle conçut et me mit au monde. C’est à cause de ce salaire[a] que je fus appelé Issacar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Issacar » est ici associé au mot « salaire » ou « rétribution » ; voir Genèse 30.16-18.
    reason: Le jeu de mots sous-jacent au nom propre n’est pas perceptible en français sans explication.
lexical_decisions:
- source_word: Ἔγνω
  choice: s’unit à
  rationale: Rend naturellement l’euphémisme grec « connut » pour désigner l’union sexuelle, sans devenir cru ni introduire une précision étrangère au texte.
- source_word: συλλαβοῦσα
  choice: elle devint enceinte
  rationale: Exprime clairement et idiomatiquement le participe grec indiquant la conception.
- source_word: τὸν μισθὸν
  choice: du salaire
  rationale: Conserve le terme grec concret « salaire, rétribution » ainsi que son lien étymologique avec le nom Issacar.
- source_word: ἐκλήθην
  choice: je fus appelé
  rationale: Préserve la voix passive et la formulation du récit concernant l’attribution du nom.
theological_decisions:
- issue: Rapport entre le salaire et le nom d’Issacar
  choice: Conserver explicitement « du salaire » et signaler le jeu de mots en note
  alternative: Reformuler par « en récompense » ou supprimer l’apposition
  rationale: Le texte grec met en relief μισθός et rattache ainsi la nomination d’Issacar au motif du salaire ; la traduction ne doit ni effacer ni surinterpréter cette association.
translation_notes:
  register: Français moderne, digne et accessible. « S’unit à » maintient la pudeur de l’euphémisme grec. Les tirets conservent la mise en relief quelque peu abrupte de « du salaire » sans lisser la tension syntaxique du texte source.
