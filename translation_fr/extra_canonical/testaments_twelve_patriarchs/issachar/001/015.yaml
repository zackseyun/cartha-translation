  revision_rationale: La révision remplace l’apposition « cela — du salaire » par « ce salaire », qui exprime directement le motif nominal indiqué par μισθός et évite un renvoi ambigu. « Elle conçut » rend plus littéralement et naturellement συλλαβοῦσα. Le reste du texte et la note sont conservés.
