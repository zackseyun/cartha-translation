  text: 7. Δύο οὖν ἦσαν τὰ μῆλα³⁰. Καὶ εἶπεν ἡ³¹ Λία ⌜πρὸς Ῥαχήλ⌝³². *Ἱκανούσθω σοι³³ ὅτι ἔλαβες τὸν ἄνδρα³⁴ μου· μὴ καὶ ταῦτα³⁵ λήψῃ³⁶ ⌈ἀπ᾿ ἐμοῦ⌉³⁷;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: fr
  text: 'Il y avait donc deux fruits. Léa dit à Rachel : « Qu’il te suffise d’avoir pris mon mari ; vas-tu aussi me les prendre ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μῆλα
  choice: deux fruits
  rationale: μῆλα peut désigner différents fruits; le contexte immédiat ne permet pas d’en préciser l’espèce avec certitude. « Fruits » préserve cette indétermination.
- source_word: Ἱκανούσθω σοι
  choice: Que cela te suffise
  rationale: Le présent impératif à la troisième personne exprime ici une injonction, plutôt qu’une question rhétorique.
- source_word: ἔλαβες τὸν ἄνδρα μου
  choice: d’avoir pris mon mari
  rationale: Rend directement le verbe λαμβάνω et conserve le reproche formulé par Léa.
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: Vas-tu aussi me prendre ceux-ci ?
  rationale: La question introduite par μή porte une attente négative; le français naturel garde le ton indigné sans ajouter une réponse explicite.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. L’impératif « Que cela te suffise » conserve la force grammaticale du grec; le point d’exclamation marque le reproche sans transformer la proposition en interrogation. « Ceux-ci » reprend les deux fruits déjà mentionnés.
