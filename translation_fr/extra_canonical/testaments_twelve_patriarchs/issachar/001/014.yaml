  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: fr
  text: 'Rachel reprit la parole et dit : « Je prendrai une des mandragores et, en échange de celle-ci, je te le louerai[a] pour la nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec laisse implicite l’objet masculin de « louerai »; le contexte narratif permet de l’identifier, sans que son nom soit exprimé ici.
    reason: Signaler l’ellipse grammaticale du grec et éviter que le pronom français soit pris pour une identification explicitement formulée dans ce verset.
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  choice: poursuivit
  rationale: Cette tournure sémitisante signifie qu’elle continua ou reprit la parole; « poursuivit » est naturel en français.
- source_word: μανδραγόρων
  choice: mandragores
  rationale: Désigne sans ambiguïté les mandragores du récit parallèle de Genèse 30.
- source_word: ἐκμισθώσω σοι
  choice: je te louerai ses services
  rationale: Le verbe signifie donner à louer. Cette formulation conserve l’idée de transaction tout en rendant explicite en français que Rachel met un homme à la disposition de Léa.
- source_word: ἐν τῇ νυκτί
  choice: pour cette nuit
  rationale: Dans ce contexte narratif, l’article grec renvoie naturellement à la nuit en question; cette expression est idiomatique en français.
theological_decisions:
- issue: Identité du référent masculin implicite de ἐκμισθώσω
  choice: Conserver le référent sous la forme du pronom « ses », sans ajouter le nom de Jacob
  alternative: « je te louerai Jacob pour cette nuit »
  rationale: Le grec comporte un objet masculin implicite compris par le contexte. Ne pas nommer Jacob évite d’ajouter au texte, tandis que « ses services » donne une phrase française intelligible.
translation_notes:
  register: Français international moderne, narratif et digne. La construction rend la logique d’échange sans l’alourdir et préserve l’objet masculin implicite du grec.
