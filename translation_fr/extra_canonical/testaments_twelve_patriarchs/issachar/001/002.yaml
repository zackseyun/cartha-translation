  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: fr
  text: Je suis né, le cinquième fils de Jacob, comme salaire pour les mandragores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέχθην
  choice: je suis né
  rationale: Rend naturellement en français l’aoriste passif de τίκτω sans alourdir la formulation.
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: comme cinquième fils de Jacob
  rationale: Exprime le rang d’Issacar parmi les fils de Jacob; « de Jacob » est plus idiomatique que le calque du datif « à Jacob ».
- source_word: ἐν μισθῷ
  choice: en salaire
  rationale: Conserve l’image explicite d’une rémunération ou contrepartie, importante pour l’étymologie narrative d’Issacar.
- source_word: τῶν μανδραγόρων
  choice: pour les mandragores
  rationale: Le génitif se comprend ici comme indiquant ce en contrepartie de quoi le salaire fut obtenu, conformément au récit de Genèse 30. « Mandragores » est le terme français usuel.
theological_decisions:
- issue: Rapport entre la naissance d’Issacar et l’épisode des mandragores
  choice: en salaire pour les mandragores
  alternative: comme salaire des mandragores
  rationale: La formulation retenue préserve l’interprétation donnée par le texte sans préciser davantage qui paie ou reçoit ce « salaire », évitant ainsi de résoudre une concision réelle du grec.
translation_notes:
  register: Français moderne, simple et digne. La tournure légèrement marquée « en salaire pour » garde l’image du grec et le lien narratif avec les mandragores.
