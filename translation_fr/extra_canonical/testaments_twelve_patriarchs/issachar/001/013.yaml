  source_fidelity: La traduction principale explicite « mes droits sur Jacob », alors que le grec dit de façon elliptique ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ (« je te loue / cède à bail une nuit avec Jacob »). L’ajout de « mes droits » interprète le référent implicite et rend la formulation plus déterminée que le texte. La révision conserve l’image transactionnelle et l’ellipse du grec.
  naturalness: « Je te loue une nuit avec Jacob » est volontairement abrupt, à l’image de la construction grecque, mais demeure intelligible en français moderne grâce à une note brève. « Mais tout de même » et « en échange des mandragores » sont naturels et appropriés au registre.
  terminology: « Mandragores » est exact. Le maintien de « louer » restitue le vocabulaire économique de ἐκμισθῶ sans transformer Jacob en objet explicitement loué ni attribuer explicitement à la locutrice des « droits » que le grec ne formule pas.
