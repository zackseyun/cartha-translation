source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 13. *Ἀλλ᾽ οὖν ἀντὶ τῶν μανδραγόρων ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/013.yaml
  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: fr
  text: Mais tout de même, en échange des mandragores, je te loue une nuit avec Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je te loue une nuit avec Jacob ». Le verbe grec évoque une mise à bail ; sa construction elliptique ne précise pas davantage ce qui est ainsi « loué ».'
    reason: La note rend compte du sens économique de ἐκμισθῶ et de l’ellipse syntaxique, sans ajouter l’idée de droits conjugaux ni désigner Jacob comme l’objet explicite de la location.
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  choice: Mais tout de même
  rationale: Rend la combinaison adversative et récapitulative avec naturel, sans effacer sa légère insistance.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: en échange des mandragores
  rationale: Exprime directement la contrepartie indiquée par ἀντί avec le génitif.
- source_word: ἐκμισθῶ σοι
  choice: je te cède … mes droits
  rationale: Le verbe signifie littéralement « louer à quelqu’un ». Dans ce contexte, la formulation française explicite naturellement que la locutrice cède temporairement à l’autre femme son droit conjugal, plutôt que de laisser entendre qu’elle loue Jacob lui-même.
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: pour une nuit … sur Jacob
  rationale: Conserve la durée précise et rattache Jacob à l’objet implicite de l’arrangement. La construction grecque est abrupte et probablement influencée par un arrière-plan sémitique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct conserve le caractère transactionnel et quelque peu abrupt de la formulation grecque, tout en évitant une tournure française pouvant suggérer que Jacob est lui-même loué.
