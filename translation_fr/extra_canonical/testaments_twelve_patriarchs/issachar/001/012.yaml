  text: 12. ⁵⁴Λαβὰν δὲ⁵⁴ ⁵⁵ἐν ⌜δόλῳ⌝⁵⁵ ⁵⁶ἠπάτησέ⁵⁶ με *⁵⁷καὶ μετέστησέ με τὴν νύκτα ἐκείνην⁷, καὶ⁵⁸ οὐκ εἴασε *Γτῷ Ἰακὼβ ἰδεῖν με, ἐπεί⁷, ἐὰν ἤμην ἐκεῖ⁵⁹, *τοῦτο αὐτῷ οὐκ ἐγένετο⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: fr
  text: Mais Laban m’a trompée par ruse et m’a écartée cette nuit-là. Il n’a pas permis à Jacob de me voir, car, si j’avais été là, cela ne lui serait pas arrivé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ⌜δόλῳ⌝
  choice: par ruse
  rationale: Rend naturellement le moyen de la tromperie, tout en conservant la nuance de fourberie de δόλος.
- source_word: ἠπάτησέ με
  choice: m’a trompée
  rationale: Équivalent direct du verbe ἀπατάω; l’accord féminin correspond à la locutrice, Rachel.
- source_word: μετέστησέ με
  choice: m’a éloignée
  rationale: μεθίστημι indique ici que Laban l’a déplacée ou écartée; «éloignée» reste naturel sans préciser une destination absente du grec.
- source_word: οὐκ εἴασε τῷ Ἰακὼβ ἰδεῖν με
  choice: Il n’a pas permis à Jacob de me voir
  rationale: Reproduit clairement la construction causative avec Jacob comme personne empêchée.
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: cela ne lui serait pas arrivé
  rationale: Expression française idiomatique correspondant à «cela ne se serait pas produit pour lui», tout en maintenant l’antécédent indéterminé de «cela».
theological_decisions:
- issue: Référent de τοῦτο («cela»)
  choice: Conserver le démonstratif sans explicitation
  alternative: Préciser qu’il s’agit du mariage de Jacob avec Léa ou de la tromperie de Laban
  rationale: Le grec laisse le référent implicite; l’expliciter résoudrait indûment une ambiguïté narrative.
translation_notes:
  register: Français moderne, international et digne. La formulation demeure proche de la syntaxe grecque, mais la ponctuation en deux phrases améliore la lisibilité sans modifier les rapports logiques.
