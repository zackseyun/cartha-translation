  text: 10. *Καὶ εἶπε Ῥαχήλ⁴⁷. *Μὴ καυχῶ μηδὲ δόξαζε σεαυτήν⁴⁸, *ὅτι ἐμὲ πρότερόν σου ἡρμόσατο⁴⁹, καὶ *δι᾽ ἐμὲ⁵⁰ ἐδούλευσε *τῷ πατρὶ ἡμῶν⁵¹ *ἔτη δεκατέσσαρα⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: fr
  text: 'Et Rachel dit : « Ne te vante pas et ne te glorifie pas toi-même, car il s’était engagé envers moi avant de s’engager envers toi, et c’est à cause de moi qu’il a servi notre père pendant quatorze ans. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καυχῶ
  choice: te vante pas
  rationale: Rend naturellement en français l’interdiction de se prévaloir avec orgueil.
- source_word: δόξαζε σεαυτήν
  choice: ne te glorifie pas toi-même
  rationale: Conserve la formulation réflexive et la distinction avec le verbe précédent.
- source_word: ἡρμόσατο
  choice: m’était uni
  rationale: Le verbe peut évoquer l’union ou les fiançailles; « uni » préserve cette relative indétermination sans imposer un terme juridique précis.
- source_word: δι᾽ ἐμὲ
  choice: c’est pour moi
  rationale: Exprime ici la motivation ou le but du service de Jacob d’une manière idiomatique.
- source_word: ἐδούλευσε
  choice: a servi
  rationale: Correspond au service accompli auprès du père sans introduire inutilement le vocabulaire de l’esclavage.
theological_decisions:
- issue: Nature de l’union exprimée par ἡρμόσατο
  choice: il m’était uni
  alternative: il m’avait été fiancé / il s’était lié à moi
  rationale: Le contexte renvoie à la priorité de Rachel dans l’engagement de Jacob, mais le grec n’impose pas ici de préciser exclusivement mariage ou fiançailles.
translation_notes:
  register: Français moderne, digne et narratif. La coordination des deux interdictions reste claire, et la tournure « avant de l’être à toi » évite une répétition lourde tout en explicitant le comparatif πρότερόν σου.
