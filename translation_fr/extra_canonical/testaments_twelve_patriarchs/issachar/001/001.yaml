  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/001.yaml
  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: fr
  text: 'Copie des paroles d’Issachar. En effet, il appela ses fils et leur dit : « Écoutez Issachar, votre père, mes enfants ; prêtez l’oreille aux paroles de celui qui est aimé du Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Rend directement l’idée d’une transcription ou copie écrite, tout en gardant la brièveté du titre grec.
- source_word: ἀκούσατε
  choice: Écoutez
  rationale: Impératif naturel et direct correspondant au verbe grec.
- source_word: τέκνα Ἰσαχὰρ τοῦ πατρὸς ὑμῶν
  choice: mes enfants, Issachar, votre père
  rationale: Le grec est syntaxiquement abrupt. Cette ponctuation conserve Issachar comme locuteur et père des destinataires, sans ajouter « enfants d’Issachar », qui pourrait faire dépendre le nom de τέκνα.
- source_word: ἐνωτίσασθε
  choice: prêtez l’oreille
  rationale: Expression française digne et intelligible qui conserve l’image auditive distincte du simple « écoutez ».
- source_word: ἠγαπημένου ὑπὸ Κυρίου
  choice: de celui que le Seigneur aime
  rationale: Rend le participe passif et son agent dans un français actuel, sans préciser au-delà du grec la nature ou le moment de cet amour.
theological_decisions:
- issue: Valeur de ἠγαπημένου ὑπὸ Κυρίου
  choice: celui que le Seigneur aime
  alternative: le bien-aimé du Seigneur
  rationale: La formulation retenue préserve l’affirmation d’amour divin tout en évitant que « le bien-aimé » soit compris comme un titre théologique technique.
- issue: Référent de « celui que le Seigneur aime »
  choice: Référence implicite à Issachar maintenue
  alternative: moi, que le Seigneur aime
  rationale: Le grec emploie un participe substantivé sans pronom explicite ; la traduction n’ajoute donc pas « moi », même si le contexte désigne naturellement le locuteur.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure vocative du grec est conservée autant que possible par la ponctuation, malgré son caractère abrupt en français.
