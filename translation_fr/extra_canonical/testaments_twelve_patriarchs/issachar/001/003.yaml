translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait marque l’antériorité de l’arrivée de Rachel par rapport à son geste. La révision récente fournie est manifestement sans rapport avec ce verset et n’a donc pas été suivie.
