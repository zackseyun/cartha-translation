  text: For Reuben my brother brought mandrakes from the field, and Rachel met him and took them from him.
translation:
  language: fr
  text: Car Ruben, mon frère, apporta des mandragores du champ ; Rachel, venue à sa rencontre, les prit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανδραγόρους
  choice: mandragores
  rationale: Équivalent français usuel de la plante mentionnée dans le récit source de Genèse 30.
- source_word: ἐκ τοῦ ἀγροῦ
  choice: des champs
  rationale: Rend naturellement la provenance; le singulier grec peut désigner la campagne ou les terres cultivées de manière générale.
- source_word: προσαπαντήσασα
  choice: alla à sa rencontre
  rationale: Le participe exprime que Rachel vint au-devant de Ruben; cette formulation est naturelle et précise en français.
- source_word: ἔλαβεν αὐτούς
  choice: les lui prit
  rationale: Le pronom pluriel reprend les mandragores; «lui» rend explicitement la relation indiquée par le contexte et par la leçon anglaise auditée «from him».
