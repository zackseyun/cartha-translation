base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: fr
  text: '1 Ainsi donc, mes enfants, gardez la loi de Dieu, faites vôtre la simplicité et conduisez-vous avec innocence, sans vous mêler des actes de votre prochain. 2 Mais aimez le Seigneur et votre prochain ; ayez compassion du pauvre et du faible. 3 Courbez le dos pour cultiver la terre et travaillez à toutes sortes de cultures, en présentant au Seigneur des dons avec reconnaissance. 4 Car le Seigneur vous bénira dans les prémices des produits de la terre, comme il a béni tous ceux qui sont saints, depuis Abel jusqu’à maintenant[a]. 5 En effet, aucune autre part ne vous a été donnée, sinon la fertilité de la terre, dans le labeur qu’exigent ses fruits[b]. 6 Car mon père Jacob, lui aussi, m’a béni avec des bénédictions de la terre et des prémices de ses produits. 7 Lévi et Juda ont été glorifiés par le Seigneur parmi les fils de Jacob. Le Seigneur leur a accordé leur héritage : à Lévi, le sacerdoce ; à Juda, la royauté. 8 Vous donc, obéissez-leur et marchez dans la simplicité de votre père.
    [Mais Gad a reçu la mission d’anéantir les bandes de pillards qui s’abattent sur Israël.][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « tous ceux qui sont saints, depuis Abel jusqu’à maintenant » semble désigner la lignée des adorateurs agréés de Dieu à partir d’Abel, mais le grec dit bien « saints », et non « justes ».
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « la richesse » ou « la graisse de la terre » ; il s’agit d’une image de l’abondance et de la fertilité du sol.'
    reason: lexical_alternative
  - marker: c
    text: La proposition concernant Gad s’insère difficilement dans ce contexte et pourrait être une glose tardive ou une phrase déplacée. Elle est néanmoins traduite parce qu’elle figure dans le témoin grec.
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: la loi de Dieu
  rationale: Conserve le génitif grec et le ton solennel de l’exhortation.
- source_word: ἁπλότητα
  choice: la simplicité
  rationale: Désigne ici une disposition sans duplicité, droite et sans complication ; « simplicité » maintient aussi le thème propre à ce testament sans le réduire à une notion doctrinale plus précise.
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: conduisez-vous avec innocence
  rationale: Rend l’image biblique de la marche par une expression française naturelle, tandis qu’« innocence » préserve l’idée d’absence de malice.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  choice: sans vous mêler des actes de votre prochain
  rationale: Exprime l’ingérence indiscrète visée par le participe, tout en gardant πράξεις au sens concret d’« actes ».
- source_word: πένητα καὶ ἀσθενῆ ἐλεήσατε
  choice: ayez compassion du pauvre et du faible
  rationale: Restitue l’impératif de miséricorde en français actuel et respecte les deux catégories vulnérables nommées dans le grec.
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν εἰς τὸ γεωργεῖν
  choice: Courbez le dos pour cultiver la terre
  rationale: Conserve l’image corporelle de l’effort agricole sans reproduire servilement une tournure grecque peu idiomatique en français.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: appliquez-vous chaque jour aux travaux des champs
  rationale: Le texte transmis est quelque peu lourd ; cette formulation garde l’idée d’un travail agricole assidu et quotidien.
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: en présentant au Seigneur des dons avec reconnaissance
  rationale: « Présenter des dons » garde la coloration cultuelle de προσφέρειν et « reconnaissance » rend naturellement εὐχαριστία dans ce contexte.
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: dans les prémices des produits de la terre
  rationale: Conserve explicitement le vocabulaire des prémices et l’ambiguïté de la préposition ἐν, sans imposer un mécanisme précis de bénédiction.
- source_word: τῆς πιότητος τῆς γῆς
  choice: la fertilité de la terre
  rationale: Littéralement, le grec évoque la « graisse » ou la « richesse » du sol ; « fertilité » transmet clairement cette image agricole en français moderne.
- source_word: τὴν ἱερατείαν / τὴν βασιλείαν
  choice: le sacerdoce / la royauté
  rationale: Ces termes français formels correspondent aux fonctions attribuées respectivement à Lévi et à Juda, sans ajouter d’interprétation confessionnelle.
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: les bandes de pillards qui fondraient sur Israël
  rationale: Dans ce contexte terrestre, πειρατήρια désigne plus vraisemblablement des groupes de maraudeurs que des pirates maritimes ; la formulation garde l’idée d’attaques survenant contre Israël.
theological_decisions:
- issue: Identité de « tous ceux qui sont saints, depuis Abel jusqu’à maintenant »
  choice: Conserver la désignation « ceux qui sont saints » et l’expliquer en note
  alternative: Traduire « tous les justes »
  rationale: Le grec porte ἁγίους, et non le terme précis pour « justes ». La traduction préserve donc le lexème et laisse ouverte la portée exacte du groupe.
- issue: Statut de la proposition finale concernant Gad
  choice: La traduire entre crochets et signaler sa difficulté textuelle
  alternative: L’omettre comme glose tardive, ou l’intégrer sans marque distinctive
  rationale: La proposition figure dans le témoin grec fourni, mais son raccord avec l’exhortation relative à Lévi et Juda est abrupt. Les crochets rendent visible cette tension sans trancher définitivement son origine.
- issue: Nature de l’héritage attribué à Lévi et Juda
  choice: Maintenir la répartition explicite entre sacerdoce et royauté
  alternative: Paraphraser en fonctions religieuse et politique
  rationale: Les substantifs grecs sont explicites ; leur traduction directe évite aussi bien l’effacement que l’ajout de développements doctrinaux ultérieurs.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs conservent la tonalité testamentaire, tandis que les expressions agricoles sont rendues de façon concrète. Les termes structurants « simplicité », « prémices », « sacerdoce » et « royauté » sont maintenus pour préserver les motifs et tensions du texte source.
