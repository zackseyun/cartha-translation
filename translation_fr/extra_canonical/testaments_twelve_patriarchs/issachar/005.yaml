  naturalness: Le français est moderne, clair et d’un registre convenant à une exhortation testamentaire. « Travaillez à toutes sortes de cultures » restitue le v. 3 plus exactement tout en restant naturel. La formulation de la clause sur Gad est ajustée afin de ne pas introduire le conditionnel français (« fondraient »), absent du participe grec.
  terminology: « Loi de Dieu », « simplicité », « innocence », « prémices », « sacerdoce » et « royauté » sont cohérents et appropriés. « Fertilité de la terre » est une bonne traduction idiomatique de l’image de la richesse/gras du sol, explicitée par la note.
