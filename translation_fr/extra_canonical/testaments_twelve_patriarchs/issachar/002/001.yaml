  text: II. Τότε Γοὖν¹ ὤφθη τῷ² Ἰακώβ³ Γἄγγελος Κυρίου καὶ εἶπε λέγων⁴, *ὅτι τέκνα τέξει Ῥαχήλ⁵, *ἐπειδὴ κατέπτυσεν⁶ συνουσίαν⁷ ἀνδρὸς καὶ ἐξελέξατο τὴν⁸ ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: fr
  text: 'Alors un ange du Seigneur apparut à Jacob et lui dit : « Rachel aura des enfants, parce qu’elle a dédaigné l’union avec un homme et choisi la maîtrise de soi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα τέξει
  choice: aura des enfants
  rationale: Rend naturellement en français l’idée qu’elle enfantera, sans introduire un nombre absent du texte grec fourni.
- source_word: κατέπτυσεν
  choice: a dédaigné
  rationale: Conserve la force du verbe grec, littéralement associé au mépris, sans recourir à une formulation inutilement crue.
- source_word: συνουσίαν ἀνδρός
  choice: les relations conjugales
  rationale: Exprime l’union sexuelle avec le mari dans un français actuel et digne; « conjugales » préserve le cadre marital indiqué par ἀνδρός.
- source_word: ἐγκράτειαν
  choice: la maîtrise de soi
  rationale: Équivalent courant qui garde l’idée de retenue ou de continence sans la réduire explicitement à une doctrine ascétique particulière.
theological_decisions:
- issue: Lien causal entre la conduite de Rachel et la promesse d’enfants
  choice: Maintenir « parce que »
  alternative: Atténuer en « puisque » ou reformuler sans causalité directe
  rationale: ἐπειδή établit explicitement un rapport causal; la traduction conserve donc la tension théologique du texte sans l’expliquer ni la corriger.
- issue: Nature de l’ἐγκράτεια de Rachel
  choice: « maîtrise de soi »
  alternative: « continence »
  rationale: Le terme grec peut désigner la retenue, notamment sexuelle dans ce contexte. « Maîtrise de soi » préserve une certaine amplitude sémantique, tandis que « continence » préciserait davantage que ne le fait le mot isolé.
translation_notes:
  register: Français international moderne, naturel et digne. La construction redondante εἶπε λέγων est rendue idiomatiquement par « lui dit ». Aucun nombre d’enfants n’est ajouté, conformément au texte grec fourni.
