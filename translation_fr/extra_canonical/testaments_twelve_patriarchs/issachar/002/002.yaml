revisions:
- from: Et si Léa, ma mère, n’avait pas cédé les deux fruits en échange d’une union, elle aurait dû enfanter huit fils. C’est pourquoi elle en enfanta six, tandis que Rachel enfanta les deux autres, car, par les mandragores, le Seigneur intervint en sa faveur.
  to: Et si Léa, ma mère, n’avait pas cédé les deux fruits en échange de relations conjugales, elle aurait mis au monde huit fils. C’est pourquoi elle en enfanta six, et Rachel mit au monde les deux fils, car c’est à l’occasion des mandragores que le Seigneur la visita.
  rationale: La révision rend la valeur de ἔμελλε sans suggérer une obligation morale, évite l’ajout de « autres », et restitue directement le verbe de visite divine. « À l’occasion des mandragores » maintient le lien circonstanciel ou causal du grec sans attribuer aux plantes un mécanisme autonome ou précis.
