  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: fr
  text: Et si Léa, ma mère, n’avait pas cédé les deux fruits en échange de relations conjugales, elle aurait mis au monde huit fils. C’est pourquoi elle en enfanta six, et Rachel mit au monde les deux fils, car c’est à l’occasion des mandragores que le Seigneur la visita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας
  choice: une union
  rationale: Le terme désigne ici les relations conjugales; « une union » reste naturel et digne tout en conservant le sens sexuel suggéré par le contexte.
- source_word: ἀπέδοτο
  choice: avait cédé
  rationale: Le verbe exprime une transaction ou un échange; « céder » rend l’idée que Léa a remis les fruits en contrepartie de l’union.
- source_word: τὰ δύο μῆλα
  choice: les deux fruits
  rationale: μῆλα peut désigner des fruits sans préciser leur espèce. Le contexte les identifie ensuite aux mandragores; traduire d’emblée par « pommes » serait inutilement spécifique.
- source_word: ἔμελλε τεκεῖν
  choice: aurait dû enfanter
  rationale: La tournure exprime ce qui devait ou allait se produire dans cette situation contrefactuelle; elle ne signifie pas ici une obligation morale.
- source_word: ἐν τοῖς μανδραγόροις
  choice: par les mandragores
  rationale: La préposition ἐν a ici une valeur instrumentale ou circonstancielle. Cette formulation préserve le lien causal affirmé par le texte sans expliquer le mécanisme.
- source_word: ἐπεσκέψατο αὐτὴν
  choice: intervint en sa faveur
  rationale: ἐπισκέπτομαι appliqué à Dieu indique une visite providentielle porteuse d’action. « Intervenir en sa faveur » est clair en français moderne et évite le contresens d’une simple visite physique.
theological_decisions:
- issue: Rôle des mandragores et action divine dans la conception de Rachel
  choice: « par les mandragores, le Seigneur intervint en sa faveur »
  alternative: « à cause des mandragores, le Seigneur la visita »
  rationale: Le texte associe étroitement les mandragores à l’intervention du Seigneur sans préciser leur efficacité propre. La traduction conserve cette tension causale et n’attribue pas explicitement une puissance fécondante autonome aux plantes.
- issue: Répartition des huit fils entre Léa et Rachel
  choice: « Rachel enfanta les deux autres »
  alternative: « Rachel enfanta les deux »
  rationale: '« Les deux autres » explicite seulement le contraste arithmétique présent dans le grec: Léa en enfante six sur les huit annoncés, Rachel les deux restants.'
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au registre testamentaire. « Enfanter » maintient la coloration biblique sans devenir archaïque; « union » évite à la fois la crudité et l’euphémisme opaque.
