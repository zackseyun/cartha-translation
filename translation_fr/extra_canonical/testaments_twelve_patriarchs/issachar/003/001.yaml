  source_fidelity: 'Le sens général est bien rendu : la maturité, la droiture intérieure, le travail agricole familial et les produits des champs au temps approprié sont tous présents. Toutefois, les aoristes grecs appellent ici une narration homogène plutôt que l’imparfait « je rapportais », et « au service de » ajoute une nuance de subordination qui n’est pas explicitement exprimée par les datifs.'
