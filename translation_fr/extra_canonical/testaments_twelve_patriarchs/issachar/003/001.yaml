  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/001.yaml
  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: fr
  text: Quand donc je fus arrivé à l’âge adulte, mes enfants, je marchai avec un cœur droit. Je devins cultivateur pour mon père et mes frères, et je rapportai des champs des récoltes en leur saison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: je fus devenu adulte
  rationale: Le verbe exprime ici l’accès à la maturité; cette formulation naturelle conserve le sens de «grandir» sans suggérer une simple augmentation de taille.
- source_word: ἐν εὐθύτητι καρδίας
  choice: avec un cœur droit
  rationale: Rend idiomatiquement l’idée de droiture intérieure tout en conservant l’image biblique du cœur.
- source_word: γεωργός
  choice: cultivateur
  rationale: Terme courant et digne désignant celui qui travaille la terre; il convient mieux au contexte que le terme plus large «agriculteur».
- source_word: τῷ πατρί μου καὶ τοῖς ἀδελφοῖς μου
  choice: au service de mon père et de mes frères
  rationale: Le datif indique les bénéficiaires de son activité; «au service de» l’explicite naturellement sans imposer l’idée de propriété.
- source_word: ἔφερον καρπούς
  choice: je rapportais … leurs récoltes
  rationale: Dans le contexte des champs, καρποί désigne les produits ou récoltes; l’imparfait français rend l’activité habituelle suggérée par le récit.
- source_word: κατὰ καιρὸν αὐτῶν
  choice: en leur saison
  rationale: Conserve la référence distributive aux récoltes et l’idée du moment approprié.
