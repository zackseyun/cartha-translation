base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: fr
  text: Et mon père se réjouissait toujours de ma simplicité, parce que j’offrais au Seigneur, par l’intermédiaire du prêtre, tout premier-né, puis aussi à mon père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητί
  choice: simplicité
  rationale: Le terme exprime ici la simplicité ou la droiture sans duplicité. « Simplicité » conserve le lien lexical avec le thème du passage sans préciser excessivement le sens.
- source_word: πᾶν πρῶτον γέννημα
  choice: tout premier-né
  rationale: Rend littéralement l’expression grecque désignant toute première progéniture, tout en restant naturel en français.
- source_word: διὰ τοῦ ἱερέως
  choice: par l’intermédiaire du prêtre
  rationale: Explicite la valeur instrumentale ou médiatrice de διά avec le génitif sans suggérer que le prêtre est le bénéficiaire de l’offrande.
- source_word: προσέφερον
  choice: j’offrais
  rationale: L’imparfait grec décrit une pratique répétée ou habituelle, bien rendue par l’imparfait français.
theological_decisions:
- issue: Nature exacte de ce qui est donné ensuite au père
  choice: 'Conserver l’ellipse : « puis aussi à mon père »'
  alternative: Ajouter un objet explicite, par exemple « puis j’en donnais aussi à mon père »
  rationale: Le grec laisse l’objet de la seconde proposition implicite. La traduction conserve cette concision et l’ambiguïté de la construction plutôt que de préciser la nature ou la part du don.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec, notamment dans la proposition finale elliptique, tout en clarifiant la fonction du prêtre par « par l’intermédiaire de ».
