base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: fr
  text: Et le Seigneur multiplia par dix mille les biens qui étaient entre mes mains. Jacob, mon père, savait lui aussi que Dieu œuvrait avec ma simplicité. Car je donnais à tous les pauvres et à tous les affligés des biens de la terre, dans la simplicité de mon cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: multiplia par dix mille
  rationale: Rend explicitement la force de μυριο- sans atténuer l'hyperbole grecque.
- source_word: τὰ ἀγαθὰ
  choice: les biens
  rationale: Le contexte désigne les bonnes ressources ou productions matérielles confiées à Issachar.
- source_word: συνεργεῖ τῇ ἁπλότητί μου
  choice: œuvrait avec ma simplicité
  rationale: Conserve la construction grecque et sa tension sémantique, sans la résoudre en « récompensait » ou « favorisait ».
- source_word: πένησι καὶ θλιβομένοις
  choice: aux pauvres et aux affligés
  rationale: Distingue le dénuement matériel de la détresse ou de l'oppression.
- source_word: ἐν ἁπλότητι καρδίας μου
  choice: dans la simplicité de mon cœur
  rationale: Reproduit le motif éthique central de ἁπλότης avec une formulation française digne et intelligible.
theological_decisions:
- issue: Rapport entre l'action de Dieu et la simplicité d'Issachar
  choice: Dieu œuvrait avec ma simplicité
  alternative: Dieu favorisait ma droiture
  rationale: Le grec συνεργεῖ exprime une coopération ou une action conjointe; la traduction retenue préserve cette formulation inhabituelle sans imposer une doctrine précise de la récompense.
- issue: Sens moral de ἁπλότης
  choice: simplicité
  alternative: sincérité / générosité
  rationale: « Simplicité » maintient l'ambivalence du terme, qui peut évoquer l'intégrité, l'absence de duplicité et la générosité, plutôt que de sélectionner un seul aspect.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement fluidifiée; « une part » explicite naturellement en français l'emploi partitif de ἐκ τῶν ἀγαθῶν sans changer le sens. La révision anglaise récente n'a pas été suivie là où elle diverge du texte grec fourni.
