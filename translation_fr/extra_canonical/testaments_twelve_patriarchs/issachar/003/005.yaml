revisions:
- from: À trente-cinq ans, je pris une femme pour épouse, car le travail épuisait mes forces. Je ne songeais pas au plaisir que procure une femme ; au contraire, à cause de mon labeur, le sommeil prenait le dessus sur moi.
  to: À l’âge de trente-cinq ans, je pris une femme pour épouse, car le labeur épuisait mes forces, et je ne pensais pas au plaisir d’une femme ; mais, à cause de mon travail, le sommeil l’emporta sur moi.
  rationale: La révision retire une explicitation non justifiée du génitif γυναικός, atténue le contraste ajouté par « au contraire » et rend plus directement la prévalence du sommeil. Elle conserve le sens matrimonial, le registre moderne et l’ambiguïté du texte source.
