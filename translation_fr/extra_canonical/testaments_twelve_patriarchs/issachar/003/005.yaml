  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/005.yaml
  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: fr
  text: À l’âge de trente-cinq ans, je pris une femme pour épouse, car le labeur épuisait mes forces, et je ne pensais pas au plaisir d’une femme ; mais, à cause de mon travail, le sommeil l’emporta sur moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον ἐμαυτῷ γυναῖκα
  choice: je pris une femme pour épouse
  rationale: Cette formulation naturelle en français explicite le sens matrimonial de l’expression grecque sans ajouter d’idée étrangère.
- source_word: ὁ κάματος κατήσθιε τὴν ἰσχύν μου
  choice: le travail épuisait mes forces
  rationale: Le grec dit littéralement que le labeur « dévorait » sa force ; « épuisait mes forces » en restitue clairement l’image et le sens en français courant.
- source_word: οὐκ ἐνενόουν ἡδονὴν γυναικός
  choice: je ne songeais pas au plaisir que procure une femme
  rationale: La construction génitive demeure susceptible de nuances ; cette traduction garde la référence au plaisir lié à la femme sans la réduire explicitement au seul désir du locuteur.
- source_word: διὰ τοῦ κόπου
  choice: à cause de mon labeur
  rationale: « Labeur » rend κόπος comme travail pénible et fatigant, tout en gardant un registre digne.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: le sommeil prenait le dessus sur moi
  rationale: περιγίνομαι exprime ici l’idée de prévaloir ou de l’emporter ; cette tournure française conserve cette force mieux que le simple « venait sur moi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le parallélisme entre l’épuisement causé par le travail, l’absence de pensée tournée vers le plaisir féminin et la domination du sommeil est conservé.
