  text: I never spoke ill of anyone, nor did I criticize a person's life.
translation:
  language: fr
  text: Je n’ai jamais dit de mal de personne, ni critiqué la manière de vivre de qui que ce soit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάλησά
  choice: dit du mal de
  rationale: Le verbe καταλαλέω désigne le fait de parler contre quelqu’un ou d’en dire du mal; cette formulation naturelle conserve sa portée générale sans la restreindre à la calomnie.
- source_word: ἔψεξα
  choice: critiqué
  rationale: Le verbe ψέγω signifie blâmer, désapprouver ou critiquer. « Critiqué » rend ici l’acte de porter un jugement défavorable sans en accentuer indûment la force.
- source_word: βίον ἀνθρώπου
  choice: la manière de vivre de qui que ce soit
  rationale: Dans ce contexte, βίος renvoie à la vie menée ou à la conduite, tandis que ἄνθρωπος est générique. Cette tournure idiomatique évite un masculin inutile et exprime clairement le sens visé.
