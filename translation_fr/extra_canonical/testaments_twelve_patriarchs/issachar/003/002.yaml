base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/002.yaml
  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: fr
  text: Et mon père me bénissait, voyant que je marchais devant lui avec simplicité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  choice: bénissait
  rationale: L’imparfait grec présente la bénédiction du père comme une action passée en cours ou répétée; l’imparfait français en conserve l’aspect.
- source_word: ἐν ἁπλότητι
  choice: avec un cœur sans partage
  rationale: ἁπλότης désigne ici la simplicité, la droiture ou la sincérité intérieure. Cette expression naturelle évite le sens moderne possible de naïveté attaché à « simplicité ».
- source_word: πορεύομαι
  choice: je marchais
  rationale: Le verbe exprime au sens figuré la conduite ou la manière de vivre. Le présent grec dépend de βλέπων με et se rend naturellement à l’imparfait dans le récit français.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: devant lui
  rationale: Rend directement la relation au père évoqué, sans préciser davantage la nuance de présence, de regard ou d’approbation.
theological_decisions:
- issue: Portée morale de ἁπλότης
  choice: un cœur sans partage
  alternative: simplicité / droiture / sincérité
  rationale: Le choix exprime une disposition intérieure entière et droite sans réduire le terme à la naïveté ni lui imposer une doctrine particulière.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec tout en explicitant idiomatiquement la valeur morale de ἁπλότης.
