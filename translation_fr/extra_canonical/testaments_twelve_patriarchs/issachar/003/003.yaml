- from: Et je ne suis pas indiscret dans mes actes, ni envieux ou malveillant envers mon prochain.
  to: Et, dans ma conduite, je ne me mêle pas de ce qui ne me regarde pas, et je ne suis ni envieux ni malveillant envers mon prochain.
