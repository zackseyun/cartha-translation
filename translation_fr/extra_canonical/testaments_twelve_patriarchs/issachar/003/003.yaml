  text: 3. *Καὶ οὐκ εἰμὶ¹⁵ περίεργος *ἐν ταῖς πράξεσίν μου¹⁶, Γοὐδὲ φθονερὸς¹⁷ καὶ¹⁸ βάσκανος *τῷ πλησίον μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/003.yaml
  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: fr
  text: Et, dans ma conduite, je ne me mêle pas de ce qui ne me regarde pas, et je ne suis ni envieux ni malveillant envers mon prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος
  choice: indiscret
  rationale: Le terme désigne ici quelqu’un qui se mêle de ce qui ne le regarde pas. « Indiscret » rend cette idée naturellement en français, dans le cadre de ses propres activités.
- source_word: ἐν ταῖς πράξεσίν μου
  choice: dans mes actes
  rationale: Traduction concise et formelle de la locution, sans préciser davantage la nature des actes.
- source_word: φθονερὸς
  choice: envieux
  rationale: Correspond directement à l’idée de jalousie ou d’envie dirigée contre autrui.
- source_word: βάσκανος
  choice: malveillant
  rationale: Le mot peut évoquer une hostilité envieuse ou le mauvais œil. Puisque φθονερός exprime déjà l’envie, « malveillant » préserve ici la nuance distincte sans introduire explicitement une conception magique.
- source_word: τῷ πλησίον μου
  choice: envers mon prochain
  rationale: « Mon prochain » est une formulation française claire et digne qui conserve la portée relationnelle du grec.
theological_decisions:
- issue: Portée de « envers mon prochain »
  choice: La locution est comprise comme portant sur les deux adjectifs « envieux » et « malveillant ».
  alternative: La rattacher uniquement à « malveillant ».
  rationale: La coordination grecque φθονερὸς καὶ βάσκανος suivie d’un seul complément au datif permet naturellement de faire porter celui-ci sur les deux adjectifs.
translation_notes:
  register: Français moderne, simple et digne. Le présent de εἰμί est conservé. La coordination « ni… ou… » traite les deux adjectifs comme un groupe relevant de la seconde négation, conformément au texte grec fourni.
