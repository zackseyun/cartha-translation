base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: fr
  text: Il n’éprouve pas de jalousie dans ses réflexions ; [la jalousie malveillante ne consume pas son âme][a], et son esprit n’est pas tiraillé par l’avidité. Mais il marche avec simplicité d’âme ; il voit tout avec droiture de cœur, sans accueillir de mauvais regards issus de l’égarement du monde[b], afin de ne pas voir les commandements du Seigneur comme déformés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition entre crochets appartient à une expansion textuelle signalée dans le texte grec imprimé : « la jalousie malveillante ne consume pas son âme ». Elle est ici traduite comme partie du témoignage grec donné.'
    reason: textual_variant
  - marker: b
    text: L’expression grecque signifie littéralement « des yeux mauvais ». Elle peut aussi évoquer le « mauvais œil », c’est-à-dire un regard hostile ou envieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: éprouve de la jalousie dans ses réflexions
  rationale: Dans ce catalogue moral, ζηλοῖ désigne la jalousie envieuse plutôt qu’un zèle positif. « Réflexions » rend naturellement les délibérations intérieures exprimées par διαβουλίοις.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: la jalousie malveillante ne consume pas son âme
  rationale: βάσκανος évoque une envie hostile, tandis que ἐκτήκει exprime une action qui ronge ou consume intérieurement. La formulation distingue cette expression de l’image du regard mauvais au verset suivant.
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: l’avidité ne disperse pas son esprit
  rationale: περισπασμός évoque l’esprit tiré en plusieurs directions, et ἀπληστία une avidité insatiable. La formulation française clarifie le rapport tout en conservant l’image de la dispersion intérieure.
- source_word: ἁπλότητι ψυχῆς
  choice: avec simplicité d’âme
  rationale: Cette expression conserve le vocabulaire thématique de la simplicité morale sans la réduire à la seule sincérité.
- source_word: εὐθύτητι καρδίας
  choice: avec droiture de cœur
  rationale: « Droiture de cœur » exprime naturellement la rectitude intérieure et garde la métaphore éthique du grec.
- source_word: μὴ ἐπιδεχόμενος
  choice: sans accueillir
  rationale: Le participe indique le refus de recevoir ou de laisser entrer une influence. « Sans accueillir » est naturel et maintient cette dimension active.
- source_word: ὀφθαλμοὺς πονηρούς
  choice: le regard mauvais
  rationale: Le singulier idiomatique français rend l’image grecque plurielle et peut évoquer aussi bien une manière hostile ou envieuse de regarder que le motif du « mauvais œil ».
- source_word: πλάνης τοῦ κόσμου
  choice: l’égarement du monde
  rationale: πλάνη peut désigner l’erreur, la tromperie ou l’égarement. « Égarement » préserve cette amplitude sans imposer que le monde soit l’agent conscient d’une tromperie.
- source_word: διεστραμμένας
  choice: comme déformés
  rationale: Le terme décrit une perception faussée ou tordue des commandements. « Déformés » conserve cette métaphore sans l’alourdir.
theological_decisions:
- issue: Sujet implicite des maximes éthiques
  choice: Troisième personne générique au masculin (« il »)
  alternative: Formulation impersonnelle (« on ») ou exhortation à la deuxième personne
  rationale: Le grec dresse à la troisième personne le portrait proverbial de l’être humain simple et droit. Le maintien de « il » respecte cette forme sans transformer la description en commandement direct.
- issue: Lien final entre l’influence du monde et la perception des commandements
  choice: 'Conserver la finalité négative : « afin de ne pas voir… comme déformés »'
  alternative: Reformuler comme une affirmation selon laquelle les commandements eux-mêmes seraient déformés
  rationale: La syntaxe présente le danger comme une perception faussée des commandements du Seigneur, non comme une altération réelle de ceux-ci. La traduction maintient cette tension perceptive.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve les expressions structurantes « simplicité d’âme » et « droiture de cœur », tout en privilégiant une syntaxe française naturelle. Les marqueurs de notes sont placés exactement à l’endroit des difficultés textuelle et lexicale correspondantes.
