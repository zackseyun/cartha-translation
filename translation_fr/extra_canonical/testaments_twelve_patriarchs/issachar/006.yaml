base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: fr
  text: 1 Sachez donc, mes enfants, que, dans les derniers temps, vos fils abandonneront la simplicité et s’attacheront à l’avidité. Délaissant l’innocence[a], ils se tourneront vers la ruse ; abandonnant les commandements du Seigneur, ils s’attacheront à Béliar[b]. 2 Délaissant le travail de la terre, ils suivront leurs mauvais desseins ; ils seront dispersés parmi les nations et serviront leurs ennemis. 3 Vous aussi, dites donc ces choses à vos enfants, afin que, s’ils pèchent, ils reviennent au plus vite au Seigneur[c], 4 car il est compatissant et les délivrera pour les ramener dans leur pays[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’absence de malice » ou « la droiture sans duplicité ». Le mot grec ἀκακία souligne l’absence de mal et de tromperie.
    reason: lexical_alternative
  - marker: b
    text: Béliar est la forme du nom employée dans le texte grec ; ce nom est aussi connu sous la forme « Bélial ».
    reason: lexical_alternative
  - marker: c
    text: « Revenir au Seigneur » évoque ici la repentance aussi bien que le rétablissement de la relation avec lui.
    reason: cross_reference
  - marker: d
    text: 'La dernière proposition, condensée en grec, peut aussi se comprendre ainsi : « et les rétablira dans leur pays ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: simplicité
  rationale: 'Conserve le terme thématique du testament : une disposition morale sans duplicité et un cœur sans partage, plutôt qu’un manque de discernement.'
- source_word: ἀπληστία
  choice: avidité
  rationale: Rend le désir insatiable et accapareur qui s’oppose à la simplicité ; le terme est naturel et moralement marqué en français actuel.
- source_word: ἀκακία
  choice: innocence
  rationale: Expression française fluide dans l’opposition avec la ruse ; la note signale la nuance plus précise d’absence de malice ou de duplicité.
- source_word: πανουργία
  choice: ruse
  rationale: Désigne ici une habileté moralement dévoyée. « Ruse » maintient nettement le contraste avec l’innocence.
- source_word: κολλάω / κολληθήσονται
  choice: s’attacher à
  rationale: Préserve la répétition rhétorique et le mouvement d’adhésion, d’abord à l’avidité, puis à Béliar.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Transcrit la forme grecque du témoin, avec l’accentuation française, sans la normaliser silencieusement en « Bélial ».
- source_word: γεωργεῖν
  choice: le travail de la terre
  rationale: Rend concrètement l’activité agricole au cœur de l’idéal d’Issachar et convient mieux au complément de « délaisser » que le substantif abstrait « agriculture ».
- source_word: πονηροῖς διαβουλίοις
  choice: leurs mauvais desseins
  rationale: Exprime des projets moralement mauvais et délibérés. Le possessif suit αὐτῶν, qui peut renvoyer aux fils mentionnés comme sujet.
- source_word: διασπαρήσονται
  choice: ils seront dispersés
  rationale: Conserve le passif et la portée exilique de la dispersion parmi les nations.
- source_word: δουλεύσουσιν
  choice: serviront
  rationale: Rend directement le verbe de service ou de sujétion ; le contexte des ennemis fait entendre la domination sans imposer explicitement l’idée d’esclavage.
- source_word: τάχιον
  choice: au plus vite
  rationale: Formulation française idiomatique qui garde l’appel pressant à revenir promptement après le péché.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: reviennent au Seigneur
  rationale: Préserve à la fois le retour relationnel vers Dieu, la repentance et la possibilité d’une restauration.
- source_word: ἐλεήμων
  choice: compatissant
  rationale: Rend la disposition miséricordieuse du Seigneur dans un français courant et digne.
theological_decisions:
- issue: Portée de ἐν ἐσχάτοις καιροῖς
  choice: dans les derniers temps
  alternative: dans les temps à venir ; à la fin des temps
  rationale: La formule annonce les temps ultimes ou derniers sans imposer un calendrier apocalyptique précis. La traduction maintient le registre prophétique et son ouverture.
- issue: Sens religieux de ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: reviennent au Seigneur
  alternative: se tournent de nouveau vers le Seigneur
  rationale: Le verbe peut exprimer simultanément la repentance, le renouvellement de l’allégeance et la restauration ; « reviennent » garde ces dimensions sans les réduire à une seule.
- issue: Rapport syntaxique de τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν
  choice: pour les ramener dans leur pays
  alternative: et les rétablira dans leur pays ; lorsqu’il les ramènera dans leur pays
  rationale: L’infinitif grec est condensé et peut exprimer le but ou le résultat de la délivrance. Le texte principal retient le but, tandis que la note conserve l’autre analyse possible.
- issue: Identité de Béliar
  choice: conserver le nom propre sans explicitation doctrinale dans le corps du texte
  alternative: remplacer par Bélial ou expliciter comme figure du mal
  rationale: Le témoin grec porte Βελίαρ. La traduction évite d’ajouter une identification théologique que ce verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du ton testamentaire et prophétique. Les parallélismes « délaissant / abandonnant » et la répétition de « s’attacher » reproduisent la progression rhétorique grecque sans lourdeur excessive. « Pays » rend ici γῆ dans le sens du territoire ancestral ; la note conserve l’ambiguïté syntaxique de la restauration finale.
