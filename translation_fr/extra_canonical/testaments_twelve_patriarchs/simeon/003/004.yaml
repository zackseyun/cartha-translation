  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: fr
  text: Pendant deux ans donc, dans la crainte du Seigneur, j’ai affligé mon âme par le jeûne, et j’ai compris que la délivrance de l’envie s’opère par la crainte de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: j’ai affligé mon âme
  rationale: Rend de près l’expression grecque et conserve son registre scripturaire, où l’ascèse volontaire atteint la personne intérieure.
- source_word: ἐν νηστείᾳ
  choice: par le jeûne
  rationale: Le grec instrumental est rendu naturellement en français par « par », indiquant le moyen de cette affliction.
- source_word: ἡ λύσις τοῦ φθόνου
  choice: la délivrance de l’envie
  rationale: « Délivrance » exprime l’idée de dénouement ou d’affranchissement portée par λύσις, tandis que « envie » rend φθόνος sans préciser davantage sa nuance.
- source_word: γίνεται
  choice: s’opère
  rationale: Conserve le caractère processuel de « se produit / advient » dans une formulation française naturelle et digne.
theological_decisions:
- issue: Rapport entre la crainte de Dieu et la délivrance de l’envie
  choice: s’opère par la crainte de Dieu
  alternative: vient de la crainte de Dieu
  rationale: La formulation retenue préserve διά comme moyen, sans transformer explicitement la crainte de Dieu en cause unique ni développer la nature de cette crainte.
translation_notes:
  register: Français moderne, international et digne, avec une légère couleur scripturaire. La répétition « crainte du Seigneur / crainte de Dieu » est conservée conformément au grec.
