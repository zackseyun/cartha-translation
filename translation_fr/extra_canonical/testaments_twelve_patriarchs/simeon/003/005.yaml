base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: fr
  text: Car si quelqu’un se réfugie auprès du Seigneur, l’esprit mauvais s’enfuit loin de lui, et sa pensée s’allège.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son intelligence devient légère » ou « son esprit devient léger ». Le grec διάνοια peut désigner la pensée, l’intelligence ou la disposition intérieure; l’image de légèreté évoque un allègement sans en préciser davantage la nature.'
    reason: Signale l’étendue sémantique de διάνοια et préserve l’image de κούφη, tout en expliquant le choix français plus naturel de « sa pensée s’allège ».
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: cherche refuge auprès du Seigneur
  rationale: Rend naturellement l’idée de se réfugier en se tournant vers le Seigneur, sans alourdir la phrase.
- source_word: ἀποτρέχει
  choice: s’enfuit loin de lui
  rationale: Conserve la force dynamique du verbe, qui évoque l’éloignement rapide de l’esprit mauvais.
- source_word: τὸ πονηρὸν πνεῦμα
  choice: l’esprit mauvais
  rationale: Traduction directe qui préserve la portée spirituelle et morale de l’expression.
- source_word: ἡ διάνοια
  choice: son intelligence
  rationale: Dans ce contexte, désigne la faculté intérieure de penser et de comprendre; le possessif français explicite naturellement le rapport à la personne sans modifier le sens.
- source_word: κούφη
  choice: légère
  rationale: 'Préserve l’image grecque et son ambiguïté possible: libérée d’un poids, apaisée ou moins accablée.'
theological_decisions:
- issue: Nature de la fuite de l’esprit mauvais
  choice: 'Formulation affirmative proche du grec: « l’esprit mauvais s’enfuit loin de lui »'
  alternative: « le mauvais esprit le quitte »
  rationale: Le texte décrit une fuite provoquée par le recours au Seigneur; la traduction n’ajoute aucune théorie sur la possession ou la délivrance.
- issue: Sens de la légèreté de l’intelligence
  choice: Maintien de la métaphore « devient légère »
  alternative: « trouve du soulagement » ou « devient sereine »
  rationale: Le grec reste imagé et peut évoquer le soulagement, l’allègement ou la disponibilité intérieure; une paraphrase trancherait indûment.
translation_notes:
  register: Français moderne, clair et digne. La structure causale et le parallélisme du grec sont conservés; la métaphore finale demeure volontairement ouverte.
