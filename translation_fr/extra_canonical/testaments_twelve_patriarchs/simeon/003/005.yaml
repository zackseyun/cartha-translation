  source_fidelity: 'Le sens du grec est fidèlement rendu : le recours au Seigneur entraîne la fuite de l’esprit mauvais, puis l’allègement de la διάνοια. « Cherche refuge auprès du Seigneur » est défendable, mais « se réfugie auprès du Seigneur » correspond plus directement à καταφύγῃ. La métaphore de κούφη doit être conservée sans la réduire à une interprétation psychologique précise.'
  naturalness: « Son intelligence devient légère » est grammaticalement possible mais peu naturel en français moderne et risque d’évoquer une intelligence superficielle. « Sa pensée s’allège » conserve l’image d’un poids ôté tout en étant plus idiomatique.
