source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: fr
  text: Car l’envie domine l’esprit tout entier d’une personne et ne lui permet ni de manger, ni de boire, ni de faire quoi que ce soit de bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: la jalousie
  rationale: Dans ce contexte moral, le terme désigne la jalousie envieuse qui cherche à posséder ou supporte mal le bien d’autrui; «jalousie» est naturel et immédiatement compréhensible en français moderne.
- source_word: κυριεύει
  choice: domine
  rationale: Rend l’idée d’exercer une maîtrise ou une emprise sur quelque chose, sans alourdir la phrase avec «se rend maître de».
- source_word: πάσης τῆς διανοίας
  choice: toute la pensée
  rationale: Préserve la totalité exprimée par πάσης et rend διάνοια par un terme français courant désignant la faculté intérieure de penser et de vouloir.
- source_word: τοῦ ἀνθρώπου
  choice: d’une personne
  rationale: Exprime ici l’être humain de façon générique et inclusive, conformément au sens de ἄνθρωπος.
- source_word: οὐκ ἀφίησιν
  choice: ne lui permet… ni
  rationale: Dans cette construction avec des infinitifs, ἀφίημι signifie «laisser, permettre»; la tournure corrélative française reproduit naturellement la série grecque.
- source_word: ποιῆσαί τι ἀγαθόν
  choice: faire quoi que ce soit de bon
  rationale: 'Rend la portée négative de τι dans la série gouvernée par οὐκ: la jalousie empêche toute bonne action.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination ternaire du grec est conservée, de même que l’emprise totale attribuée à la jalousie; aucune précision doctrinale étrangère au texte n’est ajoutée.
