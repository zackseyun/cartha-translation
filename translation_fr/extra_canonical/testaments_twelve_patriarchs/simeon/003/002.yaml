  source_fidelity: 'Révision nécessaire du terme φθόνος : « envie » est le correspondant français le plus direct et le moins ambigu. « Jalousie » peut recouvrir ce sens, mais évoque couramment en français une relation affective ou possessive et affaiblit la précision du vice visé. « Esprit » rend plus naturellement διάνοια comme faculté intérieure que « pensée », qui peut désigner le contenu d’une pensée.'
  naturalness: 'La phrase révisée conserve la construction ternaire du grec tout en utilisant une formulation moderne et fluide : « l’esprit tout entier » exprime naturellement la totalité de πάσης τῆς διανοίας.'
