  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/006.yaml
  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: fr
  text: Dès lors, il éprouve de la compassion pour celui qui est envié, il pardonne à ceux qui l’aiment et, ainsi, il cesse d’être jaloux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπὸν
  choice: Dès lors
  rationale: Dans ce contexte, l’expression marque la conséquence ou le nouvel état qui s’ensuit, plutôt qu’un simple « enfin ».
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: il compatit avec celui qui est victime de jalousie
  rationale: Συμπαθεῖ exprime le fait de partager la souffrance ou d’éprouver de la compassion, tandis que le participe passif φθονουμένῳ désigne la personne qui subit la jalousie d’autrui.
- source_word: συγγινώσκει
  choice: pardonne
  rationale: Le verbe peut signifier comprendre, se montrer indulgent ou pardonner ; « pardonne » rend ici le dépassement concret de l’hostilité jalouse.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: à ceux qui aiment cet homme
  rationale: Le pronom αὐτόν renvoie naturellement à la personne victime de jalousie ; « cet homme » clarifie le référent sans lui donner une identité absente du grec.
- source_word: παύεται τοῦ φθόνου
  choice: il cesse d’être jaloux
  rationale: La construction signifie qu’il se détourne de la jalousie ou y met fin ; cette formulation est plus naturelle en français que « il cesse de la jalousie ».
theological_decisions:
- issue: Nature du changement moral décrit
  choice: Présenter la compassion et le pardon comme conduisant à la cessation de la jalousie
  alternative: Interpréter le passage comme une prescription explicite ou comme une transformation opérée par une cause théologique non nommée
  rationale: Le grec énonce une progression morale sans préciser ici de doctrine causale ; la traduction conserve cette sobriété.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et lisible, avec une légère explicitation du référent de αὐτόν afin d’éviter l’ambiguïté pronominale artificielle en français.
