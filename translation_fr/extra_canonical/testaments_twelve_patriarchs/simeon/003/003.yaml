review_pass:
  verdict: revise
  source_fidelity: Le grec oppose de façon cohérente la personne enviée (τὸν φθονούμενον / ὁ μὲν φθονούμενος) à celle qui envie (ὁ δὲ φθονῶν). Le sujet implicite de ὑποβάλλει est contextuel et le pronom français « elle » le conserve sans ajout. « À tuer », « toujours » et l’antithèse finale rendent correctement le texte.
  naturalness: La syntaxe est naturelle, mais « être jalousé / jalouser » est moins direct et moins stable en français international moderne que « être envié / envier » dans cette opposition. « Fleurir » restitue en outre plus exactement l’image végétale de ἀνθεῖ et s’accorde nettement avec « se flétrir ».
  terminology: La famille φθον- désigne ici l’envie hostile, comme le confirme l’incitation à tuer la personne enviée. Employer uniformément « envier » évite l’ambiguïté française possible de « jalousie » et maintient les reprises lexicales du grec.
  issues:
  - severity: medium
    issue: « jalousé / jalouser » traduit de manière moins précise et moins idiomatique la série φθονούμενον / φθονῶν.
    rationale: Dans ce contexte, φθόνος vise l’envie hostile envers autrui. « Envié / envie » est le rendu français le plus transparent, reproduit la répétition grecque et correspond également à l’audit anglais.
  - severity: low
    issue: « s’épanouir » atténue l’image explicite de ἀνθεῖ.
    rationale: Le verbe signifie littéralement « fleurir » ; « fleurit » est naturel en français et préserve mieux le contraste imagé avec μαραίνεται, « se flétrit ».
  revised_text: Mais elle pousse sans cesse à tuer celui qui est envié ; celui qui est envié fleurit toujours, tandis que celui qui envie se flétrit.
