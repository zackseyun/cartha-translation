revisions:
- from: Mais elle pousse sans cesse à tuer celui qui est jalousé ; celui qui est jalousé ne cesse de s’épanouir, tandis que celui qui jalouse dépérit.
  to: Mais elle pousse sans cesse à tuer celui qui est envié ; celui qui est envié fleurit toujours, tandis que celui qui envie se flétrit.
  rationale: 'La révision adopte uniformément « envier » pour la famille φθον- et restitue l’imagerie végétale explicite : la personne enviée « fleurit », alors que celle qui envie « se flétrit ». Le sujet féminin implicite, l’incitation à tuer et la structure contrastive sont conservés.'
