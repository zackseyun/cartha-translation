  text: Ἀλλὰ⁹ *πάντοτε ὑποβάλλει¹⁰ ἀνελεῖν¹¹ τὸν φθονούμενον· *καὶ ὁ μὲν φθονούμενος πάντοτε ἀνθεῖ, ὁ δὲ φθονῶν μαραίνεται¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: fr
  text: Mais elle pousse sans cesse à tuer celui qui est envié ; celui qui est envié fleurit toujours, tandis que celui qui envie se flétrit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε ὑποβάλλει
  choice: pousse sans cesse
  rationale: ὑποβάλλει exprime ici l’incitation ou la suggestion insistante ; « pousse » est naturel en français et « sans cesse » rend πάντοτε sans lourdeur.
- source_word: ἀνελεῖν
  choice: à tuer
  rationale: L’infinitif signifie ici faire mourir ou supprimer ; « tuer » restitue directement la force du grec.
- source_word: τὸν φθονούμενον
  choice: celui qui est jalousé
  rationale: Le participe passif désigne la personne qui fait l’objet de la jalousie ou de l’envie.
- source_word: ἀνθεῖ
  choice: s’épanouir
  rationale: Le verbe signifie littéralement « fleurir » et, au figuré, prospérer ; « s’épanouir » conserve l’image végétale tout en restant idiomatique.
- source_word: ὁ δὲ φθονῶν μαραίνεται
  choice: tandis que celui qui jalouse dépérit
  rationale: « Dépérit » rend l’image contrastée de μαραίνεται, « se flétrit », et fait écho naturellement à « s’épanouir ».
theological_decisions:
- issue: Référent implicite du sujet de ὑποβάλλει
  choice: elle
  alternative: cela / il
  rationale: Le grec omet le sujet, récupérable dans le contexte antérieur. Le féminin français signale vraisemblablement « la jalousie/l’envie » sans l’expliciter de nouveau ; le passage isolé conserve donc une dépendance contextuelle comparable à celle du grec.
- issue: Nuance de φθόνος et de ses dérivés
  choice: jalouser / être jalousé
  alternative: envier / être envié
  rationale: « Jalousie » convient au mouvement hostile qui souhaite la disparition de l’autre et évite que « envie » soit compris comme un simple désir d’obtenir ce qu’il possède.
translation_notes:
  register: Français moderne, digne et accessible. La construction antithétique et l’image de l’épanouissement opposé au dépérissement sont conservées. Aucun marqueur de note n’est nécessaire.
