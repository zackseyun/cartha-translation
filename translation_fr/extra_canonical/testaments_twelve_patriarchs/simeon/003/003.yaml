  revision_rationale: 'La révision adopte uniformément « envier » pour la famille φθον- et restitue l’imagerie végétale explicite : la personne enviée « fleurit », alors que celle qui envie « se flétrit ». Le sujet féminin implicite, l’incitation à tuer et la structure contrastive sont conservés.'
