base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: fr
  text: Et maintenant, mes enfants, écoutez-moi et gardez-vous de l’esprit d’égarement et d’envie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Rend directement l’adresse affectueuse du patriarche à ses descendants, dans un français naturel et digne.
- source_word: φυλάξασθε ἀπό
  choice: gardez-vous de
  rationale: Exprime l’exhortation à se tenir à l’écart d’une influence dangereuse sans alourdir la phrase.
- source_word: πνεύματος τῆς πλάνης
  choice: esprit d’égarement
  rationale: πλάνη désigne l’erreur qui détourne du bon chemin ou l’action d’égarer. « Égarement » conserve cette portée sans réduire le terme à une tromperie intentionnelle.
- source_word: φθόνου
  choice: envie
  rationale: Correspond au sentiment hostile suscité par le bien ou l’avantage d’autrui; le terme français conserve la nuance morale de φθόνος.
theological_decisions:
- issue: Rapport entre « esprit », « égarement » et « envie »
  choice: Un seul « esprit » qualifié par les deux génitifs
  alternative: Comprendre « l’esprit d’égarement » et « l’envie » comme deux dangers distincts
  rationale: La construction grecque rattache naturellement τῆς πλάνης et τοῦ φθόνου à πνεύματος. La traduction maintient toutefois la coordination concise de l’original sans développer une interprétation ontologique de « l’esprit ».
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation conserve le ton direct d’une exhortation testamentaire.
