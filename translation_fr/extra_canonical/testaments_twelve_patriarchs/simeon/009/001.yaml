  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: fr
  text: Les fils de Siméon pleurèrent leur père. Ils étaient en Égypte jusqu’au jour de leur sortie par l’intermédiaire de Moïse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: pleurèrent
  rationale: Rend directement l’aoriste de κλαίω dans un registre narratif naturel et digne.
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: furent en Égypte
  rationale: Reflète sobrement le verbe « être » sans ajouter l’idée explicite de « rester », tout en donnant un français narratif compréhensible.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: jusqu’au jour où ils en sortirent
  rationale: Exprime naturellement en français « jusqu’au jour de leur sortie », le pronom « en » renvoyant clairement à l’Égypte.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: sous la conduite de Moïse
  rationale: L’expression sémitisante « par la main de Moïse » désigne ici l’intermédiaire ou la direction exercée par Moïse; cette formulation conserve le sens sans produire un calque peu naturel.
theological_decisions:
- issue: Rôle de Moïse dans la sortie d’Égypte
  choice: sous la conduite de Moïse
  alternative: par la main de Moïse
  rationale: La traduction indique le rôle humain de Moïse sans lui attribuer explicitement la puissance ultime de la délivrance et sans introduire une précision théologique absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination répétée par Καὶ est allégée au début de la seconde phrase afin d’éviter une lourdeur, sans perte de contenu.
