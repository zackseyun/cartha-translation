    rationale: Le texte source présente le chapitre V avec les versets 1 à 6. Le premier paragraphe de la traduction doit donc être numéroté « 1. », et non « 5. ».
  - severity: low
    issue: « vous trouverez faveur »
    rationale: Le grec εὑρίσκειν χάριν correspond à l’expression française courante « trouver grâce », qui conserve aussi le vocabulaire relationnel du texte.
  - severity: low
