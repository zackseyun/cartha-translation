base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: fr
  text: '1. Voilà pourquoi Joseph avait une belle prestance et était beau à voir : rien de mauvais n’habitait en lui, car le visage révèle le trouble de l’esprit.


    2. Et maintenant, mes enfants, rendez vos cœurs bons devant le Seigneur et aplanissez vos chemins devant les hommes ; alors vous trouverez grâce devant le Seigneur et devant les hommes.


    3. Gardez-vous donc de l’inconduite sexuelle, car elle est la mère des maux : elle sépare de Dieu et rapproche de Béliar[a].


    4. En effet, j’ai vu dans un écrit d’Hénoch que vos fils seront corrompus dans l’inconduite sexuelle et qu’ils feront du tort aux fils de Lévi par l’épée.


    5. Mais ils ne pourront pas résister à Lévi, car celui-ci mènera le combat du Seigneur et vaincra toute votre armée.


    6. Ils seront peu nombreux et seront répartis parmi Lévi et Juda. Aucun d’entre vous ne sera chef, comme notre père l’a lui aussi prophétisé dans ses bénédictions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Béliar : nom donné au chef ou à la personnification des puissances du mal.'
    reason: Le nom propre peut être inconnu du lectorat moderne ; cette brève identification éclaire le contraste avec Dieu sans importer une construction doctrinale détaillée.
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: avait une belle stature et était beau à voir
  rationale: Rend les deux expressions grecques distinctes sans produire en français une répétition pesante.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: le trouble de l’esprit
  rationale: Conserve la portée intérieure et volontairement générale de πνεῦμα, sans préciser arbitrairement « âme » ou « humeur ».
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: aplanissez vos chemins
  rationale: Préserve l’image biblique des chemins rendus droits tout en employant une formulation française naturelle.
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: Terme moderne et compréhensible couvrant largement l’immoralité sexuelle visée par le grec, sans la réduire à la prostitution.
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: dans un écrit d’Hénoch
  rationale: Formulation idiomatique qui conserve la référence à une tradition écrite attribuée à Hénoch sans surcharger le texte du sens matériel de χαρακτήρ.
- source_word: ἀδικήσουσιν ἐν ῥομφαίᾳ
  choice: feront du tort aux fils de Lévi par l’épée
  rationale: Garde le sens large de ἀδικέω et la mention explicite de l’épée, plutôt que de préciser sans nécessité la forme exacte de l’agression.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: mènera le combat du Seigneur
  rationale: Reproduit l’idée d’un combat appartenant au Seigneur sans imposer le sens possible mais non nécessaire de « guerre sainte ».
- source_word: παρεμβολήν
  choice: armée
  rationale: Dans ce contexte militaire, désigne naturellement les forces rassemblées, plutôt qu’un « camp » au sens de lieu.
- source_word: ἐπιμεριζόμενοι ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: répartis parmi Lévi et Juda
  rationale: Conserve l’idée d’une dispersion ou distribution entre les groupes de Lévi et de Juda, sans expliciter davantage une syntaxe grecque difficile.
- source_word: τις εἰς ἡγεμονίαν
  choice: aucun d’entre vous n’accédera au commandement
  rationale: Exprime l’absence d’accès à une position dirigeante tout en laissant ouverte la nature précise de cette autorité.
theological_decisions:
- issue: Nature du lien entre l’apparence de Joseph et son état intérieur
  choice: « rien de mauvais n’habitait en lui, car le visage révèle le trouble de l’esprit »
  alternative: Interpréter l’absence de trouble visible comme une preuve absolue de pureté morale
  rationale: La traduction suit l’affirmation du texte sans développer une doctrine générale de la physionomie ni résoudre sa tension anthropologique.
- issue: Référent du sujet singulier en 5.5
  choice: « celui-ci », renvoyant à Lévi
  alternative: Faire de Dieu ou de la tribu de Lévi le sujet explicite
  rationale: Le grec nomme Lévi juste avant et poursuit au singulier ; « celui-ci » garde ce lien grammatical sans décider si Lévi représente aussi collectivement ses descendants.
- issue: « combat du Seigneur »
  choice: relation possessive laissée ouverte
  alternative: « combat pour le Seigneur » ou « guerre menée par le Seigneur »
  rationale: Le génitif Κυρίου peut évoquer un combat appartenant au Seigneur, livré pour lui ou investi par lui ; la formulation retenue préserve cette densité.
- issue: Répartition parmi Lévi et Juda
  choice: maintenir une formulation sobre et relativement ouverte
  alternative: Affirmer explicitement l’absorption historique de Siméon dans les tribus de Lévi et de Juda
  rationale: Le passage suggère une dispersion, mais n’en expose pas précisément le mécanisme historique ou tribal.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est évité grâce aux formes possessives et impératives usuelles. Les images bibliques structurantes sont conservées, tandis que les tournures grecques les plus lourdes sont rendues idiomatiquement. La numérotation suit le chapitre 5 fourni, dont le premier paragraphe porte implicitement le numéro 1.
