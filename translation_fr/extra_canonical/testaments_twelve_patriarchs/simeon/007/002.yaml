  source_fidelity: 'Le texte rend fidèlement la structure grecque : le Seigneur suscite un grand prêtre issu de Lévi et un roi issu de Juda, puis le démonstratif singulier « celui-ci » est conservé sans résoudre l’ambiguïté de son antécédent. Les deux segments éditorialement incertains demeurent entre crochets. « Suscitera », « grand prêtre », « roi » et « descendance d’Israël » sont des équivalents justes dans ce contexte.'
