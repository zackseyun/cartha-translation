base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: fr
  text: Car le Seigneur suscitera, de Lévi, un grand prêtre, et de Juda, un roi, [Dieu et homme][a] ; celui-ci sauvera [toutes les nations ainsi que][b] la descendance d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « Dieu et homme » sont placés entre crochets dans l’édition grecque suivie, ce qui signale leur caractère textuellement incertain.
    reason: Rendre visible l’incertitude éditoriale du segment grec [Θεὸν καὶ ἄνθρωπον].
  - marker: b
    text: Les mots « toutes les nations ainsi que » sont placés entre crochets dans l’édition grecque suivie, ce qui signale leur caractère textuellement incertain.
    reason: Rendre visible l’incertitude éditoriale du segment grec [πάντα τὰ ἔθνη καὶ].
lexical_decisions:
- source_word: Ἀναστήσει
  choice: suscitera
  rationale: Ce verbe rend le sens de « faire paraître, faire se lever » ici, dans un registre dignifié et courant.
- source_word: ὡς ἀρχιερέα / ὡς βασιλέα
  choice: un grand prêtre / un roi
  rationale: Cette formulation française naturelle suit la fonction attribuée à chacun, sans alourdir la phrase par un « comme » ambigu en français.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: la descendance d’Israël
  rationale: « Descendance » exprime ici le groupe issu d’Israël plus naturellement que « race », terme aujourd’hui équivoque.
- source_word: οὗτος
  choice: celui-ci
  rationale: Le démonstratif masculin singulier est conservé afin de ne pas effacer la tension entre les deux figures précédemment mentionnées et le sauveur désigné au singulier.
theological_decisions:
- issue: Identification du grand prêtre, du roi et du sauveur singulier
  choice: Conserver deux désignations suivies du singulier « celui-ci »
  alternative: Fusionner explicitement les fonctions en une seule personne ou attribuer « celui-ci » uniquement au roi
  rationale: Le grec mentionne Lévi et Juda séparément, puis emploie un démonstratif singulier. La traduction préserve cette tension sans trancher l’identification.
- issue: Expression « Θεὸν καὶ ἄνθρωπον »
  choice: '[Dieu et homme]'
  alternative: « [un Dieu et un homme] » ou suppression du segment
  rationale: La forme sans articles se rend naturellement ainsi en français, tandis que les crochets signalent l’incertitude textuelle de l’édition sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation maintient la progression de la phrase grecque, tandis que les crochets et leurs notes préservent les incertitudes textuelles.
