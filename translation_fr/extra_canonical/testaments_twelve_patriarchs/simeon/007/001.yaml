    issue: Formulation française quelque peu calquée de l'interdiction.
    rationale: « Ne vous élevez pas au-dessus de » est moins idiomatique et légèrement plus spatial que l'idée grecque de se hausser orgueilleusement contre/au-dessus de ces groupes. Une formulation de supériorité rend mieux l'effet pragmatique sans modifier le sens.
