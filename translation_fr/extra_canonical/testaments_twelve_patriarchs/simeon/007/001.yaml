  verdict: revise
  source_fidelity: 'Le sens fondamental du grec est bien rendu : l''exhortation s''adresse aux enfants de Siméon, nomme Lévi et Juda, interdit une attitude d''élévation orgueilleuse envers les deux groupes, et annonce que le salut de Dieu surgira d''eux pour « nous ». « Lignées » est défendable pour γενεαί, bien que le contexte renvoie aux groupes issus de Lévi et Juda. Le génitif « de Dieu » préserve utilement son ambiguïté, et la note signale correctement l''incertitude textuelle de τοῦ Θεοῦ.'
  naturalness: La première phrase est naturelle. En revanche, « Ne vous élevez pas au-dessus de ces deux lignées » est compréhensible mais sonne relativement littéral et peut évoquer une position spatiale. « Ne vous croyez pas supérieurs à ces deux lignées » exprime naturellement en français moderne la mise en garde contre l'orgueil impliquée par ἐπαίρεσθε ἐπί.
  terminology: Les noms « Lévi » et « Juda » sont corrects. « Salut de Dieu » est une formulation française digne et suffisamment ouverte pour τὸ σωτήριον τοῦ Θεοῦ. La conservation de « lignées » évite d'imposer « tribus » là où le grec emploie γενεαί.
  issues:
