  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: fr
  text: Et maintenant, mes enfants, écoutez Lévi et Juda. Ne vous croyez pas supérieurs à ces deux lignées, car c’est d’elles que surgira pour nous le salut de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’édition grecque suivie, les mots traduits par « de Dieu » sont signalés comme textuellement incertains.
    reason: Les signes critiques entourant τοῦ Θεοῦ dans la source demandent que son statut textuel soit porté à la connaissance du lecteur sans supprimer les mots du texte principal.
lexical_decisions:
- source_word: ἐπακούσατε
  choice: écoutez
  rationale: L’impératif appelle ici à prêter attention et à obéir aux exhortations de Lévi et de Juda; « écoutez » conserve naturellement cette portée en français.
- source_word: γενεὰς
  choice: lignées
  rationale: Le terme désigne ici les groupes issus de Lévi et de Juda. « Lignées » reste proche du sens généalogique grec sans imposer le terme plus institutionnel « tribus ».
- source_word: ἀνατελεῖ
  choice: surgira
  rationale: Le verbe évoque ce qui se lève ou apparaît, notamment un astre ou une pousse. « Surgira » rend cette image de provenance et de manifestation sans l’alourdir.
- source_word: τὸ σωτήριον
  choice: le salut
  rationale: Le neutre substantivé désigne ici le salut ou l’œuvre salvatrice; « le salut » est la formulation française la plus claire et la plus digne.
theological_decisions:
- issue: Origine du salut dans les lignées de Lévi et de Juda
  choice: « c’est d’elles que surgira pour nous le salut de Dieu »
  alternative: « par elles, Dieu nous apportera le salut »
  rationale: La formulation retenue préserve l’image et la syntaxe du grec, ainsi que la tension entre la provenance humaine indiquée par les deux lignées et l’attribution du salut à Dieu, sans préciser artificiellement le mode d’accomplissement.
- issue: Valeur du génitif τοῦ Θεοῦ
  choice: « de Dieu »
  alternative: « venant de Dieu »
  rationale: Le génitif peut exprimer l’origine, l’appartenance ou l’action divine. Le calque français naturel « de Dieu » conserve cette ouverture au lieu de trancher.
translation_notes:
  register: Français international moderne, simple et digne. La reprise emphatique « c’est d’elles que » restitue ἐξ αὐτῶν et souligne les deux lignées sans rendre la phrase artificielle. Le verset est divisé en deux phrases pour une lecture fluide.
