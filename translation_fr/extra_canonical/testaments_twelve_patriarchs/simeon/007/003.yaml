  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/003.yaml
  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: fr
  text: C’est pourquoi je vous prescris ces choses, afin que vous aussi les prescriviez à vos enfants, afin qu’ils les gardent de génération en génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι / ἐντέλλεσθε
  choice: je vous prescris / vous les prescriviez
  rationale: Le verbe exprime le fait de donner une instruction faisant autorité. « Prescrire » conserve cette force tout en permettant de rendre naturellement la répétition grecque.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: à vos enfants
  rationale: Traduction directe, sans ajouter l’expansion absente du grec concernant Israël ou sa descendance.
- source_word: φυλάξωσιν αὐτά
  choice: qu’ils les gardent
  rationale: '« Garder » préserve la portée assez large de φυλάσσω : conserver ces prescriptions et les observer.'
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: au fil de leurs générations
  rationale: Cette formulation française indique la transmission et la conservation dans les générations successives sans imposer une durée plus absolue que le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de ἐντέλλομαι est maintenue afin de faire ressortir la transmission des prescriptions du père aux enfants. Le référent de « ces choses » demeure volontairement contextuel, comme dans le grec.
