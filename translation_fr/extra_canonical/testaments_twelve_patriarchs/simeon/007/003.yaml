  text: Διὰ τοῦτο ταῦτα²³ ἐντέλλομαι ὑμῖν²⁴ ἵνα²⁵ καὶ ὑμεῖς ἐντέλλεσθε²⁶ τοῖς τέκνοις ὑμῶν²⁷, ὅπως²⁸ φυλάξωσιν αὐτὰ²⁹ εἰς τὰς³⁰ γενεὰς αὐτῶν³¹.
