source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ὡς¹ συνετέλεσεν² Συμεὼν ἐντελλόμενος³ τοῖς υἱοῖς⁴ αὐτοῦ⁵, ἐκοιμήθη⁶ *μετὰ τῶν πατέρων αὐτοῦ⁷ *ὢν ἐτῶν ἑκατὸν εἴκοσι⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: fr
  text: Quand Siméon eut fini de donner ses instructions à ses fils, il s’endormit avec ses pères, à l’âge de cent vingt ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: eut fini de donner ses instructions
  rationale: Rend naturellement en français l’idée d’achever une série de prescriptions ou de recommandations, sans durcir le sens en « ordonner ».
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Conserve l’euphémisme grec traditionnel pour la mort et sa portée théologique possible.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: auprès de ses pères
  rationale: Préserve l’expression ancestrale du grec, qui évoque la réunion aux ancêtres, sans la réduire explicitement à l’inhumation.
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: à l’âge de cent vingt ans
  rationale: Formulation française idiomatique et fidèle à l’indication d’âge.
theological_decisions:
- issue: Sens de l’image du sommeil appliquée à la mort
  choice: Conserver « il s’endormit »
  alternative: « il mourut »
  rationale: Le grec emploie explicitement κοιμάομαι; traduire simplement par « mourut » ferait disparaître une image porteuse d’une possible résonance théologique.
- issue: Réunion avec les ancêtres
  choice: « auprès de ses pères »
  alternative: « avec ses ancêtres »
  rationale: « Pères » maintient la formulation traditionnelle et la tension entre appartenance familiale, mort et destinée après la mort; « auprès de » est plus naturel ici que « avec » en français.
translation_notes:
  register: Français moderne, digne et accessible. Le passé antérieur marque clairement l’achèvement des instructions avant la mort de Siméon. Aucun marqueur de note n’est requis.
