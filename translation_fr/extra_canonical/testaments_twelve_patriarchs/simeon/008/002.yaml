revisions:
- from: Ils le déposèrent dans un cercueil de bois, afin de faire monter ses ossements à Hébron. Puis ils les firent monter secrètement lors d’une guerre des Égyptiens.
  to: Ils le déposèrent dans un cercueil de bois, afin de transporter ses ossements jusqu’à Hébron. Puis ils les transportèrent secrètement lors d’une guerre des Égyptiens.
  rationale: La révision supprime la causativité non marquée du français « faire monter » tout en préservant le transfert des ossements vers Hébron. Elle maintient l’expression « guerre des Égyptiens », qui laisse ouverte, comme le grec ἐν πολέμῳ Αἰγυπτίων, la nature exacte du rapport entre les Égyptiens et la guerre.
