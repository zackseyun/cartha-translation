source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔθηκαν αὐτὸν ἐν *θήκῃ ξυλίνῃ⁹, *τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ¹⁰ ἐν Χεβρών. Καὶ ἀνήγαγον¹¹ *αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: fr
  text: Ils le déposèrent dans un cercueil de bois, afin de transporter ses ossements jusqu’à Hébron. Puis ils les transportèrent secrètement lors d’une guerre des Égyptiens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: cercueil de bois
  rationale: Dans ce contexte funéraire, θήκη désigne un coffre destiné au corps; « cercueil » est le terme français naturel et précis, tandis que ξυλίνῃ indique qu’il est en bois.
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: faire monter / firent monter
  rationale: Cette formulation conserve le mouvement ascendant exprimé par ἀνά, traditionnellement associé au trajet de l’Égypte vers Hébron, sans simplement le réduire à « transporter ».
- source_word: κρυφῇ
  choice: secrètement
  rationale: L’adverbe français rend directement l’idée d’une action accomplie à l’insu d’autrui.
- source_word: ἐν πολέμῳ Αἰγυπτίων
  choice: lors d’une guerre des Égyptiens
  rationale: Cette formulation reste proche de la construction grecque et conserve l’ambiguïté du génitif Αἰγυπτίων quant au rapport exact entre les Égyptiens et la guerre.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Déposèrent » convient au contexte funéraire; « ossements » est plus idiomatique que « os » pour des restes humains. La légère étrangeté de « guerre des Égyptiens » est maintenue afin de ne pas préciser sans preuve s’il s’agit d’une guerre menée par eux, contre eux ou les concernant.
