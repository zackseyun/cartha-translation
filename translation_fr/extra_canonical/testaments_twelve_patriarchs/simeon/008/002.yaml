review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : dépôt dans un cercueil en bois, transfert des ossements à Hébron, clandestinité et cadre d’une guerre associé aux Égyptiens. Toutefois, « faire monter / firent monter » introduit en français une nuance causative (faire accomplir l’action par autrui) qui n’est pas exprimée par les formes grecques actives ἀναγαγεῖν et ἀνήγαγον.'
  naturalness: Le registre est bon et « cercueil de bois », « ossements » et « secrètement » sont naturels. Le remplacement de la tournure causative par « transporter » produit un français plus direct sans modifier le sens narratif. « Une guerre des Égyptiens » conserve utilement l’indétermination du génitif grec, même si la formule demeure volontairement inhabituelle.
  terminology: θήκη ξυλίνη est correctement rendu par « cercueil de bois ». « Ossements » convient pour ὀστᾶ dans ce contexte funéraire. « Hébron » est la forme française usuelle. Le lien exact des Égyptiens avec la guerre ne doit pas être précisé davantage.
  issues:
  - severity: medium
    issue: Nuance causative ajoutée par « faire monter / firent monter »
    rationale: En français, « ils firent monter les ossements » suggère normalement qu’ils chargèrent d’autres personnes de les monter. Le grec emploie des formes actives dont les auteurs sont directement « ils »; « transporter » évite cette implication sans trancher davantage le mouvement implicite dans ἀνά.
  revised_text: Ils le déposèrent dans un cercueil de bois, afin de transporter ses ossements jusqu’à Hébron. Puis ils les transportèrent secrètement lors d’une guerre des Égyptiens.
  revised_footnotes: []
  revision_rationale: La révision supprime la causativité non marquée du français « faire monter » tout en préservant le transfert des ossements vers Hébron. Elle maintient l’expression « guerre des Égyptiens », qui laisse ouverte, comme le grec ἐν πολέμῳ Αἰγυπτίων, la nature exacte du rapport entre les Égyptiens et la guerre.
