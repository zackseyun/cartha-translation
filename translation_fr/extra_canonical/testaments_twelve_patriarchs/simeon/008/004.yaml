base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: fr
  text: Car les enchanteurs leur disaient que, lorsque les ossements de Joseph sortiraient, l’obscurité et les ténèbres couvriraient tout le pays, et qu’un grand fléau frapperait les Égyptiens, si bien que chacun ne reconnaîtrait pas son frère, même à la lumière d’une lampe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαοιδοί
  choice: enchanteurs
  rationale: Le terme désigne des personnes qui recourent à des incantations ou formules magiques. « Enchanteurs » est naturel en français et conserve cette nuance sans les assimiler plus précisément à des magiciens ou devins.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: lorsque les ossements de Joseph sortiraient
  rationale: Cette formulation conserve l’image concrète et inhabituelle de la sortie des ossements, plutôt que d’expliciter leur transport hors d’Égypte.
- source_word: σκότος καὶ γνόφος
  choice: l’obscurité et les ténèbres
  rationale: Le doublet grec est maintenu par deux termes français proches, le second évoquant une obscurité particulièrement profonde.
- source_word: πληγὴ μεγάλη τοῖς Αἰγυπτίοις
  choice: un grand fléau frapperait les Égyptiens
  rationale: « Fléau » rend πληγή dans un contexte de calamité; la construction verbale naturelle en français exprime clairement que les Égyptiens en sont les victimes.
- source_word: μετὰ λύχνου
  choice: même à la lumière d’une lampe
  rationale: Le grec dit littéralement « avec une lampe »; l’explicitation de la lumière donne en français le sens instrumental attendu sans ajouter d’interprétation substantielle.
- source_word: ἕκαστος … τὸν ἀδελφὸν αὐτοῦ
  choice: personne ne reconnaîtrait son frère
  rationale: La tournure négative française rend naturellement « chacun ne reconnaîtrait pas son frère » et conserve le référent familial du grec.
