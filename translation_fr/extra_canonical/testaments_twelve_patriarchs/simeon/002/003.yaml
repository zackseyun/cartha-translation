  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/003.yaml
  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: fr
  text: 'Car je devins très fort : je ne reculai devant aucune action et je n’eus peur de rien.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς … ἐγενόμην
  choice: j’étais devenu … fort
  rationale: Rend la construction grecque exprimant l’acquisition ou l’atteinte d’une grande force, tout en restant naturelle en français.
- source_word: σφόδρα
  choice: extrêmement
  rationale: Conserve l’intensité marquée de l’adverbe grec.
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  choice: je ne reculais devant aucun acte
  rationale: Le verbe évoque la lâcheté ou le fait de perdre courage; cette formulation idiomatique respecte le sens sans donner au terme πρᾶξις une valeur morale absente du grec.
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  choice: et je n’avais peur de rien
  rationale: Expression française naturelle qui restitue la négation générale portée par παντός dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux propositions négatives est conservé, sans ajouter de jugement moral sur les actes évoqués.
