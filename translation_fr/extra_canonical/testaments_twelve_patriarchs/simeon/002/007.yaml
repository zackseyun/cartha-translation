revisions:
- from: 'Et je tournai contre lui toute ma colère[a] afin de le tuer, car le souverain de l’égarement et l’esprit de jalousie avaient aveuglé mon intelligence : je ne voyais plus en lui un frère et je n’épargnais même pas mon père Jacob.'
  to: Et je tournai contre lui ma colère[a] afin de le tuer, car le souverain de l’égarement et l’esprit de jalousie avaient aveuglé mon intelligence, de sorte que je ne le considérais pas comme un frère et que je n’épargnais même pas Jacob, mon père.
  rationale: La révision retire l’intensif non exprimé « toute », rend προσέχειν par « considérer » plutôt que par une perception visuelle, et explicite la valeur consécutive de la construction grecque sans ajouter d’interprétation doctrinale. Elle conserve les titres ambigus et la note nécessaire sur l’idiome des « foies ».
