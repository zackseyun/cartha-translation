  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: fr
  text: Et je tournai contre lui ma colère[a] afin de le tuer, car le souverain de l’égarement et l’esprit de jalousie avaient aveuglé mon intelligence, de sorte que je ne le considérais pas comme un frère et que je n’épargnais même pas Jacob, mon père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je dirigeai contre lui mes foies ». Dans l’anthropologie ancienne, le foie pouvait être considéré comme le siège des passions et de la colère.'
    reason: La note conserve l’image corporelle plurielle du grec, tandis que le texte français rend idiomatiquement le sens probable de l’expression.
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  choice: je tournai contre lui toute ma colère
  rationale: Littéralement, le grec évoque le fait de « fixer/diriger son foie contre » quelqu’un. Le foie étant associé aux émotions et aux passions, une traduction idiomatique par « colère » communique naturellement le sens en français, tandis qu’une note conserve l’image grecque.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: le souverain de l’égarement
  rationale: « Souverain » rend ἄρχων sans préciser davantage l’identité de cet être; « égarement » préserve la portée de πλάνη, qui peut évoquer l’erreur, la tromperie ou le fait d’être détourné du bon chemin.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: l’esprit de jalousie
  rationale: Dans ce contexte d’hostilité envers un frère, « jalousie » rend naturellement ζῆλος, avec sa nuance possible d’envie.
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  choice: avaient aveuglé mon intelligence
  rationale: Cette formulation conserve la métaphore de l’aveuglement et rend νοῦς par « intelligence », au sens de faculté de comprendre et de juger.
- source_word: μὴ προσέχειν αὐτῷ ὡς ἀδελφῷ
  choice: je ne voyais plus en lui un frère
  rationale: Rend de façon naturelle le défaut d’attention ou de considération envers lui en tant que frère, sans réduire προσέχειν à la seule perception visuelle.
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακώβ
  choice: je n’épargnais même pas mon père Jacob
  rationale: Suit directement le grec et exprime que Siméon ne tenait pas compte de la souffrance ou du tort causé à son père.
theological_decisions:
- issue: Identité du « souverain de l’égarement »
  choice: Conserver le titre indéfini du grec
  alternative: L’identifier explicitement à Satan ou au diable
  rationale: Le verset ne donne pas lui-même cette identification; la traduction préserve donc l’ambiguïté du texte.
- issue: Relation grammaticale entre le souverain et l’esprit
  choice: Les présenter comme deux sujets coordonnés du verbe « aveugler »
  alternative: Les fusionner en une seule figure ou faire de l’esprit un attribut du souverain
  rationale: Le grec coordonne ὁ ἄρχων et τὸ πνεῦμα par καί; le français maintient cette tension sans trancher leur relation ontologique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement de la phrase grecque, tout en explicitant naturellement l’idiome du foie. Le texte soumis suit le grec fourni; il ne reprend pas la révision anglaise signalée, car celle-ci introduit des éléments absents de cette ligne grecque.
