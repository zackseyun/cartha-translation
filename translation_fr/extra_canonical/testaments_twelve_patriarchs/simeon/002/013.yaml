source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: fr
  text: Et j’ai compris, mes enfants, que cela m’était arrivé à cause de Joseph. Alors je me suis repenti, j’ai pleuré et j’ai prié le Seigneur Dieu afin que ma main soit rétablie et que je m’abstienne de toute souillure, de toute envie et de toute folie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: j’ai compris
  rationale: Exprime naturellement la prise de conscience de Siméon dans ce contexte.
- source_word: μετανοήσας
  choice: je me suis repenti
  rationale: Rend le changement intérieur accompagné de regret moral, plutôt qu’un simple changement d’avis.
- source_word: ἀποκατασταθῇ
  choice: rétablir
  rationale: Restitue l’idée de rendre la main à son état normal.
- source_word: ἀποσχῶ
  choice: m’aider à m’abstenir
  rationale: Dans la construction après « j’ai prié », cette formulation française explicite naturellement que l’abstention demandée dépend de l’aide divine, sans modifier le but de la prière.
- source_word: μολυσμοῦ
  choice: souillure
  rationale: Conserve la portée morale forte du terme grec dans un registre digne et intelligible.
- source_word: φθόνου
  choice: jalousie
  rationale: Terme français courant adapté à l’hostilité envieuse de Siméon envers Joseph.
- source_word: ἀφροσύνης
  choice: folie
  rationale: Préserve la qualification morale générale du grec sans la réduire à l’imprudence.
theological_decisions:
- issue: Cause de l’affliction physique
  choice: à cause de Joseph
  alternative: au sujet de Joseph
  rationale: περὶ Ἰωσήφ peut avoir une valeur causale ou référentielle; le contexte relie l’état de la main à la conduite de Siméon envers Joseph. La formulation retenue conserve toutefois une certaine largeur quant à la nature exacte de ce lien.
- issue: Nature de la repentance
  choice: je me suis repenti
  alternative: j’ai changé d’attitude
  rationale: Le contexte de pleurs, de prière et d’abandon des vices donne à μετανοήσας une nette portée morale.
- issue: Portée de πάντως / πάσης dans l’énumération
  choice: toute souillure, toute jalousie et toute folie
  alternative: toute souillure et jalousie, et toute folie
  rationale: La répétition française de « toute » clarifie que la renonciation vise chaque catégorie dans son ensemble, sans introduire de distinction théologique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque participiale est restructurée en phrases verbales fluides. « Mes enfants » conserve l’adresse paternelle; aucun archaïsme ni particularisme confessionnel n’est introduit.
