review_pass:
  verdict: revise
  source_fidelity: 'La phrase suit fidèlement la progression grecque : prise de conscience, repentance, pleurs et prière. « À cause de Joseph » est conforme à la lecture contextuelle et à la piste d’audit anglaise de περί Ἰωσήφ. En revanche, « m’aider à m’abstenir » ajoute explicitement une aide divine qui n’est pas formulée dans le grec : les deux subjonctifs sous ἵνα expriment directement les objets de la prière.'
  naturalness: Le français est naturel et conserve un registre sobre et digne. La formulation avec « afin que ... et que ... » rend clairement la double finalité de la prière sans alourdir la phrase.
  terminology: « Se repentir », « souillure » et « folie » conviennent bien au registre moral du passage. « Envie » rend plus précisément φθόνος que « jalousie », qui peut désigner prioritairement la crainte de perdre une relation ou un bien. « Seigneur Dieu » est une restitution naturelle de Κύριος ὁ Θεός.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « de m’aider à m’abstenir »
    rationale: ἀποσχῶ signifie directement « que je m’abstienne ». Le grec ne mentionne pas une aide divine distincte, même si celle-ci peut être théologiquement sous-entendue par la prière.
  - severity: low
    issue: « Jalousie » est moins précis pour φθόνου
    rationale: Dans ce contexte d’hostilité envieuse envers Joseph, « envie » correspond plus étroitement à φθόνος.
