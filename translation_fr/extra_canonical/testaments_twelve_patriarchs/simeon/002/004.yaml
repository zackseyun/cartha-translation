  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: fr
  text: Car mon cœur était dur, mon foie insensible et mes entrailles sans compassion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: cœur
  rationale: Équivalent naturel qui conserve ici l’image du siège intérieur des dispositions morales.
- source_word: τὰ ἤπατά
  choice: mon foie
  rationale: Conserve l’anthropologie corporelle et affective du grec, malgré le caractère inhabituel de l’image en français moderne.
- source_word: ἀκίνητα
  choice: insensible
  rationale: Littéralement « immobile, inébranlable » ; associé au foie et au manque de compassion, le terme décrit une absence de réaction affective. « Insensible » rend naturellement cette idée sans effacer l’image corporelle.
- source_word: τὰ σπλάγχνα
  choice: mes entrailles
  rationale: Préserve l’image antique des organes intérieurs comme siège des émotions et de la compassion.
- source_word: ἀσυμπαθῆ
  choice: sans compassion
  rationale: Rend directement l’absence de sympathie compatissante exprimée par l’adjectif grec.
