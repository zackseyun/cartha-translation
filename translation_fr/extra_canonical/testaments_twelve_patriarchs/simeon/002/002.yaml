base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: fr
  text: Je suis né de Jacob, le deuxième fils de mon père, et Léa, ma mère, m’a appelé Siméon, parce que le Seigneur a entendu sa supplication.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: Je suis né de Jacob
  rationale: Rend directement la filiation exprimée par ἐκ avec une formulation française naturelle, sans ajouter « comme ».
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: deuxième fils de mon père
  rationale: Conserve l’apposition du grec et l’ordre de naissance indiqué par δεύτερος.
- source_word: ἐκάλεσέ με Συμεώνα
  choice: m’a appelé Siméon
  rationale: Traduction courante et fidèle de l’acte de donner un nom.
- source_word: τῆς δεήσεως αὐτῆς
  choice: sa supplication
  rationale: « Supplication » exprime la demande instante ou prière portée par δέησις, avec un registre digne.
theological_decisions:
- issue: Valeur temporelle de ἤκουσε dans la proposition causale
  choice: avait entendu
  alternative: a entendu
  rationale: Le plus-que-parfait situe naturellement en français l’écoute divine avant l’attribution du nom, sans modifier le lien causal ni préciser davantage la manière dont Dieu a répondu.
translation_notes:
  register: Français international moderne, clair et digne. La structure appositive est conservée sans lourdeur, et aucun détail absent du grec n’est ajouté.
