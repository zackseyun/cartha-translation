  text: Καὶ *ὁ Ῥουβὶμ ἀκούσας ταῦτα⁶⁴ ἐλυπήθη⁶⁵. ἤθελε⁶⁶ γὰρ αὐτὸν⁶⁷ ἀπαγαγεῖν⁶⁸ πρὸς τὸν πατέρα⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/010.yaml
  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: fr
  text: Ruben, en entendant cela, fut attristé, car il voulait le ramener auprès de son père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας ταῦτα
  choice: en entendant cela
  rationale: Le participe aoriste est rendu directement par un gérondif naturel en français; «cela» reprend l’ensemble des paroles ou faits évoqués.
- source_word: ἐλυπήθη
  choice: fut attristé
  rationale: Cette formulation conserve la valeur passive du grec et le registre narratif digne.
- source_word: ἀπαγαγεῖν πρὸς τὸν πατέρα
  choice: le ramener auprès de son père
  rationale: «Ramener» exprime le mouvement de retour impliqué par le contexte, tandis que «auprès de» rend naturellement πρὸς. Le possessif reste à la troisième personne, conformément au grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La traduction reste proche de la syntaxe grecque sans reprendre l’ajout interprétatif «sain et sauf», absent de la formulation citée.
