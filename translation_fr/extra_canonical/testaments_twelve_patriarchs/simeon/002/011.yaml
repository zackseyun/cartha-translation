  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/011.yaml
  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: fr
  text: Mais moi, quand j’appris cela, je me mis dans une grande colère contre Juda, parce qu’il l’avait laissé partir vivant ; et pendant cinq mois, je restai en colère contre lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἀκούσας
  choice: quand j’appris cela
  rationale: Dans ce contexte narratif, ἀκούω signifie recevoir ou apprendre une nouvelle ; cette tournure est plus naturelle en français que « ayant entendu cela ».
- source_word: ὠργίσθην ... σφόδρα
  choice: je me mis dans une grande colère
  rationale: Rend à la fois l’entrée dans l’état de colère exprimée par l’aoriste et l’intensité de σφόδρα.
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: il l’avait laissé partir vivant
  rationale: Préserve l’idée que Juda l’a relâché ou laissé s’en aller alors qu’il était encore en vie.
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος
  choice: pendant cinq mois, je restai en colère
  rationale: Expression idiomatique française de la durée continue indiquée par la construction grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « colère » est conservée afin de refléter celle de la racine grecque ὀργίζομαι, sans ajouter d’interprétation.
