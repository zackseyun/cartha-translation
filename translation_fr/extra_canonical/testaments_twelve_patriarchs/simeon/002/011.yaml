  text: Ἐγὼ δὲ⁷⁰ *ταῦτα ἀκούσας⁷¹ ὠργίσθην ἐπὶ⁷² τὸν⁷³ Ἰούδαν⁷⁴ Γσφόδρα⁷⁵, ὅτι⁷⁶ ζῶντα αὐτὸν ἀπέλυσεν· καὶ *ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ⁷⁷.
