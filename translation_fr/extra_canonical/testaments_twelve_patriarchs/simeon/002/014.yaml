source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἔγνων⁹⁴ γὰρ ὅτι πονηρὸν πρᾶγμα ἐνεθυμήθην ἐνώπιον κυρίου⁹⁵ καὶ⁹⁶ *Ἰακὼβ τοῦ πατρός μου⁹⁷ *διὰ Ἰωσὴφ⁹⁸ *τὸν ἀδελφόν μου, φθονήσας αὐτῷ⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: fr
  text: Car je savais que j’avais conçu un mauvais dessein devant le Seigneur et Jacob, mon père, à cause de Joseph, mon frère, par envie envers lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: je savais
  rationale: L’aoriste de γινώσκω exprime ici la prise de conscience ou la connaissance de Siméon; dans ce récit rétrospectif, «je savais» est naturel et reste proche du grec.
- source_word: πονηρὸν πρᾶγμα
  choice: un mauvais dessein
  rationale: πρᾶγμα peut désigner une chose, une affaire ou un acte. Avec ἐνεθυμήθην, «dessein» rend naturellement une mauvaise action conçue intérieurement sans affirmer qu’elle a déjà été accomplie.
- source_word: ἐνεθυμήθην
  choice: j’avais conçu
  rationale: Le verbe renvoie à ce qui est formé ou médité intérieurement; le plus-que-parfait français marque que cette conception précédait la prise de conscience rapportée.
- source_word: ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  choice: devant le Seigneur et devant Jacob, mon père
  rationale: La répétition de «devant» clarifie en français la portée de la préposition, sans introduire l’idée non exprimée d’une action «contre» Jacob.
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: au sujet de Joseph, mon frère
  rationale: Dans ce contexte, διά avec l’accusatif indique que Joseph est le motif ou l’objet de ce mauvais dessein; «au sujet de» préserve cette relation sans la surinterpréter.
- source_word: φθονήσας αὐτῷ
  choice: parce que je l’enviais
  rationale: Le participe aoriste indique ici la circonstance causale ou explicative du dessein; une proposition causale est idiomatique et intelligible en français moderne.
theological_decisions:
- issue: Portée de «devant» dans ἐνώπιον κυρίου καὶ Ἰακὼβ
  choice: devant le Seigneur et devant Jacob
  alternative: devant le Seigneur et contre Jacob
  rationale: Le grec coordonne le Seigneur et Jacob sous ἐνώπιον; il ne contient pas de préposition signifiant explicitement «contre». La traduction conserve donc la formulation morale et relationnelle sans ajouter une accusation distincte.
- issue: Rapport entre l’envie et le mauvais dessein
  choice: parce que je l’enviais
  alternative: tout en l’enviant
  rationale: Le participe φθονήσας peut être circonstanciel; le contexte favorise une nuance causale, mais la formulation reste sobre et n’ajoute aucune conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité confessionnelle du passage tout en évitant un calque lourd du grec.
