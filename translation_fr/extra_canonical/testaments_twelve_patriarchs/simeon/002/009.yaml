  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: fr
  text: Car, lorsque je me rendis à Sichem pour apporter de l’onguent aux troupeaux, et Ruben à Dotaïn, où se trouvaient les choses dont nous avions besoin et toutes nos réserves, mon frère Juda, venu auprès des Ismaélites, le vendit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλειμμα
  choice: de l’onguent
  rationale: Le terme désigne une substance à appliquer ou à frictionner, vraisemblablement destinée ici aux soins des troupeaux. « Onguent » conserve ce sens concret sans préciser une composition inconnue.
- source_word: ποιμνίοις
  choice: aux troupeaux
  rationale: Rend naturellement le pluriel grec et le contexte pastoral.
- source_word: τὰ ἐγχρῄζοντα ἡμῖν
  choice: ce dont nous avions besoin
  rationale: Expression française naturelle qui conserve la portée générale des choses nécessaires, sans les réduire à des vivres.
- source_word: πᾶσα ἡ ἀπόθεσις
  choice: toutes nos réserves
  rationale: ἀπόθεσις évoque ce qui est mis en dépôt ou entreposé ; « réserves » convient au contexte et évite le terme commercial moderne « stock ».
- source_word: ἐλθών
  choice: vint
  rationale: Le participe aoriste marque la venue de Juda avant ou en lien immédiat avec la vente ; la coordination française explicite sobrement cette séquence.
- source_word: ἐπώλησεν αὐτόν
  choice: le vendit
  rationale: Le pronom masculin renvoie à Joseph dans le contexte antérieur ; conserver « le » respecte la cohésion narrative sans ajouter son nom au verset.
- source_word: Ἰσμαηλίταις
  choice: aux Ismaélites
  rationale: Transcription française traditionnelle et intelligible du nom du groupe.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La phrase conserve la longue articulation causale et narrative du grec, tout en clarifiant par des verbes répétés que Siméon et Ruben se rendent en deux lieux distincts. Aucun élément doctrinal ou explicatif étranger au texte n’est ajouté.
