  alternative: 'Le comprendre comme une auto-identification elliptique : « Écoutez, mes enfants : moi, Siméon, votre père… »'
  rationale: L’accusatif grec Συμεὼν τοῦ πατρὸς ὑμῶν soutient directement la première analyse, malgré une formulation française un peu solennelle.
