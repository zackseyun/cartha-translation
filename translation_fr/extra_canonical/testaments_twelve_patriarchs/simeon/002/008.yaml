  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: fr
  text: Mais son Dieu, le Dieu de nos pères, envoya son ange et le délivra de mes mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾿
  choice: Mais
  rationale: Marque naturellement en français l’opposition avec le contexte précédent.
- source_word: ὁ θεὸς αὐτοῦ καὶ ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: son Dieu, le Dieu de nos pères
  rationale: Rend l’identification appositionnelle de façon naturelle; le second « Dieu » demeure exprimé, tandis que la coordination grecque est allégée sans modifier le référent.
- source_word: ἀπέστειλε
  choice: envoya
  rationale: Équivalent direct de l’aoriste grec, dans un registre narratif digne et courant.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: son ange
  rationale: Traduction directe qui conserve le possessif et le sens habituel de ἄγγελος dans ce contexte.
- source_word: ἐρρύσατο
  choice: délivra
  rationale: Exprime le sauvetage hors d’un danger ou d’un pouvoir hostile, avec une coloration biblique naturelle sans excès d’archaïsme.
- source_word: ἐκ τῶν χειρῶν μου
  choice: de mes mains
  rationale: Préserve l’image idiomatique grecque, également claire et usuelle en français biblique moderne.
theological_decisions:
- issue: Relation entre « son Dieu » et « le Dieu de nos pères »
  choice: Les deux désignations sont maintenues comme renvoyant au même Dieu.
  alternative: Conserver littéralement « son Dieu et le Dieu de nos pères » comme deux groupes coordonnés.
  rationale: L’article répété et καί permettent une restitution très formelle, mais le français appositionnel communique clairement l’identité du référent sans suggérer deux dieux distincts.
translation_notes:
  register: Français moderne international, narratif et digne. La formulation reste proche du grec tout en évitant une coordination susceptible d’être maladroite ou ambiguë en français.
