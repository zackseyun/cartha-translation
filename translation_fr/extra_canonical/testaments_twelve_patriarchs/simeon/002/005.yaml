  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/005.yaml
  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: fr
  text: Car le courage aussi est donné par le Très-Haut aux êtres humains, dans leur âme et dans leur corps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: courage
  rationale: Le terme désigne ici la bravoure ou la force d’âme. « Courage » est naturel, actuel et n’introduit pas la connotation masculine que pourrait avoir une traduction plus littérale.
- source_word: ὑψίστου
  choice: Très-Haut
  rationale: Titre divin consacré qui rend directement le superlatif grec et conserve le registre solennel.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: Rend le sens générique de ἄνθρωποι sans le limiter aux hommes de sexe masculin.
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: dans leur âme et dans leur corps
  rationale: Le français emploie naturellement le possessif pour exprimer les dimensions psychique et corporelle des êtres humains; la répétition de « dans leur » clarifie que le courage leur est accordé dans l’une et l’autre.
theological_decisions:
- issue: Origine divine du courage
  choice: « est donné par le Très-Haut »
  alternative: « vient du Très-Haut »
  rationale: La forme passive δίδοται signifie explicitement « est donné »; cette formulation préserve l’affirmation selon laquelle le courage est un don divin sans préciser davantage son mode d’action.
- issue: Rapport entre âme et corps
  choice: Maintenir les deux domaines coordonnés
  alternative: Fusionner en « dans tout leur être »
  rationale: Le grec nomme distinctement les âmes et les corps. Les conserver évite d’effacer une tension anthropologique réelle ou de lui imposer une systématisation.
translation_notes:
  register: Français moderne, digne et accessible. La construction initiale « Car » maintient le lien explicatif de Ἐπειδή avec le contexte antérieur; « aussi » conserve καί. Aucun marqueur de note n’est nécessaire.
