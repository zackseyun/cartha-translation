  verdict: revise
  source_fidelity: 'La traduction rend correctement l’action empêchée et la durée de sept jours. Toutefois, « paralysée » interprète ἡμίξηρος de façon trop médicale et spécifique : le grec évoque littéralement un état « à demi desséché / flétri », sans nommer une paralysie. De plus, l’imparfait συνετρίβει est mieux conservé par « m’écrasait » que par le passé simple « m’écrasa ».'
  naturalness: La phrase révisée reste claire, sobre et idiomatique en français moderne. « À moitié desséchée » est inhabituel pour une main dans le français courant, mais cette étrangeté reflète précisément l’image corporelle non technique du grec et évite de surinterpréter le diagnostic.
  terminology: « Seigneur » convient pour ὁ Κύριος. « M’empêcha d’agir » rend naturellement ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ. « À moitié desséchée » préserve l’ambiguïté descriptive de ἡμίξηρος mieux que « à demi paralysée ».
  issues:
  - severity: medium
    issue: « à demi paralysée » surinterprète ἡμίξηρος.
    rationale: Le terme grec signifie « à demi sec, desséché, flétri » et ne désigne pas explicitement une paralysie. La traduction ne doit pas transformer cette description en diagnostic médical.
  - severity: low
    issue: « m’écrasa » ne reflète pas l’imparfait συνετρίβει.
    rationale: L’imparfait présente l’action comme en cours ou durative ; « m’écrasait » la préserve plus directement.
  revised_text: Et même, le Seigneur m’écrasait et m’empêcha d’agir, car ma main droite resta à moitié desséchée pendant sept jours.
