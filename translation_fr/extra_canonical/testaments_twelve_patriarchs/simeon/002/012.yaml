source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: fr
  text: Et même, le Seigneur m’écrasait et m’empêcha d’agir, car ma main droite resta à moitié desséchée pendant sept jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Et même
  rationale: Rend la valeur additive et emphatique de καίγε sans alourdir la phrase.
- source_word: συνετρίβει
  choice: m’écrasa
  rationale: Conserve l’image forte de συντρίβω et la valeur durative de l’imparfait grec.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: m’empêcha d’agir
  rationale: Expression française naturelle qui rend littéralement l’idée d’empêcher toute action de la part du locuteur.
- source_word: ἡμίξηρος
  choice: à demi paralysée
  rationale: Le composé signifie littéralement « à demi desséchée »; dans ce contexte corporel, « à demi paralysée » communique clairement la perte partielle d’usage sans suggérer une simple sécheresse cutanée.
- source_word: γέγονεν ἐπὶ ἡμέρας ἑπτά
  choice: resta … pendant sept jours
  rationale: Rend idiomatiquement l’état survenu puis maintenu durant la période indiquée.
theological_decisions:
- issue: Agent divin de l’affliction
  choice: le Seigneur m’écrasa
  alternative: le Seigneur me brisa
  rationale: Le texte attribue directement au Seigneur cette action sévère; la traduction en préserve la tension théologique sans l’atténuer ni l’expliquer.
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et conserve la vigueur du grec, tout en privilégiant une expression immédiatement compréhensible pour l’état de la main.
