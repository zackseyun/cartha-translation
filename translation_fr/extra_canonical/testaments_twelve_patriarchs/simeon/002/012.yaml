  to: Et même, le Seigneur m’écrasait et m’empêcha d’agir, car ma main droite resta à moitié desséchée pendant sept jours.
  rationale: La révision remplace l’interprétation médicale « paralysée » par une formulation qui conserve l’image et l’ambiguïté du grec. Elle ajuste aussi le premier verbe à l’imparfait source, sans modifier le sens général ni ajouter d’explication doctrinale ou médicale.
