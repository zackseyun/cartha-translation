lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: Car, dans ma jeunesse
  rationale: « Car » rend la valeur explicative de γάρ; la formulation française concise exprime naturellement la période de jeunesse sans calquer inutilement « au temps de ».
- source_word: πολλὰ ἐζήλωσα τὸν Ἰωσήφ
  choice: j’étais très jaloux de Joseph
  rationale: πολλά fonctionne ici comme intensif de ἐζήλωσα. Dans ce contexte, « être jaloux de » restitue clairement la jalousie hostile envers Joseph.
- source_word: ἠγάπα αὐτὸν ὁ πατήρ μου παρὰ πάντας
  choice: mon père l’aimait plus que tous les autres
  rationale: παρὰ πάντας marque une comparaison. « Tous les autres » explicite naturellement en français qu’il s’agit des autres fils, sans ajouter « frères » au texte principal.
