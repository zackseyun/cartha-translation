lexical_decisions:
- source_word: τὰ ἤπατά / τὰ ἤπατα
  choice: mon foie
  rationale: Conserve l’image anthropologique ancienne, importante dans les v. 4 et 7, tout en l’expliquant par une note plutôt que de la remplacer par « sentiments » ou « volonté ».
- source_word: ἀνδρεία
  choice: le courage
  rationale: Rend la force morale et la vaillance sans limiter le mot à une qualité exclusivement masculine.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: le prince de l’égarement
  rationale: Préserve le titre et l’ambiguïté de πλάνη, qui peut évoquer l’égarement, l’erreur ou la tromperie.
- source_word: ἄλειμμα
  choice: de l’onguent
  rationale: Traduction concrète d’une substance destinée à l’onction; une note signale l’autre possibilité « huile ».
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: m’ôta la capacité d’agir
  rationale: Rend l’idée d’une action empêchée sans introduire la maladie du foie présente dans une autre tradition textuelle.
- source_word: ἡμίξηρος
  choice: à demi desséchée
  rationale: Reproduit l’expression grecque inhabituelle et laisse ouverte sa portée médicale.
- source_word: μετανοήσας
  choice: je changeai alors d’attitude
  rationale: Exprime un retournement intérieur et pratique sans imposer ici un vocabulaire confessionnel technique.
- source_word: φθόνος / φθονήσας
  choice: envie / parce que je l’avais envié
  rationale: Distingue autant que possible φθόνος de ζῆλος, rendu auparavant par « jalousie ».
theological_decisions:
- issue: Action divine dans la délivrance de Joseph
  choice: « son Dieu, le Dieu de nos pères, envoya son ange et le délivra »
  alternative: Rationaliser l’épisode comme une simple intervention humaine
  rationale: Le texte attribue explicitement la délivrance à Dieu par l’intermédiaire de son ange; cette causalité théologique doit rester intacte.
- issue: Identité du « prince de l’égarement » et de « l’esprit de jalousie »
  choice: Conserver les deux désignations sans les identifier davantage
  alternative: Les nommer Satan ou les réduire à de simples états psychologiques
  rationale: Le grec personnifie des puissances mais ne donne pas ici d’identification plus précise; la traduction préserve cette tension.
- issue: Lien entre la faute envers Joseph et l’affliction physique
  choice: Conserver le constat de Siméon selon lequel l’affliction lui arriva à cause de Joseph
  alternative: Formuler une doctrine générale et systématique de la rétribution divine
  rationale: Le récit présente l’interprétation de Siméon dans ce cas particulier, sans autoriser une généralisation doctrinale.
- issue: Sens de μετανοέω
  choice: « changer d’attitude »
  alternative: « se repentir »
  rationale: Le choix conserve l’idée fondamentale de retournement tout en évitant de surcharger le passage d’une terminologie doctrinale plus tardive; les pleurs, la prière et le renoncement explicitent la portée morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été fluidifiée lorsque nécessaire, mais les images anthropologiques anciennes et les affirmations théologiques du grec ont été conservées. Le v. 11 suit le texte grec fourni (« je restai en colère… cinq mois »), plutôt que la leçon de la couche anglaise évoquant une maladie du foie; le v. 12 traduit séparément l’atteinte de la main droite.
