  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: fr
  text: '1. Écoutez-moi, mes enfants : moi, Siméon, votre père, je vais vous déclarer ce que j’ai dans mon cœur.


    2. Je suis né de Jacob comme le second fils de mon père, et Léa, ma mère, m’a appelé Siméon, parce que le Seigneur avait entendu sa supplication.


    3. Je devins en effet très fort : je ne reculais devant aucun acte et je ne craignais aucune entreprise.


    4. Car mon cœur était dur, mon foie[a] inflexible et mes entrailles sans compassion.


    5. Car le courage aussi est accordé par le Très-Haut aux êtres humains, dans leur âme et dans leur corps.


    6. Dans ma jeunesse, j’éprouvai une très grande jalousie envers Joseph, parce que mon père l’aimait plus que tous les autres.


    7. Je dressai mon foie[a] contre lui, dans l’intention de le tuer, parce que le prince de l’égarement et l’esprit de jalousie avaient aveuglé mon intelligence : je ne le considérais plus comme un frère et je n’épargnais même pas Jacob, mon père.


    8. Mais son Dieu, le Dieu de nos pères, envoya son ange et le délivra de mes mains.


    9. En effet, lorsque je me rendis à Sichem pour apporter de l’onguent[b] à nos troupeaux, tandis que Ruben allait à Dothan, où se trouvaient ce dont nous avions besoin et toutes nos réserves, mon frère Juda vendit Joseph aux Ismaélites qui étaient arrivés.


    10. Quand Ruben apprit cela, il fut affligé, car il voulait ramener Joseph auprès de notre père.


    11. Mais quand je l’appris, je me mis dans une violente colère contre Juda parce qu’il l’avait laissé partir vivant, et je restai en colère contre lui pendant cinq mois.


    12. Alors le Seigneur me brisa et m’empêcha d’agir : ma main droite devint à demi desséchée[c] pendant sept jours.


    13. Je compris, mes enfants, que cela m’était arrivé à cause de Joseph. Je changeai alors d’attitude, je pleurai et je priai le Seigneur Dieu pour que ma main soit rétablie et que je m’abstienne de toute souillure, de toute envie et de toute folie.


    14. Car je compris que j’avais conçu un mauvais dessein devant le Seigneur et contre Jacob, mon père, au sujet de Joseph, mon frère, parce que je l’avais envié.


    [a] Dans l’anthropologie ancienne, le « foie » pouvait être considéré comme le siège de sentiments et de dispositions profondes. Le texte conserve cette image corporelle, distincte du « cœur » et des « entrailles ».


    [b] Ou : « de l’huile ». Le terme grec désigne une substance servant à oindre, sans en préciser ici la nature ni l’usage.


    [c] Littéralement : « devint à moitié sèche ». L’expression décrit une atteinte partielle de la main, sans en préciser la nature médicale.'
