revisions:
- from: Car même pendant son sommeil, la jalousie, en lui présentant des visions de méchanceté, le dévore et trouble son âme par des esprits mauvais ; elle fait frémir son corps et maintient son esprit éveillé dans l’agitation. Ainsi, il apparaît aux autres comme un esprit mauvais et venimeux.
  to: Car même pendant son sommeil, l’envie, en lui présentant des visions de méchanceté, le dévore et trouble son âme par des esprits mauvais ; elle fait frémir son corps et réveille son esprit dans l’agitation. Ainsi, il apparaît aux gens comme un esprit mauvais et venimeux.
  rationale: La révision corrige le sens verbal de διυπνίζει et affine ζῆλος selon le contexte et la piste d’audit anglaise. Elle conserve l’ambiguïté instrumentale ou associative du datif dans « par des esprits mauvais », la personnification de l’envie et la comparaison finale.
