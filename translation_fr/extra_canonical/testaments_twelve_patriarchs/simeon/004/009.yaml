review_pass:
  verdict: revise
  source_fidelity: La phrase rend fidèlement la personnification de ζῆλος, les visions mauvaises durant le sommeil, l’action des esprits mauvais, le frémissement du corps et la comparaison finale. Toutefois, « maintient son esprit éveillé » atténue et modifie διυπνίζει, qui signifie ici « réveille/éveille » le νοῦς. Dans ce contexte, où le grec et la piste d’audit anglaise visent l’envie, « envie » est également plus précis que « jalousie » pour ζῆλος.
  naturalness: Le français est fluide et conserve un registre soutenu moderne. « Réveille son esprit dans l’agitation » est à la fois plus idiomatique et plus proche du grec. « Aux gens » rend explicitement τοῖς ἀνθρώποις sans la légère restriction relationnelle que peut avoir « aux autres ».
  terminology: « Envie » convient au vice moral traité et s’aligne sur « envy » dans l’audit anglais, sans exclure la portée sémantique de ζῆλος. « Esprits mauvais », « méchanceté », « venimeux » et « esprit » pour νοῦς sont recevables. La comparaison demeure non littéralisée, conformément à ὡς.
  issues:
  - severity: medium
    issue: διυπνίζει est traduit par « maintient son esprit éveillé ».
    rationale: Le verbe exprime l’action de réveiller ou d’éveiller, non principalement celle de maintenir dans un état d’éveil. « Réveille son esprit » restitue l’événement décrit.
  - severity: low
    issue: ζῆλος est rendu par « jalousie ».
    rationale: Ce choix est possible, mais le contexte moral et la traduction anglaise d’audit (« envy ») favorisent « envie » comme désignation plus précise du vice en cause.
  - severity: low
    issue: τοῖς ἀνθρώποις est rendu par « aux autres ».
    rationale: « Aux autres » est naturel, mais peut viser seulement l’entourage. « Aux gens » conserve plus explicitement le référent humain général du grec.
  revised_text: Car même pendant son sommeil, l’envie, en lui présentant des visions de méchanceté, le dévore et trouble son âme par des esprits mauvais ; elle fait frémir son corps et réveille son esprit dans l’agitation. Ainsi, il apparaît aux gens comme un esprit mauvais et venimeux.
