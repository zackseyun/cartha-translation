source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: fr
  text: Car même pendant son sommeil, l’envie, en lui présentant des visions de méchanceté, le dévore et trouble son âme par des esprits mauvais ; elle fait frémir son corps et réveille son esprit dans l’agitation. Ainsi, il apparaît aux gens comme un esprit mauvais et venimeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: la jalousie
  rationale: Dans le contexte moral négatif du Testament de Siméon, le terme désigne la jalousie ou l’envie. « Jalousie » convient naturellement en français tout en gardant l’idée d’une passion qui possède la personne.
- source_word: φαντάζουσα
  choice: en lui présentant des visions
  rationale: Le participe évoque l’action de faire apparaître des images ou visions à l’esprit, particulièrement pendant le sommeil.
- source_word: κατεσθίει
  choice: le dévore
  rationale: Rend avec force le sens concret et figuré de « manger entièrement, consumer ».
- source_word: πνεύμασι πονηροῖς
  choice: par des esprits mauvais
  rationale: Le datif peut exprimer le moyen ou l’instrument. Cette traduction conserve la référence explicite à des esprits mauvais sans préciser davantage leur statut.
- source_word: ἐκθροεῖσθαι
  choice: frémir
  rationale: Le verbe rare indique que le corps est mis en émoi ou saisi d’un tremblement. « Frémir » évite d’ajouter explicitement la peur, absente du grec.
- source_word: διυπνίζει
  choice: maintient son esprit éveillé
  rationale: Le verbe signifie éveiller ou tenir éveillé. Le présent français exprime ici l’état d’éveil agité produit par la jalousie.
- source_word: ἰοβόλον
  choice: venimeux
  rationale: Le mot désigne littéralement ce qui lance ou répand du poison ; appliqué à un esprit, « venimeux » garde l’image et fonctionne naturellement en français.
- source_word: τοῖς ἀνθρώποις
  choice: aux autres
  rationale: Dans ce contexte, il s’agit de la manière dont l’individu apparaît aux êtres humains qui l’entourent. « Aux autres » est plus idiomatique que « aux gens » et ne change pas le référent.
theological_decisions:
- issue: Rapport entre la jalousie et les esprits mauvais
  choice: La jalousie trouble l’âme « par des esprits mauvais ».
  alternative: La jalousie trouble l’âme « avec de mauvais esprits » ou « au moyen d’esprits mauvais ».
  rationale: Le datif grec autorise une valeur instrumentale ou associative. « Par » garde ouverte la nature exacte de l’action sans identifier la jalousie elle-même à un esprit.
- issue: Comparaison finale
  choice: « comme un esprit mauvais et venimeux »
  alternative: « tel un esprit mauvais et venimeux »
  rationale: Le texte présente l’homme jaloux comme apparaissant semblable à un esprit mauvais ; il ne dit pas sans ambiguïté qu’il en devient littéralement un.
translation_notes:
  register: Français moderne, international et digne. La personnification de la jalousie est maintenue par la reprise pronominale « elle ». La ponctuation répartit la longue période grecque en deux phrases sans rompre sa progression logique.
