id: T12P.SIM.4.6
reference: Testament of Simeon 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Πάσας⁴⁰ τὰς ἡμέρας⁴¹ οὐκ⁴² ὠνείδισεν ἡμᾶς⁴³ *περὶ τοῦ πράγματος τούτου⁴⁴, ἀλλ᾿⁴⁵ ἠγάπησεν ἡμᾶς ὡς τὴν *ψυχὴν αὐτοῦ⁴⁶ καὶ ὑπὲρ τοὺς υἱοὺς αὐτοῦ⁴⁷ ἐδόξασεν⁴⁸ ἡμᾶς, καὶ⁴⁹ *πλοῦτον καὶ κτήνη καὶ καρπὸν⁵⁰ *ἐχαρίσατο ἡμῖν⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: fr
  text: Durant toute sa vie, il ne nous a fait aucun reproche au sujet de cette affaire. Au contraire, il nous a aimés comme sa propre vie, nous a honorés plus que ses propres fils et nous a accordé richesses, troupeaux et récoltes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάσας τὰς ἡμέρας
  choice: Durant toute sa vie
  rationale: Littéralement « tous les jours »; dans ce contexte, l’expression désigne l’ensemble de ses jours et se rend naturellement ainsi en français.
- source_word: ὠνείδισεν
  choice: a fait aucun reproche
  rationale: Exprime le fait d’adresser des reproches ou de blâmer quelqu’un; avec οὐκ, « ne… aucun reproche » est idiomatique.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: comme sa propre vie
  rationale: ψυχή peut désigner l’âme, la personne ou la vie. Ici, l’expression comparative évoque l’amour porté à sa propre vie; « vie » est naturel sans effacer la force de l’image.
- source_word: ὑπὲρ τοὺς υἱοὺς αὐτοῦ ἐδόξασεν
  choice: nous a honorés plus que ses propres fils
  rationale: ἐδόξασεν signifie ici « honorer » ou « couvrir d’honneur », et ὑπέρ avec l’accusatif marque une comparaison de supériorité.
- source_word: πλοῦτον καὶ κτήνη καὶ καρπὸν
  choice: richesses, troupeaux et récoltes
  rationale: πλοῦτος désigne la richesse matérielle, κτήνη le bétail ou les troupeaux, et καρπός le fruit ou produit de la terre; le pluriel « récoltes » convient au contexte économique.
- source_word: ἐχαρίσατο
  choice: nous a accordé
  rationale: Le verbe indique un don généreusement consenti; « accorder » conserve cette nuance sans alourdir la phrase.
theological_decisions:
- issue: Sens de ψυχή dans la comparaison
  choice: sa propre vie
  alternative: sa propre âme
  rationale: Le grec demeure polysémique, mais l’expression « aimer comme sa propre vie » est claire et idiomatique en français. Aucun sens anthropologique technique n’est imposé ici.
translation_notes:
  register: Français moderne, digne et accessible. La coordination grecque est conservée, avec une coupure après la première proposition pour fluidifier la lecture. « Au contraire » explicite la valeur adversative forte de ἀλλά.
