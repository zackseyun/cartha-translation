source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὅτε¹⁰ κατέβημεν εἰς Αἴγυπτον, καὶ¹¹ ἔδησέ¹² με¹³ ὡς κατάσκοπον¹⁴, ἔγνων ὅτι δικαίως πάσχω¹⁵ καὶ οὐκ ἐλυπούμην¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: fr
  text: Lorsque nous sommes descendus en Égypte et qu’il m’a fait attacher comme espion, j’ai compris que je souffrais à juste titre, et je ne m’en affligeais pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: nous sommes descendus
  rationale: Conserve le mouvement traditionnel de « descendre » en Égypte tout en employant un passé composé naturel en français moderne.
- source_word: ἔδησέ με
  choice: il m’a fait attacher
  rationale: Le grec dit littéralement « il me lia ». La tournure causative est naturelle dans ce contexte et n’impose pas que le sujet ait personnellement procédé à l’attachement.
- source_word: ὡς κατάσκοπον
  choice: comme espion
  rationale: Rend directement l’accusation ou le traitement infligé à Siméon, sans ajouter « présumé » ni expliciter davantage le rapport syntaxique.
- source_word: δικαίως πάσχω
  choice: je souffrais à juste titre
  rationale: Exprime la reconnaissance que sa souffrance était méritée ou juste, en préservant la sobriété du grec.
- source_word: οὐκ ἐλυπούμην
  choice: je ne m’en affligeais pas
  rationale: Le verbe λυπέω au moyen-passif exprime ici le chagrin ou l’affliction; cette formulation conserve cette nuance mieux que « je n’étais pas inquiet ».
theological_decisions:
- issue: Nature de la justice reconnue par Siméon
  choice: à juste titre
  alternative: justement
  rationale: La traduction indique que Siméon juge sa souffrance méritée, sans préciser si cette justice relève directement d’un châtiment divin, d’une rétribution providentielle ou d’une simple conséquence morale.
translation_notes:
  register: Français moderne, clair et digne. La coordination narrative du grec est légèrement fluidifiée sans supprimer le lien entre l’arrestation, la reconnaissance de justice et l’absence d’affliction.
