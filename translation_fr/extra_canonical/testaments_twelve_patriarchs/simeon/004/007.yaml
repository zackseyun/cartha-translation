review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’exhortation à l’amour fraternel et la promesse que l’esprit associé au φθόνος se retirera sont conservées. Toutefois, « jalousie » ne rend qu’imparfaitement φθόνος, qui désigne plus précisément l’envie, le ressentiment envieux. La formulation distributive française doit aussi être rendue plus idiomatiquement.'
  naturalness: « Aimez chacun votre frère » est une construction maladroite en français moderne international. « Que chacun de vous aime son frère » restitue clairement la distributivité de ἕκαστος tout en gardant la valeur exhortative. « Avec un cœur bon » est plus naturel que « d’un cœur bon » tout en restant proche du grec.
  terminology: « L’esprit d’envie » conserve πνεῦμα sans imposer une lecture psychologique ou démonologique, et « envie » rend plus exactement φθόνος que « jalousie ». « Frère » et « cœur » sont maintenus.
  issues:
  - severity: medium
    issue: Rendu de φθόνος par « jalousie »
    rationale: Dans ce contexte moral, φθόνος désigne l’envie ou le ressentiment devant le bien d’autrui. « Jalousie » peut évoquer principalement la possessivité relationnelle en français moderne et est donc moins précis.
  - severity: low
    issue: Tour « aimez chacun votre frère »
    rationale: La distributivité de ἕκαστος est présente, mais la tournure est peu naturelle et peut gêner la lecture. Une subordonnée jussive française la rend avec clarté.
