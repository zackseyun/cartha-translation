source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: fr
  text: Vous aussi, mes enfants, que chacun de vous aime son frère avec un cœur bon, et l’esprit d’envie s’éloignera de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: aimez
  rationale: Impératif direct et naturel, qui conserve la force exhortative de l’aoriste grec.
- source_word: ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: chacun votre frère
  rationale: Reproduit la distributivité de ἕκαστος tout en employant une tournure française compréhensible; « frère » conserve le terme relationnel du grec sans en préciser davantage la portée.
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: d’un cœur bon
  rationale: Rend de près l’expression grecque et maintient le cœur comme siège de la disposition morale intérieure.
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: l’esprit de jalousie
  rationale: « Jalousie » exprime ici φθόνος comme ressentiment envieux envers autrui; « esprit » préserve πνεῦμα sans décider s’il s’agit d’une puissance personnifiée ou d’une disposition intérieure.
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: s’éloignera de vous
  rationale: Restitue le mouvement de séparation annoncé par le futur grec dans un français naturel.
theological_decisions:
- issue: Nature de « l’esprit de jalousie »
  choice: Conserver littéralement « l’esprit de jalousie »
  alternative: Paraphraser par « la jalousie disparaîtra de votre cœur »
  rationale: Le grec laisse ouverte la question de savoir s’il désigne une disposition intérieure personnifiée ou une puissance spirituelle; la traduction ne tranche pas cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La structure exhortation-promesse et le lien causal implicite sont conservés sans ajout explicatif.
