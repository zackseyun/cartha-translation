  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: fr
  text: Gardez-vous donc, mes enfants, de toute jalousie et de toute envie, et marchez dans la simplicité de cœur, afin que Dieu vous accorde, à vous aussi, grâce, gloire et bénédiction sur vos têtes, comme vous l’avez vu chez Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Gardez-vous
  rationale: Rend naturellement l’impératif aoriste moyen exprimant la vigilance personnelle face à un danger moral.
- source_word: παντὸς ζήλου καὶ φθόνου
  choice: de toute jalousie et de toute envie
  rationale: Conserve les deux termes grecs proches mais distincts, sans les fusionner.
- source_word: ἐν ἁπλότητι καρδίας
  choice: avec un cœur sans duplicité
  rationale: Exprime ici la sincérité et l’absence de duplicité morale de ἁπλότης, dans un français courant et digne.
- source_word: χάριν
  choice: grâce
  rationale: Correspondance directe avec χάρις et maintien de sa portée favorable sans la réduire au seul sens de bienveillance humaine.
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: sur vos têtes
  rationale: Préserve l’image concrète de la bénédiction venant reposer sur les destinataires.
- source_word: ἐν Ἰωσήφ
  choice: en Joseph
  rationale: Conserve la formulation grecque, Joseph étant présenté comme le lieu ou l’exemple visible de l’action divine.
theological_decisions:
- issue: Rapport entre conduite morale et don de Dieu
  choice: afin que Dieu vous accorde
  alternative: pour que Dieu vous accorde
  rationale: La construction ἵνα avec le subjonctif est rendue comme une finalité, sans préciser davantage si le don divin est conçu comme récompense, conséquence ou grâce conditionnelle.
- issue: Sens de χάρις
  choice: grâce
  alternative: faveur
  rationale: « Grâce » reste lexicalement proche du grec et préserve sa possible portée théologique, tout en étant intelligible dans cette série de dons.
translation_notes:
  register: Français moderne international, naturel et digne. L’adresse familiale « mes enfants » et l’image biblique « sur vos têtes » sont conservées. « Cœur sans duplicité » privilégie la clarté contemporaine tout en gardant la portée morale de l’expression grecque.
