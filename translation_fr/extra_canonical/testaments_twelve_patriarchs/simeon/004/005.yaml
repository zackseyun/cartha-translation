revisions:
- from: Gardez-vous donc, mes enfants, de toute jalousie et de toute envie, et marchez avec un cœur sans duplicité, afin que Dieu vous accorde, à vous aussi, grâce, gloire et bénédiction sur vos têtes, comme vous l’avez vu en Joseph.
  to: Gardez-vous donc, mes enfants, de toute jalousie et de toute envie, et marchez dans la simplicité de cœur, afin que Dieu vous accorde, à vous aussi, grâce, gloire et bénédiction sur vos têtes, comme vous l’avez vu chez Joseph.
  rationale: 'La révision remplace deux formulations : « dans la simplicité de cœur » rend directement ἐν ἁπλότητι καρδίας, et « chez Joseph » évite le calque français maladroit de ἐν Ἰωσήφ tout en conservant Joseph comme exemple observé. Le reste du texte est maintenu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:35:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’avertissement contre ζῆλος et φθόνος, l’appel à marcher dans la simplicité du cœur, et les dons divins sont tous conservés. « Grâce » rend bien χάριν. La préposition ἐν devant Joseph appelle toutefois en français « chez Joseph » plutôt que le calque peu idiomatique « en Joseph ».'
  naturalness: Le français est clair et de registre approprié. « Avec un cœur sans duplicité » est compréhensible, mais « dans la simplicité de cœur » correspond plus directement à ἐν ἁπλότητι καρδίας et demeure naturel dans un registre scripturaire moderne. « Comme vous l’avez vu chez Joseph » est sensiblement plus naturel que « en Joseph ».
  terminology: « Jalousie » et « envie » préservent utilement les deux termes grecs. « Grâce, gloire et bénédiction » est exact et cohérent. Aucun terme théologique ne nécessite d’interprétation confessionnelle.
  issues:
  - severity: medium
    issue: « en Joseph » est un calque grec peu naturel en français.
    rationale: Dans « καθὼς ἴδετε ἐν Ἰωσήφ », ἐν introduit Joseph comme la personne chez qui les destinataires ont vu l’exemple des dons de Dieu. « Chez Joseph » restitue cette relation sans modifier l’ambiguïté ou le temps du grec.
  - severity: low
    issue: « avec un cœur sans duplicité » est légèrement plus explicatif que le grec.
    rationale: ἁπλότης καρδίας signifie littéralement la simplicité du cœur; « dans la simplicité de cœur » maintient le terme et la construction de manière suffisamment naturelle en français biblique contemporain.
  revised_text: Gardez-vous donc, mes enfants, de toute jalousie et de toute envie, et marchez dans la simplicité de cœur, afin que Dieu vous accorde, à vous aussi, grâce, gloire et bénédiction sur vos têtes, comme vous l’avez vu chez Joseph.
  revised_footnotes: []
  revision_rationale: 'La révision remplace deux formulations : « dans la simplicité de cœur » rend directement ἐν ἁπλότητι καρδίας, et « chez Joseph » évite le calque français maladroit de ἐν Ἰωσήφ tout en conservant Joseph comme exemple observé. Le reste du texte est maintenu.'
