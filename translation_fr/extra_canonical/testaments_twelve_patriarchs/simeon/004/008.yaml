source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: fr
  text: Car cela rend l’âme sauvage et détruit le corps ; cela suscite colère et guerre dans les desseins, pousse à verser le sang, fait perdre la raison, bouleverse l’âme et fait trembler le corps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: rend … sauvage
  rationale: Reproduit directement l’idée d’ensauvagement ou de férocité sans l’atténuer.
- source_word: τῷ διαβουλίῳ
  choice: dans les desseins
  rationale: Le terme renvoie à la délibération, au projet ou au dessein. Le pluriel français exprime naturellement cette sphère intérieure tout en conservant une certaine latitude sémantique.
- source_word: εἰς αἵματα παροξύνει
  choice: pousse à verser le sang
  rationale: Expression française naturelle qui conserve la force du pluriel idiomatique grec « vers des sangs », c’est-à-dire vers l’effusion de sang.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: fait perdre la raison
  rationale: Dans ce contexte négatif, ἔκστασις désigne un état où l’esprit sort de son assiette, non une extase positive ; cette formulation reste claire en français courant.
- source_word: κλόνον
  choice: bouleversement
  rationale: Rend l’agitation violente ou le trouble infligé à l’âme, en parallèle avec le tremblement du corps.
- source_word: τρόμον
  choice: trembler
  rationale: La tournure verbale « fait trembler » est plus naturelle en français et transmet exactement l’effet corporel.
theological_decisions:
- issue: Référent implicite de τοῦτο (« cela »)
  choice: Conserver « cela » sans expliciter l’antécédent
  alternative: Nommer explicitement la passion ou le vice évoqué dans le contexte précédent
  rationale: Le verset grec emploie un démonstratif et dépend du contexte ; l’expliciter ici introduirait une interprétation absente de cette unité textuelle.
- issue: Sens de ἔκστασις
  choice: 'État de dérèglement mental : « fait perdre la raison »'
  alternative: « conduit l’esprit à l’extase »
  rationale: La série d’effets destructeurs favorise nettement un sens négatif de dérangement ou d’égarement, sans connotation mystique.
translation_notes:
  register: Français moderne, international et digne. La phrase garde l’accumulation rhétorique du grec, tout en employant des collocations françaises naturelles. Aucun marqueur de note n’est requis.
