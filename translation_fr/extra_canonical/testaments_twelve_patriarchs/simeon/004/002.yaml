  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: fr
  text: Car j’étais plus affligé que tous les autres, parce que j’étais responsable de la vente de Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  choice: je portais le deuil
  rationale: L’imparfait exprime une action ou un état prolongé dans le passé; «porter le deuil» conserve la force de πενθέω, plus marquée que la simple tristesse.
- source_word: παρὰ πάντας
  choice: plus que tous les autres
  rationale: Dans ce contexte comparatif, παρά avec l’accusatif indique un degré supérieur; «les autres» explicite naturellement le groupe de comparaison sans en préciser l’identité.
- source_word: αἴτιος
  choice: responsable
  rationale: Le terme désigne celui qui est à l’origine d’un acte ou qui en porte la responsabilité, sans imposer ici une formulation juridique.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: de la vente de Joseph
  rationale: πρᾶσις signifie ici «vente»; le génitif Ἰωσήφ désigne naturellement la personne vendue.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’intensité du deuil, la comparaison avec tous les autres et l’aveu direct de responsabilité.
