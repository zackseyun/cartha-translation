source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἦν δὲ ὁ πατήρ μου ἐρωτῶν¹ ⌈περὶ ἐμοῦ⌉² *ὅτι ἑώρακέ με σκυθρωπόν³, καὶ⁴ ἔλεγον αὐτῷ⁵ *ὅτι τὰ ἤπατά μου ὀγκοῦμαι⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: fr
  text: 'Mon père continuait à s’enquérir de mon état, parce qu’il m’avait vu abattu, et je lui disais : « J’ai le foie enflé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν … ἐρωτῶν
  choice: continuait à s’enquérir
  rationale: La construction périphrastique à l’imparfait exprime une démarche prolongée ou répétée; cette formulation reste naturelle en français.
- source_word: περὶ ἐμοῦ
  choice: de mon état
  rationale: Dans ce contexte, le père cherche à savoir ce qui arrive à Siméon; « de mon état » rend idiomatiquement le grec sans ajouter de diagnostic.
- source_word: σκυθρωπόν
  choice: abattu
  rationale: Le terme décrit une apparence sombre, renfrognée ou accablée; « abattu » convient au contexte émotionnel et demeure accessible.
- source_word: ἔλεγον αὐτῷ
  choice: je lui disais
  rationale: L’imparfait grec est conservé, sans le transformer en simple passé ponctuel.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: J’ai le foie enflé
  rationale: Cette tournure française naturelle restitue l’affection corporelle exprimée en grec, où le foie est présenté comme gonflé.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les imparfaits préservent l’aspect duratif du récit grec; la déclaration sur le foie est rendue directement, sans l’interpréter symboliquement ou médicalement.
