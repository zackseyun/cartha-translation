base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: fr
  text: Mais Joseph était un homme bon et, ayant en lui l’Esprit de Dieu, plein de compassion et de miséricorde, il ne garda pas rancune contre moi, mais il nous aima, mes frères et moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  choice: un homme bon
  rationale: Rend directement l’expression grecque dans un français naturel et digne.
- source_word: ἔχων πνεῦμα θεοῦ ἐν αὐτῷ
  choice: ayant en lui l’Esprit de Dieu
  rationale: Préserve la construction participiale et évite d’ajouter une relation causale que le grec n’explicite pas.
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: plein de compassion et de miséricorde
  rationale: Exprime les deux qualités distinctes dans une tournure française fluide.
- source_word: οὐκ ἐμνησικάκησέν με
  choice: il ne garda pas rancune contre moi
  rationale: Rend l’idée de conserver le souvenir d’un tort en vue d’en vouloir à quelqu’un.
- source_word: ἠγάπησέ με σὺν τοῖς ἀδελφοῖς μου
  choice: il m’aima comme mes frères
  rationale: Le groupe σύν avec le datif associe Siméon à ses frères comme objets de l’amour de Joseph; cette formulation évite l’ambiguïté française selon laquelle Joseph aurait aimé Siméon en compagnie des frères.
theological_decisions:
- issue: Rapport entre la présence de l’Esprit de Dieu et les qualités de Joseph
  choice: Conserver la coordination participiale sans causalité explicite
  alternative: « parce que l’Esprit de Dieu était en lui »
  rationale: Le texte grec dit littéralement que Joseph avait l’Esprit de Dieu en lui, mais ne marque pas explicitement une relation causale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement descriptif du grec tout en évitant une syntaxe trop lourde.
