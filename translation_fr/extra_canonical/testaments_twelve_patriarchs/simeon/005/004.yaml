base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: fr
  text: Car j’ai vu dans l’écrit d’Hénoch que vos fils seront corrompus dans l’immoralité sexuelle et qu’ils feront du tort aux fils de Lévi par l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: dans l’écrit d’Hénoch
  rationale: Cette formulation naturelle rend l’idée d’un témoignage écrit attribué à Hénoch sans surcharger le français par une traduction trop littérale de χαρακτήρ.
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: se corrompront dans l’immoralité sexuelle
  rationale: Le réfléchi rend la forme passive grecque de manière idiomatique, tandis que « dans » conserve la relation volontairement large exprimée par ἐν plutôt que d’imposer explicitement une cause.
- source_word: ἀδικήσουσιν
  choice: feront du tort
  rationale: 'Expression française courante qui conserve la portée générale du verbe : agir injustement envers quelqu’un, lui faire du mal ou lui causer un tort.'
- source_word: ἐν ῥομφαίᾳ
  choice: par l’épée
  rationale: Rend naturellement le moyen violent indiqué par ἐν avec le datif; « épée » convient au sens contextuel de ῥομφαία.
theological_decisions:
- issue: Nature de la corruption liée à πορνεία
  choice: « se corrompront dans l’immoralité sexuelle »
  alternative: « seront corrompus par l’immoralité sexuelle »
  rationale: Le choix retenu préserve la relative ambiguïté de ἐν πορνείᾳ et évite de préciser si l’immoralité sexuelle est strictement la cause, le domaine ou le contexte de leur corruption.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le ton prophétique et la coordination simple du grec, sans archaïsmes ni explicitation confessionnelle.
