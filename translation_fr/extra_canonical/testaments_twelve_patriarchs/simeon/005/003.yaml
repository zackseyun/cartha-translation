source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Φυλάξασθε οὖν¹⁶ *ἀπὸ τῆς πορνείας¹⁷, ὅτι *ἡ πορνεία¹⁸ μήτηρ¹⁹ ἐστὶ²⁰ τῶν κακῶν, χωρίζουσα²¹ *ἀπὸ τοῦ²² θεοῦ καὶ προσεγγίζουσα²³ τῷ Βελίαρ²⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: fr
  text: 'Gardez-vous donc de l’immoralité sexuelle, car l’immoralité sexuelle est la mère des maux : elle sépare de Dieu et rapproche de Béliar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Gardez-vous
  rationale: L’impératif aoriste moyen exprime une mise en garde directe et personnelle ; « Gardez-vous » est naturel, digne et conserve cette force.
- source_word: πορνεία
  choice: immoralité sexuelle
  rationale: Le terme désigne largement les conduites sexuelles illicites ; cette formulation moderne évite de le limiter à la prostitution ou à l’adultère.
- source_word: μήτηρ τῶν κακῶν
  choice: la mère des maux
  rationale: La métaphore grecque est conservée directement, avec le pluriel général « des maux ».
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: elle sépare de Dieu
  rationale: Le participe féminin se rapporte à « l’immoralité sexuelle » ; une proposition indépendante explicite ce rapport sans ajouter d’objet absent du grec.
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: rapproche de Béliar
  rationale: Le verbe indique le fait de faire approcher ou de mettre en proximité avec Béliar ; la construction française garde l’objet implicite comme dans le grec.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération traditionnelle de la forme grecque Βελίαρ, distincte de la variante « Bélial ».
theological_decisions:
- issue: Objet implicite des participes « séparant » et « rapprochant »
  choice: Ne pas préciser qui est séparé de Dieu et rapproché de Béliar
  alternative: Ajouter « ceux qui s’y livrent » ou « elle vous sépare »
  rationale: Le grec omet l’objet. La traduction préserve cette concision et évite d’introduire une interprétation non exprimée.
- issue: Désignation de Béliar
  choice: Conserver le nom propre « Béliar »
  alternative: Traduire ou identifier par « le diable » ou « Satan »
  rationale: Le texte emploie un nom propre ; l’identifier explicitement résoudrait une question que le verset laisse implicite.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « l’immoralité sexuelle » est maintenue afin de reproduire l’insistance du grec. Les deux participes sont rendus par une proposition après deux-points pour une lecture naturelle, sans modifier leur portée.
