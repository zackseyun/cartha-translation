  naturalness: Le français est moderne, clair et d’un registre convenant à une exhortation morale ancienne. La reprise de « l’immoralité sexuelle » est un peu lourde stylistiquement, mais elle est justifiée par la répétition du grec et par l’objectif d’équivalence optimale. La coordination « elle sépare de Dieu et rapproche de Béliar » est intelligible et conserve l’ellipse de l’objet.
