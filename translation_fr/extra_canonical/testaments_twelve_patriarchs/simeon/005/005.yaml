  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: fr
  text: Mais ils ne pourront pas tenir tête à Lévi, car il mènera la guerre du Seigneur et vaincra votre camp tout entier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « tout entier » est entouré de signes critiques dans l’édition grecque utilisée ; sa présence dans le texte est donc incertaine.
    reason: Signaler l’incertitude textuelle de πᾶσαν sans trancher la question ni modifier le sens du texte édité.
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: tenir tête à
  rationale: Rend naturellement l’idée de résister ou de s’opposer avec succès, dans un contexte d’affrontement.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: il mènera la guerre du Seigneur
  rationale: Reproduit l’expression emphatique grecque « combattre une guerre » par l’idiome français courant « mener la guerre », tout en conservant le génitif « du Seigneur » sans en préciser davantage la relation.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Le terme désigne couramment un camp militaire; ce choix conserve l’image concrète plutôt que de l’interpréter comme « armée ».
- source_word: πᾶσαν
  choice: tout
  rationale: Conserve la portée totale du texte grec édité, malgré les signes critiques entourant le mot.
theological_decisions:
- issue: Rapport entre le Seigneur et la guerre
  choice: la guerre du Seigneur
  alternative: une guerre pour le Seigneur
  rationale: 'Le génitif grec Κυρίου reste ambigu: il peut indiquer l’appartenance, l’origine ou la cause. La formulation retenue préserve cette tension sans imposer une interprétation.'
- issue: Référent du pluriel « ils »
  choice: ils
  alternative: expliciter le groupe visé
  rationale: Le verset fourni ne nomme pas ici les personnes concernées; conserver le pronom évite d’ajouter un référent absent du texte.
translation_notes:
  register: Français international moderne, digne et lisible. « Tenir tête » est naturel sans être familier; « mener la guerre » restitue l’idiome martial, et « camp » maintient l’image du grec.
