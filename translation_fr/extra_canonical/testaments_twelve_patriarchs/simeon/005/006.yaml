  text: Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: fr
  text: Ils seront peu nombreux, répartis parmi Lévi et parmi Juda, et aucun d’entre vous n’exercera le commandement, comme notre père l’a lui aussi prophétisé dans les bénédictions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: peu nombreux
  rationale: Rend directement l’idée d’un groupe réduit en français naturel.
- source_word: ἐπιμεριζόμενοι
  choice: répartis
  rationale: Conserve l’idée d’une distribution ou d’un partage entre les groupes de Lévi et de Juda.
- source_word: εἰς ἡγεμονίαν
  choice: n’exercera le commandement
  rationale: Exprime naturellement la fonction de direction ou d’autorité visée par ἡγεμονία, sans préciser indûment sa forme politique.
- source_word: ἐν ταῖς εὐλογίαις
  choice: dans les bénédictions
  rationale: Respecte le pluriel et l’article du grec sans ajouter un possessif absent du texte.
theological_decisions:
- issue: Identité du « père » et nature des bénédictions
  choice: notre père… dans les bénédictions
  alternative: notre père Jacob… dans ses bénédictions
  rationale: Le texte grec ne nomme pas le père et n’emploie pas de possessif avec « bénédictions » ; la traduction évite donc d’expliciter ce qui demeure implicite.
- issue: Portée de ἡγεμονία
  choice: le commandement
  alternative: le pouvoir politique / la royauté
  rationale: Le terme désigne largement la direction ou l’autorité ; une référence précise à la royauté serait plus étroite que le grec.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « parmi » préserve la structure grecque et distingue nettement Lévi de Juda.
