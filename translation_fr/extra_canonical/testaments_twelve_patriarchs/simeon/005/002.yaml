  source_fidelity: 'Le sens central est fidèlement rendu : les impératifs portent sur les cœurs et les voies, et le double horizon « devant le Seigneur et les hommes » est conservé. Toutefois, καί introduit la conséquence finale par simple coordination ; « alors » explicite davantage le lien que ne le fait le grec.'
