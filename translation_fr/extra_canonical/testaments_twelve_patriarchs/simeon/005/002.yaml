base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: fr
  text: Et maintenant, mes enfants, rendez vos cœurs bons devant le Seigneur et rendez vos voies droites devant les hommes ; et vous trouverez grâce devant le Seigneur et les hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: rendez vos cœurs bons
  rationale: Reproduit directement le causatif « rendre bon » et conserve le cœur comme centre moral intérieur, sans réduire l’expression à « ayez de bonnes intentions ».
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: rendez vos voies droites
  rationale: Conserve l’image grecque des voies que l’on rend droites, avec sa portée éthique, dans une formulation française biblique mais intelligible.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rend uniformément l’idée d’agir ou d’être considéré en présence et au regard du Seigneur et des humains.
- source_word: ἀνθρώπων
  choice: les hommes
  rationale: Dans ce registre sapientiel, « les hommes » désigne collectivement les êtres humains et maintient le parallélisme traditionnel Seigneur/hommes.
- source_word: εὑρίσκοντες χάριν
  choice: vous trouverez grâce
  rationale: Expression française naturelle qui garde le sens de recevoir faveur ou bon accueil sans préciser abusivement lequel.
theological_decisions:
- issue: Rapport entre la conduite humaine et la grâce trouvée
  choice: alors vous trouverez grâce
  alternative: et vous serez trouvés en grâce
  rationale: Le grec ἔσεσθε εὑρίσκοντες exprime naturellement le résultat futur « vous trouverez ». La traduction préserve l’enchaînement exhortation-résultat sans développer une doctrine du mérite.
- issue: Double horizon, divin et humain
  choice: devant le Seigneur et devant les hommes
  alternative: auprès du Seigneur et des humains
  rationale: Le parallélisme répété par ἐνώπιον est maintenu afin de préserver la tension entre rectitude devant Dieu et réputation ou faveur dans la société.
translation_notes:
  register: Français moderne, digne et légèrement biblique. Le parallélisme de l’original est conservé. « Cœurs », « voies », « devant » et « grâce » maintiennent les images et l’ambiguïté théologique du grec sans paraphrase confessionnelle.
