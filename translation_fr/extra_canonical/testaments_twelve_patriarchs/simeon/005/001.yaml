  naturalness: La phrase est claire et de registre approprié. La révision proposée emploie une formulation française biblique encore naturelle dans un français international moderne et conserve la concision sentencieuse de l’original.
  terminology: « Rien de mauvais n’habitait en lui », « le trouble de l’esprit » et « le visage révèle » transmettent adéquatement ἐνοίκησεν, ταραχή τοῦ πνεύματος et πρόσωπον δηλοῖ. Aucun terme théologique ne demande une normalisation doctrinale.
