source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Διὰ τοῦτο Ἰωσὴφ ἦν¹ ὡραῖος *τῷ εἴδει², καὶ καλὸς *τῇ ὄψει, ὅτι³ οὐκ ἐνοίκησεν⁴ *ἐν αὐτῷ⁵ οὐδὲν⁶ πονηρόν· ἐκ γὰρ⁷ τῆς ταραχῆς τοῦ πνεύματος τὸ πρόσωπον δηλοῖ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: fr
  text: C’est pourquoi Joseph était beau de taille et beau de visage, car rien de mauvais n’habitait en lui ; en effet, le visage révèle le trouble de l’esprit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει
  choice: avait une belle stature
  rationale: L’expression décrit la beauté quant à la forme ou à l’aspect physique ; « belle stature » la distingue naturellement en français de la beauté du visage mentionnée ensuite.
- source_word: καλὸς τῇ ὄψει
  choice: un beau visage
  rationale: Dans ce contexte, ὄψις renvoie à l’apparence visible, particulièrement au visage, comme le confirme la proposition finale avec πρόσωπον.
- source_word: ἐνοίκησεν ἐν αὐτῷ
  choice: n’habitait en lui
  rationale: Cette formulation conserve l’image forte du verbe grec « habiter en » sans l’aplanir en simple possession.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: le trouble de l’esprit
  rationale: « Trouble » rend la perturbation ou l’agitation exprimée par ταραχή, tandis que « esprit » préserve la portée assez large de πνεῦμα.
- source_word: τὸ πρόσωπον δηλοῖ
  choice: le visage révèle
  rationale: « Révèle » exprime clairement que le visage manifeste extérieurement l’état intérieur.
theological_decisions:
- issue: Rapport entre le mal intérieur et l’apparence extérieure
  choice: Conserver l’affirmation causale du texte sans l’atténuer
  alternative: Reformuler comme une simple corrélation psychologique
  rationale: Le grec emploie ὅτι et γάρ et présente explicitement la beauté de Joseph comme liée à l’absence de mal en lui, puis généralise que le visage manifeste le trouble de l’esprit.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde le parallélisme descriptif du grec, son imagerie de l’habitation intérieure et sa conclusion sentencieuse.
