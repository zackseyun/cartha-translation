base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: fr
  text: Les fils de Siméon pleurèrent leur père. Ils étaient en Égypte jusqu’au jour de leur départ[a], sous la conduite de Moïse[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au jour de leur exode » ou « de leur sortie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de Moïse », idiome biblique signifiant ici « par l’intermédiaire de Moïse » ou « sous sa conduite ».'
    reason: cultural_note
  - marker: c
    text: 'Dans la source, la ligne finale est immédiatement suivie du titre de l’œuvre suivante : « Testament de Lévi, troisième fils de Jacob et de Léa ». Ce titre ne fait pas partie de Siméon 9.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: pleurèrent
  rationale: L’aoriste de κλαίω exprime ici les pleurs suscités par la mort du père. « Pleurèrent » est naturel, digne et n’ajoute pas l’idée de rites funéraires officiels.
- source_word: υἱοὶ Συμεὼν
  choice: les fils de Siméon
  rationale: « Fils » conserve la précision généalogique du cadre patriarcal, là où « enfants » serait plus large.
- source_word: εἰς Αἴγυπτον
  choice: en Égypte
  rationale: 'Avec ἦσαν et la durée introduite par ἕως, εἰς a une valeur locale idiomatique : ils se trouvaient et demeurèrent en Égypte jusqu’à leur sortie.'
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: jusqu’au jour de leur départ
  rationale: ἐξόδου peut désigner un départ ou une sortie. « Départ » garde le nom commun et laisse l’allusion historique à l’Exode ressortir du contexte et de la mention de Moïse.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: sous la conduite de Moïse
  rationale: Littéralement « par la main de Moïse », cet idiome biblique indique ici l’intermédiaire ou la direction. La formulation française choisie en transmet naturellement le sens sans donner l’impression que Moïse les transportait physiquement de sa main.
theological_decisions:
- issue: Faut-il rendre ἐξόδου par le nom propre « Exode » ?
  choice: Le nom commun « départ » dans le texte principal
  alternative: « exode » ou « l’Exode »
  rationale: Le grec emploie le nom commun sans fonction explicite de titre. La référence à l’événement biblique reste perceptible grâce à la mention de Moïse, sans que la traduction tranche au-delà du texte.
- issue: Degré de littéralité pour ἐν χειρὶ Μωϋσῆ
  choice: « sous la conduite de Moïse »
  alternative: « par la main de Moïse » ou « par l’intermédiaire de Moïse »
  rationale: Le calque « par la main de » est moins transparent en français moderne. « Sous la conduite de » rend l’agence et la direction impliquées par l’idiome, tandis qu’une note conserve sa forme biblique littérale.
translation_notes:
  register: Français international actuel, sobre et digne. Le second « Et » grec n’est pas reproduit afin d’éviter une coordination pesante en français. « Ils restèrent » explicite naturellement la présence continue indiquée par ἦσαν avec la limite temporelle, tout en évitant le tour peu idiomatique « ils furent en Égypte ».
