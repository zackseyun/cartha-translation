base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: fr
  text: '**6**


    **1** Voici, je vous ai tout dit, afin que je sois dégagé de votre péché. **2** Mais si vous ôtez de vous la jalousie et toute dureté de cœur, mes os fleuriront comme une rose en Israël, et ma chair fleurira comme un lis en Jacob. Mon parfum sera comme le parfum du Liban. Des saints issus de moi se multiplieront pour les siècles des siècles, et leurs branches s’étendront au loin.


    **3** Alors la descendance de Canaan périra, et il ne restera aucun survivant chez Amalec. Tous les Cappadociens périront, et tous les Hittites seront exterminés. **4** Alors le pays de Cham disparaîtra, et tout peuple périra. Alors toute la terre cessera d’être agitée, et tout ce qui est sous le ciel cessera de connaître la guerre.


    **5** Alors un grand signe sera glorifié pour Israël.[a] **6** Alors tous les esprits d’égarement seront livrés pour être piétinés, et les êtres humains domineront les esprits mauvais. **7** Alors, moi aussi, je me relèverai dans la joie et je bénirai le Très-Haut pour ses merveilles, [car Dieu a pris un corps, a mangé avec les êtres humains et a sauvé les êtres humains].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette phrase est incertain. La version grecque fournie porte littéralement : « Alors un signe sera glorifié, grand pour Israël. »'
    reason: Le signe critique † placé devant σημεῖον dans l’édition indique une difficulté ou une corruption textuelle; la note avertit le lecteur sans reconstruire un texte non attesté dans l’extrait.
  - marker: b
    text: L’édition place toute cette proposition entre crochets, ce qui signale que son appartenance au texte est incertaine.
    reason: Préserver visiblement le statut textuel particulier de la clause finale, marqué dans la source grecque.
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: que je sois dégagé de votre péché
  rationale: Le passif de δικαιόω avec ἀπό exprime ici le fait d’être déclaré quitte ou dégagé de la responsabilité liée au péché des destinataires. Cette formulation conserve la dimension judiciaire sans suggérer que Siméon serait moralement justifié par leur péché.
- source_word: φθόνον
  choice: la jalousie
  rationale: Dans ce testament, le terme désigne l’envie jalouse qui anime l’hostilité de Siméon; « jalousie » est naturel en français courant tout en restant proche du champ sémantique grec.
- source_word: σκληροκαρδίαν
  choice: dureté de cœur
  rationale: Calque biblique intelligible et digne, qui préserve l’image anthropologique du grec.
- source_word: ἅγιοι
  choice: des saints
  rationale: Le substantif pluriel signifie littéralement « saints » ou « personnes saintes ». La traduction ne précise pas davantage leur identité, que le passage laisse ouverte.
- source_word: σπέρμα Χαναάν
  choice: la descendance de Canaan
  rationale: Dans ce contexte généalogique, σπέρμα désigne la postérité; « descendance » évite l’étrangeté de « semence » sans perdre le sens.
- source_word: ἐκλείψει
  choice: disparaîtra
  rationale: Le verbe peut signifier cesser, faire défaut ou disparaître. « Disparaîtra » convient à la terre/pays de Cham sans imposer un mécanisme précis.
- source_word: πνεύματα τῆς πλάνης
  choice: esprits d’égarement
  rationale: πλάνη peut désigner l’erreur, la tromperie ou l’égarement. « Égarement » conserve l’ambivalence entre action trompeuse et état d’erreur.
- source_word: ἀναστησόμαι
  choice: je me relèverai
  rationale: Le verbe peut évoquer simplement le fait de se lever ou la résurrection. « Me relèverai » garde cette tension sans l’expliciter doctrinalement.
- source_word: συνεσθίων ἀνθρώποις
  choice: a mangé avec les êtres humains
  rationale: Rend directement l’idée de partager un repas avec des humains, sans ajouter de référence narrative absente du texte.
theological_decisions:
- issue: Identité des « saints » issus de Siméon
  choice: Maintenir le terme non explicité « des saints issus de moi »
  alternative: Les identifier à un groupe historique, ethnique ou eschatologique précis
  rationale: Le grec ne donne pas cette identification; la traduction conserve donc l’ouverture du texte.
- issue: Portée de ἀναστησόμαι en 6.7
  choice: « je me relèverai »
  alternative: « je ressusciterai »
  rationale: Le contexte eschatologique permet une lecture résurrectionnelle, mais le verbe n’oblige pas à lever son ambiguïté lexicale dans la traduction.
- issue: Clause finale sur Dieu prenant un corps
  choice: La traduire entre crochets avec une note textuelle
  alternative: L’intégrer sans signalement ou l’omettre entièrement
  rationale: La source grecque fournie la place explicitement entre crochets, signe d’un statut textuel distinct. La traduction la conserve sans en faire une harmonisation christologique ni en supprimer le contenu.
- issue: Développement christologique donné dans la consultation anglaise au verset 5
  choice: Ne pas ajouter « le Seigneur Dieu, apparaissant sur la terre… »
  alternative: Suivre le texte anglais de consultation
  rationale: Cette proposition ne figure pas dans le texte grec fourni au verset 5. La traduction suit en priorité l’attestation grecque transmise dans la demande.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les images poétiques et le parallélisme sont conservés. Le vocabulaire ethnique ancien est rendu sans actualisation. « Êtres humains » traduit ἄνθρωποι de manière générique; « saints » conserve le substantif religieux traditionnel sans ajouter d’identification confessionnelle.
