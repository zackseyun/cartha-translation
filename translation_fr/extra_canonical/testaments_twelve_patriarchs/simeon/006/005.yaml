  text: Alors, un grand signe sera glorifié pour Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Rend naturellement l’adverbe temporel qui introduit la suite des événements.
- source_word: σημεῖον … μέγα
  choice: un grand signe
  rationale: Reproduit le sens et la relation syntaxique du nom neutre et de son adjectif, malgré leur séparation dans le grec.
- source_word: ἐνδοξασθήσεται
  choice: sera glorifié
  rationale: Conserve la forme passive au futur et la formulation inhabituelle du grec, sans la remplacer par une interprétation plus explicite comme « apparaîtra dans la gloire ».
- source_word: τῷ Ἰσραήλ
  choice: pour Israël
  rationale: Rend le datif en maintenant sa portée bénéficiaire ou référentielle, sans trancher plus précisément que le texte source.
theological_decisions:
- issue: Identité et fonction du « grand signe »
  choice: Maintenir l’expression indéterminée « un grand signe »
  alternative: Identifier le signe à une personne, à une manifestation divine ou à un événement précis
  rationale: Le fragment grec fourni n’explicite ni l’identité ni la fonction du signe; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « sera glorifié » demeure volontairement peu courante afin de préserver le passif et l’ambiguïté du texte grec.
