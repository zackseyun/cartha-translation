review_pass:
  verdict: revise
  source_fidelity: 'Le sens général et les images sont bien conservés. Deux ajustements améliorent la précision : φθόνος est plus directement « envie » que « jalousie » dans ce contexte, et ἕως αἰῶνας αἰώνων exprime une borne (« jusqu’aux siècles des siècles »), non simplement une durée rendue par « pour ».'
  naturalness: La formulation est globalement naturelle, poétique et digne en français moderne. « Ôter de vous » est compréhensible mais moins idiomatique que « vous débarrassez de ».
  terminology: « Dureté de cœur », « lis », « parfum », « Liban », « saints » et « branches » rendent adéquatement le grec sans imposer d’interprétation doctrinale ou botanique indue.
  issues:
  - severity: medium
    issue: φθόνον traduit par « jalousie »
    rationale: φθόνος désigne principalement l’envie, souvent hostile ou jalouse. « Envie » est l’équivalent français le plus direct et évite l’ambiguïté de « jalousie », qui peut évoquer la possessivité.
  - severity: medium
    issue: ἕως αἰῶνας αἰώνων traduit par « pour les siècles des siècles »
    rationale: ἕως signifie littéralement « jusqu’à/jusque ». « Jusqu’aux siècles des siècles » conserve la valeur de borne temporelle du texte sans en modifier la portée solennelle.
  - severity: low
    issue: « ôtez de vous »
    rationale: Cette tournure est possible, mais « vous vous débarrassez de » est plus idiomatique en français international moderne tout en gardant l’idée d’écarter ou de retirer de soi.
  revised_text: Mais si vous vous débarrassez de l’envie et de toute dureté de cœur, mes os fleuriront comme une rose en Israël, et ma chair comme un lis en Jacob. Mon parfum sera comme le parfum du Liban. Des saints issus de moi se multiplieront jusqu’aux siècles des siècles, et leurs branches s’étendront au loin.
